  - rule_id: allocation_hierarchy
    applies_to: "shared manufacturing"
    rule: "First investigate subdivision or system expansion. If neither applies, use a quantified underlying physical relationship. Document the decision and attribution evidence."
    source_ids:
      - eu-environmental-footprint-2021-allocation
  - rule_id: allocation_meters
    applies_to: "electricity and shared equipment"
    rule: "Prefer operation/job submetering. Where a meter covers multiple jobs, retain measured operating time and load evidence for the allocation and reconcile the attributed total to the meter. Machine count alone requires evidence of comparable activity."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "rejects and rework"
    rule: "Attribute rejected-machine and rework burdens to accepted output of the same production period; exclude rejected machines from the accepted-count denominator. Internal recirculation is not another purchased input."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "production metal scrap"
    rule: "Record scrap mass, composition and destination. Keep treatment or recycling assumptions explicit and consistent with the receiving model; do not add an undocumented avoided-primary-metal credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "reference product"
      record_type: "weighing record"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "Each accepted machine or traceable identical configuration batch"
      temporal_coverage: "Same manufacture-and-acceptance cycle"
      site_scope: "Final acceptance site"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "Calibration certificate; weighing ticket; configuration bill; acceptance signature"
    - protocol_id: cp_components
      process_id: "assembly_hydraulic_rolling_drawing"
      flow_role: "installed component"
      record_type: "bill of materials and stores issues"
      raw_fields: "component identity; supplier; supplied state; quantity; net mass; model; serial/batch; rejects; returns"
      collection_method: "Reconcile purchases, job issues, installed bill and returns. Obtain traceable component weights; disaggregate any uncharacterized purchase bundle."
      unit: "kg"
      frequency: "Each job, with period reconciliation"
      temporal_coverage: "Same completed-machine cohort"
      site_scope: "Manufacturing and named suppliers"
      aggregation_rule: "attributable component mass / accepted machines"
      quality_evidence: "Supplier specification; weighing records; signed bill; upstream dataset mapping"
    - protocol_id: cp_energy
      process_id: "assembly_acceptance"
      flow_role: "electricity"
      record_type: "metering and activity records"
      raw_fields: "meter id; start/end readings; timestamps; operation; job; idle period; allocation driver; accepted count"
      collection_method: "Read calibrated meters around production/test runs; reconcile allocated shared loads with site totals."
      unit: "kWh"
      frequency: "Each run or production shift"
      temporal_coverage: "Complete manufacture/acceptance period including rework"
      site_scope: "Manufacturing site and allocated supporting equipment"
      aggregation_rule: "attributable electricity / accepted machines"
      quality_evidence: "Meter calibration; logs; invoices; allocation reconciliation"
    - protocol_id: cp_consumables
      process_id: "hydraulic_acceptance"
      flow_role: "oil and test stock"
      record_type: "stores and test records"
      raw_fields: "specific material identity; issue; return; retained charge; consumed amount; test job; accepted count"
      collection_method: "Measure issues and returns; distinguish retained oil from drained oil and test-stock losses."
      unit: "kg"
      frequency: "Each fill or test campaign"
      temporal_coverage: "Same manufacture-and-acceptance cycle"
      site_scope: "Manufacturing site"
      aggregation_rule: "attributable net material use / accepted machines"
      quality_evidence: "Weighing records; issue slips; test records; safety data sheets"
    - protocol_id: cp_waste
      process_id: "acceptance"
      flow_role: "separately identified waste"
      record_type: "waste transfer and weighing record"
      raw_fields: "waste identity; composition; contamination; mass; destination; recovery/treatment; batch; accepted count"
      collection_method: "Weigh segregated waste and reconcile disposal records to production jobs; identify losses and internal recirculation separately."
      unit: "kg"
      frequency: "Each collection, reconciled by period"
      temporal_coverage: "Same completed-machine cohort"
      site_scope: "Manufacturing site to first receiving facility"
      aggregation_rule: "attributable waste mass / accepted machines"
      quality_evidence: "Weighbridge ticket; carrier/treatment record; composition evidence"
    - protocol_id: cp_packaging
      process_id: "dispatch"
      flow_role: "individual packaging material"
      record_type: "packing specification and weighing"
      raw_fields: "material identity; net mass; package count; reused package cycles; supplied machine"
      collection_method: "Weigh each actual packaging material; record returned/reused packaging and reconcile to dispatch records."
      unit: "kg"
      frequency: "Each packing specification and dispatch batch"
      temporal_coverage: "Same accepted-machine cohort"
      site_scope: "Dispatch site"
      aggregation_rule: "attributable packaging mass / accepted machines"
      quality_evidence: "Packing bill; scales; dispatch record"
  calculation_rules:
    - id: production_attribution
      applies_to: "all inventory rows"
      rule: "Sum the exchange attributable to the completed cohort, including rejected trials and rework, and divide by the accepted machine count of the same configuration. Retain the numerator, denominator and allocation evidence."
      inputs:
        - "Raw collection records"
        - "accepted count"
        - "allocation evidence"
      output: "Exchange amount per one accepted finished machine"
      source_ids: []
    - id: configuration_balance
      applies_to: "installed component rows"
      rule: "Reconcile installed components and retained fluid mass to measured accepted net machine mass; investigate missing components, gross/net confusion or mismatched configuration. Packaging and separately consumed test stock do not form installed mass."
      inputs:
        - cp_components
        - cp_consumables
        - cp_mass
      output: "Documented reconciliation and explained discrepancy"
      source_ids: []
  data_quality_requirements:
    - id: quality_configuration
      applies_to: "all quantities"
      requirement: "Use one declared accepted configuration and production cohort; disclose changes in supplier state, drive technology and test protocol."
      evidence: "Bill of materials, serial/batch records, acceptance log"
    - id: quality_completeness
      applies_to: "boundary"
      requirement: "Reconcile procurement, installed components, energy, retained charges and waste; investigate unexplained omissions before dataset release."
      evidence: "Collection reconciliation and supplier coverage register"
    - id: quality_temporal
      applies_to: "foreground"
      requirement: "State dates and coverage of production runs, rework, test failures and dispatch. Different periods require an explained alignment."
      evidence: "Dated raw records and accepted output register"
    - id: quality_estimates
      applies_to: "unavailable measurements"
      requirement: "Distinguish measured, calculated and estimated quantities. Provide estimate method, uncertainty and replacement plan; a missing value is not zero."
      evidence: "Data-quality report"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Check actual working mechanism and exclusions, required qualifiers and accepted configuration."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_mass
    applies_to: "reference and inventory"
    rule: "M must be positive, measured net machine mass for the same accepted configuration; every inventory amount must use the same per-machine basis."
    source_ids: []
  - rule_id: validate_exchange
    applies_to: "all inventory rows"
    rule: "Each row represents one identified exchange with a compatible property/unit, collection protocol and route condition. Unresolved UUIDs remain explicit; no proxy is silently treated as an exact identity."
    source_ids: []
  - rule_id: validate_supply
    applies_to: "upstream links"
    rule: "Ensure raw material and purchased-component production are not both charged for the same physical component. Verify make-or-buy and transport boundaries."
    source_ids: []
  - rule_id: validate_tests
    applies_to: "acceptance"
    rule: "Reconcile test records, failures, retained oil, drained oil and test stock. Customer operation must not be counted as acceptance."
    source_ids: []
  - rule_id: validate_evidence
    applies_to: "quantitative claims"
    rule: "Use actual foreground amounts. Do not substitute manufacturer installed power for measured energy or use model catalog weights as an industry range."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "background_dataset for the production burden of the declared machine configuration"
  allowed_use: "Machine procurement or capital-equipment modelling when function, capacity, supplied state and system boundary match"
  excluded_use: "Lifetime service comparisons without equivalent performance and use scenarios; material-removal equipment; differently classified presses; tools or processing services"
  required_metadata: "Product and configuration; net mass; reference basis; site and dates; supplied tooling/auxiliaries; make-or-buy map; supplier geography/technology; acceptance protocol; allocations; transport and waste routes"
  required_quality_disclosure: "Measurement coverage; unresolved identities; upstream proxies; missing supplier data; estimates and uncertainty; exclusions; reconciliation results"
  update_trigger: "Changed machine architecture, material/component specification, supplier state, production site, drive, acceptance protocol or materially improved evidence"
