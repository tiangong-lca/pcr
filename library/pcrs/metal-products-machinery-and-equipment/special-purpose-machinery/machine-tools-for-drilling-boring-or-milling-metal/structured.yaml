product_category_identity:
  canonical_pcr_id: "pcr.metal-products-machinery-and-equipment.special-purpose-machinery.machine-tools-for-drilling-boring-or-milling-metal"
  classification_refs: "CPC 3.0: 44214 (un-cpc-3-0-structure-2025)"
  covered_products: "New complete drilling, boring and milling machines for metal; declared manual/CNC configuration."
  excluded_products: "Machining centres and transfer machines; lathes; threading-only and finishing machines; parts; handheld tools; machining services."
  representative_product: "One specified model/configuration; no representative machine weight is assumed."
  production_route: "Integration of finished purchased modules, alignment, electrical/no-load acceptance, applicable cutting verification, packing."
  market_state: "Complete accepted new machine at manufacturing gate, with packaging separately inventoried."
functional_unit:
  what: "One complete machine of the declared model and configuration."
  how_much: "M kg per one accepted finished machine."
  how_well: "Meets its documented acceptance specification: geometry, spindle function, axis travel, safety-control tests and any required cutting result. Record capacity and accuracy; equal mass is not equal performance."
  how_long_or_cycle: "One factory production and acceptance cycle; no assumed operating life or customer duty cycle."
  reference_flow_link: "finished_machine"
system_boundary:
  rules:
    - rule_id: sb_upstream
      applies_to: "Module supply"
      rule: "Cradle-to-gate results must include all module and consumable upstream production, inbound transport and contracted finishing. Purchased-module integration is not a gate-to-gate substitute for complete production."
      source_ids: []
    - rule_id: sb_foreground
      applies_to: "assembly"
      rule: "Include actual assembly, alignment, first lubrication, internal electric handling, test runs including failed/repeated runs, packing and attributed workshop overheads. Allocate shared electricity, never omit it because no dedicated meter exists."
      source_ids:
        - grizzly-g0704-2018
    - rule_id: sb_tests
      applies_to: "proof_cut; wet_proof_cut"
      rule: "Activate only the actually performed test branches. Declare coupon material, tool identity and dry/neat-oil state. An emulsion or carbide tool requires separately named inputs, waste and relevant emissions; do not substitute the listed identities."
      source_ids:
        - jrc-fabricated-metal-bemp-2020
    - rule_id: sb_fates
      applies_to: "Waste and emissions"
      rule: "Link each dispatched waste to its actual treatment. Account for oil carried on chips/cloth separately from drained oil. If mist, evaporation, leakage, aqueous discharge or onsite combustion actually occurs, quantify and add each identified exchange; never assume zero from absence of a preset card."
      source_ids:
        - jrc-fabricated-metal-bemp-2020
    - rule_id: sb_downstream
      applies_to: "Downstream stages"
      rule: "Exclude customer delivery, installation foundations, operation, maintenance and machine end of life from the factory-gate result. Report any separate life-cycle extension with its own scenarios, never blend it into production."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Finished, machined/coated structural unit; complete worktable/feed module; powered spindle head; wired control unit ready for integration."
  starting_condition_role: "Explicit module-level interface for foreground collection, not a raw-material exclusion."
  product_classification_scope: "Complete metal drilling/boring/milling machine, not a collection of parts or a machining service."
  recursive_input_rule: "Expand each purchased assembly in its own upstream dataset until supply-chain coverage is complete; do not also enter its embedded materials in this foreground inventory."
  upstream_dataset_requirement: "Supplier/configuration-matched mass and technology; component fabrication, electronics, coating and transport explicitly covered. Missing supplier detail is a disclosed data-quality gap requiring a justified background model, not zero burden."
  disclosure: "Publish module boundary/BOM, outsourced operations, transport legs, exclusions with justification and changes needed for in-house fabrication or alternative test routes."
