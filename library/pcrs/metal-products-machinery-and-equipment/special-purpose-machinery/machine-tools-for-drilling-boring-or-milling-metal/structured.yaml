allocation_rules:
  - rule_id: al_subdivide
    applies_to: "Shared production"
    rule: "First subdivide by model/configuration and meter dedicated assembly/test operations. For shared metered energy use recorded productive and idle hours with measured load profiles; mass is not the default allocation driver for electrical testing. Publish numerator, denominator and excluded downtime."
    source_ids: []
  - rule_id: al_rework
    applies_to: "Rejects and rework"
    rule: "Include failed tests, rework and final rejection losses in the numerator of the cohort that produces accepted machines. Normalize by accepted output only; an unfinished or rejected machine is not an accepted reference output. Track returned components and stock movement without negative double credits."
    source_ids: []
  - rule_id: al_recycling
    applies_to: "Recoverable residues"
    rule: "No automatic avoided-virgin-metal credit. Document waste/end-of-waste status and actual downstream treatment. Use one stated allocation convention consistently across supplier datasets; do not count internal recirculation as a co-product."
    source_ids:
      - jrc-fabricated-metal-bemp-2020
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "assembly"
      flow_role: "finished_machine"
      record_type: "acceptance weighing"
      raw_fields: "model; configuration; serial number; accepted net mass M; scale id; calibration; retained fill; acceptance result"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each configuration and production cohort"
      temporal_coverage: "same declared production period"
      site_scope: "declared factory and configuration"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "calibration; signed ledger; acceptance/BOM/transfer reconciliation"
    - protocol_id: cp_bom
      process_id: "assembly"
      flow_role: "structure; table_feed; spindle_head; control_unit; steel_bolt"
      record_type: "BOM and stock ledger"
      raw_fields: "supplier; part id; module inclusions; grade; received mass; installed mass; returns; rework; N"
      collection_method: "Weigh or use audited supplier mass BOM; reconcile stock issues, unchanged returns and installation records, including attributable rejects. Trace each module to a complete upstream dataset."
      unit: "kg"
      frequency: "each received batch and accepted cohort"
      temporal_coverage: "same declared production period"
      site_scope: "declared factory and configuration"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "calibration; signed ledger; acceptance/BOM/transfer reconciliation"
    - protocol_id: cp_consumables
      process_id: "assembly"
      flow_role: "way_oil; lithium_grease; cotton_wipe"
      record_type: "weighing and issue ledger"
      raw_fields: "product identity; formulation; fresh issues; unused returns; inventory change; retained fill; absorbed mass; N"
      collection_method: "Weigh containers before/after use, reconcile purchases and stock and distinguish retained lubricant from wiped-off oil. Record actual cloth reuse."
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "same declared production period"
      site_scope: "declared factory and configuration"
