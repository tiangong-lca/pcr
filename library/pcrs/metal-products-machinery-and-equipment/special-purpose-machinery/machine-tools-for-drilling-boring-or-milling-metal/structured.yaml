validation_rules:
  - rule_id: vr_identity
    applies_to: "Reference and boundary"
    rule: "Reject a data package without model, configuration, accepted count N, measured M and traceable acceptance evidence. Check classification exclusions before applying a machine UUID."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: vr_coverage
    applies_to: "BOM and process coverage"
    rule: "Require complete module boundary reconciliation and upstream datasets. Additional fluids, fasteners, packaging, rejected assemblies, waste and elementary releases must be recorded as specific exchanges when present. No umbrella or negative balancing exchanges."
    source_ids: []
  - rule_id: vr_units
    applies_to: "All rows"
    rule: "Check property/unit, collection protocol, common accepted-machine basis and all density conversions. Reconcile net machine mass, coupon metal, oil and electric meter allocation without double counting."
    source_ids: []
  - rule_id: vr_uuid
    applies_to: "Selected flows"
    rule: "An unresolved UUID remains a named exchange requiring verified matching before dataset linking; do not substitute a raw-material or geographically incompatible proxy. Do not treat unresolved as absent or zero."
    source_ids: []
  - rule_id: vr_tests
    applies_to: "proof_cut; wet_proof_cut"
    rule: "Record inclusion or absence against the acceptance plan, actual material and fluid identities, and all failed/repeated tests. Customer operating consumption must not enter factory production."
    source_ids:
      - grizzly-g0704-2018
published_dataset_profile:
  dataset_role: "Foreground production data package for one declared complete machine configuration."
  downstream_use: "Linked cradle-to-gate process and lifecyclemodel; reference flow definition."
  allowed_use: "Production assessment with complete upstream module coverage and measured site data."
  excluded_use: "Generic machine-service comparison; inferred lifetime performance; machining centres; incomplete gate-to-gate result labelled cradle-to-gate."
  required_metadata: "Reference qualifiers; BOM; module boundaries; N and M; year and geography; test branches; transport; grid; allocation; waste treatment."
  required_quality_disclosure: "Source applicability, unresolved UUIDs, foreground gaps, missing compatible ranges, stock/measurement uncertainty and any justified background proxies."
  update_trigger: "Configuration, supplier-module boundary, acceptance plan, fluid/tool identity, grid, allocation or waste-route change."
