  calculation_rules:
    - id: cr_normalize
      applies_to: "all inventory rows"
      rule: "q_i = Q_i / N. Q_i is the net measured exchange attributable to the cohort after documented allocation; N is the number of accepted machines of the same configuration. Reference output remains M kg per machine. N must be positive."
      inputs:
        - Q_i
        - N
      output: "kg or kWh per one accepted finished machine"
      source_ids: []
    - id: cr_mass_check
      applies_to: "finished_machine"
      rule: "Reconcile M with installed module/bolt mass plus retained fills. Packaging, wasted consumables, chips and coupons are excluded from M. Investigate differences against combined weighing/BOM uncertainty; do not force balance with invented material."
      inputs:
        - M
        - "installed masses"
        - "retained fills"
      output: "documented net-mass reconciliation"
      source_ids: []
    - id: cr_coupon
      applies_to: "proof_cut"
      rule: "Opening coupon stock + new coupon mass = closing reusable stock + dispatched remnants + chips + measured metal losses. Keep oil out of the dry-metal balance and include it in the oil balance."
      inputs:
        - coupon
        - "chip and stock records"
      output: "separate metal and fluid balances"
      source_ids:
        - jrc-fabricated-metal-bemp-2020
    - id: cr_perkg
      applies_to: "optional mass-normalized reporting"
      rule: "For an additional 1 kg presentation only, divide each per-machine exchange by the measured M of that same configuration. Preserve the original per-machine result and capability; never combine different M values without cohort weighting."
      inputs:
        - q_i
        - M
      output: "supplementary exchange per kg of machine"
      source_ids: []
