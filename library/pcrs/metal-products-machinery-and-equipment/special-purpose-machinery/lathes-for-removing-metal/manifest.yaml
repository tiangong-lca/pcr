      - row_id: spent_machining_emulsion
        reason_code: no_exact_candidate
        explanation: "The task-bound candidate audit returned generic spent coolant, waste oils and a combined oil-and-coolant category; none establishes the specified spent aqueous machining emulsion."
      - row_id: grey_iron_casting
        reason_code: no_exact_candidate
        explanation: "The finalized task-bound audit returned pig-iron feedstocks rather than shaped grey-iron castings; no exact public casting flow was established."
      - row_id: low_alloy_steel_bar
        reason_code: no_exact_candidate
        explanation: "The finalized task-bound audit returned construction rebar, non-alloy or differently processed bars and broad hot-rolled products, not the specified hot-rolled low-alloy machining bar."
      - row_id: tapered_roller_bearing
        reason_code: no_exact_candidate
        explanation: "The finalized task-bound audit returned a broad ball-or-roller-bearing family and a wind-turbine pitch bearing; neither establishes the specified tapered roller bearing."
      - row_id: insulated_copper_cable
        reason_code: no_exact_candidate
        explanation: "The finalized task-bound audit found a copper control-and-power cable with an incompatible energy property, length-based voltage-specific cables and mismatched conductor or coaxial products; no exact mass-based insulated copper cable was established."
      - row_id: water_soluble_metalworking_fluid_concentrate
        reason_code: no_exact_candidate
        explanation: "A task-bound finalized search rejected returned ore-concentrate candidates; no exact public product flow for the specified metalworking-fluid concentrate was established."
      - row_id: finished_lathe
        reason_code: no_exact_candidate
        explanation: "A task-bound finalized search rejected the closest machine-tool, parts and neighbouring-CPC candidates; no exact public product flow for a complete accepted metal-removing lathe was established."
    range_evidence_needs:
