allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Shared manufacturing operations"
    rule: "Avoid allocation by subdividing records to the manufacturing order where technically feasible."
    source_ids: []
  - rule_id: allocation_physical_driver
    applies_to: "Unavoidable shared electricity or fluid use"
    rule: "Where subdivision is not feasible, allocate using a documented physical metered driver and disclose the driver and period."
    source_ids: []
  - rule_id: allocation_production_cohort
    applies_to: "Failed tests, rework and final rejects"
    rule: "Retain their input, energy and waste burdens in the same configuration's production-cohort numerator; normalize only by accepted finished-lathe count. Reconcile opening and closing work in progress and actual returns. Do not double-credit internally recovered or returned material."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "Metal swarf and recovered fluids"
    rule: "Treat outgoing wastes without an avoided-primary-production credit by default; disclose actual treatment destinations and recovery state. A proposed marketable co-product requires demonstrated product identity, auditable allocation and a separately reported sensitivity result."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "manufacture_and_acceptance"
      flow_role: "finished_lathe"
      record_type: "acceptance record and scale record"
      raw_fields: "model; configuration; serial number; accepted net mass M; acceptance date"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each machine"
      temporal_coverage: "acceptance date"
      site_scope: "declared manufacturing site"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "scale calibration and acceptance record"
    - protocol_id: cp_energy
      process_id: "manufacture_and_acceptance"
      flow_role: "alternating_current"
      record_type: "electricity meter or manufacturing-order ledger"
      raw_fields: "meter identifier; reading or kWh; conversion; order identifier; apportionment method; cohort configuration; accepted count; linked failed-test, rework and final-reject event identifiers"
      collection_method: "Read the dedicated meter or reconcile a documented order-level apportionment, retaining linked failed-test, rework and final-reject electricity in the same production cohort."
      unit: "MJ"
      frequency: "each machine or reporting period"
      temporal_coverage: "declared reporting period"
      site_scope: "declared manufacturing site"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "meter record and apportionment worksheet"
    - protocol_id: cp_mwf
      process_id: "aqueous_machining"
      flow_role: "water_soluble_metalworking_fluid_concentrate"
      record_type: "material issue record"
      raw_fields: "formulation; concentration; issued mass; order identifier"
      collection_method: "Reconcile concentrate issue records to the manufacturing order; include only where the route uses the concentrate."
      unit: "kg"
      frequency: "each machine or batch"
      temporal_coverage: "declared reporting period"
      site_scope: "declared manufacturing site"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "issue record and formulation record"
    - protocol_id: cp_bom
      process_id: "manufacture_and_acceptance"
      flow_role: "Individual materials and purchased components"
      record_type: "receiving, issue-return ledger and BOM"
      raw_fields: "order; configuration; part id; grade; form; count; measured unit mass; issues; returns; opening and closing work in progress; accepted count; linked failed-test, rework and final-reject event identifiers"
      collection_method: "Weigh each issued input and reconcile to the order BOM and linked test/rework/reject records; never duplicate a purchased assembly and its constituents"
      unit: "kg"
      frequency: "each machine or batch"
      temporal_coverage: "declared reporting period"
      site_scope: "declared manufacturing site"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "weighing record, calibration and order reconciliation"
    - protocol_id: cp_consumables
      process_id: "manufacture_and_acceptance"
      flow_role: "mineral_lubricating_oil"
      record_type: "lubricant ledger"
      raw_fields: "grade; order; issues; returns; retained fill; drained oil; density and temperature"
      collection_method: "Weigh actual lubricant issued and separately reconcile retained first fill and drained waste oil"
      unit: "kg"
      frequency: "each machine or batch"
      temporal_coverage: "declared reporting period"
      site_scope: "declared manufacturing site"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "weighing record, calibration and order reconciliation"
    - protocol_id: cp_aqueous
      process_id: "aqueous_machining"
      flow_role: "tap_water"
      record_type: "water meter and mixing log"
      raw_fields: "source; meter readings; order; concentrate mass; makeup water"
      collection_method: "Use submetering and actual density for recorded volumes; do not count internal recirculation twice"
      unit: "kg"
      frequency: "each machine or batch"
      temporal_coverage: "declared reporting period"
      site_scope: "declared manufacturing site"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "weighing record, calibration and order reconciliation"
    - protocol_id: cp_waste
      process_id: "manufacture_and_acceptance_aqueous_machining"
      flow_role: "Each waste separately"
      record_type: "waste weigh ticket and transfer manifest"
      raw_fields: "waste identity; source process; gross; tare; water content; entrained oil; batch; destination"
      collection_method: "Weigh each outgoing waste; apportion batch amounts using measured order-specific generation, not as elementary emissions"
      unit: "kg"
      frequency: "each machine or batch"
      temporal_coverage: "declared reporting period"
      site_scope: "declared manufacturing site"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "weighing record, calibration and order reconciliation"
    - protocol_id: cp_coating
      process_id: "powder_finishing"
      flow_role: "polyester_powder_coating"
      record_type: "coating issue and recovery ledger"
      raw_fields: "formulation; SDS; order; fresh powder; returns; retained coating; recovered and waste powder"
      collection_method: "Reconcile fresh powder to retained coating, recovery and loss; count internal recycling once"
      unit: "kg"
      frequency: "each machine or batch"
      temporal_coverage: "declared reporting period"
      site_scope: "declared manufacturing site"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "weighing record, calibration and order reconciliation"
    - protocol_id: cp_packaging
      process_id: "dispatch_packaging"
      flow_role: "corrugated_board"
      record_type: "packaging BOM"
      raw_fields: "order; dispatch count; net board mass; returns"
      collection_method: "Weigh board used for each dispatched machine and reconcile shipment records"
      unit: "kg"
      frequency: "each machine or batch"
      temporal_coverage: "declared reporting period"
      site_scope: "declared manufacturing site"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "weighing record, calibration and order reconciliation"
  calculation_rules:
    - id: reconcile_machine_order
      applies_to: "Collected foreground exchanges"
      rule: "Reconcile records to one accepted lathe of the same configuration; document any physical-driver allocation."
      inputs:
        - cp_mass
        - cp_energy
        - cp_mwf
      output: "Complete per-machine foreground inventory"
      source_ids: []
    - id: calculate_production_cohort
      applies_to: "Configuration-specific production cohort"
      rule: "Retain failed-test, rework and final-reject inputs, energy and wastes in each exchange's cohort numerator, reconciled for opening/closing work in progress and actual returns; divide only by the accepted finished-lathe count. Track internal recovery and returns once without an additional avoided-input credit. A cohort with no accepted lathe cannot yield a per-accepted-machine result."
      inputs:
        - cp_bom
        - cp_energy
        - cp_waste
        - "acceptance and test/rework/reject records"
      output: "per one accepted finished machine"
      source_ids: []
  data_quality_requirements:
    - id: dq_configuration
      applies_to: "Finished lathe and inputs"
      requirement: "Keep model, configuration and acceptance record consistent across all records."
      evidence: "manufacturing order and acceptance record"
    - id: dq_atomic_inputs
      applies_to: "Manufacturing inputs"
      requirement: "Add one atomic row for each actual purchased material, component, energy carrier, waste and elementary exchange; do not use umbrella categories."
      evidence: "bill of materials, issue records and waste manifests"
