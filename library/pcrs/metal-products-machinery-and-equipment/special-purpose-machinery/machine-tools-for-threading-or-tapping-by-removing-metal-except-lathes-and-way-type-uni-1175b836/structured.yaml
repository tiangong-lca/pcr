  - rule_id: validate_waste
    applies_to: "waste and emissions"
    rule: "Check waste type, mass state, receiver and treatment. Identify each directly released substance and compartment from actual process chemistry and monitoring. Do not map a mixed residue to an elementary substance or silently omit a release."
