system_boundary:
  rules:
    - rule_id: boundary_complete_route
      applies_to: "all processes"
      rule: "Retain the as-built bill of materials and routing. Every physical input, reject, transfer to treatment and direct release must be covered or explicitly justified as absent. Add concrete cards for actual exchanges outside the listed route examples; never use an other-materials or other-wastes row."
      source_ids: []
    - rule_id: boundary_upstream
      applies_to: "purchased inputs"
      rule: "Include extraction and production of purchased materials, components and packaging through linked upstream datasets. Include actual inbound transport using shipment mass, distance and mode records; a transport service must not replace the carried material. Do not also count materials contained inside a purchased subassembly."
      source_ids: []
    - rule_id: boundary_routes
      applies_to: "machining; finishing"
      rule: "Internal transfers remain linked by work order without duplicate external purchases. Foundry work, heat treatment, welding, solvent coating or chemical pretreatment performed on site must be expanded with their actual fuels, chemicals, emissions and wastes. Bought finished parts carry those operations upstream."
      source_ids:
        - jrc-metal-bemp-2020
        - epa-metal-coating-tsd
    - rule_id: boundary_treatment
      applies_to: "manufacturing wastes"
      rule: "Include transport and treatment burdens for manufacturing waste. A wastewater sent to treatment is a waste exchange; direct releases require individually identified substances and receiving compartments. Unknown releases are missing data, not zero."
      source_ids:
        - jrc-metal-bemp-2020
        - epa-metal-coating-tsd
    - rule_id: boundary_cutoff
      applies_to: "full package"
      rule: "No automatic mass-only cutoff applies to electrical assemblies, lubricants or hazardous releases. Record exclusions, estimated significance and sensitivity; unresolved significant omissions prevent release of the resulting dataset."
      source_ids: []
