allocation_rules:
  - rule_id: allocation_priority
    applies_to: "shared operations"
    rule: "First subdivide records by work order and meter. For unavoidable shared loads use measured machine-hours or another demonstrated physical driver; record numerator, denominator and reason. Mass allocation is not the default for electrically different machines."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rejects and rework"
    rule: "Attribute rework, failed acceptance tests and non-saleable rejects to accepted production of the same model/configuration. Do not divide by all started units as though each were accepted."
    source_ids: []
  - rule_id: allocation_recycling
    applies_to: "swarf and spent fluids"
    rule: "Internal recovery changes net fresh input and waste output. Do not add an avoided-virgin-material credit inside this manufacturing inventory. Any later recycling benefit calculation must disclose its method and prevent duplicate credits with the receiving dataset."
    source_ids:
      - jrc-metal-bemp-2020
  - rule_id: allocation_packaging
    applies_to: "reusable pallet"
    rule: "Allocate documented pallet production and refurbishment over evidenced actual uses; absent reuse evidence retain the full pallet burden for the dispatch."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "assembly"
      flow_role: "accepted reference product"
      record_type: "calibrated weighing and acceptance report"
      raw_fields: "model; configuration; serial number; accepted net mass M; initial fluid charge"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each machine or documented identical-configuration lot"
      temporal_coverage: "full manufacturing order"
      site_scope: "final assembly and acceptance"
      aggregation_rule: "M = accepted net mass of one complete machine of the same configuration"
      quality_evidence: "scale calibration; signed acceptance; as-built bill of materials"
    - protocol_id: cp_material
      process_id: "machining_finishing"
      flow_role: "each purchased material separately"
      record_type: "stores ledger and job card"
      raw_fields: "exact grade/formulation; opening and closing stock; receipts; issues; returns; work order"
      collection_method: "Weigh each named material separately; reconcile stock movement, returns and internal recovery with work-order issues. Net consumption attributable to one accepted finished machine; internal circulation is not a new input"
      unit: "kg"
      frequency: "each issue and stock reconciliation"
      temporal_coverage: "complete production period including rework"
      site_scope: "included manufacturing operations"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "purchase specification; SDS where applicable; weighing records; stock reconciliation"
    - protocol_id: cp_component
      process_id: "assembly"
      flow_role: "each purchased component separately"
      record_type: "as-built bill of materials and receiving inspection"
      raw_fields: "component model; purchased state; count; item mass; configuration; rejected items; cable length and mass per length"
      collection_method: "Weigh representative identical components or obtain traceable supplier net-mass records; verify counts against the as-built bill of materials; weigh cable offcuts. Component count times verified item mass; cable length times verified mass per length; allocate actual rejects to accepted machines"
      unit: "kg"
      frequency: "each configuration and purchasing lot"
      temporal_coverage: "full manufacturing order"
      site_scope: "assembly including upstream component links"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "supplier drawing; weighing record; lot identity; component dataset boundary"
    - protocol_id: cp_water
      process_id: "finishing"
      flow_role: "purchased tap water"
      record_type: "submeter and water balance"
      raw_fields: "meter start and end; volume; measured density if volume records used; recirculation; work order"
      collection_method: "Use a calibrated mass meter or convert recorded volume with documented density and temperature; distinguish fresh purchase from recirculation. Net purchased water attributable to one accepted finished machine"
      unit: "kg"
      frequency: "each batch or metered period"
      temporal_coverage: "complete washing operation"
      site_scope: "washing line"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "meter calibration; density evidence; supply and effluent reconciliation"
    - protocol_id: cp_waste
      process_id: "machining_finishing"
      flow_role: "each waste stream separately"
      record_type: "waste weighbridge and transfer manifest"
      raw_fields: "net wet mass; oil and moisture; waste composition; receiver; transport; treatment; work order"
      collection_method: "Weigh each segregated waste stream; reconcile to transfer manifests and measure retained liquid where relevant. Attributable net mass per one accepted finished machine; do not sum dry and wet masses as separate wastes"
      unit: "kg"
      frequency: "each removal batch"
      temporal_coverage: "manufacturing and related waste removal period"
      site_scope: "waste generation through first treatment"
      aggregation_rule: "per one accepted finished machine"
      quality_evidence: "weighbridge slips; waste analysis; licensed receiver records"
    - protocol_id: cp_packaging
      process_id: "assembly"
      flow_role: "each packaging item separately"
      record_type: "dispatch packing list"
      raw_fields: "pallet mass; film grade and mass; unused returns; reuse history"
      collection_method: "Weigh pallet and film separately; reconcile dispatched packaging with the machine serial number. Actual packaging attributable to one accepted finished machine, excluded from M"
      unit: "kg"
      frequency: "each dispatch"
      temporal_coverage: "dispatch of the accepted machine"
      site_scope: "factory dispatch"
