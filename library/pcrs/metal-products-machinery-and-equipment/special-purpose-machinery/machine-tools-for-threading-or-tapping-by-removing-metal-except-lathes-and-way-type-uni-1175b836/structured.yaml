      - jrc-metal-bemp-2020
      - epa-metal-coating-tsd
  - rule_id: validate_boundary
    applies_to: "purchased components"
    rule: "Prevent double-counting contained metals, bearings, wiring and finishing when an assembled component dataset is used. Verify upstream production and manufacturing-waste treatment coverage."
