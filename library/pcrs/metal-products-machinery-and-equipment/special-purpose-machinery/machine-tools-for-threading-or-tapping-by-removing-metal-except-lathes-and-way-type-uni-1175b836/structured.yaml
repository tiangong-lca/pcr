    applies_to: "all exchanges"
    rule: "Verify M through reference_mass and cp_mass and ensure every exchange uses the same accepted-machine basis. A mass-normalized comparative result requires an explicit subsequent conversion and does not establish functional equivalence between unlike machines."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "bill of materials and routing"
    rule: "Reconcile every significant purchased or manufactured component and actual consumable with concrete inventory exchanges. Cover cutting-tool wear, assembly lubrication, detergents, welding consumables, compressed-air supply, process fuels, offcuts and emissions where they occur. Absence must be evidenced; the listed cards alone do not certify completeness of a site dataset."
