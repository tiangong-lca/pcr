review_metadata:
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  semantic_boundary: "Complete abrasive-finishing and residual metal-removal machine tools at factory gate; excludes machining services, parts and neighbouring machine-tool families. Adjacent canonical identities inspected for material overlap; no material duplicate identified."
  source_scope: "Official CPC original rows establish classification identity. JRC original printed pages 190 and 226 support machining-fluid and segregated waste collection. EU PEF section 4.5 supports the allocation hierarchy only. No empirical per-machine range adopted."
  translation_review: "Professional title distinguishes grinding 磨削, honing 珩磨, lapping 研磨 and slotting 插削. Database-linked flow displays retain exact public Chinese baseName, including legacy terminology; title is an authored translation, not a UN official Chinese title."
  unresolved:
    inventory_flow_uuids:
      - row_id: "steel"
        reason_code: "no_exact_candidate"
        explanation: "Five public candidates were inspected: conflicting bilingual names, alloy-steel or sheet-piling classifications, and ambiguous metal collections do not establish non-alloy carbon-steel plate."
      - row_id: "coolant_fabrication"
        reason_code: "no_exact_candidate"
        explanation: "All four returned public candidates are mineral concentrates, not formulated water-soluble metalworking-fluid concentrate. No material proxy is substituted."
      - row_id: "abrasive_fabrication"
        reason_code: "no_exact_candidate"
        explanation: "All three returned public product candidates are alumina raw material, not manufactured bonded aluminium-oxide grinding wheels; none establishes the required finished-tool state."
      - row_id: "spent_coolant_fabrication"
        reason_code: "no_exact_candidate"
        explanation: "The sole returned public spent-coolant identity does not specify the aqueous metalworking-emulsion state. Its empty general comment does not resolve this material composition/state gap, so the row remains unlinked."
      - row_id: "spent_abrasive_fabrication"
        reason_code: "no_exact_candidate"
        explanation: "The three returned public waste identities are aluminium dross, aluminium slag and metal machining scrap; none identifies a spent bonded aluminium-oxide grinding wheel, and the scrap property is aluminium content rather than whole-waste mass."
      - row_id: "pm10_fabrication"
        reason_code: "no_exact_candidate"
        explanation: "The sole returned public elementary flow has unspecified particle size. It does not establish the required PM10 fraction and is not adopted as a proxy."
      - row_id: "bed"
        reason_code: "no_exact_candidate"
        explanation: "Public candidates are pig iron, generic cast iron, cast-iron ball or pipes; none establishes a finished grey-cast-iron machine-tool bed casting."
      - row_id: "cabinet"
        reason_code: "no_exact_candidate"
        explanation: "The equipped steel control-cabinet candidate has an incompatible calorific-value/MJ property; remaining candidates are components or differently scoped high-voltage equipment, not the required complete cabinet mass."
      - row_id: "spindle"
        reason_code: "no_exact_candidate"
        explanation: "Both returned public candidates are assembled complete machine tools, not separately purchased spindle assemblies."
      - row_id: "bearing"
