      rule: "The cards are a common physical-flow core. Reconcile every actual bill-of-materials item and operation. Add distinct atomic rows for omitted actuators, guides, ball screws, gears, wiring, guards, tool/work holders, hydraulic pumps/cylinders, filters, coolers, purchased heat, fuels, gases, coating chemicals and direct emissions whenever present. No residual catch-all row or silent exclusion is allowed."
