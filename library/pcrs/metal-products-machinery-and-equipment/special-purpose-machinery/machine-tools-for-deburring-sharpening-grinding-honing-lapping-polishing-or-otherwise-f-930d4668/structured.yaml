    - rule_id: boundary_production
      applies_to: "production_system"
      rule: "Include attributable receipt/handling, fabrication, purchased component supply, assembly, factory tests including failed tests and rework, packaging, internal transport and manufacturing-waste management. Link inbound transport and outsourced processing explicitly. Customer installation, use, maintenance and machine end-of-life are outside the declared factory-gate result."
