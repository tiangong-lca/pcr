    used_for: "Machining-fluid functions and form distinctions; separate swarf/oil recovery and waste collection. General metalworking applicability; no machine-production amount range adopted"
  - id: "eu-pef-methods-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, consolidated 30 December 2021; Annex I section 4.5, pp. 87-88; https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX%3A02021H2279-20211230 ; original verified 2026-09-22"
    used_for: "Multifunctionality decision hierarchy and justified allocation; cited selectively without claiming full PEF compliance"
