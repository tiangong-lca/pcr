allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "shared_processes"
    rule: "First investigate subdivision or system expansion. Prefer order-specific meters and material issues for the single-machine production dataset. Where subdivision is impossible and expansion would change the declared product function, allocate using a demonstrated causal physical relationship. Document why the preceding options cannot be used."
    source_ids:
      - eu-pef-methods-2021
  - rule_id: allocation_drivers
    applies_to: "shared_utilities"
    rule: "Use measured energy or measured power-by-time for shared machines and operating hours for causally time-dependent overhead. Use mass only for genuinely mass-dependent handling. A plant-wide equal-per-machine split across dissimilar machines is not an acceptable unexplained default."
    source_ids: []
  - rule_id: allocation_fallback
    applies_to: "coproducts"
    rule: "If no physical relationship can be demonstrated, justify another relationship, state prices/time/market scope if economic allocation is used, and test sensitivity. Scrap sales do not establish a substitution credit. Record treatment/recycling burdens and any credits separately under an explicitly selected consistent recycling model."
    source_ids:
      - eu-pef-methods-2021
  - rule_id: allocation_rework
    applies_to: "accepted_output"
    rule: "Attribute failed tests, rejects and rework to the accepted output of the same production cohort; reconcile the denominator and avoid counting recovered material both as avoided virgin input and as an exported credit."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "The PEF citation supports only the multifunctionality allocation hierarchy and justification of allocation relationships on PDF pp. 87–88. Submetering, the specific foreground allocation drivers, and sensitivity checks prescribed here are author-defined collection and quality controls, not directly quoted PEF requirements."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "test_pack"
      flow_role: "accepted machine"
      record_type: "weighing record"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each configuration and accepted unit or traceable representative batch"
      temporal_coverage: "full declared cohort"
      site_scope: "final assembly and acceptance site"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "scale calibration; weighing ticket; delivered BOM; retained-fill record"
    - protocol_id: cp_bom
      process_id: "fabrication_assembly"
      flow_role: "purchased components and stock"
      record_type: "issue and receipt records"
      raw_fields: "part identifier; material; supplier; incoming state; count; unit mass; issued and returned mass; configuration; installed location"
      collection_method: "Reconcile supplier specifications, weighed issues/returns and accepted BOM; verify finished-assembly contents to prevent duplication."
      unit: "kg"
      frequency: "each order and configuration change"
      temporal_coverage: "complete accepted cohort including rework"
      site_scope: "plant and relevant supplier gates"
      aggregation_rule: "net attributable input / accepted machines"
      quality_evidence: "invoices; drawings; supplier mass certificates; reconciliation"
    - protocol_id: cp_energy
      process_id: "fabrication_assembly_test_pack"
      flow_role: "electricity"
      record_type: "meter records"
      raw_fields: "meter identifier; stage; start/end readings; time; auxiliary load; idle load; accepted output; allocation driver"
      collection_method: "Submeter each stage and auxiliaries; reconcile with plant bills. If allocation is needed, retain measured load/time evidence."
      unit: "kWh"
      frequency: "each job/test and monthly reconciliation"
      temporal_coverage: "full declared production period including failed tests"
      site_scope: "declared site and meter boundary"
      aggregation_rule: "attributable electricity / accepted machines"
      quality_evidence: "meter calibration; logs; allocation worksheet"
    - protocol_id: cp_fluids
      process_id: "fabrication_assembly_test_pack"
      flow_role: "coolant concentrate water and oil"
      record_type: "fluid balance"
      raw_fields: "formulation; SDS; density; concentrate issue; water addition; oil fill; returns; opening/closing stock; retained fill; drain quantity"
      collection_method: "Weigh issues, retained fills and drains separately; meter make-up water. Separate recycled circulation from external additions."
      unit: "kg"
      frequency: "each fill/drain and monthly balance"
      temporal_coverage: "complete cohort"
      site_scope: "fluid systems within the declared stages"
      aggregation_rule: "net external fluid input / accepted machines"
      quality_evidence: "SDS; density record; meters; stock balance; waste manifests"
    - protocol_id: cp_waste
      process_id: "fabrication_test_pack"
      flow_role: "metal scrap spent fluid spent wheel and used oil"
      record_type: "waste transfer record"
      raw_fields: "stream identity; composition; moisture/oil content; gross/tare mass; destination; recovered fraction; production order"
      collection_method: "Weigh segregated waste streams; reconcile recoverable oil and metal separately and identify off-site treatment."
      unit: "kg"
      frequency: "each container or consignment"
      temporal_coverage: "complete cohort"
      site_scope: "site waste collection and treatment links"
      aggregation_rule: "attributable waste mass / accepted machines"
      quality_evidence: "weighbridge slips; waste classification; treatment certificates"
    - protocol_id: cp_tools
      process_id: "fabrication_test_pack"
      flow_role: "grinding wheel and test steel"
      record_type: "consumable issue log"
      raw_fields: "tool composition; new/returned mass; dressing loss; test-stock issues; accepted order"
      collection_method: "Weigh consumption and allocate multi-job tool wear using recorded service; test stock must be distinct from material incorporated in the machine."
      unit: "kg"
      frequency: "each tool change and test"
      temporal_coverage: "accepted cohort including repeated tests"
      site_scope: "fabrication and acceptance cells"
      aggregation_rule: "attributable consumable mass / accepted machines"
      quality_evidence: "issue returns; tool-life logs; test protocol"
    - protocol_id: cp_air
      process_id: "fabrication_test_pack"
      flow_role: "PM10 to air"
      record_type: "emission measurement"
      raw_fields: "particle fraction; outlet; sampled concentration; gas volume; operating time; capture efficiency; test uncertainty"
      collection_method: "Measure outlet emissions or apply a documented validated mass balance with measured capture; declare compartment and avoid treating collected dust as an air release."
      unit: "kg"
      frequency: "representative operating campaign and changes"
      temporal_coverage: "operation-weighted declared period"
      site_scope: "actual atmospheric discharge points"
      aggregation_rule: "attributable PM10 release / accepted machines"
      quality_evidence: "sampling report; calibration; ventilation logs; uncertainty"
    - protocol_id: cp_pack
      process_id: "test_pack"
      flow_role: "pallet and film"
      record_type: "packing specification"
      raw_fields: "pack identifier; material; gross/tare mass; reuse count; damaged replacements; configuration"
      collection_method: "Weigh each packaging component separately; establish documented reuse allocation and include replacement losses."
      unit: "kg"
      frequency: "each packing configuration"
      temporal_coverage: "declared dispatch cohort"
      site_scope: "dispatch area"
      aggregation_rule: "attributable packaging input / accepted machines"
      quality_evidence: "pack BOM; weighing records; reuse log"
  calculation_rules:
    - id: cohort_attribution
      applies_to: "all inventory rows"
      rule: "Sum the net external exchanges attributable to the same configuration and divide by its accepted machine count. Retain failed-test and rework burdens. Internal returns reduce issued amounts only once."
      inputs:
        - "production order records"
        - "accepted count"
        - cp_bom
        - cp_energy
        - cp_fluids
        - cp_waste
        - cp_tools
        - cp_air
        - cp_pack
      output: "exchange amount per one accepted finished machine"
      source_ids: []
    - id: configuration_mass
      applies_to: "finished_machine"
      rule: "Use the accepted net mass from cp_mass for the same complete delivered configuration; exclude transport packaging and temporary test workpieces."
      inputs:
        - cp_mass
      output: "M kg"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "complete machine"
      requirement: "Record the exact machine family and capacity/accuracy specification. Grinding, sawing, broaching and gear-cutting machines are not interchangeable representatives."
      evidence: "accepted drawings; configuration BOM; acceptance results"
    - id: dq_coverage
      applies_to: "production period"
      requirement: "Use the complete disclosed production cohort; capture procurement, rejects, rework and test cycles. Explain sampling and seasonal/utilization effects."
      evidence: "order reconciliation; output register"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile delivered net mass with incorporated components and retained fills, keeping packaging and consumed test stock separate. Investigate discrepancies against measured uncertainty, not an invented universal tolerance."
      evidence: "mass reconciliation; flow balance"
    - id: dq_upstream
      applies_to: "purchased inputs"
      requirement: "Prefer supplier/site-specific data for major assemblies. Disclose substituted geography, technology, year and incoming state; quantify sensitivity of important substitutions."
      evidence: "supplier evidence and upstream dataset register"
    - id: dq_ranges
      applies_to: "all amounts"
      requirement: "No external empirical range is prescribed. Collect foreground values; incompatible workpiece-machining use-phase observations cannot serve as machine-manufacturing priors."
      evidence: "collection protocols; documented evidence gaps"
    - id: dq_translation
      applies_to: "identity"
      requirement: "Product title terminology is professionally translated; UUID-bearing Chinese flow displays retain the exact database Chinese name even when its terminology differs from the editorial title."
      evidence: "bilingual identity audit"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_product"
    rule: "Confirm that the delivered product falls inside the complete-machine boundary, has all required qualifiers and is not a spare part or processed workpiece."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Verify the common per-machine denominator and the cp_mass measurement of M for the accepted configuration. Reject a mixture of one-machine inventory and one-kg reference output without explicit conversion."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "foreground_package"
    rule: "Every applicable card and each additional BOM/process exchange needs a quantity, unit, source record and upstream/treatment link. Unresolved identity may remain explicitly disclosed but must not be replaced by a proxy or treated as zero."
    source_ids: []
  - rule_id: validate_double_counting
    applies_to: "component_and_fluid_balances"
    rule: "Reconcile stock, incorporated mass, process losses, returned parts, circulating fluid and off-site residues. Do not count components already contained in purchased assemblies twice."
    source_ids:
      - jrc-fabricated-metal-bemp-2020
  - rule_id: validate_acceptance
    applies_to: "factory_test"
    rule: "Retain accuracy, function and declared quality acceptance evidence; attribute repeat tests and failures. Separate customer-use energy from factory tests."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "shared_operations"
    rule: "Verify causal drivers, fractions summing to the shared total and documented hierarchy/fallback justification; report sensitivity for material unresolved choices."
    source_ids:
      - eu-pef-methods-2021
published_dataset_profile:
  dataset_role: "Foreground production dataset for a complete accepted machine tool at factory gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Embodied production modelling of the declared machine configuration, or a disclosed compatible production mix"
  excluded_use: "Direct prediction of customer machining energy, universal performance comparisons across machine families, spare-part production without changed scope, or complete cradle-to-grave claims"
  required_metadata: "Configuration and functional qualifiers; M and measurement evidence; location/year; make/buy boundary; system boundary; allocation; upstream/treatment links; packaging and retained fills"
  required_quality_disclosure: "Coverage and sampling; supplier proxies; unresolved UUIDs; absent range evidence; exclusions; uncertainty; sensitivity and acceptance evidence"
  update_trigger: "Change in machine family/configuration, incoming component state, supplier technology, factory process, energy supply, acceptance procedure, material balance or significant data quality"
data_sources:
