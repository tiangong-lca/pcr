    type: "official_guidance"
    reference: "U.S. EPA, AP-42 Chapter 12.19, *Electric Arc Welding*, final section January 1995, PDF pages 1 and 3."
    used_for: "Welding process, GMAW consumable wire and supplied shielding gas, and particulate collection qualifiers."
  - id: "us-epa-metal-parts-surface-coating-tsd-2001"
    type: "official_guidance"
    reference: "U.S. EPA, *National Emission Standards for Hazardous Air Pollutants for Miscellaneous Metal Parts and Products Surface Coating Operations: Technical Support Document*, EPA-hosted PDF, 2001 compilation, PDF page 67 (printed 5-3) and PDF pages 115 and 117 (printed 8-16 and 8-18)."
    used_for: "Bounded applicability to farm-machinery manufacturing; dry-filter powder-booth overspray collection and potential internal powder recovery; surface-coating and curing operations and the need for site-specific energy and waste collection. No numerical range is inferred."
