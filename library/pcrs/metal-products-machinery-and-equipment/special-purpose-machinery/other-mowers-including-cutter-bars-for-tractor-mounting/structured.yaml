allocation_rules:
  - rule_id: subdivide_first
    applies_to: "Distinct models, routes and lines"
    rule: "Subdivide records by model, line, batch, operating time or another physical driver before allocation."
    source_ids: []
  - rule_id: recycled_scrap_no_avoided_burden
    applies_to: "Recoverable outputs"
    rule: "Report outbound waste mass and destination. Do not credit avoided virgin material inside the foreground inventory; declare any recycling allocation outside this boundary."
    source_ids: []
  - rule_id: shared_resource_allocation
    applies_to: "Shared utilities and operations"
    rule: "If subdivision is infeasible, allocate by a documented causal physical driver such as machine time, metered energy, treated area, weld length or processed mass; justify any economic allocation."
    source_ids: []
  - rule_id: rework_and_rejects
    applies_to: "Rework, rejected components and final rejects"
    rule: "Assign internal rework burdens to conforming output. Deduct supplier-returned components from gross input, retain their return evidence, and dismantle final rejects into separately measured atomic material/component/waste destinations. Report no umbrella \"rejected mower\" flow and do not omit non-steel fractions."
    source_ids: []
  - rule_id: pallet_ownership_and_use
    applies_to: "Wooden pallets"
    rule: "Distinguish physical ownership transfer from temporary use. Report actual transferred pallet mass only when ownership leaves the reporting organization; for returnable/pool pallets link one upstream use-cycle or service dataset and do not divide a per-use dataset by reuse cycles again."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_fabrication_material_records
      process_id: "material_preparation_and_fabrication"
      flow_role: "material and process-gas inputs"
      record_type: "BOM, issue, return and cylinder records"
      raw_fields: "identity; grade/purity; opening stock; receipts; issues; returns; closing stock; model/batch"
      collection_method: "Reconcile controlled inventory records to BOM and production. Aggregation: Sum net issues by atomic flow; allocate with a physical driver."
      unit: "kg or m3"
      frequency: "each batch; monthly aggregation"
      temporal_coverage: "dataset period"
      site_scope: "represented site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "BOM, supplier specification, stock reconciliation, calibration"
    - protocol_id: cp_component_bom_records
      process_id: "material_preparation_and_fabrication"
      flow_role: "purchased mower assemblies and fastener families"
      record_type: "controlled BOM, make-or-buy decision, usable-stock, process-issue, external-return and reject records"
      raw_fields: "model/revision; manufacturer part number/specification/count; supplier; product state; opening usable stock; external receipts; gross process issues; unused internal returns; closing usable stock; unused external returns; consumed rejects; installed mass"
      collection_method: "Crosswalk every representative configuration item to one purchased row or to its in-house atomic materials/processes and prohibit both for the same item. Keep external purchases in the usable-stock control volume; record in-house transfers from their producing foreground process without treating them as external receipts. Aggregation: Direct model assignment. Purchased consumption equals opening usable stock plus external receipts minus closing usable stock minus unused external returns; an equivalent issue basis is gross process issues minus unused returns to the same stock. Replacement issues for rejects remain consumed input. Unused internal returns re-enter the same usable stock and are represented once through either closing stock or the issue-basis return, never both. Include consumed rejects in the input and report their measured mass separately under actual atomic waste destinations; normalize by conforming net output."
      unit: "kg"
      frequency: "each BOM revision and batch"
      temporal_coverage: "dataset period"
      site_scope: "represented site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "approved BOM, parts list, supplier specification, stock reconciliation, issue/return record, receiving scale, disposition record"
    - protocol_id: cp_fabrication_energy_records
      process_id: "material_preparation_and_fabrication"
      flow_role: "electricity and natural gas"
      record_type: "submeter, invoice and operating records"
      raw_fields: "meter start/end; fuel volume; reference conditions; machine hours; output"
      collection_method: "Prefer submeters and reconcile totals to invoices. Aggregation: Allocate residual shared use by machine time or another causal driver."
      unit: "MJ or m3"
      frequency: "continuous or invoice; monthly aggregation"
      temporal_coverage: "dataset period"
      site_scope: "represented site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, invoice reconciliation, allocation worksheet"
    - protocol_id: cp_fabrication_waste_records
      process_id: "material_preparation_and_fabrication"
      flow_role: "steel scrap"
      record_type: "scale tickets and manifests"
      raw_fields: "identity; gross/tare/net mass; date; destination; disposition"
      collection_method: "Sum outbound tickets and reconcile inventory change. Aggregation: Direct batch assignment or processed-steel mass."
      unit: "kg"
      frequency: "each shipment"
      temporal_coverage: "dataset period"
      site_scope: "represented site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration, manifest, mass balance"
    - protocol_id: cp_shielding_gas_balance
      process_id: "material_preparation_and_fabrication"
      flow_role: "supplied shielding gas and direct release"
      record_type: "supplier certificate, cylinder/bulk stock, capture and exhaust records"
      raw_fields: "carbon origin; opening stock; receipts; closing stock; returned gas; capture/retention; discharge point; compartment"
      collection_method: "Verify fossil or biogenic origin, balance consumed gas to capture/retention and direct release, and document the actual outdoor discharge; use unspecified air only when no more specific public compartment is defensible. Aggregation: Direct GMAW assignment; fossil and biogenic releases are mutually exclusive portions of the consumed gas."
      unit: "kg"
      frequency: "each delivery/batch; monthly aggregation"
      temporal_coverage: "dataset period"
      site_scope: "represented site and discharge point"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier origin certificate, stock reconciliation, capture record, ventilation diagram"
    - protocol_id: cp_surface_material_records
      process_id: "surface_treatment_and_coating"
      flow_role: "powder-coating input"
      record_type: "purchase, formulation, stock and recovery records"
      raw_fields: "powder identity; chemistry; opening stock; receipts; fresh issue; unopened return; recovered overspray; closing stock; treated area"
      collection_method: "Reconcile fresh powder to accepted coating, rejects, internal recovery and outbound powder waste. Aggregation: Direct batch or treated surface area."
      unit: "kg"
      frequency: "each batch; monthly aggregation"
      temporal_coverage: "dataset period"
      site_scope: "represented dry-filter powder line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier specification, stock reconciliation, booth recovery log"
    - protocol_id: cp_surface_energy_records
      process_id: "surface_treatment_and_coating"
      flow_role: "electricity and natural gas"
      record_type: "submeter, invoice and oven records"
      raw_fields: "meter start/end; fuel volume; reference conditions; line hours; output"
      collection_method: "Prefer line submeters and reconcile totals to invoices. Aggregation: Treated area, line time or direct batch."
      unit: "MJ or m3"
      frequency: "continuous or invoice; monthly aggregation"
      temporal_coverage: "dataset period"
      site_scope: "represented site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, invoice reconciliation, allocation worksheet"
    - protocol_id: cp_surface_waste_records
      process_id: "surface_treatment_and_coating"
