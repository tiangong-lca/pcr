    used_for: "Representative configuration checklist covering frame/hitch, hydraulic cylinder, belt drive, cutter unit, gearbox, driveline and guards; exact frame-and-hitch screw, nut, washer and pin part specifications, including the stated count of 32 for washer 804-186C; not material composition or industry quantity ranges."
  - id: "land-pride-disc-mower-operator-2006"
    type: "handbook"
    reference: "Land Pride, *DM3705, DM3706, and DM3707 Series Disc Mowers Operator's Manual*, 327-083M, 9/15/06, PDF pages 9 and 11."
    used_for: "Representative agricultural disc-mower application, tractor mounting and first-fill SAE 90 gear lubricant; not an industry range."
