  calculation_rules:
    - id: normalize_to_reference_mass
      applies_to: "Every exchange"
      rule: "normalized amount = absolute exchange / conforming net product mass"
      inputs:
        - "absolute amount"
        - "conforming net product mass"
      output: "amount per 1 kg product"
      source_ids: []
    - id: direct_fossil_co2
      applies_to: "On-site fuel combustion"
      rule: "Use measured fuel and documented carbon content/oxidation assumptions; exclude upstream fuel and electricity emissions."
      inputs:
        - fuel
        - "composition/carbon"
        - "oxidation assumption"
      output: "kg direct fossil CO2"
      source_ids: []
    - id: material_reconciliation
      applies_to: "Steel fabrication"
      rule: "steel input = steel in product + outbound scrap + inventory increase + documented losses"
      inputs:
        - "steel input"
        - BOM
        - scrap
        - inventory
      output: "residual"
      source_ids: []
    - id: powder_balance
      applies_to: "Dry-filter powder coating"
      rule: "fresh powder = accepted deposited coating + rejected deposited coating + outbound powder/filter waste + inventory increase, with recovered powder shown as an internal loop"
      inputs:
        - "powder issue"
        - recovery
        - "coating deposition"
        - reject
        - residue
        - inventory
      output: "balance residual"
      source_ids:
        - us-epa-metal-parts-surface-coating-tsd-2001
    - id: shielding_gas_balance
      applies_to: "Supplied carbon-dioxide shielding gas"
      rule: "consumed CO2 = fossil direct release + biogenic direct release + captured/retained CO2 + inventory change; fossil and biogenic portions require supplier origin evidence"
      inputs:
        - "gas stock"
        - "origin certificate"
        - "capture/retention"
        - discharge
      output: "kg direct CO2 by origin"
      source_ids:
        - us-epa-ap42-electric-arc-welding-1995
    - id: diesel_test_balance
      applies_to: "Test and delivery fuel"
      rule: "combusted test diesel = opening test-tank mass + issued mass - closing mass - returned/recovered mass - spills - diesel retained in saleable product"
      inputs:
        - "tank/issue/return/spill/gate records"
      output: "kg combusted test diesel"
      source_ids: []
    - id: accepted_output_loss_balance
      applies_to: "Components, packaging and final rejects"
      rule: "external receipts + opening usable stock = accepted-product incorporation + closing usable stock + unused external returns + consumed rejects/waste + other documented losses; the input inventory includes consumed rejects and never subtracts them. Keep unused internal returns inside the same stock control volume, keep in-house transfers distinct from external purchases, record reject mass by actual atomic destination, and normalize all attributable consumption and losses by conforming output only"
      inputs:
        - "external receipts"
        - "opening/closing usable stock"
        - "process issues"
        - "internal and external returns"
        - "BOM counts"
        - rejects
        - "atomic waste destinations"
        - "conforming output"
      output: "balance residual"
      source_ids: []
