      applies_to: "conditional processes"
      rule: "The listed cards cover stock/casting preparation, emulsion machining and electric powder finishing where performed. Foundry melting, non-electric heat treatment, solvent painting, combustion and other site operations require explicit additional processes and species-specific exchanges when present; they cannot be silently omitted or represented by an umbrella flow."
