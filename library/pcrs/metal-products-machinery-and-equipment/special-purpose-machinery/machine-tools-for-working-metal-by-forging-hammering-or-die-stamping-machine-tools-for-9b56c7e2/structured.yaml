allocation_rules:
  - rule_id: allocate_direct
    applies_to: "shared production"
    rule: "First assign materials, purchased parts and metered operations to the order and serial/configuration records using cp_material, cp_component and cp_energy. Subdivide shared operations before allocating totals."
    source_ids: []
  - rule_id: allocate_campaign
    applies_to: "shared electricity and fluids"
    rule: "Use measured equipment time and corresponding operating load where subdivision is unavailable; document the causal allocation key, included idle/standby share, numerator, denominator and reconciliation to facility totals in cp_energy or cp_fluid. Simple machine-count averaging is allowed only for identical configurations under equivalent operating conditions."
    source_ids: []
  - rule_id: allocate_scrap
    applies_to: "exported waste and internal returns"
    rule: "Retain gross material inputs and segregated exported waste outputs. No automatic negative burden or virgin-material substitution credit is granted for scrap. Record the receiving treatment or recycling model and avoid double counting its recovery credit. Internal material and oil returns remain internal."
    source_ids:
      - jrc-fabricated-metal-bemp-2020
  - rule_id: allocate_test
    applies_to: "acceptance output"
    rule: "Attribute test coupons, energy and consumables to the machines being accepted. Disclose any commercially sold test output; where material, subdivide the trial or apply a documented physical allocation and sensitivity assessment. Record rework and failed tests in the accepted-machine burden."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "acceptance"
      flow_role: "accepted reference product"
      record_type: "weighing record"
      raw_fields: "model; configuration; serial number; accepted net mass M"
      collection_method: "Weigh the accepted complete machine on a calibrated scale, excluding transport packaging; reconcile the same configuration and acceptance record."
      unit: "kg"
      frequency: "each accepted machine"
      temporal_coverage: "entire accepted order"
      site_scope: "manufacturer site"
      aggregation_rule: "accepted net mass per machine"
      quality_evidence: "scale calibration; tare and weighing ticket; configuration checklist"
    - protocol_id: cp_route
      process_id: "assembly"
      flow_role: "process and configuration completeness"
      record_type: "route census"
      raw_fields: "order; operation; make/buy decision; material grade; component model; installed options; subcontractor; supply origin and transport mode/distance; waste destination; actual utilities and emissions"
      collection_method: "Reconcile production traveller, BOM, purchase records and site walk-through; identify missing process-specific exchanges and supplier coverage before inventory approval."
      unit: "record"
      frequency: "each configuration and route change"
      temporal_coverage: "complete order and linked common-service period"
      site_scope: "site and subcontractors"
      aggregation_rule: "complete route record per one accepted finished machine"
      quality_evidence: "approved BOM; manufacturing traveller; supplier coverage statements; route and waste documents"
    - protocol_id: cp_material
      process_id: "fabrication_machining"
      flow_role: "stock, filler and gas inputs"
      record_type: "material ledger"
      raw_fields: "material; grade; batch; issued mass; returned mass; stock change; scrap; order; shielding-gas composition"
      collection_method: "Weigh issues and returns; reconcile warehouse, job and production records; use documented temperature/pressure conversion only for volumetric gas records."
      unit: "kg"
      frequency: "each issue and return"
      temporal_coverage: "full production campaign"
      site_scope: "contributing work centres"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibrated scales; batch certificates; warehouse reconciliation"
    - protocol_id: cp_component
      process_id: "assembly"
      flow_role: "bought assemblies"
      record_type: "component BOM"
      raw_fields: "item identifier; model; quantity; net unit mass; included subcomponents; supplier; delivered state"
      collection_method: "Reconcile the as-built BOM against received components; use traceable unit weighing or supplier mass records; prevent parent/child double counting."
      unit: "kg"
      frequency: "each order and revision"
      temporal_coverage: "accepted configuration"
      site_scope: "assembly and suppliers"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "BOM; supplier data; weighing records; scope matrix"
    - protocol_id: cp_energy
      process_id: "fabrication_machining_coating_assembly_acceptance"
      flow_role: "purchased electricity"
      record_type: "meter and load record"
      raw_fields: "meter; voltage; start/end readings; work centre; operating state; cycle count; job hours; allocation key; idle share"
      collection_method: "Submeter each operation including extraction and internal utility generation; reconcile allocation of unmetered common loads to site invoices."
      unit: "kWh"
      frequency: "each job or representative measured campaign"
      temporal_coverage: "all contributing production and acceptance periods"
      site_scope: "site and work centres"
      aggregation_rule: "attributable electricity / accepted machines"
      quality_evidence: "meter calibration; logs; invoices; allocation reconciliation"
    - protocol_id: cp_fluid
      process_id: "machining_assembly"
      flow_role: "water, concentrate, oil and grease"
      record_type: "fluid balance"
      raw_fields: "chemical identity; formulation; quantity issued; returns; retained fill; dilution water; discarded mass; density and temperature when used"
      collection_method: "Weigh or meter each individual fluid separately; reconcile fresh supply, internal recovery, machine retention and disposal."
      unit: "kg"
      frequency: "each fill, makeup and discharge"
      temporal_coverage: "complete order and fluid-service period"
      site_scope: "machining, assembly and test loops"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "safety data sheets; fill logs; calibrated measurement; fluid balance"
    - protocol_id: cp_coating
      process_id: "coating"
      flow_role: "fresh coating powder"
      record_type: "coating ledger"
      raw_fields: "formulation; fresh issue; unused return; recovered powder; discard; coated order; curing route"
      collection_method: "Weigh powder and stock movement; separate fresh consumption, booth recirculation and exported waste."
      unit: "kg"
      frequency: "each coating batch"
      temporal_coverage: "coating campaign for declared orders"
      site_scope: "coating line"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "batch records; scales; coating specification"
    - protocol_id: cp_waste
      process_id: "fabrication_machining_coating_acceptance"
      flow_role: "specific exported waste"
      record_type: "waste consignment"
      raw_fields: "waste identity; metal grade or composition; wet/dry basis; oil content; measured mass; origin; destination; treatment"
      collection_method: "Weigh each separately identified waste stream; retain consignment documents and reconcile internal returns before calculating external outputs."
      unit: "kg"
      frequency: "each consignment with order allocation"
      temporal_coverage: "entire manufacturing and acceptance period"
      site_scope: "waste-generating work centres"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "calibrated scales; manifests; oil/moisture tests; recycler records"
    - protocol_id: cp_test
      process_id: "acceptance"
      flow_role: "test coupon material"
      record_type: "acceptance record"
      raw_fields: "machine configuration; test method; force/energy; stroke; cycles; coupon grade; fresh mass; reused mass; rejected tests; disposition"
      collection_method: "Link physical coupon issues and trial logs to each accepted machine; retain contractual acceptance results and all repeat trials."
      unit: "kg"
      frequency: "each acceptance trial"
      temporal_coverage: "first trial through final acceptance"
      site_scope: "factory test area"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "test report; material issue records; reuse log"
    - protocol_id: cp_packaging
      process_id: "acceptance"
      flow_role: "timber and film"
      record_type: "packing BOM"
      raw_fields: "packaging component; mass; new/reused status; trips and ownership where reusable; machine serial"
      collection_method: "Weigh each packaging material separately; document actual reuse allocation; keep packaging outside accepted machine net mass."
      unit: "kg"
      frequency: "each shipment"
      temporal_coverage: "shipment preparation"
      site_scope: "packing area"
      aggregation_rule: "attributable quantity / accepted machines"
      quality_evidence: "packing list; weighing tickets; reuse ledger"
  calculation_rules:
    - id: campaign_per_machine
      applies_to: "all inventory rows"
      rule: "Divide attributable exchange totals by the number of accepted machines of the same configuration; use direct order attribution wherever available. Retain rejected-unit and rework burdens attributable to accepted output."
      inputs:
        - "attributable totals"
        - "accepted count"
        - cp_route
      output: "exchange amount per one accepted finished machine"
      source_ids: []
    - id: stock_balance
      applies_to: "material and fluid inputs"
      rule: "Reconcile opening stock plus receipts minus closing stock and unconsumed returns with net external consumption; internal circulation is excluded from fresh supply."
      inputs:
        - cp_material
        - cp_fluid
        - cp_coating
      output: "net physical input, separately by flow"
      source_ids: []
    - id: component_mass
      applies_to: "purchased assemblies"
      rule: "Multiply installed count by traceable model-specific unit mass; reconcile with the as-built BOM and the measured complete-machine mass without treating scrap or packaging as retained machine mass."
      inputs:
        - cp_component
        - cp_mass
      output: "installed component mass by item"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "complete machine"
      requirement: "Declare operation, drive, delivered state and acceptance specification. Do not merge forging hammers, bending brakes and punching presses solely by mass."
      evidence: "cp_route; cp_mass; un-cpc-3-0-structure-2025"
    - id: dq_coverage
      applies_to: "foreground and suppliers"
      requirement: "Cover the full accepted order or disclose representativeness of a measured campaign; include all contributing shifts and shared services. Identify every omitted operation and upstream gap. No arbitrary small-mass cutoff permits omitting relevant coatings, electronics or oil."
      evidence: "cp_route; reconciled production traveller"
    - id: dq_material
      applies_to: "BOM and wastes"
      requirement: "Reconcile retained material with the delivered net machine mass, segregated waste and documented losses; assess moisture, fluid retention and measurement uncertainty before accepting discrepancies."
      evidence: "cp_mass; cp_component; cp_waste"
    - id: dq_energy
      applies_to: "electricity"
      requirement: "Match geography, voltage, period and supply technology. Nameplate power is insufficient without measured load and operating time."
      evidence: "cp_energy"
    - id: dq_source
      applies_to: "external evidence"
      requirement: "Use the JRC metalworking passages only for applicable machining-fluid and residue-management principles; the report does not establish press-manufacturing intensity. The hydraulic-brake product page supports configuration only."
      evidence: "jrc-fabricated-metal-bemp-2020; trumpf-trubend-3000"
    - id: dq_ranges
      applies_to: "important exchanges"
      requirement: "Collect site-specific material, energy, fluid, waste and packaging amounts. Any later empirical range requires at least two independent original sources with compatible product state and boundaries, or a separately reviewed foreground basis."
      evidence: "collection records and documented source assessment"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_machine"
    rule: "Confirm M is measured net mass of the accepted configuration, and all inventory quantities use the same one-machine denominator. Do not publish a fictitious numerical machine mass."
    source_ids: []
  - rule_id: validate_atomic
    applies_to: "every exchange"
    rule: "Require one identified physical product, waste or elementary species per row, with compatible flow type, property and unit. Missing database identity does not authorize a proxy; resolve identity before dataset publication or disclose the explicit gap."
    source_ids: []
  - rule_id: validate_configuration
    applies_to: "route and BOM"
    rule: "Reconcile each supplied functional assembly, guarding, tooling and first fill with the configuration; extend the atomic inventory for actual components or processes absent from the common cards. Missing, purchased or outsourced is not equivalent to zero burden."
    source_ids:
      - trumpf-trubend-3000
  - rule_id: validate_balances
    applies_to: "inputs and outputs"
    rule: "Reconcile material, fluid, electricity and waste balances; investigate discrepancies using recorded uncertainty and stock changes. Segregated residue and internal recovery records must prevent double counting."
    source_ids:
      - jrc-fabricated-metal-bemp-2020
  - rule_id: validate_boundary
    applies_to: "dataset"
    rule: "Verify upstream process coverage, transport linkage and waste treatment once each; label a foreground-only dataset as such when cradle-to-gate coverage is incomplete. Reject use-stage comparisons based solely on factory acceptance energy."
    source_ids: []
  - rule_id: validate_evidence
    applies_to: "ranges and assumptions"
    rule: "Do not turn catalogue weights, single cases, regulatory limits or alternative models from one publication into an empirical industry range. Disclose allocation sensitivity and all unverified assumptions."
    source_ids: []
published_dataset_profile:
  dataset_role: "Configuration-specific foreground manufacturing data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing inventory for the declared complete metal-forming machine; upstream linkage and incorporation in a separately specified equipment life-cycle model"
  excluded_use: "Unqualified comparisons across machine functions; customer workpiece processing burdens; lifetime energy prediction from acceptance testing; treating a kilogram of heterogeneous machines as functionally equivalent"
  required_metadata: "Model and operation; drive; force or impact energy; stroke/envelope; installed configuration and tooling; measured net mass; fluid state; site; production period; make/buy split; upstream coverage; supply routes; allocation; packaging; dataset version"
  required_quality_disclosure: "Measurement coverage and uncertainty; representative campaign selection; supplier gaps; conditional absent exchanges; unresolved flow identities; range-evidence gaps; direct versus allocated amounts; waste-treatment and recycling model"
  update_trigger: "Changed design, drive, configuration, material grade, supplier route, coating, site energy supply, first-fill condition or acceptance procedure; new measured data replacing assumptions"
data_sources:
  - id: "un-cpc-3-0-structure-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0, structure dated 30 June 2025, rows 2264–2274. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv ; original checked 2026-09-22."
    used_for: "Classification identity and adjacent exclusions; no inventory quantity"
