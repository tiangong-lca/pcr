normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:5f0a7c8eae149e4fb06c076f88598fe862b674893bb824e0fff82b8e12c0fcb1"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5928"
      family: "system_boundary"
      span:
        start:
          offset: 5928
          line: 60
          column: 1
        end:
          offset: 9268
          line: 80
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Purchased pulp sheets and individually declared components at converter receipt; actual supplier grade/state/route and inbound freight boundary disclosed |\n| starting_condition_role | foreground_module |\n| product_classification_scope | CPC32196 taped infant-diaper subset only; method is independent from the classification label |\n| recursive_input_rule | No recursive diaper manufacturing for purchased completed diapers: record the actual input and compatible upstream dataset, disclose refurbishment/rework. Internal rework remains internal; do not purchase the same rejected unit again. |\n| upstream_dataset_requirement | Supplier-specific component manufacture and transport consistent with reference properties; for pulp include actual wood sourcing, kraft pulping/recovery, ECF bleaching, drying and wastewater treatment. Use BREF only for relevant pulp process/reporting context, not a lumber dataset or a diaper recipe. |\n| disclosure | Converter module versus cradle-to-gate aggregate; geography/year; complete component BOM; supplied subassembly states; actual product moisture; utility and treatment boundaries; all exclusions and gaps |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `boundary_complete` | `conversion` | Include receipt/handling, dry defibration, SAP dosing/core forming, web and film assembly, elastics/fasteners, actual coating, cutting, inspection/rejects, pack-out, dust collection and attributable electric auxiliaries. Explicitly retain upstream burdens for every input; do not present a converter module as a full lifecycle result. | pampers-swaddlers-construction; ea-nappies-2008; pampers-manufacturing-traceability |\n| `upstream_pulp_boundary` | `fluff_pulp` | Purchased pulp manufacture is upstream, including recovery/boilers and mill treatment. Supplier wet/AD/oven-dry bases must be reconciled with received mass. Do not bring sawmill evidence into pulp process quantities. Retain upstream biogenic CO2 exchanges and carbon origin even if a climate reporting convention excludes them from a subtotal. | jrc-pulp-paper-bref-2015 |\n| `physical_network` | `conversion` | Aggregate manufacture and packaging into one foreground unit so the same complete product is output only once. Retain stage meters and a separate physical process diagram/balances. Each internal transfer has equal mass/identity at both ends; pair stage internal_out and internal_in with the same transfer ID, time, owner/cohort and complete inherited provider vector. Actual transformation consumes its incoming material and records resulting outputs/losses, without creating a fictitious receipt of that transformed material; internal recirculation and collected return are not external exchange or credited waste. | ea-nappies-2008 |\n| `actual_air_path` | `conversion` | Inspect dry defibration/core-forming/cutting exhaust and fugitive pathways. BREF7.1.10 establishes possible paper-cutting dust, not a diaper/SAP factor. Keep capture and external particulate emission separate and measured; classify size and composition without correction flows. Additional actual volatilized species need separate verified elementary rows before dataset completion. | jrc-pulp-paper-bref-2015 |\n\n"
      headings:
        - kind: "heading"
          span:
            start:
              offset: 383
