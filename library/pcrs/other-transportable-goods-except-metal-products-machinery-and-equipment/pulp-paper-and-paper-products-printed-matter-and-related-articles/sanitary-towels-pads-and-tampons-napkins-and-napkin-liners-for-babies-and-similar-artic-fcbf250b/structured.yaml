allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "conversion"
    rule: "First investigate subdivision or system expansion to avoid allocation; isolate the actual lot/line with direct meters where subdivision is possible. If expansion is justified, include the additional functions and report the expanded system as a whole. Only after documenting why these approaches are unavailable, partition unavoidable shared energy/services using a relevant measured physical relationship; if unavailable, justify an alternative relationship with actual economic records and sensitivity. No universal mass or price fraction applies. Review before choosing substitution; no automatic scrap credit."
    source_ids:
      - ec-pef-allocation-2021
  - rule_id: physical_vs_burden
    applies_to: "conversion"
    rule: "Keep unallocated physical mass/water/carbon ledgers and diagrams separate from attributed environmental-burden ledgers. Physical coproduct or waste outputs and internal transfers stay at measured quantities; never mechanically multiply their physical output by the diaper allocation fraction. Attribute only justified common burdens without changing conservation."
    source_ids:
      - ec-pef-allocation-2021
  - rule_id: waste_rework
    applies_to: "conversion"
    rule: "Rejects are not saleable coproducts by default. Document any real external coproduct function/receiver before allocating. Internal rework remains physical recovery, without displacement credit; external waste treatment stays connected to the actual stream and actual receiver."
    source_ids:
      - ec-pef-allocation-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "conversion"
      flow_role: "diaper_output"
      record_type: "Calibrated dispatch and QC records"
      raw_fields: "lot; size; date; accepted batches; gross and packaging tare; removed samples; reject mass; net Q; actual moisture; QC test method/results"
      collection_method: "Weigh complete accepted net diapers with calibrated scales and independently verified packaging tare; never infer item mass from marketing size or age. Retain raw production, dispatch, QC, returns and opening/closing feed, WIP and finished-stock records for the complete matched site/SKU/state/route period, including failed and zero-output runs, rejects, rework, changeovers, starts/stops, cleaning and attributable idle operations with their actual burdens. Q is unique newly generated accepted complete net diaper production in this pool, excluding packaging, rejects and removed samples. Use calibrated accepted-production weighing, or reconcile dispatch plus closing minus opening accepted stock with actual transfers/returns; do not reapply a stock correction to production already measured. Count each new lot only at its first quality release, including its newly released closing finished stock exactly once. Opening finished goods, prior accepted production Qc and genuine customer-return rework/reacceptance never create current new Q; retain their original cohort and prior acceptance record. Internal rework before first release is not an extra output. Later storage, packing, dispatch or return services retain their actual burdens with the served cohort; do not divide them by unrelated current new Q without an evidenced attribution and matched denominator. Track opening/closing WIP and stocks with their embodied material and carried production burdens, transferring rather than duplicating or dropping them; opening product dispatched is not new production. Retain the raw positive Q and each raw period total A_i without division here; normalize_net_product is the sole normalization step. If Q<=0 or the pool/burden match is unestablished, preserve raw records and leave normalized exchanges unavailable."
      unit: "kg"
      frequency: "Each lot and dispatch"
      temporal_coverage: "Complete representative operating period, including changeovers, starts and losses"
      site_scope: "Declared line and SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; tare samples; lot QA and stock reconciliation"
    - protocol_id: cp_material
      process_id: "conversion"
      flow_role: "Each material input"
      record_type: "Supplier/BOM and issue records"
      raw_fields: "flow row; grade; CAS/composition; supplier; received/issued/returned stocks; moisture/solids; incorporation; internal rework; pigment/finish; coating state; density or web area/areal mass if converted"
      collection_method: "Weigh issues minus unused returns or reconcile opening+receipts-closing stock with transfer corrections. Screen all actual attributable maintenance oils/greases, filters, wipes and replacement consumables from service/issue/return/stock records. Document exclusions or supported absence; add separate atomic inputs and external spent streams with actual chemistry/form/quantity/receiver before dataset use, never a generic per-machine default. Keep row-specific stage logs; supplied subassemblies and embedded ingredients cannot be counted again. Supplier reference basis must be separately verified. A_i=sum disjoint external consumption totals for the matching lots; record incorporation, losses and stock change separately Retain each A_i as its raw matched-period total in the stated numerator unit, without prior division by Q; normalize_net_product performs the only normalization using cp_output Q."
      unit: "kg"
      frequency: "Each receipt/lot/shift"
      temporal_coverage: "Same period/lots as Q"
      site_scope: "Declared product grades and line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier specifications; calibrated scale/roll meter; BOM/disassembly and stock balance"
    - protocol_id: cp_energy
      process_id: "conversion"
      flow_role: "grid_electricity"
      record_type: "Revenue/submeter and operating logs"
      raw_fields: "delivered kWh; voltage; supplier; mix/year; meter boundary; stage kWh; machine hours/load; HVAC/compressor scope; allocation driver; losses"
      collection_method: "Read calibrated delivered-power meter and stage meters, reconcile bills and loss boundaries. Collect electric heating and compressed-air/HVAC energy, including idle/start-up attributable to the lot; avoid meter overlaps. A_e=3.6 times the justified attributed delivered kWh; stage and auxiliary totals reconcile to the same purchase meter Retain each A_i as its raw matched-period total in the stated numerator unit, without prior division by Q; normalize_net_product performs the only normalization using cp_output Q."
      unit: "kWh; MJ"
      frequency: "Interval meter and each campaign"
      temporal_coverage: "Same complete period as Q"
      site_scope: "Factory delivery and declared stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, invoice, supply contract, driver justification"
    - protocol_id: cp_waste
      process_id: "conversion"
      flow_role: "Each separate outgoing production/material waste"
      record_type: "Collector and receiver records"
      raw_fields: "row/bin id; stage; actual handoff phase; weighed whole net kg; representative density if volume converted; moisture; cellulose/SAP/polymer/glue fractions; contamination; internal return; receiver/treatment; stored waste"
      collection_method: "Weigh each real separately received stream and inspect composition. Reconcile generation, internal return, stored material and removal tickets. Distinguish composite rejects from separately recovered fractions. A_i=sum net external quantities after stock reconciliation; internally returned material is excluded Retain each A_i as its raw matched-period total in the stated numerator unit, without prior division by Q; normalize_net_product performs the only normalization using cp_output Q."
      unit: "kg"
      frequency: "Each collection and removal"
      temporal_coverage: "Same period, with waste stock correction"
      site_scope: "Actual named collector and receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale tickets; waste composition; receiver contract; return logs"
    - protocol_id: cp_cleaning
      process_id: "conversion"
      flow_role: "Water, cleaner and effluent separately"
      record_type: "Cleaning meter and receiver records"
      raw_fields: "water volume/mass; actual density; cleaner grade/composition/mass/dilution; effluent volume/density; contaminants; retained water; receiver; vapour or other exit; stock"
      collection_method: "Meter each actual input and effluent; sample water density and effluent composition using documented lab methods. Keep sewer handoff distinct from a direct discharge; complete any actual evaporation/discharge row before dataset use. Aggregate each stream separately; use actual density for m3-to-kg; retain whole physical water balance without conflating wastewater and tap input Retain each A_i as its raw matched-period total in the stated numerator unit, without prior division by Q; normalize_net_product performs the only normalization using cp_output Q."
      unit: "kg; m3"
      frequency: "Each cleaning event and discharge"
      temporal_coverage: "Matching lots and relevant auxiliary period"
      site_scope: "Declared line cleaning/auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meters; lab density/analysis; cleaning logs; receiving conditions"
    - protocol_id: cp_air
      process_id: "conversion"
      flow_role: "Each actual non-overlapping particulate interval"
      record_type: "Stack/fugitive monitoring"
      raw_fields: "source/vent id; control; sample method/time; particle cuts; concentration and basis; dry/wet/reference gas volume; period exhaust; run/load; fugitive pathway; below-detection bounds; composition"
      collection_method: "Use actual calibrated exhaust-flow and concentration/particle-size measurements representative of route and controls; align gas bases. Inventory all relevant vents and fugitive paths. If only total dust is known, retain the size-resolution gap rather than fabricate fractions. A_j=sum concentration_j times matching exhaust volume times 10^-6 plus independently measured fugitive kg; size bins mutually exclusive; no PM10 total added to its sub-bins Retain each A_i as its raw matched-period total in the stated numerator unit, without prior division by Q; normalize_net_product performs the only normalization using cp_output Q."
      unit: "mg/m3; m3; kg"
      frequency: "Validated sampling campaign with operational logs"
      temporal_coverage: "Matched operating conditions and period Q"
      site_scope: "Outdoor air across converter boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Lab methods/calibration; particle cut definitions; vent map; coverage and detection bounds"
  calculation_rules:
    - id: normalize_net_product
      applies_to: "Every external inventory row"
      rule: "For Q>0 with the complete matched pool and carried burdens established by cp_output, calculate q_i=A_i/Q exactly once from each raw external row total in its native numerator unit. Collection protocols retain raw totals; identical card expressions are references to this calculation. Convert native units before this step and do not divide an already normalized value again. Preserve complete physical exchange quantities and stock transfers separately from justified attributed environmental burdens. If Q<=0 or matching is unresolved, retain raw records and leave q_i unavailable."
      inputs:
        - "A_i actual row total"
        - "Q measured complete net accepted kg"
        - "cp_output plus linked row protocol"
      output: "Row unit per 1 kg net accepted diapers"
      source_ids:
        - pampers-manufacturing-traceability
    - id: pulp_reference_conversion
      applies_to: "fluff_pulp"
      rule: "m_dry=m_received*s; m_provider=m_dry/s_provider"
      inputs:
        - "Measured received mass and solids s"
        - "separately declared supplier reference solids s_provider>0"
      output: "Provider-reference kg consistent with linked inventory. Use 0.90 only if that provider explicitly uses BREF AD convention; never default received s."
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: electricity_conversion
      applies_to: "grid_electricity"
      rule: "A_e=3.6*E_kWh; retain the raw campaign MJ total for normalize_net_product only"
      inputs:
        - cp_energy
        - cp_output
      output: "Raw campaign MJ; normalized MJ/kg only in normalize_net_product"
      source_ids:
        - pampers-manufacturing-traceability
    - id: mass_water_carbon_ledgers
      applies_to: "conversion"
      rule: "At the production acceptance boundary, inputs + opening raw-material/WIP stock = newly accepted net diapers Q + separately identified other product/material transfers out + accompanying packaging + wastes/emissions + unused-material returns + closing raw-material/WIP stock; include any actual transfers into production and match their quantities at both ends. Do not add finished stocks of those same accepted diapers to this production ledger. Where actual finished storage/dispatch is included, keep a linked finished-stock ledger: opening finished stock + newly accepted production transferred in + other actual returns/transfers in = actual dispatch + other actual withdrawals/transfers out + closing finished stock. Returned/reaccepted lot transfers do not create new Q. On consolidation cancel the acceptance/rework handoffs and use actual external product dispatch with closing finished stock, never Q as an extra physical output as well. Retain all actual included handling, packing, storage and dispatch operations and their complete burdens, assigned to the matched lot/cohort; this clarification changes neither Q nor operation coverage. balance each material on measured dry/wet basis, water and carbon separately. Internal transfer quantities cancel. Preserve measured residual and uncertainty, not a forced yield. Each ledger uses receipts and actual handoffs at its own stated boundary consistently, not stock-adjusted consumption plus the same stock movements twice. Keep measured material-specific water/carbon fractions and origins for every actual component, formulation, auxiliary and packaging; unknown fractions/origins remain unknown. Water includes material/formulation moisture, retained product, shipped packaging, separate whole-wet waste and stocks; any measured net vapour subtracts matching incoming-air humidity before a reviewed outdoor-water elementary row is used. Constituent H2O/contaminants are subledgers, not duplicate external wastewater exchanges. Packaging receipts+opening reconcile independently to measured shipped tare, external scraps/returns and closing stocks, all outside Q."
      inputs:
        - cp_material
        - cp_output
        - cp_waste
        - cp_cleaning
        - cp_air
      output: "Unallocated physical ledgers, with fibre/polymer carbon retained in product and origin identified"
      source_ids:
        - ea-nappies-2008
    - id: exclusive_particle_bins
      applies_to: "pm_fine; pm_coarse; pm_large"
      rule: "If cumulative PM10 and PM2.5 are available on identical sampling bases, PM2.5–10=PM10-PM2.5; if total dust on that same basis is available, >PM10=total dust-PM10. Reject negative or mismatched-basis differences. Otherwise measure each size interval; do not infer missing bins or add cumulative totals to fractions."
      inputs:
        - cp_air
      output: "kg/kg; outdoor-air unspecified"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: shared_burden
      applies_to: "Unavoidable shared utilities"
      rule: "B_lot=B_common*d_lot/sum(d_k), only for an evidenced relevant driver d; add directly metered lot burdens separately. Keep the physical quantities unchanged in the source ledgers."
      inputs:
        - cp_energy
        - "measured driver and other coproduct records"
      output: "attributed burden"
      source_ids:
        - ec-pef-allocation-2021
    - id: cohort_attribution
      applies_to: "Every external inventory row and stock transfer"
      rule: "Retain unallocated physical totals V_i separately from attributed totals A_i and the complete original provider vector, including upstream materials, utilities, freight and treatment. Carry ownership/cohort, physical quantity and that whole inherited vector through opening/WIP/finished stocks and every transfer; add only actual new services once. Direct burdens stay direct; shared burdens follow allocation_hierarchy and shared_burden. Normalize matched raw totals only through normalize_net_product, once. Failed, idle, cleanup and zero-Q records remain visible; unmatched services or Q<=0 leave normalized results unavailable."
      inputs:
        - cp_output
        - cp_material
        - cp_energy
        - cp_waste
        - cp_cleaning
        - cp_air
        - "original provider vectors"
      output: "Separate physical and attributed cohort ledgers"
      source_ids:
        - ec-pef-allocation-2021
    - id: packaging_cohorts
      applies_to: "pack_bag; pack_carton; packaging transfers and wastes"
      rule: "For each actual component/owner/cohort keep opening + P + N_ext + ER + internal_in = closing + EO + waste + internal_out. P is every purchased receipt, including packaging in an entire delivered price; N_ext is only first non-purchased external entry, not an internal reuse or genuine return. ER requires a documented earlier outward handoff of the same component; EO is gross actual external handoff, including packaging accompanying diapers. Record actual contents, tare, stocks, losses and ownership transfers. On consolidation cancel paired internal transfers only. Preserve original owner/cohort and full inherited provider vector for returns, reuse and transfers; non-purchased, free or uninvoiced items do not imply zero burden. Link an entire delivered provider or its disjoint component providers once, never both; no second production charge for the same return. Reconcile consumption for pack_bag/pack_carton to these events; this event ledger does not turn stock receipts into extra inventory purchases. Keep gross dispatch, freight and waste/treatment quantities separately; never net them against returns. Attribute actual new services to the served cohort before the single normalization, retaining earlier obligations as unavailable if evidence is missing. All packaging remains outside Q."
      inputs:
        - cp_material
        - cp_output
        - cp_waste
        - "component handoff history and provider vectors"
      output: "Component physical and burden reconciliation"
      source_ids:
        - ea-nappies-2008
        - ec-pef-allocation-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "All rows and reference"
      requirement: "Actual physical chemistry/form/route, Chinese official UUID display, reference property/unit and supplier reference basis separately verified. Blank identities or unresolved provider conversions block those dataset exchanges, not proof of zero."
      evidence: "Supplier specs; original identity fields; basis records"
    - id: dq_quantities
      applies_to: "All amounts"
      requirement: "No recipe, single-diaper mass, absorption multiplier or default emissions. Retain calibration, uncertainty, stock movements, actual component mass and allocation rationale for matching lots."
      evidence: "cp_output; cp_material; cp_energy; cp_waste; cp_cleaning; cp_air"
    - id: dq_scope
      applies_to: "Full dataset"
      requirement: "List all actual component, utility, loss and emission pathways, including embedded pigments/finishes, formulation solids and actual attributable maintenance consumables/spent streams. Actual phase, maintenance and water-path uncertainty requires evidence or reviewed atomic extensions before dataset completeness, not invented zero or guessed recipes. Extend atomic inventory before use when an actual missing material, fuel, steam, volatile species, water exit or waste appears. Missing periods/particle bins remain explicitly inconclusive."
      evidence: "Plant diagram; lot BOM/disassembly; monitoring and receiver map"
validation_rules:
  - rule_id: validate_reference
    applies_to: "diaper_output"
    rule: "Require exactly one complete product output tied to the reference, Q>0, net mass including all actual retained components, and matching 1 kg denominator in all rows/protocols/calculations and both languages. Reject packaging in Q, invented item masses, size mixing without lot separation and duplicate intermediate reference outputs."
    source_ids:
      - pampers-swaddlers-construction
  - rule_id: validate_boundary_identity
    applies_to: "conversion"
    rule: "Validate route, BOM, supplied-component states, upstream pulp boundary and supplier property/basis compatibility. Unresolved SAP/formulation/fastener/waste UUIDs and unknown grade conversions remain dataset blockers until resolved or documented absent. Do not silently use a near-name chemical or unrelated wastewater."
    source_ids:
      - jrc-pulp-paper-bref-2015
      - pampers-swaddlers-construction
  - rule_id: validate_conservation
    applies_to: "conversion"
    rule: "Require separate physical and burden ledgers, conserved internal links, packaging and reject stock reconciliation, and complete water/carbon balance with reported residuals/uncertainty. No automatic waste/coproduct credits or mechanical allocation of physical output. Check first-release Q, paired stage transfers, complete inherited provider vectors and packaging_cohorts/cohort_attribution; later services cannot silently enter an unrelated new-production denominator."
    source_ids:
      - ec-pef-allocation-2021
      - ea-nappies-2008
  - rule_id: validate_air_completeness
    applies_to: "pm_fine; pm_coarse; pm_large"
    rule: "Require correct outdoor-air medium, mutually exclusive particle intervals, actual exhaust/fugitive coverage and gas bases. Captured dust must not be counted as airborne emission. Missing monitoring is unknown, not zero; a total-only measurement cannot justify three resolved fractions. Additional real emissions require separately verified species/media."
    source_ids:
      - jrc-pulp-paper-bref-2015
  - rule_id: validate_claims
    applies_to: "Comparison and completeness"
    rule: "Do not compare a kilogram manufacturing unit with an excreta-containment service without separately evidenced count, tested function, usage and end-of-life scenarios. Report checks performed/skipped, errors, unknown coverage and unresolved provider identity separately from PCR maturity; an authored candidate is not independent scientific approval."
    source_ids:
      - ea-nappies-2008
published_dataset_profile:
  dataset_role: "foreground_module"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Transparent converter inventory for the defined design and measured route; aggregate with verified upstream and freight datasets"
  excluded_use: "Whole-class CPC coverage, service-equivalent comparison, use/end-of-life conclusions, other diaper routes or unresolved exchange amounts"
  required_metadata: "Product size/lot/BOM and QC; provider/grade/quantity bases; actual site/year; net mass/moisture and excluded packaging; all component/waste/air conditions; foreground/upstream/freight boundaries; complete source and flow references"
  required_quality_disclosure: "Unresolved identities/conversions, monitoring and period coverage, conditional absences, shared-burden drivers, balance residuals/uncertainty, reference physical subset and source limitations"
  update_trigger: "Changed formulation, web/film/fastener state, pulp route, utility delivery, QC specification, waste/emission route or newly resolved evidence"
