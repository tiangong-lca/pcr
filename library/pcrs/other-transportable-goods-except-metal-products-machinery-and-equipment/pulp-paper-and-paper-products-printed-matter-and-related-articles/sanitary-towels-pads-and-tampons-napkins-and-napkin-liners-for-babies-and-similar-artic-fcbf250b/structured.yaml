system_boundary:
  rules:
    - rule_id: boundary_complete
      applies_to: "conversion"
      rule: "Include receipt/handling, dry defibration, SAP dosing/core forming, web and film assembly, elastics/fasteners, actual coating, cutting, inspection/rejects, pack-out, dust collection and attributable electric auxiliaries. Explicitly retain upstream burdens for every input; do not present a converter module as a full lifecycle result."
      source_ids:
        - pampers-swaddlers-construction
        - ea-nappies-2008
        - pampers-manufacturing-traceability
    - rule_id: upstream_pulp_boundary
      applies_to: "fluff_pulp"
      rule: "Purchased pulp manufacture is upstream, including recovery/boilers and mill treatment. Supplier wet/AD/oven-dry bases must be reconciled with received mass. Do not bring sawmill evidence into pulp process quantities. Retain upstream biogenic CO2 exchanges and carbon origin even if a climate reporting convention excludes them from a subtotal."
      source_ids:
        - jrc-pulp-paper-bref-2015
    - rule_id: physical_network
      applies_to: "conversion"
      rule: "Aggregate manufacture and packaging into one foreground unit so the same complete product is output only once. Retain stage meters and a separate physical process diagram/balances. Each internal transfer has equal mass/identity at both ends; pair stage internal_out and internal_in with the same transfer ID, time, owner/cohort and complete inherited provider vector. Actual transformation consumes its incoming material and records resulting outputs/losses, without creating a fictitious receipt of that transformed material; internal recirculation and collected return are not external exchange or credited waste."
      source_ids:
        - ea-nappies-2008
    - rule_id: actual_air_path
      applies_to: "conversion"
      rule: "Inspect dry defibration/core-forming/cutting exhaust and fugitive pathways. BREF7.1.10 establishes possible paper-cutting dust, not a diaper/SAP factor. Keep capture and external particulate emission separate and measured; classify size and composition without correction flows. Additional actual volatilized species need separate verified elementary rows before dataset completion."
      source_ids:
        - jrc-pulp-paper-bref-2015
