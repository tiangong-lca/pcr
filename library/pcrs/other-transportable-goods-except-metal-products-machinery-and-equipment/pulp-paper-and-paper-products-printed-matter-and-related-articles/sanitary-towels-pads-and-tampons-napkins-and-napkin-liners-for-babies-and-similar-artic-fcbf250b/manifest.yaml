      qualification_EN: "The broad functional Coating identity represents the complete actual supplied balm coating, not a pure ingredient. Record delivered phase, full supplier formulation/SDS, water/volatile/solid fractions and delivery versus incorporated mass before background linkage. Separate actual application charge, retained amount, stock/return and purge; no chemical recipe or coating temperature is defaulted."
      qualification_ZH: "广义功能涂层身份表示实际供货整润肤涂层，而非某纯成分。连接背景前记录交付相态、供方完整配方/SDS、水/挥发分/固体比例及交付与留存质量基准。分别实测施加领用、留存、库存/退料及排料；不默认化学配方或施涂温度。"
    - row_id: "wetness_indicator"
      uuid: "59808a77-a33c-493f-8e5f-c0eb3e837943"
      qualification_EN: "The broad functional Coating identity represents this separately supplied complete pH-sensitive indicator coating. Verify actual supplied formulation/SDS, phase, colorant/carrier chemistry, water/volatiles/solids, application and compatible supplier mass; absent raw CAS does not verify a particular colorant. Charge, retained coating and independent purge remain separate measured accounts, without imposing a hot-melt, aqueous or solvent recipe."
      qualification_ZH: "广义功能涂层身份表示这一单独供货的完整pH敏感尿显涂层。须核实实际配方/SDS、相态、色料/载体化学组成、水/挥发分/固体、施涂及相容供方质量基准；原记录无CAS不证明具体色料。领用、留存涂层及独立排料保留实测分账，不强加热熔、水性或溶剂配方。"
    - row_id: "hook_fastener"
      uuid: "5b5f649d-db2b-426c-9bd2-aff11fce2e3a"
      qualification_EN: "The broad plastic-product identity locates this one actual finished PP mechanical hook component, not PP resin, a collection of fasteners or a metal part. Require the actual hook geometry, PP/additive composition, supplied subassembly state, process and compatible supplier reference mass; no molding route or fastening performance is inferred."
      qualification_ZH: "广义塑料制品身份仅定位这一实际已成型PP机械扣片，不是PP树脂、扣件集合或金属件。须核实实际钩形、PP/添加剂组成、供货子组件状态、制造过程及相容供方参考质量；不推定模塑路线或扣合性能。"
    - row_id: "cleaning_detergent"
      uuid: "1ee04905-0d1a-453e-9d3a-9ce612d79be0"
      qualification_EN: "The broad hard-surface cleaning-agent identity conditionally locates this one complete neutral aqueous delivered formulation. Confirm actual cleaning purpose, full grade/SDS composition, supplied concentration and measured pH, water fraction, dilution water, phase and compatible provider mass basis. It does not establish a laundry/soaping recipe, pure surfactant mass or supplier background."
      qualification_ZH: "广义硬表面清洁剂身份有条件定位这一完整中性水性供货配方。核实实际清洁用途、牌号/SDS完整组成、供货浓度及实测pH、水比例、另加稀释水、相态和相容供方质量基准。不由此确定洗衣/皂洗配方、纯表活质量或供方背景。"
    - row_id: "cleaning_wastewater"
      uuid: "bdfc32cf-8028-40a8-a2e4-2d73422ece34"
      qualification_EN: "The broad industrial liquid-waste identity locates only this independent whole wet aqueous stream delivered to the actual named external receiver. Weigh whole wet kg or convert actual volume with a measured representative density; record water, solids, cleaner and other contamination, collection stage and acceptance/treatment conditions. Keep H2O and contaminant subledgers without a second external waste/water exchange; no hazard class, generic disposal route, credit or freshwater release is inferred."
      qualification_ZH: "广义工业废液身份仅定位这一送至实际具名外部接收方的独立整湿水性物流。称量整湿kg，或用具代表性的实测密度换算实际体积；记录水、固体、清洁剂及其他污染、收集阶段和接收/处理条件。H2O及污染物作组分分账，不另列第二次对外废物/水交换；不推定危险类别、通用处置路线、信用或淡水排放。"
