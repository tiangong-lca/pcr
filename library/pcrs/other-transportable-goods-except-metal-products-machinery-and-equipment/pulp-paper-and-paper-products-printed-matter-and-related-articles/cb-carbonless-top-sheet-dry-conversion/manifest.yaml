review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_rows: []
  blocking_issues: []
  mapping_recommendation: Narrower scoped CPC3.0 32191 decision is recorded in the
    canonical mapping and separate controller acceptance evidence. Actual non-bulk
    dimensions/form and HS2022 heading4816 eligibility remain required; full batch
    validation and serial landing precede completion credit.
  independent_review: Primary-controller scoped document/source/native/measurement
    consistency review complete; independent scientific expert approval, normal-use
    lifecycle promotion and actual study qualification remain unestablished.
  evidence_limitations:
  - Koehler product-specific mechanism, delivery forms and cutting precautions establish
    physical scope only, not a universal microcapsule/dye/developer recipe, moisture
    mass fraction, yield or production quantities.
  - BREF 2015 section 7.1.10 supports general cutting dust, energy and trim screening;
    papermill broke recycling is not presumed at a dry converter.
  - UUID identity and future supplying-process compatibility are separate. Electricity
    requires actual 1–35 kV user delivery; wrapper requires actual uncoated paper;
    waste-paper identity does not establish hazardousness or recycling acceptability.
  - All quantities except the declared reference and exact unit conversion require
    actual foreground collection. No empirical dataset or producer manufacturing LCI
    has been supplied.
  source_flow_classification_review:
  - uuid: 936bdcb2-06b6-4ee9-8e7c-2f7762aba298
    rows:
    - paper_wrapper
    issue: CPC32129 graphic woodfree category is narrower than uncoated printing/writing/packaging
      material name/synonyms; no hard opposed material/route. Retain conditional single
      uncoated/unimpregnated paper-wrapper physical identity with source/provider
      classification clarification and actual grade/fillers/sizing/moisture/native
      mass basis pending.
  - uuid: faaae1a8-97af-4a26-bdb2-198abfc0d8e4
    rows:
    - cb_reel
    - cb_sheet_output
    issue: Native broad coated printing/writing/packaging-paper whole Product at plant,
      Mass; no roll/sheet, size or named coating-chemistry restrictor in name or route.
      CPC3214 parent is a source classification context, not the authoritative CPC32191
      mapping. Generic gloss/matte/varnish/AQ examples in comment are not used as
      CB recipe or provider evidence. Actual existing microcapsule coating, CB top-sheet
      function, input reel versus output unprinted loose nonbulk gate and same-grade
      quality are explicit qualifiers; controller scoped review accepts this broader
      physical whole-paper identity with explicit existing-CB-coating and gate qualifiers;
      no actual supplier compatibility is inferred. Do not replace CB production with
      protective/decorative coated-paper background.
  source_flow_comment_review:
  - uuid: 2a6c9b60-a075-45ec-b611-c3b4dd255935
    issue: English collector comment supports captured industrial particles; generic
      Chinese weekly housekeeping/non-degradability wording does not determine actual
      CB-coated cellulose particle biodegradability, hazard or collection frequency.
      Actual composition/status/receiver controls.
  quantity_link_review:
  - CN 1–35kV grid-average consumer electricity requires actual provider/region/year/mix/delivery/loss/native
    MJ basis; kWh conversion proves only unit conversion.
  - Purchased whole coated CB paper includes actual microcapsules, encapsulated liquid,
    binder and other existing coating ingredients once upstream; no supplier formulation
    or pure-cellulose carbon recipe is invented. Wet masses remain actual states;
    H2O is independent of other volatile liquids/drying loss.
  - Paper wrapper single uncoated/unimpregnated material only; full actual packaging/core
    custody/receipts/dispatch/reuse/loss/discard/stocks and actual cleaning/repair/transport/maintenance
    consumables need physical ledgers and separately verified positive exchange rows.
  - Air-particle Mass/kg integrates matched concentration*volumetric rate*time or
    average concentration*periodtotalgasvolume; do not multiply integrated volume
    by duration again or allocate unmeasured size fractions.
  - Natural room/paper water exchange screened with actual H2O/air humidity; no invented
    positive evaporation or zero uptake. Each established additional water/material
    release needs real query/direct/native chain before dataset completion.
  independent_review_history: Prior author research, original-source fragments, ten
    physical inventory rows, collection/calculation methods and historical UUID restrictions
    preserved. New whole coated-paper locator has no version in canonical content.
    Current source/reference check remains independent from provider and site quantity
    obligations.
  historical_independent_review: Prior draft and its historical review retained at
    commit 81e096fc915c95127fe0bb7012bac6ab8b489543. That review correctly rejected
    ordinary copy paper and lacked a whole CB locator. Current bounded broader coated-paper
    search and direct state100 read support a new proposed broad whole-product identity;
    prior hold is not represented as prior approval.
  readiness_authority: candidate/authored_methodology with primary-controller scoped
    source/native/method and bilingual review complete; scientific expert approval,
    actual study qualification and publication remain pending.
