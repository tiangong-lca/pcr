  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh accepted net paper mass D including existing coating and excluding packaging; measure each stream wet mass and water at its actual delivery/collection state, including existing coating. Compare different states in separate common dry-solids and H2O ledgers; do not convert received wet mass to an assumed gate moisture or change the wet reference amount."
