system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "convert"
      rule: "Keep purchased coated-reel production upstream; foreground starts with receipt and ends with accepted loose sheets and exported residues. Integrated coating or printing requires another applicable method."
      source_ids:
        - koehler-reacto-cb
        - jrc-paper-bref-2015
    - rule_id: boundary_completeness
      applies_to: "convert"
      rule: "Include material handling, rejected lots, electricity for extraction and room control, actual wrapping, waste destinations and boundary emissions. Add one atomic row for every actual ancillary material, packaging component, water exchange, maintenance consumable or refrigerant loss; absent activity needs documented non-applicability, not invented zero."
      source_ids:
        - jrc-paper-bref-2015
    - rule_id: boundary_loops
      applies_to: "convert"
      rule: "One foreground unit aggregates sheeting and packing, with independently metered stages. Keep stage handovers equal on both ends in the physical ledger; do not create a second final product exchange. Track actual returned reels, cores and removed incoming packaging by custody, material, count/unit mass, receipts/dispatch, actual reuse, damage/loss/discard, opening/closing stocks and receiver. Do not count circulating objects as new manufacture or assume reuse cycles; add actual cleaning/repair/transport and utilities. Consumed or discarded components require separate exchanges."
      source_ids:
        - jrc-paper-bref-2015
    - rule_id: boundary_packaging_receipts
      applies_to: "convert"
      rule: "Trace each actual packaging component and core from its first external physical receipt independently of procurement and ownership. A whole-package purchase price includes its components even without separate invoices: retain purchased input attribution. For first borrowed, rented, entrusted or other non-purchased accompanying packaging, preserve material, form, type, direction, raw unit, receipt quantity/time, origin, ownership, cohort, prior burden vector and provider; unknown prior vector remains unresolved. A returning object needs its actual earlier outward history. Internal reuse is not a new external receipt."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Traceable purchased reels with completed CB functional coating; cores and transport packaging accounted separately"
  starting_condition_role: "intermediate_product"
  product_classification_scope: "Small-format CB loose-sheet subset of CPC 3.0 32191; size criteria and mapping require independent determination"
  recursive_input_rule: "Same-category accepted-sheet rework remains a measured physical input linked to its supplying stage; do not recurse indefinitely, delete the input or count it as fresh accepted output"
  upstream_dataset_requirement: "Reel background must cover base paper and actual CB coating production, compatible formulation and delivery; a UUID alone does not establish background compatibility. Link inbound transport separately from the actual route."
  disclosure: "Declare converter-gate foreground boundary, upstream and transport links, material states, storage conditions and ancillary materials. Conversion-only burdens do not establish a full life cycle."
