  - id: moisture_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure moisture separately for product, trim and dust; w must be a measured wet-basis H2O fraction; dry mass equals wet mass times (1-w) only when the non-water fraction is proven to be that dry matter. Verify encapsulated liquids/solvents and other non-water volatiles separately, without treating all drying loss as water. Relative air or relative paper humidity is not wet-basis mass fraction and cannot be used to deduct water."
