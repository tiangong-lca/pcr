allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "convert"
    rule: "First investigate subdivision or system expansion to avoid allocation; use separate batch meters and direct attribution for subdivision. Expansion requires actual co-functions, empirically demonstrated substitution and representative boundaries, with results for the expanded system as a whole and no automatic waste credit. If neither applies, document a causal physical allocation basis; another basis requires justification and sensitivity analysis. Neither saleability nor mass alone establishes a coproduct credit."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical
    applies_to: "convert"
    rule: "Preserve the unallocated physical mass/water/carbon ledger separately from allocated environmental burdens. Do not multiply physical coproduct outputs or internal transfers by burden allocation shares. Record waste as physical exports; recovery credit requires the applicable end-of-life method and verified receiver, without duplicate avoided-production credit."
    source_ids:
      - eu-pef-2021
      - jrc-paper-bref-2015
  - rule_id: allocation_row_cause
    applies_to: "all inventory rows"
    rule: "Preserve original quantities, integrate actual rates once and convert the recorded scope first; then subdivide separately metered stages and attribute each exchange by its measured physical cause. Only a demonstrated same-stage residual shared among actual co-functions may use contemporaneous stage-specific relative values after causal physical attribution is unavailable, with actual quantities/prices, justification and sensitivity. Normalize A/Q once at the end. Do not allocate every exchange by one revenue ratio or invent substitution credit."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_history
    applies_to: "convert"
    rule: "Raw/unused inputs, work in progress and finished goods at opening/closing carry their actual per-flow inherited burden vectors. Keep newly incurred burdens separate. Historical rework, customer returns and redelivery retain earlier vectors plus only actual incremental handling/conversion. Do not charge opening FG inherited manufacture again to new-lot Q: preserve each original cohort's recorded first-accepted net quantity Q_original and attribute only actual incremental service burdens to the cohort served. Its correction per kg is incremental A_service / Q_original, never divided by new-lot Q or serviced/retested quantity; retain an unknown original quantity as an unresolved raw correction. Converted or inspected service quantity and handling counts do not create new accepted-product denominators. Keep burdens of failed lots, Q-zero runs, idle, cleanup and start/stop; document their causal attribution and period linkage."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "convert"
      flow_role: "cb_sheet_output"
      record_type: "weighing"
      raw_fields: "batch; grade; coating side; dimensions; moisture basis; accepted mass D; packaging tare"
      collection_method: "Calibrated weighing of accepted net paper, dimension inspection and capsule-damage/supplier-compatible quality evidence; reconcile packaging tare."
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "declared complete operating period"
      site_scope: "selected converter line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration, acceptance records, supplier specification"
    - protocol_id: cp_material
      process_id: "convert"
      flow_role: "cb_reel; paper_wrapper"
      record_type: "material balance"
      raw_fields: "opening; receipts; closing; returns; tare; supplier; grade; batch; moisture; validated H2O/non-water volatile fractions; coating/capsule composition; actual packaging/core custody"
      collection_method: "Weigh each material and reconcile stocks; separate coated reel paper from wrapper. Account for cores and removed packaging separately; add separate rows for other actual materials."
      unit: "kg"
      frequency: "each batch and stock closing"
      temporal_coverage: "same period as accepted output"
      site_scope: "selected converter line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "receipts, stocks, returns and supplier basis"
    - protocol_id: cp_energy
      process_id: "convert"
      flow_role: "electricity"
      record_type: "meter"
      raw_fields: "meter start/end; submeter; voltage; CN source versus actual site/provider geography/year/mix; supply point/loss coverage; line time; auxiliary loads; D"
      collection_method: "Calibrated meter reads synchronized with cutting, extraction and packing auxiliaries; verified driver for shared loads; actual supply point compatible with background consumption mix."
      unit: "kWh; MJ"
      frequency: "each batch"
      temporal_coverage: "same period as accepted output"
      site_scope: "actual electrical supply boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration, wiring, supplier and loss boundary"
    - protocol_id: cp_residue
      process_id: "convert"
      flow_role: "coated_trim; wrapper_trim; captured_dust"
      record_type: "weighing"
      raw_fields: "stream id; wet mass; moisture; fibre/coating composition; microcapsules and encapsulated non-water liquids; H2O; contamination; stock/internal return; waste status; destination; receiver; D"
      collection_method: "Weigh trim and collector dust separately, preserve composition/contamination; reconcile dispatch and actual receiver requirements, with equal internal-loop quantities at both ends."
      unit: "kg"
      frequency: "each collection and dispatch"
      temporal_coverage: "same period as accepted output"
      site_scope: "each stream leaving the converter line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale, waste transfer record, receiver approval"
    - protocol_id: cp_air
      process_id: "convert"
      flow_role: "pm25_air; pm25_10_air; pmover10_air"
      record_type: "measurement"
      raw_fields: "outlet; sample time; size fraction; concentration; dry/wet gas volume basis; gas T/P/conditioning; total sampled volume versus volumetric rate; duration; capture; fugitive escape; detection limit; D"
      collection_method: "Use calibrated outlet- and size-appropriate sampling, retaining method performance, detection limit and gas-volume state; cover outlets and actual fugitive boundary escape. Use matched concentration/gas T/P/wet-dry/conditioning bases: integrate C(t) times volumetric flow rate, or a demonstrated comparable average concentration times the entire matching period gas volume. Never multiply an already integrated volume by duration again. Do not invent size splits."
      unit: "kg"
      frequency: "representative operating-state sampling and period integration"
      temporal_coverage: "same period as accepted output"
      site_scope: "outdoor-air site-boundary releases"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "raw sampling, flow-meter calibration, gas state and representativeness"
    - protocol_id: cp_campaign
      process_id: "convert"
      flow_role: "all inventory rows"
      record_type: "lot and burden ledger"
      raw_fields: "lot/cohort; first-release time; Q; opening/closing raw/unused/WIP/FG; gross V by direction; inherited per-flow vector; incremental A; rate/time and original unit; stage/cause; failure/idle/cleanup/start-stop; service/handling quantity; original cohort first-accepted net quantity Q_original; incremental A_service; actual residual co-functions and contemporaneous prices"
      collection_method: "Link calibrated primary records to first quality release and stock movements; keep physical quantities and burden vectors separate, attribute by exchange cause, and retain failed-period burdens."
      unit: "original unit; kg; kWh; MJ"
      frequency: "each movement and first release; period closing"
      temporal_coverage: "same complete campaign and linked historical cohorts"
      site_scope: "selected line and measured shared stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "lot acceptance, stock reconciliation, raw meters, causal drivers and inherited vector provenance"
    - protocol_id: cp_packaging
      process_id: "convert"
      flow_role: "actual wrapper; cores; incoming and reusable packaging components"
      record_type: "receipt and custody ledger"
      raw_fields: "component/material/form/type/direction; raw unit; count and unit mass; receipt/time/origin/ownership/cohort; purchase inclusion; provider; prior vector; prior outward record; opening/closing empty/raw/WIP/FG/reusable; dispatch/returnout/waste; cleaning/repair"
      collection_method: "Establish first external physical receipt separately from purchasing/ownership, then reconcile every physical leg; count each whole article provider once and keep component analysis as a subledger. Internal reuse creates no new first receipt."
      unit: "actual raw unit; count; kg"
      frequency: "each receipt, movement and stock closing"
      temporal_coverage: "same campaign plus evidenced return history"
      site_scope: "every packaging state at converter boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "receiving notes, package price scope, ownership contract, stock counts, provider coverage and actual outward/return records"
    - protocol_id: cp_transport
      process_id: "convert"
      flow_role: "actual inbound/outbound packaging, materials and residues"
      record_type: "route records"
      raw_fields: "stream and cohort; gross leg/direction; actual loaded mass; distance; vehicle/mode/load; empty return; fuel/service basis; provider coverage"
      collection_method: "Retain each physical dispatch and return leg without netting. For mass-distance service convert measured kg to tonnes once, multiply by actual km once; separate a provider transport service from any duplicated own vehicle fuel. Add a verified atomic exchange for each actual service or fuel before dataset completion."
      unit: "kg; km; tkm; actual provider unit"
      frequency: "each leg"
      temporal_coverage: "same campaign and linked return legs"
      site_scope: "actual transport boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "waybills, weighbridge, route evidence and provider transport boundary"
  calculation_rules:
    - id: normalize_records
      applies_to: "all inventory rows"
      rule: "Divide each attributable row total for the same period by D to obtain the amount per 1 kg reference flow; finished reference row is fixed at 1 kg."
      inputs:
        - "row total"
        - D
        - cp_output
      output: "exchange amount per 1 kg reference flow"
      source_ids: []
    - id: electricity_units
      applies_to: "electricity"
      rule: "MJ = kWh × 3.6; normalize with the same D."
      inputs:
        - "meter kWh"
        - D
        - cp_energy
      output: "MJ per 1 kg reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "convert"
      rule: "Keep an unallocated physical ledger: net paper-and-coating inputs + opening work in progress = accepted sheets + trim + captured dust + air particles + closing work in progress + other measured releases. Separate dry-solids and water balances before comparing different moisture states; balance packaging separately. Report residuals without forcing invented zero."
      inputs:
        - cp_material
        - cp_output
        - cp_residue
        - cp_air
      output: "physical balance and residual"
      source_ids:
        - jrc-paper-bref-2015
    - id: pm_exclusive
      applies_to: "pm25_air; pm25_10_air; pmover10_air"
      rule: "For matched cumulative measurements, 2.5–10 fraction = PM10 - PM2.5 and >10 fraction = total particles - PM10. Negative differences or different bases require investigation. Unmeasured fractions remain unresolved, without size factors."
      inputs:
        - "matched cp_air samples"
      output: "exclusive particle amounts"
      source_ids: []
    - id: pm_mass_basis
      applies_to: "each air-particle row"
      rule: "m_kg = 10^-6 * integral(C_mg_per_m3(t) * Vdot_m3_per_time(t) dt), or proven comparable average C * matching period total V * 10^-6. Convert mg to kg once and divide by D once. Match concentration and gas T/P/wet-dry/conditioning bases; do not multiply cumulative gas volume by duration or assume gas state/bin shares."
      inputs:
        - cp_air
        - cp_output
      output: "exclusive particle kg per 1 kg reference flow"
      source_ids: []
    - id: campaign_stock_vectors
      applies_to: "convert"
      rule: "Q equals first-released new-lot net kg including closing FG. For each stock state: opening + gross inward = gross outward + closing + measured loss, with internal stage handovers equal. In physical_balance accepted sheets denotes first release Q; the separate FG ledger reconciles opening FG + Q + actual returns = gross dispatch + closing FG + actual rework/discard; no closing-FG subtraction from Q. Carry actual per-flow historical vectors separately from physical V and incremental A; normalize each final A by Q once. Q-zero burdens remain linked unresolved quantities until attributed."
      inputs:
        - cp_campaign
        - cp_output
        - cp_material
        - cp_residue
      output: "reconciled physical stocks and inherited/incremental burden vectors per 1 kg reference flow"
      source_ids: []
    - id: packaging_legs
      applies_to: "convert"
      rule: "Reconcile each component/cohort/state: opening + gross receipt + internal inward = gross dispatch + returnout + waste + internal outward + closing + measured loss. Separate purchased first receipt, non-purchased first external receipt and evidenced external return; internal legs cancel only on aggregation. Do not net physical transport legs or count whole-container manufacture and the same component manufacture twice."
      inputs:
        - cp_packaging
        - cp_campaign
        - cp_residue
      output: "complete component stocks, custody, first-receipt and provider attribution"
      source_ids: []
    - id: transport_basis
      applies_to: "convert"
      rule: "For a provider with native tkm, physical service = actual loaded kg / 1000 * actual km for each leg; integrate a rate over its actual time only once. Convert original units and provider scope before causal attribution, then divide A by Q once. Preserve empty-return activity in its actual service or vehicle basis; do not invent cargo for an empty leg."
      inputs:
        - cp_transport
        - cp_campaign
        - cp_output
      output: "actual transport service and attributable amount per 1 kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_supplier
      applies_to: "cb_reel; cb_sheet_output"
      requirement: "Traceable reel and finished states; upstream includes actual coating, without substitution by uncoated or ordinary copy paper."
      evidence: "supplier declaration and upstream compatibility"
    - id: dq_time
      applies_to: "all inventory rows"
      requirement: "One site and period for inventory, output, stocks and burden attribution; cover downtime, rejects, changeovers and auxiliaries."
      evidence: "complete primary campaign records"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Unknown formulation, emissions or supplier basis are unresolved, not zero. Unmeasured carbon forms do not establish zero biogenic CO2; if a later route introduces combustion or degradation, add actual biogenic/fossil CO2 species rows and carbon balance and retain the complete LCI."
      evidence: "route audit, mass/water/carbon reconciliation"
    - id: dq_stock_provider
      applies_to: "all inventory rows"
      requirement: "Each actual whole CB reel includes paper plus actual capsule wall, encapsulated liquid, binder and other existing coating once in its manufacturing provider. Component chemistry/analysis is a subledger, not another manufacture exchange. Unknown composition, density, water/solids, species/phase, retention, yield, price or provider scope requires actual evidence; pure paper, wood or polymer does not stand for the whole coated output. Finished-product components in raw/WIP/FG and all physical losses remain in stocks and net-mass checks."
      evidence: "supplier whole-product coverage, formulation/SDS or analysis, stage stocks, actual rates/units and provider exchange ledger"
    - id: dq_packaging
      applies_to: "convert"
      requirement: "Document every first external packaging receipt and actual outward/return/waste leg, ownership and purchase inclusion independently. Resolve unknown prior vectors and provider coverage before dataset completion; absent separate component invoice is not absence of purchase."
      evidence: "cp_packaging reconciliation and cp_transport gross-leg evidence"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Reject CF, CFB, SC, carbon-transfer, bulk reel, printed or bound-form datasets under this method. Require actual sheet dimensions, non-bulk classification evidence, CB grade and supplier-specific performance; reference identity must be verified."
    source_ids:
      - koehler-reacto-cb
      - koehler-reacto-practical
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Exactly one product output is the 1 kg reference. Require the same D across collection and calculations in both languages. Check net mass, packaging exclusion, separate moisture bases and energy conversion."
    source_ids: []
  - rule_id: validate_environment
    applies_to: "convert"
    rule: "Require disjoint PM fractions and receiver-qualified waste identities; do not count collector dust as air release. Source measurements must establish outdoor-air boundary escape; missing sampling is incomplete evidence, not passed validation. Any unexpected wet or combustion route requires boundary and atomic-row reassessment."
    source_ids:
      - jrc-paper-bref-2015
  - rule_id: validate_quality
    applies_to: "convert"
    rule: "Check capsule damage, grade, orientation and copy-quality acceptance without transferring producer blade angles, relative humidity or service-life figures into generic LCI defaults. UUID support establishes identity only; separately verify provider, quantity basis and background boundary."
    source_ids:
      - koehler-reacto-practical
  - rule_id: validate_campaign
    applies_to: "convert"
    rule: "Verify Q first-release uniqueness, closing FG inclusion, all stock states and physical legs, inherited per-flow vectors, actual incremental cause and failed/idle burdens. Require actual provider coverage once for each whole article and each separately supplied exchange; component analyses do not duplicate whole manufacturing. Unresolved additional ordinary inputs are specific data obligations; they do not establish a different physical branch or justify a false reference identity."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "After identity, foreground collection and review, modelling same-grade small-format CB conversion with declared upstream links"
  excluded_use: "No substitution for pulping, coating production or complete printed/glued forms; no cross-grade functional equivalence; the broad identity does not establish CB supplier or background compatibility"
  required_metadata: "Grade, coating side, size criterion, net-mass/moisture basis, packaging, site/period, suppliers/transport, UUIDs and background bases"
  required_quality_disclosure: "Measurement coverage, unresolved identities and quantities, size sampling, allocation and separate physical ledger, non-bulk classification evidence"
  update_trigger: "Coating grade/route change; terminal conversion added; supplier/voltage/packaging/recovery changes; new sampling or identity correction"
