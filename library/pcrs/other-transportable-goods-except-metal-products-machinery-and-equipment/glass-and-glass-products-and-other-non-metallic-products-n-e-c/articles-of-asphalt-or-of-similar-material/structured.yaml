system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "manufacture"
      rule: "Cover receipt/storage and actual preparation of complete materials, filler conditioning/mixing, whole-mat asphalt impregnation/coating, mineral surfacing/backsurfacing, cooling, trim/cut/wind and first complete QC release. Record all failure/zero-output, startup/shutdown, idle, cleanup, unreleased rework, dust/water controls and their utilities/wastes. No onsite asphalt oxidation, mat formation, granule coating, polymer modification, shingle lamination or roof installation is inferred."
      source_ids:
        - arma-residential-manual-2014
        - tarco-fiberglass-msr
    - rule_id: b_owner
      applies_to: "all inventory rows"
      rule: "Purchase a complete cured mat or externally filled coating once with all embedded binder, additives, carrier water and filler as subledgers only. For actual onsite filled coating, collect every separately purchased ingredient and real heating/mixing losses. When a complete filled formulation is supplied, add its own single atomic identity and suppress only its included ingredient purchases. Do not suppress separate new material/water because it remains in closing stock; any actual unlisted material or species must be added."
      source_ids:
        - arma-residential-manual-2014
        - tarco-fiberglass-msr
    - rule_id: b_gate
      applies_to: "finished_roll"
      rule: "Q is the sum of actual single-face projected material area of complete rolls at their unique first quality release. Closing FG already first-released is included in Q; do not add closing FG again as production or subtract its manufacturing burden. Reinspection, dispatch, external return and post-release processing never create a new first-release output. Maintain gross shipments/returns and FG changes by actual area, mass, configuration and moisture, without treating returned mass as unchanged original delivery."
      source_ids:
        - arma-residential-manual-2014
        - tarco-fiberglass-msr
    - rule_id: b_vectors
      applies_to: "manufacture"
      rule: "For each exchange-specific inherited burden vector, use opening raw/WIP/unassigned stores plus current attributable burden, less closing raw/WIP and genuinely unused/unassigned stores, plus legitimate incoming transfers and less only justified outgoing functional/cohort transfers. Closing manufacturing B excludes already released FG. Retain rejects, samples, ordinary waste and their treatment burdens even if sold or exported; a real other cohort/function and justified handover/allocation are needed for one vector transfer. Internal rework carries its vector and only real additional work; no repeated upstream charge and no second stock correction."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: b_service
      applies_to: "service"
      rule: "Retain actual storage/packing/handling/dispatch and permitted post-release work separately against original cohort Q and observed horizon, including service on FG still stored. Only unused/unassigned service/charge carries forward. Postwork needs manufacturer/specification permission, tests, acceptance and disposition; damaged roll is not assumed restorable. Keep old/new parts, every water phase and new losses atomic. At consolidation cancel internal first-release transfers once; do not sum manufacturing Q and closing FG as independent products."
      source_ids:
        - arma-residential-manual-2014
        - ilcd-detailed-2010
    - rule_id: b_physical
      applies_to: "all inventory rows"
      rule: "Maintain independent mass and relevant element balances at manufacturing, FG/service and combined facility gates. Manufacturing physical closing stock includes raw/WIP/unassigned stores and applicable installed parts/fluids, but released product leaves this gate once, including its later closing FG. The combined gate instead includes opening/closing FG, actual gross external roll legs, packaging, assets, wet stocks, air species and carrier water. Cancel only internal transfers. Gross physical amounts are never scaled by burden allocation shares. Require independent composition/species/water-state evidence; one residual cannot fit two unknowns."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: b_pack
      applies_to: "service"
      rule: "This ledger spans receipt and actual attachment before or after quality release; each actual packaging operation is assigned once to its recorded manufacturing/cohort-service gate. For each packaging material separately: opening empty + attached WIP/FG + reusable stock + P + I + ER + F_in = closing empty + attached WIP/FG + reusable stock + S + EO + W + F_out, in consistent measured mass/state. P is paid standalone or bundled, I first non-purchased external ingress, ER external return received, S packaging on gross physical dispatch, EO external return sent, W waste. F_in/F_out are independently measured material/water additions/removals across this article pool, disjoint from contents already inside the corresponding whole-article legs. Trace each origin/destination and its component/whole-article bridge; internal pool/repair transfers pair and cancel once at consolidation, without creating another purchase/provider. X_in/X_out remove only documented overlap with another already-counted SAME-SIDE gross inlet/outlet term; a closing stock is never such an overlap term. Internal reuse cancels; preserve all six whole-article legs and their separate empty/attached/reusable wet stocks. Preserve actual new influx and full closing wet mass together. Do not put packaging in Q or buy reused assets again; upstream owner once, no automatic coproduct or credit."
      source_ids:
        - arma-residential-manual-2014
        - ilcd-detailed-2010
    - rule_id: b_airwater
      applies_to: "manufacture"
      rule: "Retain actual gas species and phases for inlet air, exhaust, cooling evaporation, condensate, entrainment, liquid transfers and treatment. Integrate genuine rates over their measured time only; an integrated gas/liquid volume is not multiplied by time again. Use independent substance/state-specific density, measured thermal state and enthalpy. Steam/hot-water carrier kg and purchased heat MJ are linked without double purchase or invented boiler. VOC/PAH/PM/COD/NOx totals remain indicators until species are independently identified; unknown speciation is not a zero or a fabricated molecule."
      source_ids:
        - arma-residential-manual-2014
        - ilcd-detailed-2010
    - rule_id: b_assets
      applies_to: "manufacture"
      rule: "Keep physical equipment/tooling inventory separate from attributable current service burden. Preserve opening/closing installed mass, each actual new/old repair part, lubricants and water with their real X_in/X_out. X terms deduplicate only other gross incoming/outgoing terms, never remove an influx because its material remains installed. No fixed service life, universal wear rate or whole machine per m2. Collect actual offsite freight and outsourced operations as separately identified service atoms with gross load/distance/mode and provider boundaries; supplier-included service is owned once."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. F_in/F_out remain separate independently measured actual material/water changes, not a substitute for whole-article receipt. In this packaging-pool account X_in/X_out mean only documented overlap deductions against another already-counted SAME-SIDE gross inlet/outlet term, never closing stock or the actual F change. Asset/water raw records retaining a gate-specific X label keep that scoped meaning; if their actual event crosses this packaging pool, bridge the measured movement to packaging F_in/F_out rather than treating the legacy label as an overlap deduction. When complete records demonstrate no same-side duplicate, the packaging X deduction is zero; unknown overlap remains unresolved. Retained new material/water remains both a real input and full closing wet mass. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - ilcd-detailed-2010
