              collection_protocol_id: cp_service
              source_ids:
                - arma-residential-manual-2014
                - ilcd-detailed-2010
            ranges: []
      elementary:
        []
allocation_rules:
  - rule_id: a_framework
    applies_to: "all inventory rows"
    rule: "Use this attributional profile only in a study context requiring allocation; do not freely substitute consequential avoided-production credits. Identify actual functions and gates before allocation."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_hierarchy
    applies_to: "all inventory rows"
    rule: "First collect dedicated subprocesses and apply real or virtual subdivision. Then determine each remaining exchange’s physically determining causal relationship, including service duration and its true limiting capacity where relevant. No universal mass, area or economic key. Only genuinely inseparable residual common-process burdens use contemporaneous market value of actual cofunctions at their common process gate and actual state, with price/source/time/currency and sensitivity disclosed."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_waste
    applies_to: "all inventory rows"
    rule: "A receipt, waste sale or external recycling route is not proof of an independent function or avoided burden. Retain ordinary manufacturing rejects, cleanup, samples and treatment. A justified real other cohort/function handover may transfer its burden vector once, while gross physical mass still balances unscaled; no fixed allocation proportions or automatic credits."
    source_ids:
      - ilcd-detailed-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "finished_roll"
      record_type: "first-release record"
      raw_fields: "lot; configuration; actual single-face area; net product mass; measured moisture; first acceptance timestamp; tests; Q; opening and closing WIP/FG"
      collection_method: "Calibrate length/width or design-specific area measurement and net weighing; join each unique whole-roll quality-release record. Record all rejects/samples/rework and verify no second first release."
      unit: "m2; kg"
      frequency: "each roll and period closure"
      temporal_coverage: "Declared manufacturing period and first-release cohorts"
      site_scope: "Manufacturing line and acceptance gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; dimensions; test/acceptance records; unique lot bridge"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "each named material"
      record_type: "raw receipt and stock record"
      raw_fields: "material and lot; supplier; whole formulation owner; received gross and net mass; embedded package I; composition; wet/dry state; opening/closing raw and WIP; inherited exchange vector"
      collection_method: "Weigh receipts and stocks on calibrated scales; verify supplier specifications and all composition subledgers. Trace actual batch issues, losses and transfers; retain raw amounts before conversion/allocation/normalization."
      unit: "kg"
      frequency: "each receipt, batch and period closure"
      temporal_coverage: "Complete period including failed and zero-output batches"
      site_scope: "Receipt through first-release material gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale certificates; stock counts; SDS/specs; moisture; issue/return slips"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "each named electricity or fuel"
      record_type: "raw meter and fuel record"
      raw_fields: "meter; carrier; original amount/unit; integrated versus rate; time; voltage; geography; composition; T/P/Z; density; heating value; opening/closing stock; phase and cohort"
      collection_method: "Read calibrated meters and fuel receipts; independently convert actual rate/unit/state and separate manufacturing from service. Record startup/idle/cleanup and dedicated/shared causality before a single normalization."
      unit: "original kWh; MJ; m3; kg"
      frequency: "continuous or each supply and period"
      temporal_coverage: "Full manufacturing period"
      site_scope: "Actual line and shared utilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meters; invoices; state/composition tests; allocation evidence"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "each named water function"
      record_type: "raw water record"
      raw_fields: "water source; function; original mass or integrated volume; phase; state; independent density; opening/closing wet stock; actual X_in/X_out; internal circulation; drain and evaporation destination"
      collection_method: "Use calibrated supply/function meters or weighing; close separate water-phase balances using independent sampling. Preserve real influx and complete wet closing mass; remove only duplicate outgoing/incoming representations."
      unit: "kg; original m3"
      frequency: "continuous, each intervention and closure"
      temporal_coverage: "Complete manufacturing and maintenance period"
      site_scope: "Water and wet-stock gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter/scale calibration; sampling; phase/state and stock records"
    - protocol_id: cp_heat
      process_id: "manufacture"
      flow_role: "each external heat carrier and return"
      record_type: "raw carrier and heat record"
      raw_fields: "provider; water/generation owner; incoming and returned carrier mass; phase; T/P; dryness; enthalpy; useful heat; drain; vent; stock change"
      collection_method: "Only actual external supplies; measure each carrier/return and heat at declared thermal states. Reconcile provider convention and internal circulation without duplicate purchase."
      unit: "kg; MJ"
      frequency: "each supply and return with period closure"
      temporal_coverage: "Actual utility horizon"
      site_scope: "Supplier to foreground and return gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Contracts; calibrated mass/thermal meters; enthalpy/state basis"
    - protocol_id: cp_asset
      process_id: "manufacture"
      flow_role: "each named asset or maintenance material"
      record_type: "raw asset/part/fluid record"
      raw_fields: "asset/part ID; composition; opening and closing new/installed mass; acquisition; commissioning; usage; service vector; old part out; new part in; water/fluid state; X_in/X_out; repair and retirement"
      collection_method: "Inventory complete physical assets and each actual intervention; separately establish cohort service burden from observed use and justified allocation. Preserve true inputs plus closing installed wet mass, and avoid duplicating parts/fluids already in a whole asset."
      unit: "kg; observed service units"
      frequency: "each intervention and closure"
      temporal_coverage: "Asset history and observed service period"
      site_scope: "Installed and stores inventory"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset BOM; maintenance records; scales; service/stock bridge"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "each named waste"
      record_type: "raw waste transfer record"
      raw_fields: "stream; lot; current wet mass; water/solid composition; treatment recipient; sampling; internal recycle; inherited vector; ordinary waste versus genuine other function"
      collection_method: "Weigh and sample every actual outgoing waste and retained stock; quantify treatment burden and segregated destination. Preserve ordinary rejected-product burdens, and document any legitimate vector handover separately."
      unit: "kg; original integrated m3"
      frequency: "each stream transfer and closure"
      temporal_coverage: "Full period including cleaning and failures"
      site_scope: "Generation, retained stock and named recipient"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weighbridge; analysis; receiver/treatment records; waste stock"
    - protocol_id: cp_air
      process_id: "manufacture"
      flow_role: "each molecular or particulate species"
      record_type: "raw species measurement"
      raw_fields: "source; inlet/outlet; actual species and CAS; phase; size bin; medium; integrated gas volume or true flow rate; time; T/P; dry/wet/O2 correction; mass concentration; origin; detection limit; control/capture/bypass"
      collection_method: "Sample actual point/fugitive inlet and outlet conditions; independently identify species and rate/state conventions. Integrate only true rates; reconcile total/size/phase without overlapping bins or estimating species from VOC/PM/NOx/COD totals."
      unit: "original concentration and gas units; kg"
      frequency: "continuous or representative complete campaigns"
      temporal_coverage: "All operational phases and actual controls"
      site_scope: "Actual media and release points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Laboratory methods; calibration; detection limits; original monitor and state records"
    - protocol_id: cp_pack
      process_id: "service"
      flow_role: "each packaging material and each P/I/ER/S/EO/W leg"
      record_type: "raw package record"
      raw_fields: "material; composition; upstream owner; opening/closing empty and attached WIP/FG and reusable stock; P; I; ER; S; EO; W; gross physical dispatch; measured moisture; cohort; actual X duplicates ; packaging receipt origin; payment/non-purchase evidence; owner/custodian; same-item prior outward ID; F_in; F_out; actual_material_water_change; pool_origin_destination; whole_component_overlap_bridge; X_in; X_out; same_side_OTHER_term"
      collection_method: "Count and weigh matched actual packages and all six gross legs; measure mass for the same configuration, water state and range. Record first non-purchased external physical ingress even if included financially; internal reuse cancels and new influx remains with full closing wet mass.  For packaging only, apply packaging_receipt_basis; standalone non-purchase is I, never invented ER or X. Independently measure additions/removals F_in/F_out and full wet stocks; exclude only amounts already contained in the corresponding whole-article leg. Trace internal material/water transfers to the donor/receiver pool for one consolidation cancellation. X deduplication requires the exact other already-counted same-side inlet/outlet; it never removes new repair material/water because it remains in closing stock. Unknown change/overlap remains unresolved, not zero."
      unit: "kg; actual counts"
      frequency: "each movement and closure"
      temporal_coverage: "Original cohorts and declared service horizon"
      site_scope: "Empty, attached and reusable package gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weigh/count calibration; supplier owner; gross dispatch and return documents"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "each incremental post-release exchange"
      record_type: "raw cohort service record"
      raw_fields: "original cohort; its unique first-release Q; observation horizon; opening/closing FG; gross G and R; actual current mass/area/state; performed service; unused/unassigned charge; permission; posttests; acceptance/disposition; actual new parts/water and losses"
      collection_method: "Meter/weigh actual incremental cohort services; retain services already performed on closing FG. Trace original burden, permission and postwork tests; do not reconstruct first-release quantities from gross/net delivery or returned weight."
      unit: "original extensive units"
      frequency: "each service and observed horizon closure"
      temporal_coverage: "Original first-release cohort plus explicit horizon"
      site_scope: "FG, warehouse, dispatch and permitted postwork"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original acceptance bridge; meters; permission/tests; stock/return/disposition records"
  calculation_rules:
    - id: prepare_raw
      applies_to: "all inventory rows"
      rule: "Convert raw original units and actual rates to one extensive amount by row before allocation; already integrated quantities have time factor 1. Keep every measured physical gross leg separately. Use independent substance/state density only when mass-volume conversion is needed."
      inputs:
        - raw_records
        - conversion_basis
        - state
        - time
      output: "converted_raw"
      source_ids:
        - ilcd-detailed-2010
    - id: cohort_attribution
      applies_to: "all inventory rows"
      rule: "Preserve each actual gross physical leg and its recorded cohort assignment; packaging and repair/water legs are never multiplied by environmental-burden shares. Keep its burden vector separate: assign dedicated burdens first, then documented subdivision/causality and only real residual market-value allocation under a_hierarchy. Reconcile exchange-specific opening/closing raw/WIP/unassigned burden vectors and legitimate transfers under b_vectors; no released-FG subtraction, ordinary-waste deduction or second stock correction. A labels each separately identified physical numerator or burden-vector component; never replace one with the other."
      inputs:
        - converted_raw
        - allocation_evidence
        - inherited_vectors
        - transfer_decisions
      output: "A"
      source_ids:
        - ilcd-detailed-2010
    - id: release_quantity
      applies_to: "finished_roll"
      rule: "Q = sum of calibrated actual single-face projected material areas of uniquely first-released complete rolls. No second release, installed overlap adjustment or packaging area."
      inputs:
        - cp_release
        - unique_acceptance
        - actual_geometry
      output: "Q"
      source_ids:
        - arma-residential-manual-2014
        - tarco-fiberglass-msr
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "For Q > 0, x = A / Q once, in each numerator native extensive unit per 1 m2 reference flow; for services use the original cohort Q and actual observed-horizon A. For Q = 0 retain A with no unit result. This is the only A/Q operation for each explicitly labelled physical or burden ledger; amount cards reuse physical x and aggregation reuses that same result. Gross reconciliation records stay unscaled."
      inputs:
        - A
        - Q
        - original_cohort
        - service_horizon
      output: "x"
      source_ids:
        - ilcd-detailed-2010
    - id: physical_balances
      applies_to: "all inventory rows"
      rule: "At each physical gate: opening full wet stock plus actual gross incoming = closing full wet stock plus actual gross outgoing, with internal transfers cancelled once. Manufacturing, FG/service and combined gates have the distinct stocks specified in b_physical. Package balance uses b_pack independently for each material. Repair-water X terms remove duplicate other flow terms only, not new influx retained in stock. Validate relevant element/species balances independently; no fitted residual for multiple unknowns."
      inputs:
        - gross_legs
        - stocks
        - species
        - moisture
        - X_duplicates
      output: "physical_balance_report"
      source_ids:
        - ilcd-detailed-2010
  data_quality_requirements:
    - id: dq_terminal
      applies_to: "finished_roll"
      requirement: "Complete solid glass-mat/asphalt/mineral roll identity and unique first QC release, with all qualifiers and actual independent tests. No source default rating or service life."
      evidence: "Supplier specifications; acceptance and geometry evidence"
    - id: dq_raw
      applies_to: "all inventory rows"
      requirement: "Retain original records, units, calibration, coverage, zero-output intervals, failed batches, detection limits and unknown values. Missing is distinct from measured zero and proven absence."
      evidence: "All collection protocols and original files"
    - id: dq_vectors
      applies_to: "all inventory rows"
      requirement: "Audit exchange-specific inherited vectors, actual physical gross balances and one normalization separately; packaging/asset service must have one upstream owner and justified original-cohort allocation."
      evidence: "Stock, transfer, allocation and original cohort ledgers"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify native identity restrictions and actual provider compatibility; unbound atomic input or auxiliary is an ordinary identity gap, not evidence of zero use. A concrete complete-terminal identity conflict is a core hold."
      evidence: "Exact native records and supplier/state evidence"
validation_rules:
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Verify whole terminal/material identity, actual Product/Waste/Elementary type, CAS, phase/form, route, geography, compartment and every native property limitation; use exact property-to-unit-group reference units. Selected generic native family does not prove supplier/background applicability. Leave incompatible or unresolved atoms unbound and track them."
    source_ids:
      - arma-residential-manual-2014
      - tarco-fiberglass-msr
  - rule_id: v_basis
    applies_to: "finished_roll"
    rule: "Require all declared qualifiers, complete first-release QC, single projected material area and matching configuration. A rectangle alone permits length times width; arbitrary/irregular geometry needs traceable design-specific measurement. Roof coverage, overlaps, both faces, nominal roll weight and secondary density coefficients cannot define Q."
    source_ids:
      - arma-residential-manual-2014
      - tarco-fiberglass-msr
  - rule_id: v_accounting
    applies_to: "all inventory rows"
    rule: "Require raw original-unit data, unit/rate conversion, justified allocation and inherited vectors before a single A/Q normalization. Collection protocols retain raw records; cards and aggregation reuse that one result. Q=0 retains actual burden but has no unit result. Never divide a previously normalized value again."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: v_complete
    applies_to: "all inventory rows"
    rule: "Reconcile manufacturing, FG/service, combined physical and element gates independently; packaging six legs and repairs/water X do not erase inflows retained in stock. Check failures, start/stop, idle, cleanup, unreleased WIP/rework, FG returns, assets and all real added atoms. Unknown is not pass, zero or not_applicable."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: v_service
    applies_to: "service"
    rule: "Require original cohort Q, actual observation horizon, gross dispatch/returns and retained performed-service burden. Post-release rework requires permission and posttests/acceptance/disposition, with real incremental materials/water/energy/waste; never assume damaged product restored or a new output."
    source_ids:
      - arma-residential-manual-2014
      - ilcd-detailed-2010
  - rule_id: v_sources
    applies_to: "all inventory rows"
    rule: "Do not use industrial process documents as allocation evidence or apply literature recipe, temperatures, line speeds, densities, lifetimes or ratings as defaults. Identify source scope and limits, actual foreground uncertainty and missing evidence; a declaration or mechanical check is not site observation or scientific approval."
    source_ids:
      - arma-residential-manual-2014
      - tarco-fiberglass-msr
      - ilcd-detailed-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Material-stage inventory for one declared complete roll configuration, with manufacturing and separately scoped original-cohort services"
  allowed_use: "Matched state/route/configuration/provider basis with all identity restrictions and uncertainty carried into downstream context"
  excluded_use: "Whole roof/system or installed coverage comparisons without independent scenario; shingle or modified membrane substitution; default life/rating or negative waste credit"
  required_metadata: "site and collection period; configuration and lot/cohort identity; glass-fibre mat and cured binder supply state; petroleum coating-asphalt grade and upstream oxidation owner; whole formulation versus onsite mixing ownership; actual filler mineralogy and moisture; granule stone/coating/colour/grading; actual bottom release material; unmodified non-self-adhered solid roll terminal; wound dimensions and calibrated single-face area; net product mass and measured moisture; first complete quality-release gate and Q; reject/sample/rework dispositions; raw/WIP/FG/packaging/asset opening and closing inventories; cohort inherited burden vector and service horizon; actual heat source and cooling route; provider geography and native identity restrictions; measured air/liquid species and discharge media; supplier-included ingress ownership; actual product tests with no inferred rating/life"
  required_quality_disclosure: "Raw data coverage, first-release Q, inherited vectors, gross physical gates, all unresolved identities/provider compatibility, service horizon, zero-output loads and remaining uncertainty"
  update_trigger: "Change of mat/coating formulation, modifiers, granule/backsurfacing, geometry, route/gate, supply background, controls or method evidence"
data_sources:
  - id: "unsd-cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD CPC Ver.3.0 explanatory notes, 30 June 2025, PDF186; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification title/parent and adjacent 37940 only; no detailed recipe or universal coverage inferred."
  - id: "arma-residential-manual-2014"
    type: "handbook"
    reference: "ARMA Residential Asphalt Roofing Manual, 2014, printed3–4 and7–10; https://www.asphaltroofing.org/media/_pda/2019/03/TAC-Technical-Review-Task-Force-Residential-Asphalt-Roofing-Manual-2014.pdf"
    used_for: "Material preparation, complete glass-mat coating/surfacing/cooling and roll winder/quality/storage route. Figure2-1 is laminate-shingle countercontext, not this roll recipe. No fixed proportions, temperatures, line speeds, lifetime or allocation."
  - id: "tarco-fiberglass-msr"
    type: "literature"
    reference: "Tarco, Fiberglass Mineral Surfaced Roll Roofing for Residential Applications, complete manufacturer page snapshot 2026-10-20; https://tarcoroofing.com/fiberglass-mineral-surfaced-roll-roofing"
    used_for: "Positive complete terminal: glass mat/asphalt/ceramic-granule top/mineral-release bottom, supplied roll and actual storage/installation context. Gross material area differs from installed overlap coverage; nominal data, ratings and application rates are not PCR defaults."
  - id: "ilcd-detailed-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA — Detailed guidance, March2010, sections7.9.2–7.9.3, printed255–272; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional scope requiring allocation, dedicated/virtual subdivision, exchange-specific determining physical causality, and residual common-gate actual-state market value. Cohort/stock/gross-leg protocols here operationalize that method; the handbook is not a roll factory dataset."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:48b33ee89b4b069713b333bdd1cd4fafa698daf6cbbef6df5ad86003fd1df1f0"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_8290"
      family: "system_boundary"
      span:
        start:
          offset: 8290
          line: 60
          column: 1
        end:
          offset: 18451
          line: 86
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Purchased complete cured glass-fibre mat, preprocessed roofing coating asphalt, separately purchased filler and coated granules at receipt; no purchased finished roll repacking |\n| starting_condition_role | Foreground production from burden-bearing materials; upstream processing remains in compatible provider datasets |\n| product_classification_scope | One narrow 37930 manufactured-article route; UN notes state a title, not a shingle or membrane recipe, while 37940 is separately titled mixtures |\n| recursive_input_rule | No same-category finished-roll input substitutes for whole manufacture; actual supplied intermediate needs its inherited burden, transfer state and additional operations; materially different inputs require scope review |\n| upstream_dataset_requirement | One provider owner for each whole material/formulation, actual route/state/geography and transport gate; collect missing primary supply evidence and disclose uncertainty |\n| disclosure | First-release area Q, material gate, all stock and inherited-vector bridges, actual utility/carrier conventions, gross packaging legs and original-cohort service horizon |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_route | manufacture | Cover receipt/storage and actual preparation of complete materials, filler conditioning/mixing, whole-mat asphalt impregnation/coating, mineral surfacing/backsurfacing, cooling, trim/cut/wind and first complete QC release. Record all failure/zero-output, startup/shutdown, idle, cleanup, unreleased rework, dust/water controls and their utilities/wastes. No onsite asphalt oxidation, mat formation, granule coating, polymer modification, shingle lamination or roof installation is inferred. | `arma-residential-manual-2014`; `tarco-fiberglass-msr` |\n| b_owner | all inventory rows | Purchase a complete cured mat or externally filled coating once with all embedded binder, additives, carrier water and filler as subledgers only. For actual onsite filled coating, collect every separately purchased ingredient and real heating/mixing losses. When a complete filled formulation is supplied, add its own single atomic identity and suppress only its included ingredient purchases. Do not suppress separate new material/water because it remains in closing stock; any actual unlisted material or species must be added. | `arma-residential-manual-2014`; `tarco-fiberglass-msr` |\n| b_gate | finished_roll | Q is the sum of actual single-face projected material area of complete rolls at their unique first quality release. Closing FG already first-released is included in Q; do not add closing FG again as production or subtract its manufacturing burden. Reinspection, dispatch, external return and post-release processing never create a new first-release output. Maintain gross shipments/returns and FG changes by actual area, mass, configuration and moisture, without treating returned mass as unchanged original delivery. | `arma-residential-manual-2014`; `tarco-fiberglass-msr` |\n| b_vectors | manufacture | For each exchange-specific inherited burden vector, use opening raw/WIP/unassigned stores plus current attributable burden, less closing raw/WIP and genuinely unused/unassigned stores, plus legitimate incoming transfers and less only justified outgoing functional/cohort transfers. Closing manufacturing B excludes already released FG. Retain rejects, samples, ordinary waste and their treatment burdens even if sold or exported; a real other cohort/function and justified handover/allocation are needed for one vector transfer. Internal rework carries its vector and only real additional work; no repeated upstream charge and no second stock correction. | `ilcd-detailed-2010` |\n| b_service | service | Retain actual storage/packing/handling/dispatch and permitted post-release work separately against original cohort Q and observed horizon, including service on FG still stored. Only unused/unassigned service/charge carries forward. Postwork needs manufacturer/specification permission, tests, acceptance and disposition; damaged roll is not assumed restorable. Keep old/new parts, every water phase and new losses atomic. At consolidation cancel internal first-release transfers once; do not sum manufacturing Q and closing FG as independent products. | `arma-residential-manual-2014`; `ilcd-detailed-2010` |\n| b_physical | all inventory rows | Maintain independent mass and relevant element balances at manufacturing, FG/service and combined facility gates. Manufacturing physical closing stock includes raw/WIP/unassigned stores and applicable installed parts/fluids, but released product leaves this gate once, including its later closing FG. The combined gate instead includes opening/closing FG, actual gross external roll legs, packaging, assets, wet stocks, air species and carrier water. Cancel only internal transfers. Gross physical amounts are never scaled by burden allocation shares. Require independent composition/species/water-state evidence; one residual cannot fit two unknowns. | `ilcd-detailed-2010` |\n| b_pack | service | This ledger spans receipt and actual attachment before or after quality release; each actual packaging operation is assigned once to its recorded manufacturing/cohort-service gate. For each packaging material separately: opening empty + attached WIP/FG + reusable stock + P + I + ER + F_in = closing empty + attached WIP/FG + reusable stock + S + EO + W + F_out, in consistent measured mass/state. P is paid standalone or bundled, I first non-purchased external ingress, ER external return received, S packaging on gross physical dispatch, EO external return sent, W waste. F_in/F_out are independently measured material/water additions/removals across this article pool, disjoint from contents already inside the corresponding whole-article legs. Trace each origin/destination and its component/whole-article bridge; internal pool/repair transfers pair and cancel once at consolidation, without creating another purchase/provider. X_in/X_out remove only documented overlap with another already-counted SAME-SIDE gross inlet/outlet term; a closing stock is never such an overlap term. Internal reuse cancels; preserve all six whole-article legs and their separate empty/attached/reusable wet stocks. Preserve actual new influx and full closing wet mass together. Do not put packaging in Q or buy reused assets again; upstream owner once, no automatic coproduct or credit. | `arma-residential-manual-2014`; `ilcd-detailed-2010` |\n| b_airwater | manufacture | Retain actual gas species and phases for inlet air, exhaust, cooling evaporation, condensate, entrainment, liquid transfers and treatment. Integrate genuine rates over their measured time only; an integrated gas/liquid volume is not multiplied by time again. Use independent substance/state-specific density, measured thermal state and enthalpy. Steam/hot-water carrier kg and purchased heat MJ are linked without double purchase or invented boiler. VOC/PAH/PM/COD/NOx totals remain indicators until species are independently identified; unknown speciation is not a zero or a fabricated molecule. | `arma-residential-manual-2014`; `ilcd-detailed-2010` |\n| b_assets | manufacture | Keep physical equipment/tooling inventory separate from attributable current service burden. Preserve opening/closing installed mass, each actual new/old repair part, lubricants and water with their real X_in/X_out. X terms deduplicate only other gross incoming/outgoing terms, never remove an influx because its material remains installed. No fixed service life, universal wear rate or whole machine per m2. Collect actual offsite freight and outsourced operations as separately identified service atoms with gross load/distance/mode and provider boundaries; supplier-included service is owned once. | `ilcd-detailed-2010` |\n| packaging_receipt_basis | packaging | For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. F_in/F_out remain separate independently measured actual material/water changes, not a substitute for whole-article receipt. In this packaging-pool account X_in/X_out mean only documented overlap deductions against another already-counted SAME-SIDE gross inlet/outlet term, never closing stock or the actual F change. Asset/water raw records retaining a gate-specific X label keep that scoped meaning; if their actual event crosses this packaging pool, bridge the measured movement to packaging F_in/F_out rather than treating the legacy label as an overlap deduction. When complete records demonstrate no same-side duplicate, the packaging X deduction is zero; unknown overlap remains unresolved. Retained new material/water remains both a real input and full closing wet mass. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names. | ilcd-detailed-2010 |\n\n"
