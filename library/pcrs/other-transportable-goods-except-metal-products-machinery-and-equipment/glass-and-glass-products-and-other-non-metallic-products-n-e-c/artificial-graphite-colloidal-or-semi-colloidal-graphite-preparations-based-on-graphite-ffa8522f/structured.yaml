  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Convert original readings to each row native extensive unit; use cumulative volume once and integrate only true rates. Establish whole-preparation and supplier-included packaging ownership once. Directly assign dedicated flows and apply exchange-specific determining physical causality before residual allocation. Keep undivided raw activity I_e and incremental service S_e and all physical gross legs g_e. Do not re-correct an already stock-corrected consumption."
      inputs:
        - "raw observations"
        - cp_vectors
        - cp_release
      output: "I_e; S_e; g_e; Q"
      source_ids:
        - jrc-ilcd-attributional-allocation-2010
    - id: calc_burden
      applies_to: "all inventory rows"
      rule: "For manufacturing use A_e = I_e + Bopen_e - Bclose_e - Tother_e only when I_e is not already stock-corrected; otherwise use the documented equivalent without a second stock correction. Bopen/Bclose include raw/WIP and genuinely unassigned stores; Bclose excludes released FG. Tother is a once-only justified genuine other-cohort/function transfer and never an automatic deduction for ordinary losses or sale. Current asset service comes from the inherited asset vector and actual service assignment separately from full physical asset mass. Post-release A_e uses actual original-cohort service S_e plus inherited unassigned charge less only truly unused/unassigned closing charge or justified transfer; never subtract already performed service due to retained FG."
      inputs:
        - I_e
        - S_e
        - Bopen_e
        - Bclose_e
        - Tother_e
        - cp_vectors
      output: "A_e"
      source_ids:
        - jrc-ilcd-attributional-allocation-2010
    - id: calc_physical
      applies_to: "all physical gates"
      rule: "Reconcile gross wet stocks and actual inputs/outputs independently at manufacturing and FG/service and combined gates under b_physical and b_pack. Cancel internal first-release Q and paired internal recoveries only when combining gates. Preserve real new repair/water ingress simultaneously with full wet closing stock. Independently test mass and relevant elements and each actual species; a balance residual cannot specify several missing gases or reaction water."
      inputs:
        - g_e
        - "opening wet stocks"
        - "closing wet stocks"
        - cp_vectors
      output: "physical gate balances; element balances"
      source_ids:
        - imerys-graphite-powder-patent-2015
        - jrc-ilcd-attributional-allocation-2010
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "q_e = A_e / Qc exactly once when Qc>0. For manufacture Qc is the original cohort first-release Q; for observed post-release services Qc remains that same original cohort Q with horizon H declared. Qc=0 retains actual burdens and inherited physical records without a unit result. Cards and protocol aggregation reference this result without further division. The reference output is 1 kg whole uncoated powder."
      inputs:
        - A_e
        - Qc
        - H
        - cp_release
        - cp_vectors
      output: "q_e"
      source_ids:
        - jrc-ilcd-attributional-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Check whole supplied state and actual artificial route and every native restriction together with the real provider. Compatible broad manufactured powder is not proof of a specific grade or plant. Unresolved auxiliary UUID or unknown quantity remains explicit; no fabricated observation."
      evidence: "Supply and route history; native records; grade and phase tests"
    - id: dq_measure
      applies_to: "all inventory rows"
      requirement: "Retain original units and total/rate status and meter boundary and calibration and sampling uncertainty. Mass/kg does not govern electricity MJ or independently measured fluid volume. No catalogue density or patent table factor substitutes for current site measurements."
      evidence: "Raw logs and calibrations; actual-fluid state and laboratory reports"
    - id: dq_cohort
      applies_to: "release and stocks and services"
      requirement: "Keep unique release events and all-flow inheritance vectors for failures and WIP and released FG; retain original service cohort and H. Do not normalize quantities in collection."
      evidence: "Release ledger; matched physical transfers; service records"
    - id: dq_complete
      applies_to: "manufacture and support and service"
      requirement: "Each actual chemical/fuel/water/packaging/waste/species and repair/asset leg has its own identity and owner. Record evidenced absence separately from unknown. All actual omitted exchanges must be added before a dataset is declared complete."
      evidence: "Site walkthrough; supply balance; emission speciation; receiver evidence"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference product"
    rule: "Confirm actual coke conversion and uncoated powder semi-manufacture gate; reject natural mined graphite or repackage-only routes or finished electrodes and incompatible native form. Whole mass and actual minor phases/moisture must be declared."
    source_ids:
      - imerys-graphite-powder-patent-2015
      - asbury-synthetic-graphite-2006
      - asbury-graphite-introduction-2026
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Verify the selected flow against all native names/synonyms/comments/CAS and grade/route/form/geography/media/type and every property. Use the exact reference-property to unit-group to reference-unit chain. An unspecified air compartment must not hide a known specific compartment. Reject hard conflicts rather than excusing them through CAS or classification."
    source_ids:
      - imerys-graphite-powder-patent-2015
  - rule_id: v_quantity
    applies_to: "release and all inventory rows"
    rule: "Verify Q from unique first-release whole net masses including closing FG; every input and output and protocol uses the same declared reference basis. Raw collection remains undivided. Check one calc_normalize only with original Qc and observed H; Q0 has no unit result. The finite relationship check does not establish measured site values or physical plausibility."
    source_ids:
      - jrc-ilcd-attributional-allocation-2010
  - rule_id: v_balance
    applies_to: "all physical and burden gates"
    rule: "Close full wet mass and independent relevant-element/species balances at manufacture and FG/service and combined gates. Verify packaging six legs and supplier-included owner and complete asset/repair/fluid physical stocks. Real new ingress retained in closing stock remains. No burden share scales gross mass and no ordinary discard/sale automatically creates Tother. Unsupported or quantitatively unknown relationships remain open."
    source_ids:
      - imerys-graphite-powder-patent-2015
      - jrc-ilcd-attributional-allocation-2010
  - rule_id: v_work
    applies_to: "post-release rework"
    rule: "Require actual manufacturer/specification permission and postwork tests/acceptance/disposition and original-cohort traceability; do not infer that every rejected powder or broken asset can be restored. Add all actual incremental physical exchanges and retain treatment burdens."
    source_ids:
      - jrc-ilcd-attributional-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Input to industrial powder-consuming processes with independently compatible quality and gate"
  allowed_use: "The declared coke-derived uncoated powder route and actual geography/year/provider and measured whole-product basis"
  excluded_use: "Generic natural graphite or coated battery powder or electrodes/articles; regulatory certification; operational furnace instructions; unreviewed proxying of unresolved identities"
  required_metadata: "Whole uncoated artificial graphite powder with actual graphitic phase minor phases ash and moisture; Graphitizable calcined petroleum-coke provenance and complete upstream refining coking and calcination coverage; Actual binder-free particulate Acheson batch route and charge segregation and filler recovery; No natural mining route no pitch forming no intentional coating no catalyst doping and no finished electrode function; Actual pre-grinding and post-grinding classification and dust-control operations and all losses; Site reporting period supply geography and actual electricity voltage and provider; Whole-powder first-release net mass Q unique release IDs actual moisture and declared product grade; Reference amount includes closing released FG and excludes removable packaging and repeat inspection; Per-flow opening and closing raw WIP and unassigned-store inherited burden vectors; Original released cohort Qc and observed service horizon H for packing storage dispatch and permitted rework; Full gross molecular species by phase origin and receiving compartment with independent mass and element balances; Each packaging P I ER S EO W leg plus empty attached-WIP attached-FG and reusable stocks and one upstream owner; Complete installed assets new and old repair parts and actual fluids with measured physical masses and separate current service burden; Manufacturer or specification rework permission postwork tests acceptance and disposition; Every adopted card native restriction actual compatible provider and all unresolved data disclosures"
  required_quality_disclosure: "Actual primary observations versus technical synthesis; every native restriction and unknown; single Q normalization; all physical/burden balances; original-cohort service H; allocation sensitivity; unreviewed scope"
  update_trigger: "Changed coke history or binder/coating/additive route or powder gate or grade/phase/moisture or provider/voltage/geography or service/stock/allocation practice or source/native identity"
