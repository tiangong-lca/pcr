allocation_rules:
  - rule_id: a_scope
    applies_to: "multifunctional attributional processes"
    rule: "Use this hierarchy only in an attributional scenario in which multifunctionality actually remains. First assign dedicated exchanges and subdivide actual or virtual processes. Next justify each remaining exchange by the determining physical causal relationship to its real co-function. A common physical share for all exchanges is not presumed."
    source_ids:
      - jrc-ilcd-attributional-allocation-2010
  - rule_id: a_residual
    applies_to: "remaining common-process burden"
    rule: "Only genuinely residual common-process burden uses contemporaneous market value at the actual split gate and condition after the preceding causal steps. Record quantities and prices and adjustments for any later conditioning/packing/transport. Use proportional residual valuation only when all relevant gate quantities and values and their sum are finite, defined and strictly positive. Missing, nonfinite, zero, negative or offsetting values require a justified case-specific allocation method or a hold on dependent results while retaining every real function and its gross exchanges. Do not use absolute values, equal shares, zero shares, credits or deletion of a function as defaults; document sensitivity. No fixed allocation ratio or automatic substitution credit is provided."
    source_ids:
      - jrc-ilcd-attributional-allocation-2010
  - rule_id: a_discard
    applies_to: "losses and recovered filler"
    rule: "Ordinary failed powder and samples and dust and discarded furnace packing retain their manufacturing and treatment burdens even if sent out or sold. Transfer a burden vector once only for a documented genuine other cohort/function under justified allocation/handover. Recovered internal filler carries its measured inherited vector and is not credited or repurchased on reuse. Gross physical transfers remain complete regardless of burden ownership."
    source_ids:
      - jrc-ilcd-attributional-allocation-2010
