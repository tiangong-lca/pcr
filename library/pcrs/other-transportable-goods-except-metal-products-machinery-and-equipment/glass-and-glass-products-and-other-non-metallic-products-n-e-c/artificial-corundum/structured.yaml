allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The hierarchy below is restricted to a justified attributional allocation situation; industrial manufacturing pages/PDFs do not establish LCA allocation. All gross physical quantities and performed same-cohort FG services remain; partitioned burdens and physical conservation have separate ledgers."
    source_ids: []
  - rule_id: allocation_hierarchy
    applies_to: "shared processes/cohorts/functions"
    rule: "Apply only to an explicitly justified attributional allocation situation. First use dedicated measurements and physical or virtual subdivision for each function/cohort/stage. Then identify exchange-specific determining physical causality, distinguishing embodied material from process-related loss/energy and service intensity. Do not choose physical versus economic allocation freely or apply one mass share to every exchange."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_residual
    applies_to: "shared processes/cohorts/functions"
    rule: "Only for the genuinely remaining inseparable common-process inventory use contemporaneous quantity times representative market value at the actual common exit condition/gate. Remove subsequent packaging/transport/conditioning from downstream prices; document currency/period, quality, quantity, market basis and uncertainty. Unknown values remain unresolved; no fixed ratio. Hold only the residual allocation for review if any required quantity or common-gate value is missing or nonpositive, the co-function set or common gate/state is undefined, credits/offsets are not separated, or the value-weight denominator is nonpositive, nonfinite or undefined. Do not create negative allocation shares or credits, take absolute values, clamp to zero or insert defaults. Retain raw physical quantities and justified dedicated/causal assignments. This hold requires review of function, gate and value basis; it does not exclude a grade or route because of its buyer price. Sum allocated inventories over all functions equals the original inventory. Physical gross outputs, stock and packaging legs remain unscaled."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_failure
    applies_to: "shared processes/cohorts/functions"
    rule: "Ordinary manufacturing failures, dust, rejected grain, samples, broken material and their treatment remain burdens of manufacture, including external sale or collection. No automatic T_other subtraction, avoided-product credit, free recycled feed or credit from an outward water/packaging leg. A transfer is allowed once only for a real independent other cohort/function plus justified allocation or burden-handover decision, with inherited vector and receiving account. Reuse/recycling requires the actual quality/state and consistent true-joint-process/treatment boundary; this PCR supplies no universal recycling factor."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_rework
    applies_to: "shared processes/cohorts/functions"
    rule: "Actual pre-release rework is internal with its inherited burden and new increments. Post-release regrading/reprocessing belongs to the original cohort service and requires manufacturer/specification permission, postwork tests, acceptance and disposition. A rejected grade is not assumed recoverable merely because it can be crushed again. A sold independent grade requires actual specifications, function, quality release and the allocation hierarchy; do not auto-promote fines or magnetic reject into co-products."
    source_ids:
      - jrc-ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "feed"
      flow_role: "Material and intermediate ledger"
      record_type: "raw record and independent measurement"
      raw_fields: "gross receipt; supply formulation; assay; moisture; issue; return; opening/closing raw and WIP; physical handovers; inherited vectors; failure/rework"
      collection_method: "Calibrated net/tare weighing and traceable supply/production records; collect raw extensive values only, including whole preparation and separate subaccounts."
      unit: "kg as received; independent species/water basis"
      frequency: "each batch/event and continuous meters; opening/closing counts"
      temporal_coverage: "complete manufacture period and declared original-cohort service horizon"
      site_scope: "actual site/provider/stage/cohort and each species; protocol process_id names its owner; cp_material spans feed/fusion/grain, cp_water spans grain/utilities/control, cp_asset spans fusion/grain/control"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; supplier assay; batch tickets; reconciliation"
    - protocol_id: cp_release
      process_id: "grain"
      flow_role: "First-release grade ledger"
      record_type: "raw record and independent measurement"
      raw_fields: "lot/cohort; net whole kg; tare; free moisture; minor phases; size distribution; test result; held/reject disposition; unique first acceptance time; co-function and common exit state; residual quantities and market values with currency/period; itemized downstream costs and credits/offsets; value-weight denominator and unresolved evidence"
      collection_method: "Weigh accepted whole grain on a calibrated scale; reconcile actual manufacturer grade tests, sampling and time-stamped first-release records; retain failed/Q=0 lots and no duplicate reinspection."
      unit: "kg net whole grain; original test units"
      frequency: "each batch/event and continuous meters; opening/closing counts"
      temporal_coverage: "complete manufacture period and declared original-cohort service horizon"
      site_scope: "actual site/provider/stage/cohort and each species; protocol process_id names its owner; cp_material spans feed/fusion/grain, cp_water spans grain/utilities/control, cp_asset spans fusion/grain/control"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; signed release; full particle/chemical/crystal test context"
    - protocol_id: cp_utility
      process_id: "utilities"
      flow_role: "Energy and compressed-air raw meters"
      record_type: "raw record and independent measurement"
      raw_fields: "stage/cohort; meter increments; rate series and intervals; kWh; MJ; m3 conditions; fuel kg; blend; LHV; density; outages; startstop/idle; upstream owner"
      collection_method: "Read calibrated cumulative meters or integrate a real rate over its measured intervals once; use actual extensive-property unit and document unit conversion, independent state/density and fuel/air component subaccounts. Collect no per-Q value."
      unit: "kWh or MJ electrical energy; kg fuel; m3 gas/air with state"
      frequency: "each batch/event and continuous meters; opening/closing counts"
      temporal_coverage: "complete manufacture period and declared original-cohort service horizon"
      site_scope: "actual site/provider/stage/cohort and each species; protocol process_id names its owner; cp_material spans feed/fusion/grain, cp_water spans grain/utilities/control, cp_asset spans fusion/grain/control"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; time series; supply specification; measurement state"
    - protocol_id: cp_water
      process_id: "utilities"
      flow_role: "Each actual water phase and wastewater"
      record_type: "raw record and independent measurement"
      raw_fields: "owner; incoming/return kg; cumulative volume; temperature/pressure; independent density; liquid/vapour/solid-bound phase; X_in/X_out; full wet opening/closing stock; assay; treatment route"
      collection_method: "Direct calibrated weighing or calibrated volume with independently measured density of that substance/state; preserve externally supplied/returned water and thermal convention, actual clean/dirty route and whole supplied carrier ownership. No residual-fit reaction water."
      unit: "kg per phase; original m3 and enthalpy units separately"
      frequency: "each batch/event and continuous meters; opening/closing counts"
      temporal_coverage: "complete manufacture period and declared original-cohort service horizon"
      site_scope: "actual site/provider/stage/cohort and each species; protocol process_id names its owner; cp_material spans feed/fusion/grain, cp_water spans grain/utilities/control, cp_asset spans fusion/grain/control"
      aggregation_rule: "per reference flow"
      quality_evidence: "weigh/meter calibration; independent sample/state; provider agreement; effluent record"
    - protocol_id: cp_asset
      process_id: "asset_control"
      flow_role: "Actual asset consumable and repair services"
      record_type: "raw record and independent measurement"
      raw_fields: "asset/BOM; opening/closing/install/remove; net wet masses; new/old parts and water; service use; unused/unassigned service; wear; failure; maintenance; oil additions/drains; inherited vector"
      collection_method: "Weigh identified complete materials/parts and retained fluids; reconcile real service/maintenance logs, actual capacity use and inherited inventories. Stock and physical influx remain separate from allocated service; do not assume mass per item or fixed life."
      unit: "kg per actual material/fluid; original service-time/capacity units"
      frequency: "each batch/event and continuous meters; opening/closing counts"
      temporal_coverage: "complete manufacture period and declared original-cohort service horizon"
      site_scope: "actual site/provider/stage/cohort and each species; protocol process_id names its owner; cp_material spans feed/fusion/grain, cp_water spans grain/utilities/control, cp_asset spans fusion/grain/control"
      aggregation_rule: "per reference flow"
      quality_evidence: "BOM; scale; maintenance permission; time/use logs; supplier service data"
    - protocol_id: cp_pack
      process_id: "fg_service"
      flow_role: "Each packaging material six-leg ledger"
      record_type: "raw record and independent measurement"
      raw_fields: "material/composition; O; P; I; ER; C; S; EO; W; attached WIP/FG; reusable stock; moisture; X_in/X_out; ownership; original cohort ; packaging receipt origin; payment/non-purchase evidence; owner/custodian; same-item prior outward ID; F_in; F_out; measured_material_water_change; pool_origin_destination; whole_component_bridge; same_side_OTHER_term; legacy_X_record_role; legacy_X_to_F_event_bridge; X_overlap_in; X_overlap_out"
      collection_method: "Weigh each component/whole supplied article with full moisture/attachments and reconcile all six external legs plus complete opening/closing stock. Preserve first non-purchased external ingress and one upstream owner; log internal reuse as cancelling transfers, no second purchase.  For packaging only, apply packaging_receipt_basis; standalone non-purchase is I, never invented ER or X. Independently measure material/water F_in/F_out and full wet stocks. Keep them disjoint from matching whole-article contents and pair internal donor/receiver transfers once. X deduplication requires the exact other already-counted same-side inlet/outlet, never closing stock; unknown changes or overlap remain unresolved. Retain older raw X-labelled actual-change fields with their original provenance; record their role and bridge each actual material/water event once to F_in/F_out, never adding the alias again or treating it as a deduction. Separately record packaging overlap deductions as X_overlap_in/X_overlap_out, mapped to reconciliation X_in/X_out only with exact already-counted SAME-SIDE OTHER flow evidence. Proven no overlap gives zero deduction; unknown stays unresolved. Non-packaging water/asset raw X names retain their own gate meanings."
      unit: "kg per named packaging article/material"
      frequency: "each batch/event and continuous meters; opening/closing counts"
      temporal_coverage: "complete manufacture period and declared original-cohort service horizon"
      site_scope: "actual site/provider/stage/cohort and each species; protocol process_id names its owner; cp_material spans feed/fusion/grain, cp_water spans grain/utilities/control, cp_asset spans fusion/grain/control"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale/tare; supplier packaging scope; gross shipment/return/waste tickets"
    - protocol_id: cp_service
      process_id: "fg_service"
      flow_role: "Original-cohort actual service"
      record_type: "raw record and independent measurement"
      raw_fields: "H; original Q_H; observation horizon; performed storage/packing/handling; opening/closing FG histories; gross dispatch/returns; original-delivery link; losses; actual postwork permission/tests/acceptance/disposition; unused service"
      collection_method: "Retain time-stamped services, measured increments and original cohort lineage; raw service account only, no renormalization by shipments or closing held mass. Repeat release is not new production."
      unit: "original extensive units; kg physical FG; service time"
      frequency: "each batch/event and continuous meters; opening/closing counts"
      temporal_coverage: "complete manufacture period and declared original-cohort service horizon"
      site_scope: "actual site/provider/stage/cohort and each species; protocol process_id names its owner; cp_material spans feed/fusion/grain, cp_water spans grain/utilities/control, cp_asset spans fusion/grain/control"
      aggregation_rule: "per reference flow"
      quality_evidence: "cohort history; work permission; postwork test; service meter; disposition"
    - protocol_id: cp_emission
      process_id: "asset_control"
      flow_role: "Actual molecular particulate and waste observations"
      record_type: "raw record and independent measurement"
      raw_fields: "source/stage/cohort; species/CAS; carbon origin; medium/phase; gross air in/out; humidity; cumulative gas volume or rate/time; standard state; concentration basis; independent density; control capture; waste kg; detection limits; uncertainties"
      collection_method: "Use actual calibrated sampling/speciation and destination/treatment records. Convert concentration with matching dry/wet/reference-state cumulative volume; integrate rates only once. Keep unmeasured, nondetect and confirmed zero distinct; totals and subsets linked without duplication."
      unit: "kg each actual species/particulate/waste; original instrument units"
      frequency: "each batch/event and continuous meters; opening/closing counts"
      temporal_coverage: "complete manufacture period and declared original-cohort service horizon"
      site_scope: "actual site/provider/stage/cohort and each species; protocol process_id names its owner; cp_material spans feed/fusion/grain, cp_water spans grain/utilities/control, cp_asset spans fusion/grain/control"
      aggregation_rule: "per reference flow"
      quality_evidence: "method and calibration; gas state; raw spectra/sampling; detection limit; waste ticket"
  calculation_rules:
    - id: calc_raw
      applies_to: "raw meters and quantities"
      rule: "Convert raw observations to each exchange native extensive unit before allocation. Cumulative volume is already integrated; only real rates use sum(rate×interval). For electricity use1kWh=3.6MJ. For other substances use independently measured density at the stated condition, never a secondary flow-property factor or water density by analogy."
      inputs:
        - "raw measurements"
        - "explicit units"
        - "actual state"
        - "independent density"
      output: "converted raw extensive observations"
      source_ids: []
    - id: calc_q
      applies_to: "finished_grain"
      rule: "Q = sum(unique newly first-released target-grade net whole kg). Keep gross release/hold/reject/rework records; actual impurities/free water remain. Closing FG is a partition of Q, not another output or manufacturing stock deduction. Q=0 retains burden and returns no unit value."
      inputs:
        - cp_release
      output: "Q"
      source_ids:
        - wm-fused-mineral-process
    - id: calc_manufacturing
      applies_to: "manufacturing inventory vectors"
      rule: "A = B_open + V_new - B_close - T_other. Each term is a same-unit exchange vector after raw conversion and real allocation. B_open/B_close cover raw/WIP/unused-unassigned non-WIP stores only; no first-released FG. V_new includes actual failures/Q0/startstop/idle/cleanup and increments. T_other requires a real independent function/cohort and justified one-time allocation/handover; ordinary waste or sale is insufficient. Cancel internal transfers once and do not repeat stock-corrected consumption. While allocation_residual is held, retain the unallocated residual alongside V_new, inherited stores and completed dedicated/causal assignments; no complete allocated A or normalized result is available. The hold never erases physical flows, failures or performed original-cohort services."
      inputs:
        - "converted raw vectors"
        - "inherited store vectors"
        - "allocation decisions"
      output: "A"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_service
      applies_to: "original cohort H"
      rule: "A_H = performed service vector assigned to original cohort H over the observed horizon. Keep its fixed original Q_H, full FG history, real losses and new permitted postwork. Deduct only unused/unassigned service already carried as such, once; never deduct performed service because FG remains held. No manufacture reversal or net-delivery denominator is inferred."
      inputs:
        - cp_service
        - cp_pack
        - "actual utility/asset increments"
      output: "A_H; Q_H"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_normalize
      applies_to: "all inventory rows except fixed finished_grain"
      rule: "For manufacture q_i = A_i / Q; for actual original-cohort service q_i,H = A_i,H / Q_H. Apply this division exactly once after raw conversion, stock/inheritance and real allocation. Amount cards and protocol aggregation labels reference this same calculation, never another division. Consolidated reporting sums compatible manufacturing/service vectors and cancels internal first-release Q once. Keep gross physical companion ledgers unscaled by burden shares. If the relevant Q or Q_H is zero retain raw vector and emit no unit result."
      inputs:
        - A
        - Q
        - A_H
        - Q_H
      output: "q_i; q_i,H"
      source_ids: []
    - id: calc_physical
      applies_to: "all physical gates and packaging"
      rule: "For each physical material/species: opening + external incoming = closing + external outgoing, with independently evidenced reaction/phase transformations stated explicitly. Do not add total wet waste and its water/solid subaccounts twice. For each packaging material O+P+I+ER+F_in=C+S+EO+W+F_out. X_in/out removes only duplicate other flow terms, never retained new influx or full closing wet stock. Gross physical legs are not burden vectors and are not scaled by economic allocation. One residual cannot determine multiple unknowns. F_in/F_out are independently measured material/water additions/removals across this packaging-article pool, disjoint from contents already included in the corresponding whole-article legs. Trace origin/destination and component/whole bridges; internal pool/repair transfers cancel once at consolidation without new purchase/provider. X_in/X_out deduct only overlap with another already-counted SAME-SIDE gross inlet/outlet term; closing stock is never such a term. Retained new repair material/water stays in F_in and full closing wet stock; unknown changes/overlap remain unresolved."
      inputs:
        - cp_material
        - cp_water
        - cp_asset
        - cp_pack
        - cp_emission
      output: "physical closure and unresolved residuals"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each product and exchange"
      requirement: "Verify actual whole product, route, phase, grade, CAS where applicable, geography/media/type and every native property/reference-unit restriction. UUID identity is not a provider dataset or grade approval; unresolved auxiliaries need completion before actual dataset use."
      evidence: "direct native record; actual supply and process evidence"
    - id: dq_representative
      applies_to: "whole reporting period"
      requirement: "Cover all operating modes, failed/Q0 runs, raw/WIP stocks and cohort history; disclose sampling, temporal/geographic representativeness, detection limits, uncertainty and actual gaps. Future factory values are requirements, not observations."
      evidence: "complete time records; stock counts; original cohort release history"
    - id: dq_source
      applies_to: "each constraint and amount"
      requirement: "Keep independent primary route support, actual foreground records and LCA allocation sources in their own roles. Retain adjacent counterexamples and full supplier formulation context. No primary numeric recipes, SDS density/purity or EPA grit-dryer factor is a universal value."
      evidence: "full cited source; scope comparison; actual raw records"
    - id: dq_allocation
      applies_to: "each shared burden and exit"
      requirement: "Retain subdivision attempts, determining causality per exchange, residual same-gate/state prices, conservation across all functions and uncertainty. Unresolved core route/terminal identity cannot be replaced by a mechanically passing check."
      evidence: "metering; technical relationship; market evidence;100% check"
    - id: dq_bilingual
      applies_to: "whole method"
      requirement: "Keep English and Chinese quantities, qualifier elements, atomic rows, source IDs, rules and stage conditions aligned; retain actual missing evidence without scientific/translation approval claims."
      evidence: "paired source/structured field audit"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Apply these rules with the complete premises in §§5/7 and raw quantities, formulas and quality requirements in §8. Unresolved/unmeasured items cannot masquerade as passes; these are not claims that future factory tests have already occurred."
    source_ids: []
  - rule_id: validate_terminal
    applies_to: "complete data package and raw context"
    rule: "Require the declared whole virgin white electric-fused abrasive grain and actual full manufacture/grade-release evidence. A hard native material/CAS/route/phase/type conflict or unresolved core terminal identity makes the concrete dataset unusable; do not use raw Bayer alumina, natural/sintered grains, gem sapphire, whole wheels or a formal checker to fill that gap."
    source_ids:
      - wm-fused-mineral-process
      - jrc-ilcd-attributional-2010
  - rule_id: validate_measurement
    applies_to: "complete data package and raw context"
    rule: "Check unique finished_grain output,1kg reference, Q/Q_H lineage, all original units and conversion before the single calc_normalize. No missing/unknown conversion may be called pass. Q0 produces no unit result; first-release closing FG is not an extra production output or manufacturing B_close."
    source_ids:
      - wm-fused-mineral-process
      - jrc-ilcd-attributional-2010
  - rule_id: validate_closure
    applies_to: "complete data package and raw context"
    rule: "Require independent wet physical mass and relevant element/species checks at manufacturing/service/consolidated gates, full packaging O/P/I/ER/F_in/C/S/EO/W/F_out closure and documented SAME-SIDE OTHER X overlap evidence. Retained new influx plus full closing wet stock stay. No gross legs reduced by burden shares, single residual for multiple unknowns, total/subset double count or waste-sale automatic T_other."
    source_ids:
      - wm-fused-mineral-process
      - jrc-ilcd-attributional-2010
  - rule_id: validate_completeness
    applies_to: "complete data package and raw context"
    rule: "Account for all actual consumables, asset service, utilities, controls, ordinary losses and treatment, emissions and post-release increments. Missing records are unresolved, not confirmed zero; each additional actual atom needs a card and its own property/media/source support. Actual FG postwork requires manufacturer/spec permission, posttests, acceptance and disposition. An allocation_residual hold prevents a complete allocated result: disclose retained raw, dedicated/causal and unresolved residual vectors, and resolve the function/gate/value/denominator evidence before closing the hold."
    source_ids:
      - wm-fused-mineral-process
      - jrc-ilcd-attributional-2010
  - rule_id: validate_approval
    applies_to: "complete data package and raw context"
    rule: "Report which checks were performed, skipped or unresolved and their evidence. Arithmetic/schema/source-fidelity checks do not establish scientific review, translation review, accepted mapping, certification or publication."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Use completed manufacture data plus explicit service accounts after actual evidence/applicability review for matching grade/gate/reference basis"
  allowed_use: "Attributional inventory of whole virgin white fused abrasive grain; actual original-cohort services disclosed separately"
  excluded_use: "Natural corundum/emery; brown fused bauxite+coke+iron/ferrosilicon co-production; sintered/tabular/sol-gel alumina; zirconia-alumina and intentionally doped fusion routes; hollow alumina bubbles; gemstone or technical single-crystal sapphire; Bayer refinery alumina as finished reference; bonded whole wheels, coated abrasives, grinding spheres, complete refractory bricks and crucibles; used blasting-grain recycling and downstream use. Acid treatment or surface coating is not presumed; a real additional route needs renewed primary applicability and its separate whole formulation, utilities, emissions and wastes."
  required_metadata: "manufacturer and facility; production period and geography; virgin white fused grain grade; whole calcined alumina supply state and supplier route; electric-arc fusion and actual cooling/crystal state; minor phases and impurities with full assay basis; supplied free moisture and net whole mass; particle-size specification and actual distribution; actual crushing/separation/cleaning/drying stages; unique first-release cohort and tests; all rejected/held/reworked material disposition; raw/WIP/non-WIP-store inherited vectors; utilities and furnace/lining/electrode service boundary; packaging composition and supplier-included ownership; original-cohort post-release service horizon; provider geography/route/native-property restrictions; allocation justification and unresolved evidence"
  required_quality_disclosure: "Complete actual scope/units/stocks/services/allocation/upstream ownership; performed/unresolved checks; representativeness and uncertainty; no scientific/translation/mapping/publication approval from this template"
  update_trigger: "Material change in feed/fusion route, grade/phase/size, first-release gate, assets/utilities/water-energy conventions, supplier, allocation or measurement"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version3.0 Structure and Explanatory Notes,30June2025, pp186–187; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification title and adjacent bonded/coated abrasive boundary only; no accepted mapping or manufacturing recipe."
  - id: "alteo-white-fused-alumina"
    type: "literature"
    reference: "ALTEO Fused Alumina, White Fused Alumina; https://www.alteofusedalumina.com/products/white-fused-alumina/"
    used_for: "Manufacturer confirmation of calcined-alumina electric-arc fusion and synthetic abrasive mineral; distinguish bubble alumina."
  - id: "wm-fused-mineral-process"
    type: "literature"
    reference: "Washington Mills, Fused Mineral Production Process; https://www.washingtonmills.com/fused-minerals/fused-mineral-production-process"
    used_for: "Raw receipt/storage, electric fusion, solidified ingot, crushing/grading and chemical/crystal/size quality control; multi-mineral context, no WFA numeric defaults."
  - id: "wm-duralum-special-white"
    type: "literature"
    reference: "Washington Mills, DURALUM Special White; https://www.washingtonmills.com/products/white-fused-aluminum-oxide/duralum-special-white"
    used_for: "Real virgin fused white alumina abrasive terminal and applications; no same-plant recipe claim."
  - id: "wm-white-alumina-family"
    type: "literature"
    reference: "Washington Mills, White Fused Aluminum Oxide; https://www.washingtonmills.com/products/white-fused-aluminum-oxide"
    used_for: "Distinguish angular/blocky abrasive grain from hollow bubbles, powders and refractory grades; actual product specification remains required."
  - id: "wm-white-alumina-sds-2025"
    type: "literature"
    reference: "Washington Mills, White Fused Aluminum Oxide SDS, revision14May2025 v2.0, sections1/3/9/13; https://www.washingtonmills.com/sites/default/files/2025-05/White%20Fused%20Aluminum%20Oxide_US%20SDS%20%5BEN%5D.pdf"
    used_for: "Whole solid product/CAS identity, multiple-grade and withheld-trace-composition limits; no purity, density, hazard, emission or disposal default."
  - id: "epa-abrasive-manufacturing-1995"
    type: "official_guidance"
    reference: "US EPA AP-42 section11.31, January1995, complete10pages, figure11.31-1 and tables11.31-1/2; https://www.epa.gov/sites/default/files/2020-10/documents/c11s31.pdf"
    used_for: "Qualitative crushing/screening and conditional washing/drying/separation plus emissions sampling scope. Brown bauxite/coke/iron fusion, sol-gel and wheel/coated routes are counterexamples; grit-dryer factors not adopted."
  - id: "jrc-ilcd-attributional-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA Detailed guidance, first edition March2010, §§7.9.2–7.9.3, printed255–272/PDF275–292; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation only where justified: subdivision/virtual subdivision, exchange-specific determining physical causality and residual common-process exit-state market value;100% inventory conservation. No industrial route or automatic recycling credit."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:3ccf7668f9d2014735cdea9b10ae99f49d95a26a26f49314ec6bfa171b0892e3"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_8438"
      family: "system_boundary"
      span:
        start:
          offset: 8438
          line: 60
          column: 1
        end:
          offset: 19109
          line: 87
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Whole purchased calcined alumina and actual supplied state; actual on-site calcination requires complete added inventory |\n| starting_condition_role | Foreground manufacturing receipt gate; supplier mining/Bayer refining/calcination owned upstream unless actually on-site |\n| product_classification_scope | Bounded white-fused-grain route within CPC3.0:37960, not all artificial corundum |\n| recursive_input_rule | Actual same-category purchased fused input retains its supply state and distinct upstream inventory; no recursive substitution as new manufacture or finished-grain repacking in place of raw-to-grain manufacture |\n| upstream_dataset_requirement | Match each actual supplied product/energy/fuel/water/service and waste treatment by technology/geography/time and native property; no duplicate supplier-included/on-site increments |\n| disclosure | Declare manufacture/service gates, actual assets/utilities/water-energy conventions, conditional stages, full stock inheritance, allocation and unresolved evidence |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_classification | complete foreground boundary | CPC3.0:37960 names artificial corundum; this method selects a narrower whole white-fused abrasive-grain route on independent physical evidence. Neighbor37910 comprises bonded/coated abrasive articles. A title or native taxonomy is not an accepted mapping. | `un-cpc3-2025` |\n| boundary_route | complete foreground boundary | Receipt of whole calcined alumina is the starting condition. Supplier calcination remains upstream unless actually performed inside the reported site; then identify its actual feed state and add the complete calcination inventory. Do not substitute calcined bauxite, hydroxide, natural mineral, purchased finished fused grain or a brown-fused recipe. Preserve the actual cooling/solidification route and all grade processing before first release. | `alteo-white-fused-alumina`; `wm-fused-mineral-process` |\n| boundary_q | complete foreground boundary | Q is net whole grain mass newly passing its first final grade release during the reporting period. Exclude packaging and unreleased/rejected matter, but include the actual accepted grade impurities/minor phases/free moisture; do not use pure Al2O3 fraction. Same-cohort closing finished grain has already entered Q: do not add it as another production output or subtract its manufacturing burdens. Delivery, repeat inspection and returns do not create new Q. | `wm-fused-mineral-process`; `wm-duralum-special-white` |\n| boundary_stock | complete foreground boundary | Maintain raw physical and inherited-inventory vectors for opening/closing raw stores, WIP, molten/solidified material awaiting grading, rework and unused/unassigned non-WIP service stores. Internal transfer vectors cancel at consolidation. Manufacturing B_close includes only those unfinished or unused/unassigned stores, never first-released FG. Stock-corrected consumption must not be deducted again. Retain failed lots, Q=0, startup/shutdown, idle and cleanup; no unit result when Q=0. | `jrc-ilcd-attributional-2010` |\n| boundary_services | complete foreground boundary | Keep performed packing/storage/handling/dispatch/test/repair services in their original released cohort H with fixed original Q_H and observed horizon. A held FG cohort retains its performed service, even if closing FG remains. Carry only unused/unassigned service or charge forward, without deducting completed service. An optional consolidated report adds manufacturing plus actual service vectors and cancels internal Q once. Net-delivery methods are outside this denominator; any separately developed net-delivery variant requires complete opening/closing FG history, gross G/R, documented original-delivery reversal D_rev and actual incremental work/loss/water attribution. Returned mass is not presumed equal to the original delivery. | `jrc-ilcd-attributional-2010` |\n| boundary_packaging | complete foreground boundary | For each packaging material keep opening empty plus WIP/FG-attached plus reusable stock O, external purchased empty P, first non-purchased external ingress I, external return received ER, closing complete stock C, packaging accompanying gross physical shipment S, external return outward EO and waste W: O+P+I+ER+F_in=C+S+EO+W+F_out, including observed attachments and moisture. Internal reuse cancels; no second purchase, net-grain Q or automatic co-product. Preserve I as a real physical ingress and one upstream owner, even when included in supplier price. Repair-part and water X_in/X_out deduplicate only overlapping other incoming/outgoing flow terms, never stocks. New water/material retained in closing stock remains both a real ingress and full closing wet mass; P/I already including it is counted once. Gross legs are never reduced by allocation shares. F_in/F_out are independently measured material/water additions/removals across this packaging-article pool, disjoint from contents already included in the corresponding whole-article legs. Trace origin/destination and component/whole bridges; internal pool/repair transfers cancel once at consolidation without new purchase/provider. X_in/X_out deduct only overlap with another already-counted SAME-SIDE gross inlet/outlet term; closing stock is never such a term. Retained new repair material/water stays in F_in and full closing wet stock; unknown changes/overlap remain unresolved. | `jrc-ilcd-attributional-2010` |\n| boundary_assets | complete foreground boundary | Separate whole physical furnace, crusher, screen, filter and test-equipment stocks from current service burdens. Record actual construction/configuration, installed parts/fluids, new and removed parts, lining/electrode wear, repairs and remaining service capacity. Allocate service only through documented actual use and causal capacity; no fixed life or whole furnace per kg grain. A replaceable electrode or lining is a consumable/stock or service as actually operated, never both charged in full and depreciated again. Preserve each new/old material and water phase without removing an ingress because it remains installed. | `jrc-ilcd-attributional-2010` |\n| boundary_atomic | complete foreground boundary | Inventory cards are conditional atoms, not a universal recipe. Establish actual presence/absence separately; missing is not zero. Add each real omitted material, supplied chemical formulation, fuel, gas, packaging component, waste and molecular or particulate species as its own card before claiming completeness. A purchased whole formulation is procured once; active ingredient, assay and carrier water are subaccounts, not additional purchases. Actual in-house preparation has separate purchased constituents, energy and losses. No presumed acid washing, steam/boiler, oxygen enrichment or ferrosilicon. | `epa-abrasive-manufacturing-1995`; `wm-fused-mineral-process` |\n| boundary_physics | complete foreground boundary | Reconcile manufacturing, FG-service and consolidated gates independently with full wet physical mass and relevant Al/C/H/O/N or other measured elements. Internal gross transfers cancel only once. Distinguish free water, structural/phase water, real reaction water, liquid, vapour and particulate material; no default alumina dehydration or all-carbon-to-CO2 assumption. Measure carbon source and CO/CO2/other carbon fate independently. Keep actual air intake/exhaust species and inert gas/humidity transport; no assumed air fractions. PM/total Al/NOx/COD/VOC are indicators or measured classes, not pure Al2O3, NO/NO2 or a specific compound. Never fit two unknown species or reaction water with one residual. | `epa-abrasive-manufacturing-1995`; `wm-fused-mineral-process` |\n| boundary_water_heat | complete foreground boundary | For each real external cooling-water or condensate supply/return specify owner, physical state, temperature/pressure and independently determined enthalpy basis plus supplier water/energy convention. A clean externally returned Product water stream remains physical output without free energy/water credit; polluted effluent and environmental discharge use their actual treatment/media. Mass carriers and heat MJ remain separate linked accounts, not duplicate provider purchase. Recirculation is internal. Do not invent steam or boiler because a furnace cools. | `epa-abrasive-manufacturing-1995`; `wm-fused-mineral-process` |\n| packaging_receipt_basis | packaging | For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. F_in/F_out remain separate independently measured actual material/water changes, not a substitute for whole-article receipt. Packaging X_in/X_out are only documented overlap deductions against another already-counted SAME-SIDE gross inlet/outlet term, never stock or actual F. Retain legacy raw X-labelled actual-change records and map each real cross-pool event once to F_in/F_out, not to an overlap deduction; asset/water gate-specific raw names keep their own scope. Current overlap records are separately identified by exact OTHER terms. Proven no same-side duplicate means X deduction zero; unknown overlap remains unresolved. Retained new material/water stays input and full closing wet mass. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names. | jrc-ilcd-attributional-2010 |\n\n"
