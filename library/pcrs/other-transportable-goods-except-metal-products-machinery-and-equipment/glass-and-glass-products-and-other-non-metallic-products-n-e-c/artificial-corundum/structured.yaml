system_boundary:
  rules:
    - rule_id: boundary_classification
      applies_to: "complete foreground boundary"
      rule: "CPC3.0:37960 names artificial corundum; this method selects a narrower whole white-fused abrasive-grain route on independent physical evidence. Neighbor37910 comprises bonded/coated abrasive articles. A title or native taxonomy is not an accepted mapping."
      source_ids:
        - un-cpc3-2025
    - rule_id: boundary_route
      applies_to: "complete foreground boundary"
      rule: "Receipt of whole calcined alumina is the starting condition. Supplier calcination remains upstream unless actually performed inside the reported site; then identify its actual feed state and add the complete calcination inventory. Do not substitute calcined bauxite, hydroxide, natural mineral, purchased finished fused grain or a brown-fused recipe. Preserve the actual cooling/solidification route and all grade processing before first release."
      source_ids:
        - alteo-white-fused-alumina
        - wm-fused-mineral-process
    - rule_id: boundary_q
      applies_to: "complete foreground boundary"
      rule: "Q is net whole grain mass newly passing its first final grade release during the reporting period. Exclude packaging and unreleased/rejected matter, but include the actual accepted grade impurities/minor phases/free moisture; do not use pure Al2O3 fraction. Same-cohort closing finished grain has already entered Q: do not add it as another production output or subtract its manufacturing burdens. Delivery, repeat inspection and returns do not create new Q."
      source_ids:
        - wm-fused-mineral-process
        - wm-duralum-special-white
    - rule_id: boundary_stock
      applies_to: "complete foreground boundary"
      rule: "Maintain raw physical and inherited-inventory vectors for opening/closing raw stores, WIP, molten/solidified material awaiting grading, rework and unused/unassigned non-WIP service stores. Internal transfer vectors cancel at consolidation. Manufacturing B_close includes only those unfinished or unused/unassigned stores, never first-released FG. Stock-corrected consumption must not be deducted again. Retain failed lots, Q=0, startup/shutdown, idle and cleanup; no unit result when Q=0."
      source_ids:
        - jrc-ilcd-attributional-2010
    - rule_id: boundary_services
      applies_to: "complete foreground boundary"
      rule: "Keep performed packing/storage/handling/dispatch/test/repair services in their original released cohort H with fixed original Q_H and observed horizon. A held FG cohort retains its performed service, even if closing FG remains. Carry only unused/unassigned service or charge forward, without deducting completed service. An optional consolidated report adds manufacturing plus actual service vectors and cancels internal Q once. Net-delivery methods are outside this denominator; any separately developed net-delivery variant requires complete opening/closing FG history, gross G/R, documented original-delivery reversal D_rev and actual incremental work/loss/water attribution. Returned mass is not presumed equal to the original delivery."
      source_ids:
        - jrc-ilcd-attributional-2010
    - rule_id: boundary_packaging
      applies_to: "complete foreground boundary"
      rule: "For each packaging material keep opening empty plus WIP/FG-attached plus reusable stock O, external purchased empty P, first non-purchased external ingress I, external return received ER, closing complete stock C, packaging accompanying gross physical shipment S, external return outward EO and waste W: O+P+I+ER+F_in=C+S+EO+W+F_out, including observed attachments and moisture. Internal reuse cancels; no second purchase, net-grain Q or automatic co-product. Preserve I as a real physical ingress and one upstream owner, even when included in supplier price. Repair-part and water X_in/X_out deduplicate only overlapping other incoming/outgoing flow terms, never stocks. New water/material retained in closing stock remains both a real ingress and full closing wet mass; P/I already including it is counted once. Gross legs are never reduced by allocation shares. F_in/F_out are independently measured material/water additions/removals across this packaging-article pool, disjoint from contents already included in the corresponding whole-article legs. Trace origin/destination and component/whole bridges; internal pool/repair transfers cancel once at consolidation without new purchase/provider. X_in/X_out deduct only overlap with another already-counted SAME-SIDE gross inlet/outlet term; closing stock is never such a term. Retained new repair material/water stays in F_in and full closing wet stock; unknown changes/overlap remain unresolved."
      source_ids:
        - jrc-ilcd-attributional-2010
    - rule_id: boundary_assets
      applies_to: "complete foreground boundary"
      rule: "Separate whole physical furnace, crusher, screen, filter and test-equipment stocks from current service burdens. Record actual construction/configuration, installed parts/fluids, new and removed parts, lining/electrode wear, repairs and remaining service capacity. Allocate service only through documented actual use and causal capacity; no fixed life or whole furnace per kg grain. A replaceable electrode or lining is a consumable/stock or service as actually operated, never both charged in full and depreciated again. Preserve each new/old material and water phase without removing an ingress because it remains installed."
      source_ids:
        - jrc-ilcd-attributional-2010
    - rule_id: boundary_atomic
      applies_to: "complete foreground boundary"
      rule: "Inventory cards are conditional atoms, not a universal recipe. Establish actual presence/absence separately; missing is not zero. Add each real omitted material, supplied chemical formulation, fuel, gas, packaging component, waste and molecular or particulate species as its own card before claiming completeness. A purchased whole formulation is procured once; active ingredient, assay and carrier water are subaccounts, not additional purchases. Actual in-house preparation has separate purchased constituents, energy and losses. No presumed acid washing, steam/boiler, oxygen enrichment or ferrosilicon."
      source_ids:
        - epa-abrasive-manufacturing-1995
        - wm-fused-mineral-process
    - rule_id: boundary_physics
      applies_to: "complete foreground boundary"
      rule: "Reconcile manufacturing, FG-service and consolidated gates independently with full wet physical mass and relevant Al/C/H/O/N or other measured elements. Internal gross transfers cancel only once. Distinguish free water, structural/phase water, real reaction water, liquid, vapour and particulate material; no default alumina dehydration or all-carbon-to-CO2 assumption. Measure carbon source and CO/CO2/other carbon fate independently. Keep actual air intake/exhaust species and inert gas/humidity transport; no assumed air fractions. PM/total Al/NOx/COD/VOC are indicators or measured classes, not pure Al2O3, NO/NO2 or a specific compound. Never fit two unknown species or reaction water with one residual."
      source_ids:
        - epa-abrasive-manufacturing-1995
        - wm-fused-mineral-process
    - rule_id: boundary_water_heat
      applies_to: "complete foreground boundary"
      rule: "For each real external cooling-water or condensate supply/return specify owner, physical state, temperature/pressure and independently determined enthalpy basis plus supplier water/energy convention. A clean externally returned Product water stream remains physical output without free energy/water credit; polluted effluent and environmental discharge use their actual treatment/media. Mass carriers and heat MJ remain separate linked accounts, not duplicate provider purchase. Recirculation is internal. Do not invent steam or boiler because a furnace cools."
      source_ids:
        - epa-abrasive-manufacturing-1995
        - wm-fused-mineral-process
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. F_in/F_out remain separate independently measured actual material/water changes, not a substitute for whole-article receipt. Packaging X_in/X_out are only documented overlap deductions against another already-counted SAME-SIDE gross inlet/outlet term, never stock or actual F. Retain legacy raw X-labelled actual-change records and map each real cross-pool event once to F_in/F_out, not to an overlap deduction; asset/water gate-specific raw names keep their own scope. Current overlap records are separately identified by exact OTHER terms. Proven no same-side duplicate means X deduction zero; unknown overlap remains unresolved. Retained new material/water stays input and full closing wet mass. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - jrc-ilcd-attributional-2010
