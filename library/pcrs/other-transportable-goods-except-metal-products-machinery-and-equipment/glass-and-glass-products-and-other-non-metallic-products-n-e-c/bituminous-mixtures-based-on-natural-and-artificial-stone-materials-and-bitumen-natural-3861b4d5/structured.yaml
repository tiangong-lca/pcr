          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_context | all processes | Use this hierarchy only where attributional partitioning is justified by the study goal. Industrial manufacturing descriptions do not establish LCA allocation; the ILCD attributional context and its limitations apply. Do not switch arbitrarily to substitution or automatic avoided-product credit. | `jrc-ilcd-2010` |\n| dedicated_subdivision | each exchange | First collect and assign dedicated actual unit operations, batches, ingredients and services; use real subdivision and then justified virtual subdivision. Quantitatively identify which exchanges exclusively serve which product/cohort before pooling a residual. Do not allocate one product-specific binder or component to unrelated output. | `jrc-ilcd-2010` |\n| determining_causality | unresolved shared exchanges | For the remaining shared exchanges, establish exchange-specific determining physical causality with measured process understanding: actual dryer moisture removal/thermal demand, mixing duty, occupied storage capacity and duration, or equipment use where those truly determine the exchange. Mere correlation, mass presence or a convenient time/mass key is insufficient. Document the determinant, data and exceptions for each exchange rather than one blanket physical fraction. | `jrc-ilcd-2010` |\n| residual_market_value | genuinely remaining common process | Only what still cannot be resolved by dedicated/virtual subdivision and determining physical causality uses actual contemporaneous market values of genuine co-functions at the same common-process exit, in their real wet/dry/thermal/contaminated state. Reconcile quantities, currency, period, gate and services; document missing/zero/negative prices without inventing a fraction. Further processing/transport values are not interchangeable with exit values. Do not turn ordinary dust, failed mix, samples or sold waste into a burden-removal key by sale alone. No fixed ratios or automatic recycling/carbonation credits. | `jrc-ilcd-2010` |\n\n"
