  covered_products: "One declared virgin natural-stone/sand and unmodified petroleum-binder hot mixture made by separate batch pugmill mixing"
  excluded_products: "Exclude refinery bitumen manufacture as the foreground terminal; natural-asphalt extraction; roofing/shingles; placed, compacted or cured pavement; transport to the paving site, placement and use-life/road-layer design. Purchased finished mix does not replace aggregate/binder manufacture. This selected profile excludes external RAP, recycled aggregates, polymer modification, warm-mix foaming/additives, emulsions, coal tar, continuous/drum mixing, wet scrubbers and deliberate onsite wastewater treatment. Any actual such route needs an evidence-based applicability reassessment and complete added atomic exchanges before use; RAP whole supply is bought once, with recovered binder/minerals/water as child accounts and a justified upstream/recycling burden, never free feed."
  representative_product: "Virgin batch hot-mix asphalt manufacture"
  production_route: "This attributional PCR covers plant batch manufacture of one declared conventional virgin hot-mix road mixture from individually supplied natural coarse stone, fine sand, whole unmodified petroleum asphalt binder and actual limestone mineral filler. The complete route is receipt and moisture/grade-controlled stockpiling/cold feed; rotary aggregate drying/heating; hot elevation, screening and hot-bin storage; real binder storage/line heating and metering; calibrated batch weighing and separate pugmill mixing; discharge, required fresh checks/weighing and unique first authorized plant quality release. Include pre-release handling, dust/fume controls, QC resources, samples, failed/zero-output batches, start/stop, idle, cleanup and actual permitted rework. Selected utility configuration is fossil natural-gas drying, electric binder/line heating and dry dust collection; adopted electricity is restricted to the China 1–35 kV user-side grid interface. Actual optional diesel stockpile handling is collected separately. The primary documents are combined transparently as technical methodology, not one demonstrated SKU/order/factory. They do not prescribe mix design, recipe, binder grade, air voids, temperatures/times, compaction, strength/test thresholds, density/yield, certification or road life."
  market_state: "Complete fresh hot uncompacted bulk mix at unique first plant release; no installed pavement or fixed workable life"
