  how_long_or_cycle: "One actual unique first plant quality release; no road life or storage duration default"
  reference_flow_link: "first_release_hot_mix"
system_boundary:
  rules:
    - rule_id: upstream_whole_supply
      applies_to: "manufacture; assets; services"
      rule: "Start from actual burden-bearing whole receipts and declared supplier/inbound gates. Carry each whole formulation once; moisture, binder fractions and mineral assays are child accounts. Include any real incoming transport/service not already covered by the provider. Supplier-included packaging still has a physical ingress and exactly one upstream owner. Add every actually used omitted ingredient, preparation, fuel, water phase, package, test consumable, repair material, waste and measured species as its own card before completing a dataset; absence needs observed evidence, not a convenient zero."
      source_ids:
        - fhwa-hma-inspectors-manual
        - epa-ap42-hma-2004
    - rule_id: first_release_gate
      applies_to: "manufacture; services"
      rule: "Q is the independently weighed net wet whole fresh mix uniquely first released after the actual required pre-release checks and authorization at the declared plant interface. Include all handling up to that actual release point. Record time, temperature, water and phase/setting state; record outstanding later tests and any release limitations honestly. Q includes closing already-released FG; do not add FG again as production or deduct its already-incurred manufacturing burden. Delivery/reinspection/rework never creates fresh Q. Samples removed before release and unaccepted failures are outside Q."
      source_ids:
        - fhwa-hma-inspectors-manual
        - epa-ap42-hma-2004
    - rule_id: complete_thermal_route
      applies_to: "manufacture"
      rule: "Retain actual wet mineral receipts, each cold-feed grade, free/absorbed moisture and dryer load, burner and ventilation paths, hot screening/bin inventories, binder tank heels/circulation/actual electric heat, calibrated binder/filler/aggregate batching and complete pugmill cycle. Record actual control and release evidence without transferring historical source values as operating defaults. Internal returned fines keep their inherited vectors and cancel matched transfers once; they are not external recycled feed or a second purchase."
      source_ids:
        - fhwa-hma-inspectors-manual
        - epa-ap42-hma-2004
    - rule_id: cohort_vectors
      applies_to: "manufacture; assets; services"
      rule: "Retain opening/closing raw, WIP, uninvoiced/unused supplies and per-exchange inherited vectors, not only mass fractions. Manufacturing closing vector stocks contain unreleased raw/WIP or genuinely unused/unassigned stores; they exclude released FG. Failed batches, idle, starts/stops, tests, cleanup, ordinary waste and its treatment remain in the proper cohort. Do not deduct stock-corrected consumption again. A burden transfer out needs a real independent other cohort/function and one justified handover; waste export or sale alone is insufficient."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: postrelease_state
      applies_to: "services"
      rule: "Keep original manufacture vectors and Q_c, actual gross shipments/returns and original-cohort incremental service over observed h. Aged/cooled/contaminated or returned mix has its actual state; no presumption that reheating or added binder restores it. Any actual postrelease work needs manufacturer/spec permission, added old/new materials and water/phase/mass evidence, postwork tests/acceptance and disposition. No second Q. Only unused/unassigned service or charge can carry forward; performed original-cohort service is not removed because FG stays in stock. This PCR uses first release; a net-delivery basis is a different method requiring original-delivery reversals and full stock burden, not an interchangeable denominator."
      source_ids:
        - fhwa-hma-inspectors-manual
        - epa-ap42-hma-2004
        - jrc-ilcd-2010
    - rule_id: gross_mass_and_phases
      applies_to: "all processes"
      rule: "Reconcile gross wet physical masses independently of burden allocation. Keep external gas species, carrier mass, liquid/solid phases, old/new parts and full installed fluids with actual chemical identity. Outside packaging pools, preserve asset/FG/water gate-specific actual repair-material/water records named X_in/X_out and their declared same-side duplication checks. For packaging pools, actual changes are F_in/F_out and packaging X_in/X_out only documented SAME-SIDE OTHER overlap deductions. A real new inlet remains even when retained in full closing wet stock; bridge actual cross-pool events by owner/direction rather than interpreting an old raw label as a packaging deduction. Deduplicate assembly/component measures only once. The manufacturing and service physical gates below must combine exactly; no economic share scales gross mass."
      source_ids:
        - fhwa-hma-inspectors-manual
        - epa-ap42-hma-2004
        - jrc-ilcd-2010
    - rule_id: species_water_carbon
      applies_to: "manufacture; services; assets"
      rule: "Separate full physical mass and relevant C/H/O/N/S and mineral-element balances from independently evidenced species and water origins. Drying is not proof of mineral calcination, reaction water or carbonation. Distinguish free, absorbed, structural and actual reaction water by independent evidence; never fit two unknowns to one residual. Separate actual mineral, fossil fuel/binder and ambient carbon. Keep NOx/SOx/VOC/TOC/COD and overlapping PM metrics as metrics until speciation/partition evidence exists; they cannot be relabelled as molecular masses. Actual missing core relationships make a concrete dataset inconclusive."
      source_ids:
        - epa-ap42-hma-2004
        - fhwa-hma-inspectors-manual
    - rule_id: utility_and_asset_ownership
      applies_to: "assets; manufacture; services"
      rule: "No boiler, steam, hot-oil heater, heat provider, compressor or refrigerant is presumed. If actual equipment/services differ, reassess this selected configuration and add each real fuel, carrier, water/condensate return, fluid charge and phase-specific loss. Purchased heat/steam has one provider owner with carrier mass, delivered enthalpy and supplier water/energy agreement; do not duplicate provider heat and onsite generation. Keep physical machine/liner/filter/old-fluid stock separate from the embodied service actually used, with no invented life or unit mass."
      source_ids:
        - fhwa-hma-inspectors-manual
        - epa-ap42-hma-2004
        - jrc-ilcd-2010
    - rule_id: package_six_legs
      applies_to: "all packaging uses"
      rule: "For each actual packaging material/whole assembly, opening empty/attached WIP-FG/reusable stock + external plant purchase P + first non-purchased external ingress I + external returns received ER + independently measured material/water additions F_in = corresponding closing stock + material departing with actual gross shipments S + external outward returns EO + waste W + independently measured material/water removals F_out. Retain all six gross legs without economic scaling. Internal reuse cancels once and is not a new purchase, net-product Q or an automatic coproduct. P/I whole assemblies already include their measured components once; attached contents and water are child accounts deduplicated against other physical terms, never an excuse to omit true new ingress or full closing wet mass. F_in/F_out cross this article pool and exclude contents already inside the corresponding whole-article leg. Trace component/whole and origin/destination bridges; internal pool/repair transfers pair and cancel once at consolidation without a new purchase/provider. X_in/X_out only remove documented overlap with another already-counted SAME-SIDE gross inlet/outlet, never closing stock. Retained new material/water remains an input. These are raw physical companions; do not change the cards’ separate burden-vector roles or denominators."
      source_ids:
        - fhwa-hma-inspectors-manual
        - jrc-ilcd-2010
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. F_in/F_out remain separate independently measured actual material/water changes, not a substitute for whole-article receipt. In this packaging pool X_in/X_out mean only documented overlap deductions against another already-counted SAME-SIDE gross inlet/outlet, never stock or actual F. Other gate-specific variables, including F_to/F_back and asset/FG/water X records, keep their declared roles; bridge actual cross-pool material/water movements to packaging F_in/F_out, never to a packaging X deduction merely because of a legacy label. Proven absence of another same-side duplicate makes the packaging X deduction zero; unknown overlap stays unresolved. Retained new material/water remains input and full closing wet mass. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - jrc-ilcd-2010
