  calculation_rules:
    - id: raw_unit_conversion
      applies_to: "all inventory rows"
      rule: "Preserve every original unit and actual measurement state. Convert cumulative meter differences once; an already integrated volume is not multiplied by time. Integrate a genuine rate only over its measured interval. For electricity MJ = 3.6 * metered_kWh from the exact energy unit group. For a volume-to-mass conversion use independently measured density of that same substance/mixture at the matching state; retain gas pressure/temperature/compressibility and humidity. Fuel carrier mass and delivered heat are linked separate accounts with one upstream owner; no secondary property supplies an unmeasured density or heating value."
      inputs:
        - raw_readings
        - unit_factors
        - actual_state
        - independent_density
        - gas_composition
      output: "converted_raw"
      source_ids:
        - fhwa-hma-inspectors-manual
        - epa-ap42-hma-2004
    - id: manufacture_vector
      applies_to: "all inventory rows"
      rule: "A_i = B_open_i + C_i + T_in_i - B_close_i - T_out_i. Each term is a same-unit inherited exchange vector after dedicated assignment, subdivision and justified exchange-specific allocation. C_i includes actual whole acquisitions and incurred services only once, including failures/zero output, start/stop, idle, QC, cleanup and treatment. B_close_i is unreleased raw/WIP or genuinely unused/unassigned supplies/service, never already-released FG. T_out_i needs a real independent other cohort/function and justified single burden handover; ordinary waste or sales do not suffice. If consumption was already stock-corrected do not perform that correction a second time."
      inputs:
        - B_open_i
        - C_i
        - T_in_i
        - B_close_i
        - T_out_i
      output: "A_i"
      source_ids:
        - jrc-ilcd-2010
    - id: original_cohort_service
      applies_to: "services"
      rule: "A_service_i_c_h contains only actual incremental service/work/treatment performed for original cohort c during observed horizon h, plus its justified inherited service inputs, excluding only truly unused/unassigned service stores. Keep original manufacture vector and Q_c separate. Closing FG does not remove performed services. Returns/reinspection/permitted work do not generate Q; actual new materials, added water, state changes, loss and postwork authorization/tests/disposition remain. Do not extrapolate h to an invented storage life."
      inputs:
        - original_cohort
        - Q_c
        - h
        - actual_service_records
        - unused_service_vectors
      output: "A_service_i_c_h"
      source_ids:
        - fhwa-hma-inspectors-manual
        - epa-ap42-hma-2004
        - jrc-ilcd-2010
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "u_i = A_i / Q; u_i is the exchange amount per 1 kg reference flow. A separately reported original-cohort service uses A_service_i_c_h and original Q_c in this same operation. Q must be positive. At Q = 0 keep actual burden and mass records but produce no unit result. This is the only division by the product denominator; cards and collection target labels reference this same u_i without another division. first_release_hot_mix is exactly 1 kg net fresh wet mix."
      inputs:
        - A_i
        - Q
        - A_service_i_c_h
        - Q_c
        - cp_first_release_hot_mix
      output: "u_i"
      source_ids:
        - jrc-ilcd-2010
    - id: manufacture_physical_gate
      applies_to: "manufacture; assets"
      rule: "Opening unreleased raw/WIP/supplies/packaging/physical assets/installed fluids + all actual external manufacturing/asset ingress + original released material withdrawn for authorized work F_to = corresponding complete closing unreleased/in-place wet stocks + unique net first release Q + actual attached packaging transfer P_Q + original material handed back after work F_back + all external solid/liquid/gas exits. All terms are gross physical mass with actual moisture; retain new material/water even when it remains in closing stock. Cancel same-gate internal fines once. No economic burden fractions scale this identity; electricity/heat remain separate energy accounts."
      inputs:
        - opening_manufacture_stocks
        - external_manufacture_ingress
        - F_to
        - closing_manufacture_stocks
        - Q
        - P_Q
        - F_back
        - manufacture_exits
      output: "manufacture_gross_balance"
      source_ids:
        - fhwa-hma-inspectors-manual
        - epa-ap42-hma-2004
    - id: service_physical_gate
      applies_to: "services"
      rule: "Opening released FG with attached packaging + Q + P_Q + actual external returns R + F_back + actual external service-material/water/packaging ingress = full closing released/returned FG and service stocks + actual gross shipments G with attached packaging + F_to + all actual external service exits. Returned mass is the measured current material, not assumed equal to an old shipment. New service water/material remains a real inlet even if held in full closing wet stock; deduplicate only against other already counted terms. Cancel Q/P_Q and F_to/F_back at combination with the manufacture gate; do not report Q plus closing FG as two production outputs."
      inputs:
        - opening_FG
        - Q
        - P_Q
        - R
        - F_back
        - external_service_ingress
        - closing_FG
        - G
        - F_to
        - service_exits
      output: "service_gross_balance"
      source_ids:
        - fhwa-hma-inspectors-manual
        - epa-ap42-hma-2004
    - id: combined_physical_gate
      applies_to: "all processes"
      rule: "After cancelling matched internal Q/P_Q, F_to/F_back and any internal fines, opening combined wet stocks + all real external ingress + actual external returns R = complete closing wet stocks + gross G shipments + all other external solid/liquid/gas exits. Include new/old machinery, parts, installed fluids, packaging and each independently identified air species; keep mass, relevant elements, water phases and energy independently reconcilable. One residual may be a discrepancy, not evidence for two unknown species or reaction-water amounts."
      inputs:
        - opening_combined_stocks
        - external_ingress
        - R
        - closing_combined_stocks
        - G
        - other_external_exits
      output: "combined_gross_balance"
      source_ids:
        - fhwa-hma-inspectors-manual
        - epa-ap42-hma-2004
    - id: package_reconciliation
      applies_to: "each packaging exchange"
      rule: "For each actual package material/assembly: Opening + P + I + ER + F_in = Closing + S + EO + W + F_out. P is plant external purchase; I is first non-purchased external ingress; ER is external return received; S departs with gross physical shipments; EO is outward external return; W is waste. Include empty/attached/reusable stocks at opening and closing. Count assembly/components and adherent water/material once by exact other-term reconciliation, without cancelling a true new inlet merely because it remains in closing stock. Internal reuse cancels once; no mass scaling by burden shares. F_in/F_out are actual independently measured article-pool material/water additions/removals not contained in the matching whole-article leg. Reconcile component and pool transfers; cancel internal transfers once at consolidation. X overlap deductions require another already-counted SAME-SIDE gross flow term, never closing stock or retained new ingress. Keep all physical pool quantities distinct from inherited burden/service vectors; unknown changes/overlap remain unresolved."
      inputs:
        - Opening
        - P
        - I
        - ER
        - Closing
        - S
        - EO
        - W
        - F_in
        - F_out
      output: "package_gross_balance"
      source_ids:
        - fhwa-hma-inspectors-manual
        - jrc-ilcd-2010
    - id: species_and_moisture
      applies_to: "all inventory rows"
      rule: "Use independent measurements to reconcile received wet mineral = mineral solids + free/absorbed/other independently established water, and each actual outgoing phase. Keep fuel/binder/mineral/ambient carbon origins separate. Derive specific gaseous masses only from actual speciation and matched-state gas measurements, separating integrated volume from rate. VOC/NOx/PM totals remain metrics with explicit coverage until resolved. No fixed natural-gas composition, mineral decomposition, binder oxidation, phase water or carbonation credit is inferred from closure."
      inputs:
        - wet_receipts
        - independent_solids
        - water_phase_measurements
        - gas_speciation
        - matched_state_gas
        - carbon_origins
      output: "independent_phase_species_balances"
      source_ids:
        - epa-ap42-hma-2004
        - fhwa-hma-inspectors-manual
  data_quality_requirements:
    - id: dq_raw
      applies_to: "all inventory rows"
      requirement: "Retain complete raw originals, units, timestamps, calibration/stock logs, actual supply and receiving gates, state/composition and uncertainty. No fabricated future amount or default factor."
      evidence: "Calibrated weighing/meter records; supplier and receiver originals; sampling chain"
    - id: dq_coverage
      applies_to: "all processes"
      requirement: "Cover full cohorts including failures, samples, zero output, start/stop, idle, cleanup, control, rework and raw/WIP vectors. Distinguish supported absence, unmeasured and unresolved."
      evidence: "Whole-plant period reconciliation and explicit gap register"
    - id: dq_service
      applies_to: "services"
      requirement: "Bind actual performed services and current return states to original Q_c and observed h. Do not deduct performed service because FG is retained; no unobserved extrapolation or repeat Q."
      evidence: "Cohort transfer logs; original shipments; return and work permissions/tests/disposition"
    - id: dq_sources
      applies_to: "all external sources"
      requirement: "Retain independent source scope and limitations. Use manufacturing originals for route and industrial context; use ILCD for justified attributional allocation. No historical recipe/test/factor or single-plant identity is an industry default."
      evidence: "Original-context applicability decisions and declared foreground protocols"
validation_rules:
  - rule_id: valid_core_terminal
    applies_to: "reference product; first_release_hot_mix"
    rule: "Require a compatible whole manufactured Product Mass/kg identity and actual fresh plant terminal, all physical qualifiers and one unambiguous first-release output link. Binder/aggregate/excavated pavement/roofing or an installed-cured provider is incompatible. A public UUID and Schema success alone do not approve a provider or applicability."
    source_ids:
      - fhwa-hma-inspectors-manual
      - epa-ap42-hma-2004
  - rule_id: valid_complete_route
    applies_to: "all inventory rows"
    rule: "Check complete receipt/drying/hot bins/binder storage/pugmill/controls/QC route and actual conditional exchanges, including each supplied grade/formulation, fuel, water/phase, package, waste and molecular species. A real scope conflict or missing core method blocks concrete use. Unresolved compatible auxiliary identities/provider data require explicit completion, not replacement with collection labels or invented quantities."
    source_ids:
      - fhwa-hma-inspectors-manual
      - epa-ap42-hma-2004
  - rule_id: valid_single_basis
    applies_to: "all inventory rows"
    rule: "Verify Q > 0 for a unit result, raw original units and conversion before attribution, and the single normalization. At zero Q retain actual burden without a unit result. All cards target per 1 kg reference flow while collection stores raw unnormalized records; original-cohort services use their own Q_c and observed h. No second division, FG manufacture deduction or repeat production."
    source_ids:
      - jrc-ilcd-2010
      - fhwa-hma-inspectors-manual
  - rule_id: valid_physical_closure
    applies_to: "all processes"
    rule: "Independently reconcile manufacture, service and combined gross wet mass gates, relevant elements, energy, all package six legs and full new/old asset/fluid stocks. Do not scale physical legs by allocation shares, cancel a real new material/water inlet retained in closing stock, or use ordinary waste/sales as automatic burden transfer. Speciation and actual water phases remain separately evidenced; unresolved relationships are inconclusive."
    source_ids:
      - fhwa-hma-inspectors-manual
      - epa-ap42-hma-2004
      - jrc-ilcd-2010
  - rule_id: valid_return_work
    applies_to: "services"
    rule: "Keep original cohort, actual old shipment and current gross return identities, state evolution, permissions and postwork tests/acceptance/disposition. No presumed restoration by heat or binder addition and no fresh Q from dispatch/reinspection. Net-delivery claims require a separately completed method with real original-delivery reversals and full opening/closing FG burdens."
    source_ids:
      - fhwa-hma-inspectors-manual
      - epa-ap42-hma-2004
      - jrc-ilcd-2010
  - rule_id: valid_evidence_and_quality
    applies_to: "all processes"
    rule: "Check source-specific route/state/need and original context, exact native identity/property/unit conditions, supplier gates, actual calibration/speciation and uncertainty. Historical primary route descriptions are not factory data or contemporary acceptance thresholds. Scientific/translation approval, accepted classification mapping and publication are separate decisions; engineering checks do not make them."
    source_ids:
      - fhwa-hma-inspectors-manual
      - epa-ap42-hma-2004
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual compatible fresh virgin batch hot-mix supply into a separately modelled paving product system"
  allowed_use: "Only after actual route/state, complete site inventories, unit/burden/stock/species checks and provider applicability have been established; preserve original-cohort service horizon separately"
  excluded_use: "Exclude refinery bitumen manufacture as the foreground terminal; natural-asphalt extraction; roofing/shingles; placed, compacted or cured pavement; transport to the paving site, placement and use-life/road-layer design. Purchased finished mix does not replace aggregate/binder manufacture. This selected profile excludes external RAP, recycled aggregates, polymer modification, warm-mix foaming/additives, emulsions, coal tar, continuous/drum mixing, wet scrubbers and deliberate onsite wastewater treatment. Any actual such route needs an evidence-based applicability reassessment and complete added atomic exchanges before use; RAP whole supply is bought once, with recovered binder/minerals/water as child accounts and a justified upstream/recycling burden, never free feed."
  required_metadata: "plant site and reporting period; virgin natural mineral origin and each separately supplied aggregate grade; whole unmodified petroleum binder supply and actual grade; actual limestone filler and each whole preparation if present; explicit absence of external RAP or other recovered feed for this selected route; natural-gas rotary drying and separate hot screens/bins and pugmill; electric binder storage/line heating and actual dust-control configuration; actual supplied moisture and independent dry solids/free/absorbed water; whole fresh uncompacted mix at its measured temperature/time and phase or setting state; actual mixture specification and all applicable pre-release checks and authorization; calibrated unique net first-release wet mass Q and original cohort Q_c; opening/closing raw and WIP inherited exchange vectors; released FG stock and original shipments/returns without new production; observed postrelease service horizon h and actual incremental burden; manufacturer/spec permission and postwork tests/acceptance/disposition for any later work; China 1–35 kV user-side grid interface for adopted electricity; each real fuel/water phase and species-specific emissions with carbon origins; supplier-included package ingress and single upstream owner; new/old assets and parts with installed fluids and performed service; actual suppliers/receivers and independent unit conversions and uncertainty"
  required_quality_disclosure: "Actual original gates, source age and qualitative scope, all UUID/provider/measurement uncertainties and omissions, actual failed/zero-output coverage, allocation determinants/residual values, h and state changes; no readiness claim from Schema alone"
  update_trigger: "Any real raw-material grade/formulation, RAP/recovered input, hot/cold/warm route, utility/control/asset, first-release interface, geography/voltage, source, return/work state or allocation evidence change"
data_sources:
  - id: "fhwa-hma-inspectors-manual"
    type: "official_guidance"
    reference: "FHWA, Principles of Construction of Quality Hot-Mix Asphalt Pavements: Inspectors' Training Course Manual (archived), chapter 4, especially §§4.5–4.8, 4.11–4.24 and adjacent drum counterroute; https://www.fhwa.dot.gov/pavement/pubs/014724.pdf"
    used_for: "Complete batch manufacture and actual handling/storage, electric versus hot-oil binder storage, filler and dust return, weighing, records and plant QC; historical route context only, no numerical recipe/test/time/temperature/storage-life defaults"
  - id: "epa-ap42-hma-2004"
    type: "official_guidance"
    reference: "US EPA, AP-42 §11.1 Hot Mix Asphalt Plants, March 2004, §§11.1.1–11.1.2 and Figures 11.1-1–3; complete section retained in EPA official January 2021 archive; https://19january2021snapshot.epa.gov/sites/static/files/2020-10/documents/c11s01.pdf"
    used_for: "Whole fresh HMA terminal, batch and RAP/drum counterroutes, drying/heating/hot bins/mixing and actual ducted/fugitive/condensable control context; no emission factor, industry share, moisture, recipe or operating default adopted"
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for Life Cycle Assessment, Detailed guidance, first edition March 2010, §§7.9.2–7.9.3, printed pp.255–272 / PDF pp.275–292; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Justified attributional subdivision/virtual subdivision, exchange-specific determining physical causality and truly residual same-process-exit contemporaneous market values; cohort-vector and gross-ledger rules are explicit foreground implementations, not quoted ILCD equations"
