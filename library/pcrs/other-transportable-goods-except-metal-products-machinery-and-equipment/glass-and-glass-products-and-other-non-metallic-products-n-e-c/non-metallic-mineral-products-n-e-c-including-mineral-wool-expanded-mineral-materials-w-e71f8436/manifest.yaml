  semantic_boundary_review:
    decision: "new_narrow_candidate"
    rationale: "All1282 material source scopes and frozen intakes compared. Whole asbestos-free mineral/cupola/short-fibre/aqueous phenolic binder/gas cure/bare-board first-release terminal differs from continuous reinforcement roving, woven glass, foam glass, moler brick, natural mineral inputs, cellulose cement board and chrysotile SBR sheet. No shared mapping or catalog mutation."
  native_identity_caveats:
    - "Whole Rock Wool manufactured Product has Mass/kg native reference and no fixed pure-fibre CAS or binder exclusion. Positive primary whole-board evidence supplies terminal limitation. Its16390 taxonomy and misleading Chinese asbestos-like wording are disclosed, not silently followed. Scope explicitly excludes asbestos."
    - "Bound CN1–35kV consumer electricity uses native Net calorific value/MJ. A different geography/interface/provider needs another flow. Gas volume and physical fuel mass remain independently measured; no secondary coefficient is a density."
    - "Elementary flows require exact molecule/CAS/phase/media/direction. Synonym lists contain broad/isotope/other-form aliases; these do not authorize substitution. High-stack/nonurban, unspecified-air and resource-from-air conditions are explicit per card."
    - "Basalt elementary resource is rejected as a purchased mineral Product; fine200-mesh dolomite and milling-only limestone are not lump feed; neat resin does not prove the whole aqueous binder; electrical oil and PAO do not prove fibre oil; fixed-NCV coke and methane-CAS natural gas are not generic recipes."
    - "All adopted reference properties and all other native properties have independently read exact-version property/group/reference-unit support; no latest substitution. Versions, raw evidence and audit traces are external."
    - "Later refined mineral-oil and HCl/HF queries were followed by public100 membership, exact full direct native reads, complete property chains and card restrictions before adoption. Pure mineral oil CAS8012-95-1 does not establish another compounded formulation."
  source_flow_classification_review:
  - flow_uuid: e882bdf4-1cf6-4f51-93e9-c6b91855ba02
    row_ids: [pack_pallet]
    reported_classification: Active CPC 17100 Electrical energy
    physical_identity_evidence: Wooden-pallet names, board/slat construction, lumber-mill mix and Product Mass/kg support a conditional whole wooden pallet; the received wood-packaging classification is preserved history only.
    qualification: Require actual construction, measured wet mass and compatible supplier/provider definition. No energy-unit substitution, assumed size/weight/life or fully verified classification/provider claim.
    review_state: Source-owner classification clarification required; scientific approval remains pending.
  ordinary_data_gaps:
    - "Actual future site/supplier/grade/whole formulations, quantities, measured states/moisture/geometry, emissions/species, native aux identities, energy/water/provider interfaces, asset service, release tests, stock vectors and permitted postwork need real foreground evidence; no numbers invented."
    - "Every additional actual ingredient, energy, water, equipment part, package, waste or species requires an individually named card and source/identity check. Actual onsite mixing/briquetting and postrelease increments cannot hide inputs in generic totals."
    - "Industrial sources are transparent technical synthesis across historical JRC and multi-site manufacturer case, not one SKU/factory/order. No EPD cutoff, source density/factor, free recycled burden or credit is adopted."
