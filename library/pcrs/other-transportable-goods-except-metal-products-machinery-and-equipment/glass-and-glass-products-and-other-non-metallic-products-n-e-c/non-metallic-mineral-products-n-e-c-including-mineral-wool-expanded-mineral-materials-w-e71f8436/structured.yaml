  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Convert original cumulative totals into each row native extensive unit; only real rate observations are integrated over matching actual intervals. Derive separate physical gross and burden/service attribution records before normalization."
      inputs:
        - raw_events
        - calibrated_units
        - actual_state
        - composition
        - density
        - metering_scope
      output: "native_raw_totals"
      source_ids:
        - jrc-glass-bref-2013
        - jrc-ilcd-2010
    - id: calc_q
      applies_to: "finished_board"
      rule: "Q = sum of net whole board mass newly passing unique first release; deduplicate event identities and exclude packaging/pore air. No redelivery or inspection creates output."
      inputs:
        - cp_finished_board
        - unique_release_events
        - net_mass
        - configuration
        - moisture
      output: "Q"
      source_ids:
        - jrc-glass-bref-2013
        - jrc-ilcd-2010
    - id: calc_manufacturing
      applies_to: "manufacture"
      rule: "A_mfg = B_open + B_in + B_conversion - B_close - T_other, component by component. B_open/B_close cover raw/WIP and genuinely unused/unassigned non-WIP charge/service only. B_in includes every real incoming burden once; B_conversion includes all success/failure/control/cleanup/treatment. B_close excludes released FG. T_other requires allocation_waste. Stock-corrected consumption uses a disjoint partition and is not stock-corrected again."
      inputs:
        - native_raw_totals
        - opening_vectors
        - incoming_vectors
        - conversion_vectors
        - closing_raw_WIP_unassigned_vectors
        - justified_transfer_vectors
      output: "A_mfg"
      source_ids:
        - jrc-glass-bref-2013
        - jrc-ilcd-2010
    - id: calc_service
      applies_to: "postrelease"
      rule: "A_service_cH contains actual performed increments for original cohort c over H plus inherited unused/unassigned charge used, less only genuinely unused/unassigned closing charge and justified other-function transfer. Performed service for held FG stays in A_service_cH; historical manufacture is not purchased again. Preserve original Qc and actual work/returns/test/disposition history."
      inputs:
        - native_raw_totals
        - original_Qc
        - H
        - service_vectors
        - charge_open
        - charge_close
        - justified_transfers
      output: "A_service_cH"
      source_ids:
        - jrc-glass-bref-2013
        - jrc-ilcd-2010
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "For Q>0 calculate I_i=A_mfg_i/Q once; for service use I_service_i=A_service_cH_i/Qc once when Qc>0. Collection protocols retain raw totals and cards/aggregation refer to these same results, with no second division. Q=0 or Qc=0 retains real burden and produces no unit result."
      inputs:
        - A_mfg
        - Q
        - A_service_cH
        - Qc
      output: "I_i; I_service_i"
      source_ids:
        - jrc-glass-bref-2013
        - jrc-ilcd-2010
    - id: calc_physical
      applies_to: "all physical gates"
      rule: "For each actual material/phase: full wet opening + gross incoming + independently established transformation terms = full wet closing + gross outgoing. Maintain relevant independent elemental balances and species evidence. Across consolidation cancel internal Q and paired internal reuse only. Never apply burden-allocation shares to gross physical legs."
      inputs:
        - wet_opening
        - gross_incoming
        - phase_transformations
        - wet_closing
        - gross_outgoing
        - independent_elements
        - species_evidence
      output: "physical_balance_residuals"
      source_ids:
        - jrc-glass-bref-2013
        - jrc-ilcd-2010
    - id: calc_packaging
      applies_to: "all packaging"
      rule: "For each material/article: opening + P + I + ER + F_in = closing + S + EO + W + F_out. Opening/closing include empty, attached WIP/FG and reusable full wet stock. Reconcile X_in/X_out against other incoming/outgoing terms only; retain new influx even if retained in closing. One upstream burden owner and no duplicate whole preparation/contents. F_in/F_out map the independently measured added_new_material_water/removed_old_material_water records to this article pool, excluding contents already included in the corresponding whole-article leg. Preserve actual origin/period and component/whole bridges; internal donor/receiver repair or pool transfers cancel once at consolidation, not as new purchases/providers. X_in/X_out deduct only documented overlap with another already-counted SAME-SIDE gross inlet/outlet, never closing stock. New material/water retained in closing stays an input; unknown changes/overlap remain unresolved, not fitted to the residual. Inputs X_in/X_out in this packaging reconciliation are solely the documented overlap values from X_overlap_in/X_overlap_out records, not legacy raw actual-change quantities. Actual legacy changes and added/removed-material-water records map by one event/owner bridge to F_in/F_out. When complete records demonstrate no OTHER same-side duplicate, X deductions are zero and a real retained F input remains counted; unknown overlap remains unresolved."
      inputs:
        - pack_open
        - P
        - I
        - ER
        - pack_close
        - S
        - EO
        - W
        - X_in
        - X_out
        - upstream_owner
        - F_in
        - F_out
      output: "packaging_balance_residuals"
      source_ids:
        - jrc-glass-bref-2013
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Verify actual whole product/chemical, physical state, grade/route, CAS, medium/type, all native name qualifiers, geography and exact reference-property/unit chain before binding. Broad identity is not provider evidence; hard mismatch remains unusable for that exchange."
      evidence: "supplier and full native records; actual composition/state"
    - id: dq_cohort
      applies_to: "all records"
      requirement: "Collect full time/campaign including failures, no-output, start/stop, idle/cleanup, opening/closing WIP and each inherited vector, original FG cohort and actual H; do not select only successful hours."
      evidence: "complete original logs; stocktakes; release and service register"
    - id: dq_species
      applies_to: "physical and emissions"
      requirement: "Retain actual independently determined species/phases and relevant elements; no residual fitting several unknowns or conversion of indicators to arbitrary molecules. Record meter calibration, dry/wet/reference gas state and actual integrated quantity."
      evidence: "laboratory methods; sampling and metrology; residual and uncertainty"
    - id: dq_sources
      applies_to: "all normative rules"
      requirement: "Preserve applicable source edition/context/limitations and separate industrial route from attributional method. No source numeric default or automatic EPD/scientific/translation approval."
      evidence: "source locators; original context; independent applicability review"
    - id: dq_closure
      applies_to: "manufacture; postrelease"
      requirement: "Reconcile all real inflows/outflows, full wet stocks, packaging/asset gross legs and every burden-vector component. A missing actual preparation, substance, species, provider boundary or real core terminal remains explicit; add individually before dataset completion."
      evidence: "ledger reconciliation; one-owner receipts; gaps and sensitivity"
validation_rules:
  - rule_id: validate_scope
    applies_to: "dataset"
    rule: "Verify the full selected route and whole board including retained binder/oil; wrong family/furnace/facing/chemical/particle/medium/type is not rescued by a classification tag or generic UUID."
    source_ids:
      - jrc-glass-bref-2013
      - jrc-ilcd-2010
  - rule_id: validate_reference
    applies_to: "finished_board"
    rule: "Require unique first-release Product output, net measured whole Q and complete qualifiers. Core reference lacking valid public native identity and positive whole-terminal evidence is a true hold; a formally passing check cannot waive it."
    source_ids:
      - jrc-glass-bref-2013
      - jrc-ilcd-2010
  - rule_id: validate_attribution
    applies_to: "all rows"
    rule: "Check each raw event/unit, physical and burden partition, stock vectors, ordinary losses/treatment, Q0 retention and exactly one calc_normalize. Closing released FG cannot remove manufacturing burden; held FG cannot remove performed service."
    source_ids:
      - jrc-glass-bref-2013
      - jrc-ilcd-2010
  - rule_id: validate_gross
    applies_to: "physical ledgers"
    rule: "Check all gross gates, independent element/species/water evidence, packaging six legs, supplier-included ingress, new/old repairs, actual carrier returns and no closing-stock cancellation of influx or economic shrinking of mass."
    source_ids:
      - jrc-glass-bref-2013
      - jrc-ilcd-2010
  - rule_id: validate_postwork
    applies_to: "postrelease"
    rule: "Require actual manufacturer/spec permission, named additional materials/water, postwork tests/acceptance/disposition and original cohort linkage; no automatic damaged-board restoration/new Q."
    source_ids:
      - jrc-glass-bref-2013
      - jrc-ilcd-2010
  - rule_id: validate_evidence
    applies_to: "all rules"
    rule: "Require original method/source support and context, complete native qualifiers/exact chain and correct EN/ZH displays. Separate ordinary future measurements and auxiliary/provider gaps from true missing terminal/route/method holds. No unknown is a pass; no engineering check establishes scientific/translation/mapping approval."
    source_ids:
      - jrc-glass-bref-2013
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "Attributional factory-production methodology"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "One declared board/configuration/selected route and period with complete foreground records; combine internal Q and actual services once"
  excluded_use: "Installed thermal/fire/acoustic performance; other terminals/routes; EPD certification; invented recipe/default factors; automatic recovered-material credit"
  required_metadata: "Identity/route and all reference qualifiers; actual first-release Q and original Qc/H; native/unit/provider evidence; complete physical and burden ledgers; source context"
  required_quality_disclosure: "Full coverage, collected versus calculated amounts, original/reused evidence, uncertainty, unresolved identities and actual omitted/unmeasured scope; no invented quantities"
  update_trigger: "Changed supply/formulation/route/terminal; provider/state/unit mismatch; material source/evidence change; real postwork or inventory gap"
data_sources:
  - id: "un-cpc-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division. CPC Version3.0 Structure and Explanatory Notes,30June2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "37990 and adjacent37920/37950 scope only; not a canonical product recipe or accepted mapping"
  - id: "jrc-glass-bref-2013"
    type: "official_guidance"
    reference: "European Commission JRC. Best Available Techniques Reference Document for the Manufacture of Glass.2013. EUR25786 EN, doi:10.2791/69502. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/GLS_Adopted_03_2012_0.pdf"
    used_for: "§2.9/Table2.9/Figures2.12–2.13 and§3.8/Table3.35/3.42–3.47: complete qualitative stone-wool route, feed/binder/utility/controls/waste and adjacent counterexamples; no numerical factors or LCA allocation"
  - id: "rockwool-medium-epd-2024"
    type: "dataset"
    reference: "DEUTSCHE ROCKWOOL. ROCKWOOL stone wool insulation (medium bulk density range). EPD-DRW-20240317-IBC4-EN,issued30August2024; manufacturer-hosted complete PDF. https://www.rockwool.com/syssiteassets/rw-d/nachhaltigkeit-und-gebaudezertifizierungen/umwelt-produktdeklarationen-epd/wu-epd-medium-density-rockwool.pdf"
    used_for: "§§1–2.7 and3.1–3.9: real whole unfaced resin-bonded boards, aqueous binder/oil, mineral feed, finishing/quality and adjacent facings;2022 German multi-site case. No generic density/performance/recipe/energy, burden-free input, infrastructure cutoff, allocation choice or moduleD credit adopted"
  - id: "jrc-ilcd-2010"
    type: "handbook"
    reference: "European Commission JRC. ILCD Handbook: General guide for Life Cycle Assessment—Detailed guidance. First edition March2010,§§7.9.2–7.9.3,printed255–272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Limited attributional hierarchy: dedicated/virtual subdivision; exchange-specific determining physical causality; genuinely residual common-process gate/current-state market values; service and sum-conservation. No full ILCD/PEF claim or automatic recycling/waste exemption"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:02ecfe154680029947ff0397fe28ae8f6669303cacb48b036d02fced0271f4d9"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_9189"
      family: "system_boundary"
      span:
        start:
          offset: 9189
          line: 63
          column: 1
        end:
          offset: 22819
          line: 90
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual whole mineral/preparation supply receipt |\n| starting_condition_role | foreground_collection_start |\n| product_classification_scope | Asbestos-free unfaced cupola short-fibre phenolic-bonded stone-wool whole board |\n| recursive_input_rule | Same-category purchased wool/recycled feed retains actual state, inherited burden and preparation/transport once; paired internal loops cancel without free recursion or repurchase |\n| upstream_dataset_requirement | Real mining/preparation, formulation/recycling and supply transport; one owner for each whole article/water/energy |\n| disclosure | actual site and reporting cohort; asbestos-free mineral lithology and phases; each whole raw supply and Product/Waste status; feed grades and actual recycled preparation; cupola coke and hot-blast route; actual air and water circuits; whole binder purchase versus onsite mixing; retained binder oil and adhesion-agent composition; no facing or coating; board geometry and net mass/moisture configuration; manufacturer specification and actual release tests; unique first quality-release event and measured Q; opening/closing raw WIP and non-WIP vectors; gross FG physical and historical-burden ledger; post-release original Qc and observed H; actual upstream provider and water/energy ownership; species phase carbon source and receiving medium; packaging six external legs and stock states; permitted postwork tests acceptance and disposition; allocation hierarchy and residual uncertainty |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_start | manufacture | Start at actual whole mineral/preparation receipt with complete actual upstream mining/preparation/chemical production/transport and one provider owner. All real preparation, cupola, hot blast, spinning, aqueous binder, forming, gas cure, cooling, cutting, required inspection, controls and cleanup through first release remain inside; never repack purchased finished boards. | jrc-glass-bref-2013; rockwool-medium-epd-2024 |\n| boundary_terminal | finished_board | Applies to whole uninstalled, unfaced and uncoated asbestos-free stone-wool thermal-insulation boards made from actual natural basalt-based mineral feed and compatible actual secondary mineral material, through coke-fired hot-blast cupola melting, short-fibre formation on rotating wheels, aqueous phenolic binder application, mat formation, gas-fired drying/curing, cooling, actual cutting/edge trimming and final quality inspection to unique first release. Actual retained cured binder, dust-suppression oil, adhesion additives and residual water belong to the whole board. Real crushing, grading, purchased or actual onsite recycling briquetting, cooling/cleaning/controls, failed production and conditioning are included when performed. This is manufacturing from real feed, never purchased-finished-board repacking. The complete JRC industrial document establishes the cupola/short-fibre/cure route and alternatives; the complete manufacturer EPD establishes real resin-bonded whole-board terminal and aqueous binder/oil application. Together they form a transparent technical synthesis, not a claim that one SKU, factory or contemporary order demonstrates every generic operation. The EPD covers several shapes and2022 weighted German-site data; this method selects bare boards and a declared cupola route without claiming the German boards used that furnace. Neither source supplies this dataset's recipe or quantities. JRC Table2.9 is final oxide context, not a purchase recipe; glass-wool water circuits and gas/electric melting alternatives are counterexamples. Historical emission tables omit startup/shutdown and contain mixed denominators or equivalent indicators; do not transfer their numerical yields, energy, factors or species into first-release Q.  Exclude continuous basalt reinforcement fibre; E-glass roving/fabric/mat; glass wool; high-purity ceramic/AES refractory wool; foam glass; moler brick; raw basalt/mineral powder; worked mica/graphite/peat products; binder-free or inorganic-binder boards; electric-arc/flame-melter variants; oxygen-enriched melting; faced/coated/laminated panels; compressed coated facade panels; loose/blowing wool; rolls/pipe sections; installed exterior wall or other building systems; onsite resin synthesis without separate full chemical-process coverage. Another actual route/product requires renewed complete applicability; never omit actual inputs to make a route fit. UN37990 is broader than this one product/method. Scientific approval, accepted mapping and publication are separate from authoring.  This declared unit measures manufacturing supply only. It sets no operating recipe, furnace/cure temperature/time, speed, fibre dimension, test threshold, conductivity/fire/acoustic/strength rating, density, yield, energy, service life or certification default. The EPD's volume/nominal-density convention, infrastructure exclusion, waste assumptions and module-D benefit are not adopted; use measured same-configuration geometry/mass and the limited attributional hierarchy below. | un-cpc-2025; jrc-glass-bref-2013; rockwool-medium-epd-2024; jrc-ilcd-2010 |\n| boundary_preparation | all exchanges | Each whole purchased formulation/article is procured once, including supplied water and embedded materials. Assay/active/solid/water ledgers are children, not purchases. Actual onsite preparation uses every actual independently bought ingredient, energy, water, losses and emissions instead. Verify Product/Waste state and upstream burden for slag/recycled feed independently; no free input or automatic credit. Split any additional real preparation/additive/fuel/packaging/waste/species into its own card before dataset completion; unknown is not absent. | jrc-glass-bref-2013; rockwool-medium-epd-2024 |\n| boundary_first_release | manufacture | First-release Q includes every newly accepted whole board once and excludes packaging/pore air. Keep startup/shutdown, failed/zero-output periods, idle, cleanup, samples, rejects, rework and all treatment burdens. Opening raw/WIP and unassigned non-WIP stores each have quantity and every inherited exchange vector. Deduct only closing raw/WIP or genuinely unused/unassigned charge/service once. Released closing FG is already in Q and cannot be a manufacturing Bclose or another Q output. | jrc-glass-bref-2013; jrc-ilcd-2010 |\n| boundary_service | postrelease | Keep actual incremental packing/storage/handling/dispatch/returns/postwork services over observed H for original cohort Qc, including held closing FG. Already performed service remains attributed even while FG is held; only truly unused/unassigned service/charge carries. Retain historical FG manufacture for traceability without charging again. Consolidation cancels the internal first-release transfer once. Reinspection/redelivery is not new production. Net-delivery normalization is outside this method and would require full opening/closing FG burden, gross outward G/return R, original-delivery reversal D_rev and real added water/loss/rework; do not assume returned gross mass equals original delivery. | jrc-ilcd-2010 |\n| boundary_mass | all physical gates | Manufacturing, FG-service and combined gates use consistent gross physical legs: full wet opening + real external inflow + separately evidenced transformation/phase terms = full wet closing + actual gross outflow. Q is the manufacturing output and cancels internally in the combined gate; gross dispatch/returns/FG stocks remain. Physical mass, relevant Si/Al/Ca/Mg/Fe/C/H/N/O/S/Cl/F balances and actual species evidence are distinct. Separate minerals/coke/fuel/binder/ambient carbon, free/structural/cure/combustion water and pore gases. Oxide assay, LOI, COD/VOC/NOx/PM/total carbon/total boron/fibre count do not establish species or reactions. Never solve two unknowns from one residual or shrink physical mass with an economic allocation share. | jrc-glass-bref-2013; rockwool-medium-epd-2024; jrc-ilcd-2010 |\n| boundary_water | all water and thermal carriers | Keep actual independent cooling jacket, loop makeup, wash/scrubber filtration/reuse, purge, evaporation, mist, carryout, full wet WIP/FG/sludge and effluent. Internal recirculation cancels, not another water purchase. Whole external effluent transfer does not also emit its contents locally. If real steam/heat or warm-water return exists, retain heat MJ plus full carrier kg, actual state/enthalpy and one supplier water/energy boundary; condensate/external heat-exchanger return is actual Product return. No steam, boiler, fixed makeup fraction or water-density shortcut is presumed. | jrc-glass-bref-2013; rockwool-medium-epd-2024; jrc-ilcd-2010 |\n| boundary_packaging | all packaging | Each material/article maintains opening empty + attached WIP/FG + reusable stock and six external legs: P separately bought; I first non-purchased external ingress; ER external returns received; S with gross physical shipments; EO external outward returns; W waste. Opening+P+I+ER+F_in=closing+S+EO+W+F_out. Retain full wet closing empty/attached/reusable stock and real new influx even if new material/water remains in that stock. P/I whole article and packaging/repair-water X_in/X_out deduplicate only against other incoming/outgoing terms, never against stocks. Internal reuse cancels, is not repurchase/Q/coproduction credit; one upstream burden owner is independent of gross mass. Factory-wide ingress records precede H where real and bridge into service opening, never a fabricated second receipt. F_in/F_out map the independently measured added_new_material_water/removed_old_material_water records to this article pool, excluding contents already included in the corresponding whole-article leg. Preserve actual origin/period and component/whole bridges; internal donor/receiver repair or pool transfers cancel once at consolidation, not as new purchases/providers. X_in/X_out deduct only documented overlap with another already-counted SAME-SIDE gross inlet/outlet, never closing stock. New material/water retained in closing stays an input; unknown changes/overlap remain unresolved, not fitted to the residual. | jrc-glass-bref-2013; jrc-ilcd-2010 |\n| boundary_assets | all assets and repair | Full physical furnace/machine/tool/refractory/part/oil stocks, purchase, installation, replacement, repairs, returns and discard are separate from period service burdens and upstream providers. Preserve new and removed old material, retained adhering matter and every water phase. X_in/X_out remove duplication only with other flow terms, not real inflow retained in full wet closing stock. Do not deduct stock-corrected consumption a second time. No fixed asset life, whole machine per kg or extra provider for an already owned replacement. | jrc-glass-bref-2013; jrc-ilcd-2010 |\n| boundary_postwork | postrelease | Actual work after release requires manufacturer/specification permission for that board/material/configuration, real named new/old materials and water, custody, postwork tests, acceptance and final disposition. Do not assume damaged/broken boards regain acceptability. Failed work, replacement and treatment remain in the original/new cohort with no artificial Q; installation/in-use repairs are excluded. | rockwool-medium-epd-2024; jrc-ilcd-2010 |\n| packaging_receipt_basis | packaging | For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. F_in/F_out remain separate independently measured actual material/water changes, not a substitute for whole-article receipt. Packaging X_in/X_out mean only documented overlap deductions against another already-counted SAME-SIDE gross inlet/outlet, never stock or actual F. Retain legacy actual-change X raw records under their own names and provenance; bridge each actual cross-pool event once to F_in/F_out without adding an alias again or treating it as a deduction. Non-packaging asset/FG/water X records keep their declared gate scope. Current overlap deductions are separately evidenced by exact OTHER terms; proven absence of a duplicate gives X deduction zero, while unknown overlap remains unresolved. New retained material/water remains input and full closing wet mass. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names. | jrc-ilcd-2010 |\n\n"
