system_boundary:
  rules:
    - rule_id: boundary_start
      applies_to: "manufacture"
      rule: "Start at actual whole mineral/preparation receipt with complete actual upstream mining/preparation/chemical production/transport and one provider owner. All real preparation, cupola, hot blast, spinning, aqueous binder, forming, gas cure, cooling, cutting, required inspection, controls and cleanup through first release remain inside; never repack purchased finished boards."
      source_ids:
        - jrc-glass-bref-2013
        - rockwool-medium-epd-2024
    - rule_id: boundary_terminal
      applies_to: "finished_board"
      rule: "Applies to whole uninstalled, unfaced and uncoated asbestos-free stone-wool thermal-insulation boards made from actual natural basalt-based mineral feed and compatible actual secondary mineral material, through coke-fired hot-blast cupola melting, short-fibre formation on rotating wheels, aqueous phenolic binder application, mat formation, gas-fired drying/curing, cooling, actual cutting/edge trimming and final quality inspection to unique first release. Actual retained cured binder, dust-suppression oil, adhesion additives and residual water belong to the whole board. Real crushing, grading, purchased or actual onsite recycling briquetting, cooling/cleaning/controls, failed production and conditioning are included when performed. This is manufacturing from real feed, never purchased-finished-board repacking. The complete JRC industrial document establishes the cupola/short-fibre/cure route and alternatives; the complete manufacturer EPD establishes real resin-bonded whole-board terminal and aqueous binder/oil application. Together they form a transparent technical synthesis, not a claim that one SKU, factory or contemporary order demonstrates every generic operation. The EPD covers several shapes and2022 weighted German-site data; this method selects bare boards and a declared cupola route without claiming the German boards used that furnace. Neither source supplies this dataset's recipe or quantities. JRC Table2.9 is final oxide context, not a purchase recipe; glass-wool water circuits and gas/electric melting alternatives are counterexamples. Historical emission tables omit startup/shutdown and contain mixed denominators or equivalent indicators; do not transfer their numerical yields, energy, factors or species into first-release Q.  Exclude continuous basalt reinforcement fibre; E-glass roving/fabric/mat; glass wool; high-purity ceramic/AES refractory wool; foam glass; moler brick; raw basalt/mineral powder; worked mica/graphite/peat products; binder-free or inorganic-binder boards; electric-arc/flame-melter variants; oxygen-enriched melting; faced/coated/laminated panels; compressed coated facade panels; loose/blowing wool; rolls/pipe sections; installed exterior wall or other building systems; onsite resin synthesis without separate full chemical-process coverage. Another actual route/product requires renewed complete applicability; never omit actual inputs to make a route fit. UN37990 is broader than this one product/method. Scientific approval, accepted mapping and publication are separate from authoring.  This declared unit measures manufacturing supply only. It sets no operating recipe, furnace/cure temperature/time, speed, fibre dimension, test threshold, conductivity/fire/acoustic/strength rating, density, yield, energy, service life or certification default. The EPD's volume/nominal-density convention, infrastructure exclusion, waste assumptions and module-D benefit are not adopted; use measured same-configuration geometry/mass and the limited attributional hierarchy below."
      source_ids:
        - un-cpc-2025
        - jrc-glass-bref-2013
        - rockwool-medium-epd-2024
        - jrc-ilcd-2010
    - rule_id: boundary_preparation
      applies_to: "all exchanges"
      rule: "Each whole purchased formulation/article is procured once, including supplied water and embedded materials. Assay/active/solid/water ledgers are children, not purchases. Actual onsite preparation uses every actual independently bought ingredient, energy, water, losses and emissions instead. Verify Product/Waste state and upstream burden for slag/recycled feed independently; no free input or automatic credit. Split any additional real preparation/additive/fuel/packaging/waste/species into its own card before dataset completion; unknown is not absent."
      source_ids:
        - jrc-glass-bref-2013
        - rockwool-medium-epd-2024
    - rule_id: boundary_first_release
      applies_to: "manufacture"
      rule: "First-release Q includes every newly accepted whole board once and excludes packaging/pore air. Keep startup/shutdown, failed/zero-output periods, idle, cleanup, samples, rejects, rework and all treatment burdens. Opening raw/WIP and unassigned non-WIP stores each have quantity and every inherited exchange vector. Deduct only closing raw/WIP or genuinely unused/unassigned charge/service once. Released closing FG is already in Q and cannot be a manufacturing Bclose or another Q output."
      source_ids:
        - jrc-glass-bref-2013
        - jrc-ilcd-2010
    - rule_id: boundary_service
      applies_to: "postrelease"
      rule: "Keep actual incremental packing/storage/handling/dispatch/returns/postwork services over observed H for original cohort Qc, including held closing FG. Already performed service remains attributed even while FG is held; only truly unused/unassigned service/charge carries. Retain historical FG manufacture for traceability without charging again. Consolidation cancels the internal first-release transfer once. Reinspection/redelivery is not new production. Net-delivery normalization is outside this method and would require full opening/closing FG burden, gross outward G/return R, original-delivery reversal D_rev and real added water/loss/rework; do not assume returned gross mass equals original delivery."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: boundary_mass
      applies_to: "all physical gates"
      rule: "Manufacturing, FG-service and combined gates use consistent gross physical legs: full wet opening + real external inflow + separately evidenced transformation/phase terms = full wet closing + actual gross outflow. Q is the manufacturing output and cancels internally in the combined gate; gross dispatch/returns/FG stocks remain. Physical mass, relevant Si/Al/Ca/Mg/Fe/C/H/N/O/S/Cl/F balances and actual species evidence are distinct. Separate minerals/coke/fuel/binder/ambient carbon, free/structural/cure/combustion water and pore gases. Oxide assay, LOI, COD/VOC/NOx/PM/total carbon/total boron/fibre count do not establish species or reactions. Never solve two unknowns from one residual or shrink physical mass with an economic allocation share."
      source_ids:
        - jrc-glass-bref-2013
        - rockwool-medium-epd-2024
        - jrc-ilcd-2010
    - rule_id: boundary_water
      applies_to: "all water and thermal carriers"
      rule: "Keep actual independent cooling jacket, loop makeup, wash/scrubber filtration/reuse, purge, evaporation, mist, carryout, full wet WIP/FG/sludge and effluent. Internal recirculation cancels, not another water purchase. Whole external effluent transfer does not also emit its contents locally. If real steam/heat or warm-water return exists, retain heat MJ plus full carrier kg, actual state/enthalpy and one supplier water/energy boundary; condensate/external heat-exchanger return is actual Product return. No steam, boiler, fixed makeup fraction or water-density shortcut is presumed."
      source_ids:
        - jrc-glass-bref-2013
        - rockwool-medium-epd-2024
        - jrc-ilcd-2010
    - rule_id: boundary_packaging
      applies_to: "all packaging"
      rule: "Each material/article maintains opening empty + attached WIP/FG + reusable stock and six external legs: P separately bought; I first non-purchased external ingress; ER external returns received; S with gross physical shipments; EO external outward returns; W waste. Opening+P+I+ER+F_in=closing+S+EO+W+F_out. Retain full wet closing empty/attached/reusable stock and real new influx even if new material/water remains in that stock. P/I whole article and packaging/repair-water X_in/X_out deduplicate only against other incoming/outgoing terms, never against stocks. Internal reuse cancels, is not repurchase/Q/coproduction credit; one upstream burden owner is independent of gross mass. Factory-wide ingress records precede H where real and bridge into service opening, never a fabricated second receipt. F_in/F_out map the independently measured added_new_material_water/removed_old_material_water records to this article pool, excluding contents already included in the corresponding whole-article leg. Preserve actual origin/period and component/whole bridges; internal donor/receiver repair or pool transfers cancel once at consolidation, not as new purchases/providers. X_in/X_out deduct only documented overlap with another already-counted SAME-SIDE gross inlet/outlet, never closing stock. New material/water retained in closing stays an input; unknown changes/overlap remain unresolved, not fitted to the residual."
      source_ids:
        - jrc-glass-bref-2013
        - jrc-ilcd-2010
    - rule_id: boundary_assets
      applies_to: "all assets and repair"
      rule: "Full physical furnace/machine/tool/refractory/part/oil stocks, purchase, installation, replacement, repairs, returns and discard are separate from period service burdens and upstream providers. Preserve new and removed old material, retained adhering matter and every water phase. X_in/X_out remove duplication only with other flow terms, not real inflow retained in full wet closing stock. Do not deduct stock-corrected consumption a second time. No fixed asset life, whole machine per kg or extra provider for an already owned replacement."
      source_ids:
        - jrc-glass-bref-2013
        - jrc-ilcd-2010
    - rule_id: boundary_postwork
      applies_to: "postrelease"
      rule: "Actual work after release requires manufacturer/specification permission for that board/material/configuration, real named new/old materials and water, custody, postwork tests, acceptance and final disposition. Do not assume damaged/broken boards regain acceptability. Failed work, replacement and treatment remain in the original/new cohort with no artificial Q; installation/in-use repairs are excluded."
      source_ids:
        - rockwool-medium-epd-2024
        - jrc-ilcd-2010
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. F_in/F_out remain separate independently measured actual material/water changes, not a substitute for whole-article receipt. Packaging X_in/X_out mean only documented overlap deductions against another already-counted SAME-SIDE gross inlet/outlet, never stock or actual F. Retain legacy actual-change X raw records under their own names and provenance; bridge each actual cross-pool event once to F_in/F_out without adding an alias again or treating it as a deduction. Non-packaging asset/FG/water X records keep their declared gate scope. Current overlap deductions are separately evidenced by exact OTHER terms; proven absence of a duplicate gives X deduction zero, while unknown overlap remains unresolved. New retained material/water remains input and full closing wet mass. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - jrc-ilcd-2010
