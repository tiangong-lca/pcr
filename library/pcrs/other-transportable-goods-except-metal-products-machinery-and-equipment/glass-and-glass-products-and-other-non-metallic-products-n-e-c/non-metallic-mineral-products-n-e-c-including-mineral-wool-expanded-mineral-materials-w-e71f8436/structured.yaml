      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| validate_scope | dataset | Verify the full selected route and whole board including retained binder/oil; wrong family/furnace/facing/chemical/particle/medium/type is not rescued by a classification tag or generic UUID. | jrc-glass-bref-2013; jrc-ilcd-2010 |\n| validate_reference | finished_board | Require unique first-release Product output, net measured whole Q and complete qualifiers. Core reference lacking valid public native identity and positive whole-terminal evidence is a true hold; a formally passing check cannot waive it. | jrc-glass-bref-2013; jrc-ilcd-2010 |\n| validate_attribution | all rows | Check each raw event/unit, physical and burden partition, stock vectors, ordinary losses/treatment, Q0 retention and exactly one calc_normalize. Closing released FG cannot remove manufacturing burden; held FG cannot remove performed service. | jrc-glass-bref-2013; jrc-ilcd-2010 |\n| validate_gross | physical ledgers | Check all gross gates, independent element/species/water evidence, packaging six legs, supplier-included ingress, new/old repairs, actual carrier returns and no closing-stock cancellation of influx or economic shrinking of mass. | jrc-glass-bref-2013; jrc-ilcd-2010 |\n| validate_postwork | postrelease | Require actual manufacturer/spec permission, named additional materials/water, postwork tests/acceptance/disposition and original cohort linkage; no automatic damaged-board restoration/new Q. | jrc-glass-bref-2013; jrc-ilcd-2010 |\n| validate_evidence | all rules | Require original method/source support and context, complete native qualifiers/exact chain and correct EN/ZH displays. Separate ordinary future measurements and auxiliary/provider gaps from true missing terminal/route/method holds. No unknown is a pass; no engineering check establishes scientific/translation/mapping approval. | jrc-glass-bref-2013; jrc-ilcd-2010 |\n\n"
