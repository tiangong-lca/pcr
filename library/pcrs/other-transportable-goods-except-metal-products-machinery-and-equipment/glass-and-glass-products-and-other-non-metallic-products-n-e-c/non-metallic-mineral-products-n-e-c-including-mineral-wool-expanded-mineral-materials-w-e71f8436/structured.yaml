      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_scope | manufacture; postrelease | Use this hierarchy only for attributional situations in which allocation is appropriate after documented goal/framework choice. First separate dedicated operations and trace exclusively attributable exchanges; use real or virtual subdivision wherever demonstrable. Do not import an industrial EPD allocation result or freely choose physical/economic allocation. | jrc-ilcd-2010 |\n| allocation_physical | all shared exchanges | For remaining exchange i identify the determining physical causal relationship to each function/cohort; demonstrate how changing its quantity changes that exchange. Distinguish embodied feed from process-related conversion and time/capacity service. Justify each criterion separately; mass, count, area, heat or time alone is not automatically causal. Preserve full gross physical streams and conservation of every allocated inventory component. | jrc-ilcd-2010 |\n| allocation_residual | remaining common process | Only the genuinely unresolved common process portion may use actual contemporaneous market value at the same process gate, real state/quality and quantity. Derive a comparable gate value from later prices by removing actual extra conditioning/packing/transport; disclose uncertainty and sensitivity. No fixed fractions, arbitrary mass/economic choice or hypothetical credit. If any required quantity or gate value is missing, nonfinite or nonpositive, or values offset so that a share is undefined, retain every real function and all gross physical and burden records; document a justified case-specific method that conserves every allocated component, or hold the dependent result pending resolution. Do not take absolute values, shift values, assign equal or zero shares, invent a credit, or remove a real function merely to obtain a computable allocation. | jrc-ilcd-2010 |\n| allocation_waste | slag; tap_iron; all residues | Do not remove normal manufacturing failure/offcut/sample/waste or treatment burdens merely because material leaves or is sold. A single vector transfer T_other requires a real separate function/cohort and a justified allocation/handover with one upstream/downstream owner. Recycling/end-of-waste/product status is independently established; do not adopt burden-free secondary inputs, avoidance credits, infinite loops or the EPD moduleD convention by default. Dedicated conditioning/treatment and gross material legs remain. | jrc-ilcd-2010 |\n\n"
