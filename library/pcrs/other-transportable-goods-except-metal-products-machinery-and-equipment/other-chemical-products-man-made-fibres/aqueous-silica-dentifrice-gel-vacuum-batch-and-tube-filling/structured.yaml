      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual purchased ready-grade whole ingredients, utility/packaging/part inputs and complete own opening stocks/history |\n| starting_condition_role | foreground_input_gate |\n| product_classification_scope | Narrower35323 oral silica gel, explicit historical-continuity inference and native35334 countermetadata |\n| recursive_input_rule | Purchased ready gel retains whole upstream provider burden; internal gel loops are paired transfers, not new manufacture/Q |\n| upstream_dataset_requirement | Real compatible individual preparation, AC/air/cooling, tube/part and receiver-treatment providers with actual unit/state/geography/history |\n| disclosure | Every actual operation, recipe, control, supplier, stock/fate, matrix procedure and unresolved result; original cohort and first gate fixed |\n\nAdmit only a real whole aqueous hydrated-silica dentifrice gel for personal toothbrushing, made by batch liquid preparation, gum hydration and abrasive dispersion, vacuum mixing/deaeration, slow final surfactant addition, then filling and sealing retail-kind plastic/laminate tubes. The actual formulation, grade and acceptance specification must positively identify a ready-to-use oral gel; this is a manufacturing family, not an invented fixed recipe or a named factory LCI. The Silverson complete Issue14TA4 guide identifies this gel route and ingredient functions; the independent ROSS report corroborates dispersion, hydration, vacuum and gentle final mixing. Neither provides a site inventory. Exclude white calcium-carbonate abrasive pastes, powder dentifrices, denture fixatives, mouthwash, medicaments, whitening peroxide/reactive acid-base systems, solid tablets, soap, household scouring cream, perfumes and room deodorants. Intentional antimicrobial/therapeutic actives other than separately disclosed sodium fluoride need reviewed scope extension, never a clinical-benefit default.\n\nThe whole native Toothpaste Product positively defines an oral paste/gel dentifrice used with a toothbrush. Its complete name, synonyms and comments support the actual gel subtype; no CAS, formula, SKU, geography, manufacturing route or consumer-only receiving restriction is imposed. Its35334 scouring classification is explicit contrary metadata, not silently corrected native data. Current CPC3 retains35323 Perfume and toilet preparations separately from35331 room preparations,35334 scouring preparations and35410 odoriferous industrial raw materials. The official CPC2.1 note at printed289/PDF303 defines35323 through HS3303–3306 and35334 through3405.40; current HS2022 Chapter33 note3 and3306.10 expressly cover retail-kind dentifrices. Current CPC3 introduction paragraphs26,50–51,55–56 and93/current Family principles support a labelled historical-continuity interpretation. It is an explicit historical-continuity inference accepted as a narrower library association by the primary controller, not an official current product ruling or native classification amendment. Preserve this counterevidence and reopen on authoritative scope change. Native oral-health language establishes neither efficacy, safety, dose, avoided treatment nor functional equivalence.\n\nReceive and weigh actual separately purchased commercial preparations. Water, aqueous sorbitol, glycerol, hydrated silica, sodium carboxymethylcellulose, sodium lauryl sulfate, sodium saccharinate, sodium benzoate and a mint flavour preparation are individual cards; a card is active only when the real recipe uses exactly that material. Sodium fluoride is conditional on actual formulation and assay. These are documented route ingredients, not a required combined recipe, percentages, purity or dosage. Different gums, preservatives, fluoride salts, colours, abrasives or flavours require separate exact cards and provider/chemistry review before claiming a complete dataset; do not map them onto the listed chemical. For each supplied solution/slurry/blend record its whole as-supplied mass and supplier composition, water/carriers, impurities and actual state. Component fractions are nested evidence, never additional purchases of the same material; sodium fluoride, fluoride ion and total fluorine are different quantities. The reference is the actual whole gel including water and traces, never silica, fluoride, dry solids or pure-water equivalent.\n\nRetain stage records within the manufacturing aggregate: receipts and raw storage; liquid-base preparation; controlled gum wetting/hydration; abrasive powder/slurry feeding and dispersion; actual optional ingredient additions; vacuum mixing/deaeration; slow final SLS/flavour incorporation in the actual qualified order; actual hold, inspection and transfer; tube orientation, metered filling, hot-air sealing/coding, cap and carton operations as installed; acceptance, quarantine/rework, storage, cleaning and all controls. Silverson permits gel high-shear processing but warns that high-viscosity abrasive white paste is unsuitable for some high-speed rotor/stator stages; its modified inline refining/positive-displacement pumping are options, not universal requirements. ROSS gives a different sample staging order, not a compulsory combined process. Select and document the actual compatible sequence, shear, vacuum and temperature, not both sample sequences simultaneously. No source process time, viscosity range, efficiency, capacity, yield or machine mass is a default.\n\nFix Q at one documented gate: unique first quality acceptance of filled, sealed retail-kind tubes, measured as net whole gel kg excluding tube/cap/carton tare. Lock event/unit IDs, actual net weights, product version and original cohort Q0. Bulk mix acceptance, tank discharge, gross fills, retests, returns, reopening/rework/reacceptance and dispatch of opening FG create no second event. Q is an event account, not an additional external physical output. Partition original Q0 into disjoint net remaining external deliveries, all actual onsite accepted states including quarantine, rework and gel recovered from accepted tubes, irreversible material/water loss, samples and other terminal dispositions on original acceptance basis. Internal loops and returns are transfers, not second fates. Record later external additions separately without restoring lost water into the survivor and counting the same loss again. Delivery plus new closing FG is valid only after proving all other postgate states and exits absent. Subsequent storage, repacking, rework, cleaning and asset services retain original Q0. Unknown/zero Q preserves raw totals and unresolved normalization.\n\nMaintain complete physical raw, solution, WIP, filled/unfilled gel, accepted/quarantined FG, return, residue, washwater, tube/cap/carton and installed-component stocks, receipts, deliveries and exports; pair internal transfers without erasing their work. Separately reconcile burden vectors for opening own raw/WIP/FG, inherited foreground work, new processing, actual providers, closing stocks and terminal fates. Own inherited work is carried once; neither new charge totals nor an upstream provider aggregate may duplicate it. A provider aggregate and its embedded decomposition are exclusive alternatives with explicit nonoverlap. Purchased ready gel is not newly manufactured here; label it as externally supplied gel, retain genuine upstream burdens and review scope if it replaces onsite manufacture. Old accepted FG and returns retain original product/cohort/history; using them creates neither free feed nor new Q.\n\nBefore allocation reconcile actual whole wet mass, water by phase, silica/polyol/surfactant/flavour/fluoride constituents and relevant elemental ledgers including C/H/O/Si/Na/S/F as present. Hydration, dissolution and vacuum deaeration do not justify a universal chemical-conversion or zero-loss assumption. Track actual ionic dissolution/speciation and any real generated/consumed species G/C independently; reactive neutralisation, peroxide chemistry or degradation requires reviewed chemistry and exact new species, not conservation of a reacting molecule. Distinguish bound/hydrate water, free water, actual evaporation, entrained droplets, condensate and humid-air transfers. Do not create reaction water, ambient uptake, a VOC remainder or heat to force closure. Whole gel droplets/particles contain water and ingredients; their constituents are nested, not duplicate whole-mist plus component emissions. A shared wastewater mixture is one actual receiver load; nested water, dissolved chemicals, suspended silica, COD and fluorine are not multiple exports of the same mass. COD is an analytical oxygen-equivalent parameter, never kilograms of an invented chemical species.\n\nAt the actual utility boundary meter AC drives, vacuum pump, powder handling, transfer, filler, hot-air heater, QA, cleaning, standby and rework. Preserve native electricity Net calorific value/MJ as its reference convention; kWh×3.6 is electrical unit conversion, not fuel heat or a default consumption. Link genuine compatible generation/delivery losses once. Hot-air tube sealing is an actual thermal interface even in a cold gel process: record actual heater electricity, compressed/ambient air mass or documented volume/state, inlet/outlet temperature, moisture, material enthalpy and cooling. Purchased cooling-water supply and return are separate physical transfers, not automatically fully consumed water; closed-loop recirculation cancels internally while makeup, blowdown, leakage and supplier burdens remain. Record real vacuum condensate and exhaust separately. External heat, steam, refrigerant, vacuum seal liquid or onsite combustion if actually installed needs exact additional atomic interfaces and reviewed complete upstream/chemistry, not an anonymous zero utility. No rated power, machine capacity, lifetime, COP or enthalpy residual supplies a quantity.\n\nCount actual empty laminate-tube assemblies, caps and cartons by construction and measured tare; record physical receipt, delivery, return, customer return, scrap and opening/closing empty/filled stocks separately from gel net kg. An already capped purchased tube assembly contains its cap once: activate the separate cap card only for an independently supplied cap. Laminate layers and attached print are nested BOM, not additional purchases or exports. One actual contaminated tube/cap assembly, cloth or component export includes its substrate plus retained paste, washwater and other contamination once; substrate/tare and constituents are nested ledgers. Only proven physical preboundary separation permits separate paste or liquid waste. Reconcile the whole receiver amount independently from substrate stock. Keep the full physical shared waste event, recipient and transfer even when environmental service is split among original cohorts: a10kg event with25% attributable service remains10kg physical and2.5kg service, not2.5kg physical or10kg charged to each cohort. Compatible provider service and disjoint attributed vectors use original Q0; no invented separate retained-paste waste or duplicated treatment.\n\nTrace each actual stainless-steel rotor/stator replacement and silicone scraper/seal by measured configuration, dimensions, count/mass, installation/removal, remaining physical fleet and original served cohorts; conditional cards admit only those exact actual materials. Other installed parts, lubricants, cleaning chemicals and instruments need their own exact cards when in scope. Carry physical installed stocks separately from compatible manufacture/repair/service demand and provider embedded histories. A new component remaining installed is not a current whole-mass waste. Whole contaminated removed-part and cleaning-cloth wastes include retained gel/liquid once. No machine weight, annual replacement, assumed service life, fractional physical removal or recovery credit is inferred. A complete actual external laboratory/maintenance provider may supply its bounded service and embedded materials once; do not also add its full disaggregated history.\n\nCollection methods must fit the actual matrix and outlet. Net output and stock use calibrated paired gross/tare weighing or traceable actual density at measured temperature; validate gel sample representativeness, air entrapment and tube fill variability. Recipe and carrier-water composition require genuine supplier specifications/CoAs and batch reconciliation, not catalogue percentages; any active assay requires its complete actual species/matrix-valid procedure. Vacuum exhaust may contain water vapour, entrained wet gel and individual volatile flavour compounds: dry-stack PM gravimetry or total VOC/COD cannot establish their speciation or whole mass. Preserve condensate, capture, bypass and fugitive coverage, sampling recovery/blanks, flow/time/state, uncertainty and actual compartment. Qualify an independently supported complete procedure before using a quantitative outlet result; an unknown essential procedure remains a real completeness barrier and cannot be waived by future SOP promises, an inferred loss remainder or a finite check. Separate unmeasured from absent and report detection limits. This candidate sets no emissions factor, clinical benefit, regulatory compliance or approved factory study.\n\nMethod admission is quantity- and interface-specific, distinct from ordinary study calibration. Full EPA Method18, Internet copy04/01/2025, supplies a conditional gaseous-organic GC framework only: retain Methods1/2/3 dependencies, the actual presurvey and identification, target-specific standards/column resolution, complete chosen bag/direct/dilution/adsorbent procedure, moisture/condensation controls, blanks and target-specific field recovery. It excludes polymeric, polymerising and very-low-vapour-pressure compounds; a generic flavour label or source example does not identify any actual released species. An impinger catch upstream of adsorbent must be analysed for the same targets and included in combined recovery. Full Method201A2017 sections1.5 and4 explicitly exclude water-droplet sizing, and its dry gravimetric residue cannot establish whole wet gel mass. Method5, the alternative mentioned by Method201A, defines gravimetric PM after removal of uncombined water and dries/desiccates recovered residue; this can support qualified nonvolatile PM, not original whole wet-gel or entrained-water mass. These methods alone do not supply original wet-gel/phase recovery; the concrete bulk-water and quantitative gas programmes below address different measurands. Whole collected condensate or captured mist transferred to a real receiver is measured once as its specific whole waste mixture with nested components; it is not a released elementary chemical or a second aerosol export. Residual environmental water, gel droplets and actual individual chemical species/medium require genuinely applicable complete procedures; do not assume complete capture or invent constituents. If actual final wet droplets require independent original-phase quantitative exports, the affected phase-preserving procedure remains on method hold pending independent review; no route-wide absence or acceptance is inferred. Actual-site instrument calibration and field recovery of an already applicable procedure are separate ordinary study obligations.\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_route | gel_manufacture | Include the complete source-qualified physical route and actual thermal/utility/packing interfaces above; actual additional ingredients, species and materials require exact cards before completeness. | silverson-toothpaste-14ta4; ross-toothpaste; norden-tube-filling |\n| boundary_native | accepted_gel | Apply complete whole oral-gel native hardfields, formulation admission and classification-inference limits above; an ingredient, scouring product or fragrance cannot stand in for this finished gel. | wco-hs33-2022; unsd-cpc21-continuity; unsd-cpc3-principles |\n| boundary_method_programmes | all inventory rows | Apply the complete section5 KF/gas programmes and statistical/matrix limits only to actual applicable measurands/interfaces; counterevidence is not wet-phase collection, and an unknown necessary branch retains its dependent limitation. | metrohm-k053; metrohm-kf-monograph; epa-ftir320-2019; epa-validation301-2017; epa-moisture4-2017 |\n\nFor an actually representative whole wet gel or separately collected gel/liquid receiver, AN-K-053 is a concrete direct-beaker volumetric Karl Fischer programme: weigh approximately30–50mg toothpaste into the titration beaker, add magnetic stirrer, tightly seal with Al-foil/holder and use the specified MATi10/814 workflow. Add20mL methanol/formamide7:3v/v. Discard the system-preparation blank; determine three empty-beaker/20mL-solvent blanks, store their mean and subtract it from BOTH titer and sample endpoint volumes. Use certified water-standard content and the actual measured titer of Composite5 in the same medium, not its nominal label. The published changed parameters are pause8s and extraction30s with the specified apparatus; do not invent unspecified defaults or claim these times release every matrix water fraction. The note expressly requires adaptation where necessary. Its55.82% water, n6/RSD0.27% and blank1.471mL are an actual demonstration/precision result, never gel composition, water recovery or a plant factor. The direct whole weighed aliquot is not a settled-supernatant sample. The monograph recommends high-water dilution to reduce small-weighing error, whereas this robotic note uses direct small samples. Select the actual representative precision/solvent branch without silently combining the two workflows or imposing a universal dilution factor.\n\nMonograph8.026.5013 §§6–8 and10.1.1/10.1.5 supply the complete titer, sampling and preparation context. Preserve a representative actual wet sample quickly in a closed vessel with no changed moisture during transport/storage; include separated water, wall deposits and heterogeneous gel in the sampling design. Homogenization or a weighed solubility promoter with its measured blank is an actual branch for pastes/viscous liquids. Direct in-cell analysis requires compatible solvent, water release and no relevant side reaction. External extraction may leave equilibrium-retained water; a free-water spike or repeat precision alone does not prove complete original/bound water release. The toothpaste alternative weighs approximately1g with40mL methanol in a dry septum flask, seals/shakes/stirs5min, settles, draws approximately5mL supernatant and injects approximately3mL into the conditioned cell with a matched blank and actual syringe back-weighing. These source conditions are a distinct extraction branch, not homogeneous whole-sample dilution or proof that residual solids contain no water. Oven heating is below decomposition/interfering distillates with actual optimized temperature/time and blank, never an assumed250C setting. A different actual receiver containing wash chemicals must fit its real matrix; the toothpaste method is not blanket qualification of every liquid or contaminated article.\n\nKF selectivity is conditional on actual chemistry. Monograph7.1–7.8 retains carbonate/hydroxide/some-oxide water generation (not all oxides), aldehyde/ketone acetal/ketal water generation and aldehyde bisulfite water consumption, strong-acid/pH effects, terminal silanol/siloxane reaction with methanol, boron compounds, peroxides, iodine-consuming reducing and iodine-generating oxidizing substances. The concrete special/methanol-free/higher-alcohol/temperature or preparation branches are selected only when actual constituents and compatibility support them; no new universal substitute recipe is invented. The terminal R3SiOH example is not proof that every hydrated-silica dentifrice necessarily has the same significant interference. The monograph distinguishes organic-peroxide reactions from its hydroperoxide example where iodine and water effects compensate; do not declare every peroxide an interference. Keep excluded carbonate/peroxide/reactive product contexts separate from this silica oral-gel scope. Actual composition, release/endpoint behavior, calibrated titer, blanks/drift, recovery and uncertainty under a real applicable programme are study qualification; their unperformed status alone is not absence of a method. If a genuinely necessary actual preparation/selection branch has no complete applicable programme, retain that specific dependent hold, not a future-SOP waiver.\n\nPreserve and do not blindly copy monograph10.1.1 printed %water=(EP1-C30)*C01*C02*C03/C00: EP1 is mL, C30 is labelled mgH2O/2g, C01 is mgH2O/mL, C00 is g, C02 is100 and C03 is25 for2g sample plus50g solvent; the source footnote acknowledges approximation. Subtracting mg from mL is undefined without an identical actual aliquot/endpoint-equivalent blank basis. Independently use T[mg/mL]=m_std[g]*w_cert[mg/g]/(V_std-B_std)[mL]; W_sample[mg]=T*(V_sample-B_sample)-D_once[mg]; water_percent=0.1*W_sample[mg]/m_sample[g]. D_once is only independently measured drift not already corrected in the blank/instrument; do not subtract it twice. If both numerator and denominator are mg, percent uses100 instead. A genuinely homogeneous complete dilution has original sample fraction f=m0/(m0+M_solvent) and sample mass in aliquot f*m_aliquot; subtract actual solvent water represented by that aliquot. Thus2g+50g gives52g and factor26, not25, under those specific assumptions. With settling, W_original=W_actual_liquid+W_retained_residue-W_added_solvent_or_handling; W_actual_liquid=(W_aliquot/m_aliquot)*M_actual_liquid. Do not replace actual liquid mass by total preparation mass or assume retained water zero. These dimensional bridges are transparent technical synthesis, not source errata, a factory measurement or a recipe.\n\nThe vessel vacuum port is an internal producer interface unless the actual installation proves it is the final external outlet. Retain actual vessel transfers, lines, actual collection/cooling/receiver/pump/seal-liquid interfaces, returns, stocks, cleaning, bypasses, fugitive paths, utilities and complete own/provider history. Neither Silverson nor ROSS specifies a complete capture/pump-final-discharge topology; do not invent one, assume complete capture or delete an outlet. Dry-ice traps documented for other abrasive cream-toothpaste patent examples are a technical precedent only, not evidence a trap is installed for this gel. If a genuine complete producer includes actual capture/condensation, its whole wet receiver is measured once with nested constituents, and the actual final environmental outlet is measured separately. Do not report the same internal mixed stream again as an environmental release. Internal instantaneous phase partition is not automatically a separate LCA emission requirement. Actual complete provider linkage or real own-process expansion is exclusive; no paper outsourcing hides vacuum production or treatment.\n\nFor an actual final IR-active vapour claim, use complete EPA Method320 plus FTIRProtocol, not a qualitative title: identify actual water and each real volatile flavour molecule, select its reference spectrum/interferences, preserve material-compatible heated probe/filter/line/cell and actual dewpoint/pressure/temperature/pathlength/flow/time basis, leak checks and all real outlet coverage. Quantitative water under §8.5.2 requires Protocol4.6 quantitative standards, two-or-more concentrations in duplicate and CTS before/after, traceability/stability and the required secondary verification for only two self-prepared concentrations; a water interference spectrum alone is not quantitative. Initial §13/Method301 validation uses the real dynamic12spiked/12unspiked series, distinct from routine §8.6.2 QA spikes and bias correction. Retain sampling/matrix loss and condensate recovery, raw spectra and uncertainty; integrate compatible concentration and actual flow/state/time once. In the source printed tracer notation use physical k=(tracer_spk-tracer_native)/(tracer_std-tracer_native) and Cexpected=k*Cstd+(1-k)*Cnative on the same basis; the inconsistent DF>=10 is not a physical fraction or an invented tracer dose. Method4 saturated/water-droplet positive bias and the Method18/201A/5 limitations remain real countercontext. Heated FTIR can vaporize incoming droplet water; it cannot recover original vapour versus wet-gel phases or quantify whole aerosol/gel from cell water. Total condensate is not assumed pure water. If an actual final environmental outlet contains wet droplets and separate original-phase exports are necessary, phase-preserving representative collection and complete recovery remain a concrete affected-study method hold. Bulk KF and quantitative gas programmes do not close that specific conditional gap; conditional cards neither prove a universal release nor prove it absent.\n\nComplete actual vacuum mixing, separate vacuum pump where not included, tube filling/hot-air sealing, balances and the actual KF analytical system have physical configured-fleet and separate service histories. Include each whole supplied configuration once; its original contained rotor/seal/instrument is nested, while a real subsequent independent replacement is a new component input. Record actual acquisition/provider reference unit, measured configuration bridge, active/spare/repair/loan stocks, returns/retirement, maintenance and actual use across all original Q0 cohorts. Actual cloths and sampling/analytical tools retain wash/reuse/retirement and contamination histories. Real QA laboratory work is part of the complete own or genuine provider boundary, with actual methanol, formamide, whole supplied KF titrant, certified standard and spent liquor interfaces if performed; no paper laboratory outsourcing or nominal analytical consumption is imposed. Additional actual reagents, supplied containers, parts or secondary-method interfaces require exact separate cards. A whole linked complete producer and its expanded inputs/history are exclusive. No assumed equipment weight/life/use count, recipe or missing provider-unit conversion is supplied.\n\nFor each actual article and each manufacture, later-service and combined gate, use the whole-wet equation O + P + I + ER + J_in + H2O_in = C + Sgross + EO + Wwhole + J_out + H2O_out. O/C contain all actual empty, attached raw/WIP/non-WIP/FG and reusable stocks. P is independent new external procurement; I is actual packing received contained in a whole supply or in a paired internal handoff, excluding P/ER; ER is external return received, Sgross is full article mass leaving with gross product dispatch or paired internal handoff, EO is a separate outward return to its owner, and Wwhole is the actual discarded whole wet article. J_in/out are real non-water material added/removed; H2O_in/out are real independent water uptake/loss, including natural humidity without repair. None is a fitted residual. Terms are nonoverlapping: water/material already inside O/P/I/ER/C/Sgross/EO/Wwhole stays nested there, never added again as J/H2O. Full contaminated Wwhole includes substrate, retained cleaner, gel residue and water once; do not create separately exported retained contents. Paired internal I/Sgross cancel only at the combined gate. For an expanded diagnostic equation, add OTHER_in - X_in to the left and OTHER_out - X_out to the right of the same equation. X only removes an explicitly identified OTHER same-side representation already contained in that side's gross flow; 0 <= X <= the proven duplicate OTHER. X cannot subtract O/C, any real J/H2O increment, an opposite-side leg or a merely present card. Actual repair/refill materials and outward removed matter need their exact atomic cards if present; the symbols do not assert that repair or moisture occurs. Keep physical amounts, provider burden ownership and service allocations distinct; no new Q, coproduct or avoided product from return/reuse.\n\nFor each actually separate waste event t, retain receiver identity, Qt equal to the full as-transferred wet physical load, complete nested substrate/retained gel/cleaner/water composition, collection/storage changes and actual complete treatment-provider interface. Separate liquid/cloth/gel/packing rows apply only to material not already inside a mixed whole event. Determine the provider's full physical demand Ut = convert_actual(Qt, actual provider reference unit) using measured compatible mass/volume/state or actual batch interface, never an invented kg-to-item factor. Either use a genuine full treatment producer once or expand its real treatment, transport, utilities, residuals and emissions; include actual on-site pretreatment separately without repurchasing embedded work. Attribution is a different account: for every exchange e retain the full treatment vector Bt,e and original-cohort A_t,c,e plus other actual beneficiaries/unassigned portions; the portions are disjoint and sum to Bt,e. Use actual justified service drivers and original Q0,c for each A_t,c,e/Q0,c. Qt and Ut do not become the allocated share, and the full provider must not be charged again to each cohort. Prior treatment/service history and subsequent increments are distinguished once. Unknown assignment or provider unit bridge stays unresolved with full raw loads, not a smaller physical export or a zero treatment demand.\n\n**process_water**: Actual formulation water supplied across the boundary; distinguish water already inside commercial solutions.\n\n**sorbitol_solution**: Only the exact actual recipe ingredient; measure whole commercial preparation, carriers and grade separately. Conditional non-use needs complete recipe evidence; alternative chemicals require separate cards.\n\n**glycerol**: Only the exact actual recipe ingredient; measure whole commercial preparation, carriers and grade separately. Conditional non-use needs complete recipe evidence; alternative chemicals require separate cards.\n\n**hydrated_silica**: Only the exact actual recipe ingredient; measure whole commercial preparation, carriers and grade separately. Conditional non-use needs complete recipe evidence; alternative chemicals require separate cards.\n\n**cellulose_gum**: Only the exact actual recipe ingredient; measure whole commercial preparation, carriers and grade separately. Conditional non-use needs complete recipe evidence; alternative chemicals require separate cards.\n\n**sls**: Only the exact actual recipe ingredient; measure whole commercial preparation, carriers and grade separately. Conditional non-use needs complete recipe evidence; alternative chemicals require separate cards.\n\n**saccharin**: Only the exact actual recipe ingredient; measure whole commercial preparation, carriers and grade separately. Conditional non-use needs complete recipe evidence; alternative chemicals require separate cards.\n\n**benzoate**: Only the exact actual recipe ingredient; measure whole commercial preparation, carriers and grade separately. Conditional non-use needs complete recipe evidence; alternative chemicals require separate cards.\n\n**mint_flavour**: Only the exact actual recipe ingredient; measure whole commercial preparation, carriers and grade separately. Conditional non-use needs complete recipe evidence; alternative chemicals require separate cards.\n\n**sodium_fluoride**: Only the exact actual recipe ingredient; measure whole commercial preparation, carriers and grade separately. Conditional non-use needs complete recipe evidence; alternative chemicals require separate cards.\n\n**electricity**: Actual user electricity including mixing, vacuum and hot-air sealing; compatible provider required.\n\n**compressed_air**: Actual externally delivered compressed air only; if onsite compressor electricity is counted, do not also purchase its air supply burden. Preserve measured gas-state mass and real moisture/oil.\n\n**cooling_water**: Conditional actual purchased supply at stated temperature and state, with real producer/cooling service.\n\n**wash_water**: Actual separately metered cleaning water; other cleaning chemicals require exact added rows.\n\n**tube**: Actual construction and measured tare, with physical transfers and stock bridge. Cap input is absent if already included in purchased tube assembly.\n\n**cap**: Actual construction and measured tare, with physical transfers and stock bridge. Cap input is absent if already included in purchased tube assembly.\n\n**carton**: Actual construction and measured tare, with physical transfers and stock bridge. Cap input is absent if already included in purchased tube assembly.\n\n**rotor**: Only this actual documented installed/used material; separate physical fleet from original-cohort compatible service demand. No assumed lifetime or mass.\n\n**seal**: Only this actual documented installed/used material; separate physical fleet from original-cohort compatible service demand. No assumed lifetime or mass.\n\n**cloth**: Only this actual documented installed/used material; separate physical fleet from original-cohort compatible service demand. No assumed lifetime or mass.\n\n**accepted_gel**: Whole actual gel net kg at unique first filled/sealed-tube acceptance; the event is not an additional physical dispatch. Complete Section5/9 admission, route, counterclassification and gate conditions apply.\n\n**cooling_return**: Actual same-loop physical returned water; producer service scope and return condition remain explicit, with no second cooling credit.\n\n**cap_return**: Actual separate cap return only; cap inside returned tube assembly is nested there and not repeated here.\n\n**carton_return**: Actual separate carton return with unchanged original manufacture/reuse history and physical tare stock bridge.\n\n**tube_delivered**: Actual external packaging transfer separate from product mass and manufacturing function; no duplicate cap or reuse manufacture. Customer filled returns retain original whole-gel genealogy.\n\n**cap_delivered**: Actual external packaging transfer separate from product mass and manufacturing function; no duplicate cap or reuse manufacture. Customer filled returns retain original whole-gel genealogy.\n\n**carton_delivered**: Actual external packaging transfer separate from product mass and manufacturing function; no duplicate cap or reuse manufacture. Customer filled returns retain original whole-gel genealogy.\n\n**tube_return**: Actual external packaging transfer separate from product mass and manufacturing function; no duplicate cap or reuse manufacture. Customer filled returns retain original whole-gel genealogy.\n\n**vacuum_mixer**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole configuration, contained parts, real independent replacements and laboratory own/complete-provider histories are mutually exclusive; source analytical conditions are not factory-consumption defaults. Record actual whole supplied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy.\n\n**vacuum_pump**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole configuration, contained parts, real independent replacements and laboratory own/complete-provider histories are mutually exclusive; source analytical conditions are not factory-consumption defaults. Record actual whole supplied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy.\n\n**tube_filler**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole configuration, contained parts, real independent replacements and laboratory own/complete-provider histories are mutually exclusive; source analytical conditions are not factory-consumption defaults. Record actual whole supplied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy.\n\n**balance_asset**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole configuration, contained parts, real independent replacements and laboratory own/complete-provider histories are mutually exclusive; source analytical conditions are not factory-consumption defaults. Record actual whole supplied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy.\n\n**kf_system**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole configuration, contained parts, real independent replacements and laboratory own/complete-provider histories are mutually exclusive; source analytical conditions are not factory-consumption defaults. Record actual whole supplied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy.\n\n**kf_methanol**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole config