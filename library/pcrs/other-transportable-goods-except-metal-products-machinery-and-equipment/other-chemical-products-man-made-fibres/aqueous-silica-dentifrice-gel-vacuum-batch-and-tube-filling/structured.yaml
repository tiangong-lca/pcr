    - rule_id: system_boundary_rule_81
      applies_to: "foreground_system_boundary"
      rule: "**kf_foil**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole configuration, contained parts, real independent replacements and laboratory own/complete-provider histories are mutually exclusive; source analytical conditions are not factory-consumption defaults. Record actual whole supplied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy. For the actual AN-K-053 foil-sealing step, retain this independent article, measured mass, real cutoffs and whole wet contaminated exit. If genuinely embedded in a complete configuration/provider, keep it nested without a duplicate purchase."
      source_ids: []
    - rule_id: system_boundary_rule_82
      applies_to: "foreground_system_boundary"
      rule: "**kf_foil_waste**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole configuration, contained parts, real independent replacements and laboratory own/complete-provider histories are mutually exclusive; source analytical conditions are not factory-consumption defaults. Record actual whole supplied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy. For the actual AN-K-053 foil-sealing step, retain this independent article, measured mass, real cutoffs and whole wet contaminated exit. If genuinely embedded in a complete configuration/provider, keep it nested without a duplicate purchase."
