      applies_to: "all inventory rows"
      requirement: "Actual weighing, density, formulation assays and each outlet procedure must fit the real matrix and basis. Unknown essential methods prevent complete applicable results; no future-SOP or finite-check waiver."
      evidence: "complete actual methods; matrix scope; calibration; blanks/recovery; uncertainty and detection limits"
    - id: physical_waste
      applies_to: "all inventory rows"
      requirement: "Close actual whole wet/element/phase stocks, packaging/fleet substrate and one whole contaminated receiver export independently of allocation. No invented remainders or component double-count."
      evidence: "raw ledgers; nested composition; actual receiver/provider proof; service drivers"
