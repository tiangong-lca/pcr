system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Admit only a real whole aqueous hydrated-silica dentifrice gel for personal toothbrushing, made by batch liquid preparation, gum hydration and abrasive dispersion, vacuum mixing/deaeration, slow final surfactant addition, then filling and sealing retail-kind plastic/laminate tubes. The actual formulation, grade and acceptance specification must positively identify a ready-to-use oral gel; this is a manufacturing family, not an invented fixed recipe or a named factory LCI. The Silverson complete Issue14TA4 guide identifies this gel route and ingredient functions; the independent ROSS report corroborates dispersion, hydration, vacuum and gentle final mixing. Neither provides a site inventory. Exclude white calcium-carbonate abrasive pastes, powder dentifrices, denture fixatives, mouthwash, medicaments, whitening peroxide/reactive acid-base systems, solid tablets, soap, household scouring cream, perfumes and room deodorants. Intentional antimicrobial/therapeutic actives other than separately disclosed sodium fluoride need reviewed scope extension, never a clinical-benefit default."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "The whole native Toothpaste Product positively defines an oral paste/gel dentifrice used with a toothbrush. Its complete name, synonyms and comments support the actual gel subtype; no CAS, formula, SKU, geography, manufacturing route or consumer-only receiving restriction is imposed. Its35334 scouring classification is explicit contrary metadata, not silently corrected native data. Current CPC3 retains35323 Perfume and toilet preparations separately from35331 room preparations,35334 scouring preparations and35410 odoriferous industrial raw materials. The official CPC2.1 note at printed289/PDF303 defines35323 through HS3303–3306 and35334 through3405.40; current HS2022 Chapter33 note3 and3306.10 expressly cover retail-kind dentifrices. Current CPC3 introduction paragraphs26,50–51,55–56 and93/current Family principles support a labelled historical-continuity interpretation. It is an explicit historical-continuity inference accepted as a narrower library association by the primary controller, not an official current product ruling or native classification amendment. Preserve this counterevidence and reopen on authoritative scope change. Native oral-health language establishes neither efficacy, safety, dose, avoided treatment nor functional equivalence."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "Receive and weigh actual separately purchased commercial preparations. Water, aqueous sorbitol, glycerol, hydrated silica, sodium carboxymethylcellulose, sodium lauryl sulfate, sodium saccharinate, sodium benzoate and a mint flavour preparation are individual cards; a card is active only when the real recipe uses exactly that material. Sodium fluoride is conditional on actual formulation and assay. These are documented route ingredients, not a required combined recipe, percentages, purity or dosage. Different gums, preservatives, fluoride salts, colours, abrasives or flavours require separate exact cards and provider/chemistry review before claiming a complete dataset; do not map them onto the listed chemical. For each supplied solution/slurry/blend record its whole as-supplied mass and supplier composition, water/carriers, impurities and actual state. Component fractions are nested evidence, never additional purchases of the same material; sodium fluoride, fluoride ion and total fluorine are different quantities. The reference is the actual whole gel including water and traces, never silica, fluoride, dry solids or pure-water equivalent."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "Retain stage records within the manufacturing aggregate: receipts and raw storage; liquid-base preparation; controlled gum wetting/hydration; abrasive powder/slurry feeding and dispersion; actual optional ingredient additions; vacuum mixing/deaeration; slow final SLS/flavour incorporation in the actual qualified order; actual hold, inspection and transfer; tube orientation, metered filling, hot-air sealing/coding, cap and carton operations as installed; acceptance, quarantine/rework, storage, cleaning and all controls. Silverson permits gel high-shear processing but warns that high-viscosity abrasive white paste is unsuitable for some high-speed rotor/stator stages; its modified inline refining/positive-displacement pumping are options, not universal requirements. ROSS gives a different sample staging order, not a compulsory combined process. Select and document the actual compatible sequence, shear, vacuum and temperature, not both sample sequences simultaneously. No source process time, viscosity range, efficiency, capacity, yield or machine mass is a default."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "Fix Q at one documented gate: unique first quality acceptance of filled, sealed retail-kind tubes, measured as net whole gel kg excluding tube/cap/carton tare. Lock event/unit IDs, actual net weights, product version and original cohort Q0. Bulk mix acceptance, tank discharge, gross fills, retests, returns, reopening/rework/reacceptance and dispatch of opening FG create no second event. Q is an event account, not an additional external physical output. Partition original Q0 into disjoint net remaining external deliveries, all actual onsite accepted states including quarantine, rework and gel recovered from accepted tubes, irreversible material/water loss, samples and other terminal dispositions on original acceptance basis. Internal loops and returns are transfers, not second fates. Record later external additions separately without restoring lost water into the survivor and counting the same loss again. Delivery plus new closing FG is valid only after proving all other postgate states and exits absent. Subsequent storage, repacking, rework, cleaning and asset services retain original Q0. Unknown/zero Q preserves raw totals and unresolved normalization."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "Maintain complete physical raw, solution, WIP, filled/unfilled gel, accepted/quarantined FG, return, residue, washwater, tube/cap/carton and installed-component stocks, receipts, deliveries and exports; pair internal transfers without erasing their work. Separately reconcile burden vectors for opening own raw/WIP/FG, inherited foreground work, new processing, actual providers, closing stocks and terminal fates. Own inherited work is carried once; neither new charge totals nor an upstream provider aggregate may duplicate it. A provider aggregate and its embedded decomposition are exclusive alternatives with explicit nonoverlap. Purchased ready gel is not newly manufactured here; label it as externally supplied gel, retain genuine upstream burdens and review scope if it replaces onsite manufacture. Old accepted FG and returns retain original product/cohort/history; using them creates neither free feed nor new Q."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "Before allocation reconcile actual whole wet mass, water by phase, silica/polyol/surfactant/flavour/fluoride constituents and relevant elemental ledgers including C/H/O/Si/Na/S/F as present. Hydration, dissolution and vacuum deaeration do not justify a universal chemical-conversion or zero-loss assumption. Track actual ionic dissolution/speciation and any real generated/consumed species G/C independently; reactive neutralisation, peroxide chemistry or degradation requires reviewed chemistry and exact new species, not conservation of a reacting molecule. Distinguish bound/hydrate water, free water, actual evaporation, entrained droplets, condensate and humid-air transfers. Do not create reaction water, ambient uptake, a VOC remainder or heat to force closure. Whole gel droplets/particles contain water and ingredients; their constituents are nested, not duplicate whole-mist plus component emissions. A shared wastewater mixture is one actual receiver load; nested water, dissolved chemicals, suspended silica, COD and fluorine are not multiple exports of the same mass. COD is an analytical oxygen-equivalent parameter, never kilograms of an invented chemical species."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "At the actual utility boundary meter AC drives, vacuum pump, powder handling, transfer, filler, hot-air heater, QA, cleaning, standby and rework. Preserve native electricity Net calorific value/MJ as its reference convention; kWh×3.6 is electrical unit conversion, not fuel heat or a default consumption. Link genuine compatible generation/delivery losses once. Hot-air tube sealing is an actual thermal interface even in a cold gel process: record actual heater electricity, compressed/ambient air mass or documented volume/state, inlet/outlet temperature, moisture, material enthalpy and cooling. Purchased cooling-water supply and return are separate physical transfers, not automatically fully consumed water; closed-loop recirculation cancels internally while makeup, blowdown, leakage and supplier burdens remain. Record real vacuum condensate and exhaust separately. External heat, steam, refrigerant, vacuum seal liquid or onsite combustion if actually installed needs exact additional atomic interfaces and reviewed complete upstream/chemistry, not an anonymous zero utility. No rated power, machine capacity, lifetime, COP or enthalpy residual supplies a quantity."
      source_ids: []
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "Count actual empty laminate-tube assemblies, caps and cartons by construction and measured tare; record physical receipt, delivery, return, customer return, scrap and opening/closing empty/filled stocks separately from gel net kg. An already capped purchased tube assembly contains its cap once: activate the separate cap card only for an independently supplied cap. Laminate layers and attached print are nested BOM, not additional purchases or exports. One actual contaminated tube/cap assembly, cloth or component export includes its substrate plus retained paste, washwater and other contamination once; substrate/tare and constituents are nested ledgers. Only proven physical preboundary separation permits separate paste or liquid waste. Reconcile the whole receiver amount independently from substrate stock. Keep the full physical shared waste event, recipient and transfer even when environmental service is split among original cohorts: a10kg event with25% attributable service remains10kg physical and2.5kg service, not2.5kg physical or10kg charged to each cohort. Compatible provider service and disjoint attributed vectors use original Q0; no invented separate retained-paste waste or duplicated treatment."
      source_ids: []
    - rule_id: system_boundary_rule_10
      applies_to: "foreground_system_boundary"
      rule: "Trace each actual stainless-steel rotor/stator replacement and silicone scraper/seal by measured configuration, dimensions, count/mass, installation/removal, remaining physical fleet and original served cohorts; conditional cards admit only those exact actual materials. Other installed parts, lubricants, cleaning chemicals and instruments need their own exact cards when in scope. Carry physical installed stocks separately from compatible manufacture/repair/service demand and provider embedded histories. A new component remaining installed is not a current whole-mass waste. Whole contaminated removed-part and cleaning-cloth wastes include retained gel/liquid once. No machine weight, annual replacement, assumed service life, fractional physical removal or recovery credit is inferred. A complete actual external laboratory/maintenance provider may supply its bounded service and embedded materials once; do not also add its full disaggregated history."
      source_ids: []
    - rule_id: system_boundary_rule_11
      applies_to: "foreground_system_boundary"
      rule: "Collection methods must fit the actual matrix and outlet. Net output and stock use calibrated paired gross/tare weighing or traceable actual density at measured temperature; validate gel sample representativeness, air entrapment and tube fill variability. Recipe and carrier-water composition require genuine supplier specifications/CoAs and batch reconciliation, not catalogue percentages; any active assay requires its complete actual species/matrix-valid procedure. Vacuum exhaust may contain water vapour, entrained wet gel and individual volatile flavour compounds: dry-stack PM gravimetry or total VOC/COD cannot establish their speciation or whole mass. Preserve condensate, capture, bypass and fugitive coverage, sampling recovery/blanks, flow/time/state, uncertainty and actual compartment. Qualify an independently supported complete procedure before using a quantitative outlet result; an unknown essential procedure remains a real completeness barrier and cannot be waived by future SOP promises, an inferred loss remainder or a finite check. Separate unmeasured from absent and report detection limits. This candidate sets no emissions factor, clinical benefit, regulatory compliance or approved factory study."
      source_ids: []
    - rule_id: system_boundary_rule_12
      applies_to: "foreground_system_boundary"
      rule: "Method admission is quantity- and interface-specific, distinct from ordinary study calibration. Full EPA Method18, Internet copy04/01/2025, supplies a conditional gaseous-organic GC framework only: retain Methods1/2/3 dependencies, the actual presurvey and identification, target-specific standards/column resolution, complete chosen bag/direct/dilution/adsorbent procedure, moisture/condensation controls, blanks and target-specific field recovery. It excludes polymeric, polymerising and very-low-vapour-pressure compounds; a generic flavour label or source example does not identify any actual released species. An impinger catch upstream of adsorbent must be analysed for the same targets and included in combined recovery. Full Method201A2017 sections1.5 and4 explicitly exclude water-droplet sizing, and its dry gravimetric residue cannot establish whole wet gel mass. Method5, the alternative mentioned by Method201A, defines gravimetric PM after removal of uncombined water and dries/desiccates recovered residue; this can support qualified nonvolatile PM, not original whole wet-gel or entrained-water mass. These methods alone do not supply original wet-gel/phase recovery; the concrete bulk-water and quantitative gas programmes below address different measurands. Whole collected condensate or captured mist transferred to a real receiver is measured once as its specific whole waste mixture with nested components; it is not a released elementary chemical or a second aerosol export. Residual environmental water, gel droplets and actual individual chemical species/medium require genuinely applicable complete procedures; do not assume complete capture or invent constituents. If actual final wet droplets require independent original-phase quantitative exports, the affected phase-preserving procedure remains on method hold pending independent review; no route-wide absence or acceptance is inferred. Actual-site instrument calibration and field recovery of an already applicable procedure are separate ordinary study obligations."
      source_ids: []
