  calculation_rules:
    - id: normalize
      applies_to: "all inventory rows"
      rule: "Divide each disjoint attributable numerator by positive locked Q; later cohort services use original Q0. Keep raw physical totals independently."
      inputs:
        - "actual row exchange"
        - Q
        - cp_product
        - "row protocol"
      output: "Same original numerator unit per kg whole gel"
      source_ids: []
    - id: first_event_bridge
      applies_to: "accepted_gel"
      rule: "Sum unique first accepted net whole-gel masses; reconcile original Q0 through complete disjoint original-basis deliveries, onsite states, losses, samples and terminal fates. Transfers/retests create no event or second fate."
      inputs:
        - "acceptance IDs"
        - "actual net masses"
        - "original Q0"
        - "state and fate ledger"
      output: "Locked Q and fully classified postgate reconciliation"
      source_ids: []
    - id: whole_preparation
      applies_to: "process_water; sorbitol_solution; glycerol; hydrated_silica; cellulose_gum; sls; saccharin; benzoate; mint_flavour; sodium_fluoride"
      rule: "Whole supply mass contains carrier and ingredients once; component mass equals that whole mass times the actual compatible supplied fraction, with independent component/element checks. It is not another purchase or a universal formula."
      inputs:
        - "whole mass"
        - "actual composition and basis"
        - "supplier assay"
        - "component stocks"
      output: "Whole purchase plus nested component evidence"
      source_ids: []
    - id: volume_to_mass
      applies_to: "all inventory rows"
      rule: "Convert actual volume only with measured same-mixture density at recorded temperature and compatible units; convert count only with representative actual same-item tare/net mass. Integrated volume is not multiplied by time again."
      inputs:
        - "volume or count"
        - "measured density/state or item mass"
        - uncertainty
      output: "Actual whole physical mass with uncertainty"
      source_ids: []
    - id: electric_conversion
      applies_to: "electricity"
      rule: "Measured electrical kWh multiplied by3.6 gives MJ; retain the native NCV reference convention without interpreting it as combustion or heat output."
      inputs:
        - "metered kWh"
        - "actual provider"
        - conversion3.6
      output: "Electrical energy on actual native reference unit"
      source_ids: []
    - id: whole_waste_service
      applies_to: "tube_waste; carton_waste; part_waste; seal_waste; cloth_waste; washwater; condensate; gel_reject"
      rule: "Each actual whole recipient amount equals nested substrate, paste, liquid and other measured constituents. Keep full physical event and independently disjoint cohort service fractions; use original Q0, never create companion retained-paste export."
      inputs:
        - "whole receiver mass"
        - "nested composition"
        - "substrate stocks"
        - "actual cohort service driver"
      output: "One physical transfer and nonoverlapping attributed service vector"
      source_ids: []
    - id: outlet_integration
      applies_to: "water_vapour; gel_aerosol"
      rule: "Integrate independently measured compatible concentration and actual gas flow over time, or use a complete separately validated transfer method. Preserve gas state and phase; no total-VOC-to-species, COD-to-chemical or dry-PM-to-wet-mist conversion."
      inputs:
        - "complete applicable procedure"
        - "actual phase concentration"
        - "flow time state"
        - "blanks recovery uncertainty"
      output: "Actual disjoint outlet transfer or explicit unresolved result"
      source_ids: []
    - id: kf_water
      applies_to: "all inventory rows"
      rule: "Preserve and do not blindly copy monograph10.1.1 printed %water=(EP1-C30)*C01*C02*C03/C00: EP1 is mL, C30 is labelled mgH2O/2g, C01 is mgH2O/mL, C00 is g, C02 is100 and C03 is25 for2g sample plus50g solvent; the source footnote acknowledges approximation. Subtracting mg from mL is undefined without an identical actual aliquot/endpoint-equivalent blank basis. Independently use T[mg/mL]=m_std[g]*w_cert[mg/g]/(V_std-B_std)[mL]; W_sample[mg]=T*(V_sample-B_sample)-D_once[mg]; water_percent=0.1*W_sample[mg]/m_sample[g]. D_once is only independently measured drift not already corrected in the blank/instrument; do not subtract it twice. If both numerator and denominator are mg, percent uses100 instead. A genuinely homogeneous complete dilution has original sample fraction f=m0/(m0+M_solvent) and sample mass in aliquot f*m_aliquot; subtract actual solvent water represented by that aliquot. Thus2g+50g gives52g and factor26, not25, under those specific assumptions. With settling, W_original=W_actual_liquid+W_retained_residue-W_added_solvent_or_handling; W_actual_liquid=(W_aliquot/m_aliquot)*M_actual_liquid. Do not replace actual liquid mass by total preparation mass or assume retained water zero. These dimensional bridges are transparent technical synthesis, not source errata, a factory measurement or a recipe."
      inputs:
        - cp_kf
        - cp_water
        - cp_residue
        - cp_material
      output: "water-selective nested mass with full represented-sample bridge"
      source_ids:
        - metrohm-k053
        - metrohm-kf-monograph
    - id: whole_pack
      applies_to: "all inventory rows"
      rule: "For each actual article and each manufacture, later-service and combined gate, use the whole-wet equation O + P + I + ER + J_in + H2O_in = C + Sgross + EO + Wwhole + J_out + H2O_out. O/C contain all actual empty, attached raw/WIP/non-WIP/FG and reusable stocks. P is independent new external procurement; I is actual packing received contained in a whole supply or in a paired internal handoff, excluding P/ER; ER is external return received, Sgross is full article mass leaving with gross product dispatch or paired internal handoff, EO is a separate outward return to its owner, and Wwhole is the actual discarded whole wet article. J_in/out are real non-water material added/removed; H2O_in/out are real independent water uptake/loss, including natural humidity without repair. None is a fitted residual. Terms are nonoverlapping: water/material already inside O/P/I/ER/C/Sgross/EO/Wwhole stays nested there, never added again as J/H2O. Full contaminated Wwhole includes substrate, retained cleaner, gel residue and water once; do not create separately exported retained contents. Paired internal I/Sgross cancel only at the combined gate. For an expanded diagnostic equation, add OTHER_in - X_in to the left and OTHER_out - X_out to the right of the same equation. X only removes an explicitly identified OTHER same-side representation already contained in that side's gross flow; 0 <= X <= the proven duplicate OTHER. X cannot subtract O/C, any real J/H2O increment, an opposite-side leg or a merely present card. Actual repair/refill materials and outward removed matter need their exact atomic cards if present; the symbols do not assert that repair or moisture occurs. Keep physical amounts, provider burden ownership and service allocations distinct; no new Q, coproduct or avoided product from return/reuse."
      inputs:
        - cp_pack
      output: "independent whole wet physical pool"
      source_ids: []
    - id: whole_receiver
      applies_to: "all inventory rows"
      rule: "For each actually separate waste event t, retain receiver identity, Qt equal to the full as-transferred wet physical load, complete nested substrate/retained gel/cleaner/water composition, collection/storage changes and actual complete treatment-provider interface. Separate liquid/cloth/gel/packing rows apply only to material not already inside a mixed whole event. Determine the provider's full physical demand Ut = convert_actual(Qt, actual provider reference unit) using measured compatible mass/volume/state or actual batch interface, never an invented kg-to-item factor. Either use a genuine full treatment producer once or expand its real treatment, transport, utilities, residuals and emissions; include actual on-site pretreatment separately without repurchasing embedded work. Attribution is a different account: for every exchange e retain the full treatment vector Bt,e and original-cohort A_t,c,e plus other actual beneficiaries/unassigned portions; the portions are disjoint and sum to Bt,e. Use actual justified service drivers and original Q0,c for each A_t,c,e/Q0,c. Qt and Ut do not become the allocated share, and the full provider must not be charged again to each cohort. Prior treatment/service history and subsequent increments are distinguished once. Unknown assignment or provider unit bridge stays unresolved with full raw loads, not a smaller physical export or a zero treatment demand."
      inputs:
        - cp_water
        - cp_residue
        - cp_waste_kf
        - cp_history
      output: "full Qt/Ut and disjoint original-cohort A/Q0"
      source_ids: []
