      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| validate_identity | accepted_gel | Require all complete Section5 product/native/classification conditions and all13ordered qualifiers. A successful finite check is not independent source, translation, scientific, study or mapping approval. | wco-hs33-2022; unsd-cpc21-continuity; unsd-cpc3-principles |\n| validate_gate | accepted_gel | Audit unique first filled/sealed-tube net acceptance, original Q0 and complete disjoint actual postgate states/fates; no repeat loops or restored-loss double counting. Unknown/zero Q is incomplete. |  |\n| validate_recipe | all inventory rows | Match every actual whole preparation, carrier, active species, installed material, provider and unit. Alternative chemicals require exact separate rows. Whole commercial and nested component masses cannot be double-added. | silverson-toothpaste-14ta4; ross-toothpaste |\n| validate_physical | all inventory rows | Independently check complete physical stocks/transfers, actual wet/element/phase/G-C ledgers, energy/cooling/hot-air interfaces and one whole contaminated waste event with nested constituents, before burden allocation. | silverson-toothpaste-14ta4; ross-toothpaste; norden-tube-filling |\n| validate_history | all inventory rows | Carry own inherited work once, retain genuine providers and exclusive embedded/decomposed histories, and preserve original Q0 for later shared services. Fractional service attribution never shrinks the real shared physical waste export. |  |\n| validate_methods | water_vapour; gel_aerosol | Apply complete Section5 matrix/phase/species limits. Known essential analytical or outlet-method gaps remain barriers; no dry-PM, totalVOC or COD proxy, future-SOP promise or checkpass can close them. | metrohm-k053; metrohm-kf-monograph; epa-ftir320-2019; epa-validation301-2017; epa-pm201a-2017; epa-pm5-2017; epa-moisture4-2017 |\n\n"
