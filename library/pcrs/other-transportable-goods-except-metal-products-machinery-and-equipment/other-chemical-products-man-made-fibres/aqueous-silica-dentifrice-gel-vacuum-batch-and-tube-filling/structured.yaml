lied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy.\n\n**kf_spent**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole configuration, contained parts, real independent replacements and laboratory own/complete-provider histories are mutually exclusive; source analytical conditions are not factory-consumption defaults. Record actual whole supplied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy.\n\n**retired_vacuum_mixer**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole configuration, contained parts, real independent replacements and laboratory own/complete-provider histories are mutually exclusive; source analytical conditions are not factory-consumption defaults. Record actual whole supplied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy.\n\n**retired_vacuum_pump**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole configuration, contained parts, real independent replacements and laboratory own/complete-provider histories are mutually exclusive; source analytical conditions are not factory-consumption defaults. Record actual whole supplied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy.\n\n**retired_tube_filler**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole configuration, contained parts, real independent replacements and laboratory own/complete-provider histories are mutually exclusive; source analytical conditions are not factory-consumption defaults. Record actual whole supplied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy.\n\n**retired_balance_asset**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole configuration, contained parts, real independent replacements and laboratory own/complete-provider histories are mutually exclusive; source analytical conditions are not factory-consumption defaults. Record actual whole supplied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy.\n\n**retired_kf_system**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole configuration, contained parts, real independent replacements and laboratory own/complete-provider histories are mutually exclusive; source analytical conditions are not factory-consumption defaults. Record actual whole supplied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy.\n\n**cap_waste**: Only a physically separate cap waste export including its retained paste/water; no additional cap waste when already contained in a whole tube assembly export.\n\n**gel_reject**: One actual physically separate receiver stream, whole as transferred including retained paste/liquid where present; nested constituents and substrate stock are not extra waste or treatment.\n\n**washwater**: One actual physically separate receiver stream, whole as transferred including retained paste/liquid where present; nested constituents and substrate stock are not extra waste or treatment.\n\n**condensate**: One actual physically separate receiver stream, whole as transferred including retained paste/liquid where present; nested constituents and substrate stock are not extra waste or treatment.\n\n**tube_waste**: One actual physically separate receiver stream, whole as transferred including retained paste/liquid where present; nested constituents and substrate stock are not extra waste or treatment.\n\n**carton_waste**: One actual physically separate receiver stream, whole as transferred including retained paste/liquid where present; nested constituents and substrate stock are not extra waste or treatment.\n\n**part_waste**: One actual physically separate receiver stream, whole as transferred including retained paste/liquid where present; nested constituents and substrate stock are not extra waste or treatment.\n\n**seal_waste**: One actual physically separate receiver stream, whole as transferred including retained paste/liquid where present; nested constituents and substrate stock are not extra waste or treatment.\n\n**cloth_waste**: One actual physically separate receiver stream, whole as transferred including retained paste/liquid where present; nested constituents and substrate stock are not extra waste or treatment.\n\n**water_vapour**: Only actual environmental water-vapour transfer established separately from droplets, condensate and returned cooling water; no closure remainder.\n\n**ambient_heat**: Only actual independently established thermal transfer to air, including actual sealing/vacuum/mixing heat as present. Do not repeat energy already transferred in cooling-water return or create a residual closure output.\n\n**gel_aerosol**: Actual whole specific wet gel droplets at a real air outlet; water/solids/flavour constituents nested. Unresolved flow identity and matrix procedure cannot be replaced by dry PM or a free-silica proxy.\n\nThis is a distinct personal oral-gel method. It does not repair the unresolved finished-personal-perfume reference identity in earlier research or convert fragrance concentrate into finished perfume. No whole35323 coverage or approved study is claimed. The primary controller accepts the narrower scoped library association; exact delivery qualification and serial landing are recorded separately.\n\n**kf_foil**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole configuration, contained parts, real independent replacements and laboratory own/complete-provider histories are mutually exclusive; source analytical conditions are not factory-consumption defaults. Record actual whole supplied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy. For the actual AN-K-053 foil-sealing step, retain this independent article, measured mass, real cutoffs and whole wet contaminated exit. If genuinely embedded in a complete configuration/provider, keep it nested without a duplicate purchase.\n\n**kf_foil_waste**: Include only when the actual operation uses this real article/preparation or separately transferred waste. Whole configuration, contained parts, real independent replacements and laboratory own/complete-provider histories are mutually exclusive; source analytical conditions are not factory-consumption defaults. Record actual whole supplied state/reference unit, measured mass and compatible unit bridge, full stocks/original-Q0 service history and whole wet receiver quantities. Leave the specific UUID unresolved rather than use a raw-material or different-object proxy. For the actual AN-K-053 foil-sealing step, retain this independent article, measured mass, real cutoffs and whole wet contaminated exit. If genuinely embedded in a complete configuration/provider, keep it nested without a duplicate purchase.\n\nKeep genuinely unused non-WIP holdings distinct from raw stock, processed WIP, accepted FG, quarantine and returns; each physical portion and inherited burden vector has one actual class and cannot be included in two stocks. Preserve their own opening/closing composition, moisture, transfers and own/provider history. Q, Q0 and original-cohort Q0,c refer to the locked unique first-acceptance denominator of that cohort, not its current survivor mass or current-period production. A zero current-period acceptance/dispatch does not erase a positive original Q0 or prevent reporting its real later-service A/Q0. Only a genuinely zero or unknown original denominator leaves that cohort raw totals/history without a unit result.\n\nThe validation dependency is the actual complete EPA Method301 Internet copy4August2017, not a matching old section number. Method320§13.4.2 points to Method301§6.3.2.2/6.3.3, whereas this301 edition places analyte-spike statistics in§12; retain that edition mismatch. Method301Table1/§6.2 requires six quadruplet sets, two spiked and two unspiked per set:24 observations but six independent set differences, n=6 and df=5, two-sided95% tcritical2.571. Its printed Eq301-13 is di=(S1i+S2i)/2-(M1i+M2i)/2-CS; preserve its actual population and units. For the actual dynamic FTIR mixture, retain measured spike fraction k and unchanged native observations, construct E_i=k_i*Cstd_i+(1-k_i)*U_i on one compatible basis and explicitly bridge D_i=S_i-E_i; this is the transparent actual-flow adaptation to Method320 expected mixed concentration, not an unrecorded alteration of301. Ignoring dilution can manufacture a false bias. Compute the mean of the six D_i, sample SD with denominator5, and t=abs(meanD)/(SD_D/sqrt6); more observations require an explicitly justified independent grouping, not n=12 or24 merely because spectra exist. Printed301§12 uses BR=abs(B)/abs(VS)*100 but defines VS as the mean from a validated method, a label carried from the comparison branch; do not silently relabel VS as CS, spike contribution or native concentration. The actual reference measurand/denominator and any correction-factor derivation must be independently identified and documented before that dependent acceptance/correction claim. §8 and§12 differ at their30% boundary wording; equality is not automatically passed. §9 precision is at most20%RSD; its >20% and <50% RSD branch requires at least nine runs, not unconditional six-set acceptance. The320 CF0.7–1.3 condition and routineQA-spike window are not interchangeable with that bias/precision test. If the actual edition/reference/correction interpretation is essential and unresolved, retain that narrow dependent gas-validation limitation; this does not negate the existence of the sampling and quantitative reference programme. For genuinely stored samples,301§7 first uses well-established experimentally supported holding procedures; otherwise retain its applicable sampling/stability tests, equal spiked/unspiked groups, minimum/maximum-time paired differences,95%/n-1 t test and shorter maximum holding after significant change. Preserve§7.1 ASAP/72h wording versus Table3 within7days and the separate other-media§7.3 branch; two weeks is not a universally safe holding time. Real-time inline FTIR is not an invented stored-sample interval. Method301 is a validation framework, not a collection/preparation method for original wet-gel phases, not a KF matrix-release proof, and not a claim of current regulatory compliance or performed site QA.\n\n"
