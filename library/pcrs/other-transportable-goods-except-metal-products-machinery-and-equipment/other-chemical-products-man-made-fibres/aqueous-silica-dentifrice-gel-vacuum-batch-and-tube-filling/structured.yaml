allocation_rules:
  - rule_id: sole_reference
    applies_to: "gel_manufacture"
    rule: "The actual whole gel is the sole reference function. Package tare, waste, cooling return and recovered ingredients are physical transfers, not automatic cofunctions, equal oral efficacy or avoided-production credits."
    source_ids: []
  - rule_id: causal_services
    applies_to: "all inventory rows"
    rule: "Trace batches/submeters before demonstrated causal shared-service allocation. Preserve full physical recipient quantities, original cohorts/Q0 and separate nonoverlapping provider and own history vectors; allocation never changes Q, species or physical waste."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "gel_manufacture"
      flow_role: "accepted_gel"
      record_type: "first_acceptance_event"
      raw_fields: "product and recipe version; tube/unit IDs; first gate/time; calibrated gross and tare/net; acceptance decision; original cohort Q0; all later states/additions/returns/losses/samples  Q0; all original fates; wet original/additional material bridge;  distinct genuinely unused non-WIP stocks/vectors; positive original Q0 independent of zero current output;"
      collection_method: "Weigh representative paired filled/empty actual tubes or each net fill with traceable calibration. Preserve unique acceptance registry and full original-basis disjoint fate bridge of Section5. Retests and returns retain IDs.  Apply the complete corresponding actual Section5 programme and its admission/limits; an unknown necessary branch supplies no dependent quantity."
      unit: "kg"
      frequency: "every unique event and subsequent state/stock boundary"
      temporal_coverage: "campaign plus inherited and later original-cohort services"
      site_scope: "one actual filled/sealed tube first-acceptance gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; actual tare distribution; no nominal fill default; unique registry; exhaustive fates; positive Q"
    - protocol_id: cp_material
      process_id: "gel_manufacture"
      flow_role: "individual formulation input"
      record_type: "whole_preparation_batch"
      raw_fields: "individual supplied grade/lot; whole mass; exact formulation/version; water and carrier fractions/basis; impurities; CoA/specification; receipts/returns; raw/WIP/FG stocks; feed and recycle genealogy"
      collection_method: "Net-weigh actual whole commercial preparations, preserve supplier composition and actual sample/assay methods; reconcile individual stocks and paired process transfers. Count solution once and constituents only nested. Non-use needs the complete actual recipe."
      unit: "kg"
      frequency: "each receipt/charge/return and stock boundary"
      temporal_coverage: "full campaign with inherited raw/WIP history"
      site_scope: "exact actual oral-gel ingredients; alternatives need separate cards"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated net weights; real grade and composition; full species/matrix procedure where needed; recipe closure without residual ingredient"
    - protocol_id: cp_energy
      process_id: "gel_manufacture"
      flow_role: "electricity; compressed_air; cooling_water; cooling_return"
      record_type: "utility_interface_meter"
      raw_fields: "meter/interface IDs; electrical kWh; provider/voltage/loss; actual gas mass or volume T/P/humidity; heater/vacuum/drive loads; cooling supply/return mass temperature; stock energy; actual heat and uncertainty"
      collection_method: "Submeter actual stages including hot-air heater and auxiliaries, reconcile site totals and state/enthalpy interfaces from independent observations. External air or onsite compression is exclusive supply history; keep water returns separate and preserve unresolved energy residual."
      unit: "MJ; kg"
      frequency: "continuous or bounded actual meter intervals"
      temporal_coverage: "production, idle, cleaning, rejects, rework and later services"
      site_scope: "real user utility and thermal interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration;3.6 conversion; gas-state evidence; actual provider; cooling and heat evidence; no rated-power estimate"
    - protocol_id: cp_pack
      process_id: "gel_manufacture"
      flow_role: "tube/cap/carton physical transfers and wastes"
      record_type: "packaging_genealogy"
      raw_fields: "individual construction and assembly BOM; measured tare/count; cap inclusion; receipts/delivery/return/customer return/scrap; empty/filled stock; whole contaminated export; nested gel/water/substrate; recipient/service driver  O; P; I; ER; C; Sgross; EO; Wwhole; J_in/out; H2O_in/out; OTHER_in/out; X_in/out;"
      collection_method: "Weigh actual matching empty/full packaging and every transfer. Reconcile tube, independent cap and carton substrate separately; weigh contaminated exports whole, keeping actual receiver totals and disjoint cohort service vectors.  Apply the complete corresponding actual Section5 programme and its admission/limits; an unknown necessary branch supplies no dependent quantity."
      unit: "kg"
      frequency: "each transfer and opening/closing stock"
      temporal_coverage: "full packaging history including customer returns"
