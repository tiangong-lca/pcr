    - rule_id: system_boundary_rule_16
      applies_to: "foreground_system_boundary"
      rule: "For an actually representative whole wet gel or separately collected gel/liquid receiver, AN-K-053 is a concrete direct-beaker volumetric Karl Fischer programme: weigh approximately30–50mg toothpaste into the titration beaker, add magnetic stirrer, tightly seal with Al-foil/holder and use the specified MATi10/814 workflow. Add20mL methanol/formamide7:3v/v. Discard the system-preparation blank; determine three empty-beaker/20mL-solvent blanks, store their mean and subtract it from BOTH titer and sample endpoint volumes. Use certified water-standard content and the actual measured titer of Composite5 in the same medium, not its nominal label. The published changed parameters are pause8s and extraction30s with the specified apparatus; do not invent unspecified defaults or claim these times release every matrix water fraction. The note expressly requires adaptation where necessary. Its55.82% water, n6/RSD0.27% and blank1.471mL are an actual demonstration/precision result, never gel composition, water recovery or a plant factor. The direct whole weighed aliquot is not a settled-supernatant sample. The monograph recommends high-water dilution to reduce small-weighing error, whereas this robotic note uses direct small samples. Select the actual representative precision/solvent branch without silently combining the two workflows or imposing a universal dilution factor."
      source_ids: []
    - rule_id: system_boundary_rule_17
      applies_to: "foreground_system_boundary"
      rule: "Monograph8.026.5013 §§6–8 and10.1.1/10.1.5 supply the complete titer, sampling and preparation context. Preserve a representative actual wet sample quickly in a closed vessel with no changed moisture during transport/storage; include separated water, wall deposits and heterogeneous gel in the sampling design. Homogenization or a weighed solubility promoter with its measured blank is an actual branch for pastes/viscous liquids. Direct in-cell analysis requires compatible solvent, water release and no relevant side reaction. External extraction may leave equilibrium-retained water; a free-water spike or repeat precision alone does not prove complete original/bound water release. The toothpaste alternative weighs approximately1g with40mL methanol in a dry septum flask, seals/shakes/stirs5min, settles, draws approximately5mL supernatant and injects approximately3mL into the conditioned cell with a matched blank and actual syringe back-weighing. These source conditions are a distinct extraction branch, not homogeneous whole-sample dilution or proof that residual solids contain no water. Oven heating is below decomposition/interfering distillates with actual optimized temperature/time and blank, never an assumed250C setting. A different actual receiver containing wash chemicals must fit its real matrix; the toothpaste method is not blanket qualification of every liquid or contaminated article."
      source_ids: []
    - rule_id: system_boundary_rule_18
      applies_to: "foreground_system_boundary"
      rule: "KF selectivity is conditional on actual chemistry. Monograph7.1–7.8 retains carbonate/hydroxide/some-oxide water generation (not all oxides), aldehyde/ketone acetal/ketal water generation and aldehyde bisulfite water consumption, strong-acid/pH effects, terminal silanol/siloxane reaction with methanol, boron compounds, peroxides, iodine-consuming reducing and iodine-generating oxidizing substances. The concrete special/methanol-free/higher-alcohol/temperature or preparation branches are selected only when actual constituents and compatibility support them; no new universal substitute recipe is invented. The terminal R3SiOH example is not proof that every hydrated-silica dentifrice necessarily has the same significant interference. The monograph distinguishes organic-peroxide reactions from its hydroperoxide example where iodine and water effects compensate; do not declare every peroxide an interference. Keep excluded carbonate/peroxide/reactive product contexts separate from this silica oral-gel scope. Actual composition, release/endpoint behavior, calibrated titer, blanks/drift, recovery and uncertainty under a real applicable programme are study qualification; their unperformed status alone is not absence of a method. If a genuinely necessary actual preparation/selection branch has no complete applicable programme, retain that specific dependent hold, not a future-SOP waiver."
      source_ids: []
    - rule_id: system_boundary_rule_19
      applies_to: "foreground_system_boundary"
      rule: "Preserve and do not blindly copy monograph10.1.1 printed %water=(EP1-C30)*C01*C02*C03/C00: EP1 is mL, C30 is labelled mgH2O/2g, C01 is mgH2O/mL, C00 is g, C02 is100 and C03 is25 for2g sample plus50g solvent; the source footnote acknowledges approximation. Subtracting mg from mL is undefined without an identical actual aliquot/endpoint-equivalent blank basis. Independently use T[mg/mL]=m_std[g]*w_cert[mg/g]/(V_std-B_std)[mL]; W_sample[mg]=T*(V_sample-B_sample)-D_once[mg]; water_percent=0.1*W_sample[mg]/m_sample[g]. D_once is only independently measured drift not already corrected in the blank/instrument; do not subtract it twice. If both numerator and denominator are mg, percent uses100 instead. A genuinely homogeneous complete dilution has original sample fraction f=m0/(m0+M_solvent) and sample mass in aliquot f*m_aliquot; subtract actual solvent water represented by that aliquot. Thus2g+50g gives52g and factor26, not25, under those specific assumptions. With settling, W_original=W_actual_liquid+W_retained_residue-W_added_solvent_or_handling; W_actual_liquid=(W_aliquot/m_aliquot)*M_actual_liquid. Do not replace actual liquid mass by total preparation mass or assume retained water zero. These dimensional bridges are transparent technical synthesis, not source errata, a factory measurement or a recipe."
      source_ids: []
    - rule_id: system_boundary_rule_20
      applies_to: "foreground_system_boundary"
      rule: "The vessel vacuum port is an internal producer interface unless the actual installation proves it is the final external outlet. Retain actual vessel transfers, lines, actual collection/cooling/receiver/pump/seal-liquid interfaces, returns, stocks, cleaning, bypasses, fugitive paths, utilities and complete own/provider history. Neither Silverson nor ROSS specifies a complete capture/pump-final-discharge topology; do not invent one, assume complete capture or delete an outlet. Dry-ice traps documented for other abrasive cream-toothpaste patent examples are a technical precedent only, not evidence a trap is installed for this gel. If a genuine complete producer includes actual capture/condensation, its whole wet receiver is measured once with nested constituents, and the actual final environmental outlet is measured separately. Do not report the same internal mixed stream again as an environmental release. Internal instantaneous phase partition is not automatically a separate LCA emission requirement. Actual complete provider linkage or real own-process expansion is exclusive; no paper outsourcing hides vacuum production or treatment."
      source_ids: []
    - rule_id: system_boundary_rule_21
      applies_to: "foreground_system_boundary"
      rule: "For an actual final IR-active vapour claim, use complete EPA Method320 plus FTIRProtocol, not a qualitative title: identify actual water and each real volatile flavour molecule, select its reference spectrum/interferences, preserve material-compatible heated probe/filter/line/cell and actual dewpoint/pressure/temperature/pathlength/flow/time basis, leak checks and all real outlet coverage. Quantitative water under §8.5.2 requires Protocol4.6 quantitative standards, two-or-more concentrations in duplicate and CTS before/after, traceability/stability and the required secondary verification for only two self-prepared concentrations; a water interference spectrum alone is not quantitative. Initial §13/Method301 validation uses the real dynamic12spiked/12unspiked series, distinct from routine §8.6.2 QA spikes and bias correction. Retain sampling/matrix loss and condensate recovery, raw spectra and uncertainty; integrate compatible concentration and actual flow/state/time once. In the source printed tracer notation use physical k=(tracer_spk-tracer_native)/(tracer_std-tracer_native) and Cexpected=k*Cstd+(1-k)*Cnative on the same basis; the inconsistent DF>=10 is not a physical fraction or an invented tracer dose. Method4 saturated/water-droplet positive bias and the Method18/201A/5 limitations remain real countercontext. Heated FTIR can vaporize incoming droplet water; it cannot recover original vapour versus wet-gel phases or quantify whole aerosol/gel from cell water. Total condensate is not assumed pure water. If an actual final environmental outlet contains wet droplets and separate original-phase exports are necessary, phase-preserving representative collection and complete recovery remain a concrete affected-study method hold. Bulk KF and quantitative gas programmes do not close that specific conditional gap; conditional cards neither prove a universal release nor prove it absent."
      source_ids: []
    - rule_id: system_boundary_rule_22
      applies_to: "foreground_system_boundary"
      rule: "Complete actual vacuum mixing, separate vacuum pump where not included, tube filling/hot-air sealing, balances and the actual KF analytical system have physical configured-fleet and separate service histories. Include each whole supplied configuration once; its original contained rotor/seal/instrument is nested, while a real subsequent independent replacement is a new component input. Record actual acquisition/provider reference unit, measured configuration bridge, active/spare/repair/loan stocks, returns/retirement, maintenance and actual use across all original Q0 cohorts. Actual cloths and sampling/analytical tools retain wash/reuse/retirement and contamination histories. Real QA laboratory work is part of the complete own or genuine provider boundary, with actual methanol, formamide, whole supplied KF titrant, certified standard and spent liquor interfaces if performed; no paper laboratory outsourcing or nominal analytical consumption is imposed. Additional actual reagents, supplied containers, parts or secondary-method interfaces require exact separate cards. A whole linked complete producer and its expanded inputs/history are exclusive. No assumed equipment weight/life/use count, recipe or missing provider-unit conversion is supplied."
      source_ids: []
    - rule_id: system_boundary_rule_23
      applies_to: "foreground_system_boundary"
      rule: "For each actual article and each manufacture, later-service and combined gate, use the whole-wet equation O + P + I + ER + J_in + H2O_in = C + Sgross + EO + Wwhole + J_out + H2O_out. O/C contain all actual empty, attached raw/WIP/non-WIP/FG and reusable stocks. P is independent new external procurement; I is actual packing received contained in a whole supply or in a paired internal handoff, excluding P/ER; ER is external return received, Sgross is full article mass leaving with gross product dispatch or paired internal handoff, EO is a separate outward return to its owner, and Wwhole is the actual discarded whole wet article. J_in/out are real non-water material added/removed; H2O_in/out are real independent water uptake/loss, including natural humidity without repair. None is a fitted residual. Terms are nonoverlapping: water/material already inside O/P/I/ER/C/Sgross/EO/Wwhole stays nested there, never added again as J/H2O. Full contaminated Wwhole includes substrate, retained cleaner, gel residue and water once; do not create separately exported retained contents. Paired internal I/Sgross cancel only at the combined gate. For an expanded diagnostic equation, add OTHER_in - X_in to the left and OTHER_out - X_out to the right of the same equation. X only removes an explicitly identified OTHER same-side representation already contained in that side's gross flow; 0 <= X <= the proven duplicate OTHER. X cannot subtract O/C, any real J/H2O increment, an opposite-side leg or a merely present card. Actual repair/refill materials and outward removed matter need their exact atomic cards if present; the symbols do not assert that repair or moisture occurs. Keep physical amounts, provider burden ownership and service allocations distinct; no new Q, coproduct or avoided product from return/reuse."
      source_ids: []
    - rule_id: system_boundary_rule_24
      applies_to: "foreground_system_boundary"
      rule: "For each actually separate waste event t, retain receiver identity, Qt equal to the full as-transferred wet physical load, complete nested substrate/retained gel/cleaner/water composition, collection/storage changes and actual complete treatment-provider interface. Separate liquid/cloth/gel/packing rows apply only to material not already inside a mixed whole event. Determine the provider's full physical demand Ut = convert_actual(Qt, actual provider reference unit) using measured compatible mass/volume/state or actual batch interface, never an invented kg-to-item factor. Either use a genuine full treatment producer once or expand its real treatment, transport, utilities, residuals and emissions; include actual on-site pretreatment separately without repurchasing embedded work. Attribution is a different account: for every exchange e retain the full treatment vector Bt,e and original-cohort A_t,c,e plus other actual beneficiaries/unassigned portions; the portions are disjoint and sum to Bt,e. Use actual justified service drivers and original Q0,c for each A_t,c,e/Q0,c. Qt and Ut do not become the allocated share, and the full provider must not be charged again to each cohort. Prior treatment/service history and subsequent increments are distinguished once. Unknown assignment or provider unit bridge stays unresolved with full raw loads, not a smaller physical export or a zero treatment demand."
