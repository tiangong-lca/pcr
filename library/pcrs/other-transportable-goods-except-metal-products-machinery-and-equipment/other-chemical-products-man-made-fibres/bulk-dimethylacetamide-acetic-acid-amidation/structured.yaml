allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "all inventory rows"
    rule: "First subdivide separately measurable stages/shared facilities; attribute environmental service and burden only by evidenced relevant causality. Distillate and heels are not presumed saleable co-products or substitution credits; a real co-function needs separate evidence/review. Whole physical waste/assets stay unchanged; service vectors remain non-overlapping and use each original cohort Q."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "acid_amidation"
      flow_role: "finished_dmac"
      record_type: "Unique first-acceptance ledger"
      raw_fields: "event id; original cohort; lot genealogy; date; calibrated net whole-product mass; tare; assay/water; disjoint closing states; actual losses/dispositions"
      collection_method: "Weigh and bind first quality release independently from dispatch; deduplicate returns and rework"
      unit: "kg"
      frequency: "Each batch, transfer and stock cutoff"
      temporal_coverage: "Same cohort and complete period including startup/shutdown and old-cohort services"
      site_scope: "Complete selected plant stages and shared interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, signed raw records, method applicability, genealogy and provider/receiver evidence"
    - protocol_id: cp_material
      process_id: "acid_amidation"
      flow_role: "acetic_acid; dimethylamine; startup_dmac; returned_dmac; cleaning_water"
      record_type: "External whole-material receipt/use and physical stocks"
      raw_fields: "whole-material receipt/issues; composition; water; lot; actual phase; original provider; full raw/WIP/FG tank opening/closing; reflux and returns; inherited own/provider boundaries"
      collection_method: "Use calibrated weighing, tank or flow records; preserve actual density conversions and avoid correcting already stock-adjusted consumption twice"
      unit: "kg"
      frequency: "Each batch, transfer and stock cutoff"
      temporal_coverage: "Same cohort and complete period including startup/shutdown and old-cohort services"
      site_scope: "Complete selected plant stages and shared interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, signed raw records, method applicability, genealogy and provider/receiver evidence"
    - protocol_id: cp_utility
      process_id: "acid_amidation"
      flow_role: "nitrogen; cooling_makeup; purchased_steam; electricity; condensate_return"
      record_type: "Metered complete utility interfaces"
      raw_fields: "meter; service; unit; pressure/temperature; gas wet/dry actual/standard; composition; steam dryness/enthalpy; condensate; cooling stocks/purge/drift/evaporation; provider boundary"
      collection_method: "Submeter all included stages and shared services; reconcile full physical utilities and separate attributable producer demand"
      unit: "kg; kWh"
      frequency: "Each batch, transfer and stock cutoff"
      temporal_coverage: "Same cohort and complete period including startup/shutdown and old-cohort services"
      site_scope: "Complete selected plant stages and shared interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, signed raw records, method applicability, genealogy and provider/receiver evidence"
    - protocol_id: cp_waste
      process_id: "acid_amidation"
      flow_role: "aqueous_distillate; nma_heels; cleaning_wastewater; offspec_dmac; spent_packing; removed_nails; cooling_blowdown"
      record_type: "Whole actual waste transfer and distinct provider demand"
      raw_fields: "physical event id; full wet transfer kg; nested substrate/liquor/solid/water; lot history; receiver; treatment technology; provider unit/demand; disjoint cohort assignments; actual remaining stocks"
      collection_method: "Weigh actual receiver exports, preserve nested components once and separately reconcile non-overlapping modeled treatment/service quantities"
      unit: "kg"
      frequency: "Each batch, transfer and stock cutoff"
      temporal_coverage: "Same cohort and complete period including startup/shutdown and old-cohort services"
      site_scope: "Complete selected plant stages and shared interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, signed raw records, method applicability, genealogy and provider/receiver evidence"
    - protocol_id: cp_air
      process_id: "acid_amidation"
      flow_role: "dmac_air; dma_air; acid_air; nma_air; water_air; nitrogen_air"
      record_type: "Final species emission and gas-state records"
      raw_fields: "outlet; stage; species; concentration; gas volume; time; temperature/pressure; wet/dry basis; condensation/recovery; background/blank; method matrix and detection limit; variability"
      collection_method: "Use actual applicable outlet tests and measured flow/time; distinguish captured streams, vapor/liquid phases and internal returns; no workplace-to-stack conversion"
      unit: "kg"
      frequency: "Each batch, transfer and stock cutoff"
      temporal_coverage: "Same cohort and complete period including startup/shutdown and old-cohort services"
      site_scope: "Complete selected plant stages and shared interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, signed raw records, method applicability, genealogy and provider/receiver evidence"
    - protocol_id: cp_assets
      process_id: "acid_amidation"
      flow_role: "iron_nails; ceramic_rings; spent_packing; removed_nails"
      record_type: "Complete asset/material fleet and environmental service history"
      raw_fields: "item/lot; whole mass; dimensions/material; new receipts; unused/in-service opening/closing; dissolution; physical removal/receiver; measured use; retained contamination; original cohort Q; provider/history boundary"
      collection_method: "Keep full physical fleet closure separate from environmental service vectors; actual contamination crosses with its whole waste once, no assumed lifetime or duplicate manufacturing"
      unit: "kg"
      frequency: "Each batch, transfer and stock cutoff"
      temporal_coverage: "Same cohort and complete period including startup/shutdown and old-cohort services"
      site_scope: "Complete selected plant stages and shared interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, signed raw records, method applicability, genealogy and provider/receiver evidence"
    - protocol_id: cp_quality
      process_id: "acid_amidation"
      flow_role: "finished_dmac; acetic_acid; dimethylamine"
      record_type: "Batch analytical identity and method basis"
      raw_fields: "sample/lot; actual contracted grade; calibrated GC chromatograms; method-matched DMAC/DMA/acid/DMF assay; KF water; same-basis convention; calibration/blank/replicates; signed release"
      collection_method: "Apply the documented actual grade method and retain raw evidence; source supplier specification is not a measured composition or universal analytical convention"
      unit: "%; kg"
      frequency: "Each batch, transfer and stock cutoff"
      temporal_coverage: "Same cohort and complete period including startup/shutdown and old-cohort services"
      site_scope: "Complete selected plant stages and shared interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, signed raw records, method applicability, genealogy and provider/receiver evidence"
  calculation_rules:
    - id: cohort_amounts
      applies_to: "all inventory rows"
      rule: "Q = sum(m_first,e) over unique first-accepted whole-product events, Q>0. a_j = A_j,new / Q; A_j,new is the evidenced attributed exchange or separate environmental-service vector, never replacement of full physical records. Old-cohort a_j,old=A_j,old/Q0; without positive known Q retain raw totals only."
      inputs:
        - cp_acceptance
        - cp_material
        - cp_utility
        - cp_waste
        - cp_air
        - cp_assets
      output: "Amounts per reference flow and independent full physical ledger"
      source_ids: []
    - id: acceptance_bridge
      applies_to: "finished_dmac"
      rule: "Independently check Q = D_net + S_accepted + L + X using disjoint externally retained net delivery, every on-site accepted state, irreversible loss and other terminal dispositions on original acceptance basis. Gross loops do not increase Q; lost water is not restored to survivors and counted again."
      inputs:
        - cp_acceptance
        - "event genealogy"
      output: "Reconciliation residual, not Q definition"
      source_ids: []
    - id: stocks_and_history
      applies_to: "all inventory rows"
      rule: "For each stage reconcile opening physical stock + external receipts + actual formation = closing stock + external exports + actual consumption, cancelling paired internal transfers. Inherit own foreground WIP burdens once by genealogy; never add provider aggregate demand to its already expanded same-boundary inventory."
      inputs:
        - cp_material
        - cp_utility
        - cp_waste
        - cp_assets
        - "lot histories"
      output: "Physical residuals and distinct inherited vectors"
      source_ids: []
    - id: reaction_and_water
      applies_to: "all inventory rows"
      rule: "CH3COOH+(CH3)2NH→CH3CON(CH3)2+H2O identifies only the principal reaction; use actual extents and side reactions, no default conversion. Reconcile total mass, C/H/N/O, iron, liquid/vapour water and energy separately; reacting species are not individually conserved and no balancing plug is invented."
      inputs:
        - cp_material
        - cp_utility
        - cp_waste
        - cp_air
        - cp_quality
      output: "Separate material, elemental, water and energy residuals"
      source_ids:
        - solutia-dmac-2000
    - id: whole_waste_service
      applies_to: "all inventory rows"
      rule: "Record each actual receiver whole wet waste event once, with substrate/liquor/solids/water as nested components. The sum of non-overlapping treatment-service demand by original cohort equals actual receiver/provider demand; allocation does not reduce actual exports or charge a full event to every cohort."
      inputs:
        - cp_waste
        - cp_assets
        - "receiver demand"
        - "original Q"
      output: "Whole physical transfers and separate cohort treatment vectors"
      source_ids: []
    - id: asset_service
      applies_to: "iron_nails; ceramic_rings; spent_packing; removed_nails"
      rule: "Full unused/in-service opening + new receipts = closing + actual removals + evidenced dissolution/consumption. Retain actual dimensions, material and history; assign environmental service by measured original-cohort use, without assumed lifetime, item mass or duplicate manufacturing demand."
      inputs:
        - cp_assets
        - cp_waste
        - "material and provider histories"
      output: "Complete physical fleet and separate environmental service"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Meet Section5 whole-product and actual material/provider/grade/phase/destination admission; absent core identity prevents use."
      evidence: "Complete native records, contracts, actual methods and receiver records"
    - id: dq_methods
      applies_to: "all inventory rows"
      requirement: "Retain actual applicable methods, calibration, chromatograms, water and species/gas bases; source cases do not replace measurements."
      evidence: "Original methods, calibration, GC/KF records and detection limits"
    - id: dq_history
      applies_to: "all inventory rows"
      requirement: "Keep complete raw/WIP/FG/asset/waste physical quantities separate from environmental vectors; inherit burdens once."
      evidence: "Cutoffs, genealogy, receiver and non-overlapping provider boundaries"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Every actual conditional stream needs quantity or evidenced inapplicability; unknown/not-detected/unmeasured is not zero; missing provider/method is never silently skipped."
      evidence: "Complete process reconciliation, method coverage, unresolved issues and uncertainty"
validation_rules:
  - rule_id: validate_admission
    applies_to: "all inventory rows"
    rule: "Check complete Section5 native identity, actual grade/route, whole feeds and boundary conditions; metadata35499 alone does not determine identity and DMF/NMP never substitute for DMAC."
    source_ids:
      - iarc-dmac-2020
      - un-cpc3-2025
  - rule_id: validate_accounting
    applies_to: "all inventory rows"
    rule: "Check unique first-acceptance Q, all disjoint terminal states, old Q0, actual raw/WIP/FG/asset stocks, whole receiver waste transfers and non-overlapping treatment demand."
    source_ids: []
  - rule_id: validate_chemistry
    applies_to: "all inventory rows"
    rule: "Check the supported water-forming acid/DMA route, actual side reactions and separate total/element/water/energy ledgers; import no ester-route methanol and do not add reaction water as purchased water."
    source_ids:
      - solutia-dmac-2000
  - rule_id: validate_measurements
    applies_to: "all inventory rows"
    rule: "Check actual GC/KF convention, actual/standard wet/dry gas bases and final-outlet sampling applicability; occupational concentration is not a factory emission rate or default factor."
    source_ids:
      - eastman-dmac-t51093
      - iarc-dmac-2020
      - eu-cww-2016
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "If core identity, an essential method, actual producer demand or non-overlapping material relationships remain unresolved, retain raw records and an unresolved conclusion; projection/finite measurement checks and this candidate methodology do not confer scientific approval."
    source_ids: []
