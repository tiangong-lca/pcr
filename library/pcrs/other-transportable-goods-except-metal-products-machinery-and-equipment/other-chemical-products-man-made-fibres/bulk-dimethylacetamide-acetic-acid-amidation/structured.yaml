system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "This method covers whole unformulated industrial N,N-dimethylacetamide (DMAC), CAS 127-19-5, made from glacial acetic acid and anhydrous dimethylamine through dimethylammonium acetate formation, heat-driven water-forming dehydration, amine/acid recovery and fractional purification. The selected configuration retains the scrubber/condensers, pressure-controlled reactor and reactor column, acid-removal/recycle system, heels column and pan dryer described in Solutia WO2000073251A1, including actual iron conditioning and actual ceramic packing when used. It includes final tanks and bulk transfer. Heating is supplied as purchased steam and electricity; the water-cooled configuration includes its actual cooling loop and demand. No on-site combustion or off-gas incinerator is included in this bounded configuration. It is eligible only with genuine linked utility production and actual final-release interfaces; a plant that operates those additional operations needs their full inventories and a revised boundary before using this method."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "The bound native Product is precisely N,N-Dimethylacetamide. Its full record has no CAS/formula, fixed assay, manufacturing-route or geography field; the precise compound name and liquid-solvent description agree with IARC identification, not with DMF or NMP. Preserve the native CPC 35499 countermetadata and the mistranslated Chinese aprotic-solvent comment without rewriting them. Applicability instead follows the verified chemical identity and the CPC 3.0 35220 acyclic-amide boundary, with actual supplier, grade, impurities, water, site and route admission. The whole commodity must be unformulated DMAC liquid; arbitrary mixed solvent, polymer solution or waste cannot inherit this UUID. Native identity supplies neither a quantity nor a qualified background provider."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "The net principal acid route is CH3COOH + (CH3)2NH → CH3CON(CH3)2 + H2O. This is a reaction identity, not a default yield or per-kg recipe. Retain actual salt inventory, conversion, side products, feed water and independent total/C/H/N/O balances. Monomethylacetamide can concentrate in heels; actual iron and impurities require their own component ledgers. Reacting acid/DMA and generated water are not individually conserved species. No methanol-forming methyl-acetate route, acetic anhydride, acetyl chloride, DMF carbonylation, polymer formulation or waste-solvent regeneration is included. Source case temperatures, pressures, conversion improvements, ratios and purity claims are not default ranges or an environmental advantage."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "Fix first acceptance after final refining and quality release as the reference event. Independently sum unique accepted whole-product net masses into Q, excluding all tare; lock each original cohort. Gross dispatch, return, rework, retest and repeated release never create another acceptance. Reconcile Q on its original acceptance basis against disjoint net externally retained delivery, all on-site accepted states, irreversible loss and other terminal disposition. Returned-inspection/rework stocks are actual states. If accepted water evaporates, retain the actual survivor and the lost accepted portion once; do not restore survivor mass and add loss again. Added water/contamination is a separate exchange, not accepted material. Old-cohort service uses its original Q0; zero or unknown Q leaves raw totals and an unresolved result."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "Maintain complete raw-material, salt liquor, reactor, reflux, intermediate distillate, heels, pan-dryer, final-tank and returned-product physical stocks and internal transfers at each cut-off. Keep their own accumulated foreground/WIP burdens with lot genealogy; carry inherited amounts once into the released cohort and retain closing unaccepted WIP burdens with WIP. Actual provider aggregate demand and expanded/embedded inventories of the same upstream boundary are alternatives, never additive histories. Distinguish full physical receipt/export quantities from environmental-service/burden vectors. Every waste event retains the full actual contaminated receiver transfer, including substrate, liquor, solids and water once; nested composition is not another exported waste. Several cohorts may share one physical event, but their non-overlapping modeled treatment demands must sum to the actual provider demand. Allocation never turns a full shared export into a smaller physical export or charges the full event to every cohort."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "Keep the complete steam/condensate mass and enthalpy interface and cooling-water make-up, return, blowdown, drift and evaporation ledger. State whether gas flow is actual/standard and wet/dry and preserve measured temperature, pressure, composition and conversion; no assumed density. Process heat from electricity or steam is not imported twice. External generation and treatment need compatible real producer datasets and measured service demand; missing providers/burdens are unresolved, not zero. Scope expansion is required for actual fuel combustion, oxidizers, additional reagents, disposable packaging or different feeds. For each newly included operation preserve all atomic species and whole physical waste/packaging interfaces; an isolated CO2 card cannot stand for a burner."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "Declare actual contracted assay and impurity limits and complete analytical convention; no default grade, dose, energy or yield is imposed. Eastman T51093 is one commercial specification whose reported DMAC purity is percentage GC purity minus percentage water, with separate GC acidity/alkalinity/DMF and Karl-Fischer water tests. Percentage points on the same basis are not a second dry-fraction correction. This supplier convention is not automatically transferable to another assay. Retain batch calibration, raw chromatograms, water method/matrix applicability and release records. IARC workplace air sampling is not a stack emission-rate method; actual vent loads require matrix-compatible concentration and gas-flow measurements, recovery/condensation checks, variability, limits and final outlet identity. No workplace exposure number or source example becomes a plant emission factor."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "This supplier QC/release index is not automatic evidence of a calibrated DMAC mass fraction. Equal percentage scales do not establish equal GC response or water/dry bases; demonstrate calibration and basis compatibility before using a reported percentage in component or elemental mass ledgers. The whole supplied reference mass remains unchanged."
      source_ids: []
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "solutia-dmac-2000; eastman-dmac-t51093; iarc-dmac-2020; eu-cww-2016; un-cpc3-2025"
      source_ids: []
