    used_for: "Explicit historical35499–HS2007 3802.10 relationship, distinct from current evidence; not a current crosswalk."
  - id: "wco-hs2022-38"
    type: "official_guidance"
    reference: "WCO,HS2022 Chapter38,complete chapter notes and heading3802/3802.10,PDF1–3. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0638_2022e.pdf?la=en"
    used_for: "Current activated-carbon heading versus other activated mineral/animal-black branch; no individualCPC3 ruling or process factor."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC,ILCD Handbook,Detailed Guidance,FirsteditionMarch2010,§7.9.3,printed257–258/PDF277–278. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
