allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "foreground_burden_allocation"
    rule: "Use subdivision/direct assignment before allocation. Remaining common-process environmental exchanges need demonstrated determining physical causality separately for each exchange and function; only residual multifunctionality without that relation may use justified condition/gate-matched market values with sensitivity. Keep full physical gas/char/co-product/waste quantities independent of shares. Internal heat recovery, disposal, packaging returns or source claims do not create automatic cofunctions or avoided burdens."
    source_ids:
      - ilcd-allocation-2010
      - gu-wood-carbon-2018
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "carbon_line"
      flow_role: "Finished grade and first event"
      record_type: "unnormalized actual records"
      raw_fields: "lot; eventID; netwholekg; tare; moisture; ash; particle method; grade; biomass origin; steam route; finishing; original IDs"
      collection_method: "Quality officer: calibrated whole-lot net weighing after actual completed finishing and grade acceptance; traceable representative moisture/ash/particle sampling with actual methods and uncertainty. Establish native whole-material/state fit and lock original events, not shipment totals."
      unit: "kg"
      frequency: "each event/lot; continuous readings and complete stock period"
      temporal_coverage: "all matched manufacture and original-cohort history including failed/zero-output"
      site_scope: "actual line, suppliers and all complete linked producers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/method/samplingQA; original tickets; actual composition/state; full genealogy; uncertainty and gaps"
    - protocol_id: cp_materials
      process_id: "carbon_line"
      flow_role: "Whole feed and preparation records"
      record_type: "unnormalized actual records"
      raw_fields: "lot; supplier; whole feedkg; drysolid; water; ash; treatment; origin; stock; blend genealogy; actual grade constituents; internal transfers"
      collection_method: "Materials accountant/laboratory: retain full raw receipts, supply form, assays and stock movements without replacing whole mass by fixed carbon. Every actual whole supplied preparation or separately purchased ingredient is recorded once; preserve supplier/on-site processing and embedded history."
      unit: "kg"
      frequency: "each event/lot; continuous readings and complete stock period"
      temporal_coverage: "all matched manufacture and original-cohort history including failed/zero-output"
      site_scope: "actual line, suppliers and all complete linked producers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/method/samplingQA; original tickets; actual composition/state; full genealogy; uncertainty and gaps"
    - protocol_id: cp_utilities
      process_id: "carbon_line"
      flow_role: "Actual utilities and complete producer links"
      record_type: "unnormalized actual records"
      raw_fields: "meters; rawkWh/MJ; gasvolume/state/composition/Z; fuel; steamkg/P/T/quality/enthalpy; condensatekg/state; heat; water; all failed/idle loads; provider units"
      collection_method: "Utilities engineer: calibrated gross supply/return readings over matched complete operations, recovery/controls, standby and start/stop. Match extensive units and actual state; kWh×3.6 only converts electricity. Retain complete actual steam/combustion/control producer burdens and losses without assumed fuel efficiency."
      unit: "kg; m3; kWh; MJ"
      frequency: "each event/lot; continuous readings and complete stock period"
      temporal_coverage: "all matched manufacture and original-cohort history including failed/zero-output"
      site_scope: "actual line, suppliers and all complete linked producers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/method/samplingQA; original tickets; actual composition/state; full genealogy; uncertainty and gaps"
    - protocol_id: cp_streams
      process_id: "carbon_line"
      flow_role: "Reactive physical streams and producer handovers"
      record_type: "unnormalized actual records"
