  calculation_rules:
    - id: event_q
      applies_to: "reference/original cohort"
      rule: "Q=sum of unique original first-acceptance whole net masses at one fixed completed-grade gate; lock original moisture/ash basis and eventIDs, never new manufacture from returns/retests/repacking."
      inputs:
        - cp_acceptance
        - cp_cohorts
      output: "originalQ and physical event ledger"
      source_ids:
        - calgon-acticarbone-2017
    - id: attributable_vector
      applies_to: "manufacture and later service"
      rule: "Actual opening own-WIP history plus all incurred matched loads, less substantiated closingWIP carry and distinct dispositions, forms attributableA; later services retain original cohorts/Q; full physical stocks and providerQt do not change with burden shares."
      inputs:
        - cp_materials
        - cp_utilities
        - cp_streams
        - cp_assets
        - cp_pack
        - cp_cohorts
      output: "per-exchange attributableA and nonoverlap evidence"
      source_ids:
        - ilcd-allocation-2010
    - id: normalize_once
      applies_to: "all modeled exchanges"
      rule: "Divide evidenced attributableA in compatible provider units by original positiveQ once; finished_carbon isQ/Q=1kg. Qt/Qanalysis orPg/Qanalysis/Bt/Qanalysis are independent physical displays, not automatic service demand. Zero/unknownQ retains raw amounts and unresolved results."
      inputs:
        - A
        - Q
        - cp_cohorts
      output: "modeled amounts per1kgreference and separate physical display"
      source_ids:
        - ilcd-allocation-2010
    - id: reactive_balance
      applies_to: "physical/element/phase/energy"
      rule: "Independently reconcile whole C/H/O/N/S/ash, water-phase and energy ledgers with actual reactant consumption/product generation, internal loops and genuine external exits. Use matched concentration×integrated gasvolume or integrate rates once; no residual/theoretical-chemistry/COD/combustion-proxy invention of missing species/yield."
      inputs:
        - cp_streams
        - cp_species
        - cp_materials
        - cp_utilities
        - cp_waste
      output: "physical/reaction/water/energy ledgers and uncertainty"
      source_ids:
        - gu-wood-carbon-2018
        - vilen-activated-carbon-2022
        - epa-method320
        - epa-method5
        - epa-method3c
        - doe-permanent-gases-1990
    - id: custody_bridge
      applies_to: "packaging/assets/wastes"
      rule: "Whole opening+actual receipts/additions/genuine returns=whole closing+actual supplied/supplier-returned/scrapped/other evidenced exits. Nested deposits remain in the actual whole receiver event. Model separate evidenced original-cohort service vectors, never physical mass scaled by shares or repeated whole treatment demand."
      inputs:
        - cp_assets
        - cp_pack
        - cp_waste
        - cp_cohorts
      output: "whole physical custody and nonoverlapping service bridge"
      source_ids:
        - calgon-acticarbone-2017
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: identity
      applies_to: "whole product and each actual interface"
      requirement: "Establish full native material/form/state/provider fit and retain powder/granule/equipment/source counterevidence; no component, categorycode or name-only substitution."
      evidence: "complete native admission and actual grade/provider evidence"
    - id: complete_producers
      applies_to: "all on-site and linked units"
      requirement: "Genuine complete manufacturing/gas-liquid/combustion/utility/control/waste interfaces; every real additional material/species needs a specific atomic row, without omission or assumedzero."
      evidence: "actual stream/equipment/meter maps, supplier/receiver and source-method limits"
    - id: three_ledgers
      applies_to: "all stocks/originalQ/attributed service"
      requirement: "Independent whole physical custody, unique firstevents and evidenced nonoverlapA/Q; own history and aggregate providers do not overlap."
      evidence: "cp_acceptance; cp_cohorts; cp_assets; cp_pack; cp_waste"
    - id: measurement_sources
      applies_to: "methods and quantities"
      requirement: "Retain actual matrix/sampling-point/species methods, full source scope and uncertainty; source pilot/engineered/proxy/omitted values are not defaults or validation acceptance."
      evidence: "method/calibration/blanks/detection evidence; complete sources and section9 conditions"
validation_rules:
  - rule_id: validate_native_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Check whole powder, actual wood/steam grade, fixedgate and all section9 conditions; retain genuine counterevidence and restrictions."
    source_ids:
      - calgon-acticarbone-2017
      - un-cpc3-introduction-2025
      - un-cpc3-2025
      - un-cpc21-2015
      - wco-hs2022-38
  - rule_id: validate_interface_chemistry
    applies_to: "foreground_dataset_conformance"
    rule: "Check genuine complete linked producers, reactiveG/C, phase/element/energy, final environmental location and methods; no pre-oxidizer data as final emissions."
    source_ids:
      - gu-wood-carbon-2018
      - vilen-activated-carbon-2022
      - epa-method320
      - epa-method5
      - epa-method3c
      - doe-permanent-gases-1990
  - rule_id: validate_original_events
    applies_to: "foreground_dataset_conformance"
    rule: "Check full stocks/history, disjoint originalQ0fates and once-onlyA/Q; whole contaminated waste/pack/asset transfers do not change with service shares."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_complete_context
    applies_to: "foreground_dataset_conformance"
    rule: "Both language projections must retain every full paragraph and source qualification below, not onlyIDs or short summaries."
    source_ids:
      - calgon-acticarbone-2017
      - gu-wood-carbon-2018
      - vilen-activated-carbon-2022
      - epa-method320
      - epa-method5
      - epa-method3c
      - doe-permanent-gases-1990
      - epa-activated-carbon-1977
      - un-cpc3-2025
      - un-cpc3-introduction-2025
      - un-cpc21-2015
      - wco-hs2022-38
      - ilcd-allocation-2010
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "This scope is manufacture of one actual unimpregnated wood-derived, physically steam-activated powdered carbon grade from supplied untreated woody feed through actual carbonization, activation, powder finishing, homogenization/formulation, final quality acceptance and actual packing. The source manufacturer offers separate chemical, acid-washed and mixed routes; they are not silently included. Every actual grade constituent, blend lot, finishing operation and auxiliary remains visible. A formulation box is not erased by calling the output pure carbon. An actual different additive or treatment requires its own specific atomic input and applicability review before the dataset can qualify."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "The native whole Product is Biochar-based powdered activated carbon / 生物炭基粉状活性炭, with a positive biomass-derived porous adsorbent definition, Mass/kg reference and no fixed CAS, recipe, activation route, supplier geography or supply-point restriction. It can admit this actual wood/steam/powder subtype only when the complete supplied material, grade, moisture, ash, phase, finishing and provider boundaries fit. Blank CAS or an unspecified SKU is not itself a blocker. This is not unactivated charcoal, elemental carbon used as a mixture component, a carbon-treatment service, a spent sorbent or an adsorption machine."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "Do not replace the reference with the Count-based Granular active carbon unit/颗粒活性碳装置 merely because its comment describes GAC. The other coal record has a powdered English name and a granular-body description plus a coal/steam route; preserve that source-specific inconsistency instead of borrowing it for wood powder. Generic activated carbon with Adsorption reaction/At the chemical plant qualifiers does not establish a manufacturing gate. None of these labels establishes pure carbon content or a universal kg-per-item relation."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "The narrower classification argument is explicitly a continuity inference: current CPC3 principles classify goods by actual physical nature and corresponding HS terms; current HS3802.10 names activated carbon; official CPC2.1 explicitly linked35499 to HS2007 3802.10. Current35499 retains its residual title and no activated-carbon-specific exclusion was found in the reviewed current notes. Activated natural mineral products/animal black and unactivated wood charcoal remain different named contexts. This is neither an official current individual ruling nor a claim that an old correspondence is current."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "The Calgon original distinguishes physically steam-activated powders from chemical powders, optional washing and other grades. Its complete physical branch includes wood preparation, carbonization, crushing, steam activation, grinding, storage, homogenization/formulation and packaging. Preserve actual site versus supplier responsibility. Its grade table, certification, typical properties and application illustrations supply no recipe, operating setting, yield, lifetime, environmental superiority or universal acceptance specification."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Gu2018 reports actual wood/biochar activation trials and a separate engineered commercial scale. Pilot electric heating and propane-heated steam, purge arrangements and measured flows are not interchangeable with the engineered gas-fired design. Upstream carbonization also produces syngas and char. Do not import source material fractions, equipment size, heat duties, emissions, mass-allocation shares or biogenic-neutrality conventions as defaults or claim that a measured pilot is the current manufacturer."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "Gu2018 measured reactor exhaust before the thermal oxidizer, not the final outdoor discharge. Its filterable-PM method and FTIR gaseous-analyte method have distinct scopes; FTIR cannot determine H2 or N2. The source separately collected samples for those gases. Actual sampling position, matrix, phase, species, detection and calibration must be established. A pre-control profile, total NOx/VOC or a dry filter mass cannot stand for all final species, wet mist or condensable material."
    source_ids: []
  - rule_id: validation_rule_12
    applies_to: "foreground_dataset_conformance"
    rule: "Vilén2022 is substantive contrary environmental evidence, not a complete interchangeable factory inventory. It reports proxy combustion emissions for some carbonization/activation inventories, assumed heat sufficiency, omitted start-up or transport/wastewater/ash burdens and incomplete co-product information. Do not adopt these omissions, assumed zero residual-feed burden, scaled combustion profiles, source performance equivalence or unmeasured heat recovery. Retain every real incurred manufacturing, failure, zero-output, idle, start/stop and treatment burden."
    source_ids: []
  - rule_id: validation_rule_13
    applies_to: "foreground_dataset_conformance"
    rule: "Maintain the full actual wood-to-finished-powder scope. A separately modeled carbonization, steam, electricity, gas treatment, combustion or wastewater producer must have complete actual input/output, gas/liquid/solid composition, energy and waste interfaces with matched providers and units. It is not an assumed off-site disposal or paper receiving gate. A purchased whole char or preparation needs a genuinely compatible complete upstream boundary; it cannot erase source carbonization or be counted again with its already embedded history."
    source_ids: []
  - rule_id: validation_rule_14
    applies_to: "foreground_dataset_conformance"
    rule: "Actual combustion and thermal oxidation require each real fuel, air/O2, reaction products, generated/consumed water, nitrogen/sulfur/carbon species, heat and losses. Internal pyrolysis gas may supply energy but its real formation, whole transfer, combustion and controls remain; neither free energy nor an avoided virgin-fuel credit is assumed. Record reactive carbon consumption and gas formation/consumption independently from total mass and C/H/O/N/S/ash balances."
    source_ids: []
  - rule_id: validation_rule_15
    applies_to: "foreground_dataset_conformance"
    rule: "Separate supplied wood moisture, quench/makeup water, liquid nitrogen and vaporization, steam, internal condensate, external condensate returns, actual evaporation and reaction-water formation/consumption. Keep actual gas temperature, pressure, moisture, composition and compressibility before any volume/mass or heating-value conversion; no universal density or steam enthalpy. Internal loops cancel transfers only, retaining their real utility and loss burdens."
    source_ids: []
  - rule_id: validation_rule_16
    applies_to: "foreground_dataset_conformance"
    rule: "Identify every final environmental species, phase and medium after actual controls, including real fugitive/upset releases. Whole gas or wastewater sent to a complete producer is not the same material emitted again at the sending boundary. Collected condensate, separate dust and retained material inside contaminated waste remain different physical recipients. No COD, total VOC/NOx, ash estimate or fitted residual can invent a chemical species or close two unknowns. Unknown and below-detection are not zero."
    source_ids: []
  - rule_id: validation_rule_17
    applies_to: "foreground_dataset_conformance"
    rule: "Lock Q0 as the sum of unique first-acceptance events for net whole finished powder after actual full grade finishing at one fixed plant gate. Record actual moisture, ash, fineness/particle method, unimpregnated steam-grade state and tare independently. Q is not pure carbon mass, gross shipments or a second physical output. Returns, repacking, homogenization, rework and retesting of already accepted material create no new event; any old/new mixing must retain measured inlet genealogy and original cohort burdens."
    source_ids: []
  - rule_id: validation_rule_18
    applies_to: "foreground_dataset_conformance"
    rule: "Partition each original acceptance basis across disjoint net remaining deliveries, every actual on-site accepted state, irreversible losses and other terminal fates. Gross return loops cancel by original IDs. Delivery plus closing stock works only with no other states/exits. Later moisture, powder or finish gains/losses require measured component/state conversion; never restore lost mass to a survivor and also count that loss. Zero/unknown Q retains raw totals and an unresolved normalized result."
    source_ids: []
  - rule_id: validation_rule_19
    applies_to: "foreground_dataset_conformance"
    rule: "Keep complete raw/WIP/finished, blend, utility, asset and container physical stocks/transfers separate from acceptance events and attributable environmental/provider-service vectors. Opening own WIP carries its genuine full earlier burden once; closing WIP retains its substantiated burden for later cohorts. Include all incurred failed/zero-output/cleanup/rework loads. Aggregate provider inventories and decomposed versions of their same embedded history are exclusive. Later services retain original Q0, not another calendar-period denominator."
    source_ids: []
  - rule_id: validation_rule_20
    applies_to: "foreground_dataset_conformance"
    rule: "Actual reactors, mills, liners, filters and reusable bags have whole physical count/mass, dimensions, material, installed/spare/retired stocks and service histories. Distinct compatible provider-service demand may be allocated to original cohorts with evidence, but no guessed life, per-item mass or complete new asset charge per cohort. Repair/replacement and retirement are separate real events; an embedded capital service must not be purchased again as a component proxy."
    source_ids: []
  - rule_id: validation_rule_21
    applies_to: "foreground_dataset_conformance"
    rule: "Keep actual free and attached bag/liner/container stocks, raw-supply packaging receipts, purchases, supplied customer transfers, recipient returns, supplier/pool returns and scrap with original IDs. Product net mass excludes all external packaging/tare. Whole purchased bag BOM burdens are included once; separately purchased liners, pallets or other actual components require their own atomic row and physical bridge. A returned serviceable bag creates neither new manufacture nor product Q or a reuse credit."
    source_ids: []
  - rule_id: validation_rule_22
    applies_to: "foreground_dataset_conformance"
    rule: "A discarded contaminated filter, liner or bag is one actual whole receiver event containing substrate, retained carbon/liquor and water once. Nested components are not extra waste exports unless physically separated before the boundary. Record whole receiver/provider quantity Qt and composition independently from evidenced nonoverlapping per-cohort service demand A/Q. Analytical Qt/Qanalysis is not automatically every cohort’s treatment demand; a burden share never shrinks physical mass or charges full Qt repeatedly."
    source_ids: []
  - rule_id: validation_rule_23
    applies_to: "foreground_dataset_conformance"
    rule: "Illustrative arithmetic only, never a source default: one whole contaminated filter event of10kg contains8kg substrate and2kg retained carbon/liquid. An independently evidenced25%/75% service split gives2.5/7.5kg-equivalent compatible provider demand; at original Q100/200kg, these are0.025/0.0375kg-equivalent per reference. The receiver still gets10kg once. There is no2.5kg physical export, extra2kg contaminant waste, duplicate10kg demand, assumed share or lifetime."
    source_ids: []
  - rule_id: validation_rule_24
    applies_to: "foreground_dataset_conformance"
    rule: "Use subdivision/direct assignment before allocation. Remaining common-process environmental exchanges need demonstrated determining physical causality separately for each exchange and function; only residual multifunctionality without that relation may use justified condition/gate-matched market values with sensitivity. Keep full physical gas/char/co-product/waste quantities independent of shares. Internal heat recovery, disposal, packaging returns or source claims do not create automatic cofunctions or avoided burdens."
    source_ids: []
  - rule_id: validation_rule_25
    applies_to: "foreground_dataset_conformance"
    rule: "A declared kg of powder is a production reference, not proven equal adsorption service, drinking-water certification or medical efficacy. Actual physical/chemical grade, end use, provider units, methods, temporal/geographic applicability and full analytical uncertainty remain study qualifications. No source temperature, recipe, dose, power, yield, ash/moisture fraction, shipping amount, performance, lifespan or emission reduction is adopted as a default or acceptance range."
    source_ids: []
  - rule_id: validation_rule_26
    applies_to: "foreground_dataset_conformance"
    rule: "Every candidate inventory row applies only where its actual physical interface is present. Record present, evidenced absent, below detection and unknown states distinctly. Do not invent a fuel, purge, asset, bag, control or species to match a citation. Every genuinely additional reagent, material, equipment component, supplied packaging, waste or environmental species needs its own specific atomic interface and actual provider/unit before study use; a missing UUID or unmeasured quantity is never a basket or a zero."
    source_ids: []
  - rule_id: validation_rule_27
    applies_to: "foreground_dataset_conformance"
    rule: "For actual IR-active vapor species, EPA Method320 supplies extractive FTIR analysis with its full Protocol, reference spectra, interference checks, heated handling or validated conditioning, and analyte-spiking/recovery requirements; it does not cover homonuclear H2/N2/O2 or every particulate/liquid phase. EPA Method5 covers its defined filterable particulate sampling and recovery, not an assumed all-phase wet-mist total. EPA Method3C supplies GC-TCD analysis, component calibration/linearity, repeat analysis and wet/dry/dilution corrections for CO2/CH4/N2/O2 within its stated landfill/otherwise specified source scope; it does not measure H2 or automatically authorize activated-carbon stack sampling. Its collection cross-references and any dilution/background correction must fit the actual gas; real purge or combustion N2/O2 is not automatically contamination to subtract. DOE/ARCTECH March1990 Appendix6 supplies an actual permanent-gas GC-TCD separation, external component calibration and area-response procedure for H2/N2/CO/CH4/CO2, but its original sample collection is a different source matrix; the claimed example chromatogram is not visible on the retained final blank scans. These primary procedures establish analytical approaches, not automatic permission to transfer sampling or source settings. Actual hot/wet gas sampling, representative time/flow, conditioning and condensate losses, analyte separation, actual matrix recovery, reference-gas traceability, detection limits, final outlet location and uncertainty must be qualified for the study. Missing essential procedure or unestablished matrix/phase coverage remains an explicit methodological hold; ordinary site calibration/qualification cannot be represented as already passed. No original instrument, calibration-mixture or operating value is a default."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual matched whole wood-derived steam-powder manufacture and original-cohort services with complete qualified data/providers"
  excluded_use: "Full35499; equal adsorption service, food/medical/certification, unreviewed actual route/state or spent regeneration"
  required_metadata: "All ordered qualifiers; actualsite/period/grade; full interfaces/originalQ/history/species/water/energy/provider boundaries"
  required_quality_disclosure: "Actual methods/sampling/uncertainty; specific unbound identities/provider units; source counterevidence and independent review/study states"
  update_trigger: "Feedstock,route,phase,grade,homogenization/formulation,gate,controls,utilities,packaging,provider or material new evidence changes"
data_sources:
  - id: "epa-method3c"
    type: "official_guidance"
    reference: "US EPA, Method3C,8/2/2017 internet copy,complete4pages. https://www.epa.gov/sites/default/files/2017-08/documents/method_3c.pdf"
    used_for: "CO2/CH4/N2/O2 GC-TCD analysis and calibration; source-scope/sampling/dilution limits retained; no H2 or universal stack-method approval."
  - id: "epa-method320"
    type: "official_guidance"
    reference: "US EPA, Method320,1/14/2019 internet copy including full FTIR Protocol. https://www.epa.gov/sites/default/files/2019-06/documents/method_320.pdf"
    used_for: "IR-active vapor analysis and actual matrix/conditioning/spike validation; no homonuclear-gas or all-phase inference."
  - id: "epa-method5"
    type: "official_guidance"
    reference: "US EPA, Method5,8/2/2017 internet copy,complete source. https://www.epa.gov/sites/default/files/2017-08/documents/method_5.pdf"
    used_for: "Defined filterable-PM sampling/recovery/calculation; no total wet mist or universal site method approval."
  - id: "doe-permanent-gases-1990"
    type: "literature"
    reference: "ARCTECH/US DOE, Biological Gasification of Coals,FinalReport,March1990,Appendix6 printed129–130/PDF148–149 only; retained full original. https://www.netl.doe.gov/sites/default/files/netl-file/Arctech-20140331-Biological-Gasification-Coals.pdf"
    used_for: "Environmental permanent-gas GC-TCD analysis/calibration procedure only; different source sampling matrix and absent example chromatogram retained. No biological production protocol or operating values adopted."
  - id: "calgon-acticarbone-2017"
    type: "literature"
    reference: "Calgon Carbon, Acticarbone/Anticromos brochure,2017, completePDF2/4/5. https://www.calgoncarbon.com/app/uploads/17116_CCC_8.5x11_Acticarbone2017_BrochureSingleWeb.pdf"
    used_for: "Real vegetal powdered product family and complete physical/chemical/washing/homogenization/packing alternatives; no numeric defaults or certification acceptance."
  - id: "gu-wood-carbon-2018"
    type: "literature"
    reference: "Gu et al., Life Cycle Assessment of Activated Carbon from Woody Biomass, Wood and Fiber Science50(3),229–243(2018),PDF4–9/printed232–237. https://research.fs.usda.gov/download/treesearch/56818.pdf"
    used_for: "Actual wood/biochar activation and source measurement scope; pilot versus engineered scale, pre-oxidizer gases, real utilities and syngas/char counterconditions; no LCIfactor/recipe/equivalence default."
  - id: "vilen-activated-carbon-2022"
    type: "literature"
    reference: "Vilén, Laurell and Vahala, Comparative life cycle assessment of activated carbon production from various raw materials, Journal of Environmental Management324,116356(2022),§§2.1–2.3/3.1–3.5. https://doi.org/10.1016/j.jenvman.2022.116356"
    used_for: "Independent environmental coverage and explicit proxy/omission/heat/co-product/biogenic assumptions as counterevidence, never copied zero cutoffs or factors."
  - id: "epa-activated-carbon-1977"
    type: "official_guidance"
    reference: "US EPA, Chemical Technology and Economics in Environmental Perspectives,TaskIV—Activated Carbon,EPA-560/2-77-002,February1977,printed7–9/PDF13–15. https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=91012EJI.TXT"
    used_for: "Historical physical-versus-chemical activation and distinct powder/granular product context; no current quantities, conditions or legal limits."
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD,CPC3.0 Explanatory Notes,30June2025,completePDF174 and actual neighboring categories. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Current35499 residual title; no accepted mapping or individual ruling."
  - id: "un-cpc3-introduction-2025"
    type: "official_guidance"
