system_boundary:
  rules:
    - rule_id: sb_received_inputs
      applies_to: "Foreground start"
      rule: "Include receipt, storage losses, and dosing of all ingredients, intermediates, packaging, fuels, and utilities; attach upstream datasets and supplier-to-plant transport when reporting cradle-to-gate impacts."
      source_ids:
        - epd-international-pcr-2019-14-v2-0-1
    - rule_id: sb_manufacturing_operations
      applies_to: "Factory operations"
      rule: "Include mixing, dispersion or milling, let-down, tinting, filtration, conditional thermal cooking, quality control, rework, filling, packaging, equipment cleaning, direct releases, and on-site waste handling when present."
      source_ids:
        - us-epa-ap42-6-4-1995
    - rule_id: sb_direct_releases
      applies_to: "Air, water, and waste releases"
      rule: "Record direct VOC, particulate, wastewater, coating residue, and other material releases after control, together with capture, abatement, and destination."
      source_ids:
        - eu-commission-2025-2607
        - us-epa-ap42-6-4-1995
    - rule_id: sb_use_end_of_life
      applies_to: "Factory-gate profile"
      rule: "Exclude application, service, maintenance, removal, and final end-of-life from the factory-gate dataset; include them only in a separately declared expanded study."
      source_ids:
        - jrc-145239-2026
    - rule_id: sb_cutoff_disclosure
      applies_to: "Completeness"
      rule: "Do not omit known hazardous constituents or direct releases solely because their mass is small; document every cut-off and apply the governing programme's completeness rules."
      source_ids:
        - epd-international-pcr-2019-14-v2-0-1
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "The native Paint UUID describes a liquid pigmented paint with a reference Mass property of 1; it does not establish identity for powder coatings, clear varnishes, every performance system or an arbitrary multi-component kit. Use this binding only when the declared configuration matches the complete native object; never change the product to fit the UUID. Other actual routes require an individually verified reference flow for the complete finished preparation, with its property, unit, physical form and delivery state; an unresolved core reference identity blocks use for that dataset. For multi-component products, record the components and proportions of the declared sold configuration: 1 kg is the sum of their net coating masses, not the mass of one active resin."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "Each dataset represents one declared product, formulation, site, period and actual route. The named cards below are conditional individual-exchange methods, not a common plant BOM or an assertion that all these chemicals are used; absence requires actual evidence of non-applicability. Expand every actual purchased ingredient, complete preparation, packaging item, fuel, steam supply, electricity input, cleaning agent, waste stream and emitted substance by its individual name, raw quantity and provider. One example cannot stand for other real exchanges, and a category label is never a selected flow. An unresolved UUID retains its concrete name and identity gap; do not invent one."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "For a purchased complete polymer emulsion, pigment paste, solvent mixture or coating preparation, record the whole as-received purchase once; its polymer, pigment, water and solvent contents are a non-additive composition subledger, not additional purchases. For on-site compounding, each separately purchased actual component is an individual exchange. Retain composition, concentration and aqueous phase with the raw records; do not force formulation water into powder routes or collapse 1K/multi-component/cooked routes into a water-borne sample. Track ordinary auxiliary-identity and provider gaps against affected rows; incompatible core reference identity, unknown key actual materials or missing routes block use for that dataset. Source scope does not establish a site recipe."
      source_ids: []
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "The protocols' aggregation_rule declares the final result basis, not an instruction to meter each kg separately. Retain the raw aggregation steps in collection_method and all raw_fields. Build a traceable cohort for the same product configuration, site, period and actual batches, retaining actual quantity Q: the kg net coating mass first released after completed filling/packaging and conformity to sale specification, excluding packaging. Q is not design capacity, material input, shipments or output inferred from an assumed yield. Newly accepted product in closing finished-goods stock is already in Q exactly once; do not add or subtract that closing stock again. Shipping opening finished goods, reaccepting returns or internal transfer does not create new production. Retain opening/closing raw-material, WIP and finished-goods stock and their historical burdens separately. Carry into the output cohort only its attributable opening-WIP burdens and carry forward closing-WIP burdens outside it; do not additionally deduct finished-goods stock from a Q that includes newly released closing finished goods. Retain actual packaging, handling, storage, cleaning and waste burdens."
      source_ids: []
    - rule_id: system_boundary_rule_10
      applies_to: "foreground_system_boundary"
      rule: "The raw numerator is the actual matched-cohort exchange total after evidenced return/recovery reconciliation and any necessary allocation; divide by actual Q once. Keep batch quantity ledgers rather than averaging batch ratios. Local QA ratios per bulk output, solvent charged or precursor input are not successive normalization divisors. Do not delete failed batches, zero-output runs, changeovers or shutdown cleaning: assign their burdens to the related cohort on an evidenced basis or retain a separate failure record. When Q=0, do not normalize per kg or erase burdens with zero values or invented output."
      source_ids: []
    - rule_id: system_boundary_rule_11
      applies_to: "foreground_system_boundary"
      rule: "Record physical flow V at its actual state, unit and quantity; record burden attribution A and causal allocation factors separately, without scaling physical outputs to force burden allocation. Check each provider's product/waste type, property/unit, technology, geography, gate, phase and period. A unit-group conversion is not density or composition evidence. Reconcile intermediate receipts/transfers within process accounts and cancel them in the consolidated site account; do not subtract final product, internal transfers and stock change twice. Retain closure gaps and raw reconciliation, never infer unidentified emissions from residual mass or claim closure has been achieved."
      source_ids: []
    - rule_id: system_boundary_rule_12
      applies_to: "foreground_system_boundary"
      rule: "Expand aqueous and thermal exchanges only for the real configuration. Keep solids/wet/dry mass and solvent subledgers separate. Record actual cooling-water makeup and discharge, cleaning water, reaction water, condensate and water vapour individually by phase/destination; not every cooked route forms water or uses steam. Actual thermal reactions require species, reaction and operating evidence. For real on-site combustion retain each fuel, oxidant, emitted substance and control burden; electric or externally supplied heat does not imply on-site combustion. Include actual powder extrusion, cooling, grinding and sieving within formulation_dispersion. Reconcile separately produced/packed multi-component quantities and proportions to the real sold configuration. Keep manufacturing gates separate from downstream application/curing."
      source_ids: []
    - rule_id: system_boundary_rule_13
      applies_to: "foreground_system_boundary"
      rule: "Verify medium-voltage electricity against actual voltage, region and provider; a previously unresolvable identifier is not unit evidence. Confirm manufacturing rejects and cleaning residue individually by composition, form and treatment gate rather than using a flow described as application overspray/sludge/spent filters. The wastewater UUID is only a conditional physical locator for whole liquid-stream mass if source-owner/provider and actual receiving evidence establish the intended untreated handover interface. Its native Secondary/Tertiary Treatment label leaves that interface unestablished by the label alone: it proves neither the pre-treatment generation gate nor an already-treated effluent state. Record actual collection stage, composition, density, treatment acceptance and compatible provider before using the binding; otherwise verify a different compatible interface. It is not a direct elementary discharge; no generic kg-to-m3 substitution is allowed."
      source_ids: []
    - rule_id: system_boundary_rule_14
      applies_to: "foreground_system_boundary"
      rule: "Xylene on each VOC card is only a conditional individual substance exchange; expand other real emitted substances by species, gas/water phase, receiving compartment and post-control quantity. Reconcile their sum with total-VOC QA without adding the sum indicator as another release. The titanium-dioxide particulate card likewise cannot represent all dust; confirm particle size, composition and air compartment. In the VOC balance, product retention, recovery, shipped waste, control destruction and stock are mutually exclusive fates. Capture alone is not a final fate: do not deduct it again when already assigned to recovery/waste/stock. Record real combustion/control products separately; destroyed VOC is not disappearance of total mass. Total VOC, COD, closure residuals or historical factors cannot fabricate speciated quantities."
      source_ids: []
