allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "First subdivide or meter directly; for remaining multifunctionality, document whether system expansion fits the goal, background model and governing programme. Where allocation cannot be avoided use real physical causality, otherwise justify and test another relationship such as economic allocation. VOC or material balances establish physical reconciliation, not an economic/co-product allocation basis. Retain physical flows separately from burden attribution."
    source_ids: []
  - rule_id: al_avoid
    applies_to: "Shared operations and utilities"
    rule: "First avoid allocation through batch segregation, submetering, or process subdivision."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-handbook-2010
  - rule_id: al_internal_rework
    applies_to: "In-specification closed-loop rework"
    rule: "Keep internal rework inside the foreground system; do not create a co-product credit, and reconcile its mass without double counting fresh input."
    source_ids:
      - mass-balance-identity
      - jrc-ilcd-handbook-2010
  - rule_id: al_saleable_coproduct
    applies_to: "Multiple saleable outputs"
    rule: "Use a documented physical causal relationship where it represents resource use; use economic allocation only when no defensible physical relationship exists and disclose prices, period, and sensitivity."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-handbook-2010
  - rule_id: al_waste_recovery
    applies_to: "Waste, recovered solvent, and recovered packaging"
    rule: "Model treatment burdens and any credits under the governing programme; disclose system expansion, substitution, or cut-off and never treat avoided waste as negative foreground input."
    source_ids:
      - iso-14044-2006
      - epd-international-pcr-2019-14-v2-0-1
      - jrc-ilcd-handbook-2010
  - rule_id: al_shared_site_energy
    applies_to: "Shared site electricity and heat"
    rule: "Allocate by metered equipment consumption or causal runtime and load; mass allocation is allowed only with justification and sensitivity for materially different routes."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-handbook-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_materials
      process_id: "formulation_dispersion"
      flow_role: "formulation ingredients"
      record_type: "batch issue and return record"
      raw_fields: "material ID, lot, gross issue, return, density, solids; actual solids/NV definition and measurement method; test state and conditions; supplier/formulation reference compatibility; separate carrier-water and retained-volatile-liquid contents; operational residue/interference uncertainty"
      collection_method: "ERP issue and calibrated scale; volume conversion only with measured density; obtain actual compatible solids/NV method and condition evidence, keeping the whole wet issue, NV fraction, water and retained volatile carrier separate rather than assuming carrier removal or curing; raw cohort aggregation: sum net issues by material and product family"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "purchase ledger, batch sheet, scale calibration; actual method/test-state records, supplier/formulation compatibility and residue/interference uncertainty evidence"
    - protocol_id: cp_formulation_energy
      process_id: "formulation_dispersion"
      flow_role: "electricity"
      record_type: "meter and equipment log"
      raw_fields: "meter start, meter end, runtime, load, product family"
      collection_method: "submeter; otherwise reconciled site meter with causal allocation; raw cohort aggregation: sum direct readings; allocate documented shared remainder"
      unit: "kWh"
      frequency: "batch or monthly"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration, energy reconciliation"
    - protocol_id: cp_batch_outputs
      process_id: "formulation_dispersion"
      flow_role: "bulk output and residue"
      record_type: "batch yield record"
      raw_fields: "released mass, retained sample, rework, residue, stock change"
      collection_method: "calibrated scale and batch reconciliation; raw cohort aggregation: mass-weighted aggregate by product family"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "release record, waste record, mass balance"
    - protocol_id: cp_process_emissions
      process_id: "formulation_dispersion"
      flow_role: "VOC and particulate release"
      record_type: "monitoring and material balance"
      raw_fields: "solvent charged, solvent retained, recovery, waste, capture, control, measured concentration, gas flow ; actual dry mass H, species/size, f_loss/G evidence, hood/duct/device topology, matched bypass/inlet/outlet PM and gas flow, C, D, recovered-solids wet/dry masses and destination"
      collection_method: "compliant monitoring or documented mass balance; raw cohort aggregation: sum pollutant mass after control; keep routes separate ; for modelled PM establish pre-capture G, capture-to-inlet C and captured-stream removal D, retain uncaptured and treated-outlet branches on matched species/size/period, and retain measured total-release alternatives; do not apply efficiencies again to already controlled amounts"
      unit: "kg"
      frequency: "campaign and reporting period"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant and emission point"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "monitoring report, control log, balance reconciliation ; capture-network diagram, paired-stream measurements, dry-basis/generation evidence, recovered-solids and destination/provider ledgers"
    - protocol_id: cp_thermal_batch
      process_id: "thermal_cooking"
      flow_role: "precursors and cooked intermediate"
      record_type: "batch record"
      raw_fields: "precursor issue, return, intermediate output, residue"
      collection_method: "calibrated scale and batch reconciliation; raw cohort aggregation: sum net input and output by route"
      unit: "kg"
      frequency: "each thermal batch"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "batch sheet, scale calibration, mass balance"
    - protocol_id: cp_thermal_energy
      process_id: "thermal_cooking"
      flow_role: "fuel and heat"
      record_type: "meter and fuel record"
      raw_fields: "fuel mass or volume, net calorific value, heat meter, runtime; steam mass, supply/return pressure, temperature, enthalpy and phase ; independent supply and each actual return/discharge/vent mass (kg), matched period/meter boundary, common enthalpy reference and property source, each leg specific enthalpy (kJ/kg) and quality where needed, opening/closing carrier mass and stored energy, actual other energy transfers, supplier-native reference quantity/property/unit/gate and coverage"
      collection_method: "Calibrated meters and actual fuel specification; NCV conversion applies only to actual fuels, not steam, supplied heat or hot water. For carriers use boundary-matched calibrated net-heat metering or each actual leg at one common enthalpy reference; m*(h_s-h_r) simplifies only evidenced matched equal masses, with other legs and storage reconciled separately. Raw cohort aggregation: sum converted fuel amounts and carrier boundary energy separately; summed kg*kJ/kg in kJ is /1000 to MJ once. Supplier-native billed/reference quantity is not automatically consumer useful duty; retain physical carrier-water and provider-coverage ledgers, counting provider production once."
      unit: "MJ"
      frequency: "each batch or monthly"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration, fuel certificate ; independent leg mass/state records, property/common-reference source, equal-mass-shortcut evidence or per-leg/storage reconciliation, meter-boundary and provider-coverage evidence"
    - protocol_id: cp_thermal_emissions
      process_id: "thermal_cooking"
      flow_role: "route VOC"
      record_type: "monitoring and batch balance"
      raw_fields: "volatile input, retained mass, condensate, recovery, control, measured release"
      collection_method: "compliant monitoring or documented mass balance; raw cohort aggregation: sum release after control by route"
      unit: "kg"
      frequency: "campaign and reporting period"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant and emission point"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "monitoring report, batch balance"
    - protocol_id: cp_packaging_records
      process_id: "filling_packaging"
      flow_role: "bulk input, product output, and packaging"
      record_type: "filling and bill-of-material record"
      raw_fields: "bulk transfer, filled net mass, unit count, packaging issue, return, scrap"
      collection_method: "calibrated filler or scale plus inventory reconciliation; raw cohort aggregation: sum measured saleable net output and raw packaging by material"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "fill check, bill of materials, scale calibration"
    - protocol_id: cp_cleaning_inputs
      process_id: "cleaning_waste_management"
      flow_role: "water and solvent input"
      record_type: "cleaning-event record"
      raw_fields: "equipment, water, fresh solvent, recovered solvent, return"
      collection_method: "meter, weighed issue, and solvent log; raw cohort aggregation: assign directly to product campaign or documented shared cleaning driver"
      unit: "kg"
      frequency: "each cleaning event"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "cleaning log, meter calibration"
    - protocol_id: cp_cleaning_outputs
      process_id: "cleaning_waste_management"
      flow_role: "wastewater, residue, and VOC"
      record_type: "discharge, shipment, and balance record"
      raw_fields: "wastewater, solids, residue, recovery, solvent issued, solvent returned, VOC control"
      collection_method: "discharge meter, weighed shipment, and solvent balance; raw cohort aggregation: sum by destination and product family; reconcile recovery"
      unit: "kg"
      frequency: "each event and reporting period"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "manifests, discharge report, solvent balance"
  calculation_rules:
    - id: calc_normalize
      applies_to: "All foreground exchanges"
      rule: "normalized amount = matched raw cohort exchange total / actual net released quantity Q; apply once only"
      inputs:
        - "raw cohort exchange total"
        - "actual net released quantity Q"
        - "stock and historical-burden reconciliation"
      output: "amount per kg net product"
      source_ids:
        - mass-balance-identity
    - id: calc_material_balance
      applies_to: "Each production route"
      rule: "closure gap = actual inputs to the declared control volume - outward outputs - recorded wastes - recorded releases - stock increase within that volume; process accounts include boundary intermediates, consolidated site accounts cancel internal transfers"
      inputs:
        - "wet-mass inputs"
        - outputs
        - wastes
        - releases
        - "stock change"
      output: "absolute and percentage closure gap"
      source_ids:
        - mass-balance-identity
    - id: calc_voc_balance
      applies_to: "VOC release"
      rule: "VOC release = volatile input - VOC retained in product - recovered solvent - solvent in shipped waste - destroyed VOC mass - justified stock increase; use mutually exclusive fates and do not additionally deduct capture already represented in another fate"
      inputs:
        - "solvent and volatile-component balance"
      output: "kg VOC after control"
      source_ids:
        - us-epa-ap42-6-4-1995
        - mass-balance-identity
        - us-epa-eiip-coating-2005
    - id: calc_pm_release
      applies_to: "Particulate release"
      rule: "G = H*f_loss; H is actual dry mass handled on the documented species/particle-size basis; f_loss is the site-qualified fraction generating airborne PM before capture, not an already controlled release fraction. Only for documented uncaptured-to-air and capture-to-one-removal-device branches: C is the fraction of G routed to that device inlet; D is the fraction removed from that captured stream in the device; released particulate = G*(1-C) + G*C*(1-D) = G*(1-C*D). Account for other actual branches and serial-device inlet/removal relationships instead of assuming a universal topology."
      inputs:
        - "actual dry mass handled H"
        - "generation fraction f_loss and G evidence"
        - "capture-to-inlet fraction C"
        - "removal-on-captured-stream fraction D"
        - "actual species/size/period and topology"
      output: "kg particulate release"
      source_ids:
        - us-epa-ap42-6-4-1995
        - us-epa-eiip-coating-2005
        - us-epa-capture-systems
    - id: calc_shared_energy
      applies_to: "Shared energy"
      rule: "allocate reconciled shared energy by metered runtime and load or another documented causal driver; test material alternatives"
      inputs:
        - "meter total"
        - "direct readings"
        - "driver quantities"
      output: "process and product energy"
      source_ids:
        - iso-14044-2006
        - jrc-ilcd-handbook-2010
    - id: calc_service_conversion
      applies_to: "Comparative service"
      rule: "required product mass = declared area / coverage × density / applied fraction × maintenance multiplier for the declared study period; applied fraction is the fraction actually applied to the target surface (greater than 0 and at most 1), with compatible volumetric coverage and density; equivalent application mass per area = density / coverage"
      inputs:
        - area
        - "coverage or spreading rate"
        - "density where needed"
        - "applied fraction"
        - "maintenance cycle"
        - "study period"
      output: "kg product for equivalent declared service"
      source_ids:
        - jrc-145239-2026
  data_quality_requirements:
    - id: dq_technology
      applies_to: "Foreground route"
      requirement: "Data shall represent the declared water-borne, solvent-borne, powder, one-component, multi-component, or thermal route and its actual control technology."
      evidence: "process description, formulation family, equipment and control records"
    - id: dq_time
      applies_to: "Foreground data"
      requirement: "Use a representative continuous twelve-month period where available; explain shutdowns, campaigns, abnormal batches, and extrapolation."
      evidence: "dated batch, meter, purchase, waste, and production records"
    - id: dq_geography
      applies_to: "All datasets"
      requirement: "Identify plant country or region and use representative electricity, fuel, transport, water, and waste-treatment datasets."
      evidence: "dataset metadata and supplier or utility records"
    - id: dq_completeness
      applies_to: "Material and emission inventory"
      requirement: "Reconcile mass and energy, list omissions and cut-offs, and retain hazardous or environmentally significant constituents and releases. Before completing any solids/NV-dependent quantitative conversion, require the actual declared method/test state/conditions and compatible supplier/formulation basis; keep whole wet mass and retained water/ethanol/other volatile-carrier contents separate from NV solids. Retain operational residue/interference uncertainty explicitly; an unknown or unmatched basis blocks the dependent quantitative completion and cannot be replaced by assumed cure, yield or carrier removal."
      evidence: "balance checks, omission register, monitoring reports; actual solids/NV method and condition evidence, supplier/formulation compatibility, retained-carrier/interference uncertainty and pending-basis register"
    - id: dq_source_priority
      applies_to: "Secondary data"
      requirement: "Prefer official standards, PCRs, regulations, official datasets and institutional reports, then peer-reviewed literature, then industry documents; label reasoned estimates as provisional."
      evidence: "source register and estimate flags"
    - id: dq_uncertainty
      applies_to: "Estimates and allocation"
      requirement: "Quantify or qualitatively assess uncertainty for provisional estimates, secondary substitutions, allocation, and service conversion."
      evidence: "sensitivity results and data-quality notes"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm Paint UUID b2aa1a35-1823-4b13-96db-d5b89eda2db5 only when its whole-object scope matches section 3; otherwise verify the actual route-specific complete finished-product flow; confirm Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, kg unit, and exactly 1 kg net product excluding packaging."
    source_ids:
      - mass-balance-identity
  - rule_id: val_qualifiers
    applies_to: "Dataset metadata"
    rule: "Reject an incomplete reference definition when any required qualifier is absent or ambiguous."
    source_ids:
      - eu-commission-2025-2607
      - jrc-145239-2026
  - rule_id: val_route_coverage
    applies_to: "Process map"
    rule: "Require formulation_dispersion, filling_packaging, and cleaning_waste_management; require thermal_cooking only when on-site cooking or reaction occurs and otherwise record it as not applicable."
    source_ids:
      - us-epa-ap42-6-4-1995
  - rule_id: val_mass_closure
    applies_to: "Foreground processes"
    rule: "Calculate route and site mass-balance closure, report the gap and threshold, and investigate rather than clip unexplained losses."
    source_ids:
      - mass-balance-identity
  - rule_id: val_records
    applies_to: "Collected values"
    rule: "Confirm temporal coverage, site scope, units, calibration, aggregation, and traceability to the named collection protocol. For actual steam (or hot water only if present), declare supplier gate versus consumer control volume, matched period, meter boundary and common enthalpy reference/property source; independently measure each real supply, return, discharge and vent mass/state without assuming full return. The carried-energy ledger is E_legs_MJ = (sum incoming m_i*h_i - sum outgoing m_j*h_j)/1000, with m in kg and h in kJ/kg. Supply/return terms alone are (m_s*h_s - m_r*h_r)/1000; only evidenced m_s=m_r=m with matched boundary/states permits simplifying those terms to m*(h_s-h_r)/1000, never dropping other real legs or stocks. Consumer useful duty additionally reconciles actual stored-energy increase, heat losses, shaft work and other actual energy transfers at that same boundary, with justified omissions; it is not automatically supplier billed/native reference quantity. A calibrated net meter replaces corresponding leg-energy accounting only for the same boundary, without adding both; a meter already in MJ is not /1000 again. Retain physical carrier-water mass, history and destinations; count provider production once using its actual native property/unit/gate and coverage, without double purchase of included carrier water or provider fuel/boiler, or invented return credits. NCV is for actual fuels only. All actual raw totals remain subject to section 5 cohort, physical V/burden A and single normalization conditions."
    source_ids:
      - epd-international-pcr-2019-14-v2-0-1
      - doe-ornl-steam-system-survey-2002
  - rule_id: val_emissions
    applies_to: "Direct VOC and particulate"
    rule: "Confirm route-specific monitoring or balances, capture and control treatment, and absence of double counting; use AP-42 ranges only as historical QA checks. For modelled PM verify actual pre-capture G and its dry-mass/species/size/period basis, C as the fraction routed to the device, and D as removal on the captured stream; only for this evidenced topology add uncaptured G*(1-C) and device outlet G*C*(1-D). Apply actual serial removal stages to their own measured inlets/removal fractions, never treating capture as removal. A measured total covering the same boundary and all branches is an alternative to the branch sum, not an additional release; reconcile any real branches outside its measurement coverage. Retain actual collected solids/residue, reuse or waste destinations and treatment providers; their dry PM content is not additive to the whole wet residue. Nested PM total/species/size subledgers are not additional emitted mass; historical ranges or closure residuals cannot invent G, C, D or species quantities."
    source_ids:
      - us-epa-ap42-6-4-1995
      - us-epa-eiip-coating-2005
      - us-epa-capture-systems
  - rule_id: val_allocation
    applies_to: "Shared operations and outputs"
    rule: "Confirm subdivision was considered first, the causal basis is documented, and economic allocation is justified and sensitivity-tested if used."
    source_ids:
      - iso-14044-2006
      - jrc-ilcd-handbook-2010
  - rule_id: val_background
    applies_to: "Cradle-to-gate profile"
    rule: "Confirm upstream datasets and transport are present for material inputs and disclose geography, technology, age, and substitutions."
    source_ids:
      - epd-international-pcr-2019-14-v2-0-1
  - rule_id: val_service_claim
    applies_to: "Comparative claims"
    rule: "Reject service-equivalence claims based only on 1 kg product; require declared area, performance, applied fraction, coverage or spreading rate, maintenance, and study period."
    source_ids:
      - jrc-145239-2026
  - rule_id: val_provisional
    applies_to: "Reasoned estimates"
    rule: "Flag all reasoned_estimate ranges as provisional and prevent their use as plant defaults; replace them before publication unless explicitly reviewed and justified."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "These original family-level ranges are separate from final reference normalization and retained only as bounded candidate screening information, not per-ingredient bounds, replacements for actual recipes/meters or mandatory acceptance thresholds. Original ranges remaining on other cards likewise retain their local denominators: calculate local indicators from matched raw quantities rather than dividing final normalized exchanges again. No external measured population range substantiates the reasoned_estimate bounds; never use them as universal plant defaults, and investigate rather than clip outliers. The cleaning-VOC 0–1 conservation bound needs the same event/solvent constituent and no other volatile source; mixture mass is not a species quantity. The AP-42 particulate percentage denominator is pigment handled, not all powders or fillers; it establishes neither species, particle size, compartment nor current emission permission."
    source_ids: []
  - rule_id: validation_rule_12
    applies_to: "foreground_dataset_conformance"
    rule: "Range: Provisional formulation guardrail Range role: QA guardrail (qa_guardrail) Lower: 0.05 Upper: 0.80 Unit: kg/kg bulk coating Basis: Reasoned estimate spanning materially different coating families; replace with plant formulation data. Basis kind: Process output (process_output) Evidence kind: Reasoned estimate (reasoned_estimate) Sources:"
