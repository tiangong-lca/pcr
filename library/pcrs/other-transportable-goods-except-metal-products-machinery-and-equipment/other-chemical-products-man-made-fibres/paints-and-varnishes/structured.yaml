    used_for: "Product-family scope; formulation and packaging characteristics; production air, water, VOC, material-efficiency and energy-efficiency concerns"
  - id: "jrc-145239-2026"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre, Revision of the EU Ecolabel criteria for Paints and Varnishes: Final Technical Report, JRC145239, DOI 10.2760/7406739, 2026; https://doi.org/10.2760/7406739"
    used_for: "Raw-material hotspots; cradle-to-grave context; coverage-, performance-, maintenance-, and study-period-based service conversion"
  - id: "us-epa-ap42-6-4-1995"
    type: "official_guidance"
    reference: "United States Environmental Protection Agency, AP-42 Section 6.4 Paint and Varnish, January 1995; https://www.epa.gov/sites/default/files/2020-10/documents/c06s04.pdf"
    used_for: "Manufacturing process map; solvent and pigment release mechanisms; historical QA observations with distinct prose and uncontrolled-table contexts"
  - id: "epd-international-pcr-2019-14-v2-0-1"
    type: "standard"
    reference: "EPD International, PCR 2019:14 Construction products, version 2.0.1, 2025; https://www.environdec.com/pcr-library/pcr_6b99d07c-4b75-4763-4485-08dd775d2e49"
    used_for: "Cradle-to-gate modules, upstream material and transport coverage, data quality, completeness, and waste treatment framing"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management — Life cycle assessment — Requirements and guidelines; https://www.iso.org/standard/38498.html"
    used_for: "Allocation hierarchy and LCA methodological requirements"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation of mass calculation identity"
    used_for: "Reference normalization, yield, rework, packaging, solvent, and process mass-balance calculations"
  - id: "jrc-ilcd-handbook-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, first edition, 2010, section 6.5.3.2; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Independent multifunctionality method: subdivision, system expansion, real physical causality and other relationships; not a site recipe, emission factor or current permission"
  - id: "us-epa-eiip-coating-2005"
    type: "official_guidance"
    reference: "US EPA, EIIP Volume II, Chapter 8: Methods for Estimating Air Emissions from Paint, Ink, and Other Coating Manufacturing Facilities, February 2005, sections 2.1–2.2 and 5.2; https://www.epa.gov/sites/default/files/2015-08/documents/ii08_feb2005.pdf"
    used_for: "Conditional named ingredients including PVAc emulsion and ammonia solution, actual operations and speciated emission methods; historical non-binding guidance, without adopting example recipe quantities or default factors"
  - id: "us-epa-voc-controls-1978"
    type: "official_guidance"
    reference: "US EPA, Control Techniques for Volatile Organic Emissions from Stationary Sources, EPA-450/2-78-022, May 1978, section 4.8.2 and Table 4.8-1; https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=2000M8SN.TXT"
    used_for: "Cooking/bodying versus physical mixing and historical named examples including linseed oil, rosin and xylene; not an actual plant BOM, mandatory ingredients, reaction fractions or current permission"
  - id: "us-epa-capture-systems"
    type: "official_guidance"
    reference: "US EPA, Monitoring by Control Technique — Capture Systems, Description and local exhaust ventilation; https://www.epa.gov/air-emissions-monitoring-knowledge-base/monitoring-control-technique-capture-systems"
    used_for: "Capture routes emissions to a device; read with EIIP section 2.1.5 Figure 8.2-1 dust collector/recovered PM. Supports network conservation reasoning only, not adoption of VOC enclosure criteria, 100% capture assumptions, legal test applicability or PM efficiencies"
  - id: "doe-ornl-steam-system-survey-2002"
    type: "official_guidance"
    reference: "Greg Harrell, Steam System Survey Guide, ORNL/TM-2001/263, May 2002, sections 3, 4.2, 6.2.2 and 6.4; https://www.energy.gov/sites/prod/files/2014/04/f15/steam_survey_guide.pdf"
    used_for: "Actual steam/condensate/makeup states, recovery and loss distinctions support per-leg conservation reasoning and heat-boundary qualification; no report example quantities, states, return fractions, efficiencies or boiler defaults adopted, nor supplier-native quantity equated to consumer useful heat"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:4b7e5459d1a0c059b21b79ca40f8f50eb6d33b76757ef9973f2cb43b440faa34"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6454"
      family: "system_boundary"
      span:
        start:
          offset: 6454
          line: 65
          column: 1
        end:
          offset: 16616
          line: 112
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Receipt at the manufacturing site of coating ingredients, intermediates, packaging, fuels, and utilities |\n| starting_condition_role | Foreground factory-gate start; upstream production and supplier-to-plant transport remain required background contributions for cradle-to-gate results |\n| product_classification_scope | CPC 3.0 code 35110 products represented by the declared formulation family and production route |\n| recursive_input_rule | Purchased paint, varnish, or intermediate coating used as an input shall be recorded as a visible technosphere input and shall not inherit this foreground process recursively |\n| upstream_dataset_requirement | Use representative upstream datasets for pigments, fillers, binders, solvents, water, additives, packaging, fuels, electricity, transport, and waste treatment; disclose geography, technology, age, and substitutions |\n| disclosure | Disclose excluded operations, outsourced steps, rework loops, cut-offs, abatement, allocation, data gaps, and whether application and end-of-life stages are outside the dataset |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| sb_received_inputs | Foreground start | Include receipt, storage losses, and dosing of all ingredients, intermediates, packaging, fuels, and utilities; attach upstream datasets and supplier-to-plant transport when reporting cradle-to-gate impacts. | epd-international-pcr-2019-14-v2-0-1 |\n| sb_manufacturing_operations | Factory operations | Include mixing, dispersion or milling, let-down, tinting, filtration, conditional thermal cooking, quality control, rework, filling, packaging, equipment cleaning, direct releases, and on-site waste handling when present. | us-epa-ap42-6-4-1995 |\n| sb_direct_releases | Air, water, and waste releases | Record direct VOC, particulate, wastewater, coating residue, and other material releases after control, together with capture, abatement, and destination. | eu-commission-2025-2607, us-epa-ap42-6-4-1995 |\n| sb_use_end_of_life | Factory-gate profile | Exclude application, service, maintenance, removal, and final end-of-life from the factory-gate dataset; include them only in a separately declared expanded study. | jrc-145239-2026 |\n| sb_cutoff_disclosure | Completeness | Do not omit known hazardous constituents or direct releases solely because their mass is small; document every cut-off and apply the governing programme's completeness rules. | epd-international-pcr-2019-14-v2-0-1 |\n\n### Whole-reference binding limits\n\nThe native Paint UUID describes a liquid pigmented paint with a reference Mass property of 1; it does not establish identity for powder coatings, clear varnishes, every performance system or an arbitrary multi-component kit. Use this binding only when the declared configuration matches the complete native object; never change the product to fit the UUID. Other actual routes require an individually verified reference flow for the complete finished preparation, with its property, unit, physical form and delivery state; an unresolved core reference identity blocks use for that dataset. For multi-component products, record the components and proportions of the declared sold configuration: 1 kg is the sum of their net coating masses, not the mass of one active resin.\n\n### Actual configuration and individual exchanges\n\nEach dataset represents one declared product, formulation, site, period and actual route. The named cards below are conditional individual-exchange methods, not a common plant BOM or an assertion that all these chemicals are used; absence requires actual evidence of non-applicability. Expand every actual purchased ingredient, complete preparation, packaging item, fuel, steam supply, electricity input, cleaning agent, waste stream and emitted substance by its individual name, raw quantity and provider. One example cannot stand for other real exchanges, and a category label is never a selected flow. An unresolved UUID retains its concrete name and identity gap; do not invent one.\n\nFor a purchased complete polymer emulsion, pigment paste, solvent mixture or coating preparation, record the whole as-received purchase once; its polymer, pigment, water and solvent contents are a non-additive composition subledger, not additional purchases. For on-site compounding, each separately purchased actual component is an individual exchange. Retain composition, concentration and aqueous phase with the raw records; do not force formulation water into powder routes or collapse 1K/multi-component/cooked routes into a water-borne sample. Track ordinary auxiliary-identity and provider gaps against affected rows; incompatible core reference identity, unknown key actual materials or missing routes block use for that dataset. Source scope does not establish a site recipe.\n\n### Production cohort, gate and single normalization\n\nThe protocols' aggregation_rule declares the final result basis, not an instruction to meter each kg separately. Retain the raw aggregation steps in collection_method and all raw_fields. Build a traceable cohort for the same product configuration, site, period and actual batches, retaining actual quantity Q: the kg net coating mass first released after completed filling/packaging and conformity to sale specification, excluding packaging. Q is not design capacity, material input, shipments or output inferred from an assumed yield. Newly accepted product in closing finished-goods stock is already in Q exactly once; do not add or subtract that closing stock again. Shipping opening finished goods, reaccepting returns or internal transfer does not create new production. Retain opening/closing raw-material, WIP and finished-goods stock and their historical burdens separately. Carry into the output cohort only its attributable opening-WIP burdens and carry forward closing-WIP burdens outside it; do not additionally deduct finished-goods stock from a Q that includes newly released closing finished goods. Retain actual packaging, handling, storage, cleaning and waste burdens.\n\nThe raw numerator is the actual matched-cohort exchange total after evidenced return/recovery reconciliation and any necessary allocation; divide by actual Q once. Keep batch quantity ledgers rather than averaging batch ratios. Local QA ratios per bulk output, solvent charged or precursor input are not successive normalization divisors. Do not delete failed batches, zero-output runs, changeovers or shutdown cleaning: assign their burdens to the related cohort on an evidenced basis or retain a separate failure record. When Q=0, do not normalize per kg or erase burdens with zero values or invented output.\n\nRecord physical flow V at its actual state, unit and quantity; record burden attribution A and causal allocation factors separately, without scaling physical outputs to force burden allocation. Check each provider's product/waste type, property/unit, technology, geography, gate, phase and period. A unit-group conversion is not density or composition evidence. Reconcile intermediate receipts/transfers within process accounts and cancel them in the consolidated site account; do not subtract final product, internal transfers and stock change twice. Retain closure gaps and raw reconciliation, never infer unidentified emissions from residual mass or claim closure has been achieved.\n\nExpand aqueous and thermal exchanges only for the real configuration. Keep solids/wet/dry mass and solvent subledgers separate. Record actual cooling-water makeup and discharge, cleaning water, reaction water, condensate and water vapour individually by phase/destination; not every cooked route forms water or uses steam. Actual thermal reactions require species, reaction and operating evidence. For real on-site combustion retain each fuel, oxidant, emitted substance and control burden; electric or externally supplied heat does not imply on-site combustion. Include actual powder extrusion, cooling, grinding and sieving within formulation_dispersion. Reconcile separately produced/packed multi-component quantities and proportions to the real sold configuration. Keep manufacturing gates separate from downstream application/curing.\n\n### Identity and emission-use conditions\n\nVerify medium-voltage electricity against actual voltage, region and provider; a previously unresolvable identifier is not unit evidence. Confirm manufacturing rejects and cleaning residue individually by composition, form and treatment gate rather than using a flow described as application overspray/sludge/spent filters. The wastewater UUID is only a conditional physical locator for whole liquid-stream mass if source-owner/provider and actual receiving evidence establish the intended untreated handover interface. Its native Secondary/Tertiary Treatment label leaves that interface unestablished by the label alone: it proves neither the pre-treatment generation gate nor an already-treated effluent state. Record actual collection stage, composition, density, treatment acceptance and compatible provider before using the binding; otherwise verify a different compatible interface. It is not a direct elementary discharge; no generic kg-to-m3 substitution is allowed.\n\nXylene on each VOC card is only a conditional individual substance exchange; expand other real emitted substances by species, gas/water phase, receiving compartment and post-control quantity. Reconcile their sum with total-VOC QA without adding the sum indicator as another release. The titanium-dioxide particulate card likewise cannot represent all dust; confirm particle size, composition and air compartment. In the VOC balance, product retention, recovery, shipped waste, control destruction and stock are mutually exclusive fates. Capture alone is not a final fate: do not deduct it again when already assigned to recovery/waste/stock. Record real combustion/control products separately; destroyed VOC is not disappearance of total mass. Total VOC, COD, closure residuals or historical factors cannot fabricate speciated quantities.\n\n"
