    applies_to: "foreground_dataset_conformance"
    rule: "Range: Historical manufacturing solvent-loss observation Range role: QA guardrail (qa_guardrail) Lower: 0.01 Upper: 0.02 Unit: kg VOC/kg solvent charged Basis: AP-42 section 6.4.1 reports 1–2% solvent loss even under well-controlled paint-manufacturing conditions. This prose observation is separate from Table 6.4-1 uncontrolled product-based factors; it is not a current default, a varnish-route factor or a species-level release fraction. Denominator: actual material input named in the unit; this prose diagnostic is not a process-output basis token. Evidence kind: External source (external_source) Sources: us-epa-ap42-6-4-1995"
