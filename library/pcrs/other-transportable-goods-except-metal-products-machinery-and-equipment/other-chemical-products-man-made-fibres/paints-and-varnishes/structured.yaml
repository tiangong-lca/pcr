    name: "Formulation, dispersion, and finishing"
    inclusion: "required"
    inclusion_condition: "All products"
    role: "Converts ingredients into specification-conforming bulk coating"
    quantitative_reference: "kg bulk coating released to filling"
  - id: thermal_cooking
    name: "Thermal cooking of varnish or resin intermediate"
    inclusion: "conditional"
    inclusion_condition: "Include only when cooking or reaction occurs at the reporting site"
    role: "Produces a cooked intermediate and associated releases"
    quantitative_reference: "kg cooked intermediate transferred to formulation"
  - id: filling_packaging
    name: "Filling and packaging"
    inclusion: "required"
    inclusion_condition: "All packaged products"
    role: "Produces the factory-gate reference product"
    quantitative_reference: "1 kg net packaged coating product"
