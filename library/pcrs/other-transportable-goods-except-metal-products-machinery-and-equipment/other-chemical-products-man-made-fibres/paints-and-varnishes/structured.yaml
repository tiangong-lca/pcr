measurement_rules:
  - id: mu_reference_mass
    applies_to: "Reference product output"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Normalize the packaged saleable product to 1 kg net coating, excluding packaging mass."
  - id: mu_material_inputs
    applies_to: "Formulation ingredients, cleaning agents, packaging, wastes, and wastewater"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record wet mass as received; additionally record dry matter, solids, or concentration when required to interpret the material. Where solids/nonvolatile (NV) content is used, declare the actual measurement method, test state and conditions, and compatibility with the supplied formulation and supplier reference. Keep whole wet mass, NV fraction, carrier water and retained volatile liquid in separate accounts; retained water, ethanol or other volatile carrier is not NV solids. An operational residue reading requires its retained-carrier/interference uncertainty to be disclosed; it does not establish an assumed cure or yield."
  - id: mu_liquid_volume
    applies_to: "Metered water, solvent, or liquid ingredients when mass is not directly measured"
    required_property_ref:
      name: "Volume and density"
      uuid: ""
    required_unit: "m3 and kg/m3"
    rule: "Convert volume to mass using a batch- and temperature-representative measured density; retain the raw volume and density."
  - id: mu_electricity
    applies_to: "Purchased or generated electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Record meter or allocated electricity and identify voltage level and supply dataset."
  - id: mu_thermal_energy
    applies_to: "Fuel or supplied heat used by a thermal cooking route"
    required_property_ref:
      name: "Net calorific value or energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Report fuel mass or volume and net calorific value, or directly metered supplied heat; do not substitute electricity without disclosure."
  - id: mu_air_emissions
    applies_to: "VOC and particulate releases"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report pollutant-specific measured or calculated mass after control; identify capture and abatement assumptions."
  - id: mu_service_conversion
    applies_to: "Comparative coating service"
    required_property_ref:
      name: "Area, performance, and time"
      uuid: ""
    required_unit: "m2 and year"
    rule: "Convert product mass using declared coverage or spreading rate, density where needed, applied fraction, maintenance multiplier, performance criterion, and study period."
process_map:
