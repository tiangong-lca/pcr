system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers the physical dry roller compaction of one already complete, non-living, peptone- and tryptone-free prepared cell culture medium from a traceable homogeneous dry powder into released compacted granules. The manufacturing scope is evidenced by the Merck EZMix custom medium line and Cellvento medium examples: hopper feeding/mixer and tamp auger, hydraulically loaded rollers forming a plate, rotor milling, vibratory sieving, actual fines recirculation and first finished-granule acceptance. No water, binder or other excipient is added to the compaction operation. Actual complete-medium formulation identity, residual moisture and particle state remain declared lot attributes; no public nutrient recipe, culture, growth or engineering instruction is provided."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "This is a genuine material transformation rather than receipt or repacking. Its foreground starts at the actual homogeneous complete-medium powder interface and includes the complete compaction/milling/sieving line and actual auxiliaries. The powder producer may be the same-site preceding operation or a genuine external supplier. Retain that producer with its actual source, owner, site/time, whole formulation and phase, compatible reference units and complete upstream inventory/burdens. Match sender/receiver powder lot and whole mass. An own-WIP transfer is not a fabricated purchase. Unavailable producer qualification prevents a completed LCI; an interface label cannot erase known blending, ingredient manufacture, cleaning or other operations."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "Exclude peptone- or tryptone-containing media, raw single nutrients, pure yeast extract or peptone as whole-medium proxies, incomplete supplements or cell-culture feeds, living cells/starter cultures, media reconstitution or biological use, wet granulation, liquid medium manufacture, drying a liquid formulation, irradiation/sterilisation as an assumed step, and dental/fire-extinguisher/modelling products. Each study fixes one actual whole-medium configuration; multiple different formulations are never blended into a heterogeneous reference. No research or laboratory medium is silently substituted for a food starter provider."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "The actual state100 native Biological Medium/生物培养基 is a whole Product family at plant. Its complete comment covers media for cells/microorganisms and has no hard purity, composition, route, phase or geography restriction. It is admitted only for the actual complete medium in the declared powder or compacted state, with formulation/grade/provider qualification, not as a component, living culture or service. Native classification35440 is consistent with current CPC3.0 explicitly including prepared media for plant/human/animal cells; this supports only the narrower physical product/route and does not cover the entire miscellaneous leaf or establish an accepted mapping."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "The 2022 Merck technical brief is a primary manufacturer document describing the actual mechanical line and particular comparative observations. The 2015 Merck-authored article corroborates a named compacted-medium case and physical testing. Both derive from one producer and are not independent measured factory LCIs. Claims of unchanged chemistry, improved dissolution/density/dust, reduced packaging/cost or safety and environmental advantages are not universal effects or default factors. The EPO T1318/18 decision explicitly distinguishes dry roller compaction of its peptone/tryptone-free claimed medium from wet granulation and notes that the patent did not demonstrate avoidance of side reactions relative to wet granulation. Preserve this limitation; neither source claims nor a mechanical check substitute for actual formulation-specific evidence."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "Q_c is the independent sum of disjoint positive first accepted net whole compacted-medium masses at the fixed release gate for original cohort c, excluding all packaging. Dehydrated does not mean zero moisture or a bone-dry denominator. Bulk/tapped volume, particle counts, active/nutrient equivalents and downstream reconstituted volume are companion quantities, not replacements for measured reference kg. Reference acceptance is an event account, not an extra external physical output."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "Keep three separate accounts: actual raw/premix/WIP/finished-stock/asset/container physical transfers and stocks; unique reference events on original-cohort Q_c; and attributed environmental/provider-service vectors. Rework, retesting, internal recycle and returns create no second reference event. The full original-cohort bridge partitions net remaining delivery, every actual accepted on-site state, irreversible loss and all other terminal dispositions. Delivery plus closing stock is valid only when no other postgate state/exit exists."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "Do not restore lost water or medium into surviving stock and also count the loss. Later external moisture/material additions are genuine separate inputs and are excluded from original-cohort equivalent mass. All raw totals survive when Q_c is zero or unknown and the normalized result remains unresolved. Carry own opening WIP and inherited foreground/upstream burdens once, independently from new purchases. Do not add a provider aggregate and its already embedded decomposed production again."
      source_ids: []
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "The complete premixed medium is one physical mixture input, not a list of purchased nutrients. Its actual constituent/moisture observations are nested analytical ledgers and must not be purchased again. Preserve actual formulation identifiers and supplier documentation without publishing a biological recipe. A qualifying incoming medium cannot be inferred from a generic name alone. Actual post-compaction composition and quality release remain formulation-specific; if an essential matrix/procedure is unestablished, it remains a hold and cannot be waived through future SOP or checkpass."
      source_ids: []
    - rule_id: system_boundary_rule_10
      applies_to: "foreground_system_boundary"
      rule: "Retain the actual fines recycle and all start-up, shutdown, failed-lot, screen/line hold-up and off-spec states. Gross roller/mill/sieve throughput is not new purchased powder or additional accepted output on every pass. Match internal transfers and cancel paired links on consolidation without cancelling actual equipment work or inherited burden. Do not assume fines, granules, airborne dust and sampled material share the same composition or moisture when segregation/transformations are not measured."
      source_ids: []
    - rule_id: system_boundary_rule_11
      applies_to: "foreground_system_boundary"
      rule: "Maintain whole/elemental conservation, actual species formation/consumption and water phases as separate checks. The absence of added granulation water/excipient does not prove zero residual-water exchange, zero chemical change or zero emissions. Record real air/humidity intake, evaporation/condensation, cleaning water and actual losses. Equipment cleaning water is separate from adding a binder to the medium; reconstitution and biological-use recipes remain outside this environmental manufacturing scope. Never fit unknown chemicals/water from a mass residual, COD/TOC or loss-on-drying measurement."
      source_ids: []
    - rule_id: system_boundary_rule_12
      applies_to: "foreground_system_boundary"
      rule: "Keep the exact native electricity property Net calorific value/净热值 on MJ. Measured kWh×3.6 is solely an electrical unit conversion and does not imply a fuel or generation mix. Collect actual roller/auger/mill/sieve, hydraulic, ventilation, cleaning and required storage/control duties. Hydraulic-circuit fluid is a separate actual whole fluid with stocks/replacements and supplier basis; circulating fluid is not repeatedly consumed at every pass. No oil type, leak rate, equipment mass or life is invented. If capital equipment is included, its actual configuration, measured quantity, physical fleet and compatible provider-service history are separately documented."
      source_ids: []
    - rule_id: system_boundary_rule_13
      applies_to: "foreground_system_boundary"
      rule: "An actual heater/cooler, dust collector, treatment system, irradiation step or grade-required storage/cold-chain operation is not erased by the dry-process label. Model the complete actual producer and matched interfaces, real reagents/fuels/air/water/energy, species/emissions and residues, with its documented reference units. Additional actual interfaces must be represented before a complete study is claimed. This PCR supplies no dummy treatment, available-background assertion, omitted operation or generic zero."
      source_ids: []
    - rule_id: system_boundary_rule_14
      applies_to: "foreground_system_boundary"
      rule: "The primary culture-medium container and any genuine transport cooling pack are each one documented whole supplied assembly. Actual composition/tare, dimensions/configuration, stocks and delivered/returned/scrapped events remain separate from net medium Q. A cooling-pack mixture is not assumed to be pure water or ice. Include only actual grade-required configurations and retain their real production/conditioning/control burdens; no universal package, cold-chain condition, per-item mass, reuse life or credit is set."
      source_ids: []
    - rule_id: system_boundary_rule_15
      applies_to: "foreground_system_boundary"
      rule: "Record one actual whole contaminated filter/container/cooling-pack waste transfer, including its dry substrate, retained medium/fluid and moisture once. Those components are nested subledgers, not extra attached-medium or water exchanges/treatment demand. Physically separated off-spec medium/caught powder is a distinct stream only when actually separated before the boundary. An intact assembly is not duplicated as separately discarded components. Preserve full physical fleets and all actual receiver quantities independently from service attribution."
      source_ids: []
    - rule_id: system_boundary_rule_16
      applies_to: "foreground_system_boundary"
      rule: "Use three distinct waste/service ledgers: actual whole receiver transfer Qt and full actual treatment-provider quantity once; component/physical-cohort provenance where actually known; and independently evidenced non-overlapping compatible provider-service/environmental vectors A_c assigned to each served original Q_c. Qt/Q_c is analytical only. A shared10kg filter remains10kg actual export once. Given specifically evidenced25%/75% treatment shares and Q100/200, modeled2.5/7.5kg-equivalent gives.025/.0375 per reference, not physical2.5/7.5kg exports or10kg demand charged again to each cohort. These illustrative numbers are not empirical shares/defaults; unsupported assignment remains unresolved."
      source_ids: []
    - rule_id: system_boundary_rule_17
      applies_to: "foreground_system_boundary"
      rule: "Airborne medium dust is an actual whole mixed particulate with its own sampled composition and medium, not pure yeast extract, a nutrient proxy or an assumed equal portion of the product. Particle-number counts per air volume from a finite laboratory size window are not a mass emission factor and do not cover all particle sizes, fugitive outlets or volatile/condensable species. Preserve actual size coverage, sample air conditions, calibration, blanks, uncertainty, component assays and whole wet-gas/condensate observations. No dust-reduction chart becomes zero plant emission or a universal factor; no whole PM plus all its constituents is double-counted."
      source_ids: []
    - rule_id: system_boundary_rule_18
      applies_to: "foreground_system_boundary"
      rule: "The scope of component evidence is limited: Merck technical-brief Figure5 describes feed composition, and the 2015 article compares vitamins in Cellvento Feed-210, with some amino-acid/homogeneity data not shown. These observations are not a validated whole-component/speciation assay for every complete basal medium or actual customer formula. Analytical uncertainty, tested matrix and unreported data remain explicit; neither feed results nor selected component recovery proves all chemicals unchanged. Actual applicable whole-medium release and source procedures must be evidenced without inventing a culture protocol or treating future validation as present qualification."
      source_ids: []
    - rule_id: system_boundary_rule_19
      applies_to: "foreground_system_boundary"
      rule: "For the air_in card, use the actual whole atmosphere-to-unit air withdrawal on a measured mass basis; it is a gross physical entry and does not establish net consumptive air use or oxygen uptake. Keep the matched complete exhaust/return mixture, unchanged carrier constituents, humidity and any transient stock in the separate physical ledger. Record medium dust and net process water vapour on their actual non-overlapping component bases; they are nested within real exhaust and are not added to it to close mass. Do not count unchanged incoming carrier air, ambient CO2 or moisture again as new process emissions. Bind only a flow whose intended gross-withdrawal meaning matches this entry; unavailable identity stays unbound, not silently converted to a net-resource or oxygen flow. Fan, conditioning and genuine producer burdens remain once."
      source_ids: []
    - rule_id: boundary_complete_route
      applies_to: "medium_compaction"
      rule: "Retain actual whole premix producer, feeding/hydraulic rollers/mill/sieve/fines loop and all real auxiliary/treatment history. No synthetic receipt gate, nutrient proxy, free producer or generic zero."
      source_ids:
        - merck-ezmix-2022
        - merck-compacted-2015
        - jrc-cww-2016
    - rule_id: boundary_identity_limits
      applies_to: "reference and each actual medium lot"
      rule: "Verify actual whole prepared medium within native family/current35440; exact formulation/state/provider admission, no live culture or pure component; preserve source-specific chemical-performance and particle-method limits."
      source_ids:
        - unsd-cpc3-2025
        - epo-dry-media-2022
        - merck-ezmix-2022
