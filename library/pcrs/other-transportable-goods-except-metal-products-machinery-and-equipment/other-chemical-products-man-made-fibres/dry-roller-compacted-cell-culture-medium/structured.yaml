allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Use three distinct waste/service ledgers: actual whole receiver transfer Qt and full actual treatment-provider quantity once; component/physical-cohort provenance where actually known; and independently evidenced non-overlapping compatible provider-service/environmental vectors A_c assigned to each served original Q_c. Qt/Q_c is analytical only. A shared10kg filter remains10kg actual export once. Given specifically evidenced25%/75% treatment shares and Q100/200, modeled2.5/7.5kg-equivalent gives.025/.0375 per reference, not physical2.5/7.5kg exports or10kg demand charged again to each cohort. These illustrative numbers are not empirical shares/defaults; unsupported assignment remains unresolved."
    source_ids: []
  - rule_id: allocation_single_medium
    applies_to: "medium_compaction"
    rule: "One intended compacted medium. Recycle, off-spec, dust, packaging and spent fluids are not automatically cofunctions. Preserve actual masses/fleets, use causal evidenced nonoverlapping burden/service attribution with compatible units and original cohorts; unknown shares unresolved, no automatic recovery credit."
    source_ids:
      - jrc-ilcd-2010
      - merck-ezmix-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_gate
      process_id: "medium_compaction"
      flow_role: "finished_medium"
      record_type: "acceptance and full stock events"
      raw_fields: "eventID; original cohort; gate/time; whole formulation/state; actual release document/method scope; gross/tare/net; incoming/WIP/FG opening/closing; all delivery/retest/return/rework/loss/addition/fates"
      collection_method: "Calibrated net weighing and unique first events; reconcile all raw physical stocks and disjoint fates, no repeated Q or loss restoration."
      unit: "kg"
      frequency: "Each actual lot/event and calibrated meter/sampling interval"
      temporal_coverage: "One continuous declared period with all opening/closing, startup/failure/shutdown and served-cohort histories"
      site_scope: "Actual compaction site and genuine linked whole-medium/utility/treatment providers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable raw records, source/method scope, calibration, uncertainty, complete nonoverlap and explicit unresolved evidence"
    - protocol_id: cp_premix
      process_id: "medium_compaction"
      flow_role: "medium_powder"
      record_type: "whole-mixture producer coupling"
      raw_fields: "formula/lot identifier without public recipe; source/owner/site/time; whole powder identity/state/assays/moisture; sender/receiver event and mass; real producer reference unit/inventory; own-WIP or purchase/history; uncertainty"
      collection_method: "Match actual complete mixture and source-qualified whole producer inventory, including real preceding manufacture; internal transfer is not a purchase and embedded history is added once."
      unit: "kg; explicit producer reference units"
      frequency: "Each actual lot/event and calibrated meter/sampling interval"
      temporal_coverage: "One continuous declared period with all opening/closing, startup/failure/shutdown and served-cohort histories"
      site_scope: "Actual compaction site and genuine linked whole-medium/utility/treatment providers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable raw records, source/method scope, calibration, uncertainty, complete nonoverlap and explicit unresolved evidence"
    - protocol_id: cp_operations
      process_id: "medium_compaction"
      flow_role: "electricity, hydraulic_fluid, cleaning_water, air_in"
      record_type: "actual operational meter and state records"
      raw_fields: "equipment diagram; power kWh/MJ; all real auxiliary/storage/treatment duties; actual hydraulic fluid identity charge/stock/replacement; water purpose/mass; air humidity/composition/conditions; source/method/provider units and genealogy; matched gross air intake/exhaust/return and transient carrier stocks; unchanged ambient components and actual process increments"
      collection_method: "Integrate actual calibrated meters once and preserve complete physical observations and linked producers; no invented fuel, fluid grade, mass, lifetime or zero. Keep gross physical air closure separate from consumptive-resource interpretation and nested incremental emissions."
      unit: "kg; kWh; MJ; actual state units"
      frequency: "Each actual lot/event and calibrated meter/sampling interval"
      temporal_coverage: "One continuous declared period with all opening/closing, startup/failure/shutdown and served-cohort histories"
      site_scope: "Actual compaction site and genuine linked whole-medium/utility/treatment providers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable raw records, source/method scope, calibration, uncertainty, complete nonoverlap and explicit unresolved evidence"
    - protocol_id: cp_pack
      process_id: "medium_compaction"
      flow_role: "container and cooling-pack assemblies"
      record_type: "whole assembly events and services"
      raw_fields: "assembly/configurationID; maker/material/components; actual whole tare/content/water; opening/additions/delivered/returned/scrapped/closing; conditioning/storage duties; receiverQt/provider units; original served cohorts and attribution evidence"
      collection_method: "Measure actual whole matching assembly and nested components; no material/coolant assumption. Keep full actual contaminated waste/receiver quantity once independently of compatible modeled service."
      unit: "kg; counts with measured same-configuration kg/unit"
      frequency: "Each actual lot/event and calibrated meter/sampling interval"
      temporal_coverage: "One continuous declared period with all opening/closing, startup/failure/shutdown and served-cohort histories"
      site_scope: "Actual compaction site and genuine linked whole-medium/utility/treatment providers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable raw records, source/method scope, calibration, uncertainty, complete nonoverlap and explicit unresolved evidence"
    - protocol_id: cp_filter
      process_id: "medium_compaction"
      flow_role: "filter_sleeve, spent_filter"
      record_type: "actual filter fleet and cohort service"
      raw_fields: "actual whole sleeve material/maker/dimensions/mass; opening/install/replacements/closing; captured media/water; whole discarded Qt/providerquantity; served originalQ cohorts and evidence for compatible service vectors"
      collection_method: "Conserve real physical fleet and actual complete contaminated export; nested substrate/medium/water are not extra waste. Unknown shares do not become defaults."
      unit: "kg; dimensions; explicit compatible provider units"
      frequency: "Each actual lot/event and calibrated meter/sampling interval"
      temporal_coverage: "One continuous declared period with all opening/closing, startup/failure/shutdown and served-cohort histories"
      site_scope: "Actual compaction site and genuine linked whole-medium/utility/treatment providers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable raw records, source/method scope, calibration, uncertainty, complete nonoverlap and explicit unresolved evidence"
    - protocol_id: cp_waste
      process_id: "medium_compaction"
      flow_role: "offspec_medium, cleaning_liquor, spent_hydraulic_fluid"
      record_type: "whole receiver and treatment linkage"
      raw_fields: "actual distinct stream/event; whole wet Qt; component/state/assay; matched source/receiver; actual complete treatment producer/inventory/referenceunits; raw providerquantity; physical-cohort provenance and independent nonoverlap service evidence"
      collection_method: "Weigh actual distinct whole transfer once; retain all real treatment inputs/outlets and joint provider demand across ports/cohorts. No generic disposal, attached-component fiction or proportional physical shrinkage."
      unit: "kg; explicit compatible provider reference units"
      frequency: "Each actual lot/event and calibrated meter/sampling interval"
      temporal_coverage: "One continuous declared period with all opening/closing, startup/failure/shutdown and served-cohort histories"
      site_scope: "Actual compaction site and genuine linked whole-medium/utility/treatment providers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable raw records, source/method scope, calibration, uncertainty, complete nonoverlap and explicit unresolved evidence"
    - protocol_id: cp_air
      process_id: "medium_compaction"
      flow_role: "medium_dust_air, water_vapour_air"
      record_type: "source/matrix and particle/water observations"
      raw_fields: "actual source/phase; whole wet gas/intake humidity/sampling conditions; size window; particulate mass versus count; composition; blank/calibration/recovery/interference; sampling time/flow/volume; actual condensed/waste routes; uncertainty/nondetect/gaps"
      collection_method: "Use actual applicable mass/chemical/phase methods; preserve particle-size and fugitive/volatile limitations, no conversion of lab counts or empirical reduction to plant massfactor. Never substitute COD/LOD or totalPM for unknown species/water."
      unit: "kg; explicit concentration/air state/volume/time units"
      frequency: "Each actual lot/event and calibrated meter/sampling interval"
      temporal_coverage: "One continuous declared period with all opening/closing, startup/failure/shutdown and served-cohort histories"
      site_scope: "Actual compaction site and genuine linked whole-medium/utility/treatment providers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable raw records, source/method scope, calibration, uncertainty, complete nonoverlap and explicit unresolved evidence"
  calculation_rules:
    - id: unique_gate
      applies_to: "finished_medium"
      rule: "Sum disjoint unique positive first accepted net whole compacted-medium events as original Q_c; preserve all physical stocks/fates and losses without repeated acceptance or loss restoration."
      inputs:
        - cp_gate
      output: "Q_c in kg and full original-cohort bridge"
      source_ids:
        - merck-ezmix-2022
        - jrc-ilcd-2010
        - jrc-cww-2016
    - id: normalize_cohort
      applies_to: "medium_compaction"
      rule: "For positive original Q_c divide only evidenced non-overlapping attributable numerator or compatible provider-service vector A_c by Q_c once. Preserve full physical transfers independently; unknown/zero basis or unsupported assignment yields unresolved result."
      inputs:
        - cp_gate
        - cp_premix
        - cp_operations
        - cp_pack
        - cp_filter
        - cp_waste
        - cp_air
      output: "Declared per1kg-reference exchanges or unresolved result"
      source_ids:
        - merck-ezmix-2022
        - jrc-ilcd-2010
        - jrc-cww-2016
    - id: physical_components
      applies_to: "whole premix, recycle, stocks and outputs"
      rule: "Reconcile actual whole physical mass, nested components/elements, water phases and chemical formation/consumption separately. Internal fines are real recirculation but no new purchase/Q; do not assume chemistry, moisture or composition unchanged or create residual closure species."
      inputs:
        - cp_gate
        - cp_premix
        - cp_operations
        - cp_waste
        - cp_air
      output: "Separate physical/component/element/water/species ledgers with actual gaps"
      source_ids:
        - merck-ezmix-2022
        - jrc-ilcd-2010
        - jrc-cww-2016
    - id: electric_conversion
      applies_to: "electricity"
      rule: "Measured kWh×3.6 = MJ; exact Net calorific value property and actual provider/equipment/time boundary remain, no fuel or mix assumption."
      inputs:
        - cp_operations
      output: "Actual electrical numerator in MJ"
      source_ids:
        - merck-ezmix-2022
        - jrc-ilcd-2010
        - jrc-cww-2016
    - id: whole_waste_service
      applies_to: "all actual waste assemblies and streams"
      rule: "Actual whole receiver Qt/full actual providerquantity once, nested components and known physical provenance separately. Evidenced nonoverlapping joint service vectors in compatible units assigned across all actual served original cohorts/ports before normalization; no shrinking physical waste or full demand recharge per cohort."
      inputs:
        - cp_gate
        - cp_filter
        - cp_pack
        - cp_waste
      output: "Full raw physical ledger and distinct attributed compatible service ledger"
      source_ids:
        - merck-ezmix-2022
        - jrc-ilcd-2010
        - jrc-cww-2016
  data_quality_requirements:
    - id: identity_and_producer
      applies_to: "whole medium and upstream interface"
      requirement: "Actual complete non-living medium/configuration, appropriate native whole family and real coupled powder producer; no nutrient, live-cell, feed or fake purchase proxy."
      evidence: "Full native hardfields/FPUG; actual lot/formula identifier, producer source/inventory/units and paired transfers"
    - id: actual_methods
      applies_to: "formulation release and source observations"
      requirement: "Source statements and EPO comparative limits stay scoped; actual chemical/water/size/mass procedures must fit the real configuration. An essential unestablished matrix/procedure stays a hold, never futureSOP or finitecheck closure."
      evidence: "Actual applicable methods/calibration/uncertainty/recovery/source coverage and qualified release evidence, no biological recipe published"
    - id: history_and_q
      applies_to: "all stocks/events and recycle"
      requirement: "Full physical/event/burden accounts; every first acceptance/state/fate, original cohorts, own-WIP and embedded-provider history once."
      evidence: "Continuous traceable raw stock/scale/meter/lot records and disjoint bridge, matched internal links"
    - id: whole_waste_provider
      applies_to: "filter/container/cooling/fluid waste and services"
      requirement: "Actual contaminated whole transfer/provider quantity once, nested components and separate evidenced compatible service vectors; no extra attached-material export or share-reduced physical waste."
      evidence: "Receiver tickets, full physical fleets/stocks, real provider inventories/units and service-cohort evidence"
    - id: completeness_and_limits
      applies_to: "actual line and dataset"
      requirement: "Retain all real auxiliary/treatment/grade-required storage burdens, source sizes/phases/species, nondetect versus missing, uncertainties and exact native electricity property; no universal benefit or zero."
      evidence: "Actual complete process/phase diagram, method/provider gaps and source-specific evidence; independent study/science pending"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "The 2022 Merck technical brief is a primary manufacturer document describing the actual mechanical line and particular comparative observations. The 2015 Merck-authored article corroborates a named compacted-medium case and physical testing. Both derive from one producer and are not independent measured factory LCIs. Claims of unchanged chemistry, improved dissolution/density/dust, reduced packaging/cost or safety and environmental advantages are not universal effects or default factors. The EPO T1318/18 decision explicitly distinguishes dry roller compaction of its peptone/tryptone-free claimed medium from wet granulation and notes that the patent did not demonstrate avoidance of side reactions relative to wet granulation. Preserve this limitation; neither source claims nor a mechanical check substitute for actual formulation-specific evidence."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "Airborne medium dust is an actual whole mixed particulate with its own sampled composition and medium, not pure yeast extract, a nutrient proxy or an assumed equal portion of the product. Particle-number counts per air volume from a finite laboratory size window are not a mass emission factor and do not cover all particle sizes, fugitive outlets or volatile/condensable species. Preserve actual size coverage, sample air conditions, calibration, blanks, uncertainty, component assays and whole wet-gas/condensate observations. No dust-reduction chart becomes zero plant emission or a universal factor; no whole PM plus all its constituents is double-counted."
    source_ids: []
  - rule_id: validate_identity_route
    applies_to: "reference and process"
    rule: "Verify complete prepared cell-medium identity, actual powder/granule formulation-state and provider qualification, full roller/mill/sieve/fines topology, no wet binder or nutrient/live-culture proxy and no invented biological instruction."
    source_ids:
      - merck-ezmix-2022
      - merck-compacted-2015
      - unsd-cpc3-2025
  - rule_id: validate_accounts
    applies_to: "all rows and protocols"
    rule: "Check unique originalQ and all physical states/fates, no restored loss or recycled reference, complete real premix/own-WIP/provider histories once, exact native electrical property, whole wastes versus compatible evidenced A_c/Q_c, unsupported shares unresolved."
    source_ids:
      - jrc-ilcd-2010
      - merck-ezmix-2022
  - rule_id: validate_method_scope
    applies_to: "source/matrix and claims"
    rule: "Preserve EPO comparative counterevidence and actual method limits; lab particle counts/finite size windows and material-performance charts are not emissions, unchanged chemistry or environmental savings. Essential specific method/identity gap is a hold, ordinary missing study/provider records remain disclosed, no approval from checkpass."
    source_ids:
      - epo-dry-media-2022
      - merck-ezmix-2022
      - jrc-cww-2016
published_dataset_profile:
  dataset_role: "foreground_process; conditional linked complete manufacturing inventory"
  downstream_use: "secondary_dataset/background_dataset only after actual whole-medium, complete coupled producer and study qualification"
  allowed_use: "Environmental inventory of the exact dry-compaction material configuration and declared manufacturing stage"
  excluded_use: "Culture recipes/growth/engineering advice, live-cell/food-starter provider, whole35440 coverage, clinical/therapeutic/registration/sterility or universal environmental-benefit claims"
  required_metadata: "Whole-medium/formula/state identifier, actual coupled producer source/units/history, first gate/originalcohort, continuous site period, full stocks/fates, packaging/filter/cooling configurations and source-method coverage"
  required_quality_disclosure: "Every actual grade/provider/method/quantity gap, source counterevidence, uncertainty, nonoverlap and pending independent science/translation/study/mapping decisions"
  update_trigger: "Changed complete formulation/state/route/gate, premix producer, real utility/treatment/packaging/cooling scope, methods or new contrary evidence"
data_sources:
  - id: "merck-ezmix-2022"
    type: "literature"
    reference: "Merck/SAFC, Enabling Process Intensification with Compacted Cell Culture Media, MK_TB9283EN v1.0 June2022, complete8-page primary manufacturer technical brief; physical route PDF1–2/Figure1, physical measurement context PDF4/6–7; https://ptj.jiho.jp/sites/default/files/30015/pdfdocs/TechnicalBrief_EZMix-Compacted-Media.pdf"
    used_for: "Actual complete Cellvento/EZMix powder-to-granule route and retained fines, particular physical observations/limitations. Branded primary original on journal-host mirror; no nutrient recipe, numerical operating setting, universal composition/performance, dust factor or environmental benefit adopted."
  - id: "merck-compacted-2015"
    type: "literature"
    reference: "Nikolai Stankiewicz/Merck, Compacted Cell-Culture Media, GEN,31December2015/January2016 issue; complete manufacturer-authored article, physical route and abrasion/bulk-volume/dust observations only; https://www.genengnews.com/insights/compacted-cell-culture-media/"
    used_for: "Named compacted medium and real physical testing, same producer context as technical brief, not independent factoryLCI. No biological protocols, recipe, numerical reduction/benefit defaults or guarantee every formulation compacts equivalently."
  - id: "epo-dry-media-2022"
    type: "official_guidance"
    reference: "European Patent Office Board of Appeal, T1318/18 Dry granulated cell culture media/MERCK,21October2022, full decision, sections6.3–6.4 and8.1–8.2.1; https://www.epo.org/boards-of-appeal/decisions/pdf/t181318eu1.pdf"
    used_for: "Primary countercontext: dry versus wet route/particle distinction; patent did not demonstrate avoidance of side reactions relative to wet granulation. No legal approval/advice, universal chemical-preservation assertion, recipe or LCI default."
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC3.0 Explanatory Notes,30June2025, complete PDF173/35440; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Current prepared culture media expressly includes plant/human/animal cells; proposed narrower medium/material route only, no full-leaf coverage or accepted edge."
