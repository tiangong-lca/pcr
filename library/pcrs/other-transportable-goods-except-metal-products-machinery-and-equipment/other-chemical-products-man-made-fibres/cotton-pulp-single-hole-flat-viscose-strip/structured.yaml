allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "foreground_burden_allocation"
    rule: "Avoid allocation by actual subdivision/direct attribution where possible. Assign remaining exchanges by demonstrated determining physical causality, separately for each exchange and served function; use justified exit-state market values only for residual multifunctionality lacking such a relation. Internal recovery, returned bobbins, waste treatment, stock carry and failed output are not automatic coproducts or substitution credits. Preserve all actual physical coproduct and waste quantities regardless of environmental shares, and disclose provider scope, time/geography and sensitivity. Sources:ilcd-allocation-2010;jrc-polymers-2007."
    source_ids:
      - ilcd-allocation-2010
      - jrc-polymers-2007
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "strip_line"
      flow_role: "Unique first-gate acceptance and geometry"
      record_type: "unnormalised actual records"
      raw_fields: "lot; eventID; original netkg; width apparentmm; single-element count; length; mass; dtex; temperature/RH/time; moisture; finish; tare; source route/hardware; all rejects/returns/WIP/FG"
      collection_method: "Quality officer: calibrated whole-lot net weighing after the declared drying/finishing acceptance; optical apparent-width measurements on traceable samples in the actual supplied state, documenting flat/unfolded/folded geometry and uncertainty; measured length and conditioned net sample mass for linear density, with actual method/calibration and sampling plan. Record original event once; verify full hardware/route and native gate/state before admission."
      unit: "kg; mm; dtex"
      frequency: "every lot/event; continuous meters; complete period reconciliation"
      temporal_coverage: "all matched production, stock and old-cohort histories including failed/zero-output periods"
      site_scope: "actual line, suppliers and complete linked producers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original tickets/assays; method and sampling QA; full provenance; uncertainty and unresolved gaps"
    - protocol_id: cp_materials
      process_id: "strip_line"
      flow_role: "Whole material/solution stock and consumption"
      record_type: "unnormalised actual records"
      raw_fields: "receipt/lot/provider; rawwholekg; assay/hydrate; moisture; pulp solids; actual finishcomposition; opening/closing stocks; internal recoveredstreams; WIP genealogy/vectors"
      collection_method: "Materials accountant with laboratory: retain all unnormalised whole feed receipts, consumption, tanks/stocks and original composition certificates, including failed/rework periods. Subdivide actual water/solutes without adding them again; link complete actual upstream producers and distinguish embedded versus decomposed history."
      unit: "kg"
      frequency: "every lot/event; continuous meters; complete period reconciliation"
      temporal_coverage: "all matched production, stock and old-cohort histories including failed/zero-output periods"
      site_scope: "actual line, suppliers and complete linked producers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original tickets/assays; method and sampling QA; full provenance; uncertainty and unresolved gaps"
    - protocol_id: cp_utilities
      process_id: "strip_line"
      flow_role: "Actual utility and auxiliary producers"
      record_type: "unnormalised actual records"
      raw_fields: "rawkWh/MJ; steamkg/pressure/temperature/quality/enthalpy; condensatekg/state; coolingmakeup/return; meters; vacuum/ventilation/recovery/drying/standby loads; providerunits/history"
      collection_method: "Utilities engineer: collect gross supply/return meter series over all matched operations, failed/zero-output and recovery/treatment units. Match producer units and complete actual generation burdens. kWh×3.6 converts electricity units only; actual thermal enthalpy/density requires measured state, never invented fuel assumptions."
      unit: "kg; kWh; MJ"
      frequency: "every lot/event; continuous meters; complete period reconciliation"
      temporal_coverage: "all matched production, stock and old-cohort histories including failed/zero-output periods"
      site_scope: "actual line, suppliers and complete linked producers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original tickets/assays; method and sampling QA; full provenance; uncertainty and unresolved gaps"
    - protocol_id: cp_recovery
      process_id: "strip_line"
      flow_role: "Whole recovery and receiver transfers"
      record_type: "unnormalised actual records"
      raw_fields: "rawstreamID/wholemass; composition/C/S/Na/Zn; hydrate/moisture; internalstocks; actualrecoveryequipment; receiver; fullproviderQt/units; cohortprovenance; nonoverlapservicevectors; treatmentinputs/outputs"
      collection_method: "Recovery/environment engineer: match all actual whole liquid/gas/solid send/receive tickets and assays; retain recovery stocks and every incurred treatment burden. Record actual full provider quantity once, then evidence separate attributable service vectors by cohort and original Q. Physically distinct rejects are separate; internal recycle cancels. Unproved destination/composition/provider or shares stay unresolved."
      unit: "kg"
      frequency: "every lot/event; continuous meters; complete period reconciliation"
      temporal_coverage: "all matched production, stock and old-cohort histories including failed/zero-output periods"
      site_scope: "actual line, suppliers and complete linked producers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original tickets/assays; method and sampling QA; full provenance; uncertainty and unresolved gaps"
    - protocol_id: cp_species
      process_id: "strip_line"
      flow_role: "Actual species, media, elements and water"
      record_type: "unnormalised actual records"
      raw_fields: "gasflowseries/integratedvolume; conditions; density/composition; speciesconcentration; sampleQC; actualair; waterphases; reactionextent; finaloutlets/fugitives/upsets; wastewatercarrier; elementalassays; rawclosures"
      collection_method: "Analytical/environment officer: use actual site-specific species methods and matrix QA, integrate measured rates or use matched concentration×integratedvolume without extra time. Independently establish reaction extents, water origins, element balances and uncertainty. Identify final medium/outlet and linked producer emissions once; no COD surrogate, reaction-species conservation or fitted residual."
      unit: "kg; m3; mg/m3"
      frequency: "every lot/event; continuous meters; complete period reconciliation"
      temporal_coverage: "all matched production, stock and old-cohort histories including failed/zero-output periods"
      site_scope: "actual line, suppliers and complete linked producers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original tickets/assays; method and sampling QA; full provenance; uncertainty and unresolved gaps"
    - protocol_id: cp_assets
      process_id: "strip_line"
      flow_role: "Whole asset/packaging physical and service ledgers"
      record_type: "unnormalised actual records"
      raw_fields: "articleID/material/dimensions/wholemass; received/returned/installed/spare/supplied/scrapped/closing; substrate/retainedliquor/water; provideractualQt; originalcohorts/Q; servicevectors and units"
      collection_method: "Asset and packaging custodian: calibrated actual weights and whole fleet/article genealogy; reconcile every supplied/returned/scrapped article and actual contaminated receiver transfer. Keep dry substrate/contaminants nested in the whole waste, service demand distinct with evidence of nonoverlap, compatible producer units and old cohorts. Unknown lifetime/share is never invented; actual additional packaging gets separate atomic interfaces."
      unit: "kg; item"
      frequency: "every lot/event; continuous meters; complete period reconciliation"
      temporal_coverage: "all matched production, stock and old-cohort histories including failed/zero-output periods"
      site_scope: "actual line, suppliers and complete linked producers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original tickets/assays; method and sampling QA; full provenance; uncertainty and unresolved gaps"
    - protocol_id: cp_cohorts
      process_id: "strip_line"
      flow_role: "Physical stock/event/attribution reconciliation"
      record_type: "unnormalised actual records"
      raw_fields: "originaleventID/Q; openingraw/WIP/FG/assets; actualinputs/outputs/returns; closingallstates; loss/gains/water/finish; disposition; inheritedvectors; periodfailure/reworkloads; providerhistory; attributedA"
      collection_method: "Production controller: reconcile complete physical stocks/transfers independently of original unique first-acceptance Q and attributed exchange vectors. Partition original postgate basis across all disjoint deliveries, states, losses and terminal dispositions. Carry genuine WIP/history once; include all incurred loads and later services with original cohorts. Preserve raw zero/unknownQ intervals and unresolved shares; no collection-side normalization or double division."
      unit: "kg; provider unit"
      frequency: "every lot/event; continuous meters; complete period reconciliation"
      temporal_coverage: "all matched production, stock and old-cohort histories including failed/zero-output periods"
      site_scope: "actual line, suppliers and complete linked producers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original tickets/assays; method and sampling QA; full provenance; uncertainty and unresolved gaps"
  calculation_rules:
    - id: event_basis
      applies_to: "all inventory rows"
      rule: "Q=sum unique original positive net first-acceptance events at one fixed gate and declared state; returns/rework/retests do not create another event. Keep full general stock/disposition bridge and original-basis conversions separately."
      inputs:
        - cp_acceptance
        - cp_cohorts
        - original_eventIDs
      output: "original Q and physical bridge"
      source_ids:
        - grace-single-hole-2015
    - id: cohort_attribution
      applies_to: "all inventory rows"
      rule: "Construct attributableA from actual openingWIP historical vectors plus incurred period loads including failure/rework, less evidenced closingWIP carry and separately traced dispositions; later services retain original cohorts/Q. No duplicated provider-embedded history. Physical transfers and all stocks remain full independently of A."
      inputs:
        - cp_cohorts
        - cp_materials
        - cp_utilities
        - cp_recovery
        - cp_assets
      output: "attributable A by original cohort and provider unit"
      source_ids:
        - ilcd-allocation-2010
    - id: normalize_cohort
      applies_to: "all inventory rows"
      rule: "For each modelled exchange, divide attributable actualA in its compatible provider unit by the original positive Q inkg exactly once; output flat_strip isQ/Q=1kg. Raw whole wasteQt and physical analyticalQt/Qanalysis do not automatically equal each cohortA/Q treatment demand. Zero/unknownQ keeps raw totals unresolved."
      inputs:
        - A
        - Q
        - cp_cohorts
        - cp_acceptance
      output: "exchange amount per1kg reference flow"
      source_ids:
        - ilcd-allocation-2010
    - id: physical_elements_water
      applies_to: "all inventory rows"
      rule: "Maintain independent whole-mass and C/S/Na/Zn balances plus actual cellulose, solute, species, moisture and finish subledgers. Cellulose/xanthate, CS2, H2S, acid/alkali and bleach are reactive; do not conserve each reacting species across the plant. Free water in supplied solutions, steam/condensate, evaporated water, crystal water and actual reaction-water formation/consumption require distinct evidence and actual reaction extents. Do not infer two unknowns from a fitted closure or force theoretical chemistry to supply a recipe/yield. Gas amounts use concentration times matched integrated gas volume, or integration of a measured rate; never multiply an integrated volume by time again. COD is an indicator, not a specific organic species or extra wastewater mass."
      inputs:
        - cp_materials
        - cp_recovery
        - cp_species
        - cp_assets
      output: "whole physical/elemental/species/water balances and uncertainty"
      source_ids:
        - jrc-polymers-2007
  data_quality_requirements:
    - id: scope_native
      applies_to: "reference and each actual lot"
      requirement: "Establish actual complete product/geometry/route/washed-finished gate fit without a component proxy or hidden hardfield override."
      evidence: "cp_acceptance; complete native admission in section9"
    - id: whole_route
      applies_to: "all actual producers"
      requirement: "No omitted known hardware, recovery, chemicals, treatment or utilities; complete linkage and added atomic rows for every genuinely present exchange."
      evidence: "cp_materials; cp_utilities; cp_recovery; cp_species"
    - id: three_ledgers
      applies_to: "stocks, Q and service vectors"
      requirement: "Independently conserve full physical stocks/transfers, original acceptance events and nonoverlapping attributable environmental/provider-service vectors."
      evidence: "cp_acceptance; cp_cohorts; cp_assets"
    - id: source_limits
      applies_to: "sources and quantities"
      requirement: "Keep all full source qualifications and contrary evidence; no patent/report/BREF number becomes a recipe, yield, factor, inventory default or proof of provider availability."
      evidence: "section9; source originals; actual methods/provider records"
validation_rules:
  - rule_id: validate_geometry_gate
    applies_to: "foreground_dataset_conformance"
    rule: "Verify actual finished qualifying strip geometry and full source/native/hardware/gate admission, without assumed thickness,µm correction or commercial SKU transfer."
    source_ids:
      - wco-hs2022-ch54
      - grace-single-hole-2015
  - rule_id: validate_whole_route
    applies_to: "foreground_dataset_conformance"
    rule: "Check full production/recovery/utility/treatment/material/species interfaces and real linked producers; resolve actual missing atomic identities/methods before study qualification."
    source_ids:
      - jrc-polymers-2007
  - rule_id: validate_event_vectors
    applies_to: "foreground_dataset_conformance"
    rule: "Check all three ledgers, original positive Q, full physical bridge/history and exactly one attributable division; preserve full contaminated waste and nonduplicated provider demand."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_source_context
    applies_to: "foreground_dataset_conformance"
    rule: "Retain every complete applicability/accounting paragraph below, in both language projections; source summaries alone are insufficient."
    source_ids:
      - grace-single-hole-2015
      - grace-flat-counterexample-2015
      - jrc-polymers-2007
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "The bounded subtype is the actually reported cotton-pulp, single-hole, flat viscose element of CN103233289B example6:1mm width and100D fineness. Example6 explicitly inherits example1, including cotton pulp, solution preparation, metered single-hole coagulation and desulfurization, bleaching, oiling and drying. Claim1 of that same original explicitly describes a circular orifice with a parabolic entry channel. Both source statements remain applicable context: a circular orifice with a reported flat product is an unexplained combination, not a demonstrated physical impossibility. No shaped-die substitution, undocumented forming operation or invented explanation is authorized. Actual lot evidence must establish the reported form and actual hardware/route; a source label alone cannot qualify a different geometry. Sources:grace-single-hole-2015."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "Artificial here means dissolution/regeneration or chemical modification of a natural organic polymer, not merely man-made material. The selected classification argument uses the artificial-strip branch: actual apparent width must not exceed5mm. The separate monofilament branch additionally requires≥67dtex and no cross-sectional dimension>1mm; do not use an unknown thickness to claim that branch. The reported100D is100g/9000m and therefore1000/9dtex exactly; this conversion describes only that case, not a compulsory grade or recipe. Measure actual lot fineness and apparent width at the declared finished state. Do not derive width/thickness from assumed density, denier, flatness or spinneret-hole dimensions. Sources:wco-hs2022-ch54;grace-single-hole-2015."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "The other flat patent CN103215679B really prints millimetres: claim7 gives3–60mm and every worked example gives10–60mm. It does not establish a qualifying narrow worked strip, and its die geometry must not be spliced into the selected embodiment. Grace’s2023 report independently establishes a real333.3–4440dtex/1f flat-viscose family, but no finished width/thickness or exact patent/SKU/factory identity. Manufacturer-family association is not SKU or factory equivalence. No report capacity, patent operating condition, tensile result, moisture, yield, recovery factor or commercial cone weight becomes a default. Sources:grace-flat-counterexample-2015;grace-products-2023;grace-single-hole-2015."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "The bound whole Product is Regenerated cellulose continuous filaments, with actual native Washed and At plant name components; its official Chinese baseName is 再生纤维素连续长丝. Native CPC26190 and preserved source399 are contrary classification metadata retained as unresolved debt, not silently corrected. This broad identity does not specify single-element count, strip width/thickness, cotton origin, viscose versus other regenerated route, drying, oil finish, moisture, supplier or geography. Admission requires actual evidence that the whole terminal product is this regenerated-cellulose continuous single flat element at the declared plant gate, has undergone washing plus the selected finishing chain and matches its actual composition/state. Washed does not prove wet or dry, nor establish a final gate. Do not bind a pure cellulose component, washed intermediate or a different provider’s geography/route to override a hard native field."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Retain the whole actual route from purchased cotton dissolving pulp through alkalisation/pressing/ageing, CS2 xanthation, aqueous-NaOH dissolution, ripening, degassing and filtration, single-hole acid/sulfate/zinc-sulfate coagulation, washing/desulfurization, hydrogen-peroxide bleaching, actual oil finishing, drying and winding. Actual solution recipes and finishing formulation remain measured provider/lot facts. JRC’s wood/multihole and staple examples are technical context, not this single-hole cotton formulation; no staple cutting, sodium-sulfide/hypochlorite substitution or11%moisture is prescribed. Purchased whole aqueous chemicals/finish are weighed once, with assays/water as nested components, never duplicate neat inputs. Cotton pulp requires complete actual upstream production and transport burdens; native cellulose is not its whole-pulp provider proxy. Sources:jrc-polymers-2007;grace-single-hole-2015."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Actual recovery, ventilation, vacuum, cooling, bath recirculation, effluent treatment and finishing auxiliaries remain included with their real loads and outlets. CS2 condensation, carbon adsorption, H2S washing/oxidation, salt crystallisation or zinc precipitation are alternative source examples, not assumed installed equipment or efficiencies. Internal recovered CS2, bath liquor and water circulate with separate whole-stream/component/stock ledgers and cancel at the consolidated boundary; only actual fresh imports and external exports are exchanges. A recovered sale product requires actual chemical form, hydrate/purity, water and market function; no presumed salt/sulfur output or avoided-production credit. Add every genuinely present reagent, fuel, adsorbent, catalyst, chemical, waste and emission as its own atomic row before study qualification. Sources:jrc-polymers-2007;ilcd-allocation-2010."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "Utility and treatment producers require complete actual linkage: actual steam/electricity/cooling interfaces and full producer burdens, without assuming a public generic provider is qualified. Where an on-site recovery, combustion, sulfur-control or wastewater unit is separately modelled, retain matched whole gas/liquid/condensate send/receive measurements, composition and complete reagent/fuel/air/water/energy/emission/waste inventories. This is a linked complete producer, not an off-site assertion or a zero/truncated disposal stub. Actual combustion needs supported air/O2, generated water, carbon/sulfur/nitrogen species and heat interfaces. Do not omit known hardware to fit a purchased-utility label. Sources:jrc-polymers-2007."
    source_ids: []
  - rule_id: validation_rule_12
    applies_to: "foreground_dataset_conformance"
    rule: "Maintain three independent accounts: full physical transfers/stocks, unique first-acceptance reference events Q, and attributable environmental/service vectors. Lock each event’s original net mass and declared moisture/finish basis after complete drying/finishing quality acceptance at the chosen plant gate. Q is the positive sum of unique original events, not another physical output. Reinspection, returns, rewinding, rework and reshipment create no second event. Later moisture/finish gains and losses are actual physical changes, not grounds to restore lost mass into a survivor and also count the loss. Different actual states require explicit component-basis conversion with independent measured evidence."
    source_ids: []
  - rule_id: validation_rule_13
    applies_to: "foreground_dataset_conformance"
    rule: "The general postgate bridge partitions the original accepted basis into disjoint net remaining deliveries, every actual on-site accepted state, irreversible losses and other terminal dispositions; gross loops and returns cancel by original genealogy. Delivery plus closing stock is sufficient only when no other states/exits exist. Full actual raw/WIP/finished/container/asset stocks and all physical transfers remain recorded separately, including inherited preperiod production history. Attribute actual opening WIP vectors and all incurred failed/zero-output/rework loads once; carry substantiated closing WIP vectors to their future cohort and keep postgate services with the original accepted cohort/Q. An aggregate upstream provider already embedding a history must not be added to the decomposed same history. Zero or unknown Q preserves raw totals and unresolved results, never division or deletion."
    source_ids: []
  - rule_id: validation_rule_14
    applies_to: "foreground_dataset_conformance"
    rule: "Maintain independent whole-mass and C/S/Na/Zn balances plus actual cellulose, solute, species, moisture and finish subledgers. Cellulose/xanthate, CS2, H2S, acid/alkali and bleach are reactive; do not conserve each reacting species across the plant. Free water in supplied solutions, steam/condensate, evaporated water, crystal water and actual reaction-water formation/consumption require distinct evidence and actual reaction extents. Do not infer two unknowns from a fitted closure or force theoretical chemistry to supply a recipe/yield. Gas amounts use concentration times matched integrated gas volume, or integration of a measured rate; never multiply an integrated volume by time again. COD is an indicator, not a specific organic species or extra wastewater mass."
    source_ids: []
  - rule_id: validation_rule_15
    applies_to: "foreground_dataset_conformance"
    rule: "At every actual final environmental outlet, identify each emitted species and medium separately after real controls. Raw gas sent to a treatment producer is one whole physical interface with nested composition, not an air emission of the same CS2/H2S again; final receiver/provider releases belong once. The same applies to wastewater transferred for treatment versus actual final water discharges and their zinc/sulfate subledgers. Preserve actual recovery losses, fugitive and upset sources, carrier air and water evidence. Unknown specific identity, provider or sampling uncertainty remains open and must be resolved for the concrete study, without zeros, fixed abatement rates or fabricated closure emissions. Sources:jrc-polymers-2007."
    source_ids: []
  - rule_id: validation_rule_16
    applies_to: "foreground_dataset_conformance"
    rule: "Included winding bobbins and filtration cloth are whole service articles with actual material/dimension/mass/stock histories, not assumed per-item weights or lives. Record received, returned, installed, spare, delivered, scrapped and retained whole articles and all contaminated receiver transfers. One discarded contaminated cloth/bobbin includes substrate, retained viscose/finish/liquor and water exactly once. Dry substrate and contaminants are nested components, not separately fabricated waste exchanges unless physically separated before the boundary. Product net Q excludes every article/tare; all genuine additional packaging materials must have separate delivered/returned/scrapped interfaces before dataset qualification."
    source_ids: []
  - rule_id: validation_rule_17
    applies_to: "foreground_dataset_conformance"
    rule: "For shared articles/waste, record the actual one whole receiver transfer and full actual treatment-provider quantity once, separately from known physical cohort/component provenance and evidenced nonoverlapping per-cohort service/burden vectors. The modelled amount is attributable A/Q, while the whole physical amount is Qt and its analytical display Qt/Qanalysis; Qt/Qanalysis is not automatically each cohort’s treatment demand. Full physical composition remains at the provider interface even when burden shares differ. No service share shrinks actual exported mass or recharges the full transfer to every cohort. Unknown share, compatible provider unit, prior cohort or nonoverlap remains unresolved."
    source_ids: []
  - rule_id: validation_rule_18
    applies_to: "foreground_dataset_conformance"
    rule: "Synthetic accounting test only, not empirical default: one actual contaminated filter10kg contains8kg substrate and2kg retained pigment and serves old/new cohorts. A supported25%new/75%old treatment-service split gives2.5kg-equivalent and7.5kg-equivalent demands (or corresponding burden vectors) with compatible provider units; newQ100/oldQ200 gives0.025/0.0375kg-equivalent per reference. The receiver still gets10kg once. No2.5kg physical export, extra2kg powder exchange, duplicate10kg demand, assumed fraction or lifetime is created. Apply this precision to sack/bobbin waste only when its actual shared history warrants it."
    source_ids: []
  - rule_id: validation_rule_19
    applies_to: "foreground_dataset_conformance"
    rule: "Avoid allocation by actual subdivision/direct attribution where possible. Assign remaining exchanges by demonstrated determining physical causality, separately for each exchange and served function; use justified exit-state market values only for residual multifunctionality lacking such a relation. Internal recovery, returned bobbins, waste treatment, stock carry and failed output are not automatic coproducts or substitution credits. Preserve all actual physical coproduct and waste quantities regardless of environmental shares, and disclose provider scope, time/geography and sensitivity. Sources:ilcd-allocation-2010;jrc-polymers-2007."
    source_ids: []
  - rule_id: validation_rule_20
    applies_to: "foreground_dataset_conformance"
    rule: "Complete reported claim1 context, CN103233289B PDF2 (source description only, all numbers are reported conditions/performance and never defaults): cellulose-fibre pulp is the raw material; solution preparation—spinning—post-treatment obtains a single viscose element. A: pulp is steeped, aged, xanthated, dissolved, degassed and filtered; solution alpha-cellulose6–10%, alkali5–7g/L, viscosity40–70s, ripeness4–8mL. B: feed piping conveys solution to the spinning machine, a metering pump doses it through a single-hole spinneret under pressure into a thin stream and coagulation bath to form raw strand; jet stretch+60%–+80%; parabolic entry-channel shape; spinning30–80m/min; the orifice is circular and entry-channel length/orifice diameter ratio1.0–1.5:1. C: desulfurization, bleaching, oiling and drying give viscose monofilament; reported fineness50–6000D, strength≥75cN, dry breaking tenacity1.5–2.0cN/dtex, wet1.0–1.5cN/dtex, dry break elongation15–20%. This complete circular-hole qualification is preserved without converting source operating ranges into required process settings or performance promises. Sources:grace-single-hole-2015."
    source_ids: []
  - rule_id: validation_rule_21
    applies_to: "foreground_dataset_conformance"
    rule: "Complete reported example1 context, CN103233289B PDF5 paragraphs0036–0048 (source description only): cellulose pulp undergoes solution preparation, spinning and post-treatment to form a single viscose element; solution preparation is steeping, ageing, xanthation, dissolution, degassing and filtration. Metered solution is fed by pipe/pump through a single-hole spinneret under pressure into a thin stream and coagulation bath. Reported jet stretch+60%, parabolic entry channel and spinning30m/min. Raw strand is desulfurized, bleached, oiled and dried. Pulp is cotton pulp. The reported product is70D, strength75CN, dry breaking tenacity1.5CN/dtex, wet1.0CN/dtex and dry break elongation15%. Original uppercaseCN notation is retained as reported, without a performance conversion or default. Example6 inherits this full route and cotton origin while changing its specifically stated conditions/product; it does not inherit the wood/bamboo origins of examples2/3. Sources:grace-single-hole-2015."
    source_ids: []
  - rule_id: validation_rule_22
    applies_to: "foreground_dataset_conformance"
    rule: "Complete reported example6 context, CN103233289B PDF6 paragraphs0079–0085 (source description only): “basically the same as example1, on this basis” the entry channel is parabolic; jet stretch+76%; spinning65m/min; coagulation bath sulfuric acid100g/L, sodium sulfate200g/L, zinc sulfate20g/L and40°C. The obtained viscose monofilament is flat, width1mm, fineness100D, strength78CN, dry breaking tenacity1.8CN/dtex, wet1.3CN/dtex and dry break elongation16%. These are one reported embodiment’s conditions and claims, not measured current industrial inventory, lot acceptance tolerances, recipe/yield defaults or automatic site/SKU proof. Lot qualification must document its actual measured geometry/state and matching full route, and disclose any departure needing independent evidence; the original width cannot be silently changed to micrometres. Sources:grace-single-hole-2015."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production inventory"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual matching narrow finished flat-viscose strip with complete qualified suppliers/linked producers and study evidence."
  excluded_use: "All-artificial market average; other routes/forms; food/medical/certification claims; unresolved actual core identity/method or provider fit."
  required_metadata: "All ordered qualifiers, actual site/time/geography, original gate/Q, full source/native qualifications, formulation/moisture, stocks/history, species/water and linked-provider boundary."
  required_quality_disclosure: "Actual methods/uncertainty, unresolved specific UUIDs/provider units, missing history or shares, source limitations and independent review/study status."
  update_trigger: "Change of route/hardware/form/state/gate/finish/geometry/provider or material new source/analytical evidence."
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations, CPC Version3.0 Explanatory Notes,30June2025, complete page175,35550/3556/35560. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Current35560 title and adjacent filament-yarn context. This page gives no numerical geometry definition and establishes no accepted PCR mapping."
  - id: "wco-hs2022-ch54"
    type: "official_guidance"
    reference: "WCO, HS2022 Chapter54, Note1 and heading5405. https://www.wcotradetools.org/en/harmonized-system/2022/en/1154"
    used_for: "Artificial/synthetic distinction; separate monofilament≥67dtex and maximum cross-sectional dimension≤1mm branch versus strip apparentwidth≤5mm branch. Classification limits are not plant operating or inventory defaults."
  - id: "grace-products-2023"
    type: "literature"
    reference: "宜宾丝丽雅股份有限公司,2023可持续发展报告, PDF8/printed11–12,雅菲特长丝/Raffia product table. https://www.cn-grace.com/Uploadfiles/Files/2024-8-27/20248271758132479.pdf"
    used_for: "Real333.3–4440dtex/1f flat viscose product family. No width/thickness or patent/SKU/factory linkage; left-hand ordinary filament capacities cannot be transferred to this family. Capacity is not inventory/yield."
  - id: "grace-single-hole-2015"
    type: "literature"
    reference: "CN103233289B,一种粘胶单丝的生产工艺,22April2015, claim1 and complete examples1/6, paragraphs0036–0048/0079–0085,PDF2/5/6. https://patentimages.storage.googleapis.com/1d/56/76/e6731b38e838c6/CN103233289B.pdf"
    used_for: "Primary reported flat1mm/100D embodiment, cotton-pulp inheritance, complete wet-spinning/desulfurization/bleaching/oiling/drying chain AND circular-orifice claim qualification. No invented forming mechanism, recipe/yield/performance default, or commercial-lot equivalence."
  - id: "grace-flat-counterexample-2015"
    type: "literature"
    reference: "CN103215679B,一种粘胶扁平单丝的生产工艺,11February2015, claim7 and worked examples1–14,PDF2/5–9. https://patentimages.storage.googleapis.com/83/48/27/6b6806ceebd8c5/CN103215679B.pdf"
    used_for: "Original actually prints3–60mm claimed width and10–60mm worked widths. Not a micrometre typo or proof of a≤5mm worked strip; its shaped die is not spliced into CN103233289B."
  - id: "jrc-polymers-2007"
    type: "official_guidance"
    reference: "European Commission, Reference Document on BAT in the Production of Polymers,August2007,§§11.2.1/11.2.3/11.3,Figure11.1,§§12.7.2–12.7.7. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/pol_bref_0807.pdf"
    used_for: "Independent viscose chemistry, filament-versus-staple branch, washing/finishing/drying, CS2/H2S recovery, salt/zinc/wastewater and utility interfaces. Wood pulp/multihole examples do not replace the cotton/single-hole case; staple Na2S/NaOCl,11%moisture and all historical numbers are not this route defaults."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC,ILCD Handbook: General guide for LCA—Detailed guidance,FirsteditionMarch2010,§7.9.3.1–7.9.3.2,printed257–258/PDF277–278. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation: subdivision/direct attribution then exchange-specific determining physical causality; otherwise justified market values of cofunctions at their actual exit condition. No universal mass/equal/recovery credit rule."
