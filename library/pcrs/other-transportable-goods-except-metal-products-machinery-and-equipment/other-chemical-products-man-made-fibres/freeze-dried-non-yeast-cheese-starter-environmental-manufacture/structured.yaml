      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| validate_whole | accepted_culture | Require all complete Section5 whole-product/native/actual food-grade conditions and all17ordered qualifiers; no pure biomass, CFU, frozen or different-purpose substitute. | novonesis-white-classic; unsd-cpc3-2025 |\n| validate_material_unit | mrs_preparation; fos1_preparation | Audit actual physical preparation identity, purchased versus owned mode, complete source-qualified provider extent, measured bundle conversion and exclusive aggregate/disaggregated history. A source proxy or promised future material basket does not close this boundary. | dataverse-preparations-v2 |\n| validate_gate | accepted_culture | Audit unique first actual dairy availability acceptance, complete producer-to-dairy quantity/provider conversion and original-Q0 disjoint postgate bridge, all stocks/returns and later additions; no duplicate retest/event or restored-loss mass. Unknown/zero Q prevents normalized completeness. |  |\n| validate_physical | all inventory rows | Independently reconcile whole wet/element/species-G-C/water-phase ledgers, real utilities/enthalpy/refrigerant interfaces and one whole contaminated receiver event with nested substrate/contents before allocation. | gagneten-lab-lci-2025; dataverse-main-v2 |\n| validate_history | all inventory rows | Require complete raw/WIP/FG/asset/pack stocks and own inherited work once, actual matching provider units and nonoverlapping embedded history, original cohort later services and full physical recipient loads. |  |\n| validate_methods | all inventory rows | Apply complete Section5 nonoperational method/matrix/source-transfer limits. Actual essential method gaps stay unresolved; no CFU/COD/dry-PM shortcut, future SOP, finite consistency pass or source recipe establishes scientific/study/translation approval. | gagneten-lab-lci-2025; dataverse-main-v2 |\n\n"
