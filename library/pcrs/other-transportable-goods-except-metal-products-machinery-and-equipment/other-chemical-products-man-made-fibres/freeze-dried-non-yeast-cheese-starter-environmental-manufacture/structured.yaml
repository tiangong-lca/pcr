      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual purchased and/or owned-prepared named whole inputs with complete linked upstream work, all opening raw/WIP/FG and service histories |\n| starting_condition_role | foreground_input_gate |\n| product_classification_scope | Narrower35273 non-yeast freeze-dried cheese-starter environmental manufacture |\n| recursive_input_rule | Purchased finished starter is not newly manufactured; retain genuine upstream history and review replacement of manufacturing scope. Internal preparation/culture loops are paired transfers, not new Q. |\n| upstream_dataset_requirement | Complete matched actual preparation/material/utility/equipment/pack/receiver providers with compatible physical state, reference unit and disjoint history; owned preparation remains included foreground |\n| disclosure | Actual named preparation mode/provider extent and measured bundle-mass conversion; actual dairy availability gate/cohort and independent producer event bridge; full physical and burden ledgers; every actual method/quantity/provider gap |\n\nThis environmental method covers actual whole freeze-dried non-yeast bacterial cheese starter, including its real protective preparation, carrier and residual moisture, ready for the declared direct cheesemaking use. Novonesis White Classic establishes a real commercial cheese-starter family and a freeze-dried option; its frozen option is excluded. It does not disclose that commercial product’s recipe, strain or package construction, and this method does not reconstruct its factory inventory. Actual nonpathogenic food-use identity, strain/grade certificate, supplied state and acceptance specification must positively match the study. Exclude vaccines, toxins, pathogens, clinical products, yeast, cell cultures, dead biomass sold as food/feed, media without the starter organism, frozen/liquid starter, and downstream cheesemaking. No clinical benefit, potency equivalence, safety approval or equal cheesemaking performance follows from a kilogram.\n\nThe selected whole Starter culture Product is a cheesemaking auxiliary, with current complete name components At dairy plant, GLO and Auxiliary input, direct inoculation for cheesemaking. Its official Chinese baseName is 发酵剂. The comment gives no quantified amount. CAS, molecular formula and geography.locationOfSupply are absent; the sole property is Mass with reference coefficient1, not density, cell dry-mass fraction or CFU equivalence. It imposes no strain, freeze-dried form, supplier recipe or manufacturer-country specification. GLO is the dairy-delivery context, not a qualified global producer or manufacturer country. The At dairy plant availability qualifier fixes this method’s reference point. A producer-gate subtotal cannot claim that availability until the complete actual source-matched producer-to-dairy provider, physical quantity and stock/loss bridge below is established. Admit only a real whole direct-cheese-starter subtype; the broad identity supplies no process quantity, supplier background, CFU conversion or environmental benefit. Current CPC3 explanatory notes explicitly define35273 through HS2022 3002.41–49 and3002.51/59; non-yeast cultures are within its wording. The present narrow food-culture boundary does not cover the entire subclass or establish an accepted mapping, clinical approval or product-specific legal ruling.\n\nRepresent the main organic manufacturing inputs through real named physical interfaces, not a utility-only manufacturing box. The Gagneten article and the actual Dataverse V2 main inventory reference separately modelled MRS broth and protective-preparation units; the original media/solutions workbook contains their upstream environmental inputs and the equipment/waste links. MRS broth is a named whole nutrient preparation. The FOS1 protective preparation is the specific source-defined fructo-oligosaccharide preparation unit, not a selector for every protectant or every FOS grade. Admit the actual study only when these named interfaces genuinely fit its material/state and complete source-qualified provider extent; other real formulations require their own exact cards and reviewed boundary. Neither the commercial cheese-starter page nor this synthesis asserts that White Classic uses these units or a particular laboratory SKU. The source pilot case establishes environmental material forms and accounting, not a universal industrial recipe.\n\nDistinguish purchased preparation from an actual owned onsite preparation unit. A purchased MRS broth or FOS1 preparation has one whole receipt and a genuine complete upstream provider. An owned preparation instead retains its actual separately acquired ingredients, water, utilities, QC, parts, wastes and inherited work in its included environmental unit; its preparation-to-manufacturing interface is an internal paired transfer. Do not invent a purchase, hide onsite preparation or add both complete unit burdens and the same disaggregated ingredient/service history. Source case labels and component/provider references must agree: an original case labelled FOS6 while referring to FOS1 is an unresolved source variant, not proof of interchangeable preparations. Exclude that case from transfer unless reconciled for the actual material/provider; no whole-dataset repair is required. Source labels Protein1/2, Polyol, Sodium and database proxies are not actual procurement specifications or approved flow matches. FOS-unit analytical reagents/equipment/waste belong to its environmental service extent and are not automatically ingredients of the supplied protective preparation. Match the real provider’s complete boundaries and disjoint work; the source bundle unit p has no assumed kg meaning. Measure the same actual bundle’s net physical preparation mass before converting provider demand. Unmatched provider extent or unknown bundle conversion keeps that result unresolved.\n\nThis is high-level environmental inventory guidance. It supplies no culture recipe, ingredient proportions, inoculation/growth protocol, biological operating sequence, separation/purification instruction, genetic modification, activity enhancement, inactivation procedure or biological operating parameters. Include every actual environmental load of owned preparation, manufacturing conversion, stabilization, quality work, filling/sealing, cleaning, controls, storage and handling, including outsourced and intersite operations with real upstream burdens. Confidential biological operations remain opaque; their material/utility/outlet and stock records do not disappear. Do not replace complete manufacture with purchased finished culture plus repacking, omit failed campaigns or inherit the source study’s transport/use/disposal omissions. Record actual transport to the declared gate and actual later included cohort services separately.\n\nFix Q at the actual native availability point: net whole freeze-dried starter kg at unique first quality-accepted availability at the declared dairy-plant input gate. Record the real dairy/site, physical handover/receipt point, state/specification, time, net weight and unique acceptance event; lock original dairy cohort Q0. Producer final quality release P is a separate event registry with its original IDs, time and mass, not dairy availability or reference Q. Never rename or relabel producer events as dairy acceptance. Pre-gate manufacturing, producer storage, handling, actual transport and conditioning remain included with their real losses and carried burdens. Retests, returns, rework/reacceptance and old accepted-stock dispatch create no new dairy Q. Q is an event account, not another physical export. Partition original dairy Q0 into disjoint net remaining deliveries/custody, all real onsite accepted states including quarantine/rework, irreversible losses, samples and terminal dispositions on the original acceptance basis. Transfers/returns are not second fates; external additions stay separate; do not restore lost water into survivors and also count the loss. Later included supplier-custody/return services retain original Q0; downstream cheesemaking is excluded. Unknown/zero actual dairy Q preserves raw totals and unresolved per-kg results.\n\nKeep the complete physical ledger of external receipts/returns/deliveries/outlets and opening/closing raw ingredients, preparations, WIP, accepted/quarantined FG, residual liquor, condensate, packaging, refrigerant and installed assets. Pair actual internal transfers at equal physical quantity without cancelling their real work. Separately carry burden vectors for own opening raw/WIP/FG and inherited work, new operations, actual provider supplies, closing stocks and terminal dispositions. Own inherited foreground work is carried once; a complete provider aggregate and its embedded decomposition are exclusive alternatives. Old accepted FG, returned culture and rework retain original genealogy, actual upstream history and subsequent services, never free input or new Q. Source pieces/equipment counts and stage alignment factors are not actual product mass, lifetime, yield or additional output.\n\nUse whole commercial/prepared mixtures once, with actual water/carrier/solute/impurity fractions as nested subledgers. Extra separately supplied glucose, sodium hydroxide or cleaning preparation cards apply only outside an already complete preparation-unit envelope; never add the same underlying material twice. Supplied starter kg is not pure bacterial dry matter, viable-cell count, CFU, enzyme activity or pre-stabilization protected mass. Volume/count conversion needs measured same-state density or representative actual item mass with uncertainty; no water-density, source package size or biological-count conversion default. Product-quality certificates constrain actual acceptance, not a numerical mass-to-potency or efficacy equivalence.\n\nConserve actual whole wet mass and appropriate C/H/O/N/P/S and relevant inorganic-element ledgers before allocation, while keeping actual species and biological transformation generation/consumption G/C separate. Do not conserve glucose, protein, cells, water or a reactive molecule by assumption through manufacturing. Establish actual transformed species, reaction-water changes and real gaseous transfers independently; neither a COD result nor a closure residual proves a chemical species, reaction water, carbon dioxide generation or oxygen consumption. Distinguish supplied carrier water, free/structural water, physical freeze-drying water/ice/condensate, humidity and genuine environmental releases. Whole liquid waste and collected condensate contain measured constituents once; their water, organic solids, analytical COD or microbial indicators are nested and not duplicate waste exports. No hypothetical aerosol, gas, perfect capture, biomass yield or reaction-water remainder closes the balance.\n\nThe bounded utility route uses actual external AC, steam, water/cooling and compressed-air interfaces with genuine complete producers and delivery losses. Owned preparation and manufacturing utility consumption must be separated from already included provider-unit meters. Preserve native electricity Net calorific value/MJ; measured kWh×3.6 is electrical unit conversion, not fuel heat. Record steam mass/state/enthalpy, direct-contact water fate and any actual condensate return separately; cooling supply/return, makeup, blowdown and recirculation are distinct, not all supply consumed. Include actual stabilization/refrigeration, vacuum, controls, QC, cleaning, packing, standby and rework. R134a cards apply only to a positively identified actual circuit. Reconcile actual R134a component quantities in charge, purchases, recovery and real leaks; any transferred commercial/recovered mixture is still one whole physical stream, with oil/water/other constituents nested and no purity default. Whole receiver mass is not automatically R134a mass. No source rated power, assumed leak rate, residence time, temperature, equipment lifetime or energy intensity is adopted. Actual onsite combustion/other utilities require complete exact additional interfaces and reviewed scope, not an anonymous zero or hidden upstream service.\n\nConfirm actual regional primary pouch and carton construction; source product images do not prove a BOM. The specific LDPE bag and corrugated carton cards are conditional physical articles, not universal packaging defaults. Record measured tare/count, empty/filled opening/closing stocks, external deliveries, serviceable returns, customer returns and separately exported scrap for each article, apart from product net mass. A whole contaminated pouch, glass bottle or vessel removal contains substrate plus retained culture, liquor and water once; those are nested components, never companion exported culture/liquid unless physically separated before the boundary. Keep the full actual receiver transfer even when service is attributed among cohorts: a10kg event with25% service allocation remains10kg physical and2.5kg service, not2.5kg physical or10kg charged to every cohort. Preserve actual treatment provider and nonoverlapping service vectors on original Q0; reuse creates no new manufacture, cofunction or avoided-production credit.\n\nTrace actual borosilicate process bottles and stainless-steel vessel assemblies by construction, measured mass/count/dimensions, installation/removal/repair, physical fleet stocks and original served cohorts. Complete actual provider manufacture/repair demand and included equipment histories must use compatible units and genuine service evidence, independently from physical installed mass. Do not assign the whole new installed asset as current waste or infer replacement from source lifetime/power assumptions. Any real consumable, filter, seal, lubricant or cleaning chemical not already represented in a complete linked unit needs its own exact card before study completeness. Actual laboratory/quality-provider scope remains explicit; an aggregate provider and its full disaggregated reagents/wastes cannot both be charged.\n\nCollect physical masses by calibrated weighing and traceable stock/receiver records; integrate real utility meters with actual state/unit conversions. Retain representative moisture/composition evidence, supplier specifications, uncertainty and complete genuinely applicable outlet procedures. Measured microbial/quality indicators do not convert to kg or establish the identity/mass of an emitted aerosol. Source handling cautions establish neither an actual aerosol release nor perfect capture. Identify each actually released species/phase/medium and add its exact row before a complete study; unmeasured is not zero, COD is not a compound, and dry-PM/CFU/total-organic shortcuts do not establish whole wet culture release. An unknown essential actual matrix procedure remains a genuine barrier, not waived by future SOP promises, ordinary calibration or finite checks. This methodology does not qualify any actual factory study, legal food-use provider or scientific/translation acceptance.\n\nProducer release P, dispatched quantity and dairy-accepted Q are independently measured whole-formulation masses and may differ. Retain complete producer/raw/WIP/FG and in-transit opening/closing stocks, paired handovers, receipt/rejection/return states, actual carrier/moisture changes, pre-gate losses/samples and later additions. Reconcile each real shipment/cohort physically through the actual route to the real dairy point; do not assume P=Q or restore dry/wet mass to force equality. Transfer only genuine nonoverlapping producer/preparation/own inherited burden vectors plus actual storage, handling, freight, conditioning and receiving burdens to the physically matched accepted dairy cohort; unreceived/rejected/still-held goods keep their actual histories and dispositions. A producer-normalized subtotal remains labelled at its own point and must be converted using demonstrated actual cohort/provider demand and the independent dairy Q, not a universal loss/yield factor or automatic P/Q burden shift. Quantify actual storage by a compatible real provider reference and measured occupied volume/actual elapsed time or another demonstrated service basis, retaining unsold stocks and their own burdens without a default duration or temperature. Where a real freight or storage provider already includes vehicle, fuel, refrigeration, handling or refrigerant history, do not add its embedded decomposition again. Road-service cards are conditional on actual documented road legs, never an assertion of route, distance or refrigeration; every real other mode/interface needs its own exact provider/card before completeness. Document actual colocated transfer if no transport leg exists. Apply actual supplier-required storage/conditioning, including every real cold-chain stage, without inferring that freeze-dried always means frozen or refrigerated. Neither a native UUID nor a receiving stub supplies these missing stages or makes a factory kilogram dairy-available.\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_main_material | starter_manufacture | Retain the complete actual named preparation interfaces and provider/owned-unit extent above; no utility-only box, invented purchase, R&D food approval or double included decomposition. | gagneten-lab-lci-2025; dataverse-main-v2; dataverse-preparations-v2 |\n| boundary_complete | starter_manufacture | Include all actual preparation/manufacturing/stabilization/QC/pack/stock/utility/outlet work and actual additional atomic materials before study completeness, retaining complete nonoperational Section5conditions. | gagneten-lab-lci-2025; dataverse-main-v2; dataverse-equipment-v2 |\n\n"
