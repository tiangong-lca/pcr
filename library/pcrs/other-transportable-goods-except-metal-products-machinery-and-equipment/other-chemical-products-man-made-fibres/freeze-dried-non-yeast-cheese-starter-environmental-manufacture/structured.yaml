allocation_rules:
  - rule_id: sole_function
    applies_to: "starter_manufacture"
    rule: "The actual whole starter is the sole reference function. Packaging transfers, water return, recovered refrigerant and rejects are physical fates, not automatic cofunctions, biological equivalence or avoided-product credits."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: causal_service
    applies_to: "all inventory rows"
    rule: "Trace exclusive actual batches/submeters before justified shared-service allocation. Keep physical quantities and provider/own unit histories separate, with original Q0 and disjoint carried vectors. Allocation never changes physical mass, species, Q or receiver loads."
    source_ids:
      - jrc-ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "starter_manufacture"
      flow_role: "accepted_culture"
      record_type: "actual_environmental_raw_records"
      raw_fields: "product/grade/state; unique unit batch event; actual dairy availability point/time; independent producer P and dairy Q event IDs; measured dairy gross/tare/net; actual receipt/quality decision; actual carrier/moisture; original Q0; all later states/additions/losses/returns/samples"
      collection_method: "Calibrated paired gross/tare weighing of the actual whole preparation and package configuration at the declared actual dairy receipt/availability point; maintain independent producer and dairy receipt/first-acceptance registries, the complete producer-to-dairy physical/provider conversion, and exhaustive original dairy-basis postgate bridge. Retests/returns retain original IDs, not new Q."
      unit: "kg"
      frequency: "Each actual transfer/event or bounded meter interval and stock boundary"
      temporal_coverage: "Complete campaign with inherited and subsequent original-cohort history"
      site_scope: "one declared actual dairy-plant input availability/first-acceptance gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; real net weights; product specification; uniqueness; complete fates; no activity/kg substitution"
    - protocol_id: cp_preparation
      process_id: "starter_manufacture"
      flow_role: "mrs_preparation; fos1_preparation"
      record_type: "actual_environmental_raw_records"
      raw_fields: "exact named whole preparation/state; actual owned or purchased mode; physical interface and net mass; supplier or included owned-unit ID; provider reference/unit; actual bundle mass; complete upstream ingredient/utility/QC/asset/waste coverage; disjoint histories; stocks/transfers"
      collection_method: "Weigh actual whole preparation interface; inspect complete actual supplier/owned environmental unit and source-qualified extent, including all its raw ingredient/service/waste records without disclosing biological instructions. Pair owned transfers and retain work. Match bundle-to-mass from actual same-unit evidence, not source p defaults."
      unit: "kg"
      frequency: "Each actual transfer/event or bounded meter interval and stock boundary"
      temporal_coverage: "Complete campaign with inherited and subsequent original-cohort history"
      site_scope: "actual matched MRS broth/FOS1 physical preparation units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "complete provider/owned-unit boundary; unit conversion; physical bridge; own/provider aggregate/decomposition exclusivity; no laboratory-SKU food approval inference"
    - protocol_id: cp_material
      process_id: "starter_manufacture"
      flow_role: "individual separately supplied material"
      record_type: "actual_environmental_raw_records"
      raw_fields: "exact supplied chemical/formulation; real grade/lot; whole wet mass and actual carrier/assay basis; receipts/issues/returns/raw and WIP stocks; parent preparation envelope; actual upstream supplier"
      collection_method: "Net-weigh each actual separate whole supply; preserve supplier composition and material stocks. Activate only outside already included preparation/provider history; components of a whole supply remain nested and actual alternatives need exact cards."
      unit: "kg"
      frequency: "Each actual transfer/event or bounded meter interval and stock boundary"
      temporal_coverage: "Complete campaign with inherited and subsequent original-cohort history"
      site_scope: "actual individual extra material interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated mass; exact grade/composition; genuine provider; no duplicate embedded ingredient or invented purchase"
    - protocol_id: cp_utilities
      process_id: "starter_manufacture"
      flow_role: "each utility and thermal return"
      record_type: "actual_environmental_raw_records"
      raw_fields: "actual meter/interface/producer; electrical kWh; water/steam/air mass or volume with state; steam enthalpy/condensate; cooling supply/return/makeup/blowdown; preparation envelope; actual heat and uncertainty"
      collection_method: "Retain unnormalized submeter and producer/delivery records across complete actual manufacture, stabilization, QC, cleaning, packing, storage/idle/rework; separate already embedded unit services. Reconcile water/steam and actual energy states with independent evidence, no forced heat residual or rated consumption."
      unit: "kg; MJ"
      frequency: "Each actual transfer/event or bounded meter interval and stock boundary"
      temporal_coverage: "Complete campaign with inherited and subsequent original-cohort history"
      site_scope: "actual bounded external utility interfaces and complete linked producers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; actual state/unit/provider; source3.6electrical conversion; real heat and water fate; nonoverlap"
    - protocol_id: cp_pack
      process_id: "starter_manufacture"
      flow_role: "individual bag/carton transfers and waste"
      record_type: "actual_environmental_raw_records"
      raw_fields: "actual regional article/BOM; measured tare/count; empty/filled opening/closing stocks; receipt/delivery/serviceable return/customer return/scrap; whole contaminated receiver event; nested substrate/culture/liquor/water; original cohort service drivers"
      collection_method: "Weigh paired actual empty/full articles and each external physical transfer. Reconcile substrate stock separately, weigh whole contaminated exports once and retain actual recipients plus disjoint service attribution. No source image/material/pack-size assumption."
      unit: "kg"
      frequency: "Each actual transfer/event or bounded meter interval and stock boundary"
      temporal_coverage: "Complete campaign with inherited and subsequent original-cohort history"
      site_scope: "actual regional starter bag and carton or explicitly reviewed separate alternatives"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "BOM and tare proofs; packaging physical bridge; whole/nested receiver closure; original Q0; no duplicate waste"
    - protocol_id: cp_asset
      process_id: "starter_manufacture"
      flow_role: "bottle; vessel and whole removals"
      record_type: "actual_environmental_raw_records"
      raw_fields: "exact actual assembly/material/configuration; measured mass/dimensions/count; physical fleet; install/remove/repair; remaining life history without default; original served cohorts; provider unit; retained culture/liquid; whole removal/recipient"
      collection_method: "Survey actual physical assets and weigh whole contaminated removals with nested substrate/contents. Attribute compatible manufacture/service using real history and original cohorts separately from fleet mass; preserve included provider equipment boundaries."
      unit: "kg"
      frequency: "Each actual transfer/event or bounded meter interval and stock boundary"
      temporal_coverage: "Complete campaign with inherited and subsequent original-cohort history"
      site_scope: "actual borosilicate bottles/stainless vessel assemblies only when documented"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "actual measured configuration; workorders; fleet and whole waste closure; provider history/units; no assumed lifetime"
    - protocol_id: cp_refrigerant
      process_id: "starter_manufacture"
      flow_role: "r134a; recovered_r134a; r134a_air"
      record_type: "actual_environmental_raw_records"
      raw_fields: "actual circuit identity; refrigerant certificate; opening/closing charge and stocks; supply/topup; recovery; maintenance transfer; real release/compartment; dates; uncertainty; original served cohorts"
      collection_method: "Reconcile measured actual R134a circuit/material records and independent leak evidence. Separate installed charge, remaining stock, recovered/exported mass and emission; retain actual producer/reclamation services once, never source leakage or lifetime factors."
      unit: "kg"
      frequency: "Each actual transfer/event or bounded meter interval and stock boundary"
      temporal_coverage: "Complete campaign with inherited and subsequent original-cohort history"
      site_scope: "positively identified actual R134a refrigeration only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "chemical identity; circuit stock/maintenance evidence; actual release method and uncertainty; provider original cohorts"
    - protocol_id: cp_liquids
      process_id: "starter_manufacture"
      flow_role: "spent_liquor; washwater; dryer_condensate"
      record_type: "actual_environmental_raw_records"
      raw_fields: "actual separate stream/phase; whole wet mass or actual density/volume; source and recipient; nested water/solids/species; collection/hold/export states; whole shared event; treatment and cohort history"
      collection_method: "Measure each actual whole liquid/condensate recipient transfer and its stocks; retain representative composition and complete applicable procedures without converting COD or microbial indicators into chemical mass. Never duplicate liquid retained in whole package/asset wastes."
      unit: "kg"
      frequency: "Each actual transfer/event or bounded meter interval and stock boundary"
      temporal_coverage: "Complete campaign with inherited and subsequent original-cohort history"
      site_scope: "actual collected whole liquor/washwater/condensate and real receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh/flow calibration; density/state; applicable composition evidence; whole/nested closure; recipient treatment scope"
    - protocol_id: cp_residue
      process_id: "starter_manufacture"
      flow_role: "rejected_culture"
      record_type: "actual_environmental_raw_records"
      raw_fields: "parent batch and acceptance history; actual separate whole rejected formulation; supplied moisture/carrier; sample/hold/rework/export; recipient and original burdens"
      collection_method: "Weigh actual separate whole rejected starter, preserve physical fate and original-cohort burdens; internal rework stays paired transfer/stock and contamination already in whole wastes is not a second reject."
      unit: "kg"
      frequency: "Each actual transfer/event or bounded meter interval and stock boundary"
      temporal_coverage: "Complete campaign with inherited and subsequent original-cohort history"
      site_scope: "actual free rejected whole formulation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "actual net weights; moisture/composition; recipient; event genealogy; no duplicate waste"
    - protocol_id: cp_outlets
      process_id: "starter_manufacture"
      flow_role: "water_vapour; actual individually identified releases"
      record_type: "actual_environmental_raw_records"
      raw_fields: "actual interface and phase/species/medium; concentration or independent transferred mass; gas/liquid state and flow/time; captured versus released fraction; complete method/version; uncertainty/detection; source activity"
      collection_method: "Use genuinely applicable complete physical/species procedures with representative outlet coverage and independent phase evidence. Do not infer aerosol presence or kg from CFU/COD/dry residue; any actual additional release requires its exact row and qualified procedure before completeness. Unknown essential method stays unresolved."
      unit: "kg"
      frequency: "Each actual transfer/event or bounded meter interval and stock boundary"
      temporal_coverage: "Complete campaign with inherited and subsequent original-cohort history"
      site_scope: "actual environmental interfaces only; no assumed release or complete capture"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "complete applicable procedure; sampling/flow calibration; recovery/blanks; phase/compartment; no biological quantity conversion"
    - protocol_id: cp_history
      process_id: "starter_manufacture"
      flow_role: "all inventory rows"
      record_type: "actual_environmental_raw_records"
      raw_fields: "raw/preparation/WIP/FG/pack/asset/refrigerant physical stocks; paired transfers; own inherited work; actual supplier/owned provider units; aggregate/decomposition mode; new work; original Q0; terminal and carried vectors"
      collection_method: "Reconcile complete physical bridges separately from burden vectors before normalization. Preserve every original cohort and actual provider scope/unit, carry own inherited work once and keep aggregate versus decomposed unit histories exclusive."
      unit: "kg; MJ"
      frequency: "Each actual transfer/event or bounded meter interval and stock boundary"
      temporal_coverage: "Complete campaign with inherited and subsequent original-cohort history"
      site_scope: "complete real manufacturing and preparation/provider boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stock/genealogy evidence; full upstream coverage; compatible units; causal shared-service drivers; nonoverlap"
    - protocol_id: cp_supply
      process_id: "starter_manufacture"
      flow_role: "road_freight; refrigerated_road_freight; ambient_storage_service; refrigerated_storage_service; actual producer-to-dairy custody"
      record_type: "actual_environmental_raw_records"
      raw_fields: "actual producer/dairy sites and physical points; distinct P/dispatch/receipt/Q events; real route/leg/mode and compatible carrier/provider unit; actual load and distance; empty running; measured storage occupied volume/duration and provider reference; storage/handling/conditioning history; actual refrigeration when present; in-transit stocks/losses/returns/additions and whole state/mass; provider embedded scope"
      collection_method: "Reconcile paired actual shipment and dairy receipt masses/states and complete source-matched providers. Derive tonne-km only from real distance and the actual carrier-compatible payload basis, including package/container tare when that unit requires; preserve actual empty-running and conditioning scope. Do not substitute net product mass for a different carrier payload unit. Quantify warehouse service from actual provider-compatible volume/time and full occupied-capacity history, retaining unsold stocks; no assumed duration or temperature. Activate only evidenced road/storage rows; add exact other real modes/interfaces before completeness. No assumed route, cold-chain setting,1:1producer/dairy mass or source yield."
      unit: "tkm; m3 day; kg; MJ"
      frequency: "Each actual transfer/event or bounded meter interval and stock boundary"
      temporal_coverage: "Complete campaign with inherited and subsequent original-cohort history"
      site_scope: "complete actual producer custody through actual dairy-available first acceptance"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "real receipt/dispatch weighing and genealogy; actual route/provider units; conditioning/temperature history without defaults; stock/loss reconciliation and nonoverlapping producer/carrier burdens"
  calculation_rules:
    - id: normalize
      applies_to: "all inventory rows"
      rule: "Divide each disjoint attributable campaign numerator by positive locked Q; later cohort services use original Q0, while full raw physical totals remain separate."
      inputs:
        - "actual row exchange"
        - Q
        - cp_product
        - "actual row protocol"
      output: "Original numerator unit per 1 kg whole reference flow"
      source_ids: []
    - id: acceptance_bridge
      applies_to: "accepted_culture"
      rule: "Sum unique actual first dairy-available accepted net whole-formulation masses and partition original dairy Q0 into the complete disjoint original-basis fates of Section5; transfers and retests create no event or second fate."
      inputs:
        - "unique acceptance registry"
        - Q0
        - "stock state and fate records"
      output: "Locked event Q and independently reconciled physical fates"
      source_ids: []
    - id: preparation_provider
      applies_to: "mrs_preparation; fos1_preparation"
      rule: "Match the actual complete preparation provider unit and physical interface. If provider reference is a bundle, divide measured preparation demand by the measured same-bundle net kg to obtain bundle demand. Owned and purchased modes retain different physical ledgers; aggregate/decomposition histories are exclusive. No source p-to-kg coefficient is transferred."
      inputs:
        - "actual preparation mass"
        - "actual same-bundle mass"
        - "provider scope"
        - cp_preparation
        - cp_history
      output: "Compatible actual provider demand without duplicate ingredients or services"
      source_ids:
        - dataverse-preparations-v2
    - id: whole_nested
      applies_to: "all inventory rows"
      rule: "Keep whole preparations/receiver wastes once and component water/solute/substrate/element ledgers nested; use actual compatible fractions and actual generated/consumed species evidence, never a recipe or closure default."
      inputs:
        - "whole wet mass"
        - "actual fractions and bases"
        - "physical stock"
        - "species evidence"
      output: "Disjoint whole exchanges and nested physical evidence"
      source_ids: []
    - id: actual_unit_conversion
      applies_to: "all inventory rows"
      rule: "Convert volume/count only using measured same-state mixture density or actual representative item mass. Integrate a rate over its measured interval; an already integrated volume is not multiplied by time again."
      inputs:
        - "volume or count"
        - "actual density/state or item mass"
        - "rate and interval"
        - uncertainty
      output: "Compatible actual row quantity with uncertainty"
      source_ids: []
    - id: electric_conversion
      applies_to: "electricity"
      rule: "Measured electrical kWh multiplied by3.6 gives MJ; preserve actual native NCV reference convention without inferring fuel heat or a process intensity."
      inputs:
        - "actual meter kWh"
        - conversion3.6
        - "actual user provider"
      output: "Actual electrical input MJ"
      source_ids: []
    - id: refrigerant_bridge
      applies_to: "r134a; recovered_r134a; r134a_air"
      rule: "Reconcile actual R134a component mass in circuit opening charge, receipts and internal recovery against closing charge, exported recovery-component mass and independently supported releases. Keep each whole contaminated receiver/export mixture mass separately with nested constituents; do not use gross receiver mass as pure R134a. Topups, stock changes and recovery are not automatically emissions; no rated-power leakage factor."
      inputs:
        - "identified circuit"
        - "opening/closing charge"
        - "actual receipts/recovery"
        - "release evidence"
      output: "Actual disjoint R134a physical and release ledger"
      source_ids:
        - dataverse-equipment-v2
    - id: producer_to_dairy
      applies_to: "all inventory rows"
      rule: "Keep measured producer release/dispatch P and actual first accepted dairy Q independent. Reconcile actual producer/in-transit stock, paired transfers, pre-gate losses/returns/additions and real state changes before transferring disjoint producer/preparation, storage, transport/conditioning and receiving burden vectors to the matched dairy cohort. Divide by dairy Q once; no producer-kg equals dairy-kg or default yield/loss conversion."
      inputs:
        - "producer event registry P"
        - "actual shipment/receipt/state records"
        - "dairy acceptance Q0"
        - "complete providers"
        - cp_supply
        - cp_product
        - cp_history
      output: "Actual dairy-available whole-product inventory with explicit producer subtotal conversion"
      source_ids: []
  data_quality_requirements:
    - id: whole_identity
      applies_to: "accepted_culture"
      requirement: "Require actual nonpathogenic non-yeast direct-cheese-starter form/grade and full native hardfield admission; no kg/CFU or performance equivalence."
      evidence: "actual product/strain/quality certificates; complete native record and actual supplied composition"
    - id: main_material_units
      applies_to: "mrs_preparation; fos1_preparation"
      requirement: "Require real named physical preparation interfaces and complete matched provider/owned-unit coverage, not an invented purchase or uncharacterized material basket. Do not adopt source background proxies as actual inputs."
      evidence: "actual preparation unit/input-output records; bundle-mass conversion; source original unit/row links; true supplier/owned mode and upstream records"
    - id: stocks_history
      applies_to: "all inventory rows"
      requirement: "Require full physical raw/WIP/FG/package/asset stocks and separate own/provider burden histories, unique original Q0 and exhaustive disjoint postgate states/fates."
      evidence: "raw/stock/weigh tickets; actual acceptance registry; provider boundaries and original-cohort vectors"
    - id: measurement_methods
      applies_to: "all inventory rows"
      requirement: "Actual calibrated physical, composition and outlet methods must fit real species/phase/matrix. Unknown essential method remains unresolved; no future-SOP or finite-check waiver."
      evidence: "complete applicable procedures; calibration; representative coverage; recovery/blanks; uncertainty and detection limits"
    - id: source_transfer
      applies_to: "all inventory rows"
      requirement: "Pilot environmental inventory and commercial product-form evidence support bounded synthesis, not a current industrial recipe/LCI, activity benefit, lifetime, leak rate or source p conversion default."
      evidence: "actual source versions/scale/geography/denominator limits; provider identity/unit checks; independent pending review"
validation_rules:
  - rule_id: validate_whole
    applies_to: "accepted_culture"
    rule: "Require all complete Section5 whole-product/native/actual food-grade conditions and all17ordered qualifiers; no pure biomass, CFU, frozen or different-purpose substitute."
    source_ids:
      - novonesis-white-classic
      - unsd-cpc3-2025
  - rule_id: validate_material_unit
    applies_to: "mrs_preparation; fos1_preparation"
    rule: "Audit actual physical preparation identity, purchased versus owned mode, complete source-qualified provider extent, measured bundle conversion and exclusive aggregate/disaggregated history. A source proxy or promised future material basket does not close this boundary."
    source_ids:
      - dataverse-preparations-v2
  - rule_id: validate_gate
    applies_to: "accepted_culture"
    rule: "Audit unique first actual dairy availability acceptance, complete producer-to-dairy quantity/provider conversion and original-Q0 disjoint postgate bridge, all stocks/returns and later additions; no duplicate retest/event or restored-loss mass. Unknown/zero Q prevents normalized completeness."
    source_ids: []
  - rule_id: validate_physical
    applies_to: "all inventory rows"
    rule: "Independently reconcile whole wet/element/species-G-C/water-phase ledgers, real utilities/enthalpy/refrigerant interfaces and one whole contaminated receiver event with nested substrate/contents before allocation."
    source_ids:
      - gagneten-lab-lci-2025
      - dataverse-main-v2
  - rule_id: validate_history
    applies_to: "all inventory rows"
    rule: "Require complete raw/WIP/FG/asset/pack stocks and own inherited work once, actual matching provider units and nonoverlapping embedded history, original cohort later services and full physical recipient loads."
    source_ids: []
  - rule_id: validate_methods
    applies_to: "all inventory rows"
    rule: "Apply complete Section5 nonoperational method/matrix/source-transfer limits. Actual essential method gaps stay unresolved; no CFU/COD/dry-PM shortcut, future SOP, finite consistency pass or source recipe establishes scientific/study/translation approval."
    source_ids:
      - gagneten-lab-lci-2025
      - dataverse-main-v2
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Matching whole starter available at the actual dairy plant only after complete producer-to-dairy study/provider qualification"
  allowed_use: "Collect nonoperational environmental records for actual complete manufacture/preparation and physical dairy-available supply, with distinct producer P and dairy Q"
  excluded_use: "Biological engineering instructions, clinical claims, activity/kg equivalence, all35273coverage, invented material purchases/providers, source recipe/intensity/leak/lifetime defaults or repacking-only manufacture; producer subtotal misrepresented as dairy-available reference"
  required_metadata: "All qualifiers and full Section5/9conditions, exact actual unit/product/method/provider boundaries, source limits, original Q0, physical/burden histories and uncertainty"
  required_quality_disclosure: "Every actual grade/provider/unit/quantity/matrix gap, source pilot/denominator/background-proxy limits and independent pending science/study/translation review"
  update_trigger: "Actual organism/use/form/grade/preparation/provider/utility/pack/asset/method/gate/cohort change or authoritative classification revision"
