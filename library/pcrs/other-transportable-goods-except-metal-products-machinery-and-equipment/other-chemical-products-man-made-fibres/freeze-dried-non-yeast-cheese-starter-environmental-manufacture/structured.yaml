      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| sole_function | starter_manufacture | The actual whole starter is the sole reference function. Packaging transfers, water return, recovered refrigerant and rejects are physical fates, not automatic cofunctions, biological equivalence or avoided-product credits. | jrc-ilcd-allocation-2010 |\n| causal_service | all inventory rows | Trace exclusive actual batches/submeters before justified shared-service allocation. Keep physical quantities and provider/own unit histories separate, with original Q0 and disjoint carried vectors. Allocation never changes physical mass, species, Q or receiver loads. | jrc-ilcd-allocation-2010 |\n\n"
