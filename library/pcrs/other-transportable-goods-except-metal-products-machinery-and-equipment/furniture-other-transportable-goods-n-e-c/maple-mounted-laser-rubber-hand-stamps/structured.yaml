measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use actual complete-stamp net mass after first quality release. Measure each configuration on a calibrated balance excluding removable liner and packaging. Q is the sum of these measured masses; complete-stamp count is an independent reconciliation. If a count conversion is needed, M is measured net mass in kg of one complete stamp of that same configuration, with its sampled/individual weighing and range recorded in cp_release; count times M is permitted only for the matched configuration and period. Never infer M from geometry, a secondary native factor or a different component."
  - id: whole_supply_once
    applies_to: "all supplied articles and formulations"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Select disjoint component receipts or one reconciled whole-article bridge. Included polymer, fillers, adhesive, assay water and detachable liner subaccounts must reconcile to the one wet receipt. Preserve full closing retained mass and every inherited vector, including test-pad ink and installed adsorption media; never add the same component to whole wet article mass."
  - id: native_unit_chain
    applies_to: "each atomic exchange"
    required_property_ref:
      name: "actual selected atomic-exchange property"
      uuid: ""
    required_unit: "native unit"
    rule: "Use the selected Flow reference property and its exact versioned unit group, then its true reference unit. Preserve raw meter units before conversion; kWh to MJ uses 3.6 only in the verified energy group. Already integrated liquid/gas volume is not multiplied by time; integrate only an actual rate. Each substance needs independent density at recorded state. Item(s) and item are count aliases with factor 1, never kg per item."
  - id: physical_and_species_independence
    applies_to: "manufacturing FG and combined balances"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Close total wet physical mass and relevant independently assayed element balances separately from molecular/reactive-water balances. Measure N2, O2, Ar, H2O and every actual molecular inlet/outlet with its true medium and carbon origin when a gas gate is used. Retain gross wet flow, species and net environmental exchange separately. Do not infer two unknowns from one residual or use VOC/COD/NOx/PM indicators as molecules. Record actual hot-fluid Product returns with mass, phase, T/P and enthalpy; match one supplier water/heat convention and do not duplicate carrier kg with heat MJ or invent a boiler/steam loop."
