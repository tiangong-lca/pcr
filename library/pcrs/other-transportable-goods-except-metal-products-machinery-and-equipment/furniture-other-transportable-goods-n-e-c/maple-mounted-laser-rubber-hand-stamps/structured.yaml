            expression: "Actual complete wet physical transfer once; Qt/Q_analysis labelled observation; linked provider demand is separate evidenced compatible-unit A_c/original Q0,c, never fullQt repeated or tare-only export."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_packaging
              source_ids:
                - rubberstamps-wood-product
            ranges: []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Use these rules together under the declared attributional allocation context; do not extract the economic-allocation row alone. Actual recycling or negative-value waste treatment requires additional applicable evidence, not an unassessed borrowed formula."
    source_ids: []
  - rule_id: allocation_scope
    applies_to: "attributional shared manufacture and actual services"
    rule: "This hierarchy is for attributional studies in which allocation rather than substitution is appropriate. Declare that decision context first. Manufacturer route instructions do not authorise LCA allocation; the ILCD provisions, applicability limits and distinction between multifunctional processes and multifunctional products govern the qualitative hierarchy here."
    source_ids:
      - jrc-ilcd-2010-allocation
  - rule_id: allocation_subdivide
    applies_to: "attributional shared manufacture and actual services"
    rule: "First meter dedicated stamp jobs and actual separate stages; use physical subdivision and then justified virtual subdivision to assign embodied rubber, maple, cushion, specific trial supplies and actual dedicated exchanges. Shared sheet nesting, extraction, cleanup and services retain failed jobs and actual intensity. A common sheet area, stamp mass or machine-hour is not automatically a determining driver for every exchange."
    source_ids:
      - jrc-ilcd-2010-allocation
  - rule_id: allocation_physical_causality
    applies_to: "attributional shared manufacture and actual services"
    rule: "For genuinely remaining shared exchanges, determine and justify the exchange-specific quantitative physical cause of variation in the co-functions. Actual engraved/cut geometry, extraction intensity, metered operating mode or observed occupied-volume/time may be relevant only when evidence establishes the relationship; do not equate them by assertion. Conserve the full unallocated exchange when summing dedicated and allocated contributions to all outputs/services. Keep gross physical movement V unchanged; allocate the associated burden A separately."
    source_ids:
      - jrc-ilcd-2010-allocation
  - rule_id: allocation_residual_market_gate
    applies_to: "attributional shared manufacture and actual services"
    rule: "Only after documenting why subdivision/virtual subdivision and determining physical causality leave real residual process burdens may those residuals use contemporaneous actual-condition quantities times market values at the common process exit/entry gate. Reconcile downstream transport, conditioning, packing and price period back to that gate. Do not choose freely between physical/economic shares, import QFD functional percentages, set fixed recycling/yield shares, create a waste fee adjustment or grant avoided-production credit. Unknown negative/zero-price or recycling cases require explicit applicable treatment-method evidence and review."
    source_ids:
      - jrc-ilcd-2010-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "stamp_manufacture"
      flow_role: "first-release reference"
      record_type: "raw weighing and quality events"
      raw_fields: "cohort; unique release_event; configuration; complete_stamp_count; net_mass_kg; per_configuration_M_if_used; moisture_state; removable_liner; packaging_tare; balance_ID; first_release_time; rejection/rework; actual_stage; original_Q0; full_original_basis_dispositions; later_wet_stocks; true_postgate_J_H2O; U_new_before_stock_correction; own_history_vs_provider_aggregate; receiver_Qt_once; actual_provider_quantity_once; known_component_provenance; independent_service_vectors; compatible_provider_units; Q_analysis"
      collection_method: "Use calibrated weighing of complete assembled stamps after actual acceptance; reconcile configuration-specific count and traceable net masses. Retain repeats as the same event. No pre-assigned item mass or universal trial threshold. Keep raw quantities before conversion, allocation and one division; complete physical stocks and provider history stay distinct. Unknown essential matrix method or real producer remains hold, not future-SOP waiver. Q0 original event ledger fully partitions net deliveries/all accepted on-site states/irreversible original material and water losses/other dispositions; actual wet state and later increments separate, no restored loss plus loss."
      unit: "kg"
      frequency: "each release event and reconciled cohort"
      temporal_coverage: "whole declared cohort including zero-output attempts"
      site_scope: "manufacturing net-product gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; configuration drawing; acceptance and duplicate-event reconciliation"
    - protocol_id: cp_materials
      process_id: "stamp_manufacture"
      flow_role: "each single supplied article"
      record_type: "undivided raw receipts issues and stock vectors"
      raw_fields: "exchange_id; supplier; grade; article/formulation_id; gross_receipts; external_returns; opening_raw; closing_raw; opening_WIP; closing_WIP; nonWIP_holdings; issued_mass; assay_water; internal_handoff; inherited_vector_by_exchange; same_side_OTHER_id; X; actual_stage; original_Q0; full_original_basis_dispositions; later_wet_stocks; true_postgate_J_H2O; U_new_before_stock_correction; own_history_vs_provider_aggregate; receiver_Qt_once; actual_provider_quantity_once; known_component_provenance; independent_service_vectors; compatible_provider_units; Q_analysis"
      collection_method: "Weigh actual whole supplied rubber sheet/maple mount/cushion/carbon separately. Reconcile disjoint receipts or one whole-article bridge to component assays without a second purchase; preserve full wet retained stocks and actual failed/idle/cleanup inputs. Keep raw values before any conversion/allocation/normalisation. Keep raw quantities before conversion, allocation and one division; complete physical stocks and provider history stay distinct. Unknown essential matrix method or real producer remains hold, not future-SOP waiver."
      unit: "kg"
      frequency: "each movement with period stocktake"
      temporal_coverage: "same cohort and matched inventory dates"
      site_scope: "raw/WIP and installed media gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier technical evidence; scales; stock/vector reconciliation"
    - protocol_id: cp_energy
      process_id: "stamp_manufacture"
      flow_role: "electricity and actual additional carriers"
      record_type: "undivided raw meter events"
      raw_fields: "meter_id; raw_unit; initial_reading; final_reading; actual_rate_if_any; interval; job; accepted_failed_idle_start_stop_cleanup; voltage; country; provider; source_year; dedicated_load; causal_driver; residual_gate_price; actual_stage; original_Q0; full_original_basis_dispositions; later_wet_stocks; true_postgate_J_H2O; U_new_before_stock_correction; own_history_vs_provider_aggregate; receiver_Qt_once; actual_provider_quantity_once; known_component_provenance; independent_service_vectors; compatible_provider_units; Q_analysis"
      collection_method: "Use actual event meters/invoices and measured modes; energy and any real fuel are separate exchanges. Collect raw kWh or carrier unit, not divided data or invented power/time. Record an actual liquid/gas carrier state and returning Product if supplied; no steam or boiler is presumed. Keep raw quantities before conversion, allocation and one division; complete physical stocks and provider history stay distinct. Unknown essential matrix method or real producer remains hold, not future-SOP waiver."
      unit: "kWh; MJ"
      frequency: "each metered event and declared interval"
      temporal_coverage: "complete cohort operating and non-operating loads"
      site_scope: "production and actual exhaust/cleanup equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; bill/mode/interval reconciliation"
    - protocol_id: cp_water
      process_id: "stamp_manufacture"
      flow_role: "cleaning water and wash outlet"
      record_type: "undivided raw water and liquid balance"
      raw_fields: "supply_id; raw_mass; raw_volume; density_independent; T; P; batch; opening_bath; closing_bath; recirculation; effluent_wet_mass; free_water; suspended_rubber; dissolved_species; evaporated_H2O; cleaning_event; provider; actual_stage; original_Q0; full_original_basis_dispositions; later_wet_stocks; true_postgate_J_H2O; U_new_before_stock_correction; own_history_vs_provider_aggregate; receiver_Qt_once; actual_provider_quantity_once; known_component_provenance; independent_service_vectors; compatible_provider_units; Q_analysis"
      collection_method: "Weigh separately or meter volume and independently determine that liquid density at the recorded state. Retain recirculated/retained water as stocks, not new purchase; independently sample actual liquid/species and keep inlet/outlet and retained water. Keep raw quantities before conversion, allocation and one division; complete physical stocks and provider history stay distinct. Unknown essential matrix method or real producer remains hold, not future-SOP waiver."
      unit: "kg; m3"
      frequency: "each wash bath change and measured outlet"
      temporal_coverage: "same operating/cleanup/stock interval"
      site_scope: "actual water wash and its management"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter/scale/density method; liquid/species sample chain"
    - protocol_id: cp_test
      process_id: "stamp_manufacture"
      flow_role: "actual ink and paper for checks"
      record_type: "undivided trial-consumable and quality record"
      raw_fields: "stamp_event; specification_revision; ink_formulation_id; ink_receipts; opening_pad_ink; closing_pad_ink; paper_grade; paper_mass; failed_trials; cleaning_loss; retained_ink; paper_waste_origin; real_pad_replacement; actual_stage; original_Q0; full_original_basis_dispositions; later_wet_stocks; true_postgate_J_H2O; U_new_before_stock_correction; own_history_vs_provider_aggregate; receiver_Qt_once; actual_provider_quantity_once; known_component_provenance; independent_service_vectors; compatible_provider_units; Q_analysis"
      collection_method: "Weigh actual ink/paper usage and retained pad ink against real trial logs; maintain whole formulation once and independent paper/ink origins. Inspection standards are actual order/site requirements, not source-resolution values, future office ink, age or a lifetime claim. Keep raw quantities before conversion, allocation and one division; complete physical stocks and provider history stay distinct. Unknown essential matrix method or real producer remains hold, not future-SOP waiver."
      unit: "kg"
      frequency: "each trial/cleanup and cohort reconciliation"
      temporal_coverage: "all successful and failed checks"
      site_scope: "real complete-stamp inspection"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "trial logs; scale; supplier composition and retained-pad balance"
    - protocol_id: cp_waste
      process_id: "stamp_manufacture"
      flow_role: "each real Waste outlet"
      record_type: "gross undivided waste movement and origin ledger"
      raw_fields: "stream_id; wet_W; independent_originW; retained_water; composition; hazard_state; opening_holding; closing_holding; gross_destination; provider; mixed_total_or_segregated_choice; same_side_OTHER; X; actual_stage; original_Q0; full_original_basis_dispositions; later_wet_stocks; true_postgate_J_H2O; U_new_before_stock_correction; own_history_vs_provider_aggregate; receiver_Qt_once; actual_provider_quantity_once; known_component_provenance; independent_service_vectors; compatible_provider_units; Q_analysis"
      collection_method: "Weigh real segregated or mixed outlets without inferred split destinations. For one mixed Waste measure total and independent nonadditive origins, reconcile each constituent once and match one provider. Keep failed/rejected/unauthorised loads, physical inventories and gross mass even where economic allocation differs. Keep raw quantities before conversion, allocation and one division; complete physical stocks and provider history stay distinct. Unknown essential matrix method or real producer remains hold, not future-SOP waiver."
      unit: "kg"
      frequency: "each outlet and holding change"
      temporal_coverage: "all manufacture and cleanup losses"
      site_scope: "actual waste collection/treatment boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge/scale; manifests; independent origin measurements"
    - protocol_id: cp_species
      process_id: "stamp_manufacture"
      flow_role: "each actual molecular/elementary exchange"
      record_type: "raw wet-gas liquid and species records"
      raw_fields: "species_id; CAS; inlet_outlet; medium; gross_wet_mass; integrated_volume; actual_rate; interval; T; P; independent_density; inlet_humidity; water_free_reaction_structure; fossil_biogenic_carbon; N2; O2; Ar; H2O; captured_sorbate; actual_molecular_emission; independent_element_assay; actual_stage; original_Q0; full_original_basis_dispositions; later_wet_stocks; true_postgate_J_H2O; U_new_before_stock_correction; own_history_vs_provider_aggregate; receiver_Qt_once; actual_provider_quantity_once; known_component_provenance; independent_service_vectors; compatible_provider_units; Q_analysis"
      collection_method: "Measure inlet/outlet wet streams and each actual species with state/medium; distinguish integrated volume from rate. Use independent total-mass/element/species observations; one residual never determines two unknowns. Uncharacterised indicators require investigation/additional atomic cards rather than asserted zero molecules or release from captured material. Keep raw quantities before conversion, allocation and one division; complete physical stocks and provider history stay distinct. Unknown essential matrix method or real producer remains hold, not future-SOP waiver."
      unit: "kg; m3; s"
      frequency: "each sampled event and reconciled observation interval"
      temporal_coverage: "all operating failed and cleanup modes"
      site_scope: "actual exhaust water and environmental compartments"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling/calibration; molecular and carbon-origin evidence; balance uncertainty"
    - protocol_id: cp_fg
      process_id: "fg_services"
      flow_role: "gross finished-stock movements and actual services"
      record_type: "undivided cohort and service ledger"
      raw_fields: "original_cohort; original_Q_c; original_manufacturing_vector; original_delivery; reverse_delivery; opening_FG; first_release_handoff; external_return_gross; closing_FG; gross_shipment; disposal; actual_service_energy_water; service_start_end_H; rework_increment; retained_water; actual_stage; original_Q0; full_original_basis_dispositions; later_wet_stocks; true_postgate_J_H2O; U_new_before_stock_correction; own_history_vs_provider_aggregate; receiver_Qt_once; actual_provider_quantity_once; known_component_provenance; independent_service_vectors; compatible_provider_units; Q_analysis"
      collection_method: "Track real gross movements and net wet article condition at the FG gate; carry historical burdens and original delivery reversals without new Q. Measure only actual services observed in H, including unsuccessful/unauthorised ones. Reconcile internal handoff to manufacture Q once and distinguish present Q=0 from an older cohort original_Q_c. Keep raw quantities before conversion, allocation and one division; complete physical stocks and provider history stay distinct. Unknown essential matrix method or real producer remains hold, not future-SOP waiver."
      unit: "kg; kWh; MJ"
      frequency: "each movement/service and period stocktake"
      temporal_coverage: "declared H with historical opening lineage"
      site_scope: "finished-stock and combined gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "gross logistics; cohort lineage; original burden vector; measured H"
    - protocol_id: cp_packaging
      process_id: "packaging"
      flow_role: "one corrugated-carton pool"
      record_type: "undivided per-article pool movement"
      raw_fields: "carton_id; grade; P_purchase; ER_received; S_gross_shipped; EO_return_out; W_waste; opening_empty; opening_attached_WIP_FG; opening_reusable; closing_empty; closing_attached_WIP_FG; closing_reusable; internal_reuse; ownership; moisture; provider; actual_stage; original_Q0; full_original_basis_dispositions; later_wet_stocks; true_postgate_J_H2O; U_new_before_stock_correction; own_history_vs_provider_aggregate; receiver_Qt_once; actual_provider_quantity_once; known_component_provenance; independent_service_vectors; compatible_provider_units; Q_analysis; O; P; I; ER; C; S_filled; EO_empty; W_whole; J_in; J_out; H2O_in; H2O_out; OTHER_duplicate_children; X"
      collection_method: "Measure each actual complete article/wholewet transfer: O+P+I+ER+J_in+H2O_in=C+S_filled+EO_empty+W_whole+J_out+H2O_out. P purchases, I supplierincluded/other inward, ER empty inward, grossS_filled outward withgoods/filledreturns, EO_empty outward empty, W_whole whole wetreceiver. All Jnonwater/water legs true disjoint not already included; X onlyOTHERsame-sideduplicates, never trueJ/water/fullwetC/opposite. Internalreuse not newQ/purchase/credit. Matched stage retains real final packagingQC before firstacceptance; physicalevent once, distinct compatibleunit A/originalQ0 vectors."
      unit: "kg"
      frequency: "each movement and reconciled stocktake"
      temporal_coverage: "actual entire pre/post acceptance custody with original-cohort linkage"
      site_scope: "actual packaging gates including empty and attached raw/WIP/FG/reusable holdings"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "purchase/return/dispatch/waste tickets; pool conservation"
    - protocol_id: cp_assets
      process_id: "stamp_manufacture"
      flow_role: "each actual testpad/brush/filter/cloth separately"
      record_type: "full physical fleet and independent service vector records"
      raw_fields: "article_id; wholeconstruction; actual_use; purchase_return; opening_closing_inuse_counts_mass; wet_dry_state; embedded_ink_carbon; capturedmatter_water; original_cohort_Q0; receiver_Qt_once; actual_treatment_quantity; known_provenance; compatible_provider_unit; independent_service_vectors; actual_stage"
      collection_method: "Weigh each real whole article and retain full physical fleet/returns/contaminatedwet waste once. Substrate/retainedmatter/water nested; no extra residue unless physically separated. Actual compatible provider service A_c/originalQ0,c separate, no lifetime/default allocation. Unknown matrix/producer method hold."
      unit: "kg; actual item count"
      frequency: "each real movement/use/change and matched stocktake"
      temporal_coverage: "actual manufacture/inspection/cleanup interval including failures"
      site_scope: "real manufacture/inspection tool and extraction boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "actual supplier construction; calibrated measurements; fleet and receiver manifests; independent service attribution"
  calculation_rules:
    - id: release_quantity
      applies_to: "reference product"
      rule: "Q = sum of measured complete-stamp net mass for unique first-release events in the cohort. If count conversion is used, mass = matched configuration count times measured M from cp_release. Do not add closing released FG or component outputs again."
      inputs:
        - unique_release_events
        - measured_net_masses
        - configuration_count
        - measured_M
        - cp_release
      output: "Q"
      source_ids:
        - rubberstamps-wood-product
        - simply-stamps-manufacture
    - id: prepare_raw_and_inheritance
      applies_to: "each exchange and cohort"
      rule: "A_e=B_open,e+U_new,e−B_close,e−T_other,e for genuinely unused/unassigned raw/WIP exchange vectors. U_new before stock correction includes all actual modes; not repeated if already corrected. AcceptedFG/performedservice not unused. Own inherited history vs aggregate/decomposed providers nonoverlap, never add embedded supply work twice. Full physical V_e stocks/transfers independently complete."
      inputs:
        - raw_records
        - U_new
        - B_open
        - B_close
        - T_other
        - own_provider_history
        - cp_materials
        - cp_energy
        - cp_water
      output: "A_e; V_e"
      source_ids:
        - jrc-ilcd-2010-allocation
    - id: single_normalisation
      applies_to: "all inventory rows"
      rule: "q_e,c=A_e,c/original positive Q0,c once, using evidenced nonoverlapping compatible provider units. Physical V or Qt/Q_analysis is observation only, not a repeated shared provider demand or a shrunken export. Full receiver/provider quantities once, components/provenance and service vectors separate. Actual Q=0/unknown basis keeps raw without unitresult."
      inputs:
        - A_e
        - V_e
        - Qt
        - Q_analysis
        - original_Q0_c
        - Q
        - cp_release
      output: "q_e; v_e"
      source_ids:
        - jrc-ilcd-2010-allocation
    - id: observed_cohort_services
      applies_to: "fg_services"
      rule: "For original cohort c observed within H, A_service_c contains only actual incremental observed service loads, retaining full historical manufacture vectors and exact original-delivery reversals separately. Use D = original_Q_c for that cohort in the same one-division rule. Manufacture and FG service accounts combine by cancelling matched internal handoff and adding each actual load once. Do not substitute current dispatch count/mass, net returned sales, current Q or a future assumed service horizon for original_Q_c."
      inputs:
        - original_Q_c
        - H
        - actual_incremental_service
        - historical_vector
        - reverse_delivery
        - cp_fg
      output: "A_service_c; v_service_c"
      source_ids:
        - rubberstamps-wood-product
        - simply-stamps-manufacture
        - jrc-ilcd-2010-allocation
    - id: physical_stock_and_packaging
      applies_to: "all physical gates"
      rule: "Independent full physical gates preserve actual wet mass/species and original-event Q0 dispositions. Matching manufacture/FG internal handoff cancels once. Each actual packaging pool uses O+P+I+ER+J_in+H2O_in=C+S_filled+EO_empty+W_whole+J_out+H2O_out. Jnonwater and H2O real disjoint legs exclude already nested transfers; X onlyOTHERsame-sideduplicate not trueincrement/fullwetC/opposite. Wwhole includes substrate/retainedmatter/water once. Original eventQ0 never newexternal output."
      inputs:
        - opening_physical
        - gross_receipts
        - actual_formation
        - closing_physical
        - gross_shipments
        - gross_returns
        - waste
        - species
        - internal_handoffs
        - O
        - P
        - I
        - ER
        - C
        - S_filled
        - EO_empty
        - W_whole
        - J_in
        - J_out
        - H2O_in
        - H2O_out
        - X
        - cp_packaging
      output: "physical_residual; packaging_residual"
      source_ids:
        - rubberstamps-wood-product
    - id: species_and_element_reconciliation
      applies_to: "cp_species and cp_water"
      rule: "Use independent measured inlet/outlet species, wet mass, material assays and relevant element observations to report separate physical, elemental and molecular residuals with uncertainties. Integrate only actual rates over their observed interval; do not multiply an already integrated volume by time. Preserve free/reaction/absorbed/structure water and real gas species/carbon origins. An unexplained residual is a gap, not a fitted emission or simultaneous solution of multiple unknowns."
      inputs:
        - independent_species
        - wet_mass
        - element_assays
        - state_measurements
        - rate_or_integral_flag
        - cp_species
        - cp_water
      output: "physical_residual; element_residual; species_residual"
      source_ids:
        - trotec-stamp-engraving
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each supplied and outgoing exchange"
      requirement: "Retain whole-article versus ingredient boundary, actual grade/polymer/cell structure/CAS/route/form/geography/medium/type and all native property/unit restrictions. A matching name or classification is insufficient. Ordinary unresolved auxiliary UUID/provider evidence is disclosed and replaced by an actually compatible identity before a complete site result is claimed."
      evidence: "Supplier original; full native reference chains; site article bridge"
    - id: dq_complete_activity
      applies_to: "manufacture and observed H"
      requirement: "Cover all failed/zero-output/start-stop/idle/cleanup/rework/inspection modes and each raw/WIP/non-WIP/FG inherited exchange vector. Match periods, unique release events, original delivery reversals, full wet holdings and cohort denominators. Future unobserved service is unknown."
      evidence: "Complete event/meter/stock and original-cohort evidence"
    - id: dq_measurement
      applies_to: "raw and normalised quantities"
      requirement: "Keep raw units, actual state, independent densities, rate/integral distinctions, measurement uncertainty, true gross flows and actual allocation drivers before one division. Report Q=0 without a unit result; do not invent numerical ranges to conceal a missing assay, molecular species, flow or method."
      evidence: "Calibration and sampling chain; independent stock/species/element balances"
    - id: dq_sources
      applies_to: "qualitative route and method"
      requirement: "Use complete original product/process instructions with adjacent alternatives; keep separate which supports whole-stamp construction, laser cleanup, adhesive alternatives, quality trials, classification and allocation. This technical synthesis is not evidence of one order/factory, universal parameters, scientific review, translation approval, or environmental superiority."
      evidence: "Source-specific applicability decisions and measured foreground evidence"
validation_rules:
  - rule_id: validate_whole_core
    applies_to: "complete data package and declared applicability"
    rule: "Require a complete maple-grip/cushion/laser-rubber stamp and the declared first-release net-mass reference. Reject parts, another engraving/material route, an ink-pad bundle or design service under this method. Verify the same finished_stamp link and all reference qualifiers in both renderings."
    source_ids:
      - rubberstamps-wood-anatomy
      - rubberstamps-wood-product
      - trotec-stamp-engraving
  - rule_id: validate_quantity_and_stock
    applies_to: "complete data package and declared applicability"
    rule: "Check unique first-release Q, actual count/mass conversion when used, every raw/WIP/non-WIP/FG physical holding and inherited vector, same-cohort services and original delivery reversals. Confirm released closing FG counted once, internal Q/parts cancelled once and A/D or V/D executed once only; Q=0 has real retained loads with no unit result."
    source_ids:
      - rubberstamps-wood-product
      - simply-stamps-manufacture
      - jrc-ilcd-2010-allocation
  - rule_id: validate_atomic_physical
    applies_to: "complete data package and declared applicability"
    rule: "Verify one atomic card for every actual exchange and complete independent physical/element/species observations; no unsupported density, molecular speciation, heat return, recipe or default mass. Each adopted native type/grade/route/form/geography/media/CAS/property/unit must match; full gross packaging and article movements are not allocation shares. One real mixed Waste has one provider and a measured total or reconciled segregated outlets once, with independent nonadditive originW."
    source_ids:
      - trotec-stamp-engraving
      - cape-arago-mounting
  - rule_id: validate_allocation_and_gaps
    applies_to: "complete data package and declared applicability"
    rule: "Check dedicated/subdivided assignments, exchange-specific determining physical causality and only documented residual contemporaneous common-gate market values with conservation. Unresolved true whole-core or method applicability, uncharacterised actual flows or incomplete balances remain explicit and block a complete site conclusion. Engineering/translation alignment, source retrieval and identity checks alone never constitute scientific or translation approval or publication."
    source_ids:
      - jrc-ilcd-2010-allocation
published_dataset_profile:
  dataset_role: "Foreground manufacturing methodology for one declared complete hand-stamp configuration and separate actually observed FG services"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Compatible complete-stamp manufacture per kg first-released net article, with transparent actual supplier, allocation, stock and H service coverage"
  excluded_use: "Lifetime-equivalent stamp comparisons without service evidence; other material/production routes; part-only/ink-pad/graphic-service modelling as whole stamp; unobserved future operation; environmental superiority or approval claims"
  required_metadata: "All reference qualifiers; one supplied construction; actual raw/WIP/FG/non-WIP vectors; original Q_c and H; exact provider state; physical and burden ledgers; actual inspection specification"
  required_quality_disclosure: "Measured versus unknown activity; unresolved auxiliary identities/providers; actual species and method gaps; attributional allocation applicability; source limits; raw-unit and stock uncertainty; no implied scientific/translation approval"
  update_trigger: "Changed rubber/foam/maple supplied state or chemistry, whole product construction, laser/cleanup/bonding route, reference gate, inspection needs, provider/unit chain, allocation evidence, real waste/species or observed-service horizon"
