          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\nUse these rules together under the declared attributional allocation context; do not extract the economic-allocation row alone. Actual recycling or negative-value waste treatment requires additional applicable evidence, not an unassessed borrowed formula.\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_scope | attributional shared manufacture and actual services | This hierarchy is for attributional studies in which allocation rather than substitution is appropriate. Declare that decision context first. Manufacturer route instructions do not authorise LCA allocation; the ILCD provisions, applicability limits and distinction between multifunctional processes and multifunctional products govern the qualitative hierarchy here. | `jrc-ilcd-2010-allocation` |\n| allocation_subdivide | attributional shared manufacture and actual services | First meter dedicated stamp jobs and actual separate stages; use physical subdivision and then justified virtual subdivision to assign embodied rubber, maple, cushion, specific trial supplies and actual dedicated exchanges. Shared sheet nesting, extraction, cleanup and services retain failed jobs and actual intensity. A common sheet area, stamp mass or machine-hour is not automatically a determining driver for every exchange. | `jrc-ilcd-2010-allocation` |\n| allocation_physical_causality | attributional shared manufacture and actual services | For genuinely remaining shared exchanges, determine and justify the exchange-specific quantitative physical cause of variation in the co-functions. Actual engraved/cut geometry, extraction intensity, metered operating mode or observed occupied-volume/time may be relevant only when evidence establishes the relationship; do not equate them by assertion. Conserve the full unallocated exchange when summing dedicated and allocated contributions to all outputs/services. Keep gross physical movement V unchanged; allocate the associated burden A separately. | `jrc-ilcd-2010-allocation` |\n| allocation_residual_market_gate | attributional shared manufacture and actual services | Only after documenting why subdivision/virtual subdivision and determining physical causality leave real residual process burdens may those residuals use contemporaneous actual-condition quantities times market values at the common process exit/entry gate. Reconcile downstream transport, conditioning, packing and price period back to that gate. Do not choose freely between physical/economic shares, import QFD functional percentages, set fixed recycling/yield shares, create a waste fee adjustment or grant avoided-production credit. Unknown negative/zero-price or recycling cases require explicit applicable treatment-method evidence and review. | `jrc-ilcd-2010-allocation` |\n\n"
