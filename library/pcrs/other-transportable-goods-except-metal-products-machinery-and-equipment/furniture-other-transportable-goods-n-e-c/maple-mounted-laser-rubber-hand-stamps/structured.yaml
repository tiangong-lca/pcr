system_boundary:
  rules:
    - rule_id: boundary_manufacturing
      applies_to: "complete declared route and matching gates"
      rule: "Include actual receipt/stock handling, template preparation, in-house rubber engraving/cutting, water cleanup and exhaust management, wood indexing, supplied-cushion trimming and bonding, inspection and first complete-stamp release. Preserve every failed/zero-output/start-stop/idle/cleanup/rework event and its actual losses. Incoming prepared parts inherit upstream burdens once; do not recreate their suppliers as an extra local recipe."
      source_ids:
        - rubberstamps-wood-anatomy
        - trotec-stamp-engraving
        - cape-arago-mounting
        - simply-stamps-manufacture
    - rule_id: boundary_release_and_stock
      applies_to: "complete declared route and matching gates"
      rule: "Q is only complete-stamp net mass newly first quality-released once. Manufacturing physical balance includes opening/closing raw stock and WIP and all actual outlets. The separate FG gate includes opening FG, internal Q handoff, actual external returns, closing FG, gross dispatch and disposal; combine gates by cancelling that internal Q handoff once. Released closing FG is already Q, so it is not added again or deducted as unreleased WIP. Retain every per-exchange inherited vector for all stocks and installed/non-WIP holdings."
      source_ids:
        - rubberstamps-wood-product
        - simply-stamps-manufacture
    - rule_id: boundary_observed_services
      applies_to: "complete declared route and matching gates"
      rule: "Keep actual post-release storage, packing, handling, dispatch, return inspection and incremental repair/disposal within observed H as a separate service ledger tied to original Q_c. Historical opening FG keeps its original manufacture burden and original delivery reversal; reinspection, dispatch or natural moisture uptake/loss is not a new product. Future unobserved service remains unknown. Permission, failure or rejection affects authorisation/quality only and cannot delete real materials, logistics or loads."
      source_ids:
        - rubberstamps-wood-product
        - simply-stamps-manufacture
    - rule_id: boundary_atomic_completeness
      applies_to: "complete declared route and matching gates"
      rule: "A site survey must add a separate atomic card/protocol for every actually used fuel, cleaner formulation, replacement pad/brush/filter article, packaging type, stock return, recovered Product, elemental molecule or Waste outlet not listed here. Distinguish actual gas/air and liquid species, separate carbon origins and media; do not hide them in zero, other, a universal factor, or a mixed Product labelled Waste. One real mixed Waste may have one measured total and independent nonadditive originW. The physical site balance retains full wet closing holdings; same-side OTHER de-duplication X cannot offset stocks, the opposite side, a missing card or retained inputs."
      source_ids:
        - trotec-stamp-engraving
        - simply-stamps-manufacture
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "This methodology covers one complete non-self-inking hand stamp: a solid maple block with a handgrip profile, a supplied double-sided self-adhesive foam cushion and a rubber face laser engraved/cut from a purchased complete cured sheet at the stamp plant. The maple mount itself is the grip; an additional knob is not part of this selected construction. The product is usable with a separate compatible ink-pad, which is not bundled here. A face, mount, ink-pad or image service alone is not the core product. The broad CPC leaf and native finished-article family also include other products; neither makes those routes equivalent."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "The technical route combines positive whole-product and compatible separate process instructions from manufacturers. The sources do not represent one shared SKU, contemporary order or measured factory inventory. A site must verify which operations actually occur; purchased prepared mounts/sheets/cushion articles carry their upstream burdens once, while in-house laser removal, water cleaning, bonding, trimming and trial release carry actual local loads. Molded rubber, flash/photopolymer, pre-inked/self-inking, purchased-finished-die-only assembly, other mount constructions and separately sold ribbons/pads/printing sets need their own applicability review. No recipe, hardness, dimensions, item mass, temperature, time, laser power/speed, yield, ink dose, impression count, quality threshold, life, certification or emission factor is prescribed."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "Route and construction sources: rubberstamps-wood-anatomy; rubberstamps-wood-product; trotec-stamp-engraving; trogroup-laser-rubber-vulcanisation; cape-arago-mounting; simply-stamps-manufacture."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "Every qualifier must enter actual dataset metadata, process notes or equivalent consumable context; absence makes that data package reference incomplete."
      source_ids: []
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "Cards consume the same single calculation in section 8. Protocols retain undivided raw observations; aggregation_rule declares the reporting basis and performs no division. Physical cards use gross movement V results, while burdens use A results separately; the supplier/inherited-vector bridge is consumed once, not as two purchases. Evidence must establish absence; missing, unknown or failed activity is not zero."
      source_ids: []
    - rule_id: system_boundary_rule_10
      applies_to: "foreground_system_boundary"
      rule: "The following protocols collect undivided raw observations and actual stock vectors only. aggregation_rule states the normative reporting basis; the calculation rules below execute normalisation once. Do not divide in a protocol/supplier record and then divide again."
      source_ids: []
    - rule_id: system_boundary_rule_11
      applies_to: "foreground_system_boundary"
      rule: "The whole native Product is a finished manufactured hand-operated article, production mix at plant, with Mass as its actual reference property and kg as the mass-unit-group reference unit. Its broad name also covers ribbons, ink-pads and other stamp forms; those are not this selected construction. No CAS, fixed material recipe, dimensions, item mass or geography is supplied. Admit only the actual complete maple grip block, bonded adhesive cushion and cured laser-rubber face after real engraving, cleaning, mounting and required impression/final packaging QC at one fixed first acceptance. A rubber blank, engraved die, purchased complete stamp receipt, component-only assembly or paper receiving gate cannot stand for the included manufacture. All genuine producers and interfaces remain visible, including any actually performed external stage; a label cannot remove laser, cutting, cleanup or assembly burdens."
      source_ids: []
    - rule_id: system_boundary_rule_12
      applies_to: "foreground_system_boundary"
      rule: "RubberStamps.net anatomy and complete product are one publisher, not two independent factories. Its illustrated hourglass maple mount, three-layer rubber/cushion/wood anatomy, laser index and optional additional handle are retained: the chosen mount itself is the grip, with no added knob or ink-pad bundle. The product-page size, red-rubber renewable claim, resolution and turnaround are case statements, not chemical formulation, carbon-origin proof, measured M, energy or life defaults. Trotec and TroGroup are a related family, not proof of the RubberStamps.net grade or common SKU. TroGroup explicitly vulcanises synthetic/natural rubber plates upstream for later laser text engraving; a whole supplied cured blank inherits that complete production once, without recreating local cure chemicals or assuming either polymer."
      source_ids: []
    - rule_id: system_boundary_rule_13
      applies_to: "foreground_system_boundary"
      rule: "Trotec describes template preparation with driver mirroring/inversion, engraving/cutting, real water-and-brush cleanup or an actually operated ultrasonic bath, assembly, shoulders and material-specific depth cautions, and real dust/odour extraction with activated carbon. No resolution, engraving depth, lens, laser setting, sheet size, productivity or carbon proportion is transferred. Simply Stamps distinguishes laser removal for wood-handle/self-inking stamps from porous flash dies for pre-inked stamps and describes actual pre-shipment impression checks and adjustments. Its phrase vaporizes or melts describes removal, not a measured gas composition, complete oxidation, zero particles or CO2 emission factor. Each actual rubber/wood process retains complete wet material, captured residue, independently identified molecular species and carbon-origin balances; source correlation never establishes a gas recipe."
      source_ids: []
    - rule_id: system_boundary_rule_14
      applies_to: "foreground_system_boundary"
      rule: "Cape Arago describes genuine alternative mounting constructions. The selected whole double-sided self-adhesive cushion is one supplied article; its foam, incorporated adhesive and liner are nested once, not separate purchases. Natural sponge with separately applied rubber cement, layered craft foam, optional sanding/varnish/sealer, ink/paper-label/acrylic indexing are alternatives, not the selected laser-index recipe. Its WD-40 tool-wipe and optional powder advice are source-specific ancillary alternatives, not silent zero/default ingredients: where actually used, each actual whole formulation/article and its complete producer, tool cleaning, species and waste needs a separate measured atomic card and boundary. No brand, polymer/cell structure, solvent, dry time or coat count is inferred for the actual factory."
      source_ids: []
    - rule_id: system_boundary_rule_15
      applies_to: "foreground_system_boundary"
      rule: "Q=Q0 is locked to the positive original sum of unique first whole-stamp acceptance events at the same configuration and net wet reference state. Every original cohort is reconciled by disjoint original-basis net remaining external deliveries, all real on-site accepted FG/hold/repair states, irreversible original material and water losses, and other terminal dispositions. Gross returns/redeliveries/retests/repeated internal handoffs do not create another acceptance or Q. Preserve event IDs, original measured mass, actual later full wet stocks and independent post-acceptance matter/water increments. Do not restore lost water to survivors and also count the loss, use dispatch as Q, add accepted closing FG again, or subtract already accepted FG as unreleased carry. Actual Q=0 or unknown basis retains raw activity and unresolved unit result; it is distinct from an older cohort positive Q0."
      source_ids: []
    - rule_id: system_boundary_rule_16
      applies_to: "foreground_system_boundary"
      rule: "Measured M is only net mass of one actual complete stamp of the matched configuration at fixed acceptance, excluding removable packaging/liners. Individual or justified representative calibrated weighing keeps actual range, sampling, moisture and configuration evidence; no illustrated size, thickness, nominal density or default mass is substituted. Each mount, sheet, brush, test pad, filter, cloth or package count conversion needs its own measured same-article/state mass and uncertainty, never stamp M multiplied by part count. A manufacturing-to-FG handoff cancels once at the combined physical gate; Q is an event account, not an additional external shipment. Actual required final packaging/inspection before first acceptance stays manufacturing work, with its real stage, rather than a second release or automatically later service."
      source_ids: []
    - rule_id: system_boundary_rule_17
      applies_to: "foreground_system_boundary"
      rule: "For each exchange e, actual U_new,e is genuine new activity before any stock correction, including failed, zero-output, start-stop, idle, cleanup, test and rework work. A_e=B_open,e+U_new,e−B_close,e−T_other,e applies only to genuinely unused/unassigned raw/WIP histories and supported nonoverlapping transfers. Accepted FG or already performed services are not unused carry; already stock-corrected consumption is not corrected twice. Physical raw/WIP/FG/non-WIP/tool/ink/carbon stocks and mass remain independently complete. Carry own inherited foreground/WIP history once, and explicitly choose a compatible provider aggregate or decomposed upstream history without re-adding already embedded operations, supplied formulation constituents or transport."
      source_ids: []
    - rule_id: system_boundary_rule_18
      applies_to: "foreground_system_boundary"
      rule: "Keep three ledgers: (1) each actual whole wet receiver transfer Qt and the full actual treatment-provider quantity, recorded once; (2) measured nonadditive substrate/retained rubber or ink/adsorbate/water components and actual known physical cohort provenance; (3) independently evidenced nonoverlapping compatible-provider-unit service/burden vectors A_h,c divided by each served original positive Q0,c. Qt/Q_analysis is a labelled physical observation quotient, not a modeled repeated full provider demand. Allocation never shrinks a real waste export or fleet, nor charges full Qt to every cohort. Unknown physical provenance or service shares remain unresolved; one cannot infer them from mass, grade, lifetime or revenue by default."
      source_ids: []
    - rule_id: system_boundary_rule_19
      applies_to: "foreground_system_boundary"
      rule: "A discarded brush, test pad, wiping cloth, particle filter or spent-carbon transfer is one actual whole contaminated wet physical waste when discarded together. Dry body/media, retained ink/rubber/dust/sorbate and water are nested components, not extra attached-powder/liquor exports or duplicated treatment demand unless actually separated before the boundary. Separate collected rubber offcut or wash liquid remains a distinct actual stream. Test-pad initial incorporated ink is included once in the whole purchased pad; the test_ink row is only actual separately purchased/recharged ink, not a second purchase of embedded ink. Actual tools/media have complete physical purchase/return/stock/waste histories independently of service vectors; no hypothetical replacement interval, cleaning cloth or filter is assumed present."
      source_ids: []
    - rule_id: system_boundary_rule_20
      applies_to: "foreground_system_boundary"
      rule: "The carton is a conditional actual article, not a universal stamp packaging prescription. Keep separate P independent purchases, I actual supplier-included/other inward packaging, ER empty articles actually returned inward, gross S_filled outward articles with real shipments or filled material returns, EO_empty empty articles outward, and W_whole whole wet waste to receiver. I is not P, ER is not EO, filled returns in S are not counted again as EO, and internal reuse is not a new purchase, reference output, cofunction or credit. Retain empty, attached raw/WIP/FG and reusable O/C stocks and real paired physical counterparties; packaging stays outside stamp net Q0."
      source_ids: []
    - rule_id: system_boundary_rule_21
      applies_to: "foreground_system_boundary"
      rule: "The complete wet carton identity is O+P+I+ER+J_in+H2O_in=C+S_filled+EO_empty+W_whole+J_out+H2O_out. J_in/out are real mutually exclusive nonwater additions/removals and H2O_in/out real separate water ingress/egress, including uptake, release or repair, only where not already contained in whole P/I/ER/S/EO/W transfers. Item counts and water/material components are not additive extra masses. C includes all real retained moisture/matter; X may remove only identified OTHER same-side duplicate child entries and never true J/water, full wet C, an opposite side, a missing card or physical residue. Each real filled shipment is one whole transfer with contents/carton components nested, not two gross masses."
      source_ids: []
    - rule_id: system_boundary_rule_22
      applies_to: "foreground_system_boundary"
      rule: "Post-acceptance observed H services keep original positive cohort Q0,c, actual original manufacturing/delivery history and exact evidenced original-delivery reversals; do not manufacture a negative shipment or credit by assertion. Actual later repair material/water increases wet state but never resets original Q0. Unknown future use, lifetime, impression count, washing, customer ink and disposal remain unknown outside observed scope. A new actual first acceptance after real included manufacture is distinct from a return/reinspection of an already accepted stamp. Physical gross service flows remain complete while per-cohort environmental demand uses only its nonoverlapping evidenced A_h,c/Q0,c."
      source_ids: []
    - rule_id: system_boundary_rule_23
      applies_to: "foreground_system_boundary"
      rule: "Source-backed manufacture and a calibrated actual complete-mass/inspection protocol establish a substantive candidate method; actual batch QA not yet performed is not proof that no method exists. Conversely, unknown essential rubber/ink/adhesive matrix composition, thermal-removal species analysis, actual producer completeness or incompatible whole-product gate cannot be closed by future SOP wording, generic gas factors, supplier promise, source title, finite check or translation alignment. Determine actual matrix-compatible procedures, sampling/recovery/calibration and real inspection criteria before claiming a qualified complete study. Ordinary grade/provider/quantity/UUID/range collection gaps remain explicit, not zeros; independent scientific, translation, study and mapping acceptance are separate."
      source_ids: []
    - rule_id: system_boundary_rule_24
      applies_to: "foreground_system_boundary"
      rule: "Illustrative counterexample only, not empirical defaults: a single 10 kg contaminated filter transfer containing 8 kg substrate and 2 kg retained material is physically received and treated as 10 kg once. If separate evidence in this hypothetical example assigns treatment service 25% to original new Q0=100 kg and 75% to old Q0=200 kg, modeled compatible-unit vectors are 2.5 and 7.5 kg-equivalent and normalized demands 0.025 and 0.0375 kg-equivalent/kg. They are not physical exports of 2.5/7.5 kg and not 10 kg modeled again for both. Unknown shares cannot adopt those values. A true 0.10 kg dry carton +0.02 kg retained matter +0.01 kg water is one 0.13 kg wet waste with nested components, never 0.10+extra residue exchanges."
      source_ids: []
