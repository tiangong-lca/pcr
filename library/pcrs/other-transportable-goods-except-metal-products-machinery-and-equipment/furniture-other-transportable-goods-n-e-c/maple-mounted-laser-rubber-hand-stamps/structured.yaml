      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| validate_whole_core | complete data package and declared applicability | Require a complete maple-grip/cushion/laser-rubber stamp and the declared first-release net-mass reference. Reject parts, another engraving/material route, an ink-pad bundle or design service under this method. Verify the same finished_stamp link and all reference qualifiers in both renderings. | `rubberstamps-wood-anatomy`; `rubberstamps-wood-product`; `trotec-stamp-engraving` |\n| validate_quantity_and_stock | complete data package and declared applicability | Check unique first-release Q, actual count/mass conversion when used, every raw/WIP/non-WIP/FG physical holding and inherited vector, same-cohort services and original delivery reversals. Confirm released closing FG counted once, internal Q/parts cancelled once and A/D or V/D executed once only; Q=0 has real retained loads with no unit result. | `rubberstamps-wood-product`; `simply-stamps-manufacture`; `jrc-ilcd-2010-allocation` |\n| validate_atomic_physical | complete data package and declared applicability | Verify one atomic card for every actual exchange and complete independent physical/element/species observations; no unsupported density, molecular speciation, heat return, recipe or default mass. Each adopted native type/grade/route/form/geography/media/CAS/property/unit must match; full gross packaging and article movements are not allocation shares. One real mixed Waste has one provider and a measured total or reconciled segregated outlets once, with independent nonadditive originW. | `trotec-stamp-engraving`; `cape-arago-mounting` |\n| validate_allocation_and_gaps | complete data package and declared applicability | Check dedicated/subdivided assignments, exchange-specific determining physical causality and only documented residual contemporaneous common-gate market values with conservation. Unresolved true whole-core or method applicability, uncharacterised actual flows or incomplete balances remain explicit and block a complete site conclusion. Engineering/translation alignment, source retrieval and identity checks alone never constitute scientific or translation approval or publication. | `jrc-ilcd-2010-allocation` |\n\n"
