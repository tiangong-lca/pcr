  - rule_id: validation_rule_52
    applies_to: "foreground_dataset_conformance"
    rule: "The unique first-quality-release reference output is the whole configured single-storey office cabin: welded and coated steel frame, insulated floor/walls/roof, actual weather/air seals, floor/lining, complete door/window and fixed electrical installation. No sanitary/plumbing/HVAC/loose furniture is included in this declared configuration. Weigh net permanent content including actual retained moisture once; exclude transport protection and lifting assets. A positively compatible whole-building native identity is required; steel/components or a freight container cannot substitute. At-plant production mix of finished manufactured buildings predominantly of metal only. No fixed geography, steel grade, geometry, fit-out, certification or performance is supplied by this broad native family. Use only the complete configured assembled office building established by the primary source and actual inclusion/QC records; no component, bare structure or freight container substitution. First release is the only production reference; other same-UUID movements are gross cohort service transfers. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_53
    applies_to: "foreground_dataset_conformance"
    rule: "Meter the actual purchased voltage/geography/contract supply once for fabrication, extraction, coating, fitment, tests, cleanup, start/stop and idle loads. Internal voltage transformation is not another purchase. Separate own generation/export and keep original kWh; 1 kWh = 3.6 MJ. No grid UUID or emission factor is inferred. CN user-side grid-average consumption mix below 1 kV only; other geography/voltage, generator output, renewable contract and distribution service require another matching flow. Native comments cover delivery to users; check upstream provider boundaries to avoid duplicate generation/transmission. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_54
    applies_to: "foreground_dataset_conformance"
    rule: "Only actual external cleaning, pretreatment or factory test water. Record full delivered mass and state; internally recirculated water is not another purchase. Do not infer high-pressure cabin cleaning, a sanitary commissioning test, steam or a boiler from a generic factory route. Product flow of treated industrial process water, Mass/kg; no fixed local supply route/geography or purity is established. Class18000 natural-water placement is retained as a classification inconsistency, while Product type, name and treatment comment consistently describe supplied industrial water. Do not use for direct resource uptake, untreated water, steam or already recirculating inventory, or duplicate purchases. Actual treatment and provider must match. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_55
    applies_to: "foreground_dataset_conformance"
    rule: "Conditional on an actual factory burner/curing or heating installation. Retain supplier composition, volume T/P and wet/dry basis, calorific value and measured consumption; no standard temperature or emission factor is assumed. Electrical-only curing does not activate this row. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_56
    applies_to: "foreground_dataset_conformance"
    rule: "Only actual site-controlled handling equipment or generation. Weigh issue and tank stocks, or use independently measured fuel-specific density at recorded conditions; transport-service fuel already in a provider dataset is not bought twice. Mass-reference diesel fuel material identity only; grade/formulation/density/heating value/refinery/geography/provider unspecified. Do not infer any of those or substitute an agricultural-energy/combustion-service row. Actual site fuel and upstream provider remain separately verified. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_57
    applies_to: "foreground_dataset_conformance"
    rule: "One actual supplied whole cleaning preparation at its real formulation/state. Only where used; the production source gives no universal degreaser/phosphate recipe. Record real disjoint separately supplied ingredients and any bath maintenance as their own cards."
