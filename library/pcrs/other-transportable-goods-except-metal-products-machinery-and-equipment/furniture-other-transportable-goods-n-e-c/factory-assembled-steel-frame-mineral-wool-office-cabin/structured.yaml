allocation_rules:
  - rule_id: allocation_context
    applies_to: "study method"
    rule: "These attributional rules apply only when the declared decision context requires allocation: Situation C2, or cases of A/B/C1 after documenting the situation-specific failure/infeasibility of subdivision, virtual subdivision and substitution/system expansion under ILCD. Do not export this hierarchy to consequential studies or infer LCA allocation from a manufacturing report."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: dedicated_first
    applies_to: "all exchanges"
    rule: "Assign dedicated material/article issues and operation records directly. Subdivide physically distinguishable lines, work orders, booths and tests; then virtual-subdivide exchange-specific embodied components and auxiliaries where quantitative relations are known. Keep full receiving populations and opening/closing burden vectors."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: determining_causality
    applies_to: "remaining shared exchanges"
    rule: "Identify a determining physical causal relation separately for each remaining exchange, supported by measured operation drivers and real technology. Mass, area, arc time, occupied cure time or number of units is allowed only if it actually determines that exchange; one physical driver is not automatically valid for all resources. Include idle, failed/reworked lots and allocation sensitivity."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: residual_market
    applies_to: "only residual common process"
    rule: "Only a genuinely remaining common-process burden may use contemporaneous market values of the real cofunctions at the same process gate and actual state, after dedicated/virtual/causal assignment. The allocated burden vectors across all recipients must sum exactly to the original pre-allocation vector, with no omitted recipient. Preserve price basis, time, amounts, receiving population, exclusions, uncertainties and sensitivity. Do not arbitrarily choose physical/economic allocation, prescribe shares or transfer actual material throughputs by a burden share."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: no_automatic_credit
    applies_to: "waste and reusable assets"
    rule: "Scrap/waste/packaging returns retain gross physical flow, actual legal/product state and receiver. No automatic avoided-steel, recovered-powder or reusable-rack credit. Capital/reusable asset manufacture, when included, uses one conserved lifetime burden ledger with an evidenced total-service denominator, uncertainty and reconciliation; no invented future reuse or charging whole asset manufacture each period."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_frame
      process_id: "frame"
      flow_role: "steel/weld/primer/powder"
      record_type: "raw manufacturing record"
      raw_fields: "sheet grade/form; issue/return mass; weld procedure/consumables; primer/powder formulation; bath/powder stocks; actual operation/cure energy/losses; actual_stage_event; original_Q0_Qc; observed_H; gross_V; independent_burden_A; whole_receiver_Qt; nonadditive_origin; matched_internal_history"
      collection_method: "Calibrated weighing, stock records, actual CNC/weld/coating logs and supplier SDS; identify dedicated versus shared work and all rejected/reworked lots Keep raw undivided physical quantities, actual complete wet stocks and own inherited WIP/fleet history once; reconcile full receiver Qt independently of nonoverlapping original-cohort A/Q."
      unit: "kg; original utility units"
      frequency: "each receipt/issue and run"
      temporal_coverage: "complete actual cohort including failed/start/stop/idle/cleanup"
      site_scope: "named factory and outsourced gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; mill/SDS/BOM; signed operations and stock balances"
    - protocol_id: cp_envelope
      process_id: "envelope"
      flow_role: "enclosure materials"
      record_type: "raw article/material record"
