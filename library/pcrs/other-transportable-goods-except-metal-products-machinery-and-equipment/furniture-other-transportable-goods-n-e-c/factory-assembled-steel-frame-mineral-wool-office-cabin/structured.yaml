measurement_rules:
  - id: release_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q is the sum of measured net kg of each complete configured cabin first quality-released once in the cohort. Weigh on a calibrated scale or reconcile calibrated masses of the complete actual configuration; subtract only measured excluded transport/temporary items. Catalogue approximate weights are not Q."
  - id: single_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared native property"
      uuid: ""
    required_unit: "Declared native unit"
    rule: "Keep raw V in its original units; convert genuine rates by time integration and unit conversions before physical reconciliation and burden attribution. Already integrated volumes are not multiplied by time again. normalize_once produces the sole per-reference result. Collection retains raw quantities, never a pre-divided result."
  - id: native_chain
    applies_to: "UUID-bearing rows"
    required_property_ref:
      name: "Exact reference property"
      uuid: ""
    required_unit: "Exact reference unit"
    rule: "A selected flow retains its full native restrictions and reference-property version to unit-group version and reference-unit chain. Number of items Item(s) and item differ only by spelling (factor 1); no item-to-kg, area-to-mass or density inference. Any needed conversion requires independent measured same-configuration net mass or actual geometry/material-specific density and state."
  - id: solid_volume
    applies_to: "timber_stud; floor_board"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Retain native solid-volume units for actual sawn timber and P5 particleboard. Measure supplied/used net solid geometry and moisture by lot; independently weigh wet mass for physical closure. Density conversion is allowed only from independent same-material measurement at the actual state, never a catalogue or secondary property factor."
  - id: water_energy
    applies_to: "water and heat/fuel/electricity"
    required_property_ref:
      name: "Declared native property"
      uuid: ""
    required_unit: "Declared native unit"
    rule: "Separate supplied full formulations/articles from their non-additive assays; distinguish retained/free/liquid/vapour/structural/reaction water only with evidence. Electricity kWh times 3.6 gives MJ. Actual carrier water/condensate/hot-water returns need gross mass, phase, T/P, enthalpy and supplier water/energy ownership; one supply is not purchased again as both kg and heat MJ. No steam/boiler loop is assumed."
