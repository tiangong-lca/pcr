system_boundary:
  rules:
    - rule_id: complete_terminal
      applies_to: "reference product"
      rule: "Accept only the complete configured office building, with frame/envelope/openings/fit-out confirmed against one controlled inclusion list. A material list, single beam, freight container, naked frame or component receipt alone cannot establish this terminal. Manufacturer examples support technical synthesis, not a claim of one SKU/factory/order."
      source_ids:
        - containex-classic-2025
        - unsd-cpc3-2025
    - rule_id: actual_manufacture
      applies_to: "factory operations"
      rule: "Include actual receipt, cutting/punching/bending/welding, frame pretreatment/coating, envelope fabrication/assembly, electrical installation, inspection, rework, extraction and cleanup. Record actual physical/chemical inputs and exports rather than substituting bought finished-cabin packaging. Supplier-finished galvanized sheet, boards, doors/windows or electrical modules inherit supplier manufacture once; do not repeat steelmaking, galvanizing or article recipes."
      source_ids:
        - containex-sheq-production
        - containex-classic-2025
    - rule_id: article_bridge
      applies_to: "all supplied articles"
      rule: "Use either whole supplied article/formulation or disjoint purchased constituents, or an explicitly reconciled bridge cancelling internal handoffs. Full article wet mass and its own wood/steel/glass/insulation/water/resin must not both be added. Assay/carrier-water/active fractions are non-additive subaccounts. Actual site mixing uses each separately purchased component, real energy, losses and actual recipe records."
      source_ids:
        - containex-classic-2025
        - containex-sheq-production
    - rule_id: gate_and_exclusions
      applies_to: "production and post-release"
      rule: "Q occurs at first factory quality release, including that cohort retained in closing FG. Do not subtract closing FG from this already released output or add it again. Preserve actual packaging, storage, handling, shipment, reinspection and incremental repair in a distinct service account tied to original Qc and observed horizon H. Future unperformed service is unknown. Cancel internal release handoffs in consolidated accounting; foundations, site lifting/joining, site earthing/connections, occupancy and later life are separate."
      source_ids:
        - containex-classic-2025
        - containex-sheq-production
    - rule_id: nonzero_and_stock
      applies_to: "all cohorts and physical gates"
      rule: "Keep failed/rejected/unauthorised/zero-output lots, start/stop, idle, cleanup, testing and actual rework loads. Opening/closing WIP has each actual physical material and inherited exchange-specific burden vector; transferred WIP carries both without loss or duplication. Raw and non-WIP stocks, finished goods, fluids, waste and reusable assets remain distinct. Reinspection/returns/authorisation do not create Q or erase actual loads."
      source_ids:
        - containex-sheq-production
    - rule_id: atomic_extension
      applies_to: "actual exchanges"
      rule: "The cards are conditional single exchanges, not a mandatory recipe. Add every actual unlisted fastener, gasket/membrane/adhesive, cleaner, abrasive, fuel, gas, reaction species, captured dust, waste and destination as its own card before dataset closure. Supplier/SDS and process evidence define the identity. Unknown actual flux, shielding gas, coating chemistry, air/water route or molecular balance stays unresolved; absence needs evidence, not zero or a hidden other collection."
      source_ids:
        - containex-sheq-production
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "The selected configuration uses a real P5 particleboard floor, vinyl roll floor covering, coated-chipboard wall/ceiling lining and mineral-wool floor/wall/roof insulation. Cement-bonded board, OSB, plywood and PU/PIR/stone-wool sandwich alternatives in the source are not blended into this inventory. These are actual evidenced options defining a meaningful narrower method, not a prescribed grade recipe or a claim that all combinations belong to one observed SKU. Record the complete supplied permanent building content, including the actual dedicated earthing clamp and any separately supplied installation fastener even if delivered loose. Exclude only real transport/temporary protection and handling assets from net supply mass; do not omit required permanent hardware as packaging."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "The factory gate is the complete manufactured single building supply, with its declared installed and supplied-to-install states. It is not a claim that foundation support, site lifting, hole sealing after transport-cover removal, protective earth connection, utility hookup, site structural arrangement or commissioning has already occurred. CLASSIC requires site foundations/support conditions and customer earthing/electrical checks before commissioning, and describes empty-road transport and a separate Transpack alternative. Retain those real downstream interfaces and source restrictions; no catalogue load, geometry, angle, torque, electrical rating or lifetime becomes a dataset default. An owned operation required to finish the selected factory supply is included wherever actually performed; moving its invoice or calling an unfinished module complete cannot remove it. Actual site-assembled/incomplete or multi-unit buildings require a separately evidenced route and are outside this selected terminal."
      source_ids: []
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "Every supplied sheet, insulation batt, board, door/window, harness, distribution assembly, luminaire, connector, clamp, formulation, fuel and packaging article requires a genuine complete matched upstream producer or a mutually exclusive expanded actual inventory. Cover actual metal extraction/steelmaking/rolling/galvanizing, fibre/binder and board production, electrical component/assembly manufacture, finishes, utilities, maintenance, packaging and waste as applicable. Whole supplied articles include their identified parts, resin/carrier water, coatings and installed hardware once. Source production photographs/capabilities are qualitative evidence, not a measured contemporary supplier order. No same-factory/SKU condition is imposed across independent evidence; an actual incompatible provider/route/form/geography/property remains unresolved. No complete cradle-to-gate claim before genuine provider interfaces and all actual owned manufacture are covered."
      source_ids: []
    - rule_id: system_boundary_rule_10
      applies_to: "foreground_system_boundary"
      rule: "Include real factory cleaning, joining, pretreatment, coating/curing and their full chemical/species destinations at actual provider/site gates. The historical source describes primer plus powder coating but does not prescribe a nanochemical, degreasing/phosphate recipe, curing reaction, burner, gas ratio or emission factor. Record actual formulations/assays, purchased premix versus separately supplied gases, captured dust/filter/wipe, liquid purge and each real receiving medium. Actual on-site fuel use needs its complete molecular air/fuel/water/species and energy interface, with background carrier CO2 distinct from generated fossil/biogenic carbon. Do not infer complete combustion, a PM/NOx/VOC molecule, all solvent evaporation, conserved reacting species or residual-fit water. Unknown material chemistry or essential speciation/sampling applicability keeps the affected concrete inventory unresolved; ordinary unperformed lot QA alone does not mean there is no method."
      source_ids: []
    - rule_id: system_boundary_rule_11
      applies_to: "foreground_system_boundary"
      rule: "The adopted whole Product is the manufactured finished predominantly-metal building family, production mix at plant, Mass/kg with its actual reference property/unit chain. It supplies no composition recipe, country, configuration, floor area or kg per building. Source-backed steel-frame whole-cabin manufacture and actual inclusion/acceptance records establish the selected product; steel, panels, transport containers, incomplete modules and erection services cannot substitute. Auxiliary native names include broad explanatory alternatives: particleboard is not OSB, sawn lumber is not a complete wooden frame, an exterior-window article retains its complete glazing/frame/hardware, powder coating is a dry supplied formulation and a low-voltage assembled distribution board is not a bare cabinet. Each actual bound material must fit every real hard field; qualifications cannot overwrite contradictions. Bound CN low-voltage electricity is only a conditional actual CN supply, never evidence that the European manufacturer example consumed CN electricity."
      source_ids: []
    - rule_id: boundary_pack
      applies_to: "each actual material pool"
      rule: "O + P + I + ER + J_in + H2O_in = C + S + EO + W + J_out + H2O_out. All terms are actual kg for one material/asset pool. O/C are complete wet opening/closing empty, attached WIP, attached FG and reusable stocks. P is new external procurement, I is disjoint supplier-included whole packaging ingress, ER external return received, S full gross shipment-attached export, EO independent external return sent, W whole wet discard. J_in/J_out are independently measured non-water repair/replacement/deposit/residue or other pool transfers not already in those whole legs. H2O_in/H2O_out are independently measured actual water transfers not already embodied in whole legs, including natural adsorption/desorption without repair. Split real wet added/removed materials into disjoint J and water from actual measurements, with no default ratio/density. Full W contains substrate, retained residues and water once; its nested children are not extra J_out/H2O_out unless actually separated before crossing. Matched internal pool transfers cancel without new purchase, service or Q."
      source_ids: []
    - rule_id: system_boundary_rule_13
      applies_to: "foreground_system_boundary"
      rule: "The CLASSIC English original is a publisher translation and explicitly directs consultation of the German version in case of doubt; unresolved translation/technical ambiguity cannot be repaired by a keyword or a convenient native unit. The historical SHEQ production text identifies robotic/plasma processing, frame welding, primer/powder finishing, final assembly, inspection and loading; it does not establish a universal solid-wire MAG process, shielding-gas recipe, energy source or coating chemistry. The named consumable and equipment cards are conditional on actual documented operations. CLASSIC and SHEQ share a publisher and are distinct specification/historical production evidence, not two independent factory observations. Preserve all configuration, country, source-edition and certification limitations; no promotional environmental benefit is adopted."
      source_ids: []
