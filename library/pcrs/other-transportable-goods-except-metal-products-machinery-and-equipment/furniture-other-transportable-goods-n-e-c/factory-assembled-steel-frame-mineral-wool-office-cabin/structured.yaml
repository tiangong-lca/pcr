  - rule_id: validation_rule_61
    applies_to: "foreground_dataset_conformance"
    rule: "Actual user-side AC supply outside the separately bound CN <1kV grid-average flow. Record exact geography, voltage, period, supply mix and upstream gate; each meter belongs to one disjoint supply card. This specific UUID remains unresolved, not a permission to use the bound CN flow for a European factory."
    source_ids: []
  - rule_id: validation_rule_62
    applies_to: "foreground_dataset_conformance"
    rule: "Only independently evidenced molecular O2 crossing a defined combustion/process-air gate; keep gross inlet and reaction balance. No virtual oxygen purchase or fixed air-composition coefficient. Molecular O2 CAS7782-44-7, Mass/kg renewable element resource from air only; not a purchased gas or emission. Retain actual atmosphere-to-process uptake and independent speciation; broad liquid/ionic aliases are not assumed actual states. Use normalize_once once for this card; raw collection is not pre-divided."
