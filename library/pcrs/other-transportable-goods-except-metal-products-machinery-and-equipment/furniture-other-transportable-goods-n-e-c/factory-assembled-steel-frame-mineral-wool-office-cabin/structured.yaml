  calculation_rules:
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "For each physical exchange set B_e to its full gross actual V_e in the native unit after recorded unit/state conversion; for a burden exchange set B_e to its dedicated/causally attributed A_e. r_e = B_e / Q exactly once for manufacturing, or B_e / original Qc for separately declared post-release service. Q and Qc are kg of the same complete configuration. If the relevant denominator is zero retain B_e without a unit result. Cards and protocol target bases reference this one result, never a second division."
      inputs:
        - B_e
        - V_e
        - A_e
        - Q
        - Qc
        - cp_release
        - cp_physical
        - cp_postrelease
      output: "r_e"
      source_ids:
        - containex-sheq-production
        - jrc-ilcd-2010
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Preserve original meter, weighing and state fields. Integrate a genuine rate over the recorded interval once; retain already integrated volume unchanged. Use independently measured substance-specific density/state for any volume/mass bridge and the exact native property/unit support for any unit conversion. Then reconcile physical balances and attribute A_e before normalize_once. No inferred density, part mass or carrier enthalpy."
      inputs:
        - cp_utilities
        - cp_species
        - cp_physical
      output: "converted raw quantities"
      source_ids:
        - containex-sheq-production
    - id: stock_and_cohort
      applies_to: "all inventory rows"
      rule: "Maintain each material physical opening+external receipts=closing+external outputs+evidenced transformation, with internal handoffs cancelled once and reaction/element checks independent. Carry each inherited exchange vector with WIP and FG by its real cohort. At first release transfer Q internally to FG; it is already in production Q even if retained at close. In FG trace original delivery/reversal, returns and actual incremental services against original Qc; do not recreate manufacture."
      inputs:
        - cp_physical
        - cp_release
        - cp_postrelease
      output: "reconciled physical and burden ledgers"
      source_ids:
        - containex-sheq-production
    - id: pack_pool
      applies_to: "all inventory rows"
      rule: "O + P + I + ER + J_in + H2O_in = C + S + EO + W + J_out + H2O_out. All terms are actual kg for one material/asset pool. O/C are complete wet opening/closing empty, attached WIP, attached FG and reusable stocks. P is new external procurement, I is disjoint supplier-included whole packaging ingress, ER external return received, S full gross shipment-attached export, EO independent external return sent, W whole wet discard. J_in/J_out are independently measured non-water repair/replacement/deposit/residue or other pool transfers not already in those whole legs. H2O_in/H2O_out are independently measured actual water transfers not already embodied in whole legs, including natural adsorption/desorption without repair. Split real wet added/removed materials into disjoint J and water from actual measurements, with no default ratio/density. Full W contains substrate, retained residues and water once; its nested children are not extra J_out/H2O_out unless actually separated before crossing. Matched internal pool transfers cancel without new purchase, service or Q."
      inputs:
        - O
        - P
        - I
        - ER
        - J_in
        - H2O_in
        - C
        - S
        - EO
        - W
        - J_out
        - H2O_out
        - L_in_observed
        - L_out_observed
        - X_in
        - X_out
        - cp_packaging
        - cp_postrelease
      output: "per-material packaging closure"
      source_ids:
        - containex-sheq-production
  data_quality_requirements:
    - id: configuration
      applies_to: "all rows"
      requirement: "Controlled assembled single-cabin BOM and complete inclusion/geometry/layer/electrical records; identify all real deviations and actual configuration-specific tests without borrowing catalogue performance."
      evidence: "signed BOM, drawings, supplier content and QC"
    - id: identity
      applies_to: "all selected flows"
      requirement: "Verify all native basename/synonym/comment/CAS/route/grade/form/media/type/geography/properties and exact support chain; actual supplied articles require positive family compatibility. Blank auxiliary identities and provider gaps remain individually disclosed."
      evidence: "complete direct native record and applicability decision"
    - id: coverage
      applies_to: "whole cohort"
      requirement: "All raw/WIP/nonWIP/FG and packaging/fluids/assets/wastes, each inherited exchange vector, Q=0/failed/reworked/idle/cleanup loads and actual observed post-release H retained; no future-service completeness claim."
      evidence: "independent physical/element/vector/cohort reconciliations"
    - id: uncertainty
      applies_to: "all calculations"
      requirement: "Record measurement resolution/calibration, missing actual quantities, independent species/water constraints, source temporal/site limitations, upstream/provider gaps and allocation sensitivity; do not declare unknown relationships passing."
      evidence: "instrument and laboratory records; gap register and sensitivity"
validation_rules:
  - rule_id: whole_configuration
    applies_to: "reference and supplier coverage"
    rule: "Verify whole-building core compatibility and the same assembled single-cabin configuration across BOM, weighing, tests, native restrictions and bilingual records. Distinguish approved/permitted configuration from actually executed movement/work. A failed or unauthorised unit retains its full actual physical flow and burden without accepted output."
    source_ids:
      - containex-classic-2025
      - containex-sheq-production
  - rule_id: quantity_and_inheritance
    applies_to: "manufacture / FG / consolidated"
    rule: "Independently close total physical mass and relevant elemental balances at manufacturing, finished-goods and consolidated gates using consistent inclusion and measured moisture/species. Keep full wet closing stocks and raw/WIP/non-WIP/FG exchange-specific inherited vectors; explain residuals with independent measurements. One residual cannot fit two unknowns. Cancel internal release and component handoffs only once."
    source_ids:
      - containex-sheq-production
  - rule_id: packaging_conservation
    applies_to: "each packaging material"
    rule: "For each actual packaging material, reconcile opening empty plus attached WIP/FG plus reusable stock, purchases and external returns received against closing corresponding stocks plus gross shipment-attached export plus independent external returns sent plus waste. Separate each actual movement direction and destination; internal reuse cancels. Do not use net product Q, stock difference, burden share or economic/service share as a substitute for gross exported physical quantity. O + P + I + ER + J_in + H2O_in = C + S + EO + W + J_out + H2O_out. All terms are actual kg for one material/asset pool. O/C are complete wet opening/closing empty, attached WIP, attached FG and reusable stocks. P is new external procurement, I is disjoint supplier-included whole packaging ingress, ER external return received, S full gross shipment-attached export, EO independent external return sent, W whole wet discard. J_in/J_out are independently measured non-water repair/replacement/deposit/residue or other pool transfers not already in those whole legs. H2O_in/H2O_out are independently measured actual water transfers not already embodied in whole legs, including natural adsorption/desorption without repair. Split real wet added/removed materials into disjoint J and water from actual measurements, with no default ratio/density. Full W contains substrate, retained residues and water once; its nested children are not extra J_out/H2O_out unless actually separated before crossing. Matched internal pool transfers cancel without new purchase, service or Q. Raw-observation reconciliation is L_in_observed - X_in = P + I + ER + J_in + H2O_in and L_out_observed - X_out = S + EO + W + J_out + H2O_out. L is an observation-side sum only, never an extra physical exchange/provider demand. Map each X by exact event/component/unit/side to a duplicate OTHER observation already counted once on the same canonical side. Every real J/H2O remains once; X cannot cancel true retained influx, C/O, an opposite-side movement or a nested W child merely because it remains in stock. Disjoint observations use X=0. Internal attachment/reuse is not a boundary crossing. Material transferred from an internal repair/asset pool has matched source/destination entries; its purchase and inherited burden are not repeated. Unknown water/material stays unresolved; do not fit a residual. Actual customer disposal beyond the declared factory/service gate is a separately disclosed downstream event, not a fictional factory W."
    source_ids:
      - containex-sheq-production
  - rule_id: species_and_state
    applies_to: "air/water/reactions"
    rule: "Keep each actual molecular gas, carbon source, medium, phase, gross inlet and outlet separately. COD/VOC/NOx/PM indicators do not establish molecular masses. Reaction, structural, free, liquid and vapour water require independent evidence; evaporation/absorption and retained water are not invented reaction or repair. Genuine gas/liquid rates are integrated once; already integrated volume stays volume. Every density is substance- and state-specific, never default water density."
    source_ids:
      - containex-sheq-production
  - rule_id: source_and_data
    applies_to: "all actual quantities and references"
    rule: "Retain full source context and supplier/route/state applicability, exact native identity/property/unit chain, actual records and uncertainty. No default dimensions, area, thickness, density, unit weight, yield, temperature, time, lifetime, certification, performance, factory energy, installation share or emissions factor. Unresolved core/closure and missing actual observations remain explicit holds; ordinary auxiliary/provider identity gaps are disclosed individually."
    source_ids:
      - containex-classic-2025
      - containex-sheq-production
  - rule_id: one_division
    applies_to: "all calculations"
    rule: "Every physical exchange uses gross V in its real native unit and cohort denominator Q or original Qc; no allocation share shrinks physical logistics. Only attributable burdens A are subdivided/allocated. Apply normalize_once once after raw conversion and attribution; cards and aggregation refer to that same result. Q=0 retains actual loads and flows without a per-unit result. Closing FG already first released belongs in Q; delivery/retest/return never creates another Q."
    source_ids:
      - containex-sheq-production
      - jrc-ilcd-2010
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "Q0 denotes the locked positive original first-acceptance cohort mass; Q=0 denotes a zero-output observation. They are different accounts. Original-cohort service uses the same original Q0=Qc and observed H, not a new mass or a second normalization."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Lock original cohort c and original Q0=Qc=sum(M_e) at unique first conforming whole-cabin acceptance events e. Each M_e is calibrated complete net wet cabin kg at that event with the actual integral supplied components once, packaging and test assets excluded. Manufacturing Q is the original Qc of the declared manufacturing cohort. Do not recompute Qc from present surviving mass, net shipment, later reinspection or wet/dry changes. Failed/no-release Q=0 retains all raw loads and no normalized result. Opening raw/WIP carries its measured physical stock and inherited exchange vector once; an opening accepted cabin retains its original Qc and manufacture history, not a new purchase or acceptance."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "For every original accepted event partition its original-acceptance basis into disjoint net external possession, on-site released FG, quarantine, repair/rework WIP, internal use, irreversible destroyed/lost portions and other documented terminal dispositions. Their current/terminal sum equals original Qc independently of present wet physical mass. Gross dispatch and returns remain complete physical events; a return reverses the corresponding external possession before later redispatch moves the same surviving entitlement. Split partial loss and survival on a documented original basis; do not restore lost water/parts to the survivor and also export the loss. Present wet stocks, evaporation, removed/new parts and all physical exits have their own conservation bridge. Unknown genealogy or cohort assignment stays unresolved with complete raw totals; loops, postacceptance destruction, retest and failed work create no new Q."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Record actual receiver-transfer t and full wet whole outlet Qt once: discarded hardware, packaging, wipe, swab, cloth, filter or equipment substrate plus actually retained solvent, dust, formulation residues and water. Dry substrate, contained chemical and water ledgers are reconciled non-additive children. They become separate external waste exits only after real physical separation before the boundary with separate transfer IDs. Package W or removed-part origins within one mixed outlet are traced children, never a second export or second treatment demand. Actual receiver receipts and total treatment demand remain Qt, independent of environmental attribution."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "Assign environmental/service vectors A_tc to nonoverlapping original cohorts from demonstrated causal demand and the allocation hierarchy. Reconcile sum_c(A_tc) plus actual other-function/unassigned vectors to the one actual total provider demand. Physical Qt remains in one event register; reports link to it rather than charge the full event again to each cohort or shrink the physical export by an allocation fraction. Physical V/D context disclosures are non-additive across overlapping reports. Treatment and service inventory is independently assigned A_tc/D, using manufacturing Q or original Qc with observed H; it is not an extra full Qt/D for every cohort. Keep genuinely unknown allocation unresolved. Supplier-embedded history/treatment and fully expanded corresponding direct inventories are mutually exclusive representations, not additive purchases."
    source_ids: []
  - rule_id: validation_rule_12
    applies_to: "foreground_dataset_conformance"
    rule: "Every supplied sheet, insulation batt, board, door/window, harness, distribution assembly, luminaire, connector, clamp, formulation, fuel and packaging article requires a genuine complete matched upstream producer or a mutually exclusive expanded actual inventory. Cover actual metal extraction/steelmaking/rolling/galvanizing, fibre/binder and board production, electrical component/assembly manufacture, finishes, utilities, maintenance, packaging and waste as applicable. Whole supplied articles include their identified parts, resin/carrier water, coatings and installed hardware once. Source production photographs/capabilities are qualitative evidence, not a measured contemporary supplier order. No same-factory/SKU condition is imposed across independent evidence; an actual incompatible provider/route/form/geography/property remains unresolved. No complete cradle-to-gate claim before genuine provider interfaces and all actual owned manufacture are covered."
    source_ids: []
  - rule_id: validation_rule_13
    applies_to: "foreground_dataset_conformance"
    rule: "Preserve the actual CNC cutter, press, welding equipment, curing oven, handling crane/forklift, scale and electrical tester as physical fleets with opening, receipts, in-use, external transfers, retirement and closing states separate from service demand. Record actual installed parts/fluids, observed operation, maintenance, removed/new materials, leakage and whole contaminated disposal once, linked to original cohorts and compatible provider service units. No assumed life, future replacement count, guessed equipment mass or one whole machine per cabin kg. A real crane/forklift or complete upstream service and its expanded fuel/electricity/maintenance inventory are mutually exclusive; an actual owned machine cannot be hidden in a paper purchased service."
    source_ids: []
  - rule_id: validation_rule_14
    applies_to: "foreground_dataset_conformance"
    rule: "O + P + I + ER + J_in + H2O_in = C + S + EO + W + J_out + H2O_out. All terms are actual kg for one material/asset pool. O/C are complete wet opening/closing empty, attached WIP, attached FG and reusable stocks. P is new external procurement, I is disjoint supplier-included whole packaging ingress, ER external return received, S full gross shipment-attached export, EO independent external return sent, W whole wet discard. J_in/J_out are independently measured non-water repair/replacement/deposit/residue or other pool transfers not already in those whole legs. H2O_in/H2O_out are independently measured actual water transfers not already embodied in whole legs, including natural adsorption/desorption without repair. Split real wet added/removed materials into disjoint J and water from actual measurements, with no default ratio/density. Full W contains substrate, retained residues and water once; its nested children are not extra J_out/H2O_out unless actually separated before crossing. Matched internal pool transfers cancel without new purchase, service or Q."
    source_ids: []
  - rule_id: validation_rule_15
    applies_to: "foreground_dataset_conformance"
    rule: "Raw-observation reconciliation is L_in_observed - X_in = P + I + ER + J_in + H2O_in and L_out_observed - X_out = S + EO + W + J_out + H2O_out. L is an observation-side sum only, never an extra physical exchange/provider demand. Map each X by exact event/component/unit/side to a duplicate OTHER observation already counted once on the same canonical side. Every real J/H2O remains once; X cannot cancel true retained influx, C/O, an opposite-side movement or a nested W child merely because it remains in stock. Disjoint observations use X=0. Internal attachment/reuse is not a boundary crossing. Material transferred from an internal repair/asset pool has matched source/destination entries; its purchase and inherited burden are not repeated. Unknown water/material stays unresolved; do not fit a residual. Actual customer disposal beyond the declared factory/service gate is a separately disclosed downstream event, not a fictional factory W."
    source_ids: []
  - rule_id: validation_rule_16
    applies_to: "foreground_dataset_conformance"
    rule: "This PCR defines new manufacture of one complete factory-assembled, single-storey steel-frame office cabin, with mineral-wool floor/wall/roof insulation, the declared board/lining/floor-covering options, complete door/window and fixed electrical fit-out. The controlled actual configuration must show a whole prefabricated building predominantly made of metal; a structural skeleton, shipping container, component bundle or bought complete-cabin repackaging does not qualify. The manufacturer CLASSIC Line document establishes this architecture and distinguishes sanitary, corridor, material and flatpack alternatives. The SHEQ report supplies qualitative fabrication/coating/final-assembly context across its production network. Their combination is a transparent technical synthesis, not one proven contemporary SKU, factory or order. No source-specific quantity, performance or certification is transferred as a general default."
    source_ids: []
  - rule_id: validation_rule_17
    applies_to: "foreground_dataset_conformance"
    rule: "The selected supply terminal is an independently complete assembled office cabin at first factory quality release, rather than a multi-cabin building completed on site. Sanitary/plumbing, HVAC, loose furniture, transport-container cargo function, foundation/site crane/joining/utility/earthing work, occupancy, maintenance and end-of-life are excluded from this configuration. Changes within the selected configuration need a separately disclosed dataset and fresh applicability assessment; other source architecture options are outside this selected method. Flatpack/incomplete buildings can fall within the broader CPC class but this assembled-office method does not claim their coverage."
    source_ids: []
  - rule_id: validation_rule_18
    applies_to: "foreground_dataset_conformance"
    rule: "The selected configuration uses a real P5 particleboard floor, vinyl roll floor covering, coated-chipboard wall/ceiling lining and mineral-wool floor/wall/roof insulation. Cement-bonded board, OSB, plywood and PU/PIR/stone-wool sandwich alternatives in the source are not blended into this inventory. These are actual evidenced options defining a meaningful narrower method, not a prescribed grade recipe or a claim that all combinations belong to one observed SKU. Record the complete supplied permanent building content, including the actual dedicated earthing clamp and any separately supplied installation fastener even if delivered loose. Exclude only real transport/temporary protection and handling assets from net supply mass; do not omit required permanent hardware as packaging."
    source_ids: []
  - rule_id: validation_rule_19
    applies_to: "foreground_dataset_conformance"
    rule: "Declare every qualifier in dataset metadata, reference comment or an equivalent complete record. One kg is a scaling basis for the whole building; it is not an isolated kilogram of steel."
    source_ids: []
  - rule_id: validation_rule_20
    applies_to: "foreground_dataset_conformance"
    rule: "All cards are individual physical exchanges and conditional evidence requirements, not a default BOM. At closure each actual independent item/formulation, process input, waste, chemical species and destination must have its own card. When a supplied article already includes a constituent, use a disjoint representation or reconciled article bridge with internal transfers cancelled; never add full article wet mass and its embodied materials again. A single physically mixed waste uses one total with independent non-additive measured originW subaccounts and one provider. No actual exchange may be hidden by zero, other, unresolved UUID or an absent card. Full row descriptions, including every supplier/native restriction, are part of the rule."
    source_ids: []
  - rule_id: validation_rule_21
    applies_to: "foreground_dataset_conformance"
    rule: "Received sheet/coil for actual cutting, punching, bending and welded floor/roof frames. Retain mill grade, thickness, surface and supplier state; zinc-coated stock is a separate supplied identity. Supplier rolling/steelmaking is upstream. Weigh issue and unused return separately; no catalogue steel-mass factor. At-plant production-mix steel sheet/plate, iron with minor carbon/manganese/sulfur/phosphorus/silicon, permitting cold or hot rolling. This card is restricted to the actual received cold-rolled non-alloy sheet with supplier grade/thickness/surface confirmed; it is not rod, alloy steel, already finished frame or a coating recipe. Generic supplier/grade absence does not invent values. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_22
    applies_to: "foreground_dataset_conformance"
    rule: "Only where actual welding uses this solid-wire consumable. Record designation, composition, spool issues/returns and weld procedure; the source proves welding, not this consumable or a universal MAG route. Add each actual electrode/flux separately if different. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_23
    applies_to: "foreground_dataset_conformance"
    rule: "Conditional on the actual purchased premix and weld procedure. Purchase the whole supplied mixture once; measure composition and cylinder net mass or state-specific volume/density. Constituents are non-additive subaccounts. Pure gases require separate disjoint supply rows; no assumed blend ratio. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_24
    applies_to: "foreground_dataset_conformance"
    rule: "One actual purchased primer used before powder coating. The historical report describes nanotechnology primer but gives no recipe, resin or bath concentration. Retain supplier SDS, supplied full formulation including carrier water, additions, tank stocks and real losses; assay and water are subaccounts, never additional purchases. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_25
    applies_to: "foreground_dataset_conformance"
    rule: "One supplier-confirmed complete powder formulation. Record polymer/crosslinker/pigment/filler content without inventing a recipe. Weigh new additions, reusable powder pool, overspray and waste; internal recovered overspray is not purchased again. Actual pretreatment, application and cure conditions/energy must be collected. At-plant complete free-flowing dry powder paint for charged-surface application and actual heat/UV cure. No resin, solvent fraction, temperature, cure duration, efficiency or performance value is fixed. One supplier formulation is purchased once; ordinary composition/provider gaps require records and do not permit a wet-paint or finished coated-component substitution. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_26
    applies_to: "foreground_dataset_conformance"
    rule: "Actual steel offcuts leaving this gate, with alloy/coating/contamination and receiver declared. Full gross exported quantity is separate from generation and closing stock. Internal reuse cancels; no automatic saleable-product status or avoided-steel credit. CN at-plant cutting/forming steel offcut Waste only, with no yield/rate provided. Other geography, oily/welding sludge, demolished steel or another actual scrap state requires a matching identity; no5% yield assumption or automatic recycling credit. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_27
    applies_to: "foreground_dataset_conformance"
    rule: "Only actual wet sludge from this coating route. Retain dry solids, water and actual hazardous constituents as subaccounts of the one wet export, not duplicate Waste purchases/outputs. Missing composition requires analysis, not residual fitting. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_28
    applies_to: "foreground_dataset_conformance"
    rule: "Only powder that actually leaves for waste management; distinguish reusable booth inventory, filter-held powder and dispatched waste. Contamination and receiver govern the identity. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_29
    applies_to: "foreground_dataset_conformance"
    rule: "Purchased galvanized sheet for the roof, underfloor or external wall, separately identified by application and coating state in raw records. Purchased prepainted sheet already includes supplier coating; do not add zinc or supplier paint again. Actual site profiling/cutting is retained. Different grades/coatings require separate rows. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_30
    applies_to: "foreground_dataset_conformance"
    rule: "Actual mineral-wool route only, for floor/roof/wall quantities kept separately. Retain fibre family, binder, facing, water content, dimensions and supplied mass. Rock wool and glass wool are not automatically interchangeable; no density, thermal rating or thickness is prescribed. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_31
    applies_to: "foreground_dataset_conformance"
    rule: "For the source-supported mineral-wool wall timber frame and actual roof crossmembers. Retain species, treatment, grade, moisture and measured mass; distinguish stock from installed timber and offcuts. No species, dry density or preservative recipe is inferred. At-plant sawn/planed dimensional construction lumber; pine and oak are examples, not prescribed species. Native reference Volume/m3 must be retained. Measure actual solid dimensions/volume with moisture/state; independently weigh wet physical mass for closure or use independently measured same-material density at that state. No secondary coefficient or default density converts m3 to kg. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_32
    applies_to: "foreground_dataset_conformance"
    rule: "Only the declared actual P5 floor option. Cement-bonded board, OSB and plywood shown nearby are alternatives, not simultaneous recipe ingredients; a different actual option requires its own atomic card. Purchased board includes its resin and supplier manufacture once. One actual P5 particleboard floor panel within the finished wood-chip/shaving/resin board family, not every alternative in the broad official Chinese display. UF is described as common, not a mandatory recipe. Native Volume/m3 remains; collect actual panel net solid volume and independent wet mass/moisture, with no default density. No coating/laminate or supplier resin is repurchased. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_33
    applies_to: "foreground_dataset_conformance"
    rule: "Actual coated chipboard wall/ceiling/partition lining. Identify each specification and supplied finish; supplier resin/coating is embedded, not repurchased. Sheet-metal/plasterboard lining alternatives are outside this declared configuration unless separately specified and inventoried. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_34
    applies_to: "foreground_dataset_conformance"
    rule: "One actual supplied finished flooring formulation, including backing/fillers. Record roll mass, laid area and cut losses; hot seam welding occurs only where performed. Do not reconstruct this article as virgin PVC plus duplicated finished flooring. One complete finished vinyl/plastic floor-covering roll within the at-plant manufactured covering-article family. Wall/ceiling/tile alternatives in its official basename are not additional purchases or a combined physical exchange. Confirm actual vinyl formulation/backing and installed state; raw PVC resin or laminate wood flooring is not this article. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_35
    applies_to: "foreground_dataset_conformance"
    rule: "Only actual factory-applied silicone sealant with supplier composition, carrier and cure system confirmed. Site-only transport-hole sealing is outside this gate. Other actual sealants/adhesives require their own cards; no cure by-product or water reaction is assumed. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_36
    applies_to: "foreground_dataset_conformance"
    rule: "One specified finished gasket article where actually fitted to the envelope. Identify polymer, section, full supplied composition and mass; do not substitute raw rubber or assume a vapour membrane. Any actual separate air/vapour/water membrane or fastening tape needs its own card and measured quantity. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_37
    applies_to: "foreground_dataset_conformance"
    rule: "One specified bolt article used to connect posts to floor/roof. Purchased coating is included once; actual nuts, washers, screws, rivets and inserts are distinct articles requiring separate cards when present, not a fastener collection. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_38
    applies_to: "foreground_dataset_conformance"
    rule: "One actual screw product for envelope fitment. Retain dimensions, alloy and finish, issued/unused stock and installed mass; separate other physical fasteners rather than hiding them in this row. GLO production mix at plant; assembly auxiliary steel screw only, with no fixed grade/coating or supplier established. It does not identify a bolt/nut/rivet/washer or a whole fastener collection; actual specification and upstream provider still require review. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_39
    applies_to: "foreground_dataset_conformance"
    rule: "Only one actual whole supplied flooring adhesive if used for the selected P5/vinyl route. Strip welding and bonding are not assumed identical; separately supplied hardener or primer needs its own card."
    source_ids: []
  - rule_id: validation_rule_40
    applies_to: "foreground_dataset_conformance"
    rule: "Only this actual segregated board-offcut stream; retain coating/resin and moisture. Export mass, on-site retained stock and generation differ. A genuinely mixed waste may instead use one MixedWaste card with measured non-additive origin subaccounts and a single provider; never force a fictitious separated export. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_41
    applies_to: "foreground_dataset_conformance"
    rule: "Actual segregated mineral-wool offcut export, with fibre/binder/facing and moisture retained. Captured dust and attached WIP inventory are separate states; no assumed harmless or recoverable status. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_42
    applies_to: "foreground_dataset_conformance"
    rule: "Purchase the complete door leaf/frame/seal/hardware assembly once with its actual inclusion list. The manufacturer describes coated galvanized steel leaves and insulated options; actual component masses are non-additive article subaccounts. Independently supplied hardware is disjoint, not repurchased inside the assembly. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_43
    applies_to: "foreground_dataset_conformance"
    rule: "One actual complete office window with declared frame polymer, glazing, gas fill, seal, shutter and hardware inclusion. Supplier glass/frame/gas manufacture is upstream; do not also purchase those embodied constituents. Catalogue glazing dimensions and gas are not universal measurements. At-plant manufactured exterior-window family, one complete supplied plastic-frame double-glazed office window with its actual shutter/hardware inclusions. The native comment lists optional trim/shutter/flashing and new/replacement installation examples; these do not require a specific frame material, installation flange or additional purchases. Confirm actual complete-article inclusions; glazing alone is not this article. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_44
    applies_to: "foreground_dataset_conformance"
    rule: "Actual complete supplied wiring harness only where purchased in this form; retain national electrical configuration, conductor/insulation specification and connector inclusion. If site-wired from cable reels, replace with each actual cable and connector product, with internally fabricated harness handoffs cancelled. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_45
    applies_to: "foreground_dataset_conformance"
    rule: "One purchased complete board with actual protective devices and mounting state. Record the inclusion list; separate site-fitted protection devices only if not already in this article. Rating is configuration metadata, not consumed electricity. One finished at-plant equipped electrical distribution-board assembly, voltage not exceeding1000V. The broad native family also names consoles/cabinets/bases, but this card is one complete cabin board only; it does not identify a socket, empty enclosure, high-voltage board or separate device collection. Actual ratings and supplied device list require records. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_46
    applies_to: "foreground_dataset_conformance"
    rule: "One installed supplied luminaire article. Retain actual power/driver/housing inclusion and installed count/mass; factory test electricity is independently metered and never inferred from rating alone. One complete manufactured at-plant luminaire designed solely for LED light sources; no LED module/driver-only or fluorescent fitting substitution. Use actual full article mass and inclusion list, no assumed wattage, lifetime or luminous performance. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_47
    applies_to: "foreground_dataset_conformance"
    rule: "One specified complete socket article where not embedded in a purchased harness/panel. Retain national type, contacts, box and faceplate inclusion; switches and external CEE connectors need separate cards if actually supplied independently. Use normalize_once once for this card; raw collection is not pre-divided."
    source_ids: []
  - rule_id: validation_rule_48
    applies_to: "foreground_dataset_conformance"
    rule: "Actual separately supplied complete switch, including its real contacts/body once; not another charge when already included in a purchased wired module."
    source_ids: []
  - rule_id: validation_rule_49
    applies_to: "foreground_dataset_conformance"
    rule: "Actual complete externally recessed inlet connector at the declared national electrical configuration. Keep its included contacts/housing/fasteners once and distinguish mating supply cable outside the factory supply."
    source_ids: []
  - rule_id: validation_rule_50
    applies_to: "foreground_dataset_conformance"
    rule: "The CLASSIC source explicitly supplies a clamp for installation on site by the customer. Include the real dedicated permanent clamp in the declared complete supply mass even if delivered loose, with fitment state recorded; it is not transport tare or proof of commissioned site earthing."
