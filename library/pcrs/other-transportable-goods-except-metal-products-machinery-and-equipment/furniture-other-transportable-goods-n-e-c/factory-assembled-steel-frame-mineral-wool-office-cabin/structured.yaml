    rule: "Only actual whole contaminated retired equipment including substrate/installed residue/water once. If one physical mixed receiver event already includes it, keep it as non-additive measured origin; actual full receiver demand is independent of cohort burden attribution."
    source_ids: []
  - rule_id: validation_rule_130
    applies_to: "foreground_dataset_conformance"
    rule: "Protocols collect raw original observations only. Their aggregation_rule states the target reference basis for grouping, never permission to divide raw collection values. Preserve every raw unit/rate/state and inherited vector. Convert raw units/rates and perform real attribution before the single normalize_once calculation; card amounts and reporting aggregation reuse that same result. Q is first-released complete net kg; actual finished-goods services and all associated gross physical movements bind to original cohort Qc and observed horizon H. No future service, assumed restoration, new output on reinspection or removal of failed/unauthorised activity is permitted."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Compatible complete steel-frame office-cabin manufacture at the declared configuration and first-release gate"
  allowed_use: "Use foreground results with explicit supplier manufacturing, actual logistics and waste-treatment links; post-release services separately tagged by original Qc and observed H"
  excluded_use: "Freight container, single steel component, bare kit, sanitary module, multi-module site building, installation/operation/occupant service; unsupported structural/fire/thermal/certification/lifetime claims"
  required_metadata: "All reference qualifiers; exact native restrictions; one supply inclusion and supplier/site bridge; process/stock/cohort and gross flow boundaries"
  required_quality_disclosure: "Actual measurement and normalization basis; open core/closure/auxiliary/provider/source gaps; study context and allocation evidence; observed period and unperformed future services"
  update_trigger: "Configuration, enclosure/fit-out, input supply state, welding/coating route, first-release gate, provider/native identity, measurement or source-method change"
