    source_ids: []
  - rule_id: validation_rule_60
    applies_to: "foreground_dataset_conformance"
    rule: "One actual specified supplied lubricant formulation. Retain opening/in-place/new/closing fluid and measured leakage/removal separately from equipment service burden, with no assumed change interval."
