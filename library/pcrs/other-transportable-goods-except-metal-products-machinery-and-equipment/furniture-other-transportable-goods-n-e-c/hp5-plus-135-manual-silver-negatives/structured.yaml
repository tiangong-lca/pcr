      collection_method: "Weigh and sample each actual segregated transfer with representative methods and uncertainty. For physical mixtures collect one total and independently measured non-additive origins; retain only one provider export. Use total Ag for element closure, with speciation measured separately. Sludge moisture is not film/silver yield; COD/VOC is not chemical identity. Follow the full binding section5 conditions, compatible provider units and section9 synthetic counterexamples; collect raw totals before attribution."
      unit: "kg; native raw units"
      frequency: "Each event/bath/lot and measured interval"
      temporal_coverage: "Complete reporting window and relevant original-cohort H"
