allocation_rules:
  - rule_id: allocation_scope
    applies_to: "attributional multifunctional processes"
    rule: "Use this hierarchy only for attributional cases requiring allocation. First assign dedicated inputs/operations directly and investigate actual or virtual subdivision by batch, bath, equipment and function. Do not use manufacturer instructions as LCA allocation evidence."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: determining_causality
    applies_to: "each remaining shared exchange"
    rule: "Establish the physical relationship determining each exchange separately, using actual meters/chemistry/processing observations. Bath turnover, film area, exposure time, thermal capacity or occupancy are candidate drivers only when demonstrated to determine that exchange. One convenient mass or time share is not automatically valid for all electricity, chemicals, silver and space services."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: residual_economic
    applies_to: "demonstrably unresolved residual burdens"
    rule: "Only residual burdens without a determining physical relationship use justified contemporaneous market values at the same common-process exit and actual state/quality/quantity. Remove downstream finishing, packing, transport and service value where necessary to recover that gate value; disclose estimation and sensitivity. Do not freely choose physical versus economic, fixed shares, or creative-image sales value for already separable processing."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: vector_not_mass
    applies_to: "physical ledgers and burdens"
    rule: "Allocation divides burden vectors, not physical outgoing wet mass. Preserve full gross quantities and stock history, conserve every exchange vector across assigned and unassigned functions, and keep cohort services separate. If software cannot express custody separately from burden attribution, construct explicit measured stock/service units rather than duplicate providers or shrink physical flows."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: silver_no_credit
    applies_to: "silver-bearing waste and any recovery"
    rule: "Sale or transfer of silver-bearing liquid, sludge or waste film does not itself move manufacturing burdens to the receiver or earn avoided-silver credit. Retain full waste state, actual treatment and historical burdens. Any real recovered product and separate recovery process require their actual inventory and a separately justified allocation boundary; no assumed recovery yield."
    source_ids:
      - ilcd-detailed-2010
      - ilford-rapid-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "negative_production"
      flow_role: "first_negative_release"
      record_type: "new first-release and raw film weighing records"
      raw_fields: "lot/strip IDs; raw gross and tare readings; same-state net film mass; conditioning temperature/humidity and time; retained moisture; first-release timestamp; acceptance/hold/reject; removed leaders/trim/samples; opening/closing WIP/FG; Qc; original Q0,c; each original event fate D0/C0/L0/T0; actual state/moisture bridges; pre/postacceptance samples; complete all onsite accepted states"
      collection_method: "Calibrated balance after complete actual drying and declared conditioning; weigh net complete film apart from removable packaging. Reconcile unique IDs against prior releases and actual quality tests, including image polarity/density/contrast, fixation/washing, scratches and drying marks. Record raw masses; measure same-lot net item/areal mass independently only when needed. No geometric/density guess or invented test threshold. Follow the full binding section5 conditions, compatible provider units and section9 synthetic counterexamples; collect raw totals before attribution."
      unit: "kg"
      frequency: "Each event/bath/lot and measured interval"
      temporal_coverage: "Complete reporting window and relevant original-cohort H"
      site_scope: "Declared site and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw source records; sampling/detection; state/stock/vector reconciliation and uncertainty"
