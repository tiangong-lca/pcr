      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Purchased complete unexposed HP5 PLUS135 film at receipt; whole DD-X/ILFOSTOP/RAPID FIXER/ILFOTOL concentrates; actual water/electricity and physical packaging |\n| starting_condition_role | Purchased completed media to actual optical exposure and complete negative processing |\n| product_classification_scope | Narrower non-cine still-negative subset of CPC3.0:38942 |\n| recursive_input_rule | A previously developed negative received for rewash/reinspection is linked to original Qc and historical burdens, never fresh unexposed stock or new Q. Purchased film and formulations carry their actual upstream manufacture once. |\n| upstream_dataset_requirement | Link complete film manufacture/converting and supplier packaging, each whole concentrate, actual camera/equipment use, water/electricity, transport and actual external waste treatment without overlapping provider scopes |\n| disclosure | Site/time; capture and custody boundary; negative release gate; separate Q cohorts/H; actual supply and collection routes; raw/WIP/non-WIP/FG/packaging vectors; observation gaps and all external treatment |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| `route_complete` | negative_production | Include receipt, actual optical exposure, light-tight loading and leader/end trimming, bath mixing, one-shot DD-X development, ILFOSTOP, RAPID FIXER, actual washing, ILFOTOL rinse, ambient hanging drying, inspection, actual sampling, cleaning, start/stop, idle, failures and rework before first release. No incoming-film or latent-image mass also counts as Q. | ilford-hp5-2018; ilford-ddx-2019; ilford-first-film |\n| `supply_once` | purchased film and formulations | Purchase each complete supplied film/formulation once. Support, gelatin, silver-halide assays, solvent and contained water are constituent evidence, not extra foreground purchases. Separately add only real onsite dilution/adjustment inputs and their losses. If supplied working solution replaces concentrate plus dilution, use one disjoint supply option. Do not silently substitute a pure reagent for an unknown mixture. | ilford-ddx-2019; ilford-sundry-2017; ilford-rapid-2010 |\n| `capture_equipment` | exposure and reusable equipment | Record actual camera/lighting power, travel and equipment use where within the declared capture boundary, including linked ownership/use-cohort burdens and actual replacements. No camera or nominal photograph count replaces film kg. Reusable tanks/reels/clips/meters are not purchased anew per batch; actual wear, service, cleaning and retirement retain their original measured-use allocation and physical records. | ilford-first-film |\n| `q_and_stocks` | first release and inventories | Q counts each newly first-released strip once including closing FG. Keep raw stock, pre-release WIP, genuinely unused non-WIP entities, FG and package stocks disjoint, each with inherited exchange vectors. Manufacturing Bclose never subtracts already released FG again. Failed/zero-output work retains all actual burdens and an explicit unresolved or causal cohort assignment; never silently move it to unrelated successful output. |  |\n| `fg_services` | fg_service | Retain every observed storage, sleeving, handling, dispatch, reinspection, return and incremental rewash in H even if goods remain held. Attribute actual increments to original Qc and retain historical vectors without recharging manufacture. Gross dispatch and external returns are separate; reinspection/delivery creates no new production. Natural humidity change is a physical stock change, not an invented repair. | ilford-hp5-2018; ilford-first-film |\n| `liquid_gate` | spent baths and rinses | The selected routine collects actual spent baths/rinses for separately linked compatible external treatment; no onsite recovery, neutralisation or direct discharge is assumed. Record whole wet mass, actual composition/phase/silver speciation, receiver and one provider per physical transfer. Actual spills or unauthorized releases remain factual elemental/species outlets with their real destination; authorization or acceptance cannot erase them. | ilford-stop-sds-2024; ilford-fixer-sds-2024; cci-photo-processing-2007 |\n| `mixed_waste` | all waste outlets | When separately generated liquids physically combine, use one measured mixed-waste transfer and one receiving provider. originW records each measured source contribution as non-additive metadata; do not also export separate parent bath quantities. The same restriction applies to wet sludge/film/wipe contents. Only demonstrated segregated transfers are additive. |  |\n| `physical_gates` | manufacturing FG and combined gates | Use either whole wet articles/streams or an exhaustive mutually exclusive component bridge, never both on one side. Manufacturing has Q once as outgoing newly released film plus other actual exits and closing pre-release stocks. FG has that matched incoming handoff plus opening FG/returns, then gross dispatch/exits/closing FG. The combined gate cancels the identical internal handoff. If F denotes actual incoming absorption/reactant mass and X actual outgoing species mass, deduplicate only the identical same-side measured crossing already included in OTHER_IN or OTHER_OUT; stock, the opposite side or mere card presence is not duplication. |  |\n| `water_reactions` | material water and species balances | Independently reconcile total wet mass, elemental Ag and relevant halogen/S/C/N/O/H inventories against actual species, phase and reactions. Distinguish free/carrier water, retained/structural water, phase change and supported reaction water. Keep net ambient uptake/release and actual condensate/heat-exchange-water returns at their real states/enthalpies and supplier water-energy boundary; do not invent steam. One residual cannot solve two unknown species or both reaction water and evaporation. COD/BOD/VOC/total Ag are indicators, not molecule masses. | ilford-ddx-2019; ilford-rapid-2010; cci-photo-processing-2007 |\n| `packaging_balance` | each packaging pool | For each named article: opening empty + opening attached WIP/FG + opening reusable + actual external receipts P + external-return-received ER = closing empty + closing attached WIP/FG + closing reusable + packaging accompanying gross outward shipments S + separate external returns EO + actual waste W. Track internal attachment/detachment/reuse equally and cancel internally. Packaging stays outside Q, is not repeatedly purchased per reuse and has no automatic coproduct/credit. Supplier-included package production is charged once; physical custody can remain explicit without another provider purchase. |  |\n| `actual_extension` | all actual exchanges | Survey actual suppliers, process logs, maintenance, cleaning, sampling, pollution control and transport. Add each actual unlisted chemical, fuel, supplied heat, refrigerant, package component, waste and species as a separate atomic exchange with measured basis and proper provider/medium before claiming a complete dataset. Conditional absence requires evidence; unknown is not zero. |  |\n\n### Complete binding measurement and source conditions\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| reference_event_partition | reference_event_partition | Q0,c is the immutable sum of calibrated net complete film mass at unique first successful acceptance events for original cohort c, at the fixed dry/conditioning gate. Q and Qc in the retained method mean Q0 for the specified original cohort, never current dispatch, survivor mass or a second acceptance. At any later cutoff partition each original accepted entity, in its original acceptance mass basis, into disjoint net remaining delivered whereabouts D0, all actual onsite accepted states C0 (saleable, held, rewash, returned, samples still held), irreversible removed/lost amounts L0 and other documented terminal dispositions T0: Q0,c = D0,c + C0,c + L0,c + T0,c. Gross loops are event history only. Keep original acceptance moisture and all later measured state/mass changes separate. Never restore a lost constituent into the survivor and also add that loss. Removed preacceptance samples are not Q0; destructive postacceptance samples stay in the original fate partition. For zero/unknown Q0 retain raw failed/idle/rework/test burdens unassigned or genuinely attributed by evidence, without inventing positive output. |  |\n| stock_provider_history | stock_provider_history | Physical stocks keep full wet mass, water and mutually exclusive material/species components for raw film/concentrates, WIP, genuinely unused non-WIP entities, accepted FG, baths, packaging and equipment. Burden history is a separate vector per exchange/native/provider unit, original cohort and ownership. Own opening WIP carries its actual inherited foreground history once; a purchased complete film, formulation or external analytical service carries its provider aggregate once. Do not add decomposed upstream histories again to the same aggregate. Use either gross procurement with full disjoint stock-vector correction or documented already-net consumed history, not both. Reconcile B_open + B_new = B_used + B_close + B_other for each actual vector before allocation. Dedicated QC, failed batches, startup, cleaning, destructive sampling and idle activity remain recorded. No paper outsourcing of actual exposure, mixing, fixing, washing, ventilation or laboratory work. | ilcd-detailed-2010 |\n| three_ledgers_whole_waste | three_ledgers_whole_waste | Keep three distinct linked ledgers: (1) each one actual whole receiver transfer Qt and full actual treatment-provider quantity Ut recorded once at its actual composition/interface; (2) measured physical component and original-cohort provenance where known; (3) evidenced nonoverlapping per-served-cohort treatment/environmental service vectors A_i,c in compatible provider units, plus unassigned remainder. A_i,c/Q0,c is modeled demand; Qt/Q_analysis is an explicitly labelled physical observation, not full shared Qt demanded again for each cohort. A whole wet wipe, film sample, cassette, bottle, closure, sleeve or carton waste includes substrate, retained bath/film/solids and moisture once. Tare, contaminant and water analyses are nested components, not extra attached chemical/water waste exchanges or treatment demands unless physically separated before this boundary. Mixed liquid originW is likewise nested only. Burden/service shares never shrink full physical exports, stocks or fleet retirements. | ilcd-detailed-2010 |\n| packaging_complete_equation | packaging_complete_equation | For EACH actual cassette assembly, HDPE bottle body, PP closure, polyester sleeve and corrugated carton keep separate full wet opening O and closing C including empty, attached WIP/FG and reusable states. P is new separately acquired article input; I is article arriving with actual contents once, including supplier-included articles whose embodied burdens are already in the supplier aggregate; ER is actual empty article returned IN from customer/pool. S is ALL filled gross outward article shipments including actual filled returns once; EO is separate empty article outward; W is one whole wet discarded article. These legs are mutually exclusive. Every pool must explicitly reconcile O+P+I+ER+J_in+H2O_in+OTHER_IN-X_OTHER_IN = C+S+EO+W+J_out+H2O_out+OTHER_OUT-X_OTHER_OUT. J_in/out are real nonwater gains/removals not already contained in those full wet legs; H2O_in/out are real independent water gains/removals not already contained there. OTHER_IN/OUT are actual additional positive observations in the respective side; X_OTHER_IN/OUT remove only their proved same-side duplicate of a quantity already counted. Without such positive OTHER observation, X=0; X never offsets true P/I/ER/S/EO/W/J/water or full wet C. Contained water/material is nested, not additive to its whole leg. Internal attach/detach/reuse cancels by matched IDs. Do not call contaminated filled returns empty ER; record a separate actual inward filled event with nonoverlap, or I if its declared custody meaning fits. Whole assembly versus measured disjoint parts is chosen once. No automatic coproduct, purchase per reuse, credit or reference film mass. |  |\n| wet_process_gate | wet_process_gate | Manufacturing total wet mass: O_pre+R_full+F_nonwater+H2O_in+OTHER_IN-X_OTHER_IN = C_pre+T_release+E_full+J_nonwater_out+H2O_out+OTHER_OUT-X_OTHER_OUT. R_full and E_full are disjoint whole physical receipts/exits; do not add their contained water/components again. F_nonwater and J_nonwater_out are actual separate nonwater crossings, not invented reaction corrections; chemical conversion does not conserve each reacting species. FG total wet mass: O_FG+T_release+R_return+J_in+H2O_in+OTHER_IN-X_OTHER_IN = C_FG+D_out+E_FG+J_out+H2O_out+OTHER_OUT-X_OTHER_OUT. D_out includes all disjoint physical outward normal dispatch and separately identified outward returned-goods events; never add a subset to a gross total already containing it. T_release is an identical measured internal handoff and cancels once between gates. Q0 is its locked reference-event account, not an additional physical exit. Distinguish ambient through-moisture from net uptake/release, actual reaction water from carrier water and evaporation, and actual externally supplied water from thermal-bath circulation. Independent water/species measurements are required; a single residual cannot estimate two unknowns. The same positive-OTHER/duplicate-only-X definition applies at both gates. | ilford-ddx-2019; ilford-rapid-2010; cci-photo-processing-2007 |\n| fleet_and_cloth | fleet_and_cloth | Inventory every actual camera, exposure light, light meter, timer, thermometer, spiral tank, reel, drying clip, balance, spectrophotometer, potentiometric meter, individual electrodes, burette, stirrer, calibrated specimen punch, silica cell, sample vial, volumetric flask, pipette and beaker as its own physical fleet or measured disjoint parts with actual acquisition, opening/closing stock, transfer, replacement, service and retirement. For each asset k: opening_k+new_k+returns_in_k+real_gains_k = closing_k+outward_k+whole_retired_k+real_losses_k, with measured conditioning/corrosion/contamination changes explicit. Actual use/provider service units, measured asset mass/dimensions if needed and original served cohorts are separate from full physical units/mass; no assumed equipment lifetime, nominal machine mass or purchase anew per roll. Whole retirement retains any contamination and one receiver. Reusable cotton glove, reusable chamois and film squeegee are separately surveyed; cellulose wipe is not their proxy. Keep full wash/cleaning water, detergent if actually used, sample residues and whole wet retirement, one actual complete provider interface and nonoverlap with embedded manufacturer assets. Optional actual hairdryer or other equipment needs its own complete extension; ambient drying does not authorise unmetered forced drying. | ilford-first-film; kodak-module3 |\n| residual_method_1330a | residual_method_1330a | Fixer film-clearing activity tests and visible negative inspection are real manufacturer procedures but are not quantitative washing-residual assays. For quantitative residual thiosulfate use the separately complete historical Kodak1330A methylene-blue branch with its own extractant, potassium-borohydride/NaOH, acetone, acid ferric-SULFATE and NND-sulfate/Florisil reagent preparations and standardized thiosulfate calibration; do not replace its ferric sulfate with later ULM0004 ferric chloride. Its scope explicitly includes processed film containing silver; immediate analysis and minimum-density selection are binding because residual thiosulfate changes with time/image silver. Record actual low-density area, whole sample net emulsion-bearing area excluding holes, layer/backing state, sampling coverage, time from processing and sample disposition; 16mm length is an example, not a135 conversion. Reduced sample size is explicitly permitted; use actual area once. Extract/remove sample before colour development, maintain actual addition order/timing, reagent-age and distilled-water/copper suitability; use actual calibrated dropping/delivery devices and own instrument curve, reagent blank and standards. For high levels apply the complete AppendixII aliquot/dilution branch and actual dilution factors. Calculate measured analyte mass in the full extract divided by actual sampled area once; calibration mass is S2O3 ion, not automatically anhydrous or pentahydrate sodium-salt mass. No printed curve, recipe, acceptance limit, reported sensitivity or source numerical correction becomes a default. AppendixIV copper and expired/low-assay borohydride effects must be considered; actual sample recovery, repeats, blanks and representativeness qualify the study. Availability of this full method is distinct from unperformed actual lot QA and establishes no archival-life claim. | kodak-1330a |\n| method_countercontexts | method_countercontexts | Keep the later ULM0004/1 complete procedure and its actual limitations: Module4 lists ferric chloride hexahydrate but supplies no liquid-reagent preparation required by the volumetric addition; its at-least1inch sheet-edge wording and calibration-area convention are not silently rewritten for35mm. This is a gap of that branch, not proof that all residual-film methods are absent. NIST1963 supplies real35mm perforated-film extraction and gelatin-controlled turbidimetry but explicitly residual silver also adds turbidity interpreted as thiosulfate; low-level nonlinearity, image/gelatin/time/temperature effects and its ASA1958 standard-preparation crossreference remain. It is retained as independent counterevidence, not selected quantitative HP5 assay or universal1µg/in² correction. Neither a clearing test nor a paper sulfide spot test measures total washing residuals. Keep each quantitative claim limited to actual validated matrix, sample preparation/selectivity/recovery and detection. Unknown necessary procedure blocks that affected claim; future SOP or finite software pass does not supply it. Ordinary calibration/actual lot testing not yet performed is a study qualification gap, not proof that a documented complete method does not exist. | kodak-module3; kodak-module4; nist-residual |\n| laboratory_interfaces | laboratory_interfaces | Every actually performed assay includes actual destructive film withdrawal, each separately supplied reagent or one real whole premix, water quality production, weighing/mixing/heating/cooling/stirring/instrument use, standards/blanks/repeats, vessel cleaning, retained samples and all actual gases/liquids/solids. Whole external analytical service may replace a fully covered actual laboratory producer only when that provider really performs the whole named method with matched sample-send/receive quantities and all upstream/reagent/utility/waste burdens; it cannot hide actual onsite work. No sample mass is both retained product and exported waste at the same gate. Quantitative fixer/bath silver is total elemental concentration in the stated matrix, not freeAg(I); use a complete compatible procedure with actual preparation/calibration/interference/recovery. No spent-fixer silver concentration or universal recovery rate is borrowed from another film process. TotalAg and full wet liquid mass close different ledgers and must not solve each other by residual fitting; any freeAg(I) environmental claim requires independent speciation. | kodak-1330a; kodak-module3; ilcd-detailed-2010 |\n| synthetic_counterexamples | synthetic_counterexamples | Synthetic accounting tests, not empirical defaults: Q0=100kg partitions into60kg net delivered original basis+30kg all onsite accepted states+8kg irreversible lost+2kg other terminal=100; a20kg gross return/re-dispatch loop does not increase Q0. Shared whole contaminated waste Qt=10kg contains8kg substrate+2kg retained solids and is received/treated once as10kg. If genuinely evidenced service shares are25%new/75%old with Q0,new=100 and Q0,old=200, A_new=2.5kg-equivalent and A_old=7.5kg-equivalent give0.025 and0.0375kg-equivalent/kg; neither physical export becomes2.5/7.5kg and full10kg is not demanded again for both. A wet package pool with O10+P2+I3+ER1+J_in0.4+H2O_in0.6=17kg can close at C7+S6+EO1+W2+J_out0.3+H2O_out0.7=17kg. If OTHER_IN=3 duplicates3 already in I, and OTHER_OUT=2 duplicates2 already in W, include both positive OTHER legs and X_IN3/X_OUT2; both sides remain17. Dropping +OTHER but subtracting X gives14 vs15, and incorrectly erases real mass. Loss of0.4kg water from an original10kg accepted strip leaves9.6kg survivor plus0.4kg recorded loss, not10kg restored survivor plus0.4kg loss. Actual studies use their measured events, composition and evidenced attribution, never these values. |  |\n| fixingbath_silver_method | fixingbath_silver_method | For actual thiosulfate fixing-bath Ag quantitation, Kodak1208E gives a full alkaline/EDTA/gelatin sodium-sulfide potentiometric procedure with actual silver-billet/double-junction electrodes, complete ULM0003 endpoint/blank/curve practice and reagent preparation/standardization. It measures Ag-equivalent concentration of the actual original bath aliquot; it does not establish freeAg(I), original complex proportions, film Ag or refractory/sludge whole-phase digestion. EDTA does not remove zinc interference; prevent acidic thiosulfate decomposition and Ag2S coagulation, and retain actual sample-volume/added-thiosulfate response conditions. Standardize by actual known Ag-equivalent response and divide by the original sample aliquot, not the enlarged assay mixture. Use the historical AR714 actual1M thiosulfate matrix in its independent complete sulfide standardization, corroborating1208E1M, while explicitly retaining laterModule4p35 wording1N as a source conflict; N and M are not synonyms. Match actual matrix, calibration/blank/repeat/recovery and any Zn/other interferents. Source1209D independently covers multiple thiosulfate salt matrices but its0.0926/0.00926 caption and ferricyanideM/N inconsistencies remain; it is not a silent numerical substitute. These real methods do not provide site concentrations, recovery factors, all-phase digestion or discharge permission. If actual matrix/speciation needs exceed their established scope, that affected quantity remains unresolved; do not fabricate it from wet mass or a provider label. | kodak-module3; kodak-module4; kodak-1330a |\n\n\n"
