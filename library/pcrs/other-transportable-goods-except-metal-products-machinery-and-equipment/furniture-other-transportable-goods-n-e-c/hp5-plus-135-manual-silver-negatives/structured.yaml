    - protocol_id: cp_assay
      process_id: "negative_production"
      flow_role: "actual residualthiosulfate and bath analyses"
      record_type: "complete assay producer and sample-chain record"
      raw_fields: "method/version; actual sampleID; lowest density; exact net emulsionbearing area/perforations/layers; processing-to-test time; raw mass/area; supplier/makebuy reagents; hydrate/assay/standardization; preparation; actual additions/order/time; water/Cu; instrument calibration/blank/standards/repeats/recovery; aliquot/dilution; actual absorbance/analytemass;1208E originalbath aliquot/Zn/interference/Ag-equivalent standard response/endpoint; source1Mvs1N; sample fate; all wet waste/gas; Qt/Ut/A_i,c/Q0,c"
      collection_method: "Use complete selected1330A and1208E/AR714 with their own reagent chains; count actual preparation/standards/blanks/cleaning/energy/sample fate. Independent analyte mass/actual area once; no sourcecurve/grade/default. Distinguish full method availability, actual matrix/lot qualification and specific unknown branch gaps. No fictitious external laboratory."
      unit: "kg; cm2; raw absorbance; actual provider unit"
      frequency: "Each actual event/lot and measured interval"
      temporal_coverage: "Complete window and original cohort history"
      site_scope: "Actual site and genuine complete provider interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original observations; method/matrix scope; sample/stock/waste/vector reconciliation and uncertainty"
  calculation_rules:
    - id: native_units
      applies_to: "raw records"
      rule: "Convert raw measurements before attribution: kWh × 3.6 = MJ; actual count × independently measured same-lot net item mass = kg; actual area × independently measured same-state areal mass = kg; liquid volume × independently measured solution density at recorded temperature = kg. Integrate a rate once; a cumulative volume is already integrated. Keep original units and uncertainty."
      inputs:
        - raw_records
        - independent_conversion_measurements
      output: "native_numerator"
      source_ids: []
    - id: production_vectors
      applies_to: "manufacturing burden vectors"
      rule: "For each exchange i on a gross-receipt basis: A_prod_i = B_openRaw_i + B_openWIP_i + B_openNonWIP_i + B_new_i - B_closeRaw_i - B_closeWIP_i - B_closeNonWIP_i, after dedicated/virtual subdivision and justified residual attribution. All sets are disjoint and all components retain their native unit. B_new includes actual failed/zero-output/start-stop/idle/cleanup work. First-released FG is never a manufacturing Bclose term. Already-net consumption uses its documented equivalent bridge without repeating stock correction. Preserve unassigned burdens if no causal positive-Q cohort exists."
      inputs:
        - native_numerator
        - cp_stock_vectors
        - allocation_evidence
      output: "A_prod_i"
      source_ids:
        - ilcd-detailed-2010
    - id: service_vectors
      applies_to: "fg_service and packaging_pool"
      rule: "Retain full historical cohort vectors and physical opening/closing FG/package quantities. A_service_i is only actual new attributable service burden observed in H, including failed work, rewash and cleaning, linked to original Qc; it is not the full historic manufacture purchased again. Package acquisition/use/disposal history and unassigned pool vectors reconcile independently. Gross physical V is not multiplied by an economic or burden share."
      inputs:
        - cp_fg
        - cp_packaging
        - stock_vectors
        - allocation_evidence
      output: "A_service_i"
      source_ids:
        - ilcd-detailed-2010
    - id: single_normalization
      applies_to: "all inventory rows"
      rule: "Modeled result_i,c = A_i,c / original positive Q0,c once, after actual conversion and nonoverlapping attribution. Record physical observation V/Qt and actual provider quantity Ut once; if reported Qt/Q_analysis is explicitly physical and cannot be the full shared modeled numerator per cohort. Actual same-gate reference first_negative_release is exactly1kg. Production A_prod and newly observed services A_service remain separate; H is no divisor. Zero/unknown Q0 retains raw quantities and unresolved attribution."
      inputs:
        - A_i
        - c
        - original_Q0
        - c
        - V
        - Qt
        - Ut
        - Q_analysis
      output: "result_i,c"
      source_ids: []
    - id: physical_reconciliation
      applies_to: "all physical gates"
      rule: "At each gate reconcile opening stocks plus full actual receipts/uptakes against closing stocks plus full actual outputs/releases, with whole-wet or mutually exclusive component accounting. Internal bath/film/package handoffs cancel only with matched IDs and equal quantities. Keep total mass, H2O and relevant element ledgers independent of species/reaction equations; no guessed correction flow, dual-unknown residual fit, or stock term removed merely because a row exists."
      inputs:
        - cp_materials
        - cp_baths
        - cp_water
        - cp_waste
        - cp_species
        - cp_release
        - cp_stock_vectors
        - cp_fg
        - cp_packaging
      output: "physical_ledgers_and_residuals"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Check full native type, baseName, synonyms/comments, CAS, grade/route/form/geography/medium and every property against actual supply/terminal. Reference film identity is distinct from provider completeness. Exact names and chemical specificity remain even when auxiliary UUID is unresolved."
      evidence: "Full native objects and exact chains; actual supplier and receiver records"
    - id: quality_window
      applies_to: "production and services"
      requirement: "Cover all actual start-stop/idle/failed/zero-output/rework/cleanup/sampling events and stock/vector continuity, with original Qc/H for actual later services. No complete-site claim from a partial observation or an acceptance label."
      evidence: "Raw records and event/stock reconciliation"
    - id: quality_species
      applies_to: "mass water silver and reactions"
      requirement: "Independent measurements with detection limits and uncertainty support full wet mass, actual component/element balances and separate phase/species assignments. Record analytical total Ag/COD/VOC as indicators; no forced chemical identity or invented reaction/evaporation closure."
      evidence: "Sampling plans; laboratory methods; moisture/density and outlet evidence"
    - id: quality_route
      applies_to: "negative terminal and process settings"
      requirement: "Use batch-compatible actual manufacturer controls and measured film quality. The HP5 characteristic curve using HC, DELTA100 beginner example, tray/rotary alternatives, paper permanence sequences and future-dated SDS revision field do not supply default HP5 DD-X values or review approval."
      evidence: "Complete source context; actual control/acceptance records"
    - id: quality_sources
      applies_to: "source use and modelling boundaries"
      requirement: "Retain source-specific product/process/state/use compatibility and distinguish originals, mirrors, reuse and extraction dates. Manufacturer sources do not prove LCA allocation; ILCD allocation does not prove photochemical applicability. Foreground missing quantities/providers are explicit collection gaps, not invented measurements."
      evidence: "Source/context lineage and foreground gap register"
validation_rules:
  - rule_id: validate_terminal
    applies_to: "first_negative_release"
    rule: "Exactly one linked Product reference output is the fully developed, fixed, washed and dry non-cine negative. Native Mass/kg, net same-state measurement, EN/ZH first-release gate and complete qualifiers agree. No latent precursor or returned old strip becomes new Q."
    source_ids:
      - ilford-hp5-2018
      - ilford-first-film
  - rule_id: validate_atomic
    applies_to: "all inventory rows"
    rule: "Each card is one specific physical/chemical exchange with correct type/property/unit/medium, complete native restrictions and actual supply/receiver. Every real extra flow is added separately. A blank auxiliary UUID neither authorizes a collection label nor erases an actual exchange."
    source_ids: []
  - rule_id: validate_once
    applies_to: "collection and calculation"
    rule: "Raw protocols collect unnormalized measurements. Unit/rate conversion and genuine attribution precede single_normalization exactly once. Audit all table cells, ten card fields, complete descriptions, qualifier elements, formula Inputs/Output, source fields/lists and quality requirements in both projections."
    source_ids: []
  - rule_id: validate_stocks
    applies_to: "manufacturing FG and packaging"
    rule: "Verify disjoint raw/WIP/non-WIP vectors and no manufacturing Bclose deduction of already released FG. Check all gross dispatch/return events, Qc/H service increments including held goods, and complete package pool equations. Combined handoffs cancel without deleting external flows or stocks."
    source_ids: []
  - rule_id: validate_waste_species
    applies_to: "waste and environmental outlets"
    rule: "Require actual full wet transfers and one provider; mixed origins are non-additive. Verify actual silver forms and environmental media; total silver/COD/VOC is not substituted for Ag(I), SO2 or another molecule. Preserve unauthorized/failed-work releases and unresolved residuals."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "burden vectors"
    rule: "Verify dedicated/subdivision evidence, exchange-specific determining physical causality and only genuinely residual same-gate/state market value; all assigned/unassigned vectors reconcile. No fixed share, automatic silver credit or physical mass scaled by allocation."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: validate_completeness
    applies_to: "complete foreground package"
    rule: "Unknown required terminal identity, conversion, method relation, reaction/species split, actual operation, provider or measurement remains explicitly incomplete. Ordinary future-site measurements and auxiliary UUID gaps remain requirements; mechanical checks alone do not establish scientific/translation approval or publication."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "The following complete retained paragraphs remain binding with Q/Qc explicitly interpreted as original Q0 above. They do not replace the updated complete ledgers or reopen a retired identity."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "This physical-product profile covers one complete non-cinematographic black-and-white silver-image negative on HP5 PLUS 135 acetate-base film, after actual optical exposure, development, stopping, nonhardening fixation, washing, final wetting rinse and drying. The output is first-quality-released net film strip, including its retained support, emulsion/image and actual conditioning moisture, with removable cassette, spool, sleeves and transport packaging excluded. Image count and subject do not define another manufacturing identity."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "The selected foreground receives complete purchased unexposed HP5 PLUS 135 film and separately identified whole liquid concentrates. Actual camera exposure is followed by light-tight loading, one-shot ILFOTEC DD-X manual spiral development, ILFOSTOP stop bath, RAPID FIXER, actual film washing, ILFOTOL final rinse and ambient hanging drying in a clean area, then inspection and unique first release. Temperature conditioning and ventilation are measured where performed. Manufacturer originals establish this compatible technical route; they are not one contemporary factory/order record. Film coating, chemical manufacture, camera manufacture and photographic creative services remain actual upstream/use links, not invented onsite steps. Sources: ilford-hp5-2018; ilford-ddx-2019; ilford-first-film."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "Exclude unexposed film or exposed undeveloped latent images as the reference output, paper positive prints, digital images, chemical products, cameras, cinematographic film, colour C41/E6, reversal, 120/sheet-format variants and medical/industrial radiation film. No bleach, toner, hardener, emulsion coating, boiler or onsite silver-recovery plant is inferred. Different actual routes require an explicit complete extension; their real burdens and abnormal releases cannot be deleted. Supplier tables are guidance for their stated product/process, not universal development settings, dilution, silver/gelatin fraction, thickness, density, energy, yield, lifetime or emission defaults."
    source_ids: []
  - rule_id: validation_rule_12
    applies_to: "foreground_dataset_conformance"
    rule: "Conventional black-and-white silver-gelatin chemistry forms a latent image on exposure, reduces exposed silver halide to image silver during development, and transfers remaining halide through fixing complexes into actual baths/washes. CCI Notes16/6 supports these qualitative distinctions only. Its maximum-permanence discussion and film/fibre-paper table include hardening/two-bath/toning alternatives and historic settings; those are not added to this HP5-specific manufacturer route and establish no archival-life claim. Source: cci-photo-processing-2007."
    source_ids: []
  - rule_id: validation_rule_13
    applies_to: "foreground_dataset_conformance"
    rule: "The native Product family positively identifies exposed and developed photographic plates/film other than cinematographic film, as a finished manufactured production mix at plant. This profile narrows it to complete HP5 PLUS135 acetate-base silver-image negatives after fixation, washing and drying. It does not identify an unexposed precursor, latent image, paper print, camera, digital file or mixture of products. Native Mass/kg measures full net film, not silver alone or a presumed per-roll weight. Manufacturer construction and actual supplier/provider compatibility remain separately declared."
    source_ids: []
  - rule_id: validation_rule_14
    applies_to: "foreground_dataset_conformance"
    rule: "Declare every required qualifier in full dataset metadata or equivalent reference context; absence leaves that data-package reference incomplete."
    source_ids: []
  - rule_id: validation_rule_15
    applies_to: "foreground_dataset_conformance"
    rule: "Each card is one atomic exchange. Conditional means supported physical applicability, not an assumed positive quantity or automatic zero. Read complete process/section conditions with each card. Amount and aggregation labels refer to the single section8 result; they perform no arithmetic themselves. Physical gross quantities and separately attributed burden views remain distinct."
    source_ids: []
  - rule_id: validation_rule_16
    applies_to: "foreground_dataset_conformance"
    rule: "Protocols collect raw unnormalized totals, states and inherited vectors. aggregation_rule declares the common final reference basis only; all conversions, attribution and the one division occur in the calculation rules. Keep original Qc and H for post-release services, including work on held goods."
    source_ids: []
  - rule_id: validation_rule_17
    applies_to: "foreground_dataset_conformance"
    rule: "This verbatim contextual rendering preserves every current card, field and description for validation of section6. It creates no second exchange, purchase, receiver transfer or burden. The uniquely identified section6 rows are the inventory."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only after actual compatible upstream and treatment links are complete"
  downstream_use: "Physical manufacturing of declared HP5 PLUS135 dry silver negative with separately linked observed original-cohort services"
  allowed_use: "Same-route comparisons with matched net film state, first-release gate, image quality/function and disclosed capture/upstream/service coverage"
  excluded_use: "Whole38942 coverage; cine/colour/reversal/radiography/paper/digital substitutes; creative-value or archival-life equivalence per kg; complete LCI claims with unresolved actual inputs/outlets; automatic recovery credits"
  required_metadata: "All reference qualifiers; exact physical gate and native units; supplier/media/chemical identities; original Qc/H; actual stock and inherited vectors; package pools; allocation; receiver/transport/treatment"
  required_quality_disclosure: "Raw measurement and source coverage, uncertainty/detection, all failed/zero-output work, unassigned vectors, ordinary UUID/provider gaps, true method holds and scientific/translation state"
  update_trigger: "Changed film format/support/emulsion, exposure or bath route, formulation, drying/release state, utility or treatment boundary, native property, packaging pool or attribution rule"
