product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.furniture-other-transportable-goods-n-e-c.hp5-plus-135-manual-silver-negatives"
  classification_refs: "CPC 3.0 38942; narrower product and route boundary"
  covered_products: "First-released complete HP5 PLUS 135 acetate-base black-and-white silver negatives"
  excluded_products: "Exclude unexposed film or exposed undeveloped latent images as the reference output, paper positive prints, digital images, chemical products, cameras, cinematographic film, colour C41/E6, reversal, 120/sheet-format variants and medical/industrial radiation film. No bleach, toner, hardener, emulsion coating, boiler or onsite silver-recovery plant is inferred. Different actual routes require an explicit complete extension; their real burdens and abnormal releases cannot be deleted. Supplier tables are guidance for their stated product/process, not universal development settings, dilution, silver/gelatin fraction, thickness, density, energy, yield, lifetime or emission defaults."
  representative_product: "A declared lot of dry complete processed negative strips with measured net mass"
  production_route: "The selected foreground receives complete purchased unexposed HP5 PLUS 135 film and separately identified whole liquid concentrates. Actual camera exposure is followed by light-tight loading, one-shot ILFOTEC DD-X manual spiral development, ILFOSTOP stop bath, RAPID FIXER, actual film washing, ILFOTOL final rinse and ambient hanging drying in a clean area, then inspection and unique first release. Temperature conditioning and ventilation are measured where performed. Manufacturer originals establish this compatible technical route; they are not one contemporary factory/order record. Film coating, chemical manufacture, camera manufacture and photographic creative services remain actual upstream/use links, not invented onsite steps. Sources: ilford-hp5-2018; ilford-ddx-2019; ilford-first-film."
  market_state: "Finished manufactured non-cine negative at unique first quality release; subsequent observed services linked separately"
functional_unit:
  what: "Provide the declared optically recorded image as a complete fixed washed dry black-and-white negative film"
  how_much: "1 kg net first-released negative film in the measured conditioning state"
  how_well: "Actual polarity/image completeness and density/contrast criteria; clear rebates where required; adequate fixation/washing and no disqualifying scratches or drying marks under the declared inspection protocol"
  how_long_or_cycle: "One first-release event per physical strip plus disclosed actual services in H; no archival lifetime or creative-value equivalence by kg"
  reference_flow_link: "first_negative_release"
system_boundary:
  rules:
    - rule_id: route_complete
      applies_to: "negative_production"
      rule: "Include receipt, actual optical exposure, light-tight loading and leader/end trimming, bath mixing, one-shot DD-X development, ILFOSTOP, RAPID FIXER, actual washing, ILFOTOL rinse, ambient hanging drying, inspection, actual sampling, cleaning, start/stop, idle, failures and rework before first release. No incoming-film or latent-image mass also counts as Q."
      source_ids:
        - ilford-hp5-2018
        - ilford-ddx-2019
        - ilford-first-film
    - rule_id: supply_once
      applies_to: "purchased film and formulations"
      rule: "Purchase each complete supplied film/formulation once. Support, gelatin, silver-halide assays, solvent and contained water are constituent evidence, not extra foreground purchases. Separately add only real onsite dilution/adjustment inputs and their losses. If supplied working solution replaces concentrate plus dilution, use one disjoint supply option. Do not silently substitute a pure reagent for an unknown mixture."
      source_ids:
        - ilford-ddx-2019
        - ilford-sundry-2017
        - ilford-rapid-2010
    - rule_id: capture_equipment
      applies_to: "exposure and reusable equipment"
      rule: "Record actual camera/lighting power, travel and equipment use where within the declared capture boundary, including linked ownership/use-cohort burdens and actual replacements. No camera or nominal photograph count replaces film kg. Reusable tanks/reels/clips/meters are not purchased anew per batch; actual wear, service, cleaning and retirement retain their original measured-use allocation and physical records."
      source_ids:
        - ilford-first-film
    - rule_id: q_and_stocks
      applies_to: "first release and inventories"
      rule: "Q counts each newly first-released strip once including closing FG. Keep raw stock, pre-release WIP, genuinely unused non-WIP entities, FG and package stocks disjoint, each with inherited exchange vectors. Manufacturing Bclose never subtracts already released FG again. Failed/zero-output work retains all actual burdens and an explicit unresolved or causal cohort assignment; never silently move it to unrelated successful output."
      source_ids: []
    - rule_id: fg_services
      applies_to: "fg_service"
      rule: "Retain every observed storage, sleeving, handling, dispatch, reinspection, return and incremental rewash in H even if goods remain held. Attribute actual increments to original Qc and retain historical vectors without recharging manufacture. Gross dispatch and external returns are separate; reinspection/delivery creates no new production. Natural humidity change is a physical stock change, not an invented repair."
      source_ids:
        - ilford-hp5-2018
        - ilford-first-film
    - rule_id: liquid_gate
      applies_to: "spent baths and rinses"
      rule: "The selected routine collects actual spent baths/rinses for separately linked compatible external treatment; no onsite recovery, neutralisation or direct discharge is assumed. Record whole wet mass, actual composition/phase/silver speciation, receiver and one provider per physical transfer. Actual spills or unauthorized releases remain factual elemental/species outlets with their real destination; authorization or acceptance cannot erase them."
      source_ids:
        - ilford-stop-sds-2024
        - ilford-fixer-sds-2024
        - cci-photo-processing-2007
    - rule_id: mixed_waste
      applies_to: "all waste outlets"
      rule: "When separately generated liquids physically combine, use one measured mixed-waste transfer and one receiving provider. originW records each measured source contribution as non-additive metadata; do not also export separate parent bath quantities. The same restriction applies to wet sludge/film/wipe contents. Only demonstrated segregated transfers are additive."
      source_ids: []
    - rule_id: physical_gates
      applies_to: "manufacturing FG and combined gates"
      rule: "Use either whole wet articles/streams or an exhaustive mutually exclusive component bridge, never both on one side. Manufacturing has Q once as outgoing newly released film plus other actual exits and closing pre-release stocks. FG has that matched incoming handoff plus opening FG/returns, then gross dispatch/exits/closing FG. The combined gate cancels the identical internal handoff. If F denotes actual incoming absorption/reactant mass and X actual outgoing species mass, deduplicate only the identical same-side measured crossing already included in OTHER_IN or OTHER_OUT; stock, the opposite side or mere card presence is not duplication."
      source_ids: []
    - rule_id: water_reactions
      applies_to: "material water and species balances"
      rule: "Independently reconcile total wet mass, elemental Ag and relevant halogen/S/C/N/O/H inventories against actual species, phase and reactions. Distinguish free/carrier water, retained/structural water, phase change and supported reaction water. Keep net ambient uptake/release and actual condensate/heat-exchange-water returns at their real states/enthalpies and supplier water-energy boundary; do not invent steam. One residual cannot solve two unknown species or both reaction water and evaporation. COD/BOD/VOC/total Ag are indicators, not molecule masses."
      source_ids:
        - ilford-ddx-2019
        - ilford-rapid-2010
        - cci-photo-processing-2007
    - rule_id: packaging_balance
      applies_to: "each packaging pool"
      rule: "For each named article: opening empty + opening attached WIP/FG + opening reusable + actual external receipts P + external-return-received ER = closing empty + closing attached WIP/FG + closing reusable + packaging accompanying gross outward shipments S + separate external returns EO + actual waste W. Track internal attachment/detachment/reuse equally and cancel internally. Packaging stays outside Q, is not repeatedly purchased per reuse and has no automatic coproduct/credit. Supplier-included package production is charged once; physical custody can remain explicit without another provider purchase."
      source_ids: []
    - rule_id: actual_extension
      applies_to: "all actual exchanges"
      rule: "Survey actual suppliers, process logs, maintenance, cleaning, sampling, pollution control and transport. Add each actual unlisted chemical, fuel, supplied heat, refrigerant, package component, waste and species as a separate atomic exchange with measured basis and proper provider/medium before claiming a complete dataset. Conditional absence requires evidence; unknown is not zero."
      source_ids: []
    - rule_id: reference_event_partition
      applies_to: "reference_event_partition"
      rule: "Q0,c is the immutable sum of calibrated net complete film mass at unique first successful acceptance events for original cohort c, at the fixed dry/conditioning gate. Q and Qc in the retained method mean Q0 for the specified original cohort, never current dispatch, survivor mass or a second acceptance. At any later cutoff partition each original accepted entity, in its original acceptance mass basis, into disjoint net remaining delivered whereabouts D0, all actual onsite accepted states C0 (saleable, held, rewash, returned, samples still held), irreversible removed/lost amounts L0 and other documented terminal dispositions T0: Q0,c = D0,c + C0,c + L0,c + T0,c. Gross loops are event history only. Keep original acceptance moisture and all later measured state/mass changes separate. Never restore a lost constituent into the survivor and also add that loss. Removed preacceptance samples are not Q0; destructive postacceptance samples stay in the original fate partition. For zero/unknown Q0 retain raw failed/idle/rework/test burdens unassigned or genuinely attributed by evidence, without inventing positive output."
      source_ids: []
    - rule_id: stock_provider_history
      applies_to: "stock_provider_history"
      rule: "Physical stocks keep full wet mass, water and mutually exclusive material/species components for raw film/concentrates, WIP, genuinely unused non-WIP entities, accepted FG, baths, packaging and equipment. Burden history is a separate vector per exchange/native/provider unit, original cohort and ownership. Own opening WIP carries its actual inherited foreground history once; a purchased complete film, formulation or external analytical service carries its provider aggregate once. Do not add decomposed upstream histories again to the same aggregate. Use either gross procurement with full disjoint stock-vector correction or documented already-net consumed history, not both. Reconcile B_open + B_new = B_used + B_close + B_other for each actual vector before allocation. Dedicated QC, failed batches, startup, cleaning, destructive sampling and idle activity remain recorded. No paper outsourcing of actual exposure, mixing, fixing, washing, ventilation or laboratory work."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: three_ledgers_whole_waste
      applies_to: "three_ledgers_whole_waste"
      rule: "Keep three distinct linked ledgers: (1) each one actual whole receiver transfer Qt and full actual treatment-provider quantity Ut recorded once at its actual composition/interface; (2) measured physical component and original-cohort provenance where known; (3) evidenced nonoverlapping per-served-cohort treatment/environmental service vectors A_i,c in compatible provider units, plus unassigned remainder. A_i,c/Q0,c is modeled demand; Qt/Q_analysis is an explicitly labelled physical observation, not full shared Qt demanded again for each cohort. A whole wet wipe, film sample, cassette, bottle, closure, sleeve or carton waste includes substrate, retained bath/film/solids and moisture once. Tare, contaminant and water analyses are nested components, not extra attached chemical/water waste exchanges or treatment demands unless physically separated before this boundary. Mixed liquid originW is likewise nested only. Burden/service shares never shrink full physical exports, stocks or fleet retirements."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: packaging_complete_equation
      applies_to: "packaging_complete_equation"
      rule: "For EACH actual cassette assembly, HDPE bottle body, PP closure, polyester sleeve and corrugated carton keep separate full wet opening O and closing C including empty, attached WIP/FG and reusable states. P is new separately acquired article input; I is article arriving with actual contents once, including supplier-included articles whose embodied burdens are already in the supplier aggregate; ER is actual empty article returned IN from customer/pool. S is ALL filled gross outward article shipments including actual filled returns once; EO is separate empty article outward; W is one whole wet discarded article. These legs are mutually exclusive. Every pool must explicitly reconcile O+P+I+ER+J_in+H2O_in+OTHER_IN-X_OTHER_IN = C+S+EO+W+J_out+H2O_out+OTHER_OUT-X_OTHER_OUT. J_in/out are real nonwater gains/removals not already contained in those full wet legs; H2O_in/out are real independent water gains/removals not already contained there. OTHER_IN/OUT are actual additional positive observations in the respective side; X_OTHER_IN/OUT remove only their proved same-side duplicate of a quantity already counted. Without such positive OTHER observation, X=0; X never offsets true P/I/ER/S/EO/W/J/water or full wet C. Contained water/material is nested, not additive to its whole leg. Internal attach/detach/reuse cancels by matched IDs. Do not call contaminated filled returns empty ER; record a separate actual inward filled event with nonoverlap, or I if its declared custody meaning fits. Whole assembly versus measured disjoint parts is chosen once. No automatic coproduct, purchase per reuse, credit or reference film mass."
      source_ids: []
    - rule_id: wet_process_gate
      applies_to: "wet_process_gate"
      rule: "Manufacturing total wet mass: O_pre+R_full+F_nonwater+H2O_in+OTHER_IN-X_OTHER_IN = C_pre+T_release+E_full+J_nonwater_out+H2O_out+OTHER_OUT-X_OTHER_OUT. R_full and E_full are disjoint whole physical receipts/exits; do not add their contained water/components again. F_nonwater and J_nonwater_out are actual separate nonwater crossings, not invented reaction corrections; chemical conversion does not conserve each reacting species. FG total wet mass: O_FG+T_release+R_return+J_in+H2O_in+OTHER_IN-X_OTHER_IN = C_FG+D_out+E_FG+J_out+H2O_out+OTHER_OUT-X_OTHER_OUT. D_out includes all disjoint physical outward normal dispatch and separately identified outward returned-goods events; never add a subset to a gross total already containing it. T_release is an identical measured internal handoff and cancels once between gates. Q0 is its locked reference-event account, not an additional physical exit. Distinguish ambient through-moisture from net uptake/release, actual reaction water from carrier water and evaporation, and actual externally supplied water from thermal-bath circulation. Independent water/species measurements are required; a single residual cannot estimate two unknowns. The same positive-OTHER/duplicate-only-X definition applies at both gates."
      source_ids:
        - ilford-ddx-2019
        - ilford-rapid-2010
        - cci-photo-processing-2007
    - rule_id: fleet_and_cloth
      applies_to: "fleet_and_cloth"
      rule: "Inventory every actual camera, exposure light, light meter, timer, thermometer, spiral tank, reel, drying clip, balance, spectrophotometer, potentiometric meter, individual electrodes, burette, stirrer, calibrated specimen punch, silica cell, sample vial, volumetric flask, pipette and beaker as its own physical fleet or measured disjoint parts with actual acquisition, opening/closing stock, transfer, replacement, service and retirement. For each asset k: opening_k+new_k+returns_in_k+real_gains_k = closing_k+outward_k+whole_retired_k+real_losses_k, with measured conditioning/corrosion/contamination changes explicit. Actual use/provider service units, measured asset mass/dimensions if needed and original served cohorts are separate from full physical units/mass; no assumed equipment lifetime, nominal machine mass or purchase anew per roll. Whole retirement retains any contamination and one receiver. Reusable cotton glove, reusable chamois and film squeegee are separately surveyed; cellulose wipe is not their proxy. Keep full wash/cleaning water, detergent if actually used, sample residues and whole wet retirement, one actual complete provider interface and nonoverlap with embedded manufacturer assets. Optional actual hairdryer or other equipment needs its own complete extension; ambient drying does not authorise unmetered forced drying."
      source_ids:
        - ilford-first-film
        - kodak-module3
    - rule_id: residual_method_1330a
      applies_to: "residual_method_1330a"
      rule: "Fixer film-clearing activity tests and visible negative inspection are real manufacturer procedures but are not quantitative washing-residual assays. For quantitative residual thiosulfate use the separately complete historical Kodak1330A methylene-blue branch with its own extractant, potassium-borohydride/NaOH, acetone, acid ferric-SULFATE and NND-sulfate/Florisil reagent preparations and standardized thiosulfate calibration; do not replace its ferric sulfate with later ULM0004 ferric chloride. Its scope explicitly includes processed film containing silver; immediate analysis and minimum-density selection are binding because residual thiosulfate changes with time/image silver. Record actual low-density area, whole sample net emulsion-bearing area excluding holes, layer/backing state, sampling coverage, time from processing and sample disposition; 16mm length is an example, not a135 conversion. Reduced sample size is explicitly permitted; use actual area once. Extract/remove sample before colour development, maintain actual addition order/timing, reagent-age and distilled-water/copper suitability; use actual calibrated dropping/delivery devices and own instrument curve, reagent blank and standards. For high levels apply the complete AppendixII aliquot/dilution branch and actual dilution factors. Calculate measured analyte mass in the full extract divided by actual sampled area once; calibration mass is S2O3 ion, not automatically anhydrous or pentahydrate sodium-salt mass. No printed curve, recipe, acceptance limit, reported sensitivity or source numerical correction becomes a default. AppendixIV copper and expired/low-assay borohydride effects must be considered; actual sample recovery, repeats, blanks and representativeness qualify the study. Availability of this full method is distinct from unperformed actual lot QA and establishes no archival-life claim."
      source_ids:
        - kodak-1330a
    - rule_id: method_countercontexts
      applies_to: "method_countercontexts"
      rule: "Keep the later ULM0004/1 complete procedure and its actual limitations: Module4 lists ferric chloride hexahydrate but supplies no liquid-reagent preparation required by the volumetric addition; its at-least1inch sheet-edge wording and calibration-area convention are not silently rewritten for35mm. This is a gap of that branch, not proof that all residual-film methods are absent. NIST1963 supplies real35mm perforated-film extraction and gelatin-controlled turbidimetry but explicitly residual silver also adds turbidity interpreted as thiosulfate; low-level nonlinearity, image/gelatin/time/temperature effects and its ASA1958 standard-preparation crossreference remain. It is retained as independent counterevidence, not selected quantitative HP5 assay or universal1µg/in² correction. Neither a clearing test nor a paper sulfide spot test measures total washing residuals. Keep each quantitative claim limited to actual validated matrix, sample preparation/selectivity/recovery and detection. Unknown necessary procedure blocks that affected claim; future SOP or finite software pass does not supply it. Ordinary calibration/actual lot testing not yet performed is a study qualification gap, not proof that a documented complete method does not exist."
      source_ids:
        - kodak-module3
        - kodak-module4
        - nist-residual
    - rule_id: laboratory_interfaces
      applies_to: "laboratory_interfaces"
      rule: "Every actually performed assay includes actual destructive film withdrawal, each separately supplied reagent or one real whole premix, water quality production, weighing/mixing/heating/cooling/stirring/instrument use, standards/blanks/repeats, vessel cleaning, retained samples and all actual gases/liquids/solids. Whole external analytical service may replace a fully covered actual laboratory producer only when that provider really performs the whole named method with matched sample-send/receive quantities and all upstream/reagent/utility/waste burdens; it cannot hide actual onsite work. No sample mass is both retained product and exported waste at the same gate. Quantitative fixer/bath silver is total elemental concentration in the stated matrix, not freeAg(I); use a complete compatible procedure with actual preparation/calibration/interference/recovery. No spent-fixer silver concentration or universal recovery rate is borrowed from another film process. TotalAg and full wet liquid mass close different ledgers and must not solve each other by residual fitting; any freeAg(I) environmental claim requires independent speciation."
      source_ids:
        - kodak-1330a
        - kodak-module3
        - ilcd-detailed-2010
    - rule_id: synthetic_counterexamples
      applies_to: "synthetic_counterexamples"
      rule: "Synthetic accounting tests, not empirical defaults: Q0=100kg partitions into60kg net delivered original basis+30kg all onsite accepted states+8kg irreversible lost+2kg other terminal=100; a20kg gross return/re-dispatch loop does not increase Q0. Shared whole contaminated waste Qt=10kg contains8kg substrate+2kg retained solids and is received/treated once as10kg. If genuinely evidenced service shares are25%new/75%old with Q0,new=100 and Q0,old=200, A_new=2.5kg-equivalent and A_old=7.5kg-equivalent give0.025 and0.0375kg-equivalent/kg; neither physical export becomes2.5/7.5kg and full10kg is not demanded again for both. A wet package pool with O10+P2+I3+ER1+J_in0.4+H2O_in0.6=17kg can close at C7+S6+EO1+W2+J_out0.3+H2O_out0.7=17kg. If OTHER_IN=3 duplicates3 already in I, and OTHER_OUT=2 duplicates2 already in W, include both positive OTHER legs and X_IN3/X_OUT2; both sides remain17. Dropping +OTHER but subtracting X gives14 vs15, and incorrectly erases real mass. Loss of0.4kg water from an original10kg accepted strip leaves9.6kg survivor plus0.4kg recorded loss, not10kg restored survivor plus0.4kg loss. Actual studies use their measured events, composition and evidenced attribution, never these values."
      source_ids: []
    - rule_id: fixingbath_silver_method
      applies_to: "fixingbath_silver_method"
      rule: "For actual thiosulfate fixing-bath Ag quantitation, Kodak1208E gives a full alkaline/EDTA/gelatin sodium-sulfide potentiometric procedure with actual silver-billet/double-junction electrodes, complete ULM0003 endpoint/blank/curve practice and reagent preparation/standardization. It measures Ag-equivalent concentration of the actual original bath aliquot; it does not establish freeAg(I), original complex proportions, film Ag or refractory/sludge whole-phase digestion. EDTA does not remove zinc interference; prevent acidic thiosulfate decomposition and Ag2S coagulation, and retain actual sample-volume/added-thiosulfate response conditions. Standardize by actual known Ag-equivalent response and divide by the original sample aliquot, not the enlarged assay mixture. Use the historical AR714 actual1M thiosulfate matrix in its independent complete sulfide standardization, corroborating1208E1M, while explicitly retaining laterModule4p35 wording1N as a source conflict; N and M are not synonyms. Match actual matrix, calibration/blank/repeat/recovery and any Zn/other interferents. Source1209D independently covers multiple thiosulfate salt matrices but its0.0926/0.00926 caption and ferricyanideM/N inconsistencies remain; it is not a silent numerical substitute. These real methods do not provide site concentrations, recovery factors, all-phase digestion or discharge permission. If actual matrix/speciation needs exceed their established scope, that affected quantity remains unresolved; do not fabricate it from wet mass or a provider label."
      source_ids:
        - kodak-module3
        - kodak-module4
        - kodak-1330a
