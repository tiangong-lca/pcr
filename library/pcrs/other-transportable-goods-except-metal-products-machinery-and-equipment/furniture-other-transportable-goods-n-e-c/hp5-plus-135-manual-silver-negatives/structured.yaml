      flow_role: "actual molecular uptake and emissions"
      record_type: "environmental crossing/speciation survey"
      raw_fields: "species/CAS; input source; actual chemical reaction evidence; phase; receiving medium; raw concentration; integrated volume or true flow rate; time; T/P/wet-dry basis; blank/background; detection; retained/waste/stock pathways; mass/element residual"
      collection_method: "Measure matched inlet/outlet or validated species-specific inventories. Distinguish NH3 from ammonium, SO2 from sulfur totals, free Ag(I) from silver complexes/particles, and ordinary H2O from ambient through-moisture. Preserve real abnormal releases even without permission. Unsupported quantities remain unknown, not estimated by a single residual or ingredient fraction."
      unit: "kg; native raw units"
      frequency: "Each event/bath/lot and measured interval"
      temporal_coverage: "Complete reporting window and relevant original-cohort H"
      site_scope: "Declared site and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw source records; sampling/detection; state/stock/vector reconciliation and uncertainty"
    - protocol_id: cp_stock_vectors
      process_id: "negative_production"
      flow_role: "raw WIP genuinely unused non-WIP and release cohorts"
      record_type: "separate physical stock and inherited-vector ledger"
      raw_fields: "entity/lot/state; opening/closing quantities; raw/WIP/non-WIP/FG ownership; each historical exchange vector; new procurement/use; disjoint stock scope; prior normalization flag; cohort attribution; zero-output burdens; uncertainty; own versus provider-embedded history; disjoint non-WIP; every native/provider-unit vector; zero-output burdens; unassigned remainder"
      collection_method: "Track physical quantities independently from exchange vectors, including reusable bath inventory and unfinished film. Carry each actual inherited exchange across reporting windows, not only one total mass/cost. Use either gross receipts with stock correction or already-net consumed quantities with the matching vector bridge, never both. First-released closing FG is excluded from manufacturing Bclose. Follow the full binding section5 conditions, compatible provider units and section9 synthetic counterexamples; collect raw totals before attribution."
      unit: "kg; each exchange native unit"
      frequency: "Each event/bath/lot and measured interval"
      temporal_coverage: "Complete reporting window and relevant original-cohort H"
      site_scope: "Declared site and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw source records; sampling/detection; state/stock/vector reconciliation and uncertainty"
    - protocol_id: cp_fg
      process_id: "fg_service"
      flow_role: "all original-cohort product transfers and actual services"
      record_type: "gross custody and observed service ledger"
      raw_fields: "original Qc/release record; H start/end; opening/closing FG mass/state/moisture; internal handoff; actual gross dispatch/returns; prior dispatch reversal; raw service energy/water; incremental rewash/waste/species; historical/incremental vectors; held/failed work; all original Q0 fates; outward dispatch and returned-goods subsets disjoint; complete wet O/C; real J/H2O in/out and positive OTHER-X; Qt/Ut/A_i,c; all performed service on held goods"
      collection_method: "Reconcile real events and original strip identifiers. Preserve historical manufacture once and charge only observed new service burdens to its Qc; actual retained/held goods receive their performed services. Record natural moisture separately from actual rewash. Do not divide by H or create Q from shipment/reinspection. Add every real unlisted post-release chemical/waste/species separately. Follow the full binding section5 conditions, compatible provider units and section9 synthetic counterexamples; collect raw totals before attribution."
      unit: "kg; kWh; each exchange native unit"
      frequency: "Each event/bath/lot and measured interval"
      temporal_coverage: "Complete reporting window and relevant original-cohort H"
      site_scope: "Declared site and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw source records; sampling/detection; state/stock/vector reconciliation and uncertainty"
    - protocol_id: cp_packaging
      process_id: "packaging_pool"
      flow_role: "each named cassette bottle closure sleeve and carton"
      record_type: "complete article-specific custody pool"
      raw_fields: "article/SKU/material; supplier-included burden flag; measured tare/wet mass; original Qc; H; opening_empty/attached_WIP_FG/reusable; P; ER; closing_empty/attached_WIP_FG/reusable; S_gross; EO; W; internal reuse; composition/contamination; inherited vector; P standalone; I with contents; ER inward empty; S all gross filled outward including filled returns; EO empty outward; O/C/W full wet; J_in/J_out; H2O_in/H2O_out; positive OTHER_IN/OUT; proved same-side duplicate X only; Qt; Ut; A_i,c; Q0,c"
      collection_method: "Weigh/count each actual article independently, including supplier packaging, detachable closure and incoming returned items. Reconcile every pool against gross outward movement and actual waste. Count a whole assembly or disjoint parts, not both; separate liquid/film net mass. Retain actual provider scope and reused-article historical burden without another acquisition. Follow the full binding section5 conditions, compatible provider units and section9 synthetic counterexamples; collect raw totals before attribution."
      unit: "kg; item"
      frequency: "Each event/bath/lot and measured interval"
      temporal_coverage: "Complete reporting window and relevant original-cohort H"
      site_scope: "Declared site and actual supplier/receiver interfaces"
