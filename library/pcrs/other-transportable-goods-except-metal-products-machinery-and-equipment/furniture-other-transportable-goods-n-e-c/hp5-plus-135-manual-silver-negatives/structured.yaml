      collection_method: "Use traceable supplier and calibrated net receipt/issue records, with light-safe or matched sacrificial same-lot tare measurements where unprocessed film cannot be exposed for weighing. Include sampling loss. Keep acquired, issued and already-net consumption distinct. Do not duplicate complete-film coating constituents or supplier-included packaging burdens."
      unit: "kg"
