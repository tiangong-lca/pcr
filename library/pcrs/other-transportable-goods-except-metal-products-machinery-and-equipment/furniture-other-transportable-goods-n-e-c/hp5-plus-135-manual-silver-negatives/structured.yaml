      collection_method: "Collect raw external meters and independent liquid/solid moisture measurements. Separate freely added water, contained water, structural/retained water and actual chemical generation/consumption. Match humidity sampling state and quantify only net foreground exchange. A water residual alone cannot determine evaporation and reaction water. Document supplier energy/water ownership of real return streams."
      unit: "kg; native raw units"
      frequency: "Each event/bath/lot and measured interval"
      temporal_coverage: "Complete reporting window and relevant original-cohort H"
