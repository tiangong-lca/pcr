      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| `validate_terminal` | first_negative_release | Exactly one linked Product reference output is the fully developed, fixed, washed and dry non-cine negative. Native Mass/kg, net same-state measurement, EN/ZH first-release gate and complete qualifiers agree. No latent precursor or returned old strip becomes new Q. | ilford-hp5-2018; ilford-first-film |\n| `validate_atomic` | all inventory rows | Each card is one specific physical/chemical exchange with correct type/property/unit/medium, complete native restrictions and actual supply/receiver. Every real extra flow is added separately. A blank auxiliary UUID neither authorizes a collection label nor erases an actual exchange. |  |\n| `validate_once` | collection and calculation | Raw protocols collect unnormalized measurements. Unit/rate conversion and genuine attribution precede single_normalization exactly once. Audit all table cells, ten card fields, complete descriptions, qualifier elements, formula Inputs/Output, source fields/lists and quality requirements in both projections. |  |\n| `validate_stocks` | manufacturing FG and packaging | Verify disjoint raw/WIP/non-WIP vectors and no manufacturing Bclose deduction of already released FG. Check all gross dispatch/return events, Qc/H service increments including held goods, and complete package pool equations. Combined handoffs cancel without deleting external flows or stocks. |  |\n| `validate_waste_species` | waste and environmental outlets | Require actual full wet transfers and one provider; mixed origins are non-additive. Verify actual silver forms and environmental media; total silver/COD/VOC is not substituted for Ag(I), SO2 or another molecule. Preserve unauthorized/failed-work releases and unresolved residuals. |  |\n| `validate_allocation` | burden vectors | Verify dedicated/subdivision evidence, exchange-specific determining physical causality and only genuinely residual same-gate/state market value; all assigned/unassigned vectors reconcile. No fixed share, automatic silver credit or physical mass scaled by allocation. | ilcd-detailed-2010 |\n| `validate_completeness` | complete foreground package | Unknown required terminal identity, conversion, method relation, reaction/species split, actual operation, provider or measurement remains explicitly incomplete. Ordinary future-site measurements and auxiliary UUID gaps remain requirements; mechanical checks alone do not establish scientific/translation approval or publication. |  |\n\n### Complete retained scope, native admission and collection preambles\n\nThe following complete retained paragraphs remain binding with Q/Qc explicitly interpreted as original Q0 above. They do not replace the updated complete ledgers or reopen a retired identity.\n\nThis physical-product profile covers one complete non-cinematographic black-and-white silver-image negative on HP5 PLUS 135 acetate-base film, after actual optical exposure, development, stopping, nonhardening fixation, washing, final wetting rinse and drying. The output is first-quality-released net film strip, including its retained support, emulsion/image and actual conditioning moisture, with removable cassette, spool, sleeves and transport packaging excluded. Image count and subject do not define another manufacturing identity.\n\nThe selected foreground receives complete purchased unexposed HP5 PLUS 135 film and separately identified whole liquid concentrates. Actual camera exposure is followed by light-tight loading, one-shot ILFOTEC DD-X manual spiral development, ILFOSTOP stop bath, RAPID FIXER, actual film washing, ILFOTOL final rinse and ambient hanging drying in a clean area, then inspection and unique first release. Temperature conditioning and ventilation are measured where performed. Manufacturer originals establish this compatible technical route; they are not one contemporary factory/order record. Film coating, chemical manufacture, camera manufacture and photographic creative services remain actual upstream/use links, not invented onsite steps. Sources: ilford-hp5-2018; ilford-ddx-2019; ilford-first-film.\n\nExclude unexposed film or exposed undeveloped latent images as the reference output, paper positive prints, digital images, chemical products, cameras, cinematographic film, colour C41/E6, reversal, 120/sheet-format variants and medical/industrial radiation film. No bleach, toner, hardener, emulsion coating, boiler or onsite silver-recovery plant is inferred. Different actual routes require an explicit complete extension; their real burdens and abnormal releases cannot be deleted. Supplier tables are guidance for their stated product/process, not universal development settings, dilution, silver/gelatin fraction, thickness, density, energy, yield, lifetime or emission defaults.\n\nConventional black-and-white silver-gelatin chemistry forms a latent image on exposure, reduces exposed silver halide to image silver during development, and transfers remaining halide through fixing complexes into actual baths/washes. CCI Notes16/6 supports these qualitative distinctions only. Its maximum-permanence discussion and film/fibre-paper table include hardening/two-bath/toning alternatives and historic settings; those are not added to this HP5-specific manufacturer route and establish no archival-life claim. Source: cci-photo-processing-2007.\n\nThe native Product family positively identifies exposed and developed photographic plates/film other than cinematographic film, as a finished manufactured production mix at plant. This profile narrows it to complete HP5 PLUS135 acetate-base silver-image negatives after fixation, washing and drying. It does not identify an unexposed precursor, latent image, paper print, camera, digital file or mixture of products. Native Mass/kg measures full net film, not silver alone or a presumed per-roll weight. Manufacturer construction and actual supplier/provider compatibility remain separately declared.\n\nDeclare every required qualifier in full dataset metadata or equivalent reference context; absence leaves that data-package reference incomplete.\n\nEach card is one atomic exchange. Conditional means supported physical applicability, not an assumed positive quantity or automatic zero. Read complete process/section conditions with each card. Amount and aggregation labels refer to the single section8 result; they perform no arithmetic themselves. Physical gross quantities and separately attributed burden views remain distinct.\n\nProtocols collect raw unnormalized totals, states and inherited vectors. aggregation_rule declares the common final reference basis only; all conversions, attribution and the one division occur in the calculation rules. Keep original Qc and H for post-release services, including work on held goods.\n\n### Complete binding inventory context\n\nThis verbatim contextual rendering preserves every current card, field and description for validation of section6. It creates no second exchange, purchase, receiver transfer or burden. The uniquely identified section6 rows are the inventory.\n\n```text\n### Process Map\n\n| process_id | process_name | inclusion | inclusion_condition | role | quantitative_reference |\n| --- | --- | --- | --- | --- | --- |\n| negative_production | Optical exposure through first dry-negative release | required | Complete selected manual route with actual support operations | foreground | per 1 kg reference flow |\n| fg_service | Observed original-cohort storage handling and services | conditional | All actually performed services and physical events in H, including held goods | foreground | per 1 kg reference flow |\n| packaging_pool | Complete named-article packaging custody pools | conditional | Every actual supplier and delivery package with disjoint acquisition scope | foreground | per 1 kg reference flow |\n\nEach card is one atomic exchange. Conditional means supported physical applicability, not an assumed positive quantity or automatic zero. Read complete process/section conditions with each card. Amount and aggregation labels refer to the single section8 result; they perform no arithmetic themselves. Physical gross quantities and separately attributed burden views remain distinct.\n\n### Process: Optical exposure through first dry-negative release (`negative_production`)\n\n#### Inputs\n\n##### Product flows\n\n###### Complete purchased unexposed HP5 PLUS135 film (`unexposed_film`)\n\nOne complete supplied sensitized film including support and coating; net media measured independently from cassette/spool/packaging. No extra purchase of the embedded gelatin, silver salts or acetate. Use supplier lot and upstream converting/loading coverage; an integrated-coating-only intermediate or an exposure-only transfer does not establish this complete supplied-film interface.\n\n- Selected flow: Unexposed HP5 PLUS135 acetate-base black-and-white photographic film\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66`; Units of mass `93a60a57-a4c8-11da-a746-0800200c9a66` / kg\n- Amount rule: Full actual physical event in native unit recorded once; V or Qt / positive Q_analysis is labelled observation. Linked modeled demand uses distinct evidenced compatible-unit A_i,c / original positive Q0,c, never shared full Qt recharged to each cohort or shrunken physical export. Convert and normalize once; zero or unknown basis retains raw quantities without a unit result.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per 1 kg reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_materials`\n- Sources: `ilford-hp5-2018`; `ilford-first-film`\n\n###### Whole ILFOTEC DD-X concentrate (`ddx_concentrate`)\n\nWhole as-supplied liquid mixture measured in kg; its native Product solution family sets no concentration, formula, grade, geography or provider. Bind only the stated supplied concentrate with actual supplier composition/state evidence. Constituents and contained water remain non-additive; separate actual dilution water once. Historical preserved classification is not physical-form evidence. The actual chemical is ILFOTEC DD-X used as a one-shot developer; no MULTIGRADE paper developer or pure hydroquinone substitution.\n\n- Selected flow: Photographic developer solution `66826d83-6996-4d69-9137-33a038735770`\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66`; Units of mass `93a60a57-a4c8-11da-a746-0800200c9a66` / kg\n- Amount rule: Full actual physical event in native unit recorded once; V or Qt / positive Q_analysis is labelled observation. Linked modeled demand uses distinct evidenced compatible-unit A_i,c / original positive Q0,c, never shared full Qt recharged to each cohort or shrunken physical export. Convert and normalize once; zero or unknown basis retains raw quantities without a unit result.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per 1 kg reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_baths`\n- Sources: `ilford-ddx-2019`\n\n###### Whole ILFOSTOP concentrate (`stop_concentrate`)\n\nWhole citric-acid stop formulation including actual indicator and disclosed constituents. SDS partial citric-acid/2-phenoxyethanol ranges are not a complete formula. Do not buy pure acid or contained preservative/water again; use actual concentrate mass and bath history.\n\n- Selected flow: ILFORD ILFOSTOP liquid concentrate\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66`; Units of mass `93a60a57-a4c8-11da-a746-0800200c9a66` / kg\n- Amount rule: Full actual physical event in native unit recorded once; V or Qt / positive Q_analysis is labelled observation. Linked modeled demand uses distinct evidenced compatible-unit A_i,c / original positive Q0,c, never shared full Qt recharged to each cohort or shrunken physical export. Convert and normalize once; zero or unknown basis retains raw quantities without a unit result.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per 1 kg reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_baths`\n- Sources: `ilford-sundry-2017`; `ilford-stop-sds-2024`\n\n###### Whole RAPID FIXER concentrate (`fixer_concentrate`)\n\nWhole as-supplied liquid mixture measured in kg; its native Product solution family sets no concentration, formula, grade, geography or provider. Bind only the stated supplied concentrate with actual supplier composition/state evidence. Constituents and contained water remain non-additive; separate actual dilution water once. Historical preserved classification is not physical-form evidence. Actual nonhardening RAPID FIXER contains ammonium thiosulphate; no sodium-thiosulphate replacement or added fix hardener. SDS bisulphite/acetic acid are composition subledger entries, not separate purchases.\n\n- Selected flow: Photographic fixer solution `35b74e82-255a-4c73-869d-93daf726a34a`\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66`; Units of mass `93a60a57-a4c8-11da-a746-0800200c9a66` / kg\n- Amount rule: Full actual physical event in native unit recorded once; V or Qt / positive Q_analysis is labelled observation. Linked modeled demand uses distinct evidenced compatible-unit A_i,c / original positive Q0,c, never shared full Qt recharged to each cohort or shrunken physical export. Convert and normalize once; zero or unknown basis retains raw quantities without a unit result.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per 1 kg reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_baths`\n- Sources: `ilford-rapid-2010`; `ilford-fixer-sds-2024`\n\n###### Whole ILFOTOL wetting concentrate (`wetting_concentrate`)\n\nOne complete supplied wetting mixture for the final film rinse. Record actual batch composition and measured dose; no generic surfactant molecule, bottle-cap volume, density or dilution is assumed. No WASHAID or selenium toner is included by this identity.\n\n- Selected flow: ILFORD ILFOTOL nonionic wetting-agent concentrate\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66`; Units of mass `93a60a57-a4c8-11da-a746-0800200c9a66` / kg\n- Amount rule: Full actual physical event in native unit recorded once; V or Qt / positive Q_analysis is labelled observation. Linked modeled demand uses distinct evidenced compatible-unit A_i,c / original positive Q0,c, never shared full Qt recharged to each cohort or shrunken physical export. Convert and normalize once; zero or unknown basis retains raw quantities without a unit result.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per 1 kg reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_baths`\n- Sources: `ilford-sundry-2017`; `ilford-hp5-2018`\n\n###### Additional dilution wash and cleaning tap-water receipt (`process_water`)\n\nProduct treated municipal/potable tap water, water-production supply at plant; actual provider quality/geography and delivery boundary required. Native Mass/kg reference; secondary Volume coefficient is not measured density. Excludes direct natural-water extraction, embedded concentrate water and recirculated water counted again. Keep disjoint raw stage meters for developer/stop/fixer/wetting dilution, film washing, vessel cleaning and actual temperature bath; their sum is this one external receipt.\n\n- Selected flow: Tap water `d1e0e36c-07f0-4a75-bdcb-efb5d9e2ac36`\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66`; Units of mass `93a60a57-a4c8-11da-a746-0800200c9a66` / kg\n- Amount rule: Full actual physical event in native unit recorded once; V or Qt / positive Q_analysis is labelled observation. Linked modeled demand uses distinct evidenced compatible-unit A_i,c / original positive Q0,c, never shared full Qt recharged to each cohort or shrunken physical export. Convert and normalize once; zero or unknown basis retains raw quantities without a unit result.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per 1 kg reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_water`\n- Sources: `ilford-ddx-2019`; `ilford-first-film`\n\n###### Actual exposure processing and room electricity (`production_electricity`)\n\nProduct alternating-current electricity at the point of use, native Net calorific value/MJ interpreted as electrical energy. Native voltage, technology, generation mix, provider/geography, delivery boundary and line-loss allocation are unspecified and must match actual supply records; not a combustion-fuel mass. Meter kWh and convert once. Include actual exposure/lighting, temperature conditioning, ventilation, cleaning and idle equipment on disjoint meters/attribution. Ambient hanging drying is not assumed zero auxiliary energy.\n\n- Selected flow: Alternating current `455f0ef5-6118-4f2b-a3f5-1f75e0afe3ca`\n- Flow property / unit: Net calorific value `93a60a56-a3c8-11da-a746-0800200c9a66`; Units of energy `93a60a57-a3c8-11da-a746-0800200c9a66` / MJ\n- Amount rule: Full actual physical event in native unit recorded once; V or Qt / positive Q_analysis is labelled observation. Linked modeled demand uses distinct evidenced compatible-unit A_i,c / original positive Q0,c, never shared full Qt recharged to each cohort or shrunken physical export. Convert and normalize once; zero or unknown basis retains raw quantities without a unit result.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per 1 kg reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_energy`\n- Sources:\n\n###### Separately supplied aqueous acetic-acid adjustment (`acetic_adjustment`)\n\nConditional only for an actual separately supplied fixer adjustment, with measured as-supplied concentration and mass. Not the acetic acid already contained in RAPID FIXER; no manufacturer example concentration is imposed. Do not infer this input from a pH change.\n\n- Selected flow: Aqueous acetic acid adjustment solution\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66`; Units of mass `93a60a57-a4c8-11da-a746-0800200c9a66` / kg\n- Amount rule: Full actual physical event in native unit recorded once; V or Qt / positive Q_analysis is labelled observation. Linked modeled demand uses distinct evidenced compatible-unit A_i,c / original positive Q0,c, never shared full Qt recharged to each cohort or shrunken physical export. Convert and normalize once; zero or unknown basis retains raw quantities without a unit result.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per 1 kg reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_baths`\n- Sources: `ilford-rapid-2010`\n\n###### Actual cellulose cleaning wipe (`cleaning_wipe`)\n\nOnly if actually used; one supplied cellulose wipe article, independently weighed with actual wetting/coating state. No generic paper-stock or whiteboard substitution. Add any different actual wipe or cleaner separately.\n\n- Selected flow: Cellulose cleaning wipe\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66`; Units of mass `93a60a57-a4c8-11da-a746-0800200c9a66` / kg\n- Amount rule: Full actual physical event in native unit recorded once; V or Qt / positive Q_analysis is labelled observation. Linked modeled demand uses distinct evidenced compatible-unit A_i,c / original positive Q0,c, never shared full Qt recharged to each cohort or shrunken physical export. Convert and normalize once; zero or unknown basis retains raw quantities without a unit result.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per 1 kg reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_materials`\n- Sources:\n\n###### Photographic camera (`camera_asset`)\n\nActual independently identified asset/article fleet acquisition and complete compatible manufacture/service provider; preserve full physical opening/closing/returns/replacements and original use-cohort history. Include only if actually used; measure real mass/dimensions and provider unit bridge when required. No default M, lifetime, per-roll purchase or cellulose-wipe proxy. fleet_and_cloth and three_ledgers_whole_waste apply.\n\n- Selected flow: Photographic camera\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66`; Units of mass `93a60a57-a4c8-11da-a746-0800200c9a66` / kg\n- Amount rule: Full actual physical event in native unit recorded once; V or Qt / positive Q_analysis is labelled observation. Linked modeled demand uses distinct evidenced compatible-unit A_i,c / original positive Q0,c, never shared full Qt recharged to each cohort or shrunken physical export. Convert and normalize once; zero or unknown basis retains raw quantities without a unit result.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per 1 kg reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_assets`\n- Sources: `ilford-first-film`; `kodak-1330a`; `kodak-module3`\n\n###### Photographic exposure light (`light_asset`)\n\nActual independently identified asset/article fleet acquisition and complete compatible manufacture/service provider; preserve full physical opening/closing/returns/replacements and original use-cohort history. Include only if actually used; measure real mass/dimensions and provider unit bridge when required. No default M, lifetime, per-roll purchase or cellulose-wipe proxy. fleet_and_cloth and three_ledgers_whole_waste apply.\n\n- Selected flow: Photographic exposure light\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66`; Units of mass `93a60a57-a4c8-11da-a746-0800200c9a66` / kg\n- Amount rule: Full actual physical event in native unit recorded once; V or Qt / positive Q_analysis is labelled observation. Linked modeled demand uses distinct evidenced compatible-unit A_i,c / original positive Q0,c, never shared full Qt recharged to each cohort or shrunken physical export. Convert and normalize once; zero or unknown basis retains raw quantities without a unit result.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per 1 kg reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_assets`\n- Sources: `ilford-first-film`; `kodak-1330a`; `kodak-module3`\n\n###### Photographic light meter (`lightmeter_asset`)\n\nActual independently identified asset/article fleet acquisition and complete compatible manufacture/service provider; preserve full physical opening/closing/returns/replacements and original use-cohort history. Include only if actually used; measure real mass/dimensions and provider unit bridge when required. No default M, lifetime, per-roll purchase or cellulose-wipe proxy. fleet_and_cloth and three_ledgers_whole_waste apply.\n\n- Selected flow: Photographic light meter\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66`; Units of mass `93a60a57-a4c8-11da-a746-0800200c9a66` / kg\n- Amount rule: Full actual physical event in native unit recorded once; V or Qt / positive Q_analysis is labelled observation. Linked modeled demand uses distinct evidenced