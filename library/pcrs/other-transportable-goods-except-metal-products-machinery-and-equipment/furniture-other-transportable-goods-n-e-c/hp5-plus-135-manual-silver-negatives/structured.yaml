      collection_method: "Weigh supplied mixtures and actual additions; measure working-solution volume/density and matched transfer/drag-out. Keep one-shot developer separate from reused stop/fixer history. Actual values and complete supplier formulation evidence replace illustrative manufacturer tables. Chemical species/composition subaccounts do not create extra purchase rows."
