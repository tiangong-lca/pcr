measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the sum of calibrated net film mass at each unique first negative release under cp_release, after actual drying/conditioning. Include retained acetate support, image/emulsion and moisture once; exclude removable packing, rejected footage and removed destructive samples. Closing first-released FG is already included in Q."
  - id: count_area_bridge
    applies_to: "film and packaging records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh same-state net strips directly. Counts/length/area need independently measured same-lot net unit mass or areal mass with sampling and uncertainty; record actual perforations/cuts. Do not infer kg from camera count, nominal frame count, envelope geometry, substrate thickness or a database secondary coefficient. A measured per-item mass is a collection result, never a guessed value."
  - id: whole_solution
    applies_to: "concentrates and waste liquids"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use whole as-supplied wet formulation mass once. Its water/active ingredient assays are non-additive subledgers. Independently measure actual added dilution water and any separately purchased adjustment chemical. Volume-to-mass needs the specific solution density at the measured state; water density is not another bath density."
  - id: native_conversion
    applies_to: "utilities and environmental sampling"
    required_property_ref:
      name: "native property"
      uuid: ""
    required_unit: "MJ; kg"
    rule: "Preserve raw units. Convert electricity kWh × 3.6 to MJ once before attribution. Integrate genuine rates over time; already integrated liquid/gas volumes receive no extra time multiplier. Match concentration to actual dry/wet gas volume, temperature/pressure and sampling state."
  - id: gross_and_burden
    applies_to: "all physical gates"
    required_property_ref:
      name: "native property"
      uuid: ""
    required_unit: "kg; MJ"
    rule: "Keep full physical gross V and its native unit separate from attributed burden A and historical stock vectors. Each result references the one section8 normalization on Q or original Qc. H is an observation interval, not another divisor. Internal transfers cancel only as matched physical endpoints."
