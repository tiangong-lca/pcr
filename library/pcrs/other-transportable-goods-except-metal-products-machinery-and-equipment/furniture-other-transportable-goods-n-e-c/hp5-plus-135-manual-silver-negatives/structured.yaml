      collection_method: "Retain disjoint actual meter intervals including all failed and zero-output work. Link actual camera/tank/room equipment services and replacements using documented measured-use cohorts; no invented future lifetime. Convert raw energy once under native_units before genuine attribution; no collection division by Q."
      unit: "kWh; MJ"
