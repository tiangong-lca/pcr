      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| `allocation_scope` | attributional multifunctional processes | Use this hierarchy only for attributional cases requiring allocation. First assign dedicated inputs/operations directly and investigate actual or virtual subdivision by batch, bath, equipment and function. Do not use manufacturer instructions as LCA allocation evidence. | ilcd-detailed-2010 |\n| `determining_causality` | each remaining shared exchange | Establish the physical relationship determining each exchange separately, using actual meters/chemistry/processing observations. Bath turnover, film area, exposure time, thermal capacity or occupancy are candidate drivers only when demonstrated to determine that exchange. One convenient mass or time share is not automatically valid for all electricity, chemicals, silver and space services. | ilcd-detailed-2010 |\n| `residual_economic` | demonstrably unresolved residual burdens | Only residual burdens without a determining physical relationship use justified contemporaneous market values at the same common-process exit and actual state/quality/quantity. Remove downstream finishing, packing, transport and service value where necessary to recover that gate value; disclose estimation and sensitivity. Do not freely choose physical versus economic, fixed shares, or creative-image sales value for already separable processing. | ilcd-detailed-2010 |\n| `vector_not_mass` | physical ledgers and burdens | Allocation divides burden vectors, not physical outgoing wet mass. Preserve full gross quantities and stock history, conserve every exchange vector across assigned and unassigned functions, and keep cohort services separate. If software cannot express custody separately from burden attribution, construct explicit measured stock/service units rather than duplicate providers or shrink physical flows. | ilcd-detailed-2010 |\n| `silver_no_credit` | silver-bearing waste and any recovery | Sale or transfer of silver-bearing liquid, sludge or waste film does not itself move manufacturing burdens to the receiver or earn avoided-silver credit. Retain full waste state, actual treatment and historical burdens. Any real recovered product and separate recovery process require their actual inventory and a separately justified allocation boundary; no assumed recovery yield. | ilcd-detailed-2010; ilford-rapid-2010 |\n\n"
