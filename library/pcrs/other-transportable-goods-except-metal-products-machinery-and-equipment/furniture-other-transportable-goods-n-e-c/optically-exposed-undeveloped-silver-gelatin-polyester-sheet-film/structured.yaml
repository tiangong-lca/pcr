      rule: "**bag_purchase**: Record one actual whole black light-tight bag as the supplied protective article. The historic configuration does not prove its polymer/board composition or current supplier. Do not bind raw plastic film or a non-reusable carton merely by name. Measure construction/tare and maintain its own empty/attached/reusable pool. Original protection contained in the whole-film provider or another whole supplied article retains its full physical receipt and non-additive composition subledger; its upstream burden remains owned by that original supply. Only actual independent additional procurement adds a separate provider burden. Reusing original protection does not repurchase it."
