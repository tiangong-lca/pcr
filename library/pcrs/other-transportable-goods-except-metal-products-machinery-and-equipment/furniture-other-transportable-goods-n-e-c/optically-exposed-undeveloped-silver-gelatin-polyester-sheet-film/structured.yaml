    - rule_id: b_first_release
      applies_to: "all inventories"
      rule: "Q counts each newly first-released sheet once, including same-cohort closing FG. Reinspection, customer return, redispatch and real rework retain original cohort and create no new Q. Preserve original deviation/failed-event facts even when later accepted. A proven erroneous original release requires an auditable correction to the complete cohort report, not deletion of its history."
      source_ids: []
    - rule_id: b_later_service
      applies_to: "p_fg"
      rule: "Retain every actually performed later storage, protection, packing, handling, return inspection, rework and dispatch service in observed H, even with zero dispatch or FG still held. Attribute increments to original Qc; H is coverage, never another denominator. Paired first-release handoff is internal and cancels on combining manufacturing and FG physical gates."
