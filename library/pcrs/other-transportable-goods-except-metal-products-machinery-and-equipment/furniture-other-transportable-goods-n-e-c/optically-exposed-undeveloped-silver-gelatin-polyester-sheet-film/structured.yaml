    - rule_id: b_real_additions
      applies_to: "all inventory rows"
      rule: "Add every actual unlisted supplied formulation, battery, fuel, refrigerant, transport service, test chemical, asset replacement, waste or measured molecular outlet as one separate qualified exchange. An absent card, authorisation, zero-output period or intended dry route never proves a real flow absent. Conditional rows become not_applicable only with operation evidence; unknown remains unknown."
      source_ids:
        - ilford-sheet-exposure-2018
    - rule_id: b_chemistry_and_water
      applies_to: "physical gates"
      rule: "Reconcile whole wet mass and relevant elements independently of microscopic latent chemistry. Do not infer multiple species, reaction water or silver loss from one total residual. Separate free water, actual phase transfer, bound/structural water and evidenced reaction water. COD/VOC are indicators rather than a named chemical mass. Natural moisture exchange is not automatically a defect or repair operation."
      source_ids:
        - cci-latent-image
    - rule_id: b_packaging_pools
      applies_to: "each actual packing article"
      rule: "For each actual article and each manufacture, later-service and combined gate, use the whole-wet equation O + P + I + ER + J_in + H2O_in = C + Sgross + EO + Wwhole + J_out + H2O_out. O/C contain all actual empty, attached raw/WIP/non-WIP/FG and reusable stocks. P is independent new external procurement; I is actual packing received contained in a whole supply or in a paired internal handoff, excluding P/ER; ER is external return received, Sgross is full article mass leaving with gross product dispatch or paired internal handoff, EO is a separate outward return to its owner, and Wwhole is the actual discarded whole wet article. J_in/out are real non-water material added/removed; H2O_in/out are real independent water uptake/loss, including natural humidity without repair. None is a fitted residual. Terms are nonoverlapping: water/material already inside O/P/I/ER/C/Sgross/EO/Wwhole stays nested there, never added again as J/H2O. Full contaminated Wwhole includes substrate, retained cleaner, film residue and water once; do not create separately exported retained contents. Paired internal I/Sgross cancel only at the combined gate. For an expanded diagnostic equation, add OTHER_in - X_in to the left and OTHER_out - X_out to the right of the same equation. X only removes an explicitly identified OTHER same-side representation already contained in that side's gross flow; 0 <= X <= the proven duplicate OTHER. X cannot subtract O/C, any real J/H2O increment, an opposite-side leg or a merely present card. Actual repair/refill materials and outward removed matter need their exact atomic cards if present; the symbols do not assert that repair or moisture occurs. Keep physical amounts, provider burden ownership and service allocations distinct; no new Q, coproduct or avoided product from return/reuse."
      source_ids:
        - harman-sheet-transfer-2016
        - ilford-sheet-exposure-2018
    - rule_id: b_utilities_and_assets
      applies_to: "all actual utilities and assets"
      rule: "No boiler/steam/air-compressor train is presumed. If actual heat/steam/heat-exchange water or condensate crosses the boundary, add each real Product leg with measured thermal state/enthalpy and supplier water-energy convention. Track full physical assets separately from allocated asset-service burdens; repeated use is not repeated physical procurement."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "This method produces an identified physical latent-image article: purchased complete ILFORD HP5 PLUS black-and-white silver-gelatin negative sheet film on polyester support in the nominal 5x4-inch format, optically exposed, unloaded and protected in a black light-tight bag and a reusable sheet-film box, then first released while still chemically undeveloped. Manufacturer material guidance, documented 4x5 exposure practice and the historical HARMAN box/bag transfer configuration are compatible evidence for this technical synthesis; they do not identify one contemporary order or one factory. Actual cut contour, lot, packaging construction and release criteria must be collected. Sources: harman-hp5-2018; ilford-sheet-exposure-2018; harman-sheet-transfer-2016; ilford-gelatine; cci-latent-image."
      source_ids: []
    - rule_id: system_boundary_rule_10
      applies_to: "foreground_system_boundary"
      rule: "The foreground starts at receipt of finished unexposed sheets with their upstream provider. It includes storage and any actual acclimatisation, dark loading, orientation/holder checks, metering and controlled optical exposure, closing and identifying the exposed holder, dark unloading, traceability/integrity checks and protected first handoff. The latent image is invisible: acceptance uses validated exposure-operation and chain-of-custody records, not an invented visible-image density test. Actual rejected attempts, start/stop, idle, cleaning, tests and rework remain in the inventory. Any real destructive quality test requires its complete actual test stage and atomic exchanges; it never turns the reference article into a developed negative."
      source_ids: []
    - rule_id: system_boundary_rule_11
      applies_to: "foreground_system_boundary"
      rule: "Exclude base or emulsion manufacture from this exposure foreground; represent it once in the whole-film provider. Unexposed stock is an input, not the reference output. Developed negatives, motion-picture products, paper prints, instant/reversal/chromogenic routes, cameras, exposure equipment and creative/photographic-service functions are not this terminal. No developer, fixer, wash bath, steam boiler, compressed-air system or emission is assumed to exist. Actual additional operations and individual exchanges must nevertheless be included and applicability reassessed. No clinical or industrial-radiation operating parameters, universal exposure setting, storage lifetime, thickness/density, silver content, yield or operating intensity is prescribed."
      source_ids: []
    - rule_id: system_boundary_rule_12
      applies_to: "foreground_system_boundary"
      rule: "Complete reference-flow required qualifiers: actual site and reporting period; film manufacturer and exact lot; HP5 PLUS black-and-white silver-gelatin negative system; polyester sheet support and complete retained coatings; nominal 5x4-inch format and measured actual contour; net film mass and independent packaging tare at stated moisture; actual sheet count and lot-specific mass conversion if used; unexposed receipt and upstream whole-film provider boundary; holder identity and emulsion orientation; optical exposure event and actual validated settings; absence of chemical development on reference sheets; dark handling and protected traceable transfer; unique first-release event and cohort Q; raw WIP unused-non-WIP and FG inventories with inherited vectors; black-bag and reusable-box construction and reuse pools; individual cleaning chemical and supplied formulation; native utility geography voltage and supply route; actual asset configuration and measured use allocation; each real waste species receiver and treatment boundary; observed later-service interval H and original Qc; uncertainty missing data and deviations"
      source_ids: []
    - rule_id: system_boundary_rule_13
      applies_to: "foreground_system_boundary"
      rule: "Lock Q0,c = sum of independently weighed unique first-accepted whole-film events q0,j for original cohort c at its one declared protected undeveloped gate; Q, Qc and Q0,c denote this same denominator, not shipment or a current survivor mass. Preserve each event and its original moisture/composition. Partition all original accepted material once: Q0,c = Dnet0,c + Ronsite0,c + Lirreversible0,c + Tother0,c. Dnet0 is material remaining outside in disjoint net deliveries after actual matching returns; Ronsite0 includes all actual on-site accepted material in held FG, returns, quarantine, rework, tests or other accepted states; Lirreversible0 includes original material actually evaporated, damaged, consumed or discarded; Tother0 is another real disjoint terminal disposition, including actual downstream development outside this endpoint. These are material-origin portions on the original acceptance mass ledger, not gross repeated deliveries or restored survivor masses. Reconcile them to separate current wet physical masses by actual retained independent additions/uptake and removals, with original versus added material origins and phase/element bridges; never restore original lost water into a survivor while also entering that water in L. Pre-acceptance raw, WIP and truly unused non-WIP belong to physical stock and inherited-load accounts but not Q0. Keep accepted material within those physical locations identified separately. Raw/WIP/FG returns, retests, redispatch and loops never generate another event. A proved erroneous initial acceptance requires an auditable original-cohort correction, not a convenient new denominator. H is actual service coverage; no future development or image lifetime enters manufacture or new Q. A zero current-period release/dispatch does not erase a positive original Q0 or its service result; only genuinely zero/unknown original Q0 leaves raw loads/history with no unit result."
      source_ids: []
    - rule_id: system_boundary_rule_14
      applies_to: "foreground_system_boundary"
      rule: "Maintain three linked accounts: full physical stocks/transfers, inherited/newly incurred foreground and provider exchange vectors, and attributed original-cohort reports. Raw/WIP/non-WIP/FG/returned holdings have separate complete physical and burden histories. Opening own foreground/WIP history plus new work is carried once; a whole linked provider already containing that same production/test/packing/treatment history must not be added again as decomposed upstream work. Conversely a purchased article or paper gate never hides actual local manufacture, exposure, repair, conditioning, capture, testing or waste treatment. For a make/buy split, either link the genuine complete compatible provider and actual interfaces, or expand its real manufacture with all material/utility/loss/packing/transport interfaces and disjoint history. Preserve full actual transport/receipt and unexposed film support/emulsion/backing/coating manufacture in the upstream film provider; no resin/silver input proxy. Film, camera, holder and other device providers are independent of exposure service; no same manufacturer or SKU is required as an artificial gate."
      source_ids: []
    - rule_id: system_boundary_rule_15
      applies_to: "foreground_system_boundary"
      rule: "Use a configured fleet/service history for camera, holder, separately supplied lens/shutter, incident light meter, tripod, cable release, focusing loupe, light-tight loading tent, marking pen and actual cloth/tool fleet. Include each only when present and not already contained in a complete supplied configuration. Complete integrated configuration and separate procurement are mutually exclusive for the same item. Preserve original acquisition/receipt, full physical mass or actual native reference unit, opening/closing active/spare/repair/loan stock, returns, retirement, maintenance/replacement and performed use across all cohorts. Actual measured mass/area/count bridges convert compatible provider units; one item never equals one kg. Keep physical fleet balance separate from allocated service A; repeated use/dispatch does not repurchase the fleet. Same-article phase transitions, washing/refilling/repair and actual maintenance chemicals, electricity, parts and contaminated exits have distinct actual interfaces and own/provider histories once. Full retired article plus retained contents is one real waste load; nested components and service share do not shrink its physical receiver quantity. No default life, yield, use count, battery chemistry, pen refill or cleaning dose is supplied. If actual additional light sources, filters, cells, labels, tools or maintenance materials exist, add each specific atomic exchange and its complete provider/interface; an optional example never proves absence."
      source_ids: []
    - rule_id: system_boundary_rule_16
      applies_to: "foreground_system_boundary"
      rule: "For each actually separate waste event t, retain receiver identity, Qt equal to the full as-transferred wet physical load, complete nested substrate/retained film/cleaner/water composition, collection/storage changes and actual complete treatment-provider interface. Separate liquid/cloth/film/packing rows apply only to material not already inside a mixed whole event. Determine the provider's full physical demand Ut = convert_actual(Qt, actual provider reference unit) using measured compatible mass/volume/state or actual batch interface, never an invented kg-to-item factor. Either use a genuine full treatment producer once or expand its real treatment, transport, utilities, residuals and emissions; include actual on-site pretreatment separately without repurchasing embedded work. Attribution is a different account: for every exchange e retain the full treatment vector Bt,e and original-cohort A_t,c,e plus other actual beneficiaries/unassigned portions; the portions are disjoint and sum to Bt,e. Use actual justified service drivers and original Q0,c for each A_t,c,e/Q0,c. Qt and Ut do not become the allocated share, and the full provider must not be charged again to each cohort. Prior treatment/service history and subsequent increments are distinguished once. Unknown assignment or provider unit bridge stays unresolved with full raw loads, not a smaller physical export or a zero treatment demand."
      source_ids: []
    - rule_id: system_boundary_rule_17
      applies_to: "foreground_system_boundary"
      rule: "Conditional chemical rows do not establish that IPA cleaning, moisture exchange, liquid waste or an air emission actually occurs. Establish actual operation and outlet first; absence requires physical operation evidence, never deletion to avoid analysis. Whole protected-sheet mass, whole collected cleaning liquor and whole wet cloth/waste are weighed at their actual light-safe/closed receiver boundary with representative handling and independent tare. A whole wet export does not require inventing an elemental discharge, and nested analytes are not additional physical exports. A claim of IPA, water or silver content requires its actual selective matrix procedure, sampling/preservation, preparation/release or extraction, blanks/calibration, recovery and uncertainty; total VOC, COD, dry residue or cleaner loss is not species measurement. Ordinary unperformed calibration or site QA of a real applicable programme is distinct from an absent necessary programme. The existing optical exposure and protected release programme does not rely on destructive visible-image inspection of the reference sheet."
      source_ids: []
    - rule_id: system_boundary_rule_18
      applies_to: "foreground_system_boundary"
      rule: "Where actual molecular IPA or water vapour to air is claimed, EPA Method320 (retained full 14January2019 Internet copy plus FTIR Protocol) is a concrete conditional IR-active vapour programme, not a PM/liquid method. Select actual targets and interferences, source screening and representative normal/abnormal/fugitive/bypass coverage; maintain actual material-compatible heated probe/filter/line/cell above relevant dewpoints, documented temperature/pressure/pathlength, leak checks, cell-volume/timing and actual wet/dry gas-flow basis. Quantitative water in §8.5.2 requires Protocol4.6 quantitative reference spectra, not a qualitative water interference spectrum. Obtain traceable standards, two or more concentrations in duplicate, CTS before/after, stability and concentration/path range; self-prepared two-concentration standards require the actual independent secondary verification. Include Protocol analytical regions, interference evaluation and uncertainty; initial validation follows §13/Method301 dynamic series of 12 spiked and 12 unspiked measurements, distinct from routine §8.6.2 QA spikes. Do not make the QA spike its own bias-correction factor. Retain actual standards, sampling train, spike/matrix loss checks and all collected condensate without assuming complete recovery. Integrate actual compatible concentration and measured flow/time/state once. In the original §9.2 printed tracer notation, keep the physical mixing fraction k = (tracer_spk - tracer_native)/(tracer_std - tracer_native); expected target concentration = k*Cstd + (1-k)*Cnative on one basis. Do not adopt the inconsistent printed DF>=10 as a fraction, or invent a tracer dose. Heated FTIR may evaporate entrained droplets and cannot reconstruct original vapour versus wet-droplet phase from cell H2O/IPA. Actual liquid/droplet/cloth-recovery and silver assays are not supplied by Method320; if such phase-specific/nested quantification is necessary and no complete applicable programme is established, retain that precise method hold and do not issue the dependent quantitative result. No route-wide hold is inferred merely from optional rows, and no future SOP or finite check waives a necessary gap."
      source_ids: []
    - rule_id: system_boundary_rule_19
      applies_to: "foreground_system_boundary"
      rule: "Collection stores raw records before division. aggregation_rule denotes the final single_quotient report basis, not another calculation inside the protocol. Unmeasured quantities must not produce fabricated unit results."
