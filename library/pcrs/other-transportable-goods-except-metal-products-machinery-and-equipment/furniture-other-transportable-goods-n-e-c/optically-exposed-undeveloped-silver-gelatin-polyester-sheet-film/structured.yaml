      rule: "**first_release**: Native Product family is exposed but undeveloped, finished/manufactured, production mix at plant, with Mass/kg and no declared grade or geographic limit. This card selects only the complete HP5 polyester B&W optical latent sheet: support, silver-gelatin layer and all retained coatings together. It does not authorize plate/paper/textile, unexposed or developed substitution. No native secondary conversion or chemical yield is supplied. This is the only functional reference row. Count newly accepted net sheet mass Q once; intact latent-state confirmation uses actual operation/identity records and does not chemically develop the accepted article."
