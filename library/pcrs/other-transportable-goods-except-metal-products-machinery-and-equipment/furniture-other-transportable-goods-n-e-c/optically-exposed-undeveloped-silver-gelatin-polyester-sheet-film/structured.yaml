          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_terminal | first_release | Verify one complete optically exposed yet chemically undeveloped polyester B&W sheet configuration; exact linked first_release Product and 1 kg basis. A latent image cannot be certified by directly inspecting a developed image on that same reference sheet. | `harman-hp5-2018`; `cci-latent-image` |\n| v_native | all inventory rows | Check full native restrictions and official Chinese display, exact property→unit-group→unit; no wrong media, formulation, route or grade substitution. Blank auxiliary identities remain concrete atomic names and tracked gaps. |  |\n| v_release_history | manufacturing and FG | Verify unique Q, inherited stock vectors and original-cohort later H. Held closing FG remains within first-release Q; physical dispatch and returns cannot create a second output or delete actual failed-event history. |  |\n| v_normalize | all inventory rows | Collection retains raw unnormalised quantities. Confirm convert_raw/attribution precede single_quotient, executed exactly once; all card amounts and aggregation reference that result. Qc=0 preserves loads and yields no unit result. Unknown or unsupported relationships are review-required, not passing results. |  |\n| v_physical | all physical gates | Check independent whole-wet mass and relevant-element closure, actual species and phase/reaction-water evidence, internal cancellation, full gross V and legitimate same-side OTHER-flow X only. No fictitious species, generic density, stock-as-flow or balancing F. | `cci-latent-image` |\n| v_pack | each packing pool | Reconcile every bag/box/tape pool with opening/closing empty/attached/reusable stock, purchase, external-return receipts, gross-dispatch packing, outward returns and waste. No internal-reuse purchase, coproduct or net-film-Q inclusion. | `harman-sheet-transfer-2016`; `ilford-sheet-exposure-2018` |\n| v_complete | all actual stages | Compare the actual route with all included and conditional cards; add real omitted inputs/outputs and complete actual testing/treatment stages before a dataset is complete. No assumed steam/boiler/development, no actual-flow deletion to pass a checker, no success count hiding earlier failures. |  |\n| v_waste_allocation | all waste and shared burden records | Check one actual mixed stream/provider or real segregated streams with non-additive originW, and the full allocation hierarchy. A sale alone cannot establish a credit or coproduct. | `ilcd-allocation-2010` |\n| v_q0_full | all inventory rows | Lock Q0,c = sum of independently weighed unique first-accepted whole-film events q0,j for original cohort c at its one declared protected undeveloped gate; Q, Qc and Q0,c denote this same denominator, not shipment or a current survivor mass. Preserve each event and its original moisture/composition. Partition all original accepted material once: Q0,c = Dnet0,c + Ronsite0,c + Lirreversible0,c + Tother0,c. Dnet0 is material remaining outside in disjoint net deliveries after actual matching returns; Ronsite0 includes all actual on-site accepted material in held FG, returns, quarantine, rework, tests or other accepted states; Lirreversible0 includes original material actually evaporated, damaged, consumed or discarded; Tother0 is another real disjoint terminal disposition, including actual downstream development outside this endpoint. These are material-origin portions on the original acceptance mass ledger, not gross repeated deliveries or restored survivor masses. Reconcile them to separate current wet physical masses by actual retained independent additions/uptake and removals, with original versus added material origins and phase/element bridges; never restore original lost water into a survivor while also entering that water in L. Pre-acceptance raw, WIP and truly unused non-WIP belong to physical stock and inherited-load accounts but not Q0. Keep accepted material within those physical locations identified separately. Raw/WIP/FG returns, retests, redispatch and loops never generate another event. A proved erroneous initial acceptance requires an auditable original-cohort correction, not a convenient new denominator. H is actual service coverage; no future development or image lifetime enters manufacture or new Q. A zero current-period release/dispatch does not erase a positive original Q0 or its service result; only genuinely zero/unknown original Q0 leaves raw loads/history with no unit result. |  |\n| v_receiver_full | all inventory rows | For each actually separate waste event t, retain receiver identity, Qt equal to the full as-transferred wet physical load, complete nested substrate/retained film/cleaner/water composition, collection/storage changes and actual complete treatment-provider interface. Separate liquid/cloth/film/packing rows apply only to material not already inside a mixed whole event. Determine the provider's full physical demand Ut = convert_actual(Qt, actual provider reference unit) using measured compatible mass/volume/state or actual batch interface, never an invented kg-to-item factor. Either use a genuine full treatment producer once or expand its real treatment, transport, utilities, residuals and emissions; include actual on-site pretreatment separately without repurchasing embedded work. Attribution is a different account: for every exchange e retain the full treatment vector Bt,e and original-cohort A_t,c,e plus other actual beneficiaries/unassigned portions; the portions are disjoint and sum to Bt,e. Use actual justified service drivers and original Q0,c for each A_t,c,e/Q0,c. Qt and Ut do not become the allocated share, and the full provider must not be charged again to each cohort. Prior treatment/service history and subsequent increments are distinguished once. Unknown assignment or provider unit bridge stays unresolved with full raw loads, not a smaller physical export or a zero treatment demand. |  |\n| v_fleet_full | all inventory rows | Use a configured fleet/service history for camera, holder, separately supplied lens/shutter, incident light meter, tripod, cable release, focusing loupe, light-tight loading tent, marking pen and actual cloth/tool fleet. Include each only when present and not already contained in a complete supplied configuration. Complete integrated configuration and separate procurement are mutually exclusive for the same item. Preserve original acquisition/receipt, full physical mass or actual native reference unit, opening/closing active/spare/repair/loan stock, returns, retirement, maintenance/replacement and performed use across all cohorts. Actual measured mass/area/count bridges convert compatible provider units; one item never equals one kg. Keep physical fleet balance separate from allocated service A; repeated use/dispatch does not repurchase the fleet. Same-article phase transitions, washing/refilling/repair and actual maintenance chemicals, electricity, parts and contaminated exits have distinct actual interfaces and own/provider histories once. Full retired article plus retained contents is one real waste load; nested components and service share do not shrink its physical receiver quantity. No default life, yield, use count, battery chemistry, pen refill or cleaning dose is supplied. If actual additional light sources, filters, cells, labels, tools or maintenance materials exist, add each specific atomic exchange and its complete provider/interface; an optional example never proves absence. |  |\n| v_analytical_conditional | all inventory rows | Conditional chemical rows do not establish that IPA cleaning, moisture exchange, liquid waste or an air emission actually occurs. Establish actual operation and outlet first; absence requires physical operation evidence, never deletion to avoid analysis. Whole protected-sheet mass, whole collected cleaning liquor and whole wet cloth/waste are weighed at their actual light-safe/closed receiver boundary with representative handling and independent tare. A whole wet export does not require inventing an elemental discharge, and nested analytes are not additional physical exports. A claim of IPA, water or silver content requires its actual selective matrix procedure, sampling/preservation, preparation/release or extraction, blanks/calibration, recovery and uncertainty; total VOC, COD, dry residue or cleaner loss is not species measurement. Ordinary unperformed calibration or site QA of a real applicable programme is distinct from an absent necessary programme. The existing optical exposure and protected release programme does not rely on destructive visible-image inspection of the reference sheet. Where actual molecular IPA or water vapour to air is claimed, EPA Method320 (retained full 14January2019 Internet copy plus FTIR Protocol) is a concrete conditional IR-active vapour programme, not a PM/liquid method. Select actual targets and interferences, source screening and representative normal/abnormal/fugitive/bypass coverage; maintain actual material-compatible heated probe/filter/line/cell above relevant dewpoints, documented temperature/pressure/pathlength, leak checks, cell-volume/timing and actual wet/dry gas-flow basis. Quantitative water in §8.5.2 requires Protocol4.6 quantitative reference spectra, not a qualitative water interference spectrum. Obtain traceable standards, two or more concentrations in duplicate, CTS before/after, stability and concentration/path range; self-prepared two-concentration standards require the actual independent secondary verification. Include Protocol analytical regions, interference evaluation and uncertainty; initial validation follows §13/Method301 dynamic series of 12 spiked and 12 unspiked measurements, distinct from routine §8.6.2 QA spikes. Do not make the QA spike its own bias-correction factor. Retain actual standards, sampling train, spike/matrix loss checks and all collected condensate without assuming complete recovery. Integrate actual compatible concentration and measured flow/time/state once. In the original §9.2 printed tracer notation, keep the physical mixing fraction k = (tracer_spk - tracer_native)/(tracer_std - tracer_native); expected target concentration = k*Cstd + (1-k)*Cnative on one basis. Do not adopt the inconsistent printed DF>=10 as a fraction, or invent a tracer dose. Heated FTIR may evaporate entrained droplets and cannot reconstruct original vapour versus wet-droplet phase from cell H2O/IPA. Actual liquid/droplet/cloth-recovery and silver assays are not supplied by Method320; if such phase-specific/nested quantification is necessary and no complete applicable programme is established, retain that precise method hold and do not issue the dependent quantitative result. No route-wide hold is inferred merely from optional rows, and no future SOP or finite check waives a necessary gap. | `epa-ftir320-2019` |\n| v_full_context | all inventory rows | Collection stores raw records before division. aggregation_rule denotes the final single_quotient report basis, not another calculation inside the protocol. Unmeasured quantities must not produce fabricated unit results. |  |\n\n"
