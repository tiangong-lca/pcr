      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Finished unexposed HP5 polyester sheets received with complete upstream coating/drying/converting burdens and declared primary packing; actual supplementary utilities/articles received separately |\n| starting_condition_role | Whole-product upstream interface for a physical optical-exposure transformation |\n| product_classification_scope | Selected exposed/undeveloped sheet film within 38941; no blanket coverage of plates/paper/textiles and no 38942 developed terminal |\n| recursive_input_rule | Previously exposed undeveloped receipts are already made products with inherited history. They may receive actual incremental protection/rework service but never a new manufacture Q merely by receipt, reinspection, relabelling or shipment. Purchased unexposed sheets are the different-state input. |\n| upstream_dataset_requirement | Match each actual whole film, utility, chemical, article and asset to compatible provider boundaries; missing providers stay disclosed. Do not replace finished film by resin or silver chemicals, or a finished bag by guessed resin. |\n| disclosure | Declare site/period, selected operation chain, true external/internal gates, first release, later observed H, test boundary, inventories/inherited vectors, packaging pools, all actual inputs/exits and uncertainty. Manufacturer examples are not site measurements. |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_complete_route | p_latent | Include actual receipt, storage/conditioning, full-dark loading, controlled optical exposure, protective unloading/identification, integrity checks, cleaning, failures and protected first release. No onsite base/emulsion manufacturing is implied by the upstream film name. | `harman-hp5-2018`; `ilford-sheet-exposure-2018`; `cci-latent-image` |\n| b_state_gate | first_release | The sole reference is the complete polyester B&W latent sheet that has undergone the documented optical exposure and no chemical development. Do not test an accepted sheet by visible light inspection or infer a permanent visible silver image. Actual chemical testing is a separately complete test activity and its sample is excluded from Q. | `harman-hp5-2018`; `cci-latent-image` |\n| b_first_release | all inventories | Q counts each newly first-released sheet once, including same-cohort closing FG. Reinspection, customer return, redispatch and real rework retain original cohort and create no new Q. Preserve original deviation/failed-event facts even when later accepted. A proven erroneous original release requires an auditable correction to the complete cohort report, not deletion of its history. |  |\n| b_later_service | p_fg | Retain every actually performed later storage, protection, packing, handling, return inspection, rework and dispatch service in observed H, even with zero dispatch or FG still held. Attribute increments to original Qc; H is coverage, never another denominator. Paired first-release handoff is internal and cancels on combining manufacturing and FG physical gates. | `harman-sheet-transfer-2016` |\n| b_real_additions | all inventory rows | Add every actual unlisted supplied formulation, battery, fuel, refrigerant, transport service, test chemical, asset replacement, waste or measured molecular outlet as one separate qualified exchange. An absent card, authorisation, zero-output period or intended dry route never proves a real flow absent. Conditional rows become not_applicable only with operation evidence; unknown remains unknown. | `ilford-sheet-exposure-2018` |\n| b_chemistry_and_water | physical gates | Reconcile whole wet mass and relevant elements independently of microscopic latent chemistry. Do not infer multiple species, reaction water or silver loss from one total residual. Separate free water, actual phase transfer, bound/structural water and evidenced reaction water. COD/VOC are indicators rather than a named chemical mass. Natural moisture exchange is not automatically a defect or repair operation. | `cci-latent-image` |\n| b_packaging_pools | each actual packing article | For each actual article and each manufacture, later-service and combined gate, use the whole-wet equation O + P + I + ER + J_in + H2O_in = C + Sgross + EO + Wwhole + J_out + H2O_out. O/C contain all actual empty, attached raw/WIP/non-WIP/FG and reusable stocks. P is independent new external procurement; I is actual packing received contained in a whole supply or in a paired internal handoff, excluding P/ER; ER is external return received, Sgross is full article mass leaving with gross product dispatch or paired internal handoff, EO is a separate outward return to its owner, and Wwhole is the actual discarded whole wet article. J_in/out are real non-water material added/removed; H2O_in/out are real independent water uptake/loss, including natural humidity without repair. None is a fitted residual. Terms are nonoverlapping: water/material already inside O/P/I/ER/C/Sgross/EO/Wwhole stays nested there, never added again as J/H2O. Full contaminated Wwhole includes substrate, retained cleaner, film residue and water once; do not create separately exported retained contents. Paired internal I/Sgross cancel only at the combined gate. For an expanded diagnostic equation, add OTHER_in - X_in to the left and OTHER_out - X_out to the right of the same equation. X only removes an explicitly identified OTHER same-side representation already contained in that side's gross flow; 0 <= X <= the proven duplicate OTHER. X cannot subtract O/C, any real J/H2O increment, an opposite-side leg or a merely present card. Actual repair/refill materials and outward removed matter need their exact atomic cards if present; the symbols do not assert that repair or moisture occurs. Keep physical amounts, provider burden ownership and service allocations distinct; no new Q, coproduct or avoided product from return/reuse. | `harman-sheet-transfer-2016`; `ilford-sheet-exposure-2018` |\n| b_utilities_and_assets | all actual utilities and assets | No boiler/steam/air-compressor train is presumed. If actual heat/steam/heat-exchange water or condensate crosses the boundary, add each real Product leg with measured thermal state/enthalpy and supplier water-energy convention. Track full physical assets separately from allocated asset-service burdens; repeated use is not repeated physical procurement. | `ilcd-allocation-2010` |\n\n### Complete scope and reference qualification conditions\n\nThis method produces an identified physical latent-image article: purchased complete ILFORD HP5 PLUS black-and-white silver-gelatin negative sheet film on polyester support in the nominal 5x4-inch format, optically exposed, unloaded and protected in a black light-tight bag and a reusable sheet-film box, then first released while still chemically undeveloped. Manufacturer material guidance, documented 4x5 exposure practice and the historical HARMAN box/bag transfer configuration are compatible evidence for this technical synthesis; they do not identify one contemporary order or one factory. Actual cut contour, lot, packaging construction and release criteria must be collected. Sources: `harman-hp5-2018`; `ilford-sheet-exposure-2018`; `harman-sheet-transfer-2016`; `ilford-gelatine`; `cci-latent-image`.\n\nThe foreground starts at receipt of finished unexposed sheets with their upstream provider. It includes storage and any actual acclimatisation, dark loading, orientation/holder checks, metering and controlled optical exposure, closing and identifying the exposed holder, dark unloading, traceability/integrity checks and protected first handoff. The latent image is invisible: acceptance uses validated exposure-operation and chain-of-custody records, not an invented visible-image density test. Actual rejected attempts, start/stop, idle, cleaning, tests and rework remain in the inventory. Any real destructive quality test requires its complete actual test stage and atomic exchanges; it never turns the reference article into a developed negative.\n\nExclude base or emulsion manufacture from this exposure foreground; represent it once in the whole-film provider. Unexposed stock is an input, not the reference output. Developed negatives, motion-picture products, paper prints, instant/reversal/chromogenic routes, cameras, exposure equipment and creative/photographic-service functions are not this terminal. No developer, fixer, wash bath, steam boiler, compressed-air system or emission is assumed to exist. Actual additional operations and individual exchanges must nevertheless be included and applicability reassessed. No clinical or industrial-radiation operating parameters, universal exposure setting, storage lifetime, thickness/density, silver content, yield or operating intensity is prescribed.\n\nComplete reference-flow required qualifiers: actual site and reporting period; film manufacturer and exact lot; HP5 PLUS black-and-white silver-gelatin negative system; polyester sheet support and complete retained coatings; nominal 5x4-inch format and measured actual contour; net film mass and independent packaging tare at stated moisture; actual sheet count and lot-specific mass conversion if used; unexposed receipt and upstream whole-film provider boundary; holder identity and emulsion orientation; optical exposure event and actual validated settings; absence of chemical development on reference sheets; dark handling and protected traceable transfer; unique first-release event and cohort Q; raw WIP unused-non-WIP and FG inventories with inherited vectors; black-bag and reusable-box construction and reuse pools; individual cleaning chemical and supplied formulation; native utility geography voltage and supply route; actual asset configuration and measured use allocation; each real waste species receiver and treatment boundary; observed later-service interval H and original Qc; uncertainty missing data and deviations\n\n### Complete measurement, source and history conditions\n\nLock Q0,c = sum of independently weighed unique first-accepted whole-film events q0,j for original cohort c at its one declared protected undeveloped gate; Q, Qc and Q0,c denote this same denominator, not shipment or a current survivor mass. Preserve each event and its original moisture/composition. Partition all original accepted material once: Q0,c = Dnet0,c + Ronsite0,c + Lirreversible0,c + Tother0,c. Dnet0 is material remaining outside in disjoint net deliveries after actual matching returns; Ronsite0 includes all actual on-site accepted material in held FG, returns, quarantine, rework, tests or other accepted states; Lirreversible0 includes original material actually evaporated, damaged, consumed or discarded; Tother0 is another real disjoint terminal disposition, including actual downstream development outside this endpoint. These are material-origin portions on the original acceptance mass ledger, not gross repeated deliveries or restored survivor masses. Reconcile them to separate current wet physical masses by actual retained independent additions/uptake and removals, with original versus added material origins and phase/element bridges; never restore original lost water into a survivor while also entering that water in L. Pre-acceptance raw, WIP and truly unused non-WIP belong to physical stock and inherited-load accounts but not Q0. Keep accepted material within those physical locations identified separately. Raw/WIP/FG returns, retests, redispatch and loops never generate another event. A proved erroneous initial acceptance requires an auditable original-cohort correction, not a convenient new denominator. H is actual service coverage; no future development or image lifetime enters manufacture or new Q. A zero current-period release/dispatch does not erase a positive original Q0 or its service result; only genuinely zero/unknown original Q0 leaves raw loads/history with no unit result.\n\nMaintain three linked accounts: full physical stocks/transfers, inherited/newly incurred foreground and provider exchange vectors, and attributed original-cohort reports. Raw/WIP/non-WIP/FG/returned holdings have separate complete physical and burden histories. Opening own foreground/WIP history plus new work is carried once; a whole linked provider already containing that same production/test/packing/treatment history must not be added again as decomposed upstream work. Conversely a purchased article or paper gate never hides actual local manufacture, exposure, repair, conditioning, capture, testing or waste treatment. For a make/buy split, either link the genuine complete compatible provider and actual interfaces, or expand its real manufacture with all material/utility/loss/packing/transport interfaces and disjoint history. Preserve full actual transport/receipt and unexposed film support/emulsion/backing/coating manufacture in the upstream film provider; no resin/silver input proxy. Film, camera, holder and other device providers are independent of exposure service; no same manufacturer or SKU is required as an artificial gate.\n\nUse a configured fleet/service history for camera, holder, separately supplied lens/shutter, incident light meter, tripod, cable release, focusing loupe, light-tight loading tent, marking pen and actual cloth/tool fleet. Include each only when present and not already contained in a complete supplied configuration. Complete integrated configuration and separate procurement are mutually exclusive for the same item. Preserve original acquisition/receipt, full physical mass or actual native reference unit, opening/closing active/spare/repair/loan stock, returns, retirement, maintenance/replacement and performed use across all cohorts. Actual measured mass/area/count bridges convert compatible provider units; one item never equals one kg. Keep physical fleet balance separate from allocated service A; repeated use/dispatch does not repurchase the fleet. Same-article phase transitions, washing/refilling/repair and actual maintenance chemicals, electricity, parts and contaminated exits have distinct actual interfaces and own/provider histories once. Full retired article plus retained contents is one real waste load; nested components and service share do not shrink its physical receiver quantity. No default life, yield, use count, battery chemistry, pen refill or cleaning dose is supplied. If actual additional light sources, filters, cells, labels, tools or maintenance materials exist, add each specific atomic exchange and its complete provider/interface; an optional example never proves absence.\n\nFor each actually separate waste event t, retain receiver identity, Qt equal to the full as-transferred wet physical load, complete nested substrate/retained film/cleaner/water composition, collection/storage changes and actual complete treatment-provider interface. Separate liquid/cloth/film/packing rows apply only to material not already inside a mixed whole event. Determine the provider's full physical demand Ut = convert_actual(Qt, actual provider reference unit) using measured compatible mass/volume/state or actual batch interface, never an invented kg-to-item factor. Either use a genuine full treatment producer once or expand its real treatment, transport, utilities, residuals and emissions; include actual on-site pretreatment separately without repurchasing embedded work. Attribution is a different account: for every exchange e retain the full treatment vector Bt,e and original-cohort A_t,c,e plus other actual beneficiaries/unassigned portions; the portions are disjoint and sum to Bt,e. Use actual justified service drivers and original Q0,c for each A_t,c,e/Q0,c. Qt and Ut do not become the allocated share, and the full provider must not be charged again to each cohort. Prior treatment/service history and subsequent increments are distinguished once. Unknown assignment or provider unit bridge stays unresolved with full raw loads, not a smaller physical export or a zero treatment demand.\n\nConditional chemical rows do not establish that IPA cleaning, moisture exchange, liquid waste or an air emission actually occurs. Establish actual operation and outlet first; absence requires physical operation evidence, never deletion to avoid analysis. Whole protected-sheet mass, whole collected cleaning liquor and whole wet cloth/waste are weighed at their actual light-safe/closed receiver boundary with representative handling and independent tare. A whole wet export does not require inventing an elemental discharge, and nested analytes are not additional physical exports. A claim of IPA, water or silver content requires its actual selective matrix procedure, sampling/preservation, preparation/release or extraction, blanks/calibration, recovery and uncertainty; total VOC, COD, dry residue or cleaner loss is not species measurement. Ordinary unperformed calibration or site QA of a real applicable programme is distinct from an absent necessary programme. The existing optical exposure and protected release programme does not rely on destructive visible-image inspection of the reference sheet.\n\nWhere actual molecular IPA or water vapour to air is claimed, EPA Method320 (retained full 14January2019 Internet copy plus FTIR Protocol) is a concrete conditional IR-active vapour programme, not a PM/liquid method. Select actual targets and interferences, source screening and representative normal/abnormal/fugitive/bypass coverage; maintain actual material-compatible heated probe/filter/line/cell above relevant dewpoints, documented temperature/pressure/pathlength, leak checks, cell-volume/timing and actual wet/dry gas-flow basis. Quantitative water in §8.5.2 requires Protocol4.6 quantitative reference spectra, not a qualitative water interference spectrum. Obtain traceable standards, two or more concentrations in duplicate, CTS before/after, stability and concentration/path range; self-prepared two-concentration standards require the actual independent secondary verification. Include Protocol analytical regions, interference evaluation and uncertainty; initial validation follows §13/Method301 dynamic series of 12 spiked and 12 unspiked measurements, distinct from routine §8.6.2 QA spikes. Do not make the QA spike its own bias-correction factor. Retain actual standards, sampling train, spike/matrix loss checks and all collected condensate without assuming complete recovery. Integrate actual compatible concentration and measured flow/time/state once. In the original §9.2 printed tracer notation, keep the physical mixing fraction k = (tracer_spk - tracer_native)/(tracer_std - tracer_native); expected target concentration = k*Cstd + (1-k)*Cnative on one basis. Do not adopt the inconsistent printed DF>=10 as a fraction, or invent a tracer dose. Heated FTIR may evaporate entrained droplets and cannot reconstruct original vapour versus wet-droplet phase from cell H2O/IPA. Actual liquid/droplet/cloth-recovery and silver assays are not supplied by Method320; if such phase-specific/nested quantification is necessary and no complete applicable programme is established, retain that precise method hold and do not issue the dependent quantitative result. No route-wide hold is inferred merely from optional rows, and no future SOP or finite check waives a necessary gap.\n\nCollection stores raw records before division. aggregation_rule denotes the final single_quotient report basis, not another calculation inside the protocol. Unmeasured quantities must not produce fabricated unit results.\n\n### Complete applicability of individual inventory entries\n\n**unexposed_film**: Native whole unexposed photosensitive sheet family is integrated coating/drying, production mix at plant GLO, Mass/kg. Select actual purchased HP5 polyester silver-gelatin sheets, already fully coated and converted. Upstream provider must match this complete supply boundary; do not repurchase its base, silver salts, gelatin or protective coating. Independently record receipts, genuine raw-stock returns, WIP and unused sheets; negligible exposure mass change is not assumed.\n\n**electricity_latent**: Only actual CN grid-average user-side alternating current below 1 kV may use this Product UUID. Preserve consumption mix and supply losses; other voltage/geography/onsite generation requires a compatible distinct row. Native Net calorific value reference is MJ. Meter all actual loading/exposure lighting, storage/conditioning, ventilation, start/stop, idle, cleaning and failed/rework operations within this stage; no operating default.\n\n**water_latent**: Conditional Product tap water for actual cleaning or conditioning, never an assumed film-development wash. Native Mass/kg; no native grade, route or geography specification establishes a supplier match. Preserve the legacy source classification separately from physical identity. Measure actual mass or independent water density/state and distinguish contained water in a purchased formulation.\n\n**ipa_latent**: Conditional separately purchased isopropanol chemical at China production-mix plant gate. Native synonyms identify IPA/2-propanol; native CAS and assay are not specified. Verify actual formulation and supplier: this identity does not cover arbitrary proprietary cleaners or a ready-made aqueous preparation. Record the whole actual supplied chemical mass once with trace constituents as non-additive composition; any separately mixed water is its own input. Do not apply cleaner to film unless a real compatible operation exists.\n\n**wipe_latent**: Conditional dry unimpregnated woven cotton wiping cloth, Product production mix at plant, Mass/kg. Native cotton-fabric basename and woven-cloth synonyms are consistent; native raw-cotton classification and general seed-fibre text are disclosed defects, not proof of fibre or crop supply. Require actual woven cotton/provider evidence; do not bind blended, paper or prewetted wipes. Whole cloth once, actual retained cleaning liquid separately bridged.\n\n**camera_asset**: Native manufactured finished photographic camera Product family, production mix at plant, Mass/kg; no fixed configuration/grade/geography or item-to-mass factor. Use only the actual complete optical sheet-film camera configuration with independently measured net asset mass and documented lifetime/use evidence. Allocation of asset service is a burden dimension; physical procurement and retirement use full gross asset mass in a separate stock pool, not the allocated fraction. Separately supplied lens/lighting/tripod require their own actual rows if not contained in this supplied asset.\n\n**film_holder**: Record one actual complete holder with its dark slide as a supplied article, independently measured mass/configuration and actual use. No material, lifespan or UUID is presumed. Keep physical stock and service burden separate; a holder included in the camera supply is a contained subledger rather than another purchase.\n\n**bag_purchase**: Record one actual whole black light-tight bag as the supplied protective article. The historic configuration does not prove its polymer/board composition or current supplier. Do not bind raw plastic film or a non-reusable carton merely by name. Measure construction/tare and maintain its own empty/attached/reusable pool. Original protection contained in the whole-film provider or another whole supplied article retains its full physical receipt and non-additive composition subledger; its upstream burden remains owned by that original supply. Only actual independent additional procurement adds a separate provider burden. Reusing original protection does not repurchase it.\n\n**box_purchase**: Record one actual whole reusable light-tight box as the supplied protective article. The historic configuration does not prove its polymer/board composition or current supplier. Do not bind raw plastic film or a non-reusable carton merely by name. Measure construction/tare and maintain its own empty/attached/reusable pool. Original protection contained in the whole-film provider or another whole supplied article retains its full physical receipt and non-additive composition subledger; its upstream burden remains owned by that original supply. Only actual independent additional procurement adds a separate provider burden. Reusing original protection does not repurchase it.\n\n**tape_purchase**: Record the actual complete supplied masking tape including adhesive, used for identity marking. Supplier composition and quantity remain measured requirements; do not infer its backing material or add contained backing/adhesive again. Additional ink or separate label actually used needs its own atomic row. Original protection contained in the whole-film provider or another whole supplied article retains its full physical receipt and non-additive composition subledger; its upstream burden remains owned by that original supply. Only actual independent additional procurement adds a separate provider burden. Reusing original protection does not repurchase it.\n\n**lens_asset**: Use only this actual complete article when present and not contained in the camera or another whole configuration. Attribute service using actual procurement, configuration mass/reference unit and full original fleet history. Later use belongs to original Q0 and is disjoint from manufacture use, not another physical purchase. Ink inside a whole supplied pen is nested; an actual independent refill requires its own specific card. Full own/provider and retirement interfaces follow section5.\n\n**meter_asset**: Use only this actual complete article when present and not contained in the camera or another whole configuration. Attribute service using actual procurement, configuration mass/reference unit and full original fleet history. Later use belongs to original Q0 and is disjoint from manufacture use, not another physical purchase. Ink inside a whole supplied pen is nested; an actual independent refill requires its own specific card. Full own/provider and retirement interfaces follow section5.\n\n**tripod_asset**: Use only this actual complete article when present and not contained in the camera or another whole configuration. Attribute service using actual procurement, configuration mass/reference unit and full original fleet history. Later use belongs to original Q0 and is disjoint from manufacture use, not another physical purchase. Ink inside a whole supplied pen is nested; an actual independent refill requires its own specific card. Full own/provider and retirement interfaces follow section5.\n\n**cable_asset**: Use only this actual complete article when present and not contained in the camera or another whole configuration. Attribute service using actual procurement, configuration mass/reference unit and full original fleet history. Later use belongs to original Q0 and is disjoint from manufacture use, not another physical purchase. Ink inside a whole supplied pen is nested; an actual independent refill requires its own specific card. Full own/provider and retirement interfaces follow section5.\n\n**loupe_asset**: Use only this actual complete article when present and not contained in the camera or another whole configuration. Attribute service using actual procurement, configuration mass/reference unit and full original fleet history. Later use belongs to original Q0 and is disjoint from manufacture use, not another physical purchase. Ink inside a whole supplied pen is nested; an actual independent refill requires its own specific card. Full own/provider and retirement interfaces follow section5.\n\n**tent_asset**: Use only this actual complete article when present and not contained in the camera or another whole configuration. Attribute service using actual procurement, configuration mass/reference unit and full original fleet history. Later use belongs to original Q0 and is disjoint from manufacture use, not another physical purchase. Ink inside a whole supplied pen is nested; an actual independent refill requires its own specific card. Full own/provider and retirement interfaces follow section5.\n\n**pen_asset**: Use only this actual complete article when present and not contained in the camera or another whole configuration. Attribute service using actual procurement, configuration mass/reference unit and full original fleet history. Later use belongs to original Q0 and is disjoint from manufacture use, not another physical purchase. Ink inside a whole supplied pen is nested; an actual independent refill requires its own specific card. Full own/provider and retirement interfaces follow section5.\n\n**humidity_water_latent**: Conditional independently measured physical H2O uptake across the selected gate, with actual state/media and an unresolved resource UUID. Do not use an emission-to-air UUID as a resource. Unchanged bulk ventilation air is paired in a physical subledger; it is not inferred chemical consumption of N2/O2. Any real consumed/emitted species requires its own measured atomic exchange and compatible medium.\n\n**tape_internal_handoff**: Record the actual complete supplied masking tape including adhesive, used for identity marking. Supplier composition and quantity remain measured requirements; do not infer its backing material or add contained backing/adhesive again. Additional ink or separate label actually used needs its own atomic row. This leg records only the full physical article passed with first-released film to the FG stage; cancel its paired receipt and add no purchase, Q or coproduct. Articles still attached to closing WIP are stocks, not a handoff.\n\n**box_internal_handoff**: Record one actual whole reusable light-tight box as the supplied protective article. The historic configuration does not prove its polymer/board composition or current supplier. Do not bind raw plastic film or a non-reusable carton merely by name. Measure construction/tare and maintain its own empty/attached/reusable pool. This leg records only the full physical article passed with first-released film to the FG stage; cancel its paired receipt and add no purchase, Q or coproduct. Articles still attached to closing WIP are stocks, not a handoff.\n\n**bag_internal_handoff**: Record one actual whole black light-tight bag as the supplied protective article. The historic configuration does not prove its polymer/board composition or current supplier. Do not bind raw plastic film or a non-reusable carton merely by name. Measure construction/tare and maintain its own empty/attached/reusable pool. This leg records only the full physical article passed with first-released film to the FG stage; cancel its paired receipt and add no purchase, Q or coproduct. Articles still attached to closing WIP are stocks, not a handoff.\n\n**first_release**: Native Product family is exposed but undeveloped, finished/manufactured, production mix at plant, with Mass/kg and no declared grade or geographic limit. This card selects only the complete HP5 polyester B&W optical latent sheet: support, silver-gelatin layer and all retained coatings together. It does not authorize plate/paper/textile, unexposed or developed substitution. No native secondary conversion or chemical yield is supplied. This is the only functional reference row. Count newly accepted net sheet mass Q once; intact latent-state confirmation uses actual operation/identity records and does not chemically develop the accepted article.\n\n**unexposed_return**: Same complete unexposed sheet Product family as unexposed_film: integrated coating/drying route, global production mix at plant, Mass/kg. This is a genuine external return of unused unexposed sheets, recorded at full actual mass and original provider genealogy. It cannot represent WIP/FG stock correction, exposed rejects or presumed recovered raw chemicals.\