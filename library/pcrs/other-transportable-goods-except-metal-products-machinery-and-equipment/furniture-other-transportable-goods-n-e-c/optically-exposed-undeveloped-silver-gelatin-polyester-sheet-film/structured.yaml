    - rule_id: b_state_gate
      applies_to: "first_release"
      rule: "The sole reference is the complete polyester B&W latent sheet that has undergone the documented optical exposure and no chemical development. Do not test an accepted sheet by visible light inspection or infer a permanent visible silver image. Actual chemical testing is a separately complete test activity and its sample is excluded from Q."
