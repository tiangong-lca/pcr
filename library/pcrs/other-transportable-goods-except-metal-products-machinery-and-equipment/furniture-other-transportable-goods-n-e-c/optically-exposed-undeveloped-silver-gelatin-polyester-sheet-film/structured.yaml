  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert raw extensive records to each row native unit first; integrate only true rates. kWh × 3.6 = MJ. Same-lot independently measured net-film mass/actual count or actual-contour area may convert count/area, never nominal rectangle or camera count. Use same-substance independently measured density/state for real volume conversions; keep whole/preparation/component bridges disjoint."
      inputs:
        - cp_film
        - cp_release
        - cp_energy_latent
        - cp_energy_fg
        - cp_water_latent
        - cp_water_fg
        - cp_clean_latent
        - cp_clean_fg
        - cp_assets_latent
        - cp_assets_fg
        - cp_pack_latent
        - cp_pack_fg
        - cp_fg
        - cp_waste_latent
        - cp_waste_fg
        - cp_species_latent
        - cp_species_fg
      output: "converted raw extensive records"
      source_ids: []
    - id: match_manufacture
      applies_to: "all inventory rows"
      rule: "For every exchange dimension e, manufacturing A_e = B_open,e + U_e - B_close,e - T_other,e after conversion and justified attribution. Raw, WIP and genuinely unused non-WIP have separate physical stocks and inherited vectors. B_close excludes already released FG because Q includes it. T_other is a proven one-time transfer to another cohort/function, never a balancing plug. Retain actual failures, tests, zero output, idle, cleaning and rework; do not stock-correct an already net input again. B_open and B_close are inherited vectors of the unperformed stocks above; U is the newly incurred period exchange vector booked once. A genuine supplier return reverses its original burden once against the matching original receipt genealogy. This bookkeeping reversal neither scales down full physical return V nor creates an avoided-product credit."
      inputs:
        - convert_raw
        - cp_film
        - cp_release
        - cp_energy_latent
        - cp_energy_fg
        - cp_water_latent
        - cp_water_fg
        - cp_clean_latent
        - cp_clean_fg
        - cp_assets_latent
        - cp_assets_fg
        - cp_waste_latent
        - cp_waste_fg
      output: "manufacturing A_e for the first-release cohort"
      source_ids: []
    - id: match_service
      applies_to: "all inventory rows"
      rule: "For original cohort c and actually observed H: service A_e,c = opening unused/unassigned service vector + actual incremental service - closing genuinely unused/unassigned vector - proven independent transfer. Performed service is not subtracted because FG remains. Retain original Qc, history and all return/rework increments; H is not a divisor. Preserve original product burdens through delivery/reversal once without repurchasing them."
      inputs:
        - convert_raw
        - cp_fg
        - cp_energy_latent
        - cp_energy_fg
        - cp_water_latent
        - cp_water_fg
        - cp_clean_latent
        - cp_clean_fg
        - cp_assets_latent
        - cp_assets_fg
        - cp_pack_latent
        - cp_pack_fg
      output: "observed original-cohort service A_e,c"
      source_ids: []
    - id: select_gross
      applies_to: "all inventory rows"
      rule: "For physical-event reporting select full converted actual V_e on that precise incoming/outgoing leg and destination. Film returns/dispatch, packing, assets, wet waste and individual species remain independent of A, stock differences, consumption, economic shares and service shares. A gross event adds no second provider burden or credit. X may only remove another explicitly identified same-side flow already represented in V, never stock/opposite-side quantities or card presence."
      inputs:
        - convert_raw
        - cp_film
        - cp_fg
        - cp_pack_latent
        - cp_pack_fg
        - cp_assets_latent
        - cp_assets_fg
        - cp_waste_latent
        - cp_waste_fg
        - cp_species_latent
        - cp_species_fg
      output: "full physical V_e with one burden owner bridge"
      source_ids: []
    - id: single_quotient
      applies_to: "all inventory rows"
      rule: "The sole unit calculation is reported quantity = selected numerator / Qc once. Select manufacturing A_e, actual service A_e,c, or full physical V_e as separate labelled dimensions. Qc is the original unique newly first-released net film kg; first_release is 1 kg. Cards and collection aggregation reference this same calculated report with no further division. Qc=0 retains every real load/history for justified later attribution and yields no unit result."
      inputs:
        - match_manufacture
        - match_service
        - select_gross
        - cp_release
      output: "one per-reference report with distinct burden and physical dimensions"
      source_ids: []
    - id: physical_closure
      applies_to: "all inventory rows"
      rule: "Independently close manufacturing, FG and combined whole-wet physical gates and each relevant element: opening physical stock + actual external receipts = closing physical stock + actual external exits, with measured physical transformations F explicitly bridged by species/phase. F is not a burden share or a fitted missing mass. Cancel internal first_release/receipt and other paired handoffs; do not add Q plus its closing FG as two outputs. Asset/packing stocks remain separate pools; one mixed waste and non-additive originW cannot become fictitious separated outlets. Unresolved chemistry remains unresolved. Measured generation F+ and consumption F- for a species/phase enter their respective equation: opening + real inputs + F+ = closing + real outputs + F-. Internal chemical/phase conversion adds no net whole-wet mass; genuine external addition/removal is an actual exchange. F cannot fit unknown silver/water/gas quantities."
      inputs:
        - cp_film
        - cp_release
        - cp_fg
        - cp_pack_latent
        - cp_pack_fg
        - cp_assets_latent
        - cp_assets_fg
        - cp_water_latent
        - cp_water_fg
        - cp_clean_latent
        - cp_clean_fg
        - cp_waste_latent
        - cp_waste_fg
        - cp_species_latent
        - cp_species_fg
      output: "independent physical and element reconciliation with uncertainty"
      source_ids: []
    - id: original_fates
      applies_to: "first_release"
      rule: "Lock Q0,c = sum of independently weighed unique first-accepted whole-film events q0,j for original cohort c at its one declared protected undeveloped gate; Q, Qc and Q0,c denote this same denominator, not shipment or a current survivor mass. Preserve each event and its original moisture/composition. Partition all original accepted material once: Q0,c = Dnet0,c + Ronsite0,c + Lirreversible0,c + Tother0,c. Dnet0 is material remaining outside in disjoint net deliveries after actual matching returns; Ronsite0 includes all actual on-site accepted material in held FG, returns, quarantine, rework, tests or other accepted states; Lirreversible0 includes original material actually evaporated, damaged, consumed or discarded; Tother0 is another real disjoint terminal disposition, including actual downstream development outside this endpoint. These are material-origin portions on the original acceptance mass ledger, not gross repeated deliveries or restored survivor masses. Reconcile them to separate current wet physical masses by actual retained independent additions/uptake and removals, with original versus added material origins and phase/element bridges; never restore original lost water into a survivor while also entering that water in L. Pre-acceptance raw, WIP and truly unused non-WIP belong to physical stock and inherited-load accounts but not Q0. Keep accepted material within those physical locations identified separately. Raw/WIP/FG returns, retests, redispatch and loops never generate another event. A proved erroneous initial acceptance requires an auditable original-cohort correction, not a convenient new denominator. H is actual service coverage; no future development or image lifetime enters manufacture or new Q. A zero current-period release/dispatch does not erase a positive original Q0 or its service result; only genuinely zero/unknown original Q0 leaves raw loads/history with no unit result."
      inputs:
        - cp_release
        - cp_film
        - cp_fg
      output: "original Q0 and separate wet material-origin bridge"
      source_ids: []
    - id: whole_pack
      applies_to: "all inventory rows"
      rule: "For each actual article and each manufacture, later-service and combined gate, use the whole-wet equation O + P + I + ER + J_in + H2O_in = C + Sgross + EO + Wwhole + J_out + H2O_out. O/C contain all actual empty, attached raw/WIP/non-WIP/FG and reusable stocks. P is independent new external procurement; I is actual packing received contained in a whole supply or in a paired internal handoff, excluding P/ER; ER is external return received, Sgross is full article mass leaving with gross product dispatch or paired internal handoff, EO is a separate outward return to its owner, and Wwhole is the actual discarded whole wet article. J_in/out are real non-water material added/removed; H2O_in/out are real independent water uptake/loss, including natural humidity without repair. None is a fitted residual. Terms are nonoverlapping: water/material already inside O/P/I/ER/C/Sgross/EO/Wwhole stays nested there, never added again as J/H2O. Full contaminated Wwhole includes substrate, retained cleaner, film residue and water once; do not create separately exported retained contents. Paired internal I/Sgross cancel only at the combined gate. For an expanded diagnostic equation, add OTHER_in - X_in to the left and OTHER_out - X_out to the right of the same equation. X only removes an explicitly identified OTHER same-side representation already contained in that side's gross flow; 0 <= X <= the proven duplicate OTHER. X cannot subtract O/C, any real J/H2O increment, an opposite-side leg or a merely present card. Actual repair/refill materials and outward removed matter need their exact atomic cards if present; the symbols do not assert that repair or moisture occurs. Keep physical amounts, provider burden ownership and service allocations distinct; no new Q, coproduct or avoided product from return/reuse."
      inputs:
        - cp_pack_latent
        - cp_pack_fg
      output: "separate complete whole-wet packing pools"
      source_ids:
        - ilcd-allocation-2010
    - id: receiver_service
      applies_to: "all inventory rows"
      rule: "For each actually separate waste event t, retain receiver identity, Qt equal to the full as-transferred wet physical load, complete nested substrate/retained film/cleaner/water composition, collection/storage changes and actual complete treatment-provider interface. Separate liquid/cloth/film/packing rows apply only to material not already inside a mixed whole event. Determine the provider's full physical demand Ut = convert_actual(Qt, actual provider reference unit) using measured compatible mass/volume/state or actual batch interface, never an invented kg-to-item factor. Either use a genuine full treatment producer once or expand its real treatment, transport, utilities, residuals and emissions; include actual on-site pretreatment separately without repurchasing embedded work. Attribution is a different account: for every exchange e retain the full treatment vector Bt,e and original-cohort A_t,c,e plus other actual beneficiaries/unassigned portions; the portions are disjoint and sum to Bt,e. Use actual justified service drivers and original Q0,c for each A_t,c,e/Q0,c. Qt and Ut do not become the allocated share, and the full provider must not be charged again to each cohort. Prior treatment/service history and subsequent increments are distinguished once. Unknown assignment or provider unit bridge stays unresolved with full raw loads, not a smaller physical export or a zero treatment demand."
      inputs:
        - cp_waste_latent
        - cp_waste_fg
      output: "full Qt/Ut and disjoint A/Q0"
      source_ids:
        - ilcd-allocation-2010
    - id: fleet_service
      applies_to: "all inventory rows"
      rule: "Use a configured fleet/service history for camera, holder, separately supplied lens/shutter, incident light meter, tripod, cable release, focusing loupe, light-tight loading tent, marking pen and actual cloth/tool fleet. Include each only when present and not already contained in a complete supplied configuration. Complete integrated configuration and separate procurement are mutually exclusive for the same item. Preserve original acquisition/receipt, full physical mass or actual native reference unit, opening/closing active/spare/repair/loan stock, returns, retirement, maintenance/replacement and performed use across all cohorts. Actual measured mass/area/count bridges convert compatible provider units; one item never equals one kg. Keep physical fleet balance separate from allocated service A; repeated use/dispatch does not repurchase the fleet. Same-article phase transitions, washing/refilling/repair and actual maintenance chemicals, electricity, parts and contaminated exits have distinct actual interfaces and own/provider histories once. Full retired article plus retained contents is one real waste load; nested components and service share do not shrink its physical receiver quantity. No default life, yield, use count, battery chemistry, pen refill or cleaning dose is supplied. If actual additional light sources, filters, cells, labels, tools or maintenance materials exist, add each specific atomic exchange and its complete provider/interface; an optional example never proves absence."
      inputs:
        - cp_assets_latent
        - cp_assets_fg
        - cp_clean_latent
        - cp_clean_fg
      output: "full physical fleet and disjoint service A/Q0"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_state
      applies_to: "first_release"
      requirement: "Evidence the exact whole product and optical/undeveloped state with complete operation/identity records; do not substitute visible developed-negative tests or mere receipt authorisation."
      evidence: "film lot; exposure/holder logs; release/deviation record"
    - id: dq_measurement
      applies_to: "all inventory rows"
      requirement: "Retain calibrated raw unnormalised measurements, original units/state and uncertainty. Every real quantity is foreground-specific, with no source chart or generic default inserted as a measured value."
      evidence: "calibration; tare; original meter and weighing sheets; sample design"
    - id: dq_completeness
      applies_to: "whole route and all gates"
      requirement: "Cover complete actual production/campaign period and observed H, including all failed/zero-output/cleanup/rework events and per-flow inherited raw/WIP/non-WIP/FG vectors. Explain and retain every balance gap."
      evidence: "event genealogy; stock vectors; complete stage and physical ledgers"
    - id: dq_native
      applies_to: "all UUID-bearing rows"
      requirement: "Apply complete native names/synonyms/comments/CAS and every property restriction, type, supply route, form, geography and medium. Preserve official Chinese flow names. Native identity does not establish supplier technology, quantity, approval or composition."
      evidence: "complete native objects and exact property/unit chain; supplier comparison"
    - id: dq_sources
      applies_to: "method sources and provider evidence"
      requirement: "Distinguish manufacturer construction/practice, conceptual chemistry, allocation method and actual foreground measurements. Preserve historical editions and incompatible adjacent examples; no implication that all sources describe one factory or current SKU."
      evidence: "original context; applicability decision; dated provider/foreground records"
    - id: dq_waste
      applies_to: "actual physical outlets"
      requirement: "One whole wet waste or mutually exclusive measured components with a bridge; actual species/destinations and silver/other relevant-element evidence remain independent. No missing-flow repair by one multi-unknown residual."
      evidence: "weighing; composition/speciation; receiver; originW; balance uncertainty"
    - id: dq_allocation
      applies_to: "shared burdens"
      requirement: "Document exclusive/virtual subdivision, each determining physical relation and only genuinely residual common-gate market values with sensitivity. Never use allocated burden fractions to scale gross physical exits."
      evidence: "meter/use map; causal justification; same-state values; sensitivity"
validation_rules:
  - rule_id: v_terminal
    applies_to: "first_release"
    rule: "Verify one complete optically exposed yet chemically undeveloped polyester B&W sheet configuration; exact linked first_release Product and 1 kg basis. A latent image cannot be certified by directly inspecting a developed image on that same reference sheet."
    source_ids:
      - harman-hp5-2018
      - cci-latent-image
  - rule_id: v_native
    applies_to: "all inventory rows"
    rule: "Check full native restrictions and official Chinese display, exact property→unit-group→unit; no wrong media, formulation, route or grade substitution. Blank auxiliary identities remain concrete atomic names and tracked gaps."
    source_ids: []
  - rule_id: v_release_history
    applies_to: "manufacturing and FG"
    rule: "Verify unique Q, inherited stock vectors and original-cohort later H. Held closing FG remains within first-release Q; physical dispatch and returns cannot create a second output or delete actual failed-event history."
    source_ids: []
  - rule_id: v_normalize
    applies_to: "all inventory rows"
    rule: "Collection retains raw unnormalised quantities. Confirm convert_raw/attribution precede single_quotient, executed exactly once; all card amounts and aggregation reference that result. Qc=0 preserves loads and yields no unit result. Unknown or unsupported relationships are review-required, not passing results."
    source_ids: []
  - rule_id: v_physical
    applies_to: "all physical gates"
    rule: "Check independent whole-wet mass and relevant-element closure, actual species and phase/reaction-water evidence, internal cancellation, full gross V and legitimate same-side OTHER-flow X only. No fictitious species, generic density, stock-as-flow or balancing F."
    source_ids:
      - cci-latent-image
  - rule_id: v_pack
    applies_to: "each packing pool"
    rule: "Reconcile every bag/box/tape pool with opening/closing empty/attached/reusable stock, purchase, external-return receipts, gross-dispatch packing, outward returns and waste. No internal-reuse purchase, coproduct or net-film-Q inclusion."
    source_ids:
      - harman-sheet-transfer-2016
      - ilford-sheet-exposure-2018
  - rule_id: v_complete
    applies_to: "all actual stages"
    rule: "Compare the actual route with all included and conditional cards; add real omitted inputs/outputs and complete actual testing/treatment stages before a dataset is complete. No assumed steam/boiler/development, no actual-flow deletion to pass a checker, no success count hiding earlier failures."
    source_ids: []
  - rule_id: v_waste_allocation
    applies_to: "all waste and shared burden records"
    rule: "Check one actual mixed stream/provider or real segregated streams with non-additive originW, and the full allocation hierarchy. A sale alone cannot establish a credit or coproduct."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_q0_full
    applies_to: "all inventory rows"
    rule: "Lock Q0,c = sum of independently weighed unique first-accepted whole-film events q0,j for original cohort c at its one declared protected undeveloped gate; Q, Qc and Q0,c denote this same denominator, not shipment or a current survivor mass. Preserve each event and its original moisture/composition. Partition all original accepted material once: Q0,c = Dnet0,c + Ronsite0,c + Lirreversible0,c + Tother0,c. Dnet0 is material remaining outside in disjoint net deliveries after actual matching returns; Ronsite0 includes all actual on-site accepted material in held FG, returns, quarantine, rework, tests or other accepted states; Lirreversible0 includes original material actually evaporated, damaged, consumed or discarded; Tother0 is another real disjoint terminal disposition, including actual downstream development outside this endpoint. These are material-origin portions on the original acceptance mass ledger, not gross repeated deliveries or restored survivor masses. Reconcile them to separate current wet physical masses by actual retained independent additions/uptake and removals, with original versus added material origins and phase/element bridges; never restore original lost water into a survivor while also entering that water in L. Pre-acceptance raw, WIP and truly unused non-WIP belong to physical stock and inherited-load accounts but not Q0. Keep accepted material within those physical locations identified separately. Raw/WIP/FG returns, retests, redispatch and loops never generate another event. A proved erroneous initial acceptance requires an auditable original-cohort correction, not a convenient new denominator. H is actual service coverage; no future development or image lifetime enters manufacture or new Q. A zero current-period release/dispatch does not erase a positive original Q0 or its service result; only genuinely zero/unknown original Q0 leaves raw loads/history with no unit result."
    source_ids: []
  - rule_id: v_receiver_full
    applies_to: "all inventory rows"
    rule: "For each actually separate waste event t, retain receiver identity, Qt equal to the full as-transferred wet physical load, complete nested substrate/retained film/cleaner/water composition, collection/storage changes and actual complete treatment-provider interface. Separate liquid/cloth/film/packing rows apply only to material not already inside a mixed whole event. Determine the provider's full physical demand Ut = convert_actual(Qt, actual provider reference unit) using measured compatible mass/volume/state or actual batch interface, never an invented kg-to-item factor. Either use a genuine full treatment producer once or expand its real treatment, transport, utilities, residuals and emissions; include actual on-site pretreatment separately without repurchasing embedded work. Attribution is a different account: for every exchange e retain the full treatment vector Bt,e and original-cohort A_t,c,e plus other actual beneficiaries/unassigned portions; the portions are disjoint and sum to Bt,e. Use actual justified service drivers and original Q0,c for each A_t,c,e/Q0,c. Qt and Ut do not become the allocated share, and the full provider must not be charged again to each cohort. Prior treatment/service history and subsequent increments are distinguished once. Unknown assignment or provider unit bridge stays unresolved with full raw loads, not a smaller physical export or a zero treatment demand."
    source_ids: []
  - rule_id: v_fleet_full
    applies_to: "all inventory rows"
    rule: "Use a configured fleet/service history for camera, holder, separately supplied lens/shutter, incident light meter, tripod, cable release, focusing loupe, light-tight loading tent, marking pen and actual cloth/tool fleet. Include each only when present and not already contained in a complete supplied configuration. Complete integrated configuration and separate procurement are mutually exclusive for the same item. Preserve original acquisition/receipt, full physical mass or actual native reference unit, opening/closing active/spare/repair/loan stock, returns, retirement, maintenance/replacement and performed use across all cohorts. Actual measured mass/area/count bridges convert compatible provider units; one item never equals one kg. Keep physical fleet balance separate from allocated service A; repeated use/dispatch does not repurchase the fleet. Same-article phase transitions, washing/refilling/repair and actual maintenance chemicals, electricity, parts and contaminated exits have distinct actual interfaces and own/provider histories once. Full retired article plus retained contents is one real waste load; nested components and service share do not shrink its physical receiver quantity. No default life, yield, use count, battery chemistry, pen refill or cleaning dose is supplied. If actual additional light sources, filters, cells, labels, tools or maintenance materials exist, add each specific atomic exchange and its complete provider/interface; an optional example never proves absence."
    source_ids: []
  - rule_id: v_analytical_conditional
    applies_to: "all inventory rows"
    rule: "Conditional chemical rows do not establish that IPA cleaning, moisture exchange, liquid waste or an air emission actually occurs. Establish actual operation and outlet first; absence requires physical operation evidence, never deletion to avoid analysis. Whole protected-sheet mass, whole collected cleaning liquor and whole wet cloth/waste are weighed at their actual light-safe/closed receiver boundary with representative handling and independent tare. A whole wet export does not require inventing an elemental discharge, and nested analytes are not additional physical exports. A claim of IPA, water or silver content requires its actual selective matrix procedure, sampling/preservation, preparation/release or extraction, blanks/calibration, recovery and uncertainty; total VOC, COD, dry residue or cleaner loss is not species measurement. Ordinary unperformed calibration or site QA of a real applicable programme is distinct from an absent necessary programme. The existing optical exposure and protected release programme does not rely on destructive visible-image inspection of the reference sheet. Where actual molecular IPA or water vapour to air is claimed, EPA Method320 (retained full 14January2019 Internet copy plus FTIR Protocol) is a concrete conditional IR-active vapour programme, not a PM/liquid method. Select actual targets and interferences, source screening and representative normal/abnormal/fugitive/bypass coverage; maintain actual material-compatible heated probe/filter/line/cell above relevant dewpoints, documented temperature/pressure/pathlength, leak checks, cell-volume/timing and actual wet/dry gas-flow basis. Quantitative water in §8.5.2 requires Protocol4.6 quantitative reference spectra, not a qualitative water interference spectrum. Obtain traceable standards, two or more concentrations in duplicate, CTS before/after, stability and concentration/path range; self-prepared two-concentration standards require the actual independent secondary verification. Include Protocol analytical regions, interference evaluation and uncertainty; initial validation follows §13/Method301 dynamic series of 12 spiked and 12 unspiked measurements, distinct from routine §8.6.2 QA spikes. Do not make the QA spike its own bias-correction factor. Retain actual standards, sampling train, spike/matrix loss checks and all collected condensate without assuming complete recovery. Integrate actual compatible concentration and measured flow/time/state once. In the original §9.2 printed tracer notation, keep the physical mixing fraction k = (tracer_spk - tracer_native)/(tracer_std - tracer_native); expected target concentration = k*Cstd + (1-k)*Cnative on one basis. Do not adopt the inconsistent printed DF>=10 as a fraction, or invent a tracer dose. Heated FTIR may evaporate entrained droplets and cannot reconstruct original vapour versus wet-droplet phase from cell H2O/IPA. Actual liquid/droplet/cloth-recovery and silver assays are not supplied by Method320; if such phase-specific/nested quantification is necessary and no complete applicable programme is established, retain that precise method hold and do not issue the dependent quantitative result. No route-wide hold is inferred merely from optional rows, and no future SOP or finite check waives a necessary gap."
    source_ids:
      - epa-ftir320-2019
  - rule_id: v_full_context
    applies_to: "all inventory rows"
    rule: "Collection stores raw records before division. aggregation_rule denotes the final single_quotient report basis, not another calculation inside the protocol. Unmeasured quantities must not produce fabricated unit results."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual later chemical processing of the same declared latent film; full product systems with compatible state and boundary"
  allowed_use: "Apply after checking all physical configuration and native restrictions, actual first release, supplier/utility match, later-service coverage and uncertainty"
  excluded_use: "Universal all-38941 methodology; developed negatives/38942; unexposed material; paper images; cine; equipment; medical/industrial radiation instructions; creative-service equivalence"
