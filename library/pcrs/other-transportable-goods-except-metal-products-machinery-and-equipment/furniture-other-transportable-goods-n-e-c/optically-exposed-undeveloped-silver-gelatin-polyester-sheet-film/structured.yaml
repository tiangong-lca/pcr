      rule: "**waste_mixed_latent**: Only a real physically mixed collected stream to one receiver/provider. Independently measured originW for film/wipe/bag/box/tape is diagnostic and not an additional waste exchange. Segregated rows above apply only to quantities not already in this mixed stream; do not fabricate segregation to fill cards. Keep original stage/cohort and all failure/cleanup/rework loads, gross wet quantity, actual destination and treatment boundary. UUID unresolved; choose an exact compatible waste identity when constructing the dataset."
