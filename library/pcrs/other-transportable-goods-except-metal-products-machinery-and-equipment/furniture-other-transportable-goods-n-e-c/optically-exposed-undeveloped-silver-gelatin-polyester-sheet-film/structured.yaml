      frequency: "Every actual event or calibrated interval"
      temporal_coverage: "Complete production cohort/period and actual observed H; retain failed and zero-output operations"
      site_scope: "Actual declared site/provider and matched stage/cohort"
      aggregation_rule: "per reference flow"
