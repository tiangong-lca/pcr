      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_scope | all shared activities | Use this hierarchy only for an attributional study in which allocation is required. First separate exclusive operations and inputs by real or virtual subdivision, preserving their actual quantity and cohort. | `ilcd-allocation-2010` |\n| a_causality | remaining shared exchanges | Establish the determining physical causal relation for each exchange separately. Validate the actual occupancy/use/intensity relation for storage, lighting, cleaning and asset service; film mass or an exposure count is not a universal driver. Different exchanges can require different drivers. | `ilcd-allocation-2010` |\n| a_residual | genuinely remaining multifunctionality | Only after justified failure of subdivision and determining physical causality, allocate the remaining burden using actual contemporaneous quantities and market values at the common process gate in the same supplied state. Correct downstream packing/transport/processing differences explicitly. Retain sensitivity and uncertainty; no fixed shares or arbitrary choice between physical and economic allocation. | `ilcd-allocation-2010` |\n| a_waste | all real residuals | A sale or silver-recovery potential does not automatically create a coproduct or avoided-product credit. Keep one actual mixed-waste outlet and provider when physically mixed; independently measured originW shares are non-additive diagnostics. Separate providers only for genuinely segregated waste. Retain failed-test and rejected-sheet burdens. | `ilcd-allocation-2010` |\n\n"
