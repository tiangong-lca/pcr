      collection_method: "Measure complete sheet net mass without unwanted light exposure using a calibrated balance and independent actual protection tare; reconcile lot records and stock movement. Preserve separate constituent analyses as non-additive. Never apply inventory correction twice to already net issues. Follow the complete section5 original-cohort and own/provider-history requirements, retaining real procedure/matrix and evidence for conditional absence; an unknown necessary method supplies no dependent quantity."
