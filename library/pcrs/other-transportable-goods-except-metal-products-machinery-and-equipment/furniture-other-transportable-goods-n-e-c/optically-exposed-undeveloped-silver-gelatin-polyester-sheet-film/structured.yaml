    - rule_id: system_boundary_rule_110
      applies_to: "foreground_system_boundary"
      rule: "For an actual necessary FTIR vapour claim, retain the complete EPA Method301 4August2017 Internet copy alongside Method320. Its actual sections5–7 cover traceable reference materials, real sampling design and sample stability; sections8–12 and Tables1–3 supply bias/precision and independent replicate accounting. Method320 section13 cites older Method301 section numbers that do not identify the same sections in the retained2017 edition. Do not claim that an old number proves the current procedure. In the actual2017 analyte-spike design, six quadruplet sets contain two spiked and two unspiked observations each: the six independent set differences, rather than24 individual observations, give n=6 and five degrees of freedom for the corresponding bias test. A sequential FTIR series does not establish simultaneous independent quadruplets merely by having24 readings; preserve actual timing, drift, pairing and the justified adapted statistical design. Use the actual same-basis mixing fraction and independently known expected target concentration above, with blank, uncertainty and recovery evidence, not the routine QA spike as its own correction. Preserve the2017 section12 printed VS label referring to a validated-method mean; a spike-only study does not thereby acquire a validated comparator. Document the actual applicable analysis, independent reference, predeclared criteria and any dimensional/version adaptation; if that required bridge is not established, withhold the affected quantitative claim. The retained301 source does not supply a missing IPA/liquid/cloth/silver preparation, certify the selected workroom, or establish present regulatory approval. Sources: epa-ftir301-2017; epa-ftir320-2019."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Finished unexposed HP5 polyester sheets received with complete upstream coating/drying/converting burdens and declared primary packing; actual supplementary utilities/articles received separately"
  starting_condition_role: "Whole-product upstream interface for a physical optical-exposure transformation"
  product_classification_scope: "Selected exposed/undeveloped sheet film within 38941; no blanket coverage of plates/paper/textiles and no 38942 developed terminal"
  recursive_input_rule: "Previously exposed undeveloped receipts are already made products with inherited history. They may receive actual incremental protection/rework service but never a new manufacture Q merely by receipt, reinspection, relabelling or shipment. Purchased unexposed sheets are the different-state input."
  upstream_dataset_requirement: "Match each actual whole film, utility, chemical, article and asset to compatible provider boundaries; missing providers stay disclosed. Do not replace finished film by resin or silver chemicals, or a finished bag by guessed resin."
  disclosure: "Declare site/period, selected operation chain, true external/internal gates, first release, later observed H, test boundary, inventories/inherited vectors, packaging pools, all actual inputs/exits and uncertainty. Manufacturer examples are not site measurements."
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Photographic plates, film, paper, paperboard and textiles, exposed but not developed"
    uuid: "4113ce49-7177-4962-bd17-cb44324dadab"
  flow_property_ref:
    uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
  unit_group_ref:
    uuid: "93a60a57-a4c8-11da-a746-0800200c9a66"
  reference_unit: "kg"
  required_qualifiers:
    - "actual site and reporting period"
    - "film manufacturer and exact lot"
    - "HP5 PLUS black-and-white silver-gelatin negative system"
    - "polyester sheet support and complete retained coatings"
    - "nominal 5x4-inch format and measured actual contour"
    - "net film mass and independent packaging tare at stated moisture"
    - "actual sheet count and lot-specific mass conversion if used"
    - "unexposed receipt and upstream whole-film provider boundary"
    - "holder identity and emulsion orientation"
    - "optical exposure event and actual validated settings"
    - "absence of chemical development on reference sheets"
    - "dark handling and protected traceable transfer"
    - "unique first-release event and cohort Q"
    - "raw WIP unused-non-WIP and FG inventories with inherited vectors"
    - "black-bag and reusable-box construction and reuse pools"
    - "individual cleaning chemical and supplied formulation"
    - "native utility geography voltage and supply route"
    - "actual asset configuration and measured use allocation"
    - "each real waste species receiver and treatment boundary"
    - "observed later-service interval H and original Qc"
    - "uncertainty missing data and deviations"
reference_flows:
  []
measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the independently measured net whole-film mass newly first released in a cohort. Use a calibrated balance under total-dark conditions or a validated sealed-light-tight weighing method with independently measured actual bag/box/label tare. Keep actual moisture and complete support/emulsion/protective layers; do not add contained constituents again. Closing FG already belongs to Q."
  - id: measured_conversion
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert count or actual film area only with independently weighed same-lot whole-sheet net mass per counted sheet or measured actual-contour area. Record sample design and uncertainty. Nominal enclosing rectangle, camera count, native secondary coefficient, assumed thickness/density or silver content cannot establish mass. Integrated gas/liquid volume uses independently measured same-substance state density; only a true rate is integrated over time."
  - id: energy_conversion
    applies_to: "electricity_latent; electricity_fg"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Metered kWh × 3.6 gives MJ once before allocation. This electricity property is an energy basis; it does not imply combustion, heating value per kg or a steam input. Match actual grid region, delivery voltage and included losses."
  - id: whole_supply
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "A purchased whole film, finished bag, box, tape or cleaning preparation is purchased once. Assay, carrier water and contained base/emulsion are non-additive subledgers. For actual in-house mixture preparation record each independently purchased ingredient and actual utilities/losses; bridge whole-preparation versus component reporting mutually exclusively."
process_map:
  - id: p_latent
    name: "Whole-film receipt through protected latent first release"
    inclusion: "required"
    inclusion_condition: "All selected product cohorts; retain each actual unit operation and conditional exchange"
    role: "physical latent-product manufacture"
    quantitative_reference: "1 kg reference flow at unique first release"
  - id: p_fg
    name: "Actual later protection and gross film movement"
    inclusion: "conditional"
    inclusion_condition: "Whenever actual storage/packing/handling/return/rework/dispatch occurs after first release within declared H"
    role: "original-cohort service and physical ledger"
    quantitative_reference: "per reference flow using original Qc; H is not a denominator"
