      rule: "**ipa_air_latent**: Conditional actual isopropanol molecule released to air, unspecified subcompartment, CAS 67-63-0, Elementary flow Mass/kg. Long native synonyms include legacy anomalous names; adopt only IPA consistent with decisive basename/CAS, not those other substances. Independently quantify emitted IPA and retained/recovered IPA; total VOC or missing cleaner mass is not sufficient speciation."
