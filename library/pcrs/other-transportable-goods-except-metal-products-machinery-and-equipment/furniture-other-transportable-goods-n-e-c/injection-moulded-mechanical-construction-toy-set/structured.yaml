boundary_abstraction:
  declared_starting_condition: "Complete actual thermoplastic pellet formulations and identified separately finished component supplies at receiving gate"
  starting_condition_role: "Raw formulation/component receipt for complete remaining whole-set manufacture"
  product_classification_scope: "Mechanical plastic construction-set subset of CPC38540; broader train/scale-kit scope is not automatically covered"
  recursive_input_rule: "Start with actual complete resin formulations and the declared separately completed component supplies; include every remaining operation through complete set release. Supplier-completed components replace only their own upstream/local operations. One supplied formulation/article is acquired once; its pigment, solvent, carrier water, liner or thread is a nonadditive constituent ledger. Real on-site formulation uses each genuine purchased material plus mixing energy/loss instead. Reconcile overlapping whole/component bridges and cancel internal transfers; never recursively buy a completed whole set to replace manufacture."
  upstream_dataset_requirement: "Match actual whole formulations, supplied article state/material/route/geography and one provider owner for each real purchase; unresolved links remain explicit. Supplied raw resin synthesis is upstream, not repeated foreground monomer production."
  disclosure: "Complete terminal/BOM and starting supply state; all actual stages/failures; release versus service; wet physical stocks and inherited vectors; unit conversions; provider/identity gaps"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Toy electric trains and tracks, signals and other accessories therefor, reduced-size (\"scale\") model assembly kits and other construction sets and constructional toys"
    uuid: "2bd3de2a-c26e-4e9b-a00e-f1ec12763eea"
  flow_property_ref:
    uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
  unit_group_ref:
    uuid: "93a60a57-a4c8-11da-a746-0800200c9a66"
  reference_unit: "kg"
  required_qualifiers:
    - "complete set configuration and required element counts"
    - "actual material/grade per element and make/buy state"
    - "complete supplied formulation and moisture"
    - "actual moulding/decoration/component assembly route"
    - "paper instruction inclusion and net-content boundary"
    - "explicit excluded electrical functions"
    - "supplier site and upstream boundary"
    - "unique first-release identity/time and actual acceptance specification/tests"
    - "calibrated complete net masses and packaging tare"
    - "raw/WIP/non-WIP inherited exchange vectors"
    - "actual wet stocks and gross physical events"
    - "packaging pools and upstream ownership"
    - "original-cohort Q_H and observed service horizon H"
    - "actual provider/native restrictions and unresolved identities"
reference_flows:
  []
measurement_rules:
  - id: first_release_mass
    applies_to: "finished_release"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the calibrated sum of complete set net content masses at unique first release; retain all configured play contents and functional printed instructions, actual retained ink/moisture once, tare out every sales/transport package and reject. No catalogue count-to-mass assumption."
  - id: native_quantities
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual per-card native extensive property"
      uuid: ""
    required_unit: "Native kg or MJ or m3 per card"
    rule: "Mass does not replace energy/volume. Convert source units once with independently evidenced state-specific density/assay; integrate actual rates only, not already integrated volumes. No secondary-coefficient density or nominal set/machine mass."
  - id: single_denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Per-card native property"
      uuid: ""
    required_unit: "Native numerator unit per kg reference product"
    rule: "Collect raw numerators undivided; section8 owns the only quotient. Burden A/A_H and gross physical V/V_H are different channels; card/aggregation basis cites that same single result, without another division, stock correction or physical allocation. Q or Q_H=0 retains loads without unit result."
process_map:
  - id: make
    name: "Complete set manufacture"
    inclusion: "required"
    inclusion_condition: "Actual feed-to-whole-set first release"
    role: "foreground"
    quantitative_reference: "1 kg first-released complete set net contents"
  - id: pack
    name: "Packaging pools across first release"
    inclusion: "conditional"
    inclusion_condition: "Each actual packaging event before or after release, with explicit event phase"
    role: "foreground"
    quantitative_reference: "Before release per kg manufacturing Q; after release per kg original Q_H"
  - id: service
    name: "Original-cohort actual gate services"
    inclusion: "conditional"
    inclusion_condition: "Actually performed during observed H after first release"
    role: "foreground"
    quantitative_reference: "Per kg original first-release Q_H; no new Q"
