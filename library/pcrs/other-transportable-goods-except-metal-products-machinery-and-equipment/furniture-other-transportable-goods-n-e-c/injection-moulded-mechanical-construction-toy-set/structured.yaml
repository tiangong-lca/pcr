allocation_rules:
  - rule_id: a_scope
    applies_to: "all inventory rows"
    rule: "This section applies only to attributional multifunctionality where allocation is required; the physical gross ledger remains independent of burden attribution."
    source_ids:
      - ilcd-2010-attributional
  - rule_id: a_framework
    applies_to: "all inventory rows"
    rule: "Use this method only for an explicitly attributional study in which allocation is the applicable multifunctionality route. Identify actual products/functions and exchange ownership; industrial manufacturer evidence does not establish LCA allocation. Do not freely choose between economic and physical rules or impose percentages, substitution or automatic avoided-product credits."
    source_ids:
      - ilcd-2010-attributional
  - rule_id: a_subdivide
    applies_to: "all inventory rows"
    rule: "First collect dedicated element/line/decoration/assembly/utility work separately and apply real or virtual subdivision as far as physically justified. For each remaining indivisible exchange identify a determining physical causal relationship to the actual cofunctions, supported by metering/engineering evidence and actual configuration. Mass, count, cycle or machine time is not automatically causal for every exchange; explain the actual determinant and conserved burden vector."
    source_ids:
      - ilcd-2010-attributional
  - rule_id: a_residual
    applies_to: "all inventory rows"
    rule: "Only the genuinely unresolved remaining burden uses contemporaneous specific market values of actual co-products in their actual state and at the same shared process gate, with quantities/currency/time/quality and any downstream-state back-adjustment documented. Retain sensitivity and uncertainty when values are unknown; no fixed fallback share. Gross physical quantities never inherit allocation shares. Ordinary scrap/reject/sample/waste sale or external treatment does not automatically deduct production/treatment load; T_other requires a real independent function/cohort and one justified vector handover."
    source_ids:
      - ilcd-2010-attributional
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "make"
      flow_role: "Complete set first release"
      record_type: "foreground_record"
      raw_fields: "set id; configuration; element counts; component make/buy; instructions state; net contents mass; actual retained film/water; package tare; calibration; unique release time; tests; rejected/failed dispositions; original Q_H"
      collection_method: "Weigh each complete accepted set contents on a calibrated scale, or trace actual content weights/configuration and separately measured package tares to the same complete released sets. Verify complete required contents and real tests. Retain raw set masses and unique release events; no predivision or invented count-to-mass conversion."
      unit: "kg"
      frequency: "Each actual event and closing reconciliation"
      temporal_coverage: "Complete declared cohort including Q0; observed original-cohort H"
      site_scope: "Actual supplier/manufacturing/service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw signed records; calibration; independent reconciliation; actual state/identity and explicit unknowns"
    - protocol_id: cp_make
      process_id: "make"
      flow_role: "All manufacture exchanges and inherited vectors"
      record_type: "foreground_record"
      raw_fields: "row id; event; material/component batch; mould/cavity/machine; stage; configuration; raw source unit; rate/integrated flag; actual T/P/phase; assay/density; full receipts/uses/exits; opening/closing raw/WIP/non-WIP; each inherited exchange vector; stock-corrected flag; provider owner; failure/idle/cleanup/test/rework; separate molecule and element data"
      collection_method: "Collect undivided native extensive records by actual stage and atomic flow using calibrated scales/meters, supplier BOM/SDS and independent assays. Measure wet stocks and gas/water phases independently; trace upstream and internal WIP without repeating purchases. Preserve actual unlisted atoms and failed/Q0 activity; real unknowns stay missing."
      unit: "native extensive unit per row"
      frequency: "Each actual event and closing reconciliation"
      temporal_coverage: "Complete declared cohort including Q0; observed original-cohort H"
      site_scope: "Actual supplier/manufacturing/service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw signed records; calibration; independent reconciliation; actual state/identity and explicit unknowns"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "Observed original-cohort service"
      record_type: "foreground_record"
      raw_fields: "row id; original cohort; Q_H; H; actual A_H/V_H; opening/closing released FG; history and inherited vectors; gross dispatch/returns; actual net contents changes; humidity; permission; postwork tests; acceptance; hold/waste disposition; supplier heat/water mass/phase/T/P/enthalpy and ownership"
      collection_method: "Measure every actually performed event, including unauthorised/failed work and natural storage moisture exchange. Bind real returns and actual increments to original unique release; do not assume return equals old delivery or repeat manufacturing. Preserve performed service for held FG; future H is unknown."
      unit: "native extensive unit per row"
      frequency: "Each actual event and closing reconciliation"
      temporal_coverage: "Complete declared cohort including Q0; observed original-cohort H"
      site_scope: "Actual supplier/manufacturing/service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw signed records; calibration; independent reconciliation; actual state/identity and explicit unknowns"
    - protocol_id: cp_pack
      process_id: "pack"
      flow_role: "Concrete packaging six-direction pools"
      record_type: "foreground_record"
      raw_fields: "pool; event_phase before/after first release; manufacturing Q or original Q_H; actual article/formulation; material; upstream owner; P; I; ER; gross S; EO; W; full wet empty/attachedWIP/attachedFG/reusable opening/closing; repair/new-old parts; natural/operational water; same-side X_in/X_out; whole/component bridge; independent originW if mixed; original Q_H; H"
      collection_method: "Measure each actual pool/event independently with calibrated wet weights/tares and supplier ownership. Trace pre-release physical V to manufacturing Q and the one manufacture burden vector A; trace post-release V_H to original Q_H/H and one service vector A_H, never both. Close all six actual directions; absent events require evidence, not invented flows. Whole bag/liner/thread or wet preparation once. X only deduplicates OTHER same-side terms; never cancel retained new ingress or full wet stocks. If only mixed waste exists, independently measure originW without adding both origins and total or multiplying providers."
      unit: "kg"
      frequency: "Each actual event and closing reconciliation"
      temporal_coverage: "Complete declared cohort including Q0; observed original-cohort H"
      site_scope: "Actual supplier/manufacturing/service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw signed records; calibration; independent reconciliation; actual state/identity and explicit unknowns"
    - protocol_id: cp_assets
      process_id: "make"
      flow_role: "Physical assets parts fluids and use-service burden"
      record_type: "foreground_record"
      raw_fields: "asset id; complete new/used receipts; gross physical transfers; actual installed/removed parts; each fluid state and native quantity; full wet opening/closing; inherited vector stock; actual service draw; genuinely unused/unassigned charge; causal determinant; actual period/cohort; same-side X_in/X_out"
      collection_method: "Collect full physical receipts/exports and stock independently from service burden. Reconcile whole machine/mould versus disjoint parts/fluids; retained new input and complete wet closing mass remain. Use actual measured volume/density for fluid mass, no assumed life or unit asset weight. Justify actual exchange-specific service vector draw; do not buy whole stock per kg."
      unit: "native extensive unit per row"
      frequency: "Each actual event and closing reconciliation"
      temporal_coverage: "Complete declared cohort including Q0; observed original-cohort H"
      site_scope: "Actual supplier/manufacturing/service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw signed records; calibration; independent reconciliation; actual state/identity and explicit unknowns"
    - protocol_id: cp_actual_asset_service
      process_id: "make"
      flow_role: "machine_fulfilled_service; mould_fulfilled_service; cloth_fulfilled_service"
      record_type: "actual physical fleet and fulfilled service records"
      raw_fields: "asset/configuration; original_cohort/Q0; H; actual_start/end; duty/capacity; provider_unit/vector; opening/closing_wet_fleet; new/used/return/retire; included_parts/fluids; own_history; uncertainty"
      collection_method: "Measure actual timed service and independently conserve full new/used physical fleet and wet installed stocks; link a real compatible capacity/provider history once, with no assumed lifetime or current procurement. Unknown conversion remains unresolved; retain all failed/zero-output/performed service and original cohort. Use the sole saved a without another division."
      unit: "h"
      frequency: "each actual use/event and stock close"
      temporal_coverage: "full original histories and observedH"
      site_scope: "actual installed and provider boundaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "raw use and capacity logs; calibration; actual provider; physical fleet/charge bridge; disjoint vector ownership"
  calculation_rules:
    - id: attributable_raw
      applies_to: "all inventory rows"
      rule: "For burden-bearing manufacturing dimensions only, after source-unit conversion and justified exchange-specific attribution: A = B_open + U - B_close - T_other. B_close is limited by b_stocks; already-stock-corrected consumption is not corrected again. T_other requires a real independent function/cohort and one justified vector transfer, never ordinary waste/reject/sample sale or external disposal. Gross V never uses this stock equation."
      inputs:
        - B_open
        - U
        - B_close
        - T_other
        - cp_make
        - cp_assets
      output: "A"
      source_ids:
        - ilcd-2010-attributional
    - id: service_raw
      applies_to: "all inventory rows"
      rule: "A_H is the actual incremental service vector already performed for original cohort Q_H during observed H, including correctly inherited service draw and real failed work/treatment after justified exchange-specific attribution. Carry only truly unused/unassigned service/charge, not already performed held-FG service. Full gross V_H is independent, not stock-corrected or burden-scaled."
      inputs:
        - cp_service
        - cp_pack
        - Q_H
        - H
      output: "A_H"
      source_ids:
        - ilcd-2010-attributional
    - id: single_quotient
      applies_to: "all inventory rows"
      rule: "Exactly once: a = N / D. For manufacture burden N=A and D=Q. For manufacture physical gross cards N=the complete actual gross leg V and D=Q. For post-release service burden N=A_H and D=original Q_H. For post-release physical gross cards N=the complete actual gross leg V_H and D=original Q_H. Retain each native numerator unit per kg. Card/aggregation labels only cite this same a; no subsequent division, stock correction, allocation of gross mass, second purchase/provider charge or automatic credit. D=0 retains actual data without unit result."
      inputs:
        - N
        - D
        - cp_release
        - cp_make
        - cp_service
        - cp_pack
        - cp_assets
      output: "a"
      source_ids:
        - ilcd-2010-attributional
    - id: gross_pack_balance
      applies_to: "all inventory rows"
      rule: "For each pool: opening + P + I + ER + CP_in = closing + gross S + EO + W + CP_out, at actual full wet states. CP contains only real disjoint component/natural or operational water changes. X_in/X_out removes overlap only with OTHER same-side incoming/outgoing terms, never new ingress retained in stocks or full closing mass. Whole wet article and constituents, or mixed total and originW, are not additive. No internal reuse acquisition or credit."
      inputs:
        - P
        - I
        - ER
        - S
        - EO
        - W
        - CP_in
        - CP_out
        - cp_pack
      output: "closed_pool_ledger"
      source_ids:
        - ilcd-2010-attributional
  data_quality_requirements:
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Complete actual set and route, every atom/card field/description/native restriction, source link and normative context; all failure/zero-output and inherited vectors; no unknown as zero or method approval."
      evidence: "Actual BOM, supplier state, stage logs, tests and independent ledgers"
    - id: dq_uncertainty
      applies_to: "all inventory rows"
      requirement: "Disclose actual configuration/site/time representativeness, native/provider/auxiliary gaps, conversion/measurement uncertainty, allocation evidence/sensitivity and observed versus unobserved service H. Technical synthesis is not one factory inventory."
      evidence: "Calibrations, complete originals, component/whole bridges and explicit missing fields"
validation_rules:
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Verify the complete set endpoint, actual full element counts/configuration, functional instructions boundary, actual moulding/decoration/assembly and make/buy route, current actual specification and tests. A whole construction-toy family can be narrowed only with positive complete-product context; a hard material/form/route/CAS/type/media conflict cannot be waived by a similar name/classification. Each adopted native restriction belongs to the consuming card. No invented age/strength/lifetime/certificate or process defaults."
    source_ids:
      - lego-whole-set-process
      - lego-material-purpose
      - lego-profile-manufacturing
      - un-cpc3-38540-scope
  - rule_id: v_accounting
    applies_to: "all inventory rows"
    rule: "Verify unique first Q, complete net toy/instructions mass versus excluded packaging, all failure/Q=0 loads, each raw/WIP/non-WIP inheritance vector, independent manufacturing/FG/consolidated physical gates and observed original-cohort service. Inspect every packaging six-direction card and actual mixed originW relation, all wet stocks, repair materials/fluids, natural humidity, actual species and provider/carrier ownership. No stock, economic share or burden allocation can shrink a gross physical card."
    source_ids:
      - ifc-plastic-products-2007
      - ilcd-2010-attributional
  - rule_id: v_units
    applies_to: "all inventory rows"
    rule: "Verify each native extensive property and exact support chain before modelling. Do not apply Mass/kg rules to MJ or m3. Rates require actual time integration; already integrated volume does not. Density/assay/geometry and moisture need independent state-specific measurements. No secondary flow coefficient or nominal toy/asset weight supplies conversion. Collect raw numerators undivided, perform source conversions and real attribution, then execute one single_quotient result only. Unknown actual conversion or method remains unresolved."
    source_ids:
      - ilcd-2010-attributional
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Specified complete-set first-release manufacturing inventory with separately disclosed actually observed original-cohort gate services"
  allowed_use: "Attributional modelling after actual applicability, complete inventories and quality verification"
  excluded_use: "Whole classification coverage, electric train/vehicle extrapolation, resin/loose-part proxy, play-equivalence or lifetime comparison, unevidenced factory numbers, net delivery without full reversal bridge, automatic credit or approval"
  required_metadata: "complete set configuration and required element counts; actual material/grade per element and make/buy state; complete supplied formulation and moisture; actual moulding/decoration/component assembly route; paper instruction inclusion and net-content boundary; explicit excluded electrical functions; supplier site and upstream boundary; unique first-release identity/time and actual acceptance specification/tests; calibrated complete net masses and packaging tare; raw/WIP/non-WIP inherited exchange vectors; actual wet stocks and gross physical events; packaging pools and upstream ownership; original-cohort Q_H and observed service horizon H; actual provider/native restrictions and unresolved identities"
  required_quality_disclosure: "Actual source and native/provider compatibility, all unresolved identities/quantities, separate physical/burden/stock ledgers, measurement uncertainty, first release and observed service H"
  update_trigger: "Changed complete set structure/material, supplied formulation/component state, principal forming/decorating route, native constraints/geography/provider, acceptance specification, new atomic event or revised evidence"
