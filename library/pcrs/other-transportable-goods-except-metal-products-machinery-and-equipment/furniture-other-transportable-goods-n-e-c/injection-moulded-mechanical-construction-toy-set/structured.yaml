      rule: "Product flow of a finished manufactured construction-toy family, production mix at plant. Its native context includes toy vehicles, vehicle accessories, non-electric toy motors/steam engines, recreational scale models, kits and construction sets/building blocks, but excludes electric toy motors. Here it represents ONLY one complete configured mechanical plastic construction set: every required play element, actual assembled subcomponent, retained decoration and supplied functional paper instructions, uniquely first released. A resin, loose spare brick, mould, train component or purchased whole set used merely for repacking cannot occupy this reference role. No CAS, polymer recipe, grade, geography, dimensions, age, performance or electrical equipment is fixed by this broad identity. Match the actual whole set specification and upstream boundary. This service event retains original first-release identity/cohort Q_H and actual observed H. Full actual gross mass V_H includes any real retained material/water change; separately measure original/current contents and condition, no assumed equivalence of receipt and return mass. Internal first-release handoff is only a paired cancelling ledger, not another external purchase or Q. This row never charges original manufacture again. This is only a genuine externally received already released set for the declared service cohort, excluding an external delivery return represented by fg_return. It is not the internal first-release handoff. Each physical inbound event occupies exactly one disjoint receipt category."
