schema_version: 2
generated_from: markdown
source_markdown: pcr.en-US.md
product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.furniture-other-transportable-goods-n-e-c.injection-moulded-mechanical-construction-toy-set"
  classification_refs: "CPC 3.0 38540; narrower product and route boundary"
  covered_products: "Complete mechanical thermoplastic construction sets with actual required contents"
  excluded_products: "Exclude electric trains/track-signal systems, electric motors, batteries, lighting, radio/remote control, powered vehicles, reactive thermoset principal routes, metal/wood principal construction kits, loose spare blocks as terminal, generic resin manufacture, injection-machine/tool manufacture as terminal, purchased complete-set repacking, puzzles, use and end-of-life. This narrower route does not establish applicability to the whole classification. Real additional polymers, supplied components, fuel, refrigerant, chemical, printing/adhesive, packaging, water phase and waste outlet must be added as individual evidenced flows before a concrete dataset can be complete; they cannot be hidden in other-material or zero buckets."
  representative_product: "A specified complete building-block play set, not one loose block"
  production_route: "Actual pellet formulations and declared completed components; conditioning/mixing; injection moulding; actual decoration/component assembly; set completion and first release"
  market_state: "Complete first-quality-released set; separately observed actual original-cohort gate services"
functional_unit:
  what: "Provide one complete configured mechanical construction play system"
  how_much: "1 kg complete newly first-released set net contents; equal mass does not imply equal play function/performance"
  how_well: "All specified elements and actual subassemblies; actual functional instructions; manufacturer specification, real tests and acceptance/disposition, without a PCR performance rating"
  how_long_or_cycle: "One unique first-release manufacturing cohort; use life excluded; actual later service has original Q_H and observed H"
  reference_flow_link: "finished_release"
system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "all inventory rows"
      rule: "Start with actual complete resin formulations and the declared separately completed component supplies; include every remaining operation through complete set release. Supplier-completed components replace only their own upstream/local operations. One supplied formulation/article is acquired once; its pigment, solvent, carrier water, liner or thread is a nonadditive constituent ledger. Real on-site formulation uses each genuine purchased material plus mixing energy/loss instead. Reconcile overlapping whole/component bridges and cancel internal transfers; never recursively buy a completed whole set to replace manufacture."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_release
      applies_to: "all inventory rows"
      rule: "Q is the sum of complete set net masses at newly unique first quality release, including actual net retained components/decoration/water and functional printed instructions once, excluding sales/transport packaging and nonreleased rejects. Sets left in closing released FG are already in Q. Do not count both Q and its closing FG as production outputs, deduct their original manufacture, or create Q on delivery, reinspection, returns or rework. Intermediate molded bricks are WIP until the required set contents are complete. Keep all failed, zero-output, start/stop, idle, cleanup, test and rework loads; Q=0 retains actual records but gives no unit result."
      source_ids:
        - lego-whole-set-process
        - lego-profile-manufacturing
        - ilcd-2010-attributional
    - rule_id: b_stocks
      applies_to: "all inventory rows"
      rule: "Maintain complete physical wet opening/closing raw, WIP, unassigned non-WIP material/service stores, installed fluids/assets and released FG plus each exchange-specific inherited burden vector. Manufacturing B_close contains only raw/WIP and genuinely unused/unassigned non-WIP charge, never already released FG or performed services. Stock-corrected consumption is not corrected twice. Actual new material/water influx remains even when held in closing stock, and complete closing wet mass remains too. X_in/X_out deduplicate only OTHER same-side incoming/outgoing flow terms, not stocks, opposite directions or the existence of a real card."
      source_ids:
        - ilcd-2010-attributional
    - rule_id: b_physical
      applies_to: "all inventory rows"
      rule: "Close independent actual mass and relevant measured C/H/O/N and other element ledgers. Manufacturing gate reconciles opening raw/unreleased WIP plus external material/species receipts against first-released net contents, actual external wastes/gases and closing raw/unreleased WIP/non-WIP material. FG/service gate reconciles opening released FG plus paired first-release handoff and real returns/material/water changes against gross dispatch, closing FG and actual reject/waste/return flows. Consolidation cancels paired internal handoffs only. Every physical gross leg V retains its complete mass/native quantity, never an economic, service or burden share. Element balance alone does not identify a gas, VOC, COD or reaction-water species; one residual cannot fit two unknowns."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_service
      applies_to: "all inventory rows"
      rule: "After unique release, record only actually performed packing/storage/handling/dispatch/test/work during observed H with the original cohort Q_H, history and incremental raw burden. Already performed original-cohort service is not deducted because FG remains held; only genuinely unused/unassigned service or charge carries forward. Actual post-release work requires manufacturer/specification permission and postwork tests, acceptance and disposition before continued qualification is claimed. Unauthorised, failed or refused work still retains every actual input/output/load and original-cohort hold/waste outcome; never assume broken parts recover. Natural humidity exchange needs no invented permission or repair. Future unobserved H remains unknown. A net-delivery study needs a separate complete opening/closing FG historical burden and gross dispatch G/return R/original-delivery reversal D_rev bridge, not this first-release Q."
      source_ids:
        - lego-profile-manufacturing
        - ilcd-2010-attributional
    - rule_id: b_pack
      applies_to: "all inventory rows"
      rule: "For each actual single packaging pool, opening empty/attached WIP/attached FG/reusable stock + P + I + ER + real disjoint component/water ingress = closing complete wet stocks + gross S + EO + W + real disjoint component/water outflow. P is separate acquisition; I is real supplier-included ingress with one upstream owner; ER received external return, S actual gross dispatch, EO external return out, W real waste. Whole wet P/I/ER and constituents are never added twice. New water/repair influx is not deleted because retained. Internal reuse cancels; no product Q, reacquisition or credit. One genuine mixed Waste outlet carries independently measured nonadditive originW subledgers; only actual separated outlets use separate W exchanges."
      source_ids:
        - lego-whole-set-process
        - ilcd-2010-attributional
    - rule_id: b_utilities
      applies_to: "all inventory rows"
      rule: "Keep electricity, each actual fuel/heat, each material/preparation, water phase, gas species, packaging article, old/new part, fluid and waste outlet atomic. On-site utility inputs/outputs versus purchased utility whole-provider inventory must be disjoint or reconciled, never duplicated. Actual external heat-carrier Product supply/return uses measured mass/phase/T/P/enthalpy and supplier heat/water ownership; no fictitious steam/boiler/condensate loop. Separate physical asset stocks and full gross receipts/exports from actual service burden; no fixed machine/mould life, mass or replacement ratio. Actual new unlisted atoms must be added rather than omitted."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_original_acceptance_context
      applies_to: "all applicable conditions"
      rule: "Q0 is the unique first-acceptance event account: lock each actual complete set net mass and configuration to its original set/cohort identity. Manufacturing Q=Q0 and later original Q_H=Q0; do not replace historic acceptance mass by a current delivered/returned/damaged/shrunken/modified mass. Partition all original accepted identities into disjoint net remaining deliveries, all actual on-site accepted states (including stored, held, samples, damaged, returned and rework states), irreversible whole-set losses and other terminal dispositions on original acceptance-mass basis. Every real state/exit remains visible. Delivery plus closing FG is only a simplified bridge when all other postgate states/exits are proven absent. Partial loss of water, parts, ink or paper is an independent physical change, never restored into a survivor and also added as an outlet. Returns, reuse, repeated tests, rework and re-release create no new Q0. Keep full actual current raw/WIP/FG/asset/container wet stocks and physical transfers independently of the original event account. Service keeps original Q0 even if all sets are gone; zero/unknown basis retains raw totals and no unit result."
      source_ids:
        - lego-whole-set-process
        - ilcd-2010-attributional
    - rule_id: b_complete_producer_context
      applies_to: "all applicable conditions"
      rule: "The actual complete purchased formulation/article is linked to one real complete producer inventory or its real manufacturing history is expanded mutually exclusively. A supplied finished element replaces only its own completed operations, never the remaining whole-set manufacture; its declared producer must include actual material preparation, moulding, decoration/subassembly, utilities, losses and waste interfaces appropriate to its delivered state. Actual on-site formulation, printing, drying, moulding, utility generation or controlled subcontract work stays included even if an organisational label calls it upstream. A UUID, invoice or promised future SOP alone supplies no upstream burdens or missing essential analytical/matrix procedure. Retain any genuinely unresolved core method as a hold; neither software success nor a qualifier silently closes it. Supplier grades and actual event quantities remain independently collected, with no invented same-factory/SKU restriction, recipe, yield, dose, efficiency, mass or lifetime."
      source_ids:
        - lego-whole-set-process
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_whole_waste_context
      applies_to: "all applicable conditions"
      rule: "For each actual whole contaminated cloth/filter/container or mixed waste stream, Qt is the full physical transfer including substrate, retained polymer/ink/cleaner/solids and water once. Dry substrate and constituent analyses are nested nonadditive ledgers unless truly separated before the boundary. Preserve complete actual receiver transfer and total fulfilled provider demand, distinct from nonoverlapping original-cohort burden/service vectors A/Q or A_H/Q_H. A physical-only gross V disclosure never purchases, characterizes or treats that same material again; an attributable A is never relabelled a reduced physical export. Several cohorts sharing one event do not each incur the whole Qt anew. Link full provider aggregate or expanded treatment history mutually exclusively; unknown method, composition, receiver or assignment stays unresolved. Every real separate outlet requires its own atomic card; a genuine one mixed outlet owns its total, and source-pool W accounts are not extra exports."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_complete_source_context
      applies_to: "all applicable conditions"
      rule: "The LEGO process and material-purpose pages were retained as complete substantive web-tool text captures, not locally acquired publisher HTML, PDF or OCR; the corresponding local publisher originals are unavailable in this evidence set, and a text capture does not establish that they were acquired. A complete publisher Company Profile PDF is separately retained and supports real moulding/processing/packing and ingredients/test context as historical manufacturer evidence. These three sources are one publisher, not independent factories, a common current SKU or quantitative operating qualification. IFC is independent qualitative non-reactive-plastics screening with its stated project-specific applicability and adjacent reactive/rubber/metal limits; it does not identify actual plant molecules or quantities. ILCD supports the conditional attributional method only. Retain all original source restrictions; no temperature, pressure, cycle, count, test load/height, material fraction, emission factor, certificate, environmental advantage or lifetime is transferred into PCR defaults."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - lego-profile-manufacturing
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_full_scope_context
      applies_to: "complete applicability"
      rule: "Manufacture one complete configured mechanical plastic construction-toy set, containing the actual specified interlocking play elements and actual assembled mechanical subcomponents, from purchased complete thermoplastic pellet formulations and explicitly identified finished component supplies. Include receipt/storage, conveyance, actual moisture conditioning, colour mixing only when separate, melt plastication, mould filling/packing, cooling/ejection, gate/flash trimming, controlled internal regrind, actual element decoration/drying, component assembly, counting/selection, functional instructions and whole-set inspection and unique first quality release. Sales-box/bag packing is included where actually performed but its material mass is excluded from net toy Q. Source: lego-whole-set-process; lego-material-purpose; lego-profile-manufacturing; ifc-plastic-products-2007. This is a transparent technical synthesis of a manufacturer whole-set route and general non-reactive plastics/environmental guidance, with independent ILCD support only for conditional attributional modelling. The LEGO sources are one publisher, not independent factories or one shared contemporary SKU/order. Material-purpose examples show that ABS is not every element: HIPS, PA, arMABS, MTPO, PC, bio-PE, POM, PP, TPU, SEBS and TP are counterexamples to an all-ABS recipe, not required constituents. Actual grades, formulations and make/buy records decide each card. Manufacturer temperatures, pressures, cycle times, test forces/heights, constituent shares, piece counts and durability claims are not PCR defaults or certificates. No default density, set mass, yield, lifetime, age rating or emission factor is supplied. IFC potential-fume examples do not establish actual normal-operation molecule emissions. Exclude electric trains/track-signal systems, electric motors, batteries, lighting, radio/remote control, powered vehicles, reactive thermoset principal routes, metal/wood principal construction kits, loose spare blocks as terminal, generic resin manufacture, injection-machine/tool manufacture as terminal, purchased complete-set repacking, puzzles, use and end-of-life. This narrower route does not establish applicability to the whole classification. Real additional polymers, supplied components, fuel, refrigerant, chemical, printing/adhesive, packaging, water phase and waste outlet must be added as individual evidenced flows before a concrete dataset can be complete; they cannot be hidden in other-material or zero buckets. UN CPC3.0 explanatory notes38540 also include electric/non-electric toy vehicles and accessories, non-electric toy motors, recreational scale models and their kits, and recreational full-size reproductions; electric toy motors are excluded there. This method selects the evidenced construction-set/building-block route within that broader scope. The adjacent puzzles and other-toy categories do not replace complete construction sets. Source: un-cpc3-38540-scope."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - lego-profile-manufacturing
        - ifc-plastic-products-2007
        - un-cpc3-38540-scope
    - rule_id: b_full_reference_context
      applies_to: "complete native/reference/producer/source/cohort"
      rule: "Product flow of a finished manufactured construction-toy family, production mix at plant. Its native context includes toy vehicles, vehicle accessories, non-electric toy motors/steam engines, recreational scale models, kits and construction sets/building blocks, but excludes electric toy motors. Here it represents ONLY one complete configured mechanical plastic construction set: every required play element, actual assembled subcomponent, retained decoration and supplied functional paper instructions, uniquely first released. A resin, loose spare brick, mould, train component or purchased whole set used merely for repacking cannot occupy this reference role. No CAS, polymer recipe, grade, geography, dimensions, age, performance or electrical equipment is fixed by this broad identity. Match the actual whole set specification and upstream boundary. Declare every required qualifier in the concrete dataset. Q0 is the unique first-acceptance event account: lock each actual complete set net mass and configuration to its original set/cohort identity. Manufacturing Q=Q0 and later original Q_H=Q0; do not replace historic acceptance mass by a current delivered/returned/damaged/shrunken/modified mass. Partition all original accepted identities into disjoint net remaining deliveries, all actual on-site accepted states (including stored, held, samples, damaged, returned and rework states), irreversible whole-set losses and other terminal dispositions on original acceptance-mass basis. Every real state/exit remains visible. Delivery plus closing FG is only a simplified bridge when all other postgate states/exits are proven absent. Partial loss of water, parts, ink or paper is an independent physical change, never restored into a survivor and also added as an outlet. Returns, reuse, repeated tests, rework and re-release create no new Q0. Keep full actual current raw/WIP/FG/asset/container wet stocks and physical transfers independently of the original event account. Service keeps original Q0 even if all sets are gone; zero/unknown basis retains raw totals and no unit result. The actual complete purchased formulation/article is linked to one real complete producer inventory or its real manufacturing history is expanded mutually exclusively. A supplied finished element replaces only its own completed operations, never the remaining whole-set manufacture; its declared producer must include actual material preparation, moulding, decoration/subassembly, utilities, losses and waste interfaces appropriate to its delivered state. Actual on-site formulation, printing, drying, moulding, utility generation or controlled subcontract work stays included even if an organisational label calls it upstream. A UUID, invoice or promised future SOP alone supplies no upstream burdens or missing essential analytical/matrix procedure. Retain any genuinely unresolved core method as a hold; neither software success nor a qualifier silently closes it. Supplier grades and actual event quantities remain independently collected, with no invented same-factory/SKU restriction, recipe, yield, dose, efficiency, mass or lifetime. The LEGO process and material-purpose pages were retained as complete substantive web-tool text captures, not locally acquired publisher HTML, PDF or OCR; the corresponding local publisher originals are unavailable in this evidence set, and a text capture does not establish that they were acquired. A complete publisher Company Profile PDF is separately retained and supports real moulding/processing/packing and ingredients/test context as historical manufacturer evidence. These three sources are one publisher, not independent factories, a common current SKU or quantitative operating qualification. IFC is independent qualitative non-reactive-plastics screening with its stated project-specific applicability and adjacent reactive/rubber/metal limits; it does not identify actual plant molecules or quantities. ILCD supports the conditional attributional method only. Retain all original source restrictions; no temperature, pressure, cycle, count, test load/height, material fraction, emission factor, certificate, environmental advantage or lifetime is transferred into PCR defaults."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - lego-profile-manufacturing
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_machine_fulfilled_service
      applies_to: "machine_fulfilled_service"
      rule: "Only actual observed fulfilled service of one declared configuration and original cohort, with real duty/use intervals, actual capacity and justified compatible provider or own-asset burden vector. Keep new/used acquisition, returns, retirement, installed fluids/parts and full wet physical fleet separately; retained machinery is not consumed per kg toy. Included components/charges and separate supply cards are disjoint. No nominal lifetime, machine mass, service capacity or replacement schedule. Use h only with actual timed service and compatible measured conversion; an unknown provider/capacity conversion remains unresolved. Reusable cloth retains actual washing/contamination/full-article retirement history; disposable cloth consumption is not also charged as reusable service."
      source_ids:
        - ilcd-2010-attributional
    - rule_id: b_inventory_mould_fulfilled_service
      applies_to: "mould_fulfilled_service"
      rule: "Only actual observed fulfilled service of one declared configuration and original cohort, with real duty/use intervals, actual capacity and justified compatible provider or own-asset burden vector. Keep new/used acquisition, returns, retirement, installed fluids/parts and full wet physical fleet separately; retained machinery is not consumed per kg toy. Included components/charges and separate supply cards are disjoint. No nominal lifetime, machine mass, service capacity or replacement schedule. Use h only with actual timed service and compatible measured conversion; an unknown provider/capacity conversion remains unresolved. Reusable cloth retains actual washing/contamination/full-article retirement history; disposable cloth consumption is not also charged as reusable service."
      source_ids:
        - ilcd-2010-attributional
    - rule_id: b_inventory_cloth_fulfilled_service
      applies_to: "cloth_fulfilled_service"
      rule: "Only actual observed fulfilled service of one declared configuration and original cohort, with real duty/use intervals, actual capacity and justified compatible provider or own-asset burden vector. Keep new/used acquisition, returns, retirement, installed fluids/parts and full wet physical fleet separately; retained machinery is not consumed per kg toy. Included components/charges and separate supply cards are disjoint. No nominal lifetime, machine mass, service capacity or replacement schedule. Use h only with actual timed service and compatible measured conversion; an unknown provider/capacity conversion remains unresolved. Reusable cloth retains actual washing/contamination/full-article retirement history; disposable cloth consumption is not also charged as reusable service."
      source_ids:
        - ilcd-2010-attributional
    - rule_id: b_inventory_make_contaminated_wipe_treatment
      applies_to: "make_contaminated_wipe_treatment"
      rule: "Actual complete fulfilled provider demand for the full transferred Qt, with whole substrate/retained material/water and real receiver/process compatibility. Keep provider total once and distinct nonoverlapping original-cohort attribution vectors, never a shrunken physical export or full total charged anew to each cohort. A mixed-outlet provider and this separate provider are mutually exclusive for the identical physical event. Whole provider aggregate and expanded history do not duplicate. Unknown actual receiver/method/assignment remains unresolved; no assumed treatment or credit."
      source_ids:
        - ilcd-2010-attributional
    - rule_id: b_inventory_abs_feed
      applies_to: "abs_feed"
      rule: "Receive the complete actual ABS pellet formulation, natural or pre-coloured, and inherit its actual upstream production once. Native Product is ABS granulate with Mass/kg; no fixed grade, CAS, additives, geography or fabrication route is declared. Use only ABS pellets of the documented actual supply state, not ABS monomers, powder, sheet, EPS, filled unknown blend or finished bricks. Supplier-included colour/stabiliser/water is a nonadditive subledger; separately bought masterbatch is an additional input only when not already included. Never assume the entire set is ABS."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_pp_feed
      applies_to: "pp_feed"
      rule: "Conditional on actual BOM and separate supply; inherit the whole supplied formulation once. Product PP granulate; production mix at plant; upstream propylene polymerisation. Only actual separately supplied PP pellets of compatible composition, not recycled PP, PE or a pre-made article; no homopolymer/copolymer grade or percentage is assumed."
      source_ids:
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_hips_feed
      applies_to: "hips_feed"
      rule: "Conditional on actual BOM and separate supply; inherit the whole supplied formulation once. Product HIPS granulate; production mix at plant; impact-modified styrene polymerisation. Requires actual HIPS pellets and matching rubber-modified polymer; GPPS, EPS and ABS are distinct. Native recovery provenance preserves this physical identity but supplies no recycled share, grade or factory recipe."
      source_ids:
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_pc_feed
      applies_to: "pc_feed"
      rule: "Conditional on actual BOM and separate supply; inherit the whole supplied formulation once. Product PC granulate; production mix at plant GLO, no fixed route, grade or CAS. Use actual polycarbonate pellets, not MABS, PC/ABS blend, finished connector or arbitrary transparent plastic. GLO identity does not establish supplier geography or provider representativeness."
      source_ids:
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_pa6_feed
      applies_to: "pa6_feed"
      rule: "Include only if actual material is independently documented PA6; generic PA evidence does not establish PA6 versus PA66. Its supply formulation and moisture are whole once."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_pom_feed
      applies_to: "pom_feed"
      rule: "Conditional actual POM pellet supply; distinguish its actual homopolymer/copolymer grade and additives. No silane or other search neighbour is POM."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_sebs_feed
      applies_to: "sebs_feed"
      rule: "Conditional actual complete SEBS compound pellets; distinguish SBS, rubber vulcanisation, oil/filler content and supplied finished tyre. No default elastomer part is required."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_tpu_feed
      applies_to: "tpu_feed"
      rule: "Conditional actual TPU pellets; distinguish reactive thermoset polyurethane and other thermoplastic elastomers. No resin recipe is inferred from a toy example."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_colour_masterbatch
      applies_to: "colour_masterbatch"
      rule: "One complete actual ABS-carrier colour masterbatch preparation if separately purchased and compatible with the actual element. Record carrier/pigment/additive assays without repurchasing them. Actual other carrier requires a distinct card. Not an auxiliary-reaction proxy or pure pigment; no dose default."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_decoration_ink
      applies_to: "decoration_ink"
      rule: "One whole supplied decoration ink in its actual solvent/water/binder/pigment state, only when the element is actually printed. Obtain SDS, full formulation identity, application/drying specification and retained film mass. Not assumed to be aqueous, inkjet, gravure or planographic ink. Supplied carrier water/solvent is not another purchase; actual on-site formulation replaces the overlapping whole preparation with each actual purchased ingredient and mixing energy/loss."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_ipa_cleaner
      applies_to: "ipa_cleaner"
      rule: "Conditional one actually supplied complete aqueous IPA cleaner, including its water/additives once, at actual measured assay. No default 70% or purity; not an elementary IPA emission or optical-assembly-specific product."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_ipa_neat
      applies_to: "ipa_neat"
      rule: "Only actual separately bought neat IPA for on-site dilution or cleaning, measured independently; disjoint from IPA already within purchased ink/cleaner. Add actual dilution water and preparation losses separately. CAS67-63-0, liquid material; no adoption of a mismatched supplier-specific native row."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_instructions
      applies_to: "instructions"
      rule: "One completed printed booklet purchased from its real print/bind supplier if paper instructions are actually included. This is a functional informational component of the complete set and belongs to net Q, not transport packaging. Its upstream paper, ink and binding are owned once by the supplied booklet; do not buy those components again. Actual in-house printing instead needs each genuine paper/ink/energy/loss card and cancels this overlapping article input. Digital-only instructions do not imply a paper quantity."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_bought_abs_element
      applies_to: "bought_abs_element"
      rule: "Conditional one identified externally completed ABS play element, with actual shape/colour/print/state and supplier moulding/decorating burden. It replaces only that component manufacture, never the entire required set. Reconcile make/buy BOM by component, no simultaneous resin/local moulding for the same supplied element. A train-specific injection-moulded part is not this generic construction element."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_bought_subassembly
      applies_to: "bought_subassembly"
      rule: "Conditional one actual externally completed mechanical minifigure subassembly with full measured material constituents and supplier route. It is not a motor, remote-control unit or entire finished construction set. Whole article versus component input must be disjoint or bridged and internally cancelled."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_cotton_wipe
      applies_to: "cotton_wipe"
      rule: "Conditional actual cotton cloth for cleaning/inspection; full supplied cloth mass and absorbed liquid measured separately without adding absorbed water twice. Not a paper wipe or whole cleaner preparation."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_mineral_lube
      applies_to: "mineral_lube"
      rule: "Conditional actual mineral-oil based whole lubrication preparation. A native PAO total-synthesis lubricant is not interchangeable. Track whole supply, installed/removed fluid and service use separately; no per-kg complete fill."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_coolant
      applies_to: "coolant"
      rule: "Only actual whole aqueous propylene-glycol coolant; measure assay, carrier water, phase and service state independently. Water already in this preparation is a subledger, not a second water receipt; installed stock and real top-up/drain remain. Actual different coolant chemistry needs its own card."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - ifc-plastic-products-2007
    - rule_id: b_inventory_electricity_make
      applies_to: "electricity_make"
      rule: "Meter receipt/conditioning/drying when actually used, melt filling/cooling/ejection, trimming, internal regrind, handling of parts, decoration/drying, component assembly, counting, testing, utility production and all failure/start-stop/idle/cleanup/rework loads. Native Product is CN low-voltage AC below1kV, grid-average consumption mix to user, with Net calorific value as its energy interface in MJ; this is not Mass or fuel combustion. Match actual geography/voltage/provider/period; convert kWh to MJ once using3.6. Other supply needs its own compatible row. Include actual pre-first-release packaging/counting/checking electricity once; post-release packing electricity is service_electricity only."
      source_ids:
        - lego-whole-set-process
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_tap_make
      applies_to: "tap_make"
      rule: "Actual supplied treated municipal potable liquid water for real separate conditioning, cleaning, tests or cooling top-up. Native Product, water production/supply, production mix at factory, Mass/kg reference; secondary Volume is not an observed density. Record each purpose and water state, meter/source conversion with independently measured density when needed. No assumed cooling circuit, freshwater elementary extraction or second purchase of formulation carrier water."
      source_ids:
        - ifc-plastic-products-2007
    - rule_id: b_inventory_hydraulic_fill
      applies_to: "hydraulic_fill"
      rule: "Conditional actual complete supplied engineered hydraulic fluid for a real hydraulic system, mineral or synthetic base plus actual additives. Native Product has Volume/m3 reference, not Mass/kg. Measure supplied liquid volume and actual state-specific density independently for the physical wet-mass ledger; never infer density from another coefficient or water. Actual all-electric machinery may lack this fluid. Installed inventory, actual new fill/top-up and removed fluid remain disjoint; service burden is not the whole physical stock per kg. Native classification places this broad fluid under petroleum lubricants while the physical comment permits mineral or synthetic bases; disclose that taxonomy limitation separately. It is not evidence for a petroleum percentage or permission to ignore actual liquid formulation compatibility."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_delivered_heat
      applies_to: "delivered_heat"
      rule: "Only real externally supplied useful heat, with supplier heat source, actual mass/phase/T/P/enthalpy and supply/return agreement. No presumed gas boiler, steam or fuel; separate carrier mass legs own no duplicate heat provider."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_carrier_in
      applies_to: "carrier_in"
      rule: "Actual external hot-water carrier ingress, full gross physical V. Paired with independently measured return at actual state; supply heat and water ownership are explicit. Not an automatic additional water or steam purchase."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_air_supply
      applies_to: "air_supply"
      rule: "Only real externally purchased complete compressed-air mixture, actual pressure/composition/moisture and supplier energy boundary. On-site compression instead uses actual electricity and ambient species intake. Select disjoint purchase or reconciled whole-mixture/component bridge; supplied air species are not an additional environmental intake at this same receipt."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_machine_in
      applies_to: "machine_in"
      rule: "Only an actual externally received identified new/used complete injection machine. Gross physical mass V and inherited vector stock are separate from attributable use-service burden; no assumed machine mass, lifetime, shot capacity or one machine per kg. Inventory actual installed fluids and components once, reconciled with whole machine."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_mould_in
      applies_to: "mould_in"
      rule: "Only actual complete configured steel mould receipt; cavities/inserts/cooling/gating interfaces and supplier tooling burden explicit. Gross mass V is not economically scaled; the actual use-service vector is drawn once with justified causal service evidence, no fixed lifetime or shot count. Not raw steel bought again for the same finished tool."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_pin_new
      applies_to: "pin_new"
      rule: "Actual separate new replacement steel ejector pin; not a whole tool, welded repair assembly or generic steel charge. Retain received mass even when still held in closing spare stock, and full installed/unused stock."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_make_n2_in
      applies_to: "make_n2_in"
      rule: "Actual Nitrogen gas withdrawal from ambient air for the declared physical boundary, individually measured by species/phase/location and integrated gas state. Includes real drying, ventilation, compressor intake, ordinary storage sorption/desorption and handling as applicable. No assumed air composition, emission factor or invented repair. Supplied whole air/fluids and these atoms require a disjoint or reconciled bridge; unchanged pass-through is not a second source emission. New generated CO2 is a separately evidenced source-specific increment. Gross V is never burden-scaled."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_make_o2_in
      applies_to: "make_o2_in"
      rule: "Actual Oxygen gas withdrawal from ambient air for the declared physical boundary, individually measured by species/phase/location and integrated gas state. Includes real drying, ventilation, compressor intake, ordinary storage sorption/desorption and handling as applicable. No assumed air composition, emission factor or invented repair. Supplied whole air/fluids and these atoms require a disjoint or reconciled bridge; unchanged pass-through is not a second source emission. New generated CO2 is a separately evidenced source-specific increment. Gross V is never burden-scaled."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_make_ar_in
      applies_to: "make_ar_in"
      rule: "Actual Argon gas withdrawal from ambient air for the declared physical boundary, individually measured by species/phase/location and integrated gas state. Includes real drying, ventilation, compressor intake, ordinary storage sorption/desorption and handling as applicable. No assumed air composition, emission factor or invented repair. Supplied whole air/fluids and these atoms require a disjoint or reconciled bridge; unchanged pass-through is not a second source emission. New generated CO2 is a separately evidenced source-specific increment. Gross V is never burden-scaled."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_make_h2o_in
      applies_to: "make_h2o_in"
      rule: "Actual Water vapour withdrawal from ambient air for the declared physical boundary, individually measured by species/phase/location and integrated gas state. Includes real drying, ventilation, compressor intake, ordinary storage sorption/desorption and handling as applicable. No assumed air composition, emission factor or invented repair. Supplied whole air/fluids and these atoms require a disjoint or reconciled bridge; unchanged pass-through is not a second source emission. New generated CO2 is a separately evidenced source-specific increment. Gross V is never burden-scaled. This row is the non-packaging unreleased raw/WIP/room/process-water event only; separately identified packaging humidity events belong exclusively to pack_water_in/out and are removed from this same-side total, never from stocks."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_make_co2_in
      applies_to: "make_co2_in"
      rule: "Actual Carbon dioxide withdrawal from ambient air for the declared physical boundary, individually measured by species/phase/location and integrated gas state. Includes real drying, ventilation, compressor intake, ordinary storage sorption/desorption and handling as applicable. No assumed air composition, emission factor or invented repair. Supplied whole air/fluids and these atoms require a disjoint or reconciled bridge; unchanged pass-through is not a second source emission. New generated CO2 is a separately evidenced source-specific increment. Gross V is never burden-scaled."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_finished_release
      applies_to: "finished_release"
      rule: "Product flow of a finished manufactured construction-toy family, production mix at plant. Its native context includes toy vehicles, vehicle accessories, non-electric toy motors/steam engines, recreational scale models, kits and construction sets/building blocks, but excludes electric toy motors. Here it represents ONLY one complete configured mechanical plastic construction set: every required play element, actual assembled subcomponent, retained decoration and supplied functional paper instructions, uniquely first released. A resin, loose spare brick, mould, train component or purchased whole set used merely for repacking cannot occupy this reference role. No CAS, polymer recipe, grade, geography, dimensions, age, performance or electrical equipment is fixed by this broad identity. Match the actual whole set specification and upstream boundary."
      source_ids:
        - lego-whole-set-process
        - lego-material-purpose
        - lego-profile-manufacturing
    - rule_id: b_inventory_carrier_return
      applies_to: "carrier_return"
      rule: "Only actual external Product return to heat/water supplier at measured mass/phase/T/P/enthalpy; full gross V, not Waste, no automatic credit, duplicated supplier or fictitious steam loop."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_make_contaminated_wipe
      applies_to: "make_contaminated_wipe"
      rule: "One actual physically segregated whole cotton cloth outlet, including substrate, retained polymer/ink/cleaner and water once. Preserve full wet Qt, actual composition and complete receiver/treatment demand independently of per-cohort A/Q or A_H/Q_H. If it enters the actual mixed waste outlet, this row is a nonadditive source subledger and does not create another external waste or provider. Unknown occurrence is not zero; separately exported constituents exist only when physically separated."
      source_ids:
        - ilcd-2010-attributional
    - rule_id: b_inventory_abs_sprue_waste
      applies_to: "abs_sprue_waste"
      rule: "Only one actual separately exported identified ABS sprue/runner stream; clean internal regrind remains internal WIP with genealogy and losses, no new resin purchase/credit. Ordinary waste sales retain manufacturing and handling/treatment loads."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_rejected_set
      applies_to: "rejected_set"
      rule: "One real segregated rejected set outlet, full net contents at actual state; no Q unless an article had already been uniquely released, in which case preserve original cohort. Failed samples and refused rework remain actual waste/hold, not assumed recoverable product."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_polymer_dust
      applies_to: "polymer_dust"
      rule: "Actual one captured particulate waste stream with measured polymer composition and wet mass; not airborne emission again. If disposed only in mixed waste, use the nonadditive origin subledger of that one outlet."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_spent_ink
      applies_to: "spent_ink"
      rule: "Actual separately removed whole residual ink with carrier liquid and actual contamination measured; no implied solvent evaporation, identical fresh input or automatic coproduct sale."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_make_effluent
      applies_to: "make_effluent"
      rule: "One actual separate wet cleaning-effluent outlet, including measured retained liquid and solids once. Disclose treatment provider and discharge destination; COD/TOC/VOC are indicators, not particular chemical masses. Manganese-slag washing wastewater is inapplicable."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_coolant_removed
      applies_to: "coolant_removed"
      rule: "Actual removed whole coolant with independently measured carrier water/solute and contamination; inherited service and waste handling assigned once, no duplicate fluid/constituent exports."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_hydraulic_removed
      applies_to: "hydraulic_removed"
      rule: "Actual removed hydraulic fluid wet mass and independent native volume/state; not an assumed loss equal to new fill. Retain real in-machine closing fluid stock and actual influx."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_pin_removed
      applies_to: "pin_removed"
      rule: "Actual removed old pin, own measured mass/cohort; no assumed mass equality with new pin and no whole-tool wording."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_mould_scrap
      applies_to: "mould_scrap"
      rule: "Actual whole tool retirement/export with full gross V; reconcile removed inserts and retained tool stock without duplication, no automatic recycled credit or deduction of prior performed use."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_machine_scrap
      applies_to: "machine_scrap"
      rule: "Actual whole-machine export with full measured wet gross V; reconcile disjoint removed fluids/parts and remaining machine mass. Do not allocate away physical mass or erase prior service burden."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
    - rule_id: b_inventory_mixed_waste
      applies_to: "mixed_waste"
      rule: "Only one physically mixed outlet when that is the actual export, with its own total wet mass and treatment/provider once. Measure nonadditive originW subaccounts for rejects, cloth, dust and each packaging pool; do not invent separate exports or add total plus origins. Ordinary disposal/sale does not transfer manufacturing burdens away."
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-2010-attributional
