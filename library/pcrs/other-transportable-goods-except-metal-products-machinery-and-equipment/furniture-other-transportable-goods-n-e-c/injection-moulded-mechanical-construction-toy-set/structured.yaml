      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_scope | all inventory rows | This section applies only to attributional multifunctionality where allocation is required; the physical gross ledger remains independent of burden attribution. | `ilcd-2010-attributional` |\n| a_framework | all inventory rows | Use this method only for an explicitly attributional study in which allocation is the applicable multifunctionality route. Identify actual products/functions and exchange ownership; industrial manufacturer evidence does not establish LCA allocation. Do not freely choose between economic and physical rules or impose percentages, substitution or automatic avoided-product credits. | `ilcd-2010-attributional` |\n| a_subdivide | all inventory rows | First collect dedicated element/line/decoration/assembly/utility work separately and apply real or virtual subdivision as far as physically justified. For each remaining indivisible exchange identify a determining physical causal relationship to the actual cofunctions, supported by metering/engineering evidence and actual configuration. Mass, count, cycle or machine time is not automatically causal for every exchange; explain the actual determinant and conserved burden vector. | `ilcd-2010-attributional` |\n| a_residual | all inventory rows | Only the genuinely unresolved remaining burden uses contemporaneous specific market values of actual co-products in their actual state and at the same shared process gate, with quantities/currency/time/quality and any downstream-state back-adjustment documented. Retain sensitivity and uncertainty when values are unknown; no fixed fallback share. Gross physical quantities never inherit allocation shares. Ordinary scrap/reject/sample/waste sale or external treatment does not automatically deduct production/treatment load; T_other requires a real independent function/cohort and one justified vector handover. | `ilcd-2010-attributional` |\n\n"
