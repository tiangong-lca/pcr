          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_identity | all inventory rows | Verify the complete set endpoint, actual full element counts/configuration, functional instructions boundary, actual moulding/decoration/assembly and make/buy route, current actual specification and tests. A whole construction-toy family can be narrowed only with positive complete-product context; a hard material/form/route/CAS/type/media conflict cannot be waived by a similar name/classification. Each adopted native restriction belongs to the consuming card. No invented age/strength/lifetime/certificate or process defaults. | `lego-whole-set-process`; `lego-material-purpose`; `lego-profile-manufacturing`; `un-cpc3-38540-scope` |\n| v_accounting | all inventory rows | Verify unique first Q, complete net toy/instructions mass versus excluded packaging, all failure/Q=0 loads, each raw/WIP/non-WIP inheritance vector, independent manufacturing/FG/consolidated physical gates and observed original-cohort service. Inspect every packaging six-direction card and actual mixed originW relation, all wet stocks, repair materials/fluids, natural humidity, actual species and provider/carrier ownership. No stock, economic share or burden allocation can shrink a gross physical card. | `ifc-plastic-products-2007`; `ilcd-2010-attributional` |\n| v_units | all inventory rows | Verify each native extensive property and exact support chain before modelling. Do not apply Mass/kg rules to MJ or m3. Rates require actual time integration; already integrated volume does not. Density/assay/geometry and moisture need independent state-specific measurements. No secondary flow coefficient or nominal toy/asset weight supplies conversion. Collect raw numerators undivided, perform source conversions and real attribution, then execute one single_quotient result only. Unknown actual conversion or method remains unresolved. | `ilcd-2010-attributional` |\n\n"
