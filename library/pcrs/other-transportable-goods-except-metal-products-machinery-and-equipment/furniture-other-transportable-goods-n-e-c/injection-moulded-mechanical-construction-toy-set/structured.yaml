    - rule_id: b_inventory_set_box_p
      applies_to: "set_box_p"
      rule: "One actual supplied complete printed folding paperboard sales box; full paperboard/printing/adhesive/water state once, not toy net contents or a corrugated shipping carton. P separately acquired empty article: conditional on this actual event and this specific pool. Whole wet P/I/ER is counted once. Keep empty, attached WIP, attached FG and reusable opening/closing stock. The actual event phase is mandatory. Before first release the full gross native V with manufacturing Q is the numerator/denominator; after first release full V_H with original Q_H is the numerator/denominator; never A_H, inventory difference, economic share or net product Q. P may own one real acquisition; I keeps one declared upstream owner, ER/S/EO do not acquire it again and yield no automatic credit. W is an external card only for an actual distinct segregated outlet; if one mixed outlet is real, record independently measured originW in that outlet/pool subledger without adding another physical export. Internal reuse cancels. Actual pre-release packaging work belongs to manufacturing Q; actual post-release work belongs to original cohort Q_H in observed H. One actual event and its burden ownership are entered once, never in both phases."
      source_ids:
        - lego-whole-set-process
        - ilcd-2010-attributional
