    - rule_id: b_inventory_make_styrene_air
      applies_to: "make_styrene_air"
      rule: "Only the independently evidenced actual molecule and source increment reaching the real receiving air compartment. IFC table4 lists potential substances, including overheating cases, not default normal-operation emissions. Do not turn VOC/NOx/COD/total C or a residual into this molecule; no assumed reaction water or carbon origin. Account capture/treatment separately and avoid total/species and ambient/generated double counts."
