    required_unit: "kg"
    rule: "Q = sum of calibrated net complete rod masses newly first quality-released in the declared cohort. Weigh accepted whole rods with all configured sections and fitted parts, excluding detachable transport packaging and excluded fishing equipment; retain tare/calibration, moisture and configuration records. Counts use independently measured same-configuration net masses, never nominal supplier mass or a secondary native factor."
  - id: first_release_gate
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Released closing FG already belongs to Q; manufacturing burden closing stores contain only raw/WIP and genuinely unused/unassigned non-WIP burden. Delivery/retesting/returns are not new production. First-release Q is not a net-delivery denominator."
  - id: native_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual row-declared extensive property"
      uuid: ""
    required_unit: "Actual row native unit"
    rule: "Preserve each actual native extensive property and numerator unit. Convert measured kWh to MJ once by the exact factor 3.6. Integrated liquid/gas volumes are cumulative; integrate only actual rates. Volume-to-mass needs independently measured density of that material at its true composition/state, not water density or a secondary flow-property factor. Count Item(s) and item are equivalent by factor 1; no kg/item is inferred."
  - id: gross_events
    applies_to: "gross physical cards"
    required_property_ref:
      name: "Actual gross-event extensive quantity V_i"
      uuid: ""
    required_unit: "Actual event native unit"
    rule: "For every gross card A_i = actual complete event V_i in its own unit, with no stock correction, burden-vector substitution or economic share. Its Y_i is a physical disclosure, not an additional upstream procurement or credit. The same event owner’s actual burden dimension is attributed once separately."
  - id: raw_collection
    applies_to: "all collection protocols"
    required_property_ref:
      name: "Protocol-declared unnormalized raw extensive quantity"
      uuid: ""
    required_unit: "Actual raw-record unit"
    rule: "Collect original raw records without division. In protocol tables aggregation_rule labels the final per-reference view only; the raw collection method and raw_fields remain unnormalised. Prepare the applicable numerator first and execute the single_quotient rule exactly once. Amount fields and aggregation labels point to that same saved result and never divide again."
  - id: zero_or_unknown
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass (original cohort Q_c denominator only)"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "For Q_c = 0 preserve all real loads, stocks, failures and disposition; issue no unit result. Unknown quantities/balances/service capacity stay unresolved. Q_c is the measured original cohort reference mass for a service account, not present shipment mass or a fabricated future quantity."
