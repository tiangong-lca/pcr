          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| validate_terminal | complete reference rod | Reject a bare blank/material/part or different tackle terminal. Check every required qualifier, whole-rod BOM, same configured first-release Q and explicit finished_rod Product output. A compatible broad native family does not approve another terminal or methodology. | `richards-rod-manufacture`; `jwell-rod-factory`; `fantan-component-boundary` |\n| validate_measurement | all inventory rows | Require native unit chains and actual numerator measurements/conversions, the correct original Q_c/H, one single_quotient application and no per-card or aggregation redivision. Unknown relationships remain inconclusive. Q_c zero retains raw burden and no normalized output; check results are not measured factory data. | `ilcd-attributional-allocation-2010` |\n| validate_physical | physical gates and gross cards | Independently reconcile manufacture, FG and consolidated full physical/relevant-element gates; cancel internal Q/handoffs once. Gross V is never an attributed burden or economic share. Check all packaging P/I/ER/S/EO/W events, true full wet opening/closing stores, retained new influx, every same-side X bridge, one actual mixed-waste outlet and provider/treatment once. No invented symmetric outlets or residual-fitted species. | `ilcd-attributional-allocation-2010` |\n| validate_failures | production and service history | Preserve every actual failed/rejected/unauthorized attempt, waste, sample, treatment, startup, idle and rework burden, including Q-zero cohorts. Manufacturer permission and actual post-work acceptance control continued qualification, not deletion of already performed work. No broken-composite restoration is presumed. | `richards-rod-manufacture`; `flexcoat-wrap-finish`; `ilcd-attributional-allocation-2010` |\n| validate_supply | each selected flow card | Check actual native material/form/grade/route/geography/phase/media/type and complete property restrictions in each description; do not reuse a Product UUID for a Waste outlet, a whole-asset/pallet description for a repair part, a recycling-plant state for contaminated factory waste or a total indicator as a molecule. Missing compatible auxiliary UUIDs/providers remain explicit and cannot justify a fabricated binding. | `ilcd-attributional-allocation-2010` |\n| validate_complete_context | allmethodconditions | Retain all complete applicability, native-admission, collection, first-release, physical/provider and analytical conditions below in both language projections; no ID-only match, finite pass or future SOP supplies missing scientific evidence. | `harrison-prepreg-blank`; `richards-rod-manufacture`; `jwell-rod-factory`; `fantan-component-boundary`; `flexcoat-wrap-finish`; `ilcd-attributional-allocation-2010`; `un-cpc3-structure-2025`; `epa-method320`; `epa-method3c`; `epa-method5` |\n\n### Complete applicability and accounting context\n\nThis single CPC38450 record covers the manufacturing foreground of a complete new non-telescopic carbon-fibre/thermoset-epoxy fishing rod, with its actual configured sections and interfaces, installed line guides and tip-top, complete reel seat, actual EVA grip configuration and butt closure. Start with real whole externally supplied carbon/epoxy prepreg and separately scoped whole components; include receipt/refrigerated storage and actual conditioning, pattern cutting, mandrel tacking and rolling, consolidation tape, controlled curing, mandrel/tape removal, end trimming, straightness and surface grinding/sanding, actual qualified blank coating/branding, component fitting and guide wrapping, actual adhesive/coating mixing and drying/curing, checks and adjustments through unique first complete-rod quality release. Purchased-finished-rod repacking cannot satisfy this production route.\n\nHarrison positively identifies supplier-made epoxy carbon prepreg rolls and UD/finished-blank alternatives; Richards supplies the complete blank-to-finished-rod sequence and actual assembly/coating images; Jwell independently documents carbon-prepreg-to-packed-rod operations; Fantan distinguishes locally made blanks/guides/seats from purchased components. Flex Coat supports supplied two-part wrap finish, genuine failure/correction and solvent limitations. These form a transparent compatible technical synthesis, not the BOM, measurements, factory, order or SKU of one common product. This method chooses the carbon/epoxy route and whole purchased guide/seat/grip components; no glass reinforcement, in-house guide/reel-seat manufacture, fixed section count, cure schedule, composition fraction, wall thickness, rod mass, load capacity, lifetime, certification or yield is inferred from a catalogue or process image.\n\nExclude reels, fishing line, hooks/baits/lures, nets, tackle sets, decoys, hunting requisites, outdoor fishing service and customer use/end-of-life. Bare prepreg, dry carbon cloth, neat resin, a hollow tube, supplied bare blank or a component alone is not the complete reference rod. Glass/composite-glass principal structures, bamboo, telescopic construction and different principal forming routes are outside this bounded method. If the actual plant buys a cured blank, makes the guide/seat/grip locally or changes another principal supply boundary, reassess and revise this same CPC record with complete evidence and disjoint inventory before quantitative use; do not silently omit upstream production or create a parallel identity. Every real auxiliary, packaging, utility, species, maintenance and treatment exchange remains required when present.\n\nDeclare every required qualifier in dataset metadata, process notes, reference comment, product description or equivalent data-package fields; a missing qualifier makes that data-package reference incomplete. Mass comparison does not establish equal angling performance.\n\nNative Product family is manufactured finished fishing rods and other tackle, production mix at plant, reference Mass/kg. Here it denotes only one complete non-telescopic carbon/epoxy rod with its specified sections, joints, installed guides, tip-top, reel seat, grips and butt closure; no reel, line, hook, bait, net or use service. The isolated native comment “385 Games and toys” conflicts with the consistent rod basename and manufactured-product context; disclose this annotation defect rather than changing the physical identity. It supplies no composition, cure, stiffness, lifetime or article mass. Confirm actual complete BOM and acceptance; neither bare blank nor another tackle article is interchangeable.\n\nEach card is one actual conditional exchange and one direction. Its full description, native restrictions and numerator role govern use. All input/output masses remain genuine gross observations in cp_stocks; a burden-bearing ordinary production row may report its attributable demand while a gross card reports complete V. Each card’s collection protocol collects raw data only. Do not instantiate absent events, but retain nonzero origin W in a mixed-waste subledger even when a separate external W card is inapplicable. Additional actual exchanges require their own exact cards before a complete data-package claim.\n\nCollection tables preserve raw non-divided data. aggregation_rule names only the final per-reference view and repeats no arithmetic. The sole quotient is single_quotient; saved Y_i on a card identifies that exact result. The complete description and numerator role govern what A_i means, including A_i=V_i for every gross card.\n\nLock Q0 to unique original complete-rod first-quality-release events at the fixed completed-manufacturing gate. On that original mass/configuration/moisture basis, partition each cohort across disjoint net remaining deliveries, every actual on-site released state, irreversible losses and other terminal dispositions. Gross returns, repacking, retests, attempted repair and rework create no new event. Delivery plus closing FG is sufficient only when no other postgate states or exits exist. Changes in moisture, removed/replaced parts or finish require independently measured component/state conversions. Do not restore lost mass to a surviving rod and count that same loss again. Original Q0 remains fixed for all later services, and Q0=0/unknown retains raw totals with unresolved normalization.\n\nKeep the complete raw/WIP/FG, installed/spare/retired assets, packaging and retained-fluid physical ledger independently from the acceptance-event ledger and every attributable environmental/provider-service vector. Own opening WIP inherits its actual complete earlier foreground burdens once; closing WIP carries substantiated burdens to future cohorts. A provider aggregate and decomposition of its already embedded manufacturing/transport/asset history are mutually exclusive. Include actual failed, zero-output, cleanup, start/stop and rejected work. Neither already released FG nor an allocation share changes physical stocks or removes an already incurred burden.\n\nFor the physical display only, Qanalysis denotes the declared positive original Q_c=Q0, not a new acceptance basis. Each genuine contaminated wipe, glove, abrasive, stripped film, discarded package, equipment or mixed waste is one whole actual recipient event Qt containing its substrate, retained resin/solvent/dust and water once. Dry substrate and retained constituents are nested analytical/origin ledgers; they are not extra exported wastes unless physically separated before the boundary. Preserve full receiver/provider Qt and its actual extensive-unit basis. The gross-card saved Y=Qt/Qanalysis is a physical disclosure and never automatically a cohort treatment/provider demand. Model separate evidenced nonoverlapping treatment demand A/Q0 in compatible provider units with original cohort genealogy; do not shrink physical Qt by burden shares or charge full Qt to every served cohort. Unknown service shares/original Q0 remain unresolved. A separately collected stream and its fraction in a real mixed outlet cannot both be exports.\n\nArithmetic example only, not a source or study default: one10kg contaminated wipe event contains8kg substrate plus2kg retained resin/solvent/water. Independently evidenced25%/75% compatible treatment-service assignment gives2.5/7.5kg-equivalent demand; original Q0 of100/200kg gives0.025/0.0375kg-equivalent per reference. The physical receiver gets10kg once; there is no2.5kg physical waste, extra2kg contaminant export, duplicated10kg service demand or assumed sharing/lifetime.\n\nMaintain actual complete prepreg production upstream and actual local cut/roll/tape/cure/strip/trim/grind/finish/assembly. A whole supplied prepreg system includes its actual fibre, formulated resin, additives, supplied moisture, conditioning and transport once. The real additional resin/prepainting operation mentioned in the Richards route must be resolved against the actual supplied system: it is a separate specific whole actual formulation only if separately added, not silently omitted or bought again if embedded. A supplied finished blank cannot replace the manufacturing scope; a genuinely separate upstream blank, gas-control, thermal, steam, compressed-air, wastewater or utility producer must have complete actual matched inputs, composition, outputs, reaction chemistry, energy and waste burdens. Moving a known on-site unit to an assumed purchase/receiving stub is not allowed. Add every actual reagent, carrier, fuel, part and outlet as a specific atomic interface.\n\nActual alcohol flames, other real combustion and any thermal control require complete actual fuel/preparation, air or independently measured O2/N2/Ar/water intake, reactive species generation/consumption, final gas species, heat and losses; CO2 alone is not a burner. No source mentions a universal boiler, natural-gas grade, propane torch use or complete combustion for every rod. Preserve actual water supplied inside whole formulations, separately added/dilution water, steam/condensate/returns, absorbed moisture, evaporation and independently evidenced reaction water without double counting. Thermoset curing does not itself prove water formation or a fixed emission fraction. Internal transfers cancel once while real production/control/utility burdens remain.\n\nEvery candidate card is conditional on a real present interface; record present, evidenced absent, below detection and unknown distinctly. A source manufacturing example is not a measured current factory inventory. Actual whole formulations remain one supplied preparation only with full known supply/BOM/provider boundaries; generic VOC/NOx/COD/dust indicators cannot invent chemical species or fixed constituent fractions. Identify actual final release species, phase, medium and sampling position after real controls; collected whole condensate or mixed effluent goes to its actual receiver instead of also becoming the same emitted mass. Any necessary analytical/matrix/phase procedure not established remains a core methodological hold; future SOP, calibration or finite-check success cannot waive it. Ordinary actual site quantities, calibrations and provider qualification remain explicit study obligations, not invented defaults or a requirement for the same source factory/SKU.\n\nActual environmental analysis uses procedures within their real matrix and phase scope. EPA Method320 supplies extractive FTIR for IR-active vapor analytes with reference spectra, interference assessment, complete heated/validated conditioning, analyte-spike transport/recovery and its explicit matrix-validation procedure; it does not measure homonuclear N2/O2 or monatomic Ar or every particulate/liquid phase. EPA Method3C supplies GC-TCD component analysis, calibration/linearity, repeat analysis and wet/dry/dilution corrections for CO2/CH4/N2/O2 within its stated landfill/otherwise specified source scope; it is not automatic authorization for this rod plant or Ar analysis. Retain its collection cross-references and actual sampling/air-ingress/condensate-loss qualification; do not subtract real carrier or combustion N2/O2 as assumed contamination. EPA Method5 supplies its defined filterable-PM isokinetic sampling, recovery and gravimetry, not all condensable or wet-mist mass. Cured composite sanding PM is the actual whole particulate mixture, with independently evidenced composition, not pure elemental carbon or a default split. Actual Ar and any further genuine species require their applicable actual species/matrix procedure; no default atmospheric fraction or residual-fitted Ar is allowed. Collected mist/condensate and genuine liquid effluent have their own whole receiver and actual composition. An unestablished essential procedure remains an explicit hold; site calibration/QA within an established procedure is a separate uncompleted study qualification, never claimed passed here.\n\n\nAgilent5994-4552EN (18 January2022), Noble Gases Analysis Using the Agilent990 Micro GC, demonstrates Ar/O2 baseline separation in a nitrogen-balance standard and nitrogen/air analysis using a Molesieve5Å micro-GC channel, helium carrier and moisture/CO2 backflush protection. Its single-concentration repeatability and detection-limit results establish an analytical approach, not multipoint calibration/linearity, complete sample-train recovery or applicability to this rod plant’s actual hot/wet final outlet. Column protection does not prove quantitative recovery through conditioning. For each genuine Ar leg retain the actual intake or final outlet, sample time and flow, wet/dry basis, temperature/pressure, background and air ingress, conditioning and condensate losses, analyte-specific response/calibration, Ar/O2 separation and actual matrix/transport recovery evidence before integration to kg. Do not transfer source settings, concentrations, detection limits, repeatability thresholds or atmospheric fractions as defaults; do not infer Ar from a residual. An unestablished essential sampling/analytical/matrix procedure remains hold; ordinary calibration and QA within an established procedure remain separate actual-study obligations, not a claim of qualification. This source does not establish any actual plant emission or repair another unknown species/phase method.\n\n"
