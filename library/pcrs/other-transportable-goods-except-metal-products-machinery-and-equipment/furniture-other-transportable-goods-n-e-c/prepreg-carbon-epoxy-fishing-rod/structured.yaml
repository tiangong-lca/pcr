          line: 4707
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\nOnly the following attributional allocation conditions apply; physical gross quantities remain outside burden shares.\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_scope | only attributional cases requiring allocation | Apply this hierarchy only in the declared attributional modelling situation where allocation is required. Manufacturer process text does not establish allocation. Separate exclusive operations and exchange burdens first, by actual subdivision or defensible virtual subdivision; raw materials embodied solely in the rod and its specific local operations remain with that function. | `ilcd-attributional-allocation-2010` |\n| allocation_physical | remaining individual exchanges | For each remaining exchange identify the determining physical causal relationship and real measured driver to each co-function; justify why that driver changes that exchange. Different exchanges may need different causes. Actual machine/cure cycles, time with the relevant capacity/occupied volume/area, coated surface or measured material pathway may support a choice, but mass, item count, processing time and economics are not freely interchangeable defaults. Assigned vectors across functions must sum to the original vector. | `ilcd-attributional-allocation-2010` |\n| allocation_residual | genuinely unresolved joint-process remainder | Only after documenting why subdivision and determining physical causality cannot resolve the remaining joint-process burden may contemporaneous market values at the same real common process gate and supplied quantity/quality/state allocate that remainder. Remove downstream transport/conditioning margins consistently when deriving gate values; do not compare retail finished rods with unconditioned waste or apply a fixed economic ratio to all flows. | `ilcd-attributional-allocation-2010` |\n| allocation_waste | failures samples scraps and treatment | Ordinary production waste, rejection, breakage, destructive samples and their handling/treatment stay with the production/service function causing them, even when externally transferred or sold. A one-time burden transfer T_other requires an actual distinct other cohort/function and justified allocation/handover, with destination, state and complete inherited vector; sale or external shipment alone is insufficient. Full gross physical legs never shrink. No automatic avoided virgin material, energy, heat or disposal credit. | `ilcd-attributional-allocation-2010` |\n| allocation_stocks | stocks assets packaging and service | Attribute only actual consumed inherited burden to the correct cohort. Manufacturing uses B_open + U - B_close - justified T_other, where B_close excludes already first-released FG and includes only genuine raw/WIP/unassigned stores. Original-cohort performed service remains attributable through its observed H even for held FG; only unused/unassigned charge or capacity burden is deferred. Asset physical acquisitions and package gross events retain V in full, while their upstream/service burden is owned and assigned once separately. A stock-corrected source record cannot be corrected again. | `ilcd-attributional-allocation-2010` |\n\n"
