  calculation_rules:
    - id: raw_unit_conversion
      applies_to: "raw observations before attribution"
      rule: "Convert only true original units: MJ = 3.6 * measured_kWh; kg_i = cumulative_volume_i * independently_measured_density_i_at_actual_state. Integrate a genuine rate once over its matched observed time, whereas a cumulative meter/integrated volume is not multiplied by time. Keep carrier mass/enthalpy and relevant constituent mass disjoint from their whole supply owner."
      inputs:
        - raw_observation
        - observed_time
        - measured_density
        - actual_state
      output: "converted_raw"
      source_ids:
        - ilcd-attributional-allocation-2010
    - id: cohort_numerators
      applies_to: "burden dimensions only"
      rule: "For each original exchange dimension retain the full inherited vectors. Manufacturing attributable A_i = B_open_i + U_i - B_close_i - justified_T_other_i, with B_close limited to raw/WIP/genuinely unused or unassigned non-WIP stores. Use an already stock-corrected U directly without subtracting stores again. For original-cohort service A_i contains all actual consumed/performed burden through H plus inherited assigned burden; defer only genuinely unused/unassigned capacity/charge burden. Released FG is not B_close. Ordinary waste/sale is not T_other. These burden dimensions are not the physical numerators of gross cards."
      inputs:
        - B_open_i
        - U_i
        - B_close_i
        - justified_T_other_i
        - cohort
        - H
        - cp_vectors
      output: "attributed_burden_A_i"
      source_ids:
        - ilcd-attributional-allocation-2010
    - id: gross_numerators
      applies_to: "every gross physical card"
      rule: "A_i = V_i, the full actual independently measured gross physical event in that card’s own native unit. Never substitute B_open + U - B_close, service burden, a coproduct/economic share or net shipments. Its disclosed physical Y_i creates no extra procurement/provider/credit. The same real event’s upstream or service burden is owned and attributed once as a distinct burden dimension."
      inputs:
        - V_i
        - event_id
        - physical_state
        - owner
        - cp_vectors
      output: "physical_A_i"
      source_ids:
        - ilcd-attributional-allocation-2010
    - id: pack_pool_balance
      applies_to: "each actual single packaging pool"
      rule: "Opening_empty + Opening_attached_WIP_FG + Opening_reusable + P + I + ER + actual_disjoint_repair_or_moisture_in = Closing_empty + Closing_attached_WIP_FG + Closing_reusable + gross_S + EO + W_raw + actual_disjoint_moisture_or_material_out. Internal reuse/handoffs cancel once. Whole wet P/I and their water/components are not added twice. X_in/X_out remove only overlapping other incoming/outgoing flow terms on the same side, never a stock or the opposite physical leg; new retained influx and complete closing wet mass both remain. For one mixed outlet sum non-overlapping origin W_raw only to the measured whole mixture and assign its treatment/provider once."
      inputs:
        - opening_pools
        - closing_pools
        - P
        - I
        - ER
        - gross_S
        - EO
        - W_raw
        - disjoint_bridges
        - cp_vectors
      output: "pack_physical_closure"
      source_ids:
        - ilcd-attributional-allocation-2010
    - id: physical_gate_balance
      applies_to: "manufacturing/FG/consolidated physical gates"
      rule: "For each disjoint physical material and relevant element use actual opening mass + actual gross incoming + independently evidenced reaction/source terms = actual closing mass + actual gross outgoing. Manufacture includes Q as its internal first-release handoff; FG includes the matching Q receipt; consolidation cancels them once. Keep water absorbed/evaporated in ordinary storage, carrier returns, retained installed fluids, failures and actual losses. Reaction/free/phase/structural water need separate independent evidence; one fitted residual cannot establish multiple unknowns. This physical equation is never scaled by burden allocation shares."
      inputs:
        - opening_physical
        - gross_in
        - reaction_evidence
        - closing_physical
        - gross_out
        - Q
        - cp_stocks
      output: "physical_and_element_closure"
      source_ids:
        - ilcd-attributional-allocation-2010
    - id: single_quotient
      applies_to: "all inventory rows"
      rule: "Y_i = A_i / Q_c. A_i is the prepared raw numerator of the selected dimension; gross cards use complete V_i, burden dimensions use only their justified attributable vector, and the reference row uses its own Q. Q_c is positive measured first-release cohort mass or the linked original cohort mass for actual service. Execute once and store Y_i; card Amount fields and protocol aggregation labels refer to this same saved result without another division. With Q_c = 0 retain raw loads/stocks and issue no unit result."
      inputs:
        - A_i
        - Q_c
        - cp_release
        - cp_vectors
      output: "Y_i"
      source_ids:
        - ilcd-attributional-allocation-2010
  data_quality_requirements:
    - id: dq_complete_identity
      applies_to: "reference and supplied articles"
      requirement: "Match the actual complete rod BOM, supply state and every hard native material/form/phase/route/grade/geography/media/type restriction; a UUID or catalogue weight alone is insufficient. Keep unresolved ordinary auxiliary identities explicit."
      evidence: "Supplier technical records; original native identity; controlled drawings; incoming/first-release inspection"
    - id: dq_measurement
      applies_to: "all raw observations"
      requirement: "Retain original non-divided measurements with units, uncertainty, calibration, tare, density/state and rate/integral distinction; no nominal rod mass or composition inferred from a conversion coefficient."
      evidence: "Raw scale/meter records; calibration; material-state tests; calculation trail"
    - id: dq_cohort
      applies_to: "cohorts and stores"
      requirement: "Account every failure, zero-output period, start/stop, cleanup, test, rejected and attempted rework load with opening/closing raw/WIP/non-WIP physical and every inherited exchange vector. No second stock correction or released-FG manufacture deduction."
      evidence: "Lot/serial history; stock-state ledgers; complete source-vector provenance"
    - id: dq_services
      applies_to: "actual original-cohort service"
      requirement: "Identify original Q_c, observed H and actual performed work independently of FG dispatch. Continued qualification requires permission/spec and post-work tests/acceptance; performed unauthorized/failed work remains recorded with real hold/waste disposition."
      evidence: "Service-time/driver records; manufacturer decisions; tests; disposition register"
    - id: dq_pools
      applies_to: "packaging repair and assets"
      requirement: "Verify each actual packaging six-leg pool and full wet stocks, whole supplied-article and disjoint repair/moisture bridges, new/used asset/part events, installed fluid and consumed capacity burden. Check every card description for wrong inherited identities; pallet is not plank, PE not PET, film not resin, whole guide not a ring alone."
      evidence: "Matched gross event IDs; measured component origins; physical balances; upstream owner links"
    - id: dq_allocation
      applies_to: "burden attribution"
      requirement: "Document subdivision, each determining physical cause and any genuinely residual same-gate contemporaneous market values; prove full vector conservation. Waste sale/external transfer does not itself justify T_other or a credit."
      evidence: "Causal driver evidence; common-gate states/prices; receiver handover; conserved vectors"
    - id: dq_sources
      applies_to: "external technical evidence"
      requirement: "Use complete relevant originals and context; distinguish product-route examples from measured plant data and allocation methodology. No supplier’s numeric recipe or operating example becomes a universal default."
      evidence: "Primary technical originals; source-specific applicability and limitations; complete context"
    - id: dq_completeness
      applies_to: "concrete foreground data package"
      requirement: "Instantiate all actual exchanges, provider boundaries and real species/outlets before claiming completeness; disclose missing quantities/providers/composition and uncertainty. Ordinary gaps do not prove absent manufacture, and failed retrieval does not prove absence in a database."
      evidence: "Complete actual BOM/route/meter/outlet reconciliation and unresolved-gap register"
validation_rules:
  - rule_id: validate_terminal
    applies_to: "complete reference rod"
    rule: "Reject a bare blank/material/part or different tackle terminal. Check every required qualifier, whole-rod BOM, same configured first-release Q and explicit finished_rod Product output. A compatible broad native family does not approve another terminal or methodology."
    source_ids:
      - richards-rod-manufacture
      - jwell-rod-factory
      - fantan-component-boundary
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Require native unit chains and actual numerator measurements/conversions, the correct original Q_c/H, one single_quotient application and no per-card or aggregation redivision. Unknown relationships remain inconclusive. Q_c zero retains raw burden and no normalized output; check results are not measured factory data."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: validate_physical
    applies_to: "physical gates and gross cards"
    rule: "Independently reconcile manufacture, FG and consolidated full physical/relevant-element gates; cancel internal Q/handoffs once. Gross V is never an attributed burden or economic share. Check all packaging P/I/ER/S/EO/W events, true full wet opening/closing stores, retained new influx, every same-side X bridge, one actual mixed-waste outlet and provider/treatment once. No invented symmetric outlets or residual-fitted species."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: validate_failures
    applies_to: "production and service history"
    rule: "Preserve every actual failed/rejected/unauthorized attempt, waste, sample, treatment, startup, idle and rework burden, including Q-zero cohorts. Manufacturer permission and actual post-work acceptance control continued qualification, not deletion of already performed work. No broken-composite restoration is presumed."
    source_ids:
      - richards-rod-manufacture
      - flexcoat-wrap-finish
      - ilcd-attributional-allocation-2010
  - rule_id: validate_supply
    applies_to: "each selected flow card"
    rule: "Check actual native material/form/grade/route/geography/phase/media/type and complete property restrictions in each description; do not reuse a Product UUID for a Waste outlet, a whole-asset/pallet description for a repair part, a recycling-plant state for contaminated factory waste or a total indicator as a molecule. Missing compatible auxiliary UUIDs/providers remain explicit and cannot justify a fabricated binding."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: validate_complete_context
    applies_to: "allmethodconditions"
    rule: "Retain all complete applicability, native-admission, collection, first-release, physical/provider and analytical conditions below in both language projections; no ID-only match, finite pass or future SOP supplies missing scientific evidence."
    source_ids:
      - harrison-prepreg-blank
      - richards-rod-manufacture
      - jwell-rod-factory
      - fantan-component-boundary
      - flexcoat-wrap-finish
      - ilcd-attributional-allocation-2010
      - un-cpc3-structure-2025
      - epa-method320
      - epa-method3c
      - epa-method5
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "This single CPC38450 record covers the manufacturing foreground of a complete new non-telescopic carbon-fibre/thermoset-epoxy fishing rod, with its actual configured sections and interfaces, installed line guides and tip-top, complete reel seat, actual EVA grip configuration and butt closure. Start with real whole externally supplied carbon/epoxy prepreg and separately scoped whole components; include receipt/refrigerated storage and actual conditioning, pattern cutting, mandrel tacking and rolling, consolidation tape, controlled curing, mandrel/tape removal, end trimming, straightness and surface grinding/sanding, actual qualified blank coating/branding, component fitting and guide wrapping, actual adhesive/coating mixing and drying/curing, checks and adjustments through unique first complete-rod quality release. Purchased-finished-rod repacking cannot satisfy this production route."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Harrison positively identifies supplier-made epoxy carbon prepreg rolls and UD/finished-blank alternatives; Richards supplies the complete blank-to-finished-rod sequence and actual assembly/coating images; Jwell independently documents carbon-prepreg-to-packed-rod operations; Fantan distinguishes locally made blanks/guides/seats from purchased components. Flex Coat supports supplied two-part wrap finish, genuine failure/correction and solvent limitations. These form a transparent compatible technical synthesis, not the BOM, measurements, factory, order or SKU of one common product. This method chooses the carbon/epoxy route and whole purchased guide/seat/grip components; no glass reinforcement, in-house guide/reel-seat manufacture, fixed section count, cure schedule, composition fraction, wall thickness, rod mass, load capacity, lifetime, certification or yield is inferred from a catalogue or process image."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Exclude reels, fishing line, hooks/baits/lures, nets, tackle sets, decoys, hunting requisites, outdoor fishing service and customer use/end-of-life. Bare prepreg, dry carbon cloth, neat resin, a hollow tube, supplied bare blank or a component alone is not the complete reference rod. Glass/composite-glass principal structures, bamboo, telescopic construction and different principal forming routes are outside this bounded method. If the actual plant buys a cured blank, makes the guide/seat/grip locally or changes another principal supply boundary, reassess and revise this same CPC record with complete evidence and disjoint inventory before quantitative use; do not silently omit upstream production or create a parallel identity. Every real auxiliary, packaging, utility, species, maintenance and treatment exchange remains required when present."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Declare every required qualifier in dataset metadata, process notes, reference comment, product description or equivalent data-package fields; a missing qualifier makes that data-package reference incomplete. Mass comparison does not establish equal angling performance."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "Native Product family is manufactured finished fishing rods and other tackle, production mix at plant, reference Mass/kg. Here it denotes only one complete non-telescopic carbon/epoxy rod with its specified sections, joints, installed guides, tip-top, reel seat, grips and butt closure; no reel, line, hook, bait, net or use service. The isolated native comment “385 Games and toys” conflicts with the consistent rod basename and manufactured-product context; disclose this annotation defect rather than changing the physical identity. It supplies no composition, cure, stiffness, lifetime or article mass. Confirm actual complete BOM and acceptance; neither bare blank nor another tackle article is interchangeable."
    source_ids: []
  - rule_id: validation_rule_12
    applies_to: "foreground_dataset_conformance"
    rule: "Each card is one actual conditional exchange and one direction. Its full description, native restrictions and numerator role govern use. All input/output masses remain genuine gross observations in cp_stocks; a burden-bearing ordinary production row may report its attributable demand while a gross card reports complete V. Each card’s collection protocol collects raw data only. Do not instantiate absent events, but retain nonzero origin W in a mixed-waste subledger even when a separate external W card is inapplicable. Additional actual exchanges require their own exact cards before a complete data-package claim."
    source_ids: []
  - rule_id: validation_rule_13
    applies_to: "foreground_dataset_conformance"
    rule: "Collection tables preserve raw non-divided data. aggregation_rule names only the final per-reference view and repeats no arithmetic. The sole quotient is single_quotient; saved Y_i on a card identifies that exact result. The complete description and numerator role govern what A_i means, including A_i=V_i for every gross card."
    source_ids: []
  - rule_id: validation_rule_14
    applies_to: "foreground_dataset_conformance"
    rule: "Lock Q0 to unique original complete-rod first-quality-release events at the fixed completed-manufacturing gate. On that original mass/configuration/moisture basis, partition each cohort across disjoint net remaining deliveries, every actual on-site released state, irreversible losses and other terminal dispositions. Gross returns, repacking, retests, attempted repair and rework create no new event. Delivery plus closing FG is sufficient only when no other postgate states or exits exist. Changes in moisture, removed/replaced parts or finish require independently measured component/state conversions. Do not restore lost mass to a surviving rod and count that same loss again. Original Q0 remains fixed for all later services, and Q0=0/unknown retains raw totals with unresolved normalization."
    source_ids: []
  - rule_id: validation_rule_15
    applies_to: "foreground_dataset_conformance"
    rule: "Keep the complete raw/WIP/FG, installed/spare/retired assets, packaging and retained-fluid physical ledger independently from the acceptance-event ledger and every attributable environmental/provider-service vector. Own opening WIP inherits its actual complete earlier foreground burdens once; closing WIP carries substantiated burdens to future cohorts. A provider aggregate and decomposition of its already embedded manufacturing/transport/asset history are mutually exclusive. Include actual failed, zero-output, cleanup, start/stop and rejected work. Neither already released FG nor an allocation share changes physical stocks or removes an already incurred burden."
    source_ids: []
  - rule_id: validation_rule_16
    applies_to: "foreground_dataset_conformance"
    rule: "For the physical display only, Qanalysis denotes the declared positive original Q_c=Q0, not a new acceptance basis. Each genuine contaminated wipe, glove, abrasive, stripped film, discarded package, equipment or mixed waste is one whole actual recipient event Qt containing its substrate, retained resin/solvent/dust and water once. Dry substrate and retained constituents are nested analytical/origin ledgers; they are not extra exported wastes unless physically separated before the boundary. Preserve full receiver/provider Qt and its actual extensive-unit basis. The gross-card saved Y=Qt/Qanalysis is a physical disclosure and never automatically a cohort treatment/provider demand. Model separate evidenced nonoverlapping treatment demand A/Q0 in compatible provider units with original cohort genealogy; do not shrink physical Qt by burden shares or charge full Qt to every served cohort. Unknown service shares/original Q0 remain unresolved. A separately collected stream and its fraction in a real mixed outlet cannot both be exports."
    source_ids: []
  - rule_id: validation_rule_17
    applies_to: "foreground_dataset_conformance"
    rule: "Arithmetic example only, not a source or study default: one10kg contaminated wipe event contains8kg substrate plus2kg retained resin/solvent/water. Independently evidenced25%/75% compatible treatment-service assignment gives2.5/7.5kg-equivalent demand; original Q0 of100/200kg gives0.025/0.0375kg-equivalent per reference. The physical receiver gets10kg once; there is no2.5kg physical waste, extra2kg contaminant export, duplicated10kg service demand or assumed sharing/lifetime."
    source_ids: []
  - rule_id: validation_rule_18
    applies_to: "foreground_dataset_conformance"
    rule: "Maintain actual complete prepreg production upstream and actual local cut/roll/tape/cure/strip/trim/grind/finish/assembly. A whole supplied prepreg system includes its actual fibre, formulated resin, additives, supplied moisture, conditioning and transport once. The real additional resin/prepainting operation mentioned in the Richards route must be resolved against the actual supplied system: it is a separate specific whole actual formulation only if separately added, not silently omitted or bought again if embedded. A supplied finished blank cannot replace the manufacturing scope; a genuinely separate upstream blank, gas-control, thermal, steam, compressed-air, wastewater or utility producer must have complete actual matched inputs, composition, outputs, reaction chemistry, energy and waste burdens. Moving a known on-site unit to an assumed purchase/receiving stub is not allowed. Add every actual reagent, carrier, fuel, part and outlet as a specific atomic interface."
    source_ids: []
  - rule_id: validation_rule_19
    applies_to: "foreground_dataset_conformance"
    rule: "Actual alcohol flames, other real combustion and any thermal control require complete actual fuel/preparation, air or independently measured O2/N2/Ar/water intake, reactive species generation/consumption, final gas species, heat and losses; CO2 alone is not a burner. No source mentions a universal boiler, natural-gas grade, propane torch use or complete combustion for every rod. Preserve actual water supplied inside whole formulations, separately added/dilution water, steam/condensate/returns, absorbed moisture, evaporation and independently evidenced reaction water without double counting. Thermoset curing does not itself prove water formation or a fixed emission fraction. Internal transfers cancel once while real production/control/utility burdens remain."
    source_ids: []
  - rule_id: validation_rule_20
    applies_to: "foreground_dataset_conformance"
    rule: "Every candidate card is conditional on a real present interface; record present, evidenced absent, below detection and unknown distinctly. A source manufacturing example is not a measured current factory inventory. Actual whole formulations remain one supplied preparation only with full known supply/BOM/provider boundaries; generic VOC/NOx/COD/dust indicators cannot invent chemical species or fixed constituent fractions. Identify actual final release species, phase, medium and sampling position after real controls; collected whole condensate or mixed effluent goes to its actual receiver instead of also becoming the same emitted mass. Any necessary analytical/matrix/phase procedure not established remains a core methodological hold; future SOP, calibration or finite-check success cannot waive it. Ordinary actual site quantities, calibrations and provider qualification remain explicit study obligations, not invented defaults or a requirement for the same source factory/SKU."
    source_ids: []
  - rule_id: validation_rule_21
    applies_to: "foreground_dataset_conformance"
    rule: "Actual environmental analysis uses procedures within their real matrix and phase scope. EPA Method320 supplies extractive FTIR for IR-active vapor analytes with reference spectra, interference assessment, complete heated/validated conditioning, analyte-spike transport/recovery and its explicit matrix-validation procedure; it does not measure homonuclear N2/O2 or monatomic Ar or every particulate/liquid phase. EPA Method3C supplies GC-TCD component analysis, calibration/linearity, repeat analysis and wet/dry/dilution corrections for CO2/CH4/N2/O2 within its stated landfill/otherwise specified source scope; it is not automatic authorization for this rod plant or Ar analysis. Retain its collection cross-references and actual sampling/air-ingress/condensate-loss qualification; do not subtract real carrier or combustion N2/O2 as assumed contamination. EPA Method5 supplies its defined filterable-PM isokinetic sampling, recovery and gravimetry, not all condensable or wet-mist mass. Cured composite sanding PM is the actual whole particulate mixture, with independently evidenced composition, not pure elemental carbon or a default split. Actual Ar and any further genuine species require their applicable actual species/matrix procedure; no default atmospheric fraction or residual-fitted Ar is allowed. Collected mist/condensate and genuine liquid effluent have their own whole receiver and actual composition. An unestablished essential procedure remains an explicit hold; site calibration/QA within an established procedure is a separate uncompleted study qualification, never claimed passed here."
    source_ids: []
  - rule_id: validation_rule_22
    applies_to: "foreground_dataset_conformance"
    rule: "Agilent5994-4552EN (18 January2022), Noble Gases Analysis Using the Agilent990 Micro GC, demonstrates Ar/O2 baseline separation in a nitrogen-balance standard and nitrogen/air analysis using a Molesieve5Å micro-GC channel, helium carrier and moisture/CO2 backflush protection. Its single-concentration repeatability and detection-limit results establish an analytical approach, not multipoint calibration/linearity, complete sample-train recovery or applicability to this rod plant’s actual hot/wet final outlet. Column protection does not prove quantitative recovery through conditioning. For each genuine Ar leg retain the actual intake or final outlet, sample time and flow, wet/dry basis, temperature/pressure, background and air ingress, conditioning and condensate losses, analyte-specific response/calibration, Ar/O2 separation and actual matrix/transport recovery evidence before integration to kg. Do not transfer source settings, concentrations, detection limits, repeatability thresholds or atmospheric fractions as defaults; do not infer Ar from a residual. An unestablished essential sampling/analytical/matrix procedure remains hold; ordinary calibration and QA within an established procedure remain separate actual-study obligations, not a claim of qualification. This source does not establish any actual plant emission or repair another unknown species/phase method."
    source_ids: []
published_dataset_profile:
  dataset_role: "manufacturing_foreground"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "The exact declared complete rod configuration and evidenced supply/manufacturing route after actual foreground collection and explicit gap disclosure"
  excluded_use: "All CPC38450 products by default; other terminals/routes; universal per-rod weight/performance/lifetime; fishing service; complete cradle-to-gate claims without upstream links"
  required_metadata: "actual site and reporting period; complete configured rod BOM and revision; non-telescopic carbon thermoset-epoxy structure and actual section/joint configuration; whole prepreg supplied state and supplier fibre/resin/finish boundary; whole guide and tip-top frames/rings supplied once; complete reel-seat hardware and no reel/line/hooks/baits supplied; actual EVA grip and butt closure inclusions; actual cutting/rolling/tape/cure/trim/sanding/coating/branding/assembly conditions; actual whole adhesive/coating/cleaning formulations and disjoint mixing subaccounts; manufacturer-required whole-rod inspections and acceptance/disposition; calibrated complete net rod mass and actual moisture/configuration; unique first-release cohort Q and release history; raw/WIP/non-WIP stores and complete per-exchange inherited vectors; released FG history and original service Q_c/H without new Q; full gross packaging P/I/ER/S/EO/W pools and upstream owner; actual assets/new and used repair parts/installed fluid and moisture bridges; actual utility supplier geography/voltage/delivery carrier and enthalpy; real molecular gas phases/sources/receiving media and actual waste outlets; complete native family restrictions in each selected card; unresolved identities/providers/quantities and uncertainty disclosed"
  required_quality_disclosure: "Actual raw measurements and uncertainty; every unresolved flow/provider/quantity; stock/vector and physical closure; observed service horizon; exact native applicability; no implied review or publication"
  update_trigger: "Actual rod structure/supply-form/route/native identity or supplier boundary changes; evidence or test criteria change; new actual flows or unresolved closure"
