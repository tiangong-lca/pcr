          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Whole supplied carbon/epoxy prepreg and independently scoped whole components before local rod manufacture |\n| starting_condition_role | material_inputs |\n| product_classification_scope | CPC3.0:38450 complete carbon/epoxy fishing-rod method subset in the one existing category record |\n| recursive_input_rule | Whole supplied articles inherit upstream burden once; local operations/ingredients are separate only when real. Internal blank/spigot handoffs cancel once without a new purchase or Q. |\n| upstream_dataset_requirement | Compatible material/form/route/grade/type and actual supplier geography/delivery boundary for each whole formulation/article, utility and waste receiver; identity is not a provider inventory. |\n| disclosure | Actual site/cohort/gates/supply forms; all raw observations and stock vectors; observed service H; whole-article and moisture bridges; owners, gaps and uncertainty. |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_route | manufacture | Include the complete section1 manufacturing route and actual outsourced upstream operations once. The prepreg is a whole supplied formulation; guide/seat/grip supply is whole. Local mixing, cut/roll/tape/cure/strip/trim/sand, fitting, coating, handling, failed trials, adjustments and final tests retain their real loads. No bought-finished-rod shortcut or duplicate included fibre/resin/metal. | `harrison-prepreg-blank`; `richards-rod-manufacture`; `jwell-rod-factory`; `fantan-component-boundary` |\n| boundary_cohorts | all production and service | Keep opening/closing raw stock, WIP and every non-WIP retained charge/service store in separate physical and full inherited per-exchange vector ledgers. Include all startup/shutdown, idle, zero-output, cleanup, failed/rejected/test samples, rework and treatment loads. Already stock-corrected consumption is not corrected again. Performed original-cohort service is never removed because the rod remains in closing FG; only genuinely unused/unassigned service or charge burden can carry forward. | `ilcd-attributional-allocation-2010`; `richards-rod-manufacture` |\n| boundary_first_release | manufacturing/FG/consolidated gates | Use consistent physical gates: manufacture to unique first complete-rod release; FG warehouse to actual gross outward movements; consolidated manufacture plus FG after cancelling the same Q and all internal handoffs once. Released closing FG is not an additional production output and its manufacturing burden is not a closing manufacture deduction. Keep original FG cohort mass/state, physical shipment/return legs and actual incremental work separate. Never substitute a net-delivery model without the full original delivery-reversal and historical FG burden bridge. | `richards-rod-manufacture`; `jwell-rod-factory`; `ilcd-attributional-allocation-2010` |\n| boundary_service | service | Actual post-release storage, packaging, handling, loading and dispatch remain within their observed original-cohort horizon H and Q_c. Unshipped FG has real observed service but no invented future work or completed-dispatch claim. Record actual returns, broken/held rods, attempted repairs and disposition. Manufacturer/specification permission, post-work tests and acceptance authorize continued qualified status; unauthorized, failed or rejected real work still retains all physical flows and loads. Do not presume restoration of broken composite structure or another first release. Ordinary humidity exchange needs no repair occurrence or permission. | `richards-rod-manufacture`; `flexcoat-wrap-finish`; `ilcd-attributional-allocation-2010` |\n| boundary_packaging | each actual packaging pool | Each single packaging material/article has explicit conditional P/I/ER/S/EO/W cards and raw pool protocol. Whole wet P/I includes supplier-applied layers, seals, ink, adhesive, fixtures and water once; supplier-included ingress remains a real physical receipt with one upstream owner. Opening/closing empty, attached WIP/FG and reusable stock are all included. Internal reuse cancels; P/I is not cancelled because its new mass remains in closing stock. W pools of one true mixed waste are independent origin subledgers, not duplicate external exchanges. Add every other actual bag/liner/thread/tube/closure separately, with one whole supplied-article bridge or disjoint site-fabrication account; no generic packaging pool exchange. | `richards-rod-manufacture`; `jwell-rod-factory`; `ilcd-attributional-allocation-2010` |\n| boundary_assets | support and all retained media | Keep full gross new/used asset and repair-part/flow events and actual installed oil/refrigerant/water stocks independently of service-burden allocation. Include real old parts/fluids removed and new parts/fluids received; an included new-machine charge is bridged once. Do not scale physical assets, wastes, water or gross shipments by economic shares. For material/moisture X_in/X_out remove only another incoming/outgoing flow-term duplicate on the same side, never the opposite leg or full closing stock. Retained new influx and full closing wet mass coexist. | `ilcd-attributional-allocation-2010` |\n| boundary_utilities | each actual utility | Use actual electricity, heat, each fuel, air, every water/steam carrier and external Product return separately with full physical state/enthalpy and supplier boundary. No default boiler or steam operation. A whole utility provider is assigned once; do not add both its supply and already included own inputs, nor aggregate air plus the same gas constituents. Include real leaks, failed runs and utility treatment, with native property units retained. | `richards-rod-manufacture`; `ilcd-attributional-allocation-2010` |\n| boundary_species | physical mass and relevant elements | Close actual gross physical mass and relevant element ledgers before burden allocation, using independently observed species, composition and states. Whole supplied wet articles, free/carrier water, genuine reaction water and any independently evidenced structural/bound water stay distinct and non-additive. Thermoset curing does not by itself prove a water-producing reaction. Do not use one residual to fit two unknowns, assume water density, convert COD/VOC/NOx/total dust/total element tests to a chosen molecule, or fabricate matching opposite exports. | `harrison-prepreg-blank`; `richards-rod-manufacture`; `ilcd-attributional-allocation-2010` |\n| boundary_extend_actual | all inventory | Cards are conditional possible single exchanges, not a universal BOM or zero-filled checklist. Before a concrete data package claims completeness, instantiate every real different formulation/component/utility/species/waste/packaging/repair/treatment event as its own card with compatible identity, raw protocol and provider. Missing measurement or UUID is explicit; not_applicable needs affirmative physical-route evidence. A real mixed outlet is one Waste exchange with independently measured non-additive origins, never a way to conceal missing inputs or emissions. | `richards-rod-manufacture`; `jwell-rod-factory`; `ilcd-attributional-allocation-2010` |\n\n"
