          markdown: "# Non-telescopic carbon/epoxy fishing rod manufacture from supplied prepreg\n\nAll rules apply only to a complete new non-telescopic carbon-fibre/thermoset-epoxy fishing rod locally made from whole supplied prepreg with whole purchased configured guides/tip-top, reel seat, actual EVA grip and butt closure. All configured sections and joints belong to that terminal. Glass-reinforced principal structures, bamboo, telescopic or other principal forming routes, bare blanks/tubes/materials/parts, reels/line/hooks/baits/nets/tackle sets/decoys and fishing-use services are excluded. Changed principal supply or component-manufacturing boundaries require an evidence-based revision of this same CPC record before quantitative use, never a silent shortcut or parallel identity. The quantitative reference is first quality release; gross physical movements, attributed upstream burdens, inherited stocks and subsequent original-cohort service horizons are distinct dimensions. A source example, family UUID or this candidate does not establish a measured factory inventory or approval.\n\n"
    - unit_id: "normative_812515"
      family: "validation"
      span:
