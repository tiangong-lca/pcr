      collection_method: "Collect original receipts, issues/consumption, meters, actual process-state measurements and full inherited exchange vectors by actual lot/cohort and observed horizon; include all failures/tests/rework/cleanup. Distinguish already stock-corrected consumption from gross receipts and preserve full physical V independently. Collection performs no division; identify A_i and Y_i later by the single calculation rule."
