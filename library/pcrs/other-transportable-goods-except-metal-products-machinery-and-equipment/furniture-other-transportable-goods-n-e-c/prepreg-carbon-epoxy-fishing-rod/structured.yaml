allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Only the following attributional allocation conditions apply; physical gross quantities remain outside burden shares."
    source_ids: []
  - rule_id: allocation_scope
    applies_to: "only attributional cases requiring allocation"
    rule: "Apply this hierarchy only in the declared attributional modelling situation where allocation is required. Manufacturer process text does not establish allocation. Separate exclusive operations and exchange burdens first, by actual subdivision or defensible virtual subdivision; raw materials embodied solely in the rod and its specific local operations remain with that function."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: allocation_physical
    applies_to: "remaining individual exchanges"
    rule: "For each remaining exchange identify the determining physical causal relationship and real measured driver to each co-function; justify why that driver changes that exchange. Different exchanges may need different causes. Actual machine/cure cycles, time with the relevant capacity/occupied volume/area, coated surface or measured material pathway may support a choice, but mass, item count, processing time and economics are not freely interchangeable defaults. Assigned vectors across functions must sum to the original vector."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: allocation_residual
    applies_to: "genuinely unresolved joint-process remainder"
    rule: "Only after documenting why subdivision and determining physical causality cannot resolve the remaining joint-process burden may contemporaneous market values at the same real common process gate and supplied quantity/quality/state allocate that remainder. Remove downstream transport/conditioning margins consistently when deriving gate values; do not compare retail finished rods with unconditioned waste or apply a fixed economic ratio to all flows."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: allocation_waste
    applies_to: "failures samples scraps and treatment"
    rule: "Ordinary production waste, rejection, breakage, destructive samples and their handling/treatment stay with the production/service function causing them, even when externally transferred or sold. A one-time burden transfer T_other requires an actual distinct other cohort/function and justified allocation/handover, with destination, state and complete inherited vector; sale or external shipment alone is insufficient. Full gross physical legs never shrink. No automatic avoided virgin material, energy, heat or disposal credit."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: allocation_stocks
    applies_to: "stocks assets packaging and service"
    rule: "Attribute only actual consumed inherited burden to the correct cohort. Manufacturing uses B_open + U - B_close - justified T_other, where B_close excludes already first-released FG and includes only genuine raw/WIP/unassigned stores. Original-cohort performed service remains attributable through its observed H even for held FG; only unused/unassigned charge or capacity burden is deferred. Asset physical acquisitions and package gross events retain V in full, while their upstream/service burden is owned and assigned once separately. A stock-corrected source record cannot be corrected again."
    source_ids:
      - ilcd-attributional-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "Unique complete-rod first release"
      record_type: "acceptance_record"
      raw_fields: "serial; model; configuration; complete_BOM; actual_section_count; net_rod_mass_kg; moisture_state; tare; calibration; inspection_tests; unique_first_release_decision; cohort_Q; opening_FG; closing_released_FG; return_history"
      collection_method: "Weigh accepted complete actual configured rods on a calibrated scale excluding detachable transport packaging and excluded fishing equipment; reconcile all sections and installed components with the controlled BOM and unique first-release decision. Sum real net released masses once to Q. If counts are used, independently weigh matching actual configuration samples and retain sampling uncertainty; no catalogue mass. Collection remains raw and undivided."
      unit: "kg"
      frequency: "Every actual first-release decision"
      temporal_coverage: "Complete production cohort"
      site_scope: "Named manufacturing release gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale/tare/calibration; full BOM; original acceptance and serial history"
    - protocol_id: cp_stocks
      process_id: "manufacture"
      flow_role: "Disjoint physical stocks and water/species"
      record_type: "stock_record"
      raw_fields: "actual_process_gate; raw_WIP_nonWIP_asset_FG_pools; opening; full_wet_closing; composition; completion; actual_gross_in_out; internal_handoff_pairs; P_I_ER_S_EO_W; reaction_evidence; X_in_out; actual_species; moisture_phase; source_cohort"
      collection_method: "Measure complete physical opening/closing pools and every real incoming/outgoing event independently; keep retained incoming material/water together with full closing wet stock. Confirm actual species/phase/reaction and element observations rather than fitting residuals. X removes only an overlapping other flow term on the same incoming/outgoing side. Record paired whole-article/component handoffs disjointly and cancel internal Q once."
      unit: "kg; m3; native unit"
      frequency: "Every movement and period close"
      temporal_coverage: "Opening histories and full observed horizon"
      site_scope: "Three physical gates and separate package/asset pools"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated whole wet mass; composition/state; paired event IDs; independent balances"
    - protocol_id: cp_vectors
      process_id: "manufacture"
      flow_role: "Inherited per-exchange burden and ownership"
      record_type: "burden_record"
      raw_fields: "actual_process_gate; cohort; original_Q_c; H; every_exchange_dimension; raw_B_open; raw_U; raw_B_close; already_net_flag; exclusive_assignment; causal_driver; residual_gate_price_state_date; T_other_decision; provider_owner; capacity_consumed_unused; full_gross_V; prepared_A_i; saved_Y_i"
      collection_method: "Retain the complete vector and provenance for every stock/charge and real event. Separate physical V from burden assignment, manufacturing from original-cohort service, and actual consumed capacity from genuinely unassigned stores. Reconcile subdivision/causality/residual allocation and provider ownership once; ordinary waste sale is not a transfer. Prepare raw A_i without division; only single_quotient later computes the saved normalized dimension."
      unit: "native unit per exchange"
      frequency: "Every attribution and period close"
      temporal_coverage: "Full current and inherited cohort histories"
      site_scope: "Actual whole provider and receiving function boundaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "Complete vector conservation; causal evidence; true handover; immutable original measurement basis"
    - protocol_id: cp_prepreg
      process_id: "manufacture"
      flow_role: "Whole supplied carbon/epoxy prepreg"
      record_type: "foreground_record"
      raw_fields: "event_id; cohort; original_Q_c; observed_H; configuration; physical_direction; actual_native_unit; original_raw_value; meter_or_scale; actual_state; density_if_needed; rate_or_cumulative; full_gross_V_i; supply_owner; origin_pool; original_stock_basis; B_open_vector; U_vector; B_close_vector; justified_T_other_vector; unused_capacity; disposition; measurement_uncertainty"
      collection_method: "Collect original receipts, issues/consumption, meters, actual process-state measurements and full inherited exchange vectors by actual lot/cohort and observed horizon; include all failures/tests/rework/cleanup. Distinguish already stock-corrected consumption from gross receipts and preserve full physical V independently. Collection performs no division; identify A_i and Y_i later by the single calculation rule."
      unit: "kg"
      frequency: "Every actual event and reporting-period close"
      temporal_coverage: "Complete declared cohort and observed H including Q-zero periods"
      site_scope: "Actual named site and actual supplier/receiver boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw non-divided records; calibration/state/composition evidence; supplier inclusion and unique owner; full cohort stocks/vectors; uncertainty and absence evidence"
