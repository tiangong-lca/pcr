          offset: 242717
          line: 1932
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\nThe hierarchy below applies only to attributional common-process cases requiring allocation; industrial manufacturing descriptions do not establish LCA allocation.\n\n| rule_id | applies_to | Rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_context | all burden dimensions | Use only an attributional setting in which allocation is methodologically required; declare the study goal and applicable decision context. Do not switch to consequential avoided-production substitution, an arbitrary physical/economic choice or a fixed factor. | `ilcd-attributional` |\n| allocation_exclusive | each exchange | First separately measure dedicated operations/inputs; perform physical or virtual subdivision for exclusively attributable materials, tests, runtime and actual service. Assign compatible supplier burdens once. Quantify and document why any residual remains joint. | `ilcd-attributional` |\n| allocation_physical | residual exchange | Then identify the determining physical causal relationship for each remaining exchange, distinguishing embodied goods from process/service causes. Use measured intensity and duration or actual capacity-limiting mass/volume/area only where it determines that exchange. Explain alternatives and preserve totals; one criterion is not imposed on every flow. | `ilcd-attributional` |\n| allocation_residual | true remaining common process | Only genuinely unresolved common-process burdens use contemporaneous actual market value of real co-functions at the common process gate and actual quality/state/quantity. Remove downstream transport/packing/conditioning value from later sales prices; disclose uncertainty/sensitivity and prove allocated sums equal original inventory. A missing valid basis is unresolved, not a licence to guess. | `ilcd-attributional` |\n| allocation_losses | waste; samples; rework | Ordinary manufacturing offcuts/fill losses/failures/samples and their treatment remain with the generating cohort even if exported or sold. Internal reuse is not a second supply or credit. Only real independent other-cohort/function attribution and justified one-time vector handover can enter T_other. Separately assess genuine recycling/other-function boundaries; do not infer a displaced-product credit or fixed recycling rate. | `ilcd-attributional` |\n| allocation_service | pack; service; assets | Use actual original-cohort service increments with original Q_H and observed H; any already incurred service remains despite closingFG. Only unused/unassigned service/charge carries. Never shrink gross material/packaging/asset/part/water/air legs with an allocated burden share. A stock-corrected consumed amount may not receive a second stock correction. |  |\n\n"
