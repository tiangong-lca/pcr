          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | Rule | source_ids |\n| --- | --- | --- | --- |\n| val_identity | all inventory rows | Require full semantic Product/Waste/Elementary identity and native reference property/group/unit compatibility, with actual material/form/phase/route/grade/geography/medium/type restrictions. A complete manufactured broad Product family may be constrained by positive complete primary toy evidence; exact SKU/name/CPC equality is not a substitute for physical review. Hard CAS/component/property conflict blocks that binding. | `un-cpc3-notes` |\n| val_q | out_toy; cp_release | Reject duplicate Q, packaging in net mass, retest/dispatch-as-production or subtracting released closingFG manufacturing burdens. Require actual unique first-release records. Q=0 retains real unnormalized loads and no unit result. Net-delivery studies must define a different complete historical opening/closingFG and G/R/D_rev bridge; they cannot reuse this first-release denominator silently. |  |\n| val_completeness | all processes | Reconcile actual BOM/purchases/stocks/performed activity/failed lots/zero output/repair/cleaning with every physical atomic row, true species, waste outlet and inherited burden vector. Unknown data are not zero or not_applicable. A bound auxiliary identity does not approve a provider, site quantity or science. | `epa-textile-fabrication` |\n| val_physical | physical gates; packaging pools | Prove manufacturing, FG/service and consolidated mass balances with disjoint whole-article/component bridges, all wet stocks and each true inlet/outlet. Reconcile each packaging P/I/ER/S/EO/W card condition and event. Keep real influx plus full closing mass when retained; X only same-side dedup. Mixed origin W plus whole outlet is never additive; treatment/provider once. |  |\n| val_measurement | collection and calculation | Raw collection retains original quantities/rates/units, calibration, states and uncertainties; conversions and real attribution precede the only N/D quotient. Physical N is full gross V; burden N is actual A_c/A_H in a separate dimension; cards/aggregation reference that same result, never divide twice. Energy/volume retain native units; no arbitrary density, item kg or bounding-box area. |  |\n| val_repair_species | service; assets; utilities | Reject assumed repair recovery or omitted failed/unauthorized performed work, natural humidity mislabeled as repair, unexplained old/new parts/water stocks, gas aggregates plus constituent duplication, indicator-to-species fabrication or a residual fitting two unknowns. Keep actual permission/tests/disposition and real source/receptor medium. | `aurora-quality` |\n| val_allocation | burden vectors | Require declared attributional context, exclusive assignment/subdivision first, exchange-specific determining causality second, justified actual common-gate market value only for residual, conservation and sensitivity. Ordinary waste sale is not automatic T_other; physical gross legs remain unscaled. | `ilcd-attributional` |\n| val_context | consumption | Require every qualifier, complete flow description/native restriction, protocol, calculation, source link and full boundary/allocation/validation context in aligned languages. Finite engineering checks do not establish measured factory data, scientific review, translation review, classification acceptance or publication. |  |\n\n"
