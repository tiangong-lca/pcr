system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "cut_sew; fill_finish"
      rule: "Include receipt of whole supplier-finished polyester plush fabric and actual loose filling/components; pattern/layout/cutting; sewing/turning; real face attachment; filling; closure; trimming; actual full-toy inspection and first quality release. Retain upstream manufacture/finishing once through compatible suppliers. Purchased whole finished-toy packing cannot stand in for this manufacturing route."
      source_ids:
        - steiff-manufacture
        - steiff-tom
    - rule_id: boundary_terminal
      applies_to: "out_toy"
      rule: "Require a complete supplied animal-character toy with actual permanent BOM and declared function/condition; no default safety eye polymer, nose type, internal mechanism, age grade, size, mass, life or certification. Separate permanent toy parts from removable paper tags, bag/film, carton and handling pallet; no fabric/filling/empty-shell/pillow may be the core product."
      source_ids:
        - un-cpc3-notes
        - steiff-tom
    - rule_id: boundary_q
      applies_to: "all processes"
      rule: "Q is calibrated net complete toy kg uniquely first accepted in the actual manufacturing cohort. Released closingFG is already inside Q: never add it as a second production output or subtract its manufacturing burden. Delivery, return, retest or successful rework of an already released toy does not create Q. Keep all unaccepted WIP/holds and their inherited per-exchange vectors distinct."
      source_ids: []
    - rule_id: boundary_failures
      applies_to: "all processes"
      rule: "Include complete failed and zero-output batches; startups/stops; idle; cleaning; extracted dust; damaged pieces; destructive samples and actual rework. Ordinary rejects/waste shipped or sold do not automatically transfer away manufacturing or treatment burdens. Only an independently real other cohort/function with justified allocation/handover permits one explicit burden-vector transfer; physical gross remains whole."
      source_ids:
        - ilcd-attributional
        - epa-textile-fabrication
    - rule_id: boundary_service
      applies_to: "service; pack; assets"
      rule: "Actual postrelease packing/storage/handling/dispatch/rework has its own original first-release cohort denominator Q_H and observed horizon H. Incurred original-cohort service is not subtracted because FG remains in closing stock; only unused/unassigned service or prepaid charge can carry forward. Future not-yet-performed services remain unknown. Released FG history is inherited once rather than remanufactured."
      source_ids:
        - ilcd-attributional
    - rule_id: boundary_physical
      applies_to: "all processes"
      rule: "Maintain independent gross physical ledgers and per-exchange burden vectors. Every physical card numerator is complete actual gross leg V_i after raw-unit conversion, never A_c/A_H, stock-corrected consumption, net delivery or economic share. Physical disclosure creates no extra procurement, provider burden or credit. Pair internal cut-shell, filled-toy, waste and packaging handoffs at both ends and cancel when consolidating; do not add external purchases or a second Q."
      source_ids: []
    - rule_id: boundary_packaging
      applies_to: "pack"
      rule: "Each actual material pool has separate conditional cards P (separate external purchase), I (supplier-included ingress), ER (external return received), S (gross shipment), EO (external return sent) and W (actual discard). For each pool, opening empty/attachedWIP/attachedFG/reusable stock + P + I + ER + actual disjoint retained/repair/water increments = closing in those states + S + EO + W + actual disjoint departures. P/I/ER are disjoint; whole wet article/preparation is acquired once with one upstream owner. Internal attachment/reuse cancels; X removes only overlapping same-side other incoming/outgoing terms, never closing stock, opposite-side legs or actual retained influx. Mixed-only waste W origins are non-additive children of one real outlet, not invented independent external Waste/treatment."
      source_ids: []
    - rule_id: boundary_species
      applies_to: "all processes"
      rule: "Keep whole physical mass and relevant element closure independent of verified species, reaction and phase evidence. One balance residual cannot fit two unknowns. No specific chemical is inferred from total N/C, COD, VOC, toxicity, particle size or safety-test indicators. Separate supplied liquid water, ordinary atmospheric uptake/desorption, free/residual/structural/reaction water only when real; ordinary humidity needs no fictitious work permission. Full wet closing mass and actual new material/water influx coexist; X only deduplicates another same-side flow."
      source_ids: []
    - rule_id: boundary_repair
      applies_to: "service; assets"
      rule: "Manufacturer/specification permission and postwork tests/acceptance/disposition control whether an actual reworked toy may remain usable. They do not delete any performed unauthorized or failed work: retain its actual new/old parts, every water phase, utilities, waste and original cohort with actual hold/disposal status. No automatic restoration, new production, equal old/new part mass or zero repair loss. RepairWIP and original FG stock close independently."
      source_ids:
        - steiff-tom
        - aurora-quality
    - rule_id: boundary_assets_heat
      applies_to: "assets; utilities"
      rule: "Separate full gross asset/part/fluid receipts, external returns, retirement and wet stocks from the actual current service burden. No fixed life or whole machine per kg. Record each actual fuel/thermal carrier separately if present: carrier mass and delivered heat are independent dimensions, and real hot water/steam/condensate external Product return requires actual state/enthalpy and one supplier water/energy convention. Do not invent a boiler or duplicate compressor/electric heat. Add genuine unlisted atoms before complete dataset use."
      source_ids:
        - ilcd-attributional
    - rule_id: boundary_scope
      applies_to: "dataset claims"
      rule: "This route is manufacturing foreground plus separately disclosed actual original-cohort factory services. Link actual upstream products/transport, capital services and external waste treatment with matching geography/time/technology before any cradle-to-gate claim. Consumer use, downstream distribution and final disposal require added stages. Onsite polymer/fibre/textile production, principal wet finishing, rigid moulded bodies and powered mechanisms require new applicability assessment within this same PCR, not a silent route swap."
      source_ids:
        - un-cpc3-notes
        - epa-textile-fabrication
    - rule_id: system_boundary_rule_12
      applies_to: "foreground_system_boundary"
      rule: "Every card and table below is conditioned by the same actual route, unique first-release Q, original-cohort service Q_H/H, complete gross physical legs and once-only burden ownership; consume qualifiers and ancestor context together."
      source_ids: []
    - rule_id: system_boundary_rule_13
      applies_to: "foreground_system_boundary"
      rule: "This attributional candidate covers new complete sewn animal-character plush toys made from supplier-dyed/finished polyester plush fabric, actual polyester loose-fibre stuffing and real eyes/nose/thread/permanent labels. Foreground includes receipt, pattern/layout/cutting, shell sewing/turning, actual face attachment/embroidery, filling, closure/sculpting and full-toy first inspection/release; actual later packing/storage/handling/dispatch/rework is a separate original-cohort service account. It requires manufacture from those inputs."
      source_ids: []
    - rule_id: system_boundary_rule_14
      applies_to: "foreground_system_boundary"
      rule: "This is a transparent technical synthesis: the complete Steiff manufacturing account supports the sequence and full toy terminal; Tom positively specifies polyester plush and polyester fill; Aurora independently separates inspection stages. Glued cardboard joints, wood wool/mohair/cotton and alternative eyes in the general account are neighboring routes, not a measured Tom SKU/factory recipe or mandatory BOM. Actual supplier/BOM evidence must establish polymer, recycled provenance, components and performed operations; no recycled share, fill ratio or process setting is prescribed. Sources: steiff-manufacture; steiff-tom; aurora-quality."
      source_ids: []
    - rule_id: system_boundary_rule_15
      applies_to: "foreground_system_boundary"
      rule: "The CPC category also includes human figures, unstuffed/dressed toys and moving/voice mechanisms; this route does not cover the whole leaf. Exclude rigid plastic/ceramic principal bodies, principal non-polyester shell/filling, powered/battery/sound/light mechanisms, the glued articulated-joint principal route, ordinary bedding/pillow inserts and material/empty-shell/eye/nose-only terminals. Add every genuine extra atomic input; a changed principal route needs assessment in this PCR. Sources: un-cpc3-notes; steiff-manufacture."
      source_ids: []
    - rule_id: system_boundary_rule_16
      applies_to: "foreground_system_boundary"
      rule: "Declare every applicable qualifier in dataset metadata, process notes, reference comments or equivalent consumable fields; external author evidence is not a substitute. Mass is not proof of equal play, safety or lifetime function across toys."
      source_ids: []
    - rule_id: system_boundary_rule_17
      applies_to: "foreground_system_boundary"
      rule: "Each card is one conditional physical event; preserve its native restrictions, complete gross V_i, once-only burden ownership and stock/packaging/service context. Where one mixed waste outlet exists, origin W accounts are measured non-additive children and do not create external exits."
      source_ids: []
    - rule_id: system_boundary_rule_18
      applies_to: "foreground_system_boundary"
      rule: "aggregation_rule declares the final result reporting basis only. Collection retains undivided raw same-unit events and full stocks. After raw conversion and real attribution calc_single_quotient executes the sole quotient; aggregation references that same result and never divides before or again."
      source_ids: []
    - rule_id: system_boundary_rule_19
      applies_to: "foreground_system_boundary"
      rule: "The broad whole Product binding is a manufactured complete toy family at plant. Its explicit stuffed-animal inclusion supports this narrower finished toy, not raw polyester, a plush fabric, loose filling, an empty shell, bedding or a component. The actual native Mass reference is retained; the current whole-flow read and retained versioned property/unit chain do not establish a measured factory inventory or approved background provider. The source synthesis establishes a real manufacturing route, not that Aurora and Steiff are independent measurements of one factory, nor that the general Steiff glued-joint and sewn-eye sequence is the Tom recipe. Tom specifies safety eyes and a stainless-steel identification button; no eye polymer, separate washer, glued joint or nose construction is inferred. Any real integral supplied eye assembly is bought once; separate retaining washers only when actually supplied separately. Sources: un-cpc3-notes; steiff-manufacture; steiff-tom; aurora-quality."
      source_ids: []
    - rule_id: system_boundary_rule_20
      applies_to: "foreground_system_boundary"
      rule: "Lock Q (also called original Q0) as the positive sum of each unique complete toy first-acceptance net mass at the one fixed reference gate and measured state. Preserve the original event quantity and date. The complete event bridge partitions remaining net deliveries, every actual on-site accepted state including stored finished goods, holds, accepted samples and repair work in progress, irreversible material and water losses, and other terminal dispositions on the original acceptance basis. Record real changes in configuration and condition independently. A later destroyed or dried already accepted toy does not disappear from original Q0; only a never-accepted destroyed specimen is outside Q. Returns, rework, reinspection and resale create no second Q. Do not restore lost water/material into the survivor and count that loss again. Q0 is an event account, not another external physical output; Q=0 or unknown Q preserves raw totals without a unit result."
      source_ids: []
    - rule_id: system_boundary_rule_21
      applies_to: "foreground_system_boundary"
      rule: "Maintain three separate ledgers for a shared waste or asset event: the one full actual physical receiver transfer Qt and full actual treatment-provider quantity recorded once; independently evidenced component and physical-cohort provenance; and distinct nonoverlapping environmental/treatment-service vectors attributed to each served original cohort in compatible provider units. The raw physical disclosure q_phys=Qt/Qanalysis uses a declared positive observation basis Qanalysis only as a diagnostic, never as linked modeled demand for every cohort. Modeled demand is the evidenced attributable vector A_c/Q0_c or A_H/Q_H for that original cohort; sum attributed vectors to the once-only full service vector without recharging Qt to each cohort. Unknown shares stay unresolved. The complete waste composition and actual receiver/provider interface remain whole Qt. Apply this to packaging waste only when real shared recipient/service history exists; do not invent sharing, lifetime or fractions."
      source_ids: []
    - rule_id: system_boundary_rule_22
      applies_to: "foreground_system_boundary"
      rule: "A contaminated discarded bag, cloth or filter is one actual whole wet waste outlet including dry substrate, retained textile dust or liquor and water. Its dry substrate and retained contents are nested non-additive component accounts. There is no extra attached-dust, attached-water export or treatment demand unless those materials are actually separated before the boundary, in which case record the genuine separate outlets and matched receivers. Service allocation never shrinks the physical fleet, stocks or whole waste transfer. Independently collected textile dust remains its own genuine separate stream; mixed-only offcut, dust, failed-toy and packaging origins are non-additive children of the real whole mixed outlet."
      source_ids: []
    - rule_id: system_boundary_rule_23
      applies_to: "foreground_system_boundary"
      rule: "Synthetic consistency test only, not an empirical toy default: one contaminated filter transfer of 10 kg comprises 8 kg dry substrate and 2 kg retained dust and serves old/new cohorts. The receiver gets 10 kg once. If independent evidence assigns treatment service 25% to the new cohort and 75% to the old cohort in a composition-compatible kg-equivalent provider convention, modeled vectors are 2.5 and 7.5 kg-equivalent. Original Qnew=100 kg and Qold=200 kg give 0.025 and 0.0375 kg-equivalent per kg reference respectively. Neither a physical 2.5 kg transfer nor two full 10 kg modeled demands is correct. These fractions and quantities prescribe no actual site, filter installation, lifetime or allocation basis."
      source_ids: []
    - rule_id: system_boundary_rule_24
      applies_to: "foreground_system_boundary"
      rule: "The six packaging pool symbols have the following fixed orientation in this method: P separate external purchase, I supplier-included ingress, ER external return RECEIVED, S gross shipment, EO external return SENT, W actual discarded article. Keep complete delivered/returned/discarded article state and composition, individual tare, attached-WIP/attached-FG/empty/reusable stock genealogy, new water/material influx and one upstream owner. Supplier-included I is physically visible without buying its included manufacture twice. Whole contaminated W includes retained contents once; empty-tare component balances and whole-wet-waste transfers are linked by explicit component bridges, never forced equal. Actual delivery loops do not create Q or a co-function/credit."
      source_ids: []
    - rule_id: system_boundary_rule_25
      applies_to: "foreground_system_boundary"
      rule: "All genuine purchased fabric finishing, recycled or virgin fibre production, component manufacturing, transport, tooling and capital services must have complete compatible producers and nonoverlapping provider histories. Their purchase gates do not delete upstream dyeing/finishing, spinning or component manufacture. If genuinely performed on site, retain the complete real operation and every actual chemical/solution/air/water/utility/output/treatment interface; do not move it off site on paper. An available Flow identity is not an available or approved background Process. No incompatible provider or component proxy is allowed; unknown ordinary provider identities, quantities and uncertainties remain declared study-qualification gaps rather than a new factory/SKU exclusivity condition."
      source_ids: []
    - rule_id: system_boundary_rule_26
      applies_to: "foreground_system_boundary"
      rule: "Preserve the exact electricity reference property Net calorific value and its MJ energy unit group. The factor 3.6 converts measured kWh into MJ as an electrical unit conversion only, not a fuel calorific-value assumption. Atmospheric water-resource identity uses Volume in m3, whereas ordinary emitted water vapour uses Mass in kg. State the actual measurement convention, molecular phase, pressure, temperature and independently supported water-density relation if a mass bridge is needed; neither a bulk-air volume, an assumed liquid density nor a secondary native screening factor proves this bridge. If the actual atmospheric-water volume convention cannot be established compatibly, leave that auxiliary binding and its conversion unresolved while retaining measured humidity/water accounts; never silently change its property to Mass or fabricate a closure flow."
      source_ids: []
    - rule_id: system_boundary_rule_27
      applies_to: "foreground_system_boundary"
      rule: "Source-use limits remain binding in every downstream field. The EPA textile guidance is historical US chemical-reporting guidance: its reporting thresholds, neutralization zero conventions and exemptions are not LCA zeros, and its typical disposal/recycling arrows are alternatives rather than observed toy-plant outlets. ILCD subdivision and determining physical causality apply in the stated attributional allocation-needed context; residual common-process gate values do not authorize a recycling credit or multifunctional-product QFD shortcut. Source dimensions, care instructions, output volumes and certifications are observations of those sources, never recipe, yield, test acceptance, safety, recycled-content or lifecycle defaults for this method. Sources: epa-textile-fabrication; ilcd-attributional; steiff-tom; aurora-quality."
      source_ids: []
    - rule_id: system_boundary_rule_28
      applies_to: "foreground_system_boundary"
      rule: "For every actual packaging pool, reconcile the complete same-unit physical bridge opening+P+I+ER+actual disjoint retained/repair/water increments=closing+S+EO+W+actual disjoint departures. Pair each genuine internal retained increment with its actual source once and cancel that handoff only on consolidation; do not erase real ingress or full wet closing stock. W is the whole contaminated receiver quantity with substrate/residue/water nested once. If a substrate-only component balance is also reported, bridge it explicitly to whole wet W rather than inserting the whole wet value into a dry-substrate equation. This is a conservation rule, not a default repair, moisture uptake or discard event. For a synthetic check only: O2+P3+I1+ER4+retained1=C3+S4+EO2+wholeW2=11kg; W includes1kg substrate plus1kg retained matter. Actual count records remain independent."
      source_ids: []
