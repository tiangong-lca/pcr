  - id: native_extensive
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Each row native extensive property"
      uuid: ""
    required_unit: "kg; MJ; m3"
    rule: "Preserve mass/energy/volume numerator units; Mass/kg does not apply to electricity or atmospheric-water resource. Raw conversion and real attribution precede the sole quotient."
  - id: count_volume_area
    applies_to: "all actual count volume or area observations"
    required_property_ref:
      name: "Independently measured extensive property"
      uuid: ""
    required_unit: "kg; m3; item"
    rule: "Item(s) and item for Number of items are factor1 count aliases only, not kg. A needed count-to-kg conversion requires calibrated same-configuration whole net M with conditioning/scope, not a secondary coefficient. Integrated volume is not multiplied by time again; only true rates are integrated; density is independent for that substance/state. Area means actual single-side projection and L*W only proven rectangles; this Q is not area."
