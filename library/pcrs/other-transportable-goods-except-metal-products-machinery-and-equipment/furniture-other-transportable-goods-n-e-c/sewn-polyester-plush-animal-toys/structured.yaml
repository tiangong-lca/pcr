  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Retain original readings first. Convert kWh*3.6 to MJ; convert a real rate by time integration once; use integrated volume directly. Use independent substance/state density only when converting actual volume to mass; never native secondary screening coefficients or assumed item mass. Preserve each actual native extensive unit."
      inputs:
        - raw_readings
        - actual_state
        - independent_density
        - rate_or_integral
      output: "V_i; U_i"
      source_ids: []
    - id: calc_q
      applies_to: "out_toy"
      rule: "Q=sum actual calibrated net kg of unique complete first-released conforming toys; released closingFG is included once; unreleased WIP and specimens destroyed before first acceptance are excluded; specimens destroyed after first acceptance remain in original Q with their actual loss and disposition."
      inputs:
        - cp_release
      output: "Q"
      source_ids: []
    - id: calc_manufacture
      applies_to: "manufacturing burden dimension"
      rule: "For each exchange vector A_c=B_open+U-B_close-T_other. B covers raw material/WIP and unassigned nonWIP material/service charge only, never already released FG. U is actual new burden additions, not already stock-corrected consumption. T_other requires a real independent other cohort/function and justified once-only handover; ordinary waste/samples/sale do not qualify. If consumption already stock-corrected, use that equivalent ledger without subtracting stock twice."
      inputs:
        - B_open
        - U
        - B_close
        - justified_T_other
        - cp_material_cut_sew
        - cp_material_fill_finish
        - cp_material_utilities
        - cp_energy_cut_sew
        - cp_energy_fill_finish
        - cp_energy_pack
        - cp_energy_service
        - cp_energy_assets
        - cp_energy_utilities
        - cp_energy_waste
      output: "A_c"
      source_ids:
        - ilcd-attributional
    - id: calc_service
      applies_to: "original-cohort service burden dimension"
      rule: "A_H=actual original-cohort increments+opening unused_unassigned_charge-closing unused_unassigned_charge-justified_other_function_handover. Preserve original first-release history once; incurred service is not closingFG carry. Original Q_H is the actual original cohort mass and H the observed horizon, not current shipment/return/repaired mass."
      inputs:
        - actual_increments
        - opening_unused_charge
        - closing_unused_charge
        - original_Q_H
        - observed_H
        - cp_service
        - cp_assets
      output: "A_H"
      source_ids: []
    - id: calc_single_quotient
      applies_to: "all inventory rows"
      rule: "q_phys=V_i/Qanalysis is a diagnostic of the once-only full physical event with declared positive observation basis; model q_b=A_c/Q0_c or A_H/Q_H uses the distinct evidenced attributable vector and each original positive cohort mass exactly once. Shared whole receiver/provider quantity is recorded once; no full event recharge to every cohort. out_toy remains the 1 kg reference. Zero or unknown basis retains raw totals and no unit result."
      inputs:
        - V_i
        - Qanalysis
        - A_c
        - A_H
        - Q0_c
        - original_Q_H
        - observed_H
      output: "q_phys; q_b"
      source_ids: []
    - id: calc_pack_pool
      applies_to: "pack"
      rule: "For each material pool opening_empty_attachedWIP_attachedFG_reusable + P + I + ER + actual_disjoint_retained_repair_water_increments = closing_empty_attachedWIP_attachedFG_reusable + S + EO + W + actual_disjoint_departures. Internal attachment/reuse cancels; P/I/ER are disjoint. Whole wet incoming article and full wet closing stock both remain even when new material/water is retained. X only deduplicates overlap with other same-side flow terms. Mixed W origins do not add to the already-inclusive total outlet."
      inputs:
        - pool_opening
        - P
        - I
        - ER
        - pool_closing
        - S
        - EO
        - W
        - cp_pack
        - actual_disjoint_retained_repair_water_increments
        - actual_disjoint_departures
        - whole_waste_component_bridge
      output: "pool_residual"
      source_ids: []
    - id: calc_physical_gates
      applies_to: "all physical streams"
      rule: "Manufacture: opening raw/WIP material + actual incoming material/water/species = closing raw/WIP/unassigned stores + first-release whole Q + real waste/species outputs. FG/service: opening complete FG + internal Q handoff + gross external returns + disjoint new parts/water = closing complete FG/repairWIP + gross dispatch/external returns + actual waste/species. At consolidation cancel Q/internal component/waste/packaging pairs; never add whole wet article plus its included constituents or Q plus closing releasedFG as new output. Asset/packaging stocks are their own complete gates."
      inputs:
        - opening_physical
        - actual_gross_in
        - closing_physical
        - actual_gross_out
        - disjoint_components
        - internal_pairs
      output: "gate_residuals"
      source_ids: []
    - id: calc_species_balance
      applies_to: "actual species and water"
      rule: "Reconcile whole wet/dry physical mass and relevant elements independently of actual molecular/reaction/phase evidence. Actual moisture exchange, free/retained/reaction/structural water each needs independent state evidence; no one residual fits two unknowns. Preserve gas gross inlet/outlet and non-additive mixture bridge; COD/VOC and particle indicators remain indicators, not molecular masses."
      inputs:
        - measured_species
        - actual_phase
        - wet_dry_stocks
        - independent_state_evidence
        - cp_species_cut_sew
        - cp_species_fill_finish
        - cp_species_pack
        - cp_species_service
        - cp_species_assets
        - cp_species_utilities
        - cp_species_waste
      output: "species_residuals"
      source_ids: []
  data_quality_requirements:
    - id: dq_full_identity
      applies_to: "each selected flow"
      requirement: "Retain all native basename/synonym/comment/CAS/form/route/grade/geography/media/type and every property-to-group-to-unit relationship; preserve exact source restrictions in each consumed card. Blank auxiliary identities require actual matching before concrete dataset use; they are not core absence proof."
      evidence: "Exact public identity records plus actual supplier specification"
    - id: dq_evidence
      applies_to: "sources"
      requirement: "Use complete primary originals and adjacent contrary context; distinguish historical guidance, product example and actual factory measurement. No borrowed recipe, emission factor, recycled percentage, safety approval or measured amount without evidence."
      evidence: "Complete primary scope and actual foreground records"
    - id: dq_foreground
      applies_to: "all cards"
      requirement: "Collect full event coverage and calibrated raw quantities before normalization, including failures/zero-output/start-stop/idle/cleanup, stocks and every per-exchange inherited vector. Keep missingness/uncertainty and true absence evidence explicit."
      evidence: "Original meters/scales/ERP/test/disposition records"
    - id: dq_ownership
      applies_to: "all gross and burden dimensions"
      requirement: "Keep physical gross and burden ownership distinct with one supplier/treatment owner and disjoint whole-article bridges. Ordinary waste sale, FG storage or unauthorised failed work does not erase actual load."
      evidence: "Ownership matrix and independent mass/vector reconciliations"
    - id: dq_representativeness
      applies_to: "concrete dataset"
      requirement: "Declare actual site/time, product configuration, supplier state, utility contract, emissions media, coverage gaps and provider uncertainty. No future plant figures, nominal default or unstated zero; review any principal-route change."
      evidence: "Dataset metadata and traceable source records"
validation_rules:
  - rule_id: val_identity
    applies_to: "all inventory rows"
    rule: "Require full semantic Product/Waste/Elementary identity and native reference property/group/unit compatibility, with actual material/form/phase/route/grade/geography/medium/type restrictions. A complete manufactured broad Product family may be constrained by positive complete primary toy evidence; exact SKU/name/CPC equality is not a substitute for physical review. Hard CAS/component/property conflict blocks that binding."
    source_ids:
      - un-cpc3-notes
  - rule_id: val_q
    applies_to: "out_toy; cp_release"
    rule: "Reject duplicate Q, packaging in net mass, retest/dispatch-as-production or subtracting released closingFG manufacturing burdens. Require actual unique first-release records. Q=0 retains real unnormalized loads and no unit result. Net-delivery studies must define a different complete historical opening/closingFG and G/R/D_rev bridge; they cannot reuse this first-release denominator silently."
    source_ids: []
  - rule_id: val_completeness
    applies_to: "all processes"
    rule: "Reconcile actual BOM/purchases/stocks/performed activity/failed lots/zero output/repair/cleaning with every physical atomic row, true species, waste outlet and inherited burden vector. Unknown data are not zero or not_applicable. A bound auxiliary identity does not approve a provider, site quantity or science."
    source_ids:
      - epa-textile-fabrication
  - rule_id: val_physical
    applies_to: "physical gates; packaging pools"
    rule: "Prove manufacturing, FG/service and consolidated mass balances with disjoint whole-article/component bridges, all wet stocks and each true inlet/outlet. Reconcile each packaging P/I/ER/S/EO/W card condition and event. Keep real influx plus full closing mass when retained; X only same-side dedup. Mixed origin W plus whole outlet is never additive; treatment/provider once."
    source_ids: []
  - rule_id: val_measurement
    applies_to: "collection and calculation"
    rule: "Raw collection retains original quantities/rates/units, calibration, states and uncertainties; conversions and real attribution precede the only N/D quotient. Physical N is full gross V; burden N is actual A_c/A_H in a separate dimension; cards/aggregation reference that same result, never divide twice. Energy/volume retain native units; no arbitrary density, item kg or bounding-box area."
    source_ids: []
  - rule_id: val_repair_species
    applies_to: "service; assets; utilities"
    rule: "Reject assumed repair recovery or omitted failed/unauthorized performed work, natural humidity mislabeled as repair, unexplained old/new parts/water stocks, gas aggregates plus constituent duplication, indicator-to-species fabrication or a residual fitting two unknowns. Keep actual permission/tests/disposition and real source/receptor medium."
    source_ids:
      - aurora-quality
  - rule_id: val_allocation
    applies_to: "burden vectors"
    rule: "Require declared attributional context, exclusive assignment/subdivision first, exchange-specific determining causality second, justified actual common-gate market value only for residual, conservation and sensitivity. Ordinary waste sale is not automatic T_other; physical gross legs remain unscaled."
    source_ids:
      - ilcd-attributional
  - rule_id: val_context
    applies_to: "consumption"
    rule: "Require every qualifier, complete flow description/native restriction, protocol, calculation, source link and full boundary/allocation/validation context in aligned languages. Finite engineering checks do not establish measured factory data, scientific review, translation review, classification acceptance or publication."
    source_ids: []
published_dataset_profile:
  dataset_role: "Attributional foreground unit process for the actual declared complete sewn-polyester animal toy"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Factory-gate modelling with compatible qualifiers and actual upstream/waste links; original-cohort services explicitly separate"
  excluded_use: "Automatic whole-leaf coverage; material/pillow substitution for toy; bought-toy packing as manufacture; automatic lifecycle/safety/certification/science claims"
  required_metadata: "actual complete toy character and intended function; permanent supplied BOM; shell polymer and woven/knit pile construction; supplier dyeing and finish; filling polymer and fibre structure; actual virgin and recycled provenance; measured constituent quantities; actual eye and nose material and fixing; actual embroidery and labels; actual included mechanisms or explicit absence; actual manufacturer specification and release tests; unique first-release cohort and Q; measured complete net wet mass; moisture conditioning; actual site and reporting period; raw WIP and nonWIP stocks with inherited exchange vectors; released FG history; original service Q_H and observed H; actual packaging six-leg pools; actual assets and repair parts with water states; exact utility geography and voltage; actual gas sources and receiving media; upstream and treatment ownership; unresolved identities and provider gaps"
  required_quality_disclosure: "Actual collection coverage/missingness, native restrictions, provider compatibility gaps, calibration/uncertainty, physical/element/species/vector balances, zero-output totals, attribution and unresolved state"
  update_trigger: "Principal product/material/route or BOM changes; source/provider/utility/media/packaging/repair changes; denominator/allocation change; new identity/evidence"
data_sources:
  - id: "un-cpc3-notes"
    type: "official_guidance"
    reference: "UN Statistics Division. CPC Version3.0 explanatory notes (30June2025), pp191–194; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Whole toy category including stuffed animals and neighboring parts/vehicle/other-toy exclusions; classification alone does not define this route."
  - id: "steiff-manufacture"
    type: "literature"
    reference: "Margarete Steiff GmbH. Handmade - Steiff Manufacture. https://corporate.steiff.com/en/company/manufacture/"
    used_for: "Complete pattern-to-cutting-to-sewing-to-filling-to-face-to-inspection-to-packing manufacturing context; jointed and alternative-material branches remain countercontext rather than default BOM."
  - id: "steiff-tom"
    type: "literature"
    reference: "Margarete Steiff GmbH. Teddies for tomorrow Tom Teddy bear, article023033. https://www.steiff.com/en/teddies-for-tomorrow-tom-teddy-bear-023033"
    used_for: "Positive complete polyester-plush/polyester-fill toy terminal with actual eyes/button and removable packaging context; a product example is not a measured recipe or transferable safety/certification claim."
  - id: "aurora-quality"
    type: "literature"
    reference: "Aurora World. Global Toy Business - Quality Management. https://auroraworld.com/en/business/global-quality"
    used_for: "Independent manufacturer context for material/pattern/form-and-stuffing/final-product/pack-and-shipping inspection separation; no test threshold or certification is adopted."
  - id: "epa-textile-fabrication"
    type: "official_guidance"
    reference: "US EPA. Reporting Guidance for the Textile Processing Industry, EPA745-B-00-008, May2000, §4.2.4 pp4-52–4-54 including Figure4-8. https://ofmpub.epa.gov/apex/guideme_ext/guideme_ext/guideme/file/textile%20processing%20industry.pdf"
    used_for: "Historical physical fabrication/waste/dust/equipment-cleaning/lubricant discovery only; TRI thresholds/exemptions do not set LCA quantities to zero and this source does not prescribe toy allocation."
  - id: "ilcd-attributional"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook: General guide for LCA - Detailed guidance, first edition March2010, §§7.9.2–7.9.3 pp255–272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation-needed setting only: subdivision/virtual subdivision then exchange-specific determining physical causality then residual common-process value at actual boundary state; no default shares/credit or consequential substitution."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:d39580d8d1465ffcd5e7b63609de04d2446085530fd783da0f3bbec89f71527b"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6955"
      family: "system_boundary"
      span:
        start:
          offset: 6955
          line: 64
          column: 1
        end:
          offset: 25625
          line: 127
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual supplier-dyed/finished polyester plush, polyester loose stuffing and real manufactured components |\n| starting_condition_role | foreground_starting_point |\n| product_classification_scope | Narrow complete sewn-polyester animal-toy route within CPC3.0:38520 |\n| recursive_input_rule | A purchased complete toy may enter only an explicit actual incremental service; never masquerade as new fabric/filling manufacture. Internal same-article handoffs match/cancel without second Q. |\n| upstream_dataset_requirement | Each real supplied product/preparation, energy, transport, capital service and waste treatment must match composition/state/geography/time/technology with concrete compatible provider qualification and unresolved gaps disclosed; identity is not provider approval. |\n| disclosure | Actual make/buy, first-release Q, original service Q_H/H, all stocks/inherited vectors, six packaging legs, true species/water/heat, failures/holds, ownership and gaps |\n\n| rule_id | applies_to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_route | cut_sew; fill_finish | Include receipt of whole supplier-finished polyester plush fabric and actual loose filling/components; pattern/layout/cutting; sewing/turning; real face attachment; filling; closure; trimming; actual full-toy inspection and first quality release. Retain upstream manufacture/finishing once through compatible suppliers. Purchased whole finished-toy packing cannot stand in for this manufacturing route. | `steiff-manufacture`; `steiff-tom` |\n| boundary_terminal | out_toy | Require a complete supplied animal-character toy with actual permanent BOM and declared function/condition; no default safety eye polymer, nose type, internal mechanism, age grade, size, mass, life or certification. Separate permanent toy parts from removable paper tags, bag/film, carton and handling pallet; no fabric/filling/empty-shell/pillow may be the core product. | `un-cpc3-notes`; `steiff-tom` |\n| boundary_q | all processes | Q is calibrated net complete toy kg uniquely first accepted in the actual manufacturing cohort. Released closingFG is already inside Q: never add it as a second production output or subtract its manufacturing burden. Delivery, return, retest or successful rework of an already released toy does not create Q. Keep all unaccepted WIP/holds and their inherited per-exchange vectors distinct. |  |\n| boundary_failures | all processes | Include complete failed and zero-output batches; startups/stops; idle; cleaning; extracted dust; damaged pieces; destructive samples and actual rework. Ordinary rejects/waste shipped or sold do not automatically transfer away manufacturing or treatment burdens. Only an independently real other cohort/function with justified allocation/handover permits one explicit burden-vector transfer; physical gross remains whole. | `ilcd-attributional`; `epa-textile-fabrication` |\n| boundary_service | service; pack; assets | Actual postrelease packing/storage/handling/dispatch/rework has its own original first-release cohort denominator Q_H and observed horizon H. Incurred original-cohort service is not subtracted because FG remains in closing stock; only unused/unassigned service or prepaid charge can carry forward. Future not-yet-performed services remain unknown. Released FG history is inherited once rather than remanufactured. | `ilcd-attributional` |\n| boundary_physical | all processes | Maintain independent gross physical ledgers and per-exchange burden vectors. Every physical card numerator is complete actual gross leg V_i after raw-unit conversion, never A_c/A_H, stock-corrected consumption, net delivery or economic share. Physical disclosure creates no extra procurement, provider burden or credit. Pair internal cut-shell, filled-toy, waste and packaging handoffs at both ends and cancel when consolidating; do not add external purchases or a second Q. |  |\n| boundary_packaging | pack | Each actual material pool has separate conditional cards P (separate external purchase), I (supplier-included ingress), ER (external return received), S (gross shipment), EO (external return sent) and W (actual discard). For each pool, opening empty/attachedWIP/attachedFG/reusable stock + P + I + ER + actual disjoint retained/repair/water increments = closing in those states + S + EO + W + actual disjoint departures. P/I/ER are disjoint; whole wet article/preparation is acquired once with one upstream owner. Internal attachment/reuse cancels; X removes only overlapping same-side other incoming/outgoing terms, never closing stock, opposite-side legs or actual retained influx. Mixed-only waste W origins are non-additive children of one real outlet, not invented independent external Waste/treatment. |  |\n| boundary_species | all processes | Keep whole physical mass and relevant element closure independent of verified species, reaction and phase evidence. One balance residual cannot fit two unknowns. No specific chemical is inferred from total N/C, COD, VOC, toxicity, particle size or safety-test indicators. Separate supplied liquid water, ordinary atmospheric uptake/desorption, free/residual/structural/reaction water only when real; ordinary humidity needs no fictitious work permission. Full wet closing mass and actual new material/water influx coexist; X only deduplicates another same-side flow. |  |\n| boundary_repair | service; assets | Manufacturer/specification permission and postwork tests/acceptance/disposition control whether an actual reworked toy may remain usable. They do not delete any performed unauthorized or failed work: retain its actual new/old parts, every water phase, utilities, waste and original cohort with actual hold/disposal status. No automatic restoration, new production, equal old/new part mass or zero repair loss. RepairWIP and original FG stock close independently. | `steiff-tom`; `aurora-quality` |\n| boundary_assets_heat | assets; utilities | Separate full gross asset/part/fluid receipts, external returns, retirement and wet stocks from the actual current service burden. No fixed life or whole machine per kg. Record each actual fuel/thermal carrier separately if present: carrier mass and delivered heat are independent dimensions, and real hot water/steam/condensate external Product return requires actual state/enthalpy and one supplier water/energy convention. Do not invent a boiler or duplicate compressor/electric heat. Add genuine unlisted atoms before complete dataset use. | `ilcd-attributional` |\n| boundary_scope | dataset claims | This route is manufacturing foreground plus separately disclosed actual original-cohort factory services. Link actual upstream products/transport, capital services and external waste treatment with matching geography/time/technology before any cradle-to-gate claim. Consumer use, downstream distribution and final disposal require added stages. Onsite polymer/fibre/textile production, principal wet finishing, rigid moulded bodies and powered mechanisms require new applicability assessment within this same PCR, not a silent route swap. | `un-cpc3-notes`; `epa-textile-fabrication` |\n\n### Complete applicability and accounting context\n\nEvery card and table below is conditioned by the same actual route, unique first-release Q, original-cohort service Q_H/H, complete gross physical legs and once-only burden ownership; consume qualifiers and ancestor context together.\n\nThis attributional candidate covers new complete sewn animal-character plush toys made from supplier-dyed/finished polyester plush fabric, actual polyester loose-fibre stuffing and real eyes/nose/thread/permanent labels. Foreground includes receipt, pattern/layout/cutting, shell sewing/turning, actual face attachment/embroidery, filling, closure/sculpting and full-toy first inspection/release; actual later packing/storage/handling/dispatch/rework is a separate original-cohort service account. It requires manufacture from those inputs.\n\nThis is a transparent technical synthesis: the complete Steiff manufacturing account supports the sequence and full toy terminal; Tom positively specifies polyester plush and polyester fill; Aurora independently separates inspection stages. Glued cardboard joints, wood wool/mohair/cotton and alternative eyes in the general account are neighboring routes, not a measured Tom SKU/factory recipe or mandatory BOM. Actual supplier/BOM evidence must establish polymer, recycled provenance, components and performed operations; no recycled share, fill ratio or process setting is prescribed. Sources: `steiff-manufacture`; `steiff-tom`; `aurora-quality`.\n\nThe CPC category also includes human figures, unstuffed/dressed toys and moving/voice mechanisms; this route does not cover the whole leaf. Exclude rigid plastic/ceramic principal bodies, principal non-polyester shell/filling, powered/battery/sound/light mechanisms, the glued articulated-joint principal route, ordinary bedding/pillow inserts and material/empty-shell/eye/nose-only terminals. Add every genuine extra atomic input; a changed principal route needs assessment in this PCR. Sources: `un-cpc3-notes`; `steiff-manufacture`.\n\nDeclare every applicable qualifier in dataset metadata, process notes, reference comments or equivalent consumable fields; external author evidence is not a substitute. Mass is not proof of equal play, safety or lifetime function across toys.\n\nEach card is one conditional physical event; preserve its native restrictions, complete gross V_i, once-only burden ownership and stock/packaging/service context. Where one mixed waste outlet exists, origin W accounts are measured non-additive children and do not create external exits.\n\naggregation_rule declares the final result reporting basis only. Collection retains undivided raw same-unit events and full stocks. After raw conversion and real attribution calc_single_quotient executes the sole quotient; aggregation references that same result and never divides before or again.\n\nThe broad whole Product binding is a manufactured complete toy family at plant. Its explicit stuffed-animal inclusion supports this narrower finished toy, not raw polyester, a plush fabric, loose filling, an empty shell, bedding or a component. The actual native Mass reference is retained; the current whole-flow read and retained versioned property/unit chain do not establish a measured factory inventory or approved background provider. The source synthesis establishes a real manufacturing route, not that Aurora and Steiff are independent measurements of one factory, nor that the general Steiff glued-joint and sewn-eye sequence is the Tom recipe. Tom specifies safety eyes and a stainless-steel identification button; no eye polymer, separate washer, glued joint or nose construction is inferred. Any real integral supplied eye assembly is bought once; separate retaining washers only when actually supplied separately. Sources: `un-cpc3-notes`; `steiff-manufacture`; `steiff-tom`; `aurora-quality`.\n\nLock Q (also called original Q0) as the positive sum of each unique complete toy first-acceptance net mass at the one fixed reference gate and measured state. Preserve the original event quantity and date. The complete event bridge partitions remaining net deliveries, every actual on-site accepted state including stored finished goods, holds, accepted samples and repair work in progress, irreversible material and water losses, and other terminal dispositions on the original acceptance basis. Record real changes in configuration and condition independently. A later destroyed or dried already accepted toy does not disappear from original Q0; only a never-accepted destroyed specimen is outside Q. Returns, rework, reinspection and resale create no second Q. Do not restore lost water/material into the survivor and count that loss again. Q0 is an event account, not another external physical output; Q=0 or unknown Q preserves raw totals without a unit result.\n\nMaintain three separate ledgers for a shared waste or asset event: the one full actual physical receiver transfer Qt and full actual treatment-provider quantity recorded once; independently evidenced component and physical-cohort provenance; and distinct nonoverlapping environmental/treatment-service vectors attributed to each served original cohort in compatible provider units. The raw physical disclosure q_phys=Qt/Qanalysis uses a declared positive observation basis Qanalysis only as a diagnostic, never as linked modeled demand for every cohort. Modeled demand is the evidenced attributable vector A_c/Q0_c or A_H/Q_H for that original cohort; sum attributed vectors to the once-only full service vector without recharging Qt to each cohort. Unknown shares stay unresolved. The complete waste composition and actual receiver/provider interface remain whole Qt. Apply this to packaging waste only when real shared recipient/service history exists; do not invent sharing, lifetime or fractions.\n\nA contaminated discarded bag, cloth or filter is one actual whole wet waste outlet including dry substrate, retained textile dust or liquor and water. Its dry substrate and retained contents are nested non-additive component accounts. There is no extra attached-dust, attached-water export or treatment demand unless those materials are actually separated before the boundary, in which case record the genuine separate outlets and matched receivers. Service allocation never shrinks the physical fleet, stocks or whole waste transfer. Independently collected textile dust remains its own genuine separate stream; mixed-only offcut, dust, failed-toy and packaging origins are non-additive children of the real whole mixed outlet.\n\nSynthetic consistency test only, not an empirical toy default: one contaminated filter transfer of 10 kg comprises 8 kg dry substrate and 2 kg retained dust and serves old/new cohorts. The receiver gets 10 kg once. If independent evidence assigns treatment service 25% to the new cohort and 75% to the old cohort in a composition-compatible kg-equivalent provider convention, modeled vectors are 2.5 and 7.5 kg-equivalent. Original Qnew=100 kg and Qold=200 kg give 0.025 and 0.0375 kg-equivalent per kg reference respectively. Neither a physical 2.5 kg transfer nor two full 10 kg modeled demands is correct. These fractions and quantities prescribe no actual site, filter installation, lifetime or allocation basis.\n\nThe six packaging pool symbols have the following fixed orientation in this method: P separate external purchase, I supplier-included ingress, ER external return RECEIVED, S gross shipment, EO external return SENT, W actual discarded article. Keep complete delivered/returned/discarded article state and composition, individual tare, attached-WIP/attached-FG/empty/reusable stock genealogy, new water/material influx and one upstream owner. Supplier-included I is physically visible without buying its included manufacture twice. Whole contaminated W includes retained contents once; empty-tare component balances and whole-wet-waste transfers are linked by explicit component bridges, never forced equal. Actual delivery loops do not create Q or a co-function/credit.\n\nAll genuine purchased fabric finishing, recycled or virgin fibre production, component manufacturing, transport, tooling and capital services must have complete compatible producers and nonoverlapping provider histories. Their purchase gates do not delete upstream dyeing/finishing, spinning or component manufacture. If genuinely performed on site, retain the complete real operation and every actual chemical/solution/air/water/utility/output/treatment interface; do not move it off site on paper. An available Flow identity is not an available or approved background Process. No incompatible provider or component proxy is allowed; unknown ordinary provider identities, quantities and uncertainties remain declared study-qualification gaps rather than a new factory/SKU exclusivity condition.\n\nPreserve the exact electricity reference property Net calorific value and its MJ energy unit group. The factor 3.6 converts measured kWh into MJ as an electrical unit conversion only, not a fuel calorific-value assumption. Atmospheric water-resource identity uses Volume in m3, whereas ordinary emitted water vapour uses Mass in kg. State the actual measurement convention, molecular phase, pressure, temperature and independently supported water-density relation if a mass bridge is needed; neither a bulk-air volume, an assumed liquid density nor a secondary native screening factor proves this bridge. If the actual atmospheric-water volume convention cannot be established compatibly, leave that auxiliary binding and its conversion unresolved while retaining measured humidity/water accounts; never silently change its property to Mass or fabricate a closure flow.\n\nSource-use limits remain binding in every downstream field. The EPA textile guidance is historical US chemical-reporting guidance: its reporting thresholds, neutralization zero conventions and exemptions are not LCA zeros, and its typical disposal/recycling arrows are alternatives rather than observed toy-plant outlets. ILCD subdivision and determining physical causality apply in the stated attributional allocation-needed context; residual common-process gate values do not authorize a recycling credit or multifunctional-product QFD shortcut. Source dimensions, care instructions, output volumes and certifications are observations of those sources, never recipe, yield, test acceptance, safety, recycled-content or lifecycle defaults for this method. Sources: `epa-textile-fabrication`; `ilcd-attributional`; `steiff-tom`; `aurora-quality`.\n\nFor every actual packaging pool, reconcile the complete same-unit physical bridge opening+P+I+ER+actual disjoint retained/repair/water increments=closing+S+EO+W+actual disjoint departures. Pair each genuine internal retained increment with its actual source once and cancel that handoff only on consolidation; do not erase real ingress or full wet closing stock. W is the whole contaminated receiver quantity with substrate/residue/water nested once. If a substrate-only component balance is also reported, bridge it explicitly to whole wet W rather than inserting the whole wet value into a dry-substrate equation. This is a conservation rule, not a default repair, moisture uptake or discard event. For a synthetic check only: O2+P3+I1+ER4+retained1=C3+S4+EO2+wholeW2=11kg; W includes1kg substrate plus1kg retained matter. Actual count records remain independent.\n\n"
