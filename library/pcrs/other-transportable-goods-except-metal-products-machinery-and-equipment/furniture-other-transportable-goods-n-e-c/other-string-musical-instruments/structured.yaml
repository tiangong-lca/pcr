  calculation_rules:
    - id: calc_q
      applies_to: "finished_guitar"
      rule: "Q = sum of actual measured net complete first-release instrument masses from the same cohort/configuration; each unique instrument once. Packaging and independent accessories excluded. Closing released FG is already in Q."
      inputs:
        - actual_net_masses
        - cp_release
      output: "Q"
      source_ids:
        - yamaha-craftsmanship
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Convert original units once before stock/ownership accounting; integrate actual rates only. 1 kWh = 3.6 MJ. Density and thermal state must be measured for that substance/state. Keep gross V and burden vectors distinct; preserve full wet closing stocks and every actual influx."
      inputs:
        - raw_records
        - cp_util_m
        - cp_util_h
        - cp_material
      output: "converted_raw"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_attribution
      applies_to: "all inventory rows"
      rule: "For manufacture, A_m_i = B_open_i + U_i - B_close_raw_WIP_unassigned_i - T_other_i after real unit conversion/subdivision/exchange causality and true residual allocation. B_close excludes first-released FG. Each inherited vector and real unassigned non-WIP store stays explicit; already stock-corrected U is not corrected again. T_other exists only for a true distinct function/cohort with justified one-time handover; ordinary failures/waste/sale/treatment are retained. Include actual pre-first-release tool-service draws received by this manufacturing cohort in A_m_i; their receiving denominator is Q, even when the same asset also serves later cohorts."
      inputs:
        - converted_raw
        - raw_WIP_inherited_vectors
        - actual_other_function_decision
      output: "A_m_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_service
      applies_to: "all inventory rows"
      rule: "For original cohort Q_H over actual H, A_h_i includes actual fulfilled storage/handling/packaging/asset/treatment/postwork increments and any genuinely assigned unused opening charge, minus only unused/unassigned closing service/charge and a justified one-time real other-function transfer. Never subtract performed service because FG remains held; do not import historical manufacturing vectors as new purchases. Physical gross V is never replaced by A_h_i or an economic share. H is the actual observation window, not another divisor. Already accumulated A_h_i or gross V_i is divided by original Q_H only through the sole quotient, never again by H. Asset/tool service in this account means only real later original-cohort work; pre-first-release manufacturing draws stay in calc_attribution under A_m_i and Q."
      inputs:
        - actual_service_records
        - original_Q_H
        - H
        - single_owner_vectors
      output: "A_h_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_quotient
      applies_to: "all inventory rows"
      rule: "x_i = N_i / Q_c, once only. N_i is A_m_i for manufacturing load, A_h_i for actual service load, or FULL actual gross leg V_i for physical-only disclosure. Q_c is Q for manufacture and the original Q_H for observed service/gross legs; no new product Q. Each dimension remains separate; physical V has no stock correction/allocation fraction or second provider/credit. Q_c = 0 retains raw numerators and physical flows with no unit result. Cards and aggregation reuse this same x_i without redivision."
      inputs:
        - A_m_i
        - A_h_i
        - V_i
        - Q
        - Q_H
        - cp_release
      output: "x_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_physical
      applies_to: "all inventory rows"
      rule: "For each gate reconcile full wet opening + actual external inflow = full wet closing + actual external outflow, with independently measured species/elements/carbon/water constraints. X_in/X_out only deduplicate another OTHER same-side in/out term, never retained influx. Pair/cancel internal instrument/component handoffs; packaging whole article/tare/content and components are disjoint; source-pool W sums to a real single mixed outlet and is not added beside it. Apply the explicit F_in/F_out versus SAME-side OTHER-term X definitions in b_pack at every applicable gate. Distinguish measured origin partitions of the actual exit from precollection discards: retain collection opening/closing wet stocks and every actual disjoint addition/loss, cancelling internal transfers once. Unknown partitions remain unresolved rather than fitted to one total."
      inputs:
        - raw_physical_stocks
        - gross_V
        - independent_species_constraints
        - overlap_bridge
      output: "closure_findings"
      source_ids:
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Keep actual supplied whole identity, native constraints, grade/form/phase/route/geography/medium/type and provider boundary; blank UUID never means a collection label or zero."
      evidence: "supplier primary records; exact native original; approved BOM"
    - id: dq_measure
      applies_to: "raw readings and Q"
      requirement: "Retain calibration, net/gross/tare distinctions, uncertainty, actual moisture/density/thermal state, original units and rate/integral evidence. Future quantities remain collection requirements, never invented factors."
      evidence: "calibration; raw meter and weighing; actual sample records"
    - id: dq_complete
      applies_to: "whole cohort and H"
      requirement: "Include every operation, first release, failure/idle/cleanup/sample/rework, raw/WIP per-flow vector, FG history, packaging six events and assets/service/treatment owner. Retain actual unknowns and coverage limits; no inherited approval."
      evidence: "complete raw logs; vector/stock/event bridge; source scope"
    - id: dq_acceptance
      applies_to: "actual work and downstream use"
      requirement: "Manufacturer/spec permission and actual posttests/acceptance/disposition determine conformity, not whether occurred physical load is recorded. Technical source synthesis is neither a certified factory inventory nor science/translation approval."
      evidence: "actual approved specification; permission/test/disposition; review metadata"
validation_rules:
  - rule_id: v_terminal
    applies_to: "reference and all inventory rows"
    rule: "Require the whole declared non-electronic six-string all-solid acoustic terminal, approved configuration/BOM and real first-release record. Whole-string-instrument native Product/Mass plus positive whole-primary scope is required; wrong acoustic/electric, part/whole, CAS, material, grade, route, form, phase, geography, medium or type cannot be overridden by a name/CPC match. Missing auxiliary/provider/measurement evidence stays explicit and blocks only dependent numerical use; a genuinely missing core identity is a core hold."
    source_ids:
      - yamaha-fg9-r
      - yamaha-craftsmanship
      - un-cpc3
  - rule_id: v_quotient
    applies_to: "raw quantities Q and all cards"
    rule: "All raw collection is undivided. Convert original units/rates and resolve real allocation/ownership before the sole quotient x_i=N_i/Q_c. Manufacturing uses A_m_i and Q; service uses actual A_h_i and original Q_H; physical-only cards use FULL actual gross V_i, not A_m/A_h, stock-corrected use or economic share. Cards and aggregation reuse that same result without another quotient, purchase, provider or credit. Q_c=0 retains all actual raw/attributed numerators and physical flows without a unit result. Future unknown records cannot be claimed measured or passing."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_balance
    applies_to: "physical and burden gates"
    rule: "Check independent gross wet mass, relevant elements, carbon origins and every water state across manufacturing, FG/service and consolidated gates. Verify per-flow raw/WIP inheritance, unique Q/closing-FG bridge, all six actual packaging events, assets/parts/fluids and disjoint whole/component/mixed-Waste bridges. Preserve retained influx and full closing mass together. Already net consumption is never twice corrected."
    source_ids:
      - ilcd-attributional-2010
      - yamaha-craftsmanship
  - rule_id: v_truth
    applies_to: "sources native restrictions and review"
    rule: "Verify whole sources, actual applicable route/state and counterexamples, each source id/type/reference/use and rule source_ids, original native property/group/reference unit, exact Chinese official displays and complete consumable context. Conditions in descriptions/ancestor units remain normative. Engineering/schema/projection/finite measurement checks do not approve real factory quantities, scientific methodology, translation, accepted mapping, classification coverage or publication."
    source_ids:
      - ilcd-attributional-2010
      - yamaha-fg9-r
      - yamaha-choose
published_dataset_profile:
  dataset_role: "Foreground manufacture method; only actual completed documented data packages become datasets"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual matching non-electronic six-string all-solid acoustic-guitar manufacture at its declared first-release gate, with explicit original-cohort observed service modules"
  excluded_use: "Whole-CPC coverage; electric/keyboard/bowed/nylon/kit/part/laminate routes; assumed factory inventory; lifetime performance/EPD/certification or unreviewed numerical defaults"
  required_metadata: "six-string non-electronic configuration and unique instrument/lot identity; solid Adirondack spruce soundboard and solid Indian rosewood back/sides with actual species and origin; mahogany neck and ebony fingerboard/bridge with actual supplied machining state; actual complete bracing/lining/block/binding/purfling/bridge-pin/pickguard/fixing BOM; bone nut/saddle and real adjustment scope; each actual string position/gauge/material and mechanical tuner identity; actual neck joint and any separate bolts/inserts; actual adhesive system with joint/specification permission; actual nitrocellulose body and polyurethane neck coating system and supplied whole preparations; actual wood moisture/conditioning state and same-configuration measured net instrument mass; calibration and first-release functional/sound/playability/appearance acceptance record; actual factory geography period and unique first-release Q; raw/WIP stocks and each inherited flow vector; original FG cohort Q_H and observed service horizon H; gross G/R and original shipment plus actual postwork permission/tests/disposition; per-article six packaging legs and whole/component disjoint bridge; actual utilities/carrier thermal state/returns and supplier water-energy ownership; independent physical mass/element/carbon/water and species-specific emission constraints; independent supplied case/wrench/documents excluded from net guitar mass but accounted once"
  required_quality_disclosure: "Primary source scope and counterexamples, technical synthesis versus measured records, actual source/measurement/provider/identity gaps, scientific pending and aligned author translation, raw/vector/gross completeness and uncertainty"
  update_trigger: "Actual BOM/joint/supply-face/coating/string/reference identity change, new source evidence, changed service gate, observed omission or substantive review"
data_sources:
  - id: "un-cpc3"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Structure, 30 June 2025, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Classification 38320 context and adjacent keyboard/electrical/parts/toy exclusions only; not a manufacturing methodology or accepted mapping."
  - id: "yamaha-fg9-r"
    type: "handbook"
    reference: "Yamaha, FG9 R Acoustic Guitar, https://shop.usa.yamaha.com/en/p/instruments/guitars-basses-amps/guitar-type/premium-guitars/fg9-r-acoustic-guitar ; snapshot 2026-10-20"
    used_for: "Coherent positive whole all-solid steel-string non-electronic terminal, actual listed materials and body/neck finish distinction; independent case/wrench/documents. No measured factory BOM or default quantities."
  - id: "yamaha-craftsmanship"
    type: "handbook"
    reference: "Yamaha, The Yamaha Difference: Craftsmanship, https://usa.yamaha.com/products/contents/guitars_basses/difference/craftsmanship.html ; snapshot 2026-10-20"
    used_for: "Qualitative wood supply/drying/remaining machining, bracing/linings/side forming/coating/fret/bridge/assembly and actual final playability inspection. Different models and electric/classical sections are restricted countercontext; no numeric recipe or universal joint/order."
  - id: "yamaha-body"
    type: "handbook"
    reference: "Yamaha, How the Acoustic Guitar is Made: Assembling the body, https://www.yamaha.com/en/musical_instrument_guide/acoustic_guitar/manufacturing/manufacturing003.html ; snapshot 2026-10-20"
    used_for: "Body side forming, block/lining and glued structural assembly qualitative example; its dovetail/simultaneous gluing/time is not imposed on FG9 R or other actual approved joints."
  - id: "yamaha-final"
    type: "handbook"
    reference: "Yamaha, How the Acoustic Guitar is Made: The final stretch!, https://www.yamaha.com/en/musical_instrument_guide/acoustic_guitar/manufacturing/manufacturing005.html ; snapshot 2026-10-20"
    used_for: "Whole body/neck and fret installation process context; nickel-silver fret material example, no universal fret count, dimensions or joining order."
  - id: "yamaha-coat"
    type: "handbook"
    reference: "Yamaha, How the Acoustic Guitar is Made: Coating and polishing, https://www.yamaha.com/en/musical_instrument_guide/acoustic_guitar/manufacturing/manufacturing004.html ; snapshot 2026-10-20"
    used_for: "Actual coating/sanding/polishing stages and neck pore context, not universal layer thickness, material fractions or process settings."
  - id: "yamaha-qc"
    type: "handbook"
    reference: "Yamaha, The Yamaha Difference: Quality control, https://usa.yamaha.com/products/contents/guitars_basses/difference/qc.html ; snapshot 2026-10-20"
    used_for: "Continuous actual production quality/hold/feedback and packaging test context. Accelerated/prototype abuse is not compulsory per-instrument production testing or an acceptance threshold here."
  - id: "yamaha-choose"
    type: "handbook"
    reference: "Yamaha, The Yamaha Guide to Choosing an Acoustic Guitar, https://www.yamaha.com/US/houseofworship/downloadables/How-to-Choose-Guides/how-to-choose-an-acoustic-guitar-updated.pdf"
    used_for: "Whole instrument anatomy and solid/laminated, nylon/steel, acoustic/electronic and parts/whole counterexamples; no tone/strength/lifetime or numeric manufacturing defaults."
  - id: "mohawk-instrument-2012"
    type: "handbook"
    reference: "Mohawk, Classic Instrument Lacquer M610-140, Product Data Sheet, revision 28 June 2012, https://www.mohawk-finishing.com/mhk_cds/product_pds/m610-140%20classic%20inst.%20lacquer%286-28-12%29.pdf"
    used_for: "Independent qualitative compatible instrument NC coating/sealer/sanding/rubbing/reducer whole-preparation example; both pages and typical-value caveat apply. No evidence of Yamaha order, same formulation, supplier validity today, process defaults or LCA allocation."
  - id: "titebond-original"
    type: "handbook"
    reference: "Woodbond Adhesives, Titebond Original, https://titebond.com.au/products/titebond-original/ ; tool-rendered primary text snapshot 2026-10-20"
    used_for: "Independent aliphatic resin emulsion musical-instrument adhesive example and its moisture/exterior/structural-use limitations; not universal joint authorization, actual factory supply or a numerical recipe."
  - id: "ilcd-attributional-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment—Detailed guidance, First edition March 2010, section 7.9, https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctionality: dedicated/virtual subdivision then exchange-specific determining physical causality and only true residual common-process actual-state contemporaneous market value. Not instrument manufacturing facts, arbitrary physical/economic choice or automatic credit."
  - id: "yamaha-two-panels"
    type: "handbook"
    reference: "Yamaha, The guitar top is actually two panels stuck together, https://www.yamaha.com/en/musical_instrument_guide/acoustic_guitar/trivia/ ; snapshot 2026-10-20"
    used_for: "Bookmatched solid panels and actual edge-joining supply-face context; no prescribed panel count, species, dimensions or factory BOM."
