      raw_fields: "row_id; serial; configuration; full_wet_mass; integral_fluid; opening_installed; new_receipt; used_receipt; actual_repair_added; worn_removed; reusable_out; waste_out; full_closing; included_bridge; water_in; water_out; overlap_other_inout; actual_hours; idle; failure; capacity; utilization; causal_driver; provider_vector; unused_service; cohort; permission; test; disposition; receiving_operation; receiving_cohort; pre_or_post_first_release; manufacturing_Q; original_Q_H; observed_H"
      collection_method: "Keep full asset/part/fluid physical custody separately from actual fulfilled service and one embodied/maintenance provider vector. No fixed life, arbitrary per-kg machine or service from physical mass alone. Preserve real new/used parts and water influx with full wet closing stock; included parts and independent additions are disjoint. Keep actual failures/unauthorized repair and performed service for held FG; only unused/unassigned service carries. Raw-only. Classify each actual draw by receiving operation/cohort and pre/post-first-release state. Pre-release manufacturing tool service enters A_m_i with Q under calc_attribution; only actual later original-cohort service enters A_h_i with original Q_H under calc_service. Retain one embodied/maintenance provider vector, actual hours/capacity and remaining service; no duplicate provider or new output Q. Keep accounts with different receiving cohorts/denominators separate. Record raw data here; calc_quotient performs the single normalization."
