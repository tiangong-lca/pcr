system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "complete instrument route"
      rule: "Receive actual dried tonewood/complete supplied boards or machined parts at their declared supply face. Include remaining cutting/planing/edge joining, bracing and lining/block bonding, actual side bending, neck/fingerboard/fret and bridge work, coating/sanding/drying/polishing, approved neck joint, tuner/string fitting, setup and final function/playability/sound/appearance acceptance. Purchased completed work stays upstream once; supplied components and internal whole-guitar handoffs never become another external whole-guitar purchase or Q."
      source_ids:
        - yamaha-craftsmanship
        - yamaha-body
        - yamaha-final
        - yamaha-fg9-r
    - rule_id: b_source_limits
      applies_to: "source-specific routes"
      rule: "This is transparent qualitative technical synthesis, not one measured factory/SKU BOM. FG9 R supplies a coherent all-solid non-electronic terminal; its bolt-on neck overrides generic dovetail/set-neck prose for that example. Generic simultaneous body gluing and L-Series sequential gluing are alternatives, not added operations. Do not impose A.R.E., electric I.R.A., classical nylon/shellac, laminated panels or electronics. Actual joint/coating system and work order require the real approved specification; no source example authorizes all joints."
      source_ids:
        - yamaha-fg9-r
        - yamaha-craftsmanship
        - yamaha-body
        - yamaha-choose
        - titebond-original
        - mohawk-instrument-2012
    - rule_id: b_release
      applies_to: "unique first-release Q"
      rule: "Q is the sum of measured net complete instrument masses first quality-released once in the same declared configuration/cohort and moisture state. Closing FG already first released is inside Q and cannot be added as another output or deducted as manufacturing burden carry. Dispatch, return, reinspection or resumed shipment never creates Q. Manufacturing carry comprises only genuine raw/WIP/unassigned non-WIP stores with each inherited exchange vector. Preserve opening/closing raw and WIP, failed/zero-output runs, start-stop, idle, cleanup, samples and actual rework. Each opening and closing unused/unassigned non-WIP store must retain its actual physical quantity as well as every inherited exchange vector and origin; a vector balance never replaces that stocktake."
      source_ids:
        - yamaha-craftsmanship
        - yamaha-qc
        - ilcd-attributional-2010
    - rule_id: b_service
      applies_to: "original-cohort factory-gate service"
      rule: "Record actual storage, handling, packaging, dispatch, returns and occurred post-release work under original Q_H and the observed H, never a new product denominator. Retain performed original-cohort service even if FG is held at closing; carry only unused/unassigned service or charge. Keep full opening/closing FG history and per-flow manufacturing burdens separately from current actual increments. A net-delivery alternative would require full gross G/R, original delivered-state reversal D_rev and burden bridge; returned wet mass is not guessed equal to original delivery. It is outside this first-release denominator."
      source_ids:
        - ilcd-attributional-2010
        - yamaha-qc
    - rule_id: b_physical
      applies_to: "manufacturing FG and consolidated physical gates"
      rule: "Reconcile full wet opening stocks plus every actual gross external inlet to full wet closing stocks plus every actual gross external outlet. Manufacturing-to-FG Q is an internal handoff; pair/cancel it in the consolidated gate, never add Q beside closing FG and G/R. Gross physical quantities, packaging, assets, parts and water do not follow burden/economic allocation fractions. X_in/X_out remove only identical overlap with OTHER same-side inlet/outlet terms; new materials/water remaining in closing stock retain BOTH their actual influx and full wet closing mass. Already net stock-corrected consumption is never stock-corrected again."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: b_pack
      applies_to: "each actual packaging pool"
      rule: "For each actual article pool retain P/I/ER/S/EO/W and use full wet O + P + I + ER + F_in - X_in = C + S + EO + W + F_out - X_out. O/C include all empty, WIP/FG-attached, reusable and actual retained discarded/collected states belonging to that boundary, or an explicitly paired separate collection-stock subgate. F_in/F_out are independently measured actual additional repair materials, water/moisture ingress, removed parts, drainage or evaporation not already owned in whole-article events. X removes only the identical proven duplicate in an OTHER actual term on the SAME side, matching article/lot/event/species/unit/period and owner; card presence, closing stock, opposite-side flow, stock-adjusted burden or economic share never justify X. Whole wet articles or an exhaustive mutually exclusive component bridge are alternative representations, never additive. Internal handoffs/reuse cancel. One actual mixed external Waste total/provider has independently measured non-additive origin-W partitions of that same exit/state/period; if origin amounts are unknown, do not fabricate them. Actual separate outlets retain their own specific rows and treatment."
      source_ids:
        - ilcd-attributional-2010
        - yamaha-qc
    - rule_id: b_water_carbon
      applies_to: "all materials water air and residues"
      rule: "Constrain whole physical mass and relevant elements independently. Keep wood biogenic carbon, fossil resin/coating/plastic carbon, ambient carbon and upstream forestry uptake distinct, with no automatic storage or waste-sale credit. Measure free/sorbed wood moisture, liquid/vapour/carrier/formulation water, structural water and independently evidenced reaction water separately. Ordinary storage/handling sorption and desorption are actual atoms and require no invented work permission. Glue drying and solvent loss do not establish reaction water. VOC/COD/TOC/PM and wood-dust indicators are not molecular species; one residual cannot determine two unknowns. Integrated gas/liquid volumes are not multiplied by time again; only real rates are integrated. Density must describe that substance and actual state."
      source_ids:
        - yamaha-craftsmanship
        - mohawk-instrument-2012
        - ilcd-attributional-2010
    - rule_id: b_work
      applies_to: "all actual failures returns and postwork"
      rule: "Manufacturer/specification permission, postwork tests, acceptance and disposition govern actual rework and continued conformity. They never delete unauthorized, failed, held or unaccepted work that actually occurred; keep its full physical flows, load and original cohort with actual hold/waste. Broken wood/joints/coatings are not assumed restored. Ordinary manufacturing waste, samples, failures, external sale/removal and their treatment do not automatically subtract burdens. Only a real distinct other cohort/function and justified allocation/handover may receive one vector transfer; physical gross remains complete."
      source_ids:
        - yamaha-qc
        - ilcd-attributional-2010
    - rule_id: b_extend
      applies_to: "actual missing atomic exchanges and providers"
      rule: "Before numerical use, add each real unlisted wood species/supply form, inlay, insert, fastener, whole preparation, separately added chemical, fuel, energy, water phase, refrigerant, package, waste outlet and real emission species individually. Never use an other-material/energy-carrier collection or absence inferred from query failure. Onsite manufacture of a supplied component/formulation requires every actual purchased material, energy and loss instead of repeating a whole provider. For thermal service preserve actual carrier kg, heat MJ, Product returns, state/enthalpy and supplier water-energy boundary; no invented steam or boiler."
      source_ids:
        - ilcd-attributional-2010
        - yamaha-craftsmanship
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. F_in/F_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - ilcd-attributional-2010
