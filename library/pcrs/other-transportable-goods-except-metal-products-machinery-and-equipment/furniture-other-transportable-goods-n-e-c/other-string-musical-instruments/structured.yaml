      collection_method: "Measure six actual event legs for each real article, including first non-purchased external ingress without extra invoice, complete opening/closing wet stocks and natural/added water or repair atoms. X removes only another same-side flow-term overlap, not retained influx. Whole wet P/I and component/tare/content bridges are disjoint; internal reuse cancels. Single mixed outlet uses one Waste and disjoint pool-W. Store FULL gross V independent of load share; charge account attributes one provider/service vector. Raw-only.  Apply b_pack real-F and exact OTHER same-side X rules; retained influx is not deduplicated against stock. Mixed origin W is non-additive and matches the actual exit; collection stocks/losses are retained. For packaging only, apply packaging_receipt_basis; standalone non-purchase is I, never invented ER or X."
