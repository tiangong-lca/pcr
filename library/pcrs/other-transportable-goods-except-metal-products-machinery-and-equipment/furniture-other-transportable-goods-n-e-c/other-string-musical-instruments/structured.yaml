allocation_rules:
  - rule_id: a_subdivide
    applies_to: "attributional method"
    rule: "Apply only where attributional allocation is justified by the study goal. First separate dedicated production and actual or virtual subdivision, directly assigning each uniquely related input/operation to the receiving instrument/cohort/function. Do not apply industrial manufacture literature as allocation authority or freely choose physical versus economic allocation."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_causality
    applies_to: "remaining shared exchanges"
    rule: "For every remaining exchange establish the determining physical causal relationship, using actual measured process mechanics, residence/operation time with the truly limiting mass/area/volume/capacity where needed. It may differ for each exchange; an entire factory or all materials do not inherit one arbitrary mass share. No fixed yield, time, machine life or allocation percentage is supplied. For each exchange, allocated vectors across all real receiving functions/cohorts must sum to its complete pre-allocation inventory; full physical gross quantities remain independent."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_residual
    applies_to: "true residual common-process functions"
    rule: "Only the demonstrated residual lacking subdivision and determining physical causality uses actual contemporaneous market values of real co-functions at the same common-process gate and actual exit condition. Document why residual and common gate/state apply, price period/unit and sensitivity. Ordinary offcuts, failures, samples or treatment exports are not automatically another function. No automatic displacement credit, negative purchase, waste-sale credit or repeated transferred vector."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "finished_guitar"
      record_type: "unique first-release acceptance and calibrated weighing"
      raw_fields: "instrument_id; configuration; complete BOM; supplied state; actual net mass; moisture; calibration; function test; sound/playability; appearance; first_release_at; original cohort; Q; all failed records"
      collection_method: "Weigh each actually accepted complete same-configuration guitar without packaging or independent case/wrench/documents on a calibrated scale; sum actual unique first-release net masses. Store raw acceptance and measured masses only. Verify actual approved sound/playability/appearance criteria without inventing thresholds."
      unit: "kg; actual test units"
      frequency: "each instrument and cohort close"
      temporal_coverage: "full manufacture cohort"
      site_scope: "manufacture-to-FG internal release"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw evidence and calibration; actual specification/supplier state; full event/stock/vector bridge; uncertainty and real acceptance/disposition. Aggregation only references the sole section-8 result; no quotient in raw collection."
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "actual individual materials and preparations"
      record_type: "receipt stock assay and operation records"
      raw_fields: "row_id; supplier; species; whole supplied preparation; grade; route; form; quantity; original unit; moisture; assay; calibration; receipt machining; opening_raw; closing_raw; opening_WIP; closing_WIP; inherited vector; real added material; included bridge; loss; actual joint approval ; opening_unused_nonWIP_physical_quantity; closing_unused_nonWIP_physical_quantity; each_nonWIP_inherited_vector_and_origin"
      collection_method: "Weigh or meter whole actual received articles/preparations in original units; independently measure actual-state density/wood moisture only when needed. Record all manufacture steps and failures, supplied completed work upstream once, and each raw/WIP inherited exchange vector. Whole formulation purchase and ingredient/water assay subledgers never add together. Raw-only, no division.  Independently stocktake opening/closing unused non-WIP quantities and retain all corresponding per-flow vectors; an already-net record is not corrected a second time."
      unit: "kg; original extensive unit"
      frequency: "each receipt operation and stock event"
      temporal_coverage: "full production period"
      site_scope: "actual supplier and production gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw evidence and calibration; actual specification/supplier state; full event/stock/vector bridge; uncertainty and real acceptance/disposition. Aggregation only references the sole section-8 result; no quotient in raw collection."
    - protocol_id: cp_util_m
