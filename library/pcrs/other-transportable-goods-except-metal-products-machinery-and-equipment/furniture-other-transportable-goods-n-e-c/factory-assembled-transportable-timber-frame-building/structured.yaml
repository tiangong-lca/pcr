product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.furniture-other-transportable-goods-n-e-c.factory-assembled-transportable-timber-frame-building"
  classification_refs: "CPC 3.0 38701; narrower product and route boundary"
  covered_products: "Complete predominantly wooden single-unit timber-frame buildings at first factory quality release; one configuration and complete bill of supplied items"
  excluded_products: "Bare frame or panel kits; isolated components; furniture; site-completed multi-unit buildings; site construction services"
  representative_product: "One complete insulated timber-frame building with installed roof/façade/windows/doors and declared interior and fixed-service completion"
  production_route: "Receive actual timber and purchased boards/articles → inspect/cut/machine → fabricate floor/wall/roof framing → install sheathing/insulation/membranes → combine complete building → install declared fit-out/services → finish/seal/test → first quality release → actual storage/packing/dispatch service"
  market_state: "Complete factory product awaiting disclosed foundation and utility connection; no assertion of installed occupancy approval"
functional_unit:
  what: "Manufacture a complete factory-assembled timber-frame building in its declared supply configuration"
  how_much: "1 kg net complete first-released building; packaging and delivery equipment excluded"
  how_well: "Actual approved configuration and component schedule; documented geometry and quality tests; only supported structural/fire/thermal/electrical/plumbing claims"
  how_long_or_cycle: "One identified manufacturing cohort with observed service horizon H; no assumed occupancy duration or service life"
  reference_flow_link: "finished_building"
system_boundary:
  rules:
    - rule_id: complete_terminal
      applies_to: "complete building"
      rule: "Include actual receipt inspection, cutting/woodworking joints, floor/wall/roof-frame manufacture, sheathing, insulation, membranes, connection, treatment/coating where actually performed, declared fit-out, sealing, quality tests and first release. Resolve internal transfers without a second finished building or panel output. A complete module cannot be mixed with a bare structural kit under this reference."
      source_ids:
        - prg-timber-building
        - prefabeu-factory
    - rule_id: supply_bridge
      applies_to: "purchased articles and formulations"
      rule: "Each purchased whole article or complete supplied formulation is charged once including its contained adhesive/coating/solvent/water and installed hardware. BOM component analysis is a nonadditive subledger, not another purchase. Select disjoint receipts or a reconciled whole/component bridge; cancel exact internal transfers. Actual onsite mixture manufacture instead records every separately purchased ingredient, energy and losses with its own atomic row. Distinguish supplied treated wood from onsite treatment/touch-up; a fire/bio treatment claim supplies neither chemistry nor emission factors."
      source_ids:
        - prg-timber-building
    - rule_id: first_release_stocks
      applies_to: "manufacture and released stock"
      rule: "Q counts only new complete first quality releases at release-state net mass. Closing released finished goods are already in Q and are not subtracted again as manufacturing output. Keep opening/closing raw, WIP, non-WIP and released FG mass/composition, stage status and every inherited exchange vector. Preserve all failed/zero-output/start-stop/idle/cleanup/test/rework loads. Do not turn delivery, reinspection, permission, rejection reversal or moisture change into new output."
      source_ids:
        - prg-timber-building
    - rule_id: service_horizon
      applies_to: "post-release work and returns"
      rule: "Keep storage, wrapping, handling, dispatch and actual returns/rework services in their own observed-horizon H ledger linked to original cohort Qc. Include only services actually performed by H; future services are unknown, never assumed zero or fabricated now. Retain the original delivered item and any required reversal with its original burden, plus real incremental work. Combine manufacture and service by cancelling the internal release transfer once; original Qc is not counted again as new production."
      source_ids:
        - prg-timber-building
        - ilcd-allocation-2010
    - rule_id: physical_gates
      applies_to: "physical mass and element balances"
      rule: "Manufacturing, FG-service and combined gates must reconcile independently as detailed in section 8. Preserve every actual gross boundary crossing, including failed/refused/unauthorised movements and external returns; permissions control acceptance, not the existence of physical movements. X only deduplicates the same independently identified OTHER_actual flow on the same side. It never erases inventories, opposite-side movements or a card. Keep retained water and sorption in whole wet closure; carbon/species evidence is independent of physical closure."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: packaging_gate
      applies_to: "each packaging article"
      rule: "For each separate packaging pool record opening empty and attached WIP/FG and reusable stock, purchases, external returns received, closing pools, gross physical shipments, external returns sent and waste. Internal reuse cancels and creates no repurchase, Q or automatic coproduct. Preserve every present P/I_sup/ERin/S_gross/EOout/W_whole channel as an atomic exchange or identified stock observation; do not replace physical gross material with an environmental allocation/service/asset-use share."
      source_ids:
        - prefabeu-factory
        - ilcd-allocation-2010
    - rule_id: water_heat_species
      applies_to: "utilities treatment and releases"
      rule: "Screen actual heating, combustion, test water, coatings and treatments without assuming their presence. Add missing actual fuels, fluid species, waste routes or ingredients as individual cards before claiming completeness. A real purchased heat carrier requires kg, phase, T/P and enthalpy and supplier return-water/energy convention; one supplier heat+carrier bundle is bought once. Record actual external condensate/hot-water Product returns at gross native amount. Do not invent a boiler, steam loop, reaction water or CO2 uptake in building assembly. VOC/COD/NOx indicators are not molecular amounts. A measured phase-defined whole particulate mixture may be one physical-mass flow with nested actual composition, never a pure elemental-carbon surrogate; unresolved chemical species or phase stays unknown."
      source_ids:
        - prefabeu-factory
    - rule_id: separate_site
      applies_to: "excluded later work"
      rule: "Keep foundations, transport/site lifting, site joints/connections/commissioning, occupancy, maintenance, replacement and end-of-life separately declared. Factory testing is retained; factory completion does not imply site connection or installed building approval. Upstream article manufacture, inbound transport and foreground processing must be linked once at nonoverlapping gates. Assess/disclose capital and personnel boundaries instead of assuming an exemption."
      source_ids:
        - prg-timber-building
        - prefabeu-factory
    - rule_id: cohort_full_partition
      applies_to: "actual declared configuration"
      rule: "Q0 is independently fixed from unique first quality-release events for complete same-configuration buildings after every required factory operation and test, ready for the declared factory supply gate. It includes all actual retained articles and water at release and excludes transport packaging/trailer tare. Reconcile each original Q0 on its original-material/configuration basis across disjoint net remaining external deliveries, every actual on-site accepted FG/held/returned/rework state, irreversible losses and other terminal dispositions. Gross return first leaves its old delivery position. Dispatch, return, repacking, retest or reacceptance never creates new Q. Current surviving wet mass and original water/material losses cannot both be restored and counted again. Opening old cohorts and later observed-H services use original Qc/Q0, not current output; delivery plus closing FG is sufficient only when all other postgate states/exits are absent. Q=0 or unknown retains actual raw loads without a per-unit result."
      source_ids:
        - prg-timber-building
    - rule_id: burden_provider_history
      applies_to: "actual declared configuration"
      rule: "Keep complete physical raw/WIP/non-WIP/FG/return, packaging, installed-fluid and every actual equipment-fleet ledger separate from reference events and per-exchange burden vectors. Own opening WIP carries actual earlier foreground burdens once; only substantiated still-unused/unassigned closing WIP carries them forward. For attribution, A may add unassigned inherited opening burden to period raw burden and remove only demonstrated still-unassigned closing burden and a disjoint justified other-system/cohort handover. Already-net consumption is not stock-corrected a second time; accepted closing FG and services already performed for it are not deleted. A complete provider aggregate and its embedded material/transport/asset/history decomposition are mutually exclusive. Preserve failed attempts, idle/start-stop, inspection, samples, cleanout and repair loads. Actual complete upstreams match the whole supplied article/preparation and true availability point; no receipt or purchased-service label hides known on-site manufacture. Actual provider inclusion schedules cover current electricity, repair, transport and operating supplies as well as capital: an aggregate already including a metered foreground operation and that separate operation cannot both be charged."
      source_ids:
        - ilcd-allocation-2010
        - prg-timber-building
    - rule_id: actual_physical_transfer
      applies_to: "actual declared configuration"
      rule: "T_accept is the actual physical transfer at the declared manufacture-to-FG-service gate; Q0 is the separately measured first-release reference-event denominator. Where the same configuration, state, event and window make them coincide, demonstrate that equality from independent records, never fit Q0 from physical closure. The finished reference row declares the unit and is not another external shipment. Manufacturing, FG-service and consolidated gates retain every real wet stock and gross exchange; consolidation cancels the one actual internal T_accept only, not external dispatch or real return. For an actually reacting species i, keep measured G_i formation and C_i consumption in its species equation; do not conserve reacting molecules by assumption or infer them from elemental closure. Chemical reactions create no net total-mass/element source; phase transfer is not chemical creation. Water additions/evaporation and all other terms must be mutually disjoint from water already included in whole supplied articles, carrier legs or releases. Unknown terms remain unresolved, not residual-fitted."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: whole_wet_packaging
      applies_to: "actual declared configuration"
      rule: "For each actual whole wet PE-film, wooden-skid or steel-rack pool use O_empty+O_attachedWIP+O_attachedFG+O_reusable+P+I_sup+ERin+J_in+H2O_in-X_in=C_empty+C_attachedWIP+C_attachedFG+C_reusable+S_gross+EOout+W_whole+J_out+H2O_out-X_out. I_sup is actual disjoint supplier-included packaging, not another purchase; internal reuse R_internal cancels between matched positions and is not I_sup. J is additional real non-water material and H2O is additional actual water transfer only to the extent not already included in another whole wet leg. O/C and every whole leg retain all contained matter: actual new material/water retained in C never erases its true influx. X subtracts only independently proved overlap with OTHER same-side flow terms, never C, real increments, opposite directions or card existence. Trace actual J/water sources/destinations with specific physical records and internal pairs; do not invent a generic provider, extra Q, separate constituent waste or balancing flow. Gross shipments, external returns received/sent and true whole waste stay physically full regardless of environmental use shares. These three specific article pools are conditional on actual configuration; the source proves wrapping/packing but no universal material, tare, repair, water uptake or mass."
      source_ids:
        - prefabeu-factory
        - ilcd-allocation-2010
    - rule_id: whole_receiver_service
      applies_to: "actual declared configuration"
      rule: "One actual contaminated film, skid, rack, machine, filter, mixed dust, rejected building part or liquid consignment has one whole receiver event Qt containing substrate/article, retained wood/OSB/mineral/coating matter and water once. Dry tare and measured originW/components are nonadditive nested analyses, not extra exported wastes unless physically separated before the boundary. Match its actual receiver/treatment/provider and extensive unit. Physical Qt and Qt/Q disclosure are not automatically the service demand: use only evidenced compatible nonoverlapping service A with the original cohort Qc/Q0, keeping physical transfer full. Unknown attribution remains unknown. Arithmetic illustration only: a shared10kg consignment is never shrunk to2.5kg by25% attribution and never charged as10kg again to every cohort. Different dry/wet or provider units require the actual full-composition/state bridge, not a hidden conversion or pure-component proxy."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: actual_capital_fleets
      applies_to: "actual declared configuration"
      rule: "Every actual cutting/machining line, truss press, tool, extraction/handling unit and reusable rack keeps a complete actual configured fleet: new/used receipts, external returns received/sent, real retirement/whole waste, installed/opening/closing holdings and disjoint repair/fluid changes. The PrefabEU named machinery illustrates actual industrial operations, not mandatory equipment at the PRG plant or a shared SKU. A whole line/provider already including a machine and a separate purchase of that machine cannot both be added. Measure actual complete configuration mass M if count/mass conversion is needed; Item(s) is not kg and no machine mass or lifetime is supplied. Actual service h must match a complete real provider history and observed original-cohort use, unused/unassigned capacity and inherited burdens; physical fleet kg is not scaled by a service share. Separately supplied oil/filter/belt and whole contaminated removed items need their own atomic interfaces when actually present; contained parts remain nested in a whole asset. Receipt/return/shipment/retirement cards disclose physical V only; they are not a second capital purchase when the actual compatible service history already owns the same upstream manufacture. Actual provider-service scope and separately metered operation/repair must be nonoverlapping."
      source_ids:
        - prefabeu-factory
        - ilcd-allocation-2010
    - rule_id: wood_moisture_programme
      applies_to: "actual declared configuration"
      rule: "USDA FPL2021 Chapters4/13 provide an actual wood-moisture programme: representative matched-state specimens, immediate weighing or moisture-protected storage, oven drying to constant mass and the stated dry-mass convention, plus electrical-meter calibration/species/temperature/depth/gradient limitations. Use u=(wet-dry)/dry and w=(wet-dry)/wet on actual compatible specimens, converting percentages to fractions; w=u/(1+u). The source warns that volatile extractives can make oven loss exceed true water. Do not equate whole coated/resin-containing/treated article loss with H2O or apply a timber meter to a complete house. Keep gypsum structural water, membrane/coating carriers, free/bound wood water and actual atmospheric sorption distinct. Whole supplied wet mass remains independently weighed even if a water subdivision is unresolved. An actually necessary untreated/treated-matrix or water-phase procedure not established remains a specific method hold; routine actual calibration/sampling/recovery of an established applicable programme is an unperformed study obligation. No climate EMC, density, moisture target, drying time, empirical range or source numerical performance becomes a PCR default. The retained handbook text is the procedure source here; its references to ASTM D4442/D4444 do not mean those complete standards were acquired or that ASTM conformity is claimed."
      source_ids:
        - usda-wood-moisture-2021
    - rule_id: real_analytical_programme
      applies_to: "actual declared configuration"
      rule: "Use complete EPA320 only for actual identified IR-active vapor species and its real extractive heated-transport/reference-spectrum/interference/analyte-spike recovery programme. It is not total-VOC chemistry, a dust method, or FTIR measurement of homonuclear O2/N2/monatomic Ar. EPA5 supplies filterable particulate sampling/recovery/gravimetry only within its stated phase and source conditions; actual wood/OSB/mineral/coating particulate is a measured whole physical mixture, not elemental C or a fictitious pure resin. Captured dust is Waste and is separate from the actual final air release. Actual collected condensate/mist goes whole to its real receiver; final released species/medium require their own applicable procedure, not a dry-PM assertion about all phases. Do not infer actual formulation constituents or release from a generic supplier label. Actual on-site combustion needs its complete producer/fuel/air/O2/water-generation/each real species/ash/energy/control unit, not CO2 alone or a purchased-heat stub; add those specific interfaces and actual procedures before data completeness. This source set does not establish a full programme for every unidentified formulation, reacting species or condensable/other phase: a genuinely necessary unestablished procedure remains hold. Actual-site calibration/lot QA within an established applicable programme remains study qualification, not proof no method exists; finite check never approves science, performance or study results. The retained Method5 explicitly incorporates Methods1–3; the full originals are also retained here for actual duct geometry/traverse, calibrated velocity/pressure/temperature/flow and dry-gas-density procedure. Respect non-cyclonic/size/location limits rather than claiming every room or duct is covered. An actual uncontained fugitive release is not automatically represented by one duct or personal-exposure result. Method3 discloses its restricted gas matrix, interferences and unabsorbed N2/CO remainder and its argon omission: no nominal air composition/dry molecular weight, pure N2 flow or measured Ar is inferred. Method320 PDF16 prints a tracer spiked/direct fraction in Eq3 and a fraction-mixing Eq4 but labels DF>=10; preserve that actual inconsistency, not a numerical default. On a common corrected mole basis, use the actual conserved mixture fraction phi=(tracer_spiked-tracer_native)/(tracer_direct-tracer_native), with a nonzero denominator, representative matched samples and the stated no-unaccounted-loss mixing conditions; expected analyte=phi*analyte_direct+(1-phi)*analyte_native. Distinguish phi from its reciprocal dilution ratio, validate actual recovery and retain failed/negative results and uncertainty. This mathematical identity supplies no source concentration, acceptance tolerance, emission factor or factory QA success. These are dated EPA Internet copies, not an assertion of current regulatory conformity."
      source_ids:
        - epa-method320
        - epa-method5
        - epa-method1
        - epa-method2
        - epa-method3
