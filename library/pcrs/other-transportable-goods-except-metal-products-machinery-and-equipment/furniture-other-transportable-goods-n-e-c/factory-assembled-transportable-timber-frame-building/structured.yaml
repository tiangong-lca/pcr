    reference: "US EPA Method1,28April2020 Internetcopy,complete original. https://www.epa.gov/sites/production/files/2017-08/documents/method_1_3.pdf"
    used_for: "Actual duct geometry, site/traverse/cyclonic restrictions and representativeness; no factory dimensions or universally valid sampling location."
  - id: "epa-method2"
    type: "official_guidance"
    reference: "US EPA Method2,2August2017 Internetcopy,complete original. https://www.epa.gov/sites/default/files/2017-08/documents/method_2.pdf"
    used_for: "Actual calibrated pitot/velocity/state/density and flow programme within its scope; no nominal gas density, air recipe or volumetric default."
