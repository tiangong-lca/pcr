published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only after complete foreground and upstream evidence"
  downstream_use: "Declared-configuration factory manufacture of a complete timber-frame building; link separately to transport/site/whole-life studies"
  allowed_use: "Only compatible complete supply state, native basis and verified provider/region/time; disclose observed H"
  excluded_use: "Generic installed-building equivalence; bare kits/panels; furniture; lifetime/thermal/carbon-neutrality claims; automatic credits"
  required_metadata: "All reference qualifiers; full bill of supply; Q/cohort/stock/service definitions; actual geography/time; upstream gates; native identity and measurement chain"
  required_quality_disclosure: "Missing core/auxiliary identities and providers; unknown future services; physical/element residuals; allocation and measurement uncertainty; source limits and review state"
  update_trigger: "Changed terminal completeness, material/treatment/assembly route, configuration, supply gate, reference property, provider/region/time or observed-service horizon"
data_sources:
  - id: "unsd-cpc3-buildings"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf; 30 June 2025; page 195"
    used_for: "Original assembled/unassembled/incomplete building scope and predominantly wooden subclass; no manufacturing prescription or mapping approval"
  - id: "prg-timber-building"
    type: "literature"
    reference: "https://prg-house.com/en/frame-house/; complete manufacturer HTML; manufacturing stages and formats 01–04"
    used_for: "Main complete-building factory route and whole-house format 02; wall diagrams and adjacent alternative supply formats; no adopted numerical density/thickness/time/performance/lifetime"
  - id: "prefabeu-factory"
    type: "literature"
    reference: "https://www.prefabeu.com/production/; complete manufacturer HTML; factory line and separate element/module supply"
    used_for: "Independent cutting/framing/sheathing/insulation/sealing/fit-out/wrapping route context and site-assembly distinction; not a common SKU or factory dataset"
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf; first edition March 2010; sections 7.9.2–7.9.3; PDF pages 275–292"
    used_for: "Attributional cases requiring allocation: subdivision/virtual subdivision then exchange-specific determining physical causality then residual actual-condition common-gate market value; conservation and counterexamples; no industrial recipe or numeric transfer"
  - id: "usda-wood-moisture-2021"
    type: "official_guidance"
    reference: "USDA ForestProductsLaboratory,WoodHandbookFPL-GTR-282,2021,Chapters4/13; complete original and actual bounded moisture context. https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "USDA FPL2021 Chapters4/13 provide an actual wood-moisture programme: representative matched-state specimens, immediate weighing or moisture-protected storage, oven drying to constant mass and the stated dry-mass convention, plus electrical-meter calibration/species/temperature/depth/gradient limitations. Use u=(wet-dry)/dry and w=(wet-dry)/wet on actual compatible specimens, converting percentages to fractions; w=u/(1+u). The source warns that volatile extractives can make oven loss exceed true water. Do not equate whole coated/resin-containing/treated article loss with H2O or apply a timber meter to a complete house. Keep gypsum structural water, membrane/coating carriers, free/bound wood water and actual atmospheric sorption distinct. Whole supplied wet mass remains independently weighed even if a water subdivision is unresolved. An actually necessary untreated/treated-matrix or water-phase procedure not established remains a specific method hold; routine actual calibration/sampling/recovery of an established applicable programme is an unperformed study obligation. No climate EMC, density, moisture target, drying time, empirical range or source numerical performance becomes a PCR default. The retained handbook text is the procedure source here; its references to ASTM D4442/D4444 do not mean those complete standards were acquired or that ASTM conformity is claimed."
