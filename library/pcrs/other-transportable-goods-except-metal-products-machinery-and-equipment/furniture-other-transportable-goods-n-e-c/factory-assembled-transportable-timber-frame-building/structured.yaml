measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the sum of individually traceable complete buildings first quality-released in the cohort, at their measured net release mass. Use cp_reference: calibrated whole-unit weighing with tare subtraction or independently weighed disjoint supplied-item reconciliation with uncertainty. Include actual retained components and water once. Exclude packaging, transport trailer, rejected units and internal modules. Count only the first release; neither dispatch nor reinspection creates production."
  - id: native_basis
    applies_to: "reference and every database binding"
    required_property_ref:
      name: "Verified native reference property"
      uuid: ""
    required_unit: "kg; item; m2; m3"
    rule: "The selected manufactured wooden-prefabricated-building Product has a verified Mass/kg reference chain. Its broad family is narrowed to the complete single-unit configuration throughout the reference and finished-row description. Recheck the complete native reference-property → exact unit-group → reference-unit chain for any future alternative binding. If native Count or Area is selected, preserve that native property and derive any kg bridge from the same complete configuration measured under cp_reference. Item(s) and item are the same count with factor 1; they give no kg per building. Never infer mass or density from a secondary property coefficient."
  - id: area_geometry
    applies_to: "area and dimensional conversions"
    required_property_ref:
      name: "Measured geometry"
      uuid: ""
    required_unit: "m2; m3; kg"
    rule: "Survey floor area from the actual floor plan: identify each storey, single counted horizontal floor face, exclusions, openings and perimeter convention. Do not substitute bounding-box area, façade area, double-sided board area or an invented storey height. For sheet or timber conversions use actual thickness/net geometry and independently measured matched-state mass/density; do not assume timber density or count-to-mass factors."
  - id: water_carbon
    applies_to: "each wood article formulation and stock"
    required_property_ref:
      name: "Measured mass and composition"
      uuid: ""
    required_unit: "kg"
    rule: "Collect dry-basis wood moisture u=(wet-oven_dry)/oven_dry separately for each species/stock state, and wet-basis fraction w=(wet-oven_dry)/wet; convert percentages to fractions. No numeric moisture is prescribed. Retained whole-article water and subcomponents are nonadditive subledgers. Track atmospheric sorption/desorption separately; it is not repair. Independently measure biogenic/fossil C and actual chemical species. Free water, structural water and any evidenced reaction water are distinct; one residual cannot fit two unknowns."
  - id: raw_units
    applies_to: "all measured exchanges"
    required_property_ref:
      name: "Actual flow property"
      uuid: ""
    required_unit: "native unit"
    rule: "Retain original readings and conversions before attribution: kWh×3.6 gives MJ; fuel uses actual mass or measured volume/density and batch heating value. Integrate a genuine rate over its recorded time; an already integrated volume is not multiplied by time again. Gas volume requires actual species/state/T/P and moisture convention. Density is independently measured for that material and state, never borrowed from water. Purchased heat/steam is not implied by an electrical workshop."
