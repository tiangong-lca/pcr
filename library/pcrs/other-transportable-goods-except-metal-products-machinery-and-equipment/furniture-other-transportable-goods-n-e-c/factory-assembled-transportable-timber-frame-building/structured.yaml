allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Apply the following rules to attributional multifunctional processes only when allocation is required. Preserve the distinction between process co-products and functions of a multifunctional consumer product."
    source_ids: []
  - rule_id: attributional_scope
    applies_to: "attributional systems requiring allocation"
    rule: "Use this hierarchy only for attributional modelling where allocation is methodologically required. Industrial manufacturer descriptions do not establish an allocation method. Do not choose freely between physical and economic allocation or substitute avoided-product credits."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: subdivide_first
    applies_to: "each stage and inherited exchange"
    rule: "First assign dedicated operations/materials and use physical subdivision or justified virtual subdivision from exact BOMs, stage meters and product-specific records. Trace each exchange vector through raw/WIP/FG, returns, failed work and services. Reconcile all product systems to the original unallocated inventory; do not discard idle or reject burdens."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: exchange_causality
    applies_to: "remaining common exchanges"
    rule: "For each still-common exchange identify and quantify the determining physical causality to each co-function; justify whether cutting extent, processing time, material incorporation or actual constrained capacity causes that exchange. Different exchanges can require different drivers. Whole-building mass or floor area is not an automatic universal driver. Keep actual gross physical exchanges independent of burden partitioning."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: residual_market
    applies_to: "genuinely residual common process"
    rule: "Only after the preceding tests fail with reasons, allocate residual common-process burdens using actual contemporaneous market values at the true common-process gate and real condition/quality/packaging state. Remove subsequent product-specific transport, finishing or packaging from downstream prices. Preserve unallocated totals and sensitivity/uncertainty; use no fixed percentages. Conserve each allocation vector so all receiving product/service systems sum to its original total. Product multifunctionality/QFD is a separate problem and figure 24 is no building allocation factor."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: waste_no_credit
    applies_to: "residues reuse and assets"
    rule: "Waste remains Waste under its actual acceptance/destination. Sale or return does not automatically create a coproduct, zero burden or credit. A real mixed-waste consignment has one measured gross Waste exchange and independently measured originW subledgers that are nonadditive, with one provider linkage. Reusable racks/trailers retain full gross physical movements; any upstream manufacture/use share is separately justified from conserved actual service history and does not shrink material movement. No hypothetical future reuse credit or infinite-cycle default is adopted."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "building_manufacture"
      flow_role: "complete first-release reference"
      record_type: "foreground_record"
      raw_fields: "serial ID; configuration; first release timestamp; acceptance result; gross scale mass; tare; net release kg; calibration; uncertainty; disjoint BOM; geometry; floor area convention; actual moisture; original_Q0; unique_first_acceptance_ID; original_configuration_water_basis; net_remaining_delivery; all_onsite_accepted_states; irreversible_loss; terminal_disposition;"
      collection_method: "Weigh each complete configured building on calibrated whole-unit scales and independently determine packaging/transport tare; or reconcile independently weighed disjoint components actually incorporated with moisture/retained-formulation checks and propagated uncertainty. Verify complete assembly and first acceptance once; retain raw masses and IDs without dividing.  Q0 is independently fixed from unique first quality-release events for complete same-configuration buildings after every required factory operation and test, ready for the declared factory supply gate. It includes all actual retained articles and water at release and excludes transport packaging/trailer tare. Reconcile each original Q0 on its original-material/configuration basis across disjoint net remaining external deliveries, every actual on-site accepted FG/held/returned/rework state, irreversible losses and other terminal dispositions. Gross return first leaves its old delivery position. Dispatch, return, repacking, retest or reacceptance never creates new Q. Current surviving wet mass and original water/material losses cannot both be restored and counted again. Opening old cohorts and later observed-H services use original Qc/Q0, not current output; delivery plus closing FG is sufficient only when all other postgate states/exits are absent. Q=0 or unknown retains actual raw loads without a per-unit result."
      unit: "kg"
      frequency: "every release and stock cut"
      temporal_coverage: "whole manufacturing cohort and first-release event register"
      site_scope: "one factory and one declared complete configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/tare records; drawings; complete item checklist; signed tests; uncertainty"
    - protocol_id: cp_material
      process_id: "building_manufacture"
      flow_role: "actual article/material receipts and use"
      record_type: "foreground_record"
      raw_fields: "each row ID; supplier; native unit; batch; actual gross receipts; raw/WIP/FG opening and closing; external returns; cuts; rejected articles; wet/dry mass; independent composition; inherited exchange vector"
      collection_method: "Record individual delivery tickets and calibrated weighing with complete supplier article/formulation inclusions. Reconcile supplied whole-article wet mass to nonadditive BOM subledgers; log stock and failed-work movements by stage. Retain undivided raw numerator and independent physical mass closure; record only measured conversions."
      unit: "kg; actual article native unit"
      frequency: "every receipt/use/return and stock cut"
      temporal_coverage: "full cohort including failed and zero-output periods"
      site_scope: "receiving through first release plus identified real service additions"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier originals; scales; state/grade/moisture records; disjoint BOM; stock ledger"
    - protocol_id: cp_formulation
      process_id: "building_manufacture"
      flow_role: "actual treatment adhesive and coating"
      record_type: "foreground_record"
      raw_fields: "supplier product/lot; complete formulation kg; TDS/SDS; solids; carrier water; individual volatile species; actual mixed ingredients; treated area; retained mass; waste; stocks; drying/cleanup/failed work; inherited vectors"
      collection_method: "Weigh the whole purchased formulation once. Keep assay/carrier/solids as nonadditive analysis, independent retained-film/water and measured emission/waste evidence. Where genuinely mixed onsite, weigh each separately purchased ingredient and actual energy/loss rather than also charging an imaginary purchased mixture. Retain unnormalised records."
      unit: "kg"
      frequency: "each lot and operation"
      temporal_coverage: "actual treatment/finish horizon including failures and cleanup"
      site_scope: "actual factory work; supplier-contained treatment remains upstream"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "TDS/SDS; weighing; actual retained fraction; species tests; independently closed water/carbon"
    - protocol_id: cp_utility
      process_id: "building_manufacture"
      flow_role: "each utility/fuel/heat carrier"
      record_type: "foreground_record"
      raw_fields: "row ID; meter start/end; original units; actual rate/integrated flag; time; voltage; supply mix; geography; fuel batch/density/heating value; carrier kg/phase/T/P/enthalpy; supplier returns convention; run/idle/test/cleanup codes"
      collection_method: "Retain actual meter/tank/scale readings before conversion, attribution and normalisation. Distinguish actual electric/fuel/heat supply; do not invent steam or combustion. Keep supplier heat+carrier purchase reconciliation and each gross external return, including rejected tests and zero-output work."
      unit: "original unit; kg; MJ; actual state units"
      frequency: "continuous/event readings and cohort cuts"
      temporal_coverage: "manufacture plus only actually observed H services"
      site_scope: "actual meter/service gates with nonoverlapping upstream combustion boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; invoices; state-specific density/enthalpy; fuel analysis; stage time log"
    - protocol_id: cp_waste
      process_id: "building_manufacture"
      flow_role: "each actual waste consignment"
      record_type: "foreground_record"
      raw_fields: "consignment ID; origin stage/row; gross kg; waste classification; treatment state; destination/provider; wet mass/water; independent originW fractions; route; refusal/return; stock changes; burden vector; whole_Qt; nested_substrate_retained_matter_water; original_Q0_Qc; disjoint_compatible_service_A;"
      collection_method: "Weigh each real consignment once at its gate and preserve independent measured originW subaccounts without invented separate exports. One mixed total or its genuinely disjoint consignments enters the physical LCI once with one provider link; returned/refused wastes stay in the ledger.  One actual contaminated film, skid, rack, machine, filter, mixed dust, rejected building part or liquid consignment has one whole receiver event Qt containing substrate/article, retained wood/OSB/mineral/coating matter and water once. Dry tare and measured originW/components are nonadditive nested analyses, not extra exported wastes unless physically separated before the boundary. Match its actual receiver/treatment/provider and extensive unit. Physical Qt and Qt/Q disclosure are not automatically the service demand: use only evidenced compatible nonoverlapping service A with the original cohort Qc/Q0, keeping physical transfer full. Unknown attribution remains unknown. Arithmetic illustration only: a shared10kg consignment is never shrunk to2.5kg by25% attribution and never charged as10kg again to every cohort. Different dry/wet or provider units require the actual full-composition/state bridge, not a hidden conversion or pure-component proxy."
      unit: "kg"
      frequency: "each transfer and stock cut"
      temporal_coverage: "all production/service failures and actual disposal transfers"
      site_scope: "actual waste/control outlet and treatment gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge; manifests; independent composition/moisture; provider receipt"
    - protocol_id: cp_species
      process_id: "building_manufacture"
      flow_role: "each actual species and medium"
      record_type: "foreground_record"
      raw_fields: "actual substance/CAS; phase; air/water medium; gross/net convention; sample/time; concentration; actual integrated volume or rate; T/P/humidity; control outlet; biogenic/fossil origin; independent sorption/moisture; detection limits; applicable_complete_method; actual_phase_preservation_matrix; analyte_spike_recovery; unknown_essential_procedure_status;"
      collection_method: "Use real species-resolved measurements and matched flow/time/state records; separate each substance/medium and carbon origin. Natural H2O uptake/desorption is measured independently. For any real combustion/air throughput, separately measure N2/O2/Ar/H2O and each actual reaction/exhaust species in and out using explicit gross/net scope before complete closure; no assumed air composition or residual-fit species. Indicators remain nonadditive observations.  Use complete EPA320 only for actual identified IR-active vapor species and its real extractive heated-transport/reference-spectrum/interference/analyte-spike recovery programme. It is not total-VOC chemistry, a dust method, or FTIR measurement of homonuclear O2/N2/monatomic Ar. EPA5 supplies filterable particulate sampling/recovery/gravimetry only within its stated phase and source conditions; actual wood/OSB/mineral/coating particulate is a measured whole physical mixture, not elemental C or a fictitious pure resin. Captured dust is Waste and is separate from the actual final air release. Actual collected condensate/mist goes whole to its real receiver; final released species/medium require their own applicable procedure, not a dry-PM assertion about all phases. Do not infer actual formulation constituents or release from a generic supplier label. Actual on-site combustion needs its complete producer/fuel/air/O2/water-generation/each real species/ash/energy/control unit, not CO2 alone or a purchased-heat stub; add those specific interfaces and actual procedures before data completeness. This source set does not establish a full programme for every unidentified formulation, reacting species or condensable/other phase: a genuinely necessary unestablished procedure remains hold. Actual-site calibration/lot QA within an established applicable programme remains study qualification, not proof no method exists; finite check never approves science, performance or study results. The retained Method5 explicitly incorporates Methods1–3; the full originals are also retained here for actual duct geometry/traverse, calibrated velocity/pressure/temperature/flow and dry-gas-density procedure. Respect non-cyclonic/size/location limits rather than claiming every room or duct is covered. An actual uncontained fugitive release is not automatically represented by one duct or personal-exposure result. Method3 discloses its restricted gas matrix, interferences and unabsorbed N2/CO remainder and its argon omission: no nominal air composition/dry molecular weight, pure N2 flow or measured Ar is inferred. Method320 PDF16 prints a tracer spiked/direct fraction in Eq3 and a fraction-mixing Eq4 but labels DF>=10; preserve that actual inconsistency, not a numerical default. On a common corrected mole basis, use the actual conserved mixture fraction phi=(tracer_spiked-tracer_native)/(tracer_direct-tracer_native), with a nonzero denominator, representative matched samples and the stated no-unaccounted-loss mixing conditions; expected analyte=phi*analyte_direct+(1-phi)*analyte_native. Distinguish phi from its reciprocal dilution ratio, validate actual recovery and retain failed/negative results and uncertainty. This mathematical identity supplies no source concentration, acceptance tolerance, emission factor or factory QA success. These are dated EPA Internet copies, not an assertion of current regulatory conformity."
      unit: "kg"
      frequency: "actual operation and matched sampling"
      temporal_coverage: "all actual production/service release periods"
      site_scope: "declared compartments and real control outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "laboratory originals; sampling method; calibration; limits/uncertainty; independent element balance"
    - protocol_id: cp_packaging
      process_id: "building_manufacture"
      flow_role: "each packaging pool and gross channel"
      record_type: "foreground_record"
      raw_fields: "package/asset ID; specific material/article; empty opening; attached-WIP opening; attached-FG opening; reusable opening; purchases P; external-return-received ER; internalreuse R_internal; corresponding closing pools; gross shipments S; external returns EO; waste W; actual native kg; original cohort; originW; use-history vectors; supplier_included I_sup; actual J_in J_out; disjoint H2O_in H2O_out; X_in X_out same-side overlap evidence; original_Q0_Qc; whole_receiver_Qt; separate_compatible_service_A;"
      collection_method: "Weigh actual package articles and each gross crossing by material. Reconcile every opening/closing pool including attached WIP/FG and reusable assets. Match exact internal reuse on both sides once. Observe every present purchase/return/shipment/waste channel; no shipping-material multiplication by an environmental allocation or asset-use share.  For each actual whole wet PE-film, wooden-skid or steel-rack pool use O_empty+O_attachedWIP+O_attachedFG+O_reusable+P+I_sup+ERin+J_in+H2O_in-X_in=C_empty+C_attachedWIP+C_attachedFG+C_reusable+S_gross+EOout+W_whole+J_out+H2O_out-X_out. I_sup is actual disjoint supplier-included packaging, not another purchase; internal reuse R_internal cancels between matched positions and is not I_sup. J is additional real non-water material and H2O is additional actual water transfer only to the extent not already included in another whole wet leg. O/C and every whole leg retain all contained matter: actual new material/water retained in C never erases its true influx. X subtracts only independently proved overlap with OTHER same-side flow terms, never C, real increments, opposite directions or card existence. Trace actual J/water sources/destinations with specific physical records and internal pairs; do not invent a generic provider, extra Q, separate constituent waste or balancing flow. Gross shipments, external returns received/sent and true whole waste stay physically full regardless of environmental use shares. These three specific article pools are conditional on actual configuration; the source proves wrapping/packing but no universal material, tare, repair, water uptake or mass."
      unit: "kg"
      frequency: "each package movement and stock cut"
      temporal_coverage: "actual packing and observed H services"
      site_scope: "separate packaging gate; excluded from net building Q"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; purchase and return tickets; attached-stock counts; asset history; consignment receipts"
    - protocol_id: cp_service
      process_id: "building_manufacture"
      flow_role: "released FG and actual later services"
      record_type: "foreground_record"
      raw_fields: "original serial/cohort/Qc; original delivery and burden; opening/closing FG; gross S/ER/EO; retained added component mass; actual incremental energy/rework; removed parts/waste; moisture; service date; observed H; historical exchange vectors"
      collection_method: "Trace actual gross movements, original deliveries/reversals and real incremental work to the original released cohort. Retain original burden and physical state through opening/closing FG; no new production on dispatch/reacceptance. Keep storage/handling/packing even when Qcurrent is zero. Stop observations at H; unknown future work is not invented."
      unit: "kg"
      frequency: "each service/movement and cutoff H"
      temporal_coverage: "actual observed horizon linked to original cohort Qc"
      site_scope: "released FG service gate; all real rejected/unauthorised movements retained"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original cohort ledger; service tickets; weighing; stock and incremental burden reconciliation"
    - protocol_id: cp_assets
      process_id: "factory_assets"
      flow_role: "actual whole unit and observed service"
      record_type: "foreground_record"
      raw_fields: "unit_id; configuration; whole_M_kg; physical_O_C; receipt; ERin; EOout; whole_retirement_Qt; repair_fluid_subledgers; actual_h; original_Q0_Qc; inherited_history; provider_units; unused_capacity; X_overlap"
      collection_method: "Every actual cutting/machining line, truss press, tool, extraction/handling unit and reusable rack keeps a complete actual configured fleet: new/used receipts, external returns received/sent, real retirement/whole waste, installed/opening/closing holdings and disjoint repair/fluid changes. The PrefabEU named machinery illustrates actual industrial operations, not mandatory equipment at the PRG plant or a shared SKU. A whole line/provider already including a machine and a separate purchase of that machine cannot both be added. Measure actual complete configuration mass M if count/mass conversion is needed; Item(s) is not kg and no machine mass or lifetime is supplied. Actual service h must match a complete real provider history and observed original-cohort use, unused/unassigned capacity and inherited burdens; physical fleet kg is not scaled by a service share. Separately supplied oil/filter/belt and whole contaminated removed items need their own atomic interfaces when actually present; contained parts remain nested in a whole asset. Receipt/return/shipment/retirement cards disclose physical V only; they are not a second capital purchase when the actual compatible service history already owns the same upstream manufacture. Actual provider-service scope and separately metered operation/repair must be nonoverlapping."
      unit: "kg; h"
      frequency: "Each actual event and reporting close"
      temporal_coverage: "Actual original-cohort observed H"
      site_scope: "Actual complete machine and matched provider boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Actual whole-unit records; calibrated M; conserved fleet; actual hours and complete provider/history nonoverlap"
  calculation_rules:
    - id: normalize_once
      applies_to: "all non-reference rows"
      rule: "For Q>0, reported physical exchange = V/Q and reported environmental exchange = A/Q. For service records Q means the original released cohort Qc, separately for each original configuration and cohort, not current output. V is the actual gross native-unit boundary amount for that row and cohort; A is the converted and actually attributed raw exchange burden vector after inherited stock conservation. Choose one represented layer per exchange, not both as extra purchases. This is the only division; cards and protocol aggregation refer to its result and never divide again. Q=0 retains all true V/A and stock vectors without a per-unit result."
      inputs:
        - V
        - A
        - Q
        - cp_reference
      output: "reported exchange"
      source_ids: []
    - id: manufacturing_closure
      applies_to: "manufacturing physical gate"
      rule: "For each actual wet material and relevant conserved element: O_raw+O_WIP+O_nonWIP+I_phys+ER_pre+U_air+H2O_in=C_raw+C_WIP+C_nonWIP+T_accept+W_man+E_man+EO_pre+T_other+H2O_out. Each term is actual and disjoint; I_phys contains whole supplied material and carrier water once, and separate H2O terms exclude water already included in another whole leg or release. For an actually reactive species i add independently established G_i on the input side and C_i on the output side; do not add chemical creation to total mass/elements or fit one residual to unknown water/species. T_accept is an actual internal physical handover, never another external output or a closure-defined Q0. Packaging and fleets have separate gates. T_other consists only of named actual atomic transfers. X only deduplicates independently identified OTHER same-side flow terms, not stocks, true increments or opposite movements."
      inputs:
        - cp_material
        - cp_formulation
        - cp_reference
        - cp_waste
        - cp_species
      output: "manufacturing closure residual"
      source_ids: []
    - id: fg_service_closure
      applies_to: "released FG service gate"
      rule: "O_FG+T_accept+ER_FG+I_incremental+J_in+H2O_in=C_FG+S_gross+EO_FG+W_FG+E_FG+J_out+H2O_out at actual wet state. I_incremental is the FULL actual additional supplied matter, including real carrier water, not only the part retained in C; its retained part, whole waste and release are independently reconciled. J/water terms are actual additional disjoint transfers absent from other whole legs; sorption/desorption is real water movement, not repair. Preserve all failed/refused gross movements, complete C and original burdens. For truly reactive species keep G_i/C_i independently; inherited environmental vectors are a separate account, not conserved physical molecule amounts."
      inputs:
        - cp_service
        - cp_reference
        - cp_species
        - cp_waste
      output: "FG service closure residual"
      source_ids: []
    - id: combined_closure
      applies_to: "manufacturing plus FG service"
      rule: "Add the actual manufacturing and FG-service physical equations and cancel one matching internal T_accept only. Retain every opening/closing raw/WIP/non-WIP/FG/return state, actual gross external shipment/return, full new matter, waste, release and disjoint water movement. Q0 remains an independently fixed reference-event account; do not add Q0 plus external shipment as two physical products. Every inherited environmental exchange follows its original cohort and actual handovers separately, once; provider embedded history and own foreground history remain disjoint."
      inputs:
        - cp_material
        - cp_reference
        - cp_service
      output: "combined closure residual"
      source_ids: []
    - id: pack_pool
      applies_to: "each packaging pool"
      rule: "For each actual whole wet PE-film, wooden-skid or steel-rack pool use O_empty+O_attachedWIP+O_attachedFG+O_reusable+P+I_sup+ERin+J_in+H2O_in-X_in=C_empty+C_attachedWIP+C_attachedFG+C_reusable+S_gross+EOout+W_whole+J_out+H2O_out-X_out. I_sup is actual disjoint supplier-included packaging, not another purchase; internal reuse R_internal cancels between matched positions and is not I_sup. J is additional real non-water material and H2O is additional actual water transfer only to the extent not already included in another whole wet leg. O/C and every whole leg retain all contained matter: actual new material/water retained in C never erases its true influx. X subtracts only independently proved overlap with OTHER same-side flow terms, never C, real increments, opposite directions or card existence. Trace actual J/water sources/destinations with specific physical records and internal pairs; do not invent a generic provider, extra Q, separate constituent waste or balancing flow. Gross shipments, external returns received/sent and true whole waste stay physically full regardless of environmental use shares. These three specific article pools are conditional on actual configuration; the source proves wrapping/packing but no universal material, tare, repair, water uptake or mass."
      inputs:
        - cp_packaging
        - cp_waste
        - cp_service
      output: "packaging pool residual"
      source_ids: []
    - id: inheritance
      applies_to: "each environmental exchange vector"
      rule: "For each exchange and stock/cohort ID conserve opening inherited burden plus real incoming/added burden equals closing inherited burden plus burden actually transferred to first-release products, external returns, real other systems and wastes. Keep all attempt/idle/cleanup/rework loads and explain their actual causal attribution. Q=0 loads remain measured and retained. For observed post-release services report real additional A_service/Qc once with the original cohort, separate from its existing production burden. No fictional fixed inventory share, disappearing old burden or new output on reacceptance."
      inputs:
        - cp_material
        - cp_service
        - cp_reference
      output: "conserved burden vectors"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows and reference"
      requirement: "Confirm physical chemistry/article, supply state, process/grade/geography, every native property, exact reference unit chain and provider compatibility; no core surrogate. Unresolved auxiliary identity remains a specific named row and a disclosed provider/quantity gap."
      evidence: "full native originals and candidate membership; supplier TDS/BOM; exact support rows"
    - id: dq_mass
      applies_to: "Q and all stock vectors"
      requirement: "Independent calibrated physical measurements, disjoint supplied articles, moisture and true uncertainty; no empirical factory masses or recipe/default yields asserted by this PCR."
      evidence: "scale certificates; raw measurements; released-ID register; stock/element closures"
    - id: dq_completeness
      applies_to: "actual manufacturing and service horizon"
      requirement: "Full attempted manufacture, failed batches, Q0, start/stop, idle, inspection, cleaning, rework, gross returns and all present unlisted atomic flows; keep independently measured wastewater/gas/waste species and nonadditive indicators."
      evidence: "stage logs; meters; originW; species tests; service records; missingness ledger"
    - id: dq_sources
      applies_to: "all methodological evidence"
      requirement: "Manufacturer pages identify route and competing delivery formats only; no same-SKU or universal numerical transfer. ILCD applies to attributional multifunctional processes as scoped, not manufacturing recipes. Retain original context and counterexamples and all unknowns; measurement and projection checks do not provide science/translation review."
      evidence: "primary full originals and source-specific applicability assessment; independent review"
    - id: dq_actual_method
      applies_to: "actual necessary species/phase/matrix"
      requirement: "Use complete EPA320 only for actual identified IR-active vapor species and its real extractive heated-transport/reference-spectrum/interference/analyte-spike recovery programme. It is not total-VOC chemistry, a dust method, or FTIR measurement of homonuclear O2/N2/monatomic Ar. EPA5 supplies filterable particulate sampling/recovery/gravimetry only within its stated phase and source conditions; actual wood/OSB/mineral/coating particulate is a measured whole physical mixture, not elemental C or a fictitious pure resin. Captured dust is Waste and is separate from the actual final air release. Actual collected condensate/mist goes whole to its real receiver; final released species/medium require their own applicable procedure, not a dry-PM assertion about all phases. Do not infer actual formulation constituents or release from a generic supplier label. Actual on-site combustion needs its complete producer/fuel/air/O2/water-generation/each real species/ash/energy/control unit, not CO2 alone or a purchased-heat stub; add those specific interfaces and actual procedures before data completeness. This source set does not establish a full programme for every unidentified formulation, reacting species or condensable/other phase: a genuinely necessary unestablished procedure remains hold. Actual-site calibration/lot QA within an established applicable programme remains study qualification, not proof no method exists; finite check never approves science, performance or study results. The retained Method5 explicitly incorporates Methods1–3; the full originals are also retained here for actual duct geometry/traverse, calibrated velocity/pressure/temperature/flow and dry-gas-density procedure. Respect non-cyclonic/size/location limits rather than claiming every room or duct is covered. An actual uncontained fugitive release is not automatically represented by one duct or personal-exposure result. Method3 discloses its restricted gas matrix, interferences and unabsorbed N2/CO remainder and its argon omission: no nominal air composition/dry molecular weight, pure N2 flow or measured Ar is inferred. Method320 PDF16 prints a tracer spiked/direct fraction in Eq3 and a fraction-mixing Eq4 but labels DF>=10; preserve that actual inconsistency, not a numerical default. On a common corrected mole basis, use the actual conserved mixture fraction phi=(tracer_spiked-tracer_native)/(tracer_direct-tracer_native), with a nonzero denominator, representative matched samples and the stated no-unaccounted-loss mixing conditions; expected analyte=phi*analyte_direct+(1-phi)*analyte_native. Distinguish phi from its reciprocal dilution ratio, validate actual recovery and retain failed/negative results and uncertainty. This mathematical identity supplies no source concentration, acceptance tolerance, emission factor or factory QA success. These are dated EPA Internet copies, not an assertion of current regulatory conformity."
      evidence: "Complete primary programme/actual applicability and recovery; specific unknown procedure hold separate from unperformed ordinary study QA"
validation_rules:
  - rule_id: validate_terminal
    applies_to: "reference and completion schedule"
    rule: "Verify one complete building and one unique first-release finished row consistent across both languages; compare actual supply configuration against all exclusions. A whole-building Product identity needs positive family/route/state evidence and its exact support chain. Missing core identity or unverified native denominator prevents a complete guidance-ready dataset; do not substitute a board, door or furniture identity."
    source_ids:
      - unsd-cpc3-buildings
      - prg-timber-building
  - rule_id: validate_quantity
    applies_to: "every raw and reported exchange"
    rule: "Check calibrated net release masses, first-release IDs, disjoint whole/component BOM, conversion states, one A/Q division, Q=0 preservation and original-Qc service attribution. Independently close manufacturing, released FG and combined wet mass, each relevant element and each packaging pool. Do not repair discrepancies with default loss, density, emission, uptake or one residual for multiple unknowns."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_native
    applies_to: "every database binding"
    rule: "Check all native basenames, synonyms/comments, CAS, grade, treatment/route/form, geography, media/type and every property. Preserve reference property and exact support versions and actual unit. Expose isolated classification debt separately from a contradictory chemical/material/route facet. Manufacturer examples do not make a geographically restricted electricity/water provider globally applicable. Generic auxiliary/provider uncertainty is explicit and is not by itself a whole-building core gap."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "actual activity and findings"
    rule: "Record measured presence, demonstrated absence and unknown separately for each atomic flow. Authorisation or acceptance failure never deletes actual inputs, releases, waste, returned articles or repair burden. Screen every additional ingredient/article, utility, fuel, gas species, package, maintenance item and waste destination before claiming complete coverage. Keep source limitations, unresolved identities, temporal/geographical representativeness, measurement and allocation uncertainty visible."
    source_ids:
      - prg-timber-building
      - prefabeu-factory
      - ilcd-allocation-2010
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "This PCR covers one terminal product: a complete single transportable timber-frame building assembled and first quality-released inside the factory. The building includes its floor, load-bearing timber frame, insulated walls and roof, weather enclosure, doors/windows and the interior finish and fixed services specified in its unique supply configuration. It is not a wall panel, a stack of CLT boards, furniture or a building-site service. Progressive House format 02 provides positive evidence of a whole timber-frame house assembled at the factory; its other formats supply separate elements or leave finishing to the partner. PrefabEU independently documents cutting, frame/sheathing manufacture, insulation, sealing, fit-out and weather wrapping while also offering separate elements. These are transparent technical synthesis sources, not one SKU, one factory or a common bill of materials. [prg-timber-building; prefabeu-factory.]"
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "CPC 3.0 class 3870 includes assembled and unassembled buildings and incomplete buildings with their essential character; subclass 38701 requires predominantly wooden buildings. This selected methodology covers a narrower complete factory-assembled terminal, not every classified product. Exclude bare structural kits, separate wall/floor/roof elements, multi-module site-completed buildings, steel/concrete-dominant buildings, foundations, site craning/connection/commissioning and use/end-of-life. A trailer used only for delivery is a separately accounted transport asset; a permanently supplied road chassis changes the declared configuration and requires its own article and asset reconciliation. No density, dimensions, storey height, component mass, yield, recipe, heat-transfer value, certification, emission factor or life is prescribed. [unsd-cpc3-buildings.]"
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "Declare every qualifier in the concrete package. This is a manufacturing mass declared unit, not a square-metre/year functional equivalence. The native Product is a manufactured predominantly wooden prefabricated building at plant with Mass/kg. Its whole-product name, descriptive comment and finished manufacturing state positively support the qualified complete factory-assembled subset; no native fixed grade, dimensions, geography or incompatible route is overridden. Its physical identity does not establish a matching factory/background provider or scientific approval. Establish predominantly wooden construction from the actual whole-building material/construction schedule and the classification context; a timber-frame label alone cannot override contrary whole-product material facts. No fixed wood mass/volume percentage is invented."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Stage-code receiving/cutting, timber-joint/frame manufacture, sheathing/insulation/membranes, complete-unit assembly, configured fit-out/services, finishing/sealing/testing, first release and observed storage/packing/dispatch separately inside this one foreground unit. Keep unallocated raw stage totals and every inherited stock vector. Conditional cards are measured if present; demonstrated absence is not_applicable; unknown is pending. Add any actual unlisted atomic exchange before complete data delivery; do not hide it in zero, other or a collection label. No factory quantity is invented."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Apply the following rules to attributional multifunctional processes only when allocation is required. Preserve the distinction between process co-products and functions of a multifunctional consumer product."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Protocols collect only undivided raw records. Their aggregation_rule names the final result basis produced by the single normalization below; it is not an instruction to divide during collection. Keep physical V distinct from environmental A: gross receipts/shipments/returns/waste/carriers/packaging are never scaled by load allocation, inventory change or service/asset-use shares. Select one physical boundary layer and reconcile its environmental burden vector without inventing a second purchase."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "Q is the sum of individually traceable complete buildings first quality-released in the cohort, at their measured net release mass. Use cp_reference: calibrated whole-unit weighing with tare subtraction or independently weighed disjoint supplied-item reconciliation with uncertainty. Include actual retained components and water once. Exclude packaging, transport trailer, rejected units and internal modules. Count only the first release; neither dispatch nor reinspection creates production."
    source_ids: []
  - rule_id: validation_rule_12
    applies_to: "foreground_dataset_conformance"
    rule: "The selected manufactured wooden-prefabricated-building Product has a verified Mass/kg reference chain. Its broad family is narrowed to the complete single-unit configuration throughout the reference and finished-row description. Recheck the complete native reference-property → exact unit-group → reference-unit chain for any future alternative binding. If native Count or Area is selected, preserve that native property and derive any kg bridge from the same complete configuration measured under cp_reference. Item(s) and item are the same count with factor 1; they give no kg per building. Never infer mass or density from a secondary property coefficient."
    source_ids: []
  - rule_id: validation_rule_13
    applies_to: "foreground_dataset_conformance"
    rule: "Survey floor area from the actual floor plan: identify each storey, single counted horizontal floor face, exclusions, openings and perimeter convention. Do not substitute bounding-box area, façade area, double-sided board area or an invented storey height. For sheet or timber conversions use actual thickness/net geometry and independently measured matched-state mass/density; do not assume timber density or count-to-mass factors."
    source_ids: []
  - rule_id: validation_rule_14
    applies_to: "foreground_dataset_conformance"
    rule: "Collect dry-basis wood moisture u=(wet-oven_dry)/oven_dry separately for each species/stock state, and wet-basis fraction w=(wet-oven_dry)/wet; convert percentages to fractions. No numeric moisture is prescribed. Retained whole-article water and subcomponents are nonadditive subledgers. Track atmospheric sorption/desorption separately; it is not repair. Independently measure biogenic/fossil C and actual chemical species. Free water, structural water and any evidenced reaction water are distinct; one residual cannot fit two unknowns."
    source_ids: []
  - rule_id: validation_rule_15
    applies_to: "foreground_dataset_conformance"
    rule: "Retain original readings and conversions before attribution: kWh×3.6 gives MJ; fuel uses actual mass or measured volume/density and batch heating value. Integrate a genuine rate over its recorded time; an already integrated volume is not multiplied by time again. Gas volume requires actual species/state/T/P and moisture convention. Density is independently measured for that material and state, never borrowed from water. Purchased heat/steam is not implied by an electrical workshop."
    source_ids: []
  - rule_id: validation_rule_16
    applies_to: "foreground_dataset_conformance"
    rule: "For Q>0, reported physical exchange = V/Q and reported environmental exchange = A/Q. For service records Q means the original released cohort Qc, separately for each original configuration and cohort, not current output. V is the actual gross native-unit boundary amount for that row and cohort; A is the converted and actually attributed raw exchange burden vector after inherited stock conservation. Choose one represented layer per exchange, not both as extra purchases. This is the only division; cards and protocol aggregation refer to its result and never divide again. Q=0 retains all true V/A and stock vectors without a per-unit result."
    source_ids: []
  - rule_id: validation_rule_17
    applies_to: "foreground_dataset_conformance"
    rule: "For each actual wet material and relevant conserved element: O_raw+O_WIP+O_nonWIP+I_phys+ER_pre+U_air+H2O_in=C_raw+C_WIP+C_nonWIP+T_accept+W_man+E_man+EO_pre+T_other+H2O_out. Each term is actual and disjoint; I_phys contains whole supplied material and carrier water once, and separate H2O terms exclude water already included in another whole leg or release. For an actually reactive species i add independently established G_i on the input side and C_i on the output side; do not add chemical creation to total mass/elements or fit one residual to unknown water/species. T_accept is an actual internal physical handover, never another external output or a closure-defined Q0. Packaging and fleets have separate gates. T_other consists only of named actual atomic transfers. X only deduplicates independently identified OTHER same-side flow terms, not stocks, true increments or opposite movements."
    source_ids: []
  - rule_id: validation_rule_18
    applies_to: "foreground_dataset_conformance"
    rule: "O_FG+T_accept+ER_FG+I_incremental+J_in+H2O_in=C_FG+S_gross+EO_FG+W_FG+E_FG+J_out+H2O_out at actual wet state. I_incremental is the FULL actual additional supplied matter, including real carrier water, not only the part retained in C; its retained part, whole waste and release are independently reconciled. J/water terms are actual additional disjoint transfers absent from other whole legs; sorption/desorption is real water movement, not repair. Preserve all failed/refused gross movements, complete C and original burdens. For truly reactive species keep G_i/C_i independently; inherited environmental vectors are a separate account, not conserved physical molecule amounts."
    source_ids: []
  - rule_id: validation_rule_19
    applies_to: "foreground_dataset_conformance"
    rule: "Add the actual manufacturing and FG-service physical equations and cancel one matching internal T_accept only. Retain every opening/closing raw/WIP/non-WIP/FG/return state, actual gross external shipment/return, full new matter, waste, release and disjoint water movement. Q0 remains an independently fixed reference-event account; do not add Q0 plus external shipment as two physical products. Every inherited environmental exchange follows its original cohort and actual handovers separately, once; provider embedded history and own foreground history remain disjoint."
    source_ids: []
  - rule_id: validation_rule_20
    applies_to: "foreground_dataset_conformance"
    rule: "For each actual whole wet PE-film, wooden-skid or steel-rack pool use O_empty+O_attachedWIP+O_attachedFG+O_reusable+P+I_sup+ERin+J_in+H2O_in-X_in=C_empty+C_attachedWIP+C_attachedFG+C_reusable+S_gross+EOout+W_whole+J_out+H2O_out-X_out. I_sup is actual disjoint supplier-included packaging, not another purchase; internal reuse R_internal cancels between matched positions and is not I_sup. J is additional real non-water material and H2O is additional actual water transfer only to the extent not already included in another whole wet leg. O/C and every whole leg retain all contained matter: actual new material/water retained in C never erases its true influx. X subtracts only independently proved overlap with OTHER same-side flow terms, never C, real increments, opposite directions or card existence. Trace actual J/water sources/destinations with specific physical records and internal pairs; do not invent a generic provider, extra Q, separate constituent waste or balancing flow. Gross shipments, external returns received/sent and true whole waste stay physically full regardless of environmental use shares. These three specific article pools are conditional on actual configuration; the source proves wrapping/packing but no universal material, tare, repair, water uptake or mass."
    source_ids: []
  - rule_id: validation_rule_21
    applies_to: "foreground_dataset_conformance"
    rule: "For each exchange and stock/cohort ID conserve opening inherited burden plus real incoming/added burden equals closing inherited burden plus burden actually transferred to first-release products, external returns, real other systems and wastes. Keep all attempt/idle/cleanup/rework loads and explain their actual causal attribution. Q=0 loads remain measured and retained. For observed post-release services report real additional A_service/Qc once with the original cohort, separate from its existing production burden. No fictional fixed inventory share, disappearing old burden or new output on reacceptance."
    source_ids: []
  - rule_id: validation_rule_22
    applies_to: "foreground_dataset_conformance"
    rule: "Q0 is independently fixed from unique first quality-release events for complete same-configuration buildings after every required factory operation and test, ready for the declared factory supply gate. It includes all actual retained articles and water at release and excludes transport packaging/trailer tare. Reconcile each original Q0 on its original-material/configuration basis across disjoint net remaining external deliveries, every actual on-site accepted FG/held/returned/rework state, irreversible losses and other terminal dispositions. Gross return first leaves its old delivery position. Dispatch, return, repacking, retest or reacceptance never creates new Q. Current surviving wet mass and original water/material losses cannot both be restored and counted again. Opening old cohorts and later observed-H services use original Qc/Q0, not current output; delivery plus closing FG is sufficient only when all other postgate states/exits are absent. Q=0 or unknown retains actual raw loads without a per-unit result."
    source_ids: []
  - rule_id: validation_rule_23
    applies_to: "foreground_dataset_conformance"
    rule: "Keep complete physical raw/WIP/non-WIP/FG/return, packaging, installed-fluid and every actual equipment-fleet ledger separate from reference events and per-exchange burden vectors. Own opening WIP carries actual earlier foreground burdens once; only substantiated still-unused/unassigned closing WIP carries them forward. For attribution, A may add unassigned inherited opening burden to period raw burden and remove only demonstrated still-unassigned closing burden and a disjoint justified other-system/cohort handover. Already-net consumption is not stock-corrected a second time; accepted closing FG and services already performed for it are not deleted. A complete provider aggregate and its embedded material/transport/asset/history decomposition are mutually exclusive. Preserve failed attempts, idle/start-stop, inspection, samples, cleanout and repair loads. Actual complete upstreams match the whole supplied article/preparation and true availability point; no receipt or purchased-service label hides known on-site manufacture. Actual provider inclusion schedules cover current electricity, repair, transport and operating supplies as well as capital: an aggregate already including a metered foreground operation and that separate operation cannot both be charged."
    source_ids: []
  - rule_id: validation_rule_24
    applies_to: "foreground_dataset_conformance"
    rule: "T_accept is the actual physical transfer at the declared manufacture-to-FG-service gate; Q0 is the separately measured first-release reference-event denominator. Where the same configuration, state, event and window make them coincide, demonstrate that equality from independent records, never fit Q0 from physical closure. The finished reference row declares the unit and is not another external shipment. Manufacturing, FG-service and consolidated gates retain every real wet stock and gross exchange; consolidation cancels the one actual internal T_accept only, not external dispatch or real return. For an actually reacting species i, keep measured G_i formation and C_i consumption in its species equation; do not conserve reacting molecules by assumption or infer them from elemental closure. Chemical reactions create no net total-mass/element source; phase transfer is not chemical creation. Water additions/evaporation and all other terms must be mutually disjoint from water already included in whole supplied articles, carrier legs or releases. Unknown terms remain unresolved, not residual-fitted."
    source_ids: []
  - rule_id: validation_rule_25
    applies_to: "foreground_dataset_conformance"
    rule: "For each actual whole wet PE-film, wooden-skid or steel-rack pool use O_empty+O_attachedWIP+O_attachedFG+O_reusable+P+I_sup+ERin+J_in+H2O_in-X_in=C_empty+C_attachedWIP+C_attachedFG+C_reusable+S_gross+EOout+W_whole+J_out+H2O_out-X_out. I_sup is actual disjoint supplier-included packaging, not another purchase; internal reuse R_internal cancels between matched positions and is not I_sup. J is additional real non-water material and H2O is additional actual water transfer only to the extent not already included in another whole wet leg. O/C and every whole leg retain all contained matter: actual new material/water retained in C never erases its true influx. X subtracts only independently proved overlap with OTHER same-side flow terms, never C, real increments, opposite directions or card existence. Trace actual J/water sources/destinations with specific physical records and internal pairs; do not invent a generic provider, extra Q, separate constituent waste or balancing flow. Gross shipments, external returns received/sent and true whole waste stay physically full regardless of environmental use shares. These three specific article pools are conditional on actual configuration; the source proves wrapping/packing but no universal material, tare, repair, water uptake or mass."
    source_ids: []
  - rule_id: validation_rule_26
    applies_to: "foreground_dataset_conformance"
    rule: "One actual contaminated film, skid, rack, machine, filter, mixed dust, rejected building part or liquid consignment has one whole receiver event Qt containing substrate/article, retained wood/OSB/mineral/coating matter and water once. Dry tare and measured originW/components are nonadditive nested analyses, not extra exported wastes unless physically separated before the boundary. Match its actual receiver/treatment/provider and extensive unit. Physical Qt and Qt/Q disclosure are not automatically the service demand: use only evidenced compatible nonoverlapping service A with the original cohort Qc/Q0, keeping physical transfer full. Unknown attribution remains unknown. Arithmetic illustration only: a shared10kg consignment is never shrunk to2.5kg by25% attribution and never charged as10kg again to every cohort. Different dry/wet or provider units require the actual full-composition/state bridge, not a hidden conversion or pure-component proxy."
    source_ids: []
  - rule_id: validation_rule_27
    applies_to: "foreground_dataset_conformance"
    rule: "Every actual cutting/machining line, truss press, tool, extraction/handling unit and reusable rack keeps a complete actual configured fleet: new/used receipts, external returns received/sent, real retirement/whole waste, installed/opening/closing holdings and disjoint repair/fluid changes. The PrefabEU named machinery illustrates actual industrial operations, not mandatory equipment at the PRG plant or a shared SKU. A whole line/provider already including a machine and a separate purchase of that machine cannot both be added. Measure actual complete configuration mass M if count/mass conversion is needed; Item(s) is not kg and no machine mass or lifetime is supplied. Actual service h must match a complete real provider history and observed original-cohort use, unused/unassigned capacity and inherited burdens; physical fleet kg is not scaled by a service share. Separately supplied oil/filter/belt and whole contaminated removed items need their own atomic interfaces when actually present; contained parts remain nested in a whole asset. Receipt/return/shipment/retirement cards disclose physical V only; they are not a second capital purchase when the actual compatible service history already owns the same upstream manufacture. Actual provider-service scope and separately metered operation/repair must be nonoverlapping."
    source_ids: []
  - rule_id: validation_rule_28
    applies_to: "foreground_dataset_conformance"
    rule: "USDA FPL2021 Chapters4/13 provide an actual wood-moisture programme: representative matched-state specimens, immediate weighing or moisture-protected storage, oven drying to constant mass and the stated dry-mass convention, plus electrical-meter calibration/species/temperature/depth/gradient limitations. Use u=(wet-dry)/dry and w=(wet-dry)/wet on actual compatible specimens, converting percentages to fractions; w=u/(1+u). The source warns that volatile extractives can make oven loss exceed true water. Do not equate whole coated/resin-containing/treated article loss with H2O or apply a timber meter to a complete house. Keep gypsum structural water, membrane/coating carriers, free/bound wood water and actual atmospheric sorption distinct. Whole supplied wet mass remains independently weighed even if a water subdivision is unresolved. An actually necessary untreated/treated-matrix or water-phase procedure not established remains a specific method hold; routine actual calibration/sampling/recovery of an established applicable programme is an unperformed study obligation. No climate EMC, density, moisture target, drying time, empirical range or source numerical performance becomes a PCR default. The retained handbook text is the procedure source here; its references to ASTM D4442/D4444 do not mean those complete standards were acquired or that ASTM conformity is claimed."
    source_ids: []
  - rule_id: validation_rule_29
    applies_to: "foreground_dataset_conformance"
    rule: "Use complete EPA320 only for actual identified IR-active vapor species and its real extractive heated-transport/reference-spectrum/interference/analyte-spike recovery programme. It is not total-VOC chemistry, a dust method, or FTIR measurement of homonuclear O2/N2/monatomic Ar. EPA5 supplies filterable particulate sampling/recovery/gravimetry only within its stated phase and source conditions; actual wood/OSB/mineral/coating particulate is a measured whole physical mixture, not elemental C or a fictitious pure resin. Captured dust is Waste and is separate from the actual final air release. Actual collected condensate/mist goes whole to its real receiver; final released species/medium require their own applicable procedure, not a dry-PM assertion about all phases. Do not infer actual formulation constituents or release from a generic supplier label. Actual on-site combustion needs its complete producer/fuel/air/O2/water-generation/each real species/ash/energy/control unit, not CO2 alone or a purchased-heat stub; add those specific interfaces and actual procedures before data completeness. This source set does not establish a full programme for every unidentified formulation, reacting species or condensable/other phase: a genuinely necessary unestablished procedure remains hold. Actual-site calibration/lot QA within an established applicable programme remains study qualification, not proof no method exists; finite check never approves science, performance or study results. The retained Method5 explicitly incorporates Methods1–3; the full originals are also retained here for actual duct geometry/traverse, calibrated velocity/pressure/temperature/flow and dry-gas-density procedure. Respect non-cyclonic/size/location limits rather than claiming every room or duct is covered. An actual uncontained fugitive release is not automatically represented by one duct or personal-exposure result. Method3 discloses its restricted gas matrix, interferences and unabsorbed N