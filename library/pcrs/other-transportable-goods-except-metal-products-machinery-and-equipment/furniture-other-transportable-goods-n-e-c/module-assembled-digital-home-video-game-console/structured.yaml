system_boundary:
  rules:
    - rule_id: boundary_scope
      applies_to: "complete console"
      rule: "Restrict this method to new complete home video game console hardware assembled from supplied finished modules, through its unique first whole-unit quality release. CPC also includes handhelds; optical-drive-equipped, handheld, hybrid portable, computer, game-software/cartridge, loose chip/PCB, standalone PSU/controller and toy routes are outside this selected method."
      source_ids:
        - un-cpc3-notes-2025
        - microsoft-xbox-digital-service-2025
    - rule_id: boundary_supply
      applies_to: "make-or-buy bridge"
      rule: "Use the actual drawing, complete BOM, receipts and supplier gate to partition every supplied article. A purchased populated motherboard/core already includes its documented CPU/GPU/memory, installed storage, cooling, shields, firmware and small parts. Separate PSU, network/accessory boards, fan, enclosure-button assembly, heatsink, SSD and FFC cards apply only to disjoint receipts outside that article. A reconciled whole-article/component bridge may disclose contained parts as non-additive children; never sum both supply scopes."
      source_ids:
        - microsoft-xbox-digital-service-2025
        - microsoft-xbox-ecoprofile-2023
    - rule_id: boundary_route
      applies_to: "foreground stages"
      rule: "Include actual receiving and ESD handling, mechanical fastening and connector/cable routing, actual firmware loading/configuration if performed, measured whole-unit test, failed units, start/stop, idle, cleanup, rework and first release. No local PCB manufacture, SMT, chip fabrication, plastic moulding or internal PSU manufacture is presumed for supplier-complete articles. A real on-site expanded route requires independent evidence and disjoint inputs before inclusion; it cannot be hidden in zero or other."
      source_ids:
        - microsoft-xbox-manufacture-2002
        - microsoft-xbox-digital-service-2025
    - rule_id: boundary_test
      applies_to: "actual specification"
      rule: "Establish the actual model-specific first-production test and acceptance plan. Reassembly checks in the service source are technical examples, not factory production limits. Its digital-console text also mentions disc/eject tests, a screen and inconsistent screw instructions: do not prescribe an absent optical drive, screen, universal angle, temperature, time, lifetime or certification. Preserve source limits; collect the actual approved tests and all unsuccessful attempts."
      source_ids:
        - microsoft-xbox-digital-service-2025
    - rule_id: boundary_upstream
      applies_to: "supplier links"
      rule: "Cover extraction, material preparation, component and module production, real inbound logistics, utility supply and treatment through independently matched upstream datasets or disjoint measured foreground. No complete cradle-to-gate result without these links. Retain supplier-included packaging ingress and exactly one upstream burden owner. A complete purchased console is a separate supply boundary, never a way to replace required module-to-console manufacturing with packaging alone."
      source_ids:
        - microsoft-xbox-ecoprofile-2023
    - rule_id: boundary_cohort
      applies_to: "released goods and service"
      rule: "Q is first-release net complete hardware mass once. Released closingFG is already in Q and never manufacturing B_close. Storage, packaging, handling, actual shipment, returns and postrelease work remain measured in a separate original-cohort service account with original Qc and observed H. Reinspection, shipment or repair creates no new Q. Internal transfer is matched and cancels on consolidation without external purchase or second Q."
      source_ids: []
    - rule_id: boundary_actuality
      applies_to: "all actual events"
      rule: "Permission, postwork tests, acceptance and disposition govern qualified rework; they never delete unauthorized, failed or rejected actual operations, logistics, water or burdens. Keep hold/waste outcomes and original cohort. Natural adsorption/desorption during ordinary storage/handling is an actual water event without an invented repair permit. Add each newly identified real material, utility, fuel, gas, waste, liquid and receiving medium as its own card and measured event."
      source_ids:
        - microsoft-xbox-digital-service-2025
    - rule_id: boundary_software
      applies_to: "software and use"
      rule: "Include actual local loading/test electricity, measured network/storage/support resources and attributable development/build work only with a declared engineering scope and reuse/release allocation. Do not infer software development, licences, cloud service or electricity from hardware kg, purchase price or a fixed ratio. Unknown material development scope remains a dataset gap. Customer gameplay, subscriptions, downstream distribution/use and end-of-life are separate lifecycle stages with no default lifetime or gaming hours."
      source_ids:
        - microsoft-xbox-ecoprofile-2023
        - jrc-ilcd-attributional-2010
    - rule_id: boundary_pack
      applies_to: "actual packaging pools"
      rule: "O + P + I + ER + J_in + H2O_in = C + S + EO + W + J_out + H2O_out. O and C are complete actual wet opening/closing empty, attached-WIP, attached-FG and reusable stocks. P/I/ER are disjoint whole-article inward legs; S is gross outward shipment, EO external return sent, W the actual whole wet discard. ER is external return received. J_in/J_out are independently measured non-water repair, replacement, residue or other material transfers across this packaging-pool boundary not already in those whole-article legs. H2O_in/H2O_out are independently measured actual water transfers across this pool boundary not already embodied in those legs; include natural adsorption/desorption without any repair. Split wet added/removed material into disjoint non-water J and H2O; no prescribed composition or density. Full wet W includes substrate/retained residues/water once, so its nested components are not additional J_out or H2O_out unless physically separated before the boundary. Matched internal pool transfers cancel on foreground consolidation and create no extra purchase, service or Q."
      source_ids: []
