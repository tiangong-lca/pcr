    rule: "Conditional on this actual whole physical article and retirement event, not a prescribed factory tool list or repair recipe. Keep actual material/configuration, complete measured wet mass/count, fluid and included parts once, opening/in-use/closing fleet and linked original cohorts. Receipt/external transfer/retirement is separate from measured service demand and observed maintenance/cleaning history; no invented lifetime or whole tool per kg. At retirement retain the full contaminated article and water once; if physically combined with one mixed outlet this is only a traced non-additive origin child. This concrete UUID remains unresolved; no bare material, similar tool or supplied-liquid UUID substitutes for the actual complete article."
