allocation_rules:
  - rule_id: allocation_first
    applies_to: "attributional common processes"
    rule: "This is attributional hardware production. First use dedicated meters, configuration/batch separation, independent actual operations and virtual subdivision for exclusively caused exchanges. Demonstrate any remaining multifunctionality rather than freely choosing mass, time or money."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_causal
    applies_to: "each remaining exchange"
    rule: "For each residual exchange demonstrate the determining physical causal relation and response to changed product/function quantities. Tool/test time with measured demand, actual station occupancy, contamination-driven treatment or another driver applies only when it determines that exchange. There is no universal mass/count/processor-time key. Keep raw observations, failed/idle work and uncertainty."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_residual
    applies_to: "true common-process residual"
    rule: "Only after direct assignment, virtual subdivision and exchange-specific determining physical causality leave a real residual use contemporaneous market values at the actual common-process exit/entry gate, physical condition, quality, bulk state and period, with reconciliation and sensitivity. Adjust downstream transport/conditioning from remote prices. No fixed shares or allocation of the console gaming/media functions from product price; such a functional comparison requires another explicit study."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_waste
    applies_to: "failure and external disposition"
    rule: "Ordinary manufacturing waste, rejects, samples and failed tests retain manufacturing and treatment burden when sold, returned or sent away. T_other is allowed only for a real independent other cohort/function plus one justified allocation/handover vector; a waste price or dispatch alone is insufficient. Waste treatment and provider are linked once. Internal reuse, supplied formulation children and physical return disclosure produce no automatic coproduct, repurchase or avoided credit."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_services
    applies_to: "cohort services and assets"
    rule: "Attribute only real measured services with separate inherited manufacturing history, original Qc and observed H. Performed work is not unused stock even if FG remains at closing. Physical asset/gross logistics quantities stay complete; only the service burden dimension is attributed by demonstrated causality and documented remaining capacity. No fixed asset life, one whole tester per kg, invented restoration or future unperformed service."
    source_ids:
      - jrc-ilcd-attributional-2010
