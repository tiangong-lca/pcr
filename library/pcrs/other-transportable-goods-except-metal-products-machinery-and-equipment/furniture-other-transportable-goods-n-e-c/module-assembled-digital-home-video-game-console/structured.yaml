  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Retain raw readings before conversion or attribution. Convert actual kWh to MJ by3.6 once. Integrate actual rates over measured intervals only; never re-integrate a total volume. Each needed density is independently measured for the actual substance/temperature/pressure/phase; no guessed density, piece kg or secondary coefficient."
      inputs:
        - raw_readings
        - actual_interval
        - actual_state
        - independent_density
      output: "V; U"
      source_ids: []
    - id: calc_q
      applies_to: "finished_console"
      rule: "Q=sum actual calibrated net M kg of uniquely first-released complete conforming hardware configurations. Actual included controller/cable/adapter, installed materials and contained water counted once; removable packaging excluded. Closing releasedFG is already included, not additional output."
      inputs:
        - cp_release
      output: "Q"
      source_ids: []
    - id: calc_manufacture
      applies_to: "manufacturing burden dimension"
      rule: "For each exchange vector A_c=B_open+U-B_close-T_other. B is raw/WIP and unused/unassigned nonWIP stores or service charge only; never releasedFG or service already performed. U is actual new additions; if consumption is already stock-corrected use the equivalent ledger without a second stock deduction. T_other needs real independent other cohort/function and one justified handover, not ordinary rejected/sold waste."
      inputs:
        - B_open
        - U
        - B_close
        - justified_T_other
        - cp_make
        - cp_utilities
        - cp_waste
      output: "A_c"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_service
      applies_to: "actual original-cohort service burden"
      rule: "A_H=actual increments+opening unused/unassigned charge-closing unused/unassigned charge-justified other-function handover. Preserve original manufacturing vector once. Service already performed remains even when FG is still in stock; only unused/unassigned charge carries. Original Qc is original first-release kg, not return, current shipment or repaired kg. H is actually observed, future service unknown."
      inputs:
        - actual_increments
        - opening_unused_charge
        - closing_unused_charge
        - original_Qc
        - observed_H
        - cp_service
        - cp_pack
        - cp_assets
      output: "A_H"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_single_quotient
      applies_to: "all inventory rows"
      rule: "q=N/D once for each separate result dimension. Physical N=complete actual gross leg V in row native unit, never A, stock consumption or economic/service share. Burden N=A_c or A_H independently. Manufacturing D=Q; actual original-cohort service and related gross legs D=original Qc with observed H. finished_console is1 kg reference. Q0 retains all raw loads and no unit result. Cards and aggregation only reference this same result; no second division, stock correction, provider purchase or credit from gross disclosure."
      inputs:
        - V
        - A_c
        - A_H
        - Q
        - original_Qc
        - observed_H
      output: "q_phys; q_b"
      source_ids: []
    - id: calc_pack
      applies_to: "pack"
      rule: "O + P + I + ER + J_in + H2O_in = C + S + EO + W + J_out + H2O_out. O and C are complete actual wet opening/closing empty, attached-WIP, attached-FG and reusable stocks. P/I/ER are disjoint whole-article inward legs; S is gross outward shipment, EO external return sent, W the actual whole wet discard. ER is external return received. J_in/J_out are independently measured non-water repair, replacement, residue or other material transfers across this packaging-pool boundary not already in those whole-article legs. H2O_in/H2O_out are independently measured actual water transfers across this pool boundary not already embodied in those legs; include natural adsorption/desorption without any repair. Split wet added/removed material into disjoint non-water J and H2O; no prescribed composition or density. Full wet W includes substrate/retained residues/water once, so its nested components are not additional J_out or H2O_out unless physically separated before the boundary. Matched internal pool transfers cancel on foreground consolidation and create no extra purchase, service or Q. P/I whole article counted once; internal reuse/attachment cancels. S is gross physical shipment, not net product Q. X only deduplicates another same-side incoming/outgoing term; new retained material/water influx and full wet closing stock both remain. Independently measured originW is not added to one mixed external waste outlet."
      inputs:
        - O
        - P
        - I
        - ER
        - J_in
        - H2O_in
        - C
        - S
        - EO
        - W
        - J_out
        - H2O_out
        - L_in_observed
        - L_out_observed
        - X_in
        - X_out
        - cp_pack
      output: "pool_residual"
      source_ids: []
    - id: calc_gates
      applies_to: "all physical streams"
      rule: "Manufacture: opening raw/WIP/unassigned physical stocks+disjoint real incoming material and water=closing same stocks+first-release hardware Q+actual waste/species outputs. FG/service: openingFG+internal Q handoff+external gross returns+disjoint new parts/water=closingFG/repairWIP+gross external dispatch/returns+actual waste/species. Reconcile packaging/assets and in-place fluids separately, then cancel matched internal pairs on consolidation. Q and closing releasedFG are not two production outputs; real retained influx is never cancelled by closing stock. Every actual packaging pool uses the complete disjoint J_in/J_out and H2O_in/H2O_out wet balance in calc_pack; duplicate observations cannot remove C or real increments."
      inputs:
        - opening_physical
        - actual_gross_in
        - closing_physical
        - actual_gross_out
        - internal_pairs
        - cp_make
        - cp_service
        - cp_pack
        - cp_assets
      output: "physical_residuals"
      source_ids: []
    - id: calc_species
      applies_to: "water and actual molecules/elements"
      rule: "Independently reconcile full wet mass and relevant elemental balances from evidenced real species and states; free, formulation-carrier, adsorbed, reaction and structural water are distinct when actually present. Never fit two unknowns to one residual, infer a molecule from VOC/COD/PM/total carbon/boron, or count whole articles plus their chemical children. Actual gas/heat carrier mass and energy service are distinct with one supply owner; actual returned heat-carrier Product state, phase/T/P/enthalpy and supplier water/energy convention must be declared without inventing steam/boiler circuits."
      inputs:
        - measured_species
        - actual_state
        - independent_balances
        - cp_utilities
        - cp_pack
        - cp_assets
        - cp_waste
      output: "species_residuals"
      source_ids: []
  data_quality_requirements:
    - id: dq_config
      applies_to: "complete hardware"
      requirement: "Obtain actual drawings/BOM, module gates and all supplier inclusion bridges; confirm genuine compatible interfaces and complete first-unit tests. No unproved SKU or supplier boundary."
      evidence: "Drawings; receipts; acceptance plan; actual firmware/test/release logs"
    - id: dq_raw
      applies_to: "every event"
      requirement: "Keep raw values, units, calibration, rate/interval, uncertainty and all failed/Q0/idle/cleanup/rework periods. Missing actual data remains a completeness finding."
      evidence: "Raw weights/meters and failed-run records"
    - id: dq_bridge
      applies_to: "stock and ownership"
      requirement: "Retain each flow physical stock and inherited exchange vector; reconcile manufacturing, FG/service, packaging, assets, fluid and mixed-waste-origin balances independently. Preserve full real ingress even if retained."
      evidence: "Signed balances and unique event/owner bridges"
    - id: dq_identity
      applies_to: "each selected flow"
      requirement: "Check complete native basename/synonyms/comments/CAS, all grade/form/route/geography/medium/type restrictions and every exact property/group/reference-unit chain. An unresolved auxiliary identity/provider is explicit; a missing compatible complete-product reference prevents use."
      evidence: "Complete native identities and row restrictions; supplier match"
    - id: dq_limits
      applies_to: "evidence and result scope"
      requirement: "Keep scientific review and translation review separate from engineering checks. Historical manufacturing and modern service/ecoprofile evidence are not one factory inventory. Disclose all unknowns, observations H, software scope, upstream proxies and unrepresented lifecycle stages."
      evidence: "Source scope matrix and dataset disclosures"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Lock original cohort c and Qc=sum(M_e) at unique first conforming whole-hardware acceptance events e. Each M_e is calibrated complete net wet hardware kg at that event with the actual supplied accessories and installed materials once, packaging and test assets excluded. Manufacturing Q is the original Qc of the declared manufacturing cohort. Do not recompute Qc from present surviving mass, net shipment, later reinspection or wet/dry changes. Failed/no-release Q0 retains all raw loads and no normalized result. Opening raw/WIP carries its measured physical stock and inherited exchange vector once; an opening accepted console retains its original Qc and manufacture history, not a new purchase or acceptance."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "For every original accepted event partition its original-acceptance basis into disjoint net external possession, on-site released FG, quarantine, repair/rework WIP, internal use, irreversible destroyed/lost portions and other documented terminal dispositions. Their current/terminal sum equals original Qc independently of present wet physical mass. Gross dispatch and returns remain complete physical events; a return reverses the corresponding external possession before later redispatch moves the same surviving entitlement. Split partial loss and survival on a documented original basis; do not restore lost water/parts to the survivor and also export the loss. Present wet stocks, evaporation, removed/new parts and all physical exits have their own conservation bridge. Unknown genealogy or cohort assignment stays unresolved with complete raw totals; loops, postacceptance destruction, retest and failed work create no new Q."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "Record actual receiver-transfer t and full wet whole outlet Qt once: discarded hardware, packaging, wipe, swab, cloth, filter or equipment substrate plus actually retained solvent, dust, formulation residues and water. Dry substrate, contained chemical and water ledgers are reconciled non-additive children. They become separate external waste exits only after real physical separation before the boundary with separate transfer IDs. Package W or removed-part origins within one mixed outlet are traced children, never a second export or second treatment demand. Actual receiver receipts and total treatment demand remain Qt, independent of environmental attribution."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "Assign environmental/service vectors A_tc to nonoverlapping original cohorts from demonstrated causal demand and the allocation hierarchy. Reconcile sum_c(A_tc) plus actual other-function/unassigned vectors to the one actual total provider demand. Physical Qt remains in one event register; reports link to it rather than charge the full event again to each cohort or shrink the physical export by an allocation fraction. Physical V/D context disclosures are non-additive across overlapping reports. Treatment and service inventory is independently assigned A_tc/D, using manufacturing Q or original Qc with observed H; it is not an extra full Qt/D for every cohort. Keep genuinely unknown allocation unresolved. Supplier-embedded history/treatment and fully expanded corresponding direct inventories are mutually exclusive representations, not additive purchases."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "A supplied populated motherboard, PSU, enclosure module, storage, cooling, cable or controller must link to an actual compatible complete producer. Preserve that producer's real semiconductor fabrication/packaging, bare-board materials and fabrication, populated-board SMT/assembly, mechanical fabrication or moulding, utilities, maintenance, packaging and wastes as applicable to the supplied article. Full upstream component/subassembly/final-production scope is evidenced by the Ecoprofile; it supplies no factory recipe or coefficient. A bare PCB or individual semiconductor flow cannot replace a complete populated module. Record supplier-embedded included parts once; actual disjoint local operations require their own expanded atomic inventory and evidence, not a paper upstream gate hiding owned manufacture. Unknown producer boundaries prevent a complete cradle-to-gate dataset claim."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "Maintain every actual tester, display, reusable test controller, ESD mat/strap, screwdriver, tweezers, pry tool and dispenser as a physical fleet with opening, receipts, external transfers, retirement and closing mass/count separate from service burden. Preserve actual observed use, remaining capacity/history, maintenance and whole contaminated discard with compatible provider units; no lifetime, guessed weight, one whole machine per kg or automatic replacement credit. Reusable cloth stock and cleaning history remain independent of expendable swab/wipe material. A test controller's batteries/cables are included once in its actual scope, separate from the sale-unit controller. Whole tool/module and separately disclosed contained components are disjoint or non-additive."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "The Microsoft manufacturing announcement is a historical planned parts-to-console chain; the 2023 Ecoprofile concerns a representative US Series X configuration; the 2025 illustrated digital-console guide concerns supported repair models/serial families. They support a declared technical synthesis, not one factory, SKU, production order, universal supply BOM or current stock assurance. Native whole-console family fit does not establish quantity, grade, provider qualification, power or electronic performance. Actual first-production acceptance, configuration and serial records establish the reference gate; repair-guide test examples do not themselves prove current factory release or safety certification."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Keep all source counterconditions: the digital guide contains disc/eject and screen wording, a recursive motherboard instruction, inconsistent screw instructions and leakage-test alternatives whose printed current and voltage/resistor criteria are not numerically equivalent. Do not turn any of these into a universal production procedure or quietly correct them. No numerical leakage, torque, angle, cleaning concentration, service interval, life or catalogue mass is prescribed by this PCR. Actual model-compatible assembly/test procedures and independently approved production release records must exist before a concrete dataset can report accepted hardware. Unresolved essential test-method applicability remains a hold for that concrete route; a finite quantity/projection pass cannot waive it. Occurred unsuccessful/unauthorized tests, rework, solvent use, disposal and all Q0 burdens remain recorded even without qualified output."
    source_ids: []
  - rule_id: val_reference
    applies_to: "complete reference"
    rule: "Require the complete manufactured home-compatible Product reference, exact physical mass chain, unique finished_console output and actual configuration M/Q release. Software, chip, PCB, single PSU/controller or component-only identity cannot substitute."
    source_ids: []
  - rule_id: val_disjoint
    applies_to: "supplied modules"
    rule: "Reject overlapping whole-module and constituent purchases, supplier SMT/chip manufacture duplicated in foreground, assumed local production, absent optical drive tests and unverified material recipes. Record actual missing inputs as specific cards."
    source_ids: []
  - rule_id: val_measurement
    applies_to: "all inventory rows"
    rule: "Require finite compatible quantity/basis relationships in both languages, correct native property/group/units, complete raw collection and a single normalization. Unsupported/unknown relationships remain unresolved, not claimed passing from Schema alone."
    source_ids: []
  - rule_id: val_cohort
    applies_to: "first release and service"
    rule: "Reject Q plus closing releasedFG as double production, closingFG subtraction from manufacturing burden, reinspection/repair/shipment as new Q, performed-service removal for stored FG and future unobserved service. Keep Q0 raw burden without unit result."
    source_ids: []
  - rule_id: val_physical
    applies_to: "gross gates and packaging"
    rule: "For each actual packaging pool validate separate conditional P/I/ER/grossS/EO/W cards and full wet stock balance. If one mixed outlet, originW children remain non-additive. Reject gross physical scaling by A/economic/service share, lost retained ingress, internal double purchases or automatic credits. Every actual packaging pool uses the complete disjoint J_in/J_out and H2O_in/H2O_out wet balance in calc_pack; duplicate observations cannot remove C or real increments."
    source_ids: []
  - rule_id: val_species
    applies_to: "materials and water"
    rule: "Independently close full mass and relevant elements with actual molecular/phase evidence. Keep natural storage moisture, gross in/out, contained carrier water and old/new repair parts once; no one-residual multiple unknowns or indicators pretending to be species."
    source_ids: []
  - rule_id: val_operations
    applies_to: "real work and software"
    rule: "Collect unauthorized/failed/rejected work and actual hold/waste even when it cannot produce qualified output. Require real permission, posttests and disposition for claimed rework fitness. Document material software/development reuse and resource attribution; hardware kg or licence price does not establish it."
    source_ids:
      - microsoft-xbox-digital-service-2025
      - jrc-ilcd-attributional-2010
  - rule_id: validation_rule_16
    applies_to: "foreground_dataset_conformance"
    rule: "O + P + I + ER + J_in + H2O_in = C + S + EO + W + J_out + H2O_out. O and C are complete actual wet opening/closing empty, attached-WIP, attached-FG and reusable stocks. P/I/ER are disjoint whole-article inward legs; S is gross outward shipment, EO external return sent, W the actual whole wet discard. ER is external return received. J_in/J_out are independently measured non-water repair, replacement, residue or other material transfers across this packaging-pool boundary not already in those whole-article legs. H2O_in/H2O_out are independently measured actual water transfers across this pool boundary not already embodied in those legs; include natural adsorption/desorption without any repair. Split wet added/removed material into disjoint non-water J and H2O; no prescribed composition or density. Full wet W includes substrate/retained residues/water once, so its nested components are not additional J_out or H2O_out unless physically separated before the boundary. Matched internal pool transfers cancel on foreground consolidation and create no extra purchase, service or Q."
    source_ids: []
  - rule_id: validation_rule_17
    applies_to: "foreground_dataset_conformance"
    rule: "The physical balance uses disjoint measured J and water terms. Its raw observation reconciliation is L_in_observed - X_in = P + I + ER + J_in + H2O_in and L_out_observed - X_out = S + EO + W + J_out + H2O_out. L_in_observed/L_out_observed are observation-side sums only, never extra inventory flows or provider demand. Each X must map by event, component, unit and side to a duplicated OTHER observation of a mass already counted once in the corresponding canonical side. After deduplication every real J/H2O remains once; X cannot cancel true retained ingress, C, O, an opposite-side leg or a nested W child merely because it is in stock. With disjoint raw observations X=0. Internal attachment/reuse alone is no boundary crossing; a transfer into this pool from an asset/repair-material pool has matched source/destination ledgers and is not another external purchase. No repair does not mean J or water is automatically zero: keep real deposited material and natural humidity if present; unknown values stay unresolved."
    source_ids: []
  - rule_id: validation_rule_18
    applies_to: "foreground_dataset_conformance"
    rule: "A wet new repair board or other article is measured independently into non-water J_in and water H2O_in without a default ratio. A real separated removed board/liquid has its own disjoint J_out/H2O_out or whole W, not both. Water already in O, C, P/I/ER/S/EO/W is nested content, not an added increment; uptake and loss after those observations are independently timed transfers. Keep water phase and volume convention, temperature/pressure and actual density evidence when converting the bound atmospheric resource m3 to kg. Do not assume liquid density, fit a residual or restore lost water into a survivor. Full physical package/repair/waste transfers and actual provider totals stay independent of original-cohort A/Qc/H attribution, inherited histories and zero-output loads."
    source_ids: []
  - rule_id: validation_rule_19
    applies_to: "foreground_dataset_conformance"
    rule: "Manufacture of a new complete configured digital-only home video game console without an installed optical drive, from supplied finished hardware modules to its unique first whole-unit release. The selected mechanical/connector assembly route covers real local configuration and testing rather than purchased-complete-console packing. The default output is the complete declared hardware configuration; included controller, mains cord, HDMI cable, external adapter and installed storage/cooling depend on the actual supply BOM. Packaging is included as activity and upstream burden but excluded from reference hardware mass. No default SKU, component formula, net weight, yield, power, test duration, gaming lifetime or certification is supplied."
    source_ids: []
  - rule_id: validation_rule_20
    applies_to: "foreground_dataset_conformance"
    rule: "This is a transparent qualitative technical synthesis: the historic manufacturer announcement supports a parts-to-complete-console assembly/test/box-build chain; the modern Ecoprofile establishes complete production and configuration scope; the illustrated service guide supports module interfaces and real reassembly checks. These are not the same SKU, current factory or order. Service procedures alone do not establish a factory traveller. The digital guide contains disc/eject and screen wording and screw inconsistencies; only real model-compatible operations enter the dataset. Evidence absence for current quantities is not a zero."
    source_ids: []
  - rule_id: validation_rule_21
    applies_to: "foreground_dataset_conformance"
    rule: "Declare every qualifier in dataset metadata or equivalent notes. The native complete manufactured console family also covers handhelds; positive whole-home-console evidence and the actual supplied configuration narrow applicability. It supplies no single-SKU quantity or functional equivalence across performance generations."
    source_ids: []
  - rule_id: validation_rule_22
    applies_to: "foreground_dataset_conformance"
    rule: "The cards below are conditional physical atoms, not a prescribed BOM or recipe. Record every actual event even when unauthorized or nonconforming; not_applicable needs evidence of physical absence, not missing data or approval. Components inside one supplied article are disjoint/non-additive. All stage meters/event ids are matched to avoid duplicate utilities. Actual missing materials, emissions, refrigerants, fuels, carrier-water/heat returns and packaging types require separate specific cards before dataset completeness."
    source_ids: []
  - rule_id: validation_rule_23
    applies_to: "foreground_dataset_conformance"
    rule: "One supplied populated logic/memory motherboard core. Record exactly which installed storage, cooling structure, shields, firmware and hardware arrive inside it. CPUs, GPU, memory, bare board, solder and upstream semiconductor/SMT energy already covered by that supplier article are not extra inputs. The service diagram distinguishes assemblies but does not certify this factory supply BOM. Confirm this unbound single physical identity against complete native type, composition/CAS where meaningful, form, grade, route, geography, medium and all properties/units before dataset binding. Bounded search is not proof of database absence. Physical numerator is complete observed gross leg V in its native unit; retain a separately owned actual burden vector once. Never scale V by burden allocation or stock correction. Associate event with manufacturing Q or original-cohort Qc/H; actual missing observations remain unknown."
    source_ids: []
  - rule_id: validation_rule_24
    applies_to: "foreground_dataset_conformance"
    rule: "One finished internal AC-to-DC PSU with its actual leads/connectors and shield. Count only when supplied outside the motherboard/core article; not a raw transformer or LED driver. No duplicated PSU electronics or conversion losses during its supplier manufacture. Confirm this unbound single physical identity against complete native type, composition/CAS where meaningful, form, grade, route, geography, medium and all properties/units before dataset binding. Bounded search is not proof of database absence. Physical numerator is complete observed gross leg V in its native unit; retain a separately owned actual burden vector once. Never scale V by burden allocation or stock correction. Associate event with manufacturing Q or original-cohort Qc/H; actual missing observations remain unknown."
    source_ids: []
