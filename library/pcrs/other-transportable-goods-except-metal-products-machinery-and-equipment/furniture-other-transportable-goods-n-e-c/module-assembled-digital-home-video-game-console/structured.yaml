      unit: "kg"
      frequency: "Each unique release and cohort boundary"
      temporal_coverage: "Actual complete reporting cohort"
      site_scope: "Declared plant and configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; complete BOM; scale/tare readings; test/release and duplicate-serial checks"
