allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Use this hierarchy only within the stated attributional decision context and actual need for allocation. Goods/services retain distinct functions; this is not a comparison of multifunctional consumer functions or automatic system expansion."
    source_ids: []
  - rule_id: a_scope
    applies_to: "actual shared burdens"
    rule: "Apply only to attributional cases genuinely requiring allocation; no free choice between physical/economic approaches. Manufacturer process descriptions establish no LCA allocation."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_subdivide
    applies_to: "actual shared burdens"
    rule: "First separate dedicated lines, actual meters, work orders, batches, tooling and tests; use justified virtual subdivision to assign embodied specific components and exclusive exchanges. Preserve all failed and ancillary burdens within their actual function."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_causal
    applies_to: "actual shared burdens"
    rule: "For every remaining shared exchange establish its determining physical causality with measured evidence. Steel cutting, weld work, mould service, coating/cure, station testing and storage may have different causal constraints; convenient machine count, product mass, rated power or correlation alone is not proof."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_residual
    applies_to: "actual shared burdens"
    rule: "Only genuinely residual common-process burdens after subdivision/causality may use contemporaneous market values for actual state at the same process gate. Document prices, currency/time, co-functions, residual scope, conservation and sensitivity. Ordinary waste sales/reuse do not automatically receive coproduct status or avoided-production credit. Physical gross legs remain full."
    source_ids:
      - ilcd-detailed-2010
