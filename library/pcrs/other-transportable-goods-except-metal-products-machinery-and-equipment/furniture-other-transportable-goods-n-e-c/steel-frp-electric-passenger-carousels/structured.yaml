product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.furniture-other-transportable-goods-n-e-c.steel-frp-electric-passenger-carousels"
  classification_refs: "CPC 3.0 38600; narrower product and route boundary"
  covered_products: "Complete new steel/FRP electric passenger carousel with actual aluminium deck and declared whole-ride supply."
  excluded_products: "Ordinary furniture or playground seat alone; motor/steel frame/track alone; toys; shooting-gallery, coaster, swing, hydraulic or unpowered architectures without route evidence; treated-wood deck route; foundations, field construction/installation, operation and admission services."
  representative_product: "One configuration-declared complete carousel with measured net M, serial identity and actual first-release criteria. No nominal rider capacity or power is imposed."
  production_route: "Receipt → actual steel/deck cutting/forming/welding → FRP lay-up/cure/trim → surface preparation/coating/drying → mechanical/electrical/safety integration → actual test/rework → unique first release → separate observed packing/storage/dispatch. Make/buy stages are disjoint."
  market_state: "New first-quality-released complete net ride at manufacturing gate, possibly disassembled for transport with all matching modules retained. Packaging, ballast and transport fixtures are separate."
functional_unit:
  what: "Manufacture a complete configured passenger-carrying electric carousel"
  how_much: "1 kg of newly first-quality-released complete net ride"
  how_well: "Actual complete BOM, frame/deck and passenger-body integrity, drive/control/safety configuration and recorded acceptance tests/results; no universal certification or threshold."
  how_long_or_cycle: "One manufacture/first-release cohort; actual later service horizon H retains original Qc. No operating life or maintenance interval is prescribed."
  reference_flow_link: "finished_ride"
system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "all processes"
      rule: "Cover actual raw steel/deck and reinforcement/formulation receipt through cutting/forming/welding, FRP lay-up/cure/trim, surface preparation/coating/actual drying, mechanical/electrical/safety assembly, actual functional/load tests and first whole-ride quality release. Include actual pre-release rework and all failure/cleanup loads. Purchased finished modules replace their own manufacture once with complete upstream coverage."
      source_ids:
        - dinis-carousel-manufacture-2022
        - sartori-ride-manufacture
    - rule_id: b_q
      applies_to: "finished_ride"
      rule: "Q is the sum of measured net complete-ride kg uniquely first quality-released in the production cohort. Include actual retained components, coatings, fluids and water once; exclude packaging, test ballast and unreleased/failed machines. Released closing FG already belongs to Q and is neither a second production output nor manufacturing Bclose. Delivery/reinspection/dismantling/reassembly never creates new production."
      source_ids:
        - dinis-carousel-manufacture-2022
        - sartori-ride-manufacture
    - rule_id: b_scope
      applies_to: "whole ride"
      rule: "This bounded method is new steel/FRP electric carousel manufacture with an actual aluminium deck, not the full technology range of the classification. Complete ride supply is established by actual released BOM, structural and passenger-body complements, drive, controls and installed safety items; separate foundations, civil/site construction, field installation and customer operation from first factory release. Retain actual factory tests without importing customer running duty or nominal ratings as measured factory demand."
      source_ids:
        - dinis-carousel-manufacture-2022
        - sartori-ride-manufacture
        - un-cpc-3-2025
    - rule_id: b_supply
      applies_to: "all product inputs"
      rule: "Record each whole supplied preparation/article once; assay, active ingredient and carrier water are nonadditive composition children. Onsite preparation instead records each actually purchased component, mixing energy and loss. Purchased motor, cabinet, bearing and finished body do not also procure their embedded metals, polymers or prior operations. Use disjoint supply or a reconciled constituent bridge with internal handoffs cancelled."
      source_ids:
        - dinis-carousel-manufacture-2022
        - sartori-ride-manufacture
    - rule_id: b_stock
      applies_to: "all inventory rows"
      rule: "Preserve physical wet quantities and each inherited exchange vector for every opening/closing raw, WIP and unused/unassigned non-WIP store. Cohort burden uses brought-forward vectors plus actual work; carry forward only genuinely unassigned raw/WIP/service charges. Ordinary rejects, cleanup, samples and scrap are not other-function transfers. A real other cohort/function requires justified allocation and a single documented vector handover. Do not subtract consumption already net of stores a second time."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: b_zero
      applies_to: "all processes"
      rule: "Keep failed zero-output lots, startup/shutdown, idle, cleaning, extraction, testing, rework and treatment. Q=0 retains complete raw physical and burden ledgers and produces no unit result. Unknown is never zero or not_applicable. Add every actually present unlisted atomic exchange explicitly."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: b_physical
      applies_to: "all physical legs"
      rule: "Every external material, component, asset, fluid, Waste and heat-carrier Product leg retains full gross V in its actual native extensive unit. Allocation, burden shares, inventory changes or service fractions cannot scale logistics. Reconcile manufacturing, FG/service and consolidated physical gates with internal transfers cancelled once. Full wet closing stock and a real retained influx coexist."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: b_pack
      applies_to: "pack"
      rule: "For each actual same-unit whole-wet packaging article pool: O+P+I+ER+J_in+H2O_in=C+S_filled+EO_empty+W_whole+J_out+H2O_out. O/C include empty, WIP-attached, released-FG-attached and reusable whole-wet stocks. P independent new supply and I supplier-included ingress are disjoint; ER is actual inward return. S_filled includes actual filled outward shipments/returns; EO_empty is only empty outward return; these legs are mutually exclusive. W_whole includes substrate, retained material and water once. J_in/J_out are actual disjoint non-water repair/retained matter increments/departures, and H2O_in/H2O_out are actual water increments/departures including sorption/desorption, without double-counting water already in whole P/I/ER or other actual streams. X only reconciles duplicate OTHER same-side component entries before balancing: it is no extra physical flow and cannot cancel true influx, whole-wet C or opposite-side flows. Substrate-only ledgers bridge to whole-wet stocks/exports by actual composition. Internal reuse cancels without repurchase, new Q or co-product credit; no invented repair."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: b_x
      applies_to: "all physical balances"
      rule: "X removes duplicate constituents only from another actual term on the same incoming or outgoing side. It cannot cancel stocks, the opposite side or a card merely because present. Whole wet articles and separately supplied components must be disjoint or explicitly bridged. Never use one mass residual to fit two unknown quantities."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: b_species
      applies_to: "waste; fabricate; frp; coat"
      rule: "Independently reconcile total wet mass, relevant elements and each actual molecular species. Distinguish free/carrier/sorbed/phase/structural water and reaction water supported by actual chemistry. CO2 origins, N2/O2/Ar/H2O and each real solvent remain distinct. VOC/COD/NOx/PM and total-element indicators are not molecules. Actual separate wastes remain separate; one actual mixed Waste stays one receiver/total with nonadditive measured origin_W."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: b_service
      applies_to: "service; assets; pack"
      rule: "For each already released original cohort observe actual horizon H and original measured Qc. Keep performed warehouse/packing/handling/dispatch, returned ride/parts, dismantling/reassembly/reinspection and actual later work with original history. Do not deduct performed service for retained FG; carry only unused/unassigned service. Future work remains unknown. Permission/test/acceptance governs authorization and qualification only: all unauthorized, failed, rejected or held real work/logistics/loads remain. No presumed restoration or new Q."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: b_heat
      applies_to: "coat; all utilities"
      rule: "Record actual thermal supply agreement, each true heat-carrier Product return and its kg, phase, T/P and enthalpy, together with actual heat MJ. One provider owns the energy once. Neither a boiler/steam loop nor condensate is presumed. Integrated gas/liquid volume is already cumulative; integrate only actual rates and use independently measured substance-specific density/state."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: system_boundary_rule_13
      applies_to: "foreground_system_boundary"
      rule: "This method covers one complete new electrically driven passenger carousel manufactured from actual structural/deck stock and FRP or their disclosed finished intermediates through first whole-machine quality release. The supported route uses an aluminium chequered deck; the source alternative of treated wood is not silently combined. Dinis provides a complete manufacture account; independent Sartori material supports metal/FRP manufacture, mechanical/electrical assembly and factory tests. These qualitative technical examples are not one SKU/site, recipes, inventory rates or proof of any particular approval. The original classification is broader: other fairground ride architectures require evidence and method assessment within this same record. dinis-carousel-manufacture-2022; sartori-ride-manufacture; un-cpc-3-2025"
      source_ids: []
    - rule_id: system_boundary_rule_14
      applies_to: "foreground_system_boundary"
      rule: "Declare every qualifier in the data package. A broad finished-product family neither supplies a factory inventory nor equates different ride functions by kg."
      source_ids: []
    - rule_id: system_boundary_rule_15
      applies_to: "foreground_system_boundary"
      rule: "Each card is one conditional actual exchange. Unknown is not absent. Add every real additional specific material, whole formulation, utility, separately supplied safety part, packaging article, actual species and waste before using the method. Chemistry candidates do not prescribe a recipe. Raw physical V and burden A are distinct ledgers; all flow-card results refer to the same single final calculation in section 8."
      source_ids: []
    - rule_id: system_boundary_rule_16
      applies_to: "foreground_system_boundary"
      rule: "Aggregation fields declare final reporting basis only: collection retains undivided raw totals. The following single calculation executes each final division; cards and aggregation fields reference that same result without dividing again."
      source_ids: []
    - rule_id: system_boundary_rule_17
      applies_to: "foreground_system_boundary"
      rule: "Preserve the entire native counterevidence: the whole Product basename is Roundabouts, swings, shooting galleries and other fairground amusements / 旋转木马、秋千、射击场及其他游乐场用娱乐设备; type Product flow, finished manufactured production mix at plant, Mass/kg. Its general comments literally read “387 Prefabricated buildings” / “387 预制建筑”. In the complete official CPC3.0 structure CSV, line1820 is38600 and line1821 is the bare387 Prefabricated buildings heading, followed by3870/38701–38704. The isolated native heading exactly matches the next source category. Admission of this positive complete physical carousel is an explicit inference from that adjacency, full names/type/state/reference and real primary manufacture evidence; it is not established knowledge of how database data were formed, not a correction to native fields and not CPC metadata alone. Any genuine material/phase/route hard conflict still blocks fit; independent review remains pending. Sources: un-cpc-3-2025;dinis-carousel-manufacture-2022;sartori-ride-manufacture."
      source_ids: []
    - rule_id: system_boundary_rule_18
      applies_to: "foreground_system_boundary"
      rule: "Dinis actually describes design, laser-cut/welded steel frame, a choice of aluminium chequered plate or treated-wood platform, layered glass fibre with resin adhesive, polishing with dust removal, varnish/primer/paint and a paint baking room, followed by bearing/centre pole/motor/horse/LED assembly and running the complete ride before shipment. This method selects the aluminium branch, not both deck alternatives. Sartori explicitly describes its own metal/fibreglass/painting/mechanical and electrical work and tests before factory exit; duplicated layout card order does not prove a test-before-manufacture chronology. Retain the real in-house laminate, dust removal and heated paint-room work; do not hide them in an arbitrary receiving or external-utility gate. These manufacturer statements are qualitative route evidence, not a common SKU/factory, recipe or independent safety approval. Sources: dinis-carousel-manufacture-2022;sartori-ride-manufacture."
      source_ids: []
    - rule_id: system_boundary_rule_19
      applies_to: "foreground_system_boundary"
      rule: "Measure M for one actual complete accepted serial/configuration at the fixed reference gate and recorded physical state using calibrated full-ride weighing. Include actual permanent components/coatings/installed fluids/water once, independently exclude real transport packaging, temporary shipping fixtures and test ballast. If complete transport modules must be weighed separately, use actual calibrated module records at matched state, unique module identities and a nonoverlapping complete released-BOM reconciliation; never add whole-ride weighing and its included modules twice or use drawings/density, nameplate, rider capacity or a nominal per-machine weight. A kg reference is a normalized fraction of the complete accepted ride, not a usable spare part. Whole-ride M cannot convert another part/package count; use its own actual mass bridge only when needed. No numeric M is supplied by this PCR."
      source_ids: []
    - rule_id: system_boundary_rule_20
      applies_to: "foreground_system_boundary"
      rule: "Lock Q (original Q0) as the positive sum of unique complete-ride first-acceptance event net masses at one fixed actual gate/state, each linked to original serial/BOM. Preserve original M/event/date and a disjoint original-basis bridge of remaining net deliveries, every actual on-site accepted state including FG/holds/accepted samples/repair WIP, irreversible material/fluid/water losses and other terminal dispositions. Already accepted later destroyed or partly lost rides remain in original Q0; never-accepted destroyed specimens are excluded. Dismantling/reassembly/retest/return/redispatch and moisture change create no second event. Never restore lost matter into survivors and count the loss again. Q0 is an event account, not another external physical output; Q=0 or unknown positive basis preserves raw totals without a unit result."
      source_ids: []
    - rule_id: system_boundary_rule_21
      applies_to: "foreground_system_boundary"
      rule: "For each exchange vector A=B_open+U_new-B_close-T_other. U_new is actual new material/service/provider/work/treatment burden addition BEFORE stock correction; B covers raw/WIP or genuinely unused/unassigned non-WIP stores/service charges, never already accepted FG or performed services. Already stock-corrected consumption uses the reconciled equivalent ledger without another opening/closing correction. Own inherited foreground/WIP and provider aggregate versus included expanded histories are not added twice. Ordinary scrap/reject/sample/waste sale is not a true independent other function permitting a burden handover. Physical raw/WIP/FG/asset/ballast/package fleets and stocks remain independent and complete."
      source_ids: []
    - rule_id: system_boundary_rule_22
      applies_to: "foreground_system_boundary"
      rule: "Use three ledgers for a shared waste, asset or ballast-service event: one actual full physical receiver Qt and full actual provider quantity recorded once; independently known component/physical-cohort provenance; and distinct evidenced nonoverlapping environmental/treatment-service vectors per original served cohort in compatible provider units. Qt/Qanalysis is only raw physical disclosure on a declared positive observation basis; linked modeled demand uses attributable A/original Q0 or A_h/original Qc. Unknown assignment stays unresolved. Never recharge the full shared receiver/provider quantity to every cohort, shrink actual physical waste by allocation shares or infer a fixed life/load/cycle count."
      source_ids: []
    - rule_id: system_boundary_rule_23
      applies_to: "foreground_system_boundary"
      rule: "Whole contaminated crate/film/strap/cloth/filter or collection-container waste includes actual substrate, retained resin/paint/grease/dust/liquor and water once. Dry substrate and retained constituents are nested nonadditive accounts, not extra attached-material/water exports or repeated treatment demand unless truly separated before the boundary. Separate actual steel/aluminium/FRP/paint/effluent outlets stay separate; mixed-only origins are children of the one real mixed receiver. Full physical waste and actual fleets/stocks/receiver/provider quantities remain unchanged by service attribution."
      source_ids: []
    - rule_id: system_boundary_rule_24
      applies_to: "foreground_system_boundary"
      rule: "For each actual same-unit whole-wet packaging pool use O+P+I+ER+J_in+H2O_in=C+S_filled+EO_empty+W_whole+J_out+H2O_out. P separate purchase and I supplier-included ingress are disjoint. ER is actual inward returned article with empty/filled state; for filled returns reconcile net contents and packaging component inside one full receipt. S is true outward filled shipment including genuine returned material or complete modules; EO only empty outward. J and water are disjoint actual repair/retained increments and departures. X only reconciles duplicate OTHER same-side component terms before this balance, never another added physical flow or deduction of actual P/I/ER, wet C, opposite legs or true retained influx. Substrate-only balances bridge explicitly to whole W by composition. Return/reuse gives no new Q/cofunction/credit."
      source_ids: []
    - rule_id: system_boundary_rule_25
      applies_to: "foreground_system_boundary"
      rule: "Synthetic checks only, never empirical/default ride mass/life/duty/load factors: one10kg contaminated filter consists of8kg substrate+2kg retained material and serves old/new cohorts; receiver/provider quantity10kg occurs once. Hypothetically independently evidenced25%/75% compatible-unit treatment service gives2.5/7.5kg-equivalent modeled vectors; originalQnew100kg/Qold200kg gives0.025/0.0375kg-equivalent per kg reference. Not2.5kg physical export or full10kg demand again for both. A separate pool test O2+P3+I1+ER4+retained1=C3+S4+EO2+wholeW2=11kg has Wsubstrate1+retained1 nested once. Count and mass records stay independent; no actual filter, M, number of riders or operation energy inferred."
      source_ids: []
    - rule_id: system_boundary_rule_26
      applies_to: "foreground_system_boundary"
      rule: "The manufacturer sources establish layered glass/resin bonding and actual primer/paint/baking operations, but do not identify an unsaturated-polyester/MEKP, epoxy/amine or acrylic supplier recipe. Those specific conditional cards are not a compulsory simultaneously used ingredient set or proof that Dinis/Sartori uses them. Activate only actual independently evidenced whole supplies and chemistry; other real formulations require their own atomic rows. Whole resins/hardeners/coatings include carrier/active ingredients once; source glass-layer count, chemical dosage, yield, cure schedule and emissions are not defaults. Actual reaction/retention/evaporation/water and species evidence remain independent, never conservation of reacting monomer by assumption or a VOC/COD/element residual inventing molecules. Unestablished essential matrix identification/quantification remains a concrete-study hold."
      source_ids: []
    - rule_id: system_boundary_rule_27
      applies_to: "foreground_system_boundary"
      rule: "Native electricity retains exact Net calorific value / 净热值, 低位热值 and its MJ energy-unit group. Measured kWh times3.6 is electrical unit conversion only, not a fuel calorific-value or burner premise. The chosen electricity flow is CN grid-average below1kV to user; another actual supply requires its own compatible identity/provider, not an Italian factory proxy. Retain every real paint-baking/thermal producer, actual on-site combustion/voltage conversion/treatment and full materials/air/water/species/fuel/heat/return interfaces and losses. Outsourcing or a supplied heat label does not erase a known real operation or allow duplicate carrier/energy/provider histories."
      source_ids: []
    - rule_id: system_boundary_rule_28
      applies_to: "foreground_system_boundary"
      rule: "Dinis reports a pre-shipment run and Sartori tests depending on requirements before factory exit. These are actual manufacturing/test stages, not a published universal structural-fatigue procedure, independent safety certification or operation-duty factor. Use actual engineering specification, test media/ballast, energy, permissions, results, failure/rework and release records. Test ballast is an independent reusable fleet/stock or actual waste; never permanent ride mass or a new full block per kg output by default. If actual required final packing/disassembly checks precede approval, retain that pre-release work in manufacturing; after accepted release only actual increments belong to original cohort service. Operation passenger-hours/nameplate power/lifetime are not measured factory testing demand. Unknown essential test/matrix/producer evidence cannot close through a future SOP or finite check. Sources: dinis-carousel-manufacture-2022;sartori-ride-manufacture."
      source_ids: []
    - rule_id: system_boundary_rule_29
      applies_to: "foreground_system_boundary"
      rule: "ILCD principles apply only in a justified attributional allocation-needed study context: dedicated subdivision/virtual subdivision, exchange-specific determining physical causality, then genuinely residual contemporaneous values at the same real common-process gate and state. No arbitrary allocation menu, recycling credit, QFD functional equivalence or fixed service share is adopted. Preserve the complete primary qualifications and actual source/provider editions; engineering source/body/fingerprint checks do not establish scientific, translation, study, mapping or publication acceptance. Sources: ilcd-detailed-2010."
      source_ids: []
