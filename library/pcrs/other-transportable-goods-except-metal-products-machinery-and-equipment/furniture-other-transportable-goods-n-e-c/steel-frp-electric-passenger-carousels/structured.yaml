  calculation_rules:
    - id: cohort_accounts
      applies_to: "all inventory rows"
      rule: "Convert actual raw extensive units once and reconcile full physical V separately. For each exchange A_i=B_open_i+U_new_i-B_close_i-T_other_i, with U_new actual new material/service/provider/work/treatment burden addition BEFORE stock correction. B only raw/WIP/genuinely unused-unassigned stores/charges, never already released FG/performed service; already stock-corrected consumption uses its reconciled equivalent account without another stock correction or repeated own/provider history. True other cohort/function requires evidenced once-only handover. Physical disclosure v_i=V_i/Qanalysis uses a declared positive observation basis for the full actual event once; it is not linked full shared provider demand per cohort. Modeled demand a_i=A_i/originalQ0_i or a_i_h=A_i_h/originalQc in compatible provider units is attributed separately to each served original cohort exactly once. Never reduce physical transfers by service shares or recharge full receiver/provider Qt to every cohort. Q0 is locked unique first-acceptance mass; Q=0/unknown basis retains raw totals without unit result. Actual H and internal matched transfers remain explicit."
      inputs:
        - V_i
        - Qanalysis
        - A_i
        - Q0_i
        - A_i_h
        - originalQc
        - U_new_i
        - raw_stocks
        - inherited_vectors
        - native_conversions
        - causal_evidence
        - cp_allocation_receive
        - cp_allocation_fabricate
        - cp_allocation_frp
        - cp_allocation_coat
        - cp_allocation_assemble
        - cp_allocation_test
        - cp_allocation_pack
        - cp_allocation_assets
        - cp_allocation_waste
        - cp_allocation_service
        - cp_species
      output: "v_i; a_i; v_i_h; a_i_h"
      source_ids:
        - ilcd-detailed-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Use only fully facet-compatible native flow and provider: every basename, synonym/comment, CAS, grade, polymer/particle structure, route, geography, type/media and all properties. An isolated class/comment anomaly is disclosed; a hard physical/chemical contradiction blocks that binding. Exact reference-property → unit-group versions and reference unit must be verified, never substituted with latest or Mass for energy."
      evidence: "Original raw records and independent reconciliations"
    - id: dq_scope
      applies_to: "whole ride"
      requirement: "Retain complete route, original-source context, make/buy scope, actual configuration and acceptance; no invented recipe, yield, rating, lifetime, certification or plant observation."
      evidence: "Original raw records and independent reconciliations"
    - id: dq_balance
      applies_to: "all accounts"
      requirement: "Require complete raw and vector stocks, gross packaging/asset/fluid legs and independent wet-mass/element/species constraints; mixed Waste total or components once with one provider. Unknown remains a quantified evidence gap."
      evidence: "Original raw records and independent reconciliations"
    - id: dq_time
      applies_to: "service"
      requirement: "Preserve original measured cohort Qc, observed H, actual delivered/returned and performed work including unauthorized failures; future service remains unknown and never supplies retrospective new production."
      evidence: "Original raw records and independent reconciliations"
validation_rules:
  - rule_id: v_complete
    applies_to: "complete data package"
    rule: "Verify whole-ride BOM, make/buy ownership and all required actually installed safety/control items; positive complete manufactured Product identity cannot be replaced by a component or attraction-operation service. Preserve all native identity restrictions in consumed descriptions."
    source_ids:
      - dinis-carousel-manufacture-2022
      - sartori-ride-manufacture
  - rule_id: v_q
    applies_to: "complete data package"
    rule: "Reconcile serial/configuration-specific measured M and Q, first-release acceptance and failed/held dispositions; closing released FG remains within Q. One unique finished_ride reference row is 1 kg; no re-release through delivery or test."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: v_balance
    applies_to: "complete data package"
    rule: "Independently close every raw/WIP/non-WIP exchange vector, manufacturing/FG/consolidated gross physical balance, each packaging pool and actual asset/fluid/heat-return leg. Check X only on actual same-side duplication, retain wet closing stocks and reject unfounded reaction/species or two-unknown residuals."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: v_normalize
    applies_to: "complete data package"
    rule: "Raw protocols preserve undivided native observations. Verify native conversion, justified burden attribution and a single final division by actual Q or original Qc. Reconcile meter total with disjoint process shares; Q=0 has retained loads and no unit result."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: v_evidence
    applies_to: "complete data package"
    rule: "Record unknown formulations/species/providers and identity support as unresolved rather than zero; all conditional actual flows need their own atomic rows before use. Actual permissions/acceptance do not erase failed/unauthorized activities. No universal capacity, rpm, kW, temperature/time, dimensions, mass, life, maintenance or certification is inferred."
    source_ids:
      - ilcd-detailed-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared complete-carousel manufacturing input after actual compatibility and completeness assessment"
  allowed_use: "Same physical configuration/gate and route with actual metadata and verified upstream ownership"
  excluded_use: "Automatic safety approval, operation/admission service, lifespan comparison, all ride technologies, a bare motor/frame/seat, or negative-burden recycling claim"
  required_metadata: "All reference qualifiers, complete BOM and release boundary, each native provider restriction, cohort/time/site, make/buy, stocks, service H and original Qc"
  required_quality_disclosure: "Actual evidence and measurements, unresolved UUID/support/provider/formulation/species gaps, performed and omitted checks, uncertainty and unreviewed scope"
  update_trigger: "Changed construction, deck/resin/coating chemistry, drive/control/safety supply, test route, gate, measurement/provider identity or contrary source evidence"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division. CPC Version 3.0 Structure, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Original category and adjacent class boundaries; not manufacturing recipes or mapping approval"
  - id: "dinis-carousel-manufacture-2022"
    type: "literature"
    reference: "Dinis. How is Our Carousel Produced In Dinis? 9 November 2022. https://jsamusementrides.com/2022/11/09/how-is-our-carousel-produced-in-dinis/"
    used_for: "Complete carousel fabrication/FRP/finishing/assembly and run-test sequence; aluminium versus wood deck alternative; qualitative only, no universal chemical recipe or inventory"
  - id: "sartori-ride-manufacture"
    type: "literature"
    reference: "Sartori Rides. The Manufacturing. https://www.sartoriamusement.com/the-manufacturing/"
    used_for: "Independent manufacture/FRP/painting/mechanical and electrical assembly/factory test context; no claim of a common SKU/site or any actual authorization"
