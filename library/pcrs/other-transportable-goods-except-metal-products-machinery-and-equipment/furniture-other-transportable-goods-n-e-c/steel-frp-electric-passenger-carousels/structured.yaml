  - id: release_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q sums actual first-release complete net ride masses, with each retained component/fluid/water once and packaging excluded. A physical 1 kg is a normalized fraction of a complete ride, not a standalone usable ride part."
  - id: native_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual native extensive property"
      uuid: ""
    required_unit: "native"
    rule: "Native quantities remain mass, energy, volume, count or service as actually measured. Convert kWh to MJ once with 3.6 MJ/kWh. Item(s) and item are identical count with factor 1, never a kg conversion. Count-to-mass uses actual configuration-specific calibrated M; never infer kg or density from secondary coefficients. Integrated volumes are not multiplied by time; only true rates are integrated. Whole-ride M applies only to the same complete ride configuration. Other part/package counts remain native count where appropriate; a needed mass bridge uses independently weighed same-article mass and actual state, never whole-ride M."
