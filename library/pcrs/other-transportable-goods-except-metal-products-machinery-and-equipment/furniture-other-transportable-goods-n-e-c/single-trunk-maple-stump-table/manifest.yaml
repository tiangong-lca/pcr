  mapping_recommendation: "Accepted narrower scoped association by primary controller; exact version-bound full qualification remains a separate delivery requirement."
  core_identity_assessment: "The complete single-trunk maple body is a real sanded/shaped/sealed whole furniture product; nonstructural nylon glides and clear finish are retained in the complete BOM and physical accounts. Selected native family positively describes single-piece wood and does not state chemically pure/hardware-free composition. Engineered/veneered aliases and marketing text do not override or expand this unjoined-solid-body scope. Keep Area reference and independently evidenced whole-table occupied-floor-space geometry; no component or Mass substitution."
  evidence_synthesis_limits: "Bertu establishes the whole physical table, multiple uses, defects, nylon feet and actual kiln/spray steps, but not its heat source or finish recipe. Electric dehumidification and qualified clear2K finish are an explicit independent-source technology synthesis; no common contemporary factory/SKU/recipe claim. Lumber schedules and office-EPD lifetime/classification/compliance are not imported. Actual thick-section drying/moisture/defect, finish-substrate and whole-product acceptance evidence remains mandatory for a concrete study."
  historical_hold: "Prior joined fixed-beech dining-table draft and its independently reviewed native core hold remain historically valid. This genuinely different unjoined maple product does not close that hold, and the old physical/study route is excluded here."
  deduplication: "Current material manifests and accepted mapping/catalog context checked: no existing single-trunk maple stump-table method. Chairs terminate at seating; office/bedroom wood families have different principal products; kitchen cabinets have board/storage/hardware routes; lumber/log methods terminate before complete furniture. This candidate preserves all legacy/scaffold bytes and creates one semantic method only."
