    - rule_id: b_packages
      applies_to: "each packaging pool"
      rule: "For each actual whole article: opening empty+attached WIP+attached FG+reusable + P+I+ER + X_in = closing equivalent full wet stocks + S+EO+W + X_out. P new purchase; I supplier-included ingress; ER external return received; S leaves with gross physical shipment; EO external return sent; W waste. Keep six event cards conditional on real events, each full wet quantity. Internal reuse cancels; no new product Q, repurchase or credit. Whole article and component bridges are disjoint. Deduplicate packaging/repair/water X legs only against the identical other incoming/outgoing flow; closing retention never erases influx. A single mixed waste outlet is one Waste exchange, with component-pool W subledgers rather than additive duplicate outlets. X_in/X_out are independently measured actual separate added/removed components or water not already included in OTHER flow terms on the SAME side. Deduplicate only the identical event already included in another same-side incoming/outgoing term, never opening/closing stock, opposite directions or merely an existing atomic card. A whole wet P/I/ER receipt already contains its own components/water once; a real separately added retained input keeps BOTH its influx and complete wet closing mass. Unknown occurrence/species/amount is not zero; no repair, dry wood or extra water is presumed."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: b_water_carbon
      applies_to: "all physical gates"
      rule: "Independently reconcile whole wet mass, relevant elements, wood biogenic carbon, fossil resin/plastic carbon and ambient carbon. Forestry uptake remains with its upstream owner. Include natural humidity uptake and evaporation during production, storage and handling as actual atomic H2O legs; they require no work permission. Keep free, sorbed, carrier, liquid, vapour, structural and independently evidenced reaction water separate. COD/VOC/PM/wood dust/total carbon are indicators, not named molecular masses. Do not infer specific species, water reaction, oxidation or two unknowns from one residual."
