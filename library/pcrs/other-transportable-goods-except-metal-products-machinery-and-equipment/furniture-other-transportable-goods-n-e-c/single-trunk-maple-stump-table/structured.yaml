      rule: "Conditional real gross dry-air species entering the declared physical gate in measured ventilation/airless drying air. Keep actual state, species fraction and independent volume/mass/density evidence; a cumulative volume is not multiplied by time. No industrial compressed-gas purchase, air aggregate in addition to components, oxygen consumption, oxidation, biogenic uptake or molecular nitrogen from total-N is assumed. Ambient carbon remains distinct from wood biogenic and coating fossil carbon. Gross numerator is actual full V_i; it is not A_i, B_open+U-B_close or an economic share. No procurement, supplier burden or credit is generated; any real burden has a separate single owner. Only independently measured ordinary neutral gaseous molecularN2, CAS7727-37-9; native Elementary Resources from air inlet, Mass93a60a56-a3c8-11da-a746-0800200b9a66 through unitgroup93a60a57-a4c8-11da-a746-0800200c9a66 to kg. Noisy total-species, liquid/medical, ionic/excited or isotope aliases do not authorize replacing this actual ordinary gas; known other media/air subcompartments need compatible identities. This is a measured full gross pass-through ledger, not presumed industrial-gas procurement, reaction consumption or environmental generation. Pair actual same-origin/species/phase inlet/outlet records independently: unchanged pass-through is no new resource use/pollution/credit; independently established net process environmental change is separate and not charged together with its gross pair. No fixed air fraction, density or stoichiometry."
