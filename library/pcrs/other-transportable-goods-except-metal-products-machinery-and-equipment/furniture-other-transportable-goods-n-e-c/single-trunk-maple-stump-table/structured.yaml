    - rule_id: b_inventory_electricity
      applies_to: "electricity"
      rule: "Bind this UUID only for an actual China (CN) site using below-1-kV alternating current, consumption mix to user, grid-average supply. These native geography/voltage/mix/route restrictions are mandatory, not a generic worldwide electricity provider. Outside them retain a separately confirmed compatible electricity identity/provider. Meter real cutting, kiln/compressor/auxiliary heater, extraction, airless spray, drying ventilation, lighting/idle/control and service circuits by account. Native reference Net calorific value→Units of energy→MJ is an electrical-energy bookkeeping property, not fuel heat or mass; convert cumulative kWh by 3.6 once. No boiler or purchased steam is inferred. Quantity linkage: record raw units and cohort first; convert once, reconcile the appropriate manufacturing/service/asset burden account once, and take x_i from the sole quotient. Physical gross legs stay complete and separately reconciled."
