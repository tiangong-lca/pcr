allocation_rules:
  - rule_id: a_framework
    applies_to: "attributional process system"
    rule: "Apply this hierarchy only to an attributional study whose decision context requires allocation; do not borrow consequential avoided-product substitution. Separate actual multifunctional processes from multifunctional product comparisons. No fixed product/waste share or arbitrary physical-versus-economic choice."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_subdivide
    applies_to: "each exchange and cofunction"
    rule: "First collect dedicated operations separately and assign exclusive materials, parts, tests, treatment and services to their real cohort/function. Use evidenced virtual subdivision where exact technology relationships separate an exchange. A whole supplied formulation remains purchased once; assayed constituents are not extra inputs. Do not allocate away ordinary rejects, zero-output/startup loads or their actual treatment merely because they leave the gate."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_causality
    applies_to: "genuinely shared remainder"
    rule: "For each remaining exchange independently determine the physical relation that causes its existence and quantity. Document the causal test and alternatives: actual machining/spray duty, material embodiment, timed use or limiting transport function may differ by exchange. Mass, area, time or item count alone is not causality. Keep physical gross flow/stock quantities complete regardless of burden share."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_residual
    applies_to: "unresolved common-process burden"
    rule: "Only after subdivision and determining physical causality genuinely fail, use actual contemporaneous market values at the common process gate in the actual condition and amount. Reconcile downstream transport, packaging and conditioning to that gate; justify price source, period, currency, stability and sensitivity. Missing/zero/negative or nontraded values require resolution and disclosed uncertainty, not a convenient fixed ratio or invented price. This is a process allocation rule, not a functional-equivalence/QFD shortcut."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_waste
    applies_to: "actual residue and secondary outlet"
    rule: "Offcuts, sawdust, mixed waste, failed tables, samples and scrap sales retain manufacturing and treatment burdens unless there is a real distinct cofunction/cohort and justified one-time allocation/handover. Keep the full physical outlet even then. No automatic coproduct, negative treatment, displaced wood/energy, upstream forest uptake or recycling credit; assess any genuine recovery system separately with its actual provider and methodological boundary."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_service
    applies_to: "assets and original-cohort services"
    rule: "Separate full physical equipment/package holdings from actual fulfilled service. Match original Q_H and horizon H, capacity/utilization and any actual other function before assigning burden. A stored finished table does not undo service already performed. Retain historical original-cohort vectors; do not repurchase returns or cancel new repair/water influx against closing wet stock."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "plant"
      flow_role: "finished_table"
      record_type: "calibrated physical geometry and unique acceptance ledger"
      raw_fields: "configuration; drawing/BOM; item_id; first_acceptance_id/date; actual_complete_outline; protrusions; original_area; Q0; current_geometry; net_wet_mass; core/shell_moisture; tests; disposition; original_cohort; state_history; loss_identity; calibration"
      collection_method: "Measure full aerial exterior footprint including protruding feet/fixings and project its occupied perimeter to the floor; L×W only for a proven rectangular envelope, otherwise calibrated outline/planimetry. Independently weigh complete net product excluding packaging and sample core/shell moisture. Lock each original acceptance area; reconcile every disjoint delivery/on-site accepted state/loss/terminal disposition on that original basis. Actual current geometry and physical water/material losses remain separate; do not recreate losses in survivors. Returns, repair and retesting create no new first acceptance."
      unit: "m2; kg; item"
      frequency: "every actual acceptance and later state event"
      temporal_coverage: "entire manufacturing cohort and original-cohort history"
      site_scope: "complete actual table and controlled processing gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; raw geometry; full BOM; original acceptance register; independent moisture; full state/loss audit"
    - protocol_id: cp_material
      process_id: "plant"
      flow_role: "each whole supplied material preparation or article"
      record_type: "receiving and issue records with stock history"
      raw_fields: "row_id; supplier grade; full supplied composition/SDS; wet mass; dry solids and carrier water subaccount; original unit; receipt P/I; raw and WIP opening/closing; each inherited vector; purchase/provider owner; loss; actual mixing batch; M/S cohort; permission/test/disposition"
      collection_method: "Weigh each actual whole supplied preparation/article once and retain its disjoint component ledger. Measure every real receipt/issue/loss and opening/closing wet raw/WIP/unused charge stores with inherited vectors, distinguishing already stock-corrected issues. Record actual coating base and crosslinker separately and actual onsite mixing energy/loss; unperformed future values are unknown. Natural moisture additions are captured in cp_water without duplicating included water."
      unit: "kg; actual original unit"
      frequency: "each receipt batch issue mixing and stock event"
      temporal_coverage: "complete cohort and opening-stock history; actual service H"
      site_scope: "actual receiving production and service gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices; delivery tickets; current SDS/TDS; batch weights; storage/WIP lineage; permissions and tests"
    - protocol_id: cp_energy
      process_id: "plant"
      flow_role: "actual electricity and real added energy atom"
      record_type: "original meter record"
      raw_fields: "row_id; account; cohort; site country; voltage; grid/provider mix; state; cumulative start/end reading; raw unit; rate times if real; startup shutdown idle cleanup failure; allocation evidence; unused charge; source ownership"
      collection_method: "Meter each actual circuit/duty and retain original readings before conversion. Convert energy units once before actual attribution; source-specific voltage/geography/mix must match or a different identity/provider is required. Do not add boiler/fuel/steam by analogy. Actual new carrier requires a separate card with mass/heat/state and supply-return conventions."
      unit: "kWh; MJ; actual native carrier unit"
      frequency: "event and complete meter interval"
      temporal_coverage: "full production and original-cohort service horizon including failed runs"
      site_scope: "actual utility boundary and equipment circuits"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated meter; invoices; circuit/duty logs; actual carrier state and provider"
    - protocol_id: cp_transport
      process_id: "plant"
      flow_role: "actual freight"
      record_type: "shipment and invoice records"
      raw_fields: "delivery id; material wet mass; actual distance; vehicle; load; return leg; supplier-included owner; actual tonne-km; cohort; allocation evidence"
      collection_method: "Collect actual undivided consignment mass and route distance with vehicle/load/return evidence; calculate actual tonne-km once before assignment, retaining full physical loads and one transport owner. No sales-price reduction of transported physical mass."
      unit: "t*km; kg; km"
      frequency: "every real consignment"
      temporal_coverage: "complete production and actual service H"
      site_scope: "actual road-transport gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighbridge; route and vehicle record; freight invoice; upstream ownership"
    - protocol_id: cp_water
      process_id: "plant"
      flow_role: "added liquid water natural humidity and water outlets"
      record_type: "metering and independent moisture/species measurements"
      raw_fields: "event; material; phase; inlet/outlet medium; liquid mass/volume; independently measured density and state; cumulative quantity or actual rate; sorbed/free/carrier/structural/reaction water; opening/closing full wet stock; original cohort; X_in/X_out overlap id; condensate if real"
      collection_method: "Independently meter/weigh real liquid inputs and complete outlets and measure stock moisture and humidity uptake/desorption during normal production/storage/handling as well as repair/cleanup. Distinguish water within whole preparations/outlets from truly separate external H2O legs. Never use one residual for two unknowns or invent reaction water. Preserve new influx even in closing stock; overlap removal only against the identical other incoming/outgoing term."
      unit: "kg; m3 with measured density/state; actual rate unit"
      frequency: "each event and representative continuous interval"
      temporal_coverage: "complete cohort and actual service/storage horizon"
      site_scope: "manufacturing FG-service and consolidated physical gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "water meter/scale; moisture sampling method and uncertainty; density/state; humidity measurements; independent water closure"
    - protocol_id: cp_air
      process_id: "plant"
      flow_role: "actual dry-air species particulate aerosol and new molecular emissions"
      record_type: "analytical and gas-flow measurements"
      raw_fields: "specific species/material; CAS only if real; phase; medium; inlet/outlet; cumulative volume; actual rate and interval if real; temperature pressure humidity; independent density/species fraction; particle-size method; captured/escaped split; biogenic/fossil/ambient carbon; cohort"
      collection_method: "Measure each actual gross dry-air species and H2O separately; never add air aggregate plus its species or infer molecular emissions from VOC/PM/COD/total-N. Use independent state-specific species evidence, mass or gas conversion. Composite particulate/aerosol retains real composition and disjoint water/solid bridge; a genuine molecular volatile needs its own card. One residual cannot identify two unknown species."
      unit: "kg; actual volume/state; actual rate unit"
      frequency: "actual monitored runs and complete control interval"
      temporal_coverage: "all production modes and actual service H"
      site_scope: "actual inlet/outlet media and extraction boundaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "analytical method/calibration; full SDS; sampling/particle limits; gas-state evidence; mass/element closure"
    - protocol_id: cp_waste
      process_id: "plant"
      flow_role: "each actual separate waste outlet and treatment"
      record_type: "measured outlet and treatment record"
      raw_fields: "outlet identity; source pool; wet mass; moisture/composition; whole versus component bridge; retained and external residue; original cohort; failed work; provider; actual treatment; sale/disposition; inherited vector"
      collection_method: "Measure one full real outlet and treatment once. Separately measure source pools without summing them in addition to their actual mixed outlet. Preserve ordinary rejects/samples/offcuts/failed work and treatment, even if sold or sent out. Add genuinely distinct unmixed base/hardener/cleaner/condensate outlets separately when real."
      unit: "kg; actual provider unit"
      frequency: "every actual external outlet and stock event"
      temporal_coverage: "complete cohort plus observed returns/service H"
      site_scope: "actual outlet and provider boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale/tickets; bin segregation; composition; treatment contract; actual disposition and ownership"
    - protocol_id: cp_service
      process_id: "plant"
      flow_role: "gross G/R and actual original-cohort increments"
      record_type: "matched cohort and delivery history"
      raw_fields: "original first-release identity and Q_H; horizon H; opening/closing FG identity and inherited vectors; gross G; external R; original delivered quantity; current returned mass and geometry; water changes; parts; permissions; actual work/tests; disposition; unused service charge"
      collection_method: "Observe actual original-cohort packing/storage/handling/dispatch and return events. Retain full gross physical legs and historical manufacturing vectors with separate actual service increments. Manufacturer/spec permission and posttests establish rework acceptance, but failed or unauthorized actual work and its loads remain recorded. Shipping/retesting/return does not create Q; do not infer a net-delivery bridge or restoration from unchanged appearance."
      unit: "m2; kg; item; actual service unit"
      frequency: "every delivery return work event and FG stock close"
      temporal_coverage: "matched original cohort history and stated actual H"
      site_scope: "actual FG-service gate and subcontract work"
      aggregation_rule: "per reference flow"
      quality_evidence: "matched release/delivery/return IDs; FG vectors; permission/spec; posttests; calibration; actual hold/waste disposition"
    - protocol_id: cp_packaging
      process_id: "packaging"
      flow_role: "each real article P I ER S EO W charge and repair"
      record_type: "article-specific six-leg stock and ownership ledger"
      raw_fields: "article id; actual composition; wet tare; contained content bridge; opening empty attachedWIP attachedFG reusable; P; I; ER; closing same pools; gross S; EO; W; actual mixed outlet; X_in; X_out; upstream charge owner; unused/unassigned charge; original Q_H; H"
      collection_method: "Weigh/trace each whole actual article and all six actual directions independently. Supplier-included ingress is retained without a separate invoice. Stock correct burden once, never physical V. Retain new/water influx and complete wet closing stock simultaneously; deduplicate X only against identical other incoming/outgoing terms. Wholearticle and component bridge do not overlap. For one mixed waste outlet keep pool W subledgers and one actual Waste exchange, not duplicate outlets. Internal reuse cancels; no new purchase or credit from return/shipment/waste. Add independently measured actual X_in on the input side and X_out on the output side of the complete article/component bridge. Overlap is only the identical event already counted by OTHER same-side flow terms, not stocks/opposite legs/card presence. Preserve each retained real influx and full wet closing together; whole wet receipts include their original water/components once. Each component W remains a nonadditive source subledger of the actual single mixed Waste/treatment when that outlet is observed."
      unit: "kg; original count with actual measured tare"
      frequency: "every actual six-leg/repair event and stock close"
      temporal_coverage: "complete cohort plus original service H"
      site_scope: "supply plant FG-service and external return/waste gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "packaging BOM; tare/moisture; receipts; six-leg closure; component bridge; ownership and treatment"
    - protocol_id: cp_maintenance
      process_id: "plant"
      flow_role: "each actual tool filter fluid bearing and removed counterpart"
      record_type: "maintenance material and installed-stock records"
      raw_fields: "row_id; actual whole material identity; new/used receipt; included-component bridge; full wet mass; opening/closing installed; actual issue; removed material; water and contamination; original cohort; permission/test/disposition; inherited burden vector"
      collection_method: "Weigh each actual whole maintenance input and separately removed outlet; keep disjoint included-component and full wet-stock bridges. New inputs retained in closing stock remain real influx; already stock-corrected consumption is not corrected twice. Separate tool/material supply and actual treatment ownership once, preserving failed and unauthorized work."
      unit: "kg; actual original extensive unit"
      frequency: "every real maintenance and stock event"
      temporal_coverage: "full manufacturing and observed original-cohort service H"
      site_scope: "actual plant material/installed/outlet gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "maintenance and receipt tickets; installed stock; calibration; material/SDS; permissions tests and treatment"
    - protocol_id: cp_assets
      process_id: "assets"
      flow_role: "every real equipment holding service tool fluid and maintenance atom"
      record_type: "physical asset ledger plus actual fulfilled-service record"
      raw_fields: "equipment serial/configuration; whole mass; opening installed; new/used acquisition; actual component-included bridge; repairs; added water/fluid; closing installed; removed/worn parts; retirement; fulfilled hours; capacity/utilization; provider burden vector; inherited charge; cohort; permission/test/disposition"
      collection_method: "Preserve complete physical equipment/material/water stock and actual gross legs independently from fulfilled service hours and the justified provider burden allocation. Weigh actual whole/new/used/removed states and maintain disjoint component/fluid bridges. Closing retention does not cancel real influx; already supplied components are not repurchased. Use actual utilization and demonstrated capacity/ownership, no assumed life or one-machine-per-reference demand; uncertain provider conversion remains unresolved."
      unit: "kg; h; actual native service unit"
      frequency: "each asset maintenance event and actual service interval"
      temporal_coverage: "real opening history through cohort and service H"
      site_scope: "installed plant assets and actual provider boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; calibrated mass; maintenance/wear; utilization/capacity; service/provider evidence and stock closure"
    - protocol_id: cp_kiln
      process_id: "plant"
      flow_role: "kiln_refrigerant; kiln_condensate; hfc134a_air; hfc125_air; butane_air; isopentane_air"
      record_type: "kiln cycle, charge and independent analytical records"
      raw_fields: "cycle_id; section/species; all_charge_items; opening/closing_WIP; core/shell_samples; wet/dry_mass; calibration; actual_electricity; air_T/P/RH/flow; condensate_mass/composition; refrigerant_open/new/recovered_in/close/recovered_out; leak_species/composition; oil/water; operating/failure_modes; original_cohort; provider_owner"
      collection_method: "Use actual kiln controls/meters and representative independent core/shell moisture sampling with oven-dry reference checks suitable for the real section; retain full drying/defect history and failed cycles. Independently weigh condensate and determine its actual matrix/receiver. Reconcile complete refrigerant charge/service/recovery ledger and independently determined leak speciation/fractionation; no nominal leak or fresh-mixture factor. Analytical methods, recovery/detection limits, sampling coverage and uncertainty must suit the actual condensate/air/refrigerant matrix. An unvalidated assay or unknown essential method remains an unresolved result, never a software pass or invented closure. All actual utilities and species are separate atoms. For large wood items take representative cross-section sectors or subdivided increment-borer/auger samples with documented core/shell coverage; immediately weigh or protect samples against moisture change until weighing. Use an applicable documented oven-dry constant-mass reference procedure, with independently assessed volatile-extractive bias rather than treating all mass loss as water. Electrical meters require actual species/temperature/electrode calibration; a shallow or pinless reading dominated by surface layers cannot establish thick-trunk core moisture. Preserve observed gradients, sampling damage and every sampled/rejected body in physical and acceptance ledgers. Source lumber dimensions, temperatures, schedules, moisture recommendations and typical durations are not universal trunk settings. Thick timbers may remain internally wet and shrink later; kiln treatment and a coated appearance alone do not establish complete drying or acceptance."
      unit: "kg; m2; MJ; h; measured gas state"
      frequency: "each cycle, charge/recovery/leak event and stock close"
      temporal_coverage: "complete production and all original-cohort service history"
      site_scope: "actual kiln/chamber/drain/refrigeration/air gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "cycle logs; calibrated meters/scales; valid moisture/analytical methods; actual sample records; SDS; recovery tickets; complete charge/stock/species closure"
  calculation_rules:
    - id: calc_raw_units
      applies_to: "all inventory rows"
      rule: "Convert original extensive raw units once to the actual row unit before attribution; MJ=3.6×kWh for real electrical energy. Integrate only true rates with time/state; cumulative quantities already integrated are not integrated again. Density needs independent substance/state measurement."
      inputs:
        - raw_i
        - unit_i
        - measured_state
        - conversion_evidence
      output: "U_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_manufacturing
      applies_to: "manufacturing burden dimension only"
      rule: "A_m_i = B_open_i + U_m_i - B_close_i - T_other_i. Vectors carry each exchange's inherited burden by cohort; B_close is raw/WIP and only unused/unassigned non-WIP stores/charges. First-released closing FG is excluded because it already belongs to Q. T_other requires a true other cohort/function and one justified allocation/handover; ordinary waste/reject/sale/treatment is not T_other. Already stock-corrected consumption enters once without another stock subtraction."
      inputs:
        - B_open_i
        - U_m_i
        - B_close_i
        - T_other_i
        - allocation_evidence
      output: "A_m_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_service
      applies_to: "actual original-cohort service burden dimension only"
      rule: "A_s_i = C_open_i + U_s_i - C_close_unused_i - T_other_s_i. Include all actual performed service for the original Q_H over H; carry only unused/unassigned charge. FG held at closing does not subtract performed service. Keep original historical manufacturing vector separately with its original cohort, never repurchase a return or add it as new current manufacture. Unauthorized/failed work retains its actual increments and disposition."
      inputs:
        - C_open_i
        - U_s_i
        - C_close_unused_i
        - T_other_s_i
        - original_cohort
        - H
      output: "A_s_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_asset_service
      applies_to: "actual asset service burden dimension only"
      rule: "Derive fulfilled service quantity and its one provider burden from observed utilization/capacity and justified exchange-specific attribution. Maintain complete physical asset stock separately; neither full acquisition mass nor economic share is a physical service flow. No fixed lifetime or assumed full-machine-per-m2 replacement; missing capacity/provider conversion remains unknown."
      inputs:
        - fulfilled_hours
        - actual_capacity
        - provider_vector
        - allocation_evidence
        - original_cohort
      output: "A_asset_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_gross
      applies_to: "each physical-only gross event card"
      rule: "Set N_i = V_i, the actual complete external leg in the row's physical unit. Preserve full wet stock and real influx; remove only identical other incoming/outgoing terms. Do not apply manufacturing/service/asset stock correction or economic allocation to gross V. No procurement, duplicate provider burden or credit is created. Actual charge/fulfilled-service burden is a separate singly owned dimension."
      inputs:
        - V_i
        - event_identity
        - physical_overlap_bridge
        - original_cohort
      output: "N_gross_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_numerator
      applies_to: "all non-reference rows"
      rule: "Choose the one applicable numerator dimension: gross cards use complete N_gross_i; manufacturing burden uses A_m_i; service/charge uses A_s_i; actual asset service uses A_asset_i. Do not add physical-only disclosure to the burden inventory or apply allocation/stock correction to a gross numerator. Each ledger cell retains its dimension and cohort; split actual different cohorts rather than blending their denominators."
      inputs:
        - N_gross_i
        - A_m_i
        - A_s_i
        - A_asset_i
        - dimension
        - cohort
      output: "N_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_denominator
      applies_to: "finished_table; original_cohort"
      rule: "Q0=sum of original actual whole-table occupied floor-space areas at unique first acceptance; Q_c=Q0 for manufacture and matched original Q_H=Q0 for service/gross/asset accounts. Reconcile every original identity through disjoint net deliveries, all current accepted on-site states, irreversible losses and other terminal dispositions on original acceptance basis. Current shrinkage/repair/return does not reset area or create Q0. Zero or unknown Q_c retains raw totals and no unit result."
      inputs:
        - original_area
        - unique_acceptance_id
        - all_state_history
        - loss_identity
        - original_cohort
        - H
      output: "Q_c"
      source_ids:
        - nsf-tables-2026
        - ilcd-attributional-2010
    - id: calc_quotient
      applies_to: "all non-reference rows"
      rule: "x_i = N_i / Q_c. This is the sole division by the first-release reference denominator, performed after raw unit conversion and the correct single attribution, or using complete actual V_i for gross cards. Cards and aggregation reference this already-calculated result only. Do not divide x_i again or shrink gross physical V; no unit result when Q_c=0."
      inputs:
        - N_i
        - Q_c
      output: "x_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_physical
      applies_to: "manufacturing FG-service and consolidated physical gates"
      rule: "Independently reconcile opening full wet physical stocks plus every real external input with closing full wet stocks plus every real external output and separately evidenced phase/species change. Manufacturing first-release transfer cancels against FG-service reception in the combined gate; do not add it beside FG and G/R. Packaging P/I/ER/S/EO/W and repair-water X bridges remove overlap only from identical other flow terms; real influx retained in closing stock remains. Carbon/element/water closures use independent constraints; one residual cannot determine two unknowns."
      inputs:
        - full_opening_stocks
        - actual_gross_inputs
        - full_closing_stocks
        - actual_gross_outputs
        - independent_phase_species_evidence
      output: "independent_physical_reconciliation"
      source_ids:
        - usda-wood-2021
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "finished_table and every exchange"
      requirement: "Resolve physical whole-product identity and all native material/form/route/grade/geography/media/type/property conditions independently of name or classification. No generic/component substitute for an unresolved core; missing auxiliaries remain specific atoms."
      evidence: "exact native identity and property-unit evidence; actual drawing/BOM; supplier match"
    - id: dq_primary
      applies_to: "source synthesis"
      requirement: "Retain complete applicable primary documents and adjacent contrary routes; distinguish whole product, component, formulation and LCA method evidence. A furniture label or handbook interior section is not a factory recipe or allocation approval."
      evidence: "full sources; application restrictions; actual manufacturer qualification; source-specific applicability"
    - id: dq_measurement
      applies_to: "all raw quantities and Q"
      requirement: "Calibrated geometry and independent complete-table mass/moisture by configuration; real original units; moisture sampling and state-specific density; no inferred default. Record uncertainty/unknowns and failures."
      evidence: "calibration; raw readings; sampling and composition; reconciliation"
    - id: dq_coverage
      applies_to: "entire foreground and upstream ownership"
      requirement: "Capture start/stop/idle/zero-output/cleanup/rework and ordinary waste/treatment; supplier-included packaging; all raw/WIP/FG history and individual inherited vectors; exact single numerator and quotient."
      evidence: "complete period ledgers; upstream owner; source and process coverage; open gaps"
    - id: dq_physical
      applies_to: "manufacture service and combined gates"
      requirement: "Gross mass/element/water and each package six-leg/asset ledger remain complete independent of burden share. Preserve real new inflows and complete closing wet stock; whole and component bridges disjoint."
      evidence: "independent gross closures; separate carbon sources; phase/species constraints; outlet/provider once"
    - id: dq_service
      applies_to: "original-cohort services"
      requirement: "Use actual original Q_H and H with historical FG burden and G/R identities; retain already performed service and all real failed/unauthorized work; acceptance requires manufacturer/spec permission and posttests/disposition."
      evidence: "original release; matched return; actual work and permission; test/hold/waste history"
    - id: dq_public
      applies_to: "completed dataset"
      requirement: "Disclose uncertainty and unresolved source/core/auxiliary/provider/quantity scope honestly; do not claim scientific/translation approval, lifecycle equivalence or classification coverage from engineering checks."
      evidence: "metadata; review state; check coverage; explicit unresolved scope"
validation_rules:
  - rule_id: v_scope
    applies_to: "complete table"
    rule: "Verify actual unjoined maple body, complete clear-finish/glide BOM, principal occasional-table use with secondary functions disclosed, full electric dehumidification and qualified 2K finish route, actual core/shell moisture, defects and whole-table acceptance. Reject hidden bowties/frame joints, components, office/bedroom or purchased-finished shortcuts."
    source_ids:
      - bertu-square
      - bertu-bowties
      - nyle-l53
      - adler-unistar
  - rule_id: v_native
    applies_to: "reference and every selected flow"
    rule: "Require real compatible identity, exact referenced property→unit group→reference unit and all native physical/geographic/media/type limits. Names, CPC, schema and finite measurement success alone cannot resolve a core identity hold. Keep unavailable content unavailable; uncertain physical presence is not zero."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_q
    applies_to: "finished_table and all inventory rows"
    rule: "Check same bilingual first-release Q, actual whole-table floor-space outline area and unique output link. Do not count shipment/reinspection/return as production, deduct released closing FG from manufacturing, divide twice or produce a unit result at Q_c=0. Independent net table mass/moisture is required for any mass/count conversion."
    source_ids:
      - bertu-square
      - usda-wood-2021
  - rule_id: v_raw
    applies_to: "all records"
    rule: "Confirm undivided raw collection, original unit/rate conversion before real attribution, exactly one applicable numerator and one quotient. Every real input/output is atomic and dimension-specific; no blanket Mass/kg for MJ/h/t*km."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_stocks
    applies_to: "manufacturing service packaging assets"
    rule: "Check all inherited vectors and independent full gross ledgers, ordinary losses/treatment retained, actual T_other justification, first-release cancellation and complete six legs. No closing-stock cancellation of new repair/material/water influx, economic shrinking of physical legs, or repeated stock correction. Already performed original service survives FG storage."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_species
    applies_to: "wood water air and waste"
    rule: "Independently check physical mass, relevant elements, biogenic/fossil/ambient carbon, actual phase/species and water states. No molecular identity from aggregate VOC/PM/COD/total-N, or one residual solving two unknowns. No total plus overlapping component exchanges, dry-air aggregate plus species, or duplicate mixed-waste/provider treatment."
    source_ids:
      - usda-wood-2021
      - adler-unistar
  - rule_id: v_release_work
    applies_to: "actual post-release work"
    rule: "Verify actual permission, postwork tests and acceptance/disposition for conformity; collect and retain actual unauthorized/failed/held operations and physical changes regardless. Natural humidity exchange has no invented work permission. Do not assume breakage restoration."
    source_ids:
      - bertu-square
      - ilcd-attributional-2010
  - rule_id: v_allocation
    applies_to: "shared burden"
    rule: "Independently audit dedicated/virtual subdivision then exchange-specific determining physical causality then genuinely residual common-gate values; reject arbitrary ratios, automatic coproduct credits and sold-waste burden deletion."
    source_ids:
      - ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Completed evidence-bound full single-trunk maple stump-table manufacture and separately identified actual original-cohort factory-gate services of the stated configuration"
  excluded_use: "Universal furniture or performance equivalence; whole-leaf classification coverage; unreviewed other principal routes; use lifetime; automatic credits; unconfirmed core identity or zero-burden supplier inputs"
  required_metadata: "All section 3 qualifiers; actual whole-table floor-space geometry and net whole mass/moisture; first cohort Q and service Q_H/H; native/provider restrictions; original units; full supply/stock/ownership lineage"
  required_quality_disclosure: "Actual source synthesis limits; sampling/uncertainty; failed and zero-output loads; unresolved core/auxiliary/provider/quantity/speciation; actual allocation and independent physical checks; acceptance and review state"
  update_trigger: "Changed core identity/configuration/geometry/BOM/species/supply gate/kiln/refrigerant/finish; new actual atom/provider; real test, stock, service, allocation or independent evidence change"
data_sources:
  - id: "un-cpc3-38141"
