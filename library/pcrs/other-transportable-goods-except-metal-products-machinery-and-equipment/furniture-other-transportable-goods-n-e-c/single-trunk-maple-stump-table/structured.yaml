ther purchase. Gross numerator is actual full V_i; it is not A_i, B_open+U-B_close or an economic share. No procurement, supplier burden or credit is generated; any real burden has a separate single owner. | `ilcd-attributional-2010`; `bertu-square` |\n| b_collection_context | all collection records | The protocols collect raw, undivided records in original units. Their aggregation labels identify the final common reference basis only; they never calculate a second quotient. Cells and vectors retain row id, physical event, stock pool, cohort, manufacturing/service dimension, upstream owner, actual presence and uncertainty. Factory quantities remain to be measured; no representative bill, source factor or successful software check fills a real unknown. | `ilcd-attributional-2010` |\n| b_moisture_sampling | thick-trunk moisture/acceptance | For large wood items take representative cross-section sectors or subdivided increment-borer/auger samples with documented core/shell coverage; immediately weigh or protect samples against moisture change until weighing. Use an applicable documented oven-dry constant-mass reference procedure, with independently assessed volatile-extractive bias rather than treating all mass loss as water. Electrical meters require actual species/temperature/electrode calibration; a shallow or pinless reading dominated by surface layers cannot establish thick-trunk core moisture. Preserve observed gradients, sampling damage and every sampled/rejected body in physical and acceptance ledgers. Source lumber dimensions, temperatures, schedules, moisture recommendations and typical durations are not universal trunk settings. Thick timbers may remain internally wet and shrink later; kiln treatment and a coated appearance alone do not establish complete drying or acceptance. | `usda-wood-2021`; `nyle-l53`; `nyle-timbers`; `bertu-square` |\n| b_waste_interfaces | all waste/provider/cohort interfaces | For every actual whole waste export retain the full raw physical transfer Qt once, including substrate, retained preparation/solids, contaminants and water, plus the actual receiver and total fulfilled provider demand. Nested component measurements are not extra waste exports or extra treatment. Keep this physical event and full provider total distinct from nonoverlapping attributed exchange/service vectors A_i for each original cohort and its A_i/Q0. A physical-only gross disclosure uses V_i and creates no second procurement/characterization/treatment charge; an attributed model exchange must retain its full-event Qt provenance and never relabel A_i as a reduced physical transfer. Shared-event allocations must sum to the one real provider total over their declared nonoverlapping scope; missing assignment stays unresolved. Never charge the whole event anew to each cohort, shrink the actual receiver mass by an economic share, or add a full provider aggregate beside its expanded treatment history. | `ilcd-attributional-2010` |\n\n\n"
