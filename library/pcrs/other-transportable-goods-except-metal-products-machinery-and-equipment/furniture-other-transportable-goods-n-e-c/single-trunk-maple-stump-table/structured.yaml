    - rule_id: b_inventory_finished_table
      applies_to: "finished_table"
      rule: "One complete single-trunk maple stump table with its one unjoined wooden body, complete clear finish, nylon glides and all actual fixings, inspected at unique first acceptance. Area/m2 represents actual whole-table physical floor-space area of the complete table. It is not a purchased component, joined body, cabinet, office kit or substitute purchased finished table. Measure configuration-specific geometry and independent net whole mass/moisture. The linked reference is the sole first-release output; closing released FG already belongs to Q. This internal transfer cancels against service reception in consolidated gross physical balances, never adds beside closing FG and gross shipment."
