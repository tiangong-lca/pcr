  - id: "bertu-square"
    type: "literature"
    reference: "Bertu Home, Tree Stump Tables - Square - 1218, complete manufacturer product page and Important Information; HTML snapshot 2026-11-08; https://bertuhome.com/products/tree-stump-tables-square-1218"
    used_for: "Whole single-maple-trunk table, rough-cut/debarking/kiln/sanding/spray route, actual nylon glides and table/stool/grouped-coffee-table uses; all size/cracking/humidity/unpack/refinish and colour alternatives retained. Heat source and sealant recipe undisclosed; no mass, dimension, schedule, yield, certification, lifetime or environmental-claim default."
  - id: "bertu-bowties"
    type: "literature"
    reference: "Bertu Home, Natural Wood Side Table - Quick Ship, complete manufacturer product page; HTML snapshot 2026-11-08; https://bertuhome.com/products/natural-wood-side-table-quick-ship"
    used_for: "Independent product variant counterevidence within the same manufacturer: added bowties explicitly contrast with the unjoined regular version; retain actual multiple uses, feet, cracks and all adjoining conditions. Not another independent manufacturer or a joint permitted in this scope."
  - id: "nsf-tables-2026"
    type: "official_guidance"
    reference: "NSF 1120-26 BIFMA Tables, Sub-category PCR UNCPC 3812, v2.0 July 2026, scope print p.1, §7.1.2 print p.10 and full figure, §7.1.3 print pp.10–13; https://d2evkimvhatqav.cloudfront.net/documents/PCR-Product-Category-Rules/NSF-1120-26.pdf"
