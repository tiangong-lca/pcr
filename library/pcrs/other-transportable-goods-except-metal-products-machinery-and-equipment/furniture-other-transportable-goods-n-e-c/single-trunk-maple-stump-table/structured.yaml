    - rule_id: b_collection_context
      applies_to: "all collection records"
      rule: "The protocols collect raw, undivided records in original units. Their aggregation labels identify the final common reference basis only; they never calculate a second quotient. Cells and vectors retain row id, physical event, stock pool, cohort, manufacturing/service dimension, upstream owner, actual presence and uncertainty. Factory quantities remain to be measured; no representative bill, source factor or successful software check fills a real unknown."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: b_moisture_sampling
      applies_to: "thick-trunk moisture/acceptance"
      rule: "For large wood items take representative cross-section sectors or subdivided increment-borer/auger samples with documented core/shell coverage; immediately weigh or protect samples against moisture change until weighing. Use an applicable documented oven-dry constant-mass reference procedure, with independently assessed volatile-extractive bias rather than treating all mass loss as water. Electrical meters require actual species/temperature/electrode calibration; a shallow or pinless reading dominated by surface layers cannot establish thick-trunk core moisture. Preserve observed gradients, sampling damage and every sampled/rejected body in physical and acceptance ledgers. Source lumber dimensions, temperatures, schedules, moisture recommendations and typical durations are not universal trunk settings. Thick timbers may remain internally wet and shrink later; kiln treatment and a coated appearance alone do not establish complete drying or acceptance."
      source_ids:
        - usda-wood-2021
        - nyle-l53
        - nyle-timbers
        - bertu-square
    - rule_id: b_waste_interfaces
      applies_to: "all waste/provider/cohort interfaces"
      rule: "For every actual whole waste export retain the full raw physical transfer Qt once, including substrate, retained preparation/solids, contaminants and water, plus the actual receiver and total fulfilled provider demand. Nested component measurements are not extra waste exports or extra treatment. Keep this physical event and full provider total distinct from nonoverlapping attributed exchange/service vectors A_i for each original cohort and its A_i/Q0. A physical-only gross disclosure uses V_i and creates no second procurement/characterization/treatment charge; an attributed model exchange must retain its full-event Qt provenance and never relabel A_i as a reduced physical transfer. Shared-event allocations must sum to the one real provider total over their declared nonoverlapping scope; missing assignment stays unresolved. Never charge the whole event anew to each cohort, shrink the actual receiver mass by an economic share, or add a full provider aggregate beside its expanded treatment history."
      source_ids:
        - ilcd-attributional-2010
boundary_abstraction:
  declared_starting_condition: "Actual rough-cut untreated maple trunk section, with bark and moisture declared; separately supplied whole preparations/articles and external utilities; onsite debarking and kiln drying remain included"
  starting_condition_role: "secondary_manufacturing"
  product_classification_scope: "Actual occasional-table subset of CPC 3.0:38141; one unjoined maple body plus nonstructural feet and clear finish; all real secondary functions disclosed"
  recursive_input_rule: "Purchased finished tables remain separately burden-bearing inputs; they cannot replace this manufacture or create another first acceptance. Internal transfers cancel once."
  upstream_dataset_requirement: "Actual forestry/felling/log preparation and every supplied preparation/article/utility producer once with matching gate, species/form/state, geography/time, transport and included packaging; real controlled subcontract processing is linked completely or expanded mutually exclusively"
  disclosure: "Full receipt-to-acceptance operations including kiln; actual electrical/refrigerant/condensate interfaces; physical stocks and original cohorts; native/provider restrictions; losses/waste/treatment; source synthesis and unresolved scope"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Solid Wood Furniture"
    uuid: "0503738b-a582-4603-8b77-4cb0981857ed"
  flow_property_ref:
    uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
  unit_group_ref:
    uuid: "93a60a57-a3c8-18da-a746-0800200c9a66"
  reference_unit: "m2"
  required_qualifiers:
    - "complete table configuration and drawing/BOM revision"
    - "principal occasional-table use and every actual secondary function"
    - "single unjoined maple trunk body and actual species/legal origin"
    - "actual received section and bark/moisture"
    - "full onsite and subcontract cutting/debarking/kiln history"
    - "electric dehumidification equipment/refrigerant and real auxiliary heat"
    - "section-specific drying schedule and independent surface/core moisture"
    - "qualified clear coating base and crosslinker with actual application/cleanup"
    - "actual nylon glides and fixing composition"
    - "actual whole-product floor-space geometry"
    - "independently calibrated net whole mass and moisture"
    - "unique first acceptance and original Q0"
    - "complete raw/WIP/FG states losses and inherited burdens"
    - "each actual native material/route/state/geography/type/property restriction"
    - "actual packaging six directions and one upstream owner"
    - "actual equipment fleet and fulfilled service"
    - "actual air/species/condensate/waste interfaces"
    - "original service horizon and cohort"
    - "real rework permission tests and dispositions"
    - "allocation evidence and unresolved identities"
reference_flows:
  []
measurement_rules:
  - id: reference_area
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Q0 is the sum of actual whole-table occupied floor-space area at unique first acceptance using cp_release; preserve original item areas through all later states. Manufacturing Q=Q0 and service original Q_H=Q0."
  - id: geometry_mass
    applies_to: "finished_table; maple_log"
    required_property_ref:
      name: "Actual geometry and independently measured mass"
      uuid: ""
    required_unit: "m2; kg"
    rule: "Measure full floor-space outline and net complete-product mass independently by actual configuration/state; retain calibration, bark and surface/core moisture evidence. No nominal density, catalogue size or inferred mass."
  - id: extensive_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual native extensive property"
      uuid: ""
    required_unit: "row unit"
    rule: "Preserve mass kg, actual electrical energy MJ, transport t*km and actual service units. Convert real kWh by 3.6 once; integrate only a true rate, never a cumulative quantity twice."
  - id: moisture
    applies_to: "wood and every wet stock"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For wood alone u=(wet-dry)/dry and dry=wet/(1+u); use representative independent moisture measurements, including core/shell gradients. Whole supplied formulations/outlets contain their carrier/retained water once; phases and reaction water need independent evidence."
  - id: gross_events
    applies_to: "all gross physical cards"
    required_property_ref:
      name: "Actual physical quantity"
      uuid: ""
    required_unit: "row unit"
    rule: "Preserve each complete physical leg V_i and full raw/WIP/FG/asset/container wet stocks separately from burden vector A_i; economic attribution never shrinks physical exports or provider receipt."
process_map:
  - id: plant
    name: "Complete table manufacture and separately tagged original-cohort services"
    inclusion: "required"
    inclusion_condition: "Complete rough-log, debarking and electric-dehumidification-kiln route and real service horizon; every account/cell retains its cohort"
    role: "foreground"
    quantitative_reference: "Q for manufacture; original Q_H for service; one complete-table reference"
  - id: packaging
    name: "Actual per-article six-direction gross packaging and separate charges"
    inclusion: "conditional"
    inclusion_condition: "Each real packaging article and event; absence evidenced"
    role: "foreground"
    quantitative_reference: "Original cohort Q_H; no new table output"
  - id: assets
    name: "Actual equipment physical holdings and fulfilled service"
    inclusion: "conditional"
    inclusion_condition: "Actual asset events/service; no assumed replacement schedule"
    role: "foreground"
    quantitative_reference: "Manufacturing Q or matched original service Q_H"
