      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| a_framework | attributional process system | Apply this hierarchy only to an attributional study whose decision context requires allocation; do not borrow consequential avoided-product substitution. Separate actual multifunctional processes from multifunctional product comparisons. No fixed product/waste share or arbitrary physical-versus-economic choice. | `ilcd-attributional-2010` |\n| a_subdivide | each exchange and cofunction | First collect dedicated operations separately and assign exclusive materials, parts, tests, treatment and services to their real cohort/function. Use evidenced virtual subdivision where exact technology relationships separate an exchange. A whole supplied formulation remains purchased once; assayed constituents are not extra inputs. Do not allocate away ordinary rejects, zero-output/startup loads or their actual treatment merely because they leave the gate. | `ilcd-attributional-2010` |\n| a_causality | genuinely shared remainder | For each remaining exchange independently determine the physical relation that causes its existence and quantity. Document the causal test and alternatives: actual machining/spray duty, material embodiment, timed use or limiting transport function may differ by exchange. Mass, area, time or item count alone is not causality. Keep physical gross flow/stock quantities complete regardless of burden share. | `ilcd-attributional-2010` |\n| a_residual | unresolved common-process burden | Only after subdivision and determining physical causality genuinely fail, use actual contemporaneous market values at the common process gate in the actual condition and amount. Reconcile downstream transport, packaging and conditioning to that gate; justify price source, period, currency, stability and sensitivity. Missing/zero/negative or nontraded values require resolution and disclosed uncertainty, not a convenient fixed ratio or invented price. This is a process allocation rule, not a functional-equivalence/QFD shortcut. | `ilcd-attributional-2010` |\n| a_waste | actual residue and secondary outlet | Offcuts, sawdust, mixed waste, failed tables, samples and scrap sales retain manufacturing and treatment burdens unless there is a real distinct cofunction/cohort and justified one-time allocation/handover. Keep the full physical outlet even then. No automatic coproduct, negative treatment, displaced wood/energy, upstream forest uptake or recycling credit; assess any genuine recovery system separately with its actual provider and methodological boundary. | `ilcd-attributional-2010` |\n| a_service | assets and original-cohort services | Separate full physical equipment/package holdings from actual fulfilled service. Match original Q_H and horizon H, capacity/utilization and any actual other function before assigning burden. A stored finished table does not undo service already performed. Retain historical original-cohort vectors; do not repurchase returns or cancel new repair/water influx against closing wet stock. | `ilcd-attributional-2010` |\n\n"
