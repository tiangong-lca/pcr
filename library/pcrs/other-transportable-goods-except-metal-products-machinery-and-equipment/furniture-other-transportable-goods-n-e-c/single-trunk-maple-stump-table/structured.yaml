    used_for: "Actual electric dehumidification/compressor/auxiliary-heat/vent/condensate interfaces, controls/sampling, RS-24 system, coil cleaning and charge/recovery maintenance. Technology synthesis only; not evidence Bertu uses this model. Lumber thickness/schedules/rates/energy/settings/charge are not transferred to thick maple trunk; select actual compatible equipment and qualify the section-specific cycle."
  - id: "nyle-timbers"
    type: "literature"
    reference: "Nyle, How Nyle Perfects Drying Poles & Timbers, complete 2-page info sheet Rev2024.01 (footer labels Softwood Drying Info Sheet); https://nyledrykilns.com/wp-content/uploads/2025/01/NDK-Poles-Timbers-Drying-Info-Sheets-Rev-2024.01.pdf"
    used_for: "Large/dense-section moisture gradients, long drying, checking and explicit dehumidification versus gas/hybrid alternatives. Qualitative technology applicability and contrary options only; construction/pole end uses, marketing improvements, unspecified species and schedules establish neither maple-table acceptance nor any rate, efficiency or environmental benefit."
  - id: "rs24-sds"
    type: "handbook"
    reference: "Refrigerant Solutions Limited, RS-24 (R426A) Product Safety Data Sheet, Revision4, 1 February 2025, complete7pp., §§1/3/5/9/10/13; https://www.refsols.com/files/RS-24/RS-24_Safety_Data_MSDS.pdf"
    used_for: "Whole mixture identifies HFC134a/HFC125/n-butane/isopentane; system maintenance/actual emissions and recovery are independent. No nominal composition assigned to unknown/fractionated leakage, no leak/default charge, no safety or environmental superiority claim; thermal-decomposition hazards are not presumed normal-operation emissions."
  - id: "adler-unistar"
    type: "handbook"
    reference: "ADLER Bluefin Unistar2965 TDS, 4-0 IMC2965 09/26, complete5pp.; https://www.adler-lacke.com/Canto/tmb/bluefin-unistar_tmb_2965_en.pdf"
    used_for: "Whole clear waterborne coating base and separately supplied8481 for the actual qualified2K tabletop route, substrate tests, airless spray, sanding/drying/cleanup;1K normal-stress alternative retained as excluded route. No same-factory/SKU assertion, ratio/spread/dose/time/setting, zero emission, layer count, certification or test-value default."
  - id: "adler-crosslinker"
    type: "handbook"
    reference: "ADLER Aqua-Crosslinker8481 TDS,1-0 IMC8481 11/24, complete2pp.; https://www.adler-lacke.com/Canto/tmb/aqua-crosslinker-8481_tmb_8481_en.pdf"
    used_for: "Whole isocyanate-free crosslinker preparation and compatibility governed by actual base instructions; no pure CAS, structure, reaction-water yield, dose, or automatic permission for unqualified maple substrate."
  - id: "usda-wood-2021"
    type: "handbook"
    reference: "USDA FPL, Wood handbook—wood as an engineering material,FPL-GTR-282(2021), complete handbook; ch.4 moisture and ch.13 core/sample/oven-dry moisture,drying physics/defects/dry-kiln types, especially print13-1–13-2,13-6–13-14; ch.16 factory-finishing exclusion; https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Independent moisture measurement and core/shell gradient, hygroscopic exchange, dry-basis conversion, kiln physics/types and defects. Lumber schedules and handbook examples do not qualify a trunk or supply density, time, moisture target or mass. Chapter16 expressly excludes factory furniture finishing; it is no furniture-sealant recipe."
  - id: "ilcd-attributional-2010"
    type: "official_guidance"
    reference: "EC JRC,ILCD General guide—Detailed guidance,first edition March2010,§§7.9.2–7.9.3,PDFpp.275–288 and adjacent scope/error/service context; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision/virtual subdivision, exchange-specific determining physical causality and genuinely residual common-gate actual market values; physical exchanges versus service/capital burdens. No fixed allocation share, waste-sale credit, consequential substitution or furniture recipe."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:5a49dd492419e10f1e1f5c1c98dcadbdc84334ff8d6804aed82dded34c396140"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_11964"
      family: "system_boundary"
      span:
        start:
          offset: 11964
          line: 69
          column: 1
        end:
          offset: 158753
          line: 253
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual rough-cut untreated maple trunk section, with bark and moisture declared; separately supplied whole preparations/articles and external utilities; onsite debarking and kiln drying remain included |\n| starting_condition_role | secondary_manufacturing |\n| product_classification_scope | Actual occasional-table subset of CPC 3.0:38141; one unjoined maple body plus nonstructural feet and clear finish; all real secondary functions disclosed |\n| recursive_input_rule | Purchased finished tables remain separately burden-bearing inputs; they cannot replace this manufacture or create another first acceptance. Internal transfers cancel once. |\n| upstream_dataset_requirement | Actual forestry/felling/log preparation and every supplied preparation/article/utility producer once with matching gate, species/form/state, geography/time, transport and included packaging; real controlled subcontract processing is linked completely or expanded mutually exclusively |\n| disclosure | Full receipt-to-acceptance operations including kiln; actual electrical/refrigerant/condensate interfaces; physical stocks and original cohorts; native/provider restrictions; losses/waste/treatment; source synthesis and unresolved scope |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| b_route | complete product system | Include real rough-log selection/cutting/debarking, conditioning, electric dehumidification kiln and auxiliary electric heating, shaping, sanding, 2K mixing/spray/drying, feet/fixings, tests, extraction/cleanup/transport and every rejected, idle, startup or zero-output load. No outsourced kiln, waste sale, unfinished stock or whole purchased table hides a real producer or operation. Real linked complete producers and expanded foreground are mutually exclusive per same history. | `bertu-square`; `nyle-l53`; `nyle-timbers`; `adler-unistar` |\n| b_admission | every declared table configuration | Preserve the complete applicability and native-admission conditions from sections 1 and 3: actual single unjoined maple trunk body; entire clear sealant/nylon-glide BOM; principal occasional-table use together with disclosed stool/coffee-table alternatives; actual crack/size/humidity condition and acceptance; exclude bowties, structural joints, veneer/panels and other principal routes. Native single-piece/sealed description positively fits this body and does not forbid actual ancillary feet; engineered/veneered synonyms are contrary-family metadata, never permission for a joined route. Names or CPC alone are insufficient. | `bertu-square`; `bertu-bowties` |\n| b_synthesis | production route and evidence | Bertu establishes the whole one-trunk table and kiln/spray operations but identifies neither its heat source nor finish recipe. The electric-dehumidification and qualified clear-waterborne-2K route is an explicit synthesis of independent technical sources, not a claim about Bertu equipment/SKU/recipe. Nyle/USDA support drying physics and large-section difficulty; neither a lumber schedule nor marketing reduced-cracking claim demonstrates a thick maple block's actual core moisture or acceptance. Require actual section-specific schedule, independent surface/core sampling, defects and drying/finish compatibility evidence, with no fixed moisture, time, energy, dose, yield, lifetime or mass. Other principal kiln/finish routes require new assessment. | `bertu-square`; `nyle-l53`; `nyle-timbers`; `usda-wood-2021`; `adler-unistar`; `adler-crosslinker` |\n| b_area | full product and first acceptance | Preserve the complete area convention and limitations of section 3: actual aerial outer perimeter of the complete table including projecting feet/fixings extended to the floor; true rectangular envelope only when proven, otherwise measured outline/planimetry. Never coated area, bare tabletop, foot contact, multiple faces or assumed nominal square. NSF office-table methodology and Cosi whole side-table case support only this geometric convention; no office classification, compliance, EPD comparability, lifecycle boundary, mass, unit count or ten-year life is imported into the nonoffice manufacture/acceptance method. | `nsf-tables-2026`; `cosi-whole-table`; `bertu-square` |\n| b_gate | original acceptance cohort and all later states | Q0 sums each item's actual first-acceptance floor space once and retains that original area through shipment, return, shrinkage, hold, damage, repair, samples and final disposal. Reconcile all original identities through disjoint net deliveries, every actual on-site accepted state, irreversible losses and other terminal exits; no missing states, new Q on loops, or physical-loss restoration plus duplicate loss. Actual current wet mass/geometry and environmental loads remain independent of original-area accounting. Q=Q0 for manufacture and original Q_H=Q0 for service; zero/unknown basis retains raw totals without a unit result. | `ilcd-attributional-2010`; `nsf-tables-2026` |\n| b_scope_full_context | full applicability context | This attributional method covers complete indoor occasional stump tables whose load-bearing body is one unjoined maple trunk section, shaped as a square-section block, with a qualified clear sealant finish and actual nonstructural nylon floor glides. Receive the actual rough-cut maple section; retain all real cutting, debarking, conditioning and kiln drying; shape and sand the same body; mix and spray the qualified clear waterborne two-component furniture coating; dry and sand as required; fit the actual glides and their actual fixings; inspect the complete table and record its unique first acceptance. The reference product includes the whole wooden body, finish, glides and all actual BOM accessories. A log, board, tabletop, seat component or purchased finished table is not this manufacture. Bertu Home's Square 1218 is positive physical evidence: it is sold as a stump table under Stumps & Side Tables, is made from a solid rough-cut maple trunk, and is hand-cut, debarked, kiln-dried, sanded and sprayed; the complete article has nylon glides. The same source explicitly permits use as a stool or grouping as a coffee table, reports size variation, cracking, humidity movement and later refinishing, and offers pigmented colours. These facts remain part of applicability. Admit this table method only for an actual declared occasional-table configuration and use; an exclusively seating, office or bedroom study needs its own applicability decision. Do not pretend that a multipurpose article has only one possible function. The related quick-ship bowtie product explicitly adds joints to limit cracking; that joined construction is excluded. Sources: `bertu-square`; `bertu-bowties`. This is a transparent technical synthesis, not an assertion that the cited manufacturers share a SKU, plant or recipe. Bertu supplies the complete physical terminal and manufacturing operations, but does not identify its kiln heat source or sealant formulation. This selected route uses an electric dehumidification kiln with real electric auxiliary heat, documented refrigerant system and condensate/vent interfaces, and qualified two-component clear waterborne furniture coating. USDA and Nyle document the drying technology and large-section drying difficulties; ADLER documents the selected finishing technology. No Nyle lumber schedule is transferred to a thick trunk. Retain actual species/section-specific drying schedule, independent surface/core moisture and drying-defect tests, coating-substrate permission and finished-table acceptance. Ordinary source examples of dimensions, price, time, moisture, load, formulation ratio, spread, energy, mass and lifetime are not defaults. Natural, black and whitewash are not interchangeable coating recipes. Exclude multi-member glued or veneered bodies, panels, bowtie repairs, separate structural legs/frames, seats supplied solely for seating, cabinets, office desks, bedroom furniture, components, customer-assembly kits, resin-filled cracks, pigmented/burnt/oil/UV/solvent-borne principal finishing, onsite fuel combustion, gas-fired or steam/hot-water drying, purchased finished-table repacking and hidden outsourced processing. Other actual principal routes require an independent applicability review and full actual atomic inventory. Natural cracking is not a zero-loss assumption or evidence that any damaged body passes. Packing, storage, handling, shipment, returns and actual post-acceptance work remain separately observed original-cohort services. Upstream forest/log preparation, every supplied article and external utility retain their real producer burdens once. | `bertu-square`; `bertu-bowties`; `nyle-l53`; `nyle-timbers`; `usda-wood-2021`; `adler-unistar`; `adler-crosslinker` |\n| b_reference_full_context | full reference/native/area/cohort context | Declare all qualifiers in dataset metadata or equivalent fields. The native family describes one piece of wood that is sanded, shaped and sealed; its additional engineered/veneer synonyms and marketing discussion do not authorize panels, veneer or hidden joints. This scope positively matches the single solid body, while retaining the real auxiliary nylon feet and sealant; it does not impose chemical-purity or hardware-free conditions that the family does not state. Its reference is Area, not Mass. It supplies no provider quantity, drying/coating recipe or environmental advantage. The area convention is the complete product's occupied floor space: its actual aerial outer perimeter, including any projecting glides/fixings, extended to the floor. It is neither coated surface nor a tabletop component nor the sum of small foot-contact patches. Measure maximum physical width and length only where the actual occupied outer envelope is demonstrably rectangular; otherwise retain calibrated aerial outline/planimetry of the full exterior perimeter and all protrusions. Do not import a catalogue dimension, assume a perfect square despite cracking, or count multiple surface faces. NSF Tables provides a clear whole-table floor-space convention and an occasional-table category; it is an office-furniture EPD method with additional life-cycle and service rules. Cosi independently demonstrates a complete side table including its glide on an area basis. Only the geometric normalization convention is adopted here, with the nonoffice and first-acceptance limits explicit: no NSF compliance, office classification, EPD equivalence, ten-year life, product mass or pieces-per-square-metre is transferred. Sources: `nsf-tables-2026`; `cosi-whole-table`. Q0 is the sum of each complete table's independently measured floor-space area at its unique first acceptance. Lock that original area to the item/cohort. Later moisture loss, damage, shrinkage, return, rework or disposal changes physical state, never the historic acceptance event. Partition all initially accepted identities into disjoint net remaining deliveries, every actual on-site accepted state (including stored, held, sample, damaged, rework and returned items), irreversible losses and other terminal dispositions on original acceptance-area basis. Every physical item belongs once; internal loops and reversible returns create no new Q0. A simplified deliveries-plus-FG bridge is valid only when all other postgate states/exits are proven absent. Actual current geometry/mass and physical losses are independent ledgers; do not restore lost water/material to a survivor and also count the loss. Service uses original cohort Q0 even when all items are gone. Zero or unknown Q0 retains raw totals and an unresolved unit result. Independently measured net whole mass/moisture is required for any separately reported kg/m2 bridge; no invented machine or table weight. | `nsf-tables-2026`; `cosi-whole-table`; `bertu-square`; `ilcd-attributional-2010` |\n| b_history | all inventory rows | Keep opening and closing physical raw/WIP/FG/residue/reusable/installed stocks and a distinct inherited vector per exchange and cohort. Apply stock reconciliation once; never subtract stock-corrected consumption again. Ordinary failed products, samples, wastes, sale or external removal are not T_other. Only a true other cohort/function with a justified allocation/handover can receive one burden vector once. | `ilcd-attributional-2010` |\n| b_packages | each packaging pool | For each actual whole article: opening empty+attached WIP+attached FG+reusable + P+I+ER + X_in = closing equivalent full wet stocks + S+EO+W + X_out. P new purchase; I supplier-included ingress; ER external return received; S leaves with gross physical shipment; EO external return sent; W waste. Keep six event cards conditional on real events, each full wet quantity. Internal reuse cancels; no new product Q, repurchase or credit. Whole article and component bridges are disjoint. Deduplicate packaging/repair/water X legs only against the identical other incoming/outgoing flow; closing retention never erases influx. A single mixed waste outlet is one Waste exchange, with component-pool W subledgers rather than additive duplicate outlets. X_in/X_out are independently measured actual separate added/removed components or water not already included in OTHER flow terms on the SAME side. Deduplicate only the identical event already included in another same-side incoming/outgoing term, never opening/closing stock, opposite directions or merely an existing atomic card. A whole wet P/I/ER receipt already contains its own components/water once; a real separately added retained input keeps BOTH its influx and complete wet closing mass. Unknown occurrence/species/amount is not zero; no repair, dry wood or extra water is presumed. | `ilcd-attributional-2010` |\n| b_water_carbon | all physical gates | Independently reconcile whole wet mass, relevant elements, wo