        - bertu-square
    - rule_id: b_inventory_tap_water
      applies_to: "tap_water"
      rule: "Actual treated municipal liquid water supplied at plant/to consumer, including its water-supply burden once. Native Product refers to filtration/sedimentation/disinfection and locally variable potable supply, not deionized water, natural-water resource, steam or wastewater. Native reference is Mass/kg; its secondary Volume coefficient is not an independently measured actual density. Independently meter/weigh the real substance/state; collect added cleaning/mixing/maintenance water by event and retain full closing wet stock. Included glue/coating carrier water is not another supply. Natural humidity is a separate elementary leg. Quantity linkage: record raw units and cohort first; convert once, reconcile the appropriate manufacturing/service/asset burden account once, and take x_i from the sole quotient. Physical gross legs stay complete and separately reconciled."
      source_ids:
        - ilcd-attributional-2010
        - adler-unistar
        - usda-wood-2021
    - rule_id: b_inventory_cleaner_aqua
      applies_to: "cleaner_aqua"
      rule: "Only if actually used for dried coating residues; procure the whole concentrate once and separately record real added dilution water. No assumed pure active component or dilution ratio. Quantity linkage: record raw units and cohort first; convert once, reconcile the appropriate manufacturing/service/asset burden account once, and take x_i from the sole quotient. Physical gross legs stay complete and separately reconciled."
      source_ids:
        - adler-unistar
    - rule_id: b_inventory_cleaner_line
      applies_to: "cleaner_line"
      rule: "Only if actually used on conveyor belts/material lines; its supplied whole formulation is independent of 8029 and not another name for water. Retain SDS, added water and loss separately. Quantity linkage: record raw units and cohort first; convert once, reconcile the appropriate manufacturing/service/asset burden account once, and take x_i from the sole quotient. Physical gross legs stay complete and separately reconciled."
      source_ids:
