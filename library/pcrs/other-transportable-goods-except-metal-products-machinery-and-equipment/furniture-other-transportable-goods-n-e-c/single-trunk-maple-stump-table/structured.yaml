      rule: "For the documented RS-24 dehumidification configuration, measure actual whole purchased make-up, recovery/transfer and full installed opening/closing charge; initial charge included in the equipment is not bought again. The mixture is one supplied product, not four extra purchases. Manufacturer SDS identifies HFC-134a, HFC-125, n-butane and isopentane, but actual leaked composition may differ through fractionation; never multiply an unknown leak by a nominal fresh-charge recipe. Use cp_kiln and cp_maintenance with a disjoint charge/component bridge. Another permitted refrigerant needs its own atomic cards and actual approval before admission; unknown is not absent."
      source_ids:
        - nyle-l53
        - rs24-sds
    - rule_id: b_inventory_compressor_oil
      applies_to: "compressor_oil"
      rule: "Only actual separately supplied compatible whole lubricant; record composition, permission, added/removed quantities and full installed wet stocks. Oil included in acquired equipment or a service provider is not procured again. Retain contamination and real disposal/recovery, without presuming a mineral/POE grade, change interval or zero leak."
      source_ids:
        - nyle-l53
    - rule_id: b_inventory_cotton_wipe
      applies_to: "cotton_wipe"
      rule: "Conditional actual cleaning wipe, not a generic maintenance basket. Keep new/used physical fleet, wet stocks, real washing/cleaner inputs and service history separately. Source actual mass and composition; no assumed life or one cloth per table. Retained coating/cleaner/water remains within the complete contaminated article after use, not fictional separate exports."
      source_ids:
        - adler-unistar
        - ilcd-attributional-2010
    - rule_id: b_inventory_kiln_detergent
      applies_to: "kiln_detergent"
      rule: "Nyle specifies dish soap and water for dirty evaporator coils; retain the actual complete supplied preparation, composition, cleaning event and effluent. This is not neat surfactant, a fixed dose, universal formulation or an assumption that cleaning happened. Separate real added water once from water already in the whole preparation."
      source_ids:
        - nyle-l53
    - rule_id: b_inventory_kiln_condensate_treatment
      applies_to: "kiln_condensate_treatment"
      rule: "Link the actual receiver and its complete fulfilled treatment demand once using compatible provider units and real physical transfer/composition. The outgoing whole waste mass remains full and independent of the attributed service/burden vector for each nonoverlapping original cohort. Provider aggregate and expanded treatment history are mutually exclusive. No assumed treatment, unit conversion or credit."
