          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| v_scope | complete table | Verify actual unjoined maple body, complete clear-finish/glide BOM, principal occasional-table use with secondary functions disclosed, full electric dehumidification and qualified 2K finish route, actual core/shell moisture, defects and whole-table acceptance. Reject hidden bowties/frame joints, components, office/bedroom or purchased-finished shortcuts. | `bertu-square`; `bertu-bowties`; `nyle-l53`; `adler-unistar` |\n| v_native | reference and every selected flow | Require real compatible identity, exact referenced property→unit group→reference unit and all native physical/geographic/media/type limits. Names, CPC, schema and finite measurement success alone cannot resolve a core identity hold. Keep unavailable content unavailable; uncertain physical presence is not zero. | `ilcd-attributional-2010` |\n| v_q | finished_table and all inventory rows | Check same bilingual first-release Q, actual whole-table floor-space outline area and unique output link. Do not count shipment/reinspection/return as production, deduct released closing FG from manufacturing, divide twice or produce a unit result at Q_c=0. Independent net table mass/moisture is required for any mass/count conversion. | `bertu-square`; `usda-wood-2021` |\n| v_raw | all records | Confirm undivided raw collection, original unit/rate conversion before real attribution, exactly one applicable numerator and one quotient. Every real input/output is atomic and dimension-specific; no blanket Mass/kg for MJ/h/t*km. | `ilcd-attributional-2010` |\n| v_stocks | manufacturing service packaging assets | Check all inherited vectors and independent full gross ledgers, ordinary losses/treatment retained, actual T_other justification, first-release cancellation and complete six legs. No closing-stock cancellation of new repair/material/water influx, economic shrinking of physical legs, or repeated stock correction. Already performed original service survives FG storage. | `ilcd-attributional-2010` |\n| v_species | wood water air and waste | Independently check physical mass, relevant elements, biogenic/fossil/ambient carbon, actual phase/species and water states. No molecular identity from aggregate VOC/PM/COD/total-N, or one residual solving two unknowns. No total plus overlapping component exchanges, dry-air aggregate plus species, or duplicate mixed-waste/provider treatment. | `usda-wood-2021`; `adler-unistar` |\n| v_release_work | actual post-release work | Verify actual permission, postwork tests and acceptance/disposition for conformity; collect and retain actual unauthorized/failed/held operations and physical changes regardless. Natural humidity exchange has no invented work permission. Do not assume breakage restoration. | `bertu-square`; `ilcd-attributional-2010` |\n| v_allocation | shared burden | Independently audit dedicated/virtual subdivision then exchange-specific determining physical causality then genuinely residual common-gate values; reject arbitrary ratios, automatic coproduct credits and sold-waste burden deletion. | `ilcd-attributional-2010` |\n\n"
