    - rule_id: b_inventory_cleaner_gel
      applies_to: "cleaner_gel"
      rule: "Only if actual heavily soiled lines require this specified gel; do not add every catalogue cleaner. Qualify actual chemistry, supplied state and cleanup route before use. Quantity linkage: record raw units and cohort first; convert once, reconcile the appropriate manufacturing/service/asset burden account once, and take x_i from the sole quotient. Physical gross legs stay complete and separately reconciled."
      source_ids:
