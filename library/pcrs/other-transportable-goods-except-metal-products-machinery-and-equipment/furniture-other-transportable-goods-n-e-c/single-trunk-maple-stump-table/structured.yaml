  - id: "cosi-whole-table"
    type: "literature"
    reference: "NSF EPD11128, Teknion Cosi Laptop Table, issued 11 August 2025, complete EPD, pp.1–4 with complete product figure/table; https://info.nsf.org/Certified/Sustain/ProdCert/EPD11128.pdf"
    used_for: "Independent whole occasional/side-table example includes base, work surface, mechanism and glide on physical-floor-space basis. Its office/laptop use, material mix, dimensions/area, piece multiplier, mass, reference life, lifecycle and product-specific variability are not transferred to a maple table or treated as a maple recipe."
  - id: "nyle-l53"
