    - rule_id: b_scope_full_context
      applies_to: "full applicability context"
      rule: "This attributional method covers complete indoor occasional stump tables whose load-bearing body is one unjoined maple trunk section, shaped as a square-section block, with a qualified clear sealant finish and actual nonstructural nylon floor glides. Receive the actual rough-cut maple section; retain all real cutting, debarking, conditioning and kiln drying; shape and sand the same body; mix and spray the qualified clear waterborne two-component furniture coating; dry and sand as required; fit the actual glides and their actual fixings; inspect the complete table and record its unique first acceptance. The reference product includes the whole wooden body, finish, glides and all actual BOM accessories. A log, board, tabletop, seat component or purchased finished table is not this manufacture. Bertu Home's Square 1218 is positive physical evidence: it is sold as a stump table under Stumps & Side Tables, is made from a solid rough-cut maple trunk, and is hand-cut, debarked, kiln-dried, sanded and sprayed; the complete article has nylon glides. The same source explicitly permits use as a stool or grouping as a coffee table, reports size variation, cracking, humidity movement and later refinishing, and offers pigmented colours. These facts remain part of applicability. Admit this table method only for an actual declared occasional-table configuration and use; an exclusively seating, office or bedroom study needs its own applicability decision. Do not pretend that a multipurpose article has only one possible function. The related quick-ship bowtie product explicitly adds joints to limit cracking; that joined construction is excluded. Sources: bertu-square; bertu-bowties. This is a transparent technical synthesis, not an assertion that the cited manufacturers share a SKU, plant or recipe. Bertu supplies the complete physical terminal and manufacturing operations, but does not identify its kiln heat source or sealant formulation. This selected route uses an electric dehumidification kiln with real electric auxiliary heat, documented refrigerant system and condensate/vent interfaces, and qualified two-component clear waterborne furniture coating. USDA and Nyle document the drying technology and large-section drying difficulties; ADLER documents the selected finishing technology. No Nyle lumber schedule is transferred to a thick trunk. Retain actual species/section-specific drying schedule, independent surface/core moisture and drying-defect tests, coating-substrate permission and finished-table acceptance. Ordinary source examples of dimensions, price, time, moisture, load, formulation ratio, spread, energy, mass and lifetime are not defaults. Natural, black and whitewash are not interchangeable coating recipes. Exclude multi-member glued or veneered bodies, panels, bowtie repairs, separate structural legs/frames, seats supplied solely for seating, cabinets, office desks, bedroom furniture, components, customer-assembly kits, resin-filled cracks, pigmented/burnt/oil/UV/solvent-borne principal finishing, onsite fuel combustion, gas-fired or steam/hot-water drying, purchased finished-table repacking and hidden outsourced processing. Other actual principal routes require an independent applicability review and full actual atomic inventory. Natural cracking is not a zero-loss assumption or evidence that any damaged body passes. Packing, storage, handling, shipment, returns and actual post-acceptance work remain separately observed original-cohort services. Upstream forest/log preparation, every supplied article and external utility retain their real producer burdens once."
      source_ids:
        - bertu-square
        - bertu-bowties
        - nyle-l53
        - nyle-timbers
        - usda-wood-2021
        - adler-unistar
        - adler-crosslinker
    - rule_id: b_reference_full_context
      applies_to: "full reference/native/area/cohort context"
      rule: "Declare all qualifiers in dataset metadata or equivalent fields. The native family describes one piece of wood that is sanded, shaped and sealed; its additional engineered/veneer synonyms and marketing discussion do not authorize panels, veneer or hidden joints. This scope positively matches the single solid body, while retaining the real auxiliary nylon feet and sealant; it does not impose chemical-purity or hardware-free conditions that the family does not state. Its reference is Area, not Mass. It supplies no provider quantity, drying/coating recipe or environmental advantage. The area convention is the complete product's occupied floor space: its actual aerial outer perimeter, including any projecting glides/fixings, extended to the floor. It is neither coated surface nor a tabletop component nor the sum of small foot-contact patches. Measure maximum physical width and length only where the actual occupied outer envelope is demonstrably rectangular; otherwise retain calibrated aerial outline/planimetry of the full exterior perimeter and all protrusions. Do not import a catalogue dimension, assume a perfect square despite cracking, or count multiple surface faces. NSF Tables provides a clear whole-table floor-space convention and an occasional-table category; it is an office-furniture EPD method with additional life-cycle and service rules. Cosi independently demonstrates a complete side table including its glide on an area basis. Only the geometric normalization convention is adopted here, with the nonoffice and first-acceptance limits explicit: no NSF compliance, office classification, EPD equivalence, ten-year life, product mass or pieces-per-square-metre is transferred. Sources: nsf-tables-2026; cosi-whole-table. Q0 is the sum of each complete table's independently measured floor-space area at its unique first acceptance. Lock that original area to the item/cohort. Later moisture loss, damage, shrinkage, return, rework or disposal changes physical state, never the historic acceptance event. Partition all initially accepted identities into disjoint net remaining deliveries, every actual on-site accepted state (including stored, held, sample, damaged, rework and returned items), irreversible losses and other terminal dispositions on original acceptance-area basis. Every physical item belongs once; internal loops and reversible returns create no new Q0. A simplified deliveries-plus-FG bridge is valid only when all other postgate states/exits are proven absent. Actual current geometry/mass and physical losses are independent ledgers; do not restore lost water/material to a survivor and also count the loss. Service uses original cohort Q0 even when all items are gone. Zero or unknown Q0 retains raw totals and an unresolved unit result. Independently measured net whole mass/moisture is required for any separately reported kg/m2 bridge; no invented machine or table weight."
      source_ids:
        - nsf-tables-2026
        - cosi-whole-table
        - bertu-square
        - ilcd-attributional-2010
    - rule_id: b_history
      applies_to: "all inventory rows"
      rule: "Keep opening and closing physical raw/WIP/FG/residue/reusable/installed stocks and a distinct inherited vector per exchange and cohort. Apply stock reconciliation once; never subtract stock-corrected consumption again. Ordinary failed products, samples, wastes, sale or external removal are not T_other. Only a true other cohort/function with a justified allocation/handover can receive one burden vector once."
      source_ids:
