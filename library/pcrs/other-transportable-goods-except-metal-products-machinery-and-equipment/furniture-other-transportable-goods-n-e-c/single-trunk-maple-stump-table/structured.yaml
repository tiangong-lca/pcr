    - rule_id: b_inventory_lacquer_base
      applies_to: "lacquer_base"
      rule: "One whole supplied transparent waterborne coating including actual carrier water/additives; no separately procured polymer or included water. The source puts tabletops in the high-stress two-component application: separately record Aqua-Crosslinker 8481. One-component bedroom/living-room permission does not cover this chosen tabletop application. Record the actual hardwood substrate trial, layer sequence, airless application, drying and intermediate sanding, actual manufacturer limits and losses. Do not prescribe source ratio, g/m2, temperature, nozzle, pressure, timing or resistance/certification. Solvent-free formulation language is not proof of zero volatile species or zero spray aerosol; actual SDS and measurements control. Quantity linkage: record raw units and cohort first; convert once, reconcile the appropriate manufacturing/service/asset burden account once, and take x_i from the sole quotient. Physical gross legs stay complete and separately reconciled."
      source_ids:
        - adler-unistar
        - adler-crosslinker
    - rule_id: b_inventory_lacquer_crosslinker
      applies_to: "lacquer_crosslinker"
      rule: "One actual separately purchased isocyanate-free 8481 preparation for the approved waterborne base. Retain actual supplier formulation/SDS and full mass including water if present; do not bind an isocyanate hardener or invented pure CAS. Collect mixing, standby, shelf/pot-expired losses, cleanup and actual qualification. No unmeasured addition ratio, reaction-water stoichiometry, polymer structure or default pot life is inferred. Quantity linkage: record raw units and cohort first; convert once, reconcile the appropriate manufacturing/service/asset burden account once, and take x_i from the sole quotient. Physical gross legs stay complete and separately reconciled."
      source_ids:
        - adler-crosslinker
        - adler-unistar
    - rule_id: b_inventory_steel_screw
      applies_to: "steel_screw"
      rule: "Conditional only for an actual approved nonstructural foot-glide fastening, not invented metal frame joints: the actual load-bearing body remains one unjoined maple trunk; no frame joint is inferred. Native Product is one manufactured steel screw, GLO at-plant production mix, auxiliary fastener for assembly; no alloy, plating or dimension is specified. Match the real whole screw and its provider and mass; no raw steel procurement duplicated beneath a finished screw. Quantity linkage: record raw units and cohort first; convert once, reconcile the appropriate manufacturing/service/asset burden account once, and take x_i from the sole quotient. Physical gross legs stay complete and separately reconciled."
      source_ids:
        - bertu-square
    - rule_id: b_inventory_abrasive_paper
      applies_to: "abrasive_paper"
      rule: "One actual paper-backed abrasive article for raw wood or intercoat sanding, procured whole once including abrasive grain/binder/backing; retain actual grade and stages separately in the raw ledger. Native Product at plant, Mass/kg, has no grain, grit or route qualifier; old miscellaneous-goods classification is retained in a separate native classification note and does not establish performance. No default grit or consumption. A belt with textile backing requires its own actual identity and card. Quantity linkage: record raw units and cohort first; convert once, reconcile the appropriate manufacturing/service/asset burden account once, and take x_i from the sole quotient. Physical gross legs stay complete and separately reconciled."
      source_ids:
