measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the sum of independently measured net masses of uniquely identified complete buildings first released in the reporting cohort. Weigh complete configured units with calibrated scales or a traceable complete-kit mass reconciliation under cp_release. Include actual integral constituents and retained fluids once; exclude transport packaging and temporary jigs. Never infer unit mass from dimensions, density or a generic building count."
  - id: raw_to_unit
    applies_to: "all inventory rows"
    required_property_ref:
      name: "row-specific native property"
      uuid: ""
    required_unit: "row-specific"
    rule: "Collect undivided raw quantities in original units. Convert rate/units and perform justified attribution before the single calculation in §8. Same-reference cards and protocol aggregation refer to that same calculation; no later second division. Q=0 retains actual burdens and inventory vectors but yields no unit result."
  - id: material_state
    applies_to: "formulations and retained fluids"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Procure each supplied formulation as a whole once. Assay, monomer, solvent and carrier-water contents are non-additive subledgers, not extra purchases. Separately added substances cross as their own actual flows. Record wet mass, free/retained/structural water and reaction stoichiometry independently; thermoset cure is not upstream polyester polycondensation. Do not fit two unknowns with one mass residual."
  - id: electricity_units
    applies_to: "electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Use the native energy property with its energy unit group; 1 kWh=3.6 MJ. The adopted MVAC identity is restricted to CN 1–35 kV consumption mix at user, grid-average supply. Other voltage/geography or a separate transformation service requires a compatible atomic row without buying the same power twice."
  - id: physical_conversions
    applies_to: "all physical exchanges"
    required_property_ref:
      name: "actual measured property"
