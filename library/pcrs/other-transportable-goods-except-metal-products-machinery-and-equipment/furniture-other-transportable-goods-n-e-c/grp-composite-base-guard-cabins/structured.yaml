system_boundary:
  rules:
    - rule_id: whole_building_gate
      applies_to: "reference product"
      rule: "Require positive BOM/drawing and supplier evidence for a whole predominantly-plastics building. Identify structural shell, base and floor, roof, insulation, doors/windows, inner/outer finishes, electrical and plumbing scope and included fixed equipment. Do not reclassify a complete steel/aluminium frame merely because its face is GRP. Retain a complete-set test and configuration record; loose shells cannot use the finished-building UUID."
      source_ids:
        - un-cpc3-prefabricated-buildings-2025
        - eissa-grp-kiosks
        - eldapoint-grp-buildings
        - lloyds-grp-cubicles
    - rule_id: make_buy_bridge
      applies_to: "component manufacture and assembly"
      rule: "For each wall, roof, base, door and fitted module choose disjoint site manufacture from actual purchased materials or receipt of the complete supplied article. If a bridge is necessary, identify unique transfer IDs and reconcile physical quantities and the complete inherited exchange vector. Cancel internal component handoffs on consolidation; keep actual raw fabrication burdens. Never purchase article mass and its already-included resin/fibre/core again or repeat upstream cure/galvanizing/glazing."
      source_ids:
        - eldapoint-grp-panel-manufacture
        - epa-polyester-fabrication-2008
        - uk-kiosks-technical-specification
    - rule_id: first_release_once
      applies_to: "manufacture and finished goods"
      rule: "Q counts each complete building once at its first complete-set quality release, including released stock still held at closing. Closing FG already included in Q is not subtracted as manufacturing WIP or added as a second production output. A repeat test, dismantling, dispatch, return or delivery is not new Q. Failed, unauthorized or rejected activity and its physical inputs/outputs still exist and must be recorded; do not assume later repair or acceptance."
      source_ids:
        - eldapoint-grp-buildings
    - rule_id: all_actual_loads
      applies_to: "all foreground stages"
      rule: "Include attributable unsuccessful production, trial, start/stop, idle, cure hold, cleanup, ventilation, tests, defect removal and actual rework/treatment even in zero-output intervals. Open/close raw stock and WIP by physical material and by each inherited exchange vector. Carry unfinished-production burdens to their actual future release, waste or transfer; never use missing data as zero."
      source_ids:
        - epa-polyester-fabrication-2008
        - jrc-ilcd-allocation-2010
    - rule_id: gross_physical_gate
      applies_to: "manufacture, FG and consolidated balances"
      rule: "At each consistent total-mass gate retain opening wet stock plus all actual external receipts, equal to closing wet stock plus all gross external outputs including independently observed gaseous/liquid/solid losses. Chemical curing does not create matter. Reaction formation/consumption terms belong only to independently evidenced species balances and must conserve total mass and relevant elements. Track each relevant element separately from individual molecular emissions. Internal transfers cancel at the same physical gate. Only duplicate records of the same OTHER physical event on the same side may be removed as X; X cannot offset stock, an opposite-side flow or an existing card. Unexplained residuals stay unresolved rather than becoming an invented gas or water flow."
      source_ids:
        - epa-polyester-fabrication-2008
    - rule_id: observed_services
      applies_to: "post-release operations"
      rule: "Preserve positive original Q0/Qc and real observed H for already complete accepted buildings. Record actual warehousing/handling/packing/faileddispatch/corrective work with fullphysicalreceiver/provider quantities once. Physical V/Qanalysis is diagnostic, never repeated linked full demand per cohort. Separately assign evidenced nonoverlapping compatible-unit A/originalQ0 or Ah/originalQc vectors. Keep original FG burdens, full wet stocks, removedparts/waste and linked dispatch/return history; no new manufacture or erasure by stock difference and no future unperformed service. Real pre-firstacceptance work remains manufacture."
      source_ids:
        - jrc-ilcd-allocation-2010
        - eldapoint-grp-buildings
    - rule_id: packaging_pools
      applies_to: "each packaging article"
      rule: "Every actual same-unit whole-wet PEfilm/PPstrap/woodpallet pool uses O+P+I+ER+J_in+H2O_in=C+S_filled+EO_empty+W_whole+J_out+H2O_out. O/C full empty/attached/reusablewetstocks; P independentpurchase, I other evidenced supplierincluded/issued ingress, ER actualinwardreturn, S_filled grossfilledoutward, EO_empty emptyoutward, W_whole actualwholecontaminatedwetwaste. Jnonwater/water changes realdisjoint, XonlyOTHERsame-sideduplicates, nottrueinflux/wetC/opposites. Reusecreatesnopurchase/Q/credit."
      source_ids:
        - jrc-ilcd-allocation-2010
    - rule_id: atomic_extension
      applies_to: "actual route not yet enumerated"
      rule: "Conditional cards are activated only by actual route records; no default recipe is prescribed. Add a named single physical/chemical input or output card and raw protocol for every additional actual material, supplied mixture, fuel, gas, packaging, removed part, waste or released molecule. Supplier permission, acceptance or test status never authorizes omission of a physical flow. Do not hide unlisted actual manufacture in zero or an OTHER category. A genuine one-provider mixed waste has one weighed total and non-additive measured originW subledger; represent total or separately measured disjoint outlets once. Never substitute a Product flow for a Waste."
      source_ids:
        - epa-polyester-fabrication-2008
        - jrc-ilcd-allocation-2010
    - rule_id: thermal_and_species
      applies_to: "heat, fluids and elementary exchanges"
      rule: "No steam/boiler, combustion or cooling loop is presumed. For actual imported process steam and externally returned condensate record gross kg, substance, T/P/phase and independent enthalpy plus supplier water/energy agreement. A single provider service must not be bought twice as both steam mass and heat MJ. Record actual individual gases and chemical destinations separately; N2, O2, Ar, H2O and carbon-bearing species are not an air/VOC residual. COD, total VOC and particulate indices are not specific molecular masses; distinguish captured waste from actual environmental emissions."
      source_ids:
        - epa-polyester-fabrication-2008
    - rule_id: wip_vector_carry
      applies_to: "raw stock, WIP and non-WIP ledgers"
      rule: "For each exchange e and matched new-release cohort, form the production numerator A_e from current assigned raw burden plus its inherited opening-WIP vector minus the actual closing-WIP vector and vectors transferred to independently traced other destinations. Carry each retained raw-material supply vector with actual issues, not an extra purchase on every stock count. Never subtract released closing FG from this new-release numerator because it is already in Q. Non-WIP FG, packaging, asset, fluid and removed-component ledgers retain their complete physical stock and inherited vectors separately. Real natural moisture exchange is an observed material event, not presumed repair. Unresolved historical vectors remain disclosed and block a complete concrete cohort result; no residual vector is fabricated."
      source_ids:
        - jrc-ilcd-allocation-2010
    - rule_id: system_boundary_rule_11
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers new complete prefabricated GRP guard cabins predominantly made of plastics, with structural GRP walls/roof and an actual composite base/floor. The evidenced manufacturing route is a GRP/FRP composite cabin or guardhouse with a structural plastic-composite wall/roof system and an explicitly identified base/floor, doors, openings and included fixed fit-out. The reference is one real complete manufactured guard cabin, not a classification-derived placeholder. A complete matched building kit may be represented only after its entire configuration has passed the same first complete-set factory release; shipping the verified kit in pieces does not produce additional buildings. A panel, resin, glass fibre, cured shell without the required components, furniture, sanitary fixture, transport container or erection service cannot stand for this reference product."
      source_ids: []
    - rule_id: system_boundary_rule_12
      applies_to: "foreground_system_boundary"
      rule: "CPC class3870 also includes incomplete buildings having the essential character of a building; that classification fact does not waive this method’s complete-set release gate. Assess the actual principal material and structural system with the BOM, drawings and supplier scope. A steel/aluminium load-bearing building with plastic cladding is outside this GRP route; a documented local metal skid, hinge or fixing is a component, not permission to conceal a complete metal frame. No numerical predominance threshold is invented. The evidence establishes real whole-building families, not a shared SKU, factory, recipe or performance guarantee."
      source_ids: []
    - rule_id: system_boundary_rule_13
      applies_to: "foreground_system_boundary"
      rule: "The foreground covers actual receipt and storage, conditional in-house mould preparation/layup/core formation/cure, trimming and openings, shell joining, finishes, fixed-installation assembly and first complete-set quality release. It is a technical synthesis: manufacturer whole-building and panel evidence is combined with EPA resin-fabrication guidance only for the compatible actual route. Purchased formulated resin, gelcoat, mat, cured panel or complete fitted assembly carries its included upstream work once. Declare every make-or-buy boundary. Foundation, lifting/anchoring and final connections are downstream only after a real complete first factory acceptance. Actual first structural completion, mandatory fit-out or QC on site is manufacturing and must stay with its genuine producer/interfaces; it cannot be hidden as later service or forced to an incompatible at-plant reference. Use, occupancy, lifetime and end of life are outside the manufacture result. Retain measured post-release warehousing, packaging, handling and dispatch in a separate observed-service account, then combine by the original release cohort without a second production denominator."
      source_ids: []
    - rule_id: system_boundary_rule_14
      applies_to: "foreground_system_boundary"
      rule: "Declare every required qualifier in dataset metadata, process notes, reference-flow comment, product description or an equivalent foreground-package field. A missing qualifier leaves the reference definition incomplete. This mass declared unit does not establish area, occupancy-service or performance equivalence between configurations."
      source_ids: []
    - rule_id: system_boundary_rule_15
      applies_to: "foreground_system_boundary"
      rule: "Every conditional card requires actual occurrence or documented absence, with no default recipe or zero amount. Card descriptions, supplied boundaries and limits are part of each exchange’s complete normative context. Each card refers to the same single normalize_exchange calculation in §8; collection protocols do not divide early. Internal component and release-to-services transfers cancel at consolidation while actual raw fabrication burdens remain."
      source_ids: []
    - rule_id: system_boundary_rule_16
      applies_to: "foreground_system_boundary"
      rule: "This bounded subtype is a real complete guard cabin with structural GRP wall/roof and an actual composite base/floor, with actual doors, glazing/openings, insulation and declared fixed fit-out. Eissa explicitly offers human-use guard cabins/gatehouses and a composite-base alternative; Eldapoint explicitly manufactures off-site complete gatehouses and offers turnkey units needing only final utility connection. These are whole-building positive evidence, not a loose panel or an open-bottom equipment box. Actual BOM/drawings must establish the principal plastics/composite structure; a GRP label alone, exterior area or an invented mass/volume threshold cannot prove predominance. Local actual hinges/glazing/fixings do not authorize a hidden whole metal load-bearing frame. Sources: eissa-grp-kiosks; eldapoint-grp-buildings; un-cpc3-prefabricated-buildings-2025."
      source_ids: []
    - rule_id: system_boundary_rule_17
      applies_to: "foreground_system_boundary"
      rule: "Keep the full source alternatives separate. Eissa composite floor/base versus HDG perimeter skid, insulated versus single-skin and optional fire-retardant/MEP variants are not one recipe. The selected subtype uses the evidenced composite-base branch; an actual HDG-base or predominantly metal structure is not silently substituted. Eldapoint panel manufacture is the same publisher as its buildings, not a second independent factory. Its plywood/OSB/foam/core alternatives and halogen-free statement do not establish Eissa's actual material; Eissa separately describes conditional halogenated/ATH-filled fire-resin variants. No cross-source recipe, thickness, density, fire/IP/thermal rating, life or environmental advantage is adopted. Sources: eissa-grp-kiosks; eldapoint-grp-panel-manufacture; eldapoint-grp-buildings."
      source_ids: []
    - rule_id: system_boundary_rule_18
      applies_to: "foreground_system_boundary"
      rule: "UK Kiosks' complete two-page source has Worcester then Guardian headings, steel-supported/galvanized base, mould/oven treatment, fastening and sealing, glazing and optional electrics. Preserve that mixed heading/route as countercontext, not selected composite-base construction or a universal cure temperature. Lloyds' complete four-page source explicitly describes open-bottom cubicles lowered over electrical equipment with a metal base; factory preassembly and a kiosk name do not make that a whole guardhouse. Neither case negates another genuinely complete predominantly-plastics cabin. No same factory/SKU requirement is imposed. Sources: uk-kiosks-technical-specification; lloyds-grp-cubicles."
      source_ids: []
    - rule_id: system_boundary_rule_19
      applies_to: "foreground_system_boundary"
      rule: "For the actual in-house compatible polyester branch, EPA describes fabrication from received finished liquid resins, reinforcement placement, gelcoat where actually used, cure, trimming and cleanup. Upstream polyester synthesis is distinct from thermoset crosslinking. Actual supplied laminating formulation, gelcoat, peroxide, release agent and any separately purchased chemicals cross once; monomer/carrier/additive children are non-additive. A generic native UPR name without supplied-formulation evidence is not used as a pure-polymer proxy for the complete mixture; the concrete laminating formulation stays unbound until actual whole-supply identity/provider fit is established. Other resin systems require their own actual atoms. No styrene fraction, peroxide dose, glass ratio or cure time is a default. Sources: epa-polyester-fabrication-2008; eldapoint-grp-panel-manufacture."
      source_ids: []
    - rule_id: system_boundary_rule_20
      applies_to: "foreground_system_boundary"
      rule: "Preserve EPA's complete emission scope and table footnotes: monomer evaporation from resin/gelcoat is separate from cleanup-solvent emissions, reinforcement/trimming particulate and actual treatment outlets. The updated open-mould note reports underestimation by earlier factors and points to the version current at use. This PCR adopts no numerical emission factor, suppression/control percentage, monomer/catalyst range or universal heat recipe. Use actual qualified species-specific observations and raw flow/rate integration; VOC/COD/PM indices are not molecules. Actual polyurethane core reaction, retained/free/structural water, blowing species and CO2 formation need independent real evidence; do not conserve reacting species or treat upstream polycondensation water as factory cure by default. Unknown essential matrix/analytical/test procedures remain a concrete-study hold, not a future SOP or finite-pass waiver. Sources: epa-polyester-fabrication-2008."
      source_ids: []
    - rule_id: system_boundary_rule_21
      applies_to: "foreground_system_boundary"
      rule: "Fix one actual complete-set first-acceptance factory gate, fit-out and retained-fluid state before collection. Whole manufactured-at-plant native identity is not a resin/panel/shell, warehouse receipt, incomplete equipment cubicle or an assumed kit. A matched complete transport kit needs actual whole-product configuration/state and the same unique acceptance; the wider classification's essential-character incomplete alternative does not waive this narrower gate. If real first structural completion, mandatory fit-out/QC or acceptance occurs on site, preserve that manufacturing producer/work/interfaces and do not paper it into optional later service or force an incompatible factory-finished UUID. Only actually complete already accepted units have later original-cohort lifting/anchoring/connections/disassembly/service histories. Actual final packing/QC before approval remains manufacturing. Sources: un-cpc3-prefabricated-buildings-2025; eissa-grp-kiosks; eldapoint-grp-buildings."
      source_ids: []
    - rule_id: system_boundary_rule_22
      applies_to: "foreground_system_boundary"
      rule: "Measure M for each actual complete serial/configuration at its fixed acceptance state using calibrated whole net weighing, excluding removable packages, detached accessories and recoverable test loads. If actual separate module weighing is used, reconcile the same-state disjoint full BOM, included permanent fittings/retained water/actual finish and one complete acceptance event; do not weigh the complete unit and add its parts again. A count, drawing volume, catalogued density, nominal cabin size or another model's weight cannot establish M. The exact native mass chain remains kg; no conversion from item to kg without independent actual mass."
      source_ids: []
    - rule_id: system_boundary_rule_23
      applies_to: "foreground_system_boundary"
      rule: "Q0 is the locked sum of positive net masses at unique original whole-cabin first-acceptance events, not another external physical output. On original acceptance basis partition it into disjoint net remaining deliveries, all actual accepted on-site states (released FG, accepted hold, accepted rework/returns), irreversible original-material/water losses and other terminal dispositions. A repeated return, retest or disassembly creates no new event. Keep full actual wet physical stocks and later retained increments separately with a measured state/quantity bridge to original basis. Do not restore lost water into survivors then add that water loss again. Actual zero-output periods Q=0 and unknown positive denominators retain absolute raw loads/stocks and unresolved unit results; Q=0 is not the positive original Q0 ledger."
      source_ids: []
    - rule_id: system_boundary_rule_24
      applies_to: "foreground_system_boundary"
      rule: "For each exchange retain physical raw/WIP/non-WIP inventories separately from inherited environmental vectors. In A_i=B_open_i+U_new_i−B_close_i−T_other_i, U_new is actual new material/service/provider/work/treatment addition before stock correction. B contains only raw/WIP/genuinely unused-unassigned stores, not already accepted FG or performed service. If the starting consumption is already stock corrected, use its reconciled equivalent without a second deduction. Preserve failed/start-stop/idle/cleanup/rework/testing activity. Own inherited foreground/WIP and provider aggregate or decomposed upstream histories must have disjoint ownership; never add embedded provider manufacture again. Another original cohort/function transfer needs actual once-only handover evidence."
      source_ids: []
    - rule_id: system_boundary_rule_25
      applies_to: "foreground_system_boundary"
      rule: "Maintain three ledgers for actual shared waste, asset or packaging service: one full actual receiver transfer Qt and full actual provider quantity once; known nested physical composition and actual cohort provenance; distinct evidenced nonoverlapping environmental/treatment-service vectors per served original cohort in compatible provider units. Physical Qt/Qanalysis is only disclosure on one declared positive observation basis, never a linked full provider recharge per cohort. Linked modeled demand is separately A/original Q0 or A_h/original Qc. Never shrink actual fleet/whole waste by a service share or repeat full receiver/provider Qt for each cohort. Unknown provenance, compatible units or assignment stays unresolved; no invented lifetime, fraction or cycle count."
      source_ids: []
    - rule_id: system_boundary_rule_26
      applies_to: "foreground_system_boundary"
      rule: "For each actual same-unit whole-wet packaging article pool use O+P+I+ER+J_in+H2O_in=C+S_filled+EO_empty+W_whole+J_out+H2O_out. O/C include empty, attached-WIP, attached-accepted-FG and reusable wet stocks. P independent new purchase, I other evidenced supplier-included/issued/loaned ingress and ER actual returned article inward have mutually exclusive custody histories. S_filled is the packaging component within an actual filled outward shipment including genuine returns; EO_empty is only outward empty articles. Filled inward ER reconciles net contents and packaging inside one actual receipt. J_in/out are real disjoint non-water repair/retained matter increments/departures; H2O_in/out are real water changes, excluding water already contained in whole streams. X only removes duplicate OTHER same-side component entries before the equation, never actual influx, wet C, opposite sides or another positive physical flow. Internal reuse gives no purchase, Q, co-function or recycling credit."
      source_ids: []
    - rule_id: system_boundary_rule_27
      applies_to: "foreground_system_boundary"
      rule: "W_whole for a contaminated carton, film, pallet, cloth or filter is the actual whole receiver waste including substrate, retained GRP/foam dust, coating/adhesive/liquor and water once. Substrate and retained constituents are nested component ledgers, not additional attached-residue exports or extra treatment demand unless physically separated before the boundary. Separate actual captured powder/sludge or residue outlets remain their own real streams; a mixed receiver uses one total and non-additive origin subaccounts. Product versus Waste identity must fit actual condition; no intact Product UUID for a discarded contaminated article. Physical waste/stocks/provider quantities remain full regardless of attribution."
      source_ids: []
    - rule_id: system_boundary_rule_28
      applies_to: "foreground_system_boundary"
      rule: "Synthetic arithmetic only, not empirical cabin mass, recipe, grade, life or service defaults: an actual hypothetical10kg contaminated filter consists of8kg substrate+2kg retained matter and is received/treated once. Independently evidenced hypothetical25%new/75%old compatible treatment service gives2.5/7.5kg-equivalent demand vectors; originalQnew100kg/Qold200kg gives0.025/0.0375kg-equivalent perkg, not2.5kg physical export or10kg charged to both. A separate whole-wet pool test O2+P3+I1+ER4+J_in2+H2O_in3=C4+S4+EO2+W2+J_out1+H2O_out2=15kg includes only disjoint extra increments; W2 contains1substrate+0.6retained+0.4water. Source document hardware counts and examples never become measured M or actual packaging quantities."
      source_ids: []
    - rule_id: system_boundary_rule_29
      applies_to: "foreground_system_boundary"
      rule: "Keep the exact native electricity Net calorific value / 净热值, 低位热值 and MJ energy unit group; actual kWh×3.6 is electrical unit conversion only. The bound flow is CN1–35kV grid-average to user, not proof for a UAE/UK factory. Every actual drying/curing, ventilation, dust extraction, core work, thermal or treatment producer and all materials/chemicals, air, water, utilities, species, wastes and carrier returns stay present. An external-provider label cannot hide known foreground work; a true supplied whole module/heat/treatment has complete actual producer burdens and disjoint physical/provider history, not duplicated decomposed inventories. No assumed boiler, fuel, electricity factor or air composition."
      source_ids: []
    - rule_id: system_boundary_rule_30
      applies_to: "foreground_system_boundary"
      rule: "The final product gate is actual complete manufacture and required conformity acceptance, not a universal source-derived test tolerance, coating count, building service life or certification. Actual final packing checks that precede first approval remain manufacturing. Later actual original-cohort handling, dispatch, maintenance and reassembly are reported only when performed during observed H with original Q0; authorization or successful repair does not delete failed/unauthorized work or logistics. ILCD allocation is conditional on justified attributional needs, prioritizes subdivision and evidenced determining physical causality before residual same-gate/state contemporaneous values; no arbitrary share or automatic avoided-product credit. Engineering/source/translation alignment checks do not establish scientific, study, mapping or publication acceptance. Sources: jrc-ilcd-allocation-2010; eldapoint-grp-buildings; eissa-grp-kiosks."
      source_ids: []
    - rule_id: system_boundary_rule_31
      applies_to: "foreground_system_boundary"
      rule: "Every named film/PP-strap/wood-pallet pool is conditional on a real actual article with complete supplier/receiver history, not proof that each cabin uses that package. P is independent purchase, I evidenced supplier-included/issued/loaned ingress and ER returned inward, with mutually exclusive event custody. S_filled only actual filled outward packaging; EO_empty only empty outward; W_whole is the actual wet contaminated receiver mass. Water/J increments are real nonoverlapping changes, X only OTHER same-side duplicates; no purchase/Q/co-function credit on reuse."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual received raw materials and supplied formulations, reinforcement, core stock and documented cured components at the reporting factory; each upstream gate and in-house operation is declared"
  starting_condition_role: "foreground_start"
  product_classification_scope: "Complete predominantly-plastics prefabricated buildings with the evidenced GRP manufacturing route"
  recursive_input_rule: "A bought complete building is a separate upstream article input with its own condition and burden; inspection or delivery does not turn it into new manufacture. Do not recursively duplicate this PCR or its constituent resin/fibre."
  upstream_dataset_requirement: "Link each actual supplied formulation/article once to compatible material, process, form, geography, unit and supplied-state data; retain missing-provider coverage explicitly"
  disclosure: "Factory and period; complete configuration; principal structure; component origin; all operations and unsuccessful loads; material/WIP/FG and inherited vectors; inbound logistics gate; actual service horizon; exclusions and upstream gaps"
