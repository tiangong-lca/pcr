  calculation_rules:
    - id: convert_raw_units
      applies_to: "all inventory rows"
      rule: "A_native = converted raw measured exchange; convert kWh to MJ with factor3.6 and weigh/convert physical units only with independent same-state evidence. Integrated quantities are not multiplied by duration again. Preserve raw original values and conversion uncertainty."
      inputs:
        - raw_measurement
        - unit_conversion_evidence
      output: "A_native"
      source_ids: []
    - id: attribute_raw
      applies_to: "all inventory rows"
      rule: "A = directly assigned or justified allocated A_native after dedicated/virtual subdivision, exchange-specific causality and only the genuine residual common-process allocation. For each exchange, add the actual opening-WIP vector to current assigned raw burden and subtract the actual closing-WIP and separately traced other-destination vectors; preserve raw-stock inherited vectors on actual issue. Released closing FG is already in Q and is not subtracted. Retain true losses and zero-output intervals. Gross physical article/fluid/waste/packaging movements remain full actual quantities, not burden-share-scaled quantities."
      inputs:
        - A_native
        - cp_joint
        - inherited_exchange_vectors
      output: "A"
      source_ids:
        - jrc-ilcd-allocation-2010
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "Convert actual native extensive units once. Physical V/Qanalysis or Qt/Qanalysis discloses the one actual whole event/provider quantity once, not a full shared provider link per cohort. Separately compute each original served cohort modeled A/originalQ0 or Ah/originalQc using evidenced nonoverlapping vectors and compatible units. A=Bopen+U_new−Bclose−Tother uses U_new BEFORE stock correction and only genuinely unused raw/WIP carry; never acceptedFG or performedservice, no second correction or repeated own/provider history. Zero/unknown basis retainsrawtotals and unresolvedunitresult."
      inputs:
        - V
        - Qt
        - Qanalysis
        - A
        - originalQ0
        - Ah
        - originalQc
        - U_new
        - raw_WIP_vectors
        - actual_causal_evidence
      output: "a"
      source_ids: []
    - id: component_reconciliation
      applies_to: "component bridge"
      rule: "Match sender/receiver transfer IDs and physical mass plus every inherited exchange vector. Cancel equal internal movements at consolidation; actual external supplied article or separately purchased disjoint constituents enter once. Never add a supplied article mass and its already-included formulation/fibre/core again."
      inputs:
        - cp_component_bridge
        - BOM_origin_mask
        - inherited_exchange_vectors
      output: "reconciled_component_ledger"
      source_ids:
        - eldapoint-grp-panel-manufacture
        - epa-polyester-fabrication-2008
    - id: physical_balances
      applies_to: "all material and species gates"
      rule: "Keep independent total wet-mass and relevant element balances: opening + gross receipts = closing + all gross external outputs, including actual emissions/losses. Independently evidenced chemical formation/consumption applies to species balances only and must conserve the total-mass and element gates. Include actual phase-crossing water/gas quantities, not invented mass. Cancel matching internal transfers. Every flow has its own inherited burden vector; retain the complete wet closing stock. Do not use X except removal of a duplicate same-side OTHER record of the same actual event. Species and free/retained/reaction/phase water require independent observations; one residual cannot resolve two unknowns."
      inputs:
        - cp_fabrication
        - cp_species
        - cp_release
        - cp_services
      output: "physical_reconciliation"
      source_ids: []
    - id: packaging_reconciliation
      applies_to: "each packaging pool"
      rule: "Convert actual native extensive units once. Physical V/Qanalysis or Qt/Qanalysis discloses the one actual whole event/provider quantity once, not a full shared provider link per cohort. Separately compute each original served cohort modeled A/originalQ0 or Ah/originalQc using evidenced nonoverlapping vectors and compatible units. A=Bopen+U_new−Bclose−Tother uses U_new BEFORE stock correction and only genuinely unused raw/WIP carry; never acceptedFG or performedservice, no second correction or repeated own/provider history. Zero/unknown basis retainsrawtotals and unresolvedunitresult."
      inputs:
        - V
        - Qt
        - Qanalysis
        - A
        - originalQ0
        - Ah
        - originalQc
        - U_new
        - raw_WIP_vectors
        - actual_causal_evidence
      output: "reconciled_packaging_pool"
      source_ids: []
    - id: cohort_consolidation
      applies_to: "manufacture and observed services"
      rule: "For each original cohort preserve its first-release manufacturing vector once and add only actual H service increments normalized on the same original Qc. Internal release-to-services product transfers cancel; closing FG remains stock and already counted first-release Q is not reduced. Gross physical dispatch/return/removed-part/waste/fluid records remain full native quantities over original Qc. Preserve original-dispatch reversal and actual incremental rework attribution; no future service forecast is presented as executed work."
      inputs:
        - cp_release
        - cp_services
        - cp_packaging
        - inherited_exchange_vectors
      output: "original_cohort_result"
      source_ids:
        - jrc-ilcd-allocation-2010
  data_quality_requirements:
    - id: identity_scope
      applies_to: "whole building and every exchange"
      requirement: "Require positive principal-material and complete-set evidence plus actual form, state, route, constituent/grade, supplier geography, type, media and full native restrictions. A UUID does not prove supplier applicability or a finished-building performance claim."
      evidence: "BOM; drawings; full supplier specification; complete native record and support chain"
    - id: mass_and_inventory
      applies_to: "Q, stocks and inherited vectors"
      requirement: "Measured complete-set Q and each raw/WIP/FG wet stock must reconcile physically and by inherited exchange vector. Repeat tests, shipping and returned articles never create new production. Packaging tare and integral retained fluids must be evidenced independently."
      evidence: "scale certificates; event-linked serial ledger; raw/WIP/FG balances; vector history"
    - id: time_and_coverage
      applies_to: "all included operations"
      requirement: "Use the complete actual campaign and observed service horizon; retain all failures, zero-output, idle, start/stop, cleanup, wastes and unmetered intervals. Unknown amounts and absent upstream datasets remain explicit gaps with uncertainty; no fixed yield, life, cure schedule, emissions or certification is invented."
      evidence: "meter logs; job histories; missingness register; original supplier/contractor evidence"
    - id: sources_and_units
      applies_to: "all calculations and sources"
      requirement: "Retain original raw units, conversion conditions, source-specific scope and any contrary evidence. Manufacturer examples support architecture/process possibilities, not LCA allocation or a universal quantitative recipe. Use current compatible provider data before publishing a concrete dataset."
      evidence: "native originals; actual measurements; method/assay records; source applicability ledger"
