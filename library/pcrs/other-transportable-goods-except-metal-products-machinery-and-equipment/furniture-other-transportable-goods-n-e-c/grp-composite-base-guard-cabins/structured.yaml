  - rule_id: validate_complete_reference
    applies_to: "finished_building"
    rule: "Confirm a complete predominantly-plastics building and the unique finished_building Product output, Mass/kg and matching configuration. Require every qualifier and first-release net mass evidence. Incomplete shells, unrelated panel/fibre UUIDs and plastic-clad metal frames fail this reference gate."
    source_ids:
      - un-cpc3-prefabricated-buildings-2025
      - eissa-grp-kiosks
  - rule_id: validate_make_buy
    applies_to: "all component rows"
    rule: "Reconcile the disjoint origin mask, complete supplied contents and every internal component vector. Reject double-purchased article constituents, duplicated cure/foam/glazing operations and unmatched handoffs."
    source_ids:
      - eldapoint-grp-panel-manufacture
      - epa-polyester-fabrication-2008
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Preserve raw collection followed by original-unit conversion, justified attribution and exactly one division by matched Q or original Qc. Q=0 has no unit result. Confirm current projection and finite bilingual reference consistency separately from physical/scientific evidence; an unsupported true relationship remains unresolved."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: validate_mass_species
    applies_to: "all physical and element gates"
    rule: "Check total wet mass, each relevant element and each independently observed chemical/water state separately. Preserve full wet closing stock, all retained constituents, actual gross return/outlets and measured originW without double addition. Do not close gaps with invented water, gas, repair, density or a COD/VOC/PM molecule."
    source_ids:
      - epa-polyester-fabrication-2008
  - rule_id: validate_services_packaging
    applies_to: "services"
    rule: "Reconcile original manufacture, opening/closing FG, actual H service, gross dispatch/return and original reversals on original Qc. Verify each packaging pool and its I/ER/S/EO/W cards; internal reuse is not procurement, Q or credit. Neither logistics nor acceptance may shrink real physical movement or produce a second Q."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: validate_native_identity
    applies_to: "UUID-bearing cards and unresolved atomic rows"
    rule: "Require positive whole-article identity and complete original native evaluation including all properties and exact referenced property→unit-group→unit support. Keep native type, CAS, route, structure, grade, form, geography and media limits in consumer-visible descriptions. Blank auxiliary UUIDs retain specific atomic names and require later provider identity resolution; they do not justify a fictitious collection binding or removal of actual loads."
    source_ids:
      - epa-polyester-fabrication-2008
  - rule_id: validate_no_default_claims
    applies_to: "dataset profile"
    rule: "Do not declare full upstream coverage, performance equivalence, scientific approval, translation review, release or a full-life assessment from engineering checks or manufacturer marketing claims. Quantitative provider gaps and actual core-method gaps are disclosed according to their real significance."
    source_ids:
      - jrc-ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Compatible whole-building component of a declared construction model, or downstream study of the same complete factory configuration; retain original release and service boundaries"
  allowed_use: "Attributional manufacture inventory per kg complete building with disclosed upstream coverage and actual optional observed-service module"
  excluded_use: "Loose panel/resin substitution; plastic-clad metal frame; universal recipe; claimed certification, service-life comparison, occupancy service or full-life result without separate evidence"
  required_metadata: "whole-building configuration and principal material evidence; actual structural shell and composite-base/floor supply scope; load-bearing frame identity; complete-set assembly or matched kit state; resin system and supplied formulation boundary; reinforcement form and core route; make-or-buy component register; geometry and face/layer definitions; door and glazing specification; interior and exterior finish inclusion; electrical installation inclusion; plumbing and retained-fluid state; serial and first release event; measured net mass and packaging tare; site and reporting period; supplier geography and electricity voltage; upstream gate and missing coverage; observed post-release horizon and original cohort; allocation and uncertainty"
  required_quality_disclosure: "Actual measured Q/Qc; raw/WIP/FG and inherited vectors; source applicability; unresolved auxiliary identities and missing providers; observation horizon; allocation/sensitivity; wet-mass and species reconciliation"
  update_trigger: "Changed structural system, polymer/formulation, core route, component gate, included fit-out, provider unit/voltage/geography, first-release definition, source or evidence of an omitted actual exchange"
data_sources:
  - id: "un-cpc3-prefabricated-buildings-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Ver.3.0 Explanatory Notes (30 June 2025), PDF p.195, class 3870 and subclasses 38701–38704; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Predominantly-plastics building identity; assembled/unassembled and incomplete-building alternatives."
  - id: "eissa-grp-kiosks"
    type: "literature"
    reference: "Eissa Fiber Glass LLC, GRP Kiosks & Equipment Enclosures, undated publisher HTML; https://www.eissafiber.com/GRP-Kiosk ; retrieved 2026-10-23"
    used_for: "Positive complete-cabin product family; GRP walls/roof, composite-base or skid alternative, doors and optional fixed installations. Qualitative architecture only."
  - id: "eldapoint-grp-buildings"
    type: "literature"
    reference: "Eldapoint Group, Bespoke GRP Kiosks & Buildings, undated complete publisher HTML; https://www.eldapoint-group.co.uk/products/prefabricated-buildings-and-cabins/fibreglass-grp-buildings-and-kiosks/ ; retrieved 2026-10-23"
    used_for: "Factory manufacture of complete gatehouses; blank or fitted configurations, final utility connection boundary and quality-control context. Not proof of a particular site or specification."
  - id: "eldapoint-grp-panel-manufacture"
    type: "literature"
    reference: "Eldapoint Group, Fibreglass GRP Panel Manufacture, undated complete publisher HTML; https://www.eldapoint-group.co.uk/capabilities/fabrication-and-assembly/fibreglass-grp-panel-manufacture/ ; retrieved 2026-10-23"
    used_for: "In-house reinforcement/resin/gelcoat moulding and conditional core insertion; related to the same manufacturer building family, not an independent second manufacturer."
  - id: "epa-polyester-fabrication-2008"
    type: "official_guidance"
    reference: "US EPA, AP-42 §4.4 Polyester Resin Plastic Products Fabrication, February 2007 text and Table4.4-2 update May2008, complete nine-page PDF; https://www.epa.gov/sites/default/files/2020-10/documents/c04s04.pdf ; retrieved 2026-10-23"
    used_for: "Technical synthesis of supplied liquid-resin fabrication, layup, cure, release, cleaning and monomer-specific losses. Distinguish resin synthesis from cure; table notes warn about open-mould emission factors. No recipe, ratio, factor, temperature or cure time adopted."
  - id: "uk-kiosks-technical-specification"
    type: "literature"
    reference: "UK Kiosks, Worcester Range GRP Kiosk Technical Specification (second page headed Guardian Range), undated two-page PDF; https://www.ukkiosks.com/wp-content/uploads/2020/04/Worcester-Range-Technical-Specification.pdf ; retrieved 2026-10-23"
    used_for: "Counter-route: steel-supported base, GRP/polyurethane panels, actual oven treatment, fastened/sealed assembly, supplied glazing and optional electrics. Preserve mixed range headings; no dimensions, density, temperature or performance adopted."
  - id: "lloyds-grp-cubicles"
    type: "literature"
    reference: "Lloyds Composites, Polyester FRP/GRP Cubicles/Kiosks, undated four-page brochure; https://lloydscomposites.com/wp-content/uploads/2024/02/Kiosk-brochure.pdf ; retrieved 2026-10-23"
    used_for: "Counterexample: preassembled electrical-equipment cubicles may be open-bottom with a metal base. A kiosk label, panel or equipment cabinet alone does not prove the complete building scope."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA—Detailed guidance, first edition March2010, §§7.9.2–7.9.3, printed pp.255–268; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctional-process hierarchy and exchange-specific causality; residual common-gate market values. Complete method scope and adjacent multifunctional-product/QFD exception retained. Not industrial recipe evidence."
