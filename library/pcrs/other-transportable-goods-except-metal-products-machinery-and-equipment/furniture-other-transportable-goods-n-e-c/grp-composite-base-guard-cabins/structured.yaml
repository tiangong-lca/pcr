allocation_rules:
  - rule_id: dedicated_first
    applies_to: "attributional multifunctional process"
    rule: "Use independent dedicated measurement and actual or virtual subdivision first. Isolate building-specific materials, tooling, labour-linked activities and tests. Identify all co-functions and receiving cohorts, including rejected work and idle loads. A multifunctional product comparison and its QFD discussion is a separate case; it is not a licence to allocate this factory process by optional product features."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: causality_per_exchange
    applies_to: "remaining joint exchanges"
    rule: "For each exchange remaining after subdivision identify the determining physical causal relationship: how a quantitative change in a particular output/function changes that input or emission. Collect the independent driver and mechanism. A kg, area, machine-hour or revenue share alone is not causal proof, and one driver need not apply to all exchanges. Preserve directly traced constituent flows and emissions before any residual common-process allocation."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: residual_market_value
    applies_to: "genuinely unresolved common process"
    rule: "Only genuinely remaining non-causal common-process burdens use contemporaneous market values for the actual quantities, condition and same process gate, after demonstrating why subdivision and determining physical causality do not resolve them. Reconcile further purification, packaging or transport out of prices at other gates. State currency, period, co-output quantities, price evidence, residual burden population and sensitivity; no fixed fraction, arbitrary physical/economic choice or automatic avoided-product credit."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: assets_and_rework
    applies_to: "tooling, reusable assets and real losses"
    rule: "Conserve each reusable mould/rack/asset manufacturing-burden vector across all cohorts and periods: evidenced total service or an explicit forecast with uncertainty governs lifetime shares whose cumulative total cannot exceed one. Do not allocate a fresh full asset to every period. Real consumed replacements, repairs and their waste/returns are full physical events; only the manufacturing-burden share is apportioned. Internal regrind/recovered solvent retains its vector without new purchase or automatic credit."
    source_ids:
      - jrc-ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_fabrication
      process_id: "fabrication"
      flow_role: "each actual raw-material and fabrication exchange"
      record_type: "raw_foreground_records"
      raw_fields: "event_id; time; site; cohort; serial or lot; row_id; actual material and supplied state; supplier and upstream gate; original amount and unit; received/issued/returned/exported quantity; opening and closing raw stock; opening and closing WIP; all inherited exchange vectors; rejected and zero-output load; calibration; method; uncertainty; actual_fixed_gate_phase; original_positive_Q0_event; original_basis_dispositions; actual_wet_stock_state_bridge; U_new_before_stock_correction; own_provider_history_nonoverlap; actual_receiver_Qt_once; full_actual_provider_quantity_once; nested_component_provenance; evidenced_nonoverlapping_service_vectors; compatible_provider_units; original_Q0_each_cohort; Qanalysis; J_in; J_out; H2O_in; H2O_out; X_OTHER_same_side"
      collection_method: "Weigh whole formulations and article lots; reconcile receipts, withdrawals, unused returns and physical stock changes separately from gross receipt records. Log actual mould/layup/core/curing/finishing states, all failed lots, cleanup, idle and start/stop. Use calibrated stage meters; do not infer a recipe from product mass. Record supplier-included carrier water and active contents only as subledgers. Keep full physical/provider quantities once, component/cohort provenance separately and actual per-original-cohort modeled vectors; actual pre-firstacceptance work remains manufacture, later work only after genuine complete acceptance. J nonwater/water extra changes are disjoint from whole-stream constituents; X only OTHER same-side duplicates."
      unit: "kg; MJ"
      frequency: "each physical event and meter interval"
      temporal_coverage: "full reporting campaign including zero-output intervals and all open/close inventories"
