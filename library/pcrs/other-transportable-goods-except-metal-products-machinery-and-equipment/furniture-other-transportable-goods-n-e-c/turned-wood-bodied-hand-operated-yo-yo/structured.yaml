    rule: "Native Product flow for manufactured finished other toys, production mix at plant. Its complete comment lists multiple toy families, including string/spinning play articles; this broad identity is used only for this positively evidenced complete hand-operated wood-bodied yo-yo. It does not identify timber, a body half, a string, a hub kit, a musical instrument or a sports raw material. No native CAS, wood species, grade, exact supplier, life or quantitative toy specification is declared; require actual configuration and supplier evidence. Reference Mass uses Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 with kg. The physical numerator is the complete actual gross event leg V_i in the row native unit. Do not replace it by allocated burden, stock-corrected consumption, net shipment or an economic/service share. Record a separate real burden dimension once under the single-quotient rule; physical disclosure adds no purchase, provider burden or credit."
