      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | Rule | source_ids |\n| --- | --- | --- | --- |\n| alloc_framework | shared processes | Use attributional accounting only where allocation is appropriate to the declared goal/context. First collect exclusive operations or apply justified virtual subdivision to parts, material, energy and service exchanges. Factory process descriptions do not by themselves support an LCA allocation share. | `ilcd-attributional-2010` |\n| alloc_causality | remaining shared exchange | For every unresolved shared exchange identify and justify its determining physical causal relation to actual functions, including embodied material or specific real processing/service demand. Different exchanges may have different causal bases. Do not apply one blanket mass/economic share or arbitrary fixed ratio. | `ilcd-attributional-2010` |\n| alloc_residual | truly residual common process | Only genuinely remaining common-process exchanges lacking a determining physical relationship may use contemporaneous market value in the actual state/quantity and at the actual common-process gate. Justify the residual, price adjustments and uncertainty; downstream finished/packed/transported price is not automatically the common-gate value. No free choice or automatic coproduct/credit. | `ilcd-attributional-2010` |\n| alloc_loss | all waste failures and gross legs | Ordinary manufacturing waste/reject/sample sale or external treatment does not remove the manufacturing or treatment burden. A transfer T_other requires a real independent other cohort/function and justified once-only allocation/handover; physical gross remains whole. A burden vector allocation never scales packaging, FG, asset, part or fluid gross mass. | `ilcd-attributional-2010` |\n\n"
