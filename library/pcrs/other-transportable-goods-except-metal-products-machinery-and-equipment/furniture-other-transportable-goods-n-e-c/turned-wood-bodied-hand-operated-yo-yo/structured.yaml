system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "make"
      rule: "Include the complete real route from supplied stock and parts through first whole toy release, with all real setup/idle/cleanup, failed Q0, destructive tests, rejects and rework. Supplier drying/finishing and part manufacture remain upstream once; actual onsite operations cannot hide in a zero or purchased-finished-toy packing shortcut."
      source_ids:
        - enpu-yoyo-manufacture
        - psi-yoyo-kit-1998
        - csusa-turning-yoyo-2009
    - rule_id: boundary_q
      applies_to: "out_toy"
      rule: "Q is the sum of uniquely first-quality-released complete net toy kg including actual permanent components and retained water once, packaging excluded. Released closingFG is already within Q and never a second production output or manufacturing Bclose deduction. Shipment/return/retest/rework of previously released toys creates no new Q; Q0 retains all real undivided loads without a unit result."
      source_ids: []
    - rule_id: boundary_service
      applies_to: "service; pack; assets"
      rule: "Keep actual postrelease storage/handling/packing/dispatch and work on original cohort Qc with observed H. Incurred service does not carry forward merely because FG remains stored; only unused/unassigned service or charge can carry. Future unperformed service is unknown. Preserve whole original history once and all gross logistics."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: boundary_physical
      applies_to: "all processes"
      rule: "Every physical card uses complete gross leg V_i, not burden A, inventory difference or an economic/service share. Maintain independent material, FG, packaging, asset and fluid gates. Matched internal same-product/component/Q handoffs cancel at consolidation without external purchase or second Q. A whole supplied wet article/preparation and its component child masses require disjoint or reconciled non-additive bridges."
      source_ids: []
    - rule_id: boundary_pack
      applies_to: "pack"
      rule: "O + P + I + ER + J_in + H2O_in = C + S + EO + W + J_out + H2O_out. Every term in this physical balance is actual kg; item or m3 observations need an independently evidenced same-configuration mass or actual substance/state density conversion, while the original inventory exchange keeps its native unit. O and C are complete actual wet opening/closing empty, attached-WIP, attached-FG and reusable stocks. P/I/ER are disjoint whole-article inward legs; S is gross outward shipment, EO external return sent, W the actual whole wet discard. ER is external return received. J_in/J_out are independently measured non-water repair, replacement, residue or other material transfers across this packaging-pool boundary not already in those whole-article legs. H2O_in/H2O_out are independently measured actual water transfers across this pool boundary not already embodied in those legs; include natural adsorption/desorption without any repair. Split wet added/removed material into disjoint non-water J and H2O; no prescribed composition or density. Full wet W includes substrate/retained residues/water once, so its nested components are not additional J_out or H2O_out unless physically separated before the boundary. Matched internal pool transfers cancel on foreground consolidation and create no extra purchase, service or Q. All six legs have individual conditional cards; supplier-included ingress remains real and has one upstream owner. Internal attachment/reuse cancels. X deduplicates only overlap with OTHER same-side incoming/outgoing terms, never opposite legs or stocks. Keep new retained material/water ingress AND full wet closing mass. One mixed Waste outlet has non-additive independently measured origin W subaccounts, no duplicate outputs/treatment."
      source_ids: []
    - rule_id: boundary_water_species
      applies_to: "all processes"
      rule: "Measure whole physical mass and relevant elements independently of molecular/phase/reaction evidence. Separate actual supplied liquid, ambient moisture uptake/desorption, free/retained/structural/reaction water only when real; natural humidity is not repair. One residual cannot identify two unknowns; COD/VOC/NOx/PM/total carbon are not specific molecular masses. Keep each real N2/O2/Ar/H2O/CO2 and other molecule with source and medium; whole air plus child species cannot add twice."
      source_ids: []
    - rule_id: boundary_work
      applies_to: "service; assets"
      rule: "Manufacturer/specification permission and actual postwork test/acceptance/disposition govern continued qualification, not whether occurred logistics and burden are collected. Unauthorized, failed or rejected work remains fully counted on the original cohort with actual hold/waste state. Never assume broken wood can be restored; independently measure new/old parts and water."
      source_ids:
        - psi-yoyo-kit-1998
        - csusa-turning-yoyo-2009
    - rule_id: boundary_heat_assets
      applies_to: "assets; utilities"
      rule: "Separate actual full asset stock/gross transfers and current service burden; no fixed lifetime or whole machine per kg. Actual thermal supply requires independent carrier kg, phase/T/P/enthalpy and heat MJ with one water/energy ownership convention. External condensate or heat-exchange liquid Product return is retained if real; do not invent steam/boilers. Add each actual unlisted fuel/chemical/part/package/waste/species card before claiming complete coverage."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: boundary_claim
      applies_to: "dataset claims"
      rule: "This is manufacturing foreground plus separately disclosed actual original-cohort factory services. A cradle-to-gate claim requires compatible upstream stock/parts/preparations/transport/capital services and real waste treatment, with provider gaps explicit. Consumer use, downstream distribution and end of life require added stages; mass alone does not establish equivalent toy service."
      source_ids: []
