  - rule_id: validation_rule_45
    applies_to: "foreground_dataset_conformance"
    rule: "Separate external purchase P. Conditional on the actual material/event. P/I/ER are disjoint; retain supplier-included ingress and one upstream owner. Opening and closing include empty, WIP-attached, FG-attached and reusable pools. Internal reuse/attachment cancels. Whole wet article and incoming material/water retained in closing stock both remain. X only removes overlap with OTHER same-side incoming/outgoing observations; never a real retained increment, stocks or opposite-side legs. For this packaging-pool leg retain the disjoint actual non-water material increments J_in/J_out and water increments H2O_in/H2O_out under calc_pack, alongside complete wet O/C and full six legs. These are actual measured pool transfers, not extra purchases, allocation fractions or an inferred repair. Do not add water/material already in this whole wet leg again; natural humidity can occur with no repair. X only reconciles duplicate OTHER observations on the same side and leaves each real increment, C and the whole wet W intact. S is gross physical outward shipment, unrelated to net Q. One actual complete corrugated shipping carton, with declared construction, furnish, coatings, moisture and supplier. This concrete carton UUID is unresolved. An unspecified packaging basket is not a concrete carton identity; another native carton with fixed fibre composition cannot be used without actual composition evidence. Preserve Mass/kg and the actual complete carton six event legs; this is not a bag, pallet or packaging bundle. The physical numerator is the complete actual gross event leg V_i in the row native unit. Do not replace it by allocated burden, stock-corrected consumption, net shipment or an economic/service share. Record a separate real burden dimension once under the single-quotient rule; physical disclosure adds no purchase, provider burden or credit."
