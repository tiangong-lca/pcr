  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Retain original readings first. Convert actual kWh to MJ by 3.6; integrate only a genuine rate over its actual interval and never multiply an already integrated volume by time. Use independent substance/state density for a required volume-to-mass conversion, never a secondary flow coefficient or guessed item mass."
      inputs:
        - raw_readings
        - actual_state
        - independent_density
        - actual_interval
      output: "V_i; U_i"
      source_ids: []
    - id: calc_q
      applies_to: "out_toy"
      rule: "Q=sum calibrated complete net kg of uniquely first-released conforming toys; retain actual permanent components and water once; exclude removable packaging and unreleased/destroyed specimens. Released closingFG is already counted."
      inputs:
        - cp_release
      output: "Q"
      source_ids: []
    - id: calc_manufacture
      applies_to: "manufacturing burden dimension"
      rule: "For each exchange vector A_c=B_open+U-B_close-T_other. B covers raw/WIP and unused/unassigned nonWIP stores/service charge only, never already released FG or incurred service. U is actual new additions, not already stock-corrected consumption. T_other needs independent real other cohort/function and justified single handover; ordinary waste/sale does not qualify. If consumption is already stock-corrected use the equivalent ledger without a second stock deduction."
      inputs:
        - B_open
        - U
        - B_close
        - justified_T_other
        - cp_make
        - cp_utilities
        - cp_waste
      output: "A_c"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_service
      applies_to: "original-cohort service burden dimension"
      rule: "A_H=actual original-cohort increments+opening unused/unassigned charge-closing unused/unassigned charge-justified other-function handover. The original manufacture history is inherited once. Actual performed service is not subtracted because FG stays in store. Qc is original first-release cohort kg and H the observed horizon, not current shipment/return/reworked kg."
      inputs:
        - actual_increments
        - opening_unused_charge
        - closing_unused_charge
        - original_Qc
        - observed_H
        - cp_service
        - cp_pack
        - cp_assets
      output: "A_H"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_single_quotient
      applies_to: "all inventory rows"
      rule: "q=N/D once in each separate result dimension. Physical N=complete actual gross leg V_i; burden N=A_c or A_H separately. Manufacturing D=Q; actual original-cohort service and its related gross legs D=original Qc with declared H. out_toy is 1 kg reference. Q0 retains raw loads with no unit result. Cards and aggregation reference this same q without a second division, stock correction or economic scaling of V_i."
      inputs:
        - V_i
        - A_c
        - A_H
        - Q
        - original_Qc
        - observed_H
      output: "q_phys; q_b"
      source_ids: []
    - id: calc_pack
      applies_to: "pack"
      rule: "O + P + I + ER + J_in + H2O_in = C + S + EO + W + J_out + H2O_out. Every term in this physical balance is actual kg; item or m3 observations need an independently evidenced same-configuration mass or actual substance/state density conversion, while the original inventory exchange keeps its native unit. O and C are complete actual wet opening/closing empty, attached-WIP, attached-FG and reusable stocks. P/I/ER are disjoint whole-article inward legs; S is gross outward shipment, EO external return sent, W the actual whole wet discard. ER is external return received. J_in/J_out are independently measured non-water repair, replacement, residue or other material transfers across this packaging-pool boundary not already in those whole-article legs. H2O_in/H2O_out are independently measured actual water transfers across this pool boundary not already embodied in those legs; include natural adsorption/desorption without any repair. Split wet added/removed material into disjoint non-water J and H2O; no prescribed composition or density. Full wet W includes substrate/retained residues/water once, so its nested components are not additional J_out or H2O_out unless physically separated before the boundary. Matched internal pool transfers cancel on foreground consolidation and create no extra purchase, service or Q. Internal reuse/attachment cancels. Retain complete wet stocks and real retained ingress together. X only deduplicates other same-side incoming/outgoing terms. Mixed origin W is not added to the complete mixed outlet."
      inputs:
        - O
        - P
        - I
        - ER
        - J_in
        - H2O_in
        - C
        - S
        - EO
        - W
        - J_out
        - H2O_out
        - L_in_observed
        - L_out_observed
        - X_in
        - X_out
        - cp_pack
      output: "pool_residual"
      source_ids: []
    - id: calc_gates
      applies_to: "all physical streams"
      rule: "Manufacture: opening raw/WIP + actual disjoint incoming material/water/species = closing raw/WIP/unassigned stores + first-release Q + real waste/species outputs. FG/service: opening complete FG + internal Q handoff + external gross returns + disjoint new parts/water = closing FG/repairWIP + gross dispatch/external returns + real waste/species. Reconcile packaging/assets/fluids separately, then cancel all matched internal pairs once; Q plus closing releasedFG is not double production. Every actual packaging pool uses the complete disjoint J_in/J_out and H2O_in/H2O_out wet balance in calc_pack; duplicate observations cannot remove C or real increments."
      inputs:
        - opening_physical
        - actual_gross_in
        - closing_physical
        - actual_gross_out
        - internal_pairs
        - cp_make
        - cp_service
        - cp_pack
        - cp_assets
      output: "gate_residuals"
      source_ids: []
    - id: calc_species
      applies_to: "actual water species and elements"
      rule: "Independently reconcile whole wet/dry mass and relevant elements against evidenced species/phase/reaction states. No single residual fits two unknowns; preserve each independently measured gas gross inlet/outlet, moisture event and non-additive mixture bridge. Do not derive molecules from COD/VOC/PM/total element indicators."
      inputs:
        - measured_species
        - actual_phase
        - independent_state_evidence
        - cp_utilities
        - cp_make
        - cp_service
        - cp_assets
        - cp_pack
        - cp_waste
      output: "species_residuals"
      source_ids: []
  data_quality_requirements:
    - id: dq_native
      applies_to: "selected identities"
      requirement: "Require exact original identity and native extensive-property chains plus actual supplier/configuration compatibility; retain all restrictions in each consumed card, including localized basename and missing-translation disclosure."
      evidence: "Full public originals and actual supplier/drawing evidence"
    - id: dq_source
      applies_to: "source support"
      requirement: "Distinguish complete publisher originals, extracted native text, maker examples, technical synthesis and actual site observations. Manufacturer processes do not authorize LCA shares. No default formula, emission factor, life, density, mass or threshold from another product."
      evidence: "Complete original context and source-specific use assessment"
    - id: dq_raw
      applies_to: "all periods and pools"
      requirement: "Retain calibrated original readings, unit/state/time/site/configuration scope, sample uncertainty, all failures and Q0, signed stock counts and per-exchange inherited vectors. No estimate may masquerade as measurement."
      evidence: "Calibration, reconciled ledgers, test/release records and uncertainty"
    - id: dq_ownership
      applies_to: "gross and burden dimensions"
      requirement: "Disclose once-only upstream/treatment/service ownership separately from full physical gross. Preserve all actual service horizons/original cohorts and all unresolved identities/providers, assumptions and excluded lifecycle stages."
      evidence: "Provider links, bridge reconciliation and actual disposition evidence"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Lock the original cohort c and Qc=sum(m_e) across unique first conforming acceptance events e, where m_e is actual complete net wet kg at that event, including permanent supplied parts and string and excluding removable packaging. Current production Q is the Qc of the declared manufacturing cohort; Qc is never recomputed from later survivor, shipment, return or test mass. Preserve original failed/no-release Q0 loads separately. An opening accepted toy retains its original cohort and manufacture history; opening raw/WIP retains its inherited exchange vector and actual physical moisture/components once, not an additional new purchase."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "For each original accepted event, maintain one disjoint original-acceptance-basis location/status history: net external possession, on-site released FG, quarantine, repair/rework WIP, internal use, irreversible destroyed/lost portion, or another documented terminal disposition. An initial dispatch subsequently returned moves from external possession to the appropriate on-site state; gross dispatches and gross returns remain physical events, and a later re-dispatch moves the same surviving entitlement. Split partial losses and surviving portions on a documented original-acceptance basis without restoring lost water or parts to a survivor. The sum of disjoint current and terminal original-basis portions equals Qc, independently of present wet physical mass. Keep present wet mass, evaporation, removed/replacement parts, physical stocks and exits separately conserved. Rework, returns, retest, failed service, destruction after acceptance and a dry/wet-state change never create a new acceptance or erase the original Qc. Unresolved genealogy or loss assignment prevents a resolved normalized result; retain complete raw amounts."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "At each actual receiver transfer t record the full wet whole outlet Qt once: bag/filter/cloth/abrasive/toy substrate plus actually retained wood dust, adhesive, finish, liquid and water. Nested dry substrate, liquid and constituent ledgers are reconciled non-additive children; they are separate external outlets only if physically separated before the boundary with their own transfer IDs. Package W routed to a mixed outlet is a traced child of that outlet, not a second waste export or second provider demand. Receiver receipts and actual treatment demand remain Qt regardless of attribution."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "Assign environmental/service vectors A_tc to nonoverlapping original cohorts using demonstrated causal demand and the stated allocation hierarchy. Reconcile sum_c(A_tc) plus explicit other-function/unassigned vectors to the one actual total provider demand; missing assignments remain unresolved. Keep the full event Qt in the physical event register and link it to cohort reports; do not charge Qt once again to every cohort or label a fractional allocation as a smaller physical export. Manufacturing results use actual Q; postacceptance results use original Qc and observed H. Physical-context Vi/D disclosures are links to the one actual event and are non-additive across overlapping reports; treatment and service inventory is the independently attributed A_tc/D, never another full Qt/D for every cohort. Supplier-embedded treatment and an expanded direct treatment inventory are mutually exclusive representations of the same demand."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "The qualified route uses actual electrically driven machining/assembly and, when present, externally supplied heat with a real linked producer. The present route does not include on-site fuel combustion: an actual burner, kiln combustion, dryer or fuel-powered machine requires an expanded complete fuel/air/O2/products/species/heat method and its source evidence before this PCR can be applied to that route. Preserve the occurred loads while that route remains on hold; do not rename an on-site operation as purchased heat or set its fuel to zero. A real external heat/steam provider must represent the actual producer, complete fuel/air/combustion species, utilities, equipment and residues upstream; its carrier/condensate interfaces and foreground heat demand are retained once. No paper supplier gate may hide owned production. Supplier drying or part manufacture, actually provided transport and waste treatment likewise require complete compatible linked providers or fully expanded mutually exclusive inventories."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "For every actual long-lived lathe, drill, mandrel and maintained tool retain opening/receipts/external transfers/retirement/closing physical fleet and mass independently of service burden. Record actual service history, observed machine use, replacements and maintenance inputs/whole waste. Match the service provider unit and its actual capacity/history/usage to attributable demand; do not assume one whole machine per kg, a lifetime or a replacement interval. Own inherited production/WIP/provider history enters once. Complete purchased kit/component/preparation and its embedded production exclude separately adding its constituent production again; actual on-site preparation, finishing, cleanup and losses stay inside the foreground. Each additional actual atom receives a concrete separate card before complete coverage is claimed."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "The Enpu commercial case identifies birch and its own illustrated factory capability; it does not establish birch for the PSI or Craft Supplies configuration. The PSI original identifies its brass/gold-plated/epoxy-coated kit and sealed bearing configuration, whereas Craft Supplies separately illustrates hubs and axle, with dry hard wood examples. Preserve the exact actual supplied kit inclusion, material and finish; do not transfer a coating, alloy, glue recipe, species or bearing from one configuration to the other. The kit terminal alone is incomplete: both wooden halves, actual permanent axial parts and usable string must be completed before first toy acceptance. Internal faces and source-specific finishing/stringing restrictions remain attached to the corresponding configuration; no example size, dose, performance or life is a default."
    source_ids: []
  - rule_id: val_identity
    applies_to: "all inventory rows"
    rule: "Check the complete native basename/synonym/comment/CAS/grade/route/form/geography/media/type and every property/group/unit relation before binding. Positive complete primary toy evidence may constrain a compatible manufactured family without exact SKU/name equality; hard material/component/phase/route conflicts cannot be waived."
    source_ids:
      - un-cpc3-other-toys
  - rule_id: val_q
    applies_to: "cp_release; out_toy"
    rule: "Require unique first-release IDs, calibrated full net mass and complete BOM. Reject packaging in Q, duplicate released closingFG, delivery/retest as production and missing failed Q0. A net-delivery study needs its own complete G/R/original-delivery reversal D_rev and opening/closing FG historical-burden bridge; it cannot silently reuse this first-release method."
    source_ids: []
  - rule_id: val_numerator
    applies_to: "all inventory rows"
    rule: "Audit raw units/conversion before actual burden attribution and the sole quotient. Physical cards use full gross V_i independent of A_c/A_H, stock changes or allocation. Collection captures undivided readings; aggregation only references the computed result. Q0 has no unit result."
    source_ids: []
  - rule_id: val_closure
    applies_to: "all processes"
    rule: "Reconcile each raw/WIP/nonWIP physical gate and each inherited exchange vector, then FG, packaging six-leg pools, assets, parts, fluids, all real water and species. Keep retained influx/full wet closing mass; X cannot remove a stock. Internal handoffs and whole/component bridges cancel or remain non-additive exactly once. One mixed waste means one external outlet/provider. Every actual packaging pool uses the complete disjoint J_in/J_out and H2O_in/H2O_out wet balance in calc_pack; duplicate observations cannot remove C or real increments."
    source_ids: []
  - rule_id: val_permission
    applies_to: "service; assets"
    rule: "Check actual permission and posttests/acceptance/disposition for qualified continued use without erasing unauthorized/failed physical events or loads. Do not assume restoration/new Q. Incurred original-cohort service remains even if FG stays stored; future operations remain unknown."
    source_ids:
      - psi-yoyo-kit-1998
      - csusa-turning-yoyo-2009
  - rule_id: val_completeness
    applies_to: "dataset"
    rule: "Each actual additional purchase, utility, fuel, heat carrier, package, old/new part, waste outlet and molecule requires its own concrete atomic card and protocol. Unknown is not zero/not_applicable. Provider gaps and unfinished measurement remain explicit; engineering checks do not establish scientific, translation or applicability approval."
    source_ids: []
  - rule_id: validation_rule_14
    applies_to: "foreground_dataset_conformance"
    rule: "For the configuration following PSI, preserve the maker's matched body halves and even weight distribution, and its instruction to leave inner braking faces rough without finish sanding or polishing those faces. Its bearing configuration uses the actual selected double loop, triple loop or slip knot; these alternatives are not simultaneously extra strings. Follow actual drawing fit and retain mandrel tightening and surface restrictions; they are not a numerical torque or performance default. For the distinct Craft Supplies configuration preserve its dry hard wood selection and exclusion of sapwood/defects affecting balance, matching second-half shape, actual hub fit and the assembly instruction to avoid pinching the string. These are source-specific production conditions, not evidence that either configuration is certified or that every other two-half yo-yo uses the same mechanism."
    source_ids: []
  - rule_id: validation_rule_15
    applies_to: "foreground_dataset_conformance"
    rule: "O + P + I + ER + J_in + H2O_in = C + S + EO + W + J_out + H2O_out. Every term in this physical balance is actual kg; item or m3 observations need an independently evidenced same-configuration mass or actual substance/state density conversion, while the original inventory exchange keeps its native unit. O and C are complete actual wet opening/closing empty, attached-WIP, attached-FG and reusable stocks. P/I/ER are disjoint whole-article inward legs; S is gross outward shipment, EO external return sent, W the actual whole wet discard. ER is external return received. J_in/J_out are independently measured non-water repair, replacement, residue or other material transfers across this packaging-pool boundary not already in those whole-article legs. H2O_in/H2O_out are independently measured actual water transfers across this pool boundary not already embodied in those legs; include natural adsorption/desorption without any repair. Split wet added/removed material into disjoint non-water J and H2O; no prescribed composition or density. Full wet W includes substrate/retained residues/water once, so its nested components are not additional J_out or H2O_out unless physically separated before the boundary. Matched internal pool transfers cancel on foreground consolidation and create no extra purchase, service or Q."
    source_ids: []
  - rule_id: validation_rule_16
    applies_to: "foreground_dataset_conformance"
    rule: "The physical balance uses disjoint measured J and water terms. Its raw observation reconciliation is L_in_observed - X_in = P + I + ER + J_in + H2O_in and L_out_observed - X_out = S + EO + W + J_out + H2O_out. L_in_observed/L_out_observed are observation-side sums only, never extra inventory flows or provider demand. Each X must map by event, component, unit and side to a duplicated OTHER observation of a mass already counted once in the corresponding canonical side. After deduplication every real J/H2O remains once; X cannot cancel true retained ingress, C, O, an opposite-side leg or a nested W child merely because it is in stock. With disjoint raw observations X=0. Internal attachment/reuse alone is no boundary crossing; a transfer into this pool from an asset/repair-material pool has matched source/destination ledgers and is not another external purchase. No repair does not mean J or water is automatically zero: keep real deposited material and natural humidity if present; unknown values stay unresolved."
    source_ids: []
  - rule_id: validation_rule_17
    applies_to: "foreground_dataset_conformance"
    rule: "A wet new repair board or other article is measured independently into non-water J_in and water H2O_in without a default ratio. A real separated removed board/liquid has its own disjoint J_out/H2O_out or whole W, not both. Water already in O, C, P/I/ER/S/EO/W is nested content, not an added increment; uptake and loss after those observations are independently timed transfers. Keep water phase and volume convention, temperature/pressure and actual density evidence when converting the bound atmospheric resource m3 to kg. Do not assume liquid density, fit a residual or restore lost water into a survivor. Full physical package/repair/waste transfers and actual provider totals stay independent of original-cohort A/Qc/H attribution, inherited histories and zero-output loads."
    source_ids: []
  - rule_id: validation_rule_18
    applies_to: "foreground_dataset_conformance"
    rule: "Complete new hand-operated yo-yo toys with two turned solid-wood body halves, the actual axial joining arrangement and usable string, including all actually supplied permanent hubs/tubes/caps/axle and bearing when present. The reference terminal is the assembled playable toy at first complete quality release."
    source_ids: []
  - rule_id: validation_rule_19
    applies_to: "foreground_dataset_conformance"
    rule: "Exclude timber, separate body halves, loose hardware/string and incomplete kits as the terminal; integral one-piece carved bodies, plastic or metal main bodies, powered/electronic/light/sound toys, toy musical instruments, dolls, puzzles, ride-on toys and general sporting equipment are outside this selected PCR boundary. This selected route does not represent all other toys."
    source_ids: []
  - rule_id: validation_rule_20
    applies_to: "foreground_dataset_conformance"
    rule: "The complete Enpu product page establishes a commercial wood yo-yo terminal and a factory capability chain from raw material/sawing/turning through finishing, assembly, quality control, warehouse and loading. Its displayed capability stations are not proof that every station runs on every order. PSI gives a two-half brass-tube/hub/cap/axle/bearing/string configuration; Craft Supplies shows a hub-and-axle configuration without a separate bearing in its drawing. Keep these configurations distinct. This is a transparent technical synthesis across primary originals, not one contemporary SKU, plant recipe or measured order. Do not infer wood species from another maker, string fibre, hardware alloy/plating, adhesive or finish chemistry, electronics, counterweights, dimensions, mass, density, yield, operating setpoints, age, lifetime, certification or competition performance. Manufacturer example dimensions and assembly advice are configuration-specific evidence, not PCR defaults."
    source_ids: []
  - rule_id: validation_rule_21
    applies_to: "foreground_dataset_conformance"
    rule: "Native Product flow for manufactured finished other toys, production mix at plant. Its complete comment lists multiple toy families, including string/spinning play articles; this broad identity is used only for this positively evidenced complete hand-operated wood-bodied yo-yo. It does not identify timber, a body half, a string, a hub kit, a musical instrument or a sports raw material. No native CAS, wood species, grade, exact supplier, life or quantitative toy specification is declared; require actual configuration and supplier evidence. Reference Mass uses Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 with kg."
