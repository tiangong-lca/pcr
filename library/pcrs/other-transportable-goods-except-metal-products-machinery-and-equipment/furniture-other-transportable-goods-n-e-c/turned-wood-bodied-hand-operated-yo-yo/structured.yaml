    rule: "The make process contains the complete actual preparation/machining/finish/assembly/test sequence. Internal stage handoffs are paired and canceled; no extra external component output is necessary merely to show a stage. Every following card is conditional on its real atom/event, and preserves full physical V_i separately from once-only burden."
