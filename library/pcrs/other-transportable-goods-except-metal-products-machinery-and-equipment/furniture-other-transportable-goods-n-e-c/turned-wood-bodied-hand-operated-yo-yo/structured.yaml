published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared complete yo-yo manufacturing plus separately disclosed actual original-cohort factory services"
  allowed_use: "Same verified configuration/route/state and declared scope with compatible upstream/treatment provider links"
  excluded_use: "All-toys coverage; functional performance equivalence by kg; invented lifetime or safety approval; undemonstrated cradle-to-grave stages"
  required_metadata: "complete supplied toy BOM and revision; two-half wood construction and actual species/source/conditioning; actual axial configuration and bearing presence or absence; each actual tube/hub/cap/axle material and supply inclusion; actual string fibre/construction and supplied quantity; actual adhesive/finish preparation and make-buy route; manufacturer specification and actual test/release/disposition; unique first-release cohort and calibrated complete net wet Q; raw WIP and unassigned nonWIP physical stocks and inherited exchange vectors; released FG history and original service Qc with observed H; packaging six gross legs and one upstream owner; assets/parts/fluids and all real water phases; native identity/geography/media/property restrictions; actual site/period/utilities and all unresolved provider gaps"
  required_quality_disclosure: "All identities/providers/measurements unresolved; original data scope and uncertainty; gross versus burden dimensions; excluded stages; no invented values"
  update_trigger: "Actual BOM/material/axial mechanism/drying/finish/assembly/site/utility/provider or boundary change; revised primary evidence or correction"
