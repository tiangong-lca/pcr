    rule: "Native Elementary renewable material resource Water, in air with Volume/m3, group 93a60a57-a3c8-12da-a746-0800200c9a66. No official Chinese basename is supplied: retain Water, in air and disclose that absence. Measure actual H2O vapour volume and independent state-specific density if mass closure is needed; not liquid-water density, total humid-air volume or an assumed water coefficient. Ordinary storage/handling adsorption and actual operations are included when real, without inventing repair or permission. Retain complete wet closing stock plus actual influx. Assign each event to one disjoint stage/material pool. The physical numerator is the complete actual gross event leg V_i in the row native unit. Do not replace it by allocated burden, stock-corrected consumption, net shipment or an economic/service share. Record a separate real burden dimension once under the single-quotient rule; physical disclosure adds no purchase, provider burden or credit."
