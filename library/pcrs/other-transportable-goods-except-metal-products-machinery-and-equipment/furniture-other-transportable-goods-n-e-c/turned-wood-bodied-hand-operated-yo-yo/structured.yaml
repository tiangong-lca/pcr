    rule: "Native Elementary ordinary H2O vapour, CAS 7732-18-5, emission to air unspecified, Mass/kg, group 93a60a57-a4c8-11da-a746-0800200c9a66. Use only for actual gaseous water to that receiving medium; liquid effluent, product steam/condensate and water-resource uptake are different events. Alias lists contain other phases/isotopologues; those do not override the ordinary-water CAS and gaseous role. Include actual natural desorption as well as evaporation/other evidenced operation; no duplicate whole humid-air mixture and its H2O component. Do not assume all missing water evaporates. The physical numerator is the complete actual gross event leg V_i in the row native unit. Do not replace it by allocated burden, stock-corrected consumption, net shipment or an economic/service share. Record a separate real burden dimension once under the single-quotient rule; physical disclosure adds no purchase, provider burden or credit."
