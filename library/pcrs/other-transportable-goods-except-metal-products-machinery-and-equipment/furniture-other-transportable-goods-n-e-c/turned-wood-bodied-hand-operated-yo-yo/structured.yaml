allocation_rules:
  - rule_id: alloc_framework
    applies_to: "shared processes"
    rule: "Use attributional accounting only where allocation is appropriate to the declared goal/context. First collect exclusive operations or apply justified virtual subdivision to parts, material, energy and service exchanges. Factory process descriptions do not by themselves support an LCA allocation share."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: alloc_causality
    applies_to: "remaining shared exchange"
    rule: "For every unresolved shared exchange identify and justify its determining physical causal relation to actual functions, including embodied material or specific real processing/service demand. Different exchanges may have different causal bases. Do not apply one blanket mass/economic share or arbitrary fixed ratio."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: alloc_residual
    applies_to: "truly residual common process"
    rule: "Only genuinely remaining common-process exchanges lacking a determining physical relationship may use contemporaneous market value in the actual state/quantity and at the actual common-process gate. Justify the residual, price adjustments and uncertainty; downstream finished/packed/transported price is not automatically the common-gate value. No free choice or automatic coproduct/credit."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: alloc_loss
    applies_to: "all waste failures and gross legs"
    rule: "Ordinary manufacturing waste/reject/sample sale or external treatment does not remove the manufacturing or treatment burden. A transfer T_other requires a real independent other cohort/function and justified once-only allocation/handover; physical gross remains whole. A burden vector allocation never scales packaging, FG, asset, part or fluid gross mass."
    source_ids:
      - ilcd-attributional-2010
