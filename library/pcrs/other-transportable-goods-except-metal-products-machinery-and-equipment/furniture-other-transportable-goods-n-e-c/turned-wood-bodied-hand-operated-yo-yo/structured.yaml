    rule: "Use only a real separate external outlet with full mass, composition/contamination/moisture, recipient and one treatment provider. If actually mixed, constituent origin accounts are independently measured non-additive children of the one mixed outlet, not invented separate exits. Ordinary manufacturing rejects, samples, broken pieces, offcuts and waste sold or sent away retain their manufacturing/treatment burden unless a real independent other cohort/function and justified handover transfer it once. Product wood identity does not establish a Waste identity. This concrete atomic flow identity remains unconfirmed. Qualify actual composition/form/phase/route/grade/geography/medium/type and compatible native extensive property before dataset binding; bounded queries do not prove database absence. The physical numerator is the complete actual gross event leg V_i in the row native unit. Do not replace it by allocated burden, stock-corrected consumption, net shipment or an economic/service share. Record a separate real burden dimension once under the single-quotient rule; physical disclosure adds no purchase, provider burden or credit."
