product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.furniture-other-transportable-goods-n-e-c.uv-finished-jute-backed-linoleum-rolls"
  classification_refs: "CPC 3.0 38930; narrower product and route boundary"
  covered_products: "Complete compact woven-jute-backed linoleum flooring rolls with fully factory-cured waterborne UV finish"
  excluded_products: "PVC/vinyl; bitumen/roofing/waterproof felt; unfinished binder; separate backing; foam/acoustic/click composites; furniture linoleum; installed floor; purchased-finished-roll repacking"
  representative_product: "One specified compact roll grade with oxidized linseed-oil/rosin binder; actual declared tall oil and each flour/filler/pigment; woven jute and a double-layer whole waterborne UV formulation system; no fixed recipe or size"
  production_route: "Receipt → actual-owner cement oxidation/maturation → mixing/granulation → calender/backing consolidation → curing → factory finish and cure → trim/cut/roll/test → first quality release; separately observed FG services"
  market_state: "Complete conditioned factory-finished rolls at first quality release; detachable cores and transport packaging excluded from net product mass"
functional_unit:
  what: "Manufacture specified resilient linoleum flooring for separately modelled installation"
  how_much: "1 kg net newly first-quality-released complete linoleum"
  how_well: "Actual declared binder/body/backing/finish construction; conditioned dimensions and net mass; grade-specific thickness, indentation, dimensional stability, adhesion, cure and declared fire/slip/emission test evidence; no universal threshold or certification"
  how_long_or_cycle: "One unique first-release cohort and disclosed observed FG service interval; no assumed installed service life"
  reference_flow_link: "released_roll"
system_boundary:
  rules:
    - rule_id: complete_route
      applies_to: "all manufacture"
      rule: "Include receipt and handling, actual-owner oxidative cement preparation and maturation, flour/mineral/pigment batching and mixing, granulation, jute calendering/consolidation, oxidative curing, complete surface coating/drying/UV cure, trim/cut/roll, conditioning/tests and first quality release. Count actual test/destructive samples and unsuccessful runs. Finished-roll repacking cannot replace these operations."
      source_ids:
        - forbo-marmoleum-2018
        - tarkett-linoleum-2018
    - rule_id: owner_once
      applies_to: "supplier and onsite operations"
      rule: "For supplier-prepared cement/coating/backing/flour, require full upstream activity and state and one owner. Do not repeat supplier oxidation, ingredient manufacture or formulation already embedded in a purchased whole preparation; separately include all actual further onsite processing, utilities and losses. Supplier data missing is a disclosed dataset gap, not permission to omit burdens or invent a plant route."
      source_ids:
        - forbo-marmoleum-2018
        - tarkett-linoleum-2018
    - rule_id: first_gate
      applies_to: "Q and FG service gates"
      rule: "Q ends at unique first quality release. Closing released FG is already in Q; shipping, authorization, retesting and customer returns never create a new Q. Retain actual packaging/storage/handling/dispatch and return/rework over observed H against original release Qc, including opening and closing FG. Carry historical burden vectors; only real incremental rework is added, and any reversal of an original delivery is explicitly linked. Do not annualize H or divide it again. Consolidated gates cancel the internal released-Q transfer."
      source_ids:
        - forbo-marmoleum-2018
        - jrc-ilcd-2010
    - rule_id: stocks_and_events
      applies_to: "all operations and exchanges"
      rule: "Retain every failed/start-stop/idle/cleanup/test/treatment event including Q=0. Separate unused raw stock and genuine nonWIP entities from actual opening/closing WIP and released FG. Transfer each physical stock with its own historical exchange vector; do not deduct stock twice from an already net numerator or substitute current recipe for old WIP. A release/acceptance flag cannot erase a physical event or burden."
      source_ids:
        - forbo-marmoleum-2018
        - jrc-ilcd-2010
    - rule_id: atomic_extension
      applies_to: "all actual materials and destinations"
      rule: "Cards are individually conditional atomic exchanges. Add each actual unlisted raw ingredient, full formulation, pigment, coating component purchased onsite, fuel, refrigerant, water supply, package, waste, molecule and destination as its own card before modelling. Demonstrated absence permits not_applicable, never a default zero. No other-material/energy/VOC aggregate may conceal real manufacture. Actual surface recipes and any catalysts/driers need supplier identity and separate procurement ownership."
      source_ids:
        - forbo-marmoleum-2018
        - tarkett-linoleum-2018
    - rule_id: physical_gates
      applies_to: "manufacturing, FG and consolidated physical ledgers"
      rule: "Reconcile each gate independently with real gross quantities, disjoint constituent masses, inventory and external returns; cancel only matching internal transfers. Physical V/native-unit/Q or original Qc is independent of burden A, stock valuation and economic allocation. Supplier heat-water agreements define external Product steam/hot-water carriers and actual condensate/circuit returns with inlet/return enthalpy; do not assume an absent boiler, steam loop or water return. External waste retains one provider per actual consignment."
      source_ids:
        - forbo-marmoleum-2018
        - tarkett-linoleum-2018
        - jrc-ilcd-2010
boundary_abstraction:
  declared_starting_condition: "Actual separately supplied linseed oil, rosin/tall oil, each flour/filler/pigment, woven backing and complete wet coatings; or traceable supplier-preoxidized complete cement with full upstream"
  starting_condition_role: "Physical purchased product inputs before complete flooring manufacture; never bought finished flooring packaging only"
  product_classification_scope: "CPC 3.0:38930, selected complete compact jute-backed factory-finished linoleum rolls"
  recursive_input_rule: "Internal cement, granulate, sheet and clean trim handoffs cancel with measured inherited exchange vectors; external preoxidized cement/recovered linoleum carries one explicit supplier boundary and upstream owner"
  upstream_dataset_requirement: "Complete state/route/geography-compatible extraction/refining/resin recovery, flour production, filler/pigment manufacture, woven-jute supply, coating preparation, utilities, packaging and treatment; identify actual owner and exclude duplicate unit operations"
  disclosure: "Site and time, recipe/grade, supplier/onsite ownership, full route/operation coverage, gross physical and attributed-burden gates, stocks/cohorts, utilities and returns, packaging service interval, uncertainty and actual omissions"
