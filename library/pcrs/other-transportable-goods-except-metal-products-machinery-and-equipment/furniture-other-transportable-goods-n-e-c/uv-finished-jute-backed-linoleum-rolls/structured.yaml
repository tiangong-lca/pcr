measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the sum of unique new first-quality-release net masses after conditioning, including body, woven backing and retained cured finish, excluding detachable core/packages. Retain actual gross/tare calibration, conditioning and cohort records under cp_release. Closing FG already released belongs in Q; it is not added again as another production output."
  - id: geometry_bridge
    applies_to: "reference product"
    required_property_ref:
      name: "Measured net mass and geometry"
      uuid: ""
    required_unit: "kg; m2; m3"
    rule: "Measure net mass and finished usable width/length/profile on the same conditioned complete rolls or representative traceable samples. Derive mass/area from independent measurements; record actual thickness profile if a volume bridge is needed. Roll count or nominal catalogue thickness cannot supply kg. Never infer measured density or mass/area from a native secondary conversion."
  - id: raw_units
    applies_to: "all physical exchanges"
    required_property_ref:
      name: "Actual native physical property"
      uuid: ""
    required_unit: "actual unit"
    rule: "Preserve original quantity units and independent state-specific conversion data before attribution. Convert measured kWh to MJ with 3.6 MJ/kWh only as an exact unit conversion. Integrate genuine rates once; an integrated gas/liquid volume is already a quantity. Density is measured for that substance at the stated composition, pressure and temperature, never borrowed from water."
  - id: one_division
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Attributed raw numerator and reference mass"
      uuid: ""
    required_unit: "native unit/kg"
    rule: "Protocols collect unnormalised raw quantities. Convert units, reconcile stock/inherited vectors and determine attribution first. Section8 contains the sole A/Q (or service A/Qc) division; every card and protocol aggregation references that same result, not another division. Q=0 keeps real burdens/flows and pending attribution, without a unit result. H is an observed interval and is not a second divisor."
  - id: wet_bridge
    applies_to: "wet formulations and complete articles"
    required_property_ref:
      name: "Whole quantity OR exclusive constituents"
      uuid: ""
    required_unit: "kg"
    rule: "Use a whole wet supply/article mass OR a mutually exclusive constituent bridge on that same side of the same physical gate. Assay/active/solids/carrier water and coating layers are subaccounts, not additive purchases. X removes only an independently observed OTHER same-side duplicate already represented by another quantity there; real independent material/water/reaction interfaces remain explicit and are never fitted or subtracted as X."
