allocation_rules:
  - rule_id: attributional_context
    applies_to: "multifunctional unit processes"
    rule: "Apply this hierarchy only for an attributional study context requiring allocation; document that context and the actual multifunctionality. Industrial process evidence does not authorize allocation. Do not freely switch physical/economic rules or import a source EPD substitution/energy-credit formula."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: subdivide_first
    applies_to: "each non-functional exchange"
    rule: "Assign dedicated lines, batch materials, test and finishing burdens directly; first attempt actual subdivision, then partial/virtual subdivision from quantified technological relationships. Separate embodiment from genuinely joint residual burdens; document why unavailable subdivision matters."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: determining_causality
    applies_to: "remaining exchange-specific joint burdens"
    rule: "Identify the determining physical causal relationship for each individual exchange, explaining how changed functions change its quantity. Storage may depend on observed occupied area/volume and time; heating material may depend on its actual heat capacity/state; coating may depend on actual treated area. These are hypotheses to test, not universal mass/area/time allocation keys. Different exchanges can need different relationships."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: residual_value
    applies_to: "only demonstrably unresolved common process burdens"
    rule: "Only after justified absence of a determining physical relationship, apportion the actual remaining common process burden with contemporaneous market values at the same process exit/entry gate and actual supplied state, quality and quantity. Derive net gate value where downstream transport/conditioning/packaging is included in a quoted price; document periods, shares and sensitivity. No fixed ratio, retail-price shortcut or automatic saleable-waste credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: physical_no_credit
    applies_to: "internal loops, waste and service quantities"
    rule: "Keep unallocated physical material/species/packaging ledgers separate from attributed burdens. Grinding/reuse cancels internal handoffs without new purchased material or automatic avoided-product/heat credit. A sale is not itself evidence of co-product allocation or recycling approval. Identify true joint process and waste/product status; any separate recycling method needs applicable evidence. Never multiply physical output, waste consignment or gross service movement by an allocation share."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "p_linoleum"
      flow_role: "released_roll"
      record_type: "weighing and release"
      raw_fields: "cohort_id; roll_id; grade; conditioning; gross_mass; core_tare; package_tare; net_mass; first_release_time; test_id; duplicate_release_flag; Q; Qc; original Q0 lock; disjoint remaining delivery/on-site accepted/loss/other terminal fates on original basis; current wet mass/state; all gross loops; historical own/provider A vectors; net-delivery bridge"
      collection_method: "Use calibrated scales and traceable tare for the same complete conditioned rolls. Record actual grade-specific mechanical/dimensional/adhesion/cure and claimed fire/slip/emission acceptance tests. Deduplicate unique first release; exclude destructive samples from Q and include their real burdens. Record closing released FG within Q once."
      unit: "kg"
      frequency: "each roll and release event"
      temporal_coverage: "complete release cohort and period"
      site_scope: "factory release gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; tare records; acceptance and serial register"
    - protocol_id: cp_geometry
      process_id: "p_linoleum"
      flow_role: "released_roll"
      record_type: "geometry and mass bridge"
      raw_fields: "roll_id; grade; conditioning; sample_plan; measured_width; measured_length; thickness_profile; independently_weighed_mass; excluded_tare; measurement_uncertainty"
      collection_method: "Measure the same finished conditioned construction; integrate actual usable profile where nonuniform. Independently weigh matching samples for mass/area or density, without adopting catalogue or native secondary coefficients. Record measurement coverage and representativeness."
      unit: "kg; m; m2; m3"
      frequency: "each grade and representative lot"
      temporal_coverage: "same release cohort"
      site_scope: "same complete finished rolls"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "dimension instruments; scale calibration; sample linkage"
    - protocol_id: cp_material
      process_id: "p_linoleum"
      flow_role: "each material card"
      record_type: "purchases and issues"
      raw_fields: "event_id; operation; cohort_id; row_id; supplier_lot; whole_formula; supplied_state; receipt; actual_issue; unused_open; unused_close; unused_external_return; assay; water; solids; upstream_owner; already_net_flag"
      collection_method: "Weigh actual whole receipts and issues in original units; reconcile unused stock once. Keep supplier specifications and process inventories. Separate each flour/pigment and each supplied formulation; dry assay/carrier water are non-additive. Internal trim/cement/sheet transfer uses cp_stock and no second procurement."
      unit: "actual raw unit"
      frequency: "each purchase/issue/batch"
      temporal_coverage: "full production period including failures"
      site_scope: "receipt and actual manufacturing owner"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; supplier specification; upstream boundary; stock reconciliation"
    - protocol_id: cp_utilities
      process_id: "p_linoleum"
      flow_role: "each utility and auxiliary card"
      record_type: "meters and utility states"
      raw_fields: "event_id; cohort_id; operation; row_id; meter_open; meter_close; raw_unit; rate_flag; integrated_volume; interval; composition; temperature; pressure; density_measurement; LHV; inlet_enthalpy; return_enthalpy; supplier_water_energy_agreement; direct_or_purchased; idle; cleanup"
      collection_method: "Read bounded real meters for every actual stage and utility conversion, including start/stop, idle, ventilation, grinding, tests, cleaning and FG services. Collect raw unnormalised quantities, calibration and independent density/thermal measurements. Keep fuel and purchased heat ownership exclusive; distinguish steam, liquid water and genuine external Product returns."
      unit: "actual raw unit"
      frequency: "meter interval and every event"
      temporal_coverage: "full period plus observed service H"
      site_scope: "each owned utility and delivery/return gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; time/state records; supplier coverage; raw invoices"
    - protocol_id: cp_stock
      process_id: "p_linoleum"
      flow_role: "all physical gates"
      record_type: "stock and inherited vectors"
      raw_fields: "entity_id; cohort_id; row_id; operation; gate; actual_state; raw_or_WIP_or_nonWIP_or_FG; opening_quantity; closing_quantity; internal_handoff_id; external_return_id; historical_exchange_vector; already_net_flag; rework_event; destructive_test; failure; Q_zero"
      collection_method: "Physically count/weigh stocks at matched gates and times; preserve each inherited exchange vector and reconcile actual WIP handoffs, recovery loops and incremental rework. Separate unused raw/nonWIP entities. No current recipe may replace historical WIP/FG burdens; no event disappears on acceptance."
      unit: "actual raw unit"
      frequency: "every stock boundary and transfer"
      temporal_coverage: "opening through closing and historical cohorts"
      site_scope: "manufacturing; FG; consolidated gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "physical counts; historical vector provenance; matching IDs"
    - protocol_id: cp_species
      process_id: "p_linoleum"
      flow_role: "each air and water species"
      record_type: "independent physical and species measurements"
      raw_fields: "event_id; operation; cohort_id; molecule; CAS; medium; phase; carbon_origin; inlet_or_outlet; raw_concentration; raw_flow; rate_or_integral; interval; sample_blank; detection_limit; oxygen_uptake_observation; water_observation; independent_element_analysis; capture_destination; uncertainty"
      collection_method: "Measure actual inlet/outlet air composition/flow/humidity and identify molecular species with appropriate calibrated sampling/speciation, including treatment. Separate chemical reaction water from feed/structural/free water and evaporation/condensation with independent evidence; separately analyse carbon/hydrogen/oxygen and retained composition. Record measured absence/LOD and unknowns explicitly. No one residual estimates two unknowns; no VOC/PM/COD indicator is assigned to a molecule."
      unit: "actual raw unit"
      frequency: "representative event-integrated samples and continuous meters"
      temporal_coverage: "full production and observed treatment/service periods"
      site_scope: "each physical gas/liquid/species gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "analytical calibration; blanks; chromatograms; state/flow records; carbon-source evidence"
    - protocol_id: cp_waste
      process_id: "p_linoleum"
      flow_role: "each waste card"
      record_type: "external consignment and treatment"
      raw_fields: "consignment_id; operation; cohort_id; row_id; waste_or_product_status; wet_mass; independent_dry_mass; moisture; originW; W_control_total; internal_reuse_id; external_provider; treatment_boundary; measured_species; contamination"
      collection_method: "Weigh each actual separated external waste with one provider. Where genuinely commingled linoleum waste exists, use one measured W OR measured originW subaccounts, not both as additive provider feeds. Include actual onsite treatment inputs/outputs; otherwise supplier owns downstream treatment. Sale never proves credit."
      unit: "actual raw unit"
      frequency: "every waste transfer and treatment event"
      temporal_coverage: "complete period including Q=0"
      site_scope: "actual waste/treatment boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; provider receipt; status evidence; treatment records"
    - protocol_id: cp_service
      process_id: "p_linoleum"
      flow_role: "each original released cohort"
      record_type: "observed FG service"
      raw_fields: "cohort_id; Qc; original_release_id; observed_H_start; observed_H_end; opening_FG; closing_FG; gross_dispatch_V; external_return; original_delivery_reversal; incremental_rework; physical_unit; distance; occupied_space; actual_duration; raw_service_meter"
      collection_method: "Link actual warehouse/handling/dispatch/return records and raw services to original cohort Qc and observed H. Carry historical FG vectors without adding original manufacture again. Measure real gross movements independently of burden allocation or price; H is not divided a second time."
      unit: "actual raw unit"
      frequency: "every service event and observed stock interval"
      temporal_coverage: "actual H only"
      site_scope: "released FG service gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "release linkage; time/space logs; shipment and return records"
    - protocol_id: cp_pack
      process_id: "p_linoleum"
      flow_role: "each packaging card"
      record_type: "separate physical package ledger"
      raw_fields: "article_id; cohort_id; row_id; composition; tare; opening_empty; opening_WIP_attached; opening_FG_attached; opening_reusable; purchase; external_return_received; closing_empty; closing_WIP_attached; closing_FG_attached; closing_reusable; gross_attached_shipped; external_return_sent; waste; internal_reuse; provider; F_open; P; I; ER_in; J_in; H2O_in; C_in; X_in; F_close; S_gross; EO_out; W_whole; J_out; H2O_out; C_out; X_out; nested_component_ids; same_side_duplicate_record_ids; O_in; O_out; OTHER_atomic_row_ids; observed_overlap_links"
      collection_method: "Count/weigh each packaging material separately and convert count with independently weighed actual article tare. Reconcile all empty/attached/reusable states and every gross physical movement, including repeats; internal reuse cancels. No package mass enters net Q; upstream purchases are unique."
      unit: "actual raw unit"
      frequency: "every package movement and stock boundary"
      temporal_coverage: "production plus actual observed service H"
      site_scope: "each package and manufacturing/FG/consolidated gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stock counts; tare tests; supplier invoices; return and waste receipts"
    - protocol_id: cp_fleet
      process_id: "p_linoleum"
      flow_role: "fleet_history"
      record_type: "foreground_record"
      raw_fields: "asset ID; complete measured configuration/M; original provider/reference unit; original own/provider vectors; all physical opening/receipt/return/repair/replacement/retirement/closing; measured use and capacity; service-driver denominator; retained contamination; original cohorts; unassigned service"
      collection_method: "Inventory the complete actual production, handling, storage, control, maintenance, test and measurement fleet, not only the main machine. For each actual configured asset or reusable cloth/filter article, independently collect complete physical mass M and all real constituents/attachments, opening/closing stock, receipts, returns, repairs, replacement parts, retirement, retained contamination and actual use/capacity. M is measured, never a numeric default or camera/machine count. Conserve that full physical fleet separately from attributed service burdens; repeated use is not repeated purchase and a burden share never shrinks physical returns or retirement. The provider may reference kg, item, operating hour or another real unit: retain its exact unit/period/configuration and use actual measured count-mass or service-capacity conversion with a demonstrated denominator. No universal lifetime or capacity fraction is assumed. Original provider/own history stays with every transfer once. Add every real supporting device and identified replacement/maintenance consumable atomically; a bare main-asset UUID cannot stand for a different full fleet."
      unit: "kg; actual provider unit"
      frequency: "Each actual event/measured interval"
      temporal_coverage: "Complete original cohorts/observed H including failed/zero-output"
      site_scope: "Actual owner/final outlet/receiver gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Raw calibration/custody/full programme/provider unit and uncertainty"
    - protocol_id: cp_ftir
      process_id: "p_linoleum"
      flow_role: "ftir_programme"
      record_type: "foreground_record"
      raw_fields: "target/CAS/phase; interferants; reference spectrum/certificate; original interferograms; path/resolution/T/P; background/CTS/noise/MAU; heated line/filter/conditioning; native/spike/tracer background and raw flows; leaks/response; 12 paired validation samples when applicable; recovery/bias/uncertainty; actual final gas flow; original cohort"
      collection_method: "For actual infrared-active vapor-phase aldehydes and other identified target gases, Method320 and its complete FTIR Protocol provide a real procedure, not merely a method title. Establish target/interferant reference spectra (Protocol4.6 if absent), instrument resolution/path/temperature/pressure and spectral regions, background/CTS checks, RMS noise/MAU/analytical uncertainty, heated inert probe/line/cell and actual particulate exclusion, leaks, response time and preserved raw interferograms. Water/CO2 overlap, adsorption, reaction and unintended condensation must be checked. Use Method320 pre-test QA spikes and the full 12-spiked/12-unspiked validation branch with bias/precision evaluation where required; recondition/retest or reject failing data. A condenser/dilution is permitted only with the actual through-train recovery and sample-conditioning validation, or a valid parallel conditioned/unconditioned comparison; do not discard captured analyte and still claim original whole-gas concentration. The Protocol and all appendices in the complete 50-page original remain part of this method. Actual spectra, calibration and matrix tests are study qualification, not evidence that no analytical programme exists. No site is asserted already qualified."
      unit: "actual concentration; measured gas quantity; kg"
      frequency: "Each actual event/measured interval"
      temporal_coverage: "Complete original cohorts/observed H including failed/zero-output"
      site_scope: "Actual owner/final outlet/receiver gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Raw calibration/custody/full programme/provider unit and uncertainty"
    - protocol_id: cp_stack
      process_id: "p_linoleum"
      flow_role: "flow_and_PM"
      record_type: "foreground_record"
      raw_fields: "duct geometry/traverse/cyclonic condition; pitot/meter calibration; gas composition/moisture/T/P; nozzle/isokinetic series; leaks; front-half/filter raw tare/recovered mass; blanks; actual dry standard volume; particulate material/phase characterization; whole receiver Qt; final controls; original cohort"
      collection_method: "Actual stack-flow/PM work must include the complete Methods1–3 and5 dependencies: suitable actual traverse geometry and cyclonic/small-duct exclusions; calibrated pitot/meter and measured temperature/pressure, gas composition and moisture; leak checks, nozzle/isokinetic conditions, blanks, complete front-half/filter recovery, gravimetry and actual dry-standard-volume calculations. Method5 measures its defined heated-filterable particulate fraction; it is not a molecular assay or proof for wet mist/condensable aerosol or all PM sizes. Retain actual total collected whole particulate and the separate supported material/species characterization; bulk linoleum recipe is not emitted dust composition. Method3's restricted dry-molecular-weight calculation and residual N2+CO fraction do not establish pure N2 or Ar; its assumed gas weight is not a measured factory value. No generic VOC/PM/COD indicator or one residual is assigned to a molecule. If actual droplets, wet aerosol or condensables matter and an applicable complete collection/phase/analysis procedure is not established, preserve that specific essential hold rather than claim total-PM closure."
      unit: "kg; actual gas volume and flow unit"
      frequency: "Each actual event/measured interval"
      temporal_coverage: "Complete original cohorts/observed H including failed/zero-output"
      site_scope: "Actual owner/final outlet/receiver gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Raw calibration/custody/full programme/provider unit and uncertainty"
    - protocol_id: cp_gas_gc
      process_id: "p_linoleum"
      flow_role: "non_IR_gases"
      record_type: "foreground_record"
      raw_fields: "original inlet/final outlet sample ID and phase; native/background; probe/container/loop; actual T/P/collection/storage time; conditioning and separate water receiver; gas volume/flow/dilution; certified Ar/O2/N2 component concentrations spanning samples; multipoint calibration/raw areas/regression; baseline separation/interference; blank/carryover; duplicates; direct/full-path/before-after conditioning/holding paired recoveries; independent introduced Ar amount; uncertainty and failure decision; original cohort"
      collection_method: "Do not use FTIR for homonuclear N2/O2 or monatomic Ar. For the actual carrier-air inlet/outlet account, the following is an independent combined GC-TCD measurement programme, not a claim of a published Ar stack validation or regulatory Method3C conformity. First define actual final outlet, inlet/background, wet/dry measurand, target gas range, phases and uncertainty objectives; the EPDs do not establish additional Ar generation or a fixed air composition. (1) Use the complete Method3 inert probe, representative sample, purge, leak-checked constant-flow collection and sealed identified gas-container procedure. Record actual T/P, flow/volume and elapsed collection/storage; choose inert materials that do not remove the target gases. Preserve simultaneous unconditioned and conditioned sample provenance; document every condenser/filter/dryer and actual separated receiver mass. (2) Use actual GC-TCD columns with measured Ar/O2 separation under the real sample matrix. The Agilent2022 Molsieve/backflush configuration is a demonstrated separation starting point, not a default setting or proof at every loading. Verify actual Ar and O2 standards separately and together with N2/CO2/H2O and every real interferant; dilute only with measured certified gas and preserved mole-amount basis, never atmospheric ratios. (3) Extend Method3C's explicit per-compound calibration framework to Ar: traceable certified Ar standards at at least three actual concentrations bracketing the final measured range, matrix/zero blanks, calibrated loop/sample T/P and identical gas-state basis, component-specific response regression, triplicate check standard and duplicate sample injections. Apply the source Method3C calibration-verification/recalibration and duplicate-agreement conditions to the declared composite programme; label that choice as author synthesis, not a reported Ar result. Retain standard certificates, slopes/intercepts, residuals, range, spectra/chromatograms and uncertainty. (4) Challenge the complete actual probe/transport/conditioning path with a traceable known Ar addition upstream and matched no-addition samples, and compare a direct standard bypass with the same standard through the full path. Perform separate before/after-conditioning comparisons on the same original-gas basis; account for measured added gas, collection pressure/temperature, water removal and actual dilution. Net Ar recovery is the difference in reconstructed downstream Ar mole amounts between matched spiked and unspiked runs divided by independently introduced Ar moles; use the measured native background and actual time/flow, not a single concentration subtraction at unequal flow. Retain blank/container carryover, repeated path recoveries and holding-time paired samples; never copy the note's single-standard LOD or recoveries for other gases. (5) Before testing fix the uncertainty-based acceptance plan, full-path/background controls and repeatability/calibration checks. Reject or repair/retest when Ar/O2 cannot be resolved, the actual range is uncalibrated, blanks/carryover invalidate identity, drift/duplicates fail the adopted Method3C conditions, or unexplained loss/enrichment exceeds the declared combined uncertainty. No generic recovery percentage is invented. (6) Only accepted data provide separately measured dry/wet mole fractions and measured total gas amount/flow on the same state basis; convert each molecule using its own molar mass and actual state/dilution, reconcile inlet/pass-through separately from generated/consumed species. This gives a specified procedure and failure path. Its independent scientific applicability and actual site QA remain separate; absence of actual execution alone does not mean there is no programme. If an actual necessary original-phase capture or conditioning branch cannot be specified or fails these tests, hold that dependent result, preserve all real physical air legs and unknowns, and do not claim Ar closure or remove the source by paper outsourcing."
      unit: "actual gas concentration; measured gas amount; kg"
      frequency: "Each actual event/measured interval"
      temporal_coverage: "Complete original cohorts/observed H including failed/zero-output"
      site_scope: "Actual owner/final outlet/receiver gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Raw calibration/custody/full programme/provider unit and uncertainty"
    - protocol_id: cp_qt
      process_id: "p_linoleum"
      flow_role: "whole_waste_Qt"
      record_type: "foreground_record"
      raw_fields: "consignment ID; entire wet physical Qt; receiver measured quantity; nested dry tare and retained powder/liquor/water; actual receiver and provider reference unit; transport; actual own/provider complete treatment; original and old cohort Q0; disjoint service demands and inherited A vectors; unassigned residual; no double provider feed"
      collection_method: "For each actual receiver consignment t record full physical wet Qt independently of any allocation or original cohort. It includes the entire contaminated substrate/cartridge/cloth/package and its retained dust, liquor and water once; dry tare and retained constituents are nested assays unless physically separated before that gate. Keep its measured receipt, actual receiver, transport and complete treatment boundary/reference unit. One whole mixed Qt OR mutually exclusive origin masses reconciled to Qt feeds the physical provider once. Independently assign nonoverlapping treatment-service/burden demands to all real original cohorts, old cohorts and non-product causes, retaining their original Q0,c and inherited A_e vectors; undistributed demand stays explicit. A 10 kg consignment with a 25% cohort burden share remains 10 kg physical transfer, not 2.5 kg, and is not charged 10 kg again to each cohort. If the provider reference is volume, item or treatment service, establish actual composition/state or service conversion; do not assume kg-provider compatibility. Include own treatment inputs, controls and outputs once, or the complete external treatment inventory once; never provider-embedded history plus the same decomposed treatment again."
      unit: "kg wet; actual provider unit"
      frequency: "Each actual event/measured interval"
      temporal_coverage: "Complete original cohorts/observed H including failed/zero-output"
      site_scope: "Actual owner/final outlet/receiver gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Raw calibration/custody/full programme/provider unit and uncertainty"
  calculation_rules:
    - id: raw_convert
      applies_to: "all inventory rows"
      rule: "Convert raw records to each actual native quantity before attribution. For a rate integrate over measured time once; for an integrated volume retain that volume. Use independent substance/state density for mass conversion and real inlet/return enthalpy for heat. No native non-reference meanValue creates a measured factory property."
      inputs:
        - raw_quantity
        - raw_unit
        - rate_flag
        - interval
        - independently_measured_state_property
      output: "V_native"
      source_ids:
        - forbo-marmoleum-2018
        - tarkett-linoleum-2018
    - id: raw_stock_attribution
      applies_to: "all inventory rows"
      rule: "For an unused raw-stock balance, use actual opening plus receipts plus external returns received minus actual closing minus unused external returns sent to derive issues, unless already net measured. For each exchange vector, combine real assigned new activity with inherited opening WIP minus inherited closing WIP and measured transfers at the same gate; do not subtract stock again from a net numerator. Separate dedicated/virtual subdivisions, exchange-specific causality and justified residual allocation to produce A. Losses, failure, idle, cleanup and Q=0 remain assigned or explicitly pending."
      inputs:
        - V_native
        - unused_stock
        - already_net_flag
        - opening_WIP_vector
        - closing_WIP_vector
        - actual_transfers
        - attribution_evidence
      output: "A"
      source_ids:
        - jrc-ilcd-2010
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "a = A / Q for manufacture; a_service = A_service / Qc for the original released cohort over observed H. This is the sole division after conversion, stock-vector reconciliation and attribution. Cards and collection aggregation display this result directly. For Q or Qc zero, retain the real raw/attributed ledger with no unit result. Q excludes packaging and repeat release; closing first-released FG is already in Q."
      inputs:
        - A
        - Q
        - A_service
        - Qc
        - H
      output: "a; a_service"
      source_ids:
        - jrc-ilcd-2010
    - id: physical_gross
      applies_to: "all inventory rows"
      rule: "p = V_native / Q for manufacture or V_native / Qc for original-cohort services, using real gross physical movement, separately from A-based burden results. Do not multiply by a stock-value/economic allocation share, subtract returns from gross shipments, or divide observed H again. This physical view is not added to the burden view."
      inputs:
        - V_native
        - Q
        - Qc
        - H
      output: "p"
      source_ids:
        - jrc-ilcd-2010
    - id: article_geometry
      applies_to: "released_roll"
      rule: "A_roll is independently measured usable width-length/profile area; m_roll is independently weighed conditioned net complete-roll mass. Derive mass_per_area = m_roll / A_roll only for the matched construction/sample. For a volume bridge integrate measured thickness over the actual same profile and measure matched mass/state independently. No catalogue size, recipe density or native secondary factor is a measurement."
      inputs:
        - measured_profile
        - measured_thickness
        - independent_net_mass
        - conditioning
      output: "A_roll; mass_per_area; measured_volume_bridge"
      source_ids:
        - forbo-marmoleum-2018
        - tarkett-linoleum-2018
    - id: physical_closure
      applies_to: "all inventory rows"
      rule: "At each manufacturing, FG and consolidated gate, total actual opening stock plus gross external inputs equals actual closing stock plus gross external outputs; cancel paired internal handoffs only in the consolidated view. Whole wet articles OR mutually exclusive measured constituents form the mass bridge. X removes only observed OTHER same-side duplication, never an independent flow, real chemical increment, stock or opposite-side event. Run independent relevant-element balances and separate molecule/water/oxygen/biogenic-carbon ledgers with actual reaction/speciation evidence. Never fit two unknowns from one residual or treat evaporation as reaction/repair. Unknown closure remains inconclusive."
      inputs:
        - opening_stock
        - gross_inputs
        - closing_stock
        - gross_outputs
        - wet_or_constituent_bridge
        - independent_elements
        - species_observations
      output: "gate_residuals; independent_species_residuals"
      source_ids:
        - forbo-marmoleum-2018
        - tarkett-linoleum-2018
    - id: fg_cohort_closure
      applies_to: "fg_dispatch"
      rule: "For each original cohort independently close the complete actual wet FG ledger: opening FG + actual new first-release transfers + actual external returns + actual rework returns + real independent non-water additions + water uptake = closing FG + gross physical dispatch + actual discard/destructive tests + actual rework issues + real independent non-water removals + water loss. Keep every leg mutually exclusive and on its actual wet state; material already inside a whole receipt/exit/stock is nested, never another addition/removal. Record real additional matter as specific atomic exchanges; do not fit a water/material residual. A new first-release transfer is the actual physical handoff linked to its unique acceptance event and origin-basis bridge, not the denominator Q0 added again. An old cohort with opening already accepted FG has no new release merely because it is observed, dried, returned or dispatched; current-period new manufacture may be zero while original Qc=Q0,c remains positive. Keep paired transfer states and actual later transformations independently; all original acceptance-basis fates reconcile separately under v_ext_cohort_acceptance. Reinspection/authorization makes no new Q. Carry each historical vector once through real transfers and any justified original-delivery reversal, and add only actual incremental service/rework. Full physical movements remain distinct from attributed A; observed services use original Qc and H is never a divisor."
      inputs:
        - opening_FG
        - Q
        - external_returns
        - rework_returns
        - closing_FG
        - gross_dispatch
        - discard
        - tests
        - rework_issues
        - historical_vector
        - Qc
        - actual_new_first_release_transfer
        - independent_wet_additions
        - independent_wet_removals
        - original_basis_bridges
      output: "FG_residual; cohort_service_assignment"
      source_ids:
        - forbo-marmoleum-2018
        - jrc-ilcd-2010
    - id: package_closure
      applies_to: "all inventory rows"
      rule: "For each actual packaging material pool use the literal wet physical equation F_open + P + I + ER_in + J_in + H2O_in + C_in + O_in - X_in = F_close + S_gross + EO_out + W_whole + J_out + H2O_out + C_out + O_out - X_out. F_open/F_close include all empty, WIP-attached, FG-attached and reusable wet stocks. P is actual new separate purchased package supply, I actual packaging arriving with supplied materials, ER_in actual external returns received, S_gross the entire package physically accompanying every gross shipment including repeat shipments, EO_out actual external returns sent, and W_whole the whole exported waste. These transfer masses include their measured retained contents once. J_in/out are real independently crossing non-water additions/removals not already inside those whole legs; H2O_in/out are separately observed water exchanges not already included there. C_in/out preserve any real matched conversion/transfer between defined pool classes, cancelled only in the consolidated boundary; they are never invented mass creation. Moisture/adhesive/ink/retained product already contained in a weighed package is a nested component, not another J or water input. X may remove only a specifically observed OTHER same-side quantity already represented elsewhere on that same side; identify the overlap and both underlying records. X cannot subtract named independent P/I/ER/S/EO/W/J/water/C events, stock/opposite-side quantities, real chemical increments or an amount merely because a card exists. No residual is fitted. This replaces the historical use of X as an unidentified real OTHER flow: a real new material requires its own identified atomic interface, not X. O_in/out are sums of individually identified observed OTHER interfaces, each with its actual atomic card and raw record; they are not unidentified baskets or fitted balancing flows. Only a documented overlapping part of an O term can be X, linked to its already represented same-side record; every nonoverlapping O part remains a real physical flow."
      inputs:
        - F_open
        - P
        - I
        - ER_in
        - J_in
        - H2O_in
        - C_in
        - X_in
        - F_close
        - S_gross
        - EO_out
        - W_whole
        - J_out
        - H2O_out
        - C_out
        - X_out
        - nested_components
        - overlap_ids
        - O_in
        - O_out
        - OTHER_atomic_row_ids
        - observed_overlap_links
      output: "per_material_package_residual"
      source_ids:
        - forbo-marmoleum-2018
        - tarkett-linoleum-2018
    - id: mixed_waste_once
      applies_to: "floor_waste"
      rule: "For one real commingled linoleum consignment choose measured W OR disjoint measured originW whose sum reconciles W; W is then a control total, not another additive waste. Keep one treatment provider and correct waste/product status; internal reuse is a separate matched handoff. Species/assay indicators are subledgers, not extra physical waste."
      inputs:
        - W
        - originW
        - consignment_id
        - provider
        - status
        - internal_handoff
      output: "single_provider_feed"
      source_ids:
        - tarkett-linoleum-2018
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all UUID and supplier bindings"
      requirement: "Check whole native object: every basename/synonym/comment, CAS, route/grade/form/state, geography, type/media and all properties. Preserve reference-property and unit-group chains and supplier compatibility. Generic family identity does not establish a specific supplier, formulation or measurement. Contradictions cannot be waived by a matching CPC/name."
      evidence: "Native identity chain; supplier specification; restriction disclosure in every consuming card"
    - id: dq_primary
      applies_to: "every method/source and quantity"
      requirement: "Retain complete primary context, figures, composition tables and variant footnotes. The two industrial sources are different producers/editions; no source number or EPD result is a factory default. Actual site data and independent chemistry/measurement support all quantitative results."
      evidence: "Full source and figure context; actual owner/recipe/measurement records"
    - id: dq_complete
      applies_to: "all operations and states"
      requirement: "Reconcile unused raw, actual nonWIP, WIP and released FG separately, with every inherited exchange vector and real failed/zero-output/idle/rework/treatment event. Unknowns and coverage gaps remain explicit; do not assert a passing balance or zero emission from missing data."
      evidence: "cp_stock; cp_species; cp_release; cp_waste"
    - id: dq_uncertainty
      applies_to: "future data package"
      requirement: "Disclose calibration, sample coverage, detection limits, blanks, temporal/site representativeness, stock-vector provenance, allocation sensitivity and unresolved identity/provider support. Ordinary auxiliary/provider gaps do not redefine the complete linoleum method; missing core finished-product/route/endpoint support blocks applicability."
      evidence: "Measurement reports; provenance; uncertainty and separate gap ledger"
validation_rules:
  - rule_id: validate_terminal
    applies_to: "reference and complete route"
    rule: "Confirm complete traditional linoleum with oxidized oil binder, actual flour/mineral/pigments, woven jute and full cured factory finish through unique first release. Reject PVC, bitumen, unfinished cement/backing and excluded composite/installed routes. A generic family must have positive product/form/state fit and all native hard restrictions in the full consuming description."
    source_ids:
      - forbo-marmoleum-2018
      - tarkett-linoleum-2018
  - rule_id: validate_quantity
    applies_to: "all inventory rows and protocols"
    rule: "Reference amount and finished output are 1 kg net complete first-released product in both languages; original-unit conversion and attribution precede the single A/Q or original-cohort service A/Qc division. Cards and protocol aggregation reference the same result. H is not another divisor. Q=0 retains actual flows/loads with no unit result. Closing released FG is already included; no dispatch/retest double production."
    source_ids:
      - forbo-marmoleum-2018
      - jrc-ilcd-2010
  - rule_id: validate_physical
    applies_to: "manufacturing, FG, species and consolidated ledgers"
    rule: "Independently close gross total mass and relevant elements using whole wet articles OR disjoint constituents. Independently support oxidation, O2 uptake, water formation/release and carbon-source/species ledgers. One residual cannot solve multiple unknowns. Preserve real air/water phases and state-specific density; VOC/COD/PM totals do not establish molecules. All actual unlisted flows must be added atomically. Unknown core chemistry or measurement prevents dependent dataset closure from passing."
    source_ids:
      - forbo-marmoleum-2018
      - tarkett-linoleum-2018
  - rule_id: validate_stocks
    applies_to: "all cohorts and events"
    rule: "Check physical unused/raw/nonWIP/WIP/FG states and per-exchange inherited vectors; do not deduct already-net stock twice. Preserve every failed/startstop/idle/cleanup/rework/test/return/treatment event including zero output. FG gross movements, returns, original-delivery reversals and incremental rework use original Qc and historical burden; acceptance cannot remove actual events."
    source_ids:
      - forbo-marmoleum-2018
      - jrc-ilcd-2010
  - rule_id: validate_pack_waste
    applies_to: "each material and consignment"
    rule: "Require full per-package opening/closing empty/attached/reusable stock balance, actual external inflows/returns, gross shipped packaging, external returns sent and waste; internal reuse cancels and packaging is outside Q. One actual mixed waste W OR disjoint originW feeds one provider, never both. Keep waste/product status and physical totals independent of allocation or sale/credit assumptions."
    source_ids:
      - forbo-marmoleum-2018
      - tarkett-linoleum-2018
      - jrc-ilcd-2010
  - rule_id: validate_owner_utilities
    applies_to: "each purchased preparation and utility conversion"
    rule: "Verify one supplier/onsite owner for the full upstream preparation, real site/grade/route and exact native property-to-unit chain. Reject hard CAS/route/media/geography contradictions. Require actual complete thermal/air/treatment route and external Product condensate/circuit returns with thermal states and water/energy agreement where they exist. Do not create absent boilers, arbitrary density or copied source recipes."
    source_ids:
      - forbo-marmoleum-2018
      - tarkett-linoleum-2018
      - jrc-ilcd-2010
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "This manufacturing PCR covers complete compact linoleum flooring rolls with a traditional oxidized linseed-oil/rosin binder, wood flour (and separately declared cork flour only when actually used), evidenced mineral filler and individual pigments, woven jute backing and a factory waterborne UV-cured acrylate-hybrid protective finish. Start with actual separate purchased oils/rosin or a fully evidenced supplier-prepared cement, fillers, backing and whole coating preparations. Include binder oxidation and maturation at their real owner, mixing/granulation, calendering and backing consolidation, oxidative curing to the required mechanical state, surface preparation/coating/drying/UV cure, trim/cut/roll, actual tests and first quality release. Keep actual rework, failed and zero-output runs, start/stop, idle, cleanup, extraction, utilities and treatment. [forbo-marmoleum-2018; tarkett-linoleum-2018]"
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "This is a transparent technology synthesis, not one SKU, recipe, plant or contemporary order. Forbo provides the selected finished jute-backed double-coated roll route and the separate linoleum body/intermediate/backing construction. Tarkett independently supports traditional oxidation/calendering/curing and identifies cork-containing, foam-backed and customer-finished exceptions. Those exceptions are not proof for this selected compact factory-finished endpoint. Exclude PVC/vinyl floors, bitumen linoleum/roofing or waterproof felt, loose cement, separate fabric, acoustic foam/composite click panels, furniture linoleum, installed floors and repacking bought finished rolls. A different construction needs explicit applicability review. No source recipe fraction, oxidation rate, time/temperature, dimensions, mass/area, density, yield, emissions, lifespan, carbon uptake or credit is adopted as a default."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Declare every qualifier in metadata, process notes, reference comments or equivalent dataset fields. The native manufactured Linoleum family positively covers this complete finished article but supplies no recipe, performance or supplier inventory. Its complete identity restrictions also govern released_roll and fg_dispatch descriptions. A missing core terminal/route is an applicability hold; ordinary supplier/auxiliary gaps are separately disclosed."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Record original raw values, units, conditions and coverage without dividing by Q or Qc. The aggregation_rule column names the final reporting basis only and references the single normalize_once result, not an additional operation. All quantities remain future foreground requirements; no concrete factory measurements are fabricated here."
    source_ids: []
  - rule_id: v_ext_cohort_acceptance
    applies_to: "all inventory rows"
    rule: "Lock Q0,c as the independently summed unique first-acceptance event masses of complete conditioned rolls at the fixed manufacturing gate, excluding detachable packages and test/reject samples. Q0,c is never reconstructed from survivors or reset on dispatch, return, reinspection or incremental rework. At the observation cut-off reconcile Q0,c = D_remaining,c^0 + S_accepted,c^0 + L_irreversible,c^0 + T_other,c^0, where these are disjoint original-acceptance-basis allocations: net remaining delivered material, every on-site accepted state including held/quarantined/rework material, irreversible losses/destructive tests, and other actual terminal dispositions. Gross shipments, returns and recirculation are event legs, not additive terminal fates. Independently record each fate's actual current wet mass and its measured transformation from the original basis. Never restore lost water/material into a survivor and also count that same loss. Unknown fate or conversion keeps the bridge unresolved. Already accepted closing FG belongs to original Q0,c, not a second external production flow. Manufacturing A/Q0,c, observed later-service A_service/Q0,c and actual physical V/Q0,c are distinct reports; only one division is performed and observed H is never another divisor. For a reporting period, manufacturing Q is the sum of Q0,c over exactly the newly accepted cohorts included in that manufacturing report; for one cohort Q=Q0,c. Historical service Qc is always its original Q0,c, never the current-period manufacturing Q. Keep new manufacturing and old-cohort service numerators disjoint."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_ext_three_ledgers
    applies_to: "all inventory rows"
    rule: "Keep three separate accounts before normalization: actual full physical receipts, issues, transformations, transfers and stocks; attributable exchange/burden vectors with their real own or provider provenance; and fixed original-cohort acceptance/fates. Raw unused stock, real WIP, genuinely non-WIP items and accepted FG are distinct physical states, with wet mass, composition and opening/closing ownership. Each own foreground WIP transfer carries its inherited vector once, plus only real incremental operations. A purchased whole cement, coating, backing, recovered material or utility carries its complete actual provider inventory once: choose embedded whole-provider burdens OR a documented nonoverlapping decomposition, never both. Old provider burdens are not recreated with current recipe or energy intensity. Already-net issues are not stock-corrected twice. Zero-output, failed, start/stop, idle, cleaning, control and treatment events retain all their raw quantities and vectors; zero/unknown Q0,c retains totals and unresolved attribution rather than a fabricated unit result."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_ext_wet_pack_literal
    applies_to: "all inventory rows"
    rule: "For each actual packaging material pool use the literal wet physical equation F_open + P + I + ER_in + J_in + H2O_in + C_in + O_in - X_in = F_close + S_gross + EO_out + W_whole + J_out + H2O_out + C_out + O_out - X_out. F_open/F_close include all empty, WIP-attached, FG-attached and reusable wet stocks. P is actual new separate purchased package supply, I actual packaging arriving with supplied materials, ER_in actual external returns received, S_gross the entire package physically accompanying every gross shipment including repeat shipments, EO_out actual external returns sent, and W_whole the whole exported waste. These transfer masses include their measured retained contents once. J_in/out are real independently crossing non-water additions/removals not already inside those whole legs; H2O_in/out are separately observed water exchanges not already included there. C_in/out preserve any real matched conversion/transfer between defined pool classes, cancelled only in the consolidated boundary; they are never invented mass creation. Moisture/adhesive/ink/retained product already contained in a weighed package is a nested component, not another J or water input. X may remove only a specifically observed OTHER same-side quantity already represented elsewhere on that same side; identify the overlap and both underlying records. X cannot subtract named independent P/I/ER/S/EO/W/J/water/C events, stock/opposite-side quantities, real chemical increments or an amount merely because a card exists. No residual is fitted. This replaces the historical use of X as an unidentified real OTHER flow: a real new material requires its own identified atomic interface, not X. O_in/out are sums of individually identified observed OTHER interfaces, each with its actual atomic card and raw record; they are not unidentified baskets or fitted balancing flows. Only a documented overlapping part of an O term can be X, linked to its already represented same-side record; every nonoverlapping O part remains a real physical flow."
    source_ids:
      - forbo-marmoleum-2018
      - tarkett-linoleum-2018
  - rule_id: v_ext_fleet_history
    applies_to: "all inventory rows"
    rule: "Inventory the complete actual production, handling, storage, control, maintenance, test and measurement fleet, not only the main machine. For each actual configured asset or reusable cloth/filter article, independently collect complete physical mass M and all real constituents/attachments, opening/closing stock, receipts, returns, repairs, replacement parts, retirement, retained contamination and actual use/capacity. M is measured, never a numeric default or camera/machine count. Conserve that full physical fleet separately from attributed service burdens; repeated use is not repeated purchase and a burden share never shrinks physical returns or retirement. The provider may reference kg, item, operating hour or another real unit: retain its exact unit/period/configuration and use actual measured count-mass or service-capacity conversion with a demonstrated denominator. No universal lifetime or capacity fraction is assumed. Original provider/own history stays with every transfer once. Add every real supporting device and identified replacement/maintenance consumable atomically; a bare main-asset UUID cannot stand for a different full fleet."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_ext_whole_waste_qt
    applies_to: "all inventory rows"
    rule: "For each actual receiver consignment t record full physical wet Qt independently of any allocation or original cohort. It includes the entire contaminated substrate/cartridge/cloth/package and its retained dust, liquor and water once; dry tare and retained constituents are nested assays unless physically separated before that gate. Keep its measured receipt, actual receiver, transport and complete treatment boundary/reference unit. One whole mixed Qt OR mutually exclusive origin masses reconciled to Qt feeds the physical provider once. Independently assign nonoverlapping treatment-service/burden demands to all real original cohorts, old cohorts and non-product causes, retaining their original Q0,c and inherited A_e vectors; undistributed demand stays explicit. In a synthetic illustration only, a 10 kg consignment with a 25% cohort burden share remains 10 kg physical transfer, not 2.5 kg, and is not charged 10 kg again to each cohort. If the provider reference is volume, item or treatment service, establish actual composition/state or service conversion; do not assume kg-provider compatibility. Include own treatment inputs, controls and outputs once, or the complete external treatment inventory once; never provider-embedded history plus the same decomposed treatment again."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_ext_utility_and_controls
    applies_to: "all inventory rows"
    rule: "Retain actual oxidation, heating, curing, drying, ventilation, mixing, calendering, UV curing, trimming, regrinding and pollution-control producers at their real owners. An actual purchased-heat/steam boundary requires the complete matched upstream producer, delivered physical carrier/enthalpy and actual return/water convention; a paper receipt cannot remove an on-site burner or its air, fuel, reaction water, emissions and residues. Actual internal air recirculation and recovery transfers cancel only after matched physical/state records; final releases are measured after the last real control. Incoming atmospheric background and pass-through gases are not created emissions or carbon credits. Measure each actual fuel composition/state and real reactive G_i and C_i separately; total elemental/wet mass closure neither identifies a missing molecule nor proves a reactive species conserved. Whole collected condensate/sludge/dust to a real receiver is a physical mixture, not the same as residual individual chemical species released to air or water."
    source_ids:
      - forbo-marmoleum-2018
      - tarkett-linoleum-2018
  - rule_id: v_ext_ftir_programme
    applies_to: "all inventory rows"
    rule: "For actual infrared-active vapor-phase aldehydes and other identified target gases, Method320 and its complete FTIR Protocol provide a real procedure, not merely a method title. Establish target/interferant reference spectra (Protocol4.6 if absent), instrument resolution/path/temperature/pressure and spectral regions, background/CTS checks, RMS noise/MAU/analytical uncertainty, heated inert probe/line/cell and actual particulate exclusion, leaks, response time and preserved raw interferograms. Water/CO2 overlap, adsorption, reaction and unintended condensation must be checked. Use Method320 pre-test QA spikes and the full 12-spiked/12-unspiked validation branch with bias/precision evaluation where required; recondition/retest or reject failing data. A condenser/dilution is permitted only with the actual through-train recovery and sample-conditioning validation, or a valid parallel conditioned/unconditioned comparison; do not discard captured analyte and still claim original whole-gas concentration. The Protocol and all appendices in the complete 50-page original remain part of this method. Actual spectra, calibration and matrix tests are study qualification, not evidence that no analytical programme exists. No site is asserted already qualified."
    source_ids:
      - epa-method320
  - rule_id: v_ext_source_equation_repair
    applies_to: "all inventory rows"
    rule: "Retain the source defect: Method320 printed Eq3 gives tracer_spiked/tracer_direct, a spike fraction, while the following definition calls DF at least10; printed Eq4 uses that fraction as a mixture weight. Do not use an inverse dilution factor as that weight. On one measured common gas amount/temperature/pressure/wet-dry basis define r_sp = q_sp/(q_native+q_sp), d_sp=1/r_sp, and C_mix=r_sp*C_sp+(1-r_sp)*C_native. If the native tracer is not zero, obtain r_sp=(T_mix-T_native)/(T_sp-T_native) from measured tracer concentrations and valid separation, not an assumed background. Recover native analyte only with the corresponding actual mixture equation; retain independently measured flows, zero/span, recovery and uncertainty. The original printed page and this explicit mass-mixture correction must both be retained; it is an author mathematical clarification, not a claimed EPA erratum or new site validation. No source spike concentration or dilution becomes a factory default."
    source_ids:
      - epa-method320
  - rule_id: v_ext_flow_and_pm
    applies_to: "all inventory rows"
    rule: "Actual stack-flow/PM work must include the complete Methods1–3 and5 dependencies: suitable actual traverse geometry and cyclonic/small-duct exclusions; calibrated pitot/meter and measured temperature/pressure, gas composition and moisture; leak checks, nozzle/isokinetic conditions, blanks, complete front-half/filter recovery, gravimetry and actual dry-standard-volume calculations. Method5 measures its defined heated-filterable particulate fraction; it is not a molecular assay or proof for wet mist/condensable aerosol or all PM sizes. Retain actual total collected whole particulate and the separate supported material/species characterization; bulk linoleum recipe is not emitted dust composition. Method3's restricted dry-molecular-weight calculation and residual N2+CO fraction do not establish pure N2 or Ar; its assumed gas weight is not a measured factory value. No generic VOC/PM/COD indicator or one residual is assigned to a molecule. If actual droplets, wet aerosol or condensables matter and an applicable complete collection/phase/analysis procedure is not established, preserve that specific essential hold rather than claim total-PM closure."
    source_ids:
      - epa-method1
      - epa-method2
      - epa-method3
      - epa-method5
  - rule_id: v_ext_water_phase
    applies_to: "all inventory rows"
    rule: "Method4's full reference condenser/desiccant, measured volumes/masses, blanks, leaks and gas-state calculations support stack moisture only within its applicability and actual dependencies. Its approximation branch is not automatically a reference emission measurement. Saturated gas or entrained droplets can positively bias recovered water; apply its simultaneous saturation/temperature/pressure comparison and retain any unresolved phase distinction. FTIR water is gas-phase H2O only within the Method320 spectral/transport validation. Neither total condenser gain, a wet-minus-dry residual nor Method4 alone gives chemically generated water, a dissolved individual chemical or the original wet-mist species distribution. Use actual separately collected liquid/solid receiver mass, sample provenance and complete applicable phase/matrix analytical procedure for any required dissolved/retained analyte; otherwise that dependent result stays unresolved. Do not invent that such a phase exists solely from this conditional rule."
    source_ids:
      - epa-method4
      - epa-method320
  - rule_id: v_ext_non_ir_gases
    applies_to: "all inventory rows"
    rule: "Do not use FTIR for homonuclear N2/O2 or monatomic Ar. For the actual carrier-air inlet/outlet account, the following is an independent combined GC-TCD measurement programme, not a claim of a published Ar stack validation or regulatory Method3C conformity. First define actual final outlet, inlet/background, wet/dry measurand, target gas range, phases and uncertainty objectives; the EPDs do not establish additional Ar generation or a fixed air composition. (1) Use the complete Method3 inert probe, representative sample, purge, leak-checked constant-flow collection and sealed identified gas-container procedure. Record actual T/P, flow/volume and elapsed collection/storage; choose inert materials that do not remove the target gases. Preserve simultaneous unconditioned and conditioned sample provenance; document every condenser/filter/dryer and actual separated receiver mass. (2) Use actual GC-TCD columns with measured Ar/O2 separation under the real sample matrix. The Agilent2022 Molsieve/backflush configuration is a demonstrated separation starting point, not a default setting or proof at every loading. Verify actual Ar and O2 standards separately and together with N2/CO2/H2O and every real interferant; dilute only with measured certified gas and preserved mole-amount basis, never atmospheric ratios. (3) Extend Method3C's explicit per-compound calibration framework to Ar: traceable certified Ar standards at at least three actual concentrations bracketing the final measured range, matrix/zero blanks, calibrated loop/sample T/P and identical gas-state basis, component-specific response regression, triplicate check standard and duplicate sample injections. Apply the source Method3C calibration-verification/recalibration and duplicate-agreement conditions to the declared composite programme; label that choice as author synthesis, not a reported Ar result. Retain standard certificates, slopes/intercepts, residuals, range, spectra/chromatograms and uncertainty. (4) Challenge the complete actual probe/transport/conditioning path with a traceable known Ar addition upstream and matched no-addition samples, and compare a direct standard bypass with the same standard through the full path. Perform separate before/after-conditioning comparisons on the same original-gas basis; account for measured added gas, collection pressure/temperature, water removal and actual dilution. Net Ar recovery is the difference in reconstructed downstream Ar mole amounts between matched spiked and unspiked runs divided by independently introduced Ar moles; use the measured native background and actual time/flow, not a single concentration subtraction at unequal flow. Retain blank/container carryover, repeated path recoveries and holding-time paired samples; never copy the note's single-standard LOD or recoveries for other gases. (5) Before testing fix the uncertainty-based acceptance plan, full-path/background controls and repeatability/calibration checks. Reject or repair/retest when Ar/O2 cannot be resolved, the actual range is uncalibrated, blanks/carryover invalidate identity, drift/duplicates fail the adopted Method3C conditions, or unexplained loss/enrichment exceeds the declared combined uncertainty. No generic recovery percentage is invented. (6) Only accepted data provide separately measured dry/wet mole fractions and measured total gas amount/flow on the same state basis; convert each molecule using its own molar mass and actual state/dilution, reconcile inlet/pass-through separately from generated/consumed species. This gives a specified procedure and failure path. Its independent scientific applicability and actual site QA remain separate; absence of actual execution alone does not mean there is no programme. If an actual necessary original-phase capture or conditioning branch cannot be specified or fails these tests, hold that dependent result, preserve all real physical air legs and unknowns, and do not claim Ar closure or remove the source by paper outsourcing. CAN/CGSB-12.8-2017 AnnexB supplies an additional full Ar/O2/N2 separation-and-quantification procedure: gas-tight identified sampling, baseline-separated peaks, certified mixtures of known similar composition whose component ranges encompass the samples, actual standard/sample corresponding peak areas, daily or changed-condition standardization and reference repeatability. Its complete B.1–B.5 and footnotes are retained. In this independent programme calculate Ar from its own measured area-response calibration on matched actual sample/reference gas amounts, not by closing Ar/O2/N2 to100% or using air fractions; preserve measured dilution and all other actual components. AnnexB concerns sealed IG gas, so its septum sampling, example instrument settings and observed range do not replace Method3 industrial sampling and the full original-phase preservation/conditioning/recovery steps above; no conformity or samefactory validation is claimed."
    source_ids:
      - epa-method3c
      - agilent-argon-2022
      - epa-method3
      - cgsb-argon-2017
  - rule_id: v_ext_scope_and_qualification
    applies_to: "all inventory rows"
    rule: "The EPDs establish meaningful whole-product manufacture and distinct source variants, not a universally measured factory inventory or one combined SKU. The exposed chemical/phase protocol limitations above remain real admission conditions. Actual method selection, collected records, calibration and supported analytical recovery can be completed in a study where the full applicable programme exists; their unperformed state alone is not a new barrier requiring identical source factory/SKU. Conversely, an unspecified essential original-matrix sampling/speciation procedure cannot be converted into ordinary QA by writing future SOP or by finite checkpass. Candidate/draft or authored status, projection integrity, translation alignment and database identity establish neither scientific acceptance nor an actual site's study qualification."
    source_ids:
      - forbo-marmoleum-2018
      - tarkett-linoleum-2018
      - epa-method320
  - rule_id: v_ext_validation_statistics
    applies_to: "all inventory rows"
    rule: "For the Method320 validation branch retain the complete Method301(2017) dependency, including reference-material certification, collocated/paired sampling, sample stability, actual sample topology, bias and precision calculations and failure requirements. Method320 references old Method301 section numbers6.3.2.2/6.3.3; these are not the bias/correction sections in the retained2017 version. Do not blindly follow that numbering or the carried-over VS validated-method label in Method301's analyte-spiking subsection when no validated-method comparator exists. For this explicit independent treatment, each independent matched group uses the actual spike-fraction-corrected expected mixed concentration E_i and observed spiked mean S_i on the same original gas basis; d_i=S_i-E_i. Compute B=mean(d_i), s_d from the n actual independent group differences with denominator n-1, and t=abs(B)/(s_d/sqrt(n)); use the actual n-1 degrees of freedom and applicable two-sided source confidence criterion, not an assumed twelve degrees of freedom from twenty-four individual measurements. Retain all raw duplicate/pair observations and evaluate actual sampling precision under the applicable Method301 branch as well as bias; standard certificate/flow uncertainties remain separate inputs. For the Method320 batch two-native/two-spiked repeated pattern, six independent groups contain twelve native and twelve spiked samples; variable streams require its actual parallel or synchronized branch. A zero/undefined variance or invalid reference does not make a pass. Where a demonstrably multiplicative significant bias is correctable, the transparent concentration-ratio CF=mean(E_i)/mean(S_i) must be justified on matched conditions, remain inside the Method320 correction-factor limits and meet the applicable Method301 bias/precision requirements; otherwise reject/repair/retest. This ratio is an explicit mathematical clarification, not a claim the old cross-reference supplies a missing formula. For stored samples preserve Method301's source storage/sampling distinctions and minimum-versus-maximum-time paired tests; shorten/retest a holding interval that changes results significantly. Its paragraph/table timing differences are not a default holding life. Validation statistics cannot invent a missing extraction, molecular identity or original-phase sampling procedure, and no regulatory approval or actual-site pass is asserted."
    source_ids:
      - epa-method320
      - epa-method301
  - rule_id: validation_rule_24
    applies_to: "foreground_dataset_conformance"
    rule: "The integrated inventory retains the following stage and gate ledger. Internal cement/granulate/sheet/trim handoffs are measured and carry full inherited vectors; they cancel on consolidation, never create new purchases. Utility and molecular cards collect each actual operation separately under their row_id before summing attributable raw amounts."
    source_ids: []
published_dataset_profile:
  dataset_role: "Measured linoleum manufacture and separately bounded observed FG services; secondary_dataset or background_dataset only after actual-data validation"
  downstream_use: "Installation studies with explicit upstream links and separately evidenced installation/use/end-of-life scenarios"
  allowed_use: "Matched complete compact jute-backed oxidized-oil linoleum roll construction, cure and first-release gate, with original-cohort service disclosure"
  excluded_use: "PVC/bitumen/binder/backing substitution; incomplete manufacturing; assumed installed life; fixed recipe/density/yield/emission/carbon benefit; unobserved future services"
  required_metadata: "All reference qualifiers; PCR identity; native restrictions; site/period and actual owner; whole supplies/upstream links; all raw/physical/attributed views; stock vectors; unique Q/Qc/H; sources and uncertainty"
  required_quality_disclosure: "Actual operational and measurement coverage; supplier/auxiliary gaps separately from core holds; unsupported chemistry/speciation/closure; allocation and source-variant limitations; no scientific or translation approval inferred from engineering checks"
  update_trigger: "Change of binder supply/oxidation route, flour/filler/pigment, backing, layer/coating/curing construction, gate/stock method, geography/utility/provider, waste treatment, packaging/services or primary evidence"
data_sources:
  - id: "forbo-marmoleum-2018"
    type: "dataset"
    reference: "Forbo Flooring Systems, Marmoleum 2.0 and 2.5 mm, UL EPD 12CA64879.101.1, issued 2018-01-05; first declaration in combined publisher PDF, pp.3–7 and manufacturing figure2 p.6. https://www.forbo.com/media/document/c302148e-7b46-44a8-9bd2-00f5ac3646d1"
    used_for: "Primary historical complete product/layer/ingredient and oxidation→calendering→curing→factory finish→inspection/roll route; actual waste/packaging context. Qualitative use only; no recipe, dimensions, density, time, carbon result, cut-off, allocation or credit transfer."
  - id: "tarkett-linoleum-2018"
    type: "dataset"
    reference: "Tarkett, Linoleum EPD (2018), materials tables1–3 with variant footnotes pp.4–5; §2.5–2.6 and process figure1 pp.5–6; lifecycle and data context pp.8–10. https://media.tarkett.com/docs/2018-EPD_Linoleum_Tarkett_EN.pdf"
    used_for: "Independent primary traditional binder/wood/cork/jute route and actual counterexamples: foam and customer-finished products. No combined powder/pigment bundles, recipe ranges, heat-system choice, lifetime, output allocation or EPD results adopted."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA—Detailed guidance, first edition March2010, §§7.9.2–7.9.3, printed pp.255–272 (PDF275–292), including applicability provisions and counterexamples. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Only attributional contexts requiring allocation: dedicated/actual/virtual subdivision, exchange-specific determining physical causality and justified residual common-process actual gate/state market value. No automatic Annex14 recycling, substitution, fixed shares or factory chemistry evidence."
  - id: "epa-method320"
    type: "official_guidance"
    reference: "EPA Method320Measurement ofVaporPhaseOrganicAndInorganicEmissionsByExtractiveFTIR; 2019-01-14 publisherPDF. https://www.epa.gov/sites/default/files/2019-06/documents/method_320.pdf"
    used_for: "Complete programme/applicability/counterevidence and explicitly identified independent method synthesis; no copied plant conditions, emissions, atmospheric fractions or LOD; no actual-site validation claimed. Full conditions/limits are in section9."
  - id: "epa-method5"
    type: "official_guidance"
    reference: "US EPA Method5 Determination of Particulate Matter Emissions from Stationary Sources; 2August2017. https://www.epa.gov/sites/default/files/2017-08/documents/method_5.pdf"
    used_for: "Complete programme/applicability/counterevidence and explicitly identified independent method synthesis; no copied plant conditions, emissions, atmospheric fractions or LOD; no actual-site validation claimed. Full conditions/limits are in section9."
  - id: "epa-method3"
    type: "official_guidance"
    reference: "US EPA Method 3 full dependency document; 3August2017. https://www.epa.gov/sites/default/files/2017-08/documents/method_3.pdf"
    used_for: "Complete programme/applicability/counterevidence and explicitly identified independent method synthesis; no copied plant conditions, emissions, atmospheric fractions or LOD; no actual-site validation claimed. Full conditions/limits are in section9."
  - id: "epa-method2"
