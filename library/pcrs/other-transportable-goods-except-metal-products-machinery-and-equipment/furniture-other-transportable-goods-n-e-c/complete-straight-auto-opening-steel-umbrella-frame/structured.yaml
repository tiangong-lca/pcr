      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual received formed surface-finished rib/stretcher/shaft and specific finished mechanism/tip/ferrule parts plus real auxiliaries/utilities at assembly gate |\n| starting_condition_role | foreground_input_gate |\n| product_classification_scope | Complete umbrella part within CPC3.0:38922; distinct from whole-umbrella38921 |\n| recursive_input_rule | A bought subassembly carries its complete included manufacture once; do not recurse to repurchase the same steel/coating or manufacture a second frame. A bought complete frame does not satisfy this component-assembly route. |\n| upstream_dataset_requirement | Each component provider must cover its real raw materials and forming/heat treatment/finish already performed; unresolved provider scope is disclosed and completed for the actual dataset |\n| disclosure | Actual component BOM/make-buy map; supplier states; measured physical gates; first-release and original-cohort service ledgers; all exclusions and uncertainty |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_complete | all inventory rows | The whole-frame supply list is disjoint. For a bought combined shaft/ferrule, runner/spring or notch/wire article count the whole article once and keep constituents only as reconciled non-additive subledgers. If actually supplied independently count each separate purchased part once. Never add whole article wet mass and its already included water/oil/coating/parts again. Cancel internal subassembly/WIP handoffs when combining stages. | `sep-complete-steel-frame`; `acme-frame-structure`; `zhe-frame-riveting-2026` |\n| b_actual | all inventory rows | Include all real received goods, fitting/deburring, riveting, mechanism assembly, inspection/test samples, rejects, startup/shutdown, idle, cleanup and rework loads, even failed/unauthorized/refused events. Permission and qualification regulate acceptance only; they do not erase real flows. No default temperature/pressure/test cycles, substrate recipe, or yield is implied. An actually present unnamed input/outlet must gain its own specific atomic card before completeness can be claimed. | `zhe-frame-riveting-2026`; `ilcd-allocation-2010` |\n| b_q | reference product | First release is after all same-configuration required fitting, assembly, checks, rework and required supply packing, ready for supply at the plant. Q_c (also Q0_c) is the independently weighed sum of unique first accepted complete-frame net masses, excluding packaging tare and including actual matched loose parts. Original product composition, water state and acceptance IDs are locked before reconciliation. Initial required packing belongs to new manufacture; later storage, repacking, redelivery, repair and retest are only real service of the original cohort in H and never a second acceptance. Reopening or failed work does not erase previous loads. | `sep-complete-steel-frame`; `zhe-frame-riveting-2026`; `ilcd-allocation-2010` |\n| b_vectors | all inventory rows | Keep full wet raw/WIP/non-WIP/accepted/held/returned FG, packaging, installed fluids and all actual equipment/tool stocks independent of reference events and per-exchange burdens. Own opening WIP carries its complete real prior foreground history once; transfer only substantiated unassigned closing vectors. A linked whole provider dataset and its embedded steel/polymer/coating/utility/transport/machine history are alternatives to the same decomposed history, never additive. Bought formed/tempered/finished components require complete actual producer coverage and delivery state. Do not invent purchases to hide known on-site forming, coating, heat treatment, compressor operation or other real production; a changed route needs explicit scope review and complete atomic exchanges. | `ilcd-allocation-2010` |\n| b_physical | all inventory rows | Independently close manufacturing, FG/service and combined full wet physical gates: opening stocks plus actual external inflows equal closing stocks plus actual external outflows. Pair/cancel internal transfers, including the first-release handoff. Physical assets/components/packaging/fluid/Waste/actual carrier returns always use full gross V/native unit, not allocation A, stock consumption or economic/service shares. X may only deduplicate the same-side OTHER actual flow already represented; it cannot offset stock, opposite legs, unknown values or the existence of a card. | `ilcd-allocation-2010` |\n| b_species | all inventory rows | Close relevant elements and actual molecular species independently of total wet mass. Distinguish free/phase/structural/reaction water only when evidenced; no reaction is inferred from mechanical assembly. Preserve N2/O2/Ar/H2O humidity and actual medium/phase/T/P. COD/VOC/NOx/PM are indicators, not a specific chemical mass. One residual cannot determine two unknowns. A real mixed Waste has one full measured exit/provider and independent non-additive originW subledgers; do not force separated exits. | `ilcd-allocation-2010` |\n| b_utilities | all inventory rows | This component-assembly route assumes no onsite plating bath, polymer synthesis, boiler, steam loop or fuel combustion. If actually present do not suppress it: reassess scope and add each specific material/preparation/fuel/species/return exchange with real sources and amounts. Real purchased heat/carrier and returned Product water require mass/phase/T/P/enthalpy and supplier water-energy convention: one supply owner, no double purchase of kg carrier and its included MJ heat. Do not copy a fictitious steam system. | `ilcd-allocation-2010` |\n| b_pack | p_service | For each actual polyethylene-bag or corrugated-carton whole wet pool in kg, verify O + P + I + ERin + J_in + H2O_in - X_in = C + S + EOout + W + J_out + H2O_out - X_out. O/C include empty, WIP-attached, FG-attached, returned and reusable physical stocks; P is fresh purchase, I real supplier-included receipt, ERin external return received inward, S gross shipment outward, EOout external return sent outward, and W the actual whole wet waste exit. Paired internal reuse cancels on consolidation; it is neither ERin nor EOout nor procurement. Actual supplier-included packaging has one complete upstream owner and is never bought again. J_in/J_out are independently evidenced disjoint additional non-water transfers such as actual retained repair material, dust or oil only where not already included in another whole gross leg. H2O_in/H2O_out are actual sorption/addition/evaporation or other water transfers not already contained in a wet leg. Closing C retains all true additions even without repair. X_in/X_out subtract only proved overlap between OTHER same-side flow observations; never real J/H2O, C, opposite directions, unknown closure differences or card existence. Unknown terms are not fitted. Trace each true increment to its physical source/receiver and specific atomic interface; paired internal J/water is not a new provider or waste exit. Nested water/material in a gross wet leg is counted once. | `zhe-frame-riveting-2026`; `ilcd-allocation-2010` |\n| b_native | all inventory rows | Preserve all positive identity restrictions: one complete straight auto-opening steel frame (no canopy/handle) under the broad manufactured finished-part Product family and Mass/kg; China user-side grid-average AC below1kV with exact Net calorific value → energy unit group → MJ; treated tap water Product Mass/kg with no secondary-density assumption; iron/non-alloy cylindrical steel wire only (not alloy wire or formed spring); finished polyethylene bag CAS9002-88-4 only (not PP/PVC/resin/film; broad taxonomy separately disclosed); used lubricating oil Waste at generation with treatment unspecified. Native generic identity never proves provider, exact grade/finish/polymer formulation, quantity, geography where undeclared or complete supplier process coverage. Do not silently broaden or replace these physical restrictions. | `ilcd-allocation-2010`; `sep-complete-steel-frame`; `acme-frame-structure`; `zhe-frame-riveting-2026` |\n| b_air_native | all inventory rows | Gas adoption is limited to actual neutral molecular/elemental species and exact medium: N2 CAS7727-37-9, O2 CAS7782-44-7 and Ar CAS7440-37-1 use separate air-resource inputs and non-long-term unspecified air-emission outputs; H2O CAS7732-18-5 is only ordinary gaseous water air output, while atmospheric water-vapour intake identity remains unresolved. All use Mass/kg and real state, never total nitrogen, ions, liquid Product, radioactive/heavy water, ice or water discharge. N2/O2/water aliases contain other-state terms and argon aliases contain an inconsistent41Ar entry, disclosed per card without inferring activity or broadening adoption. | `ilcd-allocation-2010` |\n| b_complete_1 | all actual applicable exchanges | The selected terminal is one complete part: a configured straight automatic-opening steel umbrella frame including the actual shaft, ribs/stretchers, runner/notch, spring/catch and joint hardware, matched ferrule and supplied loose matching tips. A functioning bare frame is separately traded; the historical USITC description excludes tips/ferrule from its own frame assembly while the contemporary Septrainbow offer explicitly includes them. Retain the actual declared complete supply list instead of imposing either source’s inclusion list on every order. The two descriptions are compatible evidence of different complete supply states, not proof of identical SKU, plant or period. No canopy, handle or later whole-umbrella operation is silently included. | `ilcd-allocation-2010`; `zhe-frame-riveting-2026` |\n| b_complete_2 | all actual applicable exchanges | First release is after all same-configuration required fitting, assembly, checks, rework and required supply packing, ready for supply at the plant. Q_c (also Q0_c) is the independently weighed sum of unique first accepted complete-frame net masses, excluding packaging tare and including actual matched loose parts. Original product composition, water state and acceptance IDs are locked before reconciliation. Initial required packing belongs to new manufacture; later storage, repacking, redelivery, repair and retest are only real service of the original cohort in H and never a second acceptance. Reopening or failed work does not erase previous loads. | `ilcd-allocation-2010`; `zhe-frame-riveting-2026` |\n| b_complete_3 | all actual applicable exchanges | Independently verify Q0_c = D0_c + FG0_c + Held0_c + L0_c + T0_c, with disjoint remaining original-material deliveries, released on-site FG, every other actual accepted on-site state, irreversible original material/water losses, and other terminal dispositions. Subdivide those bins for every real location/status; gross delivery/return loops cancel only in this event bridge. Record each original-material fate once on its locked acceptance basis. Independently bridge each surviving present wet mass to original matter still present plus real retained later non-water material and water changes. Do not restore a lost original mass into a survivor and also retain it in L0_c. New material/sorbed water creates physical mass, not new Q. Q0_c=0 or unknown retains all raw loads and no normalized result. | `ilcd-allocation-2010`; `zhe-frame-riveting-2026` |\n| b_complete_4 | all actual applicable exchanges | Keep full wet raw/WIP/non-WIP/accepted/held/returned FG, packaging, installed fluids and all actual equipment/tool stocks independent of reference events and per-exchange burdens. Own opening WIP carries its complete real prior foreground history once; transfer only substantiated unassigned closing vectors. A linked whole provider dataset and its embedded steel/polymer/coating/utility/transport/machine history are alternatives to the same decomposed history, never additive. Bought formed/tempered/finished components require complete actual producer coverage and delivery state. Do not invent purchases to hide known on-site forming, coating, heat treatment, compressor operation or other real production; a changed route needs explicit scope review and complete atomic exchanges. | `ilcd-allocation-2010`; `zhe-frame-riveting-2026` |\n| b_complete_5 | all actual applicable exchanges | For each actual polyethylene-bag or corrugated-carton whole wet pool in kg, verify O + P + I + ERin + J_in + H2O_in - X_in = C + S + EOout + W + J_out + H2O_out - X_out. O/C include empty, WIP-attached, FG-attached, returned and reusable physical stocks; P is fresh purchase, I real supplier-included receipt, ERin external return received inward, S gross shipment outward, EOout external return sent outward, and W the actual whole wet waste exit. Paired internal reuse cancels on consolidation; it is neither ERin nor EOout nor procurement. Actual supplier-included packaging has one complete upstream owner and is never bought again. | `ilcd-allocation-2010`; `zhe-frame-riveting-2026` |\n| b_complete_6 | all actual applicable exchanges | J_in/J_out are independently evidenced disjoint additional non-water transfers such as actual retained repair material, dust or oil only where not already included in another whole gross leg. H2O_in/H2O_out are actual sorption/addition/evaporation or other water transfers not already contained in a wet leg. Closing C retains all true additions even without repair. X_in/X_out subtract only proved overlap between OTHER same-side flow observations; never real J/H2O, C, opposite directions, unknown closure differences or card existence. Unknown terms are not fitted. Trace each true increment to its physical source/receiver and specific atomic interface; paired internal J/water is not a new provider or waste exit. Nested water/material in a gross wet leg is counted once. | `ilcd-allocation-2010`; `zhe-frame-riveting-2026` |\n| b_complete_7 | all actual applicable exchanges | For each actual contaminated wipe, bag, carton, offcut, rejected frame, pneumatic condensate, wastewater or retired whole tool/equipment stream, record one complete receiver event Qt with substrate, retained steel/plastic/oil/dust/other residue and water once. Origin/assay components are nested nonadditive ledgers until actually separated before export. The real provider receives the full physical Qt in its compatible unit once. Separately identify the total actual modelling-service demand and nonoverlapping A_e,c for every serviced original cohort Q0_c (or actual new-manufacture Q_c), including failed work and original history. A share changes attributed service/burden, never the actual receiver mass. Unknown assignment remains unresolved; neither charge Qt again to each cohort nor shrink its physical exit. | `ilcd-allocation-2010`; `zhe-frame-riveting-2026` |\n| b_complete_8 | all actual applicable exchanges | Every actual riveting press, pneumatic compressor, motion-test fixture, reusable die and consumable abrasive has its own actual configured fleet/stock genealogy, full received/returned/retired physical mass, installed-fluid and real wear/repair exchanges. Whole equipment provider and decomposed manufacture/maintenance are mutually exclusive. Keep actual service history and compatible provider quantity separate from physical V. A Mass/kg asset-product provider may be attributed using measured complete configuration M and a substantiated service fraction from the provider’s actual coverage/history; no guessed weight, life, capacity or assumed full lifetime from observed H. A service provider in h or another unit retains that unit through an explicit actual bridge, not a direct kg substitution. Missing actual denominator keeps A unresolved while real stocks, performed service and failures remain. | `ilcd-allocation-2010`; `zhe-frame-riveting-2026` |\n| b_complete_9 | all actual applicable exchanges | The product and route are supported qualitatively, not as a measured plant LCI or transfer of catalog limits. Actual grade/coating/runner material/provider, dimensions, quantities and lot QA remain foreground requirements; missing such observations does not itself erase an established weighing, metering, mechanical inspection or allocation method. Keep actual calibration, recovery, detection/quantification limits and uncertainty appropriate to the measurand. For pneumatic air record independently measured humid intake/exhaust/state and each actual species, condensate and lubricant outlet. Do not assume constant atmospheric composition, infer oil/VOC species from COD, force reacting-species conservation or use one closure residual for several unknowns. A genuinely unestablished necessary species/matrix programme stays a specific hold for the affected claim; a future SOP, successful finite check or unperformed QA cannot waive it. | `ilcd-allocation-2010`; `zhe-frame-riveting-2026` |\n\n"
