  - rule_id: validation_rule_40
    applies_to: "foreground_dataset_conformance"
    rule: "Conditional actual molecular argon at the atmospheric boundary of onsite pneumatic air preparation/use, not a purchased bottled gas. Measure composition and real humid gas amount/state; distinguish dry and wet basis and same species at inlet/outlet. Full gross flow remains; do not net opposing legs, fit one residual for several species or treat air as pure nitrogen. Compressor electricity is purchased once in frame_electricity. Native synonyms include an inconsistent41Ar entry alongside Ar/Argon-40, while the basename, CAS7440-37-1, Mass reference and air category identify ordinary elemental argon. Disclose this specific synonym defect; adoption is limited to measured ordinary atmospheric Ar, never a radioactive isotope or liquid Product and never an inferred activity amount. Native medium/direction is Emissions to air / unspecified (not long-term); Mass/kg on exact support chain. Keep intake and exhaust as distinct full gross legs, with actual phase/T/P/humidity and no netting."
    source_ids: []
  - rule_id: validation_rule_41
    applies_to: "foreground_dataset_conformance"
    rule: "Conditional actual H2O gas crossing the air boundary from humidity or real evaporation. State medium, humidity, T/P and independent water balance; do not invent reaction water, pure-water density for another substance or an external steam loop. Actual pneumatic condensate collected as waste is recorded separately. Native aliases include heavy/tritiated water and ice/liquid terms. The actual adopted identity is only ordinary water vapour CAS7732-18-5 in the air-emission category, never isotopic water, ice/liquid, fresh-water discharge or steam Product. No density follows from its Mass-only property. Native medium/direction is Emissions to air / unspecified (not long-term); Mass/kg on exact support chain. Keep intake and exhaust as distinct full gross legs, with actual phase/T/P/humidity and no netting."
    source_ids: []
  - rule_id: validation_rule_42
    applies_to: "foreground_dataset_conformance"
    rule: "One independently complete straight auto-opening steel umbrella frame: finished steel shaft, all actual main ribs and stretchers, moulded top notch and runner, operating spring/catch and joints, plus matched steel ferrule and actual supplied metal tips. No canopy or handle. The native manufactured finished Product family is broad; this single whole frame is the only selected physical exchange. Its production-mix at-plant identity fixes neither alloy, finish chemistry, size, rib count, country, life nor performance. Use actual complete supply BOM and net Mass/kg; no intermediate, single rib, furniture frame or parent umbrella substitutes. Supplier/geometry/coating and mechanism limits must accompany every consumer use. This card is actual full gross returned Product receipt, linked to its original first-release cohort; no new manufacture purchase or Q. Keep original burdens and only actual incremental service/rework. An actual disassembled/incomplete or discarded return uses its real article/Waste state rather than this complete-frame identity."
    source_ids: []
  - rule_id: validation_rule_43
    applies_to: "foreground_dataset_conformance"
    rule: "Use only actual Chinese user-side grid-average alternating current below1kV. Native reference is Net calorific value with the exact energy unit group and MJ; this is an energy identity, not combustion or a fuel heating value. Meter actual kWh and convert by3.6 once. Confirm voltage, China supply geography, period and provider losses/mix boundaries. Include compressor drives, riveting, inspection, start/stop, idle, cleanup and actual rework; no default consumption. Actual initially required packing is attributed to new manufacture Q_c; only later real storage/handling/repacking service observed in H uses original cohort Q0_c, including retained FG and zero dispatch. Unknown future service is not forecast as performed. First release is after all same-configuration required fitting, assembly, checks, rework and required supply packing, ready for supply at the plant. Q_c (also Q0_c) is the independently weighed sum of unique first accepted complete-frame net masses, excluding packaging tare and including actual matched loose parts. Original product composition, water state and acceptance IDs are locked before reconciliation. Initial required packing belongs to new manufacture; later storage, repacking, redelivery, repair and retest are only real service of the original cohort in H and never a second acceptance. Reopening or failed work does not erase previous loads."
    source_ids: []
  - rule_id: validation_rule_44
    applies_to: "foreground_dataset_conformance"
    rule: "Conditional real reusable steel die crossing the site boundary. Record full gross physical mass with serial identity, not allocated-service kg. Carry supplier asset burden and actual service capacity separately; internal reuse is not a new purchase, co-product or credit. Real wear/spent waste is separate; no fabricated life or throughput. Every actual riveting press, pneumatic compressor, motion-test fixture, reusable die and consumable abrasive has its own actual configured fleet/stock genealogy, full received/returned/retired physical mass, installed-fluid and real wear/repair exchanges. Whole equipment provider and decomposed manufacture/maintenance are mutually exclusive. Keep actual service history and compatible provider quantity separate from physical V. A Mass/kg asset-product provider may be attributed using measured complete configuration M and a substantiated service fraction from the provider’s actual coverage/history; no guessed weight, life, capacity or assumed full lifetime from observed H. A service provider in h or another unit retains that unit through an explicit actual bridge, not a direct kg substitution. Missing actual denominator keeps A unresolved while real stocks, performed service and failures remain."
    source_ids: []
  - rule_id: validation_rule_45
    applies_to: "foreground_dataset_conformance"
    rule: "Conditional on this actual one packaging article and real purchase event. All complete wet O/P/I/ERin/S/EOout/W and true J/H2O legs follow the literal full equation below; no shortened six-leg closure without real increments. Internal handoff pairs cancel and are not procurement. Use full measured physical V on each leg; no A burden share, stock-consumption surrogate, net Q inclusion or automatic co-product/credit. Purchased whole article contains all its material layers/adhesive once. Native Product is a finished polyethylene bag (CAS9002-88-4), production mix at plant, Mass/kg; not PP/PVC, loose resin or plain film. Check actual polymer, article form and supplier. Waste has no Product UUID. For each actual polyethylene-bag or corrugated-carton whole wet pool in kg, verify O + P + I + ERin + J_in + H2O_in - X_in = C + S + EOout + W + J_out + H2O_out - X_out. O/C include empty, WIP-attached, FG-attached, returned and reusable physical stocks; P is fresh purchase, I real supplier-included receipt, ERin external return received inward, S gross shipment outward, EOout external return sent outward, and W the actual whole wet waste exit. Paired internal reuse cancels on consolidation; it is neither ERin nor EOout nor procurement. Actual supplier-included packaging has one complete upstream owner and is never bought again. J_in/J_out are independently evidenced disjoint additional non-water transfers such as actual retained repair material, dust or oil only where not already included in another whole gross leg. H2O_in/H2O_out are actual sorption/addition/evaporation or other water transfers not already contained in a wet leg. Closing C retains all true additions even without repair. X_in/X_out subtract only proved overlap between OTHER same-side flow observations; never real J/H2O, C, opposite directions, unknown closure differences or card existence. Unknown terms are not fitted. Trace each true increment to its physical source/receiver and specific atomic interface; paired internal J/water is not a new provider or waste exit. Nested water/material in a gross wet leg is counted once."
    source_ids: []
