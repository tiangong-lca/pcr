elivery, repair and retest are only real service of the original cohort in H and never a second acceptance. Reopening or failed work does not erase previous loads.\n\nIndependently verify Q0_c = D0_c + FG0_c + Held0_c + L0_c + T0_c, with disjoint remaining original-material deliveries, released on-site FG, every other actual accepted on-site state, irreversible original material/water losses, and other terminal dispositions. Subdivide those bins for every real location/status; gross delivery/return loops cancel only in this event bridge. Record each original-material fate once on its locked acceptance basis. Independently bridge each surviving present wet mass to original matter still present plus real retained later non-water material and water changes. Do not restore a lost original mass into a survivor and also retain it in L0_c. New material/sorbed water creates physical mass, not new Q. Q0_c=0 or unknown retains all raw loads and no normalized result.\n\nKeep full wet raw/WIP/non-WIP/accepted/held/returned FG, packaging, installed fluids and all actual equipment/tool stocks independent of reference events and per-exchange burdens. Own opening WIP carries its complete real prior foreground history once; transfer only substantiated unassigned closing vectors. A linked whole provider dataset and its embedded steel/polymer/coating/utility/transport/machine history are alternatives to the same decomposed history, never additive. Bought formed/tempered/finished components require complete actual producer coverage and delivery state. Do not invent purchases to hide known on-site forming, coating, heat treatment, compressor operation or other real production; a changed route needs explicit scope review and complete atomic exchanges.\n\nFor each actual polyethylene-bag or corrugated-carton whole wet pool in kg, verify O + P + I + ERin + J_in + H2O_in - X_in = C + S + EOout + W + J_out + H2O_out - X_out. O/C include empty, WIP-attached, FG-attached, returned and reusable physical stocks; P is fresh purchase, I real supplier-included receipt, ERin external return received inward, S gross shipment outward, EOout external return sent outward, and W the actual whole wet waste exit. Paired internal reuse cancels on consolidation; it is neither ERin nor EOout nor procurement. Actual supplier-included packaging has one complete upstream owner and is never bought again.\n\nJ_in/J_out are independently evidenced disjoint additional non-water transfers such as actual retained repair material, dust or oil only where not already included in another whole gross leg. H2O_in/H2O_out are actual sorption/addition/evaporation or other water transfers not already contained in a wet leg. Closing C retains all true additions even without repair. X_in/X_out subtract only proved overlap between OTHER same-side flow observations; never real J/H2O, C, opposite directions, unknown closure differences or card existence. Unknown terms are not fitted. Trace each true increment to its physical source/receiver and specific atomic interface; paired internal J/water is not a new provider or waste exit. Nested water/material in a gross wet leg is counted once.\n\nFor each actual contaminated wipe, bag, carton, offcut, rejected frame, pneumatic condensate, wastewater or retired whole tool/equipment stream, record one complete receiver event Qt with substrate, retained steel/plastic/oil/dust/other residue and water once. Origin/assay components are nested nonadditive ledgers until actually separated before export. The real provider receives the full physical Qt in its compatible unit once. Separately identify the total actual modelling-service demand and nonoverlapping A_e,c for every serviced original cohort Q0_c (or actual new-manufacture Q_c), including failed work and original history. A share changes attributed service/burden, never the actual receiver mass. Unknown assignment remains unresolved; neither charge Qt again to each cohort nor shrink its physical exit.\n\nThe product and route are supported qualitatively, not as a measured plant LCI or transfer of catalog limits. Actual grade/coating/runner material/provider, dimensions, quantities and lot QA remain foreground requirements; missing such observations does not itself erase an established weighing, metering, mechanical inspection or allocation method. Keep actual calibration, recovery, detection/quantification limits and uncertainty appropriate to the measurand. For pneumatic air record independently measured humid intake/exhaust/state and each actual species, condensate and lubricant outlet. Do not assume constant atmospheric composition, infer oil/VOC species from COD, force reacting-species conservation or use one closure residual for several unknowns. A genuinely unestablished necessary species/matrix programme stays a specific hold for the affected claim; a future SOP, successful finite check or unperformed QA cannot waive it.\n\n"
