    source_ids: []
  - rule_id: validation_rule_77
    applies_to: "foreground_dataset_conformance"
    rule: "J_in/J_out are independently evidenced disjoint additional non-water transfers such as actual retained repair material, dust or oil only where not already included in another whole gross leg. H2O_in/H2O_out are actual sorption/addition/evaporation or other water transfers not already contained in a wet leg. Closing C retains all true additions even without repair. X_in/X_out subtract only proved overlap between OTHER same-side flow observations; never real J/H2O, C, opposite directions, unknown closure differences or card existence. Unknown terms are not fitted. Trace each true increment to its physical source/receiver and specific atomic interface; paired internal J/water is not a new provider or waste exit. Nested water/material in a gross wet leg is counted once."
