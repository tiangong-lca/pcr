  - rule_id: validation_rule_66
    applies_to: "foreground_dataset_conformance"
    rule: "Conditional actual out event of this one complete equipment configuration; no default equipment mass or installed-fluid recipe. Every actual riveting press, pneumatic compressor, motion-test fixture, reusable die and consumable abrasive has its own actual configured fleet/stock genealogy, full received/returned/retired physical mass, installed-fluid and real wear/repair exchanges. Whole equipment provider and decomposed manufacture/maintenance are mutually exclusive. Keep actual service history and compatible provider quantity separate from physical V. A Mass/kg asset-product provider may be attributed using measured complete configuration M and a substantiated service fraction from the provider’s actual coverage/history; no guessed weight, life, capacity or assumed full lifetime from observed H. A service provider in h or another unit retains that unit through an explicit actual bridge, not a direct kg substitution. Missing actual denominator keeps A unresolved while real stocks, performed service and failures remain."
    source_ids: []
  - rule_id: validation_rule_67
    applies_to: "foreground_dataset_conformance"
    rule: "Conditional actual spent die Waste with full mass and one provider; link original asset genealogy without duplicating embodied steel purchase. Distinguish retained worn tool from an external exit. For each actual contaminated wipe, bag, carton, offcut, rejected frame, pneumatic condensate, wastewater or retired whole tool/equipment stream, record one complete receiver event Qt with substrate, retained steel/plastic/oil/dust/other residue and water once. Origin/assay components are nested nonadditive ledgers until actually separated before export. The real provider receives the full physical Qt in its compatible unit once. Separately identify the total actual modelling-service demand and nonoverlapping A_e,c for every serviced original cohort Q0_c (or actual new-manufacture Q_c), including failed work and original history. A share changes attributed service/burden, never the actual receiver mass. Unknown assignment remains unresolved; neither charge Qt again to each cohort nor shrink its physical exit."
