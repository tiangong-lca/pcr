    rule: "Conditional on this actual one packaging article and real shipment event. All complete wet O/P/I/ERin/S/EOout/W and true J/H2O legs follow the literal full equation below; no shortened six-leg closure without real increments. Internal handoff pairs cancel and are not procurement. Use full measured physical V on each leg; no A burden share, stock-consumption surrogate, net Q inclusion or automatic co-product/credit. Purchased whole article contains all its material layers/adhesive once. Native Product is a finished polyethylene bag (CAS9002-88-4), production mix at plant, Mass/kg; not PP/PVC, loose resin or plain film. Check actual polymer, article form and supplier. Waste has no Product UUID. For each actual polyethylene-bag or corrugated-carton whole wet pool in kg, verify O + P + I + ERin + J_in + H2O_in - X_in = C + S + EOout + W + J_out + H2O_out - X_out. O/C include empty, WIP-attached, FG-attached, returned and reusable physical stocks; P is fresh purchase, I real supplier-included receipt, ERin external return received inward, S gross shipment outward, EOout external return sent outward, and W the actual whole wet waste exit. Paired internal reuse cancels on consolidation; it is neither ERin nor EOout nor procurement. Actual supplier-included packaging has one complete upstream owner and is never bought again. J_in/J_out are independently evidenced disjoint additional non-water transfers such as actual retained repair material, dust or oil only where not already included in another whole gross leg. H2O_in/H2O_out are actual sorption/addition/evaporation or other water transfers not already contained in a wet leg. Closing C retains all true additions even without repair. X_in/X_out subtract only proved overlap between OTHER same-side flow observations; never real J/H2O, C, opposite directions, unknown closure differences or card existence. Unknown terms are not fitted. Trace each true increment to its physical source/receiver and specific atomic interface; paired internal J/water is not a new provider or waste exit. Nested water/material in a gross wet leg is counted once."
