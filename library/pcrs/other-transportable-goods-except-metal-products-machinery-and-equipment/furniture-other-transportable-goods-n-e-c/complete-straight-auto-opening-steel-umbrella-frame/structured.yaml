      markdown: "## 7. Allocation and Co-product Handling\n\nThe following hierarchy applies only to attributional modelling cases that require allocation. An industrial frame document establishes no LCA allocation rule. Apply criteria exchange by exchange, never one optional physical/economic key for the entire factory. `ilcd-allocation-2010`\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_subdivide | all inventory rows | First isolate dedicated processes and directly measured exclusive inputs/outlets. Use physical subdivision where possible and justified virtual subdivision for identifiable components or services; record which remaining exchanges still share a process. Material actually embodied in one frame configuration is directly assigned, not averaged across unrelated goods. | `ilcd-allocation-2010` |\n| a_causal | all inventory rows | For each remaining exchange identify the determining physical causal relationship to its co-functions, supported by the real process response. Test actual machine/service duration and the limiting geometry/mass/load mechanism as applicable; mere correlation, a convenient mass share or common meter is not a causal demonstration. Different exchanges may need different justified keys. | `ilcd-allocation-2010` |\n| a_residual | all inventory rows | Only a genuinely inseparable remainder without demonstrated determining physical causality may use a justified market-value key at the same actual common-process gate and leaving/entering state. Use contemporaneous quantities and quality/finish/packaging state and prices; remove later transport/conditioning/service value. Disclose derived price evidence, uncertainty, sensitivity and lack of causal evidence. No fixed ratio, arbitrary choice, retail-price shortcut or automatic recovered-material credit. | `ilcd-allocation-2010` |\n| a_conserve | all inventory rows | All attributed burdens sum to the original shared burden with no lost failures or duplicate vectors. Keep physical gross legs unscaled. Waste sale does not itself establish a co-product, substitution credit or recycling allocation; actual downstream treatment/recycling interfaces require their own complete justified scope with a single owner. | `ilcd-allocation-2010` |\n\n"
