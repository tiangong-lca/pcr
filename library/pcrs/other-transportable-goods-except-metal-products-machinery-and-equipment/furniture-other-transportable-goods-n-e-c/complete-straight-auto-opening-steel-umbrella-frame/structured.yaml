  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "First release is after all same-configuration required fitting, assembly, checks, rework and required supply packing, ready for supply at the plant. Q_c (also Q0_c) is the independently weighed sum of unique first accepted complete-frame net masses, excluding packaging tare and including actual matched loose parts. Original product composition, water state and acceptance IDs are locked before reconciliation. Initial required packing belongs to new manufacture; later storage, repacking, redelivery, repair and retest are only real service of the original cohort in H and never a second acceptance. Reopening or failed work does not erase previous loads. A count-to-kg bridge uses independently measured actual same-configuration net mass; no default piece weight/density."
  - id: raw_conversion
    applies_to: "all inventory rows"
    required_property_ref:
      name: "actual reference property"
      uuid: ""
    required_unit: "native unit"
    rule: "Convert real raw units before attribution. kWh ×3.6 gives MJ once; tonnes ×1000 gives kg. Integrate only a true rate over actual time; an integrated volume is already extensive. Volume-to-mass needs independent same-substance phase/T/P density; secondary flow factors do not provide it. Item and Item(s) denote the same count unit with factor1 but imply no kg conversion."
  - id: single_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "actual reference property"
      uuid: ""
    required_unit: "native unit"
    rule: "Collect raw quantities without division. single_quotient is the only normalization: selected burden A or full gross V divided by original cohort Q_c once. Reference first_release remains1kg. Closing already released FG is already included in Q_c. Q_c=0 preserves every actual load and produces no unit result."
