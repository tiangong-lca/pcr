  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert original extensive units and true rates before any attribution; kWh ×3.6 to MJ once and tonnes ×1000 to kg. Count/volume conversions need independently measured same-configuration net mass or same-substance state density. Preserve whole-preparation/component/water bridges disjoint."
      inputs:
        - cp_components
        - cp_release
        - cp_energy
        - cp_aux
        - cp_water
        - cp_air
        - cp_fg
        - cp_pack
        - cp_assets
      output: "converted raw extensive values"
      source_ids:
        - ilcd-allocation-2010
    - id: match_manufacture
      applies_to: "all inventory rows"
      rule: "For each burden dimension e, A_e = B_open,e + U_e - B_close,e - T_other,e after convert_raw and justified exclusive/causal/residual attribution. Maintain each inherited raw/WIP/non-WIP vector. Exclude released FG from B_close; retain failure/test/cleanup/rework/waste/treatment loads and actual zero-output events. T_other is a proven one-time other-cohort/function handover, never an unexplained subtraction. No second correction to stock-corrected values."
      inputs:
        - convert_raw
        - cp_components
        - cp_release
        - cp_energy
        - cp_aux
        - cp_assets
        - cp_waste
      output: "manufacturing A_e bound to release cohort"
      source_ids:
        - ilcd-allocation-2010
    - id: match_service
      applies_to: "all inventory rows"
      rule: "For each original cohort c and actual H, service A_e,c = opening unused/unassigned service vector + actual incremental service - closing unused/unassigned service vector - proven independent handover. Keep original Q_c, prior burden genealogy and all performed service even when FG remains or dispatch is zero. No subtraction of already performed service due to closing FG; no assumed future work or repeat Q."
      inputs:
        - convert_raw
        - cp_service
        - cp_fg
        - cp_components
        - cp_assets
        - cp_pack
      output: "observed service A_e,c"
      source_ids:
        - ilcd-allocation-2010
    - id: select_gross
      applies_to: "all inventory rows"
      rule: "Every physical event dimension uses full actual converted V_e on its own leg: component/FG return and shipment, all packaging events, assets, fluids, Waste and molecular species. Never use A, stock differences, consumption, economic/service shares or a burden vector for these physical numerators. A gross event creates no second purchase, treatment or credit; bridge one separate burden owner where real. X only deduplicates a same-side OTHER flow already represented, never stocks/opposite legs/card existence."
      inputs:
        - convert_raw
        - cp_components
        - cp_fg
        - cp_pack
        - cp_assets
        - cp_waste
        - cp_water
        - cp_air
      output: "complete unscaled physical V_e"
      source_ids:
        - ilcd-allocation-2010
    - id: single_quotient
      applies_to: "all inventory rows"
      rule: "The sole normalization is reported quantity = selected numerator / Q_c once. Select match_manufacture A_e for manufacture burden, match_service A_e,c for observed service burden, or select_gross full V_e for physical events; preserve separate dimensions/one owner. Q_c is original newly first-released complete-frame net kg. first_release is1kg. All cards and aggregation reference this same result with no further division. Q_c=0 retains every actual load and genealogy for later justified attribution and produces no unit result."
      inputs:
        - match_manufacture
        - match_service
        - select_gross
        - cp_release
      output: "one per reference flow report with distinct physical and burden dimensions"
      source_ids:
        - ilcd-allocation-2010
    - id: physical_closure
      applies_to: "all inventory rows"
      rule: "For each actual polyethylene-bag or corrugated-carton whole wet pool in kg, verify O + P + I + ERin + J_in + H2O_in - X_in = C + S + EOout + W + J_out + H2O_out - X_out. O/C include empty, WIP-attached, FG-attached, returned and reusable physical stocks; P is fresh purchase, I real supplier-included receipt, ERin external return received inward, S gross shipment outward, EOout external return sent outward, and W the actual whole wet waste exit. Paired internal reuse cancels on consolidation; it is neither ERin nor EOout nor procurement. Actual supplier-included packaging has one complete upstream owner and is never bought again. J_in/J_out are independently evidenced disjoint additional non-water transfers such as actual retained repair material, dust or oil only where not already included in another whole gross leg. H2O_in/H2O_out are actual sorption/addition/evaporation or other water transfers not already contained in a wet leg. Closing C retains all true additions even without repair. X_in/X_out subtract only proved overlap between OTHER same-side flow observations; never real J/H2O, C, opposite directions, unknown closure differences or card existence. Unknown terms are not fitted. Trace each true increment to its physical source/receiver and specific atomic interface; paired internal J/water is not a new provider or waste exit. Nested water/material in a gross wet leg is counted once. Independently reconcile manufacturing, FG/service and combined full wet physical gates as well; pair/cancel internal first-release and reuse transfers, and never treat reference events as extra external exits."
      inputs:
        - cp_components
        - cp_release
        - cp_fg
        - cp_pack
        - cp_assets
        - cp_air
        - cp_water
        - cp_waste
      output: "manufacturing and FG/service and combined physical closure reports"
      source_ids:
        - ilcd-allocation-2010
    - id: original_cohort_partition
      applies_to: "reference product"
      rule: "Independently verify Q0_c = D0_c + FG0_c + Held0_c + L0_c + T0_c, with disjoint remaining original-material deliveries, released on-site FG, every other actual accepted on-site state, irreversible original material/water losses, and other terminal dispositions. Subdivide those bins for every real location/status; gross delivery/return loops cancel only in this event bridge. Record each original-material fate once on its locked acceptance basis. Independently bridge each surviving present wet mass to original matter still present plus real retained later non-water material and water changes. Do not restore a lost original mass into a survivor and also retain it in L0_c. New material/sorbed water creates physical mass, not new Q. Q0_c=0 or unknown retains all raw loads and no normalized result."
      inputs:
        - cp_release
        - cp_fg
        - cp_components
        - cp_waste
      output: "original Q0 and independently reconciled wet physical states"
      source_ids:
        - ilcd-allocation-2010
    - id: whole_receiver_attribution
      applies_to: "all actual waste rows"
      rule: "For each actual contaminated wipe, bag, carton, offcut, rejected frame, pneumatic condensate, wastewater or retired whole tool/equipment stream, record one complete receiver event Qt with substrate, retained steel/plastic/oil/dust/other residue and water once. Origin/assay components are nested nonadditive ledgers until actually separated before export. The real provider receives the full physical Qt in its compatible unit once. Separately identify the total actual modelling-service demand and nonoverlapping A_e,c for every serviced original cohort Q0_c (or actual new-manufacture Q_c), including failed work and original history. A share changes attributed service/burden, never the actual receiver mass. Unknown assignment remains unresolved; neither charge Qt again to each cohort nor shrink its physical exit."
      inputs:
        - cp_waste
        - cp_assets
        - cp_pack
        - cp_fg
        - cp_service
      output: "full physical Qt and separate nonoverlap compatible A_e,c"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_native
      applies_to: "all inventory rows"
      requirement: "Inspect complete native basename/synonym/comment/CAS, grade, route, form/phase, geography, medium, dataset type and every property. Bind exact reference-property version to exact unit-group version and actual reference unit; no latest substitution or secondary-density inference. Preserve full adoption restrictions in every card and normative context. Hard conflicts block that identity; disclose taxonomy defects separately."
      evidence: "Complete native and supplier evidence"
    - id: dq_sources
      applies_to: "all inventory rows"
      requirement: "Original acquisition and this reuse/extraction have separate provenance; source fragments are read with product/process/route/state/need-specific requests. A successful read or fragment_verified alone never proves applicability or numeric reuse. Preserve contrary neighbouring examples and all failed attempts; no fabricated history."
      evidence: "Original source and scope assessment"
    - id: dq_foreground
      applies_to: "all inventory rows"
      requirement: "The product and route are supported qualitatively, not as a measured plant LCI or transfer of catalog limits. Actual grade/coating/runner material/provider, dimensions, quantities and lot QA remain foreground requirements; missing such observations does not itself erase an established weighing, metering, mechanical inspection or allocation method. Keep actual calibration, recovery, detection/quantification limits and uncertainty appropriate to the measurand. For pneumatic air record independently measured humid intake/exhaust/state and each actual species, condensate and lubricant outlet. Do not assume constant atmospheric composition, infer oil/VOC species from COD, force reacting-species conservation or use one closure residual for several unknowns. A genuinely unestablished necessary species/matrix programme stays a specific hold for the affected claim; a future SOP, successful finite check or unperformed QA cannot waive it."
      evidence: "Full BOM/event/stock and uncertainty audit"
validation_rules:
  - rule_id: v_terminal
    applies_to: "reference product"
    rule: "Confirm complete configured frame with correct supplied tips/ferrule and functioning actual mechanism at unique first release. Parent umbrella, raw stock, isolated rib or furniture/jig frame cannot establish this terminal. Preserve all failed/held/refused outcomes and original Q_c history."
    source_ids:
      - ilcd-allocation-2010
      - zhe-frame-riveting-2026
  - rule_id: v_native
    applies_to: "all inventory rows"
    rule: "Check every full adopted identity/property/unit restriction and every required qualifier in consumed context. Missing auxiliary identities remain specific and tracked; no generic collections or Product-for-Waste substitutions. New actual exchanges must be named atomically and independently evidenced."
    source_ids:
      - ilcd-allocation-2010
      - zhe-frame-riveting-2026
  - rule_id: v_accounting
    applies_to: "all inventory rows"
    rule: "Check separate complete wet physical gates, relevant elemental/species closure, inherited exchange vectors, all stock/packaging/asset/FG pools, failures and actual original-cohort service in H. No two-unknown residual, duplicated water/component, shortened gross flow, double Q/FG output or presumed restored condition after unauthorized/failed work."
    source_ids:
      - ilcd-allocation-2010
      - zhe-frame-riveting-2026
  - rule_id: v_normalization
    applies_to: "all inventory rows"
    rule: "Raw collection is unnormalized; convert and attribute before single_quotient and divide once only. Verify all cards/calculation inputs/outputs and collection aggregation share the same original net kg basis. Q_c=0 retains loads and has no unit result. Unsupported real relationships are pending review, not a passing calculation."
    source_ids:
      - ilcd-allocation-2010
      - zhe-frame-riveting-2026
  - rule_id: v_quality
    applies_to: "all inventory rows"
    rule: "Retain full original/source context and independent applicability/uncertainty judgments; cited manufacturer examples prescribe no numeric recipe/performance. Unknown actual inputs/quantity/state and genuine core evidence gaps prevent completeness claims. Technical validation establishes neither scientific review nor translation approval."
    source_ids:
      - ilcd-allocation-2010
      - zhe-frame-riveting-2026
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "This PCR addresses one independently complete straight auto-opening steel umbrella frame before canopy and handle assembly. It includes the actual steel shaft, main ribs and stretchers, moulded top notch and runner, operating spring/catch and joint hardware, matched steel ferrule and actual supplied metal rib tips. Matching loose tips are part of the controlled whole-frame supply when declared; they do not make a separate reference output. It does not combine single ribs, handles and frames into one terminal. The selected foreground route receives already formed and surface-finished components, performs real inspection/sorting and any necessary fit/deburring, rib-to-stretcher and runner/notch riveting, wire retention, spring/catch assembly, motion/lock inspection and actual rework, then required supply packing and one unique complete-frame first quality release ready for supply at the plant. Upstream component forming/tempering/coating is carried once in the bought component datasets. This is substantive complete-part assembly, not purchase and repacking of a completed frame. sep-complete-steel-frame; acme-frame-structure; zhe-frame-riveting-2026"
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "Septrainbow positively offers a complete steel frame with steel shaft, runner, tips, top/ferrule and auto-opening state. Its images show a bare assembled frame and separate finished tips; the light-coloured runner photo and transparent-runner text do not establish a polymer specification. Acme independently describes channel-steel ribs, notch/wire and runner assembly before handle attachment. ZheBrella describes actual steel-joint riveting, holes/finishes and pre-canopy motion checks, while also discussing incompatible fibreglass/hybrid alternatives. The 1970 official investigation describes separately traded assembled frames and their distinction from finished umbrellas; its historical prices, sizes and production rates are not current inventory data. These are a transparent qualitative technical synthesis across sources, not one contemporary SKU, factory, order, recipe or performance certification. Gold colour or the phrase gilt coated does not establish elemental gold, zinc, nickel, coating thickness or the chemistry of this frame. usitc-umbrella-parts-1970; sep-complete-steel-frame; acme-frame-structure; zhe-frame-riveting-2026"
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "The original CPC leaf also covers other umbrella and walking-stick/whip accessories. This narrower frame method does not claim their coverage. Exclude raw steel strip/wire/tube as terminal, isolated ribs or handles, wood and injection-moulded-handle manufacturing routes, fibreglass/carbon/aluminium/hybrid principal frames, furniture/jig frames, bought-complete-frame repacking, onsite component coating/heat treatment, canopy cutting/sewing/printing, parent umbrella assembly, use and end of life. A real additional operation or configuration requires source and exchange-specific applicability review within this same PCR identity. No numerical dimensions, mass, density, alloy, formulation, loss, yield, energy, temperature, time, life, strength, corrosion, opening-cycle or certification threshold is prescribed. un-cpc3-2025"
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Every required qualifier must remain in the dataset/reference comment or equivalent complete context. The broad finished-part family UUID is used only for the one complete frame defined here, not all named family members."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "All nonreference cards use single_quotient exactly once. Burden dimensions use A after legitimate attribution and stock-vector matching; physical gross-event dimensions use full converted V. Keep these distinct dimensions with one ownership bridge when an event supports both; a full physical receipt/exit does not create another upstream purchase, burden or treatment. Collections never pre-divide. Conditional cards apply only when their exact physical event occurs. A missing actual type is added as a new specific card rather than hidden in zero/other."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "One complete fluted/channel rib of the actual straight-frame drawing. Bought forming, punching, tempering and coating are carried in its supplier dataset once; neither bare wire nor strip is this finished input."
    source_ids: []
  - rule_id: validation_rule_12
    applies_to: "foreground_dataset_conformance"
    rule: "One separate finished steel stretcher linking the rib to runner. Keep actual geometry, holes and finish; it is not a second main rib or a whole frame."
    source_ids: []
  - rule_id: validation_rule_13
    applies_to: "foreground_dataset_conformance"
    rule: "A complete worked steel shaft with real cross-section and lock interfaces. The hexagonal gilt-coloured supplier example proves a steel shaft, not an alloy grade, plating chemistry or universal size. Raw tube manufacture and finished-shaft processing are upstream here."
    source_ids: []
  - rule_id: validation_rule_14
    applies_to: "foreground_dataset_conformance"
    rule: "One actual finished metal tip supplied for a rib. Record actual alloy, coating and matching tip count; gold colour proves no elemental gold. Matched loose tips can belong to the same complete frame supply only when the controlled supply list includes them."
    source_ids: []
  - rule_id: validation_rule_15
    applies_to: "foreground_dataset_conformance"
    rule: "One finished steel top ferrule, included only once with the specified shaft/top assembly; if already integral to that bought assembly use a reconciled non-additive subledger instead of buying it again."
    source_ids: []
  - rule_id: validation_rule_16
    applies_to: "foreground_dataset_conformance"
    rule: "The actual finished spring for this auto-open mechanism. Declare alloy, shape, coating and as-supplied assembly contents. Steel wire and an innerspring mattress core cannot substitute for this formed spring."
    source_ids: []
  - rule_id: validation_rule_17
    applies_to: "foreground_dataset_conformance"
    rule: "One actual finished latch/catch engaging the runner; an integral catch in the bought shaft or spring module is a non-additive contents record. Include the actual trigger interface without assuming a supplied handle."
    source_ids: []
  - rule_id: validation_rule_18
    applies_to: "foreground_dataset_conformance"
    rule: "One finished moulded sliding runner of the actual mechanism. The primary page calls the runner transparent while photographs show a light-coloured part; neither proves its polymer, filler, density or formulation. Obtain actual material and supply evidence; resin granules are not the finished runner."
    source_ids: []
  - rule_id: validation_rule_19
    applies_to: "foreground_dataset_conformance"
    rule: "One finished slotted top notch retaining the ribs. The independent structure account allows nylon or other plastic and does not determine this supplier component resin. Specify actual material, fit and contents without adding its constituents to the whole bought article mass."
    source_ids: []
  - rule_id: validation_rule_20
    applies_to: "foreground_dataset_conformance"
    rule: "One specified semi-tubular steel joint rivet. Determine actual metal, head, dimensions and finish; count each installed/rejected/replacement rivet. The kg inventory needs one compatible Mass-reference identity for this single rivet; a Volume-only identity without an independent conversion basis or a multi-fastener aggregate cannot establish it."
    source_ids: []
  - rule_id: validation_rule_21
    applies_to: "foreground_dataset_conformance"
    rule: "One measured non-alloy steel wire used to retain the ribs at the top notch. Native record is a cylindrical flexible metallic strand at factory production mix with no specified diameter or grade; classification identifies iron/non-alloy wire. It is not alloy wire, rope, a complete rib or a finished spring. Confirm actual grade, diameter, coating and provider; all wire embodied in a supplied notch assembly is already included there."
