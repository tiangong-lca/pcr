      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_terminal | reference product | Confirm complete configured frame with correct supplied tips/ferrule and functioning actual mechanism at unique first release. Parent umbrella, raw stock, isolated rib or furniture/jig frame cannot establish this terminal. Preserve all failed/held/refused outcomes and original Q_c history. | `ilcd-allocation-2010`; `zhe-frame-riveting-2026` |\n| v_native | all inventory rows | Check every full adopted identity/property/unit restriction and every required qualifier in consumed context. Missing auxiliary identities remain specific and tracked; no generic collections or Product-for-Waste substitutions. New actual exchanges must be named atomically and independently evidenced. | `ilcd-allocation-2010`; `zhe-frame-riveting-2026` |\n| v_accounting | all inventory rows | Check separate complete wet physical gates, relevant elemental/species closure, inherited exchange vectors, all stock/packaging/asset/FG pools, failures and actual original-cohort service in H. No two-unknown residual, duplicated water/component, shortened gross flow, double Q/FG output or presumed restored condition after unauthorized/failed work. | `ilcd-allocation-2010`; `zhe-frame-riveting-2026` |\n| v_normalization | all inventory rows | Raw collection is unnormalized; convert and attribute before single_quotient and divide once only. Verify all cards/calculation inputs/outputs and collection aggregation share the same original net kg basis. Q_c=0 retains loads and has no unit result. Unsupported real relationships are pending review, not a passing calculation. | `ilcd-allocation-2010`; `zhe-frame-riveting-2026` |\n| v_quality | all inventory rows | Retain full original/source context and independent applicability/uncertainty judgments; cited manufacturer examples prescribe no numeric recipe/performance. Unknown actual inputs/quantity/state and genuine core evidence gaps prevent completeness claims. Technical validation establishes neither scientific review nor translation approval. | `ilcd-allocation-2010`; `zhe-frame-riveting-2026` |\n\n### Complete applicability, native and accounting context\n\nThis PCR addresses one independently complete straight auto-opening steel umbrella frame before canopy and handle assembly. It includes the actual steel shaft, main ribs and stretchers, moulded top notch and runner, operating spring/catch and joint hardware, matched steel ferrule and actual supplied metal rib tips. Matching loose tips are part of the controlled whole-frame supply when declared; they do not make a separate reference output. It does not combine single ribs, handles and frames into one terminal. The selected foreground route receives already formed and surface-finished components, performs real inspection/sorting and any necessary fit/deburring, rib-to-stretcher and runner/notch riveting, wire retention, spring/catch assembly, motion/lock inspection and actual rework, then required supply packing and one unique complete-frame first quality release ready for supply at the plant. Upstream component forming/tempering/coating is carried once in the bought component datasets. This is substantive complete-part assembly, not purchase and repacking of a completed frame. `sep-complete-steel-frame`; `acme-frame-structure`; `zhe-frame-riveting-2026`\n\nSeptrainbow positively offers a complete steel frame with steel shaft, runner, tips, top/ferrule and auto-opening state. Its images show a bare assembled frame and separate finished tips; the light-coloured runner photo and transparent-runner text do not establish a polymer specification. Acme independently describes channel-steel ribs, notch/wire and runner assembly before handle attachment. ZheBrella describes actual steel-joint riveting, holes/finishes and pre-canopy motion checks, while also discussing incompatible fibreglass/hybrid alternatives. The 1970 official investigation describes separately traded assembled frames and their distinction from finished umbrellas; its historical prices, sizes and production rates are not current inventory data. These are a transparent qualitative technical synthesis across sources, not one contemporary SKU, factory, order, recipe or performance certification. Gold colour or the phrase gilt coated does not establish elemental gold, zinc, nickel, coating thickness or the chemistry of this frame. `usitc-umbrella-parts-1970`; `sep-complete-steel-frame`; `acme-frame-structure`; `zhe-frame-riveting-2026`\n\nThe original CPC leaf also covers other umbrella and walking-stick/whip accessories. This narrower frame method does not claim their coverage. Exclude raw steel strip/wire/tube as terminal, isolated ribs or handles, wood and injection-moulded-handle manufacturing routes, fibreglass/carbon/aluminium/hybrid principal frames, furniture/jig frames, bought-complete-frame repacking, onsite component coating/heat treatment, canopy cutting/sewing/printing, parent umbrella assembly, use and end of life. A real additional operation or configuration requires source and exchange-specific applicability review within this same PCR identity. No numerical dimensions, mass, density, alloy, formulation, loss, yield, energy, temperature, time, life, strength, corrosion, opening-cycle or certification threshold is prescribed. `un-cpc3-2025`\n\nEvery required qualifier must remain in the dataset/reference comment or equivalent complete context. The broad finished-part family UUID is used only for the one complete frame defined here, not all named family members.\n\nAll nonreference cards use single_quotient exactly once. Burden dimensions use A after legitimate attribution and stock-vector matching; physical gross-event dimensions use full converted V. Keep these distinct dimensions with one ownership bridge when an event supports both; a full physical receipt/exit does not create another upstream purchase, burden or treatment. Collections never pre-divide. Conditional cards apply only when their exact physical event occurs. A missing actual type is added as a new specific card rather than hidden in zero/other.\n\nOne complete fluted/channel rib of the actual straight-frame drawing. Bought forming, punching, tempering and coating are carried in its supplier dataset once; neither bare wire nor strip is this finished input.\n\nOne separate finished steel stretcher linking the rib to runner. Keep actual geometry, holes and finish; it is not a second main rib or a whole frame.\n\nA complete worked steel shaft with real cross-section and lock interfaces. The hexagonal gilt-coloured supplier example proves a steel shaft, not an alloy grade, plating chemistry or universal size. Raw tube manufacture and finished-shaft processing are upstream here.\n\nOne actual finished metal tip supplied for a rib. Record actual alloy, coating and matching tip count; gold colour proves no elemental gold. Matched loose tips can belong to the same complete frame supply only when the controlled supply list includes them.\n\nOne finished steel top ferrule, included only once with the specified shaft/top assembly; if already integral to that bought assembly use a reconciled non-additive subledger instead of buying it again.\n\nThe actual finished spring for this auto-open mechanism. Declare alloy, shape, coating and as-supplied assembly contents. Steel wire and an innerspring mattress core cannot substitute for this formed spring.\n\nOne actual finished latch/catch engaging the runner; an integral catch in the bought shaft or spring module is a non-additive contents record. Include the actual trigger interface without assuming a supplied handle.\n\nOne finished moulded sliding runner of the actual mechanism. The primary page calls the runner transparent while photographs show a light-coloured part; neither proves its polymer, filler, density or formulation. Obtain actual material and supply evidence; resin granules are not the finished runner.\n\nOne finished slotted top notch retaining the ribs. The independent structure account allows nylon or other plastic and does not determine this supplier component resin. Specify actual material, fit and contents without adding its constituents to the whole bought article mass.\n\nOne specified semi-tubular steel joint rivet. Determine actual metal, head, dimensions and finish; count each installed/rejected/replacement rivet. The kg inventory needs one compatible Mass-reference identity for this single rivet; a Volume-only identity without an independent conversion basis or a multi-fastener aggregate cannot establish it.\n\nOne measured non-alloy steel wire used to retain the ribs at the top notch. Native record is a cylindrical flexible metallic strand at factory production mix with no specified diameter or grade; classification identifies iron/non-alloy wire. It is not alloy wire, rope, a complete rib or a finished spring. Confirm actual grade, diameter, coating and provider; all wire embodied in a supplied notch assembly is already included there.\n\nUse only actual Chinese user-side grid-average alternating current below1kV. Native reference is Net calorific value with the exact energy unit group and MJ; this is an energy identity, not combustion or a fuel heating value. Meter actual kWh and convert by3.6 once. Confirm voltage, China supply geography, period and provider losses/mix boundaries. Include compressor drives, riveting, inspection, start/stop, idle, cleanup and actual rework; no default consumption.\n\nConditional on actual treated municipal/potable supply used for cleaning. Native Product is treated tap water at factory production mix, not direct natural-water extraction or unspecified industrial water. Use reference Mass/kg; the secondary Volume factor0.001 is not an independent density measurement and is not adopted. Weigh actual water or use separately measured same-state density for volume records; identify provider treatment, location and period.\n\nConditional on this actual whole purchased lubricant. Record supplier formulation identity and delivered whole mass, including all additives/carrier once; a PAO/full-synthesis record is not compatible merely because it is called lubricating oil. If another preparation is actually used add its own specific card. Integral oil left on bought parts is already carried in that whole component; separately added oil remains an exchange.\n\nConditional on actual cotton cloth consumption. Declare fibre, reuse pool, dry/as-used mass and contamination; an actual different wipe requires its own card. Count fresh procurement once and preserve used-cloth stock/waste separately.\n\nConditional only where this actual abrasive is used in necessary hole or edge deburring before assembly. Record binder and whole supplied tool mass once, wear and spent disposal; a different abrasive needs its own atomic card. No cut/form/heat-treatment/plating sequence is invented for already finished inputs. Every actual riveting press, pneumatic compressor, motion-test fixture, reusable die and consumable abrasive has its own actual configured fleet/stock genealogy, full received/returned/retired physical mass, installed-fluid and real wear/repair exchanges. Whole equipment provider and decomposed manufacture/maintenance are mutually exclusive. Keep actual service history and compatible provider quantity separate from physical V. A Mass/kg asset-product provider may be attributed using measured complete configuration M and a substantiated service fraction from the provider’s actual coverage/history; no guessed weight, life, capacity or assumed full lifetime from observed H. A service provider in h or another unit retains that unit through an explicit actual bridge, not a direct kg substitution. Missing actual denominator keeps A unresolved while real stocks, performed service and failures remain.\n\nConditional actual molecular nitrogen at the atmospher