    rule: "Conditional only where this actual abrasive is used in necessary hole or edge deburring before assembly. Record binder and whole supplied tool mass once, wear and spent disposal; a different abrasive needs its own atomic card. No cut/form/heat-treatment/plating sequence is invented for already finished inputs. Every actual riveting press, pneumatic compressor, motion-test fixture, reusable die and consumable abrasive has its own actual configured fleet/stock genealogy, full received/returned/retired physical mass, installed-fluid and real wear/repair exchanges. Whole equipment provider and decomposed manufacture/maintenance are mutually exclusive. Keep actual service history and compatible provider quantity separate from physical V. A Mass/kg asset-product provider may be attributed using measured complete configuration M and a substantiated service fraction from the provider’s actual coverage/history; no guessed weight, life, capacity or assumed full lifetime from observed H. A service provider in h or another unit retains that unit through an explicit actual bridge, not a direct kg substitution. Missing actual denominator keeps A unresolved while real stocks, performed service and failures remain."
