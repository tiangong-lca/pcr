allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The following hierarchy applies only to attributional modelling cases that require allocation. An industrial frame document establishes no LCA allocation rule. Apply criteria exchange by exchange, never one optional physical/economic key for the entire factory. ilcd-allocation-2010"
    source_ids: []
  - rule_id: a_subdivide
    applies_to: "all inventory rows"
    rule: "First isolate dedicated processes and directly measured exclusive inputs/outlets. Use physical subdivision where possible and justified virtual subdivision for identifiable components or services; record which remaining exchanges still share a process. Material actually embodied in one frame configuration is directly assigned, not averaged across unrelated goods."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_causal
    applies_to: "all inventory rows"
    rule: "For each remaining exchange identify the determining physical causal relationship to its co-functions, supported by the real process response. Test actual machine/service duration and the limiting geometry/mass/load mechanism as applicable; mere correlation, a convenient mass share or common meter is not a causal demonstration. Different exchanges may need different justified keys."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_residual
    applies_to: "all inventory rows"
    rule: "Only a genuinely inseparable remainder without demonstrated determining physical causality may use a justified market-value key at the same actual common-process gate and leaving/entering state. Use contemporaneous quantities and quality/finish/packaging state and prices; remove later transport/conditioning/service value. Disclose derived price evidence, uncertainty, sensitivity and lack of causal evidence. No fixed ratio, arbitrary choice, retail-price shortcut or automatic recovered-material credit."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_conserve
    applies_to: "all inventory rows"
    rule: "All attributed burdens sum to the original shared burden with no lost failures or duplicate vectors. Keep physical gross legs unscaled. Waste sale does not itself establish a co-product, substitution credit or recycling allocation; actual downstream treatment/recycling interfaces require their own complete justified scope with a single owner."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_components
      process_id: "p_frame"
      flow_role: "component"
      record_type: "foreground_record"
      raw_fields: "article and supplier IDs; actual BOM; grade/material; finish; processed state; gross receipts; returns; initial/final raw/WIP/non-WIP; inherited exchange vectors; joint and internal handoff IDs"
      collection_method: "Weigh and reconcile each specific whole supplied article with delivery/stock/route records; inspect all internal constituents as non-additive where contained; record actual fit/rework replacement issue and disposition by original cohort."
      unit: "kg"
      frequency: "Each actual event or calibrated meter interval"
      temporal_coverage: "Complete manufacturing period and bounded observed H; include failures and zero output"
      site_scope: "Actual facility and identified supplier/contract stage; cohort matched"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; original invoices/logs; linked whole BOM; stock/event reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_release
      process_id: "p_frame"
      flow_role: "first_release"
      record_type: "foreground_record"
      raw_fields: "cohort c; model/configuration; complete supplied BOM; matched tip/ferrule quantities; actual first acceptance IDs and times; counts; gross/tare/net kg; raw/WIP/FG statuses; tests/rejects; previous-release flag OriginalQ0/all wet original-cohort fates; real Jin/Jout/H2Oin/H2Oout; OTHER same-side duplicate X; wholeQt/actual provider and nonoverlapA; physical fleet and service history."
      collection_method: "Calibrated scale weighing of same-configuration complete frame with matched loose supplied parts; measure packaging tare independently; reconcile accepted units to unique first-release genealogy. Retest/return/rework retains original cohort and creates no additional Q. First release is after all same-configuration required fitting, assembly, checks, rework and required supply packing, ready for supply at the plant. Q_c (also Q0_c) is the independently weighed sum of unique first accepted complete-frame net masses, excluding packaging tare and including actual matched loose parts. Original product composition, water state and acceptance IDs are locked before reconciliation. Initial required packing belongs to new manufacture; later storage, repacking, redelivery, repair and retest are only real service of the original cohort in H and never a second acceptance. Reopening or failed work does not erase previous loads. Independently verify Q0_c = D0_c + FG0_c + Held0_c + L0_c + T0_c, with disjoint remaining original-material deliveries, released on-site FG, every other actual accepted on-site state, irreversible original material/water losses, and other terminal dispositions. Subdivide those bins for every real location/status; gross delivery/return loops cancel only in this event bridge. Record each original-material fate once on its locked acceptance basis. Independently bridge each surviving present wet mass to original matter still present plus real retained later non-water material and water changes. Do not restore a lost original mass into a survivor and also retain it in L0_c. New material/sorbed water creates physical mass, not new Q. Q0_c=0 or unknown retains all raw loads and no normalized result."
      unit: "kg"
      frequency: "Each actual event or calibrated meter interval"
      temporal_coverage: "Complete manufacturing period and bounded observed H; include failures and zero output"
      site_scope: "Actual facility and identified supplier/contract stage; cohort matched"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; original invoices/logs; linked whole BOM; stock/event reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_energy
      process_id: "p_frame"
      flow_role: "electricity"
      record_type: "foreground_record"
      raw_fields: "meter start/end or actual power rate series; voltage; supplier/geography; period; compressor/rivet/test/idle/cleanup/rework states; shared load evidence; unused-service vectors"
      collection_method: "Retain unnormalized meter records and actual time for rates only; separate manufacturing and original-cohort later work. Determine exclusive/causal/residual attribution per exchange; no default energy or zero-output exclusion."
      unit: "kWh; MJ"
      frequency: "Each actual event or calibrated meter interval"
      temporal_coverage: "Complete manufacturing period and bounded observed H; include failures and zero output"
      site_scope: "Actual facility and identified supplier/contract stage; cohort matched"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; original invoices/logs; linked whole BOM; stock/event reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_aux
      process_id: "p_frame"
      flow_role: "whole preparation and wipe"
      record_type: "foreground_record"
      raw_fields: "specific supplier formulation/article; complete mass; assay/carrier subledger; initial/final unused charge; issue/recovery/loss; contamination; actual stage/cohort"
      collection_method: "Weigh each named whole preparation or cloth, retain SDS/composition evidence and physical stocks independently of burden vectors. Separately purchased ingredients require separate cards; no invented recipe."
      unit: "kg"
      frequency: "Each actual event or calibrated meter interval"
      temporal_coverage: "Complete manufacturing period and bounded observed H; include failures and zero output"
      site_scope: "Actual facility and identified supplier/contract stage; cohort matched"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; original invoices/logs; linked whole BOM; stock/event reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_water
      process_id: "p_frame"
      flow_role: "water and aqueous waste"
      record_type: "foreground_record"
      raw_fields: "specific water provider; mass or independently measured density and state; raw/used/retained/evaporated water; wastewater whole mass and composition; medium; relevant elements; test indicators separately"
      collection_method: "Measure each real water leg and full wet stock; independently sample contaminants and distinguish free/phase/structural/reaction water only when present. Never infer two unknown species from one closure residual or use COD as oil mass."
      unit: "kg; actual state units"
      frequency: "Each actual event or calibrated meter interval"
      temporal_coverage: "Complete manufacturing period and bounded observed H; include failures and zero output"
      site_scope: "Actual facility and identified supplier/contract stage; cohort matched"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; original invoices/logs; linked whole BOM; stock/event reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_air
      process_id: "p_frame"
      flow_role: "individual atmospheric molecule"
      record_type: "foreground_record"
      raw_fields: "N2/O2/Ar/H2O independently; real air intake/exhaust; phase/media; T/P/humidity; integrated volumes or true rates with actual duration; independent density; retained/condensed water; oil carryover OriginalQ0/all wet original-cohort fates; real Jin/Jout/H2Oin/H2Oout; OTHER same-side duplicate X; wholeQt/actual provider and nonoverlapA; physical fleet and service history."
      collection_method: "Use calibrated gas/condensate measurements and actual speciation/state. An integrated amount receives no additional time multiplication. Keep every observed species/outlet atomic, add identified missing species separately and preserve unknowns as uncertainty. The product and route are supported qualitatively, not as a measured plant LCI or transfer of catalog limits. Actual grade/coating/runner material/provider, dimensions, quantities and lot QA remain foreground requirements; missing such observations does not itself erase an established weighing, metering, mechanical inspection or allocation method. Keep actual calibration, recovery, detection/quantification limits and uncertainty appropriate to the measurand. For pneumatic air record independently measured humid intake/exhaust/state and each actual species, condensate and lubricant outlet. Do not assume constant atmospheric composition, infer oil/VOC species from COD, force reacting-species conservation or use one closure residual for several unknowns. A genuinely unestablished necessary species/matrix programme stays a specific hold for the affected claim; a future SOP, successful finite check or unperformed QA cannot waive it."
      unit: "kg; actual gas state units"
      frequency: "Each actual event or calibrated meter interval"
      temporal_coverage: "Complete manufacturing period and bounded observed H; include failures and zero output"
      site_scope: "Actual facility and identified supplier/contract stage; cohort matched"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; original invoices/logs; linked whole BOM; stock/event reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_waste
      process_id: "p_frame"
      flow_role: "individual actual waste outlet"
      record_type: "foreground_record"
      raw_fields: "actual whole waste identity; gross wet mass; classification/hazard status; original cohort; measured non-additive originW; stock; receiver/provider and treatment; failures/refused events OriginalQ0/all wet original-cohort fates; real Jin/Jout/H2Oin/H2Oout; OTHER same-side duplicate X; wholeQt/actual provider and nonoverlapA; physical fleet and service history."
      collection_method: "Weigh each actual outlet before treatment; reconcile retained waste, real mixed outlets and independent origin subledgers. Use one provider for the same outlet, no Product substitution, duplicate treatment or automatic credit. For each actual contaminated wipe, bag, carton, offcut, rejected frame, pneumatic condensate, wastewater or retired whole tool/equipment stream, record one complete receiver event Qt with substrate, retained steel/plastic/oil/dust/other residue and water once. Origin/assay components are nested nonadditive ledgers until actually separated before export. The real provider receives the full physical Qt in its compatible unit once. Separately identify the total actual modelling-service demand and nonoverlapping A_e,c for every serviced original cohort Q0_c (or actual new-manufacture Q_c), including failed work and original history. A share changes attributed service/burden, never the actual receiver mass. Unknown assignment remains unresolved; neither charge Qt again to each cohort nor shrink its physical exit."
      unit: "kg"
      frequency: "Each actual event or calibrated meter interval"
      temporal_coverage: "Complete manufacturing period and bounded observed H; include failures and zero output"
      site_scope: "Actual facility and identified supplier/contract stage; cohort matched"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; original invoices/logs; linked whole BOM; stock/event reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_fg
      process_id: "p_service"
      flow_role: "complete-frame custody"
      record_type: "foreground_record"
      raw_fields: "original cohort c and Q_c; H; full opening FG; actual new first-release receipt; every gross dispatch/redelivery/return; closing FG; actual repair status; wet mass; included loose parts; original/incremental vectors OriginalQ0/all wet original-cohort fates; real Jin/Jout/H2Oin/H2Oout; OTHER same-side duplicate X; wholeQt/actual provider and nonoverlapA; physical fleet and service history."
      collection_method: "Match serial/lot identity across manufacturing-to-FG handoff and customer returns, preserve complete physical mass and original burden genealogy; closing released FG does not reduce Q. Natural moisture change is water bookkeeping, not fictitious repair or new production. Independently verify Q0_c = D0_c + FG0_c + Held0_c + L0_c + T0_c, with disjoint remaining original-material deliveries, released on-site FG, every other actual accepted on-site state, irreversible original material/water losses, and other terminal dispositions. Subdivide those bins for every real location/status; gross delivery/return loops cancel only in this event bridge. Record each original-material fate once on its locked acceptance basis. Independently bridge each surviving present wet mass to original matter still present plus real retained later non-water material and water changes. Do not restore a lost original mass into a survivor and also retain it in L0_c. New material/sorbed water creates physical mass, not new Q. Q0_c=0 or unknown retains all raw loads and no normalized result."
      unit: "kg"
      frequency: "Each actual event or calibrated meter interval"
      temporal_coverage: "Complete manufacturing period and bounded observed H; include failures and zero output"
      site_scope: "Actual facility and identified supplier/contract stage; cohort matched"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; original invoices/logs; linked whole BOM; stock/event reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_service
      process_id: "p_service"
      flow_role: "observed postrelease service"
      record_type: "foreground_record"
      raw_fields: "original Q_c; observed H start/end; actual storage occupancy/duration; handling/packing meters; original cohort; real losses/rework; unused charge/asset vector; actual capacity/causal constraints"
      collection_method: "Retain all actual performed service in H including retained FG, failed events and zero dispatch; future unperformed service remains unknown. Link replacement materials and waste to their own atomic cards and original cohort, with no second Q."
      unit: "kWh; MJ; actual service units"
      frequency: "Each actual event or calibrated meter interval"
      temporal_coverage: "Complete manufacturing period and bounded observed H; include failures and zero output"
      site_scope: "Actual facility and identified supplier/contract stage; cohort matched"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; original invoices/logs; linked whole BOM; stock/event reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_pack
      process_id: "p_service"
      flow_role: "one packaging pool per material"
      record_type: "foreground_record"
      raw_fields: "article/material ID; full opening empty/attached WIP/attached FG/reusable; fresh purchases; externalreturnreceived; paired internal reuse; gross shipment attached; external return sent; actual waste; complete closing states; physical V and separate burden ownership OriginalQ0/all wet original-cohort fates; real Jin/Jout/H2Oin/H2Oout; OTHER same-side duplicate X; wholeQt/actual provider and nonoverlapA; physical fleet and service history."
      collection_method: "Calibrated per-article weighing and complete event/stock reconciliation separately for PE bag and carton. Record gross physical legs with no burden share; purchased article layers are contained once. Additional actual packaging receives its own atomic pool/cards. For each actual polyethylene-bag or corrugated-carton whole wet pool in kg, verify O + P + I + ERin + J_in + H2O_in - X_in = C + S + EOout + W + J_out + H2O_out - X_out. O/C include empty, WIP-attached, FG-attached, returned and reusable physical stocks; P is fresh purchase, I real supplier-included receipt, ERin external return received inward, S gross shipment outward, EOout external return sent outward, and W the actual whole wet waste exit. Paired internal reuse cancels on consolidation; it is neither ERin nor EOout nor procurement. Actual supplier-included packaging has one complete upstream owner and is never bought again. J_in/J_out are independently evidenced disjoint additional non-water transfers such as actual retained repair material, dust or oil only where not already included in another whole gross leg. H2O_in/H2O_out are actual sorption/addition/evaporation or other water transfers not already contained in a wet leg. Closing C retains all true additions even without repair. X_in/X_out subtract only proved overlap between OTHER same-side flow observations; never real J/H2O, C, opposite directions, unknown closure differences or card existence. Unknown terms are not fitted. Trace each true increment to its physical source/receiver and specific atomic interface; paired internal J/water is not a new provider or waste exit. Nested water/material in a gross wet leg is counted once."
      unit: "kg"
      frequency: "Each actual event or calibrated meter interval"
      temporal_coverage: "Complete manufacturing period and bounded observed H; include failures and zero output"
      site_scope: "Actual facility and identified supplier/contract stage; cohort matched"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; original invoices/logs; linked whole BOM; stock/event reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_assets
      process_id: "p_service"
      flow_role: "specific tool or asset"
      record_type: "foreground_record"
      raw_fields: "die/wheel serial and material; full receipt/return/spent mass; opening/closing physical inventory; inherited burden vectors; actual use capacity/time and loss; service allocation evidence; supplier scope OriginalQ0/all wet original-cohort fates; real Jin/Jout/H2Oin/H2Oout; OTHER same-side duplicate X; wholeQt/actual provider and nonoverlapA; physical fleet and service history."
      collection_method: "Record actual full physical assets separately from service burdens. Reuse is an internal event, procurement occurs once and actual wear/waste remains. No fabricated tool life or capacity; a real new asset material requires its own card. Every actual riveting press, pneumatic compressor, motion-test fixture, reusable die and consumable abrasive has its own actual configured fleet/stock genealogy, full received/returned/retired physical mass, installed-fluid and real wear/repair exchanges. Whole equipment provider and decomposed manufacture/maintenance are mutually exclusive. Keep actual service history and compatible provider quantity separate from physical V. A Mass/kg asset-product provider may be attributed using measured complete configuration M and a substantiated service fraction from the provider’s actual coverage/history; no guessed weight, life, capacity or assumed full lifetime from observed H. A service provider in h or another unit retains that unit through an explicit actual bridge, not a direct kg substitution. Missing actual denominator keeps A unresolved while real stocks, performed service and failures remain."
      unit: "kg; actual service units"
      frequency: "Each actual event or calibrated meter interval"
      temporal_coverage: "Complete manufacturing period and bounded observed H; include failures and zero output"
      site_scope: "Actual facility and identified supplier/contract stage; cohort matched"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; original invoices/logs; linked whole BOM; stock/event reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_component_return
      process_id: "p_service"
      flow_role: "returned unused formed rib"
      record_type: "foreground_record"
      raw_fields: "article and supplier IDs; actual BOM; grade/material; finish; processed state; gross receipts; returns; initial/final raw/WIP/non-WIP; inherited exchange vectors; joint and internal handoff IDs"
      collection_method: "Weigh and reconcile each specific whole supplied article with delivery/stock/route records; inspect all internal constituents as non-additive where contained; record actual fit/rework replacement issue and disposition by original cohort."
      unit: "kg"
      frequency: "Each actual event or calibrated meter interval"
      temporal_coverage: "Complete manufacturing period and bounded observed H; include failures and zero output"
