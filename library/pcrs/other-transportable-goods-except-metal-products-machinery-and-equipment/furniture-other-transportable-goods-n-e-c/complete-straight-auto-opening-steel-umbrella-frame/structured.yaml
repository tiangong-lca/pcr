  - rule_id: validation_rule_78
    applies_to: "foreground_dataset_conformance"
    rule: "For each actual contaminated wipe, bag, carton, offcut, rejected frame, pneumatic condensate, wastewater or retired whole tool/equipment stream, record one complete receiver event Qt with substrate, retained steel/plastic/oil/dust/other residue and water once. Origin/assay components are nested nonadditive ledgers until actually separated before export. The real provider receives the full physical Qt in its compatible unit once. Separately identify the total actual modelling-service demand and nonoverlapping A_e,c for every serviced original cohort Q0_c (or actual new-manufacture Q_c), including failed work and original history. A share changes attributed service/burden, never the actual receiver mass. Unknown assignment remains unresolved; neither charge Qt again to each cohort nor shrink its physical exit."
    source_ids: []
  - rule_id: validation_rule_79
    applies_to: "foreground_dataset_conformance"
    rule: "The product and route are supported qualitatively, not as a measured plant LCI or transfer of catalog limits. Actual grade/coating/runner material/provider, dimensions, quantities and lot QA remain foreground requirements; missing such observations does not itself erase an established weighing, metering, mechanical inspection or allocation method. Keep actual calibration, recovery, detection/quantification limits and uncertainty appropriate to the measurand. For pneumatic air record independently measured humid intake/exhaust/state and each actual species, condensate and lubricant outlet. Do not assume constant atmospheric composition, infer oil/VOC species from COD, force reacting-species conservation or use one closure residual for several unknowns. A genuinely unestablished necessary species/matrix programme stays a specific hold for the affected claim; a future SOP, successful finite check or unperformed QA cannot waive it."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Component supplier inventory for one disclosed complete steel umbrella frame configuration"
  allowed_use: "Actual compatible complete frame supply with full qualifier and source context; actual upstream component burdens once"
  excluded_use: "Whole-umbrella inventory; rib/handle equivalence; product performance or certification comparisons; unmeasured site data"
  required_metadata: "Whole BOM/configuration; real make-buy and processing states; net kg; site/period/provider; Q_c/H and source/stock/allocation context"
  required_quality_disclosure: "Measured versus required data; unresolved identity/provider; failures/zero output; observed service scope; native restrictions and uncertainty; review state"
  update_trigger: "Changed terminal/material/mechanism/finish or supplier process; changed native identity; new full evidence or actual foreground records"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version3.0 Explanatory Notes (30June2025), p196, and original structure CSV; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Original38921/38922 parent/part distinction; classification only, no manufacturing parameters"
  - id: "usitc-umbrella-parts-1970"
    type: "official_guidance"
    reference: "US Tariff Commission, Umbrellas and metal parts thereof, TC Publication334, August1970, ppA-1–A-4; https://usitc.gov/publications/tea/pub334.pdf"
    used_for: "Historical positive assembled-frame article and rib/stretcher/shaft/runner structure; full neighbouring umbrella and finish alternatives; no historical quantity transfer"
  - id: "sep-complete-steel-frame"
    type: "literature"
    reference: "Septrainbow, Custom Golden Umbrella Frames, complete manufacturer page and gallery; https://www.septrainbow.com/custom-golden-umbrella-frames-2524.html"
    used_for: "Complete steel/shaft/runner/tip/ferrule auto-open product supply; gold colour is not chemistry; no SKU dimension/recipe/performance default"
  - id: "acme-frame-structure"
    type: "literature"
    reference: "Acme Umbrella, Structure; https://www.acmeumbrella.com/service/Structure.html"
    used_for: "Independent channel-rib/notch/wire/runner and shaft assembly; handle/canopy separation; material alternatives do not define this actual supplier polymer"
  - id: "zhe-frame-riveting-2026"
    type: "literature"
    reference: "ZheBrella, Umbrella Frame Riveting Process for Strong OEM Builds,16June2026; https://www.zhebrella.com/blog/umbrella-frame-riveting-process-for-strong-oem-builds.html"
    used_for: "Steel joint/punch/finish/assembly sequence and pre-canopy check/rework/packing; retain fibreglass/hybrid counterexamples; no example pressure/cycle/strength/QC-limit defaults"
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA Detailed guidance, first edition March2010, §§7.9.2–7.9.3 pp255–268; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation-required subdivision/virtual subdivision, exchange-specific determining physical causality, justified residual actual common-gate/state market value and conservation; not industrial frame proof"
