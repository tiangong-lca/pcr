system_boundary:
  rules:
    - rule_id: b_complete
      applies_to: "all inventory rows"
      rule: "The whole-frame supply list is disjoint. For a bought combined shaft/ferrule, runner/spring or notch/wire article count the whole article once and keep constituents only as reconciled non-additive subledgers. If actually supplied independently count each separate purchased part once. Never add whole article wet mass and its already included water/oil/coating/parts again. Cancel internal subassembly/WIP handoffs when combining stages."
      source_ids:
        - sep-complete-steel-frame
        - acme-frame-structure
        - zhe-frame-riveting-2026
    - rule_id: b_actual
      applies_to: "all inventory rows"
      rule: "Include all real received goods, fitting/deburring, riveting, mechanism assembly, inspection/test samples, rejects, startup/shutdown, idle, cleanup and rework loads, even failed/unauthorized/refused events. Permission and qualification regulate acceptance only; they do not erase real flows. No default temperature/pressure/test cycles, substrate recipe, or yield is implied. An actually present unnamed input/outlet must gain its own specific atomic card before completeness can be claimed."
      source_ids:
        - zhe-frame-riveting-2026
        - ilcd-allocation-2010
    - rule_id: b_q
      applies_to: "reference product"
      rule: "First release is after all same-configuration required fitting, assembly, checks, rework and required supply packing, ready for supply at the plant. Q_c (also Q0_c) is the independently weighed sum of unique first accepted complete-frame net masses, excluding packaging tare and including actual matched loose parts. Original product composition, water state and acceptance IDs are locked before reconciliation. Initial required packing belongs to new manufacture; later storage, repacking, redelivery, repair and retest are only real service of the original cohort in H and never a second acceptance. Reopening or failed work does not erase previous loads."
      source_ids:
        - sep-complete-steel-frame
        - zhe-frame-riveting-2026
        - ilcd-allocation-2010
    - rule_id: b_vectors
      applies_to: "all inventory rows"
      rule: "Keep full wet raw/WIP/non-WIP/accepted/held/returned FG, packaging, installed fluids and all actual equipment/tool stocks independent of reference events and per-exchange burdens. Own opening WIP carries its complete real prior foreground history once; transfer only substantiated unassigned closing vectors. A linked whole provider dataset and its embedded steel/polymer/coating/utility/transport/machine history are alternatives to the same decomposed history, never additive. Bought formed/tempered/finished components require complete actual producer coverage and delivery state. Do not invent purchases to hide known on-site forming, coating, heat treatment, compressor operation or other real production; a changed route needs explicit scope review and complete atomic exchanges."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_physical
      applies_to: "all inventory rows"
      rule: "Independently close manufacturing, FG/service and combined full wet physical gates: opening stocks plus actual external inflows equal closing stocks plus actual external outflows. Pair/cancel internal transfers, including the first-release handoff. Physical assets/components/packaging/fluid/Waste/actual carrier returns always use full gross V/native unit, not allocation A, stock consumption or economic/service shares. X may only deduplicate the same-side OTHER actual flow already represented; it cannot offset stock, opposite legs, unknown values or the existence of a card."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_species
      applies_to: "all inventory rows"
      rule: "Close relevant elements and actual molecular species independently of total wet mass. Distinguish free/phase/structural/reaction water only when evidenced; no reaction is inferred from mechanical assembly. Preserve N2/O2/Ar/H2O humidity and actual medium/phase/T/P. COD/VOC/NOx/PM are indicators, not a specific chemical mass. One residual cannot determine two unknowns. A real mixed Waste has one full measured exit/provider and independent non-additive originW subledgers; do not force separated exits."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_utilities
      applies_to: "all inventory rows"
      rule: "This component-assembly route assumes no onsite plating bath, polymer synthesis, boiler, steam loop or fuel combustion. If actually present do not suppress it: reassess scope and add each specific material/preparation/fuel/species/return exchange with real sources and amounts. Real purchased heat/carrier and returned Product water require mass/phase/T/P/enthalpy and supplier water-energy convention: one supply owner, no double purchase of kg carrier and its included MJ heat. Do not copy a fictitious steam system."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_pack
      applies_to: "p_service"
      rule: "For each actual polyethylene-bag or corrugated-carton whole wet pool in kg, verify O + P + I + ERin + J_in + H2O_in - X_in = C + S + EOout + W + J_out + H2O_out - X_out. O/C include empty, WIP-attached, FG-attached, returned and reusable physical stocks; P is fresh purchase, I real supplier-included receipt, ERin external return received inward, S gross shipment outward, EOout external return sent outward, and W the actual whole wet waste exit. Paired internal reuse cancels on consolidation; it is neither ERin nor EOout nor procurement. Actual supplier-included packaging has one complete upstream owner and is never bought again. J_in/J_out are independently evidenced disjoint additional non-water transfers such as actual retained repair material, dust or oil only where not already included in another whole gross leg. H2O_in/H2O_out are actual sorption/addition/evaporation or other water transfers not already contained in a wet leg. Closing C retains all true additions even without repair. X_in/X_out subtract only proved overlap between OTHER same-side flow observations; never real J/H2O, C, opposite directions, unknown closure differences or card existence. Unknown terms are not fitted. Trace each true increment to its physical source/receiver and specific atomic interface; paired internal J/water is not a new provider or waste exit. Nested water/material in a gross wet leg is counted once."
      source_ids:
        - zhe-frame-riveting-2026
        - ilcd-allocation-2010
    - rule_id: b_native
      applies_to: "all inventory rows"
      rule: "Preserve all positive identity restrictions: one complete straight auto-opening steel frame (no canopy/handle) under the broad manufactured finished-part Product family and Mass/kg; China user-side grid-average AC below1kV with exact Net calorific value → energy unit group → MJ; treated tap water Product Mass/kg with no secondary-density assumption; iron/non-alloy cylindrical steel wire only (not alloy wire or formed spring); finished polyethylene bag CAS9002-88-4 only (not PP/PVC/resin/film; broad taxonomy separately disclosed); used lubricating oil Waste at generation with treatment unspecified. Native generic identity never proves provider, exact grade/finish/polymer formulation, quantity, geography where undeclared or complete supplier process coverage. Do not silently broaden or replace these physical restrictions."
      source_ids:
        - ilcd-allocation-2010
        - sep-complete-steel-frame
        - acme-frame-structure
        - zhe-frame-riveting-2026
    - rule_id: b_air_native
      applies_to: "all inventory rows"
      rule: "Gas adoption is limited to actual neutral molecular/elemental species and exact medium: N2 CAS7727-37-9, O2 CAS7782-44-7 and Ar CAS7440-37-1 use separate air-resource inputs and non-long-term unspecified air-emission outputs; H2O CAS7732-18-5 is only ordinary gaseous water air output, while atmospheric water-vapour intake identity remains unresolved. All use Mass/kg and real state, never total nitrogen, ions, liquid Product, radioactive/heavy water, ice or water discharge. N2/O2/water aliases contain other-state terms and argon aliases contain an inconsistent41Ar entry, disclosed per card without inferring activity or broadening adoption."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_complete_1
      applies_to: "all actual applicable exchanges"
      rule: "The selected terminal is one complete part: a configured straight automatic-opening steel umbrella frame including the actual shaft, ribs/stretchers, runner/notch, spring/catch and joint hardware, matched ferrule and supplied loose matching tips. A functioning bare frame is separately traded; the historical USITC description excludes tips/ferrule from its own frame assembly while the contemporary Septrainbow offer explicitly includes them. Retain the actual declared complete supply list instead of imposing either source’s inclusion list on every order. The two descriptions are compatible evidence of different complete supply states, not proof of identical SKU, plant or period. No canopy, handle or later whole-umbrella operation is silently included."
      source_ids:
        - ilcd-allocation-2010
        - zhe-frame-riveting-2026
