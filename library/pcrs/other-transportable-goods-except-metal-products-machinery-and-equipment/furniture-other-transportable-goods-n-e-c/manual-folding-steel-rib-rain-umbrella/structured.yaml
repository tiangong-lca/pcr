  calculation_rules:
    - id: native_units
      applies_to: "raw_fields"
      rule: "Convert each raw numerator to its declared native unit before allocation: kWh × 3.6 = MJ; count × independently measured same-lot unit mass = kg; fabric area × independently measured same-lot areal mass = kg; liquid volume × independently measured density at recorded state = kg; integrate an actual rate once. Preserve originals and uncertainty; no preset material factors."
      inputs:
        - raw_fields
        - measured_conversion_evidence
      output: "native_numerator"
      source_ids: []
    - id: burden_continuity
      applies_to: "burden vectors only"
      rule: "Keep complete physical raw/WIP/non-WIP/FG/return, packaging, installed-fluid and every actual equipment-fleet ledger separate from reference events and per-exchange burden vectors. Own opening WIP carries actual earlier foreground burdens once; only substantiated still-unused/unassigned closing WIP carries them forward. For attribution, A may add unassigned inherited opening burden to period raw burden and remove only demonstrated still-unassigned closing burden and a disjoint justified other-system/cohort handover. Already-net consumption is not stock-corrected a second time; accepted closing FG and services already performed for it are not deleted. A complete provider aggregate and its embedded material/transport/asset/history decomposition are mutually exclusive. Preserve failed attempts, idle/start-stop, inspection, samples, cleanout and repair loads. Actual complete upstreams match the whole supplied article/preparation and true availability point; no receipt or purchased-service label hides known on-site manufacture. Actual provider inclusion schedules cover current electricity, repair, transport and operating supplies as well as capital: an aggregate already including a metered foreground operation and that separate operation cannot both be charged. For an independently unassigned burden vector only, A_i=O_unassigned_i+B_period_i-C_still_unassigned_i-H_disjoint_other_i; actual original cohorts and provider coverage determine each term, never physical residual fitting."
      inputs:
        - native_numerator
        - stock_vectors
        - allocation_evidence
      output: "A_i"
      source_ids:
        - ilcd-detailed-2010
    - id: single_normalization
      applies_to: "all inventory rows"
      rule: "result_i = N_i / D_c, once only. N_i is complete native gross V_i for every physical flow, or A_i for an allocated utility/service burden; D_c is Q of new first-release manufacture or original Qc of the observed service cohort. Q and Qc are measured kg at original release; keep cohort results separate before an explicit mass-weighted combination. For D_c=0 retain raw N_i and vectors without a unit result. first_whole_release is exactly 1 kg by definition."
      inputs:
        - native_numerator
        - A_i
        - gross_V_i
        - Q
        - original_Qc
      output: "result_i"
      source_ids: []
  data_quality_requirements:
    - id: quality_configuration
      applies_to: "whole product and suppliers"
      requirement: "Traceable disjoint BOM, native identity/restriction audit, supplier complete-article state, actual steel ribs/metal shaft/polyester/plastic and sleeve evidence; auxiliary UUID gaps disclosed individually."
      evidence: "Supplier specifications; whole-product photographs; weighing; release records"
    - id: quality_complete_window
      applies_to: "every real activity and stock"
      requirement: "Include failed and zero-output runs, start-stop/idle/cleanup, actual wet tests/drying/repairs, full raw/WIP/non-WIP vectors and observed services through H; future services unknown."
      evidence: "Raw meters; stock ledgers; failures; cohort timestamps"
    - id: quality_physical
      applies_to: "mass, water, elements and species"
      requirement: "Independent physical balances and sampling, conditioned whole mass, each true waste stream and non-additive originW; no residual fitting multiple unknowns or assumed molecular conversion."
      evidence: "Calibrations; scales; density/assay/state data; recipient tickets"
    - id: quality_sources
      applies_to: "source use and uncertainty"
      requirement: "Complete original context and product/route/state applicability; industrial sources support manufacture and never LCA allocation by themselves. No transferred recipe or factory factor; missing actual foreground quantities are collection requirements, not measured values."
      evidence: "Source-specific context and use assessment; field-level lineage"
    - id: quality_method
      applies_to: "actual required species/phase/matrix"
      requirement: "This profile receives already finished canopy fabric and a complete frame. Matching sleeve colour or appearance does not prove the same fibre, finish or areal mass as the canopy. One polyester input card covers only real cuts from the same independently verified supplied textile; a genuinely different sleeve, reinforcement or strap material needs its own specific atomic article/provider and actual cutting record before completeness, never a guessed composition or duplicate whole-fabric purchase. Real prior fibre formation, weaving/dyeing/coating/printing and frame metallurgy/forming/finishing remain inside their complete compatible actual upstream providers once. An actual known on-site operation is not moved upstream by renaming a receipt. HF factory-tour fiberglass golf ribs, epoxy versus screws, eight-gores, test-cycle and spray examples are retained contrary context, not requirements for this steel-rib manual folding profile. Actual supplied finish chemistry, printed/dyed or RPET variants and all real order-specific operations must be disclosed; no finish, adhesive, fluorinated substance, cleaner molecule or emission is inferred. The actual whole assembled product is independently weighed in its declared conditioning state; a wet-dry article difference is not automatically water if finish, soil or other matter also changes. Establish liquid/retained/vapor water independently with actual compatible sampling and all real transfers; do not label a drain, droplet/mist or collected liquid as vapor. Where actual identified IR-active vapor measurement is required, the retained complete EPA320 method and its actual FTIR Protocol supply heated extractive transport/reference-spectrum/interference/background/state/analyte-spike-recovery and uncertainty procedures within their real scope. This is not a particulate/mist/totalVOC method or FTIR measurement of homonuclear N2/O2/monatomic Ar; no source-specific actual release, calibrated reference, matrix recovery or field eligibility is claimed. Its complete dated50-page PDF includes the FTIR Protocol/addendum/appendices, not an unavailable reference. PDF16 Eq3/4 use a tracer mixture fraction while the same-page DF>=10 legend conflicts: preserve original bytes and distinguish conserved corrected common-mole-basis phi=(tracer_spiked-tracer_native)/(tracer_direct-tracer_native), nonzero denominator, representative matched no-unaccounted-loss mixing, expected analyte=phi*analyte_direct+(1-phi)*analyte_native, from its reciprocal dilution ratio. This identity supplies no numerical concentration, setting or acceptance tolerance. Full Methods1–3 retain actual source geometry/traverse/non-cyclonic/size/location and calibrated velocity/state/density/flow restrictions; Method3 restricted matrix/interferences, N2/CO remainder and argon omission are not universal air composition, pure N2 or measured Ar. A duct result is not automatically uncontained fugitive-source coverage. Real collected condensate/mist/effluent is one whole wet receiver event, separate from actual final released species/medium. An actual necessary unestablished specific sampling/preservation/matrix/phase programme remains hold, not solved by a future SOP or finitecheck. Routine actual calibration/sampling/recovery in an already established eligible programme remains study qualification, not proof no method exists. No combustion, boiler, reacting water or thermal-drying recipe is presumed; any actual on-site generation requires its full real producer, fuels/air/O2/water/species/control/energy/waste interfaces and applicable methods before completeness. These dated EPA Internet copies do not assert regulatory conformity or actual study success."
      evidence: "Actual complete eligible procedure versus ordinary unperformed site/lot QA; preserve specific necessary unestablished method hold"
validation_rules:
  - rule_id: validation_complete_article
    applies_to: "reference product and source context"
    rule: "Check whole non-electric manual folding construction, steel ribs, metal shaft, polyester canopy, plastic handle, every supplied/onsite part and functional sleeve. Verify complete native identity fields and source applicability; a name/classification match or registration success alone is insufficient."
    source_ids:
      - peerless-style-0001
      - hf-manufacturing-2025
      - citta-factory
  - rule_id: validation_q
    applies_to: "release and measured denominator"
    rule: "Recompute Q from unique first releases in declared conditioning state and reconcile full functional BOM excluding shipping packaging. Reinspection/repair/delivery never adds new Q. A zero-output batch has retained loads and no unit result."
    source_ids: []
  - rule_id: validation_normalization
    applies_to: "raw records and results"
    rule: "Verify raw values remain unnormalized; unit/rate conversion and genuine burden allocation precede the only section 8 normalization. Inventory cards and aggregation labels reference that result without another division. Inspect every table cell, card field, description, qualifier, formula input/output and source id."
    source_ids: []
  - rule_id: validation_closure
    applies_to: "manufacture, FG and combined gates"
    rule: "Independently close each material, relevant element, water/species and complete wet mass with raw/WIP/non-WIP stock vectors; reconcile manufacture plus FG with internal transfers cancelled. Do not force residuals or infer species/chemistry from one balance."
    source_ids: []
  - rule_id: validation_pools
    applies_to: "packing and service cohorts"
    rule: "Check all actual P/I/ER/S/EO/W movements and opening/closing empty, attached and reusable stock for each packaging article. Use gross physical shipments and original Qc for services; verify failed/rejected/unauthorized activities remain recorded."
    source_ids: []
  - rule_id: validation_native
    applies_to: "UUID/provider and sources"
    rule: "Verify exact reference property to unit-group reference unit and all other properties; preserve supplier-state, CAS, polymer/grade/route, geography, media and dataset type. Missing auxiliary identities remain explicit and cannot be replaced by incompatible UUIDs. Engineering consistency does not establish scientific approval, translation review or publication."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "Normative scope is this complete manufacturing profile. Read the whole section and its conditions before applying an individual rule. A scientific conclusion or translation approval is not implied by an engineering check."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "This manufacturing profile covers one complete non-electric handheld manual folding rain umbrella: a supplied folding frame with steel ribs and a metal shaft, a purchased finished polyester canopy fabric, a supplied plastic handle, and its declared functional fittings and matching reusable fabric sleeve. The whole finished Product family is narrowed by these physical qualifiers; it is never an exchange combining umbrellas with walking-sticks, seat-sticks, whips or riding-crops. Steel-rib construction is required for this profile; aluminium- or glass-fibre-rib variants require a reviewed extension. Loose ribs, umbrella cloth and pre-cut panels alone cannot be the finished reference product."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Peerless Style 0001 establishes a real manual folding product with steel ribs, a metal shaft, polyester canopy, plastic handle and matching sleeve. HF supplies complete manufacturing context; CITTA independently corroborates textile cutting, sewing, assembly and finished-goods checking. These sources are a transparent technical synthesis, not records of one SKU or factory order. This profile chooses receipt of a completed frame and finished roll fabric, then canopy and sleeve cutting/sewing, fitting, mechanical assembly, actual testing/cleaning and first whole-product quality release. Onsite fibre formation, metallurgy, frame fabrication, coating, printing and adhesive curing are not inferred from an assembly account. Sources: peerless-style-0001; hf-manufacturing-2025; citta-factory."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Record actual configuration and order requirements. No default umbrella weight, rib count, canopy area, fabric areal mass, dimension, density, finish chemistry, yield, drying temperature/time, weather rating, lifetime, age suitability, certification or emission factor is supplied. Marketing descriptions and AQL examples establish neither service-life equivalence nor a universal acceptance threshold. An undisclosed water-repellent treatment is not evidence for a fluorinated, PU or silicone formulation."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "One physical whole manufactured manual folding steel-rib umbrella with metal shaft, polyester canopy, plastic handle and declared functional sleeve; production mix at plant, finished-product/manufactured route. The official broad family basename is preserved, but only this article is exchanged; it never aggregates canes/whips or loose parts. No fixed native composition, CAS, rib count, performance or item mass is supplied. Actual provider and supply boundary must match this narrowed configuration."
    source_ids: []
  - rule_id: validation_rule_12
    applies_to: "foreground_dataset_conformance"
    rule: "All required qualifiers belong in dataset metadata or equivalent full reference context. Product net mass includes actual component/retained water and the functional sleeve once; shipping cartons/bags/tape/crates are separately inventoried packaging."
    source_ids: []
