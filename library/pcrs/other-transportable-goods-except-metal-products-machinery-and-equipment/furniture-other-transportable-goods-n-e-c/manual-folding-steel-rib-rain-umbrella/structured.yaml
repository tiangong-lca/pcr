  - rule_id: validation_rule_30
    applies_to: "foreground_dataset_conformance"
    rule: "Every actual sewing machine, cutting tool, tool, extraction/handling unit and reusable cloth keeps a complete actual configured fleet: new/used receipts, external returns received/sent, real retirement/whole waste, installed/opening/closing holdings and disjoint repair/fluid changes. HF and CITTA manufacturing context shows actual sewing/cutting operations, not the same Peerless plant, installed machine or shared SKU. A whole line/provider already including a machine and a separate purchase of that machine cannot both be added. Measure actual complete configuration mass M if count/mass conversion is needed; Item(s) is not kg and no machine mass or lifetime is supplied. Actual service h must match a complete real provider history and observed original-cohort use, unused/unassigned capacity and inherited burdens; physical fleet kg is not scaled by a service share. Separately supplied oil/filter/belt and whole contaminated removed items need their own atomic interfaces when actually present; contained parts remain nested in a whole asset. Receipt/return/shipment/retirement cards disclose physical V only; they are not a second capital purchase when the actual compatible service history already owns the same upstream manufacture. Actual provider-service scope and separately metered operation/repair must be nonoverlapping. A cotton cloth has the same full gross receipt/return/whole-waste and opening/closing fleet record; actual laundering or replacement must carry all disjoint real provider and utility burdens. No cloth lifetime or laundering load is assumed."
    source_ids: []
  - rule_id: validation_rule_31
    applies_to: "foreground_dataset_conformance"
    rule: "This profile receives already finished canopy fabric and a complete frame. Matching sleeve colour or appearance does not prove the same fibre, finish or areal mass as the canopy. One polyester input card covers only real cuts from the same independently verified supplied textile; a genuinely different sleeve, reinforcement or strap material needs its own specific atomic article/provider and actual cutting record before completeness, never a guessed composition or duplicate whole-fabric purchase. Real prior fibre formation, weaving/dyeing/coating/printing and frame metallurgy/forming/finishing remain inside their complete compatible actual upstream providers once. An actual known on-site operation is not moved upstream by renaming a receipt. HF factory-tour fiberglass golf ribs, epoxy versus screws, eight-gores, test-cycle and spray examples are retained contrary context, not requirements for this steel-rib manual folding profile. Actual supplied finish chemistry, printed/dyed or RPET variants and all real order-specific operations must be disclosed; no finish, adhesive, fluorinated substance, cleaner molecule or emission is inferred. The actual whole assembled product is independently weighed in its declared conditioning state; a wet-dry article difference is not automatically water if finish, soil or other matter also changes. Establish liquid/retained/vapor water independently with actual compatible sampling and all real transfers; do not label a drain, droplet/mist or collected liquid as vapor. Where actual identified IR-active vapor measurement is required, the retained complete EPA320 method and its actual FTIR Protocol supply heated extractive transport/reference-spectrum/interference/background/state/analyte-spike-recovery and uncertainty procedures within their real scope. This is not a particulate/mist/totalVOC method or FTIR measurement of homonuclear N2/O2/monatomic Ar; no source-specific actual release, calibrated reference, matrix recovery or field eligibility is claimed. Its complete dated50-page PDF includes the FTIR Protocol/addendum/appendices, not an unavailable reference. PDF16 Eq3/4 use a tracer mixture fraction while the same-page DF>=10 legend conflicts: preserve original bytes and distinguish conserved corrected common-mole-basis phi=(tracer_spiked-tracer_native)/(tracer_direct-tracer_native), nonzero denominator, representative matched no-unaccounted-loss mixing, expected analyte=phi*analyte_direct+(1-phi)*analyte_native, from its reciprocal dilution ratio. This identity supplies no numerical concentration, setting or acceptance tolerance. Full Methods1–3 retain actual source geometry/traverse/non-cyclonic/size/location and calibrated velocity/state/density/flow restrictions; Method3 restricted matrix/interferences, N2/CO remainder and argon omission are not universal air composition, pure N2 or measured Ar. A duct result is not automatically uncontained fugitive-source coverage. Real collected condensate/mist/effluent is one whole wet receiver event, separate from actual final released species/medium. An actual necessary unestablished specific sampling/preservation/matrix/phase programme remains hold, not solved by a future SOP or finitecheck. Routine actual calibration/sampling/recovery in an already established eligible programme remains study qualification, not proof no method exists. No combustion, boiler, reacting water or thermal-drying recipe is presumed; any actual on-site generation requires its full real producer, fuels/air/O2/water/species/control/energy/waste interfaces and applicable methods before completeness. These dated EPA Internet copies do not assert regulatory conformity or actual study success."
    source_ids: []
