measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the sum of measured net masses at each unique first whole-product quality release, including the declared functional sleeve and retained constituent water once. Use calibrated scales and the same BOM/conditioning scope under cp_release. Already released closing FG is already in Q; do not subtract it as manufacturing closing output."
  - id: count_mass
    applies_to: "count-based incoming records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For one same-configuration complete article define measured net mass M using calibrated whole-article weighing under cp_release; for counted component lots use independently measured lot-specific unit mass, sample size and uncertainty. Convert count to mass before the single normalization. Never infer umbrella mass from carton shipping weight or a secondary property."
  - id: fabric_geometry
    applies_to: "canopy and sleeve fabric"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh complete finished roll fabric as supplied. Area/length records require actual width and same-lot measured areal mass. Nonrectangular canopy area is measured from the real panel geometry, not a bounding rectangle. Coating, contained water and polyester remain non-additive composition subledgers of one purchased fabric."
  - id: utility_units
    applies_to: "electricity and water"
    required_property_ref:
      name: "native property"
      uuid: ""
    required_unit: "MJ; kg"
    rule: "Keep raw meter units and convert kWh × 3.6 to MJ once. Water mass is independently weighed; volume requires measured substance/state-specific density. Integrated gas/liquid volumes are not multiplied by time again; actual rates are integrated over the measured interval. Do not use water density for another substance or the native water secondary volume coefficient as a measured density."
  - id: physical_versus_burden
    applies_to: "all gates"
    required_property_ref:
      name: "native property"
      uuid: ""
    required_unit: "kg; MJ"
    rule: "Every physical receipt/dispatch/return/waste retains full gross V in its native unit and the correct Q or original Qc denominator. Allocation applies only to associated burden vectors and never scales the physical transfer. Incoming article mass and embedded component/water mass cannot both be added to the same side."
