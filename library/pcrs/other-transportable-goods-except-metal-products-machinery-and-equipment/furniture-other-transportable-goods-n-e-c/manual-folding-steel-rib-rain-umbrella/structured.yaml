      collection_method: "Calibrated whole-article weighing with declared functional sleeve; net packaging tare; reconcile unique releases and actual test/conditioning records; collect raw total mass and count without division. For the newly accepted cohort Q=Q0. Q0 is independently fixed from unique first quality-release events for complete same-configuration umbrellas after every required factory operation and test, ready for the declared factory supply gate. It includes the declared functional matching reusable sleeve and all actual retained articles and water at release and excludes outer packaging tare. Reconcile each original Q0 on its original-material/configuration basis across disjoint net remaining external deliveries, every actual on-site accepted FG/held/returned/rework state, irreversible losses and other terminal dispositions. Gross return first leaves its old delivery position. Dispatch, return, repacking, retest or reacceptance never creates new Q. Current surviving wet mass and original water/material losses cannot both be restored and counted again. Opening old cohorts and later observed-H services use original Qc/Q0, not current output; delivery plus closing FG is sufficient only when all other postgate states/exits are absent. Q=0 or unknown retains actual raw loads without a per-unit result."
