ditive nested analyses, not extra exported wastes unless physically separated before the boundary. Match its actual receiver/treatment/provider and extensive unit. Physical Qt and Qt/Q disclosure are not automatically the service demand: use only evidenced compatible nonoverlapping service A with the original cohort Qc/Q0, keeping physical transfer full. Unknown attribution remains unknown. Arithmetic illustration only: a shared10kg consignment is never shrunk to2.5kg by25% attribution and never charged as10kg again to every cohort. Different dry/wet or provider units require the actual full-composition/state bridge, not a hidden conversion or pure-component proxy. | ilcd-detailed-2010 | | actual_fleets | actual declared configuration | Every actual sewing machine, cutting tool, tool, extraction/handling unit and reusable cloth keeps a complete actual configured fleet: new/used receipts, external returns received/sent, real retirement/whole waste, installed/opening/closing holdings and disjoint repair/fluid changes. HF and CITTA manufacturing context shows actual sewing/cutting operations, not the same Peerless plant, installed machine or shared SKU. A whole line/provider already including a machine and a separate purchase of that machine cannot both be added. Measure actual complete configuration mass M if count/mass conversion is needed; Item(s) is not kg and no machine mass or lifetime is supplied. Actual service h must match a complete real provider history and observed original-cohort use, unused/unassigned capacity and inherited burdens; physical fleet kg is not scaled by a service share. Separately supplied oil/filter/belt and whole contaminated removed items need their own atomic interfaces when actually present; contained parts remain nested in a whole asset. Receipt/return/shipment/retirement cards disclose physical V only; they are not a second capital purchase when the actual compatible service history already owns the same upstream manufacture. Actual provider-service scope and separately metered operation/repair must be nonoverlapping. A cotton cloth has the same full gross receipt/return/whole-waste and opening/closing fleet record; actual laundering or replacement must carry all disjoint real provider and utility burdens. No cloth lifetime or laundering load is assumed. | ilcd-detailed-2010 | | actual_method | actual declared configuration | This profile receives already finished canopy fabric and a complete frame. Matching sleeve colour or appearance does not prove the same fibre, finish or areal mass as the canopy. One polyester input card covers only real cuts from the same independently verified supplied textile; a genuinely different sleeve, reinforcement or strap material needs its own specific atomic article/provider and actual cutting record before completeness, never a guessed composition or duplicate whole-fabric purchase. Real prior fibre formation, weaving/dyeing/coating/printing and frame metallurgy/forming/finishing remain inside their complete compatible actual upstream providers once. An actual known on-site operation is not moved upstream by renaming a receipt. HF factory-tour fiberglass golf ribs, epoxy versus screws, eight-gores, test-cycle and spray examples are retained contrary context, not requirements for this steel-rib manual folding profile. Actual supplied finish chemistry, printed/dyed or RPET variants and all real order-specific operations must be disclosed; no finish, adhesive, fluorinated substance, cleaner molecule or emission is inferred. The actual whole assembled product is independently weighed in its declared conditioning state; a wet-dry article difference is not automatically water if finish, soil or other matter also changes. Establish liquid/retained/vapor water independently with actual compatible sampling and all real transfers; do not label a drain, droplet/mist or collected liquid as vapor. Where actual identified IR-active vapor measurement is required, the retained