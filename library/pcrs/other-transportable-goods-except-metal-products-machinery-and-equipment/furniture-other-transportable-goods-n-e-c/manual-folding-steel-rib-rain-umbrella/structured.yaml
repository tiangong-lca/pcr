e completeness. These dated EPA Internet copies do not assert regulatory conformity or actual study success. | epa-method320; epa-method1; epa-method2; epa-method3 |"
    source_ids: []
  - rule_id: validation_rule_14
    applies_to: "foreground_dataset_conformance"
    rule: "Cards describe one actual exchange. A conditional row is absent only with recorded physical evidence; actual unlisted inputs, component returns, treatment outputs or species require additional atomic cards before a complete dataset. Card quantity text and protocol aggregation labels identify the result of the single section 8 normalization; they perform no new arithmetic."
    source_ids: []
  - rule_id: validation_rule_15
    applies_to: "foreground_dataset_conformance"
    rule: "Manufacturer process pages do not support the allocation hierarchy. The ILCD text is used qualitatively within its attributional scope; the multifunctional-printer QFD figure and recycling equations are adjacent countercontexts, not adopted umbrella factors."
    source_ids: []
  - rule_id: validation_rule_16
    applies_to: "foreground_dataset_conformance"
    rule: "Collection protocols take only raw totals/readings, identities, stock quantities and independent inherited vectors. Their aggregation_rule cell declares the final reference basis for the single calculation below; no protocol divides a raw value. For original Qc services, keep separate cohorts and their historical burdens, record only actual increments in H and leave future services unknown."
    source_ids: []
  - rule_id: validation_rule_17
    applies_to: "foreground_dataset_conformance"
    rule: "Q is the sum of measured net masses at each unique first whole-product quality release, including the declared functional sleeve and retained constituent water once. Use calibrated scales and the same BOM/conditioning scope under cp_release. Already released closing FG is already in Q; do not subtract it as manufacturing closing output."
    source_ids: []
  - rule_id: validation_rule_18
    applies_to: "foreground_dataset_conformance"
    rule: "For one same-configuration complete article define measured net mass M using calibrated whole-article weighing under cp_release; for counted component lots use independently measured lot-specific unit mass, sample size and uncertainty. Convert count to mass before the single normalization. Never infer umbrella mass from carton shipping weight or a secondary property."
    source_ids: []
  - rule_id: validation_rule_19
    applies_to: "foreground_dataset_conformance"
    rule: "Weigh complete finished roll fabric as supplied. Area/length records require actual width and same-lot measured areal mass. Nonrectangular canopy area is measured from the real panel geometry, not a bounding rectangle. Coating, contained water and polyester remain non-additive composition subledgers of one purchased fabric."
    source_ids: []
  - rule_id: validation_rule_20
    applies_to: "foreground_dataset_conformance"
    rule: "Keep raw meter units and convert kWh × 3.6 to MJ once. Water mass is independently weighed; volume requires measured substance/state-specific density. Integrated gas/liquid volumes are not multiplied by time again; actual rates are integrated over the measured interval. Do not use water density for another substance or the native water secondary volume coefficient as a measured density."
    source_ids: []
  - rule_id: validation_rule_21
    applies_to: "foreground_dataset_conformance"
    rule: "Every physical receipt/dispatch/return/waste retains full gross V in its native unit and the correct Q or original Qc denominator. Allocation applies only to associated burden vectors and never scales the physical transfer. Incoming article mass and embedded component/water mass cannot both be added to the same side."
    source_ids: []
  - rule_id: validation_rule_22
    applies_to: "foreground_dataset_conformance"
    rule: "Convert each raw numerator to its declared native unit before allocation: kWh × 3.6 = MJ; count × independently measured same-lot unit mass = kg; fabric area × independently measured same-lot areal mass = kg; liquid volume × independently measured density at recorded state = kg; integrate an actual rate once. Preserve originals and uncertainty; no preset material factors."
    source_ids: []
  - rule_id: validation_rule_23
    applies_to: "foreground_dataset_conformance"
    rule: "Keep complete physical raw/WIP/non-WIP/FG/return, packaging, installed-fluid and every actual equipment-fleet ledger separate from reference events and per-exchange burden vectors. Own opening WIP carries actual earlier foreground burdens once; only substantiated still-unused/unassigned closing WIP carries them forward. For attribution, A may add unassigned inherited opening burden to period raw burden and remove only demonstrated still-unassigned closing burden and a disjoint justified other-system/cohort handover. Already-net consumption is not stock-corrected a second time; accepted closing FG and services already performed for it are not deleted. A complete provider aggregate and its embedded material/transport/asset/history decomposition are mutually exclusive. Preserve failed attempts, idle/start-stop, inspection, samples, cleanout and repair loads. Actual complete upstreams match the whole supplied article/preparation and true availability point; no receipt or purchased-service label hides known on-site manufacture. Actual provider inclusion schedules cover current electricity, repair, transport and operating supplies as well as capital: an aggregate already including a metered foreground operation and that separate operation cannot both be charged. For an independently unassigned burden vector only, A_i=O_unassigned_i+B_period_i-C_still_unassigned_i-H_disjoint_other_i; actual original cohorts and provider coverage determine each term, never physical residual fitting."
    source_ids: []
  - rule_id: validation_rule_24
    applies_to: "foreground_dataset_conformance"
    rule: "result_i = N_i / D_c, once only. N_i is complete native gross V_i for every physical flow, or A_i for an allocated utility/service burden; D_c is Q of new first-release manufacture or original Qc of the observed service cohort. Q and Qc are measured kg at original release; keep cohort results separate before an explicit mass-weighted combination. For D_c=0 retain raw N_i and vectors without a unit result. first_whole_release is exactly 1 kg by definition."
    source_ids: []
