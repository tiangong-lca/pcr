system_boundary:
  rules:
    - rule_id: boundary_core
      applies_to: "manufacture"
      rule: "Cover receipt and inspection of supplied materials, cutting/sewing, mechanical frame/canopy joining, fitting, actual inspection, cleaning, failures, rework and unique first complete release. A whole output contains the complete actually declared functional BOM: shaft/ribs/canopy/handle and matching sleeve, plus every real stretcher/runner/lock/button/spring/wrist loop/cap/tip/washer/strap when present in that configuration; this list does not invent a part, mechanism or quantity. A component already included in a supplied frame is not bought again."
      source_ids:
        - hf-manufacturing-2025
        - peerless-style-0001
        - citta-factory
    - rule_id: boundary_supply
      applies_to: "supplier versus onsite route"
      rule: "Choose disjoint supplied articles and separate components, or document a reconciled bridge cancelling internal handovers. Purchased finished fabric includes its actual coating/finish once; no parallel polymer/waterproof-agent purchase is added. Onsite frame/shaft fabrication, coating, printing or formulation requires actual primary route support and additional named materials, formulations, energy, losses and emissions before an expanded-profile result."
      source_ids:
        - hf-manufacturing-2025
    - rule_id: boundary_q
      applies_to: "release gate and failures"
      rule: "Q counts only newly first-released complete articles at original measured state. Exclude unaccepted WIP/rejects from Q but retain every failed/zero-output batch, start/stop, idle, cleanup, actual test and unauthorized/failed rework burden and physical movement. Drying, natural moisture exchange, return, delivery, repair and repeated inspection do not create a second first release. For Q=0 retain the full raw ledger and inherited vectors; issue no unit result."
      source_ids: []
    - rule_id: boundary_stocks
      applies_to: "manufacturing physical closure"
      rule: "At the actual wet manufacture gate O_raw+O_WIP+O_nonWIP+I_phys+ER_pre+U_air+H2O_in=C_raw+C_WIP+C_nonWIP+T_accept+W_man+E_man+EO_pre+T_other+H2O_out; at actual FG service gate O_FG+T_accept+ER_FG+I_incremental+J_in+H2O_in=C_FG+S_gross+EO_FG+W_FG+E_FG+J_out+H2O_out. Every term is actual and disjoint: whole I_phys/I_incremental includes all true additional matter, not only what remains in C, and separate J/H2O excludes amounts already in whole legs. T_other is only actual named atomic transfers. Combine gates and cancel one matched actual T_accept, never Q0 as a second external product. T_accept is the actual physical transfer at the declared manufacture-to-FG-service gate; Q0 is the separately measured first-release reference-event denominator. Where the same configuration, state, event and window make them coincide, demonstrate that equality from independent records, never fit Q0 from physical closure. The finished reference row declares the unit and is not another external shipment. Manufacturing, FG-service and consolidated gates retain every real wet stock and gross exchange; consolidation cancels the one actual internal T_accept only, not external dispatch or real return. For an actually reacting species i, keep measured G_i formation and C_i consumption in its species equation; do not conserve reacting molecules by assumption or infer them from elemental closure. Chemical reactions create no net total-mass/element source; phase transfer is not chemical creation. Water additions/evaporation and all other terms must be mutually disjoint from water already included in whole supplied articles, carrier legs or releases. Unknown terms remain unresolved, not residual-fitted."
      source_ids: []
    - rule_id: boundary_fg
      applies_to: "observed post-release services"
      rule: "Keep original Qc and historical burdens for opening/closing FG, gross dispatches, external return receipts and outward returns. Record all actually performed storage/handling/packing/retesting/rework/disposal within observation H against original Qc; future unperformed services remain unknown. Record original dispatch and any real reversal separately, without creating manufacture credit or deleting failed/unauthorized movement. Internal first-release FG handover cancels when manufacture and service gates are combined."
      source_ids: []
    - rule_id: boundary_packaging
      applies_to: "each identified packaging pool"
      rule: "For each actual whole wet corrugated-carton, PE-bag, sealing-tape or plastic-crate pool use O_empty+O_attachedWIP+O_attachedFG+O_reusable+P+I_other+ERin+J_in+H2O_in-X_in=C_empty+C_attachedWIP+C_attachedFG+C_reusable+S_gross+EOout+W_whole+J_out+H2O_out-X_out. I_other is the sum of actual separately identified otherwise received whole packaging, including real supplier-included packaging when present, distinct from P and ERin and not another purchase; internal reuse R_internal cancels between matched positions and is not I_other. J is additional real non-water material and H2O is additional actual water transfer only to the extent not already included in another whole wet leg. O/C and every whole leg retain all contained matter: actual new material/water retained in C never erases its true influx. X subtracts only independently proved overlap with OTHER same-side flow terms, never C, real increments, opposite directions or card existence. Trace actual J/water sources/destinations with specific physical records and internal pairs; do not invent a generic provider, extra Q, separate constituent waste or balancing flow. Gross shipments, external returns received/sent and true whole waste stay physically full regardless of environmental use shares. These four specific article pools are conditional on actual configuration; these are actual conditional packaging choices, not a universal material, tare, repair, water uptake or mass. The inherited I cards mean this I_other whole-article transfer, never the internal R_internal loop or a generic unknown balancing addition."
      source_ids: []
    - rule_id: boundary_waste
      applies_to: "waste and molecular releases"
      rule: "Use one measured mixed-assembly Waste stream only when genuinely collected mixed, with independently measured originW subaccounts that do not add again to its total. A separately collected waste and its mixed-stream share cannot both leave the gate. Keep recipient/type/state and wet mass; external treatment is linked once. Add each actually identified elementary species/media separately. COD/VOC/PM/NOx indicators are not particular molecular masses; no assumed combustion, steam/boiler, gas chemistry or reaction water is created."
      source_ids: []
    - rule_id: boundary_heat_returns
      applies_to: "additional real carriers"
      rule: "If actual heat-carrier Product returns, components, assets or fluids cross either gate, add individual gross native-unit cards and retain state/phase/temperature/pressure/enthalpy and the supplier water/energy convention. One supplier service is not purchased both as physical carrier and heat MJ. X deduplicates only an identified same-side OTHER transfer; it cannot offset stock, the opposite side or an omitted card."
      source_ids: []
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
