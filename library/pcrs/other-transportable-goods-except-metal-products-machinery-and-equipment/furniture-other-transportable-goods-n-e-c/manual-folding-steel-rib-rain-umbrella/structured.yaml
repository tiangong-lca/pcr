allocation_rules:
  - rule_id: allocation_scope
    applies_to: "attributional shared processes"
    rule: "Apply this hierarchy only where the study goal requires attributional allocation. First separate dedicated operations and then virtual subdivision for exchanges uniquely attributable to one umbrella configuration or service cohort."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: allocation_cause
    applies_to: "remaining individual burdens"
    rule: "For each remaining exchange identify and justify its determining physical causality; use actual meter/task records and a causal driver for that exchange. Do not freely choose physical or economic allocation and do not assign one universal mass/time key to all exchanges."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: allocation_residual
    applies_to: "genuinely residual shared burdens"
    rule: "Only genuinely residual burdens use contemporaneous market values in the actual condition at the common process exit. Remove later transport/packing/service value from the compared prices and disclose uncertainty. All allocated vectors sum to the unallocated vector; physical gross movement remains unchanged."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: allocation_no_credit
    applies_to: "scrap, returns and packaging"
    rule: "Rejected umbrellas, returned packaging and mixed waste do not automatically become coproducts or receive avoided-production credit. Demonstrate actual status, recipient, joint process and compatible treatment; report any separate recycling-model choice explicitly."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Manufacturer process pages do not support the allocation hierarchy. The ILCD text is used qualitatively within its attributional scope; the multifunctional-printer QFD figure and recycling equations are adjacent countercontexts, not adopted umbrella factors."
    source_ids: []
