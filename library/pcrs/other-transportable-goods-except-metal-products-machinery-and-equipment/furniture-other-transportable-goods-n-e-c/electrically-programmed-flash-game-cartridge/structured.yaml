  calculation_rules:
    - id: calc_release
      applies_to: "finished_cartridge"
      rule: "Q = sum of unique first-release net complete-cartridge masses in H. Exclude packaging and rejects; closing newly released FG remains in Q."
      inputs:
        - cp_release
      output: "Q"
      source_ids: []
    - id: calc_units
      applies_to: "all inventory rows"
      rule: "Convert each raw record to its actual numerator unit before attribution. Electricity MJ = raw kWh × 3.6. Integrate a genuine rate over its measured interval once; use independently measured substance/state density only where needed. Do not invent factors."
      inputs:
        - raw_native
        - cp_energy
        - cp_energy_board
        - cp_energy_program
        - cp_energy_housing
        - cp_energy_release
        - cp_energy_services
      output: "raw_converted"
      source_ids: []
    - id: calc_stock
      applies_to: "all inventory rows"
      rule: "For each exchange maintain opening inherited vector + actual acquired/incurred vector = genuinely unconsumed closing inherited vector + target first-release-cohort attributed vector + evidenced transfers to genuinely other functions. Ordinary waste/reject/sample burdens are not deducted as other functions; related zero-output loads remain visible. Released closing FG and already-performed services are not unconsumed closing vectors. Internal transfers cancel. Do not use a mass fraction to guess a chemical or energy vector. Separate unconsumed raw stock and WIP from released FG."
      inputs:
        - cp_material
        - cp_service
        - cp_waste
        - cp_waste_board
        - cp_waste_program
        - cp_material_housing
        - cp_waste_housing
        - cp_waste_release
        - cp_service_services
      output: "burden_vectors"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_physical
      applies_to: "all inventory rows"
      rule: "V is the actual full gross physical exchange in its own native unit. Reconcile each article and constituent independently: opening physical pool + external receipt = closing pool + gross outward movement + actual physical consumption/loss as appropriate. Whole-article and separately supplied constituent ledgers are disjoint or explicitly bridged; cancel internal handovers. X only removes same-side duplicate actual OTHER flows and never stock or opposite-side movements. Each actual packaging pool includes disjoint non-water J_in/J_out as well as its existing measured_external_water_in / measured_external_water_out under calc_packaging; X cannot cancel true increments or closing stock."
      inputs:
        - cp_material
        - cp_asset
        - cp_pack
        - cp_waste
        - cp_service
        - cp_waste_board
        - cp_waste_program
        - cp_material_housing
        - cp_waste_housing
        - cp_asset_release
        - cp_waste_release
        - cp_service_services
        - cp_asset_services
      output: "V"
      source_ids: []
    - id: calc_packaging
      applies_to: "all inventory rows"
      rule: "For each packaging article separately: Iopening_empty + Iopening_WIP + Iopening_FG + Iopening_reusable + P + I + ER + J_in + measured_external_water_in = Iclosing_empty + Iclosing_WIP + Iclosing_FG + Iclosing_reusable + S + EO + W + J_out + measured_external_water_out. Water already embodied in a supplied article is non-additive content rather than another receipt. Record real natural adsorption/desorption from independent measurements; do not fit water to a residual. Internal reuse cancels. When W is in the one mixed waste total retain originW but do not export its mass again. The opening and closing states and all six article legs are complete actual wet quantities in kg. ER is external return received, EO external return sent, S full gross shipment, W full wet discard. J_in/J_out are independently measured non-water repair, replacement, deposit, residue or other material transfers across this specific packaging-pool boundary not already included in the whole article legs; no repair or material event is presumed. Existing measured_external_water_in / measured_external_water_out remain independently measured actual water transfers, including natural adsorption/desorption with no repair. Split actual wet added/removed material into disjoint non-water J and measured water using actual composition evidence, no default ratio or density. Material/water already inside opening, closing or a whole P/I/ER/S/EO/W is non-additive content, not another increment. Full W contains substrate, retained residue and water once; its nested children are not additional J_out or measured_external_water_out unless genuinely separated before crossing. Matched internal pool transfers cancel on consolidation without another purchase, provider service or Q."
      inputs:
        - cp_pack
        - cp_waste
        - cp_waste_board
        - cp_waste_program
        - cp_waste_housing
        - cp_waste_release
        - J_in
        - J_out
        - measured_external_water_in
        - measured_external_water_out
        - L_in_observed
        - L_out_observed
        - X_in
        - X_out
        - matched_pool_event
        - independent_material_composition
        - nested_whole_W_components
      output: "packaging_closure"
      source_ids: []
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "For Q > 0 apply A/Q once for attributable manufacturing burden and V/Q once for full physical movements. A is the actual converted and section-7-attributed burden transferred to first release after inherited-vector reconciliation. Cards and protocol aggregation only reference this result. For Q = 0 retain raw loads and unresolved balances without unit results."
      inputs:
        - Q
        - V
        - burden_vectors
        - raw_converted
      output: "unit_manufacture"
      source_ids: []
    - id: calc_service
      applies_to: "all inventory rows"
      rule: "For each original released cohort Qc > 0 normalize only actual H incremental service burden by Qc once and its full gross physical V by Qc once. Retain original delivery reversal and original inherited vector; do not subtract historical manufacture from new Q. Reinspection/rework/redelivery creates no new Q. Qc = 0 or unknown leaves raw services without unit result. Pair/cancel internal Q handover and do not count a logistical dispatch as another product output."
      inputs:
        - cp_service
        - cp_pack
        - cp_energy
        - cp_asset
        - Qc
        - V
        - cp_energy_board
        - cp_energy_program
        - cp_energy_housing
        - cp_energy_release
        - cp_asset_release
        - cp_energy_services
        - cp_service_services
        - cp_asset_services
      output: "unit_service"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all cards and reference"
      requirement: "Preserve full native flow context and actual supplier compatibility including every basename/synonym/comment and CAS and grade and route and form and geography and media and type and all properties. Require the exact referenced property/unit-group version chain before UUID adoption; no latest-version inference. A query candidate is not a direct public-state verification."
      evidence: "supplier BOM; complete identity and unit evidence"
    - id: dq_quantity
      applies_to: "all numerator records"
      requirement: "Use real calibrated measurements and actual composition; never prescribe capacity or unit mass or yield or programming power or recipe or temperature/time or lifespan. Unmeasured core stages remain explicit completeness holds. Ordinary unresolved auxiliary provider identity remains distinct from core methodology evidence."
      evidence: "calibration; sampling; raw and calculated records"
    - id: dq_context
      applies_to: "source applicability"
      requirement: "Retain source-specific scope and adjoining contrary examples. The historical SNES case supports flash assembly and an actual failure rather than contemporary factory yields; HoskBrew supports services rather than a measured SMT recipe. Manufacturing originals do not establish allocation."
      evidence: "complete originals and source-specific applicability assessment"
    - id: dq_temporal
      applies_to: "manufacture and released cohorts"
      requirement: "Cover the whole declared H and every actual site; keep each exchange inherited vector and opening/closing physical pool. Include starts and stops and idle and clean-up and unsuccessful batches and rework. Document unobserved future services as unknown."
      evidence: "lot travellers; stock and cohort ledgers"
    - id: dq_software
      applies_to: "original and service suppliers"
      requirement: "Report original creation coverage and actual reuse-population uncertainty plus rights and copying boundaries and double-count protection. Price and code size and cartridge kg do not substitute for actual activity."
      evidence: "original dataset; rights/provenance; provider coverage"
    - id: dq_reconciliation
      applies_to: "all physical and burden systems"
      requirement: "Report independent mass and relevant element/species balances with actual water states and sinks. Keep real mixture totals and origin subledgers non-additive. No fitted density or invented repair/material to force closure; unexplained residuals stay visible."
      evidence: "mass/species balances; independent measurements"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Q0 denotes the locked positive original first-acceptance cohort mass; Q=0 denotes a zero-output observation. They are different accounts. Original-cohort service uses the same original Q0=Qc and observed H, not a new mass or a second normalization."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "Lock original cohort c and original Q0=Qc=sum(M_e) at unique first conforming whole-cartridge acceptance events e. Each M_e is calibrated complete net wet cartridge kg at that event with the actual integral supplied components once, packaging and test assets excluded. Manufacturing Q is the original Qc of the declared manufacturing cohort. Do not recompute Qc from present surviving mass, net shipment, later reinspection or wet/dry changes. Failed/no-release Q=0 retains all raw loads and no normalized result. Opening raw/WIP carries its measured physical stock and inherited exchange vector once; an opening accepted cartridge retains its original Qc and manufacture history, not a new purchase or acceptance."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "For every original accepted event partition its original-acceptance basis into disjoint net external possession, on-site released FG, quarantine, repair/rework WIP, internal use, irreversible destroyed/lost portions and other documented terminal dispositions. Their current/terminal sum equals original Qc independently of present wet physical mass. Gross dispatch and returns remain complete physical events; a return reverses the corresponding external possession before later redispatch moves the same surviving entitlement. Split partial loss and survival on a documented original basis; do not restore lost water/parts to the survivor and also export the loss. Present wet stocks, evaporation, removed/new parts and all physical exits have their own conservation bridge. Unknown genealogy or cohort assignment stays unresolved with complete raw totals; loops, postacceptance destruction, retest and failed work create no new Q."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "Record actual receiver-transfer t and full wet whole outlet Qt once: discarded hardware, packaging, wipe, swab, cloth, filter or equipment substrate plus actually retained solvent, dust, formulation residues and water. Dry substrate, contained chemical and water ledgers are reconciled non-additive children. They become separate external waste exits only after real physical separation before the boundary with separate transfer IDs. Package W or removed-part origins within one mixed outlet are traced children, never a second export or second treatment demand. Actual receiver receipts and total treatment demand remain Qt, independent of environmental attribution."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "Assign environmental/service vectors A_tc to nonoverlapping original cohorts from demonstrated causal demand and the allocation hierarchy. Reconcile sum_c(A_tc) plus actual other-function/unassigned vectors to the one actual total provider demand. Physical Qt remains in one event register; reports link to it rather than charge the full event again to each cohort or shrink the physical export by an allocation fraction. Physical V/D context disclosures are non-additive across overlapping reports. Treatment and service inventory is independently assigned A_tc/D, using manufacturing Q or original Qc with observed H; it is not an extra full Qt/D for every cohort. Keep genuinely unknown allocation unresolved. Supplier-embedded history/treatment and fully expanded corresponding direct inventories are mutually exclusive representations, not additive purchases."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "The first-party manufacturing account establishes an actual new flash-based game cartridge, not merely blank storage or a PCB. Its ROM writing, working-cartridge/console testing, shell integration and labelled physical release support this product gate. It does not state that a particular readback/hash algorithm or programming fixture settings were used. Record the actual accepted release image, file hash/provenance, target mapping, supported board/programmer/interface and write/verification logs. Readback comparison is an explicit technical verification requirement only with actual supported reads and defined comparison coverage; it is not a retrospectively asserted observation from the source. Otherwise retain the actual supported integrity/functional acceptance method and its evidence; unresolved essential programming/verification applicability keeps that concrete route on hold. Do not waive it by future collection wording or a finite check."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "The account informally calls solder paste glue and reflow drying. This does not establish solder alloy, flux/solvent chemistry, temperature profile, loss or molecular reaction. Use actual supplied whole paste formulation once with disjoint metal/flux/solvent/water child ledgers, actual reflow energy and measured species/phase destinations. Do not assume reacting species are conserved, all solvent evaporates, missing mass is water or all input solder becomes joint metal. Captured residue on a board, cloth, filter or container stays in that whole contaminated article until real separation. Each actual separately supplied cleaning preparation, inert gas, utility, waste and molecular species needs its own atomic card before completeness is claimed; a source photograph supplies no recipe or factor."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Every actual supplied bare board, packaged IC, capacitor, resistor, populated module, shell, label and packaging article requires a genuine complete upstream producer or an expanded mutually exclusive actual inventory. Include real semiconductor fabrication/packaging, bare-board manufacture, SMT when supplied, shell forming, finishes, utilities, maintenance and waste as applicable. Actual owned assembly/reflow/programming/testing and shell forming cannot be hidden behind a paper supplier gate. HoskBrew describes both onsite ROM flashing and shell/manufacturing services; the first-party case sources professional bare boards and US shell/printing suppliers. Keep actual provider boundaries distinct, without requiring the same supplier/SKU across independent evidence. A purchased complete recorded cartridge cannot replace this required manufacturing route."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Retain the actual reusable original game-version account, including original development/build/test resources and any inherited earlier-version work once, separate from present copying/programming. Record the actual eligible reuse population and allocation period, versions/releases/media and original-account balance in compatible delivery units; the portions assigned to real uses plus remaining/unassigned/other-use portions must equal the one original account. No fixed copies, licence price, code size, cartridge mass or an assumed lifetime defines that population. A supplier's complete original/replication service and its expanded constituent activities are mutually exclusive. Actual incomplete/failed prototypes and builds retain their original loads; every physical copy does not repeat full redevelopment. If original allocation or service unit is unknown retain totals and unresolved attribution."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Preserve physical receipt/opening/closing/external-transfer/retirement of the actual programmer, test console, reflow oven, stencil and production/test fixtures independently from their observed service demand, maintenance and original cohorts. Compatible provider units and actual use/history/remaining capacity govern attribution, not an invented asset lifetime or whole machine per cartridge kg. Keep actual integral components and installed fluids once, and whole wet contaminated discards separately from non-additive constituent accounts. Postacceptance services retain original Qc/H; no rewriting or returned/retested/reworked cartridge earns a second first-acceptance event."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "reference and qualifiers"
    rule: "Require one complete recorded physical cartridge and all ordered qualifiers. Reject a blank flash device or bare IC/PCB or console or download or merely a licence as the reference article. Enforce actual storage technology and interface and supply-state/provider limits on every adopted identity."
    source_ids:
      - unsd-cpc38582
      - drludos-snes-manufacture-2020
  - rule_id: validate_release
    applies_to: "first release Q"
    rule: "Q sums unique complete-cartridge net masses at their first successful release only. Remove all packaging/liner and reject mass; retain actual integral components once. Record count and measured mass without an assumed piece-to-kg factor. Q=0 keeps every raw load and emits no unit result. Reinspection or redelivery is not new Q."
    source_ids:
      - drludos-snes-manufacture-2020
  - rule_id: validate_balance
    applies_to: "physical and inherited burden ledgers"
    rule: "Require opening/closing raw and WIP and non-WIP/FG pools and actual gross inputs/outputs at manufacturing and service and combined gates. Preserve a separate inherited vector for each exchange and the original release-cohort link for returns and later work. Do not subtract first-released closing FG from manufacture burden. One residual cannot solve two unknown quantities."
    source_ids:
      - drludos-snes-manufacture-2020
      - hoskbrew-cartridge-services
  - rule_id: validate_packaging
    applies_to: "each actual packaging article"
    rule: "Reconcile P/I/ER/S/EO/W for every actual type and cohort. External returns are not purchases; internal reuse cancels. Gross outward movement includes unsuccessful/rejected shipments. Maintain all actual stock including packaging attached to WIP/FG. Mixed-container originW remains a non-additive subledger and one provider handles its actual total once. Each actual packaging pool includes disjoint non-water J_in/J_out as well as its existing measured_external_water_in / measured_external_water_out under calc_packaging; X cannot cancel true increments or closing stock."
    source_ids:
      - hoskbrew-cartridge-services
  - rule_id: validate_calculation
    applies_to: "all numeric exchange results"
    rule: "Collect raw numerator records without division. Convert actual units or integrate genuine rates once before causal attribution; normalize manufacturing A/Q once or physical V/Q once and services on original Qc once. Cards and protocol aggregation only reference that calculation. Distinguish integrated volumes from rates; material-specific density at measured state is required for volume-to-mass. Unknown relationships are review-required."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "actual operations and source limitations"
    rule: "Require full actual programming/verification and function tests and upstream links; preserve all failed or zero-output loads and omitted-flow gaps. Source industry capability is not a factory measurement and manufacturing sources do not justify allocation. Apply the attributional hierarchy with its original context; sources alone grant neither methodological approval nor a claim about all production technologies."
    source_ids:
      - drludos-snes-manufacture-2020
      - hoskbrew-cartridge-services
      - jrc-ilcd-attributional-2010
  - rule_id: validation_rule_17
    applies_to: "foreground_dataset_conformance"
    rule: "Iopening_empty + Iopening_WIP + Iopening_FG + Iopening_reusable + P + I + ER + J_in + measured_external_water_in = Iclosing_empty + Iclosing_WIP + Iclosing_FG + Iclosing_reusable + S + EO + W + J_out + measured_external_water_out. The opening and closing states and all six article legs are complete actual wet quantities in kg. ER is external return received, EO external return sent, S full gross shipment, W full wet discard. J_in/J_out are independently measured non-water repair, replacement, deposit, residue or other material transfers across this specific packaging-pool boundary not already included in the whole article legs; no repair or material event is presumed. Existing measured_external_water_in / measured_external_water_out remain independently measured actual water transfers, including natural adsorption/desorption with no repair. Split actual wet added/removed material into disjoint non-water J and measured water using actual composition evidence, no default ratio or density. Material/water already inside opening, closing or a whole P/I/ER/S/EO/W is non-additive content, not another increment. Full W contains substrate, retained residue and water once; its nested children are not additional J_out or measured_external_water_out unless genuinely separated before crossing. Matched internal pool transfers cancel on consolidation without another purchase, provider service or Q."
    source_ids: []
  - rule_id: validation_rule_18
    applies_to: "foreground_dataset_conformance"
    rule: "The raw-observation bridges are L_in_observed - X_in = P + I + ER + J_in + measured_external_water_in and L_out_observed - X_out = S + EO + W + J_out + measured_external_water_out. L sums are observation-side totals, not extra provider demand or physical inventory. Map every X to an exact duplicate OTHER observation on the same event/component/unit/side already represented once by the canonical side. After reconciliation every real non-water/water increment remains once; X never cancels true retained ingress, closing/opening stock, opposite-side movements or nested W merely because it remains in stock. With disjoint raw observations X=0. Internal attachment/reuse alone is no pool-boundary crossing; real material transfers from another internal pool have matched source/destination entries and cancel at the combined boundary. Actual provider totals, full wet W and physical inventories remain independent of original Q0=Qc/H and nonoverlapping A/Q attribution. Unknown observations remain unresolved; no residual-fit or future permission closes an unknown."
    source_ids: []
  - rule_id: validation_rule_19
    applies_to: "foreground_dataset_conformance"
    rule: "This PCR covers complete physical console cartridges carrying an identified executable game. The evidenced route uses electrically programmable flash-memory boards and supplied shells through first quality release of the complete net cartridge. Onsite bare-board placement and solder-paste reflow and programming and readback plus actual-console functional tests are collected only where performed; purchased complete populated modules and the parts embodied within them are mutually exclusive inputs. Do not reduce manufacture to buying a completed recorded cartridge and putting it in a box. Sources: drludos-snes-manufacture-2020; hoskbrew-cartridge-services."
    source_ids: []
  - rule_id: validation_rule_20
    applies_to: "foreground_dataset_conformance"
    rule: "The classification note distinguishes cartridges from CDs/DVDs and other carriers. Optical or magnetic media and downloads and blank storage cards and separate chips and bare PCBs and host consoles and licence-only transactions are excluded as reference products. Mask-ROM production cannot be represented by electrical flashing; a download-triggering key card without the complete recorded executable cannot directly use this route. Another memory technology needs evidence and process review within this identity rather than a parallel category identity. A mass reference does not imply equal gameplay function or duration between different games. Source: unsd-cpc38582."
    source_ids: []
  - rule_id: validation_rule_21
    applies_to: "foreground_dataset_conformance"
    rule: "All qualifiers must remain in consumable metadata or reference-flow context. Q is the sum of measured net masses of unique complete cartridges first released in H. Actual integral articles and their true constituent content count once; packaging and detached liner are outside Q. Retain measured count and configuration-specific net mass without inventing kg/item or capacity or code size or yield or lifetime."
    source_ids: []
  - rule_id: validation_rule_22
    applies_to: "foreground_dataset_conformance"
    rule: "Every physical card uses only the single V/Q or original-cohort V/Qc result for its full actual physical V; A or economic/service fractions cannot replace physical quantities. Attributable supplier burden A is accounted once in a separate burden dimension according to actual original/manufacture scope; physical disclosure alone does not generate another purchase/provider demand/credit. Units for original reuse and actual copying services describe their actual delivery object and do not turn cartridge kg into software units."
    source_ids: []
