    rule: "For this actual packaging pool use calc_packaging with disjoint J_in/J_out non-water material transfers and the existing measured_external_water_in / measured_external_water_out, alongside complete wet stocks and six full legs. Keep real retained material and natural humidity even without repair; no material amount or recipe is prescribed. Water/material embodied in this whole article is non-additive. X removes only exact duplicate OTHER observations on the same side, never genuine increments, closing stock or whole wet waste. Any actual separately supplied/transferred material or species requires its own atomic measured card and compatible identity; do not hide it in this article or invent an extra purchase. Conditional on this exact supplied packaging article actually being present. Record its actual composition and supply state; no default polymer or fibre recipe. Q excludes it. Maintain its own P/I/ER/S/EO/W ledger including empty stock and packaging attached to WIP or finished goods plus reusable stock. Internal reuse cancels and is not another purchase or coproduct. Use gross physical V in the actual unit and calc_service once with the original cohort Qc; never reduce logistics by an energy or economic share. W is this separately collected real waste only. If placed in one real mixed container use mixed_waste once and retain non-additive measured originW; do not also export this constituent mass. The single result is determined by the disjoint manufacture scope of calc_normalize and original-cohort service scope of calc_service in section 8; the collection protocol records raw numerators only. Native Waste at plant GLO covers separately collected paper/cardboard packaging waste including its listed cardboard synonym. Use only this card physical origin and actual container; no polymer sleeve/film or mixed nonpaper substitution. No destination or treatment or numerical waste ratio is specified."
