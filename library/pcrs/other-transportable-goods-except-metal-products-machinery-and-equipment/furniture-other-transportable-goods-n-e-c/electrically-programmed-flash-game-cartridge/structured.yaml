    applies_to: "foreground_dataset_conformance"
    rule: "Each card below is one atomic exchange. Applicability requires actual material and route records; missing measurement is not absence. Add a specific card and verify provider and unit for every actual unlisted exchange. Each process preamble applies together with the ancestor boundary and calculation rules."
