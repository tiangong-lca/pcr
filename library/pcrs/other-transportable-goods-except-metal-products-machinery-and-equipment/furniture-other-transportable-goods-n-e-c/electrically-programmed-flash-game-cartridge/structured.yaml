system_boundary:
  rules:
    - rule_id: boundary_scope
      applies_to: "reference product"
      rule: "Only a complete physical cartridge carrying the identified executable game is eligible. Apply the demonstrated flash-memory route. Mask-ROM fabrication and a download-only key card require their own evidenced route within this identity before reuse; do not silently replace them by blank flash media."
      source_ids:
        - unsd-cpc38582
        - drludos-snes-manufacture-2020
    - rule_id: boundary_manufacture
      applies_to: "included foreground"
      rule: "Include receiving and raw storage; actual bare-board component placement and solder reflow or disjoint purchased populated-module receipt; ROM preparation/transfer and programming; readback/integrity and functional tests; shell/closure and label assembly; first quality release; actual packing and internal handling plus storage/dispatch in separate service accounts. Primary sources are a historical manufacturing case and manufacturer service capability; no same-SKU or same-factory synthesis is claimed."
      source_ids:
        - drludos-snes-manufacture-2020
        - hoskbrew-cartridge-services
    - rule_id: boundary_supplied_state
      applies_to: "component upstream coverage"
      rule: "Purchased populated flash-ROM modules carry board fabrication and packaged chips and assembly once. Purchased bare PCB and packaged IC inputs retain their compatible upstream manufacture. Foreground semiconductor wafer fabrication and shell injection moulding are not inferred from disassembly or the word cartridge. If actually operated add evidenced site processes and every atomic input/output before use."
      source_ids:
        - drludos-snes-manufacture-2020
        - hoskbrew-cartridge-services
    - rule_id: boundary_original
      applies_to: "software and rights"
      rule: "Include the attributable original-development burden through its linked reusable original account and actual licence/replication boundary disclosure. Physical program copying does not redevelop the original each time. Meter attributable build/transfer/programming/test services actually operated. Preserve a licence-only payment as rights metadata; if a supplier performs copying use a verified service unit or expanded disjoint activity data. Never derive development energy from cartridge kg or code size or royalty price."
      source_ids:
        - drludos-snes-manufacture-2020
        - jrc-ilcd-attributional-2010
    - rule_id: boundary_time
      applies_to: "stocks failures and service cohort"
      rule: "H covers the complete declared batch/campaign including zero-output starts and stops and idle time and cleaning and rework. Reconcile opening/closing raw material and WIP and every other non-WIP physical pool with an inherited exchange vector for every flow. Manufacturing burden A includes attributable opening WIP and actual H work less traced closing WIP and genuinely unconsumed stock burdens. Newly first-released closing FG is already in Q and is not subtracted from manufacturing A. Later work on released goods belongs to original Qc; reverse original delivery and preserve historic burden rather than invent production or omit returns."
      source_ids:
        - drludos-snes-manufacture-2020
        - hoskbrew-cartridge-services
    - rule_id: boundary_physical
      applies_to: "physical system and extensions"
      rule: "Keep manufacturing and FG and combined physical gates separately closed. Count a whole supplied article/formulation once; assayed constituent content is non-additive. Either disjoint component receipt or a reconciled whole-article bridge is used and internal transfers cancel. Add one named atomic card for every actually used but unlisted cleaning chemical and fuel and cooling water and inert gas and waste and actual molecular emission. Do not set unknowns to zero or hide them in a residual selector. Actual nitrogen and oxygen and argon and water are separate substances; VOC/COD/NOx/PM indicators are not invented molecular masses. No boiler or steam circuit is assumed. Actual externally returned thermal carrier Product needs its gross mass and phase/T/P/enthalpy plus a single water/energy supplier convention."
      source_ids:
        - drludos-snes-manufacture-2020
        - hoskbrew-cartridge-services
    - rule_id: boundary_downstream
      applies_to: "use and completeness"
      rule: "Default product gate is first quality release of the complete cartridge; actual services in H are retained and separately assigned to released cohorts. Future unperformed warehousing or testing is unknown rather than imputed. Consumer gameplay and host manufacture for gameplay and network downloads and post-use end-of-life are separate downstream models. This is not a complete cradle-to-gate dataset until upstream component and original/utility/service gaps are resolved and linked."
      source_ids:
        - unsd-cpc38582
        - drludos-snes-manufacture-2020
        - hoskbrew-cartridge-services
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "Each gate also retains actual natural water adsorption/desorption separately; it is not an invented repair material. Do not replace measured whole-wet stock by an assumed dry-basis factor. Reaction water and free water and phase/structural water require independent species/reaction evidence; one residual cannot fit two unknowns."
      source_ids: []
