    rule: "The one finished reference article includes its populated PCB and programmed flash memory plus actual support components and supplied shell and integral label once. It is not a blank storage device or chip or bare PCB or console or download. Preserve console compatibility and memory technology plus release hash and all section 3 qualifiers. Q is first release net cartridge mass only; retain every failure and zero-output load upstream. Packaging is excluded; a released cartridge held in finished stock has already entered Q. The single result is determined by the disjoint manufacture scope of calc_normalize and original-cohort service scope of calc_service in section 8; the collection protocol records raw numerators only. Native whole Product at-plant production mix in a manufactured finished state. No fixed capacity or chip type or lifetime or grade/geography is supplied. Its scope is software for game cartridges and excludes CD/DVD; it is not blank flash storage or a die or PCB or console or download. Apply only to the complete executable-bearing cartridge of the declared flash configuration. Returned/dispatched articles must remain physically complete recorded cartridges; genuinely waste/different-state articles use their actual specific flow. Complete required qualifiers: game title and release hash; rights and accepted ROM provenance; target console and regional interface; actual flash memory technology and capacity; mapper and CIC or other actual support-chip configuration; supplied module versus onsite board-assembly route; BOM and shell construction; measured configuration-specific cartridge net mass and count; first release criteria and unique release identifiers; failed and rejected physical disposition; period H and every site; opening and closing stock and inherited burdens; programming and test coverage; software-original and licence accounting boundary; packaging configuration and exclusion from Q; actual utility state and supplier boundaries; upstream dataset coverage and allocation evidence."
    source_ids: []
  - rule_id: validation_rule_63
    applies_to: "foreground_dataset_conformance"
    rule: "Only a whole rejected or destroyed cartridge actually exported as waste. Retain shell and PCB within this whole article once; use separate constituent streams only after actual disassembly with reconciled transfers. Unauthorised or rejected goods keep their actual burdens and disposition; release permission does not erase physical manufacture. The single result is determined by the disjoint manufacture scope of calc_normalize and original-cohort service scope of calc_service in section 8; the collection protocol records raw numerators only."
    source_ids: []
  - rule_id: validation_rule_64
    applies_to: "foreground_dataset_conformance"
    rule: "Only one actual co-collected mixed waste with measured gross/tare and actual destination. Keep an independent measured originW subledger for board and shell and label and each packaging origin; these are non-additive contents rather than extra exported waste. Its composition and hazardous status govern provider compatibility; do not substitute a Product or a landfill operation for this Waste. The single result is determined by the disjoint manufacture scope of calc_normalize and original-cohort service scope of calc_service in section 8; the collection protocol records raw numerators only. Native global at-plant mixed manufacturing Waste is limited to final assembly and factory testing and supplies no quantified amount. Use one actual mixed outlet from those operations with its true composition and destination; no automatic split by origins or additional paper/board exports."
    source_ids: []
  - rule_id: validation_rule_65
    applies_to: "foreground_dataset_conformance"
    rule: "Actual services in H follow the original released cohort Qc. Preserve actual batch inputs/outputs and start/idle/failure loads. Physical quantities and inherited burden vectors are separate; pair and cancel internal transfers between adjacent processes."
    source_ids: []
  - rule_id: validation_rule_66
    applies_to: "foreground_dataset_conformance"
    rule: "Use this Product only for actual CN user-side 1–35 kV medium-voltage grid-average consumption mix. The complete native identity is Alternating current with synonym AC and grid-average supply and consumption mix to user and CN geography; no separate CAS or fuel recipe or specific power station is declared. Its sole reference property is Net calorific value linked to the exact energy unit group and reference MJ rather than a mass group. Do not use for low voltage or another country or dedicated incineration generation. Partition meters disjointly with the other-supply card below and avoid duplicate transformer/USB supplies. V preserves full actual delivered electricity for the process; attributable burden A is separate and economic shares do not shrink physical logistics. Normalize once within the disjoint manufacturing calc_normalize or original-cohort service calc_service scope; preserve starts/idle/clean-up/failures/rework."
    source_ids: []
  - rule_id: validation_rule_67
    applies_to: "foreground_dataset_conformance"
    rule: "Only actual CN user-side <1 kV grid-average consumption mix uses this Product. Official basename is Alternating current with synonym AC and delivery to user in CN. Sole reference property Net calorific value links to the exact energy unit group with MJ reference, not Mass. Do not use for medium voltage or another country or specific generation. Partition meters from medium-voltage and other-supply cards; retain starts/idle/clean-up/failure/rework without duplicated USB/transformer power. Collect cp_energy raw numerators and normalize once within the disjoint manufacture/original-cohort service scope in section 8."
    source_ids: []
  - rule_id: validation_rule_68
    applies_to: "foreground_dataset_conformance"
    rule: "Applies only to actual voltage/geography not covered by either CN medium-voltage or low-voltage card; never duplicate their meters. Meter actual user-side electricity by voltage and geography for this operation. Include starts and stops plus idle time and failed attempts and clean-up and incremental rework. Convert raw kWh once to MJ before attribution. Unknown supply is unresolved; no default grid or programming kWh/cartridge factor. For services use the original released cohort account. The single result is determined by the disjoint manufacture scope of calc_normalize and original-cohort service scope of calc_service in section 8; the collection protocol records raw numerators only."
    source_ids: []
  - rule_id: validation_rule_69
    applies_to: "foreground_dataset_conformance"
    rule: "For this actual packaging pool use calc_packaging with disjoint J_in/J_out non-water material transfers and the existing measured_external_water_in / measured_external_water_out, alongside complete wet stocks and six full legs. Keep real retained material and natural humidity even without repair; no material amount or recipe is prescribed. Water/material embodied in this whole article is non-additive. X removes only exact duplicate OTHER observations on the same side, never genuine increments, closing stock or whole wet waste. Any actual separately supplied/transferred material or species requires its own atomic measured card and compatible identity; do not hide it in this article or invent an extra purchase. Conditional on this exact supplied packaging article actually being present. Record its actual composition and supply state; no default polymer or fibre recipe. Q excludes it. Maintain its own P/I/ER/S/EO/W ledger including empty stock and packaging attached to WIP or finished goods plus reusable stock. Internal reuse cancels and is not another purchase or coproduct. Use gross physical V in the actual unit and calc_service once with the original cohort Qc; never reduce logistics by an energy or economic share. P is separately purchased packaging only; supplier-bundled ingress I and external returns ER are separate disjoint legs. The single result is determined by the disjoint manufacture scope of calc_normalize and original-cohort service scope of calc_service in section 8; the collection protocol records raw numerators only."
