  - rule_id: validation_rule_101
    applies_to: "foreground_dataset_conformance"
    rule: "Preserve actual full physical V by configuration and original cohort; quantities are not reduced by allocation shares or stock changes. Record actual legal/acceptance state separately. Returns and reinspection do not create new Q. Original delivery reversal and inherited manufacture burden remain with the original released cohort. This logistical record is not another reference output or an automatically credited coproduct. The single result is determined by the disjoint manufacture scope of calc_normalize and original-cohort service scope of calc_service in section 8; the collection protocol records raw numerators only. Native whole Product at-plant production mix in a manufactured finished state. No fixed capacity or chip type or lifetime or grade/geography is supplied. Its scope is software for game cartridges and excludes CD/DVD; it is not blank flash storage or a die or PCB or console or download. Apply only to the complete executable-bearing cartridge of the declared flash configuration. Returned/dispatched articles must remain physically complete recorded cartridges; genuinely waste/different-state articles use their actual specific flow. Complete required qualifiers: game title and release hash; rights and accepted ROM provenance; target console and regional interface; actual flash memory technology and capacity; mapper and CIC or other actual support-chip configuration; supplied module versus onsite board-assembly route; BOM and shell construction; measured configuration-specific cartridge net mass and count; first release criteria and unique release identifiers; failed and rejected physical disposition; period H and every site; opening and closing stock and inherited burdens; programming and test coverage; software-original and licence accounting boundary; packaging configuration and exclusion from Q; actual utility state and supplier boundaries; upstream dataset coverage and allocation evidence."
