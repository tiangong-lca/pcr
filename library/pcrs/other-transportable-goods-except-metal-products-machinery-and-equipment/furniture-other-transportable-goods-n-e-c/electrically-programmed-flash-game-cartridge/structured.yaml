allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "This method applies only to attributional cases requiring allocation. Manufacturing originals support product and route and do not support an allocation ratio. The hierarchy below follows ILCD §7.9.2–7.9.3; the QFD example for comparing functions of complex products is not a cartridge-production allocation factor."
    source_ids: []
  - rule_id: allocate_dedicated
    applies_to: "each exchange"
    rule: "Use dedicated collection then actual or virtual subdivision to assign exclusive materials and operations first. Keep separate board routes and versions and orders wherever they have separate data. Programme-memory capacity and code size are descriptors; neither automatically causes the same share of reflow or test energy."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocate_physical
    applies_to: "unavoidable shared exchanges"
    rule: "After subdivision identify the determining physical causal relationship separately for each remaining exchange and document numerator/denominator and included co-functions. Metered equipment load and occupied time may support an energy share only with actual causal evidence and full zero-output coverage. A physical metric is not automatically causal and the same key must not be imposed on all exchanges."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocate_residual
    applies_to: "truly inseparable residual"
    rule: "Only an evidenced residual that cannot be assigned by determining physical causality may use contemporaneous market values of actual co-products/functions at the same common-process gate and actual condition. Remove values added by later transport/packing or treatment. Document time and quantity and price evidence and sensitivity. Do not choose freely between mass and economic allocation; no fixed ratio or automated substitution/recycling credit."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocate_original
    applies_to: "reused game original"
    rule: "Collect one complete accepted original creation system and identify all actual versions and channels drawing on it. Use an evidenced attributional reuse model consistent with its upstream dataset; document allocated share and observed population and uncertainty. Do not charge a complete original to every copied cartridge or convert licence money to energy. Unresolved population and upstream completeness remain data gaps."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocate_logistics
    applies_to: "physical exchanges and losses"
    rule: "Allocation acts on burden accounts and cannot shrink gross physical movements of articles or packaging or returned assets or carrier water or wastes. Keep V and burden A separate. Failures and unauthorised/rejected production retain their material and service loads; no right or acceptance decision cancels them. Rework adds only actual incremental work to the original inherited vector and does not regenerate Q."
    source_ids:
      - jrc-ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "release"
      flow_role: "finished_cartridge"
      record_type: "calibrated weighing and release log"
      raw_fields: "lot; configuration; serial or unique batch member; first release time; net cartridge mass kg; count; release hash; tested functions; reject state; packaging tare; Q; H"
      collection_method: "Weigh accepted complete cartridges by configuration on a calibrated scale excluding all packaging; deduplicate first release identifiers; record measured samples and count expansion with actual sampling uncertainty. Raw aggregation instruction: Sum undivided first-released net masses into calc_release; reference only calc_normalize afterwards."
      unit: "kg; item"
      frequency: "each release"
      temporal_coverage: "complete H"
      site_scope: "all manufacturing and outsourced release sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; release signature; test/readback log; BOM and mass reconciliation"
    - protocol_id: cp_material
      process_id: "receipt"
      flow_role: "each physical article or formulation"
      record_type: "receipts issues and stock"
      raw_fields: "article; actual supply state; BOM route; grade; chemical composition or CAS where applicable; lot; unit; measured receipt; opening and closing raw/WIP/non-WIP; internal issue and return; external return; loss; inherited vector per exchange"
      collection_method: "Trace each individual supplied article/formulation by lot; reconcile count and independently measured mass; treat embedded content/assay as non-additive; preserve disjoint module/component quantities. Raw aggregation instruction: Aggregate undivided raw movements and inherited vectors; reconcile with calc_stock and calc_physical; reference calc_normalize only."
      unit: "actual native unit; kg; item"
      frequency: "each movement"
      temporal_coverage: "H plus linked opening history"
      site_scope: "all storage and assembly sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier specification; SDS if applicable; invoices; traveller; scale and stock records"
    - protocol_id: cp_energy
      process_id: "receipt"
      flow_role: "each electricity meter"
      record_type: "meter interval and equipment record"
      raw_fields: "meter; operation; start/end reading; raw kWh; voltage; geography; supplier boundary; operating load/time; starts; idle; cleaning; failed attempts; rework; H; original Qc if services"
      collection_method: "Read interval meters including no-output periods; reconcile host/USB and facility overhead without double counting; use a documented physical causal model only when metering cannot separate shared work. Raw aggregation instruction: Sum raw undivided energy; convert once by calc_units; attribute by section 7; use calc_normalize or original-cohort calc_service once."
      unit: "kWh; MJ; h"
      frequency: "each interval and campaign reconciliation"
      temporal_coverage: "whole H including Q=0"
      site_scope: "every actual facility and supplier service scope"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; bills; equipment logs; shared-load model and closure"
    - protocol_id: cp_original
      process_id: "program"
      flow_role: "original"
      record_type: "version and reuse burden account"
      raw_fields: "original id/hash; complete creation inventory; accepted version; actual reproduction channels and population; reuse share; upstream unit; copied title; licence scope; provider boundaries; uncertainty"
      collection_method: "Retain one complete upstream original account; reconcile its actual reuse population and copied release identities; distinguish licence-only rights from delivered copying work. Raw aggregation instruction: Retain undivided original and copy-population records; apply allocate_original and then calc_normalize only once for this cohort."
      unit: "item; upstream native exchange units"
      frequency: "per version and actual population update"
      temporal_coverage: "original creation history plus actual cohort use"
      site_scope: "developers and original owner plus actual providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "development dataset; version provenance; rights record; actual reproduction register; uncertainty"
    - protocol_id: cp_asset
      process_id: "program"
      flow_role: "programmer; test_console; asset_external_return"
      record_type: "physical asset and service burden register"
      raw_fields: "asset id; actual configuration; measured net article kg; gross external acquisition V; external return V; opening/closing asset pool; actual occupied service; upstream manufacture boundary; supported reuse model; inherited vector; J_in; J_out; measured_external_water_in; measured_external_water_out; L_in_observed; L_out_observed; X_in; X_out; matched_pool_event; independent_material_composition; nested_whole_W_components"
      collection_method: "Record full physical acquisition and returns with independent asset stock closure; derive burden share separately from actual usage and upstream boundary; no default lifetime or purchase per copy. Raw aggregation instruction: Preserve undivided gross V and separate attributable burden; physical movements use calc_physical before calc_normalize or calc_service once. Independently observe non-water J_in/J_out for actual packaging-pool transfers and preserve the existing measured water in/out, including no-repair natural humidity. Retain complete wet states, disjoint six legs, same-side OTHER duplicate-event proof and matched internal pool handoffs; every actual new material/stream gets its own atomic card."
      unit: "kg; item; h"
      frequency: "each acquisition/return and use interval"
      temporal_coverage: "H and original asset history"
      site_scope: "all actual equipment locations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "asset register; scale/supplier mass; equipment-use log; upstream asset data and model"
    - protocol_id: cp_service
      process_id: "program"
      flow_role: "replication_service; cartridge_return_in; cartridge_dispatch"
      record_type: "supplier activity and release-cohort ledger"
      raw_fields: "provider; exact service unit; attempted and accepted copy count; complete coverage; actual performed H work; original release cohort; Qc; opening/closing FG; gross shipment and return V; original-delivery reversal; incremental rework; inherited vector"
      collection_method: "Verify service delivery unit and supply-state coverage; preserve every gross movement including rejected/unauthorised returns; pair internal first-release transfers and maintain original-cohort historical burden. Raw aggregation instruction: Keep raw service and full V undivided; no future service projection; use calc_service with original Qc once; cancel internal release movements."
      unit: "item; kg; actual service unit"
      frequency: "each service or gross movement"
      temporal_coverage: "actual H only plus original release history"
      site_scope: "all providers storage and dispatch sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier records; dispatch/return documents; original release register; acceptance/refusal and history"
    - protocol_id: cp_pack
      process_id: "services"
      flow_role: "each named packaging card"
      record_type: "separate article and cohort pool"
      raw_fields: "packaging identity; actual material; original cohort; Qc; Iopening empty; Iopening attached WIP; Iopening attached FG; Iopening reusable; P; I; ER; S; EO; W; Iclosing empty; Iclosing attached WIP; Iclosing attached FG; Iclosing reusable; internal reuse; originW; J_in; J_out; measured_external_water_in; measured_external_water_out; L_in_observed; L_out_observed; X_in; X_out; matched_pool_event; independent_material_composition; nested_whole_W_components"
      collection_method: "Weigh/record every actual packaging article separately; verify matched count-to-mass by actual configuration; retain full gross shipment/return and independent waste records; track all packaging pools. Raw aggregation instruction: Keep each P/I/ER/S/EO/W raw total undivided; apply calc_packaging closure and calc_service once. Independently observe non-water J_in/J_out for actual packaging-pool transfers and preserve the existing measured water in/out, including no-repair natural humidity. Retain complete wet states, disjoint six legs, same-side OTHER duplicate-event proof and matched internal pool handoffs; every actual new material/stream gets its own atomic card."
      unit: "kg; item"
      frequency: "each movement and closing reconciliation"
      temporal_coverage: "actual H and original cohort history"
      site_scope: "all stores and packing/dispatch sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "packing BOM; calibrated scales; stock ledger; gross dispatch/return receipts; waste manifests"
    - protocol_id: cp_waste
      process_id: "receipt"
      flow_role: "each waste card"
      record_type: "actual waste manifest and measured origin"
      raw_fields: "container; actual Waste type; composition; hazardous status; physical origin; gross/tare; net kg; opening/closing waste pool; destination; actual treatment; independent originW; liquid state and species if applicable; J_in; J_out; measured_external_water_in; measured_external_water_out; L_in_observed; L_out_observed; X_in; X_out; matched_pool_event; independent_material_composition; nested_whole_W_components"
      collection_method: "Weigh actual segregated or genuinely co-collected waste once; preserve actual mixed total and non-additive measured originW; record internal rework before final export separately. Raw aggregation instruction: Sum raw undivided physical V by one actual container/destination; avoid total-plus-component double count; reference calc_normalize or calc_service once. Independently observe non-water J_in/J_out for actual packaging-pool transfers and preserve the existing measured water in/out, including no-repair natural humidity. Retain complete wet states, disjoint six legs, same-side OTHER duplicate-event proof and matched internal pool handoffs; every actual new material/stream gets its own atomic card."
      unit: "kg; actual native unit"
      frequency: "each collection/export"
      temporal_coverage: "whole H including failures"
      site_scope: "all sites and actual treatment providers"
      aggregation_rule: "per 1 kg reference flow"
