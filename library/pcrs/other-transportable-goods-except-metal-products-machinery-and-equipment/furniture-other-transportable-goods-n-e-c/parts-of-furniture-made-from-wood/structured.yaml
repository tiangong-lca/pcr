system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "complete product system"
      rule: "Include full stock-to-leg machining, dust control, actual connectors, inspection and pre-release rework; startup/shutdown, idle, cleanup, failed/zero-output runs and samples retain real loads. Purchased stock drying remains upstream. Add each real unlisted chemical, fuel, water supply, component, emission and outlet before use; no hidden other/zero bundle. This dry electric route does not invent a boiler, steam, combustion or surface coating."
      source_ids:
        - richman-unfinished-leg
        - drewbak-components
        - bukexpo-beech-supply
    - rule_id: boundary_first_release
      applies_to: "manufacturing and gate_service"
      rule: "Q is net mass newly first quality-released once. Closing already-released FG is included in Q, never deducted from manufacturing B_close or added as a second product. Manufacturing B_close includes only raw/WIP and unused unassigned material/service charges. Packaging/storage/handling/dispatch/returns have original cohort Q_H and observed horizon H; consolidate internal Q handover by cancellation."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: boundary_postrelease
      applies_to: "actual FG work and natural moisture"
      rule: "Post-release machining/repair requires manufacturer/specification permission, postwork tests, acceptance and disposition to claim continuing qualification; it creates no first release. Lack of permission or failed tests never deletes an actual operation, physical flow or load: retain original cohort and hold/waste status. Broken parts are not assumed restorable. Ordinary humidity uptake/loss is measured independently and needs no invented work permission."
      source_ids:
        - richman-unfinished-leg
        - usda-wood-handbook-2021
    - rule_id: boundary_gross
      applies_to: "each physical gate"
      rule: "Reconcile manufacturing, FG service and consolidated gates with full opening/closing wet raw/WIP/FG, equipment, installed fluids and all actual external gross legs. Never scale physical mass by economic/burden shares. F_in/F_out are independently measured real repair/new-material/water-phase influx and outflow, never a balance residual. X_in/X_out deduct only a proven duplicate already included in an OTHER actual same-side inlet/outlet term, with matched event identity. Stock, an opposite-side term, merely having a card, or closing retention is not overlap evidence. Preserve true retained influx and full wet closing stock simultaneously. Whole articles/preparations and disjoint constituent bridges occur once; internal handovers cancel."
      source_ids:
        - ilcd-attributional-2010
        - usda-wood-handbook-2021
    - rule_id: boundary_ownership
      applies_to: "whole supply and actual disposal"
      rule: "One whole externally purchased preparation/article is procured once; assay, carried water, binder, active components, embedded studs and initial installed fluids are subledgers. Real onsite manufacture/mixing has each separately bought input, real energy and losses. Real waste/failure/sample exports or sales do not by themselves transfer manufacturing or treatment burdens. No automatic coproduct, avoided production or negative credit."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. F_in/F_out retain independently measured material/water changes. X_in/X_out remove only a documented duplicate already present in another real same-side flow, never stock, the opposite side, card presence or closing retention; neither F nor X is a residual used to force closure. For a receipt whose history or paid/non-purchased status cannot establish P/I/ER, retain one provisional atomic whole-article F_in under cp_packaging, mutually exclusive with P/I/ER and other F components, until evidence establishes its unique final category. Proven first non-purchased/replacement articles use I, not an additional final whole-article F_in. Reclassification moves the one measured event and its burden handover, without adding a second inlet/provider or cancelling it against full wet closing stock. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - ilcd-attributional-2010
