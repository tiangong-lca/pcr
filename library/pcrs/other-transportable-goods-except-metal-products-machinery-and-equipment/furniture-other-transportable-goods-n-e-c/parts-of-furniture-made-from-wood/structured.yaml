    - id: dq_identity
      applies_to: "reference and all real exchanges"
      requirement: "Actual configuration, product/route, native restrictions and upstream provider scope must agree; unknown auxiliary identity is not zero."
      evidence: "approved drawing; full BOM; supplier data; original native context"
    - id: dq_mass
      applies_to: "all measured mass and water"
      requirement: "Representative moisture, full wet stock and independent water/solid/element evidence; calibration, sampling gradients and volatile extractives uncertainty remain explicit."
      evidence: "paired masses; moisture method; scale records; uncertainty"
    - id: dq_complete
      applies_to: "all period and H"
      requirement: "Include ordinary failures/zero output/start-stop/idle/cleanup/samples, real unauthorised work and actual held/waste disposition; no missing atom hidden as other."
      evidence: "production/service logs; incident and disposition records"
    - id: dq_allocation
      applies_to: "each residual burden"
      requirement: "Document dedicated/virtual subdivision, exchange-specific causal decision, true common-gate residual value, total vector conservation and sensitivity; no gross mass shares."
      evidence: "allocation worksheet; counterpart receipts; original unnormalised records"
    - id: dq_sources
      applies_to: "all sources and temporal scope"
      requirement: "Sources support the declared need and original context; manufacturer product/route evidence is not a numerical factory dataset or scientific/translation approval."
      evidence: "full sources; source-to-rule applicability; site/time/provider disclosure"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference and every card"
    rule: "Match complete native name/synonyms/comments, CAS when meaningful, material/phase/form/route/grade/geography/compartment/type and every property before binding. UUID has no dataset-version suffix in canonical content; exact versions are external identity evidence. Wrong raw-wood/whole-furniture core references are blocking. Auxiliary/provider/quantity gaps remain explicit and do not fabricate a core identity hold."
    source_ids:
      - richman-unfinished-leg
      - drewbak-components
  - rule_id: validation_reference
    applies_to: "finished_leg and collection"
    rule: "There is one complete Product reference output linked by finished_leg, measured kg and unique first release. Counts require each actual same-configuration net complete-leg mass with moisture/calibration, never a guessed item kg or secondary property/density. Item(s) and item mean factor1 count only; this PCR does not change to an area or count denominator."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: validation_normalization
    applies_to: "all inventory rows"
    rule: "Preserve unnormalised raw records, conversions and allocation before the sole quotient. Burden rows use attributed A; gross cards use full V as A with no stock/economic correction, automatic provider multiplication or second credit. Q=0 retains all real load and has no per-unit result. Service uses original Q_H over H."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: validation_balance
    applies_to: "manufacture FG and consolidated"
    rule: "Independently reconcile full physical mass, water and relevant elements, including moisture gain/loss, wood-biogenic, oil/packaging fossil and ambient carbon. Distinguish free/sorbed water and actual structural/reaction water; one residual cannot fit two unknowns, and no dry-machining reaction is presumed. COD/VOC/dust/element totals do not specify molecules. No whole-air aggregate plus species double count."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: validation_packaging
    applies_to: "each material P I ER S EO W"
    rule: "Each real packaging material has separate six-direction cards and complete wet opening/closing empty/attached-WIP/FG/reusable stocks. Repair/new water X terms remove only genuine flow overlap. If a real mixed outlet exists, its one Waste exchange replaces external component-W cards while all W source pools remain traceable. Internal reuse cancels; whole article/component sums and treatment/provider each occur once. F_in/F_out are independently observed true increments; X is only a matched duplicate of an OTHER actual same-side flow. Neither stock nor the opposite side nor card presence permits X; no retained influx is cancelled against full wet closing stock. Verify article identity or auditable batch membership, this boundary/original cohort, actual prior outward S/EO and linked return receipt with necessary earlier-period/offsite custody evidence before accepting ER. Previous use, burden handover, the same UUID/material or equal mass is insufficient; independently measured returned wet mass/state may differ. Proven first non-purchased/replacement ingress requires its own atomic I event and the complete cp_packaging Amount/collection chain. Unresolved history or paid/non-purchased status retains one full measured provisional atomic whole-article F_in and an explicit classification gap requiring resolution to one P/I/ER category before dataset acceptance, never a fabricated return, purchase or zero. I, qualified ER, P and provisional F_in are mutually exclusive; other repair/material/water F terms and contained constituents do not duplicate the whole receipt. Reclassification moves the one event without duplicated inlet/provider or deletion against closing stock. Verify inherited manufacture/service history, one burden handover, supplier-included scope and distinct incremental actual service; preserve performed original-cohort services and genuinely unused remaining vectors separately, with the sole original Q_H quotient."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: validation_uncertainty
    applies_to: "all foreground data"
    rule: "Unknown means collect/review with explicit bounds, not pass or zero. Retain missing core evidence as an applicability hold; actual site/provider/auxiliary data require collection. Engineering checks establish declared consistency only, not scientific approval, translation review, classification coverage or publication."
    source_ids:
      - ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "After independent review, component manufacture input to compatible furniture assembly; not whole furniture/installation/use service"
  allowed_use: "Declared-quantity modelling with actual species/construction/interface/uncoated state/supply gate and measurement scope matched"
  excluded_use: "Measured-site-data claims without collection; different-product functional equivalence; automatic recycling/carbon credit; review/mapping/publication claims"
  required_metadata: "Approved complete-leg drawing and revision; Fagus botanical species and legal origin; Single-piece unglued untreated solid construction; Kiln-dried sawn-stock supply gate and upstream ownership; Actual whole-part geometry and connection fit; Uncoated sanded market state; Actual mounting connector BOM and installation owner; Actual machining and sanding sequence; Moisture basis and independent sampling; Measured net complete-leg mass and calibration; Unique first-release cohort and Q; Actual dimensional/interface/surface acceptance and disposition; Raw and WIP opening/closing inherited vectors; Released FG and original-cohort service horizon H and Q_H; Failures samples zero-output idle cleanup and actual rework; Every packaging article and six actual directions; Whole supplies and disjoint constituent ownership; Asset receipt installed stock remaining service and retirement; Ordinary humidity exchange and each real water phase; Atomic air species and actual destination; Biogenic fossil and ambient carbon separation; Site period supply voltage geography and providers; All unresolved identities and uncertainty"
  required_quality_disclosure: "Performed/unperformed scope, scientific/translation pending, unknown quantities, auxiliary UUIDs/providers, source applicability, H/cohort and uncertainty"
  update_trigger: "Changed species/construction/route/connector/finish/gate/measurement/provider or native restrictions; new evidence and actual rework disposition"
data_sources:
  - id: "richman-unfinished-leg"
    type: "literature"
    reference: "Richman UK, Beech and Oak Turned Tapered Leg (M8 inserted), undated manufacturer product page; https://richmanuk.com/shop/small-products-and-accessories/beech-turned-tapered-leg-330mm-390mm-450mm-high/"
    used_for: "Individually supplied solid turned leg; unfinished but surface prepared; inserted connector example. No weight, fixed dimension, alloy or shared-factory recipe adopted."
  - id: "drewbak-components"
    type: "literature"
    reference: "Drew-Bak, Solid wood furniture components – OEM manufacturing, undated manufacturer technical page; https://www.drewbak.pl/en/solid-wood-furniture-components-oem-manufacturing/"
    used_for: "Industrial beech component turning/milling/drilling/sanding and finished-component quality/drawing scope; adjacent laminated/finger-jointed and coating alternatives excluded. No numeric recipe, moisture target or certification adopted."
  - id: "bukexpo-beech-supply"
    type: "literature"
    reference: "BukExpo, Beech furniture blanks from the manufacturer, undated manufacturer technical page; https://bukexpo.com/en.html"
    used_for: "Separate beech sawing/kiln-drying/supply-form context. Blanks are upstream, not automatically completed legs. No supplier linkage, density, yield, moisture target or kiln energy transferred."
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory, Wood handbook—wood as an engineering material, FPL-GTR-282 (2021), Chapters 4 and 13, pp.4–1 to4–3 and13–1 to13–3; https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Hygroscopic exchange; wet/oven-dry mass relationship; representative immediate weighing and oven-dry/electrical-method limitations. No generic density, moisture specification, reaction, strength or manufacturing inventory."
  - id: "ilcd-attributional-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook—General guide for Life Cycle Assessment—Detailed guidance, first edition March 2010, §§7.9.2–7.9.3, printed pp.255–272; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation-required situations only: subdivision/virtual subdivision, exchange-specific determining physical causality, then residual common-gate actual-state market value; 100% accounting and recycling limitations. No consequential substitution, fixed shares or automatic waste credit."
