allocation_rules:
  - rule_id: allocation_framework
    applies_to: "all burden vectors"
    rule: "Use attributional modelling only in situations actually requiring allocation under the cited ILCD scope. First assign dedicated operations/materials and subdivide physically or virtually by actual function. A woodturning manufacturer page supports route, not LCA allocation or a fixed share."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_causality
    applies_to: "each still-shared exchange"
    rule: "For each remaining exchange identify a determining physical causal relation, with evidence and sensitivity. Material embodiment, electricity load/time, occupied storage capacity/time and transport limiting mass/volume may differ; no blanket mass/time rule and no arbitrary physical/economic choice. Keep causal driver and burden vector separate from full physical gross mass."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_residual
    applies_to: "genuinely residual common process"
    rule: "Only if subdivision and exchange-specific causality leave a justified residual, allocate that residual at the same actual process gate and contemporary market value in each actual state/quality/quantity. Trace back later packing, conditioning and transport to that gate. Document units/currency/time, sensitivity and total-vector conservation; no fixed ratio."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_failures
    applies_to: "manufacture and treatment"
    rule: "Keep ordinary manufacturing rejects, breakage, samples, emissions and their handling/treatment burdens with the relevant manufacturing cohort even when exported/sold. T_other is permitted only for a real distinct other cohort/function and a justified one-time allocation/handover with counterpart receipt. Waste sales alone are not that evidence; recycling/true-joint-process provisions need an explicit applicable review, not automatic credit."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_service
    applies_to: "original cohort H and assets"
    rule: "Attribute only actual service over H to original cohort Q_H. Performed storage/handling/maintenance service is retained despite closing FG; carry forward only unused unassigned service/charge. Separate full physical asset stocks from actual service burden, with measured usage, new/old/repaired parts and fluids, remaining vector and no fixed life or one whole machine per kg. Stock-corrected consumption is not corrected a second time."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "finished_leg"
      record_type: "measurement"
      raw_fields: "cohort; drawing; serial or batch; configuration; actual net kg; moisture; calibration; acceptance; first release time; closing released FG"
      collection_method: "Use calibrated net whole-leg weighing excluding packaging with actual installed connector. Link actual dimension/interface/surface acceptance and first-release register; follow representative moisture sampling separately. Raw aggregation constraints: Retain raw accepted net mass and unique-release flags; sum Q once; no exchange quotient here."
      unit: "kg"
      frequency: "each complete leg and release batch"
      temporal_coverage: "whole production period including zero release"
      site_scope: "manufacturing gate and all first-release stores"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale records; drawing/BOM; acceptance register; moisture samples"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "beech_stock; mounting_stud; abrasive_paper"
      record_type: "measurement"
      raw_fields: "exchange; lot; supplier; whole article; wet received mass; opening/closing raw/WIP; return; loss; moisture; inherited vector; owner"
      collection_method: "Weigh and reconcile receipts/issues/returns and full wet stock; verify species/route/supplied whole article and disjoint constituents. Preserve original units and manufacturing stock-correction status. Raw aggregation constraints: Collect raw only; retain all real gross legs and inherited vectors; attribute before calc_quotient."
      unit: "kg"
      frequency: "each lot and period opening/closing"
      temporal_coverage: "full period incl failures/start-stop"
      site_scope: "supplier receiving and manufacturing stores"
      aggregation_rule: "per reference flow"
      quality_evidence: "receipts; scale calibration; supplier specification; stock ledger"
    - protocol_id: cp_energy_m
      process_id: "manufacture"
      flow_role: "electricity_m; compressed_air"
      record_type: "meter"
      raw_fields: "meter; exchange; initial/final readings; original unit; rate or cumulative; temperature; pressure; humidity; supply state; compressor boundary; times; cohort; H; complete external supplied V; independent actual-state whole-air density; measured nonadditive composition"
      collection_method: "Retain cumulative meters and actual rate-time series separately. Partition manufacturing/service and providers; measure real compressed-air reference conditions and leaks/condensate. Raw aggregation constraints: Raw readings only; convert original extensive units once before attribution; no division by Q here."
      unit: "MJ; kWh; m3"
      frequency: "each meter interval and event"
      temporal_coverage: "full period and observed service H"
      site_scope: "real meters and supply boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; supply contract; pressure/temperature; disjoint electricity map"
    - protocol_id: cp_energy_h
      process_id: "gate_service"
      flow_role: "electricity_h"
      record_type: "meter"
      raw_fields: "meter; exchange; initial/final readings; original unit; rate or cumulative; temperature; pressure; humidity; supply state; compressor boundary; times; cohort; H"
      collection_method: "Retain cumulative meters and actual rate-time series separately. Partition manufacturing/service and providers; measure real compressed-air reference conditions and leaks/condensate. Raw aggregation constraints: Raw readings only; convert original extensive units once before attribution; no division by Q here."
      unit: "MJ; kWh; m3"
      frequency: "each meter interval and event"
      temporal_coverage: "full period and observed service H"
      site_scope: "real meters and supply boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; supply contract; pressure/temperature; disjoint electricity map"
    - protocol_id: cp_water_m
      process_id: "manufacture"
      flow_role: "tap_water_m; wastewater_m; humidity_m_in; water_vapour_m"
      record_type: "measurement"
      raw_fields: "phase; source; destination; mass; moisture; temperature; humidity; cumulative volume; rate; substance density; opening/closing wet stocks; F_in; F_out; X_in; X_out; matched same-side OTHER event; owner"
      collection_method: "Independently measure supply/sorption/evaporation/drains and representative moisture. Weigh samples immediately with validated oven-dry method or species/temperature-calibrated electrical method; retain volatile-extractive and moisture-gradient limitations. Do not fit unknown losses with one balance residual. Raw aggregation constraints: Collect full raw phase-specific mass/state and disjoint X only; complete wet closing stock plus true influx retained; no quotient here. Independently record true F_in/F_out without residual fitting. X subtracts only documented duplicate physical quantity already in another real same-side flow, never stock, opposite-side flow, card presence or retained closing influx."
      unit: "kg; m3"
      frequency: "each relevant event plus opening/closing"
      temporal_coverage: "production and actual storage/handling H"
      site_scope: "all real wet stocks and water boundaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "paired sample masses; sampling plan; temperature/humidity; meter/calibration; receiving records"
    - protocol_id: cp_water_h
      process_id: "gate_service"
      flow_role: "humidity_h_in; water_vapour_h; tap_water_h; wastewater_h"
      record_type: "measurement"
      raw_fields: "phase; source; destination; mass; moisture; temperature; humidity; cumulative volume; rate; substance density; opening/closing wet stocks; F_in; F_out; X_in; X_out; matched same-side OTHER event; owner"
      collection_method: "Independently measure supply/sorption/evaporation/drains and representative moisture. Weigh samples immediately with validated oven-dry method or species/temperature-calibrated electrical method; retain volatile-extractive and moisture-gradient limitations. Do not fit unknown losses with one balance residual. Raw aggregation constraints: Collect full raw phase-specific mass/state and disjoint X only; complete wet closing stock plus true influx retained; no quotient here. Independently record true F_in/F_out without residual fitting. X subtracts only documented duplicate physical quantity already in another real same-side flow, never stock, opposite-side flow, card presence or retained closing influx."
      unit: "kg; m3"
      frequency: "each relevant event plus opening/closing"
      temporal_coverage: "production and actual storage/handling H"
      site_scope: "all real wet stocks and water boundaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "paired sample masses; sampling plan; temperature/humidity; meter/calibration; receiving records"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "wood_offcut; collected_wood_residue; spent_abrasive"
      record_type: "measurement"
      raw_fields: "outlet; source pool; wet mass; moisture; contaminants; receiving party; shipment; treatment; inherited burden; failure/sample origin"
      collection_method: "Weigh actual separate external outlets; one co-collected mixture has one measured outlet and disjoint source pools. Retain samples/rejects and actual treatment; no invented recycling credit. Raw aggregation constraints: Retain unnormalised gross V and independent burden ownership; total and constituent pools never add as extra exchanges."
      unit: "kg"
      frequency: "each bin and external dispatch"
      temporal_coverage: "entire production period"
      site_scope: "actual collection and receiver gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale; waste transfer; receiver treatment; composition and moisture"
    - protocol_id: cp_air_m
      process_id: "manufacture"
      flow_role: "n2_m_in; o2_m_in; ar_m_in; co2ambient_m_in; n2_m_out; o2_m_out; ar_m_out; co2ambient_m_out; beech_dust_air"
      record_type: "measurement"
      raw_fields: "species; CAS if molecular; phase; origin; compartment; inlet/outlet; concentration; actual volume or rate; time; temperature; pressure; humidity; size cuts; uncertainty"
      collection_method: "Measure each actual ordinary air species and dust. Convert independently verified gas-state mass from concentration and real integrated volume or integrate real rates; do not multiply integrated volume by duration. Preserve full inlet/outlet and disjoint supplied compressed-air bridge. Raw aggregation constraints: Raw species/size/phase only; no guessed reactions or fractions; q uses full V only in calc_quotient."
      unit: "kg; m3"
      frequency: "each measured operating/ambient interval"
      temporal_coverage: "full observed operation and H"
      site_scope: "real air intake and exhaust compartments"
      aggregation_rule: "per reference flow"
      quality_evidence: "sampling/size-cut method; calibration; state measurements; carbon origin; no nested-PM sum"
    - protocol_id: cp_air_h
      process_id: "gate_service"
      flow_role: "n2_h_in; o2_h_in; ar_h_in; co2ambient_h_in; n2_h_out; o2_h_out; ar_h_out; co2ambient_h_out"
      record_type: "measurement"
      raw_fields: "species; CAS if molecular; phase; origin; compartment; inlet/outlet; concentration; actual volume or rate; time; temperature; pressure; humidity; size cuts; uncertainty"
      collection_method: "Measure each actual ordinary air species and dust. Convert independently verified gas-state mass from concentration and real integrated volume or integrate real rates; do not multiply integrated volume by duration. Preserve full inlet/outlet and disjoint supplied compressed-air bridge. Raw aggregation constraints: Raw species/size/phase only; no guessed reactions or fractions; q uses full V only in calc_quotient."
      unit: "kg; m3"
      frequency: "each measured operating/ambient interval"
      temporal_coverage: "full observed operation and H"
      site_scope: "real air intake and exhaust compartments"
      aggregation_rule: "per reference flow"
      quality_evidence: "sampling/size-cut method; calibration; state measurements; carbon origin; no nested-PM sum"
    - protocol_id: cp_packaging
      process_id: "gate_service"
      flow_role: "carton; film; pallet; mixed_packaging_waste"
      record_type: "measurement"
      raw_fields: "article; material pool; direction P/I/ER/S/EO/W; whole wet mass; empty/attached-WIP/attached-FG/reusable opening/closing; F_in; F_out; X_in; X_out; matched same-side OTHER event; owner; source pool; mixed outlet; H; Q_H ; packaging receipt origin; payment/non-purchase evidence; owner/custodian; same-item prior outward ID; article or auditable-batch ID and membership; original boundary and cohort; prior S/EO event ID/date; return receipt ID/date; earlier-period/offsite custody history; independently measured returned wet mass/state; first nonpurchase or replacement identity; unresolved history or payment status; atomic I or provisional F_in row/event ID and separate Amount; previous-owner burden receipt; inherited manufacture/service vector and remaining unused service; supplier-included scope and distinct incremental service"
      collection_method: "Weigh all six real external events for each actual article. Supplier-included I remains physical ingress with one upstream owner. Record disjoint mixed-outlet component pools; do not add their W cards to the one actual mixed Waste. Raw aggregation constraints: Collect full gross raw V by each leg; no stock correction or allocation on gross cards; independent burden service ledger; no division here. Independently record true F_in/F_out without residual fitting. X subtracts only documented duplicate physical quantity already in another real same-side flow, never stock, opposite-side flow, card presence or retained closing influx.  For packaging only, apply packaging_receipt_basis; standalone non-purchase is I, never invented ER or X. Qualify each ER by the same-article/batch prior S/EO and linked receipt history, with traceable membership, original boundary/cohort and earlier-period/offsite custody where necessary; match identity and state independently of mass equality. Earlier use elsewhere, the same UUID/material, equal mass or a burden handover alone is insufficient. Independently weigh actual returned wet mass/state rather than copying outward mass. Apply packaging_receipt_basis: proven paid receipts are P; proven first non-purchased/replacement whole articles, new or previously used elsewhere, are I; only qualified same-item returns are ER. If history or paid/non-purchased status cannot establish one category, keep one full measured provisional atomic whole-article F_in, with an explicit evidence gap requiring resolution before dataset acceptance. For each actual carton, film or pallet, use one independent row/event ID, its physically specific flow identity and complete native restrictions, never a packaging aggregate or invented UUID. For proven I, use the existing matching atomic I card; for provisional F_in, retain its own atomic receipt record before dataset use. Both require the complete Amount chain: expression A / Q with A = V, the full independently measured received wet kg, and Q = original Q_H through calc_quotient only; value_mode calculated_value; specificity site_specific; basis text per 1 kg reference flow and kind reference_flow; evidence kind calculated_from_collection, collection_protocol_id cp_packaging, source_ids [ilcd-attributional-2010]; ranges empty unless independently supported. Raw collection here never divides. P, I, qualified ER and provisional whole-article F_in classify each receipt exclusively; move the same provisional event to its one final P/I/ER category without a second receipt or provider burden. Separate whole received mass from other repair/new-material/water F terms; contained constituents stay subledgers, never second inlets. Retain one documented previous-owner/supplier burden handover independently of physical V; nonpurchase does not imply zero or another manufacture charge. Keep inherited manufacturing/service vectors and genuinely unused service separate from actual performed original-cohort service. Supplier-included transport/handling/service is not procured again; distinct actual incremental service remains assigned once to its proper original cohort Q_H over H, even for closing FG. Full wet closing stock retains articles still held and never cancels their actual inlet."
      unit: "kg"
      frequency: "every receipt/shipment/return/discard and opening/closing"
      temporal_coverage: "original cohort actual horizon H"
      site_scope: "empty stores WIP FG reusable custody and real receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "six-leg ledger; scales; stock/repair/water bridge; one provider/treatment receipt; source pools; same-article/batch outward-to-return links; custody/member register; independently weighed receipt/state; first-receipt or unresolved-history/payment record; atomic I/provisional F_in complete Amount and single burden owner; inherited vector handover and disjoint included/incremental service evidence"
    - protocol_id: cp_asset_m
      process_id: "manufacture"
      flow_role: "lubricant; cutting_insert_new; cutting_insert_old_in; lathe_new; lathe_old_in; lathe_service; discarded_insert; discarded_lathe; used_oil; tool_reusable_out; lathe_reusable_out"
      record_type: "measurement"
      raw_fields: "asset or single part; new/used/repair identity; original/remaining vector; wet mass; installed fluid; opening/closing; true influx/outflow; service hours; capacity; failures/idle; unused charges; owner; H; manufacturing cohort; unique manufacturing first-release Q; observation H"
      collection_method: "Keep full machine/insert/fluid/material custody and new/old parts independently from embodied service vector. Actual usage and demonstrated service capability determine allocation; retain real additions and full closing mass simultaneously. Add every real new repair atom; do not use metal lathe as wood lathe. Raw aggregation constraints: Collect unnormalised gross physical legs and usage; separately assign actual service and carry only unused/unassigned vector; never divide here. Manufacturing capacity is attributed to the corresponding manufacturing first-release Q; actual postrelease service belongs to its original Q_H in a separate service account. H is observation, never another divisor."
      unit: "kg; h"
      frequency: "each service/receipt/repair/removal and stock date"
      temporal_coverage: "whole manufacturing period and actual H"
      site_scope: "all owned/leased assets and installed stocks"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; supplier/maintenance BOM; calibration; usage history; counterpart vector receipts"
    - protocol_id: cp_asset_h
      process_id: "gate_service"
      flow_role: "pallet_repair_wood; pallet_repair_nail; removed_pallet_wood; removed_pallet_nail"
      record_type: "measurement"
      raw_fields: "asset or single part; new/used/repair identity; original/remaining vector; wet mass; installed fluid; opening/closing; true influx/outflow; service hours; capacity; failures/idle; unused charges; owner; H"
      collection_method: "Keep full machine/insert/fluid/material custody and new/old parts independently from embodied service vector. Actual usage and demonstrated service capability determine allocation; retain real additions and full closing mass simultaneously. Add every real new repair atom; do not use metal lathe as wood lathe. Raw aggregation constraints: Collect unnormalised gross physical legs and usage; separately assign actual service and carry only unused/unassigned vector; never divide here."
      unit: "kg; h"
      frequency: "each service/receipt/repair/removal and stock date"
      temporal_coverage: "whole manufacturing period and actual H"
      site_scope: "all owned/leased assets and installed stocks"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; supplier/maintenance BOM; calibration; usage history; counterpart vector receipts"
    - protocol_id: cp_transport
      process_id: "manufacture"
      flow_role: "inbound_freight"
      record_type: "record"
      raw_fields: "real road leg; distance; cargo wet gross kg; load/volume limit; empty return; provider; included supply scope; original unit"
      collection_method: "Use actual transport documents and measured loads for each distinct provider/leg; retain packaging in gross load. Verify provider coverage and avoid duplicating driver fuel or included transport. Raw aggregation constraints: Collect raw mass and distance; actual workload and allocation before sole quotient; no default distance/loading."
      unit: "kg*km; t*km"
      frequency: "each road leg"
      temporal_coverage: "entire supply period"
      site_scope: "supplier to actual receiving gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighbridge; consignment; distance/route; load and provider evidence"
    - protocol_id: cp_fg
      process_id: "gate_service"
      flow_role: "fg_dispatch; fg_return; fg_discard"
      record_type: "measurement"
      raw_fields: "original release/cohort; original Q_H; H; full wet opening/closing FG; actual G/R; original shipment link; intact/damaged/fragment state; new work; permission; tests; acceptance; hold/waste; inherited vectors"
      collection_method: "Weigh full original-cohort gross dispatch/return/discard and all opening/closing wet FG; link original release and shipment. Record new losses/water/work separately; failed/unauthorised work retains actual loads and disposition, without presumed safe restoration. No net-delivery denominator or return-mass reversal of original first release."
      unit: "kg; original test units"
      frequency: "each event and opening/closing"
      temporal_coverage: "actual original-cohort H"
      site_scope: "manufacturing FG to actual receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "release/dispatch/return tickets; scale; work/spec permission; posttests; disposition"
  calculation_rules:
    - id: calc_raw_units
      applies_to: "all inventory rows"
      rule: "U is original unnormalised activity after one legitimate unit conversion. Cumulative kWh ×3.6 gives electrical MJ; t*km ×1000 gives kg*km. For concentration use measured cumulative volume once; integrate only an actual rate. Density is independently measured for the actual substance/state. No default heat/water conversion."
      inputs:
        - "raw records"
        - "calibrated units"
        - state
      output: "U"
      source_ids:
        - usda-wood-handbook-2021
    - id: calc_manufacturing
      applies_to: "all inventory rows"
      rule: "For the burden dimension only, A = B_open + U_attributed - B_close - T_other. B_open/B_close are exchange-specific inherited vectors in raw/WIP and unused unassigned charges; closing released FG is excluded. T_other needs a real distinct other function/cohort plus justified one-time handover; ordinary waste/reject/sample sales are not T_other. If U is already stock-corrected consumption, set corresponding stock terms to zero after documented reconciliation; never correct twice. This rule is not applied to physical gross cards."
      inputs:
        - B_open
        - U_attributed
        - B_close
        - T_other
      output: "A"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_service
      applies_to: "all inventory rows"
      rule: "For an actual service account H, A is the actually performed original-cohort service plus prior assigned service vector used in H, after justified sharing and single ownership; Q denotes original Q_H. Closing released FG never reverses performed service. Only unused/unassigned charge/service vector is carried forward; asset embodiment is assigned by real capacity/use, not full purchase mass per kg. Keep service physical mass and inherited manufacturing vector separately."
      inputs:
        - H
        - Q_H
        - "actual service"
        - "asset vectors"
        - "unused unassigned charges"
      output: "A"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_gross
      applies_to: "all inventory rows"
      rule: "For every card explicitly marked gross, A = V, the actual complete external physical leg in native extensive units. No B_open+U-B_close, economic share, allocated burden, net delivered mass or stock retention modifies V. Physical X terms remove only overlap with another real inlet/outlet. Gross q is disclosure only and never automatically multiplied by a second supplier/treatment burden or credited; the true burden dimension is assigned once independently."
      inputs:
        - V
        - "real direction"
        - "disjoint source pools"
      output: "A"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_quotient
      applies_to: "all inventory rows"
      rule: "q = A / Q. Apply this sole division once after calc_raw_units and the one applicable burden/service or gross numerator rule. Manufacturing Q is unique first-release net kg; service/gross service accounts use original Q_H for observed H. Reference output is exactly 1 kg. For Q=0 retain A and V and report no unit q; no artificial zero. Cards and collection aggregation refer to this same q and never divide it again."
      inputs:
        - A
        - Q
        - Q_H
        - H
      output: "q"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_packaging_balance
      applies_to: "all inventory rows"
      rule: "For each whole packaging material pool: O + P + I + ER + F_in - X_in = C + S + EO + W + F_out - X_out. O/C include full wet empty, attached-WIP, attached-FG and reusable stocks; S is gross physical shipment, not net Q. P/I partition the same received article mutually exclusively. Independently measure actual repair/new-material and ordinary moisture/water-phase F_in/F_out; do not fit them from a residual. X removes only a proven duplicate already present in an OTHER real same-side flow term with matched event identity, never stock, opposite-side flow, card presence or closing retention. True retained new influx and full wet C both remain. Internal handovers cancel. One real mixed outlet uses one measured whole Waste/provider, with disjoint measured W source pools summing within uncertainty; total and component exchanges do not add. ER is permitted only for the linked same-article/auditable-batch prior S/EO from this boundary and original cohort; independently measure actual returned wet mass/state, not copied outward mass. Proven first external non-purchased/replacement whole articles use I under packaging_receipt_basis, with the independent atomic row/event and complete Amount/collection chain in cp_packaging, not an additional final whole-article F_in. Unknown history or paid/non-purchased status remains one explicitly provisional measured whole-article F_in pending evidence and final P/I/ER classification, mutually exclusive with those categories and disjoint from other repair/material/water F terms. Earlier use elsewhere is not return history. Reclassification moves that one event and its single burden handover, never adds another physical receipt/provider burden. Retention in full wet C never removes the actual inlet; the existing same-side duplicate-only X conditions still apply."
      inputs:
        - O
        - P
        - I
        - ER
        - C
        - S
        - EO
        - W
        - F_in
        - F_out
        - X_in
        - X_out
      output: "physical balance"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_physical
      applies_to: "all inventory rows"
      rule: "At each manufacturing/FG/consolidated gate, opening full wet stock + all actual external inflows = closing full wet stock + all actual external outflows, allowing only independently established transformations and measurement uncertainty. Internal transfers cancel. Wet wood = independently established dry wood + measured wood water; u = (wet-dry)/dry and dry = wet/(1+u) only for the isolated wood fraction. Do not subtract attached connector/abrasive mass twice. Preserve each relevant elemental balance and carbon origin separately; no single-residual fit of water and species."
      inputs:
        - "full wet O"
        - "full wet C"
        - "gross inflows"
        - "gross outflows"
        - "measured phases and elements"
      output: "physical balance"
      source_ids:
        - usda-wood-handbook-2021
