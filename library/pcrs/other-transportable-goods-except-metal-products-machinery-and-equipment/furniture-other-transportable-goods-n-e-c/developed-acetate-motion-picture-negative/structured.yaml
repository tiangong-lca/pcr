      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Purchased complete unexposed coated5222 stock at receiving interface; actual exposure and lab locations explicitly linked. |\n| starting_condition_role | intermediate_product |\n| product_classification_scope | Exposed and developed 35 mm black-and-white acetate motion-picture camera negative |\n| recursive_input_rule | A returned developed film retains its original cohort and history; it is not virgin raw stock or new first-release output. No recursive reuse of finished-film UUID as unexposed supply. |\n| upstream_dataset_requirement | Complete raw-film base/coating/finishing; each actual supplied chemical/formulation; conditioning/transport; utilities; camera/processor and real auxiliaries; packaging; actual waste transport/treatment. Resolve provider native basis separately from identity. |\n| disclosure | Separate exposure and processing sites if different; no same-factory claim. State first-release gate, process variants, excluded downstream functions, supplier coverage, real treatment topology and unresolved data. |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_full | p_motion | Include real raw-film receipt/conditioning, camera loading/exposure and all attempts, dark transport and hold, solution preparation and adjustment, continuous development/fixing/washing, drying/cooling, leader changes, tests, failures, idle/start/stop, cleaning, rewash/rework and first acceptance. Link separately located precursor stages; never truncate the process to packing bought developed film. | kodak-h24-negative |\n| boundary_gate | finished_film | Q is newly first-released net film during the reporting cohort, not net deliveries. Current-cohort closingFG already belongs to Q and is not another manufacturing output. OpeningFG is historical. Product returns and repeat inspection do not create Q. A quality reversal corrects the original cohort explicitly; genuinely incremental rework has its own burden history. |  |\n| boundary_service | p_motion | Retain executed storage, handling, packaging and dispatch after first release. Assign actual service raw loads to original cohorts Qc within observed horizon H; H describes observation and is not an additional divisor. Combine manufacturing and service only for matched cohorts/horizons and cancel internal Q transfers. No second production from dispatch; no repeated original production burden on return. |  |\n| boundary_water_heat | water; electricity | Internal bath circulation and fixer-laden wash diversion cancel at equal physical quantities. Do not assume steam or a boiler. If real external heat, steam, condensate return or cooling water crosses the boundary, add separate named Product input/return rows with actual thermal state/enthalpy, mass and supplier water/energy ownership; close heat and water balances without duplicate supply. | kodak-h24-negative |\n| boundary_waste | all waste rows | Export each actual terminal wet consignment once. When physically commingled, mixed_effluent owns one total/provider and corresponding originW baths/washes remain non-additive composition/provenance measurements. Do not add independent component Ag/water exports, assume on-site recovery, substitute silver species, or duplicate downstream treatment as site elementary emissions. Real releases/failures stay recorded regardless of expected compliance. | kodak-h24-environment |\n| boundary_extend | p_motion | Before completeness survey all actual reagents, sample analyses, gloves, membranes, lamps, batteries, lubricants, filters, cleaners, packaging, heat/cooling, transport and emission species. Add each real distinct chemical/article/fuel/refrigerant/waste/elementary species separately with original conditions; no generic other flow or unmeasured zero. Ordinary missing auxiliary identity or supplier quantities are data gaps, not a changed core product. |  |\n\n"
