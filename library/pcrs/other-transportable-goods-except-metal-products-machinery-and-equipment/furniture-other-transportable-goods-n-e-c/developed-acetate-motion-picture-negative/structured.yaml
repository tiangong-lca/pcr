      collection_method: "Use traceable measured asset mass and real service/use records; allocate dedicated then shared manufacture/maintenance burdens with section7 evidence. Record remaining service and uncertainty; no generic camera or processor lifetime. Separate operating activity and physical custody from amortized burden. Installed capital remains in a separate opening/receipt/closing/retirement asset ledger; allocated kg-equivalent manufacture activity is not a material receipt in the film/solution mass gate. Collect undivided raw observations; preserve per-row vector/cohort identity. Refer to normalize_campaign once only after ledger reconciliation and attribution; do not predivide here. Apply v_full_fleet to the entire real configured fleet and reusable article history. Keep integrated-versus-separate systems exclusive. Whole physical assets/contaminated articles are independent of attributed service, and real supplier-owned assets remain complete in that provider."
