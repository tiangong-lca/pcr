  - id: bridge
    applies_to: "raw_film; finished_film"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For each homogeneous stock/state/configuration measure paired net film mass M and actual length L or true perforated material area S, with traceable sample/cohort coverage. Use measured M/L or M/S only within that scope. Subtract actual perforation/removed material when deriving S; no envelope width×length assumption, theoretical density, thickness-derived mass, frame count or projection-time replacement. Separate raw and processed bridges."
  - id: wet_supply
    applies_to: "all material and waste rows"
    required_property_ref:
