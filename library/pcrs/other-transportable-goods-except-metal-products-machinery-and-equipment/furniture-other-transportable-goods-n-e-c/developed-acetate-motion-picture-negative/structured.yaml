      uuid: ""
    required_unit: "kg"
    rule: "Whole supplied solution/salt/wet waste first; assay, free water, crystallization water, elemental Ag and actual species are non-additive subledgers. Volume converts by independently measured density of that actual liquid at recorded state. Never infer density from a secondary native property."
