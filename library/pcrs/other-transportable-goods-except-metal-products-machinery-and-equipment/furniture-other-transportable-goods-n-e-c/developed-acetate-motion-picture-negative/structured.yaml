allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "This is an attributional study restricted to cases where allocation is required under the declared study goal. It neither selects consequential substitution nor claims all ILCD situations. Industrial process sources support chemistry, not LCA allocation."
    source_ids: []
  - rule_id: allocation_subdivide
    applies_to: "p_motion"
    rule: "Assign dedicated measured jobs first. Investigate actual and feasible virtual subdivision of exposure, bath control, test, dryer, cleaning, conditioning, assets and later service. Preserve failed attempts and startup/idle loads in the causal cohort. Do not discard failed or zero-output periods."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_causality
    applies_to: "remaining shared exchanges"
    rule: "For every residual exchange establish the determining physical relation: how changing each output/function changes that input/output. Tested measured transport occupancy, solution demand, heater load or equipment use may govern different exchanges; neither film mass, area nor length is a universal key. Distinguish process-related and product-related burdens and disclose model evidence/sensitivity."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "only unresolved common-process burdens"
    rule: "Only after those steps use contemporaneous actual market values at the same common-process gate, physical condition and bulk state. Derive gate values by removing separately incurred downstream conditioning/packing/transport where needed. Do not use raw-stock catalogue prices as developed-film values, arbitrary shares, optional physical/economic choice or a negative-price credit rule."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_physical
    applies_to: "all inventory rows"
    rule: "Burden shares affect environmental attribution vectors, not measured physical film, wet effluent, species, packaging or recovered output quantities. Actual waste treatment consumes gross V in the provider native unit, normalized against Q or Qc independently of economic shares and stock bookkeeping. Recovery/sale alone gives no substitution credit or automatic coproduct."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_finished
      process_id: "p_motion"
      flow_role: "finished_film"
      record_type: "collected_record"
      raw_fields: "roll/cohort IDs; first-release timestamps; gross weight; each tare; net Q; moisture/temperature; measured length/area; raw/exposed/wet/dry WIP; historical and new FG; tests/rejects; returns; actual quality criteria/results; original q0,c event ID/time/gate; original Q0,c; disjoint remaining deliveries/on-site accepted states/irreversible losses/other dispositions; gross reversal genealogy; actual wet-state to original acceptance bridge"
      collection_method: "Calibrated same-state net film weighing and paired independent length/true-area measurement with actual perforations. Match identity, image sequence, densitometry, fixing/washing, dry state and physical-defect acceptance. Maintain first-release event ledger and rework/reversal lineage; no inferred mass from roll length. Collect undivided raw observations; preserve per-row vector/cohort identity. Refer to normalize_campaign once only after ledger reconciliation and attribution; do not predivide here. Lock the original first-acceptance event basis independently of physical wet stocks. Reconcile every original fate under v_full_q0 and preserve current moisture/chemical changes separately; no gross loop or repeat test creates Q."
      unit: "kg"
      frequency: "Each actual lot/event; time-matched meter and species samples."
      temporal_coverage: "Complete declared production interval, all failures/idle/cleanup and opening/closing histories; service H separately."
      site_scope: "Actual linked exposure and processing sites with compatible configuration."
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source receipts; actual specifications/SDS; raw batch/quality logs; stock and receiver documents; uncertainty and missing-data record."
    - protocol_id: cp_materials
      process_id: "p_motion"
      flow_role: "raw_film; elon; sulfite; hydroquinone; bromide; borax; thiosulfate; acetic_solution; boric; potassium_alum; leader; splice; filter; wipe"
      record_type: "collected_record"
      raw_fields: "each supplied article/chemical ID and form; receipts/issues/returns; actual wet mass; assay; carrier/crystal water; density/state; raw/nonWIP/WIP stocks; batch preparation/adjustment; losses; native provider basis; whole supplied form/hydrate/assay; individual external receipt; actual on-site solution preparation owner; raw-film/nonWIP solution/WIP/FG opening and closing wet pools; inherited own vectors; full embedded provider or complete decomposition scope"
      collection_method: "Weigh each actual complete supplied chemical or film. Reconcile procurement and inventories once, retain actual D-96/D-96R/F-5 recipe/control records, use manufacturer identities only and independently measure concentrations/densities. Mark already-net issue/use records explicitly so stock changes are not applied twice; retain every failure and expired/cleaned-out solution. Collect undivided raw observations; preserve per-row vector/cohort identity. Refer to normalize_campaign once only after ledger reconciliation and attribution; do not predivide here. Preserve every physical preparation/stock transfer separately from inherited environmental vectors. No purchased complete formulation plus its same embedded ingredient purchase, and no paper upstream for actual on-site preparation. Actual actual chemical/mixture quantities and supplier data remain distinct."
      unit: "kg"
      frequency: "Each actual lot/event; time-matched meter and species samples."
      temporal_coverage: "Complete declared production interval, all failures/idle/cleanup and opening/closing histories; service H separately."
      site_scope: "Actual linked exposure and processing sites with compatible configuration."
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source receipts; actual specifications/SDS; raw batch/quality logs; stock and receiver documents; uncertainty and missing-data record."
    - protocol_id: cp_water
      process_id: "p_motion"
      flow_role: "water"
      record_type: "collected_record"
      raw_fields: "external meter; integrated volume or actual rate/time; liquid-specific density/state; formulation water; hydrate water; countercurrent/handoff volumes; film/bath/waste moisture; cooling/condensate/return states"
