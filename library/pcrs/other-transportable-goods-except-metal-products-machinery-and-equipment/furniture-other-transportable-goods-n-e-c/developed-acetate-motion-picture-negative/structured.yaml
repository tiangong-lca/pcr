system_boundary:
  rules:
    - rule_id: boundary_full
      applies_to: "p_motion"
      rule: "Include real raw-film receipt/conditioning, camera loading/exposure and all attempts, dark transport and hold, solution preparation and adjustment, continuous development/fixing/washing, drying/cooling, leader changes, tests, failures, idle/start/stop, cleaning, rewash/rework and first acceptance. Link separately located precursor stages; never truncate the process to packing bought developed film."
      source_ids:
        - kodak-h24-negative
    - rule_id: boundary_gate
      applies_to: "finished_film"
      rule: "Q is newly first-released net film during the reporting cohort, not net deliveries. Current-cohort closingFG already belongs to Q and is not another manufacturing output. OpeningFG is historical. Product returns and repeat inspection do not create Q. A quality reversal corrects the original cohort explicitly; genuinely incremental rework has its own burden history."
      source_ids: []
    - rule_id: boundary_service
      applies_to: "p_motion"
      rule: "Retain executed storage, handling, packaging and dispatch after first release. Assign actual service raw loads to original cohorts Qc within observed horizon H; H describes observation and is not an additional divisor. Combine manufacturing and service only for matched cohorts/horizons and cancel internal Q transfers. No second production from dispatch; no repeated original production burden on return."
      source_ids: []
    - rule_id: boundary_water_heat
      applies_to: "water; electricity"
      rule: "Internal bath circulation and fixer-laden wash diversion cancel at equal physical quantities. Do not assume steam or a boiler. If real external heat, steam, condensate return or cooling water crosses the boundary, add separate named Product input/return rows with actual thermal state/enthalpy, mass and supplier water/energy ownership; close heat and water balances without duplicate supply."
      source_ids:
        - kodak-h24-negative
    - rule_id: boundary_waste
      applies_to: "all waste rows"
      rule: "Export each actual terminal wet consignment once. When physically commingled, mixed_effluent owns one total/provider and corresponding originW baths/washes remain non-additive composition/provenance measurements. Do not add independent component Ag/water exports, assume on-site recovery, substitute silver species, or duplicate downstream treatment as site elementary emissions. Real releases/failures stay recorded regardless of expected compliance."
      source_ids:
        - kodak-h24-environment
    - rule_id: boundary_extend
      applies_to: "p_motion"
      rule: "Before completeness survey all actual reagents, sample analyses, gloves, membranes, lamps, batteries, lubricants, filters, cleaners, packaging, heat/cooling, transport and emission species. Add each real distinct chemical/article/fuel/refrigerant/waste/elementary species separately with original conditions; no generic other flow or unmeasured zero. Ordinary missing auxiliary identity or supplier quantities are data gaps, not a changed core product."
      source_ids: []
