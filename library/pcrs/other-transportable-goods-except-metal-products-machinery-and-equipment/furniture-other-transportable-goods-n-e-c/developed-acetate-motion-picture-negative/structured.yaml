          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| validate_terminal | finished_film | Verify unique newly first-released complete5222 35mm BH-1866 grey-acetate moving-image negative without sound, after actual development/fix/wash/dry acceptance. Native family, chosen inventory reference, quantity, qualifiers and bilingual definitions must agree. Latent/still/colour/reversal or digital substitutes fail this applicability. | kodak-doublex-2022; kodak-format-2026 |\n| validate_accounting | all inventory rows | Verify raw unit conversions, actual attribution, exactly one A/Q division, Q0 retention, WIP/nonWIP inherited vectors, first-release FG treatment, service Qc/H and cancellation of internal handoffs. Physical gross V/provider units remain independent of allocation and inventory correction. | ilcd-allocation-2010 |\n| validate_chemistry | p_motion | Check exact supplied formulation or individual reagent procurement without overlap; free/crystal/reaction water; independent total mass/element/species observations; whole-wet-waste ownership; actual downstream receiver. Reject two-unknown residual fits, assumed Ag species, doubled liquid routes and automatic recovery credits. | kodak-h24-negative; kodak-h24-environment |\n| validate_packages | cp_pack | Close every package component ledger over empty/attached/reusable stock, external receipts/returns, gross dispatch and waste. Internal reuse is not Q, new purchase or coproduct; physically present additional components require individual rows. |  |\n| validate_completeness | p_motion | A valid projection/check does not establish scientific or translation approval, accepted mapping, actual factory applicability or complete dataset values. Preserve every unresolved identity/provider/quantity/species/measurement gap with impact. A true missing central terminal/process remains a core hold; ordinary future data are collection obligations. |  |\n\n\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| v_full_original_scope_1 | p_motion | This methodology covers one actual physical terminal: a complete exposed and chemically developed, fixed, washed, dried and cooled black-and-white motion-picture camera negative, without soundtrack, on grey acetate safety base. The selected stock is EASTMAN DOUBLE-X5222 in35mm DXN718 BH-1866 on-core format. Start with purchased complete unexposed coated film; include its actual camera exposure and dark handling, then continuous D-96/D-96R development, stop rinse using the actual final-wash diversion, F-5 fixation, countercurrent washing, drying, winding, inspection and first quality release. Sources kodak-doublex-2022, kodak-format-2026 and kodak-h24-negative support this transparent technical synthesis; they are not one factory or one contemporary order. | kodak-doublex-2022; kodak-format-2026; kodak-h24-negative; kodak-h24-environment |\n| v_full_original_scope_2 | p_motion | Select on-site bulk preparation of D-96/D-96R and F-5 from the individually supplied materials below. Select anhydrous potassium bromide, decahydrate borax, anhydrous sodium thiosulfate, supplied28% acetic solution, crystalline boric acid and potassium alum. Record actual specification/assay and batch mixing; no table dose, replenishment, exposure, temperature, time, density, silver fraction, thickness, mass, yield, energy, emission or life is an inventory default. Complete premixed commercial developer/fixer supply is a different procurement boundary: it replaces those ingredient purchases with one full supplied formulation and retains only separately purchased water/chemicals and real site work. Do not sum both. | kodak-doublex-2022; kodak-format-2026; kodak-h24-negative; kodak-h24-environment |\n| v_full_original_scope_3 | p_motion | The selected waste interface collects actual liquid/sediment consignments for compatible external treatment or recovery; no on-site desilvering, bleach, direct outfall or automatic credit is assumed. Include any real required treatment before claiming dataset completeness. Exclude latent unprocessed film as terminal, unexposed film, still photographic negatives, paper prints,16mm7222, positive D-97, reversal, colour ECN/ECP, digital DCP, magnetic tape, soundtrack manufacture and film coating on site. Do not force an incompatible actual route into this method. Subsequent scanning/printing/projection/creative services and archival use are separate functions; executed storage/handling/pack-out to actual dispatch remains in a separately reported service account. | kodak-doublex-2022; kodak-format-2026; kodak-h24-negative; kodak-h24-environment |\n| v_full_original_native_admission | p_motion | Declare every qualifier in consumable data-package metadata or reference/process comments. The native film family confirms finished developed film identity only; the narrower support, format, route and acceptance are additional mandatory conditions, not properties inferred from classification. |  |\n| v_full_original_inventory_preamble | p_motion | Every row below is one atomic physical exchange. Its whole supplied/wet mass and true destination are separate from non-additive constituent assays. Preserve per-stage/campaign/custody records even when reporting one combined process. Conditional absent rows require positive absence evidence; actual additional flows must be added, not hidden. Each supplier dataset is linked once with its exact compatible activity basis. |  |\n| v_full_q0 | p_motion | At the one fixed first-quality-acceptance gate, lock every newly accepted net complete film event q0,c and Q0,c once. Q for the manufacturing cohort is the sum of its unique new acceptance events; exposure attempts, rewash, returns, reinspection, storage and dispatch create no second acceptance. Reconcile each original Q0,c into disjoint net remaining delivered quantity, all remaining accepted on-site states, irreversible postgate losses and other terminal dispositions on the original acceptance basis. Keep every original fate, including destructively tested, destroyed, rejected after acceptance and transferred film; gross outward/return loops are traced and netted within a fate, not added as terminal quantities. Record actual present wet mass separately from the original event-basis bridge. Never restore removed water or material into the surviving film and count the same removal again as loss. If a genuine erroneous original acceptance is corrected, retain the original event, explicit correction and history; do not silently relabel a later event as the original first gate. |  |\n| v_full_stocks | p_motion | Maintain three independent accounts: all physical raw film, separate chemicals, prepared nonWIP solutions, exposed/developing WIP, released FG, articles and equipment in their actual wet states; each original cohort environmental exchange vector; and unique acceptance events Q0. Record opening, receipts, actual internal transfers, transformations, closing and every external fate for each physical pool. Sum only disjoint actual physical interfaces; Q0 is an event account and is not an extra external mass output. Manufacture-to-FG is an actual state-specific transfer, whose present quantity may differ from original Q0 after water/chemical changes; use a recorded bridge rather than forcing the number Q into a wet mass equation. Cancel equal internal transfers when combining boundaries. Relevant Ag/C/S/Br/B/O/H conservation is independent of whole mass; reacting molecular species have separately evidenced formation G and consumption C, never default species conservation or fabricated closure matter. | kodak-h24-negative; kodak-h24-environment |\n| v_full_inherit | p_motion | Carry own inherited raw/WIP/nonWIP exchange vectors once from original physical provenance into actual successor cohorts, including failed, idle, cleaning and unreleased histories. A purchased complete prepared chemical, raw film or utility provider carries its complete actual upstream production and transport once: either retain the matched full provider inventory or explicitly decompose its real ingredients/operations with complete quantities and remaining burdens; never add both embedded inventory and its component history. On-site preparation is not a purchase of the same complete solution. Every unknown historical vector or unmatched provider quantity remains unresolved and cannot become zero. Closing accepted FG already owns its original manufacture; performed postgate services add only incremental service vectors to original Q0,c, observed within H, without dividing by H or replacing Q0,c by current dispatch. | ilcd-allocation-2010 |\n| v_full_pack | p_motion | For each physically identified package article and wet-pool definition use the literal equation F_open + P + I + ER_in + J_in + H2O_in + C_in + O_in - X_in = F_close + S_gross + EO_out + W_whole + J_out + H2O_out + C_out + O_out - X_out. F includes every empty, attached raw/WIP/FG and reusable stock at actual state; P is new separately purchased package, I actual package entering with supplied film/chemicals, ER_in a real external return received, S_gross actual gross outward delivery, EO_out a real return outward and W_whole one actual whole contaminated waste transfer. Each whole leg already includes its nested contents/water once. J and H2O are only separately measured genuine nonnested contamination/material and water increments or losses; omit the separate increment if already inside a whole leg. C records genuine paired changes of the declared pool, not invented matter. O is a sum of individually named actual atomic other interfaces with event IDs, never a residual basket. X removes only demonstrated same-side OTHER overlap already counted in another same-side observation; never subtract a real independent P/I/ER/S/EO/W/J/H2O/C or stock, and never an opposite-side transfer. Internal reuse cancels. Supplier-bundled manufacture burden may already be included, but actual incoming package custody is still I; do not buy that article again or earn a product credit. |  |\n| v_full_fleet | p_motion | For every real configured camera, processor, separate mixing/conditioning/ventilation/drying/test instrument and reusable leader/filter/cloth/container fleet, preserve full physical opening/receipt/return/retirement/closing and actual configuration/component nesting. Integrated processor dryer or pump is not also bought as a separate whole machine; supplier-owned assets stay with the complete real provider. Separate original article manufacture/maintenance/washing/end-of-life history from operating utilities and attributed service activity. Use actual measured M, actual observed use/coverage and compatible provider reference unit; kg-equivalent asset service is not a fresh physical receipt. No universal M, use count, capacity, useful life or automatic straight-line share. Returned/reused stock retains original history; whole contaminated cloth/filter/leader waste includes substrate, retained chemicals/solids and water once; nested component measurements are not separate waste exports unless actually physically separated. | kodak-h24-negative; ilcd-allocation-2010 |\n| v_full_qt | p_motion | For one real terminal whole wet waste event t preserve Qt as full recipient-transferred mass, actual custody, retained stock, shipping/receiver documents, real transport/treatment/recovery chain and compatible measured provider activity Ut. Convert Qt to Ut only by the actual provider definition and measured matching state, never assumed water density/dry fraction. Keep Qt/Ut once in the physical receiver account. Separately attribute each original cohort disjoint environmental service vector A_i,c from its actual contribution/coverage and retained history, then normalize by that cohort original Q0,c once. Shares of a common service vector do not shrink Qt or repeat full Ut in every cohort. A shared contaminated article remains one physical transfer even if its old substrate, current retained liquor and earlier services belong to different cohorts. Unknown assignment keeps full physical event plus unresolved attribution. If baths/washes are actually commingled, their origin measurements are non-additive provenance; mixed_effluent alone owns that full terminal mass/provider. Physically segregated real baths own separate events instead; never both exports. | kodak-h24-environment; ilcd-allocation-2010 |\n| v_full_prep | p_motion | The actual adopted preparation boundary is on-site D-96/D-96R and F-5, each prepared from actual supplied individual chemicals in its stated form and measured water. Retain full mixing/temperature-control equipment, utilities, adjustment, sampling, spills, filters, aged solution, carried-over liquid and cleaning at the true producer. D-96 bromide alternatives and F-5 anhydrous-versus-pentahydrate or F-6 alternatives are not simultaneous purchases. Acetic solution whole purchased mass includes its water; crystal water in borax/alum is already in the whole salt. This is not a default recipe: sources establish identities and feasible operations, while actual lot assay, preparation amounts and controls determine inventory. A complete purchased formulation replaces the constituent purchases only with a genuinely full matched linked preparation provider, retaining actual site work; no paper upstream hides real preparation. Module6 table6-1 simulated ammonium-fixer/reuse context is not the F-5 sodium-fixer preparation or its environmental quantities. | kodak-h24-negative; kodak-h24-environment |\n| v_full_silver | p_motion | Distinguish whole supplied/waste mass, elemental total Ag, dissolved/titratable fixer silver, recoverable Ag under a named preparation, retained image metal/halide, and any identified complex/species. None are interchangeable. Complete Module3 intro allows unprefixed/ULM procedures across Kodak film/paper, but individual method matrix and interference conditions still control. For actual matching thiosulfate fixer,1208E supplies aliquot selection, alkaline treatment preventing thiosulfate acid decomposition, EDTA treatment with zinc interference remaining, gelatin against occluding Ag2S, potentiometric sulfide endpoint, standardized titrant and the actual sample-volume calculation; use the actual matched standardization/ULM0003 endpoint procedure and Module4 reagent definition.1209D independently tested sodium/ammonium thiosulfate fixer matrices including sulfite, acetate, borate and potassium alum, with ferrous-ion treatment, colour blank and stated applicability; its table normality/typographic variants are not blindly copied. Neither procedure determines free Ag+ or original silver-complex molecular identity, and neither without a separate complete preparation establishes all-phase totalAg in film, sediment, wet filter or arbitrary commingled waste. Hold those dependent quantitative/speciation claims if their actual whole-matrix preparation/selectivity/recovery procedure is not established; do not infer them from a total reading, filtration loss or futureSOP. Whole actual waste custody and real complete provider demand remain recorded, not deleted. | kodak-h24-analytical; kodak-h24-reagents; kodak-h24-environment |\n| v_full_residual | p_motion | For residual thiosulfate in freshly processed film, keep the later ULM0004/1 programme separate from the selected independent historical1330A branch. ULM0004 has a concrete film extraction, methylene-blue analysis and AppendixA own-instrument calibration, but Module4 printed4-14 names ferric chloride hexahydrate without defining the liquid reagent concentration/preparation required by ULM0004; do not invent that missing dependency or borrow an unrelated ferric-salt recipe. The separately retained complete Kodak1330A/SP945–947 gives its own full extraction, borohydride/acetone/ferric-SULFATE/NND colour system, immediate silver-bearing-film timing, low-density sampling context, ProcedureI and actual higher-level extraction/serial-dilution branches, full calibration and failure diagnostics; its matching reagent entries AR703/705/708 define that branch. Use that complete internally matched branch, not a hybrid replacing one salt in the later procedure. The historical collection concerns colour reversal intermediates elsewhere, while1330A expressly describes silver-containing processed film; its analytical transfer to this actual black-white film is an explicit narrower author synthesis with actual layer/timing/extraction-recovery checks, not a claim the entire CRI processing route applies. Sample actual representative accepted-film locations and declared minimum-density quality sites separately; known-amount standards and repeat extraction/blank/matrix-spike checks test extraction and measurement rather than assuming source bias or layer equivalence. Record actual elapsed processing-to-analysis; no archival or aged-print equivalence. No source standard range, drop size, example curve, dose, quality threshold or lifetime becomes a factory default. | kodak-h24-analytical; kodak-h24-reagents; kodak-residual1330-scan |\n| v_full_analytical_basis | p_motion | Keep analytical aliquots and mass/area bases explicit. In the selected1330A calibration let f(A) be thiosulfate ion micrograms in the actually developed calibration aliquot, fitted from actual standardized solution dilutions and blanks; sample residual r=f(A_sample) times the actual full-extract/assayed-aliquot and serial-dilution factors divided by measured actual film area. Do not carry its fixed illustrative dilution multipliers into changed volumes or use envelope35mm width times length as perforated material area. Distinguish S2O3 ion from anhydrous/pentahydrate salt and from total sulfur. A matrix spike introduced after extraction tests measurement only; a real pre-extraction challenge and repeated extraction/retained-phase recovery test the original film preparation. Fixer silver calculation uses actual standardized sulfide equivalents, actual endpoint blank where applicable and actual original aliquot volume/dilutions; source shortcut constants are not independent observations. Recalibrate after changed instrument/reagent conditions, preserve response/blank/timing/colour failure evidence and reject unsupported or out-of-range results rather than clipping to zero. Actual site repetitions, standard certificates, recovery and uncertainty remain later study qualification; the specified source-backed procedures exist, while an actually undefined essential reagent/phase branch remains a distinct affected-claim hold. | kodak-h24-analytical; kodak-h24-reagents; kodak-residual1330-scan |\n| v_full_limits | p_motion | A whole physical film or effluent exchange may remain one actual complete material flow; its elemental/species analyses are nested measurements, not invented additional purchases, wastes or emissions. The selected real external collection route does not authorize direct-outfall species or automatic onsite silver-recovery credits; all true linked recovery/treatment and utilities stay complete. Kodak handbooks supply meaningful original manufacturing and analytical procedures, not a measured factoryLCI or a universal emission profile. An actual necessary gas/vapour, wet aerosol, dissolved or solid species needs a complete matrix/phase-specific sampling/preparation/selectivity/quantitation programme. Odour, totalVOC, COD/BOD, totalAg or water-by-difference is not an individual molecule/species. Current cp_species alone is not such a programme. Preserve concrete affected gas/speciation/wholeAg preparation holds where no applicable programme is yet established; no finite checker, futureSOP, provider label or unperformed siteQA alone decides scientific applicability. Do not infer every conditional release must occur, but do not delete real releases or real utility/control producers because analysis is unresolved. | kodak-h24-negative; kodak-h24-environment; kodak-h24-analytical |\n| v_full_source_conflicts | p_motion | Preserve source unit and typography conflicts explicitly. In the silver branch Module4 printed4-35 calls the ligand solution1.0N whereas1208E and Module4 preparation4-36 define1.0M sodium thiosulfate; molarity and equivalent concentration are reaction-dependent and not interchangeable. Follow the explicit matched ligand preparation and actual Ag-equivalent standardization, retain the chosen branch and verify known Ag recovery in that same matrix; do not silently use a printed N as M. The actual sulfide equivalent titre is obtained from certified Ag nitrate amount divided by measured sulfide endpoint volume; preserve actual standardized values, blank treatment and original sample/aliquot volumes.1209D contains0.0926 versus0.00926 table/body and ferricyanide M/N variants; it is retained as a matrix/scope countercheck, not the selected quantitative shortcut. The historical1330A calibration table PDF152 really reads6.7 at the stated standard addition, while embedded OCR reads6.1; the original image and actual standardized-solution/dilution arithmetic control. No source example slope or preset titre replaces actual calibration. This is transparent dimensional/source conflict handling, not an official erratum or evidence actual siteQA passed. | kodak-h24-analytical; kodak-h24-reagents; kodak-residual1330-scan |\n| v_full_optical_quality | finished_film | For optical quality distinguish source representative sensitometry from the actual film result. Record the actual calibrated transmission densitometer, spectral/filter status, reference step certificate, zero/dark and clear-path response, test-strip/cohort positions and repeated readings; the DOUBLE-X source specifies its own blue StatusM context, not a universal instrument equivalence. In an explicit physical transmission calculation retain the actual dark-corrected incident/clear-path intensity I0 and transmitted intensity I on matched optics, and D=-log10(I/I0) only for positive in-range corrected signals; density differences and the actual fitted sensitometric slope use declared exposure/density intervals. Reject saturation, nonpositive corrected signals, unmatched filters or uncontrolled drift, rather than inventing a numerical quality threshold or clipping an invalid reading. Count destructive clips as their actual original fate and retain the complete actual test equipment/reagent/waste provider. No source example contrast, exposure, time or chart becomes a factory default or claimed executed quality acceptance. | kodak-doublex-2022; kodak-h24-negative |\n\n"
