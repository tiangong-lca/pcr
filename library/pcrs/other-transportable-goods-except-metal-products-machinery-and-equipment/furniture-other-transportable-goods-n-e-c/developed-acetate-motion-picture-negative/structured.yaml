      markdown: "## 7. Allocation and Co-product Handling\n\nThis is an attributional study restricted to cases where allocation is required under the declared study goal. It neither selects consequential substitution nor claims all ILCD situations. Industrial process sources support chemistry, not LCA allocation.\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_subdivide | p_motion | Assign dedicated measured jobs first. Investigate actual and feasible virtual subdivision of exposure, bath control, test, dryer, cleaning, conditioning, assets and later service. Preserve failed attempts and startup/idle loads in the causal cohort. Do not discard failed or zero-output periods. | ilcd-allocation-2010 |\n| allocation_causality | remaining shared exchanges | For every residual exchange establish the determining physical relation: how changing each output/function changes that input/output. Tested measured transport occupancy, solution demand, heater load or equipment use may govern different exchanges; neither film mass, area nor length is a universal key. Distinguish process-related and product-related burdens and disclose model evidence/sensitivity. | ilcd-allocation-2010 |\n| allocation_residual | only unresolved common-process burdens | Only after those steps use contemporaneous actual market values at the same common-process gate, physical condition and bulk state. Derive gate values by removing separately incurred downstream conditioning/packing/transport where needed. Do not use raw-stock catalogue prices as developed-film values, arbitrary shares, optional physical/economic choice or a negative-price credit rule. | ilcd-allocation-2010 |\n| allocation_physical | all inventory rows | Burden shares affect environmental attribution vectors, not measured physical film, wet effluent, species, packaging or recovered output quantities. Actual waste treatment consumes gross V in the provider native unit, normalized against Q or Qc independently of economic shares and stock bookkeeping. Recovery/sale alone gives no substitution credit or automatic coproduct. | ilcd-allocation-2010 |\n\n"
