    - protocol_id: cp_asset
      process_id: "manufacture"
      flow_role: "each tool/asset/filter"
      record_type: "physical_fleet_and_service"
      raw_fields: "actual asset ID; whole receipt/retirement kg; O/C; old/new fleet; filters; component/retained mass; repair; actual complete provider; service vectors by original cohort"
      collection_method: "Retain whole physical fleet exchanges and stocks independently from performed service vectors. Assign actual causal service and carry only unused service once, with actual compatible provider units and full embedded upstream history. No default asset weight, lifetime or common service share. Raw records remain undivided; the aggregation field declares the final reporting basis only. All actual unit conversion and attribution precedes the single section8 quotient. This protocol belongs only to manufacture; a shared fleet/shipment event is recorded physically once across the process interface, with separate original-cohort service vectors."
      unit: "kg"
      frequency: "each purchase, service and retirement event"
      temporal_coverage: "all old/new stock and declared original H"
      site_scope: "actual complete asset/fleet and service recipient"
      aggregation_rule: "per 1 m2 reference flow"
