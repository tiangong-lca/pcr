allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "each attributable exchange"
    rule: "First use actual dedicated process records and feasible subdivision or virtual subdivision; include the real function that caused each burden. Physical output and waste quantities remain complete."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_causality
    applies_to: "genuinely shared remaining burden"
    rule: "Use the exchange-specific determining physical causal relationship with actual material, geometry, time or service constraints. Do not impose mass, footprint area or time as a universal allocation factor. Only genuinely residual non-subdividable burdens without a supported determining relation use actual contemporaneous values at the same condition and process gate."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_waste
    applies_to: "failures, sales and whole wastes"
    rule: "Ordinary rejects, samples, offcuts or sold waste keep actual attributed production and treatment; sale or outward physical transfer is not automatic other-function transfer or avoided-product credit. Whole receiver Qt is recorded once and treatment-service vectors are distinct by original cohort."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_service
    applies_to: "performed and unused service"
    rule: "Actual performed old/new-cohort service remains even for cabinets still in stock or failed repairs. Carry only unused/unassigned service once; full physical asset/filter/package transfer is independent from its environmental allocation. Unknown shares stay unresolved."
    source_ids:
      - jrc-ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "finished_cabinet"
      record_type: "geometry_and_unique_acceptance"
      raw_fields: "article ID; complete BOM; closed configuration; outline/shape; calibrated W,D or projected area; original event; first acceptance; Q0; disposition; delivered/onsite/loss bridge"
      collection_method: "Measure every complete cabinet separately at first acceptance. Use W times D only for a verified rectangular closed whole projection; otherwise actual validated outline area. Lock positive individual m2 and sum Q0 once, including closing accepted FG. Never combine stacked footprints or normalize raw records. Raw records remain undivided; the aggregation field declares the final reporting basis only. All actual unit conversion and attribution precedes the single section8 quotient. This protocol belongs only to manufacture; a shared fleet/shipment event is recorded physically once across the process interface, with separate original-cohort service vectors."
      unit: "m2"
      frequency: "each first acceptance"
      temporal_coverage: "entire original manufacture cohort including failures and zero output"
      site_scope: "actual complete configuration at actual site"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "calibration; retained geometry/outline; complete BOM; acceptance/disposition lineage"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "each material/component"
      record_type: "whole_feed_stock_and_fate"
      raw_fields: "whole net wet kg; actual grade/species; batch; supplier boundary; formulation/disclosure; retained/waste/water fates; physical O/C raw/WIP; original-cohort vectors"
      collection_method: "Calibrated weighing and actual supplier/manufacture records for each one complete supplied material. Keep whole-formulation and nested composition separately, actual operations and all failures; actual mass/moisture never redefine Area Q0. Prepare A only after inherited foreground and complete producer histories are reconciled without overlap. Applicable Method24 coating characterization retains its ASTM dependencies, duplicate reproducibility and water-dependent uncertainty; it does not establish adhesive, wood or emitted molecular composition. Raw records remain undivided; the aggregation field declares the final reporting basis only. All actual unit conversion and attribution precedes the single section8 quotient. This protocol belongs only to manufacture; a shared fleet/shipment event is recorded physically once across the process interface, with separate original-cohort service vectors."
      unit: "kg"
      frequency: "each lot and issue/rework event"
      temporal_coverage: "complete manufacture and declared original H"
      site_scope: "actual material, grade and producer chain"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "scale; supplier disclosure limits; exact whole specification; physical and burden stock audit"
    - protocol_id: cp_service_material
      process_id: "cohort_service"
      flow_role: "each material/component"
      record_type: "whole_feed_stock_and_fate"
      raw_fields: "whole net wet kg; actual grade/species; batch; supplier boundary; formulation/disclosure; retained/waste/water fates; physical O/C raw/WIP; original-cohort vectors"
      collection_method: "Calibrated weighing and actual supplier/manufacture records for each one complete supplied material. Keep whole-formulation and nested composition separately, actual operations and all failures; actual mass/moisture never redefine Area Q0. Prepare A only after inherited foreground and complete producer histories are reconciled without overlap. Applicable Method24 coating characterization retains its ASTM dependencies, duplicate reproducibility and water-dependent uncertainty; it does not establish adhesive, wood or emitted molecular composition. Raw records remain undivided; the aggregation field declares the final reporting basis only. All actual unit conversion and attribution precedes the single section8 quotient. This protocol belongs only to cohort_service; a shared fleet/shipment event is recorded physically once across the process interface, with separate original-cohort service vectors."
      unit: "kg"
      frequency: "each lot and issue/rework event"
      temporal_coverage: "complete manufacture and declared original H"
      site_scope: "actual material, grade and producer chain"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "scale; supplier disclosure limits; exact whole specification; physical and burden stock audit"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "electricity"
      record_type: "metered_original_service"
      raw_fields: "meter ID; delivered voltage/provider/year/geography; raw kWh; MJ conversion; operation/idle/zero-output; original cohort; shared service evidence"
      collection_method: "Use actual calibrated meters; convert measured kWh times 3.6 to MJ for the exact native Net calorific value chain without a fuel assumption. Reconcile all actual utility users and causal assignment; retain full raw totals before preparing A. Raw records remain undivided; the aggregation field declares the final reporting basis only. All actual unit conversion and attribution precedes the single section8 quotient. This protocol belongs only to manufacture; a shared fleet/shipment event is recorded physically once across the process interface, with separate original-cohort service vectors."
      unit: "MJ"
      frequency: "each meter interval and service campaign"
      temporal_coverage: "whole period including standby and failures"
      site_scope: "actual delivered grid interface and site"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "calibration; meter closure; compatible complete provider; causal allocation"
    - protocol_id: cp_service_energy
      process_id: "cohort_service"
      flow_role: "service_electricity"
      record_type: "metered_original_service"
      raw_fields: "meter ID; delivered voltage/provider/year/geography; raw kWh; MJ conversion; operation/idle/zero-output; original cohort; shared service evidence"
      collection_method: "Use actual calibrated meters; convert measured kWh times 3.6 to MJ for the exact native Net calorific value chain without a fuel assumption. Reconcile all actual utility users and causal assignment; retain full raw totals before preparing A. Raw records remain undivided; the aggregation field declares the final reporting basis only. All actual unit conversion and attribution precedes the single section8 quotient. This protocol belongs only to cohort_service; a shared fleet/shipment event is recorded physically once across the process interface, with separate original-cohort service vectors."
      unit: "MJ"
      frequency: "each meter interval and service campaign"
      temporal_coverage: "whole period including standby and failures"
      site_scope: "actual delivered grid interface and site"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "calibration; meter closure; compatible complete provider; causal allocation"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "tap_water"
      record_type: "phase_and_water_balance"
      raw_fields: "raw supplied kg; meter volume and independent density/temperature if used; formulation and timber water; humidity ingress; vapour; liquid effluent; actual wet O/C"
      collection_method: "Independently measure whole water supply and actual phase fates. Do not purchase water already inside glue/coating/fronts again or infer water as one minus TDS solids. Actual natural influx and full closing wet stock both remain; electric water heating stays within actual electricity. Raw records remain undivided; the aggregation field declares the final reporting basis only. All actual unit conversion and attribution precedes the single section8 quotient. This protocol belongs only to manufacture; a shared fleet/shipment event is recorded physically once across the process interface, with separate original-cohort service vectors."
      unit: "kg"
      frequency: "each period and cleanup/conditioning event"
      temporal_coverage: "manufacture plus each original H"
      site_scope: "actual supply, wood/film and moisture interfaces"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "water/phase methods; meter/scale; moisture uncertainty; elemental closure"
    - protocol_id: cp_service_water
      process_id: "cohort_service"
      flow_role: "service_tap_water"
      record_type: "phase_and_water_balance"
      raw_fields: "raw supplied kg; meter volume and independent density/temperature if used; formulation and timber water; humidity ingress; vapour; liquid effluent; actual wet O/C"
      collection_method: "Independently measure whole water supply and actual phase fates. Do not purchase water already inside glue/coating/fronts again or infer water as one minus TDS solids. Actual natural influx and full closing wet stock both remain; electric water heating stays within actual electricity. Raw records remain undivided; the aggregation field declares the final reporting basis only. All actual unit conversion and attribution precedes the single section8 quotient. This protocol belongs only to cohort_service; a shared fleet/shipment event is recorded physically once across the process interface, with separate original-cohort service vectors."
      unit: "kg"
      frequency: "each period and cleanup/conditioning event"
      temporal_coverage: "manufacture plus each original H"
      site_scope: "actual supply, wood/film and moisture interfaces"
      aggregation_rule: "per 1 m2 reference flow"
