product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.furniture-other-transportable-goods-n-e-c.solid-mango-rattan-kitchen-storage-cabinet"
  classification_refs: "CPC 3.0 38130; narrower product and route boundary"
  covered_products: "Complete rigid structural mango-wood kitchen storage cabinet with genuine natural-rattan wood-framed fronts"
  excluded_products: "Pure MFC; faux rattan; wholly rattan/bamboo-frame furniture; separate parts; flat-pack supply; dining/living furniture without established kitchen kind; installed whole kitchen; alternative undisclosed finishing routes"
  representative_product: "One actual complete closed, rigidly supplied wood/rattan kitchen storage cabinet; Alvara is primary whole-product evidence, not this selected factory recipe"
  production_route: "Complete dry timber and completed natural-rattan fronts with full upstreams → real body sizing/planing/joinery/boring/sanding → qualified aqueous PVAc cold bonding and clear B8500 brush finish on wood → actual drying/fitting/inspection → first acceptance; actual order disclosed"
  market_state: "New complete rigid cabinet before room installation, in the actual declared closed supplied state"
functional_unit:
  what: "Kitchen storage supplied by the whole declared cabinet"
  how_much: "1 m2 measured individual complete-cabinet floor projection at unique first acceptance"
  how_well: "Complete actual BOM, structural/joint/front operation, actual finished/cured state and drawing-specific acceptance; no invented limit"
  how_long_or_cycle: "One manufacture-to-first-acceptance event; actual later factory service horizon H linked to original Q0, no household lifetime default"
  reference_flow_link: "finished_cabinet"
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "This method covers a new complete rigid indoor kitchen storage cabinet with a load-bearing solid mango-wood body and genuine natural woven-rattan detailing in wood-framed fronts. Art & Craft Furniture documents Alvara AR06/A as a kitchen cabinet with a solid mango-wood frame, authentic rattan and one-piece delivery. Its image shows enclosed storage, open shelves and drawers. These observations establish a real whole-article subtype, not its factory BOM, joint design, finish recipe, dimensions for other products, load rating, lifetime or a universal kitchen-cabinet construction. Actual complete supply includes the body, back, shelves, all supplied doors/drawers and each actual supplied fitting; household contents, room installation and subsequent use are outside the first-release reference event."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "The narrower CPC 3.0:38130 applicability is an explicit inference from the primary material stated as mango wood, the structural wooden body and the explicitly designed kitchen-storage article. It is not a measured mass-majority claim or an exact customs ruling. Preserve the distinctions from other wooden furniture, bamboo/rattan furniture, separate furniture parts, kitchen utensils and an installed whole kitchen. Natural rattan detailing does not turn a wholly rattan-framed cabinet or a plastic imitation into this subtype. A marketing photograph of kitchen objects alone is insufficient. Multi-room use is neither automatic inclusion nor automatic exclusion; actual design, construction and intended supply must establish the kitchen kind."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "The selected whole Product is Furniture, officially Chinese 竹、藤制家具, with native Area and Units of area/m2. Its English name and complete bilingual comment describe broad furniture including wooden storage cabinets, while its Chinese basename/synonym explicitly signal bamboo/rattan and its native CPC38149 says not made of wood. This classification counterevidence is retained, not silently changed or treated as identity authority. The admitted article genuinely contains natural rattan as well as structural wood; this is a positive narrower material/function fit to the complete broad record, not permission for pure MFC, all furniture, faux rattan or an incompatible factory gate. The contrary single-piece sanding/shaping/sealing description of Solid Wood Furniture is not used as an assembled-cabinet substitute. Exact supplier, configuration, state and measurement compatibility remain study qualifications; the native record imposes no invented exclusive factory or SKU."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "Native whole-product context is preserved in full: Furniture refers to objects intended to support various human activities such as seating, eating, storing items, working, and sleeping. It is also used to hold objects at a convenient height for work or to store things. Furniture is usually made of wood, metal, plastics, marble, glass, fabrics, or related materials and has a variety of different purposes. It ranges widely from the simple pine chest or stick-back country chair to the most elaborate marquetry work cabinet or gilded console table."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "The reference is 1 m2 of the declared horizontal floor-area projection of complete closed cabinets at their unique first accepted release. HUB-3418 explicitly covers a complete corpus plus door and permits floor-area or front-area conversion from actual geometry. It is a Danish MFC/HDF/ABS product study, not a mango/rattan recipe or a native-provider equivalence. This method selects floor projection and does not substitute front area, total material surface, door sweep, packaging footprint or foot-contact area. Measure every actual complete cabinet separately in its declared closed configuration: only a verified rectangle uses measured overall width times overall depth; other shapes require measured actual projected geometry and a retained outline. Stacking cabinets never merges their individual areas. No EPD size, mass, lifetime, material percentage, impact result or factor is transferred."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "For each original cohort fix Q0 as the sum of the positive individual reference areas locked at first acceptance, with actual article ID, geometry, shape, state, BOM and event records. Closing accepted finished goods are already in Q0; dispatch, return, stacking, moisture change, repair and retest never create a second reference event. Keep an exhaustive disjoint original-acceptance-basis bridge across net remaining deliveries, all on-site accepted states, irreversible losses and other terminal dispositions. Record later dimensional and mass/moisture changes independently; do not restore lost water or material into survivors and also record the loss. Q0 is an event account, not another physical output. For a zero or unknown basis retain complete raw loads and unresolved unit results."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "Maintain three separate accounts: complete physical receipts, transfers and opening/closing raw/WIP/finished-goods/asset stocks in their actual units; the fixed first-acceptance area Q0; and attributable environmental exchange/burden vectors A by original cohort. For a manufacturing cohort include own opening inherited foreground vectors and all actual period loads, remove only closing unfinished/unassigned vectors and evidenced transfers to independent functions/cohorts once. Closing accepted FG is not deducted as unfinished WIP. Upstream provider aggregate inventories and their separately decomposed histories are alternative representations, never added twice. Rework loops, failures, samples, idle and zero-output periods keep their real inputs, loss and treatment; internal transfers cancel only once on consolidation."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "The production boundary is a transparent technical synthesis, not a claim that Alvara uses KLEIBERIT or BEHR. It starts from burden-bearing kiln-dried solid mango timber and genuinely completed supplier fronts, then actual body sizing/planing/joinery/boring/sanding, one-component aqueous PVAc cold bonding, a qualified untinted waterborne polyurethane/acrylic clear finish brushed onto wood, actual drying, final fitting and first-release acceptance. EPA documents purchased dried lumber, assembly before or after finishing, adhesive joining, machining, sanding and coating. The declared bounded variant procures completed wood-framed natural-rattan door and drawer-front assemblies; their weaving, treatment, framing, backing, finish and drying are retained in real complete upstream producers. Body drying is upstream only when actual purchased dry timber and its complete provider support that gate. No prefinished-part receipt or packing activity substitutes for the real body manufacture and whole completion."
      source_ids: []
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "KLEIBERIT 303.0 supports a ready-to-use one-component PVAc dispersion and cold bonding of hard/exotic timber. Its two-component 303.5 hardener route is a distinct alternative and is excluded from this bounded route; do not assume a D4 bond or shipbuilding/food-contact certification. The complete sheet states material/machine dependence, actual testing, hardwood/exotic-timber application differences and possible discoloration. BEHR B8500-series TDS covers properly prepared bare or stained wooden cabinets and a polyurethane/acrylic waterborne finish with brush application, no thinning and warm soapy-water cleanup. This route selects an actual qualified clear satin B8500 supply without added stain or hardener, not spray application. Its floor-specific use cautions are not furniture-process factors. Retain current supplier instructions and actual wood/finish compatibility; no spread, density, moisture, coats, cure time, temperature, yield or performance threshold is a PCR numerical default."
      source_ids: []
    - rule_id: system_boundary_rule_10
      applies_to: "foreground_system_boundary"
      rule: "Purchase each whole adhesive, coating, cleaner and finished component once. Polymer, wax, additive, rattan, wood, facing, carrier water and hardware already included in a supplied whole are nested composition ledgers, not additional purchases. A waterborne label, TDS solids range or hazardous-ingredient SDS is not a complete recipe or a free-water fraction. Do not infer that all non-solids are water, all solids are retained, VOC content equals actual emission, or an unlisted ingredient has zero emissions. Record actual whole-feed kg, supplier composition/disclosure limits, independently qualified water/nonvolatile/carbon and actual retained, evaporated, captured and wastewater fates. Reacting or transformed species are not forced molecularly conserved; actual element/phase balances and species methods are distinct. An unresolved essential matrix method remains unresolved; a later SOP or mechanical check cannot waive it."
      source_ids: []
    - rule_id: system_boundary_rule_11
      applies_to: "foreground_system_boundary"
      rule: "Include all real machining, clamps, curing/ventilation, extraction, cleanup, heating, utility generation and treatment operations. The brush variant does not silently inherit spray transfer efficiency or remove sanding dust. If a compressor, kiln, boiler, solvent operation, refrigerant circuit, on-site wastewater/treatment plant or other genuine producer exists, expand its complete atomic inputs, outputs, emissions, equipment and matched physical interfaces before using that study; an external-utility label cannot hide it. Purchased heat must retain actual carrier ingress/condensate return, state and enthalpy with one supply-burden owner; water heated electrically on site keeps electricity and water inputs rather than a second purchased-heat burden. No generic disposal stub or nominal future provider closes a real treatment boundary."
      source_ids: []
    - rule_id: system_boundary_rule_12
      applies_to: "foreground_system_boundary"
      rule: "Every outside material, completed front, utility, tool/asset, packaging and waste interface requires an actual complete producer/provider with matching whole flow, reference unit, state, composition, geography, year, ownership, losses and transport. Purchasing finished rattan fronts does not delete their rattan processing, wood frame, adhesive, finish, machining, utilities or wastes. A native identity is not an available background inventory or an environmental result. Ordinary supplier, auxiliary UUID and future measured quantities may remain disclosed, while incompatible whole identity or essential method prevents use. Where only a partial provider is available, explicitly model and connect the missing genuine production stages; do not declare zero, invent a generic available provider or duplicate a provider aggregate with its expanded history."
      source_ids: []
    - rule_id: system_boundary_rule_13
      applies_to: "foreground_system_boundary"
      rule: "Record actual on-site accepted-cabinet storage, handling, authorized and unauthorized repair, repacking, return inspection and failure treatment by their original cohort and fixed Q0 over the declared service horizon H. Permission and retest determine whether a cabinet still qualifies, not whether happened work is counted. Old finished goods keep their original historical burden, dimensional/mass/moisture and physical custody; do not absorb old-cohort service into new production or create Q from repair. Actual natural moisture influx, evaporation, liquid release and full wet closing stocks remain in the physical account even without an authorized repair. Perform the sole A/Q0 division only after units and cohort attribution are established."
      source_ids: []
    - rule_id: system_boundary_rule_14
      applies_to: "foreground_system_boundary"
      rule: "For each real packaging article keep six complete directional legs: P separately purchased inward, I supplier-included inward, ER actual empty packaging received back from a customer or reuse pool, S filled shipment outward accompanying an actual cabinet or returned contents, EO empty packaging sent to a supplier or another recipient and W actual discarded whole waste, with opening/closing stock O/C and identified repairs/transfers. Reconcile actual mass and separate article counts independently. Returning or reusable status does not erase physical transfers or automatically remove manufacturing, cleaning, repair, transport or treatment burdens. Included I packaging has one evidenced burden owner and is not purchased again through P. Unopened filled containers, empty returns, reused articles and contaminated discards are different physical states. Real additional packaging grades get their own six cards, not a generic plural row."
      source_ids: []
    - rule_id: system_boundary_rule_15
      applies_to: "foreground_system_boundary"
      rule: "Export each contaminated filter, wipe, abrasive, brush, pail, can or carton as one actual whole wet waste including retained wood/coating/glue and moisture. Dry substrate/tare, attached material and water are nested components; do not fabricate additional physical powder, resin or water exports unless actually separated before the boundary. Separately caught dust, drained coating or free wastewater remains its own physically distinct stream. Record one full receiver transfer Qt with actual composition and one full actual treatment-provider quantity, independent of environmental service shares. Do not shrink physical Qt when allocating service, and do not charge the same full provider quantity again to every served cohort."
      source_ids: []
    - rule_id: system_boundary_rule_16
      applies_to: "foreground_system_boundary"
      rule: "Separate whole-waste physical disclosure Qt/Qanalysis from linked modelled attributable treatment demand or burden vector A/Q0. Qanalysis identifies the disclosure study only; it never assigns all shared waste to each original cohort. Retain measured physical component/cohort provenance where actually known, and separately evidence the service allocation in units compatible with the actual provider. Shares must be supported, non-overlapping and exhaust the assigned service; unknown shares remain unresolved. A synthetic accounting test, not empirical data or a default: one actual 10 kg filter export containing 8 kg substrate and 2 kg retained material serves new and old cohorts. Evidenced 25%/75% treatment service produces 2.5/7.5 kg-equivalent demands, and Qnew=100 m2, Qold=200 m2 gives 0.025/0.0375 kg-equivalent per m2. The receiver still gets one 10 kg waste; neither 2.5 kg physical export nor a repeated 10 kg demand is valid. Apply this distinction to shared packaging waste only when its actual shared recipient/service history exists."
      source_ids: []
    - rule_id: system_boundary_rule_17
      applies_to: "foreground_system_boundary"
      rule: "Keep full physical old/new equipment, installed filters, fluid and tool stocks, purchases, replacements and retirement separate from their attributable service vectors. The complete filter fleet and old cohorts cannot disappear because the studied cabinet is new. No default lifetime, replacement rate, annual utilization, machine mass or common burden fraction is imposed. Actual retired tools/assets and their attached contamination are exported whole once; nested composition and provider-service allocation do not manufacture extra physical exchanges. Each actual lubricant, refrigerant, replacement part, cleaner and energy carrier gets its own atomic card before use; unknown chemistry is not represented by a pure constituent proxy."
      source_ids: []
    - rule_id: system_boundary_rule_18
      applies_to: "foreground_system_boundary"
      rule: "The actual electricity identity is Alternating current, less than 1 kV, consumption mix to user, grid-average supply. Its exact native reference property is Net calorific value, not a newly invented generic Energy or a fuel premise. Metered kWh times 3.6 expresses the same electrical quantity in MJ for that native chain. Match the actual delivered voltage/geography/year/provider and account for all dedicated/shared manufacturing, ventilation, lighting, water heating and standby demand once. A complete grid provider is not evidence of a particular tariff, renewable claim or site energy quantity."
      source_ids: []
    - rule_id: system_boundary_rule_19
      applies_to: "foreground_system_boundary"
      rule: "Dust control captures are not emitted dust. Preserve chips, shavings, collected dust, substrate/retained-contamination composition, fugitive dust and actual outlet particulate mass as distinct quantities without double counting. Any filterable stack test covers only its stated sampling train and operating window; it does not establish total fugitive, condensable or other unmeasured material. Waterborne finish is not zero-VOC or zero-hazard. Actual coating/glue/wood/cleanup compounds, water phases and carbon origins require applicable validated identification/quantification and uncertainty; add each genuinely present elementary species as its own row. Total VOC, an SDS list or a mass-balance residual cannot invent a molecular species, natural-air composition or unmeasured zero. No control efficiency or emission factor is assumed."
      source_ids: []
    - rule_id: system_boundary_rule_20
      applies_to: "foreground_system_boundary"
      rule: "The retained B8500 satin SDS is version01 issued25-May-2023, while the TDS is revisedFebruary2024; compatibility with each actual supplied lot is not assumed from the product code. The SDS section3 discloses waxes and a preservative with trade-secret percentages, while section15 additionally lists ammonium hydroxide. Section9 distinguishes VOC on a coating basis from a material basis. These are not a full recipe, actual ammonia/free-water fraction, an emission rate or interchangeable concentration bases. Its ecological and disposal sections identify aquatic harm, VOC-related ozone potential and residual product in emptied containers. Retain all of these qualifications: an empty-container label does not mean clean tare, and a waterborne/clear finish does not mean zero organic or ammonia release. Actual gaseous NH3, aqueous NH3/NH4 species, water and polymer/wax fates are independently identified at actual pH/state; a pure ammonium-hydroxide purchase or forced molecular conservation is not invented."
      source_ids: []
    - rule_id: system_boundary_rule_21
      applies_to: "foreground_system_boundary"
      rule: "EPA Method24, 7October2020, explicitly covers water, volatile matter, density and solids in paint, varnish, lacquer and related surface coatings. For this waterborne coating it is an analytical basis to qualify, not an actual lot result or an emission factor. Its incorporated ASTM procedures distinguish volatile matter, directly determined water and density/solids; retain their applicable editions, calibration and sample procedures rather than deriving water as the complement of solids. The method requires duplicate reproducibility checks and uses confidence limits because VOC precision deteriorates as water content increases. Retain wet-material versus coating-volume bases and exemption definitions without transferring regulatory conventions into an unmeasured environmental species. It does not establish wood moisture, adhesive water, retained cured-film composition, molecular emission identity or field release. Its Internet PDF disclaims being the official regulatory version; actual applicable laboratory procedures and matrix suitability must be available before study use. Section11.3.4 volume solids depend on the manufacturer formulation; missing disclosure cannot be replaced by a guessed volume-solids fraction."
      source_ids: []
    - rule_id: system_boundary_rule_22
      applies_to: "foreground_system_boundary"
      rule: "EPA Method18, 1April2025, provides a source-gas GC basis for actual gaseous organic components. It excludes high-molecular-weight polymeric compounds, species that polymerize before analysis and very-low-vapour-pressure compounds at the actual stack/instrument conditions. It depends on Methods1,2,3 and experienced source sampling/GC; a bare Method18 citation is not a complete sampling system. Its presurvey identifies actual compounds and approximate concentrations before compound-specific standards/calibration under matching conditions. Retain sampling/recovery, column separation, blank/carryover control, condensation and saturation limits, and measured water-vapour correction between dry calibration and wet sample bases. An actual source-wide emission requires matched concentration, flow, duration and separately established fugitive coverage. This is neither ammonia analysis nor total condensable/polymer/coating mass measurement, and it does not quantify unmeasured wood-furniture emissions. The PDF is an informational Internet version, not a claim of legal compliance or qualification of the actual factory matrix. Presurvey screening is optional when targets are already established by prior tests or process knowledge; where targets are unknown, retain the actual presurvey/identification step. Its peak-screening convention is not a PCR mass cut-off."
      source_ids: []
    - rule_id: system_boundary_rule_23
      applies_to: "foreground_system_boundary"
      rule: "NIOSH6016 issue2, 3March2016, documents ammonia-in-air sampling on acid-treated sorbent and IC analysis of ammonium with calibration reported as NH3. It is not an aqueous-formulation assay or proof of gas-phase release from an SDS ammonium-hydroxide listing. Keep actual sampling volume, front/back sections, blanks, storage, calibration/range and recovery; aerosol/particulate ammonium and similar-retention ethanolamines require their stated separation/interference controls. The cover says EVALUATION: FULL, but the evaluation text expressly says that the combined silica-gel sampler and IC analysis has not received a full evaluation as such, despite evaluated parent methods and reported comparison/storage studies. Preserve this contrary qualification. Its documented workplace-air basis is not an automatically qualified stack/whole-factory flux method or complete coverage of the current wood/finish matrix. Actual suitability and matching flow/time/source coverage must be established; if essential identification or interference separation remains unestablished, retain the study hold."
      source_ids: []
    - rule_id: system_boundary_rule_24
      applies_to: "foreground_system_boundary"
      rule: "A filled supplier shipment is recorded once at its actual gross interface. Within it, the feed-material card records actual net whole contents and the packaging I card records the actual packaging-article component, not the filled shipment mass again and not a claim that the arriving article was empty. The same distinction applies to cabinet plus dispatch packaging and actual empty returns. Actual retained residue or moisture transferred onto packaging is a disjoint internal increment in the packaging physical subledger, cancelled only once in consolidated accounts; it is not a second chemical procurement. W remains the whole wet contaminated article actually received by the waste provider, not dry tare. Actual separately collected PVAc and B8500 cleanup effluents have separate cards; if they physically join, record the complete mixing/collection interface and one combined receiver stream with nested source subledgers, not two fabricated full receiver transfers."
      source_ids: []
    - rule_id: system_boundary_rule_25
      applies_to: "foreground_system_boundary"
      rule: "A separately reported per-kg result requires an actual whole-product mass/area bridge for the same complete cabinet articles, supplied state and original first-acceptance events. Let B0 be the independently measured sum of their net whole wet kg at that event, with measured moisture and uncertainty; only positive compatible B0 and Q0 permit q_kg=q_area/(B0/Q0). Retain raw individual mass and area, configuration and event correspondence. A later remaining stock mass, catalogue mass, density assumption or HUB-3418 mass is not this bridge. This optional secondary report never changes the adopted native Area property, the fixed original Q0 or the complete physical water/material/loss accounts."
      source_ids: []
    - rule_id: system_boundary_rule_26
      applies_to: "foreground_system_boundary"
      rule: "Actual natural moisture uptake is an elementary gaseous-water resource, separately recorded from supplied tap water, formulation carrier water and physical wet closing stocks. A retained-water increment is not canceled merely because closing stock includes it. Where a genuine process-air inlet/outlet exists for extraction, ventilation or conditioning, retain complete measured physical flow and actual species/water subledgers; the conditional N2, O2 and Ar cards use Resources from air inward and Emissions to air unspecified outward, ordinary gaseous CAS/formula identity only. No fixed atmospheric percentages, isotope/liquid synonyms, industrial-gas procurement or forced molecular conservation is substituted. Room-air presence alone creates no measured bulk-air exchange. Additional actually identified species and any changed compartment require their own atomic records. Natural environmental air has no fictional upstream gas factory; actual compressed/heated/dried process air retains its genuine complete utility producer and all physical interfaces."
      source_ids: []
    - rule_id: system_boundary_rule_27
      applies_to: "foreground_system_boundary"
      rule: "For every real carton, adhesive pail, coating can and wooden pallet pool, ER is an inward empty-article return from an actual customer or reuse pool. It is not a new purchase P, a supplier-included arrival I, an outward supplier return EO, or filled shipment S. Empty means without a usable delivered contents load; actual retained matter and water remain measured in the returned article state. EO is an actual empty-article dispatch to a supplier or another recipient. S records only a real outward filled shipment, including packaging accompanying actual returned feed contents where that event exists; measure the packaging component and net whole contents separately within the once-only full shipment. Identify the original lot, sender, recipient, custody, actual state and one burden owner. The same event cannot appear in S and EO, S and ER, P and ER, or I and ER. No return creates a new reference event, manufacturing credit or automatic provider cancellation."
      source_ids: []
    - rule_id: system_boundary_rule_28
      applies_to: "foreground_system_boundary"
      rule: "The complete physical packaging bridge is O+P+I+ER+actual mutually exclusive increments=C+S+EO+W+actual mutually exclusive departures. Apply it to actual same-unit article components and retain independent count records. For a contaminated discard W, the actual whole wet receiver quantity includes article substrate plus retained residue and water once; use nested composition to link the article-component balance with that whole W, without another attached-material export. Retained influx and full wet closing stock coexist. ER and EO retain their actual full physical direction and amount regardless of any separate original-cohort service attribution. Original Q0, raw physical Qt/Qanalysis and evidenced modeled A/original Q0 remain separate; sharing never repeats full receiver/provider demand."
      source_ids: []
    - rule_id: system_boundary_rule_29
      applies_to: "foreground_system_boundary"
      rule: "Synthetic counterexample only, not an empirical package or conversion default: in each separately tested real article pool, measured O=2 kg, P=3 kg, I=1 kg and ER=4 kg of returned empty article substrate give 10 kg substrate. Closing C=3 kg, actual filled-shipment packaging S=4 kg, empty outward EO=2 kg and discarded substrate=1 kg also give 10 kg. A separately measured 1 kg retained residue/water increment makes the one whole wet W=2 kg and the complete bridge 2+3+1+4+1=3+4+2+2=11 kg. Putting ER on the outward side produces 7 versus 15 kg and is wrong. The same filled shipment may contain a measured 7 kg net material load plus its 4 kg packaging component: record 11 kg once at the interface, not another 11 kg as packaging, not EO and not inward ER. Actual counts require their own records; these masses imply no count-to-mass factor. Original cabinet reference Q0 is unchanged."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual burden-bearing dry timber, genuinely completed wood/rattan fronts and individually identified ancillary supplies at their complete matched gates"
  starting_condition_role: "starting_condition"
  product_classification_scope: "CPC 3.0:38130; narrower"
  recursive_input_rule: "Same-category unfinished cabinets/WIP retain original cohort/history once; receiving a completed cabinet is not the declared manufacturing route"
  upstream_dataset_requirement: "Every outside material, completed front, utility, tool/asset, packaging and waste interface requires an actual complete producer/provider with matching whole flow, reference unit, state, composition, geography, year, ownership, losses and transport. Purchasing finished rattan fronts does not delete their rattan processing, wood frame, adhesive, finish, machining, utilities or wastes. A native identity is not an available background inventory or an environmental result. Ordinary supplier, auxiliary UUID and future measured quantities may remain disclosed, while incompatible whole identity or essential method prevents use. Where only a partial provider is available, explicitly model and connect the missing genuine production stages; do not declare zero, invent a generic available provider or duplicate a provider aggregate with its expanded history."
  disclosure: "The production boundary is a transparent technical synthesis, not a claim that Alvara uses KLEIBERIT or BEHR. It starts from burden-bearing kiln-dried solid mango timber and genuinely completed supplier fronts, then actual body sizing/planing/joinery/boring/sanding, one-component aqueous PVAc cold bonding, a qualified untinted waterborne polyurethane/acrylic clear finish brushed onto wood, actual drying, final fitting and first-release acceptance. EPA documents purchased dried lumber, assembly before or after finishing, adhesive joining, machining, sanding and coating. The declared bounded variant procures completed wood-framed natural-rattan door and drawer-front assemblies; their weaving, treatment, framing, backing, finish and drying are retained in real complete upstream producers. Body drying is upstream only when actual purchased dry timber and its complete provider support that gate. No prefinished-part receipt or packing activity substitutes for the real body manufacture and whole completion. Purchase each whole adhesive, coating, cleaner and finished component once. Polymer, wax, additive, rattan, wood, facing, carrier water and hardware already included in a supplied whole are nested composition ledgers, not additional purchases. A waterborne label, TDS solids range or hazardous-ingredient SDS is not a complete recipe or a free-water fraction. Do not infer that all non-solids are water, all solids are retained, VOC content equals actual emission, or an unlisted ingredient has zero emissions. Record actual whole-feed kg, supplier composition/disclosure limits, independently qualified water/nonvolatile/carbon and actual retained, evaporated, captured and wastewater fates. Reacting or transformed species are not forced molecularly conserved; actual element/phase balances and species methods are distinct. An unresolved essential matrix method remains unresolved; a later SOP or mechanical check cannot waive it."
