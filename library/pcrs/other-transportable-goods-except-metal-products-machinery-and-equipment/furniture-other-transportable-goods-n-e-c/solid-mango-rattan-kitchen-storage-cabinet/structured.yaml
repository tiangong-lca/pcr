      quality_evidence: "asset register; mass; compatible complete provider; service non-overlap and stock reconciliation"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "each whole physical waste"
      record_type: "one_receiver_and_attributed_treatment"
      raw_fields: "actual one receiver Qt kg; full wet composition; nested substrate/attached/water; actual treatment quantity and unit; matched shipment/provider; known physical provenance; distinct original-cohort service A; Qanalysis/Q0; uncertainty"
      collection_method: "Weigh and reconcile the one whole actual receiver stream with the complete treatment producer and all burdens/fates. Record provider quantity once at its actual units; physical disclosure uses full Qt while linked modeled demand uses separately supported attributable A with each original Q0. Shares never shrink actual Qt or repeat it per cohort; unknown service shares remain unresolved. Raw records remain undivided; the aggregation field declares the final reporting basis only. All actual unit conversion and attribution precedes the single section8 quotient. This protocol belongs only to manufacture; a shared fleet/shipment event is recorded physically once across the process interface, with separate original-cohort service vectors."
