      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| validate_reference | finished_cabinet | Verify one complete newly accepted cabinet floor-projection Area reference, exact native property/UG, actual independent individual geometry and all ordered qualifiers. No summed material/front/pack/stack area, mass-as-Area relabel or catalogue mass conversion. | artcraft-alvara; epdhub3418; un-cpc3-38130; wco-hs2022-94 |\n| validate_production | all supplied and onsite stages | Verify substantial real body manufacture, all actual finishing/assembly/acceptance, full supplier front/rattan/drying and every real utility/treatment producer. Technical synthesis does not establish a factory recipe or available background inventory. | artcraft-manufacture; epa-wood-furniture; behr-b8500-tds |\n| validate_accounts | Q0, stocks, service and waste | Check unique original-area Q0 including accepted closing FG; all original inherited foreground and provider histories once; complete physical legs and whole contaminated receiver Qt once; separate actual service A/Q0, unknown shares unresolved and no repeated provider demand. Run the clearly synthetic 10kg old/new service test as an accounting check only. | jrc-ilcd-attributional-2010 |\n| validate_chemistry | actual full material and emission scope | Check whole-mixture versus constituents, actual wood/water/solids/carbon/species methods and all real retained/evaporated/captured/wastewater fates. No default water complement, zero-VOC waterborne claim, captured-as-emitted dust or unknown-matrix waiver. Add every other actual atomic exchange before concrete use. | behr-b8500-tds; behr-b8500-sds; epa-wood-furniture; epa-method24; epa-method18; niosh-ammonia-6016 |\n| validate_projection | both language renderings | Require identical scope, native displays/UUIDs, ordered rule/protocol/row IDs and complete literal/typed/normative-context projection. Authored/aligned candidate status does not mean scientific, translation, study or mapping acceptance. | jrc-ilcd-attributional-2010 |\n\nSeparate whole-waste physical disclosure Qt/Qanalysis from linked modelled attributable treatment demand or burden vector A/Q0. Qanalysis identifies the disclosure study only; it never assigns all shared waste to each original cohort. Retain measured physical component/cohort provenance where actually known, and separately evidence the service allocation in units compatible with the actual provider. Shares must be supported, non-overlapping and exhaust the assigned service; unknown shares remain unresolved. A synthetic accounting test, not empirical data or a default: one actual 10 kg filter export containing 8 kg substrate and 2 kg retained material serves new and old cohorts. Evidenced 25%/75% treatment service produces 2.5/7.5 kg-equivalent demands, and Qnew=100 m2, Qold=200 m2 gives 0.025/0.0375 kg-equivalent per m2. The receiver still gets one 10 kg waste; neither 2.5 kg physical export nor a repeated 10 kg demand is valid. Apply this distinction to shared packaging waste only when its actual shared recipient/service history exists.\n\nDust control captures are not emitted dust. Preserve chips, shavings, collected dust, substrate/retained-contamination composition, fugitive dust and actual outlet particulate mass as distinct quantities without double counting. Any filterable stack test covers only its stated sampling train and operating window; it does not establish total fugitive, condensable or other unmeasured material. Waterborne finish is not zero-VOC or zero-hazard. Actual coating/glue/wood/cleanup compounds, water phases and carbon origins require applicable validated identification/quantification and uncertainty; add each genuinely present elementary species as its own row. Total VOC, an SDS list or a mass-balance residual cannot invent a molecular species, natural-air composition or unmeasured zero. No control efficiency or emission factor is assumed.\n\n"
