      collection_method: "Weigh and reconcile the one whole actual receiver stream with the complete treatment producer and all burdens/fates. Record provider quantity once at its actual units; physical disclosure uses full Qt while linked modeled demand uses separately supported attributable A with each original Q0. Shares never shrink actual Qt or repeat it per cohort; unknown service shares remain unresolved. Raw records remain undivided; the aggregation field declares the final reporting basis only. All actual unit conversion and attribution precedes the single section8 quotient. This protocol belongs only to cohort_service; a shared fleet/shipment event is recorded physically once across the process interface, with separate original-cohort service vectors."
      unit: "kg"
      frequency: "each actual shipment/transfer and treatment period"
      temporal_coverage: "complete manufacture and original service/waste history"
      site_scope: "actual receiver, composition and complete provider"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "weighbridge; manifest; whole/component audit; provider unit/composition closure; non-overlap"
    - protocol_id: cp_pack
      process_id: "packaging_custody"
      flow_role: "each real article six legs"
      record_type: "gross_custody_and_ownership"
      raw_fields: "article grade; P/I/ER/S/EO/W; wet kg; count; O/C; filled/empty/contaminated state; nested contents; repair increments; original cohort; supplier burden ownership; actual linked provider A; actual ER inward customer or pool; actual EO outward supplier or recipient; S filled-shipment contents bridge; dispatch_receipt_event; no overlapping legs"
      collection_method: "Measure each of the six gross directional legs without allocation scaling. Reconcile actual O/C and disjoint repair increments, contents and article mass; keep I ownership once. W is one actual whole contaminated receiver transfer, not tare alone. A separate evidenced original-cohort service vector supplies modeled environmental demand. Raw records remain undivided; the aggregation field declares the final reporting basis only. All actual unit conversion and attribution precedes the single section8 quotient. This protocol belongs only to packaging_custody; a shared fleet/shipment event is recorded physically once across the process interface, with separate original-cohort service vectors. P/I/ER are distinct inward legs; S and EO are distinct outward legs. Use O+P+I+ER+actual disjoint increments=C+S+EO+W+actual disjoint departures, matched once-only filled shipment and whole-wet-W component bridges."
      unit: "kg"
      frequency: "each custody/repair/discard event"
      temporal_coverage: "whole supplier-to-dispatch and original return/service history"
      site_scope: "actual article pool and actual recipients"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "six-leg closure; count/mass checks; actual tare/retained components; burden owner proof"
    - protocol_id: cp_emission
      process_id: "manufacture"
      flow_role: "each elementary species"
      record_type: "actual_species_and_phase"
      raw_fields: "species/CAS; exact medium; actual concentration/flow; source/outlet/fugitive coverage; field/lab method and matrix recovery; detection/blank/uncertainty; water/carbon/species fate"
      collection_method: "Measure actual independently identified species and their phase in a documented applicable validated method, including sampling/field/lab coverage and controls. Captured mass is not emitted mass; filterable-stack measurements do not cover fugitive/condensable mass by implication. Add each other actual species as a separate atomic row before use. Unknown essential identification/quantification remains a hold, not a promised-SOP pass. Method18 is only a documented gaseous-organic basis within its full dependencies/exclusions; NIOSH6016 is only an ammonia-air basis with its stated incomplete-combination evaluation and interference limits. Actual concentration/flow/time/fugitive coverage must fit; neither source proves the current factory matrix qualified. Raw records remain undivided; the aggregation field declares the final reporting basis only. All actual unit conversion and attribution precedes the single section8 quotient. This protocol belongs only to manufacture; a shared fleet/shipment event is recorded physically once across the process interface, with separate original-cohort service vectors."
      unit: "kg"
      frequency: "each representative actual operation including failures"
      temporal_coverage: "full actual process and original service periods"
      site_scope: "actual wood, formulation, air/water matrix and outlets"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "matrix suitability; recovery/blanks; calibration; uncertainty; sampling coverage and physical closure"
    - protocol_id: cp_service_emission
      process_id: "cohort_service"
      flow_role: "each elementary species"
      record_type: "actual_species_and_phase"
      raw_fields: "species/CAS; exact medium; actual concentration/flow; source/outlet/fugitive coverage; field/lab method and matrix recovery; detection/blank/uncertainty; water/carbon/species fate"
      collection_method: "Measure actual independently identified species and their phase in a documented applicable validated method, including sampling/field/lab coverage and controls. Captured mass is not emitted mass; filterable-stack measurements do not cover fugitive/condensable mass by implication. Add each other actual species as a separate atomic row before use. Unknown essential identification/quantification remains a hold, not a promised-SOP pass. Method18 is only a documented gaseous-organic basis within its full dependencies/exclusions; NIOSH6016 is only an ammonia-air basis with its stated incomplete-combination evaluation and interference limits. Actual concentration/flow/time/fugitive coverage must fit; neither source proves the current factory matrix qualified. Raw records remain undivided; the aggregation field declares the final reporting basis only. All actual unit conversion and attribution precedes the single section8 quotient. This protocol belongs only to cohort_service; a shared fleet/shipment event is recorded physically once across the process interface, with separate original-cohort service vectors."
      unit: "kg"
      frequency: "each representative actual operation including failures"
      temporal_coverage: "full actual process and original service periods"
      site_scope: "actual wood, formulation, air/water matrix and outlets"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "matrix suitability; recovery/blanks; calibration; uncertainty; sampling coverage and physical closure"
  calculation_rules:
    - id: calc_area
      applies_to: "finished_cabinet"
      rule: "For each first accepted complete cabinet, a_i=W_i times D_i only for a verified rectangular closed projection measured in m; otherwise measured actual projected outline area. Q0=sum(a_i)>0, locked once at first acceptance; actual mass/moisture is independent."
      inputs:
        - a_i
        - W_i
        - D_i
        - geometry
        - "unique event"
      output: "Q0 in m2"
      source_ids:
        - epdhub3418
    - id: calc_history
      applies_to: "all manufacture and original service"
      rule: "A=opening inherited own foreground vectors + actual period loads - closing unfinished/unassigned vectors - evidenced transfers to independent cohorts/functions once. Already accepted closing FG is not deducted. Postrelease service uses its own attributable A_H and original Q0 over H. Failed/zero-output loads, treatment and losses remain; provider aggregate and expanded history are not added together."
      inputs:
        - "physical O/C"
        - "inherited vectors"
        - "actual loads"
        - "transfer evidence"
        - "original Q0"
      output: "attributable A and A_H in each actual extensive unit"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_model
      applies_to: "each modeled exchange"
      rule: "q=A/Q0 for manufacture and q_H=A_H/Q0 for original-cohort service: one division after unit conversion and supported attribution. Linked treatment demand uses separately evidenced compatible provider-service A, never each cohort recharged full Qt. Zero/unknown Q0 or unknown assignment leaves unit result unresolved."
      inputs:
        - A
        - A_H
        - "fixed original Q0"
        - "provider unit/assignment"
      output: "q and q_H per m2 reference flow"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_raw
      applies_to: "physical gross disclosure"
      rule: "q_raw=G/Qanalysis reports the complete actual physical leg or Qt and names its disclosure cohort/study. G is never scaled by environmental service share or consumption stock-corrected. This separate raw ledger is not another modeled treatment demand. Preserve raw G even when no valid unit result exists."
      inputs:
        - "full physical G or Qt"
        - "identified Qanalysis in m2"
      output: "physical disclosure per m2, separate from modeled q"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_closure
      applies_to: "each whole physical material and packaging pool"
      rule: "Reconcile measured opening plus all actual inward/retained increments against closing plus actual outward/emitted losses; define each repair/retained term disjoint from other same-side flows, never cancel opposite flow with stock. For a packaging article O+P+I+ER+actual disjoint increments=C+S+EO+W+actual disjoint departures. Whole wet waste includes nested substrate, residue and water once. Mass, water, elemental, molecular and phase accounts are distinct; do not fit multiple unknowns by one residual."
      inputs:
        - "all physical O/C"
        - "complete gross legs"
        - "nested composition"
        - "measured phase fates"
      output: "independent closure residuals and uncertainty"
      source_ids:
        - jrc-ilcd-attributional-2010
        - epa-wood-furniture
  data_quality_requirements:
    - id: dq_whole
      applies_to: "reference and route"
      requirement: "Require genuine natural-rattan and structural mango-wood kitchen cabinet, complete BOM, actual closed supplied gate and native Area chain; preserve complete native classification/name/comment counterevidence. The narrow inference is not general furniture or pure-MFC equivalence."
      evidence: "full primary product context; native whole hardfields; actual BOM and gate"
    - id: dq_methods
      applies_to: "formulation, dust and species"
      requirement: "Actual matrix methods, current lot/formulation, finish/wood compatibility and uncertainty must be established before a concrete study is used. A future SOP, projected rule or check pass cannot close an unknown essential method. Ordinary provider/auxiliary identity/quantity gaps are separately disclosed."
      evidence: "applicable actual methods; full supplier TDS/SDS and limits; field/lab qualification"
    - id: dq_ledgers
      applies_to: "each cohort and full physical route"
      requirement: "Require the unique Q0 event, all actual raw/WIP/FG stocks, inherited histories, failed/zero-output burdens, whole contaminated Qt and one complete matched provider quantity. Keep physical provenance and attributable service vectors separate with non-overlapping assignments."
      evidence: "event/stock/transfer and supplier ledgers; causal service proof; physical and unit closure"
    - id: dq_context
      applies_to: "both languages and sources"
      requirement: "All complete normative paragraphs, ordered qualifiers, literal table cells, atomic cards, twelve protocol fields, formula/inputs/output, quality evidence and source id/type/reference/use must survive structured projection in both languages. Counts and schema/fingerprints alone do not prove semantic preservation."
      evidence: "literal/typed/full-unit audit; exact source originals, extraction and locators"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_cabinet"
    rule: "Verify one complete newly accepted cabinet floor-projection Area reference, exact native property/UG, actual independent individual geometry and all ordered qualifiers. No summed material/front/pack/stack area, mass-as-Area relabel or catalogue mass conversion."
    source_ids:
      - artcraft-alvara
      - epdhub3418
      - un-cpc3-38130
      - wco-hs2022-94
  - rule_id: validate_production
    applies_to: "all supplied and onsite stages"
    rule: "Verify substantial real body manufacture, all actual finishing/assembly/acceptance, full supplier front/rattan/drying and every real utility/treatment producer. Technical synthesis does not establish a factory recipe or available background inventory."
    source_ids:
      - artcraft-manufacture
      - epa-wood-furniture
      - behr-b8500-tds
  - rule_id: validate_accounts
    applies_to: "Q0, stocks, service and waste"
    rule: "Check unique original-area Q0 including accepted closing FG; all original inherited foreground and provider histories once; complete physical legs and whole contaminated receiver Qt once; separate actual service A/Q0, unknown shares unresolved and no repeated provider demand. Run the clearly synthetic 10kg old/new service test as an accounting check only."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: validate_chemistry
    applies_to: "actual full material and emission scope"
    rule: "Check whole-mixture versus constituents, actual wood/water/solids/carbon/species methods and all real retained/evaporated/captured/wastewater fates. No default water complement, zero-VOC waterborne claim, captured-as-emitted dust or unknown-matrix waiver. Add every other actual atomic exchange before concrete use."
    source_ids:
      - behr-b8500-tds
      - behr-b8500-sds
      - epa-wood-furniture
      - epa-method24
      - epa-method18
      - niosh-ammonia-6016
  - rule_id: validate_projection
    applies_to: "both language renderings"
    rule: "Require identical scope, native displays/UUIDs, ordered rule/protocol/row IDs and complete literal/typed/normative-context projection. Authored/aligned candidate status does not mean scientific, translation, study or mapping acceptance."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "Separate whole-waste physical disclosure Qt/Qanalysis from linked modelled attributable treatment demand or burden vector A/Q0. Qanalysis identifies the disclosure study only; it never assigns all shared waste to each original cohort. Retain measured physical component/cohort provenance where actually known, and separately evidence the service allocation in units compatible with the actual provider. Shares must be supported, non-overlapping and exhaust the assigned service; unknown shares remain unresolved. A synthetic accounting test, not empirical data or a default: one actual 10 kg filter export containing 8 kg substrate and 2 kg retained material serves new and old cohorts. Evidenced 25%/75% treatment service produces 2.5/7.5 kg-equivalent demands, and Qnew=100 m2, Qold=200 m2 gives 0.025/0.0375 kg-equivalent per m2. The receiver still gets one 10 kg waste; neither 2.5 kg physical export nor a repeated 10 kg demand is valid. Apply this distinction to shared packaging waste only when its actual shared recipient/service history exists."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "Dust control captures are not emitted dust. Preserve chips, shavings, collected dust, substrate/retained-contamination composition, fugitive dust and actual outlet particulate mass as distinct quantities without double counting. Any filterable stack test covers only its stated sampling train and operating window; it does not establish total fugitive, condensable or other unmeasured material. Waterborne finish is not zero-VOC or zero-hazard. Actual coating/glue/wood/cleanup compounds, water phases and carbon origins require applicable validated identification/quantification and uncertainty; add each genuinely present elementary species as its own row. Total VOC, an SDS list or a mass-balance residual cannot invent a molecular species, natural-air composition or unmeasured zero. No control efficiency or emission factor is assumed."
    source_ids: []
