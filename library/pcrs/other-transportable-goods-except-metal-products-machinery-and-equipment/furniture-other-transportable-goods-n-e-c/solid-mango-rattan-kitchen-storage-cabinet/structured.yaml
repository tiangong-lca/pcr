      uuid: ""
    required_unit: "m2"
    rule: "The reference is 1 m2 of the declared horizontal floor-area projection of complete closed cabinets at their unique first accepted release. HUB-3418 explicitly covers a complete corpus plus door and permits floor-area or front-area conversion from actual geometry. It is a Danish MFC/HDF/ABS product study, not a mango/rattan recipe or a native-provider equivalence. This method selects floor projection and does not substitute front area, total material surface, door sweep, packaging footprint or foot-contact area. Measure every actual complete cabinet separately in its declared closed configuration: only a verified rectangle uses measured overall width times overall depth; other shapes require measured actual projected geometry and a retained outline. Stacking cabinets never merges their individual areas. No EPD size, mass, lifetime, material percentage, impact result or factor is transferred. For each original cohort fix Q0 as the sum of the positive individual reference areas locked at first acceptance, with actual article ID, geometry, shape, state, BOM and event records. Closing accepted finished goods are already in Q0; dispatch, return, stacking, moisture change, repair and retest never create a second reference event. Keep an exhaustive disjoint original-acceptance-basis bridge across net remaining deliveries, all on-site accepted states, irreversible losses and other terminal dispositions. Record later dimensional and mass/moisture changes independently; do not restore lost water or material into survivors and also record the loss. Q0 is an event account, not another physical output. For a zero or unknown basis retain complete raw loads and unresolved unit results."
  - id: measure_mass
    applies_to: "material, waste, assets and packaging"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Independently weigh actual complete wet physical flows and nested moisture; provider-attributed model service and raw gross disclosure are separate ledgers. No catalogue mass or physical shrinkage by allocation."
  - id: measure_electricity
    applies_to: "electricity; service_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "The actual electricity identity is Alternating current, less than 1 kV, consumption mix to user, grid-average supply. Its exact native reference property is Net calorific value, not a newly invented generic Energy or a fuel premise. Metered kWh times 3.6 expresses the same electrical quantity in MJ for that native chain. Match the actual delivered voltage/geography/year/provider and account for all dedicated/shared manufacturing, ventilation, lighting, water heating and standby demand once. A complete grid provider is not evidence of a particular tariff, renewable claim or site energy quantity."
  - id: measure_species
    applies_to: "each elementary flow"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Dust control captures are not emitted dust. Preserve chips, shavings, collected dust, substrate/retained-contamination composition, fugitive dust and actual outlet particulate mass as distinct quantities without double counting. Any filterable stack test covers only its stated sampling train and operating window; it does not establish total fugitive, condensable or other unmeasured material. Waterborne finish is not zero-VOC or zero-hazard. Actual coating/glue/wood/cleanup compounds, water phases and carbon origins require applicable validated identification/quantification and uncertainty; add each genuinely present elementary species as its own row. Total VOC, an SDS list or a mass-balance residual cannot invent a molecular species, natural-air composition or unmeasured zero. No control efficiency or emission factor is assumed."
  - id: measure_normalize
    applies_to: "each input/output except fixed reference"
    required_property_ref:
      name: "Area denominator"
      uuid: ""
    required_unit: "m2"
    rule: "Convert raw extensive units and establish actual A and original Q0 before calc_model. Raw G or Qt uses separate calc_raw only as physical disclosure. Zero/unknown Q0 remains unresolved; there is no second division."
