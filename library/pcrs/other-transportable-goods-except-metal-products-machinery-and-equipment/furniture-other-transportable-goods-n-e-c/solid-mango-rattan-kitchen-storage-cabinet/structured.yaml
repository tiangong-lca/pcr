      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_subdivision | each attributable exchange | First use actual dedicated process records and feasible subdivision or virtual subdivision; include the real function that caused each burden. Physical output and waste quantities remain complete. | jrc-ilcd-attributional-2010 |\n| allocation_causality | genuinely shared remaining burden | Use the exchange-specific determining physical causal relationship with actual material, geometry, time or service constraints. Do not impose mass, footprint area or time as a universal allocation factor. Only genuinely residual non-subdividable burdens without a supported determining relation use actual contemporaneous values at the same condition and process gate. | jrc-ilcd-attributional-2010 |\n| allocation_waste | failures, sales and whole wastes | Ordinary rejects, samples, offcuts or sold waste keep actual attributed production and treatment; sale or outward physical transfer is not automatic other-function transfer or avoided-product credit. Whole receiver Qt is recorded once and treatment-service vectors are distinct by original cohort. | jrc-ilcd-attributional-2010 |\n| allocation_service | performed and unused service | Actual performed old/new-cohort service remains even for cabinets still in stock or failed repairs. Carry only unused/unassigned service once; full physical asset/filter/package transfer is independent from its environmental allocation. Unknown shares stay unresolved. | jrc-ilcd-attributional-2010 |\n\n"
