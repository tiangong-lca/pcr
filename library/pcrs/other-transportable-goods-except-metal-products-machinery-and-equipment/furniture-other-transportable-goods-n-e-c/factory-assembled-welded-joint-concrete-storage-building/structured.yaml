    source_ids: []
  - rule_id: validation_rule_39
    applies_to: "foreground_dataset_conformance"
    rule: "Actual whole interior/exterior stain; keep each differing formulation in a separate row. Cast-in texture is not separate purchased brick cladding. Assay constituents are non-additive subledgers; actual onsite preparation instead records every separately purchased material and real energy/loss."
