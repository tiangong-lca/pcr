    applies_to: "foreground_dataset_conformance"
    rule: "Actual whole purchased grout for floor/wall coving and joints. If mixed onsite from separately purchased ingredients, replace this procurement with the disjoint actual ingredients, preparation energy and loss. Assay constituents are non-additive subledgers; actual onsite preparation instead records every separately purchased material and real energy/loss."
    source_ids: []
  - rule_id: validation_rule_35
    applies_to: "foreground_dataset_conformance"
    rule: "Actual whole patch material for permitted superficial voids, with all failed/unapproved repair consumption retained. It does not authorize structural repair or imply restoration. Assay constituents are non-additive subledgers; actual onsite preparation instead records every separately purchased material and real energy/loss."
