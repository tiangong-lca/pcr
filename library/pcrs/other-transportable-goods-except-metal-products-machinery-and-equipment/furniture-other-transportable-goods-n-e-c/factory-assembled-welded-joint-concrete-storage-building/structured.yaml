    required_unit: "row-specific"
    rule: "Preserve each row native unit and independent full wet mass. kWh * 3.6 = MJ once; integrate only true rates over observed time, never time-multiply an integrated volume. Volume-to-mass requires independent actual-substance density at measured temperature/pressure/composition. Count-to-mass uses independently measured actual configuration mass M with calibration and scope; Item(s) and item are factor-one count aliases. No building kg/item, floor area/height, thickness, density or service life is inferred from a secondary coefficient."
