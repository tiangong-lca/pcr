  - rule_id: validation_rule_40
    applies_to: "foreground_dataset_conformance"
    rule: "Actual whole clear sealer; do not combine with stain, urethane or another weatherproofing preparation. Assay constituents are non-additive subledgers; actual onsite preparation instead records every separately purchased material and real energy/loss."
