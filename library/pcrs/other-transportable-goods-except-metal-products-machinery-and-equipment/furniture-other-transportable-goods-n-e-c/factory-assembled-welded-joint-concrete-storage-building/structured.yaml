    rule: "Whole actual elastomeric joint sealant. A PU filler/foam or liquid wood-floor finish is not verified as this supplied sealant; resin and carrier are not separate purchases. Assay constituents are non-additive subledgers; actual onsite preparation instead records every separately purchased material and real energy/loss."
