  - rule_id: validation_rule_41
    applies_to: "foreground_dataset_conformance"
    rule: "Only actual onsite metal finish or touch-up, excluding paint already embodied in a purchased coated door or vent. Keep whole supplied solvent/solids and actual dry-film loss once. Assay constituents are non-additive subledgers; actual onsite preparation instead records every separately purchased material and real energy/loss."
    source_ids: []
  - rule_id: validation_rule_42
    applies_to: "foreground_dataset_conformance"
    rule: "Conditional actual acid etching before paint; record whole solution mass, measured assay and carrier-water subledger. No prescribed concentration or neutralization recipe is inferred from this methodology. Assay constituents are non-additive subledgers; actual onsite preparation instead records every separately purchased material and real energy/loss."
    source_ids: []
  - rule_id: validation_rule_43
    applies_to: "foreground_dataset_conformance"
    rule: "Only one actual supplied cleaning preparation; supplier composition, washout and outlet state are measured. If cleaning uses water alone this card is absent with evidence. Assay constituents are non-additive subledgers; actual onsite preparation instead records every separately purchased material and real energy/loss."
    source_ids: []
  - rule_id: validation_rule_44
    applies_to: "foreground_dataset_conformance"
    rule: "One actual complete supplied galvanized-steel door/frame/hardware assembly, with the true included hinges/lock/sweep/stop and supplier or local finish scope once. Parts already included are non-additive; real separately supplied pieces need individual cards and measured histories. This concrete whole-article UUID is unresolved; a bare frame/profile or a broad title cannot substitute for the finished supplied kit."
