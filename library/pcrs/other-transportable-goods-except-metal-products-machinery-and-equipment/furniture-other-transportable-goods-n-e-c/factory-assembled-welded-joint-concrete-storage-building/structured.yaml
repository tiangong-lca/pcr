published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Configured cradle-to-first-factory-release inventory for one complete concrete storage-building article with separately disclosed actual original-cohort services"
  allowed_use: "Use only after the actual product/route/provider/measurement/quality scope matches this complete article and the actual data are reviewed"
  excluded_use: "Component or fresh-concrete inventory; installed-building delivery; habitation/energy/fire certification; whole CPC coverage; default factory recipe or service life; unobserved future services"
  required_metadata: "All Required qualifiers; actual configured BOM and complete release; upstream and waste gates; original Qc/H; every native identity restriction"
  required_quality_disclosure: "Actual tests and unresolved quantities/providers; source-specific synthesis; stock and species closure uncertainty; scientific and translation review state"
  update_trigger: "Changed concrete/steel supply formulation; new prestress/insulation/MEP or site-completion route; altered complete gate; provider/property/source change; new measured foreground evidence"
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division. CPC Version 3.0, Structure and Explanatory Notes, 30 June 2025, class 3870 and subclass 38704; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Category context: predominant concrete; broader class includes incomplete essential-character buildings. The present route explicitly selects a complete factory article."
  - id: "cxt-storage-brochure"
    type: "handbook"
    reference: "CXT / L.B. Foster. Multipurpose and Utility Buildings, complete four-page publisher brochure, undated retained edition, pages 2–4; https://lbfoster.com/assets/brochures/cxt-utility-buildings-4page.pdf"
    used_for: "Positive whole storage-building supply; adjacent open-floor utility/containment/post-tensioned and optional insulation/electrical/HVAC contexts kept distinct. Photos are not a measured BOM or geometry."
  - id: "cxt-schweitzer-2023"
    type: "handbook"
    reference: "CXT Incorporated. Schweitzer Multipurpose Building Specifications, revised February 2023, complete 8 pages, especially sections 5–9; https://www.lbfoster.com/assets/datasheets/cxt-precast-buildings/schweitzer_multipurpose_specs-v5.pdf"
    used_for: "Technical synthesis of actual concrete preparation/reinforcement, placing/conditional SCC, cure, patching, welded joints, supplied door/vent and finishes/testing versus installation. Generic vault/toilet wording and electrical TBD do not establish one fitted storage SKU; no numeric recipe/performance transfer."
  - id: "easiset-2008-alternatives"
    type: "handbook"
    reference: "Easi-Set Industries / Shea Concrete. Easi-Set Precast Concrete Buildings, Pre-Assembled or Field Assembled, Section 13120, December 2008, complete 5 pages, sections 1.01, 2.01 and 3; https://sheaconcrete.com/wp-content/uploads/2024/04/standard-specs-1.pdf"
    used_for: "Independent manufacturer counterexample: preassembly versus field assembly, post-tensioned roof/floor and membrane alternative, separate site preparation. Not evidence that CXT storage has these options or the same recipe/order."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook, General guide for Life Cycle Assessment — Detailed guidance, First edition March 2010, sections 7.9.2–7.9.3, PDF pages 275–292 / printed 255–272; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional situations requiring allocation: subdivision/virtual subdivision, exchange-specific determining physical causality and only genuine residual common-process same-state gate market value. Not industrial recipe evidence or universal ILCD approval."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:3a854cdee6dc2f75e85c0a709eb944f31356a75ac63fd52e319bfc68bfb59189"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_8817"
      family: "system_boundary"
      span:
        start:
          offset: 8817
          line: 61
          column: 1
        end:
          offset: 21240
          line: 95
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual separate supplied cement fine sand coarse gravel water steel reinforcement mesh and anchored plates plus whole admixtures/finishes and complete purchased door/vent kits; all suppliers and inbound gates declared |\n| starting_condition_role | foreground_start |\n| product_classification_scope | CPC 3.0:38704; selected complete storage-building route |\n| recursive_input_rule | A bought whole building or bought complete concrete shell does not replace this manufacturing route. A real bought intermediate must enter at its own burden-bearing gate with an explicit disjoint bridge; do not rebuy its concrete/reinforcement. A returned original building retains original Qc and actual incremental work only. |\n| upstream_dataset_requirement | One compatible provider gate per whole supply with actual recipe/form route geography period and packaging/transport scope; unresolved provider is not zero burden |\n| disclosure | Complete configured BOM; source-specific technical synthesis; actual supply/route/quality gate; measured water/mass; stocks and exchange histories; original-cohort services; upstream ownership; exclusions and uncertainty |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| `b_complete` | all processes | Begin with the actual burden-bearing supplies, not packing of a purchased finished building. Retain every actual material-preparation, steel cold-bending/tie or finished-mesh placement, mould/whole-release-agent operation, batching/mixing, placing and real vibration (or evidenced SCC alternative), curing/stripping, permitted patching, welded joint/grout/seal assembly, door/vent fitment, actual finishes and complete-building inspection through first release. Internal panel/slab/module handoffs cancel and never create another Q. | `cxt-schweitzer-2023`; `cxt-storage-brochure` |\n| `b_supply` | all inventory rows | Each purchased formulation or supplied article is acquired once as a whole, including its carrier water, active chemicals, embedded metal, coatings and supplied fixings. Analytical components remain non-additive subledgers. Use either disjoint separate supplies or a reconciled whole/component bridge with internal transfer cancellation; never whole wet article plus the same components again. Actual onsite formulation includes every separately purchased material and real energy/loss. Add every actually present missing material, fuel, molecule, waste or export as a specific card; no hidden other/zero collections. | `cxt-schweitzer-2023`; `jrc-ilcd-2010` |\n| `b_release` | finished_building; service | Q is newly first-quality-released net whole-building mass. Its roof/floor/walls/integral supplies and actual retained water count once, excluding packaging. Released closing FG is already in Q; do not subtract it from manufacturing output or associated assigned manufacture burden. Gross dispatch, return, relocation, reinspection, repaired original goods and internal module handoffs do not create new manufacture. Maintain original Qc/history and actual observed H services even for goods still stored. | `cxt-storage-brochure`; `jrc-ilcd-2010` |\n| `b_water` | manufacture; service | Keep full wet physical mass independently from every burden vector. Independently evidence free/absorbed water, chemically bound/structural water, actual reaction and phase changes, evaporation, liquid outlets and retained wet stocks. Hydration does not create extra wet mass; neither bound water nor carbonation CO2 uptake follows from curing alone. Relevant elements and actual species/media/carbon origins are independent constraints; do not fit two unknowns with one residual or rename COD/VOC/NOx/PM indicators as a molecule. | `cxt-schweitzer-2023`; `jrc-ilcd-2010` |\n| `b_gates` | all processes | Use the disjoint calc_manufacture_gate, calc_fg_gate and complete calc_packaging pools. Match/cancel true internal Q_internal/F_to/F_back and other source/destination crossings once; T_pack is within the packaging pool, not an extra net-building flow. Full asset stocks are already in manufacture and have non-additive fleet subledgers. Real J/H2O remain explicit; X only removes duplicate OTHER same-side observations, never real crossings, C or Q. | `jrc-ilcd-2010`; `cxt-schweitzer-2023` |\n| `b_losses` | manufacture; service | Keep failed/Q=0 production, start-stop, idle, cleanup, samples, testing, real repair/rework and actual treatment, plus raw/WIP/unassigned non-WIP stocks and each inherited exchange vector. Permission, tests and acceptance govern authorization and hold/rejection only: unauthorized or unsuccessful work still consumed real resources and caused real exits. No presumed restoration or new Q. Natural moisture exchange is not a fictitious repair. | `cxt-schweitzer-2023`; `jrc-ilcd-2010` |\n| `b_packaging_assets` | packaging; cp_asset | O + P + I + ER + J_in + H2O_in = C + S + EO + W + J_out + H2O_out. All terms are actual kg for one material/asset pool. O/C are complete wet opening/closing empty, attached WIP, attached FG and reusable stocks. P is new external procurement, I is disjoint supplier-included whole packaging ingress, ER external return received, S full gross shipment-attached export, EO independent external return sent, W whole wet discard. J_in/J_out are independently measured non-water repair/replacement/deposit/residue or other pool transfers not already in those whole legs. H2O_in/H2O_out are independently measured actual water transfers not already embodied in whole legs, including natural adsorption/desorption without repair. Split real wet added/removed materials into disjoint J and water from actual measurements, with no default ratio/density. Full W contains substrate, retained residues and water once; its nested children are not extra J_out/H2O_out unless actually separated before crossing. Matched internal pool transfers cancel without new purchase, service or Q. Raw-observation reconciliation is L_in_observed - X_in = P + I + ER + J_in + H2O_in and L_out_observed - X_out = S + EO + W + J_out + H2O_out. L is an observation-side sum only, never an extra physical exchange/provider demand. Map each X by exact event/component/unit/side to a duplicate OTHER observation already counted once on the same canonical side. Every real J/H2O remains once; X cannot cancel true retained influx, C/O, an opposite-side movement or a nested W child merely because it remains in stock. Disjoint observations use X=0. Internal attachment/reuse is not a boundary crossing. Material transferred from an internal repair/asset pool has matched source/destination entries; its purchase and inherited burden are not repeated. Unknown water/material stays unresolved; do not fit a residual. Actual customer disposal beyond the declared factory/service gate is a separately disclosed downstream event, not a fictional factory W. Keep actual asset/part/installed-fluid gross physical ledgers independent of assigned service vectors; no default life or article mass. | `jrc-ilcd-2010` |\n| `b_later` | all processes | Site earthwork/foundation, outgoing transport, unloading/placement, site utility connection or later use/maintenance are separately identified outside first manufacturing release. Report actually performed factory post-release packing/storage/handling/dispatch/retest/return/rework services by original Qc/H; unknown future services remain unknown. A source supply/warranty or certification statement is not LCA approval or evidence of a performance value. | `cxt-schweitzer-2023`; `cxt-storage-brochure`; `easiset-2008-alternatives` |\n\n### Complete source, whole-native and producer applicability\n\nThe storage brochure positively describes a complete delivered storage building and separately describes open-floor pump/utility structures, containment sumps and post-tensioned containment variants. Its broad final-page pre-plumbed/wired marketing and optional electrical/insulation/HVAC packages do not prove that the selected no-MEP storage configuration has those systems. The February 2023 Schweitzer specification supplies a real concrete preparation, reinforcement, compaction-or-SCC, cure, patch/reject, welded plate/grout/seal joining and door/vent/finish programme. It also uses vault/toilet wording, electrical TBD and source-specific numeric design and test claims. This is explicitly independent technical synthesis of a real complete-storage terminal and an actual fabrication method, not proof that every page describes one measured order or SKU. The independent 2008 Easi-Set example includes field assembly, post-tensioned floor/roof and an EPDM alternative; those are contrary route examples, not inputs to the selected non-prestressed welded-joint method. Actual drawings and supply/route records must admit the chosen configuration; source silence alone does not prove absence of prestress, MEP or another actual operation. No source dimension, strength, dose, cure cycle, life, certification or default weight is transferred.\n\nThe actual whole native reference is a Product flow, production mix at plant, finished manufactured article whose complete English and Chinese comments explicitly include warehouses. Its construction/commercial classification is retained as evidence/counterevidence and does not itself establish CPC38704 mapping. Use its actual Mass/kg reference for the complete predominantly-concrete factory goods-storage building, not an item/area conversion, installed-site handover, concrete panel, utility cover or construction service. It supplies no material recipe, geometry, country, site completion or kg/building. Every actual bound auxiliary must meet its full native hard fields and complete provider gate; no name-only proxy or chosen-language shortcut. Tap water remains reference Mass with an actual secondary Volume meanValue0.001, which is not a measured density or permission to change reference units. Natural coarse gravel, whole Portland cement, actual welded metal mesh, complete supplied water-reducer, PE film and whole wooden load platform retain their actual form/family/route limits; no fine-sand, arbitrary rock, PET, pure additive or loose timber substitution.\n\nThe terminal is the complete factory-assembled floor/roof/all-wall/installed-door/screened-vent storage article before site foundation placement and utility connection. CXT installation provisions and the independent Easi-Set source keep real site preparation, base/soil conditions, truck/crane access, placement and site interfaces visible as later stages. Any actual owned work required before this whole factory supply is finished stays included wherever performed; an unfinished site kit or field-assembled building cannot be relabelled complete to move manufacture out. Actual source tests, concrete sampling/compaction/curing and nonconforming-unit dispositions must be evidenced, while unperformed routine site/lot QA is not evidence that a method does not exist. Complete physical net wet building mass is measured by a calibrated whole-article or fully measured nonoverlapping same-configuration component bridge, including retained water once; no brochure mass, generic density or area-to-kg bridge.\n\nEach actual cement/aggregate/admixture, reinforcement/mesh/anchored plate, door/vent article, grout/seal/finish preparation, utility, asset and package requires a genuine compatible complete producer or a mutually exclusive expanded actual inventory. Include real extraction/calcination/clinker/grinding, aggregate preparation, steel manufacture/forming/welding, formulation manufacture, upstream utilities, maintenance, packaging and wastes as applicable. A supplied door kit/mesh/whole formulation contains its actual hardware/wire/carrier water once. Real purchased wet-concrete or shell intermediates need an independently evidenced disjoint gate and inherited history, never a paper supplier boundary hiding owned batching/casting/joining or replacing the complete required manufacture with finished-building packing. Original provider-embedded inventories and own earlier raw/WIP/asset histories are separate owned vectors, each transferred once. Ordinary unknown supplier quantities/identities stay explicit; unknown essential chemistry/species sampling applicability cannot be waived by future SOP, ordinary QA or a finite pass.\n\n"
