    rule: "Collection captures undivided raw records. raw_units and attribute_vector prepare extensive A_i and full physical V_i before normalization. normalize_once performs A_i/Q_i or V_i/Q_i once; cards and aggregation only reference this same operation. Q_i=Q for manufacture and Q_i=Qc for actual original-cohort services; Q_i=0 retains all burdens with no unit result."
