    applies_to: "foreground_dataset_conformance"
    rule: "Actual supplied whole release preparation for the concrete-contact mould. Supplier oil/emulsion/chemistry and carrier are measured, not inferred from a generic lubricant. Assay constituents are non-additive subledgers; actual onsite preparation instead records every separately purchased material and real energy/loss."
