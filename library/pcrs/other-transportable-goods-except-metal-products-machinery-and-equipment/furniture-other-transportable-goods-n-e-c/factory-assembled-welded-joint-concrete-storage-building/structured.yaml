allocation_rules:
  - rule_id: a_hierarchy
    applies_to: "all inventory rows"
    rule: "Only for attributional cases in which allocation is required by the declared study context: first dedicate data and perform actual or virtual subdivision. For remaining shared exchanges establish the exchange-specific determining physical causal relationship and actual driver. Only genuinely remaining common-process burdens use contemporaneous actual market value of the co-functions at that same process gate, physical state and period. Justify fractions and sensitivity per exchange; no free physical/economic choice, fixed ratio, automatic avoided-production credit or general ILCD-compliance claim."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_history
    applies_to: "all inventory rows"
    rule: "Preserve a physical stock quantity and an inherited extensive-unit vector for every raw, WIP and non-WIP stock. Manufacturing A_i = B_open_i + C_i + T_in_i - B_close_i - T_out_i after actual raw conversion and justified assignment. B_close_i excludes already first-released FG; use only raw/WIP/unused-unassigned stores and do not repeat a stock correction already present in a net issue. Failed goods and waste do not automatically transfer their burdens away; T_out needs an actual other cohort/function and one justified burden handover."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_physical
    applies_to: "all physical movement rows"
    rule: "Physical movement numerators are full measured V_i in their own native units, not A_i, inventory differences, economic fractions, service shares or inherited manufacturing charges. Show V_i/Q for manufacturing-owned movements or V_i/Qc for original-cohort services once. Separately retain actual supply/operation/treatment and justified capital-service vectors with one upstream owner; physical disclosure creates no additional purchase or credit. Only normalize_once divides by product quantity."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_service
    applies_to: "service; packaging; cp_asset"
    rule: "A_service_i_c_H retains actual incremental work already performed for original cohort c over observed H, including stored closing FG, retest and actual rework. Carry only genuinely unused/unassigned service stores; do not defer executed work into unknown future service. Original manufacture/history and delivery reverse remain separately traceable. For an actual mixed Waste record total once with one provider and independently measured originW as non-additive; use real segregated outlets instead only where disjoint."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "Whole-building first release and raw/WIP history"
      record_type: "lot and serialized quality/weighing records"
      raw_fields: "building_id; configuration; actual complete BOM; first_release_time; measured_net_wet_mass; packaging_tare; scale_calibration; moisture_state; test_status; opening_raw; closing_raw; opening_WIP; closing_WIP; non_WIP_pools; each_inherited_exchange_vector; failed_Q_equals_zero; actual_stage_event; original_positive_Q0_Qc; disjoint_original_dispositions; current_wet_stock; full_gross_V; inherited_own_WIP; provider_embedded_owner; full_receiver_Qt; nonoverlapping_cohort_A_vectors; physical_pool_membership; foreground_external_flag; matched_internal_event; nonadditive_child; T_pack_internal_attachment"
      collection_method: "Calibrated complete-building weighing or traceable same-configuration net weighing records, with real tare and contemporaneous release/BOM match. Declare complete drawing and tests before selecting the whole output; reject an incomplete article as Q. Independently survey actual geometry when used, never brochure dimensions. Final aggregation definition: Sum measured unique first-release net masses as Q; 1 kg reference flow; keep raw/WIP and non-WIP exchange vectors separately without subtracting closing released FG. Keep raw full physical quantities, independent actual burden vectors and each own/provider history once; full wet receiver Qt is not a cohort share. Distinguish original positive Q0=Qc from zero-output Q=0."
      unit: "kg"
      frequency: "each unique first release and every stock boundary"
      temporal_coverage: "all attempted lots through first release including failed periods"
      site_scope: "actual configured storage-building factory"
      aggregation_rule: "per reference flow"
      quality_evidence: "BOM/drawing and route; calibration and tare; test/hold records; serial uniqueness; source and stock vector links"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "Each actual atomic supply and formulation"
      record_type: "receipt issue batch and operation records"
      raw_fields: "row_id; supplier; formulation_id; supply_form; raw_quantity; raw_unit; operation; moisture; assay; carrier_water; opening; receipts; closing; issue_basis; inherited_exchange_vector; provider_scope; loss; failed_work; actual_stage_event; original_positive_Q0_Qc; disjoint_original_dispositions; current_wet_stock; full_gross_V; inherited_own_WIP; provider_embedded_owner; full_receiver_Qt; nonoverlapping_cohort_A_vectors; physical_pool_membership; foreground_external_flag; matched_internal_event; nonadditive_child; T_pack_internal_attachment"
      collection_method: "Weigh whole actual supplies and trace meters/receipts to issues and complete-building lots. Separate true purchased ingredients from non-additive assays. Record raw/WIP/unassigned store quantities and per-exchange histories; explicitly state gross occurrence versus already-stock-corrected net issue. Track concrete preparation, rebar/mesh, mould, casting, real compaction/cure, stripping, repair, joint assembly, door/vent fitment and finishes by operation. Final aggregation definition: Keep raw native extensive records undivided; reconcile quantities and justified attribution before normalize_once; report per reference flow by that same one operation. Keep raw full physical quantities, independent actual burden vectors and each own/provider history once; full wet receiver Qt is not a cohort share. Distinguish original positive Q0=Qc from zero-output Q=0."
      unit: "native kg; actual raw unit retained"
      frequency: "each delivery issue and operation"
      temporal_coverage: "all attempts tests cleanup and work on original returned goods"
      site_scope: "actual manufacturing and supply gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Delivery/BOM/SDS/TDS; supplier state/route; assays; disjoint bridge; traceable scales and stock histories"
    - protocol_id: cp_utility
      process_id: "manufacture"
      flow_role: "Each energy fuel water and thermal carrier"
      record_type: "meter interval and supplier agreement"
      raw_fields: "row_id; meter; raw_start; raw_end; raw_unit; interval; true_rate; integrated_quantity; T; P; phase; independent_density; enthalpy_in; enthalpy_return; supplier_heat_water_owner; standby; cleanup; lot; inherited_vector; actual_stage_event; original_positive_Q0_Qc; disjoint_original_dispositions; current_wet_stock; full_gross_V; inherited_own_WIP; provider_embedded_owner; full_receiver_Qt; nonoverlapping_cohort_A_vectors; physical_pool_membership; foreground_external_flag; matched_internal_event; nonadditive_child; T_pack_internal_attachment"
      collection_method: "Collect each meter/whole-fuel issue independently for actual preparation, casting, curing, welding, lifting, tests, start-stop, idle and cleaning. Match voltage/geography/loss boundaries; distinguish rate from integrated readings. Measure each real carrier physical gross mass/state and heat-delivery/return basis with one supplier convention; no invented steam or boiler. Final aggregation definition: Keep raw native extensive records undivided; reconcile quantities and justified attribution before normalize_once; report per reference flow by that same one operation. Keep raw full physical quantities, independent actual burden vectors and each own/provider history once; full wet receiver Qt is not a cohort share. Distinguish original positive Q0=Qc from zero-output Q=0."
      unit: "kg; MJ; original m3 or rate if measured"
      frequency: "each observed meter interval or issue"
      temporal_coverage: "all included actual work and zero-output intervals"
      site_scope: "actual factory and supplier delivery/return gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; real intervals; actual substance density and phase; provider inclusion and water/heat agreement"
    - protocol_id: cp_outlet
      process_id: "manufacture"
      flow_role: "Each actual Waste stream"
      record_type: "weighing composition and transfer manifest"
      raw_fields: "stream_id; origin; gross_wet_mass; solids; water; treatment_provider; destination; actual_treatment; opening; closing; originW; inherited_exchange_vector; segregation_state; actual_stage_event; original_positive_Q0_Qc; disjoint_original_dispositions; current_wet_stock; full_gross_V; inherited_own_WIP; provider_embedded_owner; full_receiver_Qt; nonoverlapping_cohort_A_vectors; physical_pool_membership; foreground_external_flag; matched_internal_event; nonadditive_child; T_pack_internal_attachment"
      collection_method: "Measure complete actual wet stream and destination, including rejected concrete, washout and coating residues. One real mixed stream has one additive total and non-additive independently measured origins, or real disjoint segregated exports. Keep retained wet residue and actual treatment burdens; no Product substitute or default credit. Final aggregation definition: Keep raw native extensive records undivided; reconcile quantities and justified attribution before normalize_once; report per reference flow by that same one operation. Keep raw full physical quantities, independent actual burden vectors and each own/provider history once; full wet receiver Qt is not a cohort share. Distinguish original positive Q0=Qc from zero-output Q=0."
      unit: "native kg plus independent composition"
      frequency: "each generation stock boundary and external transfer"
      temporal_coverage: "all actual generation including failures and cleanup"
      site_scope: "actual generation storage and receiving gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated weights; composition samples; actual receiver; total/origin reconciliation"
    - protocol_id: cp_species
      process_id: "manufacture"
      flow_role: "Actual independent species water and elements"
      record_type: "species-specific measurement and independent balances"
      raw_fields: "species; phase; receiving_medium; gross_in; gross_out; net_transform; carbon_origin; concentration; gas_volume; rate_or_integral; dry_wet_basis; T; P; humidity; independent_reaction; free_water; bound_water; retained_water; element_assay; uncertainty; actual_stage_event; original_positive_Q0_Qc; disjoint_original_dispositions; current_wet_stock; full_gross_V; inherited_own_WIP; provider_embedded_owner; full_receiver_Qt; nonoverlapping_cohort_A_vectors; physical_pool_membership; foreground_external_flag; matched_internal_event; nonadditive_child; T_pack_internal_attachment"
      collection_method: "Identify each actual molecular/particulate species independently, then measure concentration and actual compatible air/gas or liquid amount. Reconcile full wet mass, actual free/structural/reaction/phase water and relevant element balances independently; include atmospheric O2/N2/Ar/H2O gross legs where physically exchanged without treating them as purchases. Do not solve simultaneous unknown evaporation/hydration/carbonation by one residual. Final aggregation definition: Keep raw native extensive records undivided; reconcile quantities and justified attribution before normalize_once; report per reference flow by that same one operation. Keep raw full physical quantities, independent actual burden vectors and each own/provider history once; full wet receiver Qt is not a cohort share. Distinguish original positive Q0=Qc from zero-output Q=0."
      unit: "species kg; measured original gas/liquid units retained"
      frequency: "each actual route and measured interval"
      temporal_coverage: "all actual production loss control and treatment periods"
      site_scope: "actual material and receiving-media boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Species methods/calibration; independent water/element assays; actual uncertainty and unidentified mass retained"
    - protocol_id: cp_asset
      process_id: "manufacture"
      flow_role: "Each actual whole asset part and fluid"
      record_type: "asset stock receipt and service log"
      raw_fields: "article_id; new_used; native_count; measured_net_mass; actual_configuration; opening_spare; closing_spare; installed_open; installed_close; receipt; removal; fluid_charge; gross_exit; inherited_vector; actual_service_driver; driver_denominator; actual_stage_event; original_positive_Q0_Qc; disjoint_original_dispositions; current_wet_stock; full_gross_V; inherited_own_WIP; provider_embedded_owner; full_receiver_Qt; nonoverlapping_cohort_A_vectors; physical_pool_membership; foreground_external_flag; matched_internal_event; nonadditive_child; T_pack_internal_attachment"
      collection_method: "Count the actual configured whole article and weigh independently if mass is needed. Keep full new/used/repair/installed-fluid physical receipt and stock movements separate from its actual assigned manufacture/service vector. Use an evidenced actual duty/capacity relationship for service assignment; no assumed lifetime or item mass. Final aggregation definition: Keep raw native extensive records undivided; reconcile quantities and justified attribution before normalize_once; report per reference flow by that same one operation. Keep raw full physical quantities, independent actual burden vectors and each own/provider history once; full wet receiver Qt is not a cohort share. Distinguish original positive Q0=Qc from zero-output Q=0."
      unit: "item; kg; actual fluid native unit"
      frequency: "each receipt service removal and stock boundary"
      temporal_coverage: "entire observed manufacturing and original-cohort service"
      site_scope: "actual factory asset owner"
      aggregation_rule: "per reference flow"
      quality_evidence: "Register; actual calibrated mass and configuration; physical pools; duty evidence and one upstream charge"
    - protocol_id: cp_packaging
      process_id: "packaging"
      flow_role: "Each named package and all six legs"
      record_type: "component custody and burden ownership"
      raw_fields: "package_id; material; empty_open; WIP_attached_open; FG_attached_open; reusable_open; P; I; ER; S; EO; W; empty_close; WIP_attached_close; FG_attached_close; reusable_close; actual_moisture; internal_reuse; owner; physical_V; inherited_vector; cohort; H; actual_stage_event; original_positive_Q0_Qc; disjoint_original_dispositions; current_wet_stock; full_gross_V; inherited_own_WIP; provider_embedded_owner; full_receiver_Qt; nonoverlapping_cohort_A_vectors; O; C; J_in; J_out; H2O_in; H2O_out; L_in_observed; L_out_observed; X_in; X_out; matched_pool_event; independent_added_removed_wet_composition; physical_pool_membership; foreground_external_flag; matched_internal_event; nonadditive_child; T_pack_internal_attachment"
      collection_method: "Measure each single material/article and every actual external leg, including supplier-included incoming packaging. Trace gross shipment attachments and returns; reconcile empty/WIP/FG/reusable pools and natural moisture independently. Cancel internal reuse and one internal attached transfer; maintain one burden owner and no duplicate upstream procurement. Final aggregation definition: Keep raw native extensive records undivided; reconcile quantities and justified attribution before normalize_once; report per reference flow by that same one operation. Keep raw full physical quantities, independent actual burden vectors and each own/provider history once; full wet receiver Qt is not a cohort share. Distinguish original positive Q0=Qc from zero-output Q=0. O + P + I + ER + J_in + H2O_in = C + S + EO + W + J_out + H2O_out. All terms are actual kg for one material/asset pool. O/C are complete wet opening/closing empty, attached WIP, attached FG and reusable stocks. P is new external procurement, I is disjoint supplier-included whole packaging ingress, ER external return received, S full gross shipment-attached export, EO independent external return sent, W whole wet discard. J_in/J_out are independently measured non-water repair/replacement/deposit/residue or other pool transfers not already in those whole legs. H2O_in/H2O_out are independently measured actual water transfers not already embodied in whole legs, including natural adsorption/desorption without repair. Split real wet added/removed materials into disjoint J and water from actual measurements, with no default ratio/density. Full W contains substrate, retained residues and water once; its nested children are not extra J_out/H2O_out unless actually separated before crossing. Matched internal pool transfers cancel without new purchase, service or Q. Raw-observation reconciliation is L_in_observed - X_in = P + I + ER + J_in + H2O_in and L_out_observed - X_out = S + EO + W + J_out + H2O_out. L is an observation-side sum only, never an extra physical exchange/provider demand. Map each X by exact event/component/unit/side to a duplicate OTHER observation already counted once on the same canonical side. Every real J/H2O remains once; X cannot cancel true retained influx, C/O, an opposite-side movement or a nested W child merely because it remains in stock. Disjoint observations use X=0. Internal attachment/reuse is not a boundary crossing. Material transferred from an internal repair/asset pool has matched source/destination entries; its purchase and inherited burden are not repeated. Unknown water/material stays unresolved; do not fit a residual. Actual customer disposal beyond the declared factory/service gate is a separately disclosed downstream event, not a fictional factory W."
      unit: "native kg; independent wet mass and actual article count"
      frequency: "every real leg and stock boundary"
      temporal_coverage: "all manufacturing and observed Qc/H services"
      site_scope: "actual supply factory custody and external return gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "All six cards; gross attachment weights; independent pool closures; owner and reuse proof"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "Original-cohort observed services and FG"
      record_type: "original release stock delivery return and incremental work"
      raw_fields: "original_building_id; original_Qc; H_start; H_end; FG_open; Q_internal; external_return_current_mass; original_delivery_reverse; F_to; F_back; gross_dispatch; FG_close; waste; sample; X_FG_in; X_FG_out; actual_service_raw; inherited_manufacture_vector; unused_service_vector; actual_stage_event; original_positive_Q0_Qc; disjoint_original_dispositions; current_wet_stock; full_gross_V; inherited_own_WIP; provider_embedded_owner; full_receiver_Qt; nonoverlapping_cohort_A_vectors; O_FG; C_FG; J_FG_in; J_FG_out; H2O_FG_in; H2O_FG_out; raw_FG_observation_duplicates; physical_pool_membership; foreground_external_flag; matched_internal_event; nonadditive_child; T_pack_internal_attachment ; L_FG_in_observed; L_FG_out_observed"
      collection_method: "Track serialized whole original buildings with separate current wet physical movement, original delivery reverse and historical manufacture. Meter all actually executed services including closing stored FG and actual rework, adding each true input/species/Waste under its original cohort. No future unknown service or reinspection creates Q. Final aggregation definition: Keep raw native extensive records undivided; reconcile quantities and justified attribution before normalize_once; report per reference flow by that same one operation. Keep raw full physical quantities, independent actual burden vectors and each own/provider history once; full wet receiver Qt is not a cohort share. Distinguish original positive Q0=Qc from zero-output Q=0. Actual J_FG/H2O_FG are real independent transfers; X_in/out are only exact same-side OTHER duplicate observations, never physical increments or stock corrections."
      unit: "kg; MJ; each actual native unit"
      frequency: "each observed movement work event and H boundary"
      temporal_coverage: "actual elapsed observation horizon H only"
      site_scope: "actual factory post-release account; separately disclosed site work"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original release and delivery IDs; traceable Qc; current wet masses; executed service logs and full inherited vectors"
  calculation_rules:
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Convert each original raw observation to its actual native extensive unit before attribution or product division. kWh * 3.6 = MJ once. Integrate true measured rates only; a cumulative volume is already integrated. Density must independently match that same substance/state; native secondary coefficients are not density measurements. Additional geometry/count conversions require actual configured measurements, no generic building mass."
      inputs:
        - raw_observations
        - actual_units
        - observed_intervals
        - independent_state_conversion
      output: "converted_raw"
      source_ids:
        - jrc-ilcd-2010
    - id: attribute_vector
      applies_to: "all inventory rows"
      rule: "After dedicated assignment/subdivision and justified causal or genuine residual allocation, manufacturing A_i = B_open_i + C_i + T_in_i - B_close_i - T_out_i in each exchange unit. B_close_i is only unreleased raw/WIP/unused-unassigned non-WIP; never released FG. Retain all failed Q=0 startup idle cleanup testing repair and treatment loads in C_i. State whether raw occurrence or stock-adjusted net issue is used and do not correct stocks twice. Each physical pool and each inherited exchange vector are independent. Original-cohort service A_service_i_c_H includes actual executed increments and carries only unused/unassigned stores. All physical movement legs keep full independent V_i, not this burden difference or a share."
      inputs:
        - converted_raw
        - B_open_i
        - C_i
        - T_in_i
        - B_close_i
        - T_out_i
        - original_Qc
        - H
        - actual_service_records
      output: "A_i; A_service_i_c_H; V_i"
      source_ids:
        - jrc-ilcd-2010
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q_i; Q_i = Q for manufacturing or original Qc for actual original-cohort services over H. For a separately disclosed physical movement substitute full native V_i for A_i in this same division. Use Q_i once only; cards and protocol aggregation reference the same result, without another division. Q_i=0 keeps raw records, actual burdens and stocks with no unit result. finished_building is the fixed 1 kg representation of measured unique Q, not a second production or normalization."
      inputs:
        - A_i
        - A_service_i_c_H
        - V_i
        - Q
        - Qc
        - H
        - cp_release
      output: "a_i"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_manufacture_gate
      applies_to: "manufacture"
      rule: "O_M + R_M + F_to + J_M_in + H2O_M_in = C_M + Q_internal + F_back + E_M + J_M_out + H2O_M_out. All terms are complete actual wet kg at the manufacturing gate. O_M/C_M include raw/WIP/unreleased non-WIP and the actual production-asset/installed-fluid stocks physically inside this gate; the asset fleet is a non-additive subledger of these quantities. This gate excludes the separately owned packaging pool and net accepted FG states. R_M/E_M are disjoint complete actual inward/outward crossings of this gate, with every event flagged as a foreground-external transfer or an actual paired internal transfer. They include materials, utilities, gases, receiver wastes and real asset/part/fluid movements once. Q_internal is the unique net new-building first-release handoff; F_to/F_back are original-FG work handoffs, not new production. J_M/H2O_M are independently measured real non-water/water crossings not already contained in those whole legs, never closure residuals. All real internal transfers have matching source/destination IDs and cancel once in the foreground total; only foreground-external events remain exports/imports. Total mass/element closure does not assume each reacting species is conserved."
      inputs:
        - O_M
        - R_M
        - F_to
        - J_M_in
        - H2O_M_in
        - C_M
        - Q_internal
        - F_back
        - E_M
        - J_M_out
        - H2O_M_out
      output: "manufacture_physical_reconciliation"
      source_ids:
        - cxt-schweitzer-2023
        - jrc-ilcd-2010
    - id: calc_fg_gate
      applies_to: "service; packaging"
      rule: "O_FG + Q_internal + R_FG + F_back + J_FG_in + H2O_FG_in = C_FG + G_FG + F_to + W_FG + samples_FG + J_FG_out + H2O_FG_out. O_FG/C_FG include all actual wet net accepted-building states on site: released stock, quarantine/hold, repair/rework and internal use with disjoint membership, separate from original Q0=Qc entitlement. Packages and production assets are excluded from these net-building states. Q_internal matches manufacture once; R_FG is full current-state external return, not the original historical delivery reversal. G_FG is gross net-building dispatch; W_FG and samples_FG are actual whole wet net-building exits. J_FG/H2O_FG are real independent non-water/water transfers not already in those legs, including retained additions and natural uptake/loss without repair. A real component transfer to this gate pairs with its source register; no repeated purchase/history. X only removes exact duplicate OTHER same-side raw observations, never a physical flow, C, Q or real increment. The package pool includes all empty/attached-WIP/attached-FG/reusable states: T_pack is only an internal change of attachment/location inside that pool, not another manufacturing/FG import/export. Combine the disjoint net-building and packaging views by cancelling Q_internal, F_to/F_back and every other true paired internal crossing once. Do not add asset or whole-article constituent subledgers again. Apply the separate complete calc_packaging material pools, then cancel actual matched internal package/asset transfers only once."
      inputs:
        - O_FG
        - Q_internal
        - R_FG
        - F_back
        - J_FG_in
        - H2O_FG_in
        - C_FG
        - G_FG
        - F_to
        - W_FG
        - samples_FG
        - J_FG_out
        - H2O_FG_out
        - cp_service
        - cp_packaging
      output: "FG_package_and_combined_physical_reconciliation"
      source_ids:
        - jrc-ilcd-2010
        - cxt-schweitzer-2023
        - cxt-storage-brochure
    - id: calc_packaging
      applies_to: "each actual package"
      rule: "O + P + I + ER + J_in + H2O_in = C + S + EO + W + J_out + H2O_out. All terms are actual kg for one material/asset pool. O/C are complete wet opening/closing empty, attached WIP, attached FG and reusable stocks. P is new external procurement, I is disjoint supplier-included whole packaging ingress, ER external return received, S full gross shipment-attached export, EO independent external return sent, W whole wet discard. J_in/J_out are independently measured non-water repair/replacement/deposit/residue or other pool transfers not already in those whole legs. H2O_in/H2O_out are independently measured actual water transfers not already embodied in whole legs, including natural adsorption/desorption without repair. Split real wet added/removed materials into disjoint J and water from actual measurements, with no default ratio/density. Full W contains substrate, retained residues and water once; its nested children are not extra J_out/H2O_out unless actually separated before crossing. Matched internal pool transfers cancel without new purchase, service or Q."
      inputs:
        - O
        - P
        - I
        - ER
        - J_in
        - H2O_in
        - C
        - S
        - EO
        - W
        - J_out
        - H2O_out
        - cp_packaging
      output: "packaging_wet_closure"
      source_ids:
        - jrc-ilcd-2010
    - id: water_species_check
      applies_to: "all physical gates"
      rule: "Independently reconcile full wet mass, every relevant element and real molecular/particulate species in each phase. Separate free/absorbed water, chemically bound structural/reaction water, water vapour, liquid outlets and retained wet stock with independent tests and uncertainty. Hydration or carbonation is an actual independently evidenced reaction, never a default uptake/emission factor or residual that fits several unknowns. COD/VOC/NOx/PM measurements remain metrics unless independent speciation proves a named exchange."
      inputs:
        - wet_mass
        - element_assays
        - actual_species
        - phases
        - free_water
        - bound_water
        - reaction_evidence
        - retained_water
        - liquid_outlets
        - humidity
        - uncertainty
      output: "independent_water_element_species_reconciliation"
      source_ids:
        - cxt-schweitzer-2023
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify actual product/formulation/material grade route shape polymer/CAS geography phase media type and complete native property chain. Adopted official names are not supplier approval; empty UUID retains one specific exchange."
      evidence: "Full native direct and support evidence; real BOM and provider match"
    - id: dq_gate
      applies_to: "finished_building"
      requirement: "Prove one complete storage building with roof floor all walls door vent and actual finished state, together with actual non-prestressed welded-joint drawing. No component or generic installed construction can establish this gate."
      evidence: "Whole product supply documents; actual drawing; complete acceptance and weigh record"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Every failure, zero-output interval, test, cleanup, rework and true physical inlet/outlet remains; identify missing real cards and actual unresolved quantities rather than report zero."
      evidence: "Operation and stock ledgers; meter reconciliation; uncertainty register"
    - id: dq_stocks
      applies_to: "all physical gates"
      requirement: "Each physical stock and every inherited exchange vector are complete independently; product/packaging/assets/parts/fluids and actual carrier returns retain full gross movements."
      evidence: "Independent manufacture FG package and combined gates; elemental/water tests"
    - id: dq_sources
      applies_to: "all rules"
      requirement: "Maintain source version and full applicability context; manufacturer numeric limits are not inventory defaults and different publications are not one SKU. Industrial fabrication evidence does not establish allocation."
      evidence: "Full originals and bounded verified context; source-use assessment; attributional ILCD scope"
    - id: dq_period
      applies_to: "service; manufacture"
      requirement: "Measure actual site/period/configuration and original Qc/H; never invent future service, recipe, dimensions, density, kg/item, life, performance, yield or emission factors."
      evidence: "Contemporaneous measured records; actual test status and explicit gaps"
validation_rules:
  - rule_id: v_complete
    applies_to: "finished_building"
    rule: "Require the actual complete storage-building gate, coherent Mass/kg and unique finished_building link, actual first-release Q and disjoint BOM. A raw concrete flow, panel, container or unspecified installed building is insufficient. Missing true core/form/route evidence requires a hold; ordinary auxiliary/provider/future measurement gaps alone do not change the core identity."
    source_ids:
      - cxt-storage-brochure
      - cxt-schweitzer-2023
  - rule_id: v_once
    applies_to: "all inventory rows"
    rule: "Raw collection stays undivided, conversion and real assignment precede the only normalize_once division, and card/aggregation references never divide again. Require finite checking of both languages, complete actual scopes and explicit Q=0 handling; an unsupported relationship stays unresolved."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_physical
    applies_to: "all processes"
    rule: "Check manufacture FG package and combined physical gates independently of burden allocation, including full wet stocks and gross external receipts/returns, all molecular species/media, water phases and actual reaction evidence. A closed aggregate mass residual does not establish two missing species or a second unknown water process."
    source_ids:
      - cxt-schweitzer-2023
      - jrc-ilcd-2010
  - rule_id: v_no_duplicates
    applies_to: "all inventory rows"
    rule: "Check whole formulations/articles and disjoint bridges, each package P/I/ER/S/EO/W and one supplier owner, mixed Waste total versus non-additive originW, physical V versus service/burden A, Q versus original Qc/H, and one actual treatment provider. No automatic coproduct, credit, repeated manufacture or erasure of unauthorized/failed work."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_evidence
    applies_to: "all inventory rows"
    rule: "Each selected native UUID must match the true complete article or named physical/chemical exchange, all native identity restrictions and the exact reference-property/unit-group/reference-unit chain. Preserve official Chinese names, every qualifier, description, source and complete normative context. Source possession or engineering checking does not establish scientific/translation approval, mapping acceptance, certification or publication."
    source_ids:
      - unsd-cpc3-2025
      - cxt-schweitzer-2023
      - jrc-ilcd-2010
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "Q0 denotes the locked positive original first-acceptance cohort mass; Q=0 denotes a zero-output observation. They are different accounts. Original-cohort service uses the same original Q0=Qc and observed H, not a new mass or a second normalization."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "Lock original cohort c and original Q0=Qc=sum(M_e) at unique first conforming whole-building acceptance events e. Each M_e is calibrated complete net wet building kg at that event with the actual integral supplied components once, packaging and test assets excluded. Manufacturing Q is the original Qc of the declared manufacturing cohort. Do not recompute Qc from present surviving mass, net shipment, later reinspection or wet/dry changes. Failed/no-release Q=0 retains all raw loads and no normalized result. Opening raw/WIP carries its measured physical stock and inherited exchange vector once; an opening accepted building retains its original Qc and manufacture history, not a new purchase or acceptance."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "For every original accepted event partition its original-acceptance basis into disjoint net external possession, on-site released FG, quarantine, repair/rework WIP, internal use, irreversible destroyed/lost portions and other documented terminal dispositions. Their current/terminal sum equals original Qc independently of present wet physical mass. Gross dispatch and returns remain complete physical events; a return reverses the corresponding external possession before later redispatch moves the same surviving entitlement. Split partial loss and survival on a documented original basis; do not restore lost water/parts to the survivor and also export the loss. Present wet stocks, evaporation, removed/new parts and all physical exits have their own conservation bridge. Unknown genealogy or cohort assignment stays unresolved with complete raw totals; loops, postacceptance destruction, retest and failed work create no new Q."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Record actual receiver-transfer t and full wet whole outlet Qt once: discarded hardware, packaging, wipe, swab, cloth, filter or equipment substrate plus actually retained solvent, dust, formulation residues and water. Dry substrate, contained chemical and water ledgers are reconciled non-additive children. They become separate external waste exits only after real physical separation before the boundary with separate transfer IDs. Package W or removed-part origins within one mixed outlet are traced children, never a second export or second treatment demand. Actual receiver receipts and total treatment demand remain Qt, independent of environmental attribution."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Assign environmental/service vectors A_tc to nonoverlapping original cohorts from demonstrated causal demand and the allocation hierarchy. Reconcile sum_c(A_tc) plus actual other-function/unassigned vectors to the one actual total provider demand. Physical Qt remains in one event register; reports link to it rather than charge the full event again to each cohort or shrink the physical export by an allocation fraction. Physical V/D context disclosures are non-additive across overlapping reports. Treatment and service inventory is independently assigned A_tc/D, using manufacturing Q or original Qc with observed H; it is not an extra full Qt/D for every cohort. Keep genuinely unknown allocation unresolved. Supplier-embedded history/treatment and fully expanded corresponding direct inventories are mutually exclusive representations, not additive purchases."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "O_M + R_M + F_to + J_M_in + H2O_M_in = C_M + Q_internal + F_back + E_M + J_M_out + H2O_M_out. All terms are complete actual wet kg at the manufacturing gate. O_M/C_M include raw/WIP/unreleased non-WIP and the actual production-asset/installed-fluid stocks physically inside this gate; the asset fleet is a non-additive subledger of these quantities. This gate excludes the separately owned packaging pool and net accepted FG states. R_M/E_M are disjoint complete actual inward/outward crossings of this gate, with every event flagged as a foreground-external transfer or an actual paired internal transfer. They include materials, utilities, gases, receiver wastes and real asset/part/fluid movements once. Q_internal is the unique net new-building first-release handoff; F_to/F_back are original-FG work handoffs, not new production. J_M/H2O_M are independently measured real non-water/water crossings not already contained in those whole legs, never closure residuals. All real internal transfers have matching source/destination IDs and cancel once in the foreground total; only foreground-external events remain exports/imports. Total mass/element closure does not assume each reacting species is conserved."
    source_ids: []
  - rule_id: validation_rule_12
    applies_to: "foreground_dataset_conformance"
    rule: "O_FG + Q_internal + R_FG + F_back + J_FG_in + H2O_FG_in = C_FG + G_FG + F_to + W_FG + samples_FG + J_FG_out + H2O_FG_out. O_FG/C_FG include all actual wet net accepted-building states on site: released stock, quarantine/hold, repair/rework and internal use with disjoint membership, separate from original Q0=Qc entitlement. Packages and production assets are excluded from these net-building states. Q_internal matches manufacture once; R_FG is full current-state external return, not the original historical delivery reversal. G_FG is gross net-building dispatch; W_FG and samples_FG are actual whole wet net-building exits. J_FG/H2O_FG are real independent non-water/water transfers not already in those legs, including retained additions and natural uptake/loss without repair. A real component transfer to this gate pairs with its source register; no repeated purchase/history. X only removes exact duplicate OTHER same-side raw observations, never a physical flow, C, Q or real increment. The package pool includes all empty/attached-WIP/attached-FG/reusable states: T_pack is only an internal change of attachment/location inside that pool, not another manufacturing/FG import/export. Combine the disjoint net-building and packaging views by cancelling Q_internal, F_to/F_back and every other true paired internal crossing once. Do not add asset or whole-article constituent subledgers again."
    source_ids: []
  - rule_id: validation_rule_13
    applies_to: "foreground_dataset_conformance"
    rule: "O + P + I + ER + J_in + H2O_in = C + S + EO + W + J_out + H2O_out. All terms are actual kg for one material/asset pool. O/C are complete wet opening/closing empty, attached WIP, attached FG and reusable stocks. P is new external procurement, I is disjoint supplier-included whole packaging ingress, ER external return received, S full gross shipment-attached export, EO independent external return sent, W whole wet discard. J_in/J_out are independently measured non-water repair/replacement/deposit/residue or other pool transfers not already in those whole legs. H2O_in/H2O_out are independently measured actual water transfers not already embodied in whole legs, including natural adsorption/desorption without repair. Split real wet added/removed materials into disjoint J and water from actual measurements, with no default ratio/density. Full W contains substrate, retained residues and water once; its nested children are not extra J_out/H2O_out unless actually separated before crossing. Matched internal pool transfers cancel without new purchase, service or Q."
    source_ids: []
  - rule_id: validation_rule_14
    applies_to: "foreground_dataset_conformance"
    rule: "Raw-observation reconciliation is L_in_observed - X_in = P + I + ER + J_in + H2O_in and L_out_observed - X_out = S + EO + W + J_out + H2O_out. L is an observation-side sum only, never an extra physical exchange/provider demand. Map each X by exact event/component/unit/side to a duplicate OTHER observation already counted once on the same canonical side. Every real J/H2O remains once; X cannot cancel true retained influx, C/O, an opposite-side movement or a nested W child merely because it remains in stock. Disjoint observations use X=0. Internal attachment/reuse is not a boundary crossing. Material transferred from an internal repair/asset pool has matched source/destination entries; its purchase and inherited burden are not repeated. Unknown water/material stays unresolved; do not fit a residual. Actual customer disposal beyond the declared factory/service gate is a separately disclosed downstream event, not a fictional factory W."
    source_ids: []
  - rule_id: validation_rule_15
    applies_to: "foreground_dataset_conformance"
    rule: "Raw gate observation reconciliation is L_M_in_observed - X_M_in = R_M + F_to + J_M_in + H2O_M_in and L_M_out_observed - X_M_out = Q_internal + F_back + E_M + J_M_out + H2O_M_out. For FG it is L_FG_in_observed - X_FG_in = Q_internal + R_FG + F_back + J_FG_in + H2O_FG_in and L_FG_out_observed - X_FG_out = G_FG + F_to + W_FG + samples_FG + J_FG_out + H2O_FG_out. L terms are observation sums only. Each X is a documented duplicate OTHER observation on that exact event/component/unit/side; the corresponding canonical real crossing remains once, and no X cancels opening/closing stocks, true retained increments or the reference event. Package X_in/out and FG X_FG_in/out are different pool-owned observations, not physical balancing flows. Unknown true transfers stay unresolved, not filled by X."
    source_ids: []
  - rule_id: validation_rule_16
    applies_to: "foreground_dataset_conformance"
    rule: "This PCR defines one bounded manufacturing route for a complete factory-assembled, predominantly concrete storage building used to store goods/supplies. It is a whole manufactured warehouse article, including its concrete floor, walls and roof, steel door/vent assemblies, joined and finished state. The route synthesizes the CXT storage-building supply evidence and the complete Schweitzer reinforced-concrete fabrication specification; it does not assert one current SKU, factory order or universal recipe. Each foreground package must demonstrate its actual complete storage configuration and weld-joint route. The source specification also uses generic vault/toilet language, leaves electrical scope TBD and cites optional systems; those statements do not establish fitted plumbing/electrical/insulation or finished habitation. No numerical design or performance claims transfer from either brochure or historical specification."
    source_ids: []
  - rule_id: validation_rule_17
    applies_to: "foreground_dataset_conformance"
    rule: "Exclude isolated wall panels, floor/roof slabs, beams, columns, pipes, ready-mixed concrete, steel-frame/plastic-faced cabins and freight containers; bare shells, open-floor covers, site-assembled kits, multi-module buildings completed onsite, containment/sump designs, prestressed/post-tensioned alternatives, and plumbing/electrical/HVAC-fitted buildings are outside this selected route. A distinct actual variant needs a renewed complete applicability/BOM/route assessment within this same PCR identity, with every real added atomic flow; no parallel leaf or material PCR is created. Actual departures cannot be hidden as zero. Site foundation, outbound transportation, placement/crane erection, site connections and subsequent use/maintenance/end of life are separate lifecycle modules, with actual post-release factory services retained below."
    source_ids: []
  - rule_id: validation_rule_18
    applies_to: "foreground_dataset_conformance"
    rule: "When constructing a foreground package, declare every Required qualifier in metadata or equivalent fields; an omitted qualifier makes the reference definition incomplete."
    source_ids: []
  - rule_id: validation_rule_19
    applies_to: "foreground_dataset_conformance"
    rule: "Use one actual grey hydraulic Portland-cement powder supply at its supplier gate. Native synonyms include OPC and Type I; the conflicting tile/brick classification does not change the coherent powder identity. Verify actual low-alkali type, supplier and cementitious additions; do not substitute clinker, mortar or a whole precast article. Purchased blended cement contains its own constituents once."
    source_ids: []
  - rule_id: validation_rule_20
    applies_to: "foreground_dataset_conformance"
    rule: "Record the actual separately supplied natural fine aggregate and its mineralogy, grading, free moisture and absorption. Resin-coated sand, coarse gravel and a manufactured sand with a different actual geography or route cannot substitute for this natural fine-aggregate supply."
    source_ids: []
  - rule_id: validation_rule_21
    applies_to: "foreground_dataset_conformance"
    rule: "Use one supplied natural coarse gravel fraction. Native identity describes mostly rounded fragments coarser than sand and typically above 2 mm; this is not a specified #67 grading certificate or a universal size limit. Match the actual specified grading, mineralogy and supply state; do not apply to manufactured sand, recycled aggregate or arbitrary crushed rock."
    source_ids: []
  - rule_id: validation_rule_22
    applies_to: "foreground_dataset_conformance"
    rule: "Only actual treated municipal/potable piped supply; no geographic provider is established by the generic identity. Keep measured mass for mixing, curing, etching, testing and cleaning in separate operation subledgers. Native secondary Volume factor is not a density measurement. Recycled water and formulation carrier water are not purchased again."
    source_ids: []
  - rule_id: validation_rule_23
    applies_to: "foreground_dataset_conformance"
    rule: "Record the actual purchased whole preparation with formulation identifier, carrier water and active-content subledger. Require an actual air-entraining whole preparation with its own supplied identity; a generic chemical mixture or water reducer does not establish that identity."
    source_ids: []
  - rule_id: validation_rule_24
    applies_to: "foreground_dataset_conformance"
    rule: "The native Product family explicitly covers a water-reducing admixture for cementitious mixtures. Count the actual whole supplied preparation once, including carrier water and additives. The identity specifies no recipe, solids, dosage, ASTM performance or factory provider; measure these independently, and do not rebuy active polymer or carrier water."
    source_ids: []
  - rule_id: validation_rule_25
    applies_to: "foreground_dataset_conformance"
    rule: "Record actual reinforcing bars, supplied shape and grade before actual cold bending/tie assembly. Match actual bar versus coil form and grade, without importing another material family's fixed low-alloy chemistry or rolling route into the actual ASTM A615 supply. No prestress, steel fraction or onsite steelmaking is inferred."
    source_ids: []
  - rule_id: validation_rule_26
    applies_to: "foreground_dataset_conformance"
    rule: "Use only one actual finished iron/steel welded wire grid for reinforcement, with actual wire material and ASTM A185 specification documented. The native family includes weaving or welding and several common metals; retain this narrower steel-welded application and no assumed mesh dimensions/coating. Do not buy constituent wire again when a finished mesh is purchased."
    source_ids: []
  - rule_id: validation_rule_27
    applies_to: "foreground_dataset_conformance"
    rule: "One actual supplied plate-and-anchor article cast into the concrete for welded building joints. Its integral anchors are counted in the whole article; raw steel-sheet identities do not establish this supplied finished form. If actual onsite fabrication is chosen instead, use disjoint raw inputs and all real fabrication burdens under a documented bridge."
    source_ids: []
  - rule_id: validation_rule_28
    applies_to: "foreground_dataset_conformance"
    rule: "Conditional on this actual welding consumable crossing the boundary. Preserve its actual formulation/composition, supplied form and usage; a wire, coated electrode and each shielding-gas species are separate alternatives or real co-inputs, never a combined gas or assumed welding recipe."
    source_ids: []
