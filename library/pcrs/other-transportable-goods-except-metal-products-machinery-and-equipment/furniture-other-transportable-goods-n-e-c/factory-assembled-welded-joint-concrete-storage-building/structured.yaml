product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.furniture-other-transportable-goods-n-e-c.factory-assembled-welded-joint-concrete-storage-building"
  classification_refs: "CPC 3.0 38704; narrower product and route boundary"
  covered_products: "Complete factory-assembled non-prestressed reinforced-concrete goods-storage buildings of one declared welded-joint configuration"
  excluded_products: "Exclude isolated wall panels, floor/roof slabs, beams, columns, pipes, ready-mixed concrete, steel-frame/plastic-faced cabins and freight containers; bare shells, open-floor covers, site-assembled kits, multi-module buildings completed onsite, containment/sump designs, prestressed/post-tensioned alternatives, and plumbing/electrical/HVAC-fitted buildings are outside this selected route. A distinct actual variant needs a renewed complete applicability/BOM/route assessment within this same PCR identity, with every real added atomic flow; no parallel leaf or material PCR is created. Actual departures cannot be hidden as zero. Site foundation, outbound transportation, placement/crane erection, site connections and subsequent use/maintenance/end of life are separate lifecycle modules, with actual post-release factory services retained below."
  representative_product: "One complete concrete storage building with floor roof walls installed steel door screened vent and actual finishes"
  production_route: "Raw receipt → actual batching/reinforcement/mould preparation → placing/compaction → real curing → demould/repair → welded joint and grout/seal assembly → supplied door/vent and actual finishes → complete-building tests and first release"
  market_state: "Whole factory product at first quality release before site foundation placement or utility connection; packaging excluded from net product"
functional_unit:
  what: "Provide one declared complete weather-enclosed concrete goods-storage building as a manufactured article"
  how_much: "1 kg of the complete net first-released building; not 1 kg concrete alone or a service per floor area"
  how_well: "Actual drawing/configuration and whole-building inspection requirements; no assumed strength fire resistance insulation air tightness or certification"
  how_long_or_cycle: "Unique first-quality-release event; no service life or use period is assigned"
  reference_flow_link: "finished_building"
system_boundary:
  rules:
    - rule_id: b_complete
      applies_to: "all processes"
      rule: "Begin with the actual burden-bearing supplies, not packing of a purchased finished building. Retain every actual material-preparation, steel cold-bending/tie or finished-mesh placement, mould/whole-release-agent operation, batching/mixing, placing and real vibration (or evidenced SCC alternative), curing/stripping, permitted patching, welded joint/grout/seal assembly, door/vent fitment, actual finishes and complete-building inspection through first release. Internal panel/slab/module handoffs cancel and never create another Q."
      source_ids:
        - cxt-schweitzer-2023
        - cxt-storage-brochure
    - rule_id: b_supply
      applies_to: "all inventory rows"
      rule: "Each purchased formulation or supplied article is acquired once as a whole, including its carrier water, active chemicals, embedded metal, coatings and supplied fixings. Analytical components remain non-additive subledgers. Use either disjoint separate supplies or a reconciled whole/component bridge with internal transfer cancellation; never whole wet article plus the same components again. Actual onsite formulation includes every separately purchased material and real energy/loss. Add every actually present missing material, fuel, molecule, waste or export as a specific card; no hidden other/zero collections."
      source_ids:
        - cxt-schweitzer-2023
        - jrc-ilcd-2010
    - rule_id: b_release
      applies_to: "finished_building; service"
      rule: "Q is newly first-quality-released net whole-building mass. Its roof/floor/walls/integral supplies and actual retained water count once, excluding packaging. Released closing FG is already in Q; do not subtract it from manufacturing output or associated assigned manufacture burden. Gross dispatch, return, relocation, reinspection, repaired original goods and internal module handoffs do not create new manufacture. Maintain original Qc/history and actual observed H services even for goods still stored."
      source_ids:
        - cxt-storage-brochure
        - jrc-ilcd-2010
    - rule_id: b_water
      applies_to: "manufacture; service"
      rule: "Keep full wet physical mass independently from every burden vector. Independently evidence free/absorbed water, chemically bound/structural water, actual reaction and phase changes, evaporation, liquid outlets and retained wet stocks. Hydration does not create extra wet mass; neither bound water nor carbonation CO2 uptake follows from curing alone. Relevant elements and actual species/media/carbon origins are independent constraints; do not fit two unknowns with one residual or rename COD/VOC/NOx/PM indicators as a molecule."
      source_ids:
        - cxt-schweitzer-2023
        - jrc-ilcd-2010
    - rule_id: b_gates
      applies_to: "all processes"
      rule: "Use the disjoint calc_manufacture_gate, calc_fg_gate and complete calc_packaging pools. Match/cancel true internal Q_internal/F_to/F_back and other source/destination crossings once; T_pack is within the packaging pool, not an extra net-building flow. Full asset stocks are already in manufacture and have non-additive fleet subledgers. Real J/H2O remain explicit; X only removes duplicate OTHER same-side observations, never real crossings, C or Q."
      source_ids:
        - jrc-ilcd-2010
        - cxt-schweitzer-2023
    - rule_id: b_losses
      applies_to: "manufacture; service"
      rule: "Keep failed/Q=0 production, start-stop, idle, cleanup, samples, testing, real repair/rework and actual treatment, plus raw/WIP/unassigned non-WIP stocks and each inherited exchange vector. Permission, tests and acceptance govern authorization and hold/rejection only: unauthorized or unsuccessful work still consumed real resources and caused real exits. No presumed restoration or new Q. Natural moisture exchange is not a fictitious repair."
      source_ids:
        - cxt-schweitzer-2023
        - jrc-ilcd-2010
    - rule_id: b_packaging_assets
      applies_to: "packaging; cp_asset"
      rule: "O + P + I + ER + J_in + H2O_in = C + S + EO + W + J_out + H2O_out. All terms are actual kg for one material/asset pool. O/C are complete wet opening/closing empty, attached WIP, attached FG and reusable stocks. P is new external procurement, I is disjoint supplier-included whole packaging ingress, ER external return received, S full gross shipment-attached export, EO independent external return sent, W whole wet discard. J_in/J_out are independently measured non-water repair/replacement/deposit/residue or other pool transfers not already in those whole legs. H2O_in/H2O_out are independently measured actual water transfers not already embodied in whole legs, including natural adsorption/desorption without repair. Split real wet added/removed materials into disjoint J and water from actual measurements, with no default ratio/density. Full W contains substrate, retained residues and water once; its nested children are not extra J_out/H2O_out unless actually separated before crossing. Matched internal pool transfers cancel without new purchase, service or Q. Raw-observation reconciliation is L_in_observed - X_in = P + I + ER + J_in + H2O_in and L_out_observed - X_out = S + EO + W + J_out + H2O_out. L is an observation-side sum only, never an extra physical exchange/provider demand. Map each X by exact event/component/unit/side to a duplicate OTHER observation already counted once on the same canonical side. Every real J/H2O remains once; X cannot cancel true retained influx, C/O, an opposite-side movement or a nested W child merely because it remains in stock. Disjoint observations use X=0. Internal attachment/reuse is not a boundary crossing. Material transferred from an internal repair/asset pool has matched source/destination entries; its purchase and inherited burden are not repeated. Unknown water/material stays unresolved; do not fit a residual. Actual customer disposal beyond the declared factory/service gate is a separately disclosed downstream event, not a fictional factory W. Keep actual asset/part/installed-fluid gross physical ledgers independent of assigned service vectors; no default life or article mass."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_later
      applies_to: "all processes"
      rule: "Site earthwork/foundation, outgoing transport, unloading/placement, site utility connection or later use/maintenance are separately identified outside first manufacturing release. Report actually performed factory post-release packing/storage/handling/dispatch/retest/return/rework services by original Qc/H; unknown future services remain unknown. A source supply/warranty or certification statement is not LCA approval or evidence of a performance value."
      source_ids:
        - cxt-schweitzer-2023
        - cxt-storage-brochure
        - easiset-2008-alternatives
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "The storage brochure positively describes a complete delivered storage building and separately describes open-floor pump/utility structures, containment sumps and post-tensioned containment variants. Its broad final-page pre-plumbed/wired marketing and optional electrical/insulation/HVAC packages do not prove that the selected no-MEP storage configuration has those systems. The February 2023 Schweitzer specification supplies a real concrete preparation, reinforcement, compaction-or-SCC, cure, patch/reject, welded plate/grout/seal joining and door/vent/finish programme. It also uses vault/toilet wording, electrical TBD and source-specific numeric design and test claims. This is explicitly independent technical synthesis of a real complete-storage terminal and an actual fabrication method, not proof that every page describes one measured order or SKU. The independent 2008 Easi-Set example includes field assembly, post-tensioned floor/roof and an EPDM alternative; those are contrary route examples, not inputs to the selected non-prestressed welded-joint method. Actual drawings and supply/route records must admit the chosen configuration; source silence alone does not prove absence of prestress, MEP or another actual operation. No source dimension, strength, dose, cure cycle, life, certification or default weight is transferred."
      source_ids: []
    - rule_id: system_boundary_rule_10
      applies_to: "foreground_system_boundary"
      rule: "The actual whole native reference is a Product flow, production mix at plant, finished manufactured article whose complete English and Chinese comments explicitly include warehouses. Its construction/commercial classification is retained as evidence/counterevidence and does not itself establish CPC38704 mapping. Use its actual Mass/kg reference for the complete predominantly-concrete factory goods-storage building, not an item/area conversion, installed-site handover, concrete panel, utility cover or construction service. It supplies no material recipe, geometry, country, site completion or kg/building. Every actual bound auxiliary must meet its full native hard fields and complete provider gate; no name-only proxy or chosen-language shortcut. Tap water remains reference Mass with an actual secondary Volume meanValue0.001, which is not a measured density or permission to change reference units. Natural coarse gravel, whole Portland cement, actual welded metal mesh, complete supplied water-reducer, PE film and whole wooden load platform retain their actual form/family/route limits; no fine-sand, arbitrary rock, PET, pure additive or loose timber substitution."
      source_ids: []
    - rule_id: system_boundary_rule_11
      applies_to: "foreground_system_boundary"
      rule: "The terminal is the complete factory-assembled floor/roof/all-wall/installed-door/screened-vent storage article before site foundation placement and utility connection. CXT installation provisions and the independent Easi-Set source keep real site preparation, base/soil conditions, truck/crane access, placement and site interfaces visible as later stages. Any actual owned work required before this whole factory supply is finished stays included wherever performed; an unfinished site kit or field-assembled building cannot be relabelled complete to move manufacture out. Actual source tests, concrete sampling/compaction/curing and nonconforming-unit dispositions must be evidenced, while unperformed routine site/lot QA is not evidence that a method does not exist. Complete physical net wet building mass is measured by a calibrated whole-article or fully measured nonoverlapping same-configuration component bridge, including retained water once; no brochure mass, generic density or area-to-kg bridge."
      source_ids: []
    - rule_id: system_boundary_rule_12
      applies_to: "foreground_system_boundary"
      rule: "Each actual cement/aggregate/admixture, reinforcement/mesh/anchored plate, door/vent article, grout/seal/finish preparation, utility, asset and package requires a genuine compatible complete producer or a mutually exclusive expanded actual inventory. Include real extraction/calcination/clinker/grinding, aggregate preparation, steel manufacture/forming/welding, formulation manufacture, upstream utilities, maintenance, packaging and wastes as applicable. A supplied door kit/mesh/whole formulation contains its actual hardware/wire/carrier water once. Real purchased wet-concrete or shell intermediates need an independently evidenced disjoint gate and inherited history, never a paper supplier boundary hiding owned batching/casting/joining or replacing the complete required manufacture with finished-building packing. Original provider-embedded inventories and own earlier raw/WIP/asset histories are separate owned vectors, each transferred once. Ordinary unknown supplier quantities/identities stay explicit; unknown essential chemistry/species sampling applicability cannot be waived by future SOP, ordinary QA or a finite pass."
      source_ids: []
