    rule: "Conditional actual water evaporation only. Purchased UPR crosslinking is not upstream polyester condensation: no reaction-water coefficient is imposed. Distinguish carried free water, phase water and chemically generated water by independent evidence. Native Elementary identity is molecular water vapour CAS7732-18-5 to air unspecified, Mass/kg. Measure actual external evaporation with phase, humidity and observation conditions; it is not purchased steam, liquid effluent or assumed polymerization water. A known external compartment requires the corresponding identity. No water-density conversion for another gas and no fitted evaporation residual hiding unknown solvent loss. No isotope-enriched water, ice or chemically bound-water identity is authorized by noisy synonyms. Record actual gross physical V_r in native units independently of attributable burden A_r and the complete inherited exchange vector. Raw collection is undivided; report_once owns the sole N_r / D_r operation. For physical cards N_r is the full V_r, never an allocation-scaled or stock-net quantity. For utility/service cards it is attributable A_r. For actual external styrene, acetone and molecular H2O vapor, EPA Method320 and its included FTIR Protocol provide an independent extractive vapor-phase programme: actual target/reference spectra or Protocol4.6 preparation, spectral/interferant selection including water, appropriate optical/path/T/P conditions, heated nonreactive transport without condensation, leak/linearity/background/CTS checks, complete raw spectra and residual analysis, independent same-basis gas amount/flow and concentration integration, and analyte-specific transport/matrix validation. Follow its distinct routine QA spike and section13 validation/Method301 bias/precision programme; an ordinary spike does not replace initial validation and its result is not an automatic correction factor. No claim of actual site validation or all vapor/all matrix coverage is made. The progr