allocation_rules:
  - rule_id: a_framework
    applies_to: "all inventory rows"
    rule: "This is attributional inventory construction. First assign dedicated operations and measured exchanges to their actual cohort; subdivide physically or virtually to isolate exclusive exchanges. A compatible prior PCR can supply reusable principles but cannot replace blank-specific applicability. Manufacturing literature supplies no LCA allocation authority."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: a_causal
    applies_to: "all inventory rows"
    rule: "For every genuinely shared remaining exchange identify its determining physical causal relationship to each function; use measured drivers for that exchange and state. Do not freely choose physical versus economic allocation, impose one mass share on all exchanges, or scale gross physical flow by a burden share. Retain driver evidence and uncertainty."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: a_residual
    applies_to: "all inventory rows"
    rule: "Only the remainder without a justifiable determining physical cause uses contemporaneous market values of actual cofunctions in the condition at the same common process gate. Record amounts, state, currency, period, price sources and residual denominator; missing comparable value leaves allocation unresolved. No fixed ratio, automatic avoided-production credit or burden transfer on scrap sale. Waste status and actual treatment responsibility remain explicit."
    source_ids:
      - ilcd-attributional-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "make_blank"
      flow_role: "released_blank"
      record_type: "acceptance and net weighing"
      raw_fields: "cohort; drawing revision; blank dimensions; cure and conditioning state; acceptance event; original release history; gross kg; tare kg; net Q; count if used; measured same-configuration M; uncertainty"
      collection_method: "First acceptance is after all actual same-configuration mixing, centrifugal casting, punching, curing/hardening, conditioning, blank inspection/rework and required supply packing, ready for supply at the plant. Q (also Q0 or original Qc for cohort c) is independently measured unique first accepted complete-blank net kg, with actual retained resin constituents/water once and measured detachable packaging tare excluded. Initial required packing belongs to new manufacture; later storage/repacking/redelivery/repair/retest is only actual service of the original cohort in H. Actual count-to-mass uses independently measured same-configuration M with sampling/uncertainty, never a catalogue blank weight. Independently verify Q0 = D0_c + FG0_c + Held0_c + L0_c + T0_c, with disjoint remaining original-material deliveries, released on-site FG, every other actual accepted on-site state, irreversible original material/water losses, and other terminal dispositions. Subdivide those bins for every real location/status; gross delivery/return loops cancel only in this event bridge. Record each original-material fate once on its locked acceptance basis. Independently bridge each surviving present wet mass to original matter still present plus real retained later non-water material and water changes. Do not restore a lost original mass into a survivor and also retain it in L0_c. New material/sorbed water creates physical mass, not new Q. Q0=0 or unknown retains all raw loads and no normalized result."
      unit: "kg"
      frequency: "each batch and every first-release event"
      temporal_coverage: "complete production cohort including failed and zero-output periods"
      site_scope: "declared casting site and configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; gross/tare tickets; buyer drawing; complete lot release ledger"
    - protocol_id: cp_materials
      process_id: "make_blank"
      flow_role: "individual product supply and return"
      record_type: "weighing and supply trace"
      raw_fields: "row_id; lot; whole supplied formulation; gross native input V; external return V; raw stock opening/closing; unused non-WIP; WIP state; per-flow inherited vectors; actual additions; supplier; composition subaccounts; already-net flag"
      collection_method: "Reconcile measured receipts/issues/returns against stock records and formulation ownership; retain every actual material and complete raw/WIP vector. No procurement duplicate for constituent assays."
      unit: "native units"
      frequency: "every issue return and stock boundary"
      temporal_coverage: "whole cohort including cleanup failures and rework"
      site_scope: "actual supply and manufacturing gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier documents; batch recipe; scale tickets; full stock histories"
    - protocol_id: cp_energy
      process_id: "make_blank"
      flow_role: "make_electricity"
      record_type: "meter and event log"
      raw_fields: "meter id; original kWh or MJ; genuine rate and duration if any; supply geography voltage mix; operation event; failed/idle/cleanup/rework; driver; cohort; uncertainty"
      collection_method: "Use actual meter intervals and event logs; integrate only genuine power rate. Record exclusive versus shared use before actual causal allocation."
      unit: "kWh; MJ"
      frequency: "meter interval and operation event"
      temporal_coverage: "all cohort operations and idle periods"
      site_scope: "declared supply meter and machine/support scope"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; interval reconciliation; supply contract; driver evidence"
    - protocol_id: cp_species
      process_id: "make_blank"
      flow_role: "individual elementary emission"
      record_type: "species and external-gate measurement"
      raw_fields: "row_id; actual molecule or particle; CAS if molecular; external medium and compartment; composition; actual integrated volume or rate; duration only for rate; T; P; humidity; independent density; captured fraction; gross V; uncertainty"
      collection_method: "For actual external styrene, acetone and molecular H2O vapor, EPA Method320 and its included FTIR Protocol provide an independent extractive vapor-phase programme: actual target/reference spectra or Protocol4.6 preparation, spectral/interferant selection including water, appropriate optical/path/T/P conditions, heated nonreactive transport without condensation, leak/linearity/background/CTS checks, complete raw spectra and residual analysis, independent same-basis gas amount/flow and concentration integration, and analyte-specific transport/matrix validation. Follow its distinct routine QA spike and section13 validation/Method301 bias/precision programme; an ordinary spike does not replace initial validation and its result is not an automatic correction factor. No claim of actual site validation or all vapor/all matrix coverage is made. The programme exists; ordinary unperformed site/reference/QA work is a study requirement, while an actually inapplicable or unestablished necessary procedure stays a specific hold. It does not measure crosslinked polymer particles or liquid condensate as gaseous monomer. Retain the actual Method320 printed inconsistency: §9.2.3 equation3 shows tracer_spiked/tracer_standard but calls DF at least10; equation4 uses it as a mixing fraction. Do not copy that incompatible reciprocal convention. This PCR’s explicit independent dimensional synthesis is k=(tracer_spiked-tracer_native)/(tracer_standard-tracer_native) on the same actual molar wet/dry basis, with distinct nonzero endmembers, conservative tracer and 0<k<1; C_expected=k*C_standard+(1-k)*C_native. A reciprocal dilution ratio is1/k and is not substituted for k. Retain actual flows, endmember/background and field recovery evidence; the illustration is not a tracer dose or SF6-use requirement, recipe or performed QA. For spectra use the source’s actual path/temperature/pressure correction; mass emission integrates actual matching-state concentration and gas amount once, never a second time multiplier for an already integrated volume. Method18 is contrary scope evidence, not an unconditional styrene method: §1.2.2 excludes high-molecular-weight polymers, compounds that can polymerize before analysis, and very-low-vapor-pressure compounds. Its GC detector programme alone does not close a polymerizing sample’s preservation. Method4 independently distinguishes accurate reference moisture determination from approximate setup estimates and warns of saturated/droplet positive bias; condensed organic-rich liquid is not automatically pure water. Quantitative FTIR water requires its actual Protocol4.6 quantitative reference, not merely a water-interference spectrum. Total VOC, exposure concentration, COD and total PM are not styrene/acetone/polyester species masses. A real polymer-specific particulate claim requires its established identification/recovery/matrix programme; absent that, keep the affected actual claim on hold rather than label all collected PM as UPR. No measured blank-production result follows from any of these method documents."
      unit: "native units; kg"
      frequency: "representative operation and all exceptional events"
      temporal_coverage: "actual mixing casting cure cleanup and handling observations"
      site_scope: "declared external air/liquid gate and process"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling calibration; speciation; medium state; uncertainty; independent water evidence"
    - protocol_id: cp_outlets
      process_id: "make_blank"
      flow_role: "each waste outlet"
      record_type: "receiver and measured waste lot"
      raw_fields: "outlet id; physical mixture id; origin subaccounts; gross wet V; tare; actual species and moisture; waste status; receiver; recovered internal transfer; opening/closing waste stock; inherited vector"
      collection_method: "One actual whole cured-scrap, uncured-mixture, spent-acetone, aqueous-waste, contaminated cloth/filter, discarded liner/carton or retired tool/equipment receiver event has complete wet Qt, substrate plus all retained resin/solvent/residue/water once. Nested origin/species/assay masses are not additional exports until actually separated. The actual receiver/provider gets full physical Qt once in its own compatible unit. Separately retain total actual modelling-service demand and nonoverlapping A_e,c for every serviced original Qc or actual new Q. Never reduce physical Qt by an attribution share, add retained solvent/water again, charge full Qt anew to every cohort or infer recycling credit. Unknown A remains unresolved with the complete physical event/history retained."
      unit: "kg"
      frequency: "every outlet and stock boundary"
      temporal_coverage: "complete cohort and actual treatment observation"
      site_scope: "actual waste collection and receiver interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; manifest; receiver acceptance; species/element evidence"
    - protocol_id: cp_fg
      process_id: "post_release"
      flow_role: "fg_received; fg_return_received; fg_dispatched; fg_electricity"
      record_type: "released-stock and service ledger"
      raw_fields: "original cohort; original Qc; H; internal received; opening/closing FG; every inherited exchange vector; gross shipment; external product returns; repeated inspection; real incremental rework; actual energy; raw native V; attributable A"
      collection_method: "Follow actual released units through held stock, packing, storage, handling, dispatch and returns. Keep already executed service even on held FG. Pair internal transfers and original release records; H is observation only and future service unknown."
