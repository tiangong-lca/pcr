    rule: "Actual physical internal receipt of previously first-released blanks, with original Qc and inherited burden vector. Cancel the paired manufacturing-to-FG transfer in the consolidated gate; do not create Q on receipt or inspection. Native identity is one manufactured finished part at plant in a production mix; its family explicitly includes button blanks. This card selects only a complete solid nonfoamed unreinforced unpigmented cured unsaturated-polyester sheet-punched blank with no sewing holes or final button machining. It is not resin, a sheet, a moulding machine, an assortment, a finished button or a zipper. The native family fixes no resin grade, dimensions, geography or item mass; actual supply and acceptance records must establish these qualifiers. Native reference property is Mass, not item count. Record actual gross physical V_r in native units independently of attributable burden A_r and the complete inherited exchange vector. Raw collection is undivided; report_once owns the sole N_r / D_r operation. For physical cards N_r is the full V_r, never an allocation-scaled or stock-net quantity. For utility/service cards it is attributable A_r."
