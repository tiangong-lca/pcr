    rule: "One actual segregated cured solid outlet with measured gross wet mass and contamination/substance subaccounts. No thermoplastic remelt return is assumed for crosslinked resin. Sale retains actual Waste status and no automatic burden transfer or credit. Record actual gross physical V_r in native units independently of attributable burden A_r and the complete inherited exchange vector. Raw collection is undivided; report_once owns the sole N_r / D_r operation. For physical cards N_r is the full V_r, never an allocation-scaled or stock-net quantity. For utility/service cards it is attributable A_r. One actual whole cured-scrap, uncured-mixture, spent-acetone, aqueous-waste, contaminated cloth/filter, discarded liner/carton or retired tool/equipment receiver event has complete wet Qt, substrate plus all retained resin/solvent/residue/water once. Nested origin/species/assay masses are not additional exports until actually separated. The actual receiver/provider gets full physical Qt once in its own compatible unit. Separately retain total actual modelling-service demand and nonoverlapping A_e,c for every serviced original Qc or actual new Q. Never reduce physical Qt by an attribution share, add retained solvent/water again, charge full Qt anew to every cohort or infer recycling credit. Unknown A remains unresolved with the complete physical event/history retained."
