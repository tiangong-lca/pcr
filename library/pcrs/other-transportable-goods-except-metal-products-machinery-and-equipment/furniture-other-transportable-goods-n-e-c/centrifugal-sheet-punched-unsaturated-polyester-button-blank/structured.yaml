  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert each raw amount to its native row unit before attribution. kWh * 3.6 = MJ. Integrate genuine rates once; do not integrate an already integrated volume. Use independent same-state density or same-configuration measured blank M only where needed; preserve raw value/unit, conversion and uncertainty."
      inputs:
        - raw_value
        - raw_unit
        - measured_state
        - independent_conversion
        - cp_release
      output: "converted_raw"
      source_ids: []
    - id: trace_cohort
      applies_to: "all inventory rows"
      rule: "Preserve full gross physical V separately from attributable A. Assign dedicated exchanges then subdivide, identify exchange-specific determining physical causality, and allocate only genuinely residual common-gate burdens by comparable actual-state market value. Trace each raw/non-WIP/WIP/FG/return vector through opening and closing history; already-net amounts are not adjusted twice."
      inputs:
        - converted_raw
        - inherited_vectors
        - physical_V
        - actual_driver
        - cp_materials
        - cp_fg
      output: "N_r; cohort_id"
      source_ids:
        - ilcd-attributional-allocation-2010
    - id: select_denominator
      applies_to: "all inventory rows"
      rule: "D_r = Q for a new first-release cohort or D_r = original Qc for actual subsequent services/physical movements. Q and Qc are net first-release kg, never gross shipment or service observation H. When D_r is nonpositive retain actual raw loads and do not emit a unit result. No repeat release from dispatch, reinspection or return."
      inputs:
        - cp_release
        - cp_fg
        - original_cohort_id
        - Q
        - Qc
      output: "D_r"
      source_ids: []
    - id: report_once
      applies_to: "all inventory rows"
      rule: "x_r = N_r / D_r. Physical cards use full gross V_r as N_r; utility/service burden cards use traced A_r. D_r is the positive cohort release kg from select_denominator. Divide once after raw conversion and real attribution; card amounts and protocol aggregation reference x_r without another division. The actual provider rows upr_supply/mekp_supply/cobalt_supply/styrene_supply/wax_supply/acetone_supply/water_supply and each _burden row select actual compatible attributable A_r as N_r. Gross physical/waste/air-exit rows retain complete V_r; actual compatible provider-service demand is assigned separately without overlap and is never purchased again merely because a physical leg is disclosed."
      inputs:
        - N_r
        - D_r
        - convert_raw
        - trace_cohort
        - select_denominator
      output: "x_r"
