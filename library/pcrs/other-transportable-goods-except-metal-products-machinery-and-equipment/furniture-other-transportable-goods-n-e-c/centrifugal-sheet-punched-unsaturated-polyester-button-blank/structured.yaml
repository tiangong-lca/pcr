    - id: tracer_fraction
      applies_to: "actual FTIR dynamic spike"
      rule: "k = (tracer_spiked - tracer_native) / (tracer_standard - tracer_native); C_expected = k*C_standard + (1-k)*C_native. Retain the actual Method320 printed inconsistency: §9.2.3 equation3 shows tracer_spiked/tracer_standard but calls DF at least10; equation4 uses it as a mixing fraction. Do not copy that incompatible reciprocal convention. This PCR’s explicit independent dimensional synthesis is k=(tracer_spiked-tracer_native)/(tracer_standard-tracer_native) on the same actual molar wet/dry basis, with distinct nonzero endmembers, conservative tracer and 0<k<1; C_expected=k*C_standard+(1-k)*C_native. A reciprocal dilution ratio is1/k and is not substituted for k. Retain actual flows, endmember/background and field recovery evidence; the illustration is not a tracer dose or SF6-use requirement, recipe or performed QA. For spectra use the source’s actual path/temperature/pressure correction; mass emission integrates actual matching-state concentration and gas amount once, never a second time multiplier for an already integrated volume."
      inputs:
        - "actual same-basis tracer and analyte endmembers"
        - "actual flow and spectra"
        - cp_species
      output: "k; C_expected"
      source_ids:
        - epa-method320
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Every actual whole supplied article and native material, form, route, geography, type and medium restriction must agree. Auxiliary unknown UUID/provider is disclosed; a hard core mismatch blocks applicability and cannot be repaired by the CPC label."
      evidence: "Full native identity and exact unit chains; actual supply and acceptance records"
    - id: dq_raw
      applies_to: "all inventory rows"
      requirement: "This cure is actual radical crosslinking of a supplied UPR formulation, not new upstream polyester condensation by assumption. Track actual monomer incorporation, retained unreacted monomer, evaporation, initiator decomposition and every real species generation/consumption separately from total wet mass and element conservation. For each reacting molecular species record opening + actual inputs + independently evidenced generation = closing + actual outputs + independently evidenced consumption; do not conserve styrene monomer as if cured polymer were unchanged monomer or impose condensation water. Whole volatile-containing waste and captured condensate remain whole physical receivers. Actual specimen integrity, hardening and machinability acceptance is mechanical/buyer evidence; no residual-monomer chemical limit, universal hardness or time/temperature is invented. If an actual grade requires a chemical assay, its real matrix-specific procedure must exist before that claim is completed. For actual external styrene, acetone and molecular H2O vapor, EPA Method320 and its included FTIR Protocol provide an independent extractive vapor-phase programme: actual target/reference spectra or Protocol4.6 preparation, spectral/interferant selection including water, appropriate optical/path/T/P conditions, heated nonreactive transport without condensation, leak/linearity/background/CTS checks, complete raw spectra and residual analysis, independent same-basis gas amount/flow and concentration integration, and analyte-specific transport/matrix validation. Follow its distinct routine QA spike and section13 validation/Method301 bias/precision programme; an ordinary spike does not replace initial validation and its result is not an automatic correction factor. No claim of actual site validation or all vapor/all matrix coverage is made. The programme exists; ordinary unperformed site/reference/QA work is a study requirement, while an actually inapplicable or unestablished necessary procedure stays a specific hold. It does not measure crosslinked polymer particles or liquid condensate as gaseous monomer. Method18 is contrary scope evidence, not an unconditional styrene method: §1.2.2 excludes high-molecular-weight polymers, compounds that can polymerize before analysis, and very-low-vapor-pressure compounds. Its GC detector programme alone does not close a polymerizing sample’s preservation. Method4 independently distinguishes accurate reference moisture determination from approximate setup estimates and warns of saturated/droplet positive bias; condensed organic-rich liquid is not automatically pure water. Quantitative FTIR water requires its actual Protocol4.6 quantitative reference, not merely a water-interference spectrum. Total VOC, exposure concentration, COD and total PM are not styrene/acetone/polyester species masses. A real polymer-specific particulate claim requires its established identification/recovery/matrix programme; absent that, keep the affected actual claim on hold rather than label all collected PM as UPR. No measured blank-production result follows from any of these method documents."
      evidence: "Raw records; calibration; independent assays and uncertainty"
    - id: dq_vectors
      applies_to: "make_blank; post_release"
      requirement: "Close manufacture, FG and consolidated physical gates and every inherited exchange vector independently. Preserve raw versus WIP versus unused non-WIP and previous FG history; one mixed W/provider and nonadditive origins."
      evidence: "Complete stock/event vectors; packaging pools; receiver and physical/species records"
    - id: dq_sources
      applies_to: "all inventory rows"
      requirement: "The sources support a transparent qualitative technical synthesis of a real blank terminal and selected sheet route; they are not one SKU, factory order, yield range, modern emission measurement or allocation approval. Preserve relevant alternatives and source limits."
      evidence: "Complete source originals and context; source-specific applicability reasoning"
