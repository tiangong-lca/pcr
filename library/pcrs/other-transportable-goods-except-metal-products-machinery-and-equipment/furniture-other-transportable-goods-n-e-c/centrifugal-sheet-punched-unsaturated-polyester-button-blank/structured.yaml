  - rule_id: validation_rule_53
    applies_to: "foreground_dataset_conformance"
    rule: "This cure is actual radical crosslinking of a supplied UPR formulation, not new upstream polyester condensation by assumption. Track actual monomer incorporation, retained unreacted monomer, evaporation, initiator decomposition and every real species generation/consumption separately from total wet mass and element conservation. For each reacting molecular species record opening + actual inputs + independently evidenced generation = closing + actual outputs + independently evidenced consumption; do not conserve styrene monomer as if cured polymer were unchanged monomer or impose condensation water. Whole volatile-containing waste and captured condensate remain whole physical receivers. Actual specimen integrity, hardening and machinability acceptance is mechanical/buyer evidence; no residual-monomer chemical limit, universal hardness or time/temperature is invented. If an actual grade requires a chemical assay, its real matrix-specific procedure must exist before that claim is completed."
    source_ids: []
  - rule_id: validation_rule_54
    applies_to: "foreground_dataset_conformance"
    rule: "For actual external styrene, acetone and molecular H2O vapor, EPA Method320 and its included FTIR Protocol provide an independent extractive vapor-phase programme: actual target/reference spectra or Protocol4.6 preparation, spectral/interferant selection including water, appropriate optical/path/T/P conditions, heated nonreactive transport without condensation, leak/linearity/background/CTS checks, complete raw spectra and residual analysis, independent same-basis gas amount/flow and concentration integration, and analyte-specific transport/matrix validation. Follow its distinct routine QA spike and section13 validation/Method301 bias/precision programme; an ordinary spike does not replace initial validation and its result is not an automatic correction factor. No claim of actual site validation or all vapor/all matrix coverage is made. The programme exists; ordinary unperformed site/reference/QA work is a study requirement, while an actually inapplicable or unestablished necessary procedure stays a specific hold. It does not measure crosslinked polymer particles or liquid condensate as gaseous monomer."
    source_ids: []
  - rule_id: validation_rule_55
    applies_to: "foreground_dataset_conformance"
    rule: "Retain the actual Method320 printed inconsistency: §9.2.3 equation3 shows tracer_spiked/tracer_standard but calls DF at least10; equation4 uses it as a mixing fraction. Do not copy that incompatible reciprocal convention. This PCR’s explicit independent dimensional synthesis is k=(tracer_spiked-tracer_native)/(tracer_standard-tracer_native) on the same actual molar wet/dry basis, with distinct nonzero endmembers, conservative tracer and 0<k<1; C_expected=k*C_standard+(1-k)*C_native. A reciprocal dilution ratio is1/k and is not substituted for k. Retain actual flows, endmember/background and field recovery evidence; the illustration is not a tracer dose or SF6-use requirement, recipe or performed QA. For spectra use the source’s actual path/temperature/pressure correction; mass emission integrates actual matching-state concentration and gas amount once, never a second time multiplier for an already integrated volume."
    source_ids: []
  - rule_id: validation_rule_56
    applies_to: "foreground_dataset_conformance"
    rule: "Method18 is contrary scope evidence, not an unconditional styrene method: §1.2.2 excludes high-molecular-weight polymers, compounds that can polymerize before analysis, and very-low-vapor-pressure compounds. Its GC detector programme alone does not close a polymerizing sample’s preservation. Method4 independently distinguishes accurate reference moisture determination from approximate setup estimates and warns of saturated/droplet positive bias; condensed organic-rich liquid is not automatically pure water. Quantitative FTIR water requires its actual Protocol4.6 quantitative reference, not merely a water-interference spectrum. Total VOC, exposure concentration, COD and total PM are not styrene/acetone/polyester species masses. A real polymer-specific particulate claim requires its established identification/recovery/matrix programme; absent that, keep the affected actual claim on hold rather than label all collected PM as UPR. No measured blank-production result follows from any of these method documents."
    source_ids: []
  - rule_id: validation_rule_57
    applies_to: "foreground_dataset_conformance"
    rule: "Initial required packing and equipment custody are real manufacturing support with provider/electricity demand assigned to new Q; later original-FG services use original Qc and actual H. Allocate one meter, fleet or packaging history across actual disjoint events without a duplicate purchase/measurement. The retained machine process ID post_release never moves real preacceptance manufacturing burdens outside the first-release boundary."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Input of complete supplied blank into later button manufacturing; retain full state/route/reference qualifiers"
  allowed_use: "Compatible solid UPR sheet-punched cured blank of declared configuration and supply, with completed foreground measurements"
  excluded_use: "Whole finished buttons or zippers; raw resin; generic plastics sheets; alternative blank routes; garment-life comparison without additional function evidence"
  required_metadata: "actual site geography period and cohort; buyer blank drawing dimensions and acceptance plan; solid nonfoamed unreinforced unpigmented cured UPR blank; centrifugal sheet casting and punching only; no holes and no finished-button machining; whole supplied UPR grade formulation and upstream owner; each actual independently added preparation and supply state; actual cure conditioning and machinability evidence; unique first-release net Q and tare history; same-configuration measured count-to-mass method if used; raw non-WIP WIP and FG physical stocks and every inherited exchange vector; all failures zero output cleanup rework and repeat tests; original Qc observed FG service horizon H and gross movements; each packaging pool gross shipment return and waste ledger; independent species water phases and material element balances; native flow provider compatibility and allocation uncertainty"
  required_quality_disclosure: "Raw units/conversions; complete per-flow vectors; Q/Qc/H; unknown provider/aux identities; source scope; actual species, packaging, allocation and uncertainty"
  update_trigger: "Changed resin formulation, sheet route, curing/acceptance endpoint, supplied blank state, native restriction, actual supplier or measured foreground evidence"
data_sources:
  - id: "jindal-polyester-casting"
    type: "extension_guidance"
    reference: "Jindal Polybuttons, Polyester; https://www.jindalbuttons.com/polyester.html"
    used_for: "Complete manufacturer process page: centrifugal sheet casting, punching soft sheet and curing hard blanks; adjacent rod-casting alternative is excluded. Qualitative route only; no recipe or cure schedule."
  - id: "pfb-polyester-blanks"
    type: "extension_guidance"
    reference: "Plastics for Buttons S.r.l., Company; https://plasticsforbuttons.com/en/company/"
    used_for: "Primary commercial production of polyester blanks for buttons/accessories; supports a real separately supplied blank terminal. Does not identify the Jindal route, a common SKU or a transaction-specific acceptance limit."
  - id: "classic-button-process"
    type: "extension_guidance"
    reference: "Classic Buttons, Manufacturing process; https://classicbuttons.in/process-for-making-plastic-polyester-buttons-manufacturing-for-garments/"
    used_for: "Whole manufacturer page distinguishes sheet/blanking, downstream turning, polishing and final-button inspection; identifies candidate separate styrene/cobalt/wax roles. Those later finished-button operations are excluded, not transferred into blank Q."
  - id: "epa-polyester-fabrication"
    type: "official_guidance"
    reference: "US EPA AP-42 §4.4 Polyester Resin Plastic Products Fabrication, 02/2007 with 2008 table update; https://www.epa.gov/sites/default/files/2020-10/documents/c04s04.pdf"
    used_for: "Full primary PDF: supplied liquid resin versus upstream synthesis, crosslinking versus condensation, initiator and actual solvent/species questions. Figure4.4-1 and adjacent reinforced-process counterexamples limit use. No composite emission factor, monomer fraction or dose is adopted."
  - id: "ilcd-attributional-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA, Detailed guidance, first edition March2010, §§7.9.2–7.9.3; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision/virtual subdivision, exchange-specific determining physical causality and genuinely residual actual-state common-gate market value. No free allocation choice or fixed ratios."
  - id: "samrat-button-resin"
    type: "extension_guidance"
    reference: "Samrat Poly Resins, Button Grade Resin; https://samratpolyresins.in/products/button-grade-resin/"
    used_for: "Primary example of liquid button-casting UPR supply, MEKP and cobalt-octoate cure roles. Specific advertised recipe, styrene fraction, cure timing, storage and drum quantities are not generalized or adopted. Does not establish a particular sheet route or common plant."
  - id: "epa-method320"
    type: "official_guidance"
    reference: "US EPA Method320 and included FTIR Protocol,1/14/2019 complete original. https://www.epa.gov/sites/default/files/2019-06/documents/method_320.pdf"
    used_for: "Actual IR-active vapor programme, reference preparation, heated full transport, spectral/matrix validation/QA and source printed DF inconsistency; independent dimensional synthesis, no performed study or universal matrix coverage."
  - id: "epa-method18-counter"
    type: "official_guidance"
    reference: "US EPA Method18,04/01/2025 Internet copy, complete40page original; §§1.2.2/8–13. https://www.epa.gov/system/files/documents/2025-04/m-18-04012025_0.pdf"
    used_for: "Real GC scope exclusion for compounds that can polymerize before analysis, polymers and low-vapor-pressure materials; not unconditional styrene preservation or polymer-dust method."
  - id: "epa-method4-moisture"
    type: "official_guidance"
    reference: "US EPA Method4,8/2/2017 Internet copy, complete17page original. https://www.epa.gov/sites/default/files/2017-08/documents/method_4_0.pdf"
    used_for: "Actual reference versus approximate moisture programme and saturated/droplet bias; not proof organic-rich condensate equals pure water or particulate chemistry."
