    - id: close_gates
      applies_to: "all inventory rows"
      rule: "For each actual polyethylene-film liner or corrugated-carton whole wet pool in kg, verify O + P + I + ERin + J_in + H2O_in - X_in = C + S + EOout + W + J_out + H2O_out - X_out. O/C include empty, WIP-attached, FG-attached, returned and reusable physical stocks; P is fresh purchase, I real supplier-included receipt, ERin external return received inward, S gross shipment outward, EOout external return sent outward, and W the actual whole wet waste exit. Paired internal reuse cancels on consolidation; it is neither ERin nor EOout nor procurement. Actual supplier-included packaging has one complete upstream owner and is never bought again. J_in/J_out are independently evidenced disjoint additional non-water transfers such as actual retained repair material, dust or oil only where not already included in another whole gross leg. H2O_in/H2O_out are actual sorption/addition/evaporation or other water transfers not already contained in a wet leg. Closing C retains all true additions even without repair. X_in/X_out subtract only proved overlap between OTHER same-side flow observations; never real J/H2O, C, opposite directions, unknown closure differences or card existence. Unknown terms are not fitted. Trace each true increment to its physical source/receiver and specific atomic interface; paired internal J/water is not a new provider or waste exit. Nested water/material in a gross wet leg is counted once. One actual whole cured-scrap, uncured-mixture, spent-acetone, aqueous-waste, contaminated cloth/filter, discarded liner/carton or retired tool/equipment receiver event has complete wet Qt, substrate plus all retained resin/solvent/residue/water once. Nested origin/species/assay masses are not additional exports until actually separated. The actual receiver/provider gets full physical Qt once in its own compatible unit. Separately retain total actual modelling-service demand and nonoverlapping A_e,c for every serviced original Qc or actual new Q. Never reduce physical Qt by an attribution share, add retained solvent/water again, charge full Qt anew to every cohort or infer recycling credit. Unknown A remains unresolved with the complete physical event/history retained. Independently reconcile manufacturing, FG and consolidated full wet physical gates, elements and true reactive species; paired internal first-release/reuse handovers cancel once."
