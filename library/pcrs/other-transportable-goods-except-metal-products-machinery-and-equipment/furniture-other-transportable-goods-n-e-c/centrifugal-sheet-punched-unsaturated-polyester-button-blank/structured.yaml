      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_framework | all inventory rows | This is attributional inventory construction. First assign dedicated operations and measured exchanges to their actual cohort; subdivide physically or virtually to isolate exclusive exchanges. A compatible prior PCR can supply reusable principles but cannot replace blank-specific applicability. Manufacturing literature supplies no LCA allocation authority. | ilcd-attributional-allocation-2010 |\n| a_causal | all inventory rows | For every genuinely shared remaining exchange identify its determining physical causal relationship to each function; use measured drivers for that exchange and state. Do not freely choose physical versus economic allocation, impose one mass share on all exchanges, or scale gross physical flow by a burden share. Retain driver evidence and uncertainty. | ilcd-attributional-allocation-2010 |\n| a_residual | all inventory rows | Only the remainder without a justifiable determining physical cause uses contemporaneous market values of actual cofunctions in the condition at the same common process gate. Record amounts, state, currency, period, price sources and residual denominator; missing comparable value leaves allocation unresolved. No fixed ratio, automatic avoided-production credit or burden transfer on scrap sale. Waste status and actual treatment responsibility remain explicit. | ilcd-attributional-allocation-2010 |\n\n"
