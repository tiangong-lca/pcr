ever reduce physical Qt by an attribution share, add retained solvent/water again, charge full Qt anew to every cohort or infer recycling credit. Unknown A remains unresolved with the complete physical event/history retained. This card reports complete actual physical V_r as N_r only; actual compatible provider/service A_r is assigned separately, never created again by this physical leg.\n\nAll protocols collect undivided raw quantities. The aggregation_rule field declares only the reporting basis of the same report_once result; it does not divide during collection. N_r is full gross physical V_r for physical cards or traced A_r for utility/service cards. D_r is positive cohort Q or original Qc, never H.\n\nThe terminal is one actual complete solid, nonfoamed, unreinforced and unpigmented cured unsaturated-polyester button blank, undrilled and not yet turned/polished as a finished sewing button. Jindal directly describes liquid resin centrifugal sheet casting, soft-sheet punching and subsequent hardening; its adjacent waxed-tube rod-slicing route is different. PFB independently manufactures and supplies polyester blanks, without proving Jindal’s same SKU or plant. Classic distinguishes blanking from later turning, drilling, polishing and finished-button inspection; its pigment/pearl examples are not used in this unpigmented profile. Samrat independently supplies a transparent casting-grade UPR with MEKP/cobalt roles; its advertised dose, styrene fraction, cure time, temperature and drum mass are not defaults. This is transparent qualitative technical synthesis, not a measured common factory/order, recipe or certification.\n\nFirst acceptance is after all actual same-configuration mixing, centrifugal casting, punching, curing/hardening, conditioning, blank inspection/rework and required supply packing, ready for supply at the plant. Q (also Q0 or original Qc for cohort c) is independently measured unique first accepted complete-blank net kg, with actual retained resin constituents/water once and measured detachable packaging tare excluded. Initial required packing belongs to new manufacture; later storage/repacking/redelivery/repair/retest is only actual service of the original cohort in H. Actual count-to-mass uses independently measured same-configuration M with sampling/uncertainty, never a catalogue blank weight.\n\nIndependently verify Q0 = D0_c + FG0_c + Held0_c + L0_c + T0_c, with disjoint remaining original-material deliveries, released on-site FG, every other actual accepted on-site state, irreversible original material/water losses, and other terminal dispositions. Subdivide those bins for every real location/status; gross delivery/return loops cancel only in this event bridge. Record each original-material fate once on its locked acceptance basis. Independently bridge each surviving present wet mass to original matter still present plus real retained later non-water material and water changes. Do not restore a lost original mass into a survivor and also retain it in L0_c. New material/sorbed water creates physical mass, not new Q. Q0=0 or unknown retains all raw loads and no normalized result.\n\nKeep complete wet raw, WIP, non-WIP, accepted/held/returned FG, packaging, actual tools/equipment and installed-fluid stocks independent of reference events and per-exchange burdens. Own opening WIP inherits all its actual previous foreground history once; transfer only demonstrated still-unassigned closing vectors. Actual whole liquid UPR, MEKP preparation, cobalt accelerator and every real independently supplied addition have one complete actual upstream producer, with included monomer/carrier/inhibitor/accelerator as nonadditive composition only. Actual site compounding records its independently bought ingredients and all mixing/cleaning/wastes. A whole supplier dataset and its same decomposed resin/chemical/utility/transport/equipment history are mutually exclusive. Never buy a finished blank to hide casting, or purchase heat/ready mixture to hide actual on-site production.\n\nFor each actual polyethylene-film liner or corrugated-carton whole wet pool in kg, verify O + P + I + ERin + J_in + H2O_in - X_in = C + S + EOout + W + J_out + H2O_out - X_out. O/C include empty, WIP-attached, FG-attached, returned and reusable physical stocks; P is fresh purchase, I real supplier-included receipt, ERin external return received inward, S gross shipment outward, EOout external return sent outward, and W the actual whole wet waste exit. Paired internal reuse cancels on consolidation; it is neither ERin nor EOout nor procurement. Actual supplier-included packaging has one complete upstream owner and is never bought again.\n\nJ_in/J_out are independently evidenced disjoint additional non-water transfers such as actual retained repair material, dust or oil only where not already included in another whole gross leg. H2O_in/H2O_out are actual sorption/addition/evaporation or other water transfers not already contained in a wet leg. Closing C retains all true additions even without repair. X_in/X_out subtract only proved overlap between OTHER same-side flow observations; never real J/H2O, C, opposite directions, unknown closure differences or card existence. Unknown terms are not fitted. Trace each true increment to its physical source/receiver and specific atomic interface; paired internal J/water is not a new provider or waste exit. Nested water/material in a gross wet leg is counted once.\n\nOne actual whole cured-scrap, uncured-mixture, spent-acetone, aqueous-waste, contaminated cloth/filter, discarded liner/carton or retired tool/equipment receiver event has complete wet Qt, substrate plus all retained resin/solvent/residue/water once. Nested origin/species/assay masses are not additional exports until actually separated. The actual receiver/provider gets full physical Qt once in its own compatible unit. Separately retain total actual modelling-service demand and nonoverlapping A_e,c for every serviced original Qc or actual new Q. Never reduce physical Qt by an attribution share, add retained solvent/water again, charge full Qt anew to every cohort or infer recycling credit. Unknown A remains unresolved with the complete physical event/history retained.\n\nEach actual centrifugal casting drum, punching press, cutting die and conditioning rack has one configured physical fleet with full receipts, return/retirement, wet stocks, actual installed fluids, wear and repairs. Full equipment provider and its decomposed manufacture/maintenance are exclusive. Separate physical V/M from compatible provider/service A and actual service coverage/history. A Mass/kg equipment-product provider requires measured complete configuration M and an evidenced allocation/service fraction over the provider’s real covered history, not guessed life/capacity or treating observed H as total life. An h-based service provider retains its own unit and a real documented bridge; no kg substitution. Unknown denominator preserves raw performed service, failures and stocks without a fabricated A.\n\nThis cure is actual radical crosslinking of a supplied UPR formulation, not new upstream polyester condensation by assumption. Track actual monomer incorporation, retained unreacted monomer, evaporation, initiator decomposition and every real species generation/consumption separately from total wet mass and element conservation. For each reacting molecular species record opening + actual inputs + independently evidenced generation = closing + actual outputs + independently evidenced consumption; do not conserve styrene monomer as if cured polymer were unchanged monomer or impose condensation water. Whole volatile-containing waste and captured condensate remain whole physical receivers. Actual specimen integrity, hardening and machinability acceptance is mechanical/buyer evidence; no residual-monomer chemical limit, universal hardness or time/temperature is invented. If an actual grade requires a chemical assay, its real matrix-specific procedure must exist before that claim is completed.\n\nFor actual external styrene, acetone and molecular H2O vapor, EPA Method320 and its included FTIR Protocol provide an independent extractive vapor-phase programme: actual target/reference spectra or Protocol4.6 preparation, spectral/interferant selection including water, appropriate optical/path/T/P conditions, heated nonreactive transport without condensation, leak/linearity/background/CTS checks, complete raw spectra and residual analysis, independent same-basis gas amount/flow and concentration integration, and analyte-specific transport/matrix validation. Follow its distinct routine QA spike and section13 validation/Method301 bias/precision programme; an ordinary spike does not replace initial validation and its result is not an automatic correction factor. No claim of actual site validation or all vapor/all matrix coverage is made. The programme exists; ordinary unperformed site/reference/QA work is a study requirement, while an actually inapplicable or unestablished necessary procedure stays a specific hold. It does not measure crosslinked polymer particles or liquid condensate as gaseous monomer.\n\nRetain the actual Method320 printed inconsistency: §9.2.3 equation3 shows tracer_spiked/tracer_standard but calls DF at least10; equation4 uses it as a mixing fraction. Do not copy that incompatible reciprocal convention. This PCR’s explicit independent dimensional synthesis is k=(tracer_spiked-tracer_native)/(tracer_standard-tracer_native) on the same actual molar wet/dry basis, with distinct nonzero endmembers, conservative tracer and 0<k<1; C_expected=k*C_standard+(1-k)*C_native. A reciprocal dilution ratio is1/k and is not substituted for k. Retain actual flows, endmember/background and field recovery evidence; the illustration is not a tracer dose or SF6-use requirement, recipe or performed QA. For spectra use the source’s actual path/temperature/pressure correction; mass emission integrates actual matching-state concentration and gas amount once, never a second time multiplier for an already integrated volume.\n\nMethod18 is contrary scope evidence, not an unconditional styrene method: §1.2.2 excludes high-molecular-weight polymers, compounds that can polymerize before analysis, and very-low-vapor-pressure compounds. Its GC detector programme alone does not close a polymerizing sample’s preservation. Method4 independently distinguishes accurate reference moisture determination from approximate setup estimates and warns of saturated/droplet positive bias; condensed organic-rich liquid is not automatically pure water. Quantitative FTIR water requires its actual Protocol4.6 quantitative reference, not merely a water-interference spectrum. Total VOC, exposure concentration, COD and total PM are not styrene/acetone/polyester species masses. A real polymer-specific particulate claim requires its established identification/recovery/matrix programme; absent that, keep the affected actual claim on hold rather than label all collected PM as UPR. No measured blank-production result follows from any of these method documents.\n\nInitial required packing and equipment custody are real manufacturing support with provider/electricity demand assigned to new Q; later original-FG services use original Qc and actual H. Allocate one meter, fleet or packaging history across actual disjoint events without a duplicate purchase/measurement. The retained machine process ID post_release never moves real preacceptance manufacturing burdens outside the first-release boundary.\n\n"
