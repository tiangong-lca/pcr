    applies_to: "foreground_dataset_conformance"
    rule: "Actual complete purchased packaging article entering the empty/attached/reusable packaging pools; no fixed usage per blank and no assumed reusable lifetime. The actual specific corrugated carton remains unbound. The historical unspecified-packaging Product has no physical general comment and mixes carton/liner-bag/stretch-wrap synonyms; that is insufficient positive material/article definition for this specific carton. Preserve the full former adoption as counterevidence, not a current carton UUID or a claim of exhaustive no-match. Record the complete supplied carton with incorporated adhesive/printing once; no separate repurchase of its constituents. Carton grade, moisture, composition and supplier remain independently documented; film, tape, pallet and waste are different exchanges. Record actual gross physical V_r in native units independently of attributable burden A_r and the complete inherited exchange vector. Raw collection is undivided; report_once owns the sole N_r / D_r operation. For physical cards N_r is the full V_r, never an allocation-scaled or stock-net quantity. For utility/service cards it is attributable A_r. For each actual polyethylene-film liner or corrugated-carton whole wet pool in kg, verify O + P + I + ERin + J_in + H2O_in - X_in = C + S + EOout + W + J_out + H2O_out - X_out. O/C include empty, WIP-attached, FG-attached, returned and reusable physical stocks; P is fresh purchase, I real supplier-included receipt, ERin external return received inward, S gross shipment outward, EOout external return sent outward, and W the actual whole wet waste exit. Paired internal reuse cancels on consolidation; it is neither ERin nor EOout nor procurement. Actual supplier-included packaging has one complete upstream owner and is never bought again. J_in/J_out are independently evidenced disjoint additional non-water transfers such as actual retained repair material, dust or oil only where not already included in another whole gross leg. H2O_in/H2O_out are actual sorption/addition/evaporation or other water transfers not already contained in a wet leg. Closing C retains all true additions even without repair. X_in/X_out subtract only proved overlap between OTHER same-side flow observations; never real J/H2O, C, opposite directions, unknown closure differences or card existence. Unknown terms are not fitted. Trace each true increment to its physical source/receiver and specific atomic interface; paired internal J/water is not a new provider or waste exit. Nested water/material in a gross wet leg is counted once."
