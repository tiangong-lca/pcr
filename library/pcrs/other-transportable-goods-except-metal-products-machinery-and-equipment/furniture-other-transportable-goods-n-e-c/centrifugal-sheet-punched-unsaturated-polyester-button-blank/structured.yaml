      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_terminal | released_blank | Verify whole cured blank and buyer acceptance state, no holes/final button operations, same configuration and measured net Q; family UUID alone does not establish applicability. A true missing core terminal/route/measurement relationship stays unresolved and prevents a completed dataset. | jindal-polyester-casting; pfb-polyester-blanks; classic-button-process |\n| v_accounting | all inventory rows | Check every raw numerator, source unit conversion, physical V versus A, one division, Q/Qc uniqueness, same-cohort closing FG, WIP/non-WIP and full inherited vector gates. Q0 keeps loads without a unit result. Unknowns are not passes or zeros. |  |\n| v_packaging | post_release | For each actual polyethylene-film liner or corrugated-carton whole wet pool in kg, verify O + P + I + ERin + J_in + H2O_in - X_in = C + S + EOout + W + J_out + H2O_out - X_out. O/C include empty, WIP-attached, FG-attached, returned and reusable physical stocks; P is fresh purchase, I real supplier-included receipt, ERin external return received inward, S gross shipment outward, EOout external return sent outward, and W the actual whole wet waste exit. Paired internal reuse cancels on consolidation; it is neither ERin nor EOout nor procurement. Actual supplier-included packaging has one complete upstream owner and is never bought again. J_in/J_out are independently evidenced disjoint additional non-water transfers such as actual retained repair material, dust or oil only where not already included in another whole gross leg. H2O_in/H2O_out are actual sorption/addition/evaporation or other water transfers not already contained in a wet leg. Closing C retains all true additions even without repair. X_in/X_out subtract only proved overlap between OTHER same-side flow observations; never real J/H2O, C, opposite directions, unknown closure differences or c