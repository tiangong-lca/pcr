  - rule_id: validation_rule_21
    applies_to: "foreground_dataset_conformance"
    rule: "Measure actual escaping mixing/casting/curing/cleanup monomer and reconcile retained, recovered and wasted monomer independently. Do not treat all resin mass loss as styrene; do not copy composite-layup factors into button casting. Native Elementary identity is styrene CAS100-42-5 emitted to air unspecified, Mass/kg. The long synonym list also contains polymer/trade-name noise; those do not authorize a polystyrene particulate or alpha-methylstyrene substitution. Use only independently speciated monomer crossing the actual external air gate; indoor exposure is not an additional external emission. Where urban, stack or another compartment is known, select the matching native flow instead. No total VOC-to-styrene assumption or AP-42 factor transfer. Record actual gross physical V_r in native units independently of attributable burden A_r and the complete inherited exchange vector. Raw collection is undivided; report_once owns the sole N_r / D_r operation. For physical cards N_r is the full V_r, never an allocation-scaled or stock-net quantity. For utility/service cards it is attributable A_r. For actual external styrene, acetone and molecular H2O vapor, EPA Method320 and its included FTIR Protocol provide an independent extractive vapor-phase programme: actual target/reference spectra or Protocol4.6 preparation, spectral/interferant selection including water, appropriate optical/path/T/P conditions, heated nonreactive transport without condensation, leak/linearity/background/CTS checks, complete raw spectra and residual analysis, independent same-basis gas amount/flow and concentration integration, and analyte-specific transport/matrix validation. Follow its distinct routine QA spike and section13 validation/Method301 bias/precision programme; an ordinary spike does not replace initial validation and its result is not an automatic correction factor. No claim of actual site validation or all vapor/all matrix coverage is made. The programme exists; ordinary unperformed site/reference/QA work is a study requirement, while an actually inapplicable or unestablished necessary procedure stays a specific hold. It does not measure crosslinked polymer particles or liquid condensate as gaseous monomer. Method18 is contrary scope evidence, not an unconditional styrene method: §1.2.2 excludes high-molecular-weight polymers, compounds that can polymerize before analysis, and very-low-vapor-pressure compounds. Its GC detector programme alone does not close a polymerizing sample’s preservation. Method4 independently distinguishes accurate reference moisture determination from approximate setup estimates and warns of saturated/droplet positive bias; condensed organic-rich liquid is not automatically pure water. Quantitative FTIR water requires its actual Protocol4.6 quantitative reference, not merely a water-interference spectrum. Total VOC, exposure concentration, COD and total PM are not styrene/acetone/polyester species masses. A real polymer-specific particulate claim requires its established identification/recovery/matrix programme; absent that, keep the affected actual claim on hold rather than label all collected PM as UPR. No measured blank-production result follows from any of these method documents."
