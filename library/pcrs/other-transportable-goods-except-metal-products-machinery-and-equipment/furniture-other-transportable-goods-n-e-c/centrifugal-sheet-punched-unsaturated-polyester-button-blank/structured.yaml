    rule: "Retain services already executed for held FG as well as shipped FG, under original released cohort Qc and observation horizon H. H records service duration/coverage and never divides the product result. Unobserved future services remain unknown. Do not subtract observed held-stock service simply because dispatch is pending. Native Product identity is CN grid-average consumption mix delivered to users below 1 kV; it is not hydropower-only generation or high-voltage supply. Use this UUID only for that actual supply. A different country, voltage, generation contract or onsite source requires its own verified identity and provider. Native Net calorific value uses the energy unit group with MJ reference; convert measured kWh by 3.6 before attribution and never treat energy as kg. Record actual gross physical V_r in native units independently of attributable burden A_r and the complete inherited exchange vector. Raw collection is undivided; report_once owns the sole N_r / D_r operation. For physical cards N_r is the full V_r, never an allocation-scaled or stock-net quantity. For utility/service cards it is attributable A_r. Initial required packing and equipment custody are real manufacturing support with provider/electricity demand assigned to new Q; later original-FG services use original Qc and actual H. Allocate one meter, fleet or packaging history across actual disjoint events without a duplicate purchase/measurement. The retained machine process ID post_release never moves real preacceptance manufacturing burdens outside the first-release boundary."
