  - rule_id: validation_rule_45
    applies_to: "foreground_dataset_conformance"
    rule: "The terminal is one actual complete solid, nonfoamed, unreinforced and unpigmented cured unsaturated-polyester button blank, undrilled and not yet turned/polished as a finished sewing button. Jindal directly describes liquid resin centrifugal sheet casting, soft-sheet punching and subsequent hardening; its adjacent waxed-tube rod-slicing route is different. PFB independently manufactures and supplies polyester blanks, without proving Jindal’s same SKU or plant. Classic distinguishes blanking from later turning, drilling, polishing and finished-button inspection; its pigment/pearl examples are not used in this unpigmented profile. Samrat independently supplies a transparent casting-grade UPR with MEKP/cobalt roles; its advertised dose, styrene fraction, cure time, temperature and drum mass are not defaults. This is transparent qualitative technical synthesis, not a measured common factory/order, recipe or certification."
    source_ids: []
  - rule_id: validation_rule_46
    applies_to: "foreground_dataset_conformance"
    rule: "First acceptance is after all actual same-configuration mixing, centrifugal casting, punching, curing/hardening, conditioning, blank inspection/rework and required supply packing, ready for supply at the plant. Q (also Q0 or original Qc for cohort c) is independently measured unique first accepted complete-blank net kg, with actual retained resin constituents/water once and measured detachable packaging tare excluded. Initial required packing belongs to new manufacture; later storage/repacking/redelivery/repair/retest is only actual service of the original cohort in H. Actual count-to-mass uses independently measured same-configuration M with sampling/uncertainty, never a catalogue blank weight."
    source_ids: []
  - rule_id: validation_rule_47
    applies_to: "foreground_dataset_conformance"
    rule: "Independently verify Q0 = D0_c + FG0_c + Held0_c + L0_c + T0_c, with disjoint remaining original-material deliveries, released on-site FG, every other actual accepted on-site state, irreversible original material/water losses, and other terminal dispositions. Subdivide those bins for every real location/status; gross delivery/return loops cancel only in this event bridge. Record each original-material fate once on its locked acceptance basis. Independently bridge each surviving present wet mass to original matter still present plus real retained later non-water material and water changes. Do not restore a lost original mass into a survivor and also retain it in L0_c. New material/sorbed water creates physical mass, not new Q. Q0=0 or unknown retains all raw loads and no normalized result."
    source_ids: []
  - rule_id: validation_rule_48
    applies_to: "foreground_dataset_conformance"
    rule: "Keep complete wet raw, WIP, non-WIP, accepted/held/returned FG, packaging, actual tools/equipment and installed-fluid stocks independent of reference events and per-exchange burdens. Own opening WIP inherits all its actual previous foreground history once; transfer only demonstrated still-unassigned closing vectors. Actual whole liquid UPR, MEKP preparation, cobalt accelerator and every real independently supplied addition have one complete actual upstream producer, with included monomer/carrier/inhibitor/accelerator as nonadditive composition only. Actual site compounding records its independently bought ingredients and all mixing/cleaning/wastes. A whole supplier dataset and its same decomposed resin/chemical/utility/transport/equipment history are mutually exclusive. Never buy a finished blank to hide casting, or purchase heat/ready mixture to hide actual on-site production."
