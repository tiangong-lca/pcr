    - rule_id: b_inventory_film_p
      applies_to: "film_p"
      rule: "Conditional separately purchased new article P for this one pe stretch-wrap film. The single-quotient numerator is the complete actual gross physical leg V, before economic shares or stock/burden correction. This disclosure row creates no second purchase, provider burden or credit. P and I are mutually exclusive ownership tags for the same inbound article; a whole wet incoming article includes its constituent water once. Record real influx even when the article/water remains in closing stock. All opening/closing empty, attached-WIP/FG and reusable-pool quantities stay in the pool equation. Only other same-direction incoming/outgoing flow terms can create X deduplication; a stock or opposite row cannot. Internal reuse cancels. Trace its one original upstream owner and any valid burden handover in the separate burden dimension; full physical gross V is never reduced by an allocation share. Native Product flow is polyethylene film, CAS9002-88-4, production mix at plant, Mass/kg; no fixed thickness, grade, route or geography. The commentary distinguishes PET as a competing polyester, not this PE identity. Its luggage/leather classification is an isolated taxonomy defect; PE basename, CAS and physical film description agree. Use for one actual PE stretch-wrap film with verified supplier formulation, never PET, resin pellets, paper tape, a whole carton or a mixed waste. Supplier and measured film properties remain required."
