product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.furniture-other-transportable-goods-n-e-c.direct-pedal-child-toy-tricycle"
  classification_refs: "CPC 3.0 38510; narrower product and route boundary"
  covered_products: "This method covers a new complete non-electric child pedal-powered toy tricycle with a welded tubular-metal frame and coated fork/handlebar module, direct front-wheel pedals with a solid one-piece steel crank, solid rubber tyres on spokeless wheels, a rubber seat, actual version-specific wheel bearings and steering bushes, grips, stops and all configured fastenings. The bounded foreground route receives complete finished coated frame and fork modules and actual supplied wheel/seat/axle articles, checks incoming compatibility, mechanically fits and tightens them, performs actual configured complete-toy inspection/testing and records the first whole quality release. Supplier fabrication, surface preparation, coating and component manufacture must remain in compatible upstream inventories. It is not a purchase of the finished toy followed by packaging. On-site metal forming/welding/coating or injection moulding is outside this selected assembly route; if it actually occurs, collect its real raw materials, each preparation, energy, species and losses and obtain applicable route evidence before extending this same record's dataset scope. No omission or zero may conceal it."
  excluded_products: "Exclude adult, passenger/cargo or road-transport tricycles; bicycles and balance bikes; scooters; electric or combustion toys; hand-lever and solely push-propelled ride-ons; dolls' carriages and strollers; multi-rider/recumbent variants; toy train/model/construction sets; loose wheels, raw steel/plastic, component-only kits and remanufacturing as the reference terminal. Riding, child metabolism, road infrastructure, use-stage repairs and end of life are not part of the manufacturing reference. Actual pre-dispatch storage/handling/packing and actual returned-product work within the declared service horizon remain separately traceable to original release cohorts."
  representative_product: "One configured complete first-released child pedal toy tricycle"
  production_route: "Received complete finished frame/fork and actual components → incoming compatibility → mechanical fitment/fastening → actual complete-product checks → first quality release; actual post-release service separately linked to original cohort"
  market_state: "New complete manufactured child riding toy at declared first quality release"
functional_unit:
  what: "Manufacture a complete configured non-electric child pedal toy tricycle"
  how_much: "1 kg net complete first-released toy mass"
  how_well: "Actual declared component/safety/functional acceptance; equal mass does not imply equal toy performance"
  how_long_or_cycle: "One manufacturing first-release cohort; original-cohort actual service only within separately declared horizon; no riding-life equivalence"
