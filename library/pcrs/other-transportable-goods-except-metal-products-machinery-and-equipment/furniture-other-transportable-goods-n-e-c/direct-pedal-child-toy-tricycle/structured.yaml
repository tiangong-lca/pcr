      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual complete supplied finished coated frame/fork modules plus disjoint configured component articles; actual supply completeness and upstream burdens declared |\n| starting_condition_role | Full receiving-site mechanical manufacture from supplied components to whole first quality release |\n| product_classification_scope | Only the §1 pedal toy subset of CPC38510 in this semantic method |\n| recursive_input_rule | Do not purchase a finished tricycle into its own manufacture; whole supplied modules replace their contained stock and processing once; internal handoffs cancel |\n| upstream_dataset_requirement | Match each whole input provider to actual material/form/route/completeness/geography/period and transport; identity alone supplies no upstream inventory or excluded-component burden |\n| disclosure | Whole component supply BOM; actual operations; first-release Q; raw/WIP/FG and services; original-cohort horizon; gross packaging/assets; water states; allocation; upstream coverage and ordinary gaps |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_evidence_scope | selected assembly route | This is a qualitative technical synthesis, not a same-SKU or same-factory bill of materials. Winther's full manufacturer-authored catalogue (distributed PDF), product/component illustrations and 451 assembly/spares originals positively establish the toy terminal and real module structure; the catalogue also illustrates upstream welding/coating. The old manual's nylon-bearing wording does not override a current drawing or the catalogue's ball-bearing version. KRIDDO explicitly describes tricycle component compatibility and pre-exit safety checks; its adjacent balance-bike welding discussion is not proof of this toy's own fabrication route. None of these documents supplies universal alloy grade, polymer fractions, paint chemistry/thickness, temperature, pressure, duration, factory energy, load/age/test limit, certification, lifespan or nominal single-toy mass for this PCR. An actual configured release plan and supply completeness must be collected. | `winther-toy-catalogue-2025`; `winther-451-assembly`; `winther-451-spares`; `kriddo-factory-assembly-checks` |\n| b_route | manufacture | Include all actual receipt checks, internal handling, fitting/fastening, bearing and steering fit checks, actual lubrication/cleaning, whole-product examination, destructive/sample testing, start/stop, idle, failures, cleanup and actual rework needed for the first configured release. Record failed or unauthorized work as performed activity with actual hold/waste disposition. Actual factory release requires a complete functioning pedal/steering/wheel/seat configuration and declared acceptance results; a user manual alone cannot certify factory production. No source load, age, conformity logo or test threshold becomes a PCR default. | `winther-toy-catalogue-2025`; `winther-451-assembly`; `winther-451-spares`; `kriddo-factory-assembly-checks` |\n| b_whole_inputs | all supplied articles | Acquire each complete supplied frame, fork, wheel, seat, fitting kit, preparation and wet packaging article once. Maintain non-purchased composition subaccounts for included metal/plastic/paint/bearings/grease/adhesive/water. Actual separately supplied or site-mixed constituents are disjoint and separately inventoried with actual energy and losses. No raw stock or presumed surface-treatment recipe is additionally purchased for a finished supplied assembly. Same-category finished toy input cannot stand in for assembly. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_first_release | finished | Q is the sum of individually measured net kg of uniquely first-released complete toys in the manufacturing cohort. Released closing FG is already included in Q once; neither closing FG nor later shipments add production. Unreleased partial toys remain WIP. Record all integral delivered parts once even when temporarily detached for transport; do not replace measured net mass by catalogue/shipping mass, payload capacity, BOM estimates or secondary property coefficients. | `winther-toy-catalogue-2025`; `winther-451-assembly`; `kriddo-factory-assembly-checks` |\n| b_stocks | manufacture | For each exchange j and real supply vintage, record disjoint opening/closing raw and auxiliary stocks, component stores, in-process fluids/charge and WIP with physical amounts, composition, moisture and every inherited exchange vector. U_j is current manufacturing expenditure after one justified non-WIP unused/unassigned stock correction. Combine U_j with opening WIP vectors and carry forward only evidenced closing WIP vectors. Already stock-corrected consumption is not corrected again. Closing FG never enters the manufacturing subtraction. Failed parts, waste, samples and sold scrap retain their manufacturing/treatment burdens unless a genuinely other cohort/function and justified allocation/handover transfer that vector once. Internal handoffs conserve physical quantities/vectors and cancel at the combined gate. | `ilcd-attributional-allocation-2010` |\n| b_service | service | Trace actual storage, packing, handling, dispatch, returns, reinspection and incremental post-release work to original cohort Qc and observed horizon H. Keep opening/closing FG and repair WIP physical mass and manufacturing/service vectors. Reverse original dispatch assignment only from its real evidence D_rev; returned physical mass may differ through missing parts, additions, contamination or water. New and old replacement parts and removed reusable/waste parts have their own measured stores/vectors. Already performed original-cohort service is not removed because FG stays in store; only unused/unassigned service or charge carries forward. Manufacturer/specification permission plus postwork tests and acceptance govern continued qualification, while all unauthorized/failed actual work and actual disposition remain. Repair/reinspection/dispatch never creates new Q. | `winther-451-assembly`; `winther-451-spares`; `kriddo-factory-assembly-checks`; `ilcd-attributional-allocation-2010` |\n| b_gross_physical | all gross disclosure rows | A gross event row uses full real event quantity V before allocation; its single quotient never takes a manufacturing/service burden vector, Bopen+U-Bclose, revenue share or net stock consumption as the numerator. Gross rows disclose physical legs and must not attach another purchase/provider/credit. Their independent attributable upstream or service burden dimension A_j is recorded once with original ownership and vintage. Physical gross mass is never reduced by a burden share. The eventual foreground data package must expose both the gross reconciliation view and the assigned-inventory view and must not sum those different views as extra exchanges. | `ilcd-attributional-allocation-2010` |\n| b_pack_pool | packaging | For each carton, film, pallet, tape, leaflet and actual grease pot separately: opening empty+opening attached WIP/FG+opening reusable pool+P+I+ER+X_in = closing empty+closing attached WIP/FG+closing reusable pool+gross shipment S+outward external return EO+W+X_out. P/I must be disjoint for the same inbound whole wet article; I preserves actual physical ingress and its one upstream owner. ER includes actual packaging attached to returned toys. Internal reuse cancels; packaging is excluded from net toy Q, a second purchase and automatic coproduct status. Each six-leg card has its own actual direction and protocol. If only one mixed waste outlet exists, its one external Waste card/treatment owns the total, while each pool W remains an independently measured origin subaccount and is not re-added. | `winther-451-assembly`; `winther-451-spares`; `ilcd-attributional-allocation-2010` |\n| b_water | all processes | Reconcile whole wet articles/preparations and their water subaccounts without overlap. Actual natural atmospheric uptake/release in ordinary storage and handling is included without inventing a repair. New liquid water and repair materials remain real inflows even when retained in full wet closing stock. X_in/X_out removes only another same-direction flow term that already contains the same material/water, never stock, a reverse card or a repair permission condition. Distinguish ordinary absorbed/free water, vapour, liquid, genuinely evidenced chemical/structural water and species. This assembly route implies no default reaction water. Independent density/state and physical mass/element balances do not establish molecular speciation or solve two unknowns from one residual. | `ilcd-attributional-allocation-2010` |\n| b_physical_gates | manufacture; service; consolidated gate | Manufacturing physical gate: opening raw/auxiliary/non-WIP stores + opening WIP + actual receipts and disjoint water uptake = first-release Q + matching closing stores/WIP + every actual waste/loss/return. FG/service gate: opening FG + first-release transfer + actual returned toys + disjoint issued repair parts/water + opening repair WIP = closing FG + gross dispatch + discarded whole toys + removed components and real water/loss outputs + closing repair WIP. Independently reconcile unused repair-part stores, packaging pools and durable assets; issued repair parts are internal transfers from those stores. Cancel internal release/part/repair transfers in the combined gate. Whole and constituent water are not added twice; retained water remains in wet closing mass. Check total mass and relevant metal/C/H/O balances from actual composition without fictional gas species or forced symmetric outlets. | `ilcd-attributional-allocation-2010` |\n| b_assets_utilities | assets; utilities | Physical asset acquisition/return/retirement and installed fluid inventories are separate from current service burden. Retain actual new/used repair parts, moisture and fluids by individual physical identity. Meter each real electricity, water, compressed air, heat, fuel and identified elementary species if present; add a specific card and protocol for an actual missing exchange before dataset use. No boiler, steam, fuel combustion, shielding gas, compressed-air purchase or heat recovery is presumed for this receiving assembly route. If an external thermal carrier actually exists, record its real Product supply/return mass and thermal states/enthalpy and supplier water/energy convention once; never both a whole provider and duplicated contained mass/MJ nor an invented boiler credit. | `ilcd-attributional-allocation-2010` |\n| b_original_acceptance_context | complete applicable context | Q0 is an acceptance-event account: sum independently weighed complete net masses of each unique first-accepted configuration once, locking that original mass to its serial/cohort. Q=Q0 for manufacture; original Qc=Q0 for later observed service. Partition every originally accepted identity into disjoint net remaining deliveries, all actual on-site accepted states (stored, held, damaged, sampled, returned, repair WIP), irreversible whole-product losses and other terminal dispositions on its original acceptance-mass basis. Record every state/exit; delivery-plus-closing-FG is only a simplified bridge when other postgate states/exits are proven absent. Returns, repeated tests, repairs, dispatch loops, added parts and changed moisture/current mass create no new Q0. Partial material/water loss is separately measured physical change; do not restore that loss into the surviving product and also add it as an outlet. Current physical mass/stock balances are independent of the original event-mass partition. Original service denominator remains even if nothing survives; zero or unknown Q0 retains raw loads and no unit result. Actual item count is an identity reconciliation, never a default kg-per-toy conversion. | `ilcd-attributional-allocation-2010` |\n| b_complete_producer_context | complete applicable context | The complete-product route and physical component relationships are positive evidence; the assembly manual is adult/user assembly and does not establish a fully assembled factory shipment or an actual external-supplier purchase by Winther. Treat supplied-module manufacture as a bounded technical synthesis supported by the real modules and independent factory component/check evidence. A concrete dataset must identify each actual complete producer, its real raw-material preparation/fabrication/welding/surface treatment/coating/moulding/energy/species/waste gate and delivered composition, including any controlled on-site producer. Link that complete producer inventory once or expand its actual operations mutually exclusively. An invoice, an identity UUID, a user manual, a spare-part drawing or a promised future SOP alone never supplies those burdens. If work is actually done at the assembly site, include the complete real process before use; merely renaming it upstream does not exclude it. Missing essential core production/matrix procedure remains an explicit hold, not a condition silently waived by a software check. No shared-factory/SKU condition or empirical recipe is invented. | `winther-toy-catalogue-2025`; `winther-451-assembly`; `winther-451-spares`; `kriddo-factory-assembly-checks` |\n| b_whole_waste_context | complete applicable context | For every whole contaminated wipe, pot, filter or actual mixed waste event retain complete raw Qt including substrate, retained preparation/solids and water once. The actual receiver transfer and total fulfilled provider demand remain full independently of economic/environmental attribution. Component analyses are nested nonadditive ledgers unless physically separated before the gate. Keep the whole event/provider total separate from the distinct nonoverlapping A_j vectors and A_j/Q0 of original cohorts. A physical-only gross V disclosure creates no additional purchase/treatment/characterization; an attributable exchange never relabels its A_j as a reduced physical export. Do not charge the whole shared event anew to each cohort or add a provider aggregate beside its contained expanded history. Unknown receiver, method or allocation remains unresolved. | `ilcd-attributional-allocation-2010` |\n| b_complete_packaging_context | complete applicable context | Each actual packaging article uses opening complete wet stocks+P+I+ER+X_in = closing complete wet stocks+S+EO+W+X_out. Include empty, reusable, attached WIP and attached FG pools. X terms are independently measured separately added/removed material or water not already within another same-side flow; deduplicate only the identical other same-side incoming/outgoing event, never an opening/closing stock, opposite leg or merely an existing card. A wet whole receipt includes its original components/water once; a real new repair/water input retained at closing remains both a real influx and full wet closing stock. P/I source ownership, return histories and W component/mixed-outlet ledgers remain disjoint. No packaging adds reference Q, re-purchase or automatic credit. | `ilcd-attributional-allocation-2010` |\n| b_full_scope_context | complete scope and evidence | This method covers a new complete non-electric child pedal-powered toy tricycle with a welded tubular-metal frame and coated fork/handlebar module, direct front-wheel pedals with a solid one-piece steel crank, solid rubber tyres on spokeless wheels, a rubber seat, actual version-specific wheel bearings and steering bushes, grips, stops and all configured fastenings. The bounded foreground route receives complete finished coated frame and fork modules and actual supplied wheel/seat/axle articles, checks incoming compatibility, mechanically fits and tightens them, performs actual configured complete-toy inspection/testing and records the first whole quality release. Supplier fabrication, surface preparation, coating and component manufacture must remain in compatible upstream inventories. It is not a purchase of the finished toy followed by packaging. On-site metal forming/welding/coating or injection moulding is outside this selected assembly route; if it actually occurs, collect its real raw materials, each preparation, energy, species and losses and obtain applicable route evidence before extending this same record's dataset scope. No omission or zero may conceal it. Exclude adult, passenger/cargo or road-transport tricycles; bicycles and balance bikes; scooters; electric or combustion toys; hand-lever and solely push-propelled ride-ons; dolls' carriages and strollers; multi-rider/recumbent variants; toy train/model/construction sets; loose wheels, raw steel/plastic, component-only kits and remanufacturing as the reference terminal. Riding, child metabolism, road infrastructure, use-stage repairs and end of life are not part of the manufacturing reference. Actual pre-dispatch storage/handling/packing and actual returned-product work within the declared service horizon remain separately traceable to original release cohorts. This is a qualitative technical synthesis, not a same-SKU or same-factory bill of materials. Winther's full manufacturer-authored catalogue (distributed PDF), product/component illustrations and 451 assembly/spares originals positively establish the toy terminal and real module structure; the catalogue also illustrates upstream welding/coating. The old manual's nylon-bearing wording does not override a current drawing or the catalogue's ball-bearing version. KRIDDO explicitly describes tricycle component compatibility and pre-exit safety checks; its adjacent balance-bike welding discussion is not proof of this toy's own fabrication route. None of these documents supplies universal alloy grade, polymer fractions, paint chemistry/thickness, temperature, pressure, duration, factory energy, load/age/test limit, certification, lifespan or nominal single-toy mass for this PCR. An actual configured release plan and supply completeness must be collected. | `winther-toy-catalogue-2025`; `winther-451-assembly`; `winther-451-spares`; `kriddo-factory-assembly-checks` |\n| b_inventory_frame | `frame` | Whole supplied frame includes welded seat supports and rear structure only as listed in the actual supply BOM. Verify substrate alloy/grade and coating state; the primary sources do not fix an alloy or universal grade. Exclude the separately accounted fork, wheels, axle and seat. This receiving site performs mechanical assembly; upstream fabrication, surface preparation and coating remain in the complete compatible frame provider. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_fork | `fork` | One actual finished fork/handlebar module. Record included grips, nylon head-tube bushes, rubber stops, pivot fastener and fitting kit individually in its non-purchased composition subledger. Only separately received items use their separate purchase rows. The 451 spare drawing shows bundled fitments; never add the same fitment twice. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_front_wheel | `front_wheel` | One whole supplied front-wheel module with actual hub, tyre, industrial ball bearings, solid one-piece steel crank, pedal fittings and pedals when included. Direct pedals rotate this wheel; no chain or motor is presumed. Preserve the exact component version; the old manual also discusses nylon bearings, so it cannot establish the current wheel bearing type by itself. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_rear_wheel | `rear_wheel` | One specific complete rear-wheel article; total actual rear wheels of this configuration are weighed without imposing a kg-per-wheel factor. Supplier completeness identifies hub, tyre, bearing, hubcap, washers and split pin. A fully supplied wheel replaces contained tyre/rubber/plastic/metal/grease purchases; no pneumatic inner tube is assumed. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_rear_axle | `rear_axle` | One actual finished rear axle, distinct from a complete powered-vehicle axle assembly and from raw steel stock. Declare alloy, geometry and finish from actual records. If the whole frame already includes this axle, retain the component subaccount and no second purchase. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_seat | `seat` | One supplied rubber seat with actual integrated support/fastening components recorded in its whole-article BOM. The selected source configuration has a rubber seat; plastic, PU-upholstered and wooden seats are not silently substituted. No seat polymer recipe, mass, load or service life is invented. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_ball_bearing | `ball_bearing` | Conditional one separately supplied industrial ball bearing for toy wheel. Verify actual material/grade/form and module compatibility from the configured BOM; do not infer them from a search name. If included in a whole module or supplied preparation, retain a composition-only subaccount, not another purchase. The corresponding actual installed/replacement part is not a whole toy, wheel or frame. Native Product flow is a finished manufactured ball-or-roller-bearing family, production mix at plant, Mass/kg, with no fixed steel grade, seal, lubrication, size or geography. This row selects one actual industrial ball bearing of the configured toy only when separately supplied. It cannot identify a nylon plain bush or the entire wheel; bearings and factory grease already in a whole wheel are not purchased again. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_nylon_bush | `nylon_bush` | Conditional one separately supplied finished nylon head-tube plain bush. Verify actual material/grade/form and module compatibility from the configured BOM; do not infer them from a search name. If included in a whole module or supplied preparation, retain a composition-only subaccount, not another purchase. The corresponding actual installed/replacement part is not a whole toy, wheel or frame. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_rubber_grip | `rubber_grip` | Conditional one separately supplied moulded solid-rubber handlebar grip. Verify actual material/grade/form and module compatibility from the configured BOM; do not infer them from a search name. If included in a whole module or supplied preparation, retain a composition-only subaccount, not another purchase. The corresponding actual installed/replacement part is not a whole toy, wheel or frame. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_rubber_stop | `rubber_stop` | Conditional one separately supplied moulded rubber steering stop. Verify actual material/grade/form and module compatibility from the configured BOM; do not infer them from a search name. If included in a whole module or supplied preparation, retain a composition-only subaccount, not another purchase. The corresponding actual installed/replacement part is not a whole toy, wheel or frame. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_pedal | `pedal` | Conditional one separately supplied finished non-slip toy-tricycle pedal. Verify actual material/grade/form and module compatibility from the configured BOM; do not infer them from a search name. If included in a whole module or supplied preparation, retain a composition-only subaccount, not another purchase. The corresponding actual installed/replacement part is not a whole toy, wheel or frame. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_steel_crank | `steel_crank` | Conditional one separately supplied finished one-piece steel toy-tricycle crank. Verify actual material/grade/form and module compatibility from the configured BOM; do not infer them from a search name. If included in a whole module or supplied preparation, retain a composition-only subaccount, not another purchase. The corresponding actual installed/replacement part is not a whole toy, wheel or frame. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_pivot_bolt | `pivot_bolt` | Conditional one separately supplied finished steel toy-tricycle pivot bolt. Verify actual material/grade/form and module compatibility from the configured BOM; do not infer them from a search name. If included in a whole module or supplied preparation, retain a composition-only subaccount, not another purchase. The corresponding actual installed/replacement part is not a whole toy, wheel or frame. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_steel_nut | `steel_nut` | Conditional one separately supplied finished steel toy-tricycle fixing nut. Verify actual material/grade/form and module compatibility from the configured BOM; do not infer them from a search name. If included in a whole module or supplied preparation, retain a composition-only subaccount, not another purchase. The corresponding actual installed/replacement part is not a whole toy, wheel or frame. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_steel_washer | `steel_washer` | Conditional one separately supplied finished steel axle washer. Verify actual material/grade/form and module compatibility from the configured BOM; do not infer them from a search name. If included in a whole module or supplied preparation, retain a composition-only subaccount, not another purchase. The corresponding actual installed/replacement part is not a whole toy, wheel or frame. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_split_pin | `split_pin` | Conditional one separately supplied finished steel axle split pin. Verify actual material/grade/form and module compatibility from the configured BOM; do not infer them from a search name. If included in a whole module or supplied preparation, retain a composition-only subaccount, not another purchase. The corresponding actual installed/replacement part is not a whole toy, wheel or frame. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_hubcap | `hubcap` | Conditional one separately supplied finished toy-tricycle rear-wheel hubcap. Verify actual material/grade/form and module compatibility from the configured BOM; do not infer them from a search name. If included in a whole module or supplied preparation, retain a composition-only subaccount, not another purchase. The corresponding actual installed/replacement part is not a whole toy, wheel or frame. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_product_label | `product_label` | Conditional one separately supplied paper identification sticker. Verify actual material/grade/form and module compatibility from the configured BOM; do not infer them from a search name. If included in a whole module or supplied preparation, retain a composition-only subaccount, not another purchase. The corresponding actual installed/replacement part is not a whole toy, wheel or frame. Native Product flow is a printed paper label for sticker use, production mix at plant GLO, Mass/kg; no fixed paper grade or adhesive recipe. Use for one complete supplied paper identification sticker including its supplied adhesive once, not separately purchasing its ink/glue again. It is neither a plastic decal nor loose instructions; backing waste remains a distinct actual output. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_assembly_electricity | `assembly_electricity` | Meter actual powered tools, handling, lighting and test loads attributable to this manufacturing cohort, including failed starts, idle and cleanup. Do not infer a fixed kWh per toy. Native Product flow is <1 kV alternating current, consumption mix delivered to the user, grid-average supply with mixed generation. Use only for a compatible measured user-side supply and matching geographic/time provider; it is not dedicated hydropower, on-site generation, medium-voltage power or fuel. Native extensive reference is Net calorific value/MJ used here for electrical energy; retain metered kWh with exact conversion 3.6 MJ/kWh, not a heating-value or mass factor. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_assembly_water | `assembly_water` | Actual separately supplied liquid water for pre-release wiping/cleanup; record source, treatment, temperature and phase. It is not water already inside a preparation or wet supplied article. Convert metered volume only with independently documented actual density/state, never a secondary screening factor. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_grease | `grease` | Conditional actual whole acid-free bearing grease preparation. Identify one complete supplier article/formulation with supplier data and actual use. Count its carrier water, active ingredients and additives only in a composition subledger. Do not substitute wax/solvent lubricant for bearing grease, pure EDTA for a cleaner, or an unspecified textile for cotton; in-house mixing requires each real purchased constituent and its real mixing/loss exchanges before use. | `winther-451-assembly`; `winther-451-spares` |\n| b_inventory_cleaner | `cleaner` | Conditional actual whole aqueous neutral cleaning-detergent preparation. Identify one complete supplier article/formulation with supplier data and actual use. Count its carrier water, active ingredients and additives only in a composition subledger. Do not substitute wax/solvent lubricant for bearing grease, pure EDTA for a cleaner, or an unspecified textile for cotton; in-house mixing requires each real purchased constituent and its real mixing/loss exchanges before use. | `winther-451-assembly`; `winther-451-spares` |\n| b_inventory_wipe | `wipe` | Conditional actual supplied cotton wiping cloth. Identify one complete supplier article/formulation with supplier data and actual use. Count its carrier water, active ingredients and additives only in a composition subledger. Do not substitute wax/solvent lubricant for bearing grease, pure EDTA for a cleaner, or an unspecified textile for cotton; in-house mixing requires each real purchased constituent and its real mixing/loss exchanges before use. | `winther-451-assembly`; `winther-451-spares` |\n| b_inventory_inbound_freight | `inbound_freight` | One real road freight service; collect actual carried gross payload, distance, vehicle/capacity, loading and empty-return convention. Native candidates fixed to a 30-ton diesel truck are not a generic provider. No distance, vehicle or fuel default. Transport already included in a whole provider is not purchased again. | `ilcd-attributional-allocation-2010` |\n| b_inventory_assembly_humidity_in | `assembly_humidity_in` | Conditional measured atmospheric H2O uptake in actual storage/handling or operation, independently from water losses. Keep the full new influx and full wet closing mass simultaneously; subtract X_in only if the same water already belongs to another incoming term. No permission or repair is required for natural humidity exchange. An emission-to-water water-vapour UUID cannot be used for this resource input. | `ilcd-attributional-allocation-2010` |\n| b_inventory_frame_supplier_return | `frame_supplier_return` | Conditional actual outward return of this supplied article to its supplier. Keep full physical gross quantity and the original provider/burden receipt; a documented reversal/handover is not a sale credit or negative manufacturing waste. Whole supplied frame includes welded seat supports and rear structure only as listed in the actual supply BOM. Verify substrate alloy/grade and coating state; the primary sources do not fix an alloy or universal grade. Exclude the separately accounted fork, wheels, axle and seat. This receiving site performs mechanical assembly; upstream fabrication, surface preparation and coating remain in the complete compatible frame provider. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_fork_supplier_return | `fork_supplier_return` | Conditional actual outward return of this supplied article to its supplier. Keep full physical gross quantity and the original provider/burden receipt; a documented reversal/handover is not a sale credit or negative manufacturing waste. One actual finished fork/handlebar module. Record included grips, nylon head-tube bushes, rubber stops, pivot fastener and fitting kit individually in its non-purchased composition subledger. Only separately received items use their separate purchase rows. The 451 spare drawing shows bundled fitments; never add the same fitment twice. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_front_wheel_supplier_return | `front_wheel_supplier_return` | Conditional actual outward return of this supplied article to its supplier. Keep full physical gross quantity and the original provider/burden receipt; a documented reversal/handover is not a sale credit or negative manufacturing waste. One whole supplied front-wheel module with actual hub, tyre, industrial ball bearings, solid one-piece steel crank, pedal fittings and pedals when included. Direct pedals rotate this wheel; no chain or motor is presumed. Preserve the exact component version; the old manual also discusses nylon bearings, so it cannot establish the current wheel bearing type by itself. | `winther-toy-catalogue-2025`; `winther-451-spares` |\n| b_inventory_rear_wheel_supplier_return | `rear_wheel_supplier_return` | Conditional actual outward return of this supplied article to its supplier. Keep full physical gross quantity and the original provider/burden receipt; a documented reversal/handover is not a sale credit or negative manufacturing waste. One specific complete rear-wheel article; total actual rear wheels of this configuration are weighed without imposing a kg-pe