      applies_to: "service_wastewater"
      rule: "Conditional one real liquid wastewater outlet with water, actual dissolved/suspended species and contaminants measured. Do not borrow an electrolytic-manganese washing wastewater UUID or an unverified generic wastewater type. COD, BOD, total nitrogen, VOC and total dust are indicators, not specific molecular masses. Match actual treatment and avoid re-adding its water as a second liquid output."
      source_ids:
        - winther-451-assembly
        - ilcd-attributional-allocation-2010
    - rule_id: b_inventory_rejected_toy
      applies_to: "rejected_toy"
      rule: "Actual separately discharged unreleasable or rejected whole toy, including actual unauthorized/failed work where it occurred. Its original Product UUID is not a Waste identity. Permission, postwork tests and acceptance govern continued qualification and disposition, not whether performed activity existed. No broken toy is assumed restorable and no reject creates new Q."
      source_ids:
        - winther-451-assembly
        - kriddo-factory-assembly-checks
        - ilcd-attributional-allocation-2010
    - rule_id: b_inventory_service_vapour_out
      applies_to: "service_vapour_out"
      rule: "Actual independently measured H2O vapour loss during storage, handling, cleanup or actual operation. Do not force an equal opposite input, treat all water as evaporated or fit two unknowns to one mass residual. An integrated vapour quantity is not multiplied by time again. Constituent water already leaving in a wet article or liquid effluent is excluded from this same-direction vapour term. Native Elementary flow is H2O water vapour, CAS7732-18-5, emissions to air with unspecified air subcompartment, Mass/kg. The synonym dump contains liquid water, ice and isotopic-water strings; these do not override the vapour basename, CAS and air destination. Use only measured ordinary H2O vapour leaving this foreground; not liquid wastewater, humidity uptake, steam purchased as Product, heavy/tritiated water or an aggregate VOC/COD indicator. Match a more specific real air compartment when known."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: b_inventory_carton_p
      applies_to: "carton_p"
      rule: "Conditional separately purchased new article P for this one corrugated shipping carton. The single-quotient numerator is the complete actual gross physical leg V, before economic shares or stock/burden correction. This disclosure row creates no second purchase, provider burden or credit. P and I are mutually exclusive ownership tags for the same inbound article; a whole wet incoming article includes its constituent water once. Record real influx even when the article/water remains in closing stock. All opening/closing empty, attached-WIP/FG and reusable-pool quantities stay in the pool equation. Only other same-direction incoming/outgoing flow terms can create X deduplication; a stock or opposite row cannot. Internal reuse cancels. Trace its one original upstream owner and any valid burden handover in the separate burden dimension; full physical gross V is never reduced by an allocation share. One actual complete corrugated shipping carton, including its supplied board, adhesive, print and water once. Declare actual fibre/board construction, coatings, dimensions, wet tare, provider gate and composition independently. It cannot represent a liner, stretch film, tape, wooden article, all packaging or waste. A generic unspecified packaging family does not establish this specific whole article; retain its unbound identity until a compatible complete native record is verified."
      source_ids:
        - winther-451-assembly
        - winther-451-spares
        - ilcd-attributional-allocation-2010
