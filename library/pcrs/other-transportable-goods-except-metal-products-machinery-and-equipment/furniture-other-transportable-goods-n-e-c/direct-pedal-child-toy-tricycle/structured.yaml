  calculation_rules:
    - id: raw_conversion
      applies_to: "all raw records"
      rule: "Convert original raw totals to their actual native extensive unit before allocation. Integrate a true rate over its measured intervals once; keep already integrated amounts intact. Mass from volume requires independently measured substance-specific density and state. Electricity kWh to MJ uses exact factor3.6; transport uses real gross payload and distance with declared empty-return convention."
      inputs:
        - "raw totals"
        - "actual units"
        - state
        - density
        - "measured intervals"
      output: "converted raw totals"
      source_ids:
        - ilcd-attributional-allocation-2010
    - id: stock_vectors
      applies_to: "manufacturing burden dimensions"
      rule: "For each exchange j: U_j = U_direct_j + B_open_store_j + R_store_j - B_close_store_j. U_direct is directly consumed nonstored expenditure or an already consumption-net record; R_store includes only receipts into the disjoint unused/unassigned non-WIP store. No receipt or vector can be in both U_direct and R_store. Apply the store correction once only to that store partition, excluding WIP, FG, packaging and separately assigned asset service. Do not correct an already consumption-net record again. A_j = opening WIP vector_j + U_j - closing WIP vector_j - legitimate T_other_j. T_other exists only for genuinely other cohort/function with justified transfer once, never ordinary waste/scrap sale alone. Closing FG is absent from the subtraction. Physical gross receipts remain full in their separate reconciliation view."
      inputs:
        - "disjoint raw/WIP and non-WIP vectors"
        - "actual consumption status"
        - "transfer evidence"
      output: "attributable manufacturing numerator A_j"
      source_ids:
        - ilcd-attributional-allocation-2010
    - id: service_vectors
      applies_to: "original-cohort service and asset burden dimensions"
      rule: "Determine actual performed service and evidenced asset-use burden by original cohort c and horizon H with the original Qc. Preserve historical vectors and D_rev from the actual original dispatch without assuming equal current return mass. Add true incremental replacement/repair/testing/treatment burdens once. Carry forward only evidenced unused/unassigned service or charge; no subtraction for performed service merely retained in closing FG."
      inputs:
        - "original cohort Qc"
        - H
        - "asset/service histories"
        - receipts
        - D_rev
      output: "attributable service numerator A_cj"
      source_ids:
        - ilcd-attributional-allocation-2010
    - id: gross_legs
      applies_to: "every gross disclosure row"
      rule: "Select numerator V as the complete actual physical event leg in its actual extensive unit. Keep V unscaled by economic shares, burden allocation or stock-vector subtraction. Pair its independent upstream/service burden only with its original owner once. P/I overlap and X_in/X_out deduplicate other same-direction flow terms only; full new influx and full wet closing stocks coexist. A mixed-outlet origin does not create a second external row/quantity/provider."
      inputs:
        - "actual measured gross leg V"
        - "event/direction"
        - "original owner"
        - "same-direction counterpart"
      output: "complete gross numerator V"
      source_ids:
        - ilcd-attributional-allocation-2010
    - id: single_quotient
      applies_to: "all normalized accounting results"
      rule: "normalized_exchange = A / D exactly once after raw conversion and justified reconciliation/allocation. For manufacturing choose A=A_j and D=Q; for original-cohort service/treatment choose A=A_cj and D=Qc; for a physical gross disclosure choose A=full V and D=its declared original first-release Q or Qc. Those are separate non-additive dimensions. When D is zero or unknown retain real raw quantities and loads and issue no unit result. Save the result with dimension/cohort identity; cards and protocol aggregation retrieve that same result without another division."
      inputs:
        - A
        - D
        - dimension
        - "original cohort"
        - "saved numerator evidence"
      output: "normalized_exchange"
      source_ids:
        - ilcd-attributional-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "whole toy and all rows"
      requirement: "Physical terminal, child purpose, direct pedal route, component version, material/form/state and native constraints must agree; keep ordinary missing identities visible."
      evidence: "Primary full documents; actual BOM and drawings; exact native identity and unit checks"
    - id: dq_scope
      applies_to: "all actual operations"
      requirement: "Complete period includes failures, zero output, start/stop, idle, cleanup, samples, actual unapproved/failed work and waste/treatment; no missing measured value becomes zero."
      evidence: "Time logs; meters; disposition; bills and supplier coverage"
    - id: dq_vectors
      applies_to: "stocks and services"
      requirement: "Preserve every inherited exchange vector and vintage with disjoint raw/WIP/non-WIP/FG/repair/packaging/assets; document one numerator and one denominator for each non-additive dimension."
      evidence: "Physical reconciliation; original receipts; cohort and H; vector audit"
    - id: dq_unknowns
      applies_to: "dependent dataset"
      requirement: "Retain actual uncertainty, ordinary auxiliary/provider/quantity gaps, missing native localization and unsupported core claims honestly; publication or science/translation approval is not inferred."
      evidence: "Gap register; source applicability; measured uncertainty and acceptance evidence"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference and each bound row"
    rule: "Verify complete child-toy applicability, native dataset type/part-whole/material/form/route/phase/geography/media, every property and true reference unit, and exact official Chinese display. A broad compatible whole manufactured family may be narrowed by positive primary terminal evidence; hard identity conflicts cannot be waived by taxonomy or name similarity. An unconfirmed core reference is a draft/unusable identity hold. An ordinary auxiliary UUID/provider/quantity gap remains explicit and does not by itself invalidate the demonstrated core."
    source_ids:
      - winther-toy-catalogue-2025
      - winther-451-spares
      - kriddo-factory-assembly-checks
  - rule_id: v_reference
    applies_to: "finished; all accounting results"
    rule: "Require first whole acceptance and same-configuration calibrated net weighing. Confirm Q includes released closing FG once, every numerator retains failures/idle/cleanup/testing and appropriate stocks/vectors, and only one saved quotient is used. Q=0 or missing Q preserves raw loads and produces no unit result; no unknown may be called zero or passed. Native MJ, kg, m3 and transport properties remain their own extensive units."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: v_reconciliation
    applies_to: "all physical gates"
    rule: "Reconcile manufacture, FG/service and combined physical gates; each wet packaging pool and each gross leg; actual water phases/species; raw/WIP/non-WIP and durable-asset/service vectors. Verify X only against another same-direction flow term and retain wet closing stock plus actual new influx. Verify mixed totals versus origin subaccounts and treatment/provider ownership once. A mass residual is not independent water/species evidence."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: v_quality
    applies_to: "actual dataset production"
    rule: "Retain incoming component version compatibility, actual fastening/rotation/steering/seat checks, safety and destructive-test results, permission/postwork tests and disposition where actual work occurred, whole upstream coverage and uncertainties. Conformity/age/load claims need their actual market-specific evidence; no source certificate is transferred. A mechanical/schema/projection check does not constitute scientific review, translation approval, mapping acceptance or publication."
    source_ids:
      - winther-451-assembly
      - winther-451-spares
      - kriddo-factory-assembly-checks
      - ilcd-attributional-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Configured attributional first-release manufacturing dataset plus separately identified actual original-cohort service horizon"
  allowed_use: "Compatible complete non-electric direct-pedal child toy supply with verified whole upstream coverage and declared components/gates; scope-specific comparison only"
  excluded_use: "Exclude adult, passenger/cargo or road-transport tricycles; bicycles and balance bikes; scooters; electric or combustion toys; hand-lever and solely push-propelled ride-ons; dolls' carriages and strollers; multi-rider/recumbent variants; toy train/model/construction sets; loose wheels, raw steel/plastic, component-only kits and remanufacturing as the reference terminal. Riding, child metabolism, road infrastructure, use-stage repairs and end of life are not part of the manufacturing reference. Actual pre-dispatch storage/handling/packing and actual returned-product work within the declared service horizon remain separately traceable to original release cohorts."
  required_metadata: "actual manufacturer and model; serial and first-release cohort; child-toy purpose and direct front-wheel pedal drive; frame substrate grade and welded geometry; actual coating and supplied frame completeness; fork and handlebar module version; seat rubber specification and fitting; solid tyre and hub specification; steel crank and non-slip pedal configuration; wheel bearing and head-tube bush identities by version; grips and steering-stop configuration; axle fasteners and actual component supply overlaps; all integral delivered accessories; calibrated net whole-toy weighing and tare; configuration-specific acceptance plan and results; actual rework permission and postwork disposition; site geography and production period; utility state and upstream supplier coverage; opening and closing raw WIP and unassigned-store vectors; released FG and original-cohort service horizon; gross dispatch returns and original-dispatch reversal; each packaging pool and supplier-included ownership; allocation evidence and unresolved actual quantities"
  required_quality_disclosure: "Primary-source limitations; component version and actual acceptance; supplier coverage; native restrictions; unresolved identities/quantities; allocation and all cohort/stock/service/physical-gross reconciliation; observed H and unobserved future"
  update_trigger: "Actual route, component/BOM, material/finish, release gate, source version, supply geography, native identity, provider, allocation or service horizon changes require review in this same single record"
data_sources:
  - id: "winther-toy-catalogue-2025"
    type: "handbook"
    reference: "Winther Catalogue 2025–2026, complete manufacturer-authored PDF, pp11 and15–17; https://www.alprovi.nl/uploads/documents/winther_catalogue_2025.pdf"
    used_for: "Complete child tricycle terminal; rubber seat/grips/stops and solid rubber tyres; industrial ball-bearing version; steel crank; upstream weld/powder-coat illustration. Distributor-hosted original, not same-factory procurement or quantitative defaults."
  - id: "winther-451-assembly"
    type: "handbook"
    reference: "A. Winther A/S, 451 Assembly instruction and instructions for use, complete2-page original; https://www.a-winther.com/Files/Filer/winther/Assembly-Instructions/451_Assembly.pdf"
    used_for: "Actual handlebar/fork fitment and fastening; component maintenance and compatibility limitations. Adult/user assembly instructions do not alone prove factory manufacture or that shipment was fully assembled; no age/load/certification transfer."
  - id: "winther-451-spares"
    type: "handbook"
    reference: "A. Winther A/S, 451 Spare Parts, complete2-page exploded drawing and451.00 version2.1 table; https://www.a-winther.com/Files/Filer/winther/Spare-Parts/451_Spares.pdf"
    used_for: "Whole supplied fork/grip/fitting and front-wheel/crank/pedal modules; rear wheel/axle/seat and small-part relationships; disjoint supply-completeness protocol. No material recipe or universal component version."
  - id: "kriddo-factory-assembly-checks"
    type: "literature"
    reference: "KRIDDO, Inside KRIDDO’s Factory: Where Safety and Responsibility Come to Life, full manufacturer HTML; https://kriddo.com/blogs/brand-story/inside-kriddo-factory-where-safety-and-responsibility-come-to-life"
    used_for: "Explicit tricycle component selection/compatibility and safety checks before factory exit as a qualitative manufacturing/release example. Adjacent balance-bike welding passages and duplicated marketing claims do not establish this toy’s raw fabrication or quantitative/certification defaults."
  - id: "ilcd-attributional-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for Life Cycle Assessment—Detailed guidance, first edition March2010, §7.9.2–7.9.3, printed pp255–272; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
