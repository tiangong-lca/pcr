    - rule_id: b_full_collection_context
      applies_to: "all collection records"
      rule: "The following protocols collect actual unnormalized event/cohort records. Their aggregation_rule names the final reference basis only: it retrieves the one saved normalized_exchange calculated after reconciliation and allocation, and does not divide raw values. The gross view and assigned LCI burden view are separate non-additive views. Actual additional atomic flows require their own row and protocol before a dataset is usable. No site data, missing occurrence or missing UUID is filled with zero."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: b_full_reference_context
      applies_to: "complete reference and producer conditions"
      rule: "Every required qualifier belongs in the real dataset metadata, process notes, reference-flow comment or equivalent field. Native broad whole-family use is restricted by §1 and by the complete terminal conditions on the finished card. Q is measured whole net mass; no source catalogue single-item mass is adopted. Q0 is an acceptance-event account: sum independently weighed complete net masses of each unique first-accepted configuration once, locking that original mass to its serial/cohort. Q=Q0 for manufacture; original Qc=Q0 for later observed service. Partition every originally accepted identity into disjoint net remaining deliveries, all actual on-site accepted states (stored, held, damaged, sampled, returned, repair WIP), irreversible whole-product losses and other terminal dispositions on its original acceptance-mass basis. Record every state/exit; delivery-plus-closing-FG is only a simplified bridge when other postgate states/exits are proven absent. Returns, repeated tests, repairs, dispatch loops, added parts and changed moisture/current mass create no new Q0. Partial material/water loss is separately measured physical change; do not restore that loss into the surviving product and also add it as an outlet. Current physical mass/stock balances are independent of the original event-mass partition. Original service denominator remains even if nothing survives; zero or unknown Q0 retains raw loads and no unit result. Actual item count is an identity reconciliation, never a default kg-per-toy conversion. The complete-product route and physical component relationships are positive evidence; the assembly manual is adult/user assembly and does not establish a fully assembled factory shipment or an actual external-supplier purchase by Winther. Treat supplied-module manufacture as a bounded technical synthesis supported by the real modules and independent factory component/check evidence. A concrete dataset must identify each actual complete producer, its real raw-material preparation/fabrication/welding/surface treatment/coating/moulding/energy/species/waste gate and delivered composition, including any controlled on-site producer. Link that complete producer inventory once or expand its actual operations mutually exclusively. An invoice, an identity UUID, a user manual, a spare-part drawing or a promised future SOP alone never supplies those burdens. If work is actually done at the assembly site, include the complete real process before use; merely renaming it upstream does not exclude it. Missing essential core production/matrix procedure remains an explicit hold, not a condition silently waived by a software check. No shared-factory/SKU condition or empirical recipe is invented."
      source_ids:
        - winther-toy-catalogue-2025
        - winther-451-assembly
        - winther-451-spares
        - kriddo-factory-assembly-checks
        - ilcd-attributional-allocation-2010
    - rule_id: b_classification_context
      applies_to: "child riding toy scope"
      rule: "Official CPC3.0 notes explicitly include children tricycles in38510 and exclude bicycles49921; dolls/parts and scale-model categories have distinct neighbours. Use only as classification context, alongside the independently evidenced real complete child-ridden tricycle, native whole-product hardfields and this bounded route. No doll-carriage, real-infant pram, scale toy, bicycle, scooter sport product, component, transport service or whole-leaf/mapping approval is inferred."
      source_ids:
        - un-cpc3-toys
        - winther-toy-catalogue-2025
        - winther-451-spares
boundary_abstraction:
  declared_starting_condition: "Actual complete supplied finished coated frame/fork modules plus disjoint configured component articles; actual supply completeness and upstream burdens declared"
  starting_condition_role: "Full receiving-site mechanical manufacture from supplied components to whole first quality release"
  product_classification_scope: "Only the §1 pedal toy subset of CPC38510 in this semantic method"
  recursive_input_rule: "Do not purchase a finished tricycle into its own manufacture; whole supplied modules replace their contained stock and processing once; internal handoffs cancel"
  upstream_dataset_requirement: "Match each whole input provider to actual material/form/route/completeness/geography/period and transport; identity alone supplies no upstream inventory or excluded-component burden"
  disclosure: "Whole component supply BOM; actual operations; first-release Q; raw/WIP/FG and services; original-cohort horizon; gross packaging/assets; water states; allocation; upstream coverage and ordinary gaps"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Dolls' carriages, wheeled toys designed to be ridden by children"
    uuid: "5111519e-552a-4501-b70c-2f955b0a2217"
