allocation_rules:
  - rule_id: a_attributional
    applies_to: "all attributable burden dimensions"
    rule: "Use an explicitly attributional goal. First isolate exclusive operations and directly assigned exchanges; subdivide or virtually subdivide shared assembly, testing, handling and asset services wherever real records allow. Then determine exchange-specific physical causality from the operation that actually determines that input/emission/service. A convenient mass share or arbitrary physical/economic choice is not causality."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: a_residual
    applies_to: "genuine residual multifunctionality"
    rule: "Only the genuinely inseparable remainder may use common-process-gate market values for the real output states and same observation period, with quantities, prices, geography, sensitivity and reason physical causality cannot resolve it disclosed. Do not impose a fixed share, transport-stage final price, recycled-content credit or avoided-production substitution. No presumed coproduct is created by a failed toy, packaging return, reusable asset, scrap sale or treatment output."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: a_vectors
    applies_to: "manufacturing and original-cohort services"
    rule: "Conserve per-exchange inherited vectors across raw/WIP/FG/repair/packaging/asset stores and cohort handoffs. A legitimate other-cohort/function transfer requires physical identity, receiving owner and a justified allocation/handover decision once. Physical outward waste or sale alone never subtracts manufacturing/treatment burdens. Service follows its original Qc and horizon H; do not allocate historical services to unrelated new Q. Physical gross V and packaging six legs remain full before any burden allocation."
    source_ids:
      - ilcd-attributional-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "release"
      flow_role: "finished"
      record_type: "weighing and acceptance"
      raw_fields: "serial; configuration; calibrated complete net mass; measured tare; integral detached-parts mass; acceptance status; first-release time; original cohort; actual count; scale calibration and uncertainty"
      collection_method: "Calibrated actual complete net weighing and acceptance records; reconcile serial and exact installed/delivered integral parts, actual moisture state and measured tare. Sum uniquely first-released measured masses to Q; count reconciles configuration but supplies no kg-per-item default."
      unit: "kg"
      frequency: "Each individual first release"
      temporal_coverage: "Full cohort period and documented service horizon"
      site_scope: "Actual manufacturing site and configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale and tare records; serial acceptance; parts reconciliation; release register"
    - protocol_id: cp_frame
      process_id: "assembly"
      flow_role: "frame"
      record_type: "actual unnormalized event and stock records"
      raw_fields: "event and direction; physical identity; material and phase; supplier/module completeness; original unit; gross measured V; original cohort and Qc; time and H; opening/closing physical stocks; full wet composition; per-exchange inherited vectors; source owner; actual activity; uncertainty; provider/treatment receipt; X counterpart same-direction term"
      collection_method: "Collect unnormalized actual records for this one row; weigh mass or meter the stated extensive property with calibration and independent unit/state conversions. Establish the attributable current manufacturing or original-cohort service numerator only after the disjoint physical/stock/vector reconciliation and justified allocation. For W origins in a mixed outlet, retain independent measured origin values without re-adding them to the mixed total. For held FG retain all performed service; for any actually unauthorized or failed work preserve operations and disposition. Retrieve the unique saved normalized_exchange for the declared reference basis."
      unit: "kg"
      frequency: "Every actual event and period stock count"
      temporal_coverage: "Complete original-cohort period including failed and zero-output intervals; observed H"
      site_scope: "Declared manufacturing/service site and supply route"
      aggregation_rule: "per 1 kg reference flow"
