      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_attributional | all attributable burden dimensions | Use an explicitly attributional goal. First isolate exclusive operations and directly assigned exchanges; subdivide or virtually subdivide shared assembly, testing, handling and asset services wherever real records allow. Then determine exchange-specific physical causality from the operation that actually determines that input/emission/service. A convenient mass share or arbitrary physical/economic choice is not causality. | `ilcd-attributional-allocation-2010` |\n| a_residual | genuine residual multifunctionality | Only the genuinely inseparable remainder may use common-process-gate market values for the real output states and same observation period, with quantities, prices, geography, sensitivity and reason physical causality cannot resolve it disclosed. Do not impose a fixed share, transport-stage final price, recycled-content credit or avoided-production substitution. No presumed coproduct is created by a failed toy, packaging return, reusable asset, scrap sale or treatment output. | `ilcd-attributional-allocation-2010` |\n| a_vectors | manufacturing and original-cohort services | Conserve per-exchange inherited vectors across raw/WIP/FG/repair/packaging/asset stores and cohort handoffs. A legitimate other-cohort/function transfer requires physical identity, receiving owner and a justified allocation/handover decision once. Physical outward waste or sale alone never subtracts manufacturing/treatment burdens. Service follows its original Qc and horizon H; do not allocate historical services to unrelated new Q. Physical gross V and packaging six legs remain full before any burden allocation. | `ilcd-attributional-allocation-2010` |\n\n"
