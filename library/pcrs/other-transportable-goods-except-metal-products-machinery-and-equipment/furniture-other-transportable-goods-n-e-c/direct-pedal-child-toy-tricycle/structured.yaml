measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "The reference is 1 kg complete first-released net toy mass; measure each actual configuration on a suitable calibrated scale with real tare, included parts and acceptance record using cp_release. Sum measured accepted net masses to Q; no assumed item-to-kg factor."
  - id: native_extensive_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "actual native extensive property"
      uuid: ""
    required_unit: "actual row unit"
    rule: "Preserve each actual row numerator unit: kg for mass, MJ for electrical energy and t*km for transport. Integrate only actual rates; convert raw units and physical state first from independent measurements. Total integrated volume is not multiplied by duration again. No universal Mass/kg constraint applies to all rows."
  - id: one_result
    applies_to: "all accounting results"
    required_property_ref:
      name: "actual exchange property"
      uuid: ""
    required_unit: "actual exchange unit"
    rule: "Collection records unnormalized raw data only. Determine a numerator and its actual cohort denominator before the unique single_quotient operation in §8. Cards and protocol aggregation retrieve the same saved normalized_exchange; neither divides again. Zero/missing denominator preserves actual loads/stocks and yields no unit result."
