    - rule_id: b_inventory_service_electricity
      applies_to: "service_electricity"
      rule: "Actual incremental packing, storage, handling, inspection, permitted or unauthorized post-release work, hold and disposition energy, traced to original Qc and observation horizon H. Performed service stays with the original cohort even when FG is still in store; only demonstrably unused/unassigned service or charge may carry forward. No unrelated current manufacturing denominator. Native Product flow is <1 kV alternating current, consumption mix delivered to the user, grid-average supply with mixed generation. Use only for a compatible measured user-side supply and matching geographic/time provider; it is not dedicated hydropower, on-site generation, medium-voltage power or fuel. Native extensive reference is Net calorific value/MJ used here for electrical energy; retain metered kWh with exact conversion 3.6 MJ/kWh, not a heating-value or mass factor."
      source_ids:
        - kriddo-factory-assembly-checks
        - ilcd-attributional-allocation-2010
