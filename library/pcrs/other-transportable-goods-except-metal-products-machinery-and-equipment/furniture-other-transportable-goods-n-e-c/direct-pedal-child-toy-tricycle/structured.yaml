system_boundary:
  rules:
    - rule_id: b_evidence_scope
      applies_to: "selected assembly route"
      rule: "This is a qualitative technical synthesis, not a same-SKU or same-factory bill of materials. Winther's full manufacturer-authored catalogue (distributed PDF), product/component illustrations and 451 assembly/spares originals positively establish the toy terminal and real module structure; the catalogue also illustrates upstream welding/coating. The old manual's nylon-bearing wording does not override a current drawing or the catalogue's ball-bearing version. KRIDDO explicitly describes tricycle component compatibility and pre-exit safety checks; its adjacent balance-bike welding discussion is not proof of this toy's own fabrication route. None of these documents supplies universal alloy grade, polymer fractions, paint chemistry/thickness, temperature, pressure, duration, factory energy, load/age/test limit, certification, lifespan or nominal single-toy mass for this PCR. An actual configured release plan and supply completeness must be collected."
      source_ids:
        - winther-toy-catalogue-2025
        - winther-451-assembly
        - winther-451-spares
        - kriddo-factory-assembly-checks
    - rule_id: b_route
      applies_to: "manufacture"
      rule: "Include all actual receipt checks, internal handling, fitting/fastening, bearing and steering fit checks, actual lubrication/cleaning, whole-product examination, destructive/sample testing, start/stop, idle, failures, cleanup and actual rework needed for the first configured release. Record failed or unauthorized work as performed activity with actual hold/waste disposition. Actual factory release requires a complete functioning pedal/steering/wheel/seat configuration and declared acceptance results; a user manual alone cannot certify factory production. No source load, age, conformity logo or test threshold becomes a PCR default."
      source_ids:
        - winther-toy-catalogue-2025
        - winther-451-assembly
        - winther-451-spares
        - kriddo-factory-assembly-checks
    - rule_id: b_whole_inputs
      applies_to: "all supplied articles"
      rule: "Acquire each complete supplied frame, fork, wheel, seat, fitting kit, preparation and wet packaging article once. Maintain non-purchased composition subaccounts for included metal/plastic/paint/bearings/grease/adhesive/water. Actual separately supplied or site-mixed constituents are disjoint and separately inventoried with actual energy and losses. No raw stock or presumed surface-treatment recipe is additionally purchased for a finished supplied assembly. Same-category finished toy input cannot stand in for assembly."
      source_ids:
        - winther-toy-catalogue-2025
        - winther-451-spares
    - rule_id: b_first_release
      applies_to: "finished"
      rule: "Q is the sum of individually measured net kg of uniquely first-released complete toys in the manufacturing cohort. Released closing FG is already included in Q once; neither closing FG nor later shipments add production. Unreleased partial toys remain WIP. Record all integral delivered parts once even when temporarily detached for transport; do not replace measured net mass by catalogue/shipping mass, payload capacity, BOM estimates or secondary property coefficients."
      source_ids:
        - winther-toy-catalogue-2025
        - winther-451-assembly
        - kriddo-factory-assembly-checks
    - rule_id: b_stocks
      applies_to: "manufacture"
      rule: "For each exchange j and real supply vintage, record disjoint opening/closing raw and auxiliary stocks, component stores, in-process fluids/charge and WIP with physical amounts, composition, moisture and every inherited exchange vector. U_j is current manufacturing expenditure after one justified non-WIP unused/unassigned stock correction. Combine U_j with opening WIP vectors and carry forward only evidenced closing WIP vectors. Already stock-corrected consumption is not corrected again. Closing FG never enters the manufacturing subtraction. Failed parts, waste, samples and sold scrap retain their manufacturing/treatment burdens unless a genuinely other cohort/function and justified allocation/handover transfer that vector once. Internal handoffs conserve physical quantities/vectors and cancel at the combined gate."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: b_service
      applies_to: "service"
      rule: "Trace actual storage, packing, handling, dispatch, returns, reinspection and incremental post-release work to original cohort Qc and observed horizon H. Keep opening/closing FG and repair WIP physical mass and manufacturing/service vectors. Reverse original dispatch assignment only from its real evidence D_rev; returned physical mass may differ through missing parts, additions, contamination or water. New and old replacement parts and removed reusable/waste parts have their own measured stores/vectors. Already performed original-cohort service is not removed because FG stays in store; only unused/unassigned service or charge carries forward. Manufacturer/specification permission plus postwork tests and acceptance govern continued qualification, while all unauthorized/failed actual work and actual disposition remain. Repair/reinspection/dispatch never creates new Q."
      source_ids:
        - winther-451-assembly
        - winther-451-spares
        - kriddo-factory-assembly-checks
        - ilcd-attributional-allocation-2010
    - rule_id: b_gross_physical
      applies_to: "all gross disclosure rows"
      rule: "A gross event row uses full real event quantity V before allocation; its single quotient never takes a manufacturing/service burden vector, Bopen+U-Bclose, revenue share or net stock consumption as the numerator. Gross rows disclose physical legs and must not attach another purchase/provider/credit. Their independent attributable upstream or service burden dimension A_j is recorded once with original ownership and vintage. Physical gross mass is never reduced by a burden share. The eventual foreground data package must expose both the gross reconciliation view and the assigned-inventory view and must not sum those different views as extra exchanges."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: b_pack_pool
      applies_to: "packaging"
      rule: "For each carton, film, pallet, tape, leaflet and actual grease pot separately: opening empty+opening attached WIP/FG+opening reusable pool+P+I+ER+X_in = closing empty+closing attached WIP/FG+closing reusable pool+gross shipment S+outward external return EO+W+X_out. P/I must be disjoint for the same inbound whole wet article; I preserves actual physical ingress and its one upstream owner. ER includes actual packaging attached to returned toys. Internal reuse cancels; packaging is excluded from net toy Q, a second purchase and automatic coproduct status. Each six-leg card has its own actual direction and protocol. If only one mixed waste outlet exists, its one external Waste card/treatment owns the total, while each pool W remains an independently measured origin subaccount and is not re-added."
      source_ids:
        - winther-451-assembly
        - winther-451-spares
        - ilcd-attributional-allocation-2010
    - rule_id: b_water
      applies_to: "all processes"
      rule: "Reconcile whole wet articles/preparations and their water subaccounts without overlap. Actual natural atmospheric uptake/release in ordinary storage and handling is included without inventing a repair. New liquid water and repair materials remain real inflows even when retained in full wet closing stock. X_in/X_out removes only another same-direction flow term that already contains the same material/water, never stock, a reverse card or a repair permission condition. Distinguish ordinary absorbed/free water, vapour, liquid, genuinely evidenced chemical/structural water and species. This assembly route implies no default reaction water. Independent density/state and physical mass/element balances do not establish molecular speciation or solve two unknowns from one residual."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: b_physical_gates
      applies_to: "manufacture; service; consolidated gate"
      rule: "Manufacturing physical gate: opening raw/auxiliary/non-WIP stores + opening WIP + actual receipts and disjoint water uptake = first-release Q + matching closing stores/WIP + every actual waste/loss/return. FG/service gate: opening FG + first-release transfer + actual returned toys + disjoint issued repair parts/water + opening repair WIP = closing FG + gross dispatch + discarded whole toys + removed components and real water/loss outputs + closing repair WIP. Independently reconcile unused repair-part stores, packaging pools and durable assets; issued repair parts are internal transfers from those stores. Cancel internal release/part/repair transfers in the combined gate. Whole and constituent water are not added twice; retained water remains in wet closing mass. Check total mass and relevant metal/C/H/O balances from actual composition without fictional gas species or forced symmetric outlets."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: b_assets_utilities
      applies_to: "assets; utilities"
      rule: "Physical asset acquisition/return/retirement and installed fluid inventories are separate from current service burden. Retain actual new/used repair parts, moisture and fluids by individual physical identity. Meter each real electricity, water, compressed air, heat, fuel and identified elementary species if present; add a specific card and protocol for an actual missing exchange before dataset use. No boiler, steam, fuel combustion, shielding gas, compressed-air purchase or heat recovery is presumed for this receiving assembly route. If an external thermal carrier actually exists, record its real Product supply/return mass and thermal states/enthalpy and supplier water/energy convention once; never both a whole provider and duplicated contained mass/MJ nor an invented boiler credit."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: b_original_acceptance_context
      applies_to: "complete applicable context"
      rule: "Q0 is an acceptance-event account: sum independently weighed complete net masses of each unique first-accepted configuration once, locking that original mass to its serial/cohort. Q=Q0 for manufacture; original Qc=Q0 for later observed service. Partition every originally accepted identity into disjoint net remaining deliveries, all actual on-site accepted states (stored, held, damaged, sampled, returned, repair WIP), irreversible whole-product losses and other terminal dispositions on its original acceptance-mass basis. Record every state/exit; delivery-plus-closing-FG is only a simplified bridge when other postgate states/exits are proven absent. Returns, repeated tests, repairs, dispatch loops, added parts and changed moisture/current mass create no new Q0. Partial material/water loss is separately measured physical change; do not restore that loss into the surviving product and also add it as an outlet. Current physical mass/stock balances are independent of the original event-mass partition. Original service denominator remains even if nothing survives; zero or unknown Q0 retains raw loads and no unit result. Actual item count is an identity reconciliation, never a default kg-per-toy conversion."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: b_complete_producer_context
      applies_to: "complete applicable context"
      rule: "The complete-product route and physical component relationships are positive evidence; the assembly manual is adult/user assembly and does not establish a fully assembled factory shipment or an actual external-supplier purchase by Winther. Treat supplied-module manufacture as a bounded technical synthesis supported by the real modules and independent factory component/check evidence. A concrete dataset must identify each actual complete producer, its real raw-material preparation/fabrication/welding/surface treatment/coating/moulding/energy/species/waste gate and delivered composition, including any controlled on-site producer. Link that complete producer inventory once or expand its actual operations mutually exclusively. An invoice, an identity UUID, a user manual, a spare-part drawing or a promised future SOP alone never supplies those burdens. If work is actually done at the assembly site, include the complete real process before use; merely renaming it upstream does not exclude it. Missing essential core production/matrix procedure remains an explicit hold, not a condition silently waived by a software check. No shared-factory/SKU condition or empirical recipe is invented."
      source_ids:
        - winther-toy-catalogue-2025
        - winther-451-assembly
        - winther-451-spares
        - kriddo-factory-assembly-checks
    - rule_id: b_whole_waste_context
      applies_to: "complete applicable context"
      rule: "For every whole contaminated wipe, pot, filter or actual mixed waste event retain complete raw Qt including substrate, retained preparation/solids and water once. The actual receiver transfer and total fulfilled provider demand remain full independently of economic/environmental attribution. Component analyses are nested nonadditive ledgers unless physically separated before the gate. Keep the whole event/provider total separate from the distinct nonoverlapping A_j vectors and A_j/Q0 of original cohorts. A physical-only gross V disclosure creates no additional purchase/treatment/characterization; an attributable exchange never relabels its A_j as a reduced physical export. Do not charge the whole shared event anew to each cohort or add a provider aggregate beside its contained expanded history. Unknown receiver, method or allocation remains unresolved."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: b_complete_packaging_context
      applies_to: "complete applicable context"
      rule: "Each actual packaging article uses opening complete wet stocks+P+I+ER+X_in = closing complete wet stocks+S+EO+W+X_out. Include empty, reusable, attached WIP and attached FG pools. X terms are independently measured separately added/removed material or water not already within another same-side flow; deduplicate only the identical other same-side incoming/outgoing event, never an opening/closing stock, opposite leg or merely an existing card. A wet whole receipt includes its original components/water once; a real new repair/water input retained at closing remains both a real influx and full wet closing stock. P/I source ownership, return histories and W component/mixed-outlet ledgers remain disjoint. No packaging adds reference Q, re-purchase or automatic credit."
