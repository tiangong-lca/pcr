          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_identity | reference and each bound row | Verify complete child-toy applicability, native dataset type/part-whole/material/form/route/phase/geography/media, every property and true reference unit, and exact official Chinese display. A broad compatible whole manufactured family may be narrowed by positive primary terminal evidence; hard identity conflicts cannot be waived by taxonomy or name similarity. An unconfirmed core reference is a draft/unusable identity hold. An ordinary auxiliary UUID/provider/quantity gap remains explicit and does not by itself invalidate the demonstrated core. | `winther-toy-catalogue-2025`; `winther-451-spares`; `kriddo-factory-assembly-checks` |\n| v_reference | finished; all accounting results | Require first whole acceptance and same-configuration calibrated net weighing. Confirm Q includes released closing FG once, every numerator retains failures/idle/cleanup/testing and appropriate stocks/vectors, and only one saved quotient is used. Q=0 or missing Q preserves raw loads and produces no unit result; no unknown may be called zero or passed. Native MJ, kg, m3 and transport properties remain their own extensive units. | `ilcd-attributional-allocation-2010` |\n| v_reconciliation | all physical gates | Reconcile manufacture, FG/service and combined physical gates; each wet packaging pool and each gross leg; actual water phases/species; raw/WIP/non-WIP and durable-asset/service vectors. Verify X only against another same-direction flow term and retain wet closing stock plus actual new influx. Verify mixed totals versus origin subaccounts and treatment/provider ownership once. A mass residual is not independent water/species evidence. | `ilcd-attributional-allocation-2010` |\n| v_quality | actual dataset production | Retain incoming component version compatibility, actual fastening/rotation/steering/seat checks, safety and destructive-test results, permission/postwork tests and disposition where actual work occurred, whole upstream coverage and uncertainties. Conformity/age/load claims need their actual market-specific evidence; no source certificate is transferred. A mechanical/schema/projection check does not constitute scientific review, translation approval, mapping acceptance or publication. | `winther-451-assembly`; `winther-451-spares`; `kriddo-factory-assembly-checks`; `ilcd-attributional-allocation-2010` |\n\n"
