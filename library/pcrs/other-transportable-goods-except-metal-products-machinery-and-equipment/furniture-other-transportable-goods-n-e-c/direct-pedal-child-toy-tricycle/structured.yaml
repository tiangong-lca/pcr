    - rule_id: b_inventory_assets_vapour_out
      applies_to: "assets_vapour_out"
      rule: "Actual independently measured H2O vapour loss during storage, handling, cleanup or actual operation. Do not force an equal opposite input, treat all water as evaporated or fit two unknowns to one mass residual. An integrated vapour quantity is not multiplied by time again. Constituent water already leaving in a wet article or liquid effluent is excluded from this same-direction vapour term. Native Elementary flow is H2O water vapour, CAS7732-18-5, emissions to air with unspecified air subcompartment, Mass/kg. The synonym dump contains liquid water, ice and isotopic-water strings; these do not override the vapour basename, CAS and air destination. Use only measured ordinary H2O vapour leaving this foreground; not liquid wastewater, humidity uptake, steam purchased as Product, heavy/tritiated water or an aggregate VOC/COD indicator. Match a more specific real air compartment when known."
