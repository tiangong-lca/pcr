attributable treatment service for that outlet, not a second waste-mass discharge. If the originating W is merely a subaccount in the single mixed outlet, this separate service is not additionally invoked; that mixed outlet owns treatment once. No default recycling rate or avoided-production credit. | `ilcd-attributional-allocation-2010` |\n| b_inventory_repair_nail_discard_treatment | `repair_nail_discard_treatment` | Conditional actual treatment service solely for repair_nail_discard. Retain receipt, actual route, composition/hazard, provider reference and charge convention. Its numerator is actual attributable treatment service for that outlet, not a second waste-mass discharge. If the originating W is merely a subaccount in the single mixed outlet, this separate service is not additionally invoked; that mixed outlet owns treatment once. No default recycling rate or avoided-production credit. | `ilcd-attributional-allocation-2010` |\n| b_inventory_gear_oil_discard_treatment | `gear_oil_discard_treatment` | Conditional actual treatment service solely for gear_oil_discard. Retain receipt, actual route, composition/hazard, provider reference and charge convention. Its numerator is actual attributable treatment service for that outlet, not a second waste-mass discharge. If the originating W is merely a subaccount in the single mixed outlet, this separate service is not additionally invoked; that mixed outlet owns treatment once. No default recycling rate or avoided-production credit. | `ilcd-attributional-allocation-2010` |\n| b_inventory_assets_water_out_treatment | `assets_water_out_treatment` | Conditional actual treatment service solely for assets_water_out. Retain receipt, actual route, composition/hazard, provider reference and charge convention. Its numerator is actual attributable treatment service for that outlet, not a second waste-mass discharge. If the originating W is merely a subaccount in the single mixed outlet, this separate service is not additionally invoked; that mixed outlet owns treatment once. No default recycling rate or avoided-production credit. | `ilcd-attributional-allocation-2010` |\n| b_full_collection_context | all collection records | The following protocols collect actual unnormalized event/cohort records. Their aggregation_rule names the final reference basis only: it retrieves the one saved normalized_exchange calculated after reconciliation and allocation, and does not divide raw values. The gross view and assigned LCI burden view are separate non-additive views. Actual additional atomic flows require their own row and protocol before a dataset is usable. No site data, missing occurrence or missing UUID is filled with zero. | `ilcd-attributional-allocation-2010` |\n| b_full_reference_context | complete reference and producer conditions | Every required qualifier belongs in the real dataset metadata, process notes, reference-flow comment or equivalent field. Native broad whole-family use is restricted by §1 and by the complete terminal conditions on the finished card. Q is measured whole net mass; no source catalogue single-item mass is adopted. Q0 is an acceptance-event account: sum independently weighed complete net masses of each unique first-accepted configuration once, locking that original mass to its serial/cohort. Q=Q0 for manufacture; original Qc=Q0 for later observed service. Partition every originally accepted identity into disjoint net remaining deliveries, all actual on-site accepted states (stored, held, damaged, sampled, returned, repair WIP), irreversible whole-product losses and other terminal dispositions on its original acceptance-mass basis. Record every state/exit; delivery-plus-closing-FG is only a simplified bridge when other postgate states/exits are proven absent. Returns, repeated tests, repairs, dispatch loops, added parts and changed moisture/current mass create no new Q0. Partial material/water loss is separately measured physical change; do not restore that loss into the surviving product and also add it as an outlet. Current physical mass/stock balances are independent of the original event-mass partition. Original service denominator remains even if nothing survives; zero or unknown Q0 retains raw loads and no unit result. Actual item count is an identity reconciliation, never a default kg-per-toy conversion. The complete-product route and physical component relationships are positive evidence; the assembly manual is adult/user assembly and does not establish a fully assembled factory shipment or an actual external-supplier purchase by Winther. Treat supplied-module manufacture as a bounded technical synthesis supported by the real modules and independent factory component/check evidence. A concrete dataset must identify each actual complete producer, its real raw-material preparation/fabrication/welding/surface treatment/coating/moulding/energy/species/waste gate and delivered composition, including any controlled on-site producer. Link that complete producer inventory once or expand its actual operations mutually exclusively. An invoice, an identity UUID, a user manual, a spare-part drawing or a promised future SOP alone never supplies those burdens. If work is actually done at the assembly site, include the complete real process before use; merely renaming it upstream does not exclude it. Missing essential core production/matrix procedure remains an explicit hold, not a condition silently waived by a software check. No shared-factory/SKU condition or empirical recipe is invented. | `winther-toy-catalogue-2025`; `winther-451-assembly`; `winther-451-spares`; `kriddo-factory-assembly-checks`; `ilcd-attributional-allocation-2010` |\n| b_classification_context | child riding toy scope | Official CPC3.0 notes explicitly include children tricycles in38510 and exclude bicycles49921; dolls/parts and scale-model categories have distinct neighbours. Use only as classification context, alongside the independently evidenced real complete child-ridden tricycle, native whole-product hardfields and this bounded route. No doll-carriage, real-infant pram, scale toy, bicycle, scooter sport product, component, transport service or whole-leaf/mapping approval is inferred. | `un-cpc3-toys`; `winther-toy-catalogue-2025`; `winther-451-spares` |\n\n"
