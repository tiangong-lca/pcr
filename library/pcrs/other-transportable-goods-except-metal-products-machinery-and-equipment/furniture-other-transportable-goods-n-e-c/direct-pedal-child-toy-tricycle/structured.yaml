    - rule_id: b_inventory_packaging_vapour_out
      applies_to: "packaging_vapour_out"
      rule: "Actual independently measured H2O vapour loss during storage, handling, cleanup or actual operation. Do not force an equal opposite input, treat all water as evaporated or fit two unknowns to one mass residual. An integrated vapour quantity is not multiplied by time again. Constituent water already leaving in a wet article or liquid effluent is excluded from this same-direction vapour term. Native Elementary flow is H2O water vapour, CAS7732-18-5, emissions to air with unspecified air subcompartment, Mass/kg. The synonym dump contains liquid water, ice and isotopic-water strings; these do not override the vapour basename, CAS and air destination. Use only measured ordinary H2O vapour leaving this foreground; not liquid wastewater, humidity uptake, steam purchased as Product, heavy/tritiated water or an aggregate VOC/COD indicator. Match a more specific real air compartment when known."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: b_inventory_driver_service
      applies_to: "driver_service"
      rule: "Only actual observed fulfilled electric assembly screwdriver service of the declared physical configuration and original cohort. Record real use intervals, duty/capacity, existing/new/used asset history and a compatible provider or own-asset burden vector; no fixed lifetime, nominal one-tool-per-kg or current purchase assumption. Full physical acquisition/return/retirement and wet fleet mass remain separate and are never reduced by a service share. Included parts, fluids and maintenance are singly owned. The h unit is used only with actual timed service and a justified compatible provider/capacity conversion; otherwise the result remains unresolved rather than inventing a conversion. For a reused cloth retain its complete substrate/retained material/water history and the actual final whole contaminated outlet. A disposable cloth consumed once is not additionally assigned a duplicated reusable-service burden."
