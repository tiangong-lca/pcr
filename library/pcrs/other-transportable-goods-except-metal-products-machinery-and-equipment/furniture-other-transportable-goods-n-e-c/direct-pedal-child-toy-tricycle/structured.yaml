    - rule_id: b_inventory_cleaner
      applies_to: "cleaner"
      rule: "Conditional actual whole aqueous neutral cleaning-detergent preparation. Identify one complete supplier article/formulation with supplier data and actual use. Count its carrier water, active ingredients and additives only in a composition subledger. Do not substitute wax/solvent lubricant for bearing grease, pure EDTA for a cleaner, or an unspecified textile for cotton; in-house mixing requires each real purchased constituent and its real mixing/loss exchanges before use."
      source_ids:
        - winther-451-assembly
        - winther-451-spares
    - rule_id: b_inventory_wipe
      applies_to: "wipe"
      rule: "Conditional actual supplied cotton wiping cloth. Identify one complete supplier article/formulation with supplier data and actual use. Count its carrier water, active ingredients and additives only in a composition subledger. Do not substitute wax/solvent lubricant for bearing grease, pure EDTA for a cleaner, or an unspecified textile for cotton; in-house mixing requires each real purchased constituent and its real mixing/loss exchanges before use."
      source_ids:
        - winther-451-assembly
        - winther-451-spares
    - rule_id: b_inventory_inbound_freight
      applies_to: "inbound_freight"
      rule: "One real road freight service; collect actual carried gross payload, distance, vehicle/capacity, loading and empty-return convention. Native candidates fixed to a 30-ton diesel truck are not a generic provider. No distance, vehicle or fuel default. Transport already included in a whole provider is not purchased again."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: b_inventory_assembly_humidity_in
      applies_to: "assembly_humidity_in"
      rule: "Conditional measured atmospheric H2O uptake in actual storage/handling or operation, independently from water losses. Keep the full new influx and full wet closing mass simultaneously; subtract X_in only if the same water already belongs to another incoming term. No permission or repair is required for natural humidity exchange. An emission-to-water water-vapour UUID cannot be used for this resource input."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: b_inventory_frame_supplier_return
      applies_to: "frame_supplier_return"
      rule: "Conditional actual outward return of this supplied article to its supplier. Keep full physical gross quantity and the original provider/burden receipt; a documented reversal/handover is not a sale credit or negative manufacturing waste. Whole supplied frame includes welded seat supports and rear structure only as listed in the actual supply BOM. Verify substrate alloy/grade and coating state; the primary sources do not fix an alloy or universal grade. Exclude the separately accounted fork, wheels, axle and seat. This receiving site performs mechanical assembly; upstream fabrication, surface preparation and coating remain in the complete compatible frame provider."
      source_ids:
        - winther-toy-catalogue-2025
        - winther-451-spares
    - rule_id: b_inventory_fork_supplier_return
      applies_to: "fork_supplier_return"
      rule: "Conditional actual outward return of this supplied article to its supplier. Keep full physical gross quantity and the original provider/burden receipt; a documented reversal/handover is not a sale credit or negative manufacturing waste. One actual finished fork/handlebar module. Record included grips, nylon head-tube bushes, rubber stops, pivot fastener and fitting kit individually in its non-purchased composition subledger. Only separately received items use their separate purchase rows. The 451 spare drawing shows bundled fitments; never add the same fitment twice."
      source_ids:
        - winther-toy-catalogue-2025
        - winther-451-spares
    - rule_id: b_inventory_front_wheel_supplier_return
      applies_to: "front_wheel_supplier_return"
      rule: "Conditional actual outward return of this supplied article to its supplier. Keep full physical gross quantity and the original provider/burden receipt; a documented reversal/handover is not a sale credit or negative manufacturing waste. One whole supplied front-wheel module with actual hub, tyre, industrial ball bearings, solid one-piece steel crank, pedal fittings and pedals when included. Direct pedals rotate this wheel; no chain or motor is presumed. Preserve the exact component version; the old manual also discusses nylon bearings, so it cannot establish the current wheel bearing type by itself."
      source_ids:
        - winther-toy-catalogue-2025
        - winther-451-spares
    - rule_id: b_inventory_rear_wheel_supplier_return
      applies_to: "rear_wheel_supplier_return"
      rule: "Conditional actual outward return of this supplied article to its supplier. Keep full physical gross quantity and the original provider/burden receipt; a documented reversal/handover is not a sale credit or negative manufacturing waste. One specific complete rear-wheel article; total actual rear wheels of this configuration are weighed without imposing a kg-per-wheel factor. Supplier completeness identifies hub, tyre, bearing, hubcap, washers and split pin. A fully supplied wheel replaces contained tyre/rubber/plastic/metal/grease purchases; no pneumatic inner tube is assumed."
      source_ids:
        - winther-toy-catalogue-2025
        - winther-451-spares
    - rule_id: b_inventory_rear_axle_supplier_return
      applies_to: "rear_axle_supplier_return"
      rule: "Conditional actual outward return of this supplied article to its supplier. Keep full physical gross quantity and the original provider/burden receipt; a documented reversal/handover is not a sale credit or negative manufacturing waste. One actual finished rear axle, distinct from a complete powered-vehicle axle assembly and from raw steel stock. Declare alloy, geometry and finish from actual records. If the whole frame already includes this axle, retain the component subaccount and no second purchase."
      source_ids:
        - winther-toy-catalogue-2025
        - winther-451-spares
    - rule_id: b_inventory_seat_supplier_return
      applies_to: "seat_supplier_return"
      rule: "Conditional actual outward return of this supplied article to its supplier. Keep full physical gross quantity and the original provider/burden receipt; a documented reversal/handover is not a sale credit or negative manufacturing waste. One supplied rubber seat with actual integrated support/fastening components recorded in its whole-article BOM. The selected source configuration has a rubber seat; plastic, PU-upholstered and wooden seats are not silently substituted. No seat polymer recipe, mass, load or service life is invented."
      source_ids:
        - winther-toy-catalogue-2025
        - winther-451-spares
    - rule_id: b_inventory_assembly_contaminated_wipe
      applies_to: "assembly_contaminated_wipe"
      rule: "Only a real separately collected complete contaminated cotton wipe outlet. Qt includes substrate, retained grease/cleaner/particles and water once; independently measured source components are nested subaccounts, not separate exported wastes. Preserve the actual full wet transfer and receiver demand independently of attributed per-cohort A_j/Q0. If it enters the one actual mixed_manufacturing_waste outlet, keep only its nonadditive origin ledger and do not also use this separate export or treatment. If several cohorts contribute to one event, retain the whole actual event once and distinct nonoverlapping attributable vectors, never the whole Qt charged anew to each cohort. Hazard, real treatment, composition and uncertain assignment remain explicit."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: b_inventory_assembly_wastewater
      applies_to: "assembly_wastewater"
      rule: "Conditional one real liquid wastewater outlet with water, actual dissolved/suspended species and contaminants measured. Do not borrow an electrolytic-manganese washing wastewater UUID or an unverified generic wastewater type. COD, BOD, total nitrogen, VOC and total dust are indicators, not specific molecular masses. Match actual treatment and avoid re-adding its water as a second liquid output."
      source_ids:
        - winther-451-assembly
        - ilcd-attributional-allocation-2010
    - rule_id: b_inventory_mixed_manufacturing_waste
      applies_to: "mixed_manufacturing_waste"
      rule: "Conditionally owns the one real mixed outlet including measured failed parts, samples, dirty wipes and any packaging origins actually co-collected. Keep origin masses independently measured and nonoverlapping. Failed, defective, destructively tested and sold manufacturing residues retain manufacturing and treatment burdens; neither external transfer nor revenue alone removes them. Native Waste flow is a global at-plant production mix from final assembly and factory testing, Mass/kg; no quantified amount, treatment route or credit is specified. Use only for one actually collected mixed manufacturing-waste outlet. Identify constituents and origins in a disjoint subledger; do not add that subledger or its packaging W components to this outlet total again. Segregated outputs get their own rows and cannot also be inside this total. Hazard and provider compatibility require actual evidence."
      source_ids:
        - kriddo-factory-assembly-checks
        - ilcd-attributional-allocation-2010
    - rule_id: b_inventory_assembly_vapour_out
      applies_to: "assembly_vapour_out"
      rule: "Actual independently measured H2O vapour loss during storage, handling, cleanup or actual operation. Do not force an equal opposite input, treat all water as evaporated or fit two unknowns to one mass residual. An integrated vapour quantity is not multiplied by time again. Constituent water already leaving in a wet article or liquid effluent is excluded from this same-direction vapour term. Native Elementary flow is H2O water vapour, CAS7732-18-5, emissions to air with unspecified air subcompartment, Mass/kg. The synonym dump contains liquid water, ice and isotopic-water strings; these do not override the vapour basename, CAS and air destination. Use only measured ordinary H2O vapour leaving this foreground; not liquid wastewater, humidity uptake, steam purchased as Product, heavy/tritiated water or an aggregate VOC/COD indicator. Match a more specific real air compartment when known."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: b_inventory_finished
      applies_to: "finished"
      rule: "Only the unique first complete quality release. Q is measured complete net mass summed over individually accepted configurations, including first-released closing FG once. All integral components and accepted integral items detached solely for transport are included once with measured reconciliation; packaging, loose tools, spares, rider and payload are excluded. This is an actual whole-release gate, not a declaration that a source model is shipped fully assembled. A boxed part kit, reinspection, shipment or repaired previously released toy never creates Q. Native Product flow: finished manufactured product; production mix at plant. Its commentary positively includes children's tricycles and excludes bicycles, while also covering other wheeled toys and dolls' carriages. Use here only for the complete non-electric direct-front-wheel-pedal tricycle in §1; never a frame, wheel, kit, adult/cargo cycle, pushchair, scooter or electric toy. No fixed material, grade, geography, lifetime or single-item mass is supplied. Mass/kg is the reference property; no secondary-property conversion or inferred mass is used."
      source_ids:
        - winther-toy-catalogue-2025
        - winther-451-assembly
        - winther-451-spares
        - kriddo-factory-assembly-checks
    - rule_id: b_inventory_returned_toy
      applies_to: "returned_toy"
      rule: "Conditional actual external return of an originally first-released toy retaining its complete integral configuration. Weigh its actual condition, water and contamination separately from the recorded original dispatch. This bound whole Product card cannot represent an incomplete return; use the separate returned_incomplete_toy card for that real event and never both cards for one object. Preserve serial/cohort, original release Qc and reverse only the actual original dispatch/service assignment D_rev using original evidence. A return mass is not assumed equal to its earlier delivery mass and a return creates no Q. Native Product flow: finished manufactured product; production mix at plant. Its commentary positively includes children's tricycles and excludes bicycles, while also covering other wheeled toys and dolls' carriages. Use here only for the complete non-electric direct-front-wheel-pedal tricycle in §1; never a frame, wheel, kit, adult/cargo cycle, pushchair, scooter or electric toy. No fixed material, grade, geography, lifetime or single-item mass is supplied. Mass/kg is the reference property; no secondary-property conversion or inferred mass is used."
      source_ids:
        - winther-toy-catalogue-2025
        - winther-451-spares
    - rule_id: b_inventory_returned_incomplete_toy
      applies_to: "returned_incomplete_toy"
      rule: "Conditional actual return of the identifiable original toy with missing integral components; specific incomplete-article UUID remains unresolved rather than forcing a finished-whole binding. Record its serial, actual retained structure, each missing/added part, contamination and water, measured current mass and original dispatch evidence. Keep all inherited vectors and original Qc; do not assume current mass equals original delivery, grant a restoration credit or create new Q. This real gross event is disjoint from returned_toy and from any separately received detached components."
      source_ids:
        - winther-toy-catalogue-2025
        - winther-451-spares
    - rule_id: b_inventory_repair_frame_new
