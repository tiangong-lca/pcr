  calculation_rules:
    - id: c_net_release
      applies_to: "finished_puzzles"
      rule: "Q = sum of measured net mass of newly first-quality-released complete sets; keep actual complete-set count and configuration masses as independent reconciliation. No packaging, prior FG or never-accepted rejected/destroyed samples in Q; already first-accepted later destroyed sets remain in original Q and their actual loss/disposition bridge."
      inputs:
        - accepted_net_mass
        - release_id
        - cp_output_release
      output: "Q"
      source_ids:
        - ravensburger-puzzle-manufacture-2025
        - clementoni-puzzle-faq
    - id: c_manufacturing_vector
      applies_to: "burden dimensions only"
      rule: "For each exchange i: A_i = inherited assigned opening raw/WIP/unassigned-store vector + actual new attributable material/service/provider/work/treatment burden-addition vector before stock correction - genuinely unused/unassigned closing raw/WIP/store vector - justified transfer to a distinct other cohort/function. First-released closing FG is not a subtractable vector. Already stock-corrected consumption is not corrected again; ordinary scrap/sale/waste is not that other function."
      inputs:
        - opening_vectors
        - actual_new_burden_additions
        - closing_unassigned_vectors
        - justified_handover
        - cp_materials_receive
        - cp_materials_print
        - cp_materials_mount
      output: "A_i"
      source_ids:
        - ilcd-detailed-2010
    - id: c_final_burden
      applies_to: "manufacturing and service burden dimensions"
      rule: "b_i = A_i / Q exactly once after original-unit conversion and actual attribution. For performed original-cohort services use b_i_h = A_i_h / Qc exactly once with original measured Qc and observed H; only unused/unassigned service charge carries forward. Collection/aggregation/card descriptions refer to this single division and do not divide again. Q or Qc zero/missing yields no corresponding unit result, while actual raw loads remain."
      inputs:
        - A_i
        - Q
        - A_i_h
        - Qc
        - H
      output: "b_i; b_i_h"
      source_ids:
        - ilcd-detailed-2010
    - id: c_final_gross
      applies_to: "all physical gross cards"
      rule: "g_i=V_i/Qanalysis is a diagnostic of the full actual physical event recorded once with declared positive observation basis. Actual linked model demand uses separate evidenced A_i/Q0_i or A_i_h/Qc for each original cohort in compatible provider units. Never repeat the full shared receiver/provider quantity for every cohort or shrink physical V by service shares; zero or unknown basis has no unit result."
      inputs:
        - V_i
        - Qanalysis
        - A_i
        - Q0_i
        - A_i_h
        - Qc
        - cp_pack_pack
        - cp_service_service
      output: "g_i; g_i_h"
      source_ids:
        - ilcd-detailed-2010
    - id: c_wet_gates
      applies_to: "all physical stock and flow ledgers"
      rule: "For each consistent gate: full wet opening stock + actual gross incoming = full wet closing stock + actual gross outgoing, including actual retained new repair matter/water; internal matched transfers cancel only after pair reconciliation. At manufacture Q already includes first-released closing FG, so FG stock belongs to the distinct service/FG gate, never add Q and its same closing FG twice. For each packaging pool include actual P/I/ER and S/EO/W plus separately measured water/repair legs; X_in/out removes same-side other duplicate terms only. Whole/constituent totals are disjoint or reconciled nonadditive views."
      inputs:
        - wet_opening
        - actual_in
        - wet_closing
        - actual_out
        - transfer_pairs
        - X_in
        - X_out
      output: "gate residual and uncertainty"
      source_ids:
        - ilcd-detailed-2010
    - id: c_units
      applies_to: "native numerator conversions"
      rule: "Convert raw units before attribution: 1 kWh = 3.6 MJ; mass/volume requires the actual substance measured density at recorded phase/T/P, not a secondary-property coefficient or water default. Integrate actual rates over their measured interval once; cumulative volume is already integrated. Keep elemental and H2O balances independent of actual-species accounting and reaction evidence."
      inputs:
        - raw_quantity
        - native_unit
        - measured_density
        - phase
        - T
        - P
        - interval
      output: "converted_raw_quantity"
      source_ids:
        - epa-printing-eiip-2002
        - ilcd-detailed-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all selected flows"
      requirement: "Verify actual complete product/stock/preparation/phase/route/grade/type/media and native restrictions. UUID absence for ordinary auxiliary/provider data is tracked, while a contradictory or unconfirmed complete reference identity blocks use."
      evidence: "Full supplier BOM/SDS and native identity"
    - id: dq_measured
      applies_to: "all physical and burden quantities"
      requirement: "Calibrated scales/meters, independent moisture/assays/density/species, matched periods and documented uncertainty; no guessed formulation/mass/yield/time/lifetime/performance."
      evidence: "Calibration; original logs; lab methods; custody"
    - id: dq_lineage
      applies_to: "raw WIP stores FG and services"
      requirement: "Retain each state and every inherited exchange vector, raw failed/zero-output periods, actual source/recipient and performed H; gaps remain explicit and never zero."
      evidence: "Stock vector ledger; cohort release receipts; service events"
    - id: dq_scope
      applies_to: "evidence and provider coverage"
      requirement: "Producer case supports physical route only; no single SKU/factory universalization. Check all inputs/backgrounds and actual limits; scientific and translation approvals remain separate."
      evidence: "Complete source context; supplier coverage matrix; uncertainty"
validation_rules:
  - rule_id: v_core
    applies_to: "finished_puzzles"
    rule: "Verify one complete whole puzzle Product reference and its actual construction/state; components, substrate sheets, adhesive and boxes cannot replace it. Native compatibility includes full names/comments/CAS/route/form/grade/geography/type/media and every property/group/reference unit. A broad compatible manufactured family may be positively restricted to this terminal; a hard identity conflict is not waived by classification."
    source_ids:
      - ravensburger-puzzle-manufacture-2025
      - un-cpc-3-2025
  - rule_id: v_q
    applies_to: "reference and every row"
    rule: "Reconcile same Q/cohort/site/configuration in reference, inventory, raw protocols and one final quotient. Q includes released closing FG once. Production, FG/service and consolidated gates must agree; gross legs use V and burden dimensions use A independently. Missing or Q=0 blocks a unit result; missing data is not zero."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: v_completeness
    applies_to: "all processes"
    rule: "Retain every actual startup/idle/failed/rework/cleanup/treatment load and raw/WIP/non-WIP inherited vector. Screen every route and receipt for additional actual chemicals, fuels, refrigerants, packaging, components, liquids, Waste outlets and molecules; add one specific atomic card per real new exchange before claiming completeness. Do not hide unlisted real terms in other or zero."
    source_ids:
      - ravensburger-puzzle-manufacture-2025
      - epa-printing-eiip-2002
      - ilcd-detailed-2010
  - rule_id: v_balance
    applies_to: "materials; packaging; assets; species"
    rule: "Independently close whole wet mass, water and relevant elements with measurement uncertainty and every gross leg/stock. Match nonadditive formulation/whole-article bridges, each actual package P/I/ER/S/EO/W, repairs and water X same-side de-duplication, no lost retained influx and no invented split of one mixed Waste stream."
    source_ids:
      - ilcd-detailed-2010
      - epa-printing-eiip-2002
  - rule_id: v_source
    applies_to: "all rule evidence"
    rule: "Primary producer examples support route/terminal context only within their actual scope; no source supplies a universal recipe, yield, piece mass, drying schedule, lifetime or emission factor here. Retain actual supplier activity, measured density/assay, acceptance and complete backgrounds before data-package completeness."
    source_ids:
      - ravensburger-puzzle-manufacture-2025
      - clementoni-puzzle-faq
  - rule_id: v_units
    applies_to: "all inventory rows"
    rule: "Preserve each exchange native extensive numerator, including kg, MJ, kWh, m3 and actual time if applicable; Mass/kg requirements apply only to the net reference denominator and mass exchanges. No count-to-kg factor, density or geometrical yield is derived from nominal pieces, box size, thickness, retail weight or a secondary flow-property coefficient."
    source_ids:
      - clementoni-puzzle-faq
      - ilcd-detailed-2010
  - rule_id: v_rework
    applies_to: "service"
    rule: "Only actual documented postrelease work is modelled; qualification requires manufacturer/spec permission, postwork tests, acceptance and disposition. Unauthorized/failed/rejected real work and logistics remain in raw ledgers with actual hold/waste outcome; no new first-release Q or assumed repaired product. Natural humidity exchange remains a physical event without invented work."
    source_ids:
      - ravensburger-puzzle-manufacture-2025
      - clementoni-puzzle-faq
  - rule_id: v_separate
    applies_to: "all inventories"
    rule: "Keep scientific review, translation review, dataset verification and product identity claims distinct. Usable site data requires all applicable gates and truthful gaps; source documentation alone establishes none of those approvals."
    source_ids:
      - ilcd-detailed-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "A completed cohort-specific attributable cradle-to-gate puzzle-production dataset with separately linked observed original-cohort services and full physical ledgers."
  allowed_use: "Only the declared flat printed solid-board complete puzzle construction/route and actual compatible providers; downstream studies separately define use/end-of-life and transport."
  excluded_use: "No automatic all-puzzle technology coverage; no equal service from kg, universal piece mass, lifetime, safety/age/certification claim, mapping decision or scientific approval."
  required_metadata: "All required qualifiers; actual cohort/Q/Qc/H; source/receiver/provider coverage; complete raw and inherited vectors; route/test/packaging/species records; uncertainty."
  required_quality_disclosure: "Applicability, real unresolved identities and values, failed/zero-output histories, excluded future services, allocation reasoning, physical closure and unit-result completeness."
  update_trigger: "Changed complete-set construction, route, formulation, supplier boundary, release gate, native restriction, observation H or actual waste/utility/species condition."
