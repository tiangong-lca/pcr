allocation_rules:
  - rule_id: a_context
    applies_to: "all burden vectors"
    rule: "Use attributional modelling only where partitioning is appropriate to the declared study decision context; do not claim consequential substitution. Industrial manufacturing evidence is not allocation guidance."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_subdivide
    applies_to: "all burden vectors"
    rule: "First identify dedicated operations, direct meters and exclusive materials. Subdivide or virtually subdivide every separable contribution, including print jobs, preparation, cleanup, failure and postrelease cohort services, before any residual allocation."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_causality
    applies_to: "shared residual burdens"
    rule: "For genuinely inseparable remaining exchange vectors test an exchange-specific determining physical causal relationship using actual conditions, measured drivers and sensitivity. Do not select mass, area, pieces or machine time merely because available."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_value
    applies_to: "remaining multifunctional common process"
    rule: "Only for the justified residual after the preceding hierarchy use actual contemporaneous market values for co-functions in their real common-process exit states, quantities, geography and period. Declare prices, currency, valuation boundary and conversions, complete value denominator and sensitivity; do not value a finished product against a different-state intermediate. No fixed shares or arbitrary physical/economic choice."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_waste
    applies_to: "waste and gross exchanges"
    rule: "No automatic co-product, sale credit, avoided production or burden subtraction for packaging reuse, manufacturing rejects, scrap or external waste dispatch. A true independent function/cohort and defensible allocation/handover are required for one burden transfer; actual waste/treatment remains owned once and all physical gross legs remain unchanged."
    source_ids:
      - ilcd-detailed-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_assets_assets
      process_id: "assets"
      flow_role: "assets parts fluids and service history"
      record_type: "collected_record"
      raw_fields: "whole asset and component IDs; new used received installed removed returned retired; full wet stocks; each fluid phase; service intervals; jobs served; unused unassigned charge; provider; no assumed life; actual_whole_receiver_Qt_once; actual_full_provider_quantity_once; nested_component_bridge; actual_physical_cohort_provenance; evidenced_service_vectors; provider_unit_basis; original_Q0_each_cohort; Qanalysis; actual_disjoint_retained_repair_water_increments; actual_disjoint_departures"
      collection_method: "Record full physical machinery/die/plate/part/repair/fluid stock and actual external receipts/returns/discards. Add separately named actual press, laminator, cutter, die-press, separator, bag-sealer and other physical assets if transacted during the horizon; no invented asset purchase when already installed. Whole/component supply coverage is disjoint or bridged/reconciled and internal installation/removal cancels. Attribute only the actual observed service burden through the hierarchy, retain unused charge; no fixed lifetime, wear fraction or one whole machine per kg. Actual whole contaminated waste is one full receiver transfer with nested substrate/residue/water; treatment service vectors are evidenced separately for served original cohorts and compatible provider units. P/I/ER are distinct inward; S actual filled dispatch and EO empty outward are distinct. Use the complete wet bridge with actual disjoint repair/water increments and departures."
      unit: "kg; h"
      frequency: "Each actual lot/event plus matched meter interval"
      temporal_coverage: "Complete production interval including failures; original-cohort service H explicitly separate"
      site_scope: "One declared site/configuration and matched upstream/receiver gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original receipts/logs; independent assays; acceptance; uncertainty and gaps"
    - protocol_id: cp_energy_cut
      process_id: "cut"
      flow_role: "actual electricity heat and fuel"
      record_type: "collected_record"
      raw_fields: "meter interval; process; cohort; startup idle failure cleanup; voltage; supply region year; kWh; MJ; fuel reference T/P and composition; genuine rate or integrated volume; thermal carrier kg phase T/P enthalpy; provider coverage"
      collection_method: "Collect original meter readings and units before normalization; integrate only actual rates, never multiply an already integrated volume by time. Convert kWh to MJ once before attribution. Separate jobs/operations using direct meters then the declared hierarchy. Actual purchased heat and carrier legs must share one documented provider convention; in-house compressor/boiler work is measured only when real, never duplicated through both whole service and ingredients. Keep energy balance and actual losses with uncertainty."
