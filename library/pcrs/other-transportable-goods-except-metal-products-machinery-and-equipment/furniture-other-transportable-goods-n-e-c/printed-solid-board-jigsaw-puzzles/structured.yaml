product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.furniture-other-transportable-goods-n-e-c.printed-solid-board-jigsaw-puzzles"
  classification_refs: "CPC 3.0 38550; narrower product and route boundary"
  covered_products: "Complete non-electronic flat printed-paper/solid-cellulosic-board jigsaw puzzle sets manufactured through the stated route. One semantic whole-puzzle record; actual piece complements and constructions must be declared."
  excluded_products: "Loose puzzle parts as final reference; printed board sheets alone; adhesives; packaging; wooden laser-cut puzzles; moulded plastic or 3D puzzles; mechanical/electronic logic toys; books and construction sets. Evidence for this route does not establish methods for every puzzle kind."
  representative_product: "One actual complete flat paper-mounted cardboard jigsaw set with measured net mass and verified complete piece complement; no nominal piece count is a mass conversion."
  production_route: "Actual prepared paper/board and formulations → offset printing and protective finishing/drying → paper-to-board mounting and actual drying/conditioning → format cutting → steel-rule die cutting → separation and actual pre-release bagging/required retail packing plus count/integrity/final packed-line acceptance → complete-set first release → actual later packing changes/storage/handling/dispatch. Purchased finished intermediates replace their upstream operations once and retain complete providers."
  market_state: "New complete first-quality-released sets at actual net moisture; inner bags and boxes remain separately inventoried packaging. No fixed lifetime or service equivalence is inferred from kg."
functional_unit:
  what: "Manufacture a complete flat interlocking image puzzle set for its declared assembling activity"
  how_much: "1 kg of net newly first-quality-released complete sets"
  how_well: "Actual specification for image/registration and finish; interlocking cut and clean edges; complete piece complement; physical integrity and applicable purchaser/manufacturer acceptance. State actual tests and results; no universal thresholds or certification claims."
  how_long_or_cycle: "One defined production cohort through first quality release. Observed later services belong to the original cohort and actual horizon H; unknown future activities remain unknown. No player lifetime is prescribed."
  reference_flow_link: "finished_puzzles"
system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "all processes"
      rule: "Include receipt, prepress where performed, printing, actual varnish setting/drying, mounting/drying, format cutting, die making/service, die cutting, separation/counting, complete-set release, cleanup/rework, packaging and observed service. Outsourcing changes ownership, not coverage of the product route."
      source_ids:
        - ravensburger-puzzle-manufacture-2025
    - rule_id: b_first_release
      applies_to: "finished_puzzles"
      rule: "Define Q as newly first-quality-released complete net sets once, including actual retained constituents and H2O. Exclude packaging and samples destroyed before first acceptance; already accepted later destroyed samples remain in original Q with actual loss/disposition. Already released closing FG is included in Q; never add it as another output or deduct its manufacturing burden as Bclose. Later delivery, reinspection or natural moisture change creates no Q."
      source_ids:
        - ravensburger-puzzle-manufacture-2025
        - clementoni-puzzle-faq
    - rule_id: b_raw_wip
      applies_to: "all inventory rows"
      rule: "Keep opening/closing raw stock, every WIP physical state, and unused/unassigned non-WIP stores with per-exchange inherited vectors. Attributable manufacturing burden includes brought-forward vectors and actual use/work; carry forward only unassigned raw/WIP/store vectors. Ordinary manufacturing rejects, waste, samples, offsite transfer or scrap sales do not qualify as other-function transfers. Only a real distinct cohort/function plus justified allocation/handover permits one vector transfer. Never subtract consumption twice after stock correction."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: b_zero
      applies_to: "all processes"
      rule: "Retain startup, shutdown, idle, cleaning, sampling, failed zero-output lots, rework and actual treatment. Q=0 retains raw physical and burden ledgers; no unit result or invented zero intensity."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: b_supply
      applies_to: "all product inputs"
      rule: "Procure a whole supplied preparation/article once. Assay constituents and carrier water are nonadditive children; actual onsite mixing instead lists each purchased material and real mixing energy/loss. External mounted board replaces overlapping upstream paper/board/ink/glue/varnish charges for that quantity; internal handoffs cancel without another purchase or Q."
      source_ids:
        - ravensburger-puzzle-manufacture-2025
    - rule_id: b_physical
      applies_to: "all physical legs"
      rule: "Every physical leg retains actual gross quantity V in its native extensive unit. Do not scale it by an economic, burden, service, inventory-change or allocation share. The matching burden vector is owned/attributed independently once. One physical mixed Waste outlet remains one atomic Waste exchange with independently measured nonadditive origin subaccounts."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: b_pack
      applies_to: "pack"
      rule: "Each actual packaging article has separate conditional P/I/ER/S/EO/W cards and a full wet stock balance: opening empty plus WIP-attached plus FG-attached plus reusable stocks + new external P + supplier-included I + external-return-received ER + actual disjoint retained/repair/water increments = closing same stocks + gross filled shipped S + outward empty return EO + whole discarded W + actual disjoint departures. Natural/repair water and added repair matter cross the same gate explicitly. Internal reuse cancels; exclude packages from Q. P/I do not overlap. One gross leg is disclosed once; upstream owner once."
      source_ids:
        - ravensburger-puzzle-manufacture-2025
        - ilcd-detailed-2010
    - rule_id: b_x
      applies_to: "pack; assets; service"
      rule: "Material/water X_in and X_out remove duplicates only from other actual same-side incoming/outgoing terms already containing that constituent. Never use X to cancel closing stock, the opposite side, or a real retained influx. New repair material/water and full wet closing stock coexist. Whole article plus components require disjoint coverage or a reconciled bridge with internal transfers cancelled."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: b_service
      applies_to: "service"
      rule: "Observe actual H for each original first-release cohort with original measured Qc. Retain all performed storage/handling/packing/shipping, natural sorption/desorption, returns and postrelease work. Do not deduct performed services because FG remains in closing stock; carry only unused/unassigned service/charge. Future work is unknown. Actual rework requires documented manufacturer/spec permission plus postwork tests/acceptance/disposition for continued qualification; unauthorized, failed or rejected work and its real logistics/loads are still retained with hold/waste state. Never assume damaged pieces recover. Natural humidity exchange is not invented repair."
      source_ids:
        - ravensburger-puzzle-manufacture-2025
        - clementoni-puzzle-faq
    - rule_id: b_water_species
      applies_to: "all processes"
      rule: "Keep full wet physical mass and independently measured H2O plus relevant elemental/actual-species balances. Separate free/carrier/sorbed/condensed/reaction water and actual chemical state; no default reaction or one residual solving two unknowns. COD/VOC/NOx/PM/total-element indicators are not molecule identities. Integrated volumes are not multiplied by duration again; actual rates are integrated over matching intervals, with substance-specific measured density/state for conversion."
      source_ids:
        - epa-printing-eiip-2002
        - ilcd-detailed-2010
    - rule_id: b_heat_assets
      applies_to: "assets; mount"
      rule: "Keep full physical machines/dies/plates/parts/fluids and new/used/returned/discarded stocks distinct from actual service burdens; no default lifetime or whole machine per kg. Actual heat-carrier Product returns retain gross kg, phase, T/P, enthalpy and supplier water-energy agreement. One thermal provider owns carrier/energy coverage once; never invent steam, condensate, boiler or recovery credit."
      source_ids:
        - ravensburger-puzzle-manufacture-2025
        - ilcd-detailed-2010
    - rule_id: system_boundary_rule_12
      applies_to: "foreground_system_boundary"
      rule: "This method covers the complete flat printed-paper/solid-board jigsaw manufacturing route, not merely packaging purchased finished puzzles. The whole product terminal is an accepted complete set; actual net pieces include retained ink, glue, finish and water once, while every packaging article is separate. The producer report supports this positive construction and route; the independent FAQ warns that nominal piece counts and listed dimensions can differ from actual sets. These are qualitative examples, not one common SKU/factory, recipes or rates. The original CPC category is broader than this supported route. Other puzzle technologies require their own evidence and method assessment within this record. [Sources: ravensburger-puzzle-manufacture-2025; clementoni-puzzle-faq; un-cpc-3-2025]"
      source_ids: []
    - rule_id: system_boundary_rule_13
      applies_to: "foreground_system_boundary"
      rule: "All qualifiers must be declared in the actual data package. A broad native finished-product family does not supply site measurements or replace complete-set acceptance."
      source_ids: []
    - rule_id: system_boundary_rule_14
      applies_to: "foreground_system_boundary"
      rule: "Every physical-card amount is a gross leg, not a provider-charge instruction. Raw physical V and environmental burden A are independent accounts. First-release production and later original-cohort services use the same complete-product identity but their own measured cohort denominator. Conditional absence requires actual evidence; unknown is not not_applicable. Additional real exchanges must be explicitly added rather than hidden."
      source_ids: []
    - rule_id: system_boundary_rule_15
      applies_to: "foreground_system_boundary"
      rule: "Collection is raw: protocols collect unnormalized original-unit quantities and independently measured stocks/assays. The aggregation_rule column declares the final result target only; it does not divide during collection. Convert original units, reconcile disjoint ownership, assign actual burden vectors, then execute one final quotient for each separate dimension. Cards and aggregation refer to that same quotient, never another division."
      source_ids: []
    - rule_id: system_boundary_rule_16
      applies_to: "foreground_system_boundary"
      rule: "The reference binds the complete manufactured Product family Puzzles / 智力玩具 at plant through its actual Mass reference. The complete accepted interlocking printed solid-board set is a positive narrower member; raw paper, solid board, printed mounted sheets, loose pieces and an incoming aggregate of component materials cannot serve as its terminal. The broad native comment includes puzzles of all kinds, but does not establish every construction or technology. Complete current native identity and versioned property/unit records do not provide a factory inventory, safety claim or qualified background producer. Sources: un-cpc-3-2025; ravensburger-puzzle-manufacture-2025."
      source_ids: []
    - rule_id: system_boundary_rule_17
      applies_to: "foreground_system_boundary"
      rule: "Ravensburger reports bagging immediately after die cutting, bag/cut checks and piece-count spot checks, then box manufacture and assembly, sealing labels and a final packed-line check before pallet storage. Preserve that sequence and actual release requirements. No intermediate cutting approval alone is whole-set first acceptance. Actual bagging/retail packing needed before final acceptance and every manufacturing failure remains in the manufacturing account even though removable package mass is excluded from net Q. Later genuine packing changes/storage/handling/dispatch are original-cohort service increments. The process called pack can cover actual pre-release and later events but must separate their timestamps, physical stocks and burden ownership; listing a process after release is not permission to relocate performed pre-release work. Sources: ravensburger-puzzle-manufacture-2025."
      source_ids: []
    - rule_id: system_boundary_rule_18
      applies_to: "foreground_system_boundary"
      rule: "Lock Q (original Q0) as the positive sum of unique complete-set first-acceptance net masses at one fixed actual gate and measured state. Preserve every original event mass/date and a nonoverlapping bridge of remaining net deliveries, all actual on-site accepted states including holds/accepted samples/repair WIP, irreversible material and water loss, and other terminal dispositions on the original acceptance basis. Already accepted later destroyed samples remain in Q0; never-accepted destroyed specimens are excluded. Returns/retests/rework and later moisture changes create no new Q. Do not restore lost water/material into surviving pieces and add the same loss again. Q0 is an event account rather than another external physical output; Q=0 or unknown basis keeps raw totals without a unit result."
      source_ids: []
    - rule_id: system_boundary_rule_19
      applies_to: "foreground_system_boundary"
      rule: "Keep three distinct ledgers for each actual shared outlet or asset: one full physical receiver transfer Qt and complete actual provider quantity recorded once; independently known component/physical-cohort provenance; and separately evidenced nonoverlapping environmental/treatment-service vectors attributed to each original served cohort in compatible provider units. Qt/Qanalysis is only physical disclosure using a declared positive observation basis. Linked model demand is actual attributable A/original Q0, never the full shared Qt recharged to every cohort and never physical Qt reduced by a service share. Original manufacturing/WIP/provider histories stay disjoint; provider aggregate inventories and their already included expanded components are alternative reconciled views, not additive loads. Unknown service shares remain unresolved."
      source_ids: []
    - rule_id: system_boundary_rule_20
      applies_to: "foreground_system_boundary"
      rule: "One actual contaminated bag, pail, can, cloth or filter discard is the full whole wet receiver stream including substrate, retained ink/glue/cleaner and water once. Dry substrate and retained contents are nested nonadditive subledgers. No attached material/water export or extra treatment demand is fabricated unless genuinely separated before the boundary with actual matched outlets. A measured independent dust/trim/ink/effluent outlet stays separate; mixed-only origins are children of one real mixed receiver stream. Actual full fleets/stocks/receiver/provider quantities remain unchanged by service attribution."
      source_ids: []
    - rule_id: system_boundary_rule_21
      applies_to: "foreground_system_boundary"
      rule: "For every actual packaging pool use O+P+I+ER+actual disjoint retained/repair/water increments=C+S+EO+whole W+actual disjoint departures in consistent units. P is separate external purchase, I supplier-included ingress, ER actual external returned article received from customer/reuse pool with its actual empty or filled state, S actual filled shipment outward including a real returned-contents shipment, EO actual empty outward to supplier/other recipient. Empty means without usable delivered contents, not assumed zero residue/water. All six legs are mutually exclusive actual events. A filled shipment is recorded once; net contents and packaging article are disjoint component accounts, not two copies of whole shipment. Whole contaminated W links to substrate balances by nested composition; new retained increments coexist with full wet closing stocks, X cancels only duplicate other same-side terms. Returns and reuse create no new Q or automatic credit."
      source_ids: []
    - rule_id: system_boundary_rule_22
      applies_to: "foreground_system_boundary"
      rule: "Synthetic accounting test only, not empirical data or a fraction/lifetime/default: one actual 10kg contaminated filter containing 8kg substrate and 2kg retained material serves two original cohorts. The receiver gets 10kg once. An independently evidenced hypothetical25%/75% compatible-unit treatment-service attribution gives 2.5/7.5kg-equivalent modeled vectors; original Qnew100kg/Qold200kg gives0.025/0.0375kg-equivalent per kg reference. Neither a2.5kg physical export nor full10kg provider demand again for both is valid. A separate packaging test O2+P3+I1+ER4+retained1=C3+S4+EO2+wholeW2=11kg uses Wsubstrate1+retained1 nested once. Actual article counts need independent records; these examples imply no kg/item conversion or actual installed filter."
      source_ids: []
    - rule_id: system_boundary_rule_23
      applies_to: "foreground_system_boundary"
      rule: "The bound electricity retains exact native Net calorific value / 净热值, 低位热值 and its MJ unit group. kWh times3.6 is only an electrical unit conversion, not fuel combustion or calorific-value evidence. Actual water, humidity, gases and thermal carriers preserve native extensive units, independent phase/state/density and matching producer interfaces. A bounded purchased utility or finished-intermediate supply retains every genuine upstream operation and loss; real on-site printing, prepress development/rinse, board mounting/drying, tool manufacture, combustion or treatment cannot be removed on paper. Missing actual complete provider or essential method remains a study hold, not solved by a Flow UUID or future SOP."
      source_ids: []
    - rule_id: system_boundary_rule_24
      applies_to: "foreground_system_boundary"
      rule: "Ravensburger is a real manufacturer example, not a universal SKU, recipe, water/solid fraction, drying technology, throughput or force default; its case count, dimensions, time, forestry and packaging-benefit claims are not transferred. Paper/plastic bag alternatives and adhesive labels versus exceptional shrink wrapping remain actual options, not all simultaneously mandatory. Clementoni supports independent whole-set replacement and nominal/actual-count/dimension counterevidence; its consumer-applied puzzle glue guidance is not factory mounting adhesive dosage or composition. Actual qualification uses actual whole-set specification and release records, not a nominal piece-count-to-mass conversion. Sources: ravensburger-puzzle-manufacture-2025; clementoni-puzzle-faq."
      source_ids: []
    - rule_id: system_boundary_rule_25
      applies_to: "foreground_system_boundary"
      rule: "EPA sheetfed offset uses a plate-to-blanket-to-sheet image transfer and describes fountain solution and a distinct waterless alternative. Sheetfed penetration/oxidative setting is not web heatset evaporation. Its historical material-balance formulas require actual pollutant content, retention and capture/control evidence; no100% release, retention factor or control efficiency is adopted here. Unchanged molecular species, reactive binders, total VOC/HAP indicators and identified emitted molecules are different accounts; one bulk VOC or carbon residual does not determine every molecular species. ILCD is attributional allocation-needed guidance, with subdivision/virtual subdivision then determining physical causality before residual actual common-gate values; it is not factory chemistry, QFD product-function equivalence or a recycling credit. Sources: epa-printing-eiip-2002; ilcd-detailed-2010."
      source_ids: []
    - rule_id: system_boundary_rule_26
      applies_to: "foreground_system_boundary"
      rule: "For each exchange-vector dimension use A_i=B_open_i+U_new_i-B_close_i-T_other_i. U_new_i is the actual new material/service/provider/work/treatment burden addition before stock-consumption correction, not a measured consumption already reduced for stocks. Opening and closing B cover only raw/WIP or genuinely unused/unassigned stores/service charges; already first-accepted FG is never a manufacturing carry deduction. If collection already gives stock-corrected consumption, use that reconciled equivalent account and do not subtract the same closing inventory again or add the same opening history twice. T_other requires an actually distinct cohort/function and evidenced once-only handover; ordinary waste/sample sales do not qualify. Preserve physical quantities independently and never add a provider aggregate to its already included decomposed history. Sources: ilcd-detailed-2010."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Prepared unprinted paper and solid puzzle board with actual formulations at receiving; actual plate/die supplies. Linked upstream papermaking/board manufacture/embossing/chemical production and actual prepress remain required; externally completed printed-mounted sheets are a disclosed alternative handoff."
  starting_condition_role: "Material/unfinished-intermediate handoff; not purchase of complete finished puzzles for mere repacking"
  product_classification_scope: "Printed solid-board flat jigsaw route inside CPC 3.0:38550; original classification includes puzzles of all kinds"
  recursive_input_rule: "Internal paper/board/part transfers are matched and cancelled in the consolidated foreground; supplied unfinished intermediates carry complete upstream burdens once. Previously finished/returned sets keep original production history and do not generate a recursive purchase or new Q."
  upstream_dataset_requirement: "Actual amount-compatible raw paper/board/embossing, plate imaging/development/rinsing where performed, each formulation, die/part/asset service, packaging, utilities, transport and waste treatment. Supplied whole articles/formulations and constituent bridges must be disjoint or reconciled, never additive overlapping providers."
  disclosure: "Actual make/buy stages and complete receiving/terminal gates; production cohort and service H; Q/wet-mass/stock conventions; every provider basis and native limitation; foreground/backdrop transport/treatment ownership; unresolved identity/measurement/route limits."
