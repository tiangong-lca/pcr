        - bic-cristal-construction-2025
    - rule_id: boundary_events
      applies_to: "make_pen; post_release"
      rule: "Include all actual raw inputs, failed and zero-output runs, rejected tests, startup/shutdown, idle, cleanup and incremental rework loads. Keep opening/closing raw, WIP and non-WIP/FG physical quantities and every inherited exchange vector by cohort. Inventory flows actually present but absent from a card list must be added atomically before completeness, not hidden in zero or an other-input bundle."
