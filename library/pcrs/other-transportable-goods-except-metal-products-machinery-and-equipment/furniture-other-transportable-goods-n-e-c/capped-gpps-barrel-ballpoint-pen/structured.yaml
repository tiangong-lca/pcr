  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Actual same-configuration whole article and every supply-form facet must agree with native limits and provider. Auxiliary unresolved UUIDs remain concrete and disclosed; broad identity is not a factory inventory."
      evidence: "Complete native read and exact property/unit chain; supplier/BOM/formulation/state records"
    - id: dq_measurement
      applies_to: "all inventory rows"
      requirement: "Retain calibration, actual uncertainty, raw units and one conversion; independent density and M where needed; no default recipe, mass, yield, service claim, emission factor or guessed zero."
      evidence: "Calibration, count/net-mass sampling, density/species analyses and unit audit"
    - id: dq_complete_events
      applies_to: "make_pen; post_release"
      requirement: "Retain all failed/Q0/start/stop/idle/cleanup/tests/rework events, actual observation window and each original-cohort vector; future unobserved service remains unknown."
      evidence: "Full event ledger, period meters, WIP/FG history and original Qc links"
    - id: dq_physical
      applies_to: "all inventory rows"
      requirement: "Independent manufacture/FG/consolidated wet-mass and element gates and individual packaging pools must retain gross movements, actual returns and Waste status. Mixed origin subaccounts do not add to W; no two-unknown residual fitting."
      evidence: "Gate/pool closure, receiver receipts, independent species/free/phase-water evidence"
    - id: dq_sources
      applies_to: "all inventory rows"
      requirement: "Sources support only their actual qualitative construction, unit operation or attributional method scope. Keep originals, contextual alternatives and dates; distinguish technical synthesis from a same-factory/order claim."
      evidence: "Original pages and source-specific applicability; scientific and translation review records remain separate"
    - id: dq_method
      applies_to: "actual necessary species/phase/matrix"
      requirement: "The supplied GPPS is physically melted and moulded; this route does not prescribe polymer synthesis, an on-site tip metallurgy unit or ink formulation. Any actual chemical change nevertheless requires independently established formation G_i and consumption C_i for its species; total wet mass and elements do not create a net chemical mass source. No resin monomer content, total VOC, COD, odour or balance residual identifies a released molecule. Use the complete EPA320 heated extractive FTIR programme only for actual identified IR-active vapor species with compatible reference spectra, actual interferants, background/temperature/pressure basis, representative transport, analyte-spike recovery and uncertainty checks. It does not measure homonuclear N2/O2 or monatomic Ar, particulate, liquid/mist or totalVOC chemistry. Actual collected condensate or cleaning liquid is one whole physical receiver transfer, separate from any actual final released species/phase. The actual full50-page dated Method320 PDF includes its FTIR Protocol and appendices; no referenced-only/missing-Protocol claim is made. Its PDF16 Eq3/4 use a tracer mixture fraction but the same-page DF>=10 legend is inconsistent: retain source bytes and use common corrected mole-basis phi=(tracer_spiked-tracer_native)/(tracer_direct-tracer_native), denominator nonzero, actual representative matched no-unaccounted-loss mixing, and expected analyte=phi*analyte_direct+(1-phi)*analyte_native. Phi is distinct from the reciprocal dilution ratio; this physical identity is no numerical setting or acceptance tolerance. Actual duct flow needs source-compatible complete geometry/traverse and calibrated velocity/state/density procedures; Methods1–3 originals are retained with their non-cyclonic/size/location, restricted gas-matrix/interference and argon-omission limits. Their unabsorbed N2/CO remainder is not pure N2 or measured Ar. A duct result is not automatically a whole fugitive-source inventory. The retained Method18 excludes compounds that can polymerize before analysis, so its title is not proof of styrene sample stability or a substitute for a demonstrated applicable programme. Neither this source set nor a future SOP establishes every unidentified ink/cleaner molecule, hot wet mist, sorption/phase transfer or reactive matrix. A genuinely necessary unestablished specific programme remains hold; ordinary actual lot/site calibration and recovery within an established applicable programme remain study qualification, not proof no method exists. No actual release or successful QA is presumed. These dated EPA copies and this technical synthesis are not a claim of regulatory conformity, scientific acceptance or complete actual-factory inventory."
      evidence: "Actual complete applicable procedure versus ordinary unperformed study QA; preserve necessary specific unresolved method holds"
validation_rules:
  - rule_id: validate_whole
    applies_to: "released_pen"
    rule: "Verify whole usable capped pen construction, actual manufacturing rather than purchased-finished packing, complete assembly and test/release evidence, and the positive native Product family/Mass/kg chain. A core whole-product or terminal-method evidence gap blocks a complete dataset; ordinary auxiliary UUID/provider gaps remain specific and disclosed rather than changing the reference to a part."
    source_ids:
      - bic-cristal-construction-2025
      - bic-integrated-manufacture-history
      - toptip-inj34-refill-assembly
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Check every adopted native basename, synonym, comment, CAS, grade, route/form, geography, medium/type and every property against the actual exchange. Recheck the selected property’s exact reference-unit-group and reference unit. Preserve all disclosed native limits in the row description and consumed context; supplier/grade unknowns do not authorize contradictory bindings. No latest-version inference, secondary coefficient density inference or Product-as-Waste is permitted."
    source_ids: []
  - rule_id: validate_quantity
    applies_to: "all inventory rows"
    rule: "Verify unique positive current Q or original Qc, raw unit conversion before attribution, every inherited exchange vector, one report_once normalization, explicit Q0 retention, and agreement between reference/card/protocol/calculation. Do not use catalogue item weight, default recipe, duration, density, yield, performance or certification. Unresolved quantities or unsupported relationships remain unknown and require review, not a claimed pass."
    source_ids: []
  - rule_id: validate_physical
    applies_to: "make_pen; post_release"
    rule: "Reconcile independent manufacturing, FG and consolidated gross physical gates and every packaging pool, with internal handovers cancelled only once. All actual events including refusal/failure and all actual species/water states and destinations remain. Check full wet mass and relevant elements independently of species evidence. Mixed W and its originW are not additive; actual unknowns cannot be solved by fitting one residual twice."
    source_ids: []
  - rule_id: validate_sources
    applies_to: "all inventory rows"
    rule: "Keep whole original manufacturer and methodology context, neighboring alternatives and source-specific applicability. Neither an industrial process description nor a verified fragment establishes LCA allocation, a specific factory inventory, accepted classification mapping, scientific approval or translation review. Add each actual missing atomic flow and its evidence before declaring dataset completeness."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "This method covers one evidence-bounded subset within the existing writing-implements category: manufacture of complete, capped, non-electronic ballpoint pens with a clear polystyrene barrel, empty polypropylene reservoir tube, finished brass tip carrying an already seated tungsten-carbide ball, supplied cap/end plug and whole purchased writing ink. It begins with the actual resin and prepared component/formulation supply forms, includes on-site barrel moulding, real refill filling/tip insertion, mechanical assembly and actual writing/function inspection, and ends at the unique first quality release of the complete usable pen. Buying a finished pen and only packaging it does not meet this manufacturing boundary."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "The construction evidence is the manufacturer complete-pen drawing, not a refill or ink picture. Industrial moulding history and an equipment maker’s filling sequence are transparent unit-operation synthesis; they are not an assertion that the same contemporary BIC site, order, machine or SKU operates this purchased-input route. The whole ink, cap and plug compositions remain actual supplier declarations. No published pen weight, dimension, ball diameter, ink dose, writing distance, lifetime, formulation, density, yield, temperature, time, energy or certification becomes a default. Sources: bic-cristal-construction-2025; bic-integrated-manufacture-history; toptip-inj34-refill-assembly."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "The parent category also names pencils, holders, crayons, leads, pastels, charcoal, chalk and parts. Those titles do not prove compatible manufacture. This method excludes fountain pens, gel/rollerball products without demonstrated compatible construction, retractable/spring mechanisms, electronic instruments, wood-pencil or chalk manufacture, loose components/refills/ink as reference outputs and independent pen boxes. Stainless-tip/steel-ball and on-site tip metallurgy, tube extrusion or ink formulation need separately supported disjoint process boundaries before this method can be extended; do not mix their BOM into this capped representative. Classification context is un-cpc3-structure-2025."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "The common reference is the complete native assembled Product family in Mass/kg. New unique first quality-release net Q includes integral ink/components once and excludes outer packaging; previously released closing FG already belongs to Q. All rules retain gross physical V separately from attributable service A, every inherited exchange vector, original Qc for actual earlier-cohort services, and unknown future services."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Declare every qualifier in dataset metadata, process notes, reference comments or equivalent consumed fields. The reference family is broader than this method; all native limits and complete-pen applicability are also retained in release, return and dispatch row descriptions, not only here."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "The following inventory is atomic. Conditional rows are recorded only when actually present; not_applicable requires evidence of actual absence and unknown is not zero. Add each real additional single substance, packaging component, waste or gas separately. Internally made barrels, filled refills and other handovers are not new purchases and cancel at the consolidated physical gate. Keep every physical stock and inherited exchange vector separately. Card amounts and protocol aggregation_rule reference the same report_once result, never sequential divisions."
    source_ids: []
  - rule_id: validation_rule_12
    applies_to: "foreground_dataset_conformance"
    rule: "All protocols collect undivided raw quantities; aggregation_rule states the reporting basis of the same final result and performs no division. D_r is positive current Q or original Qc of the correct cohort; cards, calculation and reporting use the same report_once result. Physical V, burden A and every inherited exchange vector remain distinct."
    source_ids: []
  - rule_id: validation_rule_13
    applies_to: "foreground_dataset_conformance"
    rule: "Q is actual new unique complete-pen first-release net kg. Include integral ink and all supplied pen components once; exclude all external packaging. Count is auxiliary, not the native reference. Closing released FG is already in Q."
    source_ids: []
  - rule_id: validation_rule_14
    applies_to: "foreground_dataset_conformance"
    rule: "If count records are used, M is measured complete net pen mass in kg/item for the same configuration and lot, obtained using cp_release calibrated net weighing and a documented count/sample scope. Convert actual counts using measured M before Q aggregation; never use the printed catalogue weight, ball diameter, ink fill or a secondary native coefficient to infer M or density. Raw material and service collection remains in original units."
    source_ids: []
  - rule_id: validation_rule_15
    applies_to: "foreground_dataset_conformance"
    rule: "Whole purchased ink/formulation or article is procured once. Assay, carrier water and contained metal/polymer masses are nonadditive subaccounts. Actual separate on-site purchases need disjoint atomic cards and a reconciled bridge; changing to on-site chemical preparation needs source-supported route review."
    source_ids: []
  - rule_id: validation_rule_16
    applies_to: "foreground_dataset_conformance"
    rule: "Convert raw units before causal attribution and one normalization. Use 1 kWh = 3.6 MJ for electricity; its property and unit group must be energy. Already integrated gas/liquid volume is not multiplied by time; a true rate is integrated. Volume-to-mass requires independently measured density of that substance and state; no universal water density or molecular amount is inferred."
    source_ids: []
