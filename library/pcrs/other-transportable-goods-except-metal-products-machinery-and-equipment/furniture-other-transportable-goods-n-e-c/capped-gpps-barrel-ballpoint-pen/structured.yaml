      record_type: "gross_packaging_pool_ledger"
      raw_fields: "component identity; supplied form; count and measured kg; opening empty/attached-WIP/FG/reusable; new purchase P; internal R_internal; external return received ER; closing each pool; gross attached S; external returned EO; actual W; original cohort/Qc; inherited vectors; actual service window; actual_P_I_sup_ERin_Sgross_EOout_Wwhole; actual_disjoint_J_in_J_out_H2O_in_H2O_out; same_side_X_overlap; original_Q0_Qc; whole_Qt_receiver; compatible_service_A"
      collection_method: "For each actual whole wet corrugated-carton or PE-film pool use O_empty+O_attachedWIP+O_attachedFG+O_reusable+P+I_sup+ERin+J_in+H2O_in-X_in=C_empty+C_attachedWIP+C_attachedFG+C_reusable+S_gross+EOout+W_whole+J_out+H2O_out-X_out. I_sup is actual disjoint supplier-included packaging, not another purchase; internal reuse R_internal cancels between matched positions and is not I_sup. J is additional real non-water material and H2O is additional actual water transfer only to the extent not already included in another whole wet leg. O/C and every whole leg retain all contained matter: actual new material/water retained in C never erases its true influx. X subtracts only independently proved overlap with OTHER same-side flow terms, never C, real increments, opposite directions or card existence. Trace actual J/water sources/destinations with specific physical records and internal pairs; do not invent a generic provider, extra Q, separate constituent waste or balancing flow. Gross shipments, external returns received/sent and true whole waste stay physically full regardless of environmental use shares. These two specific article pools are conditional on actual configuration; these are actual conditional packaging choices, not a universal material, tare, repair, water uptake or mass."
      unit: "kg; count; event"
      frequency: "Each component movement and stock close"
      temporal_coverage: "Full actual packaging window and reusable/attached history"
      site_scope: "Only this individual component and original-cohort Qc"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Component weights; supplier form; P/I_sup/ERin/S_gross/EOout/W_whole/J/H2O/X closure; contamination; actual receiver and cohort links"
