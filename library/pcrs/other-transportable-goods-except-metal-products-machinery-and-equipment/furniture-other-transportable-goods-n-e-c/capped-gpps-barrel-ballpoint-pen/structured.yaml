    - protocol_id: cp_outlets
      process_id: "make_pen"
      flow_role: "Every actual waste outlet"
      record_type: "weighing_receiver_and_species_records"
      raw_fields: "row_id; event; gross wet kg V/W; waste type; segregated/mixed state; independently measured originW; actual receiver/provider; moisture/species/element analyses; rework; inherited vectors; uncertainty; actual_original_Q0_Qc; full_disjoint_postgate_fates; actual_T_accept; whole_Qt; compatible_service_A; essential_procedure_status"
      collection_method: "Owner: waste/environment lead. Weigh each actual gross outlet and retain one receiver/treatment boundary. Distinguish Waste from Product; independently measure originW, moisture and relevant species/elements rather than fit two unknowns to one residual. One physical mixed outlet has one full W and nonadditive origin subaccounts, not extra constituent dispatches. Retain failed and zero-output events and actual cleanup/rework. Collect raw only, no N/D. One actual contaminated film, carton, cloth, machine, filter, rejected pen part or liquid consignment has one whole receiver event Qt containing substrate/article, retained ink/cleaner/polymer matter and water once. Dry tare and measured originW/components are nonadditive nested analyses, not extra exported wastes unless physically separated before the boundary. Match its actual receiver/treatment/provider and extensive unit. Physical Qt and Qt/Q disclosure are not automatically the service demand: use only evidenced compatible nonoverlapping service A with the original cohort Qc/Q0, keeping physical transfer full. Unknown attribution remains unknown. Arithmetic illustration only: a shared10kg consignment is never shrunk to2.5kg by25% attribution and never charged as10kg again to every cohort. Different dry/wet or provider units require the actual full-composition/state bridge, not a hidden conversion or pure-component proxy."
      unit: "kg"
      frequency: "Every outlet event and period close"
      temporal_coverage: "Full actual period and origin history"
      site_scope: "Actual declared process and receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighbridge/scales; laboratory methods; receiver receipts; separate physical/species balances"
    - protocol_id: cp_air
      process_id: "make_pen"
      flow_role: "Actual identified air species"
      record_type: "species_monitoring"
      raw_fields: "actual molecule/CAS; phase; medium/compartment; stack/fugitive source; measured concentration; integrated volume or actual rate/time; density and gas state; inlet/outlet/control capture; retained material; failures/cleanup; actual uncertainty; actual_original_Q0_Qc; full_disjoint_postgate_fates; actual_T_accept; whole_Qt; compatible_service_A; essential_procedure_status"
      collection_method: "Owner: environmental monitoring lead. Identify actual species and compartment independently; add each real molecule and actual nitrogen/oxygen/argon/water or other gas inflow/outflow where relevant to the process balance. Integrate only rates, not integrated volumes; density must be independently established for that material/state. Keep free, phase, structural and evidenced reaction water distinct. COD/VOC/PM/NOx metrics and one residual never become a specific chemical mass. Unknown remains unknown; no emission factor is supplied. Raw collection does not divide by Q. The supplied GPPS is physically melted and moulded; this route does not prescribe polymer synthesis, an on-site tip metallurgy unit or ink formulation. Any actual chemical change nevertheless requires independently established formation G_i and consumption C_i for its species; total wet mass and elements do not create a net chemical mass source. No resin monomer content, total VOC, COD, odour or balance residual identifies a released molecule. Use the complete EPA320 heated extractive FTIR programme only for actual identified IR-active vapor species with compatible reference spectra, actual interferants, background/temperature/pressure basis, representative transport, analyte-spike recovery and uncertainty checks. It does not measure homonuclear N2/O2 or monatomic Ar, particulate, liquid/mist or totalVOC chemistry. Actual collected condensate or cleaning liquid is one whole physical receiver transfer, separate from any actual final released species/phase. The actual full50-page dated Method320 PDF includes its FTIR Protocol and appendices; no referenced-only/missing-Protocol claim is made. Its PDF16 Eq3/4 use a tracer mixture fraction but the same-page DF>=10 legend is inconsistent: retain source bytes and use common corrected mole-basis phi=(tracer_spiked-tracer_native)/(tracer_direct-tracer_native), denominator nonzero, actual representative matched no-unaccounted-loss mixing, and expected analyte=phi*analyte_direct+(1-phi)*analyte_native. Phi is distinct from the reciprocal dilution ratio; this physical identity is no numerical setting or acceptance tolerance. Actual duct flow needs source-compatible complete geometry/traverse and calibrated velocity/state/density procedures; Methods1–3 originals are retained with their non-cyclonic/size/location, restricted gas-matrix/interference and argon-omission limits. Their unabsorbed N2/CO remainder is not pure N2 or measured Ar. A duct result is not automatically a whole fugitive-source inventory. The retained Method18 excludes compounds that can polymerize before analysis, so its title is not proof of styrene sample stability or a substitute for a demonstrated applicable programme. Neither this source set nor a future SOP establishes every unidentified ink/cleaner molecule, hot wet mist, sorption/phase transfer or reactive matrix. A genuinely necessary unestablished specific programme remains hold; ordinary actual lot/site calibration and recovery within an established applicable programme remain study qualification, not proof no method exists. No actual release or successful QA is presumed. These dated EPA copies and this technical synthesis are not a claim of regulatory conformity, scientific acceptance or complete actual-factory inventory."
      unit: "kg; concentration; m3; time; temperature; pressure"
      frequency: "Actual monitoring interval and release event"
      temporal_coverage: "Full matched period including failure/start/cleanup"
      site_scope: "Actual air inlet/outlet and compartments"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Speciation method; monitoring calibration; gas state; independent water/element evidence"
