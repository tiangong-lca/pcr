        - toptip-inj34-refill-assembly
    - rule_id: boundary_release
      applies_to: "make_pen; post_release"
      rule: "Q is newly and uniquely first quality-released complete net kg, not dispatch and not a sample count. A lot held as closing released FG already contributes to Q and is not another manufacturing output. Maintain manufacturing and FG physical gates separately, pair actual T_accept physical handover with FG receipt, and cancel that internal transfer in consolidation. Reinspection, delivery, reshipment and repair cannot create new production."
