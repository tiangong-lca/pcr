    - rule_id: boundary_utilities
      applies_to: "make_pen; post_release"
      rule: "Include actual mould heating/cooling, dosing, assembly, testing, cleaning, printing when used, packaging, storage, handling and dispatch services during the observed window. Distinguish externally bought utilities from internally generated services; do not invent a boiler, steam or condensate return. Real external thermal-carrier returns retain gross kg, phase/T/P, enthalpy and supplier water/energy accounting. Add each actual fuel, refrigerant and carrier separately if used."
