      unit: "kg; time; event"
      frequency: "Every physical movement/service and period close"
      temporal_coverage: "Actual observed window and complete returned-lot history"
      site_scope: "Declared pen cohort and matching original Qc"
      aggregation_rule: "per 1 kg reference flow"
