  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert each raw measurement into its declared native row unit before attribution. kWh * 3.6 = MJ. Integrate a true measured rate over its actual duration once; integrated volume has no further time multiplier. For volume/count conversion require independent same-state density or measured same-configuration net mass M from cp_release. Preserve original and converted values and uncertainty; no inferred density, mass or emission factor."
      inputs:
        - raw_value
        - raw_unit
        - measured_state
        - independent_conversion
        - cp_release
      output: "converted_raw"
      source_ids: []
    - id: trace_cohort
      applies_to: "all inventory rows"
      rule: "Trace each exchange vector through real raw/WIP/FG/return/reuse history. Keep gross physical V intact. For utility/services derive attributable A only through exclusive assignment, subdivision, exchange-specific physical causality and genuinely remaining common-gate economic allocation. Retain opening/closing carry vectors separately and conserve them. A is never a replacement for physical V."
      inputs:
        - converted_raw
        - inherited_vectors
        - actual_driver
        - physical_V
        - cp_materials
        - cp_fg
      output: "N_r; cohort_id"
      source_ids:
        - ilcd-attributional-allocation-2010
    - id: select_denominator
      applies_to: "all inventory rows"
      rule: "Select D_r = Q for the newly first-released cohort or D_r = original Qc for actual services/physical movements of previously released stock. Keep complete net first-release kg and event uniqueness from cp_release. If D_r is nonpositive, retain actual loads and histories and do not emit a normalized unit result. Prior release, repair, dispatch and reacceptance cannot generate another Q."
      inputs:
        - cp_release
        - cp_fg
        - original_cohort_id
        - Q
        - Qc
      output: "D_r"
      source_ids: []
    - id: report_once
      applies_to: "all inventory rows"
      rule: "x_r = N_r / D_r. For each physical card N_r is full gross V_r; for a service/utility burden card N_r is the traced attributable A_r. D_r is the selected positive cohort release kg from select_denominator. Perform this division once after convert_raw and trace_cohort. Card amounts and protocol aggregation reference x_r without another division. Physical inventories and burden/stock-vector reconciliation are disclosed together."
      inputs:
        - N_r
        - D_r
        - convert_raw
        - trace_cohort
        - select_denominator
      output: "x_r"
      source_ids: []
    - id: close_gates
      applies_to: "all inventory rows"
      rule: "For each actual physical gate retain O_raw+O_WIP+O_nonWIP+I_phys+ER_pre+U_air+H2O_in=C_raw+C_WIP+C_nonWIP+T_accept+W_man+E_man+EO_pre+T_other+H2O_out, and O_FG+T_accept+ER_FG+I_incremental+J_in+H2O_in=C_FG+S_gross+EO_FG+W_FG+E_FG+J_out+H2O_out. All terms are actual disjoint wet physical quantities; whole I_phys/I_incremental contains all actual added matter, not only retained C. Separate H2O/J terms exclude matter already in another whole leg. T_other names only actual atomic transfers. Sum gates and cancel one matched actual T_accept only; Q0 remains independent, never added again as an external product or fitted to closure. For each actual whole wet corrugated-carton or PE-film pool use O_empty+O_attachedWIP+O_attachedFG+O_reusable+P+I_sup+ERin+J_in+H2O_in-X_in=C_empty+C_attachedWIP+C_attachedFG+C_reusable+S_gross+EOout+W_whole+J_out+H2O_out-X_out. I_sup is actual disjoint supplier-included packaging, not another purchase; internal reuse R_internal cancels between matched positions and is not I_sup. J is additional real non-water material and H2O is additional actual water transfer only to the extent not already included in another whole wet leg. O/C and every whole leg retain all contained matter: actual new material/water retained in C never erases its true influx. X subtracts only independently proved overlap with OTHER same-side flow terms, never C, real increments, opposite directions or card existence. Trace actual J/water sources/destinations with specific physical records and internal pairs; do not invent a generic provider, extra Q, separate constituent waste or balancing flow. Gross shipments, external returns received/sent and true whole waste stay physically full regardless of environmental use shares. These two specific article pools are conditional on actual configuration; these are actual conditional packaging choices, not a universal material, tare, repair, water uptake or mass. T_accept is the actual physical transfer at the declared manufacture-to-FG-service gate; Q0 is the separately measured first-release reference-event denominator. Where the same configuration, state, event and window make them coincide, demonstrate that equality from independent records, never fit Q0 from physical closure. The finished reference row declares the unit and is not another external shipment. Manufacturing, FG-service and consolidated gates retain every real wet stock and gross exchange; consolidation cancels the one actual internal T_accept only, not external dispatch or real return. For an actually reacting species i, keep measured G_i formation and C_i consumption in its species equation; do not conserve reacting molecules by assumption or infer them from elemental closure. Chemical reactions create no net total-mass/element source; phase transfer is not chemical creation. Water additions/evaporation and all other terms must be mutually disjoint from water already included in whole supplied articles, carrier legs or releases. Unknown terms remain unresolved, not residual-fitted."
