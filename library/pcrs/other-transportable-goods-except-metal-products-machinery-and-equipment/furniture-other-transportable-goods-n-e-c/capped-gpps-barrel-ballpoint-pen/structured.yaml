allocation_rules:
  - rule_id: allocation_scope
    applies_to: "all inventory rows"
    rule: "Use attributional modelling only where its study decision context justifies allocation. First assign exclusive operations and flows, then attempt real or virtual subdivision. For the remaining shared exchange, establish its own determining physical causality and measured driver, respecting intensity and serial/parallel service differences; total pen mass is not a universal causal key."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: allocation_residual
    applies_to: "all inventory rows"
    rule: "Only genuinely remaining inventory after subdivision and exchange-specific physical causality may use economic allocation. Use concurrent actual market values at the same common process gate and supplied state/quality and amount; remove downstream packaging, transport and processing differences. Document derivation, sensitivity and remaining uncertainty. No arbitrary physical/economic choice, fixed ratio, assumed coproduct value, system expansion or automatic avoided-production credit is provided. The handbook multifunctional-device QFD example is not a ballpoint-pen allocation factor."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: allocation_vectors
    applies_to: "make_pen; post_release"
    rule: "Maintain a separate inherited vector for every exchange in raw, WIP and released FG stocks, returned articles and reusable packaging. Attribute current actual manufacture and failure loads plus the traced opening carry and less the correctly carried closing WIP to the release cohort without rewriting physical quantities. Already released closing FG does not remove manufactured Q or its production burden. Actually performed storage/handling/rework for earlier FG belongs to original Qc; keep original production history once and only real incremental service. Future unobserved activity is unknown."
    source_ids: []
  - rule_id: allocation_zero
    applies_to: "all inventory rows"
    rule: "Keep zero-Q and failed-period physical records and burden vectors intact. Do not divide, erase loads or create a unit result when the selected denominator is nonpositive. A later linked cohort can carry the burden only with an explicit history and no duplicate numerator. Actual rejected/unauthorized movements remain recorded; authorization changes eligibility, not physical existence."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "make_pen"
      flow_role: "Unique complete-pen release and WIP"
      record_type: "weighing_release_ledger"
      raw_fields: "configuration; BOM revision; lot; period; new unique release IDs; calibrated gross/tare/net kg; complete count; measured same-configuration net mass M if count conversion is needed; sample/test withdrawals; opening/closing WIP; inherited vectors; failed runs; return/original-Qc links; actual_original_Q0_Qc; full_disjoint_postgate_fates; actual_T_accept; whole_Qt; compatible_service_A; essential_procedure_status"
      collection_method: "Owner: production and quality controllers. Weigh complete filled usable capped pens on calibrated scales, subtract only outer packaging/tare, and reconcile to actual assembly/writing/function acceptance and unique first-release IDs. Measure representative net mass M for the same configuration and lot only when using counts; retain sample selection and uncertainty. Keep all failed/rejected/zero-output events. Collect raw undivided quantities and every WIP vector; do not calculate N/D during collection. For the newly accepted cohort Q=Q0. Q0 is independently fixed from unique first quality-release events for complete same-configuration pens after every required factory operation and test, ready for the declared factory supply gate. It includes all actual retained articles and water at release and excludes outer packaging tare. Reconcile each original Q0 on its original-material/configuration basis across disjoint net remaining external deliveries, every actual on-site accepted FG/held/returned/rework state, irreversible losses and other terminal dispositions. Gross return first leaves its old delivery position. Dispatch, return, repacking, retest or reacceptance never creates new Q. Current surviving wet mass and original water/material losses cannot both be restored and counted again. Opening old cohorts and later observed-H services use original Qc/Q0, not current output; delivery plus closing FG is sufficient only when all other postgate states/exits are absent. Q=0 or unknown retains actual raw loads without a per-unit result."
      unit: "kg; count; kg/item"
      frequency: "Each release event and stock close"
      temporal_coverage: "Complete matched manufacture period and inherited WIP history"
      site_scope: "Declared pen configuration and first-release cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; paired assembly/test/release IDs; tare; BOM; WIP vector reconciliation"
    - protocol_id: cp_materials
      process_id: "make_pen"
      flow_role: "Every supplied physical material or module"
      record_type: "gross_receipt_and_issue_ledger"
      raw_fields: "row_id; supplier/formulation/grade; whole supply form; actual net kg V; lot; receipts and external returns; raw opening/closing; issue/return; internal handover; assay/carrier subaccounts; failures; inherited vectors; actual_original_Q0_Qc; full_disjoint_postgate_fates; actual_T_accept; whole_Qt; compatible_service_A; essential_procedure_status"
      collection_method: "Owner: materials accountant. Retain actual calibrated receipt/issue/return and stock records for every card, including failed/cleanup/rework batches. Separate gross physical V from service burden A and from stock-vector transfers; never multiply V by an allocation share or substitute stock difference for a real movement. Verify whole supplied ink and tips versus constituents and actual supplier compatibility. Additional actual materials require named cards. Collect raw only; no N/D. Keep complete physical raw/WIP/non-WIP/FG/return, packaging, installed-fluid and every actual equipment-fleet ledger separate from reference events and per-exchange burden vectors. Own opening WIP carries actual earlier foreground burdens once; only substantiated still-unused/unassigned closing WIP carries them forward. For attribution, A may add unassigned inherited opening burden to period raw burden and remove only demonstrated still-unassigned closing burden and a disjoint justified other-system/cohort handover. Already-net consumption is not stock-corrected a second time; accepted closing FG and services already performed for it are not deleted. A complete provider aggregate and its embedded material/transport/asset/history decomposition are mutually exclusive. Preserve failed attempts, idle/start-stop, inspection, samples, cleanout and repair loads. Actual complete upstreams match the whole supplied article/preparation and true availability point; no receipt or purchased-service label hides known on-site manufacture. Actual provider inclusion schedules cover current electricity, repair, transport and operating supplies as well as capital: an aggregate already including a metered foreground operation and that separate operation cannot both be charged."
      unit: "kg"
      frequency: "Every actual receipt issue and return"
      temporal_coverage: "Full observed period plus raw/WIP carry history"
      site_scope: "All actual included pen-manufacturing supplies"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Invoices; scales; actual supplier BOM/specification; formulation bridge; physical and burden-vector reconciliation"
    - protocol_id: cp_quality
      process_id: "make_pen"
      flow_role: "Tests and sample consumption"
      record_type: "quality_event_ledger"
      raw_fields: "event; pen lot; actual test basis; paper and transferred ink; destructive sample mass; result; release authorization; actual cleanup and energy; segregated/mixed waste destination"
      collection_method: "Owner: quality lead. Trace every real writing/function test and all consumed paper, ink, sampled pens and retests. Failed or unauthorized tests keep actual physical movements and loads; test acceptance authorizes eligible release only. Weigh segregated waste or record a nonadditive origin in the real mixed bin. No catalogue writing distance or universal test factor; collect raw only, no N/D."
      unit: "kg; event; result"
      frequency: "Each actual test and retest"
      temporal_coverage: "Full manufacturing cohort including failures"
      site_scope: "Actual release tests for this configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Test method; calibration; sample identity; ink/paper/waste reconciliation"
    - protocol_id: cp_utilities_make
      process_id: "make_pen"
      flow_role: "Manufacturing electricity and water"
      record_type: "meter_and_service_records"
      raw_fields: "row_id; meter start/end; kWh/MJ; water kg; volume or rate/time; actual voltage/geography/provider; service load/duration; external water return phase/T/P/enthalpy; failure/idle/cleanup; cohort; original Qc; inherited vectors"
      collection_method: "Owner: utility engineer. Retain undivided raw meters for all actual included operations. Convert kWh to MJ once; verify exact energy-property and energy-unit-group chain. Water mass needs direct weighing or independent same-state density, not an assumed native coefficient. Keep internal loops separate from external purchases and actual thermal-carrier returns; attribute services by exclusive/subdivision/causal hierarchy. Preserve actual loads for Q0 and earlier-cohort services. No N/D in collection and no guessed future activity."
      unit: "kWh; MJ; kg; m3; time; enthalpy"
      frequency: "Meter interval and actual service event"
      temporal_coverage: "Matched actual observation window and inherited vector history"
      site_scope: "Declared operations only; correct current Q or original Qc"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; voltage/provider; independent density; enthalpy; causal driver and stock links"
    - protocol_id: cp_utilities_post
      process_id: "post_release"
      flow_role: "Actual observed post-release services"
      record_type: "meter_and_service_records"
      raw_fields: "row_id; meter start/end; kWh/MJ; water kg; volume or rate/time; actual voltage/geography/provider; service load/duration; external water return phase/T/P/enthalpy; failure/idle/cleanup; cohort; original Qc; inherited vectors"
      collection_method: "Owner: utility engineer. Retain undivided raw meters for all actual included operations. Convert kWh to MJ once; verify exact energy-property and energy-unit-group chain. Water mass needs direct weighing or independent same-state density, not an assumed native coefficient. Keep internal loops separate from external purchases and actual thermal-carrier returns; attribute services by exclusive/subdivision/causal hierarchy. Preserve actual loads for Q0 and earlier-cohort services. No N/D in collection and no guessed future activity."
      unit: "kWh; MJ; kg; m3; time; enthalpy"
