    - rule_id: boundary_physical
      applies_to: "all inventory rows"
      rule: "Close each physical gate independently: opening stocks plus all gross physical inflows equals closing stocks plus all gross physical outflows, with measured releases/species and investigated discrepancy. At manufacturing, outputs distinguish actual T_accept of newly accepted pens from previously released returned pens made ready again; at FG, separate opening FG, new internal receipts, real returns, gross dispatch, rejection and closing FG. Consolidation cancels only paired internal transfers. Preserve full wet mass and relevant elements; one residual cannot determine two unknowns. No allocation or stock-burden adjustment rescales physical movements."
      source_ids: []
    - rule_id: boundary_packaging
      applies_to: "post_release"
      rule: "For each actual whole wet corrugated-carton or PE-film pool use O_empty+O_attachedWIP+O_attachedFG+O_reusable+P+I_sup+ERin+J_in+H2O_in-X_in=C_empty+C_attachedWIP+C_attachedFG+C_reusable+S_gross+EOout+W_whole+J_out+H2O_out-X_out. I_sup is actual disjoint supplier-included packaging, not another purchase; internal reuse R_internal cancels between matched positions and is not I_sup. J is additional real non-water material and H2O is additional actual water transfer only to the extent not already included in another whole wet leg. O/C and every whole leg retain all contained matter: actual new material/water retained in C never erases its true influx. X subtracts only independently proved overlap with OTHER same-side flow terms, never C, real increments, opposite directions or card existence. Trace actual J/water sources/destinations with specific physical records and internal pairs; do not invent a generic provider, extra Q, separate constituent waste or balancing flow. Gross shipments, external returns received/sent and true whole waste stay physically full regardless of environmental use shares. These two specific article pools are conditional on actual configuration; these are actual conditional packaging choices, not a universal material, tare, repair, water uptake or mass."
      source_ids: []
    - rule_id: full_cohort
      applies_to: "actual declared configuration"
      rule: "For the newly accepted cohort Q=Q0. Q0 is independently fixed from unique first quality-release events for complete same-configuration pens after every required factory operation and test, ready for the declared factory supply gate. It includes all actual retained articles and water at release and excludes outer packaging tare. Reconcile each original Q0 on its original-material/configuration basis across disjoint net remaining external deliveries, every actual on-site accepted FG/held/returned/rework state, irreversible losses and other terminal dispositions. Gross return first leaves its old delivery position. Dispatch, return, repacking, retest or reacceptance never creates new Q. Current surviving wet mass and original water/material losses cannot both be restored and counted again. Opening old cohorts and later observed-H services use original Qc/Q0, not current output; delivery plus closing FG is sufficient only when all other postgate states/exits are absent. Q=0 or unknown retains actual raw loads without a per-unit result."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: provider_history
      applies_to: "actual declared configuration"
      rule: "Keep complete physical raw/WIP/non-WIP/FG/return, packaging, installed-fluid and every actual equipment-fleet ledger separate from reference events and per-exchange burden vectors. Own opening WIP carries actual earlier foreground burdens once; only substantiated still-unused/unassigned closing WIP carries them forward. For attribution, A may add unassigned inherited opening burden to period raw burden and remove only demonstrated still-unassigned closing burden and a disjoint justified other-system/cohort handover. Already-net consumption is not stock-corrected a second time; accepted closing FG and services already performed for it are not deleted. A complete provider aggregate and its embedded material/transport/asset/history decomposition are mutually exclusive. Preserve failed attempts, idle/start-stop, inspection, samples, cleanout and repair loads. Actual complete upstreams match the whole supplied article/preparation and true availability point; no receipt or purchased-service label hides known on-site manufacture. Actual provider inclusion schedules cover current electricity, repair, transport and operating supplies as well as capital: an aggregate already including a metered foreground operation and that separate operation cannot both be charged."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: physical_transfer
      applies_to: "actual declared configuration"
      rule: "T_accept is the actual physical transfer at the declared manufacture-to-FG-service gate; Q0 is the separately measured first-release reference-event denominator. Where the same configuration, state, event and window make them coincide, demonstrate that equality from independent records, never fit Q0 from physical closure. The finished reference row declares the unit and is not another external shipment. Manufacturing, FG-service and consolidated gates retain every real wet stock and gross exchange; consolidation cancels the one actual internal T_accept only, not external dispatch or real return. For an actually reacting species i, keep measured G_i formation and C_i consumption in its species equation; do not conserve reacting molecules by assumption or infer them from elemental closure. Chemical reactions create no net total-mass/element source; phase transfer is not chemical creation. Water additions/evaporation and all other terms must be mutually disjoint from water already included in whole supplied articles, carrier legs or releases. Unknown terms remain unresolved, not residual-fitted."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: wet_pack
      applies_to: "actual declared configuration"
      rule: "For each actual whole wet corrugated-carton or PE-film pool use O_empty+O_attachedWIP+O_attachedFG+O_reusable+P+I_sup+ERin+J_in+H2O_in-X_in=C_empty+C_attachedWIP+C_attachedFG+C_reusable+S_gross+EOout+W_whole+J_out+H2O_out-X_out. I_sup is actual disjoint supplier-included packaging, not another purchase; internal reuse R_internal cancels between matched positions and is not I_sup. J is additional real non-water material and H2O is additional actual water transfer only to the extent not already included in another whole wet leg. O/C and every whole leg retain all contained matter: actual new material/water retained in C never erases its true influx. X subtracts only independently proved overlap with OTHER same-side flow terms, never C, real increments, opposite directions or card existence. Trace actual J/water sources/destinations with specific physical records and internal pairs; do not invent a generic provider, extra Q, separate constituent waste or balancing flow. Gross shipments, external returns received/sent and true whole waste stay physically full regardless of environmental use shares. These two specific article pools are conditional on actual configuration; these are actual conditional packaging choices, not a universal material, tare, repair, water uptake or mass."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: whole_waste_service
      applies_to: "actual declared configuration"
      rule: "One actual contaminated film, carton, cloth, machine, filter, rejected pen part or liquid consignment has one whole receiver event Qt containing substrate/article, retained ink/cleaner/polymer matter and water once. Dry tare and measured originW/components are nonadditive nested analyses, not extra exported wastes unless physically separated before the boundary. Match its actual receiver/treatment/provider and extensive unit. Physical Qt and Qt/Q disclosure are not automatically the service demand: use only evidenced compatible nonoverlapping service A with the original cohort Qc/Q0, keeping physical transfer full. Unknown attribution remains unknown. Arithmetic illustration only: a shared10kg consignment is never shrunk to2.5kg by25% attribution and never charged as10kg again to every cohort. Different dry/wet or provider units require the actual full-composition/state bridge, not a hidden conversion or pure-component proxy."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: actual_fleets
      applies_to: "actual declared configuration"
      rule: "Every actual injection-moulding machine, ink-filling/tip-insertion line, tool, extraction/handling unit and reusable cloth keeps a complete actual configured fleet: new/used receipts, external returns received/sent, real retirement/whole waste, installed/opening/closing holdings and disjoint repair/fluid changes. BIC industrial history and TopTip equipment show actual operations, not the same contemporary plant, installed machine or shared SKU. A whole line/provider already including a machine and a separate purchase of that machine cannot both be added. Measure actual complete configuration mass M if count/mass conversion is needed; Item(s) is not kg and no machine mass or lifetime is supplied. Actual service h must match a complete real provider history and observed original-cohort use, unused/unassigned capacity and inherited burdens; physical fleet kg is not scaled by a service share. Separately supplied oil/filter/belt and whole contaminated removed items need their own atomic interfaces when actually present; contained parts remain nested in a whole asset. Receipt/return/shipment/retirement cards disclose physical V only; they are not a second capital purchase when the actual compatible service history already owns the same upstream manufacture. Actual provider-service scope and separately metered operation/repair must be nonoverlapping. A cotton cloth has the same full gross receipt/return/whole-waste and opening/closing fleet record; actual laundering or replacement must carry all disjoint real provider and utility burdens. No cloth lifetime or laundering load is assumed."
      source_ids:
        - ilcd-attributional-allocation-2010
    - rule_id: actual_method
      applies_to: "actual declared configuration"
      rule: "The supplied GPPS is physically melted and moulded; this route does not prescribe polymer synthesis, an on-site tip metallurgy unit or ink formulation. Any actual chemical change nevertheless requires independently established formation G_i and consumption C_i for its species; total wet mass and elements do not create a net chemical mass source. No resin monomer content, total VOC, COD, odour or balance residual identifies a released molecule. Use the complete EPA320 heated extractive FTIR programme only for actual identified IR-active vapor species with compatible reference spectra, actual interferants, background/temperature/pressure basis, representative transport, analyte-spike recovery and uncertainty checks. It does not measure homonuclear N2/O2 or monatomic Ar, particulate, liquid/mist or totalVOC chemistry. Actual collected condensate or cleaning liquid is one whole physical receiver transfer, separate from any actual final released species/phase. The actual full50-page dated Method320 PDF includes its FTIR Protocol and appendices; no referenced-only/missing-Protocol claim is made. Its PDF16 Eq3/4 use a tracer mixture fraction but the same-page DF>=10 legend is inconsistent: retain source bytes and use common corrected mole-basis phi=(tracer_spiked-tracer_native)/(tracer_direct-tracer_native), denominator nonzero, actual representative matched no-unaccounted-loss mixing, and expected analyte=phi*analyte_direct+(1-phi)*analyte_native. Phi is distinct from the reciprocal dilution ratio; this physical identity is no numerical setting or acceptance tolerance. Actual duct flow needs source-compatible complete geometry/traverse and calibrated velocity/state/density procedures; Methods1–3 originals are retained with their non-cyclonic/size/location, restricted gas-matrix/interference and argon-omission limits. Their unabsorbed N2/CO remainder is not pure N2 or measured Ar. A duct result is not automatically a whole fugitive-source inventory. The retained Method18 excludes compounds that can polymerize before analysis, so its title is not proof of styrene sample stability or a substitute for a demonstrated applicable programme. Neither this source set nor a future SOP establishes every unidentified ink/cleaner molecule, hot wet mist, sorption/phase transfer or reactive matrix. A genuinely necessary unestablished specific programme remains hold; ordinary actual lot/site calibration and recovery within an established applicable programme remain study qualification, not proof no method exists. No actual release or successful QA is presumed. These dated EPA copies and this technical synthesis are not a claim of regulatory conformity, scientific acceptance or complete actual-factory inventory."
      source_ids:
