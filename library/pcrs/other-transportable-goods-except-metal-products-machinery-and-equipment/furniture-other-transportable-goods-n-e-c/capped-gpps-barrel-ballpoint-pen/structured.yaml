      rule: "Require on-site resin forming plus actual filling/assembly, not receipt and repacking of complete pens. A whole bought tip includes ball/metals and a whole bought ink includes its carriers/solutes. Either choose disjoint supplies or reconcile a documented component bridge with internal handovers cancelled; never add whole wet/article mass and the same contained component again."
