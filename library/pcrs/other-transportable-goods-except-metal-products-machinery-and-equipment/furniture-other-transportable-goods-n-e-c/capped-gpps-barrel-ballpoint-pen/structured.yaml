    rule: "Convert each raw measurement into its declared native row unit before attribution. kWh * 3.6 = MJ. Integrate a true measured rate over its actual duration once; integrated volume has no further time multiplier. For volume/count conversion require independent same-state density or measured same-configuration net mass M from cp_release. Preserve original and converted values and uncertainty; no inferred density, mass or emission factor."
