      markdown: "## 7. Allocation and Co-product Handling\n\nThis section applies only to the stated attributional allocation-needed situation; consume the rules with that situation and complete context.\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_scope | all allocation cases | This is attributional modelling only for a study situation in which allocation rather than substitution is required. Establish the study context first; industrial manufacturing publications do not establish LCA allocation. Do not claim automatic system expansion or PEF/CFF conformity. | `ilcd-2010` |\n| a_subdivide | shared operations | Avoid allocation by actual independent/dedicated data and physical or virtual subdivision. Assign exclusively used preparation, tool, operation and identifiable input exchanges directly; separate other product/cohort operations before allocating any residual. | `ilcd-2010` |\n| a_causality | each remaining exchange | Determine a real exchange-specific physical causal relationship to the co-functions; test actual load/time/cycle/enthalpy/throughput evidence as appropriate. One weight share or machine time does not automatically determine every flow. Keep causal bounds, reconciliation and uncertainty. | `ilcd-2010` |\n| a_residual | genuinely residual common process | Only flows genuinely remaining after those steps use market values of real co-functions in their actual state and at the common process gate, from a coherent contemporaneous period. Document quantities/prices, excluded directly assigned exchanges and sensitivity. No fixed shares, arbitrary physical/economic choice, waste-sale credit or allocation scaling of physical gross legs. | `ilcd-2010` |\n\n"
