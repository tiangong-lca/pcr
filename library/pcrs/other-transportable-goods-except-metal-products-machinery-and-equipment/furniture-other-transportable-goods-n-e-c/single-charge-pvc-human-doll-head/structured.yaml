      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_identity | reference and all adopted UUIDs | Require a complete manufactured head Product identity, native reference property/unit chain and every supplied-state/route/phase/material/type/media restriction. Keep official Chinese basenames when supplied; no version suffixes. A core identity gap prevents usable methodology; ordinary auxiliary/provider gaps remain explicit and cannot be silently substituted. | `ilcd-2010`; `piper-rotation` |\n| v_reference | finished; all qualifiers | One uniquely linked finished reference row and all ordered qualifiers must agree in both languages. Actual net first-release mass includes actual constituents and retained moisture once; no released-closing-FG deduction, second Q, order/sample/website weight or implied life/safety equivalence. | `ilcd-2010`; `piper-rotation` |\n| v_single | all inventory rows | Audit raw-to-native conversion and actual burden attribution before the single quotient. Gross numerator is full V without stock/economic correction; service retains Qc/H and performed burden. Manufacturing carries each unassigned vector only once; Q=0 keeps load and has no unit result. | `ilcd-2010`; `piper-rotation` |\n| v_mass | all physical gates; packaging; assets | Verify complete wet O/C with true added influx, every six-direction pool, internal-transfer cancellation, whole/component nonoverlap, actual chemical species/state/density and independent relevant element balances. No reaction-water or molecular emission invented from an indicator or closure residual. | `ilcd-2010`; `piper-rotation` |\n| v_waste | all Waste and actual postrelease work | One real mixed outlet/provider with independently measured nonadditive origins; real separate outlets only. Capture all failed/unauthorised performed work and actual hold/Waste disposition. Permission/tests/acceptance govern continued conformance rather than deletion of actual flows. | `ilcd-2010`; `piper-rotation` |\n| v_evidence | foreground package | Unknown quantities, auxiliary identities/providers or incompatible route remain disclosed; no invented zero or factor. Technical evidence and engineering checks establish no scientific/translation approval, classification acceptance or publication. | `ilcd-2010`; `piper-rotation` |\n| v_semivolatile_method | actual identified species and outlet matrices | EPA Method0010, Rev1 August2018 as printed in the retained original, supplies an isokinetic filter/condenser/polymeric-sorbent sampling train and separately recovered fractions for semivolatile POHC incineration DRE; its stationary-source filterable-PM use is separately bounded by Method5. That scope does not automatically qualify non-incineration PVC head forming, every volatile, condensable or wet aerosol. Method3542A, Rev1 May2005, replaces the train sample-preparation section: preserve filter, front-half rinse, condenser/back-half rinse, sorbent, condensate/rinse and silica-gel/moisture records, their actual grouped extracts and blank/subsample/recovery history without losing or double-adding a physical fraction. Method8270E, Rev6 June2018, supplies identified GC-amenable semivolatile analysis in prepared air-media/water/solid extracts, actual analyte calibration/confirmation and continuing QC; its analyte list does not identify this plastisol or an actual emission. Preserve compound-specific extraction, transport/retention and breakthrough/recovery, interferences, blank contamination, wet/dry sampled gas volume, sampling time and actual outlet/receiver basis before species-mass integration. Non-GC-amenable compounds require their actual suitable analytical method; an unspecific promise of HPLC or a future SOP is insufficient. Source method settings, concentrations, efficiencies, numerical QC limits and sample-fraction recipes are not PCR defaults. These documents establish a bounded analytical programme and contrary scope evidence; actual PVC-outlet/matrix applicability and any necessary unestablished species/phase sampling/analysis procedure remain explicit core holds. Routine actual-site QA within an established applicable procedure remains a separate uncompleted study obligation. A collected whole receiver mixture, source indicator and actual final chemical emission remain different quantities; do not invent mist, additives or emissions to populate the programme. | `epa-method0010`; `epa-method3542a`; `epa-method8270e` |\n| v_gas_method | actual N2 O2 Ar gas legs | For genuine gaseous N2/O2 legs, EPA Method3C supplies component GC-TCD analysis/calibration within its stated landfill/otherwise specified source scope, not automatic PVC-plant applicability or Ar measurement. Agilent5994-4552EN (18 January2022) demonstrates Ar/O2 baseline separation in a nitrogen-balance standard using Molesieve5Å micro-GC with helium carrier and moisture/CO2 backflush protection; its single-concentration repeatability/LOD evidence is not multipoint linearity, complete sampling/conditioning recovery or qualification of an actual hot/wet outlet. Column protection is not quantitative transport recovery. Retain each actual intake/final outlet, time/flow, wet/dry state, temperature/pressure, background and air ingress, component-specific calibration/response, separation and matrix/recovery evidence before integration to native kg. Homonuclear N2/O2 and monatomic Ar are not measured by ordinary IR-active gas FTIR. No fixed atmospheric composition, residual-fitted Ar, automatic subtraction of genuine carrier gases, source numerical settings or detection limits. Actual unidentified essential sampling/analytical/matrix procedures remain hold; routine site calibration within established procedures is a distinct study obligation, not a pass claimed here. | `epa-method3c`; `agilent-noble-gases-2022` |\n\n### Complete applicability and accounting context\n\nManufacture one actual specification of a new complete hollow PVC human-doll head component: receive whole supplied liquid plastisol, meter one charge, electrically heat a closed multi-axis rotating mould through gel/fusion, actually cool in the water tank, demould, actually trim and inspect the complete head to its unique first quality release as a separately supplied unpainted head without rooted hair. Include face features and any actual integral neck from the drawing; do not presume separate eyes, hair, print/coating, glue or connector hardware. Actual packaging, storage, handling, dispatch and later work keep a separate original-cohort service account. `piper-rotation`; `piper-plastisol`; `adrie-head`; `zhongyi-machine`\n\nThis is a transparent technical synthesis: supply evidence establishes the separately sold formed head; the processor describes closed-mould PVC parts; equipment evidence offers electric heating and water cooling. These are not one SKU, current order, factory or recipe. The patent includes single-layer context and a multilayer painted-head example with optional eyes/hair; it is not this configuration. Catalogue weight does not establish net head mass; equipment current/voltage and power/hourly-energy labels conflict, so no numerical parameter is adopted. No plasticizer identity/fraction, lead status, recycled content, resin grade, age, certification, dimensions/mass/density, temperature/cycle/hardness, life, emission factor or energy intensity is prescribed. `anderson-head-2007`; `adrie-head`; `zhongyi-machine`\n\nExclude whole dolls, nonhuman toys, resin/plasticizer/unformed mix, purchased-formed-head repacking, injection/blow/open-drain slush routes, multiple-charge/multilayer work, separate onsite compounding, gas/diesel heating, silicone/other polymers and terminals with separately fitted eyes/rooted hair/coating/connectors. Real departures require applicability assessment and a complete actual atomic inventory within this record; they never authorise deleting occurred facts. An unpainted head is a complete component supplied for later whole-doll manufacture, not an assembled doll; later customer painting/rooting cannot be retrospectively included in this configuration. Original UN p.192 includes heads/bodies/limbs and excludes separately supplied glass eyes; adjacent38520 concerns whole dolls and38540/38560 other toys. `un-cpc3-2025`; `adrie-head`; `anderson-head-2007`\n\nDeclare every qualifier in package metadata, process comments or equivalent fields. Reference and finished-card descriptions with complete ancestor context constrain applicability; a UUID or flat rule alone is insufficient. Mass is a production declared unit, not equivalence of whole dolls, decoration, durability/safety or service life.\n\nOne complete manufactured hollow PVC head component representing a human being, with its declared integral face/neck geometry. The card role determines first release or the actual later physical event; the native family alone confers no current acceptance status. The native Product family is manufactured finished parts at plant and expressly includes heads; it also includes bodies/limbs, nonglass eyes/mechanisms, wigs and doll clothing/shoes/hats, while excluding separately supplied glass eyes. This card narrows it to the supplied unpainted head without rooted hair or separate eyes/connection hardware; no resin, liquid preparation, whole doll or other accessory substitutes. No native CAS, grade, dimension, age, safety approval, geography-specific factory or recipe is asserted. Mass/kg is the sole reference property. Unique newly first quality-released complete component only. Calibrated net Q includes actual retained constituents and water once; released closing FG is already in Q, never deducted or added again. The declared reference output is 1 kg. Native unit group is `93a60a57-a4c8-11da-a746-0800200c9a66`.\n\nQ0 denotes the immutable sum of unique original first-quality-release whole-head net masses at the fixed completed-manufacturing gate, with original configuration/moisture/constituent basis; Q=0 denotes a zero-output case and is not a new original cohort. Link later service Qc to its original Q0. Partition each original acceptance basis across disjoint net remaining deliveries, every actual on-site accepted state, irreversible losses and other terminal dispositions. Gross returns, reinspection, repacking and attempted rework do not create Q. Delivery plus closing FG is sufficient only if there are no other postgate states/exits. Actual water or component changes require independently measured state/component conversion; never restore lost mass into a survivor and also charge that loss. Unknown/zero denominator retains all actual raw loads without a normalized result.\n\nComplete raw/WIP/FG, asset/fleet, packaging and retained-fluid physical stocks/transfers are independent from original acceptance events and environmental/provider-service attribution. Own opening WIP inherits its actual full prior foreground burdens once; substantiated closing WIP burden carries to future cohorts. A whole provider aggregate and decomposition of the same embedded material/transport/asset history are mutually exclusive. Failed, zero-output, idle, start-stop, cleanup, samples and attempted repair loads remain incurred; released FG is neither an unused manufacturing store nor a reason to erase already performed services.\n\nA genuine whole contaminated rejected head, discarded liquid preparation, cleaning effluent, package, removed board/nail/belt or asset is one actual recipient event Qt including its substrate/article, retained plastisol/PVC/additives and water once. Nested components and origin assays are not extra exported wastes unless physically separated before the boundary. Preserve complete receiver/provider Qt, actual composition and extensive unit independently. Its gross-card analytical Qt/Q display is not automatically treatment demand; submit only evidenced compatible nonoverlapping original-cohort service amounts A to the sole existing quotient with original Q0/Qc. Do not shrink physical Qt by service shares or charge full Qt to each cohort. Unknown assignment remains unresolved. A separate waste and its fraction within one real mixed outlet cannot both be external exchanges/providers.\n\nArithmetic illustration only, not a source/factory default: one10kg whole contaminated package event contains8kg substrate and2kg retained preparation/water. Independently evidenced25%/75% compatible service assignment produces2.5/7.5kg-equivalent provider demand; original Q0=100/200kg gives0.025/0.0375kg-equivalent per reference. The receiver gets10kg once, not2.5kg physical waste, another2kg contaminant export or10kg charged repeatedly. No share, density, recipe, yield, part mass or lifetime is inferred.\n\nPiper describes a PVC-resin/plasticizer/stabilizer liquid suspension and says it can formulate plastisol. That is not proof every processor purchases a premix or every site compounds locally. This route accepts an actual whole supplied preparation with a genuinely complete matched upstream formulation producer. A real separately modeled on-site preparation/conditioning unit is admissible only with its actual full ingredients, mixing/conditioning utilities, losses/waste and physical handovers, retaining every real burden once. Do not invent a purchase or paper-outsource known on-site compounding. A materially different separately purchased ingredient or processing route needs its own atomic interface and applicability review. No exact common source SKU/factory is demanded, and source recipes/assays are not defaults.\n\nAll-electric closed-mould single-charge forming and actual water-tank cooling do not imply a boiler, flame, thermal oxidizer, steam supply, vacuum degassing or a fixed air flow. Retain every real linked utility, ventilation/control, conditioning or wastewater producer with its complete actual inputs/outputs, species/phase composition, energy and waste; a receiving/purchased-service label cannot hide a known unit. Additional real operations require actual atomic interfaces before data-package completeness. PVC gel/fusion/solidification terminology supplies no chemical polymerization, reaction-water, VOC/HCl, plasticizer loss or zero-emission factor. Keep actual supplied/retained water, tank makeup/return/evaporation, condensate, reaction G/C if evidenced and relevant element/whole-mass/energy balances independently. Do not treat the patent multilayer painted-head example, scent ingredients or supplier parameter errors as this configuration or actual released species.\n\nActual whole preparations may remain one supplied Product only when their complete actual supply/BOM/provider boundary is known; their constituents are nonadditive analytical subledgers. Actual released chemical species, phase, medium and final sampling/receiver location require their own evidence and applicable procedures. Present, evidenced absent, below-detection and unknown are distinct. Do not invent phthalates, perfume, stabilizer species, mist or reaction products from generic plastisol/patent examples, and do not infer their absence. A total VOC/COD/PM/element indicator is not a molecular amount. Collected whole liquid/mist belongs to its actual receiver and is not simultaneously the same environmental export. Any actual essential analytical/matrix/phase procedure not established remains a core hold; finite schema/check success or a promise of a future SOP cannot waive it. Routine actual-site quantities/provider qualification/calibration within established procedures remain separate uncompleted study obligations.\n\n\nEPA Method0010, Rev1 August2018 as printed in the retained original, supplies an isokinetic filter/condenser/polymeric-sorbent sampling train and separately recovered fractions for semivolatile POHC incineration DRE; its stationary-source filterable-PM use is separately bounded by Method5. That scope does not automatically qualify non-incineration PVC head forming, every volatile, condensable or wet aerosol. Method3542A, Rev1 May2005, replaces the train sample-preparation section: preserve filter, front-half rinse, condenser/back-half rinse, sorbent, condensate/rinse and silica-gel/moisture records, their actual grouped extracts and blank/subsample/recovery history without losing or double-adding a physical fraction. Method8270E, Rev6 June2018, supplies identified GC-amenable semivolatile analysis in prepared air-media/water/solid extracts, actual analyte calibration/confirmation and continuing QC; its analyte list does not identify this plastisol or an actual emission. Preserve compound-specific extraction, transport/retention and breakthrough/recovery, interferences, blank contamination, wet/dry sampled gas volume, sampling time and actual outlet/receiver basis before species-mass integration. Non-GC-amenable compounds require their actual suitable analytical method; an unspecific promise of HPLC or a future SOP is insufficient. Source method settings, concentrations, efficiencies, numerical QC limits and sample-fraction recipes are not PCR defaults. These documents establish a bounded analytical programme and contrary scope evidence; actual PVC-outlet/matrix applicability and any necessary unestablished species/phase sampling/analysis procedure remain explicit core holds. Routine actual-site QA within an established applicable procedure remains a separate uncompleted study obligation. A collected whole receiver mixture, source indicator and actual final chemical emission remain different quantities; do not invent mist, additives or emissions to populate the programme.\n\nFor genuine gaseous N2/O2 legs, EPA Method3C supplies component GC-TCD analysis/calibration within its stated landfill/otherwise specified source scope, not automatic PVC-plant applicability or Ar measurement. Agilent5994-4552EN (18 January2022) demonstrates Ar/O2 baseline separation in a nitrogen-balance standard using Molesieve5Å micro-GC with helium carrier and moisture/CO2 backflush protection; its single-concentration repeatability/LOD evidence is not multipoint linearity, complete sampling/conditioning recovery or qualification of an actual hot/wet outlet. Column protection is not quantitative transport recovery. Retain each actual intake/final outlet, time/flow, wet/dry state, temperature/pressure, background and air ingress, component-specific calibration/response, separation and matrix/recovery evidence before integration to native kg. Homonuclear N2/O2 and monatomic Ar are not measured by ordinary IR-active gas FTIR. No fixed atmospheric composition, residual-fitted Ar, automatic subtraction of genuine carrier gases, source numerical settings or detection limits. Actual unidentified essential sampling/analytical/matrix procedures remain hold; routine site calibration within established procedures is a distinct study obligation, not a pass claimed here.\n\nAll adopted native fields remain admission conditions, not a source of quantities. The Tap water record has reference Mass and a secondary Volume coefficient of0.001m3 per reference kg; actual state/density and provider must be compatible with the full record, rather than evading a hard contradiction by selecting Mass alone. A density measurement is independent evidence, not permission to overwrite the coefficient. The wooden-pallet native is production mix at the lumber mill: preserve actual upstream manufacture plus the real transport/storage/packaging/loss bridge to this plant when that supply boundary is used. The CN below1kV electricity native is supplied to its user and must not duplicate already included transmission/distribution. No source requires a common factory/SKU; actual matching material/route/state/geography/availability and full provider histories remain required. A conflicting whole-record identity stays unbound; ordinary actual provider/quantity qualification does not become an invented scientific or regulatory approval.\n\n"
