      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Whole purchased liquid PVC plastisol; not a formed-head purchase |\n| starting_condition_role | Actual foreground manufacturing start; upstream supplied state once |\n| product_classification_scope | This complete-head narrow route within CPC3.0:38530 |\n| recursive_input_rule | Same-category heads cannot replace onsite forming; compatible whole-preparation upstream once and paired same-product internal cancellation |\n| upstream_dataset_requirement | Match whole composition/phase/grade/route/geography/time/supply/provider gate; flow identity is not a footprint |\n| disclosure | Complete configuration/actual operations/utilities Q/Qc/H gross gates all stock vectors and unresolved gaps |\n\nConsume this normative table with the complete section and ancestor context; conditional absence needs actual evidence and unknown is not zero.\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_terminal | complete terminal and every consuming context | The terminal is the complete manufactured hollow PVC human-doll head as a separately supplied unpainted component without rooted hair or separately fitted eyes/connectors. Integral geometry and actual retained constituents/water belong to the complete head once. Native manufactured-head-family compatibility must be confirmed across all material/form/route/grade/type/media facets; an exact SKU/name/CPC match is not required but a hard physical conflict cannot be waived. Whole dolls, other accessories, raw resin/unformed preparation and bought-formed-head repacking are outside this terminal. Actual multi-layer/multiple-charge, onsite compounding, separate decoration/eyes/hair or other heating/forming routes need full applicability assessment and all real atomic exchanges in this same record before use. | `un-cpc3-2025`; `adrie-head`; `piper-rotation` |\n| b_route | manufacture | Receive the whole liquid preparation; homogenise only as actually supplied/authorised; meter the single charge; close and rotate the mould; electrically heat through actual gel/fusion; cool; demould; actually trim and inspect the complete head; record unique first quality release. Include all trials, rejected/sample material, start-stop, idle, cleanout and rework with real utility/waste handling. This is full component manufacture, not purchased-head repacking. | `piper-rotation`; `zhongyi-machine`; `adrie-head` |\n| b_supply | whole preparations; internal transfers | Supplier-prepared liquid plastisol carries its complete compatible upstream manufacture once. Assay resin/plasticizer/stabilizer/colour/carrier fractions are nonadditive. Select disjoint whole-supply versus separately purchased onsite-compounding routes; an actual departure requires each identified material, energy/loss and complete component bridge before use. Whole head and its already-contained components cannot be additive purchases. Pair and cancel same-product internal handoffs on consolidation. | `piper-plastisol`; `piper-rotation` |\n| b_release | finished; manufacture | Q is calibrated net kg of unique newly first quality-released complete heads in one actual configuration/cohort/moisture window. Retained water/colour/all actual constituents enter once; packaging is excluded. Released closing FG is already Q and keeps its manufacturing burden: neither deduct it as Bclose nor add it as a second output. Opening released FG, delivery, return, reinspection and work create no new Q. This first-release method cannot be silently changed to net delivery. | `adrie-head`; `ilcd-2010` |\n| b_vectors | every manufacturing burden dimension | Preserve per-exchange inherited vectors in opening/closing raw stock, WIP and still-unassigned non-WIP stores. Prepare A from converted attributable raw load plus unassigned inherited opening vector minus only still-unassigned closing vector; subtract a handover only once when a real independent other cohort/function and justified allocation/transfer exist. Already stock-corrected consumption has no second stock correction. Ordinary rejects, failures, samples, offsite/sold waste and its treatment are not automatically Tother. Q=0 retains actual loads without unit results. | `ilcd-2010` |\n| b_service | supply; assets; all postrelease work | Keep actual original-cohort Qc and observed H for packaging, storage, handling, dispatch, returns and performed postrelease work. Preserve actual service already performed even while FG stays stored; carry only unused/unassigned service/charge. Future unknown service is not invented. A continued-conformance claim needs manufacturer/spec permission, real postwork tests, acceptance and disposition. Unauthorised/failed/rejected actual work retains all exchanges and original-cohort hold/Waste disposition; authorisation never deletes facts. Natural sorption/desorption needs no fictional repair/permission. | `adrie-head`; `ilcd-2010` |\n| b_pack | every actual packaging pool | Independently reconcile full wet O + P + I + ER + X_in = C + S + EO + W + X_out for each actual carton, PE bag and wooden pallet pool, separating empty/attached-WIP/attached-FG/reusable stocks. Each actual P/I/ER/S/EO/W event has its own direction card. P/I whole articles include constituents once; I retains real physical ingress and exactly one upstream burden owner. S follows gross physical shipment. Internal reuse cancels without repeated purchase, production Q or automatic credit. Add any actual other packaging with its own complete six directions before quantification. | `ilcd-2010` |\n| b_x | packaging; repair; water; all gross physical cards | X_in/X_out remove duplicates only with OTHER actual same-side incoming/outgoing terms. Never offset stocks, opposite directions or a card merely because it exists. Real added wood/nails/parts/water stay influx together with full wet closing mass, including normal storage/handling humidity. For every gross card prepare A=V: complete actual gross physical leg in its own native unit, never a burden vector, Bopen+U-Bclose, service share or economic allocation. Its sole quotient creates physical disclosure only, no procurement/provider load/credit; real burden has one separately owned dimension. | `ilcd-2010` |\n| b_outlet | all Waste; pool W origins | One real mixed Waste has one measured complete outlet and one actual treatment/provider. Independently measure pool-origin W as nonadditive subaccounts, not fractions fitted from one residual. Activate separate Waste cards only for real separate outlets. Ordinary waste sales/offsite handling never erase manufacture/treatment or create default coproduct status/credit. Keep all failed/test/rework material and disposition. | `ilcd-2010` |\n| b_assets | machine; mould; replacement parts; fluids | Keep whole physical asset O/C/new-used receipts/external returns/transfers/retirement and installed fluid separate from actual current service burden and remaining unused charge. Whole asset supplied parts/fluids enter once; actual new/old repair parts and each fluid phase have disjoint named cards/ledgers. No fixed life, machine kg from a website, one whole asset per kg, symmetric invented disposal, steam or boiler. Actual other fuels/thermal carriers require separate atoms and applicability; an external Product carrier-water return needs real supplier agreement and temperature/enthalpy without duplicate heat/provider. | `digismol-tooling`; `zhongyi-machine`; `ilcd-2010` |\n| b_physical | manufacture; FG service; consolidated gates | Independently close complete physical wet mass and relevant elements across the manufacturing, FG-service and consolidated gates. Track all physical raw/WIP/non-WIP/FG opening and closing stocks, actual gross transfers and moisture/other real state changes. Do not count whole wet heads plus contained onsite constituents twice. Separate free liquid, vapour, structural/bound and evidenced reaction water; plastisol gel/fusion alone proves no reaction-water production. Identify actual gas species/phases/media and fossil versus biogenic carbon independently; NOx/VOC/PM/COD/total-N/C are indicators, not molecules. No fixed atmospheric composition or one residual solving two unknowns. | `piper-plastisol`; `ilcd-2010` |\n| b_complete | every actual exchange | Before quantification add each real unlisted purchased chemical/preparation, colour, fuel, utility, water phase, packaging, repair part, fluid, Waste outlet and elementary species as one named atomic card with its actual gate/provider/unit. Document a conditionally absent event with evidence; unknown is not zero. A material principal-route or supplied-state departure requires applicability assessment in this record, not a parallel category invented from the classification code. | `ilcd-2010`; `piper-rotation` |\n\n"
