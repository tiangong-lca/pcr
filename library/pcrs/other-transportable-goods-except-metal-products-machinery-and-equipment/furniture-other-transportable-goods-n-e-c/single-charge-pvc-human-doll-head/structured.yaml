    applies_to: "all allocation cases"
    rule: "This is attributional modelling only for a study situation in which allocation rather than substitution is required. Establish the study context first; industrial manufacturing publications do not establish LCA allocation. Do not claim automatic system expansion or PEF/CFF conformity."
    source_ids:
      - ilcd-2010
  - rule_id: a_subdivide
    applies_to: "shared operations"
    rule: "Avoid allocation by actual independent/dedicated data and physical or virtual subdivision. Assign exclusively used preparation, tool, operation and identifiable input exchanges directly; separate other product/cohort operations before allocating any residual."
    source_ids:
      - ilcd-2010
  - rule_id: a_causality
    applies_to: "each remaining exchange"
    rule: "Determine a real exchange-specific physical causal relationship to the co-functions; test actual load/time/cycle/enthalpy/throughput evidence as appropriate. One weight share or machine time does not automatically determine every flow. Keep causal bounds, reconciliation and uncertainty."
    source_ids:
      - ilcd-2010
  - rule_id: a_residual
    applies_to: "genuinely residual common process"
    rule: "Only flows genuinely remaining after those steps use market values of real co-functions in their actual state and at the common process gate, from a coherent contemporaneous period. Document quantities/prices, excluded directly assigned exchanges and sensitivity. No fixed shares, arbitrary physical/economic choice, waste-sale credit or allocation scaling of physical gross legs."
    source_ids:
      - ilcd-2010
