system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Consume this normative table with the complete section and ancestor context; conditional absence needs actual evidence and unknown is not zero."
      source_ids: []
    - rule_id: b_terminal
      applies_to: "complete terminal and every consuming context"
      rule: "The terminal is the complete manufactured hollow PVC human-doll head as a separately supplied unpainted component without rooted hair or separately fitted eyes/connectors. Integral geometry and actual retained constituents/water belong to the complete head once. Native manufactured-head-family compatibility must be confirmed across all material/form/route/grade/type/media facets; an exact SKU/name/CPC match is not required but a hard physical conflict cannot be waived. Whole dolls, other accessories, raw resin/unformed preparation and bought-formed-head repacking are outside this terminal. Actual multi-layer/multiple-charge, onsite compounding, separate decoration/eyes/hair or other heating/forming routes need full applicability assessment and all real atomic exchanges in this same record before use."
      source_ids:
        - un-cpc3-2025
        - adrie-head
        - piper-rotation
    - rule_id: b_route
      applies_to: "manufacture"
      rule: "Receive the whole liquid preparation; homogenise only as actually supplied/authorised; meter the single charge; close and rotate the mould; electrically heat through actual gel/fusion; cool; demould; actually trim and inspect the complete head; record unique first quality release. Include all trials, rejected/sample material, start-stop, idle, cleanout and rework with real utility/waste handling. This is full component manufacture, not purchased-head repacking."
      source_ids:
        - piper-rotation
        - zhongyi-machine
        - adrie-head
    - rule_id: b_supply
      applies_to: "whole preparations; internal transfers"
      rule: "Supplier-prepared liquid plastisol carries its complete compatible upstream manufacture once. Assay resin/plasticizer/stabilizer/colour/carrier fractions are nonadditive. Select disjoint whole-supply versus separately purchased onsite-compounding routes; an actual departure requires each identified material, energy/loss and complete component bridge before use. Whole head and its already-contained components cannot be additive purchases. Pair and cancel same-product internal handoffs on consolidation."
      source_ids:
        - piper-plastisol
        - piper-rotation
    - rule_id: b_release
      applies_to: "finished; manufacture"
      rule: "Q is calibrated net kg of unique newly first quality-released complete heads in one actual configuration/cohort/moisture window. Retained water/colour/all actual constituents enter once; packaging is excluded. Released closing FG is already Q and keeps its manufacturing burden: neither deduct it as Bclose nor add it as a second output. Opening released FG, delivery, return, reinspection and work create no new Q. This first-release method cannot be silently changed to net delivery."
      source_ids:
        - adrie-head
        - ilcd-2010
    - rule_id: b_vectors
      applies_to: "every manufacturing burden dimension"
      rule: "Preserve per-exchange inherited vectors in opening/closing raw stock, WIP and still-unassigned non-WIP stores. Prepare A from converted attributable raw load plus unassigned inherited opening vector minus only still-unassigned closing vector; subtract a handover only once when a real independent other cohort/function and justified allocation/transfer exist. Already stock-corrected consumption has no second stock correction. Ordinary rejects, failures, samples, offsite/sold waste and its treatment are not automatically Tother. Q=0 retains actual loads without unit results."
      source_ids:
        - ilcd-2010
    - rule_id: b_service
      applies_to: "supply; assets; all postrelease work"
      rule: "Keep actual original-cohort Qc and observed H for packaging, storage, handling, dispatch, returns and performed postrelease work. Preserve actual service already performed even while FG stays stored; carry only unused/unassigned service/charge. Future unknown service is not invented. A continued-conformance claim needs manufacturer/spec permission, real postwork tests, acceptance and disposition. Unauthorised/failed/rejected actual work retains all exchanges and original-cohort hold/Waste disposition; authorisation never deletes facts. Natural sorption/desorption needs no fictional repair/permission."
      source_ids:
        - adrie-head
        - ilcd-2010
    - rule_id: b_pack
      applies_to: "every actual packaging pool"
      rule: "Independently reconcile full wet O + P + I + ER + X_in = C + S + EO + W + X_out for each actual carton, PE bag and wooden pallet pool, separating empty/attached-WIP/attached-FG/reusable stocks. Each actual P/I/ER/S/EO/W event has its own direction card. P/I whole articles include constituents once; I retains real physical ingress and exactly one upstream burden owner. S follows gross physical shipment. Internal reuse cancels without repeated purchase, production Q or automatic credit. Add any actual other packaging with its own complete six directions before quantification."
      source_ids:
        - ilcd-2010
    - rule_id: b_x
      applies_to: "packaging; repair; water; all gross physical cards"
      rule: "X_in/X_out remove duplicates only with OTHER actual same-side incoming/outgoing terms. Never offset stocks, opposite directions or a card merely because it exists. Real added wood/nails/parts/water stay influx together with full wet closing mass, including normal storage/handling humidity. For every gross card prepare A=V: complete actual gross physical leg in its own native unit, never a burden vector, Bopen+U-Bclose, service share or economic allocation. Its sole quotient creates physical disclosure only, no procurement/provider load/credit; real burden has one separately owned dimension."
      source_ids:
        - ilcd-2010
    - rule_id: b_outlet
      applies_to: "all Waste; pool W origins"
      rule: "One real mixed Waste has one measured complete outlet and one actual treatment/provider. Independently measure pool-origin W as nonadditive subaccounts, not fractions fitted from one residual. Activate separate Waste cards only for real separate outlets. Ordinary waste sales/offsite handling never erase manufacture/treatment or create default coproduct status/credit. Keep all failed/test/rework material and disposition."
      source_ids:
        - ilcd-2010
    - rule_id: b_assets
      applies_to: "machine; mould; replacement parts; fluids"
      rule: "Keep whole physical asset O/C/new-used receipts/external returns/transfers/retirement and installed fluid separate from actual current service burden and remaining unused charge. Whole asset supplied parts/fluids enter once; actual new/old repair parts and each fluid phase have disjoint named cards/ledgers. No fixed life, machine kg from a website, one whole asset per kg, symmetric invented disposal, steam or boiler. Actual other fuels/thermal carriers require separate atoms and applicability; an external Product carrier-water return needs real supplier agreement and temperature/enthalpy without duplicate heat/provider."
      source_ids:
        - digismol-tooling
        - zhongyi-machine
        - ilcd-2010
    - rule_id: b_physical
      applies_to: "manufacture; FG service; consolidated gates"
      rule: "Independently close complete physical wet mass and relevant elements across the manufacturing, FG-service and consolidated gates. Track all physical raw/WIP/non-WIP/FG opening and closing stocks, actual gross transfers and moisture/other real state changes. Do not count whole wet heads plus contained onsite constituents twice. Separate free liquid, vapour, structural/bound and evidenced reaction water; plastisol gel/fusion alone proves no reaction-water production. Identify actual gas species/phases/media and fossil versus biogenic carbon independently; NOx/VOC/PM/COD/total-N/C are indicators, not molecules. No fixed atmospheric composition or one residual solving two unknowns."
      source_ids:
        - piper-plastisol
        - ilcd-2010
    - rule_id: b_complete
      applies_to: "every actual exchange"
      rule: "Before quantification add each real unlisted purchased chemical/preparation, colour, fuel, utility, water phase, packaging, repair part, fluid, Waste outlet and elementary species as one named atomic card with its actual gate/provider/unit. Document a conditionally absent event with evidence; unknown is not zero. A material principal-route or supplied-state departure requires applicability assessment in this record, not a parallel category invented from the classification code."
      source_ids:
        - ilcd-2010
        - piper-rotation
