  - id: native_units
    applies_to: "each individual exchange"
    required_property_ref:
      name: "Actual native extensive property"
      uuid: ""
    required_unit: "row-specific"
    rule: "Preserve each actual kg/MJ/kWh/m3/h numerator independently. Energy is not Mass. Convert raw units before attribution; integrated volumes are not rates. Density requires independent measurement of that substance and state; no secondary-property inference. Number of items to item has factor 1 only as a physical unit alias and never supplies kg per deck."
  - id: single_division
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared reference-product Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Protocols collect raw quantities only. c_once is the only division by cohort Q; every card and aggregation refers to that same result. Full gross physical leg V is never replaced by a stock-corrected, economic or service-burden numerator. Provider burden A is a separate dimension with one-time ownership. Q=0 keeps actual loads without a unit result."
