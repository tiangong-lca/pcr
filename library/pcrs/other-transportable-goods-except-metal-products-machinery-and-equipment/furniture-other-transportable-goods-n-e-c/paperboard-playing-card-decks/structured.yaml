allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "These rules retain the complete section 5 scope, cohort and physical gates; industrial evidence does not replace ILCD allocation context."
    source_ids: []
  - rule_id: a_context
    applies_to: "attributional inventory only"
    rule: "Use this hierarchy only where the study goal supports attributional allocation; consequential substitution and comparisons of different game functions need their own justified framework. Manufacturer technical descriptions do not supply allocation evidence."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_exclusive
    applies_to: "each exchange"
    rule: "First isolate dedicated operations and exclusive exchange portions by subdivision or virtual subdivision. For the true remaining common process identify exchange-specific determining physical causality with actual data; do not choose mass, time, area or price freely from a menu."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_residual
    applies_to: "only unresolved causal remainder"
    rule: "Only where a determining physical relationship genuinely remains unavailable after justified investigation may residual common-process inventory use contemporaneous market values at the same process gate and actual state/quality/bulk condition. Remove downstream processing/packing/transport value differences; document prices, quantities, currency, period, sensitivity and unresolved uncertainty. No fixed share."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_conserve
    applies_to: "burden vectors versus gross physics"
    rule: "For each exchange j conserve the sum of assigned burden vectors over cohorts/functions plus actual raw/WIP/unused stores. Released closing FG does not remove already performed manufacture/service. Gross physical V of FG, packaging, assets, fluids, carriers and wastes remains complete and is never scaled by load/economic/service shares. No stock correction twice after a consumption record has already been stock corrected."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_waste
    applies_to: "ordinary losses and recovery"
    rule: "Ordinary failed output, trim, rejected decks, samples and their actual treatment remain in manufacture/associated service burdens even if sent away or sold. Transfer a burden vector only once where a real independent other cohort/function and a justified allocation/handover establishes it. Internal reuse and waste sale give no automatic avoided-product credit; a true recycling allocation needs its own complete route/status evidence."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "deck_manufacture"
      flow_role: "new complete net decks"
      record_type: "scale and first-quality-release register"
      raw_fields: "deck_design; card_identity_list; actual_card_count; configuration; lot; timestamp; new_first_release; calibrated_gross; packaging_tare; net_deck_kg; moisture; hold; sample; rejected; zero_output"
      collection_method: "Weigh complete net decks independently on a calibrated scale or use traceable actual calibrated lot weighing; independently tare the actual box/wrap. Reconcile the actual card list and first-release event, not merely a boxed SKU or nominal count."
      unit: "kg"
      frequency: "each event and complete cohort"
      temporal_coverage: "actual manufacture and original-cohort observed H"
      site_scope: "actual site and actual supplier/recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "raw quantities/calibration/wet state/configuration/origin/history/vectors; missing explicit"
    - protocol_id: cp_inputs
      process_id: "deck_manufacture"
      flow_role: "one supplied atomic article"
      record_type: "receipts and wet-stock ledger"
      raw_fields: "material_identity; supplier; supply_form; gross_receipt; whole_wet_mass; embedded_constituents; opening_raw; closing_raw; opening_WIP; closing_WIP; nonWIP_stock; inherited_exchange_vector; returns; failed_jobs"
      collection_method: "Collect full gross actual physical legs with batch identity and complete wet-state stock. Independently measure constituent subaccounts and inherit every upstream exchange vector; state whether a consumption record is already stock corrected."
      unit: "kg"
      frequency: "each event and complete cohort"
      temporal_coverage: "actual manufacture and original-cohort observed H"
      site_scope: "actual site and actual supplier/recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "raw quantities/calibration/wet state/configuration/origin/history/vectors; missing explicit"
    - protocol_id: cp_formulations
      process_id: "deck_manufacture"
      flow_role: "one actual whole formulation"
      record_type: "purchase mixing and component-fate ledger"
      raw_fields: "SKU; colour; CAS; grade; supply_wet_mass; assay; carrier; added_material; bath_open; bath_close; retained; captured; emitted; waste; carbon_origin; losses"
      collection_method: "Weigh each complete supplied preparation once; onsite mixing separately records each real purchased ingredient and real mixing energy/loss. Assay/carrier/active-material balances are non-additive; use actual physical and chemical evidence, not default SDS fractions."
      unit: "kg"
      frequency: "each event and complete cohort"
      temporal_coverage: "actual manufacture and original-cohort observed H"
      site_scope: "actual site and actual supplier/recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "raw quantities/calibration/wet state/configuration/origin/history/vectors; missing explicit"
    - protocol_id: cp_utilities
      process_id: "deck_manufacture"
      flow_role: "one real utility or carrier leg"
      record_type: "independent meters and supplier convention"
      raw_fields: "meter_unit; meter_start; meter_end; integrated_volume; true_rate; duration; substance_density; phase; T; P; enthalpy; fuel_composition; heating_value; heat_MJ; carrier_kg; external_Product_return; provider_owner; stage; cohort; horizon"
      collection_method: "Retain actual original extensive units and raw meter records. Convert before attribution; integrate only true rates and use independent state-specific density/enthalpy. Record real external Product returns at full gross quantity and avoid one supplier charged twice for carrier mass and heat."
      unit: "actual kg; MJ; kWh; m3"
      frequency: "each event and complete cohort"
      temporal_coverage: "actual manufacture and original-cohort observed H"
      site_scope: "actual site and actual supplier/recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "raw quantities/calibration/wet state/configuration/origin/history/vectors; missing explicit"
    - protocol_id: cp_fg
      process_id: "deck_manufacture"
      flow_role: "one FG gross event"
      record_type: "first-release-cohort wet-state ledger"
      raw_fields: "original_cohort; original_Q; H; opening_FG_wet; first_release_transfer; gross_shipment; actual_return; original_delivery_link; incoming_new_water; outgoing_loss; closing_FG_wet; inherited_vector; performed_service; permission; posttests; acceptance; disposition"
      collection_method: "Measure gross legs and full physical inventories independently; preserve each original burden vector and actual newly performed service. Returns and reinspection never create Q; do not equate returned wet mass to original delivery or omit new water and actual losses."
      unit: "kg"
      frequency: "each event and complete cohort"
      temporal_coverage: "actual manufacture and original-cohort observed H"
      site_scope: "actual site and actual supplier/recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "raw quantities/calibration/wet state/configuration/origin/history/vectors; missing explicit"
    - protocol_id: cp_pack
      process_id: "deck_manufacture"
      flow_role: "one actual packaging pool/event"
      record_type: "six-leg wet-stock and ownership ledger"
      raw_fields: "pool; material_identity; P; I; ER; gross_S; EO; W; opening_empty; opening_attached_WIP; opening_attached_FG; opening_reusable; closing_empty; closing_attached_WIP; closing_attached_FG; closing_reusable; X_in; X_out; natural_H2O_in; natural_H2O_out; new_parts; old_parts; full_wet_mass; upstream_owner; mixed_origin_W; actual_whole_receiver_Qt_once; actual_full_provider_quantity_once; nested_component_bridge; actual_physical_cohort_provenance; evidenced_service_vectors; compatible_provider_units; original_Q0_each_cohort; Qanalysis; real_disjoint_repair_retained_increment; real_disjoint_departure; X_is_only_duplicate_component_reconciliation"
      collection_method: "Weigh each actual card event in its complete wet state, including supplier-included ingress; preserve all six legs. Independently measure each pool W even in one mixed outlet. De-duplicate only another same-side actual leg, never closing stock or the opposite side; whole article and separately supplied components require a disjoint bridge. One actual whole contaminated receiver/provider quantity is recorded once; distinct evidenced nonoverlapping service vectors use each served original cohort and compatible provider units. Actual full fleets/stocks/waste remain unchanged. X is only duplicate other same-side reconciliation, not another physical influx/outflux; all real retained repair/water increments remain."
      unit: "kg"
      frequency: "each event and complete cohort"
      temporal_coverage: "actual manufacture and original-cohort observed H"
      site_scope: "actual site and actual supplier/recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "raw quantities/calibration/wet state/configuration/origin/history/vectors; missing explicit"
    - protocol_id: cp_waste
      process_id: "deck_manufacture"
      flow_role: "one actual waste outlet and treatment"
      record_type: "weighbridge receiver and treatment records"
      raw_fields: "actual_outlet; waste_type; phase; wet_mass; destination; real_sale; mixed_origin; nonadditive_component; treatment_owner; treatment_route; actual_service_unit; aftercontrol_species; actual_whole_receiver_Qt_once; actual_full_provider_quantity_once; nested_component_bridge; actual_physical_cohort_provenance; evidenced_service_vectors; compatible_provider_units; original_Q0_each_cohort; Qanalysis; real_disjoint_repair_retained_increment; real_disjoint_departure; X_is_only_duplicate_component_reconciliation"
      collection_method: "Measure actual gross physical waste and one linked actual treatment demand, preserving failed output and Q=0 burdens. One mixture total and non-additive origin accounts cannot become multiple exports/providers. Direct releases have species and media, not a generic wastewater chemical substitute. One actual whole contaminated receiver/provider quantity is recorded once; distinct evidenced nonoverlapping service vectors use each served original cohort and compatible provider units. Actual full fleets/stocks/waste remain unchanged. X is only duplicate other same-side reconciliation, not another physical influx/outflux; all real retained repair/water increments remain."
      unit: "actual kg; actual service unit"
      frequency: "each event and complete cohort"
      temporal_coverage: "actual manufacture and original-cohort observed H"
      site_scope: "actual site and actual supplier/recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "raw quantities/calibration/wet state/configuration/origin/history/vectors; missing explicit"
    - protocol_id: cp_assets
      process_id: "deck_manufacture"
      flow_role: "one actual asset part fluid or fulfilled service"
      record_type: "asset stock and actual service register"
      raw_fields: "asset_identity; configuration; opening_installed; closing_installed; gross_acquisition; gross_retirement; actual_service_hours; service_charge; new_part; removed_part; installed_fluid; phase_water; permission; posttests; original_cohort; H; unassigned_unused_charge; actual_whole_receiver_Qt_once; actual_full_provider_quantity_once; nested_component_bridge; actual_physical_cohort_provenance; evidenced_service_vectors; compatible_provider_units; original_Q0_each_cohort; Qanalysis; real_disjoint_repair_retained_increment; real_disjoint_departure; X_is_only_duplicate_component_reconciliation"
      collection_method: "Record full gross asset/part/fluid movements separately from actual fulfilled service. Independently measure each new/old part and wet stock; no fixed lifetime, no entire machine per kg, no physical mass scaled by economic share. Only actual unused/unassigned service charge may carry forward. One actual whole contaminated receiver/provider quantity is recorded once; distinct evidenced nonoverlapping service vectors use each served original cohort and compatible provider units. Actual full fleets/stocks/waste remain unchanged. X is only duplicate other same-side reconciliation, not another physical influx/outflux; all real retained repair/water increments remain."
      unit: "actual kg; h"
      frequency: "each event and complete cohort"
      temporal_coverage: "actual manufacture and original-cohort observed H"
      site_scope: "actual site and actual supplier/recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "raw quantities/calibration/wet state/configuration/origin/history/vectors; missing explicit"
    - protocol_id: cp_species
      process_id: "deck_manufacture"
      flow_role: "one real molecule/phase/medium"
      record_type: "species-resolved physical and elemental ledger"
      raw_fields: "molecule; CAS; phase; medium; inlet_gross; outlet_gross; actual_generated; actual_consumed; carbon_origin; raw_concentration; true_rate; integrated_volume; duration; independent_density; free_water; retained_water; structural_water; reaction_water; ordinary_sorption; ordinary_desorption; stock; uncertainty"
      collection_method: "Independently measure actual species, actual wet stocks, natural humidity exchange and each relevant element. Integrate concentration with actual corresponding flow only with correct state; one total-mass residual cannot establish two unknown species or water/reaction amounts. Keep VOC/COD/NOx/PM indicators separate from molecules and phase changes."
      unit: "actual kg; raw concentration; actual volume"
      frequency: "each event and complete cohort"
      temporal_coverage: "actual manufacture and original-cohort observed H"
      site_scope: "actual site and actual supplier/recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "raw quantities/calibration/wet state/configuration/origin/history/vectors; missing explicit"
  calculation_rules:
    - id: c_release
      applies_to: "first_release"
      rule: "Q = sum of actual newly first-quality-released complete net deck masses; exclude packaging and any previously released deck. Closing released FG is within Q."
      inputs:
        - net_deck_kg
        - first_release_event
        - cohort
      output: "Q"
      source_ids:
        - cartamundi-guide
        - fournier-quality
    - id: c_raw_units
      applies_to: "all inventory rows"
      rule: "Convert each raw extensive quantity to its actual native reference unit before attribution. For electricity E_MJ = 3.6 * E_kWh; integrated volumes stay volumes; true rates alone are integrated; substance-specific measured density and state are needed for mass/volume conversion."
      inputs:
        - raw_meter
        - true_rate
        - duration
        - state
        - independent_density
      output: "V"
      source_ids:
        - ilcd-allocation-2010
    - id: c_burden
      applies_to: "all inventory rows"
      rule: "Keep physical V complete and independent. For each exchange j: L_open,j + L_new,j = A_cohort,j + A_true_other,j + L_close,j. L_close includes only actual raw/WIP/unassigned non-WIP and genuinely unused service charge, never released closing FG or performed service. If a collected load is already stock-corrected consumed load do not apply opening/closing again. Genuine other-function transfer requires justified allocation/handover once; ordinary waste/reject/sample sales are not A_true_other.  L_new is the new burden addition before stock correction; an already consumed load uses its reconciled equivalent ledger without repeating stock corrections or provider-expanded history."
      inputs:
        - L_open
        - L_new
        - L_close
        - causal_assignment
        - genuine_handover
      output: "A"
      source_ids:
        - ilcd-allocation-2010
    - id: c_once
      applies_to: "all inventory rows"
      rule: "q_phys=V/Qanalysis is only physical disclosure of the once-only full actual event using a declared positive observation basis. Linked modeled demand is the separately evidenced attributable vector A/Q0 or A_h/original_Qc per each original positive cohort in compatible provider units, exactly once. Never charge full shared Qt/provider quantity again to every cohort or scale physical V by service allocation. Zero/unknown basis preserves raw totals without unit result."
      inputs:
        - V
        - Qanalysis
        - A
        - Q0
        - A_h
        - original_Qc
        - H
      output: "x"
      source_ids:
        - ilcd-allocation-2010
    - id: c_pack
      applies_to: "all inventory rows"
      rule: "For each same-unit actual whole-wet pool: O+P+I+ER+J_in+H2O_in=C+S_filled+EO_empty+W_whole+J_out+H2O_out. J and H2O are actual disjoint repair/retained increments and departures. X_in/out only reconcile duplicate OTHER same-side constituent terms before this equation; X is not another added physical stream and never erases true P/I/ER, wet C, opposite flows or real retained influx. Whole W includes nested substrate/residue/water once, linked to any substrate-only balance by composition. Internal reuse cancels; origin W in one mixed receiver is nonadditive. No normalization here."
      inputs:
        - O
        - P
        - I
        - ER
        - S_filled
        - EO_empty
        - W_whole
        - J_in
        - J_out
        - H2O_in
        - H2O_out
        - X_in
        - X_out
        - C
      output: "pool_balance"
      source_ids:
        - printninja-card-production
        - ilcd-allocation-2010
    - id: c_physical
      applies_to: "all inventory rows"
      rule: "Close each stage and combined wet-mass gate plus each relevant element using independently measured opening/closing stocks and complete actual external gross legs. Matched internal stock→print→cut→collation→first-release→FG handoffs cancel with equal physical quantities and inherited vectors. Quantitative-reference Q is not added again beside its closing FG. Do not infer water, oxygen, emission species or reaction extent from an underdetermined residual; no normalization in this rule."
      inputs:
        - all_actual_gross_legs
        - wet_stocks
        - component_assay
        - independent_species
        - inherited_vectors
      output: "physical_and_element_balances"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each physical row"
      requirement: "Match full product/material/chemical/type/route/geography/media and exact native support. Ordinary UUID/provider gaps do not remove real exchanges; genuinely incompatible bindings stay absent."
      evidence: "complete native record and actual supplier specification"
    - id: dq_measurement
      applies_to: "all actual records"
      requirement: "Retain calibration, raw meter units, actual configurations, full wet mass, phase, uncertainty and complete original records; missing is not zero and no recipe/yield/density/mass defaults."
      evidence: "calibration and raw linked logs"
    - id: dq_context
      applies_to: "cohorts and scope"
      requirement: "Retain original acquisition/source scope, real supplier/site/period, actual service H, all conditions and exclusions, original cohort and one-time provider ownership. No contemporaneous common-order claim for the technical synthesis."
      evidence: "source scope and linked cohort ledger"
    - id: dq_completeness
      applies_to: "full route"
      requirement: "Audit each actual six-leg packaging pool and gross physical stream, failed/Q=0 loads, inherited vectors and elemental balances. True missing terminal/measurement/methodology evidence remains an explicit hold rather than a success count."
      evidence: "full raw-to-typed cell and semantic audit"
validation_rules:
  - rule_id: v_core
    applies_to: "reference and route"
    rule: "Require one compatible manufactured physical Playing cards Product reference with exact native property/unit support, and actual complete paperboard deck/configuration evidence. A board, ink, single-sheet, box or software identity does not replace the core. Ordinary auxiliary/provider gaps remain explicit; a genuinely unresolved core identity or terminal route prevents usable authored guidance."
    source_ids:
      - fournier-quality
      - cartamundi-guide
  - rule_id: v_q
    applies_to: "denominator and once-only normalization"
    rule: "Reconcile actual Q against first-release records and net deck weighing; no assumed 52/54-card count, dimensions-to-mass, grammage-to-deck-mass, boxed gross weight or service-life denominator. c_once performs each raw physical/burden division once; Q=0 has no per-unit result. Every row/protocol must share this cohort basis in both languages."
    source_ids:
      - fournier-quality
      - ilcd-allocation-2010
  - rule_id: v_ledgers
    applies_to: "all physical and burden gates"
    rule: "Independently reconcile wet raw/WIP/non-WIP/FG/packaging/asset/part/fluid mass, each inherited exchange vector, gross legs and relevant elements. Closing released FG neither new Q nor manufacturing Bclose; service horizon and original cohort retained. X only removes duplicate same-side terms and never real retained influx. One actual mixed waste outlet has one provider and non-additive measured origin pools."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_atoms
    applies_to: "each adopted flow"
    rule: "Verify actual material/CAS/form/phase/grade/route/geography/type/media against the complete native record and all properties plus exact property-to-unit-group chain; preserve official Chinese basename. A successful query or Schema does not waive incompatibility. Add actual missing atomic flows before a dataset completeness claim."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_permission
    applies_to: "actual postrelease work"
    rule: "Retain manufacturer/spec permission, postwork testing, acceptance and disposition for actual rework; do not presume restored broken cards. Unauthorized/failed/rejected actual work retains every real flow and load under its original cohort and actual hold/waste disposition. Natural moisture exchange is measured without inventing repairs."
    source_ids:
      - fournier-quality
  - rule_id: v_quality
    applies_to: "unknowns and release claims"
    rule: "Unknown observations, molecular speciation, provider matches or unsupported relations are explicit unresolved fields, never zero or a claimed pass. Engineering/schema/fingerprint checks establish declared consistency only; science review, translation review and formal publication need their own independent evidence."
    source_ids:
      - ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Background only for an actual compatible deck construction/route/unit/time/geography"
  allowed_use: "Attributional paperboard-deck manufacturing inventory with complete qualifiers/uncertainty; gross physical disclosure and provider-demand dimensions explicitly separate"
  excluded_use: "All-plastic/digital/electronic cards, unlike-function comparison, fixed lifetime/certification, unsupported completeness or treating gross cards automatically as procurement demand"
  required_metadata: "Complete qualifiers, original Q/cohort/H, source edition/scope, actual site/providers/route, native property/units and ownership per dimension"
  required_quality_disclosure: "Complete methodology/boundary/mass-vectors/allocation/gaps; scientific/translation review independent and engineering checks grant no approval"
  update_trigger: "Changed product/supply form/formulation/route/unit chain/raw or service data/site conditions"
