product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.furniture-other-transportable-goods-n-e-c.paperboard-playing-card-decks"
  classification_refs: "CPC 3.0 38570; narrower product and route boundary"
  covered_products: "Complete printed and surface-finished paperboard playing-card decks with actual collated card configuration; actual rounded or separately declared other final cut shape"
  excluded_products: "100% plastic decks; digital card games; smart/magnetic cards; loose generic printed images; board-game boards/tokens; packaging as the reference product; special metal foil/electronics/security chemistry without separate evidence"
  representative_product: "One complete paperboard playing-card deck of the actual released design and list; net cards include actual retained stock/ink/finish/moisture and exclude removable box/wrap"
  production_route: "Complete supplied card stock → prepress/printing → actual surface finishing/setting → actual cutting/corner rounding → configuration-specific collation/QC/first release → actual packaging/storage/handling/dispatch; outsourced intermediate burdens preserved without duplicate in-house production"
  market_state: "New complete net physical deck first quality released at the manufacturing gate; subsequent actual services attached to the original cohort over a declared horizon"
functional_unit:
  what: "Provide complete physical paperboard playing-card decks of the declared card list"
  how_much: "1 kg complete newly first-released net decks"
  how_well: "Complete configuration and actual print/surface/cut/corner/quality acceptance under the real specification; no default performance or certification"
  how_long_or_cycle: "Actual cohort manufacture and observed actual-service horizon H; no gameplay lifetime"
  reference_flow_link: "first_release"
system_boundary:
  rules:
    - rule_id: b_complete
      applies_to: "complete route"
      rule: "Include actual preparation, make-ready, complete supplied stock, printing, surface treatment/setting, trimming/corner operation, actual deck collation, testing/first release and actual packing/handling/storage/dispatch. Record stages separately within one aggregate process and preserve losses, samples, rejected jobs and start-stop/idle/cleanup loads."
      source_ids:
        - cartamundi-solutions
        - cartamundi-guide
        - fournier-quality
    - rule_id: b_supply
      applies_to: "supplied articles and formulations"
      rule: "One complete purchased stock or formulation has one upstream owner; opacity layers, supplier coat, formulation assay, carrier water and active ingredients are non-additive subaccounts. Actual onsite added preparation ingredients are separate real purchases with energy/losses. Bought preprinted intermediates and in-house equivalent components are disjoint or bridged with internal equal transfers cancelled."
      source_ids:
        - fournier-quality
        - epa-offset-2006
    - rule_id: b_qgate
      applies_to: "first-release and FG"
      rule: "Q is only newly first-quality-released complete net deck mass. One release remains counted when held as FG; do not add its closing mass to output or subtract its manufacturing burden. Returns/reinspection/redispatch are gross real events linked to original cohort and never new Q. Preserve opening/closing FG full wet physical mass and inherited history; aggregate internal production-to-FG Q cancels. Net-delivery-based modelling is outside this denominator and needs a complete independent delivery/return/reversal/history bridge."
      source_ids:
        - fournier-quality
        - ilcd-allocation-2010
    - rule_id: b_services
      applies_to: "postrelease work and uncertainty"
      rule: "Keep actual services performed for each original cohort within actual horizon H, even for stored FG; future unperformed service is unknown. Actual postrelease rework requires manufacturer/spec permission, postwork tests, acceptance and disposition evidence, but missing permission, failed tests or rejection never delete actual logistics/loads: retain original cohort and real hold/waste state. Natural sorption/desorption does not imply an invented repair operation or permit."
      source_ids:
        - fournier-quality
        - ilcd-allocation-2010
    - rule_id: b_pack
      applies_to: "each real packaging pool"
      rule: "Retain opening/closing empty, WIP-attached, FG-attached and reusable wet stock and six actual gross P/I/ER/S/EO/W legs in individual cards. P/I supplies are disjoint and supplier-included mass and one upstream owner remain explicit. Internal reuse cancels; no second procurement, product Q or automatic coproduct credit. X only de-duplicates another same-side flow term; full new influx and full wet closing stock coexist. A single actual mixed waste outlet has non-additive independently measured pool W subaccounts."
      source_ids:
        - printninja-card-production
        - cartamundi-guide
    - rule_id: b_atoms
      applies_to: "physical streams"
      rule: "Add every additional actual material, individual supplied formulation, energy/fuel, fluid, new/old part, physical asset, waste outlet and molecular species as a specific atomic row with correct direction/type/phase/medium/native property. Conditional absence needs evidence; missing observations are not zero. Whole article and its ingredients must be disjoint or reconciled. No other/input/output basket hides actual manufacture."
      source_ids:
        - epa-offset-2006
        - ilcd-allocation-2010
    - rule_id: b_species
      applies_to: "mass and elements"
      rule: "Close full physical wet mass and each relevant element independently from actual molecular/phase and reaction-water evidence. Measure natural H2O uptake/release during manufacture and ordinary storage/handling; retain real influx even in closing stock. Distinguish free/phase/retained/structural/reaction water. Do not fit two unknowns from one residual, assign COD/VOC/NOx/PM indicators to a molecular mass, multiply integrated volumes by time or use water density for another substance."
      source_ids:
        - epa-offset-2006
        - ilcd-allocation-2010
    - rule_id: b_utilities
      applies_to: "utilities and assets"
      rule: "No boiler, steam loop, fuel route or fixed dryer is presumed. Where real, record carrier kg/phase/T/P/enthalpy and actual returned Product plus delivered heat MJ under one supplier agreement; no duplicate whole-provider demand. Distinguish full gross asset/part/fluid stock movements from actual fulfilled capital service; no fixed life, per-kg whole machine or scaling of physical mass by burden share."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_upstream
      applies_to: "upstream and downstream"
      rule: "Link compatible actual stock, pulp/paper/coating, ink, plate, each auxiliary, utility, delivery and treatment backgrounds once. The foreground is complete deck manufacture, not bought-finished-deck repacking. Packaging is separate from net deck output. Gameplay, digital/software, retail, use life and downstream final disposal require separate models; no universal game performance, certification or service life is asserted."
      source_ids:
        - cartamundi-solutions
        - fournier-quality
    - rule_id: system_boundary_rule_10
      applies_to: "foreground_system_boundary"
      rule: "This method addresses real complete paperboard playing-card decks: supplied card stock, printing, actual surface finishing, cutting/corner rounding, collation and first quality release supported by complete primary manufacturer descriptions. A deck is not a single sheet, board, ink or box. This is a transparent technical synthesis of compatible primary sources, not a claim of one SKU, factory or order; capabilities do not supply factory activity quantities. Stock may contain an opaque middle, supplier coat or additives as actually supplied. No default recipe, card count, dimensions, yield, mass, density, temperature/time, life, age, certification or emission factor is specified. All-plastic/PVC, metal-foil, electronic and special security routes need separate evidence and cannot inherit the paperboard method."
      source_ids: []
    - rule_id: system_boundary_rule_11
      applies_to: "foreground_system_boundary"
      rule: "Retain every qualifier with the actual data package. Q is newly first-quality-released complete net product mass once; actual retained constituents and water count once and packaging is excluded. The complete first_release card also preserves native product restrictions."
      source_ids: []
    - rule_id: system_boundary_rule_12
      applies_to: "foreground_system_boundary"
      rule: "Retain stage subledgers: supply/prepress → print → finish/set → cut/corner → collate/inspect/first release → pack/handle/store/dispatch. Every physical card uses its complete actual gross leg V as c_once numerator; the separate provider-burden dimension A is assigned once. Physical disclosure itself never triggers procurement, provider load or credit. Actual original-cohort services retain original Q and observed H, never another current-period cohort output."
      source_ids: []
    - rule_id: system_boundary_rule_13
      applies_to: "foreground_system_boundary"
      rule: "Protocols collect unnormalised raw quantities and actual states only. Their aggregation_rule identifies the same reference basis and performs no numeric normalization; the only division is c_once."
      source_ids: []
    - rule_id: system_boundary_rule_14
      applies_to: "foreground_system_boundary"
      rule: "The exact native whole Product is Playing cards / 纸牌, production mix at plant, finished product manufactured, with Mass/kg reference. Preserve its complete original comments “Flow for Playing cards” and “出牌流程”; the loose Chinese comment is not silently rewritten or used alone to infer a gameplay Process. The complete Product type, manufactured state, actual physical deck family and full primary stock/printing/cutting/collation evidence together support this narrower complete paperboard deck. A sheet, ingredient, packaging or gameplay service cannot substitute. Actual grade/provider and field qualification still require evidence. Sources: fournier-quality;cartamundi-solutions;cartamundi-guide."
      source_ids: []
    - rule_id: system_boundary_rule_15
      applies_to: "foreground_system_boundary"
      rule: "First acceptance means the complete actual card identity/count/sequence and all genuinely required print, surface, cut, collation and final packing-line checks have been completed. If actual approval occurs after boxing/sealing/wrapping, every necessary pre-release packaging operation remains manufacturing work even though removable packaging mass is excluded from net Q. If a genuinely complete accepted deck is released before later optional packing, keep the actual gate instead of inventing another compulsory stage. Subsequent real services use original cohort and observed H; source descriptions do not establish a universal release location or count threshold. Sources: fournier-quality;printninja-card-production."
      source_ids: []
    - rule_id: system_boundary_rule_16
      applies_to: "foreground_system_boundary"
      rule: "Lock Q (original Q0) as the positive sum of unique complete-deck first-acceptance net masses at one fixed actual gate and measured state. Retain original event mass/date and a disjoint original-basis bridge of remaining net deliveries, every actual on-site accepted state including FG/holds/accepted samples/repair WIP, irreversible material/water losses and other terminal dispositions. Already accepted later destroyed decks remain in Q0; never-accepted destroyed samples do not enter Q. Returns/retests/rework/redispatch and later moisture change create no new reference event. Never restore lost water/material into survivors and count the loss again. Q0 is an event account, not another external physical output; Q=0 or unknown basis preserves raw totals without a unit result."
      source_ids: []
    - rule_id: system_boundary_rule_17
      applies_to: "foreground_system_boundary"
      rule: "For each burden-vector dimension use L_open+L_new=A_cohort+A_true_other+L_close. L_new is the actual new material/service/provider/work/treatment burden addition before stock-consumption correction. L_open/close cover raw/WIP or genuinely unused/unassigned stores/service charges, never already first-accepted FG or performed service. Already stock-corrected consumption uses a reconciled equivalent ledger without opening/closing correction again. Own foreground/WIP history and provider aggregates versus included expanded inventories are not added twice. Ordinary waste/sample/reject sales do not create a real other function or automatic burden transfer. Physical stocks/transfers stay independent."
      source_ids: []
    - rule_id: system_boundary_rule_18
      applies_to: "foreground_system_boundary"
      rule: "Keep three ledgers for every shared treatment/asset/packaging event: the one full actual receiver transfer Qt and complete actual provider quantity recorded once; independently known component/physical-cohort provenance; and distinct evidenced nonoverlapping environmental/treatment-service vectors per served original cohort in compatible provider units. Qt/Qanalysis is physical disclosure on a declared positive observation basis only; modeled demand uses attributable A/original Q0 or actual service A_h/original Qc. Never recharge full shared Qt to every cohort or shrink physical export by service shares. Unknown assignment remains unresolved; service shares and physical component origin are different evidence."
      source_ids: []
    - rule_id: system_boundary_rule_19
      applies_to: "foreground_system_boundary"
      rule: "One contaminated tuck box/carton/film/pallet/cloth/filter waste is the whole actual wet receiver quantity including substrate, retained ink/glue/cleaner/residue and water once. Dry substrate and retained contents are nested nonadditive subledgers, not extra attached-material exports or repeated treatment demand unless truly separated before the boundary. Actual separately collected trim/ink/effluent streams remain distinct; mixed-only origins are children of one real mixed outlet. Full actual fleets/stocks/receiver/provider quantities do not shrink with service attribution."
      source_ids: []
    - rule_id: system_boundary_rule_20
      applies_to: "foreground_system_boundary"
      rule: "For each real same-unit whole-wet package pool use O+P+I+ER+J_in+H2O_in=C+S_filled+EO_empty+W_whole+J_out+H2O_out. P separate purchase and I supplier-included ingress are disjoint. ER is an actual inward returned article with real empty/filled state; if filled, match net contents and packaging component inside one full receipt. S is actual filled outward shipment including real returned contents; EO only empty outward to supplier/other recipient. J and H2O are independently measured disjoint actual repair/retained increments and departures. X_in/out only reconcile duplicate OTHER same-side constituent terms before this balance, never another positive physical influx/outflux, actual P/I/ER, wet C, opposite leg or genuine retained water. Substrate-only balances link to whole contaminated W through composition, not forced equal mass. Returns create no new Q/cofunction/credit."
      source_ids: []
    - rule_id: system_boundary_rule_21
      applies_to: "foreground_system_boundary"
      rule: "Synthetic checks only, not an empirical fraction/lifetime/default: one 10kg contaminated filter containing8kg substrate+2kg retained material serves old/new cohorts; receiver/provider quantity is10kg once. Independently evidenced hypothetical25%/75% compatible-unit treatment service gives2.5/7.5kg-equivalent modeled vectors, and original Qnew100kg/Qold200kg gives0.025/0.0375kg-equivalent per kg reference. Not2.5kg physical export and not full10kg demand again for both. A separate package check O2+P3+I1+ER4+actual retained1=C3+S4+EO2+wholeW2=11kg uses Wsubstrate1+retained1 nested once. Actual counts need independent records; no kg/item or installed filter inferred."
      source_ids: []
    - rule_id: system_boundary_rule_22
      applies_to: "foreground_system_boundary"
      rule: "Preserve exact native electricity Net calorific value / 净热值, 低位热值 and energy-unit-group MJ. kWh times3.6 is electrical unit conversion only, not fuel calorific value or boiler evidence. This selected supply is CN grid-average to user at1–35kV, not a default low-voltage or European factory mix. Genuine on-site voltage conversion/utility production and losses remain in actual complete producers. Every actual combustion/treatment/steam/condensate operation requires its full real material/air/water/species/fuel/heat interfaces and provider convention; no assumed burner, fixed dryer or paper outsourcing."
      source_ids: []
    - rule_id: system_boundary_rule_23
      applies_to: "foreground_system_boundary"
      rule: "The ink identity admits only an actual whole non-water-dissolved solvent/oil-based planographic preparation satisfying all native comments and grade/setting evidence, not water-based or UV/EB formulations by use-name alone. Each actual colour/SKU is separate; carrier/assay constituents are children, not duplicate purchases. The corn-starch identity is only actual whole unmodified corn/maize-starch powder with the native route/form; coated/modified/blended anti-setoff products need their own whole identity, never pure starch as proxy. Native moisture/sulfite examples and odd broad synonym strings do not supply recipes or measured moisture. Molecular gases require actual CAS/phase/origin/medium and independent speciation, not isotope/charcoal aliases or COD/VOC/NOx totals."
      source_ids: []
    - rule_id: system_boundary_rule_24
      applies_to: "foreground_system_boundary"
      rule: "Preserve complete primary limits: Fournier distinguishes paper stock with actual opaque-glue/varnish construction from100%PVC, describes cutting and whole-deck QC, and makes55-card/12-check/performance claims that are not universal acceptance or recipe defaults. Do not infer supplied prevarnished stock versus actual postprint coating from a finished construction sentence without actual supply evidence. Cartamundi pages describe capabilities; its guide dimensions/bleeds/radii/CMYK coverage are design examples, not mass or chemical recipes or current legal certification. PrintNinja describes both rotary combined cutting/rounding and separate trim/smooth-round operations, optional linen embossing before cut, concurrent collation, real tuck-bottom glue/assembly/sealing and shrink heat. These alternatives are not simultaneously mandatory or quantitative independent factory LCI. Retain each actual operation and separate genuine make/buy providers once. Sources: cartamundi-production;cartamundi-solutions;cartamundi-guide;cartamundi-uk;fournier-quality;printninja-card-production."
      source_ids: []
    - rule_id: system_boundary_rule_25
      applies_to: "foreground_system_boundary"
      rule: "EPA2006 is historical printing guidance: plate→blanket→substrate, conventional sheetfed absorption/oxidation versus heatset evaporation or radiation cure, and distinct ink/fountain/cleaning sources. Its retained/emitted percentages, alcohol shares and control/legal thresholds are not actual factory values or current obligations here. Keep whole formulations, true setting/reaction evidence, actual phase water and identified molecules independent; an unestablished essential matrix procedure remains a concrete-study hold. ILCD applies only in a justified attributional allocation-needed setting: subdivision/virtual subdivision and exchange-specific determining causality precede residual actual common-gate values. No recycling/QFD credit or future-SOP/checkpass waiver. Sources: epa-offset-2006;ilcd-allocation-2010."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual complete supplied unprinted card stock and separate auxiliaries/utilities cross the plant gate; outsourced intermediate full history is retained with no duplicated in-house route"
  starting_condition_role: "foreground_collection_gate"
  product_classification_scope: "CPC 3.0 38570 physical paperboard-deck subset; the terminal is a complete collated net deck"
  recursive_input_rule: "A bought complete deck is not raw card stock; repacking creates neither manufacture nor new Q. Actual original-cohort returns retain gross legs/history and equal internal handoffs cancel"
  upstream_dataset_requirement: "Each actual whole stock/preparation/plate/packaging supply, utility, delivery and treatment matches form/route/state/unit/geography; upstream once"
