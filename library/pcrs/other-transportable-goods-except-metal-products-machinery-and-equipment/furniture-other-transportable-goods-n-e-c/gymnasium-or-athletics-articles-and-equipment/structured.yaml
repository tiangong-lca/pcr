allocation_rules:
  - rule_id: a_avoid
    applies_to: "all inventory rows"
    rule: "For attributional multifunctionality, first separate dedicated operations and exchanges, then real or virtual subdivision. Assign each embodied casting/coating and directly metered exchange to its actual function. Demonstrate determining physical causality separately for remaining exchanges, including actual operating duration with the physical determinant when relevant; neither mass nor price is a freely selectable universal key."
    source_ids:
      - ilcd-2010-attributional
  - rule_id: a_residual
    applies_to: "all inventory rows"
    rule: "Only the demonstrably unresolved residual common process uses contemporaneous market values of actual co-functions in their real technical condition and at the common process gate. Retain price period, quantity, quality, treatment of negative values and sensitivity. No fixed fraction, automatic scrap coproduct, avoided-product credit or automatic burden subtraction for ordinary waste/reject shipment/sale. Transfer a vector once only for a real separate cohort/function and a justified allocation/handover decision; all physical gross legs stay complete."
    source_ids:
      - ilcd-2010-attributional
  - rule_id: a_capital
    applies_to: "all inventory rows"
    rule: "Capital machines, fixtures and maintenance have full new/used/installed/removed/disposed physical ledgers and separate historical burden stocks. Allocate actual service draw by documented exchange-specific determinants and period; no fixed lifetime or purchase of one whole grinder per kg. Gross asset/packaging/water V is never stock-corrected or economically shrunk. Already performed service for original-cohort held FG stays charged; installed fluids and new/removed parts remain atomic and disjoint from whole-asset mass."
    source_ids:
      - ilcd-2010-attributional
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "finish"
      flow_role: "Unique first whole-article release"
      record_type: "foreground_record"
      raw_fields: "article id; configuration; casting grade; coating identity; net mass; tare; scale calibration; first release timestamp; acceptance tests; failed sample and reject dispositions; original cohort Q_H"
      collection_method: "Weigh each complete accepted article on a calibrated scale excluding transport packaging. Reconcile first release identity and manufacturer tests; count sales pairs as two actual articles. Preserve all rejects and failures independently."
      unit: "kg"
      frequency: "Each actual event and closing reconciliation"
      temporal_coverage: "Whole declared cohort; include zero-output and observed original-cohort H"
      site_scope: "Actual supply/manufacturing/service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw signed records; calibration; state; identities; independent reconciliation; no invented values"
    - protocol_id: cp_manufacture
      process_id: "finish"
      flow_role: "Every manufacturing exchange and inherited vector"
      record_type: "foreground_record"
      raw_fields: "row id; native unit and meter state; undivided receipt/use/export; event and batch; original cohort; opening/closing raw; WIP; non-WIP unused/unassigned stores; per-exchange inherited burden vectors; already-stock-corrected flag; supplier includes; gas species and phase; all failures; actual permission and disposition"
      collection_method: "Use calibrated meters/scales and supplier records for each atomic event; record source-unit rates versus integrated quantities and independently measured state-specific density. Retain all failed/idle/cleanup/test/rework raw records and real extra materials, emissions and exits. Physical wet stocks and element assays are independent observations."
      unit: "native extensive unit per row"
      frequency: "Each actual event and closing reconciliation"
      temporal_coverage: "Whole declared cohort; include zero-output and observed original-cohort H"
      site_scope: "Actual supply/manufacturing/service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw signed records; calibration; state; identities; independent reconciliation; no invented values"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "Original-cohort actual service and water/energy ownership"
      record_type: "foreground_record"
      raw_fields: "row id; original cohort; Q_H; observed H; gross V_H; attributable undivided service vector; opening/closing FG mass and inherited vectors; internal handoff; actual gross dispatch; return identity and mass; actual new water/parts/loss; permission; postwork tests; hold/waste; carrier mass and enthalpy; provider agreement"
      collection_method: "Measure every actual post-release event including ordinary sorption/evaporation and unauthorised/rejected work. Trace cohort history and actual performed service; do not delete held-FG service or create new release. Supplier heat/water/return ownership and physical state are independently documented. Future unobserved horizons remain unknown."
      unit: "native extensive unit per row"
      frequency: "Each actual event and closing reconciliation"
      temporal_coverage: "Whole declared cohort; include zero-output and observed original-cohort H"
      site_scope: "Actual supply/manufacturing/service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw signed records; calibration; state; identities; independent reconciliation; no invented values"
    - protocol_id: cp_pack
      process_id: "service"
      flow_role: "Separate packaging pools and six physical directions"
      record_type: "foreground_record"
      raw_fields: "pool; event; material and supplier; P; I; ER; gross S; EO; W; opening/closing empty; attached WIP; attached FG; reusable stock; CP actual repair/water changes; whole/component bridge; moisture; gross native V; upstream owner; original Q_H; H"
      collection_method: "Measure each pool and direction separately. Opening + P + I + ER + CP_in = closing + gross S + EO + W + CP_out with full wet masses; CP is real component/water change only, paired and disjoint from article legs. P/I whole article includes components and supplied water once. X_in/out only remove overlap with other same-side flow terms, never stocks. Keep independently measured origin W when one mixed outlet is the only export; do not add total and origins. No reuse credit or artificial purchase."
      unit: "kg"
      frequency: "Each actual event and closing reconciliation"
      temporal_coverage: "Whole declared cohort; include zero-output and observed original-cohort H"
      site_scope: "Actual supply/manufacturing/service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw signed records; calibration; state; identities; independent reconciliation; no invented values"
    - protocol_id: cp_assets
      process_id: "finish"
      flow_role: "Gross assets/parts/fluids and separate actual service burden"
      record_type: "foreground_record"
      raw_fields: "asset id; new/used receipts; installed/removed parts; each fluid; full physical wet opening/closing mass; actual transfers and scrap; inherited burden stock; actual service use; unused/unassigned charge; true determinant; period; function; vector ownership; X_in; X_out"
      collection_method: "Record complete gross physical assets without economic scaling; maintain independent full historical provider-vector stock and actual service draw using justified determinants. Installed fluids and new/old repair parts have disjoint whole/component bridges. Retained new water/material influx and full wet closing stock both remain. Do not purchase a complete asset again for every unit of output."
      unit: "kg"
      frequency: "Each actual event and closing reconciliation"
      temporal_coverage: "Whole declared cohort; include zero-output and observed original-cohort H"
      site_scope: "Actual supply/manufacturing/service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw signed records; calibration; state; identities; independent reconciliation; no invented values"
    - protocol_id: cp_assets_service
      process_id: "service"
      flow_role: "Gross assets/parts/fluids and separate actual service burden"
      record_type: "foreground_record"
      raw_fields: "asset id; new/used receipts; installed/removed parts; each fluid; full physical wet opening/closing mass; actual transfers and scrap; inherited burden stock; actual service use; unused/unassigned charge; true determinant; period; function; vector ownership; X_in; X_out"
      collection_method: "Record complete gross physical assets without economic scaling; maintain independent full historical provider-vector stock and actual service draw using justified determinants. Installed fluids and new/old repair parts have disjoint whole/component bridges. Retained new water/material influx and full wet closing stock both remain. Do not purchase a complete asset again for every unit of output."
      unit: "kg"
      frequency: "Each actual event and closing reconciliation"
      temporal_coverage: "Whole declared cohort; include zero-output and observed original-cohort H"
      site_scope: "Actual supply/manufacturing/service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw signed records; calibration; state; identities; independent reconciliation; no invented values"
  calculation_rules:
    - id: attributable_raw
      applies_to: "all inventory rows"
      rule: "For burden-bearing manufacturing dimensions only: A = B_open + U - B_close - T_other, after source-unit conversion and the justified exchange-specific allocation. B_close is limited by b_stocks. T_other requires a real separate function/cohort and justified single transfer, never ordinary waste sale. Already-net consumption is not corrected again. Gross physical rows do not use this equation."
      inputs:
        - B_open
        - U
        - B_close
        - T_other
        - cp_manufacture
        - cp_assets
      output: "A"
      source_ids:
        - ilcd-2010-attributional
    - id: service_raw
      applies_to: "all inventory rows"
      rule: "For actual post-release burden only: A_H is the actual service vector performed for the original released cohort during observed H, plus any properly inherited service draw and actual incremental work/treatment, after justified exchange-specific attribution. Carry only unused/unassigned service stock; do not subtract closing FG or ordinary waste/sale. Gross V_H remains a separate full physical channel."
      inputs:
        - cp_service
        - cp_assets_service
        - cp_pack
        - Q_H
        - H
      output: "A_H"
      source_ids:
        - ilcd-2010-attributional
    - id: single_quotient
      applies_to: "all inventory rows"
      rule: "Exactly once: a = N / D. For manufacturing burden rows N=A and D=Q; for physical gross rows N=the complete actual gross leg V and D=Q. Post-release burden rows use N=A_H and D=Q_H; post-release gross rows use complete actual V_H and D=Q_H. Native numerator unit is retained per kg. Cards and aggregation labels cite this same a without further division, stock correction or economic scaling of V. D=0 retains records without unit result."
      inputs:
        - N
        - D
        - cp_release
        - cp_manufacture
        - cp_service
        - cp_pack
        - cp_assets
      output: "a"
      source_ids:
        - ilcd-2010-attributional
    - id: gross_pack_balance
      applies_to: "all inventory rows"
      rule: "Each pool: opening + P + I + ER + CP_in = closing + gross S + EO + W + CP_out. CP contains only actual disjoint repair components or water-state exchanges. Whole wet P/I and their components are not added together. Internal reuse cancels and creates no new Q, purchase, burden or credit."
      inputs:
        - P
        - I
        - ER
        - S
        - EO
        - W
        - CP_in
        - CP_out
        - cp_pack
      output: "closed_pool_ledger"
      source_ids:
        - ilcd-2010-attributional
  data_quality_requirements:
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Complete terminal and route; every raw table cell/card field/qualifier/source/native limitation survives projection; all real atoms, failed/zero-output periods and stock vectors present. Unresolved actual data are gaps rather than zero."
      evidence: "BOM; supplier boundary; actual tests; material and gas assays; raw ledgers; bilingual rule correspondence"
    - id: dq_uncertainty
      applies_to: "all inventory rows"
      requirement: "Disclose measurement uncertainty, unresolved provider/auxiliary identity, period/site coverage, density/state evidence, unobserved future service horizons and actual allocation sensitivity. Engineering consistency is not scientific or translation approval."
      evidence: "Calibrations; actual records; explicit missing fields and review needs"
validation_rules:
  - rule_id: v_terminal
    applies_to: "all inventory rows"
    rule: "Verify complete integral-grip dumbbell terminal, actual supplied casting route, coating specification and native role/material/form/type/geography/property compatibility on every selected row. Inspect cracks/pinholes, edge/grip, mass, coating and actual required tests under the manufacturer specification; do not infer a load rating, drop height, lifetime or certification from this PCR. Core reference identity is mandatory; auxiliary gaps and missing factory quantities remain explicit, never zero."
    source_ids:
      - vic-dumbbell-process
      - goldens-dumbbell-spec
  - rule_id: v_accounting
    applies_to: "all inventory rows"
    rule: "Reconcile unique Q, all failures/Q=0, raw/WIP/non-WIP inheritance vectors, gross physical gates, six-direction packaging, new/removed repair parts, natural and operational water phases, actual gas species and energy-provider ownership. Gross cards use V only; burden cards use attributed raw vectors only. No component/whole, total/origin, internal/external, provider/carrier, or already-net stock duplication."
    source_ids:
      - ilcd-2010-attributional
  - rule_id: v_units
    applies_to: "all inventory rows"
    rule: "Check each native extensive property, source-unit conversion and exact observed state before normalisation. Integrated volume is not multiplied by time; only a true rate is integrated. Independent measured state-specific density supports mass conversion. No nominal dumbbell weight or secondary property coefficient supplies actual mass/density. One quotient is executed once, and Q=0 is not a unit result. Unsupported or missing actual relationships remain unresolved."
    source_ids:
      - ilcd-2010-attributional
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Specified first-release product inventory with separately disclosed observed original-cohort gate services"
  allowed_use: "Attributional modelling only after actual applicability, inventories and quality verification"
  excluded_use: "Whole CPC coverage; training performance/lifetime comparison; equipment sets; net delivery without historical reversal bridge; unobserved factory numbers; automatic credit or scientific approval"
  required_metadata: "complete single fixed-weight article with integral cast grip and both ends; actual drawing and shape; actual cast-iron grade and supplied blank state; supplier geography and upstream boundary; actual liquid coating formulation and complete coating state; grip and edge condition; manufacturer acceptance specification and actual test records; unique first-release cohort and release time; calibrated complete net masses excluding packaging; raw and WIP inheritance vectors; packaging pools and water states; original-cohort service horizon and denominator"
  required_quality_disclosure: "Actual source/provider and native identity compatibility; measurement uncertainty; all unresolved rows; first release versus observed service H; physical and burden ledgers separately"
  update_trigger: "Changed complete structure, casting supply state, principal coating, geography/identity restrictions, acceptance spec, upstream route, actual new flow or revised evidence"
