system_boundary:
  rules:
    - rule_id: b_start
      applies_to: "all inventory rows"
      rule: "Use the supplied uncoated casting boundary and retain its real upstream foundry inventory once. Each actual additional chemical, fuel, water phase, abrasive, packaging article, fluid, asset and waste outlet is an atomic exchange. Supplier-included packaging is a real ingress with one upstream owner, not an omission or another purchase. No generic other-material zero bucket is allowed."
      source_ids:
        - vic-dumbbell-process
        - athy-casting-finish
    - rule_id: b_q
      applies_to: "all inventory rows"
      rule: "Q is newly first-released complete net kg, including that cohort left in closing FG. Reinspection, delivery, returned goods and permitted or failed rework never create another Q for the same article. Keep every failure, sample, start/stop, idle, cleanup and rework load. At Q=0 retain raw loads and dispositions but issue no unit result. Do not reduce manufacturing burdens merely because ordinary rejects/waste/samples are sold or sent away."
      source_ids:
        - vic-dumbbell-process
        - ilcd-2010-attributional
    - rule_id: b_stocks
      applies_to: "all inventory rows"
      rule: "Maintain independent physical wet opening/closing stocks for raw materials, WIP, unassigned non-WIP stores, installed fluids/assets and finished goods, with each exchange-specific inherited burden vector. Manufacturing B_close contains only raw/WIP and unused/unassigned non-WIP burden, never already released closing FG or already performed services. If raw consumption is already stock-corrected, do not correct it again. Newly entering water/material retained in closing stock remains an actual influx; full closing wet mass remains too."
      source_ids:
        - ilcd-2010-attributional
    - rule_id: b_physical
      applies_to: "all inventory rows"
      rule: "Close physical mass and relevant measured Fe/C/H/O or other element ledgers independently of burden allocation. Manufacture uses actual external receipts and opening stocks versus newly released output, actual rejects/waste/gases and closing unreleased/raw stores. The FG/service gate bridges opening FG plus first-release handoff and real returns to gross dispatch, closing FG, actual damage/waste and real water/material changes. On consolidation cancel only paired internal handoffs; never add Q and its released closing FG as two products. Gross mass is never multiplied by economic share. Reaction, free, vapour, condensate and structural water require independent evidence; no residual fits two unknowns. COD/VOC/NOx/element totals are not molecular masses."
      source_ids:
        - ilcd-2010-attributional
    - rule_id: b_service
      applies_to: "all inventory rows"
      rule: "Actual post-release services stay with their original first-release cohort Q_H and observed horizon H; do not use current unrelated Q or delete performed work because FG is held. Carry forward only genuinely unused/unassigned service or charges with their full vectors. Actual post-release repair needs manufacturer/specification permission plus postwork tests, acceptance and disposition before continued qualification is claimed. Missing permission or failed acceptance never erases already incurred unauthorised/failed work, material or waste; keep hold/disposal and original-cohort burden. Ordinary humidity exchange needs no invented repair event. A net-delivery study requires a different complete historical gross-dispatch/return/original-delivery reversal bridge, not this first-release denominator."
      source_ids:
        - goldens-dumbbell-spec
        - ilcd-2010-attributional
