  ordinary_gaps:
    raw_cotton_identity: Search returned formally woven cotton fabrics despite raw-cotton classification/comments;
      rejected as lint. Keep specific ginned uncarded cotton input unbound.
    other_atomic_identities: Unbound concrete cards remain listed by row_id; observed searches and failures are
      retained externally. Actual supply/composition/receiver records remain data-production requirements, not invented
      values.
    supplier_records: Verify real cotton origin, noil specification, contaminants and moisture, meter geography/voltage,
      component composition, product/waste status, allocation and original-cohort stock/service history.
  true_holds: []
  deduplication:
    checked_reference_material_count: 1317
    separate_upstream_reference_material_count: 1476
    decision: Retain original identity for a narrower comber-noil spinning-feedstock boundary. Cotton-carded-or-combed
      explicitly excludes cotton waste sold as such and its noil is only a co-output. Cotton linters start from
      cottonseed delinting. Dry-combed-wool-noils use a different animal fibre. No upstream changes adopted.
  native_identity_limits:
    core: Generic Product flow at plant with unspecified treatment, restricted in every card to the appropriate
      cotton-residue stage; first-release noil requires actual spinning acceptance.
    cotton_fabric: Only woven cloth packaging. Formal fabric name and synonyms prevail; isolated raw-cotton classification/general
      comment disclosed. Never used as raw cotton.
    electricity: CN grid-average consumption below 1 kV only; compatible provider required.
    wire: Cylindrical flexible non-alloy steel wire; no flat strapping or generic metal substitution.
    water_vapour: Ordinary H2O CAS 7732-18-5 emitted to unspecified air; isotope synonym noise not adopted.
