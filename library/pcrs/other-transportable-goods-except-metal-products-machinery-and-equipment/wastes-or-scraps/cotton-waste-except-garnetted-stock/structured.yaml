allocation_rules:
  - rule_id: a_subdivide
    applies_to: "joint_combing_and_shared_services"
    rule: "This PCR chooses attributional supply modelling for functional spinning feedstock. First assign dedicated noil collection, cleaning, testing and packaging directly; subdivide or virtually subdivide separable preparation, combing and services using quantitative process knowledge and submeter records. Identify joint cotton/combing burdens that actually remain shared with long combed sliver and other valuable outputs."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_causality
    applies_to: "each_remaining_exchange"
    rule: "For each remaining exchange test the determining physical causal relationship to each co-function; justify the chosen driver and measure it. Mechanical material throughput may determine conveying demand; combing required for long-sliver quality does not become noil-caused solely because noil mass exists. Do not apply a single mass share to every flow, and do not substitute correlation or a yield ratio for determining causality."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_residual_value
    applies_to: "genuinely_unresolved_joint_inventory"
    rule: "Only genuinely remaining joint exchanges use contemporaneous representative market values at the same joint process gate and actual state. Document values and quantities for every valuable co-output and a sensitivity check. Back out separately incurred noil cleaning, baling, packaging and freight from later delivered prices. No fixed share, free choice between physical and economic allocation, avoided-virgin-cotton credit or default substitution is allowed."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_status
    applies_to: "product_waste_and_receiver"
    rule: "Record actual legal status, ownership transfer, receiver acceptance, destination and functional use. The reference is a Product flow supply of accepted noil; waste treatment services require a separate suitable reference and cannot be represented by a negative noil supply. For each physical fibre quantity choose product transfer or discarded waste exclusively. Negative-value waste and end-of-life recovery require explicit true-joint-process/zero-value boundary assessment under ILCD; do not import that treatment scenario into this valuable production-residue supply."
    source_ids:
      - usitc-comber-1990
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "preparation"
      flow_role: "gross cotton and co-output transfers plus inheritance"
      record_type: "scale tickets and process-lot register"
      raw_fields: "row_id; gate; lot; input state; gross V; dry cotton; free water; measured trash; contamination; opening WIP; closing WIP; unused non-WIP; inherited vector; receiver"
      collection_method: "Calibrated net weighing with tare; matched moisture/contaminant samples; link each combing line and separate co-output; no borrowed yield collect unnormalized V and inherited vectors; apply calc_stock then calc_allocate then calc_normalize once for per 1 kg reference flow"
      unit: "kg"
      frequency: "each lot and shift"
      temporal_coverage: "whole production cohort including all failures and Q0"
      site_scope: "all manufacture gates including noil_release"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; stock reconciliation; traceability; sampling results"
    - protocol_id: cp_release
      process_id: "noil_release"
      flow_role: "first quality release"
      record_type: "release certificates and weights"
      raw_fields: "cohort_id; lot_id; first_release_id; Q; net fibre mass; tare; moisture; fibre purity; length; trash; neps; oil; spinning receiver specification; accepted status; failed quantity; closingFG included"
      collection_method: "Unique first-release event and calibrated net fibre scale; compare sampled properties with declared spinning specification; do not assume medical purity sum newly first released Q once including same-cohort closingFG; retain raw totals; unit row1kg references calc_normalize"
      unit: "kg"
      frequency: "each first release"
      temporal_coverage: "complete cohort once"
      site_scope: "noil release gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "release signature; customer acceptance; scale and laboratory records"
    - protocol_id: cp_energy
      process_id: "preparation"
      flow_role: "stage energy and shared services"
      record_type: "meters and operation logs"
      raw_fields: "row_id; process_id; voltage; geography; provider; readings; raw kWh; integrated amount; rate; duration; idle; cleanup; allocation driver"
      collection_method: "Submeter all three stages and reconcile invoices; distinguish integrated meter reading from power rate; use causal driver only after subdivision retain raw readings and units; calc_units then calc_allocate then calc_normalize once for per 1 kg reference flow"
      unit: "kWh; MJ"
      frequency: "continuous with shift and invoice reconciliation"
      temporal_coverage: "production and post-release service periods linked to original cohorts"
      site_scope: "preparation; noil_release; services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; invoices; voltage evidence; complete runtime log"
    - protocol_id: cp_environment
      process_id: "noil_release"
      flow_role: "each solid reject and particulate outlet"
      record_type: "waste tickets and environmental sampling"
      raw_fields: "row_id; stage; source partition; waste status; receiver; opening bin; closing bin; gross mass; moisture; measured composition; outlet flow; temperature; pressure; sampling duration; actual particulate concentration; air medium"
      collection_method: "Weigh separately collected streams; characterize mixed total without adding its partitions; match environmental sampling to actual exhaust flow and time; no occupational-to-emission conversion raw mass and rate/integrated volume remain unnormalized; calc_units then calc_allocate then calc_normalize once for per 1 kg reference flow"
      unit: "kg; m3; h; mg/m3"
      frequency: "each removal plus representative operating states"
      temporal_coverage: "all runs including startup shutdown idle and failures"
      site_scope: "preparation; noil_release; services and each outlet"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling report; calibration; receiver acceptance; total/partition reconciliation"
    - protocol_id: cp_water
      process_id: "noil_release"
      flow_role: "actual humidification water and its exits"
      record_type: "water meters humidity and purge records"
      raw_fields: "row_id; ordinary H2O; supply amount; fibre moisture inlet/outlet; inlet/outlet humidity; actual airflow; temperature; pressure; net vapour; liquid purge; opening/closing water stock; density method"
      collection_method: "Measure each water path independently; evaluate actual humidification equipment and moisture change; any integral already reported is used once; no reaction water inferred retain unnormalized water balance; calc_units then calc_allocate then calc_normalize once for per 1 kg reference flow"
      unit: "kg; m3; h"
      frequency: "each shift and material lot"
      temporal_coverage: "same cohorts and water service period"
      site_scope: "actual humidification and its liquid/air outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated meter; humidity sample; purge analysis; independently measured density if needed"
    - protocol_id: cp_service
      process_id: "services"
      flow_role: "FG storage returns and gross dispatch"
      record_type: "cohort FG and shipment ledger"
      raw_fields: "row_id; cohort_id; original Qc; H; S; openingFG; closingFG; inherited vector; external return; original delivery reversal; real incremental rework; service electricity; rejects"
      collection_method: "Link each movement to original first-release cohort; record physical outward/return separately and reconcile all historical burdens keep raw H/S/stocks and histories; apply calc_service then same calc_normalize once using original Qc for per 1 kg reference flow"
      unit: "kg; MJ; h"
      frequency: "each movement and stock period"
      temporal_coverage: "whole original cohort service period including future settlement"
      site_scope: "FG store packing and dispatch gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "dispatch/return ticket; original cohort link; burden carry-forward and settlement"
    - protocol_id: cp_packaging
      process_id: "services"
      flow_role: "one row per packaging component and movement"
      record_type: "component receipts issues returns and stock register"
      raw_fields: "row_id; component; inlet/outlet role; cohort; opening empty; opening attached WIP; opening attached FG; opening reusable; P; I; ER; S; EO; W; closing empty/attached/reusable; actual composition; supplier; net kg"
      collection_method: "Weigh each component and movement; reconcile b_packaging separately for cotton cloth jute cloth steel wire and PP strap; retain inlet bale wrapping history and outbound gross attachments retain unnormalized P/I/ER/S/EO/W and stocks; calc_packaging then calc_allocate then calc_normalize once for per 1 kg reference flow"
      unit: "kg"
      frequency: "each receipt movement and closing stock"
      temporal_coverage: "production and full original-cohort service period"
      site_scope: "all three process gates with component ownership"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "component scale; composition certificate; purchase/return tickets; complete stock reconciliation"
  calculation_rules:
    - id: calc_units
      applies_to: "all inventory rows"
      rule: "Convert each raw measurement in its own unit before allocation:1kWh=3.6MJ;1t=1000kg. Integrate true rates once over measured duration; do not reintegrate cumulative quantities. Use independently measured substance/state density only for a required volume-to-mass conversion. Preserve gross V unchanged by allocation."
      inputs:
        - raw_measurements
        - unit_factors
        - rate_or_integral
        - substance_state_density
      output: "converted_raw_vector"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_stock
      applies_to: "manufacture and unused input stocks"
      rule: "For each actual material and each inherited exchange vector reconcile opening WIP + newly introduced material = closing WIP + first-release output + separately identified co-outputs + actual rejects/releases. Reconcile unused non-WIP supplies separately: opening + receipts = closing + actual issues + outward returns. Apply only unposted corrections; already net issues are not corrected twice. Keep water and measured contamination partitions nonadditive to whole mass."
      inputs:
        - gross_V
        - opening_WIP
        - closing_WIP
        - unused_nonWIP
        - inherited_vectors
        - new_receipts
        - issues
      output: "cohort_raw_vectors"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_allocate
      applies_to: "all inventory rows"
      rule: "Assign dedicated/virtually subdivided vectors first; for each remaining exchange use documented determining physical causality under a_causality; only the genuine remainder follows a_residual_value at the same joint gate. Retain all co-function vectors and reconcile their sum to the unallocated vector. A is the attributable unnormalized numerator after unit conversion and stock inheritance; it is not gross physical V."
      inputs:
        - cohort_raw_vectors
        - dedicated_vectors
        - causal_drivers
        - same_gate_values
      output: "A"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_service
      applies_to: "services"
      rule: "Reconcile openingFG + first-release receipt + external fibre returns = closingFG + gross fibre shipments + actual service rejects/releases with original inherited vectors. Reverse the original delivery for returns without erasing history and add only real incremental rework. Assign all service loads to original cohort Qc; H and S are activity records. For overlapping periods retain cohort-specific carry-forward and later settlement. Internal transfers and history cancel in the combined model."
      inputs:
        - original_Qc
        - opening_FG
        - closing_FG
        - gross_shipments_S
        - returns
        - inherited_vectors
        - incremental_service
      output: "cohort_service_A"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_packaging
      applies_to: "each packaging component"
      rule: "Apply the full component balance in b_packaging to each card. Distinguish new purchases P, external returns received ER, gross outward attachment S, outward external-owner return EO and waste W. Internal reuse I cancels; no material is purchased twice. Maintain inbound and outbound ownership history without adding packaging to net noil Q."
      inputs:
        - P
        - I
        - ER
        - S
        - EO
        - W
        - opening_component_stocks
        - closing_component_stocks
      output: "component_raw_vectors"
      source_ids:
        - usitc-comber-1990
        - ilcd-attributional-2010
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "n=A/Q; A is the attributable unnormalized exchange numerator for the first-release cohort; Q is its newly first released net noil kg. This is the only division: cards and collection aggregation reference this same result. For services use the original cohort Qc in this same operator after calc_service; H is never a denominator. The first_release_noil row is 1 kg. If the applicable denominator Q (or original Qc for services) is zero retain the actual burdens without a unit result."
      inputs:
        - A
        - Q
        - original_Qc
      output: "n per 1 kg reference flow"
      source_ids:
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_trace
      applies_to: "all rows"
      requirement: "Link real operating records and gross quantities to a common lot/site/period; include every idle failed and Q0 state. No fabricated plant values or transferable supplier ranges."
      evidence: "production and stock ledgers; calibrated measurements"
    - id: dq_native
      applies_to: "UUID-bearing rows"
      requirement: "Use official Chinese displays and complete per-card restrictions. Exact flow/property/unit chain is identity evidence only; verify each actual supplier and composition separately. Missing raw-lint and auxiliary UUIDs stay concrete and explicit."
      evidence: "native identity records and supplier evidence"
    - id: dq_scope
      applies_to: "source support"
      requirement: "USITC1990 describes the route and unbleached uses; it is not a current legal ruling or modern inventory. G P supplier claims identify commercial noil and neighbours only. BREF broader wool/synthetic lubricant examples do not establish cotton oil dosage. ILCD is generic attributional method, not a noil plant measurement."
      evidence: "full source context and actual applicability assessment"
    - id: dq_uncertainty
      applies_to: "unit result and services"
      requirement: "Disclose measurement uncertainty, incomplete supplier identity, causal-allocation support, stock inheritance, source/geographic mismatch and service-cohort settlement. Do not claim clinical purity, a universal yield or complete LCIA characterization."
      evidence: "uncertainty log; allocation sensitivity; cohort carry-forward"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference_and_all_bound_exchanges"
    rule: "Verify noil origin at the comber and actual spinning-feedstock acceptance. Enforce each native basename, form, route, geography, medium, type, CAS where present and reference property. Generic cotton-waste identity alone does not certify a noil grade or legal status. Reject fabric as ginned cotton, carded sliver as noil, linters as noil, and garnetted material as ungarnetted noil."
    source_ids:
      - un-cpc3-2025
      - usitc-comber-1990
      - gp-comber-noil
  - rule_id: v_quantity
    applies_to: "production_service_and_consolidation"
    rule: "Reconcile full gross mass and separate dry cotton, free moisture, measured plant matter, contamination and actual auxiliaries at manufacture, FG/service and combined gates. Q includes closingFG once. Keep whole failed/zero-output campaigns and opening/closing WIP and unused non-WIP inheritance. Internal transfers cancel exactly; two unknown losses cannot be fitted from one residual. No reaction or structural-water production is inferred for mechanical separation."
    source_ids:
      - usitc-comber-1990
      - ilcd-attributional-2010
  - rule_id: v_once
    applies_to: "all_inventory_rows"
    rule: "Trace raw measurements through unit conversion and allocation to A, then apply calc_normalize exactly once. Collection and aggregation retain unnormalized records. Cards consume that result; no second division. Q0 keeps burdens with no unit result. Services use original Qc, never H; returns preserve original history and record only real incremental rework."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_emissions
    applies_to: "air_water_and_waste"
    rule: "Environmental exhaust requires measured outlet conditions and flow with actual particulate sampling; workplace exposure is not an emission factor. Integrate a true rate once; an already integrated volume is not multiplied by time again. Independently measure substance-specific density at actual temperature/pressure when needed. Do not derive chemical species from COD, total VOC or a mass-balance residual. Report captured solids separately from atmospheric releases and treatment links once."
    source_ids:
      - jrc-textiles-2023
      - ilcd-attributional-2010
  - rule_id: v_packaging
    applies_to: "every_packaging_card"
    rule: "Check each component balance P/I/ER/S/EO/W including empty, WIP-attached, FG-attached and reusable opening/closing stock. Shipment packaging follows gross physical dispatch including returns/redelivery; it does not change net fibre Q. Check recovered old packaging is not repurchased and no automatic material credit is issued."
    source_ids:
      - usitc-comber-1990
      - ilcd-attributional-2010
  - rule_id: v_complete
    applies_to: "dataset_before_use"
    rule: "Verify current projection, all required qualifiers, sources, protocols, allocation evidence and all conditional actual exchanges. Missing operating records require collection; missing auxiliaries remain explicit identity gaps. An unresolved core reference identity or unresolved core route/terminal quality makes the dataset unusable and methodology draft. Scientific and translation approval are independent of mechanical checks."
    source_ids:
      - ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "spinning feedstock models with matched origin and noil state"
  allowed_use: "attributional noil supply at new first release with explicitly attached original-cohort services and upstream cotton once"
  excluded_use: "waste-treatment service; garnetted cotton; linters; clinical cotton; universal plant average; automatic substitution credit"
  required_metadata: "comber source line and lot; ginned virgin cotton origin and prior preparation; ungarnetted unbleached short-fibre form; cotton purity and measured foreign-fibre contamination; fibre length distribution and receiver spinning specification; measured plant trash and neps; free moisture and declared as-released mass basis; oil or finish identity and retained content when present; first quality release Q and original cohort Qc; opening and closing WIP plus unused non-WIP vectors; gross physical V distinct from attributional A; joint co-output allocation evidence; legal transfer status and receiver acceptance; site and technology; representative production and service periods; actual packaging composition and full component balances; native identity restrictions and provider compatibility"
  required_quality_disclosure: "Disclose measurement uncertainty, incomplete supplier identity, causal-allocation support, stock inheritance, source/geographic mismatch and service-cohort settlement. Do not claim clinical purity, a universal yield or complete LCIA characterization."
  update_trigger: "change in fibre origin/state; combing or cleaning route; contamination; receiver specification; utility identity; allocation; first-release gate; stock/service boundaries; packaging; stronger source evidence"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version3.0 Structure and Explanatory Notes,30June2025; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "39214 and39215 classification titles plus adjacent textile waste categories; classification context only"
  - id: "usitc-comber-1990"
    type: "official_guidance"
    reference: "USITC Publication2334, Cotton Comber Waste, November1990, A-10–A-11 and A-28–A-29; https://www.usitc.gov/publications/22/pub2334.pdf"
    used_for: "ginned cotton preparation and combing origin; unbleached noil used in spinning; separate handling and natural burlap; conditional dealer cleaning; historical route facts only, no modern amounts or legal claims"
  - id: "gp-comber-noil"
    type: "literature"
    reference: "G P Group India, Cotton Comber Noil; https://www.gpgroupindia.com/cotton-comber-noil.html"
    used_for: "first-party commercial noil origin and OE spinning use; adjacent flat-strip lickerin and yarn-waste distinctions; supplier specifications not transferred as PCR ranges"
  - id: "jrc-textiles-2023"
    type: "official_guidance"
    reference: "JRC Textiles Industry BREF,2023, sections2.4.2–2.4.3, PDF68–69; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2023-01/TXT_BREF_2023_for_publishing%20ISSN%201831-9424_final_1_revised.pdf"
    used_for: "cotton preparation process context and actual auxiliary screening; neighbouring wool and synthetic oil percentages are inapplicable to cotton noil; no default oil recipe or emission quantity"
  - id: "ilcd-attributional-2010"
    type: "official_guidance"
    reference: "ILCD Handbook General guide for LCA Detailed guidance, First edition March2010,7.9.2–7.9.3, PDF275–292; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "generic attributional subdivision and exchange-specific determining physical causality; genuine residual common-gate market values; waste/recycling limitations; foreground collection implementation is this PCR synthesis without borrowed plant numbers"
