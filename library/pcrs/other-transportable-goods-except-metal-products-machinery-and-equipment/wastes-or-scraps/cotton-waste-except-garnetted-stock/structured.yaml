system_boundary:
  rules:
    - rule_id: b_full_route
      applies_to: "foreground_system"
      rule: "Start at received ginned cotton bales; include receiving and opening/cleaning, carding, actual drawing/lap preparation needed for combing, combing separation, segregated noil collection, dry inspection and actual mechanical cleaning, sampling and first quality release for a named spinning customer specification. Include suction, dust filtration, compression and attributable maintenance. Model the actual route; purchased finished noils plus packing alone cannot represent this integrated production dataset."
      source_ids:
        - usitc-comber-1990
        - gp-comber-noil
        - jrc-textiles-2023
    - rule_id: b_exclusive
      applies_to: "reference_product"
      rule: "Only unbleached ungarnetted cotton short fibres separated at the comber are the reference product. Keep card strips, blowroom waste, lap/sliver/roving waste and yarn hard waste separate. Exclude seed cotton, linters removed from cottonseed, hulls, mixed floor sweepings, wool/silk waste, garnetted fabric/yarn, bleached absorbent cotton, long combed sliver and yarn from reference Q. Classification 39214 is broader than this noil boundary; 39215 cannot substitute for it."
      source_ids:
        - un-cpc3-2025
        - usitc-comber-1990
        - gp-comber-noil
    - rule_id: b_physical_burden
      applies_to: "every_exchange"
      rule: "Keep gross physical quantities V and their source/destination partition independently from the attributional inventory vector A. Allocation changes burdens; it never rewrites the actual mass balance or invents a physical fibre input. An exported mixed collector total and its source partitions describe one transfer and one provider link; do not add them. A newly discovered actual exchange F must receive a specific atomic row; remove X only when it is an exact same-side duplicate already inside OTHER. Never use an undivided OTHER as a selected flow. The normalized A/Q view is environmental attribution; physical co-output cards retain gross V in the joint ledger and cannot offer a second supply provider carrying the same A. Never use A as the physically shipped mass or test physical conservation on allocated A."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: b_release_service
      applies_to: "production_and_finished_stock"
      rule: "Q is the net fibre mass newly passing the first spinning-feedstock quality release in the production cohort. Q includes that cohort remaining in closing finished goods once; do not add closingFG to Q again. Subsequent inspection, storage, compression, packaging, handling and dispatch are a separate service ledger assigned to the original released cohort Qc. Service throughput H and gross shipments S are not a new production denominator. Cancel internal noil transfers and their inherited vectors when combining modules."
      source_ids:
        - usitc-comber-1990
        - ilcd-attributional-2010
    - rule_id: b_inheritance
      applies_to: "raw_material_WIP_and_unused_stock"
      rule: "At every physical gate retain opening/closing WIP, unused non-WIP inputs, first-release finished stock, returns and their exchange-by-exchange inherited vectors. Preserve all failed lots, Q0, start/stop, idle, cleanup and real rework loads. Consume opening WIP with its history; carry closing WIP history forward; unused unopened supplies retain procurement history separately. Do not subtract a stock correction twice from an already net issue. Reinspection and redispatch create no new Q."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: b_actual_services
      applies_to: "utilities_and_auxiliaries"
      rule: "The baseline is dry mechanical fibre separation. Mains water applies only to actual humidification or utility makeup; no washing, bleach, chemical dissolution, steam, boiler, drying heat or onsite combustion is assumed. If actually operated, retain its loads even when unauthorized or outside the intended route, report the route departure and add every purchased whole formulation, fuel, water return, waste and actual gas species separately before using the dataset. Purchased formulations are counted once; assays and carrier water are subsidiary balances. In-house preparation uses each actual purchased ingredient plus its real energy and losses."
      source_ids:
        - usitc-comber-1990
        - jrc-textiles-2023
    - rule_id: b_packaging
      applies_to: "each_packaging_component"
      rule: "For each actual jute cloth, cotton cloth, steel wire and polypropylene strap maintain its own balance: opening empty + opening attached to WIP/FG + opening reusable stock + purchases P + external returns received ER = closing empty/attached/reusable + material on gross physical shipments S + external returns outward EO + waste W. Internal reuse I cancels between steps; it is neither another purchase nor noil Q nor an automatic coproduct. Keep inlet bale wrappings and outlet packaging separately by lot and component."
      source_ids:
        - usitc-comber-1990
        - ilcd-attributional-2010
    - rule_id: b_upstream
      applies_to: "upstream_and_outsourced_interfaces"
      rule: "Ginned cotton carries representative cultivation and ginning supply through one linked upstream dataset; do not invent a zero-burden waste cut-off for a valuable noil. Distinguish integrated combing from an explicitly contracted upstream combing service with its actual burden vector; never add a purchased noil and rebuild the same cotton/combing history. Outbound transport after the stated dispatch gate and downstream blending/spinning are outside this foreground boundary."
      source_ids:
        - usitc-comber-1990
        - ilcd-attributional-2010
