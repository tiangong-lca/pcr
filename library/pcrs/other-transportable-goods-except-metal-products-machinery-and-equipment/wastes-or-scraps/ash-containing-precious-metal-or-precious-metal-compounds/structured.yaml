  classification_refs: "CPC 3.0:39333; narrower single-source silver bottom-ash subset. Current accepted narrower mapping and its durable acceptance decision are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and acceptance.decision_ref; this does not grant whole-leaf coverage, independent scientific/translation approval or publication."
  covered_products: "Cooled contained incineration bottom ash from one photographic gelatin/silver precipitate route"
  excluded_products: "Unburned sludge; direct film ash; filter dust as reference output; non-precious ash; non-ash metal scrap; refined silver"
  representative_product: "One actual assayed silver-bearing bottom-ash lot with receiver specification; no universal Ag grade"
  production_route: "Actual wash-water generation and inheritance → direct steam/PN-10 digestion → sulfuric precipitation/settling/neutralisation → slurry incineration/full abatement → cooling/first release → original-cohort gate services and receiver acceptance"
  market_state: "Contained bottom ash at first quality release, net mass at actual moisture; legal waste status retained; later delivery is not new manufacture"
functional_unit:
  what: "Supply this single-route silver-bearing bottom ash to a named precious-metal recovery receiver"
  how_much: "1 kg net bottom ash at first-release moisture, excluding packaging"
  how_well: "Actual Ag speciation/assay, moisture and contaminant conditions meet the named receiver technical specification; no default assay or recovery"
  how_long_or_cycle: "One unique first-release cohort c and its later actual services; delivery/reinspection never repeats Q_c"
  reference_flow_link: "ash_release"
system_boundary:
  rules:
    - rule_id: b_origin
      applies_to: "all stages"
      rule: "Trace the complete original wash-water generation and its inherited inventory to the actual emulsion manufacturing records/provider; then include alkaline enzyme digestion, direct steam injection, sulfuric-acid isoelectric precipitation, settling, supernatant neutralisation and transfer, and slurry pumping. The starting waste designation does not establish zero historical burden."
      source_ids:
        - kodak-silver-gelatin-1976
        - jrc-ilcd-2010
    - rule_id: b_thermal
      applies_to: "p_fire"
      rule: "Include the actual single-hearth batch incinerator with separate afterburner, filter and caustic wet scrubber, cooling and contained bottom-ash release. This is a transparent technical synthesis of the Kodak batch precipitate example and JRC thermal equipment/abatement context, not a same-factory observation. Record the actual temperature/time/oxygen regime and auxiliary supplies; no default burn temperature, fuel-only-startup claim, yield or recovery rate. Any different furnace/abatement configuration needs an explicit reviewed inventory before use."
      source_ids:
        - kodak-silver-gelatin-1976
        - jrc-nfm-2017
    - rule_id: b_terminal
      applies_to: "p_gate"
      rule: "Follow the identified ash through storage, actual compatible containment, loading and actual delivery to the named precious-metal recovery receiver gate. Retain technical acceptance for this bottom ash, assay/moisture/contaminant conditions, applicable waste code/status, permit scope and transport/transfer records. A Product UUID, historic patent or old guidance does not establish current legal authorisation or end-of-waste status. Exclude receiver smelting, fluxing, cupellation and refining from the ash supply function."
      source_ids:
        - jrc-nfm-2017
        - epa-photographic-1976
    - rule_id: b_stocks
      applies_to: "all stages"
      rule: "For every physical stream and inherited elementary/product/waste inventory component, carry opening WIP plus current additions minus closing WIP to the actual completed/rejected/lost destinations. Retain all failed and zero-output batches, startup/shutdown, idle, cleaning and incremental rework. Internal slurry, recirculation, sweep-back and reprocessed same-cohort material cancel in the combined foreground; no fresh upstream burden is invented or lost."
      source_ids:
        - kodak-silver-gelatin-1976
        - jrc-ilcd-2010
    - rule_id: b_release
      applies_to: "ash_release"
      rule: "Q_c is only the net as-released mass newly first quality-released in cohort c; closing finished stock of that cohort is already included in Q_c and is never added again. Dispatch, receiver reinspection, returns and repeat release do not create new production. Subsequent services use that original Q_c. H is a service driver only; gross handled or shipped V is a physical ledger quantity, not the production denominator. A later historical delivery reports the original production vector plus its actual incremental services."
      source_ids:
        - jrc-ilcd-2010
        - epa-photographic-1976
    - rule_id: b_atomic
      applies_to: "all inventory rows"
      rule: "Every card is one real exchange. Whole wash water, supplied reagent preparation, wastewater or ash crosses once with non-additive constituent accounts. Add each actual additional purchased chemical, filter/lining replacement, fuel, refrigerant, cooling-water circuit, packaging component, segregated residue, emission species and outlet individually before data completion. Unlisted real exchanges cannot be hidden in zero, other, a family selector or an assumed universal abatement efficiency. Absent, not measured and below detection remain distinct."
      source_ids:
        - kodak-silver-gelatin-1976
        - jrc-nfm-2017
        - jrc-ilcd-2010
    - rule_id: b_physical
      applies_to: "all stages"
      rule: "Reconcile wet/dry total physical mass and separate elemental Ag/C/H/O/N/S/Na/Cl/Br balances at wet, furnace/abatement, finished-stock and combined gates. Use independently measured moisture and composition/speciation; do not fit two unknowns with one residual. Separate free liquid water, vapour, independently established reaction water and any actual hydrate/structural water. Do not infer ash oxygen uptake or silver speciation from total ash mass alone. COD, TOC, VOC and TEQ are indicators, not masses of a selected molecule."
      source_ids:
        - kodak-silver-gelatin-1976
        - jrc-nfm-2017
        - jrc-ilcd-2010
    - rule_id: b_provider
      applies_to: "all stages"
      rule: "At every external transfer link one provider for the whole physical stream and its agreed water/energy/burden scope. Separate material subaccounts do not add second providers. Treat internal returned slurry/ash and packaging as transfers, not new procurement. External condensate/heat-exchange-water returns are Product returns only when real, with measured thermal state and supplier convention; no nonexistent boiler, steam loop, recovery credit or negative waste burden is assumed."
      source_ids:
        - jrc-nfm-2017
        - jrc-ilcd-2010
