    used_for: "Wash water → direct steam/PN-10 alkaline digestion → sulfuric precipitation/settling/neutralisation → actual sludge incineration to ash; adjacent counterexamples; no default ash assay/yield"
  - id: "jrc-nfm-2017"
    type: "official_guidance"
    reference: "JRC, Best Available Techniques Reference Document for the Non-Ferrous Metals Industries (2017), §7.1.1.1–7.1.1.2, printed pp.732–733: https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2020-01/JRC107041_NFM_bref2017.pdf"
    used_for: "Photographic incineration equipment and afterburner/filter/caustic scrubber; ash/filter-dust and subsequent smelting boundary; not this wet-sludge fuel demand"
  - id: "epa-photographic-1976"
    type: "official_guidance"
    reference: "US EPA, Photographic Effluent Guidelines, 41 FR 29078–29082 (14 July 1976), Appendix B, printed p.29080: https://www.epa.gov/sites/default/files/2015-11/documents/photographic_interim-final_07-14-1976_41-fr-29078.pdf"
