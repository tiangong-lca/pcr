allocation_rules:
  - rule_id: a_function
    applies_to: "all stages"
    rule: "Use attributional accounting. Identify whether the foreground also delivers a separately contracted waste-treatment service, recovered filter dust or useful exported heat; none is assumed from the ash sale or from a disposal invoice. Ash formation is not refined-silver production. No avoided landfill, virgin silver, fuel or electricity credit is automatic."
    source_ids:
      - jrc-ilcd-2010
      - jrc-nfm-2017
  - rule_id: a_subdivide
    applies_to: "each exchange"
    rule: "First directly assign exclusive operations and inputs/outputs to the receiving function. Use actual subdivision, then justified virtual subdivision and causal technical models for indivisible equipment. Preserve all operating states and inherited vectors; a metal assay alone is not an allocation share of steam, air treatment or waste-treatment service."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_causal
    applies_to: "each remaining exchange"
    rule: "For each genuinely remaining shared exchange identify the determining physical causality: how changes in each function change that particular flow. Test moisture/evaporation and enthalpy for thermal demand, actual reagent consumption for aqueous chemistry, and measured species/feed element/operating regime for emissions. The criterion may differ by exchange. Never arbitrarily choose physical versus economic allocation or apply one Ag mass fraction to everything."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_residual
    applies_to: "remaining common process"
    rule: "Only if documented exclusive/virtual subdivision and exchange-specific physical causality cannot resolve a remaining common burden may a justified economic allocation be used. Measure contemporaneous actual values of the actual functions at the same common-process gate and physical state, excluding subsequent transport/refining and package value. Treatment fees, positive/negative feed prices and recovered outputs require explicit function/sign analysis; no absolute-value trick, fixed split, spot refined-silver price or future recovery yield. If that basis remains indeterminate, keep the allocation unresolved."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_conserve
    applies_to: "all allocated vectors"
    rule: "Retain physical gross amounts independently of burden assignment. For each inventory component the assigned function vectors plus genuine retained WIP/stock and loss vectors reconcile to the original total. No burden disappears through internal cancellation or zero-output states. State the upstream waste allocation and cut-off choices with evidence; never default the generated wash water to burden-free."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_feed
      process_id: "p_wet"
      flow_role: "wash-water origin"
      record_type: "generation and transfer records"
      raw_fields: "source plant and line; original operating steps; date; wet mass; dry solids; free water; Ag species; element assays; source inventory vector; status; provider"
      collection_method: "Trace actual emulsion production and wash-water generation; weigh the complete segregated wet supply and independently analyse representative samples. Retain original units and full per-exchange upstream vector; do not normalise."
      unit: "kg"
      frequency: "each source lot"
      temporal_coverage: "complete cohort including previous held material"
      site_scope: "actual emulsion source and receiving wet line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "source records; scale calibration; assays; upstream inventory evidence"
    - protocol_id: cp_wet
      process_id: "p_wet"
      flow_role: "wet processing"
      record_type: "weighing dosing and wastewater logs"
      raw_fields: "batch id; feed; solution whole mass and assay; PN-10 preparation and activity; added water; pH time temperature; steam reference; electricity; decant; slurry; cleaning; O_WIP; C_WIP; inherited vector; failed and zero-output states"
      collection_method: "Weigh each actual whole purchased preparation and wet outlet separately; meter pumps/digestion and reconcile settling/neutralisation. Keep material/element balances, actual process timing and all off-spec/cleaning loads. Aggregate raw quantities by cohort and row only; no division."
      unit: "kg; MJ"
      frequency: "each batch and operating state"
      temporal_coverage: "full cohort including startup idle shutdown and failures"
      site_scope: "one wet-processing line with shared-meter scope declared"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; dosing logs; activity certificate; wastewater provider and sampling records"
    - protocol_id: cp_fire
      process_id: "p_fire"
      flow_role: "incineration and abatement"
      record_type: "metered furnace campaign"
      raw_fields: "cohort; slurry wet/dry mass; feed speciation; furnace temperature time oxygen; burner gas and metering state; gas composition and measured density; afterburner; filter; caustic solution whole amount and assay; scrubber water; electricity; bottom ash; filter dust; purge; rejected ash; cleaning; O_WIP; C_WIP; inherited vector"
      collection_method: "Weigh actual slurry and each separate solid/liquid outlet and meter every utility/reagent. Keep start-stop, sustained firing, failed charges, idle, cleaning and rework, with uncertainty. Reconcile whole physical and independent elemental accounts before allocation; aggregate undivided raw quantities."
      unit: "kg; MJ"
      frequency: "each charge and matched emission interval"
      temporal_coverage: "full furnace campaign and residual stocks"
      site_scope: "actual single-hearth furnace afterburner filter and scrubber"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "feed/ash assays; calibrated meters; campaign log; residue transfer evidence"
    - protocol_id: cp_release
      process_id: "p_fire"
      flow_role: "first bottom-ash quality release"
      record_type: "calibrated net weighing and acceptance"
      raw_fields: "cohort c; lot id; gross; actual tare; net first-released ash kg; free moisture; dry solids; Ag metal/halide/other species; C/H/O/N/S/Na/Cl/Br; contaminants; receiver specification; first-release time; duplicate and return flags; Q_c"
      collection_method: "Use calibrated lot scales and matched representative moisture/speciation samples; subtract actual tare and count only unique newly first-released bottom ash. Retain unnormalised net release masses Q_c and uncertainty. Closing FG already released is not added; reinspection and shipment are separate events."
      unit: "kg"
      frequency: "each first release"
      temporal_coverage: "original release cohort retained through later delivery"
      site_scope: "cooled contained bottom ash at declared first-release gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; sampling chain; release and receiver criteria; uniqueness ledger"
    - protocol_id: cp_steam
      process_id: "p_wet"
      flow_role: "steam and actual external return"
      record_type: "supplier meter and thermodynamic state records"
      raw_fields: "steam mass; inlet pressure; inlet temperature; dryness; specific enthalpy; actual trap/header return mass; return pressure temperature enthalpy; supplier water-energy scope; direct-injected fraction"
      collection_method: "Meter actual supplied steam mass; obtain independently documented thermal state and enthalpy basis. Trace injected condensate into slurry. Record only genuine external returns and their supplier convention; aggregate raw mass and energy without invented boiler or density."
      unit: "kg; MJ"
      frequency: "each supply interval and return"
      temporal_coverage: "full cohort including supply-system losses"
      site_scope: "actual supplier boundary and direct-injection header"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier receipts; state sensors; enthalpy method; return measurements"
    - protocol_id: cp_air
      process_id: "p_fire"
      flow_role: "ambient combustion-air components"
      record_type: "gas flow and composition measurement"
      raw_fields: "interval; integrated dry air volume or true rate; temperature pressure; humidity; O2; N2; Ar; inlet CO2; trace constituents; uncertainty"
      collection_method: "Use calibrated inlet flow and independent composition/humidity at stated conditions. Integrate only true rates; do not multiply an accumulated volume by time again. Convert each constituent using independently justified gas-state relations; keep whole-air and component measures non-additive. No division."
      unit: "kg"
      frequency: "each matched furnace/afterburner interval"
      temporal_coverage: "startup stable operation failure idle and shutdown"
      site_scope: "actual air inlet and leak-air boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "flow calibration; composition method; state/humidity records"
    - protocol_id: cp_species
      process_id: "p_fire"
      flow_role: "each actual emitted species and size fraction"
      record_type: "stack fugitive and laboratory records"
      raw_fields: "species or size cut; CAS; source fraction; concentration; measurement basis; flow rate or integrated volume; interval; dry/wet and reference-state conditions; air subcompartment; molecular/elemental basis; detection limit; uncertainty; bypass and fugitive events"
      collection_method: "Measure each species and actual size fraction independently. Multiply matched concentration by volume once or integrate concentration times true rate over time; correct original wet/dry and reference states explicitly. Retain raw masses, nondetect intervals, source apportionment and actual extra species. Do not convert NOx/VOC/TEQ/COD wholesale into a molecule."
      unit: "kg"
      frequency: "each representative interval plus abnormal event"
      temporal_coverage: "all operating states with unmeasured intervals identified"
      site_scope: "actual stack and fugitive boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "laboratory methods; calibration; detection limits; state and flow logs; carbon/speciation evidence"
    - protocol_id: cp_thermal
      process_id: "p_fire"
      flow_role: "actual heat losses and exports"
      record_type: "energy balance measurements"
      raw_fields: "fuel energy; steam enthalpy; electrical input; feed energy and moisture; output material enthalpy; real useful heat; measured loss; actual export; uncertainty"
      collection_method: "Close the actual furnace/afterburner/abatement thermal balance with independent feed, state and heat records. Keep losses and actual exports separate, including their declared sensible/latent scope; no default efficiency or automatic energy export. Retain undivided energy amounts."
      unit: "MJ"
      frequency: "each matched campaign interval"
      temporal_coverage: "all operating states"
      site_scope: "actual thermal-system boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter/state calibration; enthalpy convention; independently measured feed heating value"
    - protocol_id: cp_gate
      process_id: "p_gate"
      flow_role: "original-cohort services and physical stocks"
      record_type: "stock packing delivery and return records"
      raw_fields: "original c and Q_c; O_FG; C_FG; gross handled V; gross ash shipments; receiver accepted and rejected amount; returns and original delivery reversal; physical losses; package tare; electricity; water; cleaning effluent; service time H; each inherited vector"
      collection_method: "Track original lot/cohort through storage and actual receiver acceptance; keep physical movements separate from new production. Carry original burdens and only incremental rework/services; reverse erroneous original delivery entries in their cohort. Retain raw service totals, histories, zero-output work and stock vectors. H never replaces Q_c."
      unit: "kg; MJ; h"
      frequency: "each movement service interval and receiver event"
      temporal_coverage: "release cohort plus all later related services"
      site_scope: "producer stock/loading and named receiver gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stock reconciliation; consignment; receiver documents; scale/meter records"
    - protocol_id: cp_pack
      process_id: "p_gate"
      flow_role: "each steel drum and each PE inner bag"
      record_type: "independent packaging ledger"
      raw_fields: "type; material; form; composition; actual tare; receipt_id; component_id; receipt_time; origin; custody_history; cohort; owner; receipt_class; measured_raw_quantity_and_unit; prior_external_dispatch_id; inherited_vector; unused_stock_vector; burden_owner; provider_scope; O_empty; O_WIP; O_FG; O_reusable; P; N_ext; ER; C_empty; C_WIP; C_FG; C_reusable; S; EO; W; internal reuse; residual ash; provider; return and treatment records"
      collection_method: "Weigh each actual package material/form/type without residual contents and retain measured original quantity/unit, receipt time, source, component identity, custody, cohort, real owner and history. For each component receipt_id classify its physical mass exactly once as P, N_ext or ER, mutually exclusively. P is newly purchased packaging actually received, including components purchased in a whole supplied lot without a separate component invoice; no separate invoice does not make them N_ext. N_ext is first actual external nonpurchase receipt, including first borrowing/leasing or genuinely nonpurchased supplier-attached packaging. ER requires a linked real earlier external dispatch of that same component from this system; a first receipt is never ER or fabricated opening stock. Before a concrete dataset is complete, represent each actual N_ext material/form/type/inlet as an additional atomic physical receipt input interface with its measured raw quantity, cp_pack records and compatible identity/provider evidence; identify each actual steel drum or PE inner bag separately, never a collection selector. Keep drum_purchased/liner_purchased P-only and drum_received/liner_received true-ER-only; do not invent a receipt or force another whole-lot purchase. Keep all exclusive opening/closing empty, WIP-attached, FG-attached and reusable stocks, gross dispatch S, outward return EO and waste W; internal reuse cancels. Reconcile v_pack in undivided quantities. Carry real burden owner, inherited history/vector and unused-stock vector independently of physical receipts; unused stock is not automatic consumption. Assign only actual attributable supply/service burdens once within their evidenced scope, retaining existing whole-load/provider ownership; do not charge package manufacture again, duplicate a whole-load/provider, create a credit or new Q_c. Never count each reuse as procurement."
      unit: "kg"
      frequency: "each lot/movement and period end"
      temporal_coverage: "all stocks and movements of relevant cohorts"
      site_scope: "actual container custody and reuse system"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tare measurements; purchase/return/waste receipts; physical stock count"
    - protocol_id: cp_freight
      process_id: "p_gate"
      flow_role: "external road freight"
      record_type: "weighed payload and route records"
      raw_fields: "leg id; original cohort; actual road distance; ash payload; package payload; actual shared cargo; empty/return leg; provider scope; receiver identity; transfer and permit documents"
      collection_method: "Record actual loaded gross payload in tonnes and actual leg distance in km, including declared allocation to real shared cargo and provider treatment of empty running. Compute raw tonne-kilometres without a production division. External provider supplies its full fuel/emission scope once."
      unit: "t km"
      frequency: "each actual leg"
      temporal_coverage: "all related deliveries and returns"
      site_scope: "producer to named receiver and declared return route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge; route/haulier records; scope and receiver acceptance evidence"
  calculation_rules:
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Convert each undivided raw record to its declared unit first; 1 kWh = 3.6 MJ. For species i use matched concentration times integrated volume, or the integral of concentration times actual volume rate; never both. Any density is independently measured for the actual substance and state."
      inputs:
        - original_records
        - state_measurements
        - cp_wet
        - cp_fire
        - cp_species
      output: "converted_raw_records"
      source_ids:
        - jrc-nfm-2017
        - jrc-ilcd-2010
    - id: cohort_assignment
      applies_to: "all inventory rows"
      rule: "Construct A_ic from converted raw exchange i assigned to cohort c after exclusive/virtual subdivision and justified exchange-specific allocation; include opening inherited WIP vector and actual additions, retain closing WIP vector and every failed/lost destination. Keep the vector conservation and physical mass accounts distinct."
      inputs:
        - converted_raw_records
        - opening_vectors
        - closing_vectors
        - allocation_evidence
      output: "A_ic"
      source_ids:
        - jrc-ilcd-2010
    - id: exchange_basis
      applies_to: "all inventory rows"
      rule: "For Q_c > 0 report X_ic = A_ic / Q_c once. X_ic is the exchange amount per 1 kg first-released reference flow of the original cohort. Cards and downstream service ledgers consume X_ic without further division; when Q_c = 0 retain A_ic without a unit result."
      inputs:
        - A_ic
        - Q_c
        - cp_release
      output: "X_ic"
      source_ids:
        - jrc-ilcd-2010
    - id: delivery_history
      applies_to: "p_gate"
      rule: "For an actual historical shipment retain its original first-release inventory vector and append only its actual incremental gate-service vector, attributed to original Q_c; shipment gross V and service H never generate a new production denominator. Reverse real original-delivery records for returns and retain real incremental rework."
      inputs:
        - original_cohort_vector
        - raw_service_records
        - original_delivery_records
        - cp_gate
      output: "delivery_vector"
      source_ids:
        - jrc-ilcd-2010
        - epa-photographic-1976
    - id: physical_accounts
      applies_to: "all stages"
      rule: "For each independently identified stream: opening physical stock plus external inputs equals closing physical stock plus external outputs plus measured transformation terms at the chosen gate. Cancel verified internal transfers; elemental accounts separately apply each actual species composition. Reaction water requires independent reaction evidence; do not fit multiple unknowns from one residual."
      inputs:
        - weighed_streams
        - independent_composition
        - reaction_evidence
        - cp_air
      output: "physical_and_element_accounts"
      source_ids:
        - kodak-silver-gelatin-1976
        - jrc-nfm-2017
        - jrc-ilcd-2010
    - id: package_accounts
      applies_to: "p_gate"
      rule: "For each separate package material/form/type: O_empty + O_WIP + O_FG + O_reusable + P + N_ext + ER = C_empty + C_WIP + C_FG + C_reusable + S + EO + W. P is actual new procurement received; N_ext is first external nonpurchase physical receipt; ER is actual receipt linked to a prior external dispatch of the same component. Classify each component receipt once, mutually exclusively, using cp_pack and its actual atomic receipt interfaces; a purchased whole-lot component remains P without a separate invoice. Opening/closing empty, WIP-attached, FG-attached and reusable categories are exclusive. Internal reuse cancels; S follows gross physical dispatch and excludes content mass. EO is actual outward return and W is actual waste; retain both independently. Physical receipt and stock quantities do not by themselves assign consumption or manufacturing burden; preserve real owner, history, inherited and unused vectors and one actual supply/service burden within its provider scope, without duplicate whole-load/provider, credit or new Q_c."
      inputs:
        - raw_package_records
        - cp_pack
      output: "package_conservation"
      source_ids:
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_origin
      applies_to: "wash_water"
      requirement: "A traceable actual emulsion-manufacture source and inherited inventory are mandatory; a generic wastewater flow or prior PCR conclusion cannot replace them."
      evidence: "source records; original provider inventory; allocation decision"
    - id: dq_example
      applies_to: "all stages"
      requirement: "Patent Example 1 and the nearby general embodiment report different dry sludge silver contents; neither is a finished-ash assay, industry range, present factory recipe or default recovery. JRC dry combustible-feed fuel observations cannot establish this wet sludge fuel demand."
      evidence: "original context; independent actual assays and energy measurements"
    - id: dq_completeness
      applies_to: "all operating states"
      requirement: "Retain measured, estimated, missing and below-detection flags per row, including every extra real flow/species. No numerical factory inventories, grade, density, fuel demand or abatement factor is supplied by this PCR."
      evidence: "coverage ledger; uncertainty; original raw records"
    - id: dq_receiver
      applies_to: "ash_release; ash_dispatch"
      requirement: "Verify technical material acceptance and actual authorised receiver scope for the declared bottom ash and packaging. Historic sources support process function only; actual current receiver documents must accompany the dataset."
      evidence: "receiver specification; assay; permit-scope and transfer records"
    - id: dq_providers
      applies_to: "all purchased and waste streams"
      requirement: "Check each actual provider against complete native restrictions and the declared physical supply. Ordinary supplier/grade/quantity gaps are foreground collection work; a known incompatible CAS, concentration, route, form, property or medium cannot be waived."
      evidence: "provider scope; specifications; full identity and unit-chain review"
    - id: dq_method
      applies_to: "all allocations and conversions"
      requirement: "Retain exchange-specific attribution and original/converted units with independently supported compositions and states. Basis checks do not solve unmeasured chemistry, reaction water, market allocation or real plant completeness."
      evidence: "allocation and balance dossier; sensitivity analysis"
validation_rules:
  - rule_id: v_scope
    applies_to: "dataset"
    rule: "Confirm a single photographic emulsion-manufacture wash-water source, the PN-10/sulfuric-acid precipitate route and actual incinerated bottom ash. Reject mixed precious-metal-ash selectors, non-precious ash 39320 and non-ash precious-metal scrap 39332; source-specific examples are not interchangeable."
    source_ids:
      - un-cpc3-2025
      - kodak-silver-gelatin-1976
  - rule_id: v_native
    applies_to: "all UUID-bearing rows"
    rule: "Check full native names, synonyms/comments, CAS, fixed grade, form, route, location, medium/type and every property against the actual exchange. Require search membership and state-100 exact-version direct evidence plus exact referenced property, unit-group and real reference unit. Preserve all restrictions in this card context. No classification-only or name-only acceptance. Unresolved specific input identities, including wash_water, remain ordinary gaps requiring compatible native identity and actual source/provider records before a concrete dataset is complete."
    source_ids:
      - kodak-silver-gelatin-1976
      - jrc-nfm-2017
  - rule_id: v_denominator
    applies_to: "ash_release"
    rule: "Verify exactly one ash_release reference output of 1 kg. Reconcile lot release Q_c with gross wet weight less actual tare and release moisture sample; Q_c is not dry Ag kg or total shipments. Closing FG already belongs to first release. Preserve old delivery/return vectors and reverse an original false delivery record in its original cohort; never count reinspection as new manufacture."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_raw
    applies_to: "all collection protocols"
    rule: "Collect only undivided original records. Convert original units and integrate actual rates once, allocate real shared operations and apply per-flow WIP inheritance before the sole exchange-basis division A_ic / Q_c. Neither cards, protocol aggregation nor gate services divide an already normalised value again. If Q_c=0 retain raw burdens and unresolved destination; publish no unit result."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_physical
    applies_to: "all gates"
    rule: "Independently close physical mass, Ag and C/H/O/water and other relevant element accounts with uncertainty; specimen analysis is not additional exchanged mass. Whole mixed gas/liquid measurements and their mutually exclusive source/species partitions are non-additive. Never infer silver recovery, reaction water or unknown species from one balance residual."
    source_ids:
      - kodak-silver-gelatin-1976
      - jrc-nfm-2017
      - jrc-ilcd-2010
  - rule_id: v_pack
    applies_to: "each packaging type"
    rule: "For each drum and PE bag material/form/type separately enforce O_empty+O_WIP+O_FG+O_reusable+P+N_ext+ER=C_empty+C_WIP+C_FG+C_reusable+S+EO+W. Verify measured raw receipt quantity/unit, receipt_id/component_id, time, origin, custody, cohort, real owner, history, inherited/unused vectors and provider scope against cp_pack. Each receipt is exactly one of P new procurement, N_ext first nonpurchase external receipt or ER true return linked to a real prior external dispatch of that same component. Reject first borrowing/leasing or genuinely nonpurchased supplier-attached receipts disguised as P, ER or opening stock; retain purchased whole-lot components as P even without separate invoices. Require the additional atomic physical receipt interfaces for every actual N_ext component; existing P-only and ER-only cards keep their meanings. Opening/closing empty, WIP-attached, FG-attached and reusable categories are mutually exclusive; retain gross S, EO and W. S follows gross physical dispatch, not Q; internal reuse cancels and never becomes fresh procurement or automatic coproduct. Match residual ash to its content ledger, excluding it from steel/PE mass. Verify physical quantity conservation separately from real owner/history and unused vectors; actual attributable supply/service burdens occur once with their original whole-load/provider scope, without second manufacture, duplicate burden, credit or new Q_c."
    source_ids:
      - jrc-ilcd-2010
      - jrc-nfm-2017
  - rule_id: v_thermal
    applies_to: "steam and furnace"
    rule: "Verify actual steam mass plus enthalpy and supplier water/energy scope, condensate state and genuine return; close furnace/afterburner useful heat and losses without invented generation/export. Integrated volume is not multiplied by time again; only rates are integrated. Obtain independent substance/state density, never water density for gas/reagent/slurry."
    source_ids:
      - kodak-silver-gelatin-1976
      - jrc-nfm-2017
  - rule_id: v_species
    applies_to: "emissions and effluents"
    rule: "Keep air/water compartments, molecular mass versus elemental/indicator basis and fossil/biogenic source partitions explicit. Add every real detected species and outlet not listed here before completeness can be claimed; total VOC/NOx/COD/TEQ cannot be substituted for a particular molecule. No assumed scrubber capture, zero fugitive or credit from below detection."
    source_ids:
      - jrc-nfm-2017
      - jrc-ilcd-2010
  - rule_id: v_receiver
    applies_to: "ash_dispatch"
    rule: "Require a named receiver, its actual authorised scope for this material and assay/containment acceptance, transport and consignment evidence. Historical EPA wording is evidence of a receiver function, not current law. Missing actual receiver identity/acceptance, current authorised scope, source formation or inherited inventory prevents completion of the concrete dataset. Keep all ordinary input-identity, site-quantity and auxiliary-provider gaps explicit and resolve them without invented facts."
    source_ids:
      - epa-photographic-1976
      - jrc-nfm-2017
  - rule_id: v_disclosure
    applies_to: "dataset profile"
    rule: "Disclose unresolved identities/evidence, measured and unmeasured operating states, extrapolation, temporal/geographic representativeness, allocations and cut-offs. An engineering/schema/basis check is not scientific or translation approval, current legal compliance or accepted classification coverage."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Upstream inventory for this defined bottom-ash recovery feed with actual original-cohort later services; not refined silver"
  allowed_use: "Only a package matching source, thermal route, state, receiver conditions and all native/provider restrictions"
  excluded_use: "Generic precious-ash selector; unburned sludge; other metal waste; refined silver; unconditional credits; current legal/scientific approval claims"
  required_metadata: "Complete §3 qualifiers; actual source/receiver identities; original-cohort Q_c; per-flow vectors; providers/method version; every actual species and outlet"
  required_quality_disclosure: "All native/evidence gaps, unmeasured states, inherited burdens, allocations, cut-offs and uncertainty; scientific pending and Chinese aligned are not reviewed"
  update_trigger: "Review changes in source/feed formulation/species/furnace/abatement/heat supply/reference gate/receiver/packaging/provider/allocation"
