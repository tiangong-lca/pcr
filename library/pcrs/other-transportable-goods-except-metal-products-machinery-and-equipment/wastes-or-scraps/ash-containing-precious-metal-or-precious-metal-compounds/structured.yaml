    type: "official_guidance"
    reference: "JRC, ILCD Handbook — General guide for LCA, Detailed guidance, first edition March 2010, §7.9.2–7.9.3, printed pp.255–272: https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctionality: subdivision, virtual subdivision, exchange-specific determining physical causality and residual common-gate economic allocation; not factory values or ash-recovery credits"
