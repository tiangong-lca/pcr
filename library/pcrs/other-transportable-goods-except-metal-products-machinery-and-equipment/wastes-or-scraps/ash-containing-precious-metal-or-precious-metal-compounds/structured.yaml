    reference: "Alfa Therm Limited, Static (Fixed Hearth) Incinerator, undated manufacturer technical page; Engineered for Reliable Batch Operation, Working Principle, Technical Specifications and FAQ: https://alfathermltd.com/static-incinerator"
    used_for: "Batch stationary fixed-hearth primary chamber with separate secondary combustion and explicit natural-gas fuel option; equipment-level synthesis only, not photographic-feed/site evidence or numerical defaults"
  - id: "epa-incinerator-training-1989"
    type: "handbook"
    reference: "US EPA, Hospital Incinerator Operator Training Course, Volume I: Student Handbook, EPA-450/3-89-003, March 1989; Session 3, printed pp.3-12–3-16 and 3-23–3-24, Fig.3-6; Glossary, Auxiliary Fuel Burner (PDF p.245): https://nepis.epa.gov/Exe/ZyPDF.cgi/2000MKZW.PDF?Dockey=2000MKZW.PDF"
    used_for: "Distinct primary/secondary burners and natural-gas auxiliary firing/fuel trains in batch-compatible incinerator equipment; medical-waste context, not this plant's fuel amount, operating settings, emissions or legal approval"
