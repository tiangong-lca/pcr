  calculation_rules:
    - id: release_quantity
      applies_to: "accepted_feed"
      rule: "Q = sum of newly first-released net wet trimming mass at the receiver gate in the cohort; one physical lot is counted once. Free drained liquid and all packaging are excluded. Dispatch and reinspection quantities are separate gross views. For Q=0 preserve the complete raw ledger and burdens and produce no unit result."
      inputs:
        - new_release_mass
        - lot_identity
        - cp_release
      output: "Q"
      source_ids:
        - eu-jrc-tanning-2013
        - unido-leather-2019
    - id: prepare_attribution
      applies_to: "all inventory rows"
      rule: "For each exchange i convert the original quantity to its row unit first and apply the documented exchange-specific allocation. A_i = attributed current external load plus inherited opening WIP vector minus inherited closing WIP vector, with exact internal transfers cancelled and companion-output assignments kept separate. Preserve genuine failed/cleanup/rework loads and burdens carried by identified losses. A_i is never a normalized quantity."
      inputs:
        - raw_i
        - conversion_i
        - allocation_i
        - opening_vector_i
        - closing_vector_i
        - cp_allocation_trim
        - cp_allocation_prepare
      output: "A_i"
      source_ids:
        - ilcd-allocation-2010
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q for Q > 0, exactly once. All non-reference cards and collection aggregation labels refer to this one result per reference flow. No card, collection method or aggregation performs another division. The accepted_feed card is the declared 1 kg reference identity. Physical audit-only companion and packaging movements remain explicitly tagged and cannot become credits."
      inputs:
        - A_i
        - Q
      output: "x_i"
      source_ids:
        - ilcd-allocation-2010
    - id: physical_gates
      applies_to: "trim; prepare"
      rule: "For the trimming-feed stock ledger at each gate: opening stock + external feed receipts + newly formed trimming mass = closing stock + all gross physical outward feed movements + measured losses, cancelling paired internal movements when consolidated. This feed-stock equation does not add newly formed trimmings to the whole-hide material inputs; the complete original trimming-process mass balance is incoming hides = retained hide + cuttings + other individually measured outward material + stock changes + losses. Formation F counts only new material; an X correction removes only an exact duplicate already present on the same side in OTHER, with identity and original booking proof. Never subtract ordinary waste, WIP or returns as duplicate X. Track wet mass, dry leather, free liquid, water and total chromium independently; assay compounds are contained subaccounts. The initial trimming gate balances complete hides against retained hide, cuttings and loss."
      inputs:
        - opening_mass
        - external_receipts
        - F
        - X
        - closing_mass
        - gross_outward
        - measured_loss
      output: "physical_balance"
      source_ids:
        - eu-jrc-tanning-2013
        - unido-leather-2019
    - id: fg_destinations
      applies_to: "accepted_feed"
      rule: "Q is first release at the receiver gate. Newly released material already present in closing FG is included in Q and must not be added again. FG opening + Q + actual external returns received = FG closing + gross onward deliveries + external returns sent + FG waste, with identified moisture changes. Carry historical per-exchange burdens through opening/closing FG and original-delivery reversal if a released lot returns. Any post-release holding/dispatch is a separate service account; its internal released-product transfer cancels when consolidated and cannot create more Q."
      inputs:
        - opening_FG
        - Q
        - returned_FG
        - closing_FG
        - gross_delivery
        - returned_outward
        - FG_waste
      output: "FG_balance"
      source_ids:
        - ilcd-allocation-2010
    - id: packaging_six_legs
      applies_to: "cp_packaging"
      rule: "For the single physical bin article: opening empty + opening attached to WIP/FG + opening reusable stock + new external purchase + external return received = closing empty + closing attached to WIP/FG + closing reusable stock + bins leaving with gross physical shipments + separate outward returns + bin waste. Count each serial article once per stock side or external event. Internal reuse cancels; neither internal turnover nor externally returned bins are new manufacture, Q or automatic co-product. Pair the same equation at source, receiver and consolidated gates; no bin tare enters leather mass."
      inputs:
        - opening_bin
        - new_bin
        - external_return_received
        - closing_bin
        - gross_shipment_bin
        - outward_return_bin
        - bin_waste
      output: "bin_balance"
      source_ids:
        - ilcd-allocation-2010
    - id: raw_conversions
      applies_to: "all inventory rows"
      rule: "Use the exact reference property/unit chain of each adopted identity. kWh × 3.6 = MJ; kg × km / 1000 = t*km for measured goods including carried bins. Preserve the carrier empty-running convention. Integrated gas/liquid volumes are already totals and are not multiplied by time again; only true rates are integrated. Volume-to-mass requires the actual substance density independently measured at its state; count-to-mass requires measured same-article tare. No secondary coefficient supplies leather density or bin mass."
      inputs:
        - raw_unit
        - actual_state
        - independent_density
        - article_tare
        - distance
      output: "converted_raw_i"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Keep native descriptions and actual supplied state, provider interface and type compatible. Unresolved upstream, companion and auxiliary UUIDs remain specific unbound exchanges. Resolve the actual whole-hide and retained-hide identity and supplier coverage before linking those exchanges in a quantitative data package; do not bind contradictory candidates or infer per-hide mass. This input identity gap does not by itself invalidate the evidenced trimming-feed reference or manufacturing route."
      evidence: "Complete direct identities; supplier declarations; receiver specification"
    - id: dq_coverage
      applies_to: "all inventory rows"
      requirement: "Use a representative period covering season, site and actual route, with failed lots, Q0, cleaning and all storage gates. Distinguish missing data from measured zero and preserve the full gross ledger alongside allocated results."
      evidence: "Calendar; complete batch register; meter calibration; stock reconciliation"
    - id: dq_science
      applies_to: "accepted_feed"
      requirement: "Test actual moisture, chromium species and contaminants on declared bases with uncertainty and detection limits; retain supplier and receiver technical/legal evidence. No source table mean becomes a foreground factor or safety threshold."
      evidence: "Sampling plan; laboratory methods; acceptance/rejection receipts"
    - id: dq_attribution
      applies_to: "all inventory rows"
      requirement: "Retain each flow conversion, allocation decision and opening/closing inherited vector. Bound uncertainty independently for moisture, losses, shared service and value; no algebraic closure is a substitute for independent measurement."
      evidence: "Raw worksheets; vector ledger; sensitivity; source context"
validation_rules:
  - rule_id: validate_scope
    applies_to: "accepted_feed"
    rule: "Reject pooled leather forms or unverified receiver function/status. Require moist chromium(III)-tanned bovine edge cuttings with no dyeing/finish; shavings, powder, raw/limed hides, wet-white or vegetable-tanned scraps, leather articles and fibreboard are excluded. Missing moisture, chromium/contamination or lawful receiver evidence is unresolved applicability."
    source_ids:
      - eu-jrc-tanning-2013
      - unido-leather-2019
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "Exactly one accepted_feed reference row equals 1 kg and uses Q as first release at the receiver gate. Every other card reports normalize_once with the same Q; protocols collect raw totals. Fail repeated normalization, duplicate FG output, repeated release or unit results at Q=0."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_balances
    applies_to: "trim; prepare"
    rule: "Reconcile full original trimming mass, cutting-stock F and exact duplicate X, separate wet/dry/water/chromium balances, per-exchange WIP history, FG destinations and all six packaging legs. Do not infer two unknowns from one residual or use COD/total VOC as a specific chemical mass."
    source_ids:
      - eu-jrc-tanning-2013
      - unido-leather-2019
      - ilcd-allocation-2010
  - rule_id: validate_sources
    applies_to: "all inventory rows"
    rule: "Check source applicability and limitations independently of extraction verification. Industrial sources support the stated process distinctions, not LCA allocation or current legal permissions; apply the cited attributional ILCD context only within section 7. Unknown quantitative relationships and unresolved native contradictions remain review holds."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_providers
    applies_to: "all inventory rows"
    rule: "One provider for each external service or material interface; paired internal trimmings have no second provider. Combined outlet totals and partitions do not add. No duplicated fuel/exhaust of a transport service, no fictitious steam/condensate, and no automatic co-product or recovery credit."
    source_ids:
      - ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "background_dataset"
  allowed_use: "State-matched attributional feed supply to an accepting receiver after identity and applicability review"
  excluded_use: "Treatment-service reporting; consequential recycling credit; general leather powder; finished leather or fibreboard substitution; unverified hazardous-waste exemption"
  required_metadata: "bovine species and source lot; chromium(III) tanning system and curing route; undyed unfinished wet-blue state; actual as-received moisture and dry matter basis; edge-cutting geometry and foreign matter specification; total chromium and chromium(VI) test basis and detection limits; actual biocides and contact contamination; jurisdictional waste or by-product status and authorised receiver function; receiver fibreboard feed acceptance and first-release lot identity; net wet mass excluding free drain liquid and packaging; gross formation and opening closing stocks with inherited burdens; source and receiving gates geography period and provider boundaries"
  required_quality_disclosure: "Measured versus unknown data, native identity limits, failed/Q0 coverage, first-release cohort, WIP/FG burden history, packaging stock/service, provider overlap and allocation sensitivity"
  update_trigger: "Tannage, species, finish, moisture state, outlet function/status, actual process, provider boundary or identity conflict resolution changes"
data_sources:
  - id: "eu-jrc-tanning-2013"
    type: "official_guidance"
    reference: "European Commission JRC. Tanning of Hides and Skins BREF (2013), doi:10.2788/13548; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/TAN_Published_def.pdf; §§2.3.4–2.3.5, 3.5.2, 4.11.1.2–4.11.1.5; printed pp.21,74–75,197–199"
    used_for: "Original trimming and shavings distinction; carried chemicals; Table 3.17 conditions/footnotes; Table 4.20 non-finished trimming outlets and adjacent limitations. No numerical default or legal approval."
  - id: "unido-leather-2019"
    type: "official_guidance"
    reference: "UNIDO. The Framework for Sustainable Leather Manufacture, second edition (2019); https://leatherpanel.org/sites/default/files/publications-attachments/the_framework_for_sustainable_leather_manufacturing_2nd_edition_2019_f.pdf; pp.26–27,62; Figs.5,6,39"
    used_for: "Independent institutional process context, separate wet-blue trimmings versus shavings/dust, inherited chromium and preservation residues. Illustrative chemical balances are not foreground factors."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook: General Guide for LCA — Detailed Guidance, first edition March 2010; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf; §§7.9.2–7.9.3, printed pp.255–272 (PDF275–292)"
    used_for: "Attributional subdivision/virtual subdivision, exchange-specific determining physical causality, residual same-condition common-gate market value and service attribution. No fixed allocation ratio or numerical reuse."
