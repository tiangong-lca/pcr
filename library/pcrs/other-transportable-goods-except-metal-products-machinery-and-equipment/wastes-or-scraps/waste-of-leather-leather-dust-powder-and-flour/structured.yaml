system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "trim; prepare"
      rule: "Include the actual original trimming of purchased moist chrome-tanned bovine hide; link one complete upstream wet-blue supplier. Curing, beamhouse, tanning and sammying already included upstream must not be repeated as foreground. If they are actually onsite, expand to their individually named supplied formulations, fuels, water, chemicals and actual species with source evidence; do not claim this bounded route for an integrated tannery."
      source_ids:
        - eu-jrc-tanning-2013
        - unido-leather-2019
    - rule_id: boundary_terminal
      applies_to: "prepare"
      rule: "Include segregation, handling, necessary covered holding, actual bin preparation, outbound transport and first receiver acceptance. The supported intended outlet is non-finished trimming feed for leather fibreboard after receiver preparation; fibreboard production, chemical hydrolysis, chromium recovery and disposal service are outside the product reference. A historic recovery example is not current legal permission or guaranteed acceptance."
      source_ids:
        - eu-jrc-tanning-2013
        - unido-leather-2019
    - rule_id: boundary_atomic
      applies_to: "all inventory rows"
      rule: "Instantiate every actually present additional material or species as its own atomic card, including foreign-metal removal, detergent formulation, preserved-biocide addition, fuel, gas, spill and treatment residue. State measured absence for unused operations; no collective other exchange may hide real loads. The selected route has no deliberate drying, new tannage, steam boiler or onsite combustion. A real heat route requires its own exact steam/heat identity, enthalpy and condensate/water agreement and separately named external returns."
      source_ids:
        - eu-jrc-tanning-2013
        - unido-leather-2019
    - rule_id: boundary_stocks
      applies_to: "all inventory rows"
      rule: "Retain all failed batches, Q=0 campaigns, start/stop, idle, cleanup and real incremental rework. Before first receiver release all goods remain WIP, including ready-to-ship source stock and goods in transit. Track mass and an inherited vector for every exchange at every opening/closing WIP gate; transfer vectors rather than erase history. Reinspection is not new production."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_interface
      applies_to: "all inventory rows"
      rule: "Keep a physical gross ledger and an allocated product ledger separately. Cancel only exact paired internal transfers at consolidation. For one combined effluent outlet, total and source partitions are nonadditive views of the same stream and share one provider. No avoided-landfill or virgin-leather credit follows from collection."
      source_ids:
        - ilcd-allocation-2010
