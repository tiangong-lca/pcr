          column: 1
      markdown: "## 5. System Boundary\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_route | trim; prepare | Include the actual original trimming of purchased moist chrome-tanned bovine hide; link one complete upstream wet-blue supplier. Curing, beamhouse, tanning and sammying already included upstream must not be repeated as foreground. If they are actually onsite, expand to their individually named supplied formulations, fuels, water, chemicals and actual species with source evidence; do not claim this bounded route for an integrated tannery. | eu-jrc-tanning-2013; unido-leather-2019 |\n| boundary_terminal | prepare | Include segregation, handling, necessary covered holding, actual bin preparation, outbound transport and first receiver acceptance. The supported intended outlet is non-finished trimming feed for leather fibreboard after receiver preparation; fibreboard production, chemical hydrolysis, chromium recovery and disposal service are outside the product reference. A historic recovery example is not current legal permission or guaranteed acceptance. | eu-jrc-tanning-2013; unido-leather-2019 |\n| boundary_atomic | all inventory rows | Instantiate every actually present additional material or species as its own atomic card, including foreign-metal removal, detergent formulation, preserved-biocide addition, fuel, gas, spill and treatment residue. State measured absence for unused operations; no collective other exchange may hide real loads. The selected route has no deliberate drying, new tannage, steam boiler or onsite combustion. A real heat route requires its own exact steam/heat identity, enthalpy and condensate/water agreement and separately named external returns. | eu-jrc-tanning-2013; unido-leather-2019 |\n| boundary_stocks | all inventory rows | Retain all failed batches, Q=0 campaigns, start/stop, idle, cleanup and real incremental rework. Before first receiver release all goods remain WIP, including ready-to-ship source stock and goods in transit. Track mass and an inherited vector for every exchange at every opening/closing WIP gate; transfer vectors rather than erase history. Reinspection is not new production. | ilcd-allocation-2010 |\n| boundary_interface | all inventory rows | Keep a physical gross ledger and an allocated product ledger separately. Cancel only exact paired internal transfers at consolidation. For one combined effluent outlet, total and source partitions are nonadditive views of the same stream and share one provider. No avoided-landfill or virgin-leather credit follows from collection. | ilcd-allocation-2010 |\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Already chrome(III)-tanned moist bovine wet-blue hides purchased before original trimming |\n| starting_condition_role | intermediate_input |\n| product_classification_scope | A narrow feed-material subset of CPC 3.0:39220; classification is not methodology identity |\n| recursive_input_rule | Do not start with purchased already formed trimmings and call it original formation. Any genuine same-category external input is separately identified with its own history and one provider; it cannot be assumed burden free or merged with new formation. |\n| upstream_dataset_requirement | One state-matched whole-hide supply with curing and tannage included; no repeated upstream water or tanning chemical purchase |\n| disclosure | Actual species/tannage/state, trimming function, supplier coverage, WIP/FG vectors, receiver acceptance, waste/by-product status, provider boundaries and all omitted/changed operations |\n\n"
