          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| validate_scope | accepted_feed | Reject pooled leather forms or unverified receiver function/status. Require moist chromium(III)-tanned bovine edge cuttings with no dyeing/finish; shavings, powder, raw/limed hides, wet-white or vegetable-tanned scraps, leather articles and fibreboard are excluded. Missing moisture, chromium/contamination or lawful receiver evidence is unresolved applicability. | eu-jrc-tanning-2013; unido-leather-2019 |\n| validate_denominator | all inventory rows | Exactly one accepted_feed reference row equals 1 kg and uses Q as first release at the receiver gate. Every other card reports normalize_once with the same Q; protocols collect raw totals. Fail repeated normalization, duplicate FG output, repeated release or unit results at Q=0. | ilcd-allocation-2010 |\n| validate_balances | trim; prepare | Reconcile full original trimming mass, cutting-stock F and exact duplicate X, separate wet/dry/water/chromium balances, per-exchange WIP history, FG destinations and all six packaging legs. Do not infer two unknowns from one residual or use COD/total VOC as a specific chemical mass. | eu-jrc-tanning-2013; unido-leather-2019; ilcd-allocation-2010 |\n| validate_sources | all inventory rows | Check source applicability and limitations independently of extraction verification. Industrial sources support the stated process distinctions, not LCA allocation or current legal permissions; apply the cited attributional ILCD context only within section 7. Unknown quantitative relationships and unresolved native contradictions remain review holds. | ilcd-allocation-2010 |\n| validate_providers | all inventory rows | One provider for each external service or material interface; paired internal trimmings have no second provider. Combined outlet totals and partitions do not add. No duplicated fuel/exhaust of a transport service, no fictitious steam/condensate, and no automatic co-product or recovery credit. | ilcd-allocation-2010 |\n\n"
