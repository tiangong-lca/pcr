allocation_rules:
  - rule_id: allocation_scope
    applies_to: "all inventory rows"
    rule: "Use attributional partitioning only for the declared attributional study. First separate exclusive operations and perform measured or virtual subdivision of inventories; preparation dedicated to accepted trimmings is assigned directly. Document the unpartitioned gross ledger and the retained-hide companion ledger."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_causality
    applies_to: "trim"
    rule: "For each remaining exchange identify its determining physical cause separately. Trace embodied hide dry matter, contained water and chromium to retained hide, cuttings, rejected material and measured loss. Cutting to shape the retained hide is not automatically caused by the offcut mass; determine its actual function. Handle leather loss burdens explicitly. Mass conservation alone is not a universal mass allocation key."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "trim"
    rule: "Only after the above steps fail for a residual shared exchange use contemporaneous market values of actual co-functions in the same condition at the common trimming gate. Remove later transport, conditioning and packaging values before comparison; disclose prices, mass basis, negative or zero value and sensitivity. Unknown values require review, not a fixed ratio or free physical/economic choice."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_logistics
    applies_to: "prepare"
    rule: "Assign packaging, handling and transport by exclusive measured service first; for shared service use the determining limiting load and duration/distance with evidence. Preserve packaging cohort manufacture burden and remaining service potential. New purchases and returns are physical legs, not repeated manufacture. Use no assumed bin lifetime or recycling substitution credit."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_status
    applies_to: "accepted_feed"
    rule: "Declare actual legal and economic status at each gate. A Product flow can represent a material supplied for a documented recovery function without proving end-of-waste or nonhazardous status. If the real transaction is a treatment service or the receiver cannot legally/technically accept the chromium-bearing cuttings, do not use this Product reference and do not silently relabel it."
    source_ids:
      - eu-jrc-tanning-2013
      - unido-leather-2019
      - ilcd-allocation-2010
