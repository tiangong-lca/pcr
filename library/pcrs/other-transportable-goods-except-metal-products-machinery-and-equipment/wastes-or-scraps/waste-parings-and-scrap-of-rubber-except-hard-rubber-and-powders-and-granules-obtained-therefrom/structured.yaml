      collection_method: "Use calibrated equipment weighing or traceable supplier weighing for the same configuration. Determine actual service shares from justified metered work and lifetime records; keep physical mass stock separate from amortized manufacture burden. No concrete mass or lifetime is invented. Collect unnormalized raw records only; final basis is stated in aggregation_rule."
      unit: "kg"
