      collection_method: "Stocktake unfinished lots and trace every exchange vector through real stage transfers. Preserve inherited historical burdens and current additions separately, subtract closing WIP by the same vector basis and identify actual non-reference destinations. No blanket completion percentage or net-current-purchase proxy. Collect unnormalized raw records only; final basis is stated in aggregation_rule."
