system_boundary:
  rules:
    - rule_id: b_scope
      applies_to: "entire foreground"
      rule: "Include generating-site segregated capture and collection work, contracted inbound service, receiving/weighing, sorting by EPDM formulation, actual metal/non-rubber separation, coarse reduction, mechanical micronization, screening/recirculation, extraction, testing, packing, first release and all original-cohort gate services. Declare real site/contract interfaces. Additional actual units and each physical input/output must be added individually; this minimum inventory is not a cut-off."
      source_ids:
        - prismi-production
        - prismi-mechanical
        - assco-granulate
        - ilcd-2010
    - rule_id: b_whole_compound
      applies_to: "received_epdm; released_powder"
      rule: "Record each external scrap consignment once as the entire supplied vulcanized compound. Carbon black, polymer, filler, oil, cure residues and retained moisture stay in its non-additive composition subledger. No extra raw polymer or carbon black purchase is inferred; actual onsite added material must have its own specific atomic card and upstream boundary. No intentional devulcanization, solvent reclaiming, pyrolysis, new compounding or binder coating is included."
      source_ids:
        - prismi-production
        - prismi-epdm
        - toyota-recycling-2003
    - rule_id: b_source_history
      applies_to: "received_epdm"
      rule: "Retain the actual generating route, formulation and previous burdens. Determine the attributional boundary from the real source condition, value/fee and secondary material at the zero-value border using ILCD Annex C. Identify the true joint process and exact allocated contributions; an untreated or Waste label, internal transfer, purchase price or recycling claim never alone proves zero upstream burden. Do not use factory manufacturing evidence as allocation authority."
      source_ids:
        - ilcd-2010
    - rule_id: b_cohort
      applies_to: "p_recovery; p_gate"
      rule: "The unique production denominator is Qc, net powder newly passing the first complete quality release for the declared cohort. Qualifying closing FG already belongs to Qc; never add it again to production output. Q transfers from production to FG cancel at the combined gate. Keep opening/closing WIP by every exchange vector; do not average a partially finished lot into Qc. Failures, Q=0, startup/shutdown, idle and cleanup retain their real loads."
      source_ids:
        - ilcd-2010
    - rule_id: b_fg
      applies_to: "p_gate"
      rule: "Retain opening FG historical vectors and its original Qc, closing FG, gross dispatch V, returned already released material, prior-dispatch reversal and real incremental rework/loss. Store service additions under original Qc for observed H; neither H nor gross V is a production denominator. Do not normalize old FG history by a new calendar cohort. Reinspection, dispatch and reworking a released lot cannot create new production. Mark unobserved future services explicitly."
      source_ids:
        - ilcd-2010
    - rule_id: b_water_air
      applies_to: "all physical outlets"
      rule: "Use separate whole-compound mass, water and relevant measured element ledgers at production, FG and combined physical gates. Measure water loss and compound particulate loss independently; one residual cannot determine two unknowns. No chemical reaction is specified; retained moisture, incidental phase change, actual liberated water and structural water claims require separate evidence. Do not convert COD or VOC aggregate indicators into a named species mass."
      source_ids:
        - ilcd-2010
    - rule_id: b_outlets
      applies_to: "all waste and elementary rows"
      rule: "For each actual mixed outlet choose the measured whole consignment with one receiver or reconciled non-overlapping source partitions; never add both. Contained constituents of transferred wastewater, spent filter or solid residue are not also final elementary releases here. Quantify actual final gases and particles by individual physical/chemical identity and receiving medium after controls. Retain unresolved species as gaps rather than a balancing catch-all."
      source_ids:
        - ilcd-2010
boundary_abstraction:
  declared_starting_condition: "Known segregated non-hard vulcanized black EPDM trim at the generating manufacturer before recovery; retain source production history and actual collection interface"
  starting_condition_role: "Foreground collection start; not a universal cradle or zero-burden cut-off"
  product_classification_scope: "Narrow powder subset of CPC 3.0 39250; 39260 intact tyres and 36210 reclaimed rubber excluded"
  recursive_input_rule: "Purchased already finished same-category powder has its own verified upstream vector; do not relabel packing it as recovery production or regenerate its source chain twice"
  upstream_dataset_requirement: "Source formulation/material manufacture and trim-generation burden attributable under the declared recycling decision; actual collection transport; compatible purchased utilities and articles; each external treatment provider once"
  disclosure: "Declared source point and value state; retained/excluded history with reason; complete production and original-cohort service periods; unresolved measurements and native/provider limits"
