      record_type: "source-specific emission measurements"
      raw_fields: "source; species or compound identity; particle size; medium; control; concentration; independently measured sampled total volume or actual flow rate/time; temperature/pressure/moisture; final release; uncertainty"
      collection_method: "Measure actual final emissions after controls with source-specific sampling. Multiply concentration by a compatible integrated volume once; integrate only actual rates and do not multiply integrated gas/liquid volume by time again. Independently measure water loss and compound dust. Particle size totals and subfractions are non-additive; no automatic VOC species or carbon-black emission. Collect unnormalized raw records only; final basis is stated in aggregation_rule."
