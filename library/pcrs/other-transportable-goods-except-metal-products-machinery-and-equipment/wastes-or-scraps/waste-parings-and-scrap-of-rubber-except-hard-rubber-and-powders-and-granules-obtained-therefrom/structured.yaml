      flow_role: "each actual separated solid; captured dust; cleaning wastewater"
      record_type: "weighing sampling and transfer"
      raw_fields: "outlet; source partitions; whole mass; retained water; independently measured composition; source cohort; captured versus final release; treatment or sale state; recipient; provider coverage; stock changes"
      collection_method: "Weigh each whole actual outlet and sample relevant solids/liquids; retain tare, moisture and actual receiver. Captured dust and dust still attached to spent filter are disjoint physical masses. For wastewater keep whole transfer and constituent subledger; verify any final discharge independently. Collect unnormalized raw records only; final basis is stated in aggregation_rule."
