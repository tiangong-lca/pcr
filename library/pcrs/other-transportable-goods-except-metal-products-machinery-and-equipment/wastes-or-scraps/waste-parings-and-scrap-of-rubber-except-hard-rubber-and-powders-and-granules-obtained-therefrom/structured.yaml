  calculation_rules:
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Keep the raw unit. Convert kWh to MJ by 3.6 and transported kg*km to t*km by 0.001. Convert gas/liquid volume to mass only with independently measured density for that substance/formulation and measured state. Integrate actual rates once; a total volume or total energy is already integrated."
      inputs:
        - raw_readings
        - state_measurements
        - cp_utilities_p
        - cp_utilities_h
        - cp_transport_p
        - cp_transport_h
        - cp_air_p
        - cp_air_h
      output: "converted_raw_totals"
      source_ids:
        - ilcd-2010
    - id: production_vectors
      applies_to: "all inventory rows"
      rule: "For each exchange i and cohort retain inherited opening WIP plus converted current additions and attributed source history; remove closing WIP and proven transfers to other functions on the same vector basis. Apply section 7 subdivision and exchange-specific attribution before normalization. Preserve separate failure/start-stop/idle/cleanup ledgers and all actual internal rework transfers; cancel paired internal transfers."
      inputs:
        - converted_raw_totals
        - opening_WIP_vectors
        - closing_WIP_vectors
        - cp_wip
        - cp_attribution_p
        - cp_attribution_h
      output: "attributed_production_vectors"
      source_ids:
        - ilcd-2010
    - id: physical_gates
      applies_to: "all material rows"
      rule: "For production: opening WIP + actual external material entries = closing WIP + newly first-released Qc + real external material exits, with paired rework transfers separately reconciled. For FG: opening FG + paired Qc + actual external returned powder = closing FG + gross physical V + actual material losses, with paired internal rework separately reconciled. Combine by cancelling the Qc and internal rework transfers. Whole-compound mass, water and measured element balances are independent; packaging and assets have their own physical ledgers. An extra real entry or exit appears exactly once on its actual side, not as a residual duplicate."
      inputs:
        - cp_receipt
        - cp_release
        - cp_wip
        - cp_fg
        - cp_residues_p
        - cp_residues_h
      output: "physical_gate_reconciliation"
      source_ids:
        - ilcd-2010
    - id: packaging_ledger
      applies_to: "all packaging rows"
      rule: "For each physical packaging construction: opening empty/WIP-attached/FG-attached/reusable + external acquisition P + external return received ER = closing empty/WIP-attached/FG-attached/reusable + S accompanying gross physical dispatch + EO external return out + waste W. Identify incoming attached packaging within its actual P or ER receipt partition exactly once; acquisition within a whole supplied consignment does not create another manufacture purchase. Internal reuse and transfers cancel. PE bag, wood pallet, paper label and liner stay separate; supplier whole-label mass and its component split are non-additive. New manufacture and incremental reuse effort are separate from this physical equation."
      inputs:
        - cp_pack_p
        - cp_pack_h
      output: "individual_packaging_reconciliation"
      source_ids:
        - ilcd-2010
    - id: cohort_vectors
      applies_to: "all inventory rows"
      rule: "For original release cohort c preserve its attributed production vector once, including the portion already in closing FG; add only actual incremental service/rework/treatment vectors observed within H to the same c. Keep historical opening-FG vectors with their own Qc and reverse the original shipment attribution for actual returns. Do not add paired internal Q transfer as another production burden. The resulting unnormalized exchange vector is A_i_c. H is coverage time; V is gross physical dispatch."
      inputs:
        - attributed_production_vectors
        - cp_fg
        - cp_attribution_p
        - cp_attribution_h
        - cp_utilities_h
        - cp_pack_h
      output: "A_i_c"
      source_ids:
        - ilcd-2010
    - id: per_reference
      applies_to: "all inventory rows"
      rule: "For Qc > 0 calculate x_i_c = A_i_c / Qc exactly once. A_i_c is the converted and attributed raw numerator for exchange i of original first-release cohort c; Qc is that cohort newly first-released net as-received powder mass in kg. Flow-card amount instructions and protocol aggregation labels refer to this one result; they perform no other division. For Qc = 0 retain A_i_c and physical stocks with the failed/unreleased lot and report no unit result."
      inputs:
        - A_i_c
        - Qc
        - cp_release
      output: "x_i_c"
      source_ids:
        - ilcd-2010
  data_quality_requirements:
    - id: dq_origin
      applies_to: "received_epdm"
      requirement: "Retain generating-site operation, formulation and cure evidence, source segregation and real value/fee history; no isotope, virgin polymer, tyre-only or hard-rubber substitution."
      evidence: "supplier declarations and source records"
    - id: dq_acceptance
      applies_to: "released_powder"
      requirement: "Require actual PSD, moisture, contamination and receiver tests for one declared powder grade. No public marketing percentage or example batch size is a foreground measurement."
      evidence: "calibration and representative sampling records"
    - id: dq_all_activity
      applies_to: "all inventory rows"
      requirement: "Cover complete declared production and cohort service horizons with failed, Q=0, startup/shutdown, idle, cleaning and rework periods; retain opening/closing WIP and FG vectors, physical stocks and uncertainty."
      evidence: "time logs and stock/lot genealogy"
    - id: dq_native
      applies_to: "all UUID-bearing rows"
      requirement: "Retain full native descriptors and a compatible actual provider: origin, route, grade, form, geography, medium, type and every property. An isolated classification anomaly is disclosed; a real physical contradiction rejects the binding."
      evidence: "complete identity and supplier compatibility evidence"
    - id: dq_gaps
      applies_to: "conditional and unresolved rows"
      requirement: "Record each actual occurrence or evidenced absence. Missing measurements and auxiliary UUIDs remain explicit; do not replace an exchange with a plural collection, zero, invented factory value or another chemical. Add every actual additional species/material separately."
      evidence: "occurrence/absence register and gap plan"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference product and feed"
    rule: "Require source-segregated non-hard vulcanized black EPDM manufacturing scrap and one mechanically micronized powder with actual PSD and receiver tests. Reject tyre sourcing, hard rubber, raw/uncured polymer, chemically reclaimed rubber, powder/granule selectors or arbitrary grade equivalence. Each confirmed UUID must satisfy all its native physical, route, state, type, unit and provider restrictions, not classification/name alone."
    source_ids:
      - prismi-production
      - prismi-epdm
      - un-cpc-3-2025
  - rule_id: v_basis
    applies_to: "all inventory rows"
    rule: "Check original units and real rate integration before attribution and one final division by original Qc. First-release closing FG is already in Qc. Keep service H, gross V, shipment reversal, opening/closing WIP and FG vectors consistent across both languages and all gates. With Qc=0 retain actual burdens and report no per-unit result."
    source_ids:
      - ilcd-2010
  - rule_id: v_closure
    applies_to: "physical ledgers"
    rule: "Close physical compound, water, relevant element and each individual packaging ledger independently with stated measurement uncertainty. No forced residual can simultaneously fill moisture and dust loss, omitted species, missing stocks or an unrecorded extra material. Keep transferred whole mixtures and non-additive composition partitions consistent with one provider."
    source_ids:
      - ilcd-2010
  - rule_id: v_evidence
    applies_to: "dataset"
    rule: "Retain complete primary evidence, actual foreground records, calibrated instruments, all conditional occurrence/absence decisions and gaps. Marketing percentages, catalogue pack capacities and example methods are not site values. Engineering checks do not establish scientific, translation, classification-mapping or publication approval."
    source_ids:
      - ilcd-2010
      - prismi-services
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "One actual recovered EPDM powder supply for compatible industrial compounding/filler use with verified grade and provider"
  allowed_use: "Declared attributional source route, actual measured PSD and composition, first-release Qc and observed service H with retained histories"
  excluded_use: "Universal CPC coverage; virgin EPDM substitution; tyre treatment; devulcanized rubber; unspecified powder/granule choice; guaranteed recycled fraction or credit; unobserved future activities"
  required_metadata: "All reference qualifiers; source and route; geography and period; supplier and native restrictions; reference cohort and stocks; every conditional occurrence; external treatment scope"
  required_quality_disclosure: "Scientific and translation review state; gaps and uncertainty; foreground coverage; retained/excluded histories; allocation evidence; actual utility and packaging construction; failed and Q=0 activity; observed H versus future scope"
  update_trigger: "Changed source formulation or cure; route or equipment; PSD/receiver specification; provider/utility state; recycling value interface; monitoring or packaging; material findings"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 Structure and Explanatory Notes (30 June 2025), subclass 39250 and adjacent 39260; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification boundary includes powders/granules from non-hard rubber scrap; it does not define a recycling technology or approve a mapping."
  - id: "prismi-production"
    type: "handbook"
    reference: "Prismi, Recycled Rubber Production: Granules, Powders and Acoustic Rolls, undated; https://www.prismi.it/en/recycled-rubber-production/"
    used_for: "Primary pre-consumer vulcanized industrial scrap and EPDM powder production; sorting by compound and distinction from granules/rolls. Qualitative process evidence only."
  - id: "prismi-mechanical"
    type: "handbook"
    reference: "Prismi, Fine rubber powder SBR EPDM NBR HS65 CR IIR, undated; https://www.recycled-rubber-powder.com/"
    used_for: "Wholly mechanical high-friction impact pulverization; no adopted advertised surface area, reuse fraction, cost saving or site energy factor."
  - id: "prismi-epdm"
    type: "handbook"
    reference: "Prismi, Micronized EPDM Rubber Powder, undated; https://www.recycled-rubber-powder.com/portfolio/epdm-rubber-powder/"
    used_for: "Black EPDM micronized powder identity and variable compound formulation; no adopted promotional test percentages, monomer fraction or unaccessed data sheet."
  - id: "prismi-services"
    type: "handbook"
    reference: "Prismi, Rubber recycling service into fine rubber powder, undated; https://www.recycled-rubber-powder.com/rubber-recycling-services/"
    used_for: "Laboratory particle-size/density analyses and logistics/toll-service distinction. No supplier login-only specification is assumed."
  - id: "assco-granulate"
    type: "handbook"
    reference: "ASSCO, EPDM rubber granulate, undated; https://www.asscorecycling.cz/epdm-crumb-rubber"
    used_for: "Independent technical-production scrap route comparator for separation, grinding, sieving and PE bag supply; granulate batch size, waiting period, size grades and pack capacities are not powder defaults."
  - id: "toyota-recycling-2003"
    type: "literature"
    reference: "Fukumori and Matsushita, Material Recycling Technology of Crosslinked Rubber Waste, Toyota CRDL R&D Review 38(1), 2003, pp.39–46; https://www.tytlabs.co.jp/en/english/review/rev381epdf/e381_039fukumori.pdf"
    used_for: "Counterevidence: crushing precedes reactive devulcanization and reclaimed rubber; mechanical powder alone is not that terminal product. No reaction settings or yields are imported."
  - id: "ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA: Detailed guidance, first edition March 2010, sections 7.9.2–7.9.3 and Annex C 14.2–14.4; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision, exchange-specific determining physical causality and genuine residual market allocation; recycling source-history boundary and methodological collection/accounting requirements. No fixed recovery rate or substitution credit."
