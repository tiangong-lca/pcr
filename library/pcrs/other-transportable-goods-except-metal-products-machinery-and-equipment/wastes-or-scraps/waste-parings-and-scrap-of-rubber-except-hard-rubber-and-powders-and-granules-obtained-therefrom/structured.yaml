allocation_rules:
  - rule_id: a_subdivide
    applies_to: "all shared operations"
    rule: "This is attributional product-supply modelling. First assign dedicated collection, sorting, milling, capture, packaging, testing and services to their actual function, using independent metering or justified virtual subdivision. Waste-treatment services and saleable separated outputs are distinct functions where actually present; do not rename a toll service as powder supply."
    source_ids:
      - ilcd-2010
  - rule_id: a_causality
    applies_to: "remaining shared exchanges"
    rule: "For each remaining shared exchange determine the physical relationship that actually causes its quantity: material lineage, independently metered work, real size-reduction work or another demonstrated driver as appropriate. Test that relationship exchange by exchange. A total mass share, electricity share or price share is not automatically causal; never apply one arbitrary split to all exchanges."
    source_ids:
      - ilcd-2010
  - rule_id: a_residual
    applies_to: "genuinely inseparable residual"
    rule: "Only when subdivision and determining physical causality leave a genuine residual, allocate that residual using contemporaneous market values of the actual co-functions in their exact technical state at the common process boundary, including an actual treatment-service fee when relevant. Document why earlier steps cannot resolve it, price/quantity periods and sensitivity. Never import a fixed recycling rate, substitution credit or choice between arbitrary physical/economic options."
    source_ids:
      - ilcd-2010
  - rule_id: a_material_history
    applies_to: "source and recycled inputs"
    rule: "Apply the declared Annex C recycling decision to the true joint process and actual source value state. For a positive-value generated scrap, document upstream co-production attribution; for a negative-value input, identify actual treatment and interface that crosses the zero-value border before assigning histories. Any justified zero contribution is a conclusion with evidence and matching paired boundary, never a preset for untreated material. Do not assume the example multi-loop recovery rates or number of uses."
    source_ids:
      - ilcd-2010
  - rule_id: a_reuse
    applies_to: "internal returns; FG; packaging"
    rule: "Internal oversize return, reusable packaging and previously released returned powder retain their original vectors. Count only actual incremental regrinding, cleaning, handling and losses once; retain shipment reversals. No material is purchased twice because it circulates, and no reuse event creates a coproduct or negative inventory credit. Shared assets use documented lifetime activity shares whose cumulative attribution is checked."
    source_ids:
      - ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_receipt
      process_id: "p_recovery"
      flow_role: "received_epdm"
      record_type: "source and weighing records"
      raw_fields: "generator; operation; polymer/cure/formulation; whole gross and tare; material state; composition; moisture; contamination; legal state; source value and fee; upstream exchange vector; collection interface"
      collection_method: "Use calibrated holder/receipt scales and representative composition/moisture sampling with supplier formulation genealogy. Keep whole material and packaging separate; retain carbon black/filler/oil only as constituents of the whole compound. Reconcile source segregation and actual transport interfaces. Collect unnormalized raw records only; final basis is stated in aggregation_rule."
      unit: "kg"
      frequency: "each consignment"
      temporal_coverage: "Complete production and original-cohort observed H including failures and no-output intervals"
      site_scope: "Named generator/recovery site and each actual contracted interface; same original cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original units; tickets and signed lot logs; uncertainty; independent sampling; gap/absence evidence"
    - protocol_id: cp_release
      process_id: "p_recovery"
      flow_role: "released_powder"
      record_type: "first-release tests and weighing"
      raw_fields: "lot; first release id and time; prior-release flag; net powder; bag/label/pallet tare; actual PSD; method/sieve apertures; moisture/dry solids; contamination; receiver limits; acceptance decision; Qc"
      collection_method: "Calibrated net weighing and representative sieve/particle-size and moisture tests on the actual finished powder; use the recorded receiver agreement and cure/polymer genealogy. Resolve conditional acceptance before Qc. No constant purity, PSD, bulk density or factory rate is supplied. Collect unnormalized raw records only; final basis is stated in aggregation_rule."
      unit: "kg"
      frequency: "each first-release lot"
      temporal_coverage: "Complete production and original-cohort observed H including failures and no-output intervals"
      site_scope: "Named generator/recovery site and each actual contracted interface; same original cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original units; tickets and signed lot logs; uncertainty; independent sampling; gap/absence evidence"
    - protocol_id: cp_utilities_p
      process_id: "p_recovery"
      flow_role: "electricity; industrial water; clean external water return"
      record_type: "phase meters"
      raw_fields: "stage; cohort; meter; beginning/end; raw unit; actual rate/time; voltage and country; supplier boundary; cleanup/idle/failure; water temperature and state; independently measured density; clean-loop stock; return mass and enthalpy"
      collection_method: "Meter production separately by stage and reconcile bills. Retain integrated readings distinctly from rates. Measure cooling makeup, losses, purge and actual external clean return independently; preserve supplier water/heat agreement. Electric indirect cooling does not imply liquid nitrogen, steam, boiler or combustion. Collect unnormalized raw records only; final basis is stated in aggregation_rule."
      unit: "MJ; kg"
      frequency: "each stage interval"
      temporal_coverage: "Complete production and original-cohort observed H including failures and no-output intervals"
      site_scope: "Named generator/recovery site and each actual contracted interface; same original cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original units; tickets and signed lot logs; uncertainty; independent sampling; gap/absence evidence"
    - protocol_id: cp_pack_p
      process_id: "p_recovery"
      flow_role: "each PE bag; each wooden pallet; each paper label; each liner; each actual additional packaging article"
      record_type: "individual packaging ledger"
      raw_fields: "packaging construction; empty/WIP-attached/FG-attached/reusable opening and closing; new P; external return received ER; inbound attached packaging; S accompanying gross dispatch; external return out EO; waste W; internal reuse; independent component mass; damage; original burden"
      collection_method: "Count and weigh each construction separately in production. Reconcile receipts, inventories and every departure including returns; measure kg per item only from actual representative article weighing. New manufacture burden and incremental reuse effort are distinct from physical reuse. Never set returned packaging equal to new purchases. Collect unnormalized raw records only; final basis is stated in aggregation_rule."
      unit: "kg"
      frequency: "each movement and stocktake"
      temporal_coverage: "Complete production and original-cohort observed H including failures and no-output intervals"
      site_scope: "Named generator/recovery site and each actual contracted interface; same original cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original units; tickets and signed lot logs; uncertainty; independent sampling; gap/absence evidence"
    - protocol_id: cp_residues_p
