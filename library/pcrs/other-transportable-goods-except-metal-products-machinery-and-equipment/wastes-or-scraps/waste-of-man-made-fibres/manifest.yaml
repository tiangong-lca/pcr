  native_identity_limits:
  - Reference generic man-made-fibre waste Product flow specifies no PET CAS, grade or treatment; full PET/source/finish/moisture/unopened
    restrictions are carried in reference qualifiers and terminal/internal cards.
  - CN below-1-kV consumption electricity uses native energy property in MJ; other geography/voltage needs another
    provider.
  - Tap water has Mass reference and a secondary volume factor; it is not independent density evidence.
  - Paper core and PE bag identify complete articles only; actual supplier, composition and tare still need matching.
  - PET reject native comments explicitly include textiles despite plastics classification; no bottle/flake/particle/route
    substitution follows.
  - Prepared PET filament native candidate has ambiguous bilingual reaction-route wording; mesh fabric, farm twine/seed
    bag, fixed-calorific oil and discharge-to-water cleaning wastewater are not adopted as mismatched substitutes.
  ordinary_gaps:
  - Actual foreground quantities, measured moisture/finish, supplier configurations, acceptance limits, meter states,
    WIP/FG vectors and prices remain collection requirements.
  - Unbound exact oil grade, PP band, paper/PE/PP waste, PET particulate, water-vapour and external-treatment cleaning-water
    identities remain individually named.
