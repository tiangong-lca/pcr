    - Technical synthesis from independent primary industrial product/process evidence and official method guidance;
      not a single SKU/plant inventory.
    - Scope only source-confirmed PET continuous-filament weaving selvedge in the declared undyed unsized dry-handled
      unopened branch. Primary typical wording is not actual lot certification.
    - No factory quantities, densities, universal moisture/finish values, yields, allocation shares or zero-waste
      burden invented.
    - A real endpoint, composition or source-process evidence gap in an actual application remains inconclusive;
      ordinary unbound auxiliary/provider identities are not automatically a core methodology hold.
  semantic_boundary_decision:
    decision: retain_existing_identity_with_narrow_material_scope
    rationale: Separate complete material-scope reviews of fixed REF47 (1317) and independent upstream reference
      (1476), plus identical current/REF47 canonical English hashes, found no existing residual PET yarn source-to-feedstock
      method. Qualified-yarn, PET greige-fabric, virgin staple, opened/prepared fibre and wool-noil methods have
      different reference endpoints and do not govern waste acceptance/source-burden inheritance. Reuse their generic
      accounting concepts only; no other identity is adopted.
