      collection_method: "Keep storage/handling/loading/repacking as raw H of the original release cohort, with every packaging movement also in cp_pack. Retain old-stock burdens, original dispatch reversal and real incremental rework. Join H only to its Qc before the single final calculation; no division in this collection step and no added production."
      unit: "kg; MJ; m3"
      frequency: "each service event and stock cutoff"
      temporal_coverage: "Complete declared cohort and opening/closing period"
      site_scope: "Declared supply service site and original released cohort"
