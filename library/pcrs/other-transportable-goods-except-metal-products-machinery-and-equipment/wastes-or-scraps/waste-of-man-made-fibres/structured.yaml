      raw_fields: "component; material; opening_empty; opening_attached_WIP_FG; opening_reusable; purchase; external_return_received; closing_empty; closing_attached_WIP_FG; closing_reusable; gross_outbound; external_return_out; waste; internal_reuse; provider_inclusion; measured_item_mass"
      collection_method: "For each paper core, PE bag and PP band separately: opening empty + attached WIP/FG + reusable + external purchases + external returns received = closing empty + attached WIP/FG + reusable + packaging on gross physical dispatch + external returns out + waste. Internal reuse cancels. Track inbound supplier-attached supply once and empty/core Product returns separately. Count-to-mass uses a measured configuration sample; never invent a per-item kg."
      unit: "kg; item"
      frequency: "each component movement and cutoff"
      temporal_coverage: "Complete declared cohort and opening/closing period"
      site_scope: "Declared supply service site and original released cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original logs; calibration; composition; acceptance; provider boundary; uncertainty"
    - protocol_id: cp_waste
      process_id: "p_source"
      flow_role: "source_pet_reject; spent_loom_oil"
      record_type: "weighing"
      raw_fields: "row_id; composition; source_lot; gross; tare; net; moisture; status; destination; treatment; return_or_disposal; failed_run"
      collection_method: "Weigh each atomic waste including failed/cleanup lots; retain actual treatment receipt, composition and stock changes. No disappearance of unknown waste or zero production burdens."
      unit: "kg"
      frequency: "each waste movement"
      temporal_coverage: "Complete declared cohort and opening/closing period"
      site_scope: "Source weaving site and matched source cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original logs; calibration; composition; acceptance; provider boundary; uncertainty"
    - protocol_id: cp_prepare_waste
