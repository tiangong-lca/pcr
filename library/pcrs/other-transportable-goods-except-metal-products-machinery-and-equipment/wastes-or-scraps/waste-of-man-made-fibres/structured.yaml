measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the sum of unique newly positive first-release net masses from cp_release after sorting and packing. Include actual moisture and inherited finish; subtract every packaging tare. Retests, regrades, stock transfers, dispatch and returned previously released lots do not increase Q."
  - id: whole_supply
    applies_to: "pet_yarn"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Purchase/issue complete supplied yarn once. Assayed PET, supplier finish and carrier water are constituent subledgers, not additional purchased inputs. Separately procured auxiliaries need their own atomic rows."
  - id: unit_conversion
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Original measured property"
      uuid: ""
    required_unit: "kg; MJ; m3"
    rule: "Convert raw quantities before attribution: kWh to MJ uses 3.6; integrate actual rates once over their measured interval. Already integrated volumes are not multiplied by time. Volume-to-mass needs independently evidenced material-specific density at the measured state; no water density for oil/air and no kg per item assumption."
  - id: physical_components
    applies_to: "physical ledgers"
    required_property_ref:
      name: "Mass and actual composition"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile whole mass and PET, water and actual finish separately. No reaction water or polymer conversion is assumed in this mechanical route. Free water, phase change and inherited moisture differ from chemically bound water. Never fit two unknown losses with one balance residual or translate COD/VOC indicators into a named chemical mass."
