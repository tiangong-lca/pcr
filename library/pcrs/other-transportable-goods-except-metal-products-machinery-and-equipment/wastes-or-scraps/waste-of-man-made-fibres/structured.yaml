allocation_rules:
  - rule_id: allocation_scope
    applies_to: "multifunctionality"
    rule: "This is attributional accounting only for cases requiring allocation, consistent with the chosen study decision context. Industrial process evidence and a price sign do not themselves establish an allocation rule or legal waste/end-of-waste status."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_dedicated
    applies_to: "all exchanges"
    rule: "First subdivide or virtually subdivide measured source operations and separate exclusive fabric-only operations from residue-only collection/sorting/packing. Assign identifiable yarn embodied in each physical output and dedicated activities to that output; retain non-valued losses and their causal burdens. Embodied mass assignment is not permission to mass-allocate every remaining exchange."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_causality
    applies_to: "remaining common exchanges"
    rule: "For every remaining exchange independently identify the determining physical causal relationship. Metered operating demand and limiting volume/mass with duration may support particular services only with site evidence. A shared mass fraction, common electricity meter or arbitrary physical/economic choice is insufficient. Preserve exchange-specific shares, denominators, failed-operation burdens and uncertainty across all outputs."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_residual
    applies_to: "unresolved common-process residual only"
    rule: "Only a genuine residual without a determining physical relation uses contemporaneous market value of every co-function at the same common-process gate in its actual condition. Derive gate-equivalent prices transparently if only later sorted/packed/transported prices exist. Document all quantities, price period/currency, output status, residual exchange list and sensitivity. Undefined or zero total value, negative-value service ambiguity or absent prices remains unresolved; no fixed ratio, arbitrary equal shares or automatic zero burden."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_once
    applies_to: "source burden and transfers"
    rule: "Carry each allocated source exchange vector with separated residue through T and WIP once. Choose an explicit joint-source representation or an inherited upstream vector for that same source segment, never both. Subsequent exclusive sorting/packing adds its real burden. Gross output V and mass-balance records stay unallocated; allocation shares alter attributable inventory A, not physical material amounts."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_no_credit
    applies_to: "reuse and treatment"
    rule: "Internal reuse cancels with its inherited vector and incremental rework retained. Recycling destination does not establish avoided virgin PET credit. Waste-treatment inputs, exported secondary materials, reusable packaging and services remain separate. A downstream consequential or substitution study needs its own method and cannot silently change this inventory."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "p_prepare"
      flow_role: "accepted_pet_waste"
      record_type: "weighing"
      raw_fields: "lot_id; first_release_id; first_release_time; gross_mass; each_tare; net_mass; moisture; finish_content; PET_analysis; receiver_acceptance; repeat_flag"
      collection_method: "Calibrated weighing and composition testing at actual packed feedstock acceptance; retain full certificates and exclude repeats. Record raw masses, not unit inventory."
      unit: "kg"
      frequency: "each lot and first release"
      temporal_coverage: "Complete declared cohort and opening/closing period"
      site_scope: "Dedicated preparation site and matched source/first-release cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original logs; calibration; composition; acceptance; provider boundary; uncertainty"
    - protocol_id: cp_material
