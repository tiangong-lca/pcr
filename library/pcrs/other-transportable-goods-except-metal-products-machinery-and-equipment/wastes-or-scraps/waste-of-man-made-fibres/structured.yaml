      raw_fields: "species; polymer_fraction; particle_form; medium; concentration; integrated_gas_volume; actual_gas_rate; interval; moisture_change; inlet; outlet; captured_mass; uncertainty; detection_limit"
      collection_method: "Use independent composition-resolved monitoring and state-matched gas volume; multiply concentration by integrated volume once or integrate a rate once. Captured lint, total PM, water evaporation and actual other chemicals are distinct. Unknown composition remains unquantified rather than a fabricated species."
      unit: "kg; m3"
