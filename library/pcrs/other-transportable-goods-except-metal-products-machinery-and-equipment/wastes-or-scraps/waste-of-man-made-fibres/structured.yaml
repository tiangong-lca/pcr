system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "p_source; p_prepare"
      rule: "Include source yarn receipt, warping and loom preparation, actual weaving and selvedge cutting/separation, dedicated collection, sorting, inspection and real packing. Track both source fabric and waste. A bought-waste repacking model cannot replace this chain."
      source_ids:
        - jrc-textiles-2023
        - getzner-polyester-2024
        - namphong-yarn-waste
    - rule_id: boundary_branch
      applies_to: "product and route"
      rule: "Use only source-confirmed PET filament residue in the declared undyed, unsized and unopened branch. Size/dye/other-polymer, water-jet wet residue, fabric clips and opened fibre require a different applicability review. Missing condition evidence is unresolved; do not code it as absent."
      source_ids:
        - jrc-textiles-2023
        - namphong-yarn-waste
        - hising-polyester-selvedge
    - rule_id: boundary_completeness
      applies_to: "all processes"
      rule: "Retain failed and zero-output runs, starts/stops, idle, cleaning, changeovers, rejects and actual rework. Add each actually present input, waste or emitted species as a separately named atomic row with a protocol before asserting completeness. No catch-all other input/output or automatic zero allowance is permitted."
      source_ids:
        - jrc-textiles-2023
    - rule_id: boundary_utilities
      applies_to: "electricity; air; water; heat"
      rule: "Use one provider for each utility. If compressed air is purchased, include that supply once; if generated on site, collect compressor electricity and actual cooling water/oil/condensate as separate exchanges and cancel internal air, rather than adding a purchased-air burden. No boiler, steam, fuel combustion, heat return or condensate return is presumed. Any actual external heat/water return needs a separate Product return with state/enthalpy and the supplier agreement."
      source_ids:
        - jrc-textiles-2023
    - rule_id: boundary_stock
      applies_to: "Q; WIP; FG; V"
      rule: "Q is newly first released output. Closing FG already contains any Q still held, so never add closing FG to Q as another manufacturing output. Maintain opening FG + Q + external returns received = closing FG + gross physical dispatch V + actual FG losses/transfers. A returned old lot and its original dispatch/reversal retain original cohort burdens; only real incremental repair adds burden, not production."
      source_ids: []
    - rule_id: boundary_services
      applies_to: "p_supply"
      rule: "Keep storage, handling, loading and any repacking after first release in a raw service journal H by original cohort Qc. Join H to that cohort inventory before its one normalization. H is not divided here, cannot be assigned to current Q merely because an old lot ships now, and cannot create a second reference output. Combine gates by cancelling internal released-material transfers."
      source_ids: []
    - rule_id: boundary_native
      applies_to: "UUID-bearing rows"
      rule: "The reference UUID is a generic Product flow with unspecified treatment, no PET CAS or grade and no moisture/finish guarantee. It identifies only man-made fibre residue; all PET/source/unopened/supply restrictions in §3 and accepted_pet_waste remain compulsory. The PET reject Waste flow explicitly also covers textiles despite its plastics classification; this classification difference does not make bottle flakes or resin eligible."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Complete purchased PET filament yarn at the source weaving-site gate, including its actual finish/moisture and incoming packaging; follow the source residue to the same declared acceptance condition"
  starting_condition_role: "Physical source-process input, not purchased finished waste feedstock"
  product_classification_scope: "Narrow unopened PET weaving-yarn waste within CPC 3.0:39216"
  recursive_input_rule: "Same-category internal residue/rework carries its original per-exchange burden vector and cancels internally. External same-category waste is outside this source-generation branch unless origin and inherited burden are reconstructed without repeating source manufacture."
  upstream_dataset_requirement: "One compatible upstream provider per purchased exchange with actual boundary, polymer, finish, route, geography and time; include upstream yarn manufacture exactly once. Document whether incoming cores/transport are included before adding them."
  disclosure: "Disclose all source weaving, separation, sorting, acceptance, WIP/FG and post-release service gates, output status and upstream exclusions; foreground completeness is not cradle-to-gate completeness."
