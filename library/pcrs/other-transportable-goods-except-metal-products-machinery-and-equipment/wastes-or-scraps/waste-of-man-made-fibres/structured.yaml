      flow_role: "prepare_pet_reject"
      record_type: "weighing"
      raw_fields: "row_id; composition; source_lot; gross; tare; net; moisture; status; destination; treatment; return_or_disposal; failed_run"
      collection_method: "Weigh each atomic waste including failed/cleanup lots; retain actual treatment receipt, composition and stock changes. No disappearance of unknown waste or zero production burdens."
      unit: "kg"
      frequency: "each waste movement"
      temporal_coverage: "Complete declared cohort and opening/closing period"
      site_scope: "Dedicated preparation site and matched source/first-release cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original logs; calibration; composition; acceptance; provider boundary; uncertainty"
    - protocol_id: cp_water
      process_id: "p_source"
      flow_role: "source_water; ancillary_cleaning_water"
      record_type: "water_balance"
      raw_fields: "supply; quality; meter; mass; integrated_volume; actual_rate; interval; temperature; density_evidence; wastewater_mass; water_fraction; actual_solutes; destination; losses"
      collection_method: "Collect raw water supply and whole cleaning solution separately; distinguish integrated quantity from rate and measure independent density/state if converting. Identify external treatment versus actual environmental discharge without using COD as a solute mass."
      unit: "kg; m3"
      frequency: "each actual cleaning and meter interval"
      temporal_coverage: "Complete declared cohort and opening/closing period"
      site_scope: "Source weaving site and matched source cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original logs; calibration; composition; acceptance; provider boundary; uncertainty"
    - protocol_id: cp_air
      process_id: "p_source"
      flow_role: "source_air"
      record_type: "meter"
      raw_fields: "provider; external_or_internal; pressure; temperature; dryness; oil_grade; metered_volume; standard_or_actual_basis; rate; time; compressor_boundary; condensate"
      collection_method: "Measure actual state-specific m3 or integrate a real rate once; any normal-volume conversion needs declared conditions and independent physical evidence. Distinguish purchased supply and internal compressor inputs; collect real condensate and cooling-water returns separately when present."
      unit: "m3"
      frequency: "each use and meter interval"
      temporal_coverage: "Complete declared cohort and opening/closing period"
      site_scope: "Source weaving site and matched source cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original logs; calibration; composition; acceptance; provider boundary; uncertainty"
    - protocol_id: cp_emission
      process_id: "p_source"
