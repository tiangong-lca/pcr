      quality_evidence: "Original logs; calibration; composition; acceptance; provider boundary; uncertainty"
  calculation_rules:
    - id: calculate_q
      applies_to: "accepted_pet_waste"
      rule: "Q = sum of unique newly positive first-release net masses after actual tare deduction. Link each physical release once to its cohort; never add closing FG or reinspection to Q."
      inputs:
        - cp_release
        - cp_physical
        - cp_prepare_physical
        - cp_supply_physical
      output: "Q"
      source_ids: []
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert each original record into its stated numerator unit, retaining rate/integrated distinction and state evidence. Apply the measured exchange-specific attribution hierarchy to source burdens; keep full gross physical quantities in parallel."
      inputs:
        - cp_material
        - cp_energy
        - cp_prepare_energy
        - cp_water
        - cp_air
        - cp_emission
        - cp_prepare_emission
        - cp_pack
        - cp_prepare_pack
        - cp_supply_pack
        - cp_waste
        - cp_prepare_waste
        - cp_physical
        - cp_prepare_physical
        - cp_supply_physical
      output: "converted raw exchange ledgers"
      source_ids:
        - ilcd-attributional-2010
    - id: assemble_a
      applies_to: "all inventory rows"
      rule: "A_i = inherited opening-WIP attributable vector_i + attributable current source/dedicated exchange_i - inherited closing-WIP vector_i + matched original-cohort raw H_i. Carry released Q burden into FG once; closing FG is not a second manufacturing deduction/addition. Track previous cohorts separately. Internal T/rework vectors cancel on combination; no duplicate source provider."
      inputs:
        - cp_transfer
        - cp_prepare_transfer
        - cp_physical
        - cp_prepare_physical
        - cp_supply_physical
        - cp_service
        - "converted raw exchange ledgers"
      output: "A_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calculate_inventory
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q is the sole final unit-inventory calculation for Q greater than zero. Physical diagnostic transfer/co-output amounts use their unallocated gross numerator / the same Q once, without applying burden shares. The reference output is 1 kg. Cards and aggregation declarations only reference this single calculation; they do not divide again. For Q=0 retain unnormalised A, H, physical ledgers and stocks, issue no unit result."
      inputs:
        - A_i
        - Q
        - cp_physical
        - cp_prepare_physical
        - cp_supply_physical
      output: "x_i and gross physical diagnostics per 1 kg reference flow"
      source_ids: []
    - id: reconcile_gates
      applies_to: "all processes"
      rule: "At each manufacturing gate: opening WIP + full physical inputs = closing WIP + actual physical outputs/losses. Reconcile FG with boundary_stock and each packaging component with cp_pack. Combined gates cancel internal T, rework and released Q movements; gross dispatch V remains distinct from new production Q. Independently check PET, finish and water without invented residual species."
      inputs:
        - cp_physical
        - cp_prepare_physical
        - cp_supply_physical
        - cp_pack
        - cp_prepare_pack
        - cp_supply_pack
        - cp_transfer
        - cp_prepare_transfer
        - cp_water
        - cp_emission
        - cp_prepare_emission
      output: "gate balances and uncertainty"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "reference and inputs"
      requirement: "Whole primary documents and actual supplier/source/receiver records must support polymer, physical form, treatment and acceptance; classification and generic native identity alone do not."
      evidence: "PET analysis; supplier TDS/SDS; source and receiver records"
    - id: quality_period
      applies_to: "all records"
      requirement: "Use matching site/cohort/period and retain zero-output, failed, start-stop, idle, cleanup and rework. Bound all stock changes with inherited vectors and measurement uncertainty."
      evidence: "raw logs; opening/closing stock sheets; calibration"
    - id: quality_allocation
      applies_to: "source multifunctionality"
      requirement: "Retain subdivision feasibility, per-exchange determining physical drivers, residual gate-matched price evidence and sensitivity; no fixed allocation/default zero residue burden."
      evidence: "ilcd-attributional-2010; site attribution worksheet"
    - id: quality_sources
      applies_to: "external sources"
      requirement: "Sources establish qualitative method and product/process existence only. No source supplies a default recipe, emission, oil dose, moisture, machine weight, yield or factory consumption. Typical clean/undyed wording and a pilot recycling example do not prove every lot or commercial performance."
      evidence: "jrc-textiles-2023; getzner-polyester-2024; namphong-yarn-waste; hising-polyester-selvedge"
    - id: quality_gaps
      applies_to: "unresolved identities and conditions"
      requirement: "Keep each unbound atomic name and actual uncertainty visible. Ordinary provider/auxiliary gaps require later matching, while a true product, endpoint or method evidence gap blocks conformity and must remain draft/inconclusive."
      evidence: "manifest review metadata; explicit data-package findings"
validation_rules:
  - rule_id: validate_scope
    applies_to: "product and source"
    rule: "Verify the complete §3 qualifier list against supplier certificates, process logs, physical inspection and the receiving specification. PET must be demonstrated, not inferred from the word polyester. Excluded treatment or an unresolved true endpoint/source condition prevents a conforming result."
    source_ids:
      - jrc-textiles-2023
      - namphong-yarn-waste
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Reference row is exactly 1 kg matching the declared first-release Q; all other rows use the same cohort denominator once after raw conversion and attribution. For Q=0 retain raw burdens, WIP and failure reasons, and issue no unit result."
    source_ids: []
  - rule_id: validate_mass
    applies_to: "source; preparation; supply; combined gate"
    rule: "Reconcile full unallocated physical mass and independent PET/water/finish subledgers at each gate and combined gate with internal T/rework/Q transfers cancelled. Do not balance allocated A against gross physical outputs, duplicate closing FG, invent reaction water or infer species from total dust/COD. Report measured residuals and uncertainty."
    source_ids: []
  - rule_id: validate_packaging
    applies_to: "each packaging component"
    rule: "Individually close the complete cp_pack six-leg ledger including attached WIP/FG, gross dispatch, external returns and waste. Reconcile product tare without adding packaging to Q or turning reuse into new procurement or a co-product credit."
    source_ids: []
  - rule_id: validate_native
    applies_to: "all UUIDs"
    rule: "Use verified flow type, every native basename/synonym/comment, CAS, treatment, state, geography, medium and property facets. Preserve reference-property → unit-group → actual unit compatibility; a generic flow is not evidence of a supplier match. Leave incompatible or unresolved atomic identities blank and disclose them."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "data package"
    rule: "Report accepted input, checks performed, skipped scope, findings and completeness separately. Missing records, unresolved conditions, unknown species and unclosed balances are not passes. Engineering checks do not approve science, translation, mapping or publication."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "One declared unopened PET weaving-residue cohort as recycling feedstock, with verified source and foreground boundaries"
  allowed_use: "Attributional source-generation and preparation inventory with disclosed compatible upstream links and pending methodology review"
  excluded_use: "Other fibre families or blends; PET flakes/resin; opened/regenerated fibre; arbitrary waste cut-off or substitution credit; legal end-of-waste certification"
  required_metadata: "PET polymer evidence and fibre fractions; source mill and weaving operation; filament construction and yarn grade; virgin/recycled origin and supplier route; undyed and unsized confirmation; supplier finish identity and measured content; moisture method and weighing state; unopened yarn-remnant form; foreign-material analysis and acceptance limits; source collection and sorting route; receiving recycler specification and intended route; first-release lot/time and unique release identifier; net mass and packaging tare; site and reporting period; electricity country and voltage; allocation drivers and output status; WIP/finished-stock quantities and inherited exchange vectors; gross dispatch and external returns; packaging component ledgers; unresolved UUID/provider restrictions"
  required_quality_disclosure: "Q gate; raw and normalized ledgers; all allocation decisions; WIP/FG inherited vectors; H service scope; gross V/returns; packaging balances; unknowns; native/provider limitations; measurement and temporal coverage"
  update_trigger: "Polymer/source/finish/moisture or receiver-gate change; introduced treatment; different utility/provider; new native evidence; changed allocation drivers or material stock discrepancy"
