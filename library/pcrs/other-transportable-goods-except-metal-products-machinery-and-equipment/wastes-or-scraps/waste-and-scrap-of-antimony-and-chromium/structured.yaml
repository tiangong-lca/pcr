allocation_rules:
  - rule_id: al_subdivide
    applies_to: "joint casting and preparation"
    rule: "This PCR is attributional and addresses cases requiring allocation. First use dedicated measurement and physical or virtual subdivision for riser-only separation/QA/packing, billet-only continuation, common conditioning and each waste-control operation. Keep the full joint process physically visible. Wash melts that are remelted internally carry the original history once plus actual new work; failed heats are not erased."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_causality
    applies_to: "each remaining shared exchange"
    rule: "Identify the determining physical causality separately for every still-shared input, emission and waste/service exchange: demonstrate how changing billet or riser function changes that exchange. Composition, mass, thermal requirement, equipment duty or processing time may be relevant only with an evidenced causal model for that exchange. A checklist is not free choice and a single mass ratio does not automatically allocate all furnace/argon/refractory loads. Document the causal gate and uncertainty."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_remaining
    applies_to: "only residual exchanges without causal relation"
    rule: "Only after justified inability to subdivide and to establish determining physical causality apply a documented other relation, normally contemporaneous market value at the same common process gate and actual state. Use actual relevant quantities and prices for unextruded billet and unrefined riser in their actual purity/form/packaging; not finished target prices against dirty scrap at a different gate. Do not invent a fixed ratio, positive value for disposal or a missing price. If needed values or treatment of a real negative/zero-value stream are unresolved, that concrete quantitative package remains incomplete pending an applicable waste-transfer decision; do not manufacture zero burden or recycling credit. Preserve exchange-vector conservation and sensitivities."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_provider
    applies_to: "inherited burdens and actual services"
    rule: "The original chromium production and actual formation burden enters once and is assigned between genuine co-functions at its real gate; scrap naming, ownership and nonpurchase receipt do not erase it. Keep component manufacture, physical P/N_ext/ER movements and real rental/return/cleaning services independent. No substitution or avoided primary chromium, no new production from internal reuse and no inferred credit. Gross V remains unallocated for physical closure while assigned A vectors sum to original extensive loads."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_charge
      process_id: "cast_riser_route"
      flow_role: "Metal and chemical receipts and raw stock"
      record_type: "supplier lot tickets plus calibrated weighing and certificates"
      raw_fields: "material and full supplied form; gross; tare; net kg; Cr O and impurity assay; purchased or nonpurchase event; opening and closing stock; actual issue; wash melt linkage; provider vector"
      collection_method: "Weigh each whole supply and reconcile issue and stock in raw kg; retain actual production history and no second assay purchase."
      unit: "kg"
      frequency: "each receipt and charge"
      temporal_coverage: "full declared period including failures and Q0"
      site_scope: "all included operations and stores at the actual sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw logs; analyses; custody; supplier scope; independently checked balances"
    - protocol_id: cp_gas
      process_id: "cast_riser_route"
      flow_role: "Gaseous argon"
      record_type: "gas meter and cylinder mass/custody record"
      raw_fields: "gas batch; purity; meter start and end; mass; actual pressure temperature and compressibility; stored gas; purge and recovery; cylinder owner; provider scope"
      collection_method: "Collect undivided actual mass or integrated volume and independently measured gas conversion conditions; a true rate alone is integrated over time."
      unit: "kg"
      frequency: "each refill and metered interval"
      temporal_coverage: "full declared period including failures and Q0"
      site_scope: "all included operations and stores at the actual sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw logs; analyses; custody; supplier scope; independently checked balances"
    - protocol_id: cp_energy
      process_id: "cast_riser_route"
      flow_role: "Electrical energy"
      record_type: "revenue meter plus operation submeters"
      raw_fields: "raw kWh; meter timestamps; voltage; grid source; country; operation; start stop idle and cleaning; onsite generation; losses and provider scope"
      collection_method: "Collect raw meter differences without output division; independently reconcile each actual supply and operation. Convert kWh to MJ once before assignment."
      unit: "MJ"
      frequency: "each metered interval"
      temporal_coverage: "full declared period including failures and Q0"
      site_scope: "all included operations and stores at the actual sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw logs; analyses; custody; supplier scope; independently checked balances"
    - protocol_id: cp_articles
      process_id: "cast_riser_route"
      flow_role: "Whole crucible mould and ceramic cover"
      record_type: "article receipt installation wear and removal ledger"
      raw_fields: "one specific article identity; material composition; measured article kg; opening and closing article stock; installation; loss and erosion; actual service record; provider scope"
      collection_method: "Weigh/trace every whole article and physical consumption; measure allocation drivers independently; no assumed per-heat replacement or lifetime."
      unit: "kg"
      frequency: "each receipt replacement and campaign"
      temporal_coverage: "full declared period including failures and Q0"
      site_scope: "all included operations and stores at the actual sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw logs; analyses; custody; supplier scope; independently checked balances"
    - protocol_id: cp_joint
      process_id: "cast_riser_route"
      flow_role: "Full joint process and mother billet"
      record_type: "heat log paired transfer and stock vectors"
      raw_fields: "heat id; operation sequence; wash and failed heats; gross feed and every output V; mother billet kg and assay; riser kg and assay; raw WIP history; allocated vector per function; causal model; common gate state and actual prices if needed"
      collection_method: "Retain every raw physical leg and inherited vector; independently reconcile mass elements and energy; keep gross companion billet apart from the allocated reference inventory."
      unit: "kg"
      frequency: "each heat and period stocktake"
      temporal_coverage: "full declared period including failures and Q0"
      site_scope: "all included operations and stores at the actual sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw logs; analyses; custody; supplier scope; independently checked balances"
    - protocol_id: cp_release
      process_id: "cast_riser_route"
      flow_role: "Unique first riser release"
      record_type: "calibrated release weighing plus receiver agreement"
      raw_fields: "unique lot and original cohort; net whole solid kg; tare; separate loose matter and free water; metallic matrix and elemental/phase assay; actual cut-off and preparation; specification; first-release decision and timestamp; Q_c; closing FG; reversals"
      collection_method: "Weigh each newly accepted whole riser on a calibrated scale; link agreed receiver criteria and unique original release. Sum raw eligible kg once; closing accepted FG is already included."
      unit: "kg"
      frequency: "each first release and reversal"
      temporal_coverage: "full declared period including failures and Q0"
      site_scope: "all included operations and stores at the actual sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw logs; analyses; custody; supplier scope; independently checked balances"
    - protocol_id: cp_outlets
      process_id: "cast_riser_route"
      flow_role: "Each specific solid waste outlet"
      record_type: "scale ticket analytical result and receiving manifest"
      raw_fields: "single actual mixture or article; gross and tare; net kg; moisture; phase and element analysis; destination; opening and closing waste stock; whole and source partitions; single provider"
      collection_method: "Weigh each real whole outlet; preserve independent constituent subledgers and non-additive source partitions."
      unit: "kg"
      frequency: "each removal and stocktake"
      temporal_coverage: "full declared period including failures and Q0"
      site_scope: "all included operations and stores at the actual sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw logs; analyses; custody; supplier scope; independently checked balances"
    - protocol_id: cp_species
      process_id: "cast_riser_route"
      flow_role: "Each actual atmospheric species"
      record_type: "postcontrol sampling or independently validated species balance"
      raw_fields: "chemical species; CAS and oxidation state; particle size; actual receiving air compartment; raw concentration; integrated gas volume or true flow rate; moisture and reference state; control capture; detection and uncertainty"
      collection_method: "Measure the actual species after the last included control. Concentration times integrated volume is already integrated; no extra time factor. Keep total-PM and total-metal indicators outside species sums."
      unit: "kg"
      frequency: "each representative operating state"
      temporal_coverage: "full declared period including failures and Q0"
      site_scope: "all included operations and stores at the actual sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw logs; analyses; custody; supplier scope; independently checked balances"
    - protocol_id: cp_water
      process_id: "cast_riser_route"
      flow_role: "Each actual circuit water leg"
      record_type: "water meters scales and independent water/species analyses"
      raw_fields: "source; inlet and outlet mass or volume; measured same-fluid density and state; circuit stock; return; blowdown; evaporation; solute and species analysis; heat inlet/outlet temperatures and enthalpy; supplier scope"
      collection_method: "Meter each real fresh/return/waste/evaporative leg separately; recirculation cancels. Keep heat and water ledgers consistent without assuming steam or a boiler."
      unit: "kg"
      frequency: "each metered interval and discharge"
      temporal_coverage: "full declared period including failures and Q0"
      site_scope: "all included operations and stores at the actual sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw logs; analyses; custody; supplier scope; independently checked balances"
    - protocol_id: cp_service
      process_id: "cohort_service"
      flow_role: "Actual postrelease cohort services"
      record_type: "service meters freight tickets receipt and return records"
      raw_fields: "original cohort Q_c; actual H; activity date; raw kWh; actual kg and km; service type; provider coverage; gross dispatch; receiver receipt; delivery reversal; returned physical state; historical vector; incremental rework"
      collection_method: "Collect each raw service event without output division and reconcile it to its original cohort and actual receiving gate. No new production from repeat handling."
      unit: "row-specific"
      frequency: "each actual event"
      temporal_coverage: "full declared period including failures and Q0"
      site_scope: "all included operations and stores at the actual sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw logs; analyses; custody; supplier scope; independently checked balances"
    - protocol_id: cp_components
      process_id: "component_pool"
      flow_role: "Each named component and real direction"
      record_type: "atomic physical receipt movement and stock records"
      raw_fields: "component identity and material; form and type; exact direction P N_ext ER grossS EO or W; event id; gross tare and measured net kg; ownership; supplier included scope; first external receipt or prior external dispatch id; raw WIP FG reusable opening and closing location; original cohort; per-exchange vector; incremental rental return cleaning; independently measured F_in_k/F_out_k material/water/species/phase leg and paired cross-ledger event IDs"
      collection_method: "Weigh and identify every actual component event using its specific receipt or movement interface. Distinguish true purchase from all first nonpurchase external receipts and genuine returns; internally issued quantity is paired and cancels. Close each material at one gate; no guessed item kg. Collect actual change legs independently without overlap with receipt/outlet classes; preserve whole contaminated W once and its non-additive child accounts."
      unit: "kg"
      frequency: "each event and complete stocktake"
      temporal_coverage: "full declared period including failures and Q0"
      site_scope: "all included operations and stores at the actual sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw logs; analyses; custody; supplier scope; independently checked balances"
  calculation_rules:
    - id: calc_raw_conversion
      applies_to: "raw extensive quantities"
      rule: "Convert each raw g to kg with 0.001 and electrical kWh to MJ with 3.6 once. Integrate actual rates only; volume-to-mass uses independently measured same-fluid density/state. Freight tonne-km = transported gross kg * actual km / 1000. Never infer item mass or density from a secondary native factor."
      inputs:
        - "raw quantity"
        - "original unit"
        - "measured state"
        - "actual km"
      output: "converted raw extensive V_i_c in the actual row unit"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_assign
      applies_to: "each burden exchange and cohort"
      rule: "A_i_c = eligible dedicated and actually allocated raw exchange + inherited opening-WIP vector - inherited closing-WIP vector; use the allocation hierarchy exchange by exchange and keep original provider ownership once. Record postrelease service A_i_c separately for its original cohort; physical-only companion movements retain gross V_i_c without burden allocation. Accepted closing FG is already in Q_c and is not another WIP deduction. Sum assigned vectors across co-functions back to original extensive burdens."
      inputs:
        - "converted raw exchange"
        - "actual causal assignment"
        - "inherited vectors"
        - "original cohort"
      output: "undivided A_i_c; independent gross V_i_c"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "x_i_c = A_i_c / Q_c once for an attributed burden result; for a physical-only companion result use its independently retained gross V_i_c as numerator and label it separately. Q_c is the original positive first-release kg of that cohort. This is the sole output division; cards and protocol aggregation reuse the result. released_riser = Q_c / Q_c = 1 kg. When Q_c = 0 retain loads and do not calculate a unit result; H never replaces Q_c."
      inputs:
        - A_i_c
        - V_i_c
        - Q_c
      output: "x_i_c per 1 kg reference flow; separately labelled physical companion result"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_component_closure
      applies_to: "each physical component pool"
      rule: "opening_k + P_k + N_ext_k + ER_k + F_in_k = closing_k + grossS_k + EO_k + W_k + F_out_k; P is true purchase; N_ext is all first nonpurchase external physical receipts; ER has prior external dispatch; classify events mutually exclusively. Include all empty/raw/WIP/FG/reusable stocks once. Internal issues cancel and original manufacture is charged once independently of receipt classification."
      inputs:
        - "event-specific material form type direction and measured kg"
        - "same-gate stocks"
        - history
        - "independently measured actual F_in_k/F_out_k and paired cross-ledger IDs"
      output: "raw component balance and signed unresolved difference"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_physical
      applies_to: "production FG and combined gate"
      rule: "Apply sb_physical to raw gross V; independently close total mass, actual element masses and actual species/phase/water subledgers at identical gates. Measure each unknown independently; no invented balancing flow or allocation of a physical residual. Apply no second Q normalization here."
      inputs:
        - "full raw V legs"
        - "raw/WIP/FG stocks"
        - assays
        - "actual chemical species"
        - "real heat states"
      output: "documented raw physical element species and energy residuals"
      source_ids:
        - mrc-chromium-casting-2000
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference and original feed"
      requirement: "Demonstrate one real chromium casting-riser source and actual recycler feed acceptance; no alloy/oxide/mixture substitution. The patent is route evidence, not a contemporary quantity or grade certificate."
      evidence: "heat trace; photos; assays; cut-off route; receiver agreement"
    - id: dq_native
      applies_to: "every bound and unbound row"
      requirement: "Check complete formal names in both languages, all synonyms/comments, CAS, type, grade, route, form, geography, all properties and exact reference-property/unit-group/reference-unit chain. A broad flow requires independent real state evidence and the full restrictions in its description; a hard contradiction cannot be waived by a generic name. Ordinary provider/auxiliary UUID matching is not a missing casting method."
      evidence: "complete direct native originals and support chain; source identity evidence"
    - id: dq_period
      applies_to: "all raw records"
      requirement: "Cover full campaign including wash/failure/Q0/start/stop/idle/cleanup/rework and all opening/closing stocks and inherited vectors. Quantitative incompleteness remains explicit; unknown is not zero."
      evidence: "calibrations; operating logs; period and uncertainty; signed reconciliations"
    - id: dq_receipts
      applies_to: "every real packaging/container/attachment event"
      requirement: "Require actual atomic material/form/type/direction and measured receipt at the same gate. Missing a specific first nonpurchase interface or quantity leaves the concrete data package incomplete; never relabel it purchase or return to close a table."
      evidence: "P/N_ext/ER disjoint event ledger; all stock legs; original dispatch and provider ownership"
    - id: dq_scope
      applies_to: "actual receiver-gate result"
      requirement: "Separate first-release production and actual original-cohort services; disclose unfinished FG/services, ordinary unbound rows and any real method/terminal contradiction separately. No science, translation, mapping or publication approval follows from engineering checks."
      evidence: "cohort ledger; receiver receipts; provider coverage and allocation evidence"
validation_rules:
  - rule_id: vr_scope
    applies_to: "identity and terminal"
    rule: "Require all reference qualifiers and one real solid chromium casting-riser source plus actual agreed recycler acceptance. Reject mixed Sb/Cr, plated steel, ferroalloy, chemical sludge, oxide/ash/slag or a finished-target proxy. No current lot can be certified from a classification label or patent example alone."
    source_ids:
      - un-cpc3-2025
      - mrc-chromium-casting-2000
      - exotech-chromium-feed
      - exotech-solid-reception
  - rule_id: vr_route
    applies_to: "complete method"
    rule: "Verify original whole feed manufacture/inherited provider and real casting/conditioning/cooling/cut-off before segregation/release; keep the common billet gate and every genuine input/output including failures and Q0. A purchase-only scrap model, unmeasured missing actual exchange or full-batch double inheritance fails quantitative completion."
    source_ids:
      - mrc-chromium-casting-2000
      - jrc-ilcd-2010
  - rule_id: vr_normalization
    applies_to: "release stocks and services"
    rule: "Check unique first Q_c, no closing-FG double output, all inherited WIP vectors, raw conversion and actual allocation before the sole A/Q division. Cards and protocols reuse one result. Retain all actual original-cohort services and return reversals without new Q; H is not a denominator. Q0 retains raw loads and no unit result."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: vr_components
    applies_to: "every physical component"
    rule: "Recalculate opening + P + N_ext + ER + F_in = closing + grossS + EO + W + F_out for each concrete material/form/type at one gate. P is purchase only; N_ext includes supplier-included and first entrusted/borrowed/leased receipts; ER requires original external dispatch. Events are disjoint. Opening does not replace current receipts; internal raw/WIP/FG issues/reuse cancel. Require actual specific receipt interface and measured kg for every event; missing interface makes that data package incomplete. Audit ownership/original cohort/inherited vector/provider-included manufacture and incremental rental/return service separately with one burden owner; no zero burden/new Q/credit inference."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: vr_physical
    applies_to: "production FG and consolidated gates"
    rule: "Apply the identical raw V gates in sb_physical and calc_physical. Independently verify total mass, each relevant element, actual phases/species and all water/heat legs; PM/COD/total-metal indicators are not specific chemical mass. Do not solve multiple unknowns with one residual. Whole outlets and disjoint source partitions are not additive; no allocation factor can close a missing physical leg. Only identical OTHER duplicates on the same side may be removed as X."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: vr_allocation
    applies_to: "joint-process burdens"
    rule: "Check physical/virtual subdivision then exchange-specific determining physical causality; only justified residual burdens may use actual contemporaneous same-state common-gate values. Confirm vector conservation across billet/riser and real services. No blanket mass/economic choice, assumed positive scrap value, original burden erasure, second provider or recovery credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: vr_atoms_native
    applies_to: "every exchange and support chain"
    rule: "Every actual input/article/whole formulation/energy/water/package/waste/species has one concrete row and condition. Check each adopted flow against its full native restrictions and exact property-to-unit chain and official Chinese display; do not infer physical identity from category alone or use ordinary unbound auxiliary rows to claim a missing core method. Actual unsupported core identity/terminal/method is a separate real hold. Schema and finite measurement checks do not certify scientific or translation approval."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "One qualified chromium-riser feed and its disclosed actual original-cohort receiving services"
  allowed_use: "Only matching source metal matrix and cast-riser form/route with actual receiver acceptance and fully collected burdens"
  excluded_use: "Leaf-wide averages; Sb/Cr mixing; plated steel or ferroalloy; oxide/chemical residue; spent/sintered targets; powder/metal recovery credit; incomplete receiver-gate claim"
  required_metadata: "single chromium casting heat and original feed origin; chromium metal matrix with independently measured oxygen and oxide inclusions; complete elemental assay including Sb Fe Pb and relevant contaminants; cooled cut-off riser form with recorded shrinkage pipe and porosity distinct from scale ash powder sludge and alloy scrap; actual cut-off method and tool and any fluid; mother billet gate before scalping and extrusion; source-specific flake briquette and chromium oxide supply forms; vacuum induction casting and crucible conditioning history; actual segregation and preparation; specified chromium recycler acceptance and contamination limits; unique first-release lot and net whole-riser kg Q_c; opening and closing raw WIP FG and component stocks with per-exchange inherited vectors; gross movements and genuine return history; actual site period utilities and emission media; allocation relation and common-gate state and prices if needed; original cohort and actual postrelease service horizon H; all purchase and nonpurchase first physical component receipts; supplier-included burden scope and container ownership; individual waste destinations and actual species"
  required_quality_disclosure: "Raw physical and assigned burden coverage; unbound identities/provider gaps; actual scope and all stock vectors; native restrictions; methods and uncertainty; service completion and real holds; no inferred approval"
  update_trigger: "Change of source/form/route/grade/cut-off method/receiver gate or specification; provider ownership; utilities; phase/species; stock convention; allocation relation; component ingress; geography or period"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division. CPC Version 3.0 Structure and Explanatory Notes. 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf . Complete notes pp.203–205 and 215; structure https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Classification context and neighbouring exclusions; the notes give no manufacturing recipe."
  - id: "mrc-chromium-casting-2000"
    type: "literature"
    reference: "Materials Research Corporation. Melting and casting of high purity chromium with controlled oxygen content. US6039788A. 21 March 2000. https://patents.google.com/patent/US6039788A/en . Complete issued patent PDF pp.6–9 (columns 1–8); especially Melting Operation and Target Fabrication and Tables 3–4."
    used_for: "Positive casting and cooled-riser cut-off route; flake and briquette feed plus separate oxide addition; argon and whole crucible; mother billet continuation; failed and wash melts. Qualitative technical synthesis only; no recipe or operating value is adopted."
  - id: "exotech-chromium-feed"
    type: "literature"
    reference: "Exotech. Manufacturing Chromium Powder for Sputter Targets. Undated complete publisher page. https://www.exotech.com/blog/manufacturing-chromium-powder . What You Get as the Final Result and adjacent process alternatives; snapshot acquired 26 October 2026."
    used_for: "Real use of recycled chromium feed by a chromium-powder producer. Its powder grades and electrolytic/hydrogen/milling descriptions are downstream context and never a riser specification or foreground operation."
  - id: "exotech-solid-reception"
    type: "literature"
    reference: "Exotech. Metals we buy. Undated complete publisher page. https://www.exotech.com/metals-we-buy . Introductory accepted forms and linked reception context; snapshot acquired 26 October 2026."
    used_for: "Solid scrap reception as a real commercial interface. Actual riser chemistry size and contamination acceptance still require agreement with the selected receiver; this is not evidence of a particular order."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance. First edition March 2010. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf . Sections 7.9.2–7.9.3 and associated provisions; printed pp.255–268; annex 14.4 requires separate applicable waste-transfer modelling."
    used_for: "Attributional subdivision and exchange-specific determining physical causality before residual common-gate market-value allocation; inventory conservation and service attribution. No industrial yield or automatic recycling credit."
