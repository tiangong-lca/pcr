system_boundary:
  rules:
    - rule_id: sb_route
      applies_to: "whole source chain"
      rule: "Include actual high-purity chromium flake receipt and any separately supplied chromium briquette and Cr2O3 powder; whole-crucible conditioning and wash melts; vacuum induction melting under actual argon exchanges; steel-mould casting; controlled cooling; removal of the cooled solid riser; source segregation; necessary foreign-object removal and receiver-grade testing; and unique first release. Preserve failure, start/stop, idle, cleanup and rework loads. The mother billet leaves at the same post-cut gate before scalping, extrusion and target machining; those later billet-only operations cannot be allocated backward onto an already separated riser. Buying finished scrap and packing it does not fulfil this route."
      source_ids:
        - mrc-chromium-casting-2000
        - jrc-ilcd-2010
    - rule_id: sb_supply
      applies_to: "each supplied whole input"
      rule: "Use one compatible provider for every whole chromium supply form, oxide powder, whole refractory article and actual utility. Trace chromium feed through its real primary/secondary metal production and actual refining/degassing/form preparation and transport; do not infer an electrolytic route merely from the flake name. Supplied formulations and manufactured articles are charged once; constituent assays and carrier water are subledgers. Actual onsite preparation instead requires each purchased constituent plus real energy and loss. An independently verified source module may carry formation, but its raw gates, co-outputs, allocation and inherited exchange vector must be readable; never copy a full batch burden to both billet and riser."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_release
      applies_to: "first release and FG"
      rule: "Q_c is newly first-released whole net solid riser mass for the named recycler in cohort c. The specification gate is at the generating/preparing facility after required tests; actual delivery to the recycler is retained as a later service. Exclude all packages, detached foreign matter and separately measured free water from Q_c; intrinsic oxide inclusions remain within the whole metal-matrix riser. Closing released FG already belongs to Q_c and is never added beside Q_c as production. Reinspection, shipment, borrowed container receipt, return or rework creates no second Q. Reverse an invalid release only against its original lot and restore any corrected release to that original cohort."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_stock
      applies_to: "every exchange and cohort"
      rule: "Retain physical quantities and complete inherited per-exchange vectors for opening/closing raw stores, WIP, FG and containers. Convert raw original units before attribution. For newly released work assign current eligible loads plus opening-WIP history minus closing-WIP history; do not deduct closing accepted FG production history. Internal raw/WIP/FG issues and wash-metal returns transfer both quantity and history and cancel on consolidation. Include failed and zero-output batches and all measured start/stop, idle, cleaning and rework; Q_c=0 retains real loads and yields no unit result."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_service
      applies_to: "postrelease services to reception"
      rule: "Keep performed storage, packing, handling, actual freight, recycler reception, returned deliveries and incremental rework in disjoint original-cohort service accounts. Use original fixed Q_c and observed horizon H; H is never a production denominator. Opening/closing released lots keep historical manufacturing vectors. Reverse the original delivery leg for a true customer return while retaining original production and adding only genuine incremental services. Unserved FG and unfinished transport/reception are disclosed; partial service history cannot claim a completed receiving gate. Contract manufacture and leased/entrusted container ownership do not alter these physical gates or burden inheritance."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_physical
      applies_to: "production FG and consolidated gates"
      rule: "Use unallocated physical V for balances and attributed exchange vector A for burdens. Production opening raw/component stores and WIP plus external receipts plus old FG entering rework equals corresponding closing stores/WIP plus gross newly released transfer V_new plus old FG returned to FG plus all external outlets. V_new already contains Q_c and attached packages; do not add Q_c again. FG opening gross stock plus V_new plus true external returns plus old FG returned plus service component issues equals closing gross FG plus gross shipments plus old FG sent to rework plus actual external losses. Cancel paired internal legs in the combined gate. Reconcile total mass and Cr/O/Sb/Fe/Pb and each relevant element independently from actual phase/species evidence; one residual cannot fit two unknowns. Whole mixed outlets and source partitions are non-additive. X_in or X_out removes only an exactly duplicated OTHER term on the same side; never a stock or opposite-side flow."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_components
      applies_to: "every real packaging container and attachment"
      rule: "For each concrete component k close opening_k + P_k + N_ext_k + ER_k + F_in_k = closing_k + grossS_k + EO_k + W_k + F_out_k at the same physical gate. Opening/closing includes empty stock, components attached to raw/WIP, attached FG and reusable stock without overlap. P means real purchases only. N_ext means all first external nonpurchase physical receipts including supplier-included packaging and first entrusted, borrowed or leased receipt. ER requires the same identified component to have an earlier external dispatch. These three ingress classes are mutually exclusive; opening stock cannot replace current receipts. Record actual material/form/type/direction and independently measured quantity for every event through its specific atomic receipt card/interface. Missing an actual interface makes that concrete package incomplete; do not just add a symbol or reuse a purchase UUID blindly. Internal issues/reuse cancel. grossS follows gross shipments, never Q or economic allocation. F_in_k/F_out_k are these independently measured and separately identified actual material/water/species or phase-transfer legs crossing this same component gate; exclude quantities already in P_k/N_ext_k/ER_k or grossS_k/EO_k/W_k. Include actual retained contamination or moisture changes without assuming their presence. Pair internal cross-ledger legs and cancel them only at the combined gate. Whole contaminated W_k remains one measured outlet with non-additive component/content partitions and one provider. A genuinely new retained-material input is still an input, not an X deduction; X removes only an exact OTHER duplicate on the same side. No reaction yield, water uptake or loss quantity is defaulted."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_component_burdens
      applies_to: "component ownership and supply coverage"
      rule: "Physical receipt classification is separate from ownership, original cohort, inherited per-exchange vector, supplier-included scope and actual incremental rental/return services. Charge manufacture once under its real provider agreement; a nonpurchase receipt is not zero burden and a return is not a new purchase, new Q or credit. For a whole purchased drum/cylinder record its component material partitions without purchasing those parts again. Supplier-included attachments retain their measured receipt even if their manufacture is already inside a provider; do not add it twice. One physical waste outlet has one provider; source partitions sum to its whole without duplication."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_extend
      applies_to: "all actual exchanges"
      rule: "The finite cards are specific candidate interfaces, not a measured factory BOM. Mark absence only from actual route evidence. Before claiming completeness add a separately named atomic row/interface for every real unlisted tool, saw/abrasive/EDM consumable, entire cutting-fluid preparation, vacuum-pump oil, fuel, water circuit, package attachment, waste outlet and emitted chemical species. Declare actual material and cut-off technology without inventing an alloy recipe or lubricant. Thermal cut-off, wet chemical purification, milling or blending changes require scope review. Gas, free/reaction/structural water, condensate and heat are separate actual-state ledgers. External returned cooling water or real condensate is Product return with measured mass/state/enthalpy and supplier water/energy scope; do not create an unobserved boiler or steam system."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: system_boundary_rule_10
      applies_to: "foreground_system_boundary"
      rule: "When a supplied whole article has attachments, instantiate these concrete material/form interfaces for every actual event with independently measured kg, exact P/N_ext/ER direction, grossS/EO/W outlet and stock location. The table names physical parts, not additional whole-article purchases. A partition of a purchased whole drum is a physical child receipt whose manufacture may already be inherited; financial procurement and physical partition are not added together. A real valve/gasket of an unlisted composition must be named and extended before the package is complete; do not invent its alloy or elastomer."
      source_ids: []
