  component_physical_review: "The already-required measured transformation/moisture legs are explicit F_in_k/F_out_k in hard component calculation and validation. Retain full P/N_ext/ER receipts and gross stocks/S/EO/W, independently measure non-overlapping actual material/water/species/phase transfers and pair cross-ledger counterparts. Whole contaminated waste remains once with non-additive contents and one provider; X cannot erase a genuinely new input."
