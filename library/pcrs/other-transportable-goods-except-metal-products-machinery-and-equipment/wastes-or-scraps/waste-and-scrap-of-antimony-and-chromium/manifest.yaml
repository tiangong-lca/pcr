    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scientific_review: pending
  translation_review: pending; aligned only
  method_scope: Single cooled solid chromium casting riser; original feed and
    casting formation retained; mother billet common gate before
    scalping/extrusion; actual recycler acceptance collected per lot.
  reference_identity_decision: Complete direct native generic Product flow is not
    explicitly Sb+Cr mixed and has no fixed route/form/grade/CAS/geography;
    bound only to one independently evidenced solid chromium riser with full
    consumable qualifiers. Mixed native candidates rejected.
