  - row_id: formaldehyde
    requirements: Conditional actual chemically identified formaldehyde from wood heating; broad synonyms mentioning
      formalin/polymers do not change this CAS-specific gas identity. Native Elementary emission to outdoor air,
      unspecified receiving subcompartment, CAS 50-00-0 and Mass/kg; no long-term, indoor, water or special-stack
      substitution. Quantify actual substance after controls and distinguish origin without adding source partitions
      to the whole amount. No emission factor or characterization factor is inherited. Evidence of absence must
      include method, detection limit and operating conditions; otherwise retain an unknown and add every real additional
      species separately.
  - row_id: water_vapour
    requirements: Actual net water vapour released to outdoor air from drying/cooling and combustion, CAS 7732-18-5,
      Mass/kg, unspecified air subcompartment. Native synonyms include liquid/ice/heavy-water terms, but the formal
      identity is vapour, not those forms, purchased steam or wastewater. Independently distinguish feed free water,
      ambient humidity, supplied steam and combustion reaction water; one residual must not fit both evaporation
      and reaction water. Retain unchanged inlet humidity as a paired diagnostic, not fabricated evaporation.
  - row_id: wood_pm
    requirements: Actual emitted wood-containing particles after controls, distinguished from captured material
      sent back or discarded. Native Elementary is Mass/kg outdoor-air PM with unspecified size and receiving subcompartment;
      no composition, stack height or LCIA factor is assigned. Its retained clinker-study example is explicitly
      an example rather than a route restriction or wood-pellet emission factor. Measure actual wood/mineral fraction
      for the wood balance. If aerodynamic sizes are known use verified nonoverlapping size-specific identities
      instead, never sum total PM with nested PM10/PM2.5.
