    affected_rows: [make_pallet, service_make_pallet]
    issue: "Active CPC17100 is electricity, inconsistent with coherent wooden-pallet name/wood-board-slats route/Product Mass. Preserved received wood-packaging classification is not correction of the active source. Conditional finished-wood-pallet use requires actual design/treatment/grade/state/provider/quantity evidence; source classification clarification remains pending."
