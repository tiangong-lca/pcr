  - row_id: nitrous_oxide
    requirements: Conditional actual nitrous oxide, kept separate from NO and NO2. Native Elementary emission to
      outdoor air, unspecified receiving subcompartment, CAS 10024-97-2 and Mass/kg; no long-term, indoor, water
