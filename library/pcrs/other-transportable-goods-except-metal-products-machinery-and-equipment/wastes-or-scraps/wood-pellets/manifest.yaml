  - row_id: sulfur_dioxide
    requirements: Conditional actual sulfur dioxide, not the SOx aggregate. Native Elementary emission to outdoor
      air, unspecified receiving subcompartment, CAS 7446-09-5 and Mass/kg; no long-term, indoor, water or special-stack
      substitution. Quantify actual substance after controls and distinguish origin without adding source partitions
