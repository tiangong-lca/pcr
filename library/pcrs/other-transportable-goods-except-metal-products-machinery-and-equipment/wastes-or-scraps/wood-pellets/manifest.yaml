  reference_identity_qualification:
    row_id: pellets_out
    flow_uuid: 4905586c-0722-4c91-923f-112215546a41
    identity_scope: Manufactured finished wood pellet Product at plant; Mass/kg. Use only the fully qualified untreated
      conifer sawdust fuel-pellet first-release route. Not briquettes, hot intermediate pellets or loose sawdust.
    source_record_limits: No fixed species, additive allowance, quality grade, geometry, moisture, density, NCV,
      geography or provider is supplied. These require actual dataset evidence, not defaults.
    provider_compatibility: Actual supplier/form/moisture/quality/gate/year must independently match. Identity evidence
      is not a factory inventory or scientific approval.
  scope_decision: A distinct manufactured fuel-pellet route with drying, conditioning, die extrusion, cooling, screening
    and primary packing; existing unbound wood-flour method excludes onsite thermal drying and pellets. Neither
    39282 agglomerates nor 39283 non-agglomerated sawdust is the reference output.
  mapping_recommendation: "Historical author recommendation: narrower CPC3.0:39281; current mapping relation and acceptance follow classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs. No shared mapping is changed."
  ordinary_completion_gaps: Concrete auxiliary identities, actual steam state/provider, supply recipe and legal
    waste/product status, foreground values, exact quality tests, stock inheritance and actual emission/absence
    evidence remain required for a completed factory dataset. A real Product coproduct sawdust supply cannot use
    the Waste input identity.
  methodology_holds: []
  source_limitations:
  - COFORD 2007 technical-specification thresholds are not current universal acceptance grades.
  - SCA source uses biomass drying energy and heat export; it does not define the selected gas-fired provider.
  - Bordiga pine/spruce labels conflict; no botanical species is inferred and its carbon-neutral marketing is not
    adopted.
  - Industrial sources do not establish LCA allocation; ILCD attributional scope applies only where allocation is
    required.
  native_rejections:
  - Earlier grouped acc22294/2ef9 agglomeration observations are historical. Current 2ef9 Wood waste is collected
    non-agglomerated waste at generation, CPC39283, with composition and treatment unspecified; that broad record
    alone does not verify precise clean raw sawdust or finished pellet identity, material state, receiver/fate or provider.
    Keep existing exact unbound residue/rejected-pellet rows blank; acc22294 is an offcut locator, not finished pellets.
  - dc25adc2 explicitly says unprocessed roundwood at forest roadside; it cannot identify at-plant sawdust despite
    the non-agglomerated code.
  - Waste Dust is not an Elementary air emission. Indoor formaldehyde cannot identify outdoor emission. Fixed-pressure
    steam identities are not assumed. Agricultural-soil CO cannot identify an air emission; native nitrite or Product
    nitrogen oxides cannot identify NO2 Elementary air emission.
