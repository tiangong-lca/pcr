    affected_rows: [fossil_methane, service_fossil_methane]
    issue: "Imported aliases include graphite, carbon black, activated carbon, formaldehyde and other nonmethane terms; exclude them and retain source-metadata debt. Principal methane-fossil name/CAS74-82-8, Elementary air category and Mass reference support only conditional actual CH4, fossil origin, medium and reference-mass/unit verification. No corrected-alias or measured-emission claim."
  - uuid: 08a91e70-3ddc-11dd-96ee-0050c2490048
    affected_rows: [nitrogen_monoxide, service_nitrogen_monoxide]
    issue: "Imported HNO/nitroxyl/nitrosyl-hydride aliases do not identify neutral NO; exclude them and retain source-metadata debt. Principal nitrogen-monoxide name/CAS10102-43-9, Elementary air category and Mass reference support only conditional actual neutral-NO speciation, medium and reference-mass/unit verification. NOx-as-NO2 is not actual NO mass; no corrected-alias or measured-species claim."
  provider_compatibility:
  - row_id: make_electricity
    requirements: Metered electricity for receipt, conveyors, dryer fans, hammer mill, conditioner, die press, cooling,
      extraction, screens, initial packing and release testing. This Product identity is CN grid-average consumption
      mix to user at 1–35 kV; it is not generation, a renewable contract, a transformer service or low-voltage supply.
      Match actual year, region, supplier, voltage and loss boundary independently. Native Net calorific value denotes
      energy/MJ for this electricity flow; use metered electrical energy, never a fictitious fuel heat value.
  - row_id: dryer_gas
    requirements: One supplied gaseous natural-gas preparation burned in the actual industrial dryer furnace, including
      ignition, warm-up, shutdown and idle fuel. This native Product has Mass/kg and only the industrial-furnace
      combustion route; no fixed composition, density, LHV, geography or supplier is specified. Meter gas mass or
      independently convert its measured standard volume using this supply’s measured composition and reference-state
      density; no native secondary ratio supplies a density. Separately identify any real onsite conditioning-steam
      boiler fuel and expand its complete water/emissions inventory; purchased steam must not also acquire a fictitious
      boiler.
  - row_id: make_diesel
    requirements: Conditional actual diesel for incoming sawdust yard handling and internal manufacture logistics.
      The native Product is diesel mass only, with grade, blend, density, heating value, refinery, geography and
      provider unspecified; collect each. An absent diesel operation requires documented electric handling or other
      actual equipment evidence. Keep all combustion species separately and do not add a transport-service provider
      for the same fuel burn.
  - row_id: conditioning_water
    requirements: Actual separately supplied potable municipal water used for direct moisture conditioning or cleaning.
      Native identity is treated drinking-standard piped water, production supply at plant/to consumer; not untreated
      surface water, seawater, recovered condensate or steam. Supplier treatment, location and quality remain independent
      requirements. Use Mass/kg; the native secondary Volume ratio is not an independently measured site water density.
      Do not add water carried in received sawdust or purchased steam as another purchase.
  - row_id: make_bag
    requirements: One purchased finished PE pellet bag, including supplied printing and closure when integral. Native
      Product is PE bag at plant, CAS 9002-88-4, with no grade, thickness, content, capacity or supplier specified;
      do not substitute resin, a laminate or a woven PP sack. Measure whole supplied bag mass and count; separately
      supplied labels or closures need their own atomic rows. This is manufacture packaging up to first release
      only; cp_pack keeps the complete material-specific stock/custody equation. Only actual use applies.
  - row_id: make_wrap
    requirements: One finished PE pallet wrapping film, not resin or extrusion service. Native Product is at-plant
      PE film, CAS 9002-88-4; its comment distinguishes competing PET and does not make PET compatible. Branching/grade,
      thickness, additives, recycled share and provider require independent confirmation. This is manufacture packaging
      up to first release only; cp_pack keeps the complete material-specific stock/custody equation. Only actual
      use applies.
  - row_id: make_pallet
    requirements: One finished board/slat wooden load pallet. Native Product is production mix in lumber mill and
      wooden boards/slats route, with no EURO certification, dimensions, timber treatment, load rating or provider
      specified. Use measured kg per actual pallet design; never infer a pallet mass from its piece count. Track
      reuse custody and refurbishment separately. This is manufacture packaging up to first release only; cp_pack
      keeps the complete material-specific stock/custody equation. Only actual use applies.
  - row_id: sawdust_in
    requirements: One received non-agglomerated clean untreated conifer sawdust waste, recovered for pellet manufacture;
      supplier, botanical species, origin, bark/contamination, wet mass and moisture basis are mandatory. Native
      Waste identity is unspecified sawdust at plant with untreated comb/rec route and lumber byproduct/fine-particle
      comment; it does not prove legal waste status or zero upstream burden, and it is not a Product coproduct or
      an agglomerate. Verify actual material-recovery interface and inherited upstream vector. If legally supplied
      as Product coproduct, obtain a compatible Product identity rather than relabelling this Waste UUID. Exclude
      treated timber, composite-board sanding waste and chemical contamination; do not infer untreated from an unknown
      source.
  - row_id: oxygen_consumed
    requirements: Conditional net atmospheric oxygen consumed by actual combustion, independently derived from fuel/exhaust
      composition and gas measurements. Native Elementary resource is oxygen from air, CAS 7782-44-7; not purchased
      oxygen or an emission. Keep gross inlet/outlet air diagnostics with measured humidity; cancel unchanged carrier
      nitrogen and excess oxygen symmetrically, not selectively to force a balance.
  - row_id: nitrogen_consumed
    requirements: Conditional net atmospheric N2 actually converted into measured nitrogen oxides during combustion,
      distinct from fuel nitrogen and unchanged carrier N2. Native Elementary resource is dinitrogen from air, CAS
      7727-37-9, Mass/kg; not purchased liquid nitrogen, a total-nitrogen indicator or an emission. Keep independently
      measured gas/speciation evidence and gross air diagnostics; symmetric cancellation of unchanged carrier N2
      must retain actual reactive nitrogen consumption. No assumed fuel/thermal-NOx share.
  - row_id: pellets_out
    requirements: 'Unique reference Product output: 1 kg net pellets at their first quality release after actual
      cooling, final fines screening and initial required packing. Native identity is manufactured finished wood
      pellets, production mix at plant, specifically sawdust/wood waste in pellet form; no fixed species, additive
      allowance, quality grade, geometry, moisture, density, heat value or geographic/provider specification is
      supplied. Here use only declared clean untreated conifer sawdust with no deliberate binder and documented
      actual startup-oil disposition. Qualify species/source and waste recovery, cylindrical die-extruded pellet
      form (not briquettes or loose sawdust), no torrefaction/carbonisation, measured release moisture, ash, durability,
      fines, dimensions, dry matter, net mass and package state. Record measured matched-state NCV separately when
      required; this native reference is Mass/kg. The same batch’s closing finished goods already contain this released
      output; dispatch or reinspection cannot create it again.'
  - row_id: fossil_co2
    requirements: Conditional fossil carbon dioxide from actual gas/diesel combustion. Native Elementary emission
      to outdoor air, unspecified receiving subcompartment, CAS 124-38-9 and Mass/kg; no long-term, indoor, water
      or special-stack substitution. Quantify actual substance after controls and distinguish origin without adding
      source partitions to the whole amount. No emission factor or characterization factor is inherited. Evidence
      of absence must include method, detection limit and operating conditions; otherwise retain an unknown and
      add every real additional species separately.
  - row_id: biogenic_co2
    requirements: Conditional biogenic carbon dioxide only when actual wood oxidation/degradation or documented
      biomass combustion occurs; do not copy a biomass boiler into a gas-fired plant. Native Elementary emission
      to outdoor air, unspecified receiving subcompartment, CAS 124-38-9 and Mass/kg; no long-term, indoor, water
      or special-stack substitution. Quantify actual substance after controls and distinguish origin without adding
      source partitions to the whole amount. No emission factor or characterization factor is inherited. Evidence
      of absence must include method, detection limit and operating conditions; otherwise retain an unknown and
      add every real additional species separately.
  - row_id: carbon_monoxide
    requirements: Conditional actual fossil carbon monoxide; independently identified biogenic CO needs its own
      separately verified exchange. Native Elementary emission to outdoor air, unspecified receiving subcompartment,
      CAS 630-08-0 and Mass/kg; no long-term, indoor, water or special-stack substitution. Quantify actual substance
      after controls and distinguish origin without adding source partitions to the whole amount. No emission factor
      or characterization factor is inherited. Evidence of absence must include method, detection limit and operating
      conditions; otherwise retain an unknown and add every real additional species separately.
  - row_id: nitrogen_monoxide
    requirements: Conditional actual nitrogen monoxide; NOx as NO2-equivalent cannot be called NO mass. Native Elementary
