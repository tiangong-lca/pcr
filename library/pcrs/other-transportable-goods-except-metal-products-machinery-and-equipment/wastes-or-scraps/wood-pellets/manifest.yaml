      Evidence of absence must include method, detection limit and operating conditions; otherwise retain an unknown
      and add every real additional species separately.
  - row_id: fossil_methane
    requirements: Conditional actual fossil methane leak or combustion slip; natural gas is not pure methane. Native
      Elementary emission to outdoor air, unspecified receiving subcompartment, CAS 74-82-8 and Mass/kg; no long-term,
      indoor, water or special-stack substitution. Quantify actual substance after controls and distinguish origin
      without adding source partitions to the whole amount. No emission factor or characterization factor is inherited.
