    rule: "Apply this hierarchy only in an attributional model where allocation is actually needed. First isolate dedicated stages/meters and use justified real or virtual subdivision; keep sawdust upstream multifunctionality, manufacturing and subsequent services distinct. A shared code, positive price, physical mass balance or industrial brochure does not select an allocation factor."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_causality
    applies_to: "all inventory rows"
    rule: "For each genuinely shared exchange independently demonstrate the determining physical causal relation and retain its measured driver, applicable outputs and rationale: embodied wood/water, actual drying evaporation/heat, press operation or time with the limiting service property as appropriate. Do not apply mass or energy indiscriminately to every flow; physical reconciliation occurs before burden attribution."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_residual
    applies_to: "all inventory rows"
    rule: "Only the remaining inseparable common-process burdens use contemporaneous market values of actual co-functions at the same common process gate in their actual moisture/quality state. Document actual quantities, prices, period, currency, failed earlier hierarchy steps and sensitivity. Do not use later customer fuel value, gross wet weight or an arbitrary physical/economic choice as a shortcut. Zero/negative/unknown value requires explicit review, not an invented share."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_recovery
    applies_to: "sawdust_in; wood_fines_waste; condensate_return"
    rule: "Document supplier coproduct/waste status, upstream burden transfer and recovery/treatment boundary. Waste labels, no purchase price, internal reinput or a renewable origin do not establish zero burdens, avoided production, heat substitution or biogenic neutrality. Keep recovered-material, treatment and actual useful exported heat functions explicit; if heat/electricity is actually co-produced, extend the complete utility process and apply this hierarchy. No automatic recycling, energy or carbon credit."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "pellet_make"
      flow_role: "first release and quality"
      record_type: "foreground record"
      raw_fields: "lot identity; prior release flag; gross/tare/net release Q; date; species; measured moisture with wet/dry basis; dimensions; fines; ash; durability; separate NCV state; packaging status; rejected quantity"
      collection_method: "Calibrated net weighing and unique quality-release register after cooling/screening and actual primary packing; independent representative moisture and quality sampling. Record the actual declared grade/test method and results without imposing a source example as a universal acceptance threshold. Collection sums unnormalized raw amounts by exchange/stage/cohort only; the aggregation field declares the final reporting basis and executes no division. Only the section 8 campaign/service calculation divides once."
      unit: "kg; moisture fraction; mm; MJ/kg"
      frequency: "every production lot and decision"
      temporal_coverage: "complete declared campaign including failures and stock changes; service records retain original cohort history"
      site_scope: "actual selected plant and equipment; do not combine incompatible sites/providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable raw tickets; full mode logs; supplier/quality evidence; uncertainty and reconciled stocks"
    - protocol_id: cp_material
      process_id: "pellet_make"
      flow_role: "incoming feed and preparations"
      record_type: "foreground record"
      raw_fields: "supplier; botanical species; origin; waste/product status; wet mass; moisture method; chemical treatment/contamination; bark; opening/closing raw and WIP; per-exchange inherited vectors; startup oil composition; oil stock; internal return pairs"
      collection_method: "Weigh each whole supply and stage stock; use traceable supplier declarations plus representative moisture/contamination checks. Trace forest/sawmill origin and actual upstream burdens; sawdust is not automatically burden-free. Record oil as one preparation and its assay as a nonadditive subledger. Collection sums unnormalized raw amounts by exchange/stage/cohort only; the aggregation field declares the final reporting basis and executes no division. Only the section 8 campaign/service calculation divides once."
      unit: "kg; moisture fraction"
      frequency: "each receipt stock census and return"
      temporal_coverage: "complete declared campaign including failures and stock changes; service records retain original cohort history"
      site_scope: "actual selected plant and equipment; do not combine incompatible sites/providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable raw tickets; full mode logs; supplier/quality evidence; uncertainty and reconciled stocks"
    - protocol_id: cp_energy
      process_id: "pellet_make"
      flow_role: "power and each actual fuel"
      record_type: "foreground record"
      raw_fields: "stage meter readings; gas mass or standard volume; fuel composition; independent density and LHV; gas reference state; submeter boundaries; voltage; supplier region/year; start/stop/idle; dry evaporation; actual steam provider"
      collection_method: "Read calibrated energy and fuel meters, reconcile invoices and stage meters, and log all operating modes; collect raw unnormalized readings. Match actual NG furnace and any real conditioning supply without duplicating purchased heat or boiler fuel. Collection sums unnormalized raw amounts by exchange/stage/cohort only; the aggregation field declares the final reporting basis and executes no division. Only the section 8 campaign/service calculation divides once."
      unit: "kWh; MJ; kg; m3 with state"
      frequency: "continuous meters and each campaign"
      temporal_coverage: "complete declared campaign including failures and stock changes; service records retain original cohort history"
      site_scope: "actual selected plant and equipment; do not combine incompatible sites/providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable raw tickets; full mode logs; supplier/quality evidence; uncertainty and reconciled stocks"
    - protocol_id: cp_water
      process_id: "pellet_make"
      flow_role: "free water steam condensate and vapour"
      record_type: "foreground record"
      raw_fields: "feed/free water; wet/dry stock masses; actual liquid additions; steam mass temperature pressure dryness enthalpy; provider water/heat agreement; condensate returns; reaction water evidence; inlet/outlet humidity; liquid effluent mass and composition"
      collection_method: "Independent calibrated water/steam and matched gas-humidity measurements with representative wood moisture samples; separately reconcile feed water, reaction water, condensate and ambient moisture. Unknown evaporation and unknown reaction water need independent evidence, not the same fitted residual. Collection sums unnormalized raw amounts by exchange/stage/cohort only; the aggregation field declares the final reporting basis and executes no division. Only the section 8 campaign/service calculation divides once."
      unit: "kg; degC; pressure with basis; kJ/kg"
      frequency: "each supply return and representative mode"
      temporal_coverage: "complete declared campaign including failures and stock changes; service records retain original cohort history"
      site_scope: "actual selected plant and equipment; do not combine incompatible sites/providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable raw tickets; full mode logs; supplier/quality evidence; uncertainty and reconciled stocks"
    - protocol_id: cp_pack
      process_id: "pellet_make"
      flow_role: "each packaging material custody"
      record_type: "foreground record"
      raw_fields: "packaging identity/composition; count; measured unit mass; O_empty; O_attached_WIP; O_attached_FG; O_reusable; P; I; receipt_id; physical_origin; ownership; inherited_burden_owner; ER; C_empty; C_attached_WIP; C_attached_FG; C_reusable; S_gross; EO; W; cohort; stage; actual provider"
      collection_method: "Separate calibrated weights and custody counts for every PE bag, film and board pallet, including material attached to WIP/FG and reusable stock. Apply packaging_custody in physical quantities before attributing net used/purchased supply burdens; counts alone supply no kg. Collection sums unnormalized raw amounts by exchange/stage/cohort only; the aggregation field declares the final reporting basis and executes no division. Only the section 8 campaign/service calculation divides once.  Record actual first non-purchase external receipts I separately from purchases P and external returns ER, including supplier-attached bags/film/pallets and first borrowed or leased articles. Link each real receipt and its ownership/history; P, I and ER are mutually exclusive and internal reuse is none of them. Retain the physical component even when its upstream burden is already included; no second purchase or duplicate whole-load quantity follows. Add its specific atomic physical interface if an existing interface does not represent the actual ingress."
      unit: "kg; item counts"
      frequency: "each receipt shipment return and stock census"
      temporal_coverage: "complete declared campaign including failures and stock changes; service records retain original cohort history"
      site_scope: "actual selected plant and equipment; do not combine incompatible sites/providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable raw tickets; full mode logs; supplier/quality evidence; uncertainty and reconciled stocks"
    - protocol_id: cp_waste
      process_id: "pellet_make"
      flow_role: "each reject and waste destination"
      record_type: "foreground record"
      raw_fields: "stream identity; stage; wet/dry mass; composition; oil contamination; stock; return pair; destination; actual legal status; contractor; inherited burden"
      collection_method: "Weigh each segregated fine, oil-free rejected pellet, oily startup pellet, grit and ferrous bin; reconcile stage yield, shipments and treatment tickets. Retain internal return counts independently from external waste and actual air emissions; no mixed other-waste remainder. Collection sums unnormalized raw amounts by exchange/stage/cohort only; the aggregation field declares the final reporting basis and executes no division. Only the section 8 campaign/service calculation divides once."
      unit: "kg"
      frequency: "each reject event and shipment"
      temporal_coverage: "complete declared campaign including failures and stock changes; service records retain original cohort history"
      site_scope: "actual selected plant and equipment; do not combine incompatible sites/providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable raw tickets; full mode logs; supplier/quality evidence; uncertainty and reconciled stocks"
    - protocol_id: cp_emission
      process_id: "pellet_make"
      flow_role: "each actual gas and particulate species"
      record_type: "foreground record"
      raw_fields: "source unit; substance CAS; fuel origin; control state; raw concentration; actual integrated volume versus rate; temperature pressure humidity; dry/wet reference basis; method; detection limit; operating time; particle-size definition; O2 consumption; uncertainty"
      collection_method: "Use actual controlled outlet/fugitive monitoring or independently validated substance-specific balances for the real furnace, dryer, handling and cooling modes, including failures and startup. Speciate actual substances; retain analytical total VOC/NOx separately from chemical mass. Add any detected methanol, acetaldehyde, terpene or other real species as a separate named exchange with matching media rather than hide it in zero or an other-emission family. Collection sums unnormalized raw amounts by exchange/stage/cohort only; the aggregation field declares the final reporting basis and executes no division. Only the section 8 campaign/service calculation divides once."
      unit: "kg; concentration with basis; m3 total or m3/time"
      frequency: "representative modes and complete campaign"
      temporal_coverage: "complete declared campaign including failures and stock changes; service records retain original cohort history"
      site_scope: "actual selected plant and equipment; do not combine incompatible sites/providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable raw tickets; full mode logs; supplier/quality evidence; uncertainty and reconciled stocks"
    - protocol_id: cp_service
      process_id: "pellet_service"
      flow_role: "original-cohort post-release service"
      record_type: "foreground record"
      raw_fields: "original cohort c and Qc; opening/closing FG mass and moisture; occupancy time; H; actual electricity/fuel with full state; replacement packs and each custody category; gross shipment; external return; loss; retest; reversed original delivery; incremental rework; inherited vectors; species measurements"
      collection_method: "Calibrated cohort-linked warehouse, energy, packing and dispatch records, including returned stock and old FG; apply the same material/unit/provider and emission protocols as corresponding manufacturing cards to the actual service equipment. Keep raw totals and residence evidence before normalize_service, with no assumed service duration. Collection sums unnormalized raw amounts by exchange/stage/cohort only; the aggregation field declares the final reporting basis and executes no division. Only the section 8 campaign/service calculation divides once."
      unit: "kg; kWh; MJ; state-specific volume; time; items"
      frequency: "each service event and stock census"
      temporal_coverage: "complete declared campaign including failures and stock changes; service records retain original cohort history"
      site_scope: "actual selected plant and equipment; do not combine incompatible sites/providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable raw tickets; full mode logs; supplier/quality evidence; uncertainty and reconciled stocks"
  calculation_rules:
    - id: raw_to_a
      applies_to: "all inventory rows"
      rule: "Convert each raw meter/weight to its exchange unit before attribution. For each exchange i retain its unnormalized burden vector: A_i equals dedicated current activity plus the justified allocated share of shared activity plus opening WIP inherited i minus closing WIP inherited i, with each actually transferred burden recorded once. Keep all failed lots, zero-output runs, startup, idle, cleaning and real rework activity; split recovered quantities and waste destinations before attribution. Never subtract closing finished goods of the same first-release cohort from manufacturing A_i, since their Q already exists."
      inputs:
        - raw_records
        - allocation_records
        - opening_wip_vectors
        - closing_wip_vectors
      output: "A_i"
      source_ids:
        - ilcd-allocation-2010
    - id: normalize_inventory
      applies_to: "all inventory rows"
      rule: "For manufacturing rows only and Q > 0, divide each unnormalized attributable A_i by the same unique first-release Q in kg exactly once to obtain a_i per 1 kg reference flow; pellets_out is 1 kg by definition. Cards and collection aggregation reference this same operation and do not divide again. For Q = 0 retain the complete raw loads and their custody for later justified attribution; produce no unit result and never replace Q by throughput or one."
      inputs:
        - A_i
        - Q
        - cp_release
      output: "a_i"
      source_ids: []
    - id: normalize_service
      applies_to: "all inventory rows"
      rule: "For service rows only, first attribute unnormalized service exchange S_ic to each original release cohort c using dedicated records and the allocation hierarchy. Divide S_ic by its original Qc once. Retain service quantities even where no new Q occurs. Publish the observed service duration and add a service result to manufacturing only for the same cohort and unit; do not rename H or net deliveries as production Q."
      inputs:
        - S_ic
        - Qc
        - cp_service
      output: "s_ic"
      source_ids:
        - ilcd-allocation-2010
    - id: wood_water_balance
      applies_to: "pellet_make"
      rule: "For every physical lot, wet wood mass W = dry wood D + free water F; measured wet-basis moisture w gives D = W*(1-w) and F = W*w; dry-basis moisture u = F/D, so w = u/(1+u). Independently reconcile dry wood, oil/additive solids, free water, combustion reaction water and elemental carbon/hydrogen/oxygen plus nitrogen and sulfur when present using measured composition and all opening/closing stocks. Feed free water is not structural hydrogen/oxygen in dry lignocellulose. Do not use one residual to fit two unknowns or treat COD/VOC as chemical mass. Report residuals with independent uncertainty rather than force equality."
      inputs:
        - wet_mass
        - dry_mass
        - moisture_basis
        - stocks
        - composition
        - measured_emissions
      output: "physical_wood_water_element_balance"
      source_ids: []
    - id: energy_gas_conversion
      applies_to: "all inventory rows"
      rule: "Use the exact native unit-group energy conversion 1 kWh = 3.6 MJ. For gas/liquid raw volume totals use independently measured substance-specific density at the stated pressure/temperature/moisture/composition; a cumulative volume is not multiplied by time. Only genuine rates are integrated over their actual time window. Gas concentration multiplied by matched dry/wet standard exhaust volume gives species amount using its actual reported basis; NOx-as-NO2 and total VOC do not determine species fractions. Measure actual pellet NCV at matched release moisture separately from bulk density; no universal kg-to-MJ or tonne-to-volume conversion."
      inputs:
        - meter_units
        - measured_density
        - gas_state
        - time
        - measured_NCV
        - cp_energy
        - cp_emission
      output: "converted_raw_amounts"
      source_ids: []
    - id: packaging_custody
      applies_to: "all inventory rows"
      rule: "For each packaging kind and cohort separately: O_empty + O_attached_WIP + O_attached_FG + O_reusable + P + I + ER = C_empty + C_attached_WIP + C_attached_FG + C_reusable + S_gross + EO + W. ER is actual external return received, S_gross is packaging physically leaving with gross shipments, EO is other external packaging return, and W is actual packaging waste. Keep categories mutually exclusive; internal reuse cancels and is not repurchase. P denotes actual purchase, not all packages handled. Measure every bag/film/pallet and actual separate component individually; returned empty packaging and repeated dispatch do not create pellet Q, credit or coproduct.  I denotes independently measured first non-purchase external physical ingress, including supplier-attached components and first borrowed/leased packaging; exclude the same receipts already represented in P or ER. Full opening/closing empty, attached WIP/FG and reusable stocks remain. Carry actual ownership and eligible inherited burden once. Physical P+I is not procurement consumption: attribute only the verified supplied scope and actual eligible withdrawals/service use, preserving unused-stock vectors and the upstream owner, without inventing another purchase, provider or credit."
      inputs:
        - cp_pack
        - cp_service
        - custody_receipts
        - stocks
        - gross_shipments
      output: "physical_packaging_balance"
      source_ids: []
    - id: finished_goods_balance
      applies_to: "pellet_service"
      rule: "At the service gate reconcile opening FG + newly released Q received + actual external pellet returns = closing FG + gross pellet shipments + actual service losses, with moisture uptake/evaporation separately measured and inherited burdens by cohort. Returns keep their original release identity; reverse original service/delivery records where appropriate and add only real incremental rework/handling. In the combined gate cancel the internal Q handoff; do not add same-cohort closing FG as extra manufacturing output. Use unallocated gross physical quantities for balances and A_i/S_ic only for burden accounts."
      inputs:
        - cp_release
        - cp_service
        - cohort_vectors
        - gross_physical_transfers
      output: "physical_fg_combined_gate_balance"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Every supplied preparation and real destination is one atomic exchange; preserve native names, full restrictions and exact reference-property/unit chain. Supplier/year/geography/form/grade compatibility, legal feed waste status and measured amounts remain independently required. Unresolved auxiliaries stay precisely named and prevent claiming the affected dataset complete."
      evidence: "supplier specifications and actual native identity review"
    - id: dq_period
      applies_to: "all inventory rows"
      requirement: "One complete declared campaign includes all operating modes and stock changes; do not select only successful steady-state runs. Retain each flow’s opening/closing WIP vectors and original FG release history; disclose missing history without inventing a zero."
      evidence: "full campaign register and vector reconciliation"
    - id: dq_science
      applies_to: "all inventory rows"
      requirement: "A future factory data package must provide actual grade/moisture/NCV and process/provider evidence, substance-specific emission coverage, uncertainties and absence evidence. No recipe or carbon-neutral/avoided-burden assertion follows from a general industrial example. Ordinary future measurements do not supply current observed factory values."
      evidence: "quality tests and methodological review"
validation_rules:
  - rule_id: v_reference
    applies_to: "pellets_out"
    rule: "Verify the unique linked Product output is 1 kg net first-release manufactured wood pellets with the complete declared qualifiers. Reject hot uncooled intermediate pellets, non-pellet agglomerates and loose sawdust as this finished reference; no grade or NCV may be inferred from UUID alone."
    source_ids:
      - coford-pellets-2007
  - rule_id: v_scope
    applies_to: "pellet_make"
    rule: "Require untreated clean conifer source and actual moisture/additive/oil disclosure, full drying-to-release topology and verified supply state. Treated/composite feed, briquettes and unagglomerated output are outside scope. A manufactured pellet UUID cannot stand for its upstream sawdust or authorize an incompatible energy provider."
    source_ids:
      - coford-pellets-2007
      - bordiga-pellets
  - rule_id: v_quantity
    applies_to: "all inventory rows"
    rule: "Check raw-unit conversion and attribution precede exactly one A_i/Q manufacturing or S_ic/Qc service normalization. Protocols collect unnormalized values only. Keep Q0 records without a unit result; H, gross shipment and repeat release must never replace the declared reference basis."
    source_ids: []
  - rule_id: v_physical
    applies_to: "pellet_make; pellet_service"
    rule: "Independently close physical total mass, dry wood, water, oil and relevant elements at manufacturing, FG-service and combined gates using actual measured gross transfers, stocks and reaction species. Symmetric internal handoffs cancel, but losses and inherited burdens remain. Do not substitute allocated burdens for physical outputs or fit multiple unknowns to one residual."
    source_ids: []
  - rule_id: v_pack
    applies_to: "all inventory rows"
    rule: "Check each separate bag, film, pallet and actual additional component against packaging_custody including empty, attached WIP/FG and reusable opening/closing states, external returns and gross shipments. Count no internal reuse twice, no packaging in net pellet Q, and no automatically saleable recovered packaging."
    source_ids: []
  - rule_id: v_native
    applies_to: "all inventory rows"
    rule: "Validate actual Product/Waste/Elementary type, CAS, route, form, supply geography, receiving medium, every native property and exact unit chain; keep unverified auxiliaries unbound. Outdoor unspecified-air UUIDs do not establish known stack subcompartments; species totals and their source/size partitions are mutually exclusive representations. A monitoring unknown or mismatched provider cannot be reported as passed or zero."
    source_ids: []
  - rule_id: v_allocation
    applies_to: "all inventory rows"
    rule: "Require documented dedicated/virtual subdivision, exchange-specific determining physical causality and only then any residual common-gate market-value allocation; test sensitivity and status of actual co-functions. No fixed yield/share, avoided fuel, disposal, recycling or biogenic-neutral credit."
    source_ids:
      - ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Supply one declared first-release wood fuel pellet state to downstream transport/storage/fuel-use models with separate observed services"
  allowed_use: "Matched source/species, no deliberate binder, actual moisture/quality and compatible provider gates; measured energy conversion only"
  excluded_use: "Useful-heat substitution; universal quality/NCV/density; briquettes or loose sawdust; carbon neutrality, avoided disposal or recycling credits; treating an unmeasured candidate as observed factory data"
  required_metadata: "All required qualifiers, raw collection protocols, actual plant/year/providers, inventory UUID limitations, complete upstream boundary, Q/Qc, cohort stock vectors and allocation decisions"
  required_quality_disclosure: "Measured versus unknown values; identity and provider gaps; chemical/particle-size coverage; Q0 loads; historical WIP/FG provenance; service observation duration; uncertainty and source applicability"
  update_trigger: "Changed feed source/species/treatment, deliberate additives, furnace/fuel or steam supply, die/cooling/packing/release gate, native flow restrictions or new physical/quality evidence"
data_sources:
  - id: "coford-pellets-2007"
    type: "extension_guidance"
    reference: "[COFORD, Pieter D. Kofman (2007), The production of wood pellets, Processing/Products No.10, complete pp.1–6](https://www.coford.ie/media/coford/content/publications/projectreports/cofordconnects/ccnpellet_production.pdf)"
    used_for: "Industrial stage topology; wet feed drying; steam conditioning and die action; cooling and fines return; startup oil and packaging counterexamples. Old technical-specification thresholds are not adopted."
  - id: "sca-pellets-production"
    type: "literature"
    reference: "[SCA, From by-product to efficient biofuel, production and additive-free sections, dated snapshot 26 October 2026](https://www.sca.com/en/renewable-energy/solid-biofuels/bioenergy-for-businesses/pellets/pellet-production/)"
    used_for: "Manufacturer primary corroboration of sawdust-to-fuel-pellet terminal and no deliberate binder; observed biomass drying energy and exported heat are alternative arrangements, not gas-plant defaults or allocation rules."
  - id: "bordiga-pellets"
    type: "literature"
    reference: "[Bordiga, Pellet: raw material, drying, production line and supply forms, dated snapshot 26 October 2026](https://www.bordiga.it/en/pellet/)"
    used_for: "Primary untreated virgin-solid-wood sawdust and packaged pellet supply evidence. Pine/spruce wording is inconsistent; no botanical species, advertised carbon neutrality, certification, bag mass or energy quantity is inferred."
  - id: "ncsu-energy-pellets-2013"
    type: "extension_guidance"
    reference: "[NC State Extension (published 2014-09-04; reviewed/revised 2024-05-22; body retains 2013 authoring context), Energy Pellets: A Heating Fuel Resource for North Carolina Farms and Homes, pelleting process, conditioning and pellet management](https://content.ces.ncsu.edu/energy-pellets-a-heating-fuel-resource-for-north-carolina-farms-and-homes)"
    used_for: "Independent process explanation and variability of moisture, feedstock, conditioning, binder and fines management; farm-scale binder or moisture numbers are not industrial conifer-pellet defaults."
  - id: "ilcd-allocation-2010"
    type: "handbook"
    reference: "[European Commission JRC (2010), ILCD Handbook General guide for LCA, Detailed guidance, §§7.9.2–7.9.3, pp.255–272](https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf)"
    used_for: "Attributional modelling only where allocation is required: subdivision/virtual subdivision, exchange-specific determining physical causality and residual common-process market value at actual gate/state. Not a pellet recipe or numerical allocation factor."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:1a8dcc915ae7064f0f694982cbffa7a9c03962dc444eeae897bc25849143f078"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6169"
      family: "system_boundary"
      span:
        start:
          offset: 6169
          line: 59
          column: 1
        end:
          offset: 10649
          line: 81
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Received wet clean untreated conifer sawdust recovered at the actual supplier-to-pellet-plant gate; upstream forestry/sawmill/recovery/transport remains linked |\n| starting_condition_role | Declared foreground entry, not burden-free origin or a purchase of finished pellets |\n| product_classification_scope | CPC3.0 39281 fuel pellets within this narrower actual route; 39282/39283 distinct |\n| recursive_input_rule | Internal fines/rework stays paired and cancels on consolidation; any external finished-pellet input needs its own upstream dataset and explicit route/applicability review, never self-recursive burden-free manufacture |\n| upstream_dataset_requirement | Actual supplier recovery/product status, stock history, energy/fuel/steam, packaging and transport/treatment providers with their complete compatible boundaries |\n| disclosure | Actual plant/period, start gate, source and species, chemistry, measured water/energy, allocation, WIP/FG vectors, initial packing and later observed service account |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| `b_complete` | pellet_make | Include real upstream sawdust generation/recovery burdens and transport plus complete receipt, storage, drying, foreign-body removal, size preparation, actual conditioning, die extrusion, cooling, final screening, initial packing and first quality release. The selected design uses a natural-gas-fired dryer furnace, not a purchased finished-pellet packaging operation. A source describing wood-fuel combustion is not automatically the selected energy provider. | `coford-pellets-2007`; `sca-pellets-production` |\n| `b_gate` | pellets_out | Q is the sum of unique net first-quality-released pellet masses at measured release moisture in kg, after cooling/screening and actual required primary packing. Tare is excluded. Count each physical batch once. Same-cohort closing finished goods are already part of Q, not another production output. Later shipment, retest, repacking and return do not increase Q. Keep their actual services and physical stocks. | `coford-pellets-2007` |\n| `b_utilities` | pellet_make | Determine actual furnace/boiler/steam/heat provider boundaries before computing burdens. Do not default a steam boiler, equal condensate return, biomass burner, heat export or electricity generation into existence. If actual purchased steam replaces onsite generation, use one provider and the agreed heat/water boundary. Real alternative fuels, wood-fired heat, cooling water, separate preparations, filters, labels, closures or chemicals must be added as individually named atomic exchanges with full provider/emission accounting before dataset completeness; unknown is not zero. | `coford-pellets-2007`; `ncsu-energy-pellets-2013` |\n| `b_returns` | pellet_make | Pair every screen-fines, captured-dust, off-spec regrind, oily startup pellet and condensate internal return with its source and receiving stage, wet/dry wood, water, oil and inherited per-exchange burden vector. Internal transfers cancel only on consolidation; repeated-pass power/heat and losses remain. Partition each captured stream among reinput, storage, external transfer and release without adding partitions to the whole. | `coford-pellets-2007` |\n| `b_services` | pellet_service | Maintain a post-release service account by original release cohort c, using its original Qc in kg. Store actual cohort occupancy, moisture changes, handling throughput H, gross shipments, returns, loss and additional packaging separately. H is a service activity metric and never a production denominator. Record old-stock services even without new production. At the combined physical gate internal first-release Q transfers cancel; external net shipment need not equal Q. | `ilcd-allocation-2010` |\n| `b_exclusions` | all inventory rows | No fixed grade, bag capacity, moisture target, density, calorific value, energy/yield, lifespan or emission factor is prescribed. Exclude briquettes/wood blocks (CPC39282), non-agglomerated delivered sawdust (CPC39283), composite/chemically contaminated feed, torrefied or carbonised pellets, installed heating and fuel combustion at the customer. Ordinary missing auxiliary UUIDs and provider/foreground measurements remain explicit completion requirements, not fabricated defaults. | `coford-pellets-2007`; `ncsu-energy-pellets-2013` |\n\n"
