product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.wastes-or-scraps.wood-pellets"
  classification_refs: "CPC 3.0:39281; narrower untreated conifer fuel-pellet method; no accepted mapping is established here"
  covered_products: "Cooled screened die-extruded clean untreated conifer sawdust fuel pellets at first quality release"
  excluded_products: "39282 non-pellet agglomerated blocks/briquettes; 39283 loose non-agglomerated sawdust; treated/composite contaminated feed; added-binder fuel without separate review; torrefied/charcoal pellets; animal feed/bedding; installed heating"
  representative_product: "One declared conifer-source fuel pellet lot with measured release moisture and actual quality specification"
  production_route: "Wet sawdust receipt and stocks → gas-fired drying → foreign-body screening and hammer milling → actual conditioning → die extrusion → cooling and fines screening → actual initial packing → first release; separate original-cohort later services"
  market_state: "Manufactured unburned fuel pellets; package mass excluded from net reference; quality and water state declared, no universal grade"
functional_unit:
  what: "Supply declared wood pellet fuel at the manufacturing release gate; not useful heat at a customer"
  how_much: "1 kg net first-quality-released pellets at measured release moisture"
  how_well: "Actual declared dimensions, durability, fines, ash, moisture, species/source and no deliberate binder; independent actual test evidence"
  how_long_or_cycle: "One complete declared production campaign and each unique first release; post-release service duration separately observed"
  reference_flow_link: "pellets_out"
system_boundary:
  rules:
    - rule_id: b_complete
      applies_to: "pellet_make"
      rule: "Include real upstream sawdust generation/recovery burdens and transport plus complete receipt, storage, drying, foreign-body removal, size preparation, actual conditioning, die extrusion, cooling, final screening, initial packing and first quality release. The selected design uses a natural-gas-fired dryer furnace, not a purchased finished-pellet packaging operation. A source describing wood-fuel combustion is not automatically the selected energy provider."
      source_ids:
        - coford-pellets-2007
        - sca-pellets-production
    - rule_id: b_gate
      applies_to: "pellets_out"
      rule: "Q is the sum of unique net first-quality-released pellet masses at measured release moisture in kg, after cooling/screening and actual required primary packing. Tare is excluded. Count each physical batch once. Same-cohort closing finished goods are already part of Q, not another production output. Later shipment, retest, repacking and return do not increase Q. Keep their actual services and physical stocks."
      source_ids:
        - coford-pellets-2007
    - rule_id: b_utilities
      applies_to: "pellet_make"
      rule: "Determine actual furnace/boiler/steam/heat provider boundaries before computing burdens. Do not default a steam boiler, equal condensate return, biomass burner, heat export or electricity generation into existence. If actual purchased steam replaces onsite generation, use one provider and the agreed heat/water boundary. Real alternative fuels, wood-fired heat, cooling water, separate preparations, filters, labels, closures or chemicals must be added as individually named atomic exchanges with full provider/emission accounting before dataset completeness; unknown is not zero."
      source_ids:
        - coford-pellets-2007
        - ncsu-energy-pellets-2013
    - rule_id: b_returns
      applies_to: "pellet_make"
      rule: "Pair every screen-fines, captured-dust, off-spec regrind, oily startup pellet and condensate internal return with its source and receiving stage, wet/dry wood, water, oil and inherited per-exchange burden vector. Internal transfers cancel only on consolidation; repeated-pass power/heat and losses remain. Partition each captured stream among reinput, storage, external transfer and release without adding partitions to the whole."
      source_ids:
        - coford-pellets-2007
    - rule_id: b_services
      applies_to: "pellet_service"
      rule: "Maintain a post-release service account by original release cohort c, using its original Qc in kg. Store actual cohort occupancy, moisture changes, handling throughput H, gross shipments, returns, loss and additional packaging separately. H is a service activity metric and never a production denominator. Record old-stock services even without new production. At the combined physical gate internal first-release Q transfers cancel; external net shipment need not equal Q."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_exclusions
      applies_to: "all inventory rows"
      rule: "No fixed grade, bag capacity, moisture target, density, calorific value, energy/yield, lifespan or emission factor is prescribed. Exclude briquettes/wood blocks (CPC39282), non-agglomerated delivered sawdust (CPC39283), composite/chemically contaminated feed, torrefied or carbonised pellets, installed heating and fuel combustion at the customer. Ordinary missing auxiliary UUIDs and provider/foreground measurements remain explicit completion requirements, not fabricated defaults."
      source_ids:
        - coford-pellets-2007
        - ncsu-energy-pellets-2013
boundary_abstraction:
  declared_starting_condition: "Received wet clean untreated conifer sawdust recovered at the actual supplier-to-pellet-plant gate; upstream forestry/sawmill/recovery/transport remains linked"
  starting_condition_role: "Declared foreground entry, not burden-free origin or a purchase of finished pellets"
  product_classification_scope: "CPC3.0 39281 fuel pellets within this narrower actual route; 39282/39283 distinct"
  recursive_input_rule: "Internal fines/rework stays paired and cancels on consolidation; any external finished-pellet input needs its own upstream dataset and explicit route/applicability review, never self-recursive burden-free manufacture"
  upstream_dataset_requirement: "Actual supplier recovery/product status, stock history, energy/fuel/steam, packaging and transport/treatment providers with their complete compatible boundaries"
  disclosure: "Actual plant/period, start gate, source and species, chemistry, measured water/energy, allocation, WIP/FG vectors, initial packing and later observed service account"
