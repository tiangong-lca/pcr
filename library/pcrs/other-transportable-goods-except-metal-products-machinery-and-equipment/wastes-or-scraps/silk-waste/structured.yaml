allocation_rules:
  - rule_id: al_framework
    applies_to: "attributional functions"
    rule: "Identify every actual cofunction and its actual legal/receiver status at a common process gate. Brushing fibre is one segregated supply function. Raw silk, whole pupae and other separately accepted products are distinct; material sent for treatment is not automatically a valuable cofunction. No consequential substitution or avoided-production credit is allowed."
    source_ids:
      - ilcd-2010
  - rule_id: al_exclusive
    applies_to: "each exchange j"
    rule: "First use dedicated process measurement, actual subdivision and justified virtual subdivision to assign exclusive work and embodied inputs. Separate brushing collection and its exclusive inspection from unrelated raw-silk finishing. Retain the common formation process; being a residual does not make that process burden-free."
    source_ids:
      - ilcd-2010
  - rule_id: al_causality
    applies_to: "remaining joint exchanges"
    rule: "Test exchange-specific determining physical causality using measured function, technology and counterfactual changes. Different exchanges may have different drivers. Cocoon dry matter embodied in fibre, dissolved material and pupa must be independently traced; wet output mass alone is not a universal allocation key. Document losses and unvalued outputs rather than assigning all embodied material to saleable fibre."
    source_ids:
      - ilcd-2010
  - rule_id: al_residual_value
    applies_to: "genuinely unassigned residual exchanges"
    rule: "Only after preceding steps remain insufficient, allocate the residual common-process vector by contemporaneous market values of actual cofunctions in their physical state at that same gate. Reconstruct gate values from later sales only by removing documented downstream conditioning, packaging, storage and transport. Keep prices, amounts, currency, dates, uncertainty and sensitivity. Do not use spun-yarn prices for wet brushing fibre or fix a universal percentage. Missing defensible values leave that residual unresolved."
    source_ids:
      - ilcd-2010
  - rule_id: al_vectors
    applies_to: "stocks and services"
    rule: "Preserve each exchange-specific inherited vector by physical lot at opening/closing raw stock, WIP and FG. Withdraw unused non-WIP and closing WIP burdens only from numerators that actually included them; an already net consumption must not be reduced again. Service shares attach to original Qc, never H. Reworked previously released stock carries its original vector plus real incremental work and loss; no second product purchase or new Q."
    source_ids:
      - ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "residue_release"
      flow_role: "first-release quantity"
      record_type: "weighing and acceptance register"
      raw_fields: "lot; origin stage; species; gross mass; tare; drainage method; drainage duration; measured moisture; dry solids; receiver criteria; first acceptance time; previous acceptance flag; Q; closing FG cohort"
      collection_method: "Calibrated wet-fibre weighing and separate moisture sampling under the declared receiver-compatible drainage condition; verify acceptance uniqueness and prevent water addition; retain failed and zero-output runs."
      unit: "kg"
      frequency: "Every lot and stock close"
      temporal_coverage: "Complete cohort including failed work"
      site_scope: "Filature and named receiver specification"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; sampling records; original acceptance and drainage logs"
    - protocol_id: cp_ledger
      process_id: "joint_reeling"
      flow_role: "atomic gross and attributable exchanges"
      record_type: "physical and inherited-vector ledger"
      raw_fields: "process id; row id; lot; original quantity; original unit; flow state; supplier; destination; opening raw/WIP/FG; receipts; gross crossings V; closing raw/WIP/FG; unused non-WIP; transfer IDs; inherited vector by j; allocation evidence; A by j; failed runs; Qc; H; return history"
      collection_method: "Weigh or meter each named exchange and match receiving/dispatch documents; retain every raw cell and separate vector; reconcile physical gates before attribution. Record raw transaction and its already-net flag."
      unit: "row native unit"
      frequency: "Each crossing plus monthly close"
      temporal_coverage: "Entire reporting period and inherited lots"
      site_scope: "All three foreground processes and upstream suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Matched tickets; supplier scope; receiver receipt; vector conservation"
    - protocol_id: cp_energy
      process_id: "joint_reeling"
      flow_role: "electricity by operation and cohort"
      record_type: "meter readings"
      raw_fields: "process id; lot; meter id; opening reading; closing reading; kWh; real power rate if used; time interval; heater/motor; voltage; country; idle/cleanup/startstop; calibration; cohort service driver"
      collection_method: "Read cumulative energy meters; integrate only actual power rates; separate common and dedicated loads before allocation. Keep zero-Q periods and service timing."
      unit: "kWh"
      frequency: "Shift and meter interval"
      temporal_coverage: "Production and after-release service duration"
      site_scope: "Declared steam-heated site configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration and matched utility bill"
    - protocol_id: cp_water
      process_id: "joint_reeling"
      flow_role: "water and species balances"
      record_type: "mass and analytical records"
      raw_fields: "process id; lot; supplied water; bath stocks; recirculation; drainage; condensate; independently measured vapour; output moisture; liquid total; suspended solids; dissolved solids; COD/TOC/TN; assay methods; temperature; integrated volume or rate; measured density; receiving medium"
      collection_method: "Meter and sample independently; preserve phase and state; quantify water and solids without solving several unknowns from one residual. Treat elemental or organic indicators separately from actual species."
      unit: "kg; original analytical unit"
      frequency: "Every lot and discharge interval"
      temporal_coverage: "Complete baths and cohort moisture history"
      site_scope: "Filature water circuits and external treatment receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Independent water/solids tests; meter and analytical uncertainty"
    - protocol_id: cp_packaging
      process_id: "cohort_services"
      flow_role: "one ledger per packaging material"
      record_type: "article and ownership stock register"
      raw_fields: "article composition; measured article mass; opening empty; opening attached WIP; opening attached FG; opening reusable; P purchases; I internal reuse; ER external returns received; S gross shipment packaging; EO external returns out; W waste; closing empty; closing attached WIP; closing attached FG; closing reusable; Qc; H; N first non-purchased receipts; bundled-payment flag; acquisition burden owner; prior outward article and movement ID for ER"
      collection_method: "Count and weigh the actual homogeneous article configuration; match external returns and gross dispatch, including historical goods. Collect raw P/N/I/ER/S/EO/W independently; preserve ownership and inherited vector. P includes separately paid and bundled paid receipts; N is a first non-purchased external receipt, not a return or evidence of zero burden. Match ER to the same article's documented prior outward movement; record each crossing once. If N occurs, add its own atomic receipt card for the actual article. Count each acquisition provider once, including any burden already embedded in a supplied or historical vector. Add separate cards for any actual other material."
      unit: "kg"
      frequency: "Every movement and stock close"
      temporal_coverage: "Full packaging lifetime window within reporting scope"
      site_scope: "Filature and external owners"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Purchase/return tickets; weighed configuration; full stock balance"
    - protocol_id: cp_steam
      process_id: "joint_reeling"
      flow_role: "steam supply and condensate interface"
      record_type: "mass and enthalpy meter register"
      raw_fields: "process id; lot; steam mass; steam pressure; temperature; dryness; measured or documented enthalpy basis; heating configuration; direct/indirect contact; actual condensate return mass; return temperature/pressure/enthalpy; actual condensate discharge; actual vent mass; internal loop stock; provider water/energy inclusion; gross/net heat flag; meter uncertainty"
      collection_method: "Meter each actual external mass and thermal state independently; keep heating-water and steam circuits distinct. Reconcile supply invoice scope and return contract; do not fabricate recovery or boiler inputs. Thermal subaccounts describe the same supplied mass, not another purchase."
      unit: "kg; original thermal-state units"
      frequency: "Every supply/return interval"
      temporal_coverage: "Complete period including idle, startstop and Q0"
      site_scope: "Actual filature–external steam supplier interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated mass/thermal meters; enthalpy derivation; supplier boundary and return agreement"
  calculation_rules:
    - id: raw_unit_conversion
      applies_to: "all inventory rows"
      rule: "Preserve original records; convert numerator units once with traceable factors before allocation. For electricity use MJ = 3.6 * kWh. For an actual rate integrate over its actual interval; cumulative readings are differences only. A substance-specific measured density converts its volume to mass when justified."
      inputs:
        - "original quantities"
        - "original units"
        - "measured conversion factors"
        - cp_energy
        - cp_water
      output: "converted raw row totals"
      source_ids:
        - ilcd-2010
    - id: gross_balance
      applies_to: "all inventory rows"
      rule: "For each physical material and gate: opening stock + external receipts + internal receipts = closing stock + external outflows + internal transfers + independently measured transformation terms. Separate wet mass, dry solids, water and relevant measured elements. Cancel internal transfers only in the combined gate; use V before allocation."
      inputs:
        - V
        - cp_ledger
        - cp_water
      output: "reconciled physical V ledger"
      source_ids:
        - ilcd-2010
    - id: first_release_quantity
      applies_to: "finished_brushing_fibre"
      rule: "Q = sum newly first-released net wet brushing fibre under cp_release. That register already includes newly accepted closing FG once. Exclude prior accepted returns, reinspection, separate water, packaging and gross shipment H. If Q = 0 preserve actual loads and issue no unit result."
      inputs:
        - cp_release
        - "unique first acceptance records"
      output: "Q"
      source_ids:
        - fao-silk-1999
        - ilcd-2010
    - id: attributed_vector
      applies_to: "all inventory rows"
      rule: "For each exchange j and lot construct A_j from exclusively assigned and legitimately allocated converted raw loads plus inherited opening WIP vectors and actual cohort services. Remove closing WIP and unused non-WIP vectors only if included in that numerator. Already-net raw consumption is not reduced again. Sum within the selected Q cohort; historical FG retains original production vectors and only receives real incremental services. F is genuinely new foreground work; an overlap subtraction X is allowed only for an exact documented same-side duplicate already within OTHER, never for a different flow or physical export."
      inputs:
        - "converted raw row totals"
        - cp_ledger
        - "allocation evidence"
        - "cohort service records"
      output: "A_j; separate physical companion total V_j"
      source_ids:
        - ilcd-2010
    - id: unit_result
      applies_to: "all inventory rows"
      rule: "For Q > 0 the sole unit calculation is x_j = A_j / Q. A gross physical companion report uses v_j = V_j / Q separately and is labelled physical only. For services on an earlier cohort use its original Qc in place of Q, never H; append its attributed service component to that cohort result without dividing that component again. The reference output itself is exactly 1 kg. Cards and collection reporting reference this same quotient and perform no second normalization."
      inputs:
        - A_j
        - V_j
        - Q
        - Qc
        - cp_release
        - cp_ledger
      output: "x_j; v_j"
      source_ids:
        - ilcd-2010
    - id: steam_interface
      applies_to: "industrial_steam; condensate_external_return; condensate_waste"
      rule: "Preserve independently measured steam and condensate masses and their real thermodynamic states. On a consistent enthalpy datum, supplied thermal energy is incoming steam enthalpy minus actually exported return/discharge enthalpy and any other measured thermal outflow, with internal stock change explicit. The provider agreement determines whether the purchased heat datum is gross or already net; do not deduct condensate heat twice. This heat subaccount is not a second provider, a density conversion or a new Q denominator."
      inputs:
        - cp_steam
        - "measured mass and state"
        - "enthalpy datum"
        - "supplier heat agreement"
      output: "one steam mass/thermal interface subaccount"
      source_ids:
        - fao-silk-1999
        - ilcd-2010
    - id: packaging_balance
      applies_to: "pe_bag_purchase; pe_bag_external_received; pe_bag_shipped; pe_bag_external_out; pe_bag_discard"
      rule: "For this one article: opening empty + opening attached WIP + opening attached FG + opening reusable + P + N + ER = closing empty + closing attached WIP + closing attached FG + closing reusable + S + EO + W. N is first non-purchased receipt; ER requires that same article's documented prior outward movement. P, N and ER are mutually exclusive receipt classes; S and EO never duplicate the same outward crossing. I is internal reuse and cancels. S follows all gross dispatch H, including historical goods and repeat shipment. P is one purchase; ER is not P. Neither I nor packaging is Q or an automatic coproduct."
      inputs:
        - cp_packaging
        - P
        - I
        - ER
        - S
        - EO
        - W
        - H
        - N
      output: "balanced PE article ledger"
      source_ids:
        - ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each flow"
      requirement: "Preserve original source form, actual state, supplier route, all native restrictions and complete qualifiers; an available UUID supplies no missing measurement or legal evidence."
      evidence: "Supplier and receiver specification; direct identity context"
    - id: dq_complete
      applies_to: "all rows and periods"
      requirement: "Full raw records including failed/Q0, idle, startup, cleanup, rework, opening/closing raw/WIP/FG and exact inherited vectors; no silent zero for missing data."
      evidence: "cp_ledger reconciled to all physical gates"
    - id: dq_allocation
      applies_to: "joint work"
      requirement: "Subdivide exclusive work first; each remaining causal driver needs evidence; only residual same-state common-gate value may be used. Preserve uncertainty and sensitivity, including unavailable values."
      evidence: "Original meter/process records and dated market documents"
    - id: dq_measurement
      applies_to: "wet fibre and effluent"
      requirement: "Independent moisture, solids, water and actual species tests with sampling state and uncertainty. Do not apply historical floss-yield, alkali concentration or spun-yarn examples to this untreated brushing residue."
      evidence: "cp_release and cp_water original laboratory reports"
    - id: dq_applicability
      applies_to: "source synthesis"
      requirement: "Technical operations are synthesized from a historical manual and general attributional guidance; no same-factory numerical baseline or universal receiver limit is claimed. Replace site-specific quantities with actual records and disclose source age and scope."
      evidence: "Source-specific applicability statement and site records"
validation_rules:
  - rule_id: val_reference
    applies_to: "supply dataset"
    rule: "Require exactly one finished_brushing_fibre Product reference output with the declared UUID, Mass/kg and 1 kg, plus every required qualifier. Reject Waste-for-Product substitution, mixed fibre collections, processed floss and duplicate first acceptance."
    source_ids:
      - un-cpc3-39211
      - fao-silk-1999
  - rule_id: val_formation
    applies_to: "process completeness"
    rule: "Verify complete cocoon-to-residue operations and upstream supplier states, every actual atomic input/output and route deviation. Purchased dried cocoons cannot use a native fresh farm-gate Flow; ground pupa meal and woven fabric cannot stand for whole pupae or fibre residue."
    source_ids:
      - fao-silk-1999
  - rule_id: val_balance
    applies_to: "V and A ledgers"
    rule: "Check production, FG and combined physical gates separately; internal transfers cancel only at the combined gate. Check every inherited exchange vector and the separate single A/Q quotient. Q0 has retained loads and no unit result. Never use gross H or add closing FG twice."
    source_ids:
      - ilcd-2010
  - rule_id: val_packaging
    applies_to: "each actual article"
    rule: "Verify complete P/N/I/ER/S/EO/W balance with all empty, attached and reusable stocks. Gross shipment packaging includes historical goods. No internal-reuse repurchase, silk-Q inclusion, duplicate external return or automatic credit."
    source_ids:
      - ilcd-2010
  - rule_id: val_evidence
    applies_to: "release and review"
    rule: "Future site measurement and ordinary auxiliary/provider gaps are explicit data requirements, not invented values. Unresolved reference identity, physical terminal, allocation basis or actual core process evidence blocks a usable result. Structural check success establishes no scientific, translation, legal, mapping or publication approval."
    source_ids:
      - ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Input to declared spun-silk preparation after the wet brushing-fibre gate"
  allowed_use: "Same single wet unprocessed brushing-fibre supply with full route and receiver compatibility"
  excluded_use: "Waste-treatment service; spent textiles; silk yarn; degummed floss; garnetted fibre; raw silk substitution; unqualified category averages"
  required_metadata: "All section 3 qualifiers; production gate; Q/Qc; V/A ledgers; upstream scope and allocation; complete native restrictions"
  required_quality_disclosure: "Source age and synthesis; sampling/measurement uncertainty; ordinary UUID/provider gaps; true core holds; failed and Q0 work; stock and service timing"
  update_trigger: "Changed formation stage, wet/dry state, cocoon source state, treatment, species, energy architecture, receiver/legal status, allocation evidence or native identity"
data_sources:
  - id: "un-cpc3-39211"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes (30 June 2025), pp.200–201. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Title-only silk-waste coordinate and adjacent wool/cotton/garnetted categories; does not itself specify manufacturing route"
  - id: "fao-silk-1999"
    type: "handbook"
    reference: "Yong-woo Lee, Silk reeling and testing manual, FAO Agricultural Services Bulletin 136 (1999), chapters5–6 and8 including Figure17. https://www.fao.org/4/x2099e/x2099e00.htm ; https://www.fao.org/4/x2099e/x2099e06.htm ; https://www.fao.org/4/x2099e/x2099e07.htm ; https://www.fao.org/4/x2099e/x2099e09.htm"
    used_for: "Cooking and reeling architecture; brushing-residue origin and downstream spinning use; distinction from pupae, processed floss and spun noils. No numerical manufacturing default or LCA allocation factor. Steam-supply integration and collection/stock protocols are transparent technical synthesis."
  - id: "ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook — General guide for Life Cycle Assessment — Detailed guidance, first edition March2010, sections7.9.2–7.9.3, PDF pp.275–292. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision and virtual subdivision; determining physical causality by exchange; residual same-state common-gate market value. Site ledgers implement these principles; the method source does not supply silk plant quantities or legal acceptance."
