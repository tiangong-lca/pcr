system_boundary:
  rules:
    - rule_id: sb_complete_origin
      applies_to: "production chain"
      rule: "Include received cocoon preparation, storage, pan cooking, end finding and joint reeling through segregated brushing-fibre first release. Inherit upstream completed work once; do not reduce the system to purchased finished waste plus packaging."
      source_ids:
        - fao-silk-1999
    - rule_id: sb_actual_routes
      applies_to: "utilities and deviations"
      rule: "The bounded route uses externally supplied industrial-boiler steam and motor electricity. Do not duplicate supplier boiler fuel, feed water or emissions as foreground exchanges. Actual on-site generation, electric resistance heating, alkali, bleach or forced fibre drying requires a separately declared route retaining every real atomic input/output and emission; nothing is zeroed or hidden. Preserve actual steam water/enthalpy delivery terms and every real external condensate Product return."
      source_ids:
        - fao-silk-1999
    - rule_id: sb_whole_period
      applies_to: "collection scope"
      rule: "Retain failed lots, Q=0 periods, start/stop, idle, cleaning, spills, rejects and rework. Add each real unlisted atomic exchange separately; evidence of absence is required for not_applicable. Actual extra treatment is a deviation requiring review, never an erased burden."
      source_ids:
        - fao-silk-1999
        - ilcd-2010
    - rule_id: sb_stock_services
      applies_to: "after first release"
      rule: "Maintain storage, packaging, handling and shipment by original cohort Qc. Record gross physical shipment H separately. In a combined account cancel internal production-to-stock transfers; closing newly released FG is already in Q and cannot be added as another output. Imported opening FG retains its historical vector and receives only actual incremental services/rework."
      source_ids:
        - ilcd-2010
    - rule_id: sb_status_gate
      applies_to: "supply function"
      rule: "Document actual legal classification, transfer controls, receiver consent, specifications and acceptance. Sale price does not alone settle legal status. If the real function is waste treatment, do not present its treated mass as this Product supply result."
      source_ids:
        - ilcd-2010
