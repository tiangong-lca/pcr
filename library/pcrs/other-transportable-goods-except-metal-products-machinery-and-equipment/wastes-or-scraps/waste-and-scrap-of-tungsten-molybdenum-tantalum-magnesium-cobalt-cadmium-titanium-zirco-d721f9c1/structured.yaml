  normalization: "utf8-lf-v1"
  source_sha256: "sha256:d2496757fdc15cea02038c6fc2243533b872723f691caa8289f4dbafdfccd260"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_7936"
      family: "system_boundary"
      span:
        start:
          offset: 7936
