          column: 1
        end:
          offset: 15709
          line: 85
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Source-certified Grade5 mill-annealed solid circular bars with complete upstream exchange histories; actual purchased and nonpurchase first receipts |\n| starting_condition_role | Burdened whole-stock entry to actual chip formation and receiver-gate chain |\n| product_classification_scope | Only this Grade5 wet-bar-turning chip subset of 39367 |\n| recursive_input_rule | Do not replace formation with chip procurement; verified offsite formation module must match state/gate and complete history and count once |\n| upstream_dataset_requirement | One compatible provider per actual external supply/service with original inherited vector and included scope |\n| disclosure | source bar heat and Ti-6Al-4V Grade 5 certificate; solid circular bar and mill-annealed condition; actual wet-turning equipment and coolant supply method; whole supplied coolant formulation and dilution boundary; source-to-chip genealogy and mother workpiece; actual preparation and rejected fractions; metallic chip mass and independent oil/free-water/foreign-metal analyses; chip morphology and tool-fragment status; oxygen/nitrogen/carbon and receiver-specific impurity criteria; named receiver and actual acceptance specification; first-release cohort and time; original stock and WIP/FG burden vectors; attributable allocation by exchange; actual gross shipment and return history; every packaging component and external first receipt type; ownership and supplier-included services; site geography and reporting period; linked provider and treatment scope |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| sb_formation | whole chain | Keep upstream supplied-bar production state and every inherited input burden; include real wet turning and mother-product disposition, chip separation, all actual preparation, first release and the original-cohort services through receiver receipt. Out-of-site generation is a verified formation module with the same gate and complete per-exchange history, never a zero-burden scrap purchase. | `taylor-ti-turning-2018`; `weston-ti-swarf-2020`; `ti-scrap-reclamation`; `ilcd-detailed-2010` |\n| sb_wip | manufacturing gate | Close whole-alloy and liquid physical ledgers using opening stock/WIP + current actual external receipts + genuine externally returned material = closing stock/WIP + first releases (metallic Q_c and independently measured retained liquid/contamination) + mother workpieces + actual other external exits + losses, at one consistent gate. Internal raw-store and WIP transfers cancel. Preserve failed, zero-output, start/stop, idle, cleanup and rework burdens and exchange-specific opening/closing WIP inheritance; no residual is silently assigned to chips. | `taylor-ti-turning-2018`; `ilcd-detailed-2010` |\n| sb_release_services | finished goods and services | Q_c counts one first metallic-chip release per original cohort c, including that cohort’s closing accepted FG. Later storage/repacking/handling/loading/shipping/reinspection/true returns do not create Q again. Close FG: opening FG + Q_c + actual returned released chips = closing FG + gross external chip shipments + real waste and other exits. In the combined gate cancel Q_c as an internal transfer; do not also add closing FG to manufacturing output. Service activity H_c is a measured service driver, never the production denominator; attribute each incremental service to its actual original cohort and original Q_c, including historical opening FG. | `ilcd-detailed-2010`; `ti-scrap-reclamation` |\n| sb_full_receipts | every packaging container and attached component | For each actual material/form/type component k, P_k means first purchased physical receipts only; N_ext_k means all external first nonpurchase receipts, including supplier accompanying goods and first entrusted/borrowed/rented receipts. ER_k means only returns of that component with an identified prior outward shipment. These are mutually exclusive event classes. Opening_k + P_k + N_ext_k + ER_k = Closing_k + grossS_k + EO_k + W_k at the same component and physical gate. Opening/closing include empty store, attached WIP, attached FG and reusable stock; internal issues/reuse cancel. Opening stock cannot replace current receipts. grossS includes every real outward dispatch, independent of net product Q; EO excludes the same dispatch and W is real component discard. | `ilcd-detailed-2010` |\n| sb_receipt_interfaces | all contract manufacturing and service receipts | Every actual event requires a concrete atomic row/interface naming its material, physical form, type and direction plus measured quantity. The two component examples expose P, N_ext, ER, grossS, EO and W interfaces. For any additional pallet, strap, label, lid, seal, container or attached component actually used, add its own equally specific interfaces before data-package completeness can be established; adding only a balance symbol, copying a purchase UUID or copying an entire shipment is insufficient. Missing actual interfaces make that data package incomplete, including contract manufacturing and services. Never invent purchase, return, load or zero to close it. | `ilcd-detailed-2010` |\n| sb_ownership | ownership and burden inheritance | Track physical event class separately from ownership, original cohort, per-exchange inherited vector, provider-included scope and actual incremental rental/cleaning/return services. Charge original manufacturing burden once under the declared attributional service/ownership model and add only uncovered real incremental services. Nonpurchase does not mean zero; returning/reusing does not mean new production, a new Q or a credit. If P is instead defined as all external first receipts in another dataset, rename it explicitly and still partition genuine purchased production/inherited burdens; never retain the word purchase while excluding N_ext. This PCR uses purchase-only P plus N_ext throughout. | `ilcd-detailed-2010` |\n| sb_atomic_routes | conditional operations and external exchanges | Include every actual utility, fuel, water state, gas, chemical, filter medium, waste and species/destination as a separate concrete exchange. The cards are not authority to hide a real additional item under zero or other. Proprietary cleaning evidence establishes no universal bath; substantiate the actual procedure, supply formulation, heat, wash/rinse water and removed phase before use. No boiler/steam, inert gas or dry cutting is assumed. If real external steam/condensate or heat-exchange water exists, add separate Product receipt/return interfaces with thermal state, enthalpy and supplier water/energy scope. | `taylor-ti-turning-2018`; `weston-ti-swarf-2020`; `ilcd-detailed-2010` |\n| sb_no_credit | linked providers and downstream recovery | Link one state/grade/route/geography-compatible provider to each actual external input or service; preserve included transport, water and energy scope. Whole purchased alloys/formulations are procured once; analysed elements, actives and carrier water are child accounts. Exported whole mixtures use one provider and non-additive source partitions. Keep downstream remelting, FAST or other recovery outside the chip terminal and link actual treatment where required; do not claim avoided primary metal, automatic negative exchanges or zero historical burden. Establish actual uncovered equipment/facility capital-service contributions through cp_history after checking supplier/provider inclusion, including existing self-owned assets actually used; an evidenced goal/scope/cut-off exclusion must be recorded rather than assumed zero. | `weston-ti-swarf-2020`; `ilcd-detailed-2010` |\n\n"
