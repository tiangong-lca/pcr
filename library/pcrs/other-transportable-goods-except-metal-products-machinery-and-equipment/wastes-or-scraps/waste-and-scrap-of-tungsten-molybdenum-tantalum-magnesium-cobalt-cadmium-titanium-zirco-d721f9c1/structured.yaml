      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| al_scope | allocation-required attributional studies | Declare the attributional modelling situation and the actual co-functions before allocation. This rule is restricted to cases that require allocation, consistent with ILCD §7.9.2–7.9.3; it is not a universal substitution or waste cut-off policy. Legal waste, title, sales value or buyer interest alone does not remove source-bar history. | `ilcd-detailed-2010` |\n| al_subdivide | mother workpiece chips and dedicated preparation | First avoid allocation by actual dedicated metering/subdivision or justified virtual subdivision. Directly assign chip-only preparation and actual cohort service exchanges to their function; retain mother-product-only work and shared machining as distinct blocks. Document what can and cannot be separated. | `ilcd-detailed-2010` |\n| al_causality | each shared exchange | For every remaining exchange identify the determining physical causal relationship with the specific co-functions. Embodied source alloy, removed material, machine load, coolant loss and service duration need different evidence; a mass fraction or a machine-hour ratio is not automatically causal. Retain measured workpiece/chip/irrecoverable partitions and loss burdens; ILCD’s physical embodiment discussion does not authorize ignoring losses or using one mass rule for all exchanges. | `ilcd-detailed-2010`; `taylor-ti-turning-2018` |\n| al_residual | genuinely inseparable residual block | Only for the residual unresolved common-process exchanges after those steps use contemporaneous market values of the actual co-functions at one common gate in their actual condition and amount. Reconcile time, currency, grade, wet/metal basis, delivery and included services; remove downstream conditioning/transport differences with evidence. No finished-part selling price may be compared directly with untreated chip price at a different gate. Record numerator, denominator, uncertainty, sensitivity and treatment of non-valued losses; do not prescribe shares or alternate physical/economic methods at will. | `ilcd-detailed-2010` |\n| al_vectors | all cohort histories | For each exchange j keep physical gross V_j,c separately from attributable load A_j,c. Derive A from original stock/formation and WIP/FG inherited vectors plus current actual assigned loads, withholding closing unfinished histories without deleting them. Keep all failure/rework/idle/cleanup and Q=0 activity. Returned or reworked released material keeps its original vector and only real increments; no new purchase, production denominator or automatic credit. Never derive the physical balance by dividing by an allocation share. | `ilcd-detailed-2010` |\n\n"
