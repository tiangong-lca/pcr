  classification_refs: "CPC 3.0:39367; narrower candidate subset; acceptance separate"
  covered_products: "Formation and titanium-reuse supply of Ti-6Al-4V Grade 5 wet bar-turning chips"
  excluded_products: "Exclude all other metals in 39367, mixed grades/origins, Grade 2 and Ti-10V-2Fe-3Al, titanium-bearing steel, tungsten-carbide tooling as reference scrap, TiO2, sponge/primary unwrought metal, powder, plate/tube machining without its own reviewed stock route, post-consumer material, electronics, sludge/ash, smelting/refining, FAST consolidation, atomisation and finished recovered metal. A receiver’s feed approval is specific to its actual recovery route; no general remelt or aerospace-material qualification is inferred."
  representative_product: "One receiver-specified segregated Ti-6Al-4V Grade5 metallic chip lot"
  production_route: "Burdened annealed solid bar receipt → actual wet finish turning/mother workpiece → separate chip capture → only actual necessary preparation → first receiver-grade release → original-cohort services and receipt"
  market_state: "Unmelted whole-alloy metallic chips; actual liquid/foreign material excluded from reference mass and separately declared; no guaranteed legal end-of-waste"
functional_unit:
  what: "Supply one qualified Grade5 chip stream for the declared titanium receiver"
  how_much: "1 kg net whole-alloy metallic chips at unique first quality release"
  how_well: "Receiver-specific chip form and measured grade/interstitial/contamination criteria; no universal limit"
  how_long_or_cycle: "One unique original production cohort; later service does not repeat production"
  reference_flow_link: "reference_chips"
system_boundary:
  rules:
    - rule_id: sb_formation
      applies_to: "whole chain"
      rule: "Keep upstream supplied-bar production state and every inherited input burden; include real wet turning and mother-product disposition, chip separation, all actual preparation, first release and the original-cohort services through receiver receipt. Out-of-site generation is a verified formation module with the same gate and complete per-exchange history, never a zero-burden scrap purchase."
      source_ids:
        - taylor-ti-turning-2018
        - weston-ti-swarf-2020
        - ti-scrap-reclamation
        - ilcd-detailed-2010
    - rule_id: sb_wip
      applies_to: "manufacturing gate"
      rule: "Close whole-alloy and liquid physical ledgers using opening stock/WIP + current actual external receipts + genuine externally returned material = closing stock/WIP + first releases (metallic Q_c and independently measured retained liquid/contamination) + mother workpieces + actual other external exits + losses, at one consistent gate. Internal raw-store and WIP transfers cancel. Preserve failed, zero-output, start/stop, idle, cleanup and rework burdens and exchange-specific opening/closing WIP inheritance; no residual is silently assigned to chips."
      source_ids:
        - taylor-ti-turning-2018
        - ilcd-detailed-2010
    - rule_id: sb_release_services
      applies_to: "finished goods and services"
      rule: "Q_c counts one first metallic-chip release per original cohort c, including that cohort’s closing accepted FG. Later storage/repacking/handling/loading/shipping/reinspection/true returns do not create Q again. Close FG: opening FG + Q_c + actual returned released chips = closing FG + gross external chip shipments + real waste and other exits. In the combined gate cancel Q_c as an internal transfer; do not also add closing FG to manufacturing output. Service activity H_c is a measured service driver, never the production denominator; attribute each incremental service to its actual original cohort and original Q_c, including historical opening FG."
      source_ids:
        - ilcd-detailed-2010
        - ti-scrap-reclamation
    - rule_id: sb_full_receipts
      applies_to: "every packaging container and attached component"
      rule: "For each actual material/form/type component k, P_k means first purchased physical receipts only; N_ext_k means all external first nonpurchase receipts, including supplier accompanying goods and first entrusted/borrowed/rented receipts. ER_k means only returns of that component with an identified prior outward shipment. These are mutually exclusive event classes. Opening_k + P_k + N_ext_k + ER_k = Closing_k + grossS_k + EO_k + W_k at the same component and physical gate. Opening/closing include empty store, attached WIP, attached FG and reusable stock; internal issues/reuse cancel. Opening stock cannot replace current receipts. grossS includes every real outward dispatch, independent of net product Q; EO excludes the same dispatch and W is real component discard."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: sb_receipt_interfaces
      applies_to: "all contract manufacturing and service receipts"
      rule: "Every actual event requires a concrete atomic row/interface naming its material, physical form, type and direction plus measured quantity. The two component examples expose P, N_ext, ER, grossS, EO and W interfaces. For any additional pallet, strap, label, lid, seal, container or attached component actually used, add its own equally specific interfaces before data-package completeness can be established; adding only a balance symbol, copying a purchase UUID or copying an entire shipment is insufficient. Missing actual interfaces make that data package incomplete, including contract manufacturing and services. Never invent purchase, return, load or zero to close it."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: sb_ownership
      applies_to: "ownership and burden inheritance"
      rule: "Track physical event class separately from ownership, original cohort, per-exchange inherited vector, provider-included scope and actual incremental rental/cleaning/return services. Charge original manufacturing burden once under the declared attributional service/ownership model and add only uncovered real incremental services. Nonpurchase does not mean zero; returning/reusing does not mean new production, a new Q or a credit. If P is instead defined as all external first receipts in another dataset, rename it explicitly and still partition genuine purchased production/inherited burdens; never retain the word purchase while excluding N_ext. This PCR uses purchase-only P plus N_ext throughout."
      source_ids:
        - ilcd-detailed-2010
    - rule_id: sb_atomic_routes
      applies_to: "conditional operations and external exchanges"
      rule: "Include every actual utility, fuel, water state, gas, chemical, filter medium, waste and species/destination as a separate concrete exchange. The cards are not authority to hide a real additional item under zero or other. Proprietary cleaning evidence establishes no universal bath; substantiate the actual procedure, supply formulation, heat, wash/rinse water and removed phase before use. No boiler/steam, inert gas or dry cutting is assumed. If real external steam/condensate or heat-exchange water exists, add separate Product receipt/return interfaces with thermal state, enthalpy and supplier water/energy scope."
      source_ids:
        - taylor-ti-turning-2018
        - weston-ti-swarf-2020
        - ilcd-detailed-2010
    - rule_id: sb_no_credit
      applies_to: "linked providers and downstream recovery"
      rule: "Link one state/grade/route/geography-compatible provider to each actual external input or service; preserve included transport, water and energy scope. Whole purchased alloys/formulations are procured once; analysed elements, actives and carrier water are child accounts. Exported whole mixtures use one provider and non-additive source partitions. Keep downstream remelting, FAST or other recovery outside the chip terminal and link actual treatment where required; do not claim avoided primary metal, automatic negative exchanges or zero historical burden. Establish actual uncovered equipment/facility capital-service contributions through cp_history after checking supplier/provider inclusion, including existing self-owned assets actually used; an evidenced goal/scope/cut-off exclusion must be recorded rather than assumed zero."
      source_ids:
        - weston-ti-swarf-2020
        - ilcd-detailed-2010
