          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| val_identity | product stock and native identity | Verify whole Grade5 alloy, certified annealed solid bar origin, real wet chip formation, mother workpiece, state and receiving function. Reject plate/tube/Grade2/steel/carbide/TiO2/sponge substitutions. The reference Product is bound only to the fully qualified single Grade5 chip stream; the certified annealed solid-bar UUID remains an ordinary upstream identity/provider gap, not missing formation methodology or a global reference hold. Grade2 profile or plate cannot fill it. A finite quantity check cannot establish actual material/provider compatibility or approve methodology. Every bound flow must retain all formal names, type, route, form, CAS, geography, comments, exact property/unit compatibility and official Chinese display restrictions in consumable context. | `taylor-ti-turning-2018`; `weston-ti-swarf-2020`; `ti-scrap-reclamation` |\n| val_gate | Q WIP FG and services | Verify unique first-release Q_c, calibrated metallic-chip mass and independent retained-liquid/foreign-material measurements. Closing first-released FG is already in Q_c. Close manufacturing, FG and combined physical gates with internal release/issue cancellation; reconcile opening/closing WIP/FG per-exchange histories and original Q_c for all services. H_c, grossV shipments, return and reinspection are not production denominators. Q_c=0 retains raw burdens and yields no unit result. | `taylor-ti-turning-2018`; `ilcd-detailed-2010` |\n| val_packaging | each actual component at one physical gate | Require Opening + P + N_ext + ER = Closing + grossS + EO + W separately for each material/form/type component, including empty/WIP/FG/reusable stock. P is purchase only, N_ext all nonpurchase external first receipts and ER only proven prior outward returns; classes and events are mutually exclusive. Check the concrete atomic receipt/outgoing interfaces and measured quantity for every actual component/event, including supplier-attached, entrusted, borrowed and rented first receipts. Missing interfaces mean the specific data package is incomplete; symbols, purchase UUIDs, opening stock, fabricated returns and full-shipment copies cannot repair it. Internal reuse cancels and component mass never enters chip Q. | `ilcd-detailed-2010` |\n| val_inheritance | owned contract and service operations | Independently check ownership, original cohort, every inherited exchange vector, supplier-included scope and actual incremental rental/return/cleaning service. Apply the same full-receipt equation and interfaces in contract manufacture, service ledgers and all calculations; no old purchase+ER closure remains. Original production burden is charged once, with real uncovered increments only; no inferred free material, new Q or credit. | `ilcd-detailed-2010` |\n| val_chemistry | mass element water and species ledgers | Close whole-alloy, whole liquid and packaging physical mass independently of relevant Ti/Al/V and actual tool/oil elements. Measure composition and states; nominal alloy name is no assay. Retained water/oil, reaction water, free water, vapour and condensed water are distinct where actually present. Do not fit two unknowns from one residual or turn COD/VOC/total aerosol into a specific molecule. Captured material is not emitted material. Each final species/media destination is atomic; exported whole mixtures and constituent/source partitions are non-additive. | `taylor-ti-turning-2018`; `weston-ti-swarf-2020`; `ilcd-detailed-2010` |\n| val_normalization | raw records and attributed results | Protocols preserve unnormalised raw units and cohorts. Convert real rate/integrated-volume/density/unit bases and establish exchange-specific attribution before calc_normalize is executed once. Cards and aggregation refer to the same result; do not divide a per-kg numerator again. Keep gross V and attributable A lanes distinct, verify Q=0 retention, all failed/start/stop/idle/cleanup and unfinished histories, with uncertainty and no invented factory factors. | `ilcd-detailed-2010` |\n| val_receiver | release and actual supply | Require actual receiver-agreed chip morphology, contamination/interstitial limits, analytical method and acceptance record for the declared downstream titanium route. The commercial cleaning recipe is not public evidence, and a study passing one oxygen specification does not imply another passes. Nonconforming chips and rejected shipments stay outside new Q and retain their histories; no universal remelt, aerospace or legal end-of-waste approval is implied. | `weston-ti-swarf-2020`; `ti-scrap-reclamation` |\n| val_completeness | specific foreground package | Mark any actual missing flow, receipt interface, inheritance, measurement, provider scope or receiver evidence as incomplete for that data package. Distinguish methodology evidence and the qualified native reference binding from ordinary unresolved upstream stock/provider, auxiliary identity and future site-quantity requirements; the unbound bar does not imply a missing formation method or global reference hold. A schema/fingerprint/finite check is engineering evidence only, not science, translation, mapping or publication acceptance. Verify cp_history evidence for each actual relevant asset/service scope: provider inclusion, separately identified compatible uncovered inventory and actual service/use basis with once-only cohort attribution, or a justified evidenced goal/scope/cut-off exclusion. Missing actual capital-service evidence makes that data package incomplete; unresolved site quantities require collection, not invented defaults. | `ilcd-detailed-2010` |\n\n"
