allocation_rules:
  - rule_id: al_scope
    applies_to: "allocation-required attributional studies"
    rule: "Declare the attributional modelling situation and the actual co-functions before allocation. This rule is restricted to cases that require allocation, consistent with ILCD §7.9.2–7.9.3; it is not a universal substitution or waste cut-off policy. Legal waste, title, sales value or buyer interest alone does not remove source-bar history."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: al_subdivide
    applies_to: "mother workpiece chips and dedicated preparation"
    rule: "First avoid allocation by actual dedicated metering/subdivision or justified virtual subdivision. Directly assign chip-only preparation and actual cohort service exchanges to their function; retain mother-product-only work and shared machining as distinct blocks. Document what can and cannot be separated."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: al_causality
    applies_to: "each shared exchange"
    rule: "For every remaining exchange identify the determining physical causal relationship with the specific co-functions. Embodied source alloy, removed material, machine load, coolant loss and service duration need different evidence; a mass fraction or a machine-hour ratio is not automatically causal. Retain measured workpiece/chip/irrecoverable partitions and loss burdens; ILCD’s physical embodiment discussion does not authorize ignoring losses or using one mass rule for all exchanges."
    source_ids:
      - ilcd-detailed-2010
      - taylor-ti-turning-2018
  - rule_id: al_residual
    applies_to: "genuinely inseparable residual block"
    rule: "Only for the residual unresolved common-process exchanges after those steps use contemporaneous market values of the actual co-functions at one common gate in their actual condition and amount. Reconcile time, currency, grade, wet/metal basis, delivery and included services; remove downstream conditioning/transport differences with evidence. No finished-part selling price may be compared directly with untreated chip price at a different gate. Record numerator, denominator, uncertainty, sensitivity and treatment of non-valued losses; do not prescribe shares or alternate physical/economic methods at will."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: al_vectors
    applies_to: "all cohort histories"
    rule: "For each exchange j keep physical gross V_j,c separately from attributable load A_j,c. Derive A from original stock/formation and WIP/FG inherited vectors plus current actual assigned loads, withholding closing unfinished histories without deleting them. Keep all failure/rework/idle/cleanup and Q=0 activity. Returned or reworked released material keeps its original vector and only real increments; no new purchase, production denominator or automatic credit. Never derive the physical balance by dividing by an allocation share."
    source_ids:
      - ilcd-detailed-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "ti_chip_chain"
      flow_role: "reference and first release"
      record_type: "weighing and assay"
      raw_fields: "source heat; cohort c; first-release event; gross; tare; whole-chip metal mass; retained emulsion; free water; foreign metal; sampling; O N C; receiver specification; Q_c; original Q for returned lots"
      collection_method: "Calibrated weighings with independent liquid/foreign-material analysis and actual receiver tests; verify each first-release event once. Sum raw values by event and cohort without division; retain the original full aggregation instruction: Preserve unnormalised lot records; final basis per 1 kg reference flow is produced only by calc_normalize."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "all production and zero-output periods"
      site_scope: "source machining and actual preparation/release gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; mass closure; chemistry report; receiver agreement"
    - protocol_id: cp_exchange
      process_id: "ti_chip_chain"
      flow_role: "atomic physical exchanges"
      record_type: "receipt use output stock records"
      raw_fields: "row_id; event_id; material and physical state; heat/SKU; direction; provider; actual first purchase; nonpurchase receipt; prior outward return link; raw unit; gross V; raw attributable A inputs; original cohort; stock/WIP opening/closing; inherited exchange vector"
      collection_method: "Measure every real atomic boundary receipt/use/output and reconcile matched internal issues; keep whole supplies and non-additive assay partitions. Sum raw values by event and cohort without division; retain the original full aggregation instruction: Preserve unnormalised cohort totals; final basis per 1 kg reference flow is produced only by calc_normalize."
      unit: "kg; m3"
      frequency: "each event and batch"
      temporal_coverage: "complete period including failed idle cleanup"
      site_scope: "all source formation preparation and external gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "receipt tickets; meter certificates; stock lineage; supplier formulation and scope"
    - protocol_id: cp_energy
      process_id: "ti_chip_chain"
      flow_role: "electricity and true rates"
      record_type: "meter logs"
      raw_fields: "meter_id; voltage; provider; interval kWh; true rate and duration if any; cumulative volume if any; equipment; idle start stop cleanup; original cohort; service H_c; shared causal allocation"
      collection_method: "Read calibrated submeters, reconcile the common meter without overlapping blocks, distinguish integrated readings from rates and preserve original unit conversions. Sum raw values by event and cohort without division; retain the original full aggregation instruction: Preserve unnormalised metered totals; final basis per 1 kg reference flow is produced only by calc_normalize."
      unit: "kWh; MJ"
      frequency: "each interval and batch"
      temporal_coverage: "full period including Q_c=0"
      site_scope: "lathe pumps extraction preparation and actual services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; equipment logs; scope and allocation records"
    - protocol_id: cp_packaging
      process_id: "ti_chip_chain"
      flow_role: "one component all receipt and exit types"
      record_type: "component event ledger"
      raw_fields: "component material/form/type; event_id; empty mass; attached state; opening empty/WIP/FG/reusable; purchase P; first nonpurchase N_ext; genuine return ER and prior outward event; closing same states; grossS; EO; W; owner; original cohort; inherited vector; supplier included scope; incremental rental cleaning return services"
      collection_method: "Weigh or use traceably measured empty-component masses at each actual event; mutually exclude P/N_ext/ER and outgoing classes; match internal store/WIP/FG issues and preserve each concrete interface. Sum raw values by event and cohort without division; retain the original full aggregation instruction: Preserve unnormalised component balances; final basis per 1 kg reference flow is produced only by calc_normalize."
      unit: "kg"
      frequency: "each component event and inventory count"
      temporal_coverage: "complete period and original cohort history"
      site_scope: "same physical component gate including contract and service sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "receipt/dispatch links; tare measurements; component specifications; ownership and service evidence"
    - protocol_id: cp_emission
      process_id: "ti_chip_chain"
      flow_role: "each species and receiving medium"
      record_type: "sampling and balance"
      raw_fields: "species; CAS where identified; whole mixture and child assay; phase; particle size; receiving medium; sampled concentration; actual gas/liquid volume; rate duration only if rate; capture; final release; uncertainty"
      collection_method: "Measure final release after actual capture with species/state-specific validated methods and independently measured volumes/densities; keep captured waste and ambient entrainment distinct. Sum raw values by event and cohort without division; retain the original full aggregation instruction: Preserve unnormalised species totals; final basis per 1 kg reference flow is produced only by calc_normalize."
      unit: "kg"
      frequency: "each relevant run and sampling interval"
      temporal_coverage: "representative complete operation including cleanup"
      site_scope: "actual final outdoor release points"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling validation; species reports; phase and volume records; detection limits"
    - protocol_id: cp_history
      process_id: "ti_chip_chain"
      flow_role: "allocation WIP FG and services"
      record_type: "cohort exchange ledger"
      raw_fields: "original cohort; original Q_c; each raw exchange V_jc; embodied upstream vector; opening closing WIP/FG vectors; allocation-required situation; dedicated/virtual subdivision; causal basis by exchange; residual common-gate values; actual H_c; failed Q0 idle cleanup; each actual asset and capital-service scope; supplier/provider-included capital scope; compatible uncovered equipment/facility inventory or service dataset; actual total-service/lifetime/use basis as applicable; actual cohort-specific causal activity; evidenced goal/scope/cut-off exclusion where justified"
      collection_method: "Reconcile per-exchange histories and physical ledgers independently, document every attribution decision and actual incremental service without revising original event quantities. Sum raw values by event and cohort without division; retain the original full aggregation instruction: Preserve unnormalised attributed A_jc and physical V_jc separately; final basis per 1 kg reference flow is produced only by calc_normalize. Identify each actual relevant asset and capital-service scope used in formation, preparation or original-cohort services, including existing self-owned equipment and occupied facilities. Verify supplier/provider-included scope first; for each uncovered actual contribution obtain a compatible equipment/facility inventory or service dataset and its actual total-service/lifetime/use basis as applicable, together with actual cohort-specific causal activity. Identify each concrete uncovered service separately and justify its attribution under al_subdivide through al_residual; record an evidenced exclusion under the declared goal, scope and cut-off where justified, never assumed zero. Reconcile provider coverage and inherited vectors so each contribution is counted once across current and historical cohorts, including performed services, failed/Q0/idle/start-stop/cleanup/rework activity and remaining stock histories. Operating kWh or current asset purchase counts alone do not establish this contribution; do not charge an entire asset receipt to one cohort. Keep physical asset stocks/mass independent of embodied/service burdens, outside chip Q_c and alloy mass closure; do not invent equipment mass, lifetime or default use."
      unit: "kg; MJ; m3; service units"
      frequency: "each cohort and reporting closure"
      temporal_coverage: "current and inherited historical cohorts"
      site_scope: "source manufacturer preparation and service boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original provider vectors; WIP/FG reconciliation; causal evidence; market-state adjustment; sensitivity; asset/service scope and provider-coverage reconciliation; compatible inventory/dataset scope evidence; actual total-service/lifetime/use and cohort activity records; justified goal/scope/cut-off exclusion evidence"
  calculation_rules:
    - id: calc_units
      applies_to: "all inventory rows"
      rule: "Convert only original raw units: kWh to MJ uses 3.6; an already integrated volume stays a volume; integrate only an actual time-varying rate. Any volume-to-mass conversion uses independently measured density of that exact substance/formulation at stated temperature, pressure and composition. Count-to-mass uses measured empty component or insert mass for the same configuration, never guessed kg/item."
      inputs:
        - "raw readings"
        - "unit records"
        - "state-specific density"
        - "measured item mass"
      output: "unit-consistent unnormalised raw records"
      source_ids:
        - ilcd-detailed-2010
    - id: calc_attribute
      applies_to: "all inventory rows"
      rule: "Establish each A_jc from actual assigned formation/current loads and original per-exchange inherited histories under al_subdivide through al_residual; reconcile withheld closing WIP vectors and all Q=0/failed/rework/service activity. Keep gross physical V_jc unchanged in its independent lane. Establish each actual uncovered capital-service contribution through cp_history before calc_normalize, with provider inclusion and inherited coverage reconciled once; operating kWh and current asset receipts alone cannot supply that numerator."
      inputs:
        - "unit-consistent raw records"
        - cp_history
        - "original stock vectors"
        - "WIP/FG vectors"
      output: "unnormalised A_jc and separate V_jc"
      source_ids:
        - ilcd-detailed-2010
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "For Q_c > 0 apply q_jc = A_jc / Q_c exactly once after calc_units and calc_attribute. This is the sole burden normalisation. Physical reference-scaled ledgers may use v_jc = V_jc / Q_c once in their separate physical lane; v and q are not added or substituted. Cards and collection aggregation consume these same results and never divide again. Q_c=0 produces no unit result and preserves raw A and V with their histories."
      inputs:
        - A_jc
        - V_jc
        - Q_c
        - cp_release
        - cp_history
      output: "q_jc and independent v_jc; or raw Q0 retention"
      source_ids:
        - ilcd-detailed-2010
    - id: calc_component
      applies_to: "all actual packaging component interfaces"
      rule: "For each exact component k execute Opening_k + P_k + N_ext_k + ER_k = Closing_k + grossS_k + EO_k + W_k; P is purchase-only and N_ext all external first nonpurchase receipts; ER requires its own prior outward event. Include empty/WIP/FG/reusable states and cancel internal issues. Use measured event quantities only and require concrete atomic interfaces for every actual first receipt and exit. Attribute inherited and real incremental service vectors independently; never put component mass in Q_c."
      inputs:
        - cp_packaging
        - "component specifications"
        - "measured event links"
        - "original vectors"
      output: "component physical closure and independent burden lineage"
      source_ids:
        - ilcd-detailed-2010
    - id: calc_fg_services
      applies_to: "first release and original-cohort services"
      rule: "Close opening FG + Q_c + true returned released chips = closing FG + gross chip shipments + real waste and other exits. Cancel Q_c in the combined manufacturing/FG gate; closing accepted FG is already in first releases. Assign actual incremental H_c-driven services to their original cohort vector and original Q_c before the same calc_normalize; original Q is never replaced by H or a current-period shipment count."
      inputs:
        - cp_release
        - cp_history
        - "original Q_c"
        - "current and historical FG"
        - "actual service records"
      output: "FG and combined closure; cohort-linked incremental A"
      source_ids:
        - ilcd-detailed-2010
  data_quality_requirements:
    - id: dq_origin
      applies_to: "stock and chip identity"
      requirement: "Require source-certified Grade5 annealed solid bar and actual chip genealogy; retain separate mother workpiece and receiver specification."
      evidence: "heat certificate; process and capture logs; analyses"
    - id: dq_completeness
      applies_to: "all events including packaging"
      requirement: "Inventory all actual atomic supplies, first nonpurchase receipts, true returns, utilities, emissions and wastes; no missing actual interface or inherited vector is a complete package."
      evidence: "physical ledgers; receipt/outgoing interfaces; supplier scope"
    - id: dq_measurement
      applies_to: "all measured quantities"
      requirement: "Keep calibrated raw readings, representative independent assays, original units/states, uncertainty and detection limits; no invented density, yield, concentration or energy intensity."
      evidence: "calibration; sampling; density records; uncertainty"
    - id: dq_temporal
      applies_to: "cohort burdens and services"
      requirement: "Cover failures, Q0, idle/start/stop/cleanup, opening/closing WIP/FG history and actual original-cohort service allocation across periods."
      evidence: "cohort history; meter logs; stock reconciliation"
    - id: dq_sources
      applies_to: "primary evidence and providers"
      requirement: "Disclose technical synthesis, proprietary-cleaning limits, receiver-specific interstitial counterexample, qualified native reference binding and ordinary unresolved upstream stock/auxiliary identities and providers."
      evidence: "primary originals; actual supplier/receiver evidence; identity audit"
validation_rules:
  - rule_id: val_identity
    applies_to: "product stock and native identity"
    rule: "Verify whole Grade5 alloy, certified annealed solid bar origin, real wet chip formation, mother workpiece, state and receiving function. Reject plate/tube/Grade2/steel/carbide/TiO2/sponge substitutions. The reference Product is bound only to the fully qualified single Grade5 chip stream; the certified annealed solid-bar UUID remains an ordinary upstream identity/provider gap, not missing formation methodology or a global reference hold. Grade2 profile or plate cannot fill it. A finite quantity check cannot establish actual material/provider compatibility or approve methodology. Every bound flow must retain all formal names, type, route, form, CAS, geography, comments, exact property/unit compatibility and official Chinese display restrictions in consumable context."
    source_ids:
      - taylor-ti-turning-2018
      - weston-ti-swarf-2020
      - ti-scrap-reclamation
  - rule_id: val_gate
    applies_to: "Q WIP FG and services"
    rule: "Verify unique first-release Q_c, calibrated metallic-chip mass and independent retained-liquid/foreign-material measurements. Closing first-released FG is already in Q_c. Close manufacturing, FG and combined physical gates with internal release/issue cancellation; reconcile opening/closing WIP/FG per-exchange histories and original Q_c for all services. H_c, grossV shipments, return and reinspection are not production denominators. Q_c=0 retains raw burdens and yields no unit result."
    source_ids:
      - taylor-ti-turning-2018
      - ilcd-detailed-2010
  - rule_id: val_packaging
    applies_to: "each actual component at one physical gate"
    rule: "Require Opening + P + N_ext + ER = Closing + grossS + EO + W separately for each material/form/type component, including empty/WIP/FG/reusable stock. P is purchase only, N_ext all nonpurchase external first receipts and ER only proven prior outward returns; classes and events are mutually exclusive. Check the concrete atomic receipt/outgoing interfaces and measured quantity for every actual component/event, including supplier-attached, entrusted, borrowed and rented first receipts. Missing interfaces mean the specific data package is incomplete; symbols, purchase UUIDs, opening stock, fabricated returns and full-shipment copies cannot repair it. Internal reuse cancels and component mass never enters chip Q."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: val_inheritance
    applies_to: "owned contract and service operations"
    rule: "Independently check ownership, original cohort, every inherited exchange vector, supplier-included scope and actual incremental rental/return/cleaning service. Apply the same full-receipt equation and interfaces in contract manufacture, service ledgers and all calculations; no old purchase+ER closure remains. Original production burden is charged once, with real uncovered increments only; no inferred free material, new Q or credit."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: val_chemistry
    applies_to: "mass element water and species ledgers"
    rule: "Close whole-alloy, whole liquid and packaging physical mass independently of relevant Ti/Al/V and actual tool/oil elements. Measure composition and states; nominal alloy name is no assay. Retained water/oil, reaction water, free water, vapour and condensed water are distinct where actually present. Do not fit two unknowns from one residual or turn COD/VOC/total aerosol into a specific molecule. Captured material is not emitted material. Each final species/media destination is atomic; exported whole mixtures and constituent/source partitions are non-additive."
    source_ids:
      - taylor-ti-turning-2018
      - weston-ti-swarf-2020
      - ilcd-detailed-2010
  - rule_id: val_normalization
    applies_to: "raw records and attributed results"
    rule: "Protocols preserve unnormalised raw units and cohorts. Convert real rate/integrated-volume/density/unit bases and establish exchange-specific attribution before calc_normalize is executed once. Cards and aggregation refer to the same result; do not divide a per-kg numerator again. Keep gross V and attributable A lanes distinct, verify Q=0 retention, all failed/start/stop/idle/cleanup and unfinished histories, with uncertainty and no invented factory factors."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: val_receiver
    applies_to: "release and actual supply"
    rule: "Require actual receiver-agreed chip morphology, contamination/interstitial limits, analytical method and acceptance record for the declared downstream titanium route. The commercial cleaning recipe is not public evidence, and a study passing one oxygen specification does not imply another passes. Nonconforming chips and rejected shipments stay outside new Q and retain their histories; no universal remelt, aerospace or legal end-of-waste approval is implied."
    source_ids:
      - weston-ti-swarf-2020
      - ti-scrap-reclamation
  - rule_id: val_completeness
    applies_to: "specific foreground package"
    rule: "Mark any actual missing flow, receipt interface, inheritance, measurement, provider scope or receiver evidence as incomplete for that data package. Distinguish methodology evidence and the qualified native reference binding from ordinary unresolved upstream stock/provider, auxiliary identity and future site-quantity requirements; the unbound bar does not imply a missing formation method or global reference hold. A schema/fingerprint/finite check is engineering evidence only, not science, translation, mapping or publication acceptance. Verify cp_history evidence for each actual relevant asset/service scope: provider inclusion, separately identified compatible uncovered inventory and actual service/use basis with once-only cohort attribution, or a justified evidenced goal/scope/cut-off exclusion. Missing actual capital-service evidence makes that data package incomplete; unresolved site quantities require collection, not invented defaults."
    source_ids:
      - ilcd-detailed-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Assessment of the declared titanium receiver route with original reference basis and burden chain"
  allowed_use: "Attributional inventory after applicable stock/formation/receiver-gate verification; link actual recovery separately"
  excluded_use: "Other metals/grades, mixed origins, finished-chip repacking, zero-burden/avoided-impact credits and automatic legal/aerospace approval"
  required_metadata: "source bar heat and Ti-6Al-4V Grade 5 certificate; solid circular bar and mill-annealed condition; actual wet-turning equipment and coolant supply method; whole supplied coolant formulation and dilution boundary; source-to-chip genealogy and mother workpiece; actual preparation and rejected fractions; metallic chip mass and independent oil/free-water/foreign-metal analyses; chip morphology and tool-fragment status; oxygen/nitrogen/carbon and receiver-specific impurity criteria; named receiver and actual acceptance specification; first-release cohort and time; original stock and WIP/FG burden vectors; attributable allocation by exchange; actual gross shipment and return history; every packaging component and external first receipt type; ownership and supplier-included services; site geography and reporting period; linked provider and treatment scope"
  required_quality_disclosure: "Qualified native reference binding and ordinary unbound upstream stock/auxiliary identities and providers, complete actual interfaces, inherited vectors, raw amounts and one normalization, representativeness/uncertainty, technical synthesis and receiver limitations"
  update_trigger: "Change of stock form/grade, machining/cleaning route, receiver gate, formulation, packaging component/receipt class, provider or method"
