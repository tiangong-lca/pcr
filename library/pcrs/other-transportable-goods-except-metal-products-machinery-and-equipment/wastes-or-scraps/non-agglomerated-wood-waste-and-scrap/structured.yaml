      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_context | all inventory rows | The following requirements concern a concrete dataset. Builder structural/measurement success verifies only declared relationships and never supplies missing plant evidence, scientific review, translation review or accepted classification mapping. |  |\n| v_reference | sawdust_release; spruce_logs | Require all reference qualifiers and one unique Product output of 1 kg linked to sawdust_release. Confirm actual clean green Nordic spruce kerf sawdust, not a chip/shaving/pellet/briquette/treated composite. Verify the broad locator’s restrictions and actual core supplier/acceptance evidence before complete-dataset use. | un-cpc3-2025; metsa-renko-sawmill; sodra-sawdust |\n| v_denominator | all inventory rows | Verify raw original units, prepare_numerator attribution and one normalize_cohort division by the original first-release Q_c. Closing released FG is already counted; gross shipments H_c and packaging are not new production. Q_c=0 retains burden without unit output. Collection/aggregation/cards must not divide again. |  |\n| v_gates | all inventory rows | Check the same unallocated production, service and combined wood/bark/water/auxiliary/element equations; cancel the internal Q transfer, preserve opening/closing WIP and FG vectors and each return pair. Resolve physical mass, true chemical species/reaction water and relevant elements independently; no dual-unknown residual fitting. | usda-wood-handbook-2021 |\n| v_fates | all inventory rows | Check mutually exclusive accepted/rework/waste/coproduct portions, each complete packaging ledger and actual external provider. Reconcile whole mixed exports with non-additive constituent ledgers. Captured dust is not emitted PM; cumulative particle cuts cannot overlap. Confirm air medium, actual molecular species/CAS and carbon origin; total VOC/COD is no named species. |  |\n| v_burden | all inventory rows | Verify origin inherited once, lumber-exclusive stages excluded unless causally justified, exchange-specific attribution hierarchy and same-gate residual values only when necessary. Check conservation of allocated burdens across all functions independently of full physical outputs. No neutrality or recovery/substitution credit. | ilcd-allocation-2010 |\n| v_pending | all inventory rows | Any real core identity/terminal-route mismatch, missing causal/market evidence required for attribution, unknown stock burden history, unresolved material/emission fate or unsupported unit conversion keeps the affected dataset incomplete. Preserve ordinary auxiliary UUID/provider/measurement gaps explicitly; neither a generic UUID nor a structural pass clears them. A real boiler/dryer/treated-wood or other unsupported route requires scope assessment and complete additional atomic inventory first. |  |\n\n"
