  classification_refs: "CPC 3.0 39283; narrower; no accepted mapping implied"
  covered_products: "Separately collected untreated green Nordic spruce kerf sawdust; one declared acceptance specification"
  excluded_products: "Pellets; briquettes; coarse chips; shavings; wood flour; mixed/treated/glued wood residues; finished lumber"
  representative_product: "Loose non-agglomerated green Nordic spruce sawdust at first net quality release"
