  reference_flow_link: "sawdust_release"
system_boundary:
  rules:
    - rule_id: b_origin
      applies_to: "spruce_logs; log_road_freight"
      rule: "Retain full source sawing, debarking when actual and clean segregation. Use exactly one inherited source burden per material portion; supplier included transport/debarking is not entered again. Lumber-only downstream drying/planing/painting does not burden the already separated green sawdust without evidence."
      source_ids:
        - metsa-renko-sawmill
        - corrim-northern-lumber-2025
    - rule_id: b_first_release
      applies_to: "all inventory rows"
      rule: "Production runs to the first accepted net sawdust gate Q_c. Maintain separate post-release service records for storage, temporary containers, handling, loading and dispatch and attribute them to the original cohort Q_c. The internal release transfer cancels in the combined physical gate. Closing FG already includes current Q_c; do not add it again as production. For each measured component k the production equation is O_WIP,k + fresh_input_k = C_WIP,k + new_release_k + joint_output_k + production_waste_k + production_emission_k. Release dry wood and water use the measured release state; closing FG is not an extra production output."
      source_ids: []
    - rule_id: b_failures
      applies_to: "all inventory rows"
      rule: "Include failed lots, zero-output intervals, start/stop, idle, cleanup, screening rejects and actual rework. Opening/closing WIP carries an exchange-by-exchange inherited burden vector, measured material/water state and unresolved history; never replace it with zero or a universal scalar. Internal rework/collector return pairs have equal physical amounts and inherited vectors and no new purchase/output."
      source_ids: []
    - rule_id: b_services
      applies_to: "all inventory rows"
      rule: "Track gross physical shipments H_c separately from attributable service burden. Opening/closing FG retains original first-release mass, original burden vector and later changes. Returns link the original dispatch/reverse service and add only real incremental inspection/rework/handling; neither return nor reinspection creates production Q. Attach later services to the original Q_c once; if cohort histories cannot be reconstructed retain pending completeness. For the same component k: O_FG,k + new_release_k + external_return_k = C_FG,k + gross_shipment_k + service_waste_k + service_emission_k. Substitute the production equation and cancel new_release_k once for the combined gate; do not add it or closing FG again. Keep original first-release Q separate from later moisture changes. Independent evidence resolves real dry-matter loss, evaporated water and any reaction oxygen/water; one residual cannot fit multiple unknowns."
      source_ids: []
    - rule_id: b_species
      applies_to: "all inventory rows"
      rule: "Retain full physical wood, bark, water, auxiliary and relevant element/species balances independently of allocated burden. Captured particles, escaped dust and water loss have distinct destinations. No automatic biogenic neutrality, avoided lumber/fuel, recycled-content credit or carbon-storage credit is allowed. Add any actual missing material/fuel/chemical/packaging/emission as its own specific exchange before complete-dataset use."
      source_ids:
        - usda-wood-handbook-2021
        - ilcd-allocation-2010
boundary_abstraction:
  declared_starting_condition: "Untreated green Nordic spruce sawlogs at a documented source/receipt gate; bark and prior debarking status declared"
