allocation_rules:
  - rule_id: a_context
    applies_to: "all inventory rows"
    rule: "This is an attributional production method. Industrial descriptions establish actual joint stages and physical states, not an LCA allocation approval. Apply the hierarchy below for each real multifunctional stage and each affected exchange; a category label or low sawdust price never establishes zero burden (ilcd-allocation-2010)."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_subdivide
    applies_to: "all inventory rows"
    rule: "First assign exclusive operations, supplies, emissions and actual waste treatment to the function they serve using independent metering or defensible virtual subdivision. Sawdust-only collection/screening and its service burdens belong to sawdust; downstream lumber drying/planing belongs to lumber. Justify remaining indivisible joint stages."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_causal
    applies_to: "all inventory rows"
    rule: "For each remaining exchange identify a determining physical causal relationship and document why changes in each output/function drive that exchange. Evaluate product-related material/element contents separately from process-related power, auxiliaries and emissions. A mass, volume, processing-time or other ratio is allowed only where causality for that specific exchange is evidenced; the existence of a dry mass balance alone does not establish one allocation key for everything."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_residual
    applies_to: "all inventory rows"
    rule: "Only where a remaining exchange has no supported determining physical relation may the residual joint burden use actual contemporaneous market values at the same joint-process gate and condition. Record traded quantities, prices, currency, period, moisture/grade, unpackaged/packed state and deduction of downstream transport/conditioning/packaging. Shares sum to one across actual cofunctions; document zero/negative value or untraded conditions, missing evidence and sensitivity instead of applying a fixed proportion or switching freely between physical and economic methods."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_physical
    applies_to: "all inventory rows"
    rule: "Maintain unallocated physical output V_i, dry wood/water/element accounts and stock vectors separately from burden assignment. Whole lumber/chips/bark output and material balances are never multiplied by sawdust burden shares. No avoided-product, recovered-energy or recycling credit follows from residue status. Purchased supplier burden is inherited once; genuine waste/end-of-life status needs a separately evidenced applicable boundary rather than a default zero."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_origin
      process_id: "sawdust_supply"
      flow_role: "spruce_logs; log_road_freight"
      record_type: "receipt and source record"
      raw_fields: "supplier; lot; Nordic spruce trace; whole-log wet mass; bark; moisture; original units; source gate; forestry/harvest burden vector; upstream debarking/haulage inclusion; actual road legs/payload/km; carrier loaded/empty/return-leg convention; original kg*km or t*km and one-time conversion; provider reference; opening/closing log stock"
      collection_method: "Weigh net receipts and sampled wet/oven-dry components; read exact supplier reference and gate documentation; reconcile road service without duplicate provider fuel/background. Convert raw kg*km to the exact native t*km by dividing by 1000 once before attribution; retain already measured t*km unchanged and do not infer zero burden for empty legs."
      unit: "kg; t*km"
      frequency: "Each lot and meter/operation interval; repeated stock checks"
      temporal_coverage: "One declared representative period covering actual seasons, failures, idle and rework; preserve linked cohort history"
      site_scope: "One declared sawmill and segregated spruce stream; original cohort supply services"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; source records; acceptance; representative sampling; provider gates; explicit missing histories and uncertainty"
    - protocol_id: cp_release
      process_id: "sawdust_supply"
      flow_role: "sawdust_release"
      record_type: "first-release quality and mass record"
      raw_fields: "cohort c; unique new release id/time; gross/tare/net wet mass; wet/dry moisture basis; sieve result/morphology; species/contamination acceptance; first-release decision; rejected/reworked lot links; opening/closing WIP and FG; original release mass"
      collection_method: "Calibrated net weighing at the first accepted supply-material gate; pair representative moisture samples and actual acceptance tests; reject duplicate release events, dispatched old stock and packaging tare."
      unit: "kg"
      frequency: "Each lot and meter/operation interval; repeated stock checks"
      temporal_coverage: "One declared representative period covering actual seasons, failures, idle and rework; preserve linked cohort history"
      site_scope: "One declared sawmill and segregated spruce stream; original cohort supply services"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; source records; acceptance; representative sampling; provider gates; explicit missing histories and uncertainty"
    - protocol_id: cp_joint
