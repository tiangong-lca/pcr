          offset: 11866
          line: 83
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Untreated green Nordic spruce sawlogs at a documented source/receipt gate; bark and prior debarking status declared |\n| starting_condition_role | Full source-sawmill foreground with inherited forestry/harvest/transport boundary; not purchased finished sawdust repackaging |\n| product_classification_scope | Only the fine loose green spruce sawdust subset of CPC 39283; neighbouring material forms are distinct |\n| recursive_input_rule | No same-category purchased sawdust is in the declared route. If actually imported it requires a separate supplier-gate exchange and scope assessment; never erase supplier burden or add it on top of the same log-origin wood. |\n| upstream_dataset_requirement | Source-specific sawlog forestry/harvest and actual transport/debarking boundaries; single provider per exchange; compatible electricity/water/auxiliary/transport and waste treatment |\n| disclosure | Production/service gates; actual stages; all failures and stock histories; supplier boundaries; allocation; quantities; exclusions; unknown identities and amounts |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_origin | spruce_logs; log_road_freight | Retain full source sawing, debarking when actual and clean segregation. Use exactly one inherited source burden per material portion; supplier included transport/debarking is not entered again. Lumber-only downstream drying/planing/painting does not burden the already separated green sawdust without evidence. | metsa-renko-sawmill; corrim-northern-lumber-2025 |\n| b_first_release | all inventory rows | Production runs to the first accepted net sawdust gate Q_c. Maintain separate post-release service records for storage, temporary containers, handling, loading and dispatch and attribute them to the original cohort Q_c. The internal release transfer cancels in the combined physical gate. Closing FG already includes current Q_c; do not add it again as production. For each measured component k the production equation is O_WIP,k + fresh_input_k = C_WIP,k + new_release_k + joint_output_k + production_waste_k + production_emission_k. Release dry wood and water use the measured release state; closing FG is not an extra production output. |  |\n| b_failures | all inventory rows | Include failed lots, zero-output intervals, start/stop, idle, cleanup, screening rejects and actual rework. Opening/closing WIP carries an exchange-by-exchange inherited burden vector, measured material/water state and unresolved history; never replace it with zero or a universal scalar. Internal rework/collector return pairs have equal physical amounts and inherited vectors and no new purchase/output. |  |\n| b_services | all inventory rows | Track gross physical shipments H_c separately from attributable service burden. Opening/closing FG retains original first-release mass, original burden vector and later changes. Returns link the original dispatch/reverse service and add only real incremental inspection/rework/handling; neither return nor reinspection creates production Q. Attach later services to the original Q_c once; if cohort histories cannot be reconstructed retain pending completeness. For the same component k: O_FG,k + new_release_k + external_return_k = C_FG,k + gross_shipment_k + service_waste_k + service_emission_k. Substitute the production equation and cancel new_release_k once for the combined gate; do not add it or closing FG again. Keep original first-release Q separate from later moisture changes. Independent evidence resolves real dry-matter loss, evaporated water and any reaction oxygen/water; one residual cannot fit multiple unknowns. |  |\n| b_species | all inventory rows | Retain full physical wood, bark, water, auxiliary and relevant element/species balances independently of allocated burden. Captured particles, escaped dust and water loss have distinct destinations. No automatic biogenic neutrality, avoided lumber/fuel, recycled-content credit or carbon-storage credit is allowed. Add any actual missing material/fuel/chemical/packaging/emission as its own specific exchange before complete-dataset use. | usda-wood-handbook-2021; ilcd-allocation-2010 |\n\n"
