measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "1 kg net first-released sawdust; collect Q_c by calibrated tare-corrected weighing in cp_release. Every inventory row is per 1 kg reference flow. No per-item mass or volume-density assumption is used."
  - id: moisture_basis
    applies_to: "spruce_logs; sawdust_release; green_lumber; spruce_chips; sold_bark; rejected_sawdust; bark_waste"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure each actual stream and stock moisture. w=(m_w-m_d)/m_w; u=(m_w-m_d)/m_d; m_d=m_w*(1-w)=m_w/(1+u). Convert percentages to fractions. Record water separately; no common species density or target moisture (usda-wood-handbook-2021)."
  - id: electricity_units
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve meter kWh and convert by 3.6 MJ/kWh before attribution and normalization. Actual supply voltage/geography/provider must match. Laboratory sample drying does not establish factory thermal drying."
  - id: raw_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "Declared row unit"
    rule: "Retain original meter unit and conversion evidence. Integrate an actual rate over time; never multiply an already integrated liquid/gas volume by time again. Any volume-to-mass conversion uses independently measured density for that material and physical state, not a secondary native coefficient or water density for another liquid."
  - id: unique_release
    applies_to: "sawdust_release"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q_c sums unique new first releases of cohort c; finished closing stock is already part of Q_c. Gross dispatch H_c, internal passes, reinspection, returns and retained packaging are not production denominators. Q_c=0 retains actual burdens and yields no unit result."
