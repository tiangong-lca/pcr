  market_state: "Bulk loose fine sawdust; natural measured moisture; no added binder; no industrial drying or chemical treatment"
functional_unit:
  what: "Supply segregated non-agglomerated green Nordic spruce sawdust for a declared subsequent use"
  how_much: "1 kg net newly first-quality-released sawdust at its measured release moisture"
  how_well: "Document actual species/origin; untreated clean wood; fine kerf morphology; particle-size and contamination acceptance; distinguish chips/shavings"
