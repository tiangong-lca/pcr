        end:
          offset: 54183
          line: 547
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_context | all inventory rows | This is an attributional production method. Industrial descriptions establish actual joint stages and physical states, not an LCA allocation approval. Apply the hierarchy below for each real multifunctional stage and each affected exchange; a category label or low sawdust price never establishes zero burden (ilcd-allocation-2010). | ilcd-allocation-2010 |\n| a_subdivide | all inventory rows | First assign exclusive operations, supplies, emissions and actual waste treatment to the function they serve using independent metering or defensible virtual subdivision. Sawdust-only collection/screening and its service burdens belong to sawdust; downstream lumber drying/planing belongs to lumber. Justify remaining indivisible joint stages. | ilcd-allocation-2010 |\n| a_causal | all inventory rows | For each remaining exchange identify a determining physical causal relationship and document why changes in each output/function drive that exchange. Evaluate product-related material/element contents separately from process-related power, auxiliaries and emissions. A mass, volume, processing-time or other ratio is allowed only where causality for that specific exchange is evidenced; the existence of a dry mass balance alone does not establish one allocation key for everything. | ilcd-allocation-2010 |\n| a_residual | all inventory rows | Only where a remaining exchange has no supported determining physical relation may the residual joint burden use actual contemporaneous market values at the same joint-process gate and condition. Record traded quantities, prices, currency, period, moisture/grade, unpackaged/packed state and deduction of downstream transport/conditioning/packaging. Shares sum to one across actual cofunctions; document zero/negative value or untraded conditions, missing evidence and sensitivity instead of applying a fixed proportion or switching freely between physical and economic methods. | ilcd-allocation-2010 |\n| a_physical | all inventory rows | Maintain unallocated physical output V_i, dry wood/water/element accounts and stock vectors separately from burden assignment. Whole lumber/chips/bark output and material balances are never multiplied by sawdust burden shares. No avoided-product, recovered-energy or recycling credit follows from residue status. Purchased supplier burden is inherited once; genuine waste/end-of-life status needs a separately evidenced applicable boundary rather than a default zero. | ilcd-allocation-2010 |\n\n"
