    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment – Detailed guidance, first edition March 2010; sections 7.9.2–7.9.3, printed pp.255–272, PDF pp.275–292. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
