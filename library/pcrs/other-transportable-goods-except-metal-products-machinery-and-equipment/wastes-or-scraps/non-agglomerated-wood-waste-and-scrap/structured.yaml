      raw_fields: "meter id; original kWh; voltage; geography/grid/provider; stage; cohort; run/failure/start/stop/idle/cleanup; timestamps; allocation evidence; WIP inherited vector"
      collection_method: "Read calibrated electricity meters before division; reconcile stage/service submeters with bills and real allocation; include unproductive operation and energy in rework."
