    - protocol_id: cp_pack
      process_id: "sawdust_supply"
      flow_role: "pp_bag_purchase; pp_bag_return; spent_pp_bag; every actual first nonpurchase article interface"
      record_type: "each physical packaging article ledger"
      raw_fields: "article p; construction/provider; measured net article mass; opening empty/attached WIP/attached FG/reusable; P_p; first nonpurchase N_ext,p; true ER_p and original outward dispatch; exact receipt ID/time/origin and custody; specific material/form/type and measured atomic input interface; owner and inherited unused-stock vector; one actual provider; closing same stocks; S_p on gross dispatch; EO_p; W_p; cohort; internal reuse; inherited service history"
      collection_method: "Trace each actual whole bag and location with weighing and counts; distinguish new purchases, first nonpurchase physical ingress, internal reuse and true external returns as mutually exclusive events; add the specific actual atomic receipt and measure its whole physical quantity separately from procurement. Reconcile all opening/closing states and gross outward legs under the complete independent equation, retaining the owner/vector and one provider burden once without a second manufacture purchase."
      unit: "kg"
      frequency: "Each lot and meter/operation interval; repeated stock checks"
      temporal_coverage: "One declared representative period covering actual seasons, failures, idle and rework; preserve linked cohort history"
      site_scope: "One declared sawmill and segregated spruce stream; original cohort supply services"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; source records; acceptance; representative sampling; provider gates; explicit missing histories and uncertainty"
    - protocol_id: cp_fates
      process_id: "sawdust_supply"
      flow_role: "rejected_sawdust; bark_waste"
      record_type: "waste and rework fate record"
      raw_fields: "lot; phase; original rejected state; wet/dry/bark/water mass; captured dust; waste/sale/return fate; receiver/treatment; WIP/FG history; mutually exclusive portions; contamination tests"
      collection_method: "Weigh each real segregated fate; match receiver manifests and internal return endpoints; clean untreated sawdust combustion/recovery only uses the specified Waste flow. Add a specific actual incompatible fate row rather than use the wrong identity."
      unit: "kg"
      frequency: "Each lot and meter/operation interval; repeated stock checks"
      temporal_coverage: "One declared representative period covering actual seasons, failures, idle and rework; preserve linked cohort history"
      site_scope: "One declared sawmill and segregated spruce stream; original cohort supply services"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; source records; acceptance; representative sampling; provider gates; explicit missing histories and uncertainty"
    - protocol_id: cp_emissions
      process_id: "sawdust_supply"
      flow_role: "pm25; pmcoarse; pmlarge; bio_co2; bio_ch4; methanol_air; alpha_pinene_air; oxygen_uptake"
      record_type: "species-resolved monitoring record"
      raw_fields: "real species/CAS/stereochemistry; medium; carbon origin; stage/cohort; controls; sampling area/time; concentration; actual rate or integrated volume; temperature/pressure/dry-wet basis; cumulative particle cuts; captured fractions; uncertainty/detection limits"
      collection_method: "Use source/control-matched measurements or independently justified applicable species factors and measured activity; calculate real species amounts with their own units. Check actual native species and air compartment; do not replace chemical identity with VOC/COD/carbon residuals."
      unit: "kg"
      frequency: "Each lot and meter/operation interval; repeated stock checks"
      temporal_coverage: "One declared representative period covering actual seasons, failures, idle and rework; preserve linked cohort history"
      site_scope: "One declared sawmill and segregated spruce stream; original cohort supply services"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; source records; acceptance; representative sampling; provider gates; explicit missing histories and uncertainty"
    - protocol_id: cp_stocks
      process_id: "sawdust_supply"
      flow_role: "all inventory rows"
      record_type: "stock and internal return ledger"
      raw_fields: "cohort; opening/closing WIP and FG; each material/water/auxiliary component; each inherited exchange vector; new inputs; internal return pair; unreleased/failed lot; historical missing burden; physical residual; uncertainty"
      collection_method: "Inventory physical stocks and reconcile both endpoints of every internal transfer before allocation; retain exchange-specific historical vectors. Keep opening FG out of new Q and closing released FG within Q."
      unit: "kg"
      frequency: "Each lot and meter/operation interval; repeated stock checks"
      temporal_coverage: "One declared representative period covering actual seasons, failures, idle and rework; preserve linked cohort history"
      site_scope: "One declared sawmill and segregated spruce stream; original cohort supply services"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; source records; acceptance; representative sampling; provider gates; explicit missing histories and uncertainty"
    - protocol_id: cp_services
      process_id: "sawdust_supply"
      flow_role: "all inventory rows"
      record_type: "post-release cohort service ledger"
      raw_fields: "original cohort c and Q_c; release gate/time; opening/closing FG state and vector; gross dispatch H_c; container tare; returned shipment/original reversal links; storage duration; water change; handling/loading/inspection/rework raw resource and fate records"
      collection_method: "Track actual post-release storage, containment, handling and loading separately by original cohort; allocate real service activity to its original cohort without dividing by gross dispatch or counted handling events. Preserve historical burden and actual incremental returned-goods work."
      unit: "kg; actual row units"
      frequency: "Each lot and meter/operation interval; repeated stock checks"
      temporal_coverage: "One declared representative period covering actual seasons, failures, idle and rework; preserve linked cohort history"
      site_scope: "One declared sawmill and segregated spruce stream; original cohort supply services"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; source records; acceptance; representative sampling; provider gates; explicit missing histories and uncertainty"
  calculation_rules:
    - id: prepare_numerator
      applies_to: "all inventory rows"
      rule: "Convert raw units and integrate only real rates before attribution. Assemble each raw total, opening/closing WIP exchange vector and actual incremental work without dividing. Independently meter/subdivide exclusive burdens, then apply a_causal and only necessary a_residual to remaining joint burdens. A_i is that undivided attributable burden/activity amount; for physical product/waste/species reporting A_i=V_i, the unallocated whole physical amount. Preserve both views and their distinct meanings. Do not reallocate an inherited provider burden or scale the physical balance by burden shares."
      inputs:
        - cp_origin
        - cp_joint
        - cp_energy
        - cp_aux
        - cp_water
        - cp_pack
        - cp_fates
        - cp_emissions
        - cp_stocks
        - cp_services
      output: "A_i in its declared row unit; independent V_i and burden vectors"
      source_ids:
        - ilcd-allocation-2010
    - id: normalize_cohort
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q_c; Q_c is the unique newly first-released net sawdust mass in kg of original cohort c. Reference sawdust output is 1 kg. Apply exactly once after prepare_numerator; for several cohorts divide the sum of compatible attributable numerators by their matched sum of Q_c, never average already divided ratios. Q_c=0 retains raw burdens with no unit result. Post-release services attach to original Q_c and are never divided by H_c."
      inputs:
        - A_i
        - Q_c
        - cp_release
        - cp_services
      output: "Exchange per 1 kg reference flow; separate unallocated physical and attributed burden views"
      source_ids: []
    - id: wood_water
      applies_to: "spruce_logs; sawdust_release; green_lumber; spruce_chips; sold_bark; rejected_sawdust; bark_waste"
      rule: "w=(m_w-m_d)/m_w; u=(m_w-m_d)/m_d; m_d=m_w*(1-w)=m_w/(1+u). Use fractions and matched stream/stock samples; m_water=m_w-m_d. Sample the actual wood and distinguish bark/soil/oil where present; no generic density or moisture target."
      inputs:
        - m_w
        - m_d
        - cp_origin
        - cp_release
        - cp_joint
        - cp_fates
        - cp_stocks
      output: "Independent dry wood and water masses"
      source_ids:
        - usda-wood-handbook-2021
    - id: physical_gates
      applies_to: "all inventory rows"
      rule: "Apply the production, service and combined component equations in section 6 with the same physical terms and measured states. Release cancels once in the combined gate. Independently evidence dry wood loss and water loss; one residual cannot solve both. Whole mixture exports include their measured constituents and are not added to them. Retain unresolved balance with uncertainty."
      inputs:
        - cp_origin
        - cp_release
        - cp_joint
        - cp_water
        - cp_fates
        - cp_emissions
        - cp_stocks
        - cp_services
      output: "Unallocated component gate reconciliation and explicit residuals"
      source_ids:
        - usda-wood-handbook-2021
    - id: packaging_balance
      applies_to: "pp_bag_purchase; pp_bag_return; spent_pp_bag; every actual first nonpurchase article interface"
      rule: "For each article p: O_empty,p + O_WIP,p + O_FG,p + O_reusable,p + P_p + N_ext,p + ER_p = C_empty,p + C_WIP,p + C_FG,p + C_reusable,p + S_p + EO_p + W_p. Locations must not overlap. N_ext,p is the measured actual first nonpurchase input defined in section 6 and cp_pack, not a compensating residual; P_p/N_ext,p/true ER_p never duplicate the same receipt. Preserve the specific atomic interface, owner and inherited vector and one actual provider once. Internal reuse cancels; gross physical shipment packaging S_p is independent of Q_c and P_p. No purchase is inferred from handling counts or returned bags."
      inputs:
        - cp_pack
        - cp_services
        - cp_stocks
      output: "Each complete independent packaging mass ledger"
      source_ids: []
    - id: particle_intervals
      applies_to: "pm25; pmcoarse; pmlarge"
      rule: "PM_fine=PM2.5; PM_coarse=PM10-PM2.5; PM_large=PM_total-PM10, only for the same source/time/control/measurement basis. A negative interval is inconsistent evidence. Cumulative totals and captured solids are not additional escaped particulate exchanges."
      inputs:
        - cp_emissions
      output: "Three nonoverlapping air particle intervals"
      source_ids: []
    - id: carbon_species
      applies_to: "bio_co2; bio_ch4; methanol_air; alpha_pinene_air"
      rule: "Material C uses actual measured dry-component carbon fraction. Resolve true species and carbon origin independently: C_CO2=(12/44)*m_CO2; C_CH4=(12/16)*m_CH4; C_methanol=(12/32)*m_methanol. Use independently known molecular formula/composition for each other real species. Reconcile carbon in wood/bark/stock, dust, liquids and gases; no forced neutrality, default carbon fraction, assumed gas partition or offset."
      inputs:
        - cp_origin
        - cp_joint
        - cp_emissions
        - cp_fates
        - cp_stocks
        - cp_services
      output: "Unallocated carbon balance with species and origin evidence"
      source_ids: []
    - id: service_attribution
      applies_to: "all inventory rows"
      rule: "For each original cohort retain Q_c, old burden vector and actual gross H_c. Record only additional real service resources/losses after release and link external returns to original dispatch and any actual service reversal. Transfer historical vectors, subtract only the burden portion actually transferred out of the relevant account, and add incremental work once. Missing history prevents a completed cohort burden; it does not create zero burden or new Q. Feed the undivided attributable service numerator into the same normalize_cohort once."
      inputs:
        - cp_services
        - cp_stocks
        - cp_release
      output: "Original-cohort service attribution without new production"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Match one actual atomic exchange, native type/species/route/form/moisture/geography/medium and exact property-unit chain. Preserve full restrictions in descriptions. An unbound auxiliary remains specific and pending; provider compatibility is independently verified."
      evidence: "cp_origin; cp_aux; cp_emissions; exact native and provider documents"
    - id: dq_core
      applies_to: "sawdust_release; spruce_logs"
      requirement: "Prove segregated Nordic spruce green sawdust from actual sawlogs and first acceptance. Generic Wood material identity cannot replace actual species, morphology, contamination and moisture evidence. Incompatible or missing core evidence blocks complete dataset use."
      evidence: "cp_origin; cp_release; supplier and acceptance tests"
    - id: dq_measurement
      applies_to: "all inventory rows"
      requirement: "Calibrated original units; representative per-stream wet/oven-dry measurements; phase/cohort coverage; one Q; no default per-piece mass/density/yield. Preserve all failed and zero-output intervals."
      evidence: "cp_release; cp_energy; cp_stocks"
    - id: dq_allocation
      applies_to: "all inventory rows"
      requirement: "Independent exclusive/virtual subdivision then exchange-specific physical causality and only unavoidable residual common-gate contemporaneous market value. Physical balance and burdens remain distinct; no fixed credit/share."
      evidence: "cp_joint; ILCD sections 7.9.2–7.9.3; attribution evidence"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Include actual unlisted supplies, species, fates and all stock histories as separate atomic rows. Unsupported core route or unknown physical fate remains incomplete. Aux UUID/provider and future site measurements are ordinary gaps, never fabricated values or automatic methodology promotion."
      evidence: "cp_fates; cp_services; cp_water; explicit gap and coverage record"
    - id: dq_sources
      applies_to: "all inventory rows"
      requirement: "Primary industrial contexts are not a single factory/order and are not numerical templates. CORRIM northern mixed-species survey and Södra published moisture/energy/ash do not establish this cohort’s quantities. Preserve conditions and contrary examples."
      evidence: "Declared sources; site primary records; state-specific uncertainty"
validation_rules:
  - rule_id: v_context
    applies_to: "all inventory rows"
    rule: "The following requirements concern a concrete dataset. Builder structural/measurement success verifies only declared relationships and never supplies missing plant evidence, scientific review, translation review or accepted classification mapping."
    source_ids: []
  - rule_id: v_reference
    applies_to: "sawdust_release; spruce_logs"
    rule: "Require all reference qualifiers and one unique Product output of 1 kg linked to sawdust_release. Confirm actual clean green Nordic spruce kerf sawdust, not a chip/shaving/pellet/briquette/treated composite. Verify the broad locator’s restrictions and actual core supplier/acceptance evidence before complete-dataset use."
    source_ids:
      - un-cpc3-2025
      - metsa-renko-sawmill
      - sodra-sawdust
  - rule_id: v_denominator
    applies_to: "all inventory rows"
    rule: "Verify raw original units, prepare_numerator attribution and one normalize_cohort division by the original first-release Q_c. Closing released FG is already counted; gross shipments H_c and packaging are not new production. Q_c=0 retains burden without unit output. Collection/aggregation/cards must not divide again."
    source_ids: []
  - rule_id: v_gates
    applies_to: "all inventory rows"
    rule: "Check the same unallocated production, service and combined wood/bark/water/auxiliary/element equations; cancel the internal Q transfer, preserve opening/closing WIP and FG vectors and each return pair. Resolve physical mass, true chemical species/reaction water and relevant elements independently; no dual-unknown residual fitting."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: v_fates
    applies_to: "all inventory rows"
    rule: "Check mutually exclusive accepted/rework/waste/coproduct portions, each complete packaging ledger and actual external provider. Reconcile whole mixed exports with non-additive constituent ledgers. Captured dust is not emitted PM; cumulative particle cuts cannot overlap. Confirm air medium, actual molecular species/CAS and carbon origin; total VOC/COD is no named species."
    source_ids: []
  - rule_id: v_burden
    applies_to: "all inventory rows"
    rule: "Verify origin inherited once, lumber-exclusive stages excluded unless causally justified, exchange-specific attribution hierarchy and same-gate residual values only when necessary. Check conservation of allocated burdens across all functions independently of full physical outputs. No neutrality or recovery/substitution credit."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_pending
    applies_to: "all inventory rows"
    rule: "Any real core identity/terminal-route mismatch, missing causal/market evidence required for attribution, unknown stock burden history, unresolved material/emission fate or unsupported unit conversion keeps the affected dataset incomplete. Preserve ordinary auxiliary UUID/provider/measurement gaps explicitly; neither a generic UUID nor a structural pass clears them. A real boiler/dryer/treated-wood or other unsupported route requires scope assessment and complete additional atomic inventory first."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_production_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply of the declared green loose Nordic spruce sawdust cohort for separate downstream use; reporting at first release with original-cohort service attribution"
  excluded_use: "Pellet/briquette/wood-flour manufacture; delivered useful heat; generic wood waste; treated/composite residues; unsupported species/state substitution; automatic zero-burden or recovery-credit model"
  required_metadata: "All reference qualifiers; first Q gate and cohort; gross H and service gate; source/background boundaries; unallocated quantities; allocation by exchange; complete stock vectors; provider/identity and sampling evidence"
  required_quality_disclosure: "Scope of actual site/period; ordinary unresolved auxiliary identities/providers; missing core evidence or burden/stock/fate histories; measurement uncertainty; species coverage; source applicability; true incomplete-dataset holds"
  update_trigger: "Changed species, moisture state, particle morphology, chemical treatment, agglomeration, origin burden, actual energy/control route, co-product status/causality/prices, first-release gate, stock/service handling or provider reference"
data_sources:
