  product_classification_scope: "Only the fine loose green spruce sawdust subset of CPC 39283; neighbouring material forms are distinct"
  recursive_input_rule: "No same-category purchased sawdust is in the declared route. If actually imported it requires a separate supplier-gate exchange and scope assessment; never erase supplier burden or add it on top of the same log-origin wood."
  upstream_dataset_requirement: "Source-specific sawlog forestry/harvest and actual transport/debarking boundaries; single provider per exchange; compatible electricity/water/auxiliary/transport and waste treatment"
  disclosure: "Production/service gates; actual stages; all failures and stock histories; supplier boundaries; allocation; quantities; exclusions; unknown identities and amounts"
