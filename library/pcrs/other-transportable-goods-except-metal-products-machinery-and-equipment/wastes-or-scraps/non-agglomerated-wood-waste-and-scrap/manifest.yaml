review_metadata:
  scientific_review: "pending"
  translation_review: "pending; Chinese aligned, not independently reviewed"
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  scope_decision: "One segregated green Nordic spruce fine kerf sawdust stream from source sawmilling through first release; no drying, binder or agglomeration. Product-form subset of CPC 39283. Existing chips, flour, lumber and pellet methods have materially different reference outputs or processing gates. No mapping or publication approval."
  evidence_synthesis: "Primary Renko spruce/byproduct context and separate Sodra wet-sawdust/coarse-chip supply context are not a same-factory or same-order claim. CORRIM regional quantities and mass-allocation example are not defaults. Wood Handbook moisture measurement and ILCD attributional hierarchy retain their scope."
  reference_identity: "Wood material is a verified Product/Mass locator with species/form/dimensions/treatment/moisture/route/geography/provider unspecified; actual green Nordic spruce kerf sawdust is qualified in both complete reference and inventory context. No verified supplier background or factory quantity inferred."
  unresolved_inventory_uuids:
    - row_id: "electricity"
      selected_flow: "Low-voltage alternating-current electricity"
      reason: "CN low-voltage and project-specific returned identities do not establish the actual Nordic user-side electricity supply; match voltage/geography/mix/provider."
    - row_id: "mineral_oil"
      selected_flow: "Petroleum mineral hydraulic lubricating oil"
      reason: "Returned aec6f1a5 record fixes PAO total synthesis; cannot represent mineral hydraulic oil. Use actual whole formulation and supplier evidence."
    - row_id: "pp_bag_purchase"
      selected_flow: "Woven polypropylene bulk bag"
      reason: "Returned woven PP bag fixes 25 kg seed capacity and farm gate; cannot represent temporary sawdust bulk bag."
    - row_id: "spruce_chips"
      selected_flow: "Green Nordic spruce sawmill chip"
      reason: "Returned Wood Chip is Volume-based with no solid/bulk convention; cannot infer kg from native coefficient; provider quantity-state compatibility pending."
    - row_id: "sold_bark"
      selected_flow: "Fresh Nordic spruce bark"
      reason: "Verified Bark record is Waste flow; marketed Product bark requires its own compatible identity and actual status."
    - row_id: "pp_bag_return"
      selected_flow: "Empty woven polypropylene bulk bag"
      reason: "Actual empty bulk article and external return state need verification; no forced generic package binding."
    - row_id: "aqueous_waste"
      selected_flow: "Sawmill washdown wastewater"
      reason: "Actual collected sawmill washwater whole-mixture composition/treatment identity remains to be matched; inappropriate wafer/electroplating/direct-discharge candidates are not used."
    - row_id: "spent_blade"
      selected_flow: "Worn steel band-saw blade"
      reason: "Actual retired steel band-saw blade alloy/contamination/receiver identity not established by generic steel scrap."
    - row_id: "spent_pp_bag"
      selected_flow: "Discarded woven polypropylene bulk bag"
      reason: "Actual discarded whole bulk article and treatment need verification; resin and waste route cannot be inferred."
    - row_id: "water_vapour"
      selected_flow: "water vapour"
      reason: "Candidate native synonym list mixes ordinary H2O, heavy/tritiated water and phase terms; resolve actual ordinary vapour identity before Flow binding."
    - row_id: "bio_co2"
      selected_flow: "carbon dioxide (biogenic)"
      reason: "Candidate synonyms mix ordinary CO2 gas with dry-ice, ionic and isotope terms; explicit native form ambiguity retained and no Flow UUID adopted."
    - row_id: "bio_ch4"
      selected_flow: "methane (biogenic)"
      reason: "Candidate native synonyms contain incompatible graphite/carbon black/formaldehyde chemical names despite CH4 basename and CAS; no binding until resolved."
    - row_id: "methanol_air"
      selected_flow: "methanol"
      reason: "Candidate native synonyms include methanol-water mixture and sodium methoxide; species identity must be resolved before Flow binding."
    - row_id: "alpha_pinene_air"
      selected_flow: "Alpha-pinene to ambient air"
      reason: "Returned (1s)-(-)-alpha-pinene fixes enantiomer; actual generic alpha-pinene speciation does not establish stereochemistry."
    - row_id: "oxygen_uptake"
      selected_flow: "Oxygen consumed from ambient air"
      reason: "Actual elementary oxygen-from-air identity/compartment requires verification; do not bind purchased oxygen or total ventilation air."
    - row_id: "rain_ingress"
      selected_flow: "Rainwater entering sawdust storage"
      reason: "Actual precipitation ingress, boundary and elementary rainwater identity require verification; do not bind municipal supply or fresh-water abstraction."
  ordinary_foreground_gaps:
    - "Actual site/period, source lot and acceptance specification; observed quantities and per-stream moisture; exact supplier/background compatibility; independent causal/market evidence when attribution requires it; inherited WIP/FG vectors and later service records. These are collection requirements, not fabricated values or automatic draft triggers."
  true_holds:
    - "Scientific and independent translation review pending; no methodology/mapping/publication approval."
    - "Complete dataset use requires actual compatible core species/form/moisture/route, unique first Q, complete inherited stock history, actual attribution evidence and physical/species fates. This candidate contains no claimed factory measurements."
