review_metadata:
  component_physical_review: "Complete same-gate packaging closure includes independently measured non-overlapping F_in/F_out actual material, water, species and phase transfers. Pair internal cross-ledger legs; retain whole contaminated W once and non-additive contents. P/I/N_ext/ER ownership/history and Q/Qc/burden rules are preserved; X is same-side OTHER deduplication only, not a genuine-input deletion."
  scientific_review: "pending"
  translation_review: "pending"
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  scope_decision: "One source-segregated new uncoated BS EN 12588 rolled-lead-sheet manual-cutting offcut route at unique first recycling-receiver quality release. Distinct from sheet manufacture, lead refining, battery waste, ash/sludge and remelting ingots. Current accepted narrower mapping and durable acceptance evidence are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and acceptance.decision_ref; no independent scientific/translation or publication approval is implied."
  evidence_synthesis: "Calder actual rolled-sheet specification; LSTA actual fitting offcuts segregation containers and scrap merchant handoff; Monument whole hooked sheet-lead knife; WB Phillips primary clean roofing/flashing/sheet scrap receiver; ILCD allocation hierarchy. Qualitative technical synthesis, not one factory or SKU inventory."
  unresolved_flow_uuids:
    - row_id: "sheet_feed"
      flow: "New uncoated BS EN 12588 rolled lead sheet"
      reason: "The selected complete uncoated BS EN 12588 rolled sheet is supported by primary manufacturer evidence; current bounded native searches did not establish a compatible whole-sheet identity. Copper sheet/rod, refined lead ingot and intentionally different lead-tin-antimony alloy are not substitutes. Ordinary upstream supply identity gap; not missing scrap reference or original-formation method."
    - row_id: "lead_knife"
      flow: "Hooked sheet-lead knife with wooden handle"
      reason: "Monument primary whole hooked wooden-handled sheet-lead knife is not the state-100 replacement steel saw/shear blade. Whole-tool supplier/form/complete material identity and actual service history remain unbound."
    - row_id: "make_electricity"
      flow: "Purchased low-voltage alternating-current electricity at user meter"
      reason: "Actual ancillary user-side electricity country/voltage/provider must match. Direct-read a9e85657 is Huaian straw-power plant net output; 50657322 is CN <1 kV grid-average user supply. Neither is adopted as a universal UK/unspecified-site supply."
    - row_id: "parent_blank"
      flow: "Uncoated rolled-lead roof-flashing blank"
      reason: "Concrete uncoated rolled-lead roof-flashing blank at joint cut gate is a physical companion, not lead scrap or generic rod/profile. Whole native form remains unbound; physical record and disjoint inherited history retained."
    - row_id: "usable_remnant"
      flow: "Reusable uncoated rolled-lead sheet remnant"
      reason: "Actual useful uncoated rolled sheet remnant retains product and prior history unless actual disposition proves otherwise; cannot bind it as finished scrap merely by Pb content."
    - row_id: "unreleased_cutoffs"
      flow: "Unreleased rolled-lead solid cutoff waste"
      reason: "Actual unreleased rejected solid cutoff waste requires actual waste state/destination; the adopted c814 lead scrap Product identity is not automatically applied to this Waste output."
    - row_id: "make_dust"
      flow: "Captured lead-bearing dry cleanup dust"
      reason: "Whole actual captured lead-bearing dry cleanup dust is mixed Waste, not kg of pure Pb/oxide, clean offcut Product or elementary air release. Actual composition/state/receiver identity remains unbound."
    - row_id: "make_wastewater"
      flow: "Lead-bearing hygiene and cleanup wastewater"
      reason: "One whole actual lead-bearing hygiene/cleanup wastewater sent to external treatment. A generic residue or elementary Pb/water release cannot represent this actual mixed wastewater; composition/state and one treatment provider remain to be confirmed."
    - row_id: "retired_knife"
      flow: "Retired hooked sheet-lead knife with wooden handle"
      reason: "Actual retired whole wooden-handled hooked sheet-lead knife is distinct from pure-steel scrap or separately replaced blade. Whole versus genuinely dismantled outlets require actual retirement/provider evidence."
    - row_id: "service_electricity"
      flow: "Purchased low-voltage alternating-current electricity at user meter"
      reason: "Same actual country/voltage/user-meter requirement as make_electricity, but only performed post-release service with original Q_c. No universal generation/grid substitution."
    - row_id: "service_dust"
      flow: "Captured lead-bearing dry cleanup dust"
      reason: "Same specific whole captured lead-bearing dry cleanup dust identity as make_dust; separately tagged original-cohort service stream, not duplicate manufacturing waste."
    - row_id: "service_wastewater"
      flow: "Lead-bearing hygiene and cleanup wastewater"
      reason: "Same specific whole lead-bearing hygiene/cleanup wastewater identity as make_wastewater; actual post-release service with original Q_c and independent raw quantity."
    - row_id: "can_waste"
      flow: "Retired steel can for recycling"
      reason: "Retired actual steel-can Waste, with actual contents removal and contamination, is distinct from the adopted new/reused Steel can Product identity. No automatic generic scrap substitution."
    - row_id: "pe_film_in"
      flow: "Low-density polyethylene sheet-protection film"
      reason: "The exact LDPE sheet-protection film article and actual leg of its component pool remain unbound; not an assertion that the source supplier uses this film. Native polymer resin/fibre/twine or an unspecified waste mixture is not a substitute. Record real whole film composition, physical supply/retirement state and unique upstream/treatment owner before binding."
