system_boundary:
  rules:
    - rule_id: sb_manufacture
      applies_to: "make"
      rule: "Include original sheet receipt/storage and inherited sheet burden; layout and actual manual cold cutting of flashing blanks; segregation of offcuts from useful remnants; necessary physical sorting/foreign-object removal; actual weighing and receiver-specification first release. Do not replace these operations with purchased scrap packing. Include all real handling, tooling, metering, hygiene, controls, failed runs, start/stop, idle, cleanup, samples and rework. Later installation/finishing of the parent flashing is outside this joint-cutting gate."
      source_ids:
        - calder-rolled-sheet
        - lsta-working-lead-2018
        - monument-lead-tools-2018
        - wbphillips-lead-reception
        - jrc-ilcd-2010
    - rule_id: sb_whole_supply
      applies_to: "purchased inputs"
      rule: "Purchase the whole supplied sheet once. Pb assay, trace elements, surface oxide, coating and water are analytical/physical subaccounts, not purchases of pure constituents. Upstream melting, refining and rolling already included in the supplier chain are not repeated onsite. Each whole supplied preparation or tool likewise has one owner; actual onsite mixing requires separate purchased ingredients plus real mixing energy and loss. Scrap status does not establish zero inherited burden."
      source_ids:
        - calder-rolled-sheet
        - jrc-ilcd-2010
    - rule_id: sb_first_release
      applies_to: "manufacturing and FG gates"
      rule: "Q counts each unique accepted offcut lot once at its first receiver-specification quality release. Closing FG already released is included in Q; never add closing FG alongside Q as another manufacturing output or subtract its manufacturing vector. Internal first-release transfer cancels in the consolidated physical gate. Reinspection, shipment, return and rework are not new production. Unaccepted lots remain WIP or real waste with their historical burdens."
      source_ids:
        - wbphillips-lead-reception
        - jrc-ilcd-2010
    - rule_id: sb_service
      applies_to: "service"
      rule: "Retain performed post-release storage, handling, packing and dispatch in an original-cohort service account with original Q_c and observed horizon H. Keep opening/closing FG and returns with complete historical manufacturing vectors. Do not deduct performed services for closing FG or normalize by H. No assumed storage duration, transport distance, useful tool life or repair success; document actual external freight in its own mode-specific atomic exchange if it is in scope. Net-delivery normalization requires a different reviewed stock/return model."
      source_ids:
        - lsta-working-lead-2018
        - jrc-ilcd-2010
    - rule_id: sb_stocks
      applies_to: "every exchange and cohort"
      rule: "Retain opening/closing raw materials, WIP, unused tools/packaging and unassigned charges in original extensive units with per-exchange inherited burden vectors. Correct stocks once only; consumption already stock-adjusted is not corrected again. Include every zero-output and failed event. Q=0 carries all actual loads without a unit result. Internal reuse moves physical quantities and burden history together; matched internal legs cancel while real added work and losses remain."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_physical
      applies_to: "manufacturing FG and consolidated gates"
      rule: "Reconcile full gross physical V independently of attributed A at each gate, including main blanks, usable remnants, offcuts, stocks, each waste outlet and real emissions. Close total mass and Pb plus each relevant trace element independently. Whole mixed outlets occur once; source partitions are disjoint and sum to the whole without being added again. Distinguish metal, actual oxide/carbonate phases, free water and other water states by independent measurement. One residual cannot solve two unknown species or water quantities. PM, COD and total-Pb indicators are not molecular mass. Any X correction removes only an exact duplicate OTHER term on the same side, never a stock or opposite-side leg."
      source_ids:
        - lsta-working-lead-2018
        - jrc-ilcd-2010
    - rule_id: sb_packaging
      applies_to: "each packaging component pool"
      rule: "For each steel can and each actual film/bag/lid/strap/pallet component separately: opening empty + attached WIP + attached FG + reusable stocks + purchases P + supplier-included ingress I + first nonpurchase external ingress N_ext + external returns received ER + F_in = corresponding closing stocks + packaging on gross physical shipments S + external returns sent EO + waste W + F_out. Classify each actual external receipt exactly once: ER requires a traceable actual prior outward movement of the same component from this pool; among other receipts P covers every purchased component, including one paid within a whole-lot purchase price without a separate invoice, I covers genuinely nonpurchased components accompanying a supplier delivery, and N_ext covers all remaining first nonpurchase receipts, including third-party empty cans first borrowed or leased. I and N_ext are mutually exclusive; third-party first borrowing/leasing is not supplier-included I. F_in/F_out are separately named and independently measured actual material/water/species or phase-transfer legs into/out of this same component pool after excluding quantities already in P/I/N_ext/ER or S/EO/W. Include measured retained contamination and moisture change where actually present; internal cross-ledger transfers must have a paired counterpart and cancel only at the combined gate. Whole contaminated waste W is measured once, with non-additive material/content partitions and one provider. These are physical transfers, not invented purchases, Q or burden factors. Deduplication X removes only an exact same-side OTHER duplicate and cannot erase a genuine new retained-material input. No wet operation, reaction yield or quantity is assumed. Internal reuse cancels and is neither a first external receipt nor another purchase nor Q nor automatic coproduct. S follows gross shipments regardless of return or allocation share. Physical receipt quantity is independent of procurement and burden attribution. Retain procurement mode, legal owner, custody, cohort, inherited per-exchange vectors and one documented upstream/burden/service owner per component receipt; do not invent a new manufacturing purchase, whole-load charge or credit for N_ext. ER retains original history with no fresh supply provider. Whole mixed disposal and disjoint source partitions do not create extra providers."
      source_ids:
        - lsta-working-lead-2018
        - jrc-ilcd-2010
    - rule_id: sb_actual_atoms
      applies_to: "actual route"
      rule: "Each actual carrier, fuel, oil formulation, cleaning preparation, tool, packaging article, waste stream and emitted species needs a specific atomic exchange and independent actual query/identity review. No missing quantity is zero. The defined cold manual route does not presume cutting oil, patination, fuel, steam or a boiler. Any actual added substance or changed powered/thermal/chemical route must be explicitly included and reviewed before the package is complete. If external steam/heat carriers really occur, retain supplied and returned water kg, actual state/enthalpy and energy under one supplier convention; condensate exported is a Product return."
      source_ids:
        - lsta-working-lead-2018
        - monument-lead-tools-2018
        - jrc-ilcd-2010
