allocation_rules:
  - rule_id: al_context
    applies_to: "study goal"
    rule: "Apply this hierarchy only in an attributional case requiring allocation. Establish the joint gate where traced sheet becomes cut flashing blanks, reusable remnants and collected offcuts, with each actual status and function. Do not infer allocation or end-of-waste approval from commercial scrap terminology. Record actual receiving permissions and contract conditions without invented legal thresholds."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_subdivide
    applies_to: "each exchange"
    rule: "First isolate dedicated operations or use justified virtual subdivision. Assign offcut-only segregation/weighing directly to offcuts and parent-only forming work directly to the parent. Trace physically embodied sheet portions and supplier history to their actual destinations; separately assign non-valued losses with a justified causal treatment. Embodiment is not a blanket mass-allocation rule. Do not give offcuts no history merely because they are secondary."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_causality
    applies_to: "remaining common exchanges"
    rule: "For each remaining exchange establish the determining physical causal relationship supported by the actual operation. Cutting length/time, retained material embodiment and occupied storage volume-time can have different roles; none is a universal default. A cut made to form the parent may be determined by the parent surface/shape rather than offcut mass, as illustrated by the ILCD tile/gravel counterexample. State the evidence, driver, affected exchange and sensitivity; do not apply one mass ratio to all exchanges."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_residual
    applies_to: "unresolved common-process residual only"
    rule: "Only after documented failure of subdivision and determining physical causality allocate the genuine remaining common-process residual by contemporaneous market values for each cofunction at the same joint gate and its actual condition/quantity. First evidence the applicable product/treatment function, actual status, boundary and valuation case. Derive unmatched later selling prices back to that gate by removing evidenced later preparation/packing/transport costs; do not import finished-roof or refined-lead prices. State actual status, currency, dates, sources, non-positive values, missing prices and sensitivity. Negative or offsetting values and unresolved product/treatment functions require explicit case-specific methodological review; hold generic residual shares and the affected unit result until an evidenced applicable method and its review decision resolve the case. Missing or incomparable prices, zero values or an undefined denominator also require documented defensible handling before residual shares or the affected unit result can be issued; do not fabricate shares. Preserve already assigned dedicated/causal burdens, full physical V and inherited histories, failed/Q0 events, performed original-cohort services and once-only provider accounting during the hold. Negative burdens, zero burdens, absolute-value keys and avoided-production credits are not defaults; a negative-value case may proceed under its evidenced applicable reviewed method. No fixed allocation percentage or automatic avoided-production credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_internal
    applies_to: "internal reuse and provider accounting"
    rule: "Internal reusable remnants or returned offcuts retain complete historical vectors; paired transfers cancel and actual incremental work remains. Reuse is not a new purchase, credit or second first release. Keep one upstream owner for each whole incoming article and each whole external waste stream; do not layer a whole-mixture provider and its constituent/source partitions."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "make"
      flow_role: "whole sheet and physical companions"
      record_type: "scale and lot tracking"
      raw_fields: "lot; supplier; sheet certificate; grade and dimensions; gross; tare; whole net kg; assay basis; each element and phase; free water; parent blank kg; remnant kg; opening raw and WIP kg; closing raw and WIP kg; inherited exchange vectors; transport owner"
      collection_method: "Owner: manufacturing recorder. Weigh and identify each actual sheet/blank/remnant movement, preserve supplier chain and cross-check cut layout and stocks. Collect full unallocated gross physical records and raw extensive loads without Q division; do not treat supplier certificates as measured site moisture."
      unit: "kg"
      frequency: "each movement and period close"
      temporal_coverage: "complete manufacturing cohort and inherited WIP"
      site_scope: "actual source/cutting site and joint gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated scales; lot certificates; inventory and vector reconciliation"
    - protocol_id: cp_release
      process_id: "make"
      flow_role: "unique first-release Q"
      record_type: "weighing and receiver specification release"
      raw_fields: "unique lot; first acceptance id and time; source certificate; solid form; gross; tare; net whole kg; oxide and water basis; foreign objects removed; receiver and specification; released closing FG; rejected kg; original Q_c"
      collection_method: "Owner: quality releaser. Independently weigh net whole offcuts and verify actual origin/composition/condition against the named receiver agreement. Deduplicate release ids and distinguish unreleased WIP, useful remnant, released FG, return and dispatch. Keep raw Q; no normalized amount in collection."
      unit: "kg"
      frequency: "every lot first release and reporting close"
      temporal_coverage: "same cohort as numerator and original FG history"
      site_scope: "first receiver-specification release gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; actual agreement; composition test; unique release register"
    - protocol_id: cp_tool
      process_id: "make"
      flow_role: "whole knife service and retirement"
      record_type: "tool issue service and stock log"
      raw_fields: "whole tool identity; complete net kg; receipt; unused and installed opening/closing stocks; actual use time; sharpening work; retirement kg and destination; prior exchange vectors"
      collection_method: "Owner: tool custodian. Track actual complete tool supply and service assignment with actual use/retirement history; measure mass independently. Retain unused/installed service stock. Include real sharpening consumables/energy/outlets as new atomic rows; never invent useful life or knife mass. Raw records only."
      unit: "kg"
      frequency: "each issue service and retirement"
      temporal_coverage: "complete cohort and prior service history"
      site_scope: "actual manual cutting station"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "receipt; mass record; use log; retirement and stock reconciliation"
    - protocol_id: cp_energy
      process_id: "make"
      flow_role: "manufacturing electricity"
      record_type: "meter and activity log"
      raw_fields: "meter id; supplier; country; voltage; loss boundary; cumulative start and end; unit; event time; start stop idle cleanup; dedicated and shared drivers; opening/closing unassigned load"
      collection_method: "Owner: utility recorder. Retain raw meter differences in kWh or MJ, classify actual sub-operations and collect independent drivers before attribution. No inferred electricity from rated power without measured operating time/load. Shared meter reconciliation retains all failed/zero-output and idle events. Do not divide by Q here."
      unit: "kWh; MJ"
      frequency: "each event and complete period"
      temporal_coverage: "matched manufacturing period including failures"
      site_scope: "actual user meter and supply interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; bills; event reconciliation; driver evidence"
    - protocol_id: cp_water
      process_id: "make"
      flow_role: "tap water and whole cleanup wastewater"
      record_type: "water and wastewater measurement"
      raw_fields: "supplier water quality; raw meter unit; cumulative volume; actual density and state; whole wastewater kg; each solute and solid; actual species; water destinations; cleanup/hygiene event; treatment receiver"
      collection_method: "Owner: hygiene/cleanup recorder. Measure raw supplied and outgoing quantities independently; distinguish volume from rate and preserve actual density/state. Trace one whole wastewater provider and independent dissolved/solid composition. Include retained/evaporated water and true other outlets; a balance residual is not a measured species or second water unknown. No Q division."
      unit: "kg; m3"
      frequency: "each actual cleanup and matched period"
      temporal_coverage: "manufacturing cohort with water stocks"
      site_scope: "actual water and waste boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "water record; sampling methods; density conditions; receiving manifest"
    - protocol_id: cp_waste
      process_id: "make"
      flow_role: "each solid waste stream"
      record_type: "container scale and transfer record"
      raw_fields: "named waste; origin lot; gross; tare; whole net kg; phase and composition; water; WIP decision; destination and actual status; internal/external flag; inherited vectors"
      collection_method: "Owner: waste recorder. Weigh unreleased cutoffs and cleanup dust separately as full actual streams with sampling and receiver records. Do not classify undecided WIP as waste or multiply by an economic share. Partition assays and origins without adding to whole mass or duplicating a provider. Collect raw amounts only."
      unit: "kg"
      frequency: "each actual outlet and closing stock"
      temporal_coverage: "complete manufacturing period including cleanup"
      site_scope: "actual source and receiving gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; sampling; destination record; physical and element closure"
    - protocol_id: cp_emission
      process_id: "make"
      flow_role: "actual individual species to actual medium"
      record_type: "monitor and speciation record"
      raw_fields: "species; CAS if known; actual phase; Pb analytic basis; medium; post-control concentration; cumulative volume or actual rate; reference state; matched time; control status; detection limit and uncertainty"
      collection_method: "Owner: emission recorder. Measure after actual controls with matched concentration and volume/state, integrating a genuine rate only. Retain Pb versus oxide/ion/species conversion from independent composition and no double counting. Distinguish occupational concentration from environmental mass release and collected dust. Absence needs actual method and detection-limit evidence; unknown is not zero. Collect undivided raw quantities."
      unit: "kg"
      frequency: "actual measurement intervals and complete events"
      temporal_coverage: "representative full period with controls and failures"
      site_scope: "each actual emission point and medium"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "laboratory and monitor QA; species method; uncertainty and coverage"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "each post-release exchange and original cohort"
      record_type: "cohort service stock and return ledger"
      raw_fields: "original lot and Q_c; observed H; actual service event; raw meter/scales/species; opening and closing FG history; gross dispatch; actual returns; further work and failures; each exchange vector; unassigned service stock"
      collection_method: "Owner: warehouse recorder. Retain each actual service in its own physical unit with country/voltage/water/species conditions as on the corresponding card and original stock histories. Trace every return and original release; no second Q or assumed net delivery. Use cp_water/cp_waste/cp_emission methods for the corresponding service streams. Keep raw undivided records and actual H."
      unit: "kg; kWh; MJ"
      frequency: "each service dispatch return and close"
      temporal_coverage: "original cohort and actual observed extension H"
      site_scope: "actual warehouse handling and dispatch sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "release-id trail; meters; stock/vector reconciliation; actual horizon"
    - protocol_id: cp_pack
      process_id: "pack"
      flow_role: "each packaging component complete pool"
      record_type: "component supply stock shipment return waste ledger"
      raw_fields: "component and whole supply definition; composition; actual net kg and measured count-to-mass basis; incoming/outgoing interface form flow type and direction; unique receipt ID time and source record; procurement mode and actual purchase-price inclusion; legal owner and custody; cohort and inherited per-exchange vectors; opening and closing empty WIP-attached FG-attached reusable stocks; P; I; N_ext; ER; S; EO; W; linked same-component prior outward ID time and quantity for ER; internal reuse; independently measured F_in/F_out actual water/material/species/phase change and paired cross-ledger transfer IDs; unique provider and prior burden/service owner"
      collection_method: "Owner: packaging custodian. Independently weigh/count each actual component with measured mass where counts need conversion. Classify every actual receipt once by sb_packaging: P includes components paid within a whole-lot purchase price without separate invoicing; I is genuinely nonpurchased supplier-included ingress; N_ext is remaining first nonpurchase ingress including third-party empty cans first borrowed/leased; ER needs the same component's actual prior outward record. Reconcile sb_packaging in raw physical amounts per component and cohort before burden attribution, retaining actual procurement, legal ownership, custody and inherited vectors. Trace one upstream/burden/service owner without a fabricated manufacturing purchase, whole-load charge or credit for N_ext. S uses gross physical shipment; returns keep history; no fresh supply provider on internal reuse/ER. Separate source partitions of a shared mixed outlet without adding them to the whole. No Q division during collection."
      unit: "kg"
      frequency: "each ingress movement dispatch return waste and close"
      temporal_coverage: "complete manufacturing and original service cohort"
      site_scope: "actual supplier third-party custodian warehouse and receiving pool gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; component certificates; receipt/outward links; complete component-pool closure; provider ownership"
  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Convert each undivided original observation to its extensive row unit before allocation. For raw electricity kWh multiply once by 3.6 to MJ. For actual species concentration use matched cumulative volume, or integrate true rate over time, then apply independently evidenced element/species basis. Preserve reference states and uncertainty; no second time multiplication or inferred density."
      inputs:
        - cp_material
        - cp_release
        - cp_tool
        - cp_energy
        - cp_water
        - cp_waste
        - cp_emission
        - cp_service
        - cp_pack
      output: "raw_extensive_i"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_assign
      applies_to: "all inventory rows"
      rule: "Apply al_subdivide then al_causality then only the documented al_residual remainder separately by exchange. Apply al_residual including its hold before calc_once. For each manufacturing exchange form A_i from disjoint current attributable load plus inherited opening WIP/unused unassigned vector minus closing unfinished/unused unassigned vector. Correct stocks once. Released-FG manufacturing history stays in Q and is not subtracted. Failures and actual losses remain assigned explicitly. Form B_i_c separately for performed original-cohort service with its inherited unassigned service vectors."
      inputs:
        - raw_extensive_i
        - cp_material
        - cp_release
        - cp_tool
        - cp_service
        - cp_pack
      output: "A_i; B_i_c"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_physical
      applies_to: "manufacturing FG consolidated and packaging gates"
      rule: "Keep full V_i independent of A_i. At each gate reconcile opening plus gross external input with closing plus gross external output and independently evidenced transformations; cancel paired internal legs. Manufacturing output includes unique Q, joint parent blanks, actual external reusable remnants and wastes, without adding released closing FG beside Q. FG: opening FG plus first-release transfer plus actual returns equals closing FG plus gross dispatch plus actual waste/loss. Reconcile Pb and other elements independently and apply each separate sb_packaging pool including its measured non-overlapping F_in/F_out legs. X removes only exact same-side OTHER duplication."
      inputs:
        - cp_material
        - cp_release
        - cp_waste
        - cp_water
        - cp_service
        - cp_pack
      output: "V_i; physical_residual; elemental_residual"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_once
      applies_to: "all inventory rows"
      rule: "For Q>0 execute x_i = A_i / Q once; the separately tagged physical audit is v_i = V_i / Q. Performed service is s_i_c = B_i_c / Q_c using the original first-release denominator only. These accounts are parallel and cannot become sequential divisions or duplicated providers. Cards and aggregation only reference these results. If the applicable Q or Q_c is zero retain complete raw loads and histories without producing a unit result."
      inputs:
        - A_i
        - B_i_c
        - V_i
        - cp_release
        - cp_service
      output: "x_i; v_i; s_i_c"
      source_ids:
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference and sheet"
      requirement: "Trace one uncoated rolled sheet lot, actual whole composition and solid offcut form through original cutting to a named recycling receiver. Distinguish batteries, coated alternatives, alloy feeds, dust/ash/sludge and usable remnants; no generic lead name establishes a lot."
      evidence: "supplier certificate; route records; actual receiver specification; assays"
    - id: dq_completeness
      applies_to: "every physical and burden account"
      requirement: "Retain all applicable raw extensive quantities, failed/Q0/start-stop/idle/cleanup/rework events, WIP/FG vectors and actual service H. Missing data remain unknown; no zero or not_applicable without physical evidence. Add actual extra materials and species before completed-package release."
      evidence: "event register; meters; stocks; mass/element and complete component-pool closure"
    - id: dq_representativeness
      applies_to: "sources and upstream providers"
      requirement: "Manufacturer/training/receiver sources establish the stated qualitative route and terminal, not a common factory BOM or environmental intensity. Declare actual site, country, period, suppliers, quantities, controls, status and technical transfer limits. Keep unmatched native identities unbound and concrete."
      evidence: "source applicability assessment; supplier and actual foreground records"
    - id: dq_allocation
      applies_to: "each common exchange"
      requirement: "Document subdivision attempts, determining driver and uncertainty, remaining common-process residual, condition/gate/period-matched values and sensitivity. Do not inherit another draft's allocation approval or a blanket ratio."
      evidence: "exchange-specific allocation worksheet and raw evidence"
    - id: dq_bilingual
      applies_to: "all UUID-bearing and unbound rows"
      requirement: "Preserve original native type/route/form/CAS/geography/property restrictions and exact unit chain in every applicable complete exchange description. Use official Chinese base names for UUID flows; translate unbound atomic names accurately."
      evidence: "complete native identity and projection context audit"
validation_rules:
  - rule_id: vr_reference
    applies_to: "released_offcuts"
    rule: "Exactly one Product output linked by reference_flow_link is 1 kg of the defined first-released whole offcuts. Q is measured independently of Pb assay and shipment. Closing released FG is already in Q; no repeated release on reinspection or return."
    source_ids:
      - lsta-working-lead-2018
      - jrc-ilcd-2010
  - rule_id: vr_route
    applies_to: "make and actual receiver"
    rule: "Require evidence of original supplied sheet, actual cutting into parent blanks/offcuts, source segregation, actual necessary preparation and specified recycling reception. A purchased scrap packing record cannot pass origin coverage. Clean offcuts are not batteries or residues simply because Pb is present."
    source_ids:
      - lsta-working-lead-2018
      - jrc-ilcd-2010
  - rule_id: vr_units
    applies_to: "all inventory rows"
    rule: "Retain native reference property/unit group/unit and all actual conditions. No rods-to-sheet, source-generation-to-user-electricity, foreign-grid substitution or pure-element-to-mixture substitution by name. Unbound auxiliaries/providers remain explicit gaps; a missing core reference or true terminal evidence keeps methodology draft."
    source_ids:
      - lsta-working-lead-2018
      - jrc-ilcd-2010
  - rule_id: vr_accounts
    applies_to: "manufacturing FG service and package pools"
    rule: "Independently verify gross V, attributed A, each element, WIP history, unique Q and original Q_c services. Require separate complete packaging pools with the full sb_packaging F_in/F_out equality and independently measured actual material/water/species/phase legs, their atomic interfaces and paired cross-ledger records; preserve whole contaminated W once and non-additive partitions with one provider per whole ingress/outlet. No same-side X deduction without the exact duplicate OTHER term; no omitted stock or double-counted mixed outlet partitions."
    source_ids:
      - lsta-working-lead-2018
      - jrc-ilcd-2010
  - rule_id: vr_calculation
    applies_to: "collection and published amounts"
    rule: "Protocols collect raw undivided amounts. Conversion/attribution precedes the sole calc_once quotient; amounts and aggregation do not divide again. Enforce the al_residual applicability decision and hold before any affected unit result. Q=0 retains loads and cannot yield a unit result. Measurements, uncertainty and unsupported relationships remain visible rather than being marked pass."
    source_ids:
      - lsta-working-lead-2018
      - jrc-ilcd-2010
  - rule_id: vr_species
    applies_to: "each actual waste and emission"
    rule: "Keep every actual whole waste and emitted species/medium atomic, with independent composition/state evidence. Do not infer two unknowns from one residual or use PM/COD/total-metal as molecular mass. Unknown actual additional streams block completion of that dataset until measured or bounded explicitly."
    source_ids:
      - lsta-working-lead-2018
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "Attributional foreground inventory for original formation and first recycling-feed release of the defined new lead-sheet offcuts"
  downstream_use: "secondary_dataset; background_dataset; explicit linked flow/process/lifecycle-model use"
  allowed_use: "Only with compatible sheet form/composition, original manual route, first-release basis, actual receiver and compatible upstream chain"
  excluded_use: "Full CPC leaf coverage; battery/slag/ash/sludge treatment; purchased-scrap repacking; refined-lead or roof service claim; default recycling credit"
  required_metadata: "one traced new uncoated rolled-lead sheet lot to the documented BS EN 12588 supply specification; actual whole alloy composition and trace elements rather than assumed pure Pb; sheet dimensions and actual hand-cutting tool and layout; parent flashing-blank gate and inherited sheet burdens; solid offcut form and separation from reusable remnants batteries ash and sludge; actual oxide layers coatings free water and physical contamination subledgers; source segregation and actual necessary preparation; specified lead-recycling receiver and condition-specific acceptance; unique first-release identity and net whole Q excluding containers; opening and closing raw WIP and FG history with per-exchange vectors; all failures Q0 start stop idle cleanup and rework; attributed A separate from gross physical V; original Q_c and observed post-release service horizon H; actual site country electricity supply voltage and provider; separate complete pool and upstream ownership for every packaging component; every actual waste stream emitted species medium and destination"
  required_quality_disclosure: "source-specific qualitative synthesis; no factory numeric ranges; full raw/attributed/physical ledger coverage; actual stock and receiver evidence; ordinary UUID/provider gaps; real unresolved core/terminal holds if present; science and translation review state"
  update_trigger: "Change in sheet composition/coating/form, cutting route, actual receiver, acceptance conditions, upstream history, controls, utilities, packaging, site or study allocation context"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division. CPC Version 3.0 Structure (30 June 2025). https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv ; classification detail https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/39364"
    used_for: "39364 classification context and distinction from 39320 residues, 39350 iron/steel remelting ingots, 39380 batteries and 41542 sheet; not a product-method approval"
  - id: "calder-rolled-sheet"
    type: "handbook"
    reference: "Calder Lead. Rolled lead sheet. https://calderlead.co.uk/products-and-services/building/rolled-lead-sheet/ (publisher snapshot 2026-10-26)"
    used_for: "Actual standard rolled construction-sheet form and BS EN 12588 supply specification; roofing/flashing function and distinct coated alternatives; no batch assay or numeric inventory adopted"
  - id: "lsta-working-lead-2018"
    type: "extension_guidance"
    reference: "Lead Sheet Training Academy. Working with Rolled Lead Sheet in Construction (May 2018), PDF pp. 3-6 / printed pp. 4-11. https://leadsheet.co.uk/app/uploads/2018/05/LSTA-WWLIC-0518.pdf"
    used_for: "Clean solid new-sheet context versus old corrosion/hot-work counterexamples; fitting offcuts and source segregation; suitable containers and recycling merchant handoff; actual cleaning/water/dust controls and records; historical legal numbers and recycling percentages not adopted"
  - id: "monument-lead-tools-2018"
    type: "handbook"
    reference: "Monument Tools. Product Catalogue (2018), PDF p. 26 Roofing with adjacent pp. 25 and 27. https://monument-tools.com/wp-content/uploads/2018/01/Monument-Tools-Cataogue-2018.pdf"
    used_for: "Whole hooked heat-treated sheet-lead knife with wooden handle as manual cutting-tool evidence; adjacent snips, soldering and slate tools are not substituted or mandatory inputs"
  - id: "wbphillips-lead-reception"
    type: "literature"
    reference: "WB Phillips Metals. Scrap Lead Recycling. https://wbphillipsmetals.co.uk/scrap-metal/scrap-lead-recycling/ (publisher snapshot 2026-10-26)"
    used_for: "Primary receiver evidence for clean roofing/flashing/sheet scrap, segregation, calibrated weighing and grading; actual acceptance agreement still required, no price/yield/legal approval inferred"
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance. First edition March 2010, section 7.9.2-7.9.3, printed pp. 255-268 / PDF pp. 275-288. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional cases requiring allocation: dedicated/virtual subdivision, embodiment versus losses, exchange-specific determining physical causality and remaining common-process gate/condition-specific market value; methodological collection/accounting synthesis, no industrial recipe or universal allocation fraction"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:62565b553dbea45026fbef92d54bd93df10bbb11483cbd663b02f2bb22cb29e2"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_8160"
      family: "system_boundary"
      span:
        start:
          offset: 8160
          line: 61
          column: 1
        end:
          offset: 17245
          line: 85
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Receipt of one traceable new uncoated rolled-lead sheet lot with its compatible upstream supply history |\n| starting_condition_role | foreground_starting_condition |\n| product_classification_scope | Only the defined clean solid new sheet-offcut subset of CPC 39364; not every lead-bearing waste |\n| recursive_input_rule | Purchased prepared scrap does not create manufacturing Q. Internal reusable remnants and rework retain history and cancel matched internal transfers. Released returns retain the original cohort and cannot earn another Q. |\n| upstream_dataset_requirement | One compatible provider for the whole rolled sheet including its actual recovery/refining/alloying/rolling and supply freight; actual knife and each utility and packaging article once |\n| disclosure | one traced new uncoated rolled-lead sheet lot to the documented BS EN 12588 supply specification; actual whole alloy composition and trace elements rather than assumed pure Pb; sheet dimensions and actual hand-cutting tool and layout; parent flashing-blank gate and inherited sheet burdens; solid offcut form and separation from reusable remnants batteries ash and sludge; actual oxide layers coatings free water and physical contamination subledgers; source segregation and actual necessary preparation; specified lead-recycling receiver and condition-specific acceptance; unique first-release identity and net whole Q excluding containers; opening and closing raw WIP and FG history with per-exchange vectors; all failures Q0 start stop idle cleanup and rework; attributed A separate from gross physical V; original Q_c and observed post-release service horizon H; actual site country electricity supply voltage and provider; separate complete pool and upstream ownership for every packaging component; every actual waste stream emitted species medium and destination |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| sb_manufacture | make | Include original sheet receipt/storage and inherited sheet burden; layout and actual manual cold cutting of flashing blanks; segregation of offcuts from useful remnants; necessary physical sorting/foreign-object removal; actual weighing and receiver-specification first release. Do not replace these operations with purchased scrap packing. Include all real handling, tooling, metering, hygiene, controls, failed runs, start/stop, idle, cleanup, samples and rework. Later installation/finishing of the parent flashing is outside this joint-cutting gate. | `calder-rolled-sheet`; `lsta-working-lead-2018`; `monument-lead-tools-2018`; `wbphillips-lead-reception`; `jrc-ilcd-2010` |\n| sb_whole_supply | purchased inputs | Purchase the whole supplied sheet once. Pb assay, trace elements, surface oxide, coating and water are analytical/physical subaccounts, not purchases of pure constituents. Upstream melting, refining and rolling already included in the supplier chain are not repeated onsite. Each whole supplied preparation or tool likewise has one owner; actual onsite mixing requires separate purchased ingredients plus real mixing energy and loss. Scrap status does not establish zero inherited burden. | `calder-rolled-sheet`; `jrc-ilcd-2010` |\n| sb_first_release | manufacturing and FG gates | Q counts each unique accepted offcut lot once at its first receiver-specification quality release. Closing FG already released is included in Q; never add closing FG alongside Q as another manufacturing output or subtract its manufacturing vector. Internal first-release transfer cancels in the consolidated physical gate. Reinspection, shipment, return and rework are not new production. Unaccepted lots remain WIP or real waste with their historical burdens. | `wbphillips-lead-reception`; `jrc-ilcd-2010` |\n| sb_service | service | Retain performed post-release storage, handling, packing and dispatch in an original-cohort service account with original Q_c and observed horizon H. Keep opening/closing FG and returns with complete historical manufacturing vectors. Do not deduct performed services for closing FG or normalize by H. No assumed storage duration, transport distance, useful tool life or repair success; document actual external freight in its own mode-specific atomic exchange if it is in scope. Net-delivery normalization requires a different reviewed stock/return model. | `lsta-working-lead-2018`; `jrc-ilcd-2010` |\n| sb_stocks | every exchange and cohort | Retain opening/closing raw materials, WIP, unused tools/packaging and unassigned charges in original extensive units with per-exchange inherited burden vectors. Correct stocks once only; consumption already stock-adjusted is not corrected again. Include every zero-output and failed event. Q=0 carries all actual loads without a unit result. Internal reuse moves physical quantities and burden history together; matched internal legs cancel while real added work and losses remain. | `jrc-ilcd-2010` |\n| sb_physical | manufacturing FG and consolidated gates | Reconcile full gross physical V independently of attributed A at each gate, including main blanks, usable remnants, offcuts, stocks, each waste outlet and real emissions. Close total mass and Pb plus each relevant trace element independently. Whole mixed outlets occur once; source partitions are disjoint and sum to the whole without being added again. Distinguish metal, actual oxide/carbonate phases, free water and other water states by independent measurement. One residual cannot solve two unknown species or water quantities. PM, COD and total-Pb indicators are not molecular mass. Any X correction removes only an exact duplicate OTHER term on the same side, never a stock or opposite-side leg. | `lsta-working-lead-2018`; `jrc-ilcd-2010` |\n| sb_packaging | each packaging component pool | For each steel can and each actual film/bag/lid/strap/pallet component separately: opening empty + attached WIP + attached FG + reusable stocks + purchases P + supplier-included ingress I + first nonpurchase external ingress N_ext + external returns received ER + F_in = corresponding closing stocks + packaging on gross physical shipments S + external returns sent EO + waste W + F_out. Classify each actual external receipt exactly once: ER requires a traceable actual prior outward movement of the same component from this pool; among other receipts P covers every purchased component, including one paid within a whole-lot purchase price without a separate invoice, I covers genuinely nonpurchased components accompanying a supplier delivery, and N_ext covers all remaining first nonpurchase receipts, including third-party empty cans first borrowed or leased. I and N_ext are mutually exclusive; third-party first borrowing/leasing is not supplier-included I. F_in/F_out are separately named and independently measured actual material/water/species or phase-transfer legs into/out of this same component pool after excluding quantities already in P/I/N_ext/ER or S/EO/W. Include measured retained contamination and moisture change where actually present; internal cross-ledger transfers must have a paired counterpart and cancel only at the combined gate. Whole contaminated waste W is measured once, with non-additive material/content partitions and one provider. These are physical transfers, not invented purchases, Q or burden factors. Deduplication X removes only an exact same-side OTHER duplicate and cannot erase a genuine new retained-material input. No wet operation, reaction yield or quantity is assumed. Internal reuse cancels and is neither a first external receipt nor another purchase nor Q nor automatic coproduct. S follows gross shipments regardless of return or allocation share. Physical receipt quantity is independent of procurement and burden attribution. Retain procurement mode, legal owner, custody, cohort, inherited per-exchange vectors and one documented upstream/burden/service owner per component receipt; do not invent a new manufacturing purchase, whole-load charge or credit for N_ext. ER retains original history with no fresh supply provider. Whole mixed disposal and disjoint source partitions do not create extra providers. | `lsta-working-lead-2018`; `jrc-ilcd-2010` |\n| sb_actual_atoms | actual route | Each actual carrier, fuel, oil formulation, cleaning preparation, tool, packaging article, waste stream and emitted species needs a specific atomic exchange and independent actual query/identity review. No missing quantity is zero. The defined cold manual route does not presume cutting oil, patination, fuel, steam or a boiler. Any actual added substance or changed powered/thermal/chemical route must be explicitly included and reviewed before the package is complete. If external steam/heat carriers really occur, retain supplied and returned water kg, actual state/enthalpy and energy under one supplier convention; condensate exported is a Product return. | `lsta-working-lead-2018`; `monument-lead-tools-2018`; `jrc-ilcd-2010` |\n\n"
