review_metadata:
  scientific_review: pending
  translation_review: pending; Chinese aligned, not reviewed
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scope_decision: One N02200 annealed/pickled uncoated sheet-shearing offcut
    stream, source generation through named nickel recovery receiver. The source
    flat-product PCR has a different saleable-sheet reference; mixed metal and
    other-metal scrap methods do not cover this grade and source route.
  core_evidence_status: Reference Product Nickel Scrap and supplied nickel sheet
    have successful query membership and full state100 direct evidence.
    Independent primary sheet shearing and actual receiver
    preparation/inspection evidence support the bounded technical synthesis; no
    core terminal or manufacturing method hold identified by the author.
    Independent scientific acceptance remains pending.
  unresolved_inventory_row_ids:
    - contact_cardboard
    - spent_knife
    - spent_contact_cardboard
    - captured_shear_fines
    - captured_prepare_fines
    - shear_nickel_air
    - prepare_nickel_air
    - rejected_nickel_trim
    - cleanup_effluent
    - cleanup_water_vapour
    - steel_strap
    - waste_pallet
    - waste_strap
  unresolved_uuid_reasons:
    contact_cardboard: Specific uncoated cardboard machine-contact pad;
      optical-assembly candidate route is not this route.
    spent_knife: Specific spent tool-steel shear knife at actual recovery/treatment gate.
    spent_contact_cardboard: Specific contaminated pad waste; clean recovered paper is not equivalent.
    captured_shear_fines: Specific captured N02200 metallic fines; actual
      composition and destination required.
    shear_nickel_air: Outdoor metallic Ni species and medium; queried indoor-air
      record not adopted.
    captured_prepare_fines: Specific captured N02200 metallic preparation fines.
    prepare_nickel_air: Outdoor metallic Ni species and medium; queried indoor-air
      record not adopted.
    rejected_nickel_trim: Specific contaminated N02200 sheet reject, not clean product scrap.
    cleanup_effluent: Specific whole nickel-bearing equipment cleanup wastewater to treatment.
    cleanup_water_vapour: Specific water vapour outdoor exchange; no verified
      compatible medium binding adopted.
    steel_strap: Candidate fixes99%Fe/1%C and recycled mechanical
      decomposition/melting route; actual grade/route not verified.
    waste_pallet: Specific whole waste wooden pallet; actual provider and contamination.
    waste_strap: Specific waste steel strap; actual grade/coating and destination.
  ordinary_data_gaps:
    - Future site meter, heat assay, scale/tare, stock and inherited
      exchange-vector records; no factory numeric values fabricated.
    - One compatible actual provider per purchased exchange and actual receiver
      test/acceptance specification.
    - Conditional hydraulic, cleaning, emission species and all actually
      additional atomic exchanges require collection; auxiliary UUID gaps do not
      by themselves negate the evidenced core route.
  true_core_holds: []
  native_rejections:
    - CTUe-reference steel drum is not mass packaging.
    - Steel band fixed composition and recycled/melting route not assumed.
    - Indoor-air nickel elementary record is not an outdoor emission.
    - PAO total-synthesis or petroleum oil with fixed calorific grade not
      assumed for actual hydraulic formulation.
  source_limitations:
    - Transparent independent-primary technical synthesis, not one site/order.
    - NASA historical shearing case; downstream chemical/bonding operations are
      not copied into pre-separation offcuts.
    - Special Metals typical composition and Ni-plus-Co limit differ from VDM
      guarantee; no fixed Ni/Co recipe or density.
    - VDM tool protection appears under welding-workshop guidance; actual
      machine-contact configuration must be demonstrated.
    - ILCD bounded qualitative reads retain numeric_reuse blocked and covered
      false when basis/unit dimensions are unspecified; no numeric reuse.
  validation_scope: Author runs target-only explicit-root sync/check,
    schema/fingerprint, full raw-to-typed and native audits; no full-library
    qualification, mapping acceptance or publication.
