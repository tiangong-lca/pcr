measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reference amount and finished row are 1 kg of newly first-released net solid offcuts, not kg contained Ni. Weigh using cp_release; include inherent metallic constituents but exclude free liquid, detachable contamination and pallet/strap tare. Closing released FG already belongs to Q_c."
  - id: raw_conversion
    applies_to: "all inventory rows"
    required_property_ref:
      name: "actual row property"
      uuid: ""
    required_unit: "row unit"
    rule: "Preserve raw units before assignment: convert tonnes to kg and kWh to MJ with 3.6 MJ/kWh; litre to m3 with 0.001 m3/litre; t*km to kg*km with 1000. Integrate an actual rate over time only; a cumulative volume is not multiplied by duration. Any volume-to-mass closure uses independent same-substance density at actual composition and temperature/pressure, not the secondary flow-property coefficient, water density for oil, or a catalog nickel density."
  - id: single_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "actual row property"
      uuid: ""
    required_unit: "per reference flow"
    rule: "Collection stores unnormalized raw amounts. calc_raw converts units; calc_assign establishes row numerator A_r_c; calc_once divides by the original cohort Q_c exactly once. Cards and aggregation refer to that same result, never divide it again. Gross physical V and co-output quantities remain separate from attributed burden A. For Q_c=0 retain all loads and no unit result."
  - id: native_units
    applies_to: "selected native exchanges"
    required_property_ref:
      name: "verified reference property"
      uuid: ""
    required_unit: "kg; MJ; m3; kg*km"
    rule: "Mass uses group 93a60a57-a4c8-11da-a746-0800200c9a66 and kg; electricity uses Net calorific value 93a60a56-a3c8-11da-a746-0800200c9a66 with energy group 93a60a57-a3c8-11da-a746-0800200c9a66 and MJ, which does not make electricity a fuel. Hydraulic oil uses Volume 93a60a56-a3c8-22da-a746-0800200c9a66 with group 93a60a57-a3c8-12da-a746-0800200c9a66 and m3. Road service uses mass*distance 118f2a40-50ec-457c-aa60-9bc6b6af9931 with group 3620148f-c5db-48ce-9065-a10092089aca and kg*km. These service units do not establish metal mass or density."
