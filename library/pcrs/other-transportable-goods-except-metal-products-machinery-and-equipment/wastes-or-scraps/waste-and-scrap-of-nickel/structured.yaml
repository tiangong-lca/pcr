allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "This section applies only to the declared attributional allocation cases. Dedicated process evidence and complete preceding source/boundary context are required."
    source_ids: []
  - rule_id: al_scope
    applies_to: "attributional multifunctionality"
    rule: "Use this hierarchy only where the declared attributional system actually requires partitioning. Establish actual waste/co-product/transfer status and study-wide recycling convention at each gate; an industrial source does not establish an LCA allocation rule, and ILCD recycling annex formulas are not automatically adopted. No fixed shares, free scrap or recovery credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_subdivide
    applies_to: "each input and output burden"
    rule: "First separate dedicated operations and meter lots; then use virtual subdivision for exclusive exchanges. Track parent-blank-only annealing/EDM/etching/brazing separately from clean offcuts separated earlier. Assign scrap-only segregation, handling and grade tests directly to scrap. Retain actual failure and cleanup loads in the functions that caused them."
    source_ids:
      - nasa-nickel-sheet-1972
      - jrc-ilcd-2010
  - rule_id: al_causality
    applies_to: "remaining shared exchanges"
    rule: "For each remaining exchange determine which physical relation actually determines its existence and quantity. Embodied sheet assigned to each metallic output is not a blanket allocation of all electricity and losses by output mass. Cutting can be determined by the required parent-blank geometry while separate scrap preparation is driven by the scrap function. Demonstrate actual drivers exchange by exchange with measurements and process reasoning; do not arbitrarily choose mass, machine time, energy or economic allocation."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_residual_market
    applies_to: "genuinely inseparable remainder"
    rule: "Only after exclusive assignment, subdivision/virtual subdivision and determining physical causality are exhausted may a genuine remaining shared exchange be apportioned by contemporaneous market values of co-functions in their actual states at the same common process gate. Retain quantities, states, prices, dates, currency, missing-value handling and sensitivity; downstream refined-metal prices cannot substitute for offcut value at this gate. Never include a fraction already assigned earlier."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_conservation
    applies_to: "allocation and provider graph"
    rule: "Keep the unallocated physical system and all co-output burden vectors auditable, even if only the scrap dataset is delivered. Reconcile each exchange across parent blanks, scrap, rejected material, retained WIP and actual treatment; no missing inherited load or duplicated recycling provider. A whole mixed effluent or reject stream has one provider and mutually exclusive source/composition subledgers, never extra purchases for the same constituents."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_genealogy
      process_id: "shear"
      flow_role: "whole sheet and internal own trim"
      record_type: "certificates and transfer records"
      raw_fields: "heat id; source lot; N02200 certificate; Ni; Co; all relevant element results; annealed/pickled and no coating evidence; dimensions; receipt mass; upstream process graph; allocation convention; inherited exchange vectors; dates and provider ids"
      collection_method: "Match certificates to measured source and segregated transfers; inspect complete provider boundaries for duplicated refining/rolling/transport; assay independently where required"
      unit: "kg; %"
      frequency: "each heat and transfer"
      temporal_coverage: "complete cohort and inherited stocks"
      site_scope: "source supplier and both sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "heat-linked certificate; lab chain of custody; transfer tickets; provider boundaries"
    - protocol_id: cp_release
      process_id: "prepare"
      flow_role: "first released net solid offcuts"
      record_type: "calibrated weighing and grade release"
      raw_fields: "cohort c; release event id; gross mass; measured pallet and strap tare; free liquid and detachable rejects; net first-release Q_c; Ni and Co and other assay; dimensions; actual receiver tests/limits; decision; original event id for reversal; FG cohort ids"
      collection_method: "Weigh on calibrated scales and subtract measured packaging/free liquid/detachable contamination. Verify grade and unique first release. Keep closing accepted FG already inside Q_c, with returns and any linked reversal explicit"
      unit: "kg"
      frequency: "each release and correction"
      temporal_coverage: "cohort release and full later history"
      site_scope: "release site and named receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; tare evidence; test methods; first-release register; receiver documents"
    - protocol_id: cp_raw
      process_id: "shear"
      flow_role: "electricity and cleanup water"
