  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Convert each raw event quantity to its declared row unit before attribution. Integrate true rates only over measured intervals; concentration × measured same-state volume yields a species subledger only on its stated wet/dry basis. Do not multiply an integrated quantity by time. Independent material density is needed for mass-volume conversion."
      inputs:
        - raw_events
        - actual_units
        - measured_state
        - independent_density
      output: "V_r_c"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_assign
      applies_to: "all inventory rows"
      rule: "Preserve each gross physical V_r_c ledger. Convert upstream and WIP exchange vectors to the same row unit; assign dedicated/virtually subdivided portions, then determining physical causality, then only genuine residual market shares under section7. A_r_c is that row’s inherited opening WIP vector plus current attributed loads minus closing WIP vector, plus actual cohort-linked post-release service increments. FG history remains with original Q_c; service through opening FG is not new production. For physical co-output/internal-transfer diagnostic rows use their gross V as A without pretending it is a burden share. Keep all co-functions and reject/treatment vectors reconciled; failures/Q0 remain explicit."
      inputs:
        - V_r_c
        - inherited_vectors
        - current_loads
        - closing_WIP_vectors
        - cohort_services
        - cp_allocation
        - cp_prepare_allocation
        - cp_service_allocation
      output: "A_r_c"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_once
      applies_to: "all inventory rows"
      rule: "q_r_c = A_r_c / Q_c; A_r_c = attributable raw numerator in the declared row unit from calc_assign; q_r_c = exchange amount per 1 kg reference flow."
      inputs:
        - A_r_c
        - Q_c
        - cp_release
      output: "q_r_c"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_gates
      applies_to: "physical manufacturing and preparation and combined gates"
      rule: "At each fixed gate, for every conserved total material and relevant element, O + external receipts = C + external departures, with actual stock, material retention and independently verified air/water species. Internal recirculation cancels only inside that gate. Separate internal first-release Q_c transfers cancel when production and service are combined. Released-stock identity is O_FG + Q_c + returns = C_FG + gross dispatch + actual destruction/withdrawal, with each leg uniquely linked; already released return creates no new Q_c. An extra X may be introduced only for an exactly identified same-side duplication within OTHER; it cannot erase any physically distinct source, sink or unknown. Actual first external nonpurchase packaging receipts enter the physical receipts side through N_ext in sb_packaging and calc_packaging; X cannot supply or cancel this new physical input."
      inputs:
        - physical_O
        - physical_receipts
        - physical_C
        - physical_departures
        - actual_species
        - linked_FG_events
      output: "gate_residuals_and_disclosures"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_packaging
      applies_to: "wood_pallet; steel_strap; waste_pallet; waste_strap"
      rule: "Apply O_empty + O_WIP + O_FG + O_reusable + P + N_ext + ER = C_empty + C_WIP + C_FG + C_reusable + S + EO + W independently to each article type under sb_packaging. P retains actual procurement including acquired packaging within a whole purchased consignment; N_ext carries first external nonpurchase receipts on the actual input side; ER needs a linked prior outward event for the same component. Each receipt belongs to exactly one of these classes. Use measured quantities, mutually exclusive stock states and gross S/EO/W, not netted dispatch. Whole article mass and its non-additive constituents are not added together. Keep gross physical V separate from procurement/new-manufacture burdens and carry the actual owner/custody and inherited exchange vector/compatible provider once through calc_assign; physical N_ext is no automatic new manufactured-pallet purchase, zero-burden assumption or credit. Allocate actual packaging service to original cohorts using the demonstrated driver; packaging never enters product Q_c."
      inputs:
        - O_empty
        - O_WIP
        - O_FG
        - O_reusable
        - P
        - N_ext
        - ER
        - C_empty
        - C_WIP
        - C_FG
        - C_reusable
        - S
        - EO
        - W
        - internal_reuse
        - receipt_history
        - owner_custody
        - inherited_vectors
        - provider_boundaries
        - cp_packaging
      output: "packaging_residual_by_article"
      source_ids:
        - nautica-nickel-scrap
  data_quality_requirements:
    - id: dq_identity
      applies_to: "source_sheet and finished"
      requirement: "Keep actual heat/form/state/assay and receiver-test evidence, including Ni separate from Co and coating/contamination checks. A typical catalog percentage is not a lot assay."
      evidence: "certificate; independent assay; surface inspection; receiver specification"
    - id: dq_complete
      applies_to: "all exchanges and stocks"
      requirement: "Retain every real operation and atomic exchange, all failures and Q0 periods, opening/closing inherited WIP/FG vectors and one-provider whole-stream linkage. Missing core quantities remain incomplete; ordinary provider/auxiliary matching is disclosed collection work."
      evidence: "cross-gate stock audit; event log; provider-boundary graph"
    - id: dq_units
      applies_to: "raw measurement and q_r_c"
      requirement: "State raw unit, calibration, concentration basis, measurement state, uncertainty and actual conversion provenance. Sum no interval twice and divide by Q_c only in calc_once."
      evidence: "calibration; raw totals; measurement methods; calculation lineage"
    - id: dq_scope_time
      applies_to: "study representativeness"
      requirement: "Disclose site, period, technologies, actual supplier gates, native restrictions, historic source limitations and technical synthesis. Do not transfer a historical specimen energy, alloy maximum or trader acceptance assumption into a current factory default."
      evidence: "site/period metadata; provider check; source applicability statement"
    - id: dq_uncertainty
      applies_to: "emissions and allocation"
      requirement: "Separate actual species evidence from total mass/element closure. Keep detection limits, unresolved identities, unknowns and residual-market sensitivity explicit; no apparent pass from a fitted balance."
      evidence: "speciation report; separate balances; causal and sensitivity records"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Any unknown core relationship remains inconclusive; a structural check is not scientific approval. Use the full descriptions and original gates, not just this table."
    source_ids: []
  - rule_id: val_applicability
    applies_to: "source and reference"
    rule: "Reject an untraceable or mixed-grade source, iron/copper-primary substitute, coating/cladding or post-braze contamination. Require complete qualifiers and the full finished-card restrictions. A core terminal identity or manufacturing evidence gap prevents claiming this boundary complete."
    source_ids:
      - un-cpc3-2025
      - sm-nickel200-2006
      - vdm-nickel200-2022
      - nasa-nickel-sheet-1972
      - nautica-nickel-scrap
  - rule_id: val_units_once
    applies_to: "all inventory rows"
    rule: "Require current property/unit compatibility, declared raw conversions and exactly one calc_once division. Check Q_c first release and non-addition of closing FG. Q_c=0 keeps all actual loads and forbids unit output; H service activity is never production Q_c."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: val_native
    applies_to: "every UUID-bearing row"
    rule: "Enforce each complete native name, form, route, CAS when present, geography, media, properties and comments in the row description. Require independent one-provider applicability. Do not bind the CTUe steel-drum candidate, indoor-air nickel to outdoor release, fixed-composition steel strap to an unverified grade, or a petroleum/PAO oil candidate to a different formulation. Auxiliary unresolved UUIDs retain a specific atomic name and disclosed gap; they do not invalidate independently demonstrated core methodology."
    source_ids:
      - vdm-nickel200-2022
      - nautica-nickel-scrap
  - rule_id: val_balances
    applies_to: "material and relevant elements and species"
    rule: "Require separate full manufacturing, preparation, released-FG and combined physical ledgers plus every packaging identity. Whole mixed streams and their source/composition partitions are non-additive. One balance residual cannot establish two unknown species or a chemical reaction. Keep actual external liquid/product returns and treatment destinations explicit; no missing sink hidden in OTHER. For packaging require measured first nonpurchase receipts in N_ext, exclusive P/N_ext/ER receipt classification, same-component prior outward evidence for ER, disjoint stock states and complete gross S/EO/W. Verify physical V separately from procurement/new-manufacture loads and the actual owner/custody, inherited vector and compatible provider once; reject fabricated P/ER/opening stock or X used to hide a new physical receipt."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: val_burden
    applies_to: "inherited load and allocation"
    rule: "Require complete once-only upstream and WIP/FG exchange vectors, exclusive/subdivided assignment, exchange-specific determining causality and documented common-gate market evidence only for a genuine remainder. Keep separate co-functions and actual treatment burdens; no automatic recovery credit, fixed ratio or missing historical burden."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "One specified nickel-recovery receiving process using these clean single-grade new-sheet offcuts; actual downstream metallurgical route linked separately"
  allowed_use: "Attributional source-traced offcut supply with complete upstream, original manufacture and cohort-service boundaries and one compatible provider per purchased exchange"
  excluded_use: "Mixed/stainless/ash/slag/battery waste, coated or post-braze material, recovered metal equivalence, universal recycled content, avoided-primary credit or legal end-of-waste declaration"
  required_metadata: "All required qualifiers, complete native row descriptions, site/period, source/provider graph, process gates, original Q_c, inherited WIP/FG vectors and declared attributional/recycling convention"
  required_quality_disclosure: "Actual raw coverage, failed/Q0 loads, unknowns, unresolved auxiliary identities, source-time limits, physical/species/packaging residuals and allocation sensitivity; no invented factory defaults"
  update_trigger: "Source heat/grade/form/coating, cutting route, process gate, receiver specification, provider or electricity geography/voltage, actual coolant/cleaner/heat use, stock/recycling convention or material source change"
