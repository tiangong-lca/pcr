    used_for: "N02200 wrought-nickel identity and sheet supply form; distinguish typical composition from Ni-plus-Co limit and other form specifications; no density or composition default"
  - id: "vdm-nickel200-2022"
    type: "handbook"
    reference: "VDM Metals, VDM Nickel 200 and 201, Material Data Sheet1101 Rev02, March2022, pp2–3 and8–9; https://www.vdm-metals.com/fileadmin/user_upload/Downloads/Data_Sheets/Data_Sheet_VDM_Nickel_200_201.pdf"
    used_for: "Actual N02200 product form, table2a versus excluded201 table2b, annealed-state and contamination/tool-protection context; distinguish machining/welding from this dry shear route; no recipe or energy transfer"
  - id: "nasa-nickel-sheet-1972"
    type: "literature"
    reference: "G.A. Malone, R. Stauffis and R. Wood, Bell Aerospace for NASA, Nondestructive Tests of Regenerative Chambers, NASA-CR-120980 / BAC8654-9, July1972, §F printed33 (PDF44) and adjacent figures; https://ntrs.nasa.gov/api/citations/19720024852/downloads/19720024852.pdf"
    used_for: "Primary actual shearing of annealed/pickled Nickel200 sheet; later anneal/EDM/etch/lap/Cu-Inconel bonding are countercontext outside the prior offcut gate; historical case only, no plant performance claim"
  - id: "nautica-nickel-scrap"
    type: "extension_guidance"
    reference: "Nautica Metal Scrap, Nickel & Nickel Alloy Scrap Supply, undated publisher page; https://nauticametalscrap.com/tungsten-specialty-alloys/nickel-scrap"
    used_for: "Fabrication-offcut documents, single-grade segregation, actual solid preparation/packing and negotiated receiver inspection; service-return and turnings countercontext; no universal acceptance composition or recovery factor"
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General Guide for LCA—Detailed Guidance, First edition March2010, §§7.9.2–7.9.3, printed255–272; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctionality only: exclusive/subdivided assignment, determining physical causality per exchange and genuine remainder at contemporaneous common-gate market value; no automatic annex14 recycling formula or fixed share"
  - id: "haco-hslx-shearing"
    type: "handbook"
    reference: "HACO, HSL / HSLX / HSLX-HD Hydraulic guillotine shears, publisher brochure, pp2–4 and6; https://www.haco.com/uploads/files/Sheet-metal/Brochures/Machines/EN/20181016_Brochure_HSLX_ENG.pdf"
    used_for: "Electric-hydraulic motor/pump and oil circuit; blade-gap/material setting and optional scrap handling; architecture only, not Nickel200 capacity, settings, oil chemistry or motor-power defaults"
