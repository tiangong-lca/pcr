      collection_method: "Weigh each real pallet and strap type and actual external receipt; reconcile the full stock/P/N_ext/ER identity in sb_packaging separately, including first independent pool borrowing/leasing. Classify each receipt once from actual acquisition and same-component history, not invoice absence alone; reconcile mutually exclusive stock states and every gross departure. Distinguish measured physical V from procurement/new-manufacture loads; trace the actual owner, custody, cohort and inherited vector/provider once, retaining unverified history as a gap. Track reused packaging without new purchase and each true waste destination"
      unit: "kg"
      frequency: "each receipt/packing/dispatch/return/waste transfer and stock close"
      temporal_coverage: "all WIP/FG and service periods"
      site_scope: "all owned/borrowed/leased/attached/reusable packaging"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated tare and receipt measurements; purchase and whole-consignment records; pool loan/lease and custody records; article inventory; linked prior outward, return and waste tickets; inherited vector and provider-boundary evidence"
