product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.wastes-or-scraps.waste-and-scrap-of-nickel"
  classification_refs: "CPC 3.0:39362; narrower proposed relation; independent acceptance required"
  covered_products: "Clean solid new N02200 annealed/pickled sheet-shearing offcuts for nickel recovery"
  excluded_products: "Ferrous or copper-primary scrap; mixed grades; coated/clad sheet; turnings; powder; ash; slag; sludge; batteries; recovered metal or remelted ingots"
  representative_product: "One certified Nickel 200 source heat, clean sheet-clipping lot at its first agreed recovery-grade release"
  production_route: "Supplied sheet genealogy → original parent-blank shearing → segregated offcut capture → necessary dry sizing/grade inspection → first release → original-cohort packing/storage/delivery to named receiver"
  market_state: "Solid new metallic offcuts, actual composition and size, no free liquid or detachable contamination; pallet/strap tare excluded"
functional_unit:
  what: "Supply the specified single-grade solid sheet offcuts for the named nickel-recovery receiver"
  how_much: "1 kg reference flow"
  how_well: "Documented N02200 source and actual assay, clean uncoated/unclad new solid offcuts meeting the agreed receiver tests and limits"
  how_long_or_cycle: "One uniquely first-released cohort and attributable later services; no assumed downstream recovery yield or life"
  reference_flow_link: "finished"
system_boundary:
  rules:
    - rule_id: sb_identity
      applies_to: "source and finished product"
      rule: "Verify the one N02200 heat, actual independent composition, annealed/pickled sheet state, nickel-primary identity, no coating/cladding and clean solid clipping form. Exclude ferrous scrap, ash/slag and material first contaminated by downstream Cu/Inconel processing. A native name, CAS or classification alone does not prove applicability."
      source_ids:
        - un-cpc3-2025
        - sm-nickel200-2006
        - vdm-nickel200-2022
        - nasa-nickel-sheet-1972
        - nautica-nickel-scrap
    - rule_id: sb_complete_route
      applies_to: "shear and prepare"
      rule: "Include original sheet cutting, segregated offcut capture, actual transport, inspection, necessary dry resizing and first receiver-grade release. Record actual hydraulic oil, tool consumption, protection, extraction, cleanup water, effluent, fines and emissions separately when present. The dry mechanical route does not prescribe cutting coolant, furnace, steam, boiler or reaction gas; if actual coolant, cleaning chemical, fuel, filter medium, heat exchanger water or another exchange exists, add a specific atomic row with actual formulation/state/destination before claiming completeness. Never replace a real manufacturing load with a packing-only purchase or a zero."
      source_ids:
        - vdm-nickel200-2022
        - nasa-nickel-sheet-1972
        - nautica-nickel-scrap
        - haco-hslx-shearing
    - rule_id: sb_upstream_once
      applies_to: "source sheet and parent blank"
      rule: "Represent supplied whole sheet and its refining, casting, rolling, annealing, pickling and transport histories once through the actual provider graph. Maintain the parent blank path and the source-separation gate, with its own exclusive downstream operations. Keep provider-bundled processes and explicit stages mutually exclusive. No presumption of zero historical burden, substitution or avoided primary nickel."
      source_ids:
        - nasa-nickel-sheet-1972
        - jrc-ilcd-2010
    - rule_id: sb_stocks
      applies_to: "all material gates"
      rule: "For every material and relevant element retain opening and closing WIP, inherited per-exchange vectors, actual transfers and internal recirculation. Capture start/stop, idle, cleaning, failed/Q0 lots and real rework rather than dropping them. Keep whole-stream physical V and mutually exclusive source partitions independent from attributed A. Cancel only matched internal transfers with equal state and inherited vector at combined gates."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_fg_services
      applies_to: "released cohorts and receiver gate"
      rule: "Keep first-release Q_c and later services distinct. Closing released FG is already in Q_c; opening FG carries its historical vector and original Q_c. Link storage, handling, repacking, reinspection, actual delivery and any released return to that original cohort. H counts service events only and never replaces Q_c. Combined production/service models cancel internal first-release transfers once; do not count dispatch or a returned previously released lot as new production. Correct an erroneous original release at its original event and reconcile the linked Q_c and FG records together. Distinguish a documentary correction from real return or destruction; never treat the same correction as both a Q_c reversal and an additional physical sink."
      source_ids:
        - nautica-nickel-scrap
        - jrc-ilcd-2010
    - rule_id: sb_packaging
      applies_to: "each pallet and each strap"
      rule: "Independently reconcile O_empty + O_WIP + O_FG + O_reusable + P + N_ext + ER = C_empty + C_WIP + C_FG + C_reusable + S + EO + W. P is actual purchased packaging, including packaging actually acquired within the whole purchased sheet consignment price without a separate invoice. N_ext is actual first external nonpurchase receipt, including an empty pallet first borrowed or leased separately from a third-party pool; it is neither P nor ER. ER requires a documented prior outward event for that same component; EO is outward reusable return. Assign each physical receipt exclusively to P, N_ext or ER by receipt ID and history. S is packaging leaving with gross physical shipments, including repeat dispatch. Opening/closing empty, WIP-attached, FG-attached and reusable states are mutually exclusive for each article at each stock date. Internal reuse cancels and is no purchase, Q or automatic coproduct. Treat a whole purchased pallet once with embodied fasteners; add a separately purchased seal or clip only if actually separate. Preserve any burden already in the sheet provider once while its physical packaging still enters this ledger, without a second upstream purchase on reuse. Record gross physical V separately from procurement and new-manufacture burdens; retain actual owner, custody, inherited exchange vector and compatible provider once for each actual exchange, with missing history explicit rather than assumed zero. The existing specific atomic input may represent the same article form received through N_ext; no duplicate same-item card is required. Any different actual inbound packaging component requires its own atomic row and ledger."
      source_ids:
        - nautica-nickel-scrap
boundary_abstraction:
  declared_starting_condition: "Actual supplied annealed pickled uncoated/unclad N02200 sheet with complete inherited provider history; original blank-shearing operation and all actual utilities/materials"
  starting_condition_role: "Foreground source-sheet receipt and original scrap generation; no zero-burden ready-scrap cut-off"
  product_classification_scope: "Narrow clean new N02200 sheet-offcut subset of CPC3.0:39362; positive mapping acceptance is separate"
  recursive_input_rule: "Compatible purchased scrap is recorded with its true upstream provider and declared recycling convention once; it cannot stand in for the original shear route or erase prior burdens"
  upstream_dataset_requirement: "Match grade, flat form, supplied state, gate, geography, time and allocation convention; include refining/rolling and other source-sheet operations once. Incompatible or missing core burden evidence prevents a quantitative claim, while routine provider matching remains collection work"
  disclosure: "All required qualifiers and full row descriptions; gross physical balances; attribution and inherited WIP/FG vectors; original Q_c services; every packaging ledger; actual species and unresolved identity"
