normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:707b76932f75fe9c6d2f95d9425e259c533e4bd660a7ded7753194619b9b5c7e"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_8829"
      family: "system_boundary"
      span:
        start:
          offset: 8829
          line: 66
          column: 1
        end:
          offset: 13521
          line: 88
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Original holder’s separately collected used corrugated boxes/sheets before recovery-yard sorting; actual received loose/baled state and inherited burden declared |\n| starting_condition_role | Recovered-paper Waste input at collection interface; legal and LCA allocation classifications separately documented |\n| product_classification_scope | Used-corrugated subset of 39241; not every unbleached-kraft form and not 39242/39243/39249 output |\n| recursive_input_rule | Same-category purchased prepared OCC carries its original supply vector; include only uncompleted recovery work. Repacking, internal circulation and external return never create new first-release Q. Do not recur into another full supply dataset and count the same collection/sorting twice. |\n| upstream_dataset_requirement | Require compatible historical paper-material allocation and incoming supply state; utilities, whole hydraulic formulation, packaging, collection transport and external waste treatment enter once. Identify true co-producing stage, recycling loops/quality and market-value boundary under allocation rules; never set history to zero solely because the input is waste. |\n| disclosure | Holder/source state; receipt and receiver contracts; foreground/upstream division; actual legal/market-value state; physical/burden ledgers; Q and service horizon; failures/returns; exclusions and unresolved data |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| sb_complete | production chain | Include collection-point work, every inbound collection leg, receipt, sorting, removal of actual wrong-grade/non-paper objects, electric handling/conveying, hydraulic wire baling, tagging and first release, then cohort gate services. Upstream originals and incomplete work are distinguished; no purchased-finished-bale shortcut. | `jrc-paper-bref-2015`; `bramidan-b30-wide`; `pa-recovered-material-2005` |\n| sb_route | all inventory rows | This dry electric yard assumes no steam/boiler or on-site combustion. Contracted collection uses one compatible transport provider per segment, including its actual fuel/emissions once; add omitted loading/stop effort. If self-operated fuel, heat, chemicals, refrigerants, adsorbents, extra packages or other materials/species occur, add each concrete atomic input/output and protocol with evidence before claiming completeness. Exclusion is not permission to erase real activity. | `jrc-paper-bref-2015`; `bramidan-b30-wide` |\n| sb_physical | production; FG; combined gates | Keep grossV physical crossings independent from A attribution and Q. Production: opening WIP + real external feed/additions = closing WIP + paired first-release transfer Q + actual rejects/samples/emissions and independently evidenced water changes. FG: opening released FG + Q + external product returns = closing FG + gross dispatch H + external return-out + real service losses. Internal Q cancels in the combined gate; qualified closing FG already in Q cannot be added as another production output. Packaging has its own material balances. | `jrc-ilcd-2010` |\n| sb_stock | all lots and exchanges | Preserve per-exchange inherited vectors for opening/closing WIP, raw/auxiliary stocks and original accepted FG. Include failed/zero-output/start-stop/idle/cleanup and real rework loads. Attribute a later service to its original Q cohort, including opening historical FG; do not divide by current shipments. External returns reverse original delivery attribution once and retain their original burden plus actual incremental work. At a declared cutoff retain unobserved future services as an explicit limit, never a zero claim. | `jrc-ilcd-2010` |\n| sb_quality | finished_occ | Release only the declared OCC product after receiver-agreed grade, unwanted-material, moisture and bale-condition checks, with conditional acceptance resolved. Physical mass, commercial deductions and payment are separate. The CEPI guidance illustrates receiver-agreed specifications; no universal 10% moisture, bale weight, percentage tolerance or EN certification is imposed here. | `cepi-recovered-paper-quality` |\n| sb_single_outlet | emissions; waste treatment | At a mixed outlet use either the actual outlet total or reconciled non-overlapping source partitions, never both. Whole transferred waste/effluent has one receiving provider; contained species stay in its composition account and are not also elementary emissions. Actual final elementary releases are separate species/media with control and source evidence; no emissions factor comes from a UUID. | `jrc-ilcd-2010` |\n\n"
      headings:
        - kind: "heading"
          span:
            start:
              offset: 334
              line: 10
              column: 1
            end:
              offset: 394
              line: 10
              column: 61
