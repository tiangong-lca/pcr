allocation_rules:
  - rule_id: al_order
    applies_to: "each shared exchange"
    rule: "This is attributional material supply where allocation is required, not a consequential substitution model. First assign dedicated measured work and subdivide real or virtual operations. Then test an exchange-specific determining physical causal relationship to each function. Only the truly inseparable residual uses contemporaneous market values at the same actual process gate and material state. Do not arbitrarily choose mass/economics, impose a fixed fraction, or infer causal allocation from an industrial process diagram. Retain drivers and sensitivity."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_history
    applies_to: "received_occ; historical paper material"
    rule: "Record actual value at origin independently from legal/native Waste status. For valuable OCC at origin apply the ILCD attributional recycling treatment: identify the true co-producing stage with technically comparable recovered material, retain relevant primary/recycling/final-loss inventories and quality/loop assumptions, and allocate under al_order. Do not attach every historic packaging-use service merely because the box existed, or drop relevant paper manufacture by calling it waste. Use a compatible independently documented upstream vector; if absent, disclose the missing historical vector and withhold a complete cradle-to-gate result. No universal recycling rate or infinite-loop factor is supplied."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_negative_origin
    applies_to: "negative-value incoming material"
    rule: "If a real treatment fee/negative-value state occurs, locate the actual process where valuable secondary goods first arise, preserving physical/material quality and comparable true co-producing history. ILCD Annex14 distinguishes preceding treatment responsibility from the joint boundary process. Retain preceding treatment in its responsible system and apply the same subdivision/causality/residual-value order at the boundary process, including the absolute negative gate value only for the remaining service/value calculation. Do not charge all historic treatment to OCC or silently give all collection a zero burden. Zero/ambiguous values need documented review; uncertainty is not a default cut-off."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_outputs
    applies_to: "other separated material; collection service"
    rule: "Other separately saleable paper grades, PP, steel or other real outputs require their own measured quantities/state, destination and genuine co-function test. Exclusive sorting/baling work is assigned to them; only shared residual is allocated under al_order. Physical rejects remain in grossV even when their attributed load differs. Recycling potential, waste diversion and future avoided virgin paper/steel/energy are not automatic credits. Waste treatment and material supply must not use incompatible service/product providers for one transferred load."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_stock
    applies_to: "all inventory rows"
    rule: "Keep physical V, attributed exchange vectors A and original first-release Q separate. Carry each lot’s WIP/FG burdens through production and gate services, reversing original delivery only once on return; rework contributes only truly new F. X may remove only an exact documented same-side duplicate already in OTHER, never an independent historic burden, real export or material loss. No stock-allocation fraction changes physical V or turns service dispatch into Q."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_receipt
      process_id: "p_recovery"
      flow_role: "received_occ"
      record_type: "weighing"
      raw_fields: "holder; lot; origin grade; gross mass; actual tare; composition fractions; moisture; input value and fee; legal state; collection-point work; upstream vector"
      collection_method: "Calibrated collection/receipt scales and representative unpacked sorting/moisture samples; reconcile holder and yard tickets with losses and external packaging separately. Retain whole consignment and non-additive component subledger. Collect and sum unnormalized raw records by row/stage/cohort. The per-reference aggregation label is only the final report basis; conversion and attribution precede the single division in section 8."
      unit: "kg"
      frequency: "each consignment"
      temporal_coverage: "Complete declared production and cohort service horizon including failures and no-output intervals"
      site_scope: "Named holder/yard plus each contracted interface and original cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; tickets; signed lot logs; receiver/specification evidence; uncertainty; original units; gap and absence evidence"
    - protocol_id: cp_release
      process_id: "p_recovery"
      flow_role: "finished_occ"
      record_type: "acceptance"
      raw_fields: "unique first-release id; lot; prior acceptance flag; gross bale mass; measured wire/tag tare; net as-received OCC; moisture/dry solids; contamination; bale integrity; receiver limits; acceptance decision; Q"
      collection_method: "Weigh on calibrated scales after actual sorting/baling; check grade, bale condition, moisture and unwanted materials against recorded receiver agreement; resolve conditional acceptance before Q. Moisture sampling/oven or calibrated instrument method retains sample basis; no universal wet-weight discount. Collect and sum unnormalized raw records by row/stage/cohort. The per-reference aggregation label is only the final report basis; conversion and attribution precede the single division in section 8."
      unit: "kg"
      frequency: "each first-release lot"
