      record_type: "article_ledger"
      raw_fields: "one article specification; original unit; measured article mass; opening empty/attached WIP/attached FG/reusable; P_recovery; P_service; ER; I; closing empty/attached WIP/attached FG/reusable; S on gross H; EO; W; original vector; N_recovery; unique article receipt event id; article/lot identity; actual source and supply state; cohort; gate; phase; period; independently measured current wet mass; inherited exchange vector and one burden owner; ER prior outward/receipt links; same-side OTHER/X proof"
      collection_method: "Separate full ledger for steel wire and paper tag; count and weigh actual configuration. P partitions are disjoint, ER is external return received, I internal reuse, S with gross dispatch, EO external return-out, W actual waste. Transfer attached packaging at Q between gates with paired records. Retain prior stock and returned-article vectors; no repurchase or Q credit. Apply the same ledger to every actual added package, including reusable articles. This protocol is the recovery phase partition only; reconcile its paired transfer with the other phase. Collect and sum unnormalized raw records by row/stage/cohort. The per-reference aggregation label is only the final report basis; conversion and attribution precede the single division in section 8. For each actual first external nonpurchase inlet in this phase, create a separate atomic input event row wire_n_recovery_<event_id> for the single steel baling-wire article (Baling wire 56ddb6db-1bf1-4c3c-b3db-bb00063774a8), or tag_n_recovery_<event_id> for the single uncoated paper tie-on tag (UUID unresolved as declared); retain each article's existing native restrictions. Each uses Mass 93a60a56-a3c8-11da-a746-0800200b9a66 / kg, actual process p_recovery, source/cohort/gate/phase/period and one burden owner. Its complete Amount has expression = independently measured unnormalized current-wet kg under cp_packaging_recovery followed by raw_units, attributed_vector and the sole unit_result; value_mode calculated_value; specificity site_specific; basis per 1 kg reference flow / reference_flow; evidence calculated_from_collection with collection_protocol_id cp_packaging_recovery and source_ids cepi-recovered-paper-quality and jrc-ilcd-2010; no invented range. Before dataset use, keep each real event's distinct row/event ID, concrete identity and complete Amount, resolving the tag identity or disclosing incompleteness. Add any other actual material as its own concrete atomic event. Record N_recovery once at the actual external interface, not again on internal transfer. N is not P, traced same-article ER, or internal reuse I; an article previously used elsewhere is still N on first nonpurchase entry. Paid/bundled acquisition already in P is not N. Measure wet mass independently, not a balancing residual; retain inherited history without a second manufacture/purchase burden or assumed zero. Closing retention remains in the full article stock account."
      unit: "kg"
      frequency: "each movement and stocktake"
      temporal_coverage: "Complete declared production and cohort service horizon including failures and no-output intervals"
      site_scope: "Named holder/yard plus each contracted interface and original cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; tickets; signed lot logs; receiver/specification evidence; uncertainty; original units; gap and absence evidence"
    - protocol_id: cp_packaging_gate
      process_id: "p_gate"
      flow_role: "each wire or tag leg"
      record_type: "article_ledger"
      raw_fields: "one article specification; original unit; measured article mass; opening empty/attached WIP/attached FG/reusable; P_recovery; P_service; ER; I; closing empty/attached WIP/attached FG/reusable; S on gross H; EO; W; original vector; N_gate; unique article receipt event id; article/lot identity; actual source and supply state; cohort; gate; phase; period; independently measured current wet mass; inherited exchange vector and one burden owner; ER prior outward/receipt links; same-side OTHER/X proof"
      collection_method: "Separate full ledger for steel wire and paper tag; count and weigh actual configuration. P partitions are disjoint, ER is external return received, I internal reuse, S with gross dispatch, EO external return-out, W actual waste. Transfer attached packaging at Q between gates with paired records. Retain prior stock and returned-article vectors; no repurchase or Q credit. Apply the same ledger to every actual added package, including reusable articles. This protocol is the gate phase partition only; reconcile its paired transfer with the other phase. Collect and sum unnormalized raw records by row/stage/cohort. The per-reference aggregation label is only the final report basis; conversion and attribution precede the single division in section 8. For each actual first external nonpurchase inlet in this phase, create a separate atomic input event row wire_n_gate_<event_id> for the single steel baling-wire article (Baling wire 56ddb6db-1bf1-4c3c-b3db-bb00063774a8), or tag_n_gate_<event_id> for the single uncoated paper tie-on tag (UUID unresolved as declared); retain each article's existing native restrictions. Each uses Mass 93a60a56-a3c8-11da-a746-0800200b9a66 / kg, actual process p_gate, source/cohort/gate/phase/period and one burden owner. Its complete Amount has expression = independently measured unnormalized current-wet kg under cp_packaging_gate followed by raw_units, attributed_vector and the sole unit_result; value_mode calculated_value; specificity site_specific; basis per 1 kg reference flow / reference_flow; evidence calculated_from_collection with collection_protocol_id cp_packaging_gate and source_ids cepi-recovered-paper-quality and jrc-ilcd-2010; no invented range. Before dataset use, keep each real event's distinct row/event ID, concrete identity and complete Amount, resolving the tag identity or disclosing incompleteness. Add any other actual material as its own concrete atomic event. Record N_gate once at the actual external interface, not again on internal transfer. N is not P, traced same-article ER, or internal reuse I; an article previously used elsewhere is still N on first nonpurchase entry. Paid/bundled acquisition already in P is not N. Measure wet mass independently, not a balancing residual; retain inherited history without a second manufacture/purchase burden or assumed zero. Closing retention remains in the full article stock account."
      unit: "kg"
      frequency: "each movement and stocktake"
      temporal_coverage: "Complete declared production and cohort service horizon including failures and no-output intervals"
      site_scope: "Named holder/yard plus each contracted interface and original cohort"
      aggregation_rule: "per 1 kg reference flow"
