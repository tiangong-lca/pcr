  calculation_rules:
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Preserve original readings; convert each raw numerator once to the native row unit before attribution. MJ = 3.6 * kWh; m3 = 0.001 * L; transport t*km = sum(actual gross transported kg * actual leg km / 1000). Density-based conversion uses independent measured density for that substance/state; only real rates are integrated."
      inputs:
        - "raw readings"
        - "native units"
        - "measured density"
        - cp_utilities_recovery
        - cp_utilities_gate
        - cp_transport
        - cp_oil
      output: "converted raw row totals"
      source_ids:
        - jrc-ilcd-2010
    - id: gross_balance
      applies_to: "all inventory rows"
      rule: "For each material at each physical gate: opening stock + external receipts + paired internal receipts = closing stock + actual external outflows + paired internal transfers + independently evidenced transformations. Production Q and FG receipt Q cancel only at combined gate. Packaging, wet mass, dry solids, water and relevant elements each reconcile independently; never apply allocation fractions to grossV."
      inputs:
        - grossV
        - cp_receipt
        - cp_ledger_recovery
        - cp_ledger_gate
        - cp_water_balance_recovery
        - cp_water_balance_gate
      output: "reconciled physical gates"
      source_ids:
        - jrc-ilcd-2010
    - id: first_release
      applies_to: "finished_occ"
      rule: "Q = sum newly first-released net as-received OCC under cp_release, after actual packaging tare and separated contamination/free-liquid exclusion. Newly qualified closing FG is already included once. Exclude reinspection, prior released returns and H gross dispatch. If Q = 0 retain real loads and no unit result."
      inputs:
        - cp_release
        - "unique original acceptance register"
      output: "Q"
      source_ids:
        - cepi-recovered-paper-quality
        - jrc-ilcd-2010
    - id: attributed_vector
      applies_to: "all inventory rows"
      rule: "Construct A_j from the legitimately attributed converted raw exchange load, applicable upstream history, inherited opening WIP and cohort services. Deduct closing WIP or unused-stock vectors only when already inside that same numerator; do not deduct stocks again from already-net consumption. Preserve historical FG original vector/Qc; returns reverse original delivery once and add only actual new work F. Subtract X only for an exact same-side duplicate already in OTHER. Carry physical V_j separately with no allocation multiplier."
      inputs:
        - "converted raw row totals"
        - cp_ledger_recovery
        - cp_ledger_gate
        - "origin allocation evidence"
        - F
        - X
        - OTHER
      output: "A_j; V_j"
      source_ids:
        - jrc-ilcd-2010
    - id: unit_result
      applies_to: "all inventory rows"
      rule: "For Q > 0 the sole unit calculation is x_j = A_j / Q. Report v_j = V_j / Q separately as a physical companion, not an additive attributed exchange. Historical-cohort services use original Qc instead of Q and append that same quotient once, never shipment H. The reference output itself is exactly 1 kg. Cards and protocol aggregation reference this one quotient and never divide it again."
      inputs:
        - A_j
        - V_j
        - Q
        - Qc
        - cp_release
        - cp_ledger_recovery
        - cp_ledger_gate
      output: "x_j; v_j"
      source_ids:
        - jrc-ilcd-2010
    - id: packaging_balance
      applies_to: "wire_purchase; tag_purchase; wire_service_purchase; tag_service_purchase; wire_external_received; tag_external_received; wire_shipped; tag_shipped; wire_external_out; tag_external_out; wire_production_waste; tag_production_waste; wire_service_waste; tag_service_waste; wire_n_recovery_<event_id>; tag_n_recovery_<event_id>; wire_n_gate_<event_id>; tag_n_gate_<event_id>"
      rule: "For each one article: opening empty + opening attached WIP + opening attached FG + opening reusable + P + N + ER = closing empty + closing attached WIP + closing attached FG + closing reusable + S + EO + W. P = disjoint P_recovery + P_service; ER external return received; S follows all gross dispatch H; EO external return-out; W actual waste. I internal reuse cancels, as does paired attached packaging at Q. No leg is new OCC Q, repurchase or automatic coproduct. N = disjoint N_recovery + N_gate, measured current-wet first external nonpurchase receipts of each article, whether new or previously used elsewhere; P includes actual paid/bundled procurement once and is disjoint from N. ER requires the same article/lot's actual prior outward crossing and receipt; I remains internal reuse only. Instantiate each steel-wire/tag N event with its own row/event ID and complete Amount under the actual phase protocol. Carry its physical inlet and applicable inherited vector once; no zero-history assumption, second manufacture or credit. Preserve wet opening/closing empty, attached WIP/FG and reusable stocks, including receipts still closing. OTHER/X removes only an evidenced same-side exact duplicate where that same article mass is already included; tare observation, closing retention, an opposite flow or mere card presence never cancels the real inlet. Reconcile whole OCC/packaging component accounts as nonadditive views with one burden owner."
      inputs:
        - cp_packaging_recovery
        - cp_packaging_gate
        - P
        - N
        - ER
        - I
        - S
        - EO
        - W
        - H
        - Q
      output: "one reconciled ledger per article"
      source_ids:
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all UUID-bearing rows"
      requirement: "Verify actual product/waste/elementary type, all name facets, synonyms/comments, CAS where relevant, route/form/geography/media, full properties and exact reference-property/unit-group chain. Generic identity does not validate a provider. Keep every native restriction in consumable row context."
      evidence: "Full direct records; exact unit references; supply-state and provider documents"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Complete actual materials, utility, packaging, waste and elementary exchanges; conditionally absent rows need evidence. No hidden other/zero bucket. Auxiliary UUID/provider gaps remain precise named gaps; a missing core identity or actual endpoint/method evidence blocks completeness."
      evidence: "Stage walkdown; contracts; stock and destination reconciliation; explicit gap register"
    - id: dq_sampling
      applies_to: "finished_occ; received_occ"
      requirement: "Actual receiver-spec sampling, contamination and moisture evidence must represent the lot, preserve sample basis and uncertainty, and distinguish visual acceptance from quantitative assay. No copied universal threshold/yield from a case or old grade presentation."
      evidence: "Receiver agreement; random sample and moisture records; calibrated scale/instrument"
    - id: dq_history
      applies_to: "cp_ledger_recovery; cp_ledger_gate; attribution"
      requirement: "Preserve actual original units and all failed/Q0/idle/cleanup intervals, every opening/closing WIP exchange vector and historical FG/Qc. Show allocation sensitivity, value gate/state and missing origin vector rather than declaring a complete product footprint."
      evidence: "Original lot ledgers; origin chain model; reconciled physical/burden stock tables"
    - id: dq_source
      applies_to: "all sources"
      requirement: "UN establishes classification scope; JRC/PA establish operations, not universal quantities; CEPI is industry guidance, not the complete licensed EN standard; ILCD supports attributional allocation only under its conditions. Multiple extracts of one publication are one source."
      evidence: "Complete source context and actual foreground evidence"
validation_rules:
  - rule_id: vr_scope
    applies_to: "finished_occ"
    rule: "Reject new paper/pulp, mixed unsorted product, bleached chemical-pulp paper or mechanical-pulp newspaper substituted as OCC. Verify product state, legal/receiver gate and all qualifiers before methodological use."
    source_ids:
      - un-cpc-39241
      - cepi-recovered-paper-quality
  - rule_id: vr_denominator
    applies_to: "all inventory rows"
    rule: "Both languages use 1 kg first-release Q and finished_occ. Require raw records without pre-division, legitimate A, single unit_result A/Q, Q0 load retention and no closing-FG/shipment/reinspection double production. Retain original Qc for historical services and complete return reversals."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: vr_balances
    applies_to: "production; FG; combined; packaging"
    rule: "Independently close gross physical mass, water, relevant elements and each article’s complete article ledger at all gates; cancel internal Q and attached-pack transfers only at combined gate. Preserve each exchange stock vector, failed activity and real incremental rework; do not use a residual to invent several species or unknown losses. Require disjoint P/N/ER/I evidence and all real N inlet event rows, including N still in closing stocks. Check per-article wet mass, source/cohort/gate/phase/period, complete Amount, inherited vector and one burden owner; require actual same-article prior-outward/receipt links for ER. Reject residual N, untraced first receipt called ER, duplicated paid/bundled P, repurchase/zero-history assumptions and unsupported X deductions."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: vr_sources
    applies_to: "each material; utility; species"
    rule: "Check complete native identity facets and precise units, original source applicability and actual one-provider interface. Missing auxiliary UUID is explicit; no incompatible UUID may disguise it. No duplicated mixed-outlet partitions, assumed physical/economic allocation, automatic recovery credit or discarded historical paper burden. Unresolved actual endpoint/origin method prevents a complete dataset claim."
    source_ids:
      - jrc-paper-bref-2015
      - bramidan-b30-wide
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Receiver-compatible baled OCC supply input to papermaking stock preparation; separate actual downstream transport and pulping"
  allowed_use: "Attributional material-supply modelling with declared history, actual receiver grade, input state, collection boundary and measured foreground data"
  excluded_use: "Automatic all-39241 coverage; waste-treatment service substitution; avoided virgin-paper credit; new board/pulp/bleached/newsprint/mixed-paper supply; certified EN compliance"
  required_metadata: "All reference qualifiers; collection/receiver interface; native/provider limitations; Q cohort and cutoff; upstream origin allocation; individual stock and packaging ledgers"
  required_quality_disclosure: "Measured versus missing values; sampling uncertainty; allocation sensitivity; source age/geography; auxiliary identity/provider gaps; unobserved service horizon; incomplete historical vector if any"
  update_trigger: "Changed feed grade/collection stream; treatment or utility route; receiver limits; native identity/provider state; origin allocation; sampling; packaging; stock/return method"
