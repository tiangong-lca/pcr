system_boundary:
  rules:
    - rule_id: sb_complete
      applies_to: "production chain"
      rule: "Include collection-point work, every inbound collection leg, receipt, sorting, removal of actual wrong-grade/non-paper objects, electric handling/conveying, hydraulic wire baling, tagging and first release, then cohort gate services. Upstream originals and incomplete work are distinguished; no purchased-finished-bale shortcut."
      source_ids:
        - jrc-paper-bref-2015
        - bramidan-b30-wide
        - pa-recovered-material-2005
    - rule_id: sb_route
      applies_to: "all inventory rows"
      rule: "This dry electric yard assumes no steam/boiler or on-site combustion. Contracted collection uses one compatible transport provider per segment, including its actual fuel/emissions once; add omitted loading/stop effort. If self-operated fuel, heat, chemicals, refrigerants, adsorbents, extra packages or other materials/species occur, add each concrete atomic input/output and protocol with evidence before claiming completeness. Exclusion is not permission to erase real activity."
      source_ids:
        - jrc-paper-bref-2015
        - bramidan-b30-wide
    - rule_id: sb_physical
      applies_to: "production; FG; combined gates"
      rule: "Keep grossV physical crossings independent from A attribution and Q. Production: opening WIP + real external feed/additions = closing WIP + paired first-release transfer Q + actual rejects/samples/emissions and independently evidenced water changes. FG: opening released FG + Q + external product returns = closing FG + gross dispatch H + external return-out + real service losses. Internal Q cancels in the combined gate; qualified closing FG already in Q cannot be added as another production output. Packaging has its own material balances."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_stock
      applies_to: "all lots and exchanges"
      rule: "Preserve per-exchange inherited vectors for opening/closing WIP, raw/auxiliary stocks and original accepted FG. Include failed/zero-output/start-stop/idle/cleanup and real rework loads. Attribute a later service to its original Q cohort, including opening historical FG; do not divide by current shipments. External returns reverse original delivery attribution once and retain their original burden plus actual incremental work. At a declared cutoff retain unobserved future services as an explicit limit, never a zero claim."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_quality
      applies_to: "finished_occ"
      rule: "Release only the declared OCC product after receiver-agreed grade, unwanted-material, moisture and bale-condition checks, with conditional acceptance resolved. Physical mass, commercial deductions and payment are separate. The CEPI guidance illustrates receiver-agreed specifications; no universal 10% moisture, bale weight, percentage tolerance or EN certification is imposed here."
      source_ids:
        - cepi-recovered-paper-quality
    - rule_id: sb_single_outlet
      applies_to: "emissions; waste treatment"
      rule: "At a mixed outlet use either the actual outlet total or reconciled non-overlapping source partitions, never both. Whole transferred waste/effluent has one receiving provider; contained species stay in its composition account and are not also elementary emissions. Actual final elementary releases are separate species/media with control and source evidence; no emissions factor comes from a UUID."
      source_ids:
        - jrc-ilcd-2010
boundary_abstraction:
  declared_starting_condition: "Original holder’s separately collected used corrugated boxes/sheets before recovery-yard sorting; actual received loose/baled state and inherited burden declared"
  starting_condition_role: "Recovered-paper Waste input at collection interface; legal and LCA allocation classifications separately documented"
  product_classification_scope: "Used-corrugated subset of 39241; not every unbleached-kraft form and not 39242/39243/39249 output"
  recursive_input_rule: "Same-category purchased prepared OCC carries its original supply vector; include only uncompleted recovery work. Repacking, internal circulation and external return never create new first-release Q. Do not recur into another full supply dataset and count the same collection/sorting twice."
  upstream_dataset_requirement: "Require compatible historical paper-material allocation and incoming supply state; utilities, whole hydraulic formulation, packaging, collection transport and external waste treatment enter once. Identify true co-producing stage, recycling loops/quality and market-value boundary under allocation rules; never set history to zero solely because the input is waste."
  disclosure: "Holder/source state; receipt and receiver contracts; foreground/upstream division; actual legal/market-value state; physical/burden ledgers; Q and service horizon; failures/returns; exclusions and unresolved data"
