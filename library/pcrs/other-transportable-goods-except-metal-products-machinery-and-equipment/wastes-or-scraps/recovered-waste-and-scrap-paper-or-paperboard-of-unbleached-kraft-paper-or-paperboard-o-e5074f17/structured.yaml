measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is newly first-released net as-received OCC under cp_release after final receiver-spec checks. Subtract measured wire/tag tare and separated liquid/contamination. Retain measured dry solids and moisture; invoice moisture deductions are monetary, not new physical mass. No Q for reinspection/rebaling."
  - id: raw_before_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Original physical property"
      uuid: ""
    required_unit: "original unit"
    rule: "Collect raw unnormalized records. Convert each numerator to its native row unit once before attribution. Integrated volume is a total; integrate only real rates. Use independent substance-specific density at its actual state, never a secondary flow coefficient. The only division by Q is unit_result."
  - id: electric_energy
    applies_to: "recovery_electricity; gate_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Use 1 kWh = 3.6 MJ once. This is CN user-side grid AC below 1 kV, not on-site fuel; retain charging losses once."
  - id: oil_volume
    applies_to: "hydraulic_oil"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Preserve whole-formulation supplied volume. Use 1 L = 0.001 m3 once; independently measure the actual formulation density for kg physical reconciliation, with temperature/configuration and no invented value."
  - id: physical_water_species
    applies_to: "physical balances"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Independently reconcile wet mass, dry solids, free water and relevant measured C/other elements at production, FG and combined gates. No reaction or structural-water transformation is asserted. Separate real evaporation, free liquid and moisture in each output; do not solve two unknowns with one residual. COD/TOC/VOC are indicators, not named species mass."
  - id: pack_mass
    applies_to: "each packaging article"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh each actual wire and tag article separately. Counts require measured article mass for that configuration; no assumed kg/item. Exclude all packaging from Q and net OCC; follow attached packaging through gross physical dispatch and all WIP/FG stocks."
