allocation_rules:
  - rule_id: allocation_scope
    applies_to: "attributional system"
    rule: "Apply the ILCD attributional multifunctional-process procedure within the declared goal; it is not unrestricted choice between physical/economic allocation or substitution. First separate dedicated lees and wine-only steps and attempt real or virtual subdivision. Assign dedicated lees collection/release/handling directly to lees; wine-exclusive finishing after the real separation remains with wine. Record a quantitative reason when a theoretically possible subdivision cannot be obtained."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_causality
    applies_to: "genuine residual shared grape/wine operations"
    rule: "For each still-shared exchange identify and quantify the determining physical causal relationship to the actual co-functions at the real separation, including its operating constraint. Physical embodiment and service occupancy may differ by exchange; a mass, dry-matter, ethanol, energy or wine-volume ratio alone is not proof of causality. Share only the environmental numerator of the genuinely common operations and reconcile all co-function shares to the unsplit inventory. Never scale the physical wet lees, wine, waste or emission amounts to make the balance close."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "only exchanges lacking determining physical causality"
    rule: "Justify why no determining physical causal relationship remains before applying the general market-value criterion to the residual common process. Use actual contemporaneous amounts and market values of the actual co-functions at the same separation gate in their real wet, bulk, unrefined condition; remove later wine finishing, storage, transport and purification value. A price of refined tartaric acid, ethanol or packaged wine cannot stand in for wet lees. Document zero/negative/missing prices, actual waste/disposal service status, missing data and sensitivity instead of inventing a ratio or treating free collection as automatic zero burden."
    source_ids:
      - ilcd-allocation-2010
      - lees-removal-service
      - bertolino-raw-materials
  - rule_id: allocation_handover
    applies_to: "supplier receiver and returned lots"
    rule: "Accept the supplier-allocated upstream vector once only when its boundary, lot, co-functions, physical amounts, exclusive operations and method are documented. Do not allocate that upstream vector again at the receiver or treat a carbon footprint as a full inventory. If the supplying record is unallocated, obtain its common inventory and make one transparent allocation under the preceding hierarchy. Keep inherited opening WIP/FG vectors attached to their lots; a returned/retested lot is not new production. Carry original delivery burden once, reverse the real paired delivery where relevant and add only real incremental return/rework service F. X can remove only a proven same-side duplicate in OTHER; new water/material/energy is never a deduction."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_no_credit
    applies_to: "all product and waste fates"
    rule: "Keep real product/co-product status separate from disposal Waste status, receiver treatment services and native Product identity. Neither the CPC waste heading nor a positive price decides the LCA allocation. Assign treatment and dedicated handover once to the responsible owner. Grant no default recycling, alcohol, acid, fuel or displaced-product credit; downstream manufacture is outside this wet-feedstock method."
    source_ids:
      - ilcd-allocation-2010
      - bertolino-raw-materials
dataset_production:
  collection_protocols:
    - protocol_id: cp_lots
      process_id: "collection_release"
      flow_role: "whole wet feed and WIP"
      record_type: "raw_record"
      raw_fields: "lot; winery; grape origin; red route; separation vessel; time; first-rack proof; gross/fine status; actual fining/filter aids; wet mass; tare; opening WIP; closing WIP; inherited vector; transfer pair"
      collection_method: "Use calibrated net weighing and reconciled supplier separation records. Sample the actual mixed-within-lot sediment representatively; do not blend lots to meet specifications."
      unit: "kg"
      frequency: "each lot/event and meter interval"
      temporal_coverage: "complete H plus adjacent stock/release history including zero output"
      site_scope: "actual supplier separation and dedicated collection/release/FG service gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original receipts and logs; calibration; representative sampling; paired custody; independent balance; uncertainty and explicit unresolved needs"
    - protocol_id: cp_release
      process_id: "collection_release"
      flow_role: "first overall qualified wet lot release"
      record_type: "raw_record"
      raw_fields: "lot; net wet mass; first-release date; acceptance tests; receiver; intended use; legal status; release flag history; failed lots; rework; repeat test; qualified closing FG; Q"
      collection_method: "Weigh or use traceable calibrated tank/load-cell mass for each completed qualifying lot at the stated supply-quality gate; retain acceptance decision and exclude packaging. Compute Q only in first_release_q."
      unit: "kg"
      frequency: "each lot/event and meter interval"
      temporal_coverage: "complete H plus adjacent stock/release history including zero output"
      site_scope: "actual supplier separation and dedicated collection/release/FG service gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original receipts and logs; calibration; representative sampling; paired custody; independent balance; uncertainty and explicit unresolved needs"
    - protocol_id: cp_fg
