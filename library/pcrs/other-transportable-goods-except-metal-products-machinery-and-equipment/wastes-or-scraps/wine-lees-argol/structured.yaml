system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "entire method"
      rule: "Use already separated wet first-rack gross red ferment lees as the foreground starting condition. Require the real upstream grape/wine route and one burden handover through the actual separation, including shared earlier operations and any exclusive lees collection performed by the supplier. Exclude wine-only operations after separation from the lees burden. Do not buy grapes or wine again or reconstruct cultivation/fermentation within the receiving process."
      source_ids:
        - awri-practices-2019
        - lbnl-best-winery-2005
        - ilcd-allocation-2010
    - rule_id: boundary_native
      applies_to: "every consumer of wine lees identity"
      rule: "The generic native Product family Wine lees, argol is broader than this route. Its manufactured finished-product/production-mix-at-plant fields and wine-lees/argol comments establish a product family, not wetness, assay, receiver or process burden. Bind only the whole wet unprocessed first-rack gross red-wine sediment in scope, never argol crystals, pure acid/salt/ethanol, pomace, fine/fining/filter sludge or extracted residue. Carry these restrictions and actual supplier state on every input/output using the UUID, including internal release and returns. Product identity does not establish provider compatibility or waste status."
      source_ids:
        - awri-practices-2019
        - bertolino-raw-materials
        - lbnl-best-winery-2005
    - rule_id: boundary_complete
      applies_to: "all actual operations in H"
      rule: "Include dedicated pumping, containment, representative sampling, necessary actual extraneous-object removal, storage, release, loading, cleaning, maintenance replacements, failed lots, leakage, start/stop, idle and rework. Selected route adds no wine recovery, distillation, acid extraction/crystallization, drying, neutralization or anaerobic wastewater digestion. If any occurs, retain its real inputs and outputs and flag the changed endpoint for scope review; an exclusion is not permission to delete actual activity. Add a specific atomic card and protocol for every actual unlisted fuel, cleaning formulation, aid, package, rejected object or species before claiming completeness."
      source_ids:
        - lbnl-best-winery-2005
        - awri-practices-2019
        - bertolino-raw-materials
    - rule_id: boundary_ledgers
      applies_to: "production FG and combined physical gates"
      rule: "Keep grossV, inherited environmental vectors A, real joint-process shares and Q distinct. Physical grossV records every real crossing without economic, service or stock-attribution fractions. Production balances opening WIP plus real external feeds and physical additions against closing WIP, first-release transfer Q and all actual waste/emission/sample outputs, with independently evidenced reaction and water-state changes. The FG/service balance uses opening already released FG plus Q plus actual external returns against closing FG, gross dispatch, external returns-out and all service losses. Q is the same paired internal transfer and cancels in the combined gate; qualified closing FG already included in Q is not another production output. Retain physical and burden stocks separately by lot; stock attribution changes A, never physical quantities."
      source_ids:
        - ilcd-allocation-2010
        - lbnl-best-winery-2005
    - rule_id: boundary_packaging
      applies_to: "bulk supply and any actual transferable package"
      rule: "Declared supply is bulk tank/tanker; a tanker or fixed storage vessel is transport/capital equipment, not packaging consumed per kg. Do not assume a 275-gallon container material from the collection-service page. If an actual transferable package is used, identify and inventory every component separately with opening empty plus attached WIP/FG plus reusable stock plus purchases plus external returns received equal to closing stock plus components leaving with gross physical shipments plus external returns sent plus waste. Paired internal reuse cancels; package mass is excluded from Q and does not become another purchase or automatic co-product."
      source_ids:
        - lees-removal-service
        - ilcd-allocation-2010
    - rule_id: boundary_emissions
      applies_to: "wet chemistry and every fate"
      rule: "Keep water, ethanol, dry solids and any measured tartrate/yeast fractions as non-additive bridges to whole lees. Independently measure true reaction species, free/reaction/structural water and physical state. Never fit two unknown losses to one mass residual; do not assume ongoing fermentation, all ethanol evaporation, complete conversion or a fixed biogenic CO2 rate. COD/TOC/VOC/total nitrogen or dust indicators are not single molecules. Separate collected spills and washwater from actual environmental discharges; a treatment owner receives each waste once, and only actual releases under foreground control are elementary exchanges."
      source_ids:
        - lbnl-best-winery-2005
        - ilcd-allocation-2010
