  calculation_rules:
    - id: first_release_q
      applies_to: "sole production release gate"
      rule: "Q = sum of newly first-released whole net wet lot masses in H; count each lot once from historical flags, include qualified closing FG and exclude opening already released FG, packaging and retests."
      inputs:
        - cp_release
        - cp_lots
        - cp_fg
      output: "Q"
      source_ids:
        - bertolino-raw-materials
        - awri-practices-2019
        - ilcd-allocation-2010
    - id: physical_gate_balance
      applies_to: "manufacture FG and combined gate"
      rule: "Reconcile each whole-stream grossV at its actual physical gate: opening stock + actual inputs + actual external returns = closing stock + actual outputs + actual external returns-out, with independently evidenced reaction and water-state terms. Production includes Q as output; FG includes the same paired Q as input; cancel Q only in the combined gate. Keep each unqualified loss and all zero-output activity. Never multiply physical amounts by allocation or burden-stock shares."
      inputs:
        - cp_lots
        - cp_release
        - cp_fg
        - cp_utilities_production
        - cp_utilities_service
        - cp_consumables_production
        - cp_consumables_service
        - cp_waste_production
        - cp_waste_service
        - cp_species_production
        - cp_species_service
      output: "grossV"
      source_ids:
        - ilcd-allocation-2010
        - lbnl-best-winery-2005
    - id: burden_rollforward
      applies_to: "each lot and environmental exchange j"
      rule: "Roll A separately from physical stock: inherited opening-WIP vector + actual incoming supplier vector + real new dedicated burden + correctly allocated true common burden = vector assigned to first-release lots + closing-WIP vector + explicitly attributed failed/other-lot vectors. Failure, spoilage, trial, start/stop, idle, cleaning and rework burdens attributable to this product cohort remain in its A even when their physical material is rejected; a quality gate cannot remove these burdens. Defer only demonstrably held future-WIP or genuinely other-product vectors with a named owner and reconciliation. Keep each opening/closing FG vector and actual service incremental F separately; original released burden is not produced again. Only a documented same-side repeated entry in OTHER may be X; apply X once and never deduct new repair inputs. Reconcile the unsplit inventory and all co-functions before normalization."
      inputs:
        - cp_allocation_production
        - cp_allocation_service
        - cp_lots
        - cp_release
        - cp_fg
        - cp_utilities_production
        - cp_utilities_service
        - cp_consumables_production
        - cp_consumables_service
      output: "A_j"
      source_ids:
        - ilcd-allocation-2010
    - id: composition_bridge
      applies_to: "each wet material and true species"
      rule: "Use measured whole-stream wet mass and independent representative assays to report dry matter, moisture, residual wine, ethanol and measured solids on explicit non-additive bases. Convert a raw liquid volume only using its independently measured density at the actual state, or a species gas volume using matched species concentration and independently documented state conversion. Already integrated volumes are not multiplied by H. Actual reaction species and water forms require independent constraints; preserve unresolved fractions."
      inputs:
        - cp_assay_production
        - cp_assay_service
        - cp_lots
        - cp_species_production
        - cp_species_service
        - cp_waste_production
        - cp_waste_service
      output: "non_additive_bridge"
      source_ids:
        - lbnl-best-winery-2005
        - ilcd-allocation-2010
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "result_j = numerator_j / Q; execute once only after raw-unit conversion, real attribution and necessary common-process allocation. numerator_j is tagged grossV_j physical or A_j environmental and these are non-additive ledgers. H is not divided again; cards and aggregation labels only reference this same result. For Q=0 retain all raw flows, stock vectors and burdens with declared later inheritance and issue no per-unit result. Report first-release product vectors and subsequent FG/service vectors separately by actual lot. Append real post-release service only once to the matching transferred product vector if a delivered inventory is reported, without dividing an already normalized vector again. Opening/returned lots keep their original Q history and own raw service account; do not assign them to new Q. The complete H physical grossV gate remains unscaled and separately reconciled regardless of the environmental cohort attribution."
      inputs:
        - cp_release
        - cp_allocation_production
        - cp_allocation_service
        - cp_lots
        - cp_fg
        - cp_utilities_production
        - cp_utilities_service
        - cp_consumables_production
        - cp_consumables_service
        - cp_waste_production
        - cp_waste_service
        - cp_species_production
        - cp_species_service
      output: "result_j"
      source_ids:
        - ilcd-allocation-2010
    - id: package_balance
      applies_to: "each actual packaging component"
      rule: "For each component reconcile opening empty + opening attached WIP/FG + opening reusable + actual purchases + actual external returns received = closing component stock + attached to gross physical shipment + actual external returns sent + waste. Paired internal reuse cancels; no division is performed here, and packaging never contributes to Q or automatic co-product output."
      inputs:
        - cp_packaging_production
        - cp_packaging_service
        - cp_fg
        - cp_lots
      output: "component_balance"
      source_ids:
        - lees-removal-service
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every lot and native consumer"
      requirement: "Retain first-rack gross-red origin, complete wet-state restrictions, assays and industrial receiver acceptance. Every bound identity must match native type, all names/comments, CAS, route, state, geography, medium and complete reference-property/unit chain; its supplier dataset is a separate suitability decision. Unconfirmed auxiliary identities remain concrete and disclosed, never replaced by incompatible neighbors."
      evidence: "Supplier separation logs; full specifications and native objects; exact property/unit objects; acceptance and laboratory records"
    - id: dq_completeness
      applies_to: "H and adjacent stock history"
      requirement: "Retain all failed, zero-output, start/stop, idle, trial, cleanup, repair and rework activity, opening/closing WIP and FG, grossV and per-flow A vectors; measure each additional actual exchange atomically. Unknown and unmeasured are explicit, not zero or pass."
      evidence: "Inventory reconciliation; meter logs; lot history; return pairs; maintenance and failure records"
    - id: dq_quantity
      applies_to: "all reported results"
      requirement: "Collection remains raw and unnormalized, including original units/rates and calibration uncertainty. Use the sole calculation-stage normalization, maintain independent mass/element/species/water checks and non-additive composition bridges, and disclose Q=0 without a per-unit number."
      evidence: "Raw records; calibration; representative sampling; independent balances; calculation provenance"
    - id: dq_representativeness
      applies_to: "sources and background links"
      requirement: "Disclose actual country, winery, period, technology, receiver and native restrictions. Survey prevalence, illustrative reactions and benchmark figures are not factory measurements or defaults. Report primary-data share, missing suppliers/assays, uncertainty and allocation sensitivity separately from a true identity or methodology hold."
      evidence: "Source context; site records; provider rationale; sensitivity ledger and explicit gaps"
validation_rules:
  - rule_id: validation_endpoint
    applies_to: "reference and every lot"
    rule: "Verify whole wet first-rack gross red-wine lees, no excluded route/state, actual industrial use and receiver criteria; measured net wet mass is distinct from dry matter, ethanol and argol. Source pages establish a bounded method, not a proven contemporary factory lot. A batch without core identity/endpoint evidence cannot be declared applicable."
    source_ids:
      - awri-practices-2019
      - bertolino-raw-materials
      - lbnl-best-winery-2005
  - rule_id: validation_q
    applies_to: "first release and FG service"
    rule: "Use one unique Product reference row qualified_wet_lees at 1 kg wet basis. Verify Q once per whole lot with historical flags and qualified closing FG included; opening FG, repeated tests, deliveries, returns, internal transfers and component assays do not create Q. Keep full loading/storage/handling services with inherited vectors; paired Q cancels only in the combined physical gate."
    source_ids:
      - ilcd-allocation-2010
      - bertolino-raw-materials
  - rule_id: validation_quantity
    applies_to: "all physical burden and component accounts"
    rule: "Reconcile manufacturing, FG and combined mass gates without allocation fractions on physical flows. Independently constrain water/ethanol/solids and real reactions/elements; no two unknowns fitted to one residual, indicators as molecules or duplicated whole-plus-component exchanges. Each packaging component has its complete gross-shipment stock balance. Unknown/failed/zero-output flows remain visible."
    source_ids:
      - ilcd-allocation-2010
      - lbnl-best-winery-2005
      - lees-removal-service
  - rule_id: validation_normalization
    applies_to: "every card protocol and calculation"
    rule: "Verify raw numerator collection, actual unit/state/rate conversion and upstream attribution before the sole normalize_once division. H is not a second divisor; Q=0 emits no unit result. Confirm source_ids, all qualifiers, description restrictions and non-additive ledgers survive the complete typed projection; no skipped relationship may be called a pass."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validation_native
    applies_to: "each UUID and separate provider"
    rule: "Check actual search membership and full native identity before dataset use, including its type, all names/comments/CAS, full state/route/geography/medium and exact reference property and unit group. Apply the bounded CN <1kV electricity restriction, treated tap-water identity, specific vulcanized whole-hose role and actual air species/compartment. Reject native chemical/state/route conflicts even if a name matches; blank auxiliary UUIDs remain disclosed."
    source_ids:
      - ilcd-allocation-2010
      - lbnl-best-winery-2005
  - rule_id: validation_allocation
    applies_to: "upstream shared stage and every service"
    rule: "Verify real/virtual subdivision first, exchange-specific determining physical causality next and only justified residual same-gate same-state contemporaneous market value. Reconcile common shares to unsplit inventory; accept supplier vectors once. Preserve original returned-lot burdens, actual original-delivery reverse, real incremental F and only proven same-side duplicate X in OTHER. No default zero burden, ratio, credit or disposal technology."
    source_ids:
      - ilcd-allocation-2010
      - bertolino-raw-materials
      - lees-removal-service
published_dataset_profile:
  dataset_role: "Qualified wet industrial wine-lees feedstock supply with upstream vector linked once; dedicated gate-to-gate foreground plus separately disclosed FG/service account"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared unprocessed gross red-wine lees raw material at the identified supply gate for a receiver meeting its actual criteria; actual downstream manufacturing model links this wet feed once"
  excluded_use: "Whole CPC39170 coverage claim; fine/filter/fining/sludge/argol/dry/extracted endpoints; pure ethanol/acid/salt equivalent; zero-burden waste by name; undocumented industrial acceptance; generic disposal/recycling/credit model"
  required_metadata: "Every section3 qualifier; source lineage; phase boundary; Q/H; physical and vector stocks; product/waste decisions; receiver use; exact native restrictions; allocation ownership and original measurements"
  required_quality_disclosure: "Primary measurement share; unknown composition/assay/provider identities; temporal/geographic/technological fit; physical/element/species balance uncertainty; allocation residuals and sensitivity; Q=0 intervals; all actual extra operations and completeness limits"
  update_trigger: "Different wine route/separation stage; fining/filter aid or recovery introduced; wet/solid/chemical state change; new receiver specification; different supply geography/voltage; changed cleaning or equipment; stock/return policy; material evidence or allocation change"
data_sources:
  - id: "awri-practices-2019"
    type: "literature"
    reference: "Nordestgaard, S., AWRI Vineyard and Winery Practices Survey, May 2019, ISBN 978-0-9873388-4-6. https://www.awri.com.au/wp-content/uploads/2019/05/AWRI_Practices_Survey_Final_Report.pdf ; PDF121-122/printed119-120, PDF139/printed137, methods PDF157-159/printed155-157."
    used_for: "Commercial Australian gross red ferment lees first separation and distinct reprocessing/bentonite alternatives. 2016 voluntary survey with later follow-up; used-at-all prevalence is not batch yield/composition or proof of one receiver lot."
  - id: "bertolino-raw-materials"
    type: "literature"
    reference: "Gruppo Bertolino, Raw materials, publisher page snapshot 24 October 2026. https://www.gruppobertolino.com/en/raw-materials/ ; complete Wine Lees, Grape Marc, Wine and Calcium Tartrate sections."
    used_for: "Primary Italian industrial receiver evidence for liquid/solid vinification lees as raw material. Distillation, tartrate concentration/drying and digestion are distinct downstream transformations, not this foreground. No specific red first-rack assay, acceptance limit, plant yield or supplier order is established."
  - id: "lees-removal-service"
    type: "literature"
    reference: "Lees Removal Service, Towards Sustainable Winemaking, complete primary collection page, snapshot 24 October 2026. https://leesremoval.com/"
    used_for: "Tank/tanker wine-lees collection and bonded handover context. The wine-specific alcohol/VA statement and no-cost pickup are not universal lees quality, economic value, composition, packaging material or waste-status rules; destination treatment is unstated."
  - id: "lbnl-best-winery-2005"
    type: "handbook"
    reference: "Galitsky et al., BEST Winery Guidebook: Benchmarking and Energy and Water Savings Tool for the Wine Industry, LBNL/PUB-3184, 2005. DOI 10.2172/862318. https://www.osti.gov/servlets/purl/862318 ; printed6-11,13-15,52 (PDF14-19,21-23,60)."
    used_for: "Independent process guide for red fermentation/pressing, racking sediment, fining/filter-media counterexamples, pumping, water and cleaning-effluent boundaries. California-oriented benchmark synthesis is not a single factory; no numerical yield, chemistry, water saving, temperature or recipe is adopted."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for Life Cycle Assessment — Detailed guidance, first edition March 2010, sections7.9.1-7.9.3, printed255-272/PDF275-292. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctional-process scope; real/virtual subdivision; exchange-specific determining physical causality; only residual process-gate real-state market values; reconcile allocated inventories. Not evidence for winery yield/composition, arbitrary mass allocation, default percentages or substitution credits."
