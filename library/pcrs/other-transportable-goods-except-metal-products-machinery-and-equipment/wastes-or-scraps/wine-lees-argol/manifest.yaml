  publication: not_requested
  scope_decision: One narrower method in the retained identity; wet unprocessed first-rack gross red-wine lees for industrial raw-material supply. Argol and other lees states are excluded.
  evidence_synthesis: Commercial Australian survey, California-oriented independent process guide and Italian industrial receiver establish a bounded technical synthesis, not one factory, SKU or contemporary order. No composition, yield, acceptance limit, price or allocation percentage is assumed.
  ordinary_collection_needs:
    - Actual supplier winery lot, exact first-rack separation and no fining or filter-aid carryover confirmation.
    - Representative wet net mass, moisture and dry matter, retained wine and ethanol assay with state and mass or volume basis; unknown fractions remain explicit.
    - Receiver-specific industrial acceptance, actual use, Product or Waste legal and disposal status, custody and storage conditions.
    - Complete supplier upstream inventory or allocated vector, true common-process allocation evidence and ownership; no default zero burden.
    - Actual background providers and native-compatible geography, voltage, treatment and supplied form for each exchange.
    - Full WIP and FG physical and burden stocks, gross dispatch and paired returns, Q flags, actual failure and zero-output loads, and incremental service attribution.
  unresolved_auxiliary_identities:
    - Sodium hydroxide aqueous cleaning solution at actual purchased concentration and formulation; fixed-grade and pharmaceutical or distilled-water candidates do not establish compatibility.
    - Discarded untreated wet gross red-wine lees; hazardous dregs, generic food debris, black liquor and Product wine lees are not substitutions.
    - Wine-lees tank and hose cleaning wastewater transferred to treatment; metal or wafer wastewater and direct-discharge or already treated candidates are not substitutions.
    - Discarded vulcanized EPDM wine-transfer hose with actual reinforcement, fittings and contamination; tire-dominant or internally contradictory rubber records do not prove this endpoint.
  native_use_limits:
    - Wine lees and argol Product family is only used with complete wet first-rack gross-red restrictions in every consumer description; it is not a pure compound or argol crystallized endpoint.
    - Bound alternating-current identity is CN grid-average to-user below 1 kV, with exact Net calorific value reference property and MJ unit; other locations or voltage classes require a verified alternative.
    - Tap water uses its exact Mass reference; its secondary volume coefficient is not an independent density measurement.
    - Whole vulcanized non-hard rubber hose identity is narrowed to one actual compatible supplied article; raw polymer, TPU and unvulcanized intermediates are excluded.
    - Elementary species use actual molecular identity and declared compartment; no indicator or reaction default, no stratosphere or long-term substitution.
  core_methodology_holds: []
