  actual_dataset_requirements:
  - Exact clinical source and receiving acceptance, all real quantities and residual-blood evidence must be collected;
    no site data are asserted
  - Every real attached component and P/N_ext/ER receipt must have its concrete material/form/type/direction and
    measured amount; otherwise the actual package is incomplete
  - Inherited exchange vectors and provider-included scope must be established before a numerical result; ownership/free
    receipt never implies zero burden
  - Current applicable jurisdiction clauses and authorization remain case-specific; guidance is not a legal determination
