  - id: raw_then_once
    applies_to: "all inventory rows"
    required_property_ref:
      name: "original measured property"
      uuid: ""
    required_unit: "row-specific"
    rule: "Collect only raw amounts; perform actual conversion and attribution before calc_inventory. Cards use its existing n or n_service result without another division. Collection aggregation identifies the final reference target only; it does not divide raw records. Q0 retains all loads without a unit result."
  - id: physical_separation
    applies_to: "assembly blood and every container component"
    required_property_ref:
