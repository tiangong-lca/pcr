  production_route: "Manufactured sterile syringe and needle → documented adult venous sampling and sample transfer → connected discard → segregation in actual Medibox 2.4 L REF 9193600 → closure labelling internal movement sealed weighing inspection → first controlled-store acceptance; later storage/dispatch retains original cohort"
