allocation_rules:
  - rule_id: a_dedication
    applies_to: "clinical_origin_and_current_services"
    rule: "Use attributional modelling with the stated clinical function and waste-supply boundary. First separate dedicated operations and apply real or virtual subdivision. Trace each device/material and its inherited vector to the actual parent clinical activity; never create an assumed waste cut-off or transfer the entire clinical service to the waste. Dedicated post-discard containment/collection burdens belong to that activity."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_causality
    applies_to: "unresolved_joint_exchanges"
    rule: "Only after subdivision, identify the determining physical causal relationship separately for each remaining exchange. Clinical specimen benefit, labour, sharps capacity and site utilities do not automatically share one mass ratio. Show the mechanism, measured driver and all co-functions; embodied mass is not by itself proof of causality for every energy/service exchange."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_residual
    applies_to: "genuinely_unresolved_joint_process"
    rule: "Only genuinely inseparable residual exchanges may use contemporaneous market values of actual co-functions at the same process gate and physical state, with evidence and sensitivity. A disposal charge is not a positive material price or an avoided-impact credit. Missing causal/value evidence prevents a numerical allocated result; it does not authorize arbitrary physical/economic choice, fixed shares or automatic substitution."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_services
    applies_to: "cohort_and_contracts"
    rule: "Allocate actual storage, handling, collection, rental and return-service increments to the original cohort Qc after excluding provider-included scope. H and dispatch quantity are activity drivers, never new production Q. Preserve component inheritance across ownership changes and P/N_ext/ER events. No additional virgin-material, recovery, energy or disposal credit arises from this untreated transfer."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_origin
      process_id: "collection"
      flow_role: "used_assembly_in"
      record_type: "origin and inherited-exchange ledger"
      raw_fields: "clinical activity ID; origin ward; time; syringe REF 4606027V; needle REF 4657527; documented configuration; actual device receipts and manufacture/sterilization/sterile-packaging providers; virgin component masses and additives when known; blood specimen transfer record; discarded assembly V; residual-blood measurement evidence; each exchange inherited vector; provider-included scope; allocation evidence; opening/closing WIP and unused stocks; failures and Q0"
      collection_method: "Use procurement/product/batch and clinical procedure records plus safe pre-use device mass and sealed-container differences. Retain actual sterile syringe and needle manufacture/use history through one parent provider/interface. No patient identifiers are needed for the LCA ledger; use traceable non-identifying event IDs. Do not infer residual volume from nominal syringe capacity. Keep raw amounts and inherited vectors, unnormalized."
      unit: "kg; original supplier/meter units"
      frequency: "each source lot and period"
      temporal_coverage: "complete clinical generation and failed/idle periods"
      site_scope: "one declared adult venous-sampling source"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "device/batch records; anonymous procedure link; supplier scope; traceable masses; allocation assessment"
    - protocol_id: cp_gate
      process_id: "collection"
      flow_role: "first_release_sharps; rejected_assembly"
      record_type: "closed-weighing and first-acceptance record"
      raw_fields: "lot ID; sealed container ID; calibrated scale ID; gross sealed weight; measured unused same-configuration body/lid/marking tare; other actual attached tare; unit; uncertainty; source-history link; first acceptance ID/time; receiver; acceptance criteria; first Q; rejected quantity/reason; opening/closing WIP; spill/loss; before/after treatment state"
      collection_method: "Weigh closed labelled containers without opening them. Use traceable safe pre-use or supplier component-tare measurements for the exact configuration; account for actual moisture/attachments. Subtract tare once for net assembly mass and reconcile independent generation and receiving records. A nominal volume, box count or fill line is not a kg conversion. Preserve raw records without division."
      unit: "kg"
      frequency: "each sealed lot and acceptance"
      temporal_coverage: "whole cohort including rejection and Q0"
      site_scope: "source clinical facility controlled waste store"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; repeated tare samples with uncertainty; sealed-lot chain; actual acceptance signature"
    - protocol_id: cp_body
      process_id: "collection"
      flow_role: "body_purchase; body_nonpurchase; body_return; body_shipped; body_returned_out; body_waste"
      record_type: "atomic component receipt and movement interface"
      raw_fields: "event ID; exact component moulded polypropylene Medibox 2.4 L body REF 9193600; material; form; type; direction input/output; measured quantity and unit; article/cohort; supplier/holder; bundle/invoice/entrustment; receipt class P/N_ext/ER; previous external dispatch for ER; opening empty/WIP/FG/reusable; closing empty/WIP/FG/reusable; gross outward S; outward EO; waste W; internal issues; component inherited vector; bundle vector; provider included scope; actual incremental service"
      collection_method: "Record every real physical receipt and outward event for this single component, whether purchased, included in a paid batch, supplied free, first entrusted/borrowed/rented, or genuinely returned after prior dispatch. P/N_ext/ER are exclusive. Measure kg by component/sample traceability without opening contaminated containers; preserve real counts only as a subsidiary check. A kit and its body/lid partition are non-additive; reconcile each component and the bundle vector. Stock cannot replace missing receipt records. No division in collection."
      unit: "kg"
      frequency: "each component event and stocktake"
      temporal_coverage: "complete period and original cohorts"
      site_scope: "all supplier/source/store/dispatch gates for this component"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "goods-receipt and non-purchase handover records; measured masses; ER dispatch proof; ownership and provider-scope records"
    - protocol_id: cp_lid
      process_id: "collection"
      flow_role: "lid_purchase; lid_nonpurchase; lid_return; lid_shipped; lid_returned_out; lid_waste"
      record_type: "atomic component receipt and movement interface"
      raw_fields: "event ID; exact component moulded polypropylene Medibox 2.4 L locking lid REF 9193600; material; form; type; direction input/output; measured quantity and unit; article/cohort; supplier/holder; bundle/invoice/entrustment; receipt class P/N_ext/ER; previous external dispatch for ER; opening empty/WIP/FG/reusable; closing empty/WIP/FG/reusable; gross outward S; outward EO; waste W; internal issues; component inherited vector; bundle vector; provider included scope; actual incremental service"
      collection_method: "Record every real physical receipt and outward event for this single component, whether purchased, included in a paid batch, supplied free, first entrusted/borrowed/rented, or genuinely returned after prior dispatch. P/N_ext/ER are exclusive. Measure kg by component/sample traceability without opening contaminated containers; preserve real counts only as a subsidiary check. A kit and its body/lid partition are non-additive; reconcile each component and the bundle vector. Stock cannot replace missing receipt records. No division in collection."
      unit: "kg"
      frequency: "each component event and stocktake"
      temporal_coverage: "complete period and original cohorts"
      site_scope: "all supplier/source/store/dispatch gates for this component"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "goods-receipt and non-purchase handover records; measured masses; ER dispatch proof; ownership and provider-scope records"
    - protocol_id: cp_energy
      process_id: "collection"
      flow_role: "collection_electricity"
      record_type: "meter records"
      raw_fields: "meter ID; geography; voltage; supply route; readings; raw unit; power-rate interval when applicable; operating/idle/start-stop/failed/cleanup time; dedicated/shared loads; allocation evidence; provider scope"
      collection_method: "Meter actual energy including unsuccessful periods. Keep raw kWh/MJ; integrate only actual measured rates, not already integrated readings. Convert units and attribute before the single inventory calculation. No division in collection."
      unit: "kWh; MJ"
      frequency: "continuous logs reconciled per period"
      temporal_coverage: "complete generation and storage period"
      site_scope: "actual clinical source and controlled store"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration and bills; driver evidence"
    - protocol_id: cp_service
      process_id: "services"
      flow_role: "assembly_true_return; assembly_dispatched"
      record_type: "FG cohort and incremental service ledger"
      raw_fields: "original Qc; opening/closing FG; first Q; gross dispatch S; actual return ID and previous dispatch; reverse original delivery attribution; H; service time; actual incremental equipment/utility/transport/rental/return-service exchanges by individual physical name; provider-included scope; each inherited vector; reinspection/rework/loss"
      collection_method: "Match every receipt and dispatch to the original cohort. Record each actual new service exchange through a specific atomic interface with direction, material/type, raw unit and amount before completeness. Keep actual H and raw amounts; no new Q and no division in this protocol. Service invoices do not justify duplicating supplier container manufacture."
      unit: "kg; original service/meter units"
      frequency: "each event and period"
      temporal_coverage: "original cohort through final dispatch"
      site_scope: "declared source store; downstream boundary explicit"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stock reconciliation; signed receipt/dispatch; actual contracts and incremental meters"
    - protocol_id: cp_cleanup
      process_id: "cleanup"
      flow_role: "each conditional cleaning exchange"
      record_type: "separate formulation/water/cloth/effluent records"
      raw_fields: "incident/surface ID; exact supplied formulation identity and SDS; concentration and carrier assay; whole purchased mass; actual onsite preparation ingredients; dilution water; cotton cloth input; spent liquid output; contaminated cloth output; actual retained fluid; destination; actual PPE and additional components each with material/form/type/direction/amount interface; measured species only; raw units and density/state evidence"
      collection_method: "Record the actual specific cleanup route, not a default disinfection recipe. Keep whole formulations once and constituent assays as non-additive subaccounts. Weigh water and waste separately; any volume conversion requires independently measured relevant density/state. No unmeasured chemical reaction or elementary emission. Missing actual interfaces make the package incomplete; absent use is documented as not applicable. Collect raw amounts without division."
      unit: "kg; original measured units"
      frequency: "each real cleanup event"
      temporal_coverage: "all incidents including Q0 and failed periods"
      site_scope: "actual attributed surfaces and waste outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "purchase/SDS; scale/meter records; destination receipt; incident and component ledger"
  calculation_rules:
    - id: calc_units
      applies_to: "all raw measured exchanges"
      rule: "Convert original measurements before attribution: kg = measured g / 1000; MJ = metered kWh * 3.6. Count-to-mass needs measured actual same-configuration article mass and uncertainty. Volume-to-mass needs measured substance-specific density at the recorded state. Integrate measured rates once; preserve already integrated totals. No assumed device mass, solution density or clinical composition."
      inputs:
        - raw_amount
        - raw_unit
        - measured_article_mass
        - density_state_evidence
      output: "converted_raw_amount"
      source_ids: []
    - id: calc_gate
      applies_to: "first_release_sharps"
      rule: "For each sealed lot net assembly mass = sealed gross mass - actual body tare - actual lid tare - all other actual attached packaging tare. Q = sum of net assembly mass newly first accepted at the declared gate. Do not infer residual blood mass from a subtraction of two unknowns. Rejected lots and already released returns are excluded from new Q."
      inputs:
        - gross_mass
        - body_tare
        - lid_tare
        - other_actual_tare
        - first_acceptance_ID
      output: "Q"
      source_ids:
        - who-health-care-waste-2014
        - who-phlebotomy-2010
    - id: calc_component_balance
      applies_to: "each individual actual component"
      rule: "For the same component and physical gate: opening_empty + opening_attached_WIP_FG + opening_reusable + P + N_ext + ER = C + S + EO + W. P/N_ext/ER are disjoint actual receipt classes. ER has prior external dispatch proof. C covers empty/attached/reusable states. S uses component on gross physical shipments, not net waste Q. Internal transfers/reuse cancel. Check each real material/form/type and the bundle non-additivity independently."
      inputs:
        - opening_empty
        - opening_attached_WIP_FG
        - opening_reusable
        - P
        - N_ext
        - ER
        - C
        - S
        - EO
        - W
      output: "component_balance_residual"
      source_ids:
        - ilcd-attributional-2010
        - braun-syringes-needles-2022
    - id: calc_attribute
      applies_to: "each exchange and its original cohort"
      rule: "Construct the raw attributional numerator A from the actual exchange-specific inherited opening/receipt vectors and actual current increments after justified subdivision/allocation, carrying closing WIP/unused stock and later service shares to their own cohorts. Include failed/idle/cleanup/Q0 burdens and reverse real returns consistently. Provider-included components and services are counted once. Preserve an independent gross physical V ledger; never close physical mass on A."
      inputs:
        - converted_raw_amount
        - inherited_vectors
        - current_increments
        - closing_stock_vectors
        - allocation_evidence
        - provider_scope
      output: "A"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_inventory
      applies_to: "all inventory rows"
      rule: "n = A / Q is executed once only after raw unit conversion and justified attribution. For subsequent services use n_service = A_service / Qc, retaining original Qc; H is not a production denominator. Flow cards and collection aggregation only reference these existing results and perform no further division. If Q = 0 or required Qc is unavailable, retain all raw burdens and stock vectors and report no unit result."
      inputs:
        - A
        - Q
        - A_service
        - Qc
      output: "n; n_service"
      source_ids:
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_origin
      applies_to: "every reference lot"
      requirement: "Require the exact two article references, actual source procedure, attached-needle state, absence of medicinal/radioactive/cytotoxic admixture, residual-fluid evidence and original cohort. Supplier catalogue composition is qualitative only and does not establish site quantities."
      evidence: "supplier/batch and anonymous clinical-origin records; source-state inspection"
    - id: dq_safe_mass
      applies_to: "each closed lot"
      requirement: "Use a calibrated scale and exact configuration tare with sample spread/uncertainty. No manual opening/sorting of contaminated sharps for LCA. Reconcile each independently measured net/gross/stock account, separate physical mass from elemental/species evidence, and report discrepancies rather than force residual fits."
      evidence: "calibration; safe pre-use tare; sealed weights; independent balance and uncertainty"
    - id: dq_complete_receipt
      applies_to: "each actual packaging component and service"
      requirement: "Every P, N_ext and ER receipt and every outward event needs a specific atomic material/form/type/direction interface and measured amount. Missing actual interfaces, unexplained component/bundle vector duplication, unknown supplier-included scope or missing initial non-purchase receipts make the concrete package incomplete."
      evidence: "goods-receipt and entrustment evidence; cp_body; cp_lid; complete additional-component interfaces"
    - id: dq_history
      applies_to: "whole production/service period"
      requirement: "Retain all failed/idle/cleanup/Q0 periods and opening/closing WIP/FG/unused vectors. Separate source acquisition dates and technology from actual facility/reference period. This is a transparent technical synthesis of independent manufacturer and WHO sources, not evidence for one contemporaneous hospital order."
      evidence: "period coverage; cohort ledgers; supplier/clinical and independent method evidence"
    - id: dq_acceptance
      applies_to: "actual jurisdiction and receiving gate"
      requirement: "Collect current applicable rules/clauses, operator authorization, receiver acceptance and transfer documentation independently. Scottish guidance and the CPC title do not prove local legality, harmlessness, a permitted liquid threshold or a completed treatment. Unverified items remain explicit and block the dependent actual-data claim."
      evidence: "current jurisdiction-specific primary documents and signed acceptance"
    - id: dq_identity
      applies_to: "each provider/exchange"
      requirement: "Use full native name/type/route/form/CAS/geography/grade/comments and all properties to assess provider compatibility. A generic clinical Product identity is only a locator, not waste approval. Keep concrete unbound auxiliary identities visible; neither use resin/waste alternatives nor invent global method holds solely for ordinary provider gaps."
      evidence: "exact native direct record; precise property/unit chain; supplier compatibility assessment"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference_lot"
    rule: "Verify the exact used attached Injekt/Sterican venous-sampling assembly and first gate. Exclude every neighbouring device/state and 39931/39910 stream; do not silently average mixed containers. Require all qualifiers and the native restrictions from both reference and inventory descriptions."
    source_ids:
      - un-cpc3-2025
      - braun-syringes-needles-2022
      - who-phlebotomy-2010
  - rule_id: v_gate
    applies_to: "first_release_and_fg"
    rule: "Q counts new first acceptance only and includes the cohort in closing FG once. Reconcile opening/closing WIP and the independent FG balance, gross dispatch, genuine previous-dispatch returns and original Qc vectors. Reinspection, returns, H and redispatch create no new Q."
    source_ids:
      - who-health-care-waste-2014
      - ilcd-attributional-2010
  - rule_id: v_components
    applies_to: "each_actual_packaging_component"
    rule: "For each real material/form/type require measured atomic P/N_ext/ER receipt interfaces and the same-gate opening_empty + opening_attached_WIP_FG + opening_reusable + P + N_ext + ER = C + S + EO + W. Check receipt exclusivity and ER dispatch proof; opening stock is not current receipt. Cancel internal reuse/issues, separate paid-batch P from true N_ext, and audit component/cohort/inherited vectors plus provider-included scope and real incremental service exactly once. Missing actual interfaces mean incomplete data, not a symbolic pass."
    source_ids:
      - braun-syringes-needles-2022
      - ilcd-attributional-2010
  - rule_id: v_quantities
    applies_to: "all_inventory_rows"
    rule: "Collect original raw numerators without division; convert measured units and justify attribution first; execute A/Q once, or A_service/Qc once for later service, and only reference that result in cards/aggregation. Keep Q0 loads without a unit result. Physical V and mixed-export partitions are independent of A and non-additive. No guessed density, per-device kg, composition, chemical species or second residual unknown."
    source_ids:
      - ilcd-attributional-2010
      - who-health-care-waste-2014
  - rule_id: v_treatment
    applies_to: "state_and_legal_claims"
    rule: "Verify the unchanged untreated state and actual acceptance documents. Do not invent sterilization efficacy, reaction water, pathogens, elementary emissions, recovered material, credit or legal permission. Surface cleanup does not decontaminate the waste by assertion. Add all actual material/service/effluent/species interfaces before declaring completeness."
    source_ids:
      - who-phlebotomy-2010
      - who-health-care-waste-2014
      - nhs-waste-2024
  - rule_id: v_allocation
    applies_to: "history_and_shared_services"
    rule: "Verify the dedicated/virtual-subdivision evidence, exchange-specific determining causality and only genuinely residual same-gate contemporaneous values. Verify once-only upstream device/clinical/component vectors and provider scope for contracts and non-purchase receipts. Lack of causal/value evidence prevents numerical allocation and cannot be replaced by a fixed share or zero burden."
    source_ids:
      - ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "Attributed physical supply of the single identified untreated used clinical assembly"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Subsequent controlled collection/transport/treatment studies using the exact source and untreated state with one upstream provider and original-cohort inheritance"
  excluded_use: "Mixed hospital waste average; unused syringe manufacture; pure PP supply; recovered polymer; incineration/disinfection service; legal or clinical approval; unverified zero-burden waste"
  required_metadata: "exact syringe/needle article and supplier batch; adult diagnostic venous blood-sampling origin and sample-transfer record; PP barrel and PE plunger with steel cannula PP hub and silicone coating; actual integral markings additives and supplier composition limitations; attached unsheathed needle and retained residual-blood evidence; untreated post-use state and no unverified disinfection or pathogen claim; absence of medicinal radioactive and cytotoxic admixture evidence; sealed net as-received assembly mass and each measured tare; first acceptance Q original cohort Qc and acceptance criteria; opening closing WIP FG unused stocks and inherited exchange vectors; gross physical V separate from attributional A; every actual component P N_ext ER receipt and S EO W outlet; ownership provider-included scope and real incremental contracted service; site geography period actual facilities and measurement uncertainty; actual jurisdiction current clauses and receiver acceptance; native Product Mass at-plant unspecified-treatment restrictions and actual provider compatibility"
  required_quality_disclosure: "Actual source/basis/uncertainty; exact first gate; raw and inherited-vector completeness; P/N_ext/ER component coverage; supplier scope; independent V and A ledgers; conditional missing interfaces; unresolved provider/legal/receiver evidence; no unsupported numeric claim"
  update_trigger: "Device/configuration/source procedure, residual-fluid or treatment state, actual jurisdiction/receiver criteria, container components, provider-included scope, allocation evidence or measurement method changes"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed p.205; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification hierarchy only: 39939 alongside 39931 and 39910; no composition or legal approval."
