    reference: "NHSScotland SHTN 03-01 Waste Management Guidelines, V8 December 2024, sections 5.23–5.25, 6.35–6.36, 11 and 15; https://www.nss.nhs.scot/media/5724/shtn-03-01-v8-dec-2024.pdf"
    used_for: "Scoped guidance/counterexamples on sharps versus pharmaceutical/bulk liquid streams and documented receiving characteristics; current actual jurisdiction/clauses still require independent verification."
  - id: "ilcd-attributional-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General Guide for Life Cycle Assessment: Detailed Guidance, first edition March 2010, sections 7.9.2–7.9.3, pp.255–265; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctionality hierarchy and exchange-specific determining causality with residual process-gate market values; applied as method synthesis, not as clinical-product composition or a default waste cut-off."
