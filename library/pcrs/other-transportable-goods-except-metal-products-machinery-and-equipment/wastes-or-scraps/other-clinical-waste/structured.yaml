    reference: "B. Braun Sterican naalden current manufacturer description; https://catalogs.bbraun.nl/nl-NL/p/PRID00000511/sterican-naalden"
    used_for: "Current primary confirmation of chromium-nickel stainless steel, PP hub and silicone coating; no quantitative fractions or supplier-specific alloy grade."
  - id: "who-phlebotomy-2010"
    type: "official_guidance"
    reference: "WHO Guidelines on Drawing Blood: Best Practices in Phlebotomy, 2010, ISBN 9789241599221, sections 2–3 and 8 and Annex G; WHO text https://www.ncbi.nlm.nih.gov/books/NBK138665/ ; complete WHO PDF mirror https://healthacademyonline.co.uk/wp-content/uploads/2020/10/WHO-guidelines-on-drawing-blood-best-practices-in-phlebotomy-Eng.pdf"
    used_for: "Venous sampling formation history, sample transfer and immediate whole-device sharps discard; safer-equipment and exceptional-disassembly countercontexts; no prescribed clinical practice, site mass, waste burden split or pathogen value."
  - id: "who-health-care-waste-2014"
