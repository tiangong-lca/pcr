  covered_products: "Used untreated connected Injekt 4606027V / Sterican 4657527 adult venous-sampling assembly with actual retained blood"
  excluded_products: "Unused devices; pure polymer scrap; separated needles; mixed hospital waste; medicated/cytotoxic/radioactive waste; bulk blood; sample tubes; gloves/swabs/caps/wrappers; treated or recovered material; treatment services"
