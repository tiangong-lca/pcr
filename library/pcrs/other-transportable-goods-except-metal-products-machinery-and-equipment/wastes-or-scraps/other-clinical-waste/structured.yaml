    reference: "WHO Safe management of wastes from health-care activities, second edition 2014, ISBN 9789241548564, sections 2.1, 2.8 and 7; https://www.who.int/publications/i/item/9789241548564 ; official full PDF https://iris.who.int/server/api/core/bitstreams/4daece5e-1220-47f5-903c-8c2a14fcd778/content"
