      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_scope | reference_lot | Verify the exact used attached Injekt/Sterican venous-sampling assembly and first gate. Exclude every neighbouring device/state and 39931/39910 stream; do not silently average mixed containers. Require all qualifiers and the native restrictions from both reference and inventory descriptions. | `un-cpc3-2025`; `braun-syringes-needles-2022`; `who-phlebotomy-2010` |\n| v_gate | first_release_and_fg | Q counts new first acceptance only and includes the cohort in closing FG once. Reconcile opening/closing WIP and the independent FG balance, gross dispatch, genuine previous-dispatch returns and original Qc vectors. Reinspection, returns, H and redispatch create no new Q. | `who-health-care-waste-2014`; `ilcd-attributional-2010` |\n| v_components | each_actual_packaging_component | For each real material/form/type require measured atomic P/N_ext/ER receipt interfaces and the same-gate opening_empty + opening_attached_WIP_FG + opening_reusable + P + N_ext + ER = C + S + EO + W. Check receipt exclusivity and ER dispatch proof; opening stock is not current receipt. Cancel internal reuse/issues, separate paid-batch P from true N_ext, and audit component/cohort/inherited vectors plus provider-included scope and real incremental service exactly once. Missing actual interfaces mean incomplete data, not a symbolic pass. | `braun-syringes-needles-2022`; `ilcd-attributional-2010` |\n| v_quantities | all_inventory_rows | Collect original raw numerators without division; convert measured units and justify attribution first; execute A/Q once, or A_service/Qc once for later service, and only reference that result in cards/aggregation. Keep Q0 loads without a unit result. Physical V and mixed-export partitions are independent of A and non-additive. No guessed density, per-device kg, composition, chemical species or second residual unknown. | `ilcd-attributional-2010`; `who-health-care-waste-2014` |\n| v_treatment | state_and_legal_claims | Verify the unchanged untreated state and actual acceptance documents. Do not invent sterilization efficacy, reaction water, pathogens, elementary emissions, recovered material, credit or legal permission. Surface cleanup does not decontaminate the waste by assertion. Add all actual material/service/effluent/species interfaces before declaring completeness. | `who-phlebotomy-2010`; `who-health-care-waste-2014`; `nhs-waste-2024` |\n| v_allocation | history_and_shared_services | Verify the dedicated/virtual-subdivision evidence, exchange-specific determining causality and only genuinely residual same-gate contemporaneous values. Verify once-only upstream device/clinical/component vectors and provider scope for contracts and non-purchase receipts. Lack of causal/value evidence prevents numerical allocation and cannot be replaced by a fixed share or zero burden. | `ilcd-attributional-2010` |\n\n"
