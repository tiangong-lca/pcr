      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Already used connected assembly after diagnostic sample transfer; sterile-device manufacture and clinical-use history linked and inherited explicitly |\n| starting_condition_role | Physical input after the parent clinical operation; never an unused-device procurement boundary |\n| product_classification_scope | Only the stated single 39939 material; 39931/39910 are separate |\n| recursive_input_rule | A previously collected or returned same-category lot retains its original cohort and vectors; it cannot reset Q or recursively rebuild original manufacture/use |\n| upstream_dataset_requirement | Link representative device manufacture/sterilization/packaging and the actual parent venous-sampling operation once. Disclose clinical co-function allocation and any unresolved burden. Collection service and supplied container scope are disjoint |\n| disclosure | Exact source/configuration; residual fluid and untreated state; first Q/original Qc; stock and inherited vectors; all physical component receipts; legal/receiver conditions; provider restrictions; actual later service |\n\n### Normative System Boundary Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_scope | reference_product | Only the used Injekt Luer Solo 2 ml centric Luer syringe REF 4606027V with the attached Sterican standard long-bevel 21 G x 1.5 inch (0.80 x 40 mm) needle REF 4657527 after adult diagnostic venous blood sampling is covered. Keep the PP barrel, PE plunger, PP needle hub, chromium-nickel stainless-steel cannula, silicone coating (actual supplied formulation remains to be verified), integral markings/additives and actual residual blood together. Exact component masses, alloy grade, coating identity, additives and blood content require supplier/foreground records; no percentage is prescribed. Exclude medication-contaminated, radioactive, cytotoxic, unused, detached-needle, needle-free, safety-shield, AD, mixed-device and bulk-liquid streams. | `un-cpc3-2025`; `braun-syringes-needles-2022`; `who-phlebotomy-2010`; `who-health-care-waste-2014`; `braun-injekt-current`; `braun-sterican-current` |\n| b_history | upstream_history_and_collection | Trace the real history from manufactured sterile syringe and separately supplied sterile needle through one documented blood-sampling procedure and sample transfer to immediate connected-device discard. Device manufacture (including each polymer/metal/coating, fabrication, assembly, actual sterilization and sterile packaging) and clinical-use exchanges belong to their representative upstream providers or explicitly modelled upstream units, once. The collection module receives the already used assembly and its exchange-specific inherited burden vector; it does not repurchase the device or reconstruct the same manufacture/use in parallel. Record the diagnostic specimen as the clinical co-function outside this physical waste supply. Unknown upstream burdens are unresolved, never automatically zero and never the full patient-care inventory by default. | `braun-syringes-needles-2022`; `who-phlebotomy-2010`; `ilcd-attributional-2010`; `braun-injekt-current`; `braun-sterican-current` |\n| b_gate | first_release_and_service | The physical foreground begins at connected-device discard and includes segregation at the point of use, the actual container/closure, labelling, internal movement, secure temporary storage, sealed weighing, inspection and first documented acceptance into the source facility controlled waste store as one segregated handover-ready cohort. Q is the net assembly mass newly passing that first gate, including residual blood but excluding all collection packaging. Q already includes the newly released cohort in closing FG: never add closing FG to it. Later storage, handling and dispatch remain in a separate ledger of the original cohort Qc; H is service activity only. External transport, treatment and recovery after the declared dispatch gate require separate downstream datasets. | `who-phlebotomy-2010`; `who-health-care-waste-2014`; `ilcd-attributional-2010` |\n| b_safety_state | isolation_and_unperformed_treatment | Represent a documented existing clinical waste route, not instructions to select a blood-sampling technique. WHO identifies safer equipment alternatives; its Annex G describes exceptional device disassembly, which is outside this connected-device route. The Medibox catalogue also offers needle-disconnection inlets: their use would change the physical reference and is excluded here. Do not open filled sharps containers, remove needles or manually sort contaminated devices to obtain LCA data. Use safe closed-container measurements and pre-use/supplier tare evidence. No waste autoclaving, chemical disinfection, crushing, polymer recovery or incineration occurs in this reference; do not invent reaction emissions, disinfection efficiency, sterilization of the used device, harmlessness, pathogen prevalence or legal authorization. | `braun-syringes-needles-2022`; `who-phlebotomy-2010`; `who-health-care-waste-2014` |\n| b_stocks | all_physical_gates | Retain each origin lot and opening/closing WIP, unopened supplies and released FG with an inherited vector for every exchange. Keep failed/rejected lots, zero-output periods, start/stop, idle, spills, cleanup and genuine rework. The clinical assembly balance is opening WIP + newly generated used assemblies = closing WIP + Q + pre-release rejected assembly mass + independently measured loss. The FG balance is opening FG + Q + genuine previously dispatched assembly returns = closing FG + gross physical assembly dispatch S + FG losses. Returns and reinspection retain Qc and cannot generate Q. Cancel internal WIP/FG issues and their vectors in combined modules; avoid a second stock subtraction from already net issues. | `ilcd-attributional-2010`; `who-health-care-waste-2014` |\n| b_receipts | each_actual_container_and_attached_component | For each actual component j close the same physical gate: opening empty + opening attached WIP/FG + opening reusable + purchase receipts P + first external non-purchase receipts N_ext + genuine external return receipts ER = closing empty/attached/reusable C + component on gross physical outward shipments S + external return outward EO + waste W. P means actual newly purchased physical receipts, including components in the paid batch price without a separate invoice. N_ext includes actual first supplier-provided, entrusted, borrowed or rented physical receipts only when not P. ER requires the same article previous outward dispatch. P/N_ext/ER are mutually exclusive event classes; opening stock never replaces a current receipt. Internal issue/reuse cancels, creates no new P, Q or coproduct. Medibox body and lid each have explicit material/form/type/direction/quantity receipt interfaces in cp_body/cp_lid, including all three receipt classes, even when supplied together. The single-use container is not presumed reusable; a used contaminated return cannot silently enter clean stock. | `braun-syringes-needles-2022`; `who-health-care-waste-2014`; `ilcd-attributional-2010` |\n| b_receipt_burdens | purchased_and_nonpurchased_interfaces | Physical receipt, ownership and environmental burden are independent. Link each body/lid receipt to the real supplier bundle, original cohort, component vector, provider-included scope and invoice/entrustment terms. A supplied kit is purchased once: component receipts are a non-additive disaggregation and its provider burden vector is transferred once, with justified component attribution, never copied in full to both components or added again as a kit. First non-purchase receipt does not imply zero manufacture; retain inherited vectors and separately measured incremental rental/return/collection service not already in the supplier scope. Genuine ER preserves prior vectors; it does not create a new procurement burden or credit. Apply the same contract to commissioned collection and contracted services. No actual component can be omitted merely because it is free or not separately invoiced. | `ilcd-attributional-2010`; `braun-syringes-needles-2022` |\n| b_atomic | each_exchange_and_material_interface | The baseline is closed segregation and collection without treatment. Meter actual electricity; surface cleanup is conditional and does not establish disinfection of the waste. Purchased cleaning formulation is one whole supplied product; active chlorine and carrier water are subsidiary assays, not repeated purchases. In-house dilution uses its actual purchased ingredients, dilution water, energy and losses. Record every actual PPE article, sterile wrapping, protective cap, label, seal, liner, overpack, fuel, refrigerant, cleaning ingredient, wastewater, residue and actual emission species as a specific single exchange or component receipt interface before claiming completeness. Unknown material/species and a missing actual interface make the concrete data package incomplete. Never use an OTHER total as a selected flow; a newly identified F removes X only if X is an exact same-side duplicate already inside that total. Mixed-export whole quantities and origin partitions are non-additive and use one provider. | `who-phlebotomy-2010`; `who-health-care-waste-2014`; `ilcd-attributional-2010` |\n| b_mass_species | physical_and_element_accounts | Close total physical mass separately from any justified chemical/elemental subaccount. The assembly net mass includes real retained blood; the mass balance does not establish blood composition, pathogen identity, density, polymer fraction or coating mass. Use independent safe measurement/supplier data; do not fit two unknowns with one residual. No drying or reaction water is assumed. Preserve actual solution temperature/state and measured density when converting volumes; never use water density for blood or formulation. An integrated liquid/gas volume is not multiplied by time again; only a real measured rate is integrated. COD/VOC indicators do not identify a chemical emission mass. | `who-health-care-waste-2014`; `who-phlebotomy-2010` |\n| b_jurisdiction | identity_and_acceptance | CPC 39939 is classification context, not a hazardous-waste code, permission or end-of-waste finding. Keep 39931 pharmaceutical waste and 39910 municipal waste separate. NHS SHTN 03-01 V8 sections 5.23–5.25, 6.35–6.36, 11 and 15 supply Scottish guidance context and counterexamples, not a universal legal liquid allowance. Record the actual applicable jurisdiction, current rule version/clauses, facility authorization, receiver acceptance, container approval and treatment destination when required. If these are unverified, disclose them as unresolved; never infer compliant/harmless status from a generic UUID, container label or absence of a known pathogen. | `un-cpc3-2025`; `nhs-waste-2024`; `who-health-care-waste-2014` |\n\n"
