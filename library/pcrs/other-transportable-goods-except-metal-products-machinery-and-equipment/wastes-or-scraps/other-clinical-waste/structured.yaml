          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_dedication | clinical_origin_and_current_services | Use attributional modelling with the stated clinical function and waste-supply boundary. First separate dedicated operations and apply real or virtual subdivision. Trace each device/material and its inherited vector to the actual parent clinical activity; never create an assumed waste cut-off or transfer the entire clinical service to the waste. Dedicated post-discard containment/collection burdens belong to that activity. | `ilcd-attributional-2010` |\n| a_causality | unresolved_joint_exchanges | Only after subdivision, identify the determining physical causal relationship separately for each remaining exchange. Clinical specimen benefit, labour, sharps capacity and site utilities do not automatically share one mass ratio. Show the mechanism, measured driver and all co-functions; embodied mass is not by itself proof of causality for every energy/service exchange. | `ilcd-attributional-2010` |\n| a_residual | genuinely_unresolved_joint_process | Only genuinely inseparable residual exchanges may use contemporaneous market values of actual co-functions at the same process gate and physical state, with evidence and sensitivity. A disposal charge is not a positive material price or an avoided-impact credit. Missing causal/value evidence prevents a numerical allocated result; it does not authorize arbitrary physical/economic choice, fixed shares or automatic substitution. | `ilcd-attributional-2010` |\n| a_services | cohort_and_contracts | Allocate actual storage, handling, collection, rental and return-service increments to the original cohort Qc after excluding provider-included scope. H and dispatch quantity are activity drivers, never new production Q. Preserve component inheritance across ownership changes and P/N_ext/ER events. No additional virgin-material, recovery, energy or disposal credit arises from this untreated transfer. | `ilcd-attributional-2010` |\n\n"
