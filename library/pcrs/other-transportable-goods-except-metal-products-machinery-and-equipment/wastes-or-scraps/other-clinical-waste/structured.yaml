    used_for: "Exact article identities, qualitative component materials, separate standard/blunt/safety variants, use/disposal and Medibox body/lid/closure; not measured waste composition, current legal approval or LCA allocation."
  - id: "braun-injekt-current"
    type: "literature"
    reference: "B. Braun Injekt Luer Solo current manufacturer description; https://catalogs.bbraun.com/en-01/p/PRID00003171/injekt-luer-solo"
    used_for: "Current primary confirmation of PP barrel, PE plunger, single-use device and body-fluid aspiration purpose; regional availability/indications require local verification."
  - id: "braun-sterican-current"
