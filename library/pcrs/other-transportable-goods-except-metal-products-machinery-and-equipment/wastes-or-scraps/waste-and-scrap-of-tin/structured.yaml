system_boundary:
  rules:
    - rule_id: boundary_origin
      applies_to: "whole product chain"
      rule: "Retain alloy production through a compatible linked upstream dataset plus the actual original casting that creates gates. Receive the whole purchased alloy once; Sn/Sb/Cu assays and alloy water are non-additive child accounts. Actual in-house alloying requires each external metal, each real formulation, energy and losses as its own added row before use. No finished-scrap purchase shortcut."
      source_ids:
        - asl-pewter
        - nt-britannia-2015
        - ilcd-2010
    - rule_id: boundary_casting
      applies_to: "source_casting"
      rule: "Include whole-alloy receipt and unloading, actual mould preparation and lifetime use, electric melting/holding, actual centrifugal casting/cooling, hand clipping and source segregation. The companion uncoated casting exits before separate tumbling/coating. Retain all failed casts, internal remelts, start/stop, idle, spills, cleanup and opening/closing WIP with exchange-level burden vectors. An internal remelt is not new external alloy or fresh scrap production."
      source_ids:
        - tt-casting-2012
        - asl-pewter
        - ilcd-2010
        - nicem-f100-spin-casting-furnace
        - contenti-electric-melting-furnace-manual
    - rule_id: boundary_release
      applies_to: "scrap_release"
      rule: "Keep one original alloy/casting source through clipping, dry separation, necessary manual sizing and representative assay/visual checks. Release only the metallic gate stream meeting the named receiver agreement. Do not pool dross, oxide dust, used solder/paste or other alloys into Q. Receiver identity, contractual material state and actual lot acceptance must be demonstrated; a generic recycler offer is not a lot approval."
      source_ids:
        - nt-white-metals
        - dkl-reception
    - rule_id: boundary_physical
      applies_to: "manufacturing and FG gates"
      rule: "Use the same material state and time cut at every physical gate. Whole-stream manufacturing: Ow + F + Ru + O_air + X = Cw + G_Q + B + Wm + Em. FG: Of + G_Q + Rg = Cf + grossV + Wf. Ow/Cw include every source WIP and unreleased gate; F is first external whole-alloy feed; Ru/Rg are disjoint true returns to WIP/FG; B is actual companion casting; Wm/Wf and Em sum individually identified outgoing wastes/species once. X is only separately named additional mass not already on that same input side; never re-add F or assayed constituents. Combine gates by cancelling G_Q and all internal transfers. Q is normalization, never added again to Cf or grossV. Containers/mould stocks have their separate component gates; wear entering metal is a measured cross-ledger transfer."
      source_ids:
        - ilcd-2010
    - rule_id: boundary_species
      applies_to: "physical and element balances"
      rule: "Close whole physical mass and Sn/Sb/Cu and relevant O/H balances independently. Oxidation oxygen, moisture, actual reaction water, phase/structural water and each emitted species require independent evidence; one residual cannot determine two unknowns. A total-metal assay is not SnO2/Sb2O3/CuO mass; COD/VOC/PM metrics are not invented chemical species. Keep captured mixed dust whole and its source/element partitions non-additive with one provider."
      source_ids:
        - ilcd-2010
    - rule_id: boundary_packaging
      applies_to: "each actual component and physical gate"
      rule: "For each carton, pallet, polyethylene film, polypropylene band, whole supplied paper label and reusable steel container independently, measure all first external physical receipts: purchased P and non-purchased N_ext including supplier-supplied attached articles, first entrusted/borrowed/rented receipts. P remains purchase only. ER requires the same article/cohort previously dispatched externally; P/N_ext/ER are mutually exclusive. Opening stock never replaces a current receipt. Close O + P + N_ext + ER + F_in = C + grossS + EO + W + F_out on that same component/gate. F_in/F_out are independently measured and separately named actual material/water/species or phase-transfer legs crossing this component gate, excluding quantities already in P/N_ext/ER or grossS/EO/W. Include genuine retained contamination or moisture change only when observed; pair each internal cross-ledger transfer with its counterpart and cancel it only at the combined gate. Measure whole contaminated W once with non-additive component/content partitions and one provider. A real new retained-material input is not an OTHER duplicate: X can remove only an exactly duplicated term on the same side. No actual wet operation, reaction yield or quantity is defaulted. O/C include empty stock, attached WIP/FG and reusable stock; grossS is packaging on all physical outward consignments, never net Q. EO is a distinct external return. Internal stores/WIP/FG issues/reuse cancel. Each actual event requires the concrete material/form/type/direction card or interface and measured quantity; a missing interface makes the data package incomplete. A symbol alone, borrowed purchase UUID, invented purchase/return or wholesale duplication cannot repair it."
      source_ids:
        - nt-britannia-2015
        - nt-white-metals
        - ilcd-2010
    - rule_id: boundary_burdens
      applies_to: "components and toll/lease services"
      rule: "Physical receipt, ownership and environmental burden are separate ledgers. Preserve original cohort, exchange-specific inherited vector, supplier-included scope and actual incremental lease/return/cleaning/transport service. Charge embodied manufacture once over evidenced service use, not on each return. Free supply, entrusted goods and customer-owned/toll manufacture are not zero burden, new Q or environmental credit. Apply the full receipt interfaces and same component closure to contract manufacturing and cohort services."
      source_ids:
        - ilcd-2010
    - rule_id: boundary_extension
      applies_to: "all actual exchanges"
      rule: "The named cards define a bounded compatible route, not permission to omit real inputs. Add one named atomic card/interface with measured quantity for each actual unlisted formulation, lubricant, fuel, water circuit, gas, mould-making ingredient, package or species. Verify actual polymer/metal construction; alternative packaging and in-house mould compounding require their own interfaces. Preserve measured absence evidence, not default zero. A purchased complete mould/formulation is counted whole once; on-site preparation records the actual separate purchases and processing."
      source_ids:
        - asl-pewter
        - nt-white-metals
    - rule_id: boundary_service
      applies_to: "cohort_service"
      rule: "Keep actual storage, packing, handling and freight to receiver; preserve old FG burden history, gross outward/reverse movements and real incremental return/rework loads. Reinspection or re-delivery of the same gates does not generate first release again. Purchased service includes its declared provider scope once; do not add its internal fuel or emissions again. No assumed steam/boiler, condensate return, washing, inert gas or melting credit; if real, record each physical flow and heat state with provider water/energy convention."
      source_ids:
        - dkl-reception
        - ilcd-2010
