      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| val_scope | all actual applicable records | Confirm one real Sn-predominant Sn-Sb-Cu source alloy, solid uncoated metallic gates, original casting/hand separation and actual remelt-feed acceptance. Reject tinplate, Cu/Pb/Zn-base material, whole paste and oxide/dross identity substitution. | un-cpc3-2025; asl-pewter; tt-casting-2012; nt-white-metals; dkl-reception |\n| val_reference | all actual applicable records | Q includes each newly first-released net dry alloy lot once, including material remaining in closing FG. Check reference row 1 kg, G_Q/moisture/foreign-material reconciliation, WIP/FG physical gates and cancellation of G_Q/internal transfers. Delivery/reinspection/returns never create Q. | ilcd-2010 |\n| val_normalization | all actual applicable records | Trace raw records through actual unit/rate conversion, allocation and A_j/Q once. Check all Inputs/Output/source links and full descriptions. Q0 and unsupported/unknown relationships retain real loads and unresolved findings, never a passing unit result. Services use original Qc and real H only as driver. | ilcd-2010 |\n| val_mass_species | all actual applicable records | Check independent whole physical, Sn/Sb/Cu and relevant O/H balances with actual phase/species/water evidence. No residual fitting of multiple unknowns, double counting of a whole mixture and its source fractions, or generic metal/PM-to-oxide conversion. Use one provider per real waste transfer. | ilcd-2010 |\n| val_packaging | all actual applicable records | Inspect each actual component event/interface and measured quantity, including supplier-attached nonpurchase/first entrusted/borrowed/rented receipts. P/N_ext/ER are disjoint and ER has prior external dispatch. In production, contract manufacture and services alike, verify O + P + N_ext + ER + F_in = C + grossS + EO + W + F_out on the same component/gate, including empty/WIP/FG/reusable stocks; internal use cancels. Missing real interfaces cannot pass through added symbols, fictitious receipts or duplicate batches. | nt-britannia-2015; ilcd-2010 |\n| val_history | all actual applicable records | Check ownership, original cohort, every inherited exchange vector, supplier-included scope and actual incremental rental/return/cleanup/rework service separately. Preserve original manufacture once and all failed/idle/Q0 loads; no new Q, free-supply zero burden, automatic coproduct or avoided-production credit. | ilcd-2010 |\n| val_bindings | all actual applicable records | Use exact verified Product scrap identity and exact support chain. CN low-voltage AC and air-resource oxygen apply only under their complete native conditions stated in the cards. Unbound concrete auxiliary flows need actual provider/identity verification before package use; ordinary auxiliary UUID gaps do not establish a global methodological hold. Distinguish checks performed/skipped and incomplete real evidence from approval. | ilcd-2010 |\n\n"
