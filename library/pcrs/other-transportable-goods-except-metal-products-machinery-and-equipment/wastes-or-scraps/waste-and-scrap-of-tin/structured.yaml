          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| alloc_subdivide | source and services | This is an attributional allocation scenario. First assign independently measured dedicated casting, segregation, service and treatment operations; use actual/virtual subdivision before allocating joint inventories. Preserve opening/closing WIP and each upstream exchange vector. Do not use a whole-plant mass ratio for every exchange. | ilcd-2010 |\n| alloc_true_joint | positive-value metallic scrap | Identify the true joint process where a material technically most similar to this secondary whole-alloy feed was produced, using actual chemistry/quality and receiving function. It may precede final shaping/hand clipping. Preserve the original casting/forming raw inventory but do not automatically charge every later article-specific step to scrap: demonstrate exchange-specific assignment and carry only its established share, plus genuinely scrap-dedicated preparation/services. No recycling-loop average, rate or substitution model is assumed; an external recycling-average input requires compatible declared upstream methodology and reviewed data. | ilcd-2010 |\n| alloc_causality | remaining joint exchanges | Identify the determining physical relationship separately for each residual exchange at the verified true joint process identified from original alloy production/casting history; do not assume that preparation or sale is the joint gate. Embodied alloy may follow measured material embodiment; holding heat, mould use and shared services require their own demonstrated causal drivers and actual losses. An appealing mass, enthalpy, time or value ratio is not self-justifying. | ilcd-2010 |\n| alloc_residual | only irreducible residual exchanges | Only after showing why determining physical causality cannot resolve a residual exchange may contemporaneous market values in the actual quantity, quality and state at the same common gate be used. Remove downstream finishing, packaging and delivery margins before comparison. Document price period, evidence, uncertainty and sensitivity. No fixed split, arbitrary physical/economic choice or automatic credit. Negative-value wastes and paid treatment require an explicit reviewed waste boundary; never insert a zero or negative allocation factor silently. | ilcd-2010 |\n| alloc_cohorts | rework/returns and reusable components | Keep source-alloy, casting and original cohort burdens once. Internal remelt has real incremental energy/losses and transfers its inherited vector, not a new external purchase. True returns reverse the original delivery allocation where necessary and carry original history; only actual new service/rework loads are added. Packaging P/N_ext/ER uses boundary_packaging independently of purchase or ownership, with the same closure in production and service accounts. Unknown inherited burdens stay explicit and cannot be replaced by zero. | ilcd-2010 |\n| alloc_waste | scrap and associated wastes | Positive-value metallic gates retain their established inherited allocation. Keep dross, dust, spent mould and each packaging waste as distinct physical transfers with actual treatment/provider boundaries. Commercial buyback credits are financial transactions. Neither the name waste nor a recycler offer establishes zero history, avoided virgin production, a coproduct or an environmental credit; downstream metal recovery is outside this reference output. | nt-white-metals; dkl-reception; ilcd-2010 |\n\n"
