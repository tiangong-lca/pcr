measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is newly first-released net dry whole-alloy gate/runner mass from cp_release, not pure Sn content or subsequent delivery/reinspection. released_scrap is 1 kg. G_Q is its actual gross material mass excluding packaging; collect free water and detachable material separately so G_Q = Q + H_Q + J_Q. A dry condition is verified, never assumed."
  - id: raw_conversion
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared physical property"
      uuid: ""
    required_unit: "row-declared unit"
    rule: "Keep raw units and states. Convert masses/energies once; integrate actual rates only. Cumulative gas/liquid volume is not multiplied by time. Use independently measured substance density at the measured temperature/pressure/composition, not water density or a secondary property factor. Item counts require measured component tare masses and configuration; no assumed kg/item."
  - id: single_division
    applies_to: "alloy_ingot; casting_electricity; silicone_mould; talc_release; oxygen_uptake; uncoated_casting; unreleased_gates; casting_dross; filter_dust; spent_mould; sn_o2_air; sb_o3_air; cu_o_air; gates_to_release; released_scrap; rejected_metal"
    required_property_ref:
      name: "Declared physical property"
      uuid: ""
    required_unit: "per reference flow"
    rule: "Collection protocols retain undivided raw amounts. calc_convert and calc_assign establish each exchange numerator A_j; calc_once performs A_j / Q exactly once. Cards and aggregation refer to that same calculation, not a second division. Q=0 retains actual loads and carries/attributes them transparently without a unit result."
  - id: service_basis
    applies_to: "cohort_service"
    required_property_ref:
      name: "Declared physical property"
      uuid: ""
    required_unit: "per reference flow"
    rule: "Actual post-release services use the original cohort denominator Qc via calc_service. H is a measured service driver such as area-time or gross-load distance, never a new production denominator. No new Q is created by storage, packing, return or rework."
  - id: electricity_identity
    applies_to: "casting_electricity, service_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "The selected AC record is only CN grid-average consumption supply to users at <1 kV. Energy group 93a60a57-a3c8-11da-a746-0800200c9a66 references MJ and includes kWh factor 3.6. Verify actual geography/voltage and upstream provider inclusions; otherwise replace the binding after direct verification. This energy property supplies no fuel or combustion factor."
