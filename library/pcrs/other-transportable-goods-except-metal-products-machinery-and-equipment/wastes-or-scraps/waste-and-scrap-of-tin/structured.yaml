      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Whole identified pre-alloyed solid Sn-Sb-Cu casting ingot/bar, plus original WIP/mould/component stocks and vectors |\n| starting_condition_role | Upstream alloy production is linked once; original foreground casting and gate formation remain explicit |\n| product_classification_scope | Narrow single-source metallic tin-base casting-gate subset of CPC3.0:39366 |\n| recursive_input_rule | Genuine external same-category feed needs its own inherited vector and explicit route review. Internal gates/remelts cancel; neither recursion nor waste status erases history. |\n| upstream_dataset_requirement | One compatible provider per actual whole supply/service; actual geography, alloy/form and included scope. No fabricated recipe or borrowed primary/secondary metal process. |\n| disclosure | one original alloy lot and source casting cohort; whole Sn-Sb-Cu assay and tin-predominance evidence; supplier ingot/bar form and upstream exchange burden vector; no added-lead specification and actual trace analysis; actual mould material and curing/procurement boundary; melting/holding and clipping configuration; dry metallic gate/runner shape with no finishing coating or flux paste; actual receiver identity and feed acceptance conditions; site and reporting period; first-release Q and physical G_Q link; moisture and detachable contamination measurements; opening/closing WIP and FG cohort vectors; gross physical dispatch and return history; failed/Q0/start-stop/idle/cleanup/rework loads; electricity voltage and geography and provider scope; every real material and species and destination; per-component packaging P/N_ext/ER events and burden ownership; allocation common gate and service Qc history |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_origin | whole product chain | Retain alloy production through a compatible linked upstream dataset plus the actual original casting that creates gates. Receive the whole purchased alloy once; Sn/Sb/Cu assays and alloy water are non-additive child accounts. Actual in-house alloying requires each external metal, each real formulation, energy and losses as its own added row before use. No finished-scrap purchase shortcut. | asl-pewter; nt-britannia-2015; ilcd-2010 |\n| boundary_casting | source_casting | Include whole-alloy receipt and unloading, actual mould preparation and lifetime use, electric melting/holding, actual centrifugal casting/cooling, hand clipping and source segregation. The companion uncoated casting exits before separate tumbling/coating. Retain all failed casts, internal remelts, start/stop, idle, spills, cleanup and opening/closing WIP with exchange-level burden vectors. An internal remelt is not new external alloy or fresh scrap production. | tt-casting-2012; asl-pewter; ilcd-2010; nicem-f100-spin-casting-furnace; contenti-electric-melting-furnace-manual |\n| boundary_release | scrap_release | Keep one original alloy/casting source through clipping, dry separation, necessary manual sizing and representative assay/visual checks. Release only the metallic gate stream meeting the named receiver agreement. Do not pool dross, oxide dust, used solder/paste or other alloys into Q. Receiver identity, contractual material state and actual lot acceptance must be demonstrated; a generic recycler offer is not a lot approval. | nt-white-metals; dkl-reception |\n| boundary_physical | manufacturing and FG gates | Use the same material state and time cut at every physical gate. Whole-stream manufacturing: Ow + F + Ru + O_air + X = Cw + G_Q + B + Wm + Em. FG: Of + G_Q + Rg = Cf + grossV + Wf. Ow/Cw include every source WIP and unreleased gate; F is first external whole-alloy feed; Ru/Rg are disjoint true returns to WIP/FG; B is actual companion casting; Wm/Wf and Em sum individually identified outgoing wastes/species once. X is only separately named additional mass not already on that same input side; never re-add F or assayed constituents. Combine gates by cancelling G_Q and all internal transfers. Q is normalization, never added again to Cf or grossV. Containers/mould stocks have their separate component gates; wear entering metal is a measured cross-ledger transfer. | ilcd-2010 |\n| boundary_species | physical and element balances | Close whole physical mass and Sn/Sb/Cu and relevant O/H balances independently. Oxidation oxygen, moisture, actual reaction water, phase/structural water and each emitted species require independent evidence; one residual cannot determine two unknowns. A total-metal assay is not SnO2/Sb2O3/CuO mass; COD/VOC/PM metrics are not invented chemical species. Keep captured mixed dust whole and its source/element partitions non-additive with one provider. | ilcd-2010 |\n| boundary_packaging | each actual component and physical gate | For each carton, pallet, polyethylene film, polypropylene band, whole supplied paper label and reusable steel container independently, measure all first external physical receipts: purchased P and non-purchased N_ext including supplier-supplied attached articles, first entrusted/borrowed/rented receipts. P remains purchase only. ER requires the same article/cohort previously dispatched externally; P/N_ext/ER are mutually exclusive. Opening stock never replaces a current receipt. Close O + P + N_ext + ER + F_in = C + grossS + EO + W + F_out on that same component/gate. F_in/F_out are independently measured and separately named actual material/water/species or phase-transfer legs crossing this component gate, excluding quantities already in P/N_ext/ER or grossS/EO/W. Include genuine retained contamination or moisture change only when observed; pair each internal cross-ledger transfer with its counterpart and cancel it only at the combined gate. Measure whole contaminated W once with non-additive component/content partitions and one provider. A real new retained-material input is not an OTHER duplicate: X can remove only an exactly duplicated term on the same side. No actual wet operation, reaction yield or quantity is defaulted. O/C include empty stock, attached WIP/FG and reusable stock; grossS is packaging on all physical outward consignments, never net Q. EO is a distinct external return. Internal stores/WIP/FG issues/reuse cancel. Each actual event requires the concrete material/form/type/direction card or interface and measured quantity; a missing interface makes the data package incomplete. A symbol alone, borrowed purchase UUID, invented purchase/return or wholesale duplication cannot repair it. | nt-britannia-2015; nt-white-metals; ilcd-2010 |\n| boundary_burdens | components and toll/lease services | Physical receipt, ownership and environmental burden are separate ledgers. Preserve original cohort, exchange-specific inherited vector, supplier-included scope and actual incremental lease/return/cleaning/transport service. Charge embodied manufacture once over evidenced service use, not on each return. Free supply, entrusted goods and customer-owned/toll manufacture are not zero burden, new Q or environmental credit. Apply the full receipt interfaces and same component closure to contract manufacturing and cohort services. | ilcd-2010 |\n| boundary_extension | all actual exchanges | The named cards define a bounded compatible route, not permission to omit real inputs. Add one named atomic card/interface with measured quantity for each actual unlisted formulation, lubricant, fuel, water circuit, gas, mould-making ingredient, package or species. Verify actual polymer/metal construction; alternative packaging and in-house mould compounding require their own interfaces. Preserve measured absence evidence, not default zero. A purchased complete mould/formulation is counted whole once; on-site preparation records the actual separate purchases and processing. | asl-pewter; nt-white-metals |\n| boundary_service | cohort_service | Keep actual storage, packing, handling and freight to receiver; preserve old FG burden history, gross outward/reverse movements and real incremental return/rework loads. Reinspection or re-delivery of the same gates does not generate first release again. Purchased service includes its declared provider scope once; do not add its internal fuel or emissions again. No assumed steam/boiler, condensate return, washing, inert gas or melting credit; if real, record each physical flow and heat state with provider water/energy convention. | dkl-reception; ilcd-2010 |\n\n"
