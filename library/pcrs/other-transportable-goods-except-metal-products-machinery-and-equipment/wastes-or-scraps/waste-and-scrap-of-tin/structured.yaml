  calculation_rules:
    - id: calc_release
      applies_to: "released_scrap"
      rule: "Q = sum of unique newly first-released net dry whole-alloy gate masses from cp_release. Preserve G_Q = Q + H_Q + J_Q and original lot IDs; physical FG closure uses G_Q and counts closing FG once. Returns/reinspection/services do not add Q."
      inputs:
        - cp_release
        - G_Q
        - H_Q
        - J_Q
      output: "Q"
      source_ids:
        - ilcd-2010
    - id: calc_convert
      applies_to: "all inventory rows"
      rule: "Convert each undivided raw row to its declared numerator unit once using measured substance states. Electricity in kWh uses 3.6 MJ/kWh. For an actual heavy-lorry service, raw t km = measured whole cargo kg * distance km / 1000 before allocation. Integrate rates only; cumulative volumes already contain time."
      inputs:
        - cp_material
        - cp_energy
        - cp_species
        - cp_service
        - cp_waste
      output: "converted raw row amounts"
      source_ids:
        - ilcd-2010
    - id: calc_assign
      applies_to: "all inventory rows"
      rule: "For each exchange j, reconcile opening inherited vector + genuine current receipts/current incremental loads + measured internal transfers = closing carried vector + vectors assigned to actual outputs/wastes/services. Internal quantity and vector transfers cancel on consolidation. Apply alloc_subdivide then alloc_causality and only justified alloc_residual to remaining joint loads. Preserve all Q0/failed/idle/cleanup/rework loads. For manufacturing, A_j is the burden numerator assigned to newly first-released Q after carrying closing WIP, not gross physical output and not a fictitious negative credit. For actual services retain the distinct original-cohort A_service_j; only calc_service normalizes it."
      inputs:
        - "converted raw row amounts"
        - cp_material
        - cp_release
        - "allocation records"
        - "opening and closing exchange vectors"
      output: "A_j"
      source_ids:
        - ilcd-2010
    - id: calc_once
      applies_to: "alloy_ingot; casting_electricity; silicone_mould; talc_release; oxygen_uptake; uncoated_casting; unreleased_gates; casting_dross; filter_dust; spent_mould; sn_o2_air; sb_o3_air; cu_o_air; gates_to_release; released_scrap; rejected_metal"
      rule: "unit_exchange_j = A_j / Q, only for Q > 0. Perform this one division once after raw conversion and allocation. The reference output is 1 kg. Cards and protocol aggregation cite this same result; Q = 0 retains actual loads without a unit result. Internal transfer rows retain audit quantities and cancel in the consolidated product dataset."
      inputs:
        - A_j
        - Q
      output: "unit_exchange_j"
      source_ids:
        - ilcd-2010
    - id: calc_service
      applies_to: "cohort_service"
      rule: "service_exchange_j = actual allocated incremental service numerator A_service_j / original cohort Qc, once and only where Qc > 0. Use actual driver H to assign common service, not to create production output. Carry the original production vector once; packaging P/N_ext/ER and grossS/EO/W remain physical raw ledgers independent of burden assignment. Unknown Qc or inherited vector stays incomplete."
      inputs:
        - cp_service
        - "original Qc"
        - "actual H"
        - A_service_j
        - "component ledgers"
      output: "service_exchange_j"
      source_ids:
        - ilcd-2010
    - id: calc_packaging
      applies_to: "cohort_service"
      rule: "For each material/form component at one physical gate, O + P + N_ext + ER + F_in = C + grossS + EO + W + F_out; P is true purchase, N_ext genuine nonpurchase first receipt, ER proven return after earlier outward movement. Count attached WIP/FG and reusable stock in O/C, cancel internal issues/reuse, and independently transfer each cohort exchange vector. Never use net Q as grossS or use a symbol in place of an actual missing interface."
      inputs:
        - cp_pack_carton
        - cp_pack_pallet
        - cp_pack_film
        - cp_pack_band
        - cp_pack_label
        - cp_pack_container
      output: "component physical closures and exchange-vector lineage"
      source_ids:
        - ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all actual inputs and outputs"
      requirement: "Native identity and supplier/process compatibility require full formal name, type, route, form, CAS where real, geography, grade and all comments/properties. A classification label alone proves neither composition nor form. Preserve official Chinese names for adopted UUIDs."
      evidence: "Full direct records and exact property/unit-group references; supplier assays and route records"
    - id: dq_complete
      applies_to: "complete chain"
      requirement: "Collect real complete-period values and original vectors including no-output states, WIP/FG, external receipts and every packaging event. Missing actual atomic interfaces or unmeasured burdens remain incomplete; no default zero, guessed density/recipe or pooled other flows."
      evidence: "Event-level inventories; gate reconciliations; source and service history"
    - id: dq_evidence
      applies_to: "sources and receiving gate"
      requirement: "Qualitative sources establish compatible operations only. Independently establish actual alloy composition, uncoated metallic form, receiver identity/specification and batch acceptance; document temporal/geographic representativeness and uncertainties. No scientific approval follows from engineering checks."
      evidence: "Primary source context; actual tests/contract; uncertainty records"
validation_rules:
  - rule_id: val_scope
    applies_to: "all actual applicable records"
    rule: "Confirm one real Sn-predominant Sn-Sb-Cu source alloy, solid uncoated metallic gates, original casting/hand separation and actual remelt-feed acceptance. Reject tinplate, Cu/Pb/Zn-base material, whole paste and oxide/dross identity substitution."
    source_ids:
      - un-cpc3-2025
      - asl-pewter
      - tt-casting-2012
      - nt-white-metals
      - dkl-reception
  - rule_id: val_reference
    applies_to: "all actual applicable records"
    rule: "Q includes each newly first-released net dry alloy lot once, including material remaining in closing FG. Check reference row 1 kg, G_Q/moisture/foreign-material reconciliation, WIP/FG physical gates and cancellation of G_Q/internal transfers. Delivery/reinspection/returns never create Q."
    source_ids:
      - ilcd-2010
  - rule_id: val_normalization
    applies_to: "all actual applicable records"
    rule: "Trace raw records through actual unit/rate conversion, allocation and A_j/Q once. Check all Inputs/Output/source links and full descriptions. Q0 and unsupported/unknown relationships retain real loads and unresolved findings, never a passing unit result. Services use original Qc and real H only as driver."
    source_ids:
      - ilcd-2010
  - rule_id: val_mass_species
    applies_to: "all actual applicable records"
    rule: "Check independent whole physical, Sn/Sb/Cu and relevant O/H balances with actual phase/species/water evidence. No residual fitting of multiple unknowns, double counting of a whole mixture and its source fractions, or generic metal/PM-to-oxide conversion. Use one provider per real waste transfer."
    source_ids:
      - ilcd-2010
  - rule_id: val_packaging
    applies_to: "all actual applicable records"
    rule: "Inspect each actual component event/interface and measured quantity, including supplier-attached nonpurchase/first entrusted/borrowed/rented receipts. P/N_ext/ER are disjoint and ER has prior external dispatch. In production, contract manufacture and services alike, verify O + P + N_ext + ER + F_in = C + grossS + EO + W + F_out on the same component/gate, including empty/WIP/FG/reusable stocks; internal use cancels. Missing real interfaces cannot pass through added symbols, fictitious receipts or duplicate batches."
    source_ids:
      - nt-britannia-2015
      - ilcd-2010
  - rule_id: val_history
    applies_to: "all actual applicable records"
    rule: "Check ownership, original cohort, every inherited exchange vector, supplier-included scope and actual incremental rental/return/cleanup/rework service separately. Preserve original manufacture once and all failed/idle/Q0 loads; no new Q, free-supply zero burden, automatic coproduct or avoided-production credit."
    source_ids:
      - ilcd-2010
  - rule_id: val_bindings
    applies_to: "all actual applicable records"
    rule: "Use exact verified Product scrap identity and exact support chain. CN low-voltage AC and air-resource oxygen apply only under their complete native conditions stated in the cards. Unbound concrete auxiliary flows need actual provider/identity verification before package use; ordinary auxiliary UUID gaps do not establish a global methodological hold. Distinguish checks performed/skipped and incomplete real evidence from approval."
    source_ids:
      - ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual compatible remelting-feed input for one source-segregated metallic Sn-Sb-Cu gate specification"
  allowed_use: "Attributional modelling with disclosed historical allocation, source/receiver fit and actual cohort services"
  excluded_use: "Whole-leaf coverage; tinplate/dross/paste/other-alloy substitutes; default recipe or density; zero-history or avoided-production credit; legal/technical approval from this PCR alone"
  required_metadata: "one original alloy lot and source casting cohort; whole Sn-Sb-Cu assay and tin-predominance evidence; supplier ingot/bar form and upstream exchange burden vector; no added-lead specification and actual trace analysis; actual mould material and curing/procurement boundary; melting/holding and clipping configuration; dry metallic gate/runner shape with no finishing coating or flux paste; actual receiver identity and feed acceptance conditions; site and reporting period; first-release Q and physical G_Q link; moisture and detachable contamination measurements; opening/closing WIP and FG cohort vectors; gross physical dispatch and return history; failed/Q0/start-stop/idle/cleanup/rework loads; electricity voltage and geography and provider scope; every real material and species and destination; per-component packaging P/N_ext/ER events and burden ownership; allocation common gate and service Qc history"
  required_quality_disclosure: "Full primary context, actual measured inventory and provider scope, all unresolved atomic identities and unmeasured values, allocation uncertainty, all performed/skipped checks and limitations"
  update_trigger: "Change of original alloy/source, casting/mould/energy route, receiving feed agreement, contamination/preparation, burden/allocation method or component/service receipt boundary"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations, CPC 3.0 Structure and Explanatory Notes, 30 June 2025, PDF pp.203–204; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification context: tin scrap versus ferrous scrap and non-ferrous ash/residue; no alloy assay or acceptance specification."
  - id: "asl-pewter"
    type: "extension_guidance"
    reference: "ASL Pewter, What is Pewter?, full manufacturer page; https://aslpewter.com/what-is-pewter/"
    used_for: "Independent real Sn-Sb-Cu casting-alloy example, whole purchased ingots and actual melting/casting; mould alternatives. Composition is an example, not a prescribed recipe."
  - id: "tt-casting-2012"
    type: "extension_guidance"
    reference: "T and T Designs, Casting Pewter – Made in the U.S.A., 3 May 2012; https://tandtinc.wordpress.com/2012/05/03/pewter-casting-made-in-the-u-s-a/"
    used_for: "Actual rubber-mould centrifugal casting and hand separation from a casting ring before tumbling/plating; no material recipe or present factory inventory."
  - id: "nt-britannia-2015"
    type: "extension_guidance"
    reference: "Nathan Trotter, Britannia Pewter Metal, Rev.3 (2015), complete p.1; https://nathantrotter.com/wp-content/uploads/2020/06/Britannia-Pewter-Metal-Data.pdf"
    used_for: "Real solid Sn-Sb-Cu notch-bar/ingot supply, shipment analysis and separate box/pallet/wrap/band/label articles. Typical chemical limits and printed density/unit data are not factory defaults."
  - id: "nt-white-metals"
    type: "extension_guidance"
    reference: "Nathan Trotter, Pewter & White Metal Casting Alloys, complete single-page manufacturer flyer; https://nathantrotter.com/wp-content/uploads/2020/06/Pewter-white-metal-product-flyer2.pdf"
    used_for: "Tin-based casting-alloy supply, sample analysis and scrap buyback. Adjacent zinc-base and Sn-Bi variants and differing table headings prevent treating all pewters as one composition. Commercial credits are not environmental credits."
  - id: "dkl-reception"
    type: "extension_guidance"
    reference: "DKL Metals, Solder Analysis and Recycling Services, full manufacturer/recycler page; https://dklmetals.co.uk/solder-analysis-and-recycling-services/"
    used_for: "Express reception of pewter scrap/manufacturing offcuts and analysis services; dross is a separate material/route. A general offer does not approve a specific lot."
  - id: "ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for LCA – Detailed guidance, first edition March 2010, §§7.9.2–7.9.3 and Annex 14.4; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctionality: subdivision, exchange-specific determining physical causality, residual common-gate value and waste/recycling context; no fixed allocation or automatic substitution."
  - id: "nicem-f100-spin-casting-furnace"
    type: "extension_guidance"
    reference: "Nicem SpA, F 100 SPIN CASTING, undated complete two-page manufacturer sheet; https://www.nicem.it/wp-content/uploads/2019/10/F-100-SC-E.pdf"
    used_for: "Qualitative compatibility of electrically heated, temperature-controlled tin-alloy melting equipment with pewter manufacture and an associated spin-casting line. No model specification or factory equipment observation is adopted."
  - id: "contenti-electric-melting-furnace-manual"
    type: "extension_guidance"
    reference: "The Contenti Company, Electric Melting Furnace: for gold, silver, copper-based, and tin-based alloys, undated complete four-page manual, especially pp.1–3 and operation steps 6–10; https://contenti.com/pub/media/catalog/pdf/instructions/170-84X-instr.pdf"
    used_for: "Electrical melting and regulation around a chosen heating-chamber setpoint, supporting the qualitative electric melt/hold operating configuration. No measured melt temperature, energy use or specific-factory equipment claim."
