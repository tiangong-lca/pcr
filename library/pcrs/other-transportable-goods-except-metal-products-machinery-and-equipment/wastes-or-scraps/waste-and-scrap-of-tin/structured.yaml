allocation_rules:
  - rule_id: alloc_subdivide
    applies_to: "source and services"
    rule: "This is an attributional allocation scenario. First assign independently measured dedicated casting, segregation, service and treatment operations; use actual/virtual subdivision before allocating joint inventories. Preserve opening/closing WIP and each upstream exchange vector. Do not use a whole-plant mass ratio for every exchange."
    source_ids:
      - ilcd-2010
  - rule_id: alloc_true_joint
    applies_to: "positive-value metallic scrap"
    rule: "Identify the true joint process where a material technically most similar to this secondary whole-alloy feed was produced, using actual chemistry/quality and receiving function. It may precede final shaping/hand clipping. Preserve the original casting/forming raw inventory but do not automatically charge every later article-specific step to scrap: demonstrate exchange-specific assignment and carry only its established share, plus genuinely scrap-dedicated preparation/services. No recycling-loop average, rate or substitution model is assumed; an external recycling-average input requires compatible declared upstream methodology and reviewed data."
    source_ids:
      - ilcd-2010
  - rule_id: alloc_causality
    applies_to: "remaining joint exchanges"
    rule: "Identify the determining physical relationship separately for each residual exchange at the verified true joint process identified from original alloy production/casting history; do not assume that preparation or sale is the joint gate. Embodied alloy may follow measured material embodiment; holding heat, mould use and shared services require their own demonstrated causal drivers and actual losses. An appealing mass, enthalpy, time or value ratio is not self-justifying."
    source_ids:
      - ilcd-2010
  - rule_id: alloc_residual
    applies_to: "only irreducible residual exchanges"
    rule: "Only after showing why determining physical causality cannot resolve a residual exchange may contemporaneous market values in the actual quantity, quality and state at the same common gate be used. Remove downstream finishing, packaging and delivery margins before comparison. Document price period, evidence, uncertainty and sensitivity. No fixed split, arbitrary physical/economic choice or automatic credit. Negative-value wastes and paid treatment require an explicit reviewed waste boundary; never insert a zero or negative allocation factor silently."
    source_ids:
      - ilcd-2010
  - rule_id: alloc_cohorts
    applies_to: "rework/returns and reusable components"
    rule: "Keep source-alloy, casting and original cohort burdens once. Internal remelt has real incremental energy/losses and transfers its inherited vector, not a new external purchase. True returns reverse the original delivery allocation where necessary and carry original history; only actual new service/rework loads are added. Packaging P/N_ext/ER uses boundary_packaging independently of purchase or ownership, with the same closure in production and service accounts. Unknown inherited burdens stay explicit and cannot be replaced by zero."
    source_ids:
      - ilcd-2010
  - rule_id: alloc_waste
    applies_to: "scrap and associated wastes"
    rule: "Positive-value metallic gates retain their established inherited allocation. Keep dross, dust, spent mould and each packaging waste as distinct physical transfers with actual treatment/provider boundaries. Commercial buyback credits are financial transactions. Neither the name waste nor a recycler offer establishes zero history, avoided virgin production, a coproduct or an environmental credit; downstream metal recovery is outside this reference output."
    source_ids:
      - nt-white-metals
      - dkl-reception
      - ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "source_casting"
      flow_role: "one atomic alloy/mould/talc/companion/internal-transfer row"
      record_type: "foreground_record"
      raw_fields: "row_id; lot; source; event type; raw amount and unit; opening/closing stock; whole assay; moisture; companion mass; internal remelt IDs; exchange burden vector; provider included scope"
      collection_method: "Weigh complete actual articles/streams on calibrated scales; reconcile receipts, casting logs, hand-clipping transfers and stock counts; certify the one alloy lot and actual mould material. Preserve every failed/idle/cleanup batch. Measure lifetime mould use and actual wear, not assumed cycle count."
      unit: "kg"
      frequency: "each event and stock cut"
      temporal_coverage: "complete reporting period and relevant original cohorts"
      site_scope: "one identified casting source and linked preparation facility"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; supplier certificate; source ledger; original upstream exchange vectors"
    - protocol_id: cp_release
      process_id: "scrap_release"
      flow_role: "released_scrap and physical G_Q"
      record_type: "foreground_record"
      raw_fields: "source lot; new first-release IDs; G_Q; H_Q; J_Q; Q; opening/closing WIP; opening/closing FG; grossV; Ru/Rg with earlier delivery IDs; acceptance tests; exchange burden history"
      collection_method: "Calibrated net/gross/tare weighing and representative moisture/foreign-material/composition tests, with actual receiver specification, lot records and photos. Deduplicate original first-release events; reconcile G_Q and dry Q before counting. Keep physical and service movements distinct."
      unit: "kg"
      frequency: "each lot and reporting cut"
      temporal_coverage: "all first-release lots plus original history of returns/stocks"
      site_scope: "casting-to-receiver traceable chain"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "receiver agreement; assay; tare/moisture records; unique release registry; WIP/FG vectors"
    - protocol_id: cp_energy
      process_id: "source_casting"
      flow_role: "casting_electricity"
      record_type: "foreground_record"
      raw_fields: "meter; start/end reading; raw kWh or MJ; actual power rate/time if used; equipment state; cohort; allocation driver; voltage; geography; provider scope"
      collection_method: "Submeter melting/holding/casting/ventilation and preparation; reconcile bills and meter coverage, including failed/Q0/start-stop/idle/cleanup/rework. Integrate only actual measured power rates; do not use nameplate rating as consumption."
      unit: "MJ"
      frequency: "each meter interval"
      temporal_coverage: "all operating and non-output states in period"
      site_scope: "actual site; electrical service boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; bill reconciliation; voltage/provider records"
    - protocol_id: cp_waste
      process_id: "source_casting"
      flow_role: "each actual atomic waste row"
      record_type: "foreground_record"
      raw_fields: "row_id; whole raw mass; moisture; metal/oxide phase assays; destination; provider; transfer date; opening/closing waste stock; original source and vector"
      collection_method: "Weigh each segregated actual waste and obtain representative phase/element analysis; reconcile internal rework and off-site consignment separately. Whole mixed dust/dross and its component partitions are never added together."
      unit: "kg"
      frequency: "each generation/transfer and stock cut"
      temporal_coverage: "complete period including failed batches"
      site_scope: "casting/preparation and actual receiving providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; assays; provider scope; treatment records"
    - protocol_id: cp_species
      process_id: "source_casting"
      flow_role: "oxygen uptake and each emitted molecule"
      record_type: "foreground_record"
      raw_fields: "species; compartment; phase; measured concentration and basis; integrated volume or actual rate/time; temperature; absolute pressure; wet/dry state; speciation test; detection limit; independent O/H/Sn/Sb/Cu evidence"
      collection_method: "Use actual emission/speciation measurements and independent oxygen/phase data. Convert concentration with matching cumulative volume once, or integrate genuine rates once; determine mass on the actual species basis. Record genuine absence/inconclusive results. Add every other real species and water state as its own row before claiming completeness."
      unit: "kg"
      frequency: "representative measured operating states and each event"
      temporal_coverage: "startup/steady/idle/cleanup/rework coverage"
      site_scope: "actual air intake/stack/fugitive compartments"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "speciation method; laboratory QA; measured volumes; independent balance"
    - protocol_id: cp_service
      process_id: "cohort_service"
      flow_role: "one actual electricity, freight or covered-steel-container rental service"
      record_type: "foreground_record"
      raw_fields: "row_id; original cohort; Qc; service date; undivided energy; actual container-days and rental terms; actual gross cargo mass; distance; empty/reverse trip; H; driver; provider included scope; return/rework increment"
      collection_method: "Meter actual services and use real vehicle/weigh/distance logs and storage records. Retain original production vector; determine extra service burdens separately without resetting Qc. Purchased freight contains its internal fuel/emissions once. Packaging P/N_ext/ER uses the component protocols even for toll/lease service."
      unit: "row-declared unit"
      frequency: "every actual service event"
      temporal_coverage: "original cohort life and actual service period"
      site_scope: "facility and named receiver supply routes"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "service meter/log; provider contract; original Qc/vector; reverse-trip evidence"
    - protocol_id: cp_pack_carton
      process_id: "cohort_service"
      flow_role: "Corrugated fibreboard shipping carton"
      record_type: "foreground_record"
      raw_fields: "component carton; event ID; material/form/type/direction; measured raw kg and count/tare if used; O_empty/O_WIP/O_FG/O_reusable; P; N_ext and nonpurchase kind; ER and prior outward ID; C_empty/C_WIP/C_FG/C_reusable; grossS; EO; W; independently measured F_in/F_out material/water/species/phase transfers and paired cross-ledger IDs; internal issue/reuse IDs; ownership; original cohort; exchange inherited vector; supplier included scope; real incremental rental/return service"
      collection_method: "Physically weigh this one actual component and identify every receipt/dispatch, including supplier-attached and first entrusted/borrowed/rented articles. Route to its purchase, first_nonpurchase or external_return card using actual history; never duplicate a consignment. Audit O + P + N_ext + ER + F_in = C + grossS + EO + W + F_out at the same gate using independently measured non-overlapping change legs and actual atomic interfaces; internal stores/WIP/FG/reuse cancel. Verify actual material; a missing alternative component interface is incomplete data."
