review_metadata:
  component_physical_review: "Every hard packaging gate includes independently measured non-overlapping F_in/F_out actual material, water, species and phase transfers alongside full P/N_ext/ER receipts, stocks and grossS/EO/W. Pair cross-ledger transfers; measure whole contaminated W once with non-additive contents and one provider. Same-side OTHER deduplication X cannot erase a genuine new retained-material input; no wet operation, reaction yield or quantity is assumed."
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scientific_review: pending
  translation_review: pending; zh-CN aligned only
  scope_decision: One original uncoated metallic Sn-Sb-Cu casting-gate stream for remelting. Full separate 1337-material checked51
    and 1476-material upstream scans, plus 633 frozen intake/reviewed/repaired English records; nearby metal product and scrap
    methods have different original materials, route or accepted terminal. No new identity, mapping acceptance or whole-leaf
    coverage claimed.
  evidence_synthesis: Compatible full primary manufacturer sources support whole tin-base alloy supply, actual casting/hand
    separation and remelting reception; no same-SKU/factory/order claim or default composition/density/yield. Primary numerical
    tables and neighbouring zinc/Sn-Bi alternatives were checked; no quantitative recipe is adopted.
