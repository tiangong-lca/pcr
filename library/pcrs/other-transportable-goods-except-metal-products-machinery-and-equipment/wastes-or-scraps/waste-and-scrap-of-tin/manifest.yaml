  native_binding_conditions:
    released_scrap: Product; Production mix at plant; Unspecified treatment; no fixed native CAS/grade/form/geography; narrowed
      to documented metallic Sn-Sb-Cu gates, not pure Sn or oxides/paste.
    electricity: CN, <1 kV, consumption mix to user, grid-average; exact Net calorific value reference supports MJ; actual
      provider/voltage/site fit required.
    oxygen: Elementary O2, CAS 7782-44-7, resource from air / renewable element resources from air; only independently established
      molecular oxygen uptake, not purchased or emission flow.
  rejected_candidates:
    lead_tin_antimony: '89b65063-ab84-4e05-b2a6-b468fb888d15: formal name and complete comments identify lead-base alloy;
      not compatible Sn-Sb-Cu ingot.'
    steel_container: '7810ea8c-73ab-4586-9476-41c6670fa4db and two steel-drum alternatives: reference property is CTUe, not
      Mass; none adopted.'
    tin_longterm: '08a91e70-3ddc-11dd-998c-0050c2490048: long-term air compartment cannot stand for current casting emissions;
      compound speciation remains independent.'
    talc_elementary: f948f5e3-e2c6-4a68-9f67-e6154d2c0a3f is an air emission, not a powder purchase; fixed purity/size product
      also not assumed.
  ordinary_data_gaps: Future site quantities, receiver lot acceptance, actual mould/material variants, component nonpurchase
    receipts, historical exchange vectors and actual provider fit must be collected; no factory numbers are invented. Each
    real additional component/recipe/species requires its own measured atomic interface.
