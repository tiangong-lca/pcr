allocation_rules:
  - rule_id: allocation_goal
    applies_to: "all processes"
    rule: "Use attributional accounting. First identify actual functions and separate dedicated operations or virtual subdivisions, including source sawmill, drying, briquette production and FG services. Assign each exclusive input and its embodied components to its actual recipient without allocating the entire plant by one arbitrary mass fraction."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_physical
    applies_to: "remaining multifunctional exchanges"
    rule: "After subdivision, determine for each remaining exchange whether a quantified physical causality actually determines its existence and quantity. Distinguish embodied wood/water, process electricity, transport and storage. A correlation with product mass, market value or heating value alone is not causality. Keep losses and non-valued outputs in the relationship; wet mass, dry wood, time or energy cannot be freely chosen as alternative whole-process keys."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_residual
    applies_to: "genuinely residual shared exchanges"
    rule: "Only the unresolved remainder after the preceding steps may use contemporaneous quantities and market values in the actual conditions at one common allocation gate. Remove downstream drying/packing/transport value when reconciling a later quoted price back to that gate. Document quantities, prices, currency/date and uncertainty and test sensitivity. A negative-value treatment function requires explicit functional/boundary review; do not invent a positive product price, fixed ratio or substitution credit."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_recycle
    applies_to: "fines rejects and returns"
    rule: "Internal compatible fines retain their load vector and circulation energy; no second raw purchase, avoided burden or new reference output is created. Externally sent rejects have actual treatment/provider destinations. Document any real saleable coproduct and reassess allocation before use; a waste flow name never proves zero burden or environmental credit. Keep biogenic uptake, stored carbon and actual species releases distinct, without automatic carbon neutrality."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_supply
      process_id: "p_manufacture"
      flow_role: "sawdust_input; inbound_transport"
      record_type: "supplier_and_weighing"
      raw_fields: "source mill and actual species; untreated declaration; source operation and waste status; supplier and reference amount; source allocation vector; prior drying raw inputs and heat source and water phases and dust and losses; moisture tests and basis; gross and tare mass; transport truck and distance and load; supply boundary"
      collection_method: "Trace original sawmill and drying records and one compatible upstream provider. Weigh incoming lots on calibrated scales and sample moisture/size. Verify actual 30-ton diesel transport when that UUID is used; isolate transport already included upstream to prevent double counting. Retain raw receipt masses and trip activity before conversion/allocation; carry source burden by lot; no division by Q_c."
      unit: "kg; kg*km; moisture fraction"
      frequency: "each lot and trip"
      temporal_coverage: "complete production period and inherited upstream periods"
      site_scope: "source mill/drying supplier and actual receiving site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge calibration; moisture test; supplier route and source allocation evidence"
    - protocol_id: cp_release
      process_id: "p_manufacture"
      flow_role: "finished_briquette"
      record_type: "first_release"
      raw_fields: "lot ID; previous acceptance ID check; time; release gross and actual film/tare; net mass; moisture method and wet/dry basis; dimensions; quality tests and target; no binder and route; disposition; Q_c cohort register"
      collection_method: "Weigh cooled inspected initially packed briquettes on calibrated scales and subtract actual wrappers; release only against declared actual specification and batch records. Deduplicate earlier accepted lots including returns. Sum unique net first-release masses as Q_c; retain closing FG as a destination within that total; no extra yield or shipment denominator."
      unit: "kg"
      frequency: "each first-release event"
      temporal_coverage: "complete cohort production period"
      site_scope: "actual manufacturing and release gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; release specification; batch register; rejection and return links"
    - protocol_id: cp_energy
      process_id: "p_manufacture"
      flow_role: "prep_electricity; press_electricity; finish_electricity"
      record_type: "meters"
      raw_fields: "meter ID; start/end readings; original unit; true power rates and time if applicable; equipment stage; operating modes; cooling/compressor boundaries; site voltage and supply provider; failures and idle; shared-meter partition"
      collection_method: "Use calibrated submeters or a reconciled measured stage partition of one master meter; include actual conveying, sizing, press, cooling, extraction, packing and compressor. No nameplate-power default. Store unnormalised raw meter differences and measured activity partitions; retain all modes and unit conversions for calc_raw; no division by Q_c."
      unit: "kWh; MJ; kW and h when actual rate"
      frequency: "continuous meter logging and every batch"
      temporal_coverage: "full period including all failure/idle/start/stop/cleanup"
      site_scope: "actual production site and shared utilities"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; master/submeter closure; time and operating log"
    - protocol_id: cp_water
      process_id: "p_manufacture"
      flow_role: "cooling_makeup; ambient_moisture"
      record_type: "water_and_moisture"
      raw_fields: "actual die cooling configuration; initial/final loop inventory; makeup; purge; evaporative loss; inlet/outlet state and temperature; measured water density if volumetric; wood moisture uptake; inlet/outlet air humidity; independent measurements"
      collection_method: "Meter/weigh real water transfers; record loop stocks and independently measured heat rejection. Use paired humidity/moisture measurements for actual net uptake/release. No boiler or steam inferred. Retain raw amounts/states and stocks; distinguish internal circulation from external makeup; no division by Q_c."
      unit: "kg; temperature; actual volume only with state"
      frequency: "each batch and purge and accounting boundary"
      temporal_coverage: "complete production period"
      site_scope: "actual die loop and manufacturing air/wood interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; state/density tests; water/heat-balance reconciliation"
    - protocol_id: cp_consumables
      process_id: "p_manufacture"
      flow_role: "lubricant; spent_lubricant"
      record_type: "purchase_stock_waste"
      raw_fields: "whole mineral lubricant receipt; SDS and viscosity grade; opening/closing stores and machine fill; issued mass; drained mass; leaks and contamination; actual treatment receiver"
      collection_method: "Weigh receipts/issues/drains and reconcile stores and machine fills, including opening historical burdens; keep additive assays as subledger. Retain raw receipt/consumption/waste/stock masses; allocate actual machine-use burden before calc_normalize; no division by Q_c."
      unit: "kg"
      frequency: "each issue/change and stock boundary"
      temporal_coverage: "full period and inherited machine fill"
      site_scope: "actual press/drive lubrication and external receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "SDS; invoices; stock reconciliation; waste transfer manifest"
    - protocol_id: cp_packaging
      process_id: "p_manufacture"
      flow_role: "film_input; film_waste; each actual first non-purchase PE receipt N_ext and additional component interface"
      record_type: "packaging_stock"
      raw_fields: "PE supplier and composition; thickness and grade; opening empty/attached WIP/attached FG/reusable; purchases; external returns received; closing same stocks; gross shipment wrapper mass; external return out; waste; original cohort IDs; P actual component procurement; N_ext first non-purchase non-return external physical receipt kg by source; ER linked prior external dispatch; receipt event ID/time/direction and actual material/form/type/condition; measured gross/tare/component kg and uncertainty; ownership/custody before/after and entrustment/loan/lease terms; linked supplied consignment; inherited per-exchange vector; actual burden owner and provider-included scope; non-additive whole/component bridge; specific atomic external receipt row/interface"
      collection_method: "Weigh every actual PE component and every other packaging construction independently of net wood by event, phase and original cohort. Keep complete opening/closing empty, attached-WIP, attached-FG and reusable stocks, actual P/N_ext/ER receipts and gross S/EO/W destinations under boundary_packaging. Include first supplier-attached, entrusted, borrowed or leased non-purchase physical receipts even where manufacture is already upstream included; these are not opening stock, invented purchases or ER without prior-dispatch evidence. Each actual N_ext needs a separately identified atomic external-input quantity/interface matching its material/form/type/direction; add that specific receipt interface where existing purchase/true-return rows do not cover the event before concrete-inventory completeness. Do not merely add a prose symbol, clone procurement rows or use a collective package/UUID. Preserve each event ownership/custody, inherited vector and actual provider scope; assign real supply or incremental services once without buying included manufacture again. Whole-consignment/component views are non-additive. Retain unnormalised raw stocks/movements, reconcile the same manufacturing/FG gate and cancel internal empty-store/FG issuance and reuse without new purchase or Q_c."
      unit: "kg"
      frequency: "each packing/repacking/shipment/return and stock boundary"
      temporal_coverage: "full production and attributable service history"
      site_scope: "actual packing and FG service sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale records; polymer/SDS declaration; stock and return audit trail; delivery/entrustment/loan/lease receipt; original external dispatch; owner/cohort and inherited-vector/provider bridge"
    - protocol_id: cp_residuals
      process_id: "p_manufacture"
      flow_role: "sawdust_reject; wood_cut_reject; briquette_reject; film_waste; cooling_purge; compressor_condensate"
      record_type: "separate_waste_measurement"
      raw_fields: "stream ID and actual material/form; raw whole mass; water/solids/oil assay; failed-run ID; captured dust returned/external; receiver/provider and destination; contamination; stock changes"
      collection_method: "Weigh each external waste separately and reconcile capture/screening/press/saw stocks and internal returns; actual liquid waste is measured whole, with species/origin partitions kept non-additive. Store unnormalised gross whole amounts, non-overlapping destinations and composition/origin subledgers; no Q_c division."
      unit: "kg"
      frequency: "each generation/transfer and stock boundary"
      temporal_coverage: "full period including failures and cleanup"
      site_scope: "manufacturing gate to each actual receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scales; assays; transfer manifests; dust-return closure"
    - protocol_id: cp_air
      process_id: "p_manufacture"
      flow_role: "wood_pm_air; water_vapour_air; alpha_pinene_air"
      record_type: "emission_measurement"
      raw_fields: "species CAS/stereochemistry and medium; sampling/control point; concentration basis and actual integrated gas volume or rate/time; inlet humidity; actual gas temperature/pressure; dry/wet basis; detection limit; particulate size fractions; independent moisture and solids measures"
      collection_method: "Use actual monitored concentration and compatible total gas volume, or integrate real rates once, after controls with fugitive coverage declared. Water, wood solids and VOC speciation need independent evidence, not one residual fitted to two unknowns. Retain raw concentration/volume/rate/time and actual occurrence evidence; calc_raw handles one conversion before allocation; no Q_c division."
      unit: "kg; actual concentration and volume units"
      frequency: "representative operating modes including abnormal periods"
      temporal_coverage: "full period with documented monitored/extrapolated coverage"
      site_scope: "real plant-air boundary and each actual species destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling report; analyser calibration; detection limits; coverage and uncertainty"
    - protocol_id: cp_service
      process_id: "p_service"
      flow_role: "service_electricity; service_film_waste; service_wood_waste; service_sawdust; service_moisture; service_vapour; service_pm"
      record_type: "cohort_service_stock"
      raw_fields: "original acceptance cohort and original Q_c; opening/closing FG wet/dry/water mass and inherited burden; gross shipment ID/mass; matched gross return/original dispatch stock events; performed original service burdens; evidence for erroneous/duplicate/unperformed service-booking corrections; reinspection/rework increment; meters; H activity; loss and species measurements; no second acceptance count"
      collection_method: "Follow lot genealogy through storage/returns/repacking/loading. Measure real handling activity and physical net water/dust changes; use compatible meters/assays and original supplier links, retaining losses and failed handling. Keep raw activity, original Q_c and stock vectors. Allocate service to original cohorts first; calc_normalize alone divides attributable A by original Q_c once. H and gross dispatch never replace Q_c."
      unit: "kg; MJ; actual H unit"
      frequency: "each event and cohort/stock boundary"
      temporal_coverage: "actual service history for every included cohort"
      site_scope: "actual FG storage/handling/loading sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "cohort genealogy; stock/meter closure; dispatch/return links; sampling reports"
    - protocol_id: cp_wip
      process_id: "p_manufacture"
      flow_role: "all inventory rows"
      record_type: "lot_stage_stock_vectors"
      raw_fields: "lot and process stage; opening/closing WIP wet/dry/water mass; per-exchange historical and current burden vector; internal fines/rework transfers; failed/idle/start/stop/cleanup loads; real allocation; provenance"
      collection_method: "Take physical stock measurements and retain each exchange vector by lot/stage, cross-checking production/utility records, internal transfers and original FG returns. Retain raw quantities and full vector; perform stock/attribution adjustments in calc_attribution only; never divide stock records by Q_c."
      unit: "kg; each original exchange unit"
      frequency: "each lot transfer and period boundary"
      temporal_coverage: "full period plus inherited historical cohorts"
      site_scope: "all manufacturing stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "physical stock audit; lot genealogy; source vector reconciliation"
    - protocol_id: cp_packaging_service
      process_id: "p_service"
      flow_role: "service_film; service_film_waste; each actual first non-purchase PE receipt N_ext and additional component interface"
      record_type: "packaging_stock"
      raw_fields: "PE supplier and composition; thickness and grade; opening empty/attached WIP/attached FG/reusable; purchases; external returns received; closing same stocks; gross shipment wrapper mass; external return out; waste; original cohort IDs; P actual component procurement; N_ext first non-purchase non-return external physical receipt kg by source; ER linked prior external dispatch; receipt event ID/time/direction and actual material/form/type/condition; measured gross/tare/component kg and uncertainty; ownership/custody before/after and entrustment/loan/lease terms; linked supplied consignment; inherited per-exchange vector; actual burden owner and provider-included scope; non-additive whole/component bridge; specific atomic external receipt row/interface"
      collection_method: "Weigh every actual PE component and every other packaging construction independently of net wood by event, phase and original cohort. Keep complete opening/closing empty, attached-WIP, attached-FG and reusable stocks, actual P/N_ext/ER receipts and gross S/EO/W destinations under boundary_packaging. Include first supplier-attached, entrusted, borrowed or leased non-purchase physical receipts even where manufacture is already upstream included; these are not opening stock, invented purchases or ER without prior-dispatch evidence. Each actual N_ext needs a separately identified atomic external-input quantity/interface matching its material/form/type/direction; add that specific receipt interface where existing purchase/true-return rows do not cover the event before concrete-inventory completeness. Do not merely add a prose symbol, clone procurement rows or use a collective package/UUID. Preserve each event ownership/custody, inherited vector and actual provider scope; assign real supply or incremental services once without buying included manufacture again. Whole-consignment/component views are non-additive. Retain unnormalised raw stocks/movements, reconcile the same manufacturing/FG gate and cancel internal empty-store/FG issuance and reuse without new purchase or Q_c."
      unit: "kg"
      frequency: "each packing/repacking/shipment/return and stock boundary"
      temporal_coverage: "full production and attributable service history"
      site_scope: "actual packing and FG service sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale records; polymer/SDS declaration; stock and return audit trail; delivery/entrustment/loan/lease receipt; original external dispatch; owner/cohort and inherited-vector/provider bridge"
  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Convert raw units and integrate true rates once before attribution: E_MJ=3.6*E_kWh; transport_kgkm=1000*transport_tkm; species_mass=compatible_mass_concentration*integrated_gas_volume. If volume is already integrated do not multiply time. Apply measured state corrections and independently measured substance density only where needed; preserve original observations."
      inputs:
        - "raw units"
        - "measured state"
        - "rate and time when applicable"
      output: "converted raw numerator by exchange"
      source_ids:
        - fao-briquetting-1996
    - id: calc_attribution
      applies_to: "all inventory rows"
      rule: "Construct A_jc from converted actual records, inherited source and opening WIP exchange vectors, actual internal transfers and closing WIP vectors under boundary_stock. Allocate dedicated work first and remaining exchanges only under allocation_goal/physical/residual. Retain all failed and Q_c=0 loads, actual losses and original FG/rework cohorts. Service A_jc follows original cohort attribution using measured H; H allocates service and is never production output. Physical dispatch/return stock events do not cancel performed original service burdens. Retain those burdens and add actual return/inspection/repacking/rework increments once for the original cohort and original Q_c. Correct only evidenced erroneous, duplicate or unperformed service bookings; preserve production history and all real service consumption, emissions and waste."
      inputs:
        - "converted records"
        - cp_wip
        - "original cohort"
        - "allocation evidence"
      output: "A_jc in the original exchange unit"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "x_jc = A_jc / Q_c, once only for Q_c > 0; x_jc is the exchange amount per 1 kg reference flow of original first-release cohort c. Cards and aggregation refer to this same result without further division. The reference output is exactly 1 kg. For Q_c=0 retain actual burden and disclose its later causal assignment or unresolved carryover; produce no unit result and never divide by zero or discard failed/idle load."
      inputs:
        - A_jc
        - Q_c
        - cp_release
        - cp_service
      output: "x_jc per 1 kg reference flow"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_physical
      applies_to: "all physical exchanges"
      rule: "Reconcile independent wet-mass, dry-wood, water and relevant-element balances over the same manufacturing/FG/consolidated gates, including stock and internal cancellations. Whole liquid/gas waste/emission amounts are counted once; measured composition and source-origin partitions sum to that whole without adding it again. A mass residual is a discrepancy to investigate, not simultaneous evidence for both unmeasured evaporation and dust/VOC. Use measured temperatures/heat rejection and motor energy for a separate relevant energy check; do not treat mass closure as energy closure or a universal calorific/density factor."
      inputs:
        - cp_supply
        - cp_water
        - cp_air
        - cp_release
        - cp_wip
        - cp_service
      output: "independent physical and energy reconciliation"
      source_ids:
        - fao-briquetting-1996
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify actual form/composition/CAS/route/type/media/geography and every native property, then one compatible provider independently. Use official Chinese basenames for adopted UUIDs. Missing auxiliary identities stay specific and tracked; a missing core terminal identity or unsupported essential route prevents a usable completed dataset."
      evidence: "native full records; supplier specification and matching provider reference"
    - id: dq_measurement
      applies_to: "all quantities"
      requirement: "Retain raw original units, calibration, detection limits, temporal coverage and uncertainty; no factory quantities or grades are supplied by this PCR. Actual absence requires configuration/measurement evidence and not_applicable explanation, not a guessed zero."
      evidence: "calibration and source records; complete coverage matrix"
    - id: dq_history
      applies_to: "all stocks and services"
      requirement: "Complete lot genealogy and per-exchange vectors must connect generation, drying, transport, WIP, first release, FG, returns and incremental rework; do not erase burdens at a waste or calendar boundary."
      evidence: "stock and vector audit; original cohort Q_c and return links"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "List every real exchange and its provider/measurement status, including conditional species and packages. Unknown VOC, coolant, contamination or upstream drying burden remains explicit; investigate balances and missing routes before asserting completeness."
      evidence: "site diagram; complete meter/material/emission reconciliation"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference and all exchanges"
    rule: "Confirm one non-pellet untreated-wood briquette composition and mechanical-piston route, explicit finished_briquette link and Mass/kg reference. Enforce native restrictions in every card, exact current projection and fingerprints, all declared qualifiers and source links. No classification tag alone proves physical applicability."
    source_ids:
      - fao-briquetting-1996
      - un-cpc3-2025
  - rule_id: validate_quantity
    applies_to: "all inventory rows"
    rule: "Check one first-release Q_c and one calc_normalize per attributed numerator, no second normalisation in protocols/cards and no division for Q_c=0. Closing accepted FG is inside Q_c; shipment/reinspection never adds production. Retain all operating modes and per-exchange stock history."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: validate_balances
    applies_to: "manufacturing and FG and consolidated gates"
    rule: "Require independent mass/dry-wood/water/relevant-element checks, relevant energy check and each packaging identity/stock closure over the same gates. No single residual estimates two unknowns; no unknown gas composition is declared resolved by total VOC. Preserve actual receiver routes and non-additive mixture partitions."
    source_ids:
      - fao-briquetting-1996
      - ilcd-attributional-2010
  - rule_id: validate_provider
    applies_to: "all upstream exchanges"
    rule: "Verify upstream source, drying, transport, utilities, material and waste-treatment providers once with matching product/reference unit/state and boundary. UUID identity and engineering checks do not approve scientific applicability, translation, mapping, publication or measured factory data."
    source_ids:
      - ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Specified non-pellet wood fuel briquette supply at first-release gate with disclosed attributable ex-works services"
  allowed_use: "Matching composition/route/moisture/quality/site/time and independently compatible provider/boundary"
  excluded_use: "Fuel-use combustion; useful-heat equivalence; pellet or loose-waste substitution; zero-burden residue; automatic biogenic neutrality/credits; treating draft guidance as approval"
  required_metadata: "All section 3 qualifiers; actual source/route/provider/period; first-release cohort and original Q_c; stock and service boundary; actual specification"
  required_quality_disclosure: "Raw evidence and coverage; uncertain identities/providers/speciation; actual collection/allocated values; source independence; complete stock vectors; allocation sensitivity; no numerical defaults"
  update_trigger: "Feedstock/source-treatment, press route, thermal drying location/fuel, cooling system, additive, packaging, provider, quality gate or material/emission identity changes"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Ver.3.0 Structure 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "39281/39282/39283 mutually distinct product-form classification; no manufacturing, allocation or mapping approval"
  - id: "fao-briquetting-1996"
    type: "handbook"
    reference: "Grover and Mishra, FAO/RWEDP Field Document 46, Biomass Briquetting: Technology and Practices, April 1996, §§3–4 and adjacent screw/piston/pellet contrasts, Table 4.1 and Fig.4.1. https://www.fao.org/4/ad579e/ad579e00.pdf"
    used_for: "Preparation and mechanical-piston distinction; conditional binderless compaction and cooling context; route examples not numerical defaults or allocation rules"
  - id: "cfn-mobile-2023"
    type: "handbook"
    reference: "C.F. Nielsen, Mechanical Briquetting Presses: Mobile Briquetting Plant, 2023 brochure, complete single page and table footnote. https://cfnielsen.com/wp-content/uploads/2024/03/7.-Mobile-Briquetting-Plant2023.pdf"
    used_for: "Actual modern mechanical press/feeding/cooling-line configuration; capacities conditional; MDF/mixed feed examples excluded"
  - id: "cfn-saw-2023"
    type: "handbook"
    reference: "C.F. Nielsen, Briquette Saw BS350, 2023 brochure, complete single page including layout/table. https://cfnielsen.com/wp-content/uploads/2024/11/BS350-briquetting-saw-brochure-2023_CFN.pdf"
    used_for: "Cooling before sizing, suction and internal sawdust return, optional rejection/weighing and foil packing, pneumatic actuation; no fixed line length or pack mass imposed"
  - id: "ilcd-attributional-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA—Detailed guidance, first edition March 2010, §§7.9.2–7.9.3, printed pp.255–272 including sawmill and transport examples and common-gate counterexample. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision/virtual subdivision then exchange-specific determining physical causality and only residual common-gate market value; accounting rules are explicit PCR operationalisation, not a source factory inventory"
