measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use net first-released briquette mass at measured release moisture. Weigh on calibrated scales and subtract actual film/tare. Q_c excludes packaging, rejected output and previously released material; record accepted closing FG without adding it a second time."
  - id: unit_conversion
    applies_to: "all inventory rows"
    required_property_ref:
      name: "row-specific"
      uuid: ""
    required_unit: "row-specific"
    rule: "Keep raw units. Convert kWh to MJ with 3.6 MJ/kWh before allocation; tonne-km to kg*km with 1000 kg*km per tonne-km. Integrate true rates over their measured time only; a cumulative volume or energy total is never multiplied by duration again. Obtain material-specific density at measured temperature/pressure/composition if volume must become mass; no water-density assumption or secondary Flow coefficient establishes wood density."
  - id: moisture_accounts
    applies_to: "wood exchanges"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "For each measured wet mass m and wet-basis water fraction w: water=m*w and dry solid=m*(1-w). Dry-basis moisture u converts by w=u/(1+u). Measure release and intake separately. Physical gross mass, dry wood, free/sorbed water and relevant elements are independent ledgers; moisture loss does not create dry wood. No assumed reaction, structural-water formation or combustion is introduced."
