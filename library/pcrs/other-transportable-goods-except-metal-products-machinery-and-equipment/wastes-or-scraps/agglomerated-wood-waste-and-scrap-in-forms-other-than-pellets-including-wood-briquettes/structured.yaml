system_boundary:
  rules:
    - rule_id: boundary_complete
      applies_to: "all processes"
      rule: "Include all failed runs, zero-output periods, start-up/shutdown, idle, cleanup, dust capture, rework and actual losses. Missing instruments are not zero. Add every actually present material, formulation, fuel, refrigerant, water stream, package, waste and identified emission separately before the dataset can be complete."
      source_ids:
        - fao-briquetting-1996
        - ilcd-attributional-2010
    - rule_id: boundary_gates
      applies_to: "all physical balances"
      rule: "Use identical manufacturing/FG/consolidated physical interfaces. Define V_new=Q_c+measured wrappers attached at first release; V_old is gross previously accepted material and its actual wrappers returned after rework. Manufacturing mass: opening raw/empty-package/machine-fluid stores and WIP+external mass inputs+old FG sent to rework=closing same stores and WIP+V_new+V_old returned to FG+external mass rejects/emissions. For each separate ledger preserve net wood, water and package components; Q_c excludes wrappers. Every internal transfer appears once on each side and cancels in consolidation. New Q_c is already within V_new and is not another added output. Keep gross V separate from attributed A; internal fines are not purchases/coproducts."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: boundary_stock
      applies_to: "all inventory rows"
      rule: "For each exchange j retain opening/closing WIP physical quantities and historical/current burden vectors by lot/stage, including source, utilities and failed work. For newly first-released cohorts A_jc includes actual current attributable records plus historical unreleased WIP burden transferred in, minus separately retained closing unreleased WIP burden, with losses/allocation retained. Accepted closing FG is already in Q_c and its production burden is not subtracted. Previously accepted FG sent through rework carries its original vector as a balanced transfer at both ends, not a second addition of historical production to A_jc; only real incremental rework/service is newly assigned to its original cohort and original Q_c. Cross-period corrections remain linked to the original lot."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: boundary_service
      applies_to: "p_service"
      rule: "Use gross FG mass including actual attached packaging consistently: opening gross FG+V_new+external accepted returns+V_old returned from manufacturing+actual moisture uptake+new service packaging issued=closing gross FG+gross physical dispatch+gross old FG sent to rework+actual external losses/emissions. Keep net wood/water and each packaging subledger independent; external returns include their real attached packaging. Empty service-packaging store changes are included in the separately closed packaging ledger. Closing FG is already first-released; new Q_c occurs only inside V_new. Link each physical return stock event to its original dispatch; retain both gross events for stock reconciliation. Retain the original production burden once and all actually performed original storage/handling/repacking/loading burdens on the original cohort; add actual return/inspection/repacking/rework increments once. Correct a service booking only with evidence that it was erroneous, duplicated or never performed; a physical return never cancels consumed energy/materials or actual emissions/waste. Attribute service to original cohorts with original Q_c; H allocates service and is never production."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: boundary_water_heat
      applies_to: "cooling and upstream drying"
      rule: "Record actual die-water recirculation, makeup, purge, evaporation and heat rejection with measured states; internal loop water is not repeated supply. No boiler, steam, purchased heat or condensate return is assumed. If such exchanges actually exist, expand the route: external condensate/heat-exchanger-water returns remain separate Product returns with measured mass/state/enthalpy and supplier water/energy agreement, not an invented negative tap-water or heat input."
      source_ids:
        - fao-briquetting-1996
    - rule_id: boundary_packaging
      applies_to: "each packaging material"
      rule: "For each actual packaging material separately: opening empty + opening attached WIP + opening attached FG + opening reusable stock + purchases P + first non-purchase external physical receipts N_ext + actual external returns received ER = closing empty + closing attached WIP + closing attached FG + closing reusable stock + packaging on gross physical shipments S + external returns out EO + waste W. P is actual component procurement, including a component genuinely purchased within a whole consignment only as its non-additive share. N_ext is the actual first non-return external physical receipt without component procurement, including supplier-attached, first entrusted, borrowed or leased packaging. ER requires a linked prior external dispatch and true return; P/N_ext/ER are mutually exclusive event partitions. Opening means physically present at period start, not a current receipt. Keep measured component quantity, ownership/custody, original cohort and inherited vector separate from environmental burden: actual manufacture/supply and incremental lease/return/handling service follow one recorded provider convention, never automatically N_ext kg of new manufacture or a repeated upstream-included burden. Match N_ext once to the same external mass gate in boundary_gates/boundary_service using non-additive whole/component bridges; issue between empty stores and WIP/FG is a cancelling internal transfer, not another receipt. Internal reuse/transfers create no purchase, Q_c, automatic coproduct or credit. Each real pallet, label, strap or other additional component needs its own specific atomic physical receipt/destination interface and ledger when used; missing quantity/interface is a concrete-inventory completeness gap, not zero or a collective identity."
      source_ids:
        - ilcd-attributional-2010
boundary_abstraction:
  declared_starting_condition: "Segregated sawmill sawdust from untreated solid wood; received dry with actual source generation/collection and drying history"
  starting_condition_role: "Explicit foreground receipt interface; upstream burdens are connected rather than discarded"
  product_classification_scope: "Non-pellet wood briquettes in CPC 39282; no full-leaf coverage claim"
  recursive_input_rule: "Incoming finished briquettes are never virgin sawdust or new production. Record their original cohort and upstream provider; internal fines and rework cancel physically and inherit their vector. Purchased briquettes require an explicitly different assessed input route."
  upstream_dataset_requirement: "One verified compatible provider per supplied exchange; include source wood production, source-process allocation, actual prior drying, collection and supply transport exactly once. Waste classification or low value never sets burdens to zero."
  disclosure: "Disclose site/period, source moisture and composition, prior drying, all gate locations, allocation, actual process configuration, stock vectors, service cohorts, exclusions and missing provider evidence."
