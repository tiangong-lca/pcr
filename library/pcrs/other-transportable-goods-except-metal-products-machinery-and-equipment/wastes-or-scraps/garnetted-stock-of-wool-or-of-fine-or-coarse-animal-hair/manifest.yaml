  ordinary_identity_gaps:
    fg_discard: Previously released garnetted sheep-wool stock discarded as Waste; not spinning fly or unchanged
      Product.
    machine_oil: Mineral-oil whole formulation; furfural-CAS and PAO-route candidates rejected. Actual supplier
      formulation and own identity needed.
    unopened_offcut_reject: Specific Waste identity not confirmed. Product-typed wool waste does not establish Waste
      treatment.
    short_fibre_reject: Specific garnetting reject Waste identity not confirmed; spinning waste route differs.
    collected_wool_dust: Dry garnetting collector Waste identity not confirmed; not airborne PM or spinning fly.
    ferrous_trim: Untreated iron/steel attachment Waste identity not confirmed; inspected scrap flow has different
      treatment/type.
    cleanup_wastewater: Untreated external-treatment wool-line cleanup wastewater; inspected source-specific/direct-water
      restrictions unsuitable.
    hdpe_wrap_waste: Discarded HDPE bale-film Waste identity not confirmed.
    steel_tie_waste: Discarded iron/non-alloy-steel binding-wire Waste identity not confirmed.
  native_restrictions:
    garnetted_first_release: Product; manufactured; at plant. Formal bilingual basename supports garnetted stock;
      Chinese general comment has carding/web wording, disclosed in both card descriptions. No yarn/web interpretation
      authorized.
    offcut_receipt: Product; production mix at plant; unspecified treatment. Secondary-material supply function
      plus actual legal/receiver acceptance required; not a native Waste-treatment input.
    electricity: CN; below 1 kV; grid-average consumption mix to user. Different interface/geography requires replacement
      identity/provider before model use. Native Net calorific value/MJ retained.
    packaging: One actual HDPE film article and one iron/non-alloy-steel flexible cylindrical wire separately; actual
      grade/composition/provider required. Current Baling wire, iron or non-alloy steel has coherent CPC 41263 material classification, production mix at plant and unspecified supply geography/grade/finish. Actual textile-bale use and supplier/strength/finish compatibility require foreground evidence; no measured quality or external compliance claim.
    tap_water: Municipal potable treated supply at consumer/plant; native secondary volume coefficient is not a
      site density measurement.
    air: PM particle size and air subcompartment unspecified; water vapor H2O to unspecified air. Exact-flow LCIA
      coverage assessed separately.
  evidence_limitations:
  - Industrial sources provide qualitative route evidence only; no copied Table A6 numbers, factory recipe, yield,
    avoided-pig-iron credit, zero formation burden or CFF.
  - Manteco websites/report and collaborating Bianco paper share company evidence, not independent factory replications.
    Woolmark is independent industry guidance.
  - ILCD supports only the stated attributional allocation hierarchy; its registered qualitative fragments keep
    numeric reuse blocked and coverage false.
  - Actual lot composition/finish/receiver legality, complete stock and inherited-burden vectors and actual site
    measurements are required foreground data, not defaults.
  true_method_holds: []
