product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.wastes-or-scraps.garnetted-stock-of-wool-or-of-fine-or-coarse-animal-hair"
  classification_refs: "CPC 3.0:39213; narrower sheep-wool dry-garnetting method scope; no accepted mapping established here"
  covered_products: "Loose mechanically garnetted sheep-wool fibre stock from one traceable nominal mono-fibre previously coloured woven-wool manufacturing-offcut stream. Actual residual co-fibres and finishes remain declared."
  excluded_products: "Ungarnetted wool waste and noils; silk or cotton recycling stock; deliberate mixed-fibre recipes; other animal-hair routes without new evidence; virgin tops/slivers; yarn; fabric; felt/web; wet shredding; chemical dissolution/regeneration."
  representative_product: "Previously coloured loose recycled sheep-wool stock for a receiver-qualified subsequent woollen preparation process; no universal fibre purity or length assumed."
  production_route: "Receipt and composition/colour sorting → remove actual non-fibre attachments → cutting where needed → dry pinned-cylinder garnetting/fraying and dust capture → first quality release → ambient storage and actual packing/dispatch service."
  market_state: "As-supplied loose recovered fibre stock at recorded moisture; not yarn or untreated waste. Legal material status and receiver specification are mandatory actual records."
functional_unit:
  what: "Supply receiver-qualified mechanically reopened sheep-wool stock as feedstock for a later textile process."
  how_much: "1 kg net as-supplied fibre stock at its first quality release."
  how_well: "Known offcut composition and prior finish; measured moisture and fibre-length/unopened-fraction evidence; actual receiver acceptance. No claim of equivalent virgin-wool performance."
  how_long_or_cycle: "One first-release production cohort; later handling follows its original released mass Qc and creates no new output."
  reference_flow_link: "garnetted_first_release"
system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "garnetting"
      rule: "Include receipt weighing; composition/colour sorting; removal of actual hard attachments; necessary cutting; dry pinned-cylinder fraying/garnetting; extraction/filtering; first quality inspection and any pre-release rework. Do not replace this route by purchase of finished fibre and packing. Sources establish a technical synthesis rather than one contemporary factory or SKU."
      source_ids:
        - bianco-mwool-2022
        - manteco-project43
        - manteco-recype
        - woolmark-recycling
        - manteco-report-2023
    - rule_id: b_actual
      applies_to: "all processes"
      rule: "Retain all failed runs; zero-output periods; starts/stops; idle extraction/lighting; cleanup; rework; spills and actual ancillary operations. Base route has no deliberate fibre wetting/redyeing/heated drying and uses electric handling. If fuel use or such operations occur, preserve raw loads and add individually identified fuel/chemical/emission cards and method evidence before completing the package; absence must be demonstrated, never inferred from a short source inventory."
      source_ids:
        - bianco-mwool-2022
        - woolmark-recycling
    - rule_id: b_input_status
      applies_to: "offcut_receipt"
      rule: "Use the Product-typed recovered-offcut identity only for the documented secondary-material supply function with legal transfer and receiver acceptance. The word waste in its basename does not make it a native Waste flow. If the actual receipt is a waste-treatment function, declare that function and obtain a matching Waste identity and reviewed boundary/allocation; retain the real input and burdens while unresolved. No default zero formation burden or avoided production credit."
      source_ids:
        - bianco-mwool-2022
        - ilcd-attributional-2010
    - rule_id: b_fg
      applies_to: "fg_service"
      rule: "Keep storage; bale packing; electric handling; dispatch; returns and actual post-release rework in an incremental service account linked to original Qc. Production transfer Q cancels internally with service receipt; outward fibre is the service exit of the same cohort. Closing FG is stock; shipment is not a second production output. Historic FG keeps its original per-exchange burden vector and receives only true current service increments."
      source_ids:
        - bianco-mwool-2022
        - ilcd-attributional-2010
    - rule_id: b_external
      applies_to: "all processes"
      rule: "Trace external upstream production/transport and downstream treatment once through compatible providers. Retain actual outgoing product/waste type and destination. No copied boiler; purchased steam; condensate or heat-return exchange is assumed in this dry electric route. Any real heat/water return requires its own physical state/enthalpy and supplier water-energy agreement."
      source_ids:
        - bianco-mwool-2022
boundary_abstraction:
  declared_starting_condition: "One identified lot of previously coloured nominal mono-fibre woven sheep-wool manufacturing offcuts at receipt; transport and previous burden ownership explicitly linked once."
  starting_condition_role: "Recovered-material input to an attributional material-supply process; not a declaration of burden-free waste treatment."
  product_classification_scope: "Mechanically garnetted wool stock; unprocessed noils/waste stop before the defining mechanical operation. This method selects sheep wool; it does not authorize all hair species implied by the broad catalog title."
  recursive_input_rule: "Already garnetted stock received from elsewhere requires a compatible burden-bearing supplier dataset and a separate input card. It is not re-created by receipt or repacking. Internal recirculation is tracked physically and cancels once at consolidation."
  upstream_dataset_requirement: "Retain source offcut-forming process and its allocation decision; collection/sorting/transport already supplied are linked without repeating. Determine actual legal and LCA status separately. A missing inherited burden or undocumented cut-off is unresolved rather than zero."
  disclosure: "Actual composition/finish and contamination; each receipt/release/dispatch gate; legal transfer and receiver acceptance; process/utility geography; wet or chemical operations if observed; inventories and inherited burden vectors; normalization and allocation evidence."
