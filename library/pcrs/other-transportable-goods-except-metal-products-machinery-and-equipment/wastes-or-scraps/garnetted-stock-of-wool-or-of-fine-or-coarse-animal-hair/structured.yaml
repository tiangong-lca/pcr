published_dataset_profile:
  dataset_role: "attributional secondary material supply dataset after actual receipt/release function and burden ownership are established"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared woollen preparation input compatible with measured composition/moisture/length and supplier geography; carry inherited inventory and actual service increments once."
  excluded_use: "Automatic virgin-wool substitution; fixed recycling credit; waste-treatment service without proper boundary; noils or raw wool; yarn/fabric; implicit wet/chemical processing; LCIA completeness from a flow name."
  required_metadata: "sheep-wool species and supplier lot; nominal mono-fibre input specification; measured wool and each residual co-fibre fraction with method and uncertainty; original fabric construction and prior colouring/finish including hazardous residues; previously coloured woven-fabric offcut origin; dry pinned-cylinder route and machine settings; fibre length distribution and unopened fraction; dust and foreign-matter acceptance limits agreed with receiver; actual moisture method and sampling state; legal by-product or waste status at each transfer; upstream burden ownership and cut-off rationale; receiving and first-release gates; batch and period with opening/closing WIP and FG; unique first-release cohort Q and historic Qc; supplier geography and utility interface; gross dispatch/returns and packaging composition; actual ancillary operations and external treatment destinations"
  required_quality_disclosure: "Measured period/site/coverage; moisture/composition method; prior waste-forming burden and allocation; complete cohort/gate/stock/return/packaging vectors; uncertainty; unresolved auxiliaries and unsupported LCIA coverage."
  update_trigger: "Input species/intentional blend/finish or legal function change; dry-to-wet/chemical route; release gate or normalization change; actual utility/provider interface; new material/emission; changed receiver specification."
data_sources:
  - id: "bianco-mwool-2022"
    type: "literature"
    reference: "Bianco I.; Gerboni R.; Picerno G.; Blengini G.A. (2022). Resources 11:41. https://doi.org/10.3390/resources11050041 ; §2.1; Figure 1; Appendix A Tables A3–A7."
    used_for: "Qualitative industrial dry fraying and adjacent wet shredding/untreated spinning-waste alternatives; sorting and packaging. Table A6 values and avoided pig-iron credit are not defaults. The study uses mixed source routes and 2019 data; its zero-burden and CFF assumptions are not adopted."
  - id: "manteco-project43"
    type: "extension_guidance"
    reference: "Manteco. Project43. https://manteco.com/project/project-43/ ; dated web snapshot 2026-10-25."
    used_for: "Manufacturer evidence of traceable garment-making wool-fabric offcuts and mono-fibre/bi-fibre alternatives; supports selecting the nominal mono-fibre route with actual assay rather than treating all offcuts as pure wool."
  - id: "manteco-recype"
    type: "extension_guidance"
    reference: "Manteco. How are recycled wool colors created without dyeing? Updated 12 January 2023. https://manteco.com/how-are-recycled-wool-colors-created-without-dyeing/ ; snapshot 2026-10-25."
    used_for: "Existing colour retained through composition/colour sorting and mechanical recovery. Downstream colour-recipe blending and trial carding are separate activities; no quoted savings or recipe ratios are transferred."
  - id: "woolmark-recycling"
    type: "extension_guidance"
    reference: "The Woolmark Company. Recycled Wool: The Ultimate Circular Solution. https://www.woolmark.com/industry/sustainability/recycled-wool-the-ultimate-circular-solution/ ; snapshot 2026-10-25."
    used_for: "Independent industry guidance for fibre/colour/quality sorting; trim removal; cutting; distinction from downstream carding/spinning and open-loop chemical or thermal options. Certification thresholds do not establish this lot composition."
  - id: "manteco-report-2023"
    type: "literature"
    reference: "Manteco. Sustainability Report 2023. https://manteco.com/wp-content/uploads/2024/09/Manteco-2023-Sustainability-Report.pdf ; PDF pp.24–26; printed pp.46–51."
    used_for: "Primary manufacturer flow diagram separates garment-making offcuts and fraying/shredding from later carding/spinning; existing-colour route. Same company evidence as the paper/web pages; not an independent numeric confirmation."
  - id: "ilcd-attributional-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook: General guide for LCA — Detailed guidance. First edition March 2010. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf ; §§7.9.2–7.9.3; printed pp.255–272."
    used_for: "Only attributional situations where allocation is required: subdivision/virtual subdivision; exchange-specific determining physical causality; residual common-process-gate market value. Not evidence for an automatic recycling cut-off or an industrial recipe."
