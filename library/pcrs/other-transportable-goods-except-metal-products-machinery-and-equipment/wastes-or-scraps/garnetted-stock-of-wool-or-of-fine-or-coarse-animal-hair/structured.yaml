allocation_rules:
  - rule_id: a_scope
    applies_to: "all allocation decisions"
    rule: "The following hierarchy applies only within the declared attributional study situation where allocation is required. Source recycling/cut-off assumptions are not automatically carried across."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_hierarchy
    applies_to: "shared inventory"
    rule: "In an attributional study situation requiring allocation, first collect dedicated operations separately or apply justified virtual subdivision. Next identify the determining physical causality for each exchange and each co-function; justify which measured change drives that specific exchange. Do not apply one mass share to every flow."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_residual
    applies_to: "residual common process"
    rule: "Only inventory still unresolved after those steps may use contemporaneous market value at the common process exit and actual material condition. Remove later packing/transport/conditioning value and their dedicated burdens. Keep signed fees and legal waste function separate; a negative/zero value is not evidence for allocation exemption or a fabricated positive coproduct. No fixed allocation factor; no automatic substitution credit or CFF."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_services
    applies_to: "fg_service"
    rule: "Assign serial services by measured intensity/duration where causally justified; parallel storage/transport uses actual limiting volume/area or mass with duration/distance and evidence. Preserve losses; return handling; cleanup and idle service. Add its true incremental burden vector to the original cohort using Qc once; gross H informs causality only."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_inheritance
    applies_to: "WIP and unused material"
    rule: "Keep per-exchange inherited vectors for opening/closing raw WIP and unused non-WIP material separately at every physical gate. An input issue already net of unused returns is not netted again. Move burden with the same material and method; never erase failed-batch burden or assign prior-release burden anew."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "garnetting"
      flow_role: "receipt and each material/reject/dust/waste exchange"
      record_type: "lot_mass"
      raw_fields: "row_id; batch; physical_gate; timestamp; supplied_whole_mass; gross; tare; original_unit; constituent_assays; legal_status; receiver; opening_raw_WIP; closing_raw_WIP; opening_unused_nonWIP; closing_unused_nonWIP; per_exchange_inherited_vectors; issue_is_already_net; actual_loss_destination"
      collection_method: "Calibrated scales and lot-linked issue/return/collector records; retain each whole supplied formulation. Survey each real trim species and receiving function. Record raw unnormalized quantities and uncertainty; treat original mixture constituents as subaccounts."
      unit: "original mass unit; kg after conversion"
      frequency: "each event and stock close"
      temporal_coverage: "all runs and complete declared period"
      site_scope: "all foreground material gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; supplier composition; manifests; recipient receipts; burden lineage"
    - protocol_id: cp_utility
      process_id: "garnetting"
      flow_role: "each electricity and cleanup-water input"
      record_type: "meter"
      raw_fields: "row_id; meter_start; meter_end; interval; unit; voltage; geography; provider_boundary; measured_density; temperature; pressure; conversion; allocation_driver; failed_idle_cleanup_load"
      collection_method: "Read calibrated interval/submeters and invoices; distinguish total from rate; independently measure density when converting volume. Retain raw totals and dedicated/shared observations before allocation or division."
      unit: "kWh; kg; native meter units"
      frequency: "each shift and event"
      temporal_coverage: "complete period including no-output time"
      site_scope: "receipt sorting cutting opening extraction and ancillary support"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; supply invoice; causal driver; zero-output log"
    - protocol_id: cp_release
      process_id: "garnetting"
      flow_role: "first released reference output"
      record_type: "release_mass"
      raw_fields: "batch; first_release_id; acceptance_time; gross_mass; each_packaging_tare; net_fibre_mass; original_unit; moisture; wool_fraction; each_residual_fraction; length_distribution; unopened_fraction; receiver_specification; opening_FG; closing_FG; prior_release_flag"
      collection_method: "Weigh with a calibrated scale and reconcile net mass with unique first acceptance record; test composition/moisture and opening quality on representative samples. Keep original lot data; exclude reinspection and previously released returns from new Q."
      unit: "kg"
      frequency: "each first release"
      temporal_coverage: "complete production cohort"
      site_scope: "first quality-release gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; laboratory method; receiver acceptance; unique batch register"
    - protocol_id: cp_air
      process_id: "garnetting"
      flow_role: "each actual air emission"
      record_type: "monitoring"
      raw_fields: "row_id; species; phase; medium; particle_size; concentration; actual_flow_rate; integrated_volume_flag; sampling_interval; inlet_outlet_moisture; captured_dust; independent_water_measurements; detection_limit; actual_control_state"
      collection_method: "Use matched monitoring of concentration and actual exhaust flow with consistent standard/actual conditions; integrate rates once. Already integrated gas volumes are not multiplied by time again. Independently quantify free water and other exits; preserve censored results and uncertainty."
      unit: "original concentration and volume/rate units; kg after conversion"
      frequency: "representative operation and abnormal/cleanup events"
      temporal_coverage: "full period with measured coverage and gaps"
      site_scope: "actual air outlets including fugitive releases"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling method; matched flow; control logs; phase/media proof"
    - protocol_id: cp_service
      process_id: "fg_service"
      flow_role: "post-release increment and physical FG gates"
      record_type: "cohort_service"
      raw_fields: "original_cohort_id; original_Qc; opening_FG; closing_FG; internal_received; internal_sent; gross_dispatch; returned_received; outward_returns; original_delivery_reverse; true_added_rework; discard; H; meter_units; service_interval; limiting_driver; historic_burden_vector"
      collection_method: "Link scale/ticket/meter events to the original release; keep all gross movements and reverse only the identified original delivery when reporting net delivery. Collect actual service increments without production re-counting or any division."
      unit: "kg; kWh; native units"
      frequency: "each movement and period close"
      temporal_coverage: "current period plus inherited cohort history"
      site_scope: "storage packing handling dispatch and returns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original acceptance register; stock counts; returns; causal service allocation"
    - protocol_id: cp_packaging
      process_id: "fg_service"
      flow_role: "each packaging material and waste row"
      record_type: "component_ledger"
      raw_fields: "component_id; P_open_empty; P_open_attached_WIP; P_open_attached_FG; P_open_reusable; I; ER; P_close_empty; P_close_attached_WIP; P_close_attached_FG; P_close_reusable; S; EO; W; internal_reuse; unit; composition; provider; physical_destination; source_partition"
      collection_method: "Weigh/count and independently determine net component mass where counts are used. Reconcile every component at empty/attached/reusable gates and supplier/receiver records. Return raw P/I/ER/S/EO/W and reuse entries; composition partitions of one mixture remain non-additive."
      unit: "kg; counts retained separately"
      frequency: "each purchase use dispatch return discard and close"
      temporal_coverage: "full period and inherited packaging stocks"
      site_scope: "each actual packaging component"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing evidence; complete component reconciliation; receiver receipt"
  calculation_rules:
    - id: c_raw_units
      applies_to: "all inventory rows"
      rule: "Convert each unnormalized record to its selected exchange unit first. Compute concentration times matched integrated volume or integrate concentration times actual rate once; retain standard-state factors. No default density or source-table yield."
      inputs:
        - raw_records
        - measured_conversion
        - cp_material
        - cp_utility
        - cp_air
      output: "converted_raw_vector"
      source_ids:
        - bianco-mwool-2022
    - id: c_release
      applies_to: "garnetted_first_release"
      rule: "Q = sum(unique first accepted net fibre mass); closing FG of the same cohort is already included. A prior first release cannot become another Q through rework or shipment. Q = 0 retains real inventory without a unit result."
      inputs:
        - cp_release
        - first_release_id
        - accepted_net_mass
      output: "Q"
      source_ids:
        - bianco-mwool-2022
    - id: c_burden
      applies_to: "all inventory rows"
      rule: "A_i = opening_inherited_i + current_attributed_i - closing_inherited_i - explicitly_separated_other_function_i. Establish dedicated/virtual subdivisions and exchange-specific causality before calculating A_i. Use physically assigned raw-WIP and unused-nonWIP vectors separately. Inherited vectors already net in current_attributed_i are not deducted again; internal transfers cancel; record each signed movement exactly once."
      inputs:
        - converted_raw_vector
        - cp_material
        - cp_service
        - allocation_decision
      output: "A_i"
      source_ids:
        - ilcd-attributional-2010
    - id: c_single_intensity
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q for production; service increments use a_service_i_c = A_service_i_c / Qc of the original cohort. Perform each division once after conversion/attribution. Cards use a_i or a_service_i_c as already normalized results. Protocol aggregation fields declare this target reporting basis only; collectors never divide and cards never divide again. For Q = 0 report raw vector only; no invented denominator or pass."
      inputs:
        - A_i
        - Q
        - A_service_i_c
        - Qc
      output: "a_i; a_service_i_c"
      source_ids:
        - ilcd-attributional-2010
    - id: c_stock_intensity
      applies_to: "fg_received_stock; fg_returned_stock; fg_gross_dispatch; fg_outward_return"
      rule: "v_i_c = V_i_c / Qc. Assign each gross physical movement to its real original cohort before dividing once by its original released mass. V_i_c is physical kg and is not A_service_i_c or an additional burden/purchase. No new Q is created by receipt/return/dispatch; retain absolute stocks and signed transfer links alongside the unit display."
      inputs:
        - cp_service
        - V_i_c
        - Qc
      output: "v_i_c"
      source_ids:
        - ilcd-attributional-2010
    - id: c_physical
      applies_to: "all material gates"
      rule: "For each physical gate: opening stock + gross external received + paired internal received = closing stock + gross external dispatched + paired internal sent + actual waste + actual emissions. V is this gross physical movement ledger in consistent units; A is the attributed environmental exchange vector and is not V. At the combined gate internal Q transfers cancel; accepted stock remaining in closing FG is never another output added to Q. Reconcile total wet mass and relevant dry fibre/elements independently with actual species/phase evidence. No reaction water is assumed for mechanical fraying."
      inputs:
        - cp_material
        - cp_release
        - cp_service
        - cp_air
      output: "gross_V; gate_residuals; inherited_vector_transfers"
      source_ids:
        - bianco-mwool-2022
    - id: c_packaging
      applies_to: "hdpe_wrap; steel_tie; hdpe_wrap_waste; steel_tie_waste"
      rule: "For each separate component: P_open + I + ER = P_close + S + EO + W. P includes empty/attached-WIP/attached-FG/reusable stock; S follows gross physical shipments rather than net Q; internal reuse cancels. Component receipt with returned product is ER once even if attached. One mixed disposal gets one total treatment provider; source/composition partitions reconcile to that total and do not add providers."
      inputs:
        - cp_packaging
        - P_open
        - I
        - ER
        - P_close
        - S
        - EO
        - W
      output: "component_balance_residuals"
      source_ids:
        - bianco-mwool-2022
    - id: c_completeness
      applies_to: "all inventory rows"
      rule: "F contains every real newly observed exchange X absent from the current cards; add an atomic row with its own identity/unit/source/protocol before completion. Exclude X from F only for an exact same-side duplicate already itemized in OTHER; document its exact original row. OTHER is not a hiding place for unknown materials or emissions. Preserve all failure/zero-output loads."
      inputs:
        - physical_survey
        - all_raw_records
        - exact_duplicate_links
      output: "F; X; completeness_gaps"
      source_ids:
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Confirm full native names/synonyms/comments/CAS; route/form/grade/geography/media/type and every property. A matched name or classification alone is insufficient; provider compatibility and scientific approval are separate from UUID identity."
      evidence: "direct native record; exact property-unit chain; lot/source limitations"
    - id: dq_foreground
      applies_to: "all processes"
      requirement: "Require complete actual site-period records and explicit uncertainty; no reference range or factory recipe is invented. Assess representativeness of the chosen offcut stream; the mixed 2019 company study is qualitative route evidence only."
      evidence: "calibration; records; sampling design; missing-data log"
    - id: dq_balance
      applies_to: "all material gates"
      requirement: "Independently reconcile wet mass; dry wool and each residual co-fibre; actual water states and relevant elements. Retained dye/finish is not destroyed by opening. Do not treat oil/water or dust/evaporation as two variables fitted to one residual."
      evidence: "independent assays and gate balances with uncertainty"
    - id: dq_sources
      applies_to: "all rules"
      requirement: "Keep primary full-context evidence and applicability limits. Manufacturer pages/report and the collaborating paper do not constitute independent factory replications. General allocation guidance does not supply industrial values; a verified fragment never proves numeric applicability."
      evidence: "source locations; original/extraction provenance; applicability decisions"
validation_rules:
  - rule_id: v_scope
    applies_to: "all datasets"
    rule: "Reject unknown blended streams; undemonstrated mechanical opening; unprocessed noils; yarn/fabric/felt/web or wet/chemical alternatives presented as this product. Confirm actual wool composition and receiver/first-release gate."
    source_ids:
      - bianco-mwool-2022
      - manteco-project43
