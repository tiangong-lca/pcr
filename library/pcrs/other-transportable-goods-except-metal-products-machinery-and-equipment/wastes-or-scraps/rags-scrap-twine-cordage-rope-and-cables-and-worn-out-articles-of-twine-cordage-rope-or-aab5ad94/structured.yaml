      collection_method: "Weigh physical streams and stock changes; sample actual outlets across operating states; determine moisture uptake/release independently; preserve nonadditive total/source partitions and one provider; keep unnormalised raw masses and rates for calc_units and calc_allocate before sole calc_normalize"
      unit: "kg; m3; h; mg/m3"
