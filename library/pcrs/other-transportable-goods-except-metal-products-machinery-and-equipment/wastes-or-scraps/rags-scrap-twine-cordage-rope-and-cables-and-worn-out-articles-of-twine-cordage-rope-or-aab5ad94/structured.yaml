          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Received previously washed unwearable uncut coloured cotton-rich knitted T-shirts of one grade with actual prior wash/finish/moisture history. |\n| starting_condition_role | Actual raw supply for dry rag conversion; no purchase of finished wiping rags as a substitute for manufacture. |\n| product_classification_scope | Cut-cloth rags only within CPC 39218; retain fabric structure and wiping function; no reopened fibre or wearable-clothing output. |\n| recursive_input_rule | Previously first-released rag returns carry original cohort and burden history; only real incremental rework is added and no new Q is created. |\n| upstream_dataset_requirement | Link completed original garment production and prior use/cleaning according to the declared attributional transfer convention; include collection/sorting/transport not already included and each real utility/package/treatment provider once. A waste label alone proves neither zero burden nor an avoided-production credit. |\n| disclosure | Single grade; measured composition/finish/moisture; legal/receiver status; actual dry route; prior burden convention; site/period; Q/Qc/H; gross V and A; WIP/FG inheritance; returns/rework; six-leg packaging; allocation; actual species/destinations and identity gaps. |\n\nThese rules apply only to the single dry-cut rag route and first-release/cohort service gates defined above. Conditional cards enter only when physically present; actual absent operations require records, not assumed zeros. All protocols prescribe future collection, not already obtained plant measurements.\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| sb_start | raw_garments | Begin with the actual unwearable uncut garment supply. Preserve whole supply mass and prior burdens once; fibre assays and retained water/finish are nonadditive subledgers, not extra purchases. Include actual collection, transport and pre-sorting not already present upstream. Declare the attributional reuse/recycling transfer convention and its consistency at both sides; this PCR prescribes no universal burden-free cut-off. | `lmb-rag-recycling`; `ilcd-attributional-2010`; `lmb-coloured-tshirt` |\n| sb_route | conversion | Include all actual dry grading, hard-point removal, cutting/conveying, detection, dust control, inspection and maintenance through first release. Include every failed run, Q0, start-stop, idle, cleanup and real rework. SJS washing/sterilisation is a distinct documented route; actual wet treatment or fibre opening requires scope reassessment and full additional inputs/outputs, never a hidden zero. | `lmb-rag-recycling`; `sjs-rag-production` |\n| sb_gate | released_rags | Q is newly and uniquely first-released net cloth mass. ClosingFG of that cohort is already in Q and is never added as more production. Subsequent packing/storage/handling/dispatch burdens use original Qc in a service account; gross H, retesting, redelivery and returns do not create new Q. Cancel the internal first-release transfer and its received history on consolidation. | `lmb-rag-recycling`; `ilcd-attributional-2010` |\n| sb_physical | all physical gates | For manufacture reconcile openingWIP + new issued garments + measured ambient moisture uptake = closingWIP + first-release new Q + each reject + each actual release. Previously released old-cohort rework stays in services with its original Qc and is not new conversion output. Track unused raw-stock receipts/issues/returns separately. Reconcile whole mass and independently measured dry fibres/retained dyes/finish/foreign matter and free/sorbed water at manufacture, service and combined gates. This mechanical route invents no chemical reaction or structural/reaction water; one residual cannot fit two unknowns. COD/VOC indicators do not establish particular chemical masses. | `lmb-rag-recycling`; `ilcd-attributional-2010` |\n| sb_atomic | each actual exchange | Each actual purchased formulation is recorded once in its whole supplied form; active ingredients/assay/carrier water are subledgers. If mixed on site, record each purchased substance and real mixing energy/loss. Add individual cards for every real unlisted material, fuel, purchased heat, steam, water, lubricant, refrigerant, accessory and actual chemical species/destination. No collection bucket or residual other may conceal an exchange. No boiler/steam/condensate loop is presumed for dry cutting. If present, distinguish external Product return, actual thermal state/enthalpy and supplier water-energy convention. | `lmb-rag-recycling`; `sjs-rag-production`; `ilcd-attributional-2010` |\n| sb_package | each package component | For each actual material separately reconcile I + P + ER = C + S + EO + W. I/C include empty, WIP-attached, FG-attached and reusable stock. P is gross new purchase, ER external returns received, S outward attached to gross physical shipments, EO outward external-owner returns and W discarded. Internal reuse cancels. Packaging never enters net cloth Q, is not purchased again on reuse and receives no automatic coproduct/credit. Conditional PE-LD film and PP strap are distinct component interfaces, not proof of use at either cited factory; every other actual component has its own card and balance. | `lmb-rag-recycling`; `ilcd-attributional-2010` |\n| sb_outlet | dust and residual receivers | A mixed collection outlet has one measured whole stream with nonadditive source/composition partitions and one receiver/provider for that whole transfer. If physically segregated, use exclusive individual streams instead. Never add the whole and its partitions or book two treatments. Captured dust, cloth trims and atmospheric particulate are distinct physical destinations. No avoided virgin textile, energy recovery or landfill credit is automatic. | `ilcd-attributional-2010` |\n\n"
