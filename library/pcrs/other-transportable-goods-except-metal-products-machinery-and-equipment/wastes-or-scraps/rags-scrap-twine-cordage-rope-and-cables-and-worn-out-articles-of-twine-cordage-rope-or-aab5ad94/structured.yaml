  calculation_rules:
    - id: calc_units
      applies_to: "all inventory rows"
      rule: "Convert raw units before allocation: 1 kWh = 3.6 MJ; 1 t = 1000 kg. Integrate true rate over its measured duration once; cumulative mass/volume/energy is already integrated. Use independently measured substance/state density only when a volume conversion is needed. Retain gross V independently of attribution."
      inputs:
        - raw_measurements
        - unit_factors
        - rate_or_integral
        - measured_density
      output: "converted_raw_vectors"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_stock
      applies_to: "conversion"
      rule: "Reconcile manufacture under sb_physical and unused raw stocks separately. For every exchange carry openingWIP inherited vector + new raw vector - closingWIP inherited vector into completed-cohort attribution; track old-cohort returns separately and do not reapply a stock correction already posted in net issues. Dry constituent and water subledgers do not add to whole material mass. For each exchange F is newly introduced burden only; inherited opening raw/WIP vectors are added once and corresponding closing raw/WIP vectors withheld. X_OTHER is allowed only for an exact identified same-side duplicate already included in another vector. Never use X for genuine waste/output, unmeasured loss, a coproduct share or an opposite-side transfer; keep physical gross V unchanged."
      inputs:
        - gross_V
        - openingWIP_vectors
        - new_raw_vectors
        - closingWIP_vectors
        - unused_raw_stock
        - old_cohort_history
        - F_new
        - X_OTHER_same_side
      output: "cohort_raw_vectors"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_service
      applies_to: "services"
      rule: "openingFG + internal first-release receipt + external returns + actual ambient moisture uptake = closingFG + gross dispatch H + actual service rejects/releases; reconcile physical mass and every inherited burden vector. Reverse original delivery attribution for returns without erasing history; add only actual incremental rework/service. Trace service loads to original cohort Qc with carry-forward and settlement. Cancel internal transfer/history against manufacture in the combined gate. Manufacturing history on FG is carried physically, not added again to incremental service A. The service numerator contains only actual new service burden and its own accrual/carry-forward corrections; every earlier burden remains bound to the original cohort once."
      inputs:
        - original_Qc
        - openingFG
        - closingFG
        - internal_receipt
        - returns
        - H
        - service_rejects
        - inherited_vectors
        - incremental_service
        - moisture_uptake
      output: "cohort_service_vectors"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_packaging
      applies_to: "each packaging component"
      rule: "Apply sb_package independently to each actual material including incoming packages. P and ER are distinct; S follows gross physical outward H and EO is other external-owner return. Internal reuse cancels. Carry actual package inherited vectors and avoid repurchase, cloth-Q inclusion and automatic credits. Attribute component use and burden from opening/new/closing vectors before A; purchase P is a physical procurement total, not an instruction to charge unused closing stock to the cohort."
      inputs:
        - I
        - P
        - ER
        - C
        - S
        - EO
        - W
        - package_inherited_vectors
        - internal_reuse
      output: "component_raw_vectors"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_allocate
      applies_to: "all inventory rows"
      rule: "First assign dedicated and virtually subdivided exchanges, then exchange-specific determining physical causality under a_causality; only the proven remainder follows a_residual at the same common gate/state. Reconcile all co-function vectors to the unallocated vector. A is the attributable unnormalised exchange numerator after unit conversion and stock/history attribution, distinct from physical gross V."
      inputs:
        - cohort_raw_vectors
        - cohort_service_vectors
        - component_raw_vectors
        - dedicated_vectors
        - causal_drivers
        - same_gate_values
      output: "A"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "n = A / Q. For manufacturing Q is newly first-released net cloth kg; for cohort services the same operator uses original Qc fixed at that cohort first release. This is the only division. Cards and aggregation reference this existing result without calculating it again. released_rags is 1 kg. H and closingFG are never extra denominators or new production. If applicable Q or original Qc is zero retain real burdens with no unit result."
      inputs:
        - A
        - Q
        - original_Qc
      output: "n per 1 kg reference flow"
      source_ids:
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Check complete native type/form/route/geography/media/CAS/property identity and actual provider; retain exact official Chinese displays. A broad basename does not verify supplier composition or quantities. Unbound auxiliary identities require concrete names and tracking; no substitute by classification alone."
      evidence: "native records; certificates; actual supplier and receiver"
    - id: dq_scope
      applies_to: "raw_garments; released_rags"
      requirement: "Require non-wearability, one grade, composition/finish/moisture and receiver quality evidence. Wet treatment, opening, wearable reuse and used contaminated wiping-service endpoints are outside the declared dry rag route."
      evidence: "supplier history; fibre tests; receiver acceptance; route records"
    - id: dq_complete
      applies_to: "all records"
      requirement: "Retain failures/Q0/idle/start-stop/cleanup, raw V, attributable A, all WIP/FG exchange vectors and cohort service settlement. State measurement uncertainty and source geographic/temporal limitations; prescribed protocols are collection requirements, not already measured factory values."
      evidence: "complete logs; stock vectors; uncertainties; cohort reconciliation"
    - id: dq_receivers
      applies_to: "each outlet and packaging component"
      requirement: "Verify single total versus nonadditive partitions, one actual treatment provider per physical transfer, all six packaging legs and actual species. No automatic recycling/reuse credits or composition inferred from a residual."
      evidence: "receiver tickets; composition; package ledgers; outlet samples"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "All validation below retains the single-grade dry-route and cohort restrictions in §§1, 3 and 5. A check is evidence of the stated relationship only; missing real records cannot be declared measured, and a passed schema does not prove methodology approval."
    source_ids: []
  - rule_id: v_boundary
    applies_to: "dataset before use"
    rule: "Verify one unwearable garment grade becomes a retained-structure wiping Product through the complete actual dry conversion route and accepted endpoint. Check no 39217 wearable reuse, 39214 noil or 39215 opened fibre substitution. Confirm actual legal and receiver status."
    source_ids:
      - unsd-cpc-2025
      - lmb-rag-recycling
      - sjs-rag-production
  - rule_id: v_identity
    applies_to: "all UUID-bearing rows"
    rule: "Verify full native Product/Waste/Elementary type, all names/comments/facets and exact reference property/unit-chain compatibility. Respect all description restrictions and official Chinese baseNames. No landfill service as supplied rag, no farm twine as flat strap, no garment-manufacture trim as post-consumer cut scrap, no water-treatment cotton fabric as wiping cloth."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_mass
    applies_to: "manufacture service and consolidated gates"
    rule: "Reconcile sb_physical and calc_service including gross V, all failures/Q0, each constituent and water measurement, raw stock, WIP/FG inheritance and returns. Q includes closingFG once; dispatch/retest produces no new Q. Do not solve two unknowns using one residual or count internal first-release Q twice."
    source_ids:
      - ilcd-attributional-2010
      - lmb-rag-recycling
  - rule_id: v_once
    applies_to: "all inventory rows"
    rule: "Trace unnormalised raw records through unit conversion, stock/history attribution and documented allocation to A; calc_normalize divides once. Collection, card display and aggregation consume that same result; no serial A/Q/Q. For service use original Qc, not H or current new releases. Retain Q0 actual burdens without a unit result."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_allocate
    applies_to: "remaining joint exchanges"
    rule: "Confirm attributional context, dedicated/virtual subdivision first and exchange-specific determining physical causality next. Only genuinely remaining joint burden uses actual same-gate/state contemporaneous values with sensitivity; document no free physical/economic choice and no automatic material/energy credit."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_package
    applies_to: "each packaging component"
    rule: "Check I/P/ER/C/S/EO/W independently for every material with empty/WIP-attached/FG-attached/reusable stock and inbound ownership history. S follows gross physical dispatch and redelivery; internal reuse is cancelled and not repurchased, added to Q or credited."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_outlet
    applies_to: "each actual waste and species release"
    rule: "Confirm independent measurement and actual destination; total/partitions do not overlap and each physical transfer has one treatment provider. Captured dust is not atmospheric release; total particulate and nested size fractions are not additive. Add any actual unlisted atomic exchange before dataset use."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_readiness
    applies_to: "dataset before use"
    rule: "Verify every qualifier, full source context, collection/calculation fields, current schema/fingerprints and actual provider restrictions. Ordinary missing auxiliary identity or future plant measurements stay explicit; a genuine unresolved core route, accepted terminal or reference identity prevents use and requires draft status. Engineering checks do not establish scientific/translation approval or mapping/publication."
    source_ids:
      - ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared dry cotton-rich wiping-rag supply under a consistent attributional transfer convention."
  allowed_use: "Actual compatible grade and measured manufacturing/service records with qualified native flows and representative suppliers."
  excluded_use: "Wearable-clothing reuse; opened fibre; wet treatment without scope reassessment; solvent/oil wiping service or spent wiping waste; unverified zero-burden cut-off; automatic substitution or chemical-free claim."
  required_metadata: "one coloured knitted T-shirt grade and supplier lot; evidence garments are unfit for direct clothing reuse; retained knitted T-shirt cloth structure; measured cotton and each co-fibre fraction and test method; original colour and retained dye and finish identity; prior use and cleaning history and contaminant screening; actual dry sorting accessory removal and cutting route; actual absence of on-site washing bleaching sterilisation and fibre opening; cut dimensions and absorbency and lint and metal acceptance tests; receiver specification and legal supply or waste status; as-released net mass and measured moisture excluding packages; unique first release Q and original cohort Qc; gross physical V and attributable unnormalised A; opening and closing raw stock and WIP with each exchange inheritance vector; opening and closing FG and gross shipments H and return history; each package composition and full six-leg stock ledger; actual site period voltage geography and utility provider; allocation scenario and exchange-specific causal evidence; separate reject dust and actual species outlet destinations; upstream completed operations and inherited burden convention"
  required_quality_disclosure: "Source-specific limitations; actual route/quality evidence; ordinary auxiliary UUID/provider gaps; uncertainty; all failed and Q0 loads; stock/inheritance and service carry-forward; characterization gaps; scientific review pending."
  update_trigger: "Change in garment grade/composition/finish/history; route or endpoint; first-release basis; utilities/provider; packaging; transfer/allocation convention; stock/service model or stronger contrary evidence."
