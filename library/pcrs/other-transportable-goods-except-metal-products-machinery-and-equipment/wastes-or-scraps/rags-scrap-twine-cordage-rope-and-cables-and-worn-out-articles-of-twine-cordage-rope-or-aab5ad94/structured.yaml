          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\nThe allocation rules below concern the declared attributional scenario only. Industrial process pages establish operations, not LCA allocation. Keep physical gross quantities V separate from attributable burden A; coproduct allocation does not rescale the physical balance.\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| a_context | all attributional exchanges | Use only the declared attributional scenario in which partitioning is required. Document incoming end-of-life material transfer convention separately and consistently; do not infer it from a positive sale price or from CPC. A waste-treatment service has a different reference function. Consequential substitution requires another goal/scope. | `ilcd-attributional-2010` |\n| a_subdivide | all inventory rows | Assign dedicated operations and actual embodied supplies first. Test real subdivision and then virtual subdivision of exclusive exchanges before allocation; retain measured evidence and any distortion from infeasible subdivision. Dedicated cut-rag inspection/packing is not shared with rejected clothing merely because both pass the same building. | `ilcd-attributional-2010` |\n| a_causality | remaining joint exchanges | For each remaining exchange identify what quantitatively changes that exchange when the co-functions change. Establish determining physical causality with measured equipment/material/service evidence; do not assume one mass or economic key for all flows. Time with actual power, occupied volume-time, or embodied material is usable only when proven determining for that exchange. | `ilcd-attributional-2010` |\n| a_residual | genuinely remaining joint exchanges | Only after documenting why subdivision and determining physical causality cannot resolve the particular remainder use representative contemporaneous market value at the same common process gate and actual quality/state/quantity. Derive that value from later prices by removing separate later cutting, cleaning, packing, storage and freight costs. Retain all co-output values and sensitivity; zero/negative prices do not imply zero burden or a free credit. No fixed allocation percentage or arbitrary physical/economic choice. | `ilcd-attributional-2010` |\n\n"
