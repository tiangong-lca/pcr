\n| v_allocate | remaining joint exchanges | Confirm attributional context, dedicated/virtual subdivision first and exchange-specific determining physical causality next. Only genuinely remaining joint burden uses actual same-gate/state contemporaneous values with sensitivity; document no free physical/economic choice and no automatic material/energy credit. | `ilcd-attributional-2010` |\n| v_package | each packaging component | Check I/P/ER/C/S/EO/W independently for every material with empty/WIP-attached/FG-attached/reusable stock and inbound ownership history. S follows gross physical dispatch and redelivery; internal reuse is cancelled and not repurchased, added to Q or credited. | `ilcd-attributional-2010` |\n| v_outlet | each actual waste and species release | Confirm independent measurement and actual destination; total/partitions do not overlap and each physical transfer has one treatment provider. Captured dust is not atmospheric release; total particulate and nested size fractions are not additive. Add any actual unlisted atomic exchange before dataset use. | `ilcd-attributional-2010` |\n| v_readiness | dataset before use | Verify every qualifier, full source context, collection/calculation fields, current schema/fingerprints and actual provider restrictions. Ordinary missing auxiliary identity or future plant measurements stay explicit; a genuine unresolved core route, accepted terminal or reference identity prevents use and requires draft status. Engineering checks do not establish scientific/translation approval or mapping/publication. | `ilcd-attributional-2010` |\n\n"
