  excluded_products: "Directly reusable second-hand clothing of 39217; non-garnetted cotton noil of 39214; mechanically opened cotton fibre of 39215; new wiping fabric manufacture; scrap rope/cable/twine; wet-laundered or bleached rag manufacture; unresolved mixed grades; wiping service; used solvent/oil-contaminated wiping waste as the reference output."
