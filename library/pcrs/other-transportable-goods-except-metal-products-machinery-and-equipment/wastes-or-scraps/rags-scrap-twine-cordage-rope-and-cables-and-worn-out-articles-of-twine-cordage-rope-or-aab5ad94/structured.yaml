allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The allocation rules below concern the declared attributional scenario only. Industrial process pages establish operations, not LCA allocation. Keep physical gross quantities V separate from attributable burden A; coproduct allocation does not rescale the physical balance."
    source_ids: []
  - rule_id: a_context
    applies_to: "all attributional exchanges"
    rule: "Use only the declared attributional scenario in which partitioning is required. Document incoming end-of-life material transfer convention separately and consistently; do not infer it from a positive sale price or from CPC. A waste-treatment service has a different reference function. Consequential substitution requires another goal/scope."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_subdivide
    applies_to: "all inventory rows"
    rule: "Assign dedicated operations and actual embodied supplies first. Test real subdivision and then virtual subdivision of exclusive exchanges before allocation; retain measured evidence and any distortion from infeasible subdivision. Dedicated cut-rag inspection/packing is not shared with rejected clothing merely because both pass the same building."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_causality
    applies_to: "remaining joint exchanges"
    rule: "For each remaining exchange identify what quantitatively changes that exchange when the co-functions change. Establish determining physical causality with measured equipment/material/service evidence; do not assume one mass or economic key for all flows. Time with actual power, occupied volume-time, or embodied material is usable only when proven determining for that exchange."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_residual
    applies_to: "genuinely remaining joint exchanges"
    rule: "Only after documenting why subdivision and determining physical causality cannot resolve the particular remainder use representative contemporaneous market value at the same common process gate and actual quality/state/quantity. Derive that value from later prices by removing separate later cutting, cleaning, packing, storage and freight costs. Retain all co-output values and sensitivity; zero/negative prices do not imply zero burden or a free credit. No fixed allocation percentage or arbitrary physical/economic choice."
    source_ids:
      - ilcd-attributional-2010
