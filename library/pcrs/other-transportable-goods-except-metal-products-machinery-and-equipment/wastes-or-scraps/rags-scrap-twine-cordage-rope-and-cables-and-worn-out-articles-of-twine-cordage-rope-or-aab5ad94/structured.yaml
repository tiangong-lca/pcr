    - protocol_id: cp_material
      process_id: "conversion"
      flow_role: "whole garment supply and stock inheritance"
      record_type: "scale and lot records"
      raw_fields: "row_id; lot; grade; gross V; supplier state; tare; fibre assay; each co-fibre; dye; finish; water; accessories; prior burden vector; opening_raw; closing_raw; raw_issues; raw_returns; openingWIP; closingWIP; per_exchange_inheritance"
      collection_method: "Calibrated net weighing and matched representative composition/moisture tests; reconcile receipts/issues and every WIP exchange vector; keep raw quantities unnormalised; calc_units then calc_stock then calc_allocate then calc_normalize once"
      unit: "kg"
      frequency: "each lot and shift"
      temporal_coverage: "whole cohort including failures and Q0"
      site_scope: "all conversion gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; composition tests; inventory tickets; upstream convention"
    - protocol_id: cp_release
      process_id: "conversion"
      flow_role: "unique first quality release"
      record_type: "release register and laboratory tests"
