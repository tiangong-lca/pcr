    reference: "European Commission JRC, ILCD Handbook General guide for LCA — Detailed guidance, first edition March 2010, §7.9 pp.255–268 (PDF275–288): https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional-context limits; dedicated/virtual subdivision; determining physical causality per exchange; genuine residual market value at common gate/state and service causality. No rag engineering factor or default end-of-life burden convention."
  - id: "lmb-coloured-tshirt"
    type: "extension_guidance"
    reference: "LMB Supplies Ltd, Recycled Wipes and Rags Full Range, complete Coloured T-shirt grade with adjacent-grade context: https://www.lmb-supplies.co.uk/collections/recycled-wipes-and-rags-full-range"
    used_for: "Single previously washed coloured T-shirt wiping-cloth supply form; attributes vary by bag and wash location is undisclosed. Advertised numerical specifications are not transferred."
