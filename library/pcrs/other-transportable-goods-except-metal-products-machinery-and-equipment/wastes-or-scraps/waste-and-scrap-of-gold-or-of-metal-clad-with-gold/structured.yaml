measurement_rules:
  - id: m_reference
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is newly first-released net as-received offcut mass from cp_release; exclude packaging/separated liquid/rejects. Closing FG already containing this Q is not added again. Fine-gold and dry mass are separate measured subaccounts, not replacement denominators."
  - id: m_units
    applies_to: "all exchanges"
    required_property_ref:
      name: "Actual native reference property"
      uuid: ""
    required_unit: "actual unit"
    rule: "Convert raw g/t/troy-ounce records to kg with declared units; distinguish troy from avoirdupois ounces and fineness from mass. Convert electricity kWh to MJ by 3.6 MJ/kWh. Preserve native road kg*km; one t*km is 1000 kg*km. No item-to-kg, density, heat value or motor-power intensity is guessed."
  - id: m_water
    applies_to: "quench and releases"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use independent water-state measurements; already integrated gas/liquid volume is not multiplied by time. Integrate a true rate over time first, at the measured state. Separate free/phase-change/reaction water, metals/oxygen balances and species evidence; a single residual cannot identify two unknowns."
  - id: m_normalisation
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual exchange numerator"
      uuid: ""
    required_unit: "per 1 kg reference flow"
    rule: "Collect undivided raw records, convert, attribute and carry WIP vectors before c_normalise performs the only A_j/Q. Cards and aggregation refer to that same result. Original-cohort service c_services uses disjoint H_jc and original Q_c once; H is not production denominator. When Q=0 retain actual load and stocks with no unit production result."
