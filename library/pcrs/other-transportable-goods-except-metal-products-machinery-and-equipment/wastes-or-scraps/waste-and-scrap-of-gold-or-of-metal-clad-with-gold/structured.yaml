      flow_role: "each original-cohort service"
      record_type: "service meters shipment and receipt"
      raw_fields: "cohort c; original Q_c; each raw H_jc; beginning/ending FG; gross dispatch/return; recheck/rework; route/distance/gross load; receiver legal entity; permit/registration or exemption; written acceptance; receipt"
      collection_method: "Track each released lot and disjoint postrelease service through receiver receipt, including returns, repacking, idle, cleanup and real incremental rework. Verify legal entity/facility/authorisation and material acceptance independently of UUID. Do not collect pre-divided amounts"
      unit: "original exchange units; kg; kg*km"
      frequency: "each event and cohort reconciliation"
      temporal_coverage: "full cohort service history including opening FG"
      site_scope: "first release through actual receiving gate"
