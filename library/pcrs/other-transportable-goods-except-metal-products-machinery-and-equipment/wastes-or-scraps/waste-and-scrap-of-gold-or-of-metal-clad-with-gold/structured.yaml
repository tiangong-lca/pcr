system_boundary:
  rules:
    - rule_id: b_chain
      applies_to: "complete chain"
      rule: "Include actual supply of whole alloy and inherited mining/refining/alloying/casting/preparation through one compatible upstream provider, actual forming/thermal/stamping/finishing and scrap formation, segregation/qualification and cohort services to receiving gate. Avoid overlap where a bought supply already includes a unit operation. Industrial evidence supports unit architecture, not allocation or zero burden."
      source_ids:
        - gjsci-components-2013
        - brepohl-refining
        - mw-scrap
        - jrc-ilcd-2010
    - rule_id: b_gate
      applies_to: "first release and services"
      rule: "The production gate is unique first feed-quality release, not dispatch/payment/refining outturn. Record original cohort services afterward through actual receiver receipt including packing/storage/repacking/loading/transport/return/cleanup. No receipt or recheck creates production Q. A rejected receiver lot retains original burden and actual return/rework route."
      source_ids:
        - mw-terms-2023
        - jrc-ilcd-2010
    - rule_id: b_receiver
      applies_to: "refinery receipt"
      rule: "Verify receiver legal entity and exact facility separately from flow identity: written feed criteria; source/ownership and hazardous-material disclosure; current authorisation/registration or permit/exemption applicable to actual waste/product state and jurisdiction; evidence of verification and actual consignment receipt. Morris and Watson terms identify one company and discretionary acceptance with oil/liquid/toxic-metal/low-grade exclusions, not a transferable permit or a promise to accept every gold alloy. If any decisive acceptance/legal condition is unknown, hold that application at the gate."
      source_ids:
        - mw-scrap
        - mw-terms-2023
    - rule_id: b_extension
      applies_to: "actual additional operations"
      rule: "The selected thermal route is electric annealing and water quench as actually needed, with no assumed boiler/steam/refining. Every actual fuel, gas, reagent, cleaner, oil, abrasive, packaging item, waste and molecular emission absent from these candidate cards must be added atomically with raw records, native restrictions, provider and source evidence before use. Absence, rather than missing data, justifies not_applicable. Never hide actual manufacture in other or zero."
      source_ids:
        - gjsci-components-2013
        - brepohl-refining
    - rule_id: b_physical
      applies_to: "physical reconciliation"
      rule: "Keep full unallocated gross physical V for forming, preparation, FG and combined gates. Pair all internal transfers including released feed, process return and packaging reuse, cancelling them only in the combined boundary. Whole mixed stream mass, origin partitions and assay constituents are non-additive and use one provider per physical transfer. All stock movements keep species and individual inherited exchange vectors."
      source_ids:
        - gjsci-components-2013
        - jrc-ilcd-2010
