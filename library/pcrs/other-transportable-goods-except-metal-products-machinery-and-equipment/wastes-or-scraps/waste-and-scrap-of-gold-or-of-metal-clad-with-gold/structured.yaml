allocation_rules:
  - rule_id: a_context
    applies_to: "attributional decision"
    rule: "Use only the attributional allocation context where partitioning is required. State why it applies and distinguish traded co-products from waste management and negative-value streams. Source material is never automatically burden-free; document compatible upstream/downstream recycling/waste conventions with both parties. Industrial production and receiver evidence does not establish an LCA key."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_subdivision
    applies_to: "all exchanges"
    rule: "First separate dedicated component manufacture, offcut-only preparation and postrelease services by real subdivision; use virtual subdivision for exclusively attributable materials/services with a quantified technical relation. Keep each exchange and inherited source-alloy vector once across all co-functions. Never assign the entire joint line to offcuts or omit its formation."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_causality
    applies_to: "each remaining exchange"
    rule: "Establish the exchange-specific determining physical causal relation before choosing any remaining key. Measured alloy actually embodied in each output may support that material relationship, but does not automatically allocate furnace/press/idle/cleanup by the same mass or Au fraction. Show how a co-function determines each exchange; no free choice between physical and economic keys. Gross physical balances do not use allocated fractions."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_residual
    applies_to: "genuinely residual exchange"
    rule: "Only for a justified residual after subdivision and determining physical causality use representative contemporaneous market value of actual co-functions in their actual state at the same common process gate. Adjust downstream quotations for later refining/finishing/preparation/services and record price basis, quantity, currency, period, adjustments and sensitivity. Missing, zero/negative or incompatible prices require review, not fabricated or absolute-value shares. Allocated vectors sum back to the complete raw inventory."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_no_credit
    applies_to: "recovery and returns"
    rule: "No fixed fineness/yield, zero historical burden, automatic recycling credit, avoided virgin-gold production, avoided disposal or downstream-refining yield is prescribed. Au assay is neither saleable fine-gold output nor credit. Actual internal loops cancel; external returns preserve actual history. One physical lot cannot be both reference offcuts and a separately credited co-product."
    source_ids:
      - jrc-ilcd-2010
