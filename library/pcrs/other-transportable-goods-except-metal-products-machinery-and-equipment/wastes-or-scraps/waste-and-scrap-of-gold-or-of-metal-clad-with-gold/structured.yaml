      collection_method: "Use independent calibrated molecular/particulate and thermal observations across modes; convert each at its own measured state. Retain indicator results as indicators until speciation. No borrowed water density, guessed gas volume or double time integration"
      unit: "kg; raw volume/rate; MJ"
      frequency: "continuous or representative event measurements"
      temporal_coverage: "all start-stop failure normal idle and cleanup modes"
      site_scope: "actual process and environmental interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling/calibration; independent phase/reaction evidence; uncertainty"
  calculation_rules:
    - id: c_release
      applies_to: "gold_feed"
      rule: "Q = sum of unique new first-release net offcut masses in kg. Q excludes packaging/separated liquids/rejects and is not shipment, Au content or closing FG added again. Keep the same lot identity through receiver receipt."
      inputs:
        - cp_release
        - cp_stocks_forming
        - cp_stocks_preparation
      output: "Q"
      source_ids:
        - mw-terms-2023
        - jrc-ilcd-2010
    - id: c_units
      applies_to: "all inventory rows"
      rule: "Convert each undivided raw numerator to its declared exchange unit: g/1000 -> kg; kWh*3.6 -> MJ; t*km*1000 -> kg*km. Integrate only true rates; integrated volume stays volume. Convert volume to mass only using independent density of that substance at actual state. Assay partitions do not multiply whole purchased alloy into multiple inputs."
      inputs:
        - raw_records
        - cp_origin
        - cp_energy_forming
        - cp_energy_preparation
        - cp_materials_forming
        - cp_materials_services
        - cp_species
      output: "converted_raw"
      source_ids:
        - gjsci-components-2013
        - jrc-ilcd-2010
    - id: c_attribute
      applies_to: "all inventory rows"
      rule: "For each exchange j use dedicated/virtual subdivision, determining physical causality and only justified residual common-gate value under section7. A_j = opening-WIP inherited vector_j + actually attributed converted load_j - closing-WIP inherited vector_j, with paired internal return/transfer vectors reconciled. Retain all failed/zero-output/start-stop/idle/cleanup/rework loads and every other co-function. This is a burden ledger, not the gross physical V balance."
      inputs:
        - converted_raw
        - cp_stocks_forming
        - cp_stocks_preparation
        - allocation_records
      output: "A_j"
      source_ids:
        - jrc-ilcd-2010
    - id: c_normalise
      applies_to: "all inventory rows"
      rule: "For Q>0, a_j = A_j / Q exactly once. Cards and protocol aggregation refer only to this result. For Q=0 retain A_j and stock histories and issue no per-unit production result. gold_feed reference output is 1 kg after this same operation."
      inputs:
        - A_j
        - Q
        - cp_release
      output: "a_j"
      source_ids:
        - jrc-ilcd-2010
    - id: c_services
      applies_to: "services"
      rule: "For original released cohort c with Q_c>0, s_jc = H_jc / Q_c once for disjoint actual postrelease service only. Link s_jc to the cohort production profile without another division; H is not Q and is never fed through current production A_j/Q. Preserve opening FG burden, returns, original shipment reversal and only actual incremental rework; no recheck or delivery creates output. For missing/zero Q_c retain H and hold the unit service result."
      inputs:
        - cp_services
        - cp_packaging
        - cp_stocks_forming
        - cp_stocks_preparation
        - Q_c
      output: "s_jc"
      source_ids:
        - jrc-ilcd-2010
    - id: c_physical
      applies_to: "all physical gates"
      rule: "For each gate keep opening physical stocks + external receipts + real reaction uptake = closing stocks + external exits + measured species releases. Manufacturing exits include Q once; accepted closing FG is inside Q and not a second manufacturing output. FG gate on full actual as-received mass: opening released FG + paired Q + actual received returns + FG_in = closing FG + gross physical shipments + actual service rejects + FG_out, with internal service transfers paired. FG_in and FG_out are independently measured actual postrelease material/water/species or phase-transfer legs crossing this same gate, including genuine reaction uptake or vapour/removed-liquid exits when present; exclude anything already in returns, shipment, rejects or another term on that same side. Internal phase redistribution is not an external mass source. Keep dry-metal and fine-Au companion accounts separate from this whole-mass gate. Add each actual missing atomic interface and raw service/state record before claiming completeness; no wet operation, reaction yield or phase loss is defaulted. Combine gates by cancelling internal Q and other paired movements. Reconcile total mass and each relevant Au/Ag/Cu/other-element independently from species/reaction-water evidence; disclose uncertainty and do not force closure."
      inputs:
        - cp_origin
        - cp_outputs_forming
        - cp_outputs_preparation
        - cp_stocks_forming
        - cp_stocks_preparation
        - cp_release
        - cp_services
        - cp_species
      output: "physical_reconciliation"
      source_ids:
        - gjsci-components-2013
        - jrc-ilcd-2010
    - id: c_packages
      applies_to: "each packaging article"
      rule: "For each can/label/tape separately: opening empty + opening attached-WIP + opening attached-FG + opening reusable + P + ER = C + S + EO + W. C includes all equivalent closing states; S is packaging leaving with gross physical shipments even for returns/repeated shipments. Internal reuse cancels and is neither purchase nor product Q. A new external interface X may extend only its actual side; remove OTHER only when evidence proves it is that exact same-side duplicate. Preserve ownership, prior burden and contamination; do not add metal assay partitions again."
      inputs:
        - cp_packaging
        - cp_services
        - cp_stocks_forming
        - cp_stocks_preparation
      output: "packaging_reconciliation"
      source_ids:
        - brepohl-refining
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference and supply"
      requirement: "One actual alloy lot, whole formulation/article identity, source operations, receiver specification and physical state; document every UUID restriction and unresolved provider identity."
      evidence: "supplier and native identity evidence; representative assays"
    - id: dq_completeness
      applies_to: "all modes and stocks"
      requirement: "Cover the complete period, all failures/start-stop/idle/cleanup/rework/Q-zero, stocks and per-exchange inherited vectors, each actual flow and fate; do not delete missing observations."
      evidence: "raw mode logs; stock/vector reconciliation"
    - id: dq_measurement
      applies_to: "all numerators and Q"
      requirement: "Calibrated scales/meters, representative sampling and independent state/phase/species observations. Quantify precision and missingness; no default alloy assay, recovery, density or production setting."
      evidence: "calibration; analytical methods; uncertainty"
    - id: dq_context
      applies_to: "allocation and receipt"
      requirement: "Verify study context and independent receiver legal/technical suitability; document source-specific limits. Recipe evidence does not approve allocation and a Product UUID does not approve a waste transfer."
      evidence: "allocation decision; authorisation and acceptance verification"
    - id: dq_bilingual
      applies_to: "complete data package"
      requirement: "EN/ZH preserve the same events, qualifiers, exchange/flow identity, one-time formula, sources, conditions and uncertainty. Official Chinese UUID basenames stay exact."
      evidence: "paired records; complete semantic/projection audit"
validation_rules:
  - rule_id: v_scope
    applies_to: "application"
    rule: "Verify the complete covered alloy/route/source/form conjunction and exclusions including 39332/39333; source specification/assay and actual receiving conditions are required."
    source_ids:
      - un-cpc3-2025
      - gjsci-components-2013
      - mw-terms-2023
  - rule_id: v_identity
    applies_to: "each UUID"
    rule: "Check native Product/Waste/Elementary type, all name components/comments/synonyms, CAS, grade/route/form/geography/medium and every property. Use exact referenced property/unit-group chain and real reference unit, no latest substitution. Reject hard identity contradictions even if classification matches; retain all restrictions in the consuming context."
    source_ids:
      - mw-terms-2023
  - rule_id: v_basis
    applies_to: "Q and load"
    rule: "Confirm unique first release, separate Au/dry/whole mass, no closing-FG double production, c_units and attribution before the only c_normalise, original Q_c service basis, and retained Q-zero loads."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_balances
    applies_to: "physical and packaging"
    rule: "Check every gate including the complete as-received FG equality in c_physical with independently measured non-overlapping FG_in/FG_out postrelease material/water/species/phase legs and their actual atomic interfaces. Keep dry-metal/fine-Au subaccounts separate. Check combined transfers, whole mixture versus partitions, element and water/species evidence independently, every packaging state/return/fate and complete WIP/FG inherited vectors. Unknown relationships remain explicit review items; do not force a numerical pass."
    source_ids:
      - gjsci-components-2013
      - brepohl-refining
      - jrc-ilcd-2010
  - rule_id: v_receiver
    applies_to: "receipt endpoint"
    rule: "Missing current receiver authorisation/acceptance, incompatible transfer status, oil/hazard/low-grade rejection or missing decisive assay prevents use of the actual receiving endpoint. Keep held material and burden, not fictional refining output or coverage."
    source_ids:
      - mw-scrap
      - mw-terms-2023
  - rule_id: v_review
    applies_to: "data package"
    rule: "Run finite measurement, source/content fingerprint and Schema checks; separately assess scientific applicability and translation. Engineering success is not scientific/translation review, accepted classification mapping or publication."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Compatible attributional models of the declared source gold-alloy offcut feed through receiving gate, retaining all qualifiers and cohort services"
  excluded_use: "Universal recovery, burden-free scrap, substitution credit for pure gold, non-gold/ash/clad feed, used jewellery, refinery output or unconditional legal approval"
  required_metadata: "source supplier and alloy lot; whole supplied alloy specification and upstream burden coverage; measured Au and each other constituent with assay basis and uncertainty; homogeneous uncoated alloy and bar-to-sheet route; large unburned sheet-offcut form; measured moisture and separated liquid; foreign-material and oil contamination with methods and limits; actual electric heating and quench state; first-release event and net mass Q; opening and closing WIP with per-exchange inherited vectors; released FG cohort identity and original Q_c; actual receiver legal entity and location; verified receiver authorisation for the actual material and jurisdiction; receiver-agreed specification and written acceptance with consignment receipt; actual legal waste or product transfer status; allocation decision context and row-specific hierarchy; utility country voltage and provider boundary; packaging identity tare ownership and all returns; transport route distance gross load and return convention"
  required_quality_disclosure: "Full supply and co-function boundary; raw period; inherited vectors; allocation hierarchy; UUID restrictions; legal/technical receipt verification; gaps/uncertainty; science and translation state"
  update_trigger: "Change to alloy/source, forming/thermal route, contamination/moisture, provider, receiver specification/authorisation/legal state, measurement or allocation evidence"
