      collection_method: "Reconcile physical quantities and inherited per-exchange vectors at both boundaries for every lot; separate usable remnant, held feed and already released FG; carry failures and cleanup rather than discard their load"
      unit: "kg; original exchange units"
      frequency: "each transfer and reporting boundary"
