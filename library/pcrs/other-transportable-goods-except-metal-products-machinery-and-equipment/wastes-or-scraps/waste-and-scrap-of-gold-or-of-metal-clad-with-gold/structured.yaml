      collection_method: "Weigh the qualified net solid offcut lot on a calibrated scale, exclude packaging and separated liquid, and bind representative assay and written receiver criteria to one unique first-release event. Rechecks/returns/dispatch do not create another event"
      unit: "kg"
      frequency: "each unique first release"
