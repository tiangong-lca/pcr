  semantic_boundary: "One identified homogeneous uncoated gold-alloy jewellery-stamping source; whole supplied alloy through actual formation and large solid offcut preparation to first feed release plus separately accounted services through refinery receipt. Distinct from non-gold silver-copper cold-cut offcuts, ash, clad material, finished jewellery and refined bullion."
  method_evidence: "Qualitative technical synthesis of original GJSCI gold component manufacture, Brepohl scrap handling, named refiner scrap/terms and attributional ILCD. No current factory quantities, fixed assay, recovery, density or credit is asserted."
