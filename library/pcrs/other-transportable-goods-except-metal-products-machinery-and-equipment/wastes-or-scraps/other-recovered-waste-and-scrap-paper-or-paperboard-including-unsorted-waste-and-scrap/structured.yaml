allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The following rules apply to attributional modelling only. Physical stock balances and gross mass are established independently before allocating exchange burdens. A positive price, a waste label and legal end-of-waste are different facts; none alone establishes a zero-burden boundary."
    source_ids: []
  - rule_id: allocation_subdivision
    applies_to: "each exchange and operation"
    rule: "First assign dedicated source lots, operations and service increments directly, or use evidenced actual/virtual subdivision. Preserve the source-paper production and prior-recycling inventory vector by origin, actual grade/quality and handover state; never discard history simply because paper is recovered. Do not assign all historical product use/conversion burdens indiscriminately: identify the technically comparable true co-producing stage and the actual upstream allocation boundary."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_physical
    applies_to: "remaining shared exchange"
    rule: "After subdivision test the determining physical causal relationship for this particular exchange and each co-function; use measured causally relevant material throughput, equipment operation or service exposure only where that exchange is determined by it. Mass is not automatically a determinant of every motor, building, separation or treatment burden; no arbitrary choice between physical and economic shares."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_residual
    applies_to: "genuinely inseparable residual"
    rule: "Only the remaining common-process residual without an established determinant uses actual contemporaneous market values of the co-functions at the same physical condition and gate. Record quantities, currency, period, delivered state and net price/gate-fee basis; shares sum to one for that residual. No fixed yield, allocation percentage, scrap credit or avoided virgin-paper credit."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_value_gate
    applies_to: "source paper and recovery service"
    rule: "For positive-value source paper identify prior true co-production and quality loss with documented upstream inventories; do not assume indefinite equal-quality loops or a default recycling rate. For negative-value handover distinguish prior waste-management stages from the actual process step producing valuable secondary paper; apply subdivision/causality and only then residual value allocation at that step, including the treatment-service function and actual absolute fee value. Model all prior stages in the responsible first system and retain their bridge inventory; do not transfer all preceding treatment to this secondary good or make it disappear. Zero/unknown value needs explicit methodological resolution; record an upstream evidence hold until resolved."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_outputs
    applies_to: "paper lots and separated matter"
    rule: "Mixed-paper output is one whole supply with non-additive source fractions and one provider. A separately sold OCC, graphic grade, metal or polymer outlet has its own physical row, quality/state and actual status; route it under the appropriate method and allocate only shared burdens after the hierarchy above. Mere internal reuse, detached wire, collection service or payment does not create an automatic co-product."
    source_ids:
      - un-cpc-2025
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_lots
      process_id: "recovery"
      flow_role: "mixed_paper_feed; prepared_mixed_paper"
      record_type: "weighbridge and source genealogy"
      raw_fields: "lot; holder; supplier; waste_or_product_state; net_wet_mass; dry_solids; moisture; grade_fractions; contaminants; prior_production_vector; prior_recycling_vector; value_and_fee; provider_stage_coverage"
      collection_method: "Weigh calibrated gross/tare; sample real composition/moisture and preserve original-holder transfer and upstream inventory records; track one real premixed consignment once. Store raw incoming wet/solid masses and inherited exchange vectors; composition partitions sum to the whole without new purchases; no division."
      unit: "kg"
      frequency: "each handover and lot"
      temporal_coverage: "complete campaign including failed loads and opening lots"
      site_scope: "all original holders and preparation sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge calibration; chain of custody; assays; upstream source/value receipts"
    - protocol_id: cp_release
      process_id: "recovery"
      flow_role: "mixed_paper_release"
      record_type: "receiver quality release register"
      raw_fields: "cohort; lot; first_release_time; receiver; specification; gross_mass; wire_tare; film_tare; net_mixed_paper_mass; measured_moisture; dry_solids; conditional_or_final; prior_release_id; withdrawn_acceptance"
      collection_method: "Use calibrated net weighing with independent packaging tare and representative moisture/contaminant sampling; reconcile receiver acceptance, rejection and reinspection records, including whole/partial rejection. Sum unique newly unconditionally released net paper as Q; closing FG includes any such Q still stored; do not add it again. Store Q and dry solids separately; no per-unit exchange calculation here."
      unit: "kg"
      frequency: "every load and decision"
      temporal_coverage: "all first releases and zero-release campaigns"
      site_scope: "named receiver before the pulper"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed receiver results; sampling plan; mass/tare calibration; unique release genealogy"
    - protocol_id: cp_utilities
      process_id: "recovery"
      flow_role: "electricity; diesel; hydraulic_oil; cleanup_water"
      record_type: "meters and stock changes"
      raw_fields: "exchange_id; phase; lot; opening_stock; receipts; closing_stock; external_returns; meter_start; meter_end; original_unit; rate_or_integrated; time; oil_density_temperature; fuel_carbon_sulfur_hydrogen; fossil_fraction; supply_voltage_country_provider"
      collection_method: "Read calibrated meters and tank/stock ledgers for actual process, idle, cleanup, start/stop and failures; measure the individual material density/state if a mass conversion is required. Store unnormalized meter/stock deltas in their original units by phase; convert_units later; no division by Q, bales or run count."
      unit: "MJ; kg; m3"
      frequency: "continuous meters and each receipt/change"
      temporal_coverage: "complete campaign and opening/closing stocks"
      site_scope: "owned recovery operations only; outsourced leg excluded"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter certificates; fuel assays; invoices; operator logs; density test conditions"
    - protocol_id: cp_transport
      process_id: "recovery"
      flow_role: "freight"
      record_type: "route and provider ledger"
      raw_fields: "leg; lot; actual_cargo_kg; loaded_km; empty_km; return_km; vehicle_and_load; outsourced_provider_cut; original_unit; fuel_coverage"
      collection_method: "Record collection and receiver delivery routes with cargo weights and distance evidence; provider represents actual load/empty-return convention; own-vehicle fuel stays in cp_utilities. Retain raw cargo kg, km and service invoice units per leg; form physical transport service before allocation; no product normalization here."
      unit: "kg*km"
      frequency: "every leg including failed/returned load"
      temporal_coverage: "whole declared route and campaign"
      site_scope: "original holder to yard to receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; route logs; freight invoices; provider boundary map"
    - protocol_id: cp_packaging
      process_id: "recovery"
      flow_role: "wire; ldpe_cover"
      record_type: "component stock and movement ledger"
      raw_fields: "component; actual_composition; empty_opening; attached_WIP_opening; attached_FG_opening; reusable_opening; purchases_P; nonpurchase_external_receipt_I; external_receipt_id; physical_origin; ownership; inherited_burden_owner; external_return_received_ER; empty_closing; attached_WIP_closing; attached_FG_closing; reusable_closing; gross_shipments_S; external_return_out_EO; waste_W; internal_reuse"
      collection_method: "Weigh each packaging component separately in empty, attached and reusable states. Record purchases P, actual first non-purchase external receipts I (including incoming supplier-attached wire or cover and first borrowed/leased packaging), external returns ER, gross shipments and breakage. Detached incoming old wire is physically received in I, not purchased again. P, I and ER are mutually exclusive for the same receipt; internal reuse is none of them. Retain raw component masses for opening + P + I + ER = closing + S + EO + W, and link actual receipt/ownership and inherited exchange vectors once. Packaging stays outside net paper Q; collect without division. Add a concrete atomic physical component interface when an existing interface does not represent an actual receipt; a physical subledger is not a second procurement or an additional copy of a whole supplied load."
      unit: "kg"
      frequency: "each receipt/packing/shipment and stocktake"
      temporal_coverage: "whole campaign with opening/closing attached stocks"
      site_scope: "all yards, transit and receiver stock within declared handover"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "component scales; composition/specification; stock and return tickets"
    - protocol_id: cp_residues
      process_id: "recovery"
      flow_role: "each named waste outlet"
      record_type: "weighed disposition and assay ledger"
      raw_fields: "outlet_id; chemistry; source_partition; stage; cohort; wet_mass; dry_mass; water; carbon; actual_handler; treatment; legal_state; outward_returns; opening_closing_stock; offspec_load"
      collection_method: "Weigh each actual separated waste by chemistry and fate; sample mixed residue consignments and effluent whole streams. Identify new contaminants separately rather than calling them other; require actual handler/treatment records. Store raw whole-outlet mass once with disjoint non-additive origin/stage partitions and assay subledgers; all actual post-release increments retained by cohort; no division."
      unit: "kg"
      frequency: "every separation and shipment"
      temporal_coverage: "complete campaign including cleanup, failed loads and service stages"
      site_scope: "all stages to final declared handover and named waste handler"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale tickets; chemistry tests; disposal manifests; fate certificates"
    - protocol_id: cp_species
      process_id: "recovery"
      flow_role: "each named elementary species"
      record_type: "species measurement and fuel/air material balance"
      raw_fields: "species; CAS; medium; particle_size; stage; cohort; source; fossil_biogenic_split; concentration; gas_volume_or_rate; duration; temperature; pressure; moisture_basis; water_formed; oxygen_in; nitrogen_in_out; captured_and_uncaptured_dust"
      collection_method: "Measure species and actual gas flow/state independently, or use a fully evidenced fuel-specific calculation with independent closure checks. Separate real NO/NO2, fossil/biogenic carbon, evaporation/combustion water and disjoint particles; add each actual emitted chemical and each required physical oxygen/nitrogen exchange. Store raw species quantities or concentration and integrated gas volume; integrate rates only once. Preserve gross physical mass before allocation; no division by product Q."
      unit: "kg"
      frequency: "each emitting operation and representative tests"
      temporal_coverage: "whole campaign including failures, start/stop and service stages"
      site_scope: "actual owned emission points and air media"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "laboratory method; CAS/media confirmation; fuel assay; uncertainty; independent C/H/O closure"
    - protocol_id: cp_stock
      process_id: "recovery"
      flow_role: "WIP and FG genealogy"
      record_type: "physical stock and inherited-exchange ledger"
      raw_fields: "stage; lot; original_cohort; opening_WIP_mass; closing_WIP_mass; opening_WIP_exchange_vector; closing_WIP_exchange_vector; opening_FG_mass; closing_FG_mass; original_FG_burden; new_first_Q; gross_release_V; returns; rework_increment; losses; internal_transfers"
      collection_method: "Reconcile each physical stage, transit, receiving hold and FG stock with calibrated weighing and cohort genealogy; carry every exchange's inherited burden, not a single average burden or mass-only adjustment. Keep separate raw physical mass and unnormalized exchange vectors by stage/cohort; cancel internal transfers only after both sides match; no division."
      unit: "kg; original exchange units"
      frequency: "each movement and period close"
      temporal_coverage: "opening to closing, including unsuccessful and Q=0 campaigns"
      site_scope: "all controlled sites and transit before pre-pulper handover"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stocktakes; movement genealogy; original burden receipts; reconciliation residuals"
    - protocol_id: cp_service
      process_id: "cohort_service"
      flow_role: "service_electricity; service_diesel; service_cleanup_water; service_wire; service_hydraulic_oil; service_ldpe_cover; service_freight"
      record_type: "post-release cohort service ledger"
      raw_fields: "original_cohort; stored_first_release_Qc; service_H; stage; raw_exchange; original_unit; opening_closing_FG; packaging; loss; return; original_delivery_reversal; rework_increment; first_release_id"
      collection_method: "Measure post-release storage/handling/packing increments by actual cohort and operation. Preserve original FG burden; reverse original delivery only for the actual return and add real rework once, without a second first release. Store raw service exchange totals and H by original cohort, with the stored Qc; H is not production and no normalization occurs here. Route service wastes/emissions to cp_residues/cp_species once."
      unit: "MJ; kg; m3; kg*km; original exchange units"
      frequency: "each service operation and period close"
      temporal_coverage: "from first release through declared pre-pulper handover"
      site_scope: "named original release cohorts and receiver storage"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "service meters; original release register; FG genealogy; return/rework records"
    - protocol_id: cp_allocation
      process_id: "recovery"
      flow_role: "each shared exchange"
      record_type: "attribution and value-gate evidence"
      raw_fields: "exchange; source_origin; dedicated_assignment; subdivision; determinant; physical_test; common_residual; outputs_and_service; quantities; same_gate_state; currency; price_period; actual_prices_fees; upstream_recycling_model; shares_and_uncertainty"
      collection_method: "Obtain metered causality/subdivision and contemporaneous same-condition market/gate-fee evidence; independently locate the prior true co-producing stage and actual recycling-value crossing. Retain dedicated/causal/residual allocations of raw exchange totals with shares summing to one at each relevant gate; no normalization here."
      unit: "original exchange units; documented currency"
      frequency: "each route/value transition and reporting period"
      temporal_coverage: "same inventory period and actual source history"
      site_scope: "source paper, actual recovery step and all co-functions"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "physical causal test; price/fee receipts; upstream model and scope; sensitivity record"
  calculation_rules:
    - id: convert_units
      applies_to: "all inventory rows"
      rule: "Convert each raw numerator to its card unit before allocation: electricity_MJ = electricity_kWh * 3.6; oil_m3 = oil_L * 0.001; freight_kgkm = freight_tkm * 1000 or sum(actual_cargo_kg * actual_leg_km). A genuine rate is integrated once; a measured integrated volume is already total. Density is independently measured for the actual substance/state where needed, not derived from a secondary flow factor."
      inputs:
        - raw_amount
        - raw_unit
        - actual_cargo_kg
        - actual_leg_km
        - measured_density
        - measured_state
        - cp_utilities
        - cp_transport
      output: "converted_raw_exchange"
      source_ids:
        - jrc-paper-bref-2015
        - ilcd-attributional-2010
    - id: physical_gates
      applies_to: "all physical stages"
      rule: "For each physical stage and constituent: opening + real external receipts = closing + actual outward transfers + real wastes + actual emissions; internal transfers cancel between stages. Manufacturing V is gross real outgoing candidate paper, including accepted and rejected portions; Q is only unique first accepted net paper, not V. At the final receiver FG gate: opening_FG + Q + actual_external_returns = closing_FG + gross_outward_paper + external_return_out + losses + rework_to_WIP. Closing_FG already contains the still-stored portion of Q; it is not another manufacturing output. Combine the stage gates by cancelling the same internal Q/transfer exactly once. Do not add a new correction X unless it removes a proven exact duplicate already on the same side and in the same OTHER entry."
      inputs:
        - cp_lots
        - cp_release
        - cp_stock
        - cp_residues
        - cp_species
      output: "independent_stage_and_combined_physical_balances"
      source_ids:
        - jrc-paper-bref-2015
        - cepi-quality-control
    - id: packaging_balance
      applies_to: "wire; ldpe_cover; service_wire"
      rule: "For each packaging component separately, opening_empty + opening_attached_WIP + opening_attached_FG + opening_reusable + purchases_P + nonpurchase_external_receipt_I + external_return_received_ER = closing_empty + closing_attached_WIP + closing_attached_FG + closing_reusable + gross_physical_shipments_S + external_return_out_EO + waste_W. Include transit in its actual stock gate. Internal reuse cancels, does not create a new purchase, net-paper Q or co-product. One whole waste outlet may have non-additive packaging/feed partitions; never sum them again.  I is independently measured non-purchase external ingress, including supplier-attached components and first borrowed/leased packaging; exclude receipts already in P or ER. Physical receipt and stock remain even when the upstream provider already owns the burden. Preserve the actual incoming history and ownership once; procurement burden follows verified actual supply scope and eligible use/withdrawal, not P+I as a new purchase quantity. Do not invent a second provider or charge upstream-included components again."
      inputs:
        - cp_packaging
        - cp_service
        - cp_residues
      output: "component_physical_reconciliation"
      source_ids:
        - jrc-paper-bref-2015
        - cepi-quality-control
    - id: attribute_exchange
      applies_to: "all inventory rows"
      rule: "For every raw exchange vector, A_i,c = inherited_opening_WIP_i,c + actual_current_dedicated_i,c + causally_assigned_i,c + residual_assigned_i,c - inherited_closing_WIP_i,c. Reconcile each inherited vector with source history and the stage/lot ledger; no mass-only carryover. Keep FG original production burden with its original cohort c; post-release service increments accumulate once to that same cohort separately. Actual failed/start/stop/idle/cleanup/rework burdens are retained; they are not erased by absence of accepted output. Physical gross flows remain separate from allocated A."
      inputs:
        - converted_raw_exchange
        - cp_lots
        - cp_stock
        - cp_allocation
        - cp_service
      output: "attributable_raw_exchange_vector_A"
      source_ids:
        - ilcd-attributional-2010
    - id: calculate_inventory
      applies_to: "all inventory rows"
      rule: "For the selected release cohort c with Q_c > 0, a_i,c = A_i,c / Q_c, performed once only after convert_units and attribute_exchange. Q_c is the stored unique first-release net paper mass; this is the only product normalization. For service increments use the same original stored Q_c and accumulate raw A_i,c before this single calculation; H is never a denominator. Cards and collection aggregation refer to this result without another division. The reference Product output is 1 kg. At Q_c = 0 retain every actual raw burden and physical balance, report no per-unit result, and require explicit documented carry/assignment to a later actual cohort without inventing output."
      inputs:
        - attributable_raw_exchange_vector_A
        - Q_c
        - cp_release
        - cp_service
      output: "a_i,c per 1 kg reference flow"
      source_ids:
        - ilcd-attributional-2010
    - id: independent_constituents
      applies_to: "paper solids; water; carbon and actual species"
      rule: "Establish paper/filler/contaminant solids and total physical mass separately from water and relevant element balances. Independently measure at least one quantity for each independent unknown; a residual cannot fit both water and solids losses. Dry paper preparation has no assumed chemical water generation, structural-water release or combustion. For actual engines independently track fuel C/H/S, atmospheric O2/N2 throughput and real exhaust species/water; free moisture, evaporated moisture and combustion-formed water are separate origins, not extra copies of one H2O outlet. COD, BOD, TOC, VOC and NOx equivalents are indicators, not masses of invented specific species."
      inputs:
        - cp_lots
        - cp_utilities
        - cp_residues
        - cp_species
        - cp_stock
      output: "independent_mass_water_element_and_species_checks"
      source_ids:
        - jrc-paper-bref-2015
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: quality_identity
      applies_to: "mixed paper and receiver"
      requirement: "Document true mixed-paper supply and receiver compatibility; no classification label, generic UUID, producer page or initial conditional acceptance establishes the actual lot's release. Test exclusions and trace one whole purchased lot/provider."
      evidence: "source history; representative samples; buyer specification; final release register"
    - id: quality_temporal
      applies_to: "all operations"
      requirement: "Collect a representative complete reporting campaign with opening/closing stocks and service cohorts; retain failures and all nonproduction periods. Quantify uncertainty by meter, sample, allocation and provider scope; do not substitute generic producer ratios."
      evidence: "raw logs; calibration; sampling variance; stock genealogy; sensitivity"
    - id: quality_sources
      applies_to: "upstream and shared burdens"
      requirement: "Missing source-paper inherited burden, unresolved treatment/value gate or unknown core receiver compatibility is a real dataset completeness hold. Unknown future plant quantities, an ordinary provider choice or unresolved auxiliary UUID is not a fabricated zero, methodology approval or automatic reason to discard these collection rules."
      evidence: "explicit gap register; lineage and source scope; unnormalized records"
    - id: quality_native
      applies_to: "every UUID and unit"
      requirement: "Match principal name, all language names, synonyms/comments, CAS, route, form, geography, medium, type and every property against actual exchange; use the exact reference property/unit group chain and official Chinese basename. Unresolved auxiliary identities remain specific atomic names; they are not family bindings."
      evidence: "complete native identity and property/unit evidence; supplier compatibility; localized display audit"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Assess both declared-method consistency and actual evidence completeness. A syntactically valid projection or a finite measurement check is not scientific, translation, supplier or classification approval."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Verify the actual mixed-paper lot remains mixed, unrepulped and compatible with its named receiver before pulping; reject residual-refuse-only/service-only cases and separately traded 39241/42/43 grades. Confirm final unconditional receiver acceptance rather than mere delivery or collection."
    source_ids:
      - un-cpc-2025
      - jrc-recycling-2020
      - cepi-quality-control
  - rule_id: validate_complete_route
    applies_to: "all rows and stages"
    rule: "All actual inputs, losses, returns, failures, cleanup and service emissions/wastes are included as atomic identities with real fates. Check provider cuts for overlaps and omissions; upstream source history and original-cohort burdens remain explicit. Missing evidence is unknown, not zero or pass."
    source_ids:
      - jrc-paper-bref-2015
      - ilcd-attributional-2010
  - rule_id: validate_mass
    applies_to: "physical and packaging gates"
    rule: "Independently close stage, FG and combined gross physical mass, water, solids and relevant elements; trace every WIP inherited exchange and original FG burden. Closing FG already contains Q; cancel internal Q exactly once when combining gates. Check each packaging equation independently, actual external returns and gross movements, and no arbitrary X residual adjustment."
    source_ids:
      - cepi-quality-control
      - jrc-paper-bref-2015
      - ilcd-attributional-2010
  - rule_id: validate_normalization
    applies_to: "all inventory rows"
    rule: "Verify raw unit conversion, direct/subdivision/causal/residual attribution and vector carryover precede the one A/Q calculation; Q is first release only, services retain original Qc and H never becomes production. Q=0 preserves actual raw loads without a unit result; reinspection/returns/rework create no duplicate release."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: validate_native
    applies_to: "adopted and unresolved identities"
    rule: "Recheck all native identity restrictions and unit dimensions, real provider compatibility, official Chinese names and required qualifiers. A chemically inconsistent synonym or wrong air/water medium requires review, not an automatic classifier exemption. UUID-free auxiliary rows remain unresolved and cannot masquerade as verified platform identities."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: validate_allocation
    applies_to: "all multifunctional gates"
    rule: "Verify the attributional hierarchy and actual prior-life/value transition against the selected source evidence; do not use an industrial sorting paper as authority for LCA allocation, infer a fixed recovery rate, or add displacement credits. Report actual checks, skipped scope, uncertainties and holds separately."
    source_ids:
      - ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual mixed-paper input before receiver repulping, with original cohort and upstream burden model"
  allowed_use: "Matching mixed-paper supply, actual composition/state, accepted receiver specification and declared attributional boundary"
  excluded_use: "Pulp or new paper; single separated paper grades; residual-refuse treatment; hazardous waste; universal recycling credits or assumed zero-burden feed"
  required_metadata: "All §3 qualifiers; exact physical and provider gates; source origins; Q/WIP/FG/cohort genealogy; measured utility/property units; allocation/value evidence; all actual atomic flows and fates"
  required_quality_disclosure: "Temporal/site representativeness; uncertainty and unknowns; measured versus calculated data; unresolved auxiliary identities; source-history/value-gate holds; scientific and translation review state"
  update_trigger: "Change of source mix, receiver specification, preparation route, value/status gate, upstream provider boundary, utility supply, emission fate or measurement configuration"
data_sources:
  - id: "un-cpc-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 Explanatory Notes (30 June 2025), pp.201–202; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "39249 includes unsorted recovered paper; adjacent 39241/42/43 boundaries; no process quantities."
  - id: "jrc-recycling-2020"
    type: "literature"
    reference: "Grant, Cordle and Bridgwater; Quality of recycling: Towards an operational definition, JRC122293 (2020), §4.2 pp.57–61 and Table 4-3; doi:10.2760/225236; https://publications.jrc.ec.europa.eu/repository/bitstream/JRC122293/final_quality_of_recycling_report.pdf"
    used_for: "Observed source-separated mixed-paper input and mixed-paper output; receiver-specific quality and contrary ungraded output. Site observations do not establish a universal composition or numerical acceptance limit."
  - id: "jrc-paper-bref-2015"
    type: "official_guidance"
    reference: "JRC Best Available Techniques Reference Document for the Production of Pulp, Paper and Board (2015), §6.1.1–6.1.2 printed pp.550–551 (PDF pp.588–589); https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "Source handover; collection yards; removal of non-paper matter; traceability; bale wire; downstream repulping exclusion. No LCA allocation or recovery-rate evidence."
  - id: "cepi-quality-control"
    type: "extension_guidance"
    reference: "CEPI Paper for Recycling Quality Control Guidelines, retained publisher document, pp.2–9 and 12; https://www.cepi.org/wp-content/uploads/2022/02/PaperforRecyclingQuality-Control-GuidelinesWITHANNEX.pdf"
    used_for: "Delivery documentation; bale integrity; moisture sampling; acceptance/conditional acceptance/refusal; contamination testing. Recommendations and commercial corrections are not universal physical yields or this PCR's mass denominator."
  - id: "smurfit-mixed-packaging"
    type: "extension_guidance"
    reference: "Smurfit Kappa, 5.02 Mixed packaging, publisher page snapshot 2026-10-26; https://www.smurfitkappa.com/products-and-services/recycling/502-mixed-packaging"
    used_for: "Independent producer example of a mixed used paper/board supply and collection equipment; this particular grade excludes newspapers/magazines. It does not prove another mixed lot is 5.02 or certified, and supplies no site recipe."
  - id: "ilcd-attributional-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA—Detailed guidance, first edition March 2010, §7.9.2–7.9.3 and Annex14.4 (PDF pp.275–292 and 369–374); https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision and exchange-specific determining physical causality; remaining market-value allocation; actual prior-life recycling/value boundary. Illustrative recycling rates and infinite-loop formulas are not defaults for heterogeneous paper."
