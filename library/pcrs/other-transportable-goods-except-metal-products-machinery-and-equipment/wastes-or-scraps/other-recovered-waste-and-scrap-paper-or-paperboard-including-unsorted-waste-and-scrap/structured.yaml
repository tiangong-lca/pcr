measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use one net mixed-paper mass basis. Q is the sum of unique first unconditional receiver releases, excluding wire/packaging and duplicate reinspection; weigh actual moisture and report oven-dry paper solids separately. Commercial moisture deductions are not silently substituted for physical mass."
  - id: numerator_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "row-specific"
      uuid: ""
    required_unit: "row-specific"
    rule: "Collect raw totals before division. Convert kWh to MJ with 3.6; tonne-km to kg*km with 1000. Oil uses Volume/m3; convert L to m3 with 0.001 and weigh or measure that oil's density at stated temperature only for its physical mass ledger. Integrated volumes are not multiplied by time again; integrate only genuine rates."
  - id: no_invented_conversion
    applies_to: "all inventory rows"
    required_property_ref:
      name: "measured physical basis"
      uuid: ""
    required_unit: "declared"
    rule: "No assumed kg per bale or default water/oil density. Item counts require measured net mass for the same configuration. Supplied mixtures cross once as whole consignments with non-additive composition subledgers; actual on-site formulation requires each purchased ingredient and its losses."
