system_boundary:
  rules:
    - rule_id: boundary_chain
      applies_to: "mill"
      rule: "Include receipt/screening and storage of chips; acid preparation; batch digestion; blow; pulp washing/screening; weak-liquor collection; decanting; indirect evaporation; SO2 collection/absorption and actual reuse; sampling, cleaning, idle/start-stop and first quality release. The unbleached wet pulp leaves this joint boundary at its measured separation state; its later exclusive bleaching/drying belongs to the pulp system."
      source_ids:
        - jrc-pulp-bref-2015
        - lignostar-calcium-liquor
    - rule_id: boundary_route
      applies_to: "mill"
      rule: "Use the calcium-carbonate/SO2 acid route with purchased SO2 and indirect supplied steam. This is a transparent technical synthesis, not one factory/SKU. Do not copy the magnesium/sodium recovery boiler, MgO ash loop, fermentation, vanillin, yeast, ultrafiltration, pH modification or spray drying into this branch. Actual use of such a process requires a scope review and explicit atomic additions."
      source_ids:
        - jrc-pulp-bref-2015
        - lignostar-calcium-liquor
        - jecfa-calcium-2008
    - rule_id: boundary_recovery
      applies_to: "weak liquor and outlets"
      rule: "Partition each measured weak-liquor transfer by source and actual destination: concentrate supply, internal reuse, external treatment or evidenced other branch. Fractions are mutually exclusive and exhaust the parent quantity; the same organic solids cannot be both sold and burnt. SO2 stripped and recovered to acid is internal reuse, not purchased SO2 or an energy coproduct. No default combustion, energy recovery or displacement credit."
      source_ids:
        - jrc-pulp-bref-2015
        - lignostar-calcium-liquor
    - rule_id: boundary_utilities
      applies_to: "utilities and treatment"
      rule: "The declared base branch uses electrically driven handling/pumping and externally supplied indirect steam; it invents no on-site fuel boiler. Capture actual condensate returned to the supplier as a separate Product return with temperature/enthalpy and water ownership agreement, not an elementary emission or sale. Heating-loop blowdown, evaporator dirty condensate and cooling-water purge are distinct. Off-site wastewater treatment is linked once; raw pollutant loads in transferred wastewater are not additional direct discharges. Any on-site treatment or combustion actually present needs a reviewed process with every chemical, fuel and species separately added."
      source_ids:
        - jrc-pulp-bref-2015
    - rule_id: boundary_first_release
      applies_to: "liquor_release and post_release"
      rule: "Q counts only newly first quality-released net wet concentrate. Released closing FG already belongs to Q and is never added again as production. Later storage, loading, dispatch, reinspection and return handling remain in a separate cohort service ledger with actual energy, cleaning, packaging and losses. Returned released goods retain original manufacturing burden; only real incremental rework enters the service ledger. Combining manufacturing and service modules cancels the matched internal Q transfer and counts no second output."
      source_ids:
        - jrc-pulp-bref-2015
        - ilcd-allocation-2010
    - rule_id: boundary_completeness
      applies_to: "all exchanges"
      rule: "Each card is one chemical, supplied formulation, physical material, waste stream or emission species. Route conditions belong to that card. Add a separate card and protocol extension for each actual unlisted defoamer, descaler, lubricant, refrigerant, cleaning chemical, cooling purge or identified air/water species before claiming completeness. Absence needs process/meter evidence; an unresolved UUID never makes a genuine flow zero."
      source_ids:
        - jrc-pulp-bref-2015
        - lignostar-calcium-liquor
boundary_abstraction:
  declared_starting_condition: "Received debarked virgin softwood chips with inherited forestry/chipping burdens; purchased SO2, calcium carbonate, fresh water and utilities"
  starting_condition_role: "Foreground material-to-concentrate manufacture including the joint pulping stage that creates the residual liquid"
  product_classification_scope: "Narrower than CPC3.0:39230; one calcium-base industrial liquid branch; no automatic coverage of other residual lyes"
  recursive_input_rule: "Internal weak liquor, recovered SO2, evaporator recycle and same-lot rework cancel at matched transfer links. They are not new purchases. Externally purchased concentrate cannot replace the chip-to-liquor manufacturing start; a purchased-liquor finishing dataset needs a different declared boundary."
  upstream_dataset_requirement: "Match upstream chip species/preparation/volume convention; supplied chemical formulations and their entire delivered mass; water source/treatment; actual electricity supply; actual steam return contract; external treatment and actual inbound transport. Missing providers remain disclosed rather than zero."
  disclosure: "Declare site/period and all stages, joint unbleached wet pulp gate, actual external supply/treatment interfaces, WIP/FG cutoffs, outlet topology, failure periods, allocation and first-release versus incremental post-release services."
