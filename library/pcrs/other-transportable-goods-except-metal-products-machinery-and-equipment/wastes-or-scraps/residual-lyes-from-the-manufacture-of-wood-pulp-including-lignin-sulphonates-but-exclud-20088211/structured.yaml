allocation_rules:
  - rule_id: allocation_status
    applies_to: "joint outputs"
    rule: "This method is attributional and applies the ILCD hierarchy only where allocation is required. Determine legal status, positive/negative/zero market value and actual function of wet pulp, weak liquor and rejected material at their real gates. A CPC waste label or sale alone proves neither burden-free input nor a treatment function. Negative-value or ambiguous streams need a separate service/system-boundary assessment; do not force a positive product price."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_subdivide
    applies_to: "each exchange"
    rule: "First separately measure or virtually subdivide exclusive processes: liquor clarification/concentration and its sampling, steam, cleaning and losses belong to liquor; exclusive pulp finishing belongs to pulp. Use physical process understanding and traceable quantitative relationships for virtual subdivision. Justify any remaining black box and document distortion if practicable subdivision was not performed."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_causality
    applies_to: "remaining shared exchange j"
    rule: "For every still-shared exchange identify its determining physical causal relationship with each function. A conserved element, material destination, heat duty or equipment time is usable only when it determines that exchange, with losses and non-valued outputs accounted for. Wet mass, dry mass or energy content alone is not a universal key. Keep exchange-specific alpha_j and its test evidence; do not reuse one allocation fraction automatically for all chemicals, energy and releases."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual_value
    applies_to: "genuinely inseparable remainder"
    rule: "Only the remaining flows without a defensible determining physical relation use contemporaneous representative market value at the common pulp/weak-liquor separation gate and actual states. If only concentrate or bleached pulp is traded, derive gate values transparently from matched sales and attributable downstream processing, storage, packaging and transport costs; use actual quantities and documented time/currency conventions. Do not use purified powder prices for sugar/salt-bearing weak liquor. Report sensitivity and unresolved/negative-price treatment; invent no fixed ratio and no arbitrary physical/economic choice."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_no_credit
    applies_to: "returns and coproducts"
    rule: "Keep complete unallocated physical mass/species ledgers independently of the partitioned burden vectors. Pulp and each external branch are measured physical outputs, never automatic credits. Internally reused SO2, water and off-spec liquor cancel at exact transfers; they are not sales or fresh purchases. Condensate return follows the explicit upstream supplier agreement without an automatic coproduct/recovery credit."
    source_ids:
      - jrc-pulp-bref-2015
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "mill"
      flow_role: "First quality release"
      record_type: "calibrated tank/scale and release record"
      raw_fields: "lot_id; event_id; first_release_flag; gross_mass; tare_mass; wet_net_mass; dry_fraction; sampling_method; pH; free_SO2; calcium; residual_sugars; insolubles; acceptance_limits; rejected_mass; opening_FG; closing_FG; opening_WIP; closing_WIP"
      collection_method: "Weigh each lot net of container; sample a homogenised lot at stated locations/time using a validated solids/species method; retain buyer limits and first-release decision. Record failed/rechecked/returned lots separately. Raw aggregation requirements: Retain raw lot masses and unique first-release event list; sum eligible new wet net masses to Q; keep closing FG in the release cohort and never add it again; no exchange normalization here. The aggregation field below declares the reporting basis only; this protocol performs no division and the sole final normalization in section 8 calculates it."
      unit: "kg; fraction; assay units"
      frequency: "each batch and release event"
      temporal_coverage: "complete declared manufacturing cohort and all failed periods"
      site_scope: "concentrate release tank and actual laboratory"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale/tank calibration; sample chain; analytical QC; receiver specification; signed release; stock reconciliation"
    - protocol_id: cp_materials
      process_id: "mill"
      flow_role: "Each atomic purchased supply and joint material"
      record_type: "receipt/issue/stock and preparation record"
      raw_fields: "row_id; event_id; supplier; supplied_form; raw_unit; quantity; opening_stock; closing_stock; assay; moisture; carrier_water; species; chip_volume_convention; measured_density; density_temperature; WIP_mass; WIP_burden_vector; internal_transfer_id; destination"
      collection_method: "Weigh purchases/issues and gross physical outputs separately; meter each transfer; pair chip volume and wet mass at matched packing/moisture; retain actual acid recipe, chemical speciation and stage stocks. Raw aggregation requirements: Retain unnormalised event quantities by row and stage; separately reconcile opening plus receipts versus closing plus issues; preserve all inherited per-exchange vectors and internal links; feed calc_raw and calc_burden. The aggregation field below declares the reporting basis only; this protocol performs no division and the sole final normalization in section 8 calculates it."
      unit: "kg; m3; kg/m3; assay units"
      frequency: "each receipt/issue/transfer and stock cutoff"
      temporal_coverage: "same cohort plus opening WIP provenance"
      site_scope: "wood yard; acid plant; digester; washers; clarifier; evaporator"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; batch sheets; assay certificates; paired mass/volume measurements; calibrated meters; transfer and WIP ledgers"
    - protocol_id: cp_utilities
      process_id: "mill"
      flow_role: "Electricity and each water/steam interface"
      record_type: "submeter and supplier contract"
      raw_fields: "row_id; meter_id; raw_quantity; raw_unit; start_end_reading; timestamp; pressure; temperature; steam_quality; mass; enthalpy; condensate_return_mass; return_enthalpy; supplier_water_ownership; cooling_makeup; purge; duration; failure_idle_cleaning_state"
      collection_method: "Use stage submeters and reconciled main meters; meter steam/return independently and document thermodynamic calculation state and ownership. Retain true rate versus integrated reading; record zero-output periods. Raw aggregation requirements: Retain raw numerator totals by carrier and stage without dividing; separate dedicated and shared service and supply/return legs; feed calc_raw then calc_burden. The aggregation field below declares the reporting basis only; this protocol performs no division and the sole final normalization in section 8 calculates it."
      unit: "MJ; kWh; kg; m3; pressure; temperature; kJ/kg"
      frequency: "continuous or each event with period totals"
      temporal_coverage: "whole cohort including start-stop/idle/cleanup"
      site_scope: "all included manufacturing utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; meter reconciliation; provider boundary; enthalpy/state method; failure logs"
    - protocol_id: cp_outlets
      process_id: "mill"
      flow_role: "Each waste and actual emission species"
      record_type: "transfer manifest and outlet/species monitoring"
      raw_fields: "row_id; source_zone; destination; outlet_id; parent_total; partition_id; event_id; wet_mass; dry_solids; species; concentration_basis; gas_volume; volume_is_integrated; gas_flow_rate; interval; gas_temperature; pressure; humidity; measured_capture; bypass; raw_unit"
      collection_method: "Weigh each waste and sample actual composition; measure each identified gas species with matching dry/wet gas volume and conditions after capture; record bypasses and fugitive releases. Describe treatment receivers and exclude double counting of contained pollutants. Raw aggregation requirements: Retain raw species and wet-stream numerators and parent/outlet topology; total and source partitions are alternative views not additive; convert only through calc_raw before allocation. The aggregation field below declares the reporting basis only; this protocol performs no division and the sole final normalization in section 8 calculates it."
      unit: "kg; m3; kg/m3; mg/Nm3; kg/h"
      frequency: "each transfer and monitored interval"
      temporal_coverage: "full cohort including failed/cleanup/abnormal events"
      site_scope: "each source-resolved liquid and gas outlet"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "manifest; receiver; laboratory QC and detection limits; gas standard state; capture tests; independent balance"
    - protocol_id: cp_packaging
      process_id: "mill"
      flow_role: "Each individual HDPE seal type"
      record_type: "stock and physical-movement ledger"
      raw_fields: "seal_type; opening_empty; opening_attached_WIP; opening_attached_FG; opening_reusable; purchases; external_returns_received; closing_empty; closing_attached_WIP; closing_attached_FG; closing_reusable; gross_outward_attached; external_return_outward; waste; internal_reuse; unit_article_mass; event_id; cohort"
      collection_method: "Count and weigh the actual whole seal article by type and track every custody movement; split manufacturing from post-release service. Absence requires a verified bulk-transfer configuration. Raw aggregation requirements: Retain complete raw six-leg balance per article; cancel internal reuse; never infer kg/article from item count; do not divide here or mix packaging into Q. The aggregation field below declares the reporting basis only; this protocol performs no division and the sole final normalization in section 8 calculates it."
      unit: "kg; items"
      frequency: "each movement and cutoff"
      temporal_coverage: "same physical opening/closing cutoffs plus service period"
      site_scope: "all controlled storage/loading points"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stock count; article weighing; purchase/return/shipment/waste tickets; custody links"
    - protocol_id: cp_allocation
      process_id: "mill"
      flow_role: "Every shared burden exchange"
      record_type: "subdivision/causality and common-gate value worksheet"
      raw_fields: "exchange_id; exclusive_scope; raw_burden; causal_test; alpha_j; common_gate_state; actual_joint_quantities; contemporaneous_prices; currency; price_period; exclusive_downstream_cost; inherited_allocated_vector; uncertainty; sensitivity"
      collection_method: "Submeter or virtually subdivide; test each remaining exchange-specific determining physical relation; derive gate values only for the genuine remainder from traceable contracts/costs. Do not reallocate inherited already-assigned burdens. Raw aggregation requirements: Keep allocation worksheets in native numerator units; form alpha_j evidence and exclusive/shared split without normalizing; calc_burden uses them once. The aggregation field below declares the reporting basis only; this protocol performs no division and the sole final normalization in section 8 calculates it."
      unit: "native row unit; currency; fraction"
      frequency: "each campaign and price update"
      temporal_coverage: "same common-gate cohort and representative price period"
      site_scope: "joint pulping and exclusive liquor branch"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "causal tests; calibration; gate-state price corrections; provenance; sensitivity"
    - protocol_id: cp_services
      process_id: "post_release"
      flow_role: "Released-cohort storage and dispatch"
      record_type: "cohort service and FG ledger"
      raw_fields: "cohort_id; original_release_id; opening_FG; closing_FG; gross_dispatch; customer_return; incremental_rework; storage_time; utility_row; packaging_row; raw_service_quantity; original_burden_link"
      collection_method: "Meter real incremental storage/loading/cleaning by released cohort including original historical FG and returns; retain original manufacturing burden link; separate every utility/material/waste/species. Raw aggregation requirements: Retain raw service numerators and cohort linkage; never treat dispatch or reinspection as new Q; do not add already-included closing FG to manufacturing output. The aggregation field below declares the reporting basis only; this protocol performs no division and the sole final normalization in section 8 calculates it."
      unit: "native row units; kg; time"
      frequency: "each service event"
      temporal_coverage: "actual service period; historical cohort provenance retained"
      site_scope: "post-release tank/loading interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter/custody logs; FG balance; actual incremental rework; original release"
  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "For each event convert its actual raw quantity to the card unit before allocation. For concentration times an already integrated volume use that volume once; for a true rate integrate over time once. Gas concentration and volume must share normal/actual state and dry/wet basis. Derive mass from volume only with independently measured substance-specific density; preserve reaction/species evidence."
      inputs:
        - raw_quantity
        - raw_unit
        - measured_density
        - gas_state
        - cp_materials
        - cp_utilities
        - cp_outlets
      output: "R_j"
      source_ids:
        - jrc-pulp-bref-2015
    - id: calc_burden
      applies_to: "all inventory rows"
      rule: "For each burden exchange form A_j = dedicated_current_j + alpha_j * shared_current_j + inherited_open_WIP_j - carried_close_WIP_j. Current terms include all failed, idle, start-stop, cleaning and real pre-release rework loads. Inherited vectors are already attributed and cannot receive alpha_j again. Keep each WIP lot and exchange linked to eventual release; no mass-only carryover. Physical joint-output and outlet ledgers remain unallocated; their reported A_j is the appropriate measured physical quantity without a coproduct credit."
      inputs:
        - R_j
        - alpha_j
        - inherited_open_WIP_j
        - carried_close_WIP_j
        - cp_materials
        - cp_allocation
      output: "A_j"
      source_ids:
        - ilcd-allocation-2010
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "a_j = A_j / Q; A_j = attributable unnormalised exchange numerator in the declared card unit; a_j = exchange amount per 1 kg reference flow. Execute this division once only when Q > 0; cards and collection aggregation reference this same result without another division. For Q = 0 retain every raw and inherited load with its destination/cohort; report no unit result and no zero or fabricated denominator."
      inputs:
        - A_j
        - Q
        - cp_release
      output: "a_j"
      source_ids:
        - ilcd-allocation-2010
    - id: calc_physical_gates
      applies_to: "mill; post_release"
      rule: "For each stage and the combined boundary reconcile opening physical stock + all real external inputs + external returns received = closing physical stock + gross physical outward movements + actual emissions. Internal transfer pairs cancel only at the combined gate. Gross V is the complete event-resolved net wet physical outward quantity, not net customer sales or Q. F includes only newly first-released events. X may remove only an exact duplicate event on the same side from OTHER; it never removes a distinct outflow, loss, return or coproduct. Released Q is either a physical transfer at a module boundary or contained in released closing FG and later movements; never add Q and the same closing FG again."
      inputs:
        - opening_stock
        - external_inputs
        - external_returns
        - closing_stock
        - gross_V
        - actual_emissions
        - F
        - X
        - OTHER
        - cp_materials
        - cp_release
      output: "reconciled physical gates"
      source_ids:
        - jrc-pulp-bref-2015
    - id: calc_packaging
      applies_to: "hdpe_seal; hdpe_seal_out; hdpe_seal_waste"
      rule: "For each actual seal type: opening empty/attached-WIP/attached-FG/reusable + external purchases + external returns received = closing empty/attached-WIP/attached-FG/reusable + attached seals on gross outward shipments + external returns sent + waste. These are six distinct legs with all opening/closing locations; cancel internal reuse. Match the same physical cutoff and gross shipment events; no net-product Q substitution or repeated purchase."
      inputs:
        - cp_packaging
        - opening_packaging
        - purchases
        - returns_received
        - closing_packaging
        - gross_attached_out
        - returns_sent
        - waste
      output: "balanced per-type packaging account"
      source_ids:
        - ilcd-allocation-2010
    - id: calc_outlet_topology
      applies_to: "all physical outlets"
      rule: "Each mixed outlet total equals its non-overlapping measured source partitions at the same sampling/control point. Choose the total or the complete source partitions for inventory and one receiving provider for that actual transfer; never add both views or bind several complete treatment providers. Independently reconcile chemical species and water; indicators cannot fill missing species."
      inputs:
        - cp_outlets
        - parent_total
        - source_partitions
        - provider_id
      output: "single-counted physical outlet"
      source_ids:
        - jrc-pulp-bref-2015
    - id: calc_services
      applies_to: "post_release"
      rule: "Preserve original release-cohort manufacturing burden on historical FG and customer returns. Reinspection/dispatch creates no new production; assign only measured incremental storage, loading, cleaning and real rework to its cohort. On combination cancel matched internal release transfers and retain complete FG, gross shipment, return, waste and service records. Report separate service intensity with its explicit service basis without applying manufacturing normalize_once a second time."
      inputs:
        - cp_services
        - original_burden_link
        - raw_service_quantity
        - cohort_id
      output: "incremental service ledger"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify full native identity and all hard facets before each dataset binding; core residual-liquor UUID is broad and conditional utility identities retain their exact restrictions. Supplier/grade/auxiliary UUID gaps are disclosed, not zero."
      evidence: "native records; exact support chain; supplier certificates; scope and media evidence"
    - id: dq_sampling
      applies_to: "cp_release; cp_outlets"
      requirement: "Use representative homogenised lot sampling and validated solids/species analyses with detection limits, calibration, repeats, uncertainty and sampling bias. No cited food-grade purity or supplier typical solids becomes a release limit."
      evidence: "sampling plan; method validation; analytical QC; actual receiver limits"
    - id: dq_completeness
      applies_to: "all stages"
      requirement: "Collect the full declared representative campaign/period and abnormal/failed/Q0/idle/cleanup events; track opening/closing WIP and per-exchange inherited vectors. No negative unexplained balance or unsupported not-applicable row may be treated as complete."
      evidence: "production logs; calibration; WIP provenance; independent physical and C/S/Ca/water checks"
    - id: dq_method
      applies_to: "allocation and post-release"
      requirement: "Keep source applicability and vintage separate from current plant records. Report allocation causality/value corrections and sensitivity; supplier heat/water convention; complete service/cohort and packaging ledgers. Do not claim scientific/translation approval from engineering checks."
      evidence: "ILCD worksheet; foreground records; original sources; service/packaging reconciliation"
validation_rules:
  - rule_id: validate_scope
    applies_to: "whole dataset"
    rule: "Confirm calcium acid-bisulphite whole-liquid supply from chip pulping, explicit wet pulp separation and declared industrial receiver. Reject a kraft black-liquor, other counterion, purchased-finished-liquid repack, purified powder, tall-oil or disposal-service substitution."
    source_ids:
      - unsd-cpc-39230
      - jrc-pulp-bref-2015
      - lignostar-calcium-liquor
      - jecfa-calcium-2008
  - rule_id: validate_denominator
    applies_to: "liquor_release; all inventory rows"
    rule: "Require unique cp_release first-release Q and exactly one 1 kg wet reference output. Verify A_j/Q occurs only in normalize_once; raw collection and cards do not divide again. Q0 has loads but no unit result. Closing released FG, reinspection, returns and dispatch never increase Q."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_physical
    applies_to: "each stage and combined gate"
    rule: "Require complete gross V and independent wet mass, dry solids, carbon, sulphur, calcium and water checks using measured speciation/reaction extents and independent stocks. Match internal transfer state/quantity and cancel at combined gate; retain failures, rejects, every external branch and WIP burden vectors. No two unknowns fitted by one residual."
    source_ids:
      - jrc-pulp-bref-2015
      - lignostar-calcium-liquor
  - rule_id: validate_inventory
    applies_to: "all inventory rows"
    rule: "Verify each card’s property/unit and full description, raw protocol, source ids and actual condition. Add every actual unlisted atomic exchange; missing quantities and UUIDs are unresolved, not zero. Exact native reference-property and unit-group chain and declared media/voltage/geography restrictions must remain compatible with the dataset."
    source_ids:
      - jrc-pulp-bref-2015
  - rule_id: validate_outlets
    applies_to: "liquid and air outlets"
    rule: "Verify source partitions exhaust each parent without overlap; total and partitions are not additive and each actual transfer has one provider. Dirty-condensate contained species are not direct water emissions. Steam supplier return, air vapour, reaction water and dirty condensate remain distinct. Unknown species/flow states prevent a completeness claim."
    source_ids:
      - jrc-pulp-bref-2015
  - rule_id: validate_allocation
    applies_to: "cp_allocation"
    rule: "Verify exclusive/virtual subdivision first, then exchange-specific determining physical causality, then only the remaining common-gate contemporaneous actual-state market values. No fixed allocation ratio, arbitrary mass/price choice or assumed energy/coproduct credit; inherited vectors are not reallocated."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_services_packaging
    applies_to: "post_release; cp_packaging"
    rule: "Require complete opening/closing FG cohort service links and each packaging type’s six-leg physical balance at identical cutoffs. Seals carried on gross shipments are not net product Q or new purchases. Combining modules cancels matched internal Q and keeps all real incremental services and return/rework events."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_evidence
    applies_to: "all claims"
    rule: "Require complete cited sources and foreground applicability, explicit technical-synthesis limits, primary lot/meter/sample data and truthful uncertainty. Candidate engineering conformance is separate from methodology review, translation review, mapping acceptance and publication."
    source_ids:
      - jrc-pulp-bref-2015
      - lignostar-calcium-liquor
      - jecfa-calcium-2008
      - ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Industrial binder/dispersant-feedstock modelling for the declared calcium whole-liquid concentrate at the stated solids and gate"
  allowed_use: "Compatible liquid feedstock supply with actual receiver acceptance and declared allocation, upstream and service conventions"
  excluded_use: "Universal lignosulphonate chemistry; purified food grade; powder; tall oil; kraft black liquor; other counterions; automatically credited fuel/recovery; waste-treatment service"
  required_metadata: "virgin softwood species and shares; chip volume convention and measured moisture; calcium acid bisulphite route; carbonate assay and SO2 supply form; free and combined SO2 in cooking acid; cook programme; pulp and liquor separation gate; whole liquid without purification or modification; calcium counterion and actual dissolved salts; dry-solids fraction and test method; residual sugars and insolubles; pH and free SO2; receiver use and actual acceptance limits; net wet lot mass excluding packaging; first release event and unique lot identity; WIP inheritance by exchange; steam supply and condensate return convention; gas recovery and each actual outlet; legal and market status; site and period; conditional electricity binding geography and voltage"
  required_quality_disclosure: "Primary meters and sampling; source vintage/applicability; unknowns and auxiliary UUID/provider gaps; complete Q0 and failure data; independent balances; WIP vectors; allocation evidence and sensitivity; utility return contracts; separate service/packaging accounting"
  update_trigger: "Changed wood/base/acid route, purification/modification, concentration state, outlet/recovery topology, first-release gate, steam/electric supply, receiver use, legal/market status, material allocation, or evidence invalidation"
data_sources:
  - id: "unsd-cpc-39230"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0, code39230, official detail and repository source CPC_Ver_3.0_Structure_30Jun2025.csv; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/39230"
    used_for: "Classification context including lignin sulphonates and explicit tall-oil exclusion; not identity, product status or LCA allocation evidence."
  - id: "jrc-pulp-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Production of Pulp, Paper and Board, 2015, §§4.1.1–4.1.5/4.2.2/4.3.22; PDF409/415/417–424/437/456/471/517–518, printed371/377/379–386/399/418/433/479–480; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "Primary technical route context: calcium versus magnesium recovery; fibre/liquor split; byproduct branches; SO2/condensate and failure controls. Fig4.4 is magnesium and Fig4.10 includes yeast; neither is the selected calcium whole-liquid plant. No numerical defaults or current compliance claims."
  - id: "lignostar-calcium-liquor"
    type: "handbook"
    reference: "LignoStar Group BV, Calcium Lignosulfonates, Calcium Bisulfite Pulping Process and liquid/powder interface, undated page retained2026-10-26; https://www.lignostar.com/en/calcium-lignosulfonates/"
    used_for: "First-party supplier technical description of calcium-counterion cooking, carbonate/hydroxide acid make-up, decanting, evaporation and industrial supply. Supports feasible liquid branch; typical solids/time/temperature and marketing statements are not prescriptions. Not one shared SKU/factory or LCA allocation method."
  - id: "jecfa-calcium-2008"
    type: "official_guidance"
    reference: "FAO/WHO JECFA, Calcium Lignosulfonate (40-65), Chemical and Technical Assessment, 69th JECFA2008, §§4–5, PDF1–3 with complete8-page context; https://www.fao.org/fileadmin/templates/agns/pdf/jecfa/cta/69/Calcium_Lignosulfonate__40_65.pdf"
    used_for: "Independent primary manufacturing counterexample: acid adjustment, ultrafiltration and spray drying define a purified food-grade endpoint beyond this whole industrial liquid. Supports retaining sugar/sulfite/calcium context, not transferring food-grade limits, purified-polymer identity or quantitative inventory."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, first edition March2010, §§7.9.2–7.9.3, PDF275–292/printed255–272, especially printed256/259/264–268; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation when required: subdivision/virtual subdivision, exchange-specific determining physical causality and residual actual-state common-gate economic values. This is method guidance, not pulp recipe, a factory fraction, automatic zero burden or recovery credit."
