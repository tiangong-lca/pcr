measurement_rules:
  - id: reference_wet_mass
    applies_to: "liquor_release"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q is the sum of net wet mass of unique newly first-released concentrate lots measured under cp_release. Use the same Q for all manufacturing rows. It excludes containers, shipment rechecks, previously released returns and repeated transfers. Dry-solids content is a qualifier and composition subledger, never a second denominator. The statistical residual-lye label does not prescribe alkaline pH; actual acid-sulphite chemistry and measured release pH govern."
  - id: solution_basis
    applies_to: "liquid_so2; calcium_carbonate; caustic_solution; liquor_release"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record each purchased supply once in its entire delivered form. Assay, carrier water, calcium, sulphur, lignosulphonate and sugars are contained subaccounts. In-house acid preparation counts purchased carbonate, SO2 and added water plus actual mixing energy/losses; its internal acid is not another purchase."
  - id: physical_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Row-specific property"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Convert raw quantities before allocation and normalization. Integrated volume is not multiplied by time; integrate only genuine rates. Liquid density must be measured for that exact liquid at recorded temperature and solids. Wood-chip bulk density requires matched moisture, size and packing. Never use a water density or a secondary flow coefficient to invent either density."
  - id: utilities_basis
    applies_to: "electricity; heating_steam; returned_condensate"
    required_property_ref:
      name: "Energy and Mass"
      uuid: ""
    required_unit: "MJ; kg"
    rule: "Electricity kWh converts to MJ by 3.6; the adopted AC identity uses the native Net calorific value property only as its energy reference, never a fuel heating value. Steam is kg of actual delivered water vapour with pressure, temperature, quality and enthalpy records. Keep supply and returned-condensate mass and enthalpy distinct; adopt one supplier burden convention per interface and never both kg-steam and a duplicate heat-service provider."
  - id: species_and_water
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Close total wet mass and independent dry solids/C/S/Ca accounts before allocation. Free water, net reaction water, physical vapour and hydrate/structural water need separate evidence. The carbonate-acid reaction and lignin sulphonation require measured feed/speciation/extent; do not fit two unknown species with one balance residual. COD/TOC/VOC readings are indicators with their reported bases, not identified chemical mass."
