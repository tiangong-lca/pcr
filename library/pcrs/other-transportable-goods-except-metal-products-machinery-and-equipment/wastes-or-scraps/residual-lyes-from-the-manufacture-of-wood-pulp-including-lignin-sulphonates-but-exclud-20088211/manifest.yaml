    matching identity/provider.
  - Wood-chip native reference is Volume/m3; no implicit bulk density.
  - Freshwater and calcium carbonate identities establish no supplier, purity or route.
  - Air emissions use exact non-long-term air-unspecified identities; specific known receptors require correct rebinding.
  - Returned steam condensate is a Product return; no assumed coproduct credit.
