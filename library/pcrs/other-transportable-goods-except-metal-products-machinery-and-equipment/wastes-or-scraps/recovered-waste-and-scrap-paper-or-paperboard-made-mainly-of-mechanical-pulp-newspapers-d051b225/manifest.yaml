  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scope_decision: One SCN 58 supply grade with independently evidenced predominantly mechanical-pulp source newspapers;
    no magazine/mixed-paper selector or downstream repulping. Original identity retained. No mapping or publication
    approval.
  native_identity_qualifications:
    paper: 55842481 is formally Product flow with sorted recycled raw-material route and broad paper-for-recycling
      synonyms. Its 39249 classification label and waste-flow wording are disclosed; they do not supply grade identity,
      legal status, burden exemption or an accepted mapping. Scoped physical sorted-paper identity is used, without
      claiming a dedicated 39243 native Flow.
    electricity: CN grid-average consumption mix delivered below 1 kV only; energy/MJ native reference.
    wire: One supplied iron/non-alloy steel wire; supplier diameter alloy coating and baler suitability remain required.
    hydraulic_fluid: Whole mineral-oil hydraulic formulation; native reference Volume/m3; no water density or invented
      assay.
    particles: Unspecified-size particulate matter emitted to air/unspecified; no adopted clinker factor or assumed
      LCIA coverage.
  unresolved_auxiliary_identities:
  - contracted road collection service measured in kg*km; fixed 30-ton diesel candidate not adopted
  - paper sorting conveyor as one complete asset
  - hydraulic paper baler as one complete asset
  - electric forklift as one complete asset
  - sheltered paper storage building as one complete asset
  - discarded corrugated paperboard
  - discarded bleached chemical-pulp office paper
  - discarded coated magazine paper
  - discarded polyethylene film
  - discarded carbon-steel bale wire
  - discarded paper identification tag
  - captured newspaper fines
  - spent mineral hydraulic fluid
  data_production_requirements:
  - Source-specific historical newspaper manufacturing printing distribution/use and recycling-boundary burden transfer;
    no default zero or credit.
  - Foreground raw records are future data requirements, not measured factory values.
  - Each cohort requires full WIP/FG exchange vectors and observed gate-service horizon; unknown future service
    is incomplete coverage.
