    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA — Detailed guidance, first edition March 2010, §§7.9.2–7.9.3, printed pp. 255–272 (PDF 275–292); https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation when justified: dedicated/subdivision/virtual subdivision, exchange-specific determining physical causality, genuine residual common-gate-state market value, recycling boundary/true joint-process and 100% conservation; no fixed upstream share or substitution credit"
