system_boundary:
  rules:
    - rule_id: scope_grade
      applies_to: "source and first release"
      rule: "Apply the SCN 58 limits and complete paper-stock preamble with the governing agreement. Establish mechanical-pulp predominance independently; do not merge SCN, SRPN/mixed paper, EN magazine mixtures or old deleted news grades. SCN moisture limits and CEPI commercial deductions are not physical conversion defaults."
      source_ids:
        - rema-scn-58
        - un-cpc-39243
        - cepi-grade-countercontext
        - cepi-recycling-qc
    - rule_id: whole_route
      applies_to: "collection to ex-works"
      rule: "Include all actual holder/collection-point work, inbound collection, receiving, dry sorting/removal, compression/wire binding/identification, first release and attributable storage/loading/return work. Stop before recipient wet repulping/deinking and later papermaking; a receiver’s pulping yield is not this recovery yield. Do not substitute a finished-bale purchase for the recovery route."
      source_ids:
        - bollegraaf-paper-recovery
        - cepi-recycling-qc
        - hsm-wire-baling
    - rule_id: history_transfer
      applies_to: "incoming paper"
      rule: "Determine actual legal/economic state and the source-system recycling boundary, true joint process and transfer of historical burdens from compatible upstream evidence. Trace newspaper furnish production, sheet formation/drying/finishing, printing/ink, distribution/use and collection as applicable to that approved transfer; obtain covered history once through the provider, supplement only demonstrated omissions. Grade names, a discarded state or money received/paid alone establish no universal zero share, complete history or credit. Missing upstream quantities/approved shares remain explicit dataset gaps."
      source_ids:
        - jrc-ilcd-allocation
    - rule_id: ownership_additions
      applies_to: "all processes"
      rule: "Each material/resource/emission and asset has one owner and actual stage/cohort. Full purchased collection/treatment services replace covered direct fuel, releases, capital and operation. Enumerate actual additional inputs, each species/compartment and each destination separately; whole formulated purchases and whole wastes are counted once with non-additive constituent subaccounts. Unknown or real unlisted flows trigger additions/review, not a zero or bundled other flow."
      source_ids:
        - jrc-ilcd-allocation
    - rule_id: gate_cohort
      applies_to: "release and FG services"
      rule: "Use newly first-released net grade Q once; new-cohort closing FG is included. Segregate manufacturing from actual finished-stock services over H and use each serviced cohort’s original Qc. Maintain opening/closing FG vectors and original dispatch/return reverse links; reinspection/redispatch/rebaling does not create production. Unknown future service remains incomplete, and old-cohort burdens cannot be shifted onto new-period production."
      source_ids:
        - cepi-recycling-qc
        - jrc-ilcd-allocation
boundary_abstraction:
  declared_starting_condition: "Source-separated old-newspaper lots at each original holder’s release interface, with actual collection-point actions and source-system history"
  starting_condition_role: "Physical recovery starting state, not a burden-free or automatically end-of-waste material"
  product_classification_scope: "Predominantly mechanical-pulp newspapers qualified to the single SCN 58 supply grade; not the complete CPC leaf"
  recursive_input_rule: "An externally supplied already recovered lot retains provider/gate/state and upstream recovery/history vectors; never restart it as free holder waste. Own internal/released returns remain original-cohort transfers with only actual incremental work."
  upstream_dataset_requirement: "Original newspaper manufacture/printing/distribution/use and documented recycling allocation transfer; actual collection services, utilities, whole preparations, packaging, assets and waste treatment with provider inclusions and one owner"
  disclosure: "All qualifiers; no default zero history or credits; stage/cohort stock vectors and actual gross transfers; all failed/Q-zero events; service H and future gaps; changes from selected dry route"
