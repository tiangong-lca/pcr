published_dataset_profile:
  dataset_role: "Attributional recovery-feedstock supply process for the declared SCN grade"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual compatible dry-sorted mainly mechanical-pulp SCN newspaper supply with complete origin/stock/burden/service evidence"
  excluded_use: "Generic mixed paper; OCC/woodfree supply; wet repulping/deinking; new paper; treatment-service function; factory/default inventory or avoided-product credit"
  required_metadata: "All reference qualifiers; actual boundary/route and service H; provider/stock/transfer/normalization records"
  required_quality_disclosure: "Source edition/limits; actual measurement and uncertainty; history/allocation method; unresolved auxiliary identities; future/unobserved services and LCIA coverage"
  update_trigger: "Changed furnish/grade agreement; wet/thermal/combustion route; provider/native incompatibility; stock/release correction; new source evidence or observed service data"
