allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "attributional multifunctional processes"
    rule: "When allocation is required under the declared attributional goal, first use dedicated measurement, subdivision and virtual subdivision. For each remaining exchange identify and justify the determining physical causality: embodied material, actual sorting/baling duty, transport limiting payload/volume with distance, storage area/volume with duration, or another evidenced relationship. A physical correlation or the existence of several saleable outputs alone is insufficient. Do not select physical or economic allocation freely or apply one key to all exchanges."
    source_ids:
      - jrc-ilcd-allocation
  - rule_id: allocation_residual
    applies_to: "genuinely inseparable remainder"
    rule: "Only after demonstrating absent/unusable determining physical causality allocate the genuine remainder by contemporaneous representative market values at the same actual multifunctional process gate and state, with quantities, units, grade, packing, transport and condition aligned. Disclose adjustments, price period and sensitivity. Treat true recycling joint-process and negative/positive market-state boundaries explicitly; do not import a gate-fee percentage, fixed recycling loop, avoided-primary-material or disposal credit. Shares must conserve each exchange."
    source_ids:
      - jrc-ilcd-allocation
  - rule_id: allocation_outputs
    applies_to: "separated grades and rejects"
    rule: "Identify other intended grades and any separately supplied treatment function. Assign their dedicated burdens first; retained fractions are not negative inputs. Rejects and failed batches keep attributable upstream and treatment burdens. Saleable recovered fractions need their own actual gate/state and allocation; a sale receipt alone does not make all sorting waste a co-product. Paper, tags and wire remain separate ledgers without automatic credit."
    source_ids:
      - jrc-ilcd-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "collection"
      flow_role: "newspaper_at_holder; received_transfer; received_input"
      record_type: "material lot ledger"
      raw_fields: "holder; source-paper history; furnish evidence; raw gross/tare/net; contamination fractions; moisture basis; transfers; opening and closing WIP; exchange vectors; failed collection; returns"
      collection_method: "Calibrated lot/weighbridge records and representative grade/furnish sampling at each physical handoff; preserve original units, whole-lot mass and non-additive assay partitions. Obtain inherited burdens and agreed recycling transfer from the actual source model. Pair internal transfers. Collect unnormalized raw totals including losses/refusals and failed events."
      unit: "kg"
      frequency: "each lot and stock close"
      temporal_coverage: "whole reporting period and source-cohort history"
      site_scope: "all holders collection points and receiving yard"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; source-paper records; custody and stock reconciliation"
    - protocol_id: cp_release
      process_id: "recovery"
      flow_role: "finished_scn"
      record_type: "first-release register"
      raw_fields: "cohort; lot; first-release timestamp; grade tests; conditional acceptance resolution; raw net released mass; wire/tag/container tare; moisture; WIP; FG; original Q; shipment and return links"
      collection_method: "Weigh newly first-released grade stock on calibrated scales after specification checks and resolution of conditional holds. Exclude tare/free liquid; do not invent moisture correction. Retain all failed/Q-zero lots and original release/dispatch/return ids. Collect raw Q and physical gross quantities without normalization."
      unit: "kg"
      frequency: "each first release and stock close"
      temporal_coverage: "entire manufacturing cohort and observed H"
      site_scope: "identified yard and all linked FG locations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed grade/QC and calibrated mass tickets; original cohort register"
    - protocol_id: cp_transport
      process_id: "collection"
      flow_role: "collection_transport"
      record_type: "transport leg records"
      raw_fields: "route; provider; vehicle; payload; cargo kg; km; empty legs; collection-point operations; covered fuel/capital/emissions; provider unit"
      collection_method: "Collect actual leg distances, raw cargo mass and provider boundary/unit with all unsuccessful/empty work. Retain a full service once or its uncovered individual resources; do not assume a 30-ton diesel truck. Raw kg and km remain unnormalized; conversion/attribution occurs later."
      unit: "kg*km"
      frequency: "every trip and leg"
      temporal_coverage: "all period collection and linked returns"
      site_scope: "all declared transport providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; trip logs; provider coverage matrix"
    - protocol_id: cp_energy
      process_id: "support"
      flow_role: "electricity"
      record_type: "raw meter records"
      raw_fields: "meter; start/end; kWh; voltage; grid/provider/year; stage; cohort; active idle cleanup; charging; shared consumers"
      collection_method: "Collect calibrated interval/meter differences and operational logs for every stage including failed duty. Separate manufacture from FG-service cohort totals; map shared meters to all consumers before attribution. Retain raw kWh; do not divide by Q in collection."
      unit: "kWh"
      frequency: "meter interval and each campaign"
      temporal_coverage: "full period plus observed cohort service H"
      site_scope: "all recovery and gate-service equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; meter reconciliation; voltage/provider documents"
    - protocol_id: cp_packaging
      process_id: "support"
      flow_role: "baling_wire; bale_tag; spent_wire; spent_tag"
      record_type: "one ledger per package"
      raw_fields: "component; specification; O_empty; O_WIP; O_FG; O_reusable; P; ER; C_empty; C_WIP; C_FG; C_reusable; gross dispatch S; external return EO; waste W; internal reuse; cohort"
      collection_method: "Weigh or use verified supplier/component counts with independently measured single-component masses. For wire and whole printed tags separately collect every opening/closing state, purchases and both external-return directions, attached gross dispatch and waste. Pair internal reuse; retain failures/replacements. Raw totals stay undivided; no paper-Q or additional purchase is created."
      unit: "kg"
      frequency: "each movement and stock close"
      temporal_coverage: "whole manufacturing and cohort-service periods"
      site_scope: "all empty WIP FG reusable stocks and external interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tare/component weights; package movement/stock tickets"
    - protocol_id: cp_fluid
      process_id: "support"
      flow_role: "hydraulic_fluid"
      record_type: "whole-fluid ledger"
      raw_fields: "supplier formulation; raw L or m3; density method/value/state; opening/closing reservoir; fill/drain; leak; captured waste; cohort/duty"
      collection_method: "Record whole supplied formulation and measured reservoir/fill/drain/maintenance amounts. Measure actual oil density independently at declared temperature only when a mass reconciliation is needed. Preserve actual losses and all destinations; identify any real uncontained release by substance/medium and add its own flow. Do not count base oil/additives again or divide raw amounts by Q."
      unit: "L; m3"
      frequency: "each service/fill/drain and stock close"
      temporal_coverage: "all relevant asset duty and maintenance"
      site_scope: "actual baler/handling hydraulic system"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier SDS; calibrated volume; independent density and waste tickets"
    - protocol_id: cp_assets
      process_id: "support"
      flow_role: "conveyor_asset; baler_asset; forklift_asset; building_asset"
      record_type: "individual asset records"
      raw_fields: "asset id; manufacture/installation/retirement provider; original item quantity; cumulative duty/life; period stage/cohort duty; maintenance/replacements; occupied area/volume and time"
      collection_method: "Collect one complete asset’s actual provider scope and use records, with life/duty uncertainty and replacements. Determine dedicated share or justified physical use driver for each function; building area/volume-time is separate. Item(s) and item name the same count unit with factor 1; neither supplies per-item kg. Raw asset/duty records are not normalized at collection."
      unit: "item; h; m2; m3"
      frequency: "asset change and each period"
      temporal_coverage: "actual observed and justified service life"
      site_scope: "each identified asset and all consumers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "asset register; provider boundary; duty/occupancy evidence"
    - protocol_id: cp_waste
      process_id: "support"
      flow_role: "each separate waste row"
      record_type: "individual waste transfer ledger"
      raw_fields: "row/material identity; raw kg; moisture; contamination; stage/cohort; opening/closing waste stocks; destination/provider; recovery or treatment; inherited burden"
      collection_method: "Weigh each physically distinct waste at its actual formation/transfer gate; collect failed sorting/baling and cleanup wastes and stocks. Whole stream totals and composition partitions are non-additive. Use one actual receiver/treatment provider per physical portion; account for treatment emissions once in that provider or direct operation. No inferred credit or raw-Q division."
      unit: "kg"
      frequency: "every waste event and stock close"
      temporal_coverage: "complete period including service H"
      site_scope: "all actual destinations and controls"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "composition analysis; scales; waste consignment and provider records"
    - protocol_id: cp_emission
      process_id: "recovery"
      flow_role: "air_pm"
      record_type: "source-specific air release records"
      raw_fields: "source; raw measured kg or rate/time; concentration and integrated gas volume/state; collection efficiency evidence; size; medium; stage/cohort; detection limit"
      collection_method: "Use actual residual airborne particulate measurement or a validated source/control model with independent inputs. Integrated gas volume is not multiplied by time again; a true rate is integrated over actual duration. Preserve measured size/medium and uncertainty; do not fit PM and moisture from one mass residual or use a clinker factor. Add individually identified real chemical releases separately without double-counting particle totals. Raw records remain undivided."
      unit: "kg"
      frequency: "each source/campaign and operating state"
      temporal_coverage: "all active idle cleanup and service events"
      site_scope: "actual yard emissions and receiver compartments"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "measurement/model validation; control log; detection/uncertainty"
    - protocol_id: cp_cohort
      process_id: "support"
      flow_role: "all stock and service vectors"
      record_type: "exchange-by-cohort attribution ledger"
      raw_fields: "cohort c; exchange j; raw stage totals R; opening/closing WIP vector; original release Qc; opening/closing FG vector; gross dispatch/return; service H; failed and Q0 events; attribution shares"
      collection_method: "Preserve raw numerator units, physical quantities and inherited vectors separately at every WIP/FG handoff. Assign actual service increments to original cohorts/Qc, reverse original shipment attribution on identified returns, and retain actual incremental rework. Collection stores undivided raw totals and proposed attribution evidence; apply conversion, conservation and normalization only in calculation. Unknown future service and inherited vectors remain gaps."
      unit: "native"
      frequency: "every handoff and cohort close"
      temporal_coverage: "all production history plus actual observed H"
      site_scope: "all stage/site/cohort consumers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "hashable transfer/stock ledger; allocation and original-release evidence"
  calculation_rules:
    - id: raw_conversion
      applies_to: "all raw records"
      rule: "Convert each raw numerator to its declared row unit before attribution. For each actual transport leg, D = cargo_kg * distance_km; include empty-leg burdens through the service model rather than inventing cargo. Electricity E_MJ = E_kWh * 3.6; hydraulic fluid V_m3 = V_L * 0.001. An already integrated volume stays V; only a genuine rate is integrated over time. Keep source values and conversion evidence."
      inputs:
        - raw_records
        - unit_conversions
      output: "converted raw vectors"
      source_ids: []
    - id: release_quantity
      applies_to: "finished_scn"
      rule: "Q_c = sum of newly first-released net SCN mass for cohort c after grade/condition acceptance; exclude actual package/container tare and separate free liquid. Retain actual moisture and allowed grade constituents; composition partitions do not add to their parent. First-released closing FG is in Q_c. Reinspection, gross shipments, returns and service hours do not create Q_c. A genuine erroneous original release is corrected once in its original register with linked reversals, not by a new release."
      inputs:
        - cp_release
        - original_release_register
      output: "Q_c in kg"
      source_ids:
        - rema-scn-58
        - cepi-recycling-qc
    - id: wip_inheritance
      applies_to: "manufacturing exchange vectors"
      rule: "For every exchange j and cohort c: Aprod_cj = B_WIP_open_cj + R_attributed_cj - B_WIP_close_cj. R is the converted and justified attributed manufacturing total with incoming historical burden once and all failed/start-stop/idle/cleanup/rework loads. Carry each unfinished physical lot and its whole exchange vector forward; do not approximate every exchange by one uniform mass ratio. An external acquired recovered lot keeps its supplier vector; paired internal transfers cancel. A period with Q_c = 0 retains its actual burden/stock vectors and produces no per-kg result."
      inputs:
        - cp_material
        - cp_cohort
        - converted_raw_vectors
        - allocation_evidence
      output: "Aprod_cj and inherited closing WIP vectors"
      source_ids:
        - jrc-ilcd-allocation
    - id: fg_service_inheritance
      applies_to: "finished-stock cohorts"
      rule: "Preserve each FG lot’s original Q_c and manufacturing vector, including opening and closing FG. Aserv_cj is only its actual attributable storage/handling/loading/return/rebaling/cleanup and replacement increment over observed H. Pair returned mass with the original gross dispatch and reverse its shipment attribution once; inherited manufacturing is neither a new purchase nor a second production burden. Charge real rework increments to original Q_c. Never divide old-cohort services by new-period Q or by H. Unobserved future service remains explicitly incomplete."
      inputs:
        - cp_cohort
        - original_Q_c
        - FG_vectors
        - gross_dispatch_return_links
        - service_raw_totals
      output: "Aserv_cj and complete observed-cohort history"
      source_ids:
        - jrc-ilcd-allocation
        - cepi-recycling-qc
    - id: inventory_normalization
      applies_to: "all inventory rows"
      rule: "For Q_c > 0, q_cj = A_cj / Q_c, where A_cj = Aprod_cj + Aserv_cj after unit conversion, direct assignment and justified residual allocation. This is the only division by Q_c. The card amount and protocol aggregation label refer to this same result and never divide again. An internal flow’s physical amount is reconciled on its own transfer subledger and cancels from the consolidated external inventory; do not sum internal receipts as new external purchases. Q_c = 0 retains raw loads and yields no normalized result."
      inputs:
        - Aprod_cj
        - Aserv_cj
        - Q_c
        - cp_cohort
      output: "q_cj per 1 kg reference flow"
      source_ids: []
    - id: physical_gates
      applies_to: "manufacturing FG and consolidated balance"
      rule: "Use actual physical gross mass V and separate components, independently of burden vectors A. Manufacturing: opening WIP_V + external material/addition inputs = closing WIP_V + newly released V + other actual outputs/wastes/releases. Newly released V includes Q and attached packages; do not add Q/packages again to V. FG: opening FG_V + newly released V + external returned V = closing FG_V + gross outward shipment V + outward external returns V + actual FG wastes/releases. Consolidation cancels newly released and every paired internal transfer. Retain receiving/collection stocks and losses at their own gate; whole outgoing streams and their source partitions are non-additive and each physical portion has one receiver/provider. Independently measure moisture/free water, paper solids and any relevant elements/species; one residual cannot solve two unknowns. COD/VOC indicators are not invented chemical masses. No reaction/structural water is inferred for dry sorting."
      inputs:
        - cp_material
        - cp_release
        - cp_waste
        - cp_fluid
        - cp_cohort
      output: "separate physical balances and disclosed residuals"
      source_ids: []
    - id: packaging_conservation
      applies_to: "each wire/tag component and every additional real package"
      rule: "For each p: O_empty_p + O_WIP_p + O_FG_p + O_reusable_p + P_p + ER_p = C_empty_p + C_WIP_p + C_FG_p + C_reusable_p + S_p + EO_p + W_p. S is package mass on actual gross outward shipments, including redispatch; ER and EO are external received and outward returns. Internal reuse cancels and adds no procurement, Q, credit or output. Record attached states and replaced/broken packages even when paper remains in FG. Procurement burden follows actual withdrawals from unused stocks into each identified manufacture/service cohort, with opening/closing unused-stock burden vectors and actual external-return ownership; purchasing P or outward attachment S alone is not consumption. Already attached WIP/FG packages retain their inherited vectors, and original returned attachments are not procured again; only actual new replacement increments enter service. Add any real new term X explicitly; remove an OTHER term only if that exact X is proven already duplicated within OTHER on the same side. Do not delete a genuine flow to force closure."
      inputs:
        - cp_packaging
        - gross_dispatch_return_links
      output: "one independently closed ledger per p"
      source_ids:
        - cepi-recycling-qc
    - id: mass_and_composition
      applies_to: "sampling and fluid conversion"
      rule: "State moisture basis explicitly: water mass = wet stock mass * wet-basis water fraction; dry solids = wet stock mass - independently measured water. A dry-basis observation needs its documented conversion before use. Keep grade fraction denominators and nested prohibitives/outthrows definitions from the governing specification. For oil, m_oil = V_oil * measured_rho_oil at the stated temperature only. All constituent masses are subaccounts of their whole supplied formulation/stream, not additional exchanges."
      inputs:
        - sample_raw_masses
        - moisture_basis
        - whole_stream_mass
        - independent_oil_density
      output: "independent composition and physical mass checks"
      source_ids:
        - rema-scn-58
        - cepi-recycling-qc
  data_quality_requirements:
    - id: dq_identity
      applies_to: "source and product"
      requirement: "Trace holder/source-paper genealogy, actual mainly mechanical-pulp evidence and the single SCN agreement. Do not infer furnish from a waste-paper UUID or news title. Retain counterevidence on brown/woodfree/magazine fractions."
      evidence: "source documents; sampling; signed agreement"
    - id: dq_raw
      applies_to: "all quantities"
      requirement: "Retain raw units and meter states, calibration, sampling/measurement limits and independent conversion inputs. Missing is not zero. Never invent factory values, defaults or plausible density."
      evidence: "calibration and raw records"
    - id: dq_complete
      applies_to: "all period operations"
      requirement: "Cover all sites, shifts, failed and zero-output batches, start/stop, idle, cleanup, returns/rework and actual assets. Enumerate any real additional fuel, water, cleaning preparation, polymer, package and species separately before claiming completeness."
      evidence: "event/flow completeness register"
    - id: dq_stocks
      applies_to: "each WIP/FG exchange"
      requirement: "Stock mass alone is insufficient: preserve inherited numerator vectors for each exchange and source/cohort, original Qc and gross dispatch/return linkage. Keep historical and current burdens separate and identify unknown future H coverage."
      evidence: "vector ledger and release/return records"
    - id: dq_native
      applies_to: "UUID and provider use"
      requirement: "Apply complete native identity/type/form/route/geography/media/property restrictions in every card. Generic physical flow identity is distinct from provider, legal status and classification acceptance. Selected auxiliary UUID gaps need exact individual flow resolution, not a collection label; do not relax a fixed physical restriction."
      evidence: "native record and supplier compatibility evidence"
    - id: dq_attribution
      applies_to: "all shared and recycling burdens"
      requirement: "Document attributional purpose, source-system transfer, subdivision, exchange-specific causality, actual residual gate-state values and conservation/sensitivity. Industrial equipment documents do not establish LCA allocation or historical zero shares."
      evidence: "upstream model; allocation analysis"
    - id: dq_sources
      applies_to: "source use"
      requirement: "Keep source edition, complete conditions, adjacent exclusions and independence. A grade specification is not a measured inventory; generic equipment evidence is not a same-factory case; CEPI conventions are not SCN limits. Disclose methodological and temporal applicability."
      evidence: "full sources and evidence appraisal"
