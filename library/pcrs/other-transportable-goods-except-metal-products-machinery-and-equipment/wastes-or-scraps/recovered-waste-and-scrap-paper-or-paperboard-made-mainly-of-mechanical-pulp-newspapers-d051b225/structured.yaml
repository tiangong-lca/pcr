    reference: "Bollegraaf, Paper and cardboard waste; https://www.bollegraaf.com/solutions/paper-and-cardboard-waste/"
    used_for: "Primary dry sorting/separation of paper streams, baling and shipping for reuse; equipment alternatives and downstream deinking countercontext; no factory numeric inventory"
  - id: "hsm-wire-baling"
