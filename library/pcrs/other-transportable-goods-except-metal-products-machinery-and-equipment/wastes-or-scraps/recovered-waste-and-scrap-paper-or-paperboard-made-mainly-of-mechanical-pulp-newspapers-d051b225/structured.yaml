measurement_rules:
  - id: reference_basis
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the newly first quality-released net as-received SCN stock of the identified cohort, excluding actual packaging/container tare and free liquid. Its measured moisture and allowed constituents are retained, not converted to an assumed dry/air-dry grade. Use cp_release."
  - id: conversion_basis
    applies_to: "all measured flows"
    required_property_ref:
      name: "Declared native reference property"
      uuid: ""
    required_unit: "native"
    rule: "Convert raw numerators before attribution: metric t to kg by 1000; kWh to MJ by 3.6; L to m3 by 0.001; mass-distance from actual kg and km. Keep integrated volume distinct from a rate requiring time integration. Density is independently measured for that substance and state; oil never inherits water density. No secondary coefficient establishes a density or single-item kg."
  - id: cohort_basis
    applies_to: "production and gate services"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "All final inventory uses the same 1 kg reference basis. Raw protocols collect unnormalized totals; the aggregation labels name their destination basis only. The sole section-8 normalization divides the attributable vector by original cohort Q once. H is observation time, never production output; opening/closing FG, redispatch and reinspection do not add Q."
