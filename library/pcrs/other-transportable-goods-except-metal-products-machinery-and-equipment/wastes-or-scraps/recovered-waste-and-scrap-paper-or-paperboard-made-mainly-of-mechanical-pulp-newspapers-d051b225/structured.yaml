    reference: "HSM, Efficient solutions for disposal and recycling in the printing and packaging industry; https://uk.hsm.eu/en/compressing/industry/packaging-industry"
    used_for: "Compression, loading options and wire strapping as compatible unit-operation evidence; its cutting-scrap case is not this newspaper yard and supplies no recipe/allocation factor"
