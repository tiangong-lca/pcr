          line: 490
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `allocation_hierarchy` | attributional multifunctional processes | When allocation is required under the declared attributional goal, first use dedicated measurement, subdivision and virtual subdivision. For each remaining exchange identify and justify the determining physical causality: embodied material, actual sorting/baling duty, transport limiting payload/volume with distance, storage area/volume with duration, or another evidenced relationship. A physical correlation or the existence of several saleable outputs alone is insufficient. Do not select physical or economic allocation freely or apply one key to all exchanges. | jrc-ilcd-allocation |\n| `allocation_residual` | genuinely inseparable remainder | Only after demonstrating absent/unusable determining physical causality allocate the genuine remainder by contemporaneous representative market values at the same actual multifunctional process gate and state, with quantities, units, grade, packing, transport and condition aligned. Disclose adjustments, price period and sensitivity. Treat true recycling joint-process and negative/positive market-state boundaries explicitly; do not import a gate-fee percentage, fixed recycling loop, avoided-primary-material or disposal credit. Shares must conserve each exchange. | jrc-ilcd-allocation |\n| `allocation_outputs` | separated grades and rejects | Identify other intended grades and any separately supplied treatment function. Assign their dedicated burdens first; retained fractions are not negative inputs. Rejects and failed batches keep attributable upstream and treatment burdens. Saleable recovered fractions need their own actual gate/state and allocation; a sale receipt alone does not make all sorting waste a co-product. Paper, tags and wire remain separate ledgers without automatic credit. | jrc-ilcd-allocation |\n\n"
