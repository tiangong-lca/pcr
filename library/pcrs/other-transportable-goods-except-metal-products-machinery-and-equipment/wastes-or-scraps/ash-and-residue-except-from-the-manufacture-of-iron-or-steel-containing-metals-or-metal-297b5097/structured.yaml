allocation_rules:
  - rule_id: attributional_hierarchy
    applies_to: "source formation and all shared operations"
    rule: "Use an attributional model. First identify actual functions and independently dedicate or physically/virtually subdivide process steps. Next determine a documented physical causal relationship separately for each remaining exchange and co-function; a convenient mass or metal-content ratio is not automatically causal. Only the true residual joint process reaches a common process gate and allocation by representative contemporaneous market values of co-functions in their actual condition at that gate. Document price period, net condition/transport/processing adjustments, quantities, negative/zero price and service treatment, sensitivity and conservation of each exchange. Do not choose physical versus economic allocation at will, fix a slag percentage, infer product status from a positive sale, or use final copper value for raw slag. When a waste-management function or negative value exists, disclose the applicable joint-function logic and review it before use; no unexplained zero-burden cut-off."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: no_automatic_recovery_credit
    applies_to: "every material and outlet"
    rule: "Future recovery, ore displacement and avoided landfill are not credits in this attributional feed dataset. Keep recovered matte heel, saleable slag, disposal residue and any service distinct by real function and actual condition. Measure each whole physical outlet once with one verified provider; its source partitions are not additional outputs. Internal recirculation carries inherited burdens and cancels once. If the receiver is only paid to dispose of material or cannot demonstrate the intended feed acceptance, do not relabel the disposal service as this supplied reference Product."
    source_ids:
      - epa-slag-reprocessing-1994
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_source
      process_id: "condition"
      flow_role: "source molten slag and inherited burdens"
      record_type: "source_records"
      raw_fields: "source lot; whole concentrate and flux supply; source gate; each native exchange and unit; matte and each coproduct; raw input/output and stocks; copper phase and elemental assays; source allocation; inherited vector; tapped mass and temperature"
      collection_method: "Before accepting incoming slag, verify a source formation module from burden-bearing whole copper concentrate and actual separately supplied siliceous flux through preparation/drying, flash smelting, slag/matte separation and tapped molten slag. Record the actual oxygen and combustion-air supply, each fuel, electricity, water, refractory/maintenance and startup/idle/cleanup loads; original matte and each genuine co-product; offgas transfer and actual acid/heat recovery where operated; dust return and treatment; and each postcontrol atmospheric species, wastewater and solid residue. Require raw quantities, original supply forms, source year/location, actual source output gate, allocation and an exchange-by-exchange inherited vector. Concentrate assays and carrier water are subledgers of the whole concentrate, never additional oxide/sulfide purchases. A compatible matte PCR can guide the source operation but cannot supply an unverified slag burden by subtraction or an arbitrary yield. Missing formation coverage makes a concrete dataset incomplete; purchased finished slag plus packaging is not this route."
      unit: "kg; MJ"
      frequency: "each source campaign and transfer"
      temporal_coverage: "full source campaign including failures and opening/closing inventory"
      site_scope: "actual originating copper flash smelter"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier primary records; calibrated meters; assays; source model and allocation reconciliation"
    - protocol_id: cp_condition
      process_id: "condition"
      flow_role: "all cooling and physical exits"
      record_type: "raw_foreground"
      raw_fields: "lot; source mass; cooling time temperature sequence; raw water and rain; raw rate or integrated quantity; actual density conditions; opening/closing WIP; raw dry solids and metal phases; whole liquid/solid exit; source partition; receiving provider; internal reuse; failed lot and Q0; assay uncertainty"
      collection_method: "Collect unnormalized raw readings and paired samples at each physical boundary; weigh whole wet streams and independently measure moisture/solids/species. Calibrate instruments and record censored/unknown values. Sum raw quantities only; the aggregation label states the eventual result basis and performs no division. Record direct releases only when this foreground owns them."
      unit: "kg; actual raw units"
      frequency: "each lot and event with integrated period closure"
      temporal_coverage: "complete matched reporting period plus opening/closing histories"
      site_scope: "declared cooling crushing drainage boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge calibration; cooling log; assay QA; wet and elemental reconciliation; receiver permits"
    - protocol_id: cp_release
      process_id: "condition"
      flow_role: "unique first-release Q"
      record_type: "release_records"
      raw_fields: "lot ID; original Q_c; timestamp; calibrated net wet mass; free moisture; dry Cu Fe Si S assay and phases; trace pollutants; grain size and temperature; receiver specification and acceptance; legal material class; rejected samples; closing released FG; retest return and dispatch links"
      collection_method: "Independently weigh qualified net lot excluding equipment and packaging, pair representative moisture/phase/grade/contaminant tests with actual receiving-feed specification and release authorization, and deduplicate original lot records. Retain closing released FG within Q. No later handling or acceptance generates new production. Collect Q without a normalization division."
      unit: "kg"
      frequency: "each first release"
      temporal_coverage: "one deduplicated cohort with complete release records"
      site_scope: "producer conditioned-feed release interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated mass; representative sampling plan; test uncertainty; signed receiver-feed acceptance"
    - protocol_id: cp_support
      process_id: "support"
      flow_role: "utilities maintenance and original-cohort services"
      record_type: "raw_foreground"
      raw_fields: "exchange ID; whole supply and native unit; raw meter readings; voltage and grid; fuel formulation; exact emission species; stock changes; oil installed/drained; new/worn plate; original Q_c; manufacturing/service tag; observed H; gross dispatch and true returns; packaging empty/WIP/FG/reusable stocks and purchases/returns/waste; provider ownership; first nonpurchase packaging receipt ID/time/origin; specific material/form/type and atomic input interface; measured raw receipt quantity and native unit; mutually exclusive P/N_ext/ER; true ER prior dispatch; component owner and inherited unused-stock vector"
      collection_method: "Meter each actual utility and individual species, reconcile installed/unused assets and supplies, and independently dedicate or subdivide manufacturing versus already performed original-cohort services. Retain failed/idle/cleanup/rework and observed postrelease work. Collect raw quantities with no division; convert and allocate once in section 8. Add any real unlisted atomic flow, including each actual first borrowed/leased or genuinely nonpurchased supplier-attached packaging receipt; weigh its full physical ingress independently from procurement, retain every opening/closing state and gross outward leg, and reconcile one owner/vector/provider once without a second manufacture burden. Do not confuse integrated m3 with m3/hour."
      unit: "kg; MJ; actual raw units"
      frequency: "continuous meters and every supply/service event"
      temporal_coverage: "complete source-linked period; actual service horizon H"
      site_scope: "declared on-site plant/support/service boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; fuel assay; emission method; stock cards; service logs; original-Q_c and provider reconciliation"
  calculation_rules:
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q for Q > 0; A_i is the unnormalized exchange-specific inherited and current attributable amount after actual unit/rate conversion and the section-7 hierarchy and stock/transfer reconciliation; Q is the unique net wet first-release mass from cp_release. Use original Q_c for its separate already-performed service result. This is the only normalization division; cards and protocol aggregation refer to this same result. For Q = 0 retain raw burdens and produce no a_i. The reference output is 1 kg by definition."
      inputs:
        - A_i
        - Q
        - Q_c
        - cp_source
        - cp_condition
        - cp_release
        - cp_support
      output: "a_i"
      source_ids:
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_source
      applies_to: "molten_slag"
      requirement: "Before accepting incoming slag, verify a source formation module from burden-bearing whole copper concentrate and actual separately supplied siliceous flux through preparation/drying, flash smelting, slag/matte separation and tapped molten slag. Record the actual oxygen and combustion-air supply, each fuel, electricity, water, refractory/maintenance and startup/idle/cleanup loads; original matte and each genuine co-product; offgas transfer and actual acid/heat recovery where operated; dust return and treatment; and each postcontrol atmospheric species, wastewater and solid residue. Require raw quantities, original supply forms, source year/location, actual source output gate, allocation and an exchange-by-exchange inherited vector. Concentrate assays and carrier water are subledgers of the whole concentrate, never additional oxide/sulfide purchases. A compatible matte PCR can guide the source operation but cannot supply an unverified slag burden by subtraction or an arbitrary yield. Missing formation coverage makes a concrete dataset incomplete; purchased finished slag plus packaging is not this route."
      evidence: "original source model and atomic records with per-exchange inherited vector"
    - id: dq_receiver
      applies_to: "first_release_slag"
      requirement: "Require every qualifier, non-ferrous copper flash-smelter provenance, independent actual metal/phase/moisture/contamination analyses, receiver specification and lawful receiving function. Match full native type, route, form, geography, media and property/unit; generic UUIDs certify none of the site tests. Reject steel-origin or precious-metal classes, pure-copper substitutions, ready concentrate and incompatible historic/granulated material. Do not substitute a Waste flow for the required supplied Product interface."
      evidence: "actual batch assays and phase/mineral tests; receiver feed specification; classification and acceptance documents"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Verify the full source formation module and per-exchange inheritance, source/receiver gates and providers; reconcile each unallocated gross physical/element/water balance independently from attribution. Verify unique Q, unchanged closing-FG treatment, all failures and WIP inheritance, original-Q_c service ledgers, whole-mixture exits and full packaging/asset stocks. Missing core formation or receiver evidence blocks a complete concrete dataset. Auxiliary UUID/provider/measurement gaps remain explicit work items and never justify fabricated amounts or universal grades."
      evidence: "independent gross V and elemental/water closures; failure and WIP ledger; service and package records"
    - id: dq_uncertainty
      applies_to: "whole model"
      requirement: "Collect and preserve raw records before conversion, inheritance and allocation. Compute the final amount once under the section-8 calculation after those steps; do not divide again in cards or collection aggregation. Q=0 gives no unit result. Distinguish measured zero, proven absence, censored values and unknown. Report uncertainty, temporal/site representativeness, missing exchanges, sensitivity and all unresolved native identities. A coherent method is not scientific approval, translation review, mapping acceptance or measured factory compliance."
      evidence: "temporal/geographic/technological coverage; measurement uncertainty and sensitivity; native gap register"
validation_rules:
  - rule_id: identity_gate
    applies_to: "reference and incoming source"
    rule: "Require every qualifier, non-ferrous copper flash-smelter provenance, independent actual metal/phase/moisture/contamination analyses, receiver specification and lawful receiving function. Match full native type, route, form, geography, media and property/unit; generic UUIDs certify none of the site tests. Reject steel-origin or precious-metal classes, pure-copper substitutions, ready concentrate and incompatible historic/granulated material. Do not substitute a Waste flow for the required supplied Product interface."
    source_ids:
      - jrc-nfm-bref-2017
      - epa-slag-reprocessing-1994
      - unsd-cpc30-2025
  - rule_id: source_and_accounting_gate
    applies_to: "all inventory rows"
    rule: "Verify the full source formation module and per-exchange inheritance, source/receiver gates and providers; reconcile each unallocated gross physical/element/water balance independently from attribution. Verify unique Q, unchanged closing-FG treatment, all failures and WIP inheritance, original-Q_c service ledgers, whole-mixture exits and full packaging/asset stocks. Missing core formation or receiver evidence blocks a complete concrete dataset. Auxiliary UUID/provider/measurement gaps remain explicit work items and never justify fabricated amounts or universal grades."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: normalization_and_quality_gate
    applies_to: "whole model"
    rule: "Collect and preserve raw records before conversion, inheritance and allocation. Compute the final amount once under the section-8 calculation after those steps; do not divide again in cards or collection aggregation. Q=0 gives no unit result. Distinguish measured zero, proven absence, censored values and unknown. Report uncertainty, temporal/site representativeness, missing exchanges, sensitivity and all unresolved native identities. A coherent method is not scientific approval, translation review, mapping acceptance or measured factory compliance."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Burden-bearing supplied mixed copper-smelter residue as feed to a separately modelled copper-recovery process"
  allowed_use: "Only compatible source flash-smelting slag and receiver-feed condition with verified formation and actual release evidence"
  excluded_use: "Exclude iron/steel-manufacturing slag and EAF dust regardless of iron content; precious-metal ash and anode slime and materials classified or supplied for a precious-metal recovery function; converter slag and mixed-furnace slag; historic dump mining; quench-granulated abrasive or construction aggregate; already floated slag concentrate and final flotation tailings; pure copper or a pure oxide; refined recovered metal; and a disposal-only service without a genuine receiving-feed function. Trace precious-metal occurrence alone does not establish an allowed class: document the actual material classification and receiver purpose without inventing a universal concentration threshold. No other non-ferrous residue is a selectable branch. The iron in copper smelting slag does not make its generating process iron/steel manufacture."
  required_metadata: "copper flash-smelter and source campaign; original feed and source-process boundary; separation from matte and converter slag; source-specific copper and iron and silicon and sulfur assays; relevant trace metals and precious-metal classification; copper metal versus sulfide versus oxide phases and mineralogy; fresh slag and cooling history; no historic stockpile or granulated abrasive; measured net as-released mass and free moisture; dry-assay basis and sampling uncertainty; crushing and actual particle-size distribution; receiver feed specification and temperature and contamination acceptance; lawful receiver and real copper-recovery function; upstream exchange-specific inherited burden and allocation; first-release lot and timestamp and original Q_c; opening and closing WIP vectors; gross shipments and returns and no repeat output; postrelease service horizon H; actual water circuit and wet residues and receiving media; native voltage and supply route and geography; every real package and maintenance stock and provider ownership"
  required_quality_disclosure: "Independent original source chain and allocation; no generic native grade guarantee; technical synthesis versus measured site data; original Q_c and service H; complete physical ledgers; each auxiliary UUID/provider gap and uncertainty; no automatic recovery credit"
  update_trigger: "Source furnace/feed or contamination change; new receiver or function; changed cooling/mineralogy/particle gate; revised allocation or prices; updated native restrictions; new primary evidence"
data_sources:
  - id: "jrc-nfm-bref-2017"
    type: "official_guidance"
    reference: "European Commission JRC (2017), Non-Ferrous Metals Industries BREF, EUR 28648 EN, doi:10.2760/8224, sections 3.2.2.5 and 3.3.3.4.1, printed pp. 241 and 283–285. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2020-01/JRC107041_NFM_bref2017.pdf"
    used_for: "Copper-smelting residue distinctions; slow cooling/crushing/drainage and real concentrator receivers; adjacent thermal and downstream flotation routes. Case compositions and consumptions are not universal requirements or allocation factors."
  - id: "epa-slag-reprocessing-1994"
    type: "official_guidance"
    reference: "US EPA (April 1994), Innovative Methods of Managing Environmental Releases at Mine Sites, OSW 530-R-94-012, section 3.1, printed pp. 25–32. https://archive.epa.gov/epawaste/nonhaz/industrial/special/web/pdf/innovate.pdf"
    used_for: "San Manuel original flash-slag formation and distinct converter/historic counterexamples; cooling/crushing-to-concentrator handover; water, maintenance and contamination gaps; no fixed minimum copper content or transferable recovery/ore-displacement credit. Historical case not a contemporary order."
  - id: "epa-primary-copper-1995"
    type: "official_guidance"
    reference: "US EPA, AP-42 section 12.3 Primary Copper Smelting, October 1986 reformatted January 1995, process description and Figure 12.3-1. https://www.epa.gov/sites/default/files/2020-11/documents/c12s03.pdf"
    used_for: "Original concentrate/flux-to-matte/slag formation and source-operation distinctions; upstream full source inventory requirement. No historical emission factor or furnace default imposed on the selected site."
  - id: "tms-copper-slag-services"
    type: "literature"
    reference: "TMS International, Copper Slag Services, official service description snapshot 26 October 2026. https://tmsinternational.com/Services/CopperSlag"
    used_for: "Independent industrial confirmation of molten-slag transport, slow cooling, breaking/crushing and metal recovery; proprietary accelerated cooling and separated matte are countercontexts, not a mandatory route or adopted performance claim."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC (2010), ILCD Handbook, General guide for Life Cycle Assessment — Detailed guidance, first edition March 2010, sections 7.9.2–7.9.3. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctionality: subdivision/virtual subdivision, exchange-specific determining physical causality, residual common-gate actual-state market values and transparent allocation. Methodological application to this route is author synthesis; no numerical recycling or allocation factor adopted."
  - id: "unsd-cpc30-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 Structure, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Complete 39320 definition and adjacent iron/steel and precious-metal exclusions; classification context only and no automatic methodology mapping."
