product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.wastes-or-scraps.ash-and-residue-except-from-the-manufacture-of-iron-or-steel-containing-metals-or-metal-297b5097"
  classification_refs: "CPC 3.0:39320; narrower"
  covered_products: "One fresh copper flash-smelting slag conditioned as bulk feed for a specified copper-recovery concentrator"
  excluded_products: "Exclude iron/steel-manufacturing slag and EAF dust regardless of iron content; precious-metal ash and anode slime and materials classified or supplied for a precious-metal recovery function; converter slag and mixed-furnace slag; historic dump mining; quench-granulated abrasive or construction aggregate; already floated slag concentrate and final flotation tailings; pure copper or a pure oxide; refined recovered metal; and a disposal-only service without a genuine receiving-feed function. Trace precious-metal occurrence alone does not establish an allowed class: document the actual material classification and receiver purpose without inventing a universal concentration threshold. No other non-ferrous residue is a selectable branch. The iron in copper smelting slag does not make its generating process iron/steel manufacture."
  representative_product: "Slow-cooled copper flash-smelting slag for copper recovery"
  production_route: "Verified source concentrate/flux preparation and flash smelting module; matte/slag separation; molten-slag handling; controlled slow cooling with actual air/water sequence; breaking and necessary crushing; drainage and receiver first feed release"
  market_state: "Bulk cooled crushed mixed slag at measured as-released moisture and declared receiver feed acceptance; no universal grade or recovery guaranteed"
functional_unit:
  what: "Supply of one qualified mixed copper-bearing smelting residue for actual downstream copper recovery"
  how_much: "1 kg"
  how_well: "copper flash-smelter and source campaign; original feed and source-process boundary; separation from matte and converter slag; source-specific copper and iron and silicon and sulfur assays; relevant trace metals and precious-metal classification; copper metal versus sulfide versus oxide phases and mineralogy; fresh slag and cooling history; no historic stockpile or granulated abrasive; measured net as-released mass and free moisture; dry-assay basis and sampling uncertainty; crushing and actual particle-size distribution; receiver feed specification and temperature and contamination acceptance; lawful receiver and real copper-recovery function; upstream exchange-specific inherited burden and allocation; first-release lot and timestamp and original Q_c; opening and closing WIP vectors; gross shipments and returns and no repeat output; postrelease service horizon H; actual water circuit and wet residues and receiving media; native voltage and supply route and geography; every real package and maintenance stock and provider ownership"
  how_long_or_cycle: "One unique first-release cohort; postrelease actual services use original Q_c and observed H"
  reference_flow_link: "first_release_slag"
system_boundary:
  rules:
    - rule_id: formation_history
      applies_to: "whole source chain"
      rule: "Before accepting incoming slag, verify a source formation module from burden-bearing whole copper concentrate and actual separately supplied siliceous flux through preparation/drying, flash smelting, slag/matte separation and tapped molten slag. Record the actual oxygen and combustion-air supply, each fuel, electricity, water, refractory/maintenance and startup/idle/cleanup loads; original matte and each genuine co-product; offgas transfer and actual acid/heat recovery where operated; dust return and treatment; and each postcontrol atmospheric species, wastewater and solid residue. Require raw quantities, original supply forms, source year/location, actual source output gate, allocation and an exchange-by-exchange inherited vector. Concentrate assays and carrier water are subledgers of the whole concentrate, never additional oxide/sulfide purchases. A compatible matte PCR can guide the source operation but cannot supply an unverified slag burden by subtraction or an arbitrary yield. Missing formation coverage makes a concrete dataset incomplete; purchased finished slag plus packaging is not this route."
      source_ids:
        - jrc-nfm-bref-2017
        - epa-primary-copper-1995
        - jrc-ilcd-2010
    - rule_id: conditioned_feed_gate
      applies_to: "condition"
      rule: "Include molten-slag ladle handling, controlled slow cooling, actual air/water sequence, separation of any independently identifiable matte heel, breaking, necessary primary crushing, real screening only if operated, internal conveyors/hauls, drainage and dust controls, representative sampling and receiver-specific first feed release. Use measured temperature-time and phase/particle-size evidence; no default eight-hour cooling time, crush size, copper grade, water demand or recovery is prescribed. The downstream concentrator grinding, flotation reagents, concentrate drying/resmelting and tailings are outside this reference gate. Their existence establishes receiver context, not burdens or credits in this dataset."
      source_ids:
        - jrc-nfm-bref-2017
        - epa-slag-reprocessing-1994
        - tms-copper-slag-services
    - rule_id: single_first_release
      applies_to: "condition; support"
      rule: "Q is the net as-released wet slag mass uniquely first quality-released for the declared copper-recovery receiver in the cohort. Independently weigh it, excluding transport equipment and packaging; declare free moisture and separate dry-solids/metal assays. No provisional hot transfer, rejected sample, matte heel, returned old lot, retest or dispatch creates Q. Closing released FG already belongs to Q and is not added again as manufacturing output or subtracted as unfinished WIP. Keep actual postrelease stock handling, wetting, containment, loading and dispatch in a separate service subledger for the original cohort Q_c over observed horizon H. H is not a production denominator; no speculative future service is charged. Cancel internal product/return transfers once when combining manufacturing and service modules."
      source_ids:
        - epa-slag-reprocessing-1994
        - jrc-ilcd-2010
    - rule_id: inheritance_and_failures
      applies_to: "all inventory rows"
      rule: "Keep each exchange vector for opening/closing raw material, molten/cooled unreleased WIP and unassigned supplies, and preserve lot/source history across cooling campaigns. Start attributable A_i with inherited opening burden plus real current assigned burdens and true inward transfers; subtract only still-unreleased closing/unconsumed burden and justified outward transfers. Do not repeat stock correction already applied to consumption. Include failed and zero-output lots, start/stop, idle, cleanup, sampling, wet rejects, actual rework and their treatment. Do not wash away burdens by assigning them to a removed waste. Postrelease returns preserve their original Q_c without a new production result and add only actual incremental work. Q=0 retains the full raw and inherited ledger with no unit result."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: physical_and_species
      applies_to: "all physical interfaces"
      rule: "Close unallocated gross V and independent relevant Cu/Fe/Si/S/O/H and trace-element ledgers through the source gate, conditioning, released FG/service and consolidated gate. Separately observe metal/sulfide/oxide phases, entrained matte, free and structural/reaction water, evaporation, rain, runoff, sediment, captured dust, escaped size fractions and real gas species. Cooling does not imply a fixed oxidation reaction or water uptake. One residual cannot determine two unknowns; COD/total NOx/VOC and oxide-equivalent analyses are indicators, not measured species masses. For each mixed liquid or solid exit record the whole wet stream once and a non-additive source/composition partition, with one compatible provider; do not also purchase treatment for each assay component or repeat provider-owned emissions. Integrated volumes are not multiplied by time; integrate actual rates only. A density conversion requires independently measured density of that same material at its actual conditions. No assumed steam, boiler, condensate or heat credit. Any real exported heat or supplier water return requires separate Product rows, actual mass/state/enthalpy and explicit supplier water/energy ownership before dataset completion."
      source_ids:
        - jrc-nfm-bref-2017
        - epa-slag-reprocessing-1994
        - jrc-ilcd-2010
    - rule_id: packages_assets_completeness
      applies_to: "condition; support"
      rule: "The representative route supplies bulk slag without mandatory sacks or pallets. For each package actually crossing the boundary add one atomic card and close opening empty/attached WIP/FG/reusable stock + external purchases P + first external nonpurchase physical receipts N_ext + true external returns received ER = closing corresponding stocks + packaging on gross physical shipments + outward returns + waste. P, N_ext and ER are mutually exclusive for each real receipt. N_ext includes first borrowed/leased or supplier-attached packaging when genuinely not acquired within a purchased consignment; an unitemized component actually acquired with the consignment remains P. ER requires the same component's documented prior outward dispatch. For every real first nonpurchase receipt add its specific material/form/type and actual input interface with measured raw quantity, receipt ID/time, origin, ownership and prior vector; keep physical stock V separate from procurement and attribute one actual owner/provider's burden once. Do not create a second packaging purchase, whole-load copy or credit. Internal reuse cancels and creates neither procurement, Q nor automatic co-product. For machinery, spare jaw plates and installed oil likewise retain actual physical stocks and receipts/retirements; any extra X term may remove only an exact same-side duplicate in another term. Never cancel new ingress merely because retained in stock. Attribute capital/maintenance service separately using measured use and documented lifetime or repair horizon, with sensitivity where uncertain. Add every other actual single supply, fuel, aqueous reagent, package, waste and emitted species before declaring a dataset complete; unknown is not zero or absent."
      source_ids:
        - jrc-nfm-bref-2017
        - epa-slag-reprocessing-1994
        - jrc-ilcd-2010
