product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.wastes-or-scraps.recovered-waste-and-scrap-paper-or-paperboard-of-other-paper-or-paperboard-made-mainly-9075f70c"
  classification_refs: "CPC 3.0:39242; narrower product scope. Current mapping relation and acceptance: classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs"
  covered_products: "Dry-sorted baled white unprinted uncoated woodfree industrial paper cuttings from mainly bleached chemical pulp"
  excluded_products: "Exclude unbleached kraft and corrugated-board waste; predominantly mechanical-pulp newsprint/journals; mixed white grades of unknown furnish; mass-coloured paper; printed or coated shavings; adhesive-bound, wet-strength, laminated, carbonless, thermal, waxed or contaminated paper; white board, tissue and pulp. A white surface alone proves neither bleaching nor chemical-pulp predominance. UN CPC 39242 describes furnish and absence of mass colouring; it does not make “unprinted” and “uncoated” synonyms of that condition. These are additional, narrower grade restrictions here. Record body colour, surface printing and surface coating independently."
  representative_product: "Dry-sorted baled white unprinted uncoated woodfree paper cuttings"
  production_route: "Source paper genealogy → actual cut generation → segregated capture/collection → receiving/inspection → dry sorting/removal → actual size reduction → compression/wire binding → first grade release → cohort storage/dispatch services"
  market_state: "Grade-released net paper feedstock, baled, at actual moisture; wire and container tare excluded"
functional_unit:
  what: "Supply the declared white recovered-paper grade for downstream fibre recovery"
  how_much: "1 kg reference flow"
  how_well: "Agreed unprinted uncoated non-mass-coloured woodfree grade, primarily bleached chemical pulp; measured moisture/ash/foreign material and buyer acceptance"
  how_long_or_cycle: "One traceable reporting-period first-release cohort; no assumed downstream yield or service life"
  reference_flow_link: "finished"
system_boundary:
  rules:
    - rule_id: b_origin
      applies_to: "source origin"
      rule: "Trace each lot back to an actual bleached-chemical-pulp paper supply and cutting operation. Upstream coverage includes the actual pulp formation/bleaching, furnish preparation, sheet forming, pressing, drying and finishing route through a compatible supplier dataset or separately collected upstream process. This is not a purchase-and-repack model for already graded bales. Do not invent a pulp recipe or run virgin papermaking again when its burden is already included."
      source_ids:
        - apv-white-uncoated
        - kongskilde-trim-handling
        - jrc-ilcd-2010
        - jrc-pulp-paper-bref-2015
    - rule_id: b_complete
      applies_to: "recovery and services"
      rule: "Include source capture, containers, actual inbound transport, receiving/weighing, sorting foreign materials, size reduction if used, conveying, extraction/filtering, compression, binding, testing, rejects and cleanup. Retain start/stop, idle, failure and zero-output loads. After-release storage, packaging, handling and dispatch stay in a separate cohort service ledger; attach them once to the serviced cohort, including old FG, without producing another Q. Outsourced operations need their actual service/provider inventory and no double counting of embodied utilities."
      source_ids:
        - kongskilde-trim-handling
        - hsm-cutting-scrap-baling
        - bollegraaf-paper-sorting
        - jrc-ilcd-2010
        - jrc-pulp-paper-bref-2015
    - rule_id: b_gate
      applies_to: "reference cohort"
      rule: "Q is net paper mass newly passing the first grade-release gate in the period, excluding wire, container tare and all earlier released mass. A repeat test or dispatch is not production. Closing FG from the same cohort already belongs to Q. If a release is reversed, reverse that lot once with its entire inherited vector; subsequent repeat release restores only the reversed eligible quantity. Record incremental rework separately; returns of previously supplied goods retain the original delivery/reversal link."
      source_ids:
        - rema-hws-2022
        - jrc-ilcd-2010
    - rule_id: b_recursive
      applies_to: "same-category input"
      rule: "Record external same-category cuttings once at their actual handover state with source, moisture, grade, composition and inherited upstream vector. Do not recurse into a copy of this PCR or assume zero upstream burden because a flow is called waste. Distinguish genuine waste transfer from valued cutting coproduct; apply the declared attributional convention consistently on both sides. No avoided-paper, avoided-landfill or future recycling credit is automatic."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_extend
      applies_to: "route completeness"
      rule: "The minimum cards do not authorize omissions. Add a separate atomic row for every actual extra material, formulation, packaging component, fuel, refrigerant, service and pollutant species with its receiver and basis. Confirm absence rather than assign zero to an unknown. Steam, boilers, paper wet treatment, intentional chemical modification or drying change the selected route and require additional evidence and reviewed methodology. Do not copy condensate or boiler returns into an electric dry line."
      source_ids:
        - kongskilde-trim-handling
        - hsm-cutting-scrap-baling
        - jrc-ilcd-2010
