allocation_rules:
  - rule_id: a_subdivide
    applies_to: "each exchange"
    rule: "Use attributional accounting. First collect dedicated operations separately; use virtual subdivision to assign identifiable materials, cutting loads, grade-specific cleaning, binding and service operations exclusively to the function they support. A mixed outlet may contain several separately identified grades, but the measured total and its source partitions are non-additive views of one stream with one actual provider per exchange."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_causality
    applies_to: "remaining shared exchanges"
    rule: "For each remaining shared exchange establish a determining physical causal relationship from actual equipment/operation evidence. Material embodiment, handling time/load, storage area-time or volume-time may be relevant only where they determine that particular exchange. Do not impose one mass share on every flow and do not choose between physical and economic allocation freely. Include losses and failed work in the complete unallocated inventory."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_residual
    applies_to: "unresolved common process"
    rule: "Only for the residual after those steps, use contemporaneous market values of the actual coproducts/functions at the same true joint process gate and physical condition. Derive gate values by removing subsequent grade-specific transport, conditioning and packaging. Document quantities, prices, period, currency, derivation, zero/negative values, sensitivity and conservation of 100% of every original exchange. Unknown values remain unresolved; no fixed percentage, invented positive price or automatic credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_return
    applies_to: "internal cycles and external recovery"
    rule: "Internal sorting returns and internal wire reuse cancel in consolidation and create neither new purchases nor coproduct credits. Exported paper rejects, wire and collected dust keep actual waste/product status, receiver and treatment burden. Never credit a residue merely because it may be recyclable. Preserve parent-paper/cuttings and external waste handover burden decisions and uncertainty explicitly."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_origin
      process_id: "recovery"
      flow_role: "raw_cuttings and upstream trace"
      record_type: "source/lot and unnormalized mass records"
      raw_fields: "lot; source mill/converter; furnish/bleach declaration; body colour; print; coat; cutting operation; gross/net/tare; F; opening/closing WIP; moisture; ash; inherited vector per exchange; provider; upstream dataset reference; X duplicate evidence"
      collection_method: "Link actual source-paper records and upstream process coverage to weighed cuttings; record source capture and transfer operations, shared parent-paper/cuttings burdens and all internal movements separately. Sampling/test records verify contaminants and dry matter, not appearance alone."
      unit: "kg; actual raw source units retained"
      frequency: "each lot and shift; each exception"
      temporal_coverage: "complete representative period including start/stop, idle, failure, cleanup and zero output"
      site_scope: "actual source/stage/receiver and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "source-paper declaration; calibrated scale; batch genealogy; compatible upstream inventory and allocation record"
    - protocol_id: cp_release
      process_id: "recovery"
      flow_role: "finished and stock gates"
      record_type: "first release and mass stock ledger"
      raw_fields: "lot/cohort; grade specification; test; first-release time; Q; gross V; opening/closing WIP/FG; D gross shipment; external return received/sent; release reversal; rework increment; paper moisture; wire/container tare; inherited vector for each exchange"
      collection_method: "Weigh net paper and link tests to first release, never shipping date alone. Reconcile each cohort across WIP, first release and FG movement with matched raw physical gates. Preserve all failed/rejected work and Q=0 lots. A returned/retested old lot is not new production."
      unit: "kg"
      frequency: "each lot and shift; each exception"
      temporal_coverage: "complete representative period including start/stop, idle, failure, cleanup and zero output"
      site_scope: "actual source/stage/receiver and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "grade test; buyer specification; scale/tare records; stock counts; reversal and delivery links"
    - protocol_id: cp_utilities
      process_id: "recovery"
      flow_role: "electricity; hydraulic_oil; cleaning_water"
      record_type: "separate raw meters and full-formulation stocks"
      raw_fields: "exchange id; provider; raw unit; start/end meter; integrated quantity or true rate/time; operating stage; idle/failure/cleanup; invoice; opening/closing material and machine charge; supply/top-up/drain; density/state; upstream vector; service cohort"
      collection_method: "Read actual separate meters or justified submeter allocation; retain raw kWh, litres, kg or m3 and independently measured densities before conversions. Reconcile entire bought formulation once; component assays are not purchases. Inventory shifts and post-release service loads remain distinguishable."
      unit: "kWh; MJ; litre; m3; kg; actual source unit"
      frequency: "each lot and shift; each exception"
      temporal_coverage: "complete representative period including start/stop, idle, failure, cleanup and zero output"
      site_scope: "actual source/stage/receiver and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; bills; formulation/SDS; measured density and temperature; equipment service logs"
    - protocol_id: cp_packaging
      process_id: "recovery"
      flow_role: "every actual wire movement and first non-purchase receipt; each actual extra packaging interface"
      record_type: "complete physical component receipt and stock ledger"
      raw_fields: "component; supplier; composition; tare; opening empty/attached WIP/attached FG/reusable; purchases; external return received; closing same states; attached gross outbound; external return sent; waste; internal reuse; cohort; inherited vector; P actual component procurement; N_ext first non-purchase non-return external physical receipt kg by source; ER linked prior external dispatch; receipt event ID/time/direction and actual material/form/type/condition; measured gross/tare/component kg and uncertainty; ownership/custody before/after and entrustment/loan/lease terms; linked supplied consignment; actual burden owner and provider-included scope; non-additive whole/component bridge; specific atomic external receipt row/interface"
      collection_method: "Weigh each actual wire or additional packaging component independently of paper and retain one raw external-input event per concrete material/form/type, direction and original cohort. Reconcile the complete packaging_stock equation opening + P + N_ext + ER = closing + S + EO + W, including all empty/attached-WIP/attached-FG/reusable states. Record first supplier-attached, entrusted, borrowed or leased non-purchase receipts as N_ext, not fictitious purchases or returns. Each actual N_ext must have a specifically identified atomic physical receipt row/interface and measured quantity; add that interface where existing purchase/true-return rows do not cover the event before claiming concrete-inventory completeness. Do not add only a prose symbol or copy the procurement inventory. Keep physical receipts separate from inherited and actual supply/incremental-service burden, owned once under the recorded provider boundary. Whole-consignment/component views are non-additive; internal transfers/reuse cancel without new purchase, paper Q or credit."
      unit: "kg"
      frequency: "each lot and shift; each exception"
      temporal_coverage: "complete representative period including start/stop, idle, failure, cleanup and zero output"
      site_scope: "actual source/stage/receiver and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "component scale; stock and gross dispatch tare; purchase/delivery/entrustment/loan/lease/return records; prior external dispatch; waste receiver; ownership and provider/vector bridge"
    - protocol_id: cp_exits
      process_id: "recovery"
      flow_role: "each rejected material and waste exit"
      record_type: "atomic exit and treatment records"
      raw_fields: "row/material; actual type; lot; weight; moisture/ash; origin; receiver; destination; treatment; internal return; outgoing total; source partition; one provider; inherited burden; sampling/density state"
      collection_method: "Weigh each material separately; identify waste/product status and actual receiver/treatment. Keep total outlet and source partitions as reconciled non-additive views. Obtain actual effluent quantity and analyses; keep pollutant indicators distinct from species. Do not duplicate retained dust as an emission."
      unit: "kg; raw volume and measured density when used"
      frequency: "each lot and shift; each exception"
      temporal_coverage: "complete representative period including start/stop, idle, failure, cleanup and zero output"
      site_scope: "actual source/stage/receiver and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale; waste ticket; licensed receiver; sampling/analysis; treatment contract; source partitions"
    - protocol_id: cp_emissions
      process_id: "recovery"
      flow_role: "pm_air; water_vapour"
      record_type: "separate actual air/phase-transfer measurements"
      raw_fields: "species/particle fraction; medium; control; concentration; matched integrated gas volume; true rate/time if any; temperature; pressure; dry/wet basis; moisture inflow/outflow; uncertainty; retained dust separately"
      collection_method: "Use actual monitored concentration and corresponding integrated volume, or integrate a true rate once; measure water phase-transfer independently. Do not multiply integrated volume by time again. Document actual species and exhaust/control; no assumed combustion or generic VOC-to-species conversion."
      unit: "kg; raw mg/m3; integrated m3; true rate/time if used"
      frequency: "each lot and shift; each exception"
      temporal_coverage: "complete representative period including start/stop, idle, failure, cleanup and zero output"
      site_scope: "actual source/stage/receiver and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "monitor report; sampling/time/state alignment; moisture tests; calibration; uncertainty"
    - protocol_id: cp_transfer
      process_id: "recovery"
      flow_role: "road_transfer"
      record_type: "raw freight service activity"
      raw_fields: "paper lot; origin/destination; actual distance; net load kg; vehicle/fuel; volume constraint; empty legs; provider; raw unit; cohort; supplier inventory boundary"
      collection_method: "Derive raw tkm from actual weighbridge net load and route distance (kg × km / 1000); this is unit/activity conversion, not division by Q. Attribute empty legs by the actual determining time/load/volume relation. Complete contracted service and own-fleet fuel/emission decomposition are exclusive alternatives, preventing duplicates."
      unit: "tkm; kg; km"
      frequency: "each actual trip"
      temporal_coverage: "complete reporting period and actual returns"
      site_scope: "actual route/provider/cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge; route/distance; freight slip; vehicle/provider and inventory boundary"
  calculation_rules:
    - id: stock_physical
      applies_to: "all inventory rows"
      rule: "For each physical material and gate: opening WIP + opening FG where that gate includes FG + F + external returns received + actual other inflows = closing WIP + closing FG where applicable + gross external deliveries/returns sent + actual rejects/waste + actual emissions; cancel only proven same-side duplicates X and internal transfers. At the release gate use Q in place of the FG/delivery side, never Q plus its closing FG. For the combined gate use actual external mass movements and stock changes, not Q as an additional physical exit. V preserves the gross weighed movement history."
      inputs:
        - "opening stocks"
        - "closing stocks"
        - F
        - "external movements"
        - X
        - cp_origin
        - cp_release
        - cp_exits
        - cp_emissions
      output: "reconciled gross V and each material gate"
      source_ids:
        - jrc-ilcd-2010
    - id: burden_vector
      applies_to: "all inventory rows"
      rule: "For every exchange j separately, retain opening-WIP vector plus attributable current raw burden plus eligible externally inherited burden, less closing-WIP inherited vector, with internal transfers cancelled, to obtain the first-release cohort vector. Preserve a separate old/new FG cohort service vector and return/reversal links. Do not erase failed/idle/cleanup loads or charge historical old-FG production to current Q; do not pool electricity, oil and other units into one scalar."
      inputs:
        - "exchange j"
        - "raw quantities"
        - "allocation records"
        - "opening vectors"
        - "closing vectors"
        - "external inherited vectors"
        - cp_origin
        - cp_release
        - cp_utilities
        - cp_transfer
      output: "attributable raw A for each exchange and cohort"
      source_ids:
        - jrc-ilcd-2010
    - id: packaging_stock
      applies_to: "each actual packaging component and atomic receipt/shipment/return/waste interface"
      rule: "For each wire or other actual packaging component: opening empty + opening attached WIP + opening attached FG + opening reusable + purchases P + first non-purchase external physical receipts N_ext + actual external returns received ER = closing empty + closing attached WIP + closing attached FG + closing reusable + component on gross physical outward shipments S + external returns sent EO + waste W. P is genuine component procurement, including a component actually purchased within a whole consignment only as a non-additive share. N_ext is the actual first non-return external physical receipt without component procurement, including supplier-attached, first entrusted, borrowed or leased components. ER requires a linked prior external dispatch and true return. P/N_ext/ER are mutually exclusive event partitions; opening is physically present at period start, not a current receipt. Match N_ext once to actual other inflows at the same stock_physical gate, retaining non-additive whole/component bridges. Physical receipt is independent of burden ownership: retain eligible inherited vectors and actual new supply/incremental service once; upstream-included or already owned manufacture is not purchased again and no zero burden is presumed. Internal transfers/reuse cancel; paper net Q excludes all components."
      inputs:
        - "component stock by state"
        - P
        - N_ext
        - ER
        - S
        - EO
        - W
        - "actual receipt and ownership records"
        - "whole/component bridge"
        - cp_packaging
      output: "reconciled component physical stock and separately attributed once-owned supply/service burden"
      source_ids:
        - hsm-cutting-scrap-baling
        - jrc-ilcd-2010
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "q = A / Q; A = attributable raw exchange amount after unit conversion and allocation; Q = newly first-grade-released net paper mass in kg. For Q=0 retain A without a unit result."
      inputs:
        - A
        - Q
        - cp_release
      output: "q per 1 kg reference flow"
      source_ids:
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each source and product lot"
      requirement: "Demonstrate pulp/body-colour/print/coating compatibility and actual grade; maintain chain of custody and no blending with unknown white grades."
      evidence: "mill furnish record; grade test; lot genealogy"
    - id: dq_measurement
      applies_to: "all inventory rows"
      requirement: "Calibration, raw-unit preservation, actual density/state, uncertainty, source-specific timing and physical mass/solids/water closure; quantities are future collection requirements, not invented values."
      evidence: "scale/meter/test and balance evidence"
    - id: dq_inheritance
      applies_to: "all inventory rows"
      requirement: "Preserve every opening/closing WIP/FG exchange vector, actual services, Q=0 loads, reversal and incremental rework. Do not cherry-pick successful batches or substitute shipping mass for Q."
      evidence: "raw lot ledgers; cohort vector bridge; return and stock counts"
    - id: dq_scope
      applies_to: "all inventory rows"
      requirement: "State geographical/temporal/technological representativeness, upstream allocation, single provider, receiving treatment and missing identities. No numeric source extrapolation from another grade, factory or deinking route."
      evidence: "supplier/treatment contracts; coverage review; source applicability"
validation_rules:
  - rule_id: v_identity
    applies_to: "product and flow"
    rule: "Check all required qualifiers and every adopted native Flow restriction against actual supply. Product/waste/elementary type, all name facets, synonyms, comments, CAS if present, route, grade, form, geography, medium and complete properties must agree. Generic UUID identity never establishes supplier compatibility, emission factors or scientific approval. Use the exact reference property and actual reference unit; missing auxiliary UUIDs require precise names and tracked review."
    source_ids:
      - un-cpc-2025
      - rema-hws-2022
  - rule_id: v_mass
    applies_to: "each physical gate"
    rule: "Close independent as-is total-mass, dry-solids and water ledgers at source capture, recovery release, FG and consolidated gates, using the same material scope and inventories. Track paper fibre, filler/ash and actual foreign material independently when relevant. Investigate residuals and uncertainty; never infer two unknown exits from one residual, impose a yield, use COD/VOC as species mass or treat humidity change as chemical reaction."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_quantity
    applies_to: "Q and normalization"
    rule: "Reconcile gross V, first-release Q, WIP/FG inheritance, failures, services and all reversals before normalization. Apply normalize_exchange once to each attributable raw A only when Q is positive. For Q=0 retain actual amounts, exchange vectors and cause with no unit result. Cards and aggregation refer to that same calculation; a second denominator or dividing an already normalized input is an error."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_pack
    applies_to: "each packaging component"
    rule: "Apply packaging_stock over the same physical gate: full opening + P + N_ext + ER = full closing + S + EO + W for each component, with empty/attached-WIP/attached-FG/reusable stocks intact. Verify actual first non-purchase receipts, disjoint source partitions, prior-dispatch evidence for ER, measured component quantity and its atomic external-input interface, ownership/history and non-additive whole/component links. Missing actual receipt quantity/interface is a completeness gap, never zero or an invented purchase/return. Match gross shipment/tare and actual destinations; internal reuse/transfers cancel. Retain inherited and actual supply/incremental-service burden once without recharging included manufacture; no paper Q or credit is created."
    source_ids:
      - hsm-cutting-scrap-baling
      - rema-hws-2022
  - rule_id: v_completeness
    applies_to: "whole period"
    rule: "Verify every actual atomic exchange, raw unit, source, treatment receiver, formula input/output and collection record including zero-output shifts. Reconcile meters, bills, scales, lot genealogy and independent quality tests; disclose excluded capital/infrastructure, truncations, uncertainty and unresolved coverage. A check passing does not approve methodology, translation, mapping or publication."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after the dataset’s own review"
  downstream_use: "Input grade-qualified dry recovered paper into explicitly modelled downstream fibre recovery; keep downstream pulping separate"
  allowed_use: "Compatible dry white unprinted uncoated woodfree cuttings with actual inherited burdens and moisture; attributional inventory"
  excluded_use: "All-CPC-leaf average; OCC/newsprint/coloured/printed/coated/tissue/board blends; deinked pulp; universal virgin displacement or recovery credit"
  required_metadata: "All §3 qualifiers; actual lot/route/provider and first-release Q; dataset system boundary; physical stock and per-exchange inheritance; post-release services; receivers; uncertainty"
  required_quality_disclosure: "Measured coverage and exclusions; raw-to-q audit; upstream and allocation decisions; unresolved UUIDs; native restrictions; review status"
  update_trigger: "Changed source furnish/grade, body colour/print/coating, recovery equipment, utility supply, handover/allocation, grade acceptance or stock/return model"
data_sources:
  - id: "un-cpc-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Ver.3.0 Explanatory Notes, 30 June 2025, pp.145–147 and 201–202. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Furnish/body-colour classification and neighbouring recovered-paper/pulp boundaries; not grade yield or recipe."
  - id: "rema-hws-2022"
    type: "standard"
    reference: "ReMA ISRI Specifications, Hard White Shavings (HWS), item 30, effective 14 July 2022; full terms and definitions context. https://www.isrispecs.org/orpheus_resource/hard-white-shavings-hws/"
    used_for: "Representative unprinted untreated white groundwood-free recovery grade, agreed grade and packing/quantity records; numerical limits only when the actual transaction adopts that edition."
  - id: "apv-white-uncoated"
    type: "extension_guidance"
    reference: "APV Germany, WFU wood-free uncoated white, publisher page. https://www.apv.de/en/PaperCatalog/WFU"
    used_for: "Concrete white uncoated paper based on bleached hardwood/softwood sulphate pulp; qualitative source-paper supply form only, not a current-source or recipe claim."
  - id: "kongskilde-trim-handling"
    type: "extension_guidance"
    reference: "Kongskilde Industries, Trim Handling System. https://kongskilde-industries.com/industrial/usa/applications/trim-handling-systems/"
    used_for: "Cut generation, pneumatic capture/conveying, actual cutter/separator inclusion; no universal energy or dust factor."
  - id: "hsm-cutting-scrap-baling"
    type: "extension_guidance"
    reference: "HSM, Efficient solutions for disposal and recycling in the printing and packaging industry. https://uk.hsm.eu/en/compressing/industry/packaging-industry"
    used_for: "Cutting scrap collection, channel compression, wire binding and actual loading choices; no fixed wire count, density or yield imposed."
  - id: "bollegraaf-paper-sorting"
    type: "extension_guidance"
    reference: "Bollegraaf, Paper and cardboard waste. https://www.bollegraaf.com/solutions/paper-and-cardboard-waste/"
    used_for: "Separate unwanted material/grades before baled supply; mixed paper and OCC examples are countercontext, not authorisation to blend this grade."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for Life Cycle Assessment—Detailed guidance, first edition March 2010, §§7.9.2–7.9.3 (pp.255–272). https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision, exchange-specific determining physical causality, residual same-gate/condition market values and conservation; no industrial recipe, fixed share or automatic recycling credit."
  - id: "jrc-pulp-paper-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Production of Pulp, Paper and Board (2015), §§6.1.1–6.1.2 and 7.1.1–7.1.2, printed pp.550–552 and 660–663. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "Source-paper formation and dry sorting/bale handover; wet pulping, paper-machine drying, steam and heat recovery as adjacent countercontext; no default recipe/amount."
