system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "peat_tar_recovery"
      rule: "Include receipt, feed drying, retort startup/heating, vapor handling, condensation, phase separation, acceptance, storage and pumping. Document actual equipment equivalence to the historical route; do not assume modern prevalence."
      source_ids:
        - usgs-peat-retort-1910
    - rule_id: boundary_phase
      applies_to: "all outputs"
      rule: "Keep recovered organic tar, separately removed aqueous phase, coke and gas distinct. Condensate entrainment/dissolved organics and actual losses stay in physical ledgers. Further tar refining or wastewater treatment needs added complete units before coverage claims."
      source_ids:
        - usgs-peat-retort-1910
        - suo-peat-pyrolysis-1987
    - rule_id: boundary_fuel_return
      applies_to: "peat_tar_recovery; accepted_peat_tar"
      rule: "Separate gross recovered tar into boundary-crossing accepted reference tar, internal coking fuel, waste/rework and stock. Internal tar firing belongs to the joint process with measured fuel/air and actual species, heat, water and residue ledgers; it creates no Q or export credit. A separately bounded receiving unit requires measured two-end handover, operator/ownership/responsibility and carried-burden evidence. Never omit actual firing by moving a paper gate; do not infer sale, preparation, grade or combustion factors from the historical report."
      source_ids:
        - minnesota-peat-tar-fuel-1981
    - rule_id: boundary_land
      applies_to: "peat_feed"
      rule: "Retain deposit, drainage dates, water table, land occupation, extracted carbon, continuing CO2/CH4/N2O/waterborne carbon and restoration interfaces with compatible upstream datasets. No automatic carbon neutrality, instant oxidation of all extracted peat or restoration credit."
      source_ids: []
    - rule_id: boundary_utilities
      applies_to: "support exchanges"
      rule: "Record actual purchased water separately from any direct abstraction in its real medium. Preserve gas returned to firing, purchased fuel, export and flaring as mutually exclusive branches. Add each actual cleaning, packaging, maintenance and infrastructure exchange or justify a disclosed burden cut-off without deleting physical balances."
      source_ids: []
