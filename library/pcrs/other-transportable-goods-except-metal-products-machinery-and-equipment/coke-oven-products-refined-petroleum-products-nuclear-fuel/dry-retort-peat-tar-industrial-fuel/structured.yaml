      raw_fields: "outlet/leak/tank; hours/state; flow T/P/wet-dry/O2; species/concentration; NOx convention; PM definition; inlet O2/N2/CO2/humidity; origin fractions; limits; controls"
      collection_method: "Species-specific validated tests with matched actual gas flow and operating hours; include tank breathing and startup; measure inlet/ingress air for balances; retain nondetect limits and unknown origin."
      unit: "kg"
      frequency: "Representative operating-state tests and continuous activity logs"
      temporal_coverage: "Complete declared campaign and cohort lifetime services"
      site_scope: "Same site gate plus explicitly linked upstream/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "QA, calibration, raw tests, limits, coverage and origin tracing"
