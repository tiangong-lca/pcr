      collection_method: "Weigh solids/liquids, validate tank conversions and meter gas with measured same-state composition; sample every relevant phase and verify both transfer ends."
      unit: "kg"
      frequency: "Each lot plus continuous gas logs"
      temporal_coverage: "Complete declared campaign and cohort lifetime services"
      site_scope: "Same site gate plus explicitly linked upstream/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, samples, receiving receipts and mass/element residual uncertainty"
    - protocol_id: cp_energy
      process_id: "peat_tar_recovery"
      flow_role: "each utility and internal gas/tar service"
      record_type: "Meters/provider definitions"
      raw_fields: "kWh; service/duty; fuel m3/T/absolute P/wet-dry/Z/composition/NCV; steam kg/P/supply-return enthalpy; internal tar kg/water/composition/calorific test and firing duty; startup; old/new cohort duty; provider/year/route"
      collection_method: "Dedicated calibrated meters or documented causal shared-meter drivers; reconcile invoices to process use and retained/exported internal gas and tar without double credits."
      unit: "kWh; m3; kg; MJ"
      frequency: "Continuous metering; monthly reconciliation"
      temporal_coverage: "Complete declared campaign and cohort lifetime services"
      site_scope: "Same site gate plus explicitly linked upstream/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, invoice, duty logs and provider compatibility"
    - protocol_id: cp_water
      process_id: "peat_tar_recovery"
