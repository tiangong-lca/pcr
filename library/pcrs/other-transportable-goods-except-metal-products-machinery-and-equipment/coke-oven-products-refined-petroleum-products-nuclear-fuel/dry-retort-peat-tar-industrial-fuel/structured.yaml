      record_type: "Calibrated scale/tank and acceptance ledger"
      raw_fields: "lot/cohort; first-acceptance date; gross/tare/net kg; water/solids; density/T; calorific test/basis; fuel receiver/specification; handover point/operator/ownership/responsibility; measured two-end transfer; internal fuel and reserved stocks; new qualifying dispatch/closing FG; opening FG; returns/retests; rejects; inherited burden vector"
      collection_method: "Calibrated net weighing or traceable same-state volume × density; water-specific representative sampling and actual fuel acceptance/test documents; unique lot reconciliation."
      unit: "kg"
      frequency: "Each first acceptance and stock/return transaction"
      temporal_coverage: "Complete declared campaign and cohort lifetime services"
      site_scope: "Same site gate plus explicitly linked upstream/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, tank tables, sample chain, receiving-user acceptance and unique lot proof"
    - protocol_id: cp_material
      process_id: "peat_tar_recovery"
      flow_role: "each solid/liquid/gas branch"
