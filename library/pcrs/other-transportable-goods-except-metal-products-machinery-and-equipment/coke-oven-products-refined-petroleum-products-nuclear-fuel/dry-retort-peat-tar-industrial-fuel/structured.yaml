measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated net weighing or validated tank mass from same-state volume and density under cp_acceptance. One reference output is 1 kg. Retain raw and allocated records separately."
  - id: phase_water
    applies_to: "peat_feed; accepted_peat_tar; aqueous_condensate"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use water-specific, matrix-valid testing for each phase. Dry matter = wet mass × (1 − measured water fraction). Tar drying loss includes organic volatiles and is not water; no density or water default."
  - id: energy_state
    applies_to: "electricity; natural_gas; steam"
    required_property_ref:
      name: "Energy; Mass; Volume"
      uuid: ""
    required_unit: "MJ; kg; m3"
    rule: "Record kWh separately; kWh × 3.6 = MJ. Gas volume needs actual T, absolute P, wet/dry and compressibility; steam needs mass and supply/return enthalpy. No nominal calorific value conversion."
  - id: species_mass
    applies_to: "air emissions"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain each actual species and receiving medium. Carbon, nitrogen and sulfur analysis cannot stand for CO2, NOx or SO2 emission quantities; distinguish NOx convention and nondetect limits."
