allocation_rules:
  - rule_id: allocation_physical
    applies_to: "all outputs"
    rule: "Preserve unallocated wet/dry physical mass, water, C/H/O/N/S, mineral and energy ledgers before any burden allocation. Coke, gas, aqueous phase, tar, residues and stocks remain actual quantities; allocation never changes physical output or elemental mass."
    source_ids:
      - usgs-peat-retort-1910
      - suo-peat-pyrolysis-1987
  - rule_id: allocation_hierarchy
    applies_to: "shared burden pools"
    rule: "PCR policy adapts the GHG Product Standard subdivision/physical/economic concepts to LCI without claiming full standard conformity. Subdivide separately metered tar recovery/acceptance/storage services. Allocate residual shared burdens by a demonstrated causal physical driver; if unavailable use a justified explicit economic scenario with actual quantities/net gate values, matched period, uncertainty and sensitivity. No universal mass, heat-content or economic share."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: allocation_destinations
    applies_to: "peat_tar_recovery"
    rule: "Use receiver contracts and acceptance to distinguish co-product from waste. Treatment fees are burdens, not negative sale prices creating credits. Keep retained/returned gas and tar within internal recovery, never count the same mass as external output and internal fuel. Internal tar use carries no separate co-product share or avoided-fuel credit; retain its actual joint-process burdens, emissions and heat once. No automatic substitution or avoided peat/coke/fuel credits."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: allocation_stock
    applies_to: "raw/WIP/FG and accepted cohorts"
    rule: "Retain burden vectors separately for raw stock, work in progress and finished goods, with opening, additions, transfers, losses and closing. Carry inherited burdens with old material; assign current services by causal duty and original accepted cohort. Never divide old-stock services by unrelated new production or reset burdens at acceptance."
    source_ids: []
