      quality_evidence: "Process diagram, supplier proof and documented applicability/gaps"
  calculation_rules:
    - id: cohort_rules
      applies_to: "all inventory rows"
      rule: "Q = new first-accepted qualifying boundary transfer + new first-accepted closing FG for that transfer in kg; unique lots once; exclude internal fuel and reserved stocks, old opening FG/deliveries, returns/retests, rejects and WIP. Carry raw/WIP/FG burden vectors and later cohort services as described above; Q > 0 is required."
      inputs:
        - cp_acceptance
        - cp_support
      output: "positive Q and stock/cohort ledger"
      source_ids: []
    - id: normalization
      applies_to: "all inventory rows"
      rule: "For the selected new cohort divide attributable reconciled exchange by positive Q; for later services divide by original positive accepted cohort quantity. Keep original physical numerators separate from allocated burden numerators. Reference tar is 1 kg; missing/zero denominator is raw/inconclusive."
      inputs:
        - cp_acceptance
        - cp_material
        - cp_energy
        - cp_water
        - cp_air
        - cp_support
      output: "per 1 kg reference flow"
      source_ids: []
    - id: phase_balance
      applies_to: "all physical branches"
      rule: "Mass input + opening physical stock − outputs − closing stock = measured residual; include inlet air, fuel, water and reaction interfaces. Independently reconcile C/H/O/N/S, minerals and energy with actual phase analyses and uncertainty. Residual is not an invented emission or automatic closure."
      inputs:
        - cp_material
        - cp_water
        - cp_air
        - cp_energy
      output: "unallocated phase/element/energy residuals"
      source_ids:
        - suo-peat-pyrolysis-1987
    - id: burden_split
      applies_to: "shared burden pools"
      rule: "For each shared burden pool apply only justified shares summing to one after subdivision; record each driver and uncertainty. Economic scenario share = measured accepted co-product quantity × matched net gate price divided by the sum for eligible products; nonpositive/missing denominator remains unresolved. Physical phase quantities stay unweighted."
      inputs:
        - cp_material
        - cp_support
      output: "separate allocated burden vectors"
      source_ids:
        - ghg-product-allocation-2011
    - id: unit_conversion
      applies_to: "electricity; natural_gas; steam"
      rule: "kWh × 3.6 = MJ; tank volume × measured compatible density = kg. Gas or steam conversion requires declared provider state/enthalpy; no conversion using unrelated generic Fuel classification or secondary property coefficients."
      inputs:
        - cp_energy
        - cp_acceptance
      output: "compatible units and documented conversions"
      source_ids: []
    - id: acceptance_event_bridge
      applies_to: "all inventory rows"
      rule: "Lock Q to unique independently measured first-acceptance events. Use the two-term dispatch/closing-stock bridge only when L_new is zero; otherwise reconcile disjoint D_new, F_new_close and actual post-acceptance net exits L_new on the original acceptance basis. Retain original event Q for later losses/services and prevent internal/return/rework throughput duplication. Do not add Q as an extra external output. Unresolved event/stock evidence blocks complete normalization."
      inputs:
        - "original acceptance events"
        - "net parcel-state bridge"
        - "original cohort quantities"
      output: "auditable positive event Q and separate physical stock bridge"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "accepted_peat_tar"
      requirement: "Confirm whole peat-derived crude organic product and industrial fuel acceptance, with native mass/unit support and disclosed classification debt; no jet-fuel background."
      evidence: "cp_acceptance; cp_route"
    - id: quality_scope
      applies_to: "all inventory rows"
      requirement: "No actual utility, chemical, packaging, maintenance, waste or species exchange omitted because its UUID is unresolved. Add atomic cards and complete actual provider/receiver matching before dataset completeness."
      evidence: "cp_route; cp_support"
    - id: quality_period
      applies_to: "all inventory rows"
      requirement: "Match campaign, sample coverage, operating states, grade and cohort. Preserve raw values, calibration, uncertainty, nondetect limits and exceptions; no historical defaults."
      evidence: "cp_acceptance; cp_material; cp_energy; cp_water; cp_air"
    - id: quality_balance
      applies_to: "all outputs"
      requirement: "Keep full physical, elemental/species, allocation and raw/WIP/FG cohort ledgers separately; unexplained residuals and zero denominators prevent complete numerical results."
      evidence: "cp_material; cp_support"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Require exclusive peat, stated sealed-retort recovery endpoint, crude organic phase and actual fuel acceptance. Reject coal-only, pure-component, solid coke, combined pyrolysis-product or combustion identities."
    source_ids:
      - usgs-peat-retort-1910
      - minnesota-peat-tar-fuel-1981
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "Check the unique positive first-acceptance Q, reference output 1 kg, same basis in both languages and all protocol aggregations. Internal tar fuel/reserved stocks, old FG, returns/retests or later cohort services cannot create new accepted output. Require actual two-end transfer evidence for any separately bounded receiver; a paper split or assumed sale cannot create Q. Missing/zero Q remains raw/inconclusive."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "all physical branches"
    rule: "Require gross mass/water/element/species/energy and stock residuals with uncertainty, actual air and phase interfaces, no allocated physical outputs and no inferred universal emission or tar yield."
    source_ids:
      - suo-peat-pyrolysis-1987
  - rule_id: validate_allocation
    applies_to: "shared burden pools"
    rule: "Require explicit product/waste destinations, causal subdivision/drivers or justified economic scenario; each shared burden pool sums to unity and no default credits or negative waste-value credits."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: validate_completeness
    applies_to: "all inventory rows"
    rule: "Target methodology measurement checks do not establish a complete factory dataset. Unresolved native/provider, upstream land, species-origin, scope or denominator evidence is disclosed; no semantic TIDAS approval follows from a PCR check."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production dataset for declared accepted fuel-tar grade"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Mass-based supply of this declared peat-tar fuel intermediate with compatible provider assumptions; downstream combustion needs its own inventory"
  excluded_use: "Jet fuel; chemical-feedstock tar; refinery oils/pitch; universal energy-service equivalence; generic peat/coal lifecycle or approved methodology"
  required_metadata: "All reference qualifiers; unique cohorts/Q; route; deposit/land/upstream; actual providers/receivers; phase/state/composition; allocation and stock burden vectors; source locators"
  required_quality_disclosure: "Historical/laboratory evidence limits and reported coking-fuel-use context without presumed external sale; generic Fuel classification debt; unresolved native/provider and carbon-origin fields; exclusions; raw/inconclusive results; uncertainty; no scientific/translation approval"
  update_trigger: "Route/feed/fuel grade/phase endpoint/deposit/provider change; new measurements or evidence; resolved identity debt"
data_sources:
  - id: "usgs-peat-retort-1910"
    type: "official_guidance"
    reference: "C. A. Davis, The preparation and use of peat as fuel, USGS Bulletin 442-B (1910), printed pp.121–123 / PDF pp.21–23. https://pubs.usgs.gov/bul/442-B/report.pdf"
    used_for: "Historical peat-specific sealed retorts, tar/water recovery, joint coke/gas and internal gas heating; no modern availability, recipe, yield, price or fuel-grade defaults."
  - id: "suo-peat-pyrolysis-1987"
    type: "literature"
    reference: "Martti Aho, Pyrolysis of peat, Suo 38(5):105–110 (1987), printed pp.106,108 / PDF pp.2,4; original scanned pages. https://suo.fi/pdf/9636"
    used_for: "Independent laboratory peat-tar capture and nitrogen partition; unresolved gas composition requires phase/species uncertainty. Not a commercial fuel specification, industrial recipe, universal phase fraction or NOx factor."
  - id: "ghg-product-allocation-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), Chapter 9, printed p.63 / PDF p.65, Tables 9.1–9.2. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Subdivision and physical/economic concepts adapted as declared LCI policy; no peat-specific shares, system-expansion credit or full standard-conformity claim."
  - id: "minnesota-peat-tar-fuel-1981"
    type: "official_guidance"
    reference: "Minnesota Department of Natural Resources, Division of Minerals, Minnesota Peat Program Final Report (August 1981), printed p.37 / PDF p.45, Peat Coke, Peat Tar, and Activated Carbon; report provenance PDF pp.3,7 and references printed p.91 / PDF p.99. https://www.lrl.mn.gov/docs/pre2003/other/811543.pdf"
    used_for: "Official historical report that recovered peat-tar condensate was used as coking-process fuel in Finland and Germany. Distinct from coke and chemical refining; supports fuel role only, not external sale, current supply, exact preparation/organic-phase grade, measured combustion performance or default factors."
