      collection_method: "Meter external supplies separately; representative water-specific phase tests and humid-air flows; reconcile H/O elements, dissolved organics and actual receiver with uncertainty."
      unit: "kg"
      frequency: "Continuous meters; batch phase samples"
      temporal_coverage: "Complete declared campaign and cohort lifetime services"
      site_scope: "Same site gate plus explicitly linked upstream/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/sample methods, selective water tests and receiving proof"
    - protocol_id: cp_air
