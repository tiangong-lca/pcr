      collection_method: "Verify installed route and actual grade/fuel destination against scope; supplier land history and upstream LCI boundaries; survey all interfaces and state unresolved coverage."
      unit: "record"
      frequency: "Every route, grade, deposit or provider change"
      temporal_coverage: "Complete declared campaign and cohort lifetime services"
      site_scope: "Same site gate plus explicitly linked upstream/receiver interfaces"
