system_boundary:
  rules:
    - rule_id: boundary_complete_unit
      applies_to: "oil_supply"
      rule: "Include metering/blending, actual heating/vacuum/filtration, storage, all repeated passes, testing, rejected runs, cleaning, packaging and dispatch preparation. Record receipt, blending, conditioning and supply as separate tagged stages inside this integrated unit. Source machine performance is not a mandatory operating recipe."
      source_ids:
        - enervac-e865a
        - ergon-bht-concentrate
    - rule_id: boundary_first_acceptance
      applies_to: "reference_product"
      rule: "Q>0 is the sum of whole-oil net kg independently measured at unique first-acceptance events in the declared period, locked to the original event, lot and acceptance basis. Reconcile the same newly accepted cohort with Q = D_new + FG_new + L_new: D_new is dispatch net of linked returns, FG_new is closing accepted FG, and L_new is all other net post-acceptance destinations, including actual net returns not already located in D_new/FG_new, losses, scrap, downgrade, use and closing transfer back to rework/WIP. The destinations must be mutually exclusive, exhaustive and measured on the same original acceptance basis, with measured conversions for composition/water changes. Only evidence of zero other net destinations permits Q = D_new + FG_new. Later losses never lower Q; opening FG, purchased oil, old returns, redelivery, internal loops, repeated tests and reacceptance never create Q. Never-accepted WIP is excluded from FG_new and Q; already accepted material in closing WIP is traced in L_new without a new event."
      source_ids: []
    - rule_id: boundary_stock_vectors
      applies_to: "oil_supply"
      rule: "Maintain raw/WIP/FG masses and exchange-level inherited burden vectors separately at opening and closing; transfers move both. Withdrawals of opening stock bring their recorded inherited burdens; closing stocks retain appropriate upstream and current-stage burdens. Actual failed batches, repeated conditioning, rework and losses retain attributable loads, even when they generate no new Q. Accepted material returned to WIP keeps its original event and burden vector; reacceptance never duplicates feed or Q. Old-cohort storage/retest/return services belong to the original accepted cohort and its original accepted mass Q0. Unknown inherited vectors or original Q0 remain unknown and prohibit normalized corrections."
      source_ids: []
    - rule_id: boundary_no_downstream
      applies_to: "oil_supply"
      rule: "Upstream refining and input transport remain linked backgrounds. Transformer manufacture, onsite filling, service oxidation/reinhibition and final disposal require distinct downstream models; no default longer-life credit is granted."
      source_ids:
        - iec-mineral-insulating-2020
boundary_abstraction:
  declared_starting_condition: "Purchased fully hydrotreated naphthenic oil and whole DBPC mineral-oil concentrate at receipt; actual opening raw/WIP/FG stock, packaging and carried burden vectors"
  starting_condition_role: "Foreground blending and conditioning boundary, not a zero-burden upstream cutoff"
  product_classification_scope: "Narrow new inhibited petroleum transformer-oil category, independently assessed against current CPC3.0 residual exclusions"
  recursive_input_rule: "Internal oil recirculation is a stage transfer, not a fresh input or first acceptance. Purchased same-category oil and external returns need origin/state and inherited-burden evidence; used/recycled oil is outside this route"
  upstream_dataset_requirement: "Match each whole base oil/concentrate/utility to actual production route, gate, year, geography and amount basis; refining burdens and justified refinery coproduct allocation remain upstream"
  disclosure: "Report receipt-to-factory-gate stages, event-locked Q/Q0, complete same-basis D_new/FG_new/L_new bridge, physical and burden stocks, recirculation, returns, test/conditioning losses, source and provider limits"
