allocation_rules:
  - rule_id: allocation_trace_first
    applies_to: "oil_supply"
    rule: "Subdivide batches/stages and meter or trace recipe/utility inputs first. Shared blending/vacuum loads use evidenced causal drivers, such as actual measured batch energy and pass time. If a residual common burden needs allocation among genuinely different oil grades, document the physical relationship, its measured shares and sensitivity before use; no universal mass, price or yield coefficient is prescribed."
    source_ids: []
  - rule_id: allocation_physical_separate
    applies_to: "oil_supply"
    rule: "Close unallocated physical mass, water, oil/inhibitor constituents and energy before any environmental-burden allocation. Burden shares sum to one for the eligible outputs but do not scale away physical waste or coproduct mass. Ordinary blending has no invented chemical-reaction yield or reaction sink."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "rejected_oil"
    rule: "Waste remains a waste-service interface until actual receiver evidence establishes an independently marketable coproduct. Record recovery quantity, composition, destination and treatment inputs; grant no automatic displacement credit, zero-burden recycled oil or negative treatment amount. Internal recovered oil carries its original burdens and actual extra processing."
    source_ids: []
  - rule_id: allocation_stock_cohorts
    applies_to: "oil_supply"
    rule: "Carry each opening/closing raw/WIP/FG stock's exchange-level burden vector with its physical cohort. Allocate failure/rework, stock losses and actual acceptance-stage service to the relevant accepted cohorts using disclosed evidence. Old-cohort services augment their original cohort vector and use its original accepted mass; they do not inflate current Q or pass into the current new cohort by convenience."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "oil_supply"
      flow_role: "base_concentrate_filter_pump"
      record_type: "batch_and_stock"
      raw_fields: "whole supplied SKU/composition/CAS; supplier gate; concentrate assay/carrier; receipts; opening/closing raw stocks and burden vectors; weighed consumption; transfer/return; filter/pump charges and residual oil"
      collection_method: "Calibrated net weighing or actual matched-temperature density/volume records, supplier certificates and stage/cohort stock reconciliation; no SDS-band recipe reconstruction"
      unit: "kg"
      frequency: "Each receipt/batch/change and stock close"
      temporal_coverage: "Actual complete reporting period including failed and zero-output runs"
      site_scope: "Receipt/blend/condition stages and input supply interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations, actual recipe, stock vectors, supplier data and mass/assay closure"
    - protocol_id: cp_utility
      process_id: "oil_supply"
      flow_role: "energy_nitrogen_water"
      record_type: "meters_and_state"
      raw_fields: "electricity by stage/pass/standby; nitrogen mass/purity/T/P and provider basis; water receipt/cleaning; shared meter and burden allocation driver"
      collection_method: "Submeters and calibrated flow/mass records; reconcile electrical heating/pumping/vacuum and shared loads; measured gas-state/density conversions"
      unit: "kWh; kg"
      frequency: "Continuous or each batch/pass and stock close"
      temporal_coverage: "Same actual period with starts/stops, cleaning and failures"
      site_scope: "Actual integrated oil-supply unit and utility providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/phase records, quantity-basis compatibility and energy/water/gas balances"
    - protocol_id: cp_packaging
      process_id: "oil_supply"
      flow_role: "drum_closure"
      record_type: "supplier_and_stock"
      raw_fields: "each package component; tare; receipts/returns; reusable-unit id; actual service cycles/cleaning; opening/closing stocks and burden vectors"
      collection_method: "Weigh components separately; reconcile returnable packaging by actual cohort/cycles without default lifetime"
      unit: "kg"
      frequency: "Each packaging operation and period close"
      temporal_coverage: "Same reporting period with prior-cohort carry retained"
      site_scope: "Actual packaging/storage/dispatch stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighing, reuse/return receipts and actual stock/burden carry"
    - protocol_id: cp_acceptance
      process_id: "oil_supply"
      flow_role: "accepted_oil_and_stock"
      record_type: "cohort_release_ledger"
      raw_fields: "cohort/lot id; immutable first-acceptance event id/time; independently measured net whole kg at that event; original acceptance basis; recipe/assays; contract/standard edition; lab release; temperature/density when volume is used; net D_new and linked returns; FG_new closing accepted stock; disjoint L_new loss/scrap/downgrade/use/net-return/rework-WIP destinations; opening raw/WIP/FG; gross transfers/retests/reacceptance; actual failed/rework operations; physical/burden vectors; basis conversions/uncertainty; Q; original Q0"
      collection_method: "Calibrated net tank/scale weighing or matched-temperature volumetry at first acceptance. Lock Q to the sum of unique measured event masses, not dispatch or residual available stock. Reconcile exhaustive mutually exclusive D_new/FG_new/L_new for the same lots on the same original acceptance basis; subtract linked returns from dispatch and locate their net remaining destination once in FG_new or L_new. Retain separately actual-period external exchanges, all raw/WIP/FG stocks, paired internal transfers and original-cohort histories; gross passes and reacceptance add no Q"
      unit: "kg"
      frequency: "Each first acceptance, dispatch, return, retest, reacceptance and period stock close"
      temporal_coverage: "Same actual complete period plus original-cohort histories"
      site_scope: "Complete blend/condition/release and included factory-supply operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Actual certificates, calibration, immutable event/lot links, complete same-basis destination bridge and inherited vectors"
    - protocol_id: cp_residue
      process_id: "oil_supply"
      flow_role: "external_waste_and_recovery"
      record_type: "weighing_and_receiver"
      raw_fields: "each whole residue mass/composition/oil/water/solids; filter tare/retained oil; rejected product; pump drain; stock; receiver and treatment/recovery status"
      collection_method: "Weigh whole transfers and sample composition; reconcile treatment/recovery receipts and distinguish internal recirculation from external waste"
      unit: "kg"
      frequency: "Each waste/recovery transfer and stock close"
      temporal_coverage: "Same actual reporting period with cohort attribution"
      site_scope: "Actual separation/cleaning and external receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighing, assays, receiver evidence and no duplicate retained-oil count"
    - protocol_id: cp_emission
      process_id: "oil_supply"
      flow_role: "final_elementary_releases"
      record_type: "monitoring_and_balance"
      raw_fields: "actual water/nitrogen/oil-aerosol/each VOC species; medium/subcompartment; particle size; concentration/flow T/P/wet-dry basis; sampling duration; dissolved gas; capture/condensate; uncertainty"
      collection_method: "Paired concentration/flow monitoring integrated over actual operating periods, or independently checked oil/water/gas constituent balances; retain unknowns and detection limits"
      unit: "kg"
      frequency: "Actual monitoring program and each material operating change"
      temporal_coverage: "Same actual period including startup, vacuum passes and upsets"
      site_scope: "Actual vacuum exhaust, tanks, blending and control devices"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Species/size evidence, matched bases, control efficiency records and balanced final releases"
  calculation_rules:
    - id: accepted_once
      applies_to: "reference_product"
      rule: "Q = sum of unique independently measured whole-oil net masses at first-acceptance events in the period. Keep immutable event/lot identity and original acceptance basis; opening FG, never-accepted WIP, purchases, old returns, retests, redelivery, reacceptance and internal throughput add no Q. Reconcile Q = D_new + FG_new + L_new using acceptance_event_bridge; only independently demonstrated zero other net post-acceptance destinations permits the two-term form Q = D_new + FG_new. Losses never shrink the event denominator; preserve original accepted masses Q0 for older cohorts and their services."
      inputs:
        - cp_acceptance
      output: "Positive locked new first-acceptance mass Q and separate original-cohort Q0"
      source_ids: []
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "For each physical exchange direction i attributable to eligible accepted cohort c, report a_i,c = A_i,c / Q_c once, using actual unallocated physical numerator A_i,c and that cohort's original event-locked accepted mass Q_c. Separately report its attributed environmental-burden vector B_c / Q_c, including inherited loads once, actual failed/rework activities and genuine new services/losses within the declared scope. Old-cohort corrections retain original Q0. Neither loss nor later returns/reacceptance changes Q_c; reference_product=1 kg is an accounting coordinate, not an added external physical output. Neither vector allocation nor stock-service attribution reduces actual physical movements. Do not add raw receipts to stock-corrected consumption or duplicate carried and newly purchased burdens for the same oil. Do not divide physical coproducts by allocation shares. For Q_c=0 or unknown, retain raw numerators, stocks, vectors and unresolved attribution; do not divide, assume zero, discard failed runs or invent Q."
      inputs:
        - cp_material
        - cp_utility
        - cp_packaging
        - cp_acceptance
        - cp_residue
        - cp_emission
      output: "Exchanges per 1 kg reference flow by accepted cohort; explicit unresolved zero-output periods"
      source_ids: []
    - id: stock_and_physical
      applies_to: "oil_supply"
      rule: "For each stage and the aggregate boundary, opening mass + actual receipts/transfers in = actual transfers/dispatch out + final wastes/emissions + closing mass, with internal links cancelled only at aggregation. Include raw/WIP/FG stocks in this storage-inclusive physical boundary; use actual external dispatch and returns as gross paired records or a consistent net dispatch, never both. First acceptance Q and internal rework/reacceptance are not added external outputs. Keep these actual-period physical amounts separate from the same-acceptance-basis destination bridge, explicitly reconciling measured conversions. Reconcile oil, BHT, carrier oil, water and nitrogen subaccounts and energy separately. Blending/dehydration separates constituents without an invented reaction term. For inherited burden vectors use opening vector + attributable additions = vectors transferred out + closing vector, with actual loss/service attribution documented; a physical closure does not establish an unknown burden vector."
      inputs:
        - cp_material
        - cp_utility
        - cp_packaging
        - cp_acceptance
        - cp_residue
        - cp_emission
      output: "Physical and burden ledgers with explained residuals"
      source_ids: []
    - id: preparation_constituents
      applies_to: "inhibitor_concentrate"
      rule: "Contained BHT = measured whole concentrate mass multiplied by actual BHT mass fraction; carrier oil and other constituents use their actual measured fractions. Fractions sum to the whole preparation; these are composition subaccounts, not duplicate background purchases. Include inhibitor retained in product, WIP, removed residues and aerosol."
      inputs:
        - cp_material
        - cp_acceptance
        - cp_residue
        - cp_emission
      output: "Whole-preparation and constituent reconciliation"
      source_ids:
        - ergon-bht-concentrate
        - ergon-hyvolt-sds-2024
    - id: emission_integrate
      applies_to: "oil_mist, vented_water, vented_nitrogen"
      rule: "Integrate matching species concentrations and exhaust flows over real time on the same T/P and wet/dry basis; distinguish captured condensate/retained filter oil from final air release. Dissolved air/nitrogen and residual water are real physical inputs/outputs even where non-characterised bulk air is omitted from impact modelling. Total organic carbon needs actual speciation or explicit unresolved status, not an invented hydrocarbon identity."
      inputs:
        - cp_emission
        - cp_residue
        - cp_utility
      output: "Final emitted species and control-device transfers without duplication"
      source_ids:
        - enervac-e865a
    - id: acceptance_event_bridge
      applies_to: "all inventory rows"
      rule: "Lock Q to the sum of unique independently measured first-acceptance event masses. Check Q = D_new + FG_new + L_new with mutually exclusive exhaustive net destinations of the same cohort on its original acceptance basis: net dispatch after linked returns, closing accepted FG, and all other actual net returns/losses/scrap/downgrades/use/closing rework-WIP. Put linked returned parcels in FG_new or their actual L_new destination once, never a second generic return term. Reconcile measured water/composition/basis changes. For 100 kg first accepted, 60 kg net dispatch, 30 kg closing FG and 10 kg loss, Q=100 kg; 100 burden units/Q=1 unit/kg, whereas the incomplete 90 kg denominator gives an invalid 1.111... . The two-term bridge is valid only when all other net destinations are evidenced zero. Later losses/services retain original Q or Q0, and internal/return/rework/reacceptance throughput adds no Q or external output. Unexplained residuals remain unresolved, never zero loss or a rewritten Q."
      inputs:
        - cp_acceptance
        - "original acceptance events"
        - "same-basis net destination records"
        - "original cohort quantities"
      output: "auditable positive event Q and separate physical stock bridge"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference_product"
      requirement: "Verify whole mineral inhibited oil, actual at-plant gate and electrical principal function; preserve broad native descriptions and contrary33380 metadata rather than silently treating the tag as proof or rejection."
      evidence: "Actual native original, product/contract evidence and independent classification decision"
    - id: dq_recipe
      applies_to: "oil_supply"
      requirement: "Record actual whole recipe and supplier assays; hazard disclosure bands and source nominal concentrate strengths are not batch composition, universal recipes or production ranges."
      evidence: "Blend tickets, full composition certification and release assays"
    - id: dq_cohorts
      applies_to: "oil_supply"
      requirement: "Reconcile unique event-locked first acceptance with the complete disjoint same-basis D_new/FG_new/L_new bridge, including post-acceptance losses and actual net-return destinations. Maintain raw/WIP/FG mass and burden histories and actual failed/rework loads once; stock drawdown, retests, returns or reacceptance cannot mint new output or reduce original Q. Preserve original Q0 for old-cohort services and explicit conversion/stock gaps."
      evidence: "Immutable acceptance-event and cohort ledgers, complete net destinations, paired transfers and inherited vectors"
    - id: dq_coverage
      applies_to: "oil_supply"
      requirement: "Disclose monitoring period, loads, failed batches, missing species/provider bases, unknown opening vectors, zero-output work and measurement uncertainty. An unresolved quantity or identity is not a zero exchange."
      evidence: "Actual records and explicit gap register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference_product"
    rule: "Require one whole finished mineral-oil reference with net mass, real full Product/Mass/kg chain and declared route/gate; reject ingredient, emission, provider inventory, hard opposing family or unverified whole identity."
    source_ids: []
  - rule_id: validate_applicability
    applies_to: "oil_supply"
    rule: "Verify new petroleum origin, actual inhibited transformer function, full recipe/mineral share and agreed release standard/edition. A generic name or native33380 tag cannot settle current33390; retain actual physical/specification and principal-function evidence for independent decision."
    source_ids:
      - un-cpc3-2025
      - iec-mineral-insulating-2020
      - ergon-hyvolt-iii-2021
  - rule_id: validate_ledger
    applies_to: "oil_supply"
    rule: "Check unique first-acceptance event masses, positive finite original denominator, exhaustive mutually exclusive same-basis D_new/FG_new/L_new, measured basis conversions and original-cohort Q0 service attribution. Reject shrinking Q after losses or minting Q from opening FG, net returns, WIP transfers or reacceptance. Retain actual failed/rework loads, physical raw/WIP/FG stocks and inherited vectors, complete atomic exchanges, whole concentrate accounting and no double-normalization. Acceptance events are not additional external physical outputs. Unsupported inherited burden or unexplained bridge residual remains unresolved even when physical mass closes; zero/unknown Q supports raw records only."
    source_ids: []
  - rule_id: validate_interfaces
    applies_to: "oil_supply"
    rule: "Check stage links, actual conditioning passes, water/gas/oil constituent closure, receiver/compartment and provider quantity basis. Reject duplicate retained oil, whole concentrate plus its carrier purchase, arbitrary credits or unmeasured-zero releases."
    source_ids:
      - enervac-e865a
      - ergon-bht-concentrate
published_dataset_profile:
  dataset_role: "Foreground new inhibited mineral transformer-oil blending and conditioning dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared petroleum mineral/DBPC route and factory gate, with actual qualified inputs, release and cohort/stock data"
  excluded_use: "Entire33390; upstream refinery production represented by this foreground alone; uninhibited/recycled/ester/silicone/GTL oils; transformer lifetime benefits or downstream services"
  required_metadata: "Reference qualifiers, route, contract/grade/standard edition, full recipe, immutable event Q/Q0 and complete same-basis D_new/FG_new/L_new bridge with conversions, stock/vector histories, actual provider and treatment/emission interfaces"
  required_quality_disclosure: "Broad native scope and33380 debt, classification acceptance status, missing native auxiliary identities, source/specification/quantity limits and zero-output/stock burdens"
  update_trigger: "Feed/concentrate/assay/route/conditioning or grade change; standard/contract changes; new identity/classification evidence; material stock/provider/monitoring changes"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version3.0 Explanatory Notes,30June2025,pp154–156,333 and3331–3339. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Current principal-use lubricant definition and residual-oil exclusions; independently assessed classification, not production quantities"
  - id: "iec-mineral-insulating-2020"
    type: "standard"
    reference: "IEC60296:2020,edition5,publisher scope/description,26June2020. https://webstore.iec.ch/en/publication/61025"
    used_for: "Unused versus recycled mineral insulating-oil scope, delivered state, insulation/heat transfer and cable/capacitor exclusion; publisher abstract only, not complete numerical standard"
  - id: "ergon-hyvolt-iii-2021"
    type: "handbook"
    reference: "Ergon,HyVolt III Electrical Insulating Oil Marketing Specification,15March2021,one-page complete table/notes. https://ergonspecialtyoils.com/files/naphthenic/HyVolt%20III_English.pdf"
    used_for: "Real inhibited hydrotreated naphthenic oil and relevant contract test types; example grade specifications/typicals are not universal release or inventory values"
  - id: "ergon-hyvolt-sds-2024"
    type: "handbook"
    reference: "Ergon,HyVolt III SDS US,version21,revised26July2024,sections1,3,9. https://msds.ergon.com/files/ergon-lubes-naphthenics/2024-07-26%20SDS%20US%20-%20HYVOLT%20III.pdf"
    used_for: "Real transformer-oil hydrocarbon/BHT mixture and physical state; hazard-reporting bands and initial boiling point are not full recipe or distillation curve"
  - id: "ergon-bht-concentrate"
    type: "handbook"
    reference: "Ergon,Inhibitor Concentrate for Transformer Oils,HyVolt BHT brochure,whole-preparation specification and context,dated publisher snapshot6November2026. https://ergonspecialtyoils.com/hyvoltbht/HyVoltBHT_Brochure.pdf"
    used_for: "Commercial DBPC/mineral-oil concentrate identity and constituent accounting; no default dose, maintenance interval or lifetime credit"
  - id: "enervac-e865a"
    type: "handbook"
    reference: "ENERVAC,Transformer Oil Purifier/Degasification E865A,process description and performance qualifications,publisher snapshot6November2026. https://www.enervac.com/transformer-oil-purifier-e865a"
    used_for: "Actual vacuum dehydration/degassing/filtration technology and water/gas/particle interfaces; no mandatory site process, pass count, efficiency or energy factor"
  - id: "un-cpc2-insulating-counterevidence"
    type: "official_guidance"
    reference: "UNSD,CPC Version2 classification detail33380,Explanatory note and correspondence. https://unstats.un.org/unsd/classifications/Econ/Detail/EN/1073/33380"
    used_for: "Historical broader33380 explicitly included insulating oils; counterevidence only, the listed one-to-many CPC2-to-2.1 correspondence does not establish adoption into currentCPC3.0"
