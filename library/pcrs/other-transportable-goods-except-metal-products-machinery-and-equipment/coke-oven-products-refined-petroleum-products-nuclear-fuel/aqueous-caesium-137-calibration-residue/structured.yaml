measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use 1 kg net wet residual liquid, including its actual constituents but excluding container tare and separated solids. Independently weigh each unique first receiver-ready-release event using cp_release; lock its original wet-liquid kg and event genealogy for Q. Later moisture/composition or activity changes do not redefine that event mass."
  - id: unit_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "actual row property"
      uuid: ""
    required_unit: "row unit"
    rule: "Preserve raw quantities; 1 kWh = 3.6 MJ and 1000 Bq = 1 kBq. Volume-to-mass conversion requires independent actual same-matrix density and temperature, not a catalog value. Mass uses group 93a60a57-a4c8-11da-a746-0800200c9a66. Electricity energy group 93a60a57-a3c8-11da-a746-0800200c9a66 has MJ reference."
  - id: activity_time
    applies_to: "finished, cs_air, cs_water"
    required_property_ref:
      name: "Radioactivity"
      uuid: "93a60a56-a3c8-17da-a746-0800200c9a66"
    required_unit: "kBq"
    rule: "Keep isotope-specific activity and measurement/reference time, time zone and uncertainty. Group 93a60a57-a3c8-16da-a746-0800200c9a66 has kBq reference. Do not combine parent/daughter activity as Cs-137, infer chemical mass from activity, or invent half-life data."
  - id: one_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "actual row property"
      uuid: ""
    required_unit: "per reference flow"
    rule: "Assign raw exchange burdens and divide by original positive Q exactly once. Q = sum(m_first,e) over unique first receiver-ready-release events e in net wet-liquid kg; never infer Q from dispatch or stocks. Independently reconcile Q = D_new + FG_new + L_new on the same original event basis; only evidenced zero other post-release destinations permits D_new + FG_new. Old FG, returns, retests and re-release add no Q. For Q zero or unknown retain raw loads without a normalized result."
