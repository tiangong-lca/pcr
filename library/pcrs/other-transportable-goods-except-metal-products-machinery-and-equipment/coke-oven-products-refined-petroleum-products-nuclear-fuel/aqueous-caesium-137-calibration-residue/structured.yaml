allocation_rules:
  - rule_id: al_subdivide
    applies_to: "all inventory rows"
    rule: "Keep gross physical V separate from attributable A. Subdivide metrology use, residue-exclusive characterization/containment and common services using actual source lots, meters and duty records first."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_shared
    applies_to: "shared source and services"
    rule: "Use evidenced determining physical causality per remaining shared exchange; weights across all co-functions sum to one. Liquid mass alone does not partition calibration service. If causality is unavailable retain the exchange and document a study-consistent justified alternative and sensitivity for review; no complete quantitative claim before closure."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_residue
    applies_to: "finished"
    rule: "Do not invent a positive residue selling price or confuse a disposal-service payment with product revenue. No automatic avoided material, isotope-recovery or radioactive-decay credit. Physical waste status does not erase original source burdens."
    source_ids:
      - jrc-ilcd-2010
      - iaea-ssg45-2019
  - rule_id: al_cohort
    applies_to: "released cohorts"
    rule: "Q is the independently measured sum of unique first receiver-ready-release event wet masses in kg. Reconcile the new cohort through disjoint, exhaustive Q = D_new + FG_new + L_new on its original acceptance basis; losses, disposal, downgrading and accepted material returned to WIP remain traced in L_new, never omitted. Only when all other post-release destinations are evidenced zero may D_new + FG_new be used as a bridge. Old FG dispatch, genuine returns, retests and re-release add no Q. Later storage, failed handoff, repeat characterization and real rework correct the original cohort numerator while retaining its original Q; failed/Q0 loads are not discarded."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_source
      process_id: "residue_generation"
      flow_role: "source_solution, source_ampoule, calibration_service"
      record_type: "raw event and stock ledger"
      raw_fields: "SKU/lot/certificate; supplier; completed calibration service definition and acceptance event; raw opening/closing usable stock; actual use; no-further-use decision; HCl/water/carrier; assays; source vectors; original ampoule/lot ID and independently measured package tare; source-provider packaging coverage; package stock/return/destination and retained liquid"
      collection_method: "Trace calibrated net-mass and existing use/certificate records; preserve physical source amount separately from its function allocation. Do not manipulate material to collect PCR data."
      unit: "kg; composition; activity/time separately"
      frequency: "each lot, actual interval and stock reconciliation"
      temporal_coverage: "actual source/use/cohort period and attributable later services"
      site_scope: "declared generator, source and receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw events/stock; certificates/receiver records; uncertainty"
    - protocol_id: cp_release
      process_id: "residue_generation"
      flow_role: "finished"
      record_type: "raw event and stock ledger"
      raw_fields: "cohort and unique first-event IDs/time; independently measured original event gross/tare/net wet-liquid kg; original locked Q; source genealogy; gross dispatch and genuine returns; disjoint cut-off D_new and receiver-ready FG_new; every L_new substate including loss, disposal/scrap, downgrading, returned quarantine and accepted WIP/rework; opening old released FG and original cohort Q; pre-release WIP and Q0; actual current physical masses and separate original-event-basis conversions; receiving tests/class; assay/nuclides/activity/time/uncertainty"
      collection_method: "Use calibrated weighing and qualified characterization/receiver records to measure each first receiver-ready event once, independently of dispatch/stocks. Trace each accepted parcel to one final D_new/FG_new/L_new state on its original wet-liquid basis; keep gross return/rework histories and original Q. Reweighing, rework or renewed release never creates Q; retain unresolved destinations/conversions and keep actual physical and activity ledgers separate."
      unit: "kg; composition; timestamped kBq"
      frequency: "each lot, actual interval and stock reconciliation"
      temporal_coverage: "actual source/use/cohort period and attributable later services"
      site_scope: "declared generator, source and receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw events/stock; certificates/receiver records; uncertainty"
    - protocol_id: cp_energy
      process_id: "residue_generation"
      flow_role: "electricity"
      record_type: "raw event and stock ledger"
      raw_fields: "meter/interval; kWh/MJ; voltage/region/provider; use/characterization duty; idle/start-stop/retest/Q0; shared drivers"
      collection_method: "Read calibrated meters and matched duty logs; retain raw totals and independent attribution evidence for service/residue functions. Convert kWh to MJ once."
      unit: "MJ"
      frequency: "each lot, actual interval and stock reconciliation"
      temporal_coverage: "actual source/use/cohort period and attributable later services"
      site_scope: "declared generator, source and receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw events/stock; certificates/receiver records; uncertainty"
    - protocol_id: cp_streams
      process_id: "residue_generation"
      flow_role: "rinse_water, wipe, glass_waste, wipe_waste"
      record_type: "raw event and stock ledger"
      raw_fields: "row/quantity/composition; retained liquid; raw/WIP/FG stock; destination/receiver; species/element partitions; burden; rework/Q0"
      collection_method: "Use traceable scales, water meters and receiving records, retaining every stream once. Liquid retained on glass/wipes is not counted again in finished. Do not merge specific exchanges into a basket."
      unit: "kg; composition/activity separately"
      frequency: "each lot, actual interval and stock reconciliation"
      temporal_coverage: "actual source/use/cohort period and attributable later services"
      site_scope: "declared generator, source and receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw events/stock; certificates/receiver records; uncertainty"
    - protocol_id: cp_container
      process_id: "residue_generation"
      flow_role: "bottle_purchase, bottle_entrusted, bottle_return, bottle_dispatch, bottle_to_owner, bottle_retired"
      record_type: "raw event and stock ledger"
      raw_fields: "serial/pool; bottle/closure specification and compatibility; owner; purchase/entrustment/return/outgoing/retirement; opening/closing stock; cleaning/repair; inherited manufacture vector/use history"
      collection_method: "Reconcile each count and measured net tare; preserve owner and actual service history. Distinguish first purchased and entrusted receipts from genuine external returns. Assign manufacture over evidenced actual use, never an invented universal reuse count."
      unit: "kg; count separately"
      frequency: "each lot, actual interval and stock reconciliation"
      temporal_coverage: "actual source/use/cohort period and attributable later services"
      site_scope: "declared generator, source and receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw events/stock; certificates/receiver records; uncertainty"
    - protocol_id: cp_emissions
      process_id: "residue_generation"
      flow_role: "cs_air, cs_water, hcl_air, water_air"
      record_type: "raw event and stock ledger"
      raw_fields: "species/nuclide; final medium/submedium; matched concentration/outlet quantity intervals; load; sampling/activity/reference times; detection limits; uncertainty; nondetect policy; containment/receiver transfers"
      collection_method: "Use existing qualified monitoring and matched outlet quantities. Preserve actual activity dates and independently supported comparison-date correction. Retain nondetect bounds or missing measurement instead of inventing zero."
      unit: "kBq for Cs-137; kg for HCl/water"
      frequency: "each lot, actual interval and stock reconciliation"
      temporal_coverage: "actual source/use/cohort period and attributable later services"
      site_scope: "declared generator, source and receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw events/stock; certificates/receiver records; uncertainty"
  calculation_rules:
    - id: calc_q
      applies_to: "finished"
      rule: "Q = sum(m_first,e) over unique first receiver-ready-release events e, each independently measured in net wet-liquid kg excluding container/solids; Q > 0 for normalization. Reconcile the separate disjoint exhaustive Q = D_new + FG_new + L_new on the original event basis, including all loss, disposal, downgraded and accepted-WIP states. The two-term bridge requires every other post-release destination evidenced zero. Old FG, returns, retests and repeated release add no Q. Zero/unknown Q keeps raw loads without a unit result."
      inputs:
        - cp_release
      output: "original positive Q or explicit unavailable result"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_vectors
      applies_to: "all inventory rows"
      rule: "Retain physical V and burden A independently for each exchange. Raw consumption carries opening raw burdens plus actual receipts less closing raw burdens. Carry opening WIP vectors forward, add newly attributable loads, retain closing WIP vectors separately and assign released vectors to original cohorts. Closing released FG already belongs to its locked event cohort: do not subtract its burden again. Already-accepted material returned to WIP retains original Q and inherited vectors; re-release transfers state without new Q. Keep it distinct from never-accepted WIP and retain failed/Q0/rework services. Unknown/incompatible inherited vectors block completeness."
      inputs:
        - cp_source
        - cp_release
        - cp_energy
        - cp_streams
        - cp_container
      output: "cohort exchange numerators"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_once
      applies_to: "all inventory rows"
      rule: "Normalized exchange = original-cohort attributable exchange numerator / original positive Q in kg. Numerators retain their own units. Later services add dated corrections to that original numerator with the same original denominator; cumulative corrected results replace prior results instead of adding another product."
      inputs:
        - cp_release
        - cp_energy
        - cp_streams
        - cp_container
        - cp_emissions
      output: "exchange per 1 kg reference flow"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_material
      applies_to: "source_solution, rinse_water, finished, glass_waste, wipe_waste, water_air"
      rule: "Reconcile opening stock plus external inputs against closing stock, external outputs and evidenced transformations per material and relevant element. Whole liquid wet mass and nonadditive composition partitions are separate. Chemical species may react, while elemental closure on the declared material basis remains required; identify evidenced nuclear transmutation/daughter terms separately where relevant, without an invented decay-mass conversion. Investigate residuals and retain measurement uncertainty."
      inputs:
        - cp_source
        - cp_release
        - cp_streams
        - cp_container
        - cp_emissions
      output: "whole-material and elemental ledgers"
      source_ids:
        - nist-cs137-2019
        - iaea-ssg45-2019
    - id: calc_activity
      applies_to: "finished, cs_air, cs_water"
      rule: "Retain separate nuclide activity ledgers with actual measurement/reference dates. Compare stock/transfer activities only at an evidenced common date using applicable certificate/qualified decay method and supported nuclear data; preserve daughter identity and uncertainty. Activity loss is not missing solution mass. Do not force activity conservation across decay or invent kg-to-Bq factors."
      inputs:
        - cp_source
        - cp_release
        - cp_emissions
      output: "time-referenced activity reconciliation"
      source_ids:
        - nist-cs137-2019
        - iaea-ssg45-2019
    - id: calc_outlet
      applies_to: "cs_air, cs_water, hcl_air, water_air"
      rule: "Integrate matched concentration and outlet-quantity intervals only with compatible units and activity dates. Record actual species/final medium. Transfers to containment/receiver are distinct from direct discharge and never counted again as emissions."
      inputs:
        - cp_emissions
      output: "species/medium-specific external loads"
      source_ids:
        - iaea-ssg45-2019
    - id: acceptance_event_bridge
      applies_to: "all inventory rows"
      rule: "Lock independently measured unique first-release Q in original wet-liquid kg. At the same cut-off D_new is net externally retained accepted material after genuine returns, FG_new is on-site receiver-ready released stock, and L_new contains every other disjoint accepted-material state: losses, disposal/scrap, downgrading, returned quarantine and accepted WIP/rework. Reconcile Q = D_new + FG_new + L_new with exhaustive parcel genealogy; only evidenced zero for all L_new substates permits the two-term bridge. A returned parcel is located once, and re-release from WIP adds no Q. Keep old opening FG and original cohort Q separate. Retain actual wet-liquid/element/species/nuclide ledgers and later exchange conversions independently; event-equivalent quantities are no extra physical outputs or activity-to-mass factors. Unresolved event, state or conversion evidence blocks complete normalization. Trace original accepted-material constituents separately from measured later additions. Do not restore surviving accepted material to the original Q while also adding the same lost original water or other material in L_new."
      inputs:
        - "original acceptance events"
        - "net parcel-state bridge"
        - "original cohort quantities"
      output: "auditable positive event Q and separate physical stock bridge"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "finished"
      requirement: "Actual source genealogy, matrix assay, no-further-use decision, receiver class and tests required. Chemical purity, nuclide purity and activity are different claims. Native umbrella identity is not a site certificate."
      evidence: "Source/receiver records; NIST/IAEA scope"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "No invented mass, activity, isotope mixture, half-life or empirical amount ranges. Add missing atomic exchanges and preserve rejected/Q0/stock burdens. Missing important data prevents a complete dataset, not a zero input."
      evidence: "Raw records, calibration, reconciliation and uncertainty"
    - id: dq_provider
      applies_to: "all selected flows"
      requirement: "Check physical identity, property/unit chain and provider compatibility separately. Unresolved source-solution/container/solid-waste UUIDs remain explicit. No elementary-emission, clean-glass or generic-chemical proxy."
      evidence: "Full native/provider records and actual boundary"
validation_rules:
  - rule_id: val_reference
    applies_to: "finished"
    rule: "Require one uniquely linked 1 kg liquid output, complete qualifiers, actual class proof and whole-residue native identity. Do not substitute useful certified solution, solid waste, handling service or pure isotope emission."
    source_ids:
      - iaea-ssg45-2019
  - rule_id: val_account
    applies_to: "all inventory rows"
    rule: "Verify independent unique first receiver-ready-release wet-liquid event masses and locked original Q, plus disjoint exhaustive D_new/FG_new/L_new on the same basis with net returns, losses, disposal/scrap, downgrading and accepted WIP/rework. Reject Q inferred from dispatch or closing-FG movements. Allow a two-term reconciliation only when all other destinations are evidenced zero; keep Q measurement independent and reject repeated release as new Q. Reconcile old opening FG separately and retain original cohort Q for subsequent/failed/rework services and inherited vectors. Normalize once; zero/unknown Q or unresolved states/conversions gives no complete unit result. Check source-to-service/residue attribution and shared weights without fictitious residue value; actual material/species/nuclide balances stay independent."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: val_balances
    applies_to: "all material and emission rows"
    rule: "Verify whole-material and elemental closure separately from species transformations and time-dependent activity. Inspect liquid retained in solids, container tare, source-water double counting, actual media and nondetect uncertainty."
    source_ids:
      - nist-cs137-2019
      - iaea-ssg45-2019
  - rule_id: val_limits
    applies_to: "all inventory rows"
    rule: "No completeness or cradle-to-grave claim with missing upstream burden, attribution, class/receiver or downstream links. This environmental PCR neither certifies safety nor authorizes radioactive activities or discharge."
    source_ids:
      - iaea-ssg45-2019
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset after actual collection/qualification; background_dataset only with compatible explicit boundary"
  downstream_use: "Same documented Cs-137 aqueous-residue route linked to compatible receiving management"
  allowed_use: "Physical generator-to-handoff residue inventory with metrology co-function explicit"
  excluded_use: "Dose, safety or legal compliance decisions; nuclear procedures; treatment performance; saleability/clearance; other nuclides/forms; full CPC coverage"
  required_metadata: "source lot/certified-solution genealogy; actual CsCl/HCl/water/stable-carrier composition and independent chemical-assay limits; original civil use and no-further-use decision; actual nuclides/impurities and detection limits; receiving category with its actual definitions and acceptance tests; net wet-liquid mass excluding containers/solids; independently measured unique first receiver-ready-release wet-liquid event masses with locked original Q in kg plus event IDs/genealogy and disjoint same-basis D_new/FG_new/L_new covering net returns/losses/disposal/downgrading/accepted WIP; activity measurement time/comparison date/time zone/uncertainty and supported decay method; raw/WIP/FG opening/closing stocks and inherited per-exchange vectors; usable retained solution; rejected/Q0/rework loads; metrology co-function and exchange-specific allocation; actual container compatibility/ownership/all returns/retirement; matched source providers and original burden boundary; actual environmental media/species/nondetect policy and later-service corrections"
  required_quality_disclosure: "Unresolved nonreference identities/providers; allocation and uncertainty; stock/Q0/return corrections; actual class and monitoring limits; excluded downstream stages"
  update_trigger: "Source matrix, isotope impurities, route, receiver/class, Q convention, container or monitoring/provider boundary changes"
data_sources:
  - id: "nist-cs137-2019"
    type: "official_guidance"
    reference: "NIST SRM 4233f Cesium-137 Radioactivity Standard Certificate, 25 October 2019, pp.1–2 Tables1–2 and footnotes; https://tsapps.nist.gov/srmext/certificates/4233f.pdf"
    used_for: "Actual parent solution; activity versus chemical information/reference time; historical SKU values are not residue defaults"
  - id: "ezag-single-solutions"
    type: "handbook"
    reference: "Eckert & Ziegler Single Nuclide Solutions; retained snapshot 13 October 2026; Nuclitec Accuracy/Purity/Packaging/Carrier and complete Cs-137 entries; https://www.ezag.com/products/isotope-products/isotrak-calibration-sources/standardized-solutions/calibrated-solutions/single-nuclide-solutions/"
    used_for: "Independent producer countercontext: different matrix/containers, chemical purity not certified; no formulation, amount or procedure transferred"
  - id: "iaea-ssg45-2019"
    type: "official_guidance"
    reference: "IAEA Safety Standards SSG-45, 2019, §§1.4,4.15–4.17,4.31–4.32,4.42–4.43; printed pp.2,33,37,40–41; https://www-pub.iaea.org/MTCD/publications/PDF/PUB1758_web.pdf"
    used_for: "Aqueous-waste origins, characterization/segregation/container/receiving context; no classification threshold, operating parameter or authorization"
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA—Detailed guidance, first edition March 2010, §§7.9.2–7.9.3, printed pp.255–257; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision and determining causality only; no radioactive-residue allocation coefficient"
