allocation_rules:
  - rule_id: allocation_parent
    applies_to: "raw_gas; raw_condensate"
    rule: "Obtain refinery-parent off-gas/liquid burden and allocation evidence; retain full physical coproduct outputs including own use. Residual naming, own use or avoided flaring cannot establish zero burden or substitution credit."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_services
    applies_to: "supply"
    rule: "Attribute dedicated services using separate meters and process subdivision first; justify residual common-service allocation with measured drivers. Where a relevant physical causal relationship is unestablished, retain review and scenario sensitivity, without universal mass, heating-value or price shares."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_service_account
    applies_to: "supply"
    rule: "Keep compression, steam, cooling, treatment, loading, storage, container cleaning/maintenance, return and retest service vectors separate. Subdivide new production and each old accepted cohort before justified residual allocation. Attach inherited and later services to their original accepted cohort and original Q/volume basis, preserving the previous vector rather than replacing it. Unknown/zero original Q retains raw service totals without division; no reassignment to current Q, repeated product or automatic return credit."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_ledgers
    applies_to: "all inventory rows"
    rule: "Keep conserved physical gas/liquid/solid products, own use, flare, waste and stocks separate from attributed environmental burdens. Attribute burdens using justified allocation before dividing by total first-accepted dry-gas output Q; physical coproduct rows use full totals over the same original-cohort Q denominator, without mechanical multiplication by an environmental share."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_feed
      process_id: "supply"
      flow_role: "raw_gas; raw_condensate"
      record_type: "Feed/source ledger"
      raw_fields: "flow/mass; T/P; wet/dry; compressibility; density; species composition; gas/liquid entrainment; source units; parent burden"
      collection_method: "Calibrated metering and synchronized sampling, reconciled to source records; no typical-composition substitution."
      unit: "kg; m3; MJ; kWh; composition"
      frequency: "Per batch/continuous and each event"
      temporal_coverage: "Same representative period, including startup/shutdown"
      site_scope: "Declared gas plant and all handover points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; synchronized samples; handover; provenance; completeness; balances/uncertainty"
    - protocol_id: cp_delivery
      process_id: "supply"
      flow_role: "reference_gas"
      record_type: "Unique first-acceptance ledger"
      raw_fields: "unique event/cohort id; first acceptance date/specification and independently measured locked dry volume; original composition/T/P/moisture/Z; gross new dispatch and linked returns; D_new; FG_new; each L_new loss/vent/flare/scrap/downgrade/net-return/rework-WIP destination; opening/closing accepted finished gas/linepack; purchased FG; pre-acceptance WIP/rejects; prior-event links for return/retest/reacceptance; own-use/export/service branches; raw meter volumes/states; independently measured mass/density/species; later composition/phase changes and additions; NCV/GCV and basis"
      collection_method: "Meter the actual first acceptance/storage/header handover independently of dispatch/invoice and deduplicate event ids. Reconcile original events to exhaustive net destinations using acceptance_event_bridge. Convert same-mixture gas state with gas_state_conversion only within its scope; retain moisture/condensate and use measured mass/species/phase mapping for later changes. Paired gross transfers and linked returns remain auditable; no change of Q to force closure"
      unit: "kg; m3; MJ; composition"
      frequency: "Per handover/batch/continuous and event"
      temporal_coverage: "Same representative period including opening/closing stocks and original-cohort history"
      site_scope: "Declared gas-plant usage/storage acceptance gates and all destinations"
      aggregation_rule: "Q = sum of unique first-acceptance dry volumes; verify Q = D_new + FG_new + L_new on the locked original basis; two-term bridge only with evidenced absence of all other destinations; no new Q from opening/purchased FG or reacceptance; positive-known Q only"
      quality_evidence: "Acceptance/specification records; paired meters; complete destination and return records; original state/composition/Z and mass/species evidence; unique cohort register; reconciliation"
    - protocol_id: cp_utilities
      process_id: "supply"
      flow_role: "electricity; steam; water; natural_gas; condensate_return"
      record_type: "Utility ledger"
      raw_fields: "dedicated meters; energy provider; voltage; steam supply/return state/enthalpy/mass; water source; natural-gas m3 definition; own fuel"
      collection_method: "Collect calibrated meters and provider basis at each interface; unknown heat/gas compatibility remains pending; shared meters are not repeated."
      unit: "kg; m3; MJ; kWh; composition"
      frequency: "Per batch/continuous and each event"
      temporal_coverage: "Same representative period, including startup/shutdown"
      site_scope: "Declared gas plant and all handover points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; synchronized samples; handover; provenance; completeness; balances/uncertainty"
    - protocol_id: cp_materials
      process_id: "supply"
      flow_role: "mdea; nitrogen; absorbent"
      record_type: "Material/formulation ledger"
      raw_fields: "actual grade/CAS/concentration; active component; solution water; fresh makeup; circulation; stocks; provider"
      collection_method: "Collect purchase/issue/formulation/analysis records; separate circulation from makeup; add every additive as its own atomic row."
      unit: "kg; m3; MJ; kWh; composition"
      frequency: "Per batch/continuous and each event"
      temporal_coverage: "Same representative period, including startup/shutdown"
      site_scope: "Declared gas plant and all handover points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; synchronized samples; handover; provenance; completeness; balances/uncertainty"
    - protocol_id: cp_products
      process_id: "supply"
      flow_role: "propane; butane; naphtha; acid_gas"
      record_type: "Coproduct/recovery-interface ledger"
      raw_fields: "full gas/liquid physical mass; composition; product/waste acceptance; stocks; sulphur-recovery receipt and sulphur/water/tail-gas outputs"
      collection_method: "Meter every outlet/receiver separately; acid-gas transfer to sulphur recovery is not air release; retain full physical quantities."
      unit: "kg; m3; MJ; kWh; composition"
      frequency: "Per batch/continuous and each event"
      temporal_coverage: "Same representative period, including startup/shutdown"
      site_scope: "Declared gas plant and all handover points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; synchronized samples; handover; provenance; completeness; balances/uncertainty"
    - protocol_id: cp_waste
      process_id: "supply"
      flow_role: "spent_amine; filter_solids; wastewater; offspec_condensate"
      record_type: "Waste/aqueous ledger"
      raw_fields: "mass/volume; moisture; composition; dissolved/suspended constituents; waste status; receiver; fate; treatment burden"
      collection_method: "Weigh/sample and reconcile external handover; distinguish return, external treatment and final environmental discharge, avoiding repeated water/solids."
      unit: "kg; m3; MJ; kWh; composition"
      frequency: "Per batch/continuous and each event"
      temporal_coverage: "Same representative period, including startup/shutdown"
      site_scope: "Declared gas plant and all handover points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; synchronized samples; handover; provenance; completeness; balances/uncertainty"
    - protocol_id: cp_air
      process_id: "supply"
      flow_role: "co2_air; co_air; ch4_air; ethane_air; benzene_air; h2s_air; so2_air; nox_air; n2o_air; hydrogen_air; ethene_air; water_vapour_air"
      record_type: "Air-release ledger"
      raw_fields: "species; compartment/subcompartment; carbon origin; concentration; flow; T/P/moisture; duration; LDAR; flare; NOx quantity definition"
      collection_method: "Collect actual continuous/periodic monitoring, leak surveys and vent/flare logs; use measured compound speciation rather than assigning total VOC to benzene/ethane. Keep measured/uncorrected versus oxygen-corrected concentration, moisture and flow on compatible bases. A Method19 F-factor route requires actual fuel composition, HHV and matched wet/dry assumptions, not a generic natural-gas factor; integrate compatible concentration, flow and duration; exclude N2O from NOx and avoid repeated NO/NO2 plus aggregate NOx."
      unit: "kg; m3; MJ; kWh; composition"
      frequency: "Per batch/continuous and each event"
      temporal_coverage: "Same representative period, including startup/shutdown"
      site_scope: "Declared gas plant and all handover points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; synchronized samples; handover; provenance; completeness; balances/uncertainty"
    - protocol_id: cp_scope
      process_id: "supply"
      flow_role: "supply"
      record_type: "Boundary/balance/attribution ledger"
      raw_fields: "equipment; all exchanges; parents/receivers; gas/liquid/solid; whole mass; C/H/O/N/S; carrier water; humidity; reaction water; energy; paired internal links; opening/closing stocks; returns; packaging/container fleet; maintenance; common services; drivers; uncertainty/gaps"
      collection_method: "Walk down each unit, retaining physical balances and an independent burden-allocation ledger; do not auto-accept allocation without causal evidence."
      unit: "kg; m3; MJ; kWh; composition"
      frequency: "Per batch/continuous and each event"
      temporal_coverage: "Same representative period, including startup/shutdown"
      site_scope: "Declared gas plant and all handover points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; synchronized samples; handover; provenance; completeness; balances/uncertainty"
    - protocol_id: cp_interfaces
      process_id: "supply"
      flow_role: "supply"
      record_type: "Paired stream and cohort service register"
      raw_fields: "stream/cohort id; sender/receiver; product status; phase/composition; raw quantity state; opening/closing raw/WIP/finished-gas stocks and linepack; first acceptance; returns/retests; makeup/circulation/bleed; container tare/fleet/heel/cycles/returns; cleaning/repair inputs/wastes; dedicated/shared service vectors; original cohort accepted Q and volume basis; inherited burdens"
      collection_method: "Reconcile both endpoints, stocks, returns and acceptance ids. Retain raw exchange, stock and inherited-service vectors before normalization; each additional actual material/emission/waste is atomic. Meter new-production and old-cohort handling, storage, cleaning and retest services separately. Unknown quantities and original denominators remain gaps."
      unit: "kg; m3; MJ; kWh; composition"
      frequency: "Per handover/event; period stock close"
      temporal_coverage: "All cohorts present during representative period"
      site_scope: "Declared gas plant, storage/header and service ownership boundary"
      aggregation_rule: "Current production uses its Q; old-cohort services attach to original cohort Q on original volume basis; zero/unknown Q remains raw"
      quality_evidence: "Calibration; synchronized samples; paired receipts; cohort/state/stock reconciliation; provider and service-driver evidence"
  calculation_rules:
    - id: normalize_records
      applies_to: "all inventory rows"
      rule: "Q is the independently measured sum of unique first-acceptance dry-gas event volumes at the fixed reference gate, not inferred from dispatch plus closing stock. Verify the complete acceptance_event_bridge on the original declared T/P/moisture/composition/Z basis before division. Opening/purchased accepted gas, returns, retests, reacceptance, pre-acceptance rejects/WIP and internal moves add no Q. Once accepted, later loss, rejection, downgrade, service-fuel diversion or transfer back to WIP does not subtract Q. Divide attributable current-cohort production exchange totals by positive known Q once; output is 1 m3. Retain failed-operation, rework, storage, retest and loss-related activities, attributed to their evidenced original cohort; no burden disappears or moves to new production merely because accepted gas changes state. Preserve full physical transfers/stock reconciliation separately from burden allocation. Zero/unknown Q keeps raw totals without normalization. Separate unlike specifications or quantity states into compatible groups."
      inputs:
        - cp_feed
        - cp_delivery
        - cp_utilities
        - cp_materials
        - cp_products
        - cp_waste
        - cp_air
        - cp_scope
        - cp_interfaces
      output: "Same-cohort inventory per reference flow and independent burden ledger"
      source_ids: []
    - id: balance_whole
      applies_to: "supply"
      rule: "For the same boundary/period, sum physical whole-stream inputs minus outputs equals closing minus opening material stock. Where the boundary includes finished-gas storage/linepack, use actual external transfers/releases and all raw/WIP/FG stock changes; first acceptance is an internal state change, not an extra output. Include humidity, air/O2 and all actual exhaust constituents when combustion is inside the boundary. Count a whole solution or mixture once; its component ledger is a decomposition, not additional mass. Cancel internal pairs/returns/rework; preserve external gross outward and linked returns separately. Keep these physical quantities independent of acceptance-event Q and allocation. No reaction mass creation/destruction term or fictitious closure flow is allowed."
      inputs:
        - cp_feed
        - cp_products
        - cp_utilities
        - cp_materials
        - cp_waste
        - cp_air
        - cp_scope
        - cp_interfaces
      output: "Whole-mass ledger and uncertainty-resolved residual"
      source_ids: []
    - id: balance_elements
      applies_to: "supply"
      rule: "For each of C/H/O/N/S, sum inlet element masses minus outlet element masses equals element stock change, using actual constituent masses and molecular stoichiometry or measured elemental assay. Include hydrogen, amines, hydrocarbons, salts, water, air and humidity. Element generation and consumption are zero; reactions redistribute species but do not create or destroy elements. Unknown constituents remain unresolved; never assign zero to close the ledger."
      inputs:
        - cp_scope
        - cp_interfaces
      output: "Five separate conserved-element ledgers"
      source_ids: []
    - id: balance_water_species
      applies_to: "supply"
      rule: "Whole-stream water includes solution carrier, separate dilution, wet gas, steam/condensate, wet solids, wastewater and vapour. For each actual reactive species, inlet minus outlet plus reaction generation G minus consumption C equals species stock change. Evidence G/C using actual reaction stoichiometry, extent and measured species/period records; do not assume species conservation or assign unknown terms zero. Reaction water is included once in the resulting streams and never added as a source to whole-mass or element balances; do not double-count its H/O."
      inputs:
        - cp_scope
        - cp_materials
        - cp_utilities
        - cp_waste
        - cp_air
      output: "Water/species ledger reconciled to whole mass and elements"
      source_ids: []
    - id: gas_energy_basis
      applies_to: "reference_gas; raw_gas; natural_gas"
      rule: "Record dry reference volume at actual declared P/T/Z, composition and provider basis. Physical mass equals same-state volume times independently established same-state density; retain removed moisture/entrained liquid separately. Delivery chemical energy equals volume times the matching mixture volumetric NCV, or mass times matching mass NCV. State combustion reference temperature and product-water convention, keeping GCV distinct; NCV is supplied-mixture heat potential, not pure-methane energy or useful heat. Native secondary coefficients cannot establish any of these conversions."
      inputs:
        - cp_feed
        - cp_delivery
        - cp_utilities
      output: "Compatible volume, whole mass and mixture-energy ledgers"
      source_ids: []
    - id: energy_closure
      applies_to: "supply"
      rule: "Reconcile chemical energy, electrical work, steam supply/return enthalpy, material sensible/latent enthalpy, exported/recovered heat, losses and stored energy under one declared reference convention. Avoid counting both fuel energy and its internally generated heat as external inputs; if chemical enthalpy is included, do not also add the same reaction heat. Separate energy quantities from service burden allocation."
      inputs:
        - cp_scope
        - cp_utilities
        - cp_interfaces
      output: "Energy ledger without repeated internal conversion"
      source_ids: []
    - id: nox_reporting
      applies_to: "nox_air"
      rule: "Only for a documented NO plus NO2 reporting convention, equivalent mass is actual NO mass times molar-mass(NO2)/molar-mass(NO) plus actual NO2 mass. Verify monitoring and LCI/LCIA definitions before application; N2O stays separate. Use actual NO/NO2 species masses for whole-mass and N/O ledgers, never the equivalent mass; choose species or compatible aggregate once for impact calculations."
      inputs:
        - cp_air
      output: "Separate NO2-equivalent reporting quantity and physical species ledger"
      source_ids:
        - epa-refinery-monitoring-2015
    - id: cohort_service_carry
      applies_to: "supply"
      rule: "Preserve raw inputs/outputs, raw/WIP/finished-gas stocks and inherited burden/service vectors. For cohort c with known positive original Q_c, later attributable service increment is S_c/Q_c using that cohort's original declared volume basis; add it to its existing per-reference vector. Opening-stock dispatch, internal moves, returns, rework of previously accepted product and retests do not create another reference output. Unknown/zero Q_c leaves S_c raw with an unresolved normalization, never division or reassignment to new Q."
      inputs:
        - cp_interfaces
        - cp_scope
        - cp_delivery
      output: "Auditable original-cohort burden vector and raw service gaps"
      source_ids: []
    - id: acceptance_event_bridge
      applies_to: "all inventory rows"
      rule: "Q = sum of independently measured unique first-acceptance dry-gas event volumes; lock each original event and cross-check Q = D_new + FG_new + L_new with zero opening stock for that newly accepted cohort. D_new is accepted product delivered to actual own-use/export receivers net of linked returns, FG_new is closing accepted finished gas/linepack, and L_new comprises every other net post-acceptance disposition: loss/leak/vent/flare, scrapping/disposal, downgrade, net return held outside FG, service-fuel diversion and closing rework/WIP or other custody. The three portions must be disjoint and exhaustive on the same original acceptance-composition/T/P/moisture/Z dry-volume basis. Deduct a linked return from D_new and assign it once to its actual closing FG/WIP/other destination; gross rework/reacceptance loops add neither Q nor another destination. Where composition, condensation, chemical reaction or phase changes, trace accepted-origin constituents by measured mass/species and map each portion to its original event-volume equivalent; do not add condensate m3 or flare-exhaust m3 to dry fuel-gas m3, apply same-mixture P/T/Z correction across species removal, or count later added material in Q. Keep actual mass/C/H/O/N/S/water/energy records separate. Q = D_new + FG_new is permitted only with evidence that all other post-acceptance destinations are absent and L_new = 0. For 100 m3 first accepted, 60 m3 net delivered, 30 m3 closing FG and 10 m3-equivalent post-acceptance loss on this basis, Q remains 100 m3, not 90 m3. Opening/purchased FG, retests and reacceptance create no Q; retain their original service vectors. Missing original quantities or unexplained bridge residuals remain unresolved and block complete normalization; never relock Q or assume zero loss."
      inputs:
        - cp_delivery
        - cp_interfaces
        - cp_scope
        - cp_products
        - cp_waste
        - cp_air
      output: "Auditable locked event Q and complete original-basis destination bridge, separate from physical and burden ledgers"
      source_ids: []
  data_quality_requirements:
    - id: quality_balance
      applies_to: "supply"
      requirement: "Reconcile feed/makeup, gas/liquid/solid products, own use, waste, vent/flare and stocks through physical whole-mass/C/H/O/N/S/water/energy balances, with opening/closing stocks, carrier water, humidity, actual reaction-species changes, container returns and paired internal streams. Separately reconcile independently measured unique first-acceptance Q to exhaustive D_new/FG_new/L_new, with original mixture/state evidence for post-acceptance changes, rework and net returns. Investigate differences using propagated uncertainty, without invented closure tolerance, zero loss or adjusted Q."
      evidence: "cp_scope; cp_delivery; cp_interfaces"
    - id: quality_evidence
      applies_to: "all inventory rows"
      requirement: "Collect future actual SKU, composition, acceptance and amounts through real protocols; process literature is not a completed site survey, and single-site/historical values are not universal recipes or defaults."
      evidence: "cp_scope; cp_delivery"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_gas"
    rule: "Verify the complete native whole-product identity, source-route, phase/composition qualifiers, reference property and unit chain before a reference link; for the broad Gas identity require the actual accepted refinery-mixture usage/storage gate. Contradictory positive origin/state/route fields block linkage until corrected or authoritatively resolved; a metadata debt cannot exempt them. Unknown future amounts remain collection requirements, not automatic zero. No natural-gas, pure-hydrogen or LPG substitution."
    source_ids: []
  - rule_id: validate_inventory
    applies_to: "all inventory rows"
    rule: "Each row is one atomic exchange with actual compartment/species/fossil-biogenic origin/quantity definitions; failed infrastructure is not a no-match result. Keep concrete unresolved physical identities; no broad correction-flow substitution."
    source_ids: []
  - rule_id: validate_records
    applies_to: "supply"
    rule: "Check bilingual reference, ordered rule/protocol ids, deduplicated first events and locked Q, actual quality admission/storage/header gate, original-cohort service bases, complete physical and separate allocation ledgers, parent burdens and equal internal links. Require Q = D_new + FG_new + L_new with disjoint exhaustive net destinations and one original acceptance dry-gas T/P/moisture/composition/Z basis; two-term reduction requires evidenced absence of every other destination. Check losses, scrap, downgrade, net returns, closing rework/WIP and accepted-gas service diversion, without erasing their activities or adding Q from opening/purchased FG/reacceptance. Verify mass/species mapping across composition/phase changes and no duplicated returns/destination or first acceptance as extra physical output. Missing records, provider incompatibility, zero/unknown original denominators or unexplained balances prohibit dataset completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Fuel-gas supply input to matching receiving processes"
  allowed_use: "Only completed, identity/quantity/provider-compatible refinery C1/C2 fuel-gas supply data; measured composition/calorific conversion"
  excluded_use: "Methodology alone is not a completed foreground/background dataset; no automatic natural-gas/LPG/olefin/hydrogen substitution, exported-gas combustion or whole-refinery representation"
  required_metadata: "Source units/route; composition; delivery state/quality; provider basis; export/own use; site/period; boundary/allocation; receiving specification"
  required_quality_disclosure: "Unresolved identities and primary metering/background/balance/release/waste/allocation/survey-coverage gaps"
  update_trigger: "Changed source/composition/route/treatment/steam or header blending/receiving specification/allocation"
data_sources:
  - id: "jrc-refining-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Refining of Mineral Oil and Gas, 2015; section 2.10 pp.66–67 (PDF100–101), 2.12 pp.76–77 (PDF110–111), 4.10.2.2 p.353 (PDF387), 4.23.5.1 pp.479–481 (PDF513–515), Annex8.2.2 p.673 (PDF707). https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/REF_BREF_2015.pdf"
    used_for: "Refinery-gas identity, own-use/sale limitations, separation and amine interfaces; process evidence only, without transferred schematic states, historical quantities or recipes; independence key: jrc-refining-2015"
  - id: "un-cpc-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, entries12020,33410,33421,33429,34210 (PDF57,156,157,160). https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification titles and adjacent identities only, not universal manufacture or full 33429 mapping; independence key: unsd-cpc3-2025"
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "European Commission, Commission Recommendation (EU) 2021/2279, Annex I, section 4.5 p.63. https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "Generic subdivision and relevant physical-relationship principles only; specific product rules prevail. Not refinery production evidence, allocation shares or full PEF compliance; independence key: ec-pef-2021"
  - id: "epa-refinery-monitoring-2015"
    type: "official_guidance"
    reference: "US EPA, Emissions Estimation Protocol for Petroleum Refineries, Version3, April2015, sections2.1 (PDF24–25),4.1–4.2 (PDF49–51),5.5 (PDF92). https://www.epa.gov/sites/default/files/2020-11/documents/protocol_report_2015.pdf"
    used_for: "Actual leak speciation, combustion concentration wet/dry and volume-state compatibility, HHV limitations of F factors, and sulphur-recovery event scope only; no historical emission factors or default recovery efficiencies; independence key: us-epa-refinery-protocol-2015"
