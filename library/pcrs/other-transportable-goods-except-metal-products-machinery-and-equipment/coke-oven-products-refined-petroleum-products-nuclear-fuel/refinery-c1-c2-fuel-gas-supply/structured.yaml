system_boundary:
  rules:
    - rule_id: boundary_supply
      applies_to: "supply"
      rule: "Include actual separation, cleaning, regeneration, compression, cooling, metering, losses and supply-unit-owned utilities and flares. Link purchased utilities to compatible backgrounds; not every schematic operation is mandatory."
      source_ids:
        - jrc-refining-2015
    - rule_id: boundary_combustion
      applies_to: "reference_gas"
      rule: "After the supply outlet, refinery own-use combustion and external customer combustion are separate receiving processes. Retain full physical gas records and equal transfers; do not add downstream customer emissions to manufacture or delete refinery combustion."
      source_ids:
        - jrc-refining-2015
    - rule_id: boundary_complete
      applies_to: "supply"
      rule: "Add each actual feed, formulation component, refrigerant, waste, pollutant and particulate size separately from the equipment walkdown. Separate aqueous treatment handover from environmental discharge; retain gas/liquid/solid products and water/carbon/sulphur/energy interfaces. Known biogenic input requires a separate biogenic CO2 row and renewed applicability review; a GHG reporting convention cannot remove it from LCI."
      source_ids:
        - jrc-refining-2015
    - rule_id: link_ledgers
      applies_to: "supply"
      rule: "These are interfaces to actual units and ledgers, not mandatory additional manufacturing processes. Record each stream once at the declared boundary; an internal link has two equal endpoints and cancels in the consolidated balance. Keep upstream burden inheritance, physical quantities and service attribution separate."
      source_ids: []
    - rule_id: link_feed
      applies_to: "raw_gas; raw_condensate"
      rule: "Pair refinery-parent output with supply input using source-unit, stream id, period, phase, composition, moisture and quantity state; inherit documented parent burdens. A wet inlet volume is not automatically equal to dry product volume."
      source_ids:
        - jrc-refining-2015
    - rule_id: link_loops
      applies_to: "supply"
      rule: "Pair actual rich/lean amine, absorber gasoline recycle, flash gas returned to the fuel header, knockout condensate returned to refining and cooling-water/steam-return circuits. Record circulation, makeup, bleed, retained inventory and transfers separately; neither endpoint becomes a repeated purchase, sale or emission."
      source_ids:
        - jrc-refining-2015
    - rule_id: link_products
      applies_to: "reference_gas; propane; butane; naphtha"
      rule: "Pair each own-use/export/storage outlet with its receiver, retaining acceptance events, gross outlets, linked returns, stocks/linepack and post-acceptance losses/downgrades/rework. The 1 m3 denominator is independently locked unique first acceptance Q, checked with disjoint exhaustive D_new + FG_new + L_new on its original basis. Opening or purchased accepted stock, return/retest/reacceptance and stock dispatch add no Q. Unaccepted WIP or supply-service fuel drawn before first acceptance adds no Q; later diversion of already accepted gas preserves Q and belongs once in L_new. Accepted product transferred to a separate refinery fuel receiver belongs once in D_new. Separate C3/C4/C5-plus outlets remain full physical quantities."
      source_ids:
        - jrc-refining-2015
    - rule_id: link_recovery
      applies_to: "acid_gas; spent_amine; wastewater; filter_solids; offspec_condensate"
      rule: "Pair each whole-mixture transfer with its actual recovery/treatment receiver. Retain H2S, CO2, hydrocarbons, salts, carrier water and moisture without replacing the whole stream with one species. Link recovered sulphur, water, tail gas and returned materials at the receiver; include actual receiver burdens once under the declared boundary/allocation."
      source_ids:
        - jrc-refining-2015
        - epa-refinery-monitoring-2015
    - rule_id: link_combustion
      applies_to: "supply"
      rule: "Identify actual supply-owned heater/flare operations and receiving refinery/customer combustion separately. For included operations retain air/O2, humidity, fuel, all actual exhaust constituents including N2/O2, recovered heat and losses; expand each required actual LCI exchange atomically. Do not manufacture a generic combustion or mixing process to complete a diagram."
      source_ids:
        - jrc-refining-2015
    - rule_id: link_packaging
      applies_to: "supply"
      rule: "Determine actual pipeline/bulk/container delivery, material stocks and returns. Add each actual packaging material, seal, replacement part, cleaning input and resulting waste as its own row when present. For reusable tanks/cylinders collect tare, fleet stock, fill/empty returns, heel, losses, cleaning/inspection/repair and measured service cycles; container mass is not gas mass or a fresh container purchase per fill. Include owned or supplier service burdens once and explain any exclusion."
      source_ids:
        - jrc-refining-2015
        - eu-pef-2021
