measurement_rules:
  - id: dry_volume
    applies_to: "reference_gas"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Q is the independently measured sum of unique first-acceptance event dry-gas volumes from cp_delivery, locked at the declared reference temperature, absolute pressure, moisture and acceptance-composition-specific compressibility. Reconcile all D_new, FG_new and L_new portions with acceptance_event_bridge on that original basis. Preserve raw meter states and measured mass/species records; actual later volumes with changed composition or phase are not automatically additive. No summing unlike raw m3/Nm3, universal normal state, density or heating value; verify provider/reference-state compatibility independently."
  - id: gas_state_conversion
    applies_to: "raw_gas; reference_gas; natural_gas"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Where only water is removed, convert V_measured to V_reference_dry as V_measured times (1 minus measured water mole fraction) times P_measured/P_reference times T_reference/T_measured times Z_reference_dry/Z_measured. Use absolute pressure, kelvin, synchronized actual mixture composition and matching compressibility definitions; omit moisture correction only for an already dry meter. Any hydrocarbon condensation or species removal requires a separate material ledger, not this same-mixture conversion. Do not invent standard P/T/Z or assume Z equals 1."
  - id: utility_basis
    applies_to: "steam; natural_gas"
    required_property_ref:
      name: "Mass; Energy; Volume"
      uuid: ""
    required_unit: "kg; MJ; m3"
    rule: "Record steam carrier mass separately from net heat and return water. With mass in kg and enthalpy in kJ/kg, delivered heat is (sum supply mass times supply enthalpy minus sum return mass times return enthalpy)/1000 MJ on one convention; include make-up/blowdown/losses in water and enthalpy accounts. Select compatible mass- or heat-based provider quantity once, without adding both or applying a second enthalpy factor. Natural-gas m3 requires matching temperature/absolute-pressure/moisture/compressibility; NCV and GCV stay distinct."
  - id: physical_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Recorded exchange property"
      uuid: ""
    required_unit: "Recorded exchange unit"
    rule: "Retain raw exchange vectors, raw/WIP/finished-gas stocks and inherited service vectors by acceptance cohort. Same-cohort production totals are normalized by positive Q; opening or purchased finished gas, stock dispatch, return, retest and reacceptance do not create Q. Accepted gas later lost, downgraded, scrapped or returned to WIP retains its original first event and services. Old-cohort services use that original Q/volume basis; unknown or zero Q leaves raw totals with no division. Physical whole-mass/C/H/O/N/S/water/energy ledgers are independent of event quantities and attributed burdens."
