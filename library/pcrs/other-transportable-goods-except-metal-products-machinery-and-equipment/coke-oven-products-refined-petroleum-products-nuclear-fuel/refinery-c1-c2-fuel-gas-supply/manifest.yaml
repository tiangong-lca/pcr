    reason: "Accepted narrower association covers conditioned mineral-refinery C1/C2 fuel-gas supply at actual usage/storage handover only; the CPC residual title is not a semantic product boundary. Current decision: docs/adr/2026-11-08-accept-scoped-cpc3-115-batch-05.md, supported by docs/reviews/cpc3-115-20261106/33429-review.json. Mixtures with external natural gas and isolated hydrogen remain outside automatic applicability and require independent classification review."
