system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "This method covers whole tyre-derived reclaimed rubber that undergoes real thermomechanical plasticization, cooling extrusion, die formation and cutting in China before first acceptance. It is not unchanged screened tyre powder, pyrolysis carbon black, new NR/SBR compounding or a finished revulcanized article. The actual 2025 manufacturer report calls its grade liquid reclaimed rubber and describes a hot viscous phase, a second cooled extruder, a sheet-forming die and automatic cutting before bagging. Preserve those facts together. Admission requires the actual output to be an extruded sheet or strip uncut or simply cut to rectangular (including square) shape under the Chapter40 form terms and cut to its declared configuration at the at-plant gate; unformed bulk liquid cannot inherit that reference. A sheet-head equipment name alone is not final-geometry proof: actual formed-section observations, dimensions and packaging-state evidence are required for the chosen grade. Measured section dimensions and specific supplied formulations are actual study/reference-point admission data; this methodology supplies no universal dimensions, mandatory factory SKU or equivalence of every phaseIII liquid grade. No cold self-supporting state, common patent/factory, fixed recipe, operating condition or present legal/quality approval is inferred."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "The whole reference Product is Semi-finished rubber parts / 半成品橡胶部件, with a Mass reference, China production-mix and calendering or extrusion and cutting hard fields. Its complete comment explicitly covers sheets/profiles cut to size; it does not fix a polymer purity, virgin-only supply or vulcanization state. Preserve native CPC36220 as countermetadata. The admitted reclaimed grade must independently meet the actual source, phase, whole composition and cut-geometry conditions; a label alone cannot override native fields. The input Product Rubber Powder / 胶粉 identifies screened scrap-tyre powder before reclamation, not the final transformed product; its native CPC36113 countermetadata and at-plant context remain visible. Keep residual fillers, carbon black, oils, water and all actual constituents within each whole supplied material. Neither a pure polymer nor a component UUID substitutes for the filled reclaim."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "This CPC3.0 36210 association is limited to the independently reviewed narrower scope. Current CPC notes distinguish reclaimed rubber36210 from compounded/shaped rubber36220. The HS Chapter40 terms distinguish reclaimed rubber4003, unchanged waste/powder4004 and unvulcanized compounded rubber4005; apply the complete notes and actual supplied form, not a generic recycled label. This candidate is restricted to reclaimed plates/sheets/strip uncut or simply rectangular-cut under Chapter40 Note9; other extruded profiles, further-worked shapes and actual new compounding are not admitted by the broader native family. Actual recovery/plasticization and its material endpoint establish this case, while downstream addition of virgin rubber, new compounding or manufacture of articles needs a different complete assessment. Current CPC principles do not turn the native36220 tag into an accepted36210 edge, nor does a historical case establish a current official ruling or whole-leaf coverage."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "The real starting interface is the actual received or internally produced whole screened tyre powder, with the full upstream tyre-processing producer retained. The reported Chinese unit actually separates tyres, steel and textile, crushes, screens and magnetically separates powder and controls dust. Require its complete physical tyre/feed/stock/powder/steel/textile/waste/outlet and inherited-burden records and actual native provider reference unit. An own powder handoff is not a new purchase or sale. A qualified producer aggregate and its expanded atomic inventory are alternative representations; never add both. Actual waste-origin collection, transport and assigned prior burdens depend on the declared study goal and boundary. Neither zero-burden waste, an avoided virgin-rubber credit nor a fixed tyre-to-powder yield follows from this PCR."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "Include actual pitch receipt and storage, weighed mixing, preheating, screw-driven thermal/mechanical reclamation, cooling/degas extrusion, sheet die, cutting, bagging, handling and quality release, including startup, failure, idle, rework and cleaning. The source material table and process diagram name tyres and tall-oil pitch, while generic equipment/process text also mentions powder/liquid aid stations and grade-dependent additions. Preserve that limitation: equipment labels do not establish chemical use or absence, and the report is not a complete transferable formulation. Obtain the actual whole supplied formulations, supplier/lot and composition for the chosen grade; every actual additional chemical needs its own concrete atomic card before a study is complete. Do not invent powder ingredients, a powder-free recipe, pure-chemical substitutions, dose, yield or universal operating settings."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "Fix first acceptance after the actual cut configuration, documented grade/quality release, whole-product net weighing and declared packing configuration. Independently sum unique first-accepted whole wet masses into Q and lock each original cohort. Do not use annual reported production, dispatch, a nominal piece/box mass, dry rubber or a polymer equivalent as Q. The postgate bridge partitions Q on its original acceptance basis into disjoint net retained external deliveries, all actual on-site accepted states, irreversible losses and terminal dispositions. Returns, recutting, rework and retest do not create a second event. Added material is separately traced; do not restore evaporated water/material into surviving mass and also count its loss. Later old-cohort services use original Q0. Zero/unknown Q preserves raw totals and an unresolved normalized result."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "Keep complete physical stocks for powder, pitch, raw/wet mixtures, mixer and extruder holdup, hot viscous material, cooled cut sections, unaccepted rework, accepted goods, returns, containers and assets. Carry own foreground/WIP history once into the appropriate released cohort and retain closing unaccepted history with WIP. Reclamation does not mean complete sulfur removal or a specified/selective crosslink cleavage: the source describes plasticization, not an elemental-sulfur purification yield. Separate total mass and actual C/H/O/S and other relevant conserved quantities from changing polymer/species identities. Quantify actual deposits, moisture, condensate, volatile loss and reaction products independently; do not assign all carbon toCO2, all sulfur toH2S/SO2 or a volatile-loss test to water. Unknown composition or multiple unknown outlets cannot be closed by one residual. No performance or environmental benefit follows from the reclaim label."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "Maintain measured actual/standard and wet/dry gas volumes, temperature, pressure, humidity, composition, time and paired flow/concentration bases. An integrated volume is not multiplied by time again. Gross carrier-air/introduced nitrogen/oxygen/water ledgers are distinct from net resource uptake and newly formed species; unchanged carrier components are not duplicate elementary emissions. Actual liquid/condensate withdrawal changes the gas-phase inventory and is not another free product or recycling credit. Cooling supply/return and washing/effluent are distinct physical interfaces; preserve actual gross circulation, stocks, heat and net producer demand without default water density, evaporation fraction or wastewater factor. Actual provider reference units may differ from physical interface units and need an evidenced conversion, never an assumed kilogram per cubic metre."
      source_ids: []
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "The actual same-site gas and water treatment operations remain inside the physical boundary. The report documents separate high-load thermal treatment/alkaline spray, low-load bag-filter/activated-carbon control, heated gas/buffer condensate collection and site wastewater treatment. A genuinely qualified linked producer must retain its complete actual boundary, full native record/reference property/unit, feed state/composition, fuel, electricity, air/O2, water, whole chemical formulations, reactions, final species, heat, filters/adsorbents, wastes, capital/maintenance and inherited histories once. An expanded representation must enumerate every actual atomic exchange instead. These alternatives cannot be added together or replaced by generic disposal. No available qualified dataset, electric-only configuration, complete capture/conversion or zero residual is asserted. Retain actual high/low-gas, condensate, wastewater and receiver interfaces and their non-overlap through the complete coupled chain."
      source_ids: []
    - rule_id: system_boundary_rule_10
      applies_to: "foreground_system_boundary"
      rule: "Record whole maintenance-oil drums, liner bags and actual outbound turnover boxes separately from reclaim net mass, including measured tare, receipts, unused/installed/finished stocks, delivery, return and scrap. The source actually reports spent oil and oil drums: free drained oil is a separate transfer only when actually removed, while oil remaining inside a whole contaminated drum stays nested and is not another export. Do not replace a complete article by a guessed resin or add embedded manufacturing twice. Bagging-machine trays are handling assets unless actual shipment proves otherwise; their complete fleet/BOM and any genuine separate acquisition/removal stay visible. The integrated reclaim-and-cut line retains complete new/in-service/retired physical mass and all component/service histories. Compatible provider demands and physical fleet/tare ledgers are separate. Convert item/service units only with actual measured mass/dimensions and qualified histories; no invented machine mass, lifetime or causal share. A supplier assembly and separately expanded component/maintenance histories must not overlap."
      source_ids: []
    - rule_id: system_boundary_rule_11
      applies_to: "foreground_system_boundary"
      rule: "Each actual whole contaminated-object or liquid-mixture receiver transfer retains complete physical Qt and the receiver once, including substrate/tare, retained rubber/oil/liquor/solids and water. Nested constituents are not extra exports unless physically separated before the boundary. Keep a volumetric wastewater transfer distinct from measured receiver mass and actual compatible treatment units; no pure-water conversion is assumed. Model separate non-overlapping cohort service demands A whose sum equals actual provider demand, using original Q or Q0 for normalization. Attribution does not shrink physical Qt or charge the full shared event again to every cohort. Unknown causal shares/provider conversions remain unknown. Internal reject/rework movements keep their own material/history and cancel on consolidation; they are not new procurement, accepted output, an automatic external waste or a credit."
      source_ids: []
    - rule_id: system_boundary_rule_12
      applies_to: "foreground_system_boundary"
      rule: "For fugitive particles and vapors, use the complete EPA600/2-76-089c quasi-stack capture/pretest/measurement/QA context only where the source can actually be isolated and its full plume captured without changing the process or emissions. Prove capture, intact transport/wall recovery, source representativeness, inlet-background subtraction and complete event coverage; a factory-boundary concentration is not a mass rate. The 1976 manual has inconsistent turbulent/laminar wording and purportedly unchanged duct-diameter coefficients; adopt none of its sizing equations, dimensions, velocity/fan factors or numerical accuracy promises. Use the complete applicable EPA Method5 isokinetic filter/front-half gravimetric procedure for particle mass, with actual phase/temperature-defined catch, blanks, leak/calibration/traverse/flow/moisture and recoveries. Its operational particulate definition is neither pure rubber nor every condensable or droplet constituent. Qualify actual Methods1/2/3/4 and other required dependencies separately; no claim that every dependency or actual enclosure is already qualified. If complete capture or an essential measurement relation is not established, the affected study remains incomplete rather than substituting a concentration or zero. Use complete applicable source-gas analytical procedures and actual method/matrix proof. EPA Method18 supplies a compound-specific organic-vapor GC framework with calibration, preservation, recovery and applicability exclusions, including compounds polymerizing before analysis. EPA Method320 and its complete Protocol/addendum require actual IR-active vapor reference spectra, conditioning, interferent evaluation, dynamic spikes/recovery, transport/condensation controls, uncertainty and time coverage. They are not bulk-liquid/rubber assays or blanketN2/O2 methods. The manufacturer report cites ambient-air HJ584 for organized-stack toluene/xylene: preserve that scope counterevidence, not automatic matrix qualification or a transferable factor. Keep NMHC/COD/volatile-loss group results and censored observations as reported; do not turn them into a chemical species, dry polymer, water or zero. Actual quality conventions and composition methods must fit the chosen grade. An unknown essential procedure or unqualified provider keeps the affected study unresolved; a future SOP, source registration or finite check cannot grant scientific approval."
      source_ids: []
    - rule_id: system_boundary_rule_13
      applies_to: "foreground_system_boundary"
      rule: "gztyre-reclaim-2025; xinxiang-reclaim-cut-2015; ilcd-attributional-2010; un-cpc3-notes; un-cpc3-intro; abf-hs40-current; epa-method18-2025; epa-method320-2019; epa-method5-2017; epa-quasi-stack-1976"
      source_ids: []
