allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Keep full physical coproduct/waste/stock quantities independent of attributed burdens. Subdivide genuinely separable operations first, then use evidenced exchange-specific determining physical causality; only justified residual joint burdens may use same-gate market value with actual prices and sensitivity. This is a bounded attributional hierarchy, not a recycling cutoff or fixed share. Actual tyre-processing steel/textile outputs remain real physical outputs within that producer, not automatic credits against reclaim Q. Internal loops, cooling returns, packaging and waste do not create a second functional product. Unknown causal/provider relations remain unresolved; own WIP history and old-Q0 services are not assigned twice."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "ilcd-attributional-2010"
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "reclaim_cut"
      flow_role: "Whole material receipts, WIP and rework"
      record_type: "foreground_record"
      raw_fields: "supplier/lot/whole identity/formulation; wet gross/net/tare; composition method/basis; pitch/powder/mixture/line stocks; internal handoffs; own and provider histories; actual additional aids"
      collection_method: "Use calibrated receipt/stock measurements and actual supplier records, preserving full supplied materials, raw formulations and source limits. Resolve actual ingredients individually; no recipe inferred from equipment labels. Aggregation conditions: whole physical stock balance and inherited history; attributable raw numerator enters normalize once"
      unit: "kg"
      frequency: "Every receipt/transfer, startup/failure and cutoff"
      temporal_coverage: "Complete campaign, opening/closing stocks, failures and original-cohort later services"
      site_scope: "Actual China reclaim site and complete matched on-site/external producers and receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated scales; lot/BOM/assay-method evidence; complete WIP/provider reconciliations"
    - protocol_id: cp_cohort
      process_id: "reclaim_cut"
      flow_role: "First acceptance and original-cohort postgate states"
      record_type: "foreground_record"
      raw_fields: "unique event; actual grade/phase/geometry; net wet mass; measured tare; acceptance time; gross dispatch/returns; disjoint retained delivery/on-site states/loss/terminal disposition; additions; original Q0"
      collection_method: "Independently weigh the admitted whole product at the fixed gate and lock unique acceptance genealogy. Reconcile the complete original-basis bridge, with no repeat acceptance or nominal piece mass. Aggregation conditions: independent Q and original Q0; disjoint original-basis bridge; no division during collection"
      unit: "kg"
      frequency: "Every acceptance/state change and cutoff"
      temporal_coverage: "Complete campaign, opening/closing stocks, failures and original-cohort later services"
      site_scope: "Actual China reclaim site and complete matched on-site/external producers and receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "release/scale/phase and return/loss evidence; complete cohort links"
    - protocol_id: cp_energy
      process_id: "reclaim_cut"
      flow_role: "Actual electrical energy and matched producer history"
      record_type: "foreground_record"
      raw_fields: "meter boundaries/readings/unit; mixing/screw/heater/cooling/cutting/handling loads; startup/idle/failure; actual producer footprint; shared causal driver; original cohort"
      collection_method: "Read calibrated electrical meters over complete operations; retain genuine generation and qualified linked-producer energy once, with supported disjoint cohort attribution. Aggregation conditions: raw electrical demand after actual unit reconciliation to normalize once; old-cohort service uses Q0"
      unit: "kWh"
      frequency: "Every meter interval and full campaign"
      temporal_coverage: "Complete campaign, opening/closing stocks, failures and original-cohort later services"
      site_scope: "Actual China reclaim site and complete matched on-site/external producers and receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; unit/boundary and embedded-history non-overlap; causal records"
    - protocol_id: cp_water
      process_id: "reclaim_cut"
      flow_role: "Cooling/return/washing/effluent phase ledgers"
      record_type: "foreground_record"
      raw_fields: "interface/receiver; gross volume/rate/time; actual state/T/P/composition/density; makeup/recirculation/return/bleed/stock; wet-product retained water; condensate/vapor; provider units and histories"
      collection_method: "Measure each actual aqueous interface and reconcile compatible raw phase/component ledgers. Separate gross circulation/physical receiver transfer from net compatible provider demand; no default density or moisture from volatile-loss tests. Aggregation conditions: raw compatible water/effluent records and receiver quantity remain complete; attributable producer demand enters normalize once"
      unit: "m3"
      frequency: "Each transfer interval and cutoff, including abnormal operations"
      temporal_coverage: "Complete campaign, opening/closing stocks, failures and original-cohort later services"
      site_scope: "Actual China reclaim site and complete matched on-site/external producers and receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "paired meters/state/assay evidence; actual phase balance; receiver and native-unit compatibility"
    - protocol_id: cp_interface
      process_id: "reclaim_cut"
      flow_role: "Complete actual powder/gas/water producer interfaces"
      record_type: "foreground_record"
      raw_fields: "source/receiving units; actual full producer boundary/native body/reference unit; whole mixture volume/state/composition; upstream tyre/steel/textile physical ledger; control feed/outlets; fuel/air/O2/water/heat/chemical/waste/assets; inherited disjoint demand"
      collection_method: "Verify complete source-defined producer bodies and measured matched interfaces. Use qualified aggregate or full expanded atomic inventory once; retain all physical stages without a generic disposal/available-dataset assertion. Aggregation conditions: whole gas interface in m3; actual powder kg and water/other producer units retained in their linked records; compatible demand only to normalize once"
      unit: "m3"
      frequency: "Every actual gas-interface interval and full producer coverage"
      temporal_coverage: "Complete campaign, opening/closing stocks, failures and original-cohort later services"
      site_scope: "Actual China reclaim site and complete matched on-site/external producers and receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "full producer/ref-unit proof; raw state/spectra/receiver and physical-history non-overlap"
    - protocol_id: cp_pack
      process_id: "reclaim_cut"
      flow_role: "Complete bags/boxes/oil drums and actual delivery/return stocks"
      record_type: "foreground_record"
      raw_fields: "article/supplier/BOM; measured tare; receipts; unused/installed/FG; actual delivered/returned/removed mass; residual contents; cohort; producer demand unit"
      collection_method: "Weigh complete actual articles and reconcile their physical stocks/shipments/returns independently of reclaim net contents and provider burden. Do not assume a handling tray leaves the site. Aggregation conditions: whole article bridge; disjoint compatible manufacturing/service demand to normalize once, with original cohort retained"
      unit: "kg"
      frequency: "Every article transfer and cutoff"
      temporal_coverage: "Complete campaign, opening/closing stocks, failures and original-cohort later services"
      site_scope: "Actual China reclaim site and complete matched on-site/external producers and receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tare/BOM/delivery/return evidence; full container fleet and provider-unit proof"
    - protocol_id: cp_assets
      process_id: "reclaim_cut"
      flow_role: "Integrated-line physical fleet, maintenance and service"
      record_type: "foreground_record"
      raw_fields: "actual assembly/model/BOM and integral trays/components; measured mass/dimensions; new/unused/in-service/retired stocks; acquisition/service history; oil; actual provider units; original cohorts; unknown causal shares"
      collection_method: "Retain the complete physical fleet and independently compatible provider/service demand. Convert with actual BOM/weighing and service histories only; whole assemblies and expanded components/maintenance cannot overlap. Aggregation conditions: physical fleet/mass once; supported disjoint producer/service vector to normalize using original Q or Q0"
      unit: "kg"
      frequency: "Each acquisition/service/removal and cutoff"
      temporal_coverage: "Complete campaign, opening/closing stocks, failures and original-cohort later services"
      site_scope: "Actual China reclaim site and complete matched on-site/external producers and receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier/BOM/scale and full service evidence; no default mass/lifetime/share"
    - protocol_id: cp_species
      process_id: "reclaim_cut"
      flow_role: "Actual compound/particle load and conserved-quantity ledgers"
      record_type: "foreground_record"
      raw_fields: "source/medium/species/actual mixture-isomer definition; raw concentration/flow/time; state/wet-dry/actual-standard; reference spectra/calibration/spikes/recovery; condensate/transport; censoring/uncertainty; raw NMHC/COD; component/elemental balances"
      collection_method: "Use complete quasi-stack capture and actual background/nonperturbation proof, applicable EPA5 particulate and EPA18/320 vapor procedures with actual matrix validation, retaining source ambient/stack counterevidence. Integrate compatible species measurements once; preserve raw groups without invented speciation, zero or closure. Aggregation conditions: raw independently evidenced species loads and conservation checks; attributed load to normalize once"
      unit: "kg"
      frequency: "Complete representative/source-event coverage, including startup/failure"
      temporal_coverage: "Complete campaign, opening/closing stocks, failures and original-cohort later services"
      site_scope: "Actual China reclaim site and complete matched on-site/external producers and receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "complete chromatograms/spectra/matrix-spikes, sampling/flow state and raw uncertainty records"
    - protocol_id: cp_waste
      process_id: "reclaim_cut"
      flow_role: "Whole actual receiver transfer and disjoint cohort treatment"
      record_type: "foreground_record"
      raw_fields: "event/receiver; complete Qt; substrate/tare/rubber/oil/liquor/solids/water nested; holding stock; real separation; provider native unit/actual demand; disjoint cohort A and original Q/Q0; unknown shares"
      collection_method: "Weigh/measure the whole actual transferred object/mixture and verify its receiver once. Keep physical event complete separately from compatible treatment vectors; no duplicate nested exports or embedded producer treatment. Aggregation conditions: full physical Qt once; disjoint compatible A sum to actual provider demand and enter normalize with original Q/Q0"
      unit: "kg"
      frequency: "Every creation/holding/transfer and cutoff"
      temporal_coverage: "Complete campaign, opening/closing stocks, failures and original-cohort later services"
      site_scope: "Actual China reclaim site and complete matched on-site/external producers and receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "receiver records and full component/stock balance; compatible reference-unit and non-overlap proof"
  calculation_rules:
    - id: acceptance
      applies_to: "accepted_reclaim"
      rule: "Independently sum unique admitted first-accepted whole wet net masses Q; do not derive Q from sales, annual capacity or nominal pieces."
      inputs:
        - cp_cohort
      output: "Q"
      source_ids:
        - gztyre-reclaim-2025
    - id: postgate
      applies_to: "accepted_reclaim; returned_reclaim"
      rule: "Partition original Q into disjoint net retained delivery, all on-site accepted states, irreversible losses and terminal dispositions; trace additions separately and use original Q0 for later services."
      inputs:
        - cp_cohort
        - cp_material
      output: "original_cohort_bridge"
      source_ids:
        - gztyre-reclaim-2025
    - id: normalize
      applies_to: "all inventory rows"
      rule: "Divide only actual evidenced attributable exchange/provider demand A by the same positive independent Q, or original Q0 for old-cohort later services. Preserve raw physical totals and histories separately; never divide in collection and again here. Unknown bases/shares/conversions remain unresolved."
      inputs:
        - cp_material
        - cp_cohort
        - cp_energy
        - cp_water
        - cp_interface
        - cp_pack
        - cp_assets
        - cp_species
        - cp_waste
      output: "per_reference_inventory"
      source_ids:
        - gztyre-reclaim-2025
    - id: material_history
      applies_to: "powder; tall_oil_pitch; internal_rework_in; internal_rework_out; accepted_reclaim"
      rule: "Reconcile complete raw/WIP/FG wet masses and independent component/elemental records; internal handoffs cancel and own carried burdens transfer once. Reactions change species, not the independent conservation equations."
      inputs:
        - cp_material
        - cp_cohort
        - cp_species
      output: "physical_and_inherited_history"
      source_ids:
        - gztyre-reclaim-2025
    - id: gas_state_load
      applies_to: "high_load_gas; low_load_gas; rubber_dust_air; toluene_air; xylene_air; h2s_air"
      rule: "Integrate only compatible actual concentration/flow once, retaining phase/state, time, component/isomer definition, conditioning and uncertainty. Physical gas-volume transfers and compatible producer demand remain separate; no VOC-group-to-species, standard density or complete-conversion factor."
      inputs:
        - cp_interface
        - cp_species
        - cp_water
      output: "qualified_gas_interface_and_load"
      source_ids:
        - epa-method320-2019
    - id: pack_assets
      applies_to: "liner_bag; delivered_liner; turnover_box; returned_box; delivered_box; oil_drum; spent_oil_drum; production_line; lubricating_oil"
      rule: "Reconcile complete actual article/fleet receipts, stocks, delivered/returned/retired mass and supported service histories independently of net reclaim and provider vectors. No nominal tare, lifetime or duplicate assembly/component burden."
      inputs:
        - cp_pack
        - cp_assets
        - cp_cohort
      output: "physical_article_and_service_vectors"
      source_ids:
        - gztyre-reclaim-2025
    - id: water_phase
      applies_to: "cooling_water; cooling_return; washing_water; industrial_wastewater; oily_condensate"
      rule: "Keep whole measured aqueous transfers, gross circulation, net demand, retained product water, condensate/vapor and stocks on compatible actual bases; internal return cancels only on consolidation. No pure-water or volatile-loss substitution."
      inputs:
        - cp_water
        - cp_interface
        - cp_material
      output: "independent_water_phase_ledgers"
      source_ids:
        - gztyre-reclaim-2025
    - id: whole_waste
      applies_to: "oily_condensate; industrial_wastewater; spent_liner; spent_box; spent_oil_drum; spent_oil; retired_line"
      rule: "Full whole receiver transfer Qt remains physical once; nested constituents add no exports. Compatible disjoint cohort service A sums to actual provider demand, with original Q/Q0 and embedded-producer non-overlap."
      inputs:
        - cp_waste
        - cp_interface
        - cp_assets
        - cp_water
      output: "whole_transfer_and_separate_treatment_vectors"
      source_ids:
        - gztyre-reclaim-2025
  data_quality_requirements:
    - id: native_grade
      applies_to: "accepted_reclaim; powder"
      requirement: "Verify actual whole grade/China/phase/cut geometry and complete native fields; do not substitute virgin polymer, powder or unformed liquid, or override classification countermetadata."
      evidence: "Full native/FPUG chain and actual supplier/product/source records"
    - id: formulation
      applies_to: "all inventory rows"
      requirement: "Actual complete formulation and supplier batches; source tables/diagrams and generic station text are not a recipe or evidence of absent aids. Each actual additional material needs a concrete atomic exchange."
      evidence: "cp_material; gztyre-reclaim-2025"
    - id: cohort
      applies_to: "all inventory rows"
      requirement: "Independent first-acceptance Q and complete original-basis bridge/stocks; old services use Q0 and inherited history once."
      evidence: "cp_cohort; cp_material"
    - id: producer
      applies_to: "high_load_gas; low_load_gas; industrial_wastewater; powder"
      requirement: "Qualify complete actual source-defined producers, native units and physical/embedded-history non-overlap; no generic disposal or available-dataset assumption."
      evidence: "cp_interface; cp_energy; cp_water"
    - id: methods
      applies_to: "all inventory rows"
      requirement: "Full actual method/matrix scope, recovery/state/time and uncertainty; retain ambient-stack counterevidence, censored results and unresolved composition without inventing species or water."
      evidence: "cp_species; epa-method18-2025; epa-method320-2019; epa-method5-2017; epa-quasi-stack-1976"
    - id: waste_assets
      applies_to: "all inventory rows"
      requirement: "Whole physical receiver/fleet/article totals separate from compatible cohort provider demands and original denominators; unknown causal shares are not zero or new physical flows."
      evidence: "cp_pack; cp_assets; cp_waste"
    - id: context
      applies_to: "all inventory rows"
      requirement: "Preserve complete bilingual normative conditions, literal/typed fields, sources and actual unknowns; authorship and finite checks do not establish scientific or study qualification."
      evidence: "Full Markdown, generated context and source/measurement audits"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "This method covers whole tyre-derived reclaimed rubber that undergoes real thermomechanical plasticization, cooling extrusion, die formation and cutting in China before first acceptance. It is not unchanged screened tyre powder, pyrolysis carbon black, new NR/SBR compounding or a finished revulcanized article. The actual 2025 manufacturer report calls its grade liquid reclaimed rubber and describes a hot viscous phase, a second cooled extruder, a sheet-forming die and automatic cutting before bagging. Preserve those facts together. Admission requires the actual output to be an extruded sheet or strip uncut or simply cut to rectangular (including square) shape under the Chapter40 form terms and cut to its declared configuration at the at-plant gate; unformed bulk liquid cannot inherit that reference. A sheet-head equipment name alone is not final-geometry proof: actual formed-section observations, dimensions and packaging-state evidence are required for the chosen grade. Measured section dimensions and specific supplied formulations are actual study/reference-point admission data; this methodology supplies no universal dimensions, mandatory factory SKU or equivalence of every phaseIII liquid grade. No cold self-supporting state, common patent/factory, fixed recipe, operating condition or present legal/quality approval is inferred."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "The whole reference Product is Semi-finished rubber parts / 半成品橡胶部件, with a Mass reference, China production-mix and calendering or extrusion and cutting hard fields. Its complete comment explicitly covers sheets/profiles cut to size; it does not fix a polymer purity, virgin-only supply or vulcanization state. Preserve native CPC36220 as countermetadata. The admitted reclaimed grade must independently meet the actual source, phase, whole composition and cut-geometry conditions; a label alone cannot override native fields. The input Product Rubber Powder / 胶粉 identifies screened scrap-tyre powder before reclamation, not the final transformed product; its native CPC36113 countermetadata and at-plant context remain visible. Keep residual fillers, carbon black, oils, water and all actual constituents within each whole supplied material. Neither a pure polymer nor a component UUID substitutes for the filled reclaim."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "Include actual pitch receipt and storage, weighed mixing, preheating, screw-driven thermal/mechanical reclamation, cooling/degas extrusion, sheet die, cutting, bagging, handling and quality release, including startup, failure, idle, rework and cleaning. The source material table and process diagram name tyres and tall-oil pitch, while generic equipment/process text also mentions powder/liquid aid stations and grade-dependent additions. Preserve that limitation: equipment labels do not establish chemical use or absence, and the report is not a complete transferable formulation. Obtain the actual whole supplied formulations, supplier/lot and composition for the chosen grade; every actual additional chemical needs its own concrete atomic card before a study is complete. Do not invent powder ingredients, a powder-free recipe, pure-chemical substitutions, dose, yield or universal operating settings."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "Fix first acceptance after the actual cut configuration, documented grade/quality release, whole-product net weighing and declared packing configuration. Independently sum unique first-accepted whole wet masses into Q and lock each original cohort. Do not use annual reported production, dispatch, a nominal piece/box mass, dry rubber or a polymer equivalent as Q. The postgate bridge partitions Q on its original acceptance basis into disjoint net retained external deliveries, all actual on-site accepted states, irreversible losses and terminal dispositions. Returns, recutting, rework and retest do not create a second event. Added material is separately traced; do not restore evaporated water/material into surviving mass and also count its loss. Later old-cohort services use original Q0. Zero/unknown Q preserves raw totals and an unresolved normalized result."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "The actual same-site gas and water treatment operations remain inside the physical boundary. The report documents separate high-load thermal treatment/alkaline spray, low-load bag-filter/activated-carbon control, heated gas/buffer condensate collection and site wastewater treatment. A genuinely qualified linked producer must retain its complete actual boundary, full native record/reference property/unit, feed state/composition, fuel, electricity, air/O2, water, whole chemical formulations, reactions, final species, heat, filters/adsorbents, wastes, capital/maintenance and inherited histories once. An expanded representation must enumerate every actual atomic exchange instead. These alternatives cannot be added together or replaced by generic disposal. No available qualified dataset, electric-only configuration, complete capture/conversion or zero residual is asserted. Retain actual high/low-gas, condensate, wastewater and receiver interfaces and their non-overlap through the complete coupled chain."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "Each actual whole contaminated-object or liquid-mixture receiver transfer retains complete physical Qt and the receiver once, including substrate/tare, retained rubber/oil/liquor/solids and water. Nested constituents are not extra exports unless physically separated before the boundary. Keep a volumetric wastewater transfer distinct from measured receiver mass and actual compatible treatment units; no pure-water conversion is assumed. Model separate non-overlapping cohort service demands A whose sum equals actual provider demand, using original Q or Q0 for normalization. Attribution does not shrink physical Qt or charge the full shared event again to every cohort. Unknown causal shares/provider conversions remain unknown. Internal reject/rework movements keep their own material/history and cancel on consolidation; they are not new procurement, accepted output, an automatic external waste or a credit."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "For fugitive particles and vapors, use the complete EPA600/2-76-089c quasi-stack capture/pretest/measurement/QA context only where the source can actually be isolated and its full plume captured without changing the process or emissions. Prove capture, intact transport/wall recovery, source representativeness, inlet-background subtraction and complete event coverage; a factory-boundary concentration is not a mass rate. The 1976 manual has inconsistent turbulent/laminar wording and purportedly unchanged duct-diameter coefficients; adopt none of its sizing equations, dimensions, velocity/fan factors or numerical accuracy promises. Use the complete applicable EPA Method5 isokinetic filter/front-half gravimetric procedure for particle mass, with actual phase/temperature-defined catch, blanks, leak/calibration/traverse/flow/moisture and recoveries. Its operational particulate definition is neither pure rubber nor every condensable or droplet constituent. Qualify actual Methods1/2/3/4 and other required dependencies separately; no claim that every dependency or actual enclosure is already qualified. If complete capture or an essential measurement relation is not established, the affected study remains incomplete rather than substituting a concentration or zero. Use complete applicable source-gas analytical procedures and actual method/matrix proof. EPA Method18 supplies a compound-specific organic-vapor GC framework with calibration, preservation, recovery and applicability exclusions, including compounds polymerizing before analysis. EPA Method320 and its complete Protocol/addendum require actual IR-active vapor reference spectra, conditioning, interferent evaluation, dynamic spikes/recovery, transport/condensation controls, uncertainty and time coverage. They are not bulk-liquid/rubber assays or blanketN2/O2 methods. The manufacturer report cites ambient-air HJ584 for organized-stack toluene/xylene: preserve that scope counterevidence, not automatic matrix qualification or a transferable factor. Keep NMHC/COD/volatile-loss group results and censored observations as reported; do not turn them into a chemical species, dry polymer, water or zero. Actual quality conventions and composition methods must fit the chosen grade. An unknown essential procedure or unqualified provider keeps the affected study unresolved; a future SOP, source registration or finite check cannot grant scientific approval."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Require all actual exchanges, whole physical histories, compatible providers and genuinely applicable methods before declaring a study complete. Unknown essential relations remain unresolved; no mechanical pass or future SOP closes a known core identity/method conflict."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "gztyre-reclaim-2025; xinxiang-reclaim-cut-2015; ilcd-attributional-2010; un-cpc3-notes; un-cpc3-intro; abf-hs40-current; epa-method18-2025; epa-method320-2019; epa-method5-2017; epa-quasi-stack-1976"
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "The admitted whole Chinese reclaimed sheet/strip family with the declared Chapter40 rectangular-cut form with complete actual producer/cohort boundaries"
  excluded_use: "Unchanged crumb, bulk unformed liquid, profiles or further-worked shapes outside the declared HS4003 form, new pure polymer, virgin compounding, revulcanized articles, environmental-benefit or current legal-approval claims"
  required_metadata: "actual whole reclaimed tyre grade and China production; actual admitted rectangular sheet/strip die-formed and cut geometry at the gate; source liquid-grade wording and actual temperature/phase history; whole formulation and supplier lot and retained filler/oil/water; actual screened-powder producer and waste-origin boundary; fixed first-acceptance Q and complete original-cohort bridge; raw/WIP/FG/rework/return and inherited histories; actual utility gas/water state and native provider units; full included high/low-gas and wastewater producers once; whole packaging tare delivery return and asset fleets; actual analytical matrix and isomer/group/censored-result basis; complete whole waste receivers and disjoint cohort service vectors; site period original Q0 and unknown causal/provider relations"
  required_quality_disclosure: "All actual source/grade/phase/formulation limits, Q/Q0 and physical stocks, provider bodies/units/histories, analytical scope/censoring and unresolved scientific/study states"
  update_trigger: "Changed grade/formulation/phase/shape/China/provider, actual process or control configuration, gate, source/method scope or unresolved-unit/causal evidence"
