      markdown: "## 7. Allocation and Co-product Handling\n\nKeep full physical coproduct/waste/stock quantities independent of attributed burdens. Subdivide genuinely separable operations first, then use evidenced exchange-specific determining physical causality; only justified residual joint burdens may use same-gate market value with actual prices and sensitivity. This is a bounded attributional hierarchy, not a recycling cutoff or fixed share. Actual tyre-processing steel/textile outputs remain real physical outputs within that producer, not automatic credits against reclaim Q. Internal loops, cooling returns, packaging and waste do not create a second functional product. Unknown causal/provider relations remain unresolved; own WIP history and old-Q0 services are not assigned twice.\n\n`ilcd-attributional-2010`\n\n"
