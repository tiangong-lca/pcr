allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "foreground_burden_allocation"
    rule: "Avoid allocation by actual subdivision/direct attribution. Remaining exchange burdens use demonstrated determining physical causality for each exchange/function; only residual multifunctionality lacking such a relation uses justified actual exit-state market values. Full physical coproduct, waste, packaging and tool stocks/transfers never shrink with environmental shares. Internal recycle, returned containers, failed/uncured material and treatment service are not automatic coproducts or substitution credits. Actual saleable recovered solvent needs whole composition/state/function and complete recovery burdens; no neat-solvent/zero/recycling credit assumption. Sources:ilcd-allocation-2010;epa-frp-prevention-1991."
    source_ids:
      - ilcd-allocation-2010
      - epa-frp-prevention-1991
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "dome_line"
      flow_role: "Whole finished article and original gateQ"
      record_type: "unnormalised actual records"
      raw_fields: "article/segmentID; drawing; resin/glass/gelcoat/embeddedcomponents; fullroute; cured/cleanedstate; actualbarekg; independenttare; dimensions; moisture/finish; test/firstrelease/reject; parentreturnIDs"
      collection_method: "Quality officer: weigh whole qualified bare shells on calibrated scales at one fixed actual completed-cure/clean firstgate; verify material/shape/finish/embeddedcomponents against actual approved drawing and nativewholeProduct. Retain actual supplier cure/test method and uncertainty, all failures/destructive specimens and original unique eventIDs. Counts, nominal density, area or catalog examples never establish kg."
      unit: "kg"
      frequency: "each event/lot and complete meter/stock period"
      temporal_coverage: "all actual production/tool/stock and oldcohort histories including failed/zero-output periods"
      site_scope: "actual factory, suppliers and complete linked producers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original assays/tickets; actual method/sampling QA; complete provenance and uncertainty"
    - protocol_id: cp_materials
      process_id: "dome_line"
      flow_role: "Whole formulations and actual dosing"
      record_type: "unnormalised actual records"
      raw_fields: "lot/provider/SDS/CoA; rawwholekg; polymer/monomer/carrier/pigment/filler; initiator/speciation/activeoxygen conventions; actualseparatedosing; opening/closing tanks/WIP; recoverystocks; supplierhistory; failedruns"
      collection_method: "Materials accountant/laboratory: retain raw whole receipts/consumption and actual mixture certificates with independent component/state assays. Establish actual purchasedpremixes versus onsiteformulation; independently log every actual ingredient/dose and add its exactatomic row before qualification, without doublecounting preincluded styrene/catalyst/carrier. Complete actual upstream resins/glass/gelcoat and transport are matched, no virgin/recycled or polymerproxy assumption."
      unit: "kg"
      frequency: "each event/lot and complete meter/stock period"
      temporal_coverage: "all actual production/tool/stock and oldcohort histories including failed/zero-output periods"
      site_scope: "actual factory, suppliers and complete linked producers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original assays/tickets; actual method/sampling QA; complete provenance and uncertainty"
    - protocol_id: cp_utilities
      process_id: "dome_line"
      flow_role: "Actual utilities and linked producers"
      record_type: "unnormalised actual records"
