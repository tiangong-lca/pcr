  calculation_rules:
    - id: event_basis
      applies_to: "all inventory rows"
      rule: "Q=sum unique positive original barefirstrelease netkg at one actual cured/cleaned gate; no additional event for return/rework/retest/dispatch. Keep full physical postgate states/dispositions independently."
      inputs:
        - original_eventIDs
        - cp_acceptance
        - cp_cohorts
      output: "originalQ and full physical bridge"
      source_ids:
        - stromberg-gfrp-specification
    - id: cohort_attribution
      applies_to: "all inventory rows"
      rule: "Construct attributableA from openingWIP inherited exchangevectors plus all incurred period loads including failures/idle/destructivetests, less independently substantiated closingWIP carry and traced other dispositions. Later services retain originalcohortQ; providerembedded and own decomposed history cannot overlap. Physical whole transfers/stocks remain full separately."
      inputs:
        - cp_cohorts
        - cp_materials
        - cp_utilities
        - cp_recovery
        - cp_assets
        - cp_pack
      output: "actual attributableA in compatible provider units"
      source_ids:
        - ilcd-allocation-2010
    - id: normalize_cohort
      applies_to: "all inventory rows"
      rule: "For each modelled exchange divide actualattributableA in compatibleunits by original positiveQ inkg exactly once. Reference eventdome_shell isQ/Q=1kg; it is not an extra physical external transfer. WholewasteQt/Qanalysis or packageBt/Qanalysis is a distinct physicalanalytical display, not automatically each cohort’s modelled demandA/Q. Zero/unknownQ leaves raw totals unresolved."
      inputs:
        - A
        - Q
        - cp_cohorts
        - cp_acceptance
      output: "one exchange amount per1kg reference flow"
      source_ids:
        - ilcd-allocation-2010
    - id: physical_chemical_closure
      applies_to: "all inventory rows"
      rule: "Whole-mass and actual relevant C/H/O/Si/other-element ledgers are independent of environmental allocation. Track actual resin/gelcoat/fibre/retained release agent/finish components, supplied carriers and moisture, uncured/cured stocks, reaction incorporation/by-products, evaporation, liquidwaste and true outlets. No generic thermoset reaction yields default water, CO2, zero loss or a density. Physical stream closure and elemental assay do not identify an unknown molecular species, and a residual cannot determine two unknowns. Waste solvent or recovery condensate is weighed as the whole mixture with nested resin/monomer/water components, not automatically neat acetone or clean water. Sources:epa-frp-fabrication-2007;epa-frp-prevention-1991."
      inputs:
        - cp_materials
        - cp_recovery
        - cp_species
        - cp_assets
        - cp_pack
      output: "independent wholemass/element/species/water ledgers and gaps"
      source_ids:
        - epa-frp-fabrication-2007
        - epa-frp-prevention-1991
  data_quality_requirements:
    - id: identity_gate
      applies_to: "reference and actual lot"
      requirement: "Real whole thermosetglass/polyester shaped article and native/finishedstage fit, explicit actualgrade/drawing/geometry/embeddedcomposition; no component or unrelated productproxy."
      evidence: "cp_acceptance; fullnative/source context"
    - id: complete_manufacture
      applies_to: "actual producers and material route"
      requirement: "Full pattern/mould/dosing/gelcoat/sprayup/rolling/cure/demould/finish/test and actual utilities/cleaning/treatment/source-specific chemistry; every real added material or emission has atomic identity before study use."
      evidence: "cp_materials; cp_utilities; cp_species; cp_recovery; cp_assets"
    - id: three_ledgers
      applies_to: "all actual histories"
      requirement: "Full physical stocks/transfers, unique originalQ and nonoverlap attributable provider/environment vectors are separately complete; preserve unknownshares/units and all actual receivercomposition."
      evidence: "cp_cohorts; cp_assets; cp_pack"
    - id: source_limits
      applies_to: "sources and quantities"
      requirement: "All full source qualifications/alternatives/contradictions retained in bothnormative projections; no source fraction/density/mass/life/factor/certification or available-provider default."
      evidence: "section9 complete units; original sources; actual studyrecords"
validation_rules:
  - rule_id: validate_whole_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Verify real cured/cleaned wholeGFRPshell/segment and actual composition/drawing/gate/provider; reject rawcomponent, PPpedestal, mixedroof and namedneighbour proxies."
    source_ids:
      - stromberg-dome-manufacture
      - wco-hs2022-ch39
  - rule_id: validate_actual_route
    applies_to: "foreground_dataset_conformance"
    rule: "Retain complete actual known tooling, formulation/dosing, forming/cure/finish and utility/treatment hardware with qualified fullproducer interfaces; no dummy background or futureSOP closure of a true coremethod/identity conflict."
    source_ids:
      - epa-frp-fabrication-2007
      - epa-frp-prevention-1991
  - rule_id: validate_accounts
    applies_to: "foreground_dataset_conformance"
    rule: "Verify originalpositiveQ, complete rawstocks/history/dispositions, one A/Q division and separately full physical Qt/Bt and nonoverlap providerdemands; no duplicated attachedmaterial waste, loops or inheritedburden."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_complete_context
    applies_to: "foreground_dataset_conformance"
    rule: "Every complete qualification below must remain in both language normative units; source tables and short summaries alone are insufficient."
    source_ids:
      - stromberg-gfrp-specification
      - cbp-cupola-1993
      - epa-frp-fabrication-2007
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "This subtype is a manufactured, cured and cleaned rigid GFRP ornamental dome shell or genuinely finished shaped shell segment, including its actual polyester gel coat and glass/polyester laminate. It is not raw resin, glass roving, a flat/profiled feedstock, an injection-moulded PP pedestal, sanitaryware, pipe, floor/wall covering, a door/window, an appliance enclosure or a complete prefabricated building. A shaped factorysegment is an actual finished building article in its own right; no whole installed roof-system performance is claimed. The selected unit is netkg of that whole article at one fixed first-quality-release gate, never an assumed per-dome weight, area conversion or packing-only receipt. Sources:stromberg-dome-manufacture;un-cpc3-2025."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "The actual whole native Product is Glass Fiber Reinforced Plastics, officialChinese玻璃钢制品, with Production mix, in the factory and Production of FRP name components. Its hard comment specifies fine glass fibres combined with a THERMOSETTING resin. It has no fixed CAS, purity, geometry, grade, glass fraction, finish, supplier or geography. Primary product/process evidence and actual lot/drawing/composition/cured-state/gate admission must establish that the whole terminal shell is this composite article; a glass or polyester component, raw thermoplastic pellet, uncured feed, mould or unrelated end product is not a proxy. NativeCPC37117 remains contrary metadata, not silently edited or used as sole fit/rejection. Its promotional strength/eco-friendly comment is not scientific proof, a provider or an impact claim."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "CurrentCPC3.0 names the residual builders-ware leaf separately from plastic semi-manufactures, pipe, covering, sanitary, packaging and appliance/electrical neighbours. WCOHS2022Chapter39Note11 applies only when no earlier sub-ChapterII heading covers the actual product, and11(h) explicitly names ornamental architectural cupolas. Complete heading3925 distinguishes tanks, doors/windows, shutters/blinds and residualOther; this candidate uses the actual shaped ornamental cupola branch. Historical primaryCBPHQ952857 describes actual Stromberg cupola-domes of unsaturated polyester dissolved in styrene/catalysts plus glass fibres, and explicitly classifies them under392590 throughNote11(h), while its cast-stone and glass-reinforced-plaster products are different. The1993ruling is a historical product case; no old duty, present legal approval, currentSKU/factory recipe or accepted PCR edge is inferred. Sources:wco-hs2022-ch39;cbp-cupola-1993;un-cpc3-2025."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Complete manufacturer fabrication context: approved drawings lead to a carved model, then a mould made from fiberglass, steel, wood or rubber according to detail; a designed mix of polyester OR epoxy resin is sprayed with alkali-resistant glass fibres. The dome-specific source describes a thin rigid laminate shell: polyester-resin gel coat is sprayed into a mould, and after it becomes tack-free layers of chopped glass fibre OR glass fabric and resin are added; reinforcing ribs, rods and struts may be added if necessary, and gel coat may be pigmented or painted. This method selects the real polyester-gelcoated chopped-glass open-mould branch, preserving those alternatives rather than claiming one common recipe or forcing epoxy/fabric/coating/reinforcement into it. Actual supplier and approved drawing determine whether a proposed lot fits. Sources:stromberg-gfrp-fabrication;stromberg-dome-manufacture."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Preserve the manufacturer’s full material qualification, including conflicting values: itsGFRPspecification lists a moulded surface over glass-reinforced polyester laminate with structural reinforcing as required; UV-inhibitedNPG-ISO polyester gel coat AND polyurethane as surface options; isophthalic polyester resin, E-type random chopped glass, glasscontent25–30wt% AND glasscontent15wt%maximum, nominal/minimum shell and gelcoat dimensions, specificgravity1.5 and mechanical/fire/tolerance examples. These are not one self-consistent measured lot recipe. Do not pick a convenient fraction, infer density or transfer its old test thresholds as category defaults. Current fabrication page says alkali-resistant glass while the archivedspecification saysE-type: actual reinforcementgrade/finish must be verified, not silently unified. The source additionally requires unit/drawing serial identification and cure/clean before shipment; its removal-of-incompatible/toxic-material language is not an independent non-toxicity certification. Sources:stromberg-gfrp-specification;stromberg-gfrp-fabrication."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Whole-product limits include the actual source counterexamples. The dome page describes large pie-shaped factory sections bolted together on site, optional ribs/rods/struts, an exterior fiberglass roof on a GFRCcornice/drum, and a fiberglass–insulation–fiberglass sandwich; another example is GFRS/stone-faced material. These are not an all-GFRP whole installed assembly. This method may bind the complete cured shaped GFRPshell/segment only when its actual delivered composition fits the nativefamily and its full forming/finishing history is included. Required embedded hardware, core, insulation, stone/gypsum/cement, polyurethane finish or additional components cannot be deleted to force that binding: identify each actual material and review the whole endpoint. Onsite bolts, framing, insulation, installation and field painting do not silently become part of a bare factoryshell. Sources:stromberg-dome-manufacture;stromberg-gfrp-specification."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "The genuine manufacturing boundary includes actual drawing/pattern/mould production and maintenance, release preparation, resin/gelcoat receipt/storage/mixing/dosing, gelcoat application, chopped-fibre/resin spray layup and rolling/consolidation, cure, demoulding, actual trimming/drilling/cleaning/identification/testing and first release. Actual in-house tooling is not removed by calling a mould an external service: either retain its complete own material/energy/waste/emission history or link a separately modelled COMPLETEactual producer with matching whole-tool physical interfaces. A public generic mould/background is not presumed available or qualified. Same-history aggregate provider and decomposed actual inputs cannot both be added. Sources:stromberg-gfrp-fabrication;stromberg-dome-manufacture;epa-frp-fabrication-2007;epa-frp-prevention-1991."
    source_ids: []
  - rule_id: validation_rule_12
    applies_to: "foreground_dataset_conformance"
    rule: "Purchased whole laminating-resin solution and gelcoat preparations are each weighed once with actual polyester, styrene, pigment/filler/promoter/inhibitor/carrier assays nested. Upstream resin manufacture is complete and separately qualified; polyester-backbone condensation chemistry is not silently located in the shellfabrication unit. Actual separately dosed styrene and actual curing-agent preparation are separate inputs; a preincluded ingredient is not purchased again. EPA documents prepromoted resin in tanks/drums, gelcoat and resin with separately hand-mixed or gun-injected catalyst, and typicalMEKP/BPOalternatives; none is an imposed Stromberg factoryrecipe. Before study use, establish actual purchased-versus-inhouse formulation and the exact individual additive/initiator supplies with atomic cards. No guessed pigment, filler, styrene/catalyst percentage, promoter or phlegmatiser is authorized. Sources:cbp-cupola-1993;epa-frp-fabrication-2007;epa-frp-prevention-1991."
    source_ids: []
  - rule_id: validation_rule_13
    applies_to: "foreground_dataset_conformance"
    rule: "A commercialMEKPcuring preparation is a whole actual supplied formulation, potentially a mixture of peroxide species and carriers; an active-oxygen assay is not automatically a massfraction of one pureMEKPformula, free water or carrier. BPOpreparations likewise retain actual wetting/carrier composition. Record complete supplied mass and supplier assay/speciation conventions, independent density at actual state where used, and actual consumed/retained/waste components. Thermal/chemical cure consumes reactive styrene and initiator into products and by-products; do not conserve each reacting molecule or assume all monomer evaporates. Crosslinking actual polyester/styrene is distinct from upstream condensation; reactionwater and all gas/condensate must have independent actual chemistry/extent evidence, not a theoretical recipe or fitted residual. Sources:epa-frp-fabrication-2007;epa-frp-prevention-1991. Additional primary formulation basis:nouryon-mekp-basis-2026; not a selected factoryrecipe."
    source_ids: []
  - rule_id: validation_rule_14
    applies_to: "foreground_dataset_conformance"
    rule: "Retain actual utility, ventilation, extraction, booth, cleanup, recovery and treatment units with their complete real burdens. Airless versus air-assisted spraying, ambient versus actual heated cure, water/substitute-solvent versus acetone cleaning and any controls are actual configurations, not default plant hardware. Separately modelled on-site combustion/recovery/treatment producers require matched whole gas/liquid/condensate interfaces and full actual reagent/fuel/air/O2/water/energy/species/waste inventories. Do not call known on-site equipment offsite, omit it to fit a purchasedutility label, or link an empty disposal stub. No fixed VOC suppression, capture efficiency, factor or assumed zero/available provider closes that evidence need. Sources:epa-frp-fabrication-2007;epa-frp-prevention-1991."
    source_ids: []
  - rule_id: validation_rule_15
    applies_to: "foreground_dataset_conformance"
    rule: "Measure actual final styrene and acetone species/medium separately from totalVOC, gas transferred to treatment, resin aerosol and glass/composite particulate. Use matrix-appropriate sampling/speciation/QC and matched integrated gas volume or measured rate integration; never multiply integrated volume by time again. Separate chopped loose glass from actual resin-coated aerosol and cured composite dust by real composition/morphology/size evidence; totalPM cannot become pureglass by assumption. Count true final receiver/provider releases once, preserving fugitive/startup/upset and nondetect uncertainty. EPA factors describe monomer evaporation and do NOT include cleanup-solvent emissions; this PCR adopts no historical factor, suppression range or unqualified sampling method as a universal default. Sources:epa-frp-fabrication-2007;epa-frp-prevention-1991."
    source_ids: []
  - rule_id: validation_rule_16
    applies_to: "foreground_dataset_conformance"
    rule: "Maintain three independent accounts: full physical raw/WIP/finished/tool/container transfers and stocks; the unique original first-acceptance eventsQ; and attributable environmental/provider-service vectors. Lock each event’s original bare netkg and declared cure/finish/moisture basis at the fixed quality gate. Q is the sum of unique positive original events, not another external physical output. Returns, reinspection, reworking, reshipment and stockmovement create no second acceptance. Do not restore lost material/water to survivors while also counting the loss; later measured mass/finish/moisture changes are separate physical changes and original-basis conversions, not a new or retroactively enlargedQ."
    source_ids: []
  - rule_id: validation_rule_17
    applies_to: "foreground_dataset_conformance"
    rule: "The general original-basis postgate bridge partitions disjoint net remaining deliveries, every actual on-site accepted state, irreversible losses and other terminal dispositions. Gross return/rework loops cancel by genealogy; delivery plus closingFG works only when no other states/exits exist. Keep all actual physical raw/WIP/finished/equipment/chemical-tank/tool/container histories separately, including opening inherited vectors, failed/zero-output/destructive-test loads and actual closingWIP carry to future cohorts. Later services retain the original cohortQ. Do not add an upstreamaggregate history and the same decomposed history twice. Zero/unknownQ keeps raw totals and the result unresolved, never division or deletion. Material-changing repair requires actual manufacturer permission, compatible drawings/materials and acceptance, independently measured added/removed materials, repairWIP and specific atomic cards; source promotional repairability does not authorize a repair branch or life extension."
    source_ids: []
  - rule_id: validation_rule_18
    applies_to: "foreground_dataset_conformance"
    rule: "Whole-mass and actual relevant C/H/O/Si/other-element ledgers are independent of environmental allocation. Track actual resin/gelcoat/fibre/retained release agent/finish components, supplied carriers and moisture, uncured/cured stocks, reaction incorporation/by-products, evaporation, liquidwaste and true outlets. No generic thermoset reaction yields default water, CO2, zero loss or a density. Physical stream closure and elemental assay do not identify an unknown molecular species, and a residual cannot determine two unknowns. Waste solvent or recovery condensate is weighed as the whole mixture with nested resin/monomer/water components, not automatically neat acetone or clean water. Sources:epa-frp-fabrication-2007;epa-frp-prevention-1991."
    source_ids: []
  - rule_id: validation_rule_19
    applies_to: "foreground_dataset_conformance"
    rule: "Actual supply drums, roving cartons and protective transport crates are whole individual articles with declared actual material/liner/tare/ownership/stock histories; no universal drum volume-to-mass, woodcrate, PEwrap or fixed protectivefiller is assumed. The domeFAQ establishes crating, but does not identify crate material; a wooden-box description for a GFRC product is not this GFRP packaging recipe. Record every actual included package receipt, attached inward/outward movement, return and discarded receiver transfer independently from netQ and inherited burdens. Group only genuinely identical whole articles; separately supplied liners/wrap/packing/fasteners need their own atomic cards and full upstreams before study use. Empty tare/residual contents are components, not duplicated purchases/physical wastes. Sources:stromberg-dome-faq;epa-frp-prevention-1991."
    source_ids: []
  - rule_id: validation_rule_20
    applies_to: "foreground_dataset_conformance"
    rule: "Moulds, patterns, cloth and filters retain full actual dimensions, whole mass, installed/spare/received/returned/retired stocks, chemical charges and serving histories. Service attribution does not invent per-item mass, fleet shrinkage, lifetime or a common cohort. A discarded contaminated filter, catchpaper, wipe, drum or crate is ONE whole actual receiver transfer containing substrate plus retained resin/glass/solvent/liquor and water once. Nested drysubstrate and retained components are not additional external waste or treatment demands unless physically separated before the boundary. Separately collected trim/dust is a distinct physical stream only when actually removed into its own receiver. Sources:epa-frp-prevention-1991."
    source_ids: []
  - rule_id: validation_rule_21
    applies_to: "foreground_dataset_conformance"
    rule: "For shared articles or waste, record full actual receiverQt and full actual provider quantity once, known component/physical-cohort provenance separately, and distinct evidenced nonoverlapping per-served-cohort service/burden vectors with compatible provider units and originalQ. Physical analytical displayQt/Qanalysis is not automatically modelled demandA/Q for every cohort. Do not shrink actual waste mass by a service share or recharge the full transfer to each cohort. Unknown oldcohort, provider units or nonoverlap stays unresolved. Synthetic test only, never empirical default: actual contaminatedfilter10kg=8substrate+2retainedpigment, with supportednew25%/old75% treatmentservice, gives2.5/7.5kg-equivalent demands; newQ100/oldQ200 gives0.025/0.0375kg-equivalent perreference, while the actual receiver still gets10kg once and no extra2kg attached-powder exchange exists."
    source_ids: []
  - rule_id: validation_rule_22
    applies_to: "foreground_dataset_conformance"
    rule: "Primary peroxide qualification: Nouryon’s actual27May2026ButanoxM-50PDS identifies a MEKPsolution in dimethylphthalate, depicts several peroxide structures includingH2O2, and separately reports totalactiveoxygen. Its applications expressly require a cobaltaccelerator and contrast a benzoylperoxide/amineaccelerator system; this is not proof of the actual domefactory supplier, catalyst/promoter or formulation. Promoter identity and embedded-versus-separate dose require actual supplier data and atomic inputs if separately supplied. Its regionalstandardpack uses HDPEcans with the same nominalcapacity but different net solutionfills; neither netfill nor nominalcapacity establishes emptycan mass or a universal count-to-kg conversion. Major decompositionproducts and thermal/storage conditions describe that product context, not normalcure stoichiometry, an assumed emission list, water/CO2 yield, safety approval or processrecipe. No PDSpercentage/density/packsize or lowwater/polarcompound/performance claim is adopted as a PCRdefault. Sources:nouryon-mekp-basis-2026."
    source_ids: []
  - rule_id: validation_rule_23
    applies_to: "foreground_dataset_conformance"
    rule: "Additional complete manufacturer assembly context: the currentGFRPpage says domes/cupolas can be resined together into a one-piece watertight structure, while the dome-specific archivedpage describes pie-shaped segments bolted together on site. These are source alternatives, not a single guaranteed joint, no-joint, bonding or assembly method. This firstgate reference requires actual evidence of the complete shaped factoryarticle being released. A factory or field bonding/assembly branch needs its real individual resin/adhesive/fastener/material interfaces, operations and providerhistory; it cannot be silently omitted if present, or added by name to imply a complete installed dome. Sources:stromberg-gfrp-fabrication;stromberg-dome-manufacture."
    source_ids: []
  - rule_id: validation_rule_24
    applies_to: "foreground_dataset_conformance"
    rule: "Additional complete manufacturer finish/mass limits: source finishes include real copper in fiberglass gelcoat, factory or field goldleaf, paint, embedded mosaic tiles or merely moulded tile patterns; these are distinct actualmaterial/operation cases, not interchangeable appearances. The olddomepage gives a typical2lb/ft2, currentGFRPpage2–4lb/ft2, and FAQ3–5lb/ft2 plus a10ft/300lb example. None is an independently measured bare mass for this actual configuration, a universal density or a count/area-to-mass conversion. Keep actual drawn parts, coating/core/embedded materials, gross/tare/net weighing and dimensional state; do not use source claims of hurricane survival, indefinite life, easyrepair or low shipping impact as category performance, longevity, repair permission or environmental advantages. Sources:stromberg-dome-manufacture;stromberg-dome-faq;stromberg-gfrp-fabrication."
    source_ids: []
  - rule_id: validation_rule_25
    applies_to: "foreground_dataset_conformance"
    rule: "Avoid allocation by actual subdivision/direct attribution. Remaining exchange burdens use demonstrated determining physical causality for each exchange/function; only residual multifunctionality lacking such a relation uses justified actual exit-state market values. Full physical coproduct, waste, packaging and tool stocks/transfers never shrink with environmental shares. Internal recycle, returned containers, failed/uncured material and treatment service are not automatic coproducts or substitution credits. Actual saleable recovered solvent needs whole composition/state/function and complete recovery burdens; no neat-solvent/zero/recycling credit assumption. Sources:ilcd-allocation-2010;epa-frp-prevention-1991."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground manufacture inventory"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual matched cured shaped polyesterGFRPornamental shell/segment after complete real lot/provider/method qualification; installation model remains separate."
  excluded_use: "Wholeinstalledcupola/roofsystem equivalence; arbitraryFRPmarket average; omittedcore/metal/insulation/cement/gypsum; PPpedestal; approval/load/warranty/life/lowimpact claims."
  required_metadata: "All ordered qualifiers, actualplant/provider/time/geography, fullnative/source context, whole material and actualgeometry/state, originalgateQ, complete tooling/raw/WIP/FG/chemical/packstocks, species/phasewater and actual producerinterfaces."
  required_quality_disclosure: "All actual method/matrix/sampling uncertainty, current quantitative/UUID/provider/unit/history/share gaps, material contradictions and distinct scoped document/language review, independent scientific approval, actual-study qualification and mapping acceptance states."
  update_trigger: "Actual change in resin/glass/gelcoat/additives, moulding/cure/finish/embeddedcomposition, geometry/gate/provider, emissions/treatment, packaging/stock/service or new material evidence."
