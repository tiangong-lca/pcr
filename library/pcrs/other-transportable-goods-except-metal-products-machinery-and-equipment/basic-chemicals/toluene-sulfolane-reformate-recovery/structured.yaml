allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "recovery_unit"
    rule: "Retain unallocated whole-stream mass/component/water/energy balances first. Subdivide metered operations and assign directly identifiable product storage, loading and dedicated column duties to the product that causes them. Keep raffinate, benzene and C8-plus product services, mixed residuals and shared solvent recovery visible; no physical coproduct quantity is scaled by an allocation share."
    source_ids:
      - jrc-ilcd-general-2010
      - jrc-lvoc-2017
  - rule_id: allocation_causality
    applies_to: "recovery_unit"
    rule: "For each remaining joint burden, test and document physical causality from measured component recovery and operation responses. Mass share is permissible only for a burden demonstrably driven by handled mass; use a relevant measured constituent share where composition causes the burden. Energy allocation is limited to actual useful energy products on an evidenced calorific/enthalpy basis; chemical BTX and raffinate are not all fuel services. No universal mass or heat-value default applies."
    source_ids:
      - jrc-ilcd-general-2010
  - rule_id: allocation_residual
    applies_to: "recovery_unit"
    rule: "For residual joint burdens without determining physical causality, use disclosed study-consistent economic shares a_i=m_i*p_i/sum(m_j*p_j) across actual useful co-products at their separation gates, using observed same-period net prices, consistent currency and positive value. Document missing/zero/negative-price cases for review, not fabricated shares. Test plausible price sensitivity; do not combine attributed burdens with avoided-product credits. Waste treatment remains with the causing process; internal solvent/water loops, condensate return and captured gas awaiting abatement have no saleable-product share."
    source_ids:
      - jrc-ilcd-general-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "recovery_unit"
      flow_role: "accepted_toluene"
      record_type: "measurement"
      raw_fields: "lot id; immutable first-acceptance event id/time; measured net accepted whole kg; original acceptance basis; assay/water/impurities; specification; liquid state; tare/density; net D_new dispatch and linked returns; FG_new closing accepted stock; disjoint L_new net return/loss/scrap/downgrade/use/rework-WIP destinations; opening FG; retests/reacceptance; failed/rework operations; basis conversions/uncertainty; Q; original Q0"
      collection_method: "Calibrated net weighing or temperature-corrected tank gauging with measured compatible density; chromatographic assay and water analysis. Lock Q to the sum of unique measured first-acceptance event masses. Reconcile the same lots on the same acceptance basis using exhaustive mutually exclusive D_new/FG_new/L_new: subtract linked returns from dispatch and locate their remaining net destination once in FG_new or L_new; resolve actual basis changes without treating gross loops as new quantity. Reacceptance never changes Q. Preserve separate actual-period external exchanges and all raw/WIP/FG stocks."
      unit: "kg"
      frequency: "Every batch or continuous meter; full-period reconciliation"
      temporal_coverage: "One declared complete operating period including start/stop"
      site_scope: "Actual recovery unit and declared route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw assays, immutable event records, complete lot destination reconciliation and disclosed gaps"
    - protocol_id: cp_material
      process_id: "recovery_unit"
      flow_role: "reformate_feed; sulfolane_makeup"
      record_type: "measurement"
      raw_fields: "supplier; exact formulation; whole kg; component assay; feed readiness; fresh supply; transfers; opening/closing raw solvent WIP and carried burden vector"
      collection_method: "Weigh or gauge every fresh receipt; assay representative batches; reconcile independent lean/rich/stripper/recovery/wash transfer meters and sampled components."
      unit: "kg"
      frequency: "Every batch or continuous meter; full-period reconciliation"
      temporal_coverage: "One declared complete operating period including start/stop"
      site_scope: "Actual recovery unit and declared route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw assays, lot reconciliation and disclosed gaps"
    - protocol_id: cp_utility
      process_id: "recovery_unit"
      flow_role: "electricity; indirect_steam; direct_steam; condensate_return; water_makeup; cooling_makeup"
      record_type: "measurement"
      raw_fields: "operation; meter; kWh; steam kg T P dryness enthalpy; return kg state; water kg; evaporative and blowdown terms; supplier convention; losses; calibration"
      collection_method: "Submeter extraction, recovery/regeneration and each column/cooling operation; separate direct and indirect steam and physical water. Reconcile purchased utilities and the complete steam/condensate/water balance."
      unit: "MJ; kg"
      frequency: "Every batch or continuous meter; full-period reconciliation"
      temporal_coverage: "One declared complete operating period including start/stop"
      site_scope: "Actual recovery unit and declared route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw assays, lot reconciliation and disclosed gaps"
    - protocol_id: cp_consumable
      process_id: "recovery_unit"
      flow_role: "clay_charge; nitrogen"
      record_type: "measurement"
      raw_fields: "actual formulation; fresh charge kg; campaign; retained bed mass; removal; blanketing use; meter states; gas conversion; incremental service ledger"
      collection_method: "Record issues and stocks, actual fresh/spent campaigns and independently measured service usage. A shared campaign splits only the service burden by evidenced use; full physical exchange remains in its real period."
      unit: "kg"
      frequency: "Every batch or continuous meter; full-period reconciliation"
      temporal_coverage: "One declared complete operating period including start/stop"
      site_scope: "Actual recovery unit and declared route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw assays, lot reconciliation and disclosed gaps"
    - protocol_id: cp_outputs
      process_id: "recovery_unit"
      flow_role: "benzene_coproduct; c8_aromatic_cut; raffinate"
      record_type: "measurement"
      raw_fields: "stream id; whole kg; all measured constituents; destination; sale/use evidence; separation gate; net price; currency; stocks; burden vector"
      collection_method: "Independently weigh or gauge and assay each distinct output; reconcile acceptance and buyer records without turning an undivided cut into pure components."
      unit: "kg"
      frequency: "Every batch or continuous meter; full-period reconciliation"
      temporal_coverage: "One declared complete operating period including start/stop"
      site_scope: "Actual recovery unit and declared route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw assays, lot reconciliation and disclosed gaps"
    - protocol_id: cp_wastes
      process_id: "recovery_unit"
      flow_role: "solvent_regenerator_residue; spent_clay; process_effluent; cooling_blowdown"
      record_type: "measurement"
      raw_fields: "source; whole kg or volume and density; composition including water; campaign; receiver; treatment; stocks; manifest; leach/analyte record"
      collection_method: "Measure every actual removal and retain separate originating streams, treatment interface and composition. Reconcile fresh/spent and water balances; select real treatment, never assumed generic disposal."
      unit: "kg"
      frequency: "Every batch or continuous meter; full-period reconciliation"
      temporal_coverage: "One declared complete operating period including start/stop"
      site_scope: "Actual recovery unit and declared route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw assays, lot reconciliation and disclosed gaps"
    - protocol_id: cp_releases
      process_id: "recovery_unit"
      flow_role: "captured_vent; benzene_air; toluene_air; oxylene_air; mxylene_air; pxylene_air; ethylbenzene_air; sulfolane_air; sulfur_dioxide_air; nitrogen_air; water_vapour_air"
      record_type: "measurement"
      raw_fields: "outlet; species CAS; phase; concentration; wet/dry gas flow; T P; operating time; controls; captured transfer; final residual; detection limits; water evaporation"
      collection_method: "Screen actual component releases and measure representative routine/start-stop/loading/fugitive conditions; integrate concentration with compatible exhaust flow and hours. Keep transfer and residual boundaries separate; add every other actual species atomically."
      unit: "kg"
      frequency: "Every batch or continuous meter; full-period reconciliation"
      temporal_coverage: "One declared complete operating period including start/stop"
      site_scope: "Actual recovery unit and declared route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw assays, lot reconciliation and disclosed gaps"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Divide each cumulative physical exchange belonging to the newly first-accepted cohort, including inherited upstream/WIP terms, actual failed/rework operations and post-acceptance services/losses within the declared scope, by event-locked positive Q; accepted_toluene equals 1 kg as a reference accounting coordinate, not an additional external physical output. Carry inherited vectors once and add incremental operations once. Retain unallocated physical ledgers and units. Compute separately attributed burden vectors using subdivision and documented joint shares, then divide each cohort vector by its own original accepted quantity Q or Q0. Never erase coproduct mass, shrink Q after losses, count reacceptance again or move opening-FG service into current Q."
      inputs:
        - cp_reference
        - "period records"
        - "cohort ledger"
      output: "per 1 kg reference flow"
      source_ids:
        - jrc-ilcd-general-2010
    - id: acceptance_event_bridge
      applies_to: "recovery_unit"
      rule: "Q = sum of unique measured first-acceptance event masses on the declared whole-product acceptance basis; Q = D_new + FG_new + L_new is a complete same-basis destination check, not a replacement denominator. Net linked returns out of D_new must be located once in FG_new or their actual L_new destination; track internal transfers/reacceptance without adding gross passes. Reconcile measured composition/water/basis changes explicitly. For 100 kg first accepted, 60 kg net dispatched, 30 kg closing FG and 10 kg post-acceptance loss, Q=100 kg and an attributed burden of 100 units gives 100/100=1 unit/kg; the incomplete 90 kg denominator would give 100/90=1.111... and is invalid. Unexplained residuals remain unresolved; never infer zero loss or rewrite Q to force closure."
      inputs:
        - cp_reference
        - "event ledger"
        - "same-basis destination and stock records"
      output: "locked Q and complete destination bridge"
      source_ids:
        - jrc-ilcd-general-2010
    - id: component_balance
      applies_to: "recovery_unit"
      rule: "For each whole stream use measured component kg=whole kg times its measured mass fraction. For total mass and conserved elemental C/H/S, check external input plus opening raw/WIP/FG stocks equals actual external outputs plus closing raw/WIP/FG stocks, with zero net elemental generation. This storage-inclusive physical boundary uses net external dispatch and actual losses/waste/releases once; Q and internal acceptance/rework transfers are not additional external outputs. Keep actual-period physical amounts separate from same-acceptance-basis D_new/FG_new/L_new and reconcile conversions explicitly. For each reactive chemical species X, including sulfolane degradation and water, use opening X + external input X + actual G_X = closing X + external output X + actual C_X; establish actual formation/consumption from matched analysis or supported stoichiometry with measured reaction extent. Unknown species conversion remains unresolved; do not impose species conservation or assume complete degradation. Retain measured losses and uncertainty. Keep raw/WIP/FG burden vectors separate from physical mass. Unknown residual is a finding, never a fictitious product or zero."
      inputs:
        - cp_reference
        - cp_material
        - cp_outputs
        - cp_wastes
        - cp_releases
        - stocks
      output: "unallocated component and water balances"
      source_ids:
        - jrc-lvoc-2017
        - jrc-ilcd-general-2010
    - id: heat_check
      applies_to: "indirect_steam; direct_steam; condensate_return"
      rule: "Calculate net incoming-minus-return enthalpy using measured kg and same-datum states; kJ/1000=MJ. Track direct steam into process water and distinguish clean indirect return. Internal recovered heat/water is not a new supplier input or avoided-heat credit."
      inputs:
        - cp_utility
        - "measured mass"
        - "specific enthalpy"
        - states
      output: "physical heat and water check"
      source_ids:
        - jrc-lvoc-2017
    - id: release_integral
      applies_to: "benzene_air; toluene_air; oxylene_air; mxylene_air; pxylene_air; ethylbenzene_air; sulfolane_air; sulfur_dioxide_air"
      rule: "Integrate species concentration times compatible gas-flow rate times operating duration, correct units, then divide by Q. Sum disjoint outlets/phases only; retain uncertainty and detection limits. Captured vent enters its external treatment once; do not count both captured molecules and treatment final emissions as direct releases here."
      inputs:
        - cp_releases
        - concentration
        - flow
        - time
        - Q
      output: "kg per 1 kg reference flow"
      source_ids:
        - jrc-lvoc-2017
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Confirm whole physical identity, type, phase/composition, property/unit and gate before linking a provider. Ordinary unresolved UUIDs/providers stay explicit gaps, not absent exchanges; product Toluene cannot identify an air emission. Native CPC35499 classification debt does not rewrite chemical CAS/type or the independent official CPC34110 scope."
      evidence: "Native records and supplier/receiver analysis"
    - id: quality_coverage
      applies_to: "recovery_unit"
      requirement: "Cover normal and abnormal operation, component assay variation, solvent degradation, wash and steam-out discharges, actual cleaning/additives, stocks and every output destination. No JRC historical BB2 energy range or vendor purity/recovery number is a plant default. Add all actual omitted atomic exchanges before claiming completeness."
      evidence: "Full-period operations and missing-data register"
    - id: quality_cohorts
      applies_to: "cp_reference"
      requirement: "Prove unique event-locked first-acceptance Q and the complete mutually exclusive same-basis D_new/FG_new/L_new bridge, including actual post-acceptance losses and net returns. Preserve raw/WIP/FG carryover and actual failed/rework burdens once, distinguish physical balances from acceptance events and retain original Q0 for all old-cohort service corrections. Unknown old denominator permits only a raw correction record pending review. Record sampling, basis-conversion and allocation uncertainty without invented tolerances."
      evidence: "Immutable event/lot-linked stock and destination records, burden vectors, calibration and acceptance records"
validation_rules:
  - rule_id: validate_identity
    applies_to: "accepted_toluene"
    rule: "Require one whole liquid commercial Toluene reference output and all qualifiers; reject styrene/polymer, solvent blend, emission, wrong market gate or component-only quantity. Missing core identity blocks usable methodology; generic name alone cannot verify a study."
    source_ids:
      - jrc-lvoc-2017
  - rule_id: validate_quantities
    applies_to: "all inventory rows"
    rule: "Require event-locked Q>0, finite nonnegative physical amounts, explicit signed net-return adjustments, a common period and the bilingual 1 kg basis. Verify unique first-acceptance masses and the exhaustive mutually exclusive same-basis D_new/FG_new/L_new bridge; later loss cannot reduce Q and opening FG, returns, reacceptance or internal loops cannot increase it. Test volume-density and fraction/percent conventions, full steam/return/water separation and storage-inclusive mass/component closure against measured uncertainty without adding Q as an external output. Keep failed/rework burdens and original-cohort Q0. Reject missing destinations, unexplained residuals, component-scaled product reference, recycling as fresh input and double steam heat burdens."
    source_ids:
      - jrc-lvoc-2017
      - jrc-ilcd-general-2010
  - rule_id: validate_allocation
    applies_to: "recovery_unit"
    rule: "Check every saleable output and branch point, evidence for subdivision/causality and residual economic shares. Shares sum to one only for the relevant useful co-functions; retain full physical outputs, no avoided-product credit, waste/return exclusions and original-cohort Q0. Unresolved allocation is study review, never a fabricated passing factor."
    source_ids:
      - jrc-ilcd-general-2010
  - rule_id: validate_completeness
    applies_to: "recovery_unit"
    rule: "Check final atmospheric species/phases, captured gas receiver, BTX/solvent water treatment, spent clay and solvent residue, supplier compatibility and stock vectors. Additional actual additives/emissions require atomic extensions. A passed structural/measurement check does not remove identity/provider/quantity gaps or confer scientific, translation or study approval."
    source_ids:
      - jrc-lvoc-2017
      - jrc-ilcd-general-2010
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared bulk toluene recovery route at its verified plant gate, with complete actual upstream/treatment links and explicit allocation/cohort metadata"
  excluded_use: "Universal toluene production mix; other feed/solvent routes; pure-component quantity substitutes; completed comparative assertion or automatic avoided-gasoline credit"
  required_metadata: "Reference qualifiers; site/time; feed composition/readiness; utilities and steam return; every coproduct/waste/air destination; stock and burden vectors; immutable acceptance events; Q/Q0; same-basis D_new/FG_new/L_new and basis conversions; actual allocation and provider pins"
  required_quality_disclosure: "Native classification debt; unresolved ordinary identities/providers; sampled conditions; analytical uncertainty; missing records; original-source limitations; allocation/price sensitivity; review and study states"
  update_trigger: "Feed readiness/composition, extraction technology/solvent, product gate/specification, steam/cooling/abatement, coproduct use, stock rules or allocation evidence changes"
data_sources:
  - id: "jrc-lvoc-2017"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Production of Large Volume Organic Chemicals (2017), JRC109279, DOI 10.2760/77304; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/JRC109279_LVOC_Bref.pdf"
    used_for: "§4.2.2.2 and Figure4.3, printed197–199/PDF235–237: extraction-ready feed, wet sulfolane loops, raffinate washing, clay and fractionation; §§4.3.1.2,4.3.2.2,4.3.3–4.3.6, printed212–218/PDF250–256: final air, water, solvent/clay waste and utilities. Qualitative route evidence only; historical energy and purity values are not defaults."
  - id: "jrc-ilcd-general-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment—Detailed guidance, first edition March2010, EUR24708EN/JRC48157, DOI10.2788/38479; https://publications.jrc.ec.europa.eu/repository/bitstream/JRC48157/ilcd_handbook-general_guide_for_lca-detailed_guidance_12march2010_isbn_fin.pdf"
    used_for: "§§7.9.2–7.9.3, printed255–272/PDF275–292: subdivision, flow-specific determining physical causality and residual market-value allocation. Cohort/stock handling and first-acceptance rules are explicit PCR foreground-protocol synthesis, not a quoted ILCD factory formula or default allocation factor."
  - id: "honeywell-aromatics-recovery"
    type: "literature"
    reference: "Honeywell UOP, Aromatics Recovery, official technology page, snapshot retrieved 2026-11-06; https://uop.honeywell.com/en/industry-solutions/petrochemicals/aromatics-recovery"
    used_for: "Independent vendor counterevidence distinguishes simplified ED Sulfolane for reformate-splitter overhead from traditional Sulfolane. Vendor purity/recovery/cost claims are not adopted for this wet liquid-liquid route."
