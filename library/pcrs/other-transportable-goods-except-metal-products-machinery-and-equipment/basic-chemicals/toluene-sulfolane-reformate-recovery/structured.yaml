measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use net whole liquid product mass, excluding tank/container tare; 1 kg reference flow is not multiplied by toluene assay. Measure assay separately with cp_reference. First-acceptance Q is locked to the original whole-product event mass; later physical dispositions use measured conversions back to that same basis, not a new Q."
  - id: volume_mass
    applies_to: "reformate_feed; accepted_toluene; water_makeup; cooling_makeup"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert measured liquid volume using measured or traceable composition-specific density at the same temperature and pressure; disclose corrections and avoid converting wet mixtures by neat-toluene density."
  - id: utility_bases
    applies_to: "electricity; indirect_steam; direct_steam; condensate_return"
    required_property_ref:
      name: "Energy and Mass"
      uuid: ""
    required_unit: "MJ; kg"
    rule: "1 kWh=3.6 MJ for electricity. Steam commodity and returned condensate remain kg with recorded states. Heat check=sum(incoming kg times specific enthalpy)-sum(returned kg times specific enthalpy), with a common datum and kJ divided by 1000 to MJ. Keep direct steam/water-stripper recycles separate. Never impose a generic MJ/kg factor or buy the same steam twice."
