system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "recovery_unit"
      rule: "Include receipt/storage, every extraction/recovery/regeneration/wash/clay/fractionation operation, internal transfers, start/stop/cleaning losses, loading and final releases. No upstream refinery unit is duplicated or assumed burden-free. Additional actual chemicals, packaging, regeneration or controls require individual physical exchanges before completeness."
      source_ids:
        - jrc-lvoc-2017
    - rule_id: boundary_acceptance
      applies_to: "accepted_toluene"
      rule: "Q>0 is the sum of net whole-product kg measured at unique first-acceptance events in the declared period, each immutable event/lot counted once on its original acceptance basis. Reconcile Q = D_new + FG_new + L_new for that same newly accepted cohort and basis: D_new is net dispatch after linked returns, FG_new is closing accepted FG, and L_new covers all other net post-acceptance destinations, including actual net returns not already in D_new/FG_new, loss, scrap, downgrade, use and closing transfer back to rework/WIP. Keep these destinations mutually exclusive and exhaustive, resolving basis changes from measured records. D_new+FG_new alone is permitted only with evidence that all other net destinations are zero. Later losses never lower Q; opening FG, purchased product, pre-acceptance rejects, returns, retests, reacceptance and internal gross loops never add Q. Old accepted lots retain their original Q0."
      source_ids:
        - jrc-ilcd-general-2010
    - rule_id: boundary_carry
      applies_to: "recovery_unit"
      rule: "Carry raw-feed, solvent, bed, WIP and FG mass/component stocks with their accumulated upstream and operation burden vectors by lot/cohort. Carry partial raw/WIP burdens forward until first acceptance; add only incremental processing, including actual failed/rejected/rework operations attributable to the cohort, avoiding a second feed burden. Failed output creates no Q before its first acceptance. Accepted material returned to WIP retains its original event and burden vector; reacceptance adds no Q. Opening FG dispatch is a transfer of its original burden. Later storage/loss/return/repair service corrections attach to the original accepted cohort and original accepted quantity Q0; never divide them by current Q. If Q0 is unknown, preserve raw unnormalised burdens and hold the correction, rather than inventing a denominator."
      source_ids:
        - jrc-ilcd-general-2010
boundary_abstraction:
  declared_starting_condition: "Actual extraction-ready reformate received at the recovery unit, with feed composition and upstream readiness evidence"
  starting_condition_role: "foreground_entry"
  product_classification_scope: "CPC 3.0 34110; narrower"
  recursive_input_rule: "Purchased same-category toluene is an evidenced upstream input with burdens, never new recovered output or an internal recycle. Split it into an added atomic input and do not dilute it into production Q."
  upstream_dataset_requirement: "Actual reformate provider includes reforming, splitting and required feed treatment; utility, solvent/clay and external treatment links match composition/property/gate"
  disclosure: "Record actual source plant, feed batch/readiness, all gates, utility return convention, outsourced treatment, omitted operations and inventory gaps"
