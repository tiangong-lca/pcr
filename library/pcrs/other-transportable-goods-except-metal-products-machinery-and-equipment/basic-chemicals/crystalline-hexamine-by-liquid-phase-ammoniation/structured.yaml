      collection_method: "Measure actual components/fleet and whole spent transfers separately; no assumed mass or life. Use real served-cohort histories and compatible provider units for disjoint service/treatment vectors; physical Qt and full receiver quantity once, unknown shares unresolved. Aggregation procedure: attributable numerator or A_c / original Q_c; raw physical totals retained separately."
      unit: "kg"
