system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers unstabilized crystalline hexamethylenetetramine (hexamine, CAS100-97-0, C6H12N4) made by liquid-phase reaction of an aqueous formaldehyde feed with anhydrous liquid ammonia, followed by reaction-heat control, evaporation/crystallization, centrifugation, drying and first finished-product acceptance. Product has no intentionally added stabilizer, dust suppressant or other formulation ingredient. Actual assay, residual water, particle form and impurities are declared; no universal numerical grade, purity, feed concentration, recipe, yield or operating condition is assigned."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Exclude gas-phase formaldehyde feed routes, intentional stabilized/formulated grades, solutions sold as product, fuel tablets, resin manufacture, melamine and other heterocycles, and simple repacking of purchased finished hexamine. Purchased feedstocks and external utilities retain their actual compatible production and logistics burdens. This bounded route uses genuine externally supplied steam and, when present, cooling-water service; an onsite boiler, burner, upstream formaldehyde plant or materially different reaction route requires explicit additional unit operations and atomic exchanges before use."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "Native admission is a whole Product: Hexamethylenetetramine CAS100-97-0, white crystalline compound, factory production mix, without hard grade, synthesis-route or geography restrictions. Actual unstabilized crystalline grade must match independently; the UUID supplies no provider, quantity, food/pharmaceutical approval or safety claim. Its Chinese baseName 六亚甲基四胺 is retained exactly, but polluted Chinese aliases in comments are not adopted as chemical identity. The native34150 classification is a disclosed source discrepancy. Current CPC3.0 PDF170 names the specified35230 heterocycle family; WCO2022 Chapter29 PDF18 defines2933.69 under its triazine heading, and USITC2025 explicitly places named hexamine at2933.69.50. These primary distinctions support a narrower proposal, not automatic mapping acceptance or relabeling every heterocycle."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "USITC documents industrial reaction, crystallization, centrifugation, drying and distinct pure versus stabilized grades; its producer-derived quantities and operating examples are not defaults. ATEC independently identifies a liquid aqueous-formaldehyde/anhydrous-liquid-ammonia variant and separately a gas-feed variant. Only the liquid-feed variant is included. Integrated formaldehyde production in the USITC example remains actual upstream production: a purchased-feed interface must retain a genuine compatible producer dataset, not erase methanol oxidation or other supplier operations."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "Receive and meter whole liquid feeds → controlled liquid-phase synthesis → evaporation/crystallization → centrifuge → drying → sampling/packing and first acceptance → actual accepted storage/dispatch. Keep actual mother-liquor return, reaction cooling, vacuum/condensation, washing, abatement and cleaning. No actual duty disappears because the starting card set lacks it. Each additional actual reagent, lubricant, sorbent, utility, packaging component, waste, recovered product or environmental species needs its own atomic card before a complete study is claimed."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "The balanced theoretical relation 6CH2O + 4NH3 → C6H12N4 + 6H2O is a species/element check on the stated anhydrous-equivalent convention, not a recipe, conversion, yield, purchased-feed amount or water-generation factor. Aqueous formaldehyde analysis often reports CH2O-equivalent and can include hydrated/oligomeric forms; that assay is not automatically a free molecular HCHO fraction or free-water mass. Keep whole feed kg, actual stabilizer/methanol, formaldehyde-equivalent assay, molecular speciation and water conventions separately. Do not assume reacting HCHO or NH3 is conserved, complete reaction, zero side products or a universal reaction-water amount. Use actual reaction extent/species evidence, independently checked C/H/N/O and total mass, with unresolved residuals exposed rather than fitted."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "The water ledger distinguishes actual carrier/free/chemically associated water, reaction formation/consumption on the declared speciation convention, washing and cooling make-up, product moisture, mother liquor, wet wastes, condensates, vapour, drains and stock changes. Do not add solution carrier water or methanol as a second purchased input when already in the whole feed. Never count hydration water both in a component convention and again as newly generated water. Loss on drying is not a chemically specific water measurement when other volatiles are possible. Raw evaporation and condensation remain physical phase transfers, not evidence of reaction water or a closure flow."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "Actual externally supplied steam and cooling fluid retain inlet/return mass, temperature, pressure, phase/dryness, enthalpy and provider conditions. A measured heat balance distinguishes reaction heat, recovered internal heat, imported heat, heat rejection, storage and loss. Preserve actual fluid transfers separately from compatible modeled provider demand; do not count mass steam and its already embedded heat twice or invent a mass-to-MJ factor. Outside utility producers retain real energy, fuel, water and emission burdens. An onsite combustion route requires its real fuel, air/O2, formed water, species and heat interfaces and is not covered by hiding it behind this purchased-utility card."
      source_ids: []
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "Use three linked production accounts. The complete physical ledger contains external receipts/returns/dispatches, raw/WIP/FG/rejected stocks, mother liquor, dust, samples, packaging, filter fleets and all actual waste/releases. Equal internal transfers cancel only at the aggregate boundary. The reference-event ledger independently sums Q = sum(m_e) over unique first finished-lot acceptances at one fixed gate, locking original event ID, net mass, moisture and cohort. The attributed burden ledger carries own opening WIP vectors once, new disjoint foreground/upstream vectors, closing carried vectors and terminal assignments. Provider aggregates and their embedded decomposition are alternatives, never additive duplicates. Q is a reference-event account, not another external physical output."
      source_ids: []
    - rule_id: system_boundary_rule_10
      applies_to: "foreground_system_boundary"
      rule: "For every original accepted cohort, reconcile Q0 to disjoint net remaining deliveries, all actual onsite accepted states, irreversible losses and other terminal dispositions on the original acceptance basis. Returns/retests/rework/recycled dust never create a second first-acceptance event. Use delivered-plus-closing-new-FG only when all other postgate states/exits are proven absent; opening FG dispatch is not new acceptance. Do not restore lost solid or water into surviving product and also count that loss. Later external water/additions are physical inputs and removed from original-cohort equivalents without inventing closure. Later handling, service and treatment use the original cohort basis; zero/unknown Q leaves raw records intact and normalized results unresolved."
      source_ids: []
    - rule_id: system_boundary_rule_11
      applies_to: "foreground_system_boundary"
      rule: "For each actually used woven-polypropylene sack and polyethylene liner, retain separate component IDs, actual tare/construction, received/delivered/serviceable-return/customer-return/scrap quantities and opening/closing empty and filled stocks. These are concrete conditional components, not default packaging or a permission to omit other real components. Net hexamine excludes every packaging component. Reuse does not create another manufacture, reference product, co-function or recovery credit. Retained product/liquor/water on a contaminated item are nested contents, not empty tare or a fictitious extra stream."
      source_ids: []
    - rule_id: system_boundary_rule_12
      applies_to: "foreground_system_boundary"
      rule: "Each actual centrifuge cloth and actual polyester dust-filter bag retains its own material, dimensions, substrate mass/count, installation/removal/cleaning history, opening/closing physical fleet, retained chemicals/water and receiver. Supplier manufacturing/service demand requires actual compatible units and actual history across all served original cohorts. No guessed component mass, lifetime, replacement rate or annualization is permitted. Do not shrink a whole spent-filter export because only part of its service burden belongs to the current cohort."
      source_ids: []
    - rule_id: system_boundary_rule_13
      applies_to: "foreground_system_boundary"
      rule: "For each waste transfer, the receiver ledger records one whole actual Qt, its actual composition and full total provider treatment quantity/unit once. Substrate, chemical, water and observed physical-cohort origins are nested provenance accounts only where known. A separate modeled ledger assigns evidenced non-overlapping treatment demand A_c or burden vectors to actually served cohorts in compatible provider units, then divides by each original Q_c. Qt/Q_c is an analytical ratio, not a second modeled exchange or a full Qt charge to every cohort. Unknown shares/history/provider basis stay unresolved. Shared bag/liner attribution applies only with actual shared recipient/service history. Never split physical export using burden shares; never add attached-powder/liquor exchanges or extra treatment demand unless physical separation occurred before the boundary and distinct actual streams reconcile once."
      source_ids: []
    - rule_id: system_boundary_rule_14
      applies_to: "foreground_system_boundary"
      rule: "The chosen liquid-waste interface is measured export to a qualified actual receiver, not assumed zero wastewater or a disguised direct discharge. Mother liquor, condensates and scrubber liquor keep actual destinations and internal returns distinct. Direct environmental liquid releases, recovered saleable products, treatment chemicals or extra species require their own actual atomic rows and supported provider/compartment checks before study completion. Captured dust is internal recycle or measured exported residue; it is not also an air release."
      source_ids: []
    - rule_id: system_boundary_rule_15
      applies_to: "foreground_system_boundary"
      rule: "IS4306:1987 with included1990 amendment is a retained historical industrial hexamine method source: its nonaqueous potentiometric assay and defined loss-on-drying/ammonia tests keep their own sample, reagent, endpoint, blank and reporting conventions. JECFA is a distinct acid-decomposition/back-titration assay on its stated dried sample; do not mix its equivalence with the nonaqueous assay or silently replace as-received whole-product mass by dried assay mass. The complete IS scan and complete JECFA monograph are retained; numerical grade/purity limits, food use, certification and clinical claims are not adopted. Actual laboratory method selection, sampling, interference/recovery and uncertainty must match the real unstabilized solid matrix. A drying loss does not establish water alone or plant effluent/air species."
      source_ids: []
    - rule_id: system_boundary_rule_16
      applies_to: "foreground_system_boundary"
      rule: "CWW2016 supplies chemical-stream inventory and monitoring-quality context, not hexamine-specific emission factors or a validated factory test. Establish actual post-control species, gas flow/moisture/temperature/pressure, sampling recovery/interferences, detection limits, startup/bypass/fugitive paths and uncertainty. CH2O-equivalent analytical reports, total VOC, ammonia-N, total nitrogen, COD/TOC or total dust require explicit species-basis/non-overlap decisions; never assign all to one retrievable UUID. A source-specific analytical procedure not established for the actual matrix leaves the affected scope unresolved; a future SOP promise or finite checker cannot close it. Include actual laboratory reagent/waste burdens as separate atomic exchanges when within the study boundary."
      source_ids: []
    - rule_id: system_boundary_rule_17
      applies_to: "foreground_system_boundary"
      rule: "Whole-waste cards follow actual physical assemblies. If a woven sack and its liner leave together, sack_scrap is one whole contaminated assembly including the liner and all retained contents, with liner/substrate/chemicals/water nested; liner_scrap is used only for an actually separate discarded liner stream. Apply the same rule to actual filter assemblies and their components. Do not invent separation, export both an intact assembly and its nested components, or duplicate provider treatment. Analytical CH2O-equivalent, ammonia-N or other equivalent quantities are companion observations, not additional physical constituents to sum with hydrates, molecules or water; component/element closure uses an explicitly disjoint consistent chemical basis."
      source_ids: []
    - rule_id: system_boundary_rule_18
      applies_to: "foreground_system_boundary"
      rule: "USITC Figure1.2 explicitly shows First Effect → Stripper/Catalytic Oxidizer System → Distillate. This known operation is not replaced by the separate mother-liquor-purge card, presumed offsite or assigned zero burden. For that configuration, retain a complete, actual, separately modeled on-site treatment producer with its real source/owner, process boundary, site/time and provider reference unit. Match actual sender/receiver transfer IDs, whole mass, phase, composition, temperature/pressure and fate on both sides. The schematic alone does not establish whether the selected interface is condensed aqueous liquor, overhead gas or distinct real streams: establish actual phase boundaries; do not invent a phase split or count one stream twice across an internal condensation. Conditional condensate and gas cards are used only for the physically real streams. The distillate-receipt card is used only if that actual treated mixture returns to this unit; other producer outlets keep their real destination and are not assumed pure water, freshwater discharge or a credit."
      source_ids: []
    - rule_id: system_boundary_rule_19
      applies_to: "foreground_system_boundary"
      rule: "The linked stripper/CatOx producer must retain every genuine reagent, fuel, air/O2, water, utility, emission, residue, heat and return interface of its actual configuration, with independent reaction/species/water conservation and complete source-supported inventory. There is no generic-disposal substitute, assumed oxidation recipe, available qualified background claim or permission to omit an actual operation. Qualify the real complete producer and its matched source evidence before complete study use; this PCR does not supply that plant dataset. Represent its actual joint demand/burden vector once across all its inlet/outlet interfaces and all served original cohorts, with evidenced compatible provider units and non-overlapping A_c/Q_c. Do not recharge the full producer separately for each phase card or again for a returned distillate. Paired internal flows cancel only on consolidation while full producer burdens remain once. Unknown producer, phase/composition, control/matrix or units leave the affected result unresolved and block a complete LCI claim; a future SOP or finite checker does not resolve them. A genuinely different documented plant variant must explicitly establish its own actual control boundary, not infer absence from ATEC’s abbreviated description."
      source_ids: []
    - rule_id: boundary_route
      applies_to: "hexamine_production"
      rule: "Include the declared liquid reaction through first acceptance and all actual control/storage/handling duties; no repacking substitution."
      source_ids:
        - usitc-hexamine-2025
        - atec-hexamine-process
    - rule_id: boundary_upstream
      applies_to: "all inputs"
      rule: "Preserve real compatible producer burdens and actual interfaces; do not add provider aggregate and embedded decomposition twice."
      source_ids:
        - jrc-cww-2016
    - rule_id: boundary_species
      applies_to: "all outputs"
      rule: "Actual chemical/water formation, capture, recycle and receiver/environment destinations remain distinct; no zero or closure default."
      source_ids:
        - usitc-hexamine-2025
        - jrc-cww-2016
    - rule_id: boundary_complete
      applies_to: "all inventory rows"
      rule: "Add each additional actual atomic exchange and disclose every missing scope before complete LCI use."
      source_ids:
        - jrc-cww-2016
    - rule_id: boundary_identity
      applies_to: "finished_hexamine"
      rule: "Require actual whole unstabilized crystalline CAS100-97-0 Product fit and declared source discrepancies. Named HS evidence plus current CPC-family context supports only a proposed narrower relation, not automatic mapping."
      source_ids:
        - usitc-hexamine-2025
        - jecfa-hexamine
        - unsd-cpc3-2025
        - wco-hs29-2022
    - rule_id: boundary_methods
      applies_to: "cp_accept"
      rule: "Retain complete selected solid-sample assay/quality procedures and their distinct matrix/sample/equivalence limits; technical use of IS/JECFA is not a numerical grade, food or certification claim."
      source_ids:
        - bis-is4306-1987
        - jecfa-hexamine
