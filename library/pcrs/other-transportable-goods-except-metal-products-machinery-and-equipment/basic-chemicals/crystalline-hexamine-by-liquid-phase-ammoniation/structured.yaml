    - id: dq_methods
      applies_to: "cp_accept, cp_air"
      requirement: "Use actual complete applicable procedures, sampling, recovery/blanks/calibration and uncertainty. IS/JECFA do not establish food approval, all industrial impurities or stack/effluent methodology."
