  calculation_rules:
    - id: acceptance_q
      applies_to: "finished_hexamine"
      rule: "Q = sum of whole net m_e over unique first-acceptance events at the fixed gate; retain original event/cohort and moisture basis once. Loops and returns create no new event."
      inputs:
        - event_id
        - m_e
        - cp_accept
      output: "Q kg"
      source_ids: []
    - id: normalize_cohort
      applies_to: "all inventory rows"
      rule: "Modeled row exchange = its evidenced non-overlapping attributable numerator / positive original cohort Q_c. Waste-treatment numerator is compatible A_c or a separately assigned vector, not full shared Qt for every cohort. Unknown basis leaves raw totals and unresolved results."
      inputs:
        - "row attributable numerator"
        - Q_c
        - cp_accept
      output: "row original unit per 1 kg reference flow"
      source_ids: []
    - id: cohort_bridge
      applies_to: "cp_accept"
      rule: "Q0 = disjoint net remaining deliveries + all actual onsite accepted states + irreversible losses + other terminal dispositions on original acceptance basis, separately excluding later external additions; do not restore loss into survivors and count it again."
      inputs:
        - Q0
        - "actual states"
        - genealogy
        - "additions/losses"
      output: "original-cohort bridge and residual"
      source_ids: []
    - id: physical_and_burden
      applies_to: "hexamine_production"
      rule: "Physical opening + external inputs = physical closing + external outputs with actual reaction/speciation and equal internal links; separately reconcile opening own-WIP vectors + disjoint new vectors = closing carried + terminal attributed vectors. Allocation never creates physical closure."
      inputs:
        - "physical stocks/flows"
        - "species/elements/water"
        - "own/provider vectors"
      output: "separate physical and burden residuals"
      source_ids: []
    - id: assay_companion
      applies_to: "cp_accept, cp_feed"
      rule: "Convert actual method result to its documented as-received/dried/CH2O-equivalent convention only; do not mix IS nonaqueous and JECFA decomposition equivalences, infer free water from nominal assay, or replace whole-product Q by analyte mass."
      inputs:
        - "actual method and sample basis"
        - "laboratory records"
      output: "documented companion assay quantities"
      source_ids:
        - bis-is4306-1987
        - jecfa-hexamine
    - id: utility_and_electricity
      applies_to: "cp_utilities, cp_power"
      rule: "Electrical MJ = measured kWh × 3.6. Steam/cooling heat = measured mass × compatible actual enthalpy difference with declared sign/state; match provider units explicitly, without a default factor or duplicate mass-and-heat burden."
      inputs:
        - "actual meter/mass/state/enthalpy"
        - "provider reference unit"
      output: "compatible actual utility quantity"
      source_ids: []
    - id: species_load
      applies_to: "cp_air"
      rule: "Species load = integral of actual compatible concentration × gas flow × time, with explicit species/equivalent and unit conversion. Preserve carrier moisture and actual post-control/fugitive coverage; unknown conversion is unresolved."
      inputs:
        - "actual concentration"
        - flow
        - time
        - "species basis"
      output: "species mass kg"
      source_ids:
        - jrc-cww-2016
