allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "hexamine_production"
    rule: "Trace actual dedicated feeds and separately metered duties before allocation; conditional real co-products require actual quality/use and determining physical causality, with a disclosed justified alternative for residual joint burdens. No universal shares or avoided-production credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_physical
    applies_to: "all outputs"
    rule: "Keep actual physical co-product, waste and utility-return quantities complete independently of burden shares; internal mother liquor/heat is not a sale or an extra purchase."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_inherited
    applies_to: "all inventory rows"
    rule: "Own-WIP and supplier embedded histories enter once; actual later stock/asset/treatment services retain original cohorts and non-overlapping vectors, not full repeated Qt for each cohort."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_accept
      process_id: "hexamine_production"
      flow_role: "finished_hexamine"
      record_type: "first acceptance and sampling"
      raw_fields: "event_id; cohort; lot; gross/tare/net m_e; moisture/speciation convention; assay method/sample basis; grade; impurities; sampling plan; later returns/states/losses"
      collection_method: "Calibrated whole-product weighing and representative sealed samples; keep IS or JECFA procedure/endpoint/sample basis distinct and laboratory QA traceable. Lock each first acceptance once and reconcile original-cohort states. Aggregation procedure: attributable numerator or A_c / original Q_c; raw physical totals retained separately."
      unit: "kg"
      frequency: "each first lot acceptance and subsequent state transfer"
      temporal_coverage: "complete continuous interval and original cohorts"
      site_scope: "same declared product, route and site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, method/basis evidence, complete stock/provenance and uncertainty checks"
    - protocol_id: cp_feed
      process_id: "hexamine_production"
      flow_role: "aqueous_formaldehyde, liquid_ammonia, process_water"
      record_type: "whole feed and stocks"
      raw_fields: "row_id; whole mass; provider; assay and method; free HCHO/hydrates/oligomers; CH2O-equivalent basis; methanol/stabilizer; water convention; impurities; raw/WIP stocks; receipts/charges/returns; inherited vectors"
      collection_method: "Calibrated weighing/flow metering with actual density if needed; qualified composition and stock balance; separate whole feed from its nested analytical constituents and attributable demand. Aggregation procedure: attributable numerator or A_c / original Q_c; raw physical totals retained separately."
      unit: "kg"
      frequency: "each receipt/charge/return and stock boundary"
      temporal_coverage: "complete continuous interval and original cohorts"
      site_scope: "actual feed interfaces and all reaction units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, method/basis evidence, complete stock/provenance and uncertainty checks"
    - protocol_id: cp_power
      process_id: "hexamine_production"
      flow_role: "electricity"
      record_type: "electricity meters"
      raw_fields: "meter; equipment; kWh; times; idle/rework; provider; voltage; delivery/loss boundary; shared driver"
      collection_method: "Submeter actual drives, controls and attributable ancillary duties; reconcile totals and measured causal drivers; convert electrical units only. Aggregation procedure: attributable numerator or A_c / original Q_c; raw physical totals retained separately."
      unit: "MJ"
      frequency: "meter intervals and equipment states"
      temporal_coverage: "complete continuous interval and original cohorts"
      site_scope: "all included electrical equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, method/basis evidence, complete stock/provenance and uncertainty checks"
    - protocol_id: cp_utilities
      process_id: "hexamine_production"
      flow_role: "steam_in, condensate_return, cooling_water_in, cooling_water_return"
      record_type: "physical utility and provider basis"
      raw_fields: "row_id; inlet/return mass; temperature; pressure; phase/dryness; enthalpy; actual heat/reaction/recovery/rejection; losses/blowdown; provider unit; production boundary; raw stock; original cohorts"
      collection_method: "Measure paired physical fluid interfaces and actual thermodynamic states; close water/heat accounts. Match genuine producer units; document actual enthalpy conversion instead of adding mass and heat background demand twice. Aggregation procedure: attributable numerator or A_c / original Q_c; raw physical totals retained separately."
      unit: "kg"
      frequency: "each utility interval and change of state"
      temporal_coverage: "complete continuous interval and original cohorts"
      site_scope: "actual external suppliers and all included thermal/cooling units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, method/basis evidence, complete stock/provenance and uncertainty checks"
    - protocol_id: cp_pack
      process_id: "hexamine_production"
      flow_role: "sack_in, sack_delivered, sack_returned, liner_in, liner_delivered, liner_returned, sack_scrap, liner_scrap"
      record_type: "packaging transfer and attribution"
      raw_fields: "component_id; construction/tare/count; received/delivered/returned/scrapped; empty/filled stocks; whole waste Qt; substrate/product/liquor/water; receiver/provider quantity/unit; observed physical provenance; actual shared history; evidenced shares; A_c; original Q_c"
      collection_method: "Weigh each actual packaging component/transfer and stock by genealogy; whole contaminated waste and full actual receiver demand recorded once. Nest contents; separately model only evidenced compatible cohort service/treatment A_c, never repeat full Qt across cohorts or infer a shared sack history. Aggregation procedure: attributable numerator or A_c / original Q_c; raw physical totals retained separately."
      unit: "kg"
      frequency: "each packing/return/disposal and stock boundary"
      temporal_coverage: "complete continuous interval and actual histories"
      site_scope: "actual separate sack/liner configurations and receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, method/basis evidence, complete stock/provenance and uncertainty checks"
    - protocol_id: cp_asset
      process_id: "hexamine_production"
