system_boundary:
  rules:
    - rule_id: complete_boundary
      applies_to: "manufacture"
      rule: "Include receipt/storage, actual chemical production, solid recovery and conditioning, packing, failed batches, cleaning and actual environmental controls through first acceptance, with later dispatch/return services tracked to original cohorts. The process receives only actual externally supplied electricity or thermal services under the utility_interface rule; this does not establish positive steam, heat or drying demand. Extend the inventory with individually named actual chemicals and packaging before claiming completeness."
