        - borax-pentaborate-sds-2025
    - rule_id: state_boundary
      applies_to: "pentaborate"
      rule: "Keep supplied tetrahydrate, inventory registry number and native flow conditions separate. Do not promote a classifier match into chemical identity or silently change anhydrous/hydrated quantity bases."
      source_ids:
        - borax-pentaborate-sds-2025
    - rule_id: treatment_boundary
      applies_to: "residual outlets"
      rule: "Track treatment transfers and final releases separately. Include actual ammonia, boron and particulate controls; absence or a zero result requires operational and detection evidence, not an SDS example."
      source_ids:
        - borax-pentaborate-sds-2025
    - rule_id: utility_interface
      applies_to: "utility supply and actual combustion"
      rule: "This restricted process profile receives actual electricity, indirect heat or steam across identified interfaces. An actual on-site boiler or combustion-based utility must remain a separately linked and fully represented producer, including fuel, combustion air/O2, chemically formed water, heat/mass interfaces and actual pollutant outlets; preserve its burdens once in the supplied service. Do not move a paper gate to omit the physical operation. Direct firing within the chemical unit is outside this profile until a complete source-supported unit inventory and actual interfaces are established. No positive heat/steam demand is inferred from dry product state or PDS. Match actual provider output and consumer input, ownership and state. Provider-embedded burdens are not duplicated as new foreground combustion; own raw/WIP carryover is a separate inherited inventory, not a deduction from an unrelated provider dataset."
      source_ids:
        - ec-pef-multifunctionality-2021
        - borax-pentaborate-pds-2024
