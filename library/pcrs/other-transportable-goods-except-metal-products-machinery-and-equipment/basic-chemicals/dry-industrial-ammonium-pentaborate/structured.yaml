    rule: "Separate sites, grades, hydrate states, periods and dedicated stages. Investigate subdivision or expanded-system reporting first; if allocation remains necessary, justify a causal physical relation, then another documented basis and sensitivity. No default mass/economic percentage is supplied."
    source_ids:
      - ec-pef-multifunctionality-2021
  - rule_id: physical_not_allocated
    applies_to: "all physical flows"
    rule: "Keep measured product, residual and emission quantities unallocated. Allocation partitions the LCI burden vector only. Internal recycle is neither a co-product credit nor a new purchased feed; a saleable residual requires declared function, destination and the same allocation account."
    source_ids:
      - ec-pef-multifunctionality-2021
  - rule_id: stock_burden
    applies_to: "raw WIP FG and original cohorts"
    rule: "Track raw materials, work in progress and finished goods by cohort as both physical stock/composition and inherited LCI vector. Carry opening raw/WIP burdens into consumption and unconsumed raw/WIP burdens forward. First-accepted closing FG carries its already assigned production vector; never deduct that FG vector from the first-gate cohort numerator whose Q includes the same FG. Match equal internal links without erasing prior burdens. Later storage, retesting, repacking and return services attach to the original cohort and its locked original Q; do not divide them by new current-period Q."
    source_ids:
      - ec-pef-multifunctionality-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "pentaborate_plant"
      flow_role: "pentaborate"
      record_type: "foreground_record"
      raw_fields: "gate event id; original cohort; first acceptance time; independently weighed net mass; gross/tare; formula/CAS; inventory number; content method/basis; moisture; opening/closing FG; dispatches; other exits; returns/regrades"
      collection_method: "Use calibrated weighing and actual QC release records; deduplicate each first-acceptance event and freeze total Q. Measure Q independently before reconciling all disjoint FG movements; old FG dispatches, returns and retests create no new Q."
      unit: "kg"
      frequency: "Each event and reconciled reporting period"
      temporal_coverage: "Full declared period including startup, shutdown, failed batches and stocks"
      site_scope: "One declared site, route, grade and original cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original records; samples; receiver evidence; uncertainty; cohort ledger"
    - protocol_id: cp_inputs
      process_id: "pentaborate_plant"
      flow_role: "chemical and water inputs"
      record_type: "foreground_record"
      raw_fields: "receipt/issue lot; supplier; supplied state; mass; assay; water; density conditions; raw/WIP opening/closing composition and inherited vectors; internal links"
      collection_method: "Use receipts, calibrated meters, actual issue and stock records; distinguish received, consumed and internally transferred amounts and retain failed-batch consumption."
      unit: "kg"
      frequency: "Each event and reconciled reporting period"
      temporal_coverage: "Full declared period including startup, shutdown, failed batches and stocks"
      site_scope: "One declared site, route, grade and original cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original records; samples; receiver evidence; uncertainty; cohort ledger"
    - protocol_id: cp_energy
      process_id: "pentaborate_plant"
      flow_role: "one external utility interface"
      record_type: "foreground_record"
      raw_fields: "provider and consumer ids; ownership; paired meter/event; supply sent/received; electricity region/voltage/loss boundary; actual indirect heat; steam mass/P/T/quality/enthalpy reference; condensate sent/received mass/state; interval; interface losses; retained/vented steam water; provider inventory coverage; shared driver"
      collection_method: "Measure each actual carrier separately and match the supplying-unit sent quantity to consuming-unit received quantity, with measured transport/interface losses and the same interval/state. Pair actual steam inlet and condensate outlet to both provider ends; reconcile steam water retained in product, residuals, stocks or vapour. Derive net thermal energy only from actual supply/return mass and validated state-specific enthalpies on one common reference, or a suitable actual heat meter; retain enthalpy-source evidence and no universal coefficient. If no heat/steam is supplied, document absence without creating a positive flow. Include a real on-site utility as a complete linked unit, never as unaccounted gas/CO2 rows or an omitted physical boiler."
      unit: "kWh; MJ; kg"
      frequency: "Each matched interface/stock event and reconciled reporting period"
      temporal_coverage: "Full declared period including startup, shutdown, failed batches and stocks"
      site_scope: "Actual producing/consuming units and original product/packaging cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; paired sending/receiving records; original stock logs; uncertainty; cohort vectors"
    - protocol_id: cp_packaging
      process_id: "pentaborate_plant"
      flow_role: "whole HDPE bag receipts stocks dispatch and returns"
      record_type: "foreground_record"
      raw_fields: "bag lot/serial; original and actually serviced product cohort/Q; bag count and weighed empty mass in each direction; matched sending/receiving empty tare; supplier/owner; purchase or consigned receipts with sender pair; customer-return receipts with sender pair; opening/closing empty and packed bag stocks; internal issues/refills; delivered bags and receiver pair; supplier-return bags and receiver pair; rejects/disposal and receiver; unrecovered loss and investigation; inherited manufacturing/service vector; later storage/repacking"
      collection_method: "Count and weigh whole empty bags in every direction, retain sending and receiving tare/condition records, and reconcile all external directions and both empty/packed stocks. Distinguish new purchases/consignment, customer returns, internal reuse, delivered bags, supplier returns and final waste as disjoint events with paired counterparty records; do not treat filling as a new external bag receipt. Retain complete physical bag quantities independently of allocation shares. Carry original manufacturing burdens once; assign later storage, return, cleaning or repacking increments to the original product cohort and its locked original Q, never a new product acceptance."
      unit: "kg"
      frequency: "Each matched interface/stock event and reconciled reporting period"
      temporal_coverage: "Full declared period including startup, shutdown, failed batches and stocks"
      site_scope: "Actual producing/consuming units and original product/packaging cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; paired sending/receiving records; original stock logs; uncertainty; cohort vectors"
    - protocol_id: cp_residues
      process_id: "pentaborate_plant"
      flow_role: "one external waste stream"
      record_type: "foreground_record"
      raw_fields: "origin; whole mass; water/solids; B/N assay; receiver; route; event; internal recycle quantities; zero-output events"
      collection_method: "Use weighed transfer and receiver records and representative sampling. Reconcile individual mother-liquor, dust, solid-reject and wash-water streams separately from internal recovery and final direct releases."
      unit: "kg"
      frequency: "Each event and reconciled reporting period"
      temporal_coverage: "Full declared period including startup, shutdown, failed batches and stocks"
      site_scope: "One declared site, route, grade and original cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original records; samples; receiver evidence; uncertainty; cohort ledger"
    - protocol_id: cp_emissions
      process_id: "pentaborate_plant"
      flow_role: "one actual species or particulate fraction"
      record_type: "foreground_record"
      raw_fields: "source/outfall; receptor; analyte; mass or concentration; integrated flow or flow rate/time; gas dry/wet T/P; moisture; abatement; detection limit; composition/size cut"
      collection_method: "Use actual representative source monitoring and matched physical flows after included treatment. Preserve NH3 versus N, total/dissolved B, particulate and water-species definitions; monitor additional actual emissions individually."
      unit: "kg"
      frequency: "Each event and reconciled reporting period"
      temporal_coverage: "Full declared period including startup, shutdown, failed batches and stocks"
      site_scope: "One declared site, route, grade and original cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original records; samples; receiver evidence; uncertainty; cohort ledger"
  calculation_rules:
    - id: cohort_normalization
      applies_to: "all inventory rows"
      rule: "Attributable first-gate exchange = cohort-linked measured new exchanges plus consumed opening raw/WIP inherited vectors, minus unconsumed closing raw/WIP vectors and burdens assigned to other outputs/cohorts, using a documented non-overlapping attribution ledger. Production burdens of first-accepted closing FG stay in this original cohort numerator because that FG is already included in Q; FG retains its assigned vector for later tracking, without another production charge on dispatch. Divide that attributed numerator once by the independently measured positive first-acceptance Q of the same original cohort. Keep all physical totals before allocation and failed/zero-output events. Q=0 gives no normalized result; retain its burdens for traced later disposition rather than silently dropping the event."
      inputs:
        - "actual exchanges"
        - Q
        - "raw/WIP/FG vectors"
        - cp_acceptance
      output: "per 1 kg reference flow"
      source_ids:
        - ec-pef-multifunctionality-2021
    - id: gate_reconciliation
      applies_to: "pentaborate"
      rule: "Q is the locked sum of uniquely identified measured first-acceptance events, not a value inferred from dispatch or stock closure. For each reporting period and cohort reconcile opening FG + measured first acceptances within that period + external returns/imports/regrade-in = closing FG + dispatch + separately classified other post-gate exits + regrade-out. First acceptances within a later period are zero for an already accepted old cohort; its locked original Q is never added again to that period balance. Other post-gate exits include separately measured disposal/destructive tests, samples/donations and interplant transfers; these categories and dispatch/regrade-out must be disjoint. Define distinct directional incoming counterparts and prevent return/dispatch double counting. Q = new-cohort dispatch + new-cohort closing FG is only a conditional bridge when that new cohort has no opening FG, returns, imports, regrades or other post-gate exits; it never defines Q."
      inputs:
        - "first-acceptance events"
        - "all FG movements"
        - cp_acceptance
      output: "independent Q and reconciliation residual"
      source_ids:
        - borax-pentaborate-sds-2025
    - id: chemistry_accounts
      applies_to: "pentaborate_plant"
      rule: "Maintain separate unallocated total mass, B/N/H/O elemental, molecular-species/water and energy accounts for this chemical/product unit, with raw/WIP/FG and empty/packed-bag opening and closing stocks, whole external streams and equal internal links. Steam input and condensate return use actual two-end mass and state records; retained or vented steam water remains in this unit water account. For any species, net formation/consumption equals outputs + closing stock minus inputs minus opening stock only when actual reaction/speciation evidence supports the account; do not impose zero on chemically transformed boric acid, ammonia or molecular water. Elemental conservation does not identify reaction products. Track crystal water, free moisture, chemically formed/consumed molecular water, released water vapour and condensate separately; do not count chemically bound hydroxyl as supplied water or invent reaction water to force closure. Fuel/combustion-air/reaction-water/emission/energy accounts belong to the actual linked utility producer, not an omitted boiler or an unsupported one-row combustion branch."
      inputs:
        - "whole streams"
        - assays
        - "reaction evidence"
        - "all stocks"
        - "paired utility interfaces"
        - cp_energy
        - cp_packaging
      output: "separate physical balance accounts"
      source_ids:
        - borax-pentaborate-pds-2024
        - borax-pentaborate-sds-2025
    - id: measured_release
      applies_to: "ammonia_air, pentaborate_air, boron_water, water_vapour"
      rule: "For each matched interval, multiply measured concentration by already integrated compatible gas/discharge volume with explicit unit conversion. Only a flow rate is integrated with time; never multiply integrated volume by time again. Keep analyte/species and dry/wet/reference gas basis identical. Report detection uncertainty, actual receptors and mutually exclusive particulate fractions."
      inputs:
        - "matched monitoring"
        - "volume or rate/time"
        - cp_emissions
      output: "actual emitted mass"
      source_ids:
        - borax-pentaborate-sds-2025
    - id: utility_pairs
      applies_to: "steam, condensate_return, supplied_heat"
      rule: "Preserve actual delivered steam mass and actual returned condensate mass as separate physical exchanges with matched provider/consumer ends. Net steam thermal transfer is supplied mass times supported supplied-state specific enthalpy minus returned mass times supported returned-state specific enthalpy, using one common enthalpy reference and explicit unit conversion; separately account for measured interface losses and any retained/vented water. An indirect heat-meter amount is not an extra steam mass. Do not force equal inlet/return mass, invent makeup/formation water or assume a positive duty."
      inputs:
        - "actual paired mass and state"
        - "validated enthalpies"
        - cp_energy
      output: "actual utility mass/energy interface"
      source_ids:
        - ec-pef-multifunctionality-2021
    - id: bag_reconciliation
      applies_to: "hdpe_bag, returned_hdpe_bag, delivered_hdpe_bag, hdpe_bag_return_to_supplier, hdpe_bag_waste"
      rule: "Within each actual period/cohort, opening empty + opening packed bag mass + new purchase/consigned receipts + external customer returns = closing empty + closing packed bag mass + whole bags delivered with product + whole bags returned to supplier + measured bag waste + separately investigated actual unrecovered loss. Use disjoint directional events, matched counterpart quantities and internal filling/reuse transfers that cancel. Never multiply a measured bag outlet by an environmental allocation share. First-accepted closing packed FG retains its bag vector within original Q; later dispatch moves that inherited physical/vector stock without a second manufacture charge, and later incremental services use original Q."
      inputs:
        - "actual whole-bag movements"
        - "empty/packed stocks"
        - "original Q"
        - cp_packaging
      output: "full physical packaging bridge and cohort service attribution"
      source_ids:
        - dmcc-pentaborate-product
        - ec-pef-multifunctionality-2021
  data_quality_requirements:
    - id: identity
      applies_to: "pentaborate"
      requirement: "Require full supplied-state, ≥99% whole-product content method, actual hydrate/CAS, separate inventory number, route and provider mass compatibility. Equivalent assay and theoretical oxide contents alone are insufficient."
      evidence: "cp_acceptance; borax-pentaborate-sds-2025"
    - id: denominator
      applies_to: "all inventory rows"
      requirement: "Require independently weighed unique first acceptance, complete directional FG exits and old-cohort services; no stock-derived or dispatch-derived new production."
      evidence: "cp_acceptance"
    - id: balance
      applies_to: "pentaborate_plant"
      requirement: "Set tolerances from actual measurement uncertainty. Investigate mass, element, species/water and energy residuals separately. No empirical closure factor or assumed unmeasured yield."
      evidence: "cp_inputs; cp_residues; cp_energy; cp_emissions"
    - id: coverage
      applies_to: "pentaborate_plant"
      requirement: "Report each unresolved flow identity, missing measurement, absent stage and extra actual substance. Do not convert producer specifications, solubility charts or worker exposure recommendations to site inventory factors."
      evidence: "borax-pentaborate-spec-v3; borax-pentaborate-sds-2025"
validation_rules:
  - rule_id: check_identity
    applies_to: "pentaborate"
    rule: "Require one complete dry whole-product output with the selected flow conditions and declared chemical versus registry identifiers. A hard contradictory formula, hydration state, purity denominator or route makes the link unavailable until resolved. Do not fix the native record by interpretation."
    source_ids:
      - borax-pentaborate-sds-2025
  - rule_id: check_q
    applies_to: "all inventory rows"
    rule: "Require 1 kg reference output, common positive original-cohort Q and one normalization. Old FG, reacceptance, returns and retests cannot enlarge Q. Check other post-gate exits before any dispatch/closing-stock bridge."
    source_ids:
      - borax-pentaborate-sds-2025
  - rule_id: check_conservation
    applies_to: "pentaborate_plant"
    rule: "Check this chemical unit total/element conservation, supported species formation/consumption and separate thermal/energy accounting with raw/WIP/FG and packaging physical and inherited-burden vectors. Verify the complete actual linked utility producer and matched steam/condensate interfaces. Verify both external packaging ends without scaling physical exits by environmental burden shares."
    source_ids:
      - ec-pef-multifunctionality-2021
      - borax-pentaborate-sds-2025
  - rule_id: check_releases
    applies_to: "all residuals and emissions"
    rule: "Require final destination, actual species/analyte basis, compatible units and distinct captured/recycled/emitted pathways. Utility combustion is supplied by an explicitly linked fully represented producer; direct combustion inside this chemical unit is outside the restricted interface profile until a complete supported unit inventory is established. Add actual chemicals, packaging and pollutants as atomic rows; no unmeasured zero or generic collection flow."
    source_ids:
      - borax-pentaborate-sds-2025
  - rule_id: check_limits
    applies_to: "data package"
    rule: "Structural, measurement and projection checks do not approve scientific applicability or fill unresolved UUID/provider evidence. Disclose remaining gaps and restrict use until the actual dataset is complete."
    source_ids:
      - borax-pentaborate-pds-2024
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual qualified industrial dry tetrahydrate product from the declared boric-acid/ammonia site route and supplied mass basis"
  excluded_use: "Whole CPC-family equivalence; aqueous blend; anhydrous-salt substitution; universal recipe; performance or safety approval"
  required_metadata: "Site/period; route/stages; formula/hydrate and distinct CAS roles; content method; moisture; grade/form; gate/cohort/Q; stocks/vectors; packaging; upstream basis; allocation; receivers"
  required_quality_disclosure: "Unresolved identities; native classification difference; source-specific limitations; actual measurement uncertainties; unmeasured stages; residuals and omitted checks"
  update_trigger: "Changed hydrate/content method, route, supplier, energy region, packaging, acceptance gate, treatment or receptor"
data_sources:
  - id: "borax-pentaborate-pds-2024"
    type: "handbook"
    reference: "U.S. Borax, Ammonium Pentaborate Product Data Sheet, September 2024. https://www.borax.com/BoraxCorp/media/Borax-Main/Resources/Data-Sheets/ammonium-pentaborate.pdf?ext=.pdf"
    used_for: "Pages 1–3: whole tetrahydrate product, ammonia/water/boric-acid reaction, crystalline supply state, moisture sensitivity, decomposition and container examples. Theoretical oxide composition, solubility and producer examples are not inventory factors or operating instructions."
  - id: "borax-pentaborate-spec-v3"
    type: "handbook"
    reference: "Borax Français S.A.S., Ammonium Pentaborate Technical Powder, BFC31-v.3, undated. https://www.borax.com/BoraxCorp/media/Borax-Main/Resources/Specifications-Sheets/ammonium-pentaborate-technical-powder.pdf?ext=.pdf"
    used_for: "Complete single page: manufactured crystalline tetrahydrate and producer analytical specifications. Equivalent tetrahydrate assay can exceed 100%; it is not a physical constituent mass fraction, yield, dry-salt fraction or universal grade."
  - id: "borax-pentaborate-sds-2025"
    type: "handbook"
    reference: "Rio Tinto Borates / Borax Français S.A.S., Ammonium Pentaborate SDS AP-BF-AP-EN, January 2025. https://sds.riotinto.com/display/rtm/FileName-502775"
    used_for: "Complete 7-page SDS: sections 1, 3, 9 and 15 connect the named whole tetrahydrate product, CAS 12046-04-7, >99.0% content and the separate anhydrous inventory number 12007-89-5. Sections 6–13 support dust, moisture, ammonia and water-release assessment. No occupational limit, toxicity endpoint or theoretical conversion is an LCI default."
  - id: "dmcc-pentaborate-product"
    type: "handbook"
    reference: "DMCC Speciality Chemicals, Ammonium Pentaborate product page, undated. https://dmcc.com/product/boron-chemicals/ammonium-pentaborate"
    used_for: "Independent producer product context: CAS 12046-04-7, diammonium decaborate octahydrate formula and HDPE-bag supply. The doubled formula denotes the same hydrate composition; no double product mass. The displayed ammonium-oxide label contains a Na4 typo and is not used quantitatively. No factory recipe, yield or fuel mix is established."
  - id: "ec-pef-multifunctionality-2021"
    type: "official_guidance"
    reference: "European Commission, Recommendation C(2021) 9332 final, Annexes 1–2, 2021. https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "Section 4.5, PDF pages 63–64: investigate subdivision/system expansion, then relevant physical relationships and justified alternatives for multifunctionality. General method only; no borate-specific allocation percentage or substitution credit."
