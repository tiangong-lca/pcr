    - row_id: "water_vapour"
      reason: "Only actual measured/independently supported net water leaving urea, stocks or controls to outdoor air. Separate retained water and free water from dry particulate mass; no invented drying yield or default evaporation. Specific actual identity/provider remains to be matched; no plural selector or unsupported proxy."
