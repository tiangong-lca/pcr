    - row_id: "sack_waste"
      reason: "ONE whole physical export to the actual receiver: paper substrate plus attached urea/water and any measured contamination. Tare, urea and water are nested subledgers, never extra simultaneous external streams unless actually separated before export. Specific actual identity/provider remains to be matched; no plural selector or unsupported proxy."
    - row_id: "spent_sleeve"
