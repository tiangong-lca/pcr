allocation_rules:
  - rule_id: single_function
    applies_to: "tablet_compaction"
    rule: "The actual round-tablet product is the sole reference function. Waste, retained dust, component returns and packaging transfers are physical fates, not automatic cofunctions or avoided-production credits. Any genuine additional sold function requires reviewed allocation with all actual physical quantities preserved."
    source_ids: []
  - rule_id: cohort_services
    applies_to: "all inventory rows"
    rule: "Trace batches/submeters before allocating shared services using demonstrated actual causal drivers. Preserve own inherited vectors and original served cohorts; provider aggregate versus disjoint decomposition is exclusive. Allocation changes burden shares, never physical mass, Q or actual waste/PM quantities."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "tablet_compaction"
      flow_role: "accepted_tablets"
      record_type: "acceptance_record"
      raw_fields: "event id/time; parent/cohort; actual round-tablet form; agricultural grade; composition; gross/tare/net; water; raw/WIP/FG boundaries; later delivery/return/rework/quarantine/sample/loss; original basis"
      collection_method: "Calibrated net weighing or traceable volume with actual density/state; lock first acceptance once and follow every later state. Preserve full parent history and measured composition, not dry/N-equivalent reconstruction."
      unit: "kg"
      frequency: "each acceptance and state change"
      temporal_coverage: "continuous production interval and full original cohort history"
      site_scope: "one actual round-tablet grade, site and fixed gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; actual acceptance methods/COA; form photographs/dimensions; event uniqueness; original-basis stock/disposition closure"
    - protocol_id: cp_material
      process_id: "tablet_compaction"
      flow_role: "urea_feed"
      record_type: "receipt_charge_stock"
      raw_fields: "supplier/SKU; CAS; agricultural grade; virgin NH3/CO2 synthesis; net wet mass; water/traces; receipt/return/charge; raw/WIP stocks; actual upstream reference/unit/history"
      collection_method: "Weigh whole supplied urea separately and reconcile stock/charge/return by batch. Obtain real supplier composition and complete applicable sampling/assay procedures, uncertainty and compatible manufacturing/transport inventories."
      unit: "kg"
      frequency: "each receipt/charge/return and stock survey"
      temporal_coverage: "same production interval plus inherited supply/WIP history"
      site_scope: "actual feed receipts and contributing virgin-synthesis provider"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; actual grade/method/version/sample basis; provider unit/route; stock reconciliation; no embedded-history duplication"
    - protocol_id: cp_power
      process_id: "tablet_compaction"
      flow_role: "electricity; heat_air"
      record_type: "meter_state_energy"
      raw_fields: "meter/equipment; kWh and MJ; timestamps; voltage/provider; supply/loss boundary; batch/idle/rework driver; actual material/air temperatures and enthalpy basis; evidenced heat transfer; unresolved residual"
      collection_method: "Submeter actual drives/auxiliaries and reconcile whole-site totals with justified shared drivers. Preserve kWh×3.6 and actual native NCV/MJ reference. Determine heat only from independently evidenced metering or a documented validated state model, not a forced residual."
      unit: "MJ"
      frequency: "continuous or bounded meter intervals; actual heat observations"
      temporal_coverage: "whole campaign including idle/rework and later cohort services"
      site_scope: "actual user electricity and real thermal transfer interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; native conversion; actual provider losses; stage/time drivers; enthalpy/model evidence; raw energy residual disclosed"
    - protocol_id: cp_pack
      process_id: "tablet_compaction"
      flow_role: "sack_input; sack_delivered; sack_returned; sack_waste"
      record_type: "container_transfer"
      raw_fields: "sack id/material/construction; tare/count; contents; receipts/delivery/return/customer return; empty/filled stock; whole contaminated waste; nested paper/urea/water/oil; actual receiver; manufacture/reuse service"
      collection_method: "Weigh matching empty/full sacks and each external transfer. Conserve paper tare independently; weigh each contaminated export whole and reconcile its nested constituents. Count no simultaneous companion powder exchange unless actual preboundary separation is proven."
      unit: "kg"
      frequency: "every packing/return/scrap transfer and stock boundary"
      temporal_coverage: "full production and inherited sack genealogy"
      site_scope: "actual sack configuration; bulk handling remains separately evidenced"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "paired tare/gross tickets; ownership/reuse; whole-waste versus substrate closure; receiver/provider scope; no cofunction credit"
    - protocol_id: cp_asset
      process_id: "tablet_compaction"
      flow_role: "filter_sleeve; roll_segment; spent_sleeve; spent_roll"
      record_type: "asset_cohort_history"
      raw_fields: "component id/material; measured mass/count/dimensions; configuration; install/remove/refurbish; physical opening/closing fleet and transfers; original served cohorts; retained urea/water/lubricant; whole export and nested substrate; provider unit/history"
      collection_method: "Weigh actual parts and separately reconcile fleet substrate, whole contaminated exports and retained material. Allocate compatible supplier manufacture/service only from real history; preserve original served cohorts through later replacement and no assumed lifetime."
      unit: "kg"
      frequency: "each installation/service/removal and fleet survey"
      temporal_coverage: "complete actual service history across the campaign"
      site_scope: "actual sleeves and alloy-steel tooling; other components separately admitted"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "measured dimensions/mass; work orders; original cohorts; compatible provider unit; substrate and contamination mass closure"
    - protocol_id: cp_maintenance
      process_id: "tablet_compaction"
      flow_role: "hydraulic_oil; grease; used_oil; spent_grease"
      record_type: "fluid_grease_history"
      raw_fields: "individual formulation/grade; supplied amount; water/contamination; equipment location; receipts/returns; opening/closing fluid/grease stocks; leaks/retention; real separate waste export and receiver; embedded service"
      collection_method: "Weigh each actual formulation and its separate external spent stream. Track material retained on whole parts/waste only as nested contamination; reconcile stock and real provider demand once. Actual other lubricants/cleaning materials require their own cards."
      unit: "kg"
      frequency: "each charge/service/drain and stock boundary"
      temporal_coverage: "whole campaign with inherited circuit/stock history"
      site_scope: "actual hydraulic/bearing interfaces, with explicit non-use evidence"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier grade; weighings; service records; stock/contamination closure; actual receiver and no repeated export"
    - protocol_id: cp_residue
      process_id: "tablet_compaction"
      flow_role: "urea_reject"
      record_type: "segregated_residue"
      raw_fields: "source/parent batch; whole wet mass; urea/water/traces; actual free stream; capture/recycle/sample/reject state; stock; receiver; destination status"
      collection_method: "Weigh each actual physically separate exported residue; sample its real composition and fate. Internal recycled or still-held dust remains in stock/paired transfers. Never repeat contamination already inside bag/filter/part exports."
      unit: "kg"
      frequency: "each export and stock/quality state change"
      temporal_coverage: "whole campaign including startup/cleaning/rework"
      site_scope: "actual segregated reject and receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; representative samples and complete applicable assay methods; receiver proof; constituent and stock closure"
    - protocol_id: cp_air
      process_id: "tablet_compaction"
      flow_role: "dust_air"
      record_type: "particulate_test"
      raw_fields: "outlet/fugitive/bypass; actual urea/water/traces; concentration; gas flow and duration; filter/rinse/blank masses; temperature independence evidence; gas T/P/humidity; recovery/transformation tests; leakage/calibration; operating mode; detection limit; uncertainty"
      collection_method: "Apply a complete independently supported matrix-valid procedure. Method17 is conditional on its full temperature/gas/geometry scope and Methods1/2/3/5 dependencies; substantiate actual urea recovery/water basis and no induced change. Integrate compatible concentration×volume-flow over time; separately establish fugitive/bypass/condensable coverage."
      unit: "kg"
      frequency: "representative monitored runs and all abnormal operating states"
      temporal_coverage: "production, idle storage, cleaning and loading in the campaign"
      site_scope: "all actual environmental outlets; capture is separate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "complete method/version/dependencies; urea recovery and phase tests; blanks/calibration/leaks; coverage; actual compartment; no PM/constituent double counting"
    - protocol_id: cp_water
      process_id: "tablet_compaction"
      flow_role: "ambient_water_in; water_vapour"
      record_type: "moisture_phase_ledger"
      raw_fields: "interface and direction; measured moisture/time/state; raw/WIP/FG/parts residue water; actual air humidity/T/P and gas flow; absorbed/released water; uncertainty; original-cohort attribution"
      collection_method: "Use representative sealed samples and a complete actual matrix-valid moisture procedure with blanks/recovery and uncertainty; reconcile phase/stock evidence with independently established air-water exchange. Preserve residuals without creating absorbed or evaporated water to close them."
      unit: "kg"
      frequency: "each batch/state and representative environmental period"
      temporal_coverage: "same campaign and original acceptance cohorts"
      site_scope: "actual raw/WIP/FG/dust/part and atmospheric interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sample preservation; method scope/version; calibration/recovery; humidity/state evidence; no hidden water or dry-mass restoration"
  calculation_rules:
    - id: normalize_inventory
      applies_to: "all inventory rows"
      rule: "Divide each non-overlapping attributable campaign exchange by positive locked Q to report per 1 kg reference flow; retain actual physical totals and original Q0 for later services."
      inputs:
        - "individual measured exchange"
        - Q
        - cp_product
        - "applicable row protocol"
      output: "individual original row unit per 1 kg reference flow"
      source_ids: []
    - id: acceptance_bridge
      applies_to: "accepted_tablets"
      rule: "Q is the sum of unique first-acceptance net masses; original Q0 equals disjoint net remaining deliveries plus all onsite accepted states, irreversible losses and other terminal dispositions on original basis, with later additions separately removed. No loop or restored loss increases Q."
      inputs:
        - "unique events"
        - "original net mass/water"
        - "parent/state/return/loss history"
        - cp_product
      output: "locked Q and original-cohort disposition residual"
      source_ids: []
    - id: physical_closure
      applies_to: "all inventory rows"
      rule: "Opening physical stocks + actual external inputs = closing stocks + actual physical external outputs; paired internal transfers cancel. Conserve whole wet material, actual C/H/N/O, impurities/metal and water phases independently of burden allocation; use actual G/C for any real transformation and require route review. Whole-waste components and PM constituents remain nested, not extra flows."
      inputs:
        - "actual stocks/transfers"
        - "representative compositions"
        - cp_material
        - cp_residue
        - cp_water
        - cp_pack
        - cp_asset
      output: "unallocated whole/component/element/phase residuals with uncertainty"
      source_ids:
        - ifdc-urea-tablets-2014
    - id: burden_history
      applies_to: "all inventory rows"
      rule: "Own inherited foreground/WIP vector + disjoint new work/upstream vectors = closing carried vectors + terminal attributed vectors. Preserve cohort cuts; either a provider aggregate or its verified non-overlapping decomposition, never both."
      inputs:
        - "inherited vectors"
        - "new actual services"
        - "provider scope"
        - "closing inventories"
        - "original cohorts"
      output: "nonduplicate attributable burden ledger"
      source_ids: []
    - id: energy_conversion
      applies_to: "electricity"
      rule: "Electrical MJ = measured kWh ×3.6; this only matches the selected native NCV/MJ reference. Reconcile actual material-state/work/stock energy and independently supported heat, without forcing an unknown residual into heat_air."
      inputs:
        - "meter kWh"
        - "actual reference units"
        - "states/enthalpy"
        - cp_power
      output: "matched electricity and separately evidenced energy balance"
      source_ids:
        - sahut-briquetting-2026
    - id: pm_integral
      applies_to: "dust_air"
      rule: "Integrate actual compatible concentration multiplied by gas volume-flow rate over time; use complete blank/recovery/leak/gas-state corrections from the applicable method. Sum only disjoint actual outlets and independently established fugitive loads. PM mass and its measured urea/N/water remain one exchange plus nested analytical evidence."
      inputs:
        - cp_air
        - concentration
        - "volume-flow rate"
        - time
        - "actual matrix and scope tests"
      output: "actual atmospheric particulate kg and coverage gaps"
      source_ids:
        - epa-pm17-2017
        - epa-pm5-2017
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Verify actual whole-product/component type, CAS, form, composition, native restriction and genuine provider property/unit. Actual additive-free round-tablet admission and classification-inference limits are mandatory; a category tag is insufficient."
      evidence: "full native records; supplier synthesis/grade and actual form/acceptance evidence"
    - id: basis_cohort
      applies_to: "all inventory rows"
      requirement: "Require positive locked Q with unique events and complete original-basis postgate closure; raw/WIP/FG/returns/assets and inherited burden records cover the same declared scope. Unknown Q preserves raw totals without a complete normalized result."
      evidence: "cp_product; all physical and burden ledgers; parent/event audit"
    - id: matrix_methods
      applies_to: "all inventory rows"
      requirement: "Retain complete actual sampling, sample preservation and method/version/units with calibration, blanks, recovery and uncertainty for the actual urea/moisture/residue matrix. Do not infer grade, a dry-mass conversion or PM applicability from the IFDC example, native formula or a finite check. Unknown essential procedure blocks complete applicable data."
      evidence: "actual complete lab procedure/results; representative samples; matrix and method-scope evidence"
    - id: whole_waste_assets
      applies_to: "sack_waste; spent_sleeve; spent_roll; filter_sleeve; roll_segment"
      requirement: "Preserve whole actual exports and nested contamination independently from substrate fleet/tare and supplier service demand. No phantom separated powder stream, default life, double treatment or automatic recovery credit."
      evidence: "cp_pack; cp_asset; whole-versus-nested mass and receiver audit"
    - id: air_and_energy
      applies_to: "dust_air; electricity; heat_air; ambient_water_in; water_vapour"
      requirement: "Prove actual source/matrix applicability and complete outlet coverage; actual provider and state/units must match. Temperature, droplets/saturation, induced change or gas-geometry conflicts require another reviewed suitable procedure; unmeasured water/energy/air pathways are not zero or forced closure."
      evidence: "cp_air; cp_power; cp_water; full methods/dependencies and actual meter/state tests"
    - id: coverage
      applies_to: "all inventory rows"
      requirement: "Cover startup, normal production, idle, rework, sampling, cleaning, maintenance, packing/loading and actual abnormal losses throughout one continuous representative interval. Missing actual UUID/provider/amount remains disclosed; source-method defects and scientific/study qualification cannot be replaced by a successful mechanical check."
      evidence: "all nine protocols; complete actual PFD; operating and sampling coverage; explicit non-use and gap records"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Stationary dry-powder sampling must retain a complete matrix-valid procedure, rather than assume all PM methods are interchangeable. EPA Method17 samples isokinetically with an in-stack filter at actual stack temperature and gravimetry after removal of uncombined water. Its stated scope requires temperature-independent PM over the actual source range, no liquid droplets or saturated gas, acceptable probe blockage, and complete Methods1/2/3/5 dependencies, blanks, leakage/calibration, recovery, weighing and gas-state calculations. It is methodological evidence, not a current regulatory-compliance claim. Demonstrate urea recovery, sorption/moisture basis and absence of sampling/analysis-induced transformation; heated Method5 or oven treatment is not automatically valid for urea. Inapplicable conditions or an unknown essential procedure prevent complete applicable results; obtain an independently reviewed suitable procedure, do not impose an empirical correction. Evaluate fugitive, bypass, cleaning and condensable coverage separately; unmeasured is not zero. Any included onsite test reagents/materials and wastes need their actual individual cards, or a complete actual laboratory-provider boundary."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "accepted_tablets"
    rule: "Require the complete specific product/form/route and native synthesis/provider admission of Section5, all ordered qualifiers and the explicitly inferred classification limits. Pure nutrient basis, loose prills or unproven briquette form cannot qualify by a fertilizer label alone."
    source_ids:
      - ifdc-urea-tablets-2014
      - wco-fertilizers-2022
      - unsd-cpc3-2025
      - unsd-cpc21-continuity
  - rule_id: validate_cohort
    applies_to: "accepted_tablets"
    rule: "Check the complete original first-event and disjoint postgate bridge, with no restored loss or second loop fate, including all stocks/returns and later additions. Unknown/zero Q prevents normalized completeness."
    source_ids: []
  - rule_id: validate_physical
    applies_to: "all inventory rows"
    rule: "Independently reconcile whole wet mass, actual elements/species/phases, complete packaging/asset substrate stocks and whole contaminated receiver exports with nested components. Do not invent closure exchanges or duplicate constituent PM/waste loads."
    source_ids: []
  - rule_id: validate_history
    applies_to: "all inventory rows"
    rule: "Check own-WIP inheritance, original served asset/cohort services, complete external providers and non-overlapping embedded history before normalization/allocation. Missing actual operations or supplies are not zero."
    source_ids: []
  - rule_id: validate_methods
    applies_to: "dust_air; ambient_water_in; water_vapour"
    rule: "Apply the complete matrix/method/source limits above. A finite consistency pass is not actual sampling applicability, scientific approval or study qualification. Unqualified essential procedures, unmeasured pathways or unmatched providers remain explicit barriers to complete applicable data."
    source_ids:
      - epa-pm17-2017
      - epa-pm5-2017
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual round-tablet supply background only with matching form/grade/provider and qualified inventory"
  allowed_use: "Collect an actual site/interval/cohort additive-free round-tablet physical manufacturing inventory"
  excluded_use: "All34659 coverage; allurea/briquette mapping; nutrient equivalents; field dose/performance; default recipes/yields/factors; unqualified matrices"
  required_metadata: "All ordered qualifiers; complete Section5/9 conditions; actual providers/units; original Q/genealogy; raw physical and burden ledgers; method evidence and uncertainty"
  required_quality_disclosure: "Actual identity/method/provider/quantity gaps, classification-inference limits and historical source scope; no mechanical-check promotion to scientific/study readiness"
  update_trigger: "Actual form/ingredient/grade, thermal/wet step, equipment/provider, sampling matrix, gate/cohort, package/part or authoritative classification change"
