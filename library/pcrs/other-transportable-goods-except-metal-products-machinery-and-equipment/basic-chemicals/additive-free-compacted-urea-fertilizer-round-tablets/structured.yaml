system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The product is the whole supplied agricultural urea round tablet made by mechanical compaction of purchased granular or prilled urea without any intentional binder, coating, fortifier or other ingredient. IFDC, Urea Deep Placement Trainer Manual, June2014, printed page2, explicitly describes additive-free physical briquetting and calls this specific product round tablets; its photographs show feed, machine and output. Do not infer that every briquette, supergranule, pillow or large prill is a tablet. Admit only actual documented round-tablet form and its actual acceptance specification. Loose prills/granules are inputs, not this finished product. Exclude wet dissolution/recrystallisation, thermal synthesis/conversion, coated or mixed fertilizers, field placement and agronomic-performance claims. No IFDC tablet size/weight, pack weight, yield, dose, field loss or benefit is a default."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Classification is an explicit continuity inference, not an official current product ruling. Current CPC3 introduction paragraphs26,50–51 and55–56 apply HS headings/notes to transportable goods; paragraph93 and the current Family state unchanged application principles. The official CPC2.1 explanatory note defines34659 through HS2007 3105.10, and the HS2017/CPC2.1 correspondence links3105.10→34659 with both partial flags0. Current34659 retains the title Fertilizers n.e.c., without an added scope note. HS2022 Chapter31 note2 applies nitrogenous heading31.02, including urea, only when not in31.05 forms/packages;3105.10 explicitly covers chapter31 goods in tablets/similar forms OR packages of gross weight not exceeding10kg. The specific IFDC round-tablet form supports the tablet branch independently of package size. The unchanged Urea34611 title, new34647 NK split and absence of a current detailed crosswalk remain contrary/limiting evidence; neither an automatic current mapping nor all-urea coverage follows. A later authoritative correction or contrary actual form requires review."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "The selected native whole Urea Product flow has CAS57-13-6, a white crystalline urea identity and an agricultural-grade virgin industrial NH3/CO2 synthesis restriction. It has no granule-only form or geography restriction. Physical compaction into additive-free tablets does not replace it with a nutrient or a different formulated mixture. Require actual agricultural grade, supplied composition including traces/water, tablet evidence and a genuine upstream provider retaining that synthesis restriction. Native34611 metadata is disclosed as classification counterevidence; the exact whole-product hardfields, current rules and physical case—not that tag alone—govern this conditional admission. Generic favourable soil language supplies no safety, environmental benefit, yield or burden. A urea-as-N flow, feed-grade fertilizer, NPK mixture or unqualified provider cannot substitute."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "One foreground aggregate retains stage ledgers: receive and net-weigh actual urea; condition/sieve and, only when installed, mill feed or recycle; meter feeding and the actual press/roll cavities; compact without added ingredients; separate and screen actual intact tablets, fines and rejects; return compatible fines to their parent batches; capture dust, dry-clean, sample, pack or bulk-load, accept and handle accepted stock. IFDC establishes the actual urea operation; SAHUT-CONREUR separately lists urea briquetting and describes conditional preparation plus complete-line screening, packing, utilities and dust removal. Its general binder, hot treatment and flake-granulation options are not this route. Do not crush accepted tablets into loose granules and still call the outlet tablets. Actual hardware/auxiliary choices need evidence; no machine type, pressure, speed, electricity, density, yield or life is prescribed. Actual omitted stages, chemicals or heat cannot be hidden to fit the scope."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "The physical ledger covers all external receipts/returns/deliveries, sampled and rejected material, releases, and opening/closing raw urea, WIP, accepted/quarantined FG, fines, dust, containers, oil and asset stocks. Pair every internal transfer at equal physical quantity and preserve actual composition; internal loops cancel only at the aggregate boundary. The burden ledger separately carries own inherited foreground work, new work, upstream supplies, closing carried stocks and terminal assignments. An opening WIP vector is inherited once, not recreated from already included charges/meters. A provider aggregate and its embedded decomposition are alternatives, never additive histories. Rework and old accepted stock retain original genealogy and do not become burden-free feed."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "Lock Q as the sum of whole supplied net kg at unique actual first round-tablet acceptance events at one fixed gate for the original cohort. Gross press throughput, internal fines, retests, returns, rework/reacceptance and dispatch of opening FG create no new event. Q is not an additional external physical output. Reconcile original Q0 into disjoint net remaining external deliveries, all actual onsite accepted states including held/quarantine/rework/WIP, irreversible losses, samples and other terminal dispositions on the original acceptance basis. Returns and loops are transfers, not a second fate. Keep later external additions separately. Never restore lost urea/water into the survivor and also count that loss. Only if every other postgate state/exit/loss is demonstrably absent may a delivery-plus-new-FG simplification be used. Later storage, repair/rework, packaging and asset service retain original Q0. Zero/unknown Q retains raw totals and unresolved normalization."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "Before allocation conserve whole wet material and actual C/H/N/O plus material impurity/metal ledgers, not nitrogen-equivalent mass. Follow urea, water and each actual transformed species separately. Physical compaction assumes no chemical conversion only while actual records support that condition; hydrolysis, degradation, oxidation or thermal conversion needs actual generation/consumption and a reviewed extension, not a conservation assumption for reacting species. Moisture uptake is a real separate incoming water transfer; water loss is a real outgoing phase. Use measured phase/stock composition and original-cohort genealogy, not artificial dry-mass restoration. Captured urea, samples, rejects and emitted PM are disjoint. PM whole mass and its urea/N/water constituents are nested evidence, not additional elementary emissions for the same particles. Unmeasured residuals stay unresolved; no yield, purity, species remainder or allocation share forces closure."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "Record physical empty sack receipts, delivered tare, serviceable external returns, customer returns, scrap and opening/closing empty/filled stock by original sack ID, separately from net tablets. Attribute actual manufacture/reuse service once; reuse creates no new manufacture or cofunction. Each actual contaminated sack or filter/roll export is ONE whole receiver waste mass including retained urea, water, oil or grease as present. Substrate/tare, contamination and moisture are nested subledgers; they are not extra powder/water waste exchanges or duplicate treatment. Only a physically documented separation before the boundary permits a separate residue stream. The whole-waste total must equal its nested constituents, while packaging/fleet bridges conserve their own substrate basis. Do not omit contamination from the receiver load."
      source_ids: []
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "Trace actual polyester filter sleeves and alloy-steel roll segments individually by measured mass/count, dimensions, configuration, installation/removal, maintenance, retained urea and original served cohorts. Preserve complete physical fleet stocks and transfers independently of provider manufacture/service demand. New or replacement parts may remain installed across intervals; do not export their whole mass as current powder loss. Derive service demand only from actual compatible provider units and real history, with inherited cohorts and later services retained once. No assumed machine mass, life, annualized replacement or recovery credit is allowed. Other real part materials require their own cards."
      source_ids: []
    - rule_id: system_boundary_rule_10
      applies_to: "foreground_system_boundary"
      rule: "Electricity is external actual AC at the user interface. Preserve the native Net calorific value property/MJ reference convention; measured electrical kWh ×3.6 is a unit conversion, not combustion, heat supply or an intensity. Link a real compatible generation/delivery provider and its losses once. This mechanical route includes no intentional steam, burner, thermal dryer or added process water; installed heat/wet processing requires scope review and complete actual interfaces rather than an anonymous utility. Meter real drives, milling, feeding, extraction, vacuum, screening, packing, QA, idle and rework. Reconcile actual energy/work, material enthalpy/state, retained energy and separately evidenced heat rejection with uncertainty; never invent a heat or water output merely to close a residual."
      source_ids: []
    - rule_id: boundary_stages
      applies_to: "tablet_compaction"
      rule: "Include every actual stage and auxiliary in the complete source-qualified route above; non-use requires records, and added actual materials/species need atomic rows before a complete dataset."
      source_ids:
        - ifdc-urea-tablets-2014
        - sahut-briquetting-2026
    - rule_id: boundary_identity
      applies_to: "accepted_tablets"
      rule: "Apply complete round-form, agricultural whole-urea and upstream synthesis restrictions, with native34611 countermetadata and explicit current continuity-inference limits retained."
      source_ids:
        - ifdc-urea-tablets-2014
        - wco-fertilizers-2022
        - unsd-cpc3-2025
        - unsd-cpc21-continuity
