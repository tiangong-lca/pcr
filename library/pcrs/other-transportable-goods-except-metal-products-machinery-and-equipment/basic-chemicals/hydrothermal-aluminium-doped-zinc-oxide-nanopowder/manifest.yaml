  semantic_scope: "One independent real electronic Al-doped ZnO nanopowder CHFS method. Different actual product/process cases synthesize method, no single supplier factory LCI claimed."
  preserved_prior_hold: "Original as-grown silicon identity/terminal and source connection hold remains unclosed; no old leaf alias/scaffold revived or old Si problem relabelled accepted."
  native_counterevidence: "Whole native complete sputtering opening and films/powders/nonexclusive examples, productionmix label, no fixed purity/geo/CAS/dopingbasis and wrong42220 classification retained; new CHFS association is bounded inference."
  source_limits:
    - "The UCL seven-page published article reports actual lab and pilot CHFS powders. IoLiTec technical sheets, the identified Thermo lot CoA and Heeger establish whole commercial nanopowder but not the UCL route at their factories. Retain both IoLiTec editions separately: the newer file has two physical pages numbered 1/3 and 2/3, with no invented third page. The CoA lacks full test geometry, uncertainty and density kind. Heeger reports a conductivity unit in ohm-centimetres and inconsistent purity descriptions; these are not silently repaired or adopted. Stanford prints 30–50 micrometres, not nanometres. Vendor CAS and oxide mass ratios do not define the native variable dopant basis. The target patent and contradictory-header spinel SDS remain different-product counterexamples."
    - "The original UCL PDF image prints 50 μS, whereas plain extraction loses the μ glyph; no per-length unit is printed. This is not an adopted washing threshold or a complete conductivity cell convention. The Methods Scherrer peak list contains (102), whereas the Results list contains (101); retain the discrepancy rather than select a silent correction. Crystallite size, particle size and agglomerate size are distinct. ESI referred to by the article is not acquired here. Nominal feed composition and actual ICP uptake differ, as do lab and pilot products; the reported pilot rate is not a plant inventory coefficient. No source recipe, operating setpoint, purity, size range, yield, energy, resistance or lifetime is a PCR default."
    - "Characterise the actual complete powder using a compatible XRD phase pattern and TEM specimen preparation/image analysis, with XPS/EDS as their actual surface/local evidence. Record calibration, sampling, resolution, detection and limitations; no zero-secondary-phase or atomic-site-occupancy claim follows from a missing diffraction peak or total Al alone. The reported Zn/Al ICP-AES procedure dissolves powder in dilute nitric acid and uses actual separate Zn and Al calibration series. Use independent measured preparation masses/volumes and dilution factors with actual blanks, recoveries and uncertainty. Record actual Zn/Al on a stated mass or molar basis; do not substitute feed at%, oxide wt%, surface XPS fraction or vendor purity. A required unresolved matrix/dissolution/recovery procedure remains a specific hold, not a future-SOP waiver. Ordinary unperformed lot QA does not make the reported concrete method nonexistent."
    - "The published electrical results follow hydraulic pressing, reducing heat treatment and sputtered gold contacts, then Van der Pauw measurements with current/field reversal and triplicate readings. These are properties of that prepared compact, not the loose as-prepared powder or an end-use film. Such a test is not a universal powder-release requirement. If actually performed for the declared product, include the actual powder withdrawal, press/furnace/coater/probe services, whole purchased reducing-gas blend, gold target consumption, actual gases/water and treatment, rejects and retained or discarded specimens. Do not turn a purchased blend into separate pure-gas purchases or assume a gas recipe, conversion or zero exhaust."
  essential_method_rule: "Reported powder phase/particle/ZnAl preparation and specific aqueous ICP/IC methods exist. Actual QA pending is ordinary; a genuinely unestablished required matrix/dissolution/recovery/species/tracepurity/SSA/water/electrical claim remains affected-claim hold, not futureSOP or finitepass closure."
