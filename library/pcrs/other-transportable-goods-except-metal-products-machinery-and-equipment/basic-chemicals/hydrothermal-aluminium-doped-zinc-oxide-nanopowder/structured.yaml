allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "shared operations"
    rule: "For attributional multifunctionality first directly assign dedicated operations, then investigate real or virtual subdivision. Establish exchange-specific determining physical causality from actual observations. Only demonstrably residual burdens without such a relationship use justified contemporaneous market value at the same common-process exit/state; remove downstream finishing, packing and service value where needed. No convenient time/mass/volume share for every exchange."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: full_physical_quantities
    applies_to: "all physical streams"
    rule: "Allocation divides environmental/producer service vectors, never physical wholewet transfers, stocks, receiverQt or element balances. Preserve assigned and unassigned vectors and distinguish actual recovered product from a waste sale; no automatic avoided-burden credit."
    source_ids:
      - jrc-ilcd-allocation-2010
