      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Complete purchased hydrate/KOH reagents and DI water; actual whole supplied utilities, calibrated equipment and packaging histories |\n| starting_condition_role | Real chemical synthesis and complete wet separation/drying before first whole-powder acceptance |\n| product_classification_scope | Narrow electronic-use doped compound powder within CPC3.0:35470; actual contrary native classification disclosed |\n| recursive_input_rule | Returned already accepted powder retains originalQ0/history; no second synthesis purchase or new acceptance. Complete bought AZO cannot replace the included chemical formation unless a genuinely different declared boundary is independently evidenced. |\n| upstream_dataset_requirement | Complete actual precursor/formulation/water/electricity/cooling/equipment/packaging producers and genuine transport/treatment interfaces once; known onsite operations included |\n| disclosure | Actual product phase/grade/state/gate/site/time, all physical/element/water stocks, original events/fates and own/provider histories, all actual tests, provider units, uncertainty and unqualified claims |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| complete_actual_route | synthesis and powder_qa | Receive whole purchased zinc nitrate hexahydrate, aluminium nitrate nonahydrate and solid KOH; prepare the actual aqueous feeds using separately measured DI water. Include all real feed pumps, electrical heating, confined-jet mixing and chemical formation, pipe-in-pipe cooling, back-pressure regulation, slurry collection, centrifugation, repeated washing, freeze-drying and powder handling. Include all performed sampling, preparation, testing, cleaning, start-up, shutdown, failed work and first-release inspection. Compatible primary research and independent commercial powder documents support a technical synthesis; they are not one supplier factory or order inventory. | ucl-chfs-2016 |\n| full_q0_history | all accepted cohorts | Preserve all actual first-event, physical stock, original history, packaging and treatment conditions in the complete units below; no abbreviated rule overrides their limitations. | jrc-ilcd-allocation-2010 |\n| no_proxy | reference and all inputs | Exclude undoped ZnO, separate Al dopant compounds, GZO/AGZO, an arbitrary dry blend of ZnO and alumina, an intentional zinc-aluminate-spinel product, a compact or target sold as the whole article, FTO-coated glass and any film as this reference. The commercial coarser micrometre grade is not silently renamed nanopowder. No public same-factory/SKU requirement is added; actual whole product, host phase, Al incorporation, particle state, supply gate and provider must genuinely match. | unsd-cpc3-2025; abf-chapter38 |\n| method_qualification | analytical claims | Use only a real compatible analytical preparation/fraction/method and its stated limitations; ordinary batch QA differs from unknown essential procedure. | ucl-chfs-2016; epa-metals-2007; epa-anions-300 |\n| pack_pouch | pouch | For actual Vacuum-sealable AZO powder pouch: O+P+I+ER+J_in+H2O_in+OTHER_IN-X_OTHER_IN=C+S+EO+W+J_out+H2O_out+OTHER_OUT-X_OTHER_OUT. Full wet C/W retained; true mutuallyexclusive J/water not already inside whole quantities, X only OTHER same-side duplicates; P/I/ER inward and S filled/EO empty outward disjoint. | heeger-powder |\n| pack_bottle | bottle | For actual HDPE reagent bottle body: O+P+I+ER+J_in+H2O_in+OTHER_IN-X_OTHER_IN=C+S+EO+W+J_out+H2O_out+OTHER_OUT-X_OTHER_OUT. Full wet C/W retained; true mutuallyexclusive J/water not already inside whole quantities, X only OTHER same-side duplicates; P/I/ER inward and S filled/EO empty outward disjoint. | heeger-powder |\n| pack_closure | closure | For actual Polypropylene reagent-bottle closure: O+P+I+ER+J_in+H2O_in+OTHER_IN-X_OTHER_IN=C+S+EO+W+J_out+H2O_out+OTHER_OUT-X_OTHER_OUT. Full wet C/W retained; true mutuallyexclusive J/water not already inside whole quantities, X only OTHER same-side duplicates; P/I/ER inward and S filled/EO empty outward disjoint. | heeger-powder |\n| pack_carton | carton | For actual Corrugated fibreboard shipping carton: O+P+I+ER+J_in+H2O_in+OTHER_IN-X_OTHER_IN=C+S+EO+W+J_out+H2O_out+OTHER_OUT-X_OTHER_OUT. Full wet C/W retained; true mutuallyexclusive J/water not already inside whole quantities, X only OTHER same-side duplicates; P/I/ER inward and S filled/EO empty outward disjoint. | heeger-powder |\n| pack_drum | drum | For actual Returnable steel powder drum: O+P+I+ER+J_in+H2O_in+OTHER_IN-X_OTHER_IN=C+S+EO+W+J_out+H2O_out+OTHER_OUT-X_OTHER_OUT. Full wet C/W retained; true mutuallyexclusive J/water not already inside whole quantities, X only OTHER same-side duplicates; P/I/ER inward and S filled/EO empty outward disjoint. | heeger-powder |\n\n### scope_complete\n\nThis method covers complete electronic-use aluminium-doped wurtzite ZnO nanopowder, chemically formed by continuous hydrothermal flow synthesis (CHFS), cooled and depressurised, centrifuged, washed and freeze-dried to a free-flowing whole powder before its unique first quality acceptance. The reference is the actual net complete powder, including retained constituents and measured conditioning moisture. Packaging, undoped precursors, a separate dopant, deposited films and backed sputtering targets do not replace it.\n\n### route_complete\n\nReceive whole purchased zinc nitrate hexahydrate, aluminium nitrate nonahydrate and solid KOH; prepare the actual aqueous feeds using separately measured DI water. Include all real feed pumps, electrical heating, confined-jet mixing and chemical formation, pipe-in-pipe cooling, back-pressure regulation, slurry collection, centrifugation, repeated washing, freeze-drying and powder handling. Include all performed sampling, preparation, testing, cleaning, start-up, shutdown, failed work and first-release inspection. Compatible primary research and independent commercial powder documents support a technical synthesis; they are not one supplier factory or order inventory.\n\n### scope_exclusions\n\nExclude undoped ZnO, separate Al dopant compounds, GZO/AGZO, an arbitrary dry blend of ZnO and alumina, an intentional zinc-aluminate-spinel product, a compact or target sold as the whole article, FTO-coated glass and any film as this reference. The commercial coarser micrometre grade is not silently renamed nanopowder. No public same-factory/SKU requirement is added; actual whole product, host phase, Al incorporation, particle state, supply gate and provider must genuinely match.\n\n### native_admission\n\nThe bound whole Product is Aluminium-doped zinc oxide. Its factory production-mixing label is retained and supplies no dry-blending recipe. Its complete route wording expressly covers thin films or powders and lists nonexclusive preparation examples; its comment begins with sputtering, then describes Al-doped wurtzite ZnO nanoparticles and other synthesis contexts. This narrower CHFS powder association is a disclosed inference from the complete physical fields and primary powder evidence, not a change to native fields. Contrary container classification 42220 is retained as contrary metadata, not sole proof or rejection. No CAS, country, universal purity or fixed dopant basis is supplied.\n\n### native_complete_original\n\nComplete original native route: Aluminum-doped zinc oxide thin films or powders can be prepared by methods such as the sol-gel method, magnetron sputtering method, pulsed laser deposition, chemical vapor deposition, and spray pyrolysis. Complete original native comment: Aluminum doped Zinc Oxide (AZO) is a type of transparent conductive oxide material that is processed by sputtering and has potential applications as a substrate for single wall carbon nanotubes processing by spray-coating. AZO consists of Zinc Oxide (ZnO) nanoparticles doped with Aluminum (Al), resulting in a crystalline hexagonal wurtzite-type structure. The doping fraction of Aluminum in AZO can vary, with examples being 0.02 and 0.04. AZO nanomaterials are synthesized using methods such as the auto-combustion method with glycine as a fuel and the irradiation of precursor films containing zinc nitrate and aluminum nitrate under vacuum ultraviolet radiation. The material is also studied for its electronic structures and doping effects on ZnO films. The printed 0.02 and 0.04 are unspecified-basis examples, never a selected recipe, assay or default.\n\n### source_cases\n\nThe UCL seven-page published article reports actual lab and pilot CHFS powders. IoLiTec technical sheets, the identified Thermo lot CoA and Heeger establish whole commercial nanopowder but not the UCL route at their factories. Retain both IoLiTec editions separately: the newer file has two physical pages numbered 1/3 and 2/3, with no invented third page. The CoA lacks full test geometry, uncertainty and density kind. Heeger reports a conductivity unit in ohm-centimetres and inconsistent purity descriptions; these are not silently repaired or adopted. Stanford prints 30–50 micrometres, not nanometres. Vendor CAS and oxide mass ratios do not define the native variable dopant basis. The target patent and contradictory-header spinel SDS remain different-product counterexamples.\n\n### source_print_limits\n\nThe original UCL PDF image prints 50 μS, whereas plain extraction loses the μ glyph; no per-length unit is printed. This is not an adopted washing threshold or a complete conductivity cell convention. The Methods Scherrer peak list contains (102), whereas the Results list contains (101); retain the discrepancy rather than select a silent correction. Crystallite size, particle size and agglomerate size are distinct. ESI referred to by the article is not acquired here. Nominal feed composition and actual ICP uptake differ, as do lab and pilot products; the reported pilot rate is not a plant inventory coefficient. No source recipe, operating setpoint, purity, size range, yield, energy, resistance or lifetime is a PCR default.\n\n### phase_assay\n\nCharacterise the actual complete powder using a compatible XRD phase pattern and TEM specimen preparation/image analysis, with XPS/EDS as their actual surface/local evidence. Record calibration, sampling, resolution, detection and limitations; no zero-secondary-phase or atomic-site-occupancy claim follows from a missing diffraction peak or total Al alone. The reported Zn/Al ICP-AES procedure dissolves powder in dilute nitric acid and uses actual separate Zn and Al calibration series. Use independent measured preparation masses/volumes and dilution factors with actual blanks, recoveries and uncertainty. Record actual Zn/Al on a stated mass or molar basis; do not substitute feed at%, oxide wt%, surface XPS fraction or vendor purity. A required unresolved matrix/dissolution/recovery procedure remains a specific hold, not a future-SOP waiver. Ordinary unperformed lot QA does not make the reported concrete method nonexistent.\n\n### electrical_specimens\n\nThe published electrical results follow hydraulic pressing, reducing heat treatment and sputtered gold contacts, then Van der Pauw measurements with current/field reversal and triplicate readings. These are properties of that prepared compact, not the loose as-prepared powder or an end-use film. Such a test is not a universal powder-release requirement. If actually performed for the declared product, include the actual powder withdrawal, press/furnace/coater/probe services, whole purchased reducing-gas blend, gold target consumption, actual gases/water and treatment, rejects and retained or discarded specimens. Do not turn a purchased blend into separate pure-gas purchases or assume a gas recipe, conversion or zero exhaust.\n\n### water_chemistry\n\nRecord whole hydrated salts and whole supplied solutions once, with contained crystal water, solvent and assays nested. Separately measure true added feed/wash/cleaning water, heating and cooling interfaces, retained slurry/powder water, actual freeze-dryer condenser ice/melt and vacuum exhaust. Water removed by freezing and condensation is not automatically an air emission. Preserve independent total-wet-mass, H/O and Zn/Al/K/N elemental accounts plus measured species/phase accounts; reacting KOH, nitrate or water is not presumed conserved as a molecule. Do not invent a KNO3-only mother liquor, all-nitrate nitrogen, reaction-water yield or a fitted residual flow. Unexplained species and mass discrepancies remain explicit.\n\n### wet_gate_equations\n\nFor every actual material gate in complete wet units: S_open+R_external+R_internal+J_in+H2O_in+OTHER_IN-X_OTHER_IN=S_close+T_external+T_internal+J_out+H2O_out+OTHER_OUT-X_OTHER_OUT. R/T are whole measured transfers, S are whole physical stocks, J are real mutually exclusive extra nonwater increments and H2O are real extra water crossings not already inside whole transfers/stocks. X removes only a proven identical child crossing duplicated in OTHER on the same side; it cannot cancel true J/water, full wet closing stocks, an opposite-side term or an unknown residual. Elemental and molecular ledgers are separate. The reference Q0 event account is not an additional physical output. Match internal powder handoffs by actual lot/state/quantity; cancel identical paired interfaces only on consolidation.\n\n### first_event_fates\n\nLock each positive original Q0,c as the sum of actual net whole-powder masses at unique first-acceptance events after performed pre-release tests and withdrawals, in one recorded conditioning state. Retain each event ID, raw weighing/tare, time, moisture/state and acceptance evidence. Reinspection, shipment, return, rework and later drying create no second event. Partition every original accepted quantity into disjoint remaining deliveries, actual on-site accepted states, returned/held stocks, irreversible losses, destructive samples, waste and other terminal fates, each traced to its original acceptance basis. Do not restore lost water into a survivor and also count the same loss. Keep actual later wet quantities and J/H2O changes separately. Never-accepted zero-output work retains all actual burdens and a causal or unresolved assignment; it is not positive Q0.\n\n### physical_and_history\n\nMaintain disjoint complete raw, WIP, genuinely unused non-WIP, unreleased powder, accepted FG, test-specimen, equipment and packaging stocks in actual wet physical quantities. Maintain separately every inherited foreground exchange vector in its original native unit. Own opening foreground/WIP history is not a second purchase; a complete provider aggregate and its decomposed embedded upstream inventory are alternatives, not additive. A_i,c=B_open_i,c+U_new_i,c-B_close_unused_i,c-T_other_i,c only when U_new is before stock correction and the subtracted vectors are genuinely unused/unassigned. Accepted FG and already performed service are not unused Bclose. Use already-net consumption only with its documented equivalent bridge and no repeated correction. Keep assigned/unassigned vectors conserved.\n\n### Qt_A\n\nKeep three distinct ledgers: one full actual whole wet waste receiver transfer Qt and complete actual treatment-provider quantity recorded once; actual component and physical-cohort provenance where known; separately evidenced nonoverlapping treatment/environmental service vectors A_i,c in compatible provider units attributed to each original Q0,c. Raw V or Qt divided by a positive Q_analysis is labelled physical observation only. The linked modeled demand is A_i,c/Q0,c once. Allocation neither shrinks the receiver transfer nor charges the whole shared provider demand again to each cohort. Unknown shares remain unresolved. A whole contaminated cloth, pouch, filter or retired apparatus includes substrate, retained powder/liquor and moisture once; component ledgers are nested and create no extra exports or treatments unless physically separated before the boundary.\n\n### provider_complete\n\nActual heating, feed pumping, cooling, centrifugation and freeze-drying are included operations, not moved out by an external-utility label. Meter stage electricity and heat removal without substituting nameplate power or reported throughput. Link true complete DI-water, cooling and other supplied producers once at matched physical interfaces; if production or pollution control is actually on site, include its complete real inputs, auxiliary reagents, energy, residues, emissions, reuse and outputs or a separately modeled complete producer with measured send/receive linkage. Known operations cannot be omitted or covered by a dummy disposal factor. Actual wastewater/condensate/gas receivers and compatible full treatment boundaries remain study qualification requirements, not claims of a universally available background provider.\n\n### fleet_units\n\nFor every actually used pump, heater, mixer, exchanger, regulator, separator, dryer, test instrument and wiping article, preserve complete fleet counts and whole masses, installed/opening/closing/returned/repaired/retired states and actual use events independently of burden vectors. Complete equipment acquisition and whole contaminated retirement remain full physical events. Existing own embodied history and provider-modeled service increments are separate. A provider per article is bridged by independently measured same-configuration whole article mass; a mass-based card cannot silently consume an hour-based provider. If an actual provider uses another unit, create its correctly typed service interface and retain the supported conversion/history. No assumed replacement life, utilization, service fraction or machine mass.\n\n### package_equation\n\nFor each actual named pouch, reagent bottle, closure, shipping carton and returnable drum pool in full wet units: O+P+I+ER+J_in+H2O_in+OTHER_IN-X_OTHER_IN=C+S+EO+W+J_out+H2O_out+OTHER_OUT-X_OTHER_OUT. P is disjoint new separate purchase, I is packaging entering with actual supplied contents, ER is empty article returned inward from customers/pool, S is every actual filled outward shipment including filled material returns exactly once, EO is separate empty outward return, W is one whole contaminated actual waste and O/C include every empty, attached raw/WIP/FG and reusable stock. Article material/construction is verified, never assigned from a supplier bag/drum word. Internal reuse/attachment cancels only internally; no automatic new acquisition or credit. J/water are real nonoverlapping extra changes not already contained; X removes only OTHER same-side duplicates, never true increments or complete wet C. Packaging is outside reference powder Q0.\n\n### aqueous_methods\n\nFor actual aqueous mother liquor, washes, condensate and analytical wastes, select the analyte and fraction before sampling. EPA200.7 supplies complete dissolved versus total-recoverable metal preparation, filtration/preservation or mixed-acid extraction, calibration, spectral/high-solids/acid/memory interference, blanks, fortified matrices, dilution tests and calculations; Al, Zn and K are in its scope. Total recoverable is not automatically total refractory-solid digestion, free ions, nitrate or lattice Al. EPA300.0 PartA supplies complete water/waste nitrate/nitrite IC preparation, preservation, identification by retention/fortification, dilution, QA and calculations. It reports these anions as N, not totalN or all molecular nitrogen species. Its combined acid-preserved nitrate/nitrite and individual-anion sampling are distinct, unfamiliar matrices require actual checks, high anion load can shift/overlap peaks and acetate leachates are excluded. Use independent aliquots compatible with each method, retain high-salt/particle/dilution recovery and actual detection limits. Do not apply drinking-water direct-analysis exceptions to dirty mother liquor. A matrix failing the actual method remains unresolved; no generic SOP or numerical default fixes it. Include the complete real analytical producer and all actual chemicals, gases, samples, rinses and wastes.\n\n### no_unproved_properties\n\nThis profile does not promise a trace-purity grade such as 99.9%, BET surface area, residual-water fraction, a universal dopant/particle-size interval, compact or film electrical performance or environmental advantage. A declared additional property needs its actual compatible complete preparation, analytical method, recovery/interference/detection and acceptance basis before use. The reported particle/phase/composition methods are real methods; ordinary pending batch QA is not their nonexistence. Conversely an unknown essential procedure is not closed by requiring future validation or a mechanical PCR check. The previous as-grown silicon identity/method hold remains a separate unclosed historical research scope.\n\n### classification_complete\n\nCurrent CPC3.0 names chemical elements and compounds doped for use in electronics. The complete HS3818 wording is: Chemical elements doped for use in electronics, in the form of discs, wafers or similar forms; chemical compounds doped for use in electronics. The elemental shaped-form limb and the doped-compound limb are separate. This actual electronic-use Al-doped ZnO compound nanopowder therefore supports a narrower association by explicit inference, not by requiring a wafer geometry or by treating an undoped precursor as the whole compound. It is not a commodity ruling. The primary controller accepts this narrower scoped association; full delivery qualification and serial landing are recorded separately.\n\n### IC_real_preparation\n\nActual Method300.0 eluent preparation remains on site: weigh its actual separate carbonate and bicarbonate reagents and added water, retain mixing/calibration/equipment services and all waste. The actual suppressor and chosen sample-preservation branch require their real reagent interfaces. Certified whole nitrate and nitrite stock solutions are allowed by the source and remain separate purchased formulations here; their real working dilutions are prepared and recorded on site. Do not relabel known preparation as an unspecified available background utility, buy both a mixture and its ingredients, or infer supplier strengths. Any genuinely different purchased-ready solution needs an actual complete qualified producer and a mutually exclusive interface.\n\n### Explicit diagnostic duplicate observations\n\nIn every expanded wet equation above, OTHER_IN and OTHER_OUT are additional separately shown observations of crossings already contained in that same side's named gross transfer legs. Record each observed duplicate and its parent crossing. X_OTHER_IN/OUT removes only that proved same-side overlap: 0 <= X_OTHER_IN <= OTHER_IN and 0 <= X_OTHER_OUT <= OTHER_OUT. Named physical legs remain disjoint. A new real independent crossing requires its own actual atomic card and correct named receipt/exit leg, not a fitted OTHER or X. When no duplicate observation is additionally displayed, both OTHER and its X are zero; the complete physical equation then contains neither. A true J/H2O increment, whole wet C/W, or opposite-side crossing cannot be cancelled. The optional potassium analysis uses its own traceable whole K calibration stock, working dilution and actual QA records; it is not provided by the Al or Zn standards. All actually used calibration/check/matrix-spike preparations retain their actual whole formulation and mutually exclusive preparation interfaces.\n\n"
