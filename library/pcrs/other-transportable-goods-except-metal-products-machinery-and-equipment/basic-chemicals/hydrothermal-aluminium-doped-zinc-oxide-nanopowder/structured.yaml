  - rule_id: validate_full_units
    applies_to: "all source/typed/literal bodies"
    rule: "Audit every ordered qualifier and complete normative paragraph in both stored language projections; each atomic card direction/type/UUID/property/amount/protocol/source, every12protocol field, calculation Inputs/Output, quality Evidence and all sourceid/type/reference/usedfor fields. Counts or schema hashes alone do not establish full semantic preservation or acceptance."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "Synthetic counterchecks only, not empirical defaults: one contaminated10kg filter/article containing8kg substrate and2kg powder is one10kg physical receiver/provider event. Evidenced service25%new/75%old gives2.5/7.5kg-equivalent model demands, not2.5kg physical waste or10kg demand for both. With originalQ0,new100kg andQ0,old200kg the model demands are0.025 and0.0375kg-equivalent/kg. Unknown shares stay unresolved. An original100kg accepted lot later appearing as55kg deliveries+20kgheld+10kgwaste+15kgirreversiblewater/materialloss still hasQ0=100kg; do not restore5kg into a survivor and also count it lost. All actual additional J/water retain their real physical side."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Protocols collect raw unnormalised event quantities and states; their aggregation labels declare the final reference basis only. The complete normalization, source, scope and history conditions are preserved in sections5and9. No collection protocol predivides quantities or manufactures newQ0."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only after actual producer/method qualification"
  downstream_use: "Specified electronic-use whole AZO nanopowder supplied at the declared gate"
  allowed_use: "Matched actual powder phase/composition/particle/conditioned mass and compatible methods/providers"
  excluded_use: "Exclude undoped ZnO, separate Al dopant compounds, GZO/AGZO, an arbitrary dry blend of ZnO and alumina, an intentional zinc-aluminate-spinel product, a compact or target sold as the whole article, FTO-coated glass and any film as this reference. The commercial coarser micrometre grade is not silently renamed nanopowder. No public same-factory/SKU requirement is added; actual whole product, host phase, Al incorporation, particle state, supply gate and provider must genuinely match."
  required_metadata: "Actual ZnO host phase and Al incorporation evidence; Electronic purpose and whole powder form and actual supply gate; Actual particle/crystallite/agglomerate distinction and sampling; Actual full nitrate-hydrate/KOH supplies and contained water; All actual CHFS pumping heating cooling BPR separation washing freeze-drying operations; Independent net whole-powder weighing and recorded conditioning; Unique first-event IDs and fixed original Q0 with all fates; Disjoint complete raw WIP nonWIP FG specimen equipment and packaging wet stocks; Own inherited versus complete/decomposed provider vectors without overlap; All actual analytical preparation and sample fates; Exact analytical fraction and method recovery/interference limits; Powder versus compact target and film test state; Actual liquid gas ice water and elemental/species accounts; Complete actual utility and treatment producers/interfaces; Full physical receiverQt and independent compatible original-cohortA; Specific packaging P/I/ER/S/EO/W and true J/H2O histories; Full physical fleet and measured article/provider unit bridges; Observed services H and no assumed life/utilization/recipe/yield; Uncertainty and unknown required methods and science and study qualification states"
  required_quality_disclosure: "All original source and native countercontext, true method/identity gaps, actual pendingQA/provider ranges, physical/history/service ledgers and honest scientific/translation/study states"
  update_trigger: "Changed product phase/particle/grade/process/test specimen or provider/gate, actual measurement basis or source conflict"
