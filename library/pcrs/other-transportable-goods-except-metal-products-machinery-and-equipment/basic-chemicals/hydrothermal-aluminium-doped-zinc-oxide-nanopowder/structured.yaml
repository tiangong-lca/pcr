      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_hierarchy | shared operations | For attributional multifunctionality first directly assign dedicated operations, then investigate real or virtual subdivision. Establish exchange-specific determining physical causality from actual observations. Only demonstrably residual burdens without such a relationship use justified contemporaneous market value at the same common-process exit/state; remove downstream finishing, packing and service value where needed. No convenient time/mass/volume share for every exchange. | jrc-ilcd-allocation-2010 |\n| full_physical_quantities | all physical streams | Allocation divides environmental/producer service vectors, never physical wholewet transfers, stocks, receiverQt or element balances. Preserve assigned and unassigned vectors and distinguish actual recovered product from a waste sale; no automatic avoided-burden credit. | jrc-ilcd-allocation-2010 |\n\n"
