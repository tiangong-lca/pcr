  calculation_rules:
    - id: native_conversion
      applies_to: "all inventory rows"
      rule: "Preserve actual raw units and convert once using measured compatible unit/state bridges. kWh×3.6=MJ; gas/solution volume uses actual state/composition/density; a cumulative quantity is not multiplied by time again. Native electricity Net calorific value is retained without a fuel premise."
      inputs:
        - raw_measures
        - actual_unit_bridges
      output: "native_numerator"
      source_ids: []
    - id: assay_basis
      applies_to: "powder and aqueous samples"
      rule: "Calculate the actual analyte amount from blank-corrected concentration, actual final volume and all actual dilution/recovery factors under the applicable full method, divided by actual sampled whole mass when reporting mass fraction. Derive molar Al/(Al+Zn) only from actual elemental amounts with documented molar conversion values; do not map feedat% or oxidewt%. EPA300NO3/NO2 asN is not totalN."
      inputs:
        - actual_concentration
        - aliquot_mass_volume
        - actual_dilution
        - blank_recovery
        - actual_basis
      output: "qualified_composition"
      source_ids:
        - ucl-chfs-2016
        - epa-metals-2007
        - epa-anions-300
    - id: attribute_history
      applies_to: "all inventory rows"
      rule: "Maintain disjoint complete raw, WIP, genuinely unused non-WIP, unreleased powder, accepted FG, test-specimen, equipment and packaging stocks in actual wet physical quantities. Maintain separately every inherited foreground exchange vector in its original native unit. Own opening foreground/WIP history is not a second purchase; a complete provider aggregate and its decomposed embedded upstream inventory are alternatives, not additive. A_i,c=B_open_i,c+U_new_i,c-B_close_unused_i,c-T_other_i,c only when U_new is before stock correction and the subtracted vectors are genuinely unused/unassigned. Accepted FG and already performed service are not unused Bclose. Use already-net consumption only with its documented equivalent bridge and no repeated correction. Keep assigned/unassigned vectors conserved."
      inputs:
        - B_open_i_c
        - U_new_i_c
        - B_close_unused_i_c
        - T_other_i_c
        - compatible_units
      output: "A_i_c"
      source_ids:
        - jrc-ilcd-allocation-2010
    - id: single_normalization
      applies_to: "all inventory rows"
      rule: "x_i,c=A_i,c/originalpositiveQ0,c once for qualified compatible modeled demand. Full physical V/Qt divided by positiveQ_analysis is a labelled observation, not an extra model demand. Internal physical handoffs use actual traced material quantity/originalQ0,c once and paired cancellation, no procurement. Zero/unknown basis retains raw/unresolved; H is not divisor; first_powder_release is exactly1kg."
      inputs:
        - A_i_c
        - original_Q0_c
        - actual_physical_transfer
        - Qt
        - Q_analysis
        - compatible_provider_units
        - cp_powder_qa_release
      output: "x_i_c"
      source_ids: []
    - id: wet_reconciliation
      applies_to: "all physical gates"
      rule: "For every actual material gate in complete wet units: S_open+R_external+R_internal+J_in+H2O_in+OTHER_IN-X_OTHER_IN=S_close+T_external+T_internal+J_out+H2O_out+OTHER_OUT-X_OTHER_OUT. R/T are whole measured transfers, S are whole physical stocks, J are real mutually exclusive extra nonwater increments and H2O are real extra water crossings not already inside whole transfers/stocks. X removes only a proven identical child crossing duplicated in OTHER on the same side; it cannot cancel true J/water, full wet closing stocks, an opposite-side term or an unknown residual. Elemental and molecular ledgers are separate. The reference Q0 event account is not an additional physical output. Match internal powder handoffs by actual lot/state/quantity; cancel identical paired interfaces only on consolidation."
      inputs:
        - physical_open_close
        - whole_transfers
        - J_in_out
        - H2O_in_out
        - OTHER_duplicate_proof
      output: "wet_element_species_residuals"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Actual whole identity/type/phase/grade/route/state/use/geography must fit full native fields; an unresolved auxiliary row retains specific physical identity. No component or contradictory hardfield is repaired by a qualifier."
      evidence: "Full original native/FPUG and actual product/provider evidence"
    - id: analytical
      applies_to: "all measured composition and quality claims"
      requirement: "This profile does not promise a trace-purity grade such as 99.9%, BET surface area, residual-water fraction, a universal dopant/particle-size interval, compact or film electrical performance or environmental advantage. A declared additional property needs its actual compatible complete preparation, analytical method, recovery/interference/detection and acceptance basis before use. The reported particle/phase/composition methods are real methods; ordinary pending batch QA is not their nonexistence. Conversely an unknown essential procedure is not closed by requiring future validation or a mechanical PCR check. The previous as-grown silicon identity/method hold remains a separate unclosed historical research scope."
      evidence: "Complete procedure/matrix/preparation/calibration/QA and actual assay state"
    - id: history
      applies_to: "all cohorts and stocks"
      requirement: "Every originalQ0 fate, fullwet stock, own/provider history, matched internal interface and actual failed work reconciles independently; no acceptedFG/realservice removed as unused closing history."
      evidence: "Event and stock/vector genealogy with uncertainty"
    - id: receiver
      applies_to: "all waste and packaging"
      requirement: "Keep three distinct ledgers: one full actual whole wet waste receiver transfer Qt and complete actual treatment-provider quantity recorded once; actual component and physical-cohort provenance where known; separately evidenced nonoverlapping treatment/environmental service vectors A_i,c in compatible provider units attributed to each original Q0,c. Raw V or Qt divided by a positive Q_analysis is labelled physical observation only. The linked modeled demand is A_i,c/Q0,c once. Allocation neither shrinks the receiver transfer nor charges the whole shared provider demand again to each cohort. Unknown shares remain unresolved. A whole contaminated cloth, pouch, filter or retired apparatus includes substrate, retained powder/liquor and moisture once; component ledgers are nested and create no extra exports or treatments unless physically separated before the boundary."
      evidence: "Actual receiver/provider units and nonoverlapping service attribution"
