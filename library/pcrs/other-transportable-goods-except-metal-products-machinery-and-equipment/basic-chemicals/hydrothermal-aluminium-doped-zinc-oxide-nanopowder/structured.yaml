          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| validate_whole | first_powder_release | Require one explicit outputreference to complete actual Al-doped wurtzite ZnO nanopowder after all actual production and requiredQA. Whole Product/Mass/kg and exact officialEN/ZHnames agree; no film, compact, target, reagent or receiving stub substitutes. | ucl-chfs-2016 |\n| validate_methods | all analytical and grade claims | This profile does not promise a trace-purity grade such as 99.9%, BET surface area, residual-water fraction, a universal dopant/particle-size interval, compact or film electrical performance or environmental advantage. A declared additional property needs its actual compatible complete preparation, analytical method, recovery/interference/detection and acceptance basis before use. The reported particle/phase/composition methods are real methods; ordinary pending batch QA is not their nonexistence. Conversely an unknown essential procedure is not closed by requiring future validation or a mechanical PCR check. The previous as-grown silicon identity/method hold remains a separate unclosed historical research scope. | ucl-chfs-2016; epa-metals-2007; epa-anions-300 |\n| validate_q0 | all cohorts | Lock each positive original Q0,c as the sum of actual net whole-powder masses at unique first-acceptance events after performed pre-release tests and withdrawals, in one recorded conditioning state. Retain each event ID, raw weighing/tare, time, moisture/state and acceptance evidence. Reinspection, shipment, return, rework and later drying create no second event. Partition every original accepted quantity into disjoint remaining deliveries, actual on-site accepted states, returned/held stocks, irreversible losses, destructive samples, waste and other terminal fates, each traced to its original acceptance basis. Do not restore lost water into a survivor and also count the same loss. Keep actual later wet quantities and J/H2O changes separately. Never-accepted zero-output work retains all actual burdens and a causal or unresolved assignment; it is not positive Q0. |  |\n| validate_qt | all waste/provider interfaces | Keep three distinct ledgers: one full actual whole wet waste receiver transfer Qt and complete actual treatment-provider quantity recorded once; actual component and physical-cohort provenance where known; separately evidenced nonoverlapping treatment/environmental service vectors A_i,c in compatible provider units attributed to each original Q0,c. Raw V or Qt divided by a positive Q_analysis is labelled physical observation only. The linked modeled demand is A_i,c/Q0,c once. Allocation neither shrinks the receiver transfer nor charges the whole shared provider demand again to each cohort. Unknown shares remain unresolved. A whole contaminated cloth, pouch, filter or retired apparatus includes substrate, retained powder/liquor and moisture once; component ledgers are nested and create no extra exports or treatments unless physically separated before the boundary. | jrc-ilcd-allocation-2010 |\n| validate_pack_fleet | packaging and equipment | Verify each actual article pool with full J/H2O/Xconditions, ER inward/EO outward/Sallfilled, complete wet stock and one whole contaminated waste. Preserve full asset fleets/provider history and compatible service vectors; no lifetime or machineweight default. | heeger-powder |\n| validate_full_units | all source/typed/literal bodies | Audit every ordered qualifier and complete normative paragraph in both stored language projections; each atomic card direction/type/UUID/property/amount/protocol/source, every12protocol field, calculation Inputs/Output, quality Evidence and all sourceid/type/reference/usedfor fields. Counts or schema hashes alone do not establish full semantic preservation or acceptance. |  |\n\n### Explicit non-default counterexamples\n\nSynthetic counterchecks only, not empirical defaults: one contaminated10kg filter/article containing8kg substrate and2kg powder is one10kg physical receiver/provider event. Evidenced service25%new/75%old gives2.5/7.5kg-equivalent model demands, not2.5kg physical waste or10kg demand for both. With originalQ0,new100kg andQ0,old200kg the model demands are0.025 and0.0375kg-equivalent/kg. Unknown shares stay unresolved. An original100kg accepted lot later appearing as55kg deliveries+20kgheld+10kgwaste+15kgirreversiblewater/materialloss still hasQ0=100kg; do not restore5kg into a survivor and also count it lost. All actual additional J/water retain their real physical side.\n\nProtocols collect raw unnormalised event quantities and states; their aggregation labels declare the final reference basis only. The complete normalization, source, scope and history conditions are preserved in sections5and9. No collection protocol predivides quantities or manufactures newQ0.\n\n"
