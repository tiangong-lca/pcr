      applies_to: "foreground_system_boundary"
      rule: "The bound whole Product is Aluminium-doped zinc oxide. Its factory production-mixing label is retained and supplies no dry-blending recipe. Its complete route wording expressly covers thin films or powders and lists nonexclusive preparation examples; its comment begins with sputtering, then describes Al-doped wurtzite ZnO nanoparticles and other synthesis contexts. This narrower CHFS powder association is a disclosed inference from the complete physical fields and primary powder evidence, not a change to native fields. Contrary container classification 42220 is retained as contrary metadata, not sole proof or rejection. No CAS, country, universal purity or fixed dopant basis is supplied."
