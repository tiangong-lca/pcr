allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "No second functional product or recycling credit is created by reclamation, packaging, returned cylinders or waste. Preserve complete physical transfers independently of attributed burdens. Separate dedicated records first; shared services require documented causal measurements and compatible provider units. Cohort service vectors must be disjoint and exhaust actual provider demand; unknown shares remain unresolved. Keep unaccepted WIP burdens with WIP and later services with original Q0. Do not partition an actual contaminated-object export into imaginary component exports."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "can_fill_control"
      flow_role: "Material receipts/issues and raw/WIP stocks"
      record_type: "foreground_record"
      raw_fields: "supplier; batch; identity; assay method/basis; net/gross/tare; phase; opening/closing cylinder/line/filler/reclamation stocks; internal transfers; own inherited burden; provider boundary"
      collection_method: "Reconcile calibrated mass records and source-compatible chemical certificates with full stock genealogy; retain whole amounts and nested constituents, never duplicate a purchase. Aggregation conditions: actual complete physical amounts; attributable current/cohort burden once / positive independent Q"
      unit: "kg"
      frequency: "Each receipt/issue and cutoff; every failed/reworked batch"
      temporal_coverage: "Complete declared campaign plus all opening/closing and inherited histories"
      site_scope: "Actual filling/control site and linked external producer/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing calibration; certificates/method editions; stock and provider boundary reconciliations"
    - protocol_id: cp_cohort
      process_id: "can_fill_control"
      flow_role: "Reference acceptance and later cohort states"
      record_type: "foreground_record"
      raw_fields: "unique event; cohort; actual net contents; first release gate; acceptance time; gross dispatch/returns; net retained delivery; accepted on-site states; accepted-material loss; terminal disposition; original Q0; added material genealogy"
      collection_method: "Independently weigh and lock unique first acceptance after the declared configuration passes actual QA; reconcile the complete original-basis bridge without repeat release. Aggregation conditions: unique accepted whole net mass Q; disjoint original-basis bridge; old-cohort service / original positive Q0"
      unit: "kg"
      frequency: "Every acceptance/state change and cutoff"
      temporal_coverage: "Complete declared campaign plus all opening/closing and inherited histories"
      site_scope: "Actual filling/control site and linked external producer/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "release and scale evidence; complete event/return/stock links; no nominal-count conversion"
    - protocol_id: cp_pack
      process_id: "can_fill_control"
      flow_role: "Packaging inputs, deliveries and stocks"
      record_type: "foreground_record"
      raw_fields: "article ID; supplier composition; measured individual/batch tare; receipts; unused/installed/finished stock; delivered/returned/scrapped quantities; cohort; preprinted embedded boundary"
      collection_method: "Weigh distinct complete can bodies, closures, protective caps and cartons; reconcile each physical input/output and stock separately from net sterilant and inherited/provider burden. Aggregation conditions: full physical article bridge; compatible attributable article demand / positive original cohort Q"
      unit: "kg"
      frequency: "Every batch/transfer and cutoff"
      temporal_coverage: "Complete declared campaign plus all opening/closing and inherited histories"
      site_scope: "Actual filling/control site and linked external producer/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tare calibration; article BOM; delivery/return/scrap documents; embedded printing non-overlap"
    - protocol_id: cp_assets
      process_id: "can_fill_control"
      flow_role: "Supply cylinders, catalyst/filter/seal physical fleets and services"
      record_type: "foreground_record"
      raw_fields: "actual item/serial and mass/dimensions; opening/new/in-service/unused/retired/returned stocks; residual contents; ownership; service dates/loads; provider native unit; inherited foreground; disjoint cohort demand; unknown shares"
      collection_method: "Maintain complete physical fleet/tare separately from provider demand. Convert count/mass/service only through actual measured item data and compatible evidenced histories; retain unresolved mappings instead of a default life. Aggregation conditions: physical fleet bridge independent of disjoint attributable producer/service vector / original positive Q or Q0"
      unit: "kg"
      frequency: "Every acquisition/service/removal/return and cutoff"
      temporal_coverage: "Complete declared campaign plus all opening/closing and inherited histories"
      site_scope: "Actual filling/control site and linked external producer/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "item weighing and BOM; provider-unit proof; full service history and unresolved-share disclosure"
    - protocol_id: cp_utility
      process_id: "can_fill_control"
      flow_role: "Electrical production and service demand"
      record_type: "foreground_record"
      raw_fields: "meter boundaries/readings; compressor/breathing-air/fan/filler/preheat/control loads; startup/shutdown/idle/failure periods; shared causal driver; provider unit and origin; cohort/original Q0"
      collection_method: "Read calibrated meters over the complete route and actual failed/idle operations, assign only supported disjoint demand and retain external generation burdens; verify complete actual source-defined producer interfaces before normalization. Aggregation conditions: attributable delivered kWh / positive original Q; old service / Q0; no duplicate compressor or imported heat"
      unit: "kWh"
      frequency: "Each meter interval and complete campaign"
      temporal_coverage: "Complete declared campaign plus all opening/closing and inherited histories"
      site_scope: "Actual filling/control site and linked external producer/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; configuration and energy-interface proof; real generation and causal allocation records"
    - protocol_id: cp_gas
      process_id: "can_fill_control"
      flow_role: "Nitrogen, oxygen, phase/component stocks and final vapor loads"
      record_type: "foreground_record"
      raw_fields: "gas/phase and outlet ID; measured flow/time; actual/standard/dry/wet basis; T/P/composition; inlet/outlet/background; EO/CO2/CO/H2O; nitrogen feed/heels/headspace/product/waste; reference spectra; spikes/recovery; condensation; uncertainty; carbon origin"
      collection_method: "Use the complete applicable EPA320/Protocol procedure or qualified EPA18 alternative and actual state-compatible flow measurements; retain independent elemental/phase and carrier-air ledgers. An unqualified alarm, nominal purity or whole-room concentration is not a source load. Aggregation conditions: integrate compatible compound-specific concentration times flow once; component/oxygen balances; disjoint attributable load / original positive Q"
      unit: "kg"
      frequency: "Continuous/representative complete event coverage including startup/failure and stocks"
      temporal_coverage: "Complete declared campaign plus all opening/closing and inherited histories"
      site_scope: "Actual filling/control site and linked external producer/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "full spectra/chromatograms/calibration/spikes and recovery; sampling/flow state; limits and unassigned species disclosed"
    - protocol_id: cp_waste
      process_id: "can_fill_control"
      flow_role: "Complete contaminated-object receiver transfers and cohort treatment demand"
      record_type: "foreground_record"
      raw_fields: "event/receiver; full Qt; nested substrate/EO/liquor/solids/water; actual separate components; holding stocks; treatment identity/unit; actual provider demand; disjoint A by original cohort; original Q/Q0; unknown causal shares"
      collection_method: "Weigh the actual whole transferred object and verify receiver/treatment records once. Preserve full raw physical transfer separately from compatible modeled service demands; nested components are not extra exports or added treatment demands. Aggregation conditions: full physical Qt once; sum disjoint compatible cohort A equals actual provider demand; normalize each A by original positive Q or Q0"
      unit: "kg"
      frequency: "Every waste creation/holding/transfer and cutoff"
      temporal_coverage: "Complete declared campaign plus all opening/closing and inherited histories"
      site_scope: "Actual filling/control site and linked external producer/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "receiver scales/manifests; component balance; provider-unit compatibility and non-overlap proof"
    - protocol_id: cp_interface
      process_id: "can_fill_control"
      flow_role: "Included on-site gas-producer interface"
      record_type: "foreground_record"
      raw_fields: "source and receiving unit IDs; complete primary unit boundary; whole gas volume/time; phase/T/P/composition/wet-dry/actual-standard basis; EO mass nested; actual provider reference unit; compatible demand; aggregate/expanded non-overlap; inherited stock history"
      collection_method: "Measure and reconcile the actual source-defined whole mixture at both ends; preserve raw volume and component ledgers. Qualify a real same-site producer including its full fuel/air/O2/water/utility/species/heat/waste inventory once; no generic disposal or available qualified dataset is assumed. Aggregation conditions: whole physical source-gas volume once; compatible non-overlapping actual provider demand / original positive Q or Q0"
      unit: "m3"
      frequency: "Every transfer interval including startup/abnormal operations"
      temporal_coverage: "Complete declared campaign plus all opening/closing and inherited histories"
      site_scope: "Actual filling/control site and linked external producer/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "paired meters/state/spectra and component records; complete qualified provider body/reference-unit proof; non-overlap and full physical history"
    - protocol_id: cp_air
      process_id: "can_fill_control"
      flow_role: "Separate compressed drive-air and supplied respirator-air records"
      record_type: "foreground_record"
      raw_fields: "air stream/purpose and actual quality-grade evidence; producer/site/boundary; meter and interval; complete gross supplied/used/leaked volumes; actual/standard and wet/dry bases; T/P/humidity/composition; header/hose/storage stocks; exhaust/GasHouse/abator/other exits; provider native unit and conversion; actual compression/conditioning/cooling/filter/oil/condensate/heat/loss inventories; inherited and disjoint cohort demand"
      collection_method: "Read calibrated purpose-specific air meters and actual supplier/producer records over complete startup, normal, idle, failure and shutdown periods. Reconcile each physical air ledger with actual state-compatible receiver/exhaust records; qualify complete real air-production and conditioning burdens once. Maintain raw quantities and compatible provider-demand vectors separately, without double charging embedded compressor electricity or invented grade/route conversions. Aggregation conditions: separate whole physical air balances; convert only to actual compatible producer units; disjoint raw cohort demand enters normalize once using original Q or Q0"
      unit: "m3"
      frequency: "Each distinct air-meter interval and transfer, including failed/idle periods and cutoffs"
      temporal_coverage: "Complete declared campaign plus all opening/closing and inherited histories"
      site_scope: "Actual filling/control site and linked external producer/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "purpose/grade certificates; calibrated meters and actual gas-state/composition evidence; paired supply/exhaust/stock records; complete actual provider inventories/reference units and inherited non-overlap"
  calculation_rules:
    - id: acceptance
      applies_to: "finished_eo"
      rule: "Q is the independent sum of unique first-accepted net whole-content masses. Lock original cohorts; no gross-loop or nominal-can-count substitution."
      inputs:
        - cp_cohort
      output: "Q"
      source_ids:
        - solventum-label-2026
    - id: postgate
      applies_to: "finished_eo; returned_eo"
      rule: "Reconcile Q to disjoint original-basis retained external delivery, all on-site accepted states, irreversible loss and terminal disposition. Track additions separately."
      inputs:
        - cp_cohort
        - cp_material
      output: "original_cohort_bridge"
      source_ids:
        - epa-accrapac-2000
    - id: normalize
      applies_to: "all inventory rows"
      rule: "Divide only the evidenced attributable exchange/service amount by the same independent positive Q; old-cohort later service uses original positive Q0. Preserve complete raw physical totals separately; unknown basis or causal share remains unresolved."
      inputs:
        - cp_material
        - cp_cohort
        - cp_pack
        - cp_assets
        - cp_utility
        - cp_gas
        - cp_waste
        - cp_interface
        - cp_air
      output: "per_reference_inventory"
      source_ids:
        - epa-accrapac-2000
    - id: package_bridge
      applies_to: "can_body; crimp_closure; protective_cap; carton; delivered_can_body; delivered_closure; delivered_cap; delivered_carton"
      rule: "For each physical article reconcile opening plus actual receipts and returns against closing stocks, installed/delivered transfers and actual scrap once; net contents exclude all tare."
      inputs:
        - cp_pack
        - cp_cohort
      output: "article_bridge"
      source_ids:
        - solventum-label-2026
    - id: asset_history
      applies_to: "bulk_cylinder; returned_cylinder; nitrogen_cylinder; returned_nitrogen_cylinder; catalyst_cell; inlet_filter; filler_seal"
      rule: "Reconcile the full physical fleet and residual contents independently of compatible disjoint provider/service demands. No invented item mass/lifetime and no new manufacturing at every use."
      inputs:
        - cp_assets
        - cp_cohort
      output: "fleet_and_service_vectors"
      source_ids:
        - acc-eo-2023
    - id: gas_load
      applies_to: "nitrogen; oxygen_uptake; eo_air; co2_air; co_air; water_air; nitrogen_air"
      rule: "Integrate actual compatible concentration and flow once; retain gas-state and background corrections, phase stocks and elemental balances. Complete oxidation is a reaction check, not an assumed conversion/factor."
      inputs:
        - cp_gas
        - cp_material
      output: "qualified_component_load"
      source_ids:
        - epa-method320-2019
    - id: whole_waste
      applies_to: "rejected_cans; spent_cell; spent_filter; spent_seal"
      rule: "Full receiver Qt is one physical event; nested components add no exports. Sum compatible non-overlapping cohort treatment demands to actual provider demand, with each demand using original Q/Q0."
      inputs:
        - cp_waste
        - cp_assets
        - cp_cohort
      output: "whole_transfer_and_attributed_treatment"
      source_ids:
        - epa-accrapac-2000
    - id: air_supply_balance
      applies_to: "compressed_drive_air; respirator_breathing_air"
      rule: "For each purpose reconcile complete raw air supply, storage/header/hose changes, actual use, leaks and all final exhaust/other exits on compatible measured state and composition. Use and exhaust are successive internal handoffs that cancel on consolidation, not additional external sinks. Volumes at different conditions are not additive without an evidenced state conversion. Integrate a measured rate once; do not multiply an integrated volume by time. Preserve separate raw gross volume and compatible producer demand; only evidenced disjoint cohort demand is passed to normalize once. Qualified aggregate versus expanded producer utility/conditioning/waste histories are alternatives. Track actual air exhaust into the GasHouse/abator mixture and other real exits, without counting unchanged carrier nitrogen/oxygen/water as additional elementary emissions."
      inputs:
        - cp_air
        - cp_cohort
        - cp_utility
        - cp_gas
        - cp_interface
        - cp_waste
        - cp_assets
      output: "raw_air_balances_and_provider_vectors"
      source_ids:
        - epa-accrapac-2000
  data_quality_requirements:
    - id: identity
      applies_to: "finished_eo; bulk_eo"
      requirement: "Admit the actual complete undiluted substance and documented assay/phase/provider; no carrier-mixture or component proxy and no analytical purity1 from nominal label."
      evidence: "Full native body, supplier label/SDS/certificate, complete applicable method context"
    - id: route
      applies_to: "all inventory rows"
      requirement: "Evidence full actual on-site/upstream units and source-defined phase/composition/utility interfaces; source cases are distinct and no default heater or efficacy is inferred."
      evidence: "Equipment/utility records and complete primary source context"
    - id: cohorts
      applies_to: "all inventory rows"
      requirement: "Independent Q, complete postgate bridge and original Q0 later service with all physical and inherited stocks preserved."
      evidence: "cp_cohort; cp_material; cp_assets"
    - id: analysis
      applies_to: "eo_air; co2_air; co_air; water_air; oxygen_uptake"
      requirement: "Actual full method/matrix qualification, species identity, recovery, state/time compatibility and uncertainty; no alarm or total-VOC substitution."
      evidence: "cp_gas; epa-method320-2019; epa-method18-2025"
    - id: waste
      applies_to: "rejected_cans; spent_cell; spent_filter; spent_seal"
      requirement: "One actual whole transfer, compatible receiver/provider unit, disjoint treatment vectors; unknown shares remain unknown."
      evidence: "cp_waste; cp_assets"
    - id: context
      applies_to: "all inventory rows"
      requirement: "Preserve complete bilingual normative conditions, exact names, source types/references/uses and all literal/typed protocol fields; scientific/study qualification remains separate."
      evidence: "Complete Markdown and current generated projection with source spans"
    - id: air_supply
      applies_to: "compressed_drive_air; respirator_breathing_air"
      requirement: "Demonstrate two distinct actual whole-air supplies and their grades/purposes, complete measured state-specific physical ledgers, actual exhaust destinations and compatible full producer burdens once; kWh records cannot replace air quantities. Unknown air-grade/provider-unit or essential measurement relations remain unresolved."
      evidence: "cp_air; cp_utility; cp_gas; cp_interface; cp_assets; cp_waste"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Reject any study that lacks the whole native/product/supplier/grade admission or uses a carrier mixture with the EO UUID; nominal100% cannot establish analytical purity or overwrite a hard native field."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "Fix first acceptance after completed filling, sealing, weight/leak quality release and the declared finished packing configuration. Independently sum unique accepted whole-contents net masses into Q and lock each original cohort. Gross dispatch, return, rework, retest and repeat release do not create a second event. Reconcile Q on the original acceptance basis against disjoint net externally retained delivery, every actual on-site accepted state, irreversible losses and other terminal dispositions. Returned-inspection and returned-rework stocks are states, not new output. Retain original accepted material lost by evaporation or leakage once and do not restore it into the surviving contents. Added material or contamination is a separate physical input; any genuinely new unaccepted addition needs distinct genealogy rather than counting the old parcel again. Old-cohort services use original Q0. Zero or unknown Q retains raw totals and an unresolved normalized result."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "Keep can bodies, crimp closures, protective plastic caps and cartons as distinct actual articles, with measured tare, receipts, installation, delivery, return, scrap and closing stocks. Where actual purchased articles are printed or labeled, retain their embedded upstream burdens; do not add imaginary separate ink or resin purchases. Actual on-site printing/labelling needs its concrete additional material/energy interfaces before a study claims coverage. Delivered packaging is an explicit physical output distinct from net sterilant. EO and nitrogen supply cylinders retain their complete arriving/returning tare, serial genealogy and residual contents separately. A reused cylinder is not newly manufactured for every fill and its return is not a coproduct credit. For catalysts, inlet filters and filler seals, keep actual new receipts, unused/in-service/retired masses and physical removals, together with the service/burden history. Compatible provider demand may have a different unit from the physical fleet ledger. Convert only with measured dimensions/mass and documented compatible service histories; do not invent a lifetime, per-item mass or causal share."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "Separate physical liquid transfer and evaporation from chemical reaction. Filling does not justify creating reaction water or conserving all EO through the oxidizer. The complete-oxidation identity C2H4O + (5/2)O2 → 2CO2 + 2H2O is an elemental check, not an assumed destruction efficiency, yield or emission factor. Measure actual EO inlet/outlet, CO2, CO, water phases, captured material and relevant other products; retain independent total mass and C/H/O balances, nitrogen stocks and phase changes. Maintain separate ledgers for actual oxygen uptake and ventilation carrier-air throughput. Preserve gross inlet/exhaust air, ambient CO2/humidity/inert constituents and actual nitrogen feed/stock/product/waste/outlet components in a physical ledger; do not invent emissions by counting unchanged ambient carrier gas again or assume nitrogen padding has zero mass. Preserve exothermic heat and actual preheat/fan/compressor and other source-qualified utility demand without imaginary heat export or duplicate imported heat."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "Vapor-phase EO, CO2, CO and water measurements use the complete applicable extractive FTIR procedure and Protocol/addendum in EPA Method320, with actual reference spectra, blanks, moisture/CO2 interference evaluation, dynamic spikes, recovery, transport losses, condensation, uncertainty and time coverage. EPA Method18 supplies a separate GC route only where its applicability and compound-specific identity/calibration, preservation and recovery conditions are met; it excludes compounds that polymerize before analysis. A hydrocarbon alarm calibrated for another propellant is not an EO concentration measurement, as the Accra Pac investigation demonstrates. Source method editions are not a claim of present legal approval. Actual/standard gas volume, wet/dry basis, temperature, pressure and composition must be compatible with concentration and flow; integrate a rate once and never add another time multiplier to an integrated volume. Workplace concentration alone is not a final emission load. Unknown method/matrix relations remain unresolved; a check pass never establishes them. Method320 covers IR-active vapor analytes with actual applicable spectra and spike/recovery qualification; it is neither a bulk-liquid EO assay nor a blanket nitrogen/oxygen method. Nitrogen, oxygen and any non-IR-active actual constituents need separately applicable composition/flow evidence."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "A rejected filled can, spent seal, filter or catalyst cell exported as one contaminated object retains its full receiver mass Qt, including substrate, retained EO/liquor/solids and water once. Nested tare and contaminants are not additional external wastes unless physically separated before the boundary. Retain actual receiver, transferred quantity and compatible treatment provider once. Separate that physical event from compatible non-overlapping cohort service demands A; the cohort demands must sum to actual modeled provider demand, while original Q or Q0 remains the denominator. Do not make a shared10kg physical export into2.5kg after25% attribution or charge10kg again to every cohort. These are arithmetic counterexamples, not site quantities or allocation defaults. Unknown causal shares/provider-unit mappings remain unknown. Unexpected liquid clean-up, wastewater, combustion or extra emissions require explicit complete atomic interfaces before a study claims coverage; source accident water is not a routine operating coefficient."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "The pneumatically driven EO pump and supplied-air respirator require two distinct whole-air Product inputs: compressed drive air and supplied respirator breathing air. Electricity or a compressor description does not replace either measured air quantity. Keep each actual supply grade and purpose, complete receipt/production, storage/header/hose holdup, use, leakage and exhaust ledgers with measured actual/standard and dry/wet volume, temperature, pressure, humidity, composition and time. Drive air cannot substitute for breathing air; no air-quality grade, pressure, flow or conditioning recipe is supplied here. Qualify the actual on-site or external air producer and compatible reference unit. Retain all real compression, conditioning, cooling, filter, oil, condensate, heat, utility, loss and asset/maintenance/inherited burdens once through either a genuinely qualified aggregate or the complete concrete expanded inventory. Do not invent an oil-free/oil-lubricated, electrical or other configuration, assume an available qualified dataset, or double-add embedded compressor electricity and conditioning history. Include every actual chemical, cooling, condensate, filter/oil waste and other interface under that qualified representation before a study claims complete coverage. Reconcile purpose-specific air exhaust with the full GasHouse/abator physical gas mixture and every actual other exit; do not assume all supplied air reaches the abator. Preserve gross introduced air and its nitrogen/oxygen/water components separately from actual resource-oxygen uptake and separately supplied nitrogen. Unchanged ambient carrier components are not duplicate elementary emissions or a second pure nitrogen/oxygen purchase. Actual component changes, gas/liquid transfers and other exits require evidence. Complete physical air totals remain distinct from compatible non-overlapping provider/cohort demand; raw demand enters the sole normalize operation once with original Q or Q0. Unknown essential state/grade/provider-unit or causal relations remain unresolved. Supply-to-device, device-exhaust and room-to-abator records are successive internal handoffs of the same physical air. Cancel those handoffs in consolidation instead of treating every stage as a new external receipt or outlet. Retain real stocks, leaks and other exits separately; differently conditioned volumes are not additive before an evidenced state conversion."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Require all atomic flows and full physical/interface/provider histories before declaring a study complete. Unknown essential methods, unknown causal shares and unknown provider-unit mappings remain unresolved; neither finite check success nor source registration grants scientific approval."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "epa-accrapac-2000; solventum-sds-2025; solventum-label-2026; nydec-electric-abator-2007; acc-eo-2023; gost-eo-2018; gost-water-1977; epa-method320-2019; epa-method18-2025; un-cpc3-intro; un-cpc3-notes; un-cpc21-2015; wco-hs38-2022"
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "The admitted whole EO can-filling route with complete declared site/cohort/provider interfaces"
  excluded_use: "Clinical efficacy/cycle guidance, legal permission, chemical synthesis, carrier blends, glass ampoules and unqualified heater/control variants"
  required_metadata: "whole nominally undiluted EO and CAS75-21-8; actual supplier and assay convention; liquefied contents and measured impurities/headspace; single-use crimp-sealed can configuration; actual nitrogen and pneumatic transfer; actual on-site reclamation/control units and qualified linked-producer interfaces; complete upstream EO and utility burdens; fixed first-acceptance gate and unique cohort; raw/WIP/FG/reclamation and inherited histories; complete package/cylinder tare and returns; actual receivers and compatible provider units; site and period and original Q0 services; proposed narrower classification inference; distinct drive-air and respirator-air grades and purposes with measured state and complete actual producer/exhaust histories"
  required_quality_disclosure: "Actual sources/editions/limits, supplier assay and matrix proof, physical stocks, independent Q/Q0, full waste/packaging and provider units, unknowns and separate classification/scientific/study states"
  update_trigger: "Changed whole formulation, supplier grade/route, package, reference gate, heater/control configuration, methods or previously unresolved causal/provider relation"
