    required_unit: "%"
    rule: "Keep nominal100% separate from measured analytical fractions and their wet/dry or liquid/vapor bases. No pure-EO equivalent denominator, sum-of-known-impurities closure of unknowns, or default carrier mass."
  - id: gas_phase
