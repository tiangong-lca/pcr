    required_property_ref:
      name: "Actual state and composition"
      uuid: ""
    required_unit: "kg"
    rule: "Convert volume only with measured state/composition and compatible method; preserve raw standard/actual and dry/wet records. Gas rate integrates once; phase change is not a new chemical source."
