      uuid: ""
    required_unit: "kWh"
    rule: "Retain actual metered electrical demand including preheat, ventilation and compressors. Heat recovery internal to the oxidizer is not another imported heat or an export credit."
  - id: provider_interface_state
    applies_to: "abator_gas_transfer; reclamation_liquid_transfer"
    required_property_ref:
      name: "Distinct phase-specific volume and mass"
      uuid: ""
    required_unit: "m3; kg"
    rule: "Preserve actual whole gas-mixture volume and liquid-mixture mass separately with phase/composition/T/P/wet-dry/actual-standard basis; conversion to actual native provider units needs an evidenced compatible mapping, never a pure-EO or gas-density default."
  - id: air_supply_state
    applies_to: "compressed_drive_air; respirator_breathing_air"
    required_property_ref:
      name: "Actual whole-air volume and state"
      uuid: ""
    required_unit: "m3"
    rule: "Measure drive air and respirator breathing air separately, with actual/standard and dry/wet volume, T/P, humidity, composition, actual grade and paired provider reference conditions. No pressure/flow/grade/density default; integrate rates once and preserve physical totals separately from compatible provider demand."
