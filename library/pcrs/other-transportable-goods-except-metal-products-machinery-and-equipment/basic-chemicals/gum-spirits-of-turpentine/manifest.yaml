  unresolved_flow_reasons:
    pine_oleoresin: "Whole received gum from living Pinus trees, including its measured water, terpene oil, resin and entrained debris. Weigh net contents apart from drum tare. Require the actual tapping/collection supplier, wood species, transport and allocated upstream inventory; do not replace the gum with pure resin acid or assign it zero burden. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    oxalic_acid: "Only the actually used oxalic acid product for metal-ion/colour control. Measure supplied mass, hydrate form, purity and any solution water separately in the constituent ledger. Laboratory recipes and historical dosage are not plant defaults. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    diatomaceous_earth: "Conditional actual filter aid, with supplier treatment/grade and moisture. Record its destination in wet filter cake and losses. Do not infer an activated-mineral manufacturing route from the classification leaf. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    filter_cloth: "Conditional actual cotton medium only; record replacement mass, service interval and retained oil. A different installed medium requires its own atomic material card rather than relabelling cotton. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    sodium_chloride: "Actual rock-salt bed replenishment for turpentine dehydration; record purity, moisture, opening/closing bed stock and brine removal. Do not infer complete water removal or zero salt entrainment from the existence of a dryer. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    direct_steam: "Gross external live steam actually injected into gum transfer, washing or distillation. Record each meter, pressure convention, temperature and dryness; injected water enters process mass and condensed water, not an indirect return. Require the real linked steam producer and supply enthalpy/reference basis. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    indirect_steam: "Gross steam crossing coils/jackets for melting, distillation or storage. Meter separately from live steam and keep the actual supplier basis; never subtract condensate mass from this gross input. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    process_water: "External liquid water for washing and cleaning. Meter each intake and distinguish reused still water, condensate and emulsion water, which are internal unless they cross the declared boundary. Convert volume only with the measured density/state. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    cooling_water: "Conditional external once-through cooling supply or measured makeup to the installed recirculating system. Declare which interface is used; gross circulation is not fresh withdrawal. Capture provider treatment and pumping boundaries. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    electricity: "Meter actual pumps, agitation, filtration, condenser/dryer and bulk storage/loading power. Bind the real voltage, grid/provider, geography and period; retain kWh here and convert only against the linked provider reference (1 kWh = 3.6 MJ). One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    raw_drum_tare_in: "Conditional physical incoming steel drum tare associated with the gum receipt, separate from gum net mass. Trace ownership, reuse and previously embedded container service; a full incoming tare is not automatically new drum manufacture. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    rosin_drum_in: "Actual new or service-attributed steel drum used for the co-produced rosin. Record each drum and lid mass, reuse history and supplier burden. Additional nonsteel components require separate cards. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    gum_rosin: "Whole actual nonvolatile co-product remaining after gum distillation, with accepted grade, water/foreign matter and net mass apart from its drum. Preserve its physical destination and embodied constituents before burden allocation. It is neither pure resin acids nor tall-oil/wood rosin. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    raw_drum_return: "Conditional actual empty drum tare returned to its owner. Match incoming drum identifiers, retained gum, damaged stock and scrap; it creates no extra PCR reference product, co-function or automatic avoided-steel credit. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    rosin_drum_delivered: "Physical steel drum and steel lid leaving with the rosin co-product, separate from net rosin. Match the input/stock/tare ledger. This transfer is packaging, not additional rosin or a second co-product entitlement. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    offgrade_turpentine: "Conditional actual external oil stream with identified receiver, quality, measured mass and economic/waste status. Internal heads/tails and rework remain in the internal ledger. An off-grade stream is not the accepted reference and must not also be counted as an air loss. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    indirect_condensate_return: "Conditional actual water returned to the external steam provider, with paired mass, pressure, temperature, contamination and acceptance evidence. Distinguish it from the aqueous distillate; heat recovery requires measured supply/return enthalpy and the provider convention. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    cooling_water_out: "Conditional single actual cooling outlet stream to a documented off-unit treatment or return receiver. Match the stated once-through/makeup interface and evaporative loss. A direct environmental discharge requires actual medium/species cards and reviewed scope, not this technical-stream identity. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    filter_cake: "One actual cake containing removed bark/dirt, spent filter aid, precipitated oxalates and retained resin/oil/water as present. Measure wet mass and constituent basis; do not add the same constituents again as separate exported pure products. Link actual treatment. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    wash_wastewater: "External spent wash phase after measured internal recycling, including actual soluble acid, organic load and suspended solids. Reprocessed muck is internal; only actual discarded muck goes into this stream or its own physically separate card. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    still_aqueous: "Actual external aqueous condensate after oil separation and internal reuse. Measure retained oil, water and destination. Water sent back to wash gum is a paired internal link, not both exported wastewater and fresh process-water input. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    dryer_brine: "One actual salt-bed liquor stream, with measured wet mass, water, dissolved salt and entrained oil. Keep its origin separate from wash water; if physically merged, meter the contributions and book the receiver link once. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    used_filter_cloth: "Conditional discarded actual cotton medium with oil/water retention and treatment manifest. Reusable cloth remaining onsite is stock; retained oil is not also counted in cake or fugitive emissions. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    cleaning_wastewater: "Actual segregated cleaning/spill-recovery water routed to external treatment. Record recovered oil returned to process, remaining wet mass and organic load. No detergent or solvent is assumed; any actual chemical requires its own atomic input and fate. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    steel_drum_scrap: "Conditional actually discarded steel tare with measured oil residue and documented recycler/treatment. A drum cannot appear both as intact return and scrap; preserve actual reuse/service allocation separately from physical mass. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    alpha_pinene_air: "Conditional measured alpha-pinene escaping actual preparation, condenser, tank and loading vents/fugitives. Use matrix-valid speciation and matched gas conditions; it is neither total turpentine loss nor a proxy for unidentified VOC. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    beta_pinene_air: "Conditional actual beta-pinene release, quantified independently with location, air subcompartment and monitoring coverage. Product beta-pinene concentration alone is not a fugitive emission factor. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    limonene_air: "Conditional actual limonene release only where confirmed in the supplied gum and vent. Other detected compounds require their own species cards, not addition to this named species. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
    water_vapour: "Actual water lost in venting or cooling evaporation, distinct from returned condensate and discharged liquid streams. Determine wet/dry gas basis and water balance; do not set evaporation to zero just to close the ledger. One concrete unselected exchange; UUID/provider identity requires independent matching, not a plural flow or automatic zero."
  source_scope: "Complete FAO 1995 gum-route monograph and independent EPA April1976 original support manufacturing/phase/wastewater distinctions; all historical quantities/ranges excluded. ILCD criterion applies to declared attributional burden allocation, independently of physical conservation."
