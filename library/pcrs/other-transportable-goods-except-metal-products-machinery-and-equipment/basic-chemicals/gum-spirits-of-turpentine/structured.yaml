system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground is one aggregate with separately metered stage ledgers: (a) receive/net-weigh gum, melt/dilute with traced recycled turpentine, condition/filter/wash and return muck as actually installed; (b) distil with separate indirect and injected steam, trap entrainment, condense and separate aqueous/oil phases, discharge whole rosin; (c) pass the oil through the actual salt dryer and account for brine/retained oil; (d) store, accept and bulk-load. Unused conditional rows require evidence of non-use, never an assumed zero. Additional actual filter media, chemicals, packaging components, species or outlets require separate atomic cards and review of their physical fate. No source case quantities, yields, temperatures, pressures, times, dose or purity ranges are adopted (fao-gum-1995; epa-gum-1976)."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "This route uses externally supplied electricity and water steam from real linked producers. Onsite boilers, fuel combustion, flaring and thermal VOC destruction are outside this bounded foreground. An actual installation using them cannot hide their fuel or emissions inside an unidentified heat input: extend and review the model with each real fuel, combustion air/oxygen, water, emitted species, ash and useful-heat interface, or use a complete separately modelled actual utility/treatment producer with matching transfer references. Direct discharge to environmental water and external captured-gas treatment likewise require the actual receiver/medium and complete links."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "Before allocation, reconcile each stage on whole wet mass: opening stock + actual external receipts + paired internal receipts = closing stock + actual external physical outlets + paired internal transfers. Reconcile water separately, including supplied gum moisture, live steam, washing water, salt-bed water, condensate, liquid discharge, product moisture, evaporation and retained stocks. For every measured constituent/element X use S0_X + I_X + G_X = S1_X + O_X + C_X, where S0_X/S1_X are opening/closing constituent stock, I_X/O_X are actual inputs/outputs and G_X/C_X are actual generation/consumption; elements have no chemical generation/consumption, while reactive species require documented terms. Record any real oxidation/degradation instead of assuming a pure C10H16 formula. GC peak-area percentages are not automatically whole-product mass fractions. Unknown fractions, water and nonvolatile matter remain explicit; no unmeasured remainder becomes alpha-pinene. Technical wastes retain their whole mixed-stream mass and analytical constituent loads without double-counting those loads as extra exchanges."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "Lock Q = sum of net mass at unique actual first acceptance events for the declared cohort and gate. Repeated QC, returns, dilution-oil recycle, re-distillation and reacceptance do not create another event. Q is whole accepted product, not dry terpene mass, pinene content, gross tank throughput, dispatched mass or a second external physical output. Partition this original accepted mass basis among disjoint states at the observation cutoff: final external delivery after recorded returns, held finished stock, quarantine, rework/WIP, external downgrade/disposal, sampling and irreversible post-acceptance losses. Trace returned or reworked portions by parent event so a gram has only one current destination; external additions and their burdens stay separate. Do not restore lost original mass into a surviving remainder and also count it as loss. Only when there are no other post-gate exits, losses or held states may Q = delivery + new finished-stock increment be used. Otherwise use the complete disjoint state reconciliation; an unclosed origin/stock bridge blocks a complete dataset. Later storage/loading services for this cohort retain original Q."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "Cover raw, WIP, dilution-oil and accepted-product opening/closing stocks and their actual cohorts. Opening WIP carries inherited foreground work and material history; do not model it as burden-free new gum. Carry embedded supplier burdens once, append only new work, and never duplicate earlier melting/distillation already included in a provider. Retained internal oil/muck has physical transfer and stock history, not an extra purchased input or a residual zero-credit outlet. Purchased startup oil and old accepted stock are traced separately from newly recovered gum-derived material. A complete inventory requires consistent inherited and current provider bases, not merely a net-period material purchase total."
      source_ids: []
