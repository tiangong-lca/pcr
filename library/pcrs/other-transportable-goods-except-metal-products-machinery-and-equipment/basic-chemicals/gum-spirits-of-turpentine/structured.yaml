published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Gum turpentine manufacturing background with matching origin, grade, reference and complete inventory"
  allowed_use: "Collect/build an actual site-, period-, cohort- and declared-boundary whole-product inventory"
  excluded_use: "Whole-leaf coverage, other routes, pure components, default recipes/yields/emission factors, evidence-free zero burdens or substitution credits"
  required_metadata: "All qualifier keys; original Q and state/stock bridge; actual atomic exchanges/methods; upstream/treatment references; physical and allocated burden ledgers; uncertainty/source applicability"
  required_quality_disclosure: "Pending identities/quantities, actual method/provider evidence, historical-source limits and uncovered operations; method guidance is not a populated or scientifically approved dataset"
  update_trigger: "Changed origin/species/grade, operation/chemical, salt bed or water recycling, steam state/provider, actual release/outlet, stock/acceptance rule, cofunction or allocation"
data_sources:
  - id: "fao-gum-1995"
    type: "official_guidance"
    reference: "FAO, Gum naval stores: turpentine and rosin from pine resin, Non-Wood Forest Products 2 (1995), Introduction pp.1-2; Chapter 3 pp.24-27, Figure 2 p.25; Appendix 2 pp.43-45. https://www.fao.org/4/v6460e/v6460e.pdf"
    used_for: "Gum/wood/sulphate route distinction; actual preparation, recycled dilution oil/muck, distillation, phase separation, salt drying, bulk storage and whole-mixture quality context. Historical case doses, yields, equipment conditions, trade grades and composition examples are excluded as defaults."
  - id: "epa-gum-1976"
    type: "official_guidance"
    reference: "US EPA, Development Document for Interim Final Effluent Limitations, Guidelines and Proposed New Source Performance Standards for the Gum and Wood Chemicals Manufacturing Point Source Category, EPA 440/1-76/060b (April 1976), Figure IV-2 p.38 and Subcategory B p.39; wastewater discussion pp.53-54. https://19january2025snapshot.epa.gov/sites/default/files/2019-12/documents/gum-wood-chemicals-mfg_dd_1976.pdf"
    used_for: "Independent observed gum-route operations and three distinct wastewater origins: gum wash, still aqueous condensate and salt-dryer brine; actual plant variation/reuse. Adjacent wood extraction route and historical discharge quantities/limits are not adopted."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "JRC, ILCD Handbook, General Guide - Detailed Guidance, first edition March 2010, sections 7.9.3.1-2 pp.257-258 (PDF277-278). https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Declared attributional burden hierarchy: subdivision, determining physical causality, then actual market-value criterion for inseparable remaining burdens. No default shares or prices."
