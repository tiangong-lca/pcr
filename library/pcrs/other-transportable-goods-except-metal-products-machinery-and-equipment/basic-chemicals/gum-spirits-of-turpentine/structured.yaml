allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Keep whole physical mass, water, elemental/species and internal-transfer ledgers intact. For the declared attributional inventory, first subdivide dedicated operations where measured; then apply demonstrated determining physical causality per burden, and use comparable actual gate revenue for only the inseparable remainder (jrc-ilcd-2010). Turpentine versus rosin mass proportions alone do not establish heat causality. Record all actual economic cofunctions and their stock/grade/value, including off-grade product if truly sold; waste treatment remains a burden with a real receiver. Allocate actual rosin packaging to its function without manufacturing a packaging cofunction. Recycled internal oil is no cofunction, no avoided product and no additional Q. Do not erase physical species or waste outputs by multiplying them away to obtain closure; allocation is a separate burden ledger. No default co-product ratio, price, displacement or residual credit is prescribed."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_gate
      process_id: "gum_turpentine"
      flow_role: "reference and stock cohort"
      record_type: "acceptance_mass_ledger"
      raw_fields: "lot; actual first-acceptance event id/time; net mass; gross/tare; grade/origin; stock state; dispatch; return/rework parent; original-acceptance mass basis"
      collection_method: "Calibrated weighing or traceable tank volume with measured density and temperature; pair laboratory acceptance and uniquely identified event; follow every later state to one disjoint destination."
      unit: "kg"
      frequency: "every first acceptance and every subsequent state change"
      temporal_coverage: "whole declared campaign and full selected cohort history through stated observation cutoff"
      site_scope: "actual gum distillation site, grade and bulk gate; identify opening accepted stock separately"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; event uniqueness; COA; tank state/density; parent links; full stock/disposition reconciliation; Lock Q as sum of unique first-acceptance net kg; normalized values per 1 kg reference flow; no reacceptance or gross-loop increment."
    - protocol_id: cp_material
      process_id: "gum_turpentine"
      flow_role: "individual external materials"
      record_type: "receipt_consumption_record"
      raw_fields: "individual SKU and chemical; supplier; origin/grade; net wet mass; water/assay; opening/closing stock; receipt/return; stage; upstream reference and amount basis"
      collection_method: "Weigh individual lots and reconcile stock withdrawals; obtain complete supplier product and upstream inventory records; use documented matrix-valid analysis with sample, calibration, recovery, uncertainty and units."
      unit: "kg"
      frequency: "each receipt, charge, return and stock survey"
      temporal_coverage: "same production campaign and inherited source history"
      site_scope: "each actual material interface and contributing supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; weigh tickets; assay method/version; stock bridge; provider completeness and nonduplicate burden record; Individual attributable net external material amount per 1 kg reference flow; internal recycled oil is excluded from purchases and kept in cp_process."
    - protocol_id: cp_process
      process_id: "gum_turpentine"
      flow_role: "stages, coproducts and residuals"
      record_type: "stage_mass_species_record"
      raw_fields: "stage/batch; wet mass; composition; raw/WIP/FG opening/closing stock; dilution oil; heads/tails; muck; rosin; off-grade; residues; destinations; inherited burden history"
      collection_method: "Weigh all external outlets and paired internal transfers; sample each physical phase representatively; retain complete matrix-valid water/organic/species or elemental analysis procedure, calibration and uncertainty; reconcile wet/dry analytical basis explicitly."
      unit: "kg"
      frequency: "each batch/transfer/disposition and stock boundary"
      temporal_coverage: "entire cohort including opening WIP and all reprocessing cycles"
      site_scope: "preparation, distillation/condensation, dehydration, storage/loading in the one aggregate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "batch tickets; phase samples; paired meters; stock/constituent closure and residual receiver records; Each attributable external outlet per 1 kg reference flow; paired internal transfers cancel once, not all gross circulation."
    - protocol_id: cp_water
      process_id: "gum_turpentine"
      flow_role: "individual water interfaces"
      record_type: "water_phase_record"
      raw_fields: "intake/outlet id; measured wet mass/volume/density/T; water fraction; COD/TOC; suspended solids; salt/acid/oil; recycle; stock; receiver; cooling scheme"
      collection_method: "Meter each physically separate stream; use proportional representative samples and calibrated matrix-valid analyses; trace all merges and actual receiver treatment; distinguish process from noncontact cooling."
      unit: "kg"
      frequency: "each batch/drain plus continuous intake where installed"
      temporal_coverage: "whole campaign including cleaning, startup and shutdown"
      site_scope: "actual wash, still-water, dryer, cleaning and cooling interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibrations; density/state; water/salt/organic closure; treatment manifests and provider reference; Each individual external wet-stream amount per 1 kg reference flow; merged receiving link once; internal water reuse paired and cancelled."
    - protocol_id: cp_utility
      process_id: "gum_turpentine"
      flow_role: "electricity and two separate steam interfaces"
      record_type: "utility_supply_return_record"
      raw_fields: "meter/stage; gross electricity kWh; direct steam kg; indirect steam kg; return condensate kg; T/P convention/dryness; enthalpy; provider reference; service/stock attribution"
      collection_method: "Calibrated submetering or documented equipment load/time backed by measured use; paired steam supply/return metering; verify real producer inventory and delivered reference without duplicating included distribution."
      unit: "kWh; kg; MJ"
      frequency: "continuous meters and each supplier settlement"
      temporal_coverage: "whole campaign and separate later storage services"
      site_scope: "external utility boundary at actual supply/return meters"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter records; pressure convention; steam quality; enthalpy source; supplier lifecycle scope and reconciliation; Each gross supplied utility and actual condensate return separately per 1 kg reference flow; match provider unit/reference; later cohort services use original Q."
    - protocol_id: cp_air
      process_id: "gum_turpentine"
      flow_role: "each actual released species"
      record_type: "species_release_record"
      raw_fields: "vent/fugitive id; species; measured concentration and gas flow; wet/dry basis; T/P; time; capture/retained oil; actual medium; water evaporation; uncertainty"
      collection_method: "Use a documented complete sampling/analytical method valid for each species and matrix, with calibrated response, blanks/recovery, detection limit and time coverage; reconcile actual vent plus fugitive outlets with retained/captured material."
      unit: "kg"
      frequency: "representative monitored runs plus all abnormal events"
      temporal_coverage: "campaign operating modes, idle storage and loading"
      site_scope: "actual preparation, condenser, dryer, tanks and transfer release points"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "complete methods; chromatograms/calibration; gas state/time; source coverage; mass/species reconciliation; Each individual actually released species per 1 kg reference flow; no total-VOC-to-single-species substitution and no capture/emission overlap."
    - protocol_id: cp_pack
      process_id: "gum_turpentine"
      flow_role: "individual container component"
      record_type: "tare_ownership_transfer_record"
      raw_fields: "drum id; steel body/lid tare; contents gross/net; ownership; receipts; opening/closing stock; return; delivered tare; scrap; contamination; reuse counts; embedded service"
      collection_method: "Weigh matching empty/full containers; reconcile each component and unique transfer; obtain service/manufacture burden and actual receiver records, avoiding duplicate supply already inside gum provider."
      unit: "kg"
      frequency: "each container transfer, replacement and stock survey"
      temporal_coverage: "full campaign plus inherited reuse history"
      site_scope: "raw-gum drums and actual rosin drums/lids; bulk turpentine tare excluded"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "paired weigh tickets; component stock bridge; ownership/reuse evidence; delivery/return/scrap manifests; Each physical tare and separately attributed packaging service per 1 kg reference flow; no net-product or cofunction duplication."
    - protocol_id: cp_allocation
      process_id: "gum_turpentine"
      flow_role: "burden attribution"
      record_type: "causality_revenue_record"
      raw_fields: "stage-specific burden; physical cause; actual cofunction quantity; accepted sales/stock grade; comparable gate prices; revenue period; residual stream/waste status; selected attributional model"
      collection_method: "Subdivide measured dedicated operations first; test determining physical causality per exchange; for inseparable remainder use documented actual comparable gate revenue under the declared attributional model; retain sensitivity and all physical flows."
      unit: "kg; currency; fraction"
      frequency: "each campaign and material market/grade change"
      temporal_coverage: "same campaign with representative disclosed price averaging"
      site_scope: "actual aggregate and all economic cofunctions at equivalent gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "submetering; causal assessment; price invoices; coproduct stock valuations; sensitivity; no residual-credit assumption; Attributable burden per 1 kg reference flow; allocation shares sum to one only over actual cofunctions; no allocation of physical atoms away."
  calculation_rules:
    - id: normalize_inventory
      applies_to: "all inventory rows"
      rule: "Divide each attributable campaign exchange by locked accepted net Q to express it per 1 kg reference flow. Keep physical totals separately and apply the declared burden allocation only to the burden ledger."
      inputs:
        - "individual measured exchange"
        - "locked Q"
        - cp_gate
        - "applicable individual protocol"
      output: "individual normalized exchange per 1 kg reference flow"
      source_ids:
        - fao-gum-1995
        - epa-gum-1976
        - jrc-ilcd-2010
    - id: accepted_cohort
      applies_to: "accepted_turpentine"
      rule: "Lock Q = sum of net mass at unique actual first acceptance events for the declared cohort and gate. Repeated QC, returns, dilution-oil recycle, re-distillation and reacceptance do not create another event. Q is whole accepted product, not dry terpene mass, pinene content, gross tank throughput, dispatched mass or a second external physical output. Partition this original accepted mass basis among disjoint states at the observation cutoff: final external delivery after recorded returns, held finished stock, quarantine, rework/WIP, external downgrade/disposal, sampling and irreversible post-acceptance losses. Trace returned or reworked portions by parent event so a gram has only one current destination; external additions and their burdens stay separate. Do not restore lost original mass into a surviving remainder and also count it as loss. Only when there are no other post-gate exits, losses or held states may Q = delivery + new finished-stock increment be used. Otherwise use the complete disjoint state reconciliation; an unclosed origin/stock bridge blocks a complete dataset. Later storage/loading services for this cohort retain original Q."
      inputs:
        - "unique actual acceptance records"
        - "net weighings"
        - "state/parent history"
        - cp_gate
      output: "locked Q and complete disjoint original-mass disposition bridge"
      source_ids:
        - fao-gum-1995
    - id: stage_conservation
      applies_to: "all inventory rows"
      rule: "Before allocation, reconcile each stage on whole wet mass: opening stock + actual external receipts + paired internal receipts = closing stock + actual external physical outlets + paired internal transfers. Reconcile water separately, including supplied gum moisture, live steam, washing water, salt-bed water, condensate, liquid discharge, product moisture, evaporation and retained stocks. For every measured constituent/element X use S0_X + I_X + G_X = S1_X + O_X + C_X, where S0_X/S1_X are opening/closing constituent stock, I_X/O_X are actual inputs/outputs and G_X/C_X are actual generation/consumption; elements have no chemical generation/consumption, while reactive species require documented terms. Record any real oxidation/degradation instead of assuming a pure C10H16 formula. GC peak-area percentages are not automatically whole-product mass fractions. Unknown fractions, water and nonvolatile matter remain explicit; no unmeasured remainder becomes alpha-pinene. Technical wastes retain their whole mixed-stream mass and analytical constituent loads without double-counting those loads as extra exchanges."
      inputs:
        - "actual stage wet/constituent stock and transfers"
        - cp_process
        - cp_water
        - cp_air
        - cp_material
      output: "unallocated physical closure with uncertainty and unresolved residuals"
      source_ids:
        - fao-gum-1995
        - epa-gum-1976
    - id: utility_reference
      applies_to: "direct_steam; indirect_steam; indirect_condensate_return; electricity"
      rule: "Preserve gross supply and actual return separately. Match kg steam state and supplier reference; determine useful heat from actual measured supply/return enthalpy, losses and injection fate. Convert electrical kWh to MJ only by 3.6 MJ/kWh if the matched provider requires MJ."
      inputs:
        - "metered gross supplies and returns"
        - states
        - "provider basis"
        - cp_utility
      output: "matched utility exchanges and nonduplicate heat burden"
      source_ids:
        - fao-gum-1995
        - epa-gum-1976
    - id: burden_allocation
      applies_to: "all inventory rows"
      rule: "Keep whole physical mass, water, elemental/species and internal-transfer ledgers intact. For the declared attributional inventory, first subdivide dedicated operations where measured; then apply demonstrated determining physical causality per burden, and use comparable actual gate revenue for only the inseparable remainder (jrc-ilcd-2010). Turpentine versus rosin mass proportions alone do not establish heat causality. Record all actual economic cofunctions and their stock/grade/value, including off-grade product if truly sold; waste treatment remains a burden with a real receiver. Allocate actual rosin packaging to its function without manufacturing a packaging cofunction. Recycled internal oil is no cofunction, no avoided product and no additional Q. Do not erase physical species or waste outputs by multiplying them away to obtain closure; allocation is a separate burden ledger. No default co-product ratio, price, displacement or residual credit is prescribed."
      inputs:
        - "measured dedicated burdens"
        - "determining causes"
        - "all cofunction quantities and gate values"
        - cp_allocation
      output: "explicit allocation shares and sensitivity separate from physical ledgers"
      source_ids:
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Verify actual gum origin, species, supplied whole-mixture state and grade; link each selected identity and real provider at the same property/unit/reference. A family name or classification is insufficient."
      evidence: "supplier traceability; complete direct identity and provider records; actual acceptance specification"
    - id: mass_and_cohort
      applies_to: "all inventory rows"
      requirement: "Require positive locked Q, calibrated net measurements, complete raw/WIP/FG/return cohorts and disjoint post-gate origin closure; no duplicate first acceptance."
      evidence: "cp_gate; cp_process; cp_material; cp_pack; event/stock audit"
    - id: analytical_basis
      applies_to: "all inventory rows"
      requirement: "Retain complete actual sample handling and matrix-valid method/version, mass versus volume units, moisture, calibrated response/recovery, blanks and uncertainty. Product species composition is measured, not inferred from a pure formula, source example or uncorrected peak areas. No numerical grade threshold is prescribed here."
      evidence: "cp_material; cp_process; cp_air; actual lab procedures/results and lot COA"
    - id: completeness
      applies_to: "all inventory rows"
      requirement: "Record every actual chemical, utility, packaging component, mixed waste and released species atomically. Missing identity or site quantity is disclosed and prevents claiming a populated complete dataset for that row; an absent essential method/physical interface blocks applicable readiness."
      evidence: "site walkdown; complete PFD and meter list; supplier/treatment links; explicit non-use evidence"
    - id: coverage
      applies_to: "all inventory rows"
      requirement: "Cover startup, normal runs, downtime, cleaning, loading, off-grade, spills and actual uncertainty during the declared period; disclose historical-source and site specificity. Do not import FAO/EPA case values as current industry ranges."
      evidence: "all eight protocols; operating-mode/time and sampling coverage; data gap log"
