allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "joint synthesis/separation"
    rule: "First assess justified subdivision of attributable equipment/services or supported system expansion under the declared study method. Where allocation remains necessary, assess a justified physical relationship; economic allocation is a disclosed fallback with actual matched-period quantities/prices and sensitivity. No automatic equal, mass, nitrogen or sales-value share is imposed."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_physical
    applies_to: "all stage ledgers"
    rule: "Preserve full unallocated masses, actual component changes and C/N/water balances independently of the environmental attribution matrix. A recycled amine can react to another amine; do not demand individual molecular conservation or scale physical feed, waste, emissions or coproduct masses by an environmental share."
    source_ids:
      - epa-amination-1979
      - basf-methylamines
      - ef-allocation-2021
  - rule_id: allocation_recycles
    applies_to: "amine recycle and waste"
    rule: "Internal recycle is neither external saleable coproduct nor avoided virgin product credit. Distinguish actual DMA/TMA product export, return to reaction, off-spec return, captured vapour and waste transfer. Treatment and potential recovery credits must follow one documented compatible model without double counting."
    source_ids:
      - epa-amination-1979
      - ef-allocation-2021
  - rule_id: allocation_cohorts
    applies_to: "raw, WIP and finished stocks"
    rule: "Keep a vector of each exchange's inherited burdens for raw feed, work in progress and finished product. Allocate new-period activities to the cohorts that caused them. Carry closing burdens forward; opening finished stock does not inherit a second share of new production or create another reference denominator. For every stock parcel and exchange, distinguish physical supplier quantity, carried inventory coefficients, linked provider LCI and new foreground services. If historical upstream LCI is already embedded in the chosen input provider, do not add an overlapping inherited vector again. Reconcile provenance, inventory coverage and state gate for each actual demand; use an explicit non-overlapping representation, never count the same supply or service twice and never erase unknown burdens to force closure."
    source_ids:
      - ef-allocation-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "finishing"
      flow_role: "accepted final product"
      record_type: "unique acceptance and mass records"
      raw_fields: "cohort/lot ID; first-acceptance timestamp; actual grade and state; net mass; assay; dispatch event; new closing FG; opening FG; return/retest; remaining service; unique event net full mass and locked original Q; parcel-linked post-acceptance event/time/destination; net D_new/F_new_close/L_new; temporary rework/return and cancellation links"
      collection_method: "Calibrated net scale or mass-flow record with matched sample and release certificate. Link every mass parcel to one first acceptance; identify new production, old dispatch, rejection, return and retest separately. Aggregation controls: per 1 kg reference flow; Q is the full net mass of unique new first acceptances, not all dispatch. Lock actual first-acceptance event Q and reconcile mutually disjoint net D/FG/L destinations on the original acceptance basis; the two-term bridge applies only when L is zero. The declared reference gate is the actual first-acceptance gate for the full anhydrous commercial grade. Its event mass is locked once. Eligible closing FG meets that same acceptance gate; packaging/storage/loading services still outstanding within the declared factory-supply boundary are explicitly accrued or later attributed to the original cohort and original Q. The acceptance-event ledger is separate from actual physical dispatch/stock/loss ledgers. Do not add locked Q again as an external physical product on top of dispatch, closing stock and post-gate exits. Where post-gate material handling is a separate process/state, retain real paired transfers and actual losses; internal acceptance is not a second external output."
      unit: "kg; mass fraction"
      frequency: "each lot/dispatch and period endpoints"
      temporal_coverage: "complete declared operating period"
      site_scope: "same grade/route/site and acceptance gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, tare, lab recovery, acceptance register and parcel/stock reconciliation"
    - protocol_id: cp_material
      process_id: "synthesis_separation_finishing"
      flow_role: "each external material and saleable coproduct"
      record_type: "receipts, withdrawals and composition"
      raw_fields: "row/stage; whole SKU mass; opening/closing raw/WIP/FG; CAS; all constituents; actual provider; catalyst lot/full formulation and lifetime; net product export"
      collection_method: "Stock-adjusted calibrated receipts/withdrawals and batch assays; distinguish new supply from internal return and net DMA/TMA export. Record actual catalyst and oil lifetimes and activity attribution, not an assumed factor. Aggregation controls: per 1 kg reference flow; preserve absolute physical quantities and attributable exchange vectors before normalization"
      unit: "kg; mass fraction"
      frequency: "each receipt/withdrawal, assay and campaign; period endpoints"
      temporal_coverage: "complete period plus inherited stock history"
      site_scope: "actual site, equipment and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices, calibration, assays, supplier declarations, lifetime records and inventory reconciliation"
    - protocol_id: cp_links
      process_id: "synthesis_separation_finishing"
      flow_role: "crude mixture, purified MMA and recycle links"
      record_type: "stage mass and constituent transfer records"
      raw_fields: "paired row IDs; interval; whole mass; water/amine/methanol/ammonia fractions; gases; pressure/temperature; stock; inherited burdens"
      collection_method: "Synchronized calibrated meters/weighing and representative same-stream assays at both ends; investigate discrepancies, retention and actual leaks before aggregation. Preserve internal chemical conversion and recycle destinations. Aggregation controls: per 1 kg reference flow; identical physical mass/composition/burden at paired transfer ends; cancel links only in aggregate"
      unit: "kg; mass fraction"
      frequency: "each transfer and aligned meter interval"
      temporal_coverage: "complete period and opening/closing WIP"
      site_scope: "same physical stream and matched stage gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration, stream sampling, lag/stock reconciliation and signed link register"
    - protocol_id: cp_utility
      process_id: "synthesis_separation_finishing"
      flow_role: "each utility and return"
      record_type: "stage-meter and provider records"
      raw_fields: "row/stage; kWh/MJ; steam and condensate kg; pressure/temperature/dryness/enthalpy; water makeup/circulation/evaporation/blowdown; cooling boundary; provider; later service cohort"
      collection_method: "Time-aligned stage meters and invoices; identify net imported electricity/steam/water, internal heat, clean condensate return and physical cooling losses. Record actual grid voltage and reference quantity; later storage/loading uses original cohort identifiers. Aggregation controls: per 1 kg reference flow; one purchase per actual service, consistent supplied/returned states, separate internal circulation"
      unit: "kg; MJ; kWh; state units"
      frequency: "meter interval, service event and period endpoints"
      temporal_coverage: "complete period and later linked service intervals"
      site_scope: "actual supply/return and equipment boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated meters, invoices, state measurements, verified conversions and service register"
    - protocol_id: cp_waste
      process_id: "synthesis_separation_finishing"
      flow_role: "each segregated waste transfer"
      record_type: "weighing, analysis and recipient records"
      raw_fields: "row/stage; wet whole kg; water and CAS constituents; gas composition; nitrogen/COD methods and overlap; detection/recovery; stock; recipient; transport/treatment"
      collection_method: "Segregated calibrated weighing/metering and representative matrix-specific assays; verify each recipient/treatment quantity and distinguish full waste stream from analytical contained species. Keep clean return separate from contaminated wastewater. Aggregation controls: per 1 kg reference flow; full transfer mass before species analysis; no emission double counting"
      unit: "kg; mass fraction; analytical concentration and basis"
      frequency: "each transfer, representative composite and period endpoints"
      temporal_coverage: "complete period including startup/cleaning"
      site_scope: "named physical stream and actual recipient gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "manifests, lab recovery/blanks, detection limits, recipient/provider acceptance and stock reconciliation"
    - protocol_id: cp_air
      process_id: "synthesis_separation_finishing"
      flow_role: "each final outdoor-air release"
      record_type: "validated species tests and flow/activity records"
      raw_fields: "stage/source; species/CAS; final compartment; concentration; flow; wet/dry/standard state; time; capture efficiency evidence; captured destination; leaks; detection limit"
      collection_method: "Representative species-specific final-outlet tests and actual fugitive inventory, including abnormal events. Verify concentration/flow/state/time compatibility and amine recovery. Separate ambient release, captured transfer and internal vapour return. Aggregation controls: per 1 kg reference flow; sum actual species mass once over covered source/time intervals"
      unit: "kg; concentration; gas volume/time"
      frequency: "test campaign plus continuous/activity records; all emitting modes"
      temporal_coverage: "complete declared operating period"
      site_scope: "actual vent, fugitives and control train"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "source tests, calibration, sampling recovery, blanks, uncertainty, measured control and source register"
    - protocol_id: cp_stocks
      process_id: "synthesis_separation_finishing"
      flow_role: "raw/WIP/FG cohort and exchange inheritance"
      record_type: "linked stock and burden-vector ledger"
      raw_fields: "every stock parcel; opening/closing full mass and composition; first-acceptance cohort; original Q; each inherited exchange; period additions; sale/waste/return; later storage/loading service; provider-embedded historical LCI and inherited-vector overlap map; actual supply/service demand IDs"
      collection_method: "Reconcile opening stock, new activities, physical transfers and closing stock by parcel and each exchange. Retain previous-period coefficients and provenance. Unknown inherited burdens remain unknown; never set them to zero or spread them over unrelated new production. Aggregation controls: per 1 kg reference flow; carry each cohort's burdens and use its original positive Q for later services; Q=0 or unknown stays raw For every stock parcel and exchange, distinguish physical supplier quantity, carried inventory coefficients, linked provider LCI and new foreground services. If historical upstream LCI is already embedded in the chosen input provider, do not add an overlapping inherited vector again. Reconcile provenance, inventory coverage and state gate for each actual demand; use an explicit non-overlapping representation, never count the same supply or service twice and never erase unknown burdens to force closure."
      unit: "kg; each exchange's own unit"
      frequency: "period endpoints, every cohort transition and later service event"
      temporal_coverage: "current period and linked prior/later cohorts"
      site_scope: "same actual stocks, acceptance gate and environmental allocation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed stock reconciliation, immutable acceptance IDs, previous burden vectors and uncertainty register"
  calculation_rules:
    - id: calc_acceptance
      applies_to: "finished_mma"
      rule: "Q is the finite positive net full-product mass of actual uniquely identified first-acceptance events for the new cohort; lock it at the declared acceptance gate. Reconcile the same parcels on their original acceptance basis through the mutually disjoint net-state bridge Q = D_new + F_new_close + L_new: net new-cohort dispatch, new-cohort closing accepted FG, and separately evidenced post-acceptance loss/disposal or later-state destinations not already in dispatch/FG. The two-term dispatch-plus-FG bridge is valid only when L_new is zero. Opening FG, previously accepted returns/retests/redelivery and gross internal transfers never create a second event or enlarge Q. Follow temporary rework/return parcels to their eventual net state; do not retain both a temporary L entry and its later dispatch/FG. Closing FG must satisfy the same accepted grade and declared gate, with remaining included loading services accrued or added to that original cohort. Zero or unknown event Q remains raw with normalization unavailable; L_new is not a balancing plug."
      inputs:
        - cp_reference
        - cp_stocks
      output: "unique accepted full-product Q"
      source_ids:
        - eastman-mma-product
        - eastman-mma-spec
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "For exchange j and product cohort k, normalized amount = attributable exchange j for cohort k / original accepted full-product Q of cohort k. Attribute current activities and inherited stocks before dividing. Keep absolute physical totals alongside the allocated vector. Never divide by all dispatch, net stock change, pure MMA content, contained N or coproduct mass. The locked first-acceptance event Q is not recomputed from surviving output after post-gate losses. Keep unallocated physical exchange numerators separate from the environmental attribution matrix; physical coproducts are not divided or reduced by allocation shares."
      inputs:
        - cp_reference
        - cp_stocks
        - "linked row protocol"
      output: "per 1 kg reference flow inventory"
      source_ids:
        - ef-allocation-2021
    - id: calc_stock_vectors
      applies_to: "all inventory rows"
      rule: "For each exchange j, opening raw/WIP inherited burden plus new attributable activity equals burdens transferred to new cohorts, retained closing raw/WIP, other cohorts and disclosed residual destinations. Reconcile finished-stock exchange vectors independently: opening FG plus new accepted FG equals dispatch, closing FG and measured loss destinations. Preserve allocations and signs without discarding inherited coefficients. For every stock parcel and exchange, distinguish physical supplier quantity, carried inventory coefficients, linked provider LCI and new foreground services. If historical upstream LCI is already embedded in the chosen input provider, do not add an overlapping inherited vector again. Reconcile provenance, inventory coverage and state gate for each actual demand; use an explicit non-overlapping representation, never count the same supply or service twice and never erase unknown burdens to force closure."
      inputs:
        - cp_stocks
        - cp_material
        - cp_links
      output: "exchange-specific carry-forward and reconciliation"
      source_ids:
        - ef-allocation-2021
    - id: calc_later_services
      applies_to: "electricity_finish; loading_mma_air; all later services"
      rule: "Later storage/loading/retest/return handling is additional exchange activity of the original accepted cohort. Divide it by that cohort's original Q and revise/accrue its service inventory without creating new product output or reallocating old stock to current new production. If original Q or inherited vector is unknown, report the raw service total and unresolved normalization."
      inputs:
        - cp_stocks
        - cp_utility
        - cp_air
        - cp_reference
      output: "service attribution to original cohort"
      source_ids:
        - ef-allocation-2021
    - id: calc_components
      applies_to: "physical stream ledgers"
      rule: "Component kg = measured whole-stream kg multiplied by same-stream measured component mass fraction; reconcile water and quantified unknowns. Whole supplied MMA and its trace constituents are one commercial exchange; component analysis does not create extra purchased products or releases. As-N requires a verified species/formula conversion, never assumed amine identity."
      inputs:
        - cp_material
        - cp_links
        - cp_reference
        - cp_waste
      output: "whole-stream and constituent ledgers"
      source_ids:
        - eastman-mma-spec
        - epa-tkn-1993
    - id: calc_balance
      applies_to: "all physical stages"
      rule: "Reconcile measured total mass and C/N/H/O elemental content across feed, reaction water, actual amine conversion, saleable products, all wastes/releases and stock change. Species-specific MMA/DMA/TMA/methanol/ammonia changes follow actual chemistry; only conserved elements, not all reacting species, must close. Unknown composition prevents asserted closure. Never impose theoretical recipe/yield as measured input."
      inputs:
        - cp_material
        - cp_links
        - cp_waste
        - cp_air
        - cp_stocks
      output: "physical element and mass checks"
      source_ids:
        - epa-amination-1979
        - basf-methylamines
        - epa-tkn-1993
    - id: calc_release
      applies_to: "all elementary rows"
      rule: "Species kg = sum of compatible measured concentration in mg/m3 times gas flow in m3/h times hours, multiplied by 0.000001; use actual compatible states and validated recovery. This is a conversion, not an emission default. Correct overlapping source/time intervals and keep captured material outside emitted mass."
      inputs:
        - cp_air
        - cp_reference
        - cp_stocks
      output: "raw species kg and attributable normalized release"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Verify full native name, type, physical state/composition, route/comment, reference property and provider quantity. Unresolved ordinary UUIDs/providers remain gaps; never substitute a related species, generic use proxy, elementary product or pure component for preparation."
      evidence: "Direct identities and actual supply/treatment records"
    - id: dq_cohorts
      applies_to: "reference and stocks"
      requirement: "Unique first-acceptance events lock original Q; reconcile disjoint net dispatch/closing-FG/post-gate L destinations, full raw/WIP/FG exchange inheritance, equal-ended links and original-cohort later services. Keep provider-embedded history and inherited vectors non-overlapping. Preserve zero/unknown-denominator records and unknown burdens."
      evidence: "cp_reference; cp_links; cp_stocks"
    - id: dq_analysis
      applies_to: "material, waste and air"
      requirement: "Actual assay/method/state and matrix recovery; whole preparation versus contained species; as-N/COD analytical overlap; detection-limit and unidentified fractions."
      evidence: "eastman-mma-spec; epa-tkn-1993"
    - id: dq_completeness
      applies_to: "completed datasets"
      requirement: "Record measured, justified not_applicable and unresolved states separately. Add every extra actual exchange before claiming complete coverage; disclose missing provider links, maintenance/capital boundaries, transport, temporal/region mismatch and uncertainty."
      evidence: "cp_material; cp_utility; cp_waste; cp_air; cp_stocks"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_mma"
    rule: "One explicit final product-output link, 1 kg whole anhydrous commercial MMA, correct native Product identity, full qualifiers, actual route and positive unique accepted Q. Elementary methylamine, aqueous MMA, pure-N mass and duplicate first acceptance fail."
    source_ids:
      - eastman-mma-product
      - eastman-mma-spec
      - un-hs-methylamines
  - rule_id: validate_physical
    applies_to: "all stages"
    rule: "Match link ends, stock change, full stream and species/element accounting independently from allocation. Reacting amines may interconvert; unexplained composition or balance residual cannot be hidden by an allocation factor."
    source_ids:
      - epa-amination-1979
      - basf-methylamines
  - rule_id: validate_stocks
    applies_to: "raw/WIP/FG and later services"
    rule: "Verify each inherited exchange vector, event-locked original Q and mutually disjoint net D_new/F_new_close/L_new bridge, including actual same-period post-acceptance losses. Use original Q for later services. Opening FG, returns, gross rework and retests never enlarge Q. Q=0 or unknown remains unnormalized; lost provenance cannot become zero burden. Check provider-embedded historical LCI against inherited vectors to exclude duplicate actual demand."
    source_ids:
      - ef-allocation-2021
  - rule_id: validate_quantities
    applies_to: "all rows"
    rule: "Same full-product reference basis and ordered rules/protocols in both languages; retain provider pressure/state/quantity, no duplicate heat/steam or whole-preparation/component exchange, no nitrogen analytical substitution."
    source_ids:
      - eastman-mma-spec
      - epa-tkn-1993
  - rule_id: validate_coverage
    applies_to: "completed datasets"
    rule: "Complete actual stage, utility, transport, treatment, release and capital-boundary disclosure; correct every missing actual atomic exchange or label incomplete. Historical EPA diagrams and manufacturer catalyst claims do not establish site inventory, universal recipe, scientific approval or methodology acceptance."
    source_ids:
      - epa-amination-1979
      - basf-methylamines
      - ef-allocation-2021
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Independently accepted complete site/grade/cohort dataset for compatible anhydrous MMA intermediate supply"
  allowed_use: "Same actual product form and declared methanol-ammonia route, provider quantity and boundaries; retain uncertainty and cohort pins"
  excluded_use: "Whole CPC34150; MMA solutions/salts; DMA/TMA reference; heterocycles; assumed recipe/emission factor; extrapolation from one supplier to an industry"
  required_metadata: "Product CAS/SKU/full assay/state, first acceptance and original Q, site/period/route/catalyst, all stock vectors, providers/quantities, recycles/coproducts, physical balances, allocation and remaining services"
  required_quality_disclosure: "Actual coverage, measured/not_applicable/unresolved exchanges, analytical recovery, balances, stock inheritance, provider compatibility, source independence and uncertainty"
  update_trigger: "Product/form/route/catalyst change, supply or treatment change, acceptance or assay revision, new exchange, stock/service correction or contrary original evidence"
