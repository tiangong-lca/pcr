ady embedded in the chosen input provider, do not add an overlapping inherited vector again. Reconcile provenance, inventory coverage and state gate for each actual demand; use an explicit non-overlapping representation, never count the same supply or service twice and never erase unknown burdens to force closure. | ef-allocation-2021 |\n\n"
