allocation_rules:
  - rule_id: air_product_only
    applies_to: "compression-station"
    rule: "There is one reference air product and no assumed coproduct. Condensate, used oil and spent elements link to treatment under their actual waste identities, without water-product or recycling credits. Preserve rejected heat in the energy ledger; this non-exported-heat route does not invent a sold-heat product. If useful heat is actually exported, record its receiver, measured transfer and useful-temperature/service basis as a distinct product exchange and review the boundary extension; no automatic avoided-heat credit."
    source_ids:
      - eu-ene-bref
      - doe-compressed-air
      - atlas-zrzt
  - rule_id: physical_before_burden
    applies_to: "all inventory rows"
    rule: "Retain the complete physical wet/dry air, water, oil, filter and stock ledger before a separate allocated-burden ledger. For users with the same pressure/quality, share common station burdens by measured accepted outlet volumes on identical actual state/composition conventions; differing pressure/quality first requires separated measured operating regimes rather than mechanical volume allocation. Do not multiply physical outputs or internal links by burden-allocation shares."
    source_ids:
      - ilcd-general-guide
      - doe-compressed-air
dataset_production:
  collection_protocols:
    - protocol_id: cp_delivery
      process_id: "compression_station"
      flow_role: "authoritative first-acceptance event Q and disjoint postgate fate bridge"
      record_type: "site measurement"
      raw_fields: "fixed acceptance gate and external physical boundary; OEM circuit; event/cohort id and lineage; nonoverlapping measured first-accepted increments v_e; acceptance time/test; locked original Q and correction trail; net D_new; F_new_close; each net L_new fate with date/receiver; pre/post-acceptance rejection distinction; opening old FG; old dispatch; returns/gross recirculation/retests/rework; raw/WIP; counter resets; raw P_abs/gauge offset; T_K; RH/dew point; vapor/composition; Z/EOS/density; meter compensation; provider basis; receiver/linepack and liquid stocks"
      collection_method: "Use calibrated gas meters and concurrent acceptance/state records to identify each real first event and measure its new nonoverlapping quantity at the same reference state. Lock Q from events; postgate losses never reverse first acceptance. Independently reconcile disjoint net D_new/F_new_close/L_new from actual transfer/stock/outlet records within the same period; match returns and repeated passages by lineage instead of adding gross crossings. Quantify all in-scope postgate fates, or leave the bridge incomplete; use the two-term bridge only with evidenced zero other fates. For mixed receiver cohorts use traceable transfers or validated mixing/component balances with uncertainty. State/composition conversion and moisture phase changes need actual supported correspondence; no generic standard state, assumed density or duplicate correction."
      unit: "m3"
      frequency: "Each actual first acceptance, fate/transfer and opening/closing survey"
      temporal_coverage: "Common period including startup/standby/rejected operation; original acceptance dates retained"
      site_scope: "Actual product-accounting gate, external physical boundary, included receiver/linepack and actual outlets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Unique measured acceptance-event register, locked-Q history, disjoint net fate/stock bridge, actual state/quality/calibration/EOS records and uncertainty"
    - protocol_id: cp_energy
      process_id: "compression_station"
      flow_role: "complete station electricity Qt_energy"
      record_type: "site measurement"
      raw_fields: "country/grid; voltage and transformer boundary; meter start/end; timestamped actual active power; load/unload/start/stop/standby; fans/controls/drains; electrical reuse/export; Q"
      collection_method: "Calibrated active-energy submeter or time integral of measured active kW over each actual operating regime; include all actual auxiliaries and attributable transformer losses. Reconcile complete unallocated station energy, then implement station_ratio with cp_cohorts to form actual new-cohort Qb_i and separate old-stock service before normalization; no nameplate-power or default power-factor estimate and no duplicate voltage interface."
      unit: "kWh; MJ"
      frequency: "Each representative regime and service event"
      temporal_coverage: "Same period as Q"
      site_scope: "Actual station electricity interface"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, actual power/energy logs and supplier/attribution reconciliation"
    - protocol_id: cp_materials
      process_id: "compression_station"
      flow_role: "actual material consumption"
      record_type: "site measurement"
      raw_fields: "SKU; composition; net mass; receipts; opening/closing stock; service events; internal circulation; Q"
      collection_method: "Calibrated weighing and inventory reconciliation by each individual supplied lubricant, filter or makeup water; retain actual SDS/part specification and first-fill boundary. Use station_ratio with cp_cohorts for actual new-cohort consumption/provider demand, compatible inherited-not-embedded quantities and separate old-recipient service; raw receipts and stocks remain complete."
      unit: "kg"
      frequency: "Each representative regime and service event"
      temporal_coverage: "Common declared period covering shifts/loads"
      site_scope: "Actual station boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, raw records, stock/delivery reconciliation and uncertainty"
    - protocol_id: cp_assets
      process_id: "compression_station"
      flow_role: "actual period allocated provider numerator S_asset for compressor_asset and receiver_asset; full physical fleet ledger separately"
      record_type: "measured/recorded foreground service and asset records"
      raw_fields: "exact asset row/id/model/configuration; manufactured mass kg; actual counts; traceable weighing; provider unit/reference property/boundary; full asset opening/purchases/transfers/returns/closing/scrap; component/first-fill packaging and seals; period duty/duration and all served uses; lifetime/retirement evidence or explicit scenario; previous allocated fractions; current f_service_j by recipient cohort; u_provider_j; inherited-to-new service; S_current; S_asset; service recipient cohort; original denominator; Q"
      collection_method: "Use calibrated weighing or traceable same-configuration net-mass records and actual fleet counts. Reconcile opening + receipts/transfers in = closing + returns/transfers out + scrap with no invented physical consumption. Separately implement asset_service for the exact asset rows: derive each causal fraction from measured actual service and evidenced lifetime, sum compatible provider kg × current new-production fractions as S_current; add only the traced inherited raw/WIP service actually consumed to form S_asset. Keep old finished-stock service separate with its original Q. Link all recipient cohorts to cp_delivery and cp_cohorts. Retain initial manufacture and distinct maintenance providers, remaining life, reuse/retirement and sensitivity. An unresolved kg-based receiver provider is an explicit gap, not zero."
      unit: "kg provider-equivalent per period; kg/count/duty units in separate raw ledgers"
      frequency: "Each asset/service/retirement event and period closing"
      temporal_coverage: "Common period plus full lifetime/prior attribution evidence"
      site_scope: "Each actual compressor package and separate receiver, their compatible provider boundaries and served cohorts"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual asset/mass/duty records; full physical fleet equation; provider/component boundary; causal lifetime scenario; prior fraction ledger; S_asset arithmetic and independent dimensional review"
    - protocol_id: cp_air
      process_id: "compression_station"
      flow_role: "complete intake, vent and gas-stock mass"
      record_type: "site measurement"
      raw_fields: "outlet-specific flow/counter; P_abs; T; RH/vapor fraction; measured dry composition including oxygen/nitrogen; validated density/EOS/Z; blow-off/relief/drain leaks; external blowdown; internal recirculation; gas/liquid stocks; Q"
      collection_method: "Survey all actual outlets and measure gas flow under each load regime. For each volume increment use its own validated wet-gas density; retain measured mass fractions for oxygen, nitrogen, other dry components and water separately. Reconcile actual accepted gas, vapor, each drain condensate, emissions, reuse and stocks, including pre/post-acceptance and new/old cohorts. Use station_ratio with cp_cohorts for the model Qb_i only; raw physical totals are not reduced by burden shares. Internal recirculation has equal incoming/outgoing quantities and is not a second external exchange."
      unit: "kg"
      frequency: "Each regime and actual release event"
      temporal_coverage: "Same period as Q"
      site_scope: "Complete station intake, final separator, receiver and all actual gas outlets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Circuit/outlet map, calibrated measurements, composition, conversion and uncertainty"
    - protocol_id: cp_wastes
      process_id: "compression_station"
      flow_role: "each actual waste"
      record_type: "site measurement"
      raw_fields: "stream; wet mass; moisture; contamination/species; drained oil split; receiver; transport/treatment; stocks; Q"
      collection_method: "Weigh each segregated waste and retain representative analysis and transfer records. Identify actual sewer/off-site receiver; verify any actual direct environmental liquid outlet separately. Preserve complete physical Qt_i; use cp_cohorts and station_ratio to trace actual new-cohort Qb_i and separate old service without reducing actual waste output."
      unit: "kg"
      frequency: "Each representative regime and service event"
      temporal_coverage: "Common declared period covering shifts/loads"
      site_scope: "Actual station boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, raw records, stock/delivery reconciliation and uncertainty"
    - protocol_id: cp_emissions
      process_id: "compression_station"
      flow_role: "actual particulate and lubricant aerosol"
      record_type: "site measurement"
      raw_fields: "outlet; outdoor pathway; sample definition; blank; recovery; size cut; species/composition; flow; operating hours; uncertainty; Q"
      collection_method: "Survey actual vents/leaks and maintenance releases, then sample with a documented applicable measurement method. Report positive, nondetect and absent evidence distinctly; quantify nonoverlapping pollutant fractions and preserve oil-aerosol/PM overlap reconciliation. Preserve full measured source Qt_i; separately use station_ratio and cp_cohorts for evidenced new-cohort attribution Qb_i and old-cohort additions, never changing actual release records."
      unit: "kg"
      frequency: "Each representative regime and service event"
      temporal_coverage: "Common declared period covering shifts/loads"
      site_scope: "Actual station boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, raw records, stock/delivery reconciliation and uncertainty"
    - protocol_id: cp_heat
      process_id: "compression_station"
      flow_role: "Heat to air"
      record_type: "site measurement"
      raw_fields: "cooling airflow; inlet/outlet temperature and humidity; density/enthalpy; outlet; boundary; regime; uncertainty; Q"
      collection_method: "Measure calibrated cooling flow and inlet/outlet states at actual cooler/ventilation outlets and calculate net heat by applicable validated enthalpy relationships. Retain radiation, other transfers and balance residuals; avoid recounting internal coolant circulation. Keep full physical Qt_heat; separately implement station_ratio with cp_cohorts for actual new-cohort Qb_i and old service, never filling a missing measurement with an energy residual."
      unit: "MJ"
      frequency: "Each representative regime"
      temporal_coverage: "Common declared period"
      site_scope: "Actual station boundary and outdoor receiving air"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, actual circuit and energy ledger"
    - protocol_id: cp_cohorts
      process_id: "compression_station"
      flow_role: "raw/WIP/FG inheritance, per-exchange Qb_i and original-cohort service vectors"
      record_type: "site records"
      raw_fields: "cohort/event id; original gate/date/state/measured basis; original Q for accepted gas and raw numerator for unaccepted WIP; locked first-event quantities; disjoint D_new/F_new_close/L_new and each fate; full Qt_i by flow/source/date/receiver; current actual new/old/unfinished/other recipient quantities and causal drivers; N_i_to_new; compatible inherited I_i_to_new and provider-embedded flag; Qb_i; raw/material/gas opening/receipts/consumption/closing; returns/loops/retests; provider boundaries; service vectors and unknown origins"
      collection_method: "Reconcile chronological event/transfer/outlet and validated receiver mixing records without repeating a first acceptance. Implement station_ratio and cohort_carry for each actual row: trace current new-cohort consumption/outputs before allocating genuinely shared effects by evidenced per-exchange causality; retain the full unallocated physical Qt_i. Add only consumed prior foreground raw/WIP exchange vectors not already inside linked input providers, preserving original flow/unit/source/date. Background-embedded burdens remain decomposition only. Keep old accepted-stock manufacture and added current service separately with original Q. Unresolved recipient/stock/state/provider evidence leaves Qb_i unknown, not Qt_i automatically assigned to new production."
      unit: "raw kg/m3 and exact provider/service/emission units kept separately"
      frequency: "Each movement/first event/fate and attribution interval; period close"
      temporal_coverage: "Original cohorts plus common new period; original exchange dates retained"
      site_scope: "Complete declared station stocks, all served recipients, actual source boundaries and providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Unique-event and fate bridge; raw stock/whole-output closure; original denominators/vectors; per-exchange recipient/causal shares and provider-overlap audit; missing-history disclosure"
  calculation_rules:
    - id: station_ratio
      applies_to: "all inventory rows"
      rule: "qphysical_i = Qt_i / Q is unallocated physical analysis only, never the selected linked new-product quantity. For each ordinary row, Qb_i = N_i_to_new + I_i_to_new and a_i = Qb_i / Q once. N_i_to_new is the actually traced current new-cohort exchange/provider demand; remaining genuinely shared effects require evidenced per-exchange causal attribution across all served recipients. Exclude old-FG/unfinished/other-recipient portions and retain their own ledgers/bases. I_i_to_new contains only traceable prior foreground exchanges carried by consumed raw/WIP, with matching actual flow/provider unit/boundary and no overlap with any linked input provider; embedded upstream burdens are decomposition, never extra foreground demand/emissions. Preserve inherited source/date/medium; a carried historical emission is not a new current release. Keep incompatible sources/units/states in distinct subrecords. Actual gross physical outputs, stock/transfer quantities and reference gas are not multiplied by environmental burden shares. Q is locked actual first-event production, reconciled to disjoint D_new/F_new_close/L_new, not another external physical output; delivered_air is the 1 m3 product-accounting reference. For compressor_asset and receiver_asset use Qb_asset = S_asset from the complete named asset_service relation and asset_per_m3 = S_asset / Q once; neither is physical equipment consumption. Old-stock services keep original Q, and unknown Qb_i/Q remains unavailable rather than assuming full Qt_i."
      inputs:
        - Qt_i
        - N_i_to_new
        - I_i_to_new
        - Qb_i
        - S_asset
        - Q
        - cp_delivery
        - cp_assets
        - cp_cohorts
      output: "separate full physical ledger and actual new-cohort linked exchange/provider demand per reference flow"
      source_ids:
        - doe-compressed-air
        - ilcd-general-guide
    - id: gas_volume_conditions
      applies_to: "ambient_air, delivered_air, vented_air"
      rule: "For each raw increment, wet mass = raw volume × validated density(raw P_abs, T_K, vapor/composition, Z). Convert that same mass to reference volume = mass / density(P_ref_abs, T_ref_K, same composition, Z_ref); retain meter algorithm and any already applied compensation. For identical composition only, equivalent EOS notation is V_ref = V_raw × (P_raw_abs/P_ref_abs) × (T_ref_K/T_raw_K) × (Z_ref/Z_raw). Use actual absolute pressure, Kelvin temperature and validated compressibility; do not assume Z=1. Different water fractions or condensation require actual component/water balances and measured conditioning, not this same-composition shortcut. Separate incompatible state/composition regimes. Wet/dry, actual/free-air/standard and provider bases remain explicit. No generic density or source-example reference state."
      inputs:
        - cp_air
        - cp_delivery
        - "measured volume/mass"
        - "concurrent raw state/composition"
        - "declared reference state"
        - "validated meter/EOS"
      output: "complete physical gas masses and same-basis accepted Q with uncertainty"
      source_ids:
        - nist-gas-flow
        - doe-compressed-air
    - id: asset_service
      applies_to: "compressor_asset, receiver_asset"
      rule: "For one compatible mass-based asset current-service contribution: q_ref = q_item × f_service / Q; q_item is its actual collected identified-equipment net mass in kg, not a gas-product denominator; q_ref is allocated provider-equivalent kg per 1 m3 reference flow. General period form: S_current = sum_j(u_provider_j × f_service_j_to_new); S_asset = S_inherited_to_new + S_current; asset_per_m3 = S_asset / Q. S_inherited_to_new is traced previously incurred foreground asset demand carried by raw/WIP actually consumed in new production and not already included in a linked input provider. Service embedded in a material/WIP background provider is retained as a decomposition vector inside that provider, never booked again as these equipment rows; old finished-gas service is excluded. For a fresh single mass-based asset contribution with no inherited service, u_provider_j = q_item_j and the original formula is exactly retained. Sums retain each provider/asset family separately; incompatible provider units or boundaries cannot be pooled. cp_assets retains every asset id, actual measured mass/count, provider unit/boundary, measured causal period service, total lifetime service, remaining attribution, retirements and scenarios. f_service_j_to_new is the dimensionless current service share attributable to new production, separated from all old finished-stock and other-service shares. Each f_service_j is dimensionless and justified for that specific asset by actual duty/duration or demonstrably causal same-state output service, including rejected/idle duty when causal; no universal volume fraction. A volume fraction is allowed only when period/lifetime accepted volume genuinely determines that asset service, using the same actual first-acceptance-event gate/counting policy and with other uses and state/quality bases reconciled. Different assets may need different fractions. All life/cohort fractions sum at most one; keep prior service allocations and avoid resetting the full manufacturing burden on reuse. These two inventory rows require a compatible kg-based provider; a provider expressed in items needs an explicitly measured configuration-specific kg/item relationship and property/unit reconciliation before linking, otherwise retain a provider gap. Physical fleet movements and submaterial/first-fill ledgers remain separate; do not book both whole-package manufacture and its included components. Do not divide S_asset or q_ref twice. No default weight, lifetime, duty, fraction or reuse credit."
      inputs:
        - q_item
        - u_provider_j
        - f_service_j
        - f_service_j_to_new
        - S_inherited_to_new
        - S_current
        - S_asset
        - Q
        - cp_assets
        - cp_delivery
        - cp_cohorts
      output: "S_asset in provider-equivalent kg for each asset row and asset_per_m3 in kg per 1 m3; q_ref equivalence retained"
      source_ids:
        - ilcd-general-guide
    - id: actual_power_integral
      applies_to: "electricity_mv, electricity_lv"
      rule: "Qt_energy_MJ = 3.6 × integral of measured active power P_kW over time in hours, including all actual station loads at the selected interface. Prefer calibrated meter energy differences; reconcile the two methods and do not add both. Retain complete unallocated energy, actual stock/reuse/export and measured heat/gas transfers before any burden allocation."
      inputs:
        - cp_energy
        - "time-resolved actual power or calibrated energy counter"
      output: "complete station electricity MJ"
      source_ids:
        - doe-compressed-air
    - id: cohort_carry
      applies_to: "all inventory rows"
      rule: "For each physical stock, opening + actual receipts/transfers/production = closing + dispatch/consumption/transfers/rejects with actual gas-state/component/water changes. Carry inherited burden/service vectors with traced consumed quantities and original bases; do not add provider-embedded vectors twice. New Q = sum_e(v_e) of unique actual first events and remains locked after postgate loss/rework. Independently reconcile Q = D_new + F_new_close + L_new for disjoint same-basis net fates; the two-term bridge applies only when L_new is evidenced zero. Gross loops/returns/retests do not repeat events, and a returned parcel has one net fate. Old accepted gas adds no new Q and keeps its original denominator/service history. Current new-product Qb_i excludes old/unfinished/other recipients; unknown inherited/attribution/state vectors remain unknown. No forced quotient for zero/unknown Q and no duplicated external physical output for event Q."
      inputs:
        - cp_cohorts
        - cp_delivery
        - cp_assets
        - "actual acceptance/fate/stock/transfer/recipient records"
        - "original cohort denominators/vectors"
      output: "complete physical stock/fate bridge, locked event Q and separate actual new/old cohort exchange/service numerators"
      source_ids:
        - ilcd-general-guide
        - doe-compressed-air
  data_quality_requirements:
    - id: same_period
      applies_to: "all inventory rows"
      requirement: "Common period/configuration and locked actual first-event Q; retain postgate fates, actual new/old recipients, anomalies, gaps, start/stop and low loads"
      evidence: "cp_delivery; cp_energy; cp_materials"
    - id: physical_ledgers
      applies_to: "compression-station"
      requirement: "Reconcile dry air, water, oil and filter mass/stocks separately; Close the complete unallocated station control-volume energy ledger with measured electricity and all incoming/outgoing gas, liquid, heat, work and energy-stock changes; use validated actual-state enthalpies, including vapor/condensation and actual reuse. Disclose residuals/uncertainty rather than forcing an imbalance into an invented emission"
      evidence: "cp_air; cp_materials; cp_wastes; cp_energy"
    - id: provider_basis
      applies_to: "all product inputs"
      requirement: "Verify flow identity, reference property/unit, actual supplied state and provider quantity definition separately; a matching name is not provider compatibility"
      evidence: "Actual supplier/provider originals and metering definitions"
    - id: emission_completeness
      applies_to: "all elementary outputs"
      requirement: "Detection limit is not zero; positive emissions need actual species/medium; avoid total-PM/oil-aerosol duplication; absence requires documented survey scope, not invented survey results"
      evidence: "cp_emissions; cp_wastes"
    - id: asset_dimension_review
      applies_to: "compressor_asset, receiver_asset"
      requirement: "Independently verify the full named asset_service formula, exact asset/provider units, measured period numerator, positive Q, causal lifetime fraction and cohort history using reproducible dimensional and stock examples. A finite common-reference measurement pass establishes the explicit period basis only; it does not establish generic mathematical typing, physical validity or scientific approval of asset service attribution."
      evidence: "cp_assets; cp_delivery; cp_cohorts; actual provider originals; independent review"
    - id: cohort_numerator
      applies_to: "all inventory rows"
      requirement: "Every selected ordinary new-product amount is actual Qb_i/Q and each asset amount is S_asset/Q. Verify measured current recipients and consumed prior foreground not-embedded vectors before calculation; preserve full raw Qt_i and all physical outputs without burden-share scaling. Old accepted-stock service remains with original Q. Unsupported attribution or a missing postgate fate/state bridge prevents a complete dataset."
      evidence: "cp_cohorts; cp_delivery; all linked row protocols; original provider/source/stock records"
validation_rules:
  - rule_id: reference_unique
    applies_to: "delivered_air"
    rule: "Exactly one 1 m3 Volume product-accounting reference at the declared state. Reproduce positive locked Q from actual unique nonoverlapping first-acceptance events; subsequent leakage/relief/downgrade never erases an accepted event. Reconcile disjoint same-period same-basis net D_new/F_new_close/L_new; use D_new+F_new_close alone only if all other postgate net fates are proved absent. Reject gross loops, duplicate returned quantities, old-FG dispatch and retests as new acceptance. Q is not a second physical external output. Check all model-card Qb_i, old-cohort original bases, actual state/provider compatibility and complete unallocated raw outputs/stock/component/energy closure separately."
    source_ids:
      - eu-ene-bref
      - doe-compressed-air
      - atlas-zrzt
  - rule_id: route_and_balance
    applies_to: "compression-station"
    rule: "Check actual oil-free dry screws, air cooling, absence of separate drying, boundary components and OEM/modified circuit. Reconcile wet/dry gas, water, oil and energy ledgers separately and assess residuals within measurement uncertainty. Unverified coolant composition or quantity cannot be declared conforming."
    source_ids:
      - eu-ene-bref
      - doe-compressed-air
      - atlas-zrzt
  - rule_id: exact_id_and_fate
    applies_to: "all inventory rows"
    rule: "Verify each UUID with name, CAS where applicable, route, compartment, reference property and unit. An empty UUID remains a concrete atomic flow but has incomplete linkage; unresolved identity/supply/treatment compatibility cannot be reported as a complete dataset. Add atomic rows for actual additional exchanges first."
    source_ids:
      - eu-ene-bref
      - doe-compressed-air
      - atlas-zrzt
  - rule_id: no_proxy_emissions
    applies_to: "all elementary outputs"
    rule: "Do not replace pollutants with bulk carrier air, another industry wastewater or correction flows. Verify indoor-to-outdoor vent paths, aqueous-waste receivers and any direct water-body outlet. Use actual measurements/validated calculations for emissions, without default positives or fabricated zeroes."
    source_ids:
      - eu-ene-bref
      - doe-compressed-air
      - atlas-zrzt
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "First-acceptance production-gate compressed-air inventory at verified pressure/quality/volume basis; actual net dispatch and all in-scope postgate fates disclosed"
  allowed_use: "Complete linked compressed air for this route and declared first-acceptance quantity basis; downstream physically dispatched-air demand requires its own verified gate/quantity correspondence and provider compatibility, with postgate losses explicit"
  excluded_use: "Whole CPC34250, other chemicals, equipment manufacture, medical air, dried products, high-pressure bottles and completeness claims with missing medium/provider linkage"
  required_metadata: "All reference qualifiers, locked actual acceptance events, disjoint same-period net D/FG/L bridge, physical external boundary, cohort-specific Qb_i and unallocated Qt_i, original old-stock denominators, inherited-not-embedded demands, geography, OEM circuit, metering, upstream/waste providers and gaps"
  required_quality_disclosure: "Calibration, coverage, uncertainty, detection limits, residuals, lifetime scenarios and identity/provider debt"
  update_trigger: "Changes to equipment/coolant/drying/delivery pressure-quality, volume convention, load, supply or treatment provider"
data_sources:
  - id: "eu-ene-bref"
    type: "official_guidance"
    reference: "European Commission, Reference Document on Best Available Techniques for Energy Efficiency, February 2009, corrected 09/2021. §3.7, printed pp.206–214 / PDF pp.238–246; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2021-09/ENE_Adopted_02-2009corrected20210914.pdf; retrieved 2026-10-13T18:10:42.859Z"
    used_for: "Horizontal station architecture, pressure/purity/demand, components and emission survey; no statistical savings or universal recipe"
  - id: "doe-compressed-air"
    type: "official_guidance"
    reference: "U.S. Department of Energy, Improving Compressed Air System Performance: A Sourcebook for Industry, Third Edition, 2016, DOE/EE-1340. Printed pp.8,11,14–15,60–61,84 / PDF pp.13,16,19–20,65–66,89; https://www.govinfo.gov/content/pkg/GOVPUB-E-PURL-gpo176573/pdf/GOVPUB-E-PURL-gpo176573.pdf; retrieved 2026-10-13T18:10:38.197Z"
    used_for: "Oil-free isolated lubrication, accessories/condensate, simultaneous flow-pressure-energy metering and volume convention; no injected-lubricant data or example quantities"
  - id: "atlas-zrzt"
    type: "handbook"
    reference: "Atlas Copco, Oil-free rotary screw compressors ZR/ZT 110-160 (FF), undated brochure. Printed/PDF pp.7,16–18,22; https://www.atlascopco.com/content/dam/atlas-copco/compressor-technique/oil-free-air/documents/ZRZT-110-160-%28VSD%29-FF.pdf; retrieved 2026-10-13T18:10:38.311Z"
    used_for: "Producer oil-free air-cooled diagram, isolated oil loop, separation, optional drying and FAD limitations; model evidence, no default quantity; repeated water-flow text needs actual OEM circuit clarification"
  - id: "nist-gas-flow"
    type: "official_guidance"
    reference: "Wright et al., NIST SP 250-80, Gas Flowmeter Calibrations with the Working Gas Flow Standard, 2009. §§6,8–10, printed pp.8,13–15 / PDF pp.10,15–17; https://doi.org/10.6028/NIST.SP.250-80; retrieved 2026-10-13T18:14:57.112Z"
    used_for: "Calibration, actual local state/composition, mass↔volume density relationship and uncertainty; dry calibration gas/reference conditions are not nondried-product defaults"
  - id: "ilcd-general-guide"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for Life Cycle Assessment—Detailed guidance, first edition March 2010, DOI 10.2788/38479. §§7.2.1,7.9.3.2; printed pp.154–155,257–263 / PDF pp.174–175,277–283; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf; retrieved 2026-10-13T18:15:00.159Z"
    used_for: "Complete capital/maintenance boundaries and causally justified service allocation; no compressor-specific weight, lifetime or universal volume allocation"
