measurement_rules:
  - id: volume_basis
    applies_to: "reference product"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Q = sum_e(v_e) over unique actual first-acceptance events from cp_delivery; each v_e is a nonoverlapping measured newly accepted gas quantity converted to the one declared reference state. Preserve event IDs/lineage and locked Q after acceptance, including gas later leaked/relieved/withdrawn/downgraded/reworked. Reconcile Q = D_new + F_new_close + L_new using disjoint actual net postgate fates within the same period and scope: net external dispatch, closing accepted stock and all other net fates. D_new + F_new_close alone is valid only after proving L_new = 0. Returns/gross loops/retests and repeated acceptance of the same gas do not add events; unaccepted raw/WIP and opening accepted gas add no new Q. Actual measurement/identity corrections need a traceable event-history correction, never cancellation because of a later loss. Incompatible fate bases leave an unresolved bridge, not a replacement Q. Q must be positive for normalization; zero/unknown Q retains raw records and unknown normalized values. No default state/density/Z or double meter compensation."
  - id: mass_closure
    applies_to: "ambient_air, delivered_air, vented_air, condensate, cooling_water, cooling_waste"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use cp_air, cp_delivery and cp_wastes to transform each measured gas-volume increment to wet mass using density validated for its own P_abs, T, RH, composition and Z. Delivered_air remains a Volume reference; its mass is an analytical ledger, not a second exchange. Reconcile oxygen, nitrogen, other dry components and vapor/liquid water using measured composition and the same wet/dry mass basis. Condensate is inlet moisture separated at each actual drain. Constituent analyses partition bulk air; do not add them again as independent air inputs/outputs. Retain gas and liquid stock changes and uncertainty."
  - id: electric_energy
    applies_to: "electricity_mv, electricity_lv"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the original Net calorific value property; convert metered kWh using the unit-group factor 1 kWh = 3.6 MJ, without interpreting this as delivered heat. Include fans, controls and actual auxiliaries; do not replace measured energy with nameplate kW times undifferentiated hours."
