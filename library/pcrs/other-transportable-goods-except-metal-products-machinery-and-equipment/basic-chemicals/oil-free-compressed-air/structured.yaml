product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.basic-chemicals.oil-free-compressed-air"
  classification_refs: "CPC 3.0 34250; narrower product and route boundary"
  covered_products: "Nondried industrial compressed air at the station outlet from the stated route"
  excluded_products: "Other chemicals, mercury species, amalgams, pure gases and the excluded routes above"
  representative_product: "Aftercooled/separated compressed air in the measured delivered state"
  production_route: "Intake filtration → dry oil-free screw compression/intercooling → aftercooling/separation → station receiver when present → delivery; isolated lubrication and maintenance accompany operation"
  market_state: "Gaseous mixture at the station interface; declared pressure, temperature, moisture and quality"
functional_unit:
  what: "Account for newly first-accepted industrial compressed air meeting declared station-supply pressure/quality at the product-accounting acceptance gate, with actual in-scope postgate fates and service disclosed"
  how_much: "1 m3 newly first-accepted compressed-air wet mixture at one declared actual station-supply reference state P_ref_abs/T_ref_K/vapor-composition/Z_ref. Q is the sum of unique measured actual first-acceptance event volumes; subsequent leaks or other fates do not cancel acceptance. This production-accounting reference is not an additional external physical output or an assertion that all accepted gas is dispatched"
  how_well: "The same declared outlet gate, dry oil-free screw route, pressure, temperature, humidity/pressure dew point, particle and oil acceptance; nonbreathing and not separately dried. Different composition/quality regimes require separate datasets unless a measured fully reconciled conversion establishes equivalence"
  how_long_or_cycle: "One representative common production period including loaded/unloaded operation, start/stop, standby, rejected operation and maintenance; previously accepted stock keeps its original cohort and denominator"
  reference_flow_link: "delivered_air"
system_boundary:
  rules:
    - rule_id: station_complete
      applies_to: "compression-station"
      rule: "Aggregate intake filtration, compression, intercooling, aftercooling, separation, actual receiver, drains, controls, isolated lubrication and maintenance into one foreground unit while retaining stage meters. Internal gas transfers have equal physical quantities at both ends and are not a second product output with the reference UUID."
      source_ids:
        - eu-ene-bref
        - doe-compressed-air
        - atlas-zrzt
    - rule_id: boundary_fates
      applies_to: "all waste outputs"
      rule: "Distinguish waste sent for treatment from direct air/water-body release by actual receiver. Cover actual station air outlets; oil-free labelling cannot omit known releases. Actual direct liquid release or additional emitted species requires added verified atomic rows for its exact species/compartment before inventory completeness is claimed."
      source_ids:
        - eu-ene-bref
        - doe-compressed-air
        - atlas-zrzt
    - rule_id: route_configuration
      applies_to: "compression-station"
      rule: "Verify model OEM circuit and actual modifications; do not treat a dryer-equipped or water-injected configuration as this scope. If external cooling water, glycol coolant or another formulation is actually used, add its individual supply/waste rows and review applicability instead of assuming zero use."
      source_ids:
        - eu-ene-bref
        - doe-compressed-air
        - atlas-zrzt
    - rule_id: asset_material_completeness
      applies_to: "compression-station"
      rule: "Equipment manufacture is outside the foreground transformation but its attributable service burden is retained through providers. Inventory actual packing, seals, lubricant, first fill, replacements and removed assets independently by their concrete physical identities, including returns/reuse/stocks; provider-included components must be reconciled without duplicate mass or burdens."
      source_ids:
        - ilcd-general-guide
        - doe-compressed-air
