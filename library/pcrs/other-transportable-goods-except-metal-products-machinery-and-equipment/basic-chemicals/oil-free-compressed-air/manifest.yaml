  identity_conditions:
    - "Compressed-air Volume identity does not define free-air/standard/actual volume conditions. Actual delivered gas and each provider must agree on pressure, temperature, dry/wet convention, compressibility and quality before background linking."
    - "Broad compressor equipment identity is restricted to the actual oil-free air-cooled dry screw package; neither mass nor lifetime nor compatible equipment provider is established by its UUID."
    - "Air resources and used-air emissions are different elementary compartments; no correction flows or proxy pollutant species are adopted."
    - "Particulate UUID supports size-unspecified air emissions; no source-specific clinker factor or overlapping particle-size totals adopted."
    - "Rejected compression heat to outdoor air has unresolved flow/property identity. Water long-term heat candidate is medium-incompatible. Direct air-unspecified candidate 08a91e70-3ddc-11dd-9136-0050c2490048 carries Radioactivity text on a Net calorific value reference UUID; all returned heat candidates have this conflict. Source clarification is required, so no heat UUID is adopted."
    - "Electricity UUIDs are CN grid-average consumption mix to user at the exact medium/low voltage interface; other countries or supply mixes require a different verified atomic flow."
  source_limitations:
    - "ENE is horizontal energy guidance, not a common recipe for the chemically heterogeneous CPC category."
    - "Atlas air-cooled schematic and adjacent text include optional dryer and a repeated water-flow paragraph. Confirm actual non-FF model OEM circuit and coolant composition; do not infer zero liquid use or universal water demand."
    - "DOE and producer examples are not universal energy, loss, lubricant, purity or emission defaults."
    - "NIST SP250-80 supports actual-state mass/volume metrology, not a wet-product recipe, universal density, humidity model or source calibration conditions. Actual meter/EOS validation is a data-package obligation."
    - "ILCD supports complete capital/maintenance inventory and causally justified service allocation. Volume/lifetime service fraction is conditional on demonstrated causality, not a universally accepted compressor amortization factor."
  background_compatibility_pending:
    - "Actual site metering/pressure/quality and provider volume basis are future data-package requirements, not yet verified datasets."
    - "Unresolved atomic maintenance and wastewater identities require exact provider matching before a complete dataset can be claimed."
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  reference_basis: "1 m3 newly first-accepted wet compressed-air mixture at one actual supply P_ref_abs/T_ref_K/vapor-composition/Z_ref. Q=sum of unique nonoverlapping measured actual first-acceptance event volumes, locked despite postgate losses. Reconcile disjoint same-period same-basis net D_new+F_new_close+L_new; D+FG alone only with evidenced no other postgate net fate. Q is not another physical external output. Old stocks/services retain original Q. No default state/density."
  method_approval_pending:
    - "Actual OEM non-FF circuit and final separator/drain topology must be established in each data package; brochure diagram/text conflict is retained."
    - "Accepted-state meter/EOS, mass and constituent closure, heat/emissions methods and provider conventions require actual validation and source evidence before a dataset can claim completeness."
    - "Actual asset/maintenance service allocation needs physical causality and lifetime/retirement evidence; scientific acceptance remains pending."
    - "Asset service and gas/stock/cohort equations require independent semantic and worked-case review; finite measurement coverage does not approve the full formulas."
  asset_service_contract:
    representation: "Period provider-demand numerator S_asset / Q. Full named asset_service formula, exact asset rows and cp_assets/cp_delivery/cp_cohorts links are preserved in both canonical languages and projection. S_asset is kg-based provider-equivalent service exposure, not physical machine consumption."
    finite_check_limit: "Finite checker establishes explicit common reference/period basis only; it does not generically type-check the full asset-service formula. Independent dimensional, stock/cohort and causal-lifetime review remains required."
    equivalence: "For a fresh single mass-based asset contribution without inherited service, S_current=q_item*f_service; S_current/Q=q_item*f_service/Q. Period S_asset adds only traced prior foreground service from consumed raw/WIP not already included in linked input providers. Old FG service keeps original Q; embedded input-provider service is a decomposition, not an extra equipment demand."
  cohort_exchange_contract:
    selected_amount: "Each ordinary linked new-product card uses actual Qb_i/Q; assets retain S_asset/Q under the complete named asset_service formula."
    unallocated_physical: "Full Qt_i remains the actual all-recipient control-volume physical/energy/source-output ledger; Qt_i/Q is analysis only, not automatic new-product demand. Real physical outputs are never reduced by environmental burden shares."
    inheritance: "Qb_i=N_i_to_new+I_i_to_new with actual current new-cohort attribution and only consumed prior foreground vectors not already inside linked providers; incompatible flow/unit/source/state subrecords stay separate. Historical carried emissions are not new current releases. Old-stock current service stays separately on original Q."
    acceptance_bridge: "Unique actual first-event Q is authoritative; disjoint D/FG/L is a fate reconciliation, including all in-scope postgate losses/withdrawals/downgrades/rework. Returns/loops/retests add no repeated event or gross fate."
