  - rule_id: v_wholewaste
    applies_to: "actual outlets"
    rule: "One actual whole contaminated sack, liner, filter sleeve, ash export, rejected fertilizer, liquid mixture or retired asset has one complete physical receiver event Qt including substrate/article, retained fertilizer/coal dust or liquor and water once. Nested assays/origins are nonadditive components, not extra exported waste unless physically separated before the boundary. Preserve actual treatment/provider Qt and extensive unit independently of cohort attribution. Its gross Qt/Q disclosure is not automatic treatment demand: submit only evidenced compatible nonoverlapping service A with original Q0/Qc to the one quotient. Unknown assignment stays unresolved. Never shrink Qt by an environmental share or charge all Qt again to every cohort."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_measurement
    applies_to: "actual species and phases"
    rule: "Environmental methods apply only within actual species, phase and matrix scope. EPA320 supplies an extractive FTIR programme for identified IR-active vapors, reference spectra/interferences, heated transport and explicit analyte-spike matrix/recovery validation. EPA3C supplies its stated CO2/CH4/N2/O2 GC-TCD programme and source limits, not universal fertilizer-stack applicability or Ar measurement. Agilent5994-4552EN demonstrates Ar/O2 separation in a nitrogen-balance standard; single-concentration repeatability and column backflush protection do not prove multipoint response, full sample recovery or a hot/wet fertilizer outlet matrix. Homonuclear N2/O2 and monatomic Ar are not measured by ordinary IR-active FTIR. EPA5 defines filterable PM sampling/recovery/gravimetry, not every condensable or wet mist. Actual collected whole condensate/mist goes to its real receiver; actual final released species/medium require applicable procedures. A genuine unestablished essential procedure remains hold; ordinary site calibration/lot QA within an established applicable procedure is separate uncompleted study qualification, never claimed passed here."
    source_ids:
