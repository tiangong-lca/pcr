system_boundary:
  rules:
    - rule_id: b_scope
      applies_to: "whole configured product"
      rule: "This method covers one configured whole granulated organo-mineral NPK fertilizer preparation containing actual animal/vegetable-derived material together with actual mineral/chemical fertilizer inputs, manufactured through feeding, actual crushing, drum granulation, coal-furnace hot-air drying, cooling, screening/recycle and required packing to first finished-grade acceptance at an Indian plant. The reference is the actual whole supplied granules including retained organic matrix, mineral constituents and water, not pure nutrients, component fertilizer or dry active equivalent. Define one actual grade and composition/cohort; no universal NPK ratio, dose, yield, moisture or package weight follows from this method."
      source_ids:
        - gaar-organo-mineral-2020
    - rule_id: b_thermal
      applies_to: "furnace and dryer"
      rule: "The described coal furnace is an actual on-site producer of drying hot air. Preserve coal grade and full wet composition, ash, carbon/hydrogen/sulfur/nitrogen/oxygen, real atmospheric intake, water, reactive formation/consumption, combustion gases, ash/soot, actual controls and complete energy/loss interfaces. A purchased-heat label cannot hide it. The source does not establish direct flue-gas contact versus a heat exchanger: declare the actual coupling, hot-air composition and separate exhaust if present. A gas entering the dryer internally is not also an external furnace emission; a separate actual furnace stack is not omitted. Pair measured hot-air transfers and cancel once on consolidation, retaining the furnace fuel/utility/control burdens. AP42 supplies qualitative coal/phase countercontext, not a fuel rank, boiler configuration, emission factor or default efficiency for this plant."
      source_ids:
        - gaar-organo-mineral-2020
        - epa-ap42-coal-1998
    - rule_id: b_provider
      applies_to: "all supplied preparations"
      rule: "The supplied whole urea, DAP, MOP and every other declared feed/preparation require complete real upstream manufacture and actual material/provider units. Commercial amino-acid, fulvic/humate and poultry-derived preparations remain whole specific supplied preparations only with actual identified supply/composition/inclusion boundaries; they are not uncharacterized ingredient baskets. The source word Poultry does not prescribe raw flesh, manure processing, dryness or a guessed chemical recipe; organic-feedstock ash does not prescribe plant origin or a biogenic carbon fraction. Known on-site preparation/composting must retain its complete real inputs, utilities, gas/liquid/solid losses and handovers; do not invent a purchase or paper-outsource it. Ordinary provider/quantity qualification is separate from a genuine essential-method gap."
      source_ids:
        - gaar-organo-mineral-2020
    - rule_id: b_stock
      applies_to: "all actual stocks"
      rule: "Keep complete wet raw material, WIP, non-WIP, accepted FG, held/returned goods, internal recycle, packaging, installed fluids and every actual asset fleet as a physical ledger independent of the reference-event account and attributed burden vectors. Own opening WIP inherits its full actual prior foreground burdens once; substantiated unassigned closing WIP carries forward. Provider aggregates and the same embedded material/transport/asset history decomposition are mutually exclusive. Failed production, idle/start-stop, cleanout, samples and attempted repair remain incurred; actual service performed for stored FG is not erased."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_pack_wet
      applies_to: "each actual whole wet packaging pool"
      rule: "Each actual woven-polypropylene sack and separately supplied polyethylene liner has complete wet opening/closing empty, WIP-attached, FG-attached and reusable stock plus P, supplier-included I, external return received ERin, gross shipment S, external return outward EOout and true waste W. The source proves packing, not this packaging material or mass: these specific conditional pools require actual configuration evidence. Whole supplied sack/liner inclusions count once; do not buy its contained film/threads/additives again. An included liner has one real upstream owner and no second purchase. X_in/X_out remove only independently proved duplicates with OTHER same-side incoming/outgoing terms, never closing stock, opposite directions or card existence. Physical gross V disclosures create no procurement/provider/credit; only the one separately attributed provider-service amount A does so. For each one actual whole wet pool in kg, independently verify O + P + I + ERin + J_in + H2O_in - X_in = C + S + EOout + W + J_out + H2O_out - X_out. J_in/J_out are actual disjoint additional non-water material transfers, including real adhered/removed fertilizer or repair material only to the extent not already in another gross leg. H2O_in/H2O_out are actual disjoint sorption, added water, evaporation or other water transfers not already included in a whole wet leg. O/C and every whole wet leg retain all included contents; retained new material/water in C never cancels its real influx. X only subtracts independently proved overlap between OTHER same-side flow terms, never real J/H2O additions, C or opposite directions. Unknown terms stay unresolved, not fitted from one closure residual. Trace every real J/H2O source/destination with specific physical records/atomic interfaces and paired internal handovers; a raw ledger term is not a generic provider, extra waste exchange or extra Q. Adhered fertilizer remains part of the same whole contaminated receiver Qt if not physically separated."
      source_ids:
        - ilcd-allocation-2010
        - gaar-organo-mineral-2020
