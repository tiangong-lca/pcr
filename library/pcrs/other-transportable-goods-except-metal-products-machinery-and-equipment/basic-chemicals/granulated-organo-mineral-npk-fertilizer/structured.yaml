          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_reference | whole product and independent acceptance | Q0 is the independently weighed net fertilizer mass of unique first finished-grade acceptance events after every required same-configuration operation and required packing, ready for supply at the plant before dispatch. Exclude package tare while retaining true fertilizer water and all constituents once. Fix original configuration/composition/moisture basis and event IDs before reconciliation. Later delivery, return, repacking, retesting, rework or recovery creates no second acceptance. Q=0 means zero output and retains all raw loads without a normalized result. The source does not supply actual acceptance events, numerical quality limits or a package mass; these are explicit methodology/foreground records, not invented observations. | gaar-organo-mineral-2020 |\n| v_classification | all applicability | CPC3.0:34649 applies here only to the actual configured animal/vegetable-fertilizer plus mineral/chemical-fertilizer NPK mixture described in the revised GAAR case, not for every product called organic NPK. GAAR §§24–24.3 considers the named HS310520 NPK branch, reproduces HSEN31.05(B) composite/complex fertilizers and (C)(3) animal/vegetable fertilizers mixed with chemical/mineral fertilizers, then assigns this actual mixture to31059090. The official historical CPC2.1–HS2017 table links310520 wholly to34641 and310590 wholly to34649. This is evidence about a specific physical mixture and interpretative branch, not a deduction from an organic label, a numerical recipe or a current UN commodity ruling. The current UNSD-linked CPC3 introduction, PDF26–30 §§49–51 and55–60, requires goods in sections0–4 to be classified by the corresponding HS category terms and interpretative rules, and applies the HS explanatory notes. Where an HS subheading links to several CPC subclasses, §51 requires selection using their explanatory notes and then the stated interpretation rules. §§72–74 retain exceptions and partial links; §72 says the detailed CPC3–HS2022 correspondence will be developed separately. §93 states continuity of category-delineation criteria and application rules, not identity of every old/new edge. The20November2023 proposal PDF77 and2024 draft PDF60 mark34644 NP as a name change and34647 NK as a breakdown, while34641 and34649 have no change marker there. These historical structures support a bounded continuity inference alongside the current rules; they are not the final correspondence table. Current introduction PDF42 §105 literally prints36464 and describes an NP-to-NP/NK split inconsistently with the structure. Preserve this contradiction and do not repair its text into a precise old/new crosswalk or use it as such. Combining those current interpretation rules with the actual GAAR mixture/HSEN(C)(3) reasoning, the historical310590→34649 link and the limited structural continuity supports the primary controller’s narrower34649 association for this particular configured mixture. This is a transparent technical classification synthesis, not a claim that a current CPC3–HS2022 table or UN product-specific ruling was obtained. Current34641 has an unqualified NPK title;34644 NP,34645 PK and34647 NK remain competing named categories. The current separate NK branch prevents wholesale transfer of historical310590 coverage. CBP NYN328393 (14October2022) actually classifies a different organic citric-acid/sugar mycelium byproduct containing P/K under310560 rather than310590; it disproves organic-label-only residual assignment and is not evidence that all organic matrices follow the GAAR branch. At least two genuine N/P/K nutrients are mandatory; one plus Ca/Mg/S is insufficient. Any changed physical mixture or named-branch applicability needs renewed review. A same-factory/SKU source or new legal ruling is not an absolute evidence requirement. The prior classification holds and author repair lineage remain dated history. The primary controller accepted this narrower scoped document and classification association on the stated evidence; it does not establish scientific expert approval, actual study qualification or publication. Exact delivery validation and serial integration evidence are recorded separately. | gaar-organo-mineral-2020; cbp-n328393-2022; cpc3-scope-2025; cpc21-hs2017-historical; cpc3-current-introduction; cpc3-structure-proposal-2023; cpc3-structure-draft-2024 |\n| v_wholewaste | actual outlets | One actual whole contaminated sack, liner, filter sleeve, ash export, rejected fertilizer, liquid mixture or retired asset has one complete physical receiver event Qt including substrate/article, retained fertilizer/coal dust or liquor and water once. Nested assays/origins are nonadditive components, not extra exported waste unless physically separated before the boundary. Preserve actual treatment/provider Qt and extensive unit independently of cohort attribution. Its gross Qt/Q disclosure is not automatic treatment demand: submit only evidenced compatible nonoverlapping service A with original Q0/Qc to the one quotient. Unknown assignment stays unresolved. Never shrink Qt by an environmental share or charge all Qt again to every cohort. | ilcd-allocation-2010 |\n| v_measurement | actual species and phases | Environmental methods apply only within actual species, phase and matrix scope. EPA320 supplies an extractive FTIR programme for identified IR-active vapors, reference spectra/interferences, heated transport and explicit analyte-spike matrix/recovery validation. EPA3C supplies its stated CO2/CH4/N2/O2 GC-TCD programme and source limits, not universal fertilizer-stack applicability or Ar measurement. Agilent5994-4552EN demonstrates Ar/O2 separation in a nitrogen-balance standard; single-concentration repeatability and column backflush protection do not prove multipoint response, full sample recovery or a hot/wet fertilizer outlet matrix. Homonuclear N2/O2 and monatomic Ar are not measured by ordinary IR-active FTIR. EPA5 defines filterable PM sampling/recovery/gravimetry, not every condensable or wet mist. Actual collected whole condensate/mist goes to its real receiver; actual final released species/medium require applicable procedures. A genuine unestablished essential procedure remains hold; ordinary site calibration/lot QA within an established applicable procedure is separate uncompleted study qualification, never claimed passed here. | epa-method320; epa-method3c; agilent-argon-2022; epa-method5 |\n| v_assay | actual whole-grade nutrient indicators | Track supplied moisture, actual added granulation/cleaning water, ambient humidity, retained fertilizer water, evaporation, condensate, wet wastes, internal recirculation and actual chemical/biological water generation or consumption independently. Never infer reacting-species conservation, complete fuel conversion or zero gaseous release from elemental closure. N, P2O5 and K2O assays retain their actual conventions: oxide equivalents are not physical oxide additions, pure elemental P/K flows or the reference whole-product mass. GAAR supplies no complete quantitative assay programme. The subsequently acquired full FAO Bulletin19 (2008) supplies an independent mineral/organic fertilizer programme and explicit high-OM fertilizer-mixture preparation, with actual cross-references and the dimensional safeguards below. S.O.4477(E),2022,PartD14–15 remains real limited bone-meal/Rhodophytes evidence: its water-insoluble residue N is not whole-grade total N, citric-acid-soluble P is not every available-P indicator, and water-soluble K is not total K. Its missing ScheduleII endpoints limit that source; they are not a requirement to use FCO exclusively or proof that the independent FAO programme does not exist. The earlier no-FAO hold snapshot remains immutable history. This repair does not assert statutory compliance, actual batch success, scientific acceptance or classification admission. Genuinely unestablished necessary species/phase procedures remain specific holds; unperformed site QA of an established applicable programme is a distinct study obligation. | gaar-organo-mineral-2020; fco-amendment-2022 |\n| v_assay_prep | actual whole-grade analytical programme | For one actual whole supplied organo-mineral grade, follow FAO2008 Chapter6 sampling and preparation together with Chapter2 QA. Record representative lot selection, sealed hygroscopic sample identity, homogenization and the actual analytical portions; the guide explicitly provides no fixed universal sample count. Keep the unground physical-size portion separate. Fertilizer samples are not washed as plant tissue. Use independent traceable N and P/K aliquots from the same represented whole lot: do not measure N on a nitrate-containing P/K acid digest or use the phosphorus-preparation reagent nitrogen as product nitrogen. Select each source preparation according to the actual organic/mineral composition and nutrient form; no supplier purchase, composition, process ratio or analytical success is invented. Record original whole wet sample mass and the measured water-definition/basis before reporting any dry-basis concentration. The reference Q0 remains actual net whole supplied wet mass, never dry mass, pure nutrient or a sum of analytical indicators. Retain actual performed sampling/testing burdens and sample losses through complete real own-laboratory atomic interfaces or a genuinely matched complete external analytical provider, with actual units, chemicals, utilities and whole wastes included once. The sources do not establish that this factory bought a test or operated a specific laboratory; no purchased-service stub hides known on-site work. An actual missing chemical/waste interface is added specifically before inventory completeness. Laboratory concentration and aliquot calculations do not perform another LCA division by Q or create physical nutrient-component exchanges; the sole inventory A/Q rule remains unchanged. | fao-fertilizer-analysis-2008 |\n| v_assay_n | actual whole-grade analytical programme | For total N, Chapter6 explicitly links fertilizer NH4, nitrate, urea and organic N to the complete Chapter3 Kjeldahl digestion/distillation/standardized acid-receiver/back-titration programme. Include the specified nitrate-reduction modification when nitrate is present; unreduced Kjeldahl N is not relabelled total N. Preserve the source controls for complete digestion, acid loss, frothing, ammonia transfer and receiver capacity. Where a form is actually reported, use its distinct Chapter6 distillation/reduction or urease preparation, with the phosphate/calcium separation and actual form-selective recovery; total N is not inferred from a water-insoluble residue, and a difference is not an unvalidated universal organic-N assay. Correct the source arithmetic transparently by Chapter2 equivalents and the actual sample-minus-blank account: q_N_mEq=(Va_s*nA_s-Vb_s*nB_s)-(Va_b*nA_b-Vb_b*nB_b), with V in ml and independently standardized n in eq/L; N_mass_g=0.01401*q_N_mEq*D_N; N_percent=100*N_mass_g/W_g. D_N is only the inverse actual original-sample fraction in the measured aliquot and is1 for an undivided digest; it is not100 because the sample weighs1g. For complete acid neutralization, HCl normality equals molarity and H2SO4 normality is twice molarity; use actual standardized equivalents. Retain the original printed df100/M-versus-N and NH4 (A-C)-B blank defects and the conflicting HCl dilution, rather than silently copying them. Negative/failed blank-corrected results remain flagged, not truncated to zero or turned into a product-content default. | fao-fertilizer-analysis-2008 |\n| v_assay_p | actual whole-grade analytical programme | For total P, the specific Chapter6 branch for materials and fertilizer mixtures with high organic matter destroys the organic matrix using magnesium nitrate/ashing before acid dissolution; low-OM and iron/aluminium-phosphate/basic-slag branches are distinct. Preserve this specific branch alongside the book's broader organic-wet-digestion statement, disclose the actual selection and residual/recovery evidence, and never imply a universally interchangeable digestion. The complete quinolinium-phosphomolybdate precipitation, filter/constant-mass, reagent blank and standard-recovery programme follows. Use total_P2O5_percent=100*(S_g-B_g)*f_P*D_P/W_g, where f_P is the verified stoichiometric P2O5-equivalent mass fraction of that stated precipitate and D_P is the inverse original-sample fraction in the actual precipitated aliquot. Adding water to that same wholly precipitated aliquot creates no extra dilution factor. Independently determine water-soluble P by its specified water extraction; for the book's defined available-P indicator, follow water washing, neutral-ammonium-citrate treatment of the residue, actual insoluble-residue digestion and the same endpoint, then available_P2O5=total_P2O5-citrate_insoluble_P2O5 on the same original sample basis. Water-soluble P is already included in that available result and is not added again. Citric-acid-soluble, neutral-citrate-soluble, water-soluble and total indicators remain distinct. Assay P2O5 is an equivalent, not physical oxide mass or evidence of crop response. | fao-fertilizer-analysis-2008 |\n| v_assay_k | actual whole-grade analytical programme | For the declared total-K analytical boundary, Chapter6 requires acid digestion for organic fertilizer and cross-references Chapter4; use its complete appropriate digestion and acid-digest K/AAS programme, not water dissolution alone for the organic/mineral whole grade. Preserve actual dissolution/residue, acid/mineral matrix, analyte recovery, blanks, standards and measured working response. Do not assume carbonate/high ash is fully dissolved from its label, nor call a residue K-free without evidence. The guide's inconsistent AAS stated linear range and standard points are retained as a source limitation, not transferred instrument settings or a universal response range. For an actual measured final solution, K_mass_g=(C_sample-C_blank)_ug_per_ml*V_final_ml*D_prior/1000000 and K_percent=100*K_mass_g/W_g; D_prior is only the inverse original-sample fraction transferred into that final solution and excludes V_final already used. An instrument result already corrected to the original sample is not diluted again. Convert elemental K and K2O equivalent only once using the declared stoichiometric convention, without adding a physical K2O flow. The distinct Chapter6 STPB alternative masks ammonium and addresses chloride/sulphate, but its printed f is tied to its specific sample/solution/aliquot construction; it is not silently reused for a different organic sample or substituted for this declared acid-digest programme. A genuinely unaddressed necessary matrix procedure remains hold; routine actual-lot digestion/recovery checks within this complete applicable programme are study qualification. The printed solution mg/kg versus ug/ml equivalence is not transferred without an actual density/unit bridge; retain measured solution concentration and its actual extensive volume. | fao-fertilizer-analysis-2008 |\n| v_assay_qa | actual whole-grade analytical programme | Moisture and wet/dry conversion retain an actual method-defined water measurand, not any loss on heating. Chapter6 warns that oven loss for DAP can include other volatiles and that low-temperature urea drying need not recover all moisture; it provides distinct desiccator and Karl Fischer programmes. For the chosen urea-containing grade, use an actually applicable standardized KF programme with the represented sample, blank/drift, water recovery and uncertainty. Compute water_percent=100*F_mg_per_ml*(V_sample-V_blank)_ml/(1000*W_g), with F derived from the actual certified/known water mass and response; do not copy the source's printed 000 mg/g denominator or 0.1566-percent statement. Keep KF-recoverable/free/crystal-bound water definitions distinct; an unestablished necessary bound-water/other-phase procedure is a specific remaining hold, not an assumed equality. For an actually justified water fraction w on the same sample basis, dry_mass=wet_mass*(1-w) and dry_basis_nutrient_fraction=wet_basis_nutrient_fraction/(1-w); original whole wet Q0 never changes. Chapter2 requires homogeneous/stable controls, independently standardized reagents, full-process blanks, independent standards, repeat/blind checks, actual validation and recorded deviations. Those actual study results have not been performed here. Method existence is evidenced by the full source and explicit dimensional synthesis; valid site/lot application, all necessary actual phases and independent scientific review remain separate, and a failed or genuinely unknown essential procedure is never waived by finite checkpass. | fao-fertilizer-analysis-2008 |\n\n### Complete applicability and accounting context\n\nThis method covers one configured whole granulated organo-mineral NPK fertilizer preparation containing actual animal/vegetable-derived material together with actual mineral/chemical fertilizer inputs, manufactured through feeding, actual crushing, drum granulation, coal-furnace hot-air drying, cooling, screening/recycle and required packing to first finished-grade acceptance at an Indian plant. The reference is the actual whole supplied granules including retained organic matrix, mineral constituents and water, not pure nutrients, component fertilizer or dry active equivalent. Define one actual grade and composition/cohort; no universal NPK ratio, dose, yield, moisture or package weight follows from this method.\n\nGAAR GUJ/GAAR/R/71/2020 (17 September2020) describes distinct original and revised applications and four distinct product families. This profile uses the revised Mixture of Fertilizers description in section4.3.2 and sections24–24.3: N/P/K plus organic content and an identified combination of chemical/mineral and organic inputs. Do not merge it with the separately discussed Organic Manure, Bio-fertilizers or Nitrogenous Mixture, copy a proposed product as an observed factory inventory, or claim one actual order/grade from a family flowchart. The described production line is substantive manufacturing evidence; it is not an independent measured factory LCI.\n\nCPC3.0:34649 applies here only to the actual configured animal/vegetable-fertilizer plus mineral/chemical-fertilizer NPK mixture described in the revised GAAR case, not for every product called organic NPK. GAAR §§24–24.3 considers the named HS310520 NPK branch, reproduces HSEN31.05(B) composite/complex fertilizers and (C)(3) animal/vegetable fertilizers mixed with chemical/mineral fertilizers, then assigns this actual mixture to31059090. The official historical CPC2.1–HS2017 table links310520 wholly to34641 and310590 wholly to34649. This is evidence about a specific physical mixture and interpretative branch, not a deduction from an organic label, a numerical recipe or a current UN commodity ruling.\n\nThe current UNSD-linked CPC3 introduction, PDF26–30 §§49–51 and55–60, requires goods in sections0–4 to be classified by the corresponding HS category terms and interpretative rules, and applies the HS explanatory notes. Where an HS subheading links to several CPC subclasses, §51 requires selection using their explanatory notes and then the stated interpretation rules. §§72–74 retain exceptions and partial links; §72 says the detailed CPC3–HS2022 correspondence will be developed separately. §93 states continuity of category-delineation criteria and application rules, not identity of every old/new edge. The20November2023 proposal PDF77 and2024 draft PDF60 mark34644 NP as a name change and34647 NK as a breakdown, while34641 and34649 have no change marker there. These historical structures support a bounded continuity inference alongside the current rules; they are not the final correspondence table. Current introduction PDF42 §105 literally prints36464 and describes an NP-to-NP/NK split inconsistently with the structure. Preserve this contradiction and do not repair its text into a precise old/new crosswalk or use it as such.\n\nCombining those current interpretation rules with the actual GAAR mixture/HSEN(C)(3) reasoning, the historical310590→34649 link and the limited structural continuity supports the primary controller’s narrower34649 association for this particular configured mixture. This is a transparent technical classification synthesis, not a claim that a current CPC3–HS2022 table or UN product-specific ruling was obtained. Current34641 has an unqualified NPK title;34644 NP,34645 PK and34647 NK remain competing named categories. The current separate NK branch prevents wholesale transfer of historical310590 coverage. CBP NYN328393 (14October2022) actually classifies a different organic citric-acid/sugar mycelium byproduct containing P/K under310560 rather than310590; it disproves organic-label-only residual assignment and is not evidence that all organic matrices follow the GAAR branch. At least two genuine N/P/K nutrients are mandatory; one plus Ca/Mg/S is insufficient. Any changed physical mixture or named-branch applicability needs renewed review. A same-factory/SKU source or new legal ruling is not an absolute evidence requirement. The prior classification holds and author repair lineage remain dated history. The primary controller accepted this narrower scoped document and classification association on the stated evidence; it does not establish scientific expert approval, actual study qualification or publication. Exact delivery validation and serial integration evidence are recorded separately.\n\nThe selected reference family is an entire manufactured finished Product in production mix at plant, with at least two N/P/K nutrients and a residual-category condition. Its complete record has no CAS, pure formula, fixed grade, powder-only form, country or contrary manufacturing route. The actual prepared organic/mineral NPK granules supply a positive whole-product definition; the shared residual label alone does not establish fit. Every actual grade, supplied state, organic/mineral composition and availability must fit all hard fields, and residual applicability is accepted only for this configured mixture under the scoped decision above. Do not substitute urea, DAP, MOP, unactivated organic feed, an ingredient or an unchanged chemical carrying a fertilizer-use label for the whole preparation.\n\nQ0 is the independently weighed net fertilizer mass of unique first finished-grade acceptance events after every required same-configuration operation and required packing, ready for supply at the plant before dispatch. Exclude package tare while retaining true fertilizer water and all constituents once. Fix original configuration/composition/moisture basis and event IDs before reconciliation. Later delivery, return, repacking, retesting, rework or recovery creates no second acceptance. Q=0 means zero output and retains all raw loads without a normalized result. The source does not supply actual acceptance events, numerical quality limits or a package mass; these are explicit methodology/foreground records, not invented observations.\n\nReconcile each original Q0 across disjoint net remaining external deliveries, all actual on-site accepted states, irreversible losses and other terminal dispositions on its original-material basis. Closing accepted FG is already Q0, not unused manufacturing stock to subtract or a second production output. Gross returns leave the delivery position before entering their actual new position. Independently measured survivors, evaporated original water and lost constituents cannot be simultaneously restored and counted as losses. Opening old cohorts and later services retain original Q0/Qc and observed H; delivery plus closing FG is sufficient only when all other postgate states/exits are absent.\n\nKeep complete wet raw material, WIP, non-WIP, accepted FG, held/returned goods, internal recycle, packaging, installed fluids and every actual asset fleet as a physical ledger independent of the reference-event account and attributed burden vectors. Own opening WIP inherits its full actual prior foreground burdens once; substantiated unassigned closing WIP carries forward. Provider aggregates and the same embedded material/transport/asset history decomposition are mutually exclusive. Failed production, idle/start-stop, cleanout, samples and attempted repair remain incurred; actual service performed for stored FG is not erased.\n\nThe supplied whole urea, DAP, MOP and every other declared feed/preparation require complete real upstream manufacture and actual material/provider units. Commercial amino-acid, fulvic/humate and poultry-derived preparations remain whole specific supplied preparations only with actual identified supply/composition/inclusion boundaries; they are not uncharacterized ingredient baskets. The source word Poultry does not prescribe raw flesh, manure processing, dryness or a guessed chemical recipe; organic-feedstock ash does not prescribe plant origin or a biogenic carbon fraction. Known on-site preparation/composting must retain its complete real inputs, utilities, gas/liquid/solid losses and handovers; do not invent a purchase or paper-outsource it. Ordinary provider/quantity qualification is separate from a genuine essential-method gap.\n\nThe described coal furnace is an actual on-site producer of drying hot air. Preserve coal grade and full wet composition, ash, carbon/hydrogen/sulfur/nitrogen/oxygen, real atmospheric intake, water, reactive formation/consumption, combustion gases, ash/soot, actual controls and complete energy/loss interfaces. A purchased-heat label cannot hide it. The source does not establish direct flue-gas contact versus a heat exchanger: declare the actual coupling, hot-air composition and separate exhaust if present. A gas entering the dryer internally is not also an external furnace emission; a separate actual furnace stack is not omitted. Pair measured hot-air transfers and cancel once on consolidation, retaining the furnace fuel/utility/control burdens. AP42 supplies qualitative coal/phase countercontext, not a fuel rank, boiler configuration, emission factor or default efficiency for this plant.\n\nTrack supplied moisture, actual added granulation/cleaning water, ambient humidity, retained fertilizer water, evaporation, condensate, wet wastes, internal recirculation and actual chemical/biological water generation or consumption independently. Never infer reacting-species conservation, complete fuel conversion or zero gaseous release from elemental closure. N, P2O5 and K2O assays retain their actual conventions: oxide equivalents are not physical oxide additions, pure elemental P/K flows or the reference whole-product mass. GAAR supplies no complete quantitative assay programme. The subsequently acquired full FAO Bulletin19 (2008) supplies an independent mineral/organic fertilizer programme and explicit high-OM fertilizer-mixture preparation, with actual cross-references and the dimensional safeguards below. S.O.4477(E),2022,PartD14–15 remains real limited bone-meal/Rhodophytes evidence: its water-insoluble residue N is not whole-grade total N, citric-acid-soluble P is not every available-P indicator, and water-soluble K is not total K. Its missing ScheduleII endpoints limit that source; they are not a requirement to use FCO exclusively or proof that the independent FAO programme does not exist. The earlier no-FAO hold snapshot remains immutable history. This repair does not assert statutory compliance, actual batch success, scientific acceptance or classification admission. Genuinely unestablished necessary species/phase procedures remain specific holds; unperformed site QA of an established applicable programme is a distinct study obligation.\n\nEnvironmental methods apply only within actual species, phase and matrix scope. EPA320 supplies an extractive FTIR programme for identified IR-active vapors, reference spectra/interferences, heated transport and explicit analyte-spike matrix/recovery validation. EPA3C supplies its stated CO2/CH4/N2/O2 GC-TCD programme and source limits, not universal fertilizer-stack applicability or Ar measurement. Agilent5994-4552EN demonstrates Ar/O2 separation in a nitrogen-balance standard; single-concentration repeatability and column backflush protection do not prove multipoint response, full sample recovery or a hot/wet fertilizer outlet matrix. Homonuclear N2/O2 and monatomic Ar are not measured by ordinary IR-active FTIR. EPA5 defines filterable PM sampling/recovery/gravimetry, not every condensable or wet mist. Actual collected whole condensate/mist goes to its real receiver; actual final released species/medium require applicable procedures. A genuine unestablished essential procedure remains hold; ordinary site calibration/lot QA within an established applicable procedure is separate uncompleted study qualification, never claimed passed here.\n\nEach actual woven-polypropylene sack and separately supplied polyethylene liner has complete wet opening/closing empty, WIP-attached, FG-attached and reusable stock plus P, supplier-included I, external return received ERin, gross shipment S, external return outward EOout and true waste W. The source proves packing, not this packaging material or mass: these specific conditional pools require actual configuration evidence. Whole supplied sack/liner inclusions count once; do not buy its contained film/threads/additives again. An included liner has one real upstream owner and no second purchase. X_in/X_out remove only independently proved duplicates with OTHER same-side incoming/outgoing terms, never closing stock, opposite directions or card existence. Physical gross V disclosures create no procurement/provider/credit; only the one separately attributed provider-service amount A does so. For each one actual whole wet pool in kg, independently verify O + P + I + ERin + J_in + H2O_in - X_in = C + S + EOout + W + J_out + H2O_out - X_out. J_in/J_out are actual disjoint additional non-water material transfers, including real adhered/removed fertilizer or repair material only to the extent not already in another gross leg. H2O_in/H2O_out are actual disjoint sorption, added water, evaporation or other water transfers not already included in a whole wet leg. O/C and every whole wet leg retain all included contents; retained new material/water in C never cancels its real influx. X only subtracts independently proved overlap between OTHER same-side flow terms, never real J/H2O additions, C or opposite directions. Unknown terms stay unresolved, not fitted from one closure residual. Trace every real J/H2O source/destination with specific physical records/atomic interfaces and paired internal handovers; a raw ledger term is not a generic provider, extra waste exchange or extra Q. Adhered fertilizer remains part of the same whole contaminated receiver Qt if not physically separated.\n\nOne actual whole contaminated sack, liner, filter sleeve, ash export, rejected fertilizer, liquid mixture or retired asset has one complete physical receiver event Qt including substrate/article, retained fertilizer/coal dust or liquor and water once. Nested assays/origins are nonadditive components, not extra exported waste unless physically separated before the boundary. Preserve actual treatment/provider Qt and extensive unit independently of cohort attribution. Its gross Qt/Q disclosure is not automatic treatment demand: submit only evidenced compatible nonoverlapping service A with original Q0/Qc to the one quotient. Unknown assignment stays unresolved. Never shrink Qt by an environmental share or charge all Qt again to every cohort.\n\nEvery actual hopper, crusher, granulator, dryer, cooler, screen, coater, packer, furnace and separately supplied fan/pump/conveyor retains complete actual new/used receipt, external return, reusable transfer, retirement and wet installed/opening/closing fleet records. Whole-unit inclusions and separately bought units cannot be double-added. Service is actual compatible hours with complete real asset/provider history, unused/unassigned capacity and original cohorts; hours do not supply a lifetime or machine mass. Measure whole configured mass M if a count/mass bridge is needed. Keep real repair belt/oil and removed fluid/part outlets separate only when actually supplied/removed separately; components inside one retired whole asset remain nested.\n\nWithin an explicitly attributional modelling situation that requires allocation, first isolate dedicated operations or actual/virtual subdivision, then use evidenced exchange-specific determining physical causality. Only a genuinely residual common process may use same-gate actual-state contemporaneous market values. Reject a sale-only coproduct status, arbitrary mass/economic shares, or allocation as physical chemistry. Retained organic matter, nutrients and ash inside the supplied fertilizer are constituents, not coproducts. No fertilizer/agronomic benefit, carbon-storage credit or avoided-waste credit is inferred.\n\nEach candidate interface requires an actual present, evidenced absent, below-detection or unknown status. Conditional cards do not assert that a boiler, scrubber, wet mist, compost unit, coating culture or every listed gas exists. Unknown is not zero. Actual unlisted materials, preparation/utility/control units and identified final chemical species require specific atomic interfaces before data completeness. No generic VOC/NOx/COD/element indicator can become a molecular amount or a single proxy provider for a mixed process. The case contains no applicable universal assay, emission, recovery or calibration defaults.\n\nArithmetic illustration only: a whole10kg contaminated packaging export with8kg substrate and2kg retained fertilizer/water is one10kg receiver event. If independently evidenced compatible service attribution is25%/75% to original cohorts100/200kg, service amounts are2.5/7.5kg-equivalent and normalized results0.025/0.0375kg-equivalent per reference. The physical export never becomes2.5kg and its2kg retained material is not a second export. No source share, mass, grade, yield, dose or lifetime is established by these illustrative numbers.\n\n\nFor one actual whole supplied organo-mineral grade, follow FAO2008 Chapter6 sampling and preparation together with Chapter2 QA. Record representative lot selection, sealed hygroscopic sample identity, homogenization and the actual analytical portions; the guide explicitly provides no fixed universal sample count. Keep the unground physical-size portion separate. Fertilizer samples are not washed as plant tissue. Use independent traceable N and P/K aliquots from the same represented whole lot: do not measure N on a nitrate-containing P/K acid digest or use the phosphorus-preparation reagent nitrogen as product nitrogen. Select each source preparation according to the actual organic/mineral composition and nutrient form; no supplier purchase, composition, process ratio or analytical success is invented. Record original whole wet sample mass and the measured water-definition/basis before reporting any dry-basis concentration. The reference Q0 remains actual net whole supplied wet mass, never dry mass, pure nutrient or a sum of analytical indicators. Retain actual performed sampling/testing burdens and sample losses through complete real own-laboratory atomic interfaces or a genuinely matched complete external analytical provider, with actual units, chemicals, utilities and whole wastes included once. The sources do not establish that this factory bought a test or operated a specific laboratory; no purchased-service stub hides known on-site work. An actual missing chemical/waste interface is added specifically before inventory completeness. Laboratory concentration and aliquot calculations do not perform another LCA division by Q or create physical nutrient-component exchanges; the sole inventory A/Q rule remains unchanged.\n\nFor total N, Chapter6 explicitly links fertilizer NH4, nitrate, urea and organic N to the complete Chapter3 Kjeldahl digestion/distillation/standardized acid-receiver/back-titration programme. Include the specified nitrate-reduction modification when nitrate is present; unreduced Kjeldahl N is not relabelled total N. Preserve the source controls for complete digestion, acid loss, frothing, ammonia transfer and receiver capacity. Where a form is actually reported, use its distinct Chapter6 distillation/reduction or urease preparation, with the phosphate/calcium separation and actual form-selective recovery; total N is not inferred from a water-insoluble residue, and a difference is not an unvalidated universal organic-N assay. Correct the source arithmetic transparently by Chapter2 equivalents and the actual sample-minus-blank account: q_N_mEq=(Va_s*nA_s-Vb_s*nB_s)-(Va_b*nA_b-Vb_b*nB_b), with V in ml and independently standardized n in eq/L; N_mass_g=0.01401*q_N_mEq*D_N; N_percent=100*N_mass_g/W_g. D_N is only the inverse actual original-sample fraction in the measured aliquot and is1 for an undivided digest; it is not100 because the sample weighs1g. For complete acid neutralization, HCl normality equals molarity and H2SO4 normality is twice molarity; use actual standardized equivalents. Retain the original printed df100/M-versus-N and NH4 (A-C)-B blank defects and the conflicting HCl dilution, rather than silently copying them. Negative/failed blank-corrected results remain flagged, not truncated to zero or turned into a product-content default.\n\nFor total P, the specific Chapter6 branch for materials and fertilizer mixtures with high organic matter destroys the organic matrix using magnesium nitrate/ashing before acid dissolution; low-OM and iron/aluminium-phosphate/basic-slag branches are distinct. Preserve this specific branch alongside the book's broader organic-wet-digestion statement, disclose the actual selection and residual/recovery evidence, and never imply a universally interchangeable digestion. The complete quinolinium-phosphomolybdate precipitation, filter/constant-mass, reagent blank and standard-recovery programme follows. Use total_P2O5_percent=100*(S_g-B_g)*f_P*D_P/W_g, where f_P is the verified stoichiometric P2O5-equivalent mass fraction of that stated precipitate and D_P is the inverse original-sample fraction in the actual precipitated aliquot. Adding water to that same wholly precipitated aliquot creates no extra dilution factor. Independently determine water-soluble P by its specified water extraction; for the book's defined available-P indicator, follow water washing, neutral-ammonium-citrate treatment of the residue, actual insoluble-residue digestion and the same endpoint, then available_P2O5=total_P2O5-citrate_insoluble_P2O5 on the same original sample basis. Water-soluble P is already included in that available result and is not added again. Citric-acid-soluble, neutral-citrate-soluble, water-soluble and total indicators remain distinct. Assay P2O5 is an equivalent, not physical oxide mass or evidence of crop response.\n\nFor the declared total-K analytical boundary, Chapter6 requires acid digestion for organic fertilizer and cross-references Chapter4; use its complete appropriate digestion and acid-digest K/AAS programme, not water dissolution alone for the organic/mineral whole grade. Preserve actual dissolution/residue, acid/mineral matrix, analyte recovery, blanks, standards and measured working response. Do not assume carbonate/high ash is fully dissolved from its label, nor call a residue K-free without evidence. The guide's inconsistent AAS stated linear range and standard points are retained as a source limitation, not transferred instrument settings or a universal response range. For an actual measured final solution, K_mass_g=(C_sample-C_blank)_ug_per_ml*V_final_ml*D_prior/1000000 and K_percent=100*K_mass_g/W_g; D_prior is only the inverse original-sample fraction transferred into that final solution and excludes V_final already used. An instrument result already corrected to the original sample is not diluted again. Convert elemental K and K2O equivalent only once using the declared stoichiometric convention, without adding a physical K2O flow. The distinct Chapter6 STPB alternative masks ammonium and addresses chloride/sulphate, but its printed f is tied to its specific sample/solution/aliquot construction; it is not silently reused for a different organic sample or substituted for this declared acid-digest programme. A genuinely unaddressed necessary matrix procedure remains hold; routine actual-lot digestion/recovery checks within this complete applicable programme are study qualification. The printed solution mg/kg versus ug/ml equivalence is not transferred without an actual density/unit bridge; retain measured solution concentration and its actual extensive volume.\n\nMoisture and wet/dry conversion retain an actual method-defined water measurand, not any loss on heating. Chapter6 warns that oven loss for DAP can include other volatiles and that low-temperature urea drying need not recover all moisture; it provides distinct desiccator and Karl Fischer programmes. For the chosen urea-containing grade, use an actually applicable standardized KF programme with the represented sample, blank/drift, water recovery and uncertainty. Compute water_percent=100*F_mg_per_ml*(V_sample-V_blank)_ml/(1000*W_g), with F derived from the actual certified/known water mass and response; do not copy the source's printed 000 mg/g denominator or 0.1566-percent statement. Keep KF-recoverable/free/crystal-bound water definitions distinct; an unestablished necessary bound-water/other-phase procedure is a specific remaining hold, not an assumed equality. For an actually justified water fraction w on the same sample basis, dry_mass=wet_mass*(1-w) and dry_basis_nutrient_fraction=wet_basis_nutrient_fraction/(1-w); original whole wet Q0 never changes. Chapter2 requires homogeneous/stable controls, independently standardized reagents, full-process blanks, independent standards, repeat/blind checks, actual validation and recorded deviations. Those actual study results have not been performed here. Method existence is evidenced by the full source and explicit dimensional synthesis; valid site/lot application, all necessary actual phases and independent scientific review remain separate, and a failed or genuinely unknown essential procedure is never waived by finite checkpass.\n"
