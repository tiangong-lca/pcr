  calculation_rules:
    - id: single_quotient
      applies_to: "all inventory rows"
      rule: "x = A / Q. Convert original units and integrate true rates once before the sole quotient. Gross rows use A=full actualV without stock/share/economic correction or extra provider. Attributable A uses actual compatible raw burden plus only unassigned inherited opening vector minus substantiated still-unassigned closing vector and one justified independent other-cohort/function handover; already-net consumption has no second correction, and accepted closingFG is never deducted. Newproduction uses its independentQ; postgate service/physical disclosure uses originalQ0/Qc with observedH; reference is exactly1kg. Q=0/unknown keeps raw loads without x. Collection/aggregation performs no second division."
      inputs:
        - raw
        - native_unit
        - V
        - A
        - Q
        - Q0
        - Qc
        - H
        - inherited_vectors
      output: "x"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all applicable rows / real declared scope"
      requirement: "The selected reference family is an entire manufactured finished Product in production mix at plant, with at least two N/P/K nutrients and a residual-category condition. Its complete record has no CAS, pure formula, fixed grade, powder-only form, country or contrary manufacturing route. The actual prepared organic/mineral NPK granules supply a positive whole-product definition; the shared residual label alone does not establish fit. Every actual grade, supplied state, organic/mineral composition and availability must fit all hard fields, and residual applicability is accepted only for this configured mixture under the scoped decision above. Do not substitute urea, DAP, MOP, unactivated organic feed, an ingredient or an unchanged chemical carrying a fertilizer-use label for the whole preparation."
      evidence: "Actual original source, native full record, whole supply and independent raw/method/receiver evidence"
    - id: dq_scope
      applies_to: "all applicable rows / real declared scope"
      requirement: "CPC3.0:34649 applies here only to the actual configured animal/vegetable-fertilizer plus mineral/chemical-fertilizer NPK mixture described in the revised GAAR case, not for every product called organic NPK. GAAR §§24–24.3 considers the named HS310520 NPK branch, reproduces HSEN31.05(B) composite/complex fertilizers and (C)(3) animal/vegetable fertilizers mixed with chemical/mineral fertilizers, then assigns this actual mixture to31059090. The official historical CPC2.1–HS2017 table links310520 wholly to34641 and310590 wholly to34649. This is evidence about a specific physical mixture and interpretative branch, not a deduction from an organic label, a numerical recipe or a current UN commodity ruling. The current UNSD-linked CPC3 introduction, PDF26–30 §§49–51 and55–60, requires goods in sections0–4 to be classified by the corresponding HS category terms and interpretative rules, and applies the HS explanatory notes. Where an HS subheading links to several CPC subclasses, §51 requires selection using their explanatory notes and then the stated interpretation rules. §§72–74 retain exceptions and partial links; §72 says the detailed CPC3–HS2022 correspondence will be developed separately. §93 states continuity of category-delineation criteria and application rules, not identity of every old/new edge. The20November2023 proposal PDF77 and2024 draft PDF60 mark34644 NP as a name change and34647 NK as a breakdown, while34641 and34649 have no change marker there. These historical structures support a bounded continuity inference alongside the current rules; they are not the final correspondence table. Current introduction PDF42 §105 literally prints36464 and describes an NP-to-NP/NK split inconsistently with the structure. Preserve this contradiction and do not repair its text into a precise old/new crosswalk or use it as such. Combining those current interpretation rules with the actual GAAR mixture/HSEN(C)(3) reasoning, the historical310590→34649 link and the limited structural continuity supports the primary controller’s narrower34649 association for this particular configured mixture. This is a transparent technical classification synthesis, not a claim that a current CPC3–HS2022 table or UN product-specific ruling was obtained. Current34641 has an unqualified NPK title;34644 NP,34645 PK and34647 NK remain competing named categories. The current separate NK branch prevents wholesale transfer of historical310590 coverage. CBP NYN328393 (14October2022) actually classifies a different organic citric-acid/sugar mycelium byproduct containing P/K under310560 rather than310590; it disproves organic-label-only residual assignment and is not evidence that all organic matrices follow the GAAR branch. At least two genuine N/P/K nutrients are mandatory; one plus Ca/Mg/S is insufficient. Any changed physical mixture or named-branch applicability needs renewed review. A same-factory/SKU source or new legal ruling is not an absolute evidence requirement. The prior classification holds and author repair lineage remain dated history. The primary controller accepted this narrower scoped document and classification association on the stated evidence; it does not establish scientific expert approval, actual study qualification or publication. Exact delivery validation and serial integration evidence are recorded separately."
      evidence: "Actual original source, native full record, whole supply and independent raw/method/receiver evidence; current CPC3 introduction and2023/2024 structural context; bounded author synthesis pending independent acceptance"
    - id: dq_states
      applies_to: "all applicable rows / real declared scope"
      requirement: "Reconcile each original Q0 across disjoint net remaining external deliveries, all actual on-site accepted states, irreversible losses and other terminal dispositions on its original-material basis. Closing accepted FG is already Q0, not unused manufacturing stock to subtract or a second production output. Gross returns leave the delivery position before entering their actual new position. Independently measured survivors, evaporated original water and lost constituents cannot be simultaneously restored and counted as losses. Opening old cohorts and later services retain original Q0/Qc and observed H; delivery plus closing FG is sufficient only when all other postgate states/exits are absent."
      evidence: "Actual original source, native full record, whole supply and independent raw/method/receiver evidence"
    - id: dq_receiver
      applies_to: "all applicable rows / real declared scope"
      requirement: "One actual whole contaminated sack, liner, filter sleeve, ash export, rejected fertilizer, liquid mixture or retired asset has one complete physical receiver event Qt including substrate/article, retained fertilizer/coal dust or liquor and water once. Nested assays/origins are nonadditive components, not extra exported waste unless physically separated before the boundary. Preserve actual treatment/provider Qt and extensive unit independently of cohort attribution. Its gross Qt/Q disclosure is not automatic treatment demand: submit only evidenced compatible nonoverlapping service A with original Q0/Qc to the one quotient. Unknown assignment stays unresolved. Never shrink Qt by an environmental share or charge all Qt again to every cohort."
      evidence: "Actual original source, native full record, whole supply and independent raw/method/receiver evidence"
    - id: dq_method
      applies_to: "all applicable rows / real declared scope"
      requirement: "Environmental methods apply only within actual species, phase and matrix scope. EPA320 supplies an extractive FTIR programme for identified IR-active vapors, reference spectra/interferences, heated transport and explicit analyte-spike matrix/recovery validation. EPA3C supplies its stated CO2/CH4/N2/O2 GC-TCD programme and source limits, not universal fertilizer-stack applicability or Ar measurement. Agilent5994-4552EN demonstrates Ar/O2 separation in a nitrogen-balance standard; single-concentration repeatability and column backflush protection do not prove multipoint response, full sample recovery or a hot/wet fertilizer outlet matrix. Homonuclear N2/O2 and monatomic Ar are not measured by ordinary IR-active FTIR. EPA5 defines filterable PM sampling/recovery/gravimetry, not every condensable or wet mist. Actual collected whole condensate/mist goes to its real receiver; actual final released species/medium require applicable procedures. A genuine unestablished essential procedure remains hold; ordinary site calibration/lot QA within an established applicable procedure is separate uncompleted study qualification, never claimed passed here."
      evidence: "Actual original source, native full record, whole supply and independent raw/method/receiver evidence"
    - id: dq_complete
      applies_to: "all applicable rows / real declared scope"
      requirement: "Each candidate interface requires an actual present, evidenced absent, below-detection or unknown status. Conditional cards do not assert that a boiler, scrubber, wet mist, compost unit, coating culture or every listed gas exists. Unknown is not zero. Actual unlisted materials, preparation/utility/control units and identified final chemical species require specific atomic interfaces before data completeness. No generic VOC/NOx/COD/element indicator can become a molecular amount or a single proxy provider for a mixed process. The case contains no applicable universal assay, emission, recovery or calibration defaults."
      evidence: "Actual original source, native full record, whole supply and independent raw/method/receiver evidence"
    - id: dq_assay
      applies_to: "actual whole-grade nutrient/water assays"
      requirement: "Moisture and wet/dry conversion retain an actual method-defined water measurand, not any loss on heating. Chapter6 warns that oven loss for DAP can include other volatiles and that low-temperature urea drying need not recover all moisture; it provides distinct desiccator and Karl Fischer programmes. For the chosen urea-containing grade, use an actually applicable standardized KF programme with the represented sample, blank/drift, water recovery and uncertainty. Compute water_percent=100*F_mg_per_ml*(V_sample-V_blank)_ml/(1000*W_g), with F derived from the actual certified/known water mass and response; do not copy the source's printed 000 mg/g denominator or 0.1566-percent statement. Keep KF-recoverable/free/crystal-bound water definitions distinct; an unestablished necessary bound-water/other-phase procedure is a specific remaining hold, not an assumed equality. For an actually justified water fraction w on the same sample basis, dry_mass=wet_mass*(1-w) and dry_basis_nutrient_fraction=wet_basis_nutrient_fraction/(1-w); original whole wet Q0 never changes. Chapter2 requires homogeneous/stable controls, independently standardized reagents, full-process blanks, independent standards, repeat/blind checks, actual validation and recorded deviations. Those actual study results have not been performed here. Method existence is evidenced by the full source and explicit dimensional synthesis; valid site/lot application, all necessary actual phases and independent scientific review remain separate, and a failed or genuinely unknown essential procedure is never waived by finite checkpass."
      evidence: "Complete FAO source/selected preparation and cross-references; actual aliquot/equivalent/blank ledger and matrix QA results/unknowns; source printed defects and derived dimensional proof"
validation_rules:
  - rule_id: v_reference
    applies_to: "whole product and independent acceptance"
    rule: "Q0 is the independently weighed net fertilizer mass of unique first finished-grade acceptance events after every required same-configuration operation and required packing, ready for supply at the plant before dispatch. Exclude package tare while retaining true fertilizer water and all constituents once. Fix original configuration/composition/moisture basis and event IDs before reconciliation. Later delivery, return, repacking, retesting, rework or recovery creates no second acceptance. Q=0 means zero output and retains all raw loads without a normalized result. The source does not supply actual acceptance events, numerical quality limits or a package mass; these are explicit methodology/foreground records, not invented observations."
    source_ids:
      - gaar-organo-mineral-2020
