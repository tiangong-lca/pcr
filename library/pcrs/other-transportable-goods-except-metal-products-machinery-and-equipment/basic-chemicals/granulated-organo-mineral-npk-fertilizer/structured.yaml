allocation_rules:
  - rule_id: a_attribution
    applies_to: "actual attributional multifunctionality"
    rule: "Within an explicitly attributional modelling situation that requires allocation, first isolate dedicated operations or actual/virtual subdivision, then use evidenced exchange-specific determining physical causality. Only a genuinely residual common process may use same-gate actual-state contemporaneous market values. Reject a sale-only coproduct status, arbitrary mass/economic shares, or allocation as physical chemistry. Retained organic matter, nutrients and ash inside the supplied fertilizer are constituents, not coproducts. No fertilizer/agronomic benefit, carbon-storage credit or avoided-waste credit is inferred."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_physical
    applies_to: "all physical events"
    rule: "One actual whole contaminated sack, liner, filter sleeve, ash export, rejected fertilizer, liquid mixture or retired asset has one complete physical receiver event Qt including substrate/article, retained fertilizer/coal dust or liquor and water once. Nested assays/origins are nonadditive components, not extra exported waste unless physically separated before the boundary. Preserve actual treatment/provider Qt and extensive unit independently of cohort attribution. Its gross Qt/Q disclosure is not automatic treatment demand: submit only evidenced compatible nonoverlapping service A with original Q0/Qc to the one quotient. Unknown assignment stays unresolved. Never shrink Qt by an environmental share or charge all Qt again to every cohort."
    source_ids:
      - ilcd-allocation-2010
