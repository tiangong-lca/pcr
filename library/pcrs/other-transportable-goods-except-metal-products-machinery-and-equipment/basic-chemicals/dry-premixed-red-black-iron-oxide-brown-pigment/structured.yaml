allocation_rules:
  - rule_id: allocation_single
    applies_to: "blend_finish"
    rule: "Only brown preparation is the reference output. Separate actual physical waste, packaging transfers and reference events from environmental allocation. A sack or retained dust does not become a co-function merely because it leaves the plant."
    source_ids: []
  - rule_id: allocation_cohorts
    applies_to: "blend_finish"
    rule: "Use actual batch/submeter tracing before shared-service allocation. Document causal equipment-time, throughput or measured dust-load drivers and their coverage. Each burden vector is assigned once; retain unresolved shared burdens when no supported driver exists."
    source_ids: []
  - rule_id: allocation_inheritance
    applies_to: "blend_finish"
    rule: "Own opening WIP carries its actual inherited foreground vector once. Do not re-add charges/meters already included in that vector. Purchased provider aggregates retain embedded history; either use that aggregate or its verified disjoint decomposition, never both. Physical mass is conserved independently of burden shares."
    source_ids: []
  - rule_id: allocation_returns
    applies_to: "blend_finish"
    rule: "Rework, customer return, retest and internal dust recycling preserve original lot identity and original Q0. Later handling/service uses the original reference basis; it cannot create a new accepted-product denominator or new upstream manufacture."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "blend_finish"
      flow_role: "finished_brown"
      record_type: "acceptance/event ledger"
      raw_fields: "event_id; cohort_id; lot; gross; tare; net m_e; moisture; grade; two-component composition; acceptance method/time; opening FG; later states/returns/losses"
      collection_method: "Calibrated whole-powder net weighing and approved batch tests at one fixed gate; lock original event once, reconcile every later state without duplicate acceptance. Aggregation procedure: per 1 kg reference flow; sum unique first-acceptance net masses Q"
      unit: "kg"
      frequency: "each first acceptance and subsequent state transfer"
      temporal_coverage: "same continuous interval and original cohorts"
      site_scope: "same grade, site and dry route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original batch/transfer records; traceable uncertainty, stock/genealogy and provider checks"
    - protocol_id: cp_material
      process_id: "blend_finish"
      flow_role: "red_feed, black_feed"
      record_type: "separate pigment ledger"
      raw_fields: "row_id; supplier; synthetic origin; batch; PR101/PBk11; CAS; composition; charged mass; moisture; receipts; returns; raw/WIP stocks; inherited burden provenance"
      collection_method: "Calibrated separate weighing, composition/COA and receipt-charge-stock reconciliation; preserve full physical records and disjoint attributed demand. Aggregation procedure: per 1 kg reference flow; each attributed numerator / Q"
      unit: "kg"
      frequency: "each receipt, charge, return and stock boundary"
      temporal_coverage: "same continuous interval and original cohorts"
      site_scope: "premix site and actual upstream interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original batch/transfer records; traceable uncertainty, stock/genealogy and provider checks"
    - protocol_id: cp_power
      process_id: "blend_finish"
      flow_role: "electricity"
      record_type: "submetered electricity"
      raw_fields: "meter_id; equipment; kWh; timestamps; rework/idle states; source provider; voltage; delivery losses; shared drivers"
      collection_method: "Submeter mixer, fan, vacuum, packing and QA; reconcile total meters and justified shared drivers; retain original units. Aggregation procedure: per 1 kg reference flow; attributable MJ / Q"
      unit: "MJ"
      frequency: "continuous or bounded meter interval"
      temporal_coverage: "same continuous interval and original cohorts"
      site_scope: "actual included equipment and utility boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original batch/transfer records; traceable uncertainty, stock/genealogy and provider checks"
    - protocol_id: cp_pack
      process_id: "blend_finish"
      flow_role: "sack_input, sack_delivered, sack_returned, sack_scrap"
      record_type: "packaging transfer ledger"
      raw_fields: "row_id; sack_id; construction; tare; count; incoming; delivered; serviceable return; customer return; whole contaminated scrap mass; paper substrate; retained pigment; water; opening/closing empty and filled stocks; receiver; provider; transfer_id; whole physical Qt; full actual receiver/provider demand and unit; observed component/cohort provenance; actual served-cohort history; evidenced non-overlapping treatment shares; modeled A_c or burden vector; original Q_c; unresolved scope"
      collection_method: "Weigh actual empty/product sacks and every transfer by row. For sack_scrap weigh the whole contaminated exported sack; substrate/tare, pigment and water sum to that whole transfer as nested subledgers. Reconcile count/mass, genealogy, stocks and receiver treatment demand independently of attributable manufacture. Record one actual whole transfer and full actual total receiver/provider quantity by transfer_id. Keep physical component/cohort provenance only where observed. Separately derive non-overlapping modeled treatment demand or burden vectors for each actually served cohort from supported drivers and compatible provider units; normalize each assigned numerator with that cohort’s original Q_c, never recharge Qt in full to each cohort. Shared-history rules apply to sack waste only when its actual recipient/service history is shared. Unknown shares stay unresolved; no physical output is reduced. Aggregation procedure: per 1 kg reference flow; modeled attributed A_c / original Q_c only; raw Qt and full actual receiver quantity are recorded once outside this normalization."
      unit: "kg"
      frequency: "each packing, return, disposal and stock boundary"
      temporal_coverage: "same continuous interval and original cohorts"
      site_scope: "actual packaging configuration and interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original batch/transfer records; traceable uncertainty, stock/genealogy and provider checks"
    - protocol_id: cp_asset
      process_id: "blend_finish"
      flow_role: "filter_sleeve, spent_filter"
      record_type: "physical fleet/service ledger"
      raw_fields: "row_id; component_id; polyester substrate mass/count; dimensions; install/removal dates; opening/closing fleet; cleaning; whole contaminated spent-sleeve export; nested retained pigment and water; receiver; actual service history; original served cohorts; provider unit; transfer_id; whole physical Qt; full actual receiver/provider demand and unit; observed component/cohort provenance; actual served-cohort history; evidenced non-overlapping treatment shares; modeled A_c or burden vector; original Q_c; unresolved scope"
      collection_method: "Weigh new substrate and actual whole contaminated removed sleeve exports. Reconcile dry substrate fleet separately; nest substrate, retained pigment and water within each one receiver transfer, without another attached-powder exchange or duplicate treatment demand. Attribute supplier service from real history and original served cohorts independently of physical waste mass. Record one actual whole transfer and full actual total receiver/provider quantity by transfer_id. Keep physical component/cohort provenance only where observed. Separately derive non-overlapping modeled treatment demand or burden vectors for each actually served cohort from supported drivers and compatible provider units; normalize each assigned numerator with that cohort’s original Q_c, never recharge Qt in full to each cohort. Shared-history rules apply to sack waste only when its actual recipient/service history is shared. Unknown shares stay unresolved; no physical output is reduced. Aggregation procedure: per 1 kg reference flow; modeled attributed A_c / original Q_c only; raw Qt and full actual receiver quantity are recorded once outside this normalization."
      unit: "kg"
      frequency: "each installation, service, removal and interval boundary"
      temporal_coverage: "complete actual service history spanning the interval"
      site_scope: "actual filter and its served production cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original batch/transfer records; traceable uncertainty, stock/genealogy and provider checks"
    - protocol_id: cp_waste
      process_id: "blend_finish"
      flow_role: "brown_dust_waste"
      record_type: "powder-residue transfer"
      raw_fields: "lot; source; red/black composition; wet/dry mass; retained water; receiver; weigh ticket; disposal; internal recycle; stocks; transfer_id; whole physical Qt; full actual receiver/provider demand and unit; observed component/cohort provenance; actual served-cohort history; evidenced non-overlapping treatment shares; modeled A_c or burden vector; original Q_c; unresolved scope"
      collection_method: "Weigh each exported powder mixture and establish destination and composition; keep internal caught/recycled powder and stock changes distinct. Record one actual whole transfer and full actual total receiver/provider quantity by transfer_id. Keep physical component/cohort provenance only where observed. Separately derive non-overlapping modeled treatment demand or burden vectors for each actually served cohort from supported drivers and compatible provider units; normalize each assigned numerator with that cohort’s original Q_c, never recharge Qt in full to each cohort. Shared-history rules apply to sack waste only when its actual recipient/service history is shared. Unknown shares stay unresolved; no physical output is reduced. Aggregation procedure: per 1 kg reference flow; modeled attributed A_c / original Q_c only; raw Qt and full actual receiver quantity are recorded once outside this normalization."
      unit: "kg"
      frequency: "each transfer and stock boundary"
      temporal_coverage: "same continuous interval and original cohorts"
      site_scope: "actual residue and receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original batch/transfer records; traceable uncertainty, stock/genealogy and provider checks"
    - protocol_id: cp_air
      process_id: "blend_finish"
      flow_role: "dust_air"
      record_type: "post-control particulate test"
      raw_fields: "outlet; composition; sample/filter/rinse/blank masses; gas flow; duration; dry/wet basis; pressure; temperature; traverse; isokinetic ratio; leaks; calibration; operating state; bypass; fugitive capture; detection limit; completeness"
      collection_method: "Apply complete applicable Method5 with dependency records and QA; integrate actual compatible concentration and flow over operating states; separately substantiate fugitive and condensable coverage, never derive emissions from capture mass alone. Aggregation procedure: per 1 kg reference flow; integrated non-overlapping actual PM release / Q"
      unit: "kg"
      frequency: "representative tests and operating-state records"
      temporal_coverage: "same continuous interval including actual bypass and cleaning"
      site_scope: "all actual stationary outlets and fugitive pathways"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original batch/transfer records; traceable uncertainty, stock/genealogy and provider checks"
  calculation_rules:
    - id: acceptance_events
      applies_to: "finished_brown"
      rule: "Q = sum of measured net m_e over unique first-acceptance event IDs in the new cohort; original IDs, moisture and mass locked once. Opening FG dispatch, loops, returns, retests and rework add zero new events."
      inputs:
        - event_id
        - m_e
        - cp_product
      output: "Q in kg"
      source_ids: []
    - id: normalize_cohort
      applies_to: "all inventory rows"
      rule: "Row modeled normalized exchange = its non-overlapping attributable numerator / the linked positive original cohort Q_c. For waste treatment the numerator is A_c in verified compatible provider units or a separately assigned burden vector, not the full shared raw Qt for every cohort. Physical Qt and full actual receiver/provider quantity remain recorded once; later services keep original Q_c."
      inputs:
        - "row attributed numerator"
        - "original Q_c"
        - cp_product
      output: "original row unit per 1 kg reference flow"
      source_ids: []
    - id: cohort_bridge
      applies_to: "cp_product"
      rule: "Q0 = disjoint net remaining deliveries + all onsite accepted states + irreversible losses + other terminal dispositions on original acceptance basis, after separately removing later external additions. Every actual postgate fate is included exactly once."
      inputs:
        - Q0
        - genealogy
        - "physical states"
        - "additions and losses"
      output: "original-cohort bridge and residual"
      source_ids: []
    - id: physical_balances
      applies_to: "blend_finish"
      rule: "For each physical material/element: opening stock + external inputs = closing stock + actual external outputs, with all internal links equal and cancelling at aggregate boundary. Water phase changes are separate; no assumed chemical reaction or invented closure."
      inputs:
        - "actual raw/WIP/FG/dust/packaging/filter ledgers"
        - composition
      output: "total, Fe/O, component and water residuals"
      source_ids: []
    - id: burden_bridge
      applies_to: "all inventory rows"
      rule: "Opening own-WIP vector + non-overlapping new foreground and upstream vectors = closing carried vectors + terminal attributed vectors; identify all period/cohort cuts. Never add provider aggregates to their embedded decomposition."
      inputs:
        - "inherited vectors"
        - "new drivers"
        - "provider basis"
        - "closing vectors"
      output: "auditable burden assignment separate from physical quantities"
      source_ids: []
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "Energy in MJ = measured kWh × 3.6; a unit conversion only, not a default intensity or upstream production assumption."
      inputs:
        - kWh
        - cp_power
      output: "electricity MJ"
      source_ids: []
    - id: pm_load
      applies_to: "dust_air"
      rule: "Stationary PM load = integral of measured concentration × actual gas volume flow × time with compatible dry/wet, pressure and temperature bases, using blank-corrected gravimetric observations and validated recovery. Add only independent actually measured fugitive loads, without double counting captured dust or overlapping totals."
      inputs:
        - cp_air
        - "compatible concentration and gas flow"
        - duration
      output: "actual particulate release kg"
      source_ids:
        - epa-pm5-2017
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify whole product versus component, type, composition, CAS, phase, route, geography, actual provider, property and unit. Broad native family identity is not a compatible process background."
      evidence: "Full native records, grade/COA and provider documentation"
    - id: dq_acceptance
      applies_to: "finished_brown"
      requirement: "Require actual approved grade/homogeneity testing and two-component admission; no colour-to-recipe inference or borrowed numerical grade."
      evidence: "Acceptance records and declared actual test methods"
    - id: dq_ledgers
      applies_to: "blend_finish"
      requirement: "Reconcile unique events, every physical fate, total/component/element/water residuals and disjoint burden vectors; allocation cannot repair mass imbalance."
      evidence: "Stock snapshots, genealogy and independent balance calculations"
    - id: dq_air
      applies_to: "dust_air"
      requirement: "Identify actual outdoor compartment, all outlets/pathways, recovery, blanks, detection limits, condensable/fugitive scope and uncertainty. Unmeasured is not zero; unspecified size does not create LCIA coverage."
      evidence: "Complete test plan, calibration and coverage assessment"
    - id: dq_pack_assets
      applies_to: "cp_pack, cp_asset"
      requirement: "Preserve actual whole-transfer and full total receiver quantities once, separately from nested physical provenance and non-overlapping modeled service/burden assignment by served cohort. Verify actual provider units/composition and each original Q_c. No guessed shares, lifetime, provenance, recovery credit or full-transfer recharge to multiple cohorts."
      evidence: "Tare, component history and compatible provider unit records"
    - id: dq_scope
      applies_to: "blend_finish"
      requirement: "Prove the dry nonreacting route; retain upstream synthesis and every actual utility/material exchange, with gaps exposed. Publication requires independent methodology and translation review, plus study qualification."
      evidence: "Plant diagram, continuous records, upstream boundaries and gap log"
validation_rules:
  - rule_id: validate_product
    applies_to: "finished_brown"
    rule: "Require one finished-brown reference output with whole mixture identity, 1 kg net acceptance basis and all ordered qualifiers; no pure oxide or adjacent chemical qualifies by use label alone."
    source_ids:
      - kremer-brown-preparation
      - census-preparations-2022
  - rule_id: validate_route
    applies_to: "blend_finish"
    rule: "Check actual purchased synthetic red101 and black11 plus dry physical premixing; unknown core composition, synthesis, wet or thermal operations prevent applicability."
    source_ids:
      - lanxess-premix-2004
  - rule_id: validate_events
    applies_to: "cp_product"
    rule: "Check event deduplication and general original-cohort bridge, including returns, losses, all stocks and terminal fates; opening-FG dispatch is not new output."
    source_ids: []
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Require common bilingual reference/collection basis and linked positive Q; retain raw units and unresolved normalization when Q is unknown or zero. Packaging, dry mass and provider service are not substitute denominators."
    source_ids: []
  - rule_id: validate_physical_burden
    applies_to: "blend_finish"
    rule: "Independently check physical mass/components/Fe/O/water/packaging/filter ledgers and burden inheritance. Do not double-add provider embedded history or original reworked material."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "dataset"
    rule: "Finite measurement/schema success does not establish scientific approval or a qualified study. Close actual identity/provider gaps and unmeasured air paths before claiming complete LCI; report missing scopes and characterization coverage explicitly."
    source_ids:
      - epa-pm5-2017
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "This PCR covers a prepared brown colouring powder made by physical dry premixing of purchased synthetic Pigment Red 101 (Fe2O3, CAS1309-37-1) and Pigment Black 11 (Fe3O4, CAS1317-61-9), followed by enclosed homogenisation, dry dust collection, sampling, packing and first finished-lot acceptance. Both colour components must actually be present. This is a mixture preparation, not an individual iron oxide described as pigment grade. LANXESS documents premixed brown powder shades; the separately published Kremer48350 product sheet identifies a real red101/black11 powder mixture. These are existence and route evidence, not a prescribed formulation or qualification of any current supplier."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Exclude synthesis, precipitation, calcination, oxidation, thermal colour conversion, wet milling/washing, spray drying, granulation, solvent or aqueous dispersions, organic binders, carbon black, yellow pigment and other added colourants or fillers. Exclude natural earth colours, pure oxides, mixed-metal oxide pigments made by chemical reaction, retail artists’ colour packs, paints, polymer masterbatches and luminophores. This bounded purchased-powder route requires compatible upstream synthesis burdens; it cannot hide onsite synthesis or treatment. The declared starting condition is an interface, not a claim of burden-free production."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Classification interpretation distinguishes chapter28 individual chemically defined oxides from chapter32 preparations based on colouring matter: Census chapter32 notes1(a)/3 and 3206.49.2000 provide supporting context. CPC34340 is broader than this product. A brown label alone is insufficient: require two actual components and preparation records. The native reference’s 35120 classification is conflicting metadata retained for source clarification, not evidence that this industrial powder is an artists’ colour or that a34340 edge is accepted."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "The reference is the whole prepared powder. The broad native inorganic-pigment definition expressly includes chemical formulations and imposes no hard CAS, synthesis route, phase or geographic restriction; actual two-component powder admission and provider compatibility remain compulsory. Its general non-toxicity language is not a product safety or environmental benefit claim. A pure component, electricity service or background process cannot replace the reference. Required qualifiers must all be declared in the data package."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "Receipt/stock → separate powder weighing → enclosed premix/homogenisation → sampling and packing → first acceptance → accepted stocks/dispatch. A separately metered extraction fan and dry filter return compatible caught powder to its identified batch or export it as measured waste. Dry vacuum cleaning belongs to this unit. No synthesis, burner or wet effluent is assumed; supplier synthesis stays in the upstream linked boundary. Ambient ventilation air is a carrier, not a purchased oxygen product or a reaction source. Record actual moisture uptake/evaporation separately if present."
    source_ids: []
  - rule_id: validation_rule_12
    applies_to: "foreground_dataset_conformance"
    rule: "Select one continuous representative production interval covering receipts, batches, rejected material, cleaning, filter service, idle time, acceptance and stock changes; record actual timestamps and grade changes. No source recipe, yield, concentration, purity, particle size, mixing time, power intensity or tolerance is adopted. Colour-test binder, titanium dioxide and barytes in the Kremer laboratory test are not constituents of this powder: if actual onsite tests use them, add their individual inputs/wastes and avoid calling the prepared product a resin dispersion."
    source_ids: []
  - rule_id: validation_rule_13
    applies_to: "foreground_dataset_conformance"
    rule: "Maintain three linked accounts. The physical ledger contains all actual external receipts, supplier/customer returns, dispatches, waste/releases and opening/closing raw powder, WIP, accepted/rejected FG, caught dust, samples, packaging and filter assets; equal internal transfers cancel only at the aggregate site boundary. The reference-event ledger independently sums unique first-acceptance events Q = sum(m_e), with event ID, original cohort, net mass and gate moisture locked once. The attributed burden ledger retains opening inherited WIP, new inputs/services, closing carried inventories and terminal assignments without overlap. Q is not an extra external physical outflow."
    source_ids: []
  - rule_id: validation_rule_14
    applies_to: "foreground_dataset_conformance"
    rule: "For each original accepted cohort, bridge Q0 to disjoint net remaining deliveries, every actual onsite accepted state, irreversible losses and other terminal dispositions, all reconciled to the original acceptance basis. Returns and loops are transfers, not a second terminal fate. Use delivered-only plus closing-new-FG only if records prove every other postgate state/exit is absent. Distinguish new acceptance from dispatch of opening FG. Do not restore lost pigment/water into surviving product and also count that loss. Any later water uptake is separately physical incoming water and is removed from original-cohort equivalents; record actual survivors and water losses separately, without manufacturing a closure term. Q zero or unknown retains raw totals and an unresolved normalized result."
    source_ids: []
  - rule_id: validation_rule_15
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile total mass and Fe/O element accounts, red/black component masses and water phases separately. In this nonreacting route no Fe oxide conversion is assumed; any oxidation or thermal alteration invalidates that assumption and requires a different reviewed process. Moisture loss is not missing oxide. Retain dust, sample and retained-on-filter quantities and uncertainties; no yield, oxide stoichiometry, dust factor or allocation share may force physical closure. Analyse actual impurity components where material."
    source_ids: []
  - rule_id: validation_rule_16
    applies_to: "foreground_dataset_conformance"
    rule: "The packaging ledger weighs incoming empty sacks, delivered tare, serviceable external returns, customer-returned sacks, scrap and opening/closing empty/filled sacks separately. Original sack genealogy prevents reused sack mass from becoming another manufacturing demand. Pigment remaining on exported packaging is a separately identified powder terminal quantity; it is not part of empty tare. Include supplier manufacture and attributable packaging service once, without giving packaging a co-product credit."
    source_ids: []
  - rule_id: validation_rule_17
    applies_to: "foreground_dataset_conformance"
    rule: "Track each polyester sleeve by actual substrate mass/count, dimensions, installation, replacement, cleaning, retained pigment, physical opening/closing fleet and export receiver. Provider demand and service share require real history and compatible provider units. Preserve original served production cohorts for later replacements; one new sleeve can remain installed across intervals without all its mass becoming current powder loss. No guessed mass, lifetime, annualization or replacement frequency is permitted. Other actual media require their own cards."
    source_ids: []
  - rule_id: validation_rule_18
    applies_to: "foreground_dataset_conformance"
    rule: "For stationary powder-dust outlets, EPA Method5 provides an isokinetic filterable-PM gravimetric procedure with probe/filter recovery, blanks, leakage checks, calibrated gas measurement, moisture/temperature conventions, constant weighing and flow/traverse dependencies (Methods1/2/3). The retained 2017 Internet copy is methodological evidence, not a current legal-compliance determination. Implement the complete applicable procedure with a competent laboratory and documented matrix/recovery checks. It does not measure fugitive emissions or all condensable PM. Assess every outlet, bypass, dry-cleaning release and fugitive pathway with actual capture/measurement evidence; an unmeasured pathway remains incomplete. No wet scrubber or sulfur-speciation protocol is imported into this nonreacting route."
    source_ids: []
  - rule_id: validation_rule_19
    applies_to: "foreground_dataset_conformance"
    rule: "For sack_scrap and spent_filter, a separately identified retained-powder terminal quantity means a nested component of the actual whole contaminated waste transfer, not another physical exchange. Weigh whole exported waste = actual dry substrate + retained pigment + water + any other measured constituent. Substrate-only fleet/service accounting never replaces whole-waste mass. Record receiver treatment demand on the whole accepted mixture and compatible provider basis. No attached-powder exchange or extra treatment demand is added unless powder is physically separated before crossing the boundary; then record the distinct separated streams and reconcile their sum without duplicate transfer. The brown_dust_waste card represents only a physically independent caught/off-spec powder stream. Actual packaging and filter waste quantities remain complete regardless of service allocation, burden shares, later replacement or original-cohort attribution. The selected AC flow uses the native Net calorific value property (reference MJ); kWh × 3.6 expresses electrical energy only and does not add an onsite fuel, burner, combustion heat or assumed upstream generation route."
    source_ids: []
  - rule_id: validation_rule_20
    applies_to: "foreground_dataset_conformance"
    rule: "For a shared spent filter or an actually shared sack-waste history, distinguish three linked records within the foregoing accounts. First, the physical transfer ledger records one whole actual contaminated export Qt, its component composition, transfer_id, receiver and the full actual provider treatment quantity and unit once. Neither that physical Qt nor the full actual receiver/provider quantity is divided into fictitious smaller physical exports by service allocation. Second, nested physical provenance records measured substrate, pigment, water and actual cohort origins only where known; an environmental service share does not prove a physical component share. Unknown physical provenance remains explicit. Third, a separate modeled treatment-demand or environmental-burden ledger assigns supported, non-overlapping amounts to the actually served original cohorts, using actual service/recipient history and compatible provider units. Only the assigned amount A_c, or its distinct assigned burden vector, is divided by that cohort’s original Q_c. The whole actual Qt/Q_c ratio may be retained for analysis but is not another modeled exchange and must not recharge the full transfer to every cohort."
    source_ids: []
  - rule_id: validation_rule_21
    applies_to: "foreground_dataset_conformance"
    rule: "If the provider accepts the actual whole mixture on a compatible mass basis and evidence supports treatment shares s_c, modeled demand may be A_c = s_c × the once-recorded total provider quantity, expressed in explicitly labelled provider kg-equivalent rather than as a claim of a physically split export. For complete covered scope, supported non-overlapping shares and assigned demands or vectors reconcile to the one actual total; retain any unassigned residual separately instead of inventing a share. If a verified provider uses another unit, preserve its conversion evidence and unit or keep a separately assigned burden vector; do not relabel it as kg. Unknown shares, served history, total provider basis or original Q_c leave the relevant modeled result unresolved while retaining all raw Qt and receiver records. Never infer a default share from cohort mass, elapsed time, replacement count, lifetime or this methodological example. A single evidenced cohort may receive its own documented demand once; this is not a default assignment. Sack waste uses shared-cohort attribution only when its actual recipient/service history establishes sharing. Physical stock, component and elemental ledgers remain independent of every modeled share."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site-specific foreground dry-premixing process after independent qualification"
  downstream_use: "secondary_dataset or background_dataset only with compatible grade/provider/basis"
  allowed_use: "Upstream supply of the declared brown red101/black11 preparation"
  excluded_use: "All34340 coverage; individual oxide synthesis; luminophores; default recipe, emission factor or product performance"
  required_metadata: "Whole mixture composition; site/route/interval; event/cohort gate; net mass/moisture; real test methods; control; provider units; packaging/assets; stocks; inheritance"
  required_quality_disclosure: "Identity/background and measurement gaps; complete physical and attributed accounts; airborne/fugitive/condensable and LCIA coverage; review/scientific/study states"
  update_trigger: "New component, route, thermal/wet step, powder state, grade, acceptance gate, provider, packaging, control or material native-record change"
