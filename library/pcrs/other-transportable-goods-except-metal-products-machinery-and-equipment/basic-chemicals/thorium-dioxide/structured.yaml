      flow_role: "paperbox"
      record_type: "meter and acceptance record"
      raw_fields: "box construction; supplier batch; measured net mass; stock receipts/issues/scrap; original packaging coverage; lot/cohort; scale calibration"
      collection_method: "Weigh actual folding paperboard boxes or use verified count times measured representative box net mass; reconcile stock issues and packaging already included upstream; keep every other packaging component separate."
      unit: "kg"
      frequency: "each lot/event and period totals"
      temporal_coverage: "same declared reporting period"
      site_scope: "selected actual supply gate and all applicable stages"
