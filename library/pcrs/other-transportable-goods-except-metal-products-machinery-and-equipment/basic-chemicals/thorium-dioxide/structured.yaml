      collection_method: "Meter actual cleaning-water supply over the matching event; record source and delivery boundary; use measured density only for the separate water-mass reconciliation. No routine positive demand is presumed."
      unit: "m3"
      frequency: "each lot/event and period totals"
      temporal_coverage: "same declared reporting period"
      site_scope: "selected actual supply gate and all applicable stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original metrology, calibration, transfers, analyses and completeness evidence"
    - protocol_id: cp_reference_product
      process_id: "gate"
      flow_role: "reference_product"
      record_type: "first acceptance ledger"
      raw_fields: "immutable lot/event id; first-acceptance time/criterion; independently measured gross/tare/net whole-product kg at that event; original acceptance basis; net D_new and linked returns; FG_new closing accepted stock; disjoint L_new loss/scrap/downgrade/use/net-return/closing rework-WIP destinations; opening raw/WIP/FG; gross transfers/retests/reacceptance; actual failed/rework services within scope; assay/moisture and measured basis conversions; uncertainty; locked Q; original cohort Q0"
      collection_method: "Use calibrated scales and independent first-acceptance records; deduplicate immutable event/lot identifiers and lock Q to their measured net masses. Reconcile complete same-cohort same-original-basis Q = D_new + FG_new + L_new, with mutually exclusive exhaustive destinations. Subtract linked returns from dispatch and locate their remaining net destination once in FG_new or actual L_new; never add gross loops or reacceptance to Q. Exclude packaging and previously accepted events from new Q; preserve separate physical stocks/external movements and original Q0."
      unit: "kg"
      frequency: "each lot/event and period totals"
      temporal_coverage: "same declared reporting period"
      site_scope: "selected actual supply gate and all applicable stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original metrology, calibration, immutable events, complete same-basis destination records, analyses and completeness evidence"
