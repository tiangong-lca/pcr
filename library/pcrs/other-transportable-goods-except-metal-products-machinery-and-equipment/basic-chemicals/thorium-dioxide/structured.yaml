      record_type: "meter and acceptance record"
      raw_fields: "submeter start/end; kWh; meter multiplier/resets; time intervals; actual supply voltage/geography; losses coverage; standby/cleaning load; causal shared driver and cohort"
      collection_method: "Read calibrated submeter over the complete gate cycle; subtract verified counter readings with multiplier/reset correction; retain actual bills and convert kWh to MJ by 3.6; apply evidenced exchange-specific allocation."
      unit: "MJ"
      frequency: "each lot/event and period totals"
      temporal_coverage: "same declared reporting period"
      site_scope: "selected actual supply gate and all applicable stages"
      aggregation_rule: "per 1 kg reference flow"
