measurement_rules:
  - id: net_product
    applies_to: "reference_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q is the sum of independently measured net whole-solid-product kg at unique first-acceptance events at this fixed gate in the period, locked to immutable original event/lot records and original acceptance basis. Reconcile Q = D_new + FG_new + L_new for the same newly accepted cohort on that same basis: net dispatch after linked returns, closing accepted FG and all other net post-acceptance destinations, including actual net returns not already in D_new/FG_new, loss, scrap, downgrade, use and closing transfer to rework/WIP. Destinations must be mutually exclusive and exhaustive; measured composition/moisture/basis changes require explicit conversions. Only evidence that all other net destinations are zero permits Q = D_new + FG_new. Later losses never lower Q; opening already accepted FG, returns, retests, reacceptance, relabeling and internal transfers add no Q. Never-accepted WIP adds no Q; previously accepted material in closing WIP belongs to L_new. cp_reference_product records Q, original Q0 and unique events. All cards use per 1 kg reference flow."
  - id: compound_element_activity
    applies_to: "reference_product, feed_tho2, waste_tho2, th232_air, th232_water"
    required_property_ref:
      name: "Mass; Radioactivity"
      uuid: ""
    required_unit: "kg; kBq"
    rule: "Whole-product mass includes measured impurities and moisture; free/structural water and assay denominator remain separate. A supply solution is not solid product; separate solute/carrier water and require distinct applicability review. Elemental thorium mass requires measured elemental assay with an explicit denominator. Product kg is not elemental kg or activity. Individual radionuclide activity requires sample fraction, date, unit, uncertainty and detection capability; do not assume daughter equilibrium. Divide Bq by 1000 for kBq."
  - id: energy_water
    applies_to: "electricity, clean_water, waste_water"
    required_property_ref:
      name: "Net calorific value; Volume; Mass"
      uuid: ""
    required_unit: "MJ; m3; kg"
    rule: "Retain raw electricity/water meters; multiply kWh by 3.6 for MJ. Convert water volume to mass using measured density at relevant temperature/composition, not a database screening density. Distinguish water demand, collected wastewater, internal circulation, stocks and actual environmental discharge."
