    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Keep complete-period raw boundary exchanges, including actual failures, rejects, rework, standby, cleaning, post-acceptance losses and zero-output intervals within the declared gate scope. Apply demonstrated exchange-specific shared drivers to burdens after preserving physical quantities. Reconcile raw/WIP/FG stocks and inherited vectors under acceptance_stock_vectors, then divide each exchange or burden assigned to the new first-accepted cohort by its original event-locked positive Q once. Old-cohort corrections retain original Q0. Later losses, return-to-WIP or reacceptance change no original denominator. The reference product is 1 kg as an event accounting coordinate, not an additional physical external output. Collection and card division denote this same final reporting operation, not a second division."
      inputs:
        - "period records"
        - Q
        - cp_site
      output: "normalized exchange"
      source_ids:
        - merck-thoria-89170
        - ef-allocation-2021
        - jrc-ilcd-lci-2010
    - id: activity_reporting
      applies_to: "th232_air, th232_water"
      rule: "Actual radionuclide released activity [kBq] divided by Q [kg]; convert Bq by division by 1000 and preserve date/sample basis and uncertainty. Individual isotope and total activity cannot double-characterize the same radiological burden."
      inputs:
        - activity
        - "matched discharge quantity"
        - Q
      output: "kBq per kg reference flow"
      source_ids:
        - epa-marlap19-2004
    - id: acceptance_stock_vectors
      applies_to: "all inventory rows"
      rule: "Q is the sum of unique independently measured first-acceptance event whole-product masses, locked on the original acceptance basis. Reconcile the exhaustive mutually exclusive same-basis D_new/FG_new/L_new bridge under acceptance_event_bridge; only independently evidenced zero other net post-acceptance destinations permits the two-term form. Preserve separate opening/closing raw/WIP/FG stocks with historical per-exchange burden vectors and original gate/product/route/state/cohort links. For each exchange e, reconcile opening inherited burden plus current attributable complete-period burden equals burden assigned to newly accepted output plus closing carried burden plus separately disclosed other-output or prior-cohort service burden. Actual failed/rework/handling/loss services within scope retain their causal burdens once. This is a burden identity, not a physical-output formula. Old FG dispatch, returns, retests, internal transfers and reacceptance neither enlarge Q nor reset inherited burdens; later losses never shrink Q. Accepted material returned to WIP carries its original event and vector. Later storage/dispatch/return services attach to the original accepted cohort and original positive Q0, never new Q. Missing inherited vectors or unresolved attribution keeps results incomplete. Zero or unevidenced Q/Q0 retains raw totals and all stocks/vectors, holds unit results and cannot borrow another denominator."
      inputs:
        - cp_reference_product
        - cp_site
        - "complete exchange totals and stock vectors"
      output: "once-only accepted cohort and conserved burden accounts"
      source_ids:
        - jrc-ilcd-lci-2010
    - id: species_balance
      applies_to: "feed_tho2, reference_product, waste_tho2, waste_water, th232_air, th232_water"
      rule: "Reconcile total material, water and elemental-thorium balances separately using measured composition and uncertainty. Do not treat thorium mass, compound mass and radionuclide activity as interchangeable. Any actual transformation outside the declared unchanged-species gate requires a separately reviewed production boundary with its actual species formation G_X and consumption C_X, supported by reaction stoichiometry and measured reaction extent; an element total or environmental allocation factor does not determine G or C. No such transformation is prescribed or assigned default quantities here."
      inputs:
        - "independent masses"
        - "measured assays"
        - cp_site
        - cp_th232_air
        - cp_th232_water
      output: "separate physical and activity reconciliations"
      source_ids:
        - epa-marlap19-2004
        - jrc-ilcd-lci-2010
    - id: acceptance_event_bridge
      applies_to: "all inventory rows"
      rule: "Lock Q to the sum of unique independently measured first-acceptance event whole-product masses. Reconcile Q = D_new + FG_new + L_new for the same cohort on the same original acceptance basis: net dispatch after linked returns, closing accepted FG and all other net post-acceptance destinations, including actual net returns/losses/scrap/downgrade/use/closing rework-WIP. The three terms must be mutually exclusive and exhaustive; put linked returned parcels in FG_new or actual L_new once, never an added gross-return term. Explicitly reconcile measured water/composition/basis changes. For 100 kg first accepted, 60 kg net dispatch, 30 kg closing FG and 10 kg loss, Q=100 kg; 100 attributed burden units/Q=1 unit/kg, whereas an incomplete 90 kg denominator gives an invalid 1.111... . Only demonstrated zero other net destinations permits the two-term bridge. Later loss/services retain original Q or Q0; internal/return/rework/reacceptance throughput adds no Q or external output. Actual event and destination evidence remains unresolved if incomplete; never assume zero loss or rewrite Q to force closure. This mass bridge does not infer isotope activity, equilibrium or releases."
      inputs:
        - cp_reference_product
        - "original acceptance events"
        - "same-basis net destination records"
        - "original cohort quantities"
      output: "auditable positive event Q and separate physical stock bridge"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "all inventory rows"
      requirement: "Species, CAS, composition, name, actual route and supply state agree; verify support references against actual property/unit chains. Identity does not establish background-basis compatibility."
      evidence: "merchant/lot originals, measured composition, provider definition and raw database metadata"
    - id: measurement_quality
      applies_to: "gate"
      requirement: "Q is independently event-measured and positive, with complete mutually exclusive same-basis D_new/FG_new/L_new destinations and explicit measured conversions. Preserve original Q0, actual failed/rework loads within scope, and separate whole-compound mass, elemental quantities, isotope activity, container and moisture records. No universal purity, yield, consumption, clean-up efficiency, emission, activity or dose."
      evidence: "cp_reference_product; cp_site; epa-marlap19-2004"
    - id: coverage_quality
      applies_to: "gate"
      requirement: "Period/site/storage duration match all relevant receipts, dispatches, stocks and monitoring. Distinguish unmeasured, below-detection, absent flows and zero. Add separate rows for other actual isotopes, particulate fractions, cleaners and container wastes; do not add nested PM bins twice or remove actual biogenic CO2 for a GHG reporting convention."
      evidence: "cp_site; actual stream and monitoring register"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_product"
    rule: "Confirm the native whole-product reference chain and exact solid-ThO2 qualifiers together; missing chemical identity cannot be replaced by another oxide, ore, element or radioactive elementary flow. A broader native identity cannot establish the required chemical or provider evidence by itself."
    source_ids:
      - merck-thoria-89170
  - rule_id: validate_balance
    applies_to: "gate"
    rule: "Both renderings use 1 kg; every row and collection aggregation uses the same event-locked cohort Q or original old-cohort Q0; exactly one reference product coordinate. Reconcile actual physical mass/water/element ledgers including opening/closing raw/WIP/FG, external dispatch/returns and actual waste/releases within measured uncertainty; disclose residuals. First acceptance and internal rework/reacceptance are not additional external outputs. Keep this storage-inclusive physical account separate from the same-acceptance-basis mass bridge and independent isotope-activity records. Measure feed, product, waste, environmental outputs and stocks independently, never derive product as feed minus assumed waste."
    source_ids:
      - epa-marlap19-2004
  - rule_id: validate_release
    applies_to: "th232_air, th232_water"
    rule: "Match isotope and compartment/subcompartment/time; use Radioactivity/kBq rather than Mass/kg. Wastewater sent to treatment is not an additional site freshwater release. Separate treatment release and retention; cross-identify PM mass and radionuclide activity ledgers to avoid duplicate radiological characterization. Missing/unknown measurements remain unresolved."
    source_ids:
      - epa-marlap19-2004
  - rule_id: validate_cohort
    applies_to: "gate"
    rule: "Check event-locked unique first-acceptance Q against independent raw event/lot records and the complete mutually exclusive same-original-basis D_new/FG_new/L_new bridge with measured conversions. Later losses cannot reduce Q; opening FG, returns/retests, transfers to WIP and reacceptance cannot increase it. Require separate raw/WIP/FG physical stocks and conserved inherited/current per-exchange burden vectors, retaining actual failed/rework/handling/loss loads within scope. Later services use original accepted cohort Q0, not new Q. Q/Q0 zero/missing, incomplete destination/event evidence, missing raw data or inherited vectors blocks unit results while preserving raw totals and reviewable gaps."
    source_ids:
      - jrc-ilcd-lci-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified supplied-gate data only after independent complete dataset acceptance; methodology authorship does not establish scientific review or dataset qualification"
  allowed_use: "Bounded civilian solid-ThO2 supply LCA; disclose gate increment separately from results including upstream coverage"
  excluded_use: "Whole-CPC proxy; other chemical/physical states; purification/separation/enrichment/fuel or weapons manufacturing; dose/safety/compliance determinations; waste-disposal service as product supply"
  required_metadata: "Manufactured single-species solid ThO2 plus CAS 1314-20-1; actual SKU/lot plus supplier and origin; immutable independently measured first-acceptance net whole-product event Q plus original Q0 and cohort links plus complete same-basis D_new/FG_new/L_new destinations and measured conversions; composition plus assay denominator plus free moisture and structural water; civilian intended use; original container/packaging plus tare; fixed receiving and manufacturer factory delivery gates plus first-acceptance criterion; native production mix at plant plus finished manufactured state; upstream manufacture/transport/packaging coverage; reporting period plus storage duration; electricity supply plus voltage; actual cleaning/incident scope; residue/waste receivers; radionuclide species plus activity unit plus sample basis plus reference date plus uncertainty and detection capability; no default purity or yield or recipe or energy intensity or activity"
  required_quality_disclosure: "identity gaps; upstream/site coverage; uncertainty/detection capability; attribution drivers; background property/quantity bases; physical and burden-ledger completeness"
  update_trigger: "Changed species/supply state/actual route, provider or background definition; additional actual streams/monitoring; reference-UUID resolution; source/boundary/attribution revision"
