  reference_identity: "Native state100 Product N-Methyl-2-pyrrolidone (NMP), CAS872-50-4, is a whole liquid five-membered lactam; no hard route, provider or composition restriction. Native reference property0 is Mass with verified mass unit-group and kg reference. Native EN/ZH baseName is preserved. Actual supply gate, grade, water and impurity composition and selected supplier reference basis remain mandatory study qualifiers."
  native_classification_debt: "Native CPC35499 does not establish scope. Current CPC3.0 35220 explicitly includes cyclic amides and is substantive contrary evidence, alongside the specified35230 ring families. Actual five-membered NMP lactam identity and HS2022 2933.79 plus Chapter29 Note3 later-heading precedence support assessment under2933 rather than general carboxyamide2924. Historical HS2017 2933.79 to CPC2.1 34160 is historical corroboration only, not current3.0 correspondence. Current residual34160 applicability, competing35220/35230 scope and whole-product sources remain independently reviewable; no authoritative product ruling or accepted mapping is established by this draft."
  source_limits: "Patent is a historical configuration not an operating recipe; EPA2017 is historical qualitative corroboration, BASF specialty grade is counterevidence against universal grade defaults. CWW/ILCD are horizontal methods. No source operating ratio, yield, emission factor, density, removal efficiency or dose is a default."
  foreground_protocol_synthesis: "Authoritative Q is the sum of unique measured first-acceptance event masses locked on one acceptance basis. Disjoint signed net D_new plus closing FG_new plus every other post-acceptance net disposition L_new reconciles that Q; dispatch plus FG alone applies only if other net post-gate dispositions are zero. Loss cannot erase accepted production; returns/retests/gross loops cannot create it. Q is not another physical external output. Raw/WIP/FG physical ledgers and own-foreground inherited exchange vectors are separate from environmental allocation and provider-embedded history; each is carried once without double counting linked aggregate inputs and expanded upstream stages. Later old-cohort services use original Q0; unknown Q0 remains raw. Conserved mass/elements stay separate from actual reactive species G/C including generated water and NaOH-side chemistry, and from environmental burden shares."
