      collection_method: "Reconcile calibrated receipts/issues and each actual transfer; representative whole-stream composition sampling. Measure opening and closing raw/WIP physical quantities and inherited per-exchange quantities and burden vectors; internal pairs must agree."
      unit: "kg"
      frequency: "Every lot and continuous meter; reconcile each period"
      temporal_coverage: "One representative complete period covering start/stop, off-spec recovery and cleaning"
      site_scope: "Declared plant and all nmp_unit stages/controls"
