      collection_method: "Weigh and assay the whole exported solution, prove actual useful destination, and distinguish export, recycle and disposal. Keep unallocated physical output separately from co-function burden allocation."
      unit: "kg"
      frequency: "Every lot and continuous meter; reconcile each period"
      temporal_coverage: "One representative complete period covering start/stop, off-spec recovery and cleaning"
