  calculation_rules:
    - id: normalize_cohort
      applies_to: "all inventory rows"
      rule: "For measured event-locked Q>0 divide actual site exchanges attributable to that first-accepted cohort by Q, preserving numerator units, all post-acceptance losses and services within the declared scope. Carry documented own-foreground raw/WIP per-exchange vectors from earlier periods once and add current incremental site operations once. Separate provider-embedded upstream historical burdens from those own-foreground vectors: represent a provider as either the linked aggregate input dataset or non-overlapping expanded upstream stages, never both. Preserve separately allocated environmental vectors and the unallocated physical ledger; do not shrink co-product mass by a burden share. accepted_nmp = 1 kg is the normalized reference coordinate, not an additional physical external output. Purchase date, dispatch timing and residual available stock never redefine Q."
      inputs:
        - cp_reference
        - cp_material
        - cp_utility
        - cp_outputs
        - cp_waste
        - cp_release
      output: "Amounts per 1 kg reference flow"
      source_ids:
        - jrc-ilcd-general-2010
    - id: acceptance_event_bridge
      applies_to: "nmp_unit"
      rule: "Q = sum of unique first-acceptance event masses measured and locked on the stated whole-product acceptance basis. The general cross-check is Q = D_new + FG_new + L_new, with mutually exclusive signed net custody/stock/destination records on that same basis and zero opening stock of this newly first-accepted cohort; reconcile composition/moisture and other basis changes from measured data. D_new is net accepted dispatch after linked returns, FG_new is closing accepted FG, and L_new is every other net post-acceptance disposition including actual loss/use/downgrade/waste and closing rework/WIP transfer. A 100 kg acceptance with 60 kg net dispatch, 30 kg closing FG and 10 kg loss retains Q=100 kg, not90 kg. Internal gross loops, return/retest events and acceptance itself are not extra physical external outputs. An unexplained residual remains unresolved; never set loss to zero or recalculate Q to force closure."
      inputs:
        - cp_reference
        - cp_material
        - cp_outputs
        - cp_waste
        - cp_release
      output: "Locked Q and complete acceptance/stock/destination reconciliation"
      source_ids:
        - jrc-ilcd-general-2010
    - id: stocks_and_services
      applies_to: "nmp_unit"
      rule: "Reconcile actual opening raw/WIP/FG plus receipts and physical production with actual external outputs, consumption, loss, waste and closing stocks by stock class and immutable cohort; internal transfers cancel only once in the aggregate ledger. Lock original accepted Q/Q0 and preserve unallocated whole physical/component/species quantities separately from attributed burden vectors. Every raw/WIP transfer carries its own prior foreground exchange vector once; any supplier background already included in its linked provider is not added again as a separate historical site vector. Post-acceptance return, storage, rework or retest is an incremental service of that original accepted cohort divided by original Q0, with actual losses retained. Unknown Q0 permits a raw correction only. Never add old FG/returns/reacceptance to new Q, allocate their services to current Q, or count both acceptance and dispatch as separate external physical output."
      inputs:
        - cp_reference
        - cp_material
        - cp_utility
        - cp_outputs
        - cp_waste
      output: "Cohort stock and service ledgers"
      source_ids:
        - jrc-ilcd-general-2010
    - id: reaction_balance
      applies_to: "nmp_unit"
      rule: "For total mass and conserved elemental C/H/N/O/Na check inputs + opening stocks = external outputs + closing stocks, with paired internal links cancelling and uncertainty disclosed. For every reactive species X use opening X + inputs X + actual G_X = outputs X + closing X + actual C_X. The net GBL + MMA to NMP + water chemistry has molecular equation C4H6O2 + CH5N = C5H9NO + H2O; establish actual reaction extent from assay and fates, not a prescribed yield. NaOH-assisted GBL conversion, side reactions, salts and oligomers require actual measured species/stoichiometry. Never conserve water, GBL or MMA as if inert; unexplained residual stays a finding, not invented emission."
      inputs:
        - cp_material
        - cp_reference
        - cp_outputs
        - cp_waste
        - cp_release
      output: "Unallocated mass/element/species ledgers"
      source_ids:
        - basf-nmp-process-2007
        - epa-nmp-scope-2017
        - jrc-cww-2016
    - id: utility_and_release
      applies_to: "nmp_unit"
      rule: "Calculate net steam heat as imported kg times supply enthalpy minus returned kg times return enthalpy on one datum; convert kJ/1000 to MJ. Preserve physical water separately and follow actual provider gross/net basis, avoiding a second heat credit. For releases integrate species concentration times compatible measured flow and operating time; distinguish wet/dry gas, aerosol and censored results. Divide cohort-attributable totals by its accepted quantity; do not impose default density or removal factor."
      inputs:
        - cp_utility
        - cp_release
        - cp_reference
      output: "Heat/water and final species exchanges"
      source_ids:
        - jrc-cww-2016
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Match actual whole product/reagent/waste/elementary identity, state, composition, property/unit and provider reference. NMP and DMSO share solvent uses but never identity; pure MMA cannot stand for exported aqueous solution. Unresolved ordinary UUIDs/providers remain explicit gaps."
      evidence: "Native direct reads, supplier assay and delivery/receiver records"
    - id: quality_methods
      applies_to: "nmp_unit"
      requirement: "Retain actual stage completeness, feed impurity conversion, water generation, recycle and treatment fates, calibration and representative abnormal-state coverage. Patent examples and commercial specialty grades are not generic activity parameters, efficiencies or purity targets."
      evidence: "basf-nmp-process-2007; epa-nmp-scope-2017; basf-nmp-product; jrc-cww-2016"
    - id: quality_cohorts
      applies_to: "cp_reference"
      requirement: "Prove event-locked unique first-acceptance Q, the disjoint same-basis D_new/FG_new/L_new bridge and all post-acceptance physical losses; carry raw/WIP/FG own-foreground vectors once without duplicating provider-embedded upstream history. Retain old-service original Q0, non-detects, unknown original denominator, analytical uncertainty, missing species and allocation sensitivity as explicit study gaps."
      evidence: "Lot reconciliation, measurement and missing-data register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "accepted_nmp"
    rule: "Require exactly one final unformulated liquid NMP product output with verified mass chain and all qualifiers. Reject DMSO, another lactam, recovered spent-solvent blend, formulation, elementary flow or component-only assay mass as reference."
    source_ids:
      - basf-nmp-process-2007
      - epa-nmp-scope-2017
  - rule_id: validate_quantity
    applies_to: "all inventory rows"
    rule: "Require finite actual quantities, measured immutable Q>0, one acceptance basis and equivalent bilingual1kg reference. Check every first-acceptance event, net dispatch/return/FG/other-loss bridge, raw/WIP/FG physical and own-foreground vectors, non-overlap with provider background, old-service Q0 and compatible conversions. Loss after acceptance cannot lower Q; gross loops/returns/retests cannot raise it. Q=0 or unknown retains raw records only; normalization never replaces physical ledger outputs."
    source_ids:
      - jrc-ilcd-general-2010
  - rule_id: validate_chemistry
    applies_to: "nmp_unit"
    rule: "Check unallocated mass/elements separately from reactive species G/C and water generation/consumption. Verify recycle pairs, each physical destination, whole-solution export vs pure component, actual purification salts and post-control releases; no invented residual or universal yield."
    source_ids:
      - basf-nmp-process-2007
      - epa-nmp-scope-2017
      - jrc-cww-2016
  - rule_id: validate_allocation
    applies_to: "nmp_unit"
    rule: "Check genuine useful functions, subdivision then determining physical causality and disclosed residual value shares; retain full physical mass and original-cohort vectors. Captured vent, wastewater, condensate and internal recycle receive no automatic co-product share or avoided-product credit."
    source_ids:
      - jrc-ilcd-general-2010
  - rule_id: validate_completeness
    applies_to: "nmp_unit"
    rule: "Study completion requires actual source/receiver-specific inventory, provider bases, raw evidence and all added on-site controls/packaging/cleaning/release species. Structural or measurement success does not establish methodology approval, translation review or a qualified plant dataset."
    source_ids:
      - jrc-cww-2016
      - jrc-ilcd-general-2010
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared fresh GBL/anhydrous-MMA route to unformulated bulk NMP with compatible supplier/treatment links and actual grade/gate"
  excluded_use: "Universal CPC34160 or NMP production mix; recovered solvent; deliberate formulations; mixed amines; catalyst routes; automatic qualified study or comparative assertion"
  required_metadata: "All reference qualifiers; stage boundaries; actual feed/purification compositions; upstream readiness; final outlets/receivers; stock/cohort/Q/Q0 vectors; allocation and provider pins"
  required_quality_disclosure: "Identity/provider gaps, native classification debt, actual period/coverage, measured uncertainty, censored releases, species/stock closure and allocation sensitivity; separate review/science/study states"
  update_trigger: "Change of feed route/state/composition, synthesis/purification/control, grade/gate, co-product use, stock/service assignment or provider convention"
data_sources:
  - id: "basf-nmp-process-2007"
    type: "literature"
    reference: "BASF, US7227029B2, Method for the continuous production of N-methyl-2-pyrrolidone, 2007-06-05; https://patents.google.com/patent/US7227029B2/en"
    used_for: "Description paragraphs on liquid GBL/MMA reaction, amine/water recovery, conditional NaOH work-up, NMP side draw and recycle. Historical qualitative configuration only; no example operating parameters, assay/GC area percent, yield or additive rate is adopted."
  - id: "epa-nmp-scope-2017"
    type: "official_guidance"
    reference: "US EPA, Scope of the Risk Evaluation for N-Methylpyrrolidone, EPA-740-R1-7005, June2017, AppendixB pp58–59; https://www.epa.gov/sites/default/files/2017-06/documents/nmp_scope_6-22-17_0.pdf"
    used_for: "Qualitative GBL/MMA ring-opening, cyclisation/dehydration and distillation corroboration; alternative aqueous/integrated routes and recycling counterevidence. Historical preliminary compilation, not a yield/emission default or current regulatory/health determination."
  - id: "basf-nmp-product"
    type: "literature"
    reference: "BASF, N-Methylpyrrolidone Life Science commercial product page, snapshot2026-11-08; https://products.basf.com/global/en/ci/n-methylpyrrolidone-life-scien"
    used_for: "Actual CAS872-50-4 commercial product, bulk supply and specialty grade differentiation; no manufacturer purity/low-amine/water value promoted to a universal grade or route default."
  - id: "jrc-cww-2016"
    type: "official_guidance"
    reference: "European Commission JRC, Common Waste Water and Waste Gas Treatment/Management Systems in the Chemical Sector, 2016, JRC103096, BAT2–4 pp543–544/PDF573–574; https://publications.jrc.ec.europa.eu/repository/bitstream/JRC103096/jrc103096_cww_bref_10_2016.pdf"
    used_for: "Horizontal chemical-stream inventory, reaction/side-product flow sheets and source-specific water/gas monitoring. Not NMP-specific factors or legal emission limits; actual atomic exchanges and measurement remain foreground requirements."
  - id: "jrc-ilcd-general-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA Detailed guidance, first edition March2010, §§7.9.2–7.9.3 pp255–264/PDF275–284; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision, determining flow-specific physical causality and residual exit-value allocation. Q/Q0, first acceptance, stock/vector and later-service rules are explicit PCR foreground protocol synthesis, not quoted ILCD factory formulas."
  - id: "unsd-cpc-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version3.0 Structure and Explanatory Notes, 30June2025, subclasses34160,35220 and35230; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Current category and competing35220 cyclic-amide/35230 ring-family boundaries, including actual contrary evidence; no automatic current HS correspondence, product ruling or positive mapping acceptance."
  - id: "wco-hs29-2022"
    type: "official_guidance"
    reference: "WCO, HS2022 Chapter29, Notes1/2/3/7, headings2924 and2933, other lactams2933.79; https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0629_2022e.pdf?la=en"
    used_for: "Specific lactam2933.79 and Chapter29 Note3 later-heading precedence over general carboxyamide2924 where competing headings apply; separate-compound and specified-ring/preparation boundary context. No automatic current CPC correspondence or authoritative customs product ruling."
