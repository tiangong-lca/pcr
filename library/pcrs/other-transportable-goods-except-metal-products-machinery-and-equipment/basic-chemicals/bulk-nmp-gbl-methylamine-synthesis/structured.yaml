      collection_method: "Calibrated net scale or tank gauge plus measured temperature-compatible density, validated chromatography/water analysis and immutable event/lot records. Lock authoritative Q to the sum of unique measured first-acceptance event masses on one acceptance basis. Reconcile, do not redefine, Q using disjoint net D_new + FG_new + L_new on that same basis: net dispatch is corrected for linked returns; L_new retains all other net post-acceptance loss/use/downgrade/waste or closing transfer into rework/WIP. Internal gross loops and reacceptance do not create Q. D_new+FG_new alone is valid only when every other post-acceptance net disposition is zero. Opening FG and old returns retain original Q0; zero/unknown Q supports raw records only."
      unit: "kg"
      frequency: "Every lot and continuous meter; reconcile each period"
      temporal_coverage: "One representative complete period covering start/stop, off-spec recovery and cleaning"
      site_scope: "Declared plant and all nmp_unit stages/controls"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, assay validation, sample custody, stock linkage, detection limits and uncertainty"
    - protocol_id: cp_material
