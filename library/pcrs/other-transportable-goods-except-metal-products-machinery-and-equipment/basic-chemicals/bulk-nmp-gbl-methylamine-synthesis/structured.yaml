allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "nmp_unit"
    rule: "Keep whole unallocated physical streams first. Subdivide or virtually subdivide dedicated synthesis, amine export conditioning, refining, storage and treatment services using actual meters. Water formation, internal amine recycle, returned condensate and discarded residue have no assumed saleable co-product share."
    source_ids:
      - jrc-ilcd-general-2010
  - rule_id: allocation_causality
    applies_to: "nmp_unit"
    rule: "For genuine inseparable useful exported co-products, test flow-specific determining physical causality from measured operation response. Total mass, contained nitrogen and heat value are not universal allocation keys. Assign embodied reactant burdens only through a supported chemical/physical fate; never allocate the full methylamine input solely by sales names."
    source_ids:
      - jrc-ilcd-general-2010
  - rule_id: allocation_residual
    applies_to: "nmp_unit"
    rule: "For remaining joint environmental burdens in an attributional study, disclose same-period separation-gate values and use a_i=m_i*p_i/sum(m_j*p_j) for actual useful functions, after causality/subdivision. Align currency and physical grade/state, test price sensitivity; unknown or nonpositive values require review. Preserve full output mass/species ledgers independently of burden shares. No simultaneous avoided-product credit; waste treatment remains with its causing service."
    source_ids:
      - jrc-ilcd-general-2010
