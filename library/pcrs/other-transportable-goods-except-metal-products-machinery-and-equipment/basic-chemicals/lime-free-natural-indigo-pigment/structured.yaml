    applies_to: "finished_pigment"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain separate whole-product, dry-matter and indigotin records on the same sample. m_indigotin = m_product × dry_fraction × assay_dry; wet-basis assay receives no second dry-fraction factor. This indicator never replaces the reference quantity."
