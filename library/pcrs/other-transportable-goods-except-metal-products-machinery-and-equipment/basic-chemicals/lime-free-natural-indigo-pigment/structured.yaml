system_boundary:
  rules:
    - rule_id: boundary_stages
      applies_to: "all inventory rows"
      rule: "Include leaf rinse/steeping, precursor hydrolysis, biomass removal, air oxidation, settling/filtration, pigment washing, electric drying, grinding, packing, cleaning, captures and pre-transfer treatment. Maintain stage-linked flow and time records. Crop production and purchased inputs retain upstream burdens. ."
      source_ids:
        - hartl-indigo-2024
        - dutta-indigo-2017
        - teanglum-indigo-wash-2012
    - rule_id: boundary_actual_exchanges
      applies_to: "all inventory rows"
      rule: "Record every actual external exchange separately. The cards below are scoped requirements, not permission to omit other actual materials or emissions. A direct liquid discharge, fuel-fired heat, solvent purification or lime addition requires distinct atomic rows, identity and scope review before a dataset is complete. Internal liquor, cloth reuse and powder returns cross no external boundary. ."
      source_ids:
        - eu-cww-2016
    - rule_id: boundary_gate
      applies_to: "all inventory rows"
      rule: "First acceptance follows final washing, drying and actual grade checks. Lock each acceptance event mass, lot and genealogy once. Q is not an additional physical output to be added to dispatch or closing stock. Reworked or returned material already accepted never generates another Q event."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Receipt of fresh species-identified Indigofera biomass with upstream burden evidence; foreground begins with rinsing and steeping"
  starting_condition_role: "Physical foreground collection start, not a burden-free cut-off"
  product_classification_scope: "CPC 3.0 34320; narrower"
  recursive_input_rule: "Purchased same-category indigo is outside this leaf-to-pigment route; identify provider, composition and upstream history separately and review another boundary, without treating it as fresh biomass or new first acceptance. Internal returns retain original lot identity."
  upstream_dataset_requirement: "Compatible datasets for crop cultivation/harvest/transport, electricity, water, cloth and each actual packaging or reagent; missing burdens are not zero"
  disclosure: "Declare species, composition, substages, stocks, internal reuse, shared utilities, treatment location and all exclusions; incompatible boundaries stop applicability"
