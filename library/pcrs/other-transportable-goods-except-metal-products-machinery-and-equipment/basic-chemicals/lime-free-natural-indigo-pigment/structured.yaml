          name: "Biogenic carbon dioxide to air"
          flow_type: "elementary"
          property_unit: "Mass / kg"
          description: "Conditional actual fermentation/respiration emission; measure carbon species and biogenic origin. Do not force unmeasured plant carbon into CO2 or infer zero from lack of monitoring; add actual CH4 or other gases as separate cards where observed."
          amount:
            expression: "Measured genealogy-attributed quantity per 1 kg reference flow."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "process_output"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_species
              source_ids:
                - eu-cww-2016
            ranges: []
allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "all inventory rows"
    rule: "First separate measured crop-independent/shared-facility activities and direct pigment operations. If spent biomass has a demonstrated co-product function, investigate subdivision or system expansion before physical causal allocation; document why any economic allocation is needed, the same-period quantities/prices and sensitivity. No fixed split, automatic fertiliser displacement or carbon-neutrality claim is supplied. Apply the hierarchy as general method guidance, without claiming complete PEF compliance ."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical_ledger
    applies_to: "all inventory rows"
    rule: "Preserve unallocated external exchanges, raw/WIP/finished stocks and elemental balances. Allocation changes burden vectors only, never measured mass, water, carbon or Q. Waste remains a treatment obligation; sale price does not turn a disposal service into a co-product. All shares of any allocated burden must sum to one."
    source_ids: []
  - rule_id: allocation_history
    applies_to: "all inventory rows"
    rule: "Preserve raw-material, liquor, wet-cake and finished-pigment lot quantities and their accumulated burden vectors at opening/closing. Imported stocks carry actual prior upstream history. Rework, repeated washing and internal transfers add incremental service to the original lot without erasing inherited burden or creating another acceptance. Old-cohort storage, repacking or repair is reported against its locked original Q; it cannot be normalised using the new cohort Q."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "leaf_to_pigment"
      flow_role: "finished_pigment"
      record_type: "Independent first acceptance"
      raw_fields: "event id; original lot and split/merge genealogy; date; separate bag/liner tare; net pigment mass; moisture; wet/dry assay; acceptance result; outbound consignment and packaging delivery kg linked to cp_packaging"
      collection_method: "Weigh final whole commodity on calibrated scales and bind quality release; deduplicate and lock unique events, independently of dispatch or stock differences"
      unit: "kg"
      frequency: "Each first acceptance"
      temporal_coverage: "Same cohort and stock period, including start/stop and old-cohort service"
      site_scope: "Complete foreground stages and actual shared services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, signed records, genealogy and assay method"
    - protocol_id: cp_materials
      process_id: "leaf_to_pigment"
      flow_role: "fresh_biomass; process_water; cotton_cloth; paper_bag; pe_liner; cleaning_naoh; neutralisation_hcl"
      record_type: "Stage-specific external input and stocks"
      raw_fields: "lot; raw receipts/issues; species; moisture; reagent strength; water meters; each packaging tare/receipts/dispatch/returns/scrap/stocks; full unused/in-service cloth fleet; opening/closing physical quantities and non-overlapping burden-source boundaries"
      collection_method: "Weigh, submeter and reconcile supplier records; distinguish raw receipts from already stock-corrected consumption and correct once only; track liquid, wet cake and biomass stocks by stage"
      unit: "kg"
      frequency: "Each batch and stock cut-off"
      temporal_coverage: "Same cohort and stock period, including start/stop and old-cohort service"
      site_scope: "Complete foreground stages and actual shared services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scales/meter calibration, species voucher, composition, upstream provider and transfer records"
    - protocol_id: cp_energy
      process_id: "leaf_to_pigment"
      flow_role: "electricity"
      record_type: "Electric meters and service attribution"
      raw_fields: "meter; kWh start/end; substage; equipment hours; mode; lot; new/old cohort; shared split"
      collection_method: "Submeter electric heaters, pumps, dryer, grinder and cleaning; assign new/old lots using measured service drivers rather than current dispatch"
      unit: "MJ"
      frequency: "Continuous meters with batch attribution"
      temporal_coverage: "Same cohort and stock period, including start/stop and old-cohort service"
      site_scope: "Complete foreground stages and actual shared services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, equipment/downtime records and complete shared splits"
    - protocol_id: cp_residues
      process_id: "leaf_to_pigment"
      flow_role: "spent_leaf_coproduct; spent_leaf_waste; process_wastewater; spent_cloth; pigment_fines_waste; paper_scrap; film_scrap"
      record_type: "Physical residues and destinations"
      raw_fields: "stream/stage; wet/dry mass; composition; destination; transfer; product/waste status; returns; new/old cohort"
      collection_method: "Weigh or convert metered liquid using evidenced density; reconcile individual treatment receipts; label coproduct, waste and internal return portions disjointly"
      unit: "kg"
      frequency: "Each batch and transfer"
      temporal_coverage: "Same cohort and stock period, including start/stop and old-cohort service"
      site_scope: "Complete foreground stages and actual shared services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Transfer records, sampling, moisture, actual product function and status evidence"
    - protocol_id: cp_emissions
      process_id: "leaf_to_pigment"
      flow_role: "pm_fine; pm_coarse; pm_large; water_vapour"
      record_type: "Post-control emission monitoring"
      raw_fields: "outlet; gas flow; temperature/pressure; wet/dry basis; particle bin; concentration; hours; ambient humidity; condensate; captures"
      collection_method: "Measure outlets and fugitives by mode; maintain disjoint particle bins; water closure separates ambient humidity, net evaporation and condensate"
      unit: "kg"
      frequency: "Continuous or representative tests covering each mode"
      temporal_coverage: "Same cohort and stock period, including start/stop and old-cohort service"
      site_scope: "Complete foreground stages and actual shared services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Detection limits, sampling recovery, control bypass and uncertainty"
    - protocol_id: cp_species
      process_id: "leaf_to_pigment"
      flow_role: "oxygen_uptake; biogenic_co2"
      record_type: "Species reaction and conserved-quantity ledgers"
      raw_fields: "gas inlet/outlet flow and composition; precursors; indigotin; indirubin; glucose; dissolved organic carbon; C/N elements; water; stocks; reaction extent"
      collection_method: "Use compatible gas and chemical analysis bases; distinguish species generation/consumption from total-mass and elemental conservation; never treat COD as mass"
      unit: "kg"
      frequency: "Each batch with representative sampling by mode"
      temporal_coverage: "Same cohort and stock period, including start/stop and old-cohort service"
      site_scope: "Complete foreground stages and actual shared services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Standard calibration, method selectivity, representativeness, stoichiometric basis and elemental closure"
    - protocol_id: cp_packaging
      process_id: "leaf_to_pigment"
      flow_role: "paper_bag; pe_liner; delivered_paper_bag; delivered_pe_liner; paper_scrap; film_scrap"
      record_type: "Whole-packaging physical transfer and stock"
      raw_fields: "component; original cohort; raw supplier receipts; opening/closing unused and filled package mass; measured item tare; gross dispatch with pigment; actual customer returns; supplier returns; actual scrap; re-dispatch events"
      collection_method: "Weigh each consignment or multiply evidenced counts by measured tare, reconcile stocks and pigment dispatches; do not scale full dispatched kg by a service share. Actual customer returns need separate inbound transfer cards, not erasure from outward physical cards"
      unit: "kg"
      frequency: "Each receipt/dispatch/return and stock cut-off"
      temporal_coverage: "Same period with original and old cohorts retained"
      site_scope: "All actual packaging"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, tare, receipts/dispatch/return documents and stock locations"
    - protocol_id: cp_cloth_service
      process_id: "leaf_to_pigment"
      flow_role: "cotton_cloth; spent_cloth"
      record_type: "Separate cloth physical and environmental-service ledgers"
      raw_fields: "cloth item/lot id; full-period new receipts; unused/in-service opening/closing dry mass; external returns; actual discard; retained liquor/solid; evidenced stage use; original cohort Q; historical burden source and boundary"
      collection_method: "Reconcile full cotton mass and waste destinations by item/lot; separately assign environmental service using measured use. Linked aggregate supplier processes and expanded embedded upstream history are alternative representations of the same boundary, never additive manufacturing burdens"
      unit: "kg"
      frequency: "Each batch use, actual replacement/discard and stock cut-off"
      temporal_coverage: "Complete cloth fleet and all affected new/old cohorts"
      site_scope: "Whole physical fleet and separate environmental-service vector"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Purchase, calibration, wet/dry composition, use records, original Q and supplier boundary"
  calculation_rules:
    - id: cohort_normalisation
      applies_to: "all inventory rows"
      rule: "Q = sum(m_first,e) over unique first-acceptance events e; Q > 0. a_i = A_i,new / Q. A_i,new includes losses and post-gate service attributable to this accepted cohort; quantities and inherited burdens for unaccepted WIP remain with WIP, not the accepted cohort. Report old-cohort A_i,old / Q_old using its original locked Q_old. Reference output is 1 kg; never add Q as another raw output."
      inputs:
        - cp_acceptance
        - "attributed exchange A_i"
        - "cohort genealogy"
      output: "Amount per reference flow and separate old-cohort service"
      source_ids: []
    - id: acceptance_state_bridge
      applies_to: "finished_pigment"
      rule: "Check independently measured Q against Q = D_new + S_new + L_new + X_new: net externally retained delivery D_new, all disjoint on-site post-gate stocks S_new (finished, returned inspection, rework etc.), irreversible loss L_new and other terminal disposition X_new, all on original acceptance mass basis. Only with L_new = X_new = 0 and no other post-gate state is Q = D_new + FG_close,new valid."
      inputs:
        - cp_acceptance
        - "event genealogy"
        - "final states"
      output: "Reconciliation residual, never Q definition"
      source_ids: []
    - id: raw_and_burden_stocks
      applies_to: "all inventory rows"
      rule: "From raw receipts, net external consumption = opening + receipts - closing - external_returns; never stock-correct a source already reporting net consumption. Trace to newly accepted output, unaccepted WIP, loss and other destinations by lot genealogy; carry physical and accumulated burden vectors separately, including inherited upstream burdens."
      inputs:
        - cp_materials
        - cp_residues
        - "stock quantities"
        - "burden history"
      output: "Stage physical closure and attributable burdens"
      source_ids: []
    - id: species_and_conservation
      applies_to: "all inventory rows"
      rule: "For each species X: I_X + G_X = O_X + deltaStock_X + C_X. Establish G_X/C_X from supported stoichiometry and extent or measured transformations, never fitted invented factors. The principal reaction is 2 C8H7NO (indoxyl) + O2 → C16H10N2O2 (indigotin) + 2 H2O; account separately for side reactions and fermentation. Reconcile total mass, C/N elements, water and energy separately; reacting species are not individually conserved."
      inputs:
        - cp_species
        - assays
        - "reaction extents"
        - "gas/liquid/solid inventories"
      output: "Separate species and conserved-quantity residuals"
      source_ids:
        - dutta-indigo-2017
        - eu-cww-2016
    - id: packaging_stock_bridge
      applies_to: "paper_bag; pe_liner; delivered_paper_bag; delivered_pe_liner; paper_scrap; film_scrap"
      rule: "For each packaging component: P_open + P_receipts + P_customer_returns = P_close + P_dispatch_gross + P_scrap + P_supplier_returns. Equivalently, with net delivery D_P = P_dispatch_gross - P_customer_returns, P_open + P_receipts = P_close + D_P + P_scrap + P_supplier_returns; never add customer returns again in the net equation. Opening/closing stocks include unused and filled packages. Keep full outward physical kg and actual inbound returns; re-dispatch creates no new purchase or manufacturing demand."
      inputs:
        - cp_packaging
        - cp_acceptance
        - "physical receipt/dispatch/return/stocks"
      output: "Per-component physical residual and separate net-delivery bridge, without changing pigment Q"
      source_ids: []
    - id: cloth_representation
      applies_to: "cotton_cloth; spent_cloth"
      rule: "Keep full-fleet physical quantities separate from environmental-service vectors: C_open + C_new_receipts = C_close + C_external_returns + C_dry_discard; in-service cloth remains stock, with measured retained liquor/solids added only to its actual waste composition, never duplicate cotton mass. Only environmental cloth/treatment service vectors are assigned by evidenced cohort use and divided by original Q. Never scale physical discard, assume a lifetime or add the same manufacturing burden as both aggregate supplier demand and embedded history."
      inputs:
        - cp_cloth_service
        - cp_materials
        - cp_residues
        - "supplier and historical boundaries"
      output: "Full-fleet physical closure, separate cohort service and non-overlapping upstream burdens"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "finished_pigment"
      requirement: "Prove no lime/carrier, whole natural commodity and correct species; disclose actual assay method and composition. Do not copy native Chinese precursor mistranslations as chemistry."
      evidence: "Recipe, batch specification, voucher, sampling and analysis"
    - id: dq_evidence
      applies_to: "all inventory rows"
      requirement: "Source process/analytical cases cannot replace site measurement; no default water ratio, yield, dryer duty, assay, emission or allocation factor."
      evidence: "Primary original conditions and site records"
    - id: dq_closure
      applies_to: "all inventory rows"
      requirement: "Trace raw, stock, conversion and allocation ledgers; declare site-justified tolerances and instrument uncertainty beforehand; investigate exceedances without a generic closure allowance."
      evidence: "Calibration, genealogy, balance residuals and resolution"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Preserve missing measurements, unconfirmed identities and unknown treatment/providers as gaps; not_applicable requires physical absence evidence, never zero-filled missing data."
      evidence: "Exchange audit, method scope, monitoring and provider chain"
validation_rules:
  - rule_id: validate_reference
    applies_to: "all inventory rows"
    rule: "Verify whole product and mandatory qualifiers, correct natural route and first-acceptance gate. Stop applicability for lime/carrier blends, crude liquids or other species; never substitute pure indigotin mass for whole pigment mass."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Require independent finite Q > 0, unique acceptance event identities, calibrated net masses, compatible assay bases and 1 kg reference normalisation. A passing dimensional check does not establish measured factory data or scientific approval."
    source_ids: []
  - rule_id: validate_states
    applies_to: "all inventory rows"
    rule: "Verify disjoint new/old cohort states and post-gate L/X on the locked original basis. Reject Q inferred from shipments, omitted post-gate losses, gross-return summations, repeated acceptance, extra Q physical output or old-cohort services divided by new Q."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "all inventory rows"
    rule: "Review raw/WIP/finished physical and burden stocks, upstream history and stage mass/C/N/water/energy closure. Review supported species G_X/C_X and side reactions separately. Reject false conservation of indican, indoxyl or indigotin, duplicated whole-stream/components, COD mass and invented residual-balancing inputs."
    source_ids: []
  - rule_id: validate_actual_inventory
    applies_to: "all inventory rows"
    rule: "Every actual water, electric/heat/fuel carrier, cleaning chemical, packaging component, waste and emission has an atomic row, measured amount, appropriate source/compartment and provider basis. Other actual exchanges require added cards. Native UUID gaps or missing empirical amounts leave the concrete dataset incomplete and prevent qualification."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "all inventory rows"
    rule: "Check coproduct evidence, treatment burdens, justified hierarchy, unity of burden shares and unchanged physical ledgers; no undocumented avoided-burden credit."
    source_ids: []
  - rule_id: validate_language_evidence
    applies_to: "all inventory rows"
    rule: "EN/ZH share rules, rows, quantities and source fields. Preserve exact official Chinese flow baseNames for confirmed UUIDs. Data sources support only their declared use, not transferred numeric recipes or readiness."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Downstream dyeing or pigment-supply modelling with complete evidence and compatible specification, preserving natural route and whole-commodity composition"
  excluded_use: "Whole classification-leaf representation, pure-indigotin or generic colour-strength equivalence, paste/formulation substitution, cosmetic/medical safety, carbon neutrality or scientific-approval claims"
  required_metadata: "All qualifiers; raw Q acceptance; new/old cohort genealogy; stocks and burden history; actual providers, treatments and allocation"
  required_quality_disclosure: "Sampling/instrument uncertainty, scope coverage, identity/quantity gaps, source limitations and balance residuals"
  update_trigger: "Change in species, additives, route, drying energy, commodity composition, acceptance gate, provider or treatment"
data_sources:
  - id: "hartl-indigo-2024"
    type: "literature"
    reference: "Hartl, A.; Polleichtner, A.; Novak, J. (2024). “Purplish Blue” or “Greenish Grey”? Indigo Qualities and Extraction Yields from Six Species. Plants 13(7), 918. https://doi.org/10.3390/plants13070918 ; sections 1, 3, 4.1.3 and 4.3"
    used_for: "Whole natural pigment, counterevidence on lime dilution, lime-free aqueous/aeration and recovery states; multi-species case conditions are not default yield, recipe or industrial activity"
  - id: "dutta-indigo-2017"
    type: "literature"
    reference: "Dutta, S.; Roychoudhary, S.; Sarangi, B.K. (2017). Effect of different physico-chemical parameters for natural indigo production during fermentation of Indigofera plant biomass. 3 Biotech 7, 322. https://doi.org/10.1007/s13205-017-0923-2 ; Introduction; Materials and methods; Results and discussion"
    used_for: "Indigofera precursor hydrolysis/oxidation species, solid recovery/drying and distinction between crude product and analytical constituent; analytical DMSO is not a manufacturing solvent; no experimental temperature/yield/water-ratio default"
  - id: "eu-cww-2016"
    type: "official_guidance"
    reference: "European Commission JRC (2016). Best Available Techniques Reference Document for Common Waste Water and Waste Gas Treatment/Management Systems in the Chemical Sector. JRC103096, BAT 2, printed p.543 (PDF p.573). https://publications.jrc.ec.europa.eu/repository/bitstream/JRC103096/jrc103096_cww_bref_10_2016.pdf"
    used_for: "Independent process/reaction and wastewater/waste-gas inventory method; no legal applicability claim, pigment emission factor or mandatory treatment efficiency"
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279, Annex I, section 4.5, printed/PDF pp.63–64. https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "General multifunctionality hierarchy for subdivision, system expansion and justified allocation; no full-PEF claim, fixed coproduct share or automatic substitution credit"
  - id: "teanglum-indigo-wash-2012"
    type: "literature"
    reference: "Teanglum, A.; Teanglum, S.; Saithong, A. (2012). Selection of Indigo Plant Varieties and Other Plants that Yield Indigo Dye. Procedia Engineering 32, 184–190. https://doi.org/10.1016/j.proeng.2012.01.1255 ; original sections 1 and 2.2, printed pp.184–185 (PDF pp.1–2), with section 2.3 as separate plant controls"
    used_for: "Laboratory four-variety Indigofera tinctoria aliquot/yield-isolation method: remove leaves, filter an oxidised-liquor aliquot, water-wash its recovered pigment residue and heat to constant dry mass; not a leaf wash or industrial manufacturing qualification. Other-species controls, inconsistent abstract/body yields, wash count, temperature/time and laboratory filter medium are not industrial recipes, purity proof or energy defaults"
