  market_state: "Whole dry pigment at first factory acceptance; packaging excluded; no added carrier or mineral"
functional_unit:
  what: "Natural blue pigment supplied for a separately specified downstream dyeing process"
  how_much: "1 kg net whole dry commodity at first acceptance"
  how_well: "Meet the actual grade acceptance for indigotin assay, indirubin, residual moisture, ash, particle size and colour; equal dyeing strength is not assumed"
