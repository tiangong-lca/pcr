measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use cp_output to weigh accepted net MDF at the same declared state, excluding packaging. All rows are per 1 kg reference flow; wet furnish, dry wood mass and unsanded rough panels are not the denominator."
  - id: moisture_basis
    applies_to: "furnish_chips, furnish_sawdust, furnish_shavings, mdf_output"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use cp_furnish and cp_output to retain wet mass, oven-dry solids and water separately; dry-basis moisture u is water/dry mass and wet-basis moisture w is water/wet mass, both as fractions. These are same-state composition measurements, not invariant stage quantities; distinguish water-specific tests from volatile loss or test-induced curing and retain uncertainty."
  - id: volume_basis
    applies_to: "furnish_chips, dryer_gas, control_gas, boiler_gas"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Volume/m3 identity defines neither solid/bulk wood volume nor gas state. cp_furnish obtains supplier actual reference A, volume definition, same-lot/moisture Vs/Vb and measured k with loss/gate conversion. cp_energy and cp_energy_utilities obtain gas T/P, dry-wet composition, Z and background-m3 reference conditions. Any unproven correspondence remains quantity compatibility pending."
  - id: electricity_conversion
    applies_to: "line_electricity, boiler_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert metered kWh to MJ by multiplying by 3.6. The electricity dataset net-calorific-value property represents electric energy bookkeeping and proves no steam/process-heat net-heat basis."
  - id: thermal_basis
    applies_to: "line_steam, line_heat, boiler_steam, boiler_heat, condensate_return, boiler_condensate"
    required_property_ref:
      name: "Steam mass; delivered heat"
      uuid: ""
    required_unit: "kg; MJ"
    rule: "cp_thermal and cp_thermal_utilities retain steam mass, condensation/return mass, temperature/pressure/quality and enthalpy boundary. Populate heat MJ only when supplier/background definition agrees with site supply-return enthalpy balance; property or product name alone is insufficient and unknown basis remains unresolved."
  - id: reaction_accounting
    applies_to: "mdf-line; utilities"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Conserve whole mass and each actual element, including C/H/O/N/S and relevant inorganic elements, across each measured stage and the utility boundary, with combustion air and stocks included. Molecular H2O and wood/resin materials are reactive species, not separately conserved solids. Their ledgers require evidenced formation and consumption at actual reaction extents under cp_recipe, cp_fuel, cp_energy, cp_energy_utilities, cp_air, cp_air_utilities, cp_water, cp_water_utilities, cp_vapour and cp_vapour_utilities; unknown terms remain uncertain, not zero. UF/MUF condensation may form H2O; pMDI-water cure consumes H2O and forms CO2; fuels and controls can form H2O. Infer neither complete cure/combustion nor a universal yield. Sources: usda-wood-joining-2023; doe-condensing-economizer-2012; epa-wood-boiler-2022."
  - id: nox_mass_basis
    applies_to: "dryer_nox, handling_nox, boiler_nox"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "NOx kg requires a demonstrated common monitoring/LCI/LCIA-mapping mass basis and NO/NO2 boundary, excluding N2O and speciated duplicates; otherwise quantity compatibility pending."
