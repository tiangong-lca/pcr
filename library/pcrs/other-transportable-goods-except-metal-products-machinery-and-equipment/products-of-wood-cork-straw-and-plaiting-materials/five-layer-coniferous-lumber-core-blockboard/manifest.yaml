  unresolved_flow_uuids:
    - row_id: "pvac_glue"
      flow: "Supplied aqueous polyvinyl acetate (PVAc) wood adhesive"
      reason: "Direct record e0d87fbd-b6d2-4e8d-a923-268e54f981ea is named Glue (Polyvinyl Acetate, PVA), with PVAc synonyms, but declares CAS 9002-89-5; this conflicts with intended polyvinyl acetate identity. Clear flow/property/unit-group UUID bindings; retain the whole supplied adhesive Mass/kg exchange. Actual supplier formulation and compatible whole-adhesive evidence are required before rebinding; pure-polymer substitution is not permitted."
    - row_id: "face_veneer"
      flow: "Dried unbonded coniferous veneer sheets for face and back"
      reason: "No exact unbonded coniferous veneer identified. Generic Wood veneer comment also describes bonded substrate; reject that ambiguous record and non-coniferous veneer candidates."
    - row_id: "cross_veneer"
      flow: "Dried unbonded coniferous veneer sheets for crossbands"
      reason: "Same search evidence as face row, separately assessed for thicker load-transfer crossband sheets; generic decorative veneer is not verified."
    - row_id: "hardener"
      flow: "Dry ammonium chloride hardener"
      reason: "At-plant chemical candidate has reference Volume; mass candidate is explicitly in absorption tower. Neither verifies the supplied dry hardener route; leave UUID empty."
    - row_id: "wood_flour"
      flow: "Untreated coniferous wood flour filler"
      reason: "Search returns chips and unrelated products; none establishes fine untreated coniferous wood flour filler."
    - row_id: "heat"
      flow: "Purchased net hot-water heat delivered to press circuit"
      reason: "Candidate Heat from steam or hot water has Gross calorific value and no net-delivery definition. Reject pending supplier/background enthalpy compatibility, not no match."
    - row_id: "bonded_trim"
      flow: "UF/PVAc-bonded blockboard trimming waste"
      reason: "Generic Offcut does not verify resin-bonded panel waste; reject untreated sawdust and generic wood waste as substitutes."
    - row_id: "sanding_dust"
      flow: "UF/PVAc-contaminated blockboard sanding dust waste"
      reason: "No exact resin-bonded sanding-dust waste identified; reject sawdust and cork dust."
    - row_id: "glue_wastewater"
      flow: "UF adhesive equipment-wash wastewater to off-site treatment"
      reason: "No exact UF wash-water waste-to-treatment identified. To-water flows imply another destination; refuse them."
    - row_id: "glue_residue"
      flow: "Uncured UF resin-mix residue waste"
      reason: "Glue residues direct record is pressure-sensitive label/superglue residue, not UF production leftovers; reject."
    - row_id: "pvac_residue"
      flow: "PVAc edge-gluing adhesive residue waste"
      reason: "Pressure-sensitive glue residue is not PVAc wood-adhesive leftover. No exact match confirmed."
  unresolved_range_evidence:
    - "No boundary-compatible independent empirical range for the selected purchased-dry-input PVAc-core/UF-skin route. Foreground collection is mandatory for material yield, glue, utilities, packaging, waste and emissions; old all-veneer plywood or sawmill survey quantities are not substitutes."
  classification_review:
    - "Accepted narrower 31421 relation for this existing five-layer solid coniferous strip-core construction with four coniferous veneer sheets, coniferous outer plies and actual 0/90/0/90/0 ply axes under the complete 3141 solely-sheets versus 3142 residual hierarchy. The official 31411 blockboard inclusion inconsistency remains disclosed; no official erratum or exact CPC3-HS2022 correspondence is claimed. Not whole-leaf, all blockboard/three-layer, 31422 or 31423 coverage. Current accepted mapping authority is classifications/mappings/cpc-3.0-to-pcr.yaml and the ADRs referenced by its acceptance.decision_ref fields. This acceptance does not establish scientific approval or publication; independent content review remains separate."
  reference_flow_source_clarification: >-
    The existing Lumber core plywood/Blockboard reference and finished_panel locator is physically coherent only at the broad lumber-core blockboard level.
    Its active source classification CPC 31520 Densified wood conflicts with that physical description; its comment first describes primarily softwood core lumber, then thick hardwood strips, often Basswood.
    Source classification and species-definition clarification remain required; the native record does not establish an all-coniferous product.
    Retain only conditionally with actual supplier-confirmed coniferous species for every layer, five layers and 0/90/0/90/0 axes, declared adhesives/state and acceptance, plus independently compatible supplier/background definition.
    Unknown or incompatible species/provider evidence remains unresolved; do not inherit a hardwood core or densified-wood route. Scientific approval remains pending.
  methodology_review:
    - "Actual same-lot UF cure water formation/consumption and dry-species conversion require analytical evidence or supported stoichiometry with measured reaction extent; no default water yield, complete cure or forced closure is authorized. Qualitative chemistry source does not supply factory quantities. Scientific approval remains pending."
    - "Authored route awaits independent scientific review; source glue evidence is historical and cannot establish current performance or dosage. Actual suppliers must verify recipe and net heat boundary before dataset production."
