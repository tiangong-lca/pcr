measurement_rules:
  - id: element_volume
    applies_to: "reference product"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Measure net geometric volume inside the geometric boundaries of every bamboo element in complete baskets, including natural microscopic cellular porosity and excluding basket cavity, macroscopic weave gaps and external envelope. This is not pore-free cell-wall or skeletal volume; use cp_geometry. Sources: liang-bamboo-geometry-2026; phongphinittana-woven-bamboo-2025."
  - id: geometry_method
    applies_to: "reference product"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Measure actual curved centroid-path length and cross-section areas at low contact force for the actual variant. Length × width × thickness is allowed only for demonstrated uniform rectangular sections; otherwise integrate along the actual path with station refinement or validated 3D geometry. Count each element once and never subtract projected crossings. Sources: liang-bamboo-geometry-2026; phongphinittana-woven-bamboo-2025."
  - id: same_denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Normalize each cohort's final exchange once by its positive event-locked first-accepted whole-basket net element volume Q_V (original Q_V_original for earlier accepted cohorts). Lock volume at each unique first-acceptance moisture/conditioning endpoint; later loss, moisture change, return, rework or reacceptance never cancels or increases that event volume. Keep physical mass, dry matter, carbon, water and energy in their own units. Basket volumes require measured geometry or a validated actual-variant sample estimate; no default density or universal volume per basket."
  - id: energy_units
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert actual metered kWh only by 1 kWh = 3.6 MJ; electricity neither determines bamboo volume nor establishes a background provider."
