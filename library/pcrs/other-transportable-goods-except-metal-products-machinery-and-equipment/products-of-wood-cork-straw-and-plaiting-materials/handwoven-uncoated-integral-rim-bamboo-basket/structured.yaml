allocation_rules:
  - rule_id: allocation_cause
    applies_to: "foreground_dataset"
    rule: "Avoid allocation by metering work orders/operations. For shared lighting, dampening or equipment, use a documented physical causal driver such as metered machine time or occupied conditioning service, with period totals reconciled. Do not use nominal basket counts across unlike variants or assume mass and volume are interchangeable. This is a foreground collection rule, not an empirical universal allocation coefficient."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_reject
    applies_to: "foreground_dataset"
    rule: "No default co-product revenue, substitution credit or negative waste input. Internal reused offcuts retain inherited burdens and are not fresh purchases. External sale as a genuine co-product requires evidence of product quality, function, receiving market and documented subdivision/allocation before the dataset can be complete. Failed baskets/rework remain attached to their originating cohort."
    source_ids:
      - ilcd-general-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_geometry
      process_id: "basket_manufacture"
      flow_role: "basket_output"
      record_type: "measurement"
      raw_fields: "basket id; variant; species; unique components; completeness; moisture; conditioning endpoint; curved path and section profiles; calibration; sampling probabilities; uncertainty"
      collection_method: "Execute geometry_complete, geometry_disassembly, geometry_integrate and geometry_sample below; retain actual method, instrument force, repeatability and validation."
      unit: "m3"
      frequency: "Each variant/production lot and change"
      temporal_coverage: "Same acceptance period"
      site_scope: "Actual site/variant"
      aggregation_rule: "per reference flow"
      quality_evidence: "Whole-basket photographs, component ledger, raw geometry, calibration, moisture, sampling and uncertainty propagation"
    - protocol_id: cp_acceptance
      process_id: "basket_manufacture"
      flow_role: "basket_output"
      record_type: "records"
      raw_fields: "immutable work order/cohort and basket id; unique first acceptance time; acceptance geometry, moisture and conditioning endpoint; original Q_V_original for older cohorts; gross dispatch and linked actual returns; separate new/old opening/closing FG and WIP; each net loss, discard, downgrade/use, out-of-scope transfer and returned/rework WIP; repeat inspection/reacceptance and physical re-entry/re-exit history; original-basis conversion and uncertainty"
      collection_method: "Lock Q_V from unique first-acceptance basket or validated lot records, then reconcile the complete mutually exclusive destinations in first_acceptance on that original geometric basis. Exclude opening accepted FG, purchased finished baskets and repeated events from new Q_V, but retain their physical stocks and original-cohort services. Later losses and closing WIP remain in original Q_V; only evidenced zero other dispositions permits dispatch plus FG alone."
      unit: "m3"
      frequency: "Each acceptance, destination/movement and period reconciliation"
      temporal_coverage: "Declared period with immutable carryover cohort trace"
      site_scope: "Site and original cohort, event basis distinct from current physical state"
      aggregation_rule: "per reference flow"
      quality_evidence: "Acceptance geometry, linked gross/net dispatch/returns, stock, all dispositions, conversion and no-recount trail"
    - protocol_id: cp_activity
      process_id: "basket_manufacture"
      flow_role: "green_strips; electricity; bamboo_offcut; basket_reject"
      record_type: "records"
      raw_fields: "each atomic exchange raw amount/unit; current moisture and dry matter; immutable work order/cohort; separate raw/WIP/new FG/old FG opening/closing; actual external receipts, dispatch/returns, waste/release; paired internal rework/reacceptance transfers; inherited vectors; original accepted volume and prior normalization basis"
      collection_method: "Weigh actual incoming, outgoing and stock materials/wastes, read meters and attribute complete work orders including failed/startup/rework activity. Reconcile whole-plant physical quantities separately from unique acceptance and burden vectors. Retain new and older accepted cohorts' post-acceptance losses/services, with their original locked volumes; carry inherited raw/WIP vectors once and add incremental operations once. Use cohort_balance and normalize_volume without reducing physical quantities by burden shares or re-purchasing internally returned bamboo."
      unit: "kg; MJ"
      frequency: "Each lot, movement and meter period"
      temporal_coverage: "Same period with original-cohort trace"
      site_scope: "Actual plant and supply-chain interface"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale/meter calibration, supplier records, allocation drivers, physical/event ledger and vector reconciliation"
    - protocol_id: cp_water
      process_id: "basket_manufacture"
      flow_role: "tap_water; dampening_effluent; evaporated_water"
      record_type: "measurement"
      raw_fields: "supply mass; current strip/WIP/new and old FG moisture; declared dry/wet basis; atmospheric sorption; discharge; gross returns/dispatch; internal reuse; opening/closing water stocks; original cohort; concentrations and receiver"
      collection_method: "Measure actual supply/discharge, current moisture and stock water on the same whole-plant period/boundary. Separate dry matter and water under physical_balance, retaining actual post-acceptance water changes and services with the original cohort. Internal reuse/rework transfers cancel; do not add acceptance volume as water/mass output or equate shrinking geometry to evaporation. Resolve closure uncertainty; any density conversion needs actual temperature/quality evidence. Normalize attributable water exchanges by the original event-locked cohort volume."
      unit: "kg"
      frequency: "Each lot/movement and period closure"
      temporal_coverage: "Consistent original cohort and period"
      site_scope: "Plant and discharge receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Instruments, wet/dry basis, moisture samples, physical closure residual, basis conversion and uncertainty"
  calculation_rules:
    - id: accepted_volume
      applies_to: "basket_output"
      rule: "Q_V = sum of immutable unique new first-acceptance V_j at each basket's declared acceptance moisture/conditioning endpoint; alternatively sum_h N_h*vbar_h for validated actual variant/lot first-acceptance strata, with sampling uncertainty. N_h counts first events once, not dispatch, repeat passes or residual available baskets. Lock the original geometric basis and uncertainty; later losses, reconditioning, rework or dimensional changes do not reset Q_V."
      inputs:
        - cp_geometry
        - cp_acceptance
      output: "event-locked Q_V"
      source_ids:
        - liang-bamboo-geometry-2026
        - phongphinittana-woven-bamboo-2025
    - id: first_acceptance
      applies_to: "basket_output"
      rule: "Q_V is the sum of unique first-acceptance event volumes, not a dispatch/stock-derived denominator. Reconcile Q_V = D_new + FG_new + Other_new for that newly accepted cohort (zero opening accepted stock): D_new is gross external dispatch minus linked actual returns; FG_new is closing accepted FG; Other_new covers all other mutually exclusive net destinations, including actual loss, scrap/test destruction, downgrade/use, out-of-scope transfer and closing returned/rework WIP. Use original acceptance-state net bamboo-element geometry for every term; trace original elements and measured moisture/dimension/removal changes to convert current fates to that basis, retaining bounded uncertainty. Current wet kg, changed-state volume, cavity/envelope and purchase volume are not substitutes. A return is removed from net dispatch and enters its actual final FG/WIP/other destination once; internal loops and reacceptance are not extra destinations. For 100 L accepted element volume, 60 L net dispatch + 30 L closing FG + 10 L loss retain Q_V=100 L=0.1 m3, not 90 L. Dispatch plus FG alone is allowed only with evidence that all other post-acceptance dispositions are zero. Exclude opening FG, purchased finished baskets and repeats from new Q_V; their services retain original Q_V_original. Never infer zero loss or invent a residual to force closure."
      inputs:
        - cp_acceptance
        - cp_geometry
        - cp_activity
      output: "locked Q_V and complete original-basis net destination bridge"
      source_ids: []
    - id: cohort_balance
      applies_to: "all inventory rows"
      rule: "Keep exchange vector B in original units: B_open_raw + B_open_WIP + B_open_FG + B_added = B_dispatched + B_close_raw + B_close_WIP + B_close_FG + B_other, each vector/location counted once. B_dispatched follows actual net dispatch after linked returns, including old FG; B_other is only separately evidenced burden attribution to other outputs/services, never an unexplained residual or removal of loss burdens already charged to accepted production. Internal FG/WIP/reacceptance transfers move inherited vectors once, without repeating prior wood or provider burdens; retain all current incremental operations. Stock-location vector reconciliation is distinct from first-acceptance attribution: all new accepted destinations, including later waste, downgrade, loss and WIP, retain their full original-cohort burdens and locked Q_V, while opening accepted FG stays under original Q_V_original. Supplier burdens already represented by the linked provider must not be added again as own-foreground history. Unresolved vectors remain debt."
      inputs:
        - cp_activity
        - cp_acceptance
      output: "reconciled original-unit cohort vectors"
      source_ids: []
    - id: physical_balance
      applies_to: "all inventory rows"
      rule: "On the integrated plant boundary reconcile actual opening raw/WIP/accepted FG/residue stocks + actual external receipts/linked returns = actual closing stocks + gross external dispatch/other transfers + external wastes/releases, separately for dry bamboo and water on measured current-state kg. With dry-basis u=(wet-dry)/dry, dry kg=wet kg/(1+u) and contained water=wet-dry; a wet-basis result must be converted from its declared definition, never silently treated as u. Include measured dampening supply and atmospheric uptake in water inputs and actual drainage/evaporation in outputs; retained residues remain closing stock only. Internal acceptance, FG-to-WIP and repeat acceptance cancel; Q_V and its original-basis destination equivalents are not extra physical mass/volume outputs. Geometry can change with conditioning and rework, so do not assume geometric-volume conservation or infer dry matter/water from a default density. Keep gross material quantities independent of allocated vectors and investigate uncertainty without invented balancing flows."
      inputs:
        - cp_activity
        - cp_water
        - cp_geometry
        - cp_acceptance
      output: "separate actual dry-bamboo and water physical ledgers"
      source_ids: []
    - id: normalize_volume
      applies_to: "all inventory rows"
      rule: "For each exchange i, I_i = B_i / Q_V, using its full attributable first-acceptance-cohort burden B_i and positive Q_V; the reference output is 1 m3. For an old service intensity H_i per m3, recover B_old_i = H_i * Q_V_original using the original accepted-cohort volume of that service; never multiply it by the current period denominator or divide a normalized intensity again. Transfer the resulting raw vector once to its original cohort. Later actual service B_service,c on old accepted output is a separate correction B_service,c / Q_V_original,c, with no new accepted output. Do not add old accepted production or services to a new-cohort numerator; selective subcohorts require evidenced attribution and matching original volume. Post-acceptance loss, discard, downgrade, returns and rework retain the original event volume and every applicable incremental burden even if no deliverable FG remains. If original volume/history is unknown, keep an unresolved raw service correction rather than dividing by current Q_V. For Q_V = 0 retain raw amounts and unresolved cohort state; do not divide or publish a complete normalized dataset."
      inputs:
        - cp_activity
        - cp_water
        - cp_geometry
        - cp_acceptance
      output: "I_i per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Check physical identity, moisture/treatment, gate, units and provider; blank UUID is not a zero exchange."
      evidence: "Direct identities, supplier, actual BOM and fate records"
    - id: dq_geometry
      applies_to: "basket_output"
      requirement: "Provide a feasible bounded geometry and sampling procedure for actual complete baskets; disclose pore convention, unrecovered geometry and capacity differences."
      evidence: "cp_geometry raw measurements, validation and uncertainty"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Reconcile plant-period totals and cohort vectors; record each actual material, emission and waste separately, without zeroing background gaps."
      evidence: "Bills, meters, original-unit physical balances, vector reconciliations and gap list"
    - id: dq_limits
      applies_to: "all inventory rows"
      requirement: "Report year, geography, variant, sample applicability, technological representativeness and independent review state; do not turn one factory into an industry range."
      evidence: "Dataset quality disclosure and review records"
validation_rules:
  - rule_id: validate_admission
    applies_to: "foreground_dataset"
    rule: "Reject application when actual basket construction, supplier treatment, handleless integral rim or uncoated all-bamboo BOM is unverified or incompatible. A source showing rattan binding, lacquer, glue or hardware cannot validate this route. Sources: mlit-bamboo-finishing-2020; unido-woven-bamboo-2008."
    source_ids:
      - mlit-bamboo-finishing-2020
      - unido-woven-bamboo-2008
  - rule_id: validate_quantity
    applies_to: "foreground_dataset"
    rule: "Require Q_V > 0, unique first-acceptance records, complete-element geometric volume and bounded uncertainty. Reject capacity/envelope/skeletal proxies, projected chords, nominal uniform strips without evidence, duplicated components, projected-crossing subtraction and mass-only disassembly recovery. Immersion of porous bamboo without validated absorption, air and swelling control is not an automatic alternative. ISO 22157 culm-specimen testing is not claimed as basket testing."
    source_ids: []
  - rule_id: validate_accounting
    applies_to: "foreground_dataset"
    rule: "Require every final inventory basis and linked aggregation to match the original-cohort reference flow. Verify locked unique acceptance Q_V and complete same-basis D_new + FG_new + Other_new, including net returns, losses, discards, downgrades and closing WIP; reject unconditional dispatch-plus-FG, reacceptance adding Q_V, loss shrinking it or one body counted as both FG and WIP. Check actual material/water ledgers independently with internal transfers cancelled and acceptance not added to dispatch/closing FG. Retain opening FG, inherited raw/WIP vectors, failed/rework activity and old-cohort services under original volumes. Unresolved geometry/basis conversion, missing history/vectors, Q_V=0 or incompatible providers makes the affected dataset incomplete. A declared-basis check is not scientific approval or factory measurement."
    source_ids: []
published_dataset_profile:
  dataset_role: "Factory-gate manufacturing foreground; separately disclose matched upstream coverage"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Basket production modelling with matching actual construction, state, gate and net bamboo-element volume"
  excluded_use: "Capacity-storage service, functional equivalence comparison, generic industry baskets, rattan/willow baskets, lifetime or methodology-approval claims"
  required_metadata: "All required qualifiers, original-unit ledgers, cohorts, Q_V, variant sampling and source/provider compatibility"
  required_quality_disclosure: "Missing identity/providers, geometry and sampling uncertainty, disassembly effects, stock traceability, allocation and independent review state"
  update_trigger: "Reassess changes in construction, species, supplier treatment, route, measurement, sampling, acceptance basis, electricity or waste fate"
data_sources:
  - id: "mlit-bamboo-finishing-2020"
    type: "official_guidance"
    reference: "Japan Tourism Agency / MLIT, Bamboo Finishing Techniques, FY2020, p.1, Basket rims and Coatings. https://www.mlit.go.jp/tagengo-db/common/001565623.pdf"
    used_for: "Integral rim continuation and uncoated construction; contrary rattan, tack and coating alternatives; no universal BOM."
  - id: "unido-woven-bamboo-2008"
    type: "official_guidance"
    reference: "UNIDO / INBAR, Three Dimensional Woven Bamboo Products, 2008, printed pp.1–5,20–24. https://www.unido.org/publications/ot/9656608/pdf"
    used_for: "Whole baskets, strip preparation, weaving and finishing; no chemical recipe, dimensions or industry factors adopted."
  - id: "liang-bamboo-geometry-2026"
    type: "literature"
    reference: "Liang, Jiang and Tan, Effects of Heat Treatment on the Mechanical Properties and Thermal Stability of Bamboo, Polymers 18 (2026) 2098, §2.2 p.3. https://doi.org/10.3390/polym18172098"
    used_for: "Direct dimensional geometric-volume principle for conditioned regular rectangular strips; not a basket standard, density or heat-treatment default."
  - id: "phongphinittana-woven-bamboo-2025"
    type: "literature"
    reference: "Phongphinittana, Klangtup and Jearanaisilawong, Mechanical Properties of Asymmetric Woven Bamboo Structure from Bamboo Strips, Fibers 13 (2025) 18, pp.3–5, Fig.3. https://doi.org/10.3390/fib13020018"
    used_for: "Curved warp, comparatively straight weft and inter-strip gaps support actual paths and element-volume definition; no specimen mechanical model, species, dimensions or gap values transferred."
  - id: "ilcd-general-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook—General guide for LCA—Detailed guidance, March2010, §§7.9.2–7.9.3; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision and determining physical causality; actual work-order/shared-service and stock protocols are disclosed operational deductions, not factory shares or a basket-volume standard."
