  classification_refs: "CPC 3.0 31709; narrower product scope. Current mapping relation and acceptance: classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs"
  covered_products: "Accepted solid-wood packaging wedges and contoured/notched blocks with cargo-contact geometry"
  excluded_products: "The exclusions in section 1; classification labels alone do not establish applicability"
  representative_product: "Unglued uncoated tapered pine packaging wedge, cut to order from kiln-dried sawn stock"
  production_route: "Purchased dry stock; electric sawing of taper/contour/notch; dry dust collection; dimensional/grain/fit acceptance; bulk or PE-wrapped dispatch"
  market_state: "Finished standalone packaging article at manufacturing gate, ready for customer cargo placement; no downstream installation included"
functional_unit:
  what: "Supply specified loose packaging wedge or contoured block for declared cargo support/restraint application"
  how_much: "1 kg accepted net as-delivered wood at factory gate, excluding wrapping"
  how_well: "Meet actual order geometry, taper/contour/notch, grain direction, species, moisture, defect and fit acceptance; no generic load rating"
  how_long_or_cycle: "One declared production and dispatch cohort; no service life or shipment-count equivalence"
  reference_flow_link: "finished_out"
system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "workshop"
      rule: "Include receiving, layout, taper/contour/notch sawing, reject handling, dust collection, electric internal movement, maintenance attribution, fit/geometry acceptance and dispatch; meter stages within one foreground unit. Installation, cargo transport/use, fasteners applied by customers and end-of-life are downstream. Declare capital/tool replacement and employee-activity treatment and assess significance; no automatic zero claim."
      source_ids:
        - hastiles-packaging-wedges
        - ctu-code-2014
    - rule_id: boundary_dust
      applies_to: "mechanical releases"
      rule: "Measure actual air emissions after controls; captured sawdust is an external material output. EPA PTE tables are screening evidence, not actual emissions. Add each other observed atomic substance before dataset completion; no blanket mass cutoff."
      source_ids:
        - epa-sawmill-pte-2014
    - rule_id: boundary_carbon
      applies_to: "wood carbon"
      rule: "Track measured dry-wood carbon crossing all material gates and retained stock. No new atmospheric uptake or avoided-disposal credit is created at the workshop. Retain inherited upstream uptake once. This cold non-combustion route has no prescribed positive biogenic CO2 emission; any measured oxidation/decay invalidates assumed absence and requires separate biogenic CO2 and other species rows. Never erase biogenic CO2 from LCI because of a greenhouse-gas reporting convention."
      source_ids:
        - usda-wood-handbook-2021
    - rule_id: boundary_treatment
      applies_to: "route qualification"
      rule: "Do not represent heated, glued, coated, fumigated or export-certified products with this untreated route. Machining alone is not a processed-wood pest exemption. Require separate treatment evidence and inventory for an extended route."
      source_ids:
        - ippc-ispm15-2018
boundary_abstraction:
  declared_starting_condition: "Purchased kiln-dried untreated sawn stock received at workshop; supplier drying burdens remain upstream"
  starting_condition_role: "Gate-to-gate electric conversion to accepted packaging articles"
  product_classification_scope: "Only specified solid-wood packaging wedge/contoured-block subset; current CPC31709 mapping relation and acceptance follow classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs"
  recursive_input_rule: "Purchased same-category unfinished/reworked packaging articles change the route and require separate disclosed supplier gate; never silently substitute for sawn stock or create repeated finishing credit"
  upstream_dataset_requirement: "Match stock species, drying, moisture/reference quantity, forestry carbon/allocation, supplier gate and inbound transport; match delivered electricity voltage/geography/period, oil and PE supplier specifications. Identity UUID is not a background dataset."
  disclosure: "Disclose all gates, actual operations, meters, transport providers, exclusions and pending identities/background compatibility; gate-to-gate alone is not cradle-to-gate"
