allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The dry-mass fallback is a candidate PCR methodological choice for residual joint dry material conversion, subject to site causal assessment and independent review. Wood Handbook supports only moisture-to-dry-mass measurement, not allocation approval. Do not use a dry-mass share for dedicated geometric machining or services with a demonstrated different driver."
    source_ids: []
  - rule_id: allocation_avoid
    applies_to: "cohort operations"
    rule: "First separate operations/meters by accepted geometry/species and by coproduct destination. Dedicated operations belong to their output. Distinguish physical waste from genuine marketable coproduct using contract/specification/receiver evidence; a receipt of revenue alone is not methodological approval."
    source_ids:
      - hastiles-packaging-wedges
  - rule_id: allocation_joint
    applies_to: "unavoidable joint burdens"
    rule: "For unavoidable joint dry sawing burdens without a demonstrated causal alternative, use site-measured oven-dry mass shares of accepted wood and genuine coproducts. State products, measured moisture and sums; disclose justification and test an economic-share sensitivity with same-period prices if decision-relevant. Do not allocate burdens to discarded wastes or assume zero disposal burden. Preserve actual full physical outputs and water/carbon ledgers; allocated external input/emission values are a separate account. No survey shares or substitution credit."
    source_ids:
      - usda-wood-handbook-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "manufacture"
      flow_role: "accepted wood denominator"
      record_type: "collected_record"
      raw_fields: "lot; order; species; geometry; taper/contour/notch; grain; moisture; net mass; wrapping tare; defects; fit acceptance; rejects; period"
      collection_method: "Calibrated scales and order-linked dimensional/grain/fit inspection at dispatch; retain net weighing and acceptance trace Aggregation: Accepted net wood kg divided by the same accepted net wood kg: per 1 kg reference flow"
      unit: "kg"
      frequency: "each accepted lot"
      temporal_coverage: "one common disclosed cohort"
      site_scope: "one workshop; geometry/species separately"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; order drawings; acceptance/rejection records"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "stock, moisture, water and carbon"
      record_type: "collected_record"
      raw_fields: "supplier; species; treatment; wet mass; paired oven-dry specimens; geometry; carbon fraction analysis; beginning/end stock; evaporation evidence"
      collection_method: "Calibrated stock weighing, representative paired moisture samples oven-dried to constant mass; record sampling coverage and uncertainty; independently evidence carbon fraction; reconcile gate water Aggregation: Each unallocated cohort mass/positive evaporation total divided by accepted net wood kg: per 1 kg reference flow"
      unit: "kg"
      frequency: "each stock lot and dispatch cohort"
      temporal_coverage: "same common cohort"
      site_scope: "same workshop and receiving gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier boundary; oven/scales calibration; sampling and analysis files"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "electricity by stage"
      record_type: "collected_record"
      raw_fields: "meter start/end; kWh; voltage; site; period; machine runtime; standby; dust fan; electric handling; shared-use split"
      collection_method: "Calibrated stage meters; reconcile purchased delivery with sawing/fans/handling/dispatch; evidence any shared-service driver Aggregation: Unallocated attributed delivered MJ divided by accepted net wood kg: per 1 kg reference flow"
      unit: "kWh; MJ"
      frequency: "continuous meters; cohort reconciliation"
      temporal_coverage: "same common cohort"
      site_scope: "same workshop and customer-side supply"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter certificates; supplier voltage/geography/period; splits"
    - protocol_id: cp_auxiliary
      process_id: "manufacture"
      flow_role: "oil, PE film and their destinations"
      record_type: "collected_record"
      raw_fields: "SDS; actual polymer/oil formulation; supplier; issue mass; opening/closing stocks; shipped wrapping; trimming mass; used oil; base oil/additives; contaminants; source equipment; receiver treatment; provider reference-quantity basis; retained oil"
      collection_method: "Weigh issues, wrap and trimmings separately; reconcile consumption and stocks; maintenance logs attribute oil; manifests identify actual waste receiver Aggregation: Each unallocated attributed material total divided by accepted net wood kg: per 1 kg reference flow"
      unit: "kg"
      frequency: "each issue/dispatch/maintenance event"
      temporal_coverage: "same common cohort; maintenance interval disclosed"
      site_scope: "same workshop and contracted providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scales; SDS/invoices; transfer notes; residual/stock balances"
    - protocol_id: cp_residue
      process_id: "manufacture"
      flow_role: "offcuts and sawdust by destination"
      record_type: "collected_record"
      raw_fields: "origin stage; species; particle form; glue/coating contamination; wet/dry mass; moisture; internal returns; stock; contracts; price; receiver; lawful product/waste status; buyer-accepted specification and intended use; dimensions/particle size; provider reference-quantity basis"
      collection_method: "Weigh each separated stream; representative paired moisture tests; reconcile offcuts/captured dust/sold products/waste without duplicate destinations Aggregation: Each unallocated stream total divided by accepted net wood kg: per 1 kg reference flow"
      unit: "kg"
      frequency: "each collection/transfer and cohort close"
      temporal_coverage: "same common cohort"
      site_scope: "same workshop; named receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scales; moisture; contracts; receiver classification; disposal evidence"
    - protocol_id: cp_dust
      process_id: "manufacture"
      flow_role: "three disjoint emitted PM sizes"
      record_type: "collected_record"
      raw_fields: "outlet/fugitive source; PM2.5; PM10; compatible total particulate; sampling basis; exhaust volume; hours; controls; captured dust; detection limits; uncertainty"
      collection_method: "Site-specific post-control monitoring with documented size, sampling and dry/wet standard volume bases; representative campaigns linked to production hours; no direct EPA PTE transfer Aggregation: Each actual emitted non-overlapping cohort mass divided by accepted net wood kg: per 1 kg reference flow"
      unit: "kg"
      frequency: "representative campaign plus operation/control logs"
      temporal_coverage: "same common cohort"
      site_scope: "same workshop; specified outdoor-air release"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Accredited method; matched size basis; control logs; uncertainty and detection evidence"
  calculation_rules:
    - id: normalize_cohort
      applies_to: "all inventory rows"
      rule: "For each exchange, sum unallocated same-cohort measured amounts after stock reconciliation and divide once by accepted net wood kg. finished_out is 1 kg. Retain physical values separately from burden allocation."
      inputs:
        - cp_reference
        - cp_material
        - cp_energy
        - cp_auxiliary
        - cp_residue
        - cp_dust
      output: "physical exchange per 1 kg reference flow"
      source_ids: []
    - id: energy_conversion
      applies_to: "electricity_in"
      rule: "Multiply metered delivered kWh by3.6 to MJ before cohort normalization; do not confuse fuel heat with electricity."
      inputs:
        - cp_energy
      output: "delivered MJ"
      source_ids: []
    - id: dry_balance
      applies_to: "wood and residue ledger"
      rule: "Convert each measured wet mass using its own dry-basis moisture per moisture_basis. Dry inputs plus stock decrease equal dry accepted wood, coproducts, discarded wood, emitted wood dust and unexplained residual. Keep water and carbon balances separate; investigate uncertainty rather than assigning a made-up yield."
      inputs:
        - cp_material
        - cp_reference
        - cp_residue
        - cp_dust
      output: "unallocated dry mass, water and carbon closure"
      source_ids:
        - usda-wood-handbook-2021
    - id: dust_bins
      applies_to: "pm_fine; pm_coarse; pm_large"
      rule: "When nested quantities are measured under identical conditions: fine=PM2.5; coarse=PM10-PM2.5; large=compatible total particulate-PM10. Require nonnegative differences and consistent methods/coverage. Otherwise measure disjoint bins or retain missing-bin uncertainty. Never sum PM2.5+PM10+total or subtract incompatible condensable/filterable measurements."
      inputs:
        - cp_dust
      output: "three disjoint emitted masses"
      source_ids:
        - epa-sawmill-pte-2014
    - id: burden_shares
      applies_to: "joint burdens only"
      rule: "Use each accepted product or genuine coproduct dry mass divided by the sum of those dry masses for residual joint burdens after subdivision. Shares sum to1; do not apply shares to physical outputs, waste or internal links. Document any justified causal alternative."
      inputs:
        - cp_reference
        - cp_material
        - cp_residue
      output: "separate allocated environmental-burden account"
      source_ids:
        - usda-wood-handbook-2021
  data_quality_requirements:
    - id: dq_route
      applies_to: "manufacture"
      requirement: "Prove dry purchased stock, actual shaped packaging end-state and cold electric route; exclude incompatible treatment/assembly. Document absence rather than assume."
      evidence: "cp_reference; cp_material; cp_energy"
    - id: dq_identity
      applies_to: "each external flow and background"
      requirement: "Verify physical identity separately from measured quantity and provider dataset basis. Blank UUIDs and classification conflicts remain visible; all material missing exchanges/backgrounds block a complete dataset claim."
      evidence: "Direct identity records; supplier/receiver specifications; uncertainty log"
    - id: dq_period
      applies_to: "all records"
      requirement: "Same disclosed cohort/site, traceable source periods and stock changes; keep collection totals, allocation drivers and detection limits. No universal manufacturing ranges inferred."
      evidence: "cp_reference; cp_material; cp_energy; cp_auxiliary; cp_residue; cp_dust"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_out"
    rule: "Exactly one reference output is 1 kg accepted net wood; reference link, UUID, Mass/kg, geometry/function, moisture and packaging exclusion must agree. Do not duplicate its UUID as an intermediate product output."
    source_ids:
      - ctu-code-2014
      - hastiles-packaging-wedges
  - rule_id: validate_balance
    applies_to: "physical and allocated accounts"
    rule: "Close raw mass/water/carbon within documented measurement uncertainty; same internal transfer has equal quantities at both ends. Reconcile wrapping consumed=shipped+trimmings+stock change; oil issue=used oil+retention+documented loss+stock change. No balancing invented emissions or allocating physical coproduct amounts."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: validate_dust
    applies_to: "dust emissions"
    rule: "Check three non-overlapping size bins, compatible monitoring/volume basis and post-control outdoor compartment. Captured and emitted dust cannot be counted twice. PTE values, unspecified-size PM or missing bins cannot prove measured complete emissions."
    source_ids:
      - epa-sawmill-pte-2014
  - rule_id: validate_completeness
    applies_to: "data release"
    rule: "Resolve all applicable material UUID/background gaps and supplier/receiver compatibility; disclose source classification defects and uncertain coverage. Every added actual flow is atomic and audited. An unavailable identity, incomplete physical balance or unmeasured material emission fails a complete-dataset claim; passing a structural PCR check does not approve methodology or fill missing field data."
    source_ids: []
  - rule_id: validate_treatment
    applies_to: "product status"
    rule: "No ISPM15 certification, heat-treatment, load rating, life-cycle completeness or full CPC31709 coverage follows from this manufacturing reference. Reject incompatible states unless the method is formally extended with evidence."
    source_ids:
      - ippc-ispm15-2018
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Only completed compatible manufacturing inventory for specified untreated shaped packaging articles"
  allowed_use: "Supplier-specific packaging component burdens at matched net wood/moisture/geometry gate; cargo-support model with separately demonstrated suitability"
  excluded_use: "Cargo securement certification, installation/transport/use/EOL, treated/composite articles, generic sawnwood, equivalent restraint per kg, automatic full CPC31709 mapping"
  required_metadata: "All reference qualifiers; site/cohort; starting gate; stock/upstream sources; allocated and physical accounts; inventory/protocol links"
  required_quality_disclosure: "Meter/sampling/uncertainty; moisture/carbon basis; dust coverage; source identity defects; unresolved applicable UUIDs/backgrounds; allocation justification/sensitivity; excluded stages"
  update_trigger: "Changes to geometry/application, stock species/treatment/moisture, site equipment/control/supply, provider definitions, residue fate, source metadata or verified inventory gaps"
data_sources:
  - id: "hastiles-packaging-wedges"
    type: "extension_guidance"
    reference: "[H.A. Stiles, Wood Wedges & Corner Blocks](https://www.hastiles.com/portfolio-items/wood-wedges/); Use Cases; Materials and Options"
    used_for: "Primary manufacturer page: shaped dry pine/poplar packaging options; exclude particleboard, green wood, construction uses and optional finishes. No LCI values."
  - id: "ctu-code-2014"
    type: "official_guidance"
    reference: "[IMO/ILO/UNECE CTU Code, January 2014](https://assets.ippc.int/static/media/files/publication/en/2022/01/CTU_Code_January_2014.pdf); Annex7 §2.3.5, Figure7.7, PDF p83"
    used_for: "Cargo-blocking wedge grain/design qualifier only; no default force, dimensions or lifespan; downstream installation separate."
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "[USDA FPL Wood Handbook, FPL-GTR-282 (2021)](https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf); Ch4, printed p4–1, eq4-1/4-2"
    used_for: "Dry-basis moisture and matched-state mass accounting; no species density, moisture target, carbon fraction or industry yield adopted."
  - id: "epa-sawmill-pte-2014"
    type: "official_guidance"
    reference: "[EPA Region10 sawmill PM PTE memorandum, May8 2014](https://www.epa.gov/sites/default/files/2016-09/documents/spmpteef_memo.pdf); activity table headers/footnotes; cover memorandum"
    used_for: "Mechanical dust screening and nested PM/PM10/PM2.5 interpretation only; excludes boilers. No geographic/species PTE factors transferred as actual packaging emissions."
  - id: "ippc-ispm15-2018"
    type: "standard"
    reference: "[IPPC ISPM15, 2018 text](https://www.ippc.int/static/media/files/publication/en/2019/02/ISPM_15_2018_En_WoodPackaging_Post-CPM13_Rev_Annex1and2_Fixed_2019-02-01.pdf); scope and processed-wood exemptions"
    used_for: "Solid-wood dunnage trade limitations; cold sawing does not confer exempt status or export certification. Current provider publication page should be consulted for actual destination obligations."
