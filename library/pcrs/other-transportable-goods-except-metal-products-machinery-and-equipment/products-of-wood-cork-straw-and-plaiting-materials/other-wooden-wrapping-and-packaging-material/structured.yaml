measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated net weighing of accepted wood at dispatch under cp_reference. All inventory is per 1 kg reference flow, including physical residues. No piece-to-kg estimate from nominal geometry."
  - id: moisture_basis
    applies_to: "wood and wood residues"
    required_property_ref:
      name: "Mass and dry-basis moisture"
      uuid: ""
    required_unit: "kg; dimensionless"
    rule: "For fractions u=(m_wet-m_dry)/m_dry; m_dry=m_wet/(1+u); water=m_wet-m_dry. Measure paired specimens to oven-dry constant mass, with sampling/calibration evidence, m_dry>0 and u≥0. Divide percentage by100. No fixed species moisture/density. [usda-wood-handbook-2021, Ch4 eq4-2; algebra.]"
  - id: energy_basis
    applies_to: "electricity_in"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Meter customer-side delivered electricity by stage; 1 kWh=3.6 MJ from verified unit group. Database energy-property label does not imply combustion. Do not model onsite generation emissions for purchased electricity."
  - id: count_volume_basis
    applies_to: "count/volume records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile counts to directly weighed accepted lot mass at the same moisture; use measured density with actual net contoured solid volume only if conversion is necessary. Bounding rectangular volume and stacked volume are not net solid volume."
