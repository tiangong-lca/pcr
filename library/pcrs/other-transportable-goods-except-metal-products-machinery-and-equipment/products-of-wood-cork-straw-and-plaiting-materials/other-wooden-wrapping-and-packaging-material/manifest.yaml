review_metadata:
  scientific_review: "pending"
  semantic_boundary:
    decision: "Promote the matching unpublished retained packaging scaffold only for finished loose solid-wood packaging wedges and contoured/notched cargo-support blocks, from purchased kiln-dried coniferous or temperate hardwood sawnwood by dry electric sawing. No assembly, adhesion, coating, sanding, heating, combustion, impregnation or phytosanitary treatment onsite."
    classification_relation: "narrower"
    rationale: "Specified finite cargo-contact geometry, wedge grain orientation, dimensional fit and finished dispatch acceptance distinguish these packaging articles from general 31101 sawnwood and 31211 continuous profiles. Plain rectangular timber, pallet/crate components for later assembly, construction/furniture shims, wood wool/flour and wood waste are not reference products. Historical author recommendation is narrower; current mapping relation and acceptance are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs. Independent scientific review remains pending; this repair changes no mapping file."
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  reference_identity:
    flow_id: "1437dd55-5b8c-4866-83a4-b6911ed60bf8"
    flow_property_id: "93a60a56-a3c8-11da-a746-0800200b9a66"
    unit_group_id: "93a60a57-a4c8-11da-a746-0800200c9a66"
    reference_unit: "kg"
    scope_note: "Broad manufactured finished wooden packaging identity physically contains the stated narrower articles; identity is not a supplier background inventory or proof of performance."
    inventory_display: "The official English baseName is preserved verbatim in the reference table and provenance description. English Selected flow names one actual finished cargo-securing block SKU/accepted geometry within the wedge/contoured-block scope; it is a concrete exchange display, not a new database identity. Chinese UUID-bearing selected-flow/reference displays retain the exact official Chinese baseName. Both languages require the same physical SKU qualifiers."
  unresolved_flow_uuid_reviews:
    status: "open"
    row_ids:
      - "film_waste"
    policy: "The unprocessed factory PE waste row retains a specific atomic name and blank UUID: the cleaned mechanical-recycling candidate has a contrary route. Resolve its compatible identity and all supplier/receiver data before claiming a complete linked dataset. Absence must be documented; blank UUID does not mean zero."
  source_metadata_debts:
    - flow_id: "acc22294-8e77-4784-988f-2499be3c60eb"
      row_ids:
        - "offcuts_waste"
      conflict: "CPC39282 points to agglomerated waste; names, synonyms and comment describe cutting offcuts, and treatment is empty. Controller permits conditional broad physical identity for non-agglomerated woodworking offcuts."
      required_clarification: "Verify untreated solid wood, absence of adhesive/coating contamination, non-agglomerated state and receiver; obtain supplier/source classification clarification. Do not claim all source metadata verified."
    - flow_id: "e64eb06c-6dc9-45f1-b003-3dc6c44b27e2"
      row_ids:
        - "film_in"
        - "film_shipped"
      conflict: "CPC29220 points to luggage; names, CAS9002-88-4 and comment identify PE film. Controller permits conditional physical identity."
      required_clarification: "Verify actual PE film, additives, grade, virgin/recycled state and supplier dataset; seek source classification correction. Identity alone is not a complete background link."
  identity_rejections:
    - row_id: "offcuts_sold"
      reason: "dc25adc2-dfbe-4e5a-b7ff-0acac7d76fe4 explicitly says unprocessed roundwood/forest roadside; not saw-machined coproduct. Waste offcut identity cannot substitute for product coproduct."
    - row_id: "sawdust_sold"
      reason: "Wood chips/leavening agent, pellets and mixed hog fuel do not establish separated uncompressed untreated sawdust coproduct."
    - row_id: "used_oil_out"
      reason: "Waste alkaline liquor is a different material and remains rejected. Fresh direct state100 Used lubricating oil is conditionally compatible with the actual petroleum-based liquid subset at point of generation; composition, contamination, receiver and quantity-basis checks remain required."
    - row_id: "film_waste"
      reason: "7e78f0a8-c042-47ca-a742-3bac92be1477 is cleaned waste at mechanical recycling plant, not unprocessed factory film trimmings; PET and PP are different polymers."
    - row_id: "oil_in"
      reason: "PAO total-synthesis oil and wax/solvent lubricant are not petroleum-fraction machinery oil; selected petroleum oil metadata heating value is not a PCR default."
  background_compatibility_debts:
    - row_ids: ["electricity_in"]
      flow_id: "50657322-939c-4829-a87b-47c093bfa6a7"
      requirement: "Raw geography CN; verify actual supplier, region, year, below-1-kV delivery gate, loss convention and MJ reference quantity. Physical AC identity does not establish a global background."
    - row_ids: ["offcuts_sold", "sawdust_sold"]
      flow_id: "d07bf4c9-7cd0-46ad-a6b3-2fd11fe08f98"
      requirement: "Two separately measured concrete streams, not generic commodity datasets: actual lawful product/coproduct status, buyer-accepted specification and continuing use, species, solid/particle form, dimensions/particle size, treatment/adhesive/coating state, moisture, origin and receiver. Payment alone is insufficient; provider/downstream route, region, period and reference-quantity compatibility remain pending. No avoided credit."
    - row_ids: ["used_oil_out"]
      flow_id: "55d93375-7f04-4166-b2a2-88ce929051a5"
      requirement: "Actual liquid petroleum-based machinery oil waste at generation; base oil/additives, contaminants, source equipment/interval, measured dispatched mass, stock/retained oil, receiver treatment and provider reference-quantity compatibility. Treatment unspecified, not cleaned/regenerated oil; do not equate input with waste."
  incoming_stock_applicability: "Both selected kiln-dried sawn stock identities apply to measured incoming board thickness greater than 6 mm. At or below 6 mm requires a separately verified compatible identity; no plant thickness is invented."
  evidence_limitations:
    - "No empirical packaging-factory inventory, yield, moisture target, density, carbon fraction or emission factor supplied. All exchange amounts require declared site collection protocols."
    - "CORRIM regional softwood lumber survey is not an all-wood or packaging parameter source. No regional quantities/allocation shares adopted."
    - "EPA PTE factors exclude boilers and concern Pacific Northwest Indian Country sawmills; used only to screen mechanical dust and nested size definitions, never as default actual packaging emissions."
    - "Untreated cold route does not establish ISPM15 or export compliance; treatment and heated/combustion routes are excluded, requiring a separate supported extension."
  integration_pending: "Historical author integration requirement: verify shared aliases/catalog/coverage serially before consumption. Current mapping relation and acceptance are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; author cannot bypass or change shared artifacts."
