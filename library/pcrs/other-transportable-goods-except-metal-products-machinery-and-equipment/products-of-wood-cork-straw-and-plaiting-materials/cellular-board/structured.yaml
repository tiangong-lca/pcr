allocation_rules:
  - rule_id: a_physical
    applies_to: "all inventory rows"
    rule: "Maintain an unallocated process graph, dry wood/water/carbon ledger and physical external amounts first. Internal rework/captured dust never becomes a second final output. Never multiply physical product or coproduct mass by an allocation share."
    source_ids: []
  - rule_id: a_subdivide
    applies_to: "cellular_manufacture"
    rule: "Separate measurable product-specific phases and design cohorts before allocating joint environmental burdens. Shared meter attribution between lines requires observed phase energy/operating evidence, never a fabricated recipe average."
    source_ids: []
  - rule_id: a_coproduct
    applies_to: "sold_sawdust; waste_sawdust"
    rule: "Treat clean sawdust as a coproduct only with actual sale/function evidence, otherwise as waste. Preserve physical mass and equal lot identities. If unavoidable joint burdens cannot be related by a documented physical relation, use disclosed same-period net sales revenue shares for panels and that coproduct; retain a physical-basis sensitivity, prices, currency and zero/negative-price handling."
    source_ids: []
  - rule_id: a_no_credit
    applies_to: "waste outputs"
    rule: "Waste-treatment burden links follow the actual destination. Do not combine allocation with automatic avoided-fuel/recycling credits. A substitution scenario needs separately documented receiving function, quality, displacement and boundaries."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "cellular_manufacture"
      flow_role: "finished_panel"
      record_type: "foreground_record"
      raw_fields: "lot_id; design; accepted/reject count; tare; net mass; final moisture; A; t; cross-section; core spacing; skin axes; bond acceptance"
      collection_method: "Calibrated net panel weighing excluding packaging; calibrated area/thickness measurements and representative oven-dry moisture samples; archive design/BOM and acceptance records"
      unit: "kg; m2; m"
      frequency: "Each lot and representative phase testing"
      temporal_coverage: "Same declared production period including startup/idle/rejects and actual variation"
      site_scope: "Same design and factory boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/test reports; supplier and lot evidence; controls and missing scope"
    - protocol_id: cp_wood
      process_id: "cellular_manufacture"
      flow_role: "core_stock; face_veneer"
      record_type: "foreground_record"
      raw_fields: "supplier; species; grade; received/issued/returned mass; moisture; solid dimensions; opening/closing stock; phase handoffs"
      collection_method: "Weigh and reconcile material stock by species and lot; sealed representative moisture samples, oven-dry check; dimensional survey excludes cavities and lattice joint overlap"
      unit: "kg; m"
      frequency: "Each lot and representative phase testing"
      temporal_coverage: "Same declared production period including startup/idle/rejects and actual variation"
      site_scope: "Same design and factory boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/test reports; supplier and lot evidence; controls and missing scope"
    - protocol_id: cp_recipe
      process_id: "cellular_manufacture"
      flow_role: "uf_powder; nh4cl; wheat_extender"
      record_type: "foreground_record"
      raw_fields: "supplier powder recipe; each separate ingredient mass; solids/moisture; water; pot-life timestamps; contact area; spread; cure schedule; unused mixed glue"
      collection_method: "Calibrated ingredient scales and mixing batch records; supplier certificate plus tested solids; actual lath/skin glue-contact survey and press logs; record actual recipe rather than handbook defaults"
      unit: "kg; m2"
      frequency: "Each lot and representative phase testing"
      temporal_coverage: "Same declared production period including startup/idle/rejects and actual variation"
      site_scope: "Same design and factory boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/test reports; supplier and lot evidence; controls and missing scope"
    - protocol_id: cp_filler
      process_id: "cellular_manufacture"
      flow_role: "rock_wool"
      record_type: "foreground_record"
      raw_fields: "design; infill product; density; delivered/issued/returned mass; cavity placement; reject composition"
      collection_method: "Weigh rock-wool loading separately and inspect the wooden support path; determine whether infill changes declared product function; retain supplier/acceptance evidence"
      unit: "kg"
      frequency: "Each lot and representative phase testing"
      temporal_coverage: "Same declared production period including startup/idle/rejects and actual variation"
      site_scope: "Same design and factory boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/test reports; supplier and lot evidence; controls and missing scope"
    - protocol_id: cp_energy
      process_id: "cellular_manufacture"
      flow_role: "electricity"
      record_type: "foreground_record"
      raw_fields: "voltage; supplier/time mix; phase meters; press heaters; cutting; controls; idle/shared consumption; accepted mass"
      collection_method: "Calibrated customer-side meters; submeter phases and reconcile main meter, idle operation and shared users; electricity heating cannot be replaced by steam or fuel energy"
      unit: "kWh; MJ"
      frequency: "Each lot and representative phase testing"
      temporal_coverage: "Same declared production period including startup/idle/rejects and actual variation"
      site_scope: "Same design and factory boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/test reports; supplier and lot evidence; controls and missing scope"
    - protocol_id: cp_water
      process_id: "cellular_manufacture"
      flow_role: "mix_clean_water; wastewater; water_vapour"
      record_type: "foreground_record"
      raw_fields: "mix/clean water; material moisture; recipe water; discharge mass/composition; retained water; phase evaporative loss; reaction-water assumptions"
      collection_method: "Matched water meters/scales and stock reconciliation; sample outgoing wastewater composition; reconcile measured incoming/retained/discharged water before estimating vapour with stated uncertainty"
      unit: "kg"
      frequency: "Each lot and representative phase testing"
      temporal_coverage: "Same declared production period including startup/idle/rejects and actual variation"
      site_scope: "Same design and factory boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/test reports; supplier and lot evidence; controls and missing scope"
    - protocol_id: cp_pack
      process_id: "cellular_manufacture"
      flow_role: "pe_wrap; corrugated_pack"
      record_type: "foreground_record"
      raw_fields: "material identity; film/pad grade; issued/returned stock; actual net consumption; reused protection"
      collection_method: "Weigh film and corrugated pads separately; reconcile stock and reuse cycles; keep packaging outside B; record any additional real packing component as its own exchange"
      unit: "kg"
      frequency: "Each lot and representative phase testing"
      temporal_coverage: "Same declared production period including startup/idle/rejects and actual variation"
      site_scope: "Same design and factory boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/test reports; supplier and lot evidence; controls and missing scope"
    - protocol_id: cp_transport
      process_id: "cellular_manufacture"
      flow_role: "inbound_freight"
      record_type: "foreground_record"
      raw_fields: "cargo mass; loaded km; origin/destination; truck class; fuel/emission class; load; empty return; provider delivery coverage"
      collection_method: "Actual trip records and weighbridge logs; sum each matched cargo mass in tonnes times loaded distance; disclose background empty-return/load convention and prevent duplicate delivery"
      unit: "t*km"
      frequency: "Each lot and representative phase testing"
      temporal_coverage: "Same declared production period including startup/idle/rejects and actual variation"
      site_scope: "Same design and factory boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/test reports; supplier and lot evidence; controls and missing scope"
    - protocol_id: cp_residue
      process_id: "cellular_manufacture"
      flow_role: "sold_sawdust; clean_offcuts; waste_sawdust; bonded_offcuts; uncured_glue"
      record_type: "foreground_record"
      raw_fields: "phase; lot; moisture; glue contamination; mass; internal return; destination; treatment; sale invoice/price; opening/closing stock"
      collection_method: "Segregated calibrated waste/coproduct weighing and manifest/invoice records; reconcile each lot disposition and rework; separate clean wood, cured panel and uncured adhesive; never infer fuel eligibility from colour"
      unit: "kg"
      frequency: "Each lot and representative phase testing"
      temporal_coverage: "Same declared production period including startup/idle/rejects and actual variation"
      site_scope: "Same design and factory boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/test reports; supplier and lot evidence; controls and missing scope"
    - protocol_id: cp_air
      process_id: "cellular_manufacture"
      flow_role: "pm25; pm25_10; pm_over10; formaldehyde; methanol"
      record_type: "foreground_record"
      raw_fields: "phase/source; species; aerodynamic size fraction; sample dry/wet conditions; concentrations; exhaust flow; hours; capture/control efficiency; fugitive release; detection limits"
      collection_method: "Representative site stack/fugitive sampling under recorded production and ventilation; integrate matched mass rate/time, preserve raw nested PM results and derive only disjoint fractions; speciate gases, quantify censored results/uncertainty"
      unit: "kg"
      frequency: "Each lot and representative phase testing"
      temporal_coverage: "Same declared production period including startup/idle/rejects and actual variation"
      site_scope: "Same design and factory boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/test reports; supplier and lot evidence; controls and missing scope"
  calculation_rules:
    - id: batch_reference
      applies_to: "all inventory rows"
      rule: "x_norm = sum(x_physical) / B; retain raw exchange totals for the matched accepted panel cohort; never apply burden shares to these physical totals. The finished reference output is 1 kg."
      inputs:
        - x_physical
        - B
        - cp_output
      output: "x_norm"
      source_ids: []
    - id: geometry_conversion
      applies_to: "finished_panel"
      rule: "A_norm = sum(A) / B; V_envelope_norm = sum(A*t) / B. Solid wood volume is the measured sum of actual skins, frame and laths minus overlapping joints. V_void is the remaining designed cavity envelope; record actual infill separately. No solid-wood-density multiplication of V_envelope or V_void."
      inputs:
        - A
        - t
        - B
        - "component dimensions"
        - cp_output
        - cp_wood
        - cp_filler
      output: "measured mass-area-thickness relation"
      source_ids: []
    - id: material_water_carbon
      applies_to: "cellular_manufacture"
      rule: "Before burden allocation, reconcile whole-stream mass and elemental carbon separately: opening stock + inputs = closing stock + outputs + reported residual, using actual composition and all relevant boundary crossings. Chemical reactions do not generate or consume total elemental carbon. Separately reconcile molecular H2O and reactive wood/resin components using opening stock + inputs + evidenced formation = closing stock + outputs + evidenced consumption + reported residual. Quantify only actual cure/thermal/oxidation pathways and extent; phase changes are transfers, not reactions. A zero reaction term requires evidence of absence; unknown extent remains unresolved, with no assumed full cure, generic yield or balancing emission. Track retained binder/additives and wood versus fossil carbon separately. Internal transfers cancel only with matched endpoints; measured outputs containing reaction products are counted once. Keep uncertainty explicit and do not apply burden shares to physical outputs. Use measured or traceable species/composition carbon fractions, not a universal default; missing volatile species and residual mass must not be assigned automatically to water vapour."
      inputs:
        - cp_output
        - cp_wood
        - cp_recipe
        - cp_residue
        - cp_water
        - cp_air
      output: "unallocated physical balances"
      source_ids:
        - usda-wood-handbook-2021
    - id: disjoint_particles
      applies_to: "pm25; pm25_10; pm_over10"
      rule: "For matched tests, PM_2.5_10 = PM10 - PM2.5 and PM_over10 = total_PM - PM10, only when sampling boundaries are compatible. Physical particulate mass is the sum of the three disjoint fractions. Do not add nested total_PM or PM10 again; negative differences require review rather than clamping to zero."
      inputs:
        - "matched total_PM"
        - PM10
        - PM2.5
        - cp_air
      output: "disjoint particulate exchanges"
      source_ids: []
    - id: burden_attribution
      applies_to: "cellular_manufacture"
      rule: "Keep a separate burden ledger. For documented economic allocation of unavoidable joint burdens only, f_j = revenue_j / sum(revenue_j); assigned burden_j = f_j * joint burden plus product-specific burden. Keep all physical outputs unchanged; disclose sensitivity and actual sales basis."
      inputs:
        - "joint burden"
        - "product-specific burden"
        - sales
        - cp_residue
      output: "separate attributed burden ledger"
      source_ids: []
  data_quality_requirements:
    - id: dq_boundary
      applies_to: "all inventory rows"
      requirement: "Retain actual cross-section/BOM, delivery endpoints, identity/property/unit matches, species, treated state, supplier/time and complete measurement scope. UUID identity alone does not establish a usable provider."
      evidence: "Actual raw records and scope/uncertainty disclosure"
    - id: dq_primary
      applies_to: "all inventory rows"
      requirement: "Collect site data under the declared protocols before dataset completion. No synthetic values, literature-to-industry extrapolation or default recipe. Record missing/under-detection observations and whether each conditional row is absent or unresolved."
      evidence: "Actual raw records and scope/uncertainty disclosure"
    - id: dq_units
      applies_to: "all inventory rows"
      requirement: "B, lot cohort and moisture/area/thickness basis must match. Keep calibration, repeat measurements, uncertainties, disjoint PM size definitions, concentration and wet/dry corrections. Supply actual provider conversions; secondary database property coefficients are not measured density."
      evidence: "Actual raw records and scope/uncertainty disclosure"
    - id: dq_completeness
      applies_to: "cellular_manufacture"
      requirement: "List omitted operations, unmatched suppliers, additional real ingredients/consumables/packaging/wastes/species and their material significance. Add atomic exchanges before use when these occur. No all-tools-failed or unsupported measurement result can certify completeness."
      evidence: "Actual raw records and scope/uncertainty disclosure"
validation_rules:
  - rule_id: v_construction
    applies_to: "finished_panel"
    rule: "Require spaced wooden parallel/lattice support and separate skins, glue and optional infill. Reject solid blockboard, paper/aluminium honeycomb and complete doors even when a label says cellular board."
    source_ids: []
  - rule_id: v_reference
    applies_to: "all inventory rows"
    rule: "Exactly one completed reference product output equals 1 kg net panel; all amounts and protocol aggregation are per the same 1 kg reference flow. Missing UUIDs stay unresolved, not replaced with near products or hidden identities."
    source_ids: []
  - rule_id: v_balances
    applies_to: "cellular_manufacture"
    rule: "Audit unallocated physical transfers and separate dry-wood, water and carbon balances before inspecting burden allocation. Cavities never become solid wood volume. Internal link quantities must agree; rejects, stock and rework cannot vanish."
    source_ids: []
  - rule_id: v_air
    applies_to: "pm25; pm25_10; pm_over10; formaldehyde; methanol; water_vapour"
    rule: "Verify exact substance/size/medium and post-control release basis. No correction flows, total VOC proxy, nested-PM double count or indoor-to-outdoor substitution. Keep biogenic and fossil origins separate whenever actual carbon exchanges are added."
    source_ids: []
  - rule_id: v_readiness
    applies_to: "all inventory rows"
    rule: "A dataset is incomplete when actual flow/provider identity, quantities, useful-heat basis, source scope or measurement relationships are unresolved. State performed/skipped checks and uncertainty. Classification acceptance and scientific review are separate decisions."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site-specific foreground cellular wood-panel conversion with verified upstream links"
  downstream_use: "secondary_dataset; background_dataset only with declared route/provider completeness"
  allowed_use: "Matched interior panel manufacturing studies after applicability and dataset-completeness review"
  excluded_use: "Universal 31610/3141/3142 coverage, solid blockboard, paper/aluminium honeycomb, lifetime/equivalent-service claims, unverified provider substitution"
  required_metadata: "Spaced parallel/lattice wooden core and frame geometry; wood species and grades per component; face/back thickness and grain axes; measured panel area/thickness/net mass/final moisture; cavity fraction and infill identity/mass; powder UF formulation, separate additives/water and solids; glue-contact area and actual spread; cure temperature/pressure/time and acceptance; uncoated interior state; site/period; input supplier/delivery gates; electricity voltage; packaging excluded; waste/air compartments and treatment destinations"
  required_quality_disclosure: "Primary period, represented production, measured mass/area/thickness, moisture, balances, unresolved identities/providers, omissions, allocation and uncertainty"
  update_trigger: "Changed core/skin/infill design, adhesive recipe/route, utilities, species, delivery/treatment, controls, supplier boundaries or material new evidence"
data_sources:
  - id: "un-cpc-cellular-3"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0, 31610 explanatory note, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/31610"
    used_for: "Spaced parallel/lattice wood core and downstream panel uses; classification only, no quantities"
  - id: "un-cpc-plywood-3"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0, 31411 explanatory note, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/31411"
    used_for: "Broader plywood explanatory inclusion mentioning cellular board; unresolved mapping overlap, no automatic coverage"
  - id: "un-cpc-laminated-3"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0, 31421 explanatory note, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/31421"
    used_for: "Title/note physical-classification caution for laminated/veneered wood; no inferred core identity"
  - id: "usda-wood-handbook-2021"
    type: "handbook"
