measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "B = total accepted net finished panel mass of the same design, site, lots and period; weigh on calibrated scales excluding packaging using cp_output. Inventory denominator is B, not input mass or dry wood mass."
  - id: panel_geometry
    applies_to: "reference product"
    required_property_ref:
      name: "Mass; area; length"
      uuid: ""
    required_unit: "kg; m2; m"
    rule: "Measure each accepted panel area A and final thickness t with calibrated length/thickness tools; rho_app = B / sum(A*t). Area per 1 kg = sum(A)/B. Apparent envelope volume includes cavities and is never solid wood volume. Separate actual solid face, frame and lath volumes, avoid overlapping lattice joints, and measure infill independently."
  - id: wood_moisture
    applies_to: "core_stock; face_veneer; residue ledger"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "u = (m_wet - m_od) / m_od; m_od = m_wet / (1 + u). Determine representative material moisture by sealed samples and oven-dry weighing or a calibrated instrument checked against it, cp_wood. Do not confuse dry-basis u with wet-basis water fraction. Keep panel net mass B at actual moisture. Source: usda-wood-handbook-2021."
  - id: glue_component_basis
    applies_to: "uf_powder; nh4cl; wheat_extender; mix_clean_water"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record as-supplied mass, measured solids and separately added water per recipe batch; glue-contact spread uses actual wood/skin contact area, not total cavity envelope. Dry resin solids are a composition ledger, not a second exchange. No fixed recipe or supplier solids default. Source: usda-wood-handbook-2021."
  - id: electric_energy
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "E_MJ = 3.6 * E_kWh; use matched customer-side electricity meters, cp_energy. The database energy label does not make electricity combustible fuel. MJ steam/heat alone never establishes useful delivered heat; a heat route needs supplier boundary and measured enthalpy balance before adoption."
