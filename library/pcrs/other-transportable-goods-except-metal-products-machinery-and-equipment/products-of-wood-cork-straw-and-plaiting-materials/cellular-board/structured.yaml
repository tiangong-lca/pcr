      applies_to: "cellular_manufacture"
      rule: "Include receipt/conditioning, core ripping and frame/lattice assembly, powder UF mixing and spread, skin lay-up, electric pressing/cure, cooling, final conditioning, trimming, acceptance, packing and controls. Keep phase throughput and energy/waste measurements within one foreground unit."
