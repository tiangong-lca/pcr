    - rule_id: b_route
      applies_to: "cellular_manufacture"
      rule: "Exclude on-site combustion from this declared route. If actual fuel use, kiln drying, steam or purchased heat is present, expand the physical inventory and evidence before use; never hide it in electricity. Any biogenic CO2 actually emitted in an expanded route stays in LCI independently of an impact-reporting convention."
