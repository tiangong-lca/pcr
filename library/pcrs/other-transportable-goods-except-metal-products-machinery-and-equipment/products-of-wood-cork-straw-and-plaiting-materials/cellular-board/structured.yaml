      applies_to: "inbound_freight"
      rule: "Include actual inbound delivery either once in the matched supplier dataset or once as the specific freight exchange. Record delivery/treatment provider endpoints; missing supplier coverage is not a cutoff. Waste treatment burdens remain linked to actual destination."
