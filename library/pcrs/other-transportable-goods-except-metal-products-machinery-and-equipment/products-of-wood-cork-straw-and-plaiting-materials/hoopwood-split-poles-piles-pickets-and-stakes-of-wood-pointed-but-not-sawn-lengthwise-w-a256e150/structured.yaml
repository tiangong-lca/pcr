allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Separate batches and meter stages first to avoid allocation where feasible. Keep a complete physical wood, moisture and carbon ledger before any burden allocation: incoming wood plus opening stock equals accepted output, residues, emissions and closing stock with measured reconciliation residuals. Internal stage links carry identical physical quantities at both ends. A coproduct's physical output is never multiplied by an allocation fraction."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "This route's residue rows describe discarded wastes. If any bark, split offcut or sawdust has a separately sold function, identify it as a real coproduct with a verified atomic product row and documented end state before use. Burden allocation then requires an independently reviewed causal relationship or justified alternative, with site mass, moisture, value and sensitivity evidence. No universal mass/economic allocation share, displaced-fuel credit or avoided-disposal credit is specified. External waste management remains linked once; upstream forestry allocation must be disclosed separately."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "stake_conversion"
      flow_role: "final_stake"
      record_type: "weighing"
      raw_fields: "batch; accepted net kg; packaging tare; species; geometry; gate moisture; scale calibration"
      collection_method: "Weigh the accepted batch on a calibrated scale, excluding rejected stakes and packaging. Record its raw net accepted campaign mass B in kg; this is the common denominator, not an exchange already divided by B."
      unit: "kg"
      frequency: "each accepted batch"
      temporal_coverage: "Same traced campaign including storage and dispatch"
      site_scope: "One documented conversion yard"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration and acceptance records"
    - protocol_id: cp_wood
      process_id: "stake_conversion"
      flow_role: "wood_input"
      record_type: "receiving records"
      raw_fields: "batch; supplier; species proof; delivered wet kg; moisture; bark state; upstream dataset; transport coverage; stock"
      collection_method: "Weigh delivered chestnut logs and reconcile opening/closing stock and traced upstream delivery. Record consumed delivered roundwood as raw campaign kg, without division by B."
      unit: "kg"
      frequency: "each received lot"
      temporal_coverage: "Same traced campaign including storage and dispatch"
      site_scope: "One documented conversion yard"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "species, weighbridge and supplier records"
    - protocol_id: cp_energy
      process_id: "stake_conversion"
      flow_role: "electricity"
      record_type: "meter records"
      raw_fields: "meter starts/ends; kWh; interval; voltage; supply mix; transformer losses; stage; other users; accepted net kg"
      collection_method: "Read calibrated meters and isolate actual attributable demand; reconcile to purchased supply. Convert attributable purchased campaign kWh to raw campaign MJ by multiplying by 3.6 once, without division by B."
      unit: "MJ"
      frequency: "each batch or reconciled campaign"
      temporal_coverage: "Same traced campaign including storage and dispatch"
      site_scope: "One documented conversion yard"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration and supplier supply-boundary records"
    - protocol_id: cp_maintenance
      process_id: "stake_conversion"
      flow_role: "lubricating_oil; spent_oil"
      record_type: "maintenance records"
      raw_fields: "oil specification; opening/closing stock; purchases; replenishment; retained kg; recovered used kg; leakage assessment; accepted net kg"
      collection_method: "Measure net consumption and recovered used oil independently; inspect loss pathways. Record each distinct input or output as separate raw campaign kg, without division by B."
      unit: "kg"
      frequency: "each service event reconciled to campaign"
      temporal_coverage: "Same traced campaign including storage and dispatch"
      site_scope: "One documented conversion yard"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "oil specification, service logs and waste transfer records"
    - protocol_id: cp_pack
      process_id: "stake_conversion"
      flow_role: "polypropylene_twine"
      record_type: "packing records"
      raw_fields: "twine polymer; packaging issue/return kg; bundle count; accepted net kg; other packaging"
      collection_method: "Weigh PP twine issued less returns and reconcile material actually shipped. Record shipped twine as raw campaign kg, without division by B."
      unit: "kg"
      frequency: "each shipping batch"
      temporal_coverage: "Same traced campaign including storage and dispatch"
      site_scope: "One documented conversion yard"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "packing records and material specification"
    - protocol_id: cp_residues
      process_id: "stake_conversion"
      flow_role: "bark_waste; offcut_waste; sawdust_waste"
      record_type: "weighing and waste records"
      raw_fields: "separate residue type; wet kg; dry-basis moisture; stage; destination; sold/discarded status; stocks; accepted net kg"
      collection_method: "Weigh segregated residue streams; reconcile mass, dust capture and destinations. Record each distinct waste stream as separate raw campaign kg, without division by B."
      unit: "kg"
      frequency: "each batch and transfer"
      temporal_coverage: "Same traced campaign including storage and dispatch"
      site_scope: "One documented conversion yard"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing, moisture and destination records"
    - protocol_id: cp_air
      process_id: "stake_conversion"
      flow_role: "pm25; pmcoarse; pmover10"
      record_type: "emission measurements"
      raw_fields: "operation; exhaust/fugitive boundary; sampled air volume; mass; particle fractions; control status; activity; sampling uncertainty; accepted net kg"
      collection_method: "Measure actual outdoor releases with validated particle-size sampling and traced activity integration; characterize fugitive releases separately. Record each exclusive emitted particle fraction as separate raw campaign kg, without division by B."
      unit: "kg"
      frequency: "representative operating states and campaign reconciliation"
      temporal_coverage: "Same traced campaign including storage and dispatch"
      site_scope: "One documented conversion yard"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling methods, calibration, exhaust/fugitive coverage and uncertainty"
    - protocol_id: cp_moisture
      process_id: "stake_conversion"
      flow_role: "water_vapour"
      record_type: "paired moisture and water records"
      raw_fields: "batch; stage; wet kg; oven-dry sample kg; stack dates; weather; rain ingress; drainage kg; rejects; stocks; accepted net kg"
      collection_method: "Use paired same-lot wet/dry samples and traceable mass records; reconcile actual seasoning/storage water loss separately from liquid drainage. Record evaporated water from the physical water balance as raw campaign kg, without division by B."
      unit: "kg"
      frequency: "receiving, before/after storage and dispatch"
      temporal_coverage: "Same traced campaign including storage and dispatch"
      site_scope: "One documented conversion yard"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sample representativeness, drying-test records and water balance"
    - protocol_id: cp_route
      process_id: "stake_conversion"
      flow_role: "all inventory rows"
      record_type: "site observation"
      raw_fields: "stage order; equipment; manual/electric operation; natural seasoning; absence of chemical/artificial drying/combustion; all utility/material/waste/emission pathways"
      collection_method: "Inspect the actual process and supplier records; identify all conditional and unlisted physical exchanges. Keep observations for the same batch or campaign; route observations are not a numerical exchange numerator."
      unit: "stage records"
      frequency: "initial survey and every route change"
      temporal_coverage: "Same traced campaign including storage and dispatch"
      site_scope: "One documented conversion yard"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "process survey, photos, equipment and supplier records"
  calculation_rules:
    - id: normalize_batch
      applies_to: "all inventory rows"
      rule: "Each campaign exchange total is divided once by accepted net gate mass B in kg; final_stake is 1 kg."
      inputs:
        - "campaign exchange totals"
        - B
        - cp_mass
      output: "exchange amount per 1 kg reference flow"
      source_ids: []
    - id: dry_wood_balance
      applies_to: "wood_input; final_stake; bark_waste; offcut_waste; sawdust_waste"
      rule: "For each wood stream, dry mass = wet mass / (1 + u); reconcile dry wood inputs plus opening stock against outputs plus closing stock, including airborne wood dust and quantified losses."
      inputs:
        - "wet masses"
        - u
        - stocks
        - cp_moisture
        - cp_residues
        - cp_air
      output: "physical dry-wood ledger before allocation"
      source_ids:
