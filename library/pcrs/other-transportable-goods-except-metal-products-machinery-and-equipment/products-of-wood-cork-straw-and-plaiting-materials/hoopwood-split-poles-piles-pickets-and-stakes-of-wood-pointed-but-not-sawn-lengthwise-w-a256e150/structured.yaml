    - id: water_balance
      applies_to: "water_vapour"
      rule: "Evaporated water = incoming wood water + opening water stock + rain ingress - outgoing wood/residue water - closing water stock - liquid drainage; retain a separate reconciliation residual and do not force it to evaporation."
      inputs:
        - "paired wet/dry mass"
        - "water ingress"
        - drainage
        - stock
        - cp_moisture
      output: "evaporated water campaign kg; normalized water_vapour"
      source_ids:
        - usda-wood-handbook-2021
    - id: particle_partition
      applies_to: "pm25; pmcoarse; pmover10"
      rule: "On the same sampling basis, PMcoarse = PM10 - PM2.5 and PMover10 = total particulate - PM10. Check ordered nonnegative totals; final exchanges are PM2.5, PMcoarse and PMover10 only."
      inputs:
        - cp_air
        - "total particulate"
        - PM10
        - PM2.5
      output: "three exclusive airborne particle fractions"
      source_ids: []
    - id: carbon_balance
      applies_to: "wood_input; final_stake; bark_waste; offcut_waste; sawdust_waste"
      rule: "Use measured dry mass and species/lot-specific carbon evidence for wood streams; reconcile carbon inputs, stocks, outputs and documented releases before burden allocation. Keep biogenic carbon separate from fossil lubricant/packaging carbon. No universal carbon fraction or sink credit."
      inputs:
        - cp_wood
        - cp_mass
        - cp_residues
        - cp_air
        - "lot carbon evidence"
      output: "physical wood-carbon ledger and explicit uncertainty"
