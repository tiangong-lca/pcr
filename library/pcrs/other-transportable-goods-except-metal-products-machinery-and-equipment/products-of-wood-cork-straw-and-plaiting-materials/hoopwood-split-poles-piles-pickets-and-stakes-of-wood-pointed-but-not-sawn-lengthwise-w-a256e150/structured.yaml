system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground includes receiving, grading, cross-cutting to length, bark removal, grain cleaving, pointing, optional natural seasoning, handling, rejection, dust control, maintenance and bundling. Stages remain separately metered or observed within one aggregated foreground unit. There is only one final-product output; physical transfer between pointing, seasoning and bundling is internal, not another saleable reference output."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Natural seasoning is conditional: record stack arrangement, dates, site weather, initial/final moisture, rejects and handling energy. Green delivery may have no dedicated seasoning stage, but incidental storage moisture change still needs reconciliation. The Wood Handbook differentiates natural air drying from fan-assisted or heated drying (usda-wood-handbook-2021, p. 13–6); sawn-lumber schedules and moisture targets are not imported into stakes. Artificial drying is outside this supported route. A future extension must identify its actual equipment, heat source, water/condensate, drying emissions and measured energy; a kiln-dried lumber list is insufficient. Onsite combustion, fuel-powered equipment and heat/steam supply are excluded from this route and require additional atomic rows before application. Existing upstream biogenic CO2 exchanges must remain in the linked LCI; a climate-accounting convention cannot delete physical biogenic emissions. Stored product carbon is not an avoided-emission credit."
      source_ids: []
