measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh accepted delivered net panel using cp_product; all inventory uses per 1 kg reference flow. Reject gross packaging mass, oven-dry wood mass or theoretical density substitutes."
  - id: coated_moisture
    applies_to: "coated_board; finished_panel; coated_offcut; captured_dust"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Validate the coated/bonded matrix water method with cp_material/cp_product; drying mass loss may contain paint/bond volatiles, not only water. For unglued wood MC=100×water mass/oven-dry wood mass (usda-wood-handbook-2021); no default species density conversion."
  - id: electricity_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Use cp_energy; 1 kWh = 3.6 MJ. State that the platform Net calorific value property carries electrical energy; match consumer-side low-voltage delivery, supplier and loss basis; unknown bases leave provider linkage pending."
  - id: wet_paint_basis
    applies_to: "edge_paint; waste_paint; washwater"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record whole-formulation wet paint; cp_coating separates dry solids, formulation water, volatile constituents and additional water. Waterborne is not emission-free; solids, density and volatility require measurement or supplier evidence."
  - id: particle_partition
    applies_to: "pm25; pmcoarse; pmover10"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For the same outlet, period and method PM2.5, PM10 and total filterable PM are nested; only comparable measurements permit coarse=PM10−PM2.5 and over10=total PM−PM10. Negative differences or incompatible tests must not be clamped to zero or assigned assumed fractions."
