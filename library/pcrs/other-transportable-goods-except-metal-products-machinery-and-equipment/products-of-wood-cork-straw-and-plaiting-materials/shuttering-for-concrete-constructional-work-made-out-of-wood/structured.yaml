  reference_flow_link: "finished_panel"
system_boundary:
  rules:
    - rule_id: boundary_actual_route
      applies_to: "manufacturing"
      rule: "Include receiving, cutting, conditional drilling, dust collection, brushing exposed edges/holes, ambient drying ventilation, inspection, packing, electric handling and production-period equipment maintenance. Existing film is upstream; no new on-site film, hot press or combustion."
      source_ids:
        - wisa-formwork-2020
        - metsa-formwork-manual
        - metsa-overlaid-epd-2024
    - rule_id: boundary_one_unit
      applies_to: "manufacturing"
      rule: "Aggregate machining, sealing and packing as one foreground unit with one delivered finished output. Retain stage physical measurements/loops; both ends of each internal transfer have equal quantity, lot and state, not another external product exchange."
      source_ids:
        - wisa-formwork-2020
    - rule_id: boundary_releases
      applies_to: "manufacturing"
      rule: "Separate captured dust from actual outdoor releases. Brush washwater and residual paint go to external treatment, without assumed direct water discharge or on-site incineration; actual such routes require method/species extension. Do not duplicate background electricity emissions as on-site emissions."
      source_ids:
        - epa-sawmill-pm-2014
    - rule_id: boundary_fasteners
      applies_to: "finished_panel"
      rule: "Unframed panel delivery has no supplied screws, nails, clamps or supports; installation hardware belongs to a separate construction service. If hardware is actually supplied, do not silently exclude it: this scope is unavailable."
      source_ids:
        - wisa-formwork-2020
        - metsa-formwork-manual
    - rule_id: boundary_use_service
      applies_to: "dataset"
      rule: "This manufacturing PCR explicitly excludes reuse service. A service extension independently measures contact area and accepted pours, panel-specific turns/retirement, replacement/loss, repair materials, cleaning water/energy/effluent, release agents, installation hardware and handling. Attribute manufacturing once across measured service, without buying/manufacturing a full panel again each pour; manufacturer reuse figures and building life are not defaults."
      source_ids:
        - wisa-formwork-2020
        - metsa-formwork-manual
        - metsa-overlaid-epd-2024
boundary_abstraction:
  declared_starting_condition: "Receipt of purchased cured double-film all-birch all-veneer PF plywood with original edge seal and auxiliaries; upstream operations not repeated in this foreground"
  starting_condition_role: "Manufacturing receiving cutoff; not a burden-free input"
  product_classification_scope: "Drawing-specific unframed formwork-facing subset of CPC 31623; no mapping claim for stock plywood or other shuttering products"
  recursive_input_rule: "No purchased finished shuttering for refurbishment in this route. Same-batch internal rework uses equal-quantity internal links, without another purchase/manufacturing burden; purchased fabricated/used shuttering requires a method extension."
  upstream_dataset_requirement: "Match board wood/PF/double-film/original-edge-seal state, auxiliary production, electricity, tap water, inbound transport and external waste treatment. Uncoated board alone cannot complete coated-board data; do not add already-included film or transport again."
  disclosure: "Disclose site, survey period, route/states, manufacturing/transport delivery cutoffs, providers/destinations, pending backgrounds, measurement completeness and exclusion of use service."
