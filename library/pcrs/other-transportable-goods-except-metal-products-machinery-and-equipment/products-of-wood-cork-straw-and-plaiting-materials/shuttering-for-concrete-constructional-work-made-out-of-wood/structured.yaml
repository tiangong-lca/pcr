allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "manufacturing"
    rule: "Prefer dedicated batch measurements, submeters or equipment-time attribution backed by measured causal relationships; include standby/control loads. Retain site totals, physical and burden ledgers; attribution shares sum to one, never multiply physical coproduct outputs by burden shares to manufacture a balance."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "coated_offcut; captured_dust; waste_paint; washwater"
    rule: "Accepted panels are the only manufacturing reference in this route; waste-treatment burdens belong to production. Scrap sale alone does not establish an independent coproduct; no default negative burden, recycling or fuel-substitution credit. Internal rework reduces only actual new-material demand; do not repeat prior manufacture."
    source_ids:
      - metsa-overlaid-epd-2024
  - rule_id: allocation_extension
    applies_to: "dataset"
    rule: "Actual independent coproducts, shared other routes or reuse services require disclosed independent measurements, subdivision or justified physical/economic methods and sensitivity; unresolved choices preclude a complete dataset, and softwood survey shares cannot be transplanted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "manufacturing"
      flow_role: "finished_panel"
      record_type: "acceptance records and weighing"
      raw_fields: "order/drawing revision; lot; birch/PF/film state; contour/holes/thickness/area; batch tare-excluded net mass; matrix moisture method; acceptance/rework/rejects; shipments"
      collection_method: "Weigh dry accepted panels on a calibrated scale, excluding transport packaging; reconcile same-order configuration, drawings, holes and surface acceptance, not catalogue mass."
      unit: "kg; m; m2; moisture fraction"
      frequency: "each batch and relevant event"
      temporal_coverage: "same declared continuous production period; retain dates and abnormal intervals"
      site_scope: "same factory and order route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, supplier evidence, lot records, anomalies/uncertainty and closure residuals"
    - protocol_id: cp_material
      process_id: "manufacturing"
      flow_role: "coated_board"
      record_type: "incoming lots and stock weighing"
      raw_fields: "supplier/background; species/layup/PF; double-film and original edges; incoming net mass/dimensions; opening/closing/WIP; consumption; returns; water/dry wood/bond-film composition and method"
      collection_method: "Check supplier declarations lot by lot, weigh incoming/stock net material; use a water method validated for coated/bonded matrix, separate non-water volatiles and track cut lists/stage physical totals."
      unit: "kg; m; moisture fraction"
      frequency: "each batch and relevant event"
      temporal_coverage: "same declared continuous production period; retain dates and abnormal intervals"
      site_scope: "same factory and order route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, supplier evidence, lot records, anomalies/uncertainty and closure residuals"
    - protocol_id: cp_coating
      process_id: "manufacturing"
      flow_role: "edge_paint"
      record_type: "formulation/issue-return/weighing"
      raw_fields: "paint name/TDS/SDS; waterborne acrylic evidence; wet mass/density/solids/volatile CAS; brush and edge/hole area; extra dilution water; retained dry coat; residue; cleaning fate"
      collection_method: "Weigh issued/returned wet paint, verify actual application/drying and supplier suitability; formulation/test distinguishes retention, volatilization, waste and residue on containers/tools."
      unit: "kg; mass fraction; m2"
      frequency: "each batch and relevant event"
      temporal_coverage: "same declared continuous production period; retain dates and abnormal intervals"
      site_scope: "same factory and order route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, supplier evidence, lot records, anomalies/uncertainty and closure residuals"
    - protocol_id: cp_energy
      process_id: "manufacturing"
      flow_role: "electricity"
      record_type: "meter/runtime records"
      raw_fields: "submeter start/end kWh; production/standby/extraction/ventilation/packing/handling runtime; lots; voltage/location/provider/period; loss and attribution evidence"
      collection_method: "Use submeters or measured calibrated power/runtime against invoices; identify shared loads. Match low-voltage consumer background to meter boundary; do not attach a high-voltage production mix directly to an end-use meter."
      unit: "kWh; MJ; h"
      frequency: "each batch and relevant event"
      temporal_coverage: "same declared continuous production period; retain dates and abnormal intervals"
      site_scope: "same factory and order route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, supplier evidence, lot records, anomalies/uncertainty and closure residuals"
    - protocol_id: cp_water
      process_id: "manufacturing"
      flow_role: "tap_water; washwater; water_vapour"
      record_type: "meters/weighing/water ledger"
      raw_fields: "tap/paint/additional/tool/board water; washwater mass; density/temperature; retention/evaporation/stocks; suspended/dissolved constituents; receiver"
      collection_method: "Measure fresh/effluent/board/paint water and close water ledger; separate wastewater water and constituents to avoid mass duplication. Drying loss is vapour only after confirming water identity."
      unit: "kg; m3; density; temperature"
      frequency: "each batch and relevant event"
      temporal_coverage: "same declared continuous production period; retain dates and abnormal intervals"
      site_scope: "same factory and order route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, supplier evidence, lot records, anomalies/uncertainty and closure residuals"
    - protocol_id: cp_pack
      process_id: "manufacturing"
      flow_role: "pe_wrap; pp_strap; wood_pallet"
      record_type: "packaging BOM/weighing/return ledger"
      raw_fields: "each packaging material/net mass; pack/pallet specification; batch issues/returns/stocks; actual retention/loss/repair; background inclusions"
      collection_method: "Weigh each material separately; reconcile shipped packaging and actual pallet returns, check whether upstream already contains containers/packaging; no assumed reuse allocation."
      unit: "kg; count"
      frequency: "each batch and relevant event"
      temporal_coverage: "same declared continuous production period; retain dates and abnormal intervals"
      site_scope: "same factory and order route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, supplier evidence, lot records, anomalies/uncertainty and closure residuals"
    - protocol_id: cp_waste
      process_id: "manufacturing"
      flow_role: "coated_offcut; captured_dust; waste_paint; paint_container; discarded_pe"
      record_type: "waste weighing and transfer records"
      raw_fields: "material/bond/film/paint/water; container tare/net; capture point; rework/stocks; receiver/transport/actual treatment; adhered residue"
      collection_method: "Weigh streams separately, retain treatment receipts and reconcile dust capture/outlets; do not duplicate empty container polymer/residue with wet paint/washwater."
      unit: "kg; mass fraction"
      frequency: "each batch and relevant event"
      temporal_coverage: "same declared continuous production period; retain dates and abnormal intervals"
      site_scope: "same factory and order route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, supplier evidence, lot records, anomalies/uncertainty and closure residuals"
    - protocol_id: cp_maintenance
      process_id: "manufacturing"
      flow_role: "mineral_oil; used_oil"
      record_type: "equipment oil issue/drain records"
      raw_fields: "oil formulation; equipment/lot; additions/drains; stock/equipment retention; attributable runtime; waste-oil fate"
      collection_method: "Weigh additions/drains for the production period, reconcile equipment retention/stocks; shared maintenance needs attribution evidence."
      unit: "kg; h"
      frequency: "each batch and relevant event"
      temporal_coverage: "same declared continuous production period; retain dates and abnormal intervals"
      site_scope: "same factory and order route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, supplier evidence, lot records, anomalies/uncertainty and closure residuals"
    - protocol_id: cp_air
      process_id: "manufacturing"
      flow_role: "pm25; pmcoarse; pmover10; formaldehyde; butoxyethanol"
      record_type: "outlet measurements and species screening"
      raw_fields: "outlet/location/compartment; gas flow/T/P/humidity/dry-wet standard; concentration/time; filtration/size definition; measured control performance; CAS/SDS; detection limit/non-detect; captured fate/shared outlet"
      collection_method: "Use traceable outlet measurements or validated species balances; match concentration/gas volume dry-wet/standard states and actual operating time; count shared outlets once, report non-detects rather than automatic zeros."
      unit: "kg; mass/volume; gas volume/time; h; T/P"
      frequency: "each batch and relevant event"
      temporal_coverage: "same declared continuous production period; retain dates and abnormal intervals"
      site_scope: "same factory and order route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, supplier evidence, lot records, anomalies/uncertainty and closure residuals"
    - protocol_id: cp_carbon
      process_id: "manufacturing"
      flow_role: "co2_bio"
      record_type: "material carbon analysis and release screening"
      raw_fields: "dry wood/carbon content; PF/film/paint fossil carbon; product/waste/stocks; biogenic oxidation evidence and CO2; residual/measurement error"
      collection_method: "Close biogenic/fossil carbon using actual material analysis or supplier primary records; do not convert unexplained residual entirely to CO2 or invent forest uptake credit at fabrication boundary."
      unit: "kg; mass fraction"
      frequency: "each batch and relevant event"
      temporal_coverage: "same declared continuous production period; retain dates and abnormal intervals"
      site_scope: "same factory and order route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, supplier evidence, lot records, anomalies/uncertainty and closure residuals"
    - protocol_id: cp_transport
      process_id: "manufacturing"
      flow_role: "road_freight"
      record_type: "carrier leg records"
      raw_fields: "load/lot; origin/destination; actual wet transported kg and packaging; km; vehicle/fuel/payload/backhaul; delivered-provider inclusions; treatment transport inclusions"
      collection_method: "Reconcile each leg with weigh tickets, invoices and actual route measurements; match provider service boundaries, without counting internal electric handling as road transport."
      unit: "kg*km; kg; km"
      frequency: "each actual shipment"
      temporal_coverage: "actual supply/waste legs for the declared production cohort"
      site_scope: "same factory and order"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets, route records, carrier background and duplication check"
  calculation_rules:
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "x_i = attributable inventory-adjusted exchange total / Q; Q is same-cohort accepted delivered net panel kg from cp_product; finished reference output is 1 kg. Match stocks/WIP to cohorts, never normalize by pours."
      inputs:
        - cp_product
        - "all row collection protocols"
      output: "inventory per 1 kg reference flow"
      source_ids: []
    - id: calc_electricity
      applies_to: "electricity"
      rule: "Electricity MJ=measured kWh×3.6; establish attribution and meter boundary first, retain raw kWh."
      inputs:
        - cp_energy
      output: "MJ"
      source_ids: []
    - id: calc_paint
      applies_to: "edge_paint; waste_paint; washwater; water_vapour; butoxyethanol"
      rule: "Whole wet-paint consumption=issued−returned−stock increase; wet paint=retained solids/water/volatiles+waste+air+equipment-stock change, with measured constituent partitions and extra water separate. Unknown volatilization is not all water or VOC."
      inputs:
        - cp_coating
        - cp_water
        - cp_air
        - cp_waste
      output: "wet-paint component ledger"
      source_ids:
        - wisa-formwork-2020
    - id: calc_physical_balance
      applies_to: "manufacturing"
      rule: "Received+opening stocks=accepted shipments+each waste+actual air+closing stocks; reconcile dry wood, bond/film/paint solids and water separately; equal-quantity internal loops cancel. Packaging and equipment oil have separate subledgers, not panel mass."
      inputs:
        - cp_material
        - cp_coating
        - cp_product
        - cp_water
        - cp_waste
        - cp_pack
        - cp_maintenance
        - cp_air
      output: "absolute physical ledger and residuals"
      source_ids:
        - usda-wood-handbook-2021
    - id: calc_particles
      applies_to: "pm25; pmcoarse; pmover10"
      rule: "Same-method/outlet bins are PM2.5, PM10−PM2.5 and total filterable PM−PM10, summed once; separate captured dust, keep negative differences/unknown size/condensable-method mismatch pending."
      inputs:
        - cp_air
        - cp_waste
      output: "disjoint particle masses"
      source_ids:
        - epa-sawmill-pm-2014
    - id: calc_air_mass
      applies_to: "formaldehyde; butoxyethanol"
      rule: "Actual emitted mass=concentration×gas volume on matching standard states, integrated over actual operation and converted to kg; validated site constituent balance provides independent reconciliation. Chamber ppm or worker exposure is not factory kg."
      inputs:
        - cp_air
        - cp_coating
      output: "actual outdoor species mass"
      source_ids:
        - metsa-overlaid-epd-2024
    - id: calc_carbon
      applies_to: "co2_bio"
      rule: "Input biogenic carbon=product+waste+actual air+stock-change biogenic carbon, with a separate fossil-carbon ledger. Only evidenced oxidized wood carbon uses the CO2/C molar-mass ratio; resin/film/paint are not assumed biogenic, and CO2 remains in LCI."
      inputs:
        - cp_carbon
        - cp_product
        - cp_waste
        - cp_air
      output: "biogenic/fossil carbon ledger"
      source_ids:
        - metsa-overlaid-epd-2024
    - id: calc_transport
      applies_to: "road_freight"
      rule: "Actual leg kg*km=wet transported kg×measured leg km; convert original t*km with 1 t*km=1000 kg*km, then divide by same-cohort accepted net product kg. Match return/payload boundary to carrier background without an additional assumed empty-return burden."
      inputs:
        - cp_transport
        - cp_product
      output: "road-freight mass-distance per 1 kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "dataset"
      requirement: "Establish scope with order/drawing, supplier board/paint evidence and actual route. Unknown recipe, film burden, compartment or supplier basis is a specific pending gap; identity success is not a complete dataset."
      evidence: "cp_product; cp_material; cp_coating; cp_energy"
    - id: dq_period
      applies_to: "all inventory rows"
      requirement: "All flows match site/period/cohort of the product denominator; retain stocks, rework, rejects and abnormal intervals. Multi-site/period results use total attributable amounts/total net output, not simple ratio means."
      evidence: "all collection protocols"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "No universal consumption/emission factor; distinguish measured, not applicable, below detection and unmeasured. Unknown UUIDs, supply chains and destinations persist explicitly, with uncertainty/completeness disclosure."
      evidence: "calibration; records; supplier declarations; outlet tests"
validation_rules:
  - rule_id: validation_identity
    applies_to: "dataset"
    rule: "Confirm distinct purchased-board and drawing-fabricated finished states and finished_panel as the sole reference output; verify birch/all-veneer/PF/double-film, actual fabrication, edge/hole reseal and no frame/supplied hardware. Stock-sheet sale or service is unavailable."
    source_ids:
      - wisa-formwork-2020
      - metsa-overlaid-epd-2024
  - rule_id: validation_measurement
    applies_to: "all inventory rows"
    rule: "Check one accepted net-mass denominator, formulation water/solids/volatiles, absolute physical balance and attributed burden ledger. Reference is not uses; unsupported measurement, unexplained residual or unknown bases cannot be reported passing."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: validation_emissions
    applies_to: "pm25; pmcoarse; pmover10; formaldehyde; butoxyethanol; co2_bio"
    rule: "Check air compartment/species/CAS/biogenic-fossil source and actual quantity definition; particle bins do not overlap and capture differs from emission. No nearby species or correction substitutes; unknown fractions, gas standard, size or detection limits leave affected conclusions pending."
    source_ids:
      - epa-sawmill-pm-2014
  - rule_id: validation_background
    applies_to: "dataset"
    rule: "Verify complete flow identity route/reference property/unit chain and provider quantity/state/location/period/packaging/included manufacture or transport. Blank UUIDs and pending providers are unresolved; uncoated board, briquettes, clean sawdust, mining wastewater or high-voltage production electricity cannot replace the respective exchanges."
    source_ids:
      - metsa-overlaid-epd-2024
  - rule_id: validation_service
    applies_to: "dataset"
    rule: "Manufacturing result supports net panel delivery only; without independently measured turns/repair/loss/cleaning/release agent and once-only manufacturing attribution, it cannot claim per-pour or multi-use formwork service. Scientific review and mapping acceptance are separate."
    source_ids:
      - wisa-formwork-2020
      - metsa-formwork-manual
published_dataset_profile:
  dataset_role: "foreground production dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same-route drawing-specific unframed panel manufacture after qualifiers/background matching and completeness disclosure; an isolated fabrication unit may be supplied with explicit disclosure that it is not complete cradle-to-gate."
  excluded_use: "Integrated substrate manufacture, other woods/coatings/systems, per-pour/multi-use service, support-load performance claims, automatic methodology approval or mapping acceptance"
  required_metadata: "PCR id/version; drawing/material/PF/film/edge/net-mass/moisture; site/period/voltage/supply-chain/boundary/protocol/attribution/destinations/non-applicability; all pending identity/quantity links"
  required_quality_disclosure: "Method not independently scientifically reviewed; measured coverage/skips/detection limits, samples/uncertainty, stock closure/residuals, unresolved UUIDs/background applicability; no false completeness"
  update_trigger: "Change in supplier board/film/PF/paint, geometry/machining, drying/energy/packaging, waste treatment, provider voltage/location/period or boundary"
data_sources:
  - id: "metsa-overlaid-epd-2024"
    type: "dataset"
    reference: "Metsä Wood, Overlaid birch plywood, S-P-03018, published 2024-10-11, p4. https://www.metsagroup.com/contentassets/9a224a9f84e54845add88157b7e658d7/epd-metsa-wood-overlaid-birch-plywood.pdf; original read 2026-10-11"
