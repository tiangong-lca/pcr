system_boundary:
  rules:
    - rule_id: boundary_new
      applies_to: "foreground_system_boundary"
      rule: "Inherit forestry, harvesting, log processing, transport and any supplier drying/conditioning from matched upstream supply. Do not count these again in the foreground. Gate-to-gate data are not cradle-to-gate data when upstream coverage is incomplete."
      source_ids: []
    - rule_id: boundary_route
      applies_to: "foreground_system_boundary"
      rule: "Keep separate stage records for peeling/trimming, predrying, mixing, each vacuum/pressure phase, drainage/recovery, fixation/air conditioning, inspection, rework and storage within one integrated unit. Include start/stop, failed charges, idle auxiliaries, cleaning and actual waste controls; missing production does not erase loads."
      source_ids:
        - epa-ap42-wood-preserving-1999
    - rule_id: boundary_chemical
      applies_to: "foreground_system_boundary"
      rule: "Whole purchased aqueous CCA liquor is one actual supplier product. Connect its manufacture once; do not also purchase its analytical oxides/elements or contained water in the inventory. Add only separately crossing water/chemicals with their own actual identities. Internal recovery and recirculation are gross physical transfers, not repeated external purchases."
      source_ids: []
    - rule_id: boundary_fixation
      applies_to: "foreground_system_boundary"
      rule: "Include actual fixation hold, drip recovery and moisture change before release. Trace source, weather/temperature, time, assays and acceptance records. Historical handbook examples do not define a required duration, recipe, retention, pressure or temperature. Actual steam, kiln or hot-water use requires its measured heat/water/condensate and complete route inventory."
      source_ids:
        - usda-wood-handbook-2021
    - rule_id: boundary_waste
      applies_to: "foreground_system_boundary"
      rule: "Track each external CCA-contaminated solid, spent liquor, sludge and wastewater separately by actual wet composition, recipient, transport and treatment. Contained pollutants are not direct elementary releases. Keep storage/runoff and fugitive sources; accepted-product in-service leaching and end-of-life are outside this manufacturing gate. No automatic clean-biomass fate or recovery/substitution/energy credit."
      source_ids:
        - epa-ap42-wood-preserving-1999
    - rule_id: boundary_packaging
      applies_to: "foreground_system_boundary"
      rule: "Include actual identification and binding materials and all externally received reusable packaging in a complete physical custody ledger. An order price or separate invoice does not define first physical receipt or burden ownership. No default package mass or assumed container reuse count is supplied."
      source_ids: []
