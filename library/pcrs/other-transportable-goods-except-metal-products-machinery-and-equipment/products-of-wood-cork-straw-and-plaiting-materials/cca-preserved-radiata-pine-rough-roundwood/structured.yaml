measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the sum of independent unique first-acceptance event net masses measured with cp_lot at one declared moisture/fixation gate, excluding packaging. Lock each piece/cohort and its dry wood, retained water and non-water preservative basis; subsequent dispatch, loss, return or reacceptance cannot redefine Q. All inventory amounts use per 1 kg reference flow."
  - id: chemical_basis
    applies_to: "whole preservative and its composition ledger"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record purchased whole aqueous liquor once. Supplier component/oxide-equivalent/element measurements are nested composition records, not extra physical inputs. Carrier water already inside that liquor is not new process water."
  - id: wood_moisture
    applies_to: "wood and product balance"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For untreated wood only, dry-basis moisture u = water mass / dry wood mass and dry wood = wet untreated mass / (1 + u). For treated wood, separate actual retained water, dry wood and non-water preservative; oven mass loss alone is not water. Source: usda-wood-handbook-2021."
  - id: scope_conversion
    applies_to: "volume, count, retention and utilities"
    required_property_ref:
      name: "Mass; Energy"
      uuid: ""
    required_unit: "kg; MJ"
    rule: "Preserve raw units and sampling scope. Obtain actual mass per piece or compatible measured density for the same geometry/moisture and solid/loose volume basis; no handbook density. An assay-zone retention in kg/m3 does not describe the whole pole volume. Integrate actual rates over time before normalization; convert metered kWh using 3.6 MJ/kWh."
