allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Use subdivision, exchange-specific determining physical causality and, only for unresolved inseparable residual burdens, same-gate market values. This is the selected attributional partition approach; the ILCD source supports that hierarchy, not an assertion of full ILCD conformance or adoption of its reuse/recycling formulae. [jrc-ilcd-allocation-2010.]"
    source_ids: []
  - rule_id: allocate_stages
    applies_to: "foreground_burden_allocation"
    rule: "Establish gross physical totals, unit/rate/scope conversions, directly dedicated loads and stage subdivision first. Attribute each remaining shared exchange using its own demonstrated physical cause (actual machine time/load, treated charge occupancy, measured pump work or handling activity), not one common output-mass fraction for every exchange. These are declared foreground modelling rules, not allocation authority inferred from a manufacturer's process description."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocate_coproducts
    applies_to: "foreground_burden_allocation"
    rule: "Determine actual co-product versus waste status from useful function, destination and contemporaneous transactions. Treatment/fixation loads cannot be assigned to untreated bark or chips removed earlier. Only a genuinely inseparable residual shared burden may use economic allocation after subdivision and causal physical attribution cannot resolve it; use actual same-period, same-gate, same-condition quantities and net values, with transport/quality/moisture consistency and sensitivity. Unknown values are not invented."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocate_physical
    applies_to: "foreground_burden_allocation"
    rule: "Keep full physical output vector V and material/element/water balances independent of burden share A. Carry flow-specific inherited burden vectors through raw/unused material, WIP, finished goods and reusable packaging. Divide the attributed current-production vector by positive new accepted Q once. Do not apply A to physical coproduct masses, multiply upstream providers twice, or award recovery, substitution or energy credits."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocate_service
    applies_to: "foreground_burden_allocation"
    rule: "Inspection/retesting service quantity Qc or actual service hours H describe a purchased service, not new wood production. Attribute its burden to the actual inspected lots including failed/returned stock; do not replace the wood denominator with tests, hours, sales or retested product mass."
    source_ids:
      - jrc-ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot
      process_id: "waterborne_treatment"
      flow_role: "finished"
      record_type: "weighing/acceptance and stock"
      raw_fields: "lot/cohort and unique piece/event IDs; first-acceptance time and locked net mass; Pinus radiata; dimensions; sapwood; gate; tare; dry wood; moisture/retained water; non-water preservative and Cu/Cr/As basis; penetration/assay zone; fixation test; pass/fail/rework and prior acceptance link; opening/closing FG and WIP; purchased FG; gross dispatch and linked returns; D_new; FG_new; separate loss/scrap/downgrade/net-return/rework-WIP destinations within L_new; later moisture/chemical changes"
      collection_method: "Calibrated net weighing and representative state-specific analysis at the declared first-release gate. Deduplicate first-acceptance events; preserve actual wet masses and measured component/state conversions. Reconcile the complete same-cohort acceptance_event_bridge, assigning every portion once after netting linked returns/internal loops. Separate opening or purchased FG and reacceptance from new production; retain their activity and original burden vectors"
      unit: "kg"
      frequency: "each event, transfer and release"
      temporal_coverage: "complete campaign and connected opening/closing stocks and prior acceptance history"
      site_scope: "one actual site and defined product state"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; event/cohort traceability; sampling and lab basis; dispatch/return/stock/destination records; measured state-conversion evidence"
    - protocol_id: cp_inputs
      process_id: "waterborne_treatment"
      flow_role: "wood and untreated outputs"
      record_type: "receipt/stage/stock balance"
      raw_fields: "receipt/time/origin; botanical species; log geometry/bark; supplier gate; forestry/harvesting/transport; previous squaring/sawing/drying/conditioning and heat; raw wet mass; moisture; actual density/volume basis; bark/chips/sawdust; rejects; opening/closing unused/raw/WIP; prior burden vector"
      collection_method: "Weigh each atomic material/transfer and measure compatible moisture; trace supplier history rather than invent it. Record peeling versus profile/sawn manufacture. Match both ends of internal links, unallocated gross totals and flow-specific attribution"
      unit: "kg"
      frequency: "each receipt, transfer and stock count"
      temporal_coverage: "same campaign as Q with inherited stock history"
      site_scope: "actual delivered logs and each preparation stage"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scales; supplier records; moisture/volume methods; actual destination, provider and vector provenance"
    - protocol_id: cp_chemicals
      process_id: "waterborne_treatment"
      flow_role: "whole liquor and added water"
      record_type: "supplier composition/phase/stock record"
      raw_fields: "whole liquor product and supplier lot; delivered kg or actual volume/density; composition and analytical basis; separately added water; opening/closing concentrate/work/recovery tanks; circulation; drainage; wood uptake; retained water/chemicals; Cu/Cr/As and valence; leaks/losses; bath temperature and times"
      collection_method: "Meter/weigh external whole liquor once and reconcile stock and actual dilution. Keep water, wood phase, liquid phase, each element and identified species subledgers. Measure retention and losses; no family-name recipe, full-SDS-by-difference assumption, or inference of several unknowns from one residual"
      unit: "kg"
      frequency: "each batch, cycle, transfer and stock count"
      temporal_coverage: "same campaign as Q including retained/recovered stocks"
      site_scope: "one actual supplied formulation and full-cell route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "actual batch certificate and complete supplier disclosure; meter/assay calibration; phase and element reconciliation"
    - protocol_id: cp_energy
      process_id: "waterborne_treatment"
      flow_role: "electricity"
      record_type: "stage meter/time record"
      raw_fields: "meter; stage; voltage/geography; provider and delivery boundary; kWh; rate/time; start/stop/idle/failed/cleaning; shared machine cause and stock attribution"
      collection_method: "Read actual stage meters or integrate measured power over actual operating intervals. Reconcile shared to dedicated loads and connection losses; all electric pump/handling/fans/QA loads remain even without accepted output. Any real heat route records supply/return enthalpy, water and condensate and requires added inventory"
      unit: "MJ"
      frequency: "each cycle and meter interval"
      temporal_coverage: "complete campaign including nonproductive periods"
      site_scope: "actual consumer connection and all included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; logs; actual utility contract/provider; no assumed CN/high-voltage or heat identity"
    - protocol_id: cp_waste
      process_id: "waterborne_treatment"
      flow_role: "each waste"
      record_type: "transfer/analysis and stock"
      raw_fields: "each atomic stream; wet/dry mass; water; wood/metal fraction; Cu/CrIII/CrVI/As; actual other species; opening/closing storage; transport; receiver/authorization and actual treatment"
      collection_method: "Weigh each separate stream; distinguish clean pre-treatment residues, CCA wood, liquor, sludge, wastewater and packaging. Analyse composition and document actual fate; constituent subledger is not another total waste exchange"
      unit: "kg"
      frequency: "each generation/transfer and stock count"
      temporal_coverage: "same campaign as Q and actual downstream treatment"
      site_scope: "contained on-site streams through verified receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scales; lab; consignment; current receiver acceptance and treatment evidence"
    - protocol_id: cp_air
      process_id: "waterborne_treatment"
      flow_role: "each air emission"
      record_type: "source tests/rate integral"
      raw_fields: "source/stage; outlet and fugitive rate; actual operating time; controls; species/CAS; Cu/As elemental basis; chromium valence; compatible PM size fractions; detection limits; wood carbon loss"
      collection_method: "Integrate actual post-control and fugitive species releases across preparation, vacuum, tanks, drip pad and storage. Determine actual wood VOC species separately; alpha-pinene is conditional, not a total-VOC proxy. Keep total PM/VOC indicators distinct from individual substances and metal mass"
      unit: "kg"
      frequency: "representative tests and complete operating intervals"
      temporal_coverage: "all relevant sources and failed/idle cycles in same campaign"
      site_scope: "outdoor air, unspecified subcompartment; change identity for a known different subcompartment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "test/calibration; measured operating conditions; gap and detection-limit disclosure"
    - protocol_id: cp_water
      process_id: "waterborne_treatment"
      flow_role: "each water release and vapor"
      record_type: "effluent and independent water ledger"
      raw_fields: "destination; interval; actual liquid volume/flow; flow-weighted species concentrations; detection limit; inlet/retained/condensed water; runoff/drips; liquid tanks; wood-phase water; weather; stocks"
      collection_method: "Integrate compatible concentration with actual discharge flow/time and units. Distinguish sewer transfer from direct fresh-water discharge. Establish evaporation from independently constrained water accounts, not all drying mass loss or a residual shared with unknown chemical/wood losses"
      unit: "kg"
      frequency: "each discharge and representative sampling"
      temporal_coverage: "same campaign as Q and stock horizon"
      site_scope: "actual receiving compartment and contained runoff system"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters; laboratory; recipient; independently bounded water residual/uncertainty"
    - protocol_id: cp_pack
      process_id: "waterborne_treatment"
      flow_role: "each packaging article"
      record_type: "first physical receipt/custody/stock"
      raw_fields: "receipt ID/time/origin; atomic material/form/type; direction; measured original units; procurement; burden owner; custody; cohort; provider; prior burden vector; opening/closing empty/raw/WIP/FG/reusable stocks; gross outward S; other external outward EO; waste W; same-item returns ER; internal issues/reuse"
      collection_method: "Distinguish purchases P (including whole-component purchases without separate invoices) from genuine first non-purchase external receipts N such as loan/rental/commissioned or non-purchase goods-accompanying articles. Put N with full physical history on actual receiving side. ER requires that same item's earlier outward S; first borrowed receipt is not ER. Internal issue/reuse cancels. Match same-cohort physical and inherited-vector ledgers; unknown history is not zero"
      unit: "kg"
      frequency: "each receipt/issue/return and stock count"
      temporal_coverage: "complete campaign plus connected reusable history"
      site_scope: "all actual custody/burden owners and provider boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "receipts; custody/cohort IDs; measured tare; vector provenance; reconciliation; no whole-container/component manufacturing duplication"
    - protocol_id: cp_qc
      process_id: "waterborne_treatment"
      flow_role: "purchased inspection service"
      record_type: "service/lot records"
      raw_fields: "provider; exact test scope; actual Qc and native unit or measured service hours H; laboratory lot; acceptance/retest/return; underlying energy/reagents coverage; linked burden vector"
      collection_method: "Record service in its actual declared supplier unit and convert only with measured compatible scope. Choose one actual service provider once; exclude any foreground reagents/energy already included by it. Allocate to real inspected cohorts including failed tests"
      unit: "h"
      frequency: "each commissioned service"
      temporal_coverage: "same campaign including retained/returned lots"
      site_scope: "actual external service scope"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "service report; actual billed/performed scope; calibration; no invented time per test"
  calculation_rules:
    - id: normalize_lot
      applies_to: "all inventory rows"
      rule: "For each exchange, normalized amount = attributable current-production exchange total / independently locked unique first-acceptance mass Q; final product = 1 kg. First convert original units, integrate actual rates, subdivide dedicated activities and attribute each shared exchange by its actual cause. Apply only a justified residual burden share A before the single division. Gross physical V is never multiplied by A. Verify Q with acceptance_event_bridge, not dispatch plus closing FG alone. Opening WIP carries its prior vector into its first-accepted cohort. Include failed-charge, loss, scrap, downgrade and rework activities in their evidenced cohort attribution; no activity disappears when saleable mass falls. For work on previously accepted opening FG, purchased FG or returned/reaccepted wood, retain the incremental vector with its original cohort and original acceptance basis; do not put it in a new cohort numerator or create new Q. If that original basis or vector is unavailable, keep the activity separately unresolved. Q = 0 leaves an unnormalized load/stock ledger, not zero burden."
      inputs:
        - "raw records"
        - "stage attribution"
        - "stock vectors"
        - cp_lot
      output: "per 1 kg reference flow"
      source_ids: []
    - id: acceptance_event_bridge
      applies_to: "first-accepted treated-roundwood cohort"
      rule: "Q = sum of independently measured unique first-acceptance event masses. Cross-check Q = D_new + FG_new + L_new for that campaign cohort with zero opening first-accepted cohort stock. D_new is net dispatch after linked returns, FG_new is closing accepted FG, and L_new covers every other net post-acceptance destination: measured losses, scrap, downgrade, net returns held outside accepted FG, and closing transfer back to rework/WIP or other custody. All terms are kg on the same locked whole-product acceptance basis, including dry wood, retained water and non-water CCA material, excluding packaging; portions are mutually exclusive and exhaustive. A returned piece is removed from D_new and assigned once to its actual closing FG/WIP/other destination, never also added as an extra loss. Internal gross loops and reacceptance do not add Q or a second destination. Reconcile later moisture or CCA-loading changes with measured component records; separate later additions from acceptance-origin material and record actual losses once. Convert measured piece/count/solid-volume records only with compatible actual mass/density and geometry/state evidence; retention-assay-zone kg/m3 is not whole-log mass. Q = D_new + FG_new is allowed only when every other post-acceptance destination is evidenced absent and L_new = 0. For 100 kg first accepted, 60 kg net dispatched, 30 kg closing FG and 10 kg post-acceptance loss, Q remains 100 kg, not 90 kg. Opening FG, purchased FG and retest/reacceptance add no Q; burdens remain with their original cohort. An unexplained gap stays unresolved, never changes Q or becomes assumed zero loss."
      inputs:
        - cp_lot
        - cp_inputs
        - cp_chemicals
        - cp_water
        - cp_waste
      output: "locked Q and complete cohort destination bridge"
      source_ids: []
    - id: constituent_supply
      applies_to: "whole liquor composition subledger"
      rule: "Constituent equivalent = measured whole liquor quantity x its actual verified fraction on the declared basis; retain remaining identified carrier/water and undisclosed composition separately. These are nested checks, not additional purchases. Deduct unused closing stock using the actual inherited vector rather than a new average; preserve recovered-bath history."
      inputs:
        - "supplier lot"
        - "complete composition"
        - cp_chemicals
      output: "linked kg and elemental-equivalent records"
      source_ids: []
    - id: balance_separate
      applies_to: "physical stage ledger"
      rule: "Opening stock + external input + internal receipt = gross external output + internal issue + closing stock + independently quantified loss for each compatible phase/element. For the integrated boundary including FG storage, count actual external dispatch/transfers and all closing raw/WIP/FG stocks; first acceptance is an internal state change, not an additional external output. Keep this physical ledger separate from acceptance_event_bridge and burden share A; cancel internal rework/return loops at the integrated boundary. Close dry wood, actual water, Cu, Cr, As and carbon independently; final wet wood = dry wood + retained water + retained non-water material on compatible measured bases. Record later water loss or chemical additions/removals on their actual physical basis without relocking Q. Reactions change speciation, not element totals. Do not sum wood/water/element subledgers or solve several unknown releases with one residual. Every physical flow occupies one term only; gross external output excludes any loss already itemized separately on that balance."
      inputs:
        - cp_inputs
        - cp_chemicals
        - cp_lot
        - cp_water
        - cp_waste
      output: "unallocated balances, residuals and uncertainty"
      source_ids: []
    - id: species_release
      applies_to: "elementary releases"
      rule: "Integrate species mass rate over actual operating time, or concentration multiplied by compatible measured flow and time, retaining unit conversions and sampling scope. Elemental Cu/As and Cr-state masses are not oxide/whole-liquor masses. Unknown Cr valence is unresolved; do not fabricate a split. AP-42 empty-cell artificial-conditioning/final-vacuum factors do not quantify this full-cell plant."
      inputs:
        - cp_air
        - cp_water
      output: "actual kg of each substance to its compartment"
      source_ids:
        - epa-ap42-wood-preserving-1999
    - id: pm_partition
      applies_to: "pm25; pmcoarse; pmover10"
      rule: "Only with compatible cumulative tests, PM2.5–PM10 = PM10 - PM2.5 and PM>10 = total PM - PM10; retain uncertainty and justified nonnegative results. Do not add cumulative total PM/PM10 again. Metal contents are a speciation subledger of aerosol, not independent additive total solids; document any LCIA overlap."
      inputs:
        - "compatible particle tests"
        - cp_air
      output: "non-overlapping particle kg"
      source_ids: []
    - id: pack_balance
      applies_to: "packaging stocks and transfers"
      rule: "For each atomic article/cohort, opening physical stock + first external purchases P + first external non-purchase receipts N + verified same-item returns ER = closing physical stock + gross outward S + other outward EO + waste W, with internal issues/reuse cancelled. Include all empty/raw/WIP/FG/reusable states. Carry actual prior burden vectors and add newly incurred handling/cleaning/replacement once; new accepted closing FG packaging belongs to the current production vector already. Preserve physical outward/return totals independently of procurement and burden ownership."
      inputs:
        - cp_pack
        - "cohort and provider vectors"
      output: "reconciled physical quantities and attributed packaging vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_recipe
      applies_to: "preservative"
      requirement: "Obtain actual whole-liquid manufacturing provider, full composition and phase/analytical basis. Historic SDS supports a real chemistry route, not a numerical factory recipe or today's complete disclosure. Missing upstream UUID/provider is a specific data gap; incompatible chemistry requires route review."
      evidence: "cp_chemicals; arch-tanalith-oxide-2016"
    - id: dq_gate
      applies_to: "final wood"
      requirement: "Distinguish retention assay zone, penetration, chromium-fixation and surface-residue acceptance from whole-piece mass, moisture and quantity. Actual release/rework criteria are product/site specific; a brand, color, elapsed hold or historical standard does not prove acceptance or current regulatory permission."
      evidence: "cp_lot; tpaa-treatment-guidelines; usda-wood-handbook-2021"
    - id: dq_stocks
      applies_to: "complete campaign"
      requirement: "Reconcile raw/unused/WIP/new FG/old FG/purchased FG and reusable stocks by physical cohort and each flow's inherited vector. Include failed batches, startup, shutdown, idle, cleaning and all post-acceptance loss/return/rework activities. Opening FG, purchased FG, internal returns and retesting/reacceptance create no new Q. Reconcile unique events to disjoint exhaustive D_new, FG_new and L_new on the locked acceptance basis; keep physical stock/component ledgers separate. Preserve actual quantity, burden, identity and source-data gaps separately."
      evidence: "cp_inputs; cp_lot; cp_pack; cp_qc"
    - id: dq_coverage
      applies_to: "all exchanges"
      requirement: "Cover all actual species, control sources and destinations; separately disclose missing assays, detection limits, provider scope and unknown residuals. Total PM, VOC, COD, NOx or total Cr are indicators with their own basis, not substitute substance identities. No default density, recipe, yield, price, per-machine or packaging mass is supplied."
      evidence: "all collection protocols"
validation_rules:
  - rule_id: validate_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Exactly one finished Product output is linked by finished; check full botanical species, rough whole-log shape, aqueous CCA formulation, route, gate and provider. Recheck native full name/comments, type, property/unit and official Chinese displays for each adopted UUID. Generic Wood material requires explicit qualified exchange compatibility; it grants neither provider approval nor automatic matching."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "foreground_dataset_conformance"
    rule: "Require positive independently measured unique first-acceptance Q for a per-kg dataset and the same EN/ZH acceptance basis. Verify event deduplication and Q = D_new + FG_new + L_new using mutually exclusive exhaustive same-cohort records, including all net returns, losses, scrap, downgrades and closing rework/WIP; reject the two-term shortcut unless every other post-acceptance destination is evidenced absent. Verify measured moisture/CCA-loading and volume/mass conversions, no duplicate destination/adjustment, no Q from opening/purchased FG or reacceptance, and no forced residual closure. Keep actual physical V independent of A and Q, including FG stock without adding first acceptance again, with linked phase/element/wood/water/carbon ledgers and all inherited vectors. Preserve Q = 0 campaigns and inspection Qc/H or failed/rework burdens without inventing production."
    source_ids: []
  - rule_id: validate_releases
    applies_to: "foreground_dataset_conformance"
    rule: "Distinguish contained waste, direct fresh-water discharge and air releases; actual Cu/As/Cr-state and wood VOC/biogenic CO2 identities, with post-control/fugitive coverage. Retain biogenic CO2 in LCI when actually released, without repeating inherited forestry uptake or assigning an impact-method credit. No nested PM duplication or assumed zero from low general waterborne emissions."
    source_ids:
      - epa-ap42-wood-preserving-1999
  - rule_id: validate_claims
    applies_to: "foreground_dataset_conformance"
    rule: "Verify current site/date/product pesticide-use requirements, actual release specification and receiver permission with applicable documents. Historical technical sources do not confer current legal authorization, safety, treatment performance or disposal permission. Disclose remaining data gaps and scientific uncertainty; this method is not a compliance certificate."
    source_ids: []
  - rule_id: validate_packaging
    applies_to: "foreground_dataset_conformance"
    rule: "Check first external physical receipt separately from invoice/procurement and burden ownership, physical N on receiving side, genuine same-item ER, all stock states and preserved vectors; no unknown-history zero or duplicate container/component production."
    source_ids: []
published_dataset_profile:
  dataset_role: "Gate-to-gate foreground manufacture of selected CCA-preserved radiata pine rough whole roundwood; upstream-connected only with matched complete links"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing of the defined new wholewood/whole-liquor full-cell and air-conditioned product with actual site data and explicit native exchange compatibility"
  excluded_use: "Whole CPC 31310 coverage; sawn/profile/sleeper substitution; other species/preservatives; service-life/safety equivalence; legal certification; unsupported cradle-to-gate or carbon-neutral claims"
  required_metadata: "Full required qualifiers; actual provider once per exchange; stage/utility/chemistry and stock history; release criteria; allocation and denominator; packaging custody; downstream waste treatment"
  required_quality_disclosure: "Scientific review status; actual data and UUID/provider gaps separately; composition/phase/speciation; unit and assay-zone scope; measurement coverage and uncertainty; inherited vectors and zero-output campaigns"
  update_trigger: "Changed species/form/preservative, supplier composition, conditioning/heat, gate, utility, controls, acceptance, stock ownership, allocation, destination or new evidence"
data_sources:
  - id: "portland-pine-process"
    type: "literature"
    reference: "Portland Pine Products, [Our Process](https://www.portlandpine.com.au/our-process-products/our-process), complete undated manufacturer webpage, acquired 2026-10-27."
    used_for: "Existence of radiata roundwood, peeling/air seasoning, full-cell CCA treatment, recovery and fixation; industrial route context only; no claim of a particular chemical supplier, allocation authority or default plant quantities"
  - id: "arch-tanalith-oxide-2016"
    type: "literature"
    reference: "Arch Wood Protection (SA) / Lonza, Tanalith C Oxide Liquor MSDS, September 2016 revision 09, [complete 6-page supplier document hosted by timber producer](https://www.geelhoutvlei.co.za/wp-content/uploads/2025/07/TANALITH_C_MSDS.pdf), especially sections 1–2, 9–10, 13 and 16."
    used_for: "Positive existence of an industrial aqueous CCA oxide preparation for pressure impregnation; historical composition/phase context, not today's recipe, complete composition, environmental factor or legal authorization"
  - id: "tpaa-treatment-guidelines"
    type: "extension_guidance"
    reference: "Timber Preservers Association of Australia, [Technical Note 11: Treatment Process Guidelines](https://www.portlandpine.com.au/uploads/wp-content/TPAA-tech-note-11-Treatment-Process-Guidelines.pdf), full 2-page retained undated edition, especially page 2."
    used_for: "Qualitative quality-record context; actual solution-strength/chemical-use monitoring, segregation, quarantine and drip-pad records; no adoption of current standard clauses or numeric targets"
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory (2021), Wood handbook—wood as an engineering material, FPL-GTR-282, [official complete handbook](https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf); chapter 15 pp. 15–3, 15–13–15–17 and 15–21–15–23, with adjacent context; chapters 4/13 moisture context."
    used_for: "Preparation, waterborne pressure-route distinctions, CCA fixation and retention-zone versus whole-product measurement; no Southern Pine table values, default density, recipe, timing, performance or present legal approval"
  - id: "epa-ap42-wood-preserving-1999"
    type: "official_guidance"
    reference: "US EPA, [AP-42 section 10.8 Wood Preserving](https://www.epa.gov/sites/default/files/2020-10/documents/c10s08.pdf), August 1999, complete 12-page section; process/emission context pp. 10.8–1–10.8–7 and table 10.8–2 including footnote."
    used_for: "Source-point coverage and the limited applicability of historic CCA empty-cell factors; no factor adopted for this full-cell route or assumed chromium-valence split"
  - id: "unsd-cpc-structure-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 structure, 30 June 2025, [official English structure CSV](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv), code 31310 and neighbouring rough/sawnwood classes."
    used_for: "Classification scope and narrower relation only; not a treatment recipe or performance specification"
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC (2010), [ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, first edition](https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf), sections 7.9.2–7.9.3, printed pp. 255–272."
    used_for: "Attributional subdivision, exchange-specific determining physical causality, residual same-condition process-gate market values, and conservation of allocated inventory; no default physical key, full-conformance claim or adoption of recycling/substitution formulae"
