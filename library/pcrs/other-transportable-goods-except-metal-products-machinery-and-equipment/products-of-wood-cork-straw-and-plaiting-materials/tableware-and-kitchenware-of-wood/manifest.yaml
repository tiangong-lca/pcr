review_metadata:
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  scientific_review:
    status: "not_independently_reviewed"
    note: "Author synthesis does not itself establish methodology approval or PCR publication. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and the ADRs referenced by its acceptance.decision_ref fields."
  semantic_boundary:
    included: "Uncoated untreated single-piece face-grain Acer saccharum cutting board; purchased kiln-dried blank; electric machining and sanding; unprinted self-locking corrugated box at factory gate."
    excluded: "Spoons; bowls; bamboo; glued/laminated/end-grain assemblies; coatings, oil/wax finishing, impregnation, on-site kiln/boiler, wet cleaning and retail/service-life scenarios."
    retained_scaffold_decision: "Unpublished retained 31912 scaffold promoted for a reviewed-by-author narrower wooden kitchenware subset; existing material wood panel/lumber PCRs are upstream products, not finished food-preparation boards. No accepted edge changed."
  unresolved_flow_identities: []
  source_metadata_debts:
    - row_ids:
        - "offcut"
      uuid: "acc22294-8e77-4784-988f-2499be3c60eb"
      issue: "CPC39282 classification conflicts with woodworking name/comment and empty treatment; physical unagglomerated offcut use conditional; source/receiver clarification required."
    - row_ids:
        - "shavings"
        - "rejected_board"
      uuid: "2ef9d37a-2fbf-42f6-8ccf-5d6677d5cfd8"
      issue: "Current Wood waste definition is 1 kg collected non-agglomerated waste at generation, with coherent CPC39283 and unspecified composition/treatment. Conditional use for actual uncoated shavings and whole rejected boards requires actual moisture, wood fraction, contamination, receiver acceptance and provider quantity/state compatibility. Collection establishes neither harmlessness, recycling eligibility, clean fuel, treatment nor avoided-product credit; no factory/provider evidence is implied."
  background_compatibility_debts:
    - row_ids: ["machine_oil"]
      uuid: "66628f20-9d33-4997-bd6c-6357453fa268"
      requirement: "Whole actual as-supplied liquid petroleum/mineral machinery-oil formulation including additives; verify SKU/SDS/base/additive constituents, petroleum share against source CPC>=70% and petroleum-fraction route, supplier gate/period and Mass/kg basis. Source 40.5 MJ/kg descriptor requires provider clarification, not an actual heating-value default or energy exchange. No duplicate constituent purchases or board finishing oil."
    - row_ids: ["sanding_dust"]
      uuid: "2a6c9b60-a075-45ec-b611-c3b4dd255935"
      requirement: "One separately captured actual wood/mineral/binder mixture, as-collected measured mass and moisture, measured dry component masses/carbon/contamination, origin/stock and named accepting receiver/provider route/quantity basis. Broad Dust identity does not establish composition or treatment data; no pure-wood, metal-sludge, coal, cork or alumina substitution."
    - row_ids: ["box"]
      uuid: "4f197bec-7b3b-11dd-ad8b-0800200c9a66"
      requirement: "Source descriptor 16.6% primary/83.4% recycled fibre is a supplier composition/reference-quantity constraint, not the actual factory recipe or a recycling credit. Verify actual compatible complete box composition, supplier gate/year and Mass basis; differing actual mix remains compatibility-pending or requires another verified identity. No invented foreground adhesive."
    - row_ids: ["electricity"]
      uuid: "50657322-939c-4829-a87b-47c093bfa6a7"
      requirement: "Raw geography CN; actual supplier/region/year, consumer voltage below 1 kV, delivery/loss boundary and MJ reference quantity must be compatible. Physical AC identity is not a global background."
    - row_ids: ["abrasive_belt"]
      uuid: "8240432e-9d1c-43e0-aa76-70e9905b2895"
      requirement: "Source at-plant CN grinding/polishing consumable; actual supplier geography/period, complete backing/binder/grain grade/formulation and Mass/kg gate basis remain to verify."
    - row_ids: ["maple_blank"]
      uuid: "92c2e870-95ba-46bf-a6f6-f4680080df1d"
      requirement: "Selected non-conifer sawn stock requires actual measured incoming thickness >6mm; at/below6mm requires a separately verified identity. Raw kiln-dried at-plant GLO intermediate context is not an actual supplier inventory; verify Acer saccharum species, drying/moisture, gate/period/reference quantity without density or yield defaults."
  dataset_completion_requirements:
    - "No site quantities or supplier recipes were collected in this author task. A future dataset must execute protocols and resolve every applicable blank identity/background before completeness can be claimed."
    - "Verify actual sugar maple, uncoated/unglued route, food-contact acceptance for the destination, abrasive/binder formulation and contamination, input wood moisture/delivery basis, electricity consumer voltage/mix/loss boundary, and receiving waste routes."
    - "Particulate size-resolved outlet plus fugitive monitoring and ambient water/wood-carbon balances remain site-specific; no factor, yield, density, capture rate, allocation share, service life, oil formula or emissions default invented."
    - "Independent scientific review, classification narrower acceptance, alias/catalog/index regeneration and full integration validation belong to controller."
