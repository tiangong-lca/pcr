allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The listed residue cards represent waste dispatches. If no genuine co-product leaves a joint stage, the board receives all its burdens. If actual evidence establishes a co-product, add its specifically verified product-output identity and applicable collection before using the allocation method; do not relabel a waste UUID as a product."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "The following physical-allocation method is an author adaptation of the CORRIM softwood case, not a transfer of that survey to sugar maple factories. No survey density, yield, energy, price or allocation share is adopted. Establish whether a dispatched residue is waste or a co-product from actual contracts, specification, demand and handling; a sale alone does not erase waste treatment. [corrim-northern-lumber-2025]"
    source_ids: []
  - rule_id: al_separate
    applies_to: "p_board"
    rule: "First separate product-specific stages using measured electricity/work and material records. Assign board-only sanding, acceptance and packaging burdens directly to boards; do not allocate their burdens to residues that left at earlier stages."
    source_ids:
      - corrim-northern-lumber-2025
  - rule_id: al_joint
    applies_to: "p_board"
    rule: "For an inseparable joint stage with genuine wood co-products, use measured oven-dry wood mass fractions within that stage. If every residue is waste, the board fraction is 1. Treat actual waste disposal as a board-production burden; exclude wastes, packaging, water and abrasive mass from the co-product denominator. Disclose stage outputs, causal limits and an economic sensitivity using measured revenues when physical shares may distort value."
    source_ids:
      - corrim-northern-lumber-2025
  - rule_id: al_physical
    applies_to: "p_board"
    rule: "Keep a complete unallocated physical ledger and a separate allocated environmental-burden ledger. Preserve actual product/co-product/waste quantities and carbon/water balances; never multiply real co-product outputs or internal transfers by a burden share. Internal reuse is measured once with no external substitution credit."
    source_ids:
      - corrim-northern-lumber-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "p_board"
      flow_role: "accepted_board"
      record_type: "weighing"
      raw_fields: "lot; species; dimensions; accepted count; delivery moisture; net accepted board mass B; box tare; rejects; stock change; surface acceptance"
      collection_method: "Calibrated net weighing of accepted bare boards before pack-out, reconcile packed gross minus actual tare and actual matched-period packed dispatches and stocks; inspect declared material/surface; retain item-level records without using count as denominator"
      unit: "kg"
      frequency: "each lot and acceptance"
      temporal_coverage: "Same documented representative production period and lots as cp_mass"
      site_scope: "Specified sugar maple board line plus attributable services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, supplier originals, timestamps, coverage and reconciliation evidence"
    - protocol_id: cp_material
      process_id: "p_board"
      flow_role: "maple_blank; water_vapour"
      record_type: "weighing_and_moisture"
      raw_fields: "supplier; species; drying/delivery data; blank net mass; receipts/stock; each stream wet and oven-dry sample mass; MC; ambient humidity/time; sample location; carbon fraction test"
      collection_method: "Calibrated receipt and dispatch weighing with representative species/stream-specific moisture samples; immediate sample weighing and oven-dry constant mass per USDA ch.13 (101–105°C; no appreciable change at 3-hour intervals), or a validated corrected moisture meter cross-checked to this basis; record volatilization bias and sample coverage"
      unit: "kg; % dry basis"
      frequency: "each receipt/lot and balance campaign"
      temporal_coverage: "Same documented representative production period and lots as cp_mass"
      site_scope: "Specified sugar maple board line plus attributable services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, supplier originals, timestamps, coverage and reconciliation evidence"
    - protocol_id: cp_energy
      process_id: "p_board"
      flow_role: "electricity"
      record_type: "meter"
      raw_fields: "stage meter start/end; kWh; dates; voltage; supplier mix/loss boundary; machine/extractor hours; shared-service attribution"
      collection_method: "Read calibrated submeter or attributable plant meters; retain stage totals and shared-use driver; include idle and auxiliary demand attributable to the campaign without double counting"
      unit: "kWh; MJ"
      frequency: "meter intervals and each lot"
      temporal_coverage: "Same documented representative production period and lots as cp_mass"
      site_scope: "Specified sugar maple board line plus attributable services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, supplier originals, timestamps, coverage and reconciliation evidence"
    - protocol_id: cp_aux
      process_id: "p_board"
      flow_role: "abrasive_belt; machine_oil; used_oil"
      record_type: "stock_and_supplier_records"
      raw_fields: "SKU; supplier; actual grain/backing/binder or complete oil base/additives; petroleum mass fraction; supplier grade/40.5 descriptor and gate/reference-basis compatibility; SDS; new unit mass; replacements; used belt/oil mass; receipts/returns; opening/closing stock; machine retained oil; cross-contamination"
      collection_method: "Actual supplier composition and purchasing/maintenance records with calibrated mass measurements; complete product mass includes actual formulation; track belt abrasion separately and do not infer recipe from trade names"
      unit: "kg"
      frequency: "each replacement and stock period"
      temporal_coverage: "Same documented representative production period and lots as cp_mass"
      site_scope: "Specified sugar maple board line plus attributable services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, supplier originals, timestamps, coverage and reconciliation evidence"
    - protocol_id: cp_residue
      process_id: "p_board"
      flow_role: "offcut; sawdust; shavings; rejected_board; sanding_dust; spent_belt"
      record_type: "weighing_and_dispatch"
      raw_fields: "stream/container id; gross/tare/net; moisture; wood fraction; actual mineral/binder constituents and measured dry component masses; moisture/carbon attribution; receiver acceptance and provider quantity basis; abrasive/adhesive/oil contamination; rejected-board defect; receiver; treatment; revenue/specification; dispatch and stored mass"
      collection_method: "Weigh segregated actual streams and reconcile bins, collector, rejected boards and dispatch/stock. Test composition of sanding dust and residual belt wood; define mutually exclusive bins for sawdust and shavings. Confirm receiver and waste/co-product legal/commercial status"
      unit: "kg; %"
      frequency: "each bin/dispatch; campaign composition tests"
      temporal_coverage: "Same documented representative production period and lots as cp_mass"
      site_scope: "Specified sugar maple board line plus attributable services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, supplier originals, timestamps, coverage and reconciliation evidence"
    - protocol_id: cp_pack
      process_id: "p_board"
      flow_role: "box; box_scrap"
      record_type: "packing_stock_records"
      raw_fields: "box SKU/construction; actual supplier fibre composition; source 16.6/83.4 descriptor/gate/quantity-basis compatibility; net new box mass; box count; receipts/stock; dispatched accompanying packaging mass; damaged box mass; no closure/label/film declaration"
      collection_method: "Weigh complete purchased boxes and scrap separately, reconcile stock and delivered packaging; count conversion uses measured actual box mass, never a default percentage"
      unit: "kg"
      frequency: "each packing lot"
      temporal_coverage: "Same documented representative production period and lots as cp_mass"
      site_scope: "Specified sugar maple board line plus attributable services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, supplier originals, timestamps, coverage and reconciliation evidence"
    - protocol_id: cp_air
      process_id: "p_board"
      flow_role: "pm25; pmcoarse; pmover10"
      record_type: "emission_monitoring"
      raw_fields: "outlet/fugitive points; test method; aerodynamic fraction; total/PM10/PM2.5 cumulative or exclusive status; concentration; dry/wet gas basis; flow/time; capture/bypass; background subtraction; wood/abrasive composition; uncertainty; species screen"
      collection_method: "Use representative post-control stack and fugitive measurements for actual wood machinery; integrate compatible concentration and gas volume/time. Reconcile collected dust separately; document outlet, worker exposure and off-site boundary distinctions. Screen actual nonparticulate releases and add detected species as individually verified atomic rows before dataset completeness; do not assume zero from absence of a boiler"
      unit: "kg; concentration; gas volume/time"
      frequency: "representative campaign across operating/control conditions"
      temporal_coverage: "Same documented representative production period and lots as cp_mass"
      site_scope: "Specified sugar maple board line plus attributable services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, supplier originals, timestamps, coverage and reconciliation evidence"
  calculation_rules:
    - id: normalize_batch
      applies_to: "all inventory rows"
      rule: "For each row, q = A / B; A is its matched-period measured or calculated amount in the row unit; B is accepted net board mass in kg crossing the packed factory-gate boundary in the matched period from cp_mass. q is per 1 kg reference flow. Preserve actual unallocated outputs before any burden allocation."
      inputs:
        - A
        - B
        - cp_mass
      output: "row amount per 1 kg reference flow"
      source_ids: []
    - id: moisture_balance
      applies_to: "maple_blank; accepted_board; offcut; sawdust; shavings; rejected_board; sanding_dust; spent_belt; water_vapour"
      rule: "MC = 100*(wet_sample - dry_sample)/dry_sample; dry_wood = measured_wood_mass/(1 + MC/100). For mixed waste first separate measured dry non-wood content from dry wood. In each balance, input = output + closing_stock - opening_stock + documented_residual; retained wood includes accepted boards, all wood residues, wood in spent belt and emitted wood particles. Water input in wood = water in external outward streams + net evaporation + closing water stock - opening water stock + documented water-balance residual. Water retained in stored wood enters the stock terms once; internal stage transfers cancel after reconciliation and are not external outflows. Do not label an unexplained residual as water, carbon or particulate release."
      inputs:
        - cp_material
        - cp_residue
        - cp_mass
        - cp_air
      output: "Dry wood and water ledgers with explicit uncertainty"
      source_ids:
        - usda-wood-handbook-2021
    - id: electric_work
      applies_to: "electricity"
      rule: "Electrical MJ = measured kWh * 3.6. Reconcile stage submeters with attributable plant supply; apply normalize_batch only after unit conversion."
      inputs:
        - cp_energy
      output: "MJ per period, then MJ per 1 kg reference flow"
      source_ids: []
    - id: particulate_bins
      applies_to: "pm25; pmcoarse; pmover10"
      rule: "At each compatible measurement scope: fine = PM2.5; coarse = PM10 - PM2.5; over10 = total_particulate - PM10. Require total_particulate >= PM10 >= PM2.5 >= 0 within uncertainty. Sum mutually exclusive bins across stack and separately evidenced fugitive outlets once. Reject incompatible wet/dry gas, averaging periods, condensable definitions or test cut-offs; remeasure rather than force a bin."
      inputs:
        - cp_air
      output: "Exclusive kg air emissions, then per 1 kg reference flow"
      source_ids:
        - epa-sawmill-pte-2014
    - id: joint_burdens
      applies_to: "p_board"
      rule: "For each inseparable joint stage, f_board = dry_board_equivalent / sum(dry genuine wood co-product equivalents leaving that stage, including board precursor). All fractions sum to 1. Board burden = f_board * joint_stage_burden + direct_board_stage_burden. Preserve actual physical outputs; allocation changes only attributed joint burdens. Use stage-specific measured dry masses, not final-stage wet masses."
      inputs:
        - cp_material
        - cp_residue
        - cp_energy
      output: "Allocated burden ledger separate from physical ledger"
      source_ids:
        - corrim-northern-lumber-2025
    - id: wood_carbon
      applies_to: "p_board"
      rule: "Wood carbon = measured oven-dry wood mass * measured supplier/site carbon mass fraction for each actual stream. Reconcile input carbon with accepted board, residues, stored wood, emitted wood particles and any measured carbon-containing gaseous release. Track biogenic and fossil carbon separately where binder/oil occurs. No default wood-carbon fraction, negative carbon credit or deletion of upstream biogenic CO2."
      inputs:
        - cp_material
        - cp_residue
        - cp_air
      output: "Physical carbon ledger with residual and evidence"
      source_ids:
        - usda-wood-handbook-2021
  data_quality_requirements:
    - id: dq_route
      applies_to: "p_board"
      requirement: "Match actual species, material/recipe, finishing route and packaging; no hidden coating or adhesive. A broad UUID never substitutes for physical applicability."
      evidence: "Drawings, supplier composition, bills and acceptance records"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Resolve every applicable identity, support unit and background quantity basis. Prove absence to mark a conditional row not applicable; missing measurement is not zero. Add actual unlisted inputs/emissions atomically before completeness."
      evidence: "Protocol coverage and gap register"
    - id: dq_period
      applies_to: "p_board"
      requirement: "Use matched periods and measured stock changes; retain raw stage data, detector limits, uncertainty and mass/water/carbon reconciliation without hiding residuals."
      evidence: "Calibrations, timestamps, raw data and balance report"
    - id: dq_transfer
      applies_to: "p_board"
      requirement: "No CORRIM Northern softwood parameter, EPA sawmill PTE factor, database estimate or guessed supplier formula becomes a board-factory default."
      evidence: "Source-scope and foreground compatibility review"
validation_rules:
  - rule_id: vr_reference
    applies_to: "accepted_board"
    rule: "Require exactly one accepted_board product output linked to the 1 kg net reference with declared qualifiers and matched cp_mass denominator in both languages. Broad kitchenware identity cannot be switched to another product."
    source_ids:
      - fda-food-code-2022
  - rule_id: vr_flow
    applies_to: "all inventory rows"
    rule: "Check flow type, physical species/material, treatment, medium/submedium, reference property/unit, supplier formulation and compatible background. Reject correction flows, particle-size substitutions and contradictory hard process/CAS restrictions. Applicable unresolved rows keep the dataset incomplete."
    source_ids: []
  - rule_id: vr_balance
    applies_to: "p_board"
    rule: "Reconcile unallocated wood/water/carbon, package, abrasive and oil accounts with stock changes and uncertainty. Stage internal transfers match at both ends. Retain real co-product quantities after burden allocation; no lost moisture is invented as emissions."
    source_ids:
      - usda-wood-handbook-2021
      - corrim-northern-lumber-2025
  - rule_id: vr_air
    applies_to: "pm25; pmcoarse; pmover10; water_vapour"
    rule: "Require actual consistent outlet/fugitive sampling or documented justified nonoccurrence, exclusive particulate bins and evidence for net evaporation. Do not turn PTE capacity, missing monitoring or a no-boiler route into measured zero emissions."
    source_ids:
      - epa-sawmill-pte-2014
  - rule_id: vr_recipe
    applies_to: "p_board"
    rule: "Verify no glue, coating, wax or applied oil on the reference board. Discovering one stops applicability and requires actual ingredient/formulation collection and separately reviewed methodology. Machine oil is not food-contact finishing oil."
    source_ids: []
  - rule_id: vr_review
    applies_to: "p_board"
    rule: "Report identity, measurement and source-scope coverage separately from methodological approval; candidate authorship or a CLI pass does not establish scientific review, food-contact certification or accepted mapping."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Production supply modelling of the same physically qualified sugar maple cutting board after all applicable collection/identity/background gaps are closed"
  excluded_use: "Automatic modelling of spoons/bowls/bamboo/glued/coated boards; lifetime comparison; carbon neutrality; food-contact certification; applying factory inventory to all CPC 31912 products"
  required_metadata: "Product qualifiers, source PCR/version, supplier/site/time, species and moisture, net output denominator, actual recipe, electricity supply boundary, upstream routes/freight, stage map, protocols and receivers"
  required_quality_disclosure: "Coverage, unresolved identities/metadata, actual measurements, uncertainty/residuals, unallocated physical and allocated burden accounts, source transfer limits and independent review state"
  update_trigger: "Species, single-piece construction, coating/glue, abrasive/oil recipe, moisture/drying supplier, energy, capture control, packaging, receiver or evidence changes"
