      raw_fields: "material/binder recipe; physical particle state; wet/dry mass; collector/source operation; same-period site/material attribution; dispatch/stock; consignee; actual fate; receiver/provider reference quantity"
      collection_method: "Separate bins/weighbridge and collector stock reconciliation; mixed streams require measured attribution. Verify clean-timber combustion/recycling route and MDF-dust composition/moisture/receiver compatibility separately; captured mass is not an air emission"
      unit: "kg; m3; count; fraction"
      frequency: "Each lot/shift; emissions by representative campaign"
      temporal_coverage: "Same declared production period for all quantities and D"
      site_scope: "One declared plant and configured route"
