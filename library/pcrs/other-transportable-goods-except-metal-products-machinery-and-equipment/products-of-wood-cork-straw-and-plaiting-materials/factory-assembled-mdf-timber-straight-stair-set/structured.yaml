      quality_evidence: "Calibration, supplier records, sampling coverage, uncertainty and reconciliation"
  calculation_rules:
    - id: calc_denominator
      applies_to: "all rows"
      rule: "D = sum(M_k)"
      inputs:
        - "Net accepted complete set masses in cp_output"
      output: "Common period kg denominator; exclude packaging/rework stock"
      source_ids:
        - staircraft-stairs-2023
    - id: calc_normalize
      applies_to: "all non-reference rows"
      rule: "a_i = q_i / D"
      inputs:
        - "Attributable period quantity and same-period D"
      output: "Row amount per 1 kg reference flow"
      source_ids:
        - staircraft-stairs-2023
    - id: calc_count
      applies_to: "screws; staples; packaging"
      rule: "q_i = count_i × sample_mass_i / sample_count_i"
      inputs:
        - "Matched physical specification and measured lot sample"
      output: "Period kg"
      source_ids:
        - staircraft-stairs-2023
    - id: calc_electric
      applies_to: "electricity"
      rule: "q_electricity = 3.6 × kWh"
      inputs:
        - "Attributed metered kWh"
      output: "MJ"
      source_ids:
        - staircraft-stairs-2023
    - id: calc_moisture
      applies_to: "wood and board"
      rule: "dry_mass = wet_mass / (1 + u); water_mass = wet_mass - dry_mass; w = u / (1 + u)"
      inputs:
        - "Validated dry-basis fraction u"
        - "resin/volatile correction where needed"
      output: "Separate solids and water ledgers"
      source_ids:
        - usda-wood-handbook-2021
    - id: calc_air
      applies_to: "PM bins; formaldehyde"
      rule: "q_i = integral(C_i × Vdot × dt) in matched kg/m3, m3/time and time; use exclusive measured particle bins"
      inputs:
        - "cp_air discharge sampling and controls"
      output: "Actual kg leaving to outdoor air; unmeasured bins remain missing"
      source_ids: []
  data_quality_requirements:
    - id: quality_balance
      applies_to: "stair-line"
      requirement: "Reconcile dry solids, glue solids, metal, packaging, water and carbon separately with stock changes, captured dust, discharged dust and rework. Quantify uncertainty; unexplained residual is not an invented emission."
      evidence: "cp_output; cp_material; cp_pack; cp_waste; cp_air; cp_water"
    - id: quality_identity
      applies_to: "all rows"
      requirement: "Keep route/material/state/property compatibility distinct from amount/background compatibility. Do not transfer a Tiangong identity comment recipe or literature mean into a site default."
      evidence: "supplier records; direct identity and background definition"
    - id: quality_completeness
      applies_to: "all rows"
      requirement: "Preserve missing values, detection limits and omitted activity. Foreground all-electric scope does not remove upstream or waste-treatment biogenic CO2; keep all actual releases in their own processes, distinct from carbon stored in the product."
      evidence: "site coverage and linked datasets"
