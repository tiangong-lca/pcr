allocation_rules:
  - rule_id: allocation_direct
    applies_to: "stair-line"
    rule: "Use segregated BOM and stage meters first; document causal machine-time/extraction allocation for shared resources with the same period denominator. EPD mass/volume allocation is a case, not a universal factor."
    source_ids:
      - staircraft-stairs-2023
  - rule_id: allocation_physical
    applies_to: "all products and wastes"
    rule: "Never multiply physical coproduct or waste outputs by a burden-allocation share. Reconcile the physical balance before allocating burdens. Any sold usable residue requires an evidenced end-of-waste boundary, allocation rationale and separately defined product flow; do not claim avoided energy credit at this factory gate."
    source_ids:
      - staircraft-stairs-2023
