      collection_method: "Stage submetering and verified main-meter reconciliation including factory services"
      unit: "kg; kWh"
      frequency: "Each lot/shift; emissions by representative campaign"
      temporal_coverage: "Same declared production period for all quantities and D"
      site_scope: "One declared plant and configured route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, supplier records, sampling coverage, uncertainty and reconciliation"
    - protocol_id: cp_pack
      process_id: "stair_line"
      flow_role: "packaging"
      record_type: "foreground_record"
      raw_fields: "polymer/flute specification; LDPE adhesive/support state; cardboard recyclable condition and receiver acceptance; delivered mass; scrap; stock; count; sample tare"
      collection_method: "Weigh actual bands/wrap/protectors separately; retain scrap destination and do not include pack in M"
      unit: "kg; m3; count; fraction"
      frequency: "Each lot/shift; emissions by representative campaign"
      temporal_coverage: "Same declared production period for all quantities and D"
      site_scope: "One declared plant and configured route"
