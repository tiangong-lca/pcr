      record_type: "foreground_record"
      raw_fields: "species; outlet; media; concentration; volumetric flux; T/P wet-dry basis; operating time; controls; detection limit; particle bins"
      collection_method: "Representative stack/fugitive discharge sampling with matched concentration and gas-volume basis; integrate actual mass flux; no worker exposure substitute"
      unit: "kg; m3; count; fraction"
      frequency: "Each lot/shift; emissions by representative campaign"
