      reason: "Flat PP strapping not twine, resin granules, cable tie or steel band. No confirmed finished strap identity."
    - row_id: "adhesive_waste"
      status: "pending"
      reason: "Candidate glue residue explicitly for wafer production; incompatible route/composition for uncured aqueous PVAc waste."
  source_metadata_debts:
    - row_id: "staples"
      uuid: "691b2092-38f6-4125-bfb4-cab3d86af41f"
      status: "pending"
      reason: "Broad steel assembly-fastener physical identity with unspecified type is conditionally compatible with actual steel staples. Raw CPC42944 excludes staples in strips; if supplied in strips, source-classification clarification remains pending. Actual grade/coating/dimensions/strip state and provider reference quantity must be recorded; no exact strip classification or complete background match is asserted."
    - row_id: "stair_output"
      uuid: "b8edb107-92dc-43d0-a6d0-0c2c898799d5"
      status: "pending"
      reason: "Comment trails into source heading 317; source extraction pollution, not a packaging route. Finished/manufactured, at plant, Product flow, Mass and CPC31629 are compatible with the explicitly bounded factory stair delivery set. Other joinery is outside this PCR."
    - row_id: "timber_offcut"
      uuid: "acc22294-8e77-4784-988f-2499be3c60eb"
      status: "pending"
      reason: "Unpressed untreated solid timber offcuts only. Name/wood synonyms/offcut description/at-plant Waste flow/Mass are consistent, with no contrary treatment field. Isolated CPC39282 agglomerated classification remains a source clarification debt after owner crossreview, not fully verified metadata; never substitute captured dust or pressed fuel."
    - row_id: "mdf_offcut"
      uuid: "acc22294-8e77-4784-988f-2499be3c60eb"
      status: "pending"
      reason: "Unpressed uncoated resin-bearing MDF solid offcuts only; preserve board binder recipe and destination. Name/wood synonyms/offcut description/at-plant Waste flow/Mass are consistent, with no contrary treatment field. Isolated CPC39282 agglomerated classification remains a source clarification debt after owner crossreview, not fully verified metadata; never substitute captured dust or pressed fuel."
    - row_id: "sawnwood"
      uuid: "ca253295-1699-4c83-9933-9467a136a4fc"
      status: "pending"
      reason: "Lumber physical name/description consistently denote sawn or planed sized timber including pine/oak. Isolated fibreboard classification does not match those physical fields and remains a source correction debt. Restrict to purchased dried untreated joinery stock; no preservative or green substitution."
  quantity_background_compatibility:
    - row_id: "sawnwood"
      status: "pending"
      reason: "Volume/m3 does not itself prove supplier/background solid volume definition at the same moisture and gate. Measure net piece geometry and wet/dry mass for the same lot; match explicitly declared supplier/background reference volume. Unknown correspondence means incomplete quantity/background link, not failed timber identity; secondary database mass coefficient is not density."
    - row_id: "pva"
      status: "pending"
      reason: "CAS9003-20-7 and original comment include aqueous PVAc emulsion with no opposite route. Confirm actual formulation and whether native kg means wet supply or polymer solids; retain actual solids/water/additives and compatible supplier full-formulation background. Do not apply dry-polymer quantities to wet glue or assume a formulation."
    - row_id: "staples"
      status: "pending"
      reason: "Match actual steel staple specification and native kg basis to provider; distinguish packaging/carrier and separately inventory any additional collation material outside the matched fastener reference. No invented recipe or mixed hardware quantity."
    - row_id: "timber_dust"
      status: "pending"
      reason: "Only actual separately captured untreated solid-timber fine powder/tiny chips with species, particle state and moisture records; verify actual offsite combustion/recycling receiver and compatible waste reference quantity. Unknown/contrary fate requires review, not a matched background claim."
    - row_id: "mdf_dust"
      status: "pending"
      reason: "Broad Dust identity alone does not match treatment. Record actual resin-bearing MDF particle/binder/moisture state, collector, same-period site/material attribution and actual receiver/fate; verify reference quantity and treatment compatibility. Mixed capture requires measured material attribution."
  dataset_admission_requirements: "Uncoated untreated PVAc-dispersion all-electric route is a deliberately narrower method scope, not a surveyed industry fact. Actual BOM/SDS/utility/packaging records must establish admission and complete each additional actual exchange before a site dataset is declared complete. Independent scientific review remains pending; current mapping and acceptance are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs."
