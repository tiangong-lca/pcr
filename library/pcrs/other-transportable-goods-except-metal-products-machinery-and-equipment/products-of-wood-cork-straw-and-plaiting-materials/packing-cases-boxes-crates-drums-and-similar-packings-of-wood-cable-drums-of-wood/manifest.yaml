  nail_scrap_background_compatibility:
    row_id: "steel_nail_scrap"
    uuid: "0e66603a-40d3-4c52-9223-4c18d32c11fd"
    source_context: "at plant, CN; final-assembly steel rejects; recycling/disposal unspecified"
    status: "actual_nail_state_receiver_CN_quantity_background_pending"
    requirement: "Only separately collected actual uncoated carbon-steel nail rejects from box assembly/rework. Record SKU/grade/dimensions, coating state, wood attachment/contamination, reject origin and actual receiver/fate. Separate steel from attached wood and unused-stock returns; verify actual plant/receiver/year/composition and native mass/transport/treatment reference compatibility before a complete dataset. No machine-shop swarf, gross mixed-material mass, assumed recovered quantity or recycling credit."
  integration_requirements:
    - "Verify current shared aliases/catalog/coverage against the accepted mapping during serial integration before consumption; the earlier author integration note is not current mapping or alias authority."
  quantity_compatibility:
    - "Flow UUIDs establish identities only. Supplier wood moisture and reference kg basis, electricity voltage and consumption boundary, oil grade, residue destination and monitoring media require actual site evidence before a complete dataset."
  selected_input_applicability:
    - row_id: "sawn_timber"
      uuid: "50904047-e5b0-4110-990a-53751d250267"
      requirement: "Actual incoming solid-sawn coniferous board thickness exceeds 6 mm, matching the coherent active CPC31101 scope. Measure each BOM component; inputs at or below 6 mm require a separately verified identity and applicability review before dataset completion. No plant thickness is assumed."
  electricity_background_compatibility:
    row_id: "electricity"
    uuid: "50657322-939c-4829-a87b-47c093bfa6a7"
    source_supply_geography: "CN"
    status: "actual_supplier_geography_year_quantity_basis_pending"
    requirement: "Verify actual supplier, supply geography, reference year, native quantity/unit basis, <1 kV user-side consumption boundary and included losses against the linked background. Physical AC identity is not a universal global background or evidence of site-matched quantitative compatibility. Nonmatching supply requires separate reviewed identity/background; no regional or numeric default."
  source_metadata_conflicts:
    - row_id: "wood_offcut"
      uuid: "acc22294-8e77-4784-988f-2499be3c60eb"
      field: "CPC classification 39282"
      status: "conditional_physical_identity_adopted; source_classification_clarification_pending"
      reason: "EN/ZH names, synonyms and comment describe woodworking offcuts; treatment route is empty. Per controller final adjudication, isolated classification does not establish agglomeration. Actual material must be untreated unagglomerated conifer solid wood, free of adhesive/coating contamination; recipient and background route must be documented. Supplier/source metadata clarification remains a debt; no claim that all record metadata is verified."
  broad_identity_qualifications:
    - row_id: "steel_nails"
      uuid: "ebfe08f5-42c8-484e-b39a-684a35981c24"
      decision: "adopted_with_explicit_physical_subset"
      reason: "Steel fasteners, production mix at plant GLO, auxiliary input for fabrication and assembly; no incompatible species, coating or machinery-only route restriction. This row is solely one actual uncoated carbon-steel wire box-nail SKU; generic fastener amounts or a screw dataset cannot substitute. Supplier/background matching remains required."
    - row_id: "finished_box"
      uuid: "39feb4f9-43da-4106-aa3c-f52afb654078"
      decision: "adopted_with_explicit_physical_subset"
      reason: "Manufactured finished-product definition explicitly includes solid-sided/lidded/bottomed boxes; no contradictory material/route limitation. Only the declared nailed conifer sawn-board box is applicable."
