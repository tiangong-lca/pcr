allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "box_manufacture"
    rule: "Prefer actual batch measurement/submeter attribution for the same box design. Attribute shared compressed air, extraction and handling using measured electricity and verifiable runtime or service quantities with disclosed causality; payload rating is not an energy driver."
    source_ids:
      - usda-nailing-1959
  - rule_id: allocation_waste
    applies_to: "wood_offcut, sawdust_waste, steel_nail_scrap, used_oil"
    rule: "This route has finished_box as its sole accepted product output; documented waste transfer creates no default co-product share or substitution credit. If a residue is sold as a distinct useful co-product, revise the inventory with its correct product identity, collection and an independent allocation decision first; a waste row cannot be retained while claiming completeness."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: allocation_physical
    applies_to: "all inventory rows"
    rule: "Keep complete physical outputs and mass/water/carbon ledgers after environmental burdens are attributed. Never multiply physical waste/co-product outputs by burden-allocation shares or close mass gaps using waste credits. Internal loops have equal quantities at both ends and only external net flows are exchanged."
    source_ids:
      - usda-wood-handbook-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "box_manufacture"
      flow_role: "finished_box"
      record_type: "weighing/acceptance"
      raw_fields: "box design; configuration; lot; count; individual net mass including lid; installed nail mass and exact-SKU fastening ledger; acceptance record; moisture"
      collection_method: "Weigh accepted complete empty boxes and matched lids on a calibrated scale; tare scale pallet/separate transport wrapping, exclude cargo; sum accepted net mass Q by configuration without mixing dimensions/payloads."
      unit: "kg"
      frequency: "each box acceptance; batch reconciliation"
      temporal_coverage: "same complete representative campaign; stock and maintenance events covered"
      site_scope: "same site, route and box configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original weigh records; acceptance and matched-lid records"
    - protocol_id: cp_material
      process_id: "box_manufacture"
      flow_role: "sawn_timber; steel_nails"
      record_type: "issue/return/stock"
      raw_fields: "material SKU; species; grade; component thickness and >6 mm selected-UUID applicability; board dimensions/solid volume; moisture; purchased net mass; opening/closing stock; issue/return; nail specification/weighing"
      collection_method: "Weigh boards and nails separately for issue, return and stocks; match BOM and campaign. Solid material volume can convert only with measured same-batch/same-moisture density, never cavity volume. Nail counts require measured unit nail mass for that SKU."
      unit: "kg"
      frequency: "each lot; purchasing/stock handover"
      temporal_coverage: "same complete representative campaign; stock and maintenance events covered"
      site_scope: "same site, route and box configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; issue/return ledger; BOM; batch weights/moisture"
    - protocol_id: cp_energy
      process_id: "box_manufacture"
      flow_role: "electricity"
      record_type: "meter/service attribution"
      raw_fields: "cutting; nailing compressed-air; extraction; rework; inspection; handling meter readings; voltage; supplier; supply geography; year; provider reference quantity/unit and delivery/loss boundary; shared runtime/service quantities"
      collection_method: "Read calibrated user-side meters/submeters; retain stage consumption and shared attribution evidence without counting compressor and nail-tool energy twice. Without submeters record measured attributable energy and uncertainty; unproven attribution prevents dataset completion."
      unit: "kWh"
      frequency: "each campaign; billing reconciliation"
      temporal_coverage: "same complete representative campaign; stock and maintenance events covered"
      site_scope: "same site, route and box configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; bills; submeter/attribution logs"
    - protocol_id: cp_residue
      process_id: "box_manufacture"
      flow_role: "wood_offcut; sawdust_waste; steel_nail_scrap"
      record_type: "weighing/waste transfer"
      raw_fields: "net mass by atomic waste; moisture; container tare; opening/closing stock; internal reuse; nail SKU/grade/coating and assembly reject source; wood attachment and separate steel mass; recipient/use; actual receiver and CN reference compatibility"
      collection_method: "Weigh clean offcuts, captured sawdust and rejected nails individually; verify destination, exclude captured mass from emissions and internal reuse from external transfer; distinguish waste from actual co-products."
      unit: "kg"
      frequency: "each transfer; campaign/stock reconciliation"
      temporal_coverage: "same complete representative campaign; stock and maintenance events covered"
      site_scope: "same site, route and box configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original weigh records; waste receipts; reuse ledger"
    - protocol_id: cp_maintenance
      process_id: "box_manufacture"
      flow_role: "mineral_oil; used_oil"
      record_type: "maintenance/oil weighing"
      raw_fields: "oil grade/SDS; issue/return; makeup; reservoir stocks; removed waste oil; equipment/service attribution"
      collection_method: "Weigh actual petroleum new oil and removed waste oil separately, attribute by in-scope equipment service; reconcile stocks/consumption/destinations, do not infer unmeasured oil mist or leaks as zero; actual leaks require separate medium/species rows."
      unit: "kg"
      frequency: "each makeup/oil change; full maintenance cycle"
      temporal_coverage: "same complete representative campaign; stock and maintenance events covered"
      site_scope: "same site, route and box configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "oil documentation; maintenance/waste-oil originals"
    - protocol_id: cp_air
      process_id: "box_manufacture"
      flow_role: "pm_fine; pm_coarse; pm_large"
      record_type: "exhaust/fugitive monitoring"
      raw_fields: "total filterable PM; PM10; PM2.5; medium; dry/wet/T/P basis; exhaust volume; operating time; control conditions; fugitive sources"
      collection_method: "Determine emissions using applicable actual outlet/fugitive monitoring or a verified site model; retain methods, detection limits and uncertainty; concentration and exhaust volume share dry/wet/T/P basis. Incompatible size data remain pending, without EPA sawmill factor substitution."
      unit: "kg"
      frequency: "representative operating/control states; campaign durations"
      temporal_coverage: "same complete representative campaign; stock and maintenance events covered"
      site_scope: "same site, route and box configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "monitoring originals; outlet/fugitive inventory; control logs"
    - protocol_id: cp_moisture
      process_id: "box_manufacture"
      flow_role: "water_vapour; all wood rows"
      record_type: "moisture/material balance"
      raw_fields: "wood input/output/stock wet mass and dry-basis moisture; oven-dry samples; species; sampling position; retained and released wood water"
      collection_method: "Use representative oven-drying to stable mass per Wood Handbook chapter 13, with matching initial wet mass for dry-basis moisture; electrical readings require species/temperature correction and oven-dry comparison. Balance wood, nails, oil and water separately; do not call every unexplained mass gap evaporation."
      unit: "kg; dry-basis fraction"
      frequency: "each material/product/residue lot and stock point"
      temporal_coverage: "same complete representative campaign; stock and maintenance events covered"
      site_scope: "same site, route and box configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling; weighing; oven-drying; uncertainty records"
  calculation_rules:
    - id: campaign_normalization
      applies_to: "all inventory rows"
      rule: "Q=sum of accepted empty-box net masses including matched lids in the campaign; each atomic exchange=attributable campaign external exchange total/Q; finished_box=Q/Q=1 kg. Reconcile issues, returns and movements within the same stock boundary first."
      inputs:
        - "campaign totals"
        - Q
        - cp_output
      output: "per 1 kg reference flow"
      source_ids:
        - usda-nailing-1959
    - id: count_disclosure
      applies_to: "finished_box; steel_nails"
      rule: "Report measured kg/box by configuration=accepted net mass total/accepted box count; nail count mass=exact-SKU count × measured mean mass per nail of that SKU, with sampling and uncertainty; no default item mass."
      inputs:
        - cp_output
        - cp_material
      output: "measured kg/box and kg nail"
      source_ids:
        - usda-nailing-1959
    - id: wood_water_balance
      applies_to: "all wood rows; water_vapour"
      rule: "For each wood-only flow: dry wood mass=wet wood mass/(1+u), wood water=wet wood mass-dry wood mass. Finished-box wet wood mass=accepted empty-box net mass minus installed steel nail mass from the exact-SKU fastening ledger; never divide whole box mass (including nails) by 1+u. Dry wood inputs+opening stocks=finished dry wood+waste dry wood+dry wood in emitted particles+closing stocks+verified other losses; reconcile nails and oil separately. Water input+opening water stocks=water retained in finished wood and residues+water in emitted particles+closing water stocks+verified water vapour loss; there is no process-water addition in this route. Released water comes only from this same-campaign ledger; particle wood/water/carbon fractions need characterization, not an assumption that all PM is oven-dry wood."
      inputs:
        - cp_material
        - cp_output
        - cp_residue
        - cp_air
        - cp_moisture
      output: "unallocated dry wood and water balance"
      source_ids:
        - usda-wood-handbook-2021
    - id: electric_conversion
      applies_to: "electricity"
      rule: "Actual campaign kWh × 3.6 yields MJ, then divide by Q; retain stage records without adding compressed-air energy a second time."
      inputs:
        - cp_energy
        - Q
      output: "MJ per 1 kg reference flow"
      source_ids:
        - usda-nailing-1959
    - id: particle_intervals
      applies_to: "pm_fine; pm_coarse; pm_large"
      rule: "Only for the same sampling/time/medium/control basis: fine=PM2.5; intermediate=PM10-PM2.5; large=total filterable PM-PM10. Intervals are non-negative and are normalized by Q before their respective rows. Incompatible/incomplete data or negative differences require review, not forced truncation to zero."
      inputs:
        - cp_air
        - Q
      output: "three disjoint kg exchanges per 1 kg reference flow"
      source_ids:
        - epa-sawmill-dust-2014
  data_quality_requirements:
    - id: identity_quantity
      applies_to: "all inventory rows"
      requirement: "Distinguish identity verification from quantity/background compatibility row by row; blank UUID is pending identity, missing measurement is not zero, and incomplete data cannot be called complete."
      evidence: "supplier documents; monitoring; row identity/background review"
    - id: representativeness
      applies_to: "box_manufacture"
      requirement: "Record site, lot, period, sample counts, calibration, stocks, losses and maintenance events; a regional softwood survey does not represent all timber or box factories."
      evidence: "original records and uncertainty"
    - id: carbon_balance
      applies_to: "all wood rows"
      requirement: "Reconcile biogenic carbon in input, product, residues, emitted wood particles and stocks using measured dry wood and a sourced carbon fraction; no default carbon fraction or negative-emission credit. Count upstream uptake once; actual biogenic CO2 cannot be removed from LCI by a GHG reporting convention. Actual foreground combustion requires route completion and review."
      evidence: "physical carbon ledger; upstream data; carbon-fraction source"
validation_rules:
  - rule_id: validate_scope
    applies_to: "finished_box"
    rule: "Accept only the declared new nailed coniferous solid-board box; a family selector cannot include cable drums, plywood boxes or other products. Actual foreground treatment or combustion without complete rows makes validation incomplete."
    source_ids:
      - usda-nailing-1959
      - usda-crate-1964
      - ippc-ispm15-2018
  - rule_id: validate_reference
    applies_to: "finished_box"
    rule: "Require exactly one reference finished-product output and the shared 1 kg denominator with measured same-configuration net box mass including matched lid; dimensions, useful volume and payload are not mass or functional equivalence evidence."
    source_ids:
      - usda-nailing-1959
      - usda-wood-handbook-2021
  - rule_id: validate_atomic
    applies_to: "all inventory rows"
    rule: "Each row is one atomic exchange; blank UUID, unresolved background quantity basis and omitted positive emissions remain pending. Conditional rows require occurrence/absence records; lookup failure is not no-match and identity success is not dataset completeness."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: validate_balance
    applies_to: "all inventory rows"
    rule: "Verify campaign wood, nails, oil, water and sourced biogenic carbon in the physical ledger before allocation; internal handovers have equal quantities and residue transfer/stocks/reuse are not duplicated. Explain mass gaps and monitoring uncertainty without balancing through allocation shares or credits."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: validate_air
    applies_to: "pm_fine; pm_coarse; pm_large; water_vapour"
    rule: "Air medium and size must match direct-read identities; use disjoint size rows, and captured sawdust is not emission. Actual additional VOCs, oil mist, condensables or leaks require separate specific species/medium rows before claiming completeness, without broad-pollutant or correction substitutes."
    source_ids:
      - epa-sawmill-dust-2014
  - rule_id: validate_treatment
    applies_to: "finished_box"
    rule: "Kiln drying and purchasing records alone do not prove a heat-treatment process or valid IPPC mark; declare source, treatment location and actual evidence, without conformity claims where absent."
    source_ids:
      - ippc-ispm15-2018
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Factory-gate box manufacture module for explicitly compatible transport-packaging models only after independent review and complete data"
  allowed_use: "Use only where actual route, box configuration/performance, moisture and completeness match; convert purchased counts with measured kg/box"
  excluded_use: "Cable drums, panel boxes, barrels, pallets, structural crates, shook, reused boxes, extended treatment/combustion routes, a universal wood-packaging factor or export-conformity proof"
  required_metadata: "Section 3 qualifiers; boundary, year/region, reference quantity, quantity/background compatibility, upstream links, waste receipt and emission media"
  required_quality_disclosure: "Collection coverage, calibration/sample count, physical mass/water/carbon ledgers, submeters/shared attribution, unmeasured/pending rows and detection limits; this method has no independent scientific review"
  update_trigger: "Changed box design, species/board grade, moisture, nail finish, power supply, waste destination, treatment/manufacturing route or source/measurement evidence"
data_sources:
  - id: "usda-nailing-1959"
    type: "handbook"
    reference: "L. O. Anderson, USDA Forest Products Laboratory, Nailing Better Wood Boxes and Crates, Agriculture Handbook 160, September 1959; https://www.govinfo.gov/content/pkg/GOVPUB-A-PURL-gpo19907/pdf/GOVPUB-A-PURL-gpo19907.pdf"
