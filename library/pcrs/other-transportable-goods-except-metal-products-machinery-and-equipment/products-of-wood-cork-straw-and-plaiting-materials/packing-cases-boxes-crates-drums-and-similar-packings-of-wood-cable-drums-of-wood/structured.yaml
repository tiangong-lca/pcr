  - id: campaign_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Every row is reported per 1 kg reference flow; accepted net mass total Q from the same campaign is the shared denominator. Count records require measured kg/box and actual count for the same configuration to obtain Q; capacity or payload cannot substitute."
  - id: wood_mass
    applies_to: "sawn_timber, wood_offcut, sawdust_waste"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record delivery/transfer wet mass separately from oven-dry wood mass; dry-basis moisture fraction u=(wet mass-dry mass)/dry mass, and dry wood mass=wet mass/(1+u). Purchased-background kg basis must match that moisture state."
  - id: electric_units
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Electricity uses the record energy reference property; 1 kWh=3.6 MJ. This is not multiplication by fuel calorific value; sum actual user-side electricity and verify the low-voltage interface."
