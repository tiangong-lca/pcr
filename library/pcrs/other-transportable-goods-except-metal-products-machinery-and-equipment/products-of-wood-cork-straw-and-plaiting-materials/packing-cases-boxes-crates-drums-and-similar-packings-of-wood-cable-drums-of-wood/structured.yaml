system_boundary:
  rules:
    - rule_id: boundary_upstream
      applies_to: "all inputs"
      rule: "Link upstream data compatible with delivered state, species, moisture, route, property and unit; another PCR or a regional CORRIM lumber survey is not a box-factory coefficient."
      source_ids:
        - usda-wood-handbook-2021
    - rule_id: boundary_aggregation
      applies_to: "box_manufacture"
      rule: "Cutting, part nailing, assembly, rework, extraction, acceptance and handling before delivery form one aggregated foreground unit with separately measured stages. Internal box-part handovers stay in the physical ledger, not a second finished output with the reference UUID. Both ends of an internal transfer record the same quantity, without duplicate external exchanges."
      source_ids:
        - usda-nailing-1959
    - rule_id: boundary_treatment
      applies_to: "box_manufacture"
      rule: "A wooden-box, kiln-dried or classification name cannot establish heat treatment/fumigation or an IPPC mark. Actual supplier treatment is covered by sourced upstream data. Actual foreground treatment requires a separate treatment stage, individual atomic inputs/emissions and energy bases followed by review; the present route inventory is incomplete."
      source_ids:
        - ippc-ispm15-2018
    - rule_id: boundary_emissions
      applies_to: "pm_fine, pm_coarse, pm_large"
      rule: "Record only particles released to the outdoor environment; captured quantities are technosphere waste. EPA sawmill PTE does not cover boilers, condensable particles or measured box-factory coefficients; do not copy its indoor-activity zero assumption."
      source_ids:
        - epa-sawmill-dust-2014
boundary_abstraction:
  declared_starting_condition: "Supplier-delivered kiln-dried unimpregnated coniferous sawn timber and purchased nails received at plant; moisture and upstream drying/treatment declared"
