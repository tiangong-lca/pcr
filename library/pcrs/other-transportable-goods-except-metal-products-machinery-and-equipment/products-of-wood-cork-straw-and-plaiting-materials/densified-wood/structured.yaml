        - usda-wood-handbook-2021
        - cabral-densification-2022
    - rule_id: boundary_external
      applies_to: "manufacture"
      rule: "Linked background carries upstream emissions; foreground exhaust contains site releases only. External waste treatment is not also a site emission."
      source_ids:
        - usda-wood-handbook-2021
        - cabral-densification-2022
