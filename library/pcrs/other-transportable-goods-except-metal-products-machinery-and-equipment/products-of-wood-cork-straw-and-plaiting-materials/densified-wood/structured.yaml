allocation_rules:
  - rule_id: allocation_physical
    applies_to: "all inventory rows"
    rule: "Keep the unallocated physical wood/water/carbon balance separate from allocated environmental burdens; internal links have equal quantities, and physical co-product outputs are not multiplied by allocation shares."
    source_ids: []
  - rule_id: allocation_subdivision
    applies_to: "manufacture"
    rule: "Prefer subdivision and direct metering; shared electricity uses measured load/runtime drivers with residual reconciliation, not nameplate-power guesses."
    source_ids: []
  - rule_id: allocation_residues
    applies_to: "manufacture"
    rule: "Waste rows describe waste transfers. Sold sawdust/shavings/trim require verified separate atomic product rows and co-product determination rather than waste UUID reuse. Establish causal allocation before assigning burdens; otherwise disclose economic prices/period/shares and sensitivity. No automatic recycling credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "manufacture"
      flow_role: "finished_blank"
      record_type: "collected_record"
      raw_fields: "accepted batch; net wet mass; oven-dry sample mass; dimensions/volume; moisture; conditioning RH/temperature/time; intended use and rejects"
      collection_method: "Calibrated scales and dimensional instruments; paired moisture specimens; acceptance against order specification, excluding packaging; Accepted net wood mass supplies period denominator D; all exchanges aggregated per 1 kg reference flow"
      unit: "kg; m3; %"
      frequency: "each batch/continuous monitoring and period reconciliation"
      temporal_coverage: "declared representative production period including startup/idle/rejects"
      site_scope: "same site/route with specified equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, batch records, test reports and uncertainty"
    - protocol_id: cp_wood
      process_id: "manufacture"
      flow_role: "birch_stock"
      record_type: "collected_record"
      raw_fields: "botanical species; origin/drying state; batch; mass/moisture/dimensions; growth-ring orientation; formulation records for no added adhesive/resin/coating/chemical"
      collection_method: "Receipt weights/invoices and supplier formulation reconciliation; paired oven-dry sampling; trace to finished batch; External stock consumption with inventory change divided by D; per 1 kg reference flow"
      unit: "kg; m3; %"
      frequency: "each batch/continuous monitoring and period reconciliation"
      temporal_coverage: "declared representative production period including startup/idle/rejects"
      site_scope: "same site/route with specified equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, batch records, test reports and uncertainty"
    - protocol_id: cp_press
      process_id: "manufacture"
      flow_role: "manufacture"
      record_type: "collected_record"
      raw_fields: "pressure/force and loaded area; platen/core temperature; holding/cooling time; compression direction; initial t0, loaded tc, released tr, conditioned tf, post-cycle tcycle; failure/cracking"
      collection_method: "Continuous batch press sensor records; actual humidity cycles and reconditioning states; compare density at matching states; hydraulic-line pressure is not wood pressure; Batch distributions linked to D; inventory consistently per 1 kg reference flow"
      unit: "MPa; degC; s; mm"
      frequency: "each batch/continuous monitoring and period reconciliation"
      temporal_coverage: "declared representative production period including startup/idle/rejects"
      site_scope: "same site/route with specified equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, batch records, test reports and uncertainty"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "electricity"
      record_type: "collected_record"
      raw_fields: "stage meter start/end; kWh; voltage; load; idle/rejects; supplier and transformer boundary"
      collection_method: "Calibrated meters reconciled to purchases/main meter; record drivers and residuals for shared stage meters; Attributable period electricity converted to MJ then divided by D; per 1 kg reference flow"
      unit: "kWh; MJ"
      frequency: "each batch/continuous monitoring and period reconciliation"
      temporal_coverage: "declared representative production period including startup/idle/rejects"
      site_scope: "same site/route with specified equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, batch records, test reports and uncertainty"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "conditioning_water; conditioning_effluent"
      record_type: "collected_record"
      raw_fields: "water supply/grade; recycle and net make-up; condensate/purge; destination; composition; stock changes"
      collection_method: "Calibrated meter, tank-level and flow reconciliation; measure liquid density/temperature before mass-volume conversion; Each external water exchange separately divided by D; per 1 kg reference flow"
      unit: "kg; m3"
      frequency: "each batch/continuous monitoring and period reconciliation"
      temporal_coverage: "declared representative production period including startup/idle/rejects"
      site_scope: "same site/route with specified equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, batch records, test reports and uncertainty"
    - protocol_id: cp_aux
      process_id: "manufacture"
      flow_role: "used_oil; packing_film"
      record_type: "collected_record"
      raw_fields: "individual waste-oil or film grade; mass; receipts/stocks; waste-oil transfer records; contaminants"
      collection_method: "Weigh each waste-oil transfer and packaging-film consumption separately; do not subtract waste-oil drains from fresh hydraulic-fluid input; each mass divided by D; per 1 kg reference flow"
      unit: "kg"
      frequency: "each batch/continuous monitoring and period reconciliation"
      temporal_coverage: "declared representative production period including startup/idle/rejects"
      site_scope: "same site/route with specified equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, batch records, test reports and uncertainty"
    - protocol_id: cp_hydraulic
      process_id: "manufacture"
      flow_role: "hydraulic_oil"
      record_type: "collected_record"
      raw_fields: "mineral-base grade and additive specification; fresh-fluid deliveries/returns; unused and operating-fluid opening/closing stocks; fill/makeup volume; temperature; mass; measured grade-specific density; drains and losses"
      collection_method: "Calibrated flow/tank/invoice reconciliation; V = m / rho(T) only with measured positive finite matching density; fresh volume from deliveries plus opening unused stock minus closing unused stock and unused returns; reconcile operating-fluid opening stock plus introduction against closing stock, drains and actual losses. Never count circulation or subtract drained used oil from fresh input. Each fresh period volume divided by D; per 1 kg reference flow"
      unit: "m3; kg; kg/m3; degC"
      frequency: "each batch/continuous monitoring and period reconciliation"
      temporal_coverage: "declared representative production period including startup/idle/rejects"
      site_scope: "same site/route with specified equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, batch records, test reports and uncertainty"
    - protocol_id: cp_residues
      process_id: "manufacture"
      flow_role: "captured_sawdust; planing_shavings; rejected_solid"
      record_type: "collected_record"
      raw_fields: "separate dust/shavings/solid-reject weights; moisture; rework; transfer notes; sale/disposal contracts"
      collection_method: "Separate containers/weighing; reconcile matching wet/dry batch bases with receivers; avoid captured/escaped double counting; Each external residue exchange divided by D; per 1 kg reference flow"
      unit: "kg"
      frequency: "each batch/continuous monitoring and period reconciliation"
      temporal_coverage: "declared representative production period including startup/idle/rejects"
      site_scope: "same site/route with specified equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, batch records, test reports and uncertainty"
    - protocol_id: cp_air
      process_id: "manufacture"
      flow_role: "water_vapour; pm_fine; pm_coarse; pm_large; methanol_air; formaldehyde_air; acetic_acid_air; biogenic_co2"
      record_type: "collected_record"
      raw_fields: "stack/fugitive sources; controls; gas flow/temperature/pressure/wet-dry basis; species concentration/detection limit; time; nested particle basis; biogenic carbon evidence"
      collection_method: "Site screening and qualified species/size testing; align gas and concentration state and integrate actual time; distinguish nondetect from unmeasured, without assumed zeros; water/carbon cross-check; Each distinct emission mass divided by D; per 1 kg reference flow; retain biogenic CO2"
      unit: "kg"
      frequency: "each batch/continuous monitoring and period reconciliation"
      temporal_coverage: "declared representative production period including startup/idle/rejects"
      site_scope: "same site/route with specified equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, batch records, test reports and uncertainty"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "D = period accepted net conditioned wood in kg; divide each physical period exchange total by D to obtain its amount per 1 kg reference flow. D must be positive; missing site values are not fabricated."
      inputs:
        - cp_reference
        - "all collection protocols"
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: hydraulic_conversion
      applies_to: "hydraulic_oil"
      rule: "q = V / D; V = m / rho(T) when measured mass is converted using the same grade at measured T. Keep physical oil mass m = rho(T)*V and operating-stock/drain/loss balance separately; never infer a default density or subtract drains from virgin input."
      inputs:
        - cp_hydraulic
        - cp_reference
      output: "m3 hydraulic fluid per kg reference flow, plus separate physical mass balance"
      source_ids: []
    - id: density_compression
      applies_to: "birch_stock, finished_blank"
      rule: "rho = m / V; verify physical density increase using paired initial rho0 and final rhof at matching moisture/temperature, with volume change and dry-wood mass loss. Compression ratio CR = (t0 - tf) / t0; release springback SB = (tr - tc) / tc; this record's cyclic compression-loss ratio R = (tcycle - tf) / (t0 - tf). Ratios are dimensionless; nonpositive denominators are undefined. Measure tcycle after return to the conditioning state of tf. R is this record's explicit measurement convention and must not be compared directly with differently defined literature SR indices."
      inputs:
        - cp_wood
        - cp_reference
        - cp_press
      output: "density and separate recovery test indicators"
      source_ids:
        - usda-wood-handbook-2021
        - cabral-densification-2022
    - id: physical_balance
      applies_to: "manufacture"
      rule: "Before burden allocation, reconcile whole-stream mass and elemental carbon separately: opening stock + inputs = closing stock + outputs + reported residual, using actual composition and all relevant boundary crossings. Chemical reactions do not generate or consume total elemental carbon. Separately reconcile molecular H2O and reactive wood/resin components using opening stock + inputs + evidenced formation = closing stock + outputs + evidenced consumption + reported residual. Quantify only actual cure/thermal/oxidation pathways and extent; phase changes are transfers, not reactions. A zero reaction term requires evidence of absence; unknown extent remains unresolved, with no assumed full cure, generic yield or balancing emission. Track retained binder/additives and wood versus fossil carbon separately. Internal transfers cancel only with matched endpoints; measured outputs containing reaction products are counted once. Keep uncertainty explicit and do not apply burden shares to physical outputs. Use measured or traceable species/composition carbon fractions, not a universal default; CO2 carbon mass = CO2 mass × 12/44."
      inputs:
        - cp_wood
        - cp_reference
        - cp_residues
        - cp_water
        - cp_air
      output: "physical balances and residuals"
      source_ids:
        - usda-wood-handbook-2021
  data_quality_requirements:
    - id: identity_route
      applies_to: "all inventory rows"
      requirement: "Verify continuous solid grain, actual compression/fixation and absence of glue/impregnation; UUID identity alone does not establish background compatibility"
      evidence: "cp_wood; cp_press; cp_reference"
    - id: coverage
      applies_to: "all inventory rows"
      requirement: "Declare applicable/not applicable/unmeasured and detection limits per row; unknown is not zero, and additional species/auxiliaries need atomic rows"
      evidence: "cp_air; cp_aux; batch records"
    - id: physical_basis
      applies_to: "all inventory rows"
      requirement: "Both languages use accepted net conditioned wood; retain biogenic CO2 in LCI and never add nested PM totals"
      evidence: "cp_reference; cp_air"
    - id: source_scope
      applies_to: "manufacture"
      requirement: "Historical glued yellow-poplar veneer tests, coniferous surveys and sawmill PTE factors are not defaults for this solid-wood factory; require site full-route records"
      evidence: "usda-staypak-1956; site records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_blank"
    rule: "Require verified Wood material identity with all actual resin-free yellow-birch compression/fixation, moisture, geometry, net mass and provider/quantity qualifiers. MDF, lumber-core plywood, ordinary bonded panels and generic man-made board are not substitutes. Exactly one reference-output row is required; physical identity success does not complete measurements or background linkage."
    source_ids:
      - usda-wood-handbook-2021
      - usda-staypak-1956
      - cabral-densification-2022
  - rule_id: validate_fixation
    applies_to: "manufacture"
    rule: "Verify physical compression and fixation using paired mass/volume/moisture and pressing, release and conditioning-cycle records; water loss, natural density or untested stability claims are insufficient."
    source_ids:
      - usda-wood-handbook-2021
      - usda-staypak-1956
      - cabral-densification-2022
  - rule_id: validate_quantities
    applies_to: "all inventory rows"
    rule: "Use one positive D with actual pressure/temperature/time/moisture and stage measurements; unknown quantities/identities remain unresolved, with no invented enhancement multiplier from historical data."
    source_ids:
      - usda-wood-handbook-2021
      - usda-staypak-1956
      - cabral-densification-2022
  - rule_id: validate_hydraulic
    applies_to: "hydraulic_oil"
    rule: "Confirm actual mineral formulation, supplier/background gate, native Volume/m3 basis, matching measured T and positive finite density for conversions. Fresh volume uses the same D; kg-only evidence without matched density is incomplete. Waste oil stays a separate mass output and physical operating stock balance; no repeated circulation or netting of drains."
    source_ids: []
  - rule_id: validate_air
    applies_to: "manufacture"
    rule: "Match outdoor-air compartment; indoor, stratospheric, long-term and biogenic-CO2 uptake/correction flows are not substitutes. Use non-overlapping particulate bins, separate methanol/formaldehyde/acetic acid, and do not hide additional species inside total VOC."
    source_ids:
      - usda-wood-handbook-2021
      - usda-staypak-1956
      - cabral-densification-2022
  - rule_id: validate_balances
    applies_to: "manufacture"
    rule: "Check physical wood/water/carbon balances, equal internal handoffs and residuals; allocation shares apply only to the relevant burden ledger. Missing background compatibility or measurement coverage is incomplete."
    source_ids:
      - usda-wood-handbook-2021
      - usda-staypak-1956
      - cabral-densification-2022
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Following complete identity/measurement/background verification and independent review, use for the actual tool-handle-blank production route"
  allowed_use: "Matching species/route/delivery state and declared application after actual collection and provider qualification; candidate methodology does not itself supply a complete measured dataset"
  excluded_use: "Whole-CPC-31520 average; ordinary panels/compreg/MDF; end-use functional equivalence; unverified stability or enhancement multipliers"
  required_metadata: "Site/year/species; process and pressure/temperature/recovery records; net-mass moisture basis; identities/backgrounds/waste routes"
  required_quality_disclosure: "Row-level measured/unresolved/not-applicable status; uncertainty, balance residuals, allocation drivers and all uncovered scope"
  update_trigger: "Change of species, heat supply, pressure/temperature route, adhesive/resin, stability, specification, background or waste destination"
data_sources:
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory (2021), Wood handbook—wood as an engineering material, FPL-GTR-282. https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf; Chapters 4, 13 and 19, especially printed 19-5 and 19-10"
    used_for: "Moisture/density basis; resin-free compressed wood versus compreg and wet-wood recovery; application limits. No process numbers transferred."
  - id: "usda-staypak-1956"
    type: "official_guidance"
    reference: "Seborg, Millett and Stamm, Heat-stabilized compressed wood (Staypak), FPL Report No. 1580 (Revised), information reviewed and reaffirmed March 1956. https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo43146/pdf/GOVPUB-A13-PURL-gpo43146.pdf; printed pages 1, 7-8"
    used_for: "Historical evidence for solid yellow birch and no-synthetic-resin route. Glued yellow-poplar veneer experiments are not factory parameters for solid wood."
  - id: "cabral-densification-2022"
    type: "literature"
    reference: "Cabral et al. (2022), Densification of timber: a review on the process, material properties, and application. Journal of Wood Science 68:20. https://doi.org/10.1186/s10086-022-02028-3; Fundamentals of timber densification, Fig. 4 and Eqs. 1-3"
    used_for: "Compression stages and distinction between release springback and cyclic set recovery. This record explicitly defines dimensional states in its test formulas and adopts no universal enhancement or factory average."
