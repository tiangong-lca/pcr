measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use net accepted conditioned wood mass as denominator; exclude packaging and rejects. Oven-dry or gross mass is not a substitute."
  - id: moisture_basis
    applies_to: "birch_stock, finished_blank"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "u = (m_wet - m_dry) / m_dry; m_dry = m_wet / (1 + u). u is a dry-basis mass ratio; divide percentages by 100 first. Compare paired feedstock/final density at comparable moisture and temperature, separating water loss from physical compression."
  - id: energy_unit
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Record low-voltage AC consumption; 1 kWh = 3.6 MJ. This conversion assigns neither press efficiency nor net delivered steam heat."
  - id: hydraulic_volume
    applies_to: "hydraulic_oil"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Use actual fluid volume at recorded temperature; V = m / rho(T) only with measured positive finite density in kg/m3 for the same grade and temperature. Report V/D in m3/kg and retain m = rho(T)*V for mass balance; no default density."
