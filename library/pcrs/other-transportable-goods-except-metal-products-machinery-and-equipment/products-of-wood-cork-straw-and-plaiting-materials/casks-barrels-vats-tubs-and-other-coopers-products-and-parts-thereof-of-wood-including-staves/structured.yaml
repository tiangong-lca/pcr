measurement_rules:
  - id: reference_mass
    applies_to: "accepted_new_oak_barrel"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q is measured accepted net mass of a compatible batch of complete barrels after test drainage, including installed hoops and supplied closure but excluding test water and dispatch packaging. Use cp_acceptance. All inventory rows use per 1 kg reference flow; keep raw batch totals."
  - id: wood_water_basis
    applies_to: "all wood and residue rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record as-received mass and dry-basis moisture u for each stage. m_dry = m_wet/(1+u), where u is kg water/kg oven-dry wood. Measure oak MC; do not use a generic density or softwood MC. Moisture loss is not automatically wood yield loss. [usda-wood-2021]"
  - id: power_basis
    applies_to: "all electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "For verified <1 kV alternating current, measured kWh × 3.6 = MJ electrical energy. Match supplier voltage and delivered boundary; no fuel calorific or generation-efficiency conversion is inferred from the database property label."
  - id: gas_volume_basis
    applies_to: "all natural gas rows"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Use cp_heat for measured volume at stated T/P, composition, wet/dry state and compressibility; match the background reference-volume convention. Unknown compatibility remains pending; no assumed density from secondary flow coefficients."
  - id: steam_basis
    applies_to: "bending_purchased_steam"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Collect delivered steam mass, pressure, temperature, dryness and return conditions. A net delivered heat calculation needs supplier enthalpy definition and a site steam/condensate/blowdown balance; a MJ property alone is insufficient. Do not select high-pressure or source-specific paper/chemical steam for unspecified cooperage supply."
  - id: elementary_basis
    applies_to: "all elementary output rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep chemical/CAS identity, carbon origin, source stage and receiving air subclass. NOx mass versus NO2-equivalent requires explicit compatible definitions; exclude N2O and avoid double-counting NO/NO2. PM2.5, PM2.5-PM10 and >PM10 are disjoint emitted fractions, not three cumulative PM totals. [epa-wood-boilers; epa-sawmill-pte-scope]"
