allocation_rules:
  - rule_id: allocation_direct
    applies_to: "new_barrel_production"
    rule: "First use measured subdivision or causal direct attribution. Finishing, leak tests, permanent hoops and barrel-only packaging belong to the barrel. Saleable wood coproducts are identified by actual destination/contract; waste disposition alone does not establish a coproduct."
    source_ids:
      - corrim-allocation-case
      - taransaud-quality
  - rule_id: allocation_physical_ledger
    applies_to: "all inventory rows"
    rule: "Maintain the complete unallocated physical stage, dry-mass/water/carbon ledger. Internal offcut fuel is accounted once with matching produced and consumed mass and moisture. Whole-unit internal transfers cancel; do not assign avoided upstream fuel burden or duplicate purchases without a separately declared substitution scenario."
    source_ids:
      - usda-wood-2021
      - thermal-wood-2005
  - rule_id: allocation_shared_burden
    applies_to: "shared environmental burdens"
    rule: "If unavoidable shared burdens remain, justify a site-specific physical causal relationship for eligible coproducts; report the eligible masses and shares. If no physical relationship can be defended, justify economic attribution using same-period net revenues and test an alternative. The softwood case supplies no oak cooperage allocation share or default method."
    source_ids:
      - corrim-allocation-case
  - rule_id: allocation_no_mass_scaling
    applies_to: "coproduct outputs and internal links"
    rule: "Apply allocation shares only to the burden account, never multiply actual barrel/coproduct output quantities, residual carbon, internal wood transfers or measured water by a share. Keep the full physical ledger alongside the allocated product dataset; reconcile that ledger rather than demanding mass closure in the reduced burden ledger."
    source_ids:
      - usda-wood-2021
      - corrim-allocation-case
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "new_barrel_production"
      flow_role: "accepted product"
      record_type: "acceptance/weighing"
      raw_fields: "model; batch; oak species; capacity; permanent hoop/closure mass; test result; accepted count; accepted net mass Q; drain state; MC; stock movement"
      collection_method: "Calibrated weighing of every accepted configuration after draining test water; exclude dispatch packaging; compare batch and dispatch records; sum accepted net kg Q; denominator for every per 1 kg reference flow inventory"
      unit: "kg; count; model capacity"
      frequency: "each accepted batch"
      temporal_coverage: "Cover manufacture dates, including returns and rejects"
      site_scope: "Compatible model/toast batches only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration and linked acceptance/dispatch receipts"
    - protocol_id: cp_wood
      process_id: "new_barrel_production"
      flow_role: "oak receipt and stage state"
      record_type: "stock/weighing/moisture"
      raw_fields: "lot; botanical species; origin evidence/unknown; split/sawn/seasoned; wet mass; dimensions; MC samples; initial/final stocks; rejects; time"
      collection_method: "Weigh lots and stage wood; moisture by representative oven-stable sample masses or calibrated oak-adjusted meter checked against oven method; record extractive-loss uncertainty; correct stock change; sum attributable wood per 1 kg reference flow using Q"
      unit: "kg; dry-basis moisture"
      frequency: "each lot and state change"
      temporal_coverage: "Include multi-season seasoning cohort, not just current-year dispatch"
      site_scope: "Seasoning yard and cooperage/supplier identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Lot traceability; sample representativeness; paired mass/MC records"
    - protocol_id: cp_resources
      process_id: "new_barrel_production"
      flow_role: "stage electricity and water"
      record_type: "meter/activity"
      raw_fields: "stage; batch; meter; start/end; kWh; fresh water kg or volume/density; rain; reused water; pump/compressor/extraction boundary; stocks"
      collection_method: "Stage meters and calibrated water meters; record shared loads by measured causal duty, reconcile utility invoices; convert water volume only with actual state/density; sum measured attributable quantities / Q; per 1 kg reference flow"
      unit: "kWh; MJ; kg; m3"
      frequency: "per stage/batch, bills per reporting period"
      temporal_coverage: "Same manufacture/seasoning cohorts as Q"
      site_scope: "Factory meter boundaries declared"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; invoice and shared-load closure"
    - protocol_id: cp_heat
      process_id: "new_barrel_production"
      flow_role: "fuel, steam and internal heat"
      record_type: "fuel/enthalpy"
      raw_fields: "stage; batch; purchased fuel; internal offcut fuel; species; moisture; heating value measured basis; gas T/P wet/dry composition Z; supplier m3; steam mass P/T/x; condensate; blowdown; heat boundary"
      collection_method: "Calibrated fuel/steam meters and weighing; obtain supplier reference definitions; use site steam-water enthalpy balance for heat conversions only when every relevant state is documented; sum compatible externally exchanged quantities / Q; per 1 kg reference flow; retain internal ledgers"
      unit: "kg; m3; MJ with defined basis"
      frequency: "batch and source changes, including startup/shutdown"
      temporal_coverage: "Cover actual seasoning assistance/bending/toast/boiler operation"
      site_scope: "Purchased and internal supply separately"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier basis; instruments; heat and fuel balance; missing-state disclosure"
    - protocol_id: cp_parts
      process_id: "new_barrel_production"
      flow_role: "hoops, closure and packing"
      record_type: "bill of materials/weighing"
      raw_fields: "model; component; material/coating; origin/provider; permanent/temporary; net mass; scrap; packing component; stock; tool replacement"
      collection_method: "Weigh installed components and consumed wrapping separately; use compatible supplier BOM, reconcile temporary-tool service/replacement records; sum attributable components / Q; per 1 kg reference flow"
      unit: "kg"
      frequency: "batch/model/component change"
      temporal_coverage: "Same acceptance period as Q"
      site_scope: "Factory and suppliers declared"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable BOM; coating included; separate transport packaging"
    - protocol_id: cp_residues
      process_id: "new_barrel_production"
      flow_role: "individual coproduct/waste streams"
      record_type: "weighing/destination"
      raw_fields: "stage; stream; source; moisture; dry mass; carbon; sold/internal/discarded; contract; price; treatment recipient; stock"
      collection_method: "Segregated weighing and sampled carbon/moisture; reconcile waste manifests, sales and internal fuel use; collect runoff/test/blowdown flow and contamination; full physical outputs / Q; per 1 kg reference flow; allocation kept separately"
      unit: "kg; water volume plus defined density"
      frequency: "each removed or sold lot"
      temporal_coverage: "Same stock-corrected production/seasoning cohorts"
      site_scope: "Yard/cooperage and receiving treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Contracts/receipts; distinct streams and destinations"
    - protocol_id: cp_air
      process_id: "new_barrel_production"
      flow_role: "each emitted species/outlet"
      record_type: "source test/speciation"
      raw_fields: "stage; outlet; operating time; fuel/wood carbon origin; species CAS; concentration; gas flow; T/P moisture O2; detection limit; size method; filterable/condensable; control; startup/shutdown"
      collection_method: "Representative source sampling and calibrated exhaust flow integration after controls; species-specific validated factors only with matching fuel/technology/control/activity basis and uncertainty. Unknown values are missing, not zeros; sum emitted species mass per compatible source regime / Q; per 1 kg reference flow"
      unit: "kg species; concentration and defined gas volume"
      frequency: "representative regimes; every control/fuel/toast change"
      temporal_coverage: "Integrate complete reporting period and transient regimes"
      site_scope: "Thermal hood, machining outlet and boiler stack distinct"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Lab accreditation/method; calibration; uncertainty; speciation/source evidence"
    - protocol_id: cp_balance
      process_id: "new_barrel_production"
      flow_role: "physical wood-water-carbon ledger"
      record_type: "stage reconciliation"
      raw_fields: "dry wood in/out; retained barrel wood; wood/hoop mass; internal fuel; water receipt/rain/spray/reuse/runoff/steam/evaporation; char/ash; emitted species carbon; C fractions; stock"
      collection_method: "Reconcile stage ledgers using measured stock change, moisture and elemental carbon; investigate residuals, distinguish heat-induced dry loss from evaporation; verify emitted rather than generated species; stock-corrected full balances / Q; per 1 kg reference flow"
      unit: "kg dry matter; kg water; kg C"
      frequency: "each cohort and reporting period"
      temporal_coverage: "Cover seasoning and manufacture through Q acceptance"
      site_scope: "Unallocated physical foreground including internal links"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Closure residual and uncertainty, no forced zero"
  calculation_rules:
    - id: normalize_batch
      applies_to: "all inventory rows"
      rule: "Divide stock-corrected attributable exchange totals by accepted net barrel mass Q from cp_acceptance; express per 1 kg reference flow. For the reference product, Q/Q = 1 kg/kg. Retain the physical and allocated burden accounts separately."
      inputs:
        - cp_acceptance
        - cp_resources
        - cp_wood
        - cp_heat
        - cp_parts
        - cp_residues
        - cp_air
        - cp_balance
      output: "batch-normalized exchanges"
      source_ids:
        - usda-wood-2021
    - id: dry_wood
      applies_to: "wood and residue rows"
      rule: "u = (m_wet - m_oven)/m_oven; m_dry = m_wet/(1+u). Sample the same material state; do not subtract water again from oven-dry mass."
      inputs:
        - m_wet
        - m_oven
        - cp_wood
        - cp_residues
      output: "dry material mass and moisture"
      source_ids:
        - usda-wood-2021
    - id: water_reconcile
      applies_to: "season_water_vapour, test_drying_vapour, thermal_water_vapour, boiler_water_vapour"
      rule: "Apply independently to each named stage and cohort: evaporation = incoming water (wood, fuel, fresh water, rain, imported steam and internal transfer) + independently evidenced chemical water formed - outgoing retained/exported water (wood, runoff, test water, blowdown, condensate and internal transfer) - stored-water change. Match internal transfers at both ends; cancel them only in the whole-unit ledger. Never assign a whole-unit evaporation total to multiple stage rows. Unknown infiltration, chemical formation or stage partition remains unresolved."
      inputs:
        - cp_balance
        - cp_wood
        - cp_resources
        - cp_heat
        - cp_residues
      output: "water balance and evidenced vapour mass"
      source_ids:
        - usda-wood-2021
    - id: carbon_reconcile
      applies_to: "wood, fuel and air rows"
      rule: "For each carbon origin, input carbon = retained barrel carbon + exported coproduct/waste carbon + removed char/ash carbon + emitted species carbon + stock change + disclosed residual. Use measured dry mass times measured compatible C fraction. Derive species carbon by molar stoichiometry; combustion and pyrolysis share the same carbon supply and cannot each receive all of it."
      inputs:
        - cp_balance
        - cp_wood
        - cp_heat
        - cp_residues
        - cp_air
      output: "separate biogenic/fossil carbon ledger"
      source_ids:
        - thermal-wood-2005
        - epa-wood-boilers
    - id: particulate_partition
      applies_to: "all PM rows"
      rule: "From the same outlet, period, method and PM phase basis, the 2.5-10 fraction equals cumulative PM10 minus cumulative PM2.5; >10 equals comparable total PM minus PM10. Use only evidenced nonnegative differences with propagated uncertainty. Otherwise keep the size distribution unresolved. Do not add cumulative totals alongside these disjoint fractions."
      inputs:
        - cp_air
        - "outlet and phase compatibility"
      output: "disjoint emitted PM fractions"
      source_ids:
        - epa-sawmill-pte-scope
        - epa-wood-boilers
  data_quality_requirements:
    - id: quality_basis
      applies_to: "all inventory rows"
      requirement: "Use compatible receipt/model/toast cohorts and complete seasoning stock changes, never divide old stock inputs by only current dispatch Q"
      evidence: "cp_acceptance, cp_wood"
    - id: quality_uncertainty
      applies_to: "all inventory rows"
      requirement: "Unknown origin, capacity, life, quantities, provider basis, chemical definition or emission distribution remain explicit. No empirical default ranges until independent boundary-compatible evidence exists. Report instruments, variation and model uncertainty"
      evidence: "cp_heat, cp_air, cp_balance"
    - id: quality_evidence
      applies_to: "new_barrel_production"
      requirement: "Manufacturer route sources and laboratory pyrolysis cases support method design only. Do not transfer softwood survey yields/MC, regulatory PTE, generated pyrolysate percentages or aroma measurements to actual emitted kg"
      evidence: "usda-wood-2021, thermal-wood-2005, epa-sawmill-pte-scope, corrim-allocation-case"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference flow"
    rule: "Require new unused all-oak wine-barrel identity, finished completeness and leak acceptance; reject stave-only, refurbished or unqualified different toast/service configurations. UUID inclusion does not resolve background applicability."
    source_ids:
      - taransaud-quality
      - seguin-toasts
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "Exactly one accepted_new_oak_barrel reference output is 1 kg and every exchange uses the same stock-corrected Q denominator. Keep stages distinct, prevent duplicate product outputs and audit all internal links for equal physical quantity."
    source_ids:
      - usda-wood-2021
  - rule_id: validate_flows
    applies_to: "all inventory rows"
    rule: "Verify exact physical/chemical identity against name, CAS, route, current classification, reference property and unit; a conflicting species/CAS or hard treatment/route blocks adoption even if a name looks right. An isolated source-classification error may permit conditional use of a coherent physical identity only with an explicit metadata debt, actual material/state/provider verification and source-owner clarification; it is not complete metadata validation. Each row is atomic, with exact Chinese baseName when provided; blank UUIDs retain their concrete exchange and missing-identity disclosure."
    source_ids:
      - usda-wood-2021
  - rule_id: validate_energy
    applies_to: "all utility rows"
    rule: "Require measured delivered energy/volume/mass on a supplier-compatible basis. Distinguish purchased steam from internal boiler heat, apply kWh/MJ conversion only to electric energy, and leave gas/steam basis compatibility pending when unknown."
    source_ids:
      - epa-wood-boilers
  - rule_id: validate_emissions
    applies_to: "all elementary outputs"
    rule: "Require outlet/medium, actual escaped species, carbon origin and quantity-definition evidence. Verify NOx convention excluding N2O, disjoint PM and filterable/condensable scope. Do not substitute correction flows or equate visible smoke with a PM mass; preserve biogenic CO2 despite GHG-reporting conventions."
    source_ids:
      - thermal-wood-2005
      - epa-wood-boilers
      - epa-sawmill-pte-scope
  - rule_id: validate_closure
    applies_to: "physical ledger and allocation"
    rule: "Reconcile dry material, water, biogenic/fossil carbon and all measured destinations with stock changes and uncertainty; retain unexplained residuals. Review allocation against the full unallocated physical ledger and the separately allocated burden ledger; do not change coproduct mass to close allocated burdens."
    source_ids:
      - usda-wood-2021
      - corrim-allocation-case
  - rule_id: validate_completeness
    applies_to: "dataset profile"
    rule: "Before a complete cradle-to-gate dataset claim, resolve physically present UUID/provider gaps and all route quantities, add actual unlisted atomic flows and treatment releases, disclose skipped checks and uncertainty, and verify all required qualifiers. PCR authored status does not prove site-data or independent methodology approval."
    source_ids:
      - taransaud-quality
      - usda-wood-2021
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified new-oak-wine-barrel supply in a wine model or a secondary cooperage manufacturing dataset"
  allowed_use: "Only matching new barrel material, state, capacity/model, bending/toast configuration and declared supply boundary; convert service amounts with independently measured barrel mass/capacity and use cycles"
  excluded_use: "Stave-only, old/refurbished, spirits-charred, other-wood or unqualified wine-service comparisons; carbon-neutral claims or unsupported generic oak industry factors"
  required_metadata: "Reference qualifiers; factory/year and cohort; upstream/provider boundary; atomic exchanges and property/unit; raw protocol records; physical mass/water/carbon ledger; emission definitions; allocation basis"
  required_quality_disclosure: "Identity/provider/quantity gaps, missing ranges, sampling/MC/carbon uncertainty, omitted stages/flows, gas/steam basis compatibility, PM/NOx conventions and method/site review status"
  update_trigger: "Species/source, receipt moisture/state, seasoning, geometry, hoop/coating, bending/toast/fuel/control, test method, supply/provider or allocation change"
data_sources:
  - id: "seguin-process"
    type: "literature"
    reference: "Seguin Moreau, From forest to product, current original snapshot; https://www.seguin-moreau.fr/en/innovation/from-forest-to-product/; retrieved 2026-10-12"
    used_for: "Process order, air seasoning, machining, fire bending; manufacturer example, no quantitative defaults"
  - id: "seguin-toasts"
    type: "literature"
    reference: "Seguin Moreau, Wine barrels, Toast levels; https://www.seguin-moreau.fr/en/wine-ranges/barrels-wine/; retrieved 2026-10-12"
    used_for: "Steam tightening and sensory toast are distinct, with product-specific profiles"
  - id: "taransaud-quality"
    type: "literature"
    reference: "Taransaud, Quality Control team; https://www.taransaud.com/en/craftsmanship/our-teams/quality-control-team/; retrieved 2026-10-12"
    used_for: "Individual leak/final acceptance and traceability; manufacturer origin/seasoning durations not generalized"
  - id: "usda-wood-2021"
    type: "handbook"
    reference: "USDA FPL, Wood Handbook FPL-GTR-282 (2021), Ch.4 pp.4-1/4-11; Ch.13 pp.13-2/13-6; Ch.18 p.18-14; https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf; retrieved 2026-10-12"
    used_for: "General moisture/density basis, oven measurement, drying and distinction between optical smoke and particulate mass; no construction wood MC copied"
  - id: "thermal-wood-2005"
    type: "handbook"
    reference: "Rowell and LeVan-Green (2005), Thermal Properties, Handbook of Wood Chemistry and Wood Composites, pp.121-125, Sec.6.1, Table6.1; https://research.fs.usda.gov/download/treesearch/22046.pdf; retrieved 2026-10-12"
    used_for: "Wood pyrolysis versus combustion and conditional species screening; laboratory pyrolysate shares are not oak-barrel emission factors"
  - id: "epa-wood-boilers"
    type: "official_guidance"
    reference: "US EPA AP-42 Section1.6 Wood Residue Combustion in Boilers (March2022), Sec.1.6.1-1.6.4, Tables1.6-1/1.6-3 and footnotes; https://www.epa.gov/system/files/documents/2022-03/c1s6_final.pdf; retrieved 2026-10-12"
    used_for: "Conditional matching boilers only: species, fuel/control dependencies, factor basis, PM definitions; no factor or 99% carbon conversion default"
  - id: "epa-sawmill-pte-scope"
    type: "official_guidance"
    reference: "US EPA Region10 (8May2014), Particulate Matter PTE Emission Factors for Activities at Sawmills, Excluding Boilers, pp.1-2; https://www.epa.gov/sites/default/files/2016-09/documents/spmpteef_memo.pdf; retrieved 2026-10-12"
    used_for: "Scope restriction, opacity not a PM-mass conversion and cumulative size definitions; PTE factors not actual cooperage LCI"
  - id: "corrim-allocation-case"
    type: "literature"
    reference: "CORRIM (22July2025), LCA of Softwood Lumber Production – Northern Region, Sec.3.2.6 p.16; https://corrim.org/wp-content/uploads/2025/07/LCA-Report-Northern-Lumber-Report-07222025.pdf; retrieved 2026-10-12"
    used_for: "Illustrates burden partition and product-only packaging in a softwood case; no cooperage mass shares, yield, fuel or moisture imported"
