      issue: "Current Wood waste is a 1 kg collected non-agglomerated waste locator at generation, CPC39283, with composition and treatment unspecified; earlier CPC39282/primary-production/municipal-percentage observations are historical, not its current definition. Adopt only actual separately collected untreated oak shavings with measured moisture, wood/adhesive/coating/preservative contamination and receiver/fate. Collection does not establish harmlessness, recycling eligibility, combustion treatment, exact provider compatibility or avoided-product credit."
    - uuid: "8b100f0f-21c2-4373-b469-a67b4f87973e"
      affected_rows:
        - "accepted_new_oak_barrel"
      issue: "Official Chinese baseName mistranslates coopers products as copperware. Preserve official selected name; coherent English name, wood classification and container comment support the qualified complete wooden barrel. Source-owner translation clarification remains pending."
