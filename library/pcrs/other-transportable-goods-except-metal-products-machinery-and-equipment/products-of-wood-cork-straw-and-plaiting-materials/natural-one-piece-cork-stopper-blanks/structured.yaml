allocation_rules:
  - rule_id: alloc_separate
    applies_to: "conversion"
    rule: "First avoid allocation by stage metering or defensible unit subdivision. Keep physical process/stock/water/carbon ledgers separate from allocated environmental-burden accounts; trace plank cost/burdens to output grades and sold offcuts."
    source_ids:
      - spanish-natural-stopper-2022
  - rule_id: alloc_basis
    applies_to: "conversion"
    rule: "When allocation cannot be avoided, assess physical causality and use measured physical relationships where valid; otherwise use economic shares from same-period factory-gate quantity×unit price, recording all outputs with economic function, currency, price window and sensitivity. Never default to case quantities or allocation percentages."
    source_ids:
      - spanish-natural-stopper-2022
  - rule_id: alloc_physical
    applies_to: "all inventory rows"
    rule: "Apply allocation shares to burdens, never to physical co-product outputs. Divide reference-product burdens by Q; offcut/dust physical rows retain actual total amounts/Q and cannot disappear into yield or negative inputs. Record only actual external net exchanges once for internal reuse."
    source_ids: []
  - rule_id: alloc_residues
    applies_to: "offcut_out; dust_out"
    rule: "Outputs with payment revenue and economic function participate in the selected allocation; waste without economic function gains no share merely from recyclability, and treatment-burden ownership must be transparent. dust_out is currently a waste exchange; if records establish an economic co-product, change flow type and resolve a compatible identity before rechecking. Document applicable by-product/product or waste status and customer acceptance specifications separately; payment alone does not establish Product status or compatible treatment. Do not combine economic allocation with undeclared fuel-substitution credits."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "conversion"
      flow_role: "Planks, blanks, offcuts, dust, water and carbon"
      record_type: "weighing_and_lot_records"
      raw_fields: "lot; species; thickness; grade; wet mass; wet-basis moisture and method; dry-cork carbon fraction; cork share in mixed dry solids; cork-associated versus non-cork water; opening/closing stocks; stage transfers; adhering dust; transport distance/mode; receiver; ownership; revenue/prices; accepted Q"
      collection_method: "Calibrated batch weighing with tare; representative documented moisture method that distinguishes water from other volatiles; documented dry-carbon assay. Match lots at each stage and reconcile weighing tickets, acceptance and stocks; no generic moisture or carbon fraction. Aggregation requirement: Same-period physical total for each row / accepted net blank mass Q; per 1 kg reference flow"
      unit: "kg; fraction"
      frequency: "Each lot and monthly stock reconciliation"
      temporal_coverage: "Complete consecutive 12 months or justified complete production season including downtime/abnormal events"
      site_scope: "Declared site and this one punching route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; water/carbon tests; lot and two-end transfer records; supplier upstream coverage; receiver records"
    - protocol_id: cp_energy
      process_id: "conversion"
      flow_role: "Low-voltage electricity"
      record_type: "meter_records"
      raw_fields: "start/end meter; kWh; voltage; supplier; meter boundary; stage/other-product submetering; extraction/idle/packing; period"
      collection_method: "Verify user-side meters against invoices for consumption electricity below 1 kV; meter shared equipment or document causal apportionment and reconciliation. Aggregation requirement: Same-period attributable kWh × 3.6 / Q; per 1 kg reference flow"
      unit: "kWh; MJ"
      frequency: "Each shift and invoice cycle"
      temporal_coverage: "Same period as cp_material"
      site_scope: "This route meters, extraction and packing"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter checks, invoices, supplier and loss boundary"
    - protocol_id: cp_abrasive
      process_id: "conversion"
      flow_role: "New and spent belts"
      record_type: "maintenance_records"
      raw_fields: "supplier article; grit/backing/binder; dimensions; unit mass; stock; replacement count; wear; adhering cork; spent-belt receiver"
      collection_method: "Retain article specification and weighing; reconcile consumption through stocks and replacement logs, weigh spent belts and adhering cork and establish abrasive-wear destinations. Aggregation requirement: Same-period row mass / Q; per 1 kg reference flow"
      unit: "kg; count"
      frequency: "Each replacement and stock period"
      temporal_coverage: "Same period as cp_material"
      site_scope: "Dry sizing equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Actual article/formulation records; weighing; receiver treatment records"
    - protocol_id: cp_pack
      process_id: "conversion"
      flow_role: "Film and shipping boxes"
      record_type: "packing_records"
      raw_fields: "packaging presence/absence; PE grade/composition; film unit mass; box composition/mass; closure method; counts; period; delivery recipient"
      collection_method: "Reconcile purchases/issues; sample tare-corrected component masses against pack-out/shipping counts and stock; do not transfer finished-closure case packaging amounts or atmosphere. Aggregation requirement: Same-period component mass actually consumed / Q; per 1 kg reference flow"
      unit: "kg; count"
      frequency: "Each packaging lot and issue period"
      temporal_coverage: "Same period as cp_material"
      site_scope: "Factory-gate pack-out at this boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier material/composition; weighing; shipping/stock records"
    - protocol_id: cp_air
      process_id: "conversion"
      flow_role: "Outdoor particulate emissions in three disjoint size intervals"
      record_type: "sampling_and_operating_records"
      raw_fields: "outlet/fugitive source; size cut; method/detection limit; concentration; wet/dry/T/P basis; air volume; control state; operating hours; cork/abrasive composition; sampling period"
      collection_method: "Post-control size-resolved sampling and air-volume metering covering operating states and fugitives; integrate concentration×volume at common wet/dry/T/P basis. Below-detection results retain upper bounds/uncertainty; unsampled intervals remain gaps; captured mass is not emitted mass. Aggregation requirement: Same-period released total in each disjoint interval / Q; per 1 kg reference flow"
      unit: "kg; mg/m3; m3; h"
      frequency: "Representative states and after control changes, with continuous operating-hour records"
      temporal_coverage: "Corresponding cp_material period, with extrapolation coverage disclosed"
      site_scope: "Actual outdoor releases; air subcompartment unspecified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Sampling reports, flow checks, detection limits, controls/operating records"
  calculation_rules:
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "Divide each same-period physical row total by Q; fix the reference row at 1 kg. Divide allocated burdens by Q separately; never alter physical quantities using burden shares."
      inputs:
        - "row total"
        - Q
        - "linked collection protocol"
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: electricity_conversion
      applies_to: "electricity_in"
      rule: "E_MJ=3.6×E_kWh at the same user-side meter boundary."
      inputs:
        - E_kWh
        - cp_energy
      output: "E_MJ"
      source_ids: []
    - id: water_reconciliation
      applies_to: "vapour_out"
      rule: "Use cork-associated water consistently, accounting separately for non-cork or abrasive-borne water. Net evaporated cork water = incoming plank water + opening cork-stock water − water in blanks/offcuts/captured dust/cork adhering to spent belts − closing cork-stock water − water carried by released cork particles where actually measured. Keep particle-associated water separate from water vapour and non-cork/abrasive water; no water fraction is invented for a dry-particle measurement. First verify absence of other water exchanges and non-water volatile losses. Do not clamp negative results to zero; investigate moisture gain/other exchanges and add characterization."
      inputs:
        - "wet mass"
        - "wet-basis moisture"
        - "stock water"
        - cp_material
      output: "evaporated kg water"
      source_ids: []
    - id: pm_intervals
      applies_to: "pm25_out; pmcoarse_out; pmover10_out"
      rule: "For one matched sampling system, fine=PM2.5, coarse=PM10−PM2.5, larger=comparable total particles−PM10; differences require complete method coverage and nonnegative values. mg×10^-6=kg; concentration×same-basis volume gives mass. Cumulative PM10/total are reconciliation quantities, not extra LCI emissions."
      inputs:
        - "size-resolved concentrations"
        - "air volume"
        - "operating hours"
        - cp_air
      output: "three disjoint emitted masses"
      source_ids: []
  data_quality_requirements:
    - id: dq_route
      applies_to: "conversion"
      requirement: "Verify boiled stabilized incoming Quercus suber, unbonded one-piece punching without washing/coating and handover to finishing; align supplier/order/site boundaries."
      evidence: "supplier/order/acceptance records"
    - id: dq_balance
      applies_to: "all inventory rows"
      requirement: "Physical dry-cork/water/biogenic-carbon balances include period stocks, actual output grades, offcuts, captured dust, wear composition, adhering dust and releases; compare residuals with instrument uncertainty and explain, without invented yield/tolerance."
      evidence: "cp_material; cp_abrasive; cp_air"
    - id: dq_background
      applies_to: "all inventory rows"
      requirement: "Identity success is not complete background data: check state/unit/supply boundary/geography/time/losses for every provider link and disclose unresolved UUIDs/source classification defects."
      evidence: "provider scope evidence"
    - id: dq_screen
      applies_to: "conversion"
      requirement: "Screen actual maintenance oil, cleaning agents, input packaging residues, additional consumables and abnormal emissions; add atomic exchanges/collection where present and do not claim dataset completeness with remaining gaps."
      evidence: "site screening and maintenance records"
