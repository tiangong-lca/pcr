system_boundary:
  rules:
    - rule_id: sb_start
      applies_to: "all inventory rows"
      rule: "Retain bark and boiling upstream burdens. Prepared-plank background must match treatment, moisture, heat, water and effluent boundaries. If supplier data end at raw bark, add boiling/stabilization; do not count the same boiling twice."
      source_ids:
        - jrc-cork-chain-2017
        - spanish-natural-stopper-2022
    - rule_id: sb_route
      applies_to: "conversion"
      rule: "Include receipt, strip cutting, punching, dry sizing, grading, extraction and pack-out only. No foreground boiler, steam, combustion, granulation/bonding or washing/coating; a facility performing them needs an expanded, evidenced atomic inventory and cannot conceal them inside this route."
      source_ids:
        - jrc-cork-chain-2017
        - spanish-natural-stopper-2022
    - rule_id: sb_stages
      applies_to: "conversion"
      rule: "Aggregate conversion and handover into one foreground unit while retaining separate stage mass, electricity and loss ledgers. Actual internal transfers must agree at both ends and are not extra external outputs; only one accepted reference output is allowed."
      source_ids: []
    - rule_id: sb_chemicals
      applies_to: "conversion"
      rule: "Do not substitute generic glue or coating for unknown formulations. Actual wash chemicals, colmation agents, silicone, paraffin, ink or preserving gas are outside this route and require actual substances, concentration/wet-dry basis and doses for a separate assessment. Purchased belt binder and box glue stay in their manufactured-consumable backgrounds, not invented foreground dosing."
      source_ids:
        - jrc-cork-chain-2017
        - spanish-natural-stopper-2022
    - rule_id: sb_carbon
      applies_to: "all inventory rows"
      rule: "Keep separate physical dry-cork, water and biogenic-carbon ledgers. Absence of site combustion does not permit deleting biogenic CO2 from LCI: retain upstream heat-source biogenic/fossil emissions and any actual foreground oxidation, resolving correct species and compartment, regardless of GHG reporting convention. Stocked carbon is not automatically negative emission or permanent storage."
      source_ids: []
