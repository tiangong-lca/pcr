  - rule_id: val_route
    applies_to: "conversion"
    rule: "Do not merge agglomerated stoppers, turning, disc bonding, boards or finished-closure washing/coating into this route; disclose missing purchased-plank upstream boiling heat/water/effluent."
    source_ids:
      - jrc-cork-chain-2017
      - spanish-natural-stopper-2022
  - rule_id: val_air
    applies_to: "pm25_out; pmcoarse_out; pmover10_out; vapour_out"
    rule: "Check elementary species, air/unspecified subcompartment, Mass/kg, disjoint size intervals and sampling coverage. Workplace dust, captured waste and water-compartment vapour cannot stand in for outdoor releases; actual biogenic CO2 cannot be deleted for reporting convention."
    source_ids: []
  - rule_id: val_completeness
    applies_to: "all inventory rows"
    rule: "Report specific unresolved/skipped scope for missing consumable identity, background chains, emission measurements or unexplained balances; do not claim complete LCI or cradle-to-gate. Method is available for independent review; actual site data still require collection."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site-specific punched natural one-piece blank manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Background input to downstream finishing for this same unwashed/uncoated gate; assemble a bounded product system when complete upstream evidence supports it"
  excluded_use: "Ready-to-bottle closures, all CPC31922, agglomerated boards/stoppers, unknown adhesive/coating recipes or unverified negative-carbon/compliance claims"
  required_metadata: "Species, one-piece identity, boiled/stabilized input, size/grade, net wet mass/moisture basis, site/period, operations, packaging/voltage, suppliers/receivers, upstream/downstream gate, allocation"
  required_quality_disclosure: "Measured share; stock/mass/water/carbon balances; PM sampling/detection limits; unresolved UUID/source metadata defects; background matching, missing scope and allocation sensitivity"
  update_trigger: "Changes to provider boiling heat/boundary, voltage, punching/extraction, blank grade/moisture, belt recipe, packaging, by-product status or handover state"
