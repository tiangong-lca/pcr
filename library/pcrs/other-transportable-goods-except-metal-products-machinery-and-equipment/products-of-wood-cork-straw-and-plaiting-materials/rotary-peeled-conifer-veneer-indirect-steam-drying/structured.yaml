allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "veneer_mill"
    rule: "First use operation meters and separate branch records. Assign veneer drying/redrying, final grading and packaging directly to accepted dried veneer and the rejects generated there. No upstream saleable green core or clipping receives downstream drying or packaging burden."
    source_ids:
      - corrim-western-plywood-2025
  - rule_id: allocation_dry_mass
    applies_to: "veneer_mill"
    rule: "For genuinely joint pre-separation operations, allocate burdens among useful outputs by their measured ovendry mass leaving that operation: share_i=dry_i/sum(dry_useful_outputs). Apply successively at debarking and peeling, retaining the green veneer stream into drying. Waste receives no product allocation share; retain its treatment burden with the responsible operation. Physical exchange quantities are never reduced by allocation shares. This dry-mass refinement is an explicit synthesis of the physical-mass precedent and moisture measurement."
    source_ids:
      - corrim-western-plywood-2025
      - usda-wood-moisture-2021
  - rule_id: allocation_recovery
    applies_to: "bark_coproduct; peel_core; wood_clip_coproduct"
    rule: "Require contracts, destination and moisture evidence before treating an output as useful. Internal recycling has no coproduct share or export credit. Do not combine attributional allocation with avoided-fuel credits. If physical subdivision/allocation cannot represent the actual functions, retain the problem for review and disclose an economic-allocation sensitivity using observed prices, never an invented default."
    source_ids:
      - corrim-western-plywood-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "veneer_mill"
      flow_role: "accepted_veneer"
      record_type: "measurement"
      raw_fields: "production cohort and immutable lot/parcel genealogy; unique first-acceptance id/date; species; dimensions; grade; calibrated first-accepted net mass Q0 and dry-basis moisture u0; tare; gross dispatch and linked returns; disjoint D_new, FG_new and each L_new destination; current mass/moisture and original-basis conversion; post-acceptance loss/scrap/downgrade/use; rework/WIP transfers, failed activity and reacceptance; opening accepted FG and purchased finished-sheet movements; opening/closing raw-material, WIP and FG masses and inherited physical-exchange/burden vectors; old-cohort original accepted net mass; mill/provider"
      collection_method: "Calibrated bundle weighing excluding film; thickness measurements and first purchaser-quality acceptance; moisture samples at four or five sheet positions, promptly weighed and dried to constant mass. Independently sum unique events for Q and reconcile Q=D_new+FG_new+L_new on the locked first-acceptance basis under acceptance_event_bridge. Trace each return to one final destination and retain both actual wet/dry quantities and equivalent-basis quantities. Record failed rework and service against original Q0; never count reacceptance or purchased/opening FG as new production. Trace consumed raw/WIP and inherited vectors to completed cohorts; retain untouched stock and old-cohort service separately. Never reset inherited vectors when a period changes."
      unit: "kg"
      frequency: "Every lot; reconcile the full production period"
      temporal_coverage: "One common declared production period"
      site_scope: "Actual mill and declared route only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original event records, complete destination bridge, moisture/genealogy evidence, failed-activity records and missing-data disclosure"
    - protocol_id: cp_wood
      process_id: "veneer_mill"
      flow_role: "conifer_logs"
      record_type: "measurement"
      raw_fields: "log supplier; botanical species; origin; incoming mass; bark; incoming/green veneer moisture; green transfer; stock change"
      collection_method: "Weigh incoming loads and independent branch transfers; retain chain-of-custody and representative moisture specimens by species and operation."
      unit: "kg"
      frequency: "Each receipt and branch lot"
      temporal_coverage: "One common declared production period"
      site_scope: "Actual mill and declared route only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw records, reconciliation and missing-data disclosure"
    - protocol_id: cp_utilities
      process_id: "veneer_mill"
      flow_role: "electricity; steam_heat; makeup_water"
      record_type: "measurement"
      raw_fields: "meter id; stage; kWh; water kg; steam kg; inlet/return pressure temperature dryness and enthalpy; condensate return kg; losses; supplier boundary; calibration"
      collection_method: "Submeter conditioning, peeling and every drying/redrying pass; reconcile invoices and stock. Retain a full physical steam/condensate ledger and a single supplier net-heat account."
      unit: "MJ; kg"
      frequency: "Continuous meters; reconcile each reporting period"
      temporal_coverage: "One common declared production period"
      site_scope: "Actual mill and declared route only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw records, reconciliation and missing-data disclosure"
    - protocol_id: cp_consumables
      process_id: "veneer_mill"
      flow_role: "lubricating_oil; packaging_film"
      record_type: "measurement"
      raw_fields: "material identity; fresh issue kg; returns; stock changes; packaging retained; loss; supplier"
      collection_method: "Reconcile purchases, issue and stock with actual consumption; weigh actual packaging components independently."
      unit: "kg"
      frequency: "Each issue and monthly balance"
      temporal_coverage: "One common declared production period"
      site_scope: "Actual mill and declared route only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw records, reconciliation and missing-data disclosure"
    - protocol_id: cp_residues
      process_id: "veneer_mill"
      flow_role: "bark_coproduct; peel_core; wood_clip_coproduct; bark_waste; bucking_sawdust; veneer_reject; spent_oil; collected_dust"
      record_type: "measurement"
      raw_fields: "stage; physical stream; wet kg; dry-basis moisture; sale/waste status; destination; buyer/receiver; price if relevant; stock changes"
      collection_method: "Weigh each separate stream at its actual separation point; sample moisture and retain sale or waste-transfer evidence; reconcile internal returns and separately identify post-acceptance destinations against cp_reference without double-counting the returned parcel."
      unit: "kg"
      frequency: "Every output lot, reconciled to the period"
      temporal_coverage: "One common declared production period"
      site_scope: "Actual mill and declared route only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw records, reconciliation and missing-data disclosure"
    - protocol_id: cp_releases
      process_id: "veneer_mill"
      flow_role: "conditioning_effluent; pm25; pmcoarse; pmover10; condensable_organic_aerosol; formaldehyde; methanol; alpha_pinene; water_vapour"
      record_type: "measurement"
      raw_fields: "outlet; operation; controls; measured concentration; exhaust flow; operating hours; size/phase; sampling/filter temperature; analyte; purge kg; wood water balance; nondetect limit"
      collection_method: "Measure representative normal and redrying operation after controls; combine source-specific concentration, flow and operating time. Retain uncertainty, nondetects and wood-water balance; add separate rows for every detected additional substance."
      unit: "kg"
      frequency: "Representative campaigns plus continuous activity logs"
      temporal_coverage: "One common declared production period"
      site_scope: "Actual mill and declared route only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw records, reconciliation and missing-data disclosure"
  calculation_rules:
    - id: cohort_accounting
      applies_to: "all inventory rows"
      rule: "Assemble each new first-accepted cohort vector from inherited raw/WIP vectors actually completed plus measured additions through first acceptance and all actual attributable later services, loss treatment and failed rework, each once. Retain closing never-accepted WIP vectors and old accepted-FG vectors separately; rework of accepted material keeps its original cohort and unchanged Q0 rather than entering new-production WIP completion. Keep old-cohort service additions with original Q0, even with no successful rework output, never new Q. Q=0 retains unnormalized new-production vectors. Physical stock/exchange quantities, event denominators and allocated burdens remain separate."
      inputs:
        - cp_reference
        - "cohort and stock identities"
        - "inherited vectors"
        - "attributable measurements"
      output: "cumulative cohort vectors in original units"
      source_ids:
        - usda-wood-moisture-2021
    - id: acceptance_event_bridge
      applies_to: "all inventory rows"
      rule: "Q=sum of independently measured unique first-acceptance net wood masses at each parcel's original dry-basis u0. Reconcile Q=D_new+FG_new+L_new with disjoint and exhaustive net destinations: linked-return-adjusted dispatch, accepted closing FG, and every other actual post-acceptance destination (net retained return, loss, scrap, downgrade, use and closing rework/WIP). Convert destination quantities by m_eq,j=m_current,j/(1+u_j)*(1+u0_j), using measured moisture and parcel genealogy; track moisture-only changes separately from lost wood. Q=D_new+FG_new is conditional on demonstrated L_new=0. For 100 kg acceptance, 60 kg net dispatch, 30 kg FG and 10 kg loss, Q remains 100 kg. Reacceptance, opening FG and purchased finished sheets add no Q; failed rework retains its actual vectors and original Q0. Gross internal loops and Q are not extra external physical outputs. Unexplained residuals block complete reconciliation, never change Q."
      inputs:
        - cp_reference
        - cp_residues
        - cp_releases
        - "original event masses/moistures"
        - "parcel destinations"
      output: "locked Q and complete same-basis event/destination reconciliation"
      source_ids: []
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For Q>0, divide each cumulative physical exchange vector of the new first-accepted cohort, assembled under cohort_accounting, by its first-accepted net mass Q in kg. Accepted output equals Q/Q=1 kg per 1 kg reference flow. Preserve each numerator unit. Q=0 prohibits new-output normalization and retains the unnormalized physical-exchange and burden vectors; old-cohort service uses its original accepted net mass."
      inputs:
        - "cohort vectors"
        - Q
        - "original accepted net mass"
        - cp_reference
      output: "per 1 kg reference flow"
      source_ids:
        - usda-wood-moisture-2021
    - id: dry_mass_ledger
      applies_to: "conifer_logs; accepted_veneer; bark_coproduct; peel_core; wood_clip_coproduct; bark_waste; bucking_sawdust; veneer_reject"
      rule: "For each actual stream/stock independently: dry=wet/(1+u). For the whole mill boundary including FG storage, reconcile opening dry stocks + actual external dry inputs = closing dry stocks + actual external dry product/waste transfers + measured dry losses/releases not already in those transfers. Include all raw/WIP/FG stocks and external returns once; partition all external destinations without overlap; Q and internal acceptance/rework transfers are not extra external outputs or inputs. Thus accepted closing FG is not counted again as Q. Keep the acceptance-equivalent bridge and physical water ledger separate. Before allocating burdens, reconcile operations on their explicitly declared physical boundaries. Never invent a yield, treat unexplained residuals as measured loss, or scale measured outputs to force closure."
      inputs:
        - "wet kg"
        - "dry-basis u"
        - "actual stocks/external movements"
        - cp_wood
        - cp_residues
        - cp_reference
      output: "dry kg by operation and whole-mill physical balance"
      source_ids:
        - usda-wood-moisture-2021
        - corrim-western-plywood-2025
    - id: net_heat_ledger
      applies_to: "steam_heat"
      rule: "H_in=sum(m_in*h_in); H_return=sum(m_return*h_return). Use the common datum and actual supplier system boundary to calculate net heat, in MJ, including documented unreturned condensate treatment. When h is kJ/kg, divide the resulting kJ by 1000; compare with heat meters and invoice convention."
      inputs:
        - cp_utilities
        - "steam and return states"
        - "supplier convention"
      output: "net delivered MJ"
      source_ids:
        - epa-veneer-2002
    - id: release_period
      applies_to: "pm25; pmcoarse; pmover10; condensable_organic_aerosol; formaldehyde; methanol; alpha_pinene"
      rule: "Integrate each identified concentration with its compatible dry/wet exhaust-flow basis and actual hours; correct units and retain detection limits. Separate each outlet and phase; add only non-overlapping masses, attribute them to the correct cohort under cohort_accounting and divide by that cohort denominator only when positive."
      inputs:
        - cp_releases
        - concentration
        - flow
        - hours
      output: "kg per 1 kg reference flow"
      source_ids:
        - epa-veneer-2002
  data_quality_requirements:
    - id: species_state
      applies_to: "accepted_veneer"
      requirement: "Actual botanical species, grade, dimensions, moisture and unbonded state must be auditable; mixed-species lots retain composition and do not mask hardwood."
      evidence: "Supplier/species and acceptance records"
    - id: representativeness
      applies_to: "veneer_mill"
      requirement: "Use a declared complete operating period covering normal production, stoppages, seasonal moisture and redrying; disclose exclusions, sampled operations, uncertainty and temporal/geographic differences from sources. No literature value is a factory measurement."
      evidence: "Period reconciliation and missing-record register"
    - id: provider_matching
      applies_to: "all inventory rows"
      requirement: "Match each actual provider or treatment to flow type, mass/energy property, voltage, species/state, geography and delivered boundary. Unresolved native UUIDs remain explicit identity gaps; neither blank identity nor generic identity authorizes an incompatible provider."
      evidence: "Native records and actual provider/treatment documentation"
    - id: emissions_completeness
      applies_to: "cp_releases"
      requirement: "Retain species-specific organic screening, phase/temperature conditions and coarse dust assessment. Total VOC is a quality cross-check, not an elementary exchange replacing individual compounds. Nondetect is bounded evidence, not an unqualified zero."
      evidence: "Test reports and outlet/phase register"
validation_rules:
  - rule_id: validate_scope
    applies_to: "accepted_veneer"
    rule: "Reject hardwood, sawn/sliced routes, thickness above 6 mm, adhesive/backing/preservation, missing botanical identity or missing required qualifiers. One generic Wood material UUID never establishes these facts or an eligible supplier."
    source_ids:
      - epa-veneer-2002
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Require Q>0 for new-output normalization, finite nonnegative physical quantities and the same first-acceptance cohort/denominator in both languages. Q=0 retains unnormalized physical-exchange and burden vectors without an invented normalized output. Reject gross bundle mass, percent/fraction confusion, unconverted volume, double-counted redrying and unsupported steam-heat conversion. Compare mass/energy balances against documented instrument uncertainty; this PCR supplies no invented tolerance."
    source_ids:
      - usda-wood-moisture-2021
      - epa-veneer-2002
  - rule_id: validate_cohort
    applies_to: "all inventory rows"
    rule: "Independently verify unique first-acceptance event Q and the complete Q=D_new+FG_new+L_new bridge under acceptance_event_bridge, including measured moisture conversions, linked net returns, loss/scrap/downgrade and closing rework/WIP; allow the two-term form only with proven L_new=0. Reject deriving Q from remaining saleable quantities, loss omitted to force closure, duplicated return destinations, or Q added to the whole-mill physical stock balance. Opening accepted FG, purchased finished sheets, retests and reacceptance add no Q. Audit raw/WIP/FG inherited vectors and all actual services/failed rework against lot provenance and original Q0; reject missing/reset vectors, deletion of failed-activity burdens, stock mass treated as new production, old-cohort service divided by new Q, and any per-kg new-output result when Q=0. Unresolved event or destination evidence remains incomplete."
    source_ids:
      - usda-wood-moisture-2021
  - rule_id: validate_allocation
    applies_to: "veneer_mill"
    rule: "Useful-output shares sum to one at each joint operation; retain measured dry masses, destinations and stock changes. Reject assigning drying/packing to a core sold upstream, output mass reduced by allocation, waste counted as a saleable coproduct, or simultaneous allocation and avoided-fuel credit."
    source_ids:
      - corrim-western-plywood-2025
      - usda-wood-moisture-2021
  - rule_id: validate_boundary_emissions
    applies_to: "veneer_mill"
    rule: "Check all actual utilities, individual packaging components, residues, wastewater destinations and non-overlapping air species/phases. Missing evidence, identities or providers remain disclosed gaps. Changed onsite combustion/wet treatment requires expanded inventories; do not claim a complete cradle-to-gate result before all upstream links and treatment are verified."
    source_ids:
      - epa-veneer-2002
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Qualified declared-species rotary veneer at its recorded gate; downstream plywood or other production may link this unbonded material input while modelling their own adhesives and subsequent operations."
  excluded_use: "Universal conifer veneer average; hardwood/sliced/sawn or bonded veneer; complete building service comparisons; automatic carbon-neutrality or avoided-energy claims."
  required_metadata: "All reference qualifiers; actual mill/provider; period; gates; species mix; physical operation and inherited stock/cohort ledgers; independently locked first-acceptance Q/Q0, disjoint D_new/FG_new/L_new destinations and original-basis moisture conversions; actual failed-rework/service vectors and physical stock balance; moisture method; utility boundaries; allocation shares; upstream and treatment links."
  required_quality_disclosure: "Collection and identity gaps; sampled outlets; detection limits and phase overlap; temporal/geographic applicability; allocation sensitivity; cut-offs; missing providers; no scientific or study approval inferred."
  update_trigger: "Species/state/thickness, sourcing, peeling route, heat provider, dryer/control technology, moisture acceptance, coproduct market or measurement basis changes."
data_sources:
  - id: "epa-veneer-2002"
    type: "official_guidance"
    reference: "US EPA, AP-42 §10.5 Plywood Manufacturing, January 2002, pp. 10.5-1–10.5-4 and Table 10.5-3 pp.10.5-10–10.5-11; https://www.epa.gov/sites/default/files/2020-10/documents/c10s05.pdf"
    used_for: "Log conditioning, rotary peeling/clipping, indirect steam drying/redrying, unbonded-sheet stopping point, source/phase-specific emissions and indirect-softwood organic species screening (including CAS identity, without table factors). Plywood resin/pressing and numeric temperature/moisture/emission defaults are not transferred."
  - id: "usda-wood-moisture-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory, Wood Handbook—Wood as an Engineering Material, FPL-GTR-282 (2021), Chapter 13, printed pp.13–1–13–2, PDF pp.323–324; https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Dry-basis moisture, representative veneer sampling, prompt weighing, oven-drying and method limitations; dry-mass conversion, without prescribing output moisture or density."
  - id: "corrim-western-plywood-2025"
    type: "literature"
    reference: "CORRIM, Life Cycle Assessment of Softwood Plywood Production – Western Region, edited 22 July 2025, §§3.2.1 and 3.2.6, PDF pp.12–13,16; https://corrim.org/wp-content/uploads/2025/07/LCA-Report-Western-Plywood-Report-Final-07222025.pdf"
    used_for: "Physical allocation precedent, separately assigned packaging and upstream boundary. Regional integrated plywood inventories and averages are not veneer values; the staged dry-mass treatment is the explicit synthesis stated in this PCR."
