measurement_rules:
  - id: net_output
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Independently measure Q as the sum of unique production-lot first-acceptance net wood masses during the selected period, each locked to its measured dry-basis moisture u0 at the declared dispatch-ready acceptance state, excluding packaging. Reconcile Q=D_new+FG_new+L_new under acceptance_event_bridge on that same first-acceptance basis; the terms are mutually exclusive and exhaustive. Only when all other post-acceptance dispositions are demonstrably absent (L_new=0) may Q=D_new+FG_new be used. Opening accepted FG, purchased finished sheets, returns, retests and reacceptance never add Q; rejects before first acceptance do not enter Q, and later loss or rejection never subtracts Q. Collect with cp_reference. Every inventory row is per 1 kg reference flow."
  - id: moisture_conversion
    applies_to: "wood material and residues"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use dry-basis moisture fraction u=(wet mass-dry mass)/dry mass; dry mass=wet mass/(1+u). Retain sampled wet and ovendry masses. For veneer sample four or five positions per sheet, weigh promptly and oven-dry to constant mass at 101–105 °C; report volatile-extractive bias. Do not apply lumber sample dimensions to thin sheets. [usda-wood-moisture-2021]"
  - id: electricity_conversion
    applies_to: "electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert metered kWh to MJ with 1 kWh=3.6 MJ, preserving actual delivery voltage and geography; sum all drying passes once."
  - id: steam_enthalpy
    applies_to: "steam_heat"
    required_property_ref:
      name: "Transferred heat"
      uuid: ""
    required_unit: "MJ"
    rule: "Record steam kg, pressure, temperature, dryness and inlet enthalpy; every return/loss stream kg and enthalpy; derive net supplier heat as incoming enthalpy minus enthalpy leaving the supplier-system return boundary on a documented common datum. Declare treatment of unreturned condensate. Do not convert steam kg to MJ by a generic constant."
