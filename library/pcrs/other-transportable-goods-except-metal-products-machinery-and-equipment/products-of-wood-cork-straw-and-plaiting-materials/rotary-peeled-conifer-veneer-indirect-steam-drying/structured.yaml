system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "veneer_mill"
      rule: "Include log yard losses, debarking, bucking, steam conditioning, peeling/clipping, every drying/redrying pass, cooling/grading, dry collection and packaging. Retain separate operation records so an integrated plywood mill stops this output before gluing or composing."
