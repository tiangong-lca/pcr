measurement_rules:
  - id: first_release_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "D is the sum of unique first-acceptance event net masses during the stated period/configuration, locked at each completed bare body's actual acceptance moisture. Newly accepted closing FG and all later dispositions remain part of D. Exclude packaging, opening accepted stock, returns and repeat acceptance from new D. Calibrated net weighing and immutable body/cohort-event links establish D; count and dimensions are cross-checks only. Reconcile all dispositions through acceptance_event_bridge without resetting D to dispatch or remaining stock."
  - id: wood_moisture
    applies_to: "wood and wood residues"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure dry-basis moisture u = (wet sample mass - oven-dry sample mass) / oven-dry sample mass. Dry wood mass = wet stream mass / (1 + u). Sample each distinct stream/state; do not treat wet mass loss as dry-wood yield [usda-wood-handbook-2021]."
