allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "First subdivide actual operations and use direct material/energy records. The central cutout can be a usable co-product, an internal template/blank, or waste; buyer acceptance, actual specification, legal status and disposition establish its role, not positive sale value alone. Keep its full physical mass regardless of the burden share. Internal reuse is not an external coproduct or a second purchase."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "For an unavoidable joint operation, identify which outputs actually share each exchange. Attribute stock-preparation burdens using a demonstrated physical relationship on a consistent dry-wood or other justified basis; attribute frame-only rabbet/profile machining, acceptance, packaging and associated emissions to the frame. Frame dust or reject mass is not a market-output denominator. A regional lumber study's mass allocation and finished-product packaging treatment are a case, not a universal frame allocation factor [corrim-northern-lumber-2025]. If no physical relationship is defensible, explain why before applying same-period, same-gate economic allocation to the remaining shared burdens using actual quantities and prices, with sensitivity and price coverage disclosed. Missing causes/prices remain unresolved. Never apply one revenue/mass share to every process exchange, reduce physical outgoing quantities by burden shares, or award unspecified recycling/avoided-product credits."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "body_machining"
      flow_role: "frame_body and denominator D"
      record_type: "primary measured records"
      raw_fields: "SKU; species; dimensions; immutable body/cohort ID; first acceptance event/time, net kg and moisture; original D0 for older cohorts; gate-side raw/WIP/templates/residue stocks and separate accepted FG stocks; linked gross dispatch/returns; every loss, downgrade, waste and WIP re-entry/re-exit with mass/moisture/time/destination; inherited per-exchange vectors"
      collection_method: "Calibrated net weighing at the completed bare-body first acceptance; lock D by unique events. Reconcile complete mutually exclusive net destinations on the original acceptance basis through acceptance_event_bridge, including post-acceptance loss and closing WIP. Record every actual physical re-entry/re-exit at current mass for dry_wood_closure; reacceptance never adds D. Keep older FG/return services under original D0, with unknown history unresolved. Exclude packaging."
      unit: "kg"
      frequency: "each event, movement and period close"
      temporal_coverage: "declared production period plus inherited cohort history, including failed/idle intervals"
      site_scope: "actual plant and one configuration; production gate separate from post-gate custody/services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration, acceptance drawing, cohort/event and complete destination/gate reconciliation"
    - protocol_id: cp_material
      process_id: "body_machining"
      flow_role: "slab, sandpaper, reusable_cutout"
      record_type: "primary measured records"
      raw_fields: "row_id; supplier; actual SKU/species/grade; original unit; external receipt/consumption/return; current mass/moisture by stream; gate-side opening/closing raw/WIP/template/residue stocks; linked internal transfer and accepted-origin re-entry/re-exit; template life; cutout buyer specification and full mass; inherited cohort vector"
      collection_method: "Weigh separate wood and whole abrasive streams; sample actual dry-basis moisture at every distinct state. Distinguish production-gate stocks from post-gate accepted FG, actual external receipts from internal transfers, and internal templates from accepted non-waste cutout sales. Pair both sides of rework crossings; no second wood purchase or first-acceptance event. Record tool/template consumption or outsourced service once."
      unit: "kg"
      frequency: "each lot and stock/gate movement"
      temporal_coverage: "same production period plus inherited cohort history"
      site_scope: "actual stage, gate side, material and configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier specification, sample method, stock/crossing/cohort and buyer evidence"
    - protocol_id: cp_energy
      process_id: "body_machining"
      flow_role: "electricity"
      record_type: "primary metered records"
      raw_fields: "stage; meter readings; raw kWh or power/time; voltage; machine operating/idle/test hours; extraction/compressor; shared circuit and causal subdivision; provider/year"
      collection_method: "Submeter each stage where available; integrate compatible power-time records once only when needed. Reconcile stage totals and unassigned idle/cleanup with site bill; record actual causal allocation rather than nameplate load. Convert kWh to MJ once."
      unit: "MJ"
      frequency: "each meter interval and period close"
      temporal_coverage: "same production period including failed work"
      site_scope: "actual plant electrical boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, load-time measurements, bill and allocation evidence"
    - protocol_id: cp_packaging
      process_id: "body_machining"
      flow_role: "carton"
      record_type: "primary measured records"
      raw_fields: "whole carton SKU/furnish; mass; first receipt; ownership; purchased/loaned status; cohort; opening/closing raw/WIP/finished packaging stocks; return history; provider; gross dispatch"
      collection_method: "Weigh actual whole cartons and confirm actual furnish compatibility. Separate first external receipts, prior outward returns, internal reuse and actual waste. Absence of separate invoice does not prove nonpurchase; a purchased whole package includes its components once. Preserve each transport leg."
      unit: "kg"
      frequency: "each receipt, packing and return event"
      temporal_coverage: "same period plus inherited cohort history"
      site_scope: "actual packing operation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "carton specification, ownership/receipt history and stock/provider reconciliation"
    - protocol_id: cp_waste
      process_id: "body_machining"
      flow_role: "each segregated waste"
      record_type: "primary measured records"
      raw_fields: "row_id; origin stage, gate side and original cohort; wet mass; moisture/contamination; stock; waste status; actual receiver; transport; treatment boundary"
      collection_method: "Weigh each stream independently and reconcile gate-side stocks. Separate pre-gate waste, accepted-origin rework waste inside the gate, and post-gate FG loss/waste outside it; each actual waste enters one physical balance only. Preserve its original cohort attribution. Keep cutting rejects, collected dust, abrasive with adhered dust, and carton waste separate; no source-comment percentage or assumed treatment credit."
      unit: "kg"
      frequency: "each movement and period close"
      temporal_coverage: "same production period"
      site_scope: "actual stage and receiver gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale, analytical basis, manifests and receiver acceptance"
    - protocol_id: cp_emission
      process_id: "body_machining"
      flow_role: "each outdoor PM bin and water vapour"
      record_type: "primary measured records"
      raw_fields: "row_id; stack/fugitive point; concentration; gas-flow/time/dry-wet/standard basis; PM size cuts/filterable scope; control/capture; gate-side wood-water stocks; current moisture of every gate crossing; original cohort; actual outdoor compartment"
      collection_method: "Use matched outdoor emission tests or a documented site mass balance with uncertainty. Distinguish collected residues, indoor air and outdoor releases. Do not infer PM fractions or wood-water evaporation from unpaired samples. Add any actual non-PM species separately."
      unit: "kg"
      frequency: "each test and represented operating interval"
      temporal_coverage: "same period with sampling coverage disclosed"
      site_scope: "actual release point and configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "test method, detection limits, flow-time integration and water balance"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows except frame_body"
      rule: "Inventory amount = actual cohort-attributable exchange quantity / its event-locked D (original D0 for an earlier accepted cohort). Keep original numerator units; determine causal shares and inherited raw/WIP vectors before dividing once. Include all applicable post-acceptance services and failed/rework activity of that cohort; never shift old FG/return services to new D. D=0 or unknown D0 preserves an unnormalized ledger and blocks the affected normalized result. Physical gate crossings, external dispatch and full waste quantities remain separate from attributed numerators and the 1 kg reference coordinate."
      inputs:
        - "cohort-attributable exchange quantities"
        - "D/D0"
        - cp_release
        - "inherited vectors"
      output: "amount per 1 kg reference flow"
      source_ids: []
    - id: dry_wood_closure
      applies_to: "slab, frame_body, reusable_cutout, wood_offcut, sawdust and wood in abrasive_waste"
      rule: "For each actual stock/stream/crossing dry mass = current wet mass / (1 + sampled u). Production-gate balance: opening inside-gate dry stock + actual external dry-wood receipts + accepted-side dry-wood re-entries = closing inside-gate dry stock + actual gross body gate exits + external cutout dry wood + actual external raw-wood returns + actual external dry-wood waste transfers/releases from inside the gate. Residues retained inside remain closing stock, never a simultaneous waste output. Inside-gate stock includes raw/WIP/templates/residues and physically returned accepted-origin WIP, but excludes accepted FG outside the gate. Gross body exits include unique first exits and every actual repeat exit; use the paired physical re-entry once on the input side, never a second purchase or new D. Do not add dispatch, post-gate FG or post-gate losses to this gate balance. Retain a separate whole-site stock/dispatch check, where acceptance/rework transfers cancel and first acceptance is not an external output. Include adhered wood dust only in the abrasive-waste wood subledger; exclude paper, grit and water from dry wood. Investigate residuals using actual uncertainty, never an invented tolerance."
      inputs:
        - "actual stream/crossing/stock weights"
        - "sampled u"
        - cp_material
        - cp_release
        - cp_waste
        - cp_emission
      output: "dry-wood physical gate closure separate from acceptance-event ledger"
      source_ids:
        - usda-wood-handbook-2021
    - id: acceptance_event_bridge
      applies_to: "first-accepted body cohort"
      rule: "D = sum of unique first-acceptance net kg, locked at the measured acceptance basis. Cross-check D = Dispatch_new + FG_new + Other_new: Dispatch_new is net external dispatch after linked returns, FG_new is closing accepted FG, and Other_new covers every mutually exclusive remaining net disposition, including actual loss, scrap, downgrade/use, transfer out of product scope and closing returned/rework WIP. These are destinations of the newly accepted cohort only (zero opening accepted stock), expressed on its original acceptance mass basis with measured moisture/composition conversion; not raw current wet masses when the basis changed. A returned body is removed from net dispatch and counted once in its actual final FG/WIP/other destination; gross loops/reacceptance are not extra destinations. A 100 kg first acceptance with 60 kg net dispatch, 30 kg FG and 10 kg loss retains D=100 kg. The two-term dispatch-plus-FG shortcut is allowed only with evidenced zero other dispositions. Never infer zero loss, reset D or invent a residual to close the bridge. When surviving wood destinations are converted to their original acceptance moisture basis, moisture-only changes stay in the separate physical water ledger and are not also counted as whole-body loss in Other_new."
      inputs:
        - cp_release
        - cp_material
        - cp_waste
        - "measured basis conversions"
      output: "locked D and complete net destination reconciliation"
      source_ids: []
    - id: stocks_and_services
      applies_to: "raw/WIP and accepted cohorts"
      rule: "Keep opening accepted FG and earlier accepted returns under their immutable original cohort and D0; they cannot contribute to new D. Transfer inherited own-foreground per-exchange vectors with raw/WIP once, add current incremental operations once, and avoid adding supplier burdens already represented by the linked provider. Actual return, storage, packing, retest and rework services and their losses remain attached to that original accepted cohort, including when it re-enters the gate and is accepted again. Re-entry/re-exit is physical movement only, not new procurement, first acceptance or repetition of the original burden. Retain full physical streams separately from allocated vectors; unknown D0/history remains an unnormalized unresolved correction."
      inputs:
        - cp_release
        - cp_material
        - cp_energy
        - cp_packaging
        - cp_waste
      output: "cohort vectors, stocks and service corrections"
      source_ids: []
    - id: pm_partition
      applies_to: "pm_fine, pm_mid, pm_coarse"
      rule: "On the same measured source/time/filterable definition: fine = PM2.5; middle = PM10 - PM2.5; coarse = total PM - PM10. Require total PM >= PM10 >= PM2.5 >= 0; unmatched cut points or missing measurements block bin inference. Do not sum nested PM totals as separate releases."
      inputs:
        - "matched outdoor PM measurements"
        - cp_emission
      output: "nonoverlapping released PM mass"
      source_ids: []
    - id: water_closure
      applies_to: "water_vapour"
      rule: "On the same production-gate boundary as dry_wood_closure, reconcile water in opening inside-gate stocks + actual external receipts + actual accepted-side re-entries against closing inside-gate stocks + every actual gross body exit + external cutouts + external raw-wood returns + actual external waste transfers and outdoor water releases; retained residues remain closing stock only. Use measured current moisture for each physical crossing; accepted FG/dispatch outside the gate and first-acceptance event totals are not extra terms. Post-gate water changes require their own matched custody/service balance and original cohort attribution. Resolve actual air exchange/uptake and uncertainty; moisture decrease alone cannot establish an outdoor emission. Contained water is not an extra purchased input."
      inputs:
        - "actual wet/dry crossing weights and gate-side stock changes"
        - cp_material
        - cp_release
        - cp_waste
        - cp_emission
      output: "separately justified outdoor water release"
      source_ids:
        - usda-wood-handbook-2021
  data_quality_requirements:
    - id: body_integrity
      applies_to: "frame_body"
      requirement: "Verify one-piece construction and all-wood composition; retain machining drawing, species, moisture and acceptance. Any glue, oil, wax, glazing, metal or electronics fails this scope even if wood dominates total mass."
      evidence: "physical inspection, drawings and supplier declaration"
    - id: provider_gate
      applies_to: "every exchange"
      requirement: "Full native identity and actual whole supplied product must match property/unit, state and provider gate. Do not attach a generic lumber provider to the machined frame output or buy embedded abrasive/fibre constituents twice."
      evidence: "direct identity plus actual supplier route and quantity evidence"
    - id: represented_period
      applies_to: "all inventory rows"
      requirement: "Same configuration and time coverage; include failed, startup, idle, cleanup, seasonal and outsourced stages. Missing data and unknown conditions remain disclosed; zero requires evidence of absence."
      evidence: "meters, production and site-walk records"
    - id: carbon_stock
      applies_to: "wood material"
      requirement: "Retain dry wood and measured/source-qualified carbon fraction, stock and eventual destination separately from fossil consumables. No default carbon fraction, permanent storage credit or zero upstream biogenic release."
      evidence: "moisture, assay or qualified source and upstream coverage"
    - id: packaging_closure
      applies_to: "carton"
      requirement: "Reconcile each cohort's opening stock + first external receipt + evidenced returns with closing stock + gross outgoing dispatch/return + actual waste. Preserve the provider and inherited burden vector; unknown ownership/history is a gap, never a zero receipt."
      evidence: "whole-object receipt, ownership and gross-movement ledger"
validation_rules:
  - rule_id: scope_gate
    applies_to: "product and route"
    rule: "Require completed closed one-piece bare solid-coniferous frame with opening/rabbet and no retained nonwood material or finish. Uncut stock, continuous moulding and complete glazed frames are outside scope."
    source_ids:
      - superbender-single-piece-frame-2013
      - ambiance-unfinished-frame
  - rule_id: reference_gate
    applies_to: "frame_body"
    rule: "Exactly one explicit reference product output uses 1 kg with required form/state/provider qualifiers. Shared generic wood UUIDs do not replace row linkage or permit a supplier self-loop."
    source_ids: []
  - rule_id: measurement_gate
    applies_to: "all inventory rows"
    rule: "Check per-1-kg basis, linked protocols, finite positive event-locked D, complete acceptance_event_bridge and one normalization. Opening FG, returns and repeat gate exits must not increase new D; later losses must not shrink D. D=0/unknown D0 preserves physical/burden ledgers and blocks the affected normalized result; no count, dispatch, residual FG or wood-intake denominator substitution."
    source_ids: []
  - rule_id: balances_gate
    applies_to: "wood, dust, moisture, stocks"
    rule: "Separate physical V, allocated A and event-locked D. Verify dry_wood_closure gate-side stocks excluding post-gate accepted FG, paired actual re-entries/re-exits, full waste quantities and cohort vectors. Verify post-gate net destinations separately, and whole-site closure with internal gate transfers cancelled. Adding accepted FG plus first acceptance to one gate-output balance, omitting re-entry, counting reacceptance as new D, or double counting adhered dust, nested PM or whole packaging/components fails the model."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: identity_gate
    applies_to: "every row"
    rule: "Exact official Chinese display, actual atomic physical state, property/unit, supplier/receiver compatibility and source restrictions are mandatory. UUID compliance metadata does not confer method or study approval."
    source_ids: []
  - rule_id: uncertainty_gate
    applies_to: "allocation and closure"
    rule: "Missing causal shares, composition, source compatibility, capture, stock history or measured uncertainty remains pending review; no invented residual correction or fixed yield."
    source_ids:
      - corrim-northern-lumber-2025
published_dataset_profile:
  dataset_role: "secondary_dataset after complete foreground collection and independent study qualification"
