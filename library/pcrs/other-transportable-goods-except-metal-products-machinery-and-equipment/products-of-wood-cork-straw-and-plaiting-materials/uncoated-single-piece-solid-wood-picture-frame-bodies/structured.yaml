    required_unit: "MJ"
    rule: "Convert meter kWh once using 1 kWh = 3.6 MJ; preserve delivered electricity and below-1-kV supply boundary. Do not reinterpret this property label as a fuel or useful heat input."
  - id: configuration_strata
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Measured original property"
      uuid: ""
    required_unit: "declared row unit"
    rule: "Keep different species, opening geometry, rabbet, thickness, route and moisture states separately traceable. Volume conversion requires measured same-state density; no generic softwood density."
