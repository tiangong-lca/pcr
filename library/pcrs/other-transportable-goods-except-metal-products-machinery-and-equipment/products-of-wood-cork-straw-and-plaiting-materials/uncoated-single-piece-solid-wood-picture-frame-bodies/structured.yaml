system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The dry-wood physical production boundary ends at the completed body's quality-acceptance gate. Its opening/closing stocks contain only material physically inside that gate: raw wood, WIP (including accepted-origin rework returned inside), internal templates and residue stocks; accepted FG outside the gate is excluded. Record every actual accepted-to-WIP re-entry and subsequent gate exit at its then-current mass/moisture, even when an old cohort returns. First acceptance is an event subset of gate exits, not an additional output alongside them. FG storage, dispatch, returns and packing after that gate are separate custody/service ledgers of the original cohort. Include blank preparation, test cuts, drilling, central cutout, routing, sanding, dust collection, extraction/compressor electricity where present, acceptance/rework, cleanup and actual packing services within the foreground inventory scope; the dry-wood gate ledger and the service scope are explicitly distinguished. Outsourced machining must be represented once at its actual service gate. Include its energy/material/waste inventory or the corresponding complete service provider, never both. Wood-carbon stock is not an automatic negative emission. No onsite kiln, steam, fuel combustion or chemical finishing is included in this supported dry electric-machining route. Their actual use fails route applicability and requires method extension."
