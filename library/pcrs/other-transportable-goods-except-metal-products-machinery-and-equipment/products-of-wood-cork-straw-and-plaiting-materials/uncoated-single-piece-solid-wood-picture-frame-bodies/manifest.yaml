  scope_decision: "Independent narrower product: completed uncoated unglazed one-piece solid-coniferous-wood frame body with opening and rabbet, not a continuous profile or a complete glazed assembly. Other articles and routes in CPC31914 are excluded; mapping acceptance belongs to independent integration."
  source_limitations: "Maker case supports one-piece slab machining and separates later oil/electronics/hardware, not factory consumption, safety settings or commercial yield. Commercial unfinished open-back pine frames establish the legitimate product gate, not their one-piece construction. USDA moisture formula is transferable; its species ranges are not. CORRIM allocation is counterevidence to unexamined universal mass allocation."
  qualified_reference_identity: "Wood material is a broad mass-based product flow whose full native record leaves species/form/treatment/moisture/route/provider unspecified. Here the entire net accepted uncoated single-piece body is wood, with no glue, coating, glass, backing or hardware. Exact frame form, coniferous species, moisture, completed machining gate and provider are mandatory exchange qualifiers. Same generic UUID on slab input never authorizes self-linking to the frame output. A provider must cover the supplied slab or supplied frame at its actual gate, once."
  source_metadata_debts:
    - row_id: "electricity"
      issue: "Native record is CN customer-side below-1-kV supply. Actual site/year/provider/voltage and delivered-energy boundary must match before background linkage; no universal grid mix."
    - row_id: "sandpaper"
      issue: "Native furniture-plant CN context does not establish actual sanding grade, backing, binder, supplier or geography. Confirm the whole abrasive sheet supplied once."
    - row_id: "carton"
      issue: "Native carton specifies 16.6% primary and 83.4% recycled fibre. Conditional locator only if actual furnish/grade/provider matches; otherwise resolve another specific carton identity. No recipe or amount adopted."
    - row_id: "wood_offcut"
      issue: "Use a separately weighed unagglomerated solid-wood cutting reject under broad Waste solid. Reject the historical Offcut UUID whose CPC39282 implies agglomerated scrap. Actual receiver must accept the qualified stream."
    - row_id: "abrasive_waste"
      issue: "Broad Waste solid qualifies one spent paper-backed abrasive with adhered wood dust; actual receiver/phase/contamination must match, no blasting-residue substitution."
  quantity_and_provider_gaps: "Future dataset production must collect actual quantities, scales/moisture, causal subdivisions, failed/rework/stock vectors, all external consumables and actual transport, waste receivers and upstream providers. Identity availability is not background matching, study qualification or methodology approval."
