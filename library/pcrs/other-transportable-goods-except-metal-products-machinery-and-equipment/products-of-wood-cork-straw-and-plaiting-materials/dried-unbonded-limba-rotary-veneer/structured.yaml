measurement_rules:
  - id: delivered_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reference quantity is 1 kg net wood at unique first final manufacturing acceptance after the declared drying, grading and final trim. Independently sum those event masses into Q_new, locking each measured event net mass and dry-basis moisture u0 to parcel genealogy and its original cohort denominator Q0. Check Q_new=D_new+FG_new+L_new under acceptance_event_bridge using disjoint exhaustive destinations on that same basis. The two-term form applies only with evidence that L_new=0. Packaging and pre-acceptance rejects are excluded; later loss/scrap/downgrade does not reduce Q0. Opening accepted FG, purchased finished sheets, returns, retests and reacceptance add no new event quantity. Inherited never-accepted raw/WIP vectors follow eventual first acceptance; later services and failed rework retain original Q0. Q_new=0 or an unavailable original denominator stays unnormalized/unresolved; use cp_lot and cp_moisture."
  - id: moisture_basis
    applies_to: "wood inputs, veneer and solid residues"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record moisture separately for each stream/lot. Dry-basis moisture u=(wet mass−oven-dry mass)/oven-dry mass; dry wood mass=wet mass/(1+u). Percent dry basis is divided by 100 before using u. A wet-basis result is not interchangeable. Retain paired sample masses and constant-mass evidence under cp_moisture (usda-wood-moisture-2021)."
  - id: dimensional_conversion
    applies_to: "sheet area or volume records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Area, thickness or volume is supplementary. Conversion to reference mass requires a measured density for the same species, moisture, temperature and sheet state, or direct weighing of that lot. No handbook density converts green log volume to delivered dry veneer mass."
  - id: utility_basis
    applies_to: "electricity and steam heat"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert metered electricity from kWh using 3.6 MJ/kWh. Steam heat is net heat actually delivered at the stated inlet/condensate-return boundary, measured from compatible steam/return masses and enthalpies. Steam mass alone and gross calorific value do not identify this net heat amount. Preserve supplier reference-state compatibility."
