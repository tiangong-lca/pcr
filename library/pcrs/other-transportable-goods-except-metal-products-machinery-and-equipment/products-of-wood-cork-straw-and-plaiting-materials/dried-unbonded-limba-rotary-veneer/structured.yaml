  - rule_id: allocation_separate
    applies_to: "foreground_burden_allocation"
    rule: "First subdivide metered stages and directly assign burdens to their actual operation/lot. Drying and repeats follow the wood actually dried; packaging follows the actual packed product. Earlier green residues do not receive later drying burdens."
    source_ids:
      - corrim-allocation-2025
      - epa-veneer-2002
  - rule_id: allocation_mass
    applies_to: "foreground_burden_allocation"
    rule: "For remaining inseparable common burdens at a documented separation node, apply measured oven-dry mass shares among the continuing wood stream (accepted veneer only at the final node) and genuine saleable wood co-products leaving that node. Record all candidate products, moisture, stock and the numerator/denominator; disclose this as a chosen physical allocation rule and test an economic-share sensitivity when values materially differ. CORRIM is method precedent from softwood plywood, not evidence that limba has the same shares."
    source_ids:
      - corrim-allocation-2025
      - usda-wood-moisture-2021
  - rule_id: allocation_waste
    applies_to: "foreground_burden_allocation"
    rule: "Document product versus waste status by actual contracts and destinations. Waste is not an allocation co-product merely because it is recovered or burned elsewhere. Include the responsibility for treatment; no assumed avoided-fuel credit. Retain sold/waste quantities as disjoint flows."
    source_ids:
      - corrim-allocation-2025
  - rule_id: allocation_ledgers
    applies_to: "foreground_burden_allocation"
    rule: "Preserve the complete pre-allocation physical wood, water, residue and emission ledger. Allocate burdens in a separate linked ledger; never multiply physical output mass by an allocation fraction to force a material balance. Internal rework and repeat drying have no co-product share."
    source_ids:
      - corrim-allocation-2025
      - fao-tropical-utilization
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot
      process_id: "log_prepare_dispatch"
      flow_role: "wood intake and reference output"
      record_type: "weighing and lot ledger"
      raw_fields: "immutable lot/parcel genealogy; unique first-acceptance id/date; original accepted net kg Q0 and dry-basis u0; independent event sum Q_new; gross dispatch and linked returns; disjoint D_new, FG_new and each L_new disposition; current mass/moisture and original-basis conversion; pre/post-acceptance rejects, biological/handling loss, scrap, downgrade, use and rework/WIP; actual failed activity/reacceptance; opening/closing raw/WIP/accepted-FG masses and inherited quantity/burden vectors; purchased finished-sheet movements; old FG dispatch; later services and original denominators; botanical species/provenance/treatment; received logs; thickness/grade; storage exposure"
      collection_method: "Use calibrated scales and remove tare/packaging at intake, first final acceptance and dispatch. Independently sum unique event masses for Q_new and reconcile Q_new=D_new+FG_new+L_new on original acceptance moisture under acceptance_event_bridge, separating opening accepted FG and purchased finished sheets. Trace returns to their final net destination once. Preserve inherited raw/never-accepted-WIP/FG vectors without duplicate burdens; accepted rework stays with original Q0. Measure actual later mass/moisture, loss and failed activity separately without resetting the denominator. Retain raw quantities when Q_new=0 or an original denominator is missing."
      unit: "kg; mm"
      frequency: "each lot and stock reconciliation"
      temporal_coverage: "declared reporting period including seasonal supply changes"
      site_scope: "one identified limba line and its storage areas"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale certificates; original event and complete destination records; lot/moisture genealogy; species/treatment evidence; actual failed-activity records"
    - protocol_id: cp_moisture
      process_id: "log_prepare_peel_dry_dispatch"
      flow_role: "wet and oven-dry wood basis"
      record_type: "paired test record"
      raw_fields: "sample location; lot; pass number; sheet position; wet sample mass; constant oven-dry mass; meter indication; target and measured exit moisture; original u0 and current u_j paired with parcel genealogy for acceptance-equivalent mass; rejected/redried mass; cohort id; original accepted net kg; new/old/unfinished-stock attribution"
      collection_method: "Immediately protect and weigh representative samples; oven-dry to constant mass using a documented wood method; validate species/thickness-adjusted rapid measurements against paired oven samples. Sample across sheet and lot, including wetter portions; assess volatile-extractive bias in oven mass loss and retain its uncertainty; do not prescribe a lumber oven schedule as a veneer dryer setting. Keep quantities assigned to their source cohort or unfinished-stock vector; never divide an old-cohort service by unrelated new output."
      unit: "kg; fraction dry basis"
      frequency: "intake; every dryer pass; first final acceptance; each later dispatch/retest; each residue stream"
      temporal_coverage: "same production period and all actual repeats"
      site_scope: "same species, thickness and equipment configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sample chain; constant-mass record; calibration; drying history; sampling uncertainty"
    - protocol_id: cp_electricity
      process_id: "log_prepare_condition_peel_dry_dispatch"
      flow_role: "user-side electricity"
      record_type: "stage meter"
      raw_fields: "stage; meter id; voltage; kWh start/end; pass and lot; downtime; shared-load attribution; cohort id; original accepted net kg; new/old/unfinished-stock attribution"
      collection_method: "Read calibrated stage meters and reconcile with site bills; record allocation of genuinely shared loads; count fan, circulation, cooling and electric handling use. Keep quantities assigned to their source cohort or unfinished-stock vector; never divide an old-cohort service by unrelated new output."
      unit: "kWh; MJ"
      frequency: "each batch/pass or continuous logger"
      temporal_coverage: "full declared production period, including repeat drying and downtime"
      site_scope: "identified line plus documented shared auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; supplier voltage/period; site reconciliation"
    - protocol_id: cp_steam
      process_id: "condition_dry"
      flow_role: "externally delivered steam heat"
      record_type: "heat and condensate balance"
      raw_fields: "meter boundary; steam/return mass; pressure; temperature; steam quality; inlet/return enthalpy; loss location; stage/pass; supplier quantity definition; cohort id; original accepted net kg; new/old/unfinished-stock attribution"
      collection_method: "Meter inlet steam and return at the declared boundary, or use a calibrated net heat meter, retaining both utility mass and energy evidence. Track pressure, temperature, enthalpy, steam quality, condensate return, utility stock and each real non-return/vent/leak. The coils are indirect: no steam is assigned as contact water. Identify any actual utility mass release with its own atomic exchange before claiming completeness; a coil leak into wood/bath requires route review. Split conditioning/initial/repeat heat and preserve source-cohort attribution."
      unit: "kg; MJ; pressure and temperature with units"
      frequency: "each batch/pass and utility period"
      temporal_coverage: "same period as accepted veneer; actual repeats retained"
      site_scope: "external supplier interface and respective coils"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter certificates; supplier definition; state/enthalpy trace; utility reconciliation"
    - protocol_id: cp_water
      process_id: "condition_dry"
      flow_role: "conditioning makeup, wastewater and evaporated water"
      record_type: "water balance"
      raw_fields: "fresh makeup; blowdown; moisture inputs/outputs; condensate; evaporation; stock; return destination; suspended/dissolved loads; cohort id; original accepted net kg; new/old/unfinished-stock attribution"
      collection_method: "Read process tap-water makeup/blowdown meters and sample wastewater; pair wood moisture with dry-wood balance to calculate wood/process-water evaporation. Keep the closed steam/condensate circuit in a separate mass/enthalpy ledger: neither inlet steam nor returned condensate enters the process-water account in this indirect route. Reconcile real utility losses separately with explicit atomic exchanges; missing loss measurements remain unresolved. Preserve each source-cohort or unfinished-stock vector."
      unit: "kg"
      frequency: "batch and period; moisture each pass"
      temporal_coverage: "same production and stock period"
      site_scope: "conditioning circuit and dryer"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter and sampling evidence; physical water reconciliation and residual"
    - protocol_id: cp_residues
      process_id: "log_prepare_peel_dispatch"
      flow_role: "solid residues, co-products and rejects"
      record_type: "destination ledger"
      raw_fields: "species; source stage; lot; green/dry state; wet mass; dry-basis moisture; stock; product/waste status; contract; treatment or purchaser; value; cohort id; original accepted net kg; new/old/unfinished-stock attribution"
      collection_method: "Weigh each separate stream; measure its own moisture; reconcile sale, waste transfer and stock. Link pre/post-acceptance loss, scrap, downgrade and rework destinations to cp_lot once. Record reject reason and actual separation node; no class-wide yield inference. Keep quantities assigned to their source cohort or unfinished-stock vector; never divide an old-cohort service by unrelated new output."
      unit: "kg; monetary unit identified"
      frequency: "each dispatch/container and batch reject"
      temporal_coverage: "full same period including storage damage"
      site_scope: "all residue collection points and named receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge slips; contracts; moisture tests; treatment receipts; stock and value records"
    - protocol_id: cp_auxiliaries
      process_id: "peel_dispatch"
      flow_role: "oil and packaging"
      record_type: "procurement/use/waste ledger"
      raw_fields: "exact oil chemistry; cardboard grade; strap material; quantities issued; returned; stock; spent oil; actual packaging consumption; cohort id; original accepted net kg; new/old/unfinished-stock attribution"
      collection_method: "Weigh supplies and waste; reconcile issue and stock records; confirm oil chemistry and actual packaging components with specification sheets; add any further atomic exchange actually used. Keep quantities assigned to their source cohort or unfinished-stock vector; never divide an old-cohort service by unrelated new output."
      unit: "kg"
      frequency: "each issue/change and period"
      temporal_coverage: "same period and equipment/packing configuration"
      site_scope: "scoped line and dispatch"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier sheets; weighing; stock; waste receipt; packaging record"
    - protocol_id: cp_air
      process_id: "log_prepare_peel_dry_dispatch"
      flow_role: "speciated organics and disjoint PM"
      record_type: "emission measurement"
      raw_fields: "stage and stack; lot/species; pass; substance; concentration; detection limit; gas flow; temperature; pressure; moisture; duration; capture; fugitive release; PM2.5/PM10/total and filterable/condensable method; cohort id; original accepted net kg; new/old/unfinished-stock attribution"
      collection_method: "Representative tests of actual limba operations; cover heated/cooling exhausts and fugitives, initial/repeat passes and actual controls. Match concentration and gas volume state. Quantify each detected substance; investigate additional compounds. No softwood default or total-VOC surrogate for individual substances. Keep quantities assigned to their source cohort or unfinished-stock vector; never divide an old-cohort service by unrelated new output."
      unit: "kg; concentration and gas-volume units explicit"
      frequency: "representative operating tests, continuous logs where available and after process changes"
      temporal_coverage: "full operating period represented, gaps stated"
      site_scope: "actual receiving air compartment at each scoped operation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "test method; blank/detection data; operating and control logs; uncertainty; unmeasured coverage"
  calculation_rules:
    - id: acceptance_event_bridge
      applies_to: "all inventory rows"
      rule: "Independently lock Q_new=sum(unique first-acceptance net wood masses). Cross-check Q_new=D_new+FG_new+L_new with disjoint exhaustive net destinations under the section 8 bridge; each parcel uses its measured original dry-basis u0. Convert current destination mass by m_eq,j=m_current,j/(1+u_j)*(1+u0_j); retain actual dry-wood and water ledgers separately. L_new includes all actual post-acceptance net returns outside FG, losses, scrap, downgrade, use and closing rework/WIP. Linked returns reduce gross dispatch and enter only their final destination; loops/reacceptance do not add Q. Use two terms only if L_new=0 is evidenced. At 100 kg acceptance, 60 kg net dispatch, 30 kg FG and 10 kg loss, Q_new=100 kg, not 90 kg. Failed rework and later services keep original Q0; Q is not an extra external physical export. Unresolved moisture/genealogy/destination evidence blocks complete reconciliation."
      inputs:
        - cp_lot
        - cp_moisture
        - cp_residues
        - "original event and destination records"
      output: "locked event Q_new and complete same-basis destination bridge"
      source_ids: []
    - id: period_intensity
      applies_to: "all inventory rows"
      rule: "Use independently measured unique-event Q_new, verified under acceptance_event_bridge, at original first-acceptance net kg. N_new combines inherited consumed raw/never-accepted-WIP vectors with all actual attributable production, later services, failed rework and treatment additions, each once; exclude untouched raw/never-accepted-WIP and old FG vectors. For Q_new>0, intensity=N_new/Q_new. Carry never-accepted unfinished vectors as stock. Previously accepted rework always keeps its original cohort Q0, never a new first acceptance. For an older cohort, service supplement=actual later activity vector/original Q0; append once even when rework has zero successful output. Do not use unrelated Q_new, current shipment, returned/retested kg, remaining saleable kg or reacceptance as denominator. Q_new=0 retains new/unfinished quantities without division; missing original Q0 leaves old services unnormalized/unresolved. Physical quantities, event denominators and allocated burdens remain separate."
      inputs:
        - cp_lot
        - "applicable quantity protocol"
      output: "quantity per 1 kg reference flow"
      source_ids: []
    - id: dry_wood_account
      applies_to: "all wood streams"
      rule: "For each separate stream, u=(wet mass−oven-dry mass)/oven-dry mass and dry wood=wet mass/(1+u). Reconcile physical received wood and all opening raw/WIP/FG against dispatch, closing raw/WIP/FG, distinct residues/rejects and measured losses; first acceptance is an internal classification, not an additional physical export. Include external returns once and keep all external destinations disjoint; internal rework transfers cancel. Separately reconcile unique-event Q_new, the complete acceptance_event_bridge and inherited cohort vectors so closing newly accepted FG or accepted rework is not counted twice. Preserve each residual and moisture-state change; never relabel unexplained imbalance as measured loss or adjust Q to close it."
      inputs:
        - cp_lot
        - cp_moisture
        - cp_residues
      output: "dry-wood ledger and balance residual"
      source_ids:
        - usda-wood-moisture-2021
    - id: steam_net
      applies_to: "conditioning_heat; drying_heat"
      rule: "Net heat equals inlet steam mass times compatible inlet enthalpy less returned condensate mass times compatible return enthalpy, adjusted only for losses within the declared delivery boundary. Reconcile conditioning, initial drying and repeat-pass shares to the supplier total. No gross-to-net conversion without the actual reference states."
      inputs:
        - cp_steam
      output: "delivered net MJ per 1 kg reference flow"
      source_ids:
        - epa-veneer-2002
    - id: repeat_account
      applies_to: "dry"
      rule: "Retain each actual dryer pass and its heat, electricity, measured moisture, rejected mass and accepted destination, including all failed attempts. Sum repeat consumption once; before first acceptance it follows the eventual cohort or never-accepted WIP, and after first acceptance it follows unchanged original Q0 even with zero successful rework output. Reacceptance never creates new Q; separately record final rejects and closing rework destinations under acceptance_event_bridge. Do not impute a second pass to every limba lot."
      inputs:
        - cp_moisture
        - cp_lot
        - cp_steam
        - cp_electricity
      output: "traceable repeat-pass consumption and output account"
      source_ids:
        - fao-tropical-utilization
        - epa-veneer-2002
    - id: air_load
      applies_to: "all air rows"
      rule: "Integrate compatible substance concentration times exhaust flow times duration, plus actual fugitives, for each operation and pass. Keep actual emissions before allocation, detection limits and control capture distinct; add extra verified substances separately. Missing evidence remains unmeasured."
      inputs:
        - cp_air
      output: "substance load per 1 kg reference flow"
      source_ids:
        - epa-veneer-2002
    - id: pm_disjoint
      applies_to: "all PM rows"
      rule: "For comparable cumulative test results, fine=PM2.5, middle=PM10−PM2.5 and coarse=total PM−PM10. Results must be nonnegative and share test state, filterable/condensable scope and sampling boundary. Unknown fractions remain unresolved; do not assign an invented split."
      inputs:
        - cp_air
      output: "three nonoverlapping size-bin loads"
      source_ids:
        - epa-veneer-2002
    - id: water_account
      applies_to: "dryer_water; conditioning_water; conditioning_wastewater"
      rule: "Keep two linked but distinct balances. Process water over the full mill including FG storage: water in actual received wood and external returns plus opening wood/water stocks and new tap-water makeup equals water in actual external wood/residue transfers, closing raw/WIP/FG and water stocks, process wastewater and evaporation, with the residual disclosed. Internal acceptance Q and rework are not additional physical water outputs; no accepted FG is counted both at acceptance and in closing stock. Utility circuit: inlet steam/condensate mass equals returned condensate plus documented utility stock change and each real separately identified loss/release; retain compatible inlet/return enthalpies for net heat. In the selected indirect conditioning/coils route, no utility steam mass enters process contact water or wood. Do not treat utility venting as wood evaporation or duplicate returned water. Any direct injection/contact or coil leak into the process needs route review and an explicit atomic mass input; it is not covered silently."
      inputs:
        - cp_water
        - cp_moisture
        - cp_residues
        - cp_steam
      output: "physical water balance and disclosed residual"
      source_ids:
        - usda-wood-moisture-2021
    - id: stage_allocation
      applies_to: "allocation ledger"
      rule: "At each actual separation node, the continuing wood stream receives the fraction of common burden equal to its measured oven-dry mass divided by the sum of the continuing wood and genuine exported co-product dry masses. Carry this burden forward and split it again only at the next actual node; at final separation the continuing stream becomes accepted veneer. Add only that stream’s dedicated later burdens. Preserve the complete physical ledger unchanged and disclose economic sensitivity."
      inputs:
        - cp_residues
        - "stage utility records"
        - cp_moisture
      output: "separate pre/post allocation burden account"
      source_ids:
        - corrim-allocation-2025
  data_quality_requirements:
    - id: dq_species
      applies_to: "scope and reference"
      requirement: "Trace species, country and plantation/natural-forest provenance; reject unidentified mixed-lot borrowing. Untreated status is verified separately from any end-use protection requirement."
      evidence: "supplier/lot documentation and treatment declaration"
    - id: dq_drying
      applies_to: "conditioning and drying"
      requirement: "Represent wetter sheet areas, batch variation, all repeat passes, rejects and storage damage; report sample variability. Do not transfer generic lumber schedules, species density or softwood emission values."
      evidence: "paired moisture samples; pass logs; customer acceptance; metering"
    - id: dq_identity
      applies_to: "each exchange"
      requirement: "Confirm physical/chemical identity, material state, flow type, compartment, property and unit. Blank UUIDs remain unresolved; selected flow identity does not select a compatible provider automatically."
      evidence: "direct identities, supplier specifications and background boundaries"
    - id: dq_complete
      applies_to: "complete line"
      requirement: "Reconcile dry wood/water/stock and stage meters; quantify separately actual additional lubricants, cleaning chemicals, packaging, wastes or emissions. Document uncertainty, detection limits, unmeasured scope and infrastructure exclusions."
      evidence: "physical balance residuals; complete flow register; independent scope review"
validation_rules:
  - rule_id: validate_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Exactly one reference output is limba_delivery, 1 kg net sheet mass, with the verified tropical product UUID and all required limba/route/moisture/thickness qualifiers. Species alone does not establish untreated state, supplier provenance or a compatible background."
    source_ids:
      - itto-limba
      - un-cpc-3
  - rule_id: validate_route
    applies_to: "foreground_dataset_conformance"
    rule: "Verify electric handling, external steam, closed indirect conditioning heat exchangers/dryer coils and unbonded first-acceptance gate. Check separate utility mass/enthalpy and process-water ledgers, actual utility losses and explicit atomic release coverage. Direct steam contact/injection, coil leakage into process water, combustion, treatment, composing, backing or alternate cutting route cannot pass by omission; require route review and the actual exchanges."
    source_ids:
      - epa-veneer-2002
      - usda-wood-moisture-2021
  - rule_id: validate_lot
    applies_to: "foreground_dataset_conformance"
    rule: "Independently verify unique event ids/masses for Q_new and the complete Q_new=D_new+FG_new+L_new bridge on original acceptance moisture under acceptance_event_bridge; two terms require proven L_new=0. Audit measured parcel conversions, mutually exclusive linked net returns, loss/scrap/downgrade/use and closing rework/WIP. Reject a denominator inferred from remaining saleable stock, omitted losses, duplicated destinations or Q added as an extra external physical export. Opening accepted FG, purchased finished sheets, returns, retests, reacceptance and repeat throughput add no new Q. Preserve inherited raw/never-accepted-WIP/FG quantity and burden vectors; accepted rework stays with original Q0. Every actual later service, including failed rework with no successful output, uses original Q0 once and retains its load. Q_new=0 or missing original denominators stays unnormalized/unresolved; missing event/moisture/destination evidence blocks complete reconciliation. Reference wood excludes packaging."
    source_ids:
      - fao-tropical-utilization
      - usda-wood-moisture-2021
  - rule_id: validate_physical
    applies_to: "foreground_dataset_conformance"
    rule: "Dry-wood/water residuals, allocation shares and dedicated downstream burdens must be traceable. No product/waste overlap, mass balance by allocation, duplicate steam supply fuel or overlapping PM bins. Do not add a VOC total to its individual constituents."
    source_ids:
      - corrim-allocation-2025
      - epa-veneer-2002
  - rule_id: validate_limits
    applies_to: "foreground_dataset_conformance"
    rule: "Unknown UUIDs, missing sample distributions, unmeasured emissions, incompatible net-steam references and omitted scope remain explicit gaps. No zero from missing records, no whole-site completeness from a method check, and no durability claim for untreated limba."
    source_ids:
      - itto-limba
      - epa-veneer-2002
published_dataset_profile:
  dataset_role: "Foreground log-to-dried-unbonded-limba-veneer intermediate production dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Subsequent veneering/plywood input with matching species, route, grade, first-acceptance moisture/mass and supplier definitions. State whether later storage/packing/dispatch services have actually been appended; a closing-FG first-acceptance dataset is not complete dispatch-gate coverage until then. Disclose review and gaps."
  excluded_use: "Other tropical species or generic tropical blend; sliced/sawn/green/bonded/treated product; on-site combustion route; complete panel or installed-service comparison; assumed durability or phytosanitary approval"
  required_metadata: "All reference qualifiers; supplier/forest and treatment provenance; original first-acceptance ids/masses/moisture; opening/closing raw/WIP/FG vectors and transfers; independently measured event Q_new/Q0, disjoint D_new/FG_new/L_new and measured original-basis conversions; net returns/retests, failed rework and old-cohort supplements; moisture/pass history; separate process-water/steam mass/enthalpy accounts; physical/allocation ledgers; actual dispatch-service coverage"
  required_quality_disclosure: "Sampling/meter uncertainty; storage losses and rejects; unnormalized Q_new=0 or missing-denominator quantities; inherited vectors and unfinished-stock coverage; pending later dispatch services; blank UUIDs, unmeasured scope, background compatibility, allocation sensitivity and independent review state"
  update_trigger: "Changed species/forest source, treatment status, cutting/drying/heat route, moisture or quality target, packaging, emission controls, allocation/destination, reference identity or new evidence"
data_sources:
  - id: "un-cpc-3"
    type: "official_guidance"
    reference: "UNSD, CPC Ver.3.0 structure, 30 June 2025, subclass 31512. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Tropical thin-sheet classification ≤6 mm; does not establish a species recipe or method approval"
  - id: "itto-limba"
    type: "official_guidance"
    reference: "ITTO Tropical Timber, Limba/Fraké (Terminalia superba), Scientific Name; Natural Distribution; Natural Durability; Drying Defects; Rotary Veneer Cutting. https://www.tropicaltimber.info/specie/limbafrake-terminalia-superba/"
    used_for: "Botanical identity, African distribution, peeling suitability and biological/drying limitations; no density, kiln schedule, treatment recipe or universal process factor adopted"
  - id: "fao-tropical-utilization"
    type: "official_guidance"
    reference: "FAO, Unasylva no.118, The utilization of low-quality tropical timber, Wood-based panels paragraphs discussing Terminalia moisture and repeated dryer passes. https://www.fao.org/4/l2015e/l2015e04.htm"
    used_for: "Qualitative counterevidence against uniform tropical drying and unrecorded repeats; not a compulsory limba schedule or measured limba repeat rate"
  - id: "epa-veneer-2002"
    type: "official_guidance"
    reference: "US EPA, AP-42 §10.5 Plywood Manufacturing, January 2002, pp.10.5-1 to 10.5-4 and Figure10.5-1. https://www.epa.gov/sites/default/files/2020-10/documents/c10s05.pdf"
    used_for: "Pre-bonding veneer processes, indirect steam coils, moisture sorting/redrying and actual emission measurement boundaries; no US plywood quantitative values transferred"
  - id: "usda-wood-moisture-2021"
    type: "handbook"
    reference: "USDA FPL, Wood handbook—wood as an engineering material, FPL-GTR-282, 2021, printed pp.10-3–10-4 and 13-1–13-2; PDF pp.255–256,323–324. https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Veneer cutting distinctions, oven-dry moisture denominator, sampling and constant-mass evidence; no lumber schedule adopted as veneer dryer setting"
  - id: "corrim-allocation-2025"
    type: "literature"
    reference: "CORRIM, Life Cycle Assessment of Softwood Plywood Production – Western Region, edited 22 July 2025, §3.2.6, PDF p.16. https://corrim.org/wp-content/uploads/2025/07/LCA-Report-Western-Plywood-Report-Final-07222025.pdf"
    used_for: "Physical mass-allocation and product-specific packaging method precedent only; softwood survey amounts, species and shares are not limba evidence"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:05c7ffd7e7be85c28f5faa342810752c6ed773c5b5e5e86ff08d024024ed0b3a"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_8789"
      family: "system_boundary"
      span:
        start:
          offset: 8789
          line: 64
          column: 1
        end:
          offset: 12426
          line: 85
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Identified untreated limba logs received at mill gate, including bark where present; moisture and stock recorded |\n| starting_condition_role | Foreground intake fact; upstream forestry, harvest and freight burdens remain in linked log supply |\n| product_classification_scope | Limba subset of tropical non-coniferous thin sheets ≤6 mm; classification does not establish forest provenance or method applicability |\n| recursive_input_rule | Purchased veneer is outside this log-to-sheet route. Keep raw, WIP and accepted-FG stock identities and inherited vectors; internal rework/repeat drying/returns/reacceptance never create a second first-accepted output. External same-category sheet input requires a reviewed purchased-sheet route; receipt, retest or dispatch of purchased finished sheets never adds log-fed production Q_new. |\n| upstream_dataset_requirement | Match log species/provenance, forestry/land-use treatment and mill delivery gate; match electricity voltage/geography/period and actual net steam supply boundary; link treatment of each exported waste |\n| disclosure | Declare intake, first-acceptance and dispatch gates; Q_new and original old-cohort denominators; inherited stock vectors; utility suppliers and separate steam/process-water circuits; route exclusions, forest/land-use coverage, freight ownership, storage losses, infrastructure, unmeasured exchanges and background mismatches |\n\n| rule_id | Rule | source_ids |\n| --- | --- | --- |\n| boundary_species | Use supplier and lot evidence to identify Terminalia superba and segregate its accepted output, residues and rejects. Unknown mixtures fail applicability. Record plantation/natural-forest provenance without assuming that tropical origin establishes land-use neutrality. | `itto-limba`; `un-cpc-3` |\n| boundary_stages | Include log storage loss, debarking/bucking, conditioning, peeling, clipping, drying, cooling, repeated passes, grading, trim, packaging actually used and associated wastewater/emissions. The end gate precedes adhesive composing, layup or downstream pressing. | `epa-veneer-2002`; `usda-wood-moisture-2021` |\n| boundary_utility | Use electric drives and purchased steam only. Steam heats the conditioning bath and dryer air through closed indirect heat exchangers/coils, with no designed steam contact with wood or process water. Preserve the utility steam/condensate mass, state, enthalpy, return, stock and loss ledger separately from the process-water balance. Do not duplicate supplier fuel/boiler emissions. Direct injection/contact, coil leakage into process water, combustion or diesel handling requires route review and explicit atomic mass exchanges before application. | `epa-veneer-2002` |\n| boundary_repeat | Preserve original-lot and first-acceptance-cohort identity through moisture sorting, every repeat pass, storage, dispatch, return and retest. Add actual service quantities to that cohort, never create another accepted-output quantity or transfer old-cohort services to new output. No universal repeat rate or Terminalia temperature schedule is inferred. | `fao-tropical-utilization`; `epa-veneer-2002` |\n| boundary_completeness | Physical inputs/outputs must close across stock, water and dry wood with stated uncertainty. Record additional actual exchanges separately, disclose any excluded capital/infrastructure scope and keep unresolved identities or unmeasured releases visible. Untreated sheet manufacture gives no preservation or end-use approval. | `itto-limba`; `usda-wood-moisture-2021` |\n\n"
