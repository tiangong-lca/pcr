system_boundary:
  rules:
    - rule_id: boundary_species
      applies_to: "foreground_system_boundary"
      rule: "Use supplier and lot evidence to identify Terminalia superba and segregate its accepted output, residues and rejects. Unknown mixtures fail applicability. Record plantation/natural-forest provenance without assuming that tropical origin establishes land-use neutrality."
      source_ids:
        - itto-limba
        - un-cpc-3
    - rule_id: boundary_stages
      applies_to: "foreground_system_boundary"
      rule: "Include log storage loss, debarking/bucking, conditioning, peeling, clipping, drying, cooling, repeated passes, grading, trim, packaging actually used and associated wastewater/emissions. The end gate precedes adhesive composing, layup or downstream pressing."
      source_ids:
        - epa-veneer-2002
        - usda-wood-moisture-2021
    - rule_id: boundary_utility
      applies_to: "foreground_system_boundary"
      rule: "Use electric drives and purchased steam only. Steam heats the conditioning bath and dryer air through closed indirect heat exchangers/coils, with no designed steam contact with wood or process water. Preserve the utility steam/condensate mass, state, enthalpy, return, stock and loss ledger separately from the process-water balance. Do not duplicate supplier fuel/boiler emissions. Direct injection/contact, coil leakage into process water, combustion or diesel handling requires route review and explicit atomic mass exchanges before application."
      source_ids:
        - epa-veneer-2002
    - rule_id: boundary_repeat
      applies_to: "foreground_system_boundary"
      rule: "Preserve original-lot and first-acceptance-cohort identity through moisture sorting, every repeat pass, storage, dispatch, return and retest. Add actual service quantities to that cohort, never create another accepted-output quantity or transfer old-cohort services to new output. No universal repeat rate or Terminalia temperature schedule is inferred."
      source_ids:
        - fao-tropical-utilization
        - epa-veneer-2002
    - rule_id: boundary_completeness
      applies_to: "foreground_system_boundary"
      rule: "Physical inputs/outputs must close across stock, water and dry wood with stated uncertainty. Record additional actual exchanges separately, disclose any excluded capital/infrastructure scope and keep unresolved identities or unmeasured releases visible. Untreated sheet manufacture gives no preservation or end-use approval."
      source_ids:
        - itto-limba
        - usda-wood-moisture-2021
boundary_abstraction:
  declared_starting_condition: "Identified untreated limba logs received at mill gate, including bark where present; moisture and stock recorded"
  starting_condition_role: "Foreground intake fact; upstream forestry, harvest and freight burdens remain in linked log supply"
  product_classification_scope: "Limba subset of tropical non-coniferous thin sheets ≤6 mm; classification does not establish forest provenance or method applicability"
  recursive_input_rule: "Purchased veneer is outside this log-to-sheet route. Keep raw, WIP and accepted-FG stock identities and inherited vectors; internal rework/repeat drying/returns/reacceptance never create a second first-accepted output. External same-category sheet input requires a reviewed purchased-sheet route; receipt, retest or dispatch of purchased finished sheets never adds log-fed production Q_new."
  upstream_dataset_requirement: "Match log species/provenance, forestry/land-use treatment and mill delivery gate; match electricity voltage/geography/period and actual net steam supply boundary; link treatment of each exported waste"
  disclosure: "Declare intake, first-acceptance and dispatch gates; Q_new and original old-cohort denominators; inherited stock vectors; utility suppliers and separate steam/process-water circuits; route exclusions, forest/land-use coverage, freight ownership, storage losses, infrastructure, unmeasured exchanges and background mismatches"
