allocation_rules:
  - rule_id: allocation_physical
    applies_to: "foreground_burden_allocation"
    rule: "Keep the physical wood/water/carbon ledger and the allocated environmental burden ledger separately. Accepted floor panels, WIP changes, offcuts, captured dust and external wastes keep their full measured quantities. Never multiply co-product physical output by an allocation share."
    source_ids:
      - corrim-flooring-2011
  - rule_id: allocation_subdivide
    applies_to: "foreground_burden_allocation"
    rule: "First use stage metering/subdivision for avoidable joint burdens. External waste disposal with no saleable product is not a co-product allocation denominator. Internal recovered solvent, heat and rework stay internal and receive no external substitution credit."
    source_ids:
      - corrim-flooring-2011
  - rule_id: allocation_joint
    applies_to: "foreground_burden_allocation"
    rule: "For demonstrated saleable wood co-products with similar wood material, disclose a dry-wood-mass allocation of remaining inseparable wood-conversion burdens using measured moisture-corrected masses; report sensitivity where prices or contamination invalidate that physical relation. UF/coating/finishing-specific burdens follow their measured consumption and destinations, not all wood outputs automatically. Document shares summing to one and a separate allocated dataset view."
    source_ids:
      - corrim-flooring-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "flooring"
      flow_role: "Accepted output geometry and mass"
      record_type: "primary measurement and records"
      raw_fields: "lot; accepted/rejected counts; package tare; net finished mass G; moisture; effective joint width/length; joined-layout area A; total/layer thickness; grade/date; WIP stock"
      collection_method: "Calibrated scale, calipers and joined-layout survey on the same representative lot; do not derive G from nominal density."
      unit: "kg; m2; mm"
      frequency: "Each lot/shift; continuous meters; representative emission campaign"
      temporal_coverage: "One matched full production period covering route/product variability"
      site_scope: "One facility and one declared recipe/configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw records; matched stocks; uncertainty and absence evidence"
    - protocol_id: cp_layers
      process_id: "flooring"
      flow_role: "Separate wood layers"
      record_type: "primary measurement and records"
      raw_fields: "species and botanical group; supplier; layer position; grain; dry veneer thickness; issue/return/reject weights; wet/dry sample masses; moisture calibration; start/end stocks"
      collection_method: "Weigh each species/layer supply independently; matched wood-only oven-dry samples establish dry-basis moisture; final composite method must account for resin/coating volatiles."
      unit: "kg; mm"
      frequency: "Each lot/shift; continuous meters; representative emission campaign"
      temporal_coverage: "One matched full production period covering route/product variability"
      site_scope: "One facility and one declared recipe/configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw records; matched stocks; uncertainty and absence evidence"
    - protocol_id: cp_recipe
      process_id: "flooring"
      flow_role: "Glue and each coating/cleaner chemical"
      record_type: "primary measurement and records"
      raw_fields: "SKU; SDS; supplier formulation and supplied precondensation state; wet mass; nonvolatile-solids test basis; water/solvent fractions; dose; issue; return; retained cured glue/coating; residual reactive species; catalyst/additive; cleaning recovery; stage opening/closing stocks and paired handoffs; cure schedule; measured cure extent and method; formation/consumption evidence; sampling and uncertainty; QC"
      collection_method: "Calibrated weighing and issue/return/stock balances for each actual SKU; pair stage endpoints with moisture/composition measured on compatible bases. Retain press temperature/time/pressure and UV lamp dose/speed; establish actual cure extent and retained composition by validated representative analysis or supplier/site evidence, not acceptance alone. Quantify reaction terms only from actual recipe/extent with uncertainty; unavailable terms remain pending, never zero or default yield. Verify each actual independent UF-resin supply versus a bought whole prepared adhesive: complete formulations require specific compatible complete-product identities/providers and supplier manufacture/preparation/delivery once; included ingredients/carrier water remain analytical. Record true separately purchased additions and actual onsite dilution/mixing water/utilities/losses separately, with matched provider wet/active reference basis; unresolved whole identities remain pending, never recaption a constituent UUID."
      unit: "kg"
      frequency: "Each lot/shift; continuous meters; representative emission campaign"
      temporal_coverage: "One matched full production period covering route/product variability"
      site_scope: "One facility and one declared recipe/configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw records; matched stocks; uncertainty and absence evidence"
    - protocol_id: cp_energy
      process_id: "flooring"
      flow_role: "Stage electricity and steam heat"
      record_type: "primary measurement and records"
      raw_fields: "stage; kWh; meter; voltage; grid/period; transformer boundary; steam/return mass; pressure; temperature; dryness; enthalpy reference; supplier energy definition"
      collection_method: "Submeter or auditable run-time metering allocation for press, machining, UV, extraction and packing; meter supply/return and reconcile enthalpy with supplier reference. Unknown definition blocks thermal background linkage."
      unit: "MJ"
      frequency: "Each lot/shift; continuous meters; representative emission campaign"
      temporal_coverage: "One matched full production period covering route/product variability"
      site_scope: "One facility and one declared recipe/configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw records; matched stocks; uncertainty and absence evidence"
    - protocol_id: cp_packaging
      process_id: "flooring"
      flow_role: "Each packaging component"
      record_type: "primary measurement and records"
      raw_fields: "box/film SKU; issue/return weights; package counts; tare; scrap; outgoing material; fibre/polymer grade"
      collection_method: "Weigh components separately and reconcile purchase, stores, packed product and damaged material; no standard scrap fraction."
      unit: "kg"
      frequency: "Each lot/shift; continuous meters; representative emission campaign"
      temporal_coverage: "One matched full production period covering route/product variability"
      site_scope: "One facility and one declared recipe/configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw records; matched stocks; uncertainty and absence evidence"
    - protocol_id: cp_waste
      process_id: "flooring"
      flow_role: "Each waste stream"
      record_type: "primary measurement and records"
      raw_fields: "origin stage; material chemistry; wet/dry mass; moisture; resin/coating fraction; retained/recovered quantity; destination; sale status; treatment manifest; storage change"
      collection_method: "Separate weighed containers/weighbridge and analytical liquid sampling; distinguish raw-wood dust, bonded dust, glue, coating, solvent, aqueous effluent and cardboard. Preserve full pre-allocation masses."
      unit: "kg"
      frequency: "Each lot/shift; continuous meters; representative emission campaign"
      temporal_coverage: "One matched full production period covering route/product variability"
      site_scope: "One facility and one declared recipe/configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw records; matched stocks; uncertainty and absence evidence"
    - protocol_id: cp_air
      process_id: "flooring"
      flow_role: "Each released species/particle bin"
      record_type: "primary measurement and records"
      raw_fields: "source; controls; species/CAS; sample time; concentration; gas flow; pressure/temperature; wet/dry gas basis; inlet/background humidity; operating hours; detection limits; PM cutpoints; matched wood/carrier-water and solvent stocks/outlets; actual recipe/cure extent; evidenced species formation/consumption; sampling and uncertainty"
      collection_method: "Matched stack/fugitive monitoring after controls, net of inlet/background contributions, or a site-specific validated species balance under layer_balance where monitoring is unavailable. Separate initial/carrier water from reaction water and retained/recovered/liquid outlets. Do not assign reaction yields from qualitative chemistry or unexplained mass loss. Distinguish absence, below detection and unresolved; identify every actual chemical, not one VOC total."
      unit: "kg"
      frequency: "Each lot/shift; continuous meters; representative emission campaign"
      temporal_coverage: "One matched full production period covering route/product variability"
      site_scope: "One facility and one declared recipe/configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw records; matched stocks; uncertainty and absence evidence"
    - protocol_id: cp_transport
      process_id: "flooring"
      flow_role: "Actual incoming road freight"
      record_type: "primary measurement and records"
      raw_fields: "shipment material; loaded tonnes; distance; vehicle class; fuel; payload; return; supplier delivered boundary"
      collection_method: "Shipping records and actual route distances; supplier boundary check prevents duplicated transport."
      unit: "t*km"
      frequency: "Each lot/shift; continuous meters; representative emission campaign"
      temporal_coverage: "One matched full production period covering route/product variability"
      site_scope: "One facility and one declared recipe/configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw records; matched stocks; uncertainty and absence evidence"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "q = Q / G; Q is attributed matched-period exchange; G is accepted flooring net kg, strictly positive. Keep physical Q and allocation shares separate."
      inputs:
        - Q
        - G
        - cp_output
      output: "Exchange per 1 kg reference flow"
      source_ids:
        - corrim-flooring-2011
    - id: area_reconciliation
      applies_to: "reference_output"
      rule: "a = A/G; measured coverable area per kg. t = measured finished thickness in metres. Envelope volume V = A*t; actual profiled solid volume subtracts measured recess/overlap geometry; rho = G/V on the same moisture basis. A package nominal rectangle is not effective cover."
      inputs:
        - A
        - G
        - t
        - cp_output
      output: "m2/kg and geometry/mass check"
      source_ids:
        - nwfa-wood-definition
    - id: layer_balance
      applies_to: "flooring"
      rule: "For each pure wood layer, u = (m_wet - m_dry)/m_dry; m_dry = m_wet/(1+u). Reconcile G from measured retained dry wood, cured resin/coating/additives and water in non-overlapping fractions at the accepted state; incoming nonvolatile solids are not automatically retained cured solids. On the same stage boundary/period before allocation, total physical mass obeys opening + inputs = closing + outputs; apply the same conservation separately to each relevant element, including C/H/O/N for UF, using actual compositions and every material outlet. Do not add chemical generation/consumption to total mass or elemental balances, sum energy/freight into mass, or infer carbon from total coated-board mass. For each species s, including H2O and reactive resin/coating constituents, opening_s + inputs_s + formation_s = closing_s + outputs_s + consumption_s. Quantify reaction terms only with actual supplied recipe, cure extent and validated analysis/stoichiometry; include retained material, wastes, condensate and actual air releases once, with paired stage handoffs and stocks. Document nonreactive terms as zero only with evidence. Unknown terms/residuals remain unresolved with propagated uncertainty; never force closure by invented water/emissions or a universal solids yield."
      inputs:
        - "Layer masses"
        - u
        - "retained composition"
        - stocks
        - "actual recipe/cure extent and reaction evidence"
        - cp_output
        - cp_layers
        - cp_recipe
        - cp_waste
        - cp_air
      output: "Separate total-mass, elemental and reaction-aware species residuals with uncertainty"
      source_ids:
        - usda-wood-handbook-2021
        - ding-uf-curing-2020
    - id: metered_electricity
      applies_to: "electricity"
      rule: "E_MJ = 3.6 * E_kWh; sum mutually exclusive stage readings, reconcile whole-unit meter and remove documented unrelated loads."
      inputs:
        - kWh
        - "stage meters"
        - cp_energy
      output: "MJ per period then per kg"
      source_ids:
        - corrim-flooring-2011
    - id: thermal_reconciliation
      applies_to: "press_heat"
      rule: "H = sum(m_supply*h_supply) - sum(m_return*h_return), with matched enthalpy reference and units plus documented other outlet/heat losses. Use H only if supplier reference is the same delivered-energy basis; do not equate this net balance automatically to a GCV exchange."
      inputs:
        - "Steam/condensate masses"
        - pressure
        - temperature
        - dryness
        - "supplier definition"
        - cp_energy
      output: "Measured thermal balance and linkage compatibility"
      source_ids:
        - corrim-flooring-2011
    - id: emission_quantity
      applies_to: "formaldehyde; acetone_air; pm25; pmcoarse; pmover10; water_air"
      rule: "Integrate matched mass concentration * gas volume over measured operation, with unit/temperature/pressure/wet-dry conversions, controls and inlet/background subtraction. Particle differences require matched nested samplings; sums include exclusive bins only. Species balances use layer_balance formation/consumption terms supported by actual recipe/cure extent and exclude retained/recovered material and other outlets. Water formation is not itself an air release; unexplained losses or unknown reaction terms cannot establish an emission quantity. No positive factors are supplied."
      inputs:
        - "Monitoring/balance records"
        - cp_air
        - cp_recipe
      output: "Species-specific released mass with uncertainty"
      source_ids:
        - corrim-flooring-2011
        - ding-uf-curing-2020
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Verify full original flow route, material, compartment, property and quantity basis. An identity UUID is not a complete supplier dataset; blank identities and pending basis prevent dependent dataset completion."
      evidence: "Direct flow definition; primary supplier specification"
    - id: quality_balances
      applies_to: "flooring"
      requirement: "Assess unallocated whole-stream total mass and elemental conservation separately from reaction-aware H2O, resin/coating and solvent species ledgers under layer_balance. Reconcile actual wet/dry test bases, cure extent, all retained/waste/air outlets, paired WIP handoffs and stocks. Propagate measurement, composition and reaction-term uncertainty; investigate residuals without a universal tolerance. Missing reaction evidence prevents dependent species-balance closure/emission estimation; disclose the gap instead of assuming zero formation/consumption or treating supplied dry solids as conserved."
      evidence: "cp_output; cp_layers; cp_recipe; cp_waste; cp_air; actual supplier/site reaction evidence"
    - id: quality_scope
      applies_to: "flooring"
      requirement: "Use the actual facility period, declared product recipe and supplier region/year. Do not transfer coniferous, paper, optical, wafer or wet-rendering surveys. Unknown, absent and below detection remain distinct."
      evidence: "Production and supplier records; source applicability"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm real wood in every structural ply, individual species/source and thickness, UF bond and clear factory UV finish; reject excluded solid, HDF, strip and alternate-route products."
    source_ids:
      - unsd-cpc-31626
      - nwfa-wood-definition
      - corrim-flooring-2011
  - rule_id: validate_denominator
    applies_to: "foreground_dataset_conformance"
    rule: "Exactly one reference_output of 1 kg accepted net finished flooring. All inventories and collection aggregation use per 1 kg reference flow. Reconcile same-lot effective joined area, measured thickness, net mass and wood moisture; no assumed life or installation waste."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: validate_atomic
    applies_to: "foreground_dataset_conformance"
    rule: "Every row is one material/species/formulation/waste/emission. Split physical variants; confirm exact Chinese names and original UUID route/property. Chemical/product tests cannot replace manufacturing emission records. Unknown thermal basis or UUID remains incomplete, not zero."
    source_ids:
      - corrim-flooring-2011
  - rule_id: validate_ledgers
    applies_to: "foreground_dataset_conformance"
    rule: "Retain complete unallocated total-mass/elemental balances and separately test species ledgers with evidenced formation/consumption under layer_balance. UF cure is a chemical transformation; actual recipe, supplied precondensation state, cure extent, retained composition and uncertainty are required for dependent balances. Do not force H2O or dry-resin closure, equate generated water with discharge, or fill missing evidence with zero/default yields. Preserve matched WIP handoffs, non-overlapping PM bins and all combustion LCI including biogenic CO2 in linked heat datasets; those separately bounded combustion records require actual fuel/air composition and reaction/measurement evidence for their own water-species balances. Background and foreground emissions must not duplicate. Unknown terms leave dependent dataset checks incomplete."
    source_ids:
      - corrim-flooring-2011
      - usda-wood-handbook-2021
      - ding-uf-curing-2020
published_dataset_profile:
  dataset_role: "Measured flooring manufacture with explicit upstream links; candidate method does not itself publish a dataset"
  downstream_use: "secondary_dataset; background_dataset after independent validation of actual foreground records and pending identities/bases"
  allowed_use: "Declared UF/all-hardwood-veneer/clear UV route, manufacturing comparison at matched gate/recipe/quality and moisture"
  excluded_use: "Unsupported solid/HDF/strip variants, installed-service equivalence, generic lifespan, assumed cutting losses or emission-free claims"
