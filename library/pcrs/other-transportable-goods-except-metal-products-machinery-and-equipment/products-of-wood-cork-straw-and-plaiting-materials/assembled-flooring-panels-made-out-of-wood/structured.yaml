measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh accepted finished flooring on a calibrated scale at declared moisture; subtract all package tare and reject mass. Denominator G is total accepted net flooring mass in the matched production period; no default product weight."
  - id: effective_area
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: ""
    required_unit: "m2"
    rule: "Measure a representative joined layout of accepted boards with actual joint engagement. Count only exposed coverable face, excluding tongue overlap, concealed edges and package nominal oversize. Reconcile a = A/G with thickness and measured mass; do not assume installation cutting waste."
  - id: wood_moisture
    applies_to: "wood layers"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use dry-basis moisture u = (wet wood mass - dry wood mass) / dry wood mass. Measure separate wood layers with a species-calibrated method verified against representative oven-dry samples; do not treat resin/coating volatilization as water. No default moisture or density. Supplied resin nonvolatile solids and cured retained solids are distinct measured states, not a universally conserved component; use layer_balance for reaction-aware reconciliation."
  - id: utility_basis
    applies_to: "electricity; press_heat"
    required_property_ref:
      name: "Net calorific value ; Gross calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Electricity has the recorded NCV property; convert metered kWh using 3.6 MJ/kWh. Steam heat has a GCV identity and requires supplier-defined reference-energy compatibility; a bare MJ value cannot establish net useful heat."
