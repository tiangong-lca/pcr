      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Purchased dried, edge-jointed, unveneered Falcata solid-strip barecore; dry unbonded Meranti face/back and crossband sheets; supplied dry UF resin and dry NH4Cl |\n| starting_condition_role | Foreground procurement gate; upstream core production and its edge adhesive are retained in linked input datasets |\n| product_classification_scope | Retained physical product boundary; candidate31422 association under owner-directed hold, with no accepted automatic classification selection. A generic native flow does not decide classification. |\n| recursive_input_rule | Purchased finished blockboard of the same category is a separate explicitly identified input; inherited burdens remain. It cannot substitute for unveneered barecore or create new output merely by resale/reacceptance. Unresolved recursive providers remain unresolved. |\n| upstream_dataset_requirement | Independently compatible barecore, unbonded veneer, chemical, utility, transport and waste-treatment datasets; retain geography, species, moisture, recipe/state, reference unit, gate and inherited burdens |\n| disclosure | State procurement gate, actual core/veneer species, upstream core adhesive and drying, plant/time, utilities, packaging, excluded services and foreground-only versus linked upstream completeness |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_procurement | `blockboard_lamination` | Include actual dry-input receipt/conditioning, glue mixing, crossband and face assembly, hot pressing, trimming/sanding, control devices, failed production, cleanup, packaging and first acceptance. Upstream barecore making and its glue are included through the purchased core exactly once. Materially different starts or adhesives require a boundary review. | fao-farm-structures-1986; unido-panel-adhesives-1977 |\n| b_provenance | `face_veneer`; `cross