measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "B = B_c = Q = sum of independently measured unique first-quality acceptance event net panel masses in completed cohort c at the declared gate, cp_output; lock each event on its measured whole-panel moisture/composition basis and exclude packaging. Reconcile Q = D_new + FG_new + L_new under acceptance_event_bridge on that same acceptance basis; use Q = D_new + FG_new only when all other net dispositions are evidenced zero. Opening accepted FG, purchased finished panels, dispatch, returns, retests and reacceptance add no Q. Actual post-acceptance loss, downgrade, scrap or return to WIP never subtracts from locked Q. A zero or missing Q preserves raw ledgers and remains unresolved. Normalize only the prepared attributable exchange amount under normalize_mass. Do not replace accepted whole-panel mass with oven-dry wood, supplied adhesive solids or later dispatch mass."
  - id: wood_moisture
    applies_to: "wood material ledger"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "u = (m_wet - m_od) / m_od; m_od = m_wet / (1 + u). For unbonded veneer or separately evidenced wood component only, determine oven-dry moisture by representative sealed samples and oven weighing, cp_materials; bonded barecore total mass includes its edge adhesive, so total drying loss is not automatically pure wood moisture; keep dry-basis u distinct from wet-basis fraction. Source: usda-wood-handbook-2021."
  - id: adhesive_solids
    applies_to: "UF glue ledgers"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "m_s = m_supplied * s; m_ns = m_supplied * (1 - s). Measure s and actual H2O content separately for UF powder, cp_recipe; m_ns is the non-solids remainder, not automatically water. Separate resin, hardener and added water; report test conditions and non-water volatiles. Supplied solids are not conserved cured-resin mass; no universal solids fraction or cure yield."
  - id: utilities
    applies_to: "electricity and purchased heat"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "E_MJ = 3.6 * E_kWh. Apply net_heat with independently measured supply/return masses and actual supplier h reference, temperature/pressure states and provider boundary, cp_heat. Only verified equal paired masses with appropriate evidenced storage/other-stream conditions permit m_hotwater * (h_supply - h_return). kg times MJ/kg gives MJ; kg times kJ/kg is divided by 1000 once. Already integrated observations are not integrated again. Two-stream boundary enthalpy is not automatically useful press duty when storage, losses or other legs are unknown. Do not multiply MJ heat by fuel LHV/HHV or equate steam mass with useful heat."
