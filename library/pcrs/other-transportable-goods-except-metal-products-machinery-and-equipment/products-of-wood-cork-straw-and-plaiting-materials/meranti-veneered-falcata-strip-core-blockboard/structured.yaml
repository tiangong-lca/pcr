      rule: "Include actual dry-input receipt/conditioning, glue mixing, crossband and face assembly, hot pressing, trimming/sanding, control devices, failed production, cleanup, packaging and first acceptance. Upstream barecore making and its glue are included through the purchased core exactly once. Materially different starts or adhesives require a boundary review."
