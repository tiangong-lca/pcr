      rule: "Verify outer Meranti tropical provenance and botanical/trade identity separately from crossbands and Falcata core. No tropical-core-only evidence qualifies. Inherited core edge adhesive and its fossil/biogenic constituents must be known; do not record upstream edge-glue consumption again as a foreground UF input."
      source_ids:
        - cbp-five-ply-blockboard-2011
        - qld-meranti-timber
    - rule_id: b_no_hidden_inputs
      applies_to: "blockboard_lamination"
      rule: "Each actual material, utility, waste and emission remains an atomic exchange with matched medium/state. Extra packaging, chemicals, fuel, oxidizer or on-site drying require individual rows and explicit scope extension before a complete dataset is claimed. Net hot-water energy and carrier ownership must match the provider boundary without double charging water."
