allocation_rules:
  - rule_id: a_physical
    applies_to: "blockboard_lamination"
    rule: "Keep unallocated total-mass and elemental C/H/O ledgers for all stages, with fossil/biogenic carbon origin retained; reactions have zero net elemental generation. Track H2O, dry wood and adhesive species separately with measured or supported formation/consumption terms, not assumed conserved species. Internal transfers cancel only at aggregated boundary. Physical panel/waste quantities are never multiplied by environmental allocation shares."
    source_ids:
      - usda-wood-handbook-2021
      - frihart-wood-joining-2023
  - rule_id: a_waste
    applies_to: "blockboard_lamination"
    rule: "Base route has one saleable panel product and exported treatment wastes: assign production burdens to accepted panels and include waste-treatment burdens without avoided-product credit. Internal rework retains original physical transfers and burden history; post-acceptance loss, downgrade, scrap or rework does not reverse the first-acceptance event or reduce its Q. Actual later services and failed rework burdens stay with that original cohort and denominator. If residues become saleable co-products, their product identities and measured physical outputs must be added before choosing a documented causal allocation or an explicitly justified alternative; keep that burden ledger separate from mass balance. Do not relabel waste UUIDs as products. Prefer measured subdivision first; any true joint-product allocation requires documented study context and independently supported causal relationship, with the unallocated physical outputs preserved."
    source_ids:
      - jrc-ilcd-detailed-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "blockboard_lamination"
      flow_role: "finished_panel"
      record_type: "foreground_record"
      raw_fields: "lot; species/layer construction; unique first acceptance ID/time/gate and original cohort c; locked event net mass and measured whole-panel moisture/composition; B_c = Q; package tare; disjoint D_new/FG_new/L_new parcel IDs; gross dispatch/linked returns/net dispatch; closing FG; actual loss/use/downgrade/scrap and closing return-to-WIP; rework/retest/reacceptance links; opening old FG and purchased finished-panel histories; actual later masses, component/H2O changes and acceptance-basis conversions; physical raw/WIP/non-WIP/FG boundaries"
      collection_method: "Calibrated net weighing after conditioning and first-quality acceptance, independent of dispatch. Deduplicate event/parcel IDs and reconcile acceptance_event_bridge using signed net destinations; weigh actual later states separately and document measured conversion to each original event basis. Link pre- versus post-acceptance rejects to cp_waste, materials/recipe/water/emissions and original service histories. Missing disposition or basis evidence remains unresolved, never a balancing loss estimate."
      unit: "kg"
      frequency: "Every acceptance, custody/stock change and linked later service; utility logs and emission campaign"
      temporal_coverage: "Declared completion period plus linked original stock/service periods"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow using locked Q, not dispatch plus residual stock"
      quality_evidence: "Calibration; acceptance/parcel and net-return reconciliation; measured basis conversion; separate physical and burden ledgers"
    - protocol_id: cp_materials
      process_id: "blockboard_lamination"
      flow_role: "core_barecore; face_veneer; cross_veneer"
      record_type: "foreground_record"
      raw_fields: "lot; botanical species/trade group/origin; core versus crossband versus outer role; unbonded veneer or glued barecore state; geometry/axis; moisture and measured net mass; barecore edge-binder chemistry, wood/H2O/binder constituents and inherited upstream vectors; actual physical throughput V with native units/state; opening/receipts/used/closing stocks, stage transfers and original cohort"
      collection_method: "Weigh each supplied material and stage use separately; verify layer-specific supplier traceability and tropical Meranti outer-ply identity. Sample unbonded veneer moisture by sealed specimens and documented oven-drying; establish barecore wood/water/binder components independently, not from total bonded-core drying loss alone. Reconcile actual stocks/transfers and inherited supplier/core-manufacturing burdens; no generic density or species coefficient."
      unit: "kg"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Declared completion period plus linked original stock/service periods"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_recipe
      process_id: "blockboard_lamination"
      flow_role: "uf_resin; hardener"
      record_type: "foreground_record"
      raw_fields: "component identity; supplier batch; actual dry UF formulation/solids/H2O/non-water volatiles; NH4Cl purity; separate water charges; mixing/issue/return/stock masses; four veneer interface areas and wet/dry spread; layup delay; temperature/pressure/dwell; bond acceptance; same-lot pre/post-cure composition/reaction extent, G_H2O/C_H2O and uncertainty; inherited burden/service vectors and original cohort"
      collection_method: "Use calibrated charge scales, supplier formulation certificates and matched solids/H2O/purity tests. No core glue is mixed here; supplied barecore edge adhesive remains upstream. Measure actual foreground UF formation/consumption through validated matched-lot analysis or supported stoichiometry applied to measured same-lot reaction extent under actual cure conditions. A generic diagram, solids loss or total exhaust water does not establish reaction extent; keep unknown terms unresolved. No default recipe, complete cure or residual-derived water yield."
      unit: "kg"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Declared completion period plus linked original stock/service periods"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_water
      process_id: "blockboard_lamination"
      flow_role: "water; glue_wastewater"
      record_type: "foreground_record"
      raw_fields: "fresh/returned water mass; meter volume; density; wastewater quantity; water/solids; COD; formaldehyde; destination; actual named receipt/return interfaces; wet/tank opening/closing stocks; provider-included versus separately owned water; cohort/service history"
      collection_method: "Meter fresh mixing/washing branches; collect wastewater discharge and analysis, reconcile tank stocks and internal recycling."
      unit: "kg"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Declared completion period plus linked original stock/service periods"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_energy
      process_id: "blockboard_lamination"
      flow_role: "electricity"
      record_type: "foreground_record"
      raw_fields: "circuit; kWh/MJ; voltage; bill; hours; stage; shared-meter apportionment; actual service event/phase/period and original cohort; inherited opening/current/closing service vectors; measured shared-meter attribution evidence"
      collection_method: "Read calibrated meters by non-overlapping circuit and reconcile total electricity with supplier bill."
      unit: "MJ"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Declared completion period plus linked original stock/service periods"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_heat
      process_id: "blockboard_lamination"
      flow_role: "heat"
      record_type: "foreground_record"
      raw_fields: "hot-water mass; supply/return temperature/pressure; enthalpy reference/state and h units (MJ/kg or kJ/kg); net MJ; supplier losses; background boundary; independent supply mass and return mass; actual other stream masses/states; circuit opening/closing mass and energy stock; calibrated meter boundary/calibration; actual water/energy/return ownership; original cohort and inherited/current/closing service vectors"
      collection_method: "Use a compatible calibrated net heat meter or independently measured mass-flow and state observations under net_heat; retain supplier h units/reference/state, actual stock/other-stream evidence and provider ownership. Reconcile compatible supplier/background delivery and cohort service history without reintegrating totals."
      unit: "MJ"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Declared completion period plus linked original stock/service periods"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_pack
      process_id: "blockboard_lamination"
      flow_role: "pe_film; pe_film_waste"
      record_type: "foreground_record"
      raw_fields: "film identity; lot; net film mass; package tare; actual receipts/returns/first use; opening/closing stocks; reuse/issue history; inherited acquisition/service vectors and original cohort"
      collection_method: "Weigh PE-LD film separately and reconcile issue/return/first-use records with accepted panel cohorts. Count its provider burden once; exclude packaging from panel B_c. Additional straps/pallets are not implied absent: add each actual material and matched provider before complete dataset use."
      unit: "kg"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Declared completion period plus linked original stock/service periods"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_waste
      process_id: "blockboard_lamination"
      flow_role: "bonded_trim; sanding_dust; glue_residue"
      record_type: "foreground_record"
      raw_fields: "atomic stream; actual wet/dry mass; moisture/solids; core/veneer/UF and inherited edge-binder composition; separately captured versus emitted; stocks/returns; original cohort and first-acceptance ID; pre-acceptance reject versus post-acceptance scrap/loss; actual mass/state and original-acceptance-basis equivalent; sales status; treatment destination"
      collection_method: "Use separate bins/scales and consignment records for coarse bonded trim, collected sanding dust and uncured UF leftovers. Resolve actual internal returns against original histories separately from off-site treatment; pure-wood waste is not a bonded-panel substitute. Actual pre-bonding veneer rejects require their own specific flow and ledger. Reconcile post-acceptance scrap with cp_output L_new once; keep actual waste mass and any moisture/chemical change separate from its acceptance-basis equivalent. Neither scrap nor failed rework cancels original Q or performed services."
      unit: "kg"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Declared completion period plus linked original stock/service periods"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_emissions
      process_id: "blockboard_lamination"
      flow_role: "formaldehyde; methanol; pm25; pm_between; pm_over10; water_vapour; co2_bio; co2_fossil"
      record_type: "foreground_record"
      raw_fields: "species/source; outlet; normal flow; concentration; humidity; sampling conditions; hours; control device; fugitives; PM cut fractions; non-detect limit; carbon origin; inlet/outlet air humidity and flow; condensate; retained/exported H2O; matched-lot G_H2O/C_H2O from cp_recipe; water-specific method and uncertainty"
      collection_method: "Representative outlet/fugitive sampling and time integration after controls; preserve species and disjoint particle cuts. Quantify net process vapour with matched inlet/outlet humidity-flow and condensate records, then reconcile the reaction-aware H2O ledger including actual UF water formation/consumption from cp_recipe; avoid duplicate carrier water or reaction water. Total mass loss includes non-water volatiles and is not an H2O assay. Record missing terms/species as unknown rather than forcing closure. Demonstrated absent oxidation requires operating/carbon evidence."
      unit: "kg"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Declared completion period plus linked original stock/service periods"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_abrasive
      process_id: "blockboard_lamination"
      flow_role: "abrasive; spent_abrasive"
      record_type: "foreground_record"
      raw_fields: "actual abrasive/binder/backing specification; receipt/use/return/replacement; net and adhered-dust masses; opening/closing stocks; original cohort and inherited vectors; recipient"
      collection_method: "Weigh actual consumed and discarded abrasive, reconcile service life and stock history; separate adhered dust from independently collected dust exactly once; match actual supplier and treatment"
      unit: "kg"
      frequency: "Each issue/replacement and stock boundary"
      temporal_coverage: "Declared completion and linked original stock/service periods"
      site_scope: "Same line and accepted cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Specification, calibrated weighing, service/stock and waste records"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all non-reference inventory exchanges after completed-cohort attribution"
      rule: "x_norm = A_c / B; B = B_c = Q from acceptance_event_bridge; B > 0. Prepare A_c from raw q_lot and the supported stock/service histories by the shared cohort protocol; q_lot remains the raw observation, not A_c. Every Amount expression is this single quotient, never an instruction to divide x_norm again. Completed-cohort attribution applies to every protocol before normalization: B = B_c = Q counts unique measured first-quality acceptance events at the declared gate once, with the complete D_new/FG_new/L_new bridge; later loss, scrap, downgrade or return to WIP cannot shrink Q. Opening accepted FG, purchased finished panels, dispatch, hold, return or reacceptance cannot create another B. Locate raw stores, unaccepted work in progress (WIP), unassigned non-WIP stores and accepted FG on their actual physical boundaries. Keep raw q_lot and actual throughput V in original units/states, wet/dry/component stocks and stage balances unallocated. Separately retain per-exchange inherited opening, current and closing burden/service vectors with provider, native unit, gate, phase, period, event ID and original cohort; physical closure alone does not attribute burdens. Prepare each exchange numerator A_c in its declared inventory unit from evidenced material use and services, documenting each conversion from retained native units: join supported opening raw/WIP histories to the completed cohort once, retain unreleased closing raw/WIP/non-WIP histories once for their actual later use, and do not deduct newly accepted closing FG from production or re-add old accepted production. Carry-forward to a future first-acceptance denominator applies only to unaccepted material; accepted panels returned to WIP retain original Q and already performed services in their original accepted cohort. Packaging receipts, issue/return, first use, wet stocks, reuse and acquisition/service histories follow the same rule; provider-included water/material/energy is charged once. Preserve actual failed/zero-output, idle, start/stop, cleanup and rework events and all later actual services of their original cohort, including old FG, post-acceptance loss/scrap and failed rework; add later services to the original cohort numerator against its original locked B_c = Q, without new output. Never transfer old-cohort services to current Q; an unknown original Q retains raw records and an inconclusive result. A hold/return cannot cancel performed services. Only evidenced wrong, duplicate or never-performed bookings may be corrected. Subdivide measured services or document supported causal attribution of shared meters, preserving the reconciled total; no default share or credit. Missing/unassignable history remains inconclusive, including zero-output histories without a supported cohort; never fabricate a later denominator. B > 0 permits one quotient A_c / B under normalize_mass; all Amount expressions denote that same prepared result, with no second division. This operational cohort protocol implements consistent scaling and full-cycle records, rather than a prescribed factory allocation key (jrc-ilcd-detailed-2010, §§7.4.2.5–7.4.2.9)."
      inputs:
        - q_lot
        - A_c
        - B_c
        - B
        - cp_output
        - "stock/service histories"
      output: "x_norm"
      source_ids:
        - jrc-ilcd-detailed-2010
    - id: acceptance_event_bridge
      applies_to: "finished_panel and its original completed cohort"
      rule: "Q is the sum of locked unique first-acceptance event masses. Reconcile Q = D_new + FG_new + L_new using mutually exclusive signed net parcel/custody/destination records on each original whole-panel acceptance basis; the newly first-accepted cohort has zero opening stock. D_new is net accepted dispatch after linked returns, FG_new is closing accepted FG, and L_new is every other net post-acceptance disposition: loss, use, downgrade, scrap/waste and closing transfer back to rework/WIP. Gross internal loops are not extra dispositions; after reacceptance a parcel moves from closing WIP to FG or net dispatch once without another Q. Use the two-term bridge only when every other disposition is evidenced zero. For example, 100 kg first acceptance = 60 kg net dispatch + 30 kg closing FG + 10 kg post-acceptance loss; Q stays 100 kg. Retain actual masses at their actual moisture/composition separately; resolve water exchange, UF reaction/volatiles, added glue/water, trimming and changed material state from measured parcel/component histories with cp_materials/cp_recipe/cp_water/cp_emissions. The bridge tracks original accepted material equivalents, not later added material or a claim that wood/water/resin species are conserved; no generic dry-wood or glue-solids factor converts bonded board. Unresolved basis changes or destination residuals remain findings, never invented loss or a revised Q. Opening old FG and purchased finished panels remain separate cohorts/receipts; their sale, return or reacceptance cannot enter new Q. Original Q and attributed failed/later services persist even if all accepted material is lost. Acceptance and normalized reference output are not additional external physical outputs."
      inputs:
        - cp_output
        - cp_materials
        - cp_recipe
        - cp_water
        - cp_waste
        - cp_emissions
        - "original event/parcel and stock/service histories"
      output: "Locked Q; disjoint acceptance-basis destination bridge; separate actual physical ledgers"
      source_ids:
        - jrc-ilcd-detailed-2010
    - id: dry_wood
      applies_to: "unbonded veneer and evidenced barecore wood component only"
      rule: "m_od = m_wet / (1 + u); m_water = m_wet - m_od. Apply only to unbonded veneer or separately evidenced barecore wood component; keep supplied core binder and its water/volatiles distinct."
      inputs:
        - m_wet
        - u
        - cp_materials
      output: "m_od; m_water"
      source_ids:
        - usda-wood-handbook-2021
    - id: glue_solids
      applies_to: "adhesive ledger"
      rule: "m_s = m_supplied * s; m_ns = m_supplied * (1 - s); m_H2O = m_supplied * w_H2O, where w_H2O is measured or verified supplier water mass fraction, not automatically 1 - s. Record method/conditions and non-water volatile fraction; m_s is supplied tested solids, not cured-resin mass."
      inputs:
        - m_supplied
        - s
        - w_H2O
        - cp_recipe
      output: "m_s; m_ns; m_H2O"
      source_ids: []
    - id: electricity_units
      applies_to: "electricity"
      rule: "E_MJ = 3.6 * E_kWh"
      inputs:
        - E_kWh
        - cp_energy
      output: "E_MJ"
      source_ids: []
    - id: net_heat
      applies_to: "heat"
      rule: "For compatible independently measured supply/return legs, H_pair = sum(m_supply * h_supply) - sum(m_return * h_return). Resolve relevant actual other streams and accumulation on the declared provider boundary before identifying H_net, or use a compatible calibrated net heat meter. Only verified equal paired masses with appropriate evidenced storage/other-stream conditions permit H_net = sum(m_hotwater * (h_supply - h_return)). Masses are kg: h in MJ/kg gives MJ; h in kJ/kg requires division by 1000 once. Integrate rate observations over their measured intervals once; do not reintegrate integrated mass or heat totals. Preserve the same actual supplier h reference across all legs and each measured state. H_pair is not automatically useful press duty; unknown storage/loss/other-leg terms or incompatible provider water/energy ownership leave the net heat relationship inconclusive."
      inputs:
        - m_supply
        - m_return
        - m_hotwater
        - h_supply
        - h_return
        - "actual other streams/accumulation"
        - cp_heat
      output: "H_net"
      source_ids: []
    - id: emission_mass
      applies_to: "individual emitted species"
      rule: "m_i = sum(c_i * V_normal * dt) + m_fugitive_i; convert reported concentration and time units explicitly"
      inputs:
        - c_i
        - V_normal
        - dt
        - m_fugitive_i
        - cp_emissions
      output: "m_i"
      source_ids: []
    - id: pm_fractions
      applies_to: "pm25; pm_between; pm_over10"
      rule: "m_pm_between = m_PM10 - m_PM2.5; m_pm_over10 = m_totalPM - m_PM10; same-basis cumulative measurements only; negative differences require review"
      inputs:
        - m_PM2.5
        - m_PM10
        - m_totalPM
        - cp_emissions
      output: "m_pm_between; m_pm_over10"
      source_ids: []
    - id: physical_balances
      applies_to: "unaltered ledgers at each actual physical boundary"
      rule: "For total mass and elemental C/H/O separately: opening stock + all material boundary intake = closing stock + panel + exported residues + material emissions; include evidenced atmospheric uptake and packaging transfers, retain fossil/biogenic C origin, and set net chemical generation of conserved elements to zero. Report signed residuals and uncertainty; never adjust measured quantities or invent a closure tolerance. At the conversion/first-acceptance gate, panel output includes newly accepted closing FG outside that gate; the same panel cannot also be closing stock inside it. An acceptance event is not a separate physical flow in addition to actual gate transfers. If an extended store ledger includes FG, use actual net dispatch/transfers, losses and closing stocks there, including opening FG and actual purchased finished-panel receipts, and reconcile event Q separately under acceptance_event_bridge; never add manufacture acceptance and the same closing FG. Returned accepted WIP retains its event link while actual crossing transfers cancel on aggregation. Acceptance-basis equivalents are not substituted for measured wet/dry/component physical masses. Actual named receipts/returns, carrier water and packaging/wet stocks belong on their real boundaries once, including provider-owned physical carriers without duplicating environmental burdens. Uncovered real entries remain named unresolved events; no whole-factory closure is asserted."
      inputs:
        - cp_materials
        - cp_recipe
        - cp_water
        - cp_pack
        - cp_waste
        - cp_emissions
        - cp_output
      output: "total-mass/elemental-C/H/O residuals"
      source_ids:
        - frihart-wood-joining-2023
    - id: reactive_species
      applies_to: "H2O and dry-material species ledgers"
      rule: "For each species X: opening X + external X intake + G_X = closing X + panel X + exported X + emitted X + C_X; G_X/C_X are actual foreground formation/consumption in kg, measured or supported by same-lot reaction extent, cp_recipe. For H2O include actual UF cure reaction water, wood moisture, glue carrier water, added water, air humidity and retained/liquid/vapour outputs on the same boundary. For dry wood/adhesive species track chemical conversion and non-water volatile losses separately from H2O. Elemental C/H/O redistribution is not net elemental generation; upstream resin-production water is not foreground generation. Report residual/uncertainty without default G_X/C_X, yield or assumed complete cure; missing reaction terms make closure inconclusive."
      inputs:
        - cp_materials
        - cp_recipe
        - cp_water
        - cp_waste
        - cp_emissions
        - cp_output
      output: "reaction-aware H2O/dry-species residuals"
      source_ids:
        - frihart-wood-joining-2023
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Verify material/species/state/route/property/unit/medium; blank UUID is an unresolved identity, not permission to substitute an adjacent product."
      evidence: "Supplier specification and verified direct record"
    - id: dq_recipe
      applies_to: "supplied core and foreground veneer glue"
      requirement: "Actual supplied-core edge adhesive constituents and upstream burdens; current supplier-defined UF formulation, actual solids/H2O/purity and bond acceptance; historical literature supports route only. The CBP sample does not establish UF chemistry or current production quantities. Verify foreground UF G_H2O/C_H2O and dry-species conversion using matched-lot measurements or supported stoichiometry with measured same-lot reaction extent; no inferred universal yield."
      evidence: "unido-panel-adhesives-1977; frihart-wood-joining-2023; supplier/analytical records"
    - id: dq_scope
      applies_to: "period/site/basis"
      requirement: "Preserve original record periods and cohort/gate/provider identities across stock and service histories; reconcile A_c with locked B_c = Q and the complete acceptance_event_bridge rather than requiring all raw receipts/services to occur in one period. Missing event, net-return, disposition or acceptance-basis conversion evidence keeps normalization incomplete; physical closure alone cannot establish Q or burden attribution. Report missing meters/tests, non-detect limits, seasonal/species/configuration changes and survey exclusions. No empirical range is imposed from another manufacturing route."
      evidence: "Primary records and boundary disclosure"
validation_rules:
  - rule_id: v_reference
    applies_to: "finished_panel"
    rule: "Exactly one reference product output: 1 kg accepted net panel at measured moisture. Confirm actual tropical Meranti outer face and back, Meranti crossbands, Falcata solid-strip barecore, five layers, crossed axes and every qualifier. A native flow name or tropical core alone is insufficient."
    source_ids:
      - cbp-five-ply-blockboard-2011
      - qld-meranti-timber
  - rule_id: v_route
    applies_to: "blockboard_lamination"
    rule: "Verify purchased barecore and dry unbonded veneer procurement, upstream core adhesive/burdens, actual UF/NH4Cl/water recipe and bond acceptance. Reject all-veneer, three-layer, coated, alternative-adhesive or integrated core-production substitutes. Check independent supplier compatibility with the generic reference, including its full more-than-two-veneer/tropical-outer/crossed-grain description and narrower supplier qualifiers."
    source_ids:
      - fao-farm-structures-1986
      - unido-panel-adhesives-1977
  - rule_id: v_measurement
    applies_to: "blockboard_lamination"
    rule: "Normalize each attributed A_c once by positive B_c. Verify Q from unique measured first-acceptance events and reconcile the disjoint same-basis Q = D_new + FG_new + L_new bridge, including net returns, post-acceptance loss/scrap/downgrade and closing returned WIP. Two terms require evidenced zero other dispositions. Opening FG, purchased finished panels, returns, dispatch, retests and reacceptance do not create B_c or reduce locked Q; gross loops must not double-count parcels. Reject unexplained destination residuals or unsupported moisture/composition conversion; never replace whole accepted board with dry wood or supplied glue solids. Verify inherited raw/WIP/FG burden and later-service vectors against the original cohort; zero/missing denominator remains raw and inconclusive. Preserve physical total-mass/elemental C/H/O and reactive-species ledgers separately. Require actual UF H2O formation/consumption and dry-species conversion evidence; do not force cure/water closure or treat supplied solids as conserved cured resin. Validate net heat independent-leg/meter boundary, actual streams/accumulation and h units/reference; no repeat integration or duplicated provider carrier burdens."
    source_ids:
      - usda-wood-handbook-2021
      - frihart-wood-joining-2023
      - jrc-ilcd-detailed-2010
  - rule_id: v_emissions
    applies_to: "blockboard_lamination"
    rule: "Check species, outdoor-air medium, disjoint particle cuts, control-device and fugitive coverage; collected dust is waste, not an emission. Distinguish inlet humidity, evaporated carrier water and actual cure reaction water. Missing measurements, unsupported absence, unresolved identities or allocation histories remain inconclusive."
    source_ids:
      - frihart-wood-joining-2023
      - jrc-ilcd-detailed-2010
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared unfinished interior five-layer Meranti/Falcata purchased-barecore UF lamination after supplier compatibility and all identity/measurement gaps are closed"
  excluded_use: "Whole CPC 31422 coverage; all-veneer plywood; other core/face/adhesive constructions; marine/exterior, structural or lifetime equivalence; generic density/emission/recipe defaults"
  required_metadata: "Layer/species/trade group/origin and tropical outer-ply proof; upstream barecore adhesive/burden boundary; geometry/axes/moisture; recipe/press acceptance; plant/time; original cohort/event and positive locked B_c = Q; measured acceptance basis and complete D_new/FG_new/L_new bridge; net heat boundary/h units/reference; allocation and exclusions"
  required_quality_disclosure: "Native category applicability limits; unresolved UUID/provider matches; missing UF reaction extent and species measurements; residual/uncertainty of acceptance-event bridge and separate physical/component/burden ledgers; emissions coverage; no scientific/publication authority inferred from classification"
  update_trigger: "Layer provenance/geometry, barecore supplier/edge glue, skin recipe, press, utility/provider boundary, packaging, waste status/destination or emission measurement change"
data_sources:
  - id: "cbp-five-ply-blockboard-2011"
    type: "official_guidance"
    reference: "U.S. CBP, NY N186300, 20 October 2011, physical sample description; https://rulings.cbp.gov/api/getdoc/ny/2011/N186300.pdf"
    used_for: "Four Meranti veneers around edge-jointed Falcata lumber-strip core, crossed successive grains, unfinished outer layers. Case construction only; no glue recipe, modern tariff decision or CPC correspondence."
  - id: "qld-meranti-timber"
    type: "official_guidance"
    reference: "Queensland Government, Meranti timber guidance; https://www.business.qld.gov.au/industries/farms-fishing-forestry/forests-wood/properties-timbers/meranti"
    used_for: "Scientific-name and occurrence sections: tropical South-East Asian Meranti, Shorea/Parashorea trade-name context. Actual layer species/origin still require supplier proof; no density/strength default."
  - id: "un-cpc-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC 3.0 Explanatory Notes, 30 June 2025, boards/panels hierarchy; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Complete 3141/31411/31412/3142/31421/31422/31423 context: solely-sheets versus residual branch, tropical outer plies and more-than-two crossed veneer sheets; blockboard example/title tension retained. Classification reasoning only."
  - id: "un-cpc-explanatory-notes-xlsx-2025"
    type: "official_guidance"
    reference: "UNSD, CPC 3.0 Explanatory Notes workbook, 30 June 2025; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.xlsx"
    used_for: "Same publication family as PDF; complete hierarchy/adjacent rows and Notes sheet cross-check, not independent corroboration or an official erratum."
  - id: "un-cpc-introduction"
    type: "official_guidance"
    reference: "UNSD, CPC 3.0 Introduction, paragraphs49–60; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Introduction.pdf"
    used_for: "Category boundaries, illustrative non-exhaustive examples and difficult-case limits; no exact CPC3–HS correspondence or universal blockboard inclusion inferred."
  - id: "fao-farm-structures-1986"
    type: "official_guidance"
    reference: "FAO, Farm structures in tropical climates, 1986, chapter3 Other Manufactured Boards; https://www.fao.org/4/s1250e/s1250e04.htm"
    used_for: "Glued solid strip cores covered with one or more veneers; physical distinction from all-veneer panels only; no dimensions/strength/yield defaults."
  - id: "unido-panel-adhesives-1977"
    type: "literature"
    reference: "J. Reinhardt, Industrial application and formulation of synthetic resin adhesives in the wood based panel industry, UNIDO ID/WG.248/9, 10 October1977, §2.2 and §3.1; https://downloads.unido.org/ot/47/90/4790807/00001-10000_07656.pdf"
    used_for: "Separate core/skin bonding roles, thermosetting veneer adhesive and dry UF/water/hardener formulation as technical options. Historical evidence; does not identify CBP sample glue or prescribe current dosage/performance."
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA FPL, Wood handbook—wood as an engineering material, FPL-GTR-282, 2021, chapters2/4/13; https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Meranti groups, dry-basis wood moisture and oven-drying measurement. Pure-wood moisture conversion does not identify total bonded-barecore drying loss as water or prescribe species coefficients."
  - id: "frihart-wood-joining-2023"
    type: "handbook"
    reference: "C.R. Frihart et al., Joining and Reassembling of Wood, Springer Handbook of Wood Science and Technology,2023, §14.2.1 pp720–723, DOI10.1007/978-3-030-81315-4_14; https://research.fs.usda.gov/download/treesearch/66341.pdf"
    used_for: "UF condensation/cure and water loss qualitatively. No default cure extent, resin recipe, water yield or numerical emission factor."
  - id: "jrc-ilcd-detailed-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook—General guide for LCA—Detailed guidance, March2010, §§7.4.2.4–7.4.2.9,7.4.2.11.1 and7.9.2–7.9.3; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Raw stock/activity data, full operating cycles, consistent scaling, physical checks and attributional subdivision/allocation hierarchy. Cohort and net-heat bookkeeping are disclosed operational deductions; no factory share, service factor or heat default."
  - id: "epa-plywood-2002"
    type: "official_guidance"
    reference: "US EPA, AP-42 section10.5 Plywood Manufacturing, January2002, pp.10.5-3–4; https://www.epa.gov/sites/default/files/2020-10/documents/c10s05.pdf"
    used_for: "Qualitative trimming/sanding and captured-versus-emitted dust context. Broader plywood source does not establish this factory, abrasive type, recipe or numerical factors; actual consumable and stock protocols are disclosed operational deductions."
