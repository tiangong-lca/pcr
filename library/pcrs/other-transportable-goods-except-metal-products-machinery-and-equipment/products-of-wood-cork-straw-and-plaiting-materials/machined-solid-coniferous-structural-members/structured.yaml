allocation_rules:
  - rule_id: allocation_ledgers
    applies_to: "all physical exchanges"
    rule: "Keep original physical cohort flows and the separately allocated environmental-burden account. Physical material balance and this inventory denominator precede allocation; final 1 m3 and co-product physical amounts are never multiplied by burden shares. Internal links, if disaggregated, match at both ends in quantity/state/period."
    source_ids:
      - corrim-northern-lumber-2025
  - rule_id: allocation_specific
    applies_to: "component operations"
    rule: "First assign separately metered member-specific machining, acceptance, rework and dispatch packaging to that member. Residue collection is recorded physically. Identify saleable co-products from quality, contracts and destination; waste is not assigned saleable co-product burden. Keep supplier allocation separate from component allocation."
    source_ids:
      - corrim-northern-lumber-2025
  - rule_id: allocation_shared
    applies_to: "inseparable joint burdens"
    rule: "When subdivision cannot resolve actual joint production, justify the physical relationship or an alternative reviewed basis. A dry-mass sensitivity case uses measured D_j and s_j=D_j/sum(D_saleable), sum(s_j)=1, for the explicitly identified joint stage only; terminal packaging/acceptance stays with members. Document alternatives and sensitivity. Northern softwood lumber mass allocation is a regional case, not a default for every component factory. No avoided-product credit in this attributional manufacturing account."
    source_ids:
      - corrim-northern-lumber-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "component_machining"
      flow_role: "reference geometry and grade"
      record_type: "acceptance_record"
      raw_fields: "member ID; drawing revision; species; grade standard/edition/method; lot; net section/length; tenon, bore, mortise and notch geometry; measured moisture gradient; accepted net wet mass; net volume; rejects; uncertainty"
      collection_method: "Calibrated dimensional survey/3D measurement against actual drawing with non-overlapping void subtraction; calibrated net weighing; moisture samples/electrical readings cross-checked by oven method; documented qualified post-machining acceptance; Accepted cohort Q is sum of actual net solid member volumes; retain each ID, moisture and geometry; per 1 m3 reference flow"
      unit: "m3; kg"
      frequency: "each member/lot; each drawing change"
      temporal_coverage: "Same documented accepted-production cohort"
      site_scope: "This component plant and explicitly traced supplier handoff"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "drawing; grade trace; calibration; acceptance and rejected-member record"
    - protocol_id: cp_material
      process_id: "component_machining"
      flow_role: "stock and lubricant"
      record_type: "material_record"
      raw_fields: "receipt/issue/stock quantities; supplier gate; species; wet/oven-dry mass; moisture/density; dimensions/grade; lubricant product/SDS; petroleum grade/formulation and calorific-qualifier compatibility; fresh additions/unused returns; operating oil stocks; leaks/drains; maintenance use; stock change; opening/closing raw, unaccepted WIP and other process stores; separately identified credited finished-member stocks; reference/acceptance gate, credit and dispatch status; original material, manufacturing and service history"
      collection_method: "Calibrated receiving/issue weighing and inventory records; actual species/state samples; supplier certificates and SDS; maintenance logs; distinguish process stores from already credited finished members at each stock date under wood_dry_balance; Same-cohort unallocated net consumption divided by Q; per 1 m3 reference flow"
      unit: "kg"
      frequency: "each receipt/batch; reconcile cohort"
      temporal_coverage: "Same documented accepted-production cohort"
      site_scope: "This component plant and explicitly traced supplier handoff"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "scale/stock reconciliation; species/grade/moisture evidence"
    - protocol_id: cp_energy
      process_id: "component_machining"
      flow_role: "machining_electricity"
      record_type: "meter_record"
      raw_fields: "opening/closing kWh; stage/machine circuit; operation and idle times; dust fan; electric handling; common meter split; voltage/mix; calibration"
      collection_method: "Calibrated circuit/stage meters; documented time/power attribution when direct submetering absent, with uncertainty and no duplicate fan/main meter load; Attributable unallocated cohort kWh×3.6 divided by Q; per 1 m3 reference flow"
      unit: "kWh; MJ"
      frequency: "continuous/batch readings"
      temporal_coverage: "Same documented accepted-production cohort"
      site_scope: "This component plant and explicitly traced supplier handoff"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "meter diagram; calibration; load/idle allocation records"
    - protocol_id: cp_packaging
      process_id: "component_machining"
      flow_role: "pp_strap; pe_film; wood_spacer"
      record_type: "packaging_record"
      raw_fields: "separate material/specification; issues; returns; trim; reused spacer cycles; shipped mass; stocks; polymer/species/treatment"
      collection_method: "Weigh separate finished components; use invoice counts only with measured item mass; reconcile shipped, reused, discarded and stocked quantities; not structural-member mass; Same-cohort net individual packaging consumption divided by Q; per 1 m3 reference flow"
      unit: "kg"
      frequency: "each dispatch/batch"
      temporal_coverage: "Same documented accepted-production cohort"
      site_scope: "This component plant and explicitly traced supplier handoff"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "BOM; scales; polymer/species SDS; reuse records"
    - protocol_id: cp_residue
      process_id: "component_machining"
      flow_role: "residue and waste outputs"
      record_type: "residue_record"
      raw_fields: "separate row ID; origin stage; wet mass/moisture; dry mass/carbon; sales/waste status; rework/stock change; destination; contamination; receipts"
      collection_method: "Calibrated net weighing by separate bin/contract; representative moisture/composition samples; stock reconciliation and sales/waste receipts; no duplicate material across destinations; Unallocated actual separate outgoing cohort totals divided by Q; per 1 m3 reference flow"
      unit: "kg"
      frequency: "each bin/dispatch; cohort balance"
      temporal_coverage: "Same documented accepted-production cohort"
      site_scope: "This component plant and explicitly traced supplier handoff"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "weighbridge/scale; samples; destinations; contracts; stock balance"
    - protocol_id: cp_air
      process_id: "component_machining"
      flow_role: "pm25; pmcoarse; pmover10"
      record_type: "emission_record"
      raw_fields: "source/outlet; control status; matched PM_total/PM10/PM2.5 definitions; concentration and gas flow/reference conditions; activity duration; fugitive test/model; blanks; uncertainties; subcompartment"
      collection_method: "Representative size-resolved outlet testing after controls plus evidenced fugitive measurements/models for the same cohort; measure flow/concentration on the same gas basis; no regional PTE factor default; Measured disjoint emitted mass totals divided by Q; per 1 m3 reference flow"
      unit: "kg; measured concentration/flow units"
      frequency: "representative operation/control states and cohort duration"
      temporal_coverage: "Same documented accepted-production cohort"
      site_scope: "This component plant and explicitly traced supplier handoff"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "sampling methods; calibration; source/control/activity evidence; uncertainty"
  calculation_rules:
    - id: normalize_volume
      applies_to: "all inventory rows"
      rule: "a_i=T_i/Q; Q is accepted actual net solid volume in m3; T_i is same-cohort unallocated exchange total in its verified unit; a_i is exchange per 1 m3 reference flow. Final wood volume total equals Q, so its normalized output is 1 m3."
      inputs:
        - T_i
        - Q
        - cp_reference
        - "applicable row collection protocol"
      output: "a_i"
      source_ids:
        - usda-wood-handbook-2021
    - id: net_geometry
      applies_to: "finished_member"
      rule: "V_member=V_actual_outer_solid-V_removed_nonoverlap; retain actual tenon material and subtract overlapping holes/cuts once. Q=sum(V_accepted_member); measure geometry at dispatch moisture, not nominal drawing volume."
      inputs:
        - "measured member and joint geometry"
        - cp_reference
      output: "Q"
      source_ids:
        - usda-wood-handbook-2021
    - id: electricity_conversion
      applies_to: "machining_electricity"
      rule: "T_MJ=3.6×T_kWh; a_electricity=T_MJ/Q; reconcile submeter totals/idle and common-load records without double counting."
      inputs:
        - T_kWh
        - Q
        - cp_energy
        - cp_reference
      output: "a_electricity"
      source_ids: []
    - id: wood_dry_balance
      applies_to: "sawn_stock; finished_member; sawdust_sale; shavings_sale; offcut_waste; dust_waste; pm25; pmcoarse; pmover10"
      rule: "For each measured state D=m_wet/(1+u). At the declared reference/acceptance gate, opening process dry wood plus receipts equals accepted dry output plus sold/discarded/emitted wood and closing process dry wood, with recorded other losses. Opening/closing process stocks contain raw stock, unaccepted WIP and other not-yet-credited process stores at their respective dates. At each stock date these stores and finished members already credited as accepted output are mutually exclusive, including credited members still held on site. A separate plant movement/dispatch balance, if shown, must declare its boundary and use actual dispatch/transfers and opening/closing finished-goods stocks instead of adding accepted process output again. This dry-mass reconciliation is distinct from the net-volume reference and burden allocation. Assess residual against measured uncertainty. Water and carbon ledgers use separate measured water/carbon fractions. Packaging wood is separately balanced; no assumption that PM is all wood without composition evidence."
      inputs:
        - cp_material
        - cp_reference
        - cp_residue
        - cp_air
      output: "dry/water/carbon balance residuals"
      source_ids:
        - usda-wood-handbook-2021
    - id: particle_partition
      applies_to: "pm25; pmcoarse; pmover10"
      rule: "T_pm25=T_PM2.5; T_pmcoarse=T_PM10-T_PM2.5; T_pmover10=T_PMtotal-T_PM10 only with comparable cumulative measurements and nonnegative differences; a_i=T_i/Q. Do not add nested PM10 or total again."
      inputs:
        - "matched measured PM totals"
        - Q
        - cp_air
        - cp_reference
      output: "a_pm25; a_pmcoarse; a_pmover10"
      source_ids:
        - epa-sawmill-pte-2014
  data_quality_requirements:
    - id: quality_structural
      applies_to: "finished member"
      requirement: "Keep grading/stock lot linked to each drawing and machining record; establish post-cut remaining section, knots/checks and acceptance. Stock strength grade alone does not establish a drilled/notched joint capacity; use actual applicable engineering/grade authority and keep its limits. No universal grade/minimum dimensions/design loads asserted."
      evidence: "grade/drawing/acceptance dossier"
    - id: quality_cohort
      applies_to: "all rows"
      requirement: "Keep numerator and accepted-volume denominator from identical scope/period; include rejects, rework and idle loads. Preserve separately traceable raw, unaccepted WIP, other process stores and credited finished-member states with their original material, manufacturing and service histories and associated burdens. Each accepted member contributes to Q once even when held on site; excluding credited finished goods from process closing stock does not subtract them from accepted Q or redefine exchange numerators or erase their histories. Do not pool species, grade roles, node geometries or moisture states without traceable weighting and disclosure."
      evidence: "cohort and meter ledger"
    - id: quality_provider
      applies_to: "UUID-bearing rows"
      requirement: "Identity is not a completed supplier dataset. Compare every background route, composition, reference quantity, gate, geographic/temporal and allocation/carbon basis; preserve unknown compatibility as pending and report completeness honestly."
      evidence: "provider contracts and documented comparison"
validation_rules:
  - rule_id: validate_identity
    applies_to: "finished_member"
    rule: "Require a one-piece dry untreated coniferous member and actual member-specific connection geometry/traceable post-machining structural acceptance. A strength grade, nominal beam name or intention to build alone does not meet this scope. Neither classifier nor UUID constitutes certification."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: validate_quantity
    applies_to: "all inventory rows"
    rule: "Require Q>0 actual net solid accepted volume and one finished_member output of 1 m3. All row and collection bases are per 1 m3 reference flow; numerator units remain carrier/material-specific. Confirm provider volume convention before actual linking. Unknown UUID, basis, upstream or measurement is unresolved, never zero or complete."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: validate_balances
    applies_to: "physical graph"
    rule: "Reconcile dry matter, water, material carbon and packaging with measured opening/closing stocks, receipts, accepted outputs, residues and emitted dust. Moisture changes do not manufacture dry wood; geometric removal is distinct from shrinkage. Quantify discrepancies against actual metering uncertainty and investigate; no invented fixed tolerance. Ensure internal rework/residue has one origin/destination and no duplicate purchase or sale."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: validate_particles
    applies_to: "pm25; pmcoarse; pmover10"
    rule: "Require comparable sampling point/period, controls, dry/wet gas definition and measured cumulative size cuts; 0<=PM2.5<=PM10<=PM_total. Report PM2.5, PM10-PM2.5, PM_total-PM10 as disjoint fractions only when those definitions match; never also sum nested PM10/total. A filterable-only total cannot establish a total including condensable matter. Unknown size/compartment needs review, not arbitrary split or correction flow."
    source_ids:
      - epa-sawmill-pte-2014
  - rule_id: validate_sources
    applies_to: "completed package"
    rule: "Retain lot/drawing/grade records, meters, sampling, SDS and provider/background scope comparison, waste receipts, source limits and uncertainties. No regional PTE/lumber survey values become universal component amounts. Unknown stock thickness/moisture/grade state or undocumented machining rejects blocks complete delivery."
    source_ids:
      - usda-wood-handbook-2021
      - corrim-northern-lumber-2025
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after completed measurements and source/basis checks"
  downstream_use: "Qualified component input to an explicitly scoped building model; per net solid m3 at stated moisture"
  allowed_use: "Same one-piece coniferous connection-machined member with matched grade, geometry, state and manufacturing gate"
  excluded_use: "Ordinary sawn timber or continuous-profile substitution; hardwood/engineered wood; installed load/service equivalence; whole-CPC coverage; unverified provider-volume linkage; omission of actual extra routes"
  required_metadata: "Species/grade authority and edition, drawing/acceptance, moisture/net-volume convention, density where converted, gate/site/period, supplier burdens, all atomic rows, allocation method and upstream carbon"
  required_quality_disclosure: "Meter/sample uncertainty, representative operating states, completeness, unresolved UUID/basis/background, omissions and allocation sensitivity; no measured industry average implied"
  update_trigger: "Changed species/grade/drawing/connection acceptance, supply moisture or volume convention, machinery/controls, packaging/chemistry, upstream provider or allocation scope"
data_sources:
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory. Wood handbook—wood as an engineering material. FPL-GTR-282 (2021). https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Ch.4 eqs.4-1/4-2 and Table4-5; Ch.6 p.6-8 structural timbers; Ch.13 p.13-2 moisture method; Ch.17 p.17-6 timber-frame joinery and shrinkage. Qualitative identity/measurement; no transferred grade, density, dimensions or quantity defaults."
  - id: "unsd-cpc31625-3"
    type: "official_guidance"
    reference: "UN Statistics Division. CPC Version 3.0, 31625 explanatory note. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/31625"
    used_for: "Official classification includes fencing/guard-rail posts and building beams. Classification scope only; not a grading/manufacturing requirement or approval of building-column mapping."
  - id: "epa-sawmill-pte-2014"
    type: "official_guidance"
    reference: "Particulate Matter Potential to Emit Emission Factors for Activities at Sawmills, Excluding Boilers, Located in Pacific Northwest Indian Country (EPA Region 10, May 2014). https://www.epa.gov/sites/default/files/2016-09/documents/spmpteef_memo.pdf"
    used_for: "Memorandum and attached p.1 table/footnotes: size cuts, residues and potential-emission scope excluding boilers. No PTE factor or enclosed-workshop zero/reduction transferred; filterable/condensable scope retained."
  - id: "corrim-northern-lumber-2025"
    type: "literature"
    reference: "Life Cycle Assessment of Softwood Lumber Production – Northern Region (22 July 2025 revision). https://corrim.org/wp-content/uploads/2025/07/LCA-Report-Northern-Lumber-Report-07222025.pdf"
    used_for: "§3.2.6 p.16 and §3.3 p.18: partition of environmental burdens, regional lumber physical-allocation case, terminal packaging attribution. Biogenic LCI versus GWP convention and context/sensitivity only; no survey moisture, yield, emissions or component-machining energy defaults."
