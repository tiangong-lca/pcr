measurement_rules:
  - id: reference_volume
    applies_to: "reference product"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Use cp_reference to measure actual remaining solid wood in accepted members; subtract bore/mortise/notch removals, retain tenon material actually present. Sum member net volumes into Q>0. Envelope volume, nominal trade dimensions, stacking gaps, packages, rejects and count are not Q. This author geometry convention needs provider-background reconciliation; common m3 alone is insufficient."
  - id: moisture_basis
    applies_to: "wood and residues"
    required_property_ref:
      name: "Explicit dry/wet water fraction"
      uuid: ""
    required_unit: "dimensionless"
    rule: "u=(m_wet-m_od)/m_od; w=(m_wet-m_od)/m_wet; w=u/(1+u); m_od=m_wet/(1+u); m_od>0, u>=0, 0<=w<1. Divide reported percentages by 100. Sample species, surface/core gradients and each residue state separately; electrical meters require appropriate calibration and original method limits. [usda-wood-handbook-2021 Ch.4 eqs.4-1/4-2, Ch.13.]"
  - id: mass_volume
    applies_to: "wood conversion"
    required_property_ref:
      name: "Matched-state mass and net solid volume"
      uuid: ""
    required_unit: "kg; m3"
    rule: "rho_u=m_wet/V_net,u; m_wet=rho_u×V_net,u using measured same-species, same-moisture, same-geometric-convention values. Basic density is oven-dry mass/green volume, not dispatch wet density. No database secondary mass coefficient, nominal board foot or loose volume is a density measurement. [usda-wood-handbook-2021 Ch.4 Table4-5.]"
  - id: electricity_units
    applies_to: "machining_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Meter kWh×3.6 gives MJ. Net calorific value is the verified database reference-property label for electricity, not evidence of workshop combustion. Match customer-side voltage, region/year, supply mix and background losses."
  - id: reference_background
    applies_to: "finished_member"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "The construction-lumber identity is broader than the qualified component, with no opposite route/material restriction. It does not define net versus nominal/packed volume, moisture or joint geometry. Before binding an actual quantity or supplier/background result, obtain their reference-volume definition and reconcile it with cp_reference using measured matched-state geometry/density and documented conversion. Unknown compatibility remains pending; no complete dataset or transfer of a generic lumber background is allowed."
