review_metadata:
  scientific_review: "pending independent scientific review; no publication or scientific approval"
  identity_boundary: "Factory-prepared unassembled single-piece solid coniferous beams and columns with drawing-specific connection machining and post-machining structural acceptance. Mere grade, straight planing, size or intended use does not create this category. Purchased kiln-dried stock only; no onsite heat, gluing, coating or washing."
  classification_assessment:
    status: "Bounded narrower scope; current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; no scientific approval"
    suggestion: "Historical author recommendation: narrower for unchanged factory-prepared single-piece non-engineered coniferous structural beams and building columns from purchased kiln-dried untreated unglued stock, with member-specific connection machining and post-machining structural acceptance; no scope retargeting or proxy."
    limitation: "Root/reviewer inference from the official CPC31625 wood-piece/building-material description in builders' joinery context, which states no horizontal-orientation or bending-only restriction. Root reread the official primary on 2026-11-02; this is not an issuer-specific ruling, new official crosswalk or whole-leaf coverage. Current association decisions follow the authoritative mapping and its acceptance.decision_ref ADRs; independent methodology review remains required. Preserve retained scaffold and legacy alias. Ordinary sawn stock uses applicable existing 31101/31102 PCR; continuous profiles use 31211 when its physical and route qualifiers match."
  reference_identity:
    uuid: "73ef1fef-6aa1-43b0-8721-c8f2f1385509"
    decision: "Broad construction-lumber identity includes solid sawn construction members and has no opposite manufacturing/material route; board dimensions are described as general examples, not exclusions. PCR restricts it to one-piece dry coniferous construction members with actual component drawing and acceptance evidence. Its CPC311 classification is identity context, not an accepted PCR31625 mapping."
    rejected: "b1d62179-d52c-44f8-86b6-52f9dc899d4f is roadside unprocessed roundwood; 7d571023-9d51-45d7-86d4-4cceefb3d06c is resin-bound engineered timber; ca253295-1699-4c83-9933-9467a136a4fc has conflicting fibreboard classification; no substitution."
  unresolved_flow_rows:
    - row_id: "pp_strap"
      selected_flow: "Polypropylene packaging strap"
      reason: "No finished PP strap confirmed; resin/chips, textile twine, woven bag and electrical cable tie candidates rejected."
    - row_id: "wood_spacer"
      selected_flow: "Untreated solid-wood dispatch spacer"
      reason: "Other wooden packaging material is a collection category; no specific individual solid-wood dispatch-spacer identity confirmed. Pallets, crates and green stock do not establish a finished spacer."
    - row_id: "sawdust_sale"
      selected_flow: "Untreated coniferous machining sawdust sold as co-product"
      reason: "Product sawdust searches returned manufactured board or mixed biomass, not untreated loose machining sawdust product."
    - row_id: "shavings_sale"
      selected_flow: "Untreated coniferous planer shavings sold as co-product"
      reason: "Wood Chip volume identity does not establish separate loose planer shavings; board, veneer and mixed biomass candidates rejected."
    - row_id: "film_waste"
      selected_flow: "Discarded polyethylene packaging film at factory"
      reason: "Waste polyethylene 7e78f0a8-c042-47ca-a742-3bac92be1477 fixes cleaned waste at recycling plant; not as-generated factory film waste."
    - row_id: "strap_waste"
      selected_flow: "Discarded polypropylene packaging strap at factory"
      reason: "PP waste 88215d1b-e6b6-4ec7-af7f-83375e80637b fixes mechanical recycling route; generated strap destination/state not established."
  source_classification_clarification_debt:
    - "offcut_waste acc22294-8e77-4784-988f-2499be3c60eb: CPC39282 agglomerated-waste classification contradicts concordant bilingual woodworking-offcut names/comment and empty treatment route. Retain conditional non-agglomerated untreated/unglued solid-wood identity; actual material, receiver and provider/background compatibility remain required. Source classification needs clarification; database metadata is not fully verified."
    - "pe_film e64eb06c-6dc9-45f1-b003-3dc6c44b27e2: CPC29220 luggage classification contradicts concordant polyethylene-film names, CAS9002-88-4 and material comment. Retain conditional physical identity with actual formulation and provider/background compatibility; source classification needs clarification and database metadata is not fully verified."
  unresolved_quantity_background_bases:
    - "offcut_waste: actual non-agglomerated untreated/unglued wood state, coarse residue specification, contamination/moisture, receiver and provider/background compatibility must match; source-classification debt does not permit conflicting physical material or treatment."
    - "machining_oil: petroleum formulation, supplier gate/background and raw calorific qualifier need actual compatibility evidence; 40.5 MJ/kg is identity metadata only, never a site amount or assumed conversion factor. Fresh additions and operating/waste oil are separate mass ledgers."
    - "dust_waste: captured untreated wood composition, contamination/moisture and actual combustion/recovery receiver must match the selected waste identity; landfill or contrary treatment requires another identity. Captured, emitted and saleable masses are mutually exclusive."
    - "Construction-lumber reference Volume/m3 does not itself define net solid, envelope, nominal or packed volume. cp_reference measures actual net wood volume; provider/background basis needs documentary reconciliation before complete linkage. Identity acceptance is separate from dataset completeness."
    - "Packaging formulation/species/route and electricity region/year must match actual supplier background; no database meanValue is a site density or recipe."
  evidence_limits:
    - "No actual factory amounts, industry averages, default structural grades, density, moisture target, strength, yield, emission factors or service life supplied."
    - "CORRIM Northern softwood survey is only allocation/process context; its regional quantities do not become component-machining parameters. EPA PTE sawmill factors and in-building reductions are not applied to this workshop."
