    decision: "Broad manufactured natural-cork flow contains prepared plank subset without contrary species or heating-route restriction. Does not define moisture, grades, yields or upstream provider. Waste/granules excluded from reference denominator."
  unresolved_flow_rows:
    - row_id: "raw_cork"
      flow: "Unboiled Quercus suber cork bark planks"
      reason: "Unboiled Quercus suber bark flow not confirmed; generic Biomass has biogenic-carbon reference property, not delivered plank Mass."
    - row_id: "cork_trimming_waste"
      flow: "Unagglomerated natural cork edge-trimming waste for external waste treatment"
      reason: "Exact unagglomerated cork edge waste sent to waste treatment not confirmed; wood Offcut is not cork. Manufactured Product-flow waste cork does not establish this Waste-flow disposal exchange."
    - row_id: "rejected_cork_waste"
      flow: "Rejected Quercus suber cork planks for external waste treatment"
      reason: "Exact cork plank reject disposal exchange not confirmed; do not substitute waste dust or preserved wood."
    - row_id: "boiling_wastewater"
      flow: "Untreated natural cork boiling wastewater transferred to external treatment"
      reason: "Bounded Waste-flow searches and direct reads found manganese/silicon, secondary/tertiary treatment or untreated direct-to-water routes; none establishes untreated cork bath liquor transferred to treatment."
  identity_metadata_debts:
    - row_id: "pe_film"
      issue: "PE film names, CAS 9002-88-4 and comment agree; CPC29220 classification is erroneous. Physical identity conditionally retained; confirm supplier PE composition and background route."
    - row_id: "electricity"
      issue: "Record specifies Republic of Korea point-of-use supply from a soil-washing case, with unspecified technology, voltage and loss boundary. Confirm actual region/year, provider, voltage and delivery boundary; neither source case nor KR supply is a default cork-factory background."
    - row_id: "boiling_water"
      issue: "Record is a Hong Kong water-treatment-plant production mix, Volume/m3. Physical tap-water identity does not establish actual supply/distribution compatibility; confirm provider, quality, location/year and delivery boundary; no default secondary density."
    - row_id: "captured_cork_dust"
      issue: "Fresh bounded search and state100 direct read establish generic industrial collector Dust Waste/Mass/kg. Actual cork trimming composition, moisture, contamination, collection stage and receiver remain required; original rejected stopper/granulation dust identities remain rejected."
  quantitative_evidence_gaps:
