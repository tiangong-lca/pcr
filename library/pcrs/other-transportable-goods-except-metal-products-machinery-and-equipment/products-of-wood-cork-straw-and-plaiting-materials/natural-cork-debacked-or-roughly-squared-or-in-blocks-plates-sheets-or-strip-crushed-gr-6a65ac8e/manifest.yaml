  scope_conditions:
    - "Receives unboiled natural cork bark planks; no glue, chemical cleaning or surface coating."
    - "Electric receiving/heating/trimming/extraction/handling; ambient stabilization; no on-site combustion or purchased heat."
    - "Waste residues and boiling wastewater transferred to suitable external waste-treatment operators. Saleable material/fuel coproduct routes require a separately checked foreground profile; no waste relabelling."
