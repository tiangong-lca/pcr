    required_site_screen: "Resolve four applicable flow identities, backgrounds, disposal contracts, moisture/dry solids/water/carbon closure and size-resolved outdoor dust; add each observed lubricant, packaging waste or other exchange separately. Do not convert unknown amounts into zero."
