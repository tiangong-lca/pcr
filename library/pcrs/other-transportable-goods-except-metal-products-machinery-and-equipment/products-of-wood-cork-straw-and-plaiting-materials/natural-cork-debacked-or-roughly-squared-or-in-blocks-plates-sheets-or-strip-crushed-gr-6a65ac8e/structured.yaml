      rule: "Foreground ends at waste transfer; link actual downstream treatment burdens exactly once in the combined model. No untreated direct discharge is authorized. On-site treatment requires its own chemical/energy/sludge and species/compartment-resolved discharge inventory before application. Do not double-count transfer chemistry as direct emissions."
