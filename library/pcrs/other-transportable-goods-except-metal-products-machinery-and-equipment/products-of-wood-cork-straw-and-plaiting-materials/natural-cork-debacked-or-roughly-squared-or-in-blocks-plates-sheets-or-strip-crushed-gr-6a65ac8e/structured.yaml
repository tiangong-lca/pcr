      applies_to: "electric route"
      rule: "No on-site fuel, combustion or purchased steam in this profile. Do not import wood boiler/sawmill factors. Upstream forest carbon uptake stays upstream; product/waste carbon stocks are not a second negative CO2 input. Retain measured biogenic releases regardless of impact-method convention."
