measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh net accepted dispatch mass P with calibrated scales and packaging tare; all inventory rows use per 1 kg reference flow."
  - id: moisture_basis
    applies_to: "cork physical ledger"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For each lot measure m_wet and dry mass m_dry using a documented cork-appropriate constant-mass laboratory protocol. u_d=(m_wet−m_dry)/m_dry; w_w=(m_wet−m_dry)/m_wet. m_dry=m_wet/(1+u_d)=m_wet*(1−w_w). Do not equate leached organics with evaporation."
  - id: electric_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Record metered electrical energy; 1 kWh = 3.6 MJ. This energy-property token does not measure thermal efficiency. Require compatible supplying background, voltage and loss boundary."
  - id: water_volume
    applies_to: "boiling_water; boiling_wastewater"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Meter liquid volumes at recorded temperature. For water balance convert with measured liquid density; do not treat a secondary database property coefficient as measured density."
