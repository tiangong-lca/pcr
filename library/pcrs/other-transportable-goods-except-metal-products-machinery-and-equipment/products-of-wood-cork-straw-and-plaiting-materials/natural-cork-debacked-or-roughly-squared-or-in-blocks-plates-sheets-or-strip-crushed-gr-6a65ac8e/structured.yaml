allocation_rules:
  - rule_id: allocation_single_product
    applies_to: "preparation"
    rule: "This profile has one accepted product and no saleable coproducts. Assign measured preparation and required waste-treatment burdens to the accepted planks; product reference remains 1 kg. Document residue waste status with receiver and payment/acceptance records. Do not allocate to water content or discarded waste."
    source_ids:
      - jrc-cork-preparation-2016
  - rule_id: allocation_scope_change
    applies_to: "saleable side output or shared operation"
    rule: "Subdivision and causal stage metering come first. If trimmings, rejects, dust or heat are saleable coproducts, this single-product profile is insufficient: establish complete output identities, dry-matter/carbon balances and a reviewed allocation basis rather than imposing wood-board recipes or a universal mass/economic share. Preserve physical output and internal-transfer quantities; allocate environmental burdens only in a separate account. No automatic avoided-product credit."
    source_ids:
      - spanish-cork-manufacturing-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "preparation"
      flow_role: "net accepted product"
      record_type: "weighing and lot acceptance"
      raw_fields: "lot; grade; species; geometry; m_wet; m_dry; tare; accepted kg P; dispatch date"
      collection_method: "Calibrated net weighing, lot-stratified cork moisture sampling, laboratory constant-mass endpoint with recorded temperature/time and absence of degradation"
      unit: "kg"
      frequency: "each lot/dispatch"
      temporal_coverage: "Matched complete production/dispatch period; stock cohorts reconciled"
      site_scope: "Preparation plant; only eligible accepted planks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; tare; lot/moisture tests; acceptance slips"
    - protocol_id: cp_material
      process_id: "preparation"
      flow_role: "raw cork and stage ledger"
      record_type: "receipts, sampling and stock ledger"
      raw_fields: "origin; species; previous treatment; gross receipts; supplier returns; opening/closing stock; stage wet/dry masses"
      collection_method: "Weigh receipts, returns and stocks; sample moisture at receipt, post-boiling and dispatch; retain stage transfers"
      unit: "kg"
      frequency: "each lot and period stock close"
      temporal_coverage: "Same cohorts as cp_reference; storage time stated"
      site_scope: "Preparation plant and originating supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier traceability; calibrated weighing; sampling uncertainty"
    - protocol_id: cp_energy
      process_id: "preparation"
      flow_role: "electricity"
      record_type: "submeters and billing"
      raw_fields: "stage; start/end kWh; transformer boundary; idle consumption; grid region/year; voltage; provider"
      collection_method: "Read calibrated electricity meters; reconcile bills and shared equipment with recorded metering-based attribution; record water-heating energy separately"
      unit: "kWh; MJ"
      frequency: "each production campaign and billing period"
      temporal_coverage: "All preparation/storage/dispatch periods linked to product cohort"
      site_scope: "Site electric equipment; electricity at declared delivery boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; bills; stage-meter reconciliation; supplier background"
    - protocol_id: cp_water
      process_id: "preparation"
      flow_role: "fresh water, wastewater, vapour"
      record_type: "flow meters, bath logs and laboratory tests"
      raw_fields: "fresh m3; bath stock; recycle; purge m3; wastewater density/temperature; condensate; moisture; evaporation; pH; COD; sCOD; TOC; TN; TSS; total solids; dissolved/volatile non-water constituents; total phenols; receiver; condensate_destination; outward_condensate_water_mass; identified_outlet; included_in_wastewater_or_other_outflow; internal_recovery; condensate_closing_stock"
      collection_method: "Meter liquid intake/purge; weigh or measure moisture and condensate; flow-weighted samples at transfer; document methods and detection limits. Independently close dry-solids and water balances before assigning net vapour Trace condensate destination and the actual outlet owner; distinguish internal reuse and retained stock from separately outward water. Reconcile any outward condensate against wastewater/other water streams to prevent duplicate subtraction. Retained condensate is closing stock once; missing destination/overlap evidence remains unresolved."
      unit: "m3; kg; mg/L"
      frequency: "each bath purge/cohort; composite samples per campaign"
      temporal_coverage: "Same baths and lots as cp_reference; opening/closing tank stocks included"
      site_scope: "Preparation plant to external-treatment handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; bath cycles; analytical QA; laboratory results; receiver acceptance/provider suitability"
    - protocol_id: cp_packaging
      process_id: "preparation"
      flow_role: "PE film"
      record_type: "weighing and supplier records"
      raw_fields: "polymer; recycled content; batch kg; dispatch kg; discarded film; opening/closing stocks; loose/film dispatch"
      collection_method: "Weigh film and reconcile material issue/returns/waste; retain supplier film specification and actual packaging bill"
      unit: "kg"
      frequency: "each dispatch and period stock close"
      temporal_coverage: "Matched dispatch cohort"
      site_scope: "Plant gate dispatch only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Tare; supplier resin/film specification; discrepancy/waste records"
    - protocol_id: cp_waste
      process_id: "preparation"
      flow_role: "edge waste and rejected planks"
      record_type: "segregated weighing and waste receipts"
      raw_fields: "row; stage; wet mass; moisture; dry mass; defect; contamination; receiver; treatment; paid/sold status"
      collection_method: "Weigh each physically separate stream; document disposal contract and receipt. An actual sale triggers scope review; never infer waste from a database label"
      unit: "kg"
      frequency: "each removal/lot"
      temporal_coverage: "Matched cohort and bin stock changes"
      site_scope: "Plant to contracted external waste operator"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; moisture tests; waste transfer receipts; treatment background suitability"
    - protocol_id: cp_dust
      process_id: "preparation"
      flow_role: "captured dust and air size fractions"
      record_type: "filter weighing and emission measurements"
      raw_fields: "source; activity; control; outlet flow; concentration; runtime; PM2.5; PM10; total filterable PM; captured kg; filter stock; fugitive mass; limits"
      collection_method: "Weigh captured dust; sample representative outlets/fugitive sources with compatible particulate size cuts and flow/runtime. Occupational concentration alone cannot determine mass emitted to outdoor air"
      unit: "kg; mg/m3; m3; h"
      frequency: "each representative operating condition; period runtime"
      temporal_coverage: "Full matched cohort; operating/control changes included"
      site_scope: "Handling/trimming/extraction at plant; outdoor release only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Filter blanks; laboratory/flow QA; operating logs; size-cut definitions; control efficiency evidence"
    - protocol_id: cp_carbon
      process_id: "preparation"
      flow_role: "carbon stocks and conditional biogenic CO2"
      record_type: "material carbon assays and species-resolved gas measurement"
      raw_fields: "dry mass; dry-basis carbon fraction; wastewater organic carbon; CO2 flow/concentration; origin; time; stocks"
      collection_method: "Measure lot-specific carbon in cork, waste and aqueous organics; where release is demonstrated, use calibrated species-specific CO2 measurements and origin evidence. A missing carbon residual is investigated, not assigned to CO2"
      unit: "kg C; kg CO2"
      frequency: "representative lots/conditions and period stocks"
      temporal_coverage: "Same cohort as reference; forest uptake background disclosed"
      site_scope: "Factory materials, wastes and ambient gas release; no on-site combustion"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Carbon assays; gas calibration; origin proof; water/solid/gas carbon closure"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Let P be measured accepted dispatch kg for the matched lot cohort. Original physical exchange per kg = cohort exchange total / P. Reconcile opening/closing material and bath stocks before dividing. Preserve stage handoffs and the terminal 1 kg, with no allocation multiplier."
      inputs:
        - cp_reference
        - cp_material
        - cp_energy
        - cp_water
        - cp_packaging
        - cp_waste
        - cp_dust
        - cp_carbon
      output: "Unallocated physical ledger per 1 kg reference flow"
      source_ids:
        - jrc-cork-preparation-2016
    - id: water_balance
      applies_to: "water_vapour"
      rule: "Net evaporated water = fresh water mass + incoming cork water + opening water stocks − dispatched product water − waste-bound water − transferred wastewater water − separately outward condensate water not already included in wastewater or another outflow − closing water stocks. Include precipitation/runoff only if the actual site has these exchanges, separately identified. For wastewater water mass, subtract measured non-water constituents from measured liquor mass; include dissolved and volatile organics. COD is oxygen demand, not solute mass. Dry-solids leaching enters a separate balance; do not assign total wet-mass loss to vapour. Subtract that condensate term only for an actually identified transfer across the declared control volume, disjoint from every other outward water term. Internal recovery/recirculation cancels as a paired internal transfer; retained condensate enters closing water stock once. Actual separate outward streams require individual inventory identification. Unknown destination/overlap remains unresolved, not a guessed outflow or zero."
      inputs:
        - cp_reference
        - cp_material
        - cp_water
        - cp_waste
      output: "Net vapour kg and reconciled dry-solids/water ledger"
      source_ids:
        - cork-boiling-wastewater-2022
    - id: dust_fractions
      applies_to: "pm25_air; pm_mid_air; pm_coarse_air"
      rule: "For identical filterable measurement/source/control/time bases, report PM2.5; PM2.5–PM10 = PM10 − PM2.5; PM>10 = total filterable PM − PM10. Require nonnegative values and matching aerosol basis. When only cumulative PM10 or total is known, collect the missing split; never fabricate fractions or sum nested totals. Concentration × compatible gas volume × unit conversion yields emitted mass; runtime must match sampling conditions."
      inputs:
        - cp_dust
      output: "Disjoint emitted fractions and separate captured dust"
      source_ids: []
    - id: carbon_balance
      applies_to: "biogenic_co2"
      rule: "Track measured dry-basis cork and solid-waste carbon, wastewater organic carbon and retained stocks separately. Convert demonstrably emitted carbon as CO2 to CO2 mass with 44/12; carbon loss alone does not establish species or origin. No default carbon fraction, complete oxidation or negative foreground forest uptake."
      inputs:
        - cp_material
        - cp_reference
        - cp_water
        - cp_waste
        - cp_carbon
      output: "Physical carbon ledger and independently measured conditional biogenic CO2"
      source_ids:
        - cork-boiling-wastewater-2022
  data_quality_requirements:
    - id: quality_identity
      applies_to: "each exchange"
      requirement: "Verify physical/chemical identity, route, reference property and units, exact localized names and ambient subcompartment. An applicable unresolved UUID or incompatible provider blocks complete data delivery."
      evidence: "Direct flow and property/unit records; actual supplier/treatment documents"
    - id: quality_amount
      applies_to: "all non-reference rows"
      requirement: "Collect matched site data and measured variability. Unknown is not zero; absent status requires operation/contract evidence. No borrowed nominal energy, density, moisture, reuse or concentration defaults."
      evidence: "Calibration, lot records, analytical uncertainty, presence screen"
    - id: quality_balances
      applies_to: "preparation"
      requirement: "Retain unallocated dry solids, water and carbon balances with measured uncertainty. Leached organics and dust remain explicit. Investigate unexplained residuals; do not force closure by invented emissions."
      evidence: "Reconciled physical ledger, lab QA and stock records"
    - id: quality_extension
      applies_to: "actual additional exchange"
      requirement: "Screen lubrication, broken packaging, consumables, condensate, yard runoff and unusual emissions; add each actual atomic exchange with physical identity and provider/measurement audit before final dataset delivery."
      evidence: "Site inspection, purchases, incident/maintenance and waste logs"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference and outputs"
    rule: "Require exactly one accepted prepared-plank reference output of 1 kg net dispatch mass, matching the functional-unit link and all qualifiers. Reject granule/waste inclusion in P or another internal output using the reference UUID."
    source_ids:
      - jrc-cork-preparation-2016
  - rule_id: validate_route
    applies_to: "all processes"
    rule: "Prove single-product electric water-only profile, actual waste destinations and absence of saleable coproducts; a conflicting chemical/thermal/manufacturing route requires method adaptation and fresh inventory check. Upstream datasets are mandatory for a combined model."
    source_ids:
      - spanish-cork-manufacturing-2022
  - rule_id: validate_environment
    applies_to: "wastewater, dust and carbon"
    rule: "Require untreated bath liquor transfer to compatible treatment, not direct receiving-water emissions. Check disjoint air-particle fractions and separate captured dust; matched water/dry-solids/carbon ledgers; retain conditional measured biogenic CO2. Identity success alone does not establish complete LCI or suitable background."
    source_ids:
      - cork-boiling-wastewater-2022
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Require per 1 kg reference flow in both languages and matched protocol aggregation. P must be actual accepted net dispatch kg; no mixture with raw input, stock, rejects or packing. Missing identity, amount, measurement split or provider is an explicit unresolved data-package finding."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground preparation process; completed linked model may be a secondary_dataset/background_dataset"
  downstream_use: "Further natural-cork manufacture using declared prepared-plank input state"
  allowed_use: "Actual matching water-only electric single-product route after identity, quantity and provider gaps are closed"
  excluded_use: "Whole CPC31921 default; granules, waste as reference, stoppers, agglomerates, forestry-only data; saleable coproduct routes without reviewed adaptation; product carbon-negativity or end-use-performance claims"
