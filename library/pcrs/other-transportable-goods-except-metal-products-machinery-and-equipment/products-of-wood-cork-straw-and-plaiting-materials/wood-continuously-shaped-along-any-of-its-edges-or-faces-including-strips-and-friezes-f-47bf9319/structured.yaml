allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "These rules govern burden attribution after the physical and stock accounts are closed. They do not change physical reference output, create credits or authorize a universal mass, revenue, machine-hour or floor-area allocation."
    source_ids: []
  - rule_id: allocation_physical
    applies_to: "all physical rows and transfers"
    rule: "Preserve unallocated native physical quantities V, complete wood/water/component stocks and full residue destination portions. Reconcile transfers before burdens. Product, waste, internal fuel, water and inventory changes are not multiplied by a burden share; terminal reference remains 1 kg."
    source_ids: []
  - rule_id: allocation_direct
    applies_to: "attributable activity"
    rule: "Avoid allocation through measured subdivision and direct cohort attribution. Include actual failed runs, rejects, idle/cleaning and rework assigned by their causal histories, not only successful pieces. Assign dedicated profile cutting and QA to the actual benefiting cohort; physical losses do not erase incurred activity. Tested shared-service drivers must reflect subtype-specific actual causes and reconcile all recipients and idle time; machine hours or output kg are not universal causes."
    source_ids: []
  - rule_id: allocation_residual
    applies_to: "inseparable joint function"
    rule: "If residual joint burdens remain, identify the actual joint operation, functions and real market/product use of each eligible coproduct at its split, distinguish waste/internal transfer, and substantiate a physical causal allocation method or a justified economic method using actual same-period quantity/value evidence and sensitivity. Declare eligible denominators, units, boundaries and shares; ensure the method is defined and shares conserve burdens. Missing, nonpositive or undefined denominators/prices/service totals require a method hold for the dependent allocation, not equal shares, discarded evidence, extrapolated prices or an avoided-production credit."
    source_ids: []
  - rule_id: allocation_stocks_services
    applies_to: "raw, WIP, held FG, returns and later service"
    rule: "Carry original lot/cohort burden vectors through opening/closing all states, including nonpurchase/returned/unused stock. Add actually performed services to the benefiting original cohort even when still held or shipped later; do not spread them only over current shipments or all current first acceptance. Returned/reinspected product retains its original Q identity. Keep cross-period service corrections/version disclosure separate from repeated output; H held-stock quantity is never a normalization denominator. Unknown historical burdens are an explicit coverage gap."
    source_ids: []
  - rule_id: allocation_provider_assets
    applies_to: "provider and capital services"
    rule: "Attribute compatible stock, energy, waste and asset services once; separate provider-covered from uncovered activity and internal transferred burdens. Actual cohort service demand/actual total justified asset service is usable only with compatible service units and substantiated attribution, complete recipient/downtime reconciliation and nonzero total. Missing life/service data cannot be replaced by a machine-weight/lifetime/hour default or a full-asset charge. Apply and disclose justified exclusions only under boundary_capital."
    source_ids: []
  - rule_id: allocation_rule_7
    applies_to: "foreground_burden_allocation"
    rule: "The rules are declared foreground accounting requirements implemented by cp_stocks, cp_pack, cp_assets and cp_attribution. Sources documenting operations do not establish a site's allocation causality or numerical shares."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "profile_mill"
      flow_role: "accepted_profile"
      record_type: "calibrated scale and acceptance register"
      raw_fields: "site; period; service cutoff; unique piece/cohort; actual manufacturer; species/mix/origin and claimed certificates; inlet and face grade; drawing/revision; dimensions; first-acceptance timestamp; net mass; tare; moisture; reject/rework/return links; opening and closing accepted FG"
      collection_method: "Weigh qualified net wood excluding packaging; link release to actual profile/specification/face QA and prior state; reconcile first-acceptance records with held FG and shipments without re-counting returned/reinspected pieces"
      unit: "kg"
      frequency: "every first acceptance and correction"
      temporal_coverage: "complete matched manufacturing period and explicit service cutoff"
      site_scope: "actual factory and one fixed product/species/grade/profile scope"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated weights, traceable sample method, QA records, unique-id reconciliation and uncertainty"
    - protocol_id: cp_stocks
      process_id: "profile_mill"
      flow_role: "wood_stock; every wood stock state"
      record_type: "lot movement and inherited-burden register"
      raw_fields: "raw/unused, WIP, accepted FG, rejected and returned states; opening/closing wet/dry mass and moisture; purchases/nonpurchase receipts; issues; unused returns; transfer IDs; supplier gates; species/grade; source harvest/sawing/kiln/freight; original cohort; provider inclusions; burden vectors and later service records"
      collection_method: "Reconcile calibrated movements and actual provider documents per lot/state, with equal stage handoffs; match delivered dry stock; separate actual past primary drying from profile activity; retain original burdens on returns and unused/opening stock"
      unit: "kg and original native burden units kept separately"
      frequency: "every movement and reporting cutoff"
      temporal_coverage: "full matched period plus prior-lot history and actual subsequent services to cutoff"
      site_scope: "all relevant storage and internal stage boundaries, receiving and delivery providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stocktake, weighbridge/scale/tare, invoices, kiln/state records, transfer matching, provider-boundary and burden lineage"
    - protocol_id: cp_energy
      process_id: "profile_mill"
      flow_role: "electricity; all actual powered stages/services"
      record_type: "calibrated meters and actual operating logs"
      raw_fields: "supply/provider/geography/voltage; generation/delivery/heat recovery coverage; meter hierarchy; start/end kWh; stages; actual equipment; idle/startup/shutdown/failed/cleanup/rework; packing/held-stock service recipients; causal drivers"
      collection_method: "Meter actual electrical demand and reconcile total supply/child meters and all served products; retain original cohort attribution and any independently evidenced unit conversion"
      unit: "kWh; converted MJ"
      frequency: "meter intervals and operations"
      temporal_coverage: "full production and performed-service coverage to declared cutoff"
      site_scope: "actual site and matched providers/served equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration, hierarchy, observed operation, service-demand and provider reconciliation; uncertainty"
    - protocol_id: cp_residues
      process_id: "profile_mill"
      flow_role: "offcuts_product; shavings_product; dust_product; offcuts_waste; shavings_waste; dust_waste"
      record_type: "weighed generation, stock and destination register"
      raw_fields: "source operation; material/state/moisture; generation; opening/closing held residues/rejected profiles; sale/internal fuel/manufacture/waste portions; recipient and function; contamination; shipment; rework links; original burden history"
      collection_method: "Separately weigh actual solid ends/rejects, shavings and captured dust; reconcile generation, stocks and each disjoint physical destination without inferring molecular emissions"
      unit: "kg; separate dry kg and water kg"
      frequency: "every lot/control-container transfer and cutoff"
      temporal_coverage: "complete failed and successful production/service pool"
      site_scope: "actual line, collectors, residue store and receiving provider"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated weighing, moisture sampling, recipient manifests/product function, stocktake and no duplicate destination"
    - protocol_id: cp_pack
      process_id: "profile_mill"
      flow_role: "box_in; box_out; box_waste; each extra actual component"
      record_type: "component-specific stock and service record"
      raw_fields: "component k; composition/unit mass; unused/WIP/held-FG/returned stocks opening and closing; P_k actual issue/attachment transfers; N_ext,k gross new external receipts; E_R,k external returned receipts; S_k gross shipments; E_O,k other external outputs including supplier returns; W_k external waste; original package/cohort/provider burdens; actual later packing/repacking service"
      collection_method: "Weigh this actual component and match physical attachments and all stock states; retain each original purchase/nonpurchase/return history. Keep internal P transfers equal between subledgers, external receipts/outputs gross, and customer/supplier returns explicit rather than fabricated net shipments"
      unit: "kg per individual component; service native units separate"
      frequency: "each issue, attachment, shipment, return and stocktake"
      temporal_coverage: "matched physical-control period and original cohort service cutoff, including opening/closing held goods"
      site_scope: "unused store, packing, FG store, dispatch/returns and actual component provider"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "component tare/specification, gross shipping/return records, stocktake, matched subledgers and provider/service coverage"
    - protocol_id: cp_air
      process_id: "profile_mill"
      flow_role: "wood_dust_air; each additional actual specific emission"
      record_type: "outlet and fugitive measurement"
      raw_fields: "source/outlet and indoor/outdoor fate; control device/condition; measured gas volume and dust concentration; sampling/filterable/condensable/size basis; moisture correction; detection limits; failures/cleanup; fugitive scope; overlap"
      collection_method: "Integrate actual compatible outlet sampling over operation and investigate fugitive paths; keep captured material separate; no exposure-limit factor or unsampled molecular/PM split; add actual species with independent identity/measurement only"
      unit: "kg emitted wood particulate"
      frequency: "representative actual operating/control states and events"
      temporal_coverage: "matched complete pool with sample representativeness disclosed"
      site_scope: "each actual outlet/receiving compartment and fugitive path"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling method, calibration/blanks, measured gas state/volume, detection and uncertainty, scope and non-overlap"
    - protocol_id: cp_geometry
      process_id: "profile_mill"
      flow_role: "wood physical audit"
      record_type: "dimensional scan and paired moisture specimens"
      raw_fields: "profile revision; actual net area/length; curves/rebates; volume state; paired wet and oven-dry mass; sampling and constant-mass method; species/grain/moisture; uncertainties"
      collection_method: "Verify actual net section rather than bounding rectangle; sample matching material moisture/density independently where conversion/audit is needed; retain primary measurements"
      unit: "m2; m; m3; kg; moisture fraction, separate fields"
      frequency: "each relevant profile/state and representative lot"
      temporal_coverage: "same material state as audited quantity"
      site_scope: "actual inlet/product/residue samples kept distinct"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "drawing/scan verification, instrument calibration, specimens and constant-mass record; uncertainty"
    - protocol_id: cp_assets
      process_id: "profile_mill"
      flow_role: "equipment/facility service coverage"
      record_type: "asset and service-provider register"
      raw_fields: "all saw/moulder/tool/control/handling/QA/packing/building assets and supporting utilities; mass/composition if actual provider requires; manufacture/install/repair/replacement/end-treatment scope; provider-covered/uncovered activity; total delivered service and actual cohort use with units; life/recipient/downtime records; exclusions"
      collection_method: "Inventory the full actual scope; obtain compatible service-provider or separated asset inventories and tested subtype-specific actual service drivers, reconcile all recipients; document justified significance/exclusion sensitivity instead of default weight/life/hours"
      unit: "actual declared service unit and original burden units separately"
      frequency: "asset/service change and reporting cutoff"
      temporal_coverage: "actual service period and justified total-service history"
      site_scope: "whole relevant facility with explicit covered/uncovered supplier scope"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "asset/provider documents, service totals, measured use, causality, exclusion/sensitivity and uncertainty; gaps retained"
    - protocol_id: cp_attribution
      process_id: "profile_mill"
      flow_role: "all physical and burden rows"
      record_type: "unnormalised physical/burden reconciliation"
      raw_fields: "V native physical totals; Q; all stock vectors; failed/zero-output events; dedicated/shared activity; actual joint functions/markets/recipient quantities/values; driver/units; denominator signs; shares; A; later services"
      collection_method: "Close physical totals first; subdivide causal actual operations; separately justify any residual allocation; carry stock/cohort/provider histories and performed later services; no allocation of physical quantities"
      unit: "individual native exchange units; Q kg"
      frequency: "complete accounting cycle and corrections"
      temporal_coverage: "matched original cohort, full period and declared services"
      site_scope: "actual joint operation, suppliers, recipients and stock states"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "traceable balances, causality/market evidence, complete recipient pool, nonzero method denominators, sensitivity and uncertainty"
  calculation_rules:
    - id: calc_unique_output
      applies_to: "accepted_profile"
      rule: "Q=sum(net first-accepted wood kg by unique identity), including accepted closing FG; opening accepted goods, WIP, repeats, dispatch and returns create no new Q. Correct the original cohort on mistaken acceptance; never silently net Q to shipments."
      inputs:
        - cp_acceptance
        - cp_stocks
      output: "positive cohort Q or retained zero-output case"
      source_ids: []
    - id: calc_physical
      applies_to: "all inventory rows"
      rule: "Collect gross native totals V_i and actual component/wood stock adjustments independently; physical card amount=V_i/Q after scope reconciliation. Terminal accepted_profile=1 kg. Keep shipment S, receipts and held states independent; neither burdens nor wood mass fabricate other physical exchanges. Q=0 retains unnormalised absolute activity and requires review, with no divided result."
      inputs:
        - cp_acceptance
        - cp_stocks
        - cp_residues
        - cp_pack
        - cp_energy
        - cp_air
      output: "physical native exchange per 1 kg reference flow"
      source_ids: []
    - id: calc_burden
      applies_to: "all inventory rows"
      rule: "Build A from actual attributable current activity plus inherited lot/stock/provider burdens and performed later services for the original cohort, after justified residual allocation. Publish A_i/Q once, with a separate unallocated physical V account. Never allocate first and again multiply normalised amounts, or use shipments/held H as denominator. Failed/idle/rework costs remain. Unknown causal method or nonpositive/undefined denominator holds the dependent allocated result."
      inputs:
        - cp_attribution
        - cp_acceptance
        - cp_assets
        - cp_stocks
        - cp_pack
      output: "attributable inventory in each original burden unit per 1 kg reference flow"
      source_ids: []
    - id: calc_wood_stock
      applies_to: "wood physical and burden histories"
      rule: "For each actual state/lot: opening+external receipts+internal in=closing+internal out+external products/wastes+actual losses. Match state/moisture on transfers; dry wood and water reconcile separately. For each burden vector: opening inherited+new provider burdens+internal inherited in+actual added services=closing carried+internal inherited out+outgoing carried burdens; reconcile internal terms once across the aggregate. Carry unused, WIP, FG, rejected and returned histories; unmeasured terms are gaps, not balance-plug emissions."
      inputs:
        - cp_stocks
        - cp_residues
        - cp_geometry
        - cp_attribution
      output: "closed native state accounts with inherited burden vectors"
      source_ids:
        - usda-wood-handbook-2021
    - id: calc_pack_stock
      applies_to: "box_in; box_out; box_waste"
      rule: "For each actual component k across ALL unused/WIP/held-FG/returned states: opening_k+N_ext,k+E_R,k=closing_k+S_k+E_O,k+W_k. P_k is actual internal issue/attachment transfer and cancels across matched subledgers, not a second external receipt/output. Separate generated/held waste and discarded external W. Retain full source/cohort burden vectors and actual packing/repacking services; nonpurchase and returned opening stock are not free. Add actual extra components and external interfaces individually. No net-Q copy, assumed return or fictional one-package ratio."
      inputs:
        - cp_pack
        - cp_stocks
        - cp_attribution
      output: "component physical reconciliation and separate attributable burdens"
      source_ids: []
    - id: calc_moisture_geometry
      applies_to: "wood physical ledger"
      rule: "Use u=(m_wet−m_od)/m_od and m_od=m_wet/(1+u) with actual paired samples. Only a measured compatible conversion permits m_u=rho_u×V_net; geometry, moisture and species states must match. No universal density, nominal volume, shrinkage factor or fixed acceptance moisture."
      inputs:
        - cp_geometry
        - cp_acceptance
        - cp_stocks
      output: "actual dry matter/water and optional solid-volume audit"
      source_ids:
        - usda-wood-handbook-2021
    - id: calc_energy_air
      applies_to: "electricity; wood_dust_air"
      rule: "Electrical MJ=actual kWh×3.6; keep raw meter/submeter/provider coverage. Emitted dust mass integrates compatible concentration×matching gas volume over actual operation with blank/state/unit corrections plus separately evidenced fugitives. Reject overlapping samples/nested size totals. Capture, workplace concentration and unidentified total organic compounds cannot supply molecular emission masses."
      inputs:
        - cp_energy
        - cp_air
      output: "energy and actual non-overlapping wood particulate mass"
      source_ids:
        - epa-woodworking-1976
    - id: calc_asset_service
      applies_to: "actual added asset interfaces"
      rule: "Attribute only actual compatible cohort demand against an evidenced total delivered asset service and tested causal service definition; reconcile recipients/downtime and provider coverage. Preserve native service units and original asset burdens before A/Q. If total service, compatible provider or justified exclusion is unavailable, hold that dependent completeness claim rather than invent a weight/lifetime/hour or charge the full asset."
      inputs:
        - cp_assets
        - cp_attribution
      output: "actual asset service contribution or explicit unresolved/excluded coverage"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "reference and every actual exchange"
      requirement: "Confirm concrete material/state, Product/Waste/Elementary role, actual supplier and native quantity support. Wood material's generic Mass binding requires every row-specific qualifier; its administrative owner is not the manufacturer. Other blank UUIDs remain specific unresolved identities, never guessed versions or defaults."
      evidence: "actual product/provider/native records; cp_acceptance; cp_stocks"
    - id: quality_pool
      applies_to: "production and later services"
      requirement: "Cover all shifts, failed/zero-output runs, startup/shutdown/idle/cleanup, rework, opening/closing all stocks, returns and actual services to the original cohort. Disclose coverage dates and prior history gaps; no selected-successful-batch average."
      evidence: "cp_attribution; cp_stocks; cp_pack"
    - id: quality_completeness
      applies_to: "actual whole route and support scope"
      requirement: "Screen all actual auxiliaries, packaging components, capital/facility services, utilities, emissions and waste media; instantiate each extra interface atomically before completeness. Quantify uncertainty/uncovered providers and explain justified exclusions; low mass or absent data is not an automatic cutoff."
      evidence: "cp_assets; cp_energy; cp_residues; cp_air; cp_pack"
    - id: quality_basis
      applies_to: "measurements and inference"
      requirement: "Retain calibration, sampling, detection limits and measured uncertainty. Classify source-supported qualitative route separately from collected quantities; no invented numerical guardrail or universal allocation/density. Historical sources do not establish current legal/certification conformity or a specific observed factory route."
      evidence: "cp_geometry; all original protocols and source scope"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Validation requires the complete scope and accounting conditions above. A finite declaration check is not a factory inventory, scientific approval, formal translation review or completeness of all future dataset records."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "applicability and reference"
    rule: "Verify actual solid American red-oak species/mix/origin, grades, continuous drawing/profile, uncoated unglued unassembled state, kiln-stock inlet and first-release moisture/net mass. Excluded material/construction or missing evidence blocks the dependent dataset applicability; no manufacturer SKU/title/UUID substitutes for facts."
    source_ids:
      - un-cpc3-notes
      - ahec-species-guide
      - rack-red-oak-baseboard
  - rule_id: validate_reference
    applies_to: "all row quantities"
    rule: "Exactly one accepted_profile reference product output is 1 kg; input wood may share its broad UUID with an explicitly different state. Same complete cohort Q links every normalization in both languages; held closing accepted wood counts once, opening accepted wood/dispatch/return/reinspection does not create Q. Zero Q stays unnormalised."
    source_ids: []
  - rule_id: validate_physical
    applies_to: "material, dust and package balances"
    rule: "Retain actual dry wood/water, all stock-state and component P/N_ext/E_R/S/E_O/W accounts, actual extra interfaces and matched internal links. Do not equate purchased quantity, gross shipments, net first acceptance, captured dust and escaping emissions. Reconcile measured uncertainty; no fabricated returns, correction emission or molecular split closes unknowns."
    source_ids:
      - usda-wood-handbook-2021
      - epa-woodworking-1976
  - rule_id: validate_attribution
    applies_to: "burden accounts"
    rule: "Verify original lot/cohort/provider histories, carried raw/unused/WIP/FG/return vectors and later performed services even on held/nonpurchase stocks. A/Q is applied once; H and shipments are not denominators. Test actual shared drivers and residual joint function/market evidence, compatible native units and positive defined denominators; unresolved allocation/asset service retains a hold on dependent results. Physical quantities remain unallocated."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "dataset release"
    rule: "Check actual equipment/facility capital scope, provider-covered/uncovered inventory, utility supply, every specific auxiliary/waste/emission and disjoint residue fate. Require actual support or justified declared exclusion with sensitivity; unknown identity/provider/measurement/history is explicit incomplete coverage, never zero or approved. Keep biogenic content and inherited forestry/combustion accounting once; no default storage/substitution/avoided-waste credit."
    source_ids:
      - baird-residue-use-2020
      - usda-wood-handbook-2021
published_dataset_profile:
  dataset_role: "Site-specific profile-manufacturing inventory with explicit stock, provider and actual later-service coverage"
  downstream_use: "secondary_dataset; background_dataset after actual dataset completion and independent review"
  allowed_use: "Matching red-oak uncoated solid baseboard route and declared first-acceptance/actual-service scope, with all qualifiers and compatible upstream links"
  excluded_use: "Entire CPC leaf; observed SPL293/factory claim; log-forming or primary drying dataset; structural/installed-service equivalence; glued/coated/assembled substitutes; certified EPD or universal parameter/credit"
  required_metadata: "PCR identity and source hashes; actual site/manufacturer/period/service cutoff; all reference qualifiers; Q and separate V/A ledgers; stock/return/provider/capital histories; control, power, component packing, causal allocation and actual extra interfaces"
  required_quality_disclosure: "Candidate scientific/formal-translation review status; measured/calculated/unknown scope, identity/provider/history gaps, detection/uncertainty, justified exclusions, capital service coverage, attribution holds and source applicability limits"
  update_trigger: "Species/origin/grade/profile/construction, kiln-supply or utility boundary, equipment/control/capital service, packing/return/stock/service cutoff, allocation/measurements, supplier evidence or native identity changes"
