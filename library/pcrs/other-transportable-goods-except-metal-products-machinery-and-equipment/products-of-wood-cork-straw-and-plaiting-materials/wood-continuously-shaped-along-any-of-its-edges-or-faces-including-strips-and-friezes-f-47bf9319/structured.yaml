system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The rules in this complete section apply together with the scope, reference qualifiers and stock/service accounting below. A single flat rule does not waive its surrounding conditions."
      source_ids: []
    - rule_id: boundary_route
      applies_to: "profile manufacture"
      rule: "Include actual receiving/handling, rip/defect crosscutting, continuous moulding, trimming, dust collection/conveyance/cleaning and QA; sanding only when recorded. Record first quality acceptance separately from dispatch. Qualitative manufacturer observations justify the process family, not an exact factory sequence or recipe."
      source_ids:
        - ahc-moulding-catalogue
        - baird-manufacturing-2022
        - baird-ordering-2019
    - rule_id: boundary_supply_once
      applies_to: "wood and utility providers"
      rule: "Preserve forestry, harvest, sawing, primary drying, inbound freight, stock grade and moisture histories once. If the dry-stock handoff is internal to an integrated mill, link a separately measured compatible upstream unit instead of also charging purchased dry-lumber production. A supplier inventory containing profiling cannot be used unchanged as sawn-stock input. Record each provider's included/excluded stages and allocation; no duplication of primary drying as foreground conditioning."
      source_ids:
        - baird-manufacturing-2022
        - usda-wood-handbook-2021
    - rule_id: boundary_services
      applies_to: "utilities and support work"
      rule: "Include actual attributable power for cutting/moulding, extraction, handling, QA, idle/startup/shutdown, cleaning and performed packing/storage/rework, including failed attempts. Separate generation from delivery and actual heat recovery; provider-covered combustion is not repeated as direct mill emissions. No boiler, fuel, thermal conditioning, compressed air, lubricant, abrasive or package chemistry is presumed. Every actually present extra material/service/waste/emission requires an additional concrete atomic interface and provider/basis review before dataset completeness."
      source_ids:
        - baird-manufacturing-2022
        - baird-residue-use-2020
    - rule_id: boundary_capital
      applies_to: "full equipment and facility scope"
      rule: "Inventory actual saws, moulder/knives, capture/duct/filter/fan system, handling/QA/packing equipment, workshop/building and supporting utilities; include capital manufacture, installation/replacement, maintenance and end treatment once through compatible provider services or explicit separated inventories. For each asset record total service capacity/useful delivered service, actual cohort demand, commissioning/replacement history and relevant actual service unit. Reconcile all served products and downtime with tested causal drivers. Do not charge a full asset to one cohort or substitute a universal machine weight, lifetime or hours. Any declared exclusion requires an explicit scope, evidence-based significance/uncertainty and sensitivity justification; unknown total service/provider coverage remains an open dataset gap, not zero."
      source_ids: []
    - rule_id: boundary_residue
      applies_to: "wood and control outlets"
      rule: "Separate solid ends/defect pieces, moulder shavings, captured saw/sanding dust and actual escaping wood particulate by source, moisture and destination. Capture does not equal destruction. Reuse in other products, fuel transfer, sale, storage and waste are disjoint. Dust-capture practice supports collection requirements, not proof a named plant uses one device or an emission factor. Do not derive molecular emissions, fixed removal efficiency or particle-size splits from total dust. Add actual other pollutants/media separately on specific evidence."
      source_ids:
        - baird-residue-use-2020
        - epa-woodworking-1976
    - rule_id: boundary_gate
      applies_to: "acceptance, stock and later services"
      rule: "Preserve raw/unused lumber, WIP, unused package, accepted held FG, rejected and returned stocks and their inherited burden vectors across cutoffs. Include actual performed services for the benefiting original cohort even if goods remain held, came from opening/nonpurchase stocks, or are not shipped. Later dispatch/reinspection/customer return/repacking creates no new Q. Installation, use, replacement and end-of-life of the baseboard require separate scenarios and are excluded; no avoided-production/waste or carbon-storage credit."
      source_ids:
        - baird-ordering-2019
        - usda-wood-handbook-2021
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "Capital and stock/service rollforwards are explicit methodological collection requirements in cp_assets and cp_stocks, not measurements inferred from the cited manufacturer sources. Different legal/certification requirements are not established by this method."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Received kiln-dried solid American red-oak sawn lumber; actual species/mix, grade, moisture, supplier gate and previous processing declared"
