measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is sum of measured net wood masses of unique first accepted pieces in the matched production cohort, including accepted closing finished stock. Exclude packaging, rejected/WIP wood and opening already-accepted stock; cp_acceptance records corrections without a second acceptance. Every inventory amount uses per 1 kg reference flow."
  - id: moisture_state
    applies_to: "wood physical ledger"
    required_property_ref:
      name: "Measured wet and oven-dry mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use paired representative specimens; u=(m_wet−m_od)/m_od is dry-basis fraction and m_od=m_wet/(1+u). Convert percentage readings to fractions explicitly. Record method, sampling, constant mass, gradients and uncertainty per state. Kiln-dried is a documented operation, not a fixed moisture percentage."
  - id: profile_geometry
    applies_to: "optional physical audit or conversion"
    required_property_ref:
      name: "Actual net solid volume and matched mass"
      uuid: ""
    required_unit: "m3; kg"
    rule: "Independently measure actual shaped area and length, or varying-section integration, with drawing/revision verification. V_net=sum(actual net section × actual length). If conversion is needed use paired measured density at the same species/moisture state. Bounding rectangles, nominal lumber/board feet, rounded sales lengths, bulk volume and literature density are not a bridge. Keep net wet mass, dry matter and volume separate."
  - id: energy_quantity
    applies_to: "actual electricity"
    required_property_ref:
      name: "Electrical energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve raw metered kWh and supply point; convert kWh to MJ using 3.6 only after confirming electrical-energy quantity. Reconcile child/parent meters, generator delivery and included shared extraction/packing/idle services once. No grid, voltage, fuel or calorific basis is inferred from a common energy unit."
