allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Maintain unallocated whole-mass/element ledgers and separate reaction-aware component ledgers under wood_water_carbon before burden allocation. Internal bark, untreated fines, resin-bearing trims and sanding dust have separate transfer records with source/destination, moisture, composition and equal handoff quantities at both ends. Internal reuse cancels at the aggregate plant boundary but remains visible in stage balances. Sold co-products, internal fuels and externally discarded wastes are mutually exclusive destinations for each portion. Never multiply physical co-product output or an internal link by an allocation fraction. [corrim-osb-us-2025]"
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "Assign directly attributable resin, pressing, grade/finishing and packaging burdens to OSB. Subdivide joint stages before allocating residual shared burdens to marketed outputs; document a physically justified dry-material basis and test an economic alternative when the physical relationship is inadequate. The separate burden account may use a_j = d_j / sum(d_k), where d_j is measured eligible exported dry material of each joint output under one declared basis. Finished board dry solids include binder/wax and must not be called dry wood; disclose whether the causal allocation basis uses measured wood fraction or total dry solids. Internal fuel is not a marketed output in this export denominator: trace its processing and combustion to the heat consumer; shared exported energy requires a separate causal allocation. No automatic substitution credit. [corrim-osb-us-2025]"
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "p_osb"
      flow_role: "finished OSB denominator"
      record_type: "collected_record"
      raw_fields: "batch grade, accepted/rejected count, net wet mass, packaging mass, dimensions, actual density, moisture basis and test, H2O specificity/non-water loss and cure during testing"
      collection_method: "Calibrated dispatch weighing excluding packaging; lot sampling for moisture and actual thickness/volume/density; document a water-specific method or evidenced correction for non-water losses and continuing cure in resin-bearing samples. Reconcile production, stocks, grade test and dispatch. Sum net accepted finished mass; denominator for every per 1 kg reference flow quantity"
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_material
      process_id: "p_osb"
      flow_role: "each wood raw input"
      record_type: "collected_record"
      raw_fields: "lot/species, gate, bark status, wet/dry mass, moisture, strand dimensions, supplier steps, start/end stocks"
      collection_method: "Weigh receipts and stocks; representative oven-dry sampling and strand geometry checks; distinguish raw logs, green strands and dry screened strands; verify supplier evidence. Receipts + opening stock - closing stock, adjusted for returns; divide actual consumed mass by net accepted finished OSB mass"
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_recipe
      process_id: "p_osb"
      flow_role: "each resin/wax/coating by layer"
      record_type: "collected_record"
      raw_fields: "commercial formulation, resin chemistry and residual reactive groups, solids method, carrier water, free monomer, face/core layer ID, dosing mass, layup orientation, cure settings and evidenced extent/pathways, retained cured composition, reaction H2O formation/consumption and CO2, uncertainty"
      collection_method: "Calibrated dosing/load-cell and supplier certificate reconciliation by layer; separate PF, pMDI, wax and carrier water. Use actual supplied formulation and representative cure/composition evidence to quantify only onsite reaction extent, including PF condensation water and pMDI water consumption/CO2 formation; distinguish other evidenced cure pathways, retained binder and unreacted material. No assumed full cure, sample recipe or universal yield; unknown extent remains unresolved. Count formulation and its constituent breakdown once, without repeating upstream resin manufacture. Sum measured consumption separately for each material and layer; divide by net accepted finished OSB mass. Record each actual complete resin/wax/coating supply once in its verified wet/dry provider basis; retain PF/pMDI/wax/active/carrier/additive analytical subledgers without extra purchases. Require supplier formulation preparation/delivery once; real independently purchased additions and onsite mixing/utilities stay separate. Preserve raw stock/loss/internal-transfer ledgers."
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_energy
      process_id: "p_osb"
      flow_role: "electricity, purchased heat, internal heat"
      record_type: "collected_record"
      raw_fields: "meter/stage, supply voltage/mix, kWh, steam mass/pressure/temperature, condensate return, reference enthalpy, useful heat, recovery routing"
      collection_method: "Calibrated stage meters; steam supply-return enthalpy balance and thermal-oil/hot-water circuit measurements; separate boiler, dryer, press and RTO ownership. Sum attributable external energy once by carrier; divide by net accepted finished OSB mass; internal heat stays in stage ledger"
      unit: "MJ"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_fuel
      process_id: "p_osb"
      flow_role: "each mass-based fuel by combustor; natural gas uses cp_gas"
      record_type: "collected_record"
      raw_fields: "fuel identity/route, receipts/stocks, wet mass, dry moisture, measured LHV, ash, actual elemental/species composition, carbon origin, boiler/dryer/RTO or mobile equipment ID, actual oxidation extent and products, combustion air/oxygen and inlet humidity, uncertainty"
      collection_method: "Calibrated fuel meters/weighing and stock balance with fuel analysis and source-specific combustion/exhaust evidence; retain air/oxygen/humidity and unburned gas/ash composition for mass/element and component balances. Separate internal untreated bark/fines from resin-bearing trim fuel; fossil binder carbon remains fossil. Do not assume full oxidation or universal combustion water/CO2 yields. Sum each externally consumed fuel separately by stage; divide by net accepted finished OSB mass; equal internal handoffs retained outside external totals"
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_water
      process_id: "p_osb"
      flow_role: "tap water and each water circuit"
      record_type: "collected_record"
      raw_fields: "source, makeup/return meter, opening/closing H2O stock, cooling, abatement, wet wood and formulation carrier H2O, fuel moisture, inlet/outlet gas humidity, retained product/residue H2O, evaporation/condensate/discharge, reaction formation and consumption by stage, water density, uncertainty"
      collection_method: "Meter fresh supplied water and actual density; record circulation separately. Reconcile molecular H2O using opening stock + inputs + evidenced formation = closing stock + outputs + evidenced consumption, including PF condensation, pMDI water reaction and actual dryer/boiler/RTO or mobile combustion as applicable. Distinguish carrier/wood/fuel moisture and incoming air humidity from reaction-generated water; phase change is a transfer, not formation/consumption. Pair steam, condensate and wet-abatement endpoints; do not infer exhaust solely from moisture removal. Use source-specific composition/extent or measurements and retain unresolved terms/uncertainty, without default yields. Sum new externally supplied water once; divide by net accepted finished OSB mass; no repeated circulation"
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_packaging
      process_id: "p_osb"
      flow_role: "each packaging material"
      record_type: "collected_record"
      raw_fields: "material/route, stock, tare mass, packs dispatched, reuse/returns and replacements"
      collection_method: "Weigh actual consumed individual material, reconcile dispatch and replacements; keep separate from net board mass. Sum consumed dispatch material separately by identity; divide by net accepted finished OSB mass"
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_residue
      process_id: "p_osb"
      flow_role: "each co-product, waste and internal transfer"
      record_type: "collected_record"
      raw_fields: "stream, source/destination stage, chemistry/resin and cured state, H2O/dry mass and test method, elemental/species composition, sales/treatment route, opening/closing stock, same handoff ID and state, uncertainty"
      collection_method: "Separate calibrated weighing and moisture/chemistry testing; distinguish retained reacted binder from supplied dry resin and non-water test losses. Internal links use equal quantities, composition and state at both ends; reconcile whole mass/elements and reaction-aware components before allocating burdens. Sum actual external exits by atomic stream; divide by net accepted finished OSB mass; internal transfers excluded from plant external totals"
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_emission
      process_id: "p_osb"
      flow_role: "each species/size fraction and stack"
      record_type: "collected_record"
      raw_fields: "stage/stack/control and paired inlet/outlet, measured species/CAS, carbon origin including pMDI cure CO2, concentration, dry/wet gas basis, actual gas flow/time, inlet humidity and combustion air/oxygen, reaction/fuel composition and extent, PM method/filterable/condensable definition, detection limits and uncertainty"
      collection_method: "Post-control stack tests/CEMS or documented site-equipment-specific calculation using actual formulation/fuel composition and reaction/oxidation extent; include mobile equipment separately. For H2O/CO2 distinguish incoming moisture/background gas, cure products and combustion products; retain gross inlet/outlet quantities in the balance ledger and disclose how the actual net release is determined on a consistent basis. Do not add calculated formation again to a measured total that already includes it. Record missing versus zero, shared stack once, emission speciation and disjoint PM. Sum actual post-control emission mass separately by species/origin or disjoint size fraction; divide by net accepted finished OSB mass"
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_gas
      process_id: "p_osb"
      flow_role: "gaseous natural gas by combustor"
      record_type: "collected_record"
      raw_fields: "meter/stage; actual m3; absolute P in Pa; T in K; dry/wet basis; water mole fraction; composition; Z; supply volume definition; supplier background m3 state; calibration"
      collection_method: "Calibrated gas meter and supplier billing/state records; collect matched pressure, temperature, water, composition and Z. Keep direct dryer, boiler/heater and RTO subtotals. Record quantity on its actual measured state first, then apply gas_volume_state only when both volume definitions are known. Sum consumed volume by stage in the same defined state and divide by net accepted finished OSB mass. Unknown basis leaves background linkage unresolved; no database secondary mass coefficient as density."
      unit: "m3"
      frequency: "continuous metering with monthly reconciliation"
      temporal_coverage: "same representative period as cp_reference"
      site_scope: "same site and gas supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, gas analysis, supplier volume-basis declaration and exact background-unit correspondence"
  calculation_rules:
    - id: gas_volume_state
      applies_to: "in_gas"
      rule: "For the same gas amount, V_supplier = V_meter × (P_meter/P_supplier) × (T_supplier/T_meter) × (Z_supplier/Z_meter) × f_water; P is absolute Pa, T is K and Z is composition-specific compressibility. When converting wet meter volume to dry supplier volume, f_water = 1 - measured water mole fraction; f_water = 1 only if both definitions have the same moisture basis. This relationship requires consistent composition, no gas loss and documented meter/supplier state. Do not assume standard conditions, dry gas or Z=1. Unknown state/composition or an incompatible supplier definition leaves the background link unresolved. Divide the verified matched-state period volume by cp_reference net accepted OSB mass."
      inputs:
        - cp_gas
        - cp_reference
        - "supplier state definition"
      output: "supplier-matched m3 per 1 kg reference flow"
      source_ids:
        - oiml-gas-volume-2007
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "For each atomic exchange, divide the attributable period total by net accepted finished OSB mass in the same period; finished_osb = 1 kg. Aggregate sites by summed amounts / summed reference masses only for comparable grades/routes and disclosed weighting."
      inputs:
        - cp_reference
        - "linked collection protocol"
      output: "amount per 1 kg reference flow"
      source_ids:
        - corrim-osb-us-2025
    - id: volume_density
      applies_to: "reference product"
      rule: "Actual volume = sum(accepted panel length × width × thickness); actual wet density = corresponding net wet mass / actual volume. Convert area declarations using actual thickness and matched density/moisture, never nominal density or survey defaults."
      inputs:
        - cp_reference
      output: "Matched product volume/density and mass conversion"
      source_ids:
        - usda-wood-handbook-2021
    - id: wood_water_carbon
      applies_to: "p_osb stage ledger"
      rule: "For each declared stage and the aggregate plant boundary, reconcile unallocated whole-stream mass and elemental C/H/O: opening stock + inputs = closing stock + outputs, including actual fuel, combustion air/oxygen, incoming gas humidity, exhaust, wet residues and steam/condensate crossings. Use actual composition and compatible state; convert gas volume to mass only with evidenced state/composition. Internal transfers cancel only with matched endpoints. Do not count stocks again in stock-adjusted consumption. Separately, for each molecular species/reactive component use opening stock + inputs + evidenced formation = closing stock + outputs + evidenced consumption. Molecular H2O and dry resin/wood are not conserved through PF condensation, pMDI water-consuming CO2-producing cure or combustion/oxidation. Quantify actual onsite extent/pathways and retained composition, not full cure or generic yields; do not repeat upstream prepolymer condensation. Track biogenic wood versus fossil resin/fuel carbon, including pMDI-derived CO2 and unburned carbon. Keep uncertainty and unresolved terms explicit; never adjust logs, invent reaction amounts or omit biogenic CO2 to force closure. Formation/consumption terms are internal balance terms, not extra external exchanges; measured outputs already containing them are counted once."
      inputs:
        - cp_material
        - cp_recipe
        - cp_reference
        - cp_residue
        - cp_fuel
        - cp_gas
        - cp_water
        - cp_energy
        - cp_emission
      output: "Unallocated whole-mass/element ledgers and reaction-aware component ledgers, with uncertainty and unresolved terms"
      source_ids:
        - usda-wood-handbook-2021
        - corrim-osb-us-2025
        - epa-osb-2002
        - epa-wood-boiler-2022
        - frihart-joining-2023
    - id: pm_partition
      applies_to: "air_pm25, air_pmcoarse, air_pmover10"
      rule: "For one compatible post-control sampling method, disjoint PM2.5–10 = cumulative PM10 - cumulative PM2.5; PM>10 = compatible total PM - cumulative PM10. Use only nonnegative supported differences; otherwise keep missing fractions unresolved. Do not sum PM10 with its PM2.5 subset or add condensable PM twice."
      inputs:
        - cp_emission
      output: "Disjoint outdoor-air fractions"
      source_ids:
        - epa-osb-2002
        - epa-wood-boiler-2022
  data_quality_requirements:
    - id: dq_scope
      applies_to: "p_osb"
      requirement: "Verify actual long-strand architecture and layer-specific recipe, receipt gate and grade. Do not generalize regional species or survey recipes to this product."
      evidence: "usda-wood-handbook-2021; corrim-osb-us-2025; epa-osb-2002"
    - id: dq_data
      applies_to: "all inventory rows"
      requirement: "Retain meter/test calibration, representative periods, stocks and missing-versus-zero treatment. Preserve source-specific formulation, reaction/oxidation extent, composition and method uncertainty for wood_water_carbon; unknown terms prevent a complete balance claim and are not inferred as zero or full conversion. A conditional absent flow requires evidence of absence; missing measurement is not zero."
      evidence: "collection protocols"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Exact physical/chemical flow, route, property and unit. Unresolved identities cannot be substituted by neighbouring products, mixed packaging, correction flows, generic VOC totals or mismatched medium."
      evidence: "flow identity and supplier records"
validation_rules:
  - rule_id: v_reference
    applies_to: "finished_osb"
    rule: "Exactly one finished reference output; net mass excludes packaging; all qualifiers and the actual layer architecture/grade must be provided."
    source_ids:
      - corrim-osb-us-2025
  - rule_id: v_basis
    applies_to: "all inventory rows"
    rule: "Reference amount, normalization basis and collection denominator agree in both languages. Before burden allocation verify whole-mass and elemental C/H/O conservation, energy reconciliation and separate reaction-aware H2O/reactive-component ledgers under wood_water_carbon. Require actual formulation, cure/oxidation extent, air/oxygen/humidity, retained product/residue and exhaust composition with uncertainty, including PF-generated H2O, pMDI-consumed H2O/fossil CO2 and actual combustion products. Reject external-only H2O/dry-resin closure, assumed full cure/oxidation, default yields, altered measurements, duplicated reaction products or internal transfers. Unknown formation/consumption or unmatched stage endpoints leave balance completeness unresolved; report residuals against evidenced uncertainty, not a fabricated balancing amount."
    source_ids:
      - usda-wood-handbook-2021
      - epa-osb-2002
      - epa-wood-boiler-2022
      - frihart-joining-2023
  - rule_id: v_emissions
    applies_to: "p_osb"
    rule: "Include biogenic CO2 and fossil binder/fuel carbon separately. Verify each emission species and medium; never replace sulfur dioxide with sulfur oxides, propanal with propanol, or MDI monomer with polymeric resin. Speciate remaining identified organics as additional atomic rows; a VOC total is a closure diagnostic, not added to its species."
    source_ids:
      - epa-osb-2002
      - corrim-osb-us-2025
  - rule_id: v_scope_extension
    applies_to: "p_osb"
    rule: "Add each actual unlisted fuel, chemical, refrigerant, packaging component, wastewater outlet pollutant or exported heat as a separate exact exchange with a collection protocol. Different binder/treatment/overlay variants require applicability review. No unexamined cut-off based on small mass."
    source_ids:
      - epa-osb-2002
  - rule_id: v_case_limits
    applies_to: "p_osb"
    rule: "CORRIM is a 23-facility US 2022/2023 survey (report submitted 2025-03-21, edited 2025-07-22). Its numeric density, moisture, fuel mix, adhesive rates, yields and allocation percentages are not defaults. Resolve its repeated PM labels and conflicting by-product percentage/species labels against primary records before numerical use."
    source_ids:
      - corrim-osb-us-2025
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Matching OSB material supply with declared grade, recipe, orientation, moisture and boundary; explicit upstream links for cradle-to-gate"
  excluded_use: "Direct comparison of building service without scenario/function; fixed industry life/performance; random waferboard/particleboard; unreviewed treatment/overlay/binder variants"
  required_metadata: "All reference qualifiers, linked foreground protocols, stage ownership, supplier background scope, physical and burden ledgers, allocation and uncertainty"
  required_quality_disclosure: "Actual temporal/geographic/grade coverage, identity/measurement gaps, emission method and limits; no publication or scientific-review claim"
  update_trigger: "Changed product grade/recipe, strand geometry/orientation, moisture/thickness/density, gate, supplier, energy/abatement route or new primary evidence"
data_sources:
  - id: "corrim-osb-us-2025"
    type: "literature"
    reference: "Maureen Puettmann, Life Cycle Assessment of Oriented Strand Board Production – United States; submitted 2025-03-21, revisions 2025-04-02/05-06, edited 2025-07-22. https://corrim.org/wp-content/uploads/2025/07/LCA-Report-OSB-07222025.pdf"
    used_for: "Sections 3.2.3–3.2.6, 4.3–4.8, 5.2–5.4.5; Tables 7, 9–12 and Figure 4. US 23 mills, 2022/2023; route and collection evidence only, not universal numeric defaults; table-label conflicts require primary-data resolution."
  - id: "frihart-joining-2023"
    type: "handbook"
    reference: "C. R. Frihart et al., Joining and Reassembling of Wood, Chapter 14, Springer Handbook of Wood Science and Technology (2023), printed pp.732–733, Figure 14.19; DOI 10.1007/978-3-030-81315-4_14. https://research.fs.usda.gov/download/treesearch/66341.pdf"
    used_for: "Isocyanate-water reaction via unstable carbamic acid forms amine and CO2; subsequent urea/biuret formation supports the pMDI reaction-aware component ledger. Mechanism is not a site-specific extent, full-cure assumption or fixed water/CO2 yield."
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory, Wood handbook—wood as an engineering material, FPL-GTR-282 (2021). https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Chapter 11 pp.11–10–11–11, OSB/particleboard distinction and layer-specific resin; Chapters 4/13 moisture methods. Chapter 10 pp.10–7–10–11 and Table 10–1: thermosetting/formulation context, moisture-assisted isocyanate cure and PF hot-press cure; the explicit pMDI-water CO2 mechanism is supported separately by frihart-joining-2023; glossary Polymer p.G–12: condensation loss of water. Together with actual supplied chemistry these support reaction-aware ledgers, not a fixed cure extent or water/CO2 yield. Whole-mass/element conservation and the formation/consumption equation are declared engineering derivations requiring actual composition and extent. Historical species/processing examples do not fix current grade, recipe, density or lifetime."
  - id: "epa-osb-2002"
    type: "official_guidance"
    reference: "US EPA, AP-42 10.6.1 Waferboard/Oriented Strandboard Manufacturing (March 2002). https://www.epa.gov/sites/default/files/2020-10/documents/c10s06-1.pdf"
    used_for: "Sections 10.6.1.1–10.6.1.3, Figure 10.6.1-1, pp.1–4: identity, route and emissions/control ownership. Historical US guidance combines WB/OSB; applicability and species/technology/fuel/control must be verified, no universal factors."
  - id: "epa-wood-boiler-2022"
    type: "official_guidance"
    reference: "US EPA, AP-42 1.6 Wood Residue Combustion In Boilers (March 2022). https://www.epa.gov/system/files/documents/2022-03/c1s6_final.pdf"
    used_for: "Sections 1.6.1–1.6.3 and Table 1.6-1 notes: separate boiler combustion, fuel/control dependence and filterable/condensable PM. Not a direct-fired OSB dryer factor or proof of contaminated-trim applicability."
  - id: "oiml-gas-volume-2007"
    type: "standard"
    reference: "OIML R 140, Measuring systems for gaseous fuel (2007 E), sections 7.3.1–7.3.3, pp.30–32. https://www.oiml.org/en/files/pdf_r/r140-e07.pdf"
    used_for: "Metering/reference conditions, pressure-temperature-compressibility volume conversion and associated measurements. Used for engineering state correspondence only, not current legal-compliance certification or fixed standard P/T. Wet-to-dry mole correction and OSB normalization are declared method derivations requiring actual composition and measured state."
