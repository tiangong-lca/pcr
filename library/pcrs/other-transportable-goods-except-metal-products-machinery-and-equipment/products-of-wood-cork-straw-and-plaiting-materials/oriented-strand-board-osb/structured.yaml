measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use calibrated net accepted finished-board dispatch mass in cp_reference; exclude packaging."
  - id: same_denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Reference product mass"
      uuid: ""
    required_unit: "kg"
    rule: "Every exchange uses per 1 kg reference flow; sum attributable period totals and divide by net accepted finished OSB mass from cp_reference."
  - id: moisture_basis
    applies_to: "wood and board measurements"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Collect actual wet and dry mass with cp_material/cp_reference. Dry-basis moisture u=(wet-dry)/dry; wet-basis w=(wet-dry)/wet; dry=wet/(1+u). Record denominator and method; adhesive/wax solids are not dry wood. For resin-bearing board, distinguish measured H2O from non-water oven losses or continuing cure; uncorrected oven mass loss is not automatically H2O or a conserved dry-resin amount. [usda-wood-handbook-2021]"
  - id: energy_boundary
    applies_to: "in_electricity, in_purchased_steam"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert measured kWh to MJ using 3.6 MJ/kWh. For steam use measured delivered-minus-return enthalpy including condensate reference. A database MJ unit alone does not establish that boundary."
