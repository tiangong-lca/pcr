measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use 1 kg accepted uncoated door-leaf net mass, excluding all packaging. Under cp_mass weigh each complete accepted leaf on a calibrated scale, identify its configuration and acceptance record, then sum the same-configuration campaign net masses. No default per-door weight; no area-times-assumed-density substitute."
  - id: wood_moisture
    applies_to: "hardwood, clean_offcut, clean_sawdust, glued_dust"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record as-received mass and dry-basis moisture separately. For wood only, dry mass = wet mass / (1 + dry-basis moisture in percent / 100). Determine moisture under cp_material using species-calibrated meters checked against representative oven-dry samples; glue/abrasive fractions are not wood."
  - id: electricity_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert actual metered kWh to MJ by multiplying by 3.6, matching the verified unit group; reconcile purchased medium-voltage supply and internal losses."
  - id: geometry
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain actual measured door area and thickness as configuration descriptors, not mass substitutes. Supplied acoustic/fire declarations must match the tested leaf/assembly, hardware, seals and installation; absent assembly evidence cannot create a rating."
