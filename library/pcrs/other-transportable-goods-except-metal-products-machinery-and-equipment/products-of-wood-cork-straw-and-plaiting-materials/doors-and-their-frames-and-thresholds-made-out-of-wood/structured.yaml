system_boundary:
  rules:
    - rule_id: b_door_gate
      applies_to: "door_manufacture"
      rule: "Include cut/shape/tenon, panel preparation, glue application, clamping/cure, final leaf machining, sanding, dimensional/joint acceptance, reject handling and packing. Preserve stage meters and mass records inside one aggregated foreground unit, avoiding a fictitious intermediate door output."
      source_ids:
        - adk-solid-door-route
        - woodtech-door-quality
    - rule_id: b_route
      applies_to: "door_manufacture"
      rule: "Confirm solid panels, no added catalyst or coatings, dry cleanup and no on-site combustion. If actual operations differ, re-assess scope and add each chemical, utility, waste and species emission separately; never suppress known exchanges to fit the route."
      source_ids:
        - usda-wood-handbook-2021
    - rule_id: b_background
      applies_to: "all inventory rows"
      rule: "Require supplier process boundaries and quantities independently of flow identity; account for outsourcing and actual material transport with separately identified transport services in the completed dataset."
