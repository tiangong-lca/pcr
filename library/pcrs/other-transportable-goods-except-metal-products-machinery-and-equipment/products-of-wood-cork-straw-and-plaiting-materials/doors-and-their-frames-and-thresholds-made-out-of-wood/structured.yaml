allocation_rules:
  - rule_id: a_physical
    applies_to: "door_manufacture"
    rule: "Maintain a physical stage ledger before burden allocation: wood dry mass, water and carbon entering equal accepted leaves, actual wastes, emissions and stock change within documented measurement uncertainty. Packaging has a separate dispatch ledger and is excluded from leaf net mass. Internal transfers and rework have equal quantities at both stage endpoints."
    source_ids: []
  - rule_id: a_attribution
    applies_to: "door_manufacture"
    rule: "Prefer dedicated campaign meters and withdrawals. For shared electricity/extraction/air systems, use measured runtime/load or submeter evidence and disclose the attribution driver. Keep environmental burden accounting separate from physical outputs; never multiply physical waste or co-product quantity by a burden share."
    source_ids: []
  - rule_id: a_residues
    applies_to: "clean_offcut, clean_sawdust, glued_dust"
    rule: "Rows here are waste transfers with actual treatment links and no avoided-product credit. If residues are deliberately produced marketable co-products, document that status and re-assess allocation with independent review before issuing that dataset; no default substitution or economic split is supplied."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "door_manufacture"
      flow_role: "accepted leaf net mass"
      record_type: "foreground_record"
      raw_fields: "configuration; batch; leaf identifier; calibration; individual net masses; accepted count; S; drawing; height/width/thickness; area; acceptance defects; claim/test references"
      collection_method: "Weigh each accepted complete uncoated leaf on a calibrated scale without transport packaging; reconcile drawing, configuration and acceptance record; retain each reading and sum as S. Dimensions measured with verified instruments."
      unit: "kg"
      frequency: "each leaf; campaign close"
      temporal_coverage: "Complete declared campaign, with representative operating coverage"
      site_scope: "Named factory and configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records and reconciled campaign ledger"
    - protocol_id: cp_material
      process_id: "door_manufacture"
      flow_role: "wood, glue and abrasive inputs"
      record_type: "foreground_record"
      raw_fields: "supplier lot; species/origin; delivery state; withdrawals; opening/closing stock; wet/dry basis; moisture method; supplier formulation/SDS; glue solids/water; abrasive composition"
      collection_method: "Weigh and reconcile lot receipts, withdrawals and stocks by separate atomic material. Measure wood moisture on representative same-lot specimens with species-calibrated meters and oven-dry checks; glue properties from supplier and verified batch sampling, not assumed polymer concentration. Record ambient bonding conditions and cure acceptance."
      unit: "kg"
      frequency: "each lot and campaign"
      temporal_coverage: "Complete declared campaign, with representative operating coverage"
      site_scope: "Named factory and configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records and reconciled campaign ledger"
    - protocol_id: cp_energy
      process_id: "door_manufacture"
      flow_role: "electricity"
      record_type: "foreground_record"
      raw_fields: "meter readings; service voltage; stage runtime/load; site supply; transformer losses; kWh; attribution driver; supplier background boundary"
      collection_method: "Use calibrated purchased-electricity meters and stage submeters for the campaign; reconcile totals and shared loads, including dust extraction and compressor use. Convert kWh to MJ without adding upstream supply losses twice."
      unit: "MJ"
      frequency: "continuous, campaign totals"
      temporal_coverage: "Complete declared campaign, with representative operating coverage"
      site_scope: "Named factory and configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records and reconciled campaign ledger"
    - protocol_id: cp_pack
      process_id: "door_manufacture"
      flow_role: "each packaging input"
      record_type: "foreground_record"
      raw_fields: "packing bill; separate board/film/pallet masses; tare; return and trip records; dispatch quantity; scrap; stocks"
      collection_method: "Weigh each packaging material separately; reconcile withdrawals with dispatched protection, scrap and stock change. For reusable pallets retain physical transfer and return records and verified service-life attribution separately."
      unit: "kg"
      frequency: "each shipment"
      temporal_coverage: "Complete declared campaign, with representative operating coverage"
      site_scope: "Named factory and configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records and reconciled campaign ledger"
    - protocol_id: cp_waste
      process_id: "door_manufacture"
      flow_role: "each waste output"
      record_type: "foreground_record"
      raw_fields: "row identity; pre/post glue stage; container tare; wet mass; moisture; attached glue/abrasive; destination; transfer note; rework stock"
      collection_method: "Weigh segregated waste containers, subtract tare and retain treatment transfer evidence. Separate clean offcut, untreated sawdust, glued dust, rejected leaf, PVAc residue, abrasive paper and each packaging scrap. Reconcile detached material once."
      unit: "kg"
      frequency: "each removal and campaign"
      temporal_coverage: "Complete declared campaign, with representative operating coverage"
      site_scope: "Named factory and configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records and reconciled campaign ledger"
    - protocol_id: cp_air
      process_id: "door_manufacture"
      flow_role: "each elementary air emission"
      record_type: "foreground_record"
      raw_fields: "species/CAS; medium/submedium; stage; control device; sampling/airflow/time; size basis; detection limit; fugitive estimate and uncertainty; glue SDS"
      collection_method: "Collect outdoor discharge measurements after control with compatible sampling periods; include documented fugitive releases. Obtain separate species and disjoint dust-size totals. Acetic acid requires actual source identification and measurement. Unknown or below detection is disclosed, not an invented zero."
      unit: "kg"
      frequency: "representative operating conditions and campaign"
      temporal_coverage: "Complete declared campaign, with representative operating coverage"
      site_scope: "Named factory and configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records and reconciled campaign ledger"
    - protocol_id: cp_water
      process_id: "door_manufacture"
      flow_role: "evaporated water"
      record_type: "foreground_record"
      raw_fields: "wood moisture before/after; glue input water; water in accepted leaf and wastes; stock change; ambient uptake; airflow/humidity cross-check"
      collection_method: "Determine net evaporated water from consistent campaign water balances, cross-checked by outlet airflow/humidity where feasible; record retained water and ambient uptake rather than treating all supplied glue water as vapor."
      unit: "kg"
      frequency: "each campaign"
      temporal_coverage: "Complete declared campaign, with representative operating coverage"
      site_scope: "Named factory and configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records and reconciled campaign ledger"
  calculation_rules:
    - id: campaign_normalization
      applies_to: "all inventory rows"
      rule: "For each non-reference row, normalized exchange = attributable physical campaign total / S; S is the sum of measured accepted net leaf masses in kg. Accepted_leaf = 1 kg. Apply the same campaign and configuration throughout."
      inputs:
        - cp_mass
        - cp_material
        - cp_energy
        - cp_pack
        - cp_waste
        - cp_air
        - cp_water
      output: "Exchange per 1 kg reference flow"
      source_ids: []
    - id: wood_balance
      applies_to: "hardwood, clean_offcut, clean_sawdust, glued_dust"
      rule: "Wood dry mass = wet wood mass / (1 + dry-basis moisture in percent / 100); use only the wood fraction of composite streams. Maintain unallocated dry-wood/water/carbon balances including stock changes; carbon fraction requires actual species/composition evidence, not a universal default."
      inputs:
        - cp_material
        - cp_waste
        - cp_water
      output: "Dry wood mass and physical balance"
      source_ids:
        - usda-wood-handbook-2021
    - id: particle_partition
      applies_to: "pmfine, pmmid, pmcoarse"
      rule: "If the same valid sample reports cumulative totals, middle fraction = PM10 − PM2.5 and coarse fraction = total suspended particles − PM10; require non-negative values, equal sampling/control bases and documented uncertainty. Add only disjoint fractions; never sum PM10 with its PM2.5 subset."
      inputs:
        - cp_air
      output: "Disjoint particle totals before campaign normalization"
      source_ids: []
  data_quality_requirements:
    - id: dq_route
      applies_to: "door_manufacture"
      requirement: "Verify actual solid leaf construction and complete door gate; retain excluded-operation checks and stage records."
      evidence: "Drawing, bill of materials, shop route and acceptance"
    - id: dq_mass
      applies_to: "all inventory rows"
      requirement: "S must be positive and measured; report scale resolution/calibration, sampling coverage, period and denominator. Quantities, null values, detection limits and absence are distinct."
      evidence: "Traceable original campaign records"
    - id: dq_background
      applies_to: "all inventory rows"
      requirement: "Confirm actual supplied composition, geographic/temporal representativeness and unit basis before linking backgrounds. Unresolved waste identities or supply compatibility remain explicit and block a complete dataset, not the future collection protocol."
      evidence: "Supplier declarations, state-confirmed identities, linked process boundaries"
    - id: dq_functions
      applies_to: "reference product"
      requirement: "Area, thickness, adhesive, absence of cores/skins/coatings/hardware and functional claims require original evidence. Do not infer sound/fire certification from wood species or material mass."
      evidence: "Product schedule and test report matching configuration, or explicit no claim"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference product"
    rule: "Require exactly one completed accepted door-leaf product output linked by accepted_leaf, equal to 1 kg net mass. A frame, threshold, filled-core panel or packaged gross mass fails scope."
    source_ids:
      - adk-solid-door-route
  - rule_id: v_basis
    applies_to: "all inventory rows"
    rule: "EN and ZH must preserve rows, quantities, S denominator, sources and formulas. Every row has one atomic flow, reference basis and named collection protocol; actual optional absence needs route evidence."
    source_ids: []
  - rule_id: v_balance
    applies_to: "door_manufacture"
    rule: "Reconcile physical mass/water/carbon and packaging ledgers before allocation. Check no duplicated internal handoffs, rework or captured-versus-emitted dust. Document discrepancy and measurement uncertainty; no invented closure amount."
    source_ids: []
  - rule_id: v_emissions
    applies_to: "pmfine, pmmid, pmcoarse, water_vapor, acetic_acid"
    rule: "Check species, CAS where relevant, outdoor air/submedium, size partition and actual control boundary. Preserve biogenic CO2 in linked upstream LCI and disclose impact-accounting conventions separately. No generic PM or correction flow substitutes a specific emission."
    source_ids: []
  - rule_id: v_completeness
    applies_to: "all inventory rows"
    rule: "Missing identity, incompatible supplier composition/units, unmeasured quantities or unknown flows make the concrete dataset incomplete. Add every evidenced additional exchange atomically; flow identity success alone does not approve quantities or background data."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Input for the specified uncoated interior solid hardwood door leaf, with linked upstream manufacture and disclosed finishing/installation outside this gate"
  allowed_use: "Manufacturing comparison only after matching leaf geometry, configuration, moisture, performance, gates and complete supply data"
  excluded_use: "Whole installed door sets; frames/thresholds; filled-core panels; certified fire/acoustic assemblies; universal per-door weight"
  required_metadata: "Factory, campaign, S and accepted count, mass calibration, dimensions/species/route, glue formulation, claims and acceptance, boundary and backgrounds, packaging, allocation, UUID gaps"
  required_quality_disclosure: "Measured/estimated/missing quantities, sampling and uncertainty, data age, supplier compatibility and outstanding identity or background gaps"
  update_trigger: "Changed species, construction, adhesive, finishing, functional claim, meter boundary, energy route, waste destination or supplier background"
data_sources:
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory, Wood Handbook, FPL-GTR-282 (2021), Table 10-1 / pp.10-9, 10-12; ch.13 p.13-2. https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Wood moisture measurement; ready-to-use PVAc and ambient cure/volatile caveats. No door weight, recipe, emission factor or sector average."
  - id: "adk-solid-door-route"
    type: "literature"
    reference: "Adirondack Naturals, Custom, Solid Wood Doors Handmade Since 1999, Welcome and FAQ, undated publisher page. https://www.adknaturals.com/"
    used_for: "Primary manufacturer evidence of solid-wood mortise-and-tenon construction and unfinished slab delivery; qualitative subset only."
  - id: "woodtech-door-quality"
    type: "literature"
    reference: "WoodTech Door, Specifications, §§4–6, undated publisher page. https://woodtechdoor.net/specifications"
    used_for: "Independent manufacturer evidence of door-level machining/sanding, squareness/warp inspection and dispatch protection. Engineered component recipe and numeric tolerances are not adopted."
