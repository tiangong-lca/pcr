system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "all datasets"
      rule: "Only declared flat UF-bonded uncoated wood panels conform. Audit each ingredient and preparation stage; raw dedicated chips carry forestry and preparation; co-products carry justified source-stage burdens. Supplier resin expansion must retain its actual yield and transfer quantity."
      source_ids:
        - usda-handbook-2021
        - wilson-resins-2010
        - corrim-pb-2024
    - rule_id: boundary_heat
      applies_to: "heat and emissions"
      rule: "Include actual dryer fuel/direct combustion, separate owned boiler, press heating, oxidizer fuel, wet controls and auxiliary electricity. One meter interval or emission stream is counted once. AP42 boiler evidence does not turn boiler emissions into dryer factors. Imported heat is outside the present enumerated fuel-owned route and needs separately verified supply and net heat basis."
      source_ids:
        - epa-pb-2002
        - epa-boiler-2022
    - rule_id: boundary_recovery
      applies_to: "recovered wood"
      rule: "Require prior use/treatment, contamination testing, legal waste/product status, collection/sorting/cleaning/transport and loss records. Recycled is not evidence for zero burden; declare the recycling convention and sensitivity, and retain actual recovery burdens."
      source_ids:
        - corrim-pb-2024
    - rule_id: boundary_downstream
      applies_to: "all datasets"
      rule: "Stop at accepted packaged board factory gate, with packaging exchanges separate from panel mass. Construction, use-phase formaldehyde exposure, service life, disposal and Module D credits require separate scenarios; no 75-year assumption or report end-of-life average is imported."
      source_ids:
        - corrim-pb-2024
boundary_abstraction:
  declared_starting_condition: "Identified purchased wood feed at board mill and batch-assayed aqueous formaldehyde/urea at identified UF reactor; supply chains before these gates are linked backgrounds"
  starting_condition_role: "Collected gate conditions, not burden-free origin"
  product_classification_scope: "CPC 3.0:31431; narrower"
  recursive_input_rule: "Same-category external board is not an allowed raw-wood shortcut; this route excludes resin-bonded recovered panel. Internal trim return is an internal ledger, not a new purchased reference flow"
  upstream_dataset_requirement: "Source-specific wood forestry/chipping and co-product allocation; chemical manufacture; fuel and electricity supply; recovery operations; transport; waste treatment. No simultaneous purchased UF background when synthesis is expanded in foreground"
  disclosure: "Board and resin sites, all gates and ownership, source species, prior material status, included heat/abatement, upstream stages, stock changes, excluded stages, allocation and uncertainty"
