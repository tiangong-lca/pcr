allocation_rules:
  - rule_id: allocation_separation
    applies_to: "wood inputs and outputs"
    rule: "First subdivide or use measured causal drivers to separate dedicated wood, resin, heat and abatement burdens. Purchased sawmill co-products require documented supplier allocation; dry-mass allocation of joint source burdens is a declared baseline consistent with the cited study, not proof of zero price or zero burden. Retain a price/alternative-allocation sensitivity when economically different outputs make mass attribution uncertain."
    source_ids:
      - corrim-pb-2024
  - rule_id: allocation_physical
    applies_to: "all physical exchanges"
    rule: "Preserve unallocated mass, water, carbon and internal heat/wood/resin transfers. Allocation shares apply to the separate environmental-burden account, not to physical co-product output, stock or internal-link quantity. Returned trim/fines are not independent sold products. Packaging and dedicated treatment remain attributable to the appropriate product."
    source_ids:
      - corrim-pb-2024
  - rule_id: allocation_heat
    applies_to: "shared heat equipment"
    rule: "Use measured net useful heat delivered to each receiver to allocate shared boiler/resin heat burden; no fuel-only guessed efficiency or steam mass-only share. Disclose exports and losses. Exclude CHP from this route unless separately reviewed allocation and electricity exchanges are added."
    source_ids:
      - epa-boiler-2022
      - wilson-resins-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "uf_board"
      flow_role: "accepted net panel"
      record_type: "measurement and traceable records"
      raw_fields: "cohort; species/source; grade; thickness/length/width; net mass Q; release moisture; packaging tare; reject/return/opening/closing stocks"
      collection_method: "Calibrated net weighing; acceptance and thickness measurements; moisture sampling by oven-dry method or oven-validated calibrated meter. Preparation: Q is same-period inventory-adjusted accepted panel mass, excluding rejects and packaging. Keep the operational oven-test result and method distinct from true water content: validate the method for the wood/UF panel matrix, disclose and correct evidenced non-water volatile or continuing-cure loss, and retain unresolved interference. Water-specific or matrix-validated measurements are required for the H2O ledger; no guessed correction factor. Dry panel solids include retained cured UF/additives and are not pure dry wood."
      unit: "kg; m; moisture fraction"
      frequency: "each batch/lot and meter interval; period endpoints"
      temporal_coverage: "complete declared accounting period including seasonal and start/stop variation"
      site_scope: "same product cohort; named resin supplier and board site; all shared recipients disclosed"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; certificates; raw logs; reconciliation; uncertainty and gaps"
    - protocol_id: cp_feed
      process_id: "uf_board"
      flow_role: "each wood origin and geometry"
      record_type: "measurement and traceable records"
      raw_fields: "delivery; supplier process/gate; species; dedicated/co-product/recovered status; wet mass; loose bulk Vb; independently measured solid Vs on supplier definition; wet bulk rho_b; solid rho_s; packing k = Vs/Vb; supplier/background reference quantity A_provider and unit/solid/bulk convention; converted period demand V_provider; provider scaling n_provider; source and reference moisture/state; contaminants; stocks; source allocation; recovery yield; loss destination"
      collection_method: "Weigh/sample each segregated lot; supplier forestry/chipping/sawmill stage records; recovered-wood contaminant acceptance and sorting mass balance. Inventory-adjust each source and preserve face/core and recycle links. Obtain the actual supplier/background reference A_provider and definition before volume linkage; measure same-lot densities/packing and matched moisture/state, using calibrated volume and mass methods. No database coefficient is a density; derive V_provider from matched measurements, scale the provider by V_provider/A_provider and normalize the native exchange V_provider/Q once. A_provider remains fixed; unknown conversion remains unresolved."
      unit: "kg; m3; moisture fraction"
      frequency: "each batch/lot and meter interval; period endpoints"
      temporal_coverage: "complete declared accounting period including seasonal and start/stop variation"
      site_scope: "same product cohort; named resin supplier and board site; all shared recipients disclosed"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; certificates; raw logs; reconciliation; uncertainty and gaps"
    - protocol_id: cp_recipe
      process_id: "uf_board"
      flow_role: "each UF ingredient and additive"
      record_type: "measurement and traceable records"
      raw_fields: "actual batch id; supplier/site; full chemical recipe; delivery grade/concentration; formaldehyde/methanol/water assay; ingredient kg; solids/free urea/free formaldehyde; molar ratio; pH; reaction time/temperature; batch yields; delivered resin; press catalyst/wax doses"
      collection_method: "Calibrated ingredient dosing, delivery certificates and batch solids/free-formaldehyde tests; reconcile reactor feed, water, resin, purge and emissions. Supplier-expanded records use actual resin batches delivered to the board cohort; no guessed average chemical split."
      unit: "kg; mass fraction; temperature; time; pH"
      frequency: "each batch/lot and meter interval; period endpoints"
      temporal_coverage: "complete declared accounting period including seasonal and start/stop variation"
      site_scope: "same product cohort; named resin supplier and board site; all shared recipients disclosed"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; certificates; raw logs; reconciliation; uncertainty and gaps"
    - protocol_id: cp_water
      process_id: "uf_board"
      flow_role: "purchased process water"
      record_type: "measurement and traceable records"
      raw_fields: "meter; use/stage; withdrawals; added dilution water; cooling makeup; wet-control water; recycled water; effluent; evaporation; stocks"
      collection_method: "Meter purchased treated water; reconcile solution-contained water and resin condensation water independently of purchases; distinguish internally circulating water."
      unit: "kg; m3"
      frequency: "each batch/lot and meter interval; period endpoints"
      temporal_coverage: "complete declared accounting period including seasonal and start/stop variation"
      site_scope: "same product cohort; named resin supplier and board site; all shared recipients disclosed"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; certificates; raw logs; reconciliation; uncertainty and gaps"
    - protocol_id: cp_energy
      process_id: "uf_board"
      flow_role: "delivered electricity"
      record_type: "measurement and traceable records"
      raw_fields: "meter; voltage; supplier/grid/location/year; kWh; equipment/stage; load hours; batch/cohort; shared recipients"
      collection_method: "Submeter resin, preparation, dryer fans, presses, finish, heat auxiliaries and controls; reconcile unique intervals to site meters and actual shared-service drivers. Convert metered kWh to MJ."
      unit: "kWh; MJ"
      frequency: "each batch/lot and meter interval; period endpoints"
      temporal_coverage: "complete declared accounting period including seasonal and start/stop variation"
      site_scope: "same product cohort; named resin supplier and board site; all shared recipients disclosed"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; certificates; raw logs; reconciliation; uncertainty and gaps"
    - protocol_id: cp_fuel
      process_id: "uf_board"
      flow_role: "each external and internal fuel"
      record_type: "measurement and traceable records"
      raw_fields: "fuel id/species/origin; grade/blend; supplier; meter; wet mass; volume; density; moisture; carbon; LHV; absolute T/P; dry/wet convention; water content; gas composition; Z; meter Vm; fixed background reference A_provider and m3 definition; converted period demand V_provider; provider scaling n_provider; chip Vs/Vb/rho_b/rho_s/k and supplier definition; dryer/boiler/oxidizer/mobile equipment; stocks; internal clean-fines diversion"
      collection_method: "Meter/weigh separately by combustion equipment; obtain supplier/background gas T/P, composition, dry/wet and Z definitions and fixed reference amount A_provider; retain site wood volume/mass/moisture/LHV assays and matching solid/bulk definition. Keep Vm, raw wood measurements and matched period demand V_provider separate from fixed A_provider. Derive V_provider only with validated matched-state/convention evidence; n_provider = V_provider/A_provider scales the provider and V_provider/Q is the native exchange once. Unknown definitions/conversions remain unresolved. Reconcile external wood feed, internally diverted clean fuel and ash. Never use resin-bonded residues as clean untreated fuel."
      unit: "kg; m3; MJ"
      frequency: "each batch/lot and meter interval; period endpoints"
      temporal_coverage: "complete declared accounting period including seasonal and start/stop variation"
      site_scope: "same product cohort; named resin supplier and board site; all shared recipients disclosed"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; certificates; raw logs; reconciliation; uncertainty and gaps"
    - protocol_id: cp_heat
      process_id: "uf_board"
      flow_role: "internal useful heat"
      record_type: "measurement and traceable records"
      raw_fields: "receiver; supply/return mass and enthalpy; temperature/pressure; condensate; steam quality; meter interval; losses; fuel input; resin/dryer/press demand; exported heat"
      collection_method: "Calibrated heat metering or supply-minus-return enthalpy balance with actual water/steam state; verify net delivered heat and match both link ends. Reconcile all receivers/losses to fuel and boiler balances; unknown heat basis remains unresolved."
      unit: "kg; MJ; temperature; pressure"
      frequency: "each batch/lot and meter interval; period endpoints"
      temporal_coverage: "complete declared accounting period including seasonal and start/stop variation"
      site_scope: "same product cohort; named resin supplier and board site; all shared recipients disclosed"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; certificates; raw logs; reconciliation; uncertainty and gaps"
    - protocol_id: cp_pack
      process_id: "uf_board"
      flow_role: "each packing component"
      record_type: "measurement and traceable records"
      raw_fields: "film polymer; strap grade/route; wood spacer species; delivered/used/returned mass; reuse turns; cohort; pack tare"
      collection_method: "Weigh individual components and reconcile purchases, stocks, returns/reuse; exclude packaging from Q. Include other actual packing components as separate rows before claiming complete inventory."
      unit: "kg"
      frequency: "each batch/lot and meter interval; period endpoints"
      temporal_coverage: "complete declared accounting period including seasonal and start/stop variation"
      site_scope: "same product cohort; named resin supplier and board site; all shared recipients disclosed"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; certificates; raw logs; reconciliation; uncertainty and gaps"
    - protocol_id: cp_residue
      process_id: "uf_board"
      flow_role: "each co-product/waste"
      record_type: "measurement and traceable records"
      raw_fields: "row/material; origin/stage; wet/dry kg; moisture; resin/contaminants; internal return/burning; sold quantity/prices; ash carbon; liquid assays; treatment destination; stocks"
      collection_method: "Segregated calibrated weighing and destination manifests. Keep internal residues in link ledger; distinguish clean versus resin-bonded, bottom/fly ash and liquid streams. Analyse treatment-relevant components; retain full physical amounts before burden allocation."
      unit: "kg; mass fraction"
      frequency: "each batch/lot and meter interval; period endpoints"
      temporal_coverage: "complete declared accounting period including seasonal and start/stop variation"
      site_scope: "same product cohort; named resin supplier and board site; all shared recipients disclosed"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; certificates; raw logs; reconciliation; uncertainty and gaps"
    - protocol_id: cp_air
      process_id: "uf_board"
      flow_role: "each net outdoor-air species"
      record_type: "measurement and traceable records"
      raw_fields: "species/CAS; source vent/fugitive id; stage; control train; sampled mass concentration; actual/standard dry gas flow; oxygen/moisture correction; operating hours; start/stop; fossil/biogenic origin; PM cut size/filterable/condensable; detection limits"
      collection_method: "Species-specific accredited stack/source tests and flow monitoring, representative batch/season/operating loads; separate net control outlet from captured material and untreated inlet. Test NO and NO2 separately or retain unresolved speciation; no invented split of NOx. Resolve carbon origin and detection limits; preserve unspeciated VOC/PM as unquantified coverage gaps, not a fabricated species."
      unit: "kg; mass/volume; gas volume/time"
      frequency: "each batch/lot and meter interval; period endpoints"
      temporal_coverage: "complete declared accounting period including seasonal and start/stop variation"
      site_scope: "same product cohort; named resin supplier and board site; all shared recipients disclosed"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; certificates; raw logs; reconciliation; uncertainty and gaps"
    - protocol_id: cp_transport
      process_id: "uf_board"
      flow_role: "inbound road service"
      record_type: "measurement and traceable records"
      raw_fields: "shipment; origin/destination; actual wet transported mass; distance; vehicle/payload; empty returns; transport mode; resin supplier transfer; carrier dataset"
      collection_method: "Use weigh tickets and carrier route/load records; calculate actual shipment tonne-km by mode. Exclude yard diesel already in own fuel account and avoid duplicate upstream transport."
      unit: "t.km"
      frequency: "each batch/lot and meter interval; period endpoints"
      temporal_coverage: "complete declared accounting period including seasonal and start/stop variation"
      site_scope: "same product cohort; named resin supplier and board site; all shared recipients disclosed"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; certificates; raw logs; reconciliation; uncertainty and gaps"
  calculation_rules:
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "x_i = attributable inventory-adjusted exchange total / Q; Q is accepted net finished-panel kg from cp_reference. Reference output is 1 kg. Preserve absolute physical totals and attribution record separately."
      inputs:
        - cp_reference
        - "all row collection protocols"
      output: "normalized inventory"
      source_ids:
        - corrim-pb-2024
    - id: calc_chip_supply_volume
      applies_to: "dedicated_chips; coproduct_chips; wood_fuel"
      rule: "At the same batch/state and matched solid/bulk definitions, k = Vs/Vb, m_wet = rho_b × Vb = rho_s × Vs. If the reference convention of A_provider is that same bulk basis, V_provider = Vb; if it is the compatible solid basis, V_provider = Vs = k × Vb. When reference moisture/state differs, first bridge conserved dry wood mass to the supplier reference moisture and measured corresponding density/packing; do not reuse source k or density across states. Declare fixed A_provider, unit, definition and evidence explicitly and retain converted period V_provider. Provider scaling is n_provider = V_provider/A_provider; normalize the native exchange V_provider/Q once without changing A_provider. Unknown A_provider/k/state leaves linkage incomplete; no FAO typical factor or database secondary property coefficient is a measured conversion."
      inputs:
        - cp_feed
        - cp_fuel
        - "fixed supplier/background A_provider and definition"
        - "matched measurements"
        - Q
      output: "fixed provider reference, raw/matched period volumes, process scaling and native per-kg exchange separately"
      source_ids:
        - fao-ubet-volume
        - usda-handbook-2021
    - id: calc_gas_supply_volume
      applies_to: "natural_gas"
      rule: "For conserved gas amount with identical dry composition, V_provider = Vm × (Pm/Pb) × (Tb/Tm) × (Zb/Zm), using absolute temperatures/pressures and background reference b. The wet meter volume Vm requires measured water-vapour fraction and a validated dry/wet correction before this expression; differing composition or unsupported Z/reference conditions requires further supplier verification, not an assumed ideal-gas conversion. Keep actual Vm, converted period V_provider and fixed A_provider separately; n_provider = V_provider/A_provider and the native exchange V_provider/Q is normalized once."
      inputs:
        - cp_fuel
        - "fixed supplier/background A_provider and T/P/composition/wet-dry/Z"
        - Q
      output: "matched period V_provider, fixed A_provider, process scaling and native m3/kg separately"
      source_ids:
        - epa-pb-2002
    - id: calc_wood_water
      applies_to: "wood and panel ledgers"
      rule: "m_dry = m_wet/(1+u); u = (m_wet-m_dry)/m_dry; w = u/(1+u). Reconcile dry wood, retained resin/additives, water carried in/added/generated, finished panel, external waste/emissions and stock changes; internal returns cancel only in aggregate and retain matched stage transfers. Keep the operational oven-test result and method distinct from true water content: validate the method for the wood/UF panel matrix, disclose and correct evidenced non-water volatile or continuing-cure loss, and retain unresolved interference. Water-specific or matrix-validated measurements are required for the H2O ledger; no guessed correction factor. Dry panel solids include retained cured UF/additives and are not pure dry wood."
      inputs:
        - cp_reference
        - cp_feed
        - cp_recipe
        - cp_water
        - cp_residue
        - cp_air
      output: "dry wood and water balances"
      source_ids:
        - usda-handbook-2021
    - id: calc_recipe
      applies_to: "UF recipe and retained resin"
      rule: "Ingredient/formulation constituent mass = actual dosed product kg × batch-assayed mass fraction. Attribute supplier batch inputs/losses by actual resin quantity transferred to the board cohort; retain reaction yield, condensation water and loss balance. Do not add internal liquid UF resin as a second external input, and do not equate urea plus formaldehyde input mass with cured dry polymer mass."
      inputs:
        - cp_recipe
        - cp_water
        - cp_air
        - cp_residue
      output: "component and retained-solids ledger"
      source_ids:
        - wilson-resins-2010
    - id: calc_heat
      applies_to: "heat receivers and fuel"
      rule: "Electricity MJ = kWh × 3.6. Fuel energy = measured fuel quantity on declared basis × matching measured LHV. Useful heat = supplied mass × supplied enthalpy minus returned mass × return enthalpy, corrected for documented losses/condensate. Reconcile receiver totals; unknown enthalpy/reference conditions prohibit a usable heat quantity."
      inputs:
        - cp_energy
        - cp_fuel
        - cp_heat
      output: "input energy and net useful heat separately"
      source_ids:
        - epa-boiler-2022
    - id: calc_air
      applies_to: "species emissions"
      rule: "Integrate same-basis measured species concentration × dry volumetric gas flow rate over actual operating time, with concentration converted to kg/m3 and flow/time in compatible units; alternatively sum interval flow-weighted concentration × measured interval gas volume without another time factor; add separately measured fugitive sources once. Use consistent moisture/oxygen/temperature corrections and uncertainty. Do not infer site kg from a product chamber-test concentration, LCIA CO2-equivalent or VOC-as-carbon total."
      inputs:
        - cp_air
      output: "single-species net outdoor-air mass"
      source_ids:
        - epa-pb-2002
    - id: calc_pm
      applies_to: "pm25; pmcoarse; pmover10"
      rule: "On one common source, period and filterable/condensable definition: PM2.5 fraction = cumulative PM2.5; PM2.5–PM10 fraction = cumulative PM10 minus cumulative PM2.5; >PM10 fraction = total PM minus cumulative PM10. Require nonnegative results and measured compatible totals. Condensable PM must be assigned with documented size evidence or remain a separate unresolved exchange; no zero or guessed PM split."
      inputs:
        - cp_air
      output: "three non-overlapping fractions"
      source_ids:
        - epa-pb-2002
        - epa-boiler-2022
    - id: calc_carbon
      applies_to: "wood/fuel/resin physical balances"
      rule: "Use measured dry material carbon and fossil/biogenic provenance. Reconcile carbon in panel, sold material, residues/ash, stocks, CO2, CO, methane and each measured organic species. Derive CO2 only from a validated residual carbon balance with 44/12, separately by origin; retain biogenic CO2 in LCI and disclose stored biogenic carbon separately from LCIA. No automatic negative CO2 at the factory for wood growth already in upstream datasets."
      inputs:
        - cp_feed
        - cp_recipe
        - cp_fuel
        - cp_residue
        - cp_air
        - cp_reference
      output: "separate fossil/biogenic carbon balances"
      source_ids:
        - corrim-pb-2024
        - epa-boiler-2022
    - id: calc_allocation
      applies_to: "environmental burden ledger only"
      rule: "For eligible joint source outputs a_j = dry output mass j / total eligible dry output mass; B_j = a_j × joint burden + dedicated burden j. Use period-matched sale values for economic sensitivity and measured useful-heat shares for shared heat. Physical output and internal links retain full measured quantities."
      inputs:
        - cp_feed
        - cp_residue
        - cp_heat
        - "actual joint burdens and prices"
      output: "allocated environmental burden account"
      source_ids:
        - corrim-pb-2024
  data_quality_requirements:
    - id: quality_cohort
      applies_to: "all rows"
      requirement: "Same recipe/specification/period Q; retain source and supplier scope, sampling representativeness and opening/closing stocks. No factory records have been obtained by this methodology itself."
      evidence: "cp_reference; cp_feed; cp_recipe"
    - id: quality_complete
      applies_to: "all flows"
      requirement: "Assess every actual chemical, fuel, packing component, waste and species. Unmeasured, unavailable, below-detection and physically absent are distinct states. Extra actual ingredients or fuel routes require additional atomic rows and verified identities before dataset completeness; no aggregate adhesive family or VOC-total row."
      evidence: "cp_recipe; cp_fuel; cp_pack; cp_air"
    - id: quality_evidence
      applies_to: "numeric parameters"
      requirement: "Use primary site/supplier measurements or independently justified exact-route factors with source location, units, control/device/species/fuel applicability and uncertainty. CORRIM 2021/2022 board and Wilson 2005 resin averages are not generic site quantities; no numerical range is prescribed here."
      evidence: "original records and source applicability"
    - id: quality_identity
      applies_to: "all UUIDs and gaps"
      requirement: "Flow UUID is identity only; verify type, media, formulation, delivery state/route, reference property and unit against actual exchange. Verified Volume/m3 does not establish the fixed supplier/background reference quantity A_provider and measured period demand V_provider; solid/bulk chip definitions, same-lot packing/moisture and gas T/P/composition/wet-dry/Z must support the linkage. Blank UUID is unresolved, not proof of zero or database absence. No correction flow or unrelated stereoisomer/species is a substitute."
      evidence: "identity and support evidence"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Declare all qualifiers and one same-cohort reference output. Uncoated wood particleboard identity cannot be established by CPC label alone; supplier recipe expansion and finished state must agree."
    source_ids:
      - usda-handbook-2021
  - rule_id: validate_balance
    applies_to: "all physical exchanges"
    rule: "Use Q excluding packaging/rejects. Reconcile physical mass/water/carbon, actual wood losses, UF reaction/transfer yield and full internal-link equality; keep environmental allocation separate. Missing measurements or negative PM residuals remain unresolved."
    source_ids:
      - corrim-pb-2024
      - wilson-resins-2010
  - rule_id: validate_emissions
    applies_to: "air and heat"
    rule: "Identify species, outdoor-air subcompartment, origin and units; no nested PM addition, total VOC proxy, guessed NOx split or suppressed biogenic CO2. Owned boiler and dryer boundaries remain separate in raw logs. Steam MJ without verified net supply/return basis is unresolved."
    source_ids:
      - epa-pb-2002
      - epa-boiler-2022
  - rule_id: validate_release
    applies_to: "data package"
    rule: "Before a usable dataset claim, resolve all applicable UUID/unit, fixed supplier/background A_provider, matched period demand V_provider and chip/gas conversion, recipe, heat and emissions gaps, justify absent rows, add missing atomic exchanges and provide original records plus allocation sensitivity. Candidate methodology and software checks are not independent scientific approval."
    source_ids:
      - corrim-pb-2024
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Input to declared wood-panel product supply models with verified applicability"
  allowed_use: "Cradle-to-factory-gate LCI after linking exact upstream supply and waste treatment; distinguish expanded resin foreground from board-mill-only activity"
  excluded_use: "OSB, non-wood/fiber/faced/molded products; other/unknown resin routes; use-phase exposure, service equivalence, end-of-life credits; publication without completed data"
  required_metadata: "All reference qualifiers; board/resin sites and gates; reference UUID/property/unit; Q; supplier/formulation/wood-source provenance; heat and emission methods; packaging and allocation"
  required_quality_disclosure: "Temporal/geographical/cohort coverage, measurements and gaps, detection limits, unresolved identities, allocation convention/sensitivity, separate physical carbon and environmental account"
  update_trigger: "Recipe/wood origin/contamination/grade/density/thickness/moisture/press/heat/control changes; supplier data revisions or flow-identity correction"
data_sources:
  - id: "usda-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory, Wood handbook—wood as an engineering material, FPL-GTR-282 (2021), chapters 4 (moisture), 10 (adhesives), 11 pp. 11–11 to 11–12 (particleboard), and 13 pp.13–1–13–2 (oven-loss and volatile-extractive bias; applicability to resin-containing engineered products). https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Particle versus OSB/fiber architecture, dry forming and moisture definition; qualitative scope only, no generic recipe/density adoption"
  - id: "corrim-pb-2024"
    type: "literature"
    reference: "Puettmann, CORRIM, Cradle-to-grave Life Cycle Assessment of North American Particleboard, November 2023; revised April 3, 2024 (after March 22 ASTM verification). Sections 3.2.4–3.2.8 pp.18–19; 6.1 pp.26–27; 6.3/Table 9 pp.27–29. https://corrim.org/wp-content/uploads/2024/07/PB-Cradle-to-grave-LCA-Final.pdf"
    used_for: "2021/2022 survey, twelve facilities (9 US/3 Canada), source and process anatomy, co-product allocation; no transfer of region-weighted recipe/energy/density, downstream life or disposal scenarios"
  - id: "epa-pb-2002"
    type: "official_guidance"
    reference: "US EPA AP-42 Section 10.6.2 Particleboard Manufacturing, June 2002, pp.10.6.2-1–5, Figure 10.6.2-1, emissions tables with original device/fuel/control footnotes. https://www.epa.gov/sites/default/files/2020-10/documents/c10s06-2.pdf"
    used_for: "Manufacturing stages, distinct board architecture, dryer/press/finishing species and controls; old average factors are not site defaults"
  - id: "epa-boiler-2022"
    type: "official_guidance"
    reference: "US EPA AP-42 Section 1.6 Wood Residue Combustion In Boilers, March 2022, sections 1.6.1–1.6.3 and Tables 1.6-1/1.6-2 footnotes. https://www.epa.gov/system/files/documents/2022-03/c1s6_final.pdf"
    used_for: "Separate boiler fuel, firing/controls and particulate/species scope; no factor transfer to resin-bonded fuel or dryer"
  - id: "wilson-resins-2010"
    type: "literature"
    reference: "Wilson, Life-cycle inventory of formaldehyde-based resins used in wood composites in terms of resources, emissions, energy and carbon, Wood and Fiber Science 42 (2010), 125–143, manufacturing process pp.127–128 and UF material inventory. https://corrim.org/wp-content/uploads/2017/12/WFS_SI_LCI_Formaldehyde-based_Resins_in_Wood_Composites-Resources_Emissions_Energy_Carbon.pdf"
    used_for: "US 2005 resin survey, ingredient/reactor/pH/solids anatomy only; original largely starts from methanol-to-formaldehyde, unlike this purchased aqueous feed; no surveyed recipe amounts adopted"
  - id: "fao-ubet-volume"
    type: "official_guidance"
    reference: "FAO, Unified Bioenergy Terminology (UBET), Section 5.1.3 Mass, Volume and Density. https://www.fao.org/4/j4504e/j4504e08.htm"
    used_for: "Distinguish solid/bulk volume and moisture-dependent density; definitions only, fixed supplier/background A_provider, measured period demand V_provider and same-batch measured conversion required; no typical tabulated factor/density adopted"
