measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use accepted net panel mass at declared release moisture, excluding packaging; collect Q using cp_reference. Every inventory denominator is per 1 kg reference flow."
  - id: moisture_basis
    applies_to: "wood and panel physical ledgers"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Dry-basis u = water mass / oven-dry mass; wet mass = dry mass × (1+u). Wet-basis w = u/(1+u). Use same-sample oven-dry or validated meter records, and separate wood water from resin reaction/dilution water. [usda-handbook-2021] Keep the operational oven-test result and method distinct from true water content: validate the method for the wood/UF panel matrix, disclose and correct evidenced non-water volatile or continuing-cure loss, and retain unresolved interference. Water-specific or matrix-validated measurements are required for the H2O ledger; no guessed correction factor. Dry panel solids include retained cured UF/additives and are not pure dry wood."
  - id: volume_conversion
    applies_to: "volume-based chips, gas and panel metadata"
    required_property_ref:
      name: "Volume and measured Mass"
      uuid: ""
    required_unit: "m3; kg"
    rule: "Panel volume = sum(actual length × width × thickness); panel density uses matching net mass and moisture. Wood-chip UUID 3fa2a6a7-224c-4d99-bd55-a214f0a83161 confirms material identity and Volume/m3 only, not bulk volume. Separate measured wet kg, loose bulk volume Vb, the fixed supplier/background reference amount A_provider with its unit and solid/bulk convention, and measured period demand volume V_provider expressed in that convention. Obtain the supplier/background solid-versus-bulk definition, moisture/state and packing convention; measure same-lot solid volume Vs, wet bulk density rho_b, solid density rho_s and packing k = Vs/Vb on compatible definitions. Obtain V_provider only through a validated matched-state conversion; provider-process scaling is n_provider = V_provider/A_provider and the native Volume exchange is V_provider/Q in m3/kg, each scaled/normalized once. A_provider remains the fixed provider reference amount, not measured demand or a per-kg quantity; database secondary mass/volume coefficients are not measured density or packing. Unknown A_provider/definition/conversion means an incomplete quantity link, even with a correct UUID. Gas volume likewise requires supplier/background reference conditions and matched state. [fao-ubet-volume; usda-handbook-2021]"
  - id: recipe_basis
    applies_to: "resin and additives"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record each actual purchased ingredient/formulation; disclose product and active/solids kg separately. Do not count solution water or internal UF resin transfer twice. Never infer UF dosage from an industry-average percentage. [wilson-resins-2010]"
  - id: energy_basis
    applies_to: "energy and useful heat"
    required_property_ref:
      name: "Energy with declared physical basis"
      uuid: ""
    required_unit: "MJ"
    rule: "Electricity MJ = metered kWh × 3.6. Keep fuel LHV input and measured net delivered heat separate; no assumed boiler efficiency. Steam or hot-water useful heat requires supply and return flow/enthalpy, pressure, temperature and condensate/loss records plus matching background definition. A steam MJ property alone is insufficient. [epa-pb-2002; epa-boiler-2022]"
