measurement_rules:
  - id: reference_mass
    applies_to: "board"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "cp_reference weighs net newly accepted board at the drying/conditioning gate. Q includes newly accepted closing stock once; exclude packaging, unreleased WIP/rejects and previously accepted returns. Normalize production exchanges per 1 kg reference flow using that same Q."
  - id: geometry
    applies_to: "board"
    required_property_ref:
      name: "Mass; Volume; area"
      uuid: ""
    required_unit: "kg; m3; m2"
    rule: "cp_reference measures untrimmed area A, thickness t and conditioned density rho on the same specimens/moisture basis as mass m; check m = A × t × rho. Area per reference kg = 1/(t × rho). Never use chip bulk density or downstream trimmed dimensions."
  - id: moisture
    applies_to: "wood_chips; board; rejected_sized_board; captured_unsized_fibre; sludge"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "cp_material records wet mass, water and dry solids: dry-basis u = water/dry solids; wet-basis w = water/wet total; u = w/(1-w), dry solids = wet total/(1+u). Separate wood and sizing solids; no fixed conversion moisture."
  - id: chip_volume
    applies_to: "wood_chips"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "cp_material declares actual supplier solid/bulk volume and packing, density, temperature and moisture. Convert measured wet mass to volume only with matched measured wet density; upstream linkage remains incomplete until supplier m3 is compatible."
  - id: energy
    applies_to: "electricity; heat"
    required_property_ref:
      name: "Energy; net delivered heat"
      uuid: ""
    required_unit: "MJ"
    rule: "cp_energy converts metered kWh using 3.6 MJ/kWh. Heat requires matched supply/return mass, temperature, pressure, fluid and enthalpy; supplier fuel heating value or gross steam energy cannot stand in for net delivered thermal energy."
  - id: transport
    applies_to: "freight_chips"
    required_property_ref:
      name: "Mass times distance"
      uuid: ""
    required_unit: "t*km"
    rule: "cp_transport uses actual transported wet tonnes and each loaded km; 1 t*km = 1000 kg*km. Retain load/return convention and confirm provider boundaries; never invent density, payload or distance."
