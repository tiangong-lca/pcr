allocation_rules:
  - rule_id: allocation_direct
    applies_to: "wet_board"
    rule: "Retain gross physical vector V separately from attributed burden A. First subdivide actual operations, or virtually assign exchanges exclusive to one function using stage/cohort evidence. For a remaining inseparable multifunctional operation, identify the determining physical causal relationship separately for each exchange. Only residual exchanges lacking such a relationship use evidenced market values of the co-functions in their actual condition at the split point. Missing causality, compatible prices or study-context justification remains unresolved; no blanket mass/time/equal share."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: allocation_recovery
    applies_to: "rejected_sized_board; captured_unsized_fibre; sludge"
    rule: "Internal recovered fibre and white water are loops with actual recovery energy and losses; they are not co-product credits. For externally transferred residue establish legal/material status, receiver use, composition, price where relevant and actual treatment. Keep shared generation burdens separate from post-split recovery/treatment burdens. Unknown status or allocation remains unresolved. This limited hierarchy does not establish recycling allocation or substitution benefits; those require an explicit compatible study method."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: allocation_sources
    applies_to: "wood_chips"
    rule: "Carry source forestry/residue generation and chipping burdens from the compatible upstream provider once. A residue label does not prove zero upstream burden. Do not allocate incoming wood, contained water and sizing partitions as separate purchases when one whole supply is received."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: allocation_stock
    applies_to: "board"
    rule: "For identified original cohort c, Qc is its original first-accepted net kg at this same drying/conditioning handoff; Ec is its inherited production exchange vector and xc = Ec/Qc. Preserve original acceptance evidence and opening/closing stocks. A returned/reinspected/reconditioned subset retains its original accepted net mass q_c within Qc and the matched xc; actual later service exchanges are assigned only to that traced subset, normalized by q_c (Qc only when the whole cohort is serviced), and recorded separately from new production. Never divide old-board services by unrelated new Q or recreate production. Unknown Qc, original accepted subset mass or inherited vector remains unresolved, even if a new output weight is available."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "This is an attributional intermediate-inventory method. ILCD sections 7.9.2–3 support the limited subdivision and exchange-specific allocation hierarchy only where allocation is appropriate for the declared study context; they do not authorize substitution, recycling credits or a general ILCD-compliance claim. The explicit cohort/stock and handoff requirements are additional author prescriptions. Retain each causal relationship and residual market-value calculation with evidence, limitations and sensitivity; unavailable allocation evidence remains unresolved. Exported residues never receive an automatic avoided-product credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "wet_board"
      flow_role: "board"
      record_type: "accepted handoff and stock records"
      raw_fields: "grade; batch; date; first acceptance; wet net mass; moisture; area; thickness; density; receiving specification; stock status"
      collection_method: "Calibrated net weighing and matched moisture/geometry tests at drying/conditioning handoff; reconcile producer and receiver  Q = newly first-accepted net kg, including closing newly accepted board once; exclude packaging, rejects, WIP and previously accepted returns; denominator for per 1 kg reference flow"
      unit: "kg; m2; m; kg/m3"
      frequency: "each cohort/handoff"
      temporal_coverage: "matched production and stock interval"
      site_scope: "actual line and receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; laboratory/test method; signed handoff; stock reconciliation"
    - protocol_id: cp_material
      process_id: "wet_board"
      flow_role: "wood_chips; process_water; paraffin; starch; alum; lubricant"
      record_type: "receipts, formulation and stage material balances"
      raw_fields: "supplier/grade; source; batch; wet mass; dry solids; water; volume basis; density; assay/hydration; stage; opening/closing stocks"
      collection_method: "Weigh receipts and withdrawals, sample moisture/assay, meter external water, retain actual separate formulation and stage ledger  Reconcile net consumption and stage/cohort attribution with cp_stock; divide same-cohort total by Q from cp_reference per 1 kg reference flow; internal recirculation is not repeated input"
      unit: "kg; m3"
      frequency: "delivery/batch and meter interval"
      temporal_coverage: "same cohort period as Q"
      site_scope: "actual included line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier specifications; calibration; moisture replicates; recipe and retention records"
    - protocol_id: cp_energy
      process_id: "wet_board"
      flow_role: "electricity; heat"
      record_type: "utility meters and enthalpy records"
      raw_fields: "start/end reading; time; stage; voltage/geography; fluid composition; supply/return mass/temperature/pressure; enthalpy; provider boundary"
      collection_method: "Use synchronized line/stage meters, reconcile invoice boundary and net heat; subtract separately metered out-of-scope finishing  Retain stage totals and cp_stock attribution; convert kWh × 3.6, calculate net supply-minus-return heat; divide same-cohort MJ by Q per 1 kg reference flow"
      unit: "MJ; kWh"
      frequency: "meter interval aligned to batches"
      temporal_coverage: "same cohort period as Q"
      site_scope: "included stages and actual natural-gas heat or electricity supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; enthalpy method; meter coverage; utility background compatibility"
    - protocol_id: cp_transport
      process_id: "wet_board"
      flow_role: "freight_chips"
      record_type: "supplier shipment and vehicle records"
      raw_fields: "wet tonnes; origin/destination; loaded km; vehicle/fuel; load/return convention; provider included stages"
      collection_method: "Verify actual waybills and route legs; compare chip and freight provider boundaries  Sum wet t × loaded km by compatible provider and cohort; divide by Q per 1 kg reference flow; no generic empty-return factor"
      unit: "t; km; t*km"
      frequency: "each incoming shipment"
      temporal_coverage: "same cohort period as Q"
      site_scope: "actual chip supply chain"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "waybill; route evidence; vehicle identity; boundary reconciliation"
    - protocol_id: cp_waste
      process_id: "wet_board"
      flow_role: "rejected_sized_board; captured_unsized_fibre; effluent; sludge; waste_oil"
      record_type: "outgoing waste and treatment records"
      raw_fields: "source stage; wet mass; dry solids; water; density/volume for effluent; pollutant concentration; legal status; receiver; treatment; stock"
      collection_method: "Weigh each atomic stream, sample sludge/effluent and document treatment acceptance; distinguish recycled internal material  Reconcile each stream with cp_stock, water/solids/pollutant ledgers; volume × measured compatible density gives effluent kg; divide same-cohort totals by Q per 1 kg reference flow"
      unit: "kg; m3; mg/l"
      frequency: "each load and representative sample interval"
      temporal_coverage: "same cohort period as Q"
      site_scope: "included line/control and actual receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale/flow calibration; sampling methods; manifests; receiver acceptance"
    - protocol_id: cp_emissions
      process_id: "wet_board"
      flow_role: "individual elementary emission cards"
      record_type: "source-specific stack/fugitive measurement and water balance"
      raw_fields: "species/CAS; phase; compartment; time; source; controls; concentration; dry/wet gas basis; reference T/P; flow; operating hours; detection limit; moisture inputs/outputs"
      collection_method: "Matched species concentration and volumetric-flow measurement; integrate across actual operation; reconcile evaporated water independently  For matching bases sum C × gas volume × 10^-6 kg/mg, add measured fugitives once; use cp_stock to attribute cohort then divide by Q per 1 kg reference flow; retain below-detection bounds, not invented zeros"
      unit: "kg; mg/m3; m3/h; h"
      frequency: "representative intervals for every source/control state"
      temporal_coverage: "same cohort period as Q"
      site_scope: "included chip/refining/forming/drying/conditioning/control sources"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "test method; raw time series; phase/compartment match; calibration; uncertainty; controls"
    - protocol_id: cp_stock
      process_id: "wet_board"
      flow_role: "every exchange and inherited vector"
      record_type: "raw/WIP/accepted-board ledger"
      raw_fields: "opening/closing quantities and exchange vectors; receipts; transfers; first acceptance; returns; rejects; losses; cohort; stage; timestamps"
      collection_method: "Trace actual lots through receipt, refining, stock, mat, dry and conditioned states; reconcile both ends of each internal transfer  Opening + external entries = outgoing + closing + measured losses for each conserved constituent; retain inherited vector and assign only demonstrable current-cohort contributions before dividing by Q per 1 kg reference flow; no division for Q=0"
      unit: "row-native unit; kg dry solids; kg water"
      frequency: "each cohort and period close"
      temporal_coverage: "same interval as Q with prior cohort links"
      site_scope: "actual included stores/line and handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "immutable lot history; stocktake; producer/receiver reconciliation; discrepancy explanation"
  calculation_rules:
    - id: calc_reference
      applies_to: "all inventory rows"
      rule: "For new production only, x_i = E_i,cohort / Q after cp_stock attribution; E_i,cohort excludes inherited old-board production and old-board services. Q > 0 is required; the board row is Q/Q = 1. Q=0, idle or cleanup intervals retain raw burdens and documented later attribution; do not divide by zero or discard them."
      inputs:
        - "raw exchange"
        - "causal cohort link"
        - Q
      output: "row-native unit per 1 kg reference flow"
      source_ids: []
    - id: calc_stock
      applies_to: "every conserved constituent and inherited exchange"
      rule: "opening stock + actual entries = actual exits + closing stock + measured losses. Keep raw/WIP/accepted stock and their exchange vectors distinct. Reused/returned board retains original Qc, Ec and accepted subset q_c; its service ledger uses q_c, never unrelated new Q. Missing original denominator/vector remains unresolved. Internal transfers cancel in the integrated boundary."
      inputs:
        - "stage/lot/stock records"
        - "V and A vectors"
      output: "auditable constituent and burden reconciliation"
      source_ids: []
    - id: calc_solids_water
      applies_to: "chips; slurry; wet mat; dry/conditioned board; wastes"
      rule: "Wet total = water + wood dry solids + actual sizing dry solids. Track source component retention/loss and water in each stage; internal white water cancels externally. Water inputs + opening water = board water + effluent/sludge/reject water + net evaporation + closing water + other measured exits."
      inputs:
        - "measured masses"
        - moisture
        - formulation
        - "water/condensate records"
      output: "stage balances and net evaporation"
      source_ids:
        - usda-wood-handbook-2021
    - id: calc_heat
      applies_to: "heat"
      rule: "H = sum(m_supply × h_supply - m_return × h_return) over matched actual boundary/interval; use measured composition and consistent reference states. Resolve identity/property/provider before final background linkage."
      inputs:
        - "mass flows"
        - fluid
        - T
        - P
        - "enthalpy reference"
      output: "net delivered MJ then per 1 kg reference flow"
      source_ids: []
    - id: calc_emissions
      applies_to: "elementary emissions"
      rule: "Species mass = matching concentration × matching gas volume with explicit unit conversion; cumulative particle fractions can be differenced only for matched sources/time/basis. PM2.5, PM2.5–PM10 and >PM10 are nonoverlapping. Total VOC-as-carbon, COD, filterable and condensable PM are distinct measurements, not interchangeable species."
      inputs:
        - "source-specific concentrations"
        - "gas flow/time"
        - "detection limits"
        - controls
      output: "individual emitted species kg per 1 kg reference flow"
      source_ids:
        - epa-wet-fibreboard-2002
    - id: calc_carbon
      applies_to: "wood and carbon-bearing sizing"
      rule: "Reconcile measured incoming carbon with board/waste/stock carbon and emitted carbon by source. Never invent universal wood carbon content, uptake, degradation gas yields or 100% sizing retention. Carry verified upstream uptake once and retain biogenic emissions separately."
      inputs:
        - "actual composition and source fractions"
        - "stage stocks"
        - "measured species"
      output: "source-specific carbon ledger and explicit unresolved residual"
      source_ids: []
    - id: calc_downstream
      applies_to: "finishing receiver"
      rule: "Carry the complete drying-gate board inventory per accepted kg. Finished output requires actual received board mass, finishing inputs/emissions and losses; no assumed 1:1 yield. Geometric partitions are not extra purchases."
      inputs:
        - "handoff quantity/vector"
        - "actual downstream records"
      output: "compatible intermediate provider link; no finished-product result without finishing"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "reference and every exchange"
      requirement: "Same declared grade, wood-only wet cold-dewatered route, drying handoff, site and coherent period; retain actual stage state and source/provider boundary. Extra route components require explicit extension."
      evidence: "producer/receiver specifications; route observations; process diagram"
    - id: dq_identity
      applies_to: "UUID-bearing and unresolved rows"
      requirement: "Full flow name, type, quantitative reference/property/unit, geography, route and emission compartment must fit the actual exchange. Resolve heat/effluent and any additional exchange before claiming a complete background-linked study."
      evidence: "direct record and support chain; supplier/receiver compatibility; explicit gaps"
    - id: dq_measurement
      applies_to: "materials, utilities and releases"
      requirement: "Retain raw measured values, calibration, sampling coverage, uncertainty and detection bounds. Missing records remain unknown. Independently compare water, dry solids, sizing and carbon ledgers and investigate residuals instead of inventing closure factors."
      evidence: "cp_reference to cp_stock evidence and uncertainty log"
    - id: dq_sources
      applies_to: "literature and quantities"
      requirement: "EPA 2002 and USDA 2021 support qualitative route/state distinctions. Their historical figures are not general consumption, moisture, recipe, emission-factor or performance defaults. No compatible multi-source empirical quantity range is established here."
      evidence: "source/page applicability assessment and actual foreground records"
    - id: dq_functions
      applies_to: "product claims"
      requirement: "No kg-based comparison of thermal/acoustic/building service without tested configuration, dimensions, moisture, performance and scenario alignment. The untrimmed intermediate does not prove a finished product standard."
      evidence: "actual test report and downstream finishing specification"
validation_rules:
  - rule_id: validate_scope
    applies_to: "board"
    rule: "Confirm actual wet wood softboard and drying/conditioning receiver handoff. Reject substitution by MDF, hardboard, wet mat, particleboard, faced/resinated board or finished trimmed output. Check all reference qualifiers and producer/receiver quantity/state agreement."
    source_ids:
      - un-cpc3-2025
      - epa-wet-fibreboard-2002
      - usda-wood-handbook-2021
  - rule_id: validate_basis
    applies_to: "all rows"
    rule: "Same positive Q and cohort must support every normalized exchange. Check first acceptance, opening/closing raw/WIP/accepted stocks, returns and inherited vectors; reconcile dry solids, sizing, water and carbon. Missing causal split or unknown residual is inconclusive."
    source_ids: []
  - rule_id: validate_flows
    applies_to: "all rows"
    rule: "Each card is one actual atomic exchange. Check UUID full-record identity/property/unit and actual background/provider scope; missing heat/effluent identity or any necessary additional exchange remains an explicit gap. A valid UUID does not validate quantity, occurrence or treatment."
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "releases and wastes"
    rule: "Distinguish captured material, external treatment transfers and actual elementary releases; retain species, phase, compartment, controls and detection bounds. Avoid particle/VOC or wastewater double counting; unmeasured release is not zero."
    source_ids:
      - epa-wet-fibreboard-2002
  - rule_id: validate_completion
    applies_to: "study"
    rule: "Report performed/skipped checks, findings and unresolved coverage. Do not claim a complete linked study, finished-product comparison, independent scientific approval or publication from a method/check result alone."
    source_ids: []
published_dataset_profile:
  dataset_role: "Candidate guidance for a site-specific wet-process untrimmed wood-softboard intermediate provider; an actual study must disclose its own evidence/status"
  downstream_use: "Feed a matched trimming/finishing process with the accepted dried/conditioned board quantity and inherited complete exchange vector"
  allowed_use: "Transparent gate-to-gate inventory; cradle-to-handoff only with complete compatible upstream/transport/treatment links and explicit unresolved coverage"
  excluded_use: "Finished-board, packaged dispatch or building-function declaration; default recipe/energy/emission factors; methodology or study approval by classification alone"
  required_metadata: "All reference qualifiers; real supplier/receiver/handoff; site/period; grade; route/stage states; Q; stock/cohort links; raw units/moisture; provider boundaries; identity/property/unit evidence; allocation rationale"
  required_quality_disclosure: "Calibration; sampling; uncertainty; source age/applicability; missing exchange/identity/provider/quantity; unresolved balances; actual performed/skipped checks; study review state"
  update_trigger: "Changed grade/formulation/furnish, utility/heat/control/treatment, handoff specification, upstream provider, major stock/yield behavior or new compatible evidence"
