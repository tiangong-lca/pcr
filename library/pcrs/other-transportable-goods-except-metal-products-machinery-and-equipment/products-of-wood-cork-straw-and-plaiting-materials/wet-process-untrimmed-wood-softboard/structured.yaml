  classification_refs: "CPC 3.0 31449 Other fibreboard; narrower"
  covered_products: "Uncoated single-layer wet-laid low-density wood softboard, dried and conditioned before dry trimming/finishing"
  excluded_products: "MDF; hardboard/HDF; particleboard; non-wood fibreboard; wet mats; resin-bonded/asphalt-treated/faced board; finished trimmed and packed board"
  representative_product: "Declared wood-softboard grade transferred as dried and conditioned untrimmed board to a finishing receiver"
  production_route: "Received wood chips → hot-water softening/atmospheric refining → stock preparation → wet forming/cold dewatering → indirect drying/conditioning"
  market_state: "Measured manufacturing intermediate at the drying/conditioning handoff; no finished building-product or dispatch claim"
functional_unit:
  what: "Supply dried and conditioned untrimmed wet-process wood softboard to its finishing receiver"
  how_much: "1 kg net accepted dried and conditioned board at the declared handoff; denominator Q is newly accepted board including closing accepted intermediate stock once"
  how_well: "Declare grade, density/conditioning test, net moisture, thickness and actual area; meet the receiving finishing specification; no assumed thermal resistance, finished dimensions or strength class"
  how_long_or_cycle: "One manufacturing cohort through first acceptance at the drying/conditioning handoff; no assumed use life or finishing yield"
  reference_flow_link: "board"
system_boundary:
  rules:
    - rule_id: boundary_stages
      applies_to: "wet_board"
      rule: "Include chip receipt/storage, hot-water softening, atmospheric refining/screening, actual washing, formulation, wire laying, vacuum/cold dewatering, indirect drying/conditioning, handoff inspection and associated fibre/water recovery and emission control. Keep stage-specific raw balances within the integrated unit."
      source_ids:
        - epa-wet-fibreboard-2002
        - usda-wood-handbook-2021
    - rule_id: boundary_handoff
      applies_to: "board"
      rule: "End at measured acceptance of dried/conditioned untrimmed board by the finishing receiver. Include its upstream manufacturing burdens once. Exclude later dry trimming/sanding/coating/packing/dispatch; a downstream model must carry this board input and add those measured operations and losses before claiming finished board."
      source_ids:
        - epa-wet-fibreboard-2002
        - usda-wood-handbook-2021
    - rule_id: boundary_utilities
      applies_to: "wet_board"
      rule: "Purchased natural-gas-derived indirect heat is the only heat route covered and does not justify onsite fuel or boiler emissions. Other heat sources/mixes are outside this route until separately evidenced. Actual steam injection, combustion, additional chemical/refrigerant, external packaging or direct discharge requires a separately evidenced atomic exchange and scope review. Unlisted exchanges are not zero."
      source_ids:
        - epa-wet-fibreboard-2002
    - rule_id: boundary_providers
      applies_to: "wet_board"
      rule: "Keep source chipping/preparation, transport, heat generation and external treatment in their actual providers without overlap. Carbon uptake carried in the chip provider is counted once. Wastewater transferred to treatment is a waste exchange, not an elementary release of the same water and pollutants."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "Track stage states separately: chip receipt; hot-water softening/refining; screened stock and sizing; wet mat after cold dewatering; dry board; conditioned board accepted at handoff; fibre/water recovery. Every internal transfer preserves wet quantity, moisture, composition and inherited inventory vector at both ends. Do not invent a product sale or Q for each internal stage. EPA/USDA historical temperatures, times, moisture and recipe observations are not modern plant defaults. [epa-wet-fibreboard-2002; usda-wood-handbook-2021]"
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Delivered clean wood chips, with known origin, species, moisture, supplier gate and solid/bulk volume basis"
  starting_condition_role: "foreground_gate_input"
  product_classification_scope: "Wet-process low-density wood softboard at the drying/conditioning handoff, subset of CPC31449"
  recursive_input_rule: "Internal fibre/white-water recirculation stays in the physical ledger once; an externally received same-category board needs a separate verified identity and inherited provider rather than an invented recursive chain"
  upstream_dataset_requirement: "Compatible forestry/residue-generation/chipping provider, electricity, sizing, water, purchased heat, actual transport and waste-treatment providers; identity alone never establishes their inventory vectors"
  disclosure: "Actual site, period, starting condition, drying handoff, supplier/receiver, utility/control/treatment boundaries, loops, stock movements, losses and excluded finishing/use/end-of-life"
