review_metadata:
  unresolved_flow_uuids:
  - dust_waste
  - screen_reject
  mapping_recommendation: narrower; only untreated unbound wood flour from dry waste sawdust without onsite
    heating/drying or combustion; wood wool is excluded
  scientific_review: not_independently_reviewed
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  reference_identity_qualification:
    row_id: flour_output
    flow_uuid: d07bf4c9-7cd0-46ad-a6b3-2fd11fe08f98
    identity_scope: Verified broad foreground wood-material Product flow, physically restricted to one
      clean untreated unbound wood-flour filler grade at bulk dispatch; actual species, particle distribution/morphology,
      moisture, no-binder state, net mass and production/provider gate are mandatory.
    source_record_limits: Species, product form, dimensions, treatment, moisture, production route and
      provider are unspecified; no exact wood-flour database specification, production background, compliance,
      strength, burden or measured amount is claimed.
    provider_compatibility: Actual supplier/form/grade/moisture/gate and upstream background must be independently
      matched; a shared broad UUID does not make different product states interchangeable.
  remaining_dataset_identity_gaps: Two concrete discarded wood-powder/coarse-screening Waste rows remain
    UUID-free; actual corresponding exchanges cannot be delivered as complete until confirmed. Product
    flow Wood material cannot substitute for Waste/Elementary flow identities.
  provider_compatibility:
  - row_id: electricity
    source_geography: CN
    state: Actual provider/geography/year/grid-average low-voltage user boundary and losses pending; no
      silent China/global background default.
  - row_id: sawdust_input
    source_route: untreated, comb/rec
    state: Only actual dry clean untreated incoming waste material recovery; verify supplier state/origin/moisture/species
      and recovery boundary, not assumed combustion.
  - row_id: lubricating_oil
    state: Actual petroleum-fraction supplied lubricant grade/additives and supplier background pending;
      calorific metadata is not a quantity.
  dataset_completeness: Required qualifiers, site measurements, actual upstream/background matches, unknown
    emissions/conditional absence and remaining row identities must be declared; identity availability
    does not establish a complete measured dataset.
  internal_material_ledger:
    process_id: flour_mill
    location: Process Inventory Structure / Internal Stage Collection Ledger
    record_ids:
    - oversize_reinput
    - captured_dust_reinput
    - oversize_return
    - captured_dust_return
    flow_uuid: d07bf4c9-7cd0-46ad-a6b3-2fd11fe08f98
    identity_scope: Precisely qualified untreated oversize wood powder and approved captured wood-powder
      material, measured species/particle form/moisture/stage and paired routing; raw broad Product flow
      locator has no opposing form/route.
    boundary: Four diagnostic same-unit handoff records; not external Product inputs/outputs or extra
      accepted reference outputs. Keep stage cp_returns raw measurements, equal wet/dry wood and water
      quantities at both ends, stocks, repeated-pass electricity and separate waste/emission destinations;
      no external exchange/normalization formula changed.
