      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the database energy property for electricity; convert metered kWh to MJ with 3.6 MJ/kWh. This is electrical energy, not fuel heat or steam enthalpy."
  - id: particle_bins
