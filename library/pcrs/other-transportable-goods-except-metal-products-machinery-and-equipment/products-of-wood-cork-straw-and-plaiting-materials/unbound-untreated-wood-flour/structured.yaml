  - id: moisture_basis
    applies_to: "sawdust_input; flour_output; oversize_return; oversize_reinput; captured_dust_return; captured_dust_reinput; dust_waste; screen_reject"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve both wet mass and oven-dry wood mass. MC_db = water mass / oven-dry wood mass; m_dry = m_wet / (1 + MC_db), using MC_db as a fraction. A wet-basis fraction w gives m_dry = m_wet * (1 - w). Never substitute an assumed moisture target (usda-wood-handbook-2021)."
