      source_ids:
        - clemons-wood-flour-2005
    - rule_id: b_returns
      applies_to: "oversize_return; oversize_reinput; captured_dust_return; captured_dust_reinput"
      rule: "Internal transfers are recorded at equal amounts on both ends and cancel in the aggregated foreground boundary. They are neither external feed nor saleable output; repeated passes still consume measured electricity."
