      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert cumulative measurements into nonoverlapping bins only for the same sampling boundary, duration and control condition. PM2.5-10 = PM10 - PM2.5; PM>10 = total PM - PM10. Retain source totals as evidence, not extra exchanges. Negative differences require investigation."
