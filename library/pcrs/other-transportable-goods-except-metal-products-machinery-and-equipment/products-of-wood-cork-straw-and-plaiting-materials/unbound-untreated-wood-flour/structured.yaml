    - rule_id: b_carbon
      applies_to: "sawdust_input; flour_output; dust_waste; screen_reject; pm25; pmcoarse; pmover10"
      rule: "Keep a physical dry-wood and biogenic-carbon account. Do not add photosynthetic uptake again if supplied upstream, and do not delete real biogenic CO2 emissions because a climate indicator excludes them. No onsite combustion is permitted in this route."
