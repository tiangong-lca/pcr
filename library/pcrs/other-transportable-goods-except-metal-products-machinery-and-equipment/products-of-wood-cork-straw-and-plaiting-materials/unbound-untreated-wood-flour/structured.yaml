allocation_rules:
  - rule_id: a_dedicated
    applies_to: "flour_mill"
    rule: "A dedicated single-grade campaign assigns its environmental burdens to accepted flour. Keep discarded waste and internal returns in the physical balance; do not allocate them as saleable co-products."
    source_ids: []
  - rule_id: a_multigrade
    applies_to: "flour_mill"
    rule: "Separate grade-specific meters or campaigns first. Where saleable grades share operations, report unallocated physical outputs and separately document the burden-sharing relationship using measured causal drivers; if none is supported, retain an allocation review gap. Do not import sawmill allocation percentages."
    source_ids: []
  - rule_id: a_ledgers
    applies_to: "all inventory rows"
    rule: "Maintain the physical process/wood-water-carbon balance separately from the allocated burden ledger. Never multiply actual co-product output mass or internal link quantity by a burden share. No avoided-product credit without an explicit reviewed system-expansion scenario."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "flour_mill"
      flow_role: "receipt/reference product"
      record_type: "foreground record"
      raw_fields: "feed receipts; opening/closing stocks; net dispatch B; species; sieve opening and retained fractions; sample wet/dry masses; waste status"
      collection_method: "Calibrated weighing, matched supplier records, representative sealed moisture samples and oven-dry mass checks; sieve analysis identifies openings and method"
      unit: "kg; moisture fraction; micrometres"
      frequency: "each lot and dispatch"
      temporal_coverage: "one complete campaign including stock changes"
      site_scope: "same site and accepted grade"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; sample plan; lab records; supplier burden disclosure"
    - protocol_id: cp_energy
      process_id: "flour_mill"
      flow_role: "electricity"
      record_type: "foreground record"
      raw_fields: "submeter readings; operating hours by stage; supply voltage; transformer boundary; B"
      collection_method: "Read calibrated electrical meters for receipt, milling, screening, dust extraction and bulk handling; reconcile bills"
      unit: "kWh; MJ"
      frequency: "each campaign; stage totals"
      temporal_coverage: "same campaign"
      site_scope: "same metered line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; bills; 3.6 MJ/kWh conversion"
    - protocol_id: cp_returns
      process_id: "flour_mill"
      flow_role: "internal wood transfers"
      record_type: "foreground record"
      raw_fields: "pair id; returned mass; moisture; sieve grade; routing; B"
      collection_method: "Weigh or validate calibrated conveying balances at both ends; retain capture and oversize return records independently"
      unit: "kg"
      frequency: "each return batch"
      temporal_coverage: "same campaign"
      site_scope: "same closed-loop line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "paired logs; flowmeter calibration; contamination checks"
    - protocol_id: cp_waste
      process_id: "flour_mill"
      flow_role: "disposed wood fractions"
      record_type: "foreground record"
      raw_fields: "dust shipment mass; coarse reject shipment mass; moisture; stock change; contractor; treatment; B"
      collection_method: "Separate calibrated collection bins, weigh shipments and reconcile manifests by individual waste fraction"
      unit: "kg"
      frequency: "each shipment"
      temporal_coverage: "same campaign including storage"
      site_scope: "same site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge tickets; transfer manifests; treatment dataset"
    - protocol_id: cp_oil
      process_id: "flour_mill"
      flow_role: "lubricant input and spent output"
      record_type: "foreground record"
      raw_fields: "oil additions; used-oil shipments; oil type; opening/closing stocks; retained oil; B"
      collection_method: "Weigh individual additions and shipments, reconcile maintenance and oil stock records without assuming equal input/output"
      unit: "kg"
      frequency: "each maintenance event"
      temporal_coverage: "campaign and documented prorating"
      site_scope: "same line equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "oil specification; scale and contractor records"
    - protocol_id: cp_air
      process_id: "flour_mill"
      flow_role: "outdoor particle bins"
      record_type: "foreground record"
      raw_fields: "sample duration; exhaust volume; control state; cumulative PM/PM10/PM2.5; fugitive sources; B"
      collection_method: "Use source-specific controlled outlet and fugitive emission measurements or a validated local mass-release model, retaining detection limits and aerodynamic cut definitions; no sawmill PTE default"
      unit: "kg"
      frequency: "representative operation and campaign"
      temporal_coverage: "same operating/control window"
      site_scope: "outdoor-air emissions, unspecified receiving subcompartment; record actual release geometry"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling report; control log; bin reconciliation; uncertainty"
    - protocol_id: cp_water
      process_id: "flour_mill"
      flow_role: "evaporated water"
      record_type: "foreground record"
      raw_fields: "input/output wet/dry masses; opening/closing wood water stocks; condensate; vapor release; B"
      collection_method: "Reconcile water carried in wood and stock changes; quantify positive net vapor only after investigating balance residuals, with independent moisture or exhaust evidence"
      unit: "kg"
      frequency: "each campaign"
      temporal_coverage: "same campaign"
      site_scope: "same aggregate; no heating or wet wash"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "moisture records; uncertainty; water balance"
  calculation_rules:
    - id: campaign_basis
      applies_to: "all inventory rows"
      rule: "For each exchange, sum attributable campaign receipts/releases after relevant opening/closing stock correction and divide by B, the net accepted flour mass at dispatch moisture in kg. Maintain physical transfers before burden allocation; the reference row equals 1 kg."
      inputs:
        - "campaign records"
        - B
      output: "exchange quantity per 1 kg reference flow"
      source_ids: []
    - id: wood_balance
      applies_to: "sawdust_input; flour_output; dust_waste; screen_reject; pm25; pmcoarse; pmover10"
      rule: "Dry incoming wood plus opening dry-wood stock equals dispatched dry flour plus disposed dry wood plus emitted dry wood particles plus closing dry-wood stock, subject to disclosed measured uncertainty. Internal returns cancel; unexplained residuals remain a quality gap."
      inputs:
        - "wet/dry masses"
        - stocks
        - "particle composition"
      output: "unallocated physical balance"
      source_ids:
        - usda-wood-handbook-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Keep each exchange physically or chemically specific. The reference uses a verified foreground wood-material locator only with the exact flour qualifiers; unresolved return/waste UUIDs remain concrete identity gaps and must be resolved before declaring the corresponding foreground dataset complete. A Product flow locator cannot replace a Waste or Elementary flow, and identity verification cannot establish supplier-background compatibility or measured quantity."
      evidence: "Direct identity and property/unit confirmation"
    - id: dq_grade
      applies_to: "flour_output"
      requirement: "Retain size distribution, moisture basis and test records; do not apply foreign tariff sieve limits as a universal CPC flour specification."
      evidence: "Batch specifications and sample records"
    - id: dq_coverage
      applies_to: "all inventory rows"
      requirement: "Disclose unmeasured sources, detection limits and route exclusions. Add every actually detected species as its own atomic exchange; unknown does not mean zero. Conditional absence requires a documented actual assessment, including oil mist, leaks and other emissions when relevant."
      evidence: "Completeness and uncertainty review"
validation_rules:
  - rule_id: v_reference
    applies_to: "flour_output"
    rule: "Exactly one accepted reference output has 1 kg net dispatch flour; all rows and collection denominators agree in both languages. The verified foreground reference UUID and required concrete flour qualifiers must be complete. Its broad physical identity does not establish actual provider/background compatibility or collected amounts."
    source_ids: []
  - rule_id: v_route
    applies_to: "flour_mill"
    rule: "Reject wood wool, bonding, chemical treatment, onsite drying/heating or combustion as this route. Do not infer applicability from CPC alone."
    source_ids:
      - hmrc-wood-classification
      - clemons-wood-flour-2005
  - rule_id: v_returns
    applies_to: "oversize_return; oversize_reinput; captured_dust_return; captured_dust_reinput"
    rule: "Both ends of each return pair carry equal physical mass and moisture; every dust portion has one destination, with no double counting of waste and air emissions."
    source_ids: []
  - rule_id: v_air
    applies_to: "pm25; pmcoarse; pmover10; water_vapour"
    rule: "Check outdoor-air medium, nonoverlapping aerodynamic bins and emission controls; cumulative PM must not be added to its component bins. Water releases to water or indoor-air exposure records cannot replace outdoor-air flows."
    source_ids: []
  - rule_id: v_balance
    applies_to: "flour_mill"
    rule: "Reconcile wood-water-carbon stocks, transfers and losses before allocation; then check the burden ledger separately. Require unresolved measurements or unsupported allocation to remain explicit."
    source_ids:
      - usda-wood-handbook-2021
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Supply a declared unbound flour grade to material manufacturing, with boundary and identity evidence"
  allowed_use: "The matching flour grade, moisture and dry-feed electrical route only"
  excluded_use: "Wood wool; insulation performance; finished composites; onsite thermal drying or fuel combustion; arbitrary all-wood averages"
  required_metadata: "Site/time; grade; species; size; moisture basis; waste input status; upstream burden; electricity supply; dust destinations and controls"
  required_quality_disclosure: "Measurement completeness; unresolved identities; unallocated balances; burden allocation; sampling and model uncertainty"
