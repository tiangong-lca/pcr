review_metadata:
  source_flow_classification_review:
  - flow_uuid: e64eb06c-6dc9-45f1-b003-3dc6c44b27e2
    row_ids:
    - film
    reported_classification: CPC 29220 luggage and handbags
    physical_identity_evidence: Concordant polyethylene-film names, CAS 9002-88-4 and physical-film comment.
    qualification: Actual polyethylene-film material/state and grade, supplier and provider boundaries must match;
      no generic packaging background is implied.
    review_state: Source classification inconsistency unresolved; source/provider clarification required. No fully
      verified classification or background compatibility claim.
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  scientific_review: "pending independent review; no methodology or translation approval claimed"
  authoring_scope: "uncoated unpreserved broad thin wood wafers with non-deliberate random layup; powdered PF resole and conditional neat petroleum paraffin; externally supplied indirect steam heat, electric handling and dry dust collection; no onsite combustion, RTO, wet scrubber or sanding"
  classification_assessment:
    proposed_relation: "narrower"
    reason: "31439 residual label is broader than the supported random-wafer PF route. Deliberately oriented long narrow OSB and uncoated UF particleboard have separate architectures; no accepted mapping written."
  unresolved_flow_rows:
    - row_id: "conifer_logs"
      flow: "Untreated coniferous panel logs with bark"
      reason: "Other-roundwood records exclude pulpwood/sawlogs; site panel-log grade and bark state are not established. Prepared OSB logs already remove bark and fix a different entry condition."
    - row_id: "hardwood_logs"
      flow: "Untreated non-coniferous panel logs with bark"
      reason: "Other-roundwood records exclude pulpwood/sawlogs; panel-log supply grade and bark state are not established. Do not assume all waferboard logs fall in this residual class."
    - row_id: "steam"
      flow: "Purchased heating steam"
      reason: "Candidate fixes 0.45 MPaG; actual pressure/state and supplier per-kg steam/background/return boundary not established. No MJ identity or default enthalpy substituted."
    - row_id: "oil"
      flow: "Petroleum lubricating oil for waferboard machinery"
      reason: "Petroleum candidate fixes 40.5 MJ/kg; actual grade/additives and matching specification not established; synthetic/wax-solvent variants are different materials."
    - row_id: "strap"
      flow: "Polypropylene packaging strap"
      reason: "PP resin, filament and twine are not finished flat packaging strap."
    - row_id: "bark"
      flow: "Untreated bark fuel coproduct"
      reason: "No saleable bark product confirmed. Waste bark and mixed hog fuel cannot substitute its coproduct identity."
    - row_id: "fines"
      flow: "Unresinated dry wood wafer fines fuel coproduct"
      reason: "Mixed hog fuel and volume-only Wood Chip do not establish this separate dry fines product and mass-basis quantity."
    - row_id: "condensate"
      flow: "Steam condensate returned to supplier"
      reason: "No exact return-condensate exchange established; unspecified steam or raw water cannot establish actual return state and supplier credit boundary."
    - row_id: "trim_waste"
      flow: "Cured PF waferboard offcut waste"
      reason: "No exact cured PF waferboard offcut waste confirmed; metal chips, untreated wood and generic plastic residues rejected."
    - row_id: "bonded_dust"
      flow: "Collected cured PF waferboard sawing dust waste"
      reason: "Untreated sawdust and cork dust cannot identify resin-bound board dust."
    - row_id: "fines_waste"
      flow: "Unresinated wood wafer screening fines waste"
      reason: "No exact wafer-screening fine waste confirmed; sawdust is not automatically all screened wafers."
    - row_id: "wastewater"
      flow: "Waferboard cleaning wastewater sent to external treatment"
      reason: "Direct-discharge cleaning wastewater or unrelated textile/coal effluent is not this technosphere treatment input."
    - row_id: "pf_waste"
      flow: "Uncured PF resin powder waste"
      reason: "No exact uncured PF powder waste confirmed; generic residues and waste paint not substituted."
    - row_id: "condensable_pm"
      flow: "Condensable organic particulate matter"
      reason: "Unspecified PM and specific aerodynamic-size particles do not establish condensable organic particulate identity or sampling overlap; retain this exact physical exchange and uncertainty."
  quantity_background_compatibility:
    pf_powder: "Verify uncured powdered resole formulation, solids, cure suitability and supplier background state; generic PF identity alone is insufficient."
    wax: "Use only neat/molten petroleum paraffin; verify supplied grade and background. Catalog calorific qualifier supplies no default quantity or sizing dose."
    electricity: "Verify <1kV equipment-use metering, upstream transformation/loss boundary and regional mix."
    steam: "Measure incoming and return mass/pressure/temperature/quality and supplier delivery/background/credit definition. Neither kg nor MJ alone establishes net useful heat."
    reference: "Verify actual broad wafer geometry/random layup, PF chemistry, net dispatch mass and grade; finished class flow is identity only."
  evidence_limits:
    quantitative_defaults: "No industry averages or factory inventory parameters adopted. All activity values require actual site/supplier protocols."
    historical_products: "FPL-GTR-53 photographed waferboard specimen and FPL-RP-574 W1-W7 (1985 panels) establish historical physical products only. RP-574 does not prove species, PF chemistry or the selected heat route for any named mill."
    site_screen: "Add individually identified exchanges for any actual unlisted input, packaging loss, emitted species or waste before declaring a dataset complete. Changes to excluded energy/control/resin/coating routes require applicability review."
