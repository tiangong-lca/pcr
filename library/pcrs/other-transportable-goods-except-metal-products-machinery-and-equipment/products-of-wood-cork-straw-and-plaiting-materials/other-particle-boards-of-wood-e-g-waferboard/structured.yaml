allocation_rules:
  - rule_id: a_separate
    applies_to: "p_wafer"
    rule: "Keep the unallocated physical mass/water/carbon/energy account and internal transfers separately from the product-attributed environmental-burden account. Coproduct physical mass remains actual mass."
    source_ids:
      - ghg-allocation-2011
  - rule_id: a_hierarchy
    applies_to: "p_wafer"
    rule: "Use stage/source metering to avoid allocation. For remaining common burdens demonstrate a causal physical relationship; dry mass is admissible only when justified. Otherwise document consistent period-specific economic relationships and sensitivity; disclose prices and markets, with no automatic zero value or avoided-fuel credit."
    source_ids:
      - ghg-allocation-2011
  - rule_id: a_residue
    applies_to: "bark, fines, bark_waste, fines_waste"
    rule: "Classify each actual residue lot as sold coproduct, internal return or waste using destination evidence. These quantities are exclusive. Resin-bound residues stay distinct from unresinated wood and require their own treatment datasets."
    source_ids:
      - epa-waferboard-2002
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "p_wafer"
      flow_role: "finished board and denominator"
      record_type: "weighing_acceptance"
      raw_fields: "site; period; lot; accepted net mass Q; moisture; grade/tests; actual dimensions/density; wafer geometry/orientation; PF recipe"
      collection_method: "Calibrated weighing excluding packaging/rejects; traceable acceptance and validated board moisture tests; sample wafer geometry and direction with forming-machine records; Aggregation calculation: Sum accepted net board mass Q; board output per 1 kg reference flow"
      unit: "kg"
      frequency: "each dispatch lot"
      temporal_coverage: "complete declared period"
      site_scope: "same site and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; tickets; recipe; photographs; tests"
    - protocol_id: cp_material
      process_id: "p_wafer"
      flow_role: "each input material and packaging"
      record_type: "stock_batch"
      raw_fields: "row_id; lot; stage; supplier; composition and measured elemental fractions including C/H/O and biogenic/fossil carbon origins; supplied PF moisture/solids; uncured/cured state and actual cure extent; wet/dry mass; moisture; opening/purchases/closing stock; returns"
      collection_method: "Calibrated separate weighing, stock reconciliation, supplier certificates, untreated-wood oven-dry sampling and laboratory/supplier elemental-composition and carbon-origin records; verify PF solids/cure suitability and petroleum wax grade; retain supplier formulation, press time/temperature and representative before/after composition or validated reaction-extent measurements, separating physical volatile losses from reaction products; no assumed full cure; Aggregation calculation: Separate physical attributable totals / Q; per 1 kg reference flow"
      unit: "kg"
      frequency: "each batch and stock close"
      temporal_coverage: "complete declared period"
      site_scope: "same site and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing/calibration; stock closure; formulation"
    - protocol_id: cp_utility
      process_id: "p_wafer"
      flow_role: "electricity and tap water separately"
      record_type: "submeter"
      raw_fields: "row_id; stage; meter; voltage; kWh; tap-water kg; density if volume measured; stock/losses; shared-use drivers"
      collection_method: "Calibrated stage meters reconciled to supplier bills; electricity transformation/loss boundary and water supply identity verified; Aggregation calculation: Each attributable total / Q; electricity converted to MJ; per 1 kg reference flow"
      unit: "kWh; kg"
      frequency: "continuous meters and monthly reconciliation"
      temporal_coverage: "complete declared period"
      site_scope: "same site/voltage/source"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; bills; loss reconciliation"
    - protocol_id: cp_steam
      process_id: "p_wafer"
      flow_role: "steam inlet and condensate return separately"
      record_type: "enthalpy_balance"
      raw_fields: "stage; inlet/return mass; pressure; temperature; steam quality; vent/leak mass; stock; supplier enthalpy convention and return credit"
      collection_method: "Calibrated mass meters and state sensors; validated steam-property method; signed supply/background definition; reconcile each stage and whole delivery system; Aggregation calculation: Incoming steam kg / Q and outgoing condensate kg / Q separately; net enthalpy separately reconciled; per 1 kg reference flow"
      unit: "kg; MJ"
      frequency: "continuous with each supply-state change"
      temporal_coverage: "complete declared period"
      site_scope: "same supplier and site delivery/return gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; states; supplier boundary; uncertainty"
    - protocol_id: cp_residue
      process_id: "p_wafer"
      flow_role: "each coproduct and waste"
      record_type: "weighing_destination"
      raw_fields: "row_id; stage; lot; wet/dry mass; resin contamination; sale value; destination; waste status; stock; internal-return id"
      collection_method: "Separate calibrated weighing and destination tickets; sample composition/moisture; audit that sold/waste/internal lots are exclusive; Aggregation calculation: Each actual external stream total / Q; physical outputs are not allocation-weighted; per 1 kg reference flow"
      unit: "kg"
      frequency: "each residue lot"
      temporal_coverage: "complete declared period"
      site_scope: "same site and identified destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tickets; classification; stock/transfer closure"
    - protocol_id: cp_emission
      process_id: "p_wafer"
      flow_role: "each species and particle fraction"
      record_type: "outlet_sampling"
      raw_fields: "row_id; source/stage; control; species/CAS; phase; outlet gas flow; concentration; wet/dry/standard conditions; time; detection limit; filterable/condensable basis"
      collection_method: "Representative controlled-outlet tests plus run-hour/flow records, with fugitive estimates separately justified; verify three nonoverlapping filterable PM fractions and VOC/condensable overlap; Aggregation calculation: Each species/fraction integrated physical mass / Q; per 1 kg reference flow; no second shared-stack count"
      unit: "kg"
      frequency: "representative campaigns and each recipe/control change"
      temporal_coverage: "all declared operating regimes and seasonality"
      site_scope: "same site and controlled outlet"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "test method; detection/uncertainty; control/run logs"
    - protocol_id: cp_water
      process_id: "p_wafer"
      flow_role: "evaporation and water closure"
      record_type: "water_balance"
      raw_fields: "wood/carrier water; steam; tap water; board/residue water; wastewater; condensate; vents; opening/closing water stock; stage-specific H2O formation/consumption; actual composition/cure extent and reaction evidence; gas inlet/outlet moisture and composition where applicable"
      collection_method: "Traceable moisture and flow measurements; reconcile all water paths and independently evidenced reaction terms with cp_material, cp_reference, cp_steam, cp_residue and cp_emission. Distinguish press condensation water from supplied moisture and utility steam/return. A separately reviewed biological-control expansion requires inlet/outlet gas, oxygen demand, media/biomass, liquid and stock records and actual degradation extent; it is not admitted by this protocol. Aggregation calculation: Actual emitted water mass / Q; per 1 kg reference flow; retain reaction-term uncertainty and unexplained residual; missing reaction evidence is not zero"
      unit: "kg"
      frequency: "each campaign and period close"
      temporal_coverage: "complete declared period"
      site_scope: "same integrated site boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "paired water paths; moisture method; formulation/cure or admitted biological-reaction evidence; component/element reconciliation; uncertainty"
    - protocol_id: cp_allocation
      process_id: "p_wafer"
      flow_role: "burden attribution separately from physical inventory"
      record_type: "attribution_account"
      raw_fields: "direct stage burdens; common burdens; causal driver; measured product dry masses; sales/prices; boundary; sensitivity"
      collection_method: "Audit metered subdivision first, then documented physical/economic relationships; retain separate allocation matrix and immutable physical stream account; Aggregation calculation: Attributed environmental burden / Q; physical stream totals unchanged; per 1 kg reference flow"
      unit: "kg; MJ; currency"
      frequency: "each declared period and allocation change"
      temporal_coverage: "same period as inventory"
      site_scope: "same site and common process"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "driver justification; prices; reconciliation; sensitivity"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "For each actual physical exchange use its attributable period total divided by Q; the finished output is exactly 1 kg. Q is positive net accepted wet dispatch mass."
      inputs:
        - Q
        - "period totals"
        - cp_reference
      output: "each exchange per 1 kg reference flow"
      source_ids:
        - epa-waferboard-2002
    - id: dry_wood_account
      applies_to: "conifer_logs, hardwood_logs"
      rule: "For each untreated wood batch dry wood = wet wood/(1+u); water = wet wood-dry wood. Retain separate binder/wax solids and carbon origins in the board and wastes; do not equate oven-dry board with dry wood."
      inputs:
        - "wet mass"
        - "dry-basis u"
        - cp_material
      output: "physical dry matter and water ledgers"
      source_ids:
        - usda-wood-moisture-2021
    - id: steam_enthalpy
      applies_to: "steam, condensate"
      rule: "Net delivery enthalpy = incoming mass × inlet enthalpy minus returned mass × return enthalpy minus other outgoing stream enthalpies minus increase in stored energy, with explicit common datum. Resolve heat loss, vents and useful stage heat separately. Supplier return credits require its background convention; neither incoming steam mass nor catalog energy unit alone is net useful heat."
      inputs:
        - "inlet/return/outgoing states"
        - mass
        - stock
        - cp_steam
      output: "reconciled energy account and compatible steam linkage"
      source_ids:
        - epa-waferboard-2002
    - id: pm_partition
      applies_to: "pm25, pmcoarse, pmover10, condensable_pm"
      rule: "For paired compatible filterable measurements: fine=PM2.5; coarse=PM10-PM2.5; large=total filterable PM-PM10. All are nonnegative; uncertainty and matching sampling conditions are mandatory. Do not add cumulative PM10/total again. Condensable measurements and molecular VOC mass remain phase-resolved without duplication."
      inputs:
        - "paired outlet tests"
        - cp_emission
      output: "disjoint physical particulate and molecular species inventory"
      source_ids:
        - epa-waferboard-2002
    - id: physical_closure
      applies_to: "p_wafer"
      rule: "For the same period and boundary, whole-stream mass obeys opening stock + external inputs = finished board + actual coproducts + waste + elementary releases + closing stock; include relevant gas-side mass exchanges where present. Elemental accounts obey the same equation for each relevant element, including C/H/O, with biogenic/fossil carbon origins separate; reactions do not generate mass or elements. Molecular H2O and each defined reactive species/material class j instead obey opening_j + inputs_j + formation_j = outputs_j + closing_j + consumption_j, using consistent component definitions, units and scope. Determine formation/consumption from actual formulation, composition and measured or independently validated reaction extent: PF press condensation changes resin solids and forms water; a separately reviewed biological-control expansion transforms organics into water, CO2, biomass and other actual products with oxygen uptake. Do not impose external-only dry-matter/H2O closure, full cure, complete degradation or universal yields. Keep supplied/carrier water, reaction water, evaporation and the utility steam/return circuit distinct; phase transfers do not create H2O. Internal transfer endpoints agree and cancel at plant level. Report unexplained residuals and propagated uncertainty without treating residuals as reaction evidence. Matched internal handoffs require the same measured quantity and physical/chemical state at both endpoints."
      inputs:
        - "all stream totals"
        - stock
        - "elemental/component composition"
        - "actual reaction extent"
        - cp_material
        - cp_water
        - cp_residue
        - cp_emission
        - cp_steam
      output: "unallocated whole-mass/element and reaction-aware component accounts"
      source_ids:
        - epa-waferboard-2002
        - conner-wood-adhesives-2001
    - id: burden_attribution
      applies_to: "p_wafer"
      rule: "Attribute direct burdens first. Apply justified allocation shares only to remaining common environmental burdens, with shares summing to one for the same scope. Preserve all physical product quantities; product-attributed burden divided by Q forms the downstream dataset."
      inputs:
        - "direct/common burdens"
        - "allocation drivers"
        - cp_allocation
        - Q
      output: "separate product-attributed burden account"
      source_ids:
        - ghg-allocation-2011
  data_quality_requirements:
    - id: dq_identity
      applies_to: "p_wafer"
      requirement: "Verify actual wood-wafer geometry/random architecture, uncured PF recipe, product acceptance and exclusions. A trade name or class label is insufficient."
      evidence: "forming logs; geometry photos/tests; supplier certificates"
    - id: dq_coverage
      applies_to: "all inventory rows"
      requirement: "Cover a complete representative operating period and all measured regimes; distinguish measured zero, below detection, absence and missing measurement. Missing UUID or supplier quantity/background compatibility remains explicit; complete datasets cannot silently substitute. Define water, dry solids and reactive components consistently; support reaction terms with actual composition/extent evidence and reconcile to whole mass/elements. Oven loss, stock corrections and unexplained residuals do not prove reaction water; unresolved terms prevent a complete component-balance claim."
      evidence: "row coverage; calibration; uncertainty; supplier definitions; formulation/cure records; component and elemental accounts"
    - id: dq_limits
      applies_to: "p_wafer"
      requirement: "Historical EPA/FPL sources supply method context only. Do not transfer softwood-sawmill CORRIM quantities, sawmill dust factors or boiler factors to waferboard indirect drying/pressing. Add individual rows for additional actual exchanges and retain phase-specific emissions."
      evidence: "scope/route comparison; site screening; original methods"
validation_rules:
  - rule_id: v_reference
    applies_to: "finished_waferboard"
    rule: "Exactly one finished reference output has 1 kg net accepted board; Q is positive and every row/protocol uses the same denominator. Reject duplicate reference intermediates, packaged-mass denominators and mismatched EN/ZH definitions."
    source_ids:
      - epa-waferboard-2002
  - rule_id: v_architecture
    applies_to: "p_wafer"
    rule: "Require broad-thin wafer geometry and nondeliberate random forming proof, actual PF chemistry/grade and declared heat/control route. Reject long-strand oriented OSB, fine UF particleboard and excluded variants."
    source_ids:
      - usda-waferboard-types-1986
  - rule_id: v_balance
    applies_to: "p_wafer"
    rule: "Before burden allocation audit whole-stream mass, relevant elements including C/H/O with origin-separated carbon, reaction-aware H2O/reactive-component accounts and the separate energy account; transfer pairs agree. Require actual composition/cure extent and justified formation/consumption terms, not external-only dry-matter/water closure or a residual-based cure yield. Do not presume full cure or zero reaction water; unresolved terms require review and prevent a complete balance claim. Any biological-control expansion requires separate applicability review and actual gas/liquid/media/biomass and degradation evidence. Supplier steam conventions, voltage, PF/wax state and missing identities must be resolved before a complete linked dataset is claimed."
    source_ids:
      - usda-wood-moisture-2021
      - epa-waferboard-2002
      - conner-wood-adhesives-2001
  - rule_id: v_emission
    applies_to: "p_wafer"
    rule: "Use controlled-outlet species/phase quantities once, with nonoverlapping PM bins. Retain actual biogenic and fossil CO2 in upstream LCI and any separately reviewed onsite-combustion expansion; a GHG reporting convention cannot remove biogenic CO2 from the physical inventory. Disclose unmeasured species and do not claim complete coverage."
    source_ids:
      - epa-waferboard-2002
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Verified site/period random-wafer PF board production burden per 1 kg net accepted finished material"
  allowed_use: "Matching physical architecture, formulation and pilot route; link actual upstream supply and destination processes with disclosed allocation"
  excluded_use: "Generic other-board or OSB/UF proxy; structural-service equivalence; current legal/grade certification; incomplete UUID/steam/PF/wax background links"
  required_metadata: "Required qualifiers; site/period; upstream gates; methods; all flow quantities and identities; physical balance and allocation accounts; original source locators"
  required_quality_disclosure: "Missing/conditional rows, detection/uncertainty, identity versus quantity/background compatibility, exclusions, representativeness and historical-source limits"
  update_trigger: "Species/wafer architecture, PF/wax supply, product grade, steam/electricity boundary, controls, destination, missing identity or site-period changes"
data_sources:
  - id: "epa-waferboard-2002"
    type: "official_guidance"
    reference: "US EPA. AP-42 §10.6.1 Waferboard/Oriented Strandboard Manufacturing, March 2002. https://www.epa.gov/sites/default/files/2020-10/documents/c10s06-1.pdf"
    used_for: "§10.6.1.1–.3, printed pp.10.6.1-1–4 and Figure 10.6.1-1: historical route/random layup/pressing/finish. Table 10.6.1-3 p.12 describes direct wood-fired softwood OSB drying; only candidate species/CAS labels used for site screening, no transfer of presence, rates or control performance to this indirect route. Printed p.10.6.1-5 describes biological formation of water/CO2/salts only for a separately reviewed control expansion; no degradation yield is adopted."
  - id: "usda-waferboard-types-1986"
    type: "handbook"
    reference: "Carll, C.G. Wood particleboard and flakeboard: types, grades, and uses. FPL-GTR-53, November 1986. https://research.fs.usda.gov/download/treesearch/5677.pdf"
    used_for: "Printed pp.1,5 and Figure 2: broad terminology, typical PF type-2 context, real broad-wafer specimen, narrower oriented OSB; no current grade/strength defaults."
  - id: "usda-commercial-panels-1999"
    type: "literature"
    reference: "Laufenberg, T.L.; Palka, L.C.; McNatt, J.D. Creep and creep-rupture behavior of wood-based structural panels. FPL-RP-574, June 1999. https://research.fs.usda.gov/download/treesearch/5817.pdf"
    used_for: "Abstract, printed pp.1–2 and Table 1: real 1985 commercial minimally aligned waferboard W1–W7 and sampling limitations. Not evidence for W4 species, PF chemistry, heat route, modern recipes, service life or emissions."
  - id: "usda-wood-moisture-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory. Wood handbook—wood as an engineering material. FPL-GTR-282, 2021. https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Chapter 4, printed p.4-1, equations 4-1/4-2: dry-basis wood moisture definition, not an assumed species moisture/density or a resin-panel oven-loss rule."
  - id: "ghg-allocation-2011"
    type: "standard"
    reference: "WRI/WBCSD. Product Life Cycle Accounting and Reporting Standard, 2011, Chapter 9 p.63 Tables 9.1–9.2. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Allocation avoidance and documented physical/economic relationships only. No GHG-only exclusion of physical LCI emissions or predefined residue prices/shares."
  - id: "conner-wood-adhesives-2001"
    type: "literature"
    reference: "Conner, A.H. Wood: Adhesives. Encyclopedia of Materials: Science and Technology, 2001, pp.9583–9599. https://research.fs.usda.gov/download/treesearch/9099.pdf"
    used_for: "§2.1(a), PDF pp.2–3 and Figure 2: PF resole condensation water, further heat curing and powdered resole use in waferboard. Mechanism only; no example formulation, solids content, cure completion or reaction yield adopted."
