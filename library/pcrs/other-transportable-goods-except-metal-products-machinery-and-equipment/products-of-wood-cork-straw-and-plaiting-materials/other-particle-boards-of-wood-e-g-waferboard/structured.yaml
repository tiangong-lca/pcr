system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Use one integrated foreground unit p_wafer through packing. Preserve independent stage records s_receive (yard/thaw/debark/crosscut), s_wafer (waferizing), s_dry (indirect drying and screening), s_blend (powder PF/neat wax), s_form (gravity random forming), s_press, s_finish (cooling/trim), s_pack and s_control (dry collection/cleaning). Internal transfer pairs must agree in actual quantity and state; no intermediate board shares the final reference UUID. [epa-waferboard-2002]"
      source_ids: []
    - rule_id: b_route
      applies_to: "p_wafer"
      rule: "Verify the full declared route. Direct-fired dryers, onsite fuel-burning boilers/RTOs, wet controls, sanding and surface treatments are outside this pilot and cannot disappear behind purchased-heat wording; review and add their exact inventories before applying an expanded method."
      source_ids:
        - epa-waferboard-2002
    - rule_id: b_stack
      applies_to: "p_wafer"
      rule: "Record outlet emissions after actual dry controls once per stack/source. Capture is a solid residue, not an atmospheric release. Dryer, press/cooling and trim sources remain separately traceable."
      source_ids:
        - epa-waferboard-2002
    - rule_id: b_heat
      applies_to: "steam, condensate"
      rule: "External steam generation is upstream. Include physical incoming steam, returned condensate, actual losses and net enthalpy reconciliation; do not additionally book provider fuel as onsite fuel or create an unmetered heat export."
      source_ids:
        - epa-waferboard-2002
boundary_abstraction:
  declared_starting_condition: "Receiving gate for untreated coniferous/non-coniferous panel logs with recorded bark and moisture; electric in-yard handling"
  starting_condition_role: "foreground_entry"
  product_classification_scope: "Physical random-wafer PF pilot subset of CPC 3.0 31439"
  recursive_input_rule: "Purchased finished waferboard is not raw log furnish. Internal wafers, mats, rework and dust returns stay in stage transfer/stock records; one final finished reference output only."
  upstream_dataset_requirement: "Matching log forestry/preparation and receiving freight; powdered PF/wax, electricity at stated voltage, delivered steam with agreed return convention, water and packaging supply; each external waste treatment. All upstream combustion emissions remain in linked inventories."
  disclosure: "Gate-to-gate foreground plus explicit upstream links for cradle-to-gate use. Installation, use and end of life are separately modelled. Disclose capital equipment/cut-offs and any missing supply activity."
