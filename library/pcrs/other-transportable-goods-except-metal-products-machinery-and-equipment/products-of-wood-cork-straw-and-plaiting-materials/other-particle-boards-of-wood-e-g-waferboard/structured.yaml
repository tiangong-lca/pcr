measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Calibrated net accepted dispatch board mass in cp_reference, excluding packaging and rejects."
  - id: same_denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Reference product mass"
      uuid: ""
    required_unit: "kg"
    rule: "Every row uses per 1 kg reference flow; sum actual attributable period totals and divide by Q, the net accepted finished-board mass from cp_reference."
  - id: moisture_basis
    applies_to: "wood and board"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For untreated wood collect wet and ovendry mass: u=(wet-dry)/dry, dry=wet/(1+u). Distinguish percent from fractions and wet-basis moisture. For bonded panels use a validated moisture method distinguishing water loss from volatile/cure losses; wood dry mass excludes binder/wax solids. [usda-wood-moisture-2021]"
  - id: energy_basis
    applies_to: "electricity, steam, condensate"
    required_property_ref:
      name: "Energy and mass"
      uuid: ""
    required_unit: "MJ; kg"
    rule: "Meter electricity at the declared voltage; 1 kWh = 3.6 MJ. Steam inventory uses measured kg and a separate net enthalpy account from inlet/return/loss states. Match supplier background delivery and return credit definitions before linkage."
