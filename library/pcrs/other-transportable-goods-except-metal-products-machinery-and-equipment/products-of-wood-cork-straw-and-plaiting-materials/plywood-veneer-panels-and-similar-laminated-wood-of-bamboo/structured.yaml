functional_unit:
  what: "Provide an accepted unoverlaid PF woven-mat bamboo panel at the factory gate"
  how_much: "1 m3 net solid geometrical panel volume, excluding packaging and stack voids"
  how_well: "Declare measured panel dimensions, moisture and density, PF formulation/solids, layer/weave construction, bond-test and grade acceptance records; no invented legal grade"
