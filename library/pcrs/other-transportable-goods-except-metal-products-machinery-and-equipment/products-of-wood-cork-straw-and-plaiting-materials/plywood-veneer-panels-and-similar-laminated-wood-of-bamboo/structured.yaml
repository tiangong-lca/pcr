    used_for: "Commercial woven-sliver mat board and reported adoption limitations; no plant parameters"
  - id: "itto-woven-mat-2014"
    type: "official_guidance"
    reference: "Krisdianto Sugiyanto. ITTO PD 600/11 Rev.1 (I), Activity 3.4: Identify Appropriate Bamboo Processing Technologies for a Small-scale Processing Plant. Bogor, June 2014. Appendix 1, printed pp.25–28, credits Zhang Qisheng et al., INBAR Technical Report 26 (2002). https://www.itto.int/files/itto_project_db_input/2981/Technical/E-PD-600-11-R1-I-Technical%20Report-Act-3.4.pdf"
    used_for: "Official technical compilation: purchased untreated mat state, drying, PF soaking/squeezing, maturation/redrying, layup/hot pressing, cool/edge/check; no numeric defaults or original trial claims. Balance/collection rules are authored measurement requirements"
  - id: "inbar-industrial-bamboo-2015"
    type: "literature"
    reference: "The environmental impact of industrial bamboo products: Life-cycle assessment and carbon sequestration. INBAR Technical Report 35, second edition, 2015, chapter 3, printed pp.15–21. https://repository.tudelft.nl/file/File_877d4812-8c8d-446e-a048-5c14cb9994b9"
    used_for: "Exclusion distinctions: strip lamination, compression/strand-woven and flattening; case recipes/densities and full-life carbon credit results not adopted. Source-separated carbon accounting is an authored requirement"
  - id: "epa-plywood-2002"
    type: "official_guidance"
    reference: "U.S. EPA. AP-42 Section 10.5 Plywood Manufacturing, January 2002, section 10.5.3, printed pp.10.5-3–4. https://www.epa.gov/sites/default/files/2020-10/documents/c10s05.pdf"
    used_for: "Qualitative wood-process emission monitoring checklist only; actual bamboo/PF species and quantities require site testing. No wood/boiler factor transferred; particulate partition is an authored consistency rule"
