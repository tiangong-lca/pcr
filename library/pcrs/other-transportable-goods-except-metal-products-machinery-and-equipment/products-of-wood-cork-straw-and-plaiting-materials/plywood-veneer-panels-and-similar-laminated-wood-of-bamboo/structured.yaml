allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "p_panel"
    rule: "Separate lots/routes and stage meters before attributing burdens to this panel. In-scope accepted panels receive their measured activities and associated losses. Allocate common utilities only from a documented causal meter/engineering relation; retain unallocated site totals and sensitivity."
    source_ids:
      - itto-woven-mat-2014
  - rule_id: allocation_residues
    applies_to: "p_panel"
    rule: "Rejects, bonded offcuts, captured dust, adhesive purge and film scrap are waste in the default route; include their destination-specific treatment burdens without avoided-product credits. If a genuinely sold coproduct exists, first establish its distinct state/identity and quantity, subdivide and document the justified remaining allocation method for independent review. Waste value alone does not establish product function."
    source_ids:
      - itto-woven-mat-2014
  - rule_id: allocation_physical
    applies_to: "p_panel"
    rule: "Preserve physical input/output and internal transfer quantities before allocation. An attribution fraction applies to environmental burdens, not mechanically to a measured coproduct mass or stock change. Do not multiply both ends of a physical link differently."
    source_ids:
      - itto-woven-mat-2014
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "p_panel"
      flow_role: "finished panel"
      record_type: "acceptance and geometry"
      raw_fields: "lot; species; weave; layers; PF batch; count; measured length/width/thickness; dispatch moisture method/basis; net mass; grade; reject/rework; V"
      collection_method: "Use calibrated dimension instruments and net weighing, lot acceptance tests and a matrix-validated moisture method. Sum accepted solid volumes; exclude packaging/stack voids and reconcile dispatch stock."
      unit: "m3; kg; moisture fraction"
      frequency: "Each lot and stage; meters continuous where available"
      temporal_coverage: "One disclosed representative production campaign including idle/rework and stock endpoints"
      site_scope: "Named panel line, supplier lots and linked utilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; assays; lot pairing; acceptance; supplier/destination records; uncertainty"
    - protocol_id: cp_material
      process_id: "p_panel"
      flow_role: "mat and release inputs"
      record_type: "weighing and supplier record"
      raw_fields: "delivery id; material state; species; formulation; opening/closing stock; receipt; returns; consumption; moisture; density"
      collection_method: "Weigh lots with calibrated scales; reconcile receipts and stocks. Verify untreated mats and exact release formulation with supplier records and tests."
      unit: "kg"
      frequency: "Each lot and stage; meters continuous where available"
      temporal_coverage: "One disclosed representative production campaign including idle/rework and stock endpoints"
      site_scope: "Named panel line, supplier lots and linked utilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; assays; lot pairing; acceptance; supplier/destination records; uncertainty"
    - protocol_id: cp_resin
      process_id: "p_panel"
      flow_role: "PF bath"
      record_type: "batch stock and assay"
      raw_fields: "adhesive lot; wet mass; solids assay; water; free phenol/formaldehyde/methanol; formulation; fresh feed; bath return; squeeze return; opening/closing bath; purge"
      collection_method: "Weigh fresh adhesive and bath stocks; assay lot solids/water/free species with validated methods. Measure mat uptake and returned squeeze liquid separately; only external net supply is an input."
      unit: "kg; fraction"
      frequency: "Each lot and stage; meters continuous where available"
      temporal_coverage: "One disclosed representative production campaign including idle/rework and stock endpoints"
      site_scope: "Named panel line, supplier lots and linked utilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; assays; lot pairing; acceptance; supplier/destination records; uncertainty"
    - protocol_id: cp_energy
      process_id: "p_panel"
      flow_role: "electricity"
      record_type: "meter record"
      raw_fields: "receiving voltage; provider geography/year; main meter; stage kWh; transformer losses; idle/rework; shared load allocation evidence"
      collection_method: "Read calibrated receiving and stage meters; reconcile stage sums, common services and receiving total. Keep route-specific electricity and heat separately."
      unit: "kWh; MJ"
      frequency: "Each lot and stage; meters continuous where available"
      temporal_coverage: "One disclosed representative production campaign including idle/rework and stock endpoints"
      site_scope: "Named panel line, supplier lots and linked utilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; assays; lot pairing; acceptance; supplier/destination records; uncertainty"
    - protocol_id: cp_heat
      process_id: "p_panel"
      flow_role: "purchased net steam heat"
      record_type: "meter and enthalpy record"
      raw_fields: "provider; billing quantity basis; steam mass; pressure; temperature; dryness; supply enthalpy; condensate mass/temperature/enthalpy; vent/leak; reference state; net heat; distribution losses"
      collection_method: "Measure steam delivery and all return/loss paths; use validated thermodynamic property tables with documented state reference. Obtain provider agreement on net-delivered versus gross-production basis and condensate credit. Without correspondence, report unresolved, not zero."
      unit: "kg; MJ; pressure; temperature"
      frequency: "Each lot and stage; meters continuous where available"
      temporal_coverage: "One disclosed representative production campaign including idle/rework and stock endpoints"
      site_scope: "Named panel line, supplier lots and linked utilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; assays; lot pairing; acceptance; supplier/destination records; uncertainty"
    - protocol_id: cp_water
      process_id: "p_panel"
      flow_role: "water and wastewater"
      record_type: "water meters and composition ledger"
      raw_fields: "fresh dilution/cleaning/make-up; adhesive carrier; mat/panel water; return/recycle; wastewater mass; density; evaporation; validated reaction-generated/consumed water; steam-loop water; storage change; contamination; destination"
      collection_method: "Meter fresh water; weigh or volume-meter waste with measured density. Reconcile constituent water with dry solids and actual outlets; any chemically generated/consumed water requires measured or validated reaction evidence, not an unexplained balance residual. Keep steam/condensate utility-loop mass separate from the panel-material water ledger while preserving both."
      unit: "kg; m3; fraction"
      frequency: "Each lot and stage; meters continuous where available"
      temporal_coverage: "One disclosed representative production campaign including idle/rework and stock endpoints"
      site_scope: "Named panel line, supplier lots and linked utilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; assays; lot pairing; acceptance; supplier/destination records; uncertainty"
    - protocol_id: cp_waste
      process_id: "p_panel"
      flow_role: "solid and adhesive waste"
      record_type: "weighing and destination manifest"
      raw_fields: "lot; separate waste state; wet mass; water; bamboo dry mass; PF solids; fossil/biogenic carbon; collector stocks; treatment destination; recovery evidence"
      collection_method: "Weigh separately segregated waste loads and collector stocks; sample composition; retain actual offsite treatment and return/rework records. No air-emission duplication."
      unit: "kg; fraction"
      frequency: "Each lot and stage; meters continuous where available"
      temporal_coverage: "One disclosed representative production campaign including idle/rework and stock endpoints"
      site_scope: "Named panel line, supplier lots and linked utilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; assays; lot pairing; acceptance; supplier/destination records; uncertainty"
    - protocol_id: cp_pack
      process_id: "p_panel"
      flow_role: "LDPE film"
      record_type: "issue/stock and waste record"
      raw_fields: "film grade; net issued; unused return; delivered wrap; scrap; opening/closing stock; treatment; carbon composition"
      collection_method: "Weigh film issuance, finished wrap and waste; reconcile packaging stocks independent of panel reference geometry and net mass."
      unit: "kg"
      frequency: "Each lot and stage; meters continuous where available"
      temporal_coverage: "One disclosed representative production campaign including idle/rework and stock endpoints"
      site_scope: "Named panel line, supplier lots and linked utilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; assays; lot pairing; acceptance; supplier/destination records; uncertainty"
    - protocol_id: cp_air
      process_id: "p_panel"
      flow_role: "speciated organic air release"
      record_type: "outlet and fugitive sampling"
      raw_fields: "stage; chemical species; outlet; gas flow; concentration; wet/dry and normal/actual basis; sampling time; operating hours; controls; fugitives; detection limits; method; uncertainty"
      collection_method: "Sample actual bamboo/PF process emissions after controls with validated species methods and matched concentration/gas bases. Include curing and rework. Quantify fugitive paths without double counting captured outlet exhaust; retain below-detection intervals."
      unit: "kg; gas volume; concentration; h"
      frequency: "Each lot and stage; meters continuous where available"
      temporal_coverage: "One disclosed representative production campaign including idle/rework and stock endpoints"
      site_scope: "Named panel line, supplier lots and linked utilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; assays; lot pairing; acceptance; supplier/destination records; uncertainty"
    - protocol_id: cp_pm
      process_id: "p_panel"
      flow_role: "three disjoint particulate bins"
      record_type: "size-resolved outlet sampling"
      raw_fields: "paired PM2.5; PM10; total PM; outlet; aerodynamic cut; gas/time basis; filterable/condensable coverage; capture efficiency; uncertainty; collector mass"
      collection_method: "Use matched size-resolved after-control tests; preserve cumulative test values as QA, derive disjoint bins only on identical bases and investigate negative differences. Captured dust is not escaped PM."
      unit: "kg"
      frequency: "Each lot and stage; meters continuous where available"
      temporal_coverage: "One disclosed representative production campaign including idle/rework and stock endpoints"
      site_scope: "Named panel line, supplier lots and linked utilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; assays; lot pairing; acceptance; supplier/destination records; uncertainty"
    - protocol_id: cp_carbon
      process_id: "p_panel"
      flow_role: "biogenic and fossil carbon"
      record_type: "composition/stock and gas measurements"
      raw_fields: "dry bamboo mass; biomass carbon fraction; resin/release/film dry composition; fossil carbon fractions; product/waste/stock carbon; measured CO2 source attribution; other speciated carbon outlets; uncertainty"
      collection_method: "Measure material carbon fractions by representative lot assays and traceable formulation records; measure actual gas release and source attribution or retain unclassified carbon as incomplete. No default biomass fraction, resin carbon factor or assumed neutrality."
      unit: "kg C; kg CO2; fraction"
      frequency: "Each lot and stage; meters continuous where available"
      temporal_coverage: "One disclosed representative production campaign including idle/rework and stock endpoints"
      site_scope: "Named panel line, supplier lots and linked utilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; assays; lot pairing; acceptance; supplier/destination records; uncertainty"
    - protocol_id: cp_handoff
      process_id: "p_panel"
      flow_role: "all material stages"
      record_type: "paired lot transfer and stage settings"
      raw_fields: "sending/receiving lot; time; stage state; wet mass; dry bamboo; resin solids; water; free species; PF uptake; squeeze recycle; dry/mature/press schedules; temperature/pressure/duration; output acceptance; rework; stocks"
      collection_method: "Match both ends of each lot transfer at receipt, initial drying, dipping/squeezing, maturation/redrying, layup/press, cool/edge/wrap. Record actual setpoints and measurements; determine acceptance from the declared product protocol, not old technical examples."
      unit: "kg; m3; temperature; pressure; time"
      frequency: "Each lot and stage; meters continuous where available"
      temporal_coverage: "One disclosed representative production campaign including idle/rework and stock endpoints"
      site_scope: "Named panel line, supplier lots and linked utilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; assays; lot pairing; acceptance; supplier/destination records; uncertainty"
  calculation_rules:
    - id: campaign_volume
      applies_to: "all inventory rows"
      rule: "V = sum(n_j × L_j × W_j × T_j), using accepted panel lots with metre dimensions; a_i = Q_i / V. Keep original campaign Q_i, stock adjustments and uncertainty; all inventory cards and protocols use the same 1 m3 reference denominator."
      inputs:
        - "Accepted dimensions/count"
        - Q_i
        - cp_output
      output: "a_i per 1 m3"
      source_ids:
        - itto-woven-mat-2014
    - id: moisture_conversion
      applies_to: "mat_input; finished_panel; offcuts"
      rule: "For measured water-only fractions: u_d = m_water / m_dry; u_w = m_water / m_wet; m_wet = m_dry + m_water; u_w = u_d / (1 + u_d). For bonded panels distinguish bamboo dry matter from resin solids and other non-water matter; do not use apparent oven loss as water without matrix validation."
      inputs:
        - "Component masses and water-specific assays"
      output: "Separate dry-matter/water quantities"
      source_ids:
        - itto-woven-mat-2014
    - id: pf_stock_balance
      applies_to: "pf_resin; pf_waste"
      rule: "Q_wet = external wet-adhesive receipts + opening wet PF stock - closing wet PF stock - external wet returns. Build a separate solids balance using each lot's measured solids fraction and stock composition: incoming formulation solids are reconciled to retained cured solids, waste solids, stock change and identified cure-derived losses, including validated reaction products. Never equate wet Q_wet to dry retained resin. Squeeze recirculation is not a second purchase; no universal solids fraction or assumed cure loss."
      inputs:
        - cp_resin
        - cp_handoff
        - cp_waste
        - "measured s"
      output: "PF consumption and component ledger"
      source_ids:
        - itto-woven-mat-2014
    - id: heat_enthalpy
      applies_to: "steam"
      rule: "Net steam heat is the measured supply enthalpy flow minus the measured condensate/other return enthalpy flow across the declared utility-service boundary, using a common thermodynamic reference and validated states; document vent and distribution losses and provider treatment. Unknown states cannot be converted from mass to MJ or aligned to a generic calorific-value row."
      inputs:
        - cp_heat
        - "measured supply/return mass and enthalpy"
      output: "Net utility heat and correspondence"
      source_ids:
        - itto-woven-mat-2014
    - id: particulate_bins
      applies_to: "pm25; pmcoarse; pmover10"
      rule: "For identical paired tests, E_2_5 = PM2.5; E_2_5_10 = PM10 - PM2.5; E_over10 = PMtotal - PM10. Retain test cut and filterable/condensable coverage; do not add cumulative PM10/PMtotal to the three bins. Unmatched tests or negative differences are unresolved."
      inputs:
        - "cp_pm matched tests"
      output: "Disjoint outdoor particulate emissions"
      source_ids:
        - epa-plywood-2002
    - id: carbon_balance
      applies_to: "co2_bio; co2_fossil"
      rule: "C_bio,in = dry bamboo mass × measured biomass carbon fraction. C_fossil,in = sum(each dry fossil-bearing constituent mass × its measured carbon fraction). For each origin separately, C_in + C_open = C_product + C_waste + C_close + C_actual_air_or_water. For actual CO2 only, carbon mass = CO2 mass × 12/44. Track organic species and particulate carbon without counting them again as CO2; unknown source attribution remains incomplete. Do not infer CO2 from an unexplained balance residual."
      inputs:
        - cp_carbon
        - cp_handoff
        - cp_air
        - cp_waste
        - cp_pack
      output: "Separate biogenic/fossil carbon balances and storage"
      source_ids:
        - inbar-industrial-bamboo-2015
  data_quality_requirements:
    - id: quality_states
      applies_to: "p_panel"
      requirement: "Pair lots and material states through all handoffs; reproduce absolute dry-matter/water and source-separated carbon balances with uncertainty; expose unexplained differences."
      evidence: "cp_handoff; cp_water; cp_carbon"
    - id: quality_providers
      applies_to: "all inventory rows"
      requirement: "Identity confirmation does not establish amount, region, technology, time or supplier burden. Keep each unavailable exact UUID, property or background-basis match explicit; no broad emission or correction-flow substitutes."
      evidence: "Provider documents and flow support evidence"
    - id: quality_emissions
      applies_to: "p_panel"
      requirement: "Actual after-control and fugitive bamboo/PF observations are required. EPA wood guidance is a qualitative checklist only; softwood/CORRIM means, wood dust PTE and boiler factors are not bamboo-panel emission factors. Absence/zero needs test or route evidence."
      evidence: "cp_air; cp_pm; detection limits and route records"
    - id: quality_campaign
      applies_to: "p_panel"
      requirement: "Disclose representative operating period, idle/rework coverage, starting/ending stocks, load, acceptance and calibration. Site data and historical illustrative sources remain distinct."
      evidence: "Complete measured campaign and source limits"
validation_rules:
  - rule_id: validation_identity
    applies_to: "p_panel"
    rule: "Require every reference qualifier and PF woven-mat route evidence. Reject inputs already carbonized, steamed/boiled, bleached, preserved or glued, and reject curtain/strip/scrimber or overlaid outputs under this PCR. General bamboo identity alone is insufficient."
    source_ids:
      - fao-china-bamboo-1998
      - itto-woven-mat-2014
      - inbar-industrial-bamboo-2015
  - rule_id: validation_reference
    applies_to: "p_panel"
    rule: "Require exactly one finished reference product output, 1 m3 net accepted solid panel, the same denominator in both languages and all linked collection protocols. Preserve stage measurement records without a second intermediate reference output."
    source_ids:
      - itto-woven-mat-2014
  - rule_id: validation_balances
    applies_to: "p_panel"
    rule: "Check absolute physical mass, water, PF stocks and separate biogenic/fossil carbon with uncertainty before attribution. Require identical sending/receiving links and separate burden accounting. Unexplained residuals remain incomplete, not assumed releases or allocated mass."
    source_ids:
      - itto-woven-mat-2014
  - rule_id: validation_quantities
    applies_to: "all inventory rows"
    rule: "Require real protocols, unit/property evidence and supplier quantity correspondence, including wet/dry PF basis and net steam enthalpy definition. Missing UUIDs, net heat definitions, measured quantities or background links prevent a complete linked dataset; disclose them rather than claiming coverage."
    source_ids:
      - itto-woven-mat-2014
  - rule_id: validation_emissions
    applies_to: "p_panel"
    rule: "Require chemical and medium-specific after-control emission records and three non-overlapping particulate bins. Do not discard biogenic CO2 or substitute correction flows. Record all newly observed species as their own atomic exchange."
    source_ids:
      - epa-plywood-2002
  - rule_id: validation_carbon_claims
    applies_to: "p_panel"
    rule: "Reject carbon-neutral/negative or avoided-energy claims derived merely from bamboo growth, colour, heat treatment or a future combustion scenario. Declared material carbon storage is separate from emission inventory and chosen impact-method reporting."
    source_ids:
      - inbar-industrial-bamboo-2015
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only after route-compatible measured and linked completion"
  downstream_use: "Manufacturing-gate PF woven-mat bamboo panel supply at stated quality/moisture"
  allowed_use: "Evidence-matched panel purchase using declared solid-volume and provider bases; candidate guidance requires review"
  excluded_use: "CPC-wide bamboo proxy, installed floor service, curtain/strip/scrimber/overlaid panel, chemically or thermally treated input, onsite combustion/treatment without extension, carbon-neutral marketing"
  required_metadata: "All reference qualifiers; campaign and plant; absolute/attributed ledgers; supplier/treatment scope; recipe assay; heat definition; collection and calculation lineage"
  required_quality_disclosure: "Unresolved identities and provider bases, measured coverage and detection limits, stock balance residuals, uncertainty, allocation and exclusions; no implied scientific approval"
  update_trigger: "Changed mat treatment/species/weave, resin/formulation, panel surface/construction, utility boundary, provider, emission control or reference moisture/grade"
