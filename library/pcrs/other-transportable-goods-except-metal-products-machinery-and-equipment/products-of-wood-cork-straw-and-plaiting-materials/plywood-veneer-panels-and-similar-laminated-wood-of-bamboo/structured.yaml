system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "p_panel"
      rule: "Include receiving, initial drying, resin dipping and squeezing, maturation/redrying, layup/pressing, cooling, edging/testing, wrapping, clean-up and pollution controls. Aggregate these stages into one foreground process; preserve each physical handoff and stage meter in cp_handoff. Do not export an intermediate board with the final reference UUID."
      source_ids:
        - itto-woven-mat-2014
    - rule_id: boundary_inputs
      applies_to: "p_panel"
      rule: "Upstream supplier burdens and waste destinations must match the actual material states. Bought mats do not eliminate cultivation/sliver/weaving burdens. A matching flow identity is not a complete background provider."
      source_ids:
        - itto-woven-mat-2014
    - rule_id: boundary_utilities
      applies_to: "p_panel"
      rule: "No onsite combustion or direct flue-gas drying is covered. Imported net steam heat includes its actual generation/distribution burdens via a separately verified provider; do not append provider boiler emissions to panel exhaust. Disclose capital-equipment exclusion, infrastructure sensitivity and all operating losses."
      source_ids:
        - itto-woven-mat-2014
    - rule_id: boundary_carbon
      applies_to: "p_panel"
      rule: "Keep actual biological/fossil carbon transfers and emissions. No foreground atmospheric uptake is introduced merely by purchasing bamboo. Storage is separately reported; no generic carbon-neutral label, future combustion credit or delayed-emission correction replaces physical flows."
      source_ids:
        - inbar-industrial-bamboo-2015
boundary_abstraction:
  declared_starting_condition: "Purchased unglued woven mats and aqueous PF adhesive received; measured moisture, no thermal/chemical pretreatment"
  starting_condition_role: "Declared foreground cut at received constituents, with upstream production and inbound transport linked separately"
  product_classification_scope: "PF woven-mat flat panel subset of CPC 3.0 31450; classification does not define all included routes"
  recursive_input_rule: "Purchased finished panel in the same category is an explicit upstream input and not virgin mat. Internal uncured mat/board rework is counted once as stock/transfer; do not recursively repeat this PCR"
  upstream_dataset_requirement: "Actual bamboo cultivation/harvest, sliver manufacture, weaving and inbound transport; PF manufacture and delivery; electricity supply; verified steam production/delivery/condensate-return convention; water, release and wrapping supply; destination-specific waste treatment"
  disclosure: "Site, campaign, species, starting states, all transfers/stock, preprocessing, direct/indirect heat, provider definitions, exclusions, unreconciled balances and unlinked rows"
