measurement_rules:
  - id: reference_volume
    applies_to: "reference product"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Use cp_output: sum accepted final length × width × thickness in metres at measured dispatch moisture. Exclude rejected panels, rework, packaging and inter-panel voids. Retain actual net mass and measured moisture; no assumed density."
  - id: same_denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared reference volume"
      uuid: ""
    required_unit: "m3"
    rule: "Every inventory value and collection aggregation is per reference flow (1 m3 accepted final panel). Campaign records are divided by the same accepted volume V; retain absolute physical ledgers before attribution."
  - id: moisture_state
    applies_to: "mat_input; finished_panel; offcuts"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Distinguish dry-basis and wet-basis moisture. Record laboratory method, specimen, conditioning and volatile/resin interference for each matrix; apparent oven loss from cured PF panels is not automatically water or bamboo loss."
  - id: resin_basis
    applies_to: "pf_resin"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh actual complete wet delivered adhesive in its verified complete-product reference basis. Measure solids, water and free-species composition; maintain dry-resin subledger. Require a specific compatible whole-formulation identity/provider including supplier manufacture/preparation/delivery; a generic resin UUID or dry-solids conversion cannot stand for whole wet adhesive kg. Link background only after the complete supplied product and its quantity basis are reconciled; no universal solids percentage."
  - id: steam_basis
    applies_to: "steam"
    required_property_ref:
      name: "Net delivered heat"
      uuid: ""
    required_unit: "MJ"
    rule: "Record cp_heat supply/return enthalpy reference, pressure, temperature, dryness, steam mass and losses. A calorific-value property or MJ label alone cannot define net heat. Unverified quantities/provider definitions remain unavailable."
  - id: carbon_origins
    applies_to: "co2_bio; co2_fossil"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Quantify dry bamboo biogenic carbon and PF/release/LDPE fossil carbon independently with measured fractions and stock changes. Thermal coloration is not carbon removal or neutralization. Unclassified carbon prevents a complete carbon balance."
