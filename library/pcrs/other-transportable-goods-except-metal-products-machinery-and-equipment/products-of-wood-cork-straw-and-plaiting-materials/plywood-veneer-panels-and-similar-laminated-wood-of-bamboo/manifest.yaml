review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  authoring_scope: Unoverlaid PF-impregnated woven bamboo mat flat plywood from
    purchased untreated unglued mats; electric or indirect externally supplied
    steam heating; no onsite combustion or wastewater treatment. Retained
    semantic directory identity narrowed rather than duplicated.
  scientific_review:
    status: pending_independent_review
    translation: Author paired semantic alignment only; no independent review claimed
  classification_assessment:
    proposed_relation: narrower
    reason: 31450 has additional bamboo plywood, veneered and laminated-panel
      families beyond this evidence-backed PF woven-mat subset. Curtain,
      strip-laminated and overlaid methods are excluded; scrimber is also
      excluded without deciding its classification membership. No accepted
      mapping written.
  unresolved_flow_rows:
    - row_id: mat_input
      selected_flow: Untreated unglued woven bamboo mat
      reason: No exact unglued woven-mat input found. Finished hot-pressed Bamboo
        Man-made Board is not the unglued mat state.
    - row_id: steam
      selected_flow: Net process heat delivered by purchased steam
      reason: Process heat from steam candidate has Gross calorific value, not a
        verified net delivered heat basis. Other candidates bind chemical,
        garment or paper applications. No supplier enthalpy baseline; leave net
        steam-heat UUID absent.
    - row_id: release_agent
      selected_flow: Aqueous silicone mould-release agent
      reason: Silicone adhesive and organic silicone do not identify the aqueous
        silicone mould-release formulation; generic release-agent description
        lacks composition evidence.
    - row_id: mat_reject
      selected_flow: Untreated unglued woven bamboo mat rejection waste
      reason: No exact untreated unglued woven-bamboo-mat waste identified; mineral
        and metal waste candidates rejected.
    - row_id: offcuts
      selected_flow: PF-bonded bamboo panel offcut waste
      reason: Wood waste is described as wood/MSW without confirming PF-bonded bamboo;
        PV waste and unglued bark are different materials.
    - row_id: pf_waste
      selected_flow: Spent aqueous phenol-formaldehyde adhesive
      reason: Glue residues specifies pressure-sensitive label/superglue residue; no
        spent aqueous PF bath identity.
    - row_id: wastewater
      selected_flow: PF adhesive equipment-washing wastewater for offsite treatment
      reason: Wastewater to receiving water is not offsite treatment wastewater, and
        generic waste alkali liquor does not identify spent PF washwater.
    - row_id: captured_dust
      selected_flow: Captured PF-bonded bamboo cutting dust
      reason: Generic dust and sawdust waste do not establish captured PF-containing
        bamboo cutting dust; material and resin status missing.
    - row_id: wrap_waste
      selected_flow: LDPE packaging film offcut waste
      reason: Waste polyethylene direct record specifies cleaned mechanical recycling
        state at recycling plant, not untreated packaging film scrap dispatched
        from the panel factory; reject route/state mismatch. PET and PP waste
        also rejected.
  quantity_background_compatibility:
    - row_id: pf_resin
      reason: Actual aqueous PF supplier wet-formulation versus dry-resin reference kg
        must be reconciled from measured solids and provider definition; no
        default solids factor.
    - row_id: steam
      reason: Net delivered enthalpy basis is not established by a database
        calorific-value MJ property; supplier thermodynamic definition and site
        steam/return measurements required.
  evidence_limits:
    quantitative_ranges: No historical recipe, density, moisture/press setting or
      factory emission/energy average adopted. All variable quantities require
      actual collection protocols.
    route_evidence: ITTO June2014 Appendix1 is an official compilation of INBAR2002,
      not an original factory trial. FAO China Jan1998 and India Aug1997
      identify real distinct historical products, not modern process parameters.
    excluded_numeric_transfer: CORRIM softwood surveys, USDA wood moisture methods,
      EPA wood dust/boiler factors and INBAR MOSO case carbon-negative credits
      cannot supply bamboo-panel defaults.
    required_foreground_evidence:
      - paired_stage_material_handoffs
      - measured_panel_volume_moisture_density
      - actual_PF_solids_water_free_species
      - net_steam_supply_return_enthalpy
      - separate_biogenic_resin_packaging_carbon
      - matched_PM_bins_and_actual_speciation
      - destination_specific_waste_and_actual_provider_linkage
  species_monitoring:
    acetic_acid: Direct state100 read confirms acetic acid CAS64-19-7, air
      unspecified, Mass/kg. Conditional actual drying/pressing exhaust
      measurement only; no inferred presence, positive amount or VOC factor.
