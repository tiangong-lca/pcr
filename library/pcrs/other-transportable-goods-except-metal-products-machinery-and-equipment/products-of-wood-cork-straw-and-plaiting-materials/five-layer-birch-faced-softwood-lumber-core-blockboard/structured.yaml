measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reference output is 1 kg. Q is the sum of independently weighed unique first-acceptance event net whole-panel masses for cohort c at the declared gate, locked at measured acceptance moisture/composition and excluding packaging, cp_accept. Reconcile Q = D_new + FG_new + L_new under unique_acceptance; only evidenced zero other destinations permit the two-term bridge. Returns, loss, downgrade, scrap and returned WIP never reduce original Q; old opening FG, purchased finished panels, dispatch, retests and reacceptance do not create Q. Every attributable exchange q is converted once by normalize_reference: q_ref = q / Q. Q must be positive and measured; zero/missing Q preserves absolute records and an inconclusive result. Do not replace whole-panel Q by oven-dry wood, glue solids or dispatch mass."
  - id: moisture_basis
    applies_to: "unbonded timber and veneers"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record wet mass m and dry-basis moisture u using sampled oven-dry mass; dry wood d = m / (1 + u); water w = m - d. Percentage dry-basis moisture is divided by 100 before use. Do not use a wet-basis fraction in this formula; adhesive-bearing panels/residues need a matrix-valid water method, not automatic oven-loss-as-water. Sources: usda-wood-handbook-2021."
  - id: energy_conversion
    applies_to: "electricity and press heat"
    required_property_ref:
      name: "Net calorific value for the selected electricity identity; heat property remains unresolved"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Convert electricity 1 kWh = 3.6 MJ; retain the native selected energy property. Heat requires verified delivered enthalpy and compatible property/unit support; never convert gross heat into delivered net heat by relabelling."
  - id: count_volume
    applies_to: "weighed panel lots"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Sum individually measured net masses. Counts or cubic metres are descriptors unless same-lot density at the same moisture and geometry is measured; no manufacturer density range or nominal thickness substitutes for Q."
