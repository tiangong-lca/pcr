  calculation_rules:
    - id: batch_normalization
      applies_to: "all inventory rows"
      rule: "Divide each attributable batch exchange by accepted net food mass in kg for the same reporting period. Report each result per 1 kg reference flow; preserve its numerator unit."
      inputs:
        - "Attributable quantity"
        - "accepted net food mass"
        - cp_packing_retort
        - "process protocol"
      output: "Normalized individual exchange"
      source_ids:
        - foreground-records
    - id: electricity_conversion
      applies_to: "site_electricity"
      rule: "Multiply metered kWh by 3.6 to obtain MJ before batch normalization."
      inputs:
        - kWh
        - cp_cleaning_power
      output: "MJ"
      source_ids:
        - foreground-records
    - id: steam_heat
      applies_to: "cook_heat; retort_heat; clean_heat"
      rule: "Calculate thermal energy as measured steam mass times measured supply-minus-return specific enthalpy; sum attributable cycles before batch normalization. State pressure, temperature, condensate return and meter boundary; no default enthalpy."
      inputs:
        - "Steam mass"
        - "supply and return enthalpy"
        - "cycle ID"
      output: "MJ"
      source_ids:
        - foreground-records
  data_quality_requirements:
    - id: dq_traceability
      applies_to: "all inventory rows"
      requirement: "Link every amount to the same formulation, site, lot and release period. Distinguish measured zero, absent, unmeasured and proxy. No recipe proportions are inferred from marketing text."
      evidence: "foreground-records"
    - id: dq_balance
      applies_to: "preparation; pureeing; packing_retort"
      requirement: "Reconcile food inputs, retained moisture, intermediate stocks, net food output, evaporation and separated wastes; report unexplained residual and site-derived uncertainty. Reconcile water supply against ingredient retention, returns and effluent without assuming supply equals discharge."
      evidence: "foreground-records"
    - id: dq_schedule
      applies_to: "packing_retort"
      requirement: "Retain the factory-authorized product/container-specific schedule and deviation/release evidence. Historical Codex is methodological context, not evidence of current legal conformity; no PCR thermal schedule or safety approval."
      evidence: "codex-canning"
    - id: dq_uuid
      applies_to: "UUID-bearing rows"
      requirement: "Confirm physical state, chemistry, voltage, concentration, environmental medium and reference property before binding actual data. If conditions differ, leave the identity unresolved rather than widening the public identity."
      evidence: "foreground-records"
