      - codex-canning
  - rule_id: validate_electricity_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Before binding site_electricity to UUID 50657322-939c-4829-a87b-47c093bfa6a7, verify CN supply geography, below-1-kV voltage and user-side grid-average consumption-mix supply against actual supplier records. For any other geography, voltage or generation-side boundary, require a separately verified applicable flow identity and supplier data; neither this flow nor its provider is a global default. Retain the actual reference property and energy unit chain, with measured kWh converted by 3.6 MJ/kWh."
    source_ids:
      - foreground-records
  - rule_id: validate_quantity
    applies_to: "foreground_dataset_conformance"
    rule: "Check a positive accepted net-food denominator, calibrated net fill, consistent wet-mass and energy units, internal-transfer matching and no double utility/rework counting. Reject packaging mass in the1kg food reference."
    source_ids:
      - foreground-records
  - rule_id: validate_completeness
    applies_to: "foreground_dataset_conformance"
    rule: "Check every process and atomic exchange against actual factory records, including conditional cleaning and evaporation. Report checked, skipped, absent and unmeasured exchanges, balance residuals and missing upstream links. Pending identities and scientific review do not establish methodology or food-safety approval."
    source_ids:
      - foreground-records
published_dataset_profile:
  dataset_role: "foreground manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing contribution of this declared product and route; expanded model only with disclosed upstream and downstream links"
  excluded_use: "Whole23991 average; infant diet or health comparison; safety approval; unlinked cradle-to-gate claim"
  required_metadata: "All reference qualifiers; net-food basis; batch counts; input states; route and release identifiers; allocation; waste destination; geography and period; flow identity gaps"
  required_quality_disclosure: "Measured coverage; calibration and uncertainty; balance residuals; proxies; missing upstream links; historical-source limitations"
  update_trigger: "Recipe, input preservation state, packaging, utility supply, retort technology, authorized schedule or release criteria change; identity or evidence resolution"
