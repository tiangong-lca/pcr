allocation_rules:
  - rule_id: allocation_direct
    applies_to: "foreground_burden_allocation"
    rule: "First separate batches and directly meter stage utilities. For shared retort, cooking or cleaning duty use measured attributable energy/time/load records with stated causal basis, including changeover and rejects. If separation cannot be supported, disclose and review the allocation; do not invent an industry factor."
    source_ids:
      - foreground-records
  - rule_id: allocation_rework
    applies_to: "foreground_burden_allocation"
    rule: "Internal reusable puree is a tracked loop; net fresh inputs enter their exchange numerators and the aggregate inventory; only accepted net food output in kg enters the normalization denominator. Retain all failed-batch and rework burdens, and count the final accepted food once. Failed lots remain part of the production burden. No avoided-product credit for waste. A sold carrot peel coproduct requires separate product status, measured wet/dry mass and an explicitly reviewed allocation basis."
    source_ids:
      - foreground-records
