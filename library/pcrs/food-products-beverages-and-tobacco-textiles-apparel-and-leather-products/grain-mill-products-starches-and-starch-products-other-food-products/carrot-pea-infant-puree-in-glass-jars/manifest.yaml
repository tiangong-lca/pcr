  evidence_limitations:
    - The HiPP product page demonstrates ingredients and market state only; it
      does not disclose its manufacturing route or factory inventory. The
      selected retort route is separately evidenced by equipment manufacturer
      Steriflow, not claimed to be the HiPP factory route.
    - CAC/RCP23-1979 original is revised1989/1993 with editorial2011; used as
      historical general canning-method evidence, not current legal compliance
      or infant-specific approval.
    - CXS73-1981 amended2023 §§1 and3.2 checked using coordinator-retained
