      - row_id: feed_corn_starch
        need: Independent, state-matched evidence for corn-starch substitute yield per kg accepted dry product.
      - row_id: feed_process_water
        need: Boundary-compatible independent sources for conditioning-water use per kg accepted dry product.
      - row_id: cook_electricity
        need: Boundary-compatible independent sources for electricity use by forming and drying technology.
      - row_id: cook_purchased_steam
        need: Boundary-compatible independent sources for purchased-steam use in this product state.
      - row_id: cook_natural_gas
        need: Boundary-compatible independent sources for natural-gas consumption on the direct-fired route.
      - row_id: cook_fossil_co2_air
        need: Verified fuel-carbon composition and batch combustion data for a compatible fossil CO2 screening range.
      - row_id: cook_no_air
        need: Species-specific measured nitrogen monoxide evidence for a compatible direct-fired route range.
      - row_id: grade_sieving_dust
        need: Boundary-compatible independent sources for unsalable captured starch dust fraction.
