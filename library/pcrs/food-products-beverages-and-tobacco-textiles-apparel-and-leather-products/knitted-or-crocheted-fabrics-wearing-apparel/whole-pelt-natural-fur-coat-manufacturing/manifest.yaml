  semantic_decision:
    decision: new_narrow_methodology
    rationale: "Existing dressed-furskin methodology ends before garment making and excludes garments; artificial-fur methodology uses textile pile rather than natural hair-on skin. Integration material catalog and batch jobs were inspected read-only; no duplicate whole-pelt coat method found."
  unresolved_flow_identities:
    - row_id: dressed_pelt
      reason: "The nearest direct-read furskin 0bb9a6f1-8ea9-47ee-b037-adde2b39b9c5 is wet-white fine miscellaneous skin, classified as raw furskin, reference Number of items. Neither the dry dressed incoming state nor composition is established; item count alone would not invalidate identity if same-state measured conversion existed."
    - row_id: fur_offcut
      reason: "Bounded fur-waste candidates do not establish dry dressed hair-on cutting offcut composition and recipient treatment; raw hide or hair-off leather scraps are not substitutes."
    - row_id: cotton_lining
      reason: "Cotton-fabric candidates include unspecified composition/finish and mixed-fibre textiles. Direct dd9f2248-bc28-43b9-8d57-d77756754f4d has a cotton-cloth name but raw-cotton classification; no 100% cotton finished lining state is verified."
    - row_id: polyester_thread
      reason: "Two bounded thread queries returned polyester fibre/filament or yarn explicitly excluding sewing thread; finished polyester sewing thread identity is not established."
    - row_id: cotton_tape
      reason: "Bounded narrow-cotton-tape candidates include elastic bands and broad fabric categories; non-elastic cotton reinforcing tape composition is not established."
    - row_id: steel_hook
      reason: "Two bounded hook queries did not establish a complete steel garment hook-and-eye closure with the declared alloy/coating; miscellaneous metal cannot substitute."
    - row_id: lubricating_oil
      reason: "Mineral-oil query returned PAO synthetic oil, furfural-refined oil and white-mineral-oil environmental flows; grade/additive and sewing-machine compatibility are unverified. No name-only substitution."
    - row_id: cotton_offcut
      reason: "Cotton-offcut candidates include generic scrap fabric and raw cotton. Pure finished-cotton lining cutting waste composition is not established."
    - row_id: thread_waste
      reason: "Polyester thread-waste identity and recipient route are not verified; fabric waste is not sewing-thread waste."
    - row_id: spent_oil
      reason: "Bounded used-oil candidates include specified water/additive mixtures, recycled production and metal-machining/cutting-fluid streams. Actual sewing lubrication drain composition/route is not established."
    - row_id: finished_coat
      reason: "Two bounded coat queries did not establish a public natural whole-pelt cotton-lined dry finished-coat identity matching the 1 kg manufacturing reference; woven garments and input pelts do not substitute."
    - row_id: rejected_coat
      reason: "Bounded composite-waste candidates do not establish the specific natural hair-on skin, cotton lining, polyester thread and steel closure rejected-coat composition."
