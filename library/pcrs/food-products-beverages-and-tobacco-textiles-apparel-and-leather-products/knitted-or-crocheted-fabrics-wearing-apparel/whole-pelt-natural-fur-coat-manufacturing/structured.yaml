      raw_fields: "batch; row_id; mass; composition; reuse status; recipient; treatment; rejects; maintenance period; reporting-pool ID; included batch IDs; wholly rejected batch and rework linkage"
      collection_method: "Weigh each identified stream independently; document delayed oil drain attribution and rework, never net waste mass against raw input. Aggregate every included batch under normalize_batch; preserve native row units and use the same positive total accepted kg denominator."
      unit: "kg"
