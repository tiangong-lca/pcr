allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared equipment"
    rule: "Use batch submetering and separately weighed issues first. For unavoidable shared electricity, collect workstation operating and idle times and measured loads to justify attribution; record total and assigned quantities and residual."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_offcuts
    applies_to: "saleable offcuts"
    rule: "Distinguish retained internal offcuts, externally saleable co-products and discarded waste. Internal reuse is an internal transfer. Avoid co-product allocation through subdivision; otherwise justify a physical relationship, or documented economic allocation when no physical basis is defensible. Disclose prices/period, masses, fractions and sensitivity; no automatic avoided-product credit."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_upstream
    applies_to: "dressed pelts"
    rule: "Retain the upstream dataset allocation for animal production and dressing, documenting its scope and origin. Garment assembly does not establish agricultural co-product allocation by coat mass."
    source_ids: []
