  calculation_rules:
    - id: normalize_batch
      applies_to: "all inventory rows"
      rule: "q_ref = Q_pool / M_accepted. Define one homogeneous reporting pool by site, period, species, supplied state and declared coat configuration/size mix. Q_pool sums each row’s attributable measured or calculated quantities in its native unit across every included batch, including wholly rejected batches, rework and attributable maintenance; exclude duplicate internal transfers. M_accepted is the sum of accepted net finished-coat kg from cp_output for the same pool, counting finally accepted reworked output once. Never divide a zero-output batch separately or omit its burdens. M_accepted must be positive; if the whole pool has no accepted output, retain absolute quantities, report normalization unavailable and require review, not zero or a fabricated denominator."
      inputs:
        - Q_pool
        - M_accepted
        - cp_output
        - "batch and reporting-pool ledger"
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: electricity_conversion
      applies_to: "sewing_electricity"
      rule: "MJ = kWh × 3.6; use attributable measured electricity, retaining its public Net calorific value reference property."
      inputs:
        - kWh
        - cp_electricity
      output: "MJ"
      source_ids: []
    - id: water_balance
      applies_to: "blocking_vapour"
      rule: "Evaporated water = applied water minus retained moisture increase, recovered water and independently measured runoff; a negative residual or unexplained imbalance requires investigation, not zero clipping."
      inputs:
        - cp_water
      output: "batch air water-vapour mass before normalize_batch"
      source_ids: []
  data_quality_requirements:
    - id: dq_configuration
      applies_to: "all batches"
      requirement: "Keep species, incoming processing state, whole-pelt technique and complete bill of materials consistent; do not mix cotton and silk-lined configurations without separate records."
      evidence: "supplier declarations and batch travellers"
    - id: dq_balance
      applies_to: "all processes"
      requirement: "Reconcile material issues, internal reuse, inventory change, accepted mass, rejects, separate wastes and water evaporation; identify losses, moisture effects and uncertainty without inventing emission factors."
      evidence: "weighing and utility reconciliation"
    - id: dq_coverage
      applies_to: "reporting period"
      requirement: "Disclose site, actual dates, batch/size coverage, contractors, meter completeness, exclusions, allocation, identity gaps and data age. Do not replace missing records with zero."
      evidence: "production register and quality file"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_coat"
    rule: "Verify 1 kg complete accepted conditioned coat net output with all qualifiers and cp_output; dressed pelt, artificial fur and headgear cannot substitute for the coat."
    source_ids:
      - cpc30-notes
  - rule_id: validate_rows
    applies_to: "all inventory rows"
    rule: "Require atomic identity, same accepted-output denominator, compatible public reference property/unit and attributable collection records. Every active exchange needs an amount; unresolved UUIDs are declared identity gaps, not automatic proxies. Verify pool membership and inclusion of wholly rejected batches; require positive M_accepted before producing any normalized result, and retain absolute inventories when no accepted output exists."
    source_ids: []
  - rule_id: validate_route
    applies_to: "block; sew"
    rule: "Check conditional blocking, oil and waste applicability against actual records; verify immediate air-vapour medium and CN <1 kV electricity. Any added chemical or effluent route needs explicit exchanges and treatment boundary before dataset acceptance."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "batch records"
    rule: "Investigate mass/water residuals, output acceptance and rework; retain calibration and uncertainty. Factory quality acceptance does not establish health, legal or methodological approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "Gate-to-gate foreground natural-fur coat manufacturing dataset."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "After independent review, specified whole-pelt cotton-lined coat configuration at the declared site/period and input state."
  excluded_use: "Whole CPC coverage, thermal-service comparisons without performance/life data, raw-pelt dressing and any excluded route; complete cradle-to-gate claims without linked upstream evidence."
  required_metadata: "All reference qualifiers, batch net output, foreground boundary, supplier processing, contractor scope, water destination, grid geography/voltage, actual allocation and data period."
  required_quality_disclosure: "UUID gaps; unmeasured exchanges; sampling and uncertainty; exclusions; actual losses/rework; shared meters; upstream dataset limits; no scientific approval implied."
  update_trigger: "Change in species/origin, dressing/dye state, lining composition, coat design/size mix, joining route, utility supply or waste handling."
