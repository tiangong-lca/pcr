      collection_method: "Read calibrated workstation meter; reconcile bills and shared-load assignment before converting kWh to MJ. Aggregate every included batch under normalize_batch; preserve native row units and use the same positive total accepted kg denominator."
      unit: "kWh"
      frequency: "each batch and attributable maintenance event"
      temporal_coverage: "declared representative reporting period covering all batches and rework"
