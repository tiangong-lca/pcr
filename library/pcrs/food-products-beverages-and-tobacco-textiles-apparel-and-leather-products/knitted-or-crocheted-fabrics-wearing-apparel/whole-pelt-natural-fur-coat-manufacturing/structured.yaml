    used_for: "Classification titles and adjacent exclusions only; no manufacturing method prescribed."
  - id: "usu-fur-2025"
    type: "extension_guidance"
    reference: "Cory Farnsworth, Sewing With Fur, Utah State University Extension, February 2025, https://extension.usu.edu/sewing/research/sewing-with-fur"
    used_for: "Quality, Blocking, Cutting the Pattern and Sewing It Together; transferable pelt/seam mechanics. Its hat demonstration is not this coat; no quantities or life assumptions imported."
  - id: "fic-coat"
    type: "handbook"
    reference: "Fur Institute of Canada, Making a Fur Coat, https://fur.ca/fur-trade-2/making-a-fur-coat/"
    used_for: "Qualitative coat selection, trimming/assembly and lining; broader finishing variants are not all required here. No hours or industrial averages adopted."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "GHG Protocol, Product Life Cycle Accounting and Reporting Standard, 2011, Chapter9, p.63 (PDF p.65), Tables9.1/9.2, https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Historical general allocation hierarchy applied by author judgment; no fur-specific factors or certification."
