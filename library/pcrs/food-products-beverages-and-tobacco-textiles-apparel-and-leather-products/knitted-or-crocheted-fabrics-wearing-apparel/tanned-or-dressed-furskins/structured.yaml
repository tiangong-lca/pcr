allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared operations"
    rule: "First subdivide separately metered or weighed operations and avoid allocation where measured stage records identify a product batch."
    source_ids:
      - ghg-product
  - rule_id: allocation_shared
    applies_to: "unavoidable shared utilities"
    rule: "If subdivision is impossible, assign common electricity, fuel and water using a documented causal driver such as stage operating time and rated load; disclose driver, numerator, denominator and residual. Do not allocate by output mass when it would hide route-specific energy differences."
    source_ids:
      - ghg-product
  - rule_id: allocation_outputs
    applies_to: "recoverable co-products"
    rule: "Keep saleable recovered material separate from waste and document any physical or economic allocation used; show both gross exchanges and allocated burdens."
    source_ids:
      - ghg-product
