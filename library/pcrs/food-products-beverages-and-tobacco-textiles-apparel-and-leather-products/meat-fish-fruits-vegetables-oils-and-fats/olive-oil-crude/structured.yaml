allocation_rules:
  - rule_id: allocation_disposition
    applies_to: "pomace_output"
    rule: "Distinguish pomace sold for productive use from pomace managed as waste using transfer evidence. Never count the same wet mass in both output rows."
    source_ids:
      - turkey-olive-lca-2023
  - rule_id: allocation_method
    applies_to: "shared_milling_burdens"
    rule: "First subdivide separately metered operations. If oil and product pomace share inseparable burdens, declare the study's allocation method, mass basis and sensitivity; do not apply an unverified fixed fraction."
    source_ids:
      - turkey-olive-lca-2023
