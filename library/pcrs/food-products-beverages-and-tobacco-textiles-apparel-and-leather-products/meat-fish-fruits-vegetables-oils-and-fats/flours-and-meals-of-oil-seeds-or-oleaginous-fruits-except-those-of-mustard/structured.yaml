allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Separate measured dehulling, heat conditioning and milling operations where records permit. If marketable hulls leave the process, report their dry mass and destination and disclose the selected allocation principle and the value or physical relationship used. Do not allocate purchased-defatted-flake upstream extraction burdens again in this foreground process. No fixed economic or mass allocation factor is specified without foreground co-product evidence."
    source_ids: []
  - rule_id: allocation_subdivide
    applies_to: "foreground operations"
    rule: "Prefer subdivision using independently metered or weighed operations before allocating shared burdens."
    source_ids: []
  - rule_id: allocation_hulls
    applies_to: "marketable soybean hulls"
    rule: "If hulls are a saleable co-product, disclose the allocation method and measured product quantities; if disposed, treat them as waste and include the actual treatment."
    source_ids: []
