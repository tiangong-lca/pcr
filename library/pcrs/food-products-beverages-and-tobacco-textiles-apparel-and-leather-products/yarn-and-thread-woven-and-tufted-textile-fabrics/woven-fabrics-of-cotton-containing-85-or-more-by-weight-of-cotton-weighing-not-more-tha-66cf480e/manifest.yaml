review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved:
    inventory_flow_uuids:
      - row_id: fabric_output
        reason_code: no_exact_candidate
        explanation: Public candidate flows lack the exact cotton content and areal-mass class; no proxy is used.
      - row_id: corn_starch_input
        reason_code: manual_review_required
        explanation: Two public corn-starch records have identical applicable identity facts and no distinguishing comment.
      - row_id: grid_electricity_input
        reason_code: manual_review_required
        explanation: Two alternating-current records lack supply voltage and geography; their net-calorific-value property also requires review.
      - row_id: loom_cotton_scrap_output
        reason_code: no_exact_candidate
        explanation: Public waste candidates do not identify clean cotton loom selvage or yarn scrap exactly.
    range_evidence_needs:
      - row_id: cotton_yarn_input
        need: Independent comparable kg-per-kg greige cotton fabric observations are unavailable; collect batch mass balance.
      - row_id: grid_electricity_input
        need: Two independent comparable weaving electricity observations are unavailable; collect metered kWh.
      - row_id: industrial_water_input
        need: Two independent sizing-water observations on this fabric route are unavailable; collect site water records.
      - row_id: corn_starch_input
        need: Two independent comparable sizing-recipe observations are unavailable; collect issued dry starch mass.
      - row_id: loom_cotton_scrap_output
        need: Two independent compatible clean cotton scrap observations are unavailable; collect weighed rejects.
