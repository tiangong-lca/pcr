allocation_rules:
  - rule_id: allocate_subdivide
    applies_to: "shared cutting and assembly operations"
    rule: "First subdivide shared operations by traceable production lot, equipment and meter to assign material and energy directly."
    source_ids:
      - ghg-product-2011
  - rule_id: allocate_physical
    applies_to: "unavoidable shared inputs"
    rule: "If subdivision is impossible, allocate using a documented physical causal relation and disclose denominator, basis and residual; if none is valid, declare and justify another method."
    source_ids:
      - ghg-product-2011
  - rule_id: scrap_distinction
    applies_to: "offcuts and saleable coproducts"
    rule: "Distinguish saleable co-products from offcuts sent for treatment; do not count the same output twice as treated waste and credited co-product."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "bag_fabrication"
      flow_role: "specific purchased material or component"
      record_type: "purchase, issue and batch bill-of-material records"
      raw_fields: "material identity; lot; net input mass; returns; accepted item count"
      collection_method: "Record on calibrated scale or traceable net-mass document; subtract returns and reconcile same-lot bill of materials."
      unit: "kg"
      frequency: "each production lot"
      temporal_coverage: "representative production year"
      site_scope: "manufacturing site and product subtype"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing record; purchase record; bill of materials; acceptance record"
    - protocol_id: cp_electricity
      process_id: "bag_fabrication"
      flow_role: "alternating-current electricity"
      record_type: "submeter and master-meter records"
      raw_fields: "opening and closing readings; meter scope; lot; accepted item count"
      collection_method: "Prefer submetering; document auditable attribution for shared electricity."
      unit: "MJ"
      frequency: "each production lot"
      temporal_coverage: "representative production year"
      site_scope: "manufacturing site and product subtype"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; bill; attribution record"
    - protocol_id: cp_waste
      process_id: "bag_fabrication"
      flow_role: "specific segregated offcut waste"
      record_type: "segregated weighing and transfer records"
      raw_fields: "waste material; lot; net mass; destination; accepted item count"
      collection_method: "Weigh leather and PVC offcuts separately and record reuse, sale or disposal."
      unit: "kg"
      frequency: "each production lot"
      temporal_coverage: "representative production year"
      site_scope: "manufacturing site and product subtype"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing record; transfer note; destination evidence"
    - protocol_id: cp_finished
      process_id: "bag_fabrication"
      flow_role: "accepted finished article"
      record_type: "quality acceptance and inventory records"
      raw_fields: "subtype; configuration; accepted count; rejected count; capacity; dimensions"
      collection_method: "Reconcile same-lot acceptance and inventory records item by item; exclude rejects from denominator."
      unit: "item"
      frequency: "each production lot"
      temporal_coverage: "representative production year"
      site_scope: "manufacturing site and product subtype"
      aggregation_rule: "per reference flow"
      quality_evidence: "acceptance; inventory and specification records"
  calculation_rules:
    - id: normalize_per_item
      applies_to: "all inventory rows"
      rule: "Amount per reference flow = attributable net exchange for the same lot / accepted finished-article count for that lot; do not pool unlike subtypes or configurations."
      inputs:
        - "lot quantity"
        - "accepted item count"
        - cp_finished
      output: "amount per reference flow"
      source_ids: []
    - id: check_material_balance
      applies_to: "material and offcut rows"
      rule: "Reconcile same-lot material input, material in accepted articles, segregated offcuts, rework and other identified destinations; record unexplained residual."
      inputs:
        - cp_materials
        - cp_waste
        - cp_finished
      output: "documented mass-balance residual"
      source_ids:
        - ilo-isco68
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each declared material and finished subtype"
      requirement: "Check actual material, finished state, flow type, property and unit for each row; unresolved UUIDs must not be replaced with proxy flows."
      evidence: "bill of materials; direct flow evidence"
    - id: dq_coverage
      applies_to: "each production lot"
      requirement: "Record route applicability, set contents, rework, outsourced stages and any direct emissions; missing data are not zero."
      evidence: "lot reconciliation; site log"
    - id: dq_time
      applies_to: "site data"
      requirement: "Declare site, year and technology; record temporal coverage and exceptional batches."
      evidence: "meter logs; production records"
validation_rules:
  - rule_id: validate_item_denominator
    applies_to: "reference and all inventory rows"
    rule: "Confirm normalization uses accepted items of one subtype and configuration; do not use the Leather Bag UUID for another subtype."
