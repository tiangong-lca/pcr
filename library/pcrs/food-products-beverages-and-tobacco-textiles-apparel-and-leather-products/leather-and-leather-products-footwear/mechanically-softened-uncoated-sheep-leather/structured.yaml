  calculation_rules:
    - id: lot_normalization
      applies_to: "all inventory rows"
      rule: "Define a homogeneous reporting pool by site, period, species, incoming processing state, conditioning and reference-grade specification; retain individual lot records and use allocation_subdivide/allocation_products for genuinely distinct saleable grades. For each row, sum the reference product’s attributable measured or calculated quantities across all included lots, including wholly rejected lots, idle activity and rework, in its native unit; divide once by the same pool’s accepted reference-grade net kg from cp_mass. Count finally accepted reworked output once; lower grades, packaging and waste never enter that denominator. Never divide a zero-output lot separately or discard its attributable burdens. The pool denominator must be positive; if the whole pool has no accepted reference product, retain absolute inventories and any evidenced co-product allocation, report reference-product normalization unavailable and require review, with no fabricated mass or zero burden."
      inputs:
        - cp_mass
        - "applicable collection protocol"
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: meter_conversion
      applies_to: "electricity_lv; electricity_mv"
      rule: "Convert allocated kWh readings to MJ using the exact unit identity 1 kWh = 3.6 MJ, then aggregate all included lots and divide by the same positive accepted reference-grade kg of the declared reporting pool, retaining wholly rejected-lot and rework electricity."
      inputs:
        - cp_energy
        - cp_mass
      output: "MJ per 1 kg reference flow"
      source_ids: []
    - id: release_integration
      applies_to: "particulate_air"
      rule: "Integrate matched measured concentration × exhaust volume over the sampled operating period, convert to kg with explicit units, and reconcile unsampled periods before normalization."
      inputs:
        - cp_air
        - cp_mass
      output: "kg particulate per 1 kg reference flow"
      source_ids: []
    - id: moisture_reconciliation
      applies_to: "water_vapour_air"
      rule: "Subtract measured retained-output moisture and net stock moisture increase from received moisture; require independent closure and no other liquid exits before assigning the positive remainder to atmospheric vapour. Otherwise use direct exhaust measurement or retain a disclosed data gap."
      inputs:
        - cp_moisture
        - cp_mass
      output: "kg evaporated water per 1 kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Verify species, processing state, chemical composition, public UUID reference property and official Chinese flow name; no rawhide/crust/finished-leather substitution."
      evidence: "Supplier declarations; direct flow/property/unit records"
    - id: quality_measurement
      applies_to: "foreground"
      requirement: "Use actual recipes and conditions from supplier/site records; no invented tanning recipe, energy, loss, net yield, quality or service life. Confirm temporal representativeness and material/dry-solids/moisture reconciliation."
      evidence: "Calibration; acceptance tests; mass balances; raw dates; uncertainty"
    - id: quality_completeness
      applies_to: "boundary"
      requirement: "Record all actual auxiliaries and packaging as additional atomic exchanges. Distinguish absent activity from unmeasured activity; disclosed gaps do not become zero. Wet/coated routes invalidate applicability."
      evidence: "Route audit; procurement ledger; waste/air records; missing-data register"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Confirm sheep/lamb origin, received dyed fat-liquored chrome crust, no deliberate water addition, no new wet processing, thermal drying or coating; otherwise this PCR is not applicable."
    source_ids:
      - un-cpc-2025
      - goldpanel-production
  - rule_id: validate_reference
    applies_to: "finished_leather"
    rule: "Require exact reference-product/output-row name match, positive measured accepted reference-grade net kg for the same reporting pool, declared moisture and all qualifiers; zero-output lots remain included in the numerator. Check the same 1 kg reference basis in both languages and all collection protocols. If the entire pool has zero reference-grade output, retain absolute quantities and report normalization unavailable for review."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "foreground"
    rule: "Reconcile received solids and water with accepted output, lower grades, residues, evaporation and stock changes, using measured uncertainty. No invented universal yield or tolerance; unexplained imbalance remains a finding."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "UUID rows"
    rule: "Recheck published state-100 identity, reference property/unit group, voltage/geography and air subcompartment. Blank UUIDs remain explicit identity gaps; neither candidate check nor identity verification grants scientific approval."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "dataset"
    rule: "Require actual quantities and protocols for applicable rows, evidence for non-applicable rows, allocation basis and uncertainty disclosure, matched upstream datasets and treatment destinations. Never call this partial foreground complete cradle-to-gate."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground dry mechanical sheep-leather finishing process"
  downstream_use: "secondary_dataset; background_dataset, after independent review and supplier linking"
  allowed_use: "Matching uncoated dyed chrome-tanned sheep leather finishing, with actual moisture and upstream state"
  excluded_use: "Whole CPC coverage; integrated tanning; composition leather; coated or other-species leather; product comparison or consumer lifetime without further review"
  required_metadata: "All reference qualifiers; lot dates; net output; route; voltage; supplier upstream stages; allocation; moisture; waste and release compartments"
  required_quality_disclosure: "Partial foreground boundary; data gaps and blank identities; actual collection coverage; uncertainty; missing upstream animal/tannery stages; review state"
  update_trigger: "Species, supplier state, tannage, formulation, moisture, route, coating, voltage or significant collection changes"
