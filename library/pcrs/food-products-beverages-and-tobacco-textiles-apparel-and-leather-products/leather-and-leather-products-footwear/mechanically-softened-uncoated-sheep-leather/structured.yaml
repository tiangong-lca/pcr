allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared foreground"
    rule: "First segregate lots, metered equipment time and rework. Allocate shared electrical demand by measured causal equipment consumption/time and retain idle demand consistently; never use unsupported standard percentages."
    source_ids: []
  - rule_id: allocation_products
    applies_to: "saleable grades"
    rule: "Record every saleable grade and its measured mass. Prefer process subdivision or justified physical relationships; if no defensible physical relationship explains economic grading, use same-period net sales values for residual joint burdens, disclose basis and test mass allocation sensitivity. This is a declared foreground modelling choice, not a tannery-wide default or source-derived factor."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "leather residues"
    rule: "Waste status follows actual disposal/sale contract. Include waste handover and matched treatment; do not grant avoided virgin leather or energy credits inside this attributional foreground. Reworked pieces stay inside the lot until final acceptance; count their processing once."
    source_ids: []
