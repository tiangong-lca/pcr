  unresolved_flow_identities:
    - row_id: dyed_sheep_crust
      reason_code: no_exact_candidate
      explanation: Public raw sheepskin, wet-blue and mixed finished leather
        candidates do not establish chromium-tanned dyed fat-liquored dry sheep
        crust input.
    - row_id: captured_leather_dust
      reason_code: no_exact_candidate
      explanation: Bounded public search did not establish the exact state, species
        and composition of Collected chrome-tanned dyed sheep leather fibre
        dust; retained as an atomic measured exchange, not a claim of database
        absence.
    - row_id: finished_leather
      reason_code: no_exact_candidate
      explanation: "Public mixed cattle/sheep/pig finished-leather area identity does
        not establish this uncoated dyed sheep product or a compatible 1 kg
        reference. Area alone is not a rejection reason: species/state/route and
        measured conversion remain unestablished."
    - row_id: downgraded_sheep_leather
