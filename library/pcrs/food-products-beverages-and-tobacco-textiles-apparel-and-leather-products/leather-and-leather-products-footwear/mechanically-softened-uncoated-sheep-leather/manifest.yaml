  evidence_limitations:
    - No industry-wide numeric input, energy, yield, moisture or lifetime ranges
      adopted. All quantities require actual site collection.
    - Sources establish qualitative route options, not proof that every sheep
      leather factory uses this route.
    - Dry mechanical finishing is only a subset of CPC 29130; goat leather,
      integrated wet processing, coatings and composition leather remain outside
      coverage.
