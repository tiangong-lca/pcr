  unresolved:
    inventory_flow_uuids:
      - row_id: finished_covering
        reason_code: no_exact_candidate
        explanation: Public candidates inspected for the finished residual CPC 27290 floor covering were woven, tufted, knotted or unrelated products; no exact finished needle-felt floor-covering flow was verified.
      - row_id: sb_latex_binder
        reason_code: product_state_mismatch
        explanation: Available styrene-butadiene polymer and latex candidates do not establish the aqueous binder dispersion state and solids basis required by this conditional row.
      - row_id: polyester_backing
        reason_code: classification_mismatch
        explanation: The closest named polyester nonwoven candidate is classified as quilted textile products, and other candidates do not establish the polyester backing identity.
    range_evidence_needs:
      - row_id: polyester_fibre
        need: Independent original-text evidence on fibre consumption per accepted kg for a compatible needle-felt route.
      - row_id: needle_electricity
        need: Independent original-text evidence on electricity per accepted kg with compatible process boundary and grid context.
      - row_id: sb_latex_binder
        need: Route-specific independent evidence on wet dispersion consumption and solids content per accepted kg.
      - row_id: polyester_backing
        need: Route-specific independent evidence on backing mass per accepted kg.
      - row_id: clean_pet_trim
        need: Independent evidence on segregated clean PET trim yield per accepted kg.
