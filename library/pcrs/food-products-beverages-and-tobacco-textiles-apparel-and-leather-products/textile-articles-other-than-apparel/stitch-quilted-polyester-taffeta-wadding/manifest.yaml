    embroidery or nonwoven formation. Does not establish full CPC coverage or
    accepted mapping.
  unresolved_flow_identities:
    - row_id: taffeta_input
      reason: Polyester mesh, filament and mixed polyester/cotton identities do not
        establish finished dyed plain-weave polyester taffeta.
    - row_id: wadding_input
      reason: Nonwoven polyester candidate is a generic substrate, not verified
        high-bulk wadding of declared bonding and loft; loose fibre and medical
        wadding are different supplied states.
    - row_id: thread_input
      reason: Filament and non-sewing yarn candidates do not establish sewing-grade
        continuous multifilament polyester thread.
    - row_id: quilted_intermediate_out
      reason: Foreground-internal uninspected roll transfer; no public flow
        establishes this exact state.
    - row_id: thread_waste
      reason: Public textile waste candidates do not establish this specific polyester
        waste state and destination; retain separate atomic waste identities.
    - row_id: quilted_intermediate_in
      reason: Foreground-internal uninspected roll transfer; no public flow
        establishes this exact state.
    - row_id: finished_roll
      reason: Bounded public searches and direct reads did not establish a one-sided
        stitch-quilted polyester taffeta/wadding product identity with
        compatible reference property; generic fabric is insufficient.
    - row_id: composite_offcuts
      reason: Public textile waste candidates do not establish this specific polyester
        waste state and destination; retain separate atomic waste identities.
    - row_id: captured_dust
      reason: Public textile waste candidates do not establish this specific polyester
        waste state and destination; retain separate atomic waste identities.
    - row_id: mineral_oil
      reason: PAO synthetic lubricant and electrical insulation oil are incompatible
        with mineral-base sewing-machine oil.
    - row_id: spent_oil
      reason: Direct-read waste-oil candidates impose composition or route not
        verified for this actual collected oil.
