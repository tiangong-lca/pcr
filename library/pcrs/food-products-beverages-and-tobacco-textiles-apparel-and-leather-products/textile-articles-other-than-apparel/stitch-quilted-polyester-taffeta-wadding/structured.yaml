measurement_rules:
  - id: reference_mass
    applies_to: "finished_roll"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh accepted conditioned textile rolls on calibrated scales; subtract measured core and wrapping tare. Sum net accepted output for the period; exclude rejects and count reworked saleable output only once."
  - id: area_mass
    applies_to: "finished_roll"
    required_property_ref:
      name: "Mass / Area"
      uuid: ""
    required_unit: "kg; m2"
    rule: "Use measured complete-product net mass divided by measured accepted area. Wadding-only nominal g/m2 is not composite areal mass; width and length must describe accepted trimmed output. This complete-product ratio applies only to finished output. For taffeta_input and wadding_input, keep separately measured actual kg; any area conversion must use that input’s own measured supplied-state areal mass, issued/returned area and loss records, never the composite output ratio."
  - id: electricity_conversion
    applies_to: "quilting_electricity; finishing_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Retain the public flow reference property. Convert calibrated-meter kWh to MJ using 1 kWh = 3.6 MJ; record meter scope and allocation."
  - id: basis_consistency
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Row-specific property"
      uuid: ""
    required_unit: "Row-specific unit"
    rule: "Use one net accepted textile mass and period for all exchanges. Area and roll count are supplementary and never replace the kg denominator without measured mass conversion."
