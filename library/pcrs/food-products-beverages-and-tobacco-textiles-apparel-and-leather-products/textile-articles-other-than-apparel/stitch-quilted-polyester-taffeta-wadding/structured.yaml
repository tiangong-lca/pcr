      raw_fields: "material_identity; sampling_method; duration; actual_air_volume; concentration; capture_boundary; subcompartment; uncertainty; accepted_output_kg"
      collection_method: "Use measured representative release over the reporting period; demonstrate particle identity and convert concentration with measured airflow and duration; record absence evidence separately from missing data"
      unit: "kg"
      frequency: "Each batch; reconcile each reporting period"
      temporal_coverage: "Complete declared period including starts, stops, rejects and rework"
      site_scope: "Declared converting site and attributable outsourced operation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, batch ledger, raw records, uncertainty and reconciliation"
    - protocol_id: cp_maintenance
      process_id: "maintenance"
      flow_role: "mineral_oil; spent_oil"
      record_type: "Oil mass records"
      raw_fields: "grade; mineral_base; issue_kg; removed_oil_kg; contamination; machine_service_time; allocation; destination; accepted_output_kg"
      collection_method: "Weigh replenishment and removed oil independently, retain supplier and service records and assign maintenance to actual machine service output"
      unit: "kg"
      frequency: "Each batch; reconcile each reporting period"
      temporal_coverage: "Complete declared period including starts, stops, rejects and rework"
      site_scope: "Declared converting site and attributable outsourced operation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, batch ledger, raw records, uncertainty and reconciliation"
  calculation_rules:
    - id: normalize_batch
      applies_to: "all inventory rows"
      rule: "Define one documented reporting-period pool for the same declared product construction, grade, site and conditioning; include all attributable startup, shutdown, wholly failed batches, rejects and rework. For each exchange j, normalized amount = sum of attributable measured exchange j across that pool / total net accepted textile mass in kg from the same pool. Count reworked product only once when finally accepted; rejected product is not accepted output, while its attributable exchanges remain in the numerator. Do not normalize a wholly failed batch by its zero output, omit its burden or average per-batch ratios. If the complete pool has no positive accepted output, retain the unnormalized inventory and require review; do not fabricate output or a per-kg result. Do not pool unrelated products, divide by gross packed-roll mass or double count internal transfers."
      inputs:
        - cp_material
        - cp_output
        - cp_transfer
        - cp_energy
        - cp_pack
        - cp_waste
        - cp_emission
        - cp_maintenance
      output: "Exchange unit per 1 kg reference flow"
      source_ids: []
    - id: electricity_conversion
      applies_to: "quilting_electricity; finishing_electricity"
      rule: "Electricity in MJ = metered electricity in kWh multiplied by 3.6; then apply normalize_batch. This exact unit conversion is not an energy-intensity assumption."
      inputs:
        - cp_energy
        - cp_output
      output: "MJ per 1 kg reference flow"
      source_ids: []
    - id: area_reporting
      applies_to: "finished_roll"
      rule: "Accepted area = sum of accepted width multiplied by accepted length; complete-product areal mass = net accepted textile kg / accepted m2. If only area statistics exist, weigh representative full-construction samples and validate roll mass conversion. Never use wadding-only g/m2 as total product mass."
      inputs:
        - cp_output
      output: "m2 and kg/m2, supplementary to kg reference"
      source_ids:
        - xmt-q1
  data_quality_requirements:
    - id: dq_identity
      applies_to: "finished_roll; taffeta_input; wadding_input; thread_input"
      requirement: "Retain composition, finished incoming state, bonding auxiliaries, supplier lots, actual seam construction and customer acceptance records; fibre recycled content requires traceable evidence."
      evidence: "cp_material; cp_output"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Reconcile textile issues, accepted mass, rejects, WIP, captured dust and any demonstrated release on consistent moisture bases. Declare residual imbalance and investigate it; never force a fabricated closure or zero emission."
      evidence: "cp_material; cp_transfer; cp_waste; cp_emission"
    - id: dq_temporal
      applies_to: "Site records"
      requirement: "Use one representative complete production period and report actual dates, technology, capacity utilisation, starts/stops, batch mix and missing coverage. No literature recipe, energy, temperature or yield is a default."
      evidence: "cp_energy; cp_output"
    - id: dq_uncertainty
      applies_to: "Measurement and linkage"
      requirement: "Retain calibration and uncertainty, checks on area-to-mass conversion, upstream representativeness, allocation sensitivity and all unresolved UUIDs. Missing records differ from not-applicable operations."
      evidence: "cp_output; cp_energy; cp_waste"
validation_rules:
  - rule_id: validate_scope
    applies_to: "finished_roll"
    rule: "Reject use outside the one-sided polyester sewn route; require all declared qualifiers and actual customer acceptance. Do not infer apparel compliance or thermal equivalence from the intermediate textile record."
    source_ids: []
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Require positive net accepted kg, measured tare, common conditioning, paired internal transfers and reproducible normalized exchanges. Compare total composite areal mass with direct roll weighing; do not use a nominal wadding grade as the denominator.  Verify complete same-product period-pool numerator coverage, including wholly failed batches, and one matching positive accepted-mass denominator. A zero-output pool remains unnormalized and requires review; averaging batch ratios or dropping failed-batch exchanges is prohibited."
    source_ids:
      - xmt-q1
  - rule_id: validate_identity
    applies_to: "Public flows and unresolved rows"
    rule: "Verify public flow type, referenced property, unit, geography, voltage, material and incoming state before use. Blank UUIDs remain exact named exchanges and block claims of fully linked inventory; identity resolution does not approve methodology."
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "pet_dust_air; captured_dust"
    rule: "Separate elementary airborne release from captured waste and technical water. No wet-processing wastewater or combustion emissions are mandatory in this dry route; actual additional operations require complete process additions and verified exchange identities."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground dry quilting conversion dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Input to declared garment lining or other compatible downstream piece-goods conversion, with matching construction, geography, period and upstream linkage"
  excluded_use: "Whole CPC coverage; cradle-to-gate without upstream and transport completeness; finished apparel or quilt LCA; thermal-service comparison; unmeasured recipe or life-cycle claims"
  required_metadata: "Qualifiers; net reference mass; boundary start; site and dates; meters; input upstream datasets; waste destinations; allocation; outsourced processes"
  required_quality_disclosure: "Measurement uncertainty; actual composition and mass closure; sampling; omitted operations; UUID gaps; upstream completeness; scientific review state"
  update_trigger: "Change of layers, fibre origin, finish, sewing pattern, site supply, machinery, upstream source, waste route or evidence of material measurement error"
