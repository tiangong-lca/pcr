allocation_rules:
  - rule_id: allocation_trace
    applies_to: "Each product batch"
    rule: "First assign separately metered sewing, material issues and rejects to the actual product batch. For shared machine electricity and support, use measured run-time with observed operating-state power or submetered energy, reconcile to the site total and disclose idle/changeover assignment. If products differ in stitch density or loft, mass-only energy allocation requires empirical justification."
    source_ids: []
  - rule_id: allocation_scrap
    applies_to: "Scrap and rework"
    rule: "Keep all rejected production burdens with accepted product unless a documented co-product function requires subdivision or allocation. Scrap sale alone does not justify avoided virgin production credit. Record recovered offcuts and their treatment without double counting internal reuse; disclose any multi-output allocation basis, prices, period and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "quilting"
      flow_role: "taffeta_input; wadding_input; thread_input"
      record_type: "Mass issues"
      raw_fields: "lot; composition; finish; origin; issue_kg; returns_kg; opening_and_closing_stock; accepted_output_kg"
      collection_method: "Calibrated weighing and lot-linked issue ledger; reconcile issues, WIP and accepted output"
      unit: "kg"
      frequency: "Each batch; reconcile each reporting period"
      temporal_coverage: "Complete declared period including starts, stops, rejects and rework"
      site_scope: "Declared converting site and attributable outsourced operation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, batch ledger, raw records, uncertainty and reconciliation"
    - protocol_id: cp_output
      process_id: "finishing"
      flow_role: "finished_roll"
      record_type: "Accepted net mass"
      raw_fields: "roll_id; gross_kg; measured_tare_kg; net_kg; width_m; length_m; complete_areal_mass; conditioning; defects ; reporting-period pool ID; same product construction/grade; failed and zero-output batch IDs; rework origin and final accepted roll IDs"
      collection_method: "Weigh every accepted roll; measure accepted area; inspect layer connection and seam defects against declared customer criteria  Reconcile every batch, including wholly failed batches, to the same product/period pool; retain zero-output batch activity for numerator attribution and count finally accepted rework once. Aggregate accepted net mass over this pool for normalize_batch."
      unit: "kg; m2"
      frequency: "Each batch; reconcile each reporting period"
      temporal_coverage: "Complete declared period including starts, stops, rejects and rework"
      site_scope: "Declared converting site and attributable outsourced operation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, batch ledger, raw records, uncertainty and reconciliation"
    - protocol_id: cp_transfer
      process_id: "quilting_finishing"
      flow_role: "quilted_intermediate_out; quilted_intermediate_in"
      record_type: "Internal mass transfer"
      raw_fields: "lot_id; transfer_kg; WIP_kg; conditioning; source_and_receiving_process"
      collection_method: "Paired calibrated scale records on a common conditioning basis"
      unit: "kg"
      frequency: "Each batch; reconcile each reporting period"
      temporal_coverage: "Complete declared period including starts, stops, rejects and rework"
      site_scope: "Declared converting site and attributable outsourced operation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, batch ledger, raw records, uncertainty and reconciliation"
    - protocol_id: cp_energy
      process_id: "quilting_finishing"
      flow_role: "quilting_electricity; finishing_electricity"
      record_type: "Electricity meter"
      raw_fields: "meter_id; opening_kWh; closing_kWh; voltage; region; machine_state; run_time; compressor_and_extraction_allocation; accepted_output_kg"
      collection_method: "Read calibrated submeters for matched batches; independently reconcile support energy to site meters"
      unit: "kWh; MJ"
      frequency: "Each batch; reconcile each reporting period"
      temporal_coverage: "Complete declared period including starts, stops, rejects and rework"
      site_scope: "Declared converting site and attributable outsourced operation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, batch ledger, raw records, uncertainty and reconciliation"
    - protocol_id: cp_pack
      process_id: "finishing"
      flow_role: "ldpe_wrap; paper_core"
      record_type: "Packaging mass"
      raw_fields: "component_grade; issue_kg; scrap_kg; tare_kg; tracked_returns; accepted_output_kg"
      collection_method: "Weigh each packaging component separately and reconcile actual issues and reusable core returns"
      unit: "kg"
      frequency: "Each batch; reconcile each reporting period"
      temporal_coverage: "Complete declared period including starts, stops, rejects and rework"
      site_scope: "Declared converting site and attributable outsourced operation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, batch ledger, raw records, uncertainty and reconciliation"
    - protocol_id: cp_waste
