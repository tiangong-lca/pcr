allocation_rules:
  - rule_id: allocation_trace
    applies_to: "shared line"
    rule: "Avoid allocation by batch separation and submetering. For inseparable utility totals, use measured load and logged runtime with actual cleaning campaign attribution; preserve the causal relation and test sensitivity. Do not allocate by equal kg intensity across grades with different coating add-on or drying burden."
    source_ids: []
  - rule_id: allocation_coproduct
    applies_to: "downgraded cloth; exported scrap"
    rule: "Determine waste versus saleable co-product using actual quality, recipient and market records. Prefer subdivision; if joint burdens remain, justify a measured physical causal driver, otherwise document period-specific economic shares and sensitivity. No default price or displaced-fabric credit is prescribed."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "internal return and rework"
    rule: "Retain all rework/mixing/drying utilities and losses, carry internal returns through stock balance and count accepted fabric once. Record exported waste treatment separately; no burden-free recovered dispersion assumption."
    source_ids: []
