  calculation_rules:
    - id: normalize_batch
      applies_to: "all inventory rows"
      rule: "Divide attributable batch exchange by accepted net finished coated-fabric mass in kg; retain each exchange numerator unit. The final product row is 1 kg."
      inputs:
        - "attributable batch exchange"
        - "accepted net mass"
        - cp_output
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: convert_electricity
      applies_to: "mix_electricity; dry_electricity; finish_electricity; clean_electricity"
      rule: "Convert measured kWh to MJ with 3.6 MJ/kWh before batch normalization; preserve public Net calorific value and energy unit group."
      inputs:
        - "metered kWh"
        - cp_mix_energy
        - cp_dry_energy
        - cp_finish_energy
        - cp_clean_energy
        - cp_output
      output: "MJ per 1 kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_composition
      applies_to: "ready_woven_pet; aqueous_pu_dispersion; finished_coated_fabric"
      requirement: "Verify PET composition and previous finishing state, PU grade, additives, wet/dry composition, dry coating add-on and physical batch acceptance. Supplier film tests or marketing are not finished-fabric quality/lifetime evidence."
      evidence: "supplier specifications; SDS; batch solids and fabric tests"
    - id: dq_balance
      applies_to: "all rows"
      requirement: "Reconcile substrate and nonvolatile PU with accepted composite, offcuts, rejects, residue and stock/rework; separately reconcile coating water with retained moisture, rinse/stock and vapour. Investigate unclosed balances, not assumed yield/loss."
      evidence: "weighing; solids/moisture; separate material/water balances and uncertainty"
    - id: dq_period
      applies_to: "all rows"
      requirement: "Use matched complete representative reporting-period production, cleaning, maintenance, start-up and rework coverage. Record calibration, missing fields, allocation and all actual ancillary material components. No default temperature, energy, recipe or yield."
      evidence: "period logs; calibration; attributable meter and stock records"
    - id: dq_release
      applies_to: "drying_water_vapour; drying_ammonia_air; pu_rinse_wastewater"
      requirement: "Assess formulation-dependent volatiles and capture routes. NH3 is conditional, not all aqueous dispersions emit it. Add each actually relevant species as one row before complete release claims; unknown release, unmeasured residue or recipient treatment gaps remain explicit."
      evidence: "composition audit; representative emission tests; controls; treatment handover evidence"
    - id: dq_upstream
      applies_to: "linked background supply"
      requirement: "Match PET processing state, recycled fraction, PU formulation, electricity geography/voltage, water supply and package composition. Disclose any absent upstream dyeing, water treatment or transport link."
      evidence: "supplier records and compatible upstream dataset references"
validation_rules:
  - rule_id: validate_scope
    applies_to: "product and route"
    rule: "Require declared PET/PUD profile, electric dryer and untreated rinse handover; reject claims for other coating chemistries, wet coagulation, lamination or complete 27997 coverage."
    source_ids:
      - unsd-cpc3-notes-2025
  - rule_id: validate_reference
    applies_to: "all rows"
    rule: "Require positive measured net composite output, finished_coated_fabric reference link, exclusion of packaging and a common per 1 kg denominator. Area-based raw measurements require actual same-grade mass conversion."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "all processes"
    rule: "Require material, water and energy reconciliation with disjoint meters, internal return, rework, stock change and conditional stream evidence. Measured wastewater is not freshwater release; captured condensate is not air emission."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "UUID-bearing rows"
    rule: "Recheck actual flow type, composition, supply route, public reference property, unit group, immediate environmental medium/subcompartment and official Chinese names. Disclose blank identities and never force generic waterproof fabric or neat resin onto the output/PUD input."
    source_ids: []
  - rule_id: validate_complete
    applies_to: "dataset claim"
    rule: "Require every real chemical, utility, package, waste and elementary species as a specific exchange with matched protocol. Absent conditional rows need evidence; uncertain or skipped release checks cannot be described as complete validation."
    source_ids:
      - jrc-textiles-bref-2023
published_dataset_profile:
  dataset_role: "Manufacturing foreground for declared waterborne PU directly coated woven PET roll fabric"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Only after review: declared single-coating, electric-drying profile with compatible upstream supplier and off-site waste treatment datasets and disclosed transport"
  excluded_use: "Whole classification, other fibres/chemistries/lamination, synthetic leather, made-up bags, consumer use/lifetime, health or regulatory approval, automatically complete cradle-to-gate"
  required_metadata: "All qualifiers; factory and period; net accepted output; measured area conversion; wet/dry coating basis; separate utilities; stock/rework; packaging; actual effluent recipient; upstream and transport links; conditional presence; unresolved identity"
  required_quality_disclosure: "Measurement and allocation coverage; water/material closure and uncertainty; volatile-species screening and detection limits; excluded routes; incomplete upstream/treatment links; candidate evidence limits"
  update_trigger: "Substrate finish/fibre, recycled profile, coating composition/layer, added chemicals, heat route, site supply, packaging, waste fate, emission controls, new measurements or verified identity change"
data_sources:
  - id: "unsd-cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD,CPC Version3.0 Explanatory Notes,30June2025,PDF/printed p.129,27996/27997. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Broad classification and adjacent tyre-cord distinction only; no detailed27997 recipe or full coverage"
  - id: "jrc-textiles-bref-2023"
    type: "official_guidance"
    reference: "European Commission JRC,Best Available Techniques Reference Document for the Textiles Industry,EUR31316EN,2023,section2.10.1 printed p.116/PDF151; section2.10.3 printed pp.124–126/PDF159–161. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2023-01/TXT_BREF_2023_for_publishing%20ISSN%201831-9424_final_1_revised.pdf"
    used_for: "Direct coating versus lamination process typology; formulation-dependent emissions screening. Historical cited examples are not universal emission species,factors,current compliance or quantitative operating defaults"
  - id: "covestro-dln-w50"
    type: "handbook"
    reference: "Covestro,Impranil DLN W50,official product page,Product description,Applications,Form supplied,Film properties and Disclaimer; undated live page,retrieved2026-10-06. https://solutions.covestro.com/en/products/impranil/impranil-dln-w-50_000000000057821292"
    used_for: "Actual aqueous aliphatic polyester-PU material and bag/luggage coating application example; not a factory recipe,PET substrate proof,film-to-fabric performance transfer or lifetime. Actual solids and formulation must be measured"
  - id: "paltex-pu-woven-2020"
    type: "handbook"
    reference: "PALTEX, Recommended Textile – PU Coating, 9 December 2020, Woven constructions and Polyester examples; official page retained 2026-10-06. https://www.paltex.com.tw/recommended-textile-pu-coating/"
    used_for: "Historical woven polyester water-based PU market example; no adoption of advertised fibre sizes, coating performance, present recipe or electric-drying configuration."
