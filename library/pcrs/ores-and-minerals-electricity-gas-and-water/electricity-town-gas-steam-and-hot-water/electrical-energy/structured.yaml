          name: "Technology-specific product and service flows"
          flow_type: "product"
          property_unit: "Flow-specific property and unit; fuels shall retain mass or volume and net calorific value needed for energy accounting"
          description: "Record each fuel, feed, reactant, purchased electricity, auxiliary material, water input, and operational service that crosses the plant boundary. Natural-energy capture with no purchased quantity is described in technology metadata rather than assigned a fabricated technosphere amount."
