          property_unit: "Flow-specific property and unit"
          description: "Record plant construction, replacement, maintenance, and decommissioning inputs by material or component and amortize them over measured lifetime net generation. Scenario-dependent end-of-life treatment shall be explicit."
          amount:
            expression: "Installed or replaced quantity multiplied by the included life-cycle share and divided by lifetime net generation; Measurement or interim allocation basis: Lifetime net electricity generation allocated to the declared product"
            value_mode: "calculated_value"
            specificity: "technology_specific"
            basis:
