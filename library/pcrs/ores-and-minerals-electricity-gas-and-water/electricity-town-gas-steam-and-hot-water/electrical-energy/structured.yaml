system_boundary:
  rules:
    - rule_id: boundary_upstream_supply
      applies_to: "Upstream supply"
      rule: "Include extraction or capture, processing, and transport of energy carriers; production of auxiliary materials and purchased electricity; water supply; and treatment services used by the foreground system. Link these burdens through representative upstream datasets."
      source_ids:
        - epd-pcr-2007-08-v5-0-2
    - rule_id: boundary_generation_core
      applies_to: "Electricity generation"
      rule: "Include plant operation, fuel or natural-energy conversion, plant own use, auxiliary consumption, maintenance, direct emissions, operational waste, and the life-cycle share of generation infrastructure."
      source_ids:
        - epd-pcr-2007-08-v5-0-2
    - rule_id: boundary_delivery_conditional
      applies_to: "Transmission and distribution"
      rule: "When the reference product is delivered beyond net plant export, include electricity required to compensate for transmission and distribution losses, network operation and maintenance, direct releases, and the life-cycle share of grid infrastructure up to the declared meter."
      source_ids:
        - epd-pcr-2007-08-v5-0-2
    - rule_id: boundary_use_exclusion
      applies_to: "Downstream use"
      rule: "Exclude the consumer's use of electricity and all processes after the declared customer meter. Do not exclude losses or grid stages that occur before that meter."
      source_ids:
        - epd-pcr-2007-08-v5-0-2
    - rule_id: boundary_cutoff_control
      applies_to: "All included stages"
      rule: "Do not use a cut-off rule to omit a known hazardous, regulated, or potentially material flow. Any screened omission shall be quantified where practicable and disclosed with its expected significance; the retained model shall demonstrate at least 99% coverage of relevant mass, energy, and environmental significance when applying the source PCR's 1% screening rule."
      source_ids:
        - epd-pcr-2007-08-v5-0-2
    - rule_id: boundary_interface_hierarchy
      applies_to: "Production and delivered electricity"
      rule: "Distinguish technology-category production mixes, the regional total production mix, and consumption mixes at each applicable voltage. Follow the actual injection and delivery route, including direct injection, trade and storage where relevant. A production mix and a consumption mix are different products even when their energy unit matches. Count a parent mix or its constituent suppliers at one demand, never both."
      source_ids: []
    - rule_id: boundary_explicit_foreground
      applies_to: "Generation, fuel, assets and delivery"
      rule: "Make fuel origin, processing and transport, generation and own-use, technology-defining assets and their construction, maintenance and retirement, mix composition, physical trade, storage and applicable pre-delivery network stages inspectable in the foreground Model or a resolvable linked submodel. Reuse suitable existing processes or justified proxies; generic material and service production may remain in the background behind explicit, quantified inputs. Missing primary data do not remove a required stage, and a solvable background connection alone does not establish a suitable provider or complete foreground coverage."
      source_ids: []
    - rule_id: boundary_voltage_data_fallback
      applies_to: "Delivered electricity with missing segment records"
      rule: "Prefer compatible measured losses and assets for each voltage segment. Only if segment losses cannot be obtained but a defensible route-wide loss or proxy exists, assign that total or the residual after known segments once to a declared aggregate interface; other unassigned interfaces may pass equal energy. Disclose the denominator, covered route, asset scope and uncertainty. This is an accounting assumption, not measured zero loss or a universal 1:1 Model multiplier. Without a defensible segment or aggregate value, delivery coverage remains unresolved."
      source_ids: []
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "The intended dataset uses compatible, period-specific records for the declared technology, geography, injection voltage, network segment, generation mix, fuel route, and asset life cycle. Preserve original measurements, their gross/net basis, meter positions, source period, publication edition, and exact provider selection before normalizing to the reference flow. For each material quantity, use this evidence order: suitable direct observation; a reproducible derivation from compatible observations; a calibrated representative proxy; then a fixed, reasoned expert assumption. Record the original value, conversion, scope mismatch, uncertainty, sensitivity when a choice could change the main conclusion, and what evidence would replace the assumption. An unavailable value is never silently set to zero."
      source_ids: []
    - rule_id: system_boundary_rule_10
      applies_to: "foreground_system_boundary"
      rule: "For network losses, prefer measured input, output, own use and losses at each applicable voltage segment on a common period and network boundary; allocate segment-specific assets to those segments. Only when voltage-specific losses are unavailable but a defensible total loss or aggregate proxy covers the declared delivery route may the application assign that total, or the residual after known segments, once to a stated aggregate accounting interface. Interfaces without a separate loss assignment may then transfer equal physical energy (1:1) for this scenario. Identify the total-loss denominator, coverage, chosen interface, included assets, remaining segments and uncertainty. Equal-energy transfer is not evidence of physically zero loss at those voltages, is not a universal grid topology, and does not prescribe a Model multiplier of one when native supplier reference amounts differ. Replace the aggregate allocation when suitable segment data become available; never charge the same loss or asset twice. If neither segment data nor a defensible aggregate loss/proxy is available, leave delivery coverage unresolved and do not claim a complete delivered-electricity result."
      source_ids: []
    - rule_id: system_boundary_rule_11
      applies_to: "foreground_system_boundary"
      rule: "When an indispensable fuel, asset, waste-treatment or provider quantity lacks a suitable observation or defensible proxy, retain the unresolved demand and identify the affected life-cycle stage and use limitation. A narrower draft may be described with its actual boundary; it does not satisfy the full boundary in this PCR merely because its schema or solver checks pass."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Energy carriers, natural-energy capture, auxiliary materials, purchased electricity, water, and infrastructure products entering the declared electricity system"
  starting_condition_role: "Category-variable technosphere inputs represented by reviewed upstream datasets and foreground quantities; no single universal carrier is implied"
  product_classification_scope: "CPC 3.0 17100 electrical energy at net generation or declared metered delivery"
  recursive_input_rule: "Purchased electricity used inside generation or networks is an input electricity dataset with its own declared mix and boundary; it is not silently replaced by the output dataset being constructed"
  upstream_dataset_requirement: "Use reviewed and temporally, geographically, and technologically representative datasets for fuels, materials, water supply, purchased electricity, transport, waste treatment, and infrastructure"
  disclosure: "Declare generation technologies and shares, geography, voltage, reference period, net or delivered boundary, loss treatment, infrastructure scope, co-products, and tracking instruments"
