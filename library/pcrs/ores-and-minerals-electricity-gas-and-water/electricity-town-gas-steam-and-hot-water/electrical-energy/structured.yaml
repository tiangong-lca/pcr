measurement_rules:
  - id: measure_reference_energy
    applies_to: "Reference product and internal electricity exchanges"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "kWh or convertible MJ"
    rule: "Report the functional unit as 1 kWh. Retain each linked Process's verified native reference amount and unit, including a 1 MJ or 3.6 MJ reference when applicable; convert consistently using 1 kWh = 3.6 MJ for comparison and preserve unrounded amounts until final normalization."
  - id: measure_net_generation
    applies_to: "Generation output"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "kWh"
    rule: "Net generation equals gross generator output minus measured plant own-use attributable to electricity production over the same period. Do not mix gross and net quantities."
  - id: measure_delivered_energy
    applies_to: "Customer-meter reference boundary"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "kWh"
    rule: "Prefer reconciled measured delivery at the declared boundary. Network input, delivered output, own use, imports, exports, and losses shall share the same period and network scope; a proxy shall identify its mismatch with that boundary. The 1 kWh reference output is not an observed annual delivered amount."
  - id: measure_mix_weighting
    applies_to: "Multi-source generation or supplier/grid mix"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "kWh"
    rule: "Prefer measured net generated or delivered kWh on the declared basis. If unavailable, derive compatible generation or delivery amounts from documented activity and technology-specific assumptions, and label the result a scenario estimate rather than an observed mix. Installed capacity shares alone and assumed annual-volume surrogates are not actual generation shares. Shares shall sum to 100% after documented rounding and shall not double-count contractual attributes."
  - id: measure_annual_supply
    applies_to: "Annual supply or production metadata"
    required_property_ref:
      name: "Energy in the selected reference Flow's unit"
      uuid: ""
    required_unit: "Compatible energy unit in the annual field"
    rule: "Record a numeric annual amount and compatible unit separately from the 1 kWh functional unit. Prefer actual annual production or supply for the declared technology, geography, period, and meter boundary. If no suitable actual amount is obtainable, record a fixed, reproducible assumed annual amount, or explicitly use the native reference Flow amount as an annual surrogate. State the source class, derivation, limitations, and replacement condition in methodology fields; a surrogate is neither observed annual output nor evidence of market share or lifetime asset service. An all-voltage total is not a measured amount at one voltage."
process_map:
  - id: upstream_supply
    name: "Upstream supply of energy carriers, auxiliaries, water, and services"
    inclusion: "required"
    inclusion_condition: "Always included; the applicable input set depends on the declared generation technology or mix"
    role: "Supply reviewed upstream product and service datasets to the foreground electricity system"
    quantitative_reference: "Quantities normalized to 1 kWh at the declared reference boundary"
  - id: electricity_generation
    name: "Electricity generation and plant operation"
    inclusion: "required"
    inclusion_condition: "Always included; each applicable technology may be instantiated separately and composed into mutually exclusive nested mixes"
    role: "Convert declared energy resources into net electricity and record plant operation, infrastructure, emissions, wastes, and co-products"
    quantitative_reference: "Measured net electricity over the reference period, normalized to the reference flow"
  - id: transmission_distribution
    name: "Transmission and distribution to the declared meter"
    inclusion: "conditional"
    inclusion_condition: "Include when the reference boundary is downstream of net plant export; instantiate applicable voltage interfaces"
    role: "Reconcile network inputs, delivered output, losses, network operation, and grid infrastructure"
    quantitative_reference: "1 kWh delivered at the declared voltage and meter"
  - id: reference_interface
    name: "Declared reference interface"
    inclusion: "required"
    inclusion_condition: "Reporting view of the actual net plant-export or customer-meter root; do not create a free electricity provider"
    role: "Pass through exactly one selected root output without adding burden or supply"
    quantitative_reference: "1 kWh at the declared reference boundary"
