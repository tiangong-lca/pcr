allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "Multi-output processes"
    rule: "First avoid allocation by subdividing separately metered processes or by expanding the system only when a reviewed study goal and applicable programme rules permit the substitution claim. Preserve all inputs and outputs without double counting or omission."
    source_ids:
      - eu-pef-2021-2279
      - epd-pcr-2007-08-v5-0-2
  - rule_id: allocation_physical_then_economic
    applies_to: "Residual multi-output burden"
    rule: "If allocation cannot be avoided, apply a causal physical relationship. Use economic allocation only when a physical relationship cannot reasonably represent burden causality, and disclose prices, reference period, currency, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
      - epd-pcr-2007-08-v5-0-2
  - rule_id: allocation_chp_alternative_generation
    applies_to: "Combined heat and power"
    rule: "For useful electricity and heat, allocate the shared burden by the Alternative Generation Method: electricity share = (E_net / eta_e) / [(E_net / eta_e) + (H_net / eta_h)]. Use net measured outputs and documented reference efficiencies; assign exclusive equipment 100% to the product it serves and apply the formula only to shared equipment and burdens."
    source_ids:
      - epd-pcr-2007-08-v5-0-2
  - rule_id: allocation_waste_and_coproduct_identity
    applies_to: "Residues and recovered outputs"
    rule: "Classify each output once. A useful product with a documented function and destination is a co-product; a flow sent for waste treatment is waste. Do not credit an avoided product unless system expansion is explicitly permitted and documented."
    source_ids:
      - epd-pcr-2007-08-v5-0-2
dataset_production:
  collection_protocols:
    - protocol_id: cp_annual_supply
      process_id: "electricity_generation"
      flow_role: "Annual production or delivered-supply metadata"
      record_type: "Metered totals, compatible statistics, or a documented fixed assumption"
      raw_fields: "amount; native reference unit; technology; geography; voltage; meter boundary; reference period; source class; source edition; derivation"
      collection_method: "Search for matching actual annual amounts first; otherwise fix a reproducible assumption or explicitly mark native reference amount as the annual surrogate"
      unit: "Compatible energy unit in annual field"
      frequency: "Each reference year and source revision"
      temporal_coverage: "Declared reference year, separate from source publication year"
      site_scope: "Declared generation or delivery boundary"
      aggregation_rule: "Keep actual, derived and assumed amounts distinct; do not aggregate unlike scopes into a measured voltage-specific total"
      quality_evidence: "Source table or meter records, conversion, representativeness, proxy rationale, sensitivity and replacement condition"
    - protocol_id: cp_input_records
      process_id: "upstream_supply"
      flow_role: "Upstream product and service requirements"
      record_type: "Supplier, invoice, stock, transport, and service records"
      raw_fields: "flow identity; supplier; quantity; unit; opening stock; closing stock; origin; date; linked dataset"
      collection_method: "Reconcile purchases, production, stock change, and transfers; retain separate flow identities; Aggregation before final reference normalization: Sum by identical flow, supplier, geography, and quality; do not net unlike flows"
      unit: "Flow-specific"
      frequency: "At least monthly, aggregated for reporting"
      temporal_coverage: "Same representative period as electricity output"
      site_scope: "All included suppliers and facilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "Invoices, meter exports, stock reconciliation, supplier evidence, and dataset links"
    - protocol_id: cp_generation_inputs
      process_id: "electricity_generation"
      flow_role: "Generation energy and auxiliary inputs"
      record_type: "Plant meters, invoices, batch logs, stock records, and laboratory records"
      raw_fields: "flow identity; quantity; unit; NCV where relevant; supplier; meter; timestamp; stock change"
      collection_method: "Reconcile meter and mass-balance records against production logs; Aggregation before final reference normalization: Sum consistent records; keep units and technologies separately identifiable before normalization"
      unit: "Flow-specific"
      frequency: "Continuous or per batch, aggregated monthly"
      temporal_coverage: "Complete declared reference period"
      site_scope: "All generating units included in the dataset"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated meters, invoices, calibration certificates, stock balance, and responsible-person sign-off"
    - protocol_id: cp_generation_metering
      process_id: "electricity_generation"
      flow_role: "Gross, own-use, net, and co-generated electricity"
      record_type: "Revenue meters, generator meters, and auxiliary meters"
      raw_fields: "meter id; gross output; own use; imports; exports; unit; timestamp; voltage; current form"
      collection_method: "Use synchronized meter readings and reconcile gross minus attributable own use to net output; Aggregation before final reference normalization: Sum only readings with aligned boundaries and periods; document replacements and gaps"
      unit: "kWh"
      frequency: "Continuous, aggregated monthly"
      temporal_coverage: "Complete declared reference period"
      site_scope: "Every included generator and auxiliary boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter class, calibration status, raw exports, reconciliation, and gap-filling log"
    - protocol_id: cp_infrastructure_records
      process_id: "electricity_generation"
      flow_role: "Generation infrastructure and maintenance"
      record_type: "Asset register, bills of materials, maintenance and decommissioning plans"
      raw_fields: "asset or material; quantity; unit; commission date; life; replacement; end-of-life route"
      collection_method: "Reconcile installed and replaced assets to engineering records and amortize over lifetime net generation; Aggregation before final reference normalization: Allocate exclusive assets directly; amortize shared assets consistently with section 7"
      unit: "Flow-specific"
      frequency: "At commissioning and each material change"
      temporal_coverage: "Asset life, linked to the dataset reference period"
      site_scope: "All material generation assets inside the declared boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset register, engineering drawings, procurement records, and lifetime rationale"
    - protocol_id: cp_coproduct_metering
      process_id: "electricity_generation"
      flow_role: "Useful co-product output"
      record_type: "Heat, steam, or product meter and delivery records"
      raw_fields: "product identity; net delivered amount; unit; timestamp; customer or destination; internal use"
      collection_method: "Reconcile gross output, internal use, and external delivery on the same period; Aggregation before final reference normalization: Aggregate by identical product and quality; keep non-useful rejected heat separate"
      unit: "Product-specific"
      frequency: "Continuous or per shipment, aggregated monthly"
      temporal_coverage: "Complete declared reference period"
      site_scope: "Every useful co-product leaving included units"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, delivery records, and customer acceptance"
    - protocol_id: cp_waste_records
      process_id: "electricity_generation"
      flow_role: "Operational residues and wastes"
      record_type: "Weighbridge tickets, manifests, laboratory classification, and stock records"
      raw_fields: "waste identity; hazard class; mass; destination; treatment; date; opening and closing stock"
      collection_method: "Reconcile shipments and stock change; preserve destination and treatment identity; Aggregation before final reference normalization: Sum only identical waste and treatment routes"
      unit: "kg"
      frequency: "Per shipment, aggregated monthly"
      temporal_coverage: "Complete declared reference period"
      site_scope: "All included units and waste stores"
      aggregation_rule: "per reference flow"
      quality_evidence: "Manifests, weighbridge calibration, permits, laboratory results, and contractor receipts"
    - protocol_id: cp_direct_releases
      process_id: "electricity_generation"
      flow_role: "Direct releases and resource withdrawals"
      record_type: "Continuous monitoring, stack tests, water tests, permits, fuel records, and calculation sheets"
      raw_fields: "substance; compartment; amount; unit; method; detection limit; timestamp; activity; factor"
      collection_method: "Prefer facility measurement; otherwise calculate from reconciled activity and documented representative factors; Aggregation before final reference normalization: Sum by substance and compartment; treat non-detects and missing periods explicitly"
      unit: "kg or flow-specific"
      frequency: "Continuous, test campaign, or calculation period appropriate to the source"
      temporal_coverage: "Complete declared reference period, with campaigns shown representative"
      site_scope: "Every included emission point and direct withdrawal"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, laboratory accreditation, method, factor source, calculation workbook, and coverage statement"
    - protocol_id: cp_network_metering
      process_id: "transmission_distribution"
      flow_role: "Network input, delivery, import, export, own use, and losses"
      record_type: "Boundary and customer meter records"
      raw_fields: "meter id; network level; input; output; import; export; own use; timestamp; voltage; loss denominator; aggregate coverage"
      collection_method: "Prefer reconciling each voltage-segment energy balance over identical network scope and time; when segment records are unavailable, check the aggregate loss or proxy scope and denominator and allocate it once; Aggregation before final reference normalization: Network input minus delivery, exports, and own use equals accounted losses after documented adjustments; interfaces without another assigned loss transfer equal energy"
      unit: "kWh"
      frequency: "Continuous, aggregated monthly; record a proxy's source period"
      temporal_coverage: "Complete declared reference period; disclose any proxy period mismatch"
      site_scope: "Entire declared network route to the meter"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter class, calibration, raw exports, reconciliation, loss-adjustment log, proxy source, and accounting interface"
    - protocol_id: cp_network_records
      process_id: "transmission_distribution"
      flow_role: "Network assets, maintenance, energy, and releases"
      record_type: "Asset register, maintenance logs, gas and oil records, procurement, and decommissioning plans"
      raw_fields: "asset or substance; quantity; unit; voltage; route; life; stock; recovery; release; date; proxy coverage"
      collection_method: "Prefer reconciling segment assets and substances to the declared voltage and network scope; disclose included stages and the sole accounting interface for a shared asset proxy; Aggregation before final reference normalization: Amortize assets over delivered electricity; calculate stock losses from complete opening, purchase, recovery, and closing records; count shared assets once"
      unit: "Flow-specific"
      frequency: "At event and annually"
      temporal_coverage: "Asset life and complete declared reference period"
      site_scope: "Entire declared network route"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset register, maintenance work orders, purchase and recovery records, calibration, lifetime rationale, and proxy suitability review"
  calculation_rules:
    - id: calc_net_generation
      applies_to: "electricity_generation"
      rule: "Net electricity = gross generator output - plant own-use attributable to electricity. Reconcile imports and exports separately and use aligned meter periods."
      inputs:
        - "gross output"
        - "attributable plant own use"
        - imports
        - exports
      output: "net electricity output"
      source_ids:
        - epd-pcr-2007-08-v5-0-2
    - id: calc_delivery_balance
      applies_to: "transmission_distribution"
      rule: "Accounted network loss = network input + imports - exports - delivered electricity - network own use - storage increase + storage decrease. Scale generation and upstream burdens to the network input needed for 1 kWh delivered."
      inputs:
        - "network input"
        - imports
        - exports
        - "delivered electricity"
        - "own use"
        - "storage change"
      output: "loss and required input per delivered kWh"
      source_ids:
        - epd-pcr-2007-08-v5-0-2
    - id: calc_inventory_normalization
      applies_to: "All foreground inventory rows"
      rule: "Normalized amount = reconciled period amount / reference-period net or delivered electricity, then multiplied by 1 kWh. Keep calculation precision and round only reported values."
      inputs:
        - "reconciled flow amount"
        - "reference-period electricity output"
      output: "flow amount per reference kWh"
      source_ids:
        - epd-pcr-2007-08-v5-0-2
    - id: calc_native_reference_scaling
      applies_to: "Linked foreground Processes and Models"
      rule: "For a supplier with native reference output r, an exchange amount a and demand d in compatible units, its contribution is a*d/r. Retain r, d and the selected supplier; a 1 MJ supplier serving 2 MJ demand scales by 2, while a 3.6 MJ supplier serving 2 MJ scales by 2/3.6. A Model multiplier is not a mix share or an annual production amount."
      inputs:
        - "supplier exchange a"
        - "native output r"
        - "demand d"
      output: "contribution per declared reference flow"
      source_ids: []
    - id: calc_voltage_losses
      applies_to: "Voltage-stage delivery"
      rule: "With measured segment data, calculate each stage on its recorded denominator: if l = loss/input, required input = output/(1-l); if r_loss = loss/output, required input = output*(1+r_loss). If only a defensible aggregate loss exists, assign it once to one stated interface and allow equal-energy transfer at other unassigned stages; this does not mean physical zero loss. If no defensible loss exists, leave coverage unresolved."
      inputs:
        - "segment or aggregate loss"
        - denominator
        - output
        - "assigned stage"
      output: "required input at each declared interface"
      source_ids: []
    - id: calc_mix_residual
      applies_to: "Statistical production mixes"
      rule: "Preserve each published category amount g_i, published total T and original residual T - sum(g_i). Only with compatible reporting scopes, positive sum(g_i), and a documented, justified reconciliation assumption may a bounded residual be allocated proportionally: adjusted g_i = g_i + (T - sum(g_i))*g_i/sum(g_i). This scenario does not identify the residual's actual technology. Preserve original and adjusted values separately; an unexplained or material missing supply remains unresolved rather than becoming a fictitious producer."
      inputs:
        - "original category amounts"
        - total
        - residual
        - "declared reconciliation rule"
      output: "traceable scenario weights and unresolved balance"
      source_ids: []
    - id: calc_combustion_emissions
      applies_to: "Fuel combustion direct releases"
      rule: "For each fuel and GHG, emission = fuel consumption on a net-calorific-value energy basis x representative emission factor. Prefer facility measurements and technology-specific factors; retain fuel, NCV, factor, oxidation or control assumptions, and units."
      inputs:
        - "fuel quantity"
        - "net calorific value"
        - "emission factor"
        - "measurement or control parameters"
      output: "emission by substance"
      source_ids:
        - ipcc-2006-stationary-combustion
    - id: calc_generation_mix
      applies_to: "Multi-source electricity"
      rule: "Mix inventory = sum of each constituent inventory x its compatible kWh share. Prefer observed net-generation or delivered quantities; when these are unavailable use an explicitly modelled, reproducible scenario estimate with its activity, utilization and time basis, never bare capacity shares or annual-volume surrogates as actual market weights. Shares use the same basis and period and sum to 100% after documented rounding."
      inputs:
        - "constituent inventories"
        - "compatible constituent kWh"
        - "total kWh"
      output: "declared observed or estimated electricity-mix inventory"
      source_ids:
        - eu-pef-2021-2279
        - epd-pcr-2007-08-v5-0-2
    - id: calc_chp_allocation
      applies_to: "Combined heat and power"
      rule: "Electricity allocation share = (E_net / eta_e) / [(E_net / eta_e) + (H_net / eta_h)]. Apply the complementary share to useful heat; allocate exclusive assets directly."
      inputs:
        - "net electricity"
        - "net useful heat"
        - "reference electrical efficiency"
        - "reference thermal efficiency"
      output: "burden shares for electricity and useful heat"
      source_ids:
        - epd-pcr-2007-08-v5-0-2
    - id: calc_infrastructure_amortization
      applies_to: "Generation and network infrastructure"
      rule: "Per-kWh infrastructure amount = included asset quantity x allocation share / lifetime net generation or lifetime delivered electricity corresponding to that asset."
      inputs:
        - "asset quantity"
        - "included life-cycle share"
        - "allocation share"
        - "lifetime electricity"
      output: "infrastructure amount per kWh"
      source_ids:
        - epd-pcr-2007-08-v5-0-2
  data_quality_requirements:
    - id: dq_temporal
      applies_to: "All foreground data"
      requirement: "Use a complete and representative reference period, normally one year. Explain outages, abnormal dispatch, curtailment, seasonal bias, estimated gaps, and any shorter period."
      evidence: "Timestamped raw records, coverage table, operating log, and representativeness rationale"
    - id: dq_geographical
      applies_to: "Generation mix, fuel supply, and networks"
      requirement: "Match the declared plant, supplier, country or sub-national grid, and voltage. For China, prefer a representative sub-national grid mix when the delivery scope is grid electricity."
      evidence: "Facility and meter locations, supplier evidence, grid boundary, and geographic dataset metadata"
    - id: dq_technological
      applies_to: "Generation and control technology"
      requirement: "Match fuel, conversion technology, unit efficiency, pollution controls, storage, infrastructure, and operating mode; do not use a narrow technology process as a universal CPC 17100 default."
      evidence: "Unit configuration, process description, permits, commissioning year, and technology-specific dataset metadata"
    - id: dq_metering_and_balance
      applies_to: "Electricity and co-product quantities"
      requirement: "Use calibrated or legally controlled meters where applicable and demonstrate gross-to-net, network, and co-product balances on aligned boundaries and periods."
      evidence: "Calibration evidence, raw meter exports, reconciliation workbook, and signed exception log"
    - id: dq_source_traceability
      applies_to: "Secondary datasets, factors, and contractual attributes"
      requirement: "Record source, version or date, geography, technology, licence or access, selection rationale, and any modification. Supplier-specific electricity claims require qualifying contractual or tracking evidence and prevention of double counting."
      evidence: "Dataset metadata, factor sheets, contracts or instruments, quality-criteria assessment, and residual-mix check"
    - id: dq_completeness
      applies_to: "Inventory boundary"
      requirement: "Include all known material, energy, emission, waste, infrastructure, and delivery stages required by section 5. Quantify and justify omissions and explain zero values; an unresolved material stage remains incomplete even if another proxy or a solver returns a number."
      evidence: "Completeness checklist, mass and energy balances, permit comparison, and omission log"
    - id: dq_evidence_hierarchy
      applies_to: "Material quantities and provider choices"
      requirement: "Prefer compatible observations, then reproducible derivations, calibrated proxies and fixed, reasoned assumptions. Keep source facts, estimates and unknowns separate. Disclose source year versus represented year, scope mismatch, uncertainty, material sensitivity and replacement evidence; an available Flow or potential provider alone does not prove that the selected provider is suitable or actually used."
      evidence: "Original record, derivation, provider selection and calculation readback, limitation and sensitivity register"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm that the actual selected existing electricity interface Flow, property, unit group and unit conversion match the declared technology, voltage, current form and reference boundary. Section 3's generic Electricity Flow identifies the category, not every qualified interface. Confirm all required qualifiers and the CPC 17100 boundary."
    source_ids:
      - un-cpc-3-0
      - tiangong-identity-query
  - rule_id: validate_energy_balance
    applies_to: "Generation and delivery"
    rule: "Confirm gross minus attributable plant own-use equals net generation, and confirm the delivery balance closes within documented meter uncertainty. Reject mixed periods, voltage scopes, or gross/net bases."
    source_ids:
      - epd-pcr-2007-08-v5-0-2
  - rule_id: validate_mix_and_attributes
    applies_to: "Electricity mix"
    rule: "Confirm constituent kWh shares sum to 100%, each constituent has compatible boundaries and periods, and contractual attributes are not counted in both supplier-specific and residual/grid mixes."
    source_ids:
      - eu-pef-2021-2279
      - ghg-protocol-scope-2
  - rule_id: validate_inventory_completeness
    applies_to: "System boundary and inventory"
    rule: "Reconcile fuel and auxiliary records, direct releases, wastes, plant infrastructure, and conditional network stages against permits, meters, asset records, and the completeness statement."
    source_ids:
      - epd-pcr-2007-08-v5-0-2
      - iea-energy-statistics-manual
  - rule_id: validate_allocation
    applies_to: "Multi-output processes"
    rule: "Confirm the allocation hierarchy is followed, all inputs and outputs are conserved, CHP formula inputs are documented, exclusive equipment is assigned directly, and sensitivity is disclosed for consequential choices."
    source_ids:
      - eu-pef-2021-2279
      - epd-pcr-2007-08-v5-0-2
  - rule_id: validate_sources_and_period
    applies_to: "Evidence package"
    rule: "Confirm every secondary dataset and factor is identifiable and representative, the foreground reference period is complete, estimates and data gaps are visible, and confidential records remain auditable."
    source_ids:
      - iea-energy-statistics-manual
      - ghg-protocol-scope-2
  - rule_id: validate_annual_supply
    applies_to: "Annual quantity metadata"
    rule: "Require a numeric annual amount and compatible unit. Prefer a matching actual amount; otherwise verify the fixed assumption or native-reference surrogate and its separate methodology disclosure. Do not interpret a surrogate as measured production, actual market share, or asset lifetime service."
    source_ids: []
  - rule_id: validate_voltage_fallback
    applies_to: "Delivered-electricity loss and asset coverage"
    rule: "Use segment-specific evidence when available. Otherwise verify that a defensible aggregate loss/proxy was assigned once, known segments were excluded from the residual, equal-energy transfer is labelled an assumption, and asset scope and uncertainty are disclosed. Reject 1:1 as proof of zero loss or full delivery coverage when no defensible total exists."
    source_ids: []
  - rule_id: validate_mix_residual
    applies_to: "Production mix and statistical balance"
    rule: "Check mutually exclusive parent/child categories, original total versus category sum, the evidence for any residual reconciliation, and recomputation of dependent mixes and resulting inventories. Do not create a supplier for an unexplained statistical difference."
    source_ids: []
  - rule_id: validate_foreground_lineage
    applies_to: "Model and resulting-process chain"
    rule: "Trace each declared low- or other-voltage demand through exact selected supplier versions, Model/result associations, reference-output exchanges and native r/d scaling. Check effective providers and unresolved demands separately from available candidates, and prevent double counting a parent mix with its children. A valid graph or solver receipt alone does not prove complete life-cycle coverage."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for generation or delivery of electrical energy; after review it may support a process, lifecycle model, secondary dataset, or background electricity dataset"
  downstream_use: "Product and organizational LCA, footprinting, supply-chain modelling, energy-system studies, and downstream process inventories requiring electricity at a declared boundary"
  allowed_use: "Use when generation technology or mix, geography or supplier, voltage, reference boundary, period, losses, infrastructure, and contractual attributes match the study"
  excluded_use: "Do not use as an undeclared global average, as a substitute for a route- or voltage-specific dataset, for electricity-use processes beyond the meter, for supplier-specific claims without qualifying contractual evidence, or to claim full-boundary coverage while material stages remain unresolved"
  required_metadata: "PCR id; CPC 17100; selected reference Flow and native unit; technology or mix and mutually exclusive hierarchy; geography, grid, or supplier; current form; voltage; reference boundary; reference period; net or delivered basis; loss and infrastructure scope; co-products and allocation; numeric annual supply/production amount with compatible unit; data sources and effective provider versions in the application evidence"
  required_quality_disclosure: "Meter coverage and calibration; source class of annual amount and actual-volume uncertainty; data gaps and fixed proxies; voltage-specific measurements or the declared aggregate-loss interface and equal-energy assumption; temporal, geographical, and technological representativeness; energy balances and original statistical residual; foreground and background coverage; cut-offs; allocation; uncertainty or sensitivity; contractual-instrument and residual-mix treatment"
  update_trigger: "Material change in generation technology, fuel or resource supply, mix shares, plant performance, pollution control, grid route or voltage, losses, infrastructure, co-products, allocation, emission factors, contractual instruments, or reference period"
data_sources:
  - id: "un-cpc-3-0"
    type: "standard"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0, class 17100 Electrical energy, https://unstats.un.org/unsd/classifications/Econ/cpc"
    used_for: "Product-category identity and category boundary"
  - id: "epd-pcr-2007-08-v5-0-2"
    type: "standard"
    reference: "EPD International, PCR 2007:08 Electricity, steam and hot/cold water generation and distribution, version 5.0.2, 2026-05-04, https://www.environdec.com/pcr-library/pcr2007-08"
    used_for: "Functional unit, boundary, infrastructure, losses, data requirements, allocation, and validation rules"
  - id: "eu-pef-2021-2279"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279 on the use of Environmental Footprint methods, https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30"
    used_for: "Electricity-mix hierarchy, residual mix and double-counting controls, and allocation hierarchy"
  - id: "ipcc-2006-stationary-combustion"
    type: "official_guidance"
    reference: "IPCC 2006 Guidelines for National Greenhouse Gas Inventories, Volume 2, Chapter 2 Stationary Combustion, https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_2_Ch2_Stationary_Combustion.pdf"
    used_for: "Fuel-energy conversion and direct-combustion emission calculation method"
  - id: "ghg-protocol-scope-2"
    type: "standard"
    reference: "GHG Protocol Scope 2 Guidance, https://ghgprotocol.org/scope-2-guidance"
    used_for: "Contractual-instrument quality, supplier-specific claims, disclosure, and double-counting controls"
  - id: "iea-energy-statistics-manual"
    type: "handbook"
    reference: "International Energy Agency, Energy Statistics Manual, https://www.iea.org/reports/energy-statistics-manual"
    used_for: "Energy-balance completeness, source consistency, and statistical data-quality checks"
  - id: "tiangong-identity-query"
    type: "dataset"
    reference: "TianGong LCA data service queried with the sibling tiangong-cli; public flow, flow-property, unit-group, and process records checked at authoring time"
    used_for: "Identity evidence only; no database version is pinned and no process amount is adopted as a universal default"
