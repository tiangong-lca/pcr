system_boundary:
  rules:
    - rule_id: boundary_creation
      applies_to: "foreground_system_boundary"
      rule: "Include actual preparation, recording/creation, retries, processing, technical checks, pre-acceptance storage and initial agreed delivery. Select operations from the real route; not all recordings require a mixed or mastered version."
      source_ids:
        - un-cpc-sound-originals
    - rule_id: boundary_stage
      applies_to: "foreground_system_boundary"
      rule: "Declare the accepted stage and supporting components. For music, tracking, approved mix and mastered mix are distinct handoffs; carry prior burdens forward once rather than repeatedly treating them as new independent creations."
      source_ids:
        - academy-delivery-2025
    - rule_id: boundary_downstream
      applies_to: "foreground_system_boundary"
      rule: "Record actual acceptance and completion of the first agreed delivery separately; creation ends only when both are complete. Retain attributable storage, support, services and equipment activity between those endpoints. Separate ongoing preservation after that boundary, later media replication, downloads, streaming, transmission and listening. Initial delivery network activity, physical carriers and shipping actually used must be recorded; no default network-energy coefficient."
      source_ids: []
    - rule_id: boundary_actual
      applies_to: "foreground_system_boundary"
      rule: "Screen actual facility utilities, fuels, releases, consumables, equipment, travel and wastes. Add one specific row for each present exchange omitted here; no assumed generator/refrigerant emissions. Electricity supplier emissions are upstream. Missing upstream inventories prevent a complete cradle-to-gate claim."
      source_ids: []
