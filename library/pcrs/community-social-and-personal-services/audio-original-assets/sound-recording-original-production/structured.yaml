allocation_rules:
  - rule_id: allocate_shared
    applies_to: "foreground_burden_allocation"
    rule: "Subdivide jobs first. Attribute shared meters using actual measured device power/occupancy and task logs; explain standby, ventilation and support shares and reconcile all assignments. Supplier storage/network inventory uses actual capacity-time/transfers and service scope, not price or universal kWh/GB."
    source_ids: []
  - rule_id: allocate_original
    applies_to: "foreground_burden_allocation"
    rule: "Prefer subdivision of jointly produced originals; otherwise justify physical shared-work fractions and sensitivity. Failed takes/revisions belong to the accepted asset. Keep component/set, raw/mix/master and radio/sound overlap burdens traceable and counted once; rights or royalty sales are not co-products."
    source_ids: []
  - rule_id: allocate_equipment
    applies_to: "foreground_burden_allocation"
    rule: "Attribute real equipment manufacturing with a persistent asset ledger across all projects and periods. Measured project use is only the numerator; the denominator must cover supported actual lifetime/cumulative service activity or a justified expected lifetime, with sensitivity and subsequent reconciliation. Cumulative allocated manufacturing fractions across every project and period must not exceed 1, and must never reset at a new project or observation window. An observed-period method distributes only the already attributed manufacturing fraction of that period, not a whole asset inventory in every period. Unknown lifetime, denominator or period share requires explicit review; no default life or mass. Avoid service/rental/equipment duplication and automatic waste credits."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "finish"
      flow_role: "accepted_original"
      record_type: "Original acceptance ledger"
      raw_fields: "ID; version; stage; hierarchy; duration; encoding/analogue format; acceptance result; delivery; rights"
      collection_method: "Inspect complete original, components, playback and actual agreed technical/rights records; reconcile replicas and earlier stage IDs"
      unit: "item"
      frequency: "every accepted original"
      temporal_coverage: "full creation and rework to initial delivery"
      site_scope: "all operator/provider sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "original checksum or analogue carrier ID; signed acceptance; component ledger"
    - protocol_id: cp_energy
      process_id: "prepare_capture_finish"
      flow_role: "electricity"
      record_type: "Meter and job records"
      raw_fields: "meter; timestamps; kWh; task; site; voltage; power profile; standby/support; provider coverage"
      collection_method: "Submeter jobs or reconcile interval meters with measured device power and occupancy logs; convert measured kWh to MJ"
      unit: "MJ"
      frequency: "each session and processing/delivery interval"
      temporal_coverage: "all project work including failed takes and backup"
      site_scope: "all included sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated meters; job logs; assigned-total reconciliation"
    - protocol_id: cp_carrier
      process_id: "capture_finish"
      flow_role: "blank_tape; discarded_tape"
      record_type: "Carrier balance"
      raw_fields: "grade; backing/coating; width; length; kg issued/returned/retained/discarded; treatment"
      collection_method: "Weigh actual tape or use verified grade-specific measured linear mass; reconcile embodied delivered tape separately from waste"
      unit: "kg"
      frequency: "each issue/return/discard"
      temporal_coverage: "full declared analogue work"
      site_scope: "operator and relevant providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated weighing; supplier specifications; stock/treatment ledger"
    - protocol_id: cp_equipment
      process_id: "capture_finish"
      flow_role: "microphone_share; recorder_share; workstation_share"
      record_type: "Asset utilization"
      raw_fields: "asset ID; model; configuration; production inventory; actual task hours; supported lifetime/cumulative service activity; justified expected lifetime; period share; prior cumulative fractions; assigned fraction; remaining fraction; sensitivity; subsequent reconciliation; actual acceptance timestamp; actual first-delivery completion timestamp; attributable activity between those endpoints"
      collection_method: "Link real assets to manufacturing inventories and task logs; verify lifetime/service denominator and persistent cross-project/cross-period ledger. Distribute only an already attributed period share in observation-only accounting; reconcile cumulative fractions at most 1. Unknown denominator/share requires review, no default lifespan"
      unit: "item"
      frequency: "each project and asset update"
      temporal_coverage: "Full project activity through both actual acceptance and first agreed delivery completion, ending at the later recorded endpoint; do not assume coincidence"
      site_scope: "owned equipment at included sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "persistent asset ledger; lifetime/period-share evidence; cumulative share conservation; sensitivity; subsequent reconciliation"
    - protocol_id: cp_service
      process_id: "capture_finish"
      flow_role: "recording_service; mastering_service; hosted_storage"
      record_type: "Provider activity ledger"
      raw_fields: "provider; session/service h; capacity; region; redundancy; delivery; energy/equipment/travel coverage; actual acceptance timestamp; actual first-delivery completion timestamp; attributable activity between those endpoints"
      collection_method: "Obtain session/storage activity and supplier inventory; reconcile capacity-time and service-hour definition and avoid owned/provider overlap"
      unit: "h"
      frequency: "each supplier delivery/interval"
      temporal_coverage: "Full project activity through both actual acceptance and first agreed delivery completion, ending at the later recorded endpoint; do not assume coincidence"
      site_scope: "declared providers/sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier environmental inventory; activity ledger; scope reconciliation"
    - protocol_id: cp_asset
      process_id: "capture"
      flow_role: "source_original"
      record_type: "Source-asset provenance"
      raw_fields: "source ID/version; stage; components; rights; upstream burden; share"
      collection_method: "Verify original provenance, allowed reuse and production inventory; document attributable share separately from royalties"
      unit: "item"
      frequency: "each source component"
      temporal_coverage: "actual source production represented by upstream inventory"
      site_scope: "identified source producers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "upstream dataset; rights record; parent/component reconciliation"
    - protocol_id: cp_travel
      process_id: "capture"
      flow_role: "location_travel"
      record_type: "Journey records"
      raw_fields: "car route; petrol; km; passengers; purpose; provider coverage"
      collection_method: "Read actual journeys and project occupancy share; reconcile passenger-distance and exclude duplicate supplier transport"
      unit: "person*km"
      frequency: "each journey"
      temporal_coverage: "full actual production travel"
      site_scope: "production locations"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "trip logs; route and passenger records"
  calculation_rules:
    - id: electricity_conversion
      applies_to: "prep_electricity; capture_electricity; finish_electricity"
      rule: "MJ = attributable measured kWh × 3.6; preserve the original denominator."
      inputs:
        - cp_energy
        - "measured kWh"
      output: "MJ per declared reference flow"
      source_ids: []
    - id: original_normalization
      applies_to: "all inventory rows"
      rule: "For homogeneous originals of identical declared scope divide each attributable total by actual accepted count. Assign unlike assets by project first and report separately. Reference output is exactly 1 item."
      inputs:
        - cp_acceptance
        - "attributable totals"
      output: "exchange amount per declared reference flow"
      source_ids: []
    - id: provider_reconciliation
      applies_to: "recording_service; mastering_service; hosted_storage"
      rule: "Reconcile actual specified activity with provider inventory; duration/capacity alone cannot determine energy."
      inputs:
        - cp_service
        - "provider inventory"
      output: "service amount per declared reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_original
      applies_to: "accepted_original"
      requirement: "Fix stage, complete hierarchy, version and actual acceptance specification. For music, apply delivery guidance only if adopted; speech/environmental originals use their actual specification."
      evidence: "cp_acceptance; academy-delivery-2025"
    - id: quality_format
      applies_to: "accepted_original"
      requirement: "Record native and delivered resolution/format, channel layout and metadata provenance; converted files do not imply newly created content or better source resolution. LOC preferences are preservation guidance, not universal commissioning requirements."
      evidence: "cp_acceptance; loc-audio-formats"
    - id: quality_activity
      applies_to: "all inventory rows"
      requirement: "Reconcile complete operations, material stocks, support, equipment and suppliers; disclose missing measurements/upstream inventories with uncertainty, never as zero. Verify equipment cumulative shares across all projects/periods, lifetime/service denominator and subsequent updates; unsubstantiated denominator or period share remains under review."
