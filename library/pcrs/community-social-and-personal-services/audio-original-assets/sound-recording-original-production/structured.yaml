  - rule_id: validate_coverage
    applies_to: "foreground_dataset_conformance"
    rule: "Check each actual route, retry, backup, initial delivery and support activity; screen releases and retain atomic additions. Reconcile operator/provider attribution and disclose missing identities and upstream burdens before any complete lifecycle claim. Reject resetting a whole asset manufacturing inventory per project/period or cumulative asset shares above 1; require review for unsupported lifetime, denominator or period share."
    source_ids: []
  - rule_id: validate_units
    applies_to: "foreground_dataset_conformance"
    rule: "Preserve original count, physical carrier mass, electrical MJ, provider hours and passenger-distance. Inspect public identity route/property/unit, not just names; never map GB directly to kWh or rewrite public properties."
    source_ids: []
