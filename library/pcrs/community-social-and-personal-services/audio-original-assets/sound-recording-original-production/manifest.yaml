  evidence_limitations:
    - Official classification explains asset scope only and supplies no environmental coefficients.
    - Music delivery recommendations support stages and component completeness; they do not impose music-specific mastering or format on speech and environmental recordings.
    - LOC format preferences are preservation guidance, not universal acceptance requirements.
    - Actual operator and provider inventories, measurements and allocation evidence required; no default energy, lifetime, release, network coefficient or legal approval.
    - Radio and sound assets may overlap; use one traced original-production inventory for the identical asset. Shared classification binding remains coordinator-owned.
