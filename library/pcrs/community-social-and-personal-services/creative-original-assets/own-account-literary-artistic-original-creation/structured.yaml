allocation_rules:
  - rule_id: allocation_direct
    applies_to: "projects and versions"
    rule: "Subdivide records by project/version before allocation; include unsuccessful trials belonging to the accepted original. Reconcile shared workstation and room-meter totals with documented job/reservation or measured-use keys, including idle/overhead and unassigned use. Do not allocate by sale price, royalties, users or assumed downloads."
    source_ids: []
  - rule_id: allocation_apparatus
    applies_to: "apparatus"
    rule: "Use measured configuration-specific net apparatus mass and evidenced reservation time/capacity shares under cp_apparatus. Actual installation, configuration and use records are always required. A justified expected lifetime/service denominator is permitted when supported by explicit evidence, sensitivity analysis and subsequent reconciliation of the persistent asset ledger; it must be positive and cumulative assigned fractions must not exceed one. A single observed period cannot replace the lifetime denominator, and unknown denominator or attribution relations require review; for non-computing apparatus use project-documented service-use attribution and sensitivity, not a default life. Provider datasets containing hardware must not be charged again."
    source_ids: []
  - rule_id: allocation_originals
    applies_to: "joint and reused originals"
    rule: "Document whether variants express one original or are distinct completed works. Split shared work using evidenced creative activity; when attribution is unsupported retain a joint-output dataset and unresolved allocation. A reused original enters with its explicit upstream share; rights are metadata, not material mass or an avoided-emission credit."
    source_ids: []
  - rule_id: allocation_share_definition
    applies_to: "apparatus manufacturing inputs"
    rule: "For an actual computing resource pool, its dimensionless manufacturing share is time_share × capacity_share: time_share is pool reserved/use time divided by evidenced actual lifetime/cumulative service time or justified expected lifetime; capacity_share is pool-reserved capacity divided by total available capacity. The recorded share and accepted-original count must cover the identical pool and interval. Use consistent time units and strictly positive denominators, and bound each share between zero and one. For non-computing equipment use only an evidenced causal service-use share and retain unsupported attribution for review. These symbols allocate upstream manufacture; they do not convert the creative original to mass."
    source_ids: []
  - rule_id: allocation_asset_conservation
    applies_to: "apparatus and reusable assets"
    rule: "Maintain one lifetime manufacturing ledger for each asset across all projects and periods. The denominator must cover evidenced actual lifetime/cumulative service or a justified expected life, with sensitivity and later reconciliation. Cumulative attributed manufacture shares must never exceed one; do not reset full manufacture at each project or observation period. Period-only allocation distributes only the previously justified manufacture share for that period, not the entire asset. Unknown lifetime or ledger coverage requires review."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_original
      process_id: "fixation"
      flow_role: "creative_original_output"
      record_type: "acceptance_record"
      raw_fields: "original id; genre/function; creator; own-account intention; version; media inventory; hashes or physical identification; completeness; acceptance record; source permissions; rights; project dates; revision baseline; actual acceptance date; actual initial-handover date or documented inapplicability; attributable interval resources"
      collection_method: "Check the retained expression against actual completion/acceptance and provenance records; count one original, not pages, file renditions or copies. Declare complete creation or incremental revision scope."
      unit: "item"
      frequency: "at original acceptance and initial-handover closure; original counted once"
      temporal_coverage: "full applicable project through the later actual acceptance/initial-handover date; if handover is inapplicable, document that and use acceptance"
      site_scope: "all creators and contributing sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "signed completion record; file/object inventory; provenance and own-account records"
    - protocol_id: cp_energy
      process_id: "conception"
      flow_role: "conception_electricity_lv; conception_electricity_mv; conception_electricity_site"
      record_type: "meter_record"
      raw_fields: "original id; stage; site; grid; voltage; meter; interval; kWh; measured job/reservation key; idle and facility overhead; provider scope; initial handover records; actual acceptance date; actual initial-handover date or documented inapplicability; attributable interval resources"
      collection_method: "Use calibrated submeter readings or verifiable provider/job energy records; reconcile shared meters to real project activity and supporting storage/network. Do not derive kWh from GB, revenue or generic energy coefficients.; include actual device reservation/use, energy and support needed between acceptance and initial handover under the declared scope; This protocol covers conception only. Reconcile all three stage-specific protocols to the same source meter/provider totals; assign each actual interval and shared overhead once, including failed work and attributable initial-handover support."
      unit: "kWh"
      frequency: "each meter/job interval"
      temporal_coverage: "full applicable project through the later actual acceptance/initial-handover date; if handover is inapplicable, document that and use acceptance"
      site_scope: "all actual workplaces/providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration; job ledger; provider resource/overhead reconciliation"
    - protocol_id: cp_energy_creation
      process_id: "creation"
      flow_role: "creation_electricity_lv; creation_electricity_mv; creation_electricity_site"
      record_type: "meter_record"
      raw_fields: "original id; stage; site; grid; voltage; meter; interval; kWh; measured job/reservation key; idle and facility overhead; provider scope; initial handover records; actual acceptance date; actual initial-handover date or documented inapplicability; attributable interval resources"
      collection_method: "Use calibrated submeter readings or verifiable provider/job energy records; reconcile shared meters to real project activity and supporting storage/network. Do not derive kWh from GB, revenue or generic energy coefficients.; include actual device reservation/use, energy and support needed between acceptance and initial handover under the declared scope; This protocol covers creation only. Reconcile all three stage-specific protocols to the same source meter/provider totals; assign each actual interval and shared overhead once, including failed work and attributable initial-handover support."
      unit: "kWh"
      frequency: "each meter/job interval"
      temporal_coverage: "full applicable project through the later actual acceptance/initial-handover date; if handover is inapplicable, document that and use acceptance"
      site_scope: "all actual workplaces/providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration; job ledger; provider resource/overhead reconciliation"
    - protocol_id: cp_energy_fixation
      process_id: "fixation"
      flow_role: "fixation_electricity_lv; fixation_electricity_mv; fixation_electricity_site"
      record_type: "meter_record"
      raw_fields: "original id; stage; site; grid; voltage; meter; interval; kWh; measured job/reservation key; idle and facility overhead; provider scope; initial handover records; actual acceptance date; actual initial-handover date or documented inapplicability; attributable interval resources"
      collection_method: "Use calibrated submeter readings or verifiable provider/job energy records; reconcile shared meters to real project activity and supporting storage/network. Do not derive kWh from GB, revenue or generic energy coefficients.; include actual device reservation/use, energy and support needed between acceptance and initial handover under the declared scope; This protocol covers fixation only. Reconcile all three stage-specific protocols to the same source meter/provider totals; assign each actual interval and shared overhead once, including failed work and attributable initial-handover support."
      unit: "kWh"
      frequency: "each meter/job interval"
      temporal_coverage: "full applicable project through the later actual acceptance/initial-handover date; if handover is inapplicable, document that and use acceptance"
      site_scope: "all actual workplaces/providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration; job ledger; provider resource/overhead reconciliation"
    - protocol_id: cp_material
      process_id: "creation"
      flow_role: "draft_paper; graphite_pencil; sorted_paper_waste"
      record_type: "mass_stock_record"
      raw_fields: "original id; material specification; supplier; issue/return/stock mass; retained-original mass; measured discard mass; waste segregation and destination; actual acceptance date; actual initial-handover date or documented inapplicability; attributable interval resources"
      collection_method: "Weigh actual material issues, returns and discards using calibrated scales and reconcile opening/closing stock. Retain paper grade and pencil formulation, no assumed composition or loss rate."
      unit: "kg"
      frequency: "each issue/return/discard"
      temporal_coverage: "full applicable project through the later actual acceptance/initial-handover date; if handover is inapplicable, document that and use acceptance"
      site_scope: "actual material use sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weighing and supplier records; stock reconciliation; waste handover"
    - protocol_id: cp_original_inputs
      process_id: "creation"
      flow_role: "prior_original_input"
      record_type: "supplier_delivery_record"
      raw_fields: "original id; supplier; prior-work id/version; upstream share; permissions; copyediting delivery unit; acceptance; included electricity/apparatus; supplier dataset boundary; actual acceptance date; actual initial-handover date or documented inapplicability; attributable interval resources"
      collection_method: "Verify the actual acquired earlier expression, its exact identity/version, permissions and upstream dataset boundary. Collect the documented attributable share of the identified prior original under its card; preserve the reference item unit and upstream allocation evidence. A licence price or royalty is not an exchange amount."
      unit: "item"
      frequency: "each acquisition/delivery"
      temporal_coverage: "full applicable project through the later actual acceptance/initial-handover date; if handover is inapplicable, document that and use acceptance"
      site_scope: "actual creator/suppliers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "acceptance; upstream dataset; permissions; attribution ledger"
    - protocol_id: cp_copyedit
      process_id: "fixation"
      flow_role: "external_copyedit"
      record_type: "supplier_delivery_record"
      raw_fields: "original id; supplier; prior-work id/version; upstream share; permissions; copyediting delivery unit; acceptance; included electricity/apparatus; supplier dataset boundary; actual acceptance date; actual initial-handover date or documented inapplicability; attributable interval resources"
      collection_method: "Verify the actual accepted manuscript copyediting delivery and its upstream boundary. Count accepted delivery units assigned to this original; retain included supplier electricity and apparatus to prevent duplicate expansion. Contract value and royalties are not delivery counts."
      unit: "item"
      frequency: "each acquisition/delivery"
      temporal_coverage: "full applicable project through the later actual acceptance/initial-handover date; if handover is inapplicable, document that and use acceptance"
      site_scope: "actual creator/suppliers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "acceptance; upstream dataset; permissions; attribution ledger"
    - protocol_id: cp_apparatus
      process_id: "apparatus"
      flow_role: "portable_computer; still_camera; upright_piano; creation_server"
      record_type: "equipment_use_record"
      raw_fields: "device id; configuration; measured net device mass in kg; weighing/supplier provenance; dimensionless manufacturing share; share pool and interval; actual accepted-original count in item; original identity and equivalence/independent attribution evidence; project reservation/use time; actual lifetime/cumulative service or justified expected-life denominator and evidence; reserved and total capacity; shared users; lifetime cumulative allocated shares; prior-period manufacturing share; life sensitivity; later reconciliation; upstream coverage; actual acceptance date; actual initial-handover date or documented inapplicability; attributable interval resources"
      collection_method: "Use calibrated weighing or traceable supplier net-mass records for the actual complete configuration. Record real reservation/use intervals and installed-life basis; Measured net device mass is the actual complete configured device mass in kg; manufacturing share is dimensionless; actual accepted-original count is measured in item from the same pool acceptance ledger. Non-computing use shares require project activity records and sensitivity. No invented device weight or life.; include actual device reservation/use, energy and support needed between acceptance and initial handover under the declared scope"
      unit: "kg"
      frequency: "each device and project interval"
      temporal_coverage: "full applicable project through the later actual acceptance/initial-handover date; if handover is inapplicable, document that and use acceptance"
      site_scope: "real creator and provider apparatus"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "configuration/weighing provenance; lifetime evidence and sensitivity; share/count scope reconciliation; cumulative manufacturing-share ledger; reservation reconciliation"
  calculation_rules:
    - id: electricity_unit
      applies_to: "all electricity rows"
      rule: "MJ = attributable measured kWh × 3.6; attribution is established from primary activity records before conversion."
      inputs:
        - cp_energy
        - cp_energy_creation
        - cp_energy_fixation
      output: "MJ per declared reference flow"
      source_ids: []
    - id: apparatus_share
      applies_to: "portable_computer; still_camera; upright_piano; creation_server"
      rule: "Equipment manufacturing input (kg per declared reference flow) = measured net device mass (kg) × evidenced manufacturing share (dimensionless) / actual accepted-original count (item) covered by that share. The numerator describes upstream device manufacture attributed to the pool, not mass of the original. Record device identity, share scope and the actual positive output count through cp_apparatus. Sum separate device contributions without duplicating manufacture contained in supplier datasets; shared-count division requires demonstrated equivalent original beneficiaries, otherwise attribute independently or retain joint-output allocation for review."
      inputs:
        - cp_apparatus
        - "measured net device mass"
        - "dimensionless manufacturing share"
        - "actual accepted-original count"
      output: "kg per declared reference flow"
      source_ids: []
    - id: original_basis
      applies_to: "all inventory rows"
      rule: "Record actual attributable exchanges directly per declared reference flow. Split joint-original project records with a documented allocation before normalization; do not count backups, file formats or reprint editions as extra accepted originals."
      inputs:
        - cp_original
        - cp_energy
        - cp_energy_creation
        - cp_energy_fixation
        - cp_material
        - cp_original_inputs
        - cp_copyedit
        - cp_apparatus
      output: "one original reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "reference original"
      requirement: "Declare genre, intended expression/function, version, completeness, medium and actual own-account provenance; no default page count, notation length, physical mass, aesthetic score or protection term."
      evidence: "cp_original; actual rights and acceptance records"
    - id: quality_coverage
      applies_to: "all stages"
      requirement: "Cover all participating sites and relevant providers through the later actual acceptance/initial-handover date, including failed drafts, rework and attributable storage/support between the dates. Disclose meter/provider granularity, room utility scope and equipment/supplier gaps; absence of measurement is not zero."
      evidence: "project ledger; cp_energy; cp_energy_creation; cp_energy_fixation; supplier inventories"
    - id: quality_representative
      applies_to: "dataset reuse"
      requirement: "A particular manuscript, score or other original is not an industry-average creative work. Comparisons need compatible genre/function, completeness, medium and boundary. Declare actual dates, geography, activity, apparatus, uncertainty and update conditions."
      evidence: "actual project profile and coverage disclosure"
validation_rules:
  - rule_id: validate_original
    applies_to: "creative_original_output"
    rule: "Verify one complete own-account original and its exact version/medium, acceptance, intended function and source/reuse conditions. Reject a licence, commissioned writing service, printed publication, recording master or download as this reference. No count establishes artistic equivalence across genres."
    source_ids:
      - un-cpc-creative-originals
  - rule_id: validate_resources
    applies_to: "all inventory rows"
    rule: "Check reference-output count, per-original denominator, meter coverage and 3.6 MJ/kWh conversion; verify each electricity country/voltage, apparatus property/configuration and supplier service unit. Reconcile creation jobs, paper stocks/discards and device shares. GB, file count and invoice money do not establish electricity."
    source_ids: []
  - rule_id: validate_complete
    applies_to: "dataset claim"
    rule: "Retain uncertainty when identities, actual exchanges, provider coverage, allocation or acceptance evidence remain missing. Applicable identity gaps and missing material stages prohibit a complete dataset claim; no independent review or legal/compliance approval is implied by structural checks."
    source_ids: []
published_dataset_profile:
  dataset_role: "Original-creation foreground dataset for one identified own-account creative expression"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Original-production input with explicit upstream/reuse attribution and compatible creative function/version/medium; comparison only for equivalent declared reference scope"
  excluded_use: "Per-download/publication/broadcast/use impact without separate stages; universal original average; legal rights approval; artistic quality certification; complete cradle-to-gate without required upstream evidence"
  required_metadata: "All reference qualifiers; project sites and dates; actual analog/digital operations; supplier/device identities and boundaries; initial handover; allocation keys; conditional and added rows; downstream exclusions"
  required_quality_disclosure: "Measured versus estimated data; missing exchanges/identities; grid/voltage; original/revision scope; apparatus-life/use uncertainty; supplier overlaps; completeness and representativeness limitations"
  update_trigger: "A materially changed original/version or creation route, supplier/energy/apparatus boundary, revised reuse attribution or corrected acceptance/resource evidence"
data_sources:
  - id: "un-cpc-creative-originals"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0, subclass 96330, Explanatory note, inclusion bullets, own-account note and exclusions. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/96330"
    used_for: "Own-account original boundary; no energy, material or lifetime factor"
  - id: "usco-composition"
    type: "official_guidance"
    reference: "U.S. Copyright Office, Musical Compositions and Sound Recordings, main content paragraphs. https://www.copyright.gov/register/pa-sr.html"
    used_for: "Composition and sound recording are distinct works; terminology evidence only, no legal approval"
  - id: "usco-fixation"
    type: "official_guidance"
    reference: "U.S. Copyright Office, What is Copyright?, Original Works and Fixed Works. https://www.copyright.gov/what-is-copyright/index.html"
    used_for: "Identifiable retained expression rather than a mere idea; U.S. source not a universal legal requirement or protection-duration default"
  - id: "gsf-sci-1-1"
    type: "standard"
    reference: "Green Software Foundation, Software Carbon Intensity Specification 1.1.0, Energy and Embodied emissions. https://sci.greensoftware.foundation/"
    used_for: "Computing energy includes provisioned resources; device time/resource attribution adapted only for actual computing in this creation interval. Not an original-art PCR, SCI score, universal non-computing allocation or default lifetime"
