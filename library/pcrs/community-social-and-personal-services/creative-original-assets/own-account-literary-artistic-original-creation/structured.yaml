product_category_identity:
  canonical_pcr_id: "pcr.community-social-and-personal-services.creative-original-assets.own-account-literary-artistic-original-creation"
  classification_refs: "CPC 3.0 96330; classification context only, not an accepted mapping"
  covered_products: "Own-account book manuscripts, original musical scores and other eligible nonperforming artistic originals, with a completed identifiable expression"
  excluded_products: "Commissioned writing/composition services; performer outputs; paintings and sculptures; sound-recording masters; film/TV/radio programme masters; copies/downloads; software, data, design, brand, R&D and exploration originals"
  representative_product: "One identified complete own-account original of the declared genre/version; a manuscript or score is an example, not an average for all art"
  production_route: "Project conception and source research → original drafting/composing/creating → actual revisions → expression fixation and verification → accepted original preservation and one initial handover when applicable"
  market_state: "Completed original available for prospective sale/reuse, created without a prior contract or known buyer; medium and rights conditions declared"
functional_unit:
  what: "Provide the declared original literary, musical or eligible artistic expression for subsequent reproduction or exploitation"
  how_much: "One complete identified original; not one printed copy, licence or download"
  how_well: "Completeness and readability/playability or genre-specific acceptance criteria evidenced by the actual creator/recipient record; no universal aesthetic or legal approval"
  how_long_or_cycle: "One declared creation interval ending when both acceptance of this original/version and its actual initial handover are complete, using the later actual date. If no initial handover applies, retain documented applicability and end at acceptance. Include attributable preservation/support between the two dates; no default asset life or later use duration."
  reference_flow_link: "creative_original_output"
system_boundary:
  rules:
    - rule_id: boundary_creation
      applies_to: "all creation stages"
      rule: "Include project-specific research, drafts, composing/notation, eligible artistic creation, revision, trials and rejected drafts, fixation, integrity/content verification, preservation and attributable support through completion of both acceptance and actual initial original handover, including the intervening period. The real medium governs processes; no mandatory printing, recording or datacenter."
      source_ids:
        - un-cpc-creative-originals
        - usco-fixation
    - rule_id: boundary_distinct_outputs
      applies_to: "original versus exploitation"
      rule: "Keep composition separate from the derived sound-recording master; separate later publication/printing, consumer copies/downloads, broadcast, public performance and ongoing archive/use beyond the declared initial-handover boundary. Preservation/storage and support necessary to complete that initial handover remain included through the later actual acceptance/handover date; concurrent downstream exploitation remains separately scoped. Original creation is charged once, with explicit downstream reuse attribution, never fully to every copy."
      source_ids:
        - un-cpc-creative-originals
        - usco-composition
    - rule_id: boundary_upstream
      applies_to: "utilities apparatus suppliers"
      rule: "This is a declared original-creation foreground boundary. Compatible upstream inputs are needed before a cradle-to-gate claim. Include supporting workstation/cloud/storage/network and room utilities on their actual measured boundaries. Expand provider inventories into atomic exchanges or use one specific supplier delivery dataset; never both."
      source_ids: []
    - rule_id: boundary_extensions
      applies_to: "actual route completeness"
      rule: "Add a separate atomic row for each actual ink, pigment, film, photographic paper, substrate, adhesive, display, storage device, instrument, cooling utility, fuel, transport or waste not represented here. Record each chemical and environmental medium separately. No automatic onsite combustion emission arises from purchased electricity. Missing material exchanges make the dataset incomplete; zero requires absence evidence."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Documented own-account project initiation and actual source/previous-original baseline"
  starting_condition_role: "Separates creation of this expression from upstream originals, general unrelated activity and later exploitation"
  product_classification_scope: "Own-account creative original; exclude agreed-buyer commissioned creation and separately classified original assets"
  recursive_input_rule: "Identify reused earlier originals once with their upstream dataset and declared attribution; do not recreate their historical creative work within this project"
  upstream_dataset_requirement: "Compatible electricity, actual apparatus manufacture, stationery manufacture, earlier originals and supplier editing datasets; waste treatment separately linked"
  disclosure: "Creator/project/version; real sites and dates; own-account intention; analog/digital route; supplier and apparatus coverage; shared-resource attribution; actual missing stages and downstream exclusions"
