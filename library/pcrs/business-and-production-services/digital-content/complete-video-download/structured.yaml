validation_rules:
  - rule_id: validate_reference
    applies_to: "reference_download"
    rule: "Require the complete declared locally stored rendition and one accepted delivery record. Reject streamed-only sessions, segmented partials, original rights transfers and byte/user/revenue units substituted for the product."
    source_ids:
      - un-cpc3-video
      - apple-video-download
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Require the same per declared reference flow denominator in both languages, linked protocols and preserved numerator units. Each stage pool and accepted-output count must reconcile. Reject kg only when used to replace the complete-video reference output or item denominator; evidenced native mass/kg inputs, wastes and direct emissions remain valid numerators per the same accepted item. Arbitrary bytes-to-energy conversions fail."
    source_ids:
      - gsf-sci110
  - rule_id: validate_scope
    applies_to: "all processes"
    rule: "Require origin, cache, network, local-receipt, owned/provider electricity/cooling/equipment and source-original scopes. A missing actual route, direct exchange or upstream dataset makes dataset coverage incomplete. Conditional absence requires evidence."
    source_ids:
      - gsf-sci110
      - un-cpc3-video
  - rule_id: validate_conservation
    applies_to: "allocation"
    rule: "Reconcile reuse and shared-resource ledgers across all beneficiaries. Reject double-counted provider/owned power or hardware and the full original burden repeated per download. Unknown original shares cannot be silently zeroed."
    source_ids:
      - gsf-sci110
  - rule_id: validate_claim
    applies_to: "dataset"
    rule: "Report checks performed/skipped, coverage, identity gaps, allocation uncertainties and upstream exclusions. Candidate methodology and structural checks do not establish scientific approval, legal rights, complete lifecycle coverage or an SCI-conformant score."
    source_ids:
      - un-cpc3-video
      - gsf-sci110
published_dataset_profile:
  dataset_role: "Foreground inventory for one complete video download with separately linked source and infrastructure layers"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Evidence-complete rendition/site/period-specific download input or comparison with equivalent complete delivery quality and declared upstream scope"
  excluded_use: "Generic impact per GB/user/license; equal-quality assumption across unlike films/renditions; perpetual-rights or compliance claims; full cradle-to-gate claims with missing source/provider/device layers"
  required_metadata: "All reference qualifiers, actual route/period, source/reuse ledger, job/provider interfaces, supply conditions, metering, complete delivery/failed work, hardware and upstream scope"
  required_quality_disclosure: "Meter and count uncertainty; storage/cache/replica coverage; incomplete network/provider/source layers; unresolved identities; prospective reuse/device-life sensitivity"
  update_trigger: "Changed rendition/quality/rights, file manifest, sites/supply, caching/storage period, network path, provider scopes, equipment, original allocation or measured delivery performance"
