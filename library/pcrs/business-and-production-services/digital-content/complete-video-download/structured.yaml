product_category_identity:
  canonical_pcr_id: "pcr.business-and-production-services.digital-content.complete-video-download"
  classification_refs: "CPC 3.0: 84331 Films and other video downloads"
  covered_products: "Complete locally stored downloadable film/video recordings with declared rendition and access conditions"
  excluded_products: "Streaming; broadcast/channel originals; original film-making; audio/software downloads; physical media; generic telecom services"
  representative_product: "One complete identified movie rendition delivered to an authorized local device; an episode or other recording uses its own declared complete content"
  production_route: "Receive original master; prepare/validate downloadable version; store/cache; transfer; locally store and verify. Owned and outsourced stages use declared interfaces"
  market_state: "One accepted electronic video download with declared rights, expiry and compatibility; neither transfer of the original IP asset nor perpetual ownership is presumed"
functional_unit:
  what: "Deliver one specified complete film/video recording as a locally stored downloadable copy"
  how_much: "One complete accepted delivery; 1 item"
  how_well: "Declared edition, duration, video resolution/frame rate/codec, audio tracks, subtitle tracks, byte manifest, integrity result and permitted playback compatibility; actual producer criteria"
  how_long_or_cycle: "One completed transfer and local-receipt cycle; actual preparation/storage allocation period and access/expiry conditions are separate qualifiers. Later playback and post-receipt retention are outside this gate"
  reference_flow_link: "reference_download"
system_boundary:
  rules:
    - rule_id: boundary_delivery
      applies_to: "all stages"
      rule: "Include actual master ingestion, rendition preparation/acceptance, packaging, object retention/cache, authorization, transfer, local writing and integrity checks up to accepted receipt. Include failed work, partial transfers and retries. Later playback, long-term local retention and deletion belong to a separately stated use/end-of-life scenario."
      source_ids:
        - un-cpc3-video
        - apple-video-download
    - rule_id: boundary_original
      applies_to: "source_original"
      rule: "Separate original filming/editing and reusable assets from download operations. A linked original inventory must disclose its creation scope and allocation across actual exploitation routes. This gate alone is not cradle-to-gate; omitted original creation may not be labelled zero."
      source_ids:
        - un-cpc3-video
    - rule_id: boundary_infrastructure
      applies_to: "supporting infrastructure"
      rule: "Map origin, cache, backbone/access, router and receiving device interfaces. Include attributable reserved/idle capacity, cooling, backup, failover and monitoring in owned measurements or specified supplier inventories. If a site uses water, fuel, a refrigerant, a consumable or produces waste/direct releases, add each actually identified atomic exchange with measured amount and medium; do not infer absence from a digital output or invent manufacturing emissions."
      source_ids:
        - gsf-sci110
    - rule_id: boundary_provider
      applies_to: "owned/provider stages"
      rule: "Purchased jobs must identify accepted technical delivery and embedded scope. Electricity/equipment already embedded in a provider inventory may not be added as owned inputs. Missing provider electricity, cooling, network or device production is a data gap, not a reason to omit the actual route."
      source_ids:
        - gsf-sci110
boundary_abstraction:
  declared_starting_condition: "Receipt of the identified existing master through completion of the specified locally stored copy"
  starting_condition_role: "Download-production/delivery foreground gate with upstream original-creation linkage"
  product_classification_scope: "Downloadable recorded video content; no genre-specific route assumption"
  recursive_input_rule: "Record a reused downloadable rendition as one identified upstream version with its conserved burden share. Stop at its upstream dataset; do not multiply the original by requests, copies or licences"
  upstream_dataset_requirement: "Original creation, matched electricity, actual equipment production/end-of-life and provider storage/transfer inventories with explicit interfaces; unknowns remain incomplete"
  disclosure: "Original reuse and rendering period; retention/cache/replicas; origin and receiving device; network segments; provider cooling/asset coverage; failures; excluded playback/post-receipt storage; missing upstream layers"
