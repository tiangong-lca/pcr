allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "energy and providers"
    rule: "Prefer job/stage subdivision and direct metering. For shared facilities use a documented causal allocation based on measured or reserved resources/time, validated against total meters. Retain unused/idle support shares and reconcile residuals. Bytes, duration, users or revenue alone are not measured electricity."
    source_ids:
      - gsf-sci110
  - rule_id: allocation_reuse
    applies_to: "original and prepared rendition"
    rule: "Maintain one conserved original/rendition ledger across downloads, streams, broadcast and other uses. Subdivide separable rendition work first. For a genuinely shared undivided workload, document the finite supported beneficiaries and shares; allocate the download-route pool across complete comparable deliveries, including failed work in the numerator. Prospective delivery counts need a labelled scenario, later reconciliation and sensitivity. No arbitrary default exploitation life or download count."
    source_ids:
      - un-cpc3-video
      - gsf-sci110
  - rule_id: allocation_devices
    applies_to: "owned devices"
    rule: "Use device-specific reserved-time fraction of expected installed life multiplied by the resource fraction, with actual configuration and upstream inventory. Evidence must support both fractions and life; revalidate replacement/retirement. Split unlike hardware configurations and preserve device-unit properties."
    source_ids:
      - gsf-sci110
  - rule_id: allocation_outputs
    applies_to: "multiple products and failures"
    rule: "Do not average unequal renditions without declaring a measured representative mix. Bundled episodes reconcile individual manifests and shared overhead; failed/aborted copies do not add accepted outputs. Revenue allocation requires separate justified sensitivity and never turns currency into product count."
    source_ids:
      - un-cpc3-video
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "For one rendition and allocation period, subdivide disjoint pools before normalization. Let N be the actual complete accepted delivery count, strictly greater than zero. Attributable metered electricity E, purchased job share J and device share H in that pool enter one delivery as E/N, J/N and H/N, preserving their respective kWh and item numerator units. Original inventory burden B enters only through the evidenced download-route share s, giving B × s/N per delivery; reconcile shares across all channels and remaining beneficiaries. Shared prepared-rendition work is allocated once in the same way. A separately metered individual delivery uses its own record without division by another pool’s N. Separate unlike renditions into pools or document the actual representative mix; never mix periods or repeat provider-inclusive activities."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_delivery
      process_id: "receipt"
      flow_role: "reference_download"
      record_type: "acceptance log"
      raw_fields: "title; version; complete byte/track manifest; duration; download ID; device; completion; hash/integrity; rights/expiry; failed/retry IDs"
      collection_method: "Match producer manifest and client completion/integrity evidence; verify compatibility/permitted playback without counting playback as delivery work"
      unit: "item"
      frequency: "each delivery"
      temporal_coverage: "actual delivery cycle and allocation period"
      site_scope: "origin/cache to identified local device"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "signed manifest; logs; rejected attempts; rights evidence"
    - protocol_id: cp_source
      process_id: "preparation"
      flow_role: "source_original"
      record_type: "source and reuse ledger"
      raw_fields: "original ID/version; provenance; creation inventory; channel shares; beneficiaries; measured/prospective deliveries; revisions"
      collection_method: "Inspect source acceptance/provenance and scoped upstream inventory; reconcile all beneficiaries and conserve original/rendition burden once"
      unit: "item"
      frequency: "each original/rendition and reconciliation"
      temporal_coverage: "actual preparation/reuse period"
      site_scope: "declared origin and upstream creator"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "source manifests; allocation and missing-data ledger"
    - protocol_id: cp_energy
      process_id: "preparation_storage_network_receipt"
      flow_role: "electricity"
      record_type: "meter and job log"
      raw_fields: "stage; region; voltage; meter start/end; kWh; reserved time/resources; cooling scope; retries; pool totals; delivery count"
      collection_method: "Calibrated submeter or integrated measured power trace; time-align jobs/storage/network/receipt; document causal shares and reconcile full supply meters including idle support"
      unit: "kWh"
      frequency: "each job and storage interval"
      temporal_coverage: "complete preparation/storage/delivery pool period"
      site_scope: "each owned supply point; provider interfaces excluded"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; meter coverage; share/residual balance; supply invoice"
    - protocol_id: cp_provider
      process_id: "preparation_storage_network"
      flow_role: "purchased technical delivery"
      record_type: "provider primary records"
      raw_fields: "job/reservation ID; accepted scope; byte manifest; actual byte-hours; cache/replicas; network path; failures; included power/cooling/hardware; allocated job count"
      collection_method: "Read actual contract, acceptance and supplier activity inventory; keep one technical job/reservation identity with explicit included scope; reconcile provider and owned interfaces"
      unit: "item"
      frequency: "each accepted job/reservation and reporting interval"
      temporal_coverage: "matching allocation period"
      site_scope: "actual provider locations and delivery interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "contract; acceptance; activity records; boundary statement; gaps"
