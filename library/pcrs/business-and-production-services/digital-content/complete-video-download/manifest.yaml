  evidence_limitations:
    - Official CPC notes distinguish downloadable locally stored recordings from streams; they do not define an LCA factor or universal quality.
    - Apple documentation is a real provider-specific route example; its device and expiry restrictions are not universal download rules.
    - SCI 1.1.0 supports computing energy and hardware attribution only; this PCR does not claim an SCI-conformant full score.
    - Actual original production and cross-channel reuse, rendition work, storage, network, receiving device and supplier inventories are required; unknowns cannot be zeroed.
    - No actual factory/provider measurements are supplied; no default energy per byte, file size, lifetime, loss, download count, regional data centre or direct emission is prescribed.
  unresolved_range_evidence:
    - Collect actual complete delivery, original/rendition reuse pools, metered power, provider technical jobs and reserved device time/resources; no universal numerical range is supported.
