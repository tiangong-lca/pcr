allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared data projects"
    rule: "Separate project and stage workloads using meters, collection logs and job IDs before allocating. Keep residual unassigned shares and failed work visible. Do not default to revenue, licenses, users or data byte shares without a causal measured relationship."
    source_ids:
      - gsf-sci110
      - unece-gsbpm52
  - rule_id: allocation_compute
    applies_to: "shared electricity"
    rule: "Reconcile attributable measured job/storage/network shares to the same facility meter period, including reserved idle and cooling scope. A traffic or storage metric is an attribution driver requiring justification and reconciliation, never a universal kWh conversion."
    source_ids:
      - gsf-sci110
  - rule_id: allocation_device
    applies_to: "server_hardware; logger_hardware"
    rule: "Use the actual device inventory fraction attributable to the creation cycle. For a reserved computing device, use reserved time divided by evidenced installed life and reserved resource divided by total resource. Noncomputing sensor duty allocation needs its own measured causal utilization evidence. Do not invent life or duplicate provider hardware."
    source_ids:
      - gsf-sci110
  - rule_id: allocation_reuse
    applies_to: "source_data and joint original versions"
    rule: "Trace upstream source content and retained prior-version work separately from incremental creation. Maintain a conserved beneficiary ledger with an explicit finite output/use scenario when sharing original burdens downstream; report sensitivity to reuse assumptions. Copies never multiply information creation. Joint research/software outputs require actual subdivision; unresolved joint attribution needs review."
    source_ids:
      - un-cpc3-data
      - w3c-dcat3
