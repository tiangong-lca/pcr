      raw_fields: "device model/configuration; upstream inventory; installed life; reserved time; reserved/total resources; actual sensor duty; calibration; replacements; provider inclusion"
      collection_method: "Inspect device register, configuration, service-life evidence and utilization logs; collect causal shares separately for servers and instruments"
      unit: "item"
      frequency: "Each device and project period"
      temporal_coverage: "Creation cycle and evidenced device life"
      site_scope: "Actual owned devices"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Asset records, utilization evidence and life/allocation sensitivity"
  calculation_rules:
    - id: calculate_energy
      applies_to: "planning_electricity; observation_electricity; organization_electricity; validation_electricity; sealing_electricity"
      rule: "Convert attributable metered kWh to MJ by multiplication by 3.6; preserve stage and supply interfaces."
      inputs:
        - cp_energy
        - cp_energy_observation
        - cp_energy_organization
        - cp_energy_validation
        - cp_energy_sealing
        - kWh
      output: "MJ"
      source_ids:
        - gsf-sci110
        - nist-si-conversion
    - id: calculate_original
      applies_to: "all inventory rows"
      rule: "Sum nonduplicated attributable exchange quantities for the one declared original after stage/provider/source subdivision; the output is exactly 1 item. Keep numerator units and upstream shares explicit."
      inputs:
        - cp_original
        - cp_energy
        - cp_energy_observation
        - cp_energy_organization
        - cp_energy_validation
        - cp_energy_sealing
        - cp_source
        - cp_provider
        - cp_device
      output: "per declared reference flow"
      source_ids:
        - un-cpc3-data
        - gsf-sci110
    - id: calculate_metrics
      applies_to: "content metadata"
      rule: "Record actual completeness, valid/rejected record counts, byte sizes and coverage against declared specifications. These characterize content and do not transform bytes or records into MJ or new originals."
      inputs:
        - cp_original
        - "source and validation logs"
      output: "declared quality and content metrics"
      source_ids:
        - w3c-dcat3
        - unece-gsbpm52
        - noaa-ghcnd
  data_quality_requirements:
    - id: quality_content
      applies_to: "reference_data"
      requirement: "Bind source lineage, coverage, version, schema, missingness, flags, transformations and rights/control. Preserve observed versus imputed records and checks actually performed; acceptance criteria are producer-specific."
      evidence: "cp_original; cp_source; w3c-dcat3; noaa-ghcnd"
    - id: quality_cycle
      applies_to: "all processes"
      requirement: "Cover actual sites, collection and production periods, failed jobs, corrections, temporary replicas and sealing storage. Disclose missing meter periods, external source burdens and provider exclusions."
      evidence: "cp_energy; cp_energy_observation; cp_energy_organization; cp_energy_validation; cp_energy_sealing; cp_provider; unece-gsbpm52"
    - id: quality_identity
      applies_to: "all inputs"
      requirement: "Recheck public identities, reference properties/groups, supply conditions, actual hardware and upstream versions. Blank UUIDs remain candidate gaps and cannot establish available provider inventories."
      evidence: "cp_device; cp_source; cp_provider"
    - id: quality_uncertainty
      applies_to: "allocation and data representativeness"
      requirement: "Report workload/meter uncertainty, unknown shares, hardware-life sensitivity, observation coverage limits and reuse scenario sensitivity. No invented benchmark can replace foreground evidence."
      evidence: "cp_energy; cp_energy_observation; cp_energy_organization; cp_energy_validation; cp_energy_sealing; cp_device; source/reuse ledger"
validation_rules:
  - rule_id: validate_product
    applies_to: "reference_data"
    rule: "Require one complete identified productive information original with actual ownership/control and declared quality evidence. Reject copies, licenses, file-format conversions, mere compilation services, software or consumption content counted as equivalent originals."
    source_ids:
      - un-cpc3-data
      - w3c-dcat3
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Require consistent per declared reference flow in both languages, linked collection records, count output and numerator-unit preservation. Reject arbitrary mass, bytes-to-kWh or money-to-item conversions."
    source_ids:
      - gsf-sci110
      - w3c-dcat3
  - rule_id: validate_route
    applies_to: "observation and processing"
    rule: "Fail dataset completeness if any actual observation route, provider interface, utility, material, waste, direct release or upstream source burden is unknown or omitted. A conditional row may be absent only with route evidence; do not invent emissions to fill empty subsections."
    source_ids:
      - un-cpc3-data
      - unece-gsbpm52
  - rule_id: validate_conservation
    applies_to: "shared work and reused content"
    rule: "Reconcile stage meters, provider embedded flows, device shares, joint outputs and the finite reuse ledger. Reject duplicated original costs per copy and unexplained allocation residuals hidden as zero."
    source_ids:
      - gsf-sci110
      - w3c-dcat3
  - rule_id: validate_coverage
    applies_to: "dataset claim"
    rule: "List checks performed/skipped, missing physical and upstream layers, identity gaps and uncertainties. Foreground creation alone is not a complete cradle-to-gate or lifecycle result; metadata conformance is not scientific, privacy or legal approval."
    source_ids:
      - un-cpc3-data
      - w3c-dcat3
      - gsf-sci110
published_dataset_profile:
  dataset_role: "Original-creation foreground inventory for one declared complete data product version"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "After evidence completion, traceable upstream data product input with explicit source/reuse allocation and matched content quality"
  excluded_use: "Generic impact per byte/user/license/revenue; comparisons of unequal data; full lifecycle claims from foreground alone; approved accuracy or legal status"
  required_metadata: "All reference qualifiers; sites and periods; method/route register; source lineage and upstream inventories; provider and owned-asset scopes; meters/units; reuse allocation and sealing cutoff"
  required_quality_disclosure: "Identity and route gaps; data coverage/missingness; actual acceptance results; meter/allocation uncertainty; device-life and reuse sensitivity; skipped layers"
  update_trigger: "New information/version scope; changed observations, source rights, provider/site/device, quality method, sealing cutoff or measured energy/reuse allocation"
data_sources:
  - id: "un-cpc3-data"
    type: "official_guidance"
    reference: "UNSD CPC Version3.0, Code83710, explanatory note inclusion, Notes1–3 and exclusions: https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/83710"
    used_for: "Information product, ownership/control and software/media/consumption exclusions; no LCA factors"
  - id: "w3c-dcat3"
    type: "standard"
    reference: "W3C, Data Catalog Vocabulary (DCAT) Version3, Recommendation22 August2024; §§5,6.6,6.8,9,11,14: https://www.w3.org/TR/2024/REC-vocab-dcat-3-20240822/"
    used_for: "Dataset/distribution distinction, version, rights and quality metadata; DCAT scope alone does not establish CPC applicability"
  - id: "unece-gsbpm52"
    type: "official_guidance"
    reference: "UNECE, Generic Statistical Business Process Model Version5.2 (May2025, CES endorsed June2025); Collect/Process, paragraphs93–114: https://unece.github.io/GSBPM-5.2/"
    used_for: "Acquisition, integration, validation and route-specific correction; statistical framework, no mandatory imputation or energy coefficients"
  - id: "gsf-sci110"
    type: "standard"
    reference: "Green Software Foundation, Software Carbon Intensity specification1.1.0; Energy and Embodied emissions: https://sci.greensoftware.foundation/"
    used_for: "Measured computing energy scope and reserved-time/resource device attribution only; no default lifetime or complete data LCA score"
  - id: "noaa-ghcnd"
    type: "dataset"
    reference: "NOAA NCEI GHCN-Daily README Version3.35; header/version citation and §III FORMAT OF DATA FILES, MFLAG/QFLAG/SFLAG; dataset DOI10.7289/V5D21VHZ: https://www.ncei.noaa.gov/pub/data/ghcn/daily/readme.txt"
    used_for: "Actual versioned observation database example and source/quality flags; weather-specific metadata only, no producer quantities or generic quality threshold"
  - id: "nist-si-conversion"
    type: "official_guidance"
    reference: "NIST SP811 (2008), Appendix B.8 K, exact kilowatt hour to joule factor: https://www.nist.gov/pml/special-publication-811/nist-guide-si-appendix-b-conversion-factors/nist-guide-si-appendix-b8"
    used_for: "1 kWh = 3.6 × 10^6 J = 3.6 MJ, exact conversion only; historical table, not used for pre-2019 base-unit definitions or production coefficients"
