      record_type: "Journey logs"
      raw_fields: "vehicle; petrol route; passengers; km; task; provider coverage"
      collection_method: "Read actual trip records and reconcile passenger distance and project share"
      unit: "person*km"
      frequency: "each task and acceptance"
      temporal_coverage: "complete creation including rework"
      site_scope: "all declared operator/provider sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable logs; calibrated meters where applicable; supplier inventory; reconciliation"
  calculation_rules:
    - id: electricity_conversion
      applies_to: "prep_electricity; record_electricity; finish_electricity"
      rule: "MJ = measured attributable kWh × 3.6; preserve the original denominator."
      inputs:
        - cp_energy
        - "measured kWh"
      output: "MJ per declared reference flow"
      source_ids: []
    - id: original_normalization
      applies_to: "all inventory rows"
      rule: "For homogeneous accepted originals with identical declared scope divide each attributable exchange total by actual accepted count. Assign unlike originals by project first and report separately. Output is exactly 1 item per declared reference flow."
      inputs:
        - cp_acceptance
        - "attributable exchange totals"
      output: "exchange amount per declared reference flow"
      source_ids: []
    - id: service_reconciliation
      applies_to: "recording_service; hosted_storage"
      rule: "Reconcile consumed hours for the specified service to supplier activity inventory; time and capacity alone do not establish electrical energy."
      inputs:
        - cp_service
        - "supplier inventory"
      output: "service amount per declared reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "radio_original"
      requirement: "Fix original version, complete hierarchy, duration and actual commissioning acceptance specification. Loudness/peak targets follow adopted specification, not universal defaults; no inferred legal or EBU approval."
      evidence: "cp_acceptance; ebu-radio-production-2023"
    - id: quality_activity
      applies_to: "all inventory rows"
      requirement: "Cover complete creation/rework and sites; reconcile meters, stocks, provider and equipment allocation. Missing data are disclosed with uncertainty, not set to zero."
      evidence: "cp_energy; cp_material; cp_service; cp_equipment"
    - id: quality_representative
      applies_to: "radio_original"
      requirement: "Declare genre, format, recorded/live route and source reuse; count alone cannot compare unlike durations/qualities."
      evidence: "cp_acceptance"
validation_rules:
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require complete accepted original, all qualifiers and exactly 1 item linked to radio_original. Reject airings, downloads or rights payments as original output."
    source_ids:
      - un-cpc-radio-originals
      - ebu-radio-production-2023
  - rule_id: validate_coverage
    applies_to: "foreground_dataset_conformance"
    rule: "Check creation/rework and owned/provider separation; reject hidden support, storage, travel, consumable or release omissions. Declare identity/upstream gaps and prohibit complete lifecycle claims while missing."
    source_ids: []
  - rule_id: validate_units
    applies_to: "foreground_dataset_conformance"
    rule: "Check count and normalization; preserve electricity energy/MJ, equipment count, provider hours and passenger-distance units. Names alone do not establish route, region, property or UUID suitability."
    source_ids: []
  - rule_id: validate_equipment_shares
    applies_to: "foreground_dataset_conformance"
    rule: "Verify persistent asset IDs, use numerators, supported lifetime/cumulative-service denominators and already attributed period fractions. Cumulative manufacturing shares across all projects and periods must not exceed 1. Unknown denominators or period fractions require explicit review; one observation window cannot stand for a whole lifetime or reset full manufacture each period."
    source_ids: []
