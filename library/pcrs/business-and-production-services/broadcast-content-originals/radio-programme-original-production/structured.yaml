      collection_method: "Submeter tasks or reconcile interval meters with measured device power and task logs; convert to MJ, separate supplier coverage"
      unit: "MJ"
      frequency: "each task and acceptance"
      temporal_coverage: "complete creation including rework"
      site_scope: "all declared operator/provider sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable logs; calibrated meters where applicable; supplier inventory; reconciliation"
    - protocol_id: cp_material
      process_id: "prepare_finish"
      flow_role: "script_paper; script_paper_waste"
      record_type: "Weighing records"
      raw_fields: "paper grade; issued/returned/waste kg; stock; treatment; project"
      collection_method: "Weigh actual input/return and segregated waste; reconcile stock and use"
      unit: "kg"
      frequency: "each task and acceptance"
      temporal_coverage: "complete creation including rework"
      site_scope: "all declared operator/provider sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable logs; calibrated meters where applicable; supplier inventory; reconciliation"
    - protocol_id: cp_service
      process_id: "create_content_finish"
      flow_role: "recording_service; hosted_storage"
      record_type: "Provider records"
      raw_fields: "provider; session/storage hours; capacity; crew; redundancy; region; deliverable; covered inputs"
      collection_method: "Obtain actual session or capacity-time logs and provider inventory, identify energy/equipment included"
      unit: "h"
      frequency: "each task and acceptance"
      temporal_coverage: "complete creation including rework"
      site_scope: "all declared operator/provider sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable logs; calibrated meters where applicable; supplier inventory; reconciliation"
    - protocol_id: cp_equipment
      process_id: "create_content_finish"
      flow_role: "microphone_share; workstation_share"
      record_type: "Utilization records"
      raw_fields: "persistent asset ID; model; configuration; production inventory; project task use; supported lifetime/cumulative-service denominator and its coverage; expected-life evidence and sensitivity; manufacturing fraction already attributed to the period; current project fraction; prior and cumulative fractions across all projects and periods; service/rental coverage; subsequent reconciliation"
      collection_method: "Link physical assets and task records to the cross-project/period manufacturing-share ledger; justify the denominator under allocate_equipment. An observation period distributes only its already attributed fraction and cumulative shares must not exceed 1. Unknown denominators or period fractions require review; a new project or period never resets whole-asset manufacture."
      unit: "item"
      frequency: "each task and acceptance"
      temporal_coverage: "complete creation including rework"
      site_scope: "all declared operator/provider sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable logs; calibrated meters where applicable; supplier inventory; reconciliation"
    - protocol_id: cp_asset_input
      process_id: "create_content"
      flow_role: "source_audio"
      record_type: "Asset provenance"
      raw_fields: "source ID/version; component; rights; production burden; reuse share"
      collection_method: "Verify supplier original-production inventory and declared consumed share; separate fees"
      unit: "item"
      frequency: "each task and acceptance"
      temporal_coverage: "complete creation including rework"
      site_scope: "all declared operator/provider sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable logs; calibrated meters where applicable; supplier inventory; reconciliation"
    - protocol_id: cp_travel
      process_id: "create_content"
