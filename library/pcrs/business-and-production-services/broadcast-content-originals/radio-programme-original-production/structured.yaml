allocation_rules:
  - rule_id: allocate_shared
    applies_to: "foreground_burden_allocation"
    rule: "First subdivide project work and separate providers. Attribute shared metered totals using measured power profiles and recorded job/equipment occupancy; justify idle/support shares and reconcile assigned totals. Storage uses actual capacity-time and provider inventory, not universal kWh/GB. Do not allocate by sales, royalties or audience counts."
    source_ids: []
  - rule_id: allocate_original
    applies_to: "foreground_burden_allocation"
    rule: "For jointly created originals prefer subdivision; otherwise document a physically supported shared-work relationship, fractions and sensitivity. Failed takes/revisions remain with the accepted original. Prevent parent/component double accounting; rights transfer is not new original production."
    source_ids:
      - ebu-radio-production-2023
      - un-sna-originals-2008
  - rule_id: allocate_equipment
    applies_to: "foreground_burden_allocation"
    rule: "Attribute real equipment manufacturing with a persistent asset ledger across all projects and periods. Measured project use is only the numerator; the denominator must cover supported actual lifetime/cumulative service activity or a justified expected lifetime, with sensitivity and subsequent reconciliation. Cumulative allocated manufacturing fractions across every project and period must not exceed 1, and must never reset at a new project or observation window. An observed-period method distributes only the already attributed manufacturing fraction of that period, not a whole asset inventory in every period. Unknown lifetime, denominator or period share requires explicit review; no default life or mass. Avoid service/rental/equipment duplication and automatic waste credits."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "finish"
      flow_role: "radio_original"
      record_type: "Original ledger"
      raw_fields: "ID; version; scope; duration; format; acceptance; rights; components"
      collection_method: "Inspect accepted audio/script package and actual editorial/technical records; distinguish originals from copies"
      unit: "item"
      frequency: "each task and acceptance"
      temporal_coverage: "complete creation including rework"
      site_scope: "all declared operator/provider sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable logs; calibrated meters where applicable; supplier inventory; reconciliation"
    - protocol_id: cp_energy
