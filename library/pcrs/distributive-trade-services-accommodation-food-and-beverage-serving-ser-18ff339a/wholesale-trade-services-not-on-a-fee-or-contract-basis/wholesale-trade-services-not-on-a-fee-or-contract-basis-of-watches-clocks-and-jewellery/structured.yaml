    - id: actual_pack_waste
      applies_to: "plain_gold_ring_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only packing actually removed and transferred to real receiver,with original manufacturing burden outside service. Retained ring boxes/certificates or transport assets are not automatically discarded; integral product features are not package tare. Range evidence need: Need material/tare/contamination and actual native conversion,source/receiver/transport/treatment with whole/mixed-stream exclusions; no recycling marking or precious-product price as recovery credit. Measurement evidence: protocol cp_material_fates; original record basis Mass / kg. The original amount constraint “Assigned measured actual removed packing / N; cp_material_fates.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: actual_pack_waste_paper_pack; actual_pack_waste_metal_pack; actual_pack_waste_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
