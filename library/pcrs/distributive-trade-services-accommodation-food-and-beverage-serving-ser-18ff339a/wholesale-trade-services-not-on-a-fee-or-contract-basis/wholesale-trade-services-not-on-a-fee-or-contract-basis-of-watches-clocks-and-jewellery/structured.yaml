    - id: discarded_whole_rings
      applies_to: "plain_gold_ring_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual documented waste decision and receiver; scratches,incorrect size,unsold/returned stock or missing item alone is not disposal or released gold. Whole-ring metal and included material are content audits,not added again as separated fragments. Range evidence need: Need actual piece/lot identity,native gram net mass,pack versus product scope,alloy/assay/state and original finished-ring sourcegate loss/coverage owner. No assumed whole-ring burden per missing gram or automatic recycling credit. Measurement evidence: protocol cp_rings; original record basis Mass / g. The original amount constraint “Assigned measured actual discarded-ring grams / N; cp_rings.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: discarded_whole_rings_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
