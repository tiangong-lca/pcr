      markdown: "## 5. System Boundary\n\nThis is a physical trade add-on,not a complete gold-ring footprint,metal-refining route or jewelry-compliance guarantee. GIA consumer care is qualitative context only; native mass/fineness/source assignment,stock/lifetime and freight relationships below are declared PCR methodology,not GIA numeric factors.\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual factory-finished plain unplated gemless gold-alloy finger ring with design/size/piece/lot,source assay and actual product/pack condition |\n| starting_condition_role | Nonexchange merchandise stock/throughflow including inherited alloy/finish and original boxes/tags/records |\n| product_classification_scope | Narrower38240preciousmetal ring subset inside61054jewellery382,not watches484 |\n| recursive_input_rule | Actual physical providers need disjoint complete gates; no same-sale recursion or duplicate resources/carrier/assets/receiver treatment |\n| upstream_dataset_requirement | Complete actual factory-finished design/size/alloy ring baseline with metal production,forming/manufacture/finish and original packing as supplied,or missing production once outside service. Raw gold/bullion/alloy mix alone is incomplete; actual fineness basis and sources must match. Actual resource/provider/receiver native scope complete |\n| disclosure | All qualifiers; actual piece/lot/size/gram net/tare/assay/fineness basis/source/condition/stock/fates; originalgate demand/loss and complete competing driver records/coverage owner/integration; complete resources/provider/assets/carrier/receivers |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_addon | all exchanges | ALL finished ring/alloy and inherited package manufacture including upstream burden of sold AND lost commodity stays outside service exchanges. Before complete-chain use integrate a compatible actual factory-finished design/size/alloy ring baseline and original-gate assigned demand/state/loss/exits/coverage owner once outside this add-on. Raw bullion,ore or an alloy basket alone omits actual ring manufacture/finish/pack. Actual service loss handling and receiving treatment remain inside once. |  |\n| boundary_metal | measurement and source | Actual native gram net alloy mass,external package tare and actual fineness/assay basis are distinct. Fine-gold-equivalent if used is a nonadditive content audit on matched actual alloy-metal mass with representative source assay/unit conversion,not a separate supplied gold flow,reference service denominator or automatic price allocation. No nominal carat/purity/price default or legality/hallmark-compliance claim. |  |\n| boundary_operations | ordinary merchant route | No refining,alloying,casting,resizing,polishing,cleaning,plating,destructive assay or gemstone treatment is in this ambient trade route. Source assay records inform actual identity/basis,not a new performed test. Actual additional intervention needs bounded review and complete native resources/fates,not omission or zero. |  |\n| boundary_care | qualitative context | GIA2015 consumer jewelry-care text supports actual scratch/chemical-exposure/packing-condition questions only. Gemstone/pearl/opal/silver-specific moisture/heat/tarnish advice,cleaning/ultrasonic methods,inspection intervals and longevity claims are not plain gold-alloy wholesale defaults or emission factors. Actual manufacturer/buyer conditions govern. | gia-jewelry-care |\n\n\n"
