    - id: added_shipping_materials
      applies_to: "plain_gold_ring_trade"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Only actual new outer cases,pouches,dividers,wraps or labels supplied by this service. Inherited individual boxes,linings,tags or certificates and factory ring finish belong to original commodity scope; consumer care does not mandate replacement. Range evidence need: Require actual native Count/Area/Length/Mass,material/tare and stock/conversion source; no standard pouch mass,anti-tarnish chemical or individual box per piece without evidence. Measurement evidence: protocol cp_materials; original record basis Mass / kg. The original amount constraint “Assigned actual newly added material / N; cp_materials.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: added_shipping_materials_pe_film. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
