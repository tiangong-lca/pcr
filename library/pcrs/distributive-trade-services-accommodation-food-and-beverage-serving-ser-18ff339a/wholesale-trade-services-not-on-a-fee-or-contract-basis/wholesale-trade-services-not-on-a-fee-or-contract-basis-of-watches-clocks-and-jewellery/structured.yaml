    - id: actual_nonusable_alloy_material
      applies_to: "plain_gold_ring_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual collected broken material or incident residue classed nonusable at real receiving treatment. No routine polishing dust,swarf,assay residue,acid sludge or refining loss is presumed. Alloy retained in a whole ring or absorbed/mixed cleanup stream is not another physical outlet. Range evidence need: Require material/state,actual metal versus contamination/native gram basis and representative assay if fine-gold view is used,receiver/transport/treatment and whole/absorbed exclusions. Lost item or unexplained inventory mass is not waste. Measurement evidence: protocol cp_material_fates; original record basis Mass / g. The original amount constraint “Assigned measured actual nonusable material grams / N; cp_material_fates.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: actual_nonusable_alloy_material_gold_alloy_fragment. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
