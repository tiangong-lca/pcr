validation_rules:
  - rule_id: validate_reference
    applies_to: "accepted_service"
    rule: "Require actual own-account B2B accepted commercial completion,all qualifiers and positive unique N. Ring Count,alloy grams,fine-gold-equivalent,assay/registration or money is not reference service completion."
    source_ids: []
  - rule_id: validate_metal_basis
    applies_to: "ring/source/waste"
    rule: "Actual design/size/piece/lot and gram net alloy mass/external tare with real calibration/source required. Fineness values need unit/basis,source assay method/date/sample representativeness and matching actual alloy-metal mass; do not apply nominal carat/default purity to package,contaminated waste or another composition. Fine-gold content is nonadditive,not a new gold input or price allocation."
    source_ids: []
  - rule_id: validate_ordinary
    applies_to: "actual operations"
    rule: "No consumer gem/silver/pearl-care,detergent/ultrasonic/polishing/inspection schedule or lifespan becomes merchant operation or default. Real assay/refining/cleaning/resizing/other transformation needs reviewed separate complete scope."
    source_ids:
      - gia-jewelry-care
  - rule_id: validate_chain
    applies_to: "commodity outside service"
    rule: "Complete actual factory-finished ring source must include actual alloy-metal production and manufacture/finish/pack as supplied or missing stages once outside service,not raw gold alone. Originalgate native quantity/unit/state/source,direct-or-allocated demand/loss/conversions/exits/coverage owner/integration must match source-piece alloy basis. Allocated denominator requires complete compatible source-cohort terminal records including closing/useful exits/returns/loss,never accepted-only or price default."
    source_ids: []
  - rule_id: validate_fates_scope
    applies_to: "all physical duties"
    rule: "Actual useful Product/Waste decisions and receivers,whole/fragment/retained-alloy/fluid exclusions and direct species evidence required. Missing item,scratch,discoloration,assay content or stock discrepancy is not automatically metal waste/release. Native identities/support,conversions/all-user full-life resources/providers/carrier/receiver coverage must be complete once."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
