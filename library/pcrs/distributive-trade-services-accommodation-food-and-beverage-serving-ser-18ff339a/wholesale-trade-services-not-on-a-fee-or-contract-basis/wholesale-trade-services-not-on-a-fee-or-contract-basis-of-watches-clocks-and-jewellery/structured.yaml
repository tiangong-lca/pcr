  calculation_rules:
    - id: normalize
      applies_to: "all inventory"
      rule: "Attributed actual physical quantity / positive unique N once; accepted_service is 1 Item(s)."
      inputs:
        - "attributed quantity"
        - N
        - protocol
      output: "quantity per reference flow"
      source_ids: []
    - id: net_alloy_gram_mass
      applies_to: "nonexchange ring stock"
      rule: "Net actual ring alloy g=sum actual unique piece or documented lot gross readings minus actual external packaging tare,on the same native basis. Use per-piece OR documented total with representativeness,not total times count again. Keep factory finish within actual ring metal/product definition; exclude actual nonmetal/contamination only with measurement. Any kg view uses documented compatible g-to-kg factor/unit/source once."
      inputs:
        - "unique piece/lot"
        - "native gross/tare/net"
        - "each/total"
        - "balance/calibration/method"
        - "conversion units/source"
        - cp_rings
      output: "native net alloy grams,nonexchange audit"
      source_ids: []
    - id: optional_fine_gold_content
      applies_to: "nonadditive content audit"
      rule: "Only when actual assay represents the same metal mass/state: fine-gold-equivalent g=actual alloy-metal g*actual Au mass fraction. Derive fraction from actual reported fineness value and its unit-specific documented factor/source; match method/date/sample scope/uncertainty. Do not apply to package/whole contaminated waste or another phase,add alloy plus contained Au as two flows,or use nominal carat/default purity/price as a physical allocation. Missing assay/basis blocks this optional conversion,not invents purity. Mass-unit metric carat (unitgroup kt) is a mass unit,not gold-fineness karat/K; its mass conversion factor must never derive an Au mass fraction. Fineness fraction requires the actual assay unit and its independently evidenced fraction factor."
      inputs:
        - "actual matched alloy-metal g"
        - "reported fineness value/unit/basis"
        - "fraction conversionfactor/unit/source"
        - "assaymethod/date/source/representativeness/uncertainty"
        - cp_rings
        - cp_material_fates
      output: "nonadditive fine-gold content grams only"
      source_ids: []
    - id: source_gate_assignment
      applies_to: "commodity outside service"
      rule: "Use actual directly measured/traced assigned original quantity/unit/state/source with direct evidence OR assigned quantity=actual original-gate quantity*compatible source cohort driver/source all-exit driver,with declared allocation method/source and positive complete denominator. Numerator record IDs and denominator complete mutually exclusive driver records use the same compatible full source lot/cohort/basis,including closing/unsold/damaged retained,useful other exits,returns and actual whole/fragment/mixed-content loss,never accepted-only or price. Each driver has quantity/unit/basis/source,original-source/cohort/period/conversion/exclusivity links. Actual finished-ring/alloy demand/state/loss/coverage owner/exits integrate once outside service; raw gold alone or missing grams do not supply whole-ring loss factors."
      inputs:
        - "originalgate quantity/unit/state/source"
        - "direct evidence OR method/source/cohort/all-exit records/units/bases/source links"
        - "assigned quantity source"
        - "actual loss conversions/coverage owner/exits/integration"
        - cp_rings
      output: "reproducible original finished-ring assigned demand/loss"
      source_ids: []
    - id: supply_stock
      applies_to: "actual independent materials and unused_supply_return"
      rule: "S=assigned opening+true external net receipts-closing including retained recovered independent supplies. Gross INPUT S plus separate same-scope matched unused OUTPUT OR consumed-only INPUT S-return omitting matching output. No numerical S+return,double deduction,internal recovery as receipt or removal of nonreturned waste/spill upstream burden. Inherited alloy/ring transfers cannot reduce unrelated independent supplies or create negative metal inputs."
      inputs:
        - opening
        - "true external net receipts"
        - "recovered retained closing"
        - "same-scope matched unused export"
        - representation
        - cp_materials
      output: "nonduplicated supplied/returned material quantities"
      source_ids: []
    - id: full_scope_share
      applies_to: "resources/assets/providers"
      rule: "Compatible-period complete-resource attribution=cohort physical driver/all-user driver. Full-life asset equivalent=compatible cohort driver/complete lifetime driver across all users/periods,including manufacture,maintenance/cleaning,replacements,EOL,observed life or history plus sourced remaining use/termination,units,uncertainty/sensitivity/update. A complete provider representation replaces covered own resource/asset burden. No gold price/value allocation default."
      inputs:
        - "actualperiod/resource scope"
        - "cohort/all-user/lifetime driver units"
        - "observed/history/remainder/termination/source"
        - cp_assets
      output: "attributed resources/full-life asset equivalents"
      source_ids: []
    - id: packed_freight_share
      applies_to: "packed_freight"
      rule: "For actual legs,sum[(actual packed native payload*documented load-to-kg factor)*(actual distance*documented distance-to-km factor)*actual attribution share]/positive N. Payload retains actual ring alloy,all cargo boxes/pouches and added packing; gross-minus-tare removes only actual vehicle/noncargo tare. Document native gram/load/distance factors with unit/source and allocated shares/all-user drivers. Do not use net fine-gold-equivalent,value or parent+contained ring double counts as cargo."
      inputs:
        - "actual packed payload/state or gross/noncargo tare"
        - "native load/distance"
        - "factors/units/sources"
        - "actual share/all-user drivers"
        - N
        - cp_transport
      output: "kg*km per reference service"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory"
      requirement: "Confirm actual concrete flow,state/gate,property/unit and medium before final use; actual source design/alloy/receiver remains explicit."
      evidence: "Full detail/support proof"
    - id: quality_alloy
      applies_to: "ring and content views"
      requirement: "Actual native gram net mass/tare/calibration and fineness unit/basis/assay source/date/sample representativeness match actual metal mass. No nominal purity,price or contaminated whole-waste shortcut."
      evidence: "Piece/lot weight and actual assay scope/basis proof"
    - id: quality_complete
      applies_to: "all duties"
      requirement: "Complete original finished-ring demand/state/loss integration outside service with full competing source records; actual resource/provider/carrier/full-life asset/receiver scope and fates once,uncertainty/update disclosed."
      evidence: "Originalgate/drivers/conversion/coverage/integration,meter/lifetime/receiver records"
    - id: warehouse_electricity
      applies_to: "plain_gold_ring_trade"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Actual lighting,picking,records and assigned handling/standby/cleanup equipment only. Do not infer furnace,polisher,ultrasonic cleaner or analytical-instrument energy from a gold or assay record. Range evidence need: Need complete device/provider period metering and causal all-user shares; ring value,fineness or nominal gold mass is not a warehouse-energy factor. Measurement evidence: protocol cp_power; original record basis Energy / kWh. The original amount constraint “Attributed measured actual electricity / N; cp_power.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: warehouse_electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_power; actual source-linked native records"
    - id: housekeeping_water
      applies_to: "plain_gold_ring_trade"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Only actual premises/equipment housekeeping,not ring washing,chemical cleaning,plating,assay digestion or refining. Record any actual environmental water source separately. Range evidence need: Require source/use and actual collected/retained/direct paths; jewelry-care recommendations do not quantify water,effluent or evaporation. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Assigned actual supplied volume / N; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: housekeeping_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
