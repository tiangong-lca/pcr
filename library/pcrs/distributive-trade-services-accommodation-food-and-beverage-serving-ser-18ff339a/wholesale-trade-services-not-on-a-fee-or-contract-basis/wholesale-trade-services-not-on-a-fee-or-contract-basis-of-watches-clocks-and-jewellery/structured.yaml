      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_service | all duties | Normalize actual attributed physical quantities by positive unique accepted commercial N with causal cohort/period drivers. Failed/canceled/quarantined/returned orders,idle/cleanup and unfinished periods retain responsibilities even when no sale completes; pieces,grams,fine-gold-equivalent or price/margin alone are not N. |  |\n| allocation_goods | nonexchange commodity/source assignment | Reconcile actual assigned opening,net receipts,buyer returns,closing unsold/damaged retained,accepted transfers,supplier returns,useful other exits,whole/fragment/mixed-content loss and real direct material exits by exclusive piece/source-lot and native alloy gram basis. Quarantine/internal moves are not exits; lost/missing status or stock discrepancy is unresolved physical fate,not Waste or emission. Original-gate demand/state/loss uses matching actual finished-ring quantity/state/conversion/source/owner/already-included coverage outside service once. |  |\n| allocation_competing_records | allocated source gate | For allocated assignment,source_all_exit_driver_records cover every competing accepted transfer,external return,closing carry/unsold or damaged retained stock,useful other exit and actual whole/fragment/mixed-content loss. Each record has quantity/unit/basis/source,original-source lot link,cohort/period,conversion and exclusivity key. Numerator links identified records and denominator=sum complete mutually exclusive terminal-state/exit drivers for the same compatible full original-source cohort/basis,including closing/useful exits/returns/loss,never accepted-only. Intermediate return movements are reconciled to final state,not summed twice; missing coverage blocks allocation. |  |\n| allocation_supplies | independent service materials | S=assigned opening+true external net receipts-closing including retained recovered independent supplies. Gross INPUT S plus separate same-scope matched unused OUTPUT OR consumed-only INPUT S-return omitting matching output. No numerical S+return,double deduction,internal recovery as receipt or removal of nonreturned waste/spill upstream burden. Inherited alloy/ring transfers cannot reduce unrelated independent supplies or create negative metal inputs. |  |\n| allocation_full_scope | resources/assets/providers | Compatible-period complete-resource attribution=cohort physical driver/all-user driver. Full-life asset equivalent=compatible cohort driver/complete lifetime driver across all users/periods,including manufacture,maintenance/cleaning,replacements,EOL,observed life or history plus sourced remaining use/termination,units,uncertainty/sensitivity/update. A complete provider representation replaces covered own resource/asset burden. No gold price/value allocation default. |  |\n| allocation_material_fates | actual useful/waste/direct streams | Whole rings,separately transferred usable alloy,nonusable fragments,packing,absorbed-liquid/metal cleanup solids and independent liquid are exclusive physical streams. Metal/fineness/fluid contents retained inside each are linked nonadditive audits,not second outputs or double upstream burdens. Actual receiver/transport/treatment once,no automatic refining/recycling/substitution credit. Actual direct species need real medium and measurement/fate; receiver-treatment emissions stay receiver scope once. |  |\n\n\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| source_scope_normalization | nonexchange commodity and service combination | Keep original external commodity stock, source assignment/loss and missing-stage/additional upstream integration quantities in their evidenced RAW actual scope. Identify whether each amount is one actual consignment, a target service cohort, or ALREADY per reference,with source/target scope IDs and quantity basis. The physical source-cohort all-exit denominator assigns RAW quantity to that target scope; it is not automatically the target accepted-service N. Only when combining that same target-scope commodity amount with the 1 Item(s) service derive amount per reference = RAW assigned amount / positive unique accepted source_same_scope_N,with acceptance IDs/time/reversal evidence. A proved single-case scope has source_same_scope_N=1; an already-per-reference amount is not divided again. Preserve raw integration quantities and source links; do not shrink actual upstream remediation or divide the whole source cohort by an unrelated N. N0 responsibility remains disclosed without division. |  |\n\n"
