    rule: "S=assigned opening+true external net receipts-closing including retained recovered independent supplies. Gross INPUT S plus separate same-scope matched unused OUTPUT OR consumed-only INPUT S-return omitting matching output. No numerical S+return,double deduction,internal recovery as receipt or removal of nonreturned waste/spill upstream burden. Inherited alloy/ring transfers cannot reduce unrelated independent supplies or create negative metal inputs."
    source_ids: []
  - rule_id: allocation_full_scope
    applies_to: "resources/assets/providers"
    rule: "Compatible-period complete-resource attribution=cohort physical driver/all-user driver. Full-life asset equivalent=compatible cohort driver/complete lifetime driver across all users/periods,including manufacture,maintenance/cleaning,replacements,EOL,observed life or history plus sourced remaining use/termination,units,uncertainty/sensitivity/update. A complete provider representation replaces covered own resource/asset burden. No gold price/value allocation default."
    source_ids: []
  - rule_id: allocation_material_fates
    applies_to: "actual useful/waste/direct streams"
    rule: "Whole rings,separately transferred usable alloy,nonusable fragments,packing,absorbed-liquid/metal cleanup solids and independent liquid are exclusive physical streams. Metal/fineness/fluid contents retained inside each are linked nonadditive audits,not second outputs or double upstream burdens. Actual receiver/transport/treatment once,no automatic refining/recycling/substitution credit. Actual direct species need real medium and measurement/fate; receiver-treatment emissions stay receiver scope once."
    source_ids: []
  - rule_id: source_scope_normalization
    applies_to: "nonexchange commodity and service combination"
    rule: "Keep original external commodity stock, source assignment/loss and missing-stage/additional upstream integration quantities in their evidenced RAW actual scope. Identify whether each amount is one actual consignment, a target service cohort, or ALREADY per reference,with source/target scope IDs and quantity basis. The physical source-cohort all-exit denominator assigns RAW quantity to that target scope; it is not automatically the target accepted-service N. Only when combining that same target-scope commodity amount with the 1 Item(s) service derive amount per reference = RAW assigned amount / positive unique accepted source_same_scope_N,with acceptance IDs/time/reversal evidence. A proved single-case scope has source_same_scope_N=1; an already-per-reference amount is not divided again. Preserve raw integration quantities and source links; do not shrink actual upstream remediation or divide the whole source cohort by an unrelated N. N0 responsibility remains disclosed without division."
    source_ids: []
