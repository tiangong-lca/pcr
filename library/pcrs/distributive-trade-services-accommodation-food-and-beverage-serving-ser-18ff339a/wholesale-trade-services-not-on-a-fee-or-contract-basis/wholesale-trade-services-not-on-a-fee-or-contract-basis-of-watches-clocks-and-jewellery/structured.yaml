    - id: packed_freight
      applies_to: "plain_gold_ring_trade"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Use real packed shipment/leg and exclusive commodity/service carrier scope,including empty operation where covered. Native grams for rings do not justify excluding cargo boxes,pouches or other actually shipped materials from packed payload. Range evidence need: Need actual cargo/gross-noncargo tare role,distance,load/distance factors/units/sources and causal share/all-user drivers; fine-gold-equivalent or sales value is not packed freight mass. Measurement evidence: protocol cp_transport; original record basis Mass * distance / kg*km. The original amount constraint “Assigned actual packed load-distance / N; cp_transport.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
