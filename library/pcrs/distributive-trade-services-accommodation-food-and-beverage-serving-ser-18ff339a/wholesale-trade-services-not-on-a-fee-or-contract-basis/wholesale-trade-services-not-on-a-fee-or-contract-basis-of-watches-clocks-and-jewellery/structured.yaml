    - id: unused_supply_return
      applies_to: "plain_gold_ring_trade"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only actual unused independent supplies with same-scope provenance at external receiver. Returned/unsold rings,inherited boxes,retained supplies and reusable assets follow their own commodity/stock scope,no automatic supply credit. Range evidence need: Need native quantity/state/matching: gross INPUT S plus separate usable OUTPUT OR consumed-only INPUT S-return omitting matched output. Never numeric S+return,double deduction or subtraction of inherited metal transfers from unrelated supplies. Measurement evidence: protocol cp_materials; original record basis Mass / kg. The original amount constraint “Assigned measured same-scope unused outward / N; cp_materials.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: unused_supply_return_detergent_return; unused_supply_return_pe_film_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
