    - id: full_life_assets
      applies_to: "plain_gold_ring_trade"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Actual building,racks/storage supports,handling/records equipment and reusable containers need manufacture,maintenance/cleaning,replacements and EOL across all users/periods. Merchandise rings and their consumer life are not service assets. Range evidence need: Require compatible cohort/lifetime driver identity/units,observed life or history plus sourced remainder/termination,uncertainty/sensitivity/update; reusable-box returns do not manufacture new boxes each trip. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Attributed complete asset equivalents / N; cp_assets.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
