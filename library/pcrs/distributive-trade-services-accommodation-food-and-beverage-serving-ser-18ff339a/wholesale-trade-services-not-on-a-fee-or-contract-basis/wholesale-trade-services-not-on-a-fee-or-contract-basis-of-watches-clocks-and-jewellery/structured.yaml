    - id: actual_service_materials
      applies_to: "plain_gold_ring_trade"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Only actual native housekeeping preparations,wipes,absorbents or filters used here. No polishing paste,acid,flux,alloy metal,detergent for rings or ultrasonic bath is prescribed. Factory surface finish and existing assay certificate remain inherited product/records. Range evidence need: Need actual SKU/formulation/dry material/active-carrier basis,stock/use/returns and compatible density/temp/conversion sources; contents are not second additive supplies. Measurement evidence: protocol cp_materials; original record basis Mass / kg. The original amount constraint “Attributed actual native supply / N; cp_materials.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: actual_service_materials_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
