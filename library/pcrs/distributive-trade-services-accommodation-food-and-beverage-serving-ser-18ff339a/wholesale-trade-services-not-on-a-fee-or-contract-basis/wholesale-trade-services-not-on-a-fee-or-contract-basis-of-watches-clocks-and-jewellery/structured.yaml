    - id: actual_usable_alloy_transfer
      applies_to: "plain_gold_ring_trade"
      requirement: "Obtain the independent handover record, actual material/composite state, quality acceptance and recipient for the specifically described recovered outlet in this record. Determine Product-versus-Waste from that real handover; do not presume a recovered-product identity or substitution credit. Conditional actual separately collected alloy fragment/material with proved usable state and accepted external receiver,not automatic merchant refining/recovery. Normal usable rings remain merchandise stock/returns. Actual inherited-metal source manufacture stays in commodity accounting once,no substitution credit or operating metal-input deduction. Range evidence need: Need actual alloy-metal gram basis,contamination/fineness source if applied,source-piece/receiver/ownership gate and nonoverlap with whole/fragment waste. Precious content/value alone does not establish usable export or avoided mining. Measurement evidence: protocol cp_material_fates; original record basis Mass / g. The original amount constraint “Assigned measured actual usable alloy grams / N; cp_material_fates.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
