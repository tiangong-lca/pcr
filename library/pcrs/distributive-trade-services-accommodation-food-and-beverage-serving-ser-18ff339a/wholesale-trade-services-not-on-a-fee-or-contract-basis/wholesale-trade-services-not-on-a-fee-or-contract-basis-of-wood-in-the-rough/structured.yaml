      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| FINAL_actual | accepted_service | Actual purchaseownershipresale/B2Bbuyer/FINALgate-time-source/reversals/uniqueN/all16qualifiers, receipt-logpiece-m3-tonne insufficient. N0failedcancelledquarantinedunfinished retainedno division. |  |\n| actual_log_scope | commodity | Freshbarkon Piceaabies sawgrade/logIDs/preparedreceivinggate, no merchantforestharvest-debark-saw-dry-preserve/use, no sawnmoisturedensity/growth/sequestration/automaticdecay. | metsa-spruce-log-sawn-boundary |\n| native_bark_water | commodity | Retain actual formulas, calibration, all native inputs, samples and sources for solid/stacked and under/over-bark volume relationships. r_bark is Vbark/Vunder; convert percentages before calculation. It is not a mass fraction or a table default. Wet/dry calculations must use the same actual water-only definitions; convert percentages first and distinguish other LOD volatiles. Require compatible actual density and temperature units for whole bark-on logs and components. Full wet net mass retains bark and water and excludes only external support tare. | forest-research-sawlog-tables-1987 |\n| source_integration | commodity | Use native direct actual tracing OR positive, COMPLETE terminal records including closing stock, useful other exits, returns and proven loss, each with native unit, basis, method, state, time, source, link and owner. Do not use accepted outputs alone or overlay driver allocation on direct assignment. Match actual species, grade, state and gate to any under-bark roadside producer dataset and include receipt transport beyond that gate once. After reconciling the same baseline stage/loss coverage and exclusive loss ownership, ACTUALLY COMPLETE integration of missing stages and required additional demand outside the service, with native quantity, status, link, timezone, source, owner and coverage before complete-chain readiness; a pending plan is insufficient. |  |\n| resources_fates | all | NET supplies exclude container tare. Choose gross input with a matched unused-return output OR consumed-only input with that matched output omitted. Complete asset lifetimes cover all users, with observed plus source-backed remaining drivers, termination assumptions, native driver units, uncertainty and updates. Choose either attributed asset equivalents or a lifecycle-complete provider quantity, and divide the chosen quantity by N once. Freight payload retains wet wood, bark and all cargo supports, excluding ONLY vehicle and other non-cargo tare. Multiply EACH quantities by repeat counts once and leave TOTAL quantities unchanged; apply each record share INSIDE the sum before dividing by positive final N once. Retain resources when N=0. Whole logs, separate wood/bark, mixed cleaning waste, free fluid and direct species are exclusive where they overlap; count actual receiver treatment once. Do not equate a residual with wood loss, CO2 or zero or apply a default credit. Do not reapply fractions already included in a complete factor. |  |\n| validate_concrete_identity_decisions | all inventory rows | Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required. |  |\n\n"
