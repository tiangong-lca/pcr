  downstream_use: "Physicalsprucesawlog wholesaleadd-on, separately completedpreparedsource/receipthaul/demandlossintegration outsideonce"
  allowed_use: "Actualfreshbarkon Piceaabies sawlogs preparedsource/receivingstate owned-resold FINALB2Bconsignment/nativevolume-bark-water-mass evidence"
  excluded_use: "Otherwoodspeciesgrades/sawnproducts/merchantfell-extract-prepare-debark-saw-dry-preserve/use; standaloneforestgrowth/carboncredit; retail/agency/storageonly"
  required_metadata: "Merchant purchase, ownership and resale; B2B buyer; final gate, source, reversals and N; species, log lot, grade, fresh bark-on state and prepared source/receiving gates; solid/stacked and under/over-bark volume bases; log-scaling formulas, inputs, calibration and samples; bark-ratio denominator; native water, density and temperature units; net mass, supports and time/period. Retain complete source, terminal, baseline and additional records and COMPLETED integration quantity, status, link, timezone, source, owner and coverage, receipt haulage, and resource, provider, asset, freight and receiver owners."
