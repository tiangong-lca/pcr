allocation_rules:
  - rule_id: alluser_resources
    applies_to: "service"
    rule: "Use direct actual tracing OR quantity×compatible target_driver/positive COMPLETE all_consumer_driver, preserving native unit, basis, method, state, time and source. Include all users and periods, idle time and cancelled, failed, quarantined or unfinished work. Divide the assigned total once by unique final N established by merchant ownership/resale, the B2B acceptance gate and reversals, only when N>0. Retain resources when N=0. Do not assume log volume or price is a valid allocation driver."
    source_ids: []
  - rule_id: source_completed_once
    applies_to: "commodity"
    rule: "Use directly measured or traced assigned_gate_demand with native quantity/state, direct evidence and exclusive terminals OR actual_source_gate_quantity×target_driver/source_all_terminal_driver. Require a positive, COMPLETE set of terminal records for final accepted outputs, useful other exits, returns, closing stock and proven loss, each with quantity, unit, basis, method, state, time, source, link and owner. Do not use accepted outputs alone, overlay driver allocation on direct assignment or treat unknown quantities as zero. Native source, assigned, baseline and additional quantities, conversions and exclusive loss ownership must match actual species, grade, bark state, gate and receipt-transport coverage. After reconciling the same baseline stage/loss coverage, ACTUALLY integrate required additional demand and missing stages once outside the service. Retain completed status, native quantity, link, timezone, source, owner and coverage; pending integration does not establish complete-chain readiness."
    source_ids: []
  - rule_id: supply_stock
    applies_to: "supplies"
    rule: "Calculate S as assigned opening stock plus NET actual material receipts minus closing stock, including retained recovery. Receipts exclude supply-container tare. Choose exactly one: (1) gross S/N as INPUT and actual matched unused external return/N as a separate OUTPUT; (2) consumed-only (S-return)/N as INPUT and OMIT that matched return OUTPUT. Do not add return quantity to input or deduct it twice; retain internal recovery in closing stock. Do not offset unrelated supplies with recovered log/bark material or apply a negative credit."
    source_ids: []
  - rule_id: fullasset
    applies_to: "assets/providers"
    rule: "Use actual used_driver/COMPLETE lifetime_all_consumer_driver, with native unit, basis, method, state, time and source, to attribute complete manufacture, maintenance, actual replacement and end-of-life burdens across every consumer and period. Lifetime use comprises observed plus source-backed remaining use, with termination assumptions, uncertainty, sensitivity and updates. Choose either the attributed asset-equivalent quantity or the lifecycle-complete provider quantity, and divide the chosen quantity by positive N once. Do not use a default forest rotation as asset lifetime."
    source_ids: []
  - rule_id: exclusive_fates
    applies_to: "stock/receiver"
    rule: "Treat whole wet logs with bark, actually separated wood/bark/supports, received mixtures of carriers, absorbed fluid and fragments, free contained water and direct species as exclusive, non-additive views where they overlap. Count actual receiver transport and treatment once after reconciling provider coverage. Useful other exits or downgrading do not automatically establish waste or a credit; water loss is not dry-wood loss or CO2 emission."
    source_ids: []
  - rule_id: commodity_link_scope
    applies_to: "nonexchange commodity interface"
    rule: "Keep actual original-gate stock and completed external integration at their recorded raw quantities. Declare source_assignment_scope_id, actual target_consignment_ids/target_cohort_id and source_assignment_quantity_basis: single_consignment_case, target_cohort_total or already_per_reference. For a raw target-cohort total, source_link_per_service_quantity=source_link_assigned_raw_quantity/same_target_scope_N ONLY when the positive N covers exactly that assigned target scope, with actual native units/state/source and acceptance-reversal evidence; use that interface once when combining with 1 accepted_service. A single-consignment case with N=1 and an already-per-reference quantity are not divided again. Do not divide actual external stock/stage-integration records by service N or use whole-source-cohort N for a narrower assigned target; preserve raw quantities and an explicit once-only link."
    source_ids: []
