  calculation_rules:
    - id: completed_count
      applies_to: "accepted_service"
      rule: "N=count unique actual buyer-accepted commercial consignment IDs at the declared final gate; do not count actual kits/pairs as service outputs."
      inputs:
        - "cp_binocular buyer_acceptance_id/consignment_id/state/time"
      output: "N and 1 Item(s) service reference"
      source_ids: []
    - id: kit_mass_audit
      applies_to: "merchandise nonexchange"
      rule: "whole_pack_mass=actual_net_kit_mass+actual_included_pack_tare only on same scope/state/method; body+included accessories are a nonadditive kit decomposition, not another service supply."
      inputs:
        - "cp_binocular native quantities/configuration/unit/method/source"
      output: "Native kit and actual pack quantity audit, no default model weight"
      source_ids: []
    - id: original_gate_demand
      applies_to: "commodity outside"
      rule: "Preserve actual raw original-gate demand and loss/stage integration at its physical assignment scope. Record assignment_scope_ids, quantity_basis=raw_target_cohort or per_reference, same_target_scope_N and source. Directtrace OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers uses complete compatible mutually exclusive all-exit records, actual state-change share and original-state equivalence. For an actual raw target-cohort quantity, commodity_source_gate_demand=assigned_source_gate_quantity remains the unnormalized physical ledger amount; actual external stage/loss integration and stock closure use that raw amount once. ONLY when combining with the 1 Item(s) service, derive q_per_reference=raw_assigned_to_that_same_scope/positive same_target_scope_N. Already per-reference quantities keep their normalization and are not divided again; a single-case raw scope has N=1. N=0 produces no normalized value. Require quantity/unit/state/source/allocation/conversion/sole owner and already-included loss coverage; finaldispatch-plus-waste or a stock residual does not establish source demand/loss."
      inputs:
        - "cp_binocular original source quantities/native all-exit drivers/equivalence/owner/coverage"
      output: "Quantified complete supplier-gate commodity demand and exclusive once-only linked loss adjustment outside service"
      source_ids: []
    - id: supply_convention
      applies_to: "actual supplies"
      rule: "S=opening+net_receipts-closing; select gross S/N input plus separate matched usable_outward_return/N OR consumed-only (S-usable_outward_return)/N input and OMIT paired output."
      inputs:
        - "cp_supplies source stock/pairing/unit/conversion"
      output: "Exclusive input/unused outward return convention without second credit"
      source_ids: []
    - id: utilities
      applies_to: "actual utilities"
      rule: "allocated_utility=native_interval_quantity*service_driver_share/N after compatible conversion; service_driver_share=service_driver/all_user_driver on evidenced causal same-unit basis."
      inputs:
        - "cp_utilities interval and all-user native driver records/source"
      output: "Actual utility per service, measured/allocated distinction"
      source_ids: []
    - id: provider_scope
      applies_to: "actual packages"
      rule: "provider_quantity=actual_native_package_quantity*documented_share/N only after physical scope/equivalence and exclusive event reconciliation."
      inputs:
        - "cp_provider native equivalents/share units/source/coverage"
      output: "Disjoint real provider package per service"
      source_ids: []
    - id: asset_equivalent
      applies_to: "shared_assets"
      rule: "asset_equivalent=job_driver/lifetime_all_user_driver/N; lifetime_all_user_driver=compatible_observed_all_user_driver+compatible_sourced_remaining_driver. Document actual replacements and EOL in matched complete life; evaluate uncertainty/sensitivity/update."
      inputs:
        - "cp_assets complete lifecycle and native driver/conversion/source"
      output: "Full-life all-user asset attribution per service"
      source_ids: []
    - id: transport_work
      applies_to: "freight"
      rule: "actual_transport_work=compatible_whole_pack_payload_tonnes*compatible_distance_km for actual mass-distance service, then multiply actual service_share/N; native carrier work takes precedence when equivalent."
      inputs:
        - "cp_freight native payload/distance/conversions/share/empty-leg scope"
      output: "Disjoint actual freight work per service"
      source_ids: []
    - id: outlets
      applies_to: "actual transfers"
      rule: "outlet_quantity=actual_compatible_net_quantity/N, whole stream with retained content. Parent-kit/part/packing/component audits are nonadditive; retained content is not independent release or recovery."
      inputs:
        - "cp_outlets whole/native/component/content/state/receiver records"
      output: "Exclusive actual receiver transfer quantity; retained stock and unknowns separately disclosed"
      source_ids: []
    - id: release
      applies_to: "direct_species"
      rule: "release_quantity=actual_measured_species_quantity/N OR compatible_activity*applicable_factor*required_composition*required_release_fraction/N; omit extra factors already included in complete species-release factor."
      inputs:
        - "cp_environment native activity/factor/composition/fate/conversion/receptor evidence"
      output: "Actual species and receiving-medium quantity, no default sealed charge/leak"
      source_ids: []
  data_quality_requirements:
    - id: native_operands
      applies_to: "All cards and calculations"
      requirement: "Every actual operand retains native unit/state/basis/method/source, sampling/time where relevant, conversion-factor units/source; absent record remains unresolved not zero."
      evidence: "Node-owned CPs and underlying actual records"
    - id: representativeness
      applies_to: "Model/configuration and provider"
      requirement: "No universal Nikon weight/performance/accessory/gas/repair/life or humidity threshold; actual source/sku/site/time and all-user native shares govern."
      evidence: "Supplier model/kit pack, actual condition/acceptance and method/source"
    - id: linked_chain
      applies_to: "Commodity outside service"
      requirement: "Complete finished packed optical kit supplier gate plus quantified original demand/loss owner/exclusive coverage required before complete-chain package; source missing stages disclosed and added once."
      evidence: "cp_binocular linked commodity-system readback"
    - id: final_package
      applies_to: "Actual exchanges"
      requirement: "Bind each actual expanded material/provider/asset/waste/species to verified concrete identity and actual supported property/unit; semantic candidate cards are not final TIDAS exchange UUIDs."
      evidence: "Actual detail/support evidence and raw foreground package"
    - id: electricity
      applies_to: "ambient_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Only actual allocated warehouse lighting/handling/meter scope. This route consumes no binocular operating or demonstration electricity. Distinguish standalone measured utility from a provider package already covering it. Range evidence need: Metered intervals and all-user handling/space-time drivers, supplier and delivered-energy property support are required before setting an electricity-per-consignment guardrail. Measurement evidence: protocol cp_utilities; original record basis Energy / kWh. The original amount constraint “metered_interval_quantity*service_driver_share/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: cleaning_water
      applies_to: "ambient_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Actual warehouse surface hygiene water only if supplied. It is not optical washing, lens cleaning or water contained in traded equipment; source and receiver boundaries follow records. Range evidence need: Actual water meter/native volume or evidenced density conversion, cleaning interval and all-user share are needed; no per-kit cleaning-water benchmark is assumed. Measurement evidence: protocol cp_utilities; original record basis Volume / m3. The original amount constraint “actual_water_quantity*service_driver_share/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: hygiene_supplies
      applies_to: "ambient_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand only actual cleaning agents, wipes or absorbents used for warehouse hygiene/incidents with distinct material and stock records. Do not prescribe consumer optical cleaners, solvents, desiccants or a dose. Range evidence need: Actual SKU/formulation, unused supply stock and whole wipe/absorbent quantity with composition and native conversions are needed for each used material. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “selected_supply_input/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: hygiene_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: added_packing
      applies_to: "ambient_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Only actually new external transit cartons/cushions/seals crossing service boundary; inherited kit case/caps/strap and factory packing are merchandise. Repacking or optical-kit assembly is outside this route. Range evidence need: Actual added outer unit, per-piece mass/material and new-versus-reusable role must be known; no carton count or protective-material allowance per kit is imposed. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “selected_supply_input/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: added_packing_paperboard_carton. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_packages
      applies_to: "ambient_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Use actual physical package/native equivalent only with explicit resources, warehouse handling and asset/treatment coverage. Financial fees are not quantities. Optical repair, alignment, purge, coating and powered testing remain outside scope even if contracted. Range evidence need: Provider unit, physical equivalence and covered event/resource matrix must be obtained; no generic outsourced-package factor or hidden product transformation is allowed. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “actual_native_package_quantity*documented_share/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_provider; actual source-linked native records"
    - id: shared_assets
      applies_to: "ambient_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Attribute actual warehouse/racks/electric handlers/reusable pallets/bins/scales and monitors across all users and periods including actual maintenance/replacements/retirement/end-of-life. Factory kit accessories are not service infrastructure. Range evidence need: Complete matched asset lifecycle, native driver units, observed history plus sourced remaining use and uncertainty are required; no new pallet/rack per consignment or assumed lifetime is used. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “job_driver/lifetime_all_user_driver/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "ambient_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Only actual owned transport segments not already covered elsewhere. Transport payload is whole actual kit/accessory plus packing load; declared net optical body mass alone is insufficient. Carrier assets/fuels/empty legs require one owner. Range evidence need: Mode, loaded whole-pack mass, distance/unit conversions, empty-return coverage and carrier service scope need route-specific evidence; no default load, journey or kit mass is inferred. Measurement evidence: protocol cp_freight; original record basis Freight transport / t*km. The original amount constraint “actual_transport_work*documented_service_share/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: unused_count_returns
      applies_to: "ambient_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only actual outward usable unused units from the same standalone added-supply stock. Closing recovered stock is not an export; merchandise/accessories returned to supplier are nonexchange stock events here. Omit this exchange when matched return was deducted in consumed-only supply input. Range evidence need: Actual unit identity/condition, outward receiver and source-stock pairing are needed; no credit is inferred from reusable kit cases, packaging stock recovery or supplier merchandise returns. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “actual_matched_unused_outward_units/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: unused_mass_returns
      applies_to: "ambient_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Usable unused actual hygiene material outward transfer from same standalone supply stock, with identity and native net mass. Gross-input convention retains the paired output; consumed-only convention omits it. No automatic avoided production credit. Range evidence need: Actual unopened/usable product, quantity unit, density if needed and same-stock receiver pairing are required; no returned-goods mass is netted against cleaning supply. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “actual_matched_unused_outward_mass/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: unused_mass_returns_detergent_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: whole_goods_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual receiver-accepted whole binocular/kit discard, retaining declared accessories, packaging and sealed contents where actually included. Match serial/lot and state; chipped lens/fog/sticky armour or commercial return alone is not disposal. Whole-stream content audits do not add separate material exchanges. Range evidence need: Actual whole-device/kit boundary, mass basis, included pack/accessories/retained content and receiver classification/treatment coverage are needed; no rejection or unknown condition is assumed to be waste. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual_compatible_outlet_net_quantity/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: whole_goods_waste_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: part_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual independently collected damaged parts/fragments linked to parent binocular/kit, if received or incident-detached and legally transferred. No routine dismantling/repair prescribed. Exclude parts already in whole-device waste and separately identify included retained material/content. Range evidence need: Parent-kit genealogy, actual lens/body/armour/cap material, native quantity/unit/composition and exclusive receiver fate are needed; fragment count is not original binocular count or airborne release. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual_compatible_outlet_net_quantity/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: packaging_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual physically separate carton/cushion/film/material waste; distinguish factory merchandise pack, added supply and retained reusable stock. Do not duplicate packing included with discarded whole kits/parts or mixed containment waste. Range evidence need: Separate packing identity, net mass, contamination/retained fragments or fluid and transfer receiver are required; factory packing mass is not another new packing purchase on resale. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual_compatible_outlet_net_quantity/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: packaging_waste_paper_pack; packaging_waste_metal_pack; packaging_waste_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: hygiene_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Whole actually transferred spent wipe/absorbent/filter stream with retained fragments/fluid composition audits. Distinguish purchased dry product from measured spent whole stream; do not add retained components again as waste or releases. Range evidence need: Spent stream actual wet/net mass, retained fluid/component native unit/basis/source and receiver evidence are needed; material supplied or lens damage does not establish spent waste quantity. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual_compatible_outlet_net_quantity/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: hygiene_waste_spent_wipe. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: contained_liquid
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual collected warehouse surface-cleaning liquid or contained incident liquid to a real receiver; no routine optical washing or purging. Quantity/composition/density-temperature and treatment provider coverage must match the physical stream. Range evidence need: Actual collected volume or compatible mass-density conversion, retained solids and receiver treatment records are needed; utility intake or visible condensation is not automatically this stream or direct water release. Measurement evidence: protocol cp_outlets; original record basis Volume / m3. The original amount constraint “actual_compatible_outlet_net_quantity/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_liquid_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: direct_species
      applies_to: "ambient_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Expand only independently evidenced substance/particle identity and receiving medium. Factory nitrogen/waterproof claim, fog, sticky resin, glass breakage or missing inventory does not establish a species, quantity or emission. Captured fragments and contained cleanup streams are not airborne particles. Range evidence need: Species/medium, actual sampling or applicable activity-factor basis and native composition/fate/conversion evidence are required. A complete species-release factor must not be multiplied by composition/fate again; no sealed charge or leak factor is invented. Measurement evidence: protocol cp_environment; original record basis Mass / kg. The original amount constraint “actual_measured_species_quantity/N OR actual_activity*applicable_factor*required_composition*required_release_fraction/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
validation_rules:
  - rule_id: reference_gate_check
    applies_to: "foreground_dataset_conformance"
    rule: "Match reference name/link to actual completed service output, N and declared buyer acceptance once, with actual non-electronic model/configuration/kit/pack/count/time qualifiers."
    source_ids: []
  - rule_id: commodity_gate_check
    applies_to: "foreground_dataset_conformance"
    rule: "Verify all actual missing upstream optical manufacture/accessories/finish/sealed content/inherited pack stages at original gate outside once, compatible source assigned quantity/all-exit allocation and actual loss coverage owner. Missing evidence blocks complete-chain claim.  Verify raw assignment_scope_ids/quantity_basis and same_target_scope_N; never use a normalized view to close actual cohort stock or integrate actual missing stages/loss."
    source_ids: []
  - rule_id: scope_check
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm no merchant powered demo/repair/alignment/opening/gas purge/recovery or prescribed desiccant/cleaner use hidden in provider scope. Inherited nitrogen label is not new service input."
    source_ids: []
  - rule_id: stock_receptor_check
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile whole/part/pack/content stocks/returns/actual receiver exits exclusive. Unknown loss/condition/charge is not zero, actual discard, avoided production or direct species; captured fragments/cleanup liquids cannot also be air/water releases."
    source_ids: []
  - rule_id: resource_owner_check
    applies_to: "foreground_dataset_conformance"
    rule: "Check causal all-user intervals, full-life observed+sourced asset remainder/unit equivalence/uncertainty, provider/carrier/treatment owner and gross-plus-return versus consumed-only omitted-return convention."
    source_ids: []
  - rule_id: identity_evidence_check
    applies_to: "foreground_dataset_conformance"
    rule: "Require actual quantity/conversion/source/support and verified concrete UUID for each final exchange; retain unresolved candidate identities and evidence gaps without publication-ready assertion."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "foreground_dataset_conformance"
    rule: "all inventory rows"
    source_ids:
      - "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence"
      - species
      - state
      - "receiver or provider configuration blocks final data completion"
      - "no assumed zero. Whole streams and components"
      - "gross inputs and matched returns must remain mutually exclusive where required."
