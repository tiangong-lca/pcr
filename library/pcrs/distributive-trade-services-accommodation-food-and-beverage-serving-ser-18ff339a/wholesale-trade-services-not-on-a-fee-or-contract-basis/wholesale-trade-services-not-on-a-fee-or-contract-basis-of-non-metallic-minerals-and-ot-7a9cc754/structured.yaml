validation_rules:
  - rule_id: final_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require unique final real ownership/resale B2B acceptance/source/reversals with N>0, original supplier finished closed-bag natural-quartz state; reference name/link/unit and actual qualifiers align"
    source_ids: []
  - rule_id: native_analysis
    applies_to: "foreground_dataset_conformance"
    rule: "Native water wet/dry same-sample percent first, no LOI=water, normalized oxide=absolute quartz/Si, true density=bulk or product fines=air release; representative methods/sources/units required"
    source_ids: []
  - rule_id: source_integration
    applies_to: "foreground_dataset_conformance"
    rule: "Full actual original gate and assigned demand/loss with direct OR complete positive all-terminal native drivers incl final closing/useful other/returns/proven loss. Internal same-original carry not new demand/N/two terminal exits. Missing actual stages/additional demand already integrated outside once with completed link/time/source/owner/native coverage before complete-chain use  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: service_owners
    applies_to: "foreground_dataset_conformance"
    rule: "NET supply gross+paired unused OUTPUT OR consumed OMIT matching output, full all-user observed+sourced remaining asset life, per-record unique freight share inside SUM/N once; provider/carrier/receiver coverage disjoint"
    source_ids: []
  - rule_id: fates_and_gaps
    applies_to: "foreground_dataset_conformance"
    rule: "Actual whole/loose/pack/capture/liquid/components/species exclusive receiver/medium and treatment once; unknown not zero, no default loss/recycling credit.  Actual quantities with compatible native units, basis and traceable sources plus verified concrete identities/support are required before the final data package. A generic numerical Range is not independently mandatory. Any specification or externally sourced interval actually claimed or used needs traceable compatible evidence and basis; an empirical guardrail additionally needs independent comparable observations. Preserve actual acceptance criteria, required sample uncertainty and disclosed gaps without inventing values; absence of a generic range alone does not reject an otherwise evidenced package. Candidate status is not publication readiness"
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "foreground_dataset_conformance"
    rule: "all inventory rows"
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground own-account merchant-service add-on per actual completed B2B consignment"
  downstream_use: "Link once to complete actual extracted/washed/graded/actually dried if performed/original-filled-closed-bag commodity gate with original demand/loss and completed additional integration outside service"
  allowed_use: "Actual supplier-finished original closed-bag washed-graded natural-quartz sand at its received moisture/grade/pack state, ambient owned B2B resale"
  excluded_use: "Full sand material footprint alone, raw quarry predecessor as complete packed gate, bulk/flour/cristobalite/coated/calcined/blended goods, merchant processing/rebag/use, pending missing-stage integration treated complete"
  required_metadata: "merchant_id; ownership_purchase_resale_evidence; business_buyer_id; acceptance_gate; acceptance_source; acceptance_reversal_ids; supplier; actual_SKU; actual_grade; source_lot; bag_ids; natural_quartz_evidence; supplier_wash_grade_evidence; supplier_dry_actual_or_not; original_closed_bag_evidence; original_presentation_state; net_as_received_sand_mass; bag_pack_tare; sample_component_scope; water_wet_or_dry_basis; oxide_normalized_or_absolute_basis; composition_sum_basis; particle_class_definition; density_temperature_unit; receipt_time; dispatch_time; acceptance_time; period_id; time_zone"
  required_quality_disclosure: "Actual quantities/identities/ranges, same-sample water/LOI/oxide-mineral/particle/bulk-density basis, original-source complete terminal/carry/baseline/additional/loss integration, all-user asset remainder/native shares and actual receiver uncertainty"
  update_trigger: "Actual SKU/lot/supplier route/drying/grade/mineral phase/moisture/pack, merchant operations, source boundary/assignment/coverage, asset/provider/receiver/species or conversion evidence changes"
