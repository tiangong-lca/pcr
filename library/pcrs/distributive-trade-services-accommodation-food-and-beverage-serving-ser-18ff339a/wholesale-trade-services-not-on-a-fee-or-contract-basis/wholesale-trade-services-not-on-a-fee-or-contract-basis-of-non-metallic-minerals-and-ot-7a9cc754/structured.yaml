allocation_rules:
  - rule_id: completed_reference
    applies_to: "foreground_burden_allocation"
    rule: "N is unique FINAL real owned/resold B2B commercial consignment acceptance after reversals; actual merchant_id/ownership_purchase_resale_evidence/business_buyer_id/acceptance_gate/source/reversal required. N>0 before division; no bag/kg/price/invoice-line equivalence"
    source_ids: []
  - rule_id: source_assignment
    applies_to: "foreground_burden_allocation"
    rule: "Actual direct original-gate trace OR positive complete compatible source-cohort terminal allocation including final closing/useful-other/returns/proven loss, each native driver/link/owner. Include evidenced ordinary moisture/state-change share of original source quantity; not final net kg+discard kg. Internal closing-opening carries original quantity/state/source/owner without new demand or two terminals  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: causal_service_share
    applies_to: "foreground_burden_allocation"
    rule: "Direct native event assignment first, otherwise documented_share=numerator_driver/denominator_driver on positive compatible all-consumer causal basis, covering open/reject/idle and actual periods. No economic margin, dry quartz purity or particle yield as default driver"
    source_ids: []
  - rule_id: net_supply_returns
    applies_to: "foreground_burden_allocation"
    rule: "S=opening+net_receipts-closing with retained recovery separately reconciled; NET material receipts exclude container tare. Gross S/N INPUT with separate matched unused OUTPUT OR consumed (S-unused_outward_return)/N INPUT and OMIT matching return exchange. Same-scope standalone supply only, no inherited commodity credit"
    source_ids: []
  - rule_id: complete_life_assets
    applies_to: "foreground_burden_allocation"
    rule: "Full manufacture/maintenance/replacements/retirement/EOL each actual asset, all users/periods. Native compatible job_driver/(observed_all_user_driver+remaining_driver) with sourced remaining life/equivalence/uncertainty/sensitivity/update; lifetime whole pool not current observation alone"
    source_ids: []
  - rule_id: unique_freight_receivers
    applies_to: "foreground_burden_allocation"
    rule: "Each unique actual load-leg records own cargo/coverage/native share inside SUM then /N once. Actual whole/loose/pack/capture/liquid/usable return/species fates exclusive; receiver transport/treatment and provider scope once, no avoided-production credit by default"
    source_ids: []
