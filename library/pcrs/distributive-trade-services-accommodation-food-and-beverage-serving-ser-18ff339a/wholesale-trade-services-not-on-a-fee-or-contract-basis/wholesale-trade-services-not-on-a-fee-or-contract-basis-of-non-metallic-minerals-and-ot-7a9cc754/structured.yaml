    - id: separate_sand_waste
      applies_to: "original_bagged_quartz_sand_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual loose sand/fines exiting to a waste receiver only, excluding retained whole-bag sand and mixed capture. Does not prescribe bag opening, screening or material regeneration, and is not direct airborne dust. Range evidence need: Actual incident/parent lot, native wet/dry/sample component amount and receiver classification/treatment required; product particle-size fraction or stock deficit is not discarded amount or respirable release. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual exclusive loose discarded sand/fines quantity/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: separate_sand_waste_atomic_case; separate_sand_waste_quartz_sand_fines. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: pack_waste
      applies_to: "original_bagged_quartz_sand_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual pack already separated by the real event, with residual sand/water content and receiving route stated. Exclude whole-bag/capture membership, no universal bag opening or clean polymer identity. Range evidence need: Actual pack composition/tare/residue native quantities, original-versus-added coverage and receiver required; no label mass as net sand or assumed clean recycling credit. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual separate pack with evidenced residues quantity/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: pack_waste_paper_pack; pack_waste_metal_pack; pack_waste_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: mixed_capture_waste
      applies_to: "original_bagged_quartz_sand_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Conditional actual spent cleanup/filter stream, including retained sand/water/fluid in measured whole-stream amount. Exclude separately transferred free fluid/whole bags/loose sand and direct emitted species. Range evidence need: Actual material input/event linkage, whole and retained-component native bases/source/sampletime and receiver treatment required; no SDS dust proportion or dry mass residual as captured waste. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual exclusive spent mixed-capture transfer quantity/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: free_contained_fluid
      applies_to: "original_bagged_quartz_sand_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only real separately collected liquid containing actual sand/components transferred to receiver. Not water retained in merchandise or absorbents, utility input, or direct environmental outfall; receiver treatment owned once. Range evidence need: Actual collection/receiver event, whole liquid mass or compatible density/temperature-volume conversion and solids/water scope required; no default wastewater per sand tonne. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual exclusive free contained liquid native quantity/N after compatible conversion” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
