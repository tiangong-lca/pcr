    - id: direct_species_release
      applies_to: "original_bagged_quartz_sand_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Conditional species/medium umbrella only on actual release evidence. Quartz phase/product fines/normalized oxide/odour/stock gap or captured dust is not automatic elemental Si, respirable quartz, water discharge or zero emission. Range evidence need: Actual species/particle definition, receiving medium, native measurement or applicable factor/activity/composition/fate scope and capture exclusion required; no ingredient/SDS/XRF fraction as emission factor. Measurement evidence: protocol cp_environment; original record basis Mass / kg. The original amount constraint “Actual measured species OR compatible activity*applicable_species_factor with necessary composition/fate only, then /N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
