  calculation_rules:
    - id: completed_count
      applies_to: "cp_sand"
      rule: "N=count_unique_final_owned_resold_B2B_acceptances_after_reversals with actual merchant ownership/resale/business buyer/final gate/source. N>0 before division. Open/rejected/reversed resources retain actual periods; stock carry not new acceptance."
      inputs:
        - "Ownership/buyer/final gate/reversal/time records"
      output: "Unique actual completed service denominator N"
      source_ids: []
    - id: wet_bag_components
      applies_to: "cp_sand"
      rule: "Actual whole_bag_gross_mass/net_as_received_sand_mass/bag_pack_tare and original pack membership. EACH compatible mass*actual_count once/TOTAL unchanged; component sums only exclusive native views. Stock/moisture residual is not proven sand loss or pollutant."
      inputs:
        - "Native bag/count/gross-net/tare and component records"
      output: "Compatible received sand and whole-pack mass views"
      source_ids: []
    - id: water_analysis_density
      applies_to: "cp_sand"
      rule: "dry_nonwater_mass=wet_sample_mass*(1-w_wet) only actual water/as-received wet mass fraction on same identified sample/component. Same-definition dry water/nonwater ratio w_wet=w_dry/(1+w_dry), actual percent_to_ratio_factor first. LOI containing other volatiles not water. oxide_result normalized by analysis_normalization_total is not absolute_component_quantity, quartz_phase_fraction or elemental Si; require independent analytical/mineral basis and composition_sum_basis, no default chemistry conversion. bulk_volume*bulk_packed_density only with compatible actual void/moisture/state; grain_true_density not bulk density."
      inputs:
        - "Same-sample water/LOI/oxide/mineral/particle/density native definitions and sources"
      output: "Separate compatible dry-nonwater, analytical and bulk-mass views; no inferred release"
      source_ids: []
    - id: original_source_demand
      applies_to: "cp_sand"
      rule: "Actual direct trace OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers with positive complete compatible all-terminal native records incl final closing/useful others/returns/proven loss, each unit/basis/method/state/time/source/link/owner. commodity_source_gate_demand=assigned_source_gate_quantity in original finished packed state including evidenced moisture/state-change share; not dispatch+discard. Same-original closing-opening pair carries carry_original_source_quantity/state/source/owner, not new source demand/N/two terminals. Native baseline_quantity/additional_stage_quantity/loss_adjustment_quantity and exclusive original stage/loss coverage outside once.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
      inputs:
        - "Original gate/direct or complete terminal drivers/carry/baseline/additional/loss ledger"
      output: "Assigned compatible original-source demand outside merchant service"
      source_ids: []
    - id: completed_source_integration
      applies_to: "cp_sand"
      rule: "Actually missing supplier-gate stages or additional original sand demand MUST be integrated outside this service exactly once before complete-chain use, with completed status/dataset-link/time/timezone/source/exclusive owner/integrated native quantity and matching stage/loss coverage/once evidence; a pending plan or recorded amount is insufficient."
      inputs:
        - "Actual missing stages/integrated quantity/completed link-time-source-owner and coverage"
      output: "Completed exclusive linked commodity integration before complete-chain use"
      source_ids: []
    - id: utility_share
      applies_to: "cp_utilities"
      rule: "documented_share=numerator_driver/denominator_driver with positive compatible all-consumer native basis. utility_per_service=sum(actual_utility_quantity*documented_share)/N after actual interval/conversion/provider exclusions; no supplier washing/drying or hypothetical ventilation load."
      inputs:
        - "Actual metered utility/interval/native share/conversion"
      output: "Actual utility per completed consignment"
      source_ids: []
    - id: net_supply_stock
      applies_to: "cp_supplies"
      rule: "S=opening+net_receipts-closing with retained_recovery reconciled, NET receipts exclude container tare. Gross S/N INPUT and separate paired unused_outward_return/N OUTPUT OR consumed (S-unused_outward_return)/N INPUT and OMIT matching return exchange. EACH count once/TOTAL unchanged, actual per_piece_mass/density/conversion and documented_share=numerator_driver/denominator_driver."
      inputs:
        - "NET supply stock/actual unused returns/native material conversions and shares"
      output: "Actual gross or consumed-only service supply with exclusive returns"
      source_ids: []
    - id: provider_share
      applies_to: "cp_provider"
      rule: "provider_per_service=sum(actual_native_package_quantity*physical_equivalence*documented_share)/N only where actual equivalence applies. documented_share=numerator_driver/denominator_driver positive native compatible basis; reconcile utilities/assets/freight/treatment once, no money conversion."
