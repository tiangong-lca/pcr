      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual independent original/new packaging with any retained grease/liquid measured within stream, not whole-kit packaging counted again. No presumed unpack/repack or clean recycling. Range evidence need: Need actual packing material/native net-tare/contamination content and receiver treatment, not difference between arbitrary published base/head shipping masses. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual exclusive packing receiver NET mass/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: pack_waste_paper_pack; pack_waste_metal_pack; pack_waste_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
