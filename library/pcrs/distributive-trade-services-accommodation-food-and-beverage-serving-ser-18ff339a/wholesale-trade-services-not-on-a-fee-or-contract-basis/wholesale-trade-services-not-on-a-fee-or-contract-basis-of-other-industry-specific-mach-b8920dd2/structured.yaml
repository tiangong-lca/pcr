    - id: qualified_manufacturer
      applies_to: "hobart-grinders; hobart-4822-f7515"
      requirement: "2023 manufacturer specification is a qualified example, detailed conditional cord/BOM/net-shipping evidence, no uniform numeric ratings/weights/life or NSF-UL/food-safety/use claim."
