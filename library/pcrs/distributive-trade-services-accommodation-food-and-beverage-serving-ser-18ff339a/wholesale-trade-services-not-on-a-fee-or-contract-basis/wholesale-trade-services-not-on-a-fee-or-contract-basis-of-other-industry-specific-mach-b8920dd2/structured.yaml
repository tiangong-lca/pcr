      applies_to: "commercial_grinder_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Real independent head/base/knife/plate/pan/cord or other part transfer with parent linkage, excluded from whole-machine membership; retained grease/finish inside that part not an extra full stream. No merchant disassembly assumed. Range evidence need: Need actual parent/part identity, material state—not all stainless—native quantity and retained content units/source/sampletime plus receiver, no standard part weights. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual exclusive separate part receiver NET mass/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: separate_part_waste_grinder_knife. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
