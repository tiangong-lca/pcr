      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | New complete benchtop electric commercial meat grinder/chopper with actual stainless housing and factory-grease-filled transmission, original supplier SKU/electrical variant/BOM/shipping assembly/pack, actual included head/pan/stomper/cord/accessories. |\n| starting_condition_role | Actual complete factory-release commodity for merchant add-on, not a base-only machine, raw steel/motor basket or commissioned/food-used appliance. |\n| product_classification_scope | CPC 3.0:61088 narrower commercial meat-grinder merchant service; actual goods44516 in445, not domestic kitchen appliance or full food-processing service. |\n| recursive_input_rule | Purchased/resold grinder/parts/inherited grease/pack and commercial returns are nonexchange merchandise stock/throughflow, not current warehouse assets, service lubricant/steel/motor consumption or another wholesale service. |\n| upstream_dataset_requirement |Link full actual materials, forming/finishes, motor/electrical-electronic content, gears/shaft/bearings, assembly, factory grease filling, release and original packing at actual complete SKU/shipping state, including all embodied lost commodity outside service once. Raw steel or motor alone inadequate. Actual original assigned demand, native conversion, baseline/additional stage/loss coverage and exclusive loss owner quantified before complete-chain use. Any actual missing stages and additional commodity demand MUST be integrated into the linked commodity system outside this service exactly once before complete-chain use; a record or pending plan is insufficient. Require completed integration status, actual integration dataset/link, timestamp/timezone, source and exclusive owner plus integrated quantity/native basis and coverage/once evidence. Incomplete or unverified integration blocks complete-chain use. |\n| disclosure | Actual electrical configuration/cord inclusion, materials/BOM/kit/attached-detached state, net complete versus base/head/pan/ship/tare scope, grease retained state, times/condition, ownership/final buyer gate, source all-exit demand/coverage and gaps. No universal weights, capacity, power, life or safety/food compliance claim. |\n\n### Boundary Rules\n\n| rule_id | Rule |\n| --- | --- |\n| merchant_scope | Actual document/pack/condition receipt, ordinary ambient hold/electric handling and final real B2B handover. No energizing/grinding/test, washing/sanitizing/sharpening, grease drain/refill, assembly/commissioning/repair/repack/use or humidity intervention prescribed; outsourced extras require reviewed extension. |\n| complete_commodity_outside | All actual finished machine/parts/grease/finish/pack upstream including embodied lost commodity remains outside service exchanges. Require quantified compatible original complete SKU demand and exclusive once-only native stage/loss coverage link before complete-chain use; actual merchant containment/receiver treatment once here. |\n| BOM_grease_gate | Stainless housing does not mean all-stainless; actual tinned/steel/plastic/rubber/cord/electrical variant and included-versus-optional attachments need records. Complete received kit may have expected detached parts, not missing. Factory grease is inherited contained commodity, neither new service supply nor default release; no whole/base/head/pan double counting. |\n| period_reject | Declare actual cohorts/stocks/meter/source/asset phases/timezones. Open/canceled/reversed/rejected lots retain resources and closing/returns/useful/actual-loss exits, not final N without eligible acceptance. Unknown stock, damage or seal changes are not automatically discard/loss/species/zero. |\n| fate_ownership | Whole machine/actual separate part/pack, mixed capture, free collected grease-fluid, contained hygiene liquid and direct species have exclusive memberships/native content records and actual receiver/medium evidence. Direct/provider/carrier/receiver utility/assets/freight/treatment owned once. Sold machine not warehouse asset; no default drain, metal recovery or avoided-production credit. |\n\n\n"
