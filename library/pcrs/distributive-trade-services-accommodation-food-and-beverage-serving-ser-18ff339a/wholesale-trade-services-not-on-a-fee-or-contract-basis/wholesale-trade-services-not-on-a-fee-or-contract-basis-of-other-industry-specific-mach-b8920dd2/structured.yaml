      requirement: "Obtain the independent handover record, actual material/composite state, quality acceptance and recipient for the specifically described recovered outlet in this record. Determine Product-versus-Waste from that real handover; do not presume a recovered-product identity or substitution credit. Conditional useful material transfer with actual grade/state/content/receiver and exclusivity. Collection alone is not recovery; no automatically avoided production or metal recycling credit. Range evidence need: Need actual material native mass/retained grease-fluid-finish constituents and receiver proof, separate from retained stock/whole discarded machine and waste streams. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual exclusive usable exported mass/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
