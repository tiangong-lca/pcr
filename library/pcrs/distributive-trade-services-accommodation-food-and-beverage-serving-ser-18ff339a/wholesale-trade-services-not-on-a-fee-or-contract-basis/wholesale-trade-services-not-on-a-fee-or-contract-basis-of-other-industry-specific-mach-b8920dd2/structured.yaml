    - id: electricity
      applies_to: "commercial_grinder_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Actual attributable warehouse/handling interval only. No energizing sold motor, meat grinding/testing, commissioning or nameplate power-times-duration assumption. Range evidence need: Need actual metered kWh interval, all-user native causal driver and idle/open resources/provider exclusions; no motor HP factor or power per machine. Measurement evidence: protocol cp_utilities; original record basis Energy / kWh. The original amount constraint “sum(actual_utility_quantity*documented_share)/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: site_water
      applies_to: "commercial_grinder_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Conditional real site-surface hygiene supply only, not grinder washing/sanitizing, meat preparation or consumer use. Range evidence need: Need actual supply/meter volume, hygiene event/period/conversion/all-user share and receiver coverage; no washwater from pan capacity. Measurement evidence: protocol cp_utilities; original record basis Volume / m3. The original amount constraint “actual compatible actual_utility_quantity converted to m3*documented_share/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: site_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: service_consumables
      applies_to: "commercial_grinder_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Actual agents/wipes/absorbents/filters only when used, NET material excluding container tare. Factory grease and inherited metal/finish/rubber/plastic/pack stay commodity, not service lubrication. Range evidence need: Need actual material identity/composition, net stock receipts, EACH/TOTAL count/per-piece mass or density and matched unused return; no grease/refill recipe or wipe ratio. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “selected actual gross or consumed NET service material mass/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: service_consumables_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: added_protection
      applies_to: "commercial_grinder_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Only actual new outer protection without assumed opening/repack or mounting parts. Inherited original packs remain commodity; real reusable merchant supports full-life assets. Range evidence need: Need actual material/net supply quantity EACHTOTAL and return/reuse owner; no new box per base/head/pan or default wrapping weight. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “selected actual gross or consumed NET protection mass/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_package
      applies_to: "commercial_grinder_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Actual warehouse/handling service physical quantity and clear coverage, no hidden energizing/test/grind/clean/sharpen/refill/commission service. Range evidence need: Need actual provider equivalent/operation/time/native numerator-denominator share and utility/assets/freight/treatment exclusions, not fee or grinder throughput. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “sum(actual_native_package_quantity*documented_share)/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_provider; actual source-linked native records"
    - id: service_assets
      applies_to: "commercial_grinder_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Actual building/racks/handlers/reusable supports separate from the resold grinder, across full manufacture/maintenance/replacement/retirement/EOL and all users/periods. Range evidence need: Need actual asset scope/job/observed all-user and sourced remaining native drivers/equivalence/uncertainty; product warranty or sealed grease does not set infrastructure life. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “sum_full_asset_equivalents(job_driver/lifetime_all_user_driver)/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
