  calculation_rules:
    - id: completed_count
      applies_to: "cp_grinders"
      rule: "N=count_unique_final_owned_resold_B2B_acceptances_after_reversals, actual merchant ownership/resale and business buyer/final gate/source/reversal evidence. N>0 before normalization. Resources for canceled/open/rejected/reversed consignments persist in actual periods/cohorts, not invented acceptances."
      inputs:
        - "Actual ownership/buyer/final acceptance/reversal/time records"
      output: "Unique completed service denominator N"
      source_ids: []
    - id: complete_machine_mass
      applies_to: "cp_grinders"
      rule: "Prefer actual measured net_complete_machine_mass. A sum base_net_mass+head_net_mass+pan_net_mass+accessory_mass requires same actual model/configuration/shipping state and exclusive included leaf membership, not parts already included in another whole; quantities/counts/native units sourced. Shipping mass not net, and published base/head/pan values not universal kit weights. Cord inclusion and expected detached kit follow actual voltage/BOM evidence, not automatic missing parts."
      inputs:
        - "Actual SKU/BOM/electrical/shipping state and native whole/part/net-ship-pack measurements"
      output: "Audited complete kit and exclusive component mass/packing"
      source_ids: []
    - id: retained_factory_grease
      applies_to: "cp_grinders; cp_outlets"
      rule: "factory_grease_quantity remains within linked original commodity and actual retained machine/part contents. Do not add it as service lubricant, subtract it from unrelated service supply, or infer leaked mass from changed seal/stock. Whole-stream component views are nonadditive. Actual collected free grease-fluid is distinct from retained/captured/hygiene liquid, with own native quantity/unit/basis/method/state/source/sampletime and compatible density/temperature conversion only if needed."
      inputs:
        - "Actual factory-fill provenance/quantity"
        - "retained memberships and independent collection/receiver evidence"
      output: "Exclusive retained versus actual free/captured grease-fluid audit"
      source_ids: []
    - id: source_gate_demand
      applies_to: "cp_grinders"
      rule: "Actual direct source trace OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers with positive complete compatible all-terminal native records inclclosing/useful-other/returns/actual loss. commodity_source_gate_demand=assigned_source_gate_quantity in complete original SKU/grease/shipping/pack gate including evidenced state-change share, not final shipped mass+discard. Reconcile original input/exclusive exits, baseline_quantity/additional_stage_quantity/loss_adjustment_quantity, native conversion and actual missing stage/loss coverage owner once outside service. Unknowns block complete-chain readiness, not zero. Any actual missing stages and additional commodity demand MUST be integrated into the linked commodity system outside this service exactly once before complete-chain use; a record or pending plan is insufficient. Require completed integration status, actual integration dataset/link, timestamp/timezone, source and exclusive owner plus integrated quantity/native basis and coverage/once evidence. Incomplete or unverified integration blocks complete-chain use.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
      inputs:
        - "Direct trace or complete all-terminal drivers/native source-gate-baseline-additional-loss evidence"
      output: "Quantified linked complete original commodity demand/loss outside once"
      source_ids: []
    - id: utility_allocation
      applies_to: "cp_utilities"
      rule: "documented_share=numerator_driver/denominator_driver, positive denominator and compatible native causal units over all users. utility_per_service=sum(actual_utility_quantity*documented_share)/N after native conversion and interval/coverage reconciliation. No motor nameplate/throughput-times-use or washing/test demand."
      inputs:
        - "Native meter quantities/intervals/conversions and each actual numerator/denominator driver"
      output: "Actual attributable kWh and conditional water m3 per service"
      source_ids: []
    - id: net_supply_stocks
      applies_to: "cp_supplies"
      rule: "S=opening+net_receipts-closing including retained recovery; net_receipts is actual material NET excluding supply-container tare. Gross S/N plus paired unused outward output OR consumed (S-usable_outward_return)/N and OMIT matching return exchange. EACH compatible count once/TOTAL unchanged, sourced per-piece/density-temperature conversion and documented_share=numerator_driver/denominator_driver only on matching positive driver basis. No inherited grease/parts credit."
      inputs:
        - "Actual net material stocks/EACH-TOTAL/conversion and matching return/share drivers"
      output: "Exclusive actual supply input/return convention"
      source_ids: []
    - id: provider_package_share
      applies_to: "cp_provider"
      rule: "provider_per_service=sum(actual_native_package_quantity*documented_share)/N, actual physical_equivalence and disjoint covered operations/resources. documented_share=numerator_driver/denominator_driver with native unit/basis/method/state/source/time and positive compatible denominator. Neither fee nor rated meat throughput is equivalent evidence."
      inputs:
        - "Actual package/equivalence/native driver quantities and full coverage matrix"
      output: "Actual disjoint provider physical service"
      source_ids: []
    - id: asset_lifetime_share
      applies_to: "cp_assets"
      rule: "lifetime_all_user_driver=observed_all_user_driver+remaining_driver only after compatible native equivalence and sourced remainder. Apply job_driver/lifetime_all_user_driver to complete manufacture/maintenance/replacement/retirement/EOL, all users/periods, uncertainty/sensitivity/update; sum then /N once. Actual provider/carrier covered asset excluded; traded grinder/product warranty not current asset or its life."
      inputs:
        - "Actual full-life events/job-observed-remaining-lifetime driver/native equivalence"
      output: "Actual all-user complete-life service asset equivalents"
      source_ids: []
    - id: unique_freight_sum
      applies_to: "cp_freight"
      rule: "Cargo retains actual complete SKU/kit/grease/parts/accessories/pack/carried supports once. Compatible EACH mass*actual_count once or TOTAL unchanged, subtract only actual noncargo carrier tare. Convert native payload/distance to actual_transport_work, documented_service_share=numerator_driver/denominator_driver each native/compatible/positive. freight_per_service=sum_unique_load_leg(actual_transport_work*documented_service_share)/N, each share INSIDE SUM then N once; empty/provider/receiver scope disjoint."
      inputs:
        - "Actual unique load-leg cargo/each-total/count/tare/distance/work/conversion and native share drivers"
      output: "Actual packed freight t*km per service"
      source_ids: []
    - id: actual_receiver_outlets
      applies_to: "cp_outlets"
      rule: "outlet_per_service=actual_compatible_native_transfer_quantity/N with supported EACH/TOTAL/net-tare/density conversion. Whole machine includes retained grease/finish/parts; independent actual parts/pack/mixed capture/free collected grease-fluid/hygiene liquid and explanatory constituents are exclusive. Retained stock not external export; consumed-only supplies omit paired return exchange. Actual receiver classification/transport/treatment one owner, no default drain/recycling/substitution credit."
      inputs:
        - "Actual transfer/native content/membership/parent/receiver/treatment records"
      output: "Exclusive actual product/waste transfers with retained content"
      source_ids: []
    - id: actual_species_release
      applies_to: "cp_environment"
      rule: "release_mass=measured_species_mass OR compatible activity*applicable_species_factor with only composition/release_fraction required by that factor. Complete species factor already covering proportions must not multiply them again. Actual medium/native units/method/source/sample state/time and captured/contained exclusions, then /N once. No grease presence/odour/metal-tin finish/unknown seal-stock or motor-use factor default."
      inputs:
        - "Actual independent species/medium measured quantity or justified native factor chain"
      output: "Actual exclusive species release per service"
      source_ids: []
