    - id: freight
      applies_to: "commercial_grinder_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Actual shipped SKU/kit net+pack/support, including only real supplied head/pan/cord/accessories and retained grease once. Machine parts already in whole-kit mass are not extra cargo mass. Range evidence need: Need actual model/configuration/assembly whole-vs-base-head-pan net/ship/pack coverage, packed load EACH/TOTAL count, noncargo tare/distance/conversion and each-record share/empty coverage. Measurement evidence: protocol cp_freight; original record basis Mass * Length / t*km. The original amount constraint “sum_unique_load_leg(actual_transport_work*documented_service_share)/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: unused_supply_return
      applies_to: "commercial_grinder_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only real unused service material export paired with same NET supply stock under gross input convention. Consumed-only input omits this return exchange. Factory grease/whole-machine returns are merchandise audit, not service-stock deduction. Range evidence need: Need actual supply identity/native NET mass/usability/receiver/transfer and nonclosing pairing, no inherited grease or parts against unrelated supply. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual matched NET unused outward mass/N under gross convention only” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: unused_supply_return_detergent_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
