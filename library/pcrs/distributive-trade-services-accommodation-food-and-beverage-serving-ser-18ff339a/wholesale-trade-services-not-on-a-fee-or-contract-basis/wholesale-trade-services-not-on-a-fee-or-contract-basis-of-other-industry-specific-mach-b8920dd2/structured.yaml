      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Rule |\n| --- | --- |\n| causal_resource_assignment | Use real event-to-consignment trace, else supported physical handling/space-time causal drivers over all consumers/periods including idle/open/reject. Each documented_share=numerator_driver/denominator_driver on compatible native driver basis; denominator positive. No default machine count, nameplate power, throughput or sales value allocation. |\n| original_source_assignment | Outside service actual direct source trace OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers only from positive complete compatible all-terminal records including closing/returns/useful other exits/actual loss, each native quantity/unit/basis/method/state/source/link/owner. commodity_source_gate_demand=assigned_source_gate_quantity at original complete SKU/BOM/grease/shipping/pack gate including evidenced state-change share. Final dispatch+discard is not source demand. Native baseline/additional/loss quantities, missing actual stages, conversion and exclusive coverage owner once; unknown loss not zero. Any actual missing stages and additional commodity demand MUST be integrated into the linked commodity system outside this service exactly once before complete-chain use; a record or pending plan is insufficient. Require completed integration status, actual integration dataset/link, timestamp/timezone, source and exclusive owner plus integrated quantity/native basis and coverage/once evidence. Incomplete or unverified integration blocks complete-chain use.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value. |\n| net_supply_return | S=opening+net_receipts-closing including retained recovery, each material NET excluding container tare. Gross S/N plus separately recorded matched usable unused outward output OR consumed-only (S-usable_outward_return)/N and OMIT matching return exchange. Only same-scope standalone supply, never inherited factory grease/machine/parts/pack or unrelated stock and no second credit. |\n| asset_full_lifetime | Complete manufacture/maintenance/replacement/retirement/EOL with compatible job_driver/lifetime_all_user_driver; lifetime combines observed all-user use+sourced remaining service, every user/period and native equivalence, uncertainty/sensitivity/update. Single provider/carrier owner, sum then /N once. Traded machine and product warranty not infrastructure asset/life. |\n| freight_and_receiver | Each unique load+leg its documented_service_share=numerator_driver/denominator_driver inside SUM then /N once. Retain actual packed SKU/components/grease/accessory/support membership, compatible EACH times count once or TOTAL unchanged, only noncargo carrier tare subtracted. Actual whole/part/grease/capture/liquid views and receiver transport/treatment exclusive once, no automatic credit. |\n\n\n"
