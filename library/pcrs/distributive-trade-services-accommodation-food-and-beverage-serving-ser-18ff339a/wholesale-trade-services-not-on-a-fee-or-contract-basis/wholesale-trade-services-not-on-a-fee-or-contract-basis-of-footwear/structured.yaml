  calculation_rules:
    - id: normalize
      applies_to: "all service rows"
      rule: "Assign actual direct event and evidenced all-user share, retaining failed/unfinished/idle burdens, then divide attributed total by positive accepted N once."
      inputs:
        - cp_consignment
        - cp_energy
        - cp_supplies
        - cp_assets
        - cp_providers
        - cp_freight
        - cp_fates
        - cp_releases
      output: "Actual per-reference inventory"
      source_ids: []
    - id: stock_pair_state
      applies_to: "merchandise"
      rule: "Reconcile compatible pair/single/box inventories separately: opening+external receipts+buyer returns-closing-physical dispatch-supplier returns-useful other exits-actual discard-net sample removal=unexplained residual. Link actual left/right matching and fragments, net shoe/pack/moisture/state measurements with uncertainty. Do not turn one unmatched single or mass residual into a whole discarded pair, age loss or species release."
      inputs:
        - cp_shoes
      output: "Audited actual counts/state/fates"
      source_ids: []
    - id: gate_demand
      applies_to: "merchandise interface"
      rule: "At complete original boxed-shoe gate, map actual accepted-demand and allocated proven discard/state-change demand plus exclusive closing/useful return/other-exit shares to source quantities in original state/unit. Actual component/single-to-original-pair method and conversions need sourced non-overlap allocation. Link only additional required demand not identically covered by baseline stage/loss outside service once; missing assembly/boxing beyond leather/PU predecessor is assembled outside."
      inputs:
        - cp_shoes
        - cp_consignment
      output: "Explicit separately linked original finished-gate demand"
      source_ids: []
    - id: cargo_freight
      applies_to: "freight"
      rule: "Actual kg*km=actual included footwear/pack/tare cargo converted to kg×actual distance converted to km, using explicit factors/bases/sources and non-overlapping shared/provider coverage. Other native units retain matching dataset support."
      inputs:
        - cp_freight
      output: "Actual native freight per reference"
      source_ids: []
    - id: species_method
      applies_to: "direct_species"
      rule: "Use actual species/medium measurement or compatible actual activity/burn and source-specific factor, retaining composition/fate/native concentration or pressure/temperature gas conversions only where needed once. Complete factors are not multiplied again; hydrolysis observation, absorbed moisture and unknown stock deficit give no emission amount."
      inputs:
        - cp_releases
        - cp_shoes
        - cp_energy
      output: "Actual evidenced species per reference"
      source_ids: []
  data_quality_requirements:
    - id: actual_identity
      applies_to: "all exchanges"
      requirement: "Resolve actual shoe/service/material/chemical/receiver identity and native property support before final exchanges; Count support alone is neither shoe nor merchant service identity."
      evidence: "Actual detail/foreground and reference support chain"
    - id: material_history
      applies_to: "actual PU shoe/pack audit"
      requirement: "Verify actual PU sole component, new state, left/right/style/size/box mapping, manufacture/component/prior history and applicable supplier/buyer quality criteria. Do not generalize consumer case ages to material shelf-life or force tests."
      evidence: "cp_consignment; cp_shoes; satra-footwear-failures"
    - id: moisture_fates
      applies_to: "merchandise and cleanup"
      requirement: "Keep actual component moisture/sample/method/basis/time/temp/humidity and package/condensate/state uncertainty, separate useful exits/whole-pack waste/mixed cleanup/free liquid/species with measured receiver coverage."
      evidence: "cp_shoes; cp_supplies; cp_fates; satra-cartons-moisture"
    - id: coverage_life
      applies_to: "all service scope"
      requirement: "Match complete finished original-gate stages and actual assigned demand/baseline loss outside, all asset phases/consumers/periods and direct/provider treatment/freight once; disclose unknowns and independent range gaps."
      evidence: "Scope matrix and full-life/actual quantitative evidence"
    - id: electricity
      applies_to: "shoe_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Measure actual lighting, powered handling and performed inspection/business support. The service does not manufacture shoes, operate wear testing by default or create a dedicated conditioning process from ambient holding. Range evidence need: Need real meters/intervals and all shoe-lot/user attribution including failed/idle jobs; no standard kWh per pair or fixed storage age. Measurement evidence: protocol cp_energy; original record basis Energy / kWh. The original amount constraint “Actual attributed native quantity from cp_energy, converted only on compatible evidence, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_energy; actual source-linked native records"
    - id: facility_water
      applies_to: "shoe_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Record actual warehouse sanitation and real analytical-support water only when used. Inherited leather, box or air moisture is a state audit, not new cleaning water or a shoe-washing step. Range evidence need: Need actual meter/issue purpose, quantity and supplier boundary; moisture condensation or all received wastewater cannot quantify this supply. Measurement evidence: protocol cp_supplies; original record basis Volume / m3. The original amount constraint “Actual attributed native quantity from cp_supplies, converted only on compatible evidence, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: facility_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: new_outer_protection
      applies_to: "shoe_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Use real extra outer carton/film/straps/labels only as actually added. Manufacturer shoe boxes, tissue, spacers and any inherited sachets belong to complete commodity state; no automatic new packing or moisture-control treatment is prescribed. Range evidence need: Need inherited/new level, actual SKU/count/area/mass and conversion evidence; reusable pallets use their full life and box age/damage does not prove new supply. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed native quantity from cp_supplies, converted only on compatible evidence, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: new_outer_protection_pe_film; new_outer_protection_paperboard_carton. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: operating_supplies
      applies_to: "shoe_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand real cleaners, lubricants, wipes, absorbents, filters and sample consumables with native formulation/state and actual fates. No default polish, biocide, desiccant, leather treatment or repair adhesive is introduced; an actual changed treatment needs scope review. Range evidence need: Need actual stock/net receipts, concentration/composition and dry-cleanup material plus absorbed-liquid/fragment basis. A chemical mentioned in inherited PU/leather or an SDS is not a purchased service input or emitted species. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed native quantity from cp_supplies, converted only on compatible evidence, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: operating_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: fuel_supply
      applies_to: "shoe_wholesale"
      requirement: "Which purchased fuel grade/formulation and supply gate are on the stock record? Identify any fuel other than the named diesel case and its native unit; obtain actual density before a volume-to-mass conversion. Keep actual grade/native supplied stock separately from actual burn/nonburned fates; do not duplicate a complete hired transport or handling package. Range evidence need: Need opening/net receipts/closing/usable returns, actual burn and nonburned waste/loss records with conversions/density/temperature where used; purchase quantity is no burn default. Measurement evidence: protocol cp_supplies; original record basis Volume / L. The original amount constraint “Actual attributed native quantity from cp_supplies, converted only on compatible evidence, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: fuel_supply_diesel_supply. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_services
      applies_to: "shoe_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Expand completed real storage/handling/inspection/testing/hygiene/maintenance and business support in matching native units. Manufacturer certificates or a public SATRA article do not prove another performed destructive test. Only representative non-wear measurements or laboratory material specimens belong to this sampling role; no wear/use or product-treatment route is included. Range evidence need: Need actual physical result/unit/sample scope and materials/energy/assets/freight/treatment responsibility; no number of shoes tested or test-life factor is fixed. Measurement evidence: protocol cp_providers; original record basis Count / Item(s). The original amount constraint “Actual attributed native quantity from cp_providers, converted only on compatible evidence, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_providers; actual source-linked native records"
    - id: shared_assets
      applies_to: "shoe_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Attribute actual building/racks/lifts/meters/ICT and reusable pallet/container service over all real consumers and periods, including full maintenance/replacement/end-of-life. Range evidence need: Need manufacture, compatible used/lifetime driver units, observed history plus sourced remaining use/termination, uncertainty and sensitivity; no full new pallet per trip or universal asset life. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual attributed native quantity from cp_assets, converted only on compatible evidence, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "shoe_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Record actual transported shoes/boxes/tissue/spacers/cartons/pallet scope and real legs, not only net shoes or number of pairs. Retain actual supplier-delivered gate, return and empty/shared journey ownership. Range evidence need: Need actual cargo/tare and leg distance, conversion factors/bases/sources and all-user share/provider coverage; no nominal kg-per-pair or fixed carton capacity. Measurement evidence: protocol cp_freight; original record basis Mass*distance / kg*km. The original amount constraint “Actual attributed native quantity from cp_freight, converted only on compatible evidence, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: environmental_water
      applies_to: "shoe_wholesale"
      requirement: "Identify the actual abstraction point, water body/aquifer, location and measured source volume from intake permits/meter records. Surface water and groundwater require distinct source identities; no direct withdrawal is established by purchased water use. Include only measured direct extraction with source/location and purpose. Atmospheric moisture held by shoes or packaging does not establish an environmental service intake. Range evidence need: Need actual source meter/interval and withdrawal boundary; purchased water remains Product and no formula converts leather moisture or shoe counts to water supply. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual attributed native quantity from cp_fates, converted only on compatible evidence, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: usable_supply_returns
      applies_to: "shoe_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Use only a real external transfer matching the same standalone operating SKU/state. Under consumed-only input OMIT this matched return exchange; retained recovery stays closing and commercial shoes/boxes remain non-exchange stock audit. Range evidence need: Need real recipient/native quantity and input provenance; no unrelated/negative supply netting, stock-as-return or automatic avoided-production credit. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed native quantity from cp_supplies, converted only on compatible evidence, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_supply_returns_detergent_return; usable_supply_returns_pe_film_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: discarded_shoe_packs
      applies_to: "shoe_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Track actual receiver quantities/composition for discarded whole boxes, single shoes, parts/fragments or performed-test samples. A received mixed whole-pack waste and its shoe/PU/leather/box component audit cannot create duplicate waste or manufacture here. Range evidence need: Need actual fate/recipient/native mass and net/tare/component basis with treatment coverage and original-gate equivalence; missing partner, age or apparent crumbling alone is not whole-pair discarded mass or chemical release. Measurement evidence: protocol cp_shoes; original record basis Mass / kg. The original amount constraint “Actual attributed native quantity from cp_shoes, converted only on compatible evidence, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: discarded_shoe_packs_atomic_case; discarded_shoe_packs_single_shoe. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_shoes; actual source-linked native records"
    - id: other_wastes
      applies_to: "shoe_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Record actual used wipes/absorbents/filters, maintenance residues and new outer protection by receiver/native state. Mixed cleanup may include dry carrier plus collected moisture/fragment/chemical; component views are non-additive and do not duplicate discarded-shoe or contained-liquid waste. Range evidence need: Need received wet/dry mixed quantity, carrier/absorbed component composition/basis and receiver treatment; receipt of a wipe or visible residue does not establish spent quantity, and no recycling credit is automatic. Measurement evidence: protocol cp_fates; original record basis Mass / kg. The original amount constraint “Actual attributed native quantity from cp_fates, converted only on compatible evidence, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: other_wastes_spent_wipe. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: contained_wastewater
      applies_to: "shoe_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Record only actual free liquid transferred to treatment from performed sanitation/testing, distinct from moisture retained in shoes/boxes or absorbed in spent solid cleanup material. No routine shoe washing or PU treatment is assumed. Range evidence need: Need collected/received volume/composition/interval and treatment owner; shoe moisture, supply water and wet wipe mass do not substitute for this volume or a direct outfall. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual attributed native quantity from cp_fates, converted only on compatible evidence, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: water_outfalls
      applies_to: "shoe_wholesale"
      requirement: "Identify the direct outfall and receiving water/soil compartment, measured water amount and independently analysed pollutant species. A sewer transfer to treatment is not this outfall; the missing receiving compartment prevents a concrete elementary-flow selection. Only actual water crossing a direct environmental outfall is this flow; collected free liquid sent to treatment is Waste and absorbed cleanup is its measured solid waste view. Range evidence need: Need real outfall/location/native volume and composition/receiving medium; condensation inside a shoebox is internal state, not proof of discharge. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual attributed native quantity from cp_fates, converted only on compatible evidence, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: direct_species
      applies_to: "shoe_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Expand actual source/chemical/particle-size/medium only from measurement or an applicable method. PU deterioration, leather/box moisture change or product staining is not automatically CO2, VOC, microplastic, water vapour or another emitted species. Range evidence need: Need real source/interval/species and medium, compatible activity/burn/factor/composition/fate plus required native gas/volume/concentration conversions. Age anecdotes, material hazard or unknown stock deficit supply no emission factor or fixed UUID. Measurement evidence: protocol cp_releases; original record basis Mass / kg. The original amount constraint “Actual attributed native quantity from cp_releases, converted only on compatible evidence, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_releases; actual source-linked native records"
validation_rules:
  - rule_id: accepted_gate
    applies_to: "accepted_service"
    rule: "Verify actual own-account final accepted commercial N>0 and all matching/material/quantity/history/condition qualifiers; shoes/pairs/boxes are not service count."
    source_ids: []
  - rule_id: material_time
    applies_to: "merchandise"
    rule: "Check evidenced PU identity and sole-component date/history through actual storage interval; no universal shelf-life from cases, no moisture/age residue-to-species/discard rule."
    source_ids:
      - satra-footwear-failures
  - rule_id: state_exits
    applies_to: "shoe_wholesale"
    rule: "Require actual mismatched/missing/sampled/damaged/rejected/useful-return/downgrade/discard receiver paths and burden retention; do not silently introduce repair/re-soling/treatment/use."
    source_ids: []
  - rule_id: finished_source
    applies_to: "merchandise interface"
    rule: "Reconcile complete originally boxed source stages, original-unit/state/conversion and partial-pair exclusive assignments, actual demand/loss/closing/useful exits and identical baseline coverage once outside."
    source_ids: []
  - rule_id: lifespan_coverage
    applies_to: "all service resources"
    rule: "All users/events/periods and complete asset stages require compatible used/lifetime drivers, observed+sourced remaining/termination and one provider/asset/per-N view; failed/incomplete jobs do not disappear."
    source_ids: []
  - rule_id: nonadditive_views
    applies_to: "all actual inventory"
    rule: "Verify measured native supply/fates and original-owner scope; consumed-only omits matched return. Mixed whole pack/components/spent carrier absorbed contents/free liquid/outfall/species must not overlap or produce automatic avoided credits."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity/completeness review"
  downstream_use: "Physical boxed leather-upper PU-component shoe wholesale add-on linked separately to complete originally boxed commodity and actual assigned demand/loss"
  allowed_use: "Actual new original-box non-sports leather-upper shoe consignment with evidenced PU sole component, matching pair/size/history/condition and business-buyer acceptance"
  excluded_use: "Standalone shoe footprint; generic all-material footwear aging or fixed shelf life; manufacturing/repair/treatment/wear; test compliance recipe; retail/agency/storage-only"
  required_metadata: "Actual SKU/style/size system/colour/left-right/pair/single/box/material/PU component/net/tare/moisture/date/prior history/condition/acceptance; site/lot/period; complete original gate demand/loss and every service/asset/provider/freight/treatment owner"
  required_quality_disclosure: "Flow/support and prior-history gaps, component/moisture/sample/state uncertainty, mismatches/unknown stock/source-demand/receiver coverage, all-user lifetime assumptions and independent range limitations"
  update_trigger: "Changed upper/sole component/presentation/history/condition/acceptance, repair/treatment/preservation operation, source-stage/loss coverage, measurement/test/provider/asset/freight/treatment scope"
data_sources:
  - id: "unsd-cpc3-shoe-wholesale"
    type: "official_guidance"
    reference: "UNSD CPC3 explanatory notes (30 June2025), printed page302,61034/group293. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification only: selected narrower new non-sports leather-upper boxed footwear merchant service."
  - id: "satra-cartons-moisture"
    type: "official_guidance"
    reference: "SATRA, Assessing cartons and cardboard boxes, February2018 public technical article. https://www.satra.com/bulletin/article.php?id=2024"
    used_for: "Qualitative footwear/packaging moisture/condensation and actual material/pack-state distinctions only; no test/stacking/legal threshold or universal countermeasure adopted."
  - id: "satra-footwear-failures"
    type: "official_guidance"
    reference: "SATRA, Learning from footwear failures – part1,2021 public technical article, cases5/6. https://www.satra.com/bulletin/article.php?id=2760"
    used_for: "Actual PU-specific moisture/time and whole post-component-manufacture history context; anecdotes are not numerical shelf-life, forced test, loss or chemical-emission factors."
