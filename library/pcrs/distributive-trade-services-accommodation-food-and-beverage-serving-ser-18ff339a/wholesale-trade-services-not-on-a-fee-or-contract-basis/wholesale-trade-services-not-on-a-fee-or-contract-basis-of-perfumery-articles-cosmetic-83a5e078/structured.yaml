  calculation_rules:
    - id: completed_count
      applies_to: "cp_shampoo"
      rule: "N=count_unique_final_owned_resold_B2B_acceptances_after_reversals. Match actual merchant ownership, business buyer and acceptance gate/source; N>0 before division. Carry open/canceled/rejected/reversed resources to actual cohorts/periods without inventing completed service."
      inputs:
        - "merchant and buyer identities"
        - "acceptance/reversal IDs"
        - dates
      output: "Final unique completed-service denominator N"
      source_ids: []
    - id: liquid_and_pack_basis
      applies_to: "cp_shampoo"
      rule: "net_shampoo_mass=net_shampoo_volume*density only for actual compatible liquid volume, formulation, temperature and units. Foam or nominal bottle capacity is not liquid fill; gross-to-net requires actual bottle/closure/label/pump tare and independently evidenced headspace contents, not assumed zero. Mass and volume ingredient fractions are not interchangeable."
      inputs:
        - "native volume/density/temperature/conversion and pack records"
      output: "Compatible actual liquid net mass and separate packaging/headspace state"
      source_ids: []
    - id: water_and_dry_basis
      applies_to: "cp_shampoo"
      rule: "Only if required and evidenced: dry_matter_mass=wet_mass*(1-w_wet), where w_wet is actual water/as-received wet mass fraction, not volume solids or loss-on-drying containing other volatiles. Compatible same-sample dry-basis water/nonwater ratio converts w_wet=w_dry/(1+w_dry), after actual percent-to-ratio conversion. Ingredient list gives no fraction. Do not infer pollutant or lost dry product from moisture change."
      inputs:
        - "actual water definition"
        - "native wet/dry sample units/method/state/source/time"
      output: "Qualified water and nonwater mass views, no invented composition"
      source_ids: []
    - id: commodity_source
      applies_to: "cp_shampoo"
      rule: "Use direct_assignment_quantity with actual source links OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers with complete positive all-terminal records. commodity_source_gate_demand=assigned_source_gate_quantity in compatible original formulated-filled-closed-pack state, not final mass+discard. Reconcile original input, closing/returns/useful others/actual loss, state changes and exclusive source use. Quantify baseline_quantity/additional_stage_quantity/loss_adjustment_quantity with conversion, owner, stage/loss coverage once outside service. Unknown gaps block complete-chain readiness.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
      inputs:
        - "direct links OR complete native source/terminal records"
        - "baseline/additional/loss records"
      output: "Auditable linked original commodity demand and one loss owner outside service"
      source_ids: []
    - id: utilities
      applies_to: "cp_utilities"
      rule: "utility_per_service=sum(actual_utility_quantity*documented_share)/N after native conversion and complete all-consumer driver reconciliation. Metered service water is not shampoo water; no consumer-use or climate-control default.  Use the actual documented share of each interval record. A directly measured quantity belonging exclusively to this target cohort may use share=1 only with scope evidence; an already attributed quantity is not multiplied by a share again. Record utility_quantity_scope_raw_or_attributed and its source; reconcile compatible numerator/denominator units, complete all-consumer scope and share basis."
      inputs:
        - "native intervals"
        - "utility quantity/conversion"
        - "all-consumer share"
      output: "Actual attributed kWh and m3 per service"
      source_ids: []
    - id: supplies
      applies_to: "cp_supplies"
      rule: "S=opening+net_receipts-closing including retained recovery. gross_input=S/N with separate paired unused outward output OR consumed_input=(S-usable_outward_return)/N and OMIT matching return exchange. Convert EACH*actual_count once or actual mass/compatible density; no unrelated stock netting or second credit."
      inputs:
        - "same-scope opening/receipts/closing/recovery/returns"
        - "actual units and conversions"
      output: "Actual consumed or gross supplied material and mutually exclusive return"
      source_ids: []
    - id: provider_package
      applies_to: "cp_provider"
      rule: "actual_package_per_service=sum(actual_native_package_quantity*documented_share)/N using physical equivalence and disjoint utility/assets/freight/treatment coverage; no monetary or bottle-count shortcut."
      inputs:
        - "actual contract operation"
        - "native package and coverage"
      output: "Actual scoped provider share per service"
      source_ids: []
    - id: asset_equivalents
      applies_to: "cp_assets"
      rule: "lifetime_all_user_driver=observed_all_user_driver+remaining_driver only after compatible native-unit/equivalence reconciliation. full_asset_share=job_driver/lifetime_all_user_driver. Apply to full manufacture, maintenance, replacement and EOL; sum then /N once. Include all consumers/periods and sourced remaining-life uncertainty/sensitivity/update."
      inputs:
        - "asset events and job/observed/remaining/lifetime/equivalence units and sources"
      output: "Full-life service asset equivalents"
      source_ids: []
    - id: freight_work
      applies_to: "cp_freight"
      rule: "Cargo mass is actual packed TOTAL or compatible EACH*actual_count once, including liquid/bottle/closure/actual pump/headspace/pack/carried support; subtract only actual noncargo vehicle/container tare. Convert to t and km from native records. freight_per_service=sum_unique_load_leg(actual_transport_work*documented_service_share)/N; each record share inside SUM and N once, with empty/receiver/provider coverage disjoint."
      inputs:
        - "unique load+leg native packed masses/counts/distance/conversions and share"
      output: "Actual scoped t*km per service"
      source_ids: []
    - id: exclusive_outlets
      applies_to: "cp_outlets"
      rule: "outlet_per_service=actual_compatible_native_transfer_quantity/N with matched receiver classification. Whole bottle includes retained contents; portions retained in whole, separate pack, absorbed solids, free collected shampoo and hygiene liquid are nonadditive. Each component/retained water/fluid has independent native unit/basis/method/state/source/sample time. Retained stock is not export; consumed-only supply convention omits paired return. Receiver transport/treatment once and no automatic credit."
      inputs:
        - "actual transfer native quantity/conversions"
        - "component membership and receiver"
      output: "Exclusive actual product/waste exits with receiver ownership"
      source_ids: []
    - id: species_release
      applies_to: "cp_environment"
      rule: "release_mass=measured_species_mass OR compatible activity*applicable_species_factor with composition and release_fraction only where that factor requires them. A complete species factor already covering those fractions must not multiply them again. Convert native units then /N once; retain actual medium, captured/contained exclusion and owner. No fragrance/ingredient/stockgap/foam-to-VOC-COD assumption or zero."
      inputs:
        - "actual species/medium"
        - "native measurement or justified factor chain"
      output: "Actual exclusive species mass released per service"
      source_ids: []
