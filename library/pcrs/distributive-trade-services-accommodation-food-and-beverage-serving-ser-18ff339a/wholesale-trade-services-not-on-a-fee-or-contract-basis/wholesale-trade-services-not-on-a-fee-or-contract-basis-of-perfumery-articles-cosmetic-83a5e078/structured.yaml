allocation_rules:
  - rule_id: physical_attribution
    applies_to: "foreground_burden_allocation"
    rule: "Direct-assign actual events to consignments when traceable; otherwise use documented physical handling, occupied-space-time or other causal native drivers across every consumer/cohort/period. No bottle-count, sales margin or liquid-mass allocation without actual equivalence evidence."
    source_ids: []
  - rule_id: source_gate_assignment
    applies_to: "foreground_burden_allocation"
    rule: "Outside service, direct actual source-to-target trace is preferred. Otherwise assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers, only with positive complete compatible all-terminal drivers including closing, returns, useful other exits and actual loss, each quantity/unit/basis/method/state/source/link/owner. commodity_source_gate_demand=assigned_source_gate_quantity in original released state, including evidenced ordinary state-change share; final shipped mass plus discard is not a substitute. Record native baseline/additional quantity, conversion, missing stages, loss owner and existing coverage once.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: supply_return_convention
    applies_to: "foreground_burden_allocation"
    rule: "S=opening+net_receipts-closing including retained recovery. Use gross supply input S/N and separately record actual paired usable unused return output; or consumed-only input (S-usable_outward_return)/N and OMIT that paired return exchange. Deduct only matching same-scope standalone supply, never inherited shampoo/bottle or unrelated input, and never a second credit."
    source_ids: []
  - rule_id: asset_lifetime
    applies_to: "foreground_burden_allocation"
    rule: "Allocate each full asset lifecycle by compatible job_driver/lifetime_all_user_driver, where lifetime combines observed all-user use and sourced remaining service, with uncertainty/sensitivity/update. All periods and consumers, manufacture/maintenance/replacement/EOL included; provider/carrier coverage disjoint. Divide service total by N once."
    source_ids: []
  - rule_id: freight_and_fates
    applies_to: "foreground_burden_allocation"
    rule: "Each unique load-leg actual work uses that record documented_service_share inside the sum, then /N once. Cargo includes actual bottle/closure/pump/headspace/pack/support, not only liquid; EACH actual count once/TOTAL unchanged and only noncargo tare deducted. Actual return/recovery/disposal classification, receiver transport and treatment have one owner; portions of whole mixed streams are nonadditive, with no automatic credit."
    source_ids: []
