  calculation_rules:
    - id: completed_count
      applies_to: "accepted_service"
      rule: "N=count unique FINAL actual merchant-owned/resold B2B consignment acceptances after reversals with merchant/ownership/buyer/gate/source records. Normalize only N>0; other event resources carried without invented output/division."
      inputs:
        - "cp_urea actual ownership/B2B/final acceptance/reversal evidence"
      output: "N and 1 Item(s) service reference"
      source_ids: []
    - id: moisture_basis_audit
      applies_to: "nonexchange fertilizer"
      rule: "For actual compatible water/dry definitions w_wet=water_mass/wet_mass; w_dry=water_mass/dry_matter_mass; w_wet=w_dry/(1+w_dry); dry_matter_mass=wet_mass*(1-w_wet). Native percentage/fraction conversions/method/state/sample/source explicit; moisture difference alone not lost dry urea."
      inputs:
        - "cp_urea native netmass/moisture definitions/wet-drybasis/conversion records"
      output: "Actual nonadditive wet/dry/water audit, no default moisture"
      source_ids: []
    - id: nitrogen_audit
      applies_to: "nonexchange nutrient"
      rule: "nitrogen_mass=actual_matching_basis_mass*actual_N_mass_fraction only matching measured or evidenced actual analysis and wet/dry basis/unit/state/method/sample/source; no typical label multiplier. No separate fertilizer output or NH3/N2O/CO2 release from Ncontent."
      inputs:
        - "cp_urea actual mass/N basis/analysis/source and conversions"
      output: "Nonadditive actual N audit, not emission factor"
      source_ids: []
    - id: original_gate_demand
      applies_to: "commodity outside"
      rule: "commodity_source_gate_demand=assigned_source_gate_quantity; actual directmapping OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers with positive complete actual terminal records inclclosing/returns/usefulothers/real loss. Native source/assigned/baseline/additional quantities/equivalence and stage/loss ownercoverage reconcile outsideonce, including evidenced moisture/state-change share.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
      inputs:
        - "cp_urea original complete granularbag/source/all-terminal native allocation/coverage"
      output: "Quantified original finished granular-bag demand and unique upstream loss interface"
      source_ids: []
    - id: supply_convention
      applies_to: "new supplies"
      rule: "S=opening+net_receipts-closing; gross S/N+actual same-stock usable_outward_return/N output OR consumed-only (S-usable_outward_return)/N and OMIT paired output. No originalcommodity/asset against unrelated supply or second credit."
      inputs:
        - "cp_supplies real native stock/extent/conversion/receiver pairing"
      output: "Exclusive new supply and unused outward returns"
      source_ids: []
    - id: utility_allocation
      applies_to: "actual utilities"
      rule: "service_driver_share=service_driver/all_user_driver on matching causal native basis; allocated_utility=native_interval_quantity*service_driver_share/N after actual conversion."
      inputs:
        - "cp_utilities native interval/driver/method/state/source"
      output: "Actual measured or allocated warehouse utility per service"
      source_ids: []
    - id: provider_allocation
      applies_to: "provider_packages"
      rule: "provider_quantity=actual_native_package_quantity*documented_share/N after physical equivalent/coverage; documented_share=share_numerator/share_denominator with matching driver native basis/source."
