      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Real spent wipes/absorbents/filters or mixed capture solids with retained fertilizer/water. Purchased dry material, spent wet whole stream and component/urea/N/moisture audits are nonadditive. No drying/disposal recipe or default physical/chemical treatment prescribed. Range evidence need: Actual spent wet/net quantity/extent, retained fertilizer/fluid/component native unit/basis/method/state/source/sample time/fate and receiver needed; supplies received or presumed spill not enough. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual_compatible_outlet_net_quantity/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: hygiene_waste_spent_wipe. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: contained_liquid
      applies_to: "bagged_urea_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual collected warehouse hygiene/incident liquid/slurry to a receiver, not routine fertilizer dissolving or field application and not direct pure-water discharge. Actual dissolved/suspended urea/N/water basis and load require records, exclusive from absorbed solids/retained bag contents. Range evidence need: Actual volume or compatible mass-density-temperature conversion, native component/load state/source/receiver treatment needed; moisture gain or intake water does not determine effluent quantity/composition. Measurement evidence: protocol cp_outlets; original record basis Volume / m3. The original amount constraint “actual_compatible_outlet_net_quantity/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_liquid_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: direct_species
      applies_to: "bagged_urea_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Independently identify substance/particle size and actual receptor with measured release OR applicable activity/factor/composition/fate. Urea/N content, label/SDS, caking/moisture/stock difference not NH3/N2O/CO2 or dust emission factor/zero. Captured granules/fines and contained liquid remain transfers; no field-use hydrolysis/soil emissions imported. Range evidence need: Actual species/particle/receptor and native measurement or supported activity-factor/composition/fate/conversion needed; complete species-release factor not multiplied again by included N/composition/fate. No generic all-loss-to-air or purity factor. Measurement evidence: protocol cp_environment; original record basis Mass / kg. The original amount constraint “actual_measured_species_quantity/N OR actual_activity*applicable_factor*required_composition*required_release_fraction/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
validation_rules:
  - rule_id: reference_gate_check
    applies_to: "foreground_dataset_conformance"
    rule: "Reference output name/link/Count and N match actual owned-resold B2B final acceptance afterreversals and original baggedgranular/state/N-moisture/pack qualifiers; N>0 before divide, canceled/openresources retained."
    source_ids: []
  - rule_id: source_gate_check
    applies_to: "foreground_dataset_conformance"
    rule: "Use the actual complete finished, formulated, granulated and bagged product gate. Record original, assigned, baseline and additional native quantities, states and sources. Use direct mapping OR a positive, complete set of terminal records, including closing stock, useful other exits, returns and actual loss, with original-product equivalence, stage/loss coverage and one loss owner. Integrate the required burden once outside the service. Raw ammonia or an incomplete urea dataset alone is insufficient; an unexplained residual is not a measured loss.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: scope_check
    applies_to: "foreground_dataset_conformance"
    rule: "No hidden merchantdrying/granulate/prill/coat/inhibitoradd/blend/dissolve/rebag/fieldapply or activeclimate, includingprovider. No bulk/prill/blend/coated-inhibited substitution without reviewedextension."
    source_ids: []
  - rule_id: basis_fate_check
    applies_to: "foreground_dataset_conformance"
    rule: "Actual wet/dry moisture and N basis/unit/state/source consistent; moisture change not automatically dryurea loss. Wholebag/loosefines/pack/mixedcleanup/containedliquid/retainedcomponents/species and receiver treatment exclusive. Ncontent/ureachemistry/stockgap not NH3N2OCO2 emission orzero."
    source_ids: []
  - rule_id: resource_record_check
    applies_to: "foreground_dataset_conformance"
    rule: "EACH/TOTAL real cargo retains fertilizer actualmoisture/pack/carriedsupport minusonlynoncargotare; unique loadleg work*its OWN physical share INSIDE sum then /N once. All-user fullasset native jobobservedremainderlife/EOL/uncertainty and grossS+pairedout OR consumed-onlyOMITout match one-owner records."
    source_ids: []
  - rule_id: actual_binding_check
    applies_to: "foreground_dataset_conformance"
    rule: "Final exchanges require real quantity/conversion/source and verified concrete identity/property/unit. Candidate unresolved identities/ranges not waived by checker or mapping review and no publication/fullchain-ready assertion."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "foreground_dataset_conformance"
    rule: "all inventory rows"
    source_ids:
      - "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence"
      - species
      - state
      - "receiver or provider configuration blocks final data completion"
      - "no assumed zero. Whole streams and components"
      - "gross inputs and matched returns must remain mutually exclusive where required."
