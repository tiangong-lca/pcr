    - id: unique_freight_sum
      applies_to: "freight"
      rule: "For EACH cargo_total=actual_each_compatible_cargo_mass*actual_compatible_count once; TOTAL cargo_total=actual_total_compatible_cargo_mass unchanged. Cargo retains real fertilizer moisture/pack/support subtracting only noncargo tare. Per unique load+leg actual_transport_work=cargo_total_tonnes*actual_distance_km OR matching native carrier work; freight_quantity=sum_unique_load_leg(actual_transport_work*documented_service_share)/N with each record share INSIDE sum."
