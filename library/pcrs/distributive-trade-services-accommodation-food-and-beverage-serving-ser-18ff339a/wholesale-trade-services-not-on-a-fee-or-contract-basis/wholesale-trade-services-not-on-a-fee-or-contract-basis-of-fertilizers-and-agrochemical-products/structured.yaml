      rule: "asset_equivalent=job_driver/lifetime_all_user_driver/N; lifetime_all_user_driver=compatible_observed_all_user_driver+compatible_sourced_remaining_driver. Full matched lifecycle/EOL and all native job/observed/remainder/lifetime/equivalence methods/state/source/uncertainty/update explicit."
