allocation_rules:
  - rule_id: operations
    applies_to: "all actual service rows"
    rule: "Assign direct event use first. Shared support uses justified compatible physical drivers across ALL real users/periods including rejected and idle work; divide attributed total by positive accepted N once. Revenue or equal orders are not automatic drivers."
    source_ids: []
  - rule_id: assets
    applies_to: "shared_assets"
    rule: "Cover manufacture, maintenance, actual replacements and end-of-life using actual used/compatible lifetime driver. Lifetime is observed history plus evidenced remaining service/termination with uncertainty/sensitivity. Use one asset-equivalent or lifecycle-complete provider view, not both or twice divided by N."
    source_ids: []
  - rule_id: supply_returns
    applies_to: "operating supplies"
    rule: "Per actual native SKU/state S = attributed opening + net external receipts - closing. Gross-with-outlets uses S/N and actual usable return; consumed-only uses (S - matched usable external return)/N and OMITs that matched return exchange. Retained recovery stays closing, waste/loss retains production, no negative/unmatched netting."
    source_ids: []
  - rule_id: source_gate
    applies_to: "coffee/packs memorandum"
    rule: "Keep complete roasted/sealed source-gate manufacture outside service. Map actual lot source quantities to accepted dispatch, closing, useful return/other exits and proven discard/state-change shares in original units/state with conversions. Additional assigned demand = actual required gate demand minus identical demand/loss already covered in baseline; document same-state nonoverlap, never subtract unrelated scopes or create negative demand. Missing roasting/packing stages from green-coffee-only data are assembled once outside. Do not call moisture change or headspace gas a discarded bean kg."
    source_ids: []
  - rule_id: fates
    applies_to: "all outlets"
    rule: "Actual receiver treatment has one owner; no automatic avoided-production credit from usable goods/supplies or recovery. Actual commercial coffee returns/downgrades remain non-exchange merchandise audit. Unknown source demand/state/receiver coverage blocks full-chain finalization."
    source_ids: []
  - rule_id: commodity_link_scope
    applies_to: "nonexchange commodity interface"
    rule: "Keep actual original-gate stock and completed external integration at their recorded raw quantities. Declare source_assignment_scope_id, actual target_consignment_ids/target_cohort_id and source_assignment_quantity_basis: single_consignment_case, target_cohort_total or already_per_reference. For a raw target-cohort total, source_link_per_service_quantity=source_link_assigned_raw_quantity/same_target_scope_N ONLY when the positive N covers exactly that assigned target scope, with actual native units/state/source and acceptance-reversal evidence; use that interface once when combining with 1 accepted_service. A single-consignment case with N=1 and an already-per-reference quantity are not divided again. Do not divide actual external stock/stage-integration records by service N or use whole-source-cohort N for a narrower assigned target; preserve raw quantities and an explicit once-only link."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_consignment
      process_id: "coffee_wholesale"
      flow_role: "accepted_service"
      record_type: "Actual commercial acceptance and inherited state ledger"
      raw_fields: "site_id; campaign_id; period_id; consignment_id; lot_id; supplier_id; SKU; blend_species; roast_state; whole_bean_state; manufacturer_release; supplier_gate; roast_date; release_date; best_by_date; date_source; ownership_start; resale_risk; business_buyer; pack_configuration; seal_valve_state; net_contents; net_unit; tare; tare_unit; actual_temperature; temperature_unit; relative_humidity; humidity_unit; odor_light_exposure; actual_start; actual_end; time_zone; duration; duration_unit; acceptance_criteria; acceptance_record; reversal_id; N"
      collection_method: "Verify actual merchant ownership/resale, whole roasted sealed SKU/release/date and real final B2B acceptance; retain quantities/conditions without opening every pack."
      unit: "Item(s)"
      frequency: "Each consignment/reversal"
      temporal_coverage: "Actual linked service/stock/reporting intervals"
      site_scope: "Actual merchant warehouse and commercial gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Traceable release/ownership/date/condition/acceptance"
    - protocol_id: cp_stock
      process_id: "coffee_wholesale"
      flow_role: "merchandise; discarded_coffee_packs"
      record_type: "Actual coffee/pack state and original-gate stock ledger"
      raw_fields: "site_id; period_id; consignment_id; lot_id; event_id; event_time; time_zone; SKU; pack_count; pack_unit; net_bean_mass; mass_unit; package_tare; moisture; moisture_unit; moisture_wet_dry_basis; moisture_method; moisture_source; sample_selection; sample_quantity; sample_unit; sample_removal; sample_return; sample_fate; seal_valve_state; temperature; temperature_unit; opening; external_receipts; buyer_returns; physical_dispatch; net_accepted_dispatch; closing; supplier_returns; useful_other_exit; discarded_quantity; discard_unit; discard_composition; discard_receiver; discard_treatment_scope; moisture_state_change; other_state_change; state_change_method; state_change_unit; state_change_basis; state_change_source; unexplained_residual; source_gate_quantity; source_gate_unit; source_gate_state; source_gate_dataset; source_gate_conversion_method; source_gate_conversion_factor; conversion_unit; conversion_basis; conversion_source; source_stage_coverage; missing_upstream_stage; assigned_gate_demand; baseline_same_loss_coverage; additional_gate_demand; commodity_owner; adjustment_status; uncertainty; source_assignment_scope_id; source_assignment_quantity_basis; target_consignment_ids; target_cohort_id; source_quantity_already_per_reference; external_raw_integration_quantity_preserved; once_only_service_link_evidence; source_link_assigned_raw_quantity; source_link_assigned_raw_quantity_unit; source_link_assigned_raw_quantity_basis; source_link_assigned_raw_quantity_method; source_link_assigned_raw_quantity_state; source_link_assigned_raw_quantity_source; source_link_assigned_raw_quantity_sample_time; same_target_scope_N; same_target_scope_N_unit; same_target_scope_N_basis; same_target_scope_N_method; same_target_scope_N_state; same_target_scope_N_source; same_target_scope_N_sample_time; source_link_per_service_quantity; source_link_per_service_quantity_unit; source_link_per_service_quantity_basis; source_link_per_service_quantity_method; source_link_per_service_quantity_state; source_link_per_service_quantity_source; source_link_per_service_quantity_sample_time; flow_row_id; actual_identity_case; actual_substance_or_material; actual_state_and_gate; case_activation_evidence; quantity_exclusion_links; whole_total_reconciliation"
      collection_method: "Reconcile actual compatible pack counts and bean/pack moisture states; track all exits/sample fates and actual original-gate assigned demand. Residuals stay unexplained rather than guessed gas/waste; supplier complete roasted/sealed stages and loss coverage are independent. Attribute only the individually identified physical case; retain other source-linked actual fates separately. Each native record belongs to exactly one exchange and any whole total is a non-additive audit."
      unit: "Actual native packs and kg/state"
      frequency: "Each movement/stocktake/sample/disposition"
      temporal_coverage: "Actual linked service/stock/reporting intervals"
      site_scope: "All actual stock lots and original supplier state"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scales/tare/moisture sample provenance and matched source quantities"
    - protocol_id: cp_energy
      process_id: "coffee_wholesale"
      flow_role: "electricity; fuel_supply"
      record_type: "Actual meter and fuel burn ledger"
      raw_fields: "site_id; campaign_id; period_id; consignment_id; event_id; asset_id; start_time; end_time; time_zone; duration; duration_unit; meter_id; energy_carrier; reading_start; reading_end; reading_unit; actual_driver; driver_unit; all_consumer_driver; all_consumer_unit; idle_cleaning_scope; actual_burn; burn_unit; burn_method; nonburned_return; nonburned_waste; nonburned_loss; closing; provider_coverage; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Meter actual service use/burn and all-consumer allocation; reconstruct burn only with complete disjoint native stock fates, investigating unknown losses. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "Actual energy/fuel units"
      frequency: "Each real meter interval/event"
      temporal_coverage: "Actual linked service/stock/reporting intervals"
      site_scope: "All included handling/warehouse/support users"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meters, actual drivers and complete burn/provider coverage"
    - protocol_id: cp_supplies
      process_id: "coffee_wholesale"
      flow_role: "facility_water; outer_packaging; operating_supplies; fuel_supply; usable_supply_returns"
      record_type: "Actual native supply and return ledger"
      raw_fields: "site_id; period_id; consignment_id; event_id; event_time; time_zone; SKU; chemical_formulation; concentration; concentration_unit; composition_basis; composition_source; native_unit; opening; receipt_gross; receipt_tare; receipt_net; closing; retained_recovery; usable_external_return; actual_waste; direct_loss; inherited_new_pack_level; matched_input_id; return_recipient; gross_consumed_view; omit_matched_return_exchange; original_supply_owner; density; density_unit; temperature; temperature_unit; conversion_factor; factor_unit; factor_basis; factor_source; actual_purpose; provider_coverage; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Use net receipts after tare, same-state stock and actual external fates; match a return only to its standalone scope. Primary sealed bags are inherited; adding outside protection is separate. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero. Any litre-to-kg diesel conversion requires actual compatible density, temperature/state, mass-per-volume unit and source; no default conversion."
      unit: "Actual native supply unit"
      frequency: "Each receipt/issue/return/stock boundary"
      temporal_coverage: "Actual linked service/stock/reporting intervals"
      site_scope: "Actual operating stock and service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Native receipt/stock/return matching and conversions"
    - protocol_id: cp_assets
      process_id: "coffee_wholesale"
      flow_role: "shared_assets"
      record_type: "Complete lifecycle and consumer ledger"
      raw_fields: "site_id; period_id; consignment_id; asset_id; consumer_id; phase_id; manufacture_dataset; maintenance; replacement; end_of_life; event_date; driver_used; driver_used_unit; lifetime_driver; lifetime_driver_unit; observed_history; evidenced_remaining; remainder_source; termination; attribution_view; uncertainty; sensitivity; update_trigger"
      collection_method: "Cover all real consumers/periods and complete lifecycle, matching used/lifetime units and observed/evidenced remaining service with one view."
      unit: "Item(s) or actual lifecycle-service unit"
      frequency: "Each asset event/period review"
      temporal_coverage: "Actual linked service/stock/reporting intervals"
      site_scope: "Full actual shared asset service life"
      aggregation_rule: "per reference flow"
      quality_evidence: "Complete stages, actual driver and evidenced remainder"
    - protocol_id: cp_providers
      process_id: "coffee_wholesale"
      flow_role: "provider_services"
      record_type: "Completed physical result and coverage matrix"
      raw_fields: "site_id; period_id; consignment_id; provider_id; service_id; event_date; completed_result; physical_quantity; native_unit; duration; duration_unit; completion_evidence; sample_scope; material_coverage; energy_coverage; chemical_coverage; asset_lifecycle_coverage; freight_coverage; treatment_coverage; direct_release_coverage; actual_driver; driver_unit; all_consumer_driver; all_consumer_unit; missing_coverage"
      collection_method: "Verify actual result/native unit and full physical boundary; avoid separate direct inputs for already covered provider operations, and retain missing components."
      unit: "Actual provider-native physical unit"
      frequency: "Each completed real result"
      temporal_coverage: "Actual linked service/stock/reporting intervals"
      site_scope: "Actual outsourced responsibility"
      aggregation_rule: "per reference flow"
      quality_evidence: "Completion/unit proof and coverage ownership"
    - protocol_id: cp_freight
      process_id: "coffee_wholesale"
      flow_role: "freight"
      record_type: "Actual cargo/load and distance ledger"
      raw_fields: "site_id; period_id; consignment_id; leg_id; event_date; provider_id; mode; actual_load; load_unit; bean_net_mass; pack_mass; included_tare; tare_scope; load_conversion_factor; load_factor_unit; load_factor_basis; load_factor_source; distance; distance_unit; distance_conversion_factor; distance_factor_unit; distance_factor_source; empty_return_scope; actual_driver; driver_unit; all_consumer_driver; all_consumer_unit; provider_native_unit; supplier_delivered_coverage; duplicate_leg_check"
      collection_method: "Measure actual cargo including declared real pack/tare scope and real distance; retain empty/shared legs and delivered-source coverage once."
      unit: "kg*km or actual native freight unit"
      frequency: "Each actual included leg"
      temporal_coverage: "Actual linked service/stock/reporting intervals"
      site_scope: "All actual included commodity/service/waste legs"
      aggregation_rule: "per reference flow"
      quality_evidence: "Cargo/distance/conversion and one scope owner"
    - protocol_id: cp_fates
      process_id: "coffee_wholesale"
      flow_role: "environmental_water; other_wastes; contained_wastewater; water_outfalls"
      record_type: "Actual water/waste receiver ledger"
      raw_fields: "site_id; period_id; consignment_id; event_id; event_time; time_zone; material_source; native_quantity; native_unit; collected_volume; received_volume; volume_unit; mass; mass_unit; density; density_unit; temperature; temperature_unit; composition; concentration; concentration_unit; composition_basis; composition_source; conversion_factor; factor_unit; factor_source; purchased_direct_water; receiver; receiving_medium; treatment_dataset; treatment_coverage; direct_outfall; actual_driver; driver_unit; all_consumer_driver; all_consumer_unit; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Measure actual source and native receiver state/quantity with composition/treatment owner. Purchased water, environmental intake, contained liquid, direct outfall and species are distinct non-additive roles. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "Actual native water/waste units"
      frequency: "Each actual intake/receiver/outfall event"
      temporal_coverage: "Actual linked service/stock/reporting intervals"
      site_scope: "Actual source and receiving responsibility"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual measured quantity/composition/receiver scope"
    - protocol_id: cp_releases
      process_id: "coffee_wholesale"
      flow_role: "coffee_species; other_releases"
      record_type: "Actual source/species/medium release ledger"
      raw_fields: "site_id; period_id; consignment_id; event_id; start_time; end_time; time_zone; duration; duration_unit; source_role; SKU_lot_or_asset; chemical_species; receiving_medium; measured_quantity; measurement_unit; actual_activity; activity_unit; actual_burn; burn_unit; factor; factor_unit; factor_basis; factor_source; gas_volume; volume_unit; pressure; pressure_unit; temperature; temperature_unit; gas_composition; composition_basis; composition_source; molecular_conversion; conversion_unit; conversion_source; release_fraction; fate_basis; fate_source; method; method_version; provider_coverage; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Use actual species/medium measurement or compatible actual source-state/time method with every operand/unit/source. Inherited coffee/pack releases and direct operating chemicals are separate; stock deficit/quality deterioration is no emission method. A complete factor must not be multiplied again by composition/fate. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kg identified species with actual operand units"
      frequency: "Each actual measured/modeled source interval"
      temporal_coverage: "Actual linked service/stock/reporting intervals"
      site_scope: "Actual source and receiving medium"
      aggregation_rule: "per reference flow"
      quality_evidence: "Complete measured/model/source/factor/composition/fate evidence"
  calculation_rules:
    - id: normalize
      applies_to: "all inventory"
      rule: "Attribute actual quantities by event then compatible all-user driver; retain rejected/unfinished/idle burdens and divide by positive accepted N only once."
      inputs:
        - cp_consignment
        - cp_energy
        - cp_supplies
        - cp_assets
        - cp_providers
        - cp_freight
        - cp_fates
        - cp_releases
      output: "Physical service inventory per reference"
      source_ids: []
    - id: stock_balance
      applies_to: "merchandise"
      rule: "Same-state packs: opening + external receipts + buyer returns - closing - physical dispatch - supplier returns - useful other exits - actual discard - net sample removals = unexplained residual. Pair internal moves. Separately reconcile wet bean net/tare/moisture/state with actual uncertainty; do not force coffee water/gas to residual or dry solids."
      inputs:
        - cp_stock
      output: "Audited stock and actual component/state fates"
      source_ids: []
    - id: commodity_demand
      applies_to: "commodity interface"
      rule: "At actual roasted/sealed original gate, reconcile lot assigned accepted-demand + allocated proven discard/state-change demand against actual source quantities after closing/useful exits/returns, all in original units/state with evidenced conversion. Required linked demand and existing identical baseline loss/stage coverage yield one additional adjustment outside service; no generic yield multiplier, lost-mass gas factor or duplicate treatment."
      inputs:
        - cp_stock
        - cp_consignment
      output: "Explicit complete source-gate demand/adjustment outside service"
      source_ids: []
    - id: species_release
      applies_to: "coffee_species; other_releases; other_releases_co2_fossil_air; other_releases_methane_fossil_air; other_releases_nitrous_oxide_air"
      rule: "Use actual measured identified species/medium or compatible activity/burn and source-specific factor. If volume-to-species conversion is necessary retain actual pressure/temperature/composition/molecular conversion and units/sources; complete species factor not multiplied twice by composition/fate. No stock residual becomes CO2/aroma/water release."
      inputs:
        - cp_releases
        - cp_stock
        - cp_energy
      output: "Actual evidenced release per reference"
      source_ids: []
    - id: cargo_transport
      applies_to: "freight"
      rule: "Actual kg*km = measured actual included cargo converted to kg times real distance converted to km, with non-overlapping shared leg attribution and provider coverage. Other native units need matching service datasets."
      inputs:
        - cp_freight
      output: "Actual native freight quantity per reference"
      source_ids: []
  data_quality_requirements:
    - id: actual_identity
      applies_to: "all rows"
      requirement: "Resolve actual SKU/provider/species/state/receiver and compatible support before final exchanges; Count support is not a wholesale flow identity."
      evidence: "Actual detailed identity/support and foreground proof"
    - id: supplier_state
      applies_to: "coffee and package audit"
      requirement: "Keep actual whole-bean roasted release, seals/valves, dates, moisture basis/method and applicable buyer quality/condition evidence; no household shelf-life or every-pack assay default."
      evidence: "cp_consignment; cp_stock; nca-coffee-storage"
    - id: coverage
      applies_to: "all obligations"
      requirement: "Match all-users/full-life asset and provider scopes once; original roasted/sealed commodity stages and assigned loss coverage must be explicit outside service. Unknown gas/stock/fate stays disclosed."
      evidence: "Coverage matrix and independent native measurements"
    - id: electricity
      applies_to: "coffee_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Record actual lighting, electric handling and business-support meter scope. Roasting/grinding/brewing electricity is outside this service; ambient placement is not evidence of a dedicated cooling intervention. Range evidence need: Need actual meter differences, interval, all consumer use and completed-consignment attribution; independent checks must match warehouse load and scope, not a universal coffee kWh/kg. Measurement evidence: protocol cp_energy; original record basis Energy / kWh. The original amount constraint “Actual attributed actual warehouse and handling electricity per reference flow; cp_energy.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_energy; actual source-linked native records"
    - id: facility_water
      applies_to: "coffee_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Include actual service cleaning and sanitation supplies; moisture in inherited beans and beverage preparation are not this input. A real analytical sample has its own documented support event. Range evidence need: Need actual meter/issue purpose and native volume with supplier boundary; purchased water, direct abstraction, bean moisture and received wastewater are separate quantities. Measurement evidence: protocol cp_supplies; original record basis Volume / m3. The original amount constraint “Actual attributed actual purchased hygiene and facility water per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: facility_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: outer_packaging
      applies_to: "coffee_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Use only new service-owned outer cartons, stretch film, straps or labels actually added without opening manufacturer seals. Inherited bags/valves/labels are commodity state; reusable pallets are lifetime services. Range evidence need: Need inherited/new level and SKU, actual area/count/mass and per-piece or areal conversion sources. Do not manufacture a complete new primary coffee pack for every wholesale sale. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed actual new outer handling protection and labels per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: outer_packaging_pe_film; outer_packaging_paperboard_carton. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: operating_supplies
      applies_to: "coffee_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand real cleaners, absorbents, filters, lubricants and test consumables by formulation/native unit. Ingredients, roast additions and new package flushing gas are excluded operations. Range evidence need: Need SKU concentration, opening/receipts/closing, composition, net/tare and actual waste/return/release fates. A safety sheet or applied product amount alone is not a species emission. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed actual warehouse cleaning and maintenance supplies per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: operating_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: fuel_supply
      applies_to: "coffee_wholesale"
      requirement: "Which purchased fuel grade/formulation and supply gate are on the stock record? Identify any fuel other than the named diesel case and its native unit; obtain actual density before a volume-to-mass conversion. Retain actual grade and native stock supply; measured burn is distinct. Hired handling or transport may already include fuel and must have one coverage owner. Range evidence need: Need grade, native stock receipts/returns/closing and actual disjoint burn/nonburned fates, with density/temperature/conversion source if needed; no purchased-equals-burn assumption. Measurement evidence: protocol cp_supplies; original record basis Volume / L. The original amount constraint “Actual attributed actual handling and support fuel supply per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: fuel_supply_diesel_supply. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_services
      applies_to: "coffee_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Expand actual storage, handling, inspection/sample, hygiene, maintenance and business-support results in their real physical units. An inherited supplier certificate is not another performed test. Range evidence need: Need completed result, native quantity and full material/energy/assets/freight/treatment coverage; invoices or financial margins cannot define service quantities. Measurement evidence: protocol cp_providers; original record basis Count / Item(s). The original amount constraint “Actual attributed actual contracted physical wholesale support per reference flow; cp_providers.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_providers; actual source-linked native records"
    - id: shared_assets
      applies_to: "coffee_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Record complete warehouse, racks, handling/measurement/ICT equipment and reusable transport assets across every actual consumer and period. Range evidence need: Need manufacture, maintenance, replacements, end-of-life, compatible used/lifetime driver units and observed history plus evidenced remainder/termination, uncertainty and sensitivity. No default asset life or one full pallet manufacture per trip. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual attributed lifecycle-attributed warehouse and reusable assets per reference flow; cp_assets.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "coffee_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Measure real transported whole cargo including actual bag/carton/protection scope, not just declared coffee contents. Retain supplier-delivered gate and empty/return legs without duplication. Range evidence need: Need cargo/tare scope, actual route/load/distance units and conversion factors, all-consumer share and provider scope. No fixed pack percentage or mass from consignment count. Measurement evidence: protocol cp_freight; original record basis Mass*distance / kg*km. The original amount constraint “Actual attributed actual non-overlapping cargo and service freight per reference flow; cp_freight.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: environmental_water
      applies_to: "coffee_wholesale"
      requirement: "Identify the actual abstraction point, water body/aquifer, location and measured source volume from intake permits/meter records. Surface water and groundwater require distinct source identities; no direct withdrawal is established by purchased water use. Only actual withdrawal crossing the environmental boundary belongs here. Moisture uptake by inherited coffee is a stock-state question and does not establish a utility intake. Range evidence need: Need actual source/location purpose, meter and interval, distinguishing purchased water. No fixed water content or abstracted-water factor from traded coffee mass. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual attributed actual direct source-specific water withdrawal per reference flow; cp_fates.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: usable_supply_returns
      applies_to: "coffee_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Match actual standalone SKU/state return and recipient. Under consumed-only supply accounting omit that matched return exchange; inherited coffee packs/beans remain commodity audit. Range evidence need: Need actual external native quantity/state and matching supply owner. Closing stock/internal reusable loops are not external transfers and no automatic avoided production credit arises. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed actual matched unused operating supply returns per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_supply_returns_detergent_return; usable_supply_returns_pe_film_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: discarded_coffee_packs
      applies_to: "coffee_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Use actual receiver quantity/state for damaged, rejected or expired stock sent to treatment. Whole-pack and bean/package component views are alternative non-additive audit views; no commodity manufacture input here. Range evidence need: Need actual disposition receipt, native quantity/net/tare/composition, original supplier-gate equivalent and receiver treatment scope; missing mass or best-by date alone does not prove discard. Measurement evidence: protocol cp_stock; original record basis Mass / kg. The original amount constraint “Actual attributed actual discarded coffee packs and contents per reference flow; cp_stock.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: discarded_coffee_packs_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_stock; actual source-linked native records"
    - id: other_wastes
      applies_to: "coffee_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Expand real cleaning residues, spent supplies, wrapping and other service-generated fractions by receiver/state. Exclude bean/primary-pack fractions already in whole-pack waste. Range evidence need: Need native measured quantity, conversion/composition and receiver/treatment record; supply receipt or cleaning issue is not waste quantity and no automatic recycling credit. Measurement evidence: protocol cp_fates; original record basis Mass / kg. The original amount constraint “Actual attributed actual operating and new outer-packaging waste per reference flow; cp_fates.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: other_wastes_paper_pack; other_wastes_metal_pack; other_wastes_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: contained_wastewater
      applies_to: "coffee_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Record actual liquid sent to a treatment receiver, including real sample support only when performed. Bean moisture is not purchased water or presumed wastewater. Range evidence need: Need actual received/collected volume, composition/unit/basis, source interval and treatment responsibility. Do not equate incoming water to wastewater or duplicate a direct outfall. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual attributed actual collected cleaning or analytical wastewater per reference flow; cp_fates.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: water_outfalls
      applies_to: "coffee_wholesale"
      requirement: "Identify the direct outfall and receiving water/soil compartment, measured water amount and independently analysed pollutant species. A sewer transfer to treatment is not this outfall; the missing receiving compartment prevents a concrete elementary-flow selection. Record actual direct receiving medium and quality; contained transfer to treatment is Waste. Discharge volume and any measured species must retain separate compatible non-additive bases. Range evidence need: Need actual outfall/location/volume and composition/state evidence, not sewer invoice or a presumed constant percentage of cleaning-water supply. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual attributed actual direct water outfall to environment per reference flow; cp_fates.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: coffee_species
      applies_to: "coffee_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Conditional actual coffee/headspace/package gas or water release requires measured species and medium or an applicable source-state method. Roasting emissions occur upstream; unknown bean mass change is not CO2, volatile aroma, water vapour or another species. Range evidence need: Need actual chemical/composition, source/receiver medium, interval, compatible activity/factor or gas volume/pressure/temperature conversion and uncertainty. Residual stock or lost aroma cannot quantify a species. Measurement evidence: protocol cp_releases; original record basis Mass / kg. The original amount constraint “Actual attributed actual evidenced species release from inherited coffee or pack per reference flow; cp_releases.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_releases; actual source-linked native records"
    - id: other_releases
      applies_to: "coffee_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Expand actual fuel combustion, cleaning and maintenance species/medium separately from coffee-origin releases and provider-covered upstream emissions. Range evidence need: Need measured species or actual burn/activity and compatible complete factor with required composition/fate once. Product application, financial cost and hazard classification are not emitted mass. Measurement evidence: protocol cp_releases; original record basis Mass / kg. The original amount constraint “Actual attributed actual handling combustion and maintenance species per reference flow; cp_releases.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: other_releases_co2_fossil_air; other_releases_methane_fossil_air; other_releases_nitrous_oxide_air. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_releases; actual source-linked native records"
validation_rules:
  - rule_id: commercial_gate
    applies_to: "accepted_service"
    rule: "Verify unique positive actual B2B ownership/resale acceptance with required whole/roast/seal/date/net/moisture/time qualifiers; no order/pack/kg equivalence."
    source_ids: []
  - rule_id: route_state
    applies_to: "coffee_wholesale"
    rule: "Check ordinary ambient service and actual quality/seal reject paths; no opening/repacking/roasting/grinding or household freezing introduced silently."
    source_ids:
      - nca-coffee-storage
  - rule_id: stock_source
    applies_to: "merchandise"
    rule: "Reconcile all lot/period stock/fates/sample/state and full roasted-sealed original-gate quantity/conversion/baseline-loss interface; no residual species or green-only complete gate."
    source_ids: []
  - rule_id: allocation_period
    applies_to: "all resources"
    rule: "Require all consumers/events/periods and complete asset life with observed/evidenced remainder, compatible drivers and one per-N view. Failed/unfinished work retains burden; direct/provider scopes do not duplicate."
    source_ids: []
  - rule_id: physical_fates
    applies_to: "all actual exchanges"
    rule: "Verify native quantity/conversions/composition/receiver and treatment coverage, and omit matched return under consumed-only; keep non-additive pack/component/water/species views and no automatic avoided credit."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity/completeness review"
  downstream_use: "Physical coffee wholesale add-on linked separately to complete original roasted/sealed product and assigned demand/loss interface"
  allowed_use: "Actual ambient manufacturer-sealed roasted whole-bean own-account accepted consignment with matching qualifiers"
  excluded_use: "Standalone coffee footprint; green/ground/brewed/soluble coffee; processing/repacking; household storage recommendation; retail/agency/storage-only"
  required_metadata: "Actual SKU/blend/roast/date/seal/valve/net/tare/moisture/conditions/time/acceptance and lot/merchant/site/period; supplier-gate stages/assigned quantity and baseline loss owners; service/provider/asset/freight/treatment scope"
  required_quality_disclosure: "Actual identity/support gaps, measurement/moisture/date/quality uncertainty, source-gate and unexplained stock/gas/fate limitations, all-consumer/lifetime evidence and absent independent range data"
  update_trigger: "Changed coffee presentation/roast/pack/gate/quality/date/state, actual processing or dedicated preservation, stock/loss coverage, provider/asset/measurement/species methods"
data_sources:
  - id: "unsd-cpc3-coffee-wholesale"
    type: "official_guidance"
    reference: "UNSD CPC3 explanatory notes (30 June 2025), printed page301,61027/class2391. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification only: prepared coffee/tea wholesale includes the selected narrower roasted whole-bean service."
  - id: "nca-coffee-storage"
    type: "official_guidance"
    reference: "National Coffee Association USA, Storage and shelf life, public consumer guidance. https://www.aboutcoffee.org/beans/storage-and-shelf-life/"
    used_for: "Qualitative packaging/condition/moisture/odor and quality context only; consumer opening/freezing/quantity/freshness windows are not wholesale prescriptions or quantitative factors."
