        - cp_consignment
        - cp_energy
        - cp_supplies
        - cp_assets
        - cp_providers
        - cp_freight
        - cp_fates
        - cp_releases
      output: "Actual per-reference physical service inventory"
      source_ids: []
    - id: closed_paste_stock
      applies_to: "commodity audit"
      rule: "Compatible native stock: opening+supplier_external_receipts+buyer_returns-closing-business_buyer_dispatch-supplier_returns-useful_other_exits-actual_discard-net_sample_removal=unknown_residual. Supplier receipts exclude buyerreturns/internalmoves; buyer dispatch excludes other exits; internal moves cancel. Actual pack/paste/component/headspace genealogy and receiver decisions govern. Whole retained-paste packs/components/mixed absorbed/free liquid are non-additive, stock deficit or LOD is not evaporation/water/whole-pack loss or zero."
      inputs:
        - cp_polish
      output: "Actual stock/status/exclusive exits and explicit unknown state"
      source_ids: []
    - id: paste_retained_measurement
      applies_to: "nonexchange contents audit"
      rule: "m_paste=V_paste*rho_paste*volume_mass_conversion_factor only for matched actual formulation/state/native density-volume units and measured temperature/method/source. m_retained_contents=m_closed_pack_gross-m_clean_pack_tare only with validated actual clean-tare scope. Retained headspace/other contents cannot default zero or be inferred from container capacity; gross-minus-tare is not automatically paste-only. Wax/solvent/water mass-or-volume composition uses actual measured basis, no partial SDS midpoint/full-recipe or residue=wax inference."
      inputs:
        - cp_polish
      output: "Separate paste/retained-content/component audit, not additive to whole pack"
      source_ids: []
    - id: water_definition_only
      applies_to: "nonexchange water audit"
      rule: "Only for actual same sample water-only w_wet=m_water/m_as_received: m_water=m_as_received*w_wet and m_nonwater=m_as_received*(1-w_wet), where nonwater still includes any solvents/other components. If r_dry=m_water/m_nonwater matches actual definitions/sample, w_wet=r_dry/(1+r_dry), percent converted first through recorded factor. LOD other volatiles is not water/solvent emission or wax; incompatible/unknown definitions block this calculation, not zero."
      inputs:
        - cp_polish
      output: "Actual water/nonwater audit only, not dry-wax/applied-film output"
      source_ids: []
    - id: complete_original_source
      applies_to: "commodity interface"
      rule: "Choose actual sourced direct measured/traced original-gate assigned quantity with exclusive terminal proof OR Qsource_actual×Dtarget/Dall_terminal. Dall_terminal>0 equals COMPLETE compatible competing FINALaccepted/usefulother/returns/closingcarry/provenloss records each quantity/unit/basis/method/state/time/source/link/owner, never accepted-only/direct-driver overlay. Source/assigned/baseline/additional native quantity-state metadata and sourced conversions match actual formulated-filled-closed paste+pack; exclusive loss owner and identical already-covered baseline stage/loss demand precede outside once-only required additional complete demand link."
      inputs:
        - cp_polish
        - cp_consignment
      output: "Separate complete original-gate demand/loss adjustment"
      source_ids: []
    - id: that_record_freight
      applies_to: "freight"
      rule: "Unique load-leg measured packedcargo OR same-state gross minus ONLY vehicle/noncargo tare retains paste/retained contents/all cargo packs without component duplication. EACH multiplies evidenced actual repetition once, TOTAL unchanged. After native conversion assigned kg*km=sum(unique load-leg: actual_packed_payload_kg×actual_distance_km×that_record_share), THAT-record complete compatible all-user share INSIDE sum then /positive FINAL N once unless already normalized; N=0 freight retained without division."
