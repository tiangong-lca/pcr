      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Cargo includes actual paste/retained solvent/headspace scope and original plus added cargo packs in their actual state. Measured same-state vehicle gross subtracts ONLY vehicle/noncargo tare; cargo tins/lids/support remain cargo. Range evidence need: Need unique load-leg native payload/gross/tare/distance, EACH/TOTAL and THAT-record share inside sum with factors/sources; nominal capacity, partial SDS density or wax-only mass does not supply cargo kg. Measurement evidence: protocol cp_freight; original record basis Mass*distance / kg*km. The original amount constraint “Actual exclusively assigned physical amount / N under cp_freight” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
