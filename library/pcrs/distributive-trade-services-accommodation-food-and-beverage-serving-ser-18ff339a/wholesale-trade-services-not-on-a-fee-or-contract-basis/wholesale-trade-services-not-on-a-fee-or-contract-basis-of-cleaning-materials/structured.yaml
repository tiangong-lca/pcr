      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Include actual facilities/racks/handling/meters/ICT/reusable cases/pallets and actual support systems across all users/periods with full manufacture/maintenance/replacement/EOL. Retail product packs are not automatically service capital. Range evidence need: Need used/observed/remaining/lifetime drivers each native unit/basis/method/state/time/source with observed+sourced remainder/termination and uncertainty/sensitivity/update; no generic life or full new asset every delivery. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual exclusively assigned physical amount / N under cp_assets” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
