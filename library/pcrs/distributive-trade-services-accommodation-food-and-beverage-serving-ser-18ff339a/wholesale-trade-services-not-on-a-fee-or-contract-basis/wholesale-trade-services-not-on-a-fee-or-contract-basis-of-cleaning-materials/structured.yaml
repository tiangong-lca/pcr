  - rule_id: complete_terminal_source
    applies_to: "commodity interface"
    rule: "For each complete actual source lot/state choose direct actual measured/traced assigned_gate_demand with quantity/unit/basis/method/state/time/source/direct proof/exclusive terminal links OR actual_source_gate_quantity×target_driver/source_all_terminal_driver. Positive COMPLETE denominator sums compatible competing FINALaccepted/usefulother/returns/closingcarry/proven actual-loss records, each quantity/unit/basis/method/state/time/source/link/owner. No accepted-only or direct-driver overlay, unknown loss is not zero. Source/assigned/baseline/additional native quantities, original state conversions and exclusive loss ownership match actual complete formulated-filled-closed product+pack; required additional demand links outside once after identical baseline stage/loss coverage."
    source_ids: []
  - rule_id: operating_supply_convention
    applies_to: "service supplies"
    rule: "S=assigned opening+NET external receipts-closing including retained recoveries. Choose exactly one: (1) gross S/N as INPUT and actual matched unused external return/N as a separate OUTPUT; (2) consumed-only (S-return)/N as INPUT and OMIT that matched return OUTPUT. Do not add return quantity to input or deduct it twice. Internal loops/retained recoveries remain closing. Actual waste/consumption retains supply burden; no inherited polish/solvent/pack against unrelated current input, negative netting or automatic credits."
    source_ids: []
  - rule_id: full_life_shared_assets
    applies_to: "assets/providers"
    rule: "Assign complete manufacture/maintenance/real replacement/EOL with actual used_driver/COMPLETE lifetime_all_consumer_driver in compatible native unit/basis/method/state/time/source. Include observed history plus sourced remaining/termination, uncertainty/sensitivity/update and every consumer/period. Use one asset-equivalent OR lifecycle-complete provider; never both or repeated N."
    source_ids: []
  - rule_id: exclusive_retained_fates
    applies_to: "commodity/service fates"
    rule: "Whole closed/discarded packs retaining paste/headspace, separate paste/residual packaging, wax/solvent/water/components, absorbed cleanup mixture, free contained organic/aqueous liquid and direct species are exclusive/non-additive views. Actual receiver transport/treatment has one scope owner after provider coverage. Damaged/quarantined/returned/pending stock is not automatically waste or release. No recovery credit or forced evaporation; no-acceptance resources remain outside FINAL N."
    source_ids: []
  - rule_id: commodity_link_scope
    applies_to: "nonexchange commodity interface"
    rule: "Keep actual original-gate stock and completed external integration at their recorded raw quantities. Declare source_assignment_scope_id, actual target_consignment_ids/target_cohort_id and source_assignment_quantity_basis: single_consignment_case, target_cohort_total or already_per_reference. For a raw target-cohort total, source_link_per_service_quantity=source_link_assigned_raw_quantity/same_target_scope_N ONLY when the positive N covers exactly that assigned target scope, with actual native units/state/source and acceptance-reversal evidence; use that interface once when combining with 1 accepted_service. A single-consignment case with N=1 and an already-per-reference quantity are not divided again. Do not divide actual external stock/stage-integration records by service N or use whole-source-cohort N for a narrower assigned target; preserve raw quantities and an explicit once-only link."
    source_ids: []
