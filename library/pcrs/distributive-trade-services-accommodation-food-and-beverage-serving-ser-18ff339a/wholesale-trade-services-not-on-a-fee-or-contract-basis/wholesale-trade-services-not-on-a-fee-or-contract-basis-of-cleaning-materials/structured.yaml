    - id: electricity
      applies_to: "paste_polish_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Use real metered warehouse lighting, handling and actual facility support/ventilation where operated. No wax/solvent manufacture, formulation/filling, application/buffing, forced evaporation or universal ventilation/cooling rate is introduced. Range evidence need: Need actual meter intervals/native source and complete all-user/event assignment including idle/incident/failed periods with provider scope; no application energy or generic kWh per container. Measurement evidence: protocol cp_energy; original record basis Energy / kWh. The original amount constraint “Actual exclusively assigned physical amount / N under cp_energy” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
