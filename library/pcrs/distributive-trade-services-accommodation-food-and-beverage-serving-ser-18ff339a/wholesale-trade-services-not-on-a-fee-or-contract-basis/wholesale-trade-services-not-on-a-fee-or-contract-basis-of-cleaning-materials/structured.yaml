      source_ids: []
    - id: actual_specific_species
      applies_to: "direct_species"
      rule: "Actual species/particle/medium quantity=measurement OR compatible actual activity×factor with native unit/basis/method/state/time/source and complete factor coverage. Species factors already including composition/fate fractions are not multiplied again; only required compatible fraction/gas-concentration conversions once with actual temperature-pressure/units/sources. Ingredient group/partial range, retained solvent or deficit/LOD/odour is not release or zero proof."
