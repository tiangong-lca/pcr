      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Record actual hygiene/support supply separately from product water and manufacturer processing. No merchant paste dilution, washing/application, residue-drying or thinner-cleaning recipe is assumed. Range evidence need: Need actual source/purpose/native volume/interval and independent fates; measured water in polish or supplied water does not quantify contained liquid waste or outfall. Measurement evidence: protocol cp_supplies; original record basis Volume / m3. The original amount constraint “Actual exclusively assigned physical amount / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: facility_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
