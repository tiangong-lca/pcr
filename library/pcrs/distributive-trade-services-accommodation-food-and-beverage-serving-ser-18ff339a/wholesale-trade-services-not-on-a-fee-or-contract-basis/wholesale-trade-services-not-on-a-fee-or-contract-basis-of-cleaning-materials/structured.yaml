  calculation_rules:
    - id: final_actual_resources
      applies_to: "all service cards"
      rule: "N=unique actual FINAL business acceptance after reversals for real merchant purchase/ownership/resale. Direct actual trace OR quantity×compatible target_driver/positive COMPLETE all_consumer_driver retains cancelled/incident/failed/quarantined/unfinished/idle/other-client/period burdens and native metadata. Assigned total/N once only N>0; N=0 keeps burden-period-cohort evidence without division."
