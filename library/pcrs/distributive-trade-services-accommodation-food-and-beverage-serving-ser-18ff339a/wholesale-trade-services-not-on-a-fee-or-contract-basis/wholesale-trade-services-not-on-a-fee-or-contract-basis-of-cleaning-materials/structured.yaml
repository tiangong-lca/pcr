    - id: new_outer_protection
      applies_to: "paste_polish_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Only real service-added cartons, pads, wraps, straps and labels enter here. Original retail container/lid/seal/label and inherited pack belong to the complete finished commodity gate; reusable transport supports use full-life service. Range evidence need: Need added-versus-original levels/SKU/net mass or actual count/area conversion and stock provenance; no default complete new tin, lid or pallet each consignment. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual exclusively assigned physical amount / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: new_outer_protection_pe_film; new_outer_protection_paperboard_carton. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
