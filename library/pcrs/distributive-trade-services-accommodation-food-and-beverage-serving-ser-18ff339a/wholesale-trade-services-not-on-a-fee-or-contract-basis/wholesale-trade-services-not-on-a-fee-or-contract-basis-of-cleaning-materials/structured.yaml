      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only actual same-scope standalone supply SKU/state returns are service outlets. Consumed-only input OMITs the matched return exchange. Internal loops/retained recoveries are closing; product/solvent/retail-pack returns remain nonexchange merchandise stock. Range evidence need: Need actual recipient/native transfer and matching input/provenance; no inherited product solvent recovery against unrelated current supplies, negative inputs or automatic recovery credits. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual exclusively assigned physical amount / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_supply_returns_detergent_return; usable_supply_returns_pe_film_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
