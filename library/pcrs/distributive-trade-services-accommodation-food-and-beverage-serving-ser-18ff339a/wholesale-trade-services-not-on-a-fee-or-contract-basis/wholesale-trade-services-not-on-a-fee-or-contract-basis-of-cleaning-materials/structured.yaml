      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand actual equipment lubricants, facility cleaners, wipes, absorbents, filters and office consumables by native SKU/purpose. Traded wax/solvent/pigment/retained contents are not service-consumed chemicals. No source application cloth/steel-wool/thinner dose or mandatory cleanup material is imported. Range evidence need: Need actual incident/use, net supply stock/composition and spent carrier/absorbed liquid/captured paste sources; ingredient presence and SDS response examples are not measured service inputs. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual exclusively assigned physical amount / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: operating_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
