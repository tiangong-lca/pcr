    - rule_id: boundary_cold
      applies_to: "sealed_milk_distribution"
      rule: "Use actual manufacturer instructions,validated product-specific storage conditions and observed time/temperature/handling records for received and accepted sealed milk. No universal setpoint,shelf life or automatic legal/hygiene compliance claim is supplied by this PCR."
