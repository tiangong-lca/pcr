      applies_to: "all physical responsibilities"
      rule: "Identify one owner for actual own/provider refrigeration,electricity,fuel,transport,asset manufacture/cleaning/maintenance/replacement/EOL and receiving treatment. Expand actual environmental water intake/outfall,chemical/refrigerant wastes and substance releases by real state/medium. Unknown actual scope blocks final data completeness."
