    - rule_id: boundary_addon
      applies_to: "all inventory"
      rule: "Exclude ALL traded-milk production and original filled primary-pack upstream burdens,including loss-embedded upstream burden,from this service add-on. Require separately quantified original-gate lost-commodity adjustment and saleable-commodity burden exactly once in the linked commodity system before whole-chain completeness; actual service loss handling/treatment remains inside."
