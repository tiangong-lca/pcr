allocation_rules:
  - rule_id: allocation_count
    applies_to: "all inventory"
    rule: "Assign actual failure/quarantine/rejected-order,return-handling,idle/defrost and cleanup resources to their evidenced positive accepted cohort N or disclosed unfinished/cross-period responsibility; do not delete burdens where no accepted output yet exists. No currency/margin allocation as a physical service unit."
    source_ids: []
  - rule_id: allocation_merchandise
    applies_to: "milk stock and loss linkage"
    rule: "Reconcile pack counts,SKU/lot,status and compatible measured liquid/whole-pack quantities across opening,net receipts,buyer returns,closing,sales,supplier returns,quarantine release and discard. Quarantine movements are internal stocks,not a new receipt or accepted output. Quantify original-gate lost milk and associated primary-pack burden using actual unit,density-temperature/conversion basis/source and owner/already-included scope,then link it once outside this service."
    source_ids: []
  - rule_id: allocation_supply
    applies_to: "extra supplies and usable_extra_returns"
    rule: "For each actual native supply,S=attributed opening+external net receipts-closing including recovered closing; net receipts use actual gross/tare where applicable. Choose gross supply INPUT S with a separate matched usable outward-return OUTPUT,OR consumed-only INPUT S-return with the matched return exchange omitted. Do not subtract twice,call closing stock outward return or remove waste/spill upstream burden."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "shared_assets"
    rule: "Full-life asset equivalents equal cohort compatible use driver / complete lifetime driver across every consuming lot/site/period,then divided by N once. Include manufacture,cleaning/maintenance,replacement and EOL. Use observed lifetime or actual history plus evidenced remainder/termination,compatible driverunits,uncertainty/sensitivity/update. A lifecycle-complete per-driver provider is an alternative view,not another additive asset burden."
    source_ids: []
  - rule_id: allocation_period
    applies_to: "shared refrigeration and providers"
    rule: "Within each compatible meter/operation period allocate measured complete scope by cohort physical driver / all-consumer driver; include idle/defrost/door/cleanup and reconcile total scope across all cohorts. Carry unfinished stocks and replacements between periods once."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "actual loss and packing paths"
    rule: "Keep actual unopened compound reject,actual leaked milk,cleaning effluent and separated packaging mutually nonduplicative. Merchandise returns are not new service supply returns; no automatic waste/recycling/coproduct/avoided-production credit. Waste treatment boundary must match actual provider,including any transport coverage once."
    source_ids: []
  - rule_id: allocation_refrigerant
    applies_to: "refrigerant_makeup; usable_refrigerant_return; refrigerant_waste; refrigerant_air"
    rule: "Assign actual initial factory charge and any fluid-production burden already inside complete equipment manufacture/provider dataset to one owner,not an additional repeated fluid input. Recovered fluid retained at closing is stock; actual usable external return is a separate Product outlet only with receiver/state proof; actual nonusable fluid goes to documented recovery/treatment Waste outlet. Apply gross supplied input plus separate matched usable return OR consumed-only input less that return with matched return exchange omitted. Retain nonreturned waste/release upstream burden and actual transport/treatment once; no automatic recycling/substitution credit. Consumed-only subtraction is permitted ONLY for a return matched to the same independently supplied operating-fluid inventory and its upstream burden scope. Recovered usable fluid originating in an initial factory/equipment charge already carried by an asset/provider dataset must NOT reduce unrelated operating make-up supply; record its actual outward Product transfer with no automatic credit and retain the asset-fluid burden owner. Close initial equipment charge,stored fluid,actual external receipts,internal recovery/transfers,final charge and retained stocks physically; recovery is an internal movement,not a new external receipt. Unknown/mixed origin requires evidenced provenance/apportionment before any supply subtraction,never a negative unrelated make-up input."
    source_ids: []
  - rule_id: source_scope_normalization
    applies_to: "nonexchange commodity and service combination"
    rule: "Keep original external commodity stock, source assignment/loss and missing-stage/additional upstream integration quantities in their evidenced RAW actual scope. Identify whether each amount is one actual consignment, a target service cohort, or ALREADY per reference,with source/target scope IDs and quantity basis. The physical source-cohort all-exit denominator assigns RAW quantity to that target scope; it is not automatically the target accepted-service N. Only when combining that same target-scope commodity amount with the 1 Item(s) service derive amount per reference = RAW assigned amount / positive unique accepted source_same_scope_N,with acceptance IDs/time/reversal evidence. A proved single-case scope has source_same_scope_N=1; an already-per-reference amount is not divided again. Preserve raw integration quantities and source links; do not shrink actual upstream remediation or divide the whole source cohort by an unrelated N. N0 responsibility remains disclosed without division."
    source_ids: []
