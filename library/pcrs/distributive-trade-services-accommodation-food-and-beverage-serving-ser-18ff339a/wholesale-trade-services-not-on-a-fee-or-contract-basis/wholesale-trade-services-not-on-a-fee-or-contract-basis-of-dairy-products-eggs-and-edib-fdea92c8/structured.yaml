    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The bounded preservation intervention accepts already released chilled sealed milk,operates monitored refrigeration and stock rotation under actual product conditions,and hands over unopened accepted merchandise within its declared cold-chain responsibility. It does not manufacture safer milk or reset shelf life. Actual excursions,seal failures,quarantine,returned lots and cleaning/defrost are traced to the owning lot/period."
