      unit: "kg"
      frequency: "each real source/release event"
      temporal_coverage: "actual attributed operation/cleanup periods"
      site_scope: "direct actual sources,excluding embedded providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Measurement or matched source/activity/basis and uncertainty"
  calculation_rules:
    - id: normalize_consignment
      applies_to: "all inventory rows"
      rule: "Divide attributed physical exchange quantity by positive N once; accepted_service is 1 Item(s),not pack count or milk volume."
      inputs:
        - "attributed quantity"
        - N
        - "linked collection protocol"
      output: "exchange quantity per reference flow"
      source_ids: []
    - id: period_driver
      applies_to: "electricity; provider_jobs; freight; electricity_ac"
      rule: "For each compatible period multiply measured complete scope by cohort driver/all-consumer driver,then sum nonoverlapping periods and apply normalize_consignment."
      inputs:
        - "period quantity"
        - "cohort driver"
        - "all-consumer driver"
        - "compatible units"
        - "scope ownership"
      output: "attributed physical quantity"
      source_ids: []
    - id: asset_driver
      applies_to: "shared_assets"
      rule: "Use cohort compatible lifetime-use driver divided by complete lifetime driver as asset equivalents; apply normalize_consignment once. Never add equivalent complete per-driver provider scope for the same asset."
      inputs:
        - "full asset lifecycle"
        - "cohort driver"
        - "lifetime driver and units"
        - history
        - "evidenced remainder"
        - termination
        - cp_assets
      output: "attributed complete asset equivalents"
      source_ids: []
    - id: stock_supply
      applies_to: "diesel; cleaning_products; secondary_packing; usable_extra_returns; cleaning_products_synthetic_detergent; secondary_packing_pe_film"
      rule: "S=attributed opening+external net receipts-closing including recovered closing. Gross INPUT S and separate matched unused return OUTPUT OR consumed-only INPUT S-return omitting that return exchange. Actual fuel burn,waste and uncontained loss remain distinct fates."
      inputs:
        - opening
        - "gross and tare receipts"
        - "net receipts"
        - closing
        - "matched usable return"
        - representation
        - "actual burn"
        - cp_fuel
        - cp_supplies
      output: "nonduplicated supply/return quantities"
      source_ids: []
    - id: milk_loss_link
      applies_to: "sealed_rejects; collected_milk_loss; collected_milk_loss_atomic_case; sealed_rejects_atomic_case"
      rule: "Use SKU/lot/pack genealogy and actual contents/primary-pack disposition to quantify excluded upstream original-gate lost commodity amount and burden in linked commodity chain. Match actual units,liquid netmass/density-temperature and conversion evidence/owner; never infer original milk from total cleaning liquid or duplicate wholepack/parts."
      inputs:
        - "actual source lot"
        - "original gate and dataset"
        - "pack count"
        - "label volume"
        - "actual liquid mass/density/temp"
        - "primary pack status"
        - "conversion basis/source"
        - "loss owner and already-included scope"
        - "integration result"
        - cp_lots
        - cp_loss
      output: "quantified separate original-gate milk/primary-pack loss adjustment"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all actual exchanges"
      requirement: "Verify exact flow,property/unit group,state/medium and gate before final exchange use; keep unresolved actual configuration and support gaps explicit."
      evidence: "Full detail/support/compatibility proof"
    - id: quality_cold
      applies_to: "sealed_milk_distribution"
      requirement: "Actual release,seals,manufacturer conditions,time-temperature excursions and quarantine/acceptance disposition must be traceable; no shelf-life reset or guaranteed safety from a PCR pass."
      evidence: "Lot/label/logger/decision records"
    - id: quality_quantities
      applies_to: "milk and losses"
      requirement: "Label volume,actual liquid mass,density-temperature,pack count,primary tare and cleaning-water mixture stay distinct with measured source evidence."
      evidence: "Weighing/composition/conversion and stock reconciliation"
    - id: quality_resources
      applies_to: "all actual resources"
      requirement: "Verify own/provider/transport/coldchain,full-asset life and actual environmental/waste scope once; investigate gaps rather than assumed zeros."
      evidence: "Coverage/period/driver/receiver/lifetime records"
    - id: quality_chain
      applies_to: "full commodity chain"
      requirement: "Quantify saleable and lost commodity upstream including original primary packaging once outside this add-on before complete-chain use."
      evidence: "Original-gate conversion and actual integrated scope evidence"
    - id: electricity
      applies_to: "sealed_milk_distribution"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Include actual cold-room compressors/fans/defrost,lighting and handling meters, with their consumer periods; do not repeat carrier/provider-embedded electricity. Range evidence need: Need actual room/product/ambient conditions,meters,occupancy and idle/defrost/changeover records with physical all-consumer driver; no universal kWh per pack or tonne. Measurement evidence: protocol cp_cold; original record basis Energy / kWh. The original amount constraint “Attributed measured electricity / N; cp_cold.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_cold; actual source-linked native records"
    - id: cleaning_water
      applies_to: "sealed_milk_distribution"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Record actual premises/container cleaning, not processing or diluting the milk; no water enters unopened merchandise in normal service. Actual environmental water requires a source-specific input. Range evidence need: Need use,outlet and retention evidence,including any milk-contaminated cleanup state; wastewater volume is not pure water or a default milk loss. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Actual metered attributable water / N; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_water; actual source-linked native records"
    - id: cleaning_products
      applies_to: "sealed_milk_distribution"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Actual SKU/formulation for floors/equipment, not a prescribed food-contact chemical or milk ingredient. Native volume/count supplies require own exchanges or evidenced conversion. Range evidence need: Need native quantity,active/carrier composition,actual dilution and unit/density/temperature source; no amount or emission inferred from a safety label. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Attributed preparation supplied / N; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_products_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: secondary_packing
      applies_to: "sealed_milk_distribution"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Only additional wraps/liners/labels/cartons actually supplied by the wholesaler. The prefilled bottle/carton and primary closure already belong to the merchandise upstream chain, not a new packing input for each resale. Range evidence need: Need actual native Count/Area/Length/Mass unit,stock and return proof; expand native unit and make any mass view nonadditive, no assumed wrap per order. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Attributed added packing supply / N; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: secondary_packing_pe_film; secondary_packing_paperboard_carton. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: refrigerant_makeup
      applies_to: "sealed_milk_distribution"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Record actual supplied fluid and composition separately from equipment charge,recovery,waste and release. No refrigerant type or make-up-to-emission equivalence is assumed. Range evidence need: Need mixture identity,component fractions/bases,service stocks and actual charging/recovery/fates with units; unresolved imbalance is investigated, not atmospheric loss by default. Measurement evidence: protocol cp_refrigerant; original record basis Mass / kg. The original amount constraint “Attributed supplied refrigerant mass / N; cp_refrigerant.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_refrigerant; actual source-linked native records"
    - id: provider_jobs
      applies_to: "sealed_milk_distribution"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Use a completed physically defined counted job only when full resource scope is documented. Providers sold by pallet-day,hour,mass,energy or freight require actual native-unit exchanges/support. Range evidence need: Need completion gate,resource/asset/temperature/treatment scope and overlap owner; payment is not physical completion and time is not Count. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “Assigned completed provider job quantity / N; cp_provider.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_provider; actual source-linked native records"
    - id: shared_assets
      applies_to: "sealed_milk_distribution"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Include actual refrigeration/warehouse/handling/monitoring assets and reusable crates with manufacture,cleaning/maintenance,replacements and end-of-life across all users and periods. Range evidence need: Need actual compatible lifetime driver,observed history and supported remainder/termination; crate trips are service use,not new crate manufacture every trip. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Assigned complete asset equivalents / N; cp_assets.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "sealed_milk_distribution"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Actual relevant load/route legs with unique commodity/carrier/service owner,including refrigeration and empty returns where covered. Use complete carrier scope or direct resources once. Range evidence need: Need actual loads/tare,distances,factors/units/sources and any allocation shares plus all-consumer drivers; record cold-chain handover and temperature-control responsibility. Measurement evidence: protocol cp_freight; original record basis Mass * distance / kg*km. The original amount constraint “Attributed actual kg*km / N; cp_freight.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: usable_extra_returns
      applies_to: "sealed_milk_distribution"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only matched actual unused secondary packing/cleaning supplies returned to external ownership. Merchandise returns,reusable crate circulation and closing stocks have separate ledgers. Range evidence need: Need original supply identity/native quantity,state and receiver,with either gross input/separate return output or consumed-only input omitting matched return exchange. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Measured attributable outward usable supply return / N; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_extra_returns_detergent_return; usable_extra_returns_pe_film_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: usable_refrigerant_return
      applies_to: "sealed_milk_distribution"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Only measured actual usable fluid crossing outward to a documented owner/gate. Fluid recovered and retained as closing stock is not an outward export; do not assume recovered fluid is usable without state/receiver evidence. Its original charge/supply provenance must be identified; an asset-carried initial charge is not a reduction of operating make-up. Range evidence need: Require matched fluid/composition/native mass,transfer/receiver and original supply ownership. Apply gross supply input with separate usable-return output OR consumed-only supply omitting that matched return exchange; no second subtraction or automatic substitution credit. Consumed-only subtraction needs matched same-scope standalone supply inventory; other provenance,including asset initial charge,remains a Product transfer without automatic credit or unrelated input subtraction. Recovered retained fluid is internal stock,not new receipt. Measurement evidence: protocol cp_refrigerant; original record basis Mass / kg. The original amount constraint “Measured attributable actual usable fluid outward / N; cp_refrigerant.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_refrigerant; actual source-linked native records"
    - id: sealed_rejects
      applies_to: "sealed_milk_distribution"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual documented waste disposition,not automatic classification of every expired,quarantined or returned unit. Record compound milk-plus-pack mass/state and receiver; if separated into contents/pack wastes,do not also count whole units. Range evidence need: Need actual disposition,pack count,gross/tare/net contents,label volume versus measured liquid mass/density/temp and separate original-gate lost-commodity linkage; do not treat an unopened pack as wastewater. Measurement evidence: protocol cp_lots; original record basis Mass / kg. The original amount constraint “Measured attributable whole sealed reject mass / N; cp_lots.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: sealed_rejects_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_lots; actual source-linked native records"
    - id: collected_milk_loss
      applies_to: "sealed_milk_distribution"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual accidental breach/leak collected as milk-containing liquid. Unopened normal service does not imply intentional decanting,reprocessing or a wastewater discharge. Range evidence need: Need actual composition,milk mass/density/temp,cleaning-water mixing and receiver; do not equate total mixed liquid mass with original milk or repeat whole-pack waste. Measurement evidence: protocol cp_loss; original record basis Mass / kg. The original amount constraint “Measured attributable collected liquid-milk waste / N; cp_loss.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: collected_milk_loss_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_loss; actual source-linked native records"
    - id: packing_waste
      applies_to: "sealed_milk_distribution"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only packing physically separated in actual loss handling or added packing used here. Original primary packaging production remains outside this service; actual waste handling remains inside,with whole-pack nonduplication. Range evidence need: Need actual material,tare/contamination and receiver/recovery evidence; no automatic substitution credit or assumption that all received primary packs become warehouse waste. Measurement evidence: protocol cp_waste; original record basis Mass / kg. The original amount constraint “Measured attributable separated packing waste / N; cp_waste.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: packing_waste_paper_pack; packing_waste_metal_pack; packing_waste_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_waste; actual source-linked native records"
    - id: cleaning_effluent
      applies_to: "sealed_milk_distribution"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual collected cleaning/defrost liquid with separately recorded milk/chemical contamination. Direct environmental discharge needs actual receiving water and substance exchanges,not this contained-waste proxy. Range evidence need: Need origin,actual volume/composition/density/temp,containment and treatment boundary; no drain equals pure milk or automatic emission species. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Metered or measured attributable contained effluent / N; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_effluent_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_water; actual source-linked native records"
    - id: refrigerant_waste
      applies_to: "sealed_milk_distribution"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Actual nonusable fluid removed to a verified receiving recovery/treatment operation,distinct from usable return,retained recovered stock and atmospheric components. Do not label every recovery as Waste or as emitted. Range evidence need: Require actual fluid/mixture composition,container tare,net fluid,transfer and receiver/treatment gate with complete transport/resource coverage once. Retain nonreturned upstream fluid-production burden and actual receiving recovery/disposal treatment without automatic credit. Measurement evidence: protocol cp_refrigerant; original record basis Mass / kg. The original amount constraint “Measured attributable contained waste fluid / N; cp_refrigerant.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_refrigerant; actual source-linked native records"
    - id: refrigerant_air
      applies_to: "sealed_milk_distribution"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Expand actual component mass and receiving air identity. Recovery,remaining equipment charge,contained fluid waste and external returns are separate fates; make-up alone does not prove release. Range evidence need: Need charge/stock/recovery/fate reconciliation and mixture fraction basis/source,uncertainty and investigated discrepancies; complete species factor is not multiplied twice. Measurement evidence: protocol cp_refrigerant; original record basis Mass / kg. The original amount constraint “Measured or audited actual component air release / N; cp_refrigerant.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_refrigerant; actual source-linked native records"
    - id: other_direct_species
      applies_to: "sealed_milk_distribution"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Conditional actual combustion,chemical spill,water or other non-refrigerant substance release,with actual medium. Milk/COD/total cleaner is not a default elementary species; actual direct water paths need dedicated exchanges. Range evidence need: Need substance/medium plus actual release or matched factor/composition/fate operands,units,bases and sources. Missing stock or milk mass is not inferred gaseous/aqueous emission. Measurement evidence: protocol cp_emissions; original record basis Mass / kg. The original amount constraint “Measured or justified actual-activity species release / N; cp_emissions.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: other_direct_species_co2_fossil_air; other_direct_species_methane_fossil_air; other_direct_species_nitrous_oxide_air. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_emissions; actual source-linked native records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "accepted_service"
    rule: "Require unique positive actual B2Bacceptance and reference qualifiers; pack,line,pallet or canceled/quarantined order is not automatically a completed consignment."
    source_ids: []
  - rule_id: validate_state
    applies_to: "sealed_milk_distribution"
    rule: "Confirm released pasteurized cow drinking milk,unopened primary seals,actual manufacturer conditions and observed cold-chain/lot/time gate. Reject rawmilk,UHTambient,reprocessing or generic other dairy substitution."
    source_ids:
      - codex-milk-hygiene-2004
  - rule_id: validate_units
    applies_to: "all inventory"
    rule: "Preserve actual supplier/provider units and compatible conversions,N and support; no1L=1kg,nominalpack=measuredmilk,margin=Count or energy-property substitute."
    source_ids: []
  - rule_id: validate_fates
    applies_to: "stock and losses"
    rule: "Returns/quarantine are actual lot states; sealedpack waste,actual separated milk/pack and contaminated cleaning water require exclusive quantities/receiver proof. No mass deficit or top-up alone proves emissions."
    source_ids: []
  - rule_id: validate_resources
    applies_to: "shared assets and providers"
    rule: "Full-life manufacture,cleaning/maintenance,replacement/EOL and compatible drivers/history/remainder/termination must be evidenced; close all-consumer meter/period totals and scope ownership."
    source_ids: []
  - rule_id: validate_release
    applies_to: "actual fluid/species exchanges"
    rule: "Require actual named refrigerant/substance,medium,activity/factor/composition/fate units,bases and sources,with uncertainty/unknowns disclosed. Complete species factors not multiplied by component/fate again."
    source_ids: []
  - rule_id: validate_chain
    applies_to: "commodity and service integration"
    rule: "No traded milk or original filled-pack production inside this add-on; quantify original-gate lost and saleable burden outside it exactly once with density-temperature/pack basis and disjoint transport/treatment before whole-chain completeness."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset when concrete exchange identities and actual evidence are complete"
  downstream_use: "Additive physical wholesale service to a compatible sealed pasteurized cow-milk commodity chain,with declared completed-consignment stratum"
  allowed_use: "Declared refrigerated own-account B2Broute and actual SKU,pack,mass/volume,state,time/gate and period conditions"
  excluded_use: "Full milk footprint alone; rawmilk,UHTambient,other dairy,manufacturing/pasteurization/filling/retail/agency; monetary margin; package/L/kg equivalence without evidence"
  required_metadata: "All reference qualifiers; actual original commodity/acceptance gates; positive N; lot/seal/thermal records; native units/pack-density state; actual provider/cold/logistics/waste/assetlife scope; loss linkage"
  required_quality_disclosure: "Unresolved identities/support and actual-config expansions; measurement/conversion/factor/Range limits; cold-chain excursions; resource/provider/assetlife coverage; commodity loss integration and uncertainty"
  update_trigger: "Changed SKU/fat/pack/thermal conditions,actual cold equipment or fluid,asset lifetime/use,provider/transport/treatment scope,loss basis/conversion,reference acceptance or source evidence"
data_sources:
  - id: "unsd-cpc3-wholesale-2025"
    type: "official_guidance"
    reference: "UNSD. CPC3.0 explanatory notes,division61; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Own-account processed-milk wholesale classification only; rawmilk/fresh shell eggs are not this61022product subset."
  - id: "codex-milk-hygiene-2004"
    type: "official_guidance"
