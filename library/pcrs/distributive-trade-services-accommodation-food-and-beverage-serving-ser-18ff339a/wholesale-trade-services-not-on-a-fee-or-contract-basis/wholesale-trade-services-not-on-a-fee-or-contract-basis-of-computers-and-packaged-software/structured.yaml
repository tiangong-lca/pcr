allocation_rules:
  - rule_id: final_service_count
    applies_to: "actual declared trade duties"
    rule: "Verify unique final owned-resold B2B consignment acceptances after reversals. Keep failed/reversed/unfinished event resources with actual duties/cohorts;N=0 prevents normalization,not a zero burden. No service conversion from device count,price,tax or licence."
    source_ids: []
  - rule_id: source_cohort
    applies_to: "actual declared trade duties"
    rule: "Use direct evidenced original-gate assignment OR assigned_source=original_gate_quantity*(compatible numerator driver/positive complete source_all_exit_driver). Record every competing terminal driver including closing/unsold/damaged retained,useful-other exits,returns and actual losses,each native unit/basis/method/state/time/source/owner/source link/exclusivity. Numerator and denominator belong to same complete source cohort;accepted-only denominator prohibited. Stage/loss coverage owner prevents repeated source burdens;actual disposal stays service."
    source_ids: []
  - rule_id: stock_and_life
    applies_to: "actual declared trade duties"
    rule: "Gross supply input S and separate matched unused return output OR consumed S-return input with matched output omitted;no numeric S+return or duplicate credit. Full asset burden uses compatible actual all-user lifetime driver,observed history plus sourced remainder/termination,not accepted-only period. No inherited device content return subtracts unrelated supply."
    source_ids: []
  - rule_id: exclusive_physical
    applies_to: "actual declared trade duties"
    rule: "Real whole/part/mixed/liquid/useful/direct transfers retain source burden owner and content audit links;actual receiver treatment once. Do not add retained component mass as another outlet or award automatic avoided production. Each actual freight load-leg share is inside its summand,then divide by N once."
    source_ids: []
  - rule_id: source_scope_normalization
    applies_to: "nonexchange commodity and service combination"
    rule: "Keep original external commodity stock, source assignment/loss and missing-stage/additional upstream integration quantities in their evidenced RAW actual scope. Identify whether each amount is one actual consignment, a target service cohort, or ALREADY per reference,with source/target scope IDs and quantity basis. The physical source-cohort all-exit denominator assigns RAW quantity to that target scope; it is not automatically the target accepted-service N. Only when combining that same target-scope commodity amount with the 1 Item(s) service derive amount per reference = RAW assigned amount / positive unique accepted source_same_scope_N,with acceptance IDs/time/reversal evidence. A proved single-case scope has source_same_scope_N=1; an already-per-reference amount is not divided again. Preserve raw integration quantities and source links; do not shrink actual upstream remediation or divide the whole source cohort by an unrelated N. N0 responsibility remains disclosed without division."
    source_ids: []
