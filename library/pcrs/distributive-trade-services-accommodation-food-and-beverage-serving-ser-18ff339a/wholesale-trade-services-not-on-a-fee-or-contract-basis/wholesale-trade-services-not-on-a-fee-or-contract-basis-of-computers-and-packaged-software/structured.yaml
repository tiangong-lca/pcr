  calculation_rules:
    - id: normalize
      applies_to: "all exchanges"
      rule: "Inventory per reference = assigned actual physical quantity / N,where N is positive unique FINAL source-verified owned-resold B2B commercial acceptances after reversals. At N=0 retain actual duties and report no normalized value."
      inputs:
        - "actual native quantities"
        - "final acceptance and reversal records"
      output: "native quantity per 1 Item(s) service"
      source_ids: []
    - id: device_mass_hierarchy
      applies_to: "nonexchange merchandise"
      rule: "For each unique parent box/carton use actual extent EACH/TOTAL and sourced child count once. Net complete device mass=sum unique packed child(gross-external packing tare);included cord and actual device components remain product,not tare. Reconcile actual device count and component BOM without adding parent+child masses. Optional component mass requires actual matching component fraction/basis and whole composition scope;not all device kg as polymer or copper."
      inputs:
        - cp_keyboards
        - "independent native gross/tare/count/component evidence"
      output: "unique native complete-device and component audit"
      source_ids: []
    - id: original_gate_assignment
      applies_to: "commodity outside service"
      rule: "Direct trace OR assigned_source=original_gate_quantity*numerator_driver/positive complete source_all_exit_driver. Native source_all_exit_driver_records enumerate compatible exclusive accepted,closing/unsold/damaged-retained,useful-other,return and actual loss demands,each quantity/unit/basis/method/state/time/source/owner/original-source link and numerator membership. No terminal demand omitted or accepted-only denominator. Original/assigned/loss/baseline-covered/additional amounts have compatible original finished-SKU state conversions and stage/loss coverage owner. Integrate additional uncovered commodity demand outside service once before complete chain;retain actual service handling/treatment once."
      inputs:
        - cp_keyboards
        - "original gate and all-terminal records"
        - "coverage/conversion evidence"
      output: "completed external source-demand/loss integration"
      source_ids: []
    - id: physical_content_closure
      applies_to: "actual stock and fates"
      rule: "Source content audits close to retained accepted/returned/closing,retained whole-deviceWaste/partWaste/mixedWaste,actual useful independent exports,independent nonusable/liquid and measured direct species,plus explicit unknown discrepancy. Each native term unit/basis/method/state/time/source/conversion required. Retained contents nonadditive to carriers;only actual separate transfers create outlets. Actual added contaminants/carrier/water not original device loss;no residual emission. Wet/dry water adjustment only as specified in cp_fates with matching definitions and native factors."
      inputs:
        - cp_keyboards
        - cp_fates
        - cp_water
        - cp_species
        - "linked source/carrier records"
      output: "exclusive source and physical fate closure"
      source_ids: []
    - id: supply_and_lifetime
      applies_to: "independent supplies and assets"
      rule: "Supply S=opening+net_receipts-closing with actual recoveries once;net_receipts excludes receipt-container tare and closing includes retained stock once;choose gross S input with matched unused output OR consumed S-return input OMIT matching output. Full asset attribution=complete manufacture/maintenance/cleaning/replacement/EOL burden*compatible cohort_used_driver/complete_lifetime_driver. Lifetime=observed history+sourced remaining driver or evidenced termination;all users/periods retained. Each native driver has unit/basis/method/state/time/source/equivalence;positive denominator,uncertainty/sensitivity/update required."
      inputs:
        - cp_supplies
        - cp_assets
        - "native stock and complete life histories"
      output: "assigned actual consumable and full-life asset burdens"
      source_ids: []
    - id: freight_sum
      applies_to: "packed_freight"
      rule: "Freight=sum over unique load+leg[(converted actual direct payload OR converted gross-noncargo tare,retaining cargo pack/support)*(actual repeat count only if EACH; TOTAL unchanged)*converted actual distance*THAT record causal share]/positive N. Independent gross/tare/payload/count/distance/share native units,bases,methods,state/time/sources and conversions required. Parent/child cargo exclusive;share inside each summand,N once,provider/empty duties once."
      inputs:
        - cp_freight
        - "unique native load-leg and physical driver records"
      output: "actual kg*km per 1 Item(s) service"
      source_ids: []
  data_quality_requirements:
    - id: actual_identity
      applies_to: "all actual exchanges"
      requirement: "Exact concrete identities/gates/native property/unit and actual source configurations required before final data use;marketing and rankings do not verify UUIDs."
      evidence: "Full identity/support detail and native foreground source records"
    - id: hierarchy_content
      applies_to: "stock and fates"
      requirement: "Regional SKU/layout/includedcord/completeBOM and unique parent-child native netmass/tare/state evidence;whole electronics and retained contents nonadditive,no assumed ingredient fractions or pure-metal recovery."
      evidence: "Actual model/BOM/pack/weigh/composition and receiver records"
    - id: complete_chain
      applies_to: "declared service and linked source chain"
      requirement: "Complete source demand/loss baseline/additional integration outsideonce,actual handling/treatment and full provider/resource/all-user life/native freight insideonce,with uncertainty/update and unresolved gaps."
      evidence: "All-terminal native source/coverage/owner/conversion/integration,meters/life/carrier/receiver evidence"
    - id: warehouse_power
      applies_to: "boxed_wired_keyboard_trade"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Include attributable lighting,handling and stock-record equipment,idle and actual housekeeping. Traded USB keyboards are merchandise,not powered warehouse ICT assets;manufacturer plug-and-play text does not prescribe merchant energization or tests. Range evidence need: Actual meter/equipment periods and complete physical all-consumer attribution are needed;no keyboard wattage or published product footprint substitutes. Measurement evidence: protocol cp_power; original record basis Energy / kWh. The original amount constraint “Assigned actual native physical quantity / N; cp_power.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: warehouse_power_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_power; actual source-linked native records"
    - id: housekeeping_water
      applies_to: "boxed_wired_keyboard_trade"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Only actual premises/handling-equipment housekeeping water;no keyboard wash,spill demonstration or cleaning preparation is assumed. Distinguish supplied water from actual environmental abstraction. Range evidence need: Need native supply,retained fluid,free collected liquid and any measured direct-water fates;damage or stock deficit is not water discharge. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Assigned actual native physical quantity / N; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: housekeeping_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_water; actual source-linked native records"
    - id: housekeeping_materials
      applies_to: "boxed_wired_keyboard_trade"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand actual supplied cleaning SKU,wipes,absorbents or filters only when used. Internal device polymers,electronics and cable insulation remain inherited merchandise constituents. Range evidence need: Need native stock amounts,formulation/carrier composition and measurement units,methods,sources;no prescribed detergent or dose. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Assigned actual native physical quantity / N; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: housekeeping_materials_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
