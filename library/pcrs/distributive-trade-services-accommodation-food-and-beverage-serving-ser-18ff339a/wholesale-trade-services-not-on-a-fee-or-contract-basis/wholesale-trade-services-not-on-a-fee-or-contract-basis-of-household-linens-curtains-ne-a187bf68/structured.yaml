allocation_rules:
  - rule_id: allocation_accepted
    applies_to: "all inventory"
    rule: "Normalize actual assigned quantities by positive unique accepted N once,using evidenced physical cohort/period drivers. Include failed orders,incomplete/quarantined stock,returns,idle/cleanup and unfinished-period duties; no activity deletion when current N=0. Do not use sales value or margin as physical service count."
    source_ids: []
  - rule_id: allocation_merchandise
    applies_to: "nonexchange stock"
    rule: "Close actual assigned opening,net receipts,buyer returns,closing,accepted transfers,supplier returns,other external exits and discard by exclusive set/component states. Incomplete/quarantine movements remain internal. Distinguish lost component textile from remaining usable pieces,original tare and moisture/state change; use actual original finished-set gate quantities/conversions,coverage owner and completed once-only commodity integration. Seed cotton,lint or woven fabric alone omits finished set stages."
    source_ids: []
  - rule_id: allocation_materials
    applies_to: "new supplies and return"
    rule: "Let S=assigned opening+true external net receipts-closing including retained recovered materials. Gross supply INPUT S with separate same-scope matched usable return OUTPUT OR consumed-only INPUT S-return omitting that outward exchange. No numerical S+return input,double deduction,internal recovery as new receipt or removal of nonreturned waste/spill upstream supply burden."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "resources/assets/providers"
    rule: "For compatible measured periods,use cohort physical driver/all-consumer driver on complete resource scope. Full-life asset equivalents use compatible cohort driver/complete lifetime driver across all users/periods,with manufacture,maintenance/cleaning,replacements and EOL. Establish observed life or history plus evidenced remainder/termination,source/units,uncertainty,sensitivity and update. Complete provider representation replaces overlapping own scope rather than adding it."
    source_ids: []
  - rule_id: allocation_outlets
    applies_to: "actual waste and direct releases"
    rule: "Use actual mutually exclusive whole-package or separated textile/packing/cleanup quantities and actual receiver,transport/treatment once. Wet stream and its moisture/fibre/material fractions are composition views,not extra additive outlets. No automatic recycling/substitution credit or waste deduction from supply. Direct species require actual medium and supported fate; stock/moisture deficit is unresolved until explained."
    source_ids: []
  - rule_id: source_scope_normalization
    applies_to: "nonexchange commodity and service combination"
    rule: "Keep original external commodity stock, source assignment/loss and missing-stage/additional upstream integration quantities in their evidenced RAW actual scope. Identify whether each amount is one actual consignment, a target service cohort, or ALREADY per reference,with source/target scope IDs and quantity basis. The physical source-cohort all-exit denominator assigns RAW quantity to that target scope; it is not automatically the target accepted-service N. Only when combining that same target-scope commodity amount with the 1 Item(s) service derive amount per reference = RAW assigned amount / positive unique accepted source_same_scope_N,with acceptance IDs/time/reversal evidence. A proved single-case scope has source_same_scope_N=1; an already-per-reference amount is not divided again. Preserve raw integration quantities and source links; do not shrink actual upstream remediation or divide the whole source cohort by an unrelated N. N0 responsibility remains disclosed without division."
