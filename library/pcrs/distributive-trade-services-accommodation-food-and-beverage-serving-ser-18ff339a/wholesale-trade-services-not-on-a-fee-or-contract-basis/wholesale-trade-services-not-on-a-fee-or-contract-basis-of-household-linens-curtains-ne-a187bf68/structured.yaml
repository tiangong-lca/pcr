    - id: separated_textile_waste
      applies_to: "packaged_bedlinen_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual separated damaged components or collected spill/tear residues only. No routine cutting,repair,reassembly or fibre shedding is assumed. Expand actual fibre/material/state and receiver,excluding already-counted whole sets. Range evidence need: Require component quantities,net mass/fibre fractions/moisture method/state and actual receiving route; dry-mass change is not automatically dry cotton loss or atmospheric fibre. Measurement evidence: protocol cp_waste; original record basis Mass / kg. The original amount constraint “Assigned measured separated textile waste / N; cp_waste.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: separated_textile_waste_cotton_linen_piece. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_waste; actual source-linked native records"
    - id: separated_pack_waste
      applies_to: "packaged_bedlinen_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual packaging physically removed at this boundary with material/tare and receiver. Inherited primarypack manufacture stays with commodity upstream; its actual service handling/treatment occurs here once. Range evidence need: Need actual removal/contamination,tare,native units and recovery/treatment gate; every received set does not imply a discarded wrapper or recycling credit. Measurement evidence: protocol cp_waste; original record basis Mass / kg. The original amount constraint “Assigned measured separated packing waste / N; cp_waste.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: separated_pack_waste_paper_pack; separated_pack_waste_metal_pack; separated_pack_waste_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
