validation_rules:
  - rule_id: validate_reference
    applies_to: "accepted_service"
    rule: "Require unique actual commercial B2B acceptance,all qualifiers and positive N. Set count,piece count,pallet move,quarantine and canceled order do not automatically complete one reference service."
    source_ids: []
  - rule_id: validate_set_identity
    applies_to: "merchandise"
    rule: "Verify actual set bill-of-components,sizes,counts,fibre/nonfibre/net mass/moisture/tare and package condition at stated gate; no universal two/four-piece set,area-to-mass or cotton-lint-to-set conversion."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "all duties"
    rule: "No consumer prewash/iron/freezer/wrapping instruction becomes an operation or input. Actual added treatment/repair/repacking needs reviewed expanded route; own/provider/carrier/full-life asset/receiving scopes must be complete and nonoverlapping."
    source_ids:
      - sferra-care-public
  - rule_id: validate_chain
    applies_to: "commodity outside service"
    rule: "Original released sewn finished packed-set baseline must contain missing spinning/weaving/dyeing-finishing/cutting/sewing/assembly/primarypack stages once outside service,as actually relevant. Match assigned demand,state change and original-gate whole/partial loss amount/unit/conversion/source,other exits,owner/already-covered loss and actual integration result."
    source_ids: []
  - rule_id: validate_native_fates
    applies_to: "all exchanges"
    rule: "Verify native flow/property/unit support and quantitative provenance. Actual waste receiver/treatment and direct substance/medium/factor/composition/fate evidence are required; no invented fibre shedding,evaporation or whole-set discard from quality status."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual quantity and concrete identity review"
  downstream_use: "Physical ambient own-account wholesale add-on to complete released packaged cotton bed-linen commodity chain"
  allowed_use: "Actual declared set components/sizes/fibre/net/moisture/tare,package condition,period and accepted B2Broute"
  excluded_use: "Standalone whole-bedlinen footprint; cotton/textile/set manufacture; consumer care/use; other household textiles; active treatment/repair/repacking; retail/agency; set=service or price proxy"
  required_metadata: "All qualifiers,actual set/component stocks and losses,original finished-gate assigned demand/state/conversion/coverage/owner/integration,full resource/asset/provider/carrier/receiver boundaries"
  required_quality_disclosure: "Unresolved concrete identities/support,foreground quantities/Range evidence,component/moisture/state/fate limits,source consumer context and lifetime/conversion uncertainty"
  update_trigger: "Changed set bill-of-components,size/fibre/pack,warehouse operation,actual treatment,provider/asset/carrier/receiver scope,acceptance or demand/loss conversion evidence"
