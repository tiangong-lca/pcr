  calculation_rules:
    - id: normalize
      applies_to: "all inventory"
      rule: "Actual assigned quantity / positive unique N once; accepted_service is 1 Item(s)."
      inputs:
        - "assigned quantity"
        - N
        - "linked protocol"
      output: "exchange quantity per reference flow"
      source_ids: []
    - id: supply_stock
      applies_to: "materials and usable_material_return"
      rule: "Let S=assigned opening+true external net receipts-closing including retained recovered materials. Gross supply INPUT S with separate same-scope matched usable return OUTPUT OR consumed-only INPUT S-return omitting that outward exchange. No numerical S+return input,double deduction,internal recovery as new receipt or removal of nonreturned waste/spill upstream supply burden."
      inputs:
        - opening
        - "external net receipts"
        - "closing including retained recovery"
        - "same-scope matched return"
        - representation
        - cp_materials
      output: "nonduplicated supply and outward-return quantities"
      source_ids: []
    - id: shared_lifetime
      applies_to: "power/assets/providers/freight"
      rule: "For compatible measured periods,use cohort physical driver/all-consumer driver on complete resource scope. Full-life asset equivalents use compatible cohort driver/complete lifetime driver across all users/periods,with manufacture,maintenance/cleaning,replacements and EOL. Establish observed life or history plus evidenced remainder/termination,source/units,uncertainty,sensitivity and update. Complete provider representation replaces overlapping own scope rather than adding it."
      inputs:
        - "meter periods"
        - "resource scope"
        - "cohort/all-user/lifetime drivers/units"
        - "history/remainder/termination sources"
        - cp_assets
      output: "attributed resources/full-life asset equivalents"
      source_ids: []
    - id: original_set_demand_loss
      applies_to: "commodity outside service"
      rule: "Exclude ALL merchandise textile and primarypack manufacture including lost merchandise from service exchanges. Outside this additive service,require a compatible released sewn/finished packed-set baseline with separately quantified original-gate assigned demand/state change/loss,other exits,existing loss coverage and owner integrated once before whole-chain completeness. Actual loss handling and receiving treatment remain service duties once. Close actual assigned opening,net receipts,buyer returns,closing,accepted transfers,supplier returns,other external exits and discard by exclusive set/component states. Incomplete/quarantine movements remain internal. Distinguish lost component textile from remaining usable pieces,original tare and moisture/state change; use actual original finished-set gate quantities/conversions,coverage owner and completed once-only commodity integration. Seed cotton,lint or woven fabric alone omits finished set stages."
      inputs:
        - "original finished-set dataset/gate"
        - "assigned demand"
        - "set/component state/quantity"
        - "dimensions/fibre/net/moisture/tare"
        - "loss unit/conversion/source"
        - "other exits/coverage/owner/integration result"
        - cp_sets
      output: "quantified original finished-set demand/loss burden outside service"
      source_ids: []
  data_quality_requirements:
    - id: quality_actual_identity
      applies_to: "all inventory"
      requirement: "Verify actual concrete flow,state/gate,property/unit and medium before final use; configuration-dependent umbrellas expand by actual identity."
      evidence: "Full details/support proof"
    - id: quality_sets
      applies_to: "merchandise"
      requirement: "Actual set/component completeness,size,composition and measured net/moisture/tare with exclusive dispositions; no universal set recipe or fibre yield."
      evidence: "Manufacturer bill-of-components,measured lot and receiver records"
    - id: quality_scope
      applies_to: "all responsibilities"
      requirement: "Complete commodity integration outside service and actual native operating/provider/full-life asset/carrier/receiving scope once,with uncertainty and updates."
      evidence: "Original gate/conversion/coverage,meter/lifetime/receiver/integration proof"
    - id: warehouse_electricity
      applies_to: "packaged_bedlinen_trade"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Include actual electric lifting,picking,lighting,stock terminals and idle/cleanup periods attributable to the route. Ordinary ambient storage is not evidence of an active drying or climate-treatment process. Range evidence need: Need actual period meters and causal occupancy/handling/all-consumer drivers with scope; no energy per set from product labels. Measurement evidence: protocol cp_power; original record basis Energy / kWh. The original amount constraint “Assigned metered electricity / N; cp_power.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: warehouse_electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_power; actual source-linked native records"
    - id: premises_water
      applies_to: "packaged_bedlinen_trade"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Water is for evidenced premises/equipment cleaning only; normal packaged merchandise receives no laundering,wetting or steam treatment here. Any environmental intake uses its real source exchange. Range evidence need: Need source/meter,use and measured contained/direct/retained paths; textile moisture observation does not quantify water intake or evaporation. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Assigned measured supplied volume / N; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: premises_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_water; actual source-linked native records"
    - id: housekeeping_materials
      applies_to: "packaged_bedlinen_trade"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Record actual commercial material/SKU,active/carrier basis and actually supplied wipes,absorbents or filters in their native units,without prescribed use. Do not import consumer laundry detergent,softener,bleach or care-guide doses into unopened bed-linen trade. Range evidence need: Need actual receipts,use,dilution and density/temperature/unit sources; preparation and contained active views cannot become duplicate inputs. Measurement evidence: protocol cp_materials; original record basis Mass / kg. The original amount constraint “Assigned native preparation supply / N; cp_materials.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: housekeeping_materials_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_materials; actual source-linked native records"
    - id: additional_outer_packing
      applies_to: "packaged_bedlinen_trade"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Only new outer cases,protective sheets,labels or ties actually supplied for this service. Finished set wrapping,inserts and sewn care labels inherited from the factory belong to commodity manufacture outside the service. Range evidence need: Require native count/area/length/mass,material,stock/tare and actual conversion; no mandatory replacement wrapping or fixed bag per set. Measurement evidence: protocol cp_materials; original record basis Mass / kg. The original amount constraint “Assigned actual new packing supply / N; cp_materials.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: additional_outer_packing_pe_film. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_materials; actual source-linked native records"
    - id: external_physical_jobs
      applies_to: "packaged_bedlinen_trade"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Only completed physically defined Count jobs at actual contract gate with complete resources/assets. Providers measured by mass,time,area-time or transport need their corresponding native identity instead. Range evidence need: Need provider resource/asset/transport/treatment coverage and completion units,not procurement price or an order automatically equated with one job. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “Assigned completed native jobs / N; cp_provider.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_provider; actual source-linked native records"
    - id: complete_life_assets
      applies_to: "packaged_bedlinen_trade"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Cover actual buildings,racks,handling/IT equipment and reusable pallets/containers across all consumers; include manufacture,maintenance/cleaning,replacements and end-of-life with unique owner. Range evidence need: Require compatible all-user cohort/lifetime driver identities/units,observed history and evidenced remainder/termination/source,sensitivity/update; actual return trips do not create another asset. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Attributed complete asset equivalents / N; cp_assets.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: assigned_freight
      applies_to: "packaged_bedlinen_trade"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Use actual legs with complete carrier/load/empty coverage and any carrier-owned conditioning. State which inbound/outbound leg belongs to commodity or service to prevent duplicated logistics. Range evidence need: Need measured gross/tare/net load,route distance and conversion factors/units/sources plus actual share/all-user drivers,not nominal capacity or guessed kilometres. Measurement evidence: protocol cp_transport; original record basis Mass * distance / kg*km. The original amount constraint “Assigned actual load-distance / N; cp_transport.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_transport; actual source-linked native records"
    - id: usable_material_return
      applies_to: "packaged_bedlinen_trade"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only actual unused same-scope service materials transferred to external owner. Usable bed-linen buyer/supplier returns remain merchandise stock; recovered retained materials and reusable assets are not this export. Range evidence need: Need native same-scope provenance,quantity/state and receiver; gross supply S plus separate outward return OR net matched supply S-return omitting return exchange,without a second credit. Measurement evidence: protocol cp_materials; original record basis Mass / kg. The original amount constraint “Assigned measured usable external return / N; cp_materials.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_material_return_detergent_return; usable_material_return_pe_film_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_materials; actual source-linked native records"
    - id: discarded_packaged_sets
      applies_to: "packaged_bedlinen_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual documented waste decisions and receiver/treatment. Incomplete set,stain,damaged packaging,return or quarantine is not automatically whole-set disposal. Whole packed waste must exclude the same separated textiles/packaging. Range evidence need: Need set/piece genealogy,actual textile/pack/tare mass and moisture/disposition,plus original finished-gate loss conversion/owner; missing pillowcase does not prove every component was lost. Measurement evidence: protocol cp_sets; original record basis Mass / kg. The original amount constraint “Assigned measured whole-package waste / N; cp_sets.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: discarded_packaged_sets_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
