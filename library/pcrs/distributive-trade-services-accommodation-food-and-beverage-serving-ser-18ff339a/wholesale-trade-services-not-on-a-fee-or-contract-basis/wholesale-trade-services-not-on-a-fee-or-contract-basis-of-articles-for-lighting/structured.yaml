allocation_rules:
  - rule_id: actual_shared_use
    applies_to: "all service rows"
    rule: "Assign direct event quantities first. Shared warehouse/handling/support needs evidenced compatible physical drivers across ALL users/periods including idle/rejected/unfinished activity, then divide assigned total by positive accepted N once; no automatic equal fixture/invoice/revenue share."
    source_ids: []
  - rule_id: asset_scope
    applies_to: "shared_assets"
    rule: "Use full manufacture/maintenance/actual replacement/end-of-life with actual used/compatible lifetime driver, observed history plus sourced evidenced remainder/termination and uncertainty/sensitivity/update. Choose asset-equivalent or lifecycle-complete provider view once, never both or repeated per-N."
    source_ids: []
  - rule_id: supply_return
    applies_to: "operating supplies"
    rule: "For actual native standalone SKU/state S=assigned opening+net external receipts-closing including retained recovery. Gross-with-outlets uses S/N and real matched usable return; consumed-only uses (S-matched return)/N and OMITs that return exchange. Internal loops remain stock, waste/loss retains upstream production, no unrelated or negative netting."
    source_ids: []
  - rule_id: original_whole_gate
    applies_to: "merchandise"
    rule: "Reconcile actual complete original boxed-fixture source quantities to assigned accepted demand, proven discard/state-change demand, closing and useful returns/other exits in original unit/state with actual whole-part conversions and exclusive allocation. Missing/damaged one component is not automatically one whole-fixture loss. Additional linked demand=actual required original-gate demand minus identical baseline covered demand/loss, matching stages/state once outside service; assemble missing fixture manufacture/assembly/boxing beyond bare modules/materials outside. No rated lumen/watt/lifetime or nominal pack mass multiplier."
    source_ids: []
  - rule_id: receiver_nonoverlap
    applies_to: "all outlets"
    rule: "Whole discarded fixture/pack, LED/driver/body/diffuser/pack component audits, cleanup carrier+absorbed contents and free liquid are non-additive measured receiver views. Treatment has one owner; useful commodity returns remain stock audit and no automatic avoided-manufacture/recycling credit applies. Unknown source/receiver scope blocks complete-chain readiness."
    source_ids: []
  - rule_id: commodity_link_scope
    applies_to: "nonexchange commodity interface"
    rule: "Keep actual original-gate stock and completed external integration at their recorded raw quantities. Declare source_assignment_scope_id, actual target_consignment_ids/target_cohort_id and source_assignment_quantity_basis: single_consignment_case, target_cohort_total or already_per_reference. For a raw target-cohort total, source_link_per_service_quantity=source_link_assigned_raw_quantity/same_target_scope_N ONLY when the positive N covers exactly that assigned target scope, with actual native units/state/source and acceptance-reversal evidence; use that interface once when combining with 1 accepted_service. A single-consignment case with N=1 and an already-per-reference quantity are not divided again. Do not divide actual external stock/stage-integration records by service N or use whole-source-cohort N for a narrower assigned target; preserve raw quantities and an explicit once-only link."
    source_ids: []
