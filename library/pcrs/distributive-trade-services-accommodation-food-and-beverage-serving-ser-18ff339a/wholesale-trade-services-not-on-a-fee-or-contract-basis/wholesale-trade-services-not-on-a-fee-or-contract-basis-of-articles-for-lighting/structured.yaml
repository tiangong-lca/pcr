      applies_to: "luminaire_wholesale"
      requirement: "Verify unpowered mains/no-battery route and actual manufacturer included-versus-separate content; no powered-test/install/user-cleaning or ratings multiplied into wholesale resources."
      evidence: "cp_consignment; cp_providers; actual model evidence"
    - id: source_lifetime_fates
      applies_to: "all responsibilities"
      requirement: "Keep complete original boxed gate and actual unit/state/source demand/baseline loss outside, all users/full asset life/periods and receiver/provider/freight/treatment once. Mixed cleanup whole/part/solid/liquid evidence and unknowns remain explicit."
      evidence: "Coverage matrix, measurements and independent range data"
    - id: electricity
      applies_to: "luminaire_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Meter actual lighting, electric lifts/handling and business support. The luminaires stay unpowered; nameplate power, luminous output or downstream lighting life is not a wholesale electricity input. Range evidence need: Need actual warehouse meter intervals and all-user/lot shares with idle/failed work retained; no rated-watts times storage-hours or energy-per-luminaire default. Measurement evidence: protocol cp_energy; original record basis Energy / kWh. The original amount constraint “Actual native quantity assigned through cp_energy and compatible documented conversions, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_energy; actual source-linked native records"
    - id: facility_water
      applies_to: "luminaire_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Use only actual facility cleaning/support water; no routine washing or damp-cloth cleaning of every boxed fixture is inferred from user care instructions. Range evidence need: Need purpose-specific meter/issue quantity, supplier coverage and actual fates; moisture in packaging or cleaning-water receipts are not a measured wastewater volume. Measurement evidence: protocol cp_supplies; original record basis Volume / m3. The original amount constraint “Actual native quantity assigned through cp_supplies and compatible documented conversions, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: facility_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: new_outer_protection
      applies_to: "luminaire_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Record real service-added outer carton, film, straps or labels. Original luminaire boxes/inserts and product hardware belong to inherited merchandise; a separately sold installation screw is not automatically supplied by the merchant service. Range evidence need: Need actual inherited/new level, SKU/native count/area/mass and conversion evidence; pallet loops use full-life assets and no fixed packaging weight is copied from a product page. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual native quantity assigned through cp_supplies and compatible documented conversions, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: new_outer_protection_pe_film; new_outer_protection_paperboard_carton. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: operating_supplies
      applies_to: "luminaire_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand actual cleaners, lubricants, wipes, absorbents, filters and record consumables in native state. Replacement LED modules/drivers, installed wiring/fasteners and user product cleaning are not normal service inputs in this unpowered route. Range evidence need: Need SKU/formulation/concentration and net stock supply/returns plus cleanup carrier/absorbed contents and receiver evidence. Mere presence of electronics, plastics or a chemical hazard label does not establish a purchase or emission. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual native quantity assigned through cp_supplies and compatible documented conversions, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: operating_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: fuel_supply
      applies_to: "luminaire_wholesale"
      requirement: "Which purchased fuel grade/formulation and supply gate are on the stock record? Identify any fuel other than the named diesel case and its native unit; obtain actual density before a volume-to-mass conversion. Keep actual grade/native fuel stock and real burn/nonburned fates; a complete contracted carrier or forklift package can already own this burden. Range evidence need: Need opening/net receipts/closing/usable return and mutually exclusive burn/waste/loss, with density/temperature/conversion evidence where used; purchased fuel is not assumed consumed in accepted consignments. Measurement evidence: protocol cp_supplies; original record basis Volume / L. The original amount constraint “Actual native quantity assigned through cp_supplies and compatible documented conversions, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: fuel_supply_diesel_supply. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_services
      applies_to: "luminaire_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Expand only performed storage/handling/unpowered visual or document/completeness inspection/hygiene/maintenance and business support. Manufacturer test certificates are inherited evidence; no powering, electrical test, demo, commissioning or installation is hidden here. Range evidence need: Need actual completed result/native unit and materials/energy/assets/freight/treatment coverage; public operating ratings or a certificate do not prove a performed wholesale test. Measurement evidence: protocol cp_providers; original record basis Count / Item(s). The original amount constraint “Actual native quantity assigned through cp_providers and compatible documented conversions, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_providers; actual source-linked native records"
    - id: shared_assets
      applies_to: "luminaire_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Include actual building, racks, lifts, measurement/ICT equipment and reusable handling/transport assets over all consumers and periods through complete lifecycle scope. Range evidence need: Need manufacture/maintenance/replacement/end-of-life, compatible used/lifetime driver units, observed history plus sourced remainder/termination, uncertainty/sensitivity/update; the goods advertised LED life does not describe warehouse asset life. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual native quantity assigned through cp_assets and compatible documented conversions, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "luminaire_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Use actual transported complete fixture, included components, original and outer packing/tare scope for real legs. Do not replace cargo mass with bare LED module weight or luminaires counted as services. Range evidence need: Need actual load/part/pack/tare scope, distance and compatible conversion/share sources with delivered-supplier, shared and empty/return coverage once; no fixed piece weight from packaging listings. Measurement evidence: protocol cp_freight; original record basis Mass*distance / kg*km. The original amount constraint “Actual native quantity assigned through cp_freight and compatible documented conversions, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: environmental_water
      applies_to: "luminaire_wholesale"
      requirement: "Identify the actual abstraction point, water body/aquifer, location and measured source volume from intake permits/meter records. Surface water and groundwater require distinct source identities; no direct withdrawal is established by purchased water use. Record only real source/location extraction for service operations, separate from purchased facility water and any moisture incident in inherited packs. Range evidence need: Need source meter/purpose/interval and physical withdrawal boundary; damaged cartons do not imply water abstraction or a litre-per-fixture factor. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual native quantity assigned through cp_fates and compatible documented conversions, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: usable_supply_returns
      applies_to: "luminaire_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only an actual same-scope standalone SKU/state return matches operating supply; consumed-only input OMITs its matching outlet. Internal recovery/retained reusable items remain closing stock, while useful commodity fixture/part returns remain merchandise audit. Range evidence need: Need real recipient/native transfer and matched original input/state ownership; no unrelated or negative netting, closing-stock return or automatic avoided-production credit. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual native quantity assigned through cp_supplies and compatible documented conversions, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_supply_returns_detergent_return; usable_supply_returns_pe_film_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: discarded_luminaire_packs
      applies_to: "luminaire_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Use actual receiver quantities and state for discarded whole fixtures, missing/damaged parts, fragments or original mixed packs; the LED/driver/metal/plastic/box component audit does not create duplicate waste or manufacturing inputs. No dismantling or recovery treatment is assumed. Range evidence need: Need actual disposition/recipient/native quantity and net/tare/composition, whole-to-part original-gate equivalent and real treatment coverage; packaging damage or absence of separately sold screws is not proof of whole-fixture discard. Measurement evidence: protocol cp_luminaires; original record basis Mass / kg. The original amount constraint “Actual native quantity assigned through cp_luminaires and compatible documented conversions, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: discarded_luminaire_packs_atomic_case; discarded_luminaire_packs_led_driver. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_luminaires; actual source-linked native records"
    - id: other_wastes
      applies_to: "luminaire_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Record actual spent wipes/absorbents/filters, maintenance fractions and added protection by native received state. Mixed cleanup carrier plus captured liquid/fragments/chemical is one compatible receiver view, not extra counted whole-product or liquid waste. Range evidence need: Need actual received mixed mass, dry carrier/absorbed liquid/fragment units/basis/sources, composition and receiver treatment; broken-part residue alone does not quantify spent solids or justify recycling credit. Measurement evidence: protocol cp_fates; original record basis Mass / kg. The original amount constraint “Actual native quantity assigned through cp_fates and compatible documented conversions, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: other_wastes_spent_wipe. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: contained_wastewater
      applies_to: "luminaire_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Record actual free liquid sent to treatment from performed facility work, separate from absorbed cleanup solids or internal moisture in packaging. No fixture washing, immersion or downstream user cleaning is assumed. Range evidence need: Need collected/received volume, composition/basis, event/source and treatment owner; incoming cleaning water or wet-wipe mass is not this volume and no direct outfall is duplicated. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual native quantity assigned through cp_fates and compatible documented conversions, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: water_outfalls
      applies_to: "luminaire_wholesale"
      requirement: "Identify the direct outfall and receiving water/soil compartment, measured water amount and independently analysed pollutant species. A sewer transfer to treatment is not this outfall; the missing receiving compartment prevents a concrete elementary-flow selection. Only actual water reaching a direct environmental outfall is recorded here, with real medium/quality. Contained transfer to treatment and absorbed cleanup remain their separate receiver roles. Range evidence need: Need actual location/interval native volume and composition/medium evidence; a damp box, incident report or sewer collection invoice does not establish direct discharge. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual native quantity assigned through cp_fates and compatible documented conversions, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: direct_species
      applies_to: "luminaire_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Expand only measured or method-supported source/species/particle-size/medium for real combustion, maintenance, cleanup or commodity incidents. An LED label, driver/material presence, dampness, broken diffuser or stock shortage does not by itself establish mercury, VOC, dust or other emissions. Range evidence need: Need actual chemical/source/medium and compatible measured quantity or activity/burn/factor/composition/fate with native conversions. Do not import bare-bulb substances or consumer operating emissions into an unpowered integrated fixture. Measurement evidence: protocol cp_releases; original record basis Mass / kg. The original amount constraint “Actual native quantity assigned through cp_releases and compatible documented conversions, per reference consignment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: direct_species_co2_fossil_air; direct_species_methane_fossil_air; direct_species_nitrous_oxide_air. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_releases; actual source-linked native records"
validation_rules:
  - rule_id: accepted_commercial
    applies_to: "accepted_service"
    rule: "Verify actual unique own-account final B2B accepted consignment N>0 with full physical qualifiers, not fixture-piece/package/lumen/watt identity."
    source_ids: []
  - rule_id: complete_model
    applies_to: "merchandise"
    rule: "Require actual whole-fixture/component/pack mapping and included-versus-separate hardware manifest, real net/tare/native counts/condition; do not assume a bare lamp/module is complete46533 fixture."
    source_ids:
      - ikea-integrated-ceiling-fixture
      - ikea-integrated-fixture-manual
  - rule_id: unpowered_scope
    applies_to: "luminaire_wholesale"
    rule: "Check no battery and unpowered ambient physical service, with no energizing/electrical testing/demo/install/commission/user cleaning hidden in providers. Any changed operation requires scope review."
    source_ids: []
  - rule_id: source_gate_loss
    applies_to: "merchandise interface"
    rule: "Reconcile actual complete original-boxed source stages, original-unit-state whole-part conversion, exclusive assigned/closing/useful exits and identical baseline stage/loss coverage once outside service; unknown stock cannot be default zero/loss."
    source_ids: []
  - rule_id: all_users_life
    applies_to: "all resources"
    rule: "Require all event/period/consumer links and manufacture/maintenance/replacement/EOL with compatible used/lifetime units, observed+sourced remaining and one per-N/provider/asset view; incomplete/failed work retains burden."
    source_ids: []
  - rule_id: outlet_stock_views
    applies_to: "all actual inventory"
    rule: "Verify native supply/fate/receiver/conversion sources, matched-return omission for consumed-only, non-additive whole fixture/components/mixed cleanup/free liquid/direct species and one treatment owner, with no automatic credits."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity/completeness review"
  downstream_use: "Unpowered integrated-LED ceiling-fixture merchant service add-on linked separately to complete original boxed product and assigned demand/loss coverage"
  allowed_use: "Actual new original-box mains integrated-LED ceiling luminaire, no battery/unpowered, matching model/included-content/pack/state and B2B acceptance"
  excluded_use: "Standalone fixture footprint or bare bulb; illumination/use-hour functional unit; powered tests/demo/install/user use; battery/emergency/portable lighting; retail/agency/storage-only"
  required_metadata: "Actual SKU/model/lot/whole-part and included-versus-separate hardware manifests, mains/unpowered/no-battery evidence, fixture/package/count/net-tare/condition/time/gate, site/period and original assigned demand/loss/service/asset/provider/freight/treatment owners"
  required_quality_disclosure: "Flow/support/BOM/condition/quantity uncertainty and unknown stock/source demand/receiver coverage, all-user asset remainder assumptions, native conversion proof and independent range gaps"
  update_trigger: "Changed model/module/driver/component/included hardware/presentation, battery or powered work/install scope, supplier gate/loss coverage, stock/fate/provider/asset/freight/treatment or measurement method"
