      applies_to: "all duties"
      requirement: "Complete original bound-copy commodity demand/loss integration outside service and actual resource/provider/carrier/full-life asset/receiving treatment scope once,with uncertainty and updates."
      evidence: "Originalgate/conversion/coverage/integration and meter/lifetime/receiver proof"
    - id: warehouse_electricity
      applies_to: "printed_textbook_trade"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Measure actual lighting,lifting,picking,records equipment and assigned standby/cleanup. A preservation guide does not establish operated conditioned storage,printing machinery or restoration loads. Range evidence need: Need measured period/device scope and compatible causal all-user drivers; no power per ISBN,page or copy from paper labels or archival recommendations. Measurement evidence: protocol cp_power; original record basis Energy / kWh. The original amount constraint “Attributed actual metered electricity / N; cp_power.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: warehouse_electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_power; actual source-linked native records"
    - id: premises_water
      applies_to: "printed_textbook_trade"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Only actual premises/equipment housekeeping,not book washing,deacidification,humidification or paper manufacture. Real environmental abstraction must retain its source identity. Range evidence need: Require source/use and actual retained/collected/direct outlet evidence; damp or water-damaged books do not quantify service water supply,effluent or evaporation. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Assigned actual measured supply / N; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: premises_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_water; actual source-linked native records"
    - id: actual_housekeeping_supplies
      applies_to: "printed_textbook_trade"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Include actual native preparations,wipes,absorbents or filters when used. No preservative,fumigant,deacidification agent,book vacuuming or restoration solvent is prescribed by a collection-storage guide. Range evidence need: Need actual SKU/dry material/active-carrier formulation,stock/use/returns and native density/temp/conversion sources; mixed preparation and contents are alternate views,not double supply. Measurement evidence: protocol cp_materials; original record basis Mass / kg. The original amount constraint “Attributed actual native material supply / N; cp_materials.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: actual_housekeeping_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_materials; actual source-linked native records"
    - id: added_order_materials
      applies_to: "printed_textbook_trade"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Only real new cartons,wraps,edge supports,labels or ties at wholesale. Printed covers,binding boards,glue,ink,endpapers,jackets and original manufacturer packing inherited with books remain commodity production outside service. Range evidence need: Require actual native Count/Area/Length/Mass stock,tare/material and conversion/source; no acid-free folder,archival enclosure or new wrapper per copy as a universal requirement. Measurement evidence: protocol cp_materials; original record basis Mass / kg. The original amount constraint “Attributed actual newly added material / N; cp_materials.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: added_order_materials_pe_film; added_order_materials_paperboard_carton. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_materials; actual source-linked native records"
    - id: external_physical_jobs
      applies_to: "printed_textbook_trade"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Count only physically completed contractual native jobs with complete resource/asset gate. Actual hour,mass,area-time or freight services need corresponding native exchanges; licence/ISBN registration,price or margin is not a physical job quantity. Range evidence need: Need actual completion/unit and complete resource/asset/carrier/receiver coverage with overlap owner; procurement order or scan alone is not completion. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “Assigned actual completed jobs / N; cp_provider.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_provider; actual source-linked native records"
    - id: full_life_assets
      applies_to: "printed_textbook_trade"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Cover actual racks,supports,building,lifts/IT,pallets/crates through manufacture,maintenance/cleaning,replacements and EOL across all users/periods. A book shelf-life or archival lifespan is not a warehouse-asset driver. Range evidence need: Need compatible cohort/lifetime driver identities/units,observed life or history plus evidenced remaining use/termination/source,uncertainty/sensitivity/update; reusable-container return is not new manufacture. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Attributed complete asset equivalents / N; cp_assets.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: packed_freight
      applies_to: "printed_textbook_trade"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Use actual packed cargo/legs and carrier/empty-running scope with exclusive commodity/service responsibility. Edition/carton nesting describes the cargo and cannot multiply the same books into several additive loads. Range evidence need: Need gross/tare/packed-payload role,actual distance and compatible factors/units/sources plus share/all-user evidence; page count,nominal capacity and price are not shipping mass or distance. Measurement evidence: protocol cp_transport; original record basis Mass * distance / kg*km. The original amount constraint “Assigned actual packed load-distance / N; cp_transport.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_transport; actual source-linked native records"
    - id: unused_supply_return
      applies_to: "printed_textbook_trade"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only actual unused independent service supplies with same-scope provenance and external receiver. Unsold books,useful publisher/buyer returns and retained reusable containers remain their own commodity/asset stock responsibilities,not this supply-return output. Range evidence need: Need native matching/state/quantity: gross input S with separate matched usable output OR consumed-only S-return input omitting that output,no numeric S+return,double credit or removal of waste supply burden. Measurement evidence: protocol cp_materials; original record basis Mass / kg. The original amount constraint “Assigned measured same-scope outward supply / N; cp_materials.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: unused_supply_return_detergent_return; unused_supply_return_pe_film_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_materials; actual source-linked native records"
    - id: actual_whole_book_waste
      applies_to: "printed_textbook_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual discard decisions and waste-receiver gate. Unsold,obsolete edition,damaged retained copy,return or quarantine is not automatically pulping or physical book loss. Whole books include covers/binding/ink and any measured included pack,not repeated separated paper outputs. Range evidence need: Need exact edition/copy/set/volume scope,count/net book/pack tare/moisture/state and actual receiver/sourcegate loss mapping. An incomplete multi-volume set does not prove all remaining books were discarded. Measurement evidence: protocol cp_books; original record basis Mass / kg. The original amount constraint “Assigned measured actual whole-book waste / N; cp_books.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: actual_whole_book_waste_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_books; actual source-linked native records"
    - id: separated_book_material_waste
      applies_to: "printed_textbook_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual accidental loose pages,cover/binding pieces or collected debris at a documented receiver,not planned pulping/shredding/restoration. Expand actual paper/ink/adhesive/laminate/material state; exclusive with the same whole book and wet cleanup outlet. Range evidence need: Need measured wet/dry/composite fractions,origin/edition and actual receiving treatment; fragment/pulp mass or pagination is not a copy count or a generic source-gate book yield. Measurement evidence: protocol cp_waste; original record basis Mass / kg. The original amount constraint “Assigned measured actual separated material / N; cp_waste.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: separated_book_material_waste_paper. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_waste; actual source-linked native records"
    - id: actual_pack_waste
      applies_to: "printed_textbook_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only packing actually removed and handed to receiver. Cover,binding board,jacket or integral slipcase follows its actual product definition; do not automatically call book constituents external carton waste. Original retained cartons continue with merchandise. Range evidence need: Require actual product-versus-package scope,tare/material/contamination and whole/part exclusions,receiver/transport/treatment. Recycling markings or collection do not establish avoided paper production. Measurement evidence: protocol cp_waste; original record basis Mass / kg. The original amount constraint “Assigned measured separated package waste / N; cp_waste.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: actual_pack_waste_paper_pack; actual_pack_waste_metal_pack; actual_pack_waste_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_waste; actual source-linked native records"
    - id: spent_housekeeping_solids
      applies_to: "printed_textbook_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Conditional actually collected service-cleaning solids and their retained liquid/book dust/packing/chemical contamination. Contents are nonadditive composition audits; the same book fragments,wet-solid liquid or pack fractions cannot be physical outputs twice. Range evidence need: Need actual native supply link,dry material/retained-fluid amount/unit/state/source and gross/tare/net,stream exclusions and receiving treatment; no mandatory book vacuuming/filter dose or dust yield. Measurement evidence: protocol cp_waste; original record basis Mass / kg. The original amount constraint “Assigned measured actual spent solids / N; cp_waste.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_waste; actual source-linked native records"
    - id: contained_cleanup_liquid
      applies_to: "printed_textbook_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual collected stream with real composition and receiver; not a paper-pulping,book-washing or restoration process by assumption. Liquid contained in whole wet book/material/absorbed-solid waste is not this second physical outlet. Range evidence need: Need actual volume/density/temperature with units,composition/state/source and exclusion/receiver/treatment/transport evidence. Moisture or wet mass deficit never supplies a wastewater quantity. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Assigned measured actual collected liquid / N; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_water; actual source-linked native records"
    - id: actual_direct_substances
      applies_to: "printed_textbook_trade"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Only actual measured or source-supported direct events with named substance and medium. Paper yellowing,mould observation,ink/adhesive content,odour and wet/dry stock deficit do not establish spores,dust,VOC,water-vapour or carbon release mass. Range evidence need: Require compatible measurement or actual activity/factor/composition/fate values,units,bases and sources; complete species-specific factors are not multiplied by fractions twice. Measurement evidence: protocol cp_species; original record basis Mass / kg. The original amount constraint “Assigned supported actual substance release / N; cp_species.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_species; actual source-linked native records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "accepted_service"
    rule: "Require actual own-account commercial B2B acceptance,all qualifiers and positive unique N. Book/copy/set/volume/carton Count or registration/payment is not service completion."
    source_ids: []
  - rule_id: validate_physical_identity
    applies_to: "edition and stock"
    rule: "Verify actual ISBN scope,edition/revision/language/format/print run,binding/pagination and physical source equivalence,copy/set/volume/carton nesting and actual completeness/mass/moisture/tare. No title/page-count equivalence or fixed copies-per-carton universal factor."
    source_ids: []
  - rule_id: validate_ordinary
    applies_to: "actual operation"
    rule: "No archival environmental numbers,housing/cleaning/repair prescriptions or book-life claims become ordinary merchant activities. Actual extra conditioning/printing/binding/restoration/pulping needs reviewed separate scope and complete inventory."
    source_ids:
      - loc-book-storage
  - rule_id: validate_chain
    applies_to: "commodity outside addon"
    rule: "Require complete actual released finished bound printed educational-copy baseline including paper,printing/ink,cover/binding/adhesive,actual accessories and original pack,or missing production assembled once outside service. Original-gate quantity/unit/state/source,direct-or-allocated assignment,actual state/whole-part loss/conversions/exits/owner/already-covered loss and integration must match edition and physical source. For allocated source assignment,retain source_all_exit_driver_records for every competing accepted transfer,external return,closing carry/unsold or damaged-retained stock,usable other exit and actual whole/fragment loss. Each mutually exclusive end-state/exit driver record has quantity,unit,basis,source,original-source/edition link,cohort/period and exclusivity key; reconcile intermediate return movements to their final state rather than counting both. Numerator and complete denominator must refer to the same compatible original-source cohort and driver basis. Denominator=sum these complete mutually exclusive records,including unsold/closing carry and useful exits,never accepted-only; missing destination coverage blocks allocated assignment."
    source_ids: []
  - rule_id: validate_fates_scope
    applies_to: "all inventory"
    rule: "Actual unsold/useful return/damaged retained copy is not pulp waste; real discard/fragment receiver and full treatment must be evidenced. Whole/fragment/pack/retained-liquid streams and source assignments are exclusive. Verify native identities/support,conversion units/sources,all-user full-life asset/provider/carrier scope and actual direct species; no paper-content/odour/moisture-deficit release."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
