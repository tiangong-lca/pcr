allocation_rules:
  - rule_id: allocation_service
    applies_to: "all duties"
    rule: "Use positive actual unique accepted commercial N and causal physical cohort/period driver shares. Failed/cancelled/quarantined/returned orders,idle/cleanup and unfinished periods retain duties even when no current service completes; copy/carton count or margin alone is not N."
    source_ids: []
  - rule_id: allocation_goods
    applies_to: "nonexchange book stock"
    rule: "Reconcile attributed opening,net receipts,buyer returns,closing unsold/damaged retained,accepted transfers,publisher/supplier returns,other exits,actual whole/fragment discard and remaining usable volumes by exclusive source-edition and count hierarchy. Internal quarantine/incomplete sets are not exits. For allocated source assignment,retain source_all_exit_driver_records for every competing accepted transfer,external return,closing carry/unsold or damaged-retained stock,usable other exit and actual whole/fragment loss. Each mutually exclusive end-state/exit driver record has quantity,unit,basis,source,original-source/edition link,cohort/period and exclusivity key; reconcile intermediate return movements to their final state rather than counting both. Numerator and complete denominator must refer to the same compatible original-source cohort and driver basis. Denominator=sum these complete mutually exclusive records,including unsold/closing carry and useful exits,never accepted-only; missing destination coverage blocks allocated assignment. Quantify actual original finished-copy demand/state/whole-part loss in matching source unit/state with actual conversions/owner/existing loss coverage and once-only integration outside service; fragments or wet/dry changes never become copies by assumption."
    source_ids: []
  - rule_id: allocation_supplies
    applies_to: "independent supply and unused_supply_return"
    rule: "S=assigned opening+true external net receipts-closing including recovered retained independent supplies. Choose gross INPUT S with separate same-scope matched usable OUTPUT OR consumed-only INPUT S-return omitting that output. Internal recovery is not receipt;no numeric S+return,double deduction or removal of nonreturned waste/spill upstream burden. Book merchandise returns and original covers are not service-supply credits."
    source_ids: []
  - rule_id: allocation_life_scope
    applies_to: "resources/assets/providers"
    rule: "Compatible-period complete resource attribution=cohort physical driver/all-user driver. Full-life asset equivalent=compatible cohort driver/complete lifetime driver across users/periods,including manufacture,maintenance/cleaning,replacements and EOL. Evidence observed life or history plus sourced remainder/termination,driver units,uncertainty/sensitivity/update. Complete provider scope replaces covered own resources/assets rather than adding them."
    source_ids: []
  - rule_id: allocation_outlets
    applies_to: "actual book/fragment/pack/cleanup flows"
    rule: "Actual whole books,fragments,packing,absorbed-liquid cleanup solids and independent contained liquid are exclusive physical streams. Paper/ink/glue/cover/moisture fractions are nonadditive contents with transfer/exclusion links. Actual receiver/transport/treatment once,no automatic pulping,recycling/substitution credit or waste subtraction from supply. Only actual identified direct substances/media use supported measurement/fates; receiver emissions stay in receiver scope once."
    source_ids: []
  - rule_id: source_scope_normalization
    applies_to: "nonexchange commodity and service combination"
    rule: "Keep original external commodity stock, source assignment/loss and missing-stage/additional upstream integration quantities in their evidenced RAW actual scope. Identify whether each amount is one actual consignment, a target service cohort, or ALREADY per reference,with source/target scope IDs and quantity basis. The physical source-cohort all-exit denominator assigns RAW quantity to that target scope; it is not automatically the target accepted-service N. Only when combining that same target-scope commodity amount with the 1 Item(s) service derive amount per reference = RAW assigned amount / positive unique accepted source_same_scope_N,with acceptance IDs/time/reversal evidence. A proved single-case scope has source_same_scope_N=1; an already-per-reference amount is not divided again. Preserve raw integration quantities and source links; do not shrink actual upstream remediation or divide the whole source cohort by an unrelated N. N0 responsibility remains disclosed without division."
    source_ids: []
