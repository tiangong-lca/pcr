    - protocol_id: cp_environment
      process_id: "ambient_wholesale"
      flow_role: "actual direct species and receiving medium"
      record_type: "direct_species_record"
      raw_fields: "site_id; cohort_id; event_id; period_id; substance_identity; particle_size; receiving_medium; release_state; measured_mass; measured_mass_unit; activity; activity_unit; species_factor; factor_unit; factor_source; factor_scope; factor_complete; measured_whole_stream_release; whole_stream_unit; composition; composition_basis; composition_source; fate; fate_basis; fate_source; temperature; temperature_unit; pressure; pressure_unit; density; density_unit; density_source; conversion; conversion_source; retained_captured_quantity; receiver_treatment_coverage; applicability; calibration; uncertainty"
      collection_method: "Identify actual species/particle/medium before exchange identity. Measured species mass OR justified matched activity/factor OR measured whole-stream composition/fate with native conversion and applicability. Complete factor not multiplied by composition/fate again. Captured/contained materials, garment blend labels and moisture/condition observations alone do not establish a direct release or its absence. Actual species/medium and release evidence remain required; do not assume zero."
      unit: "kg species; actual native activity/whole-stream/concentration units"
