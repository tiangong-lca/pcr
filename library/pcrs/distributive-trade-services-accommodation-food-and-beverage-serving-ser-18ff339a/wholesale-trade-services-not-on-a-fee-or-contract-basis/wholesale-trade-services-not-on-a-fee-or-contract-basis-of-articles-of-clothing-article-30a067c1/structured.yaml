  calculation_rules:
    - id: accepted_consignment
      applies_to: "accepted_service"
      rule: "N=count unique final accepted_consignment_ids at reference_gate_id; accepted_service=1 Item(s)."
      inputs:
        - cp_garment
      output: "One actual complete commercial service with garment/style/size/composition/condition/time qualifiers"
      source_ids: []
    - id: garment_component_audit
      applies_to: "non-exchange garment"
      rule: "net_garment_mass=gross_quantity-primary_pack_tare-external_label_insert_tare-outer_pack_tare-pallet_support_tare, keeping actual integral trims/internal labels in garment net mass. Component dry mass, if genuinely needed and representatively measured, uses actual component_mass and compatible component moisture_fraction: component_dry_mass=component_mass*(1-moisture_fraction) for wet basis OR component_mass/(1+moisture_fraction) for dry basis. Apply actual component_fibre_fraction only on matching declared fraction_basis; do not multiply whole as-received trimmed garment by label wool percentage. Analytical views nonadditive."
      inputs:
        - cp_garment
      output: "Actual whole garment/tare/component/composition/moisture audit, no new manufacturing exchange"
      source_ids: []
    - id: finished_gate_demand
      applies_to: "non-exchange commodity"
      rule: "assigned_source_gate_quantity=actual compatible evidenced source_gate_input_quantity allocation/conversion to accepted cohort, including evidenced assigned_moisture_state_change_share, excluding exclusive returns/closing/other exits. commodity_source_gate_demand=assigned_source_gate_quantity/N outside service. Actual loss_adjustment_quantity/unit/basis/source/owner and already_included_loss_coverage reconcile once. Unknown differences not actual loss or species."
      inputs:
        - cp_garment
        - N
      output: "Separate factory-finished packed demand and quantified compatible upstream-loss interface"
      source_ids: []
    - id: new_supply_stock
      applies_to: "service supplies and unused returns"
      rule: "S=opening_supply+net_receipts-closing_supply; net_receipts=gross_receipts-receipt_tare. Gross supply S/N with separate matched usable_outward_return/N OR consumed-only (S-usable_outward_return)/N with matching return exchange omitted; retained recovery in closing, original scope/native units and conversion sources matched."
      inputs:
        - cp_supplies
        - N
      output: "Actual supplies and one selected unused-return convention per reference flow"
      source_ids: []
    - id: meter_attribution
      applies_to: "electricity; cleaning_water; electricity_ac; cleaning_water_liquid_tap"
      rule: "actual_meter_quantity=closing_reading-opening_reading on actual import/export direction OR matched direct_submeter_quantity; attributable_quantity=(actual_meter_quantity*consumer_driver/total_driver)/N for real disjoint all-user periods including idle/hygiene/open resources."
      inputs:
        - cp_utilities
        - N
      output: "Actual attributable purchased utilities per reference flow"
      source_ids: []
    - id: physical_provider
      applies_to: "provider_packages"
      rule: "provider_quantity=native_quantity*equivalent_conversion/N only for actual matching physically complete package, resources owned once."
      inputs:
        - cp_provider
        - N
      output: "Actual equivalent completed packages per reference flow"
      source_ids: []
    - id: asset_equivalent
      applies_to: "shared_assets"
      rule: "asset_equivalent=(job_driver/life_driver)/N; life_driver=observed_driver+remaining_driver with compatible native units, all-user full history/sourced remainder and actual lifecycle coverage, one view/no double normalization."
      inputs:
        - cp_assets
        - N
      output: "Complete actual asset equivalent share per reference flow"
      source_ids: []
    - id: whole_load_freight
      applies_to: "freight"
      rule: "whole_payload_mass=garment_payload_mass+primary_pack_mass+inherited_outer_mass+added_pack_mass+transported_support_mass with garment integral trims already included and all components disjoint; freight_work=whole_payload_mass*route_distance*load_share/N after real conversion/exclusive return/empty coverage."
      inputs:
        - cp_freight
        - N
      output: "Actual complete-load transport work per reference flow"
      source_ids: []
    - id: contained_outlets
      applies_to: "actual waste outlets"
      rule: "garment_waste=actual_discard_stream_mass/N on actual garment+associated-pack state if transferred together. Other outlet_quantity=(gross_quantity-tare_quantity)/N in actual native unit or actual volume/N with supported density-temperature as needed. Exclude already-transferred garment/pack and retained stock; components are nonadditive, receiver treatment once."
      inputs:
        - cp_garment
        - cp_outlets
        - N
      output: "Actual exclusive contained outlets in declared state per reference flow"
      source_ids: []
    - id: species_mass
      applies_to: "direct_species"
      rule: "species_mass=measured_mass/N OR activity*species_factor/N OR measured_whole_stream_release*composition*fate/N after compatible native source-backed conversion; select one. factor_complete forbids extra composition/fate; no whole-stream/species duplicate physical output."
      inputs:
        - cp_environment
        - N
      output: "Actual direct species mass with receiving medium per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: finished_style_state
      applies_to: "received/accepted jumpers"
      requirement: "Actual factory finish/fold/pack style/size/lot composition source and care/buyer condition criteria required, with real garment count/net/tare and non-invasive or representative supplier records; no pure-wool/default home care."
      evidence: "cp_garment factory/SKU/label/buyer state and record evidence"
    - id: composition_moisture_loss
      applies_to: "garment stock/actual fates"
      requirement: "Whole garment incl trims differs textile/fibre/component analysis; actual moisture basis/method/sample/time/representativeness and compatible fraction basis. Shape/moth/mould/weight differences are not automatic disposal/loss/species. Finished-gate actual demand/loss owner/state/unit/source/coverage outside once."
      evidence: "Actual quantity/condition/stock/fate and separately quantified original-gate commodity link"
    - id: physical_completeness
      applies_to: "all resources and periods"
      requirement: "Actual all-user native drivers/provider scope, full asset lifecycle/history/remainder/uncertainty and source/carrier/treatment owners including idle/hygiene/failed/open events once."
      evidence: "Source meter/supply/provider/asset/transport/receiver records"
    - id: concrete_identity_ranges
      applies_to: "actual expanded rows"
      requirement: "Resolve actual SKU/package/asset/waste/species and native property/unit support before final data; quantitative ranges need comparable independent evidence, no invented benchmark."
      evidence: "Actual detail/support/receiver and empirical range applicability evidence"
    - id: electricity
      applies_to: "ambient_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Measure real electric handling/charging, lighting, record/inspection and ordinary ventilation or surface-cleaning equipment. This ambient route has no onsite combustion or dedicated temperature/humidity intervention, garment steam/ironing/laundering/drying. An actual additional physical operation requires scope/module review. Range evidence need: Actual source meters/charging/event scope and all-user causal driver intervals including idle/hygiene/open work needed; no standard energy per jumper, garment manufacturing load or assumed dehumidifier use. Measurement evidence: protocol cp_utilities; original record basis Energy / kWh. The original amount constraint “Actual attributable purchased electricity per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: cleaning_water
      applies_to: "ambient_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Actual external utility water for warehouse floors/equipment only, with source/treatment and provider boundaries. No garment wash/rinse/steam or inferred water uptake from textile moisture. Record actual cleanup receiver/recirculation/make-up independently. Range evidence need: Require real meters/cleaning-event quantities and actual source/treatment scope; no household wool wash procedure, liquid-to-garment ratio or water purchase=effluent equality. Measurement evidence: protocol cp_utilities; original record basis Volume / m3. The original amount constraint “Actual attributable purchased cleaning water per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: hygiene_supplies
      applies_to: "ambient_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Actual named surface-cleaning agents, wipes or other mass-measured service consumables expanded by SKU/state/unit. No mothballs, cedar, silica sachets, repellents or chemical treatment of garments is prescribed. Actual non-product-contact pest monitoring/sanitation, if contracted, has explicit provider resource boundaries; garment treatment requires separate route review. Range evidence need: Actual SKU/formulation/product mass, stock/unused-return/receiver and composition-fate evidence needed; no home-care supply kit or pest-chemical dose/release assumption. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable actual new hygiene supply mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: hygiene_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: added_packing
      applies_to: "ambient_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Actual merchant-added outer transport cases/straps/protective units only, with defined material/unit and actual per-piece mass if converted. Factory primary pack/fold/seal/labels/hangers or inserts remain inherited merchandise audit; do not unpack/repack garments here. Reusable bins/pallets belong to assets. Range evidence need: Require actual added unit/material/native stock and return records; no default household storage bag, vacuum packing, cedar or desiccant, standard pieces per carton or new primary bag per jumper. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “Actual attributable new outer transit units per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_packages
      applies_to: "ambient_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Actual complete provider-defined physical package for agreed pack/state verification, warehouse sanitation, non-product-contact pest monitoring, handling or maintenance, with equivalent native unit and full resource coverage. Do not substitute margin/fee/invoice for resources. Outsourced laundering/steam/repair/redye/product treatment/repacking remains an excluded physical process requiring reviewed extension. Range evidence need: Actual contract completion, native unit/equivalence and energy/material/asset/treatment inclusion/exclusion required; no standard inspection frequency, household care routine or price-based resource-free Count. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “Actual attributable equivalent completed packages per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_provider; actual source-linked native records"
    - id: shared_assets
      applies_to: "ambient_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Real warehouse/racks/electric handlers/reusable bins/pallets/monitoring/scales represented by a matching complete whole-asset equivalent. Manufacturing, maintenance, actual replacements, retirement/end-of-life cover all users and periods. Do not manufacture one new reusable carrier on each turn or duplicate provider rent and whole assets. Range evidence need: Need identity/lifecycle scope, compatible native all-user job/life drivers, observed history and sourced remainder with uncertainty/sensitivity; no universal storage-rack lifetime or pallet/bin rotation count. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual attributable whole-asset equivalents per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "ambient_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Actual agreed inbound/outbound/return work for complete as-transported garments including integral trims plus inherited/added packing and transported supports. Declared wool percentage or dry fibre analysis is not payload mass. Carrier embedded energy/vehicle assets and empty/multi-drop/returns coverage need one owner. Range evidence need: Actual gross/net load components, route distance and mutually exclusive share/native conversion sources required; no standard jumper mass, cartons per pallet, wool fraction to shipment or default road distance. Measurement evidence: protocol cp_freight; original record basis mass*distance / kg*km. The original amount constraint “Actual attributable complete-load freight work per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: unused_count_returns
      applies_to: "ambient_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only real unused additional Count packing returned externally, paired with original same-scope supplystock/unit and receiver acceptance. Internal movement and retained stock are not outputs. Select gross input plus this return OR consumed-only input with matching return exchange omitted; no double deduction. Range evidence need: Require actual pair IDs/units/count/receiver and selected stock view; no assumed unused fraction, manufacturer pack credit or avoided-production benefit. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “Actual attributable unused packing units returned per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: unused_mass_returns
      applies_to: "ambient_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Real unused mass-measured service product returned externally with exact state/net quantity and original same-scope standalone supply pairing. Garment commercial returns are separate commodity movements, not negative service or unused consumables. Spent wipes/agents remain waste. Range evidence need: Actual product/state/original-scope/return pairing and calibrated net mass needed; no credit against unrelated current supply or factory-inherited goods/assets. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable unused hygiene supply returned mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: unused_mass_returns_detergent_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: garment_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual rejected garments transferred to a waste receiver, with real garment mass including integral trims and any associated pack only if physically transferred in that same measured stream. Shape distortion, insects/mould observation or return alone does not prove discard or mass loss. Do not duplicate associated packaging under a separate physical output. Commodity upstream loss remains separately linked outside service; actual handling/treatment once. Range evidence need: Need actual style/size/composition/state, piece/mass/pack-inclusion evidence and receiver disposition; no condition-score=loss, label fibre percentage=emission, or default landfill/recycling route. Measurement evidence: protocol cp_garment; original record basis Mass / kg. The original amount constraint “Actual attributable discarded garment-stream mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: garment_waste_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_garment; actual source-linked native records"
    - id: packaging_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual already-separated/damaged packing from real incidents or outer handling, with material/state/remaining garment inclusion and receiver records. No routine primary opening/rebagging or new retail-pack manufacture. Exclude packaging already transferred with discarded garments or mixed cleanup waste. Range evidence need: Real component/net quantities/condition/remaining contents/receiver needed; no default retail bag weight or every pack removed on receipt, no automatic recycled-material substitution. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual attributable separately collected packing-waste mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: packaging_waste_paper_pack; packaging_waste_metal_pack; packaging_waste_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: hygiene_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Real used surface-cleaning wipes/absorbers/monitoring consumables or captured mixed solids, including actual retained fibres/moisture/agents only where measured in the stream state. Clean supply and constituent analysis remain nonadditive views. Captured fibre is not airborne emission; no fabric cutting or garment laundry residue is invented. Range evidence need: Actual net transfer state/composition/retained-liquid/garment-pack exclusions and receiver evidence needed; no clean-supply=spent mass or default moth/mould/fibre-release amount. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual attributable mixed hygiene-waste mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: hygiene_waste_spent_wipe. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: wastewater
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual collected surface-cleaning/incident liquid to a receiver with measured volume or compatible mass-density-temperature basis and actual load/source. No garment washing/steam/dry-cleaning water and no effluent inferred from garment moisture. Contained liquid differs from direct species/medium releases. Range evidence need: Actual collection/receiver, conversion density/temperature and treatment/load scope required; no household wash-water ratio, default pollution factor or supply-to-drain fraction. Measurement evidence: protocol cp_outlets; original record basis Volume / m3. The original amount constraint “Actual attributable contained cleaning-liquid volume per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: direct_species
      applies_to: "ambient_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Only actual measured or justified source-matched species and receiving medium, with particle size where relevant. Garment blend labels, moisture changes, moth/mould/odour observations, captured fibres and household pest-care advice do not establish chemical, biological, water-vapour or microfibre releases. Actual whole-stream composition/fate and release evidence are independent. Range evidence need: Need actual identity/medium/particle, quantity/native conversion and factor/composition/fate applicability; no assumed mothball/cedar chemical, synthetic blend% to microplastics or moisture residual to air. Measurement evidence: protocol cp_environment; original record basis Mass / kg. The original amount constraint “Actual attributable directly released species mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
validation_rules:
  - rule_id: reference_check
    applies_to: "accepted_service"
    rule: "N>0 unique final B2B accepted service with actual factory style/size/woolblend/garmentcount/net incltrims/tare/moisture/source/condition/time, not onejumper or woolkg."
    source_ids: []
  - rule_id: processing_check
    applies_to: "whole route"
    rule: "No garment manufacturing/wash/steam/ironing/repair/redye/pesttreatment/primary openingrepack or unreviewed dedicatedclimate operation, including contracted physical actions; no mandatory householdcare."
    source_ids: []
  - rule_id: commodity_gate_check
    applies_to: "non-exchange garment"
    rule: "Complete actual finishedpacked baseline includes missing actual postgreasywool and blend manufacturing stages once outside service; sourcegate assignedquantity/statechanges/exclusiveexits and actualcompatible lossunit/basis/source/owner/existingcoverage mandatory. No labelwool%=wholegarmentfibrekg or massdeficit=loss/species."
    source_ids: []
  - rule_id: resource_owner_check
    applies_to: "all service resources"
    rule: "All users/periods/drivernativeunits, idle/hygiene/open attempts, gross-plus-return OR consumed-only omitreturn, completeassetlife observed+sourcedremainder/EOL and direct/provider/carrier/treatment scope once."
    source_ids: []
  - rule_id: fate_species_check
    applies_to: "actual outlets"
    rule: "Usable commercialreturn/retainedreject vs realdiscard; garmenttransferredpack vs separatelyremovedpack/mixedhygiene/liquid disjoint. Actualspecies/medium independent, no householdchemical/condition/capturedfibre inferredrelease or automaticcredit."
    source_ids: []
  - rule_id: bilingual_raw_contract
    applies_to: "all authored content"
    rule: "Raw identity7/FU5/boundary6/reference6/profile7, all8CP12fields and10calculationbodies/output nonempty; orderedIDs/propertyunit/evidence/rawoperands/sourceURLs and deterministic projection align withoutpreprocessing. Pass not actualquality/finalUUIDproof."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
