      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Record actually operated lifting,lighting,records and assigned idle/cleanup. A cool-dry warehouse statement does not establish air conditioning,resin drying or pneumatic transfer. Molding properties do not set warehouse power. Range evidence need: Need real meter/device/provider period coverage and causal all-user shares;no resin-density,MFR or processing energy default. Measurement evidence: protocol cp_power; original record basis Energy / kWh. The original amount constraint “Assigned measured actual native quantity / N; cp_power.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: warehouse_power_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
