    - id: normalize
      applies_to: "all exchanges"
      rule: "Divide the attributed actual physical quantity by positive unique FINAL N once; accepted_service is 1 Item(s). Count only completed B2B consignments with source-backed evidence that the merchant acquired ownership, purchased and resold the goods, and obtained final buyer acceptance after reversals. Supplier receipt alone is not completion. Retain resources for unfinished, reversed or failed work in the actual period/cohort; do not divide when N=0."
