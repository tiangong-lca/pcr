  - rule_id: native_coverage
    applies_to: "actual trade duties"
    rule: "Require complete actual provider, resource, full all-user asset-lifetime, native stock and freight operands and their coverage owners. Use NET receipts and choose gross input with a matched return output OR consumed-only input with that output omitted. Multiply EACH quantities by actual repetition counts once and leave TOTAL quantities unchanged. Apply each freight record share INSIDE the sum, then divide by N once. Actual quantities, compatible native units/state/basis/method/time/source, verified concrete identities and applicable acceptance/coverage evidence remain mandatory; unknown is not zero. A missing generic numerical Range alone is disclosed and does not block an otherwise evidenced actual package; never invent bounds. A claimed source-backed interval needs a traceable source and compatible basis; only an empirical plausibility guardrail additionally needs independent comparable reference evidence, not the same batch maximum validating itself. Preserve applicable actual source-specific acceptance intervals and uncertainty requirements."
