  calculation_rules:
    - id: accepted_consignment
      applies_to: "accepted_service"
      rule: "N=count unique final accepted_consignment_ids at reference_gate_id; accepted_service=1 Item(s)."
      inputs:
        - cp_pasta
      output: "One actual completed service qualified by product/pack/date/moisture/time/gate"
      source_ids: []
    - id: pasta_content_moisture
      applies_to: "non-exchange pasta audit"
      rule: "net_pasta_mass=gross_quantity-primary_pack_tare-outer_pack_tare-pallet_support_tare on compatible boundary. Convert actual reported moisture to fraction with source; dry_matter_quantity=net_pasta_mass*(1-moisture_fraction) only for wet-basis fraction, OR net_pasta_mass/(1+moisture_fraction) for dry-basis moisture. Use actual stated basis/method/sample/time; dry-matter and as-received views are not additive exchanges."
      inputs:
        - cp_pasta
      output: "Actual contents/tare and moisture-basis analytical audit"
      source_ids: []
    - id: finished_gate_demand
      applies_to: "non-exchange source gate"
      rule: "assigned_source_gate_quantity=actual compatible evidenced source_gate_input_quantity allocation/conversion to accepted cohort, including evidenced assigned_moisture_state_change_share while excluding quantities exclusively assigned to returns/closing/other exits. commodity_source_gate_demand=assigned_source_gate_quantity/N outside service. Reconcile actual loss_adjustment_quantity/unit/basis/source/owner with already_included_loss_coverage once; final mass+discard shortcut and wet-deficit loss inference prohibited."
      inputs:
        - cp_pasta
        - N
      output: "Separate finished dried/packed demand and actual compatible upstream-loss interface"
      source_ids: []
    - id: new_supply_stock
      applies_to: "hygiene/packing supplies; unused returns"
      rule: "S=opening_supply+net_receipts-closing_supply; net_receipts=gross_receipts-receipt_tare. Gross input S/N plus separate matching usable_outward_return/N OR consumed-only (S-usable_outward_return)/N with matching return exchange omitted. Retained recovery included in closing; actual native conversion sources required."
      inputs:
        - cp_supplies
        - N
      output: "Actual supply and chosen unused-return convention per reference flow"
      source_ids: []
    - id: meter_attribution
      applies_to: "electricity; cleaning_water; electricity_ac; cleaning_water_liquid_tap"
      rule: "actual_meter_quantity=closing_reading-opening_reading on actual import/export direction OR matched direct_submeter_quantity; attributable_quantity=(actual_meter_quantity*consumer_driver/total_driver)/N for disjoint all-user intervals including idle/hygiene/open resources."
      inputs:
        - cp_utilities
        - N
      output: "Actual purchased utility quantity per reference flow"
      source_ids: []
    - id: physical_provider
      applies_to: "provider_packages"
      rule: "provider_quantity=native_quantity*equivalent_conversion/N only with actual matching physical completed unit and complete resource scope once."
      inputs:
        - cp_provider
        - N
      output: "Actual equivalent package quantity per reference flow"
      source_ids: []
    - id: asset_equivalent
      applies_to: "shared_assets"
      rule: "asset_equivalent=(job_driver/life_driver)/N; life_driver=observed_driver+remaining_driver in compatible units and complete all-consumer history/evidenced remainder with actual replacement/EOL; one view, no duplicate normalization."
      inputs:
        - cp_assets
        - N
      output: "Compatible complete asset-equivalent share per reference flow"
      source_ids: []
    - id: whole_load_freight
      applies_to: "freight"
      rule: "whole_payload_mass=as_transported_pasta_mass+primary_pack_mass+inherited_outer_mass+added_pack_mass+transported_pallet_support_mass with disjoint real load components; freight_work=whole_payload_mass*route_distance*load_share/N after actual native conversion and exclusive empty/return coverage."
      inputs:
        - cp_freight
        - N
      output: "Actual complete-load transport work per reference flow"
      source_ids: []
    - id: contained_outlets
      applies_to: "actual waste outlets"
      rule: "intact_pack_waste=intact_waste_transfer_mass/N for actual intact whole-pack transfer. Other outlet_quantity=(gross_quantity-tare_quantity)/N in actual native stream units or actual volume/N, with moisture/composition/density-temperature basis as needed. Whole-stream and component views do not duplicate; retained stock/internal movement not outward transfer."
      inputs:
        - cp_pasta
        - cp_outlets
        - N
      output: "Disjoint actual contained outlet quantities and receiver treatment per reference flow"
      source_ids: []
    - id: species_mass
      applies_to: "direct_species"
      rule: "species_mass=measured_mass/N OR activity*species_factor/N OR measured_whole_stream_release*composition*fate/N after compatible sourced native conversions, one method selected. factor_complete prevents extra composition/fate, whole-stream/species outputs not physically duplicated."
      inputs:
        - cp_environment
        - N
      output: "Actual species mass with receiving medium per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: finished_state
      applies_to: "received/accepted goods"
      requirement: "Actual finished dry/plain durum product and sealed pack/SKU/shape/lot/date and buyer conditions recorded; no raw-semolina gate or universal consumer storage/quality threshold."
      evidence: "Actual manufacturer release/date/product and buyer acceptance"
    - id: mass_moisture_loss
      applies_to: "merchandise and actual fates"
      requirement: "Net as-received mass/tare and moisture basis/method/sample/time compatible; broken usable/rejected/discarded/moisture-change/unknown differences distinct. Original gate assigned demand/loss source/state/unit/owner/coverage external once."
      evidence: "cp_pasta compatible measured quantity/state/fate and commodity link"
    - id: complete_resources
      applies_to: "all users/providers/assets/transport/receivers"
      requirement: "Actual native drivers/periods, complete physical package and all-life asset observed+remaining source/replacement/EOL, current-event overlaps and hygiene/open attempts included once."
      evidence: "Source meter/stock/driver/provider/carrier/receiver/lifecycle records"
    - id: specific_exchange_ranges
      applies_to: "actual expanded rows"
      requirement: "Verify concrete identities/property-unit support and receiver/species roles before final dataset; empirical ranges need comparable evidence, no manufactured threshold."
      evidence: "Actual detail/support and numerical-range applicability evidence"
    - id: electricity
      applies_to: "ambient_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Actual electric stock-handling equipment charging, lighting, ordinary ventilation, inspection and hygiene equipment electricity, with real meter/provider boundaries. No onsite combustion, dedicated cooling/dehumidification, product re-drying or other stabilization intervention is included; an actual such operation requires route review. Range evidence need: Use source meter intervals, actual equipment operation/charging coverage and all-user allocation with idle/hygiene/open-order treatment; no standard kWh per pasta tonne, nominal equipment-hour use or manufacturing drying load. Measurement evidence: protocol cp_utilities; original record basis Energy / kWh. The original amount constraint “Actual attributable electricity per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: cleaning_water
      applies_to: "ambient_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Actual externally supplied floor/equipment cleaning utility water only. Do not hydrate pasta, infer manufacturing water, equate product moisture change to utility input, or duplicate provider-contained water. Actual sanitary event and liquid receiver scopes remain explicit. Range evidence need: Actual meter/event source-treatment records and allocation are needed; no cooking water ratio, assumed leak-to-sewer fraction or water from pasta wet-weight deficit. Measurement evidence: protocol cp_utilities; original record basis Volume / m3. The original amount constraint “Actual attributable purchased cleaning water per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: hygiene_supplies
      applies_to: "ambient_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand actual named formulated cleaning products and mass-measured wipes/absorbents used on warehouse equipment/surfaces or actual breach cleanup, each by real SKU/state/native mass and stock. No chemical treatment of pasta, recipe, disinfection dose or unrecorded pest chemical is prescribed. Range evidence need: Require actual SKU/formulation/consumable state, opening/receipt/closing/unused return and composition/fate evidence; no universal cleanup kit or chemical release ratio. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable new hygiene supply mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: hygiene_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: added_packing
      applies_to: "ambient_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Only actual added outer transit cases, straps, wrap units or protective supports, with real unit definition/material and per-unit mass conversion if needed. Manufacturer primary seal/labels and inherited outer packing remain traded-pack audit, not new manufacturing inputs. Reusable pallets are lifecycle assets. Range evidence need: Actual pack-unit stock/use/unused return and per-piece material mass required; no default retail pack mass, bags per box, wrap consumption or automatically added outer pack. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “Actual attributable new secondary transit packing units per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_packages
      applies_to: "ambient_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Actual provider-defined physical receiving/checking, sanitation, handling or maintenance packages with matching completed unit and full resource coverage. Invoice/margin/finance does not define a resource-free Count service. Outsourced pasta re-drying, hydration, fumigation/product treatment or repacking remains an actual material operation requiring separate reviewed scope. Range evidence need: Need actual provider package/native unit, completed quantity, conversion and energy/material/asset/treatment coverage; no standard price, service duration or unspecified task equivalence. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “Actual attributable equivalent completed physical packages per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_provider; actual source-linked native records"
    - id: shared_assets
      applies_to: "ambient_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Actual warehouse/racks/electric handlers/reusable pallets/scales/condition-monitoring equipment using one complete compatible whole-asset equivalent. Include manufacturing, maintenance, actual replacement, retirement and end-of-life across all users/periods; per-turn pallet use is not new pallet manufacture. Range evidence need: Need asset identity/full lifecycle scope, native all-user drivers, observed history and evidenced remaining use with uncertainty; no assumed life, cycles, annual utilization or zero retirement burden. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual attributable complete asset equivalents per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "ambient_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Actual agreed transport and return legs using real pasta contents plus primary/inherited/added packing and transported pallets/supports. Moisture-basis dry matter is not automatic payload. Carrier already embedded energy/vehicle assets and shared/multi-drop/empty return scope must have one owner. Range evidence need: Actual compatible as-transported payload, route distance, load share and empty/return/native-work conversion needed; no dry-to-cooked serving ratio, nominal box weight or default road distance. Measurement evidence: protocol cp_freight; original record basis mass*distance / kg*km. The original amount constraint “Actual attributable complete-load freight work per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: unused_count_returns
      applies_to: "ambient_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Actual unused new Count packing returned externally and matched to its same-scope input supplystock, native unit and recipient acceptance. Retained/internal movement is stock. Select gross input with separate return exchange OR consumed-only input with return exchange omitted; no duplicate deduction. Range evidence need: Require original supply pairing, real returned quantity/unit/receiver and chosen view; no standard return fraction or avoided packaging-production credit. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “Actual attributable returned unused packing units per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: unused_mass_returns
      applies_to: "ambient_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Real unconsumed external return of mass-measured service supplies matched to the original standalone input-stock scope and exact product/state. Commercial pasta returns are commodity movements, not negative service supply. Spent contaminated material remains waste. Range evidence need: Actual supply/return pairing, calibrated net mass and recipient state needed; no credit against unrelated current supplies, commodity inventory or inherited asset components. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable returned unused supply mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: unused_mass_returns_detergent_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: intact_pack_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual sealed finished packs transferred to a waste receiver, measured as the whole contents-plus-pack state. Usable supplier/buyer returns and retained rejected stock are different. The same contained pasta and pack are not also duplicate separate physical outlets. Loss upstream remains outside service, but actual handling/receiver treatment stays once. Range evidence need: Actual rejected SKU/lot/date/condition, whole-pack mass/tare inclusion and receiver disposition required; best-by passage alone does not prove physical disposal, contamination or environmental release. Measurement evidence: protocol cp_pasta; original record basis Mass / kg. The original amount constraint “Actual attributable sealed whole-pack waste mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: intact_pack_waste_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_pasta; actual source-linked native records"
    - id: loose_pasta_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual loose dry pasta pieces/fines physically collected after real breach or handling failure, with actual moisture/state/composition and residual contaminant basis. Breakage may change condition without loss; swept/captured material is a contained waste, not automatically airborne dust or pure dry solids. Range evidence need: Require actual collection mass/moisture basis/fate and rejected-versus-usable state; no stock-deficit=spillage, broken fraction=discarded yield or captured fines=particulate emission. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual attributable collected pasta-residue mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: loose_pasta_waste_atomic_case; loose_pasta_waste_pasta_fines. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: packaging_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual separately transferred primary or inherited/added secondary packaging with material/state/remaining contents recorded, excluding whole intact-pack waste and mixed cleanup-stream inclusion. There is no new retail packaging manufacturing or automatic recycling credit on resale. Range evidence need: Need actual material/SKU tare, remaining pasta/residue, net transfer and receiver/sorting/treatment basis; no standard bag/cardboard mass or recovered-material substitution factor. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual attributable separated packaging-waste mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: packaging_waste_paper_pack; packaging_waste_metal_pack; packaging_waste_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: cleanup_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual used wipes/absorbents/cleaning residues transferred as declared mixed physical streams, including retained pasta/fluid/chemicals only where measured in the stream. Keep clean supply and constituent analyses as nonadditive views; avoid duplicating loose-pasta or separated-pack transfers. Range evidence need: Actual measured net mass, state/constituent basis, retained-fluid and stream exclusion records needed; no purchased consumables=spent mass or assumed pasta moisture becomes wastewater. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual attributable mixed cleanup-solid mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleanup_waste_spent_wipe. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: wastewater
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual collected cleaning/incident liquid transferred to a receiver with native volume or compatible mass-density-temperature conversion, actual suspended/dissolved load and provider coverage. This route does not cook/rinse/hydrate pasta. Contained liquid and pollution-load analyses are distinct from direct environmental species. Range evidence need: Need actual collection and receiver record, density/temperature or volumetric basis and treatment/load evidence; no cooked-pasta water ratio, default COD or percentage-to-drain. Measurement evidence: protocol cp_outlets; original record basis Volume / m3. The original amount constraint “Actual attributable contained wastewater volume per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: direct_species
      applies_to: "ambient_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Only actual named species and receiving medium established independently by measured mass or justified matched activity/factor/composition/fate. Captured/swept fines, pack residues and contained wastewater are not direct species. Moisture difference, aroma, visual defect or ingredient list is not proof of dust, carbon dioxide, water-vapour or chemical release. Range evidence need: Require actual substance/particle size where relevant, medium, release activity and factor/composition/fate/conversion sources; no residual-to-air, flour-dust factor transplanted to sealed pasta or SDS=release. Measurement evidence: protocol cp_environment; original record basis Mass / kg. The original amount constraint “Actual attributable directly released species mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
validation_rules:
  - rule_id: reference_gate_check
    applies_to: "accepted_service"
    rule: "Unique final B2B accepted consignment N>0 with actual finished dry/packed release/SKU/shape/date/net/tare/moisture basis/state/timing; no pack/kg/cooked portion reference."
    source_ids: []
  - rule_id: processing_check
    applies_to: "whole route"
    rule: "No hidden raw milling/pasta manufacture/hydration/cooking/re-drying/repacking/product treatment or unreviewed climate intervention, including actual outsourced operations."
    source_ids: []
  - rule_id: commodity_loss_check
    applies_to: "non-exchange merchandise"
    rule: "Finished-gate assigned quantity and evidenced moisture-state share with exclusive returns/closing/other exits and actual compatible originalgate loss source/unit/state/owner/existing coverage outside once. No wet-weight deficit=dry solids loss/waste/species, no default zero."
    source_ids: []
  - rule_id: physical_owner_check
    applies_to: "resources periods assets"
    rule: "All actual user/source intervals/causal driver units and full life/remainder/EOL, direct/provider/carrier/treatment scope, new supply return convention and unfinished resources once; no per-turn pallet manufacture."
    source_ids: []
  - rule_id: state_outlet_check
    applies_to: "actual fates"
    rule: "Commercial usable returns/retained rejects distinct intact wholepack waste, loose captured pasta, separate pack/mixed cleanup/liquid and directly measured species. No component duplicates or capturedfines=airdust; actual receiver/treatment ownership."
    source_ids: []
  - rule_id: bilingual_raw_contract
    applies_to: "all content"
    rule: "Actual raw seven identity/five functional/six boundary/six reference/seven profile fields and every protocol12 fields/calculation body nonempty; row/evidence/units/rawoperands/sources/rules ENZH and deterministic projection align. Pass is not product-quality or final UUID proof."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after actual foreground completion and concrete exchange verification"
  downstream_use: "Physical ambient own-account sealed dry-pasta wholesale add-on, linked to separate finished dried/packed commodity demand and actual compatible loss once; not complete delivered pasta footprint"
  allowed_use: "Declared plain dry durum-semolina SKU/shape sealed packs through actual merchant B2B accepted cohort/gate with mass/moisture/date/pack/period qualifiers"
  excluded_use: "Raw grain/flour or manufacture, fresh/egg/stuffed/cooked/hydrated pasta/noodles/couscous/dishes, re-drying/repacking/treatment/climate intervention without review, retail/agency/standalone storage; safety/shelf-life guarantee"
  required_metadata: "Supplier/SKU/shape/source lot/finished release/merchant/buyer; actual net pasta and inherited tare/pack counts, date type/value and moisture method/basis/source/sample/time; actual conditions/stock/fates/periods; all-user resources/providers/assets/carriers/receivers; originalgate assigned quantity/state/unit/source/conversion/allocation/loss owner/existing coverage"
  required_quality_disclosure: "Actual mass/tare/calibration/moisture basis and native conversion compatibility; usable broken vs actual reject/disposal/captured residue/unknown changes; source-gate demand/loss adjustment and overlap; causal all-consumer driver/full-life remainder uncertainty; concrete flow/support/quantitative range gaps"
  update_trigger: "Product/SKU/ingredients/dry/seal/date/acceptance or actual storage state changes; introduced treatment/re-drying/repack/climate intervention; changed asset/provider/carrier/receiver boundaries; material loss/reject/release or source evidence change"
