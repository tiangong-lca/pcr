      collection_method: "Enumerate all warehouse/handling/reusable asset users and phases, matching complete lifecycle and compatible used/lifetime units with evidenced remaining use."
      unit: "Item(s) or actual lifecycle-native unit"
      frequency: "Each asset event and period review"
      temporal_coverage: "All actual linked service/stock/asset periods"
      site_scope: "All actual users and complete asset life"
