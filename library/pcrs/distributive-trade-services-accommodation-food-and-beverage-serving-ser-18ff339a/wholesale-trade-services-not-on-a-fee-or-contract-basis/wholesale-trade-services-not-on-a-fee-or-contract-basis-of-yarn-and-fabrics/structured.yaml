      raw_fields: "site_id; period_id; consignment_id; provider_id; service_id; event_date; completed_result; physical_quantity; native_unit; duration; duration_unit; performed_inspection_sample_scope; completion_evidence; material_coverage; energy_coverage; chemical_coverage; asset_lifecycle_coverage; freight_coverage; treatment_coverage; direct_release_coverage; actual_driver; driver_unit; all_consumer_driver; all_consumer_unit; missing_coverage"
      collection_method: "Verify actual performed result/native unit and complete scope, distinguishing inherited supplier reports and actual repeated inspection; reconcile direct/provider ownership."
      unit: "Actual provider physical native unit"
      frequency: "Each actual result"
      temporal_coverage: "All actual linked service/stock/asset periods"
