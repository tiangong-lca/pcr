      raw_fields: "site_id; period_id; consignment_id; event_id; event_time; time_zone; material_source; source_location; native_quantity; native_unit; measured_mass; mass_unit; collected_volume; received_volume; volume_unit; density; density_unit; temperature; temperature_unit; composition; concentration; concentration_unit; composition_basis; composition_source; conversion_factor; factor_unit; factor_basis; factor_source; purchased_direct_water; receiver; receiving_medium; treatment_dataset; treatment_coverage; direct_outfall; actual_driver; driver_unit; all_consumer_driver; all_consumer_unit; uncertainty"
      collection_method: "Measure actual native source and received state/quantity with composition and treatment owner; keep intake, purchased water, contained transfer and direct outfall distinct and non-additive."
      unit: "Actual native water/waste units"
      frequency: "Each actual source/receiver/outfall event"
      temporal_coverage: "All actual linked service/stock/asset periods"
