      flow_role: "direct_species"
      record_type: "Actual source/species/medium measurement or factor ledger"
      raw_fields: "site_id; period_id; consignment_id; event_id; start_time; end_time; time_zone; duration; duration_unit; source_role; actual_species; receiving_medium; particle_size_basis; measurement; measurement_unit; actual_activity; activity_unit; actual_burn; burn_unit; factor; factor_unit; factor_basis; factor_source; composition; composition_basis; composition_source; release_fraction; fate_basis; fate_source; gas_volume; volume_unit; pressure; pressure_unit; temperature; temperature_unit; molecular_conversion; conversion_unit; conversion_source; method; method_version; provider_coverage; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Use only actual species/medium proof and applicable actual source method with complete operands/units/sources; complete factors do not receive duplicate composition/fate multipliers. Unknown fabric moisture/mass difference is no pollutant or species method. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kg actual species with native operands"
      frequency: "Each actual measured/modeled interval"
      temporal_coverage: "All actual linked service/stock/asset periods"
      site_scope: "Actual source and receiving medium"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual measured/native records, calibration, scope ownership and uncertainty"
  calculation_rules:
    - id: normalization
      applies_to: "all rows"
      rule: "Assign real event use and compatible all-user shares to the actual consignment cohort, retaining idle/failed/unfinished work; divide by positive accepted N once."
      inputs:
        - cp_consignment
        - cp_energy
        - cp_supplies
        - cp_assets
        - cp_providers
        - cp_freight
        - cp_fates
        - cp_releases
      output: "Actual per-reference service quantity"
      source_ids: []
    - id: dimension_mass
      applies_to: "roll audit"
      rule: "For compatible actual same-state/extent segments, area=sum(length_i×included_width_i) after actual conversions to m. Keep full and usable/selvage area separate. Net fabric mass=gross roll minus actual core/wrap/other tare. Area×measured GSM converts to mass only when specimen/lot/selvage/conditioning basis and unit factor agree; otherwise preserve distinct measurements and discrepancy, no default density/GSM/regain."
      inputs:
        - cp_rolls
      output: "Actual roll length/area/net mass with compatibility and uncertainty"
      source_ids:
        - astm-woven-length
        - astm-fabric-width
        - astm-fabric-gsm
    - id: stock_demand
      applies_to: "roll memorandum"
      rule: "Compatible same-state roll stock: opening+external receipts+buyer returns-closing-physical dispatch-supplier returns-useful other exits-actual discard-net sample removal=unexplained residual. Independently reconcile actual dimensional/mass/state changes and map original finished-gate quantities to accepted demand/proven loss, closing/useful exits in original units/state. One additional linked demand accounts for identical baseline stage/loss coverage outside service; no residual-to-discard or universal defect/GSM/shrinkage factor."
      inputs:
        - cp_rolls
        - cp_consignment
      output: "Audited actual stock and separately linked finished-source-gate demand"
      source_ids: []
    - id: freight_quantity
      applies_to: "freight"
      rule: "Actual kg*km=actual included cargo converted to kg×actual distance converted to km, with documented non-overlap share and supplier/provider scope once. Other native freight units retain matching dataset support."
      inputs:
        - cp_freight
      output: "Actual attributed freight per reference"
      source_ids: []
    - id: actual_species
      applies_to: "direct_species; direct_species_co2_fossil_air; direct_species_methane_fossil_air; direct_species_nitrous_oxide_air"
      rule: "Use actual species/medium measurement or compatible source-specific actual activity/burn and factor with all required composition/fate/conversion evidence once. Gas conversions retain actual pressure/temperature/composition; complete factor not multiplied twice. Stock shortages/defects/safety limits cannot quantify emitted species."
      inputs:
        - cp_releases
        - cp_energy
        - cp_rolls
      output: "Actual evidenced species per reference"
      source_ids: []
  data_quality_requirements:
    - id: identity_state
      applies_to: "all rows"
      requirement: "Require actual material/service/species/receiver and native property support before final exchanges; Count support does not identify the fabric or service flow."
      evidence: "Verified details plus real foreground configuration"
    - id: roll_basis
      applies_to: "roll audit"
      requirement: "Retain actual methods, compatible full/usable/selvage extent, net/tare/GSM/conditioning/moisture and specimen-to-lot representativeness. Public scopes do not supply numeric conditioning/sample defaults or paid procedures."
      evidence: "cp_rolls; actual supplier/adopted measurement evidence"
    - id: scope_quality
      applies_to: "all responsibilities"
      requirement: "Keep direct/provider/asset/treatment scope once, finished supplier stages and baseline-loss assigned demand outside service, independent comparable ranges and unknown residuals explicit."
      evidence: "All-user/period/receiver coverage and measurement uncertainty"
    - id: electricity
      applies_to: "fabric_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Meter actual lighting, roll-handling equipment, inspection when actually performed and business support; no weaving, dyeing or finishing energy is inserted in this service. Range evidence need: Need interval meter evidence and scope for all rolls/jobs, inspection/idle and shared users; a standard kWh per metre or commercial lot is unsupported. Measurement evidence: protocol cp_energy; original record basis Energy / kWh. The original amount constraint “Actual quantity allocated to this reference consignment with cp_energy; retain native measurement and compatible conversion.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_energy; actual source-linked native records"
    - id: facility_water
      applies_to: "fabric_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Actual cleaning/support water is separate from inherited fabric moisture and any upstream wet finishing. Real test/sample support is included only when performed and recorded. Range evidence need: Need actual use purpose/meter quantity and external supplier scope; fabric regain, conditioning humidity and wastewater are not direct evidence of purchased water. Measurement evidence: protocol cp_supplies; original record basis Volume / m3. The original amount constraint “Actual quantity allocated to this reference consignment with cp_supplies; retain native measurement and compatible conversion.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: facility_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: new_outer_protection
      applies_to: "fabric_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Include only new external film/straps/labels actually added without slitting, rerolling or replacing the original roll presentation. Inherited core/wrap is commodity state; reusable handling cradles use asset life. Range evidence need: Need actual protection SKU/level and measured mass or evidenced piece/area conversion, distinguishing inherited core/tare and reusable equipment. No new full-core/wrap manufacture per sale by default. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual quantity allocated to this reference consignment with cp_supplies; retain native measurement and compatible conversion.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: new_outer_protection_pe_film. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: operating_supplies
      applies_to: "fabric_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand actual lubricants, cleaners, absorbents, measurement/test consumables and other operated support in native SKU/state. Dyes, finishes, processing chemicals and automatic moth/mould treatments are outside this route. Range evidence need: Need actual formulation/concentration, net stock receipts/closing/return and receiver or release records. Presence of a chemical in inherited finish or an SDS is not new purchase or measured emission. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual quantity allocated to this reference consignment with cp_supplies; retain native measurement and compatible conversion.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: operating_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: fuel_supply
      applies_to: "fabric_wholesale"
      requirement: "Which purchased fuel grade/formulation and supply gate are on the stock record? Identify any fuel other than the named diesel case and its native unit; obtain actual density before a volume-to-mass conversion. Keep actual grade/native supply and stock; record burn separately from nonburned returns/wastes/loss. A complete hired carrier/handling service may already cover this fuel. Range evidence need: Need actual opening/net receipts/closing and disjoint native fates plus any density/temperature/factor source. Fuel delivered to site is not necessarily burned for accepted rolls. Measurement evidence: protocol cp_supplies; original record basis Volume / L. The original amount constraint “Actual quantity allocated to this reference consignment with cp_supplies; retain native measurement and compatible conversion.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: fuel_supply_diesel_supply. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_services
      applies_to: "fabric_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Use real completed external handling/storage/inspection/testing/maintenance/hygiene and support in its native physical unit. Supplier measurement reports are inherited evidence, not proof of a repeated wholesale test. Range evidence need: Need actual result/unit, performed sample scope and all material/energy/asset/freight/treatment coverage. No full-roll inspection or paid-test procedure is inferred from public standard scope. Measurement evidence: protocol cp_providers; original record basis Count / Item(s). The original amount constraint “Actual quantity allocated to this reference consignment with cp_providers; retain native measurement and compatible conversion.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_providers; actual source-linked native records"
    - id: shared_assets
      applies_to: "fabric_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Cover actual building/racks/roll lifts/cradles/meters/ICT and reusable transport assets through full manufacture, maintenance, replacement and end-of-life across all users. Range evidence need: Need compatible used/lifetime driver units, observed history and evidenced remaining use/termination with uncertainty, plus all period/consumer links. A roll count is not the whole asset or a fixed lifespan. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual quantity allocated to this reference consignment with cp_assets; retain native measurement and compatible conversion.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "fabric_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Use transported actual fabric-plus-core/wrap/declared tare cargo, not saleable fabric area or nominal GSM alone. Separate delivered supplier-gate legs, returns and real empty/shared journeys. Range evidence need: Need actual load/tare/core/pack scope, leg distance and compatible conversion/share sources; no blanket kg per roll, width, area or truck loading factor. Measurement evidence: protocol cp_freight; original record basis Mass*distance / kg*km. The original amount constraint “Actual quantity allocated to this reference consignment with cp_freight; retain native measurement and compatible conversion.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: environmental_water
      applies_to: "fabric_wholesale"
      requirement: "Identify the actual abstraction point, water body/aquifer, location and measured source volume from intake permits/meter records. Surface water and groundwater require distinct source identities; no direct withdrawal is established by purchased water use. Identify actual source withdrawal only when the warehouse directly extracts it. Inherited cotton moisture or an atmospheric conditioning state is not a fabricated water intake. Range evidence need: Need source/location/purpose meter quantity and reporting boundary; purchased facility water remains Product and no litre-per-fabric-metre factor is adopted. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual quantity allocated to this reference consignment with cp_fates; retain native measurement and compatible conversion.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: usable_supply_returns
      applies_to: "fabric_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only a real external return of the same standalone supply scope can match an operating input. Consumed-only accounting omits the corresponding return exchange; merchant fabric/core/wrap returns remain stock audit. Range evidence need: Need actual native transfer, recipient and input/state match, keeping retained recovery/internal loops in closing stock; no negative unmatched input or automatic credit. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual quantity allocated to this reference consignment with cp_supplies; retain native measurement and compatible conversion.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_supply_returns_detergent_return; usable_supply_returns_pe_film_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: discarded_fabric_rolls
      applies_to: "fabric_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Record actual receiver-approved discarded roll/portion/sample quantity and actual textile/core/wrap composition. When receiver takes the mixed roll its component audit views do not add second waste exchanges; inherited manufacture stays outside service. Range evidence need: Need real discard/recipient/treatment record and native mass or justified compatible area-to-mass measurement, plus original finished source-gate equivalent. Defect points, short length or moisture decline alone is not discarded kg. Measurement evidence: protocol cp_rolls; original record basis Mass / kg. The original amount constraint “Actual quantity allocated to this reference consignment with cp_rolls; retain native measurement and compatible conversion.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: discarded_fabric_rolls_atomic_case; discarded_fabric_rolls_fabric_piece. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_rolls; actual source-linked native records"
    - id: other_wastes
      applies_to: "fabric_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Expand actual used support/cleaning fractions and service-added protection by real receiver/state; exclude discarded-roll constituent amounts already in its whole waste. Range evidence need: Need measured native quantity/conversions/composition and treatment coverage; discarded inherited core does not automatically cause a new purchased core input or recycled-material credit. Measurement evidence: protocol cp_fates; original record basis Mass / kg. The original amount constraint “Actual quantity allocated to this reference consignment with cp_fates; retain native measurement and compatible conversion.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: contained_wastewater
      applies_to: "fabric_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Use actual liquid transferred to treatment from performed cleaning or real sample support. Routine wholesale does not wash/finish fabric or generate upstream textile effluent here. Range evidence need: Need collected/received volume, native composition/basis, purpose/source and treatment owner; fabric moisture or all incoming facility water cannot stand in for measured wastewater. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual quantity allocated to this reference consignment with cp_fates; retain native measurement and compatible conversion.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: water_outfalls
      applies_to: "fabric_wholesale"
      requirement: "Identify the direct outfall and receiving water/soil compartment, measured water amount and independently analysed pollutant species. A sewer transfer to treatment is not this outfall; the missing receiving compartment prevents a concrete elementary-flow selection. Only actual release to an environmental receiving medium is this flow, distinct from contained Waste transfer; retain actual quality and species views without duplicate volume. Range evidence need: Need actual outfall/location/interval measured volume and composition; sewer collection or unspecified dampness is not direct discharge evidence. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual quantity allocated to this reference consignment with cp_fates; retain native measurement and compatible conversion.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: direct_species
      applies_to: "fabric_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Expand only actual supported combustion/cleaning/maintenance or fabric-origin dust/water/chemical species and receiving medium. No fabric mass deficit or inherited finishing chemical implies emitted pollutant, particle size or formula. Range evidence need: Need measured species or compatible actual source/activity/burn, method/factor, composition/fate and conversion operands with units/sources. Generic total dust/volatile labels or a hazard limit cannot fix UUID or emitted kg. Measurement evidence: protocol cp_releases; original record basis Mass / kg. The original amount constraint “Actual quantity allocated to this reference consignment with cp_releases; retain native measurement and compatible conversion.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: direct_species_co2_fossil_air; direct_species_methane_fossil_air; direct_species_nitrous_oxide_air. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_releases; actual source-linked native records"
validation_rules:
  - rule_id: accepted_count
    applies_to: "accepted_service"
    rule: "Verify actual merchant resale final positive accepted consignment N and every physical qualifier; no roll/metre/m2/kg equivalence."
    source_ids: []
  - rule_id: roll_compatibility
    applies_to: "merchandise"
    rule: "Check actual length/full-or-usable-width/selvage, net/core/wrap tare, moisture/temperature/conditioning/sample/GSM method and matched conversion; inconsistent basis or nonrepresentative swatch cannot establish lot mass."
    source_ids:
      - astm-woven-length
      - astm-fabric-width
      - astm-fabric-gsm
  - rule_id: route_exits
    applies_to: "fabric_wholesale"
    rule: "Require actual accepted/rejected/damaged/sample/return/downgrade/discard state and receiver; do not silently introduce cutting/rerolling or count unresolved rejected roll as accepted."
    source_ids: []
  - rule_id: upstream_interface
    applies_to: "merchandise"
    rule: "Match complete actual finished original-gate states/assigned demand/conversions/closing/useful exits and identical already-covered losses once outside; cotton/lint/yarn alone is insufficient."
    source_ids: []
  - rule_id: all_period_owners
    applies_to: "all service obligations"
    rule: "Enumerate all users/periods/events, complete asset phases and compatible used/lifetime drivers with observed/evidenced remainder. Failed and unfinished work retains burden; no double provider, treatment, freight, per-N or return credit."
    source_ids: []
  - rule_id: physical_evidence
    applies_to: "all rows"
    rule: "Require actual native quantities, receiver and source/unit/basis conversion and species proof; omit matched return under consumed-only and retain non-additive whole-roll/component/water/species views."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after identity and actual completeness review"
  downstream_use: "Finished original-roll cotton woven wholesale add-on linked separately to complete finished-fabric supplier gate and actual assigned demand/loss"
  allowed_use: "Actual merchant-owned ambient original-roll finished cotton woven consignment with compatible dimensions/mass/conditioning and actual buyer acceptance"
  excluded_use: "Standalone fabric footprint; cotton/lint/yarn or knitted/special fabric; manufacturing/cutting/rerolling; paid-test compliance recipe; agency/retail/storage-only"
  required_metadata: "Actual SKU/composition/weave/finish/roll/lot/merchant/buyer/site/period, length/width/selvage/area/net/tare/GSM/moisture/conditioning/sample/defect/acceptance, finished gate and demand/loss owner, actual provider/asset/freight/treatment scope"
  required_quality_disclosure: "Actual flow/support gaps, dimensional/conditioned mass/sample representativeness and range uncertainty, missing upstream stages/baseline loss coverage, unexplained stock/fates and all-user/lifetime assumptions"
  update_trigger: "Changed fibre/finish/presentation/measurement/sample/state/acceptance or processing, dedicated preservation, supplier gate/loss interface, asset/provider/freight/treatment responsibilities"
data_sources:
  - id: "unsd-cpc3-fabric-wholesale"
    type: "official_guidance"
    reference: "UNSD CPC3 explanatory notes (30 June2025), printed pages301–302,61031/group266. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification only: cotton woven fabric merchant service is a narrower yarn/fabrics wholesale subset."
  - id: "astm-woven-length"
    type: "standard"
    reference: "ASTM D3773/D3773M-10(2024), public publisher abstract/scope only. https://store.astm.org/d3773_d3773m-10r24.html"
    used_for: "Full rolls/bolts and actual length-method distinction; no paid procedure or obligatory wholesale remeasurement adopted."
  - id: "astm-fabric-width"
    type: "standard"
    reference: "ASTM D3774-18(2024), public publisher scope only. https://store.astm.org/d3774-18r24.html"
    used_for: "Full/usable width and declared selvage/roll-or-specimen extent; no universal width, sampling or conditioning values."
  - id: "astm-fabric-gsm"
    type: "standard"
    reference: "ASTM D3776/D3776M-20(2025), public publisher abstract/scope only. https://store.astm.org/d3776_d3776m-20r25.html"
    used_for: "Mass-per-area, specimen/conditioning/selvage basis and limited small-swatch representativeness; actual adopted complete method/lot evidence required, no fixed GSM."
