      collection_method: "Record real event/period meter differences and separately measured burn; reconstructed burn needs complete mutually exclusive native stock fates and investigation of unknown loss. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "Actual energy/fuel units"
      frequency: "Each meter/event interval"
      temporal_coverage: "All actual linked service/stock/asset periods"
      site_scope: "All actual service users"
