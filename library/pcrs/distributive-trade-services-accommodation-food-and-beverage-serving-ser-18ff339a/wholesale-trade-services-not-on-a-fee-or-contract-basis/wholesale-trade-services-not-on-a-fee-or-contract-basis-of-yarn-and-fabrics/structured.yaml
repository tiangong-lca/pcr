    - protocol_id: cp_supplies
      process_id: "fabric_wholesale"
      flow_role: "facility_water; new_outer_protection; operating_supplies; fuel_supply; usable_supply_returns"
      record_type: "Actual native supply and external-return inventory"
      raw_fields: "site_id; period_id; consignment_id; event_id; event_time; time_zone; SKU; formulation; concentration; concentration_unit; composition_basis; composition_source; native_unit; opening; receipt_gross; receipt_tare; receipt_net; closing; retained_recovery; usable_external_return; return_recipient; matched_input_id; gross_consumed_view; omit_matched_return_exchange; actual_waste; actual_loss; inherited_new_pack_level; density; density_unit; temperature; temperature_unit; conversion_factor; factor_unit; factor_basis; factor_source; actual_purpose; original_supply_owner; provider_coverage; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Measure same-state net receipts/stock and real external fates; inherited cores/wraps are not new operating inputs. Netting requires matching standalone supply and omitted return exchange. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero. Any litre-to-kg diesel conversion requires actual compatible density, temperature/state, mass-per-volume unit and source; no default conversion."
      unit: "Actual native supply unit"
      frequency: "Each receipt/issue/return/stocktake"
      temporal_coverage: "All actual linked service/stock/asset periods"
      site_scope: "Actual standalone service supply"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual measured/native records, calibration, scope ownership and uncertainty"
    - protocol_id: cp_assets
