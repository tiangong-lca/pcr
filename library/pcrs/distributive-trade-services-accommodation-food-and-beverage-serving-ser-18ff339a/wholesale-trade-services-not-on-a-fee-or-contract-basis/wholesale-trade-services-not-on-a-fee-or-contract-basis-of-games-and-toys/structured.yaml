    - id: unique_packed_freight
      applies_to: "freight"
      rule: "For each unique load-leg use measured actual packedpayload OR same-state gross minus ONLY vehicle/noncargo tare; retain cargo packaging/moisture/finish and do not add component audits. EACH multiplies evidenced repetitions; TOTAL does not. Convert load×distance to kg*km with explicit factor units/bases/sources, assign once through compatible full-all-user share, sum unique assigned loads then /N once unless already per reference."
      inputs:
        - cp_freight
      output: "Actual exclusive per-reference freight"
      source_ids: []
    - id: measured_species
      applies_to: "direct_species; direct_species_co2_fossil_air; direct_species_methane_fossil_air; direct_species_nitrous_oxide_air"
      rule: "Use measured actual species/medium OR actual compatible activity×factor with native units/bases/sources and factor coverage. Apply composition/fate/conversion only if required once, with relevant temperature/pressure units/sources; no wood/paint content or stock residual emission factor."
      inputs:
        - cp_releases
        - cp_energy
        - cp_toysets
      output: "Actual evidenced direct species quantity"
      source_ids: []
  data_quality_requirements:
    - id: finished_identity
      applies_to: "all identities"
      requirement: "Final exchanges need actual set/part/material/finish, service/provider/source/receiver/species identity and compatible native support; Count support alone does not identify a commercial consignment."
      evidence: "Actual manufacturer/lot/commercial evidence and verified detail/support"
    - id: native_components
      applies_to: "commodity and mixed-waste components"
      requirement: "Each independently measured part/wood/moisture/paint/lacquer/carrier/absorbed liquid/fragment has its own native unit/basis/method/state/source and sampletime where relevant; no whole-set or pack-weight substitution."
      evidence: "cp_toysets; cp_fates; cp_releases"
    - id: coverage_unknowns
      applies_to: "whole service and linked source"
      requirement: "Disclose incomplete genealogy/state/stock/source assignment and original-gate coverage, unknown losses/fates, all-user lifetime remainder uncertainty and actual provider/treatment gaps. Candidate completeness is not final chain/data readiness."
      evidence: "Native records, coverage matrix, uncertainty and row-specific evidence needs"
    - id: electricity
      applies_to: "toy_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Meter actual warehouse lighting, handling and business-support consumption. No manufacture, assembly, painting, curing or powered toy demonstration is included. Range evidence need: Require actual meter intervals, connected consumers and complete event/period attribution including idle/failed work; no kWh per block/set inferred from manufacturer finish. Measurement evidence: protocol cp_energy; original record basis Energy / kWh. The original amount constraint “Actual exclusively attributed physical amount / N from cp_energy” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_energy; actual source-linked native records"
    - id: facility_water
      applies_to: "toy_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Include actual hygiene/support supply, separate from wood moisture and manufacturer paint/lacquer water. No merchant washing of blocks is assumed. Range evidence need: Require source/purpose, native volume meter and supply coverage plus actual fates; product moisture and purchased quantity do not establish wastewater. Measurement evidence: protocol cp_supplies; original record basis Volume / m3. The original amount constraint “Actual exclusively attributed physical amount / N from cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: facility_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: new_outer_protection
      applies_to: "toy_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Only real service-added outer cartons, film, straps and labels are supplies. The original retail set box, internal trays and factory finish remain inherited commodity. Reusable crates/pallets use lifetime attribution. Range evidence need: Require added-versus-inherited pack levels, actual SKU/mass or evidenced count/area conversion and unique stock/event links; no full new pack/pallet per consignment default. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual exclusively attributed physical amount / N from cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: new_outer_protection_pe_film; new_outer_protection_paperboard_carton. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: operating_supplies
      applies_to: "toy_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand actual equipment lubricants, cleaners, wipes, absorbents, filters and office supplies by native SKU/composition. Manufacturer acrylic paint/clear lacquer is not current service paint/solvent, and no repainting or block cleaning is prescribed. Range evidence need: Require actual purpose, net receipt/stock/return, formulation and spent carrier/absorbed contents evidence; paint present on blocks neither measures new service supply nor release. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual exclusively attributed physical amount / N from cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: operating_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: fuel_supply
      applies_to: "toy_wholesale"
      requirement: "Which purchased fuel grade/formulation and supply gate are on the stock record? Identify any fuel other than the named diesel case and its native unit; obtain actual density before a volume-to-mass conversion. Track real grade and stock separately from actual burn, usable return and waste; reconcile hired handling and freight coverage before adding supply. Range evidence need: Require native opening/net receipts/closing and disjoint actual fates, density and temperature units/conversion sources when needed; purchases do not automatically equal combustion. Measurement evidence: protocol cp_supplies; original record basis Volume / L. The original amount constraint “Actual exclusively attributed physical amount / N from cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: fuel_supply_diesel_supply. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_services
      applies_to: "toy_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Use performed storage, handling, document/visual completeness checks, maintenance or business support in its actual native physical unit. Supplier safety labels or certificates alone are not a performed merchant test; play, assembly and destructive product testing are outside this route. Range evidence need: Require performed result and included energy/material/assets/freight/receiver treatment; any actual representative condition measurement needs method/sample disposition without hiding excluded product tests. Measurement evidence: protocol cp_providers; original record basis Count / Item(s). The original amount constraint “Actual exclusively attributed physical amount / N from cp_providers” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_providers; actual source-linked native records"
    - id: shared_assets
      applies_to: "toy_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Include actual building/racks/lifts/meters/ICT and reusable containers/pallets for all consumers/periods through full manufacture, maintenance, replacement and end-of-life. The traded toy set is merchandise, not warehouse equipment. Range evidence need: Require compatible used/lifetime driver units, observed history plus evidenced remaining life/termination, full phase coverage and uncertainty/sensitivity/update; no standard service life or repeated full asset per trip. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual exclusively attributed physical amount / N from cp_assets” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "toy_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Use actual packed cargo including original and added cargo packaging, retained wood moisture and factory finish; vehicle/noncargo tare alone is subtracted from same-state gross. Avoid delivered/provider overlap. Range evidence need: Require unique load/leg IDs, EACH versus TOTAL basis, measured payload or gross/noncargo tare, native quantity-distance factors and complete all-user shares; no nominal part/set mass. Measurement evidence: protocol cp_freight; original record basis Mass*distance / kg*km. The original amount constraint “Actual exclusively attributed physical amount / N from cp_freight” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: environmental_water
      applies_to: "toy_wholesale"
      requirement: "Identify the actual abstraction point, water body/aquifer, location and measured source volume from intake permits/meter records. Surface water and groundwater require distinct source identities; no direct withdrawal is established by purchased water use. Only actual merchant-operated withdrawal crosses this boundary; inherited block/box moisture and ambient uptake do not establish extraction. Range evidence need: Require withdrawal source/location/meter interval/native conversion and non-overlap with purchased water; no wood-moisture-to-water-supply proxy. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual exclusively attributed physical amount / N from cp_fates” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: usable_supply_returns
      applies_to: "toy_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only actual same-scope standalone supply SKU/state returns belong here. Consumed-only input accounting OMITs the matched return exchange. Internal loops/recovered retained stock stay closing; merchandise sets/parts/finish/box returns are stock audit. Range evidence need: Require recipient/native quantity and matched input provenance; no netting inherited factory coat or toy parts against unrelated current supplies, negative inputs or automatic credits. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual exclusively attributed physical amount / N from cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_supply_returns_detergent_return; usable_supply_returns_pe_film_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: discarded_toy_sets
      applies_to: "toy_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Use actual separately evidenced receiver state/quantity for discarded sets, individual parts, fragments or mixed original packs. Whole set, component wood/moisture/coating and pack views are non-additive. Missing one block does not establish whole-set discard or upstream loss. Range evidence need: Require actual disposition, set-to-part genealogy, native amount/state/net-tare and receiver/treatment coverage with exclusive original-gate correspondence; an incomplete box or weight deficit is not discarded mass. Measurement evidence: protocol cp_toysets; original record basis Mass / kg. The original amount constraint “Actual exclusively attributed physical amount / N from cp_toysets” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: discarded_toy_sets_atomic_case; discarded_toy_sets_wooden_toy_block. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_toysets; actual source-linked native records"
    - id: other_wastes
      applies_to: "toy_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Record actual spent wipes, absorbents, filters and service-added packs; measured carrier plus absorbed liquid and collected wood/coat fragments form one mixed receiver stream. No manufacturing dust or repainting residue is invented. Range evidence need: Require receiver mixed mass and each carrier/absorbed-liquid/fragment native unit/basis/source and fate; component audits do not add again to the whole mixed waste or commodity discard. Measurement evidence: protocol cp_fates; original record basis Mass / kg. The original amount constraint “Actual exclusively attributed physical amount / N from cp_fates” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: other_wastes_spent_wipe. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: contained_wastewater
      applies_to: "toy_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Measure actual free liquid transferred to treatment from performed facility work, separate from retained toy moisture/coat and liquid held in cleanup solids. No block washing/paint shop effluent is assumed. Range evidence need: Require actual collected/received native volume/composition/event/source and receiver/treatment scope; supplied water and wet wipe mass are not wastewater-volume estimates. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual exclusively attributed physical amount / N from cp_fates” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: water_outfalls
      applies_to: "toy_wholesale"
      requirement: "Identify the direct outfall and receiving water/soil compartment, measured water amount and independently analysed pollutant species. A sewer transfer to treatment is not this outfall; the missing receiving compartment prevents a concrete elementary-flow selection. Only measured actual environmental discharge is an outfall; contained transfer is Waste. Moisture exchange in wood/box remains product-state audit unless an actual relevant release is established. Range evidence need: Require actual receiving location/medium/interval/volume and composition/fate evidence with native factors; damp packaging or cleanup does not prove discharge. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual exclusively attributed physical amount / N from cp_fates” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: direct_species
      applies_to: "toy_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Expand only actual chemical/species/particle-size and receiving-medium evidence from real combustion, maintenance or incidents. Wood carbon, acrylic paint/clear lacquer content, odour, aging, missing part or stock deficit does not quantify CO2, VOC or dust. Range evidence need: Require actual species/medium measurement or compatible activity/factor with native units, composition, temperature and fate basis/source applied once; no universal finish-emission factor. Measurement evidence: protocol cp_releases; original record basis Mass / kg. The original amount constraint “Actual exclusively attributed physical amount / N from cp_releases” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: direct_species_co2_fossil_air; direct_species_methane_fossil_air; direct_species_nitrous_oxide_air. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_releases; actual source-linked native records"
validation_rules:
  - rule_id: real_commercial_gate
    applies_to: "accepted_service"
    rule: "Require N>0 actual unique owned/resold final business-accepted consignments after reversals with all sixteen qualifiers; no set/block/kg/price substitution."
    source_ids: []
  - rule_id: set_part_finish
    applies_to: "merchandise"
    rule: "Check actual complete set-part genealogy/count/shapes/box inclusions, actual wood/paint/clearcoat and native net/gross/tare/component/moisture state/unit/basis/method/sampletime/source. No universal forty parts/age/pack net mass/conformity guarantee."
    source_ids:
      - ikea-construction-toy
  - rule_id: actual_route_only
    applies_to: "toy_wholesale"
    rule: "Link all batch/period/changeover/idle/failed/rejected/unfinished and real condition checks; actual missing/damaged/contaminated set/parts have unique quarantine/return/useful-other/discard/sample fates. No hidden assembly/play/testing/repaint/cleaning/repack route."
    source_ids: []
  - rule_id: complete_exclusive_source
    applies_to: "commodity interface"
    rule: "Verify complete finished-gate stages and original-unit/state/source demand with direct trace OR positive complete competing all-exit drivers, each quantity/unit/basis/source/link/owner incl closing/useful-other/return/proven loss, no accepted-only or direct+driver overlay. Unknown is no zero; baseline identical stage/loss coverage and required additional demand link outside once."
    source_ids: []
  - rule_id: full_asset_all_users
    applies_to: "all resources"
    rule: "Require actual all consumer/period driver records, full asset manufacture/maintenance/replacement/EOL, observed+sourced remaining/termination compatible units and uncertainty/sensitivity/update; no duplicate asset/provider or N. No-acceptance resources retain attribution."
    source_ids: []
  - rule_id: stock_fates_freight
    applies_to: "all physical inventory"
    rule: "Verify net-receipt/closing/recovery/matched-return provenance and gross+return OR consumed-only OMIT return, nonnegative unrelated scopes. Mixed/whole/component/free-liquid/species views non-additive with receiver treatment once. Freight retains original/new cargo packs/moisture/finish, subtracts only vehicle/noncargo tare, uses unique EACH/TOTAL loads, explicit native factors/full shares/N once."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
