      rule: "At a compatible native state, opening+receipts+buyer_returns-closing-dispatch-supplier_returns-useful_other_exits-actual_discard-net_sample_removal=unknown_residual. Actual set/part genealogies and material/moisture/paint/clearcoat component measurements remain separate non-additive audit views; missing part or residual is not whole-set loss/species."
