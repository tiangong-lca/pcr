allocation_rules:
  - rule_id: direct_shared_period
    applies_to: "all actual resources"
    rule: "First trace direct events or allocate with actual compatible target_driver/positive complete all_consumer_driver across periods, idle/failed/rejected/unfinished and other clients; record driver units/bases/sources and exclusive owners. Normalize assigned totals by accepted N once; no sales-price/margin allocation by default."
    source_ids: []
  - rule_id: source_exclusive_assignment
    applies_to: "commodity interface"
    rule: "For each original source lot/state select ONE view: directly traced/measured assigned_gate_demand with native unit/state/source/direct evidence and exclusive exit links; OR assigned_gate_demand=actual_source_gate_quantity × target_driver / positive complete source_all_exit_driver. The denominator sums compatible driver records for ALL competing accepted/useful-other-exit/returns/closing-carry/proven actual-loss exits, each quantity/unit/basis/source/link and one owner. Never use accepted-only denominator or overlay direct+driver views; actual loss burden assignment must identify its actual exit/group and exclusive owner. Unknown losses cannot be zero. Additional finished-gate demand and identical already-covered baseline demand use compatible original unit/state/source and evidenced conversions, linked outside service once."
    source_ids: []
  - rule_id: supply_return_convention
    applies_to: "service supplies"
    rule: "S=assigned opening+NET external receipts-closing including retained recoveries. Use gross S/N with real matched unused external return OR consumed (S-return)/N and OMIT that matched return exchange. Internal loops/retained recovery are stock; wasted/consumed supplies retain burden. Do not subtract inherited toy coat/parts from unrelated current supplies or create negative input/automatic credit."
    source_ids: []
  - rule_id: full_asset_service
    applies_to: "shared assets/providers"
    rule: "Attribute complete life manufacture/maintenance/actual replacement/EOL using actual used_driver/lifetime_all_consumer_driver in compatible units, observed history plus sourced remaining/termination, uncertainty/sensitivity/update. All nodes/periods consume once. Choose asset equivalent OR lifecycle-complete provider representation, not both; divide by N once only if not already normalized."
    source_ids: []
  - rule_id: fate_nonadditive
    applies_to: "actual waste/releases"
    rule: "Whole set/part/package and component wood/moisture/coat audits, mixed cleanup carrier/absorbed liquid/fragments, free wastewater and direct species are exclusive/non-additive views. Assign actual receiver transport/treatment once with provider coverage, no automatic recovery credit. Rejected/unfinished work is not accepted output and retains real resources."
    source_ids: []
  - rule_id: commodity_link_scope
    applies_to: "nonexchange commodity interface"
    rule: "Keep actual original-gate stock and completed external integration at their recorded raw quantities. Declare source_assignment_scope_id, actual target_consignment_ids/target_cohort_id and source_assignment_quantity_basis: single_consignment_case, target_cohort_total or already_per_reference. For a raw target-cohort total, source_link_per_service_quantity=source_link_assigned_raw_quantity/same_target_scope_N ONLY when the positive N covers exactly that assigned target scope, with actual native units/state/source and acceptance-reversal evidence; use that interface once when combining with 1 accepted_service. A single-consignment case with N=1 and an already-per-reference quantity are not divided again. Do not divide actual external stock/stage-integration records by service N or use whole-source-cohort N for a narrower assigned target; preserve raw quantities and an explicit once-only link."
    source_ids: []
