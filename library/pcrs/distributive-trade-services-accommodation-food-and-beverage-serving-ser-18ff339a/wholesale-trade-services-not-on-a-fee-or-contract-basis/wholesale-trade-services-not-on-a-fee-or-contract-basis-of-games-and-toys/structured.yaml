    - id: normalization
      applies_to: "all service cards"
      rule: "Actual assigned amount=direct traced event OR actual resource×compatible target_driver/positive complete all_consumer_driver. Retain idle/failed/rejected/unfinished work, reconcile carry and all users, then assigned cohort total/N once."
