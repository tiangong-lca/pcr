    rule: "Only NON-EDIBLE INDUSTRIAL tube water ice whose actual supplier SKU, market presentation and independent classification evidence confirm CPC 17400 is in scope. Edible ice and ice presented for food or beverage use (22270), and SKUs lacking that confirmation, are excluded. Industrial buyer or use, tube form, RO treatment or purity alone do not establish 17400. Obtain supplier market-presentation/non-edible evidence and a documented classification decision before admitting a consignment; generic supplier webpages are not actual SKU proof. For power multiplied by duration, use ONLY actual interval-AVERAGE electrical power over that SAME observed interval, including actual compressor cycling, fans, defrost and idle duties. Record interval start/end/timezone, averaging population/method/source and actual duty-cycle evidence. Instantaneous or nameplate power alone is not consumed energy. An already integrated meter kWh reading is NOT multiplied by duration again. | validate_concrete_identity_decisions | all inventory rows | Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required. | |"
