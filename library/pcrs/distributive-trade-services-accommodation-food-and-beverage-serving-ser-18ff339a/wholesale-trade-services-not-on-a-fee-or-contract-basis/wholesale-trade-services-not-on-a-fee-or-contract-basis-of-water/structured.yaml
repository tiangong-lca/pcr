      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| finalN | actual preservation-trade responsibilities | Verify source ownership/resale,businessbuyer and unique FINAL commercialacceptances afterreversals;not bag/kg/icevolume/value. Failed/unfinished/canceled duties retain actual resources/period/cohort,N0no divide. |  |\n| source_allterminal | actual preservation-trade responsibilities | Directtrace OR original_gate_quantity*numerator_driver/positive complete source_all_exit_driver. Compatible complete source cohort includes every accepted,closing/unsold/rejectedretained,usefulother,return and real whole/solid/mixed/liquid source exit,each native metadata/owner/original-link/exclusivity/numerator membership,not accepted-only denominator. Priorclosing→opening sameqty-state-sourceowner is one carry,not newpurchase/upstream/FINALN/two terminal demands. Match baseline/additional source-stage/loss coverage and ACTUALcompleted missingstage/demand integration outsideonce. Phase melting retained in bag is not source quantity loss. |  |\n| stock_assets | actual preservation-trade responsibilities | NET material receipts exclude container tare. Gross INPUTS with separate matched-unused OUTPUT ORconsumedS-return INPUT OMIToutput;no numericS+return,doublecredit. Refrigerant same-scope provenance additionally required;factorycharge recovery never nets unrelated makeup. Full assets use compatible all-user observed+sourced remainder/termination life drivers,uncertainty/update and complete charge production/EOL coverage once. |  |\n| exclusive_physical | actual preservation-trade responsibilities | Actual solid/liquid/bag/carrier and refrigerant component views nonadditive to physical outlets. Useful transfers carry actual source burden owner,no automatic avoided production;receiver transport/treatment once. Per unique freight leg THAT share INSIDE summand,N once,provider coldenergy/fuel/refrigerant/assets/empty coverage exclusive. |  |\n\n\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| source_scope_normalization | nonexchange commodity and service combination | Keep original external commodity stock, source assignment/loss and missing-stage/additional upstream integration quantities in their evidenced RAW actual scope. Identify whether each amount is one actual consignment, a target service cohort, or ALREADY per reference,with source/target scope IDs and quantity basis. The physical source-cohort all-exit denominator assigns RAW quantity to that target scope; it is not automatically the target accepted-service N. Only when combining that same target-scope commodity amount with the 1 Item(s) service derive amount per reference = RAW assigned amount / positive unique accepted source_same_scope_N,with acceptance IDs/time/reversal evidence. A proved single-case scope has source_same_scope_N=1; an already-per-reference amount is not divided again. Preserve raw integration quantities and source links; do not shrink actual upstream remediation or divide the whole source cohort by an unrelated N. N0 responsibility remains disclosed without division. |  |\n\n"
