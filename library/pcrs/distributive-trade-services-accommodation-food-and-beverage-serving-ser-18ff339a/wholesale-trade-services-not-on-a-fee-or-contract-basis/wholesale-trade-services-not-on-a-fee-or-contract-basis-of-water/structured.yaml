      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual usable factoryclosedbag tubewaterice received at declared phase/temp-time/sourceSKU/condition |\n| starting_condition_role | Ice-water/closedbag nonexchange merchandise before actual frozen preservation |\n| product_classification_scope | Confirmed NON-EDIBLE INDUSTRIAL waterice17400 within61098 using actualSKU/marketpresentation/non-edible classification decision;exclude edibleice22270,unconfirmedSKU and dryice34210 |\n| recursive_input_rule | Only complete disjoint actual provider/receiver gates,no repeated samewholesale/coldenergy/fluid/asset/carrier duties |\n| upstream_dataset_requirement | Original complete watersource/actual purification/icegeneration/bagfillclosure/release-originalpack gate including lost merchandise upstream stays outside service as nonexchange stock. Rawwater alone incomplete,factoryRO not merchant operation. Actual missing stages/additional source demand must ACTUALLY integrate outsideonce with COMPLETEDstatus/link/time/timezone/source/owner/nativequantities/result/coverage before completechainuse;pending insufficient. Actual service loss handling/receiver treatment insideonce. |\n| disclosure | All qualifiers; preservation interfaces before and after holding; native phases, packaging, temperature/time, refrigeration energy, fluid origin and fates; source and all-terminal baseline, additional and carryover quantities with actually completed integration; and complete provider, asset, carrier and receiver scopes. |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| preservation | actual preservation-trade responsibilities | One bounded preservation-and-trade node receives actual usable originalclosedbag tube waterice,operates actual frozen coldstore/reefer holding,and hands maintained usable frozen product to final B2B acceptance. Before/after phase,temp-time and acceptance criteria are measured/sourced,not universal setpoints. Cold energy,fans/defrost,refrigerant,assets and provider interfaces belong to this intervention once;no duplicate warehouse node. |  |\n| source | actual preservation-trade responsibilities | Original complete watersource/actual purification/icegeneration/bagfillclosure/release-originalpack gate including lost merchandise upstream stays outside service as nonexchange stock. Rawwater alone incomplete,factoryRO not merchant operation. Actual missing stages/additional source demand must ACTUALLY integrate outsideonce with COMPLETEDstatus/link/time/timezone/source/owner/nativequantities/result/coverage before completechainuse;pending insufficient. Actual service loss handling/receiver treatment insideonce. |  |\n| excluded | actual preservation-trade responsibilities | Exclude dryiceCO2,snow,block/sculpture routes,merchant ice manufacture/RO/crushing/deliberate melt-refreeze/rebagging,retail/agency and using traded ice as facility coolant. Actual extra operation requires separate complete review;do not import factory or customer-use energy. |  |\n| phase_fates | actual preservation-trade responsibilities | Closedbag melting changes phase while retaining water,not material loss,emission or automatic reject. Retained solid/liquid/bag in whole or mixed carriers nonadditive;actual independent useful/nonusable/free-liquid/direct-water/vapour paths require receiver/medium evidence. Evaporation not residual;liquid litres not original icevolume/nominaldensity. Actual treatment once,no automatic credit. |  |\n| refrigerant | actual preservation-trade responsibilities | Named actual charge/supply/recovery/retained/useful/waste/direct roles have native composition/fate evidence and source owners. Factory charge production covered once by complete asset manufacture or explicit asset supplement;not new operatingreceipt. Unknown deficit/topup not leak. Useful export from recovered factorycharge cannot reduce unrelated currentmakeup or create negativeinput. Only same-scope matched standalone unused supplies may net with paired output OMIT. |  |\n| resources | actual preservation-trade responsibilities | Include actual power/fuel/fans/defrost/water/housekeeping and full all-user facility/reefer/handling/support manufacture-maintenance-replacement-recoveryEOL. Complete provider coldholding/freight replaces covered duties only,including charge/leaks/empty legs/assets scope;missing coverage not zero. |  |\n\n\nOnly NON-EDIBLE INDUSTRIAL tube water ice whose actual supplier SKU, market presentation and independent classification evidence confirm CPC 17400 is in scope. Edible ice and ice presented for food or beverage use (22270), and SKUs lacking that confirmation, are excluded. Industrial buyer or use, tube form, RO treatment or purity alone do not establish 17400. Obtain supplier market-presentation/non-edible evidence and a documented classification decision before admitting a consignment; generic supplier webpages are not actual SKU proof.\n\n"
