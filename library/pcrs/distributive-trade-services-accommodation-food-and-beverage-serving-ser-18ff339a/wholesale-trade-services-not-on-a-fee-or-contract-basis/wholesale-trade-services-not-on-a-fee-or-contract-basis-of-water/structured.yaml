      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| final_service | actual preservation-trade responsibilities | Actual owned-resoldB2Bpostreversal finalgate/uniqueN,failedunfinished duties retained,N0no divide;bag/kg/icevolume/value not service. |  |\n| preservation_phase | actual preservation-trade responsibilities | Before received usable closedbag tubeice,actual bounded frozenholding responsibilities and after maintainedusableice handoff with native phase/temp-time/criteria-source evidence;no universaltemperature/purity/size/life/FDA-IPIA or factoryROoperation. Closedbagmelt retainswater,notloss/emission;phasefraction notwetdry,liquid volume actual measured/supportedstate. |  |\n| source_fates | actual preservation-trade responsibilities | Include the complete actual water-source, purification, ice-generation, bag-filling/closing and release-packaging chain, including upstream burdens of losses, once outside the service; raw water alone is insufficient. Before complete-chain use, require native source and all-terminal original, baseline, additional and carryover records and the owner/coverage of actually completed missing-stage integration. Whole-product phase, packaging, mixture, free-liquid and direct-release paths are non-additive where they overlap. Count actual receiver treatment once; do not infer species releases from a residual or apply automatic credits. |  |\n| refrigerant_native | actual preservation-trade responsibilities | All actual charge/supply/recovery/retained/useful/waste/direct native quantities and component/fate bases/source owners close physical ledger;unknown notleak/topup notemission. Factorycharge and opening exclusive,production assetcoverage once,only matched same-scope unusedstandalone supply nets with pairedoutputOMIT,no unrelatedmakeup/negativeinput or recoverycredit. |  |\n| complete_duties | actual preservation-trade responsibilities | Actual provider/coldenergy-fuel-water/assetall-userlife/NETsupply/freight eachnative operand and exclusivecoverage verified;EACHrepeatonce/TOTALunchanged THATshareinsideSUM/Nonce. Actual quantities, compatible native units/state/basis/method/time/source, verified concrete identities and applicable acceptance/coverage evidence remain mandatory; unknown is not zero. A missing generic numerical Range alone is disclosed and does not block an otherwise evidenced actual package; never invent bounds. A claimed source-backed interval needs a traceable source and compatible basis; only an empirical plausibility guardrail additionally needs independent comparable reference evidence, not the same batch maximum validating itself. Preserve applicable actual source-specific acceptance intervals and uncertainty requirements. |  |\n\n\nOnly NON-EDIBLE INDUSTRIAL tube water ice whose actual supplier SKU, market presentation and independent classification evidence confirm CPC 17400 is in scope. Edible ice and ice presented for food or beverage use (22270), and SKUs lacking that confirmation, are excluded. Industrial buyer or use, tube form, RO treatment or purity alone do not establish 17400. Obtain supplier market-presentation/non-edible evidence and a documented classification decision before admitting a consignment; generic supplier webpages are not actual SKU proof. For power multiplied by duration, use ONLY actual interval-AVERAGE electrical power over that SAME observed interval, including actual compressor cycling, fans, defrost and idle duties. Record interval start/end/timezone, averaging population/method/source and actual duty-cycle evidence. Instantaneous or nameplate power alone is not consumed energy. An already integrated meter kWh reading is NOT multiplied by duration again.\n| validate_concrete_identity_decisions | all inventory rows | Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required. |  |\n\n"
