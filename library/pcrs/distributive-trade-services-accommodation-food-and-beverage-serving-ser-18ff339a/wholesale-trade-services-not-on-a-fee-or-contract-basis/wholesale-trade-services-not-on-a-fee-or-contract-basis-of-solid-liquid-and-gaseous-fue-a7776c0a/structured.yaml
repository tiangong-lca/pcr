    - id: normalize
      applies_to: "all exchanges"
      rule: "Per reference inventory=assigned actual native physical quantity/positive N,unique source-verified FINAL owned-resold B2B acceptance after reversals. At N=0 retain actual duty/cohort/period and report no normalized value,not zero burden."
      inputs:
