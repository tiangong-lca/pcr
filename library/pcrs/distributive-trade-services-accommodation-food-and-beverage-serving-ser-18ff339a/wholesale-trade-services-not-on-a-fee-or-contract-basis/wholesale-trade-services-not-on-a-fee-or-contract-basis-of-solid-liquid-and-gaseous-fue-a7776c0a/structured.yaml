  - rule_id: supplies_life
    applies_to: "actual declared trade duties"
    rule: "Supply S=opening+net_receipts-closing,NET material excludes container tare and retained closing/recoveries once. Gross input S with separate matched unused outward output OR consumed S-return input OMIT that output,no numeric S+return,double credit or unrelated inherited-content subtraction. Full asset burden uses compatible cohort driver/complete all-user lifetime driver,observed+sourced remainder/termination and uncertainty/update."
