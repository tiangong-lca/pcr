        - "final gate and reversal records"
      output: "native quantity per1 Item(s) service"
      source_ids: []
    - id: bag_netmass
      applies_to: "nonexchange merchandise"
      rule: "Net asreceived coal mass=sum unique actual packed coal(gross-bag/outerpack/support tare),using sourced native EACH count once or TOTAL unchanged. Reconcile actual bag/parent counts without adding parent+child views. Bag label weight is not measured actual batch net mass;asreceived coal includes actual water and mineral/ash-bearing material,not pure carbon."
      inputs:
        - cp_coal
        - "native count/gross/tare records"
      output: "unique actual coal/water versus packing audit"
      source_ids: []
    - id: water_analysis_basis
      applies_to: "actual coal and fates"
      rule: "For matching actual same-sample definitions,first convert native percent to ratio. w_wet=water/asreceived,w_dry=water/matching dry nonwater;dry_nonwater=asreceived*(1-w_wet),w_wet=w_dry/(1+w_dry) only matching sample/state/definitions. LOD may include other volatiles and is not automatically water. Moisture change alone does not establish dry-coal loss. Keep asreceived/dry/dry-ash-free,ash/volatile and NCV/GCV measurement definitions distinct;any basis conversion needs actual compatible same-sample water/ash data and independent native factors/source,never an assumed rank value. Elemental carbon is not proximate fixed carbon;no substitution or carbon-to-CO2 default. Calorific data qualify commodity,not service consumed fuel."
      inputs:
        - cp_coal
        - cp_fates
        - "same-sample water/ash/analysis basis evidence"
      output: "compatible native coal quality/state audit"
      source_ids: []
    - id: source_demand
      applies_to: "commodity outside service"
      rule: "Direct trace OR assigned_source=original_gate_quantity*numerator_driver/positive complete source_all_exit_driver. Record every compatible exclusive terminal driver including closing/unsold/damaged retained,useful-other,returns and actual whole/loose/mixed/liquid losses,each native metadata/owner/original-link/numerator membership. No accepted-only denominator. Convert original/assigned/loss/baseline/additional demand to matched finished source state with actual water/ash/contamination evidence. Actual missing-stage/additional demand integration outsideonce requires COMPLETED status,link,time/timezone/source/owner/native integrated quantities/results before whole-chain completion;actual service handling/treatment insideonce. Prior closing becomes current opening carry at the same native quantity/state/source-gate burden owner,linked by prior_period_closing_link/current_period_opening_link;it is not a new purchase,repeated upstream demand or additional FINAL N. A linked carry is one cross-period transfer,not two terminal demands in the same source cohort."
      inputs:
        - cp_coal
        - "actual complete source/coverage/conversion/integration records"
      output: "completed external source demand/loss/stage integration"
      source_ids: []
    - id: physical_closure
