thod, state, time and source. Lifetime drivers comprise observed_driver plus source-backed remaining_driver, with termination assumptions, uncertainty, sensitivity and updates. Choose either the attributed asset-equivalent quantity or the lifecycle-complete provider quantity; divide the chosen quantity by positive N once. Do not import generator or network lifetimes. |  |\n| supplies_fates | Actual materials | For actual office and maintenance materials only, calculate S as assigned opening stock plus NET actual material receipts minus closing stock including retained recovery. Receipts exclude container tare. Choose exactly one: (1) gross S/N INPUT with actual matched unused external return/N as a separate OUTPUT; (2) consumed-only (S-return)/N INPUT and OMIT that matched return OUTPUT. Do not add the return to input or deduct it twice. Retain internal recovery in closing stock. This stock formula never applies to traded energy. Actual spent consumables, retired equipment, mixtures of carriers/absorbed fluid/fragments, free wastewater and direct water/species are non-additive where they overlap. Count receiver transport and treatment once after reconciling asset/provider coverage; do not apply negative credits. |  |\n| physical_energy_link_scope | nonexchange energy interface | Keep actual directional source/terminal energy and completed outside stage-demand integration at recorded raw quantities, with point-group, direction, window and valid-version scope. Declare source_assignment_scope_id, target_delivery_case_ids/target_case_group_id and source_assignment_quantity_basis: single_case, target_case_group_total or already_per_reference. Only a raw assigned target-case-group total uses source_energy_link_per_service=assigned_source_energy_raw/same_target_case_N when positive N covers EXACTLY those assigned cases after reversals; link this once to 1 accepted_service in compatible energy/state/gate units. A single case N=1 or already-per-reference energy is not divided again. Do not scale actual outside integration by service N or use whole-source-market N for a narrower target group. No opening/closing warehouse stock or material-return formula applies to traded electricity. |  |\n\n\n"
