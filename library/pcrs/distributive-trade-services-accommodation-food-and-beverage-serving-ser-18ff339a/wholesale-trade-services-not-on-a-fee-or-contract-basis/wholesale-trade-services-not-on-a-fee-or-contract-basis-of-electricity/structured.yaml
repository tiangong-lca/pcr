      requirement: "Disclose case definition, physical point/direction, nonoverlapping window, final-acceptance reversals, meter estimates/revisions/multipliers, loss/source-mix coverage, baseline and ACTUALLY completed integration owners, resources, providers, complete asset lifecycles and fate uncertainty, sensitivity and updates. Do not impose GB timeline, legal-role or loss/mix defaults; pending integration does not establish complete-chain readiness."
      evidence: "Native coverage, completed links and row-level range evidence needs."
    - id: service_electricity
      applies_to: "metered_electricity_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Actual office/ICT/data-meter support consumption only, disjoint from tradedenergy and includedprovider consumption. No tradedkWh as serviceinput or avoidedenergy. Range evidence need: Actual own-consumptionmeter/submeter or evidenced completealluser allocation, nativeinterval/pointrole/providercoverage; totaltradedenergy/invoice not officeuse. Measurement evidence: protocol cp_operations; original record basis Energy / kWh. The original amount constraint “Actual exclusively assigned physical quantity / N under cp_operations” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: service_electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_operations; actual source-linked native records"
    - id: facility_water
      applies_to: "metered_electricity_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Real hygiene/support water only, no generation cooling/reservoir/gridwater duty. Range evidence need: Actualsource/purpose/nativevolume/period and independent fates; supplynotwastewater, no water per tradedkWh. Measurement evidence: protocol cp_supplies; original record basis Volume / m3. The original amount constraint “Actual exclusively assigned physical quantity / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: facility_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: office_consumables
      applies_to: "metered_electricity_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Actual paper/ink/cleaners/wipes/absorbents/filter supplies by SKU/use, not certificates-as-physicalelectricity or assumed electricalnetwork oils/spares. Range evidence need: NETactualmaterial stock/use/return/provenance and actualcleanup; no material per contract/settlementrow or networkmaintenance default. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual exclusively assigned physical quantity / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: office_consumables_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: metering_data_services
      applies_to: "metered_electricity_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Actualperformed read/validateddataset/transmission/reconciliation result nativeunit/coverage. Meterrecords and reruns do not themselves create new physicaldeliverycount; not merchantnetwork operation. Range evidence need: Performed result/nativeproperty-unit/providerenergy-assets coverage, version/dedup/pointperiod proof; conditional umbrella expands actualresult rather than forcing everyrecord1Item. Measurement evidence: protocol cp_providers; original record basis Count / Item(s). The original amount constraint “Actual exclusively assigned physical quantity / N under cp_providers” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_providers; actual source-linked native records"
    - id: facility_support_services
      applies_to: "metered_electricity_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Actual facility cleaning/HVAC/support/maintenance results in declarednativeunit, not financialfees/margins or generator/grid service automatically duplicated. Range evidence need: Actualtask/result/source/nativeunit and materialenergyasset/wastecoverage; normalize actualallusers once, no price-to-physical service conversion. Measurement evidence: protocol cp_providers; original record basis Count / Item(s). The original amount constraint “Actual exclusively assigned physical quantity / N under cp_providers” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_providers; actual source-linked native records"
    - id: shared_assets
      applies_to: "metered_electricity_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Cover actual office, ICT, meter, outstation and communications assets and components within the responsibility boundary, including complete manufacture, maintenance, replacements and end of life across all users. Generation, grid and storage assets remain outside unless actually reviewed; do not duplicate provider-covered assets. Range evidence need: Job, observed, remaining and lifetime drivers each need native unit, basis, method, state, time and source. Lifetime use comprises observed plus source-backed remaining use, with termination assumptions, uncertainty and updates. Choose either the attributed asset-equivalent quantity or the lifecycle-complete provider quantity, and divide the chosen quantity by positive N once. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual exclusively assigned physical quantity / N under cp_assets” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: unused_supply_returns
      applies_to: "metered_electricity_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Same-scope standaloneunusedmaterial only; consumed-only input OMITmatchedoutlet. No electricalexport/contractreversal/pricecredit as materialreturn. Range evidence need: Actualrecipient/nativequantity/matchedsupply-provenance, internalrecoveryclosing, no unrelatednegativeinput/recoverycredit. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual exclusively assigned physical quantity / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: unused_supply_returns_detergent_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: spent_supplies_equipment
      applies_to: "metered_electricity_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Include actual paper, ink, wipes, filters, maintenance mixtures and retired office/meter/ICT equipment only when receiver responsibility belongs to the actual service. Do not add a second end-of-life burden already covered by an asset-lifecycle or provider dataset; traded energy is not waste material. Expand this conditional umbrella into a separate exchange for EACH actual distinct received waste stream and its native identity/type, composition/state, measured net quantity and receiver transport/treatment owner. Paper/ink waste, wiping mixtures and retired ICT/equipment are not one fixed mixed exchange; use mixed mass only for a genuinely co-collected received mixture. Component views of that same mixture remain non-additive. Retain explicit unresolved identities until actual stream evidence is available. Range evidence need: Record actual received mass, component state, receiver transport/treatment and asset/provider coverage. Mixture, carrier, absorbed-fluid and fragment views are non-additive where they overlap; an empty contract is not evidence of physical waste. Measurement evidence: protocol cp_fates; original record basis Mass / kg. The original amount constraint “Actual exclusively assigned physical quantity / N under cp_fates” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: spent_supplies_equipment_spent_wipe. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: contained_wastewater
      applies_to: "metered_electricity_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual collected facility wastewater or free fluid needs its own identity, state, volume and receiver; it is not grid loss or power-plant cooling. Range evidence need: Actual collected/received volume, composition, native unit, basis, method, state, time, source and receiver coverage; purchased water does not establish waste volume. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual exclusively assigned physical quantity / N under cp_fates” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: direct_water_outfall
      applies_to: "metered_electricity_wholesale"
      requirement: "Identify the direct outfall and receiving water/soil compartment, measured water amount and independently analysed pollutant species. A sewer transfer to treatment is not this outfall; the missing receiving compartment prevents a concrete elementary-flow selection. Only real directwater crossing documentedmedium, containedreceiver Waste separate, no networkwater assumption. Range evidence need: Location/medium/nativeintervalvolume/composition/fate/source, not suppliedwater or energytrade volume. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual exclusively assigned physical quantity / N under cp_fates” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: direct_species
      applies_to: "metered_electricity_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Actualownfacility maintenance/incident substance-medium evidence only. TradedkWh, networkloss/contractimbalance or sourcegenerationfactor is not merchantdirectemission or zero; no assumed ownedgeneration. Range evidence need: Exactspecies/medium/native measurement or realactivityfactor units/basis/method/state/time/source; completefraction-covering factors notmultipliedagain. Measurement evidence: protocol cp_releases; original record basis Mass / kg. The original amount constraint “Actual exclusively assigned physical quantity / N under cp_releases” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_releases; actual source-linked native records"
validation_rules:
  - rule_id: actual_final
    applies_to: "accepted_service"
    rule: "Verify positive actual physical delivery, merchant ownership/purchase/resale, business buyer, predefined case point-group/window, final gate, source, reversals and unique N. Do not substitute kWh, meter rows, contracts, invoices, positions or reruns for cases. When N=0, retain resources for failed, pending and cancelled work without division."
    source_ids: []
  - rule_id: meter_native
    applies_to: "nonexchangeenergy"
    rule: "Directional nativepointtime/registerinterval/UTCoffsetDST/multiplierCTVT-alreadyapplied/calibration/actualestimated-revisiondedup. Cumulativeformula only actualcompatible reconstruction; averagepower×actualduration dimensional once, not nameplate/instantaneous/integratedenergy again."
    source_ids:
      - elexon-metering-context
  - rule_id: source_completed
    applies_to: "nonexchangeenergy"
    rule: "Directactualtrace OR positiveCOMPLETE compatible allphysicalterminal native6metadata/link/owner, notacceptedonly/certificate/inventedstock. Actualgeneration-gridgate-loss responsibility-baselinecoverage then requiredmissingstage/additional ACTUALLY outsidecompleted once nativeqty-status-link-timezone-source-owner-stage-losscoverage beforechainready, notplanned."
    source_ids: []
  - rule_id: resource_owners
    applies_to: "all"
    rule: "Traded energy remains NONEXCHANGE; it is neither electricity consumed by the merchant facility nor a direct release. Record actual office, ICT and meter resources. Use either a lifecycle-complete provider quantity or attributed asset equivalents, with exclusive full-lifetime coverage across all users and observed plus source-backed remaining drivers, then divide the chosen quantity by positive N once. NET supplies exclude container tare. Choose gross S/N INPUT with matched unused return/N OUTPUT OR consumed-only (S-return)/N INPUT with that matched return OUTPUT OMITTED. Never apply this stock formula to traded energy. Actual mixtures, equipment, free water and direct species must be exclusive where they overlap. Count receiver transport/treatment once after reconciling asset/provider coverage. Do not apply automatic credits or infer species releases or zero from a residual."
    source_ids: []
  - rule_id: scope_limits
    applies_to: "method"
    rule: "No merchantgeneration/storage/networkoperation/warehouse/truck/pallet template imported. Electricitystorage exists. Elexon GBqualitative context not universalinterval/legal/mix/lossfactor; unsupported identities/nativecoverage remainexplicitgaps."
    source_ids:
      - elexon-physical-trading-context
      - elexon-settlement-context
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset afteractualidentity/completeness review"
  downstream_use: "A commercial-delivery service add-on for physically delivered, metered electricity, with actually completed, matched generation/grid/source/loss/demand integration once outside the service."
  allowed_use: "An actual merchant-owned and resold B2B final physical/commercial delivery case, for one buyer, a disjoint point group and a nonoverlapping window, with native versioned meter evidence."
  excluded_use: "Financialonly/generation/storage/merchantnetworkoperation/consumeruse/retail-feeagency; warehouse-stock-cargo model"
  required_metadata: "Case predefinition, physical delivery, merchant ownership/purchase/resale, business buyer, final gate, source, reversals and N; point/direction, native units, register intervals, CT/VT multipliers and whether already applied, calibration, UTC offset/DST, actual versus estimated readings and version deduplication; actual generation/grid gate, loss baseline, source assignment across all physical terminals and completed outside-integration quantity, status, link, timezone, source, owner and coverage; ownership of merchant-facility, ICT, meter, provider, full asset-lifecycle, supply and fate responsibilities."
  required_quality_disclosure: "Actual case definition, physical meter evidence, source/grid losses, estimates/revisions, mix coverage, baseline and completed integration, native identity evidence, resource/provider/full asset-lifecycle coverage, fate uncertainty, sensitivity and row-level evidence needs."
  update_trigger: "Casephysicalpointgroup-window/ownershipFINAL/meterrole-register-multiplier-direction-version/timezone/source-gridlosscoverage-integration/ownresources-providerasset/fate changes"
