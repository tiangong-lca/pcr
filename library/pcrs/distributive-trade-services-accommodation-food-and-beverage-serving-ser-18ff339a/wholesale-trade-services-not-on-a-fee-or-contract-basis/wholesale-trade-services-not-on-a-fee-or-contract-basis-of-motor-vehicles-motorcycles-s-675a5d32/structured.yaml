allocation_rules:
  - rule_id: final_n
    applies_to: "actual declared trade route"
    rule: "Verify source merchant ownership/purchase/resale,B2B buyer and final acceptance/reversal records. N counts unique FINAL commercial consignments after reversals,not receipts/disc pieces/axle pairs/cartons/currency. Canceled,reversed,failed or unfinished event resources retain actual period/cohort attribution;N=0 blocks division and does not erase responsibility."
    source_ids: []
  - rule_id: source_allterminal
    applies_to: "actual declared trade route"
    rule: "Assigned original-gate quantity is directly traced/measured with native evidence OR original quantity*compatible cohort driver/positive COMPLETE all-terminal driver sum. Each competing acceptance,closing/unsold/damaged retained,useful other exit,return and actual whole/fragment/mixed/liquid loss has its native quantity/unit/basis/method/state/time/source,owner,original lot/cohort/period/conversion/exclusivity and numerator link. Never accepted-only denominator or duplicated intermediate moves. Match total required finished-SKU demand,baseline-covered and additional uncovered quantities/stage-loss coverage/owner;integrate missing upstream demand/loss once outside,not unrelated coverage or negative credit."
    source_ids: []
  - rule_id: independent_stock
    applies_to: "actual declared trade route"
    rule: "S=attributed opening+true external net receipts-closing including recovered retained independent supplies. Use gross INPUT S with separate same-scope matched unused external OUTPUT OR consumed INPUT S-return omitting OUTPUT. No numerical S+return,double credit,internal recovery as new receipt or removed nonreturned spill/waste upstream supply burden. Inherited disc finish/preservative/pack does not net unrelated supplies."
    source_ids: []
  - rule_id: complete_lifetime
    applies_to: "actual declared trade route"
    rule: "Resource share uses actual compatible physical cohort/all-user driver. Full asset equivalents=actual job/cohort used driver/complete all-user all-period lifetime driver,observed-history+sourced remaining use or termination. Each operand native unit/basis/method/state/time/source/conversion;full manufacture,maintenance-cleaning,replacements/EOL,uncertainty/sensitivity/update complete. Full provider scope replaces covered own burdens."
    source_ids: []
  - rule_id: exclusive_material_fates
    applies_to: "actual declared trade route"
    rule: "Intact useful discs/returns are nonexchange merchandise. Actual useful separated material,whole discs,fragments/independent contained finish,packing,mixed cleanup solids,free liquid and named direct species require exclusive real decisions/receivers. Retained base/finish/pack/fluid views inside whole/fragment/mixed waste are nonadditive content audits,not extra physical outlets. Unknown residual,rust or bend is not full waste or emitted iron;no automatic recycling/substitution credit."
    source_ids: []
  - rule_id: source_scope_normalization
    applies_to: "nonexchange commodity and service combination"
    rule: "Keep original external commodity stock, source assignment/loss and missing-stage/additional upstream integration quantities in their evidenced RAW actual scope. Identify whether each amount is one actual consignment, a target service cohort, or ALREADY per reference,with source/target scope IDs and quantity basis. The physical source-cohort all-exit denominator assigns RAW quantity to that target scope; it is not automatically the target accepted-service N. Only when combining that same target-scope commodity amount with the 1 Item(s) service derive amount per reference = RAW assigned amount / positive unique accepted source_same_scope_N,with acceptance IDs/time/reversal evidence. A proved single-case scope has source_same_scope_N=1; an already-per-reference amount is not divided again. Preserve raw integration quantities and source links; do not shrink actual upstream remediation or divide the whole source cohort by an unrelated N. N0 responsibility remains disclosed without division."
    source_ids: []
