published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity/quantity review"
  downstream_use: "A physical own-account wholesale service add-on for new one-piece cast-iron motor-vehicle brake discs at ambient conditions, within the complete actual finished-SKU chain."
  allowed_use: "Actual manufacturerSKU/newonepiececastiron/solidvented/finish/BOM/lot/hierarchy/netmass/packing/condition/period and final business gate"
  excluded_use: "Standalone disc footprint;twopiece/lightalloyhub/carbonceramic/used-remanufactured;merchantmachine/coat/rustclean/install/test/use/padfluidchange;retail/agency;disc/pair/box/kg/value service proxy"
  required_metadata: "All qualifiers;sourceSKU/alloy/geometry/finish/BOM/hierarchy/netmass/pack/stock/condition/fates;original/assigned/loss/baseline/additional native quantities/terminal records/conversions/state/owner/coverage/integration;full providers/assets/carriers/receivers"
  required_quality_disclosure: "Unresolved identities/support and meaningful Range gaps;SKU/alloy/finish/composition/state conversion/source/receiver/lifetime uncertainty"
  update_trigger: "Changed SKU/alloy/geometry/finish/source/presentation/condition/fates,actual operation/providers/assets/carrier/receiver or final acceptance/loss coverage"
