      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| final_N | actual declared trade route | Verify source merchant ownership/purchase/resale,B2B buyer and final acceptance/reversal records. N counts unique FINAL commercial consignments after reversals,not receipts/disc pieces/axle pairs/cartons/currency. Canceled,reversed,failed or unfinished event resources retain actual period/cohort attribution;N=0 blocks division and does not erase responsibility. |  |\n| source_allterminal | actual declared trade route | Assigned original-gate quantity is directly traced/measured with native evidence OR original quantity*compatible cohort driver/positive COMPLETE all-terminal driver sum. Each competing acceptance,closing/unsold/damaged retained,useful other exit,return and actual whole/fragment/mixed/liquid loss has its native quantity/unit/basis/method/state/time/source,owner,original lot/cohort/period/conversion/exclusivity and numerator link. Never accepted-only denominator or duplicated intermediate moves. Match total required finished-SKU demand,baseline-covered and additional uncovered quantities/stage-loss coverage/owner;integrate missing upstream demand/loss once outside,not unrelated coverage or negative credit. |  |\n| independent_stock | actual declared trade route | S=attributed opening+true external net receipts-closing including recovered retained independent supplies. Use gross INPUT S with separate same-scope matched unused external OUTPUT OR consumed INPUT S-return omitting OUTPUT. No numerical S+return,double credit,internal recovery as new receipt or removed nonreturned spill/waste upstream supply burden. Inherited disc finish/preservative/pack does not net unrelated supplies. |  |\n| complete_lifetime | actual declared trade route | Resource share uses actual compatible physical cohort/all-user driver. Full asset equivalents=actual job/cohort used driver/complete all-user all