      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual factoryfinished new onepiece castiron motorvehicle disc SKU/lot/solidvented/finish/BOM/original presentation and condition |\n| starting_condition_role | Nonexchange complete finished disc/original finish/preservative/packing merchandise stock and throughflow |\n| product_classification_scope | Narrower49129motorvehiclebrakepart within491/61081;not engineoilfilter43915 |\n| recursive_input_rule | Only complete disjoint actual provider/receiver gates,no recursive same wholesale sale or duplicated resources/assets/carrier |\n| upstream_dataset_requirement | Use actual complete new single-piece cast-iron SKU manufacturer release gate,including relevant material/foundry casting,machining,actual finish/preservative and original supplier presentation/packing. Missing stages assembled once outside;raw iron alone or a rough casting cannot represent the finished disc. Source quantity/state/unit/basis/method/conversion/coverage owner and completed original demand/loss integration must match actual SKU/finish and include baseline stage/loss coverage. |\n| disclosure | All qualifiers,sourceSKU/alloy/geometry/finish/BOM/hierarchy/netmass/pack/condition/stock/fates;original/assigned/loss/baseline/additional native source quantities,complete terminal drivers,state conversions/coverage/owner/integration;full resources/providers/assets/carriers/receivers |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| physical_trade | actual declared trade route | Collect actual receiving,stock/order handling,dispatch,records,attributable idle/cleanup and incident handling only. Traded finished casting/machining/actual finish/original packing manufacture,including lost-commodity upstream,stays outside every service exchange;this add-on alone is not a complete disc footprint. Real waste handling/receiving treatment belongs to service once. |  |\n| complete_finished_gate | actual declared trade route | Use actual complete new single-piece cast-iron SKU manufacturer release gate,including relevant material/foundry casting,machining,actual finish/preservative and original supplier presentation/packing. Missing stages assembled once outside;raw iron alone or a rough casting cannot represent the finished disc. Source quantity/state/unit/basis/method/conversion/coverage owner and completed original demand/loss integration must match actual SKU/finish and include baseline stage/loss coverage. |  |\n| no_merchant_fabrication | actual declared trade route | No merchant machining,coating/degreasing/rust removal,installation,pad/fluid replacement,load/performance testing or brake use. Actual extra intervention needs separate full route review. Solid/vented,HC/PVT/UV and surface specifications are actual model-dependent source questions;not universal combined features,recipes,mass factors or braking guarantees. |  |\n| complete_owners | actual declared trade route | Each physical provider/resource/full-life asset/carrier-empty/receiver treatment has one complete disjoint scope owner. Original finish/preservative remains inherited content,not new operating input. Actual direct species/medium requires independent evidence;neither surface state nor a source/use emission factor establishes merchant release. |  |\n\n\n"
