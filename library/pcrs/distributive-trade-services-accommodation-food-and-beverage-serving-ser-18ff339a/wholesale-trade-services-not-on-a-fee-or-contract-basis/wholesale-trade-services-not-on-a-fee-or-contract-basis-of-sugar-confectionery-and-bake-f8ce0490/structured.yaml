    - id: usable_extra_return
      applies_to: "controlled_bar_trade"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only matched unused supplies returned to an external owner. Product stock returns,original manufacturer primary packs,reusable assets and recovered closing supplies are not automatically this outlet. Range evidence need: Require same-scope native supply provenance,state,quantity and receiver. Gross supply input plus separate usable-return output OR consumed-only matched supply omitting return exchange; never input S+return or second credit. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Measured attributable unused supply outward / N; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_extra_return_detergent_return; usable_extra_return_pe_film_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
