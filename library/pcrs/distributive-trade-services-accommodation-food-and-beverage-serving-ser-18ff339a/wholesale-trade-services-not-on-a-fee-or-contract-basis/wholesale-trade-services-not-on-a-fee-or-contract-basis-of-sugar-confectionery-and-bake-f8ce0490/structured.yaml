      applies_to: "controlled_bar_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual collected stream,with origin and chocolate/cleaner contamination recorded separately. Direct outfalls need real receiving water and substance exchanges,not a contained proxy. Range evidence need: Require volume/state,density/temp/composition basis and real receiver. Do not infer condensed water or sugar release from a visual sugar-bloom diagnosis. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Measured attributable contained liquid waste / N; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_effluent_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
