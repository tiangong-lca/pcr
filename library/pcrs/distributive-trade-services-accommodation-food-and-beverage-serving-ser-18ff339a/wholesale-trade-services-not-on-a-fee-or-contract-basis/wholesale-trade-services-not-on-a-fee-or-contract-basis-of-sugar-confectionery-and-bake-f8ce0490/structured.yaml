validation_rules:
  - rule_id: validate_count
    applies_to: "accepted_service"
    rule: "Require real ownership/resale,B2B acceptance,unique positive N and every reference qualifier; product count,pallet move,quarantine or canceled order is not automatically a completed service."
    source_ids: []
  - rule_id: validate_control
    applies_to: "controlled_bar_trade"
    rule: "Require real operated monitored dryroom intervention and actual bar/pack/quality/thermal-humidity conditions; exclude deliberate manufacture/rework and vendor-default or guaranteed-safety claims."
    source_ids:
      - callebaut-chocolate-store-text
  - rule_id: validate_quality
    applies_to: "stock and bloom"
    rule: "Observed fat/sugar bloom,condensation,odour or expiry must have an actual inspection/disposition record; none alone quantifies mass loss,chemical input,emission or Waste."
    source_ids:
      - callebaut-fat-bloom-text
      - callebaut-sugar-bloom-text
  - rule_id: validate_native
    applies_to: "all inventory"
    rule: "Maintain actual native units,N/conversion sources and property supports; no bar=kg,price=Count,raw cocoa=finished bar or generic Energy substitute."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "assets,providers,fluid and freight"
    rule: "Require complete scope,whole-life driver units/history/remainder/termination and all-consumer closure. No double factory HVAC charge,external recovery as new receipt,asset-origin return netted against unrelated makeup,or automatic credit."
    source_ids: []
  - rule_id: validate_outlets
    applies_to: "actual waste and releases"
    rule: "Prove actual whole/part-exclusive residues,receiver/treatment and substance/medium. Actual direct water/chemical/fluid roles require dedicated exchanges; no unexplained deficit or total formulation as a species."
    source_ids: []
  - rule_id: validate_chain
    applies_to: "commodity and service combination"
    rule: "All merchandise manufacture/primary packaging inclloss upstream remains outside service; actual original-gate loss state/assigned quantity/other exits/existing coverage and burden owner must yield once-only complete commodity integration."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual concrete exchanges and quantitative evidence are verified"
  downstream_use: "Physical additive controlled-dryroom own-account wholesale service for an actual released sealed plain-dark-bar commodity chain"
  allowed_use: "Declared operated room-control B2Broute and actual formulation,cocoa state,pack/count/net mass,thermal-humidity/time and acceptance stratum"
  excluded_use: "Whole chocolate footprint alone; cocoa or chocolate manufacture; filled/milk/white products; deliberate remelt/retemper/repack/rework; retail/agency; monetary margin or universal quality/mass conversion"
  required_metadata: "All reference qualifiers; actual released commodity/buyer gates; positive N; exclusive stocks,other exits and loss conversion/coverage; control/provider/transport/treatment and full asset/fluid scope"
  required_quality_disclosure: "Unresolved concrete identity/support/configuration; condition/quality/measurement/conversion/Range limits; actual lifetime/source-charge provenance and receiver/provider overlap; commodity loss integration/uncertainty"
  update_trigger: "Changed formulation/cocoa state,pack,control conditions/technology,HVAC fluid or asset lifetime,use/provider/transport/treatment scope,observed loss/disposition basis,acceptance gate or evidence"
