  calculation_rules:
    - id: normalize_trade
      applies_to: "all inventory rows"
      rule: "Divide actual attributed physical quantity by positive N once; accepted_service is 1 Item(s),not bar count or chocolate mass."
      inputs:
        - "attributed quantity"
        - N
        - "linked protocol"
      output: "exchange quantity per reference flow"
      source_ids: []
    - id: period_share
      applies_to: "room_electricity; provider_jobs; freight; room_electricity_ac"
      rule: "For each compatible period multiply actual complete resource scope by cohort physical driver/all-consumer driver; sum nonoverlapping periods and apply normalize_trade."
      inputs:
        - "period quantity"
        - "cohort driver"
        - "all-consumer driver"
        - units
        - "ownership scope"
      output: "attributed quantity"
      source_ids: []
    - id: asset_share
      applies_to: "shared_assets"
      rule: "Complete asset equivalent = cohort compatible driver/complete lifetime driver; apply normalize_trade once. Use one asset-equivalent or one complete per-driver-provider representation for the same actual asset."
      inputs:
        - "complete asset lifecycle"
        - "actual drivers and units"
        - history
        - "evidenced remainder"
        - termination
        - cp_assets
      output: "attributed full asset equivalents"
      source_ids: []
    - id: supply_stock
      applies_to: "handling_diesel; cleaning_supplies; extra_packing; usable_extra_return; cleaning_supplies_synthetic_detergent; extra_packing_pe_film"
      rule: "S=attributed opening+external net receipts-closing including recovered closing. Record gross INPUT S plus separate matched unused return OUTPUT OR consumed-only INPUT S-return omitting matching return exchange. Real fuel burn,waste and spill remain distinct fates."
      inputs:
        - opening
        - "gross/tare/net receipts"
        - closing
        - "matching same-scope return"
        - representation
        - "actual fuel fates"
        - cp_fuel
        - cp_supplies
      output: "nonduplicated supplied and outward-return quantities"
      source_ids: []
    - id: original_bar_loss
      applies_to: "sealed_bar_rejects; separated_chocolate_waste; separated_chocolate_waste_atomic_case; sealed_bar_rejects_atomic_case"
