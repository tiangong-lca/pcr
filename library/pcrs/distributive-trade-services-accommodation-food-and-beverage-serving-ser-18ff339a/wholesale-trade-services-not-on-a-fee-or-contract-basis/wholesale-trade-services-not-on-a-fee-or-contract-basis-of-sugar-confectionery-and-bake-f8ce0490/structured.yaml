      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual material at real waste receiver; original primary wrap production remains commodity upstream,while actual loss handling/treatment is inside the service. Never assume every received wrap is warehouse waste. Range evidence need: Need actual material/tare/contamination and whole/part nonduplication,receiver and recovery/treatment boundary; collection alone is not recycling or avoided production. Measurement evidence: protocol cp_waste; original record basis Mass / kg. The original amount constraint “Measured attributable separated packing waste / N; cp_waste.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: packing_waste_paper_pack; packing_waste_metal_pack; packing_waste_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
