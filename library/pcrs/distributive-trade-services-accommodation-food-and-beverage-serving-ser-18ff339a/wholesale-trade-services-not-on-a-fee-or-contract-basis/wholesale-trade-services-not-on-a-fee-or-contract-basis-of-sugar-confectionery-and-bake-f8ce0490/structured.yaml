    - id: room_electricity
      applies_to: "controlled_bar_trade"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Actual conditioning,dehumidification,air circulation,lighting and handling energy,including real idle/defrost/door and cleaning periods. Avoid electricity already inside complete external HVAC or warehouse scope. Range evidence need: Require actual product/room/ambient temperature and humidity,period meters and all-consumer physical driver; no vendor storage condition becomes an energy benchmark. Measurement evidence: protocol cp_room; original record basis Energy / kWh. The original amount constraint “Attributed metered electricity / N; cp_room.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: room_electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_room; actual source-linked native records"
    - id: cleaning_water
      applies_to: "controlled_bar_trade"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. No water addition to normally sealed bars. Record actual cleaning water and distinct condensation/effluent; an environmental source needs a separate actual source exchange. Range evidence need: Need use,actual outlet/retention and composition with volume/unit/state evidence; condensation on chocolate is not a prescribed ingredient or a quantified loss. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Measured attributable supplied water / N; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_water; actual source-linked native records"
    - id: cleaning_supplies
      applies_to: "controlled_bar_trade"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Actual material/SKU/formulation for premises/equipment,not chocolate formulation. Native-unit variants need actual concrete exchange and measured conversion if a mass view is used. Range evidence need: Require active/carrier basis,dilution,native purchase unit/density/temp/source and actual use; no safety-label quantity or default chemical release. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Attributed actual preparation supply / N; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: extra_packing
      applies_to: "controlled_bar_trade"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Only added outer cases,liners,labels or wraps supplied here. Manufacturer-sealed primary wrapping belongs to original bar commodity upstream and is not a new input for each resale. Range evidence need: Need actual native Count/Area/Length/Mass stock and returns,measured conversion and distinct original primary wrap; no assumed wrapping quantity per order. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Attributed added packing supply / N; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: extra_packing_pe_film. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: hvac_fluid_supply
      applies_to: "controlled_bar_trade"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Conditional actual named refrigerant or working-fluid purchases with composition and exact scope. Initial factory charge already embedded in equipment/provider manufacture cannot be purchased again in this operating-fluid input. Range evidence need: Need actual fluid identity,charge/source ownership,stocks,charging/recovery/exports/waste/release fates and component basis. Makeup is not leak; recovery is not a new external receipt. Measurement evidence: protocol cp_hvac; original record basis Mass / kg. The original amount constraint “Attributed independently supplied working fluid / N; cp_hvac.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
