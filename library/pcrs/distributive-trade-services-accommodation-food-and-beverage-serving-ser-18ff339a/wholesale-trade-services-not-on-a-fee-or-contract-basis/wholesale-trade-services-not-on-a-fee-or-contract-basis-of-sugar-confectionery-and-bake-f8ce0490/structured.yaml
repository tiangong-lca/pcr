      applies_to: "controlled_bar_trade"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Actual recovered/unused fluid is Product only when usable state and external receiver/gate are established; retained recovery is closing stock. Initial asset-charge origin must stay distinct from operating makeup. Range evidence need: Need matched fluid/source-charge scope and receiver; only same independently supplied inventory may support consumed-only deduction. Asset-origin export is an actual transfer without reducing unrelated makeup or automatic substitution credit. Measurement evidence: protocol cp_hvac; original record basis Mass / kg. The original amount constraint “Measured attributable actual usable-fluid export / N; cp_hvac.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
