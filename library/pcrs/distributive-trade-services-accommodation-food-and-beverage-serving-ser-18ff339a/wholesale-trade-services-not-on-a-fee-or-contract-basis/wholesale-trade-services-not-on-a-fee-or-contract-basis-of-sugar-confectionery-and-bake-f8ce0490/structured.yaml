      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual documented waste decision/receiver. Bloom,expired date,quarantine or buyer return alone is not proof of Waste or physical loss; whole bar-plus-wrap state must not also be counted as separated parts. Range evidence need: Need actual count,gross/primary tare/net chocolate,state/acceptance decision and original released sealed-bar loss conversion/owner. Appearance alone cannot define lost cocoa butter,sugar,kg or emissions. Measurement evidence: protocol cp_lots; original record basis Mass / kg. The original amount constraint “Measured attributable whole rejected-unit mass / N; cp_lots.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: sealed_bar_rejects_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
