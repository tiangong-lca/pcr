    - id: provider_jobs
      applies_to: "controlled_bar_trade"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Only physically completed contractual Count jobs with complete upstream resources. An actual provider sold by area-time,mass,hour,energy or freight must use its native verified exchange,not invoice price or a forced Count. Range evidence need: Need actual completion gate,environmental-control/resource/asset/treatment scope and overlap owner; a missing provider boundary prevents completeness. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “Attributed completed service jobs / N; cp_provider.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
