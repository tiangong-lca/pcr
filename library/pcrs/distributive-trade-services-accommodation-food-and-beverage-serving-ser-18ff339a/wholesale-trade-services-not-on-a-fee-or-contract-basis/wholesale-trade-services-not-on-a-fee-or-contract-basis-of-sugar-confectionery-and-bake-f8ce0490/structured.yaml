allocation_rules:
  - rule_id: allocation_accepted
    applies_to: "all inventory"
    rule: "Use actual unique accepted cohort N and evidenced causal period/lot drivers. Retain failed,quarantined,returned-order,idle and cleanup resource duties and unfinished-period carry; do not delete activity or allocate by price/margin as a physical service quantity."
    source_ids: []
  - rule_id: allocation_goods
    applies_to: "nonexchange merchandise stock"
    rule: "Reconcile actual assigned opening,net receipts,buyer returns,closing,sold,supplier-return,other external exit and discard quantities with mutually exclusive states; quarantine is an internal movement. Quality bloom does not itself remove mass. Map real physical loss to compatible original released sealed-bar state and actual wrap fate,with quantity/unit/conversion source,burden owner and already-included loss coverage before separate once-only upstream integration."
    source_ids: []
  - rule_id: allocation_supplies
    applies_to: "extra supplies and usable_extra_return"
    rule: "Let S=attributed opening+true external net receipts-closing including recovered closing for each native supply. Internal issue/recovery is not new receipt. Choose gross INPUT S with separate matched unused outward-return OUTPUT OR consumed-only INPUT S-return with that same-scope matched return exchange omitted. No numerical S+return input,second subtraction or removal of nonreturned waste/spill upstream burden."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "shared_assets"
    rule: "Complete actual asset manufacture,maintenance/cleaning,replacements and EOL is attributed by cohort compatible driver/complete lifetime driver across all consumers/periods,then divided by N once. Establish observed life or actual history plus evidenced remaining use/termination with compatible units,source,uncertainty/sensitivity/update. Complete per-driver provider scope is an alternative representation,not added to equivalent asset burden."
    source_ids: []
  - rule_id: allocation_room_periods
    applies_to: "shared control and providers"
    rule: "For each measured compatible period use cohort physical driver/all-consumer driver on complete actual resource scope; reconcile all consumers,door/idle/cleanup/control events and provider overlap. Carry stock and actual replacement/termination duties across cutoffs exactly once."
    source_ids: []
  - rule_id: allocation_hvac_fluid
    applies_to: "hvac_fluid_supply; usable_hvac_return; hvac_fluid_waste; hvac_air_components"
    rule: "Close initial equipment charge,stored fluid,true external receipts,internal recovery/transfers and final charge/retained stock plus real external fates. Keep manufacture/provider-included initial charge/fluid production with one upstream owner. Usable external return is distinct from retained recovery; only proven same-scope independently supplied inventory may support consumed-only supply subtraction. An asset-origin export cannot reduce unrelated current makeup or create negative operating input; record actual Product transfer without automatic credit. Nonusable waste/release retains nonreturned upstream burden and actual receiving transport/treatment once."
    source_ids: []
  - rule_id: allocation_outlets
    applies_to: "actual rejects,residues and packing"
    rule: "Use actual exclusive whole sealed-unit or physically separated chocolate/wrap/cleaning residue quantities and receiving route. Returns/downgrades are not automatic Waste,coproducts or avoided-production credits. Do not add whole waste to its parts or infer loss from bloom/odour/thermal excursion alone."
    source_ids: []
  - rule_id: source_scope_normalization
    applies_to: "nonexchange commodity and service combination"
    rule: "Keep original external commodity stock, source assignment/loss and missing-stage/additional upstream integration quantities in their evidenced RAW actual scope. Identify whether each amount is one actual consignment, a target service cohort, or ALREADY per reference,with source/target scope IDs and quantity basis. The physical source-cohort all-exit denominator assigns RAW quantity to that target scope; it is not automatically the target accepted-service N. Only when combining that same target-scope commodity amount with the 1 Item(s) service derive amount per reference = RAW assigned amount / positive unique accepted source_same_scope_N,with acceptance IDs/time/reversal evidence. A proved single-case scope has source_same_scope_N=1; an already-per-reference amount is not divided again. Preserve raw integration quantities and source links; do not shrink actual upstream remediation or divide the whole source cohort by an unrelated N. N0 responsibility remains disclosed without division."
    source_ids: []
