    - id: freight
      applies_to: "controlled_bar_trade"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Use actual leg/load/route and unique commodity/provider/service owner; disclose any temperature/humidity equipment and empty-return burden inside carrier service. Range evidence need: Need gross/tare/net load,distance,compatible conversion factors/units/sources and allocated shares/all-user drivers; no nominal capacity or guessed route. Measurement evidence: protocol cp_transport; original record basis Mass * distance / kg*km. The original amount constraint “Attributed actual freight kg*km / N; cp_transport.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
