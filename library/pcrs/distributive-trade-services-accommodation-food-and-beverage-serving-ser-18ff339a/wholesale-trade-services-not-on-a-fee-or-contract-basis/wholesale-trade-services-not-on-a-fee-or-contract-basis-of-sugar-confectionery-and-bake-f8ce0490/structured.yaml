      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Actual warehouse/HVAC/sensors/racks/pallets/crates owned by the scope across all consumers/periods; include full manufacture,maintenance/cleaning,replacements and end-of-life. Range evidence need: Need compatible cohort/lifetime drivers with observed use or history plus evidenced remainder/termination,source,uncertainty/sensitivity/update; not a new pallet per trip or depreciated-zero asset. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Attributed complete asset equivalents / N; cp_assets.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
