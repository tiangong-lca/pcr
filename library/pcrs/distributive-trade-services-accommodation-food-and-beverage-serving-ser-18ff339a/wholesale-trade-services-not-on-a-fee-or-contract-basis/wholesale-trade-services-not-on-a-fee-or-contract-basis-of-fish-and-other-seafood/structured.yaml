    - id: refrigerant_supply
      applies_to: "frozen_cod_wholesale"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Keep actual chemical/blend and nonnegative matched operating-supply stock separate from factory charge already owned by the asset dataset. Internal charging is not a second purchase and top-up is not automatically emitted. Range evidence need: Need actual supply provenance, charge/container inventories, receipts/tare, recoveries and actual external fates with uncertainty. No chosen refrigerant type, equipment-charge default or universal annual leak rate. Measurement evidence: protocol cp_refrigerant; original record basis Mass / kg. The original amount constraint “Actual attributed refrigerant supply per reference flow; cp_refrigerant.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
