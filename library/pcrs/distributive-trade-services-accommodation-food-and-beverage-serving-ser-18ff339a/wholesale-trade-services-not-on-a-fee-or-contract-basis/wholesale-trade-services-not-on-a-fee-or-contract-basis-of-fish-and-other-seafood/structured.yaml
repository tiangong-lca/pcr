    - id: electricity
      applies_to: "frozen_cod_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Meter actual refrigeration, circulation/defrost, dock handling, hygiene and business support within the declared service; rejected lots and actual idle intervals retain burdens. Primary freezing and glazing heat removal belong before this service gate. Range evidence need: Need actual meter intervals, incoming frozen state, room/lot load, thermal history and all-consumer drivers. Independent guards require matching freezer/load/climate/period scope, not a fixed kWh per net-fish kg. Measurement evidence: protocol cp_energy; original record basis Energy / kWh. The original amount constraint “Actual attributed electricity per reference flow; cp_energy.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
