  calculation_rules:
    - id: service_quantities
      applies_to: "all inventory rows"
      rule: "Assign actual direct and shared quantities to actual consignment/room/event/period by compatible documented all-consumer driver, including rejected/failed/idle/cleaning scope; divide attributed total by positive accepted N once."
      inputs:
        - cp_consignment
        - cp_fish
        - cp_energy
        - cp_refrigerant
        - cp_supplies
        - cp_assets
        - cp_providers
        - cp_freight
        - cp_fates
        - cp_releases
      output: "Actual operational quantity per reference flow"
      source_ids: []
    - id: fish_component_stock
      applies_to: "fish/glaze/pack memorandum"
      rule: "Reconcile actual same-state intact pack counts: opening + external receipts + buyer returns - closing - physical dispatch - supplier returns - useful other exits - actual discarded packs - actual sample removals = unexplained pack gap. Pair internal movements. Separately reconcile measured net fish excluding glaze/pack, inherited glaze, packaging, actual samples and independently evidenced state changes with uncertainty; gross shortage cannot identify a component or emitted species. Do not force glaze sublimation to be tissue loss."
      inputs:
        - cp_fish
        - cp_fates
      output: "Actual stock/component/state audit, not an inferred loss or emission"
      source_ids: []
    - id: source_gate_demand
      applies_to: "fish/glaze/pack memorandum"
      rule: "Trace actual complete supplier-release-gate quantities by lot to accepted consignments, closing, returns/useful exits and actual proven discard/state-change shares. Preserve source reference basis: per net-fish kg may already include glaze and primary-pack manufacture; per-pack reference requires actual net-fish/glaze/pack evidence. Add only actual assigned source-gate demand not already in baseline loss/stage coverage, outside service. Missing processing/freezing/glazing/packing is assembled once outside this service; do not add a generic yield multiplier, infer lost net fish from missing glaze, or repeat actual service treatment."
      inputs:
        - cp_fish
        - cp_consignment
      output: "Complete frozen-product source-gate demand and loss coverage outside service exchanges"
      source_ids: []
    - id: refrigerant_fates
      applies_to: "refrigerant_supply, recovered_refrigerant, spent_refrigerant and refrigerant_releases"
      rule: "On one actual installed-system plus applicable-container boundary, opening + actual external net supply - closing - usable external recovery - contained external waste - other documented external exits forms a balance requiring actual measured/evidenced release and uncertainty investigation. Internal charge/recovery cancels. Unknown balance and top-up alone are not leakage. Keep factory-charge/asset provenance; do not subtract its exported recovery from unrelated makeup. Only actual matched standalone supply can net with matched return omitted; otherwise record actual recovered Product/no automatic credit. Exact blend-to-species quantities require actual composition/fate once."
      inputs:
        - cp_refrigerant
      output: "Actual chemical supply/recovery/contained waste and species views per reference flow"
      source_ids: []
    - id: water_and_species
      applies_to: "water_vapour_releases and other_releases; other_releases_co2_fossil_air; other_releases_methane_fossil_air; other_releases_nitrous_oxide_air"
      rule: "Use actual compatible species/medium measurement or a validated physical method with required source/state/time and complete operands. Inherited glaze sublimation, fish tissue dehydration, utility-water evaporation and defrost/runoff are distinct. Unknown gross shortage never provides vapour, discarded fish or wastewater quantity. Actual fuel species use measured or completely reconciled burn and a compatible species factor; a complete factor is not multiplied again by composition/fate."
      inputs:
        - cp_fish
        - cp_energy
        - cp_fates
        - cp_releases
      output: "Actual measured/modeled water and chemical roles without duplicate or inferred fates"
      source_ids: []
    - id: actual_cargo_freight
      applies_to: "freight"
      rule: "For each actual kg*km leg use transported cargo load converted to kg times actual distance converted to km with explicit factors/sources. Net fish, inherited glaze and included packages contribute only where actually part of that cargo; retained loading tare/provider scope is explicit. Record cold-energy/refrigerant/empty-return coverage once; if another actual provider-native unit is used keep its matching burden, no price/Count proxy."
      inputs:
        - cp_freight
      output: "Actual compatible freight quantity per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: identity_and_gate
      applies_to: "all inventory rows"
      requirement: "Verify actual scientific species/fillet/supplier-release gate and each concrete service/material/chemical identity with property/unit support before final exchanges; Count support is not fish or service identity."
