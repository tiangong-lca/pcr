    - id: operating_supplies
      applies_to: "frozen_cod_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand actual cleaners, filters, lubricants and test consumables in native units/state with full fates. This role does not authorize adding food ingredients, new glaze or fillet treatment. Range evidence need: Need actual SKU/formulation/concentration, stock/return and conversion evidence plus receiver/release state. Applied formulation or safety limit is not a direct emission quantity. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed operating supplies per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: operating_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
