    - id: facility_water
      applies_to: "frozen_cod_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Record actual facility cleaning and support water, excluding inherited fish glaze, primary processing and deglazing unless an actual documented analytical sample consumes water. Sample-test support is not production re-glazing. Range evidence need: Need actual meter/issue purpose and interval, sample scope if applicable, supplier coverage and water fates. Inherited glaze loss, fish moisture and wastewater are not measured utility water supply. Measurement evidence: protocol cp_supplies; original record basis Volume / m3. The original amount constraint “Actual attributed facility water per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: facility_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
