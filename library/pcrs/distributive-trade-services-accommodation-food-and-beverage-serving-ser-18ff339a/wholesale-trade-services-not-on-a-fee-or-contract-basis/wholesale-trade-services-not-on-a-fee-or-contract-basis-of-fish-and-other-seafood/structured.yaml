      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only actual same-SKU/state external returns match operating inputs. Under consumed-only accounting OMIT the matched return exchange; inherited merchandise/package returns stay in stock audit. Range evidence need: Need actual recipient/transfer/native quantity and matched standalone supply scope. Closing stock, internal pallet loops and discarded material are not usable external returns or automatic credits. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed usable supply returns per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_supply_returns_detergent_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
