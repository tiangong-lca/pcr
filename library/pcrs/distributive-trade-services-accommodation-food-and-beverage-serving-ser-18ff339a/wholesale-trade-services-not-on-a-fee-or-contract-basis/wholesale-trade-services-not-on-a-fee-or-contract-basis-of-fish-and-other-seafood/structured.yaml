          property_unit: "Mass / kg"
          description: "Actual records establish nitrous oxide substance and direct air release. Native quantity is mass of N2O, not nitrogen mass or molecular nitrogen; no emission factor or occurrence assumed. This is a direct actual node release, not purchased-electricity/upstream/provider-covered emissions. The UUID denotes air with no finer subcompartment; resolve a different applicable compartment/origin under the residual requirement rather than relabelling it. Missing data is not zero. Range evidence need: Need measured species or actual compatible activity/factor plus composition/fate/unit/source if relevant. Product supply, safety limit, sampling result or unknown fish stock is not an emission amount."
          amount:
            expression: "Actual attributed other releases per reference flow; cp_releases."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_releases
              source_ids: []
            ranges: []
allocation_rules:
  - rule_id: operating_attribution
    applies_to: "frozen_cod_wholesale"
    rule: "Assign actual event/submeter burdens first. Shared refrigeration/room/support requires compatible evidenced thermal/load/occupied-volume-time drivers across ALL real consumers, with idle/defrost/cleaning and rejected/returned stock retained. Explain the driver and divide attributed total by positive accepted N once; net-fish kg alone or equal jobs/revenue are not automatic drivers."
    source_ids: []
  - rule_id: asset_attribution
    applies_to: "shared_assets"
    rule: "Use complete manufacture, maintenance, actual replacements and end-of-life with actual used / compatible lifetime driver across all consumers/periods. Lifetime driver is observed or observed history plus evidenced remaining use/termination, uncertainty and sensitivity. Choose either asset-equivalent fraction / N or lifecycle-complete provider-native service / N, not both or twice-normalized. Factory charge already inside asset scope has its upstream owner there."
    source_ids: []
  - rule_id: supplies_and_returns
    applies_to: "actual operating supplies"
    rule: "For each actual standalone native SKU/state S = attributed opening + net external receipts - closing. Choose gross-with-outlets S / N and actual usable external return, OR consumed-only (S - MATCHED usable external return) / N and OMIT that matched return exchange. Closing includes recovered retained stock; wastes/leaks retain supply burden. Internal transfers/inherited fish glaze/primary packs are not new operating purchases."
    source_ids: []
  - rule_id: refrigerant_origin
    applies_to: "all refrigeration roles"
    rule: "A recovered fluid may originate from factory charge already carried by the asset dataset. NEVER subtract that export from unrelated current makeup or create negative supply. Only proven same-scope standalone stock may use consumed-only subtraction with matched return omitted; otherwise keep actual recovered Product transfer/no automatic credit and retain original asset/charge burden owner. Internal recovery/retained bottles remain inside closing stock."
    source_ids: []
  - rule_id: commodity_interface
    applies_to: "fish/glaze/primary-pack memorandum"
    rule: "Keep complete supplier-released frozen/glazed/primary-packed commodity manufacture outside service. Trace actual source-gate quantity assigned to accepted consignments, closing stock, useful returns/exits and proven discard/state-change shares with original-state/unit/conversion evidence. Net fish, inherited glaze and packaging have different bases: glaze sublimation is not automatically lost net fish and present gross deficit is not a source-gate loss quantity. Reconcile any identical loss/stage coverage already embedded in the commodity baseline, add missing assigned demand only once, and do not duplicate service treatment. A live/caught-fish-only dataset requires missing slaughter/fillet/freezing/glaze/pack stages assembled outside this add-on."
    source_ids: []
  - rule_id: outlets
    applies_to: "all actual outlets"
    rule: "No automatic avoided-product/material/waste-treatment credit from recovered refrigerant, unused supplies, rejected fish or package return. A useful downgraded food exit needs actual state/receiver and remains merchandise audit, not an extra completed wholesale output. Unknown disposal/receiver/commodity attribution blocks full-chain finalization."
    source_ids: []
  - rule_id: commodity_link_scope
    applies_to: "nonexchange commodity interface"
    rule: "Keep actual original-gate stock and completed external integration at their recorded raw quantities. Declare source_assignment_scope_id, actual target_consignment_ids/target_cohort_id and source_assignment_quantity_basis: single_consignment_case, target_cohort_total or already_per_reference. For a raw target-cohort total, source_link_per_service_quantity=source_link_assigned_raw_quantity/same_target_scope_N ONLY when the positive N covers exactly that assigned target scope, with actual native units/state/source and acceptance-reversal evidence; use that interface once when combining with 1 accepted_service. A single-consignment case with N=1 and an already-per-reference quantity are not divided again. Do not divide actual external stock/stage-integration records by service N or use whole-source-cohort N for a narrower assigned target; preserve raw quantities and an explicit once-only link."
    source_ids: []
