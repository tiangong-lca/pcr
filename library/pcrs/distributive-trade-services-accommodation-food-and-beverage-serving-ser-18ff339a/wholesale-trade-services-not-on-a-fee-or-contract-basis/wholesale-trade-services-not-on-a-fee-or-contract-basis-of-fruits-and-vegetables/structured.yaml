allocation_rules:
  - rule_id: allocate_operation
    applies_to: "apple_cold_wholesale"
    rule: "Use direct lot/room/event meters first. Allocate documented shared refrigeration and premises/support across all actual consumers by evidenced compatible thermal/load/occupied-volume-time drivers as applicable; explain idle/defrost/cleaning and failed/rejected stock. No automatic equal-consignment, revenue or kg-only driver independent of duration/load. Divide attributable totals by N once."
    source_ids: []
  - rule_id: allocate_assets
    applies_to: "shared_assets"
    rule: "Enumerate all actual asset/crate/pallet consumers and periods; use full manufacture, maintenance, replacements and end-of-life with actual used driver / lifetime driver. Lifetime driver is observed or observed history plus evidenced remaining use/termination, with uncertainty and sensitivity. Use one asset-equivalent fraction / N OR lifecycle-complete provider-native quantity / N, not both. Inherited reusable package stock alone does not prove full new manufacture during service."
    source_ids: []
  - rule_id: allocate_supplies
    applies_to: "actual service supplies"
    rule: "For each actual native SKU/state S = attributed opening stock + net external receipts - closing. Choose gross-with-outlets S / N with usable external return, OR consumed-only (S - matched usable external return) / N, in which case OMIT that matched usable-return exchange from the actual dataset rather than emitting it as another credit. Closing includes usable recovered closing; waste or uncontained loss retains upstream supply burden. Internal package circulation and inherited merchandise packages do not create new supply. Refrigerant installed/storage scope is reconciled separately."
    source_ids: []
  - rule_id: allocate_commodity
    applies_to: "fruit memorandum"
    rule: "Keep all fruit production outside service. Link actual traced original-gate quantity assigned to this consignment/cohort, including its evidenced irrecoverable-fruit or physiological-state-change share, to a compatible commodity dataset. Preserve original-gate state/unit, closing stock, usable returns/other exits, actual accepted net dispatch and existing loss coverage. Current apple mass deficit is not the original-gate loss quantity. Add only any original-gate demand not already in the commodity baseline; do not add a second generic yield multiplier. Actual disposal/treatment already in this service stays excluded from that production-only adjustment. Missing trace/state conversion/attribution blocks full-chain claims."
    source_ids: []
  - rule_id: allocate_outlets
    applies_to: "recovered_refrigerant and all residues"
    rule: "Actual usable recovery/returns and usable downgraded apple exits require actual state, quantity and receiver; no automatic avoided virgin refrigerant, new box, fruit or waste-treatment credit. Fruit remains memorandum, not a second wholesale output. If intentional processing/co-production appears, review a separate boundary/attribution before final data."
    source_ids: []
  - rule_id: commodity_link_scope
    applies_to: "nonexchange commodity interface"
    rule: "Keep actual original-gate stock and completed external integration at their recorded raw quantities. Declare source_assignment_scope_id, actual target_consignment_ids/target_cohort_id and source_assignment_quantity_basis: single_consignment_case, target_cohort_total or already_per_reference. For a raw target-cohort total, source_link_per_service_quantity=source_link_assigned_raw_quantity/same_target_scope_N ONLY when the positive N covers exactly that assigned target scope, with actual native units/state/source and acceptance-reversal evidence; use that interface once when combining with 1 accepted_service. A single-consignment case with N=1 and an already-per-reference quantity are not divided again. Do not divide actual external stock/stage-integration records by service N or use whole-source-cohort N for a narrower assigned target; preserve raw quantities and an explicit once-only link."
    source_ids: []
  - rule_id: allocation_rule_7
    applies_to: "foreground_burden_allocation"
    rule: "Refrigerant manufacture or factory-installed original charge already included in an asset dataset has one owner there; only actual service-owned additional/makeup supply not already covered enters refrigerant_supply. Check manufacture, original charge, recovered charge and operating maintenance coverage explicitly rather than counting the same gas again."
    source_ids: []
  - rule_id: allocation_rule_8
    applies_to: "foreground_burden_allocation"
    rule: "The received merchandise gate is already harvested/sorted with actual packaging. A comparator orchard-gate dataset alone may omit intervening sorting, packing, losses and transport: assemble any missing actual predecessor scopes outside this add-on, with explicit owners and no duplicate stage. Match original-gate commodity quantities to the actual declared predecessor state before attributing loss/state-change demand. Refrigerant netting is origin- and scope-specific. A usable external recovery may originate from factory-installed charge whose production is already owned by the asset dataset, rather than the current standalone operating-makeup purchase. NEVER subtract such recovery from unrelated/current makeup or create negative makeup supply. Consumed-only subtraction is allowed only for a physically matched same-scope standalone supply-stock quantity with evidenced charge/supply provenance, and the matched return exchange is then omitted. Otherwise retain the actual recovered Product transfer without automatic credit, preserve the original asset/charge upstream owner and use the actual nonnegative operating supply stock convention. Recovery mass, inherited charge and current makeup are separate physical and burden views."
    source_ids: []
