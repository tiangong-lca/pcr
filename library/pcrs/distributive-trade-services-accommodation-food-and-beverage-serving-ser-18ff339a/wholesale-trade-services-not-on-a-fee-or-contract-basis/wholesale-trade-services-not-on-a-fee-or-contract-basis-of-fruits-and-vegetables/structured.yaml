  calculation_rules:
    - id: service_normalization
      applies_to: "all inventory rows"
      rule: "Assign actual direct and evidenced shared quantities to actual consignments and periods using compatible all-consumer physical drivers. Divide attributable total by positive accepted N once; failed/rejected/cancelled attempts retain actual responsibility without adding accepted counts."
      inputs:
        - cp_consignment
        - cp_apples
        - cp_energy
        - cp_refrigerant
        - cp_supplies
        - cp_assets
        - cp_providers
        - cp_freight
        - cp_fates
        - cp_releases
      output: "Actual operational quantity per reference flow"
      source_ids: []
    - id: fruit_state_reconciliation
      applies_to: "fruit memorandum"
      rule: "Reconcile actual same-state net fruit and physical stock events: opening + external receipts + buyer returns - closing - physical dispatch - supplier returns - useful other exits - measured discarded fruit, with independently evidenced water/physiological/state changes kept as their own compatible physical views and unexplained residual investigated. Internal transfers cancel. Different wet-state masses cannot form a dry-matter or CO2 balance; gas uptake and substance fate require their own model if used."
      inputs:
        - cp_apples
        - cp_releases
      output: "Actual fruit stock/state reconciliation, not inferred species or production loss"
      source_ids: []
    - id: original_gate_demand
      applies_to: "fruit memorandum"
      rule: "Trace actual original-gate quantities from each lot to accepted consignments, closing stock, supplier/useful exits and actual attributed irrecoverable/state-change shares, using explicit original-state conversion evidence. Link the actual attributable original-gate quantity to the commodity dataset outside service; reconcile any identical loss already embedded in that baseline, adding missing demand only once. Do not set original-gate loss equal to present mass deficit, prescribe a generic multiplier or duplicate service waste treatment."
      inputs:
        - cp_apples
        - cp_consignment
      output: "Original-gate commodity quantity/loss interface outside service exchanges"
      source_ids: []
    - id: refrigerant_fates
      applies_to: "refrigerant_supply, recovered_refrigerant, spent_refrigerant and refrigerant_releases"
      rule: "On an explicitly common installed-system plus applicable-container boundary, opening inventory + actual external net receipts - closing inventory - usable external recovery - contained external waste - other documented external exits = balance requiring measured/evidenced release and uncertainty investigation. Internal charge/recovery cancels. Do not automatically label an unexplained balance leakage or use recharge alone as release. Exact blend-to-species conversion requires actual composition/fate evidence and is applied once; a complete species factor is not multiplied again."
      inputs:
        - cp_refrigerant
      output: "Actual supplied/recovered/waste/released fluid views per reference flow"
      source_ids: []
    - id: physical_species
      applies_to: "environmental_gases, respiration_releases and other_releases; respiration_releases_biogenic_co2_air; respiration_releases_vapour_air; other_releases_co2_fossil_air; other_releases_methane_fossil_air; other_releases_nitrous_oxide_air"
      rule: "Use actual species/medium measurement or a validated actual cultivar/state/temperature/time physical model with explicit substrate, intake/release roles, all operands and uncertainty. Fruit water loss and respiration are separate state effects, not mass-deficit labels. Actual combustion species use measured or fully reconciled burn and a compatible source-specific factor; do not turn total supply, cleaning chemistry or safety limit into emission quantity."
      inputs:
        - cp_apples
        - cp_energy
        - cp_releases
      output: "Actual identified intake and release quantities without overlap"
      source_ids: []
    - id: freight_quantity
      applies_to: "freight"
      rule: "For each actual kg*km leg multiply net load converted to kg by actual distance converted to km; preserve exact unit factors/sources, cold-chain resource scope and empty returns. If the actual provider uses another physical unit, retain its matching quantity and burden instead; no count/price proxy."
      inputs:
        - cp_freight
      output: "Actual compatible freight quantity per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "all inventory rows"
      requirement: "Verify actual service/material/chemical/species identity and property/unit support before final exchanges; Count support and semantic role do not establish product UUIDs."
      evidence: "Concrete flow/detail/support proof"
    - id: thermal_quality
      applies_to: "apple_cold_wholesale"
      requirement: "Keep actual cultivar/grade, received/maintained state and calibrated temperature/humidity/time evidence with quality gate and excursions. No universal coldness or guaranteed shelf life; source tables are not defaults."
      evidence: "cp_apples; cp_energy; actual buyer acceptance"
    - id: stock_loss_quality
      applies_to: "fruit memorandum"
      requirement: "Resolve actual mass/tare/state/returns/fates, original-gate quantity and existing loss coverage. Unknown fruit deficit cannot become CO2, waste or original-gate loss by assumption."
      evidence: "cp_apples; original-state conversion and uncertainty"
    - id: refrigerant_quality
      applies_to: "all refrigeration roles"
      requirement: "Record exact chemical/blend, bounded stock/charge/recovery/external receiver and actual release evidence; unknown balance or nameplate capacity is not leakage."
      evidence: "cp_refrigerant and complete physical ledger"
    - id: coverage_quality
      applies_to: "apple_cold_wholesale"
      requirement: "Reconcile inherited/new packaging, complete lifecycle assets and direct/provider/freight/treatment/commodity boundaries once. Unknown quantities or missing methods stay gaps; empirical ranges require independent comparable data."
      evidence: "Full coverage and missing-data register"
    - id: period_quality
      applies_to: "shared_assets and all stock"
      requirement: "Link all actual room/lot/stock and asset phases, replacements/termination and consumers across periods; keep failed consignment burdens and avoid double opening/closing attribution."
      evidence: "cp_assets; cp_apples; actual phase/period records"
    - id: electricity
      applies_to: "apple_cold_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Meter actual compressors, circulation/defrost, handling, lighting and business support; include failed lots and actual idle/cleaning scope, not only successful sales. Range evidence need: Need actual intervals, room/lot load and duration, thermal state and all-consumer allocation. Independent energy guards need comparable cultivar/load/climate/room scope; no kWh-per-kg or per-day default. Measurement evidence: protocol cp_energy; original record basis Energy / kWh. The original amount constraint “Actual attributed electricity per reference flow; cp_energy.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_energy; actual source-linked native records"
    - id: refrigerant_supply
      applies_to: "apple_cold_wholesale"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Expand the actual chemical/blend identity, measured external makeup and installed/bottle stock scope. New charge, reusable recovery and subsequent release are distinct events; no refrigerant type or annual leakage fraction is assumed. Range evidence need: Need exact chemical/blend composition, actual purchased net mass, installed and stored stocks, charge/recovery/retained/transferred fates and uncertainty. Top-up alone does not establish emitted mass. Measurement evidence: protocol cp_refrigerant; original record basis Mass / kg. The original amount constraint “Actual attributed refrigerant supply per reference flow; cp_refrigerant.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_refrigerant; actual source-linked native records"
    - id: fuel_supply
      applies_to: "apple_cold_wholesale"
      requirement: "Which purchased fuel grade/formulation and supply gate are on the stock record? Identify any fuel other than the named diesel case and its native unit; obtain actual density before a volume-to-mass conversion. Record actual grade/native quantity and stock-adjusted supply, with measured burn separate. Do not add fuel already covered in complete hired transport/handling services. Range evidence need: Require actual stock/receipt/return records, grade, density/temperature conversion if used and disjoint burn/nonburned fates. No purchased-fuel-equals-combustion rule. Measurement evidence: protocol cp_supplies; original record basis Volume / L. The original amount constraint “Actual attributed fuel supply per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: fuel_supply_diesel_supply. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: water_supply
      applies_to: "apple_cold_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Include only actual facility support within ordinary-air room operation. Fruit washing/hydrocooling is outside this route; water purchased is not measured wastewater, respiration water or direct abstraction. Range evidence need: Need actual meter/purpose/period and supplier coverage, any actual humidification/cleaning fate and allocation. Do not infer fruit water uptake/loss from a facility bill. Measurement evidence: protocol cp_supplies; original record basis Volume / m3. The original amount constraint “Actual attributed water supply per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: water_supply_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: operating_supplies
      applies_to: "apple_cold_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand actual cleaning formulations, filters, lubricants and test consumables by native unit and state. No wax, fungicide treatment or other apple chemical-processing input is authorized by this evidence checkpoint. Range evidence need: Need SKU/formulation/concentration, net stock/return and actual waste/release fates with conversion sources. No safety-limit or applied-product quantity becomes an emission factor. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed operating supplies per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: operating_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: additional_packaging
      applies_to: "apple_cold_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Record only actual additional/replacement wrapping, seals, labels or damaged-container replacements owned by this service; inherited boxes/crates are an audit throughflow, not automatically new manufacture. Range evidence need: Need inherited/new/replaced identity, actual SKU native count/mass/area, state, receiver and matching unit conversion. Reusable crates require measured lifecycle service, not full new manufacture every trip. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed additional packaging per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: additional_packaging_pe_film. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_services
      applies_to: "apple_cold_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Expand actual refrigeration maintenance, testing, hired handling, hygiene, business support and any contracted cold holding in provider-native units. Direct-room work and complete hired services must not overlap. Range evidence need: Need actual completed result and native physical quantity, full energy/refrigerant/assets/transport/waste scope and missing coverage. Hours/price are not automatically counted service Item(s). Measurement evidence: protocol cp_providers; original record basis Count / Item(s). The original amount constraint “Actual attributed provider services per reference flow; cp_providers.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_providers; actual source-linked native records"
    - id: shared_assets
      applies_to: "apple_cold_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Include attributable complete lifecycle service of actual cold rooms, refrigeration equipment, handling plant, scales, returnable crates/pallets and ICT. Fruit production assets remain outside. Range evidence need: Need manufacture/maintenance/replacements/end-of-life, all consumers and observed plus evidenced remaining service drivers. Compatible occupied volume-time/handling-cycle evidence is needed, not a default crate life or fixed years. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual attributed shared assets per reference flow; cp_assets.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "apple_cold_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Record actual responsibility-owned inbound/outbound/return/waste legs with loads, distance, refrigerated-service energy coverage and empty returns. Do not count the same delivered-goods freight or vehicle energy twice. Range evidence need: Need actual net load/tare, route/mode/distance and explicit unit conversions, complete refrigerated leg/provider scope and all-consumer driver if shared. No presumed kilometres or tonne equivalence to one consignment. Measurement evidence: protocol cp_freight; original record basis Mass*distance / kg*km. The original amount constraint “Actual attributed freight per reference flow; cp_freight.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: environmental_water
      applies_to: "apple_cold_wholesale"
      requirement: "Identify the actual abstraction point, water body/aquifer, location and measured source volume from intake permits/meter records. Surface water and groundwater require distinct source identities; no direct withdrawal is established by purchased water use. Expand only actual direct abstraction with source/location and use. Purchased water, condensate collection and apple moisture are separate physical roles. Range evidence need: Need actual source meter or independently evidenced native quantity and purpose. Unknown direct-intake scope is not a default zero or a duplicate purchased-water input. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual attributed environmental water per reference flow; cp_fates.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: environmental_gases
      applies_to: "apple_cold_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Expand an actual identified intake such as oxygen only when the selected respiration/material model explicitly requires and evidences it. Ordinary air circulation is not an automatic purchased-gas exchange; no unexplained fruit mass is an oxygen quantity. Range evidence need: Need actual gas identity, intake role/medium and compatible measurement or full physical-model operands/source; missing evidence stays unresolved rather than creating a stoichiometric default. Measurement evidence: protocol cp_releases; original record basis Mass / kg. The original amount constraint “Actual attributed environmental gases per reference flow; cp_releases.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: environmental_gases_oxygen_air. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_releases; actual source-linked native records"
    - id: usable_supply_returns
      applies_to: "apple_cold_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Match unused supplies to actual input SKU/native state and chosen stock convention. Inherited apple packages and fruit supplier/buyer returns remain in their own throughflow audit, not new supply returns here. Under consumed-only accounting of a proven matched return, omit that matched concrete return exchange; retaining this semantic card does not authorize a second credit. Range evidence need: Require actual external recipient/transfer, native quantity and matched input; retained stock, discarded material and internal reusable-crate circulation are not usable outward returns. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed usable supply returns per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_supply_returns_detergent_return; usable_supply_returns_pe_film_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: recovered_refrigerant
      applies_to: "apple_cold_wholesale"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Record actual recovered usable chemical/blend crossing to a documented receiver. Recovered gas still in the system/bottle boundary is closing stock; no automatic virgin-gas substitution credit. A recovered factory-charge quantity must never reduce unrelated current makeup; retain its actual asset/charge origin and upstream burden owner. Range evidence need: Need actual recovery weighing, purity/blend/state, receiver and common installed/storage boundary. Do not call every evacuation recovered mass or every recovered kilogram avoided production. Measurement evidence: protocol cp_refrigerant; original record basis Mass / kg. The original amount constraint “Actual attributed recovered refrigerant per reference flow; cp_refrigerant.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_refrigerant; actual source-linked native records"
    - id: spent_refrigerant
      applies_to: "apple_cold_wholesale"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Record actual contaminated/unusable recovered fluid and its receiving treatment, separate from usable recovery, internal stock and direct chemical releases. Range evidence need: Need actual contained net weight, chemical/blend/composition, receiver and treatment scope. Evacuated system capacity or a service invoice is not measured waste or leakage. Measurement evidence: protocol cp_refrigerant; original record basis Mass / kg. The original amount constraint “Actual attributed spent refrigerant per reference flow; cp_refrigerant.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_refrigerant; actual source-linked native records"
    - id: other_wastes
      applies_to: "apple_cold_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Expand actual damaged packing, spent filters, maintenance oils and cleaning wastes by state/native unit/receiver; avoid fruit and refrigerant rows already owning their quantities. Range evidence need: Need actual material fraction, weight/count/volume conversion and treatment receipt coverage. A replacement package is not proof the inherited whole package was discarded during this service. Measurement evidence: protocol cp_fates; original record basis Mass / kg. The original amount constraint “Actual attributed other wastes per reference flow; cp_fates.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: contained_wastewater
      applies_to: "apple_cold_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Record actual cleaning/maintenance/condensate mixtures sent to treatment with measured aqueous state and receiver. This route does not wash fruit; contained wastewater is not a second direct outfall. Range evidence need: Need actual collected/received volume, composition/concentration basis and treatment owner; purchased water and lost apple moisture do not directly establish this volume. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual attributed contained wastewater per reference flow; cp_fates.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: water_outfalls
      applies_to: "apple_cold_wholesale"
      requirement: "Identify the direct outfall and receiving water/soil compartment, measured water amount and independently analysed pollutant species. A sewer transfer to treatment is not this outfall; the missing receiving compartment prevents a concrete elementary-flow selection. Expand actual direct outfall/receiving medium with measured quality. Do not classify contained treatment transfer or inferred fruit transpiration as this water-discharge flow. Range evidence need: Need actual outfall volume/interval, receiver and quality; carrier water and separate pollutant mass views must not be added as one equivalent material flow. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual attributed water outfalls per reference flow; cp_fates.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: refrigerant_releases
      applies_to: "apple_cold_wholesale"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Expand exact chemical/species and medium from actual measured leakage or complete audited physical-fate evidence, with blend composition and uncertainty where applicable. Unknown charge balance is not automatically release. Range evidence need: Require actual chemical/charge/recovery/retained/waste/other-transfer operands on one boundary and interval, measurement method or compatible full factor. Do not use nameplate charge times generic annual leak rate or equate top-up to leakage. Measurement evidence: protocol cp_refrigerant; original record basis Mass / kg. The original amount constraint “Actual attributed refrigerant releases per reference flow; cp_refrigerant.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_refrigerant; actual source-linked native records"
    - id: respiration_releases
      applies_to: "apple_cold_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Only actual species/medium-specific measurement or a validated matching cultivar/state/temperature/time model establishes a release. Biogenic CO2, water vapour and intake oxygen are different physical roles; no generic conversion from fruit weight loss. Range evidence need: Need compatible actual state, temperature/time series, substrate/basis and full model/measurement operands, uncertainty and receiving compartment. Unexplained wet-mass change is not CO2, water vapour or dry-matter loss by default. Measurement evidence: protocol cp_releases; original record basis Mass / kg. The original amount constraint “Actual attributed respiration releases per reference flow; cp_releases.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: respiration_releases_biogenic_co2_air; respiration_releases_vapour_air. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_releases; actual source-linked native records"
    - id: other_releases
      applies_to: "apple_cold_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Expand actual species and medium from actual burn, cleaning or other operation, separate from refrigerant and fruit respiration rows and upstream provider treatment. Range evidence need: Need measured species or compatible actual activity/species factor with composition/fate sources as required. Do not convert total cleaning product, safety limit or missing stock into an emission. Measurement evidence: protocol cp_releases; original record basis Mass / kg. The original amount constraint “Actual attributed other releases per reference flow; cp_releases.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: other_releases_co2_fossil_air; other_releases_methane_fossil_air; other_releases_nitrous_oxide_air. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_releases; actual source-linked native records"
    - id: apple_waste_state
      applies_to: "apple_cold_wholesale"
      requirement: "Use lot-linked waste tickets to establish intact apples versus independently collected fruit fragments, moisture state and receiving treatment route; use discarded_apples and discarded_apple_fragments respectively. The cards must not share the same physical mass; unknown state or receiver blocks completion."
      evidence: "cp_apples; receiver records"
validation_rules:
  - rule_id: validate_gate
    applies_to: "accepted_service"
    rule: "Verify actual ownership resale, business buyer, unique accepted consignment N > 0 and all actual cultivar/grade/net mass/state/thermal-time/commercial qualifiers. Boxes, trucks and cancelled attempts cannot increase count."
    source_ids: []
  - rule_id: validate_preservation
    applies_to: "apple_cold_wholesale"
    rule: "Check usable before-state, actual ordinary-air cold-room intervention, maintained still-intact accepted after-state and all reject/loss/return exits with actual input roles. No CA/MA, chemical treatment, washing, processing or numeric regime inferred."
    source_ids: []
  - rule_id: validate_fruit
    applies_to: "fruit memorandum"
    rule: "Reconcile physical fruit/packaging states and actual original-gate assigned demand/loss coverage; resolve unexplained differences with compatible methods, never mass-deficit species. A missing commodity link blocks complete-chain readiness."
    source_ids: []
  - rule_id: validate_refrigerant
    applies_to: "refrigerant_supply, recovered_refrigerant, spent_refrigerant and refrigerant_releases"
    rule: "Check one installed/storage boundary, actual chemical/blend and every supply/stock/recovery/waste/transfer/release fate with uncertainty. No top-up or nameplate times default annual rate; no extra species fractions on complete factors."
    source_ids: []
  - rule_id: validate_real_exchanges
    applies_to: "all inventory rows"
    rule: "Every actual expanded native-unit exchange needs node-owned protocol and identity/state/receiver evidence; do not count inherited boxes as new supplies, reusable assets as new per-trip manufacture, or contained waste/water as direct emissions. Actual environmental input/gas/species roles require separate evidence, never silent zero."
    source_ids: []
  - rule_id: validate_allocation_period
    applies_to: "shared_assets and apple_cold_wholesale"
    rule: "Check all actual consumers/periods, actual lot campaigns/continuous room operation, idle/failed/cleaning attribution and full asset lifecycle/observed plus evidenced remaining service. One physical resource has one owner and one per-N normalization."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after concrete identity and actual foreground completeness review"
  downstream_use: "Ordinary-air refrigerated apple wholesale-service add-on linked to separately matched commodity production/original-gate adjustment"
  allowed_use: "Actual merchant-owned intact fresh apple room-cooled/held consignment with matching cultivar/quantity/state/thermal-time and accepted commercial gate"
  excluded_use: "Standalone apple footprint or orchard production; all-fruit average; CA/MA/fruit treatment/processing/retail/agency; monetary service proxy; full-chain claim without actual commodity adjustment"
  required_metadata: "Actual merchant/site/room/period/lot/consignment, ownership, cultivar/grade, net fruit/tare/moisture/state, received/maintained temperature/humidity/time/quality, actual package/refrigeration/provider/freight/treatment scope and commodity-link owner/status"
  required_quality_disclosure: "Concrete identities/support and unresolved actual data, stock/state/physiology and refrigeration uncertainty, all-consumer/full-life asset assumptions, missing coverage/methods and independent range limits"
  update_trigger: "Changed actual cultivar/grade/room/atmosphere/route/gate, cooling/quality evidence, refrigerant/asset/provider scope, packaging, loss-state/commodity coverage or recording method"
data_sources:
  - id: "unsd-cpc3-fruit-wholesale"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 explanatory notes, division61/subclass61021 (30 June 2025). https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Own-account fruit/vegetable wholesale classification only; this intact refrigerated apple service is a narrower subset."
  - id: "fao-temperature-humidity"
    type: "official_guidance"
    reference: "FAO, Small-Scale Postharvest Handling Practices: A Manual for Horticultural Crops, section6 Temperature and relative humidity control. https://www.fao.org/4/x5403e/x5403e08.htm"
    used_for: "Qualitative room refrigeration, respiration/water-loss and cultivar/chilling-state questions; no temperature, energy, duration, physiological factor or shelf-life value adopted."
