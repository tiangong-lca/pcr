      collection_method: "Use actual species and medium measurements or fully validated matching fruit-state/cultivar/thermal-time physical methods with every required operand/unit/source; distinguish environmental intake and different releases, and do not assign any unexplained stock difference to a species. Complete factors are applied once without extra composition/fate multiplication. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
