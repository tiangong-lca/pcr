allocation_rules:
  - rule_id: allocation_accepted
    applies_to: "all duties"
    rule: "Use positive unique actual accepted commercial N with causal physical cohort/period shares. Failed/quarantined/returned orders,idle/cleanup,incident response and unfinished-period duties remain attributed even when no service completes in a period; appliance/pallet counts or margins are not N."
    source_ids: []
  - rule_id: allocation_goods
    applies_to: "nonexchange commodity"
    rule: "Close assigned opening,net receipts,buyer returns,closing,accepted transfers,supplier returns,other external exits and actual whole/part losses with exclusive serial/constituent states. Quarantine is internal. Match original finished-appliance demand/state/loss and actual material loss to compatible original quantities/conversions/coverage owner once outside service; do not multiply a whole appliance burden by leaked kg or count already-included factory charge production again."
    source_ids: []
  - rule_id: allocation_supplies
    applies_to: "independent supplies and unused_supply_return"
    rule: "S=assigned opening+true external net receipts-closing including retained recovered independent supplies. Gross INPUT S plus separate same-scope matched unused OUTPUT OR consumed-only INPUT S-return omitting the matched output. Internal recovery is not new receipt,no numeric S+return,double deduction or removal of waste/spill upstream burden. Inherited factory-material export belongs to its separate source ledger,never subtracted from independent makeup/cleaning inputs."
    source_ids: []
  - rule_id: allocation_full_life
    applies_to: "shared resources/assets/providers"
    rule: "For compatible metered periods,use cohort physical driver/all-user driver on complete resource scope. Complete asset equivalent=compatible cohort driver/complete lifetime driver across users/periods; include manufacture,maintenance/cleaning,replacements,EOL,observed life or history plus sourced remainder/termination,units,uncertainty/sensitivity/update. Complete provider representation replaces overlapping own coverage rather than adding it."
    source_ids: []
  - rule_id: allocation_incident
    applies_to: "actual constituents and outlets"
    rule: "Reconcile each actual inherited species/material source with charge retained in opening/received/accepted/returned/closing appliances,material retained inside actually discarded whole appliances or transferred waste parts as nonadditive content audits linked to their physical waste outlets,actual separate usable external transfer,contained independent waste,absorbed contents in other waste and actual direct release. Recovery/retention is not a receipt or export; unknown discrepancy is a blocker. Whole appliance/part/packing/absorbed-fluid/independent-fluid streams and composition views are exclusive. Receiver treatment including residual charge/foam and its emissions is covered once; never add it as merchant direct release."
    source_ids: []
