loss_coverage; commodity_overlap_check; buyer_signature; calibration; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_state_and_gate; case_activation_evidence; quantity_exclusion_links; whole_total_reconciliation"
      collection_method: "Reconcile actual ownership and supplier inspected/primary-chilled release with each received half ID, carcass-body net weight after measured hooks/supports/pack tare, times and actual core/surface condition history. Count N final unique buyer-accepted commercial consignments, never halves or repeated documents. Track natural postmortem state, actual return/reject/drip/evaporation/unknown shrink separately; investigate differences. Unfinished resources remain linked open cohorts. Actual loss with compatible original-gate state/unit/source and one owner must be adjusted in the separate commodity system once. Attribute only the individually identified physical case; retain other source-linked actual fates separately. Each native record belongs to exactly one exchange and any whole total is a non-additive audit."
