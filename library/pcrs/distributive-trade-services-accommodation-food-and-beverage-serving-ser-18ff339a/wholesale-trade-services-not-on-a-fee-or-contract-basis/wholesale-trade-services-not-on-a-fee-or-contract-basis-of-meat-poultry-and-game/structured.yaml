    - protocol_id: cp_refrigeration
      process_id: "chilled_wholesale"
      flow_role: "installed fluid charge, recovery and useful export audit"
      record_type: "circuit_charge_recovery_record"
      raw_fields: "site_id; merchant_id; room_id; cohort_id; consignment_id; carcass_id; source_lot_id; event_id; period_id; reference_gate_id; accepted_consignment_ids; N; circuit_id; fluid_identity; fluid_state; initial_factory_charge_or_operating_supply; initial_charge_dataset_id; initial_charge_burden_owner; standalone_supply_event_id; matched_supply_scope; supply_match_evidence; composition; composition_basis; composition_source; installed_charge_opening; installed_charge_closing; charge_unit; supply_charge_event; provider_charge_event; actual_charged_quantity; recovered_removed_quantity; recovery_cylinder_gross; recovery_cylinder_tare; recovery_net_quantity; recovery_retained_stock; recovery_recharged; useful_export_quantity; useful_receiver; useful_acceptance_id; waste_transfer_quantity; waste_receiver; waste_transfer_id; waste_material_state; waste_classification; waste_treatment_route; waste_treatment_scope; measured_whole_fluid_release; unaccounted_charge_difference; discrepancy_investigation; provider_asset_coverage; calibration; uncertainty"
      collection_method: "Use actual circuit maintenance/charge/recovery records and calibrated cylinder weights; distinguish new supply, historical installed fluid, recovered retained/recharged stock, actual useful export, unusable waste and measured release. Internal recovery/recharge is not external purchase or export. Investigate any charge difference; no top-up=emission assumption, no automatic negative purchase or avoided-product credit. Actual species quantification is independently documented in cp_environment."
      unit: "kg of actual whole fluid with composition basis"
      frequency: "each actual charge, maintenance, recovery, export/waste and opening/closing event"
      temporal_coverage: "Selected events linked to circuit service periods and initial/historical stock"
      site_scope: "Named actual circuit and provider/merchant responsibility split"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated cylinder/circuit records, destination acceptance, full fate/coverage and unresolved-difference evidence"
    - protocol_id: cp_outlets
      process_id: "chilled_wholesale"
      flow_role: "contained hygiene/maintenance wastes and wastewater"
      record_type: "waste_stream_receiver_record"
      raw_fields: "site_id; merchant_id; room_id; cohort_id; consignment_id; carcass_id; source_lot_id; event_id; period_id; reference_gate_id; accepted_consignment_ids; N; stream_id; origin_event; material_identity; composition; composition_basis; composition_source; physical_state; native_property; native_unit; gross_quantity; tare; net_quantity; measured_volume; density; density_unit; density_temperature; density_temperature_unit; density_source; carcass_drip_inclusion; condensate_inclusion; defrost_inclusion; rinse_inclusion; stream_overlap_check; pollution_load; pollution_unit; load_method; load_source; receiver; transfer_id; waste_classification; treatment_route; treatment_scope; provider_inclusion; uncertainty"
      collection_method: "Measure actual disjoint waste streams and receiving treatment. Keep unusable recovered fluid, spent supplies, carcass waste/drip and cleaning aqueous mixtures by real state; wastewater composition characterizes the same fluid rather than an extra species exchange. Direct environmental outfall needs a separately reviewed Elementary exchange if actual, not a contained wastewater label."
      unit: "actual native outlet unit, kg or m3 as appropriate"
      frequency: "each actual waste/outflow transfer and sampling event"
      temporal_coverage: "Every selected attributed sanitation, maintenance and discard period"
      site_scope: "Named site outlets and actual treatment receiving boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weighed/metered quantities, stream characterization and receiver/treatment/no-overlap evidence"
    - protocol_id: cp_environment
      process_id: "chilled_wholesale"
      flow_role: "actual direct species with independent release evidence"
      record_type: "species_release_record"
      raw_fields: "site_id; merchant_id; room_id; cohort_id; consignment_id; carcass_id; source_lot_id; event_id; period_id; reference_gate_id; accepted_consignment_ids; N; circuit_event_id; source_event; substance_identity; receiving_medium; particle_basis; measured_mass; mass_unit; activity; activity_unit; species_factor; factor_unit; factor_scope; factor_source; factor_complete; measured_whole_fluid_release; whole_release_unit; composition; composition_basis; composition_source; fate; fate_basis; fate_source; captured_or_contained_quantity; recovered_stock_quantity; conversion_factor; conversion_unit; conversion_source; temperature; temperature_unit; pressure; pressure_unit; provider_asset_inclusion; calibration; detection_limit; uncertainty"
      collection_method: "Identify actual emitted species/medium and use measured species mass, valid matched activity factor or actual measured whole-fluid release with compatible composition/fate as exclusive paths. Separate captured waste/recovered stock and nonadditive whole-fluid view; complete factor already contains its composition/fate. Neither refrigerant top-up, carcass mass difference, odour nor product hazard supplies a release factor."
      unit: "kg by actual species/medium"
      frequency: "each actual release and linked observation interval"
      temporal_coverage: "All actual attributed direct sources/events/periods"
      site_scope: "Named actual merchant source, avoiding provider/carrier/asset repeated releases"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual species/medium and measured/factor/composition/fate source compatibility with uncertainty/detection limits"
  calculation_rules:
    - id: accepted_consignment
      applies_to: "accepted_service"
      rule: "N=count unique final accepted_consignment_ids at reference_gate_id; accepted_service=1 Item(s)."
      inputs:
        - cp_carcass
      output: "One actual complete commercial service with carcass/state/time/condition qualifiers"
      source_ids: []
    - id: carcass_stock
      applies_to: "merchandise audit; carcass_waste; carcass_waste_atomic_case"
      rule: "carcass_body_net_mass=gross_weight-hook_gambrel_tare-other_support_tare-inherited_pack_tare. Reconcile matching-state opening/receipts, buyer dispatch, actual external returns, closing including recovered closing, and observed fates; pair internal transfers. assigned_source_gate_quantity=compatible evidenced allocation of actual source_gate_input_quantity to the consignment/cohort, including assigned_moisture_state_change_share and excluding quantities assigned exclusively to returns, closing stock or other exits. commodity_source_gate_demand=assigned_source_gate_quantity/N in the separately linked original-gate commodity system, with actual source, state, unit, allocation/conversion and existing-loss coverage; never substitute final body mass plus discarded mass for that source-gate demand. actual_waste_mass/N is the actual contained carcass-waste quantity. Investigate shrink_difference with actual drip/evaporation/state evidence; no residual loss or emission inference."
      inputs:
        - cp_carcass
        - N
      output: "Non-exchange carcass stock/loss interface and actual state-specific contained outlet per reference flow"
      source_ids: []
    - id: new_supply_stock
      applies_to: "refrigerant_supply; cleaning_agents; added_covers; unused_count_returns; unused_mass_returns; cleaning_agents_synthetic_detergent"
      rule: "net_receipts=gross_receipts-tare_receipts; S=opening_supply+net_receipts-closing_supply; gross_input=S/N OR consumed_input=(S-usable_outward_return)/N under one chosen native-SKU convention. installed historical charge and recovered fluid are separate from this new-supply inventory."
      inputs:
        - cp_supplies
        - N
      output: "Actual new native supply/unused return per reference flow, without repeated return deduction"
      source_ids: []
    - id: cold_utilities
      applies_to: "electricity; cleaning_water; electricity_ac; cleaning_water_liquid_tap"
      rule: "metered_quantity=(reading_end-reading_start)*meter_factor on an appropriate source import register or actual direct compatible source measurement; utility_quantity=sum(metered_quantity*conversion_factor*attribution_share)/N, using actual complete all-user drivers/events/periods including idle. Preserve disjoint water-source/fate audit."
      inputs:
        - cp_utilities
        - N
      output: "Actual electrical or water import per reference flow"
      source_ids: []
    - id: physical_provider
      applies_to: "provider_packages"
      rule: "provider_quantity=quantity/N for an actual matching native-Count complete physical package; other native provider quantities require actual expansion. Add missing_scope once, remove direct_overlap with supplies/assets/carrier/treatment."
      inputs:
        - cp_provider
        - N
      output: "Lifecycle-complete actual provider service per reference flow"
      source_ids: []
    - id: asset_equivalent
      applies_to: "shared_assets"
      rule: "asset_equivalent=(job_driver/life_driver)/N with compatible full-life driver units and one matching whole-lifecycle asset inventory."
      inputs:
        - cp_assets
        - N
      output: "Actual full-lifecycle asset-equivalent Item(s) per reference flow"
      source_ids: []
    - id: freight_work
      applies_to: "freight"
      rule: "freight_work=sum(payload_kg*distance_km*attribution_share)/N. Retain actual load/support scope and conversion source; empty/refrigeration carrier coverage independent, not assumed empty loaded km."
      inputs:
        - cp_freight
        - N
      output: "Actual kg*km per reference flow with complete cold/empty carrier boundary"
      source_ids: []
    - id: refrigerant_fates
      applies_to: "recovered_refrigerant; unusable_refrigerant; refrigerant audit"
      rule: "recovery_net_quantity=recovery_cylinder_gross-recovery_cylinder_tare; useful_export=useful_export_quantity/N only when actual outward receiver acceptance exists; unusable_refrigerant=waste_transfer_quantity/N only for the separate actual unusable Waste transfer to an identified treatment. Reconcile installed opening/closing, real charging, actual recovery retained/recharged/exported/waste and independently established release with uncertainty. Investigate unaccounted_charge_difference; neither supply nor top-up is an automatic leak estimate."
      inputs:
        - cp_refrigeration
        - cp_supplies
        - cp_environment
        - N
      output: "Actual circuit/fate audit and useful recovered-fluid export per reference flow"
      source_ids: []
    - id: contained_outlets
      applies_to: "other_wastes; wastewater; unused_count_returns; unused_mass_returns"
      rule: "outlet_quantity=net_quantity/N for an actual distinct spent material/water stream in its own native unit; unused returns use usable_outward_return/N by matched supply unit. Pair actual receiver/treatment once; no added species view of contained waste."
      inputs:
        - cp_outlets
        - cp_supplies
        - N
      output: "Actual disjoint contained outlet per reference flow"
      source_ids: []
    - id: species_mass
      applies_to: "direct_species"
      rule: "species_mass=measured_mass/N OR activity*species_factor/N OR measured_whole_fluid_release*composition*fate/N after compatible basis/unit conversion, choose one valid path. factor_complete forbids multiplying composition/fate again; whole-fluid and species are nonadditive."
      inputs:
        - cp_environment
        - cp_refrigeration
        - N
      output: "Actual released species mass and receiving medium per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: chilled_gate
      applies_to: "received and accepted halves"
      requirement: "Actual supplier inspection/completed-primary-chill evidence, carcass identities, calibrated temperatures/weights/tare, actual adopted criteria, natural condition/time history and buyer acceptance are required. No historical manual condition stands for present site compliance or shelf life."
      evidence: "cp_carcass source/condition and actual buyer records"
    - id: loss_state
      applies_to: "carcass/drip/water and commodity link"
      requirement: "Distinguish carcass-body state, bone/fat/tissue, measured drips/evaporation, contained waste, commercial return and unknown shrink. Original-gate upstream loss adjustment uses actual compatible state/unit/source and one owner with existing-coverage check; unresolved composition cannot be silently equated to meat."
      evidence: "State-resolved stock/fate and separate commodity-loss evidence"
    - id: complete_resources
      applies_to: "coldroom/provider/assets/periods"
      requirement: "Cover all actual consumers, idle/hygiene/door/defrost/return events, provider physical scope, native quantities and full asset lifecycle including direct-event overlaps, initial charge/recovery/replacement/end-of-life and evidenced remainder."
      evidence: "Scope matrices, meters/driver rationale, physical provider results and asset/circuit records"
    - id: identity_and_ranges
      applies_to: "actual expanded exchanges"
      requirement: "Verify concrete product/waste/species/property/unit support before final data; actual native umbrellas remain expansion requirements. Future empirical limits need independent comparable evidence and applicability; no thresholds, leaks or loss factors invented here."
      evidence: "Concrete detail/support evidence and independent ranges"
    - id: electricity
      applies_to: "chilled_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Measure actual refrigeration compressors, fans, defrost, rail handling, lighting and sanitation-related electric use, including allocated idle periods. The site uses purchased electricity, not onsite combustion. Maintenance of received chilled carcasses is distinct from completing unperformed primary chilling; record actual receipt/holding thermal loads and excursions. Range evidence need: Use source meters, cold-room/door/defrost logs, received temperature and disjoint all-consumer driver evidence before defining comparable energy limits; no historic manual cooling duration, kWh/kg or compressor capacity default. Measurement evidence: protocol cp_utilities; original record basis Energy / kWh. The original amount constraint “Actual attributable purchased electricity per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: refrigerant_supply
      applies_to: "chilled_wholesale"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Actual externally supplied refrigerant by complete substance/mixture identity, composition and state, recorded separately from the installed-circuit charge and historical recovered fluid. Supply/imports and top-ups do not equal atmospheric emissions. Include actual maintenance supply once against provider/asset scope. Range evidence need: Require actual fluid SKU, cylinder gross/tare/net, stock, charging records, unused returns and circuit/provider coverage with composition basis/source; no assumed fluid type, charge size, leak rate or top-up emission equality. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable new refrigerant supply per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: cleaning_water
      applies_to: "chilled_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Only actual externally purchased water for room/rail/equipment hygiene, with source, treatment and cleaning-period attribution; no direct environmental abstraction in this route. Keep product drip, defrost/condensate, supplied rinsewater, recirculation and actual wastewater streams separately identified. Range evidence need: Actual meter/cleaning records and compatible quantity/fate evidence are needed; do not infer carcass losses or sewer volume from water purchases or import historical cleaning schedules. Measurement evidence: protocol cp_utilities; original record basis Volume / m3. The original amount constraint “Actual attributable purchased sanitation water per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: cleaning_agents
      applies_to: "chilled_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Record actual named/formulated sanitation products and quantities on equipment or room surfaces under the operator adopted procedure, with receiver/fate. No mandatory disinfectant chemistry, recipe, dilution or dose is taken from historical guidance. Direct meat decontamination treatment is outside this route. Range evidence need: Require actual SKU concentration/state/composition, receipt-stock-use-return records and procedure source; historical chlorine concentration or hazard classification is not a present consumption or release factor. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable mass-measured hygiene agent supply per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_agents_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: added_covers
      applies_to: "chilled_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Only actual countable new protective covers or identification consumables applied within wholesale, expanded by SKU; do not impose packaging on hanging chilled halves. Inherited wraps stay in the commodity audit. Hooks, gambrels, rails and reusable supports are life-attributed assets, not fresh covers per shipment. Range evidence need: Use actual piece/stock records and product identity; separate any actual independent measured mass view without adding it to the same physical count. No universal package-per-half or cover mass. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “Actual attributable new countable covers and labels per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_packages
      applies_to: "chilled_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Actual completed physically defined native-Count packages with result and scope; actual other-native provider quantities require exchange expansion and support. Cover all provider inputs/assets/wastes/transport once, separate supplier inspection evidence from an automatically purchased new service. Outsourcing excluded processing does not make it part of ordinary storage. Range evidence need: Require package ID, physical result, actual native unit, completed quantity and upstream inclusion/overlap matrix; price, staff hours or a food certificate label do not establish one inventory package. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “Actual attributable completed provider packages per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_provider; actual source-linked native records"
    - id: shared_assets
      applies_to: "chilled_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Actual cold-room fabric, refrigeration equipment, rails/hooks/gambrels, scales and reusable handling supports are represented by matching complete lifecycle fractions. Full scope includes manufacture, initial charge where applicable, maintenance/replacements/retirement/end-of-life with direct current-event resources identified once. Range evidence need: Evidence must cover all consumers/periods and observed life or history plus sourced remainder, maintenance/replacement/end-of-life. Evaluate actual hook/space-time or justified thermal/mass driver compatibility; no default asset life, density, kg per hook or equal consignment split. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual attributable asset-equivalent quantity per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "chilled_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Actual responsibility-bounded carrier legs not already in supplier commodity or provider datasets. Payload is weighed transported carcass-body mass with applicable packaging/transport load scope and separately known support tare, not boneless edible meat mass or live weight. Refrigerated vehicle energy/assets/refrigerant/empty legs require full carrier coverage once. Range evidence need: Require real leg distance, net load/state, conversion, load attribution and empty/refrigeration scope; no standard carcass weight, journey or truck cooling factor. Measurement evidence: protocol cp_freight; original record basis mass*distance / kg*km. The original amount constraint “Actual attributable chilled freight work per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: unused_count_returns
      applies_to: "chilled_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Usable unused new covers/labels or other actual Count-native consumables physically returned to a named receiver, matched to the same input SKU and state. Stock carried or recovered into closing is not an outward return. Commodity returns are separate merchandise records. Range evidence need: Actual input-return SKU/count/state and outward transfer evidence must select gross-input/separate-return or consumed-only/no-return-exchange convention; no duplicate return deduction or automatic avoided-product credit. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “Actual attributable unused counted consumable returns per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: unused_mass_returns
      applies_to: "chilled_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only actual unused new current supply returned outward by identical fluid/chemical SKU and state with matched mass basis, separate from circuit-recovered historical refrigerant and from spent or contaminated waste. Do not net unrelated chemicals or fluid species. Range evidence need: Require measured net return, actual receiver/transfer and exact input compatibility; closing inventory is not return, recovered circuit fluid cannot be an unused-new-supply return by assumption. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable unused current mass-measured supply returns per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: unused_mass_returns_detergent_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: recovered_refrigerant
      applies_to: "chilled_wholesale"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Actual circuit-recovered fluid removed and physically accepted for reuse/reclamation as a useful material at the declared handover; maintain origin, composition, state and receiver. Recovered fluid retained on site remains stock/charge, not an export. Unusable fluid for treatment belongs to its Waste state. Range evidence need: Use actual recovery cylinder gross/tare/net and destination acceptance plus circuit history; do not infer recovery from top-up, grant negative new-purchase quantities or avoided virgin refrigerant credits. Measurement evidence: protocol cp_refrigeration; original record basis Mass / kg. The original amount constraint “Actual attributable useful circuit-recovered refrigerant exports per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_refrigeration; actual source-linked native records"
    - id: carcass_waste
      applies_to: "chilled_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only physically collected actual rejected carcass material or separately identified drips sent to a documented receiver, with their own state/quantity and fate. Commercially acceptable supplier/buyer returns are merchandise movements. Drip is not all edible meat, and evaporation or unexplained weigh difference is not automatically this waste. Diluted rinsewater belongs to a disjoint wastewater stream. Range evidence need: Weigh actual distinct state/material and receiver, retain composition/state evidence where needed for loss adjustment and treatment. No fixed meat loss, bone fraction, drip percentage or stock residual amount. Measurement evidence: protocol cp_carcass; original record basis Mass / kg. The original amount constraint “Actual attributable contained carcass-related waste per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: carcass_waste_atomic_case; carcass_waste_carcass_drip. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_carcass; actual source-linked native records"
    - id: unusable_refrigerant
      applies_to: "chilled_wholesale"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Actual recovered installed-circuit fluid that is unusable and sent as a contained Waste to an identified receiving treatment, by measured mass, composition and state. It is neither useful Product recovery nor retained closing stock, ordinary cleaning wastewater, unused new supply return or an air release. Cover receiving treatment and provider responsibility once. Range evidence need: Actual recovery and waste cylinder gross/tare/net, chemical composition/state, outward transfer, receiver and treatment evidence are required; do not infer unusable waste from top-up or recoverable charge differences. Measurement evidence: protocol cp_refrigeration; original record basis Mass / kg. The original amount constraint “Actual attributable unusable recovered refrigerant waste per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_refrigeration; actual source-linked native records"
    - id: other_wastes
      applies_to: "chilled_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual spent covers, cleaning residues and absorbents expanded by material/composition and receiving treatment. Keep each physical stream distinct from unused supply, dedicated useful or unusable recovered refrigerant cards and carcass waste; actual hazards and treatment are evidenced. Range evidence need: Use real weigh/tare/state/receiver and treatment evidence; no assumed hazardous status, disposal rate or repeated carcass/refrigerant/wastewater stream. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual attributable other contained waste mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: wastewater
      applies_to: "chilled_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual measured aqueous cleaning outflow to an identified treatment receiver; identify any mixed carcass drip, defrost or condensate source before combining. Separately collected drips and recirculated water are not added again. Direct environmental outfall is not this contained Waste state and needs explicit reviewed Elementary expansion if actual. Range evidence need: Use actual volume, density/state if converted, measured contaminant characteristics and receiver boundary; do not use potable-water purchase, carcass shrink or condensate as automatic pollution load. Measurement evidence: protocol cp_outlets; original record basis Volume / m3. The original amount constraint “Actual attributable contained wastewater volume per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: direct_species
      applies_to: "chilled_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Actual released species and receiving medium, including refrigerant species only with appropriate evidence. Whole-fluid loss/composition/fate, actual circuit charge/recovery and other direct events remain auditable separately from supply; top-up is not a direct release quantity. Ordinary postmortem change, meat drip, odour or disinfectant hazard does not imply a named atmospheric pollutant. Range evidence need: Use measured species mass, a valid matched activity-specific factor or measured whole-fluid release with compatible composition/fate. Record molecular/species and medium, whole-fluid nonadditivity and factor completeness; no automatic CO2, refrigerant or disinfectant emission factor. Measurement evidence: protocol cp_environment; original record basis Mass / kg. The original amount constraint “Actual attributable direct species mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
validation_rules:
  - rule_id: preservation_gate_check
    applies_to: "accepted_service"
    rule: "N>0 unique accepted merchant consignments, actual inspected completed-primary-chilled before-state and maintained chilled buyer gate, real carcass net quantities/tare/IDs and full temperature/time/condition records. Half count/kg/invoice/rail transfer is not service reference."
    source_ids: []
  - rule_id: excluded_processing
    applies_to: "all scope"
    rule: "Check no disguised primary-chill completion, cutting/deboning/freezing/thawing/deliberate ageing or other processing. Natural postmortem change is not asserted absent; actual history and acceptance criteria govern. Outsourced processing needs separate route review."
    source_ids: []
  - rule_id: carcass_and_loss
    applies_to: "merchandise and outlets"
    rule: "Reconcile actual body/tare/state and matched stocks/returns/closing/internal transfers, real drips/evaporation/discard and unresolved shrink. Confirm compatible original-gate loss adjustment occurs once outside service; no default loss zero or shrink=discarded meat/pollutant."
    source_ids: []
  - rule_id: cold_and_lifecycle
    applies_to: "all consumers/periods/providers/assets"
    rule: "Validate real hook/space-time or justified thermal/mass driver and units, full consumers/idle/cleaning coverage and one owner for direct/provider/transport/treatment. Asset complete manufacture/charge/maintenance/replacement/end-of-life with remainder/source uncertainty; no duplicate normalization or new-supply return subtraction."
    source_ids: []
  - rule_id: refrigerant_and_water
    applies_to: "all fluids and direct_species"
    rule: "Separate new supplies, installed charge, unused new returns, recovered retained/recharged/useful-exported fluid, dedicated unusable recovered refrigerant Waste and other actual spent waste and actual releases. Top-up is not emission. Distinguish contained cleaning effluent, drip/condensate/defrost and direct outfall; species/medium/factor/composition/fate independently evidenced and nonadditive."
    source_ids: []
  - rule_id: bilingual_projection
    applies_to: "all cards/rules/protocols"
    rule: "Raw bilingual six reference fields, actual output card link/name, row properties/units/evidence/protocol raw operands, source URLs and ordered rules must align with generated canonical projection. Automated consistency does not verify actual food quality or final exchange identity."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset after complete actual foreground collection and concrete exchange verification"
  downstream_use: "Cold-preservation own-account wholesale-service add-on linked once to a separate original-gate carcass commodity system with compatible measured loss adjustment; not a whole delivered beef footprint."
  allowed_use: "The declared inspected primary-chilled bovine half-carcass merchant room/rail/consignment and actual accepted buyer gate, with real body quantities/tare, conditions/times and physical resource scope."
  excluded_use: "Live cattle or slaughter/primary-chilling manufacture; boneless cuts/offal as reference; deliberate ageing/cutting/freezing/thawing; fee agency/retail/standalone warehousing; safety/shelf-life guarantee or untracked loss interface."
  required_metadata: "Merchant ownership/site/room; carcass/source/consignment/cohort/period; inspection and completed-primary-chill release; gross/tare/body mass/bone-in state and halves; actual slaughter/receipt/hold/dispatch/acceptance times and core/surface conditions; real all-user cold/rail/provider/carrier/asset/refrigerant/water/waste scope; original-gate loss quantity/state/unit/source/sole owner and existing coverage"
  required_quality_disclosure: "Probe/scale calibration and actual accepted criteria; natural condition change, excursions and unknown shrink investigation; all-consumer physical driver rationale and full asset/provider/period coverage; actual circuit supply/charge/recovery/fate and species evidence; actual effluent/drip/treatment and compatible commodity-loss link; identity and numerical range gaps"
  update_trigger: "Changed received carcass/chill state, buyer criterion/condition or product history; added processing/ageing; changed room/cooling/circuit/rail/asset life/provider/carrier/water hygiene route; observed loss/excursion/release evidence or material source change"
data_sources:
  - id: "fao-meat-cold-preservation"
    type: "official_guidance"
    reference: "FAO, Manual on meat cold store operation and management, Cold preservation of meat products. https://www.fao.org/4/t0098e/t0098e02.htm"
    used_for: "Historical primary context distinguishing primary chilling and maintained chilled state, natural postmortem activity and weight/state change. No numerical temperature, duration, density, ageing programme or loss percentage adopted as default or present legal requirement."
  - id: "fao-meat-coldstore-operations"
    type: "official_guidance"
    reference: "FAO, Manual on meat cold store operation and management, Planning of cold storage. https://www.fao.org/4/t0098e/t0098e03.htm"
    used_for: "Historical primary hanging-carcass rail/handling, received already-chilled storage, hygiene and transport context. Actual resources/procedures are collected; manual cleaning recipes, fixed layout/loading and operating examples are not PCR quantities or present law."
