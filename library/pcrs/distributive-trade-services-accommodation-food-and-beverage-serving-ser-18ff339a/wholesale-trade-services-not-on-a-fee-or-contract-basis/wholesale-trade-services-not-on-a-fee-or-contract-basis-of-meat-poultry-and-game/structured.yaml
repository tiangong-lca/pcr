      collection_method: "Obtain actual physically completed inspection/hygiene/maintenance result and provider native quantity with complete upstream scope. Count only a genuine native-Count package; price/hours cannot be converted. Expand other actual native units. Split direct/provider refrigerant, transport and waste treatment scope once; excluded processing remains outside ordinary wholesale even if contracted."
      unit: "actual provider native unit; Count only for package-native completion"
