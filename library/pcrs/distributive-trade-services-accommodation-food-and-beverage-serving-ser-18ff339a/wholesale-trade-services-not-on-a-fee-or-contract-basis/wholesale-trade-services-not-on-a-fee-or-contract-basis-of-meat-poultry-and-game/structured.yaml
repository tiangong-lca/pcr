allocation_rules:
  - rule_id: commodity_loss_once
    applies_to: "carcass merchandise"
    rule: "Keep every commodity manufacturing burden outside this add-on. Actual irreversible discarded material, observed state/fate and compatible original-gate quantity/basis/unit/source/owner are linked with existing loss coverage to one commodity-system upstream adjustment outside service. Do not treat all carcass weight decrease or aqueous drip kg as equal kg of discarded meat. Unknown loss or moisture/constituent basis is a gap to resolve, not default zero."
    source_ids: []
  - rule_id: cold_shared_driver
    applies_to: "room loads and all consumers"
    rule: "Use actual causal all-user/event/period evidence, evaluating hook/occupied-space-time against thermal/mass or other justified drivers and documenting compatibility. Include actual idle, door, defrost, cleaning and rejection burden; a simple mass proportion or equal consignment split is not presumed. Retain unfinished-order resources in linked open cohorts until actual acceptance/rejection without inventing N."
    source_ids: []
  - rule_id: asset_full_life
    applies_to: "shared_assets"
    rule: "asset_equivalent=(job_driver/life_driver)/N, with compatible drivers and one matching complete lifecycle across all consumers/periods. Include real manufacture/initial charge/maintenance/replacements/retirement/end-of-life, observed life/history or source-backed remainder and uncertainty/sensitivity/update. Direct/provider/current-event overlaps are removed from the corresponding asset coverage only after those same burdens are accounted once elsewhere."
    source_ids: []
  - rule_id: native_unused_return
    applies_to: "new supplies"
    rule: "S=opening_supply+net_receipts-closing_supply. Choose gross supply input S/N and separately represent the actual matching native-unit unused outward-return output, OR consumed-only input (S-usable_outward_return)/N with that return exchange omitted and no extra deduction. Recovered closing supply belongs to closing. Unused new and installed historical refrigerant recovery never merge; nonreturned waste/loss supply burden remains."
    source_ids: []
  - rule_id: recovery_and_outlets
    applies_to: "all actual outlets"
    rule: "Commercial carcass returns are commodity movements, not negative service or automatic credits. Useful recovered installed fluid is a real physical outlet only when accepted outward; retained recovery stays stock. Spent fluid is a Waste outlet. Actual drip, carcass discard, mixed wastewater and direct species are disjoint state views; no avoided production credit or duplicate whole-fluid/species outflow."
    source_ids: []
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "The separately linked original-gate carcass commodity dataset must cover cattle production, slaughter/dressing and completed primary chilling through actual supplier release. A live-cattle farm dataset alone does not fill those missing upstream stages. Add compatible stages exactly once there, never silently omit them or add them inside this service."
    source_ids: []
  - rule_id: allocation_rule_7
    applies_to: "foreground_burden_allocation"
    rule: "For recovered installed fluid, identify whether its origin is initial factory charge already owned by an asset lifecycle dataset or a particular standalone operating supply. An actual useful recovered export does not reduce unrelated current make-up supply or create a negative input. Consumed-only deduction is permitted solely for an evidenced matching same-scope standalone supply-stock unused return; otherwise retain the initial-charge burden owner and record actual recovered Product transfer without automatic credit."
    source_ids: []
  - rule_id: allocation_rule_8
    applies_to: "foreground_burden_allocation"
    rule: "Trace the actual supplier-original-gate input and quantity assigned to the accepted consignment/cohort, including its evidenced ordinary moisture/state-change share. Do not set upstream commodity demand only from final dispatch body mass plus discarded mass: that would omit the burden of water originally present in the produced carcass. Use compatible original-gate state/unit and actual allocation/conversion evidence, with returns, closing stock and other exits allocated exclusively and existing loss coverage checked. This assignment does not infer edible-meat loss or pollutant species from a mass difference."
    source_ids: []
