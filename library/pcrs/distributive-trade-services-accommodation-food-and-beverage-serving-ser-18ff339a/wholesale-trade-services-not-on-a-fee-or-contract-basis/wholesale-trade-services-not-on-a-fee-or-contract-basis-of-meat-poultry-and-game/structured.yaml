      flow_role: "new supplies and unused current-input outward returns"
      record_type: "supply_stock_record"
      raw_fields: "site_id; merchant_id; room_id; cohort_id; consignment_id; carcass_id; source_lot_id; event_id; period_id; reference_gate_id; accepted_consignment_ids; N; sku; substance_material_identity; composition; composition_basis; composition_source; state; native_property; native_unit; opening_supply; gross_receipts; tare_receipts; net_receipts; closing_supply; recovered_closing_supply; actual_charge_to_circuit; circuit_event_id; usable_outward_return; return_receiver; return_transfer_id; used_quantity; waste_quantity; uncontained_loss; selected_return_view; conversion_factor; conversion_unit; conversion_source; density; density_unit; density_source; temperature; temperature_unit; piece_mass; piece_mass_unit; piece_mass_source; provider_asset_inclusion; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Use actual native stock/delivery/gross-tare records by SKU and state, distinguishing unused supply from installed charge or historical recovery. S=opening_supply+net_receipts-closing_supply. Either gross input S/N and separately represented matching actual outward return, or consumed-only (S-usable_outward_return)/N with return exchange omitted/no further deduction. Recovered closing supply is already closing. Nonreturned wastes/losses retain supply burdens; provider/asset included events are not repeated. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "actual supply native unit, kg or Item(s) as appropriate"
      frequency: "each supply, charge, use, return and stocktake"
      temporal_coverage: "All selected operation and linked supply-stock periods"
      site_scope: "Same cold-preservation wholesale node and actual responsibility boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "SKU/state/unit and input-return identity, calibrated quantity and source-backed conversion evidence"
    - protocol_id: cp_utilities
      process_id: "chilled_wholesale"
      flow_role: "metered cold maintenance and hygiene water"
      record_type: "cold_utility_meter_record"
      raw_fields: "site_id; merchant_id; room_id; cohort_id; consignment_id; carcass_id; source_lot_id; event_id; period_id; reference_gate_id; accepted_consignment_ids; N; source_id; meter_id; meter_register_role; reading_start; reading_end; meter_factor; metered_quantity; native_unit; conversion_factor; conversion_unit; conversion_source; incoming_temperature_load; all_room_consumers; hook_occupancy; hook_occupancy_unit; rail_length; rail_length_unit; occupied_space; space_unit; occupancy_start; occupancy_end; occupancy_duration; occupancy_duration_unit; mass_driver; mass_driver_unit; thermal_driver; thermal_driver_unit; selected_driver; driver_unit; attribution_share; driver_rationale; baseline_idle_load; defrost_event; door_event; fan_event; cleaning_event; supplied_water; recirculated_water; cleaning_outflow; carcass_drip; condensate; defrost_water; measured_evaporation; fate_overlap_check; provider_inclusion; calibration; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Read actual source import meters and disjoint cold-room events/periods, including arrival maintenance loads, door/defrost/fan/hygiene and baseline idle. Justify hook/space-time or appropriate thermal/mass driver with all actual users and compatible units; a kg ratio is not automatic. Attribute once; keep purchased water, drip/condensate/defrost/rinse and actual outlets distinct rather than infer losses or pollution. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kWh; m3; actual driver units"
      frequency: "each metering interval and room/door/defrost/cleaning event"
      temporal_coverage: "All cold-maintenance, loading, empty/idle and hygiene periods attributed to selected cohorts"
      site_scope: "Named room/source and every actual disjoint consumer"
