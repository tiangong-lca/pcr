  calculation_rules:
    - id: service_quantities
      applies_to: "all inventory rows"
      rule: "Assign actual direct and shared quantities using consignment, animal, care, pen and period evidence with the documented all-consumer driver. Divide actual attributable totals by N once; unsuccessful consignments retain resources without increasing accepted N."
      inputs:
        - cp_consignment
        - cp_animals
        - cp_feed
        - cp_water
        - cp_supplies
        - cp_energy
        - cp_providers
        - cp_assets
        - cp_freight
        - cp_environment
        - cp_emissions
      output: "Actual operational exchange per reference flow"
      source_ids: []
    - id: animal_identity_time
      applies_to: "animal memorandum and enteric_methane"
      rule: "For individual IDs, opening heads + external arrivals + actual return arrivals - closing heads - actual external live exits - actual deaths = unexplained identity/head gap. Internal pen transfers cancel. Investigate every gap, never infer death or emission. Sum actual non-overlapping in-boundary intervals by cattle class and convert recorded duration to method activity units; dead/rejected/returned cattle contribute only their actual time."
      inputs:
        - cp_animals
      output: "Actual head reconciliation and class-specific animal-time"
      source_ids: []
    - id: original_gate_link
      applies_to: "animal memorandum"
      rule: "Provide per original-gate cohort the actual attributable unrecovered mortality/loss identities and original-gate quantity to the commodity system, together with accepted-original-animal demand and baseline loss coverage. Add missing original-gate demand once only; if baseline already covers it, reconcile instead. Use original measured head/mass basis, not liveweight change/current carcass yield; live culls/returns/closing stock are actual live exits/stocks, not automatic lost heads. Disposal/treatment already in service is excluded from the production-only adjustment."
      inputs:
        - cp_animals
        - cp_consignment
      output: "Original-gate commodity adjustment outside service inventory"
      source_ids: []
    - id: enteric_method
      applies_to: "enteric_methane"
      rule: "Use either compatible actual CH4 measurement or an evidenced category/diet method over actual in-boundary animal-time. If a factor is kg CH4 per head per year, multiply class-specific animal-days by that factor divided by the source-defined days per factor year, then attribute to consignments and divide by N once. A daily activity factor uses its own compatible unit without another annualization. Preserve method/tier, factor source, uncertainty and any required diet/intake operands. This does not adopt a default factor or infer CH4 from head turnover or liveweight residual."
      inputs:
        - cp_animals
        - cp_feed
        - cp_emissions
      output: "kg enteric CH4 to air per reference flow"
      source_ids:
        - ipcc-livestock-2019
    - id: manure_species
      applies_to: "other_species; other_species_co2_fossil_air; other_species_nitrous_oxide_air; other_species_ammonia_air"
      rule: "Choose actual direct measurement or an evidenced actual-system manure method requiring compatible actual N, VS, system share, retention/storage interval and temperature/climate as applicable. Retain species/N basis; if N2O-N must become N2O, apply the documented molecular conversion once. A provider/full species factor already covering composition/fate is not multiplied by those fractions again. Do not infer species from wet manure, missing liveweight or all water purchased."
      inputs:
        - cp_environment
        - cp_emissions
      output: "Actual identified species and media with complete method coverage"
      source_ids:
        - ipcc-livestock-2019
    - id: fuel_freight
      applies_to: "fuel_supply, freight and other_species; fuel_supply_diesel_supply; other_species_co2_fossil_air; other_species_nitrous_oxide_air; other_species_ammonia_air"
      rule: "Fuel supply follows actual stock convention; burn is measured or reconstructed from complete disjoint carried closing, usable external return, contained nonburned waste, unrecovered nonburned loss and actual burn. Total spill is audit-only if its resolved fates already appear. Each freight leg uses actual kg load times km, with explicit unit conversions and non-overlapping provider/empty-return coverage; species use actual compatible activity and factor."
      inputs:
        - cp_supplies
        - cp_energy
        - cp_freight
        - cp_emissions
      output: "Actual supply, burn, kg*km and species views without duplication"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "all inventory rows"
      requirement: "Verify actual product/service/species and support chain before final exchange binding. Semantic labels and reference Count support do not verify animal/service/CH4 UUIDs."
      evidence: "Concrete flow-detail and support evidence"
    - id: trace_time_quality
      applies_to: "animal memorandum"
      requirement: "Every original/changed animal ID, actual custody/movement/fitness/return/death event and interval requires traceable evidence. No unknown head gap, static head snapshot or generic weight substitutes for actual occupancy."
      evidence: "cp_animals and competent actual welfare/identity records"
    - id: method_quality
      applies_to: "enteric_methane and other_species; other_species_co2_fossil_air; other_species_nitrous_oxide_air; other_species_ammonia_air"
      requirement: "Use actual class/diet/manure system, activity/time/source coverage, method/tier and compatible factor/species basis; quantify uncertainty and state all missing operands. No universal short-stay emission factor."
      evidence: "cp_emissions; actual factor/measurement provenance"
    - id: coverage_quality
      applies_to: "depot_wholesale"
      requirement: "Reconcile service/commodity, animal stock/feed input, water/manure/wastewater, direct/provider and asset/transport/treatment responsibilities. Unknown quantity/coverage cannot become zero; independent ranges need comparable actual care and residence."
      evidence: "Full coverage matrix and missing-data register"
    - id: period_quality
      applies_to: "shared_assets and depot_wholesale"
      requirement: "Link all periods and phases including unfinished care/consignments, stock carry, replacements and termination with one event/asset owner."
      evidence: "cp_assets; cp_animals; phase-period reconciliation"
    - id: feed
      applies_to: "depot_wholesale"
      requirement: "Obtain the depot ration delivery/SKU record, ingredient or complete-feed identity, as-fed moisture and actual supply/fate. No particular feed crop or compound recipe is established; the animal lifetime ration must not be substituted. Only actual depot feed, by feed identity and as-fed/dry-matter state; not the lifetime ration embodied in traded animals. Include stock-adjusted unconsumed feed lost or wasted, with fate and one upstream owner. Range evidence need: Actual offered, refused/recovered, stock and moisture records are needed by animal class and holding interval. Do not infer intake from liveweight change or set a typical daily ration; empirical guards need the same actual diet, class and residence. Measurement evidence: protocol cp_feed; original record basis Mass / kg. The original amount constraint “Actual attributed feed per reference flow; cp_feed.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_feed; actual source-linked native records"
    - id: drinking_water
      applies_to: "depot_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Record actual drinking-water supply and its source, meter or evidenced allocation independently of cleaning water. A meter supply total can include leakage or trough dumping; do not label all supplied water as ingested. Range evidence need: Use actual drinking supply, trough/cleaning separation, leakage/dumping and head-time records. Missing drinking evidence is a gap, not zero or a universal litres-per-head benchmark. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Actual attributed drinking water per reference flow; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: drinking_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_water; actual source-linked native records"
    - id: cleaning_water
      applies_to: "depot_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Record actual pen/vehicle washing, sanitation and ancillary water. It is not animal intake or a measured wastewater/discharge quantity; retain collection and receiver scope. Range evidence need: Actual meter/issue volume and cleaning events, premises/vehicle responsibility, period and provider coverage are needed. Do not set wastewater equal to purchased cleaning water. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Actual attributed cleaning water per reference flow; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_water; actual source-linked native records"
    - id: bedding
      applies_to: "depot_wholesale"
      requirement: "Obtain the bedding supply specification: botanical/material identity, moisture and native stock quantity. Straw and wood bedding are separate candidate identities; species, treatment and actual occurrence remain to be established. Expand actual straw, wood or other bedding identity and moisture/native quantity. It is an operating input, not additional grain/feed by default; retain spent bedding and manure mixture fate. Range evidence need: Collect actual bedding SKU, opening/receipt/closing, usable return and contaminated spent fraction. A bedding guardrail requires actual pen condition, cleaning cycle and animal-time, not generic housing assumptions. Measurement evidence: protocol cp_feed; original record basis Mass / kg. The original amount constraint “Actual attributed bedding per reference flow; cp_feed.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_feed; actual source-linked native records"
    - id: care_supplies
      applies_to: "depot_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand actual formulation, concentration, native unit and application under actual competent-care records; do not prescribe medicines, dosages or disinfection recipes. Record unused returns and actual waste/release paths. Range evidence need: Actual medicine/formulation/SKU quantity, concentration basis, care-event and native conversion evidence are required. A safety limit or administered-product mass is not an elementary emission factor. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed care supplies per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: electricity
      applies_to: "depot_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Record metered handling, lighting, pumps, ventilation, welfare-support and office electricity once, including quarantine and unsuccessful consignments; reconcile direct and provider coverage. Range evidence need: Need actual meter intervals, animal occupancy/handling support drivers and all-consumer denominator. No fixed electricity per head or consignment; generic electrical Energy support remains separate from identity. Measurement evidence: protocol cp_energy; original record basis Energy / kWh. The original amount constraint “Actual attributed electricity per reference flow; cp_energy.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_energy; actual source-linked native records"
    - id: fuel_supply
      applies_to: "depot_wholesale"
      requirement: "Which purchased fuel grade/formulation and supply gate are on the stock record? Identify any fuel other than the named diesel case and its native unit; obtain actual density before a volume-to-mass conversion. Retain actual fuel grade/native supply quantity and stock-adjusted amount. Direct combustion uses separately measured or completely reconciled burn, not fuel bought or total spillage. Range evidence need: Need grade, opening/receipts/closing, net/tare and usable-return evidence, any density/temperature conversion, actual burn and disjoint nonburned fates. No generic combustion fraction. Measurement evidence: protocol cp_supplies; original record basis Volume / L. The original amount constraint “Actual attributed fuel supply per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: fuel_supply_diesel_supply. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_services
      applies_to: "depot_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Expand actual competent-care, testing, hired handling, cleaning and administration results in provider-native units with upstream coverage. Count only a truly counted completed result; price and hours are not automatically Item(s). Range evidence need: Need completed-result evidence and native quantity plus energy/feed/material/assets/transport/waste coverage. Actual emergency care remains included even if the animal or consignment is not accepted. Measurement evidence: protocol cp_providers; original record basis Count / Item(s). The original amount constraint “Actual attributed provider services per reference flow; cp_providers.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_providers; actual source-linked native records"
    - id: shared_assets
      applies_to: "depot_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Attribute actual yards, pens, loading equipment, water systems, vehicles, scales and ICT lifecycle service across all users/periods. No assumption that a traded animal is a service asset. Range evidence need: Require complete manufacture/maintenance/replacement/end-of-life coverage and observed plus evidenced remaining driver. Comparisons need actual animal class/occupancy/handling; no universal asset life. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual attributed shared assets per reference flow; cp_assets.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "depot_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Record actual owned animal/supply/return/disposal legs by native provider unit and scope; kg*km uses actual live load and distance, not number of head times a typical weight. Preserve empty returns and welfare journey coverage. Range evidence need: Actual route/mode, animal IDs and load/tare mass, distance units/conversions, empty-return treatment and driver coverage are needed. Do not duplicate upstream production-gate transport or provider fuel. Measurement evidence: protocol cp_freight; original record basis Mass*distance / kg*km. The original amount constraint “Actual attributed freight per reference flow; cp_freight.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: environmental_water
      applies_to: "depot_wholesale"
      requirement: "Identify the actual abstraction point, water body/aquifer, location and measured source volume from intake permits/meter records. Surface water and groundwater require distinct source identities; no direct withdrawal is established by purchased water use. Expand actual water source/location and withdrawal role only when directly drawn. Distinguish drinking/washing allocation and the separate purchased-water products. Range evidence need: Need actual source-specific abstraction measurement and purpose/period; no default direct withdrawal from cattle occupancy or a purchased-water bill. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Actual attributed environmental water per reference flow; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_water; actual source-linked native records"
    - id: usable_returns
      applies_to: "depot_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Match actual unused supply returns to SKU/native unit/state and the chosen gross-with-outlets or consumed-only ledger. Live-animal supplier/buyer returns belong in the individual-animal ledger, not this evidence checkpoint. Range evidence need: Need actual external recipient, transfer, native quantity and matched input stock. Closing stock, internal feed returns and discarded supplies are not usable external returns. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed usable returns per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: usable_manure
      applies_to: "depot_wholesale"
      requirement: "Obtain the independent handover record, actual material/composite state, quality acceptance and recipient for the specifically described recovered outlet in this record. Determine Product-versus-Waste from that real handover; do not presume a recovered-product identity or substitution credit. Only an actual usable product handover with specified quality, quantity and recipient justifies Product status. This optional residual outlet does not receive an automatic avoided-fertilizer credit or turn ordinary holding into intended manure production. Range evidence need: Need actual quality/state, moisture/native quantity, receiver/use evidence and one burden owner; no assumed marketability or fertilizer-equivalence factor. If intentional co-production becomes material, review a new attribution boundary. Measurement evidence: protocol cp_environment; original record basis Mass / kg. The original amount constraint “Actual attributed usable manure per reference flow; cp_environment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
    - id: manure_waste
      applies_to: "depot_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Record actual collected manure, urine or bedding mixtures sent to waste management with native mass or independently evidenced volume/conversion, composition and receiver. Contained mass is not emitted CH4, N2O or NH3. Range evidence need: Need actual collection intervals, mass/volume/density and solids/N/VS evidence appropriate to the actual system, receiver and treatment scope. No headcount-to-manure default; distinguish prior stock and carryover. Measurement evidence: protocol cp_environment; original record basis Mass / kg. The original amount constraint “Actual attributed manure waste per reference flow; cp_environment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: manure_waste_collected_dung; manure_waste_collected_urine. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
    - id: carcasses
      applies_to: "depot_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Record actual identified animal death or emergency-killing event and actual carcass mass/native receiving quantity, receiver and treatment burden coverage. A liveweight difference or quarantine status does not establish death. Range evidence need: Need individual-ID death evidence, actual measurement/receiver quantity, period and disposal route. Head-count mortality and carcass kg are separate auditable views; no generic carcass yield or loss factor. Measurement evidence: protocol cp_animals; original record basis Mass / kg. The original amount constraint “Actual attributed carcasses per reference flow; cp_animals.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: carcasses_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_animals; actual source-linked native records"
    - id: other_wastes
      applies_to: "depot_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Expand actual feed refusals no longer usable, clinical/sharps/medicine residues and other operating wastes by identity, state, native unit and receiver. Exclude manure and carcasses already owned by their own rows. Range evidence need: Need actual rejected-feed/chemical/clinical fraction and receipt/treatment coverage. A purchase invoice, drug dose or hazard label alone cannot establish waste mass/composition. Measurement evidence: protocol cp_environment; original record basis Mass / kg. The original amount constraint “Actual attributed other wastes per reference flow; cp_environment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
    - id: contained_wastewater
      applies_to: "depot_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Record actual collected wastewater with aqueous composition and receiving treatment system; distinguish liquid manure storage and direct outfalls by actual system ownership and no duplicated physical quantity. Range evidence need: Actual collected/received volume, concentration basis, collection interval and treatment coverage are needed. Do not assume all drinking/washing water becomes this waste flow or double count a slurry mixture. Measurement evidence: protocol cp_environment; original record basis Volume / m3. The original amount constraint “Actual attributed contained wastewater per reference flow; cp_environment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
    - id: water_outfalls
      applies_to: "depot_wholesale"
      requirement: "Identify the direct outfall and receiving water/soil compartment, measured water amount and independently analysed pollutant species. A sewer transfer to treatment is not this outfall; the missing receiving compartment prevents a concrete elementary-flow selection. Expand actual direct outfall by receiving medium and quality. Collected wastewater sent to treatment is a Waste transfer, not a second elementary outfall. Range evidence need: Need actual outfall measurement, water source/period and receiving medium; composition-specific pollutant masses are separate non-additive views, never inferred from total water purchased. Measurement evidence: protocol cp_environment; original record basis Volume / m3. The original amount constraint “Actual attributed water outfalls per reference flow; cp_environment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
    - id: other_species
      applies_to: "depot_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Expand each actual species and medium from actual manure system, fuel burn, chemical use or leakage. Distinguish CH4, N2O/N2O-N, NH3/NH3-N and their source bases; do not repeat enteric CH4 or count off-site treatment emissions already in a provider dataset. Range evidence need: Need actual species/medium and measured emission or compatible activity with system/storage-time/climate, factor basis, composition/fate and molecular conversion source. Manure wet mass, liveweight residual and a safety limit are not emission quantities. Measurement evidence: protocol cp_emissions; original record basis Mass / kg. The original amount constraint “Actual attributed other species per reference flow; cp_emissions.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: other_species_co2_fossil_air; other_species_nitrous_oxide_air; other_species_ammonia_air. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_emissions; actual source-linked native records"
validation_rules:
  - rule_id: validate_gate
    applies_to: "accepted_service"
    rule: "Confirm actual ownership-based business-buyer resale with accepted consignment animal set, count/class/state/time and competent actual fitness/commercial records. No invoice split, animal head or cancelled transfer may inflate N."
    source_ids: []
  - rule_id: validate_animals
    applies_to: "animal memorandum"
    rule: "Reconcile every individual ID and head event separately from measured liveweight/carcass mass. Retain all actual quarantine/return/death residence, investigate unknown gaps and link original-gate commodity loss coverage without duplicating disposal."
    source_ids: []
  - rule_id: validate_care
    applies_to: "feed and drinking_water; drinking_water_liquid_tap"
    rule: "Use actual stock-adjusted feed, bedding, water and care records by animal class/holding interval; no prescribed ration, medicine, weight-gain conversion or inferred manure yield. Rejected/dead animals retain actual service care burdens."
    source_ids: []
  - rule_id: validate_fates
    applies_to: "all inventory rows"
    rule: "Every actual native-unit exchange must have its own-node protocol and state/receiver evidence. Separate usable returns, manure product/waste, carcasses, clinical waste, contained wastewater, direct withdrawal and outfalls. Unknown fates/coverage block final data; one mixture and provider treatment counted once."
    source_ids: []
  - rule_id: validate_species
    applies_to: "enteric_methane and other_species; other_species_co2_fossil_air; other_species_nitrous_oxide_air; other_species_ammonia_air"
    rule: "Verify actual species/receiving medium and time/activity basis, class/diet/manure method/tier, N versus species mass and sourced conversions. No annual factor times full-year throughput, no enteric/manure duplication, no residual-to-emission rule."
    source_ids: []
  - rule_id: validate_assets
    applies_to: "shared_assets"
    rule: "Check all consumers, actual periods, full-lifecycle manufacture/maintenance/replacement/end-of-life and observed/evidenced remaining driver with uncertainty, one attribution view and no default life."
    source_ids: []
  - rule_id: validate_mode_period
    applies_to: "depot_wholesale"
    rule: "Link all batches/consignments, care/cleaning/quarantine/reject/return events and actual stocks to real animals and periods. Avoid shared-campaign duplication; failed/cancelled attempts keep actual resources without accepted counts."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after concrete identity and foreground completeness review"
  downstream_use: "Temporary live cattle wholesale-service add-on with separate matched original-gate commodity production and loss coverage"
  allowed_use: "Actual own-account Bos cattle dealer-depot consignment with matching care/fitness/time/quantity and commercial handover qualifiers"
  excluded_use: "Animal-production or delivered-cattle full footprint alone; farm rearing/fattening/slaughter; all-live-species average; agency/auction-fee or monetary factor; complete-chain claims without original-gate loss linkage"
  required_metadata: "Actual animal/consignment/site/period, class/state/head count/liveweight basis, origins/destinations, ownership, actual occupancy/care/fitness/acceptance, feed/manure methods, transport/treatment/asset coverage and commodity-loss owner/status"
  required_quality_disclosure: "Actual ID/time/stock/method uncertainty, concrete UUID gaps, class/diet/system-specific factor coverage, all-consumer asset drivers, incomplete care or receiver data and independent range limitations"
  update_trigger: "Changed animal class/route/stay purpose, ownership/gate/care/welfare criteria, manure or emission method, feed/water/provider coverage, assets, original-gate loss coverage or recording evidence"
data_sources:
  - id: "unsd-cpc3-live-animal-wholesale"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 explanatory notes (30 June 2025), division61/subclass61014. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification only: own-account live-animal wholesale, narrower cattle dealer-depot route; not a physical inventory recipe."
  - id: "woah-land-transport"
    type: "official_guidance"
    reference: "WOAH, Terrestrial Animal Health Code, Chapter7.3 Transport of animals by land. https://www.woah.org/fileadmin/Home/eng/Health_standards/tahc/current/en_chapitre_aw_land_transpt.htm"
    used_for: "Qualitative assembly/temporary-holding, care and fitness responsibilities and journey records; not a universal maximum stay, dose or legal certificate."
  - id: "govuk-cattle-holding-register"
    type: "official_guidance"
    reference: "GOV.UK, Keep a holding register for cattle to record births, movements and deaths. https://www.gov.uk/guidance/keep-a-holding-register-for-cattle"
    used_for: "Individual cattle identity, origin/destination movement and death records as a jurisdiction-specific primary example; no England/Wales timetable applied globally."
  - id: "ipcc-livestock-2019"
    type: "official_guidance"
    reference: "IPCC, 2019 Refinement to the 2006 Guidelines, Volume4 Chapter10, Emissions from Livestock and Manure Management, with applicable corrigenda. https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf"
    used_for: "Activity/population/time and enteric/manure method distinctions; actual method applicability and operands required. No default emission, excretion or methane-conversion factor selected."
