  calculation_rules:
    - id: count_and_attribution
      applies_to: "all inventory rows"
      rule: "Collect actual operational totals using actual consignment, campaign and period keys. Attribute shared burdens with documented all-consumer physical drivers, then divide the attributed quantity by N once. Rejected/cancelled attempts retain attributable burdens but do not increase N."
      inputs:
        - cp_consignment
        - cp_energy
        - cp_supplies
        - cp_providers
        - cp_assets
        - cp_freight
        - cp_environment
      output: "Operational exchange quantity per reference flow"
      source_ids: []
    - id: grain_dry_balance
      applies_to: "grain memorandum and waste_grain; waste_grain_atomic_case"
      rule: "For each actual state D = net as-is mass times (1 - wet-basis moisture fraction). Dry opening + dry external receipts + dry buyer returns - dry closing - dry physical dispatch - dry supplier returns - dry useful other exits - dry contained waste - independently measured dry direct loss = unexplained residual. Internal transfers cancel. Investigate residual with uncertainty; do not label it emission or loss automatically. Water gain/loss is tracked separately and never equated with dry matter."
      inputs:
        - cp_grain
      output: "Stock reconciliation and identified dry-matter loss L per linked commodity consignment"
      source_ids: []
    - id: commodity_link
      applies_to: "grain memorandum"
      rule: "For actual attributed irrecoverable dry-grain loss L and accepted outbound dry-grain quantity G, send L / N to the commodity model. If G > 0 and the same loss is not already included upstream, commodity dry-grain demand is G + L, or multiplier (G + L) / G. Convert using actual upstream reference moisture and preserve responsibility/coverage. Treatment already in this service stays excluded from this production-only adjustment. Unknown loss, receiver or coverage blocks complete-chain finalization."
      inputs:
        - cp_grain
        - cp_consignment
      output: "Linked upstream commodity-loss adjustment, outside service exchanges"
      source_ids: []
    - id: fuel_and_species
      applies_to: "fuel_supply and species_releases; fuel_supply_diesel_supply; species_releases_co2_fossil_air; species_releases_methane_fossil_air; species_releases_nitrous_oxide_air"
      rule: "Upstream supply follows stock-adjusted input convention. Actual burn is measured or reconstructed from a complete disjoint fate ledger: carried closing, usable external return, contained nonburned waste, unrecovered nonburned loss and actual burn. A total spill tally is audit-only when its recovered/remaining fates already appear. Species release equals actual compatible activity times a species/medium-specific factor, or actual whole-fluid release times evidenced composition and fate. Do not multiply composition/fate again into a complete species factor."
      inputs:
        - cp_energy
        - cp_supplies
        - cp_environment
      output: "Actual supply, burn and identified species release views with once-only coverage"
      source_ids: []
    - id: freight_service
      applies_to: "freight"
      rule: "For each actual leg use net load in kg times distance in km; convert actual mass and length units before multiplication. Attribute included empty returns and provider coverage once; total attributable kg*km is expressed per reference flow."
      inputs:
        - cp_freight
        - cp_consignment
      output: "Actual kg*km per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Verify actual material/service/species identity, property and unit before final exchange binding. A candidate semantic label and verified Count support are not a flow UUID."
      evidence: "Concrete identity/detail/support evidence"
    - id: quality_grain
      applies_to: "grain ledger"
      requirement: "Preserve representative moisture sampling, scale calibration and actual stock states; resolve unexplained dry-matter residual, segregation and lot links. No universal loss, moisture, residence or aeration factor."
      evidence: "cp_grain; uncertainty and investigation records"
    - id: quality_coverage
      applies_to: "wholesale"
      requirement: "Reconcile direct, provider, freight, assets, waste-treatment and linked commodity-loss boundaries; unknowns stay explicit. Quantitative guards require independent comparable evidence, not the maximum of the batch being validated."
      evidence: "Coverage matrix and missing-data register"
    - id: quality_period
      applies_to: "wholesale"
      requirement: "Link stock, energy, assets, service handovers and actual returns/replacements/termination to all relevant periods; avoid duplication between opening/closing stock and another reporting period."
      evidence: "Period/asset/consignment trace ledger"
    - id: electricity
      applies_to: "wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Record attributable metered handling, ambient-aeration, lighting, laboratory and office electricity, including unsuccessful handling and cleaning events; exclude overlapping provider-meter coverage. Range evidence need: Metered kWh by operation interval, actual aeration/handling hours, consignment residence and all-consumer attribution are needed. An empirical kWh guardrail needs independent comparable silo climate/load/quality evidence; missing generic Energy support and supplier identity remain separate gaps. Measurement evidence: protocol cp_energy; original record basis Energy / kWh. The original amount constraint “Actual attributed electricity per reference flow; cp_energy.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_energy; actual source-linked native records"
    - id: fuel_supply
      applies_to: "wholesale"
      requirement: "Which purchased fuel grade/formulation and supply gate are on the stock record? Identify any fuel other than the named diesel case and its native unit; obtain actual density before a volume-to-mass conversion. Expand the actual fuel grade and native supply unit; upstream supply follows actual stock-adjusted supply while direct combustion follows separately measured burn. No automatic full-tank combustion. Range evidence need: Use actual grade and native litres or mass, opening/receipts/closing and matched usable returns; any density/temperature conversion needs traceable basis. The supplied-to-burn relationship requires measured burn or complete disjoint fates, not a presumed combustion fraction. Measurement evidence: protocol cp_supplies; original record basis Volume / L. The original amount constraint “Actual attributed fuel supply per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: fuel_supply_diesel_supply. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: water_supplied
      applies_to: "wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Include actual purchased cleaning and sanitary water attributable to the operation. It is not grain moisture, environmental withdrawal or water-footprint output. Range evidence need: Retain actual metered purchased volume, cleaning/sanitary purpose, service period and supplier coverage. Any per-consignment water guardrail requires the same actual cleaning scope and allocation; it does not validate grain moisture or imply direct abstraction. Measurement evidence: protocol cp_supplies; original record basis Volume / m3. The original amount constraint “Actual attributed water supplied per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: water_supplied_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: operating_supplies
      applies_to: "wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand only actual separately identified formulations, lubricants, filters and test consumables in native units; capture concentration and waste fate. No prescribed fumigant or application recipe. Range evidence need: Collect actual SKU, formulation and concentration, native unit, stock-adjusted consumption, usable returns and separately measured waste/release fates. A chemical-application or maintenance guardrail needs current actual route and product evidence; no generic fumigant dose or direct-release fraction is provided. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed operating supplies per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: operating_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: packaging
      applies_to: "wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Normally bulk dispatch; include bags, seals or other actual single-use supplies only when used. Reusable bins and pallets belong in the asset or provider ledger. Range evidence need: Actual single-use SKU counts or mass and matching net merchandise quantity, package state and usable return evidence are needed. Bulk default does not prove zero packaging; reusable units require independently evidenced lifecycle service, not full new manufacture each dispatch. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed packaging per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_services
      applies_to: "wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Expand actual laboratory, sanitation, pest-control, hired handling and administrative support results with provider-native quantity and full upstream scope. Item(s) is used only for a truly counted completed result, never hours or price converted to a count. Range evidence need: Verify each actual completed physical result, provider-native quantity and full upstream energy/material/asset/transport/treatment coverage; empirical guards need identical service scope and physical driver. Price, staff-hours or job count alone cannot fill absent provider burden. Measurement evidence: protocol cp_providers; original record basis Count / Item(s). The original amount constraint “Actual attributed provider services per reference flow; cp_providers.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_providers; actual source-linked native records"
    - id: shared_assets
      applies_to: "wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Record attributable fractions of actual silo structures, conveyors, fans, scales, vehicles, instruments and ICT assets including manufacture, maintenance, replacements and end-of-life. Do not allocate merchandise as infrastructure. Range evidence need: Require actual asset configuration, complete manufacture/maintenance/replacement/end-of-life coverage and observed plus evidenced remaining lifetime driver across all consumers. Compare per-consignment asset fractions only at compatible utilization and holding profiles; no universal silo life or allocation fraction applies. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual attributed shared assets per reference flow; cp_assets.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Expand each actual inbound, outbound, return and waste leg owned by the declared service scope; use net load and distance, and include empty-return treatment or disclosed provider coverage. Do not count an upstream delivered-price transport leg twice. Range evidence need: For each non-overlapping actual leg retain vehicle/mode, net load, load/distance units, actual route, empty-return basis and upstream scope. Any kg*km guardrail must preserve the same actual inbound/outbound/waste responsibility, consignment mass and route. Measurement evidence: protocol cp_freight; original record basis Mass*distance / kg*km. The original amount constraint “Actual attributed freight per reference flow; cp_freight.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: environmental_water
      applies_to: "wholesale"
      requirement: "Identify the actual abstraction point, water body/aquifer, location and measured source volume from intake permits/meter records. Surface water and groundwater require distinct source identities; no direct withdrawal is established by purchased water use. Expand actual water source, location and withdrawal role only if directly drawn. Purchased water is a different product input; no default direct withdrawal for an otherwise dry route. Range evidence need: Actual source, location, withdrawal volume meter, purpose and time are required if direct abstraction occurs. A missing meter or unknown source is unresolved coverage; no dry-wheat or purchased-water figure substitutes for actual direct abstraction. Measurement evidence: protocol cp_environment; original record basis Volume / m3. The original amount constraint “Actual attributed environmental water per reference flow; cp_environment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
    - id: usable_returns
      applies_to: "wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Expand unused usable supply returns by the same SKU, native unit and state as their matched input. Closing stock is not an outward return; merchandise supplier/buyer returns stay in the separate grain ledger. Range evidence need: Require the same actual SKU/state/native-unit match, external recipient and physical transfer as the supply ledger. Any mass view needs measured per-item mass or actual state conversion and is non-additive; closing stock and discarded material are not usable return quantities. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributed usable returns per reference flow; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_returns_detergent_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: waste_grain
      applies_to: "wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Record actual unusable spill, dust captured as waste and spoiled grain crossing to a documented waste receiver, with wet mass, moisture and dry-matter views. Captured dust is not an airborne emission. Rejecting a consignment is not proof that all its grain is waste. Range evidence need: Measure actual contained waste net mass and representative moisture, lot and receiving route; reconcile its dry matter against actual grain stock and linked lost-commodity demand. Do not impose historical FAO loss percentages, infer spoilage from water loss, or use captured dust as airborne-release quantity. Measurement evidence: protocol cp_grain; original record basis Mass / kg. The original amount constraint “Actual attributed waste grain per reference flow; cp_grain.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: waste_grain_atomic_case; waste_grain_captured_wheat_dust. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_grain; actual source-linked native records"
    - id: other_wastes
      applies_to: "wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Expand actual packaging waste, spent filters, oils, laboratory and cleaning wastes separately by composition, native unit and receiving route. Treatment burdens must have one owner and explicit inclusion coverage. Range evidence need: Each actual waste fraction requires composition/state, native measured amount, receiver and treatment coverage. Any per-consignment guardrail must use the actual single-use/maintenance scope; container mass, treatment invoice or safety classification alone is not actual waste composition or treatment load. Measurement evidence: protocol cp_environment; original record basis Mass / kg. The original amount constraint “Actual attributed other wastes per reference flow; cp_environment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
    - id: contained_wastewater
      applies_to: "wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Record actual collected cleaning, sanitary or other aqueous wastewater transferred to a documented receiving treatment system. Measure native received volume and actual composition; it is not a direct environmental outfall and is not inferred from purchased water volume. Identify whether provider treatment is included in this evidence checkpoint or another upstream service, with one burden owner. Range evidence need: Obtain actual collected or received wastewater volume, collection interval, aqueous state and contaminant composition/concentration basis, receiver and treatment coverage. Do not set wastewater equal to water purchased or count a separate direct outfall for the same transfer. A quantitative guardrail requires independent comparable actual cleaning/sanitary scope and unit basis. Measurement evidence: protocol cp_environment; original record basis Volume / m3. The original amount constraint “Actual attributed contained wastewater per reference flow; cp_environment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
    - id: water_outfalls
      applies_to: "wholesale"
      requirement: "Identify the direct outfall and receiving water/soil compartment, measured water amount and independently analysed pollutant species. A sewer transfer to treatment is not this outfall; the missing receiving compartment prevents a concrete elementary-flow selection. Expand only actual direct outfalls by receiving medium and quality. Wastewater sent in containment to treatment is Waste, not an elementary outfall; separately quantified pollutants must not double count carrier water. Range evidence need: Actual direct outfall volume and receiving medium, sampling interval, measured composition and treatment responsibility are needed. Do not infer pollutant mass from purchased water, sum carrier volume and pollutant mass as one flow, or treat containerized wastewater as direct discharge. Measurement evidence: protocol cp_environment; original record basis Volume / m3. The original amount constraint “Actual attributed water outfalls per reference flow; cp_environment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
    - id: species_releases
      applies_to: "wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Expand actual combustion, uncontained grain dust, refrigerant or pest-control emissions only for identified species or particle fraction and medium. Use actual measurement or compatible species-specific factors and activity, never total supply, missing stock or a safety-limit value as an emission. Range evidence need: For each actual identified species or particle fraction and medium retain measured release or compatible measured activity and species factor, with composition/fate basis and sources if applicable. Dry-matter stock residual, dust captured as waste, safety limits or total formulated supply cannot establish a species release; complete factors are applied once. Measurement evidence: protocol cp_environment; original record basis Mass / kg. The original amount constraint “Actual attributed species releases per reference flow; cp_environment.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: species_releases_co2_fossil_air; species_releases_methane_fossil_air; species_releases_nitrous_oxide_air. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "accepted_service"
    rule: "Confirm actual own-account B2B resale, unique accepted consignment, N > 0, actual mass/moisture/quality/storage time and agreed gate. Rejected/cancelled output is excluded and invoice splits cannot inflate count."
    source_ids: []
  - rule_id: validate_grain
    applies_to: "grain memorandum"
    rule: "Reconcile all grain dry-matter and water states, actual usable returns, downgrades, waste and independently identified loss; do not convert unexplained residual to an elementary emission. Record linked commodity production-only loss adjustment and its coverage once before complete-chain claims."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "all inventory rows"
    rule: "Every actual exchange has native unit, node-owned protocol and quantity/fate evidence. Expand actual provider, supply, waste and species umbrellas; missing coverage cannot be assumed absent. Direct/provider and commodity/service boundaries must not overlap."
    source_ids: []
  - rule_id: validate_assets_periods
    applies_to: "shared_assets"
    rule: "Check all asset consumers and lifecycle phases, observed plus evidenced remaining driver, maintenance/replacement/end-of-life, period linkage, idle treatment, uncertainty and one attribution view. An unsupported lifetime is a data gap."
    source_ids: []
  - rule_id: validate_species
    applies_to: "species_releases; species_releases_co2_fossil_air; species_releases_methane_fossil_air; species_releases_nitrous_oxide_air"
    rule: "Verify actual species/particle fraction, receiving medium, compatible activity and factor/composition/fate sources. Captured dust or container contents are not direct emissions; measured fuel supply is not burn; no duplication of carrier-water and species views."
    source_ids: []
  - rule_id: validate_reject_mode
    applies_to: "wholesale"
    rule: "Link each batch/campaign/period, failed attempt, cleaning/changeover, reject return and disposal to the originating lot and one owner. Internal transfers and grain returns must reconcile stock and cancellation without creating new production or multiple accepted service counts."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after concrete identity and foreground completeness review"
  downstream_use: "Wholesale-service add-on combined with separately matched commodity production and commodity-loss adjustment"
  allowed_use: "Declared own-account dry wheat wholesale consignment route with matching physical/commercial gate and actual mass/storage qualifiers"
  excluded_use: "Standalone delivered-wheat footprint; wheat cultivation or processing; all-grains average; fee agency; retail; monetary factor; a complete-chain claim without linked upstream commodity loss"
  required_metadata: "Actual consignment/lot, merchant/site, period, wheat class/grade, mass/moisture/state, ownership, buyer role, gate, residence time, transport and treatment coverage, linked commodity adjustment owner and status"
  required_quality_disclosure: "Concrete identities and unresolved gaps; sampling/measurement and stock uncertainty; shared drivers and complete asset lifecycle assumptions; omitted coverage; independent range evidence and linked loss accounting"
  update_trigger: "Changed supplier/route/gate or grain quality; new drying/processing; changed assets, provider scope, loss coverage, monitoring method, period or data-quality evidence"
data_sources:
  - id: "unsd-cpc3-wholesale-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 explanatory notes (30 June 2025), division 61 and subclass 61011. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification only: own-account wholesale is distinguished from agency and commodity production; wheat service is a narrower subset."
  - id: "fao-bulk-storage"
    type: "official_guidance"
    reference: "FAO, Agricultural engineering in development: Bulk storage. https://www.fao.org/4/t0522e/t0522e0d.htm"
    used_for: "Commercial bulk receipt/handling, silo storage monitoring and dispatch roles; qualitative route evidence, not a numeric recipe or mandatory treatment."
  - id: "fao-grain-aeration"
    type: "official_guidance"
    reference: "FAO, Grain storage techniques: Bulk storage, Aeration. https://www.fao.org/4/t1838e/T1838E1b.htm"
    used_for: "Ambient aeration and moisture/temperature monitoring; cooling and moisture changes differ. No airflow, hours, temperature or loss factor transferred as default."
  - id: "fao-wheat-storage"
    type: "official_guidance"
    reference: "T. S. Payne, Harvest and storage management of wheat, FAO Bread wheat improvement and production. https://www.fao.org/4/y4011e/y4011e0u.htm"
    used_for: "Wheat storage deterioration depends on physical, biological and technical conditions; no reported historical loss rate is a universal guardrail."
