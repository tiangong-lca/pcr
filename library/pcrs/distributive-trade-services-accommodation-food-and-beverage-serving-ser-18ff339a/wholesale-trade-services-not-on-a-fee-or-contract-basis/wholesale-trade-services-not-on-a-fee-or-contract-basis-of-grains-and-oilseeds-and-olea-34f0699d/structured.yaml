      collection_method: "Meter actual energy and measured burn; if burn is reconstructed, require a complete disjoint native-unit fate ledger with uncertainty and unknown-loss investigation. Fuel delivered is not burn. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
