      raw_fields: "site_id; node_id; period_id; consignment_id; transfer_id; mode; load_gross; tare; net_load_mass; mass_unit; distance; distance_unit; mass_conversion_factor; mass_conversion_unit; mass_conversion_source; distance_conversion_factor; distance_conversion_unit; distance_conversion_source; temperature_control_scope; empty_return_scope; cohort_driver; all_consumers_driver; driver_unit; attribution_share; provider_dataset; overlap_owner; N; load_id; leg_id; gross_basis; tare_basis; tare_source; payload_includes_cargo_pack_brine; load_each_or_total; repeated_load_count; repeated_load_count_unit; repeated_load_count_source; that_record_share; that_record_share_basis; that_record_share_source; unique_leg_check"
      collection_method: "Pair actual state-consistent loads and distances; apply evidenced unit factors and any justified shared-load share, including declared empty-return/thermal coverage only once.  Use actual packedpayload retaining merchandise water/salt/freebrine and all cargo packaging/supports. When derived from vehiclegross subtract ONLY vehicle/noncargo tare, never cargo packaging; record gross/tare basis. Unique load-leg EACH repeats actualcount once/TOTALunchanged; sum eachactual packedkg×actualkm×THAT_record_share with that leg completeallconsumer evidence INSIDE SUM, then positiveacceptedN once, alreadyattributed scope not allocated twice."
