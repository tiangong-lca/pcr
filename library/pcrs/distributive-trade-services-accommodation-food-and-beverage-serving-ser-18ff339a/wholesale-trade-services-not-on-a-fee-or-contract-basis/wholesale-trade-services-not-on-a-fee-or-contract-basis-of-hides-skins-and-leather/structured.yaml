      collection_method: "Weigh actual classified packing/loose-salt/absorbed/chemical wastes and identify real recovery/disposal receiver; separate whole-fluid/residue view from substance emissions. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
