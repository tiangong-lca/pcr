    - protocol_id: cp_releases
      process_id: "salted_hide_trade"
      flow_role: "actual direct substance/medium exchanges"
      record_type: "measurement or activity/factor/chemistry records"
      raw_fields: "site_id; node_id; period_id; consignment_id; event_id; substance; receiving_medium; actual_release; release_unit; actual_activity; activity_unit; factor; factor_unit; factor_basis; factor_source; factor_complete; composition; composition_basis; composition_source; fate; fate_basis; fate_source; uncertainty; N; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Require actual substance and medium, measured release or matched species-factor/wholefluid-composition-fate evidence. Do not multiply a complete species factor again by composition/fate, nor infer emissions from unexplained mass deficits. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kg"
      frequency: "each actual release/source event"
      temporal_coverage: "all attributed operation and cleanup periods"
      site_scope: "direct actual sources only, not provider-embedded releases"
      aggregation_rule: "per reference flow"
      quality_evidence: "Measurement or source/activity compatibility and uncertainty"
  calculation_rules:
    - id: per_consignment
      applies_to: "all inventory rows"
      rule: "Report attributed physical exchange quantity / N once; accepted_trade is 1 Item(s). N counts uniquely accepted consignments, not hide units."
      inputs:
        - "attributed quantity"
        - N
        - "linked protocol"
      output: "exchange quantity per reference flow"
      source_ids: []
    - id: allocate_period
      applies_to: "electricity; external_jobs; freight; electricity_ac"
      rule: "Multiply measured complete period quantity by cohort compatible driver / all-consumer driver; sum disjoint periods and apply per_consignment."
      inputs:
        - "period quantity"
        - "cohort driver"
        - "all-consumer driver"
        - units
        - "coverage owner"
      output: "attributed physical quantity"
      source_ids: []
    - id: asset_equivalent
      applies_to: "warehouse_assets"
      rule: "Divide cohort compatible driver by actual complete lifetime driver to obtain asset equivalents; apply per_consignment. Use one asset-equivalent or one complete per-driver service representation."
      inputs:
        - "complete asset lifecycle"
        - "cohort driver"
        - "lifetime driver"
        - units
        - history
        - "evidenced remainder"
        - termination
        - cp_assets
      output: "attributed asset equivalents"
      source_ids: []
    - id: supply_stock
      applies_to: "liquid_diesel; hygiene_preparations; packing_material; usable_supply_return; hygiene_preparations_synthetic_detergent; packing_material_pe_film"
      rule: "S = assigned opening + external net receipts - closing including recovered closing. Use gross-with-outlets S and matched unused outward return OR consumed-only S minus matched return with the matched usable-return exchange OMITTED. Retain nonburned fuel waste/spill and actual combustion as separate fates."
      inputs:
        - opening
        - "gross receipts"
        - "receipt tare"
        - "net receipts"
        - closing
        - "usable external return"
        - "chosen representation"
        - burn
        - cp_fuel
        - cp_supplies
      output: "consistent upstream supply and nonadditive usable-return view"
      source_ids: []
    - id: hide_loss_link
      applies_to: "discarded_hides; discarded_hides_atomic_case"
      rule: "Map actual discarded hide quantities to the original commodity reference gate using lot/analytical salt-moisture-state and evidenced conversion. Quantify excluded upstream loss burden in the separate commodity chain with owner and once-only integration proof; no universal wet-to-green or collagen conversion."
      inputs:
        - "source lot"
        - "upstream gate and dataset"
        - "actual hide count and compatible mass"
        - "salt moisture free brine bases"
        - "conversion quantity/unit/basis/source"
        - "loss owner and already-included scope"
        - "integration result"
        - cp_trade
      output: "quantified separate original-gate commodity loss adjustment"
      source_ids: []
  data_quality_requirements:
    - id: q_identity
      applies_to: "all exchanges"
      requirement: "Before final exchange use verify exact concrete UUID,property/unit group and actual gate; unresolved semantics and support remain explicit."
      evidence: "Detailed compatibility and support evidence"
    - id: q_condition
      applies_to: "cp_trade"
      requirement: "Differentiate actual wet-salted state and grade from fresh,dry,tanned or newly re-cured product; record inspection and scope-change disposition."
      evidence: "Intake/gate/condition and operation records"
    - id: q_quantity
      applies_to: "merchandise and fluids"
      requirement: "Use measured counts,gross/tare/drained states,composition bases and actual outlets; never equate kg saline waste to kg collagen or fresh-hide input."
      evidence: "Calibrated weighing,analyses,draining and linked supplier conversion evidence"
    - id: q_coverage
      applies_to: "all resources"
      requirement: "Complete own/provider/native-unit/full-asset-life and actual waste/environmental scope once; investigate missing records or balance differences."
      evidence: "Resource/period/receiver/lifetime reconciliation"
    - id: q_integration
      applies_to: "whole commodity chain"
      requirement: "Link original-gate saleable and lost commodity upstream burdens plus this service without duplicated resources or omitted losses. Standalone service is not a full hide footprint."
      evidence: "Quantified integration record and scope ownership"
    - id: electricity
      applies_to: "salted_hide_trade"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Meter actual lighting, ventilation, handling and any operated temperature control. An externally supplied complete operation must not also contribute the same electricity. Range evidence need: Establish actual equipment/room conditions, metered period and all-consumer allocation including idle/cleaning; neither refrigeration nor a storage energy benchmark is assumed. Measurement evidence: protocol cp_utilities; original record basis Energy / kWh. The original amount constraint “Allocated measured electricity / N; cp_utilities.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: cleaning_water
      applies_to: "salted_hide_trade"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Water is for actual floor/contact-equipment cleaning, not an invented hide washing/soaking step. Environmental abstraction requires its own source-specific elementary input. Range evidence need: Need use-resolved volume and compatible wastewater/retained/evaporation evidence with density/temperature when converting; not all liquid outlets are the same water input. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Metered attributable purchased water / N; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_water; actual source-linked native records"
    - id: hygiene_preparations
      applies_to: "salted_hide_trade"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Record SKU/formulation and actual use on premises/equipment; preservatives added to the hides would change the declared route and require scope review before final data. Range evidence need: Need native purchase unit, composition and active/carrier basis, actual dilution and measured conversion. Never assume a disinfectant, concentration, chemical fate or authorization from a historical guide. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Attributed preparation supply / N; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: hygiene_preparations_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: packing_material
      applies_to: "salted_hide_trade"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Actual wrapping/strapping/liners used in this trading operation, segregated from salt and brine accompanying the merchandise. Native-count/area/length supplies require actual expanded upstream exchanges. Range evidence need: Require actual packing identity, unit and stock/return data; only evidence-backed mass conversion is permitted and its physical view is nonadditive. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Attributed packing supply / N; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: packing_material_pe_film. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: external_jobs
      applies_to: "salted_hide_trade"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). An input represents a physically completed contracted counted service with all included resources disclosed. Noncounted transport, treatment, handling or cooling contracts require native-unit expansion. Range evidence need: Need actual completion gate, physical native unit and resource/treatment boundary. Invoice price or hours is not proof of one complete job. Measurement evidence: protocol cp_providers; original record basis Count / Item(s). The original amount constraint “Allocated completed job count / N; cp_providers.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_providers; actual source-linked native records"
    - id: warehouse_assets
      applies_to: "salted_hide_trade"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Buildings, contained-drainage equipment, racks/pallets, scales and handling plant receive their actual complete-life burden across every consuming consignment and period. Range evidence need: Need manufacture, maintenance, replacements and end-of-life plus compatible observed lifetime driver or history and evidenced remainder; no fixed depreciation age or lifetime output. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Allocated full-asset equivalents / N; cp_assets.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "salted_hide_trade"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Use actual shipment mass/state, route and mode for included legs. Commodity supplier and carrier service may already own transport; identify the unique owner including empty and temperature-control scopes. Range evidence need: Need compatible mass/distance units and factors/sources, actual tare/load basis, allocation drivers/shares and carrier full upstream coverage; no nominal truck capacity assumption. Measurement evidence: protocol cp_transport; original record basis Mass * distance / kg*km. The original amount constraint “Attributed actual kg*km / N; cp_transport.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_transport; actual source-linked native records"
    - id: usable_supply_return
      applies_to: "salted_hide_trade"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Match actual outward return of unused service supplies to original supply and receiving owner. Reusable pallet circulation and closing stock are different ledger events. Range evidence need: Need matched native identity/state/quantity and choice of gross-with-outlets or consumed-only representation; no second credit or closing-stock return. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable outward usable return / N; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_supply_return_detergent_return; usable_supply_return_pe_film_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: discarded_hides
      applies_to: "salted_hide_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Discarded damaged/decomposed or otherwise rejected hides by actual state and route. A downgraded saleable hide or supplier return is merchandise, not automatically Waste. Range evidence need: Need hide counts plus compatible as-received/drained wet mass, salt/water/free-brine evidence and original supplier gate link; do not infer collagen mass or original green-hide burden from wet waste kg. Measurement evidence: protocol cp_trade; original record basis Mass / kg. The original amount constraint “Measured attributed discarded hide mass / N; cp_trade.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: discarded_hides_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_trade; actual source-linked native records"
    - id: contained_liquids
      applies_to: "salted_hide_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Keep merchant-stage drips/leachate separate from purchased cleaning water by actual composition and collection event; expand receiving treatment-specific streams. No soaking effluent is invented. Range evidence need: Need measured volume/mass/density/temp, chloride/salt/organic state and provider gate. Direct outfalls require actual medium/water/species exchanges, not this contained-waste proxy. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Actual attributed collected aqueous waste / N; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_liquids_hide_brine; contained_liquids_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_water; actual source-linked native records"
    - id: packing_waste
      applies_to: "salted_hide_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Record actual separated liner/wrap/strap wastes and verified destination. Materials still usable for return and merchandise salt are not automatically packing waste. Range evidence need: Need material/contamination/wet state, quantity and receiving treatment coverage; collection does not establish recycling or avoided production. Measurement evidence: protocol cp_waste; original record basis Mass / kg. The original amount constraint “Measured packing waste / N; cp_waste.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: packing_waste_paper_pack; packing_waste_metal_pack; packing_waste_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_waste; actual source-linked native records"
    - id: cleanup_residues
      applies_to: "salted_hide_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Conditional floor sweepings, loose salt, absorbents and dirty contact materials with actual identity/state. Expand each receiver-compatible stream, including any actual refrigerant/chemical waste. Range evidence need: Need separate water/salt/organic/absorbent basis and actual disposal/recovery record; whole residue is not a measured substance emission. Measurement evidence: protocol cp_waste; original record basis Mass / kg. The original amount constraint “Measured attributable contained residues / N; cp_waste.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_waste; actual source-linked native records"
    - id: actual_releases
      applies_to: "salted_hide_trade"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Expand verified actual combustion, dust, wastewater/land spill, evaporation or refrigerant components by substance and medium. Odour, salinity, COD or total brine is not one concrete species identity. Range evidence need: Need actual release or compatible species factor/composition/fate with units,basis,sources,uncertainty. Unknown stock or hide mass deficits are not automatically atmospheric or aquatic emissions. Measurement evidence: protocol cp_releases; original record basis Mass / kg. The original amount constraint “Measured or supported actual-activity substance release / N; cp_releases.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: actual_releases_co2_fossil_air; actual_releases_methane_fossil_air; actual_releases_nitrous_oxide_air. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_releases; actual source-linked native records"
validation_rules:
  - rule_id: v_gate
    applies_to: "accepted_trade"
    rule: "Require actual ownership-resale to a business buyer,unique positive accepted cohort and all state/count/grade/gate qualifiers; reject pure financial,fee-agent or canceled outputs."
    source_ids: []
  - rule_id: v_state
    applies_to: "merchandise"
    rule: "Wet-salted condition,free salt/brine,incorporated salt/moisture and actual duration/environment must be known; no universal conversion,temperature or preservation claim. New curing/processing outside declared route requires reviewed scope before finalization."
    source_ids:
      - fao-hides-value-2009
      - jrc-hide-reception-2013
  - rule_id: v_units
    applies_to: "all inventory"
    rule: "All actual native units,conversions,N denominators and property supports must align; no count=kg/area,margin=service or energy property substitution."
    source_ids: []
  - rule_id: v_fates
    applies_to: "returned/rejected/liquid material"
    rule: "Prove actual origin,return/downgrade/discard/recovery and receiver,including nonreturned loss handling. Separate contained liquids from actual medium/substance releases; neither stock nor drained-hide deficit proves emissions."
    source_ids: []
  - rule_id: v_assets
    applies_to: "warehouse_assets and shared resources"
    rule: "Require whole-life manufacture,maintenance,replacement,EOL,compatible drivers and history/remainder/termination sources; close all-consumer period totals and prevent provider/asset duplication."
    source_ids: []
  - rule_id: v_chain
    applies_to: "service and commodity system"
    rule: "All traded-hide upstream production remains outside service; quantified linked original-gate loss adjustment and saleable burden must appear exactly once before complete-chain claims, with evidence for salt/moisture/state differences."
    source_ids: []
  - rule_id: v_data
    applies_to: "all concrete releases/providers"
    rule: "Missing actual substance/medium,fluid composition/fate/unit/source,provider completed physical gate or overlap owner blocks final package completeness; do not fill gaps with guessed zero or nearest UUID."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only after concrete exchange identities and actual quantities are established"
  downstream_use: "An additive physical wet-salted bovine-hide own-account wholesale service in a separately modelled compatible commodity chain"
  allowed_use: "Declared B2B ownership-resale,warehouse operation,state/grade/count/mass and period/quality stratum with limits disclosed"
  excluded_use: "Whole hide/leather footprint by itself; animal/slaughter/curing/tanning process; fresh,dry or non-bovine product; retail or fee agency; monetary margin dataset"
  required_metadata: "All reference qualifiers; upstream curing/commodity gate; positive N; physical merchandise/salt/moisture stock and loss linkage; room/resource/provider/transport/receiver scope; complete asset lifetime"
  required_quality_disclosure: "Unresolved exact flows/support,conditional actual expansions,measurement/analysis/conversion uncertainties,Range needs,provider/life/period scope and separate commodity-loss integration state"
  update_trigger: "Changed preservation state or actual operation,condition/grade/salt-moisture basis,asset use/life,resource or provider/transport/treatment scope,loss conversion or acceptance gate"
data_sources:
  - id: "unsd-cpc3-wholesale-2025"
    type: "official_guidance"
    reference: "UNSD. CPC Version3.0 explanatory notes, division61; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification of own-account B2B wholesale only, not resource or emission defaults."
  - id: "fao-hides-value-2009"
    type: "official_guidance"
    reference: "Leach,I.; Wilson,R.T. (2009). Higher value addition through hides and skins. FAO Diversification booklet8, preservation and marketing chapters; https://www.fao.org/4/i0523e/i0523e.pdf"
    used_for: "Differences among preserved states,merchant storage/sale and condition/quantity questions only; no historical numerical prescription or financial-to-physical factor."
  - id: "jrc-hide-reception-2013"
    type: "official_guidance"
    reference: "Black,M. et al. (2013). BAT Reference Document for the Tanning of Hides and Skins, EUR26130EN, sections2.1–2.2; https://eippcb.jrc.ec.europa.eu/sites/default/files/2019-11/TAN_Published_def.pdf"
    used_for: "Reception/sorting/storage versus curing/soaking/fleshing process boundaries; as-received pallet storage conditions depend on curing state. Tannery context, not automatic wholesale legal/BAT compliance."
