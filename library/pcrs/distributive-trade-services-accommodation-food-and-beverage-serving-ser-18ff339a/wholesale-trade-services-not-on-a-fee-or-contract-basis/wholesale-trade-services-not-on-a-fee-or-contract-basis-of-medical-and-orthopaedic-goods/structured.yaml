validation_rules:
  - rule_id: final_gate
    applies_to: "actual declared route"
    rule: "N counts unique FINAL actual commercial acceptances after source-verified ownership purchase/resale,B2B buyer and linked reversals;not receipt,device/primary-pack/carton count or currency. Canceled/reversed/unfinished/failed duties retain actual resource period/cohort attribution;N=0 no division. Rejected/unresolved goods are not accepted reference output."
