        - "actual job/cohort equivalence"
        - "alluser used/history/remaining/termination/full-life driver native units/bases/method/state/time/source"
        - cp_assets
      output: "complete attributed resources/assets"
      source_ids: []
    - id: freight_record_sum
      applies_to: "packed_freight"
      rule: "Sum over unique load_id+leg_id [(converted actual packed payload kg)*(actual sourced repeatcount ONLY if EACH,otherwise 1)*(converted actual distance km)*(THAT record actual causal share)] / positive N. TOTAL unchanged,N once. Payload is actual direct cargo measurement OR compatible gross-evidenced vehicle/noncargo tare;retain shipped device/barrier/carton/cargo supports. Each gross/tare/payload/count/distance has independent native unit/basis/method/state/time/source and conversion factor/unit/source. Per-record share from actual compatible cohort/alluser drivers stays INSIDE summand;parent/child/BOM content not repeated cargo."
      inputs:
        - "unique load/leg"
        - "EACH/TOTAL/count"
        - "gross/tare/direct payload"
        - "shipped barrier/carton/support"
        - "distance/conversions"
        - "THAT-record driver/share"
        - N
        - cp_freight
      output: "kg*km per reference service"
      source_ids: []
