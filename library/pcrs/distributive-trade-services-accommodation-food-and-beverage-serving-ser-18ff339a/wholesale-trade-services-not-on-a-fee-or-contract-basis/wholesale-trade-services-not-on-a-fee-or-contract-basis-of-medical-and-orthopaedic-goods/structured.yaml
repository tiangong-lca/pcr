  - rule_id: actual_device_basis
    applies_to: "actual declared route"
    rule: "Verify unfilled/no-needle/singleuse/threepiece PP model and complete native BOM/mass/count hierarchy/barrier/expiry condition records. Capacity is a qualifier,not filled fluid. Source sterile status does not prove clinical usability after breach/expiry or require merchant testing."
