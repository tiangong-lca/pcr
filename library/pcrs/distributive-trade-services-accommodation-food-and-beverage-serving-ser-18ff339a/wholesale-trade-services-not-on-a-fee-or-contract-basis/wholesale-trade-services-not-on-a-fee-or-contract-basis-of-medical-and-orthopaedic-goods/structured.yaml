  calculation_rules:
    - id: normalize
      applies_to: "all exchanges"
      rule: "Actual attributed quantity / positive unique FINAL N once;accepted_service is 1 Item(s). N is source-verified ownership/resale business acceptance after reversals,not supplier receipt. Unfinished/reversed/failed resource events retain actual period/cohort responsibilities;N=0 do not divide."
      inputs:
        - "actual attributed native quantities"
        - N
        - protocol
      output: "quantity per reference flow"
      source_ids: []
    - id: unit_hierarchy_net_mass
      applies_to: "nonexchange device audit"
      rule: "Count unique device units through actual parent primary-pack/shelfpack/carton/case links using source-verified factors with units/bases/methods/sources;use EACH*actualcount once OR TOTAL unchanged,never sum parent and child as extra devices. Net complete device mass=actual packed gross-primary barrier tare-secondary/tertiary shipping tare on compatible native bases,including actual barrel/plunger/stopper/lube/ink/included accessories. Independent component/BOM views do not add to whole mass. Source or representative measurement may preserve unopened packs;no merchant opening is prescribed. Nominal mL capacity/dead space is not water/drug/air inventory or filled mass."
      inputs:
        - "actual parent/child unit IDs"
        - "native count/factors"
        - "gross/barrier/carton tare/net device and actual BOM/sample/state/units/methods/sources"
        - "nominalcapacity source"
        - cp_devices
      output: "unique native device count and complete-product netmass audit"
      source_ids: []
    - id: original_gate_assignment
      applies_to: "commodity outside service"
      rule: "Actual assigned original-gate quantity is directly traced/measured with native evidence OR original quantity*compatible cohort driver/positive COMPLETE all-terminal driver sum. Every competing accepted transfer,closing/unsold/damaged retained,useful other exit,return,actual whole/part/mixed/liquid loss has native qty/unit/basis/method/state/time/source,owner,original cohort/period/conversion/exclusivity and numerator link. No accepted-only denominator or intermediate movement twice. Match original finished sterile complete-device/pack state,actual total demand,compatible baseline-covered and additional uncovered demand/coverage owner;integrate missing demand/loss outside once,never unrelated coverage or negative mismatch credit."
      inputs:
        - "original/assigned/loss/baseline-covered/additional native quantity-unit-basis-method-state-time-source"
        - "direct trace OR positive complete allterminal cohort drivers"
        - "conversion/coverage/owner/integration"
        - cp_devices
      output: "complete sterile-device source demand/loss outsideonce"
      source_ids: []
    - id: inherited_constituent_balance
      applies_to: "actual inherited species audit"
      rule: "For each actual inherited source constituent/species on compatible units/state/basis,source quantity=retained accepted+retained returned+retained closing+retained inside whole-unit Waste+retained inside part Waste+retained inside mixed Waste+actual independent useful export+actual independent contained export+actual independent liquid export+actual direct release+explicit unresolved discrepancy. Every term has its own native unit,basis,method,state,time,source/conversion and exclusive transfer key;returned source is not a second receipt if already in cohort. Retained contents are nonadditive audits of their product/waste carrier,not extra physical exchanges;do not force discrepancy to atmosphere or infer factor from sterile/ETO label. Receiver treatment/emissions once."
      inputs:
        - "actual source species/quantity"
        - "retained accepted/return/closing/whole-part-mixedwaste"
        - "independent useful/contained/liquid/direct"
        - "native units/bases/methods/state/time/sources/exclusions"
        - cp_devices
        - cp_fates
        - cp_water
        - cp_species
      output: "closed actual inherited content audit,unknowns remain explicit"
      source_ids: []
    - id: supply_stock
      applies_to: "independent supplies"
      rule: "S=assigned opening+true external net receipts-closing including recovered retained independent supplies. Choose gross INPUT S plus separate matched same-scope unused external OUTPUT OR consumed INPUT S-return omitting that OUTPUT. No numerical S+return,double credit,recovery as new receipt or deletion of nonreturned spill/waste supply burden. Inherited device contents/packaging never net unrelated service supplies."
      inputs:
        - opening
        - "actual external net receipts"
        - "recovered closing"
        - "matched unused same-scope outward"
        - "chosen representation"
        - cp_supplies
      output: "nonduplicated supplied/returned amounts"
      source_ids: []
    - id: full_lifetime_share
      applies_to: "assets and resources"
      rule: "Actual resource attribution uses compatible cohort/all-user physical drivers. Asset equivalent=actual compatible job/cohort used driver/complete all-user all-period lifetime driver,with observed-history+sourced remaining use or termination. Native unit/basis/method/state/time/source and conversion for each operand;manufacture/maintenance-cleaning/replacements/EOL,uncertainty/sensitivity/update complete. Provider full coverage replaces matching own burden."
