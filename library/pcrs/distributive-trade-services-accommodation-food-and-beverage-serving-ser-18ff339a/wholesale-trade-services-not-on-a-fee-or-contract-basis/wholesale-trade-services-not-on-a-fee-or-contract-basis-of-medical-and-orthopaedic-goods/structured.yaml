    rule: "Actual assigned original-gate quantity is directly traced/measured with native evidence OR original quantity*compatible cohort driver/positive COMPLETE all-terminal driver sum. Every competing accepted transfer,closing/unsold/damaged retained,useful other exit,return,actual whole/part/mixed/liquid loss has native qty/unit/basis/method/state/time/source,owner,original cohort/period/conversion/exclusivity and numerator link. No accepted-only denominator or intermediate movement twice. Match original finished sterile complete-device/pack state,actual total demand,compatible baseline-covered and additional uncovered demand/coverage owner;integrate missing demand/loss outside once,never unrelated coverage or negative mismatch credit."
    source_ids: []
  - rule_id: independent_supply_stock
    applies_to: "actual declared route"
    rule: "S=assigned opening+true external net receipts-closing including recovered retained independent supplies. Choose gross INPUT S plus separate matched same-scope unused external OUTPUT OR consumed INPUT S-return omitting that OUTPUT. No numerical S+return,double credit,recovery as new receipt or deletion of nonreturned spill/waste supply burden. Inherited device contents/packaging never net unrelated service supplies."
    source_ids: []
  - rule_id: all_user_lifetime
    applies_to: "actual declared route"
    rule: "Actual resource attribution uses compatible cohort/all-user physical drivers. Asset equivalent=actual compatible job/cohort used driver/complete all-user all-period lifetime driver,with observed-history+sourced remaining use or termination. Native unit/basis/method/state/time/source and conversion for each operand;manufacture/maintenance-cleaning/replacements/EOL,uncertainty/sensitivity/update complete. Provider full coverage replaces matching own burden."
    source_ids: []
  - rule_id: physical_fates
    applies_to: "actual declared route"
    rule: "Useful intact devices/returns remain nonexchange merchandise;actual separate useful material,whole units,parts,packaging,mixed cleanup solids,free liquid and direct species require exclusive real decisions/receivers. Whole/part/mixed waste retains actual components/lubricant/residual/packing as nonadditive content audits,not another waste/chemical exchange. Retained inherited quantities follow accepted/returned/closing/whole-part-mixed waste or actual independent transfers;unknowns do not vent by default. No automatic infected sharps classification or recycling/substitution credit."
    source_ids: []
  - rule_id: source_scope_normalization
    applies_to: "nonexchange commodity and service combination"
    rule: "Keep original external commodity stock, source assignment/loss and missing-stage/additional upstream integration quantities in their evidenced RAW actual scope. Identify whether each amount is one actual consignment, a target service cohort, or ALREADY per reference,with source/target scope IDs and quantity basis. The physical source-cohort all-exit denominator assigns RAW quantity to that target scope; it is not automatically the target accepted-service N. Only when combining that same target-scope commodity amount with the 1 Item(s) service derive amount per reference = RAW assigned amount / positive unique accepted source_same_scope_N,with acceptance IDs/time/reversal evidence. A proved single-case scope has source_same_scope_N=1; an already-per-reference amount is not divided again. Preserve raw integration quantities and source links; do not shrink actual upstream remediation or divide the whole source cohort by an unrelated N. N0 responsibility remains disclosed without division."
    source_ids: []
