      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Actual lifting,lighting,records and attributable idle/housekeeping;sterile labelling does not create a merchant sterilizer,aerator,cleanroom or operated climate system. Clinical device force/leakage tests are not warehouse energy. Range evidence need: Need actual equipment/meter/provider time boundaries and physical all-user shares. No capacity/sterility/expiry-to-energy factor. Measurement evidence: protocol cp_power; original record basis Energy / kWh. The original amount constraint “Assigned actual measured native quantity / N; cp_power.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: warehouse_electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
