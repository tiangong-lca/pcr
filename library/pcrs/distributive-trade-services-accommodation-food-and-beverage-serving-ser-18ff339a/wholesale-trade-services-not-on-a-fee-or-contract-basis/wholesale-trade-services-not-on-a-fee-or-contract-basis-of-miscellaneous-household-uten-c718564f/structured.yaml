  calculation_rules:
    - id: accepted_consignment
      applies_to: "accepted_service"
      rule: "N=count unique final accepted_consignment_ids at reference_gate_id; accepted_service=1 Item(s)."
      inputs:
        - cp_plate
      output: "One actual complete commercial service with finishedplate/pack/state/gate qualifiers"
      source_ids: []
    - id: plate_pack_audit
      applies_to: "non-exchange commodity"
      rule: "net_plate_mass=gross_quantity-separator_tare-primary_wrap_tare-carton_tare-transported_support_tare on matching actual native boundaries. Platepiece count and stack/carton membership real; no shard-to-plate count or manufacturer packaging mass=net plate inference. Body/glaze/component analyses do not add again to wholeplate."
      inputs:
        - cp_plate
      output: "Actual plate body+glaze/net/tare and count-state audit"
      source_ids: []
    - id: original_gate_demand
      applies_to: "non-exchange original commodity"
      rule: "assigned_source_gate_quantity=direct_assignment_quantity only with evidenced source-to-target link and compatible source state/unit, OR cohort_source_quantity*target_exit_driver/sum_exit_drivers after compatible sourced native conversions and complete mutually exclusive all_exit_driver_records. Denominator includes other useful exits/returns/closing/actual loss routes, not only accepted output; driver-equivalence to original plate state supported, never shard count. commodity_source_gate_demand=assigned_source_gate_quantity/N outside service; actual compatible loss_adjustment_quantity/unit/basis/source/owner and already_included_loss_coverage reconcile once without double allocation."
      inputs:
        - cp_plate
        - N
      output: "Actual complete factorygate assigned demand and compatible upstream loss once"
      source_ids: []
    - id: new_supply_stock
      applies_to: "service new supplies and unused returns"
      rule: "S=opening_supply+net_receipts-closing_supply; net_receipts=gross_receipts-receipt_tare. Gross S/N with separate matched usable_outward_return/N OR consumed-only (S-usable_outward_return)/N omitting matching return exchange. Retained recovery in closing, actual same-scope/native conversion sources required."
      inputs:
        - cp_supplies
        - N
      output: "Actual service supply and selected unused-return convention per reference flow"
      source_ids: []
    - id: meter_attribution
      applies_to: "electricity; cleaning_water; electricity_ac; cleaning_water_liquid_tap"
      rule: "actual_meter_quantity=closing_reading-opening_reading on actual import/export direction OR matched direct_submeter_quantity; attributable_quantity=(actual_meter_quantity*consumer_driver/total_driver)/N for disjoint all-user periods including idle/hygiene/failed/open resources."
      inputs:
        - cp_utilities
        - N
      output: "Actual warehouse purchased utility quantity per reference flow"
      source_ids: []
    - id: physical_provider
      applies_to: "provider_packages"
      rule: "provider_quantity=native_quantity*equivalent_conversion/N only for actual matching completed physical package and complete resource ownership once."
      inputs:
        - cp_provider
        - N
      output: "Actual equivalent completed package quantity per reference flow"
      source_ids: []
    - id: asset_equivalent
      applies_to: "shared_assets"
      rule: "asset_equivalent=(job_driver/life_driver)/N; life_driver=observed_driver+remaining_driver in compatible native units with all-user full lifecycle/history+sourced remainder/real replacements/EOL, one view/no double normalization."
      inputs:
        - cp_assets
        - N
      output: "Actual complete asset-equivalent share per reference flow"
      source_ids: []
    - id: whole_load_freight
      applies_to: "freight"
      rule: "whole_payload_mass=plate_payload_mass+inherited_separator_pack_mass+inherited_carton_mass+added_pack_mass+transported_support_mass on real exclusive components; freight_work=whole_payload_mass*route_distance*load_share/N after native conversions/exclusive return-empty coverage."
      inputs:
        - cp_freight
        - N
      output: "Actual packed-plate complete-load freight work per reference flow"
      source_ids: []
    - id: contained_outlets
      applies_to: "actual waste outlets"
      rule: "plate_waste=actual_discard_stream_mass/N on actual whole/chipped plate plus transferred pack scope. Other outlet_quantity=(gross_quantity-tare_quantity)/N in actual native stream unit OR volume/N with source-backed density-temperature conversion. Wholeplate/fragments/pack/mixedcleanup/liquid and component analyses nonduplicate; retained stocks/internal moves not exports, treatment once."
      inputs:
        - cp_plate
        - cp_outlets
        - N
      output: "Actual exclusive receiver streams/state and quantities per reference flow"
      source_ids: []
    - id: species_mass
      applies_to: "direct_species"
      rule: "species_mass=measured_mass/N OR activity*species_factor/N OR measured_whole_stream_release*composition*fate/N after compatible source-backed native conversion; choose one. factor_complete prevents extra composition/fate, whole-stream/species outputs not duplicated."
      inputs:
        - cp_environment
        - N
      output: "Actual direct species mass with receiving medium per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: finished_plate_gate
      applies_to: "received/accepted goods"
      requirement: "Actual finished fired/glazed feldspar porcelain SKU/size/lot, source packing/count/net-tare and condition/buyer criteria; no raw-mineral baseline/page packaged weight as net plate or consumer care/safety default."
      evidence: "cp_plate actual source/SKU/measurement/buyer records"
    - id: source_cohort_fates
      applies_to: "commodity and actual exits"
      requirement: "Actual source quantities/state/unit, direct assignment or compatible cohort all-exit native drivers incl useful other exits and exclusive original-state equivalence. Real chipping/breakage/whole-fragment genealogy/receiver and loss owner/existing coverage; unknown residual not default waste/species/zero."
      evidence: "Actual complete source/exit mapping/stock/disposition and quantified commodity link"
    - id: complete_physical_scope
      applies_to: "service resources and periods"
      requirement: "Real all-user native drivers/source periods, complete providers/full-life assets observed+sourced remainder/replacements/EOL/uncertainty, direct/carrier/receiver scope incl hygiene/failed/open work once."
      evidence: "Source meters/supplies/driver/provider/asset/carrier/treatment records"
    - id: concrete_identity_ranges
      applies_to: "actual expanded rows"
      requirement: "Verify actual product/provider/asset/fragment/waste/species/native property-unit before finaldata; empirical quantitative bounds need comparable evidence, not marketing strength/lifetime."
      evidence: "Actual detail/support/receiver and range applicability evidence"
    - id: electricity
      applies_to: "ambient_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Actual electric logistics/charging, lighting, records, ordinary ventilation and surface-cleaning equipment in ambient plate wholesale. No forming/firing/glaze kiln, merchant dishwasher, sterilizer or dedicated climate intervention; actual additional processing requires review. No onsite combustion in the declared route. Range evidence need: Actual source meters/equipment charging scope/all-user causal periods including idle/hygiene/open work required; no kiln energy, dishwasher cycle or default electric handling hours per carton. Measurement evidence: protocol cp_utilities; original record basis Energy / kWh. The original amount constraint “Actual attributable purchased warehouse electricity per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: cleaning_water
      applies_to: "ambient_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Only real externally supplied water for warehouse floors/equipment/actual incident cleanup with source/treatment scope. Plates are not routinely washed/sanitized or tested for food contact in this route. Actual liquid collection and recirculation/make-up recorded independently. Range evidence need: Real meters/events/source and allocations needed; no consumer first-use wash, plate rinse ratio or purchased water=effluent assumption. Measurement evidence: protocol cp_utilities; original record basis Volume / m3. The original amount constraint “Actual attributable purchased surface-cleaning water per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: hygiene_supplies
      applies_to: "ambient_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Actual named agents, wipes/absorbents or other mass-measured service products used on warehouse surfaces or real breakage incidents. No ceramic glaze/repair adhesive/food-contact test chemical, routine plate detergent or universal spill-kit prescribed. Actual clean product mass and contaminated spent stream distinct. Range evidence need: Need actual SKU/formulation/unit/native receipts/stocks/use/unused-return and composition/fate sources; no cleaning recipe, fracture-response dosage or agent-to-emission fraction. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable new cleaning/containment supply mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: hygiene_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: added_packing
      applies_to: "ambient_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Actual merchant-added outer boxes/straps/protective supports only, with defined unit/material and actual per-piece mass if converted. Inherited factory cartons, plate separators, sleeves/labels remain commodity audit, not new supply on resale. No routine plate unpack/repack; reusable pallets/bins are lifecycle assets. Range evidence need: Actual added unit/material/native stock/unused return needed; no default plates per carton/separator weight, new bag per plate or universal protective-pack regimen. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “Actual attributable new outer transit units per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: added_packing_paperboard_carton. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
