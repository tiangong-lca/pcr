      raw_fields: "site_id; cohort_id; event_id; period_id; stream_id; source_lot_id; parent_plate_id; fragment_parent_link; material_identity; stream_state; classification; gross_quantity; tare_quantity; net_quantity; quantity_unit; quantity_source; whole_plate_exclusion; transferred_pack_exclusion; separate_fragment_exclusion; composition; composition_basis; composition_source; retained_component_quantity; retained_component_unit; retained_component_basis; retained_component_method; retained_component_source; retained_component_sample_time; retained_fluid; retained_fluid_unit; retained_fluid_basis; retained_fluid_source; density; density_unit; density_temperature; density_temperature_unit; density_source; volume; volume_unit; conversion; conversion_unit; conversion_source; pollutant_load; pollutant_unit; load_source; collection_method; receiver; transfer_id; receiver_acceptance; treatment_route; treatment_scope; provider_coverage; direct_release_exclusion; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero; flow_row_id; actual_identity_case; actual_substance_or_material; actual_state_and_gate; case_activation_evidence; quantity_exclusion_links; whole_total_reconciliation"
      collection_method: "Measure actual collected fragment, separated pack, mixed hygiene or cleaning liquid in its real native state with source/parent/transfer identity. Wholeplate/body/glaze/retained component/fluid nonadditive; exclude already transferred whole/chipped plates or other streams. Actual component method/source/sampletime and unit/basis explicit. Receiver classification/acceptance/treatment once; no fracture-driven emission or wash-sludge default. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero. Attribute only the individually identified physical case; retain other source-linked actual fates separately. Each native record belongs to exactly one exchange and any whole total is a non-additive audit."
      unit: "kg; m3; actual native component/stream units"
