    - id: unused_mass_returns
      applies_to: "ambient_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Real unconsumed external service-supply return with exact product/state/net mass and original standalone input scope. Commercial intact/chipped plate returns remain commodity ledger, not negative cleaning supply or service. Spent contaminated material is waste. Range evidence need: Actual product/native quantity/original supply pairing/receiver needed; no credit against unrelated supplies/inherited commodity packing. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable unused mass supply returned per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: unused_mass_returns_detergent_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
