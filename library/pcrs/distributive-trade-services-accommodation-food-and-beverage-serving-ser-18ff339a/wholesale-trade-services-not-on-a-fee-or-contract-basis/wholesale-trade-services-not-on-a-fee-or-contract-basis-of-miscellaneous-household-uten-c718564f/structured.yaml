      applies_to: "ambient_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Real warehouse/racks/electric handling/reusable bins/pallets/scales/monitoring use one matching complete whole-asset equivalent. Include manufacture/maintenance/actual replacement/retirement/EOL across all consumers and periods. No new pallet per turn, no simultaneous rent/driver-service and wholeasset coverage. Range evidence need: Need actual asset identity/native job/life driver units/all-users/observed history/sourced remaining driver and uncertainty/sensitivity/update; no universal rack lifetime or support turns. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual attributable complete asset-equivalent shares per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
