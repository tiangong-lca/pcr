      collection_method: "Collect actual completed physical package/native equivalent and full resource result scope. Direct/provider/carrier/asset/receiver responsibilities exclusive; actual plate wash/food-contact test/glaze/repair/repack is separately reviewed processing, not hidden inside package."
      unit: "Item(s) equivalent or actual appropriately expanded native unit"
      frequency: "each real completed package"
