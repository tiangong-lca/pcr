t_assignment_quantity; direct_assignment_unit; direct_assignment_source; allocation_cohort_id; cohort_source_quantity; cohort_source_unit; cohort_source_state; cohort_source_record; target_exit_driver; sum_exit_drivers; exit_driver_unit; exit_driver_basis; exit_driver_source; all_exit_ids; all_exit_driver_records; exit_original_plate_equivalent; exit_equivalence_unit; exit_equivalence_source; assigned_source_gate_quantity; assigned_source_gate_unit; assigned_source_gate_state; source_gate_allocation_basis; source_gate_allocation_source; source_gate_conversion; source_gate_conversion_unit; source_gate_conversion_source; exclusive_other_exit_coverage; loss_adjustment_id; loss_adjustment_quantity; loss_adjustment_unit; loss_adjustment_basis; loss_adjustment_source; loss_owner; already_included_loss_coverage; commodity_overlap_check; buyer_signature; calibration; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_state_and_gate; case_activation_evidence; quantity_exclusion_links; whole_total_reconciliation"
      collection_method: "Join actual finished fired/glazed supplier release to SKU/size/lot, inherited stack/carton/separator membership, net plate body+glaze vs tare and adopted buyer condition criteria, using actual non-invasive or traceable representative supplier records. Count final unique commercial N, not plate/shard/carton. Reconcile actual stock/returns/closing/useful other exits/breakage/receiver with parentplate genealogy and unknown differences investigated. Map actual source demand via evidenced direct source assignment OR compatible complete-cohort all-exit native drivers, not accepted-only/shard denominator. Actual compatible loss owner/existing coverage once outside service. Attribute only the individually identified physical case; retain other source-linked actual fates separately. Each native record belongs to exactly one exchange and any whole total is a non-additive audit."
      unit: "Item(s); actual plate pieces/kg and compatible source/exit native units"
      frequency: "each real receipt/check/movement/reject/breakage/acceptance/stocktake/source-allocation review"
      temporal_coverage: "Supplier finished release through acceptance plus prior/later stocks/other exits/failed/open cohorts"
      site_scope: "One actual merchant and independent complete commodity/buyer/all-exit ownership gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual SKU/size/glaze/source/net/tare/calibration/buyer/condition and all-exit assignment/equivalence/disposition evidence"
    - protocol_id: cp_supplies
