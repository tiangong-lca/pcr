    - id: freight
      applies_to: "ambient_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Actual agreed inbound/outbound/return transport includes fired/glazed plate mass plus inherited separators/cartons, added packing and transported support. Manufacturer package-listed weight is not proved net plate; actual component boundaries prevent double load. Carrier energy/assets and empty/multi-drop/return scope owned once. Range evidence need: Real as-transported component masses, actual distance/disjoint load share/native conversion evidence required; no product-page weight as universal net plate, standard stack or road distance. Measurement evidence: protocol cp_freight; original record basis mass*distance / kg*km. The original amount constraint “Actual attributable complete-load freight work per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
