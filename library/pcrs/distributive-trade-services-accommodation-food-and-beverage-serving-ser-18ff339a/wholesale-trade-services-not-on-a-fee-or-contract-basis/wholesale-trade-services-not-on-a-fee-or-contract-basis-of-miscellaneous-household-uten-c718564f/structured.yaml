      collection_method: "Identify actual species/particle/medium and select measured species mass OR justified matched activity/factor OR measured whole-stream composition/fate with native source conversions. Complete factor not multiplied by composition/fate again. Raw/body/glaze composition, chipping/fracture/stock difference or captured fragments alone do not establish direct release or its absence. Actual species, receiving medium and release evidence are required; do not assume zero."
      unit: "kg species; actual activity/whole-stream/concentration native units"
      frequency: "each actual direct release or justified matched monitoring interval"
      temporal_coverage: "Actual direct period/evidence applicability, no stock-residual proxy"
      site_scope: "Named actual direct environmental interface excluding contained receiver treatment"
      aggregation_rule: "per reference flow"
