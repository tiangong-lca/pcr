      collection_method: "Identify actual full assets matching manufacture/maintenance/real replacements/retirement/EOL. All-user observed history+sourced remaining driver with compatible job/life units and uncertainty/sensitivity/update, direct/provider/carrier overlap once. No everyturn new support or duplicate rent/driver-service/wholeasset view."
      unit: "Item(s) equivalent; actual compatible lifetime/job driver units"
      frequency: "each actual asset period/maintenance/replacement/retirement review"
      temporal_coverage: "Full manufacture-to-EOL all users/periods/history+sourced remainder"
