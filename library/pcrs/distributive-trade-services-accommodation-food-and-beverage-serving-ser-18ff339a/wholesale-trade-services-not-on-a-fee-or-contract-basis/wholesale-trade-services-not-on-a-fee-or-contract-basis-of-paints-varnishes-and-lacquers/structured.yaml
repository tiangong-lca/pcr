    - id: wet_fill_mass
      applies_to: "nonexchange merchandise"
      rule: "paint_wet_mass=actual_compatible_net_paint_volume*actual_paint_density after native unit conversion on matching formulation/state/temperature basis. Label capacity/headspace envelope and gross sealed-pail mass are not net paint volume or mass; gross-minus-tare needs actual other-content/headspace scope."
