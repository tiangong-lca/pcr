    rule: "Index actual SKU/batch/color/base/pail/consignment and physical event IDs by period: opening/receipts/closing, real useful returns/other terminal exits/retained rejects/actual spills-leaks-loss and receiver route. Verify ownership purchase/resale, B2B buyer and final gate/source/reversals. N only final unique actual acceptance after reversals; N>0 needed to divide. Canceled/open/rejected/reversed resources keep cohort/period attribution, no invented reference or zero resources. Internal/recovered closing stock not export."
    source_ids: []
  - rule_id: original_source_assignment
    applies_to: "foreground_burden_allocation"
    rule: "Use evidenced direct source-to-target mapping OR complete compatible source cohort: assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers. Complete actual positive denominator includes every terminal driver quantity/unit/basis/method/state/source/link/owner: closing, useful other exits, returns and actual spilled/leaked/lost merchandise. Compatible original filled-paint/pail equivalence and conversion explicit; no accepted-only denominator or residual=loss."
    source_ids: []
  - rule_id: original_commodity_demand
    applies_to: "foreground_burden_allocation"
    rule: "commodity_source_gate_demand=assigned_source_gate_quantity at actual complete original formulation+filled sealed pack state, including evidenced state-change share. Original input/assigned/baseline/additional stage quantities each need native unit/state/basis/method/source and actual conversion. Exclusive real loss adjustment/native unit/basis/source/owner and baseline stage/loss coverage reconcile once outside service. Final dispatch+discard not original demand; no incomplete rawcomponent baseline.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: supplies_and_returns
    applies_to: "foreground_burden_allocation"
    rule: "S=opening+net_receipts-closing includes retained usable recovery. Gross S/N input plus separate real matched unused outward return OR consumed-only (S-usable_outward_return)/N input and OMIT same paired output. Same standalone independently burdened supply scope/identity only; never net inherited paint/pail/headspace or asset against unrelated current input and never second credit."
    source_ids: []
  - rule_id: all_consumer_attribution
    applies_to: "foreground_burden_allocation"
    rule: "Actual direct meters or causal same-unit native service/all-user physical drivers across all users/periods incl relevant idle/hygiene/open attempts. Each actual share numerator/denominator/basis/method/source and uncertainty retained. Pail-count/mass/equal-consignment split needs causal evidence; prices/margins no physical share."
    source_ids: []
  - rule_id: full_asset_lifecycle
    applies_to: "foreground_burden_allocation"
    rule: "Matched complete manufacture/actual maintenance/replacement/retirement/EOL lifecycle uses compatible all-user job, observed history, sourced remainder and lifetime driver units/bases/methods/sources/equivalence/uncertainty/sensitivity/update. Allocate job_driver/lifetime_all_user_driver then /N once; supplier/provider/carrier/merchant asset ownership exclusive, no per-turn new pallet/full duplicate rent."
    source_ids: []
  - rule_id: unique_load_leg_and_owner
    applies_to: "foreground_burden_allocation"
    rule: "One owner for direct/provider/carrier/asset/receiver treatment events. Freight SUM over unique load+leg records retains each record actual transport work*its documented service share INSIDE sum, then /N once. EACH cargo counted once/TOTAL unchanged; actual filled-pail/pack/support/headspace cargo retained, subtract only noncargo tare. Whole/component/cleanup/liquid/species and treatment views nonadditive; no default credit."
    source_ids: []
