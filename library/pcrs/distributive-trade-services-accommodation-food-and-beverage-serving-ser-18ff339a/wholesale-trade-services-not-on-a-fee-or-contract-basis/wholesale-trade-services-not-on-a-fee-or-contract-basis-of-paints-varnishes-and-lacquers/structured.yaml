measurement_rules:
  - id: commercial_count
    applies_to: "accepted_service"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "Item(s)"
    rule: "N is unique FINAL actual merchant-owned/resold B2B consignment acceptance after reversals. Collect merchant/ownership-purchase-resale evidence/business buyer/actual gate/source/reversal IDs; supplier receipt alone is insufficient. Normalize only with N>0 and final evidence; otherwise retain event resources without fictitious reference/division."
  - id: wet_paint_volume_mass
    applies_to: "merchandise audit"
    required_property_ref:
      name: "Mass;Volume;Count"
      uuid: ""
    required_unit: "kg;actual native volume;Item(s)"
    rule: "Paint net wet mass is distinct from label capacity, pail/headspace envelope and whole sealed-pail mass. Wet mass=actual compatible net paint volume*actual formulation/state density using native-unit conversion and density temperature-unit/method/source/sampletime. Gross-minus-tare alone needs explicit retained headspace/other-content scope; do not default their mass to zero or equate net fill volume with capacity."
  - id: solids_water_basis
    applies_to: "paint and component audits"
    required_property_ref:
      name: "Mass;Volume;actual composition"
      uuid: ""
    required_unit: "kg;native volume;explicit mass-or-volume fraction"
    rule: "Keep solids VOLUME fraction versus MASS fraction, sample/formulation/color/base/method/state/source and units distinct. Volume solids cannot multiply wet mass to obtain dry solids; compatible measured mass solids may do so. Water is separately evidenced; 1-solids is not automatically pure water because other volatiles/components may exist. No application/dry-film output is created."
  - id: extent_components_cargo
    applies_to: "all physical quantities"
    required_property_ref:
      name: "Mass;Volume;Count"
      uuid: ""
    required_unit: "native quantities and target units"
    rule: "Every operand retains native unit/basis/method/state/source/sampletime and conversion-unit/source; density adds temperature-unit/source. EACH multiplies matching actual count once, TOTAL remains total. Whole paint/pail/pack/headspace/support cargo stays intact except noncargo tare; retained component quantities/fates have their own units/bases, not inherited whole-stream unit."
  - id: species_content
    applies_to: "direct_species"
    required_property_ref:
      name: "Mass;actual species"
      uuid: ""
    required_unit: "kg species;actual native composition basis"
    rule: "In-can VOC content/maximum or nominal pigment/binder/water/solids is not actual species release or zero. Identify species/particle and receiving medium independently; measured release or applicable activity-factor requires actual composition/fate only if not already included. Unknown leak/spill/stock difference is not emission or zero."
