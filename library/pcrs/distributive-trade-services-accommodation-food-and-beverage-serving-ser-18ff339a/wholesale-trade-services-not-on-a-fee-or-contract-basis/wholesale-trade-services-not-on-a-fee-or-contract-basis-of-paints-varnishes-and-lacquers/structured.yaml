        - "cp_paint actual volume/mass/density/tempunit/method/state/source/sampletime/conversions"
      output: "Actual net wet paint audit without default density/headspace zero"
      source_ids: []
    - id: solids_water_audit
      applies_to: "nonexchange component audit"
      rule: "mass_solids=actual_wet_paint_mass*actual_compatible_MASS_solids_fraction only with measured matching mass basis. VOLUME solids fraction cannot multiply wet mass; if actual compatible volume audit used, keep volume-solids result distinct from mass. Actual water separately measured/evidenced, not automatically 1-solids; no applied/dry-film exchange."
      inputs:
        - "cp_paint actual mass-vs-volume solids/water/component methods/state/source/native units"
      output: "Nonadditive retained wet/component audit, no generic wet-dry conversion"
      source_ids: []
    - id: original_gate_demand
      applies_to: "commodity outside service"
      rule: "commodity_source_gate_demand=assigned_source_gate_quantity; actual direct mapping OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers with complete positive actual terminal drivers inclclosing/returns/usefulothers/spills/leaks/loss. Native source/assigned/baseline/additional stage quantities/state/method/source/equivalence and exclusive loss/stage coverage reconcile outside once.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
      inputs:
        - "cp_paint complete original filled-pack/source/all-terminal/native allocation/loss/stage records"
