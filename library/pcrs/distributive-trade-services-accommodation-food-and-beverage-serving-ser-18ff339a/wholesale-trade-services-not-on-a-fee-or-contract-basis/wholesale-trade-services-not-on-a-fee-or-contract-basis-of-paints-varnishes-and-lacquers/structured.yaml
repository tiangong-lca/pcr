validation_rules:
  - rule_id: reference_gate_check
    applies_to: "foreground_dataset_conformance"
    rule: "Actual output name/link/Count amount and N agree with real merchant ownership-purchase-resale/B2B buyer/final acceptance gate/source/reversal records and original sealed ready-mixed paint qualifiers; N>0 before division, open/canceled/reversed resources retained."
    source_ids: []
  - rule_id: original_gate_check
    applies_to: "foreground_dataset_conformance"
    rule: "Complete actual factory formulated filled sealed-pack state, every missing real stage and native original/assigned/baseline/additional quantity/source, direct assignment OR complete positive all-terminal drivers inclclosing/usefulothers/returns/spill/leak/loss and exclusive loss/stage coverage outsideonce. No rawbinderwaterpigment-only proxy or residual=loss.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: scope_check
    applies_to: "foreground_dataset_conformance"
    rule: "No hidden merchant tint/mix/thin/open/decant/application/brushwash/cure/intentional settle-dry or solventtwo-part/aerosol route, including provider work; real extra operation needs reviewed extension."
    source_ids: []
  - rule_id: basis_fate_check
    applies_to: "foreground_dataset_conformance"
    rule: "Verify actual net wet paint versus pail/headspace/label volume, density-temperature and mass-solids versus volume-solids/water bases. Actual wholepails/separatepack/absorbedsolids/freepaint/hygieneliquid/retainedcomponents/species/receiver treatment exclusive; VOC content or unknown loss not release/zero."
    source_ids: []
  - rule_id: resource_record_check
    applies_to: "foreground_dataset_conformance"
    rule: "Native each-total cargo includes all actual carried filled-pail/pack/headspace/support subtracting only noncargo tare. Unique load-leg sum contains its OWN physical share before /N once. Complete all-user fullasset job/observed/remainder/lifetime native evidence/EOL and grossS+pairedout OR consumed-only OMITout match one-owner matrix."
    source_ids: []
  - rule_id: binding_completeness_check
    applies_to: "foreground_dataset_conformance"
    rule: "Final data exchange needs actual native quantity/conversion/source and concrete verified identity/property/unit. Candidate unresolved identities and empirical range gaps disclosed; automated pass not publication/full-chain readiness."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "foreground_dataset_conformance"
    rule: "all inventory rows"
    source_ids:
      - "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence"
      - species
      - state
      - "receiver or provider configuration blocks final data completion"
      - "no assumed zero. Whole streams and components"
      - "gross inputs and matched returns must remain mutually exclusive where required."
published_dataset_profile:
  dataset_role: "Service add-on foreground for actual accepted merchant-owned/resold B2B original sealed ready-mixed waterborne acrylic-copolymer interior matt paint consignment."
  downstream_use: "Combine disjoint actual service with matched complete original formulated-filled sealed-pack commodity system and quantified exclusive original demand/loss outsideonce."
  allowed_use: "Actual declared ready-mixed SKU/batch/color/base/formulation/filledpail/seal/headspace state ordinary ambient wholesale with actual ownership/acceptance/resources/receivers."
  excluded_use: "Standalone whole paint product footprint; raw manufacture or tinting/formulation/application/drying/brushwashing, solvent/two-part/aerosol paint; retail/fee agency/unreviewed operation."
  required_metadata: "Actual merchant/ownership/B2B acceptance-reversal evidence, original formulation+filledpack gate/SKU/batch/color/base/seal/fill/count/netwet volume-mass-density-temp/composition basis/pack/headspace/time/site-period, original/baseline/additional/all-terminal native quantity/loss coverage and resource/asset/unique loadleg/receiver scopes."
  required_quality_disclosure: "Unresolved actual identity/support/quantity/range and native method/state/sample source, mass-volume composition distinction, retained/free/absorbed stream unknowns, actual unique load-leg shares, measured/allocated resources and full-life asset remainder uncertainty."
  update_trigger: "Actual source/formulation/color/base/fill/seal/route/provider/asset/loadleg/receiver/species change, revised native density/composition/allocation/loss/stage coverage or verified actual identity/source."
