      source_ids: []
    - id: supply_convention
      applies_to: "actual new supplies"
      rule: "S=opening+net_receipts-closing; gross S/N plus actual same-stock usable_outward_return/N output OR consumed-only (S-usable_outward_return)/N and OMIT paired output. No inherited commodity/asset against unrelated supply or second credit."
