    - id: completed_count
      applies_to: "accepted_service"
      rule: "N=count unique FINAL actual merchant-owned/resold B2B consignment acceptances after reversals, supported by merchant/ownership/buyer/gate/source/reversal records. Normalize only N>0; otherwise retain actual cohort/event resources without fictitious service/division."
