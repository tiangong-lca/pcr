    - id: hygiene_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual used wipes/absorbents or mixed cleanup solids with measured retained fluid/particulate/agent state where present. Clean supply and component analyses are nonadditive views. Exclude separately transferred parts/incident liquid/packing and whole TV kit; captured material is not automatically direct emission. Range evidence need: Actual net stream/component native quantity/basis/source and retained-fluid evidence needed; no supplied absorbent=spent mass, assumed absorption ratio or default chemical leakage. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual attributable mixed hygiene/containment-solid mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: hygiene_waste_spent_wipe. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
