    - id: unused_mass_returns
      applies_to: "ambient_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Real unused mass-measured direct service product return, same standalone input scope and exact state/net mass. Commercial TV/accessory returns remain merchandise, not negative service supply. Used contaminated wipes/agents are waste. Range evidence need: Actual product/state/original supply pairing and measured net outward quantity/recipient needed; no offset against unrelated input or manufacturer-included batteries/accessories. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable unused service supply mass returned per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: unused_mass_returns_detergent_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: whole_tv_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual receiver-accepted discarded TV kit or whole unit with serial/configuration and associated stand/accessory/pack coverage recorded as transferred. Broken-panel observation or refused/returned stock alone is not discard or chemical release. Do not also transfer the same contained parts/cells/pack under separate output cards. Upstream commodity loss is linked outside service; actual handling/receiver treatment once. Range evidence need: Need actual serial/model/disposition/whole-stream mass and component/pack inclusion plus receiver treatment scope; no automatic whole-TV landfill, recycling yield or material release factor. Measurement evidence: protocol cp_tv; original record basis Mass / kg. The original amount constraint “Actual attributable discarded whole-unit stream mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: whole_tv_waste_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_tv; actual source-linked native records"
    - id: detached_parts_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only actual physically separate parts/accessories/cells resulting from a recorded incident or received separate state and transferred to a specific receiver. No routine disassembly, battery removal or repair prescribed. Whole-unit/kit coverage and actual detached count/mass/state/classification prevent double-counting; actual chemistry/material follows records, not generic LCD or remote assumption. Range evidence need: Actual part/parent serial ID, separation origin, quantity/state/composition/receiver and whole-unit exclusion needed; no standard panel fraction, assumed battery chemistry or salvage/avoided production credit. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual attributable separately transferred detached-part waste mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
