    - id: incident_material_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Conditional actual separately collected liquid/powder/fragments from a real incident, identified by physical state/composition and source component and receiver. Damage alone does not establish whether, or how much, LCD material, electrolyte or airborne pollutant has leaked or been released. Actual incident evidence is required; assume neither release nor zero. No dismantling/response recipe is supplied. Keep this stream separate from already counted whole parts, used absorbents, ordinary cleaning wastewater and direct species. Range evidence need: Real released/collected quantity, component/source/state/composition basis and transfer evidence required; no crack-to-leak equality, default fluid content or pure substance assumption. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual attributable separately contained incident-material waste mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
