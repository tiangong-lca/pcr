    - id: freight
      applies_to: "ambient_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Actual agreed receipt/dispatch/return transport uses complete factory-configured merchandise plus inherited/added packing and transported supports. Bare LCD panel, TV body without stand, or component material mass is not automatically payload. Carrier energy/vehicle assets and empty/multi-drop/return coverage owned once. Range evidence need: Actual configuration/load mass components, route distance/native conversion and real exclusive load shares needed; no guide model-weight/default dimensions, carrier occupancy or standard return-leg factor. Measurement evidence: protocol cp_freight; original record basis mass*distance / kg*km. The original amount constraint “Actual attributable complete-load freight work per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: unused_count_returns
      applies_to: "ambient_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Actual unused Count packing returned externally and matched to original same-scope supplystock/unit and recipient acceptance. Retained/internal movements stay stock. Choose gross input plus separate matched return output OR consumed-only input omitting that return exchange; never duplicate deduction. Range evidence need: Need actual original pair/quantity/unit/receiver and chosen stock convention; no assumed return fraction, manufacturer-kit component credit or avoided packing benefit. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “Actual attributable unused packing units returned per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
