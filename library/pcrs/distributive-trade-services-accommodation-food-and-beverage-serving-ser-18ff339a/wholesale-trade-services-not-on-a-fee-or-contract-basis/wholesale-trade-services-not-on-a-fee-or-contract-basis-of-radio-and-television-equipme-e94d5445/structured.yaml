      applies_to: "ambient_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Only actual species/receiving medium and particle identity when relevant, measured or supported by matched activity/factor or measured whole-stream composition/fate. Panel cracking, included cell chemistry, whole TV mass, smell or captured/contained incident materials are not direct chemical/metal/particulate release evidence. Range evidence need: Require actual identity/medium/particle, native quantity and factor/composition/fate/conversion applicability; no panel/LED/backlight default chemical species, battery stock loss=emission or SDS=release. Measurement evidence: protocol cp_environment; original record basis Mass / kg. The original amount constraint “Actual attributable directly released species mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
