    - id: wastewater
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual collected surface-cleaning liquid with measured volume or compatible net mass-density-temperature conversion, actual mixture/load and receiver/treatment. No receiver/remote/battery washing or direct electronics liquid discharge inferred. Incident nonaqueous liquids and contained/retained cleanup fluid remain separate states. Range evidence need: Require actual collection/receiver native volume or mass-density basis and load/treatment scope; no utility-water to drain equality, electronics leakage percentage or default pollutant load. Measurement evidence: protocol cp_outlets; original record basis Volume / m3. The original amount constraint “Actual attributable contained surface-cleaning wastewater volume per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
