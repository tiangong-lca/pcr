  calculation_rules:
    - id: accepted_consignment
      applies_to: "accepted_service"
      rule: "N=count unique final accepted_consignment_ids at reference_gate_id; accepted_service=1 Item(s)."
      inputs:
        - cp_tv
      output: "One actual complete commercial service with real configured unpowered kit/gate qualifiers"
      source_ids: []
    - id: configured_mass_audit
      applies_to: "non-exchange TV/kit"
      rule: "whole_merchandise_mass=boxed_gross_mass-primary_pack_tare-accessory_pack_tare-inherited_outer_tare-transported_support_tare on actual matching boundaries. Reconcile actual included components once; tv_body_mass with/withoutstand basis, barepanel, remote/cells/adapter views do not add twice to whole kit. Actual source/native unit of each quantity and calibration retained, no guide mass default."
      inputs:
        - cp_tv
      output: "Actual configuration/piece/whole-commodity/tare audit, not new manufacture"
      source_ids: []
    - id: finished_gate_demand
      applies_to: "non-exchange original commodity"
      rule: "assigned_source_gate_quantity=actual compatible evidenced source_gate_input_quantity allocation/conversion to accepted cohort excluding exclusively assigned returns/closing/other exits. commodity_source_gate_demand=assigned_source_gate_quantity/N outside service. Actual irrecoverable unit/part loss_adjustment_quantity/unit/basis/source/owner and already_included_loss_coverage reconcile once, no stock residual=loss or missingpart default."
      inputs:
        - cp_tv
        - N
      output: "Separate complete factory-configured demand and actual compatible loss upstream once"
      source_ids: []
    - id: new_supply_stock
      applies_to: "service new supplies/unused returns"
      rule: "S=opening_supply+net_receipts-closing_supply; net_receipts=gross_receipts-receipt_tare. Gross input S/N plus separately paired usable_outward_return/N OR consumed-only (S-usable_outward_return)/N with matching return exchange omitted. Retained recovery in closing and original same-scope native conversions/sources required."
      inputs:
        - cp_supplies
        - N
      output: "Actual service supplies and one unused-return convention per reference flow"
      source_ids: []
    - id: meter_attribution
      applies_to: "electricity; cleaning_water; electricity_ac; cleaning_water_liquid_tap"
      rule: "actual_meter_quantity=closing_reading-opening_reading on actual import/export direction OR matched direct_submeter_quantity; attributable_quantity=(actual_meter_quantity*consumer_driver/total_driver)/N for disjoint all-user periods including idle/hygiene/open resources."
      inputs:
        - cp_utilities
        - N
      output: "Actual warehouse purchased utility quantity per reference flow"
      source_ids: []
    - id: physical_provider
      applies_to: "provider_packages"
      rule: "provider_quantity=native_quantity*equivalent_conversion/N for evidenced matching completed physical package with full resource ownership once."
      inputs:
        - cp_provider
        - N
      output: "Actual equivalent completed package quantity per reference flow"
      source_ids: []
    - id: asset_equivalent
      applies_to: "shared_assets"
      rule: "asset_equivalent=(job_driver/life_driver)/N; life_driver=observed_driver+remaining_driver with compatible native units, all-user full lifecycle/observed history+sourced remainder and actual replacement/EOL, one view/no double normalization."
      inputs:
        - cp_assets
        - N
      output: "Actual complete asset-equivalent share per reference flow"
      source_ids: []
    - id: whole_load_freight
      applies_to: "freight"
      rule: "whole_payload_mass=whole_merchandise_payload_mass+primary_pack_mass+inherited_outer_mass+added_pack_mass+transported_support_mass on real disjoint components; freight_work=whole_payload_mass*route_distance*load_share/N after actual native conversion and exclusive return/empty coverage."
      inputs:
        - cp_freight
        - N
      output: "Actual configured whole-load freight work per reference flow"
      source_ids: []
    - id: contained_outlets
      applies_to: "actual waste outlets"
      rule: "whole_tv_waste=actual_discard_stream_mass/N on actual transferred wholeunit/kit/component/pack scope. Each other outlet_quantity=(gross_quantity-tare_quantity)/N in real native stream units OR actual volume/N with supported density-temperature conversion. Wholeunit, detachedparts, incident material, packing and mixed cleanup/liquid excluded from each other; retained stock/internal moves not exports; treatment once."
      inputs:
        - cp_tv
        - cp_outlets
        - N
      output: "Actual exclusive contained streams/receiver scopes per reference flow"
      source_ids: []
    - id: species_mass
      applies_to: "direct_species"
      rule: "species_mass=measured_mass/N OR activity*species_factor/N OR measured_whole_stream_release*composition*fate/N after matched native source-backed conversions; select one. factor_complete forbids extra composition/fate and whole-stream/species output physically not duplicated."
      inputs:
        - cp_environment
        - N
      output: "Actual direct species mass/receiving medium per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: configured_unpowered_gate
      applies_to: "received/accepted TV kits"
      requirement: "Actual LCD/LED model/serial/region/factory pack and included configuration, unpowered merchant records and buyer criteria required. Supplied stand/remote/cells not assumed, acceptance not invented powered functional test."
      evidence: "cp_tv manufacturer/model/configuration/source/buyer records"
    - id: mass_stock_fates
      applies_to: "merchandise and actual outlets"
      requirement: "Whole body/stand/panel/accessory/kit/pack native mass views compatible/nonadditive. Source complete-factory assigned demand/exclusive exits and actual loss owner/state/unit/source/existing coverage outside once; damage/missing stock not automatically discard/leak/species."
      evidence: "Actual configured stock/disposition and separate quantified commodity link"
    - id: complete_physical_scope
      applies_to: "all resource periods"
      requirement: "Real all-user source/native drivers, complete providers/full-life assets history+remainder/replacement/EOL/uncertainty, direct/carrier/receiver scope including hygiene/failed/open work once."
      evidence: "Source meters/supplies/driver/provider/asset/carrier/treatment evidence"
    - id: concrete_identity_ranges
      applies_to: "actual expanded exchanges"
      requirement: "Verify actual SKU/provider/asset/component/waste/species/native property-unit support before final data; empirical ranges need comparable source evidence, not model guide values."
      evidence: "Actual detail/support/receiver and numerical-range applicability evidence"
    - id: electricity
      applies_to: "ambient_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Actual electric logistics equipment/charging, lighting, records and surface-cleaning/ordinary ventilation for boxed unpowered goods. TV operating, standby, demonstration, activation and update electricity is outside this route; factory testing is upstream. No onsite combustion or dedicated climate intervention is assumed. Range evidence need: Actual source meter periods, charging/equipment scope and all-user causal drivers including idle/open work needed; no rated TV watts, annual consumer label use or default equipment run-hours. Measurement evidence: protocol cp_utilities; original record basis Energy / kWh. The original amount constraint “Actual attributable purchased warehouse electricity per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: cleaning_water
      applies_to: "ambient_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Actual external supply for warehouse floors/equipment only, not washing television/remote/battery or inferred leakage. Actual source/treatment, recirculation/make-up and receiver scopes are independently evidenced; no utility hidden twice inside provider package. Range evidence need: Need actual meters/events/source-treatment and allocated intervals; no per-TV wash ratio or water-purchase=outfall assumption. Measurement evidence: protocol cp_utilities; original record basis Volume / m3. The original amount constraint “Actual attributable purchased cleaning water per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: hygiene_supplies
      applies_to: "ambient_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Actual named surface agents, wipes/absorbents or other mass-measured warehouse service products, by SKU/state/native unit. Only actual incident response consumption, not a prescribed kit or opening/cleaning the receiver. Factory remote cells, stand, power adapter/cables and inherited protective packing are merchandise constituents, not service-consumed supplies. Range evidence need: Actual product/formulation/native stock/use/unused-return and composition/fate evidence required; no standard spill kit, battery chemistry, cleaning recipe or dose/release fraction. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable actual new hygiene/containment product mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: hygiene_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: added_packing
      applies_to: "ambient_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Actual merchant-added external transit cases/straps/supports with defined units/material and measured per-piece mass if converted. Factory carton/cushion/film/inserts/accessory boxes remain inherited kit audit, not newly supplied packing merely on resale. No routine primary unpack/rebox; reusable pallets/bins are complete-life assets. Range evidence need: Actual new external unit/material/stock/return and per-unit mass sources needed; no universal carton/foam mass, new primary box per TV or automatic manufacturer reboxing procedure. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “Actual attributable added transit packing units per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: added_packing_paperboard_carton. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_packages
      applies_to: "ambient_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Actual complete provider-defined external pack/document verification, warehouse hygiene/incident handling or maintenance package with real equivalent completed unit and resource scope. No fee/margin/resource-free task proxy. Contracted activation/testing/software, repair/disassembly/mounting/installation or reboxing changes route and needs review. Range evidence need: Actual provider native unit/conversion, completed events and energy/material/asset/transport/treatment inclusions/exclusions required; no assumed technician count, duration or price equivalence. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “Actual attributable equivalent completed physical packages per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_provider; actual source-linked native records"
    - id: shared_assets
      applies_to: "ambient_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Actual warehouse/racks/electric handling/reusable pallets/bins/scales/monitoring with matching complete asset equivalent and sole lifecycle owner. Cover manufacture/maintenance/actual replacements/retirement/EOL and all users/periods; no new pallet each turn or duplicate rental/wholeasset view. Range evidence need: Need actual asset identity/native all-user job/life driver units, observed history and sourced remainder, uncertainty/sensitivity/update; no standard warehouse life or support cycles. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual attributable complete asset-equivalent share per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
