allocation_rules:
  - rule_id: original_gate_assignment
    applies_to: "TV merchandise"
    rule: "Assign actual complete factory-configured/boxed input to accepted cohort on compatible state/native unit/source/allocation/conversion. Actual stand/accessory/cell inclusion follows original kit records, not separate invented service supply. Returns/closing/other exits exclusive; actual irrecoverable wholeunit/component loss needs compatible original-gate adjustment quantity/state/unit/basis/source/owner/existing coverage once outside service. Finaldispatch plus waste or stock residual alone is not assigned source demand/loss; unknown actual state unresolved, not zero."
    source_ids: []
  - rule_id: all_consumer_resources
    applies_to: "actual service periods"
    rule: "Use actual all-user source periods and causal handling/space-time or other justified driver with native units/source/rationale, including idle/hygiene/failed/open attempts. TV piece count or equal consignment shares not presumed; no fictitious N for unfinished work."
    source_ids: []
  - rule_id: new_supply_returns
    applies_to: "new service supplies"
    rule: "S=opening_supply+net_receipts-closing_supply. Gross input S/N plus separate actual matching native unused outward-return output OR consumed-only (S-usable_outward_return)/N and omit matching return exchange/no extra deduction. Same-scope standalone supply pairing required; retained recovery in closing. Inherited kit/cells or asset components cannot offset unrelated current supplies."
    source_ids: []
  - rule_id: full_asset_life
    applies_to: "shared_assets"
    rule: "asset_equivalent=(job_driver/life_driver)/N for one matching complete asset/all users/periods; include manufacture/maintenance/actual replacements/retirement/EOL, observed history+sourced remainder and uncertainty/sensitivity/update. Direct/provider/carrier/current-event overlap removed only with same physical burden one owner elsewhere; no per-turn new pallet/rent-service+asset duplicate."
    source_ids: []
  - rule_id: actual_outlet_views
    applies_to: "actual transfer fates"
    rule: "Usable commercial return/retained rejected kit is commodity, not negative service. Actual wholeTV stream includes transferred components/pack once; separately detached parts/cells/incident material/packing/mixed hygiene/cleaning liquid require real quantities and receiver classification/scope. No component and whole overlap, no automatic chemical release or salvage/recycling benefit; actual treatment once."
    source_ids: []
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "Published with-stand and without-stand masses are comparable only for the same actual model, configuration, state and measurement method. Do not infer stand mass or all supplied accessory mass by subtracting different guide figures; preserve actual source/method/uncertainty and configuration membership."
    source_ids: []
