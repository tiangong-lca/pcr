    - id: packaging_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual already-separated outer or damaged inherited packing with material/state/remaining merchandise/receiver evidence. No ordinary opening/reboxing or new primary-pack manufacture is assumed. Exclude packing physically transferred with whole TV waste or retained mixed hygiene stream. Range evidence need: Need actual carton/cushion/film component/net quantity/state and receiver; no default foam/cardboard proportions, every carton discarded on receipt or recycled-material substitution. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual attributable separated packing-waste mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: packaging_waste_paper_pack; packaging_waste_metal_pack; packaging_waste_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
