_exclusion_links; whole_total_reconciliation"
      collection_method: "Reconcile actual title/purchase/resale, received and dispatched weighed whole latex, tank heels, representative layer/transfer samples and actual buyer specification/results. Record inherited preservation state and any rejected/repeated event. N uses final unique accepted consignment IDs; unfinished resources stay in linked open-cohort periods. Pair internal transfers and recovered closing; resolve unexplained stock differences without inferring fluid/species loss. Quantify actual fates and link original-gate commodity loss adjustment outside service once.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value. Attribute only the individually identified physical case; retain other source-linked actual fates separately. Each native record belongs to exactly one exchange and any whole total is a non-additive audit."
      unit: "Item(s); actual whole latex kg and assay-specific fractions"
      frequency: "each receipt, tank/transfer sample, dispatch, reject, spill and opening/closing survey"
      temporal_coverage: "All source-released latex receipt-to-accepted-buyer events, linked prior/later stock and unfinished periods"
      site_scope: "Named merchant tank site and actual contractual provider interfaces"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed acceptance; calibrated mass/volume; representative assays with applicability/uncertainty; complete stock/fate and original-gate commodity-loss evidence"
