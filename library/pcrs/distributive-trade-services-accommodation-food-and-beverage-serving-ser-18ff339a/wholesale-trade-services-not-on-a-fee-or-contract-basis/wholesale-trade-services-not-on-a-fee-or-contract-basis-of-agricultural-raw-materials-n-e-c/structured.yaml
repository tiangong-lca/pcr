      flow_role: "current cleaning chemicals and discrete sampling consumables/returns"
      record_type: "supply_stock_record"
      raw_fields: "site_id; operator_id; contract_id; cohort_id; source_lot_id; consignment_id; tank_id; event_id; period_id; reference_gate_id; accepted_consignment_ids; N; sku; material_identity; composition; composition_basis; composition_source; material_state; native_property; native_unit; opening; gross_receipts; tare_receipts; net_receipts; closing; recovered_closing; usable_outward_return; return_receiver; return_transfer_id; used; waste; uncontained_loss; chosen_return_view; conversion_factor; conversion_unit; conversion_source; piece_mass; piece_mass_unit; piece_mass_source; density; density_unit; density_source; temperature; temperature_unit; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Use actual formulation/SKU native stock and receipt/return records. S=opening+net_receipts-closing; choose S/N gross input with a separate matched unused-return output, OR (S-usable_outward_return)/N consumed-only input with that matched output omitted. For cleaning_chemicals_synthetic_detergent and usable_returns_detergent_return, all matched stock, receipt and return quantities use net kg of the same detergent formulation and supplied state, excluding packaging tare. Recovered closing is already closing; nonreturned wastes/losses retain supply burdens. Actual discrete sampling/transfer consumables retain their own specific identity and native count evidence and require matching concrete exchanges before using a gross-input/return-output representation. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "actual SKU native unit; kg or Item(s) where appropriate"
      frequency: "each supply, use, return and stocktake event"
      temporal_coverage: "All selected operation and linked stock periods"
      site_scope: "Same merchant node and actual consumption boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Stock/return matching, formulation and actual unit conversion evidence"
    - protocol_id: cp_utilities
      process_id: "latex_wholesale"
      flow_role: "purchased electricity and cleaning water"
      record_type: "utility_meter_record"
      raw_fields: "site_id; operator_id; contract_id; cohort_id; source_lot_id; consignment_id; tank_id; event_id; period_id; reference_gate_id; accepted_consignment_ids; N; meter_id; source_id; meter_register_role; reading_start; reading_end; meter_factor; metered_quantity; gross_import; gross_export; utility_unit; conversion_factor; conversion_unit; conversion_source; cleaning_event; rinse_stage; recirculation; retained_water; wastewater; measured_evaporation; driver; driver_unit; attributable_share; all_consumers; idle_intervals; provider_inclusion; coverage_start; coverage_end; calibration; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Read source-specific import meters/bills and disjoint consumer intervals. Attribute actual pump, circulation, cleaning, monitoring and idle uses with compatible all-consumer drivers; no active recipe/conditioning assumed. Keep gross supplied water and actual fates separate, no automatic water=effluent or unrelated export netting. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kWh; m3"
      frequency: "each meter interval and actual cleaning/transfer event"
      temporal_coverage: "All attributable active, idle and cleaning periods"
      site_scope: "Actual site sources and all disjoint consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, bills and complete driver/source coverage"
    - protocol_id: cp_provider
      process_id: "latex_wholesale"
      flow_role: "actual completed external quality packages"
      record_type: "provider_quality_record"
      raw_fields: "site_id; operator_id; contract_id; cohort_id; source_lot_id; consignment_id; tank_id; event_id; period_id; reference_gate_id; accepted_consignment_ids; N; provider_id; sample_id; assay_method; applicability; physical_result; completed_package_id; completion_date; quantity; native_property; native_unit; upstream_dataset; upstream_unit; material_scope; utility_scope; asset_scope; transport_scope; waste_scope; missing_scope; direct_overlap; acceptance_id; uncertainty"
      collection_method: "Obtain actual package completion/sample assay result and full upstream scope. Count only a physically specified native-Count completed package, never fee/hours. Other native quantities require expansion. Include actual reagents, utilities/assets, transport and waste once; supplier inherited quality certificate is evidence rather than a new purchased assay by default."
      unit: "actual provider native unit; Count only if package-native"
      frequency: "each completed actual package"
      temporal_coverage: "All attributable sample/retest events in selected cohorts"
      site_scope: "Actual provider and merchant responsibility split"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed results, package native unit and complete non-overlap scope"
    - protocol_id: cp_assets
      process_id: "latex_wholesale"
      flow_role: "shared tanks/pumps/hoses/containment full lifecycles"
      record_type: "asset_lifecycle_driver_record"
      raw_fields: "site_id; operator_id; contract_id; cohort_id; source_lot_id; consignment_id; tank_id; event_id; period_id; reference_gate_id; accepted_consignment_ids; N; asset_id; asset_identity; lifecycle_dataset; lifecycle_unit; all_consumers; all_periods; job_driver; driver_unit; life_driver; life_driver_unit; observed_life; observed_history; evidenced_remainder; remainder_source; manufacture_scope; maintenance_scope; replacement_events; replacement_scope; termination_event; eol_scope; lifecycle_sources; provider_inclusion; selected_view; uncertainty; sensitivity; update_trigger"
      collection_method: "Use actual asset inventory, complete lifetime burden and compatible driver across every contract, lot/site consumer and period. Include actual maintenance, replacements, retirement/end-of-life and observed lifetime or evidence-backed remainder. Choose one complete asset-equivalent Count view; no simultaneous per-driver service plus duplicate asset manufacture."
      unit: "asset-equivalent Item(s); compatible driver units"
      frequency: "each use, maintenance, replacement and terminal event"
      temporal_coverage: "Full asset manufacture through all usage/maintenance/replacements to end-of-life; selected cohort driver separately linked"
      site_scope: "Every actual consumer of merchant assets; supplier/carrier inclusion separately bounded"
      aggregation_rule: "per reference flow"
      quality_evidence: "Full lifecycle sources, compatible all-consumer drivers, evidence-backed remaining use and sensitivity"
    - protocol_id: cp_freight
      process_id: "latex_wholesale"
      flow_role: "actual whole-latex payload and route/empty return"
      record_type: "freight_leg_record"
      raw_fields: "site_id; operator_id; contract_id; cohort_id; source_lot_id; consignment_id; tank_id; event_id; period_id; reference_gate_id; accepted_consignment_ids; N; shipment_id; leg_id; carrier; load_quantity; load_unit; whole_latex_kg; load_conversion; load_conversion_source; route_distance; distance_unit; distance_km; distance_conversion; distance_source; attribution_share; all_loads; empty_return; empty_service_coverage; commodity_inclusion; provider_inclusion; responsibility; uncertainty"
      collection_method: "Reconcile actual carrier legs and weighed whole-latex payload with route distance and commodity/provider overlap. Preserve failed or returned legs where merchant-owned; actual empty service coverage is required but has no invented payload."
      unit: "kg*km"
      frequency: "each actual carrier leg and return"
      temporal_coverage: "All selected merchant responsibility legs"
      site_scope: "Merchant-carrier-commodity dataset interfaces"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weighbills, route evidence, load/distance conversion and empty service coverage"
    - protocol_id: cp_outlets
      process_id: "latex_wholesale"
      flow_role: "contained rinsewater and other non-latex waste outlets"
      record_type: "waste_receiver_record"
      raw_fields: "site_id; operator_id; contract_id; cohort_id; source_lot_id; consignment_id; tank_id; event_id; period_id; reference_gate_id; accepted_consignment_ids; N; outlet_id; stream_id; origin_event; material_identity; material_state; native_property; native_unit; gross_quantity; tare; net_quantity; measured_volume; density; density_unit; density_temperature; density_temperature_unit; density_source; sample_id; sampling_method; drc_value; drc_basis; tsc_value; tsc_basis; pollutant_identity; concentration; concentration_unit; composition_basis; composition_source; receiver; transfer_id; treatment_route; treatment_coverage; provider_inclusion; nonadditive_characterization; uncertainty"
      collection_method: "Measure actual waste/aqueous outlets by disjoint stream, material/state and receiver. Match actual treatment once and preserve contaminated solids vs latex residue vs rinsewater. Analytical dry rubber/solids/species load characterizes the same physical fluid and is not an additive second waste amount. Direct outfall would need separately reviewed Elementary exchange, not this contained wastewater."
      unit: "actual waste native unit; kg or m3 as applicable"
      frequency: "each outlet, cleaning drain and receiver transfer"
      temporal_coverage: "All actual attributed waste and cleaning events"
      site_scope: "Named site outlets and receiving treatment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual quantities, sampling/composition and disjoint treatment boundary/receiver proof"
    - protocol_id: cp_environment
      process_id: "latex_wholesale"
      flow_role: "actual direct inherited-latex species handling and releases"
      record_type: "species_release_record"
      raw_fields: "site_id; operator_id; contract_id; cohort_id; source_lot_id; consignment_id; tank_id; event_id; period_id; reference_gate_id; accepted_consignment_ids; N; exchange_id; substance; source_medium; receiving_medium; source_event; measured_mass; mass_unit; activity; activity_unit; species_factor; factor_unit; factor_scope; factor_source; factor_complete; whole_release; whole_release_unit; whole_fluid_identity; composition; composition_basis; composition_source; aqueous_phase_fraction; phase_fraction_source; fate; fate_basis; fate_source; capture_state; retained_spill; recovered_to_closing; contained_waste; uncontained_release; conversion_factor; conversion_unit; conversion_source; temperature; temperature_unit; pressure; pressure_unit; provider_inclusion; calibration; detection_limit; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Identify actual species and receiving medium independently of merchandise identity. Use measured species mass, valid matched activity factor, or actual whole-fluid release with evidence-backed composition/fate and exclusive paths; retain whole-latex vs aqueous-phase basis and actual phase conversion. Recovered spill in closing, contained waste and environmental release are separate disjoint fates, total-spill audit nonadditive; no SDS or stock residual factor. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kg by actual species and receiving medium"
      frequency: "each actual release and relevant observation interval"
      temporal_coverage: "All attributable direct events and periods"
      site_scope: "Actual emitting site; provider-included releases excluded from repeat"
      aggregation_rule: "per reference flow"
      quality_evidence: "Species/medium and compatible measured/factor/composition/fate sources with uncertainty/detection limits"
  calculation_rules:
    - id: consignment_reference
      applies_to: "accepted_service"
      rule: "N=count unique accepted_consignment_ids at final reference_gate_id; accepted_service=1 Item(s)."
      inputs:
        - cp_latex
      output: "One actually accepted physical commercial consignment with actual latex/assay/time qualifiers"
      source_ids: []
    - id: latex_assay_views
      applies_to: "merchandise; latex_residues; latex_residues_atomic_case"
      rule: "dry_rubber_kg=net_latex_mass*drc_fraction; total_solids_kg=net_latex_mass*tsc_fraction, only for same representative sample/state/method-compatible mass fractions. nonrubber_difference_kg=total_solids_kg-dry_rubber_kg is an analytical compatible difference, not a pollutant species. Do not infer pure water as 1-tsc_fraction or wet residue as dry rubber."
      inputs:
        - cp_latex
        - cp_outlets
      output: "Nonadditive actual assay views of the same recorded physical material"
      source_ids: []
    - id: latex_stock_fates
      applies_to: "merchandise and residue audit"
      rule: "Reconcile opening_heel+receipts with closing_heel, actual buyer dispatch, supplier/customer returns and complete actual fates by compatible whole-latex and dry-rubber views. Recovered closing belongs to closing; paired internal transfers cancel. Record actual sample removals/returns, representative stratified/settled material and uncertainty; investigate stock_discrepancy without inventing releases.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
      inputs:
        - cp_latex
        - cp_environment
      output: "Non-exchange stock audit and compatible commodity-loss adjustment evidence"
      source_ids: []
    - id: supply_native
      applies_to: "cleaning_chemicals; sampling_consumables; usable_returns; cleaning_chemicals_synthetic_detergent; usable_returns_detergent_return"
      rule: "net_receipts=gross_receipts-tare_receipts; S=opening+net_receipts-closing; choose gross_input=S/N OR consumed_input=(S-usable_outward_return)/N. Under gross input, record the matched unused-return output; under consumed-only input, omit that output. For the detergent input and usable_returns_detergent_return, every operand is net kg of the same formulation, supplied state and stock scope; do not substitute Item(s). Actual discrete consumables use separate identity-compatible count records and concrete exchanges, not the detergent card. Use positive accepted N and normalize raw assigned quantities once; do not divide an already-per-reference quantity again."
      inputs:
        - cp_supplies
        - N
      output: "Actual native supply and outward unused returns per reference flow"
      source_ids: []
    - id: utility_meter
      applies_to: "electricity; cleaning_water; electricity_ac; cleaning_water_liquid_tap"
      rule: "metered_quantity=(reading_end-reading_start)*meter_factor on the appropriate source import register, or directly measured compatible source quantity; utility_quantity=sum(metered_quantity*conversion_factor*attributable_share)/N. Use disjoint source/consumer/event/period intervals and all-consumer drivers."
      inputs:
        - cp_utilities
        - N
      output: "Actual purchased electrical energy or cleaning water per reference flow"
      source_ids: []
    - id: quality_package
      applies_to: "quality_packages"
      rule: "provider_quantity=quantity/N for actual native-Count completed package with matching result/unit and full coverage; other native-unit provider exchanges require expansion. Add missing_scope once and remove direct_overlap."
      inputs:
        - cp_provider
        - N
      output: "Complete actual provider quality service per reference flow"
      source_ids: []
    - id: asset_equivalent
      applies_to: "shared_assets"
      rule: "asset_equivalent=(job_driver/life_driver)/N with compatible complete lifetime driver units and matching full-lifecycle asset dataset."
      inputs:
        - cp_assets
        - N
      output: "Asset-equivalent Item(s) per reference flow"
      source_ids: []
    - id: freight_work
      applies_to: "freight"
      rule: "freight_work=sum(whole_latex_kg*distance_km*attribution_share)/N; whole_latex_kg is actual transported wet payload and distance units/conversions/empty scope are explicit."
      inputs:
        - cp_freight
        - N
      output: "Actual kg*km per reference flow and separately covered actual empty service"
      source_ids: []
    - id: physical_outlets
      applies_to: "latex_residues; other_wastes; wastewater; usable_returns; latex_residues_atomic_case; usable_returns_detergent_return"
      rule: "For latex_residues use residue_wet_quantity/N; for other_wastes or wastewater use net_quantity/N in the actual native unit of each independently identified outlet. For usable_returns_detergent_return, use matched unused detergent net kg/N ONLY under the gross-input convention; omit that matched output under consumed-only input accounting. Use positive accepted N and do not divide already-per-reference quantities again. Every outlet has its own material, state and receiver; analytical DRC/TSC/species views characterize existing outlets and are not added physical outlets. Pair receiving treatment once where applicable, without avoided-production credit."
      inputs:
        - cp_latex
        - cp_outlets
        - cp_supplies
        - N
      output: "Actual disjoint contained outlets per reference flow"
      source_ids: []
    - id: species_release
      applies_to: "direct_species; direct_species_ammonia_air"
      rule: "species_mass=measured_mass/N OR activity*species_factor/N OR whole_release*composition*fate/N after compatible basis/unit conversion, choose one path. Whole-latex versus aqueous-phase composition needs actual phase_fraction_source, not inferred water=1-TSC or 1-DRC. factor_complete forbids multiplying composition/fate again."
      inputs:
        - cp_environment
        - N
      output: "Actual species mass and receiving medium per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: accepted_gate
      applies_to: "accepted_service"
      requirement: "Each N entry has merchant title/resale responsibility, actual lot/tank and complete business-buyer specification/results/signature. Supplier release and inherited physical formulation are distinct from warehouse transformation."
      evidence: "cp_latex commercial and quality evidence"
    - id: representative_assays
      applies_to: "actual latex stocks/fates"
      requirement: "Require representative source/tank/transfer samples, actual assay methods/applicability and fraction/basis conversion plus uncertainty. DRC/TSC/preservative tests differ; reject inappropriate method/state transfer and unknown composition rather than fill a vendor default."
      evidence: "Sample IDs, layer/transfer records, actual certificates and calibration"
    - id: commodity_interface
      applies_to: "commodity and service linkage"
      requirement: "Before complete-chain/finalpackage use identify original gate and actual loss wet/dry basis, quantity/unit/source/owner and existing loss coverage; no omitted upstream lost commodity or duplicated burden within service."
      evidence: "Commodity-adjustment and stock/outlet evidence"
    - id: complete_scope
      applies_to: "all source/provider/asset/leg/period"
      requirement: "One actual owner and compatible unit for each resource, full provider and asset lifecycle/all-consumer scope, replacements/termination and source-backed remainder. Quantify actual contained waste/rinsewater and treatment once."
      evidence: "Scope matrix, physical provider results and full-life asset register"
    - id: identity_ranges
      applies_to: "actual exchange expansion"
      requirement: "Concrete SKU/provider/asset/species/property/unit identities must be verified before final dataset. Empirical ranges require independent comparable source/basis and actual reference quantity; no commercial specification substituted for consumption, loss or emission."
      evidence: "Concrete UUID details/support and independent empirical evidence"
    - id: electricity
      applies_to: "latex_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Only actual purchased electricity for pumps, sampling circulation, monitoring, lighting and any actually operated environmental controls at this electric-only site, including attributable idle and cleaning intervals. Same-batch circulation is physical handling, not a recipe for concentration, deliberate maturation or compounding. Range evidence need: Actual meter registers, pump/circulation logs and disjoint all-consumer/time driver records must support a comparable consignment energy guardrail; no tank power, operating hours or kWh/tonne default. Measurement evidence: protocol cp_utilities; original record basis Energy / kWh. The original amount constraint “Actual attributable electricity per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: cleaning_water
      applies_to: "latex_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Record actual external cleaning water and scope; never add water to traded latex as an assumed top-up or replace an actual dilution step with a cleaning label. Retain actual rinse sequences, recirculation and disjoint residual fates. Environmental abstraction is outside this purchased-water route. Range evidence need: Use actual source meters and cleaning-event records, volumes and conversion evidence with real tank turnover; no fixed rinse quantity, cleaning frequency or assumption that all supplied water becomes wastewater. Measurement evidence: protocol cp_utilities; original record basis Volume / m3. The original amount constraint “Actual attributable cleaning water per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: cleaning_chemicals
      applies_to: "latex_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Actual named and formulated cleaning chemicals used on isolated/empty equipment, with residue fate and provider boundary. There is no default preservative, ammonia, stabilizer or coagulant addition to merchandise within this scope. Any intentional latex chemistry adjustment requires reviewed route extension. Range evidence need: Stock and actual formulation/concentration/state evidence must support mass consumption and residue attribution; supplier latex preservative specifications and SDS hazards are not cleaning doses or releases. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable cleaning chemical supply per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_chemicals_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: sampling_consumables
      applies_to: "latex_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Record actual countable single-use sample bottles, seals or other discrete transfer consumables by SKU and state; use actual native-unit expansion for uncountable materials. Reusable hoses, pumps and vessels are lifecycle assets; inherited latex containers are commodity/transport scope, not new supplies each order. Range evidence need: Require actual SKU piece counts, opening/receipts/closing and unused returns; obtain actual count-to-mass data only for an independent nonadditive mass view, not an assumed bottle or seal mass. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “Actual attributable countable sampling and transfer consumables per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: quality_packages
      applies_to: "latex_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Actual completed and physically defined native-Count laboratory/inspection packages matched to sample/lot and assay results. Distinguish DRC from TSC and preservative/alkalinity/other specified tests; do not assume every method fits every latex. Full package covers its actual reagents, utilities, equipment, waste and transport unless separately supplied once. Range evidence need: Require actual package ID, tests, physical result, native unit, completion and complete dataset scope; invoice fee or analyst hours cannot become one Count package, and raw actual-native units need expansion if not package-native. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “Actual attributable completed assay packages per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_provider; actual source-linked native records"
    - id: shared_assets
      applies_to: "latex_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Actual merchant tanks, pumps, hoses, scales, sampling tools and containment facilities allocated as fractions of matching complete asset lifecycles across every contract, user and period. Include manufacture, maintenance, replacements and end-of-life; do not count the whole site or a tank-litre each consignment. Range evidence need: Use actual compatible lifetime driver totals and observed service history or evidenced remainder, replacement/termination/end-of-life sources, uncertainty and sensitivity; name every consumer and prevent supplier/carrier-owned asset overlap. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual attributable whole-lifecycle asset-equivalent quantity per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "latex_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Actual carrier legs in merchant responsibility not already included in commodity or other provider datasets. Use weighed whole-latex net load, not dry rubber mass as tanker payload; attribute shared loads and actual empty tank/container return scope separately without inventing loaded mass. Range evidence need: Actual leg load and distance units/conversions, carrier and responsibility/empty-return records are required; no dry-rubber substitution for transported wet latex or standard tanker capacity/distance default. Measurement evidence: protocol cp_freight; original record basis mass*distance / kg*km. The original amount constraint “Actual attributable bulk-latex freight work per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: usable_returns
      applies_to: "latex_wholesale"
      requirement: "For usable_returns_detergent_return, obtain the actual external return ticket for unused synthetic detergent and match it to input cleaning_chemicals_synthetic_detergent by formulation/SKU, supplied state, stock scope and native Mass / kg basis. Record actual net detergent mass excluding packaging tare, measurement/conversion evidence, event, source, receiver and transfer gate. Require signed outward transfer evidence and the chosen gross-input or consumed-only convention. Include this output only with gross input S/N; with consumed-only (S-usable_outward_return)/N, omit the matched output. Closing stock, internal recovery, spent/contaminated detergent and supplier/customer latex returns are not this usable return. Actual discrete sampling/transfer consumables require their own concrete identities, matched input and count evidence before any corresponding exchange is used; neither their counts nor an unresolved quantity may be substituted for detergent kg. Measurement evidence: protocol cp_supplies; Mass / kg. Normalize the actual assigned unused detergent net mass by positive accepted N once; preserve an already-per-reference quantity. Defined flow cards: usable_returns_detergent_return. Other actual states require a specific evidence decision before identity assignment. Do not infer occurrence or zero from missing records, create a category-total exchange, net unrelated supplies or add an avoided-production credit. This requirement is an evidence checkpoint, not another exchange."
      evidence: "cp_supplies; actual source-linked native records"
    - id: latex_residues
      applies_to: "latex_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Weigh actual wet latex discard, collected undiluted spill, coagulum/skin or tank residue by distinct state and receiver, with measured DRC/TSC where needed. Returned usable latex is not Waste. A rinse-water stream goes to the separate wastewater ledger; dry rubber content is an analytical view of the same residue, not a second additive waste exchange. Range evidence need: Actual wet net mass, sample representativeness/DRC/TSC, state and receiving treatment are needed; do not assign liquid latex concentration to coagulum or infer residue from a tank mass deficit, nor call one wet kg one dry kg. Measurement evidence: protocol cp_latex; original record basis Mass / kg. The original amount constraint “Actual attributable as-received contained latex residue mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: latex_residues_atomic_case; latex_residues_latex_coagulum. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_latex; actual source-linked native records"
    - id: other_wastes
      applies_to: "latex_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual spent absorbents, filters if actually present, cleaning residues and sampling/transfer disposables by material and contamination state, with receiving treatment. Separate retained reusable equipment, unused return and commodity residue; hazardous status requires actual evidence. Range evidence need: Require actual weigh/tare and material/state/receiver records, treatment scope and evidence of contamination; no waste fraction per tank, default filter, or inherited latex chemical concentration applied to every disposable. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual attributable other contained waste mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: wastewater
      applies_to: "latex_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual separately measured aqueous rinse/cleaning wastewater sent to an identified treatment receiver, with actual pollutant load/DRC/TSC evidence as appropriate for that stream. Distinguish it from undiluted latex residue, recirculation, recovered merchandise and direct environmental outfall. Analytical rubber/species load is a nonadditive characterization of the same fluid. Range evidence need: Use actual volume, density if mass conversion is required, sampling/composition/time and treatment coverage; wastewater volume is not dry rubber lost and purchased cleaning water is not automatic effluent. Measurement evidence: protocol cp_outlets; original record basis Volume / m3. The original amount constraint “Actual attributable contained wastewater per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: direct_species
      applies_to: "latex_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Actual direct species and receiving medium, including ammonia only where established by monitoring or a valid matched activity/composition/fate path. Inherited preservative content may require handling/release accounting without any added warehouse ammonia. Contained spill and capture are not air release; no whole-fluid, dry rubber deficit or SDS hazard is a species identity or released amount. Range evidence need: Require actual species mass or justified matched activity factor or measured whole-fluid release with composition and fate, all with basis/unit/source and uncertainty. Whole-latex ammonia versus aqueous-phase concentration cannot be interchanged; complete factors are not multiplied again by composition/fate. Measurement evidence: protocol cp_environment; original record basis Mass / kg. The original amount constraint “Actual attributable species mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: direct_species_ammonia_air. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
validation_rules:
  - rule_id: service_reference_check
    applies_to: "accepted_service"
    rule: "N>0 unique final accepted IDs with actual net whole latex, separate DRC/TSC/preservation/sampling/grade/period/buyer-gate qualifiers; 1 Item(s) is not a load, dry tonne, standard concentration or monetary unit."
    source_ids: []
  - rule_id: quality_boundary
    applies_to: "all route"
    rule: "Verify supplier final release before merchant operation and no hidden preservative addition, deliberate maturation, concentration, dilution, compounding or vulcanization. Actual transformed route even outsourced must be separately reviewed."
    source_ids: []
  - rule_id: stock_and_assay
    applies_to: "all merchandise and residue fates"
    rule: "Check whole-liquid vs dry rubber/TSC/volatile/species bases, sample/settling coverage, assay applicability, heels/recovered closing/internal transfers, actual commercial return/reject/waste decisions and unknown discrepancy investigation. No purewater/ammonia/airrelease inference from residual or SDS."
    source_ids: []
  - rule_id: upstream_loss_once
    applies_to: "service and commodity system"
    rule: "Every actual irrecoverable merchandise-loss quantity has compatible original commodity gate, measured basis/source and sole owner with existing-loss-coverage check; its upstream adjustment occurs once outside service before complete chain readiness. No 1wetkg=1drykg or default zero losses.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: resources_scope
    applies_to: "providers/assets/periods"
    rule: "Verify actual causal all-consumer drivers, provider native completion/unit and full scope, complete asset life/remaining evidence/replacement/end-of-life, meter/cleaning/idle freight/empty/reject coverage and unfinished-resource carry. No double normalization or repeated supply returns."
    source_ids: []
  - rule_id: fluid_species_treatment
    applies_to: "residues; wastewater; direct_species; direct_species_ammonia_air"
    rule: "Actual contained spill/residue, rinsewater, recovered merchandise and species/medium releases have disjoint stream/fate owners and once-only treatment. Verify compatible composition/factor/fate with real phase basis; no additive dryrubber/species characterization of same fluid or duplicate provider-included release."
    source_ids: []
  - rule_id: languages_projection
    applies_to: "all rules/cards/protocols"
    rule: "Raw bilingual reference fields/card names/IDs/units/evidence/collection raw operands/source URLs and ordered rules align with canonical projection. Concrete identity and final quantitative evidence require separate verification."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset only after actual complete foreground collection and concrete exchange verification"
  downstream_use: "One non-transforming merchant wholesale service add-on linked to a separate compatible original-gate natural-latex commodity system and its once-only measured loss adjustment."
  allowed_use: "The declared source-released preserved Hevea latex grade, tank/site/consignment and buyer gate, with actual whole-liquid mass, DRC/TSC/preservative/sampling and physical scope qualifiers."
  excluded_use: "Whole delivered-latex product footprint; plantation/primary processing or any deliberate merchant material transformation; compounded/vulcanized/synthetic latex; agency/retail; unknown commodity loss ownership or universal tankload/concentration values."
  required_metadata: "Own-account owner/site; source release and buyer gates; actual lot/tank/consignment/cohort/period IDs; inherited grade and preservative state; actual wet net mass, DRC/TSC methods/bases/results and sampling; actual holding/transfer times, provider/asset/freight/cleaning scope; stock heels/fates and original-gate commodity loss adjustment/sole owner"
  required_quality_disclosure: "Mass/volume calibration and density state where used; representative layer/transfer assay applicability/uncertainty; stock discrepancy and actual spill/residue handling; all-consumer full-life asset/remainder/provider/period scope; once-only commodity loss linkage; unresolved actual identity and Range evidence limits"
  update_trigger: "Changed source or latex grade/chemistry/state, tank/transfer/storage operation or quality method, deliberate concentration/preservation/compound activity, gate/owner, resource/provider/asset lifetime or observed stock/loss/effluent/release evidence"
data_sources:
  - id: "iso-latex-sampling-123"
    type: "standard"
    reference: "ISO 123:2001, Rubber latex — Sampling, public scope. https://www.iso.org/standard/23281.html"
    used_for: "Recognizes representative latex sampling in tanks/transport containers. Full method steps/counts not supplied by abstract and not claimed."
  - id: "iso-latex-drc-126"
    type: "standard"
    reference: "ISO 126:2005, Natural rubber latex concentrate — Determination of dry rubber content, public abstract. https://www.iso.org/standard/35176.html"
    used_for: "DRC assay identity/applicability, distinct from total solids; actual qualified method required, no inaccessible procedure or universal DRC limit."
  - id: "iso-latex-tsc-124"
    type: "standard"
    reference: "ISO 124:2014, Latex, rubber — Determination of total solids content, public abstract. https://www.iso.org/standard/61884.html"
    used_for: "Separate TSC test scope and method applicability; not rubber species, water purity or ammonia release evidence."
  - id: "thaitex-latex-specification"
    type: "handbook"
    reference: "THAITEX, Natural latex concentrate sale specification. https://www.thaitexgroup.com/latex/latex_specification.php"
    used_for: "Primary producer distinguishes DRC, TSC, nonrubber and ammonia on whole latex. Supplier values are product-specific sales criteria, not default quantities/grades/chemical recipes in this PCR."
  - id: "thaitex-latex-route"
    type: "handbook"
    reference: "THAITEX, Manufacturing process and quality control. https://www.thaitexgroup.com/latex/latex_manufacturing_flow.php"
    used_for: "Primary producer concentration, preservation and maturation/final adjustment precede tested dispatch. Distinguishes upstream material manufacture from subsequent merchant receipt/holding; numeric process examples not reused."
