allocation_rules:
  - rule_id: commodity_loss_interface
    applies_to: "latex merchandise"
    rule: "Record actual loss/outlet wet mass/state and matched DRC/TSC rather than infer a loss from stock residue. The separate original-gate commodity system owns its once-only measured upstream adjustment with quantity/unit/basis/source and existing-loss-coverage check. Dry-rubber and whole-latex basis must match that dataset; 1 wet kg is not 1 dry kg. All commodity manufacturing remains outside this service.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: actual_cohort
    applies_to: "all service resources"
    rule: "Use measured physical causal drivers across all actual contracts/lots/periods, not default equal shares or margin allocation. Retain resources for rejected/repeated events. Unfinished consignments keep actual open-cohort period resources until acceptance or final reject fate; never create N or disappear."
    source_ids: []
  - rule_id: shared_lifecycle
    applies_to: "shared_assets"
    rule: "asset_equivalent=(job_driver/life_driver)/N with a matching full lifecycle covering manufacture, maintenance, actual replacements, retirement and end-of-life. life_driver covers all consumers and periods using observed life/history or evidenced remainder with sources/uncertainty/sensitivity/update. No simultaneous per-driver service or duplicated manufacturer/carrier asset burden."
    source_ids: []
  - rule_id: supply_return_convention
    applies_to: "supplies and usable_returns"
    rule: "S=opening+net_receipts-closing; choose gross supply input S/N and separately record its actual matched unused outward-return output, OR consumed-only supply input (S-usable_outward_return)/N and omit that return exchange with no further deduction. Recovered closing is already closing. Nonreturned waste/loss supply burden remains; latex commercial returns stay in merchandise ledger, not avoided-production credits."
    source_ids: []
  - rule_id: fluid_fates
    applies_to: "latex/residue/wastewater and species"
    rule: "Pair internal transfers and separate usable returns/recovered closing, distinct contained fluid/residue wastes and actual environmental releases. Total spill is a nonadditive audit of those disjoint fates. Wet liquid, DRC dry-rubber/TSC characterization and species views are never added as duplicate physical outflows; no automatic credit for commercial recovery."
    source_ids: []
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "Gross-with-outlets is permitted only when every actual same-native-unit unused supply return has an explicit, matching concrete exchange. The defined return usable_returns_detergent_return uses Mass / kg and matches the formulation, supplied state and native mass of cleaning_chemicals_synthetic_detergent. For another actual returned supply without a matching concrete exchange, use consumed-only input and retain the matched outward transfer in the audit until its identity and native-unit exchange are resolved. Actual countable sampling/transfer consumables require their own specific identities and count evidence; do not represent them as detergent or convert their counts to detergent mass. Do not infer a missing return quantity as zero."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_latex
      process_id: "latex_wholesale"
      flow_role: "accepted consignment and non-exchange latex inventory/quality/loss"
      record_type: "latex_stock_quality_record"
