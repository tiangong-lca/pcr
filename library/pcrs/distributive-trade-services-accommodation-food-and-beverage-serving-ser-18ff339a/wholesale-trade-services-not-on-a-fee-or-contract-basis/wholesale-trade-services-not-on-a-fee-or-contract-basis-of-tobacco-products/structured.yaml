  calculation_rules:
    - id: normalize
      applies_to: "all inventory"
      rule: "Attributed physical quantity / positive N once; accepted_service is 1 Item(s)."
      inputs:
        - "attributed quantity"
        - N
        - "linked protocol"
      output: "exchange quantity per reference flow"
      source_ids: []
    - id: supply_stock
      applies_to: "supplies and usable_supply_return"
      rule: "S=attributed opening+true external net receipts-closing including retained recovered supplies. Choose gross supply INPUT S plus separate same-scope matched usable return OUTPUT OR consumed-only INPUT S-return with matching outward exchange omitted. Internal recovery is not new receipt; no numeric S+return input,second deduction or removal of waste/spill upstream burden."
      inputs:
        - opening
        - "external net receipts"
        - closing
        - "same-scope matched return"
        - representation
        - cp_supplies
      output: "nonduplicated supply/return quantities"
      source_ids: []
    - id: period_asset_share
      applies_to: "shared resources"
      rule: "Measured compatible-period resource share=cohort physical driver/all-consumer driver. Full-life asset equivalent=compatible cohort driver/complete lifetime driver across all users/periods; include manufacture,maintenance/cleaning,replacements and EOL once. Use observed lifetime or history plus evidenced remainder/termination,driver units,sources,sensitivity/update. A complete provider representation is an alternative to own covered burdens."
      inputs:
        - "measured resource"
        - "cohort/all-consumer/lifetime drivers and units"
        - "history/remainder source"
        - cp_power
        - cp_assets
      output: "attributed resource/full asset equivalents"
      source_ids: []
    - id: original_finished_gate
      applies_to: "commodity only outside service"
      rule: "ALL merchandise manufacture including tobacco,filter,paper and factory primary packaging for saleable and lost cigarettes is outside the service add-on. A compatible released sealed finished-cigarette baseline and quantified original-gate assigned demand/loss,existing coverage and owner must be integrated once outside service before whole-chain completeness. Actual loss handling/receiving treatment remains inside once. Reconcile attributed opening,net receipts,buyer returns,closing,accepted transfers,supplier returns,known discard and other external exits with exclusive states; quarantine and aggregation are internal moves. Map assigned finished-cigarette demand/loss to original gate with measured component/moisture/primary tare conversion,unit/basis/source and owner/already-included coverage. Raw cured leaf alone is not a finished-cigarette baseline."
      inputs:
        - "original finished dataset/gate"
        - "assigned demand"
        - "loss amount/unit/state/component/moisture/tare conversion/source"
        - "other exits"
        - "included coverage/owner"
        - "integration result"
        - cp_lots
      output: "quantified original finished-gate demand/loss burden outside service"
      source_ids: []
