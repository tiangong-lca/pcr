    - id: contained_effluent
      applies_to: "sealed_cigarette_trade"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only measured collected liquid with actual nicotine/tobacco/cleaner contamination where evidenced,at receiving treatment gate. Whole wet-solid waste and its liquid view are not additive outlets. Range evidence need: Need origin,volume,density/temperature,composition basis and receiver/treatment; no presumed tobacco leachate or wastewater from missing merchandise. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Assigned measured contained effluent / N; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_effluent_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_water; actual source-linked native records"
    - id: actual_direct_species
      applies_to: "sealed_cigarette_trade"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Expand only actual measured or supported substance/medium sources,such as real cleanup spills or releases. No smoking/combustion is in normal sealed trade; theft,odour,moisture deficit and product nicotine content are not released species amounts. Range evidence need: Need substance,medium,activity/factor units,bases,sources,composition and actual fate proof; complete species factors are not multiplied by composition/fate twice. Measurement evidence: protocol cp_species; original record basis Mass / kg. The original amount constraint “Assigned supported actual species release / N; cp_species.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_species; actual source-linked native records"
validation_rules:
  - rule_id: validate_completion
    applies_to: "accepted_service"
    rule: "Require actual own-account commercial B2Bacceptance,all qualifiers and positive unique N; warehouse scan,pack count,payment and excise do not alone complete the reference service."
    source_ids: []
  - rule_id: validate_hierarchy
    applies_to: "stock and traceability"
    rule: "Reconcile actual tracked parent-child identities and native sticks/pack/carton quantities with measured factors; no duplicated parent plus child merchandise quantities or fictitious stick identifiers. HMRC guidance is a jurisdiction-specific record example,not universal law,issuer,deadline or tax rule."
    source_ids:
      - hmrc-selling-storing
      - hmrc-id-issuer
  - rule_id: validate_loss
    applies_to: "commodity linkage"
    rule: "Require compatible released sealed finished-cigarette production/primarypack baseline with missing stages assembled once outside service,assigned original-gate loss quantity/unit/state/conversion/source and existing coverage owner/integration result. Theft or residual imbalance does not prove physical fate or dry-tobacco emission."
    source_ids: []
  - rule_id: validate_resources
    applies_to: "physical coverage"
    rule: "Verify native units/support,full asset life/all-user compatible drivers and own/provider/carrier/receiver boundaries once. Actual additional operated conditioning/fuel/fluids triggers scope expansion; no generic Energy substitute,fee-to-Count or blanket zero."
    source_ids: []
  - rule_id: validate_fates
    applies_to: "actual outputs"
    rule: "Require measured exclusive whole/part waste and actual receiver/treatment; specific direct species/activity/factor/composition/fate sources must be compatible. Nicotine content,odour,missing identifiers and moisture deficits are not release quantities."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
