      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Actual housekeeping water only,not a cigarette ingredient or prescribed humidification. Environmental abstraction requires its actual separate source and support. Range evidence need: Require actual supply,retention,contained effluent and any direct outfall/evaporation evidence; no residual water balance assigned automatically to air. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Measured assigned supply / N; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
