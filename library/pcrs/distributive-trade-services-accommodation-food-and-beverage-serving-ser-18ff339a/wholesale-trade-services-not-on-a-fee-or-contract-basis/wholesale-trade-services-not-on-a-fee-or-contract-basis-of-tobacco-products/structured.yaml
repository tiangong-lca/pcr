      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Count only actual contractually completed physical service jobs with complete electricity,IT/asset and operating scope. Other native provider units require their corresponding concrete exchanges,not monetary fees converted to Count. Range evidence need: Need provider gate,quantity unit,resource/IT/asset/transport coverage and overlap owner; a registration ID or paid excise alone does not establish a physical job. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “Attributed completed jobs / N; cp_provider.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
