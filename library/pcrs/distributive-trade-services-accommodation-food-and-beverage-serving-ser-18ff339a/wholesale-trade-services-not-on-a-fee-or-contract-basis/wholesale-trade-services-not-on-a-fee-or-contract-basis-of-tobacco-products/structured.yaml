    - id: warehouse_power
      applies_to: "sealed_cigarette_trade"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Actual electric handling,lighting,scanning,printing and attributable IT operation including standby and cleanup; no presumed conditioning load. Complete provider-included electricity is not added again. Range evidence need: Need actual meters,periods,device duties and all-consumer physical drivers; identifiers or transaction counts alone are not energy factors. Measurement evidence: protocol cp_power; original record basis Energy / kWh. The original amount constraint “Attributed measured electricity / N; cp_power.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: warehouse_power_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
