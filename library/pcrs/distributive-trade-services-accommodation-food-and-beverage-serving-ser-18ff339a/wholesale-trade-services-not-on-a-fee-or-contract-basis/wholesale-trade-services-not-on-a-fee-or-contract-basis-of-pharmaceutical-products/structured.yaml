  - rule_id: actual_final_merchant
    applies_to: "accepted_service"
    rule: "Require actual merchant_id/purchase/ownership/resale, named B2B buyer, FINAL gate/time/source/resolved reversals, unique FINAL N and all sixteen qualifiers. Receipts/invoices/doses/tablets/packages insufficient. Normalize only N>0; N=0 cancelled/failed/quarantined/unfinished resources retain period/cohort evidence."
