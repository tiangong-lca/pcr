    rule: "Per complete actual supplier lot/state choose actual direct measured/traced assigned_gate_demand with native quantity/unit/basis/method/state/time/source/direct proof/exclusive terminal links OR actual_source_gate_quantity×target_driver/source_all_terminal_driver. Positive COMPLETE denominator sums compatible competing FINALaccepted/usefulother/returns/closingcarry/proven actual-loss records, each quantity/unit/basis/method/state/time/source/link/owner. No accepted-only, unknown-loss zero or direct-driver overlay. Source/assigned/baseline/additional quantities and original-gate conversion match actual complete released tablet+pack state; explicit exclusive loss owner and identical baseline stage/loss coverage precede required additional demand linkage outside once."
    source_ids: []
  - rule_id: service_supply_stock
    applies_to: "service supplies"
    rule: "S=assigned opening+NET external receipts-closing including retained recoveries. Choose exactly one: (1) gross S/N as INPUT and actual matched unused external return/N as a separate OUTPUT; (2) consumed-only (S-return)/N as INPUT and OMIT that matched return OUTPUT. Do not add return quantity to input or deduct it twice. Internal loops/retained recoveries stay stock; actual wasted/consumed inputs retain burden. No inherited API/tablet/pack netting against unrelated current supply, negative inputs or automatic credits."
    source_ids: []
  - rule_id: complete_life_assets
    applies_to: "assets/providers"
    rule: "Assign complete manufacture/maintenance/real replacement/EOL with actual used_driver/COMPLETE lifetime_all_consumer_driver in compatible native units/bases/methods/states/times/sources. Observed history plus sourced remaining/termination, uncertainty/sensitivity/update and all consumers/periods are explicit. One asset-equivalent OR lifecycle-complete provider, never both or repeated N."
    source_ids: []
  - rule_id: nonadditive_actual_fates
    applies_to: "commodity/service fates"
    rule: "Whole packs retaining tablets, whole tablets/fragments/API/excipients/water/blister layers/cartons and mixed cleanup carrier/liquid/particles versus free liquid/direct species are non-additive/exclusive views. Actual receiver transport/treatment has one owner after provider coverage. Quarantine/expiry/return is a status until actual receiver disposition is evidenced, not automatic discard/emission. No recycling credit; no-acceptance resources remain outside FINAL N."
    source_ids: []
  - rule_id: commodity_link_scope
    applies_to: "nonexchange commodity interface"
    rule: "Keep actual original-gate stock and completed external integration at their recorded raw quantities. Declare source_assignment_scope_id, actual target_consignment_ids/target_cohort_id and source_assignment_quantity_basis: single_consignment_case, target_cohort_total or already_per_reference. For a raw target-cohort total, source_link_per_service_quantity=source_link_assigned_raw_quantity/same_target_scope_N ONLY when the positive N covers exactly that assigned target scope, with actual native units/state/source and acceptance-reversal evidence; use that interface once when combining with 1 accepted_service. A single-consignment case with N=1 and an already-per-reference quantity are not divided again. Do not divide actual external stock/stage-integration records by service N or use whole-source-cohort N for a narrower assigned target; preserve raw quantities and an explicit once-only link."
    source_ids: []
