  - rule_id: released_native_presentation
    applies_to: "commodity"
    rule: "Verify actual single-active paracetamol oral-tablet release/SKU/batch, label versus analytical strength unit/basis/assay coverage distinct from whole-tablet/excipient/water/pack, native counts/genealogy and seal/expiry/stated-observed condition sources. No example strength, expiry, pack size/layer mass, dose/treatment or new opening/assay/coldchain default."
