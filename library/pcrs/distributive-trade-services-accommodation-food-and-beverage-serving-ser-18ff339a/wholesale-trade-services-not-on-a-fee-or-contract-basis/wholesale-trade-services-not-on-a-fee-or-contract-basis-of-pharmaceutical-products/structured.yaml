      - zentiva-paracetamol-original-pack
  - rule_id: water_definition_match
    applies_to: "water/nonwater audit"
    rule: "For dry=m_as_received*(1-w_wet), w_wet is water/as-received mass only. Dry water/nonwater ratio converts r_dry/(1+r_dry) only matching actual definitions/sample after percent-to-ratio conversion. Other-volatile LOD is not water proof; incompatible/unknown basis blocks conversion, not zero. API or whole-tablet assay coverage must not be multiplied twice."
