validation_rules:
  - rule_id: real_final
    applies_to: "accepted_service"
    rule: "Verify actual merchant purchase/ownership/resale/B2Bbuyer/FINALgate/time/source/resolved reversals, unique FINAL N and all16qualifiers. Supplierreceipt, kitpiece/invoice/ratedcapacity/mowingarea insufficient. N0 canceled/failed/quarantined/unfinished resources retained by period/cohort, no division."
    source_ids: []
  - rule_id: actual_kit_state
    applies_to: "commodity"
    rule: "Verify new manualpush reel/cylinder actual complete sourceSKU-kit/included-optional/attached-detached/shippingassembly/factorycontents-finish/originalpack and parent-child native genealogy. Factory bladesetting not fullyassembled handle/basket gate or merchant assembly/mowtest/repair/preservation. No poweredgoods/basket/mass/grade/dimensions/clearance/width/height/capacity/warranty defaults."
    source_ids:
      - gardena-manual-cylinder-mower
  - rule_id: native_measurement
    applies_to: "commodity"
    rule: "Check every kit/mower/member/component/contents/finish/water/stock and source quantity native unit/basis/method/state/sampletime/source, EACH/TOTAL and actual genealogy/factors, wholeparent-children nonadditive. Compatible net/gross/tare retains included members/contents. Water-only same-sample wet/dry definitions percentfirst, LOD other volatiles not water/emission; actual density/temperature-unit/source only, no unknownzero."
    source_ids: []
  - rule_id: complete_source_integration
    applies_to: "commodity interface"
    rule: "Use direct actual tracing OR positive, COMPLETE competing terminal records for final accepted outputs, useful other exits, returns, closing stock and proven loss, each with quantity, unit, basis, method, state, time, source, link and owner. Do not use accepted outputs alone or overlay driver allocation on direct assignment. Actual source, assigned, baseline and additional states, units, native conversions and exclusive loss ownership must match the complete actual kit shipping gate. Reconcile identical baseline stage/loss coverage, then ACTUALLY integrate required additional demand and missing stages once outside the service, retaining native integration quantity, status, link, time, source and owner. Pending integration is not complete-chain readiness."
    source_ids: []
  - rule_id: resource_once
    applies_to: "service resources"
    rule: "All-user/period fullasset life observed+sourcedremaining/termination/native drivers/uncertainty/update, one asset OR lifecycleprovider/N once. NETmaterial receipts exclude containertare, grossS+matchedunusedreturn OR consumed-only OMIToutlet, no unrelatednegativeinput/credit. Freightcompletecontents/allcargopacks retained ONLYvehicle/noncargotare, nativegross/tare/EACH-TOTAL/THATrecordshare INSIDEsum beforepositiveFINALNonce; N0 retained."
    source_ids: []
  - rule_id: actual_receiver_species
    applies_to: "manual_mower_wholesale"
    rule: "Link actual batch/period cleaning, changeovers, idle time, cancelled, failed, rejected, quarantined and unfinished work, dispatch and final acceptance, and missing parts, condition, returns, pending decisions, samples and discard to the actual receiver and owner once. Whole kits, separate parts, contained contents, mixed cleaning waste, free fluid and direct species are exclusive, non-additive views where they overlap. Count actual receiver transport and treatment once. Do not assume draining, recycling or that a deficit means an emission or zero; do not reapply fractions already covered by a complete species factor."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity/completeness review"
  downstream_use: "Physical manual-cylinder-mower wholesale add-on, separately completed original complete actualsupplier-kit shippinggate demand/loss integration outside once"
  allowed_use: "Actual new manualpush reel/cylinder lawnmower complete supplier SKU-kit AT actual attached-detached shippingstate/originalpack, ambient owned/resold FINAL B2B consignment with native genealogy/quantity/state evidence"
  excluded_use: "Standalone product/use/mowingcapacity/performance/life claim; powered/battery/robotic/rideon/other machinery; merchant assembly/mowtest/sharpening/repair/refillgrease/preservation/repack/consumeruse; retail/agency/storageonly"
  required_metadata: "Merchant purchase/ownership/resale/B2Bbuyer/FINALgate-source/reversals/N, actualSKU/lot kit-parent/mower/memberIDs/inclusions-optional/attached-detached/shippingassembly/factorysettings/BOM/materials-contents-finish/basket-source/originalpack/nativecount-net-gross-tare/independentcomponent-method-state-time-source, siteperiod/duration, complete source-terminal-baseline-additional integration links/owner and resource/provider/asset/freight/receiver scope"
  required_quality_disclosure: "Identity/support/evidence-age/SKU applicability/kit-inclusions/shippingstate/FINAL-reversal/condition/measurement/genealogy/source-terminal-baseline-integration/loss/fate/lifetime/provider uncertainties and actual native conversions/row-specific evidence needs"
  update_trigger: "Actual mower/SKU/kit/inclusions/assemblystate/mechanism/contents/finish/pack/nativequantity/acceptance changes or new merchantassembly/test/repair/preservation/use; sourceassignment/baseline/integration/provider/asset/freight/receiver/nativeconversion/evidence changes"
data_sources:
  - id: "unsd-cpc3-manual-mower-wholesale"
    type: "official_guidance"
    reference: "UNSD CPC3 explanatory notes (30June2025),44121 and61086 printed308. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification only; manual reel/cylinder lawnmower within44121/group441 is a narrower61086 subset, not all agricultural goods."
  - id: "gardena-manual-cylinder-mower"
    type: "official_guidance"
    reference: "GARDENA Manual Push Lawnmower Plus400 current manufacturer product/specification page. https://www.gardena.com/int/products/lawn-care/cylinder-lawnmowers/manual-push-lawnmower-plus-400/970828101.html"
    used_for: "Qualitative manual-cylinder/factory blade setting versus handle/basket assembly and actual SKU-kit/inclusion/shippingstate questions only. No universal fullyassembled gate, basket inclusion, bladecount/clearance/width/capacityarea/heights/mass/grade/grease recipe/warranty/life or consumer mowing/merchant assembly/test/maintenance defaults."
