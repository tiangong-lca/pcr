      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| physical_all_users | service resources | Direct actual trace OR quantity×compatible target_driver/positive COMPLETE all_consumer_driver with each native unit/basis/method/state/time/source. Include all clients/periods/idle/changeover/cancelled/failed/quarantined/unfinished resources. N=unique real FINAL B2B acceptance after purchase/ownership/resale and reversals; assigned total/N once only N>0, N0 retain burden-period-cohort. No mowerpiece/ratedarea/price default driver. |  |\n| source_terminal_actual | commodity interface | Choose direct actual measured/traced assigned_gate_demand with quantity/unit/basis/method/state/time/source/direct evidence/exclusive terminal links OR actual_source_gate_quantity×target_driver/source_all_terminal_driver. Positive COMPLETE denominator includes compatible competing FINALaccepted/usefulother/returns/closingcarry/provenloss eachquantity/unit/basis/method/state/time/source/link/owner. No accepted-only or direct-driver overlay; unknown loss not zero. Source/assigned/baseline/additional native states/quantities/conversions/exclusive loss owner match actual complete supplier SKU-kit shippingstate. After identical baseline stage/loss coverage required additional gate demand AND missing stages must be quantified and actually integrated outside once, with integration quantity/native metadata/status/link/time/source/owner; pending integration blocks complete-chain readiness. |  |\n| supply_convention | service supplies | S=assignedopening+NETexternalreceipts-closing including retained recoveries. Receipts are actual material excluding supply-container tare, not gross package mass. Choose exactly one: (1) gross S/N as INPUT and actual matched unused external return/N as a separate OUTPUT; (2) consumed-only (S-return)/N as INPUT and OMIT that matched return OUTPUT. Do not add return quantity to input or deduct it twice. Internal loops/recovery remain closing; no inherited mower grease/parts/pack recovery against unrelated inputs, negative netting or automatic credit. |  |\n| asset_complete_life | assets/providers | Actual used_driver/COMPLETE lifetime_all_consumer_driver with compatible native unit/basis/method/state/time/source assigns full manufacture/maintenance/real replacement/EOL to every consumer-period. Observed+sourced remaining/termination uncertainty/sensitivity/update; one asset-equivalent OR lifecycle-complete provider/N once. Traded mower/warranty/ratedarea not asset-lifetime evidence. |  |\n| exclusive_receiver_fates | all fates | Wholekit/mower retaining members/contents/finish versus independent part/pack, mixedcleanup carrier-absorbedliquid-fragments, free contained liquid and directspecies are exclusive/nonadditive views. Each actual receiver transport/treatment one owner after provider coverage. Quarantine/return/pending not automatic waste/release/recoverycredit. Semisolid grease not assumed free liquid or drained. |  |\n| commodity_link_scope | nonexchange commodity interface | Keep actual original-gate stock and completed external integration at their recorded raw quantities. Declare source_assignment_scope_id, actual target_consignment_ids/target_cohort_id and source_assignment_quantity_basis: single_consignment_case, target_cohort_total or already_per_reference. For a raw target-cohort total, source_link_per_service_quantity=source_link_assigned_raw_quantity/same_target_scope_N ONLY when the positive N covers exactly that assigned target scope, with actual native units/state/source and acceptance-reversal evidence; use that interface once when combining with 1 accepted_service. A single-consignment case with N=1 and an already-per-reference quantity are not divided again. Do not divide actual external stock/stage-integration records by service N or use whole-source-cohort N for a narrower assigned target; preserve raw quantities and an explicit once-only link. |  |\n\n\n"
