_total_reconciliation"
      collection_method: "Identify actual SKU, kit parent, mower and member IDs; included versus optional and attached versus detached members; manual reel/cylinder identity; and factory settings in the actual shipped state and original packaging. Factory settings do not prove that a handle or basket is fully assembled. Independently measured cylinders, knives, handles, wheels, frames, mechanisms, factory contents, bags, finishes and packaging require their own quantity, state, identity, unit, basis, method, sampling time, source and representative population. Kit, mower and member counts and genealogy conversions each retain native metadata. Multiply an EACH quantity by its actual repeat count once; leave a TOTAL quantity unchanged. Record actual_repeat_count with its independent native count unit, basis, method, state, sampling time and source. Do not sum a parent with its included children or equate a missing member with whole-kit loss. Complete shipped net mass equals compatible gross mass minus external packaging tare and retains supplied members and contents; it is not automatically bare chassis mass. Density conversions require actual material, state, temperature_unit and source. Distinguish water-only wet/dry definitions and percentage conversion sources from LOD that includes other volatiles. Existing records or representative measurements do not mandate merchant assembly, unpacking, dismantling, mowing tests or draining. Shared stock metadata covers compatible opening stock, supplier external receipts, buyer returns, closing stock, business-buyer dispatch, supplier returns, useful other exits, actual discard and net sample removal. Receipts exclude buyer returns and internal moves; dispatch excludes other recorded exits; internal moves cancel. Native source, assigned, baseline and additional metadata and direct actual tracing OR positive, COMPLETE terminal drivers, including closing stock, returns, useful other exits and proven loss, must match the complete actual factory-release kit gate. Each terminal record needs quantity, unit, basis, method, state, time, source, link and owner, with original-state conversions, exclusive loss ownership and identical baseline coverage. Integrate required additional demand and missing stages once outside the service, retaining native integration quantity, status, link, time, source and owner; pending integration blocks complete-chain readiness. Actual separately collected semisolid factory contents, grease or finish residues, if present, use discarded_mowers as Waste / Mass with their receiver and native state, not free-liquid volume or duplicate whole-kit/mixed-waste views. An unknown residual is not a measured loss, emission or zero. Attribute only the individually identified physical case; retain other source-linked actual fates separately. Each native record belongs to exactly one exchange and any whole total is a non-additive audit."
      unit: "Actual native kit/mower/member counts, complete net/gross/tare/component/contents/moisture/finish units"
      frequency: "Each actual event/meter interval, originals traceable"
