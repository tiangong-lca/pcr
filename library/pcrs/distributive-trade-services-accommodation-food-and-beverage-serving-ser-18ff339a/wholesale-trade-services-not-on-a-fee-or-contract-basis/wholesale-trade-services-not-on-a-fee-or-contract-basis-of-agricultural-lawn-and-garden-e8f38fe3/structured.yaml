      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| real_FINAL | accepted_service | Verify actual merchant purchase/ownership/resale/B2Bbuyer/FINALgate/time/source/resolved reversals, unique FINAL N and all16qualifiers. Supplierreceipt, kitpiece/invoice/ratedcapacity/mowingarea insufficient. N0 canceled/failed/quarantined/unfinished resources retained by period/cohort, no division. |  |\n| actual_kit_state | commodity | Verify new manualpush reel/cylinder actual complete sourceSKU-kit/included-optional/attached-detached/shippingassembly/factorycontents-finish/originalpack and parent-child native genealogy. Factory bladesetting not fullyassembled handle/basket gate or merchant assembly/mowtest/repair/preservation. No poweredgoods/basket/mass/grade/dimensions/clearance/width/height/capacity/warranty defaults. | gardena-manual-cylinder-mower |\n| native_measurement | commodity | Check every kit/mower/member/component/contents/finish/water/stock and source quantity native unit/basis/method/state/sampletime/source, EACH/TOTAL and actual genealogy/factors, wholeparent-children nonadditive. Compatible net/gross/tare retains included members/contents. Water-only same-sample wet/dry definitions percentfirst, LOD other volatiles not water/emission; actual density/temperature-unit/source only, no unknownzero. |  |\n| complete_source_integration | commodity interface | Use direct actual tracing OR positive, COMPLETE competing terminal records for final accepted outputs, useful other exits, returns, closing stock and proven loss, each with quantity, unit, basis, method, state, time, source, link and owner. Do not use accepted outputs alone or overlay driver allocation on direct assignment. Actual source, assigned, baseline and additional states, units, native conversions and exclusive loss ownership must match the complete actual kit shipping gate. Reconcile identical baseline stage/loss coverage, then ACTUALLY integrate required additional demand and missing stages once outside the service, retaining native integration quantity, status, link, time, source and owner. Pending integration is not complete-chain readiness. |  |\n| resource_once | service resources | All-user/period fullasset life observed+sourcedremaining/termination/native drivers/uncertainty/update, one asset OR lifecycleprovider/N once. NETmaterial receipts exclude containertare, grossS+matchedunusedreturn OR consumed-only OMIToutlet, no unrelatednegativeinput/credit. Freightcompletecontents/allcargopacks retained ONLYvehicle/noncargotare, nativegross/tare/EACH-TOTAL/THATrecordshare INSIDEsum beforepositiveFINALNonce; N0 retained. |  |\n| actual_receiver_species | manual_mower_wholesale | Link actual batch/period cleaning, changeovers, idle time, cancelled, failed, rejected, quarantined and unfinished work, dispatch and final acceptance, and missing parts, condition, returns, pending decisions, samples and discard to the actual receiver and owner once. Whole kits, separate parts, contained contents, mixed cleaning waste, free fluid and direct species are exclusive, non-additive views where they overlap. Count actual receiver transport and treatment once. Do not assume draining, recycling or that a deficit means an emission or zero; do not reapply fractions already covered by a complete species factor. |  |\n| validate_concrete_identity_decisions | all inventory rows | Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required. |  |\n\n"
