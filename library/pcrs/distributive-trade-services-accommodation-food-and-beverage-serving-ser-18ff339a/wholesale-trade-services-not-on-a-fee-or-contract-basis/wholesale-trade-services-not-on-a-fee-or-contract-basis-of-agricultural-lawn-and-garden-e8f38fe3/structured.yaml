      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual new complete factoryfinished manualpush reel/cylinder mower supplier SKU-kit AT ACTUAL shipping assembly/attached-detached member/finish-contents/originalpack/native quantity-state |\n| starting_condition_role | Inherited complete finished supplied merchandise, not forced fullyassembled machine or new merchant assembly/mowing/asset |\n| product_classification_scope | Narrower61086 via44121 within441 only, not all agricultural/forestry/tractor/powered goods |\n| recursive_input_rule | Traded mower-kit/parts/inherited grease-ifactual/finish/moisture/originalpack and real returns/closing remain nonexchange audit, not service-consumed materials/grease or warehouse capital. |\n| upstream_dataset_requirement | Match complete actual material/component manufacture/forming/finish/factoryassembly AT ACTUAL SHIPPINGSTATE/release/originalpack gate, with actual kit member/contents/BOM ownership. Rawsteel or component basket alone inadequate. Any missing upstream stages and required extra original-gate demand must be actually integrated outside once with same baseline stage/loss coverage before chain readiness. |\n| disclosure | Actual SKU/kit-parent/member inclusions-attached/detached/assemblystate/factorysettings/contents/finish/pack/count/net-gross-tare/component native method-state-time-source, FINAL/time, original source/terminal/baseline/additional integration evidence and resource/provider/asset/freight/receiver owners/unknowns |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| source_actual_state | commodity interface | Complete actual finished manufacture/release/pack AT ACTUAL shippingstate including lost upstream remains outside. After identical baseline stage/loss coverage original-gate demand is quantified and actually integrated outside once, actual service/receiver transport/treatment once. |  |\n| source_options | manual_mower_wholesale | GARDENA current page supports manual cylinder/factory blade-setting versus handle/basket assembly configuration questions only. No fullyassembled gate, basket inclusion or merchant assembly/mowing assumed; do not merge family images/options or default bladecount/clearance/width/lawncapacity/height/warranty/mass/grade/recipe. | gardena-manual-cylinder-mower |\n| unknown_not_fate | stock state | Missing part/rust/bend/dampness/contained grease residue/unknown deficit differs from actual wholemower or part discard, not whole replacement/loss/species release/zero. No default dismantling/draining/recycling. |  |\n\n\n"
