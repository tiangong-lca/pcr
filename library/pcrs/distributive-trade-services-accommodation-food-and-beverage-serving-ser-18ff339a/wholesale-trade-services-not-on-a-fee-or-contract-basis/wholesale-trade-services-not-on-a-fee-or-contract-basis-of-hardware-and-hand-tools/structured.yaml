      requirement: "Disclose actual FINAL/reversal/cohort, tool-set membership/state, source-equivalence/terminal/baseline coverage gaps, unknown stock/loss/fates, provider/receiver/full-life asset assumptions and row-specific evidence needs. N=0 resources remain; candidate wording is not final data/chain readiness."
      evidence: "Actual source/coverage/native records, lifetime evidence and sensitivity/update"
    - id: electricity
      applies_to: "wrench_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Meter real warehouse lighting, handling and business support; do not import forging, machining, heat treatment, plating/polishing, repair, product torque tests or use. Range evidence need: Need actual meters/intervals/native records and complete all-user/event shares including idle/failed work, matched provider scope; no manufacturing kWh or nominal quantity per wrench. Measurement evidence: protocol cp_energy; original record basis Energy / kWh. The original amount constraint “Actual exclusively assigned physical amount / N under cp_energy” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_energy; actual source-linked native records"
    - id: facility_water
      applies_to: "wrench_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Include actual hygiene/support water from the supplier, separate from inherited finish/protection and downstream cleaning/use. No merchant tool washing, plating bath or test water is assumed. Range evidence need: Need purpose/source, native meter/receipt interval and actual water fates; received quantity or damp pack does not equal wastewater. Measurement evidence: protocol cp_supplies; original record basis Volume / m3. The original amount constraint “Actual exclusively assigned physical amount / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: facility_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: new_outer_protection
      applies_to: "wrench_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Only real added cartons, film, separators, straps and labels enter here; original supplier trays/holders/wraps, if present, are inherited merchandise presentation. Reusable handling units use full-life asset service. Range evidence need: Need actual new-versus-inherited pack level/SKU/net mass or evidenced native-count conversion with provenance; no new full holder/carton/pallet per tool or consignment. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual exclusively assigned physical amount / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: new_outer_protection_pe_film; new_outer_protection_paperboard_carton. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: operating_supplies
      applies_to: "wrench_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand actual equipment lubricants, facility cleaners, wipes, absorbents, filters and administrative consumables by native SKU/use. Factory chromium finish or inherited protective material is not new service metal/chemical input; no tool polishing/coating/repair is introduced. Range evidence need: Need actual SKU/purpose/net stock/composition and spent-carrier/absorbed-liquid/collected-fragment sources where work occurred; chrome appearance does not measure purchased chemical or emitted species. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual exclusively assigned physical amount / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: operating_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: fuel_supply
      applies_to: "wrench_wholesale"
      requirement: "Which purchased fuel grade/formulation and supply gate are on the stock record? Identify any fuel other than the named diesel case and its native unit; obtain actual density before a volume-to-mass conversion. Separate actual fuel supply stock/grade from burn, usable return and nonburned waste after checking provider/transport inclusion. Manufacturer process fuel is outside this merchant gate. Range evidence need: Need native stock/fates and actual compatible density/temperature/conversion sources; purchases alone cannot establish fuel burn. Measurement evidence: protocol cp_supplies; original record basis Volume / L. The original amount constraint “Actual exclusively assigned physical amount / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: fuel_supply_diesel_supply. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_services
      applies_to: "wrench_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Record completed handling/storage/document-visual identity/condition/completeness and facility/business-support results in actual physical units. Source standards or geometry tables do not evidence new merchant torque, hardness, corrosion or coating tests. Range evidence need: Need performed result/method/native unit/source and materials/energy/assets/freight/treatment scope; representative condition samples retain removal/return/fate, with no hidden polishing/repair/use or every-tool test. Measurement evidence: protocol cp_providers; original record basis Count / Item(s). The original amount constraint “Actual exclusively assigned physical amount / N under cp_providers” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_providers; actual source-linked native records"
    - id: shared_assets
      applies_to: "wrench_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Include actual buildings/racks/lifts/meters/ICT/reusable cases/pallets across all users and periods, with complete manufacture/maintenance/replacement/EOL. Traded wrenches or their supplier holders are not automatically warehouse capital. Range evidence need: Need used/observed/remaining/lifetime drivers each native unit/basis/method/state/time/source, observed history plus sourced remainder/termination and uncertainty/sensitivity/update; no generic asset years or full replacement every shipment. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual exclusively assigned physical amount / N under cp_assets” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "wrench_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Use actual complete finished tools, included components and original/added cargo packs with retained state. Measured vehicle gross removes only vehicle/noncargo tare; reconcile delivered/provider/empty-return coverage. Range evidence need: Need unique load-leg native payload/gross/tare/distance, EACH/TOTAL and THAT-record share inside sum, conversion units/bases/sources; no raw-steel-only or nominal weight-per-size cargo. Measurement evidence: protocol cp_freight; original record basis Mass*distance / kg*km. The original amount constraint “Actual exclusively assigned physical amount / N under cp_freight” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: environmental_water
      applies_to: "wrench_wholesale"
      requirement: "Identify the actual abstraction point, water body/aquifer, location and measured source volume from intake permits/meter records. Surface water and groundwater require distinct source identities; no direct withdrawal is established by purchased water use. Only real merchant-operated source abstraction crosses this boundary; purchased water, original protective state and manufacturer plating water are distinct. Range evidence need: Need actual source/location/interval/native volume and extraction coverage; corrosion marks or damp protection cannot quantify withdrawn water. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual exclusively assigned physical amount / N under cp_fates” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: usable_supply_returns
      applies_to: "wrench_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Use actual same-scope standalone supply SKU/state transfer only. Consumed-only input OMITs its matched return exchange. Internal loops/retained recoveries are closing; wrench/fragment/coating/original-pack returns remain commodity stock. Range evidence need: Need actual recipient/native transfer and matched original input/provenance; no inherited finish netted against unrelated current supplies, negative input or automatic scrap credit. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual exclusively assigned physical amount / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_supply_returns_detergent_return; usable_supply_returns_pe_film_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: discarded_wrenches
      applies_to: "wrench_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Use actual receiver quantities/state for discarded whole tools, separated real fragments or mixed original packs. Whole tool, steel/coating and pack audits are non-additive. Surface scratch, plating damage or one missing tool in a pack does not establish whole-tool/set discard or replacement manufacturing. Range evidence need: Need actual disposition/tool-set genealogy/native mass/count/state/net-tare and receiver/treatment with sourced original-gate correspondence; unaccounted weight is not steel/coating loss or direct chromium emission. Measurement evidence: protocol cp_tools; original record basis Mass / kg. The original amount constraint “Actual exclusively assigned physical amount / N under cp_tools” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: discarded_wrenches_atomic_case; discarded_wrenches_wrench_fragment. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_tools; actual source-linked native records"
    - id: other_wastes
      applies_to: "wrench_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Capture actual spent wipes/absorbents/filters/service-added packs or mixed cleanup debris. Carrier/absorbed liquid/collected metal-coating-pack fragments are views of the received mixture; no manufacturing swarf, plating sludge or polishing dust is assumed. Range evidence need: Need received mixed mass, each carrier/liquid/fragment native unit/basis/method/state/time/source, actual composition and treatment owner; purchases or inherited finish do not measure spent waste. Measurement evidence: protocol cp_fates; original record basis Mass / kg. The original amount constraint “Actual exclusively assigned physical amount / N under cp_fates” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: other_wastes_spent_wipe. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: contained_wastewater
      applies_to: "wrench_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Measure real collected free liquid transferred to treatment from performed warehouse work, separate from absorbed liquid in mixed solids or product/pack state. No tool-wash/plating/polish effluent is introduced. Range evidence need: Need actual collected/received native volume/composition/event/source and receiver transport/treatment; supplied water or wet wipes are not a wastewater-volume proxy. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual exclusively assigned physical amount / N under cp_fates” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: water_outfalls
      applies_to: "wrench_wholesale"
      requirement: "Identify the direct outfall and receiving water/soil compartment, measured water amount and independently analysed pollutant species. A sewer transfer to treatment is not this outfall; the missing receiving compartment prevents a concrete elementary-flow selection. Only actual direct discharge to a documented receiving medium is represented. Contained transfer is Waste; manufacturer effluent and downstream user cleaning are outside this service. Range evidence need: Need actual location/interval/medium/native volume and composition/fate/source/conversion evidence; a stain or rinse assumption cannot establish outfall. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual exclusively assigned physical amount / N under cp_fates” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: direct_species
      applies_to: "wrench_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Expand actual measured or compatible method-supported chemical/species/particle size and medium from real burn, maintenance or incidents. Chrome plating, steel/alloy content, surface wear/marks or unknown mass loss does not establish chromium oxidation state, Cr(VI), metal dust, VOC or CO2 release. Range evidence need: Need actual chemical/oxidation-state where relevant/medium evidence and native measurement or activity-factor units/bases/method/state/time/source with factor coverage; composition/fate/conversion only as needed once, no generic coating-release factor. Measurement evidence: protocol cp_releases; original record basis Mass / kg. The original amount constraint “Actual exclusively assigned physical amount / N under cp_releases” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_releases; actual source-linked native records"
