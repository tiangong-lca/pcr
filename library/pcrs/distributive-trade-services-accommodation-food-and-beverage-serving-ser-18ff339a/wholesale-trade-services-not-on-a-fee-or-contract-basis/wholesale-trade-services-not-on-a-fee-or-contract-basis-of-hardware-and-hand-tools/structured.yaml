  calculation_rules:
    - id: final_service_resources
      applies_to: "all service cards"
      rule: "N=unique actual FINAL business acceptance after reversals for actual merchant purchase/ownership/resale. Assign real direct event OR quantity×compatible target_driver/positive COMPLETE all_consumer_driver with native unit/basis/method/state/time/source, retaining all cancelled/failed/rejected/unfinished/idle/other-client/period resources. Assigned total/N once only for N>0; N=0 retains burden-period-cohort evidence without division."
      inputs:
        - cp_consignment
        - cp_energy
        - cp_supplies
        - cp_assets
        - cp_providers
        - cp_freight
        - cp_fates
        - cp_releases
      output: "Actual per-reference physical service inventory"
      source_ids: []
    - id: tool_set_stock_state
      applies_to: "commodity audit"
      rule: "Compatible native stock: opening+supplier_external_receipts+buyer_returns-closing-business_buyer_dispatch-supplier_returns-useful_other_exits-actual_discard-net_sample_removal=unknown_residual. Supplier receipts exclude buyerreturn/internal moves; buyer dispatch excludes other exits; internal moves cancel. Actual tool-set/fragment/steel/coating/pack genealogy and independent component measurements remain non-additive; no set=tool, missing member/scratch/residual=whole loss/species or zero."
      inputs:
        - cp_tools
      output: "Actual complete stock/exits and explicit unknown state"
      source_ids: []
    - id: original_complete_source
      applies_to: "commodity interface"
      rule: "Choose actual direct traced/measured original-gate assigned quantity and exclusive terminal proof OR Qsource_actual×Dtarget/Dall_terminal. Dall_terminal>0 equals complete compatible competing FINALaccepted/usefulother/returns/closingcarry/provenloss records each quantity/unit/basis/method/state/time/source/link/owner, never accepted-only or direct-driver overlay. Source/assigned/baseline/additional native quantity-unit-state metadata and sourced conversions must agree; explicit loss owner and identical already-covered baseline stage/loss demand precede outside once-only linkage of required additional complete finished-tool demand."
      inputs:
        - cp_tools
        - cp_consignment
      output: "Separate complete original-gate demand/loss adjustment"
      source_ids: []
    - id: record_level_freight
      applies_to: "freight"
      rule: "Each unique load-leg uses measured packedcargo OR same-state gross minus ONLY vehicle/noncargo tare, retaining all cargo packs/included components/state, not duplicate component audits. EACH multiplies evidenced repeat count once, TOTAL unchanged. After native conversion, assigned kg*km=sum(unique load-leg: actual_packed_payload_kg×actual_distance_km×that_record_share). THAT-record complete compatible all-user share is INSIDE sum; /positive FINAL N once unless already normalized, retaining N=0 burdens without division."
      inputs:
        - cp_freight
        - cp_consignment
      output: "Actual unique per-reference freight"
      source_ids: []
    - id: species_method
      applies_to: "direct_species"
      rule: "Actual identified species/particle/medium/oxidation-state quantity=measurement OR compatible actual activity×factor with native unit/basis/method/state/time/source and factor coverage. Composition/fate/gas-concentration conversions apply only if needed once with relevant temperature-pressure units/sources. Chrome/alloy content or unknown mass difference is not emitted Cr(VI)/dust/other species."
