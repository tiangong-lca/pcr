      requirement: "Require independent original/assigned/baseline/additional source demand, stock/component/fate and used-observed-remaining-lifetime asset drivers, cargo/gross/tare/distance/share native unit/basis/method/state/time/source. Explicit conversion and representative component/sample/density-temperature evidence only when used, never fabricated."
