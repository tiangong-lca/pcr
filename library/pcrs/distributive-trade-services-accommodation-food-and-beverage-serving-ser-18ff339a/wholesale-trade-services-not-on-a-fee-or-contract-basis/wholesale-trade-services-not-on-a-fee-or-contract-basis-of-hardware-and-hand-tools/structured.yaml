      requirement: "Resolve actual complete SKU/tool-set/steel/finish/native component and each physical service/provider/source/receiver/species identity/support before final exchanges. Count chain is measurement support, not commercial service or tool identity."
      evidence: "Actual manufacturer/lot/BOM/merchant records, verified details and compatible support"
    - id: all_native_operands
