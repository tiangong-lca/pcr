    source_ids: []
  - rule_id: native_finished_source
    applies_to: "commodity interface"
    rule: "Per complete actual source lot/state choose direct measured/traced assigned_gate_demand with native quantity/unit/basis/method/state/time/source/direct evidence/exclusive terminal links OR actual_source_gate_quantity×target_driver/source_all_terminal_driver. Positive complete denominator sums compatible competing FINAL-accepted/useful-other/returns/closing-carry/proven actual-loss terminal records, each quantity/unit/basis/method/state/time/source/link/owner. No accepted-only or direct+driver overlay; unknown loss is not zero. Actual source/assigned/baseline/additional demand and conversion stay native-state compatible, exclusive loss ownership and identical baseline stage/loss coverage explicit; required additional complete finished tool demand linked outside service once."
    source_ids: []
  - rule_id: net_stock_return_choice
    applies_to: "service supplies"
    rule: "S=assigned opening+NET external receipts-closing including retained recoveries. Choose exactly one: (1) gross S/N as INPUT and actual matched unused external return/N as a separate OUTPUT; (2) consumed-only (S-return)/N as INPUT and OMIT that matched return OUTPUT. Do not add return quantity to input or deduct it twice. Internal loops/retained recoveries are stock. Actual wasted/consumed inputs retain burdens. No unrelated negative netting, inherited tool/coating/pack subtraction from current supplies or automatic scrap credit."
    source_ids: []
  - rule_id: life_asset_scope
    applies_to: "assets/providers"
    rule: "Allocate complete manufacture/maintenance/real replacement/EOL through actual used_driver/COMPLETE lifetime_all_consumer_driver with compatible native unit/basis/method/state/time/source. Lifetime records include observed history plus sourced remaining/termination and uncertainty/sensitivity/update, across all consumers/periods. Choose one asset-equivalent OR lifecycle-complete provider, never both or N twice."
    source_ids: []
  - rule_id: exclusive_fate_views
    applies_to: "all actual fates"
    rule: "Whole tools/sets/fragments/steel/coating/pack and cleanup carrier/absorbed-liquid/collected fragments versus free liquid/direct species are exclusive/non-additive views. Actual receiver transport/treatment has one owner after provider coverage. Rejected/cancelled/unfinished activity retains resource attribution and is not FINAL accepted output; no automatic recycling credit."
    source_ids: []
