      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| all_user_event_allocation | all service resources | Use actual direct event ownership or actual quantity×compatible target_driver/positive COMPLETE all_consumer_driver, recording native unit/basis/method/state/time/source across all clients/periods. Include idle/changeover/cancelled/failed/rejected/unfinished burdens and carry. FINAL N is actual unique business acceptance after reversals; assigned total/N once only for N>0. At N=0 retain resource/period/cohort evidence without division, never price/margin drivers by default. |  |\n| native_finished_source | commodity interface | Per complete actual source lot/state choose direct measured/traced assigned_gate_demand with native quantity/unit/basis/method/state/time/source/direct evidence/exclusive terminal links OR actual_source_gate_quantity×target_driver/source_all_terminal_driver. Positive complete denominator sums compatible competing FINAL-accepted/useful-other/returns/closing-carry/proven actual-loss terminal records, each quantity/unit/basis/method/state/time/source/link/owner. No accepted-only or direct+driver overlay; unknown loss is not zero. Actual source/assigned/baseline/additional demand and conversion stay native-state compatible, exclusive loss ownership and identical baseline stage/loss coverage explicit; required additional complete finished tool demand linked outside service once. |  |\n| net_stock_return_choice | service supplies | S=assigned opening+NET external receipts-closing including retained recoveries. Choose exactly one: (1) gross S/N as INPUT and actual matched unused external return/N as a separate OUTPUT; (2) consumed-only (S-return)/N as INPUT and OMIT that matched return OUTPUT. Do not add return quantity to input or deduct it twice. Internal loops/retained recoveries are stock. Actual wasted/consumed inputs retain burdens. No unrelated negative netting, inherited tool/coating/pack subtraction from current supplies or automatic scrap credit. |  |\n| life_asset_scope | assets/providers | Allocate complete manufacture/maintenance/real replacement/EOL through actual used_driver/COMPLETE lifetime_all_consumer_driver with compatible native unit/basis/method/state/time/source. Lifetime records include observed history plus sourced remaining/termination and uncertainty/sensitivity/update, across all consumers/periods. Choose one asset-equivalent OR lifecycle-complete provider, never both or N twice. |  |\n| exclusive_fate_views | all actual fates | Whole tools/sets/fragments/steel/coating/pack and cleanup carrier/absorbed-liquid/collected fragments versus free liquid/direct species are exclusive/non-additive views. Actual receiver transport/treatment has one owner after provider coverage. Rejected/cancelled/unfinished activity retains resource attribution and is not FINAL accepted output; no automatic recycling credit. |  |\n| commodity_link_scope | nonexchange commodity interface | Keep actual original-gate stock and completed external integration at their recorded raw quantities. Declare source_assignment_scope_id, actual target_consignment_ids/target_cohort_id and source_assignment_quantity_basis: single_consignment_case, target_cohort_total or already_per_reference. For a raw target-cohort total, source_link_per_service_quantity=source_link_assigned_raw_quantity/same_target_scope_N ONLY when the positive N covers exactly that assigned target scope, with actual native units/state/source and acceptance-reversal evidence; use that interface once when combining with 1 accepted_service. A single-consignment case with N=1 and an already-per-reference quantity are not divided again. Do not divide actual external stock/stage-integration records by service N or use whole-source-cohort N for a narrower assigned target; preserve raw quantities and an explicit once-only link. |  |\n\n\n"
