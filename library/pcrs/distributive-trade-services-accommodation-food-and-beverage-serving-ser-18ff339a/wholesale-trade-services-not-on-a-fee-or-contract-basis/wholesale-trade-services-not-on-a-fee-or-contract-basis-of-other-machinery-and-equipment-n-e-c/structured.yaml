    rule: "Actualmerchant purchase/ownership/resale/B2Bbuyer/FINALgate-time-source/reversals, unique FINAL N/all16qualifiers required. Supplierreceipt/bearingpiece/price/rpm/life insufficient. N0failed/cancelled/quarantined/unfinished resources retained byperiodcohort no division."
    source_ids: []
  - rule_id: actual_sealed_sku
    applies_to: "commodity"
    rule: "Verify the actual new single-row STEEL deep-groove BALL bearing, seals on BOTH sides rather than metal shields, factory grease, original CLOSED packaging, SKU, BOM, retained contents and native quantity/state. Do not impose universal seal codes, NBR/RSH specifications, cage polymers, steel grades, grease fills, bores, masses, temperature/load/rpm limits, lifetimes or efficiency, or assume merchant rotation, installation, testing, washing or regreasing."
    source_ids:
      - skf-deepgroove-seals-2017
  - rule_id: native_components
    applies_to: "commodity/fates"
    rule: "Preserve native whole/component/packaging genealogy and EACH repetition-count metadata. Compatible net mass equals gross mass minus external packaging tare and retains grease, seals and preservative. Do not duplicate components or equate a missing seal with whole-bearing loss. Independent grease, residue, component and water quantities need native unit, basis, method, state, time and source, plus compatible actual density, temperature unit and source where conversion requires them. Use water-only wet/dry definitions and convert percentages before calculation. LOD that includes other volatiles does not establish water, emissions or zero. Record semisolid grease explicitly as Waste / Mass; do not force it into Volume."
    source_ids: []
  - rule_id: source_completed_once
    applies_to: "commodity interface"
    rule: "Record actual native source, assigned, baseline and additional quantities/states and conversions. Use direct tracing OR positive, COMPLETE competing terminal drivers for final accepted outputs, useful other exits, returns, closing stock and proven loss, each with quantity, unit, basis, method, state, time, source, link and owner. Do not use accepted outputs alone or overlay driver allocation on direct assignment. Require exclusive loss ownership and identical baseline stage/loss coverage. ACTUALLY complete integration of missing stages and required additional demand once outside the service, with native quantity, status, link, time, timezone, source, owner and coverage before complete-chain readiness. A pending plan fails this requirement."
    source_ids: []
  - rule_id: resources_once
    applies_to: "service resources"
    rule: "Full asset lifetimes cover all users and periods, with observed plus source-backed remaining use, termination assumptions, native drivers, uncertainty and updates. Choose either the attributed asset-equivalent quantity or the lifecycle-complete provider quantity, and divide the chosen quantity by positive N once. NET material receipts exclude container tare. Choose gross S/N input with a matched unused-return/N output OR consumed-only input with that output omitted; do not offset unrelated quantities or apply negative credits. Freight payload retains complete contents and all cargo packaging, excluding ONLY vehicle and other non-cargo tare. Preserve native gross/tare measurements and EACH/TOTAL distinctions; multiply EACH quantities by actual repeat counts once. Apply THAT record share INSIDE the freight sum before dividing by positive final N once; retain resources when N=0."
    source_ids: []
  - rule_id: receiver_species_once
    applies_to: "sealed_bearing_wholesale"
    rule: "Record actual batch/period cleaning, changeovers, idle time, cancelled, failed, rejected, quarantined and unfinished work, dispatch and final acceptance, packaging/seal defects, stains, rust, returns, pending decisions, samples and discard, with actual paths and owners. Whole bearings with retained grease, independent parts, semisolid grease measured by mass, mixed cleaning waste, free fluid measured by volume and direct species must be mutually exclusive where they overlap. Count actual receiver transport and treatment once. Do not assume draining or recycling or equate a deficit with a release or zero. Do not reapply fractions included in a complete species factor."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
