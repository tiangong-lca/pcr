    - id: electricity
      applies_to: "unpopulated_circuit_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Actual attributable receipt/hold/dispatch utility only; no board manufacture, electrical test, populated-circuit use, baking or humidity control default. Range evidence need: Need metered native kWh interval, actual all-user handling/space drivers, idle/open resources and delivered utility support; no energy per board area. Measurement evidence: protocol cp_utilities; original record basis Energy / kWh. The original amount constraint “sum(actual_utility_quantity*documented_share)/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: site_water
      applies_to: "unpopulated_circuit_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Conditional real warehouse hygiene water, not circuit manufacture/rinse or consumer use; provider/treatment scope recorded. Range evidence need: Need actual meter/supplier volume, hygiene event, matching period/conversion/share and receiver coverage; no board-wash quantity from area. Measurement evidence: protocol cp_utilities; original record basis Volume / m3. The original amount constraint “actual compatible utility volume*documented_share/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: site_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: hygiene_materials
      applies_to: "unpopulated_circuit_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Individual actual agents/wipes/absorbents/filters only when used. Board glass/resin/copper/mask/finish or inherited pack desiccant is not new service material. Range evidence need: Need actual material identity/formulation, native count/mass/density conversion, stock and matched unused return evidence; no prescribed solvent or absorbent dose. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “selected actual gross or consumed supply mass/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: hygiene_materials_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
