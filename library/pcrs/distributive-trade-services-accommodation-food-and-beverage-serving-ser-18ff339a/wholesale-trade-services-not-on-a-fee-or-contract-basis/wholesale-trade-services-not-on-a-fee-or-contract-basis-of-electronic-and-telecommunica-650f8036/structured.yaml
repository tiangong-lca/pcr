    - id: freight
      applies_to: "unpopulated_circuit_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Actual single circuits or panels including received rails/coupons, packing and carried supports; preserve cargo scope independently of net-board area/copper mass. Range evidence need: Need actual packed mass, single/panel membership/count EACH/TOTAL, noncargo tare, distance/conversion and each load-leg share/empty coverage; no bare-board-only payload default. Measurement evidence: protocol cp_freight; original record basis Mass * Length / t*km. The original amount constraint “sum_unique_load_leg(actual_transport_work*documented_service_share)/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
