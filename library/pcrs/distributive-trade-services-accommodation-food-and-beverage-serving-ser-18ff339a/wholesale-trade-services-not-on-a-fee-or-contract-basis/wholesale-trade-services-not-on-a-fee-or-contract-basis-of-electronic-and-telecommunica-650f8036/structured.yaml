      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only actual exported unused service supply under gross input convention. Consumed-only input omits this exchange. Commercial circuit returns or inherited pack/material are nonexchange merchandise records. Range evidence need: Need same-scope supply identity/native quantity, actual usable receiver/transfer and nonclosing proof; no inherited copper/finish/desiccant return against unrelated input. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual matched unused outward mass/N under gross input only” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: unused_supply_return_detergent_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
