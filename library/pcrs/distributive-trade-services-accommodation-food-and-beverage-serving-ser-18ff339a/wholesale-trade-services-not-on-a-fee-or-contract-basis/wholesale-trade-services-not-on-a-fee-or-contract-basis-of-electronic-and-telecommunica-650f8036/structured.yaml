      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Only real added protection without assumed opening/repack/desiccation. Inherited supplier pack stays commodity; reusable merchant supports use full-life allocation. Range evidence need: Need actual material, quantity EACH/TOTAL native mass/stock and reuse/return ownership; no one dry bag or desiccant per board/panel default. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “selected actual added gross or consumed material mass/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_package
      applies_to: "unpopulated_circuit_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Actual physically specified handling/site service only, coverage declared; outsourced depanel/test/bake/populate/solder/repack needs reviewed route, not hidden provider scope. Range evidence need: Need provider unit/physical equivalent/event/share and utility/assets/freight/treatment exclusions; no price or net-board-area package factor. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “sum(actual_native_package_quantity*documented_share)/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
