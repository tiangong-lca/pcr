  calculation_rules:
    - id: completed_count
      applies_to: "cp_circuits"
      rule: "N=count_unique_final_owned_resold_B2B_acceptances_after_reversals. Actual merchant ownership/resale, business buyer and final gate/source/reversal required; N>0 for division. Canceled/open/rejected/reversed resources remain in actual cohorts/periods."
      inputs:
        - "Actual ownership/buyer/final gate and acceptance/reversal records"
      output: "Final unique service N"
      source_ids: []
    - id: board_panel_geometry
      applies_to: "cp_circuits"
      rule: "Use actual measured/design net_board_area and received single/panel membership. A rectangular length*width calculation only matches actual outline/cutouts basis; double-sided copper does not double plan area. Panel count*circuits_per_panel only with actual compatible membership; rails/coupons belong to original supplied panel, not extra net circuits or omitted source mass. EACH mass*actual_count once/TOTAL unchanged; packed mass retains actual original pack."
      inputs:
        - "Native outline/length/width/area/thickness/count/mass membership and conversions"
      output: "Qualified net-board versus received-panel geometry/mass audit"
      source_ids: []
    - id: retained_copper_components
      applies_to: "cp_circuits"
      rule: "Prefer actual measured or design-supported copper_mass. If geometry method used: copper_mass=sum(retained_copper_volume*density), including independently evidenced nonoverlapping hole-plating volume and actual retained patterned coverage/thickness on each face. Whole board area*initial full foil thickness is not post-etch retained copper absent actual coverage; do not double count plated copper already within measured/design total. Glass/resin/finish/mask/legend component views are nonadditive, actual identities/fractions required."
      inputs:
        - "Actual retained geometry/coverage/holeplating exclusion and native density/temperature/source"
      output: "Audited retained copper/components without full-foil default"
      source_ids: []
    - id: source_gate
      applies_to: "cp_circuits"
      rule: "Direct source trace OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers with positive complete all-terminal native records. commodity_source_gate_demand=assigned_source_gate_quantity at actual original finished unpopulated single/panel/rails-coupon/pack gate including evidenced state-change share; not dispatch+discard. Reconcile input/closing/returns/useful others/actual loss, baseline_quantity/additional_stage_quantity/loss_adjustment_quantity native conversions, actual missing stages, stage/loss coverage/owner once outside. Unknowns block complete-chain use, not zero.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
      inputs:
        - "Direct or full native terminal-driver/source and baseline/additional/loss evidence"
      output: "Quantified original complete commodity demand/loss outside once"
      source_ids: []
    - id: component_water
      applies_to: "cp_circuits; cp_outlets"
      rule: "Only when needed and evidenced: component_dry_mass=component_wet_mass*(1-water_wet_fraction), actual water/as-received wet mass fraction for identified same component/sample. Compatible dry water/nonwater ratio converts water_wet_fraction=water_dry_ratio/(1+water_dry_ratio) after native percent conversion. Do not correct whole FR4/copper/finish from one component sample, and LOD containing other volatiles is not automatically water. Retained fluid quantities have own native identity/basis/source/fate."
      inputs:
        - "Actual component water/fluid native measurement/method/sample/state/source and conversion"
      output: "Qualified component moisture/fluid audit not inferred product loss"
      source_ids: []
    - id: utility_share
      applies_to: "cp_utilities"
      rule: "utility_per_service=sum(actual_utility_quantity*documented_share)/N with actual native interval/conversion and matching all-consumer causal drivers, provider overlap excluded. No fabrication/assembly/test/use/baking climate factor."
      inputs:
        - "Native utility meter/driver/conversion/share records"
      output: "Actual electricity/site water per service"
      source_ids: []
    - id: supply_stock
      applies_to: "cp_supplies"
      rule: "S=opening+net_receipts-closing including retained recovery. Gross S/N with separate paired usable outward output OR consumed (S-usable_outward_return)/N and OMIT matching return exchange. Actual EACH count conversion once/TOTAL unchanged, supported per-piece mass/density temperature and no inherited material credit."
      inputs:
        - "Standalone native stocks/material/conversion and matched unused return"
      output: "Exclusive supplied/consumed material convention"
      source_ids: []
    - id: provider_share
      applies_to: "cp_provider"
      rule: "provider_per_service=sum(actual_native_package_quantity*documented_share)/N with actual physical_equivalence and disjoint coverage. documented_share=share_numerator/share_denominator on compatible native causal units; not money or board count without equivalence."
      inputs:
        - "Actual package/equivalence/share/native coverage"
      output: "Actual disjoint provider service"
      source_ids: []
    - id: full_asset_share
      applies_to: "cp_assets"
      rule: "lifetime_all_user_driver=observed_all_user_driver+remaining_driver after native compatibility/equivalence and sourced remainder. Apply job_driver/lifetime_all_user_driver to complete manufacture/maintenance/replacement/retirement/EOL; all users/periods/uncertainty/sensitivity/update, sum then /N once, no traded PCB as current ICT asset."
      inputs:
        - "Actual asset life events"
        - "job/observed/remainder/native driver equivalence"
      output: "Actual complete-life all-user asset equivalents"
      source_ids: []
    - id: unique_freight
      applies_to: "cp_freight"
      rule: "Actual cargo=received board/panel including supplied rails/coupons+pack+carried support on exclusive compatible membership; actual EACH mass*actual_count once OR TOTAL unchanged, subtract only noncargo carrier tare. Native mass/distance convert actual_transport_work. freight_per_service=sum_unique_load_leg(actual_transport_work*documented_service_share)/N, each record share inside SUM and N once, empty/provider/receiver scope disjoint."
      inputs:
        - "Unique load-leg native configuration/cargo/count/distance/conversion/share"
      output: "Actual scoped freight t*km per service"
      source_ids: []
    - id: actual_outlets_release
      applies_to: "cp_outlets; cp_environment"
      rule: "outlet_per_service=actual_compatible_native_transfer_quantity/N after supported EACH/TOTAL/conversion. Whole supplied panel/board, independent fragment/pack/capture/liquid and retained components are exclusive. Retained stock not export; consumed-only supplies omit paired return. Actual receiver/treatment once, no automatic recovery credit. release_mass=measured_species_mass OR compatible activity*applicable_species_factor with only necessary composition/release_fraction; complete species factor already covering fractions must not multiply them again. Actual medium/native sources/capture exclusions then /N once, no material-presence or stock-gap emissions."
      inputs:
        - "Actual native transfer/component/receiver or independent species/medium/factor chain"
      output: "Exclusive actual receiver and species quantities"
      source_ids: []
