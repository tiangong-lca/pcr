      applies_to: "unpopulated_circuit_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Separate real building/rack/handler/support across all users/periods; traded circuits are not current ICT assets. Include all manufacture/maintenance/replacement/retirement/EOL. Range evidence need: Need actual asset scope/events, observed all-user use+sourced remainder, compatible driver/equivalence and uncertainty/sensitivity; no life or new-support-per-panel factor. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “sum_full_asset_equivalents(job_driver/lifetime_all_user_driver)/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
