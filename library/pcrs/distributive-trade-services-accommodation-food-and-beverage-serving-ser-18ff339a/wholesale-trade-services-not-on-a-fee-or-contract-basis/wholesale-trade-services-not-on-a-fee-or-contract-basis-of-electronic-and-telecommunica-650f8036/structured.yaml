allocation_rules:
  - rule_id: causal_events
    applies_to: "foreground_burden_allocation"
    rule: "Direct assignment when real event links exist; otherwise sourced physical handling/occupied-space-time or compatible causal drivers over all consumers/periods including open/reject/idle work. No default board area, panel count, copper mass, price or revenue driver."
    source_ids: []
  - rule_id: source_assignment
    applies_to: "foreground_burden_allocation"
    rule: "Outside service use actual direct source-to-target trace OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers only from positive complete compatible all-terminal records including closing/useful-other/returns/actual loss, each native quantity/unit/basis/method/state/source/link/owner. commodity_source_gate_demand=assigned_source_gate_quantity in original actual finished single/panel/rails-coupon/pack state including evidenced state-change share. Final shipped mass+discard is not source demand. Quantify baseline/additional/loss original quantities/conversions/stage/loss coverage and exclusive owner once.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: supply_returns
    applies_to: "foreground_burden_allocation"
    rule: "S=opening+net_receipts-closing including retained recovery. Gross input S/N plus separate actual matched usable unused outward output OR consumed-only (S-usable_outward_return)/N and OMIT matching return exchange. Only same-scope standalone service supply can be netted, not inherited board/copper/finish/pack or unrelated stock; no second credit."
    source_ids: []
  - rule_id: asset_lifetime
    applies_to: "foreground_burden_allocation"
    rule: "Full manufacture/maintenance/replacement/retirement/EOL allocated by compatible job_driver/lifetime_all_user_driver. Lifetime is observed all-user use plus sourced remaining service over all users/periods, native equivalence, uncertainty/sensitivity/update, one direct/provider/carrier owner; sum then /N once. Traded circuits not asset input."
    source_ids: []
  - rule_id: freight_receiver
    applies_to: "foreground_burden_allocation"
    rule: "Every unique load+leg own documented_service_share inside SUM then /N once. Cargo retains actual received board/panel/rails/coupons/pack/carried support, EACH compatible count once/TOTAL unchanged, subtract only noncargo carrier tare. Exclusive receiver/transport/treatment and whole/component views once; no default recycling/credit."
    source_ids: []
