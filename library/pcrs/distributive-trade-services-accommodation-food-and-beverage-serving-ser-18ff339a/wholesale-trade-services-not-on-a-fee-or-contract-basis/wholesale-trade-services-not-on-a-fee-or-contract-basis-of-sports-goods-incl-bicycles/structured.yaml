  calculation_rules:
    - id: completed_count
      applies_to: "accepted_service"
      rule: "N=count unique actual commercial consignment IDs with buyer acceptance at declared gate, not kit/frame/carton/component count."
      inputs:
        - "cp_bicycle consignment/acceptance/time/state records"
      output: "N and 1 Item(s) service reference"
      source_ids: []
    - id: kit_and_pack_mass
      applies_to: "merchandise nonexchange"
      rule: "whole_pack_mass=actual_net_partial_kit_mass+actual_included_pack_tare on identical state/configuration/method. Body/wheels/pedals/accessories and contents decompose the kit nonadditively, not extra current service inputs."
      inputs:
        - "cp_bicycle BOM/configuration/native mass/count/extent/source"
      output: "Actual partial-kit and pack audit; no hypothetical assembled mass"
      source_ids: []
    - id: source_gate_demand
      applies_to: "commodity outside"
      rule: "commodity_source_gate_demand=assigned_source_gate_quantity; use evidenced direct mapping OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers with all competing compatible exit records/units/equivalence. Include evidenced state-change share, reconcile real loss ownership/existing coverage once outside.  Record assignment_scope_ids, quantity_basis=raw_target_cohort or per_reference, same_target_scope_N and source. Keep raw original-gate stock and actual external stage/loss integration at its actual physical scope once. ONLY for combination with 1 Item(s) service, derive q_per_reference=raw_assigned_to_that_same_scope/positive same_target_scope_N. Already per-reference quantities are not divided again; single-case raw scope has N=1, N=0 has no normalized result. Never use that derived normalized view to close raw cohort stock or integrate actual missing stages/loss."
      inputs:
        - "cp_bicycle source quantity/gate/native all-exit drivers/coverage"
      output: "Quantified original complete boxedPARTIAL-kit gate demand/loss interface"
      source_ids: []
    - id: supply_stocks
      applies_to: "actual new supplies"
      rule: "S=opening+net_receipts-closing; choose gross S/N plus real same-scope usable_outward_return/N output OR consumed-only (S-usable_outward_return)/N and OMIT paired return exchange."
      inputs:
        - "cp_supplies native stock/extent/quantity/conversion/pairing"
      output: "Exclusive supply and actual outward return convention"
      source_ids: []
    - id: utility_allocation
      applies_to: "utilities"
      rule: "service_driver_share=service_driver/all_user_driver on matching native causal basis; allocated_utility=native_interval_quantity*service_driver_share/N after compatible conversion."
      inputs:
        - "cp_utilities native interval/meter/driver units/source"
      output: "Actual measured or allocated utility per service"
      source_ids: []
    - id: provider_allocation
      applies_to: "provider_packages"
      rule: "provider_quantity=actual_native_package_quantity*documented_share/N after real physical equivalence and exclusive resource coverage; documented_share=share_numerator/share_denominator on matching same-unit driver basis."
      inputs:
        - "cp_provider native physical equivalent/share drivers/owner"
      output: "Disjoint actual provider service per consignment"
      source_ids: []
    - id: full_asset_share
      applies_to: "shared_assets"
      rule: "asset_equivalent=job_driver/lifetime_all_user_driver/N; lifetime_all_user_driver=compatible_observed_all_user_driver+compatible_sourced_remaining_driver. Actual complete-life dataset includes maintenance/replacements/retirement/EOL, with uncertainty/sensitivity/update."
      inputs:
        - "cp_assets matched lifecycle/job-lifetime native units/history/remainder source"
      output: "All-consumer complete-life asset burden per service"
      source_ids: []
    - id: cargo_transport_work
      applies_to: "freight"
      rule: "For EACH, cargo_total=actual_each_compatible_cargo_mass*actual_compatible_count; for TOTAL, cargo_total=actual_total_compatible_cargo_mass with no count multiplier. actual_transport_work=cargo_total_tonnes*actual_distance_km, or evidenced equivalent native carrier work; freight_quantity=actual_transport_work*documented_service_share/N. Exclude noncargo vehicle/container tare; carried pack/support remains cargo."
      inputs:
        - "cp_freight native extent/cargo-count/distance/conversion/share/coverage"
      output: "Actual freight work per service, extent/count/share/N each once"
      source_ids: []
    - id: outlet_transfers
      applies_to: "actual outlets"
      rule: "outlet_quantity=actual_compatible_net_quantity/N; EACH measurement multiplies matching count once, TOTAL remains total. Whole streams include retained content; independent components/parts/pack/liquid/species views are exclusive."
      inputs:
        - "cp_outlets native whole net/tare/extent/content/fate/receiver records"
      output: "Actual compatible receiver transfer quantity, no duplicate content"
      source_ids: []
    - id: actual_release
      applies_to: "direct_species"
      rule: "release_quantity=actual_measured_species_quantity/N OR compatible_activity*applicable_factor*required_composition*required_release_fraction/N. Omit composition/fate multipliers already included in complete species-release factor."
      inputs:
        - "cp_environment native measurement/activity/factor/composition/fate/receptor sources"
      output: "Actual species and medium quantity, no inherited lubricant/tire default"
