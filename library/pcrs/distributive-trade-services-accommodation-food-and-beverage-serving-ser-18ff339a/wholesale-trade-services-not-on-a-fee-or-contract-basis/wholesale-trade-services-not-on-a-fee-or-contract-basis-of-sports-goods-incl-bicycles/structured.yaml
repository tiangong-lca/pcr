  data_quality_requirements:
    - id: native_operands
      applies_to: "All actual records"
      requirement: "Retain quantity/unit/state/extent/basis/method/source/sample time, density and temperature-unit/source, conversion units/source. Unknown stock/condition/content is unresolved, not assumed zero."
