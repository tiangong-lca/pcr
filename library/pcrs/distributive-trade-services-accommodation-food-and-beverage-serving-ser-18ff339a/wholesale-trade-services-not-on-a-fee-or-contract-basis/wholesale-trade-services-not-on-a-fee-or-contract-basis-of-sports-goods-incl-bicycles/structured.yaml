    - id: electricity
      applies_to: "ambient_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Record actual warehouse lighting/handling utility scope and causal share. No cycle motor, battery charging, product demonstration, assembly/PDI or test-ride energy is prescribed; exclude energy already owned by actual provider or carrier. Range evidence need: Metered period, all-consumer causal native driver and actual delivered electricity supplier/property support are required; no warehouse power or per-bicycle energy benchmark is supplied. Measurement evidence: protocol cp_utilities; original record basis Energy / kWh. The original amount constraint “native_interval_quantity*service_driver_share/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: cleaning_water
      applies_to: "ambient_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Actual utility water for warehouse surfaces only when used. It is not bicycle washing, tire treatment, inherited fluid or a prescribed maintenance operation. Native source/meter/treatment and provider coverage must be explicit. Range evidence need: Actual utility meter or documented density conversion, cleaning interval and shared-consumer allocation are required; no per-kit wash volume is inferred. Measurement evidence: protocol cp_utilities; original record basis Volume / m3. The original amount constraint “actual_utility_quantity*service_driver_share/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: hygiene_supplies
      applies_to: "ambient_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand actual agent/wipe/absorbent/filter materials using real formulation and standalone stock. Factory tire rubber/lubricant/coating/consumer assembly tools are merchandise constituents, not current supplies. No lubricant dose, desiccant or solvent use is required. Range evidence need: Actual material SKU/formulation and each-versus-total native amounts, stock and return pairing, composition and conversion evidence must precede a quantitative guardrail. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “selected_supply_input/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: hygiene_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: added_outer_packing
      applies_to: "ambient_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Only actual new outer transit protection/seals crossing service boundary. Original manufacturer box, wheel separators, tools/accessory bag and kit supports remain inherited merchandise; reusable merchant support belongs to full-life service assets. No kit opening/repacking is assumed. Range evidence need: Actual new outer protection unit/material/per-piece mass and reporting extent are needed; no one-box-per-bike or packaging-count factor is assumed. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “selected_supply_input/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_packages
      applies_to: "ambient_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Use real physical native equivalents and actual resource/asset/transport/treatment coverage, not money. Contracted assembly, adjustments, PDI, repair or ride remains an actual route extension, not an invisible provider service. Range evidence need: Actual provider unit, equivalent physical events, native share basis and exclusive coverage are required; no generic logistics package or price factor is fixed. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “actual_native_package_quantity*documented_share/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_provider; actual source-linked native records"
    - id: shared_assets
      applies_to: "ambient_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Attribute real building/racks/electric handlers/reusable pallets and cages/scales/monitors across all users and periods, using complete manufacture/maintenance/replacement/retirement/end-of-life. Factory kit parts and packaging are not assets newly purchased each service. Range evidence need: Matched complete asset dataset, job/life native driver units, observed all-user use plus sourced remaining service and sensitivity are needed; no lifetime or per-turn asset count is invented. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “job_driver/lifetime_all_user_driver/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "ambient_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Include only actual assigned carrier segments. Cargo payload is actual partial kits with shipped accessories, inherited/added packing and actual carried support; separate vehicle/container tare not cargo. EACH mass is multiplied once by compatible actual count; TOTAL mass is never multiplied by kit count again. Carrier fuel/assets and empty legs have one owner. Range evidence need: Actual gross cargo/net/tare ticket boundary, kit count and EACH/TOTAL mass scope, route distance, conversions/shares/empty coverage are required; no ready-to-ride mass, payload or journey default. Measurement evidence: protocol cp_freight; original record basis Freight transport / t*km. The original amount constraint “actual_transport_work*documented_service_share/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: unused_count_returns
      applies_to: "ambient_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Actual usable unused material units exported from the same standalone new-supply stock only. Retained recovery/closing stock is not export. Factory box/kit return to supplier is a merchandise ledger event. Omit this exchange if the matched same-stock return was deducted in consumed-only input. Range evidence need: Actual original supply unit/state and outward receiver pairing are needed; no material credit from inherited cartons, useful bicycle returns or a reusable pallet is automatic. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “actual_matched_unused_outward_units/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: unused_mass_returns
      applies_to: "ambient_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Actual usable unused warehouse material exported from the same independently burdened supply stock with original identity and net mass. Keep gross input with this output OR consumed-only input without this output, never both deductions or avoided production credit by default. Range evidence need: Actual material product/state/receiver and source-stock quantity unit/density pairing are required; inherited bicycle lubricant is not a current supply return. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “actual_matched_unused_outward_mass/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: unused_mass_returns_detergent_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: whole_kit_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only real receiver-accepted whole kit discard at its actual supplier partial configuration, including parts/accessories/packing/retained lubricant or tire contents only as actually included. Expected detached component is not by itself loss. Damage/shortage/commercial rejection/return alone is not actual discard. Range evidence need: Actual parent frame/kit identity, whole-stream boundary/native mass/state, included accessories/pack/retained contents and receiver acceptance/treatment are required; no whole-kit waste rate is assumed. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual_compatible_outlet_net_quantity/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: whole_kit_waste_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: part_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Record actual separately transferred damaged/incident-detached or separately received part linked to parent kit/frame and original BOM. No routine dismantling/replacement/repair is prescribed. Exclude parts/retained tire or lubricant already inside whole-kit waste; useful separately transferred component is not automatically waste. Range evidence need: Part identity/material, parent genealogy, native quantity/unit/state and actual receiver classification/fate are required; missing expected parts or counted fragments do not become whole original bicycles. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual_compatible_outlet_net_quantity/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: packaging_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual independently transferred carton/film/separator/protection waste, distinguishing inherited pack, new outer material and retained reusable support. Physical material already included in whole-kit/part/mixed hygiene stream is excluded from this evidence checkpoint. Range evidence need: Actual separated material and net mass/state, contamination or retained components, receiver and source packing ownership are needed; factory box damage is not a fresh box purchase by assumption. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual_compatible_outlet_net_quantity/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: packaging_waste_paper_pack; packaging_waste_metal_pack; packaging_waste_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: hygiene_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actually collected spent wipes/absorbents/filters with retained incident material/fluid, measured as whole stream. Purchased dry supply, retained tire/lubricant/component content and spent wet stream are different nonadditive views, not separate duplicated wastes or emissions. Range evidence need: Actual spent wet/net amount, retained fluid/solid quantity native units/basis/method/source/sample time and receiver evidence must support the stream, not a material receipt alone. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual_compatible_outlet_net_quantity/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: hygiene_waste_spent_wipe. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: contained_liquid
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual collected warehouse surface hygiene or incident liquid to a documented receiver/treatment boundary, not bicycle washing or automatic drain outfall. Retained lubricant/solids composition needs actual compatible source/fate evidence. Range evidence need: Actual contained volume or compatible mass-density-temperature conversion and receiver loads/composition are needed; intake water, tire pressure change or visible wetness alone does not establish whether or how much liquid is discharged. Actual collection/receiver evidence is required; assume neither discharge nor zero. Measurement evidence: protocol cp_outlets; original record basis Volume / m3. The original amount constraint “actual_compatible_outlet_net_quantity/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_liquid_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: direct_species
      applies_to: "ambient_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Expand only identified substance/particle and actual receiving medium with independent quantity evidence. Inherited lubricant/tire/coating, SDS, visible damage or stock/pressure difference does not establish emission. Captured residues and contained cleanup remain transfers; no consumer tire wear, ride or maintenance release assumed. Range evidence need: Actual species/receptor and measurement or compatible activity-factor with required composition/fate/source/native conversions are needed; complete species release factors must not receive duplicate composition/fate multipliers. Measurement evidence: protocol cp_environment; original record basis Mass / kg. The original amount constraint “actual_measured_species_quantity/N OR actual_activity*applicable_factor*required_composition*required_release_fraction/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_environment; actual source-linked native records"
validation_rules:
  - rule_id: reference_check
    applies_to: "foreground_dataset_conformance"
    rule: "Match output/reference name/link, Count amount, unique real N and actual buyer gate with partial-kit BOM/state/frame/model/size/serial/count/nettare/period qualifiers."
    source_ids: []
  - rule_id: original_gate_check
    applies_to: "foreground_dataset_conformance"
    rule: "Require actual manufacturer-complete boxedPARTIAL gate and every actual missing commodity stage outsideonce; native direct assignment OR complete compatible competing exits inclclosing/usefulothers/returns/loss and unique loss owner/coverage. No ready-to-ride/rawparts proxy or unknown loss=zero.  Record assignment_scope_ids, quantity_basis=raw_target_cohort or per_reference, same_target_scope_N and source. Keep raw original-gate stock and actual external stage/loss integration at its actual physical scope once. ONLY for combination with 1 Item(s) service, derive q_per_reference=raw_assigned_to_that_same_scope/positive same_target_scope_N. Already per-reference quantities are not divided again; single-case raw scope has N=1, N=0 has no normalized result. Never use that derived normalized view to close raw cohort stock or integrate actual missing stages/loss."
    source_ids: []
  - rule_id: physical_scope_check
    applies_to: "foreground_dataset_conformance"
    rule: "No hidden finalassembly/PDI/adjustment/ride/repair/wash/repack/motor/battery/lubrication operation including outsourced work; real added operation needs reviewed extension."
    source_ids: []
  - rule_id: extent_content_check
    applies_to: "foreground_dataset_conformance"
    rule: "Check EACH/TOTAL quantity units/count compatibility, cargo versus noncargo tare, actual whole/part/pack/content/cleanup/receiver/species exclusivity. Unknown shortage/damage/pressure/stock difference is not actual loss/discard/release."
    source_ids: []
  - rule_id: resource_owner_check
    applies_to: "foreground_dataset_conformance"
    rule: "Check native same-basis all-consumer shares and /N once, full asset all-user history+sourced remainder/EOL/units/uncertainty, provider/carrier/treatment disjointness and supply gross+return OR net omitreturn."
    source_ids: []
  - rule_id: actual_identity_check
    applies_to: "foreground_dataset_conformance"
    rule: "Final exchange requires actual native quantity evidence, verified concrete identity and property/unit support; unresolved identities/empirical ranges remain candidate gaps, not publication readiness."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "foreground_dataset_conformance"
    rule: "all inventory rows"
    source_ids:
      - "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence"
      - species
      - state
      - "receiver or provider configuration blocks final data completion"
      - "no assumed zero. Whole streams and components"
      - "gross inputs and matched returns must remain mutually exclusive where required."
published_dataset_profile:
  dataset_role: "Foreground add-on service for actual accepted commercial own-account boxed partial bicycle-kit consignment."
  downstream_use: "Combine with matched original manufacturer-complete boxedPARTIAL-kit commodity system and quantified exclusive assigned demand/loss outside service once."
  allowed_use: "Actual declared nonmotorized two-wheel supplier-packed partial-kit ambient wholesale with traceable BOM/state and resources/receivers."
  excluded_use: "Full bicycle product footprint alone; ready-to-ride/consumer assembly/PDI/ride/use-phase, motorized/electric route, unreviewed processing or fee agency."
  required_metadata: "Actual supplier original partial gate/BOM/frame/model/serial/size/wheel-pedal-accessory membership/nettare/extent/count/content, accepted consignment/time/site/period, native source allocation/loss coverage, causal resource/lifetime/provider/carrier/treatment ownership."
  required_quality_disclosure: "Unresolved actual identity/support/quantity/range, same-state conversion/each-total/tare evidence, source competing-exit reconciliation, content unknowns, measured versus allocated utility and full-life asset remainder uncertainty."
  update_trigger: "Actual received configuration/BOM/gate, merchant operation, source allocation/loss coverage, provider/asset/carrier/receiver/species changes or revised verified actual identity/source."
