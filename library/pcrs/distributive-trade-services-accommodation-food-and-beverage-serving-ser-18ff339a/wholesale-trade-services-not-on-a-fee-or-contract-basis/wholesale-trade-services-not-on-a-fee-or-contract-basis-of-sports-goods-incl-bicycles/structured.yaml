allocation_rules:
  - rule_id: stocks_and_attempts
    applies_to: "foreground_burden_allocation"
    rule: "Reconcile model/frame/kit/component-BOM/carton records by actual period: opening/receipts/closing, useful commercial returns/other exits, retained rejects and actual receiver discard. Expected detached parts do not equal missing components. Internal movements/retained recovery are not exports; unfinished/rejected attempts carry real resource attribution while N counts accepted services only."
    source_ids: []
  - rule_id: original_source_assignment
    applies_to: "foreground_burden_allocation"
    rule: "Trace original supplier-gate input to target by evidenced direct assignment OR complete compatible cohort: assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers. Native all competing exit records/units/bases/sources/equivalence include useful other exits, closing stock, returns and actual loss. Never divide whole source stock only by accepted target kits/consignments or infer original kits from part counts."
    source_ids: []
  - rule_id: linked_commodity_demand
    applies_to: "foreground_burden_allocation"
    rule: "commodity_source_gate_demand=assigned_source_gate_quantity at actual manufacturer-packed partial configuration, including its evidenced state-change share. Original quantity/unit/state/source/allocation/conversion and actual loss adjustment/native basis/source/owner/already-included coverage are mandatory. Final dispatch mass+discard is not original demand; source dataset coverage checked before once-only adjustment outside service.  Record assignment_scope_ids, quantity_basis=raw_target_cohort or per_reference, same_target_scope_N and source. Keep raw original-gate stock and actual external stage/loss integration at its actual physical scope once. ONLY for combination with 1 Item(s) service, derive q_per_reference=raw_assigned_to_that_same_scope/positive same_target_scope_N. Already per-reference quantities are not divided again; single-case raw scope has N=1, N=0 has no normalized result. Never use that derived normalized view to close raw cohort stock or integrate actual missing stages/loss."
    source_ids: []
  - rule_id: supply_return_convention
    applies_to: "foreground_burden_allocation"
    rule: "S=opening+net_receipts-closing includes retained recovered unused material. Choose gross S/N input with separately recorded real matched unused outward return OR consumed-only (S-usable_outward_return)/N input and OMIT its return exchange. Pair same independently burdened supply identity/scope; never net inherited kit oil/pack or reusable asset against unrelated supply, and no extra avoided production credit."
    source_ids: []
  - rule_id: all_consumer_resources
    applies_to: "foreground_burden_allocation"
    rule: "Actual direct meters or evidenced same-unit causal space-time/handling/native drivers cover all users/periods and relevant idle/hygiene/open-attempt resources. Declare actual share numerator/denominator/unit/basis/source and uncertainty; weight/kit-count/equal-service split needs evidence. No price/margin as physical resource driver."
    source_ids: []
  - rule_id: complete_asset_life
    applies_to: "foreground_burden_allocation"
    rule: "Use one matched asset lifecycle with manufacture, actual maintenance/replacements, retirement and end-of-life. Lifetime denominator contains compatible all-user observed history+sourced remaining driver, native units/equivalence/source/uncertainty/sensitivity/update; allocate job_driver/lifetime_all_user_driver once, then divide by N. Do not count rental/provider/carrier-owned assets again or purchase one support per turn."
    source_ids: []
  - rule_id: one_physical_owner
    applies_to: "foreground_burden_allocation"
    rule: "Maintain direct/provider/carrier/asset/receiver treatment event matrix and one burden owner. Freight cargo includes actual carried pack/support without making it new consumed material; truck/container tare not cargo. Whole/component/content stream views do not add duplicate exchanges or treatment and useful transfer gives no automatic substitution credit."
    source_ids: []
