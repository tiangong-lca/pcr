            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_emissions
              source_ids: []
            ranges: []
allocation_rules:
  - rule_id: allocation_cohort
    applies_to: "all inventory"
    rule: "Assign actual failed-order, rejected-lot and cleaning/idle burdens to the contemporaneous positive accepted cohort N using documented causality. Preserve supplier lot and sales links; accepted services never include unresolved rejects."
    source_ids: []
  - rule_id: allocation_merchandise
    applies_to: "merchandise and loss ledger"
    rule: "Do not allocate service by currency/margin or book the full traded flower purchase as consumed input. Reconcile opening, receipts, buyer returns, closing, accepted sales, supplier returns, downgrades and whole-stem discards in compatible units. Trimmings and water/respiration change require their own mass evidence. Link quantified original-gate lost-commodity amount and upstream burden once outside this service; wet discard mass is not automatically original grown-flower mass."
    source_ids: []
  - rule_id: allocation_stock
    applies_to: "supply rows and usable_supply_returns"
    rule: "For each actual supply let S be attributed opening stock plus external receipts minus closing stock including recovered closing. Internal issue is not a new purchase. Use either gross-with-outlets supply S/N plus matched usable outward returns, or consumed-only (S-usable_return)/N with matching usable return omitted from exchange totals. Never deduct a return twice, deduct waste from upstream supply or treat closing stock as an outward return."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "shared_assets"
    rule: "Attribute full asset manufacture, maintenance, replacements and end-of-life by cohort actual driver / complete lifetime driver across all consignments/nodes/periods, then divide by N once. Evidence is observed lifetime use or observed history plus evidenced remaining use and termination/EOL. State uncertainty/sensitivity and update when use changes. A complete lifecycle per-driver service is an alternative native exchange, never added to asset-equivalent quantities for the same asset."
    source_ids: []
  - rule_id: allocation_period
    applies_to: "all shared resources"
    rule: "Index periods, overlapping lots, room occupancy and service phases; sum measured burden times cohort driver / all-consumer driver for the same period. Include startup/idle/changeovers, carry stocks between periods and count replacement events once. Period sums must close to measured scope."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "flower_residues; packaging_waste; wastewater; packaging_waste_paper_pack; packaging_waste_metal_pack; packaging_waste_plastic_pack; flower_residues_atomic_case"
    rule: "Use actual reject, supplier-return, downgrade, recovery or discard route and matched receiver. Keep physical treatment burdens once, no automatic avoided-product credit or automatic coproduct allocation for useful outlets. Complete supply-return and waste routes retain nonreturned upstream resource burdens."
    source_ids: []
  - rule_id: source_scope_normalization
    applies_to: "nonexchange commodity and service combination"
    rule: "Keep original external commodity stock, source assignment/loss and missing-stage/additional upstream integration quantities in their evidenced RAW actual scope. Identify whether each amount is one actual consignment, a target service cohort, or ALREADY per reference,with source/target scope IDs and quantity basis. The physical source-cohort all-exit denominator assigns RAW quantity to that target scope; it is not automatically the target accepted-service N. Only when combining that same target-scope commodity amount with the 1 Item(s) service derive amount per reference = RAW assigned amount / positive unique accepted source_same_scope_N,with acceptance IDs/time/reversal evidence. A proved single-case scope has source_same_scope_N=1; an already-per-reference amount is not divided again. Preserve raw integration quantities and source links; do not shrink actual upstream remediation or divide the whole source cohort by an unrelated N. N0 responsibility remains disclosed without division."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_lots
      process_id: "preserved_wholesale"
      flow_role: "service acceptance and merchandise audit"
      record_type: "sales, lot and residue records"
      raw_fields: "site_id; node_id; period_id; consignment_id; source_lot_id; supplier_id; ownership_evidence; buyer_id; intake_time; acceptance_time; reversal_id; species; cultivar; grade; stem_length; stem_count; net_flower_mass; mass_unit; hydration_state; drainage_time; temperature; temperature_unit; humidity; ethylene_control; opening_stems; received_stems; buyer_return_stems; closing_stems; accepted_sold_stems; supplier_return_stems; downgraded_stems; rejected_whole_stems; trimming_mass; discard_mass; loss_adjustment_link; conversion_source; receiver_id; N; commodity_dataset_id; upstream_reference_gate; original_gate_loss_quantity; original_gate_loss_unit; original_gate_loss_state; original_gate_loss_basis; yield_or_conversion_evidence; yield_or_conversion_source; loss_burden_owner; already_included_scope; integration_result; source_assignment_scope_id; source_assignment_scope_kind; source_quantity_basis; source_target_scope_id; source_same_scope_N; source_same_scope_N_unit; source_same_scope_N_basis; source_same_scope_N_method; source_same_scope_N_state; source_same_scope_N_sample_time; source_same_scope_N_source; source_same_scope_acceptance_ids; source_already_per_reference; raw_integration_scope_link; flow_row_id; actual_identity_case; actual_substance_or_material; actual_state_and_gate; case_activation_evidence; quantity_exclusion_links; whole_total_reconciliation"
      collection_method: "Count accepted unique B2B consignments and reconcile supplier lots, reversals, stems, measured masses and actual discard routes; no generic per-stem mass.  Keep original external commodity stock, source assignment/loss and missing-stage/additional upstream integration quantities in their evidenced RAW actual scope. Identify whether each amount is one actual consignment, a target service cohort, or ALREADY per reference,with source/target scope IDs and quantity basis. The physical source-cohort all-exit denominator assigns RAW quantity to that target scope; it is not automatically the target accepted-service N. Only when combining that same target-scope commodity amount with the 1 Item(s) service derive amount per reference = RAW assigned amount / positive unique accepted source_same_scope_N,with acceptance IDs/time/reversal evidence. A proved single-case scope has source_same_scope_N=1; an already-per-reference amount is not divided again. Preserve raw integration quantities and source links; do not shrink actual upstream remediation or divide the whole source cohort by an unrelated N. N0 responsibility remains disclosed without division. Attribute only the individually identified physical case; retain other source-linked actual fates separately. Each native record belongs to exactly one exchange and any whole total is a non-additive audit."
      unit: "Item(s); stems; kg"
      frequency: "each consignment and waste event"
      temporal_coverage: "intake to acceptance and reporting cutoffs"
      site_scope: "all included room and handover areas"
      aggregation_rule: "per reference flow"
      quality_evidence: "Ownership and acceptance documents, calibrated weighing/count audit, temperature/state logs, matched loss-adjustment integration record"
    - protocol_id: cp_energy
      process_id: "preserved_wholesale"
      flow_role: "purchased electricity"
      record_type: "meters and allocation record"
      raw_fields: "site_id; node_id; period_id; consignment_id; room_id; meter_id; start_reading; end_reading; energy_unit; temperature; temperature_unit; occupancy_driver; all_consumers_driver; attributed_energy; provider_scope; N; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Read calibrated period meters; attribute refrigeration/lighting/handling and idle/cleaning by evidenced driver including every consuming lot; reconcile provider coverage. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kWh"
      frequency: "each meter period"
      temporal_coverage: "receipt through handover, idle and cleanup periods"
      site_scope: "all included electrical equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, whole-room reconciliation and driver completeness"
    - protocol_id: cp_fuel
      process_id: "preserved_wholesale"
      flow_role: "diesel supply and actual combustion"
      record_type: "tank/equipment fuel records"
      raw_fields: "site_id; node_id; period_id; consignment_id; equipment_id; fuel_id; native_unit; opening; receipts; closing_including_recovered_stock; outward_usable_return; nonburned_waste; uncontained_loss; actual_burn; burn_method; uncertainty; driver; all_consumers_driver; N; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Measure native stocks and receipts; use actual measured burn or audited exhaustive disjoint fates; link actual engine and valid species factors separately. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero. Any litre-to-kg diesel conversion requires actual compatible density, temperature/state, mass-per-volume unit and source; no default conversion."
      unit: "L"
      frequency: "each receipt/use/stock cutoff"
      temporal_coverage: "all attributed handling periods"
      site_scope: "actual on-site diesel equipment only"
      aggregation_rule: "per reference flow"
      quality_evidence: "Stock readings, engine/use logs, mutually exclusive fate proof and unexplained-balance investigation"
    - protocol_id: cp_water
      process_id: "preserved_wholesale"
      flow_role: "supplied water and contained aqueous wastes"
      record_type: "water meters, preparation and receiver records"
      raw_fields: "site_id; node_id; period_id; consignment_id; event_id; use_id; water_source; supplied_volume; volume_unit; hydration_or_dry_state; holding_duration; collected_waste_volume; direct_discharge_volume; uptake_measurement; evaporation_measurement; composition; composition_basis; composition_source; density; density_unit; temperature; temperature_unit; receiving_medium; receiver_id; provider_scope; N; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Measure actual water use and distinct contained outlets. Record direct abstraction/discharge only with actual source/medium and expand exchanges; do not infer evaporation or uptake by unmatched residual. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "m3"
      frequency: "each hydration/cleaning/discharge event"
      temporal_coverage: "intake to acceptance plus cleanup"
      site_scope: "actual preparation, buckets and cleaning points"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meters, preparation/quality records and containment/receiver evidence"
    - protocol_id: cp_supplies
      process_id: "preserved_wholesale"
      flow_role: "treatment/packaging supplies and usable returns"
      record_type: "SKU stock and outbound-return records"
      raw_fields: "site_id; node_id; period_id; consignment_id; event_id; sku_id; material; native_unit; opening; receipts; closing_including_recovered_stock; outward_usable_return; waste; measured_native_quantity; measured_mass; unit_mass; density; density_unit; temperature; temperature_unit; active_fraction; carrier; dilution; composition_basis; composition_source; conversion_source; representation; supplier_id; receiver_id; N; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Collect native stock/issue/return evidence per SKU. Retain native upstream exchange; make any mass conversion only with actual compatible measured data, never add both views. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kg; actual native SKU unit"
      frequency: "each receipt/use/return and stock cutoff"
      temporal_coverage: "relevant holding, packaging and cleaning periods"
      site_scope: "all actual preparation and handling points"
      aggregation_rule: "per reference flow"
      quality_evidence: "SKU labels, native supplier-unit records, conversion proof and matching usable returns"
    - protocol_id: cp_refrigerant
      process_id: "preserved_wholesale"
      flow_role: "fluid supply and actual component releases"
      record_type: "equipment charge, leak, recovery and service records"
      raw_fields: "site_id; node_id; period_id; consignment_id; equipment_id; event_id; fluid_id; component_id; component_mass_fraction; composition_source; opening_stock; fluid_receipts; closing_stock; initial_charge; final_charge; recovered_fluid; contained_waste; measured_release; uncertainty; driver; all_consumers_driver; N; component_fraction_basis; wholefluid_release; release_fate; release_fate_basis; release_fate_source; fluid_quantity_unit; fluid_quantity_basis; fluid_quantity_method; fluid_quantity_state; fluid_quantity_sample_time; fluid_quantity_source; retained_recovery; usable_outward_transfer; outward_recipient; contained_waste_receiver; receiver_transport_scope; receiver_treatment_scope; provider_coverage; initial_charge_upstream_owner; initial_charge_dataset_coverage; makeup_supply_provenance; gross_or_consumed_view; matched_unused_supply_return; origin_substock_id; period_opening_scope; new_factory_charge_entry; factory_entry_source; opening_entry_exclusion_check; substock_matched_return"
      collection_method: "Reconcile stocks/equipment charge, supplied make-up, actual recovery and evidenced release; investigate unknown differences and expand each actual atmospheric component.  Reconcile retained recovery, usable outward transfer, contained waste and atmospheric species as exclusive actual fates; expand Product usablefluid and Waste containedfluid independently by actual mixture/state/receiver. Initial-charge production already in complete asset dataset retains that upstream owner, not a second make-up supply. Recovery from factory charge cannot reduce unrelated current make-up. Consumed-only subtraction/omitted matched outlet applies only to same-scope standalone unused supply, never negative input. Declare shared or independent native unit/basis/method/state/sample-time/source for every fluid quantity. Initial charge enters as period-opening OR new-equipment factory-charge entry, mutually exclusive without duplicate entry; consumed-only unused-supply subtraction matches an origin-tagged standalone substock and its return, never crosses factory-charge/opening/make-up provenance."
      unit: "kg"
      frequency: "each service/leak/recovery event and cutoff"
      temporal_coverage: "whole assigned equipment periods"
      site_scope: "all relevant refrigeration equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Service reports, weighing/charge records, recovery certificates and mixture evidence"
    - protocol_id: cp_provider
      process_id: "preserved_wholesale"
      flow_role: "complete external service jobs"
      record_type: "contract and physical-completion records"
      raw_fields: "site_id; node_id; period_id; consignment_id; provider_id; contract_id; completed_job_id; completion_gate; quantity; native_unit; upstream_scope; included_resources; excluded_resources; overlap_owner; driver; all_consumers_driver; N"
      collection_method: "Verify actually completed provider job and full resource scope; noncounted providers require actual native exchange unit and separate support."
      unit: "Item(s); actual provider native unit"
      frequency: "each completed contract event"
      temporal_coverage: "actual service reporting period"
      site_scope: "declared external/onsite responsibility"
      aggregation_rule: "per reference flow"
      quality_evidence: "Contract scope, actual physical delivery and no-overlap checklist"
    - protocol_id: cp_assets
      process_id: "preserved_wholesale"
      flow_role: "complete-life assets"
      record_type: "asset inventory and lifetime driver record"
      raw_fields: "site_id; node_id; period_id; consignment_id; asset_id; asset_native_unit; manufacturing_dataset; maintenance; replacements; end_of_life; observed_history_driver; evidenced_remaining_driver; lifetime_driver; cohort_driver; all_consumers; termination_state; remainder_source; uncertainty; provider_overlap; N; driver_id; cohort_driver_unit; lifetime_driver_unit; observed_history_driver_unit; evidenced_remaining_driver_unit; sensitivity_evidence; update_evidence"
      collection_method: "For each asset collect complete manufacture/maintenance/replacement/end-of-life scope; allocate cohort driver over full lifetime driver across all consumers/periods, then divide by N once."
      unit: "Item(s); native asset/service unit"
      frequency: "each acquisition/maintenance/replacement and period"
      temporal_coverage: "observed history plus evidenced remainder to termination"
      site_scope: "all included shared cold-room and handling assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset registers and lifespan/remainder sources, sensitivity, replacement/EOL and provider coverage"
    - protocol_id: cp_freight
      process_id: "preserved_wholesale"
      flow_role: "covered goods/supply/waste transport"
      record_type: "trip and provider scope records"
      raw_fields: "site_id; node_id; period_id; consignment_id; transfer_id; mode; load_mass; mass_unit; distance; distance_unit; actual_route; refrigeration_scope; empty_return_scope; provider_id; provider_dataset; overlap_owner; N; load_mass_conversion_factor; load_mass_conversion_unit; load_mass_conversion_source; distance_conversion_factor; distance_conversion_unit; distance_conversion_source; attribution_share; cohort_driver; all_consumers_driver; driver_unit"
      collection_method: "Use actual compatible load mass and distance by assigned leg; reconcile embedded refrigeration, carrier service and commodity transport ownership."
      unit: "kg*km"
      frequency: "each actual leg"
      temporal_coverage: "declared intake-to-handover and waste logistics responsibility"
      site_scope: "only explicitly included legs"
      aggregation_rule: "per reference flow"
      quality_evidence: "Delivery weights, route proof, mode and carrier coverage statements"
    - protocol_id: cp_waste
      process_id: "preserved_wholesale"
      flow_role: "packaging and other actual wastes"
      record_type: "weighing and receiving treatment records"
      raw_fields: "site_id; node_id; period_id; consignment_id; waste_id; material; quantity; native_unit; wet_state; contamination; receiver_id; treatment_gate; treatment_dataset; transport_owner; N; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Measure segregated actual outputs and verify receiving treatment and transport ownership; expand other chemical/container/fluid wastes by actual state. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kg; actual stream native unit"
      frequency: "each transfer"
      temporal_coverage: "all attributed holding/cleanup periods"
      site_scope: "actual collection and receiving treatment boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weighbridge/container evidence and receiving treatment confirmations"
    - protocol_id: cp_emissions
      process_id: "preserved_wholesale"
      flow_role: "identified direct environmental species"
      record_type: "measurement or matched activity-factor record"
      raw_fields: "site_id; node_id; period_id; consignment_id; source_event_id; species; medium; measured_release; release_unit; actual_activity; activity_unit; factor; factor_unit; factor_basis; factor_source; composition; composition_basis; composition_source; fate; fate_source; uncertainty; N; fate_basis; factor_complete; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Identify actual substance and medium, use measured release or valid matched-activity species factor. A complete species factor is not multiplied by composition/fate a second time. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kg"
      frequency: "each actual source/release event"
      temporal_coverage: "all attributed preservation/handling/cleanup periods"
      site_scope: "only actual direct sources, excluding provider-embedded releases"
      aggregation_rule: "per reference flow"
      quality_evidence: "Measurement or justified factor source, activity match and uncertainty"
  calculation_rules:
    - id: normalize_service
      applies_to: "all inventory rows"
      rule: "Divide the measured or justified attributed physical quantity of each exchange by N once; fixed accepted_service is 1 Item(s)."
      inputs:
        - "attributed quantity"
        - N
        - "row collection protocol"
      output: "quantity per reference flow"
      source_ids: []
    - id: period_share
      applies_to: "electricity; provider_services; freight; electricity_ac"
      rule: "Per period assign measured complete scope times cohort compatible driver divided by all-consumer driver; sum periods without overlap, then apply normalize_service."
      inputs:
        - "period measured quantity"
        - "cohort driver"
        - "all-consumer driver"
        - "scope ownership"
      output: "attributed period quantity"
      source_ids: []
    - id: asset_share
      applies_to: "shared_assets"
      rule: "Complete-asset-equivalent cohort amount equals cohort lifetime-compatible driver divided by total lifetime driver; apply normalize_service once. A lifecycle-complete per-driver provider quantity is an alternative view only."
      inputs:
        - "asset life cycle"
        - "cohort driver"
        - "full-life driver"
        - replacements
        - EOL
        - cp_assets
      output: "attributed asset equivalents"
      source_ids: []
    - id: stock_supply
      applies_to: "diesel_supply; treatment_supplies; packaging_supplies; usable_supply_returns; packaging_supplies_pe_film"
      rule: "S = attributed opening + external receipts - closing including recovered closing. Record gross-with-outlets S and matched usable outward return OR consumed-only S minus matched usable return, never both. Fuel burn remains a separate measured/audited fate."
      inputs:
        - opening
        - receipts
        - closing
        - "usable outward return"
        - representation
        - "actual burn"
        - cp_fuel
        - cp_supplies
      output: "attributed supply and nonadditive return representation"
      source_ids: []
    - id: merchandise_loss_link
      applies_to: "flower_residues; flower_residues_atomic_case"
      rule: "Use lot genealogy and compatible original-gate stem/physical amounts to quantify excluded lost-merchandise upstream adjustment in the linked commodity system. Record whole-stem versus recut/water states and proof of exactly-once integration; do not use hydrated waste mass as original biomass."
      inputs:
        - "source lot"
        - opening
        - receipts
        - closing
        - sold
        - returns
        - downgrade
        - "rejected stems"
        - trims
        - "hydration state"
        - "upstream dataset"
        - "loss-adjustment record"
        - cp_lots
      output: "merchandise loss audit and separately linked commodity burden"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all concrete exchanges"
      requirement: "Verify actual flow UUID, property/unit group and gate before final dataset publication; preserve actual unresolved gaps without a substitute."
      evidence: "Full actual detail/support and compatibility evidence"
    - id: quality_merchandise
      applies_to: "cp_lots"
      requirement: "Reconcile stems and compatible measured masses with hydration/state/trim differences; positive accepted N and individual ownership/resale evidence."
      evidence: "Lot genealogy, weighing/count logs and buyer acceptance"
    - id: quality_coldchain
      applies_to: "preserved_wholesale"
      requirement: "Document actual species/grade conditions, excursions and agreed acceptance action; no source-example threshold treated as a universal compliance guarantee."
      evidence: "Time-temperature/humidity and inspection/treatment records"
    - id: quality_complete
      applies_to: "all inventory"
      requirement: "Actual utilities, supplies, assets, providers, freight, waste and actual environmental intakes/outlets accounted once; absence claims need observed scope evidence."
      evidence: "Scope ledger and period/driver reconciliation"
    - id: quality_chain
      applies_to: "whole-chain integration"
      requirement: "Complete linked original-gate commodity production/loss adjustment and treatment-boundary matching exactly once; stand-alone service cannot claim the full flower footprint."
      evidence: "Downstream integration and receiving dataset checks"
    - id: electricity
      applies_to: "preserved_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Metered room, lighting and handling electricity attributable to the accepted consignment cohort; exclude electricity already inside a complete provider service. Range evidence need: Require room/ambient temperature, occupancy and period-resolved metering with allocation evidence, including idle/changeover energy; no universal kWh per stem. Measurement evidence: protocol cp_energy; original record basis Energy / kWh. The original amount constraint “Measured attributable kWh / N; cp_energy.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_energy; actual source-linked native records"
    - id: water_supply
      applies_to: "preserved_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Only actual supplied product water, separately metered by use; no assumed hydration for dry-held species. Environmental abstraction requires a separate actual source exchange. Range evidence need: Require intake/use/outlet records, holding and drainage times and water state; plant uptake, wastewater and evaporation are not one residual. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Measured attributable supplied water m3 / N; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: water_supply_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_water; actual source-linked native records"
    - id: treatment_supplies
      applies_to: "preserved_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Conditional actual formulated preparations, each SKU/composition/state as a separate concrete exchange; no universal preservative or silver treatment is prescribed. Range evidence need: Require actual label-approved use, active fraction, carrier, dilution, native purchase unit and measured mass/density conversion; ingredient and whole formulation views are nonadditive. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Attributable supplied preparation kg / N; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: packaging_supplies
      applies_to: "preserved_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Actual mass-accounted sleeves, paper and cartons supplied to this operation. If the upstream exchange uses Count/Area/Length, expand that native-unit exchange rather than assume a mass conversion. Range evidence need: Require item/material/native-unit and stock/return evidence; measured item mass or geometry/density for a separate mass view, with no duplicate exchange. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Attributable packaging supply kg / N; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: packaging_supplies_pe_film; packaging_supplies_paperboard_carton. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: refrigerant_supply
      applies_to: "preserved_wholesale"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Record only attributable purchased/make-up fluid by actual mixture and composition; this supply is not an estimate of atmospheric release. Range evidence need: Require stock, charging, recovery, equipment charge and service records with component mass fractions; no generic annual leakage factor. Measurement evidence: protocol cp_refrigerant; original record basis Mass / kg. The original amount constraint “Attributable refrigerant supplied kg / N; cp_refrigerant.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_refrigerant; actual source-linked native records"
    - id: provider_services
      applies_to: "preserved_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Only a contractually defined completed counted job with disclosed full upstream coverage; time, electricity, freight or mass-based contracts require their actual native-unit exchanges. Range evidence need: Require provider scope and physical completion, boundary, unit and coverage overlaps; price, invoices or labor hours alone do not establish one complete service. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “Attributable completed provider jobs / N; cp_provider.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_provider; actual source-linked native records"
    - id: shared_assets
      applies_to: "preserved_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Cold rooms, refrigeration plant, buckets, trolleys and IT/handling assets shared across consignments and periods; each actual asset requires its native full-life inventory. Range evidence need: Require manufacture, maintenance, replacements and end-of-life with observed lifetime driver or observed history plus evidenced remainder; no assumed life or double-counted rental. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Attributed complete asset equivalents / N; cp_assets.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "preserved_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Conditional actual inbound/outbound and return legs assigned once by agreed provider/commodity/service boundaries. Cold transport must cover its energy and refrigeration burdens once. Range evidence need: Require mass including actual load basis, distance and transport mode, refrigeration/empty-return scope and provider coverage; not order count times guessed distance. Measurement evidence: protocol cp_freight; original record basis Mass * distance / kg*km. The original amount constraint “Attributable actual kg*km / N; cp_freight.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: usable_supply_returns
      applies_to: "preserved_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Only actual unused supplies returned to an outside owner; closing stock and internal recirculation are not outward returns. Native-count reusable container movements remain in the asset ledger, expanded if independently transferred. Range evidence need: Require matched original supply and receiving owner/state with selected gross-with-outlets or consumed-only representation; never subtract twice. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Measured attributable outward unused supply kg / N; cp_supplies.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_supply_returns_pe_film_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: usable_recovered_refrigerant
      applies_to: "preserved_wholesale"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Only real usable fluid transferred outward: expand separate Product exchanges by actual mixture/state, initial-charge or standalone make-up provenance and recipient. Retained recovery is closing stock, not an outlet; no automatic substitution credit. Range evidence need: Require measured outward mass, mixture composition, charge provenance/coverage and recipient. Consumed-only omission applies only to matched same-scope standalone unused supply; factory-charge recovery cannot reduce unrelated make-up or produce negative input. Measurement evidence: protocol cp_refrigerant; original record basis Mass / kg. The original amount constraint “Actual exclusively attributed mass / N; cp_refrigerant.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_refrigerant; actual source-linked native records"
    - id: flower_residues
      applies_to: "preserved_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Separate whole rejected stems from trimming residues by lot and actual receiving route; saleable downgrades and supplier returns are merchandise audit exits, not automatically Waste. Range evidence need: Require actual wet state, drainage and destination; match discarded merchandise to upstream lot amount for separate commodity loss adjustment, not discard wet mass as cultivated biomass. Measurement evidence: protocol cp_lots; original record basis Mass / kg. The original amount constraint “Measured attributable flower residues kg / N; cp_lots.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: flower_residues_atomic_case; flower_residues_stem_trimmings. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_lots; actual source-linked native records"
    - id: packaging_waste
      applies_to: "preserved_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Expand actual material and receiving treatment; no avoided-material credit from mere collection, and no automatic treatment identity from bin color. Range evidence need: Require weighed segregated stream, contamination and receiver records; exclude intact returnable containers and carried closing stocks. Measurement evidence: protocol cp_waste; original record basis Mass / kg. The original amount constraint “Measured attributable packaging waste kg / N; cp_waste.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: packaging_waste_paper_pack; packaging_waste_metal_pack; packaging_waste_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_waste; actual source-linked native records"
    - id: wastewater
      applies_to: "preserved_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual collected aqueous wastes to a verified treatment provider, with composition including any treatment chemistry; not a direct environmental release. Range evidence need: Require measured volume, composition, density where converting, containment and receiver. Direct discharge needs actual receiving medium and dedicated water/species exchanges. Measurement evidence: protocol cp_water; original record basis Volume / m3. The original amount constraint “Measured attributable contained aqueous waste m3 / N; cp_water.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_water; actual source-linked native records"
    - id: contained_refrigerant_waste
      applies_to: "preserved_wholesale"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Expand actual discarded contained fluid as separate Waste exchanges by actual mixture/state and receiving-treatment path; mutually exclusive with usable transfer, retained recovery and atmospheric component releases. Range evidence need: Require measured handed-over mass/composition, receiver transport/treatment and provider coverage once; recovered quantity or charge imbalance is not automatically waste or atmospheric release. Measurement evidence: protocol cp_refrigerant; original record basis Mass / kg. The original amount constraint “Actual exclusively attributed mass / N; cp_refrigerant.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_refrigerant; actual source-linked native records"
    - id: direct_species
      applies_to: "preserved_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Conditional expansion by actual species and air/water/soil medium for verified combustion, flower respiration, treatment or spill releases; no generic VOC/CO2 default from flowers or diesel supply. Range evidence need: Require substance/basis/medium and measured release or matched actual activity factor; whole formulation and component species views are nonadditive, no hazard limit used as emission amount. Measurement evidence: protocol cp_emissions; original record basis Mass / kg. The original amount constraint “Measured or valid activity-factor species release kg / N; cp_emissions.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: direct_species_co2_fossil_air; direct_species_methane_fossil_air; direct_species_nitrous_oxide_air. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_emissions; actual source-linked native records"
    - id: refrigerant_release
      applies_to: "preserved_wholesale"
      requirement: "Obtain the circuit/equipment identifier, fluid designation, composition and service record. Distinguish new make-up, installed charge, recovered reusable fluid, contained unusable fluid and each actually released chemical; the chemical identity is not established by the present route evidence. Expand each measured released component, not a generic refrigerant mixture or charged amount; recovered fluid and contained waste are separate actual fates. Range evidence need: Require full charge/recovery/stocks/remaining charge reconciliation and uncertainty; unexplained imbalance must be investigated, not automatically called atmospheric leakage. Measurement evidence: protocol cp_refrigerant; original record basis Mass / kg. The original amount constraint “Measured or audited component release kg / N; cp_refrigerant.” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_refrigerant; actual source-linked native records"
validation_rules:
  - rule_id: validate_gate
    applies_to: "accepted_service"
    rule: "Require positive unique accepted N, actual B2B ownership-resale gate and full reference qualifiers; no failed/cancelled consignment counted as accepted output."
    source_ids: []
  - rule_id: validate_preservation
    applies_to: "preserved_wholesale"
    rule: "Require actual intake usable state, maintained condition, species-specific route, acceptance gate and declared excursion/reject decisions, with source scope respected."
    source_ids:
      - umass-cutflower-handling
      - ucdavis-gladiolus-2004
  - rule_id: validate_units
    applies_to: "all inventory"
    rule: "Native exchange units, measured conversions and same N must align; no count=kg, order=tonne, price=service, energy/Time property substitution or implicit mixture species identity."
    source_ids: []
  - rule_id: validate_paths
    applies_to: "all returns/rejects"
    rule: "Every rejected/downgraded/returned/discarded lot has a producing responsibility and actual receiver/path; no duplicate accepted service, automatic waste classification or substitution credit."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "all shared resources"
    rule: "Close period driver totals and provider/native-unit/full-life asset coverage including maintenance/replacement/EOL; missing life/remainder/owner prevents final package completeness."
    source_ids: []
  - rule_id: validate_water_release
    applies_to: "actual environmental exchanges"
    rule: "Containment, direct medium, actual substance, activity/factor/composition/fate basis and uncertainty must be known. No supplier SDS, added water, charged refrigerant or unexplained imbalance alone proves emitted quantity."
    source_ids: []
  - rule_id: validate_chain
    applies_to: "service and linked commodity system"
    rule: "No cultivation burden for any merchandise in this add-on; require separately quantified upstream lost-commodity burden plus saleable-product burden exactly once and disjoint logistics/treatment before whole-chain completeness."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual exchange identities and quantitative evidence are verified"
  downstream_use: "Physical wholesale-service add-on to a compatible cut-flower commodity chain, referenced to a declared accepted consignment"
  allowed_use: "Declared own-account B2B refrigerated cut-flower route and recorded quality/quantity/time stratum with transparent unresolved limitations"
  excluded_use: "Whole cut-flower footprint by itself; retail or cultivation; potted plants; fee agency; currency trade margins; universal stem/tonne/vase-life conversion"
  required_metadata: "All required reference qualifiers; service and supplier gates; positive N; periods/room/site; native exchanges; loss-adjustment and overlap ownership; complete asset life evidence"
  required_quality_disclosure: "Identity and support gaps; measurements/conversions; conditional omissions; Range evidence needs; species-specific condition/acceptance limits; provider/commodity loss and uncertainty coverage"
  update_trigger: "Changed species/route, room energy mix or equipment, treatment/packaging, provider or disposal scope, asset lifetime/usage, measured loss structure, reference gate or evidence"
data_sources:
  - id: "unsd-cpc3-wholesale-2025"
    type: "official_guidance"
    reference: "UNSD. CPC Version 3.0 explanatory notes, division 61; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Own-account wholesale/B2B service classification, not physical inventory or emissions factors."
  - id: "umass-cutflower-handling"
    type: "extension_guidance"
    reference: "UMass Amherst Extension. Harvesting and Handling Cut Flowers; https://www.umass.edu/agriculture-food-environment/greenhouse-floriculture/fact-sheets/harvesting-handling-cut-flowers"
    used_for: "Species-dependent temperature/hydration and ethylene/sanitation/condensation quality considerations only; no universal recipe, regulatory claim or loss/energy default."
  - id: "ucdavis-gladiolus-2004"
    type: "extension_guidance"
    reference: "Reid, M. S. (2004). Gladiolus. UC Davis Postharvest Research and Extension Center; https://postharvest.ucdavis.edu/produce-facts-sheets/gladiolus"
    used_for: "Limited gladiolus example of maturity, mechanical condition, orientation, cold-chain and cultivar sensitivity; no transfer of thresholds to all flowers."
