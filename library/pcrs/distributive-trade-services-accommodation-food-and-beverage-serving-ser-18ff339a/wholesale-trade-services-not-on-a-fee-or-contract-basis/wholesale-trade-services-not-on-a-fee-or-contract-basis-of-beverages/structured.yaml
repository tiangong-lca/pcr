      unit: "kg; Item(s); actual native units and conversions"
      frequency: "each actual receipt/use/return/stocktake"
      temporal_coverage: "Complete supply source/use/return periods including open cohorts"
      site_scope: "Named actual direct supply scope with provider overlap excluded"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated net measures; SKU/unit and pairing/closing evidence; actual composition and conversion source"
    - protocol_id: cp_utilities
      process_id: "ambient_wholesale"
      flow_role: "actual source meters and all-consumer utility attribution"
      record_type: "meter_period_driver_record"
      raw_fields: "site_id; cohort_id; period_id; meter_id; utility_source; provider; meter_unit; opening_reading; closing_reading; import_quantity; export_quantity; direct_submeter_quantity; conversion; conversion_source; all_consumers; all_periods; consumer_driver; total_driver; driver_unit; driver_basis; driver_source; allocation_rationale; handling_events; occupied_space; space_unit; start_time; end_time; duration; duration_unit; idle_quantity; hygiene_event_id; breach_cleanup_event_id; electric_handling_coverage; utility_water_coverage; recirculation; actual_makeup; provider_overlap; calibration; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Use actual source import interval or matched direct submeter, with nonoverlapping scopes. Attribute all-consumer quantity on evidenced handling/space-time or justified driver, including idle/hygiene/failed/open events. Mineral merchandise water is not utility meter supply. Actual dedicated climate intervention triggers route review. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kWh; m3; actual meter/driver units"
      frequency: "each matching meter and consumer/event interval"
      temporal_coverage: "All actual service periods/users and idle/cleaning/open cohorts"
      site_scope: "Actual direct meter boundary and supplier treatment; provider overlap excluded"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, real interval/source readings and all-user driver evidence with rationale"
    - protocol_id: cp_provider
      process_id: "ambient_wholesale"
      flow_role: "physical provider packages"
      record_type: "physical_package_record"
      raw_fields: "provider_id; package_id; native_quantity; native_unit; package_definition; equivalent_conversion; conversion_source; site_id; cohort_id; event_id; period_id; actual_start; actual_end; duration; duration_unit; included_electricity; included_supplies; included_assets; included_freight; included_treatment; excluded_resources; direct_overlap; other_provider_overlap; actual_completion; uncertainty"
      collection_method: "Obtain actual equivalent completed package definition, native quantity and full resource/result scope. Reconcile direct/provider/carrier/treatment/asset owners once; commercial invoice alone cannot establish resource-free Count. Water processing remains outside."
      unit: "Item(s) or actually expanded native unit"
      frequency: "each completed actual contract/event"
      temporal_coverage: "All package source, operating and treatment periods"
      site_scope: "Named physical provider responsibility with explicit exclusions"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual signed completion, package/native-unit evidence and overlap matrix"
    - protocol_id: cp_assets
      process_id: "ambient_wholesale"
      flow_role: "complete lifecycle assets all consumers"
      record_type: "asset_lifetime_driver_record"
      raw_fields: "asset_id; asset_type; asset_identity; asset_equivalent_unit; dataset_scope; manufacture_coverage; maintenance_coverage; replacements; replacement_unit; retirement; end_of_life; history_start; history_end; observed_driver; observed_driver_unit; remaining_driver; remaining_driver_unit; remainder_source; life_driver; life_driver_unit; job_driver; job_driver_unit; all_consumers; all_periods; driver_basis; driver_source; reuse_cycles; actual_turns; uncertainty; sensitivity; update_trigger; direct_event_scope; provider_asset_coverage; carrier_asset_coverage; overlap_owner; conversion; conversion_source"
      collection_method: "Identify actual warehouse/rack/forklift/reusable pallet/monitor/weigher lifecycle. Attribute matching complete asset equivalent with compatible all-consumer life driver, observed history and evidenced remainder including replacement/termination/EOL. Actual turn counts inform drivers but are not new manufacture each turn. Partition direct current events/providers/carriers."
      unit: "Item(s) equivalent; actual compatible life/job driver units"
      frequency: "each asset period/maintenance/replacement/retirement review"
      temporal_coverage: "Full asset manufacture through end-of-life, history plus evidenced remainder and every consumer"
      site_scope: "One actual complete asset responsibility; direct/provider/carrier overlap accounted once"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset coverage/history/remaining-life source; driver units and uncertainty/sensitivity"
    - protocol_id: cp_freight
      process_id: "ambient_wholesale"
      flow_role: "actual whole-load transport"
      record_type: "shipment_work_record"
      raw_fields: "shipment_id; carrier_id; mode; supplier_gate; destination_gate; cohort_id; consignment_id; period_id; actual_start; actual_end; water_payload_mass; pet_closure_label_mass; inherited_outer_mass; added_pack_mass; transported_pallet_support_mass; mass_unit; whole_payload_mass; route_distance; distance_unit; load_share; share_basis; share_source; multi_drop_coverage; empty_leg_coverage; return_coverage; native_work_unit; work_conversion; conversion_source; carrier_energy_scope; carrier_asset_scope; direct_overlap; uncertainty"
      collection_method: "Reconcile actual transported water plus inherited/added packing and pallet/support load at agreed gates. Multiply compatible whole payload and actual route distance with actual disjoint shipment/consignment share. State empty/multi-drop/return and carrier energy/assets coverage."
      unit: "kg*km; actual payload/distance/native-work units"
      frequency: "each real shipment and return leg"
      temporal_coverage: "Actual agreed transport gates and associated empty/return periods"
      site_scope: "Named carrier work with embedded energy/asset owners"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual load/route/share records and source-backed unit conversions"
    - protocol_id: cp_outlets
      process_id: "ambient_wholesale"
      flow_role: "contained damaged pack cleanup solids and liquids"
      record_type: "outlet_receiver_record"
      raw_fields: "site_id; cohort_id; event_id; period_id; stream_id; material_identity; stream_state; classification; gross_quantity; tare_quantity; net_quantity; quantity_unit; remaining_contents; remaining_contents_unit; composition; composition_basis; composition_source; water_merchandise_fraction; utility_water_fraction; retained_cleanup_fluid; inherited_pack_inclusion; separate_stream_exclusion; density; density_unit; density_temperature; density_source; volume; volume_unit; conversion; conversion_source; pollutant_load; pollutant_unit; load_source; collection_method; receiver; transfer_id; receiver_acceptance; treatment_route; treatment_scope; provider_coverage; direct_release_exclusion; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_origin_and_medium; actual_state_and_gate; case_activation_evidence; typed_or_residual_quantity; quantity_exclusion_links; whole_total_reconciliation; unresolved_occurrence_not_zero"
      collection_method: "Measure each actual separated pack, mixed cleanup solid or contained liquid in its actual stream state and native unit; define remaining contents and nonadditive component views. Verify receiver/treatment and provider ownership once, exclude already-transferred intact packs and retained closing material. Composition and pollutant load require actual independent evidence. Partition actual native records by flow_row_id and actual_identity_case; only evidenced cases activate. Typed and residual actual quantities are exclusive across the node, each physical outlet/input is assigned once and reconciles with a compatible same-scope non-additive total. Keep unknown occurrence/quantity unresolved, not zero."
      unit: "kg; m3; actual stream native units"
      frequency: "each actual collection/transfer and receiver acceptance"
      temporal_coverage: "All actual loss/cleaning/receiver periods with stock retained separately"
      site_scope: "Actual contained physical receiver interface, no automatic direct release"
      aggregation_rule: "per reference flow"
      quality_evidence: "Measured net quantity/density/state, actual composition/load basis and receiver treatment evidence"
    - protocol_id: cp_environment
      process_id: "ambient_wholesale"
      flow_role: "actual direct species and receiving medium"
      record_type: "direct_species_measurement_record"
      raw_fields: "site_id; cohort_id; event_id; period_id; substance_identity; receiving_medium; release_state; measured_mass; measured_mass_unit; measured_volume; measured_volume_unit; activity; activity_unit; species_factor; factor_unit; factor_source; factor_scope; factor_complete; measured_whole_stream_release; whole_stream_unit; composition; composition_basis; composition_source; fate; fate_basis; fate_source; temperature; temperature_unit; pressure; pressure_unit; density; density_source; conversion; conversion_source; retained_captured_quantity; receiver_treatment_coverage; applicability; calibration; uncertainty"
      collection_method: "Establish actual species and receiving medium before identity choice. Select measured species mass OR justified matched activity/factor OR measured whole-stream composition/fate. A complete species factor is not multiplied by composition/fate again. Collected streams/retained stock differ from actual environment release; uncontained whole liquid needs appropriate separate native identity and no pure-water assumption."
      unit: "kg species; all raw native activity/concentration/stream units"
      frequency: "each actual event or justified matched monitoring interval"
      temporal_coverage: "Actual release period and source applicability, no inferred opening/closing residual"
      site_scope: "Named direct environmental interface excluding contained receiver treatment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Measurement/calibration or justified factor applicability/composition/fate sources and conversion uncertainty"
  calculation_rules:
    - id: accepted_consignment
      applies_to: "accepted_service"
      rule: "N=count unique final accepted_consignment_ids at reference_gate_id; accepted_service=1 Item(s)."
      inputs:
        - cp_waterpack
      output: "One complete actual commercial service with actual contents/count/pack/state/time qualifiers"
      source_ids: []
    - id: contents_pack_views
      applies_to: "non-exchange commodity"
      rule: "contents_net_mass=whole_pack_gross-pet_tare-closure_tare-label_tare-outer_pack_tare-pallet_support_tare on actual compatible boundary; OR contents_net_mass=actual_volume*density with compatible measured volume/density-temperature evidence. Labelled volume, bottle count and actual contents are separately recorded nonadditive views."
      inputs:
        - cp_waterpack
      output: "Actual water/pack/tare audit, no constant litre-to-kg factor"
      source_ids: []
    - id: source_gate_demand
      applies_to: "non-exchange commodity"
      rule: "assigned_source_gate_quantity=actual compatible evidenced allocation/conversion of source_gate_input_quantity to accepted cohort, with originally supplied unrecovered water and matching packaging where evidenced, exclusive returns/closing/other exits. commodity_source_gate_demand=assigned_source_gate_quantity/N outside service; actual loss_adjustment_quantity/unit/basis/source/owner and already_included_loss_coverage reconcile once. Unknown stock difference is not loss."
      inputs:
        - cp_waterpack
        - N
      output: "Separate source-gate filled/sealed demand and once-only commodity loss interface"
      source_ids: []
    - id: new_supply_stock
      applies_to: "service new supplies; unused returns"
      rule: "S=opening_supply+net_receipts-closing_supply; net_receipts=gross_receipts-receipt_tare. Gross input S/N plus actual matched outward return usable_outward_return/N OR consumed-only (S-usable_outward_return)/N and omit matching return exchange. Recoveries retained included in closing; use actual native units and conversion sources."
      inputs:
        - cp_supplies
        - N
      output: "Actual service supply and selected one return convention per reference flow"
      source_ids: []
    - id: meter_attribution
      applies_to: "electricity; cleaning_water; electricity_ac; cleaning_water_liquid_tap"
      rule: "actual_meter_quantity=closing_reading-opening_reading with actual import/export direction OR matched direct_submeter_quantity; attributable_quantity=(actual_meter_quantity*consumer_driver/total_driver)/N on disjoint scopes and complete all-user periods, retaining idle/hygiene/open work."
      inputs:
        - cp_utilities
        - N
      output: "Actual purchased utility quantity per reference flow"
      source_ids: []
    - id: physical_provider
      applies_to: "provider_packages"
      rule: "provider_quantity=native_quantity*equivalent_conversion/N only for evidenced actual matching package; embedded physical resource owners reconciled."
      inputs:
        - cp_provider
        - N
      output: "Actual equivalent package quantity per reference flow"
      source_ids: []
    - id: asset_equivalent
      applies_to: "shared_assets"
      rule: "asset_equivalent=(job_driver/life_driver)/N; life_driver=observed_driver+remaining_driver in compatible units, sourced full-life coverage and remainder, all consumers included. No duplicate per-driver service view."
      inputs:
        - cp_assets
        - N
      output: "One compatible actual full-lifecycle asset-equivalent share per reference flow"
      source_ids: []
    - id: whole_load_freight
      applies_to: "freight"
      rule: "whole_payload_mass=water_payload_mass+pet_closure_label_mass+inherited_outer_mass+added_pack_mass+transported_pallet_support_mass on actual disjoint load components; freight_work=whole_payload_mass*route_distance*load_share/N after actual unit conversions and exclusive empty/return coverage."
      inputs:
        - cp_freight
        - N
      output: "Actual whole-load transport work per reference flow"
      source_ids: []
    - id: actual_contained_outlets
      applies_to: "intact_pack_waste; empty_pack_waste; cleanup_waste; contained_wastewater; empty_pack_waste_plastic_pack; intact_pack_waste_atomic_case"
      rule: "intact_pack_waste=intact_waste_transfer_mass/N for actual intact whole pack. Other outlet_quantity=(gross_quantity-tare_quantity)/N or actual volume/N with compatible density/temperature conversion as needed. Separate whole streams and components; receiver/treatment counted once, retained closing/internal movements not exports."
      inputs:
        - cp_waterpack
        - cp_outlets
        - N
      output: "Actual disjoint contained outlets in recorded native states per reference flow"
      source_ids: []
    - id: species_mass
      applies_to: "direct_species"
      rule: "species_mass=measured_mass/N OR activity*species_factor/N OR measured_whole_stream_release*composition*fate/N after compatible source-backed conversions; choose one method. factor_complete forbids extra composition/fate; no whole-stream/species duplicate physical output."
      inputs:
        - cp_environment
        - N
      output: "Actual species mass and receiving medium per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: sealed_source_state
      applies_to: "received and accepted filled packs"
      requirement: "Actual supplier/source/SKU filled-sealed one-wayPET noncarbonated release, actual buyer criteria, pack integrity/exposure history and unique acceptance required. No historical numeric quality/health/legal guarantee."
      evidence: "cp_waterpack actual release/condition/buyer records"
    - id: quantity_and_loss
      applies_to: "water and pack ledger"
      requirement: "Actual bottle/case/label-volume/contents-mass/density-temperature/tare views compatible and separate. Actual filledpack source-gate demand, intact vs breach/returns/closing/outlets and external loss ownership/coverage required, no default deficit loss."
      evidence: "Measured stocks/state/fates and quantified linked commodity interface"
    - id: resource_completeness
      applies_to: "all consumers/providers/assets/transport"
      requirement: "Complete actual event/period/driver units, full asset life/history/remainder/EOL and physical resource ownership including hygiene/idle/unfinished/failed and transport/treatment."
      evidence: "Source meters all-user drivers, provider scope and lifecycle records"
    - id: actual_identity_ranges
      applies_to: "actual expanded exchanges"
      requirement: "Verify specific products/wastes/species/native property-unit support before final data; numerical bounds need independent comparable evidence, no invented benchmark."
      evidence: "Actual detail/support and range applicability evidence"
    - id: electricity
      applies_to: "ambient_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Measure actual electric forklift charging, conveyors, lighting, ordinary ventilation and cleaning equipment attributable to the declared ambient warehouse service. No onsite combustion or dedicated refrigeration/heating intervention in this route. Operator climate-control intervention, if actually required, needs route/module review rather than silent inclusion. Range evidence need: Use actual source meter periods, equipment/charging scope and all-consumer driver records including idle/failed handling; no assumed kWh per bottle, nominal motor capacity or ambient climate-control default. Measurement evidence: protocol cp_utilities; original record basis Energy / kWh. The original amount constraint “Actual attributable purchased electricity per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: cleaning_water
      applies_to: "ambient_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Only externally supplied utility water actually used for floor/equipment hygiene or breach cleanup. Merchandise mineral water remains a separate commodity ledger and is never counted as purchased cleaning supply or direct abstraction. Record recirculation and genuine externally supplied make-up distinctly. Range evidence need: Actual cleaning event meters, utility source/treatment and breach-cleanup inclusion are needed; no labelled bottle volume used as utility amount, or purchase-to-sewer equality. Measurement evidence: protocol cp_utilities; original record basis Volume / m3. The original amount constraint “Actual attributable purchased utility water per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: cleaning_agents
      applies_to: "ambient_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand actual named formulated products, native product mass, composition basis and use/fate for warehouse surfaces or cleanup. No bottle opening/rinsing/disinfection/resealing or processing of mineral-water contents belongs to this merchant route. Range evidence need: Require actual product/SKU and net receipts/stocks/unused returns and handling records; no universal chemical recipe, dose, composition or release fraction. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable new hygiene agent supply per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleaning_agents_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: cleanup_consumables
      applies_to: "ambient_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Actual absorbents, wipes or other mass-measured expendables used to contain a breached pack event, segregate damaged goods or maintain handling equipment. Record clean product mass separately from retained water/chemical contamination in spent material. Conditional zero use needs event evidence. Range evidence need: Need actual consumable identity/native quantities/stock and compatible spent-material composition; no standard spill kit, absorbed-water ratio or unexplained loss allowance. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable new cleanup-consumable supply per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: added_packing
      applies_to: "ambient_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Only new secondary transit supports, straps, wraps or outer cases actually added by the merchant for the consignment, expanded by each actual unit/material and measured per-piece mass when needed. Supplier PET bottles/closures/labels and inherited outer packing are merchandise, not newly manufactured or purchased packaging inputs here. Reusable pallets are assets, not disposable units on every turn. Range evidence need: Actual packing unit definition, stock/unused returns, per-piece material mass and transit role required; no fixed bottles per case, wrap grams per pallet or automatically added secondary pack. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “Actual attributable additional transit packing units per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_packages
      applies_to: "ambient_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Actual contracted physical warehouse inspection, sanitation, maintenance or handling package only when its provider defines one equivalent completed unit and includes full physical resources. No margin, insurance, finance or invoice-equivalent substitute. Products remain filled/sealed; contracted water treatment/filling/resealing is actual processing outside this route. Range evidence need: Obtain package definition/native-unit conversions, actual completed quantity, boundaries and direct/provider overlap matrix; no standard service price, duration or resource-free Count substitute. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “Actual attributable equivalent provider packages per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_provider; actual source-linked native records"
    - id: shared_assets
      applies_to: "ambient_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Use actual complete warehouse, racks, forklift/electric handling, reusable pallets, monitoring or weighing equipment with matching whole-asset equivalent and one burden owner. Full manufacture, maintenance, replacement and retirement/end-of-life cover all actual consumers and periods; service rent or per-turn pallet circulation is not automatically a whole new asset. Range evidence need: Actual asset ID/type, complete lifecycle coverage, driver units, observed life and evidenced remainder across all users required; no standard warehouse lifetime, pallet turns or zero end-of-life. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual attributable full-asset equivalents per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "ambient_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Actual agreed inbound/outbound/return freight with carrier gate and all load components: water contents, PET bottle/closure/label, inherited and added outer packaging, pallet/handling supports where transported. Commodity water net mass alone is not whole payload. Do not duplicate carrier electricity/fuel/vehicle infrastructure already in its transport dataset. Range evidence need: Actual payload components, loading/route distance, multi-drop share and empty return coverage/native-unit conversion are required; no nominal litre=kg default or standard route/loading ratio. Measurement evidence: protocol cp_freight; original record basis mass*distance / kg*km. The original amount constraint “Actual attributable freight work per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: unused_count_returns
      applies_to: "ambient_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Actual external return of unused merchant-added Count packing matched to the same supplystock/unit and recipient acceptance. Retained or internally moved stock is not an external exchange. Use either gross supply plus this outward return, or consumed-only supply with this return exchange omitted, never both deductions. Range evidence need: Require paired original supply ID, actual outward quantity/unit and recipient record; no assumed return rate, inherited-bottle deposit credit or recycling credit. Measurement evidence: protocol cp_supplies; original record basis Count / Item(s). The original amount constraint “Actual attributable returned unused packing units per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: unused_mass_returns
      applies_to: "ambient_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Actual externally returned unused hygiene/cleanup supply, with exact product/state and matching standalone input-stock scope. Commercial filled-bottle returns belong to the non-exchange commodity audit; spent contaminated wipes are waste. Range evidence need: Need actual same-scope supply/outward-return pairing and net mass; no negative utility demand or automatic credit from merchandise returns. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual attributable unused supply mass returned per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: unused_mass_returns_detergent_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: intact_pack_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual intact sealed filled packs accepted by a named waste receiver, with measured water-plus-primary-pack mass and state. Commercial usable supplier/buyer returns are not this waste. An intact-pack transfer is one whole-state outlet; do not simultaneously report its still-contained water and PET as additional physical outlets. Commodity loss demand remains outside this service; actual handling/treatment owner remains once. Range evidence need: Need actual rejected lot/bottle count, intact status, measured gross/net receiver basis and transfer/treatment scope; do not presume rejected stock was opened, leaked or entirely discarded. Measurement evidence: protocol cp_waterpack; original record basis Mass / kg. The original amount constraint “Actual attributable intact filled-pack waste transfer mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: intact_pack_waste_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_waterpack; actual source-linked native records"
    - id: empty_pack_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual breached PET bottle/closure/label waste physically separated for receiver transfer, plus declared remaining adhered contents only when included in measured stream state. Not new bottle manufacture. Inherited secondary-pack waste expands separately by actual material/receiver if damaged. No duplicate transfer of an intact whole pack or already included mixed cleanup solids. Range evidence need: Require actual component/stream identity, remaining-content basis, net mass and receiver sorting/treatment; no standard PET tare, recycling yield or avoided virgin material credit. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual attributable separated damaged-pack waste mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: empty_pack_waste_plastic_pack. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: cleanup_waste
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual spent absorbents, wipes and handling/hygiene residues with measured dry consumable, retained mineral water/utility water/chemical state as recorded; one whole mixed physical stream to actual receiver. Contents and clean consumable supply are analytical views, not extra duplicate outflows. Range evidence need: Need actual net transfer mass, composition/state and source, retained fluid and excluded pack streams; no waste mass inferred from purchased absorbents or stock deficit. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “Actual attributable mixed cleanup-solid transfer mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: cleanup_waste_spent_wipe. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: contained_wastewater
      applies_to: "ambient_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Actual separately identified collected breached water and/or cleaning liquid to a receiver, with actual mixing/composition, compatible volume/density/temperature or net mass conversion and pollutant-load evidence. Utility water, spilled merchandise, condensed external moisture and retained cleanup fluid differ. A contained stream is not a direct environmental water emission or pollutant species. Range evidence need: Require actual collection/receiver volume or measured mass-density basis and treatment scope; no pure-water assumption, labelled bottle litres=outfall or default sewer fraction. Measurement evidence: protocol cp_outlets; original record basis Volume / m3. The original amount constraint “Actual attributable contained liquid transfer volume per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_outlets; actual source-linked native records"
    - id: direct_species
      applies_to: "ambient_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Only actual direct release with named substance and receiving medium, measured mass or justified matched activity/factor or measured whole-stream composition/fate. Mineral-water merchandise is not automatic pure water, extraction or pollutant discharge. An actual uncontained liquid needs appropriate separate native whole-stream identity/unit and independently supported species; no stock-difference release, and no collected waste release before its receiver treatment. Non-carbonated does not mean chemically zero dissolved carbon dioxide; Neither bottle breach nor a label alone establishes whether, or how much, carbonate/carbon-dioxide is released. Require actual release evidence; assume neither zero nor a positive release. Range evidence need: Require species/medium, quantity and unit conversions, composition/factor applicability and fate source; no SDS=release, default mineral species, evaporation loss or complete-chemical-release assumption. Measurement evidence: protocol cp_environment; original record basis Mass / kg. The original amount constraint “Actual attributable directly released species mass per reference flow” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
