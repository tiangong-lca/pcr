_id; loss_adjustment_quantity; loss_adjustment_unit; loss_adjustment_basis; loss_adjustment_source; loss_owner; already_included_loss_coverage; commodity_overlap_check; buyer_signature; calibration; uncertainty; flow_row_id; actual_identity_case; actual_substance_or_material; actual_state_and_gate; case_activation_evidence; quantity_exclusion_links; whole_total_reconciliation"
      collection_method: "Join actual supplier source/SKU/filled-sealed release to merchant ownership, individual pack/cohort, adopted integrity/condition criteria and final unique buyer acceptance. Weigh contents separately from PET/closure/label/outer/pallet/support tare or convert actual volume with density/temperature evidence. Keep label volume/count analytical views separate. Reconcile actual same-state stocks/returns/closing/internal transfers, intact reject versus actual breach/fates and unknown discrepancy. Trace original filled/sealed assigned demand and actual compatible loss with one external owner and existing coverage; no loss from deficit. Attribute only the individually identified physical case; retain other source-linked actual fates separately. Each native record belongs to exactly one exchange and any whole total is a non-additive audit."
      unit: "Item(s); actual water kg/m3 and pack-state native units"
      frequency: "each actual receipt/check/movement/breach/reject/acceptance/stocktake"
      temporal_coverage: "Supplier release/receipt through handover plus prior/later stocks and unfinished/failed repeated attempts"
      site_scope: "One actual merchant responsibility and linked commodity release and buyer gates"
