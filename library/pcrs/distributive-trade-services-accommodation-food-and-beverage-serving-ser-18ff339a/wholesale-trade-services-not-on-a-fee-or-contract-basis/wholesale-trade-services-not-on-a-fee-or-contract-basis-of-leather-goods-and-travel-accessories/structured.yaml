  - rule_id: operating_stock_returns
    applies_to: "service supplies"
    rule: "Let S=assigned opening+NET external receipts-closing including retained recoveries. Use gross S/N and matched actual unused external return OR consumed (S-return)/N and OMIT matching return exchange. Internal loops/retained recoveries are stock. Actual waste/consumption retains supply burden; inherited handbag components/finish cannot be netted against unrelated current service supplies or create negative amounts/automatic credit."
    source_ids: []
  - rule_id: asset_lifecycle
    applies_to: "assets and providers"
    rule: "Full asset manufacture/maintenance/actual replacement/EOL is assigned with actual used_driver/complete lifetime_all_consumer_driver, compatible units and observed+sourced remaining life/termination. Keep uncertainty/sensitivity/update and all consumers/periods explicit. Use asset equivalent OR lifecycle-complete provider, never both; apply N once unless already per reference."
    source_ids: []
  - rule_id: fate_ownership
    applies_to: "all actual material fates"
    rule: "Whole handbags, individual component/pack and leather/lining/metal/moisture/finish audits are non-additive. Spent mixed carrier/absorbed liquid/collected fragment, free wastewater and actual direct species retain exclusive stream/receiver/treatment scope. Rejected/unfinished work remains burdened and outside N. No automatic salvage credit or duplicate receiver transport/treatment."
    source_ids: []
  - rule_id: commodity_link_scope
    applies_to: "nonexchange commodity interface"
    rule: "Keep actual original-gate stock and completed external integration at their recorded raw quantities. Declare source_assignment_scope_id, actual target_consignment_ids/target_cohort_id and source_assignment_quantity_basis: single_consignment_case, target_cohort_total or already_per_reference. For a raw target-cohort total, source_link_per_service_quantity=source_link_assigned_raw_quantity/same_target_scope_N ONLY when the positive N covers exactly that assigned target scope, with actual native units/state/source and acceptance-reversal evidence; use that interface once when combining with 1 accepted_service. A single-consignment case with N=1 and an already-per-reference quantity are not divided again. Do not divide actual external stock/stage-integration records by service N or use whole-source-cohort N for a narrower assigned target; preserve raw quantities and an explicit once-only link."
    source_ids: []
