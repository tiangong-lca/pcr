  calculation_rules:
    - id: service_normalization
      applies_to: "all service rows"
      rule: "Trace direct actual events OR actual quantity×compatible target_driver/positive complete all_consumer_driver, with native units/bases/sources. Retain idle/failed/rejected/unfinished/other-user/period burdens, then divide unique assigned cohort total by accepted N once, not already-normalized values again."
      inputs:
        - cp_consignment
        - cp_energy
        - cp_supplies
        - cp_assets
        - cp_providers
        - cp_freight
        - cp_fates
        - cp_releases
      output: "Actual per-reference physical service inventory"
      source_ids: []
    - id: bag_stock_state
      applies_to: "commodity audit"
      rule: "At compatible native stock state: opening+supplier_external_receipts+buyer_returns-closing-dispatch-supplier_returns-useful_other_exits-actual_discard-net_sample_removal=unknown_residual. Match actual bag-component/pack genealogy and independent material/moisture/finish measurements with units/bases/method/state/sampletime/source. Missing accessory does not establish whole-bag loss; residual is not release/waste or zero."
      inputs:
        - cp_handbags
      output: "Explicit complete stock/exits and unresolved state"
      source_ids: []
    - id: source_finished_demand
      applies_to: "commodity interface"
      rule: "Choose direct traced/measured assigned quantity with unit/state/source/evidence/exclusive exits OR Qsource_actual×Dtarget/Dall_exits, Dall_exits>0 equals sum of complete compatible competing accepted/useful-other/returns/closing-carry/proven-loss driver records, each quantity/unit/basis/source/link/owner. No accepted-only or direct+driver overlay. Actual original-gate conversion has method/factor/unit/basis/source; assigned/additional/baseline demands each preserve unit/state/source. Link required complete finished-stage/loss demand outside once after identical existing baseline coverage, never generic loss multipliers."
      inputs:
        - cp_handbags
        - cp_consignment
      output: "Separate complete original finished source-demand/loss interface"
      source_ids: []
    - id: unique_packed_freight
      applies_to: "freight"
      rule: "Measure packed payload OR same-state vehicle gross minus ONLY vehicle/noncargo tare. Retain cargo packaging/handbag components/moisture/finish; component audits are nonadditive. Unique EACH loads multiply evidenced count only, TOTAL never again. Convert native payload×distance through factor units/bases/sources to kg*km, apply compatible complete all-user share once, sum unique assigned load-leg results and /N once unless already normalized."
      inputs:
        - cp_freight
      output: "Actual per-reference physical freight"
      source_ids: []
    - id: actual_species
      applies_to: "direct_species; direct_species_co2_fossil_air; direct_species_methane_fossil_air; direct_species_nitrous_oxide_air"
      rule: "Use actual identified species/medium measurement OR compatible actual activity×factor with native units/bases/sources and complete factor coverage. Composition/fate/temperature-pressure or concentration conversions are method-dependent and apply once; material/plating/finish content and missing mass alone provide no emission quantity."
      inputs:
        - cp_releases
        - cp_energy
        - cp_handbags
      output: "Actual evidenced species per reference"
      source_ids: []
  data_quality_requirements:
    - id: actual_identity_support
      applies_to: "all rows"
      requirement: "Resolve real complete-bag/component/material/finish and every service/provider/receiver/source/species identity with compatible native measurement support before final exchanges; Count support is distinct from merchant-service identity."
      evidence: "Actual supplier/BOM/lot/commercial records, verified details and native support"
    - id: native_components
      applies_to: "commodity/cleanup components"
      requirement: "Require independent component quantity/unit/basis/method/state/sampletime/source and representative scope for leather/lining/hardware/moisture/finish or cleanup carrier/liquid/fragments; never substitute whole-bag mass, nominal composition or pack weight."
      evidence: "cp_handbags; cp_fates; cp_releases"
    - id: coverage_life_unknown
      applies_to: "all interfaces"
      requirement: "Disclose actual genealogy/completeness/state/source assignment and baseline coverage gaps, unknown stock/loss/fates, provider/receiver scope, full all-user asset remaining-life evidence/uncertainty and row-specific range evidence needs. Authored candidate is not final dataset readiness."
      evidence: "Actual source/coverage matrix, foreground records and lifetime proof"
    - id: electricity
      applies_to: "handbag_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Capture operated warehouse lighting, handling and business-support consumption in actual metered periods. No tanning, sewing, finish application, drying, repair or consumer use is included. Range evidence need: Need actual meter/readings and all-consumer/event allocation including idle, failed and unfinished work, with delivered/provider coverage; no electricity per bag from leather appearance or price. Measurement evidence: protocol cp_energy; original record basis Energy / kWh. The original amount constraint “Actual uniquely assigned physical amount / N under cp_energy” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_energy; actual source-linked native records"
    - id: facility_water
      applies_to: "handbag_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Only actual warehouse sanitation and support water is purchased here; leather or lining moisture, inherited finishes and original packaging are commodity state. No handbag cleaning or conditioning is presumed. Range evidence need: Need native volume, source/purpose/interval and supplier coverage, independently evidenced fates; a damp lining or water receipt is not wastewater quantity. Measurement evidence: protocol cp_supplies; original record basis Volume / m3. The original amount constraint “Actual uniquely assigned physical amount / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: facility_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: new_outer_protection
      applies_to: "handbag_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Record real added shipment cartons, protection, labels or straps by SKU/pack level. Original dust bags, tissue, boxes and protective covers, if supplied, belong to the actual finished merchandise gate. Reusable transport devices use lifetime service. Range evidence need: Need actual added-versus-inherited quantities, net mass or evidenced native-count/area conversion and stock provenance; no new complete retail packaging or pallet per bag/consignment default. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual uniquely assigned physical amount / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: new_outer_protection_paperboard_carton. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: operating_supplies
      applies_to: "handbag_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Expand actual equipment lubricants, cleaners, wipes, absorbents, filters and administrative supplies by measured native formulation/use. Factory leather finish, adhesives, lining and metal coatings are inherited merchandise, not current service chemical inputs. No bag polishing/cleaning/refinishing is introduced. Range evidence need: Need actual SKU/purpose, net receipts/opening/closing/returns, composition and cleanup carrier/absorbed contents/source; finish presence cannot quantify warehouse chemicals or emissions. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual uniquely assigned physical amount / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: operating_supplies_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: fuel_supply
      applies_to: "handbag_wholesale"
      requirement: "Which purchased fuel grade/formulation and supply gate are on the stock record? Identify any fuel other than the named diesel case and its native unit; obtain actual density before a volume-to-mass conversion. Separate native supply stock from measured combustion and nonburned waste/returns; examine whether hired handling/freight already includes fuel. Range evidence need: Need grade/native stock, disjoint burn/usable-return/waste/loss evidence and applicable density/temperature/unit/source conversions, not an assumption that purchased fuel all burns. Measurement evidence: protocol cp_supplies; original record basis Volume / L. The original amount constraint “Actual uniquely assigned physical amount / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: fuel_supply_diesel_supply. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_services
      applies_to: "handbag_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Use real handling, storage, visual/document completeness/condition checking, facility maintenance and business-support results in their actual native units. A manufacturer description or certificate does not establish a performed merchant assay, authentication or wear test. Range evidence need: Need actual performed result and materials/energy/assets/freight/receiver-treatment scope; representative condition measurement needs method and sample removal/return/fate, without hidden repair/cleaning or consumer-use testing. Measurement evidence: protocol cp_providers; original record basis Count / Item(s). The original amount constraint “Actual uniquely assigned physical amount / N under cp_providers” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_providers; actual source-linked native records"
    - id: shared_assets
      applies_to: "handbag_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Cover actual facility, racks, handling equipment, metering, ICT and reusable cases/pallets across all users and periods with full lifecycle phases. The sold handbag is never a warehouse asset. Range evidence need: Need manufacture, maintenance, real replacement/EOL, compatible used/lifetime drivers, observed history and sourced remaining/termination, with uncertainty/sensitivity/update; no universal years or new asset every trip. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “Actual uniquely assigned physical amount / N under cp_assets” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "handbag_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. Transported payload includes actual bags with included straps/lining/hardware, retained moisture/finish and original plus added cargo packs. Measured gross subtracts only vehicle/noncargo tare. Reconcile provider/delivered/empty-return scope. Range evidence need: Need unique load-leg IDs, EACH/TOTAL convention, measured cargo or same-state gross/tare, conversion units/bases/sources and all-user share; no nominal bag mass or leather-only cargo. Measurement evidence: protocol cp_freight; original record basis Mass*distance / kg*km. The original amount constraint “Actual uniquely assigned physical amount / N under cp_freight” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_freight; actual source-linked native records"
    - id: environmental_water
      applies_to: "handbag_wholesale"
      requirement: "Identify the actual abstraction point, water body/aquifer, location and measured source volume from intake permits/meter records. Surface water and groundwater require distinct source identities; no direct withdrawal is established by purchased water use. Include only real merchant-operated environmental withdrawal, distinct from purchased water and merchandise moisture exchanges. Range evidence need: Need actual source/location/meter interval/native unit conversion and extraction boundary; humid leather/lining does not measure water withdrawal. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual uniquely assigned physical amount / N under cp_fates” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: usable_supply_returns
      applies_to: "handbag_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Recognise actual same-scope standalone service-supply SKU/state export to a recipient. Consumed-only inputs OMIT the matched return exchange. Retained recovery/internal loops stay closing; handbag/strap/lining/pack returns remain commodity audit. Range evidence need: Need native transfer/recipient/input provenance and matching scope; inherited finish or accessory exports cannot reduce unrelated maintenance supply or create negative input/automatic credit. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “Actual uniquely assigned physical amount / N under cp_supplies” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: usable_supply_returns_detergent_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: discarded_handbags
      applies_to: "handbag_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Use real evidenced discarded complete bags, separately discarded straps/parts/fragments or mixed original packs at receiver state. Whole bag and leather/textile/hardware/moisture/finish component views are non-additive. A missing strap or damaged clasp alone does not establish whole-bag disposal or upstream loss. Range evidence need: Need actual disposition/BOM genealogy/native quantity/state/net-tare and receiver treatment scope with exclusive original-gate correspondence; surface scuff or unknown weight difference is not discarded leather/bag kg. Measurement evidence: protocol cp_handbags; original record basis Mass / kg. The original amount constraint “Actual uniquely assigned physical amount / N under cp_handbags” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: discarded_handbags_atomic_case; discarded_handbags_handbag_strap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_handbags; actual source-linked native records"
    - id: other_wastes
      applies_to: "handbag_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Include actual spent wipes/absorbents/filters/service-added packs and collected fragments; the receiver mixed stream includes actual carrier, absorbed liquid and captured material without duplicate component addition. No tanning sludge or sewing/cutting scrap is assumed. Range evidence need: Need measured received mass, carrier/liquid/fragment native units/bases/sources and actual composition/treatment owner; supplies purchases or inherited finish content do not quantify spent waste. Measurement evidence: protocol cp_fates; original record basis Mass / kg. The original amount constraint “Actual uniquely assigned physical amount / N under cp_fates” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: other_wastes_spent_wipe. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: contained_wastewater
      applies_to: "handbag_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Measure actual free liquid transferred to a receiver from performed facility work; keep separate from leather/lining moisture and liquid absorbed in cleanup solids. No handbag wash/tanning/finishing effluent is presumed. Range evidence need: Need actual received/collected volume, composition, event/source and transport/treatment coverage; purchased water, damp packs or wet wipes are not an effluent volume proxy. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual uniquely assigned physical amount / N under cp_fates” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: contained_wastewater_aqueous_cleaning. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: water_outfalls
      applies_to: "handbag_wholesale"
      requirement: "Identify the direct outfall and receiving water/soil compartment, measured water amount and independently analysed pollutant species. A sewer transfer to treatment is not this outfall; the missing receiving compartment prevents a concrete elementary-flow selection. Record only actual direct crossing to an identified environmental receiving medium; contained receiver transfer is Waste. Merchandise moisture changes do not establish an outfall. Range evidence need: Need actual location/medium, native volume/interval and composition/fate sources with conversions; a stain or cleanup event is insufficient discharge evidence. Measurement evidence: protocol cp_fates; original record basis Volume / m3. The original amount constraint “Actual uniquely assigned physical amount / N under cp_fates” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_fates; actual source-linked native records"
    - id: direct_species
      applies_to: "handbag_wholesale"
      requirement: "Identify each measured release at its source/event, chemical or particle-size identity, origin and receiving compartment using the emission/sampling record. Unknown species, unresolved particle fraction or unknown medium must remain a specific evidence gap; neither total chemical use nor stock loss supplies that identity. Expand only actual substance/species/particle-size and receiving medium supported by real combustion, maintenance or incident measurement/method. Leather chemistry, finish/gloss, metal plating, smell, ageing or missing mass does not quantify chromium, VOC, dust or CO2. Range evidence need: Need identified species/medium measurement or compatible actual activity/factor, native units and factor coverage, composition/fate/temperature/pressure basis/source as needed once; no generic leather/finish emission factor. Measurement evidence: protocol cp_releases; original record basis Mass / kg. The original amount constraint “Actual uniquely assigned physical amount / N under cp_releases” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: direct_species_co2_fossil_air; direct_species_methane_fossil_air; direct_species_nitrous_oxide_air. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_releases; actual source-linked native records"
validation_rules:
  - rule_id: accepted_commercial_count
    applies_to: "accepted_service"
    rule: "Check actual owned/resold unique final B2B accepted consignment N>0, reversals and all sixteen qualifiers. Bags, straps, kg, brand prices and certificates do not substitute for counted physical service."
    source_ids: []
  - rule_id: complete_native_bag
    applies_to: "merchandise"
    rule: "Verify actual model/lot/BOM, included-versus-separate accessories, lining/hardware/closure/leather/finish/original-pack contents, native net/gross/tare/moisture/component unit/basis/method/state/sampletime/source. No universal strap count, brand specification, care or lifetime assumption."
    source_ids:
      - coach-finished-handbag
  - rule_id: actual_route_exits
    applies_to: "handbag_wholesale"
    rule: "Index real receipt/condition/completeness/check/cleanup/changeover/idle/failed/rejected/unfinished/dispatch/acceptance events to lot/period. Missing/damaged/stained bags/accessories require actual mutually exclusive quarantine/return/useful-other/discard/sample paths, not presumed repair/cleaning/dismantling/repack/wear-test."
    source_ids: []
  - rule_id: source_all_exit
    applies_to: "commodity interface"
    rule: "Verify complete finished handbag supplier stages, native source evidence and direct actual assignment OR positive complete competing all-exit driver records quantity/unit/basis/source/link/owner including closing/returns/useful-other/proven loss. No accepted-only, direct+driver overlap, unknown-loss zero or accessory=whole-bag loss; original conversions and identical baseline stage/loss coverage link required additional demand outside once."
    source_ids: []
  - rule_id: asset_all_users
    applies_to: "all physical resources"
    rule: "Check all consumers/periods, actual compatible drivers and full asset manufacture/maintenance/replacement/EOL with observed+sourced remaining/termination and uncertainty/sensitivity/update. Failed/no-acceptance resources remain attributed; asset/provider/per-N representations never overlap."
    source_ids: []
  - rule_id: stock_fate_freight_views
    applies_to: "all physical fates"
    rule: "Verify supply S and matched provenance, gross+unused-return OR consumed-only OMIT matching return, no unrelated negative netting/automatic credit. Whole/component/mixed cleanup/free-liquid/direct-species views nonadditive and receiver transport/treatment once. Freight retains cargo packs/components/moisture/finish, subtracts only vehicle/noncargo tare, unique EACH/TOTAL and native conversion/share/N once."
    source_ids: []
  - rule_id: validate_concrete_identity_decisions
    applies_to: "all inventory rows"
    rule: "Resolve each actual identity evidence decision to a physically specific card and native quantity or evidenced non-applicability. Evidence-checkpoint IDs are not exchanges. Missing occurrence, species, state, receiver or provider configuration blocks final data completion; no assumed zero. Whole streams and components, gross inputs and matched returns must remain mutually exclusive where required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual identity/completeness review"
  downstream_use: "Finished leather-handbag merchant physical service add-on, separately linked to complete original finished commodity source demand/loss coverage"
  allowed_use: "Actual complete factory-finished leather handbags with actual BOM/included accessories and original pack through ambient own-account B2B accepted handover"
  excluded_use: "Standalone handbag footprint, raw hides/tanned leather or incomplete/accessory-only goods, other bag materials; tanning/cutting/sewing/coating/repair/cleaning/repack/use; retail/agency/storage-only"
  required_metadata: "Actual model/SKU/lot/bag-component BOM/included-versus-separate straps/hardware/lining/leather/finish/original pack, native counts/net-tare/moisture/component method/state/sampletime/source, buyer criteria/acceptance/time/site/period, complete original-gate assignment/conversion/baseline coverage and all service/asset/provider/freight/receiver owners"
  required_quality_disclosure: "Identity/support/BOM/completeness/measurement/state/sampling uncertainty, unknown stock/loss/fates, original finished-gate assignment and baseline scope gaps, all-user full asset lifetime assumptions and row-specific evidence limitations"
  update_trigger: "Changed bag material/BOM/included accessories/finish/pack/state/measurement/acceptance, actual repair/cleaning/assembly/repack/use route, source gate/assignment/coverage, provider/asset/freight/treatment or conversion method"
data_sources:
  - id: "unsd-cpc3-handbag-wholesale"
    type: "official_guidance"
    reference: "UNSD CPC3 explanatory notes (30 June2025),29220 handbags and61056 leather-goods wholesale including2831/291/292. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification support only; declared finished leather-handbag wholesale is narrower than all61056 leather/furskin/travel goods."
  - id: "coach-finished-handbag"
    type: "official_guidance"
    reference: "Coach Tabby Shoulder Bag26 CH857, actual public manufacturer Product Details. https://www.coach.com/products/tabby-shoulder-bag-26/CH857-B4/HA.html?COHNA=true"
    used_for: "Qualitative actual finished leather/lining/hardware/closure/detachable-strap configuration and completeness questions only; no universal brand/model, dimensions, price, strap number, leather species, alloy, finish chemistry, pack/net mass, wear/lifetime/care or authentication defaults."
