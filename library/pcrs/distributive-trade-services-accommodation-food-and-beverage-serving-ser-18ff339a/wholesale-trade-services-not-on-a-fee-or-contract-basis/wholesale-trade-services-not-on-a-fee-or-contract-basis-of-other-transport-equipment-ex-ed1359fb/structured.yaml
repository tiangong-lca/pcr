  calculation_rules:
    - id: completed_count
      applies_to: "cp_carts"
      rule: "N=count_unique_final_owned_resold_B2B_acceptances_after_reversals. Check real merchant ownership/resale, business buyer and gate/source/reversal IDs. N>0 before normalization; unfinished/canceled/rejected/reversed resource attribution persists in actual cohorts/periods."
      inputs:
        - Ownership
        - "actual buyer gate and acceptance/reversal/time records"
      output: "Final unique service denominator N"
      source_ids: []
    - id: cart_pack_components
      applies_to: "cp_carts"
      rule: "Use measured compatible net_cart_mass and actual original_pack_tare/cargo state. Published supplier_ship_weight only when its actual model/assembly/BOM/pack/method coverage matches; never assume it equals net or each steel/wood/rubber component. Whole cart/frame/deck/caster/finish/contents are nonadditive membership views. Expected supplier-detached parts are not automatically missing, and capacity is not actual payload."
      inputs:
        - "Actual BOM/presentation"
        - "each-total net/pack/component/source records"
      output: "Actual received-state cart and pack/component audit"
      source_ids: []
    - id: component_water_fluid
      applies_to: "cp_carts; cp_outlets"
      rule: "Only evidenced component-specific water measurement supports component_dry_mass=component_wet_mass*(1-water_wet_fraction), with actual water/as-received wet mass fraction. Compatible same-sample dry-basis water/nonwater ratio converts water_wet_fraction=water_dry_ratio/(1+water_dry_ratio), after native percent-to-ratio conversion. Do not dry-correct entire steel/wood/rubber/coated cart from one wood sample; LOD other volatiles not automatically water. Retained fluid/coating has own identity/units/source and no default release."
      inputs:
        - "Component identity/membership and native water/fluid method/sample/state/units/source"
      output: "Qualified component views with no whole-cart or emissions inference"
      source_ids: []
    - id: source_gate_demand
      applies_to: "cp_carts"
      rule: "Direct actual source-to-target trace OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers with positive complete compatible all-terminal records. commodity_source_gate_demand=assigned_source_gate_quantity in actual original finished/shipping/BOM/pack state, including evidenced state-change share. Reconcile source input and exclusive closing/useful-other/return/actual-loss exits, baseline_quantity/additional_stage_quantity/loss_adjustment_quantity with native conversion and stage/loss/owner coverage once outside service. Unknown loss/stages block complete-chain readiness, not zero.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
      inputs:
        - "Original source"
        - "direct OR complete all-terminal native records and baseline/additional/loss coverage"
      output: "Linked actual original finished commodity demand outside once"
      source_ids: []
    - id: utility_share
      applies_to: "cp_utilities"
      rule: "utility_per_service=sum(actual_utility_quantity*documented_share)/N after native conversion and matching all-consumer causal drivers. Use actual meter period, exclude provider/carrier scope; no traded-cart operating power or wash/load-test factor."
      inputs:
        - "Actual native interval/quantity/conversion and native documented share"
      output: "Actual kWh and conditional site-water m3 per service"
      source_ids: []
    - id: supply_stock
      applies_to: "cp_supplies"
      rule: "S=opening+net_receipts-closing including retained recovery. Use gross S/N with separate paired usable outward output OR consumed (S-usable_outward_return)/N and OMIT matching return exchange. EACH times actual compatible count once/TOTAL unchanged; mass conversion uses actual per-piece or compatible density-temperature evidence. No inherited part/fluid netting."
      inputs:
        - "Standalone supply stocks/returns"
        - "native quantity/composition/conversion/share"
      output: "Exclusive actual gross or consumed supply with matched return convention"
      source_ids: []
    - id: provider_equivalent
      applies_to: "cp_provider"
      rule: "provider_per_service=sum(actual_native_package_quantity*documented_share)/N using evidenced physical_equivalence and disjoint coverage. documented_share=share_numerator/share_denominator on matching native causal units, never fee or rated capacity."
      inputs:
        - "Actual physical package/native equivalent and coverage/share evidence"
      output: "Actual disjoint contracted service amount"
      source_ids: []
    - id: asset_life_share
      applies_to: "cp_assets"
      rule: "lifetime_all_user_driver=observed_all_user_driver+remaining_driver only with compatible native units/equivalence and sourced remainder. Apply job_driver/lifetime_all_user_driver to full manufacture/maintenance/replacement/retirement/EOL; sum service assets then /N once. All consumers/periods, uncertainty/sensitivity/update and provider/carrier exclusion are mandatory; sold carts not service assets."
      inputs:
        - "Full-life event/job/observed/remainder/lifetime/equivalence native records"
      output: "Actual all-user full-life asset equivalents"
      source_ids: []
    - id: unique_freight_sum
      applies_to: "cp_freight"
      rule: "Actual cargo includes shipped cart even empty, supplied parts/accessories/pack/carried support. EACH mass*actual_count once OR TOTAL unchanged; subtract only true noncargo carrier vehicle/container tare. Convert native payload/distance to actual_transport_work and use freight_per_service=sum_unique_load_leg(actual_transport_work*documented_service_share)/N. Every record share inside SUM and N once, with actual empty-leg/provider/receiver coverage. Published capacity/shipweight do not replace measured compatible cargo."
      inputs:
        - "Unique load-leg"
        - "native EACH/TOTAL cargo/count/tare/distance/conversion and share"
      output: "Actual scoped freight t*km per service"
      source_ids: []
    - id: receiver_outlets
      applies_to: "cp_outlets"
      rule: "outlet_per_service=actual_compatible_native_transfer_quantity/N, after EACH actual count once/TOTAL unchanged and supported conversion. Whole cart/independent part/pack/mixed cleanup/liquid and explanatory coating/moisture/fluid components are exclusive/nonadditive. Retained stock not export; consumed-only supplies omit paired return. Actual receiver classification/transport/treatment owner once; no automatic credit or inferred dismantling."
      inputs:
        - "Native measured stream/component/fate/receiver/parent membership and conversions"
      output: "Actual exclusive transfer quantities and treatment coverage"
      source_ids: []
    - id: actual_species
      applies_to: "cp_environment"
      rule: "release_mass=measured_species_mass OR compatible activity*applicable_species_factor with composition/release_fraction only where required by that factor. Complete species factor already covering a proportion must not multiply it again. Native units and actual medium/capture/contained exclusions then /N once; no rolling-wear/coating/wood/rust/material-presence or stock-gap default."
      inputs:
        - "Actual species/particle/medium"
        - "native measurement or applicable factor chain"
      output: "Actual independently evidenced species release"
      source_ids: []
  data_quality_requirements:
    - id: actual_configuration
      applies_to: "cp_carts"
      requirement: "Actual model/BOM/shipping state/pack and native net/ship/component source must be representative; no published numeric model value as universal default."
      evidence: "Actual release/BOM/measurement/calibration"
    - id: full_chain
      applies_to: "all"
      requirement: "Native complete original source assignment/loss/stage coverage and all-consumer full asset/service periods require actual records; missing information blocks complete-chain readiness."
      evidence: "Exclusive source/owner/period and uncertainty review"
    - id: source_limits
      applies_to: "durham-platform-truck"
      requirement: "Manufacturer model body supports qualitative steel/wood/caster/finish/shipping questions, not general capacity/size/weight/life or assembly/use/test obligation."
      evidence: "Actual primary body plus real lot evidence"
    - id: electricity
      applies_to: "platform_handtruck_wholesale"
      requirement: "Which supply point, AC/DC state, voltage and supplier dataset cover the meter record? Reconcile the listed AC row with any evidenced other supply; do not use the AC UUID for a different carrier. Actual site utility attributable to receipt, hold and dispatch; manual product has no assumed power demand and no assembly/test/use occurs. Range evidence need: Need actual meter interval kWh, all-consumer physical drivers, idle/open-cohort coverage and delivered utility support; no per-cart power benchmark. Measurement evidence: protocol cp_utilities; original record basis Energy / kWh. The original amount constraint “sum(actual_utility_quantity*documented_share)/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: electricity_ac. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: site_water
      applies_to: "platform_handtruck_wholesale"
      requirement: "Does the supplier record establish treated tap water, or a different named water quality/source? Identify the supply state and gate; do not replace a non-tap-water supply with the tap-water card. Conditional actual warehouse surface-hygiene supply, not traded-cart wash or use-phase cleaning. Range evidence need: Need native meter/supplier volume, actual hygiene event, conversion and sharing records; no washwater allowance from deck area. Measurement evidence: protocol cp_utilities; original record basis Volume / m3. The original amount constraint “actual compatible water volume*documented_share/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: site_water_liquid_tap. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_utilities; actual source-linked native records"
    - id: hygiene_materials
      applies_to: "platform_handtruck_wholesale"
      requirement: "Obtain the purchased SKU, formulation/SDS, supplied concentration, physical state, purpose and stock/issue records for the named cleaning or maintenance duty in this record. Identify the actual non-detergent material individually; do not prescribe a chemical, filter substrate or dose from this PCR. Actual agent/wipe/absorbent/filter identities only if used; inherited deck, caster rubber, coating and lubricant are commodity constituents. Range evidence need: Need actual material formulation, native amount/count/per-piece mass or density, stock and same-scope usable unused return evidence; no solvent or lubricant recipe. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “selected actual gross or consumed supply mass/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: hygiene_materials_synthetic_detergent. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
