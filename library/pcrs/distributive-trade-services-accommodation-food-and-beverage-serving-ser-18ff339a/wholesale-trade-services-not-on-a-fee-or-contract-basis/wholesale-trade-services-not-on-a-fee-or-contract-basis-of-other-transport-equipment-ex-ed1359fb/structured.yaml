allocation_rules:
  - rule_id: physical_events
    applies_to: "foreground_burden_allocation"
    rule: "Direct trace actual events to cohorts/consignments; otherwise use evidenced causal handling or space-time/native drivers over all consumers and periods, including idle/open/reject work. No automatic equal-cart, capacity, steel mass or sales-price share."
    source_ids: []
  - rule_id: original_source_assignment
    applies_to: "foreground_burden_allocation"
    rule: "Outside service use real direct source-to-target quantity OR assigned_source_gate_quantity=cohort_source_quantity*target_exit_driver/sum_exit_drivers only with complete positive compatible records for every terminal driver including closing, useful other exits, returns and actual loss, each native quantity/unit/basis/method/state/source/link/owner. commodity_source_gate_demand=assigned_source_gate_quantity at original finished/shipping-state gate including evidenced state-change share. Final dispatch+discard is not original demand; record actual baseline/additional/loss native quantities, conversion, stage/loss coverage and exclusive owner once.  Record assignment_scope_ids, quantity_basis (raw_target_cohort or per_reference), same_target_scope_N and source for each linked original-gate demand or loss quantity. Actual external stock/stage/loss integration uses its raw physical amount once. ONLY for combination with 1 Item(s) service, derive q_per_reference=q_raw_of_that_same_scope/positive same_target_scope_N; already per-reference quantities are not divided again, single-case raw scope has N=1, N=0 has no normalized value."
    source_ids: []
  - rule_id: supply_return_choice
    applies_to: "foreground_burden_allocation"
    rule: "S=opening+net_receipts-closing including retained recovery. Gross input S/N plus separately recorded actual paired usable unused outward output OR consumed-only (S-usable_outward_return)/N and OMIT matching return exchange. Only same-scope standalone supply can be netted; never inherited cart/component/fluid or unrelated stock and no second credit."
    source_ids: []
  - rule_id: full_life_assets
    applies_to: "foreground_burden_allocation"
    rule: "Allocate complete manufacture/maintenance/replacement/retirement/EOL with compatible job_driver/lifetime_all_user_driver, lifetime=observed all-user use+sourced remaining service across all consumers/periods. Keep native equivalence, uncertainty/sensitivity/update and provider/carrier exclusions; service total divided by N once. Traded carts not asset equivalents."
    source_ids: []
  - rule_id: freight_outlets
    applies_to: "foreground_burden_allocation"
    rule: "Each unique load+leg own documented_service_share remains INSIDE SUM, then /N once. EACH actual compatible count once/TOTAL unchanged; actual empty traded cart remains cargo with pack/support, only noncargo carrier tare subtracted. Exclusive whole/part/pack/cleanup/liquid/component views and actual receiver transport/treatment once; no automatic credits."
    source_ids: []
