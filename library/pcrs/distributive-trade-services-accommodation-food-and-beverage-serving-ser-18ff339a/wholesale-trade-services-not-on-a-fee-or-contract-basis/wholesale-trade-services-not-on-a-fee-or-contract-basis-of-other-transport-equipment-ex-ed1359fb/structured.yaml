    - id: whole_cart_waste
      applies_to: "platform_handtruck_wholesale"
      requirement: "Obtain the independent transfer ticket for the actual outlet described in this record, including parent item/SKU, physical state, retained composition, receiver and treatment scope. Match it to one listed physical case; an unmatched part, fluid or contaminated mixture needs its own named identity, not this record ID as a waste flow. Only real discarded whole cart in declared received state, including retained frame/deck/casters/finish/fluid/pack where present. Component explanations are not extra full-stream waste; embodied commodity loss outside service once, physical treatment once. Range evidence need: Need actual discard decision/parent IDs/received configuration, whole transfer net/tare and retained portions/receiver fate; rust or loose caster does not prove whole-cart discard. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual whole-cart receiver net mass/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: whole_cart_waste_atomic_case. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
