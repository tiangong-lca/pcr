      applies_to: "platform_handtruck_wholesale"
      requirement: "Match the external return ticket to exactly one input SKU, state and native unit, and identify the receiver. Under consumed-only input accounting omit its matched return exchange; merchandise returns and closing inventory are separate audit records. Gross-input convention only, actual usable material exported from matched standalone supply stock. Consumed-only input omits this exchange; sold-cart or inherited component returns are merchandise ledger events. Range evidence need: Need original supply identity/native mass, same-scope pairing, actual receiver/usability and not closing stock; no inherited coating/fluid against unrelated supply. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual matched usable unused outward mass/N under gross convention only” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. Defined flow cards: unused_supply_return_detergent_return. Other actual states require the specific evidence decision above before any identity is assigned. This evidence record is not an exchange and cannot produce a category-total quantity."
