      requirement: "Obtain the independent handover record, actual material/composite state, quality acceptance and recipient for the specifically described recovered outlet in this record. Determine Product-versus-Waste from that real handover; do not presume a recovered-product identity or substitution credit. Conditional evidenced useful material exported, not assumed recycling of every damaged cart. Actual classification, remaining contents and recipient proof; no automatic avoided production credit. Range evidence need: Need actual material identity/state, mass/component moisture/fluid, transfer/receiver and exclusion from waste/closing/whole-cart views; collection is not proof of recovery. Measurement evidence: protocol cp_outlets; original record basis Mass / kg. The original amount constraint “actual independently usable exported mass/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
