    - id: added_outer_protection
      applies_to: "platform_handtruck_wholesale"
      requirement: "Obtain the package bill/specification, material or laminate identity and actual added-versus-inherited ownership. Determine each missing sleeve, seal, label, strap or support identity from that record; an integral composite is not several additive material exchanges. Conditional extra external protection without assumed opening/repack/assembly. Inherited manufacturer pack remains commodity; reusable merchant support is full-life asset. Range evidence need: Need actual protection material, supplied quantity, EACH/TOTAL mass and stock/return ownership; no crate or wrap count from cart size by default. Measurement evidence: protocol cp_supplies; original record basis Mass / kg. The original amount constraint “selected actual gross or consumed added material mass/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_supplies; actual source-linked native records"
    - id: provider_package
      applies_to: "platform_handtruck_wholesale"
      requirement: "Obtain the provider contract/completed-result record for each named duty in this record, with native billed physical unit and included resources. Identify the individual service result; inspection, cleaning and handling are different services, and price/hours cannot be relabelled as Item(s). Actual physical handling/site operation package and explicit scope, no hidden assembly/load test/repair or purchased cart asset. Range evidence need: Need actual provider physical equivalent, scope, interval and same-basis share/resource exclusions; neither fee nor rated capacity defines package quantity. Measurement evidence: protocol cp_provider; original record basis Count / Item(s). The original amount constraint “sum(actual_native_package_quantity*documented_share)/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_provider; actual source-linked native records"
    - id: service_assets
      applies_to: "platform_handtruck_wholesale"
      requirement: "For each explicitly named asset in this record, obtain the asset register identifier, configuration and matching complete-lifecycle dataset. The missing decision is the individual asset/service identity and lifetime all-user denominator; a warehouse, forklift and pallet cannot share one Count exchange or inherit a default life. Full-life infrastructure/handler/support equivalents across all users and periods. The carts being sold are not current warehouse assets or new supports consumed per consignment. Range evidence need: Need real asset boundary/manufacture/maintenance/replacement/EOL, observed all-user and sourced remainder native drivers/equivalence and sensitivity; no lifetime or per-use asset factor. Measurement evidence: protocol cp_assets; original record basis Count / Item(s). The original amount constraint “sum_full_asset_equivalents(job_driver/lifetime_all_user_driver)/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
      evidence: "cp_assets; actual source-linked native records"
    - id: freight
      applies_to: "platform_handtruck_wholesale"
      requirement: "For each actual inbound, outbound, return and waste leg, obtain mode/vehicle, temperature service, origin/destination, actual load and distance plus provider coverage. The missing mode/configuration prevents selection of one freight identity; never collapse unlike modes into one kg*km flow. The actual cart remains cargo even empty, including supplied detached parts, pack and carried support; subtract only true noncargo carrier tare. Actual capacity is not actual load. Range evidence need: Need actual packed load mass versus published shipweight, EACH/TOTAL count, assembly/pack state, distance/conversion, record-specific share and empty/receiver coverage; no zero payload because vehicle. Measurement evidence: protocol cp_freight; original record basis Mass * Length / t*km. The original amount constraint “sum_unique_load_leg(actual_transport_work*documented_service_share)/N” applies separately only to identity/unit-compatible individual rows; it creates no category-total exchange and does not assign the original unit to a different material or service. Do not normalize an already-per-reference quantity again. This evidence record is not an exchange and cannot produce a category-total quantity."
