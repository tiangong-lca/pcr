allocation_rules:
  - rule_id: retain_rework
    applies_to: "place_inspect"
    rule: "Keep every repeated lift, cut, replacement and inspection in the originating work order. Unaccepted equipment does not increase D. If D is zero, retain a failed-job inventory without division; connect its burden to an evidenced subsequent service or report it separately."
    source_ids: []
  - rule_id: materials_and_returns
    applies_to: "neoprene_pads; actual exchanges required by refine_packaging; usable_returns_pad_module; usable_returns_usable_offcut; installation_waste_neoprene"
    rule: "Track stock and exits by material and ownership. Net procurement may exclude genuinely returned unused supplies only with consistent upstream inventory adjustment; never subtract the same return from input mass and again as avoided production. No displacement credit is supplied here. A genuine sold co-product requires a separately reviewed allocation decision."
    source_ids: []
  - rule_id: shared_life
    applies_to: "owned_resources_jack; owned_resources_sling; owned_resources_hand_cutter; owned_resources_gauge"
    rule: "For each actual resource packet, enumerate all consuming nodes, jobs and periods, maintenance/replacement/retirement events and measured causal use. Assign s_j = u_j / sum(u_all); shares over all beneficiaries sum to 1. Do not assign the full purchase to every period or use job-only hours as the whole-life denominator. Missing lifetime activity remains a disclosed blocker, not an assumed default."
    source_ids: []
  - rule_id: service_ownership
    applies_to: "contracted_services; local_support_hourly_service_handling; local_support_hourly_service_access; installation_electricity"
    rule: "Separate provider-owned resources from owned-resource packets; a packaged service and its embedded energy/assets are mutually exclusive representations of the same burden. Physical custody of reusable packaging does not scale with its upstream burden share."
    source_ids: []
