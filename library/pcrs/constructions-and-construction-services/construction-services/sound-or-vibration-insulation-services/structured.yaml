product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.sound-or-vibration-insulation-services"
  classification_refs: "cpc:3.0:54651 — Sound or vibration insulation services; narrower"
  covered_products: "First dry placement of single-layer modular neoprene pads under a declared indoor machine; local lifting, loaded inspection, correction and signed isolation-only handover"
  excluded_products: "Complete machinery installation; foundations; restraints; bonded, shimmed or multilayer systems; spring isolators; acoustic wall finishes; replacements; machinery operation"
  representative_product: "Accepted single-machine dry-laid neoprene isolation installation"
  production_route: "Approve actual support/load schedule → receive pads and equipment interface → hand-cut complete modules → local lift and dry place → lower, inspect and correct → signed handover"
  market_state: "Completed isolation installation service on customer equipment, before equipment commissioning"
functional_unit:
  what: "Accepted single-machine dry-laid neoprene isolation installation"
  how_much: "1 Item(s) complete accepted installation for one declared equipment configuration"
  how_well: "Actual supplier-approved pad grade, module arrangement and per-support loads; complete bearing contact, stable level placement and no unintended rigid bridge; signed installation inspection"
  how_long_or_cycle: "One installation work order including correction and final acceptance; asset burdens may span reporting periods; no machine operating life assigned"
  reference_flow_link: "accepted_isolation"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers a separately contracted first installation of single-layer, unbonded, modular neoprene vibration-isolation pads beneath one indoor machine on an existing accepted support surface. The actual equipment and pad supplier must permit an unanchored dry-laid arrangement at the declared location. Equipment arrives at the installation position, stopped and isolated, with lifting points and loading information available. The installer surveys supports, confirms the approved pad schedule, hand-cuts complete modules where needed, lifts locally, places pads, lowers the equipment, inspects the loaded arrangement, corrects defects and hands over the accepted isolation installation. Exclude equipment manufacture or general equipment installation, long-distance positioning, floor or foundation construction, anchoring and seismic restraint, adhesives or grout, stacked pads or added shims, spring mounts, wall/ceiling acoustic finishes, old-pad removal, powered cutting, chemical cleaning, operating-performance tests and subsequent operation. If any excluded activity is necessary, this category alone is insufficient; do not omit it from a larger system. This gate establishes installation conformity, not a numerical vibration reduction or an operating-machine commissioning result. Mason SW illustrates modular neoprene supply and some unbolted applications, not a universal no-anchor design (mason-super-w-2014)."
      source_ids:
        - mason-super-w-2014
    - rule_id: installation_gate
      applies_to: "place_inspect"
      rule: "The two physical component roles are customer equipment interface and supplied isolation pads. Existing floor is a declared substrate interface. Only local lifting for pad placement belongs here; accept all supports as one installation after loaded inspection."
      source_ids: []
    - rule_id: route_eligibility
      applies_to: "neoprene_pads; accepted_isolation"
      rule: "Use single-layer neoprene complete modules and actual approved layout. Manufacturer information supports this product family and selected unbolted applications, not all locations; anchoring or stacking requirements move the work outside this scope."
      source_ids:
        - mason-super-w-2014
    - rule_id: design_inputs
      applies_to: "accepted_isolation"
      rule: "Retain actual per-support loads, number and arrangement of pads and disturbing-frequency/design evidence. Do not assume even load sharing merely by dividing total weight by pad count. Actual product design approval controls execution."
      source_ids:
        - karman-isolator-selection
    - rule_id: event_ownership
      applies_to: "all cards"
      rule: "Record receipt, local lifting, cutting, correction, inspection, cleanup and exits for the entire work order. Include measured battery charging and external support when present. Check chemical use or powered work as scope changes, not zero-valued emissions."
      source_ids: []
    - rule_id: time_boundary
      applies_to: "owned_resources_jack; owned_resources_sling; owned_resources_hand_cutter; owned_resources_gauge; contracted_services; local_support_hourly_service_handling; local_support_hourly_service_access"
      rule: "Index acquisition, maintenance, replacement and retirement of reusable equipment separately from work-order activity and acceptance dates; keep charges and transfers attributable to the actual reporting period."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Customer equipment stopped and isolated at the prepared position; accepted existing support surface, approved loading and pad schedule, authorized lifting arrangement and verified permission for unanchored dry placement"
  starting_condition_role: "Customer equipment and existing substrate are physical interfaces; supplied pads enter as new consumables"
  product_classification_scope: "Isolation installation only, a narrow part of CPC 54651; excludes machinery installation and acoustic finishing services"
  recursive_input_rule: "A purchased isolation subcontract is either a documented external service package or disaggregated foreground work, never both; do not recursively add another complete copy of the same isolation service"
  upstream_dataset_requirement: "Supply-chain data for actually consumed pads, packaging, electricity, owned-resource shares and external services at matching gates; no second manufacture of customer equipment or existing building"
  disclosure: "Declare which party owns equipment, lifting tools, transport, packaging, rejects and external treatment. Link to a wider project when excluded work is necessary; no claim of a whole machine or building life cycle"
