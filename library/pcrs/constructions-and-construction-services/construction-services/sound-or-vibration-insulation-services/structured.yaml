      frequency: "each receipt, correction and acceptance"
      temporal_coverage: "complete work order through signed handover"
      site_scope: "actual site and configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "D positive and independently counted; originals and inspector identity; raw receipt count divided by D; no unaccepted job in D"
    - protocol_id: cp_materials
      process_id: "place_inspect"
      flow_role: "neoprene_pads; actual exchanges required by refine_packaging"
      record_type: "stock and mass record"
      raw_fields: "SKU; grade; dimensions; opening_stock; receipts; closing_stock; drawn_mass; packaging_material; scale_id; tare; return_ticket; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Reconcile work-order draw from stock with weighed receipts and unused holdings; determine net pad mass separately from packaging and supported machine weight. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "each receipt, draw and stock closure"
      temporal_coverage: "entire work order including corrections"
      site_scope: "actual site store and installation node"
      aggregation_rule: "per reference flow"
      quality_evidence: "Material-specific stock balance and scale checks; gross draw includes downstream returns and waste; each drawn_mass divided by D"
    - protocol_id: cp_resources
      process_id: "place_inspect"
      flow_role: "owned_resources_jack; owned_resources_sling; owned_resources_hand_cutter; owned_resources_gauge; contracted_services; local_support_hourly_service_handling; local_support_hourly_service_access"
      record_type: "resource and supplier record"
      raw_fields: "asset_id; owner; whole_life_packet; acquisition; maintenance; replacement; retirement; all_consumers; period; u_j; u_all; provider; service_scope; actual_unit; activity; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Reconcile actual equipment-use logs and contracts; select packet versus disaggregated service representation; verify full-life denominator and period allocation. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "Item(s) per defined packet; original service unit retained; Item(s); h"
      frequency: "each asset or service event"
      temporal_coverage: "work order and documented whole resource life"
      site_scope: "all shared consuming sites/jobs and target node"
      aggregation_rule: "per reference flow"
      quality_evidence: "Whole-life packet evidence, shares sum to 1; count packet shares or actual service quantities and divide by D; retain unknown retirement/lifetime evidence as unresolved"
    - protocol_id: cp_energy
      process_id: "place_inspect"
      flow_role: "installation_electricity"
      record_type: "meter or charging record"
      raw_fields: "meter_id; start; end; session; owner; charging_losses; attribution_basis; allocated_kWh"
      collection_method: "Read actual installation-only meters or allocate shared charging using measured session use; exclude separately inventoried provider energy."
      unit: "kWh"
      frequency: "each use or charging session"
      temporal_coverage: "sessions causally assigned to work order"
      site_scope: "site supply or evidenced offsite charging"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated readings and session ownership; sum allocated_kWh including losses then divide by D; absent use needs explicit records, not assumed zero"
    - protocol_id: cp_exits
      process_id: "place_inspect"
      flow_role: "usable_returns_pad_module; usable_returns_usable_offcut; installation_waste_neoprene"
      record_type: "custody and receiving record"
      raw_fields: "material; condition; quantity; tare; ticket; owner; destination; receiver; treatment_scope; correction_id; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Weigh and reconcile separate reusable returns and waste at release, link to actual recipient and originating work-order material. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "each exit"
      temporal_coverage: "work order and linked later exit"
      site_scope: "node release and declared receiver gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed tickets and material balance; sum each classified exit mass and divide by D; do not recategorize waste as product for a UUID match"
  calculation_rules:
    - id: normalization
      applies_to: "all non-reference cards"
      rule: "For actual work-order quantity Q_i, q_i = Q_i / D; D > 0. Keep separate quantities for each material, asset packet and real service unit."
      inputs:
        - Q_i
        - D
        - cp_gate
        - cp_materials
        - cp_resources
        - cp_energy
        - cp_exits
      output: "quantity per reference flow"
      source_ids: []
    - id: stock_closure
      applies_to: "neoprene_pads; actual exchanges required by refine_packaging"
      rule: "For each material, opening stock + receipts = closing unused stock + retained installation material + usable returns + waste + documented discrepancy. Correct attribution and weighing differences; do not force discrepancies into emissions."
      inputs:
        - cp_materials
        - cp_exits
        - "installation records"
      output: "reconciled material inventory"
      source_ids: []
    - id: resource_share
      applies_to: "owned_resources_jack; owned_resources_sling; owned_resources_hand_cutter; owned_resources_gauge"
      rule: "For each declared whole-life packet, s_j = u_j / sum(u_all); q_resource = s_j / D. Require positive complete denominator, period ownership and no overlapping maintenance or retirement packet."
      inputs:
        - cp_resources
        - cp_gate
      output: "resource packet share per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: configuration
      applies_to: "accepted_isolation"
      requirement: "Keep grade, load distribution, module geometry and design-approved eligibility; separate different designs rather than claiming equal performance."
      evidence: "supplier/project design and signed gate records"
    - id: range_evidence
      applies_to: "all cards"
      requirement: "Develop quantitative guardrails only from comparable independent measured jobs or verified SKU data. Manufacturer supported-load tables are neither consumed material masses nor installation yields."
      evidence: "card-specific actual evidence and independent sample scope"
    - id: identity
      applies_to: "all cards"
      requirement: "Resolve actual exchange identity, state, provider/destination, property and unit before final dataset production. A conditional umbrella expands into actual exchanges and never receives an assumed universal UUID."
      evidence: "full matching flow and property/unit evidence"
    - id: periods
      applies_to: "owned_resources_jack; owned_resources_sling; owned_resources_hand_cutter; owned_resources_gauge; contracted_services; local_support_hourly_service_handling; local_support_hourly_service_access"
      requirement: "Close ownership and period allocations, replacements and retirement; prevent duplicate burdens across jobs and services."
      evidence: "resource life and all-consumer ledger"
    - id: refine_packaging
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Expand by actual material and single-use or returnable custody. Do not count packaging already included in a supplier inventory again. Returnable packaging physical mass remains separate from its allocated upstream burden. Range evidence need: actual packing specification, weighing and reuse/custody evidence; gross delivery mass is insufficient. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual material/SKU one-use or reusable packaging receipts, retained stock, returns and waste; physical mass and life/burden share separate, supplier-included manufacture once."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_owned_resources
      applies_to: "owned_resources_jack; owned_resources_sling; owned_resources_hand_cutter; owned_resources_gauge"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: For actually used jacks, slings, hand cutters, gauges and other owned assets, define each whole-resource-life packet including procurement, maintenance, replacements and retirement. Allocate its burden using measured causal use across every job/node/period; retain physical asset IDs and avoid recounting provider-owned equipment. Range evidence need: asset-specific whole-life service evidence and actual use logs; no assumed lifetime or fixed equipment-consumption fraction. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual asset functions/models require exact whole-life reference; actual provider-owned equipment excluded. Each equivalent explicitly uses resource_share, not whole purchase per job."
      evidence: "cp_resources; actual independent records and identity/unit evidence"
    - id: refine_local_support_hourly_service
      applies_to: "local_support_hourly_service_handling; local_support_hourly_service_access"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Apply only when this specific exchange actually occurs within the existing work boundary. Record its exact material or device identity, supplied/current state, native quantity and actual recipient or upstream coverage. Do not infer occurrence, quantity, a new process or a UUID. A complete supplied assembly and its already included components are mutually exclusive purchase views. Activate only when the actual provider dataset is referenced to service hours with matching scope and complete lifecycle coverage. Do not also count the same event as a whole service package. Time is not a material count. Range evidence need: actual contract scope, trips or hire records and upstream inclusion; no universal count, hours or distance. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other functions or native references require their actual identity/unit; complete counted and timed views are mutually exclusive for same event."
      evidence: "cp_resources; actual independent records and identity/unit evidence"
    - id: refine_usable_returns
      applies_to: "usable_returns_pad_module; usable_returns_usable_offcut"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional actual reusable offcuts, uninstalled pad modules and returnable packaging leaving the work order for a named owner and destination. Distinguish contamination and damage; no automatic sale, co-product or recycling credit. Range evidence need: weighed return tickets, condition and ownership; no assumed recoverable fraction. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual reusable packaging products and other returned grades/states require exact identities/receivers; retained work-order stock is not boundary exit."
      evidence: "cp_exits; actual independent records and identity/unit evidence"
    - id: refine_installation_waste
      applies_to: "installation_waste_neoprene"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Expand actual waste by neoprene/material identity, contamination, condition and named receiving treatment gate. Include irrecoverable corrections and captured debris; solid offcuts are waste, not automatically airborne elementary emissions. Disposal services and waste-transfer mass must have compatible nonduplicated treatment ownership. Range evidence need: actual cutting plan, waste tickets and correction history; no preset scrap or recycling fraction. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual discarded packaging, other captured debris and contamination/receiver differences need actual roster and independent quantities; no automatic airborne release or recycling credit."
      evidence: "cp_exits; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
