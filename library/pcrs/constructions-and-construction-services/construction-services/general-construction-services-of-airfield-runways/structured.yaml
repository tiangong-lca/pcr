measurement_rules:
  - id: accepted_area
    applies_to: "accepted_grooving"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Survey A as the union of accepted grooved plan-view polygons, excluding omitted edge/light/joint zones, unresolved rejects and untreated gaps. Count repeated passes once. The output amount is exactly 1 m2 per reference flow; all attributable campaign quantities divide by positive A."
  - id: groove_geometry
    applies_to: "accepted_grooving"
    required_property_ref:
      name: "Length"
      uuid: ""
    required_unit: "mm"
    rule: "Record the adopted project unit system and exact specification. P-621 SI nominal width 6 mm (+2/-0), depth 6 mm (±2), spacing 38 mm (-3/+0), transverse perpendicular orientation; retain actual zone acceptance distributions and alignment criteria instead of using nominal dimensions as resource factors. The printed nominal SI spacing 38 mm (-3/+0) and separately printed acceptance minimum 34 mm are distinct source clauses with an arithmetic discrepancy; retain both verbatim and obtain the adopted project criterion hierarchy/resolution from the responsible engineer before acceptance. Do not silently equate rounded SI/inch clauses or invent a universal corrected limit."
  - id: quantity_custody
    applies_to: "actual exchanges required by refine_fuel_supply, diamond_blades_complete_blade; diamond_blades_replacement_segment, lubricant_supply, remedy_materials_asphalt_mixture; remedy_materials_binder; remedy_materials_sealant, actual exchanges required by refine_packaging_supply, actual exchanges required by refine_unused_returns"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure product gross issue quantity before outward return netting with vehicle/container tare removed. Record true outward returns, retained closing stocks and consumed/transformed or released amounts by identity. Volume-to-mass needs actual product density at declared temperature; no assumed water or fuel density."
  - id: freight_units
    applies_to: "freight_service"
    required_property_ref:
      name: "mass*distance"
      uuid: ""
    required_unit: "kg*km"
    rule: "Use net cargo kg times actual route-leg km; conversion from listed t*km uses factor 1000 kg*km per t*km. Do not confuse vehicle distance with cargo transport service."
  - id: energy_units
    applies_to: "electricity_supply"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Retain measured electrical kWh and actual supply boundary. Do not substitute heating-value energy for generic electrical Energy identity; fuel mass and electrical energy remain separate physical quantities."
