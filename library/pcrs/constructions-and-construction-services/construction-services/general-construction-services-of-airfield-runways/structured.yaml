product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.general-construction-services-of-airfield-runways"
  classification_refs: "CPC 3.0 54213; narrower"
  covered_products: "Incremental accepted rectangular transverse wet saw grooving of existing sound asphalt runway"
  excluded_products: "New pavement; concrete or trapezoidal grooves; grinding; major prior repairs; airport operations"
  representative_product: "Accepted grooved clean asphalt footprint at signed airside maintenance handback"
  production_route: "Qualified retained asphalt → wet diamond saw grooves with continuous vacuum recovery and cleanup → zone-tested accepted surface"
  market_state: "Site-specific completed construction alteration service; no standalone new pavement asset"
functional_unit:
  what: "Accepted rectangular transverse wet saw grooving service on existing asphalt runway"
  how_much: "1 m2 accepted unique grooved plan-view footprint"
  how_well: "Declared project-adopted P-621 groove geometry, zone-test acceptance, cleanliness and remedy completion"
  how_long_or_cycle: "One bounded possession and grooving campaign including attributable control strip, work windows and rework; no lifetime performance promise"
  reference_flow_link: "accepted_grooving"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers wet diamond-saw cutting of transverse rectangular grooves in a qualified existing asphalt runway, with integrated continuous slurry collection, continuous cleanup, attributable setup/control-strip work, actual job-induced defect remediation and accepted maintenance handback. It applies where the actual project adopts FAA AC 150/5370-10H Item P-621 rectangular geometry and testing, with documented project choices. It excludes concrete, plastic-formed or trapezoidal grooves, diamond grinding, major pre-existing pavement rehabilitation, manufacture of a new runway or asphalt layer, drainage and lighting installation, chemical surfacing, and subsequent aircraft or airport operation. Groove acceptance alone does not warrant a friction coefficient, service life or all-weather safety."
      source_ids: []
    - rule_id: retained_host
      applies_to: "groove_finish"
      rule: "Retain the existing asphalt host without a new whole-runway upstream charge or avoided-replacement credit. Include incremental possession, guides, control strip, wet cutting, capture, cleanup, transport and job-induced remedies. Prior major rehabilitation is separately bounded with explicit responsibility."
      source_ids:
        - faa-p621-2018
    - rule_id: continuous_capture
      applies_to: "groove_finish"
      rule: "Use actual wet diamond-saw cutting with integrated continuous slurry vacuum and continuous cleanup. Account water supply and actual approved residual disposition. No routine slurry entry to airport storm sewer; freezing conditions that prevent immediate debris removal/water drainage preclude this route."
      source_ids:
        - faa-p621-2018
    - rule_id: equipment_blades
      applies_to: "diamond_blades_complete_blade; diamond_blades_replacement_segment"
      rule: "Record machine/head and blade configuration appropriate to asphalt hardness, one-pass groove capability, depth/alignment control and uniform blade wear/diameter. P-621 minimum 0.5 m multi-groove pass capability is equipment qualification, not area productivity or water consumption."
      source_ids:
        - faa-p621-2018
    - rule_id: airside_gate
      applies_to: "accepted_grooving"
      rule: "End only after measured geometry/zone acceptance, continuous cleanup complete, residual custody documented, directed damage remedies accepted and signed maintenance handback. Later airport/aircraft operation and friction/service-life claims are outside this output."
      source_ids:
        - faa-p621-2018
    - rule_id: campaign_asset_boundary
      applies_to: "capital_service_saw; capital_service_vacuum; capital_service_recovery; capital_service_tanker; capital_service_cleaner; capital_service_generator; capital_service_instrument"
      rule: "Index campaign possession/work windows, setup/control-strip/rework, manufacturing and service periods of every actual asset, maintenance, replacements and end of life. Saw/vacuum/cleaner/tanker/generator/metrology and actual access/protection/containment/remedy equipment, including bounded provider physical resources, shared with other jobs require complete-life attribution and explicit exclusion of direct fuel, electricity and tool rows from their capital coverage."
      source_ids: []
    - rule_id: actual_exchange_expansion
      applies_to: "all inventory rows"
      rule: "Conditional material/service/substance cards are foreground collection obligations. Expand each into distinct actual identity/gate/provider/receiver/property exchange; never bind or add unlike products, wastes, or species together. Record substantiated absence; unknown activity is not zero."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Existing sound stable asphalt runway at authorized airside possession; pre-existing bumps, depressed, badly cracked/spalled or defective zones already repaired by declared owner and accepted for grooving."
  starting_condition_role: "Retained host interface; not a newly supplied complete runway or burden-free incremental work."
  product_classification_scope: "Narrow runway alteration service within CPC 3.0 54213, independent of classification-derived identity."
  recursive_input_rule: "A separately purchased same-category grooving service is recorded at its actual accepted area and supply gate with upstream dataset; do not recursively invent retained-runway manufacture or duplicate subcontractor resources."
  upstream_dataset_requirement: "Actual supplied water, fuels, blades, lubricant, repair products, electricity, transport, packaging, distinct asset service and external treatment use verified compatible upstream/downstream datasets and declared boundary coverage."
  disclosure: "Incoming substrate/condition and prior-repair owner; project adopted P-621 and unit system; campaign/work-window limits; setup/control-strip inclusion; actual remedy responsibility; assets/coverage, supply and receiver gates; omitted areas, weather and stock carry-forward."
