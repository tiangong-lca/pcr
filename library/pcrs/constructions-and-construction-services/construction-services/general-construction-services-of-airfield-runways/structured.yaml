  normalization: "utf8-lf-v1"
  source_sha256: "sha256:38e86096587a385b05e1101a984d5d916b9a96bd8234ecaa4e22e15a99f39390"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5624"
      family: "system_boundary"
      span:
        start:
          offset: 5624
