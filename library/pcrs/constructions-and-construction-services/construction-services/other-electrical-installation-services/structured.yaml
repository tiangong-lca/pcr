product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.other-electrical-installation-services"
  classification_refs: "CPC 3.0 54619, Other electrical installation services; narrower"
  covered_products: "First installation of a fixed indoor four-pair Cat 6 UTP solid-copper permanent link from one existing patch-panel carrier port to one existing work-area outlet carrier. Dry manual cable placement uses an accepted prepared accessible pathway; both ends receive compatible tool-free insulation-displacement jack assemblies. The installer labels, tests the permanent link, corrects defects and hands over the accepted link with its actual configuration and test file. Leviton Atlas-X1 61UJK illustrates the jack interface, without making a brand a category requirement. [leviton-atlasx1-utp]"
  excluded_products: "Exclude new trays, ducts, penetrations, racks, panel/outlet carriers and building works; old-link removal; shielded, fibre, coaxial, outdoor or inter-building routes; splices, consolidation points and plug-terminated MPTL; equipment/patch cords; active devices, network configuration, PoE load testing and operation. A separately purchased pathway or carrier construction service is an upstream interface, not a hidden installation input. Work needing chemical pulling aids, drilling or different termination technology requires a reviewed scope change."
  representative_product: "A fixed Cat 6 UTP four-pair link with two compatible tool-free IDC jacks on prepared carriers"
  production_route: "Receive matched cable, jacks and accessories; accept prepared pathway/carriers and disconnected interfaces; dry-place cable without exceeding its actual bend/tension limits; terminate both jacks with declared pair pattern; mount and label; certify using the selected Cat 6 permanent-link limits and suitable adapters; repair/retest; accept and issue the as-built/test record."
  market_state: "Accepted indoor Cat 6 UTP permanent link at installer handover"
functional_unit:
  what: "Accepted indoor Cat 6 UTP permanent link at installer handover"
  how_much: "One accepted complete same-configuration link; actual D independently established before normalization"
  how_well: "Selected Cat 6 permanent-link limits passed, original test evidence retained, defects closed and signed handover"
  how_long_or_cycle: "One receipt-to-acceptance job, including actual corrective work and retests; separately indexed resource-life and reporting periods"
  reference_flow_link: "accepted_link"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "First installation of a fixed indoor four-pair Cat 6 UTP solid-copper permanent link from one existing patch-panel carrier port to one existing work-area outlet carrier. Dry manual cable placement uses an accepted prepared accessible pathway; both ends receive compatible tool-free insulation-displacement jack assemblies. The installer labels, tests the permanent link, corrects defects and hands over the accepted link with its actual configuration and test file. Leviton Atlas-X1 61UJK illustrates the jack interface, without making a brand a category requirement. [leviton-atlasx1-utp] Exclude new trays, ducts, penetrations, racks, panel/outlet carriers and building works; old-link removal; shielded, fibre, coaxial, outdoor or inter-building routes; splices, consolidation points and plug-terminated MPTL; equipment/patch cords; active devices, network configuration, PoE load testing and operation. A separately purchased pathway or carrier construction service is an upstream interface, not a hidden installation input. Work needing chemical pulling aids, drilling or different termination technology requires a reviewed scope change."
      source_ids:
        - leviton-atlasx1-utp
    - rule_id: prepared_interface
      applies_to: "foreground_system_boundary"
      rule: "Begin with accepted existing pathway and carriers and disconnected communications interfaces, plus receipt of installer-responsible supplies. Record the actual interface owner and readiness evidence; readiness is neither a product exchange nor avoided construction credit."
      source_ids: []
    - rule_id: supply_boundary
      applies_to: "foreground_system_boundary"
      rule: "Use component upstream packages carrying manufacture and actual delivery with explicit packaging inclusion. Track incoming packaging physically even when its manufacture is embedded upstream; add a separate burden only for a documented exclusion. Supplied jack wire managers and bundled fixings are counted once."
      source_ids: []
    - rule_id: same_category_input
      applies_to: "foreground_system_boundary"
      rule: "A purchased already-installed permanent link is not raw cable. Declare its existing state, prior gate and all upstream work; do not recursively count the same installation as a new first-installed output. Refurbishment or inherited in-scope work requires separate scope review."
      source_ids: []
    - rule_id: integration_and_rejects
      applies_to: "foreground_system_boundary"
      rule: "install_certify owns cable placement, pair termination, mounting, labelling, permanent-link testing and signed handover. A failed wire map or performance test stays a rejected in-node state; keep its original issue, repair/replacement and retest event linked to this node. No accepted output until all required tests pass and defects close."
      source_ids: []
    - rule_id: resource_and_periods
      applies_to: "foreground_system_boundary"
      rule: "Identify each owned cutter, stripper, certifier, adapter and charger across acquisition, use/reporting periods, calibration/maintenance, replacement and retirement. Enumerate every benefiting job/node and period in its resource packet, including jobs outside this dataset. Purchased providers own their equipment lifecycle. Keep original resource and job periods even if receipt and acceptance occur in different reporting periods. Later networking, maintenance and operational electricity are excluded."
      source_ids: []
