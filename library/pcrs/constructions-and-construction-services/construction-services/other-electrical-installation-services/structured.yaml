measurement_rules:
  - id: count_basis
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Use cp_acceptance to count D actual unique accepted complete links of the same disclosed configuration. D must be positive. A cable metre, connector, test run or passed pair is not a link. The output amount is 1 Item(s); there is no service-mass conversion."
  - id: material_mass
    applies_to: "copper_data_cable, cat6_utp_jacks, permanent_accessories_tie; permanent_accessories_clip; permanent_accessories_identifier, incoming_packaging_carton; incoming_packaging_bag, actual exchanges required by refine_usable_material_returns, installation_waste_insulated_conductor_offcut; installation_waste_separated_jacket_offcut; installation_waste_separated_filler_offcut"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "cp_materials records input net mass; cp_releases records returned product and waste net mass. Use calibrated weighing or traceable exact-SKU count/length-to-net-mass evidence. Installed cable length includes retained slack and termination insertion; electrical test length is not automatically physical consumed length. Do not use gross shipping mass or sum unlike materials into one exchange."
  - id: electricity_basis
    applies_to: "installation_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Record actual external charger/test/tool electricity under cp_energy, including corrections and retests before acceptance. Preserve provider, voltage and meter boundary. Battery Ah, tester run-time and net calorific value are not electricity. A kWh unit-group row alone does not verify an Energy property."
  - id: resource_basis
    applies_to: "owned_tools_and_certifier_stripper; owned_tools_and_certifier_cutter; owned_tools_and_certifier_certifier; owned_tools_and_certifier_adapter; owned_tools_and_certifier_test_lead; owned_tools_and_certifier_charger, contracted_support_test; contracted_support_access"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "cp_resources distinguishes a lifecycle fraction of an exact owned asset from a real complete purchased service event. Genuine hourly hire requires compatible Duration support and a separately reviewed exchange; do not rename hours to Item(s). Test adapters and reusable leads are tool assets, not installed patch cords."
