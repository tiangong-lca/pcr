    - id: refine_usable_material_returns
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional: each actual usable unused cable/component or usable reusable reel/packaging returned with original SKU identity, condition and receiver. Reconcile unused stock first; no automatic avoided-production credit. Failed unusable material is waste, not this product output. Range evidence need: Matching return tickets, original issue/stock linkage, retained usability and net mass. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual SKU/state/receiver matched to original receipt and original native reference; usable outward transfer only, no retained stock or failed product and no credit."
      evidence: "cp_releases; actual independent records and identity/unit evidence"
    - id: refine_installation_waste
      applies_to: "installation_waste_insulated_conductor_offcut; installation_waste_separated_jacket_offcut; installation_waste_separated_filler_offcut"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional: separately expand actual trimmed insulated conductors, jacket/filler offcuts, rejected components, spent packs and other waste. Identify composite cable versus separated copper/polymer and actual hazardous status/authorised receiver. Do not presume recycling or call measured closure residual airborne dust. Range evidence need: Original cut/defect/packaging events, material-state separation, actual tickets/net masses and treatment boundary. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Rejected components, spent packaging and any other actual waste material/state/receiver require actual dispatch identities; no air emission from unexplained residual."
      evidence: "cp_releases; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
validation_rules:
  - rule_id: link_gate
    applies_to: "foreground_dataset_conformance"
    rule: "Require declared endpoints/configuration, accessible existing pathway/carriers, correct matched cable/jacks and original permanent-link test result for every actual accepted link. Record selected standard edition/limit set, velocity setting, adapter and certifier calibration. Retain failures and retests; channel or continuity-only tests cannot establish this gate."
    source_ids:
      - fluke-permanent-link-testing
  - rule_id: reference_integrity
    applies_to: "foreground_dataset_conformance"
    rule: "Final output, reference name and accepted_link association must denote the same complete service and Number of items / Item(s) basis. D is independently observed; incomplete or rejected links do not enter D. Group or split materially different lengths/configurations with explicit equivalence evidence; never equate all counted links by count alone."
    source_ids: []
  - rule_id: custody_and_sources
    applies_to: "foreground_dataset_conformance"
    rule: "Expand conditional cards into each actual SKU/material/state/receiver exchange, with its own verified concrete identity and net quantity. Check supplier delivery/packaging inclusions, stock/returns/waste and replacement events. Zero requires affirmative no-activity evidence; an unaccounted residual is a gap. A source about termination does not prove resource life, emission factor or waste range."
