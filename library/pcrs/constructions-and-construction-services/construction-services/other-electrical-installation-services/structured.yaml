allocation_rules:
  - rule_id: failed_work
    applies_to: "foreground_burden_allocation"
    rule: "Retain failed tests, discarded ends and corrective labour/resources with the original link job; no burden transfer to a hypothetical good link, avoided-production credit or intended co-product from returns. Recovery or waste treatment starts at the declared actual receiver and must not be counted twice."
    source_ids: []
  - rule_id: resource_share
    applies_to: "foreground_burden_allocation"
    rule: "For each resource r use recorded causal physical activity A_rj and a_rj = A_rj / sum_k(A_rk) across every benefiting job k in the same resource-life packet. Use one documented activity basis and positive total; shares sum to 1 across the complete packet. Attribute B_r * a_rj / D lifecycle burden and a_rj / D Item(s) of the exact owned asset. Missing lifetime, remaining use or other consumers is an evidence gap, not a default lifetime or equal link-count split."
    source_ids: []
  - rule_id: period_closure
    applies_to: "foreground_burden_allocation"
    rule: "Index original manufacture/acquisition, each use period, calibration/repair, replacement and retirement separately. Link all input, output, asset and defect events to job and period. Document each period-specific decision and reconcile packet totals once; a replacement event is not an automatic new whole certifier per link."
    source_ids: []
  - rule_id: purchased_service
    applies_to: "foreground_burden_allocation"
    rule: "Record actual purchased test/access/support events with their contractual reference and inclusion schedule. Reconcile provider-owned capital and embedded fuel, delivery and electricity before adding any separate foreground consumption. A provider test event and the same internally performed test cannot both own the same burden."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "install_certify"
      flow_role: "Accepted link and test evidence"
      record_type: "installation acceptance record"
      raw_fields: "job/link/end-port IDs; configuration and physical cable length; actual D; standard edition/limits; NVP; certifier/adapter serial/calibration; original pass/fail files; repairs/retests; acceptance date/signature"
      collection_method: "Independently count unique fully accepted links from signed records; reconcile each to original permanent-link test files, selected limits and complete defect closure. A simple continuity check or channel test is not the selected acceptance test."
      unit: "Item(s)"
      frequency: "Every link and every original/corrective test"
      temporal_coverage: "Receipt through signed acceptance with original reporting dates"
      site_scope: "One declared indoor job and disclosed same-configuration group"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed as-built/end-port map, complete native results including failed attempts, selected test setup and calibration evidence; Aggregation detail: Independent accepted D; per reference flow"
    - protocol_id: cp_materials
      process_id: "install_certify"
      flow_role: "Supply and installation inputs"
      record_type: "SKU custody and measurement record"
      raw_fields: "shipment/job/SKU; manufacturer/model/material; net mass; delivered and used lengths/counts; exact-SKU conversion; installed slack; opening/closing stock; bundled parts; upstream delivery/packaging inclusion; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Weigh separately by matching SKU or use traceable same-SKU net-mass-per-length/item evidence. Reconcile the actual cable reel and both terminations with installed length, retained ends, waste and stock; do not substitute electrical test length for measured consumption. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "Every shipment, issue and stock event"
      temporal_coverage: "All materials attributable to receipt-to-acceptance job"
      site_scope: "Exact installation job and supplying records"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scale or matching conversion evidence; supplier inclusion schedule; event-level stock closure; Aggregation detail: Actual attributable supplied net mass; per reference flow"
    - protocol_id: cp_energy
      process_id: "install_certify"
      flow_role: "External electricity"
      record_type: "meter and charger record"
      raw_fields: "meter start/end kWh; date; provider/voltage; exact charger/tester; activities for all shared users; embedded service energy; corrections/retests"
      collection_method: "Measure attributable electricity at declared external supply boundary, including charging for this job. Reconcile shared consumer activities and service inclusions; missing metering remains a gap, not zero or battery capacity."
      unit: "kWh"
      frequency: "Every relevant charging/test interval"
      temporal_coverage: "Actual pre-acceptance intervals, retaining original dates"
      site_scope: "Declared job plus all sharing consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter trace/calibration and complete shared-use allocation/inclusion ledger; Aggregation detail: Actual attributable external electricity; per reference flow"
    - protocol_id: cp_resources
      process_id: "install_certify"
      flow_role: "Owned resources and purchased support"
      record_type: "resource-life and contract event ledger"
      raw_fields: "asset/model/serial/owner; acquisition/use/maintenance/replacement/retirement dates; complete lifecycle packet B_r; every consuming job/node/period; physical activity A_rj; future-use gap; contract event/reference/inclusions; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Link exact reusable tools, certifier, adapters and chargers to all actual consumers and lifecycle periods. Record causal activity and actual complete purchased service events separately; verify provider asset ownership and energy inclusions. Do not assume lifespan. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "Item(s)"
      frequency: "Every resource period and contract event"
      temporal_coverage: "Full resource packet and original job periods; disclose unknown remaining use"
      site_scope: "All consuming jobs/nodes, including those outside the reported site"
      aggregation_rule: "per reference flow"
      quality_evidence: "Ownership, serial, activity and inclusion records; complete consumer/period/share closure with gaps explicit; Aggregation detail: Attributable exact asset fraction or genuine whole service events; per reference flow"
    - protocol_id: cp_releases
      process_id: "install_certify"
      flow_role: "Usable returns and waste"
      record_type: "exit and receiver ticket"
      raw_fields: "original job/issue/defect ID; material/SKU; actual mass and state; reusable versus waste classification; receiver and date; authorised treatment boundary; retained/captured/emitted distinction; closure residual; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Weigh each actual unchanged usable return separately from each actual waste material/state/receiver stream. Link rejected terminations and cable ends to original in-node correction events. Investigate residual mass; do not label it an air emission or zero. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "Every return, rejection and disposal event"
      temporal_coverage: "All original installation and corrective exits through handover"
      site_scope: "Declared job and each actual receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Traceable original-issue/defect link, weighing, custody and receiver evidence; Aggregation detail: Actual attributable usable-return or waste net mass; per reference flow"
  calculation_rules:
    - id: normalize_job
      applies_to: "all inventory rows"
      rule: "q_i = attributable collected numerator_i / D; D is the independently accepted same-configuration link count from cp_acceptance. Keep every numerator measured independently, including failed work."
      inputs:
        - numerator_i
        - D
        - cp_acceptance
      output: "q_i"
      source_ids: []
    - id: owned_resource_share
      applies_to: "owned_tools_and_certifier_stripper; owned_tools_and_certifier_cutter; owned_tools_and_certifier_certifier; owned_tools_and_certifier_adapter; owned_tools_and_certifier_test_lead; owned_tools_and_certifier_charger"
      rule: "a_rj = A_rj / sum_k(A_rk); sum over all jobs k in the same complete resource-life packet. Attributed asset = a_rj / D Item(s); burden = B_r * a_rj / D. Preserve each period-specific ownership decision."
      inputs:
        - A_rj
        - A_rk
        - B_r
        - D
        - cp_resources
      output: "attributed asset quantity and lifecycle burden"
      source_ids: []
    - id: material_closure
      applies_to: "copper_data_cable, cat6_utp_jacks, permanent_accessories_tie; permanent_accessories_clip; permanent_accessories_identifier, incoming_packaging_carton; incoming_packaging_bag, actual exchanges required by refine_usable_material_returns, installation_waste_insulated_conductor_offcut; installation_waste_separated_jacket_offcut; installation_waste_separated_filler_offcut"
      rule: "opening stock + receipts = retained installed material + closing stock + usable returns + actual waste + identified releases + unexplained residual, checked per matching material/SKU and job. Report measured tolerance and unresolved residual separately; unlike masses are diagnostics only."
      inputs:
        - cp_materials
        - cp_releases
      output: "SKU custody closure and residual"
      source_ids: []
