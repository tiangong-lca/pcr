      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional: each genuinely purchased complete test, access or other support event with a disclosed contractual configuration and reference. Provider owns its equipment lifecycle; check embedded delivery/energy and avoid duplicating internal test resources. Hours are not counted events. Range evidence need: Original contract event reference, scope/inclusions, quantities and shared activity; hourly hire needs Duration support. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual support functions and services with another native reference require exact function/provider/unit refinement; retain provider equipment/energy/delivery boundary once."
