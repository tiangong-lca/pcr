      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional: each actually owned stripper/cutter, certifier, permanent-link adapter, reusable test lead or charger. Expand exact asset models/serials and all consumers/periods. Attributed manufacture and maintenance come from the complete resource packet; do not treat reusable test leads as permanent installed components. Range evidence need: Complete resource-life packet, causal use across all jobs/periods, replacements and remaining-use evidence; no generic lifespan. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Distinct actual stripper and cutter models, other assets or incompatible native service references require separate exact records. Whole-asset equivalents require compatible all-consumer full-life drivers, acquisition/maintenance/replacements/EOL; no charged fee or hours-to-Count conversion."
