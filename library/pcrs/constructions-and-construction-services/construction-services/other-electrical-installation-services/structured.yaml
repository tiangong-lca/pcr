      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional: each actual tie, clip, identifier and separately supplied compatible fixing retained in the selected link; expand separate SKUs and materials. Existing carriers are excluded. Do not repeat jack-bundled items or assume a fixed accessory count. Range evidence need: Actual retained SKU schedule and supply/return/waste counts with matching net masses. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual separate fixing SKUs require unique property/unit and independent quantities."
