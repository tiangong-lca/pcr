  data_quality_requirements:
    - id: quality_conditional_water_nodes
      applies_to: "water-containing nodes"
      requirement: "A fully reconciled residual can quantify evaporation only when all other physically relevant water entries and exits are observed or independently evidenced, the actual air release mechanism fits, pool exclusivity is verified and uncertainty is reported. Direct evaporation measurement may instead establish the node amount. If only some fates are known, report the missing fate and balance uncertainty; neither the unaccounted difference nor a negative residual becomes vapour. Separately documented added/dilution or rinse water at paste_book, or extra cleanup at dry_accept, requires actual own-node entry and exit exchanges and semantic review rather than reassignment to hang_trim."
      evidence: "Actual own-node water entry/exit, release-mechanism, uncertainty and semantic-card review evidence"
    - id: dq_route
      applies_to: "lot boundary"
      requirement: "Establish unpasted paper/paste-the-paper construction and compatible ready-mixed aqueous adhesive plus received dry, sound, appropriately primed wall. A broader or incompatible exchange identity cannot widen the category."
      evidence: "actual paper/adhesive instructions; received-wall acceptance"
    - id: dq_area
      applies_to: "reference and handoffs"
      requirement: "Use surveyed actual patch geometry, opening/overlap rule and final acceptance. Record moisture-dependent paper dimension changes; preserve actual wet-state transfers rather than forcing them to final A."
      evidence: "survey; strip/patch/transfer ledger; moisture and acceptance records"
    - id: dq_material
      applies_to: "stock and exits"
      requirement: "Reconcile exclusive intact stock, gross draw, processed/WIP, original usable exits and actual waste in kg by material/state. Document packaging tare and wet/dry basis."
      evidence: "calibrated scales; stock, transfer, return and custodian records"
    - id: dq_water
      applies_to: "paste_book, hang_trim, dry_accept"
      requirement: "State full/partial fate coverage, each exclusive constituent pool, actual gate moisture and uncertainty. No partial balance supports a default vapour quantity or zero loss."
      evidence: "independently traceable moisture/formulation/wastewater evidence and node balance"
    - id: dq_rework
      applies_to: "actual events"
      requirement: "Retain every physical correction, replacement and discard once; deduplicate only record copies. Failed/terminated states and outgoing correction transfers have explicit destinations and burdens."
      evidence: "event predecessor IDs; correction and termination records"
    - id: dq_shared
      applies_to: "utilities/services"
      requirement: "Match provider/source period and all consumers; allocate electricity only to eligible residual activity shares after direct assignment, requiring positive complete weights only for a positive residual. Known zero residual keeps direct assignment alone; unknown/negative residual remains a gap. For services reconcile the full charged availability with positive complete consumer weights and paid idle, avoiding service/electricity overlap."
      evidence: "meter; contract; charge conversion; allocation reconciliation"
    - id: dq_period
      applies_to: "multi-period lot"
      requirement: "Cover every actual work, waiting, drying and correction period through final acceptance; carry state without duplicate purchase, burden or evaporation."
      evidence: "cutoff inventory; period-linked event ledger; final acceptance"
    - id: dq_identity
      applies_to: "concrete exchanges"
      requirement: "Resolve actual material/provider/substance identity and property/unit before a final exchange. Conditional umbrella cards remain semantic until actual exchanges are specified; substance and medium evidence is required for direct releases."
      evidence: "verified identity details plus foreground qualifier records"
    - id: dq_range
      applies_to: "every Range"
      requirement: "Keep these broad author intervals provisional. Test empirical replacements against an independent reviewed reference population; do not use the current batch maximum to validate the same batch. Outliers retain their actual quantities and documented explanation."
      evidence: "independent reference sample and review; provisional-range disclosure"
