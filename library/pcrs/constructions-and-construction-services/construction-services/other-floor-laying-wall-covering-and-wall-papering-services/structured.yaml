validation_rules:
  - rule_id: validate_scope
    applies_to: "actual route"
    rule: "Fail scope compatibility for vinyl, self-adhesive, prepasted, paste-the-wall, manufacture or substrate-preparation activities presented as this service. Verify the actual received primed/dry interface."
    source_ids:
      - roman-wall-preparation
      - roman-paper-preparation
  - rule_id: validate_reference
    applies_to: "accepted service"
    rule: "Require positive A, a unique actual final accepted-area ledger and the reference_service link. A/A = 1 is normalization only; a terminated zero-A lot is separately disclosed."
    source_ids: []
  - rule_id: validate_handoffs
    applies_to: "paired gates"
    rule: "Match transfer IDs, state, property/unit, actual quantity, moisture and period on both sides of every handoff. Explain actual loss/correction between gates; never force an internal numerator to 1 m2."
    source_ids: []
  - rule_id: validate_stock
    applies_to: "material draw and usable exits"
    rule: "Require gross input opening + receipts - exclusive intact unissued closing stock; separately positive original usable outputs. Reject double subtraction, retained closing stock reported as return, processed reject reported as unused material and service/rework credit."
    source_ids: []
  - rule_id: validate_water
    applies_to: "three water nodes"
    rule: "Test own-node inputs and all exclusive retained, liquid, solid, stock/WIP, usable-exit and air fates with uncertainty and transfer continuity. Complete reconciled or independently measured evaporation is required for a numerical vapour exchange. Missing fate is incomplete coverage; negative residual is a finding."
    source_ids: []
  - rule_id: validate_dryness
    applies_to: "final acceptance"
    rule: "Use actual applicable dryness and visual criteria and observed result. Booking, trim allowance, primer waiting and final drying durations are product/site records; no universal 3–5 minutes, two inches, 24 hours or service lifetime. Accepted residual moisture is not silently zero."
    source_ids:
      - roman-paper-preparation
      - roman-first-strip
      - roman-wall-preparation
  - rule_id: validate_rework
    applies_to: "failed states and corrections"
    rule: "Every rejected state has rework, retained WIP, usable original-material exit or actual discard destination at its producing/custody node. Count each accepted patch once and every real correction event once; discard record duplicates only."
    source_ids: []
