  calculation_rules:
    - id: accepted_area_total
      applies_to: "reference_service"
      rule: "A = sum(unique finally accepted net patch areas); service_ref = A / A = 1 m2. Use actual measured dimensions/openings and hydrated-to-accepted state; exclude repeated coverings and unaccepted patches. Require A > 0."
      inputs:
        - accepted_patch_area_m2
        - wall_dimensions_m
        - openings_m2
        - patch_id
        - visual_result
        - observed_dryness
        - cp_dry_accept
      output: "A; service_ref"
      source_ids: []
    - id: gross_draw
      applies_to: "paper_rolls; adhesive; wash_consumables_sponge; wash_consumables_cloth; atomic_wash_consumables"
      rule: "gross_draw_kg = opening_intact_unissued_kg + receipts_kg - closing_intact_unissued_kg; input_ref = gross_draw_kg / A. Include usable unused return and external transfer in physical draw because they leave node custody. Do not subtract them here. Opening/closing processed WIP is a separate state and not intact unissued stock."
      inputs:
        - material_id
        - opening_intact_unissued_kg
        - receipts_kg
        - closing_intact_unissued_kg
        - A
        - cp_layout_cut
        - cp_paste_book
        - cp_hang_trim
      output: "gross_draw_kg; input_ref"
      source_ids: []
    - id: unused_exit_total
      applies_to: "unused_paper_return; unused_adhesive_return; unused_hanging_consumable_return_wash_consumables_sponge; unused_hanging_consumable_return_wash_consumables_cloth; unused_hanging_consumable_return_wash_water_wash_water; atomic_unused_hanging_consumable_return"
      rule: "unused_exit_kg = sum(unique actual usable return events + unique unused external-transfer events), by original material and node; output_ref = unused_exit_kg / A. Net_consumed_diagnostic_kg = gross_draw_kg - unused_exit_kg; do not generate a second exchange from this diagnostic or subtract it again."
      inputs:
        - event_id
        - material_id
        - unused_return_kg
        - unused_external_transfer_kg
        - gross_draw_kg
        - A
        - cp_layout_cut
        - cp_paste_book
        - cp_hang_trim
      output: "unused_exit_kg; output_ref; net_consumed_diagnostic_kg"
      source_ids: []
    - id: paired_transfer
      applies_to: "cut_strips; paste_feed; booked_strips; hang_feed; wet_wallcovering; dry_feed"
      rule: "transfer_ref = actual own-gate mass_kg or area_m2 / A, preserving that card's unit. Pair sending and receiving transfer_id, state, timestamp and constituents; quantify any intervening owned physical event separately. Carry actual outgoing water after prior losses as next incoming water. Never substitute A for the numerator or infer mass from area without a measured grade/moisture bridge."
      inputs:
        - transfer_id
        - gate_mass_kg
        - gate_area_m2
        - gate_water_kg
        - strip_dimensions_m
        - moisture_fraction
        - A
        - cp_layout_cut
        - cp_paste_book
        - cp_hang_trim
        - cp_dry_accept
      output: "transfer_ref; paired_gate_state"
      source_ids: []
    - id: fresh_water_total
      applies_to: "wash_water"
      rule: "gross_fresh_water_kg = wash_water_opening_kg + wash_water_receipts_kg - wash_water_closing_intact_kg; fresh_water_ref = gross_fresh_water_kg / A. For a direct supply with no storage, opening and closing are evidenced absent and measured receipt is the physical draw. Keep any actual unused water exit as a separate positive material-specific output."
      inputs:
        - wash_water_opening_kg
        - wash_water_receipts_kg
        - wash_water_closing_intact_kg
        - wash_water_unused_exit_kg
        - A
        - cp_hang_trim
      output: "gross_fresh_water_kg; fresh_water_ref"
      source_ids: []
    - id: waste_totals
      applies_to: "paper_offcuts; paper_packaging_card; paper_packaging_plastic; atomic_paper_packaging; paste_residue; atomic_paste_packaging; wet_trim; wash_wastewater; spent_wipes_sponge; spent_wipes_cloth; atomic_spent_wipes; dry_rejects"
      rule: "waste_ref = sum(unique actual waste transfer masses by material/state/custodian) / A. Separate tare and residual contents, or document included contents once. water_in_waste_kg = actual_wet_mass_kg × evidenced_water_fraction, or independently measured constituent water. Solid-waste water and wastewater water are disjoint."
      inputs:
        - event_id
        - waste_material
        - actual_wet_mass_kg
        - tare_kg
        - evidenced_water_fraction
        - custodian
        - A
        - cp_layout_cut
        - cp_paste_book
        - cp_hang_trim
        - cp_dry_accept
      output: "waste_ref; water_in_waste_kg"
      source_ids: []
    - id: water_constituent_inputs
      applies_to: "paste_book_vapour; hang_trim_vapour; dry_vapour"
      rule: "formulation_water_draw_kg = gross formulated adhesive draw_kg × actual batch adhesive_water_fraction, summed by batch; wastewater_water_kg = wastewater_kg × evidenced wastewater_water_fraction. Measure consumable_water_draw_kg as constituent water in actual issued cleanup material. These are constituents of existing physical inputs/outputs, not extra exchanges. Keep container_residue_water_kg exclusive from residue_water_kg."
      inputs:
        - adhesive_opening_kg
        - adhesive_receipts_kg
        - adhesive_closing_intact_kg
        - adhesive_water_fraction
        - wastewater_kg
        - wastewater_water_fraction
        - consumable_water_draw_kg
        - residue_water_kg
        - container_residue_water_kg
        - cp_paste_book
        - cp_hang_trim
      output: "formulation_water_draw_kg; wastewater_water_kg"
      source_ids: []
    - id: paste_water_balance
      applies_to: "paste_book_vapour"
      rule: "W_in_paste = incoming_strip_water_kg + formulation_water_draw_kg + fresh_water_kg + opening_wip_water_kg + incoming_rework_water_kg. W_out_paste = booked_strip_water_kg + usable_exit_water_kg + residue_water_kg + container_residue_water_kg + liquid_exit_water_kg + closing_wip_water_kg + outgoing_rework_water_kg. For a gross material draw, unissued closing formulation water is already excluded, so never deduct it again; water in usable returns remains in W_in and W_out. Actual evaporation = independently measured own-node evaporation, or W_in_paste - W_out_paste only with complete mutually exclusive fates and supported air release. evaporation_ref = actual evaporation / A. For a real same-period corrective handoff, record incoming_rework_water_kg separately at its actual receiving node and outgoing_rework_water_kg once at the sending node, joined by rework_transfer_id, sender_node_id, receiver_node_id, material/state, cutoff and signed custody/measurement evidence. Do not count the same transfer also as ordinary forward feed, new supply, usable exit, reject waste or opening WIP. Forward re-delivery after correction uses its actual normal forward transfer record once. A correction wholly inside one node creates no artificial transfer. Cross-period retained water belongs to closing/opening WIP once, not also to a same-period rework receipt. Preserve measured discrepancies and actual loss ownership; incomplete pairing blocks balance-derived evaporation, not an assumed zero."
      inputs:
        - incoming_strip_water_kg
        - formulation_water_draw_kg
        - fresh_water_kg
        - opening_wip_water_kg
        - booked_strip_water_kg
        - usable_exit_water_kg
        - residue_water_kg
        - container_residue_water_kg
        - liquid_exit_water_kg
        - closing_wip_water_kg
        - outgoing_rework_water_kg
        - fate_coverage
        - directly_measured_evaporation_kg
        - water_uncertainty_kg
        - A
        - cp_paste_book
        - incoming_rework_water_kg
        - rework_transfer_id
        - sender_node_id
        - receiver_node_id
      output: "actual_paste_evaporation_kg; evaporation_ref; water_balance_gap"
      source_ids: []
    - id: hang_water_balance
      applies_to: "hang_trim_vapour"
      rule: "W_in_hang = incoming_booked_water_kg + gross_fresh_water_kg + consumable_water_draw_kg + opening_wip_water_kg + incoming_rework_water_kg. W_out_hang = hung_water_kg + usable_exit_water_kg + wet_trim_water_kg + wastewater_water_kg + spent_wipes_water_kg + closing_wip_water_kg + outgoing_rework_water_kg. Actual fresh/formulated draws already exclude intact unissued closing water, which is not deducted again. Actual evaporation = independently measured own-node evaporation, or W_in_hang - W_out_hang only with complete mutually exclusive fates and supported air release. evaporation_ref = actual evaporation / A. For a real same-period corrective handoff, record incoming_rework_water_kg separately at its actual receiving node and outgoing_rework_water_kg once at the sending node, joined by rework_transfer_id, sender_node_id, receiver_node_id, material/state, cutoff and signed custody/measurement evidence. Do not count the same transfer also as ordinary forward feed, new supply, usable exit, reject waste or opening WIP. Forward re-delivery after correction uses its actual normal forward transfer record once. A correction wholly inside one node creates no artificial transfer. Cross-period retained water belongs to closing/opening WIP once, not also to a same-period rework receipt. Preserve measured discrepancies and actual loss ownership; incomplete pairing blocks balance-derived evaporation, not an assumed zero."
      inputs:
        - incoming_booked_water_kg
        - gross_fresh_water_kg
        - consumable_water_draw_kg
        - opening_wip_water_kg
        - hung_water_kg
        - usable_exit_water_kg
        - wet_trim_water_kg
        - wastewater_water_kg
        - spent_wipes_water_kg
        - closing_wip_water_kg
        - outgoing_rework_water_kg
        - fate_coverage
        - directly_measured_evaporation_kg
        - water_uncertainty_kg
        - A
        - cp_hang_trim
        - incoming_rework_water_kg
        - rework_transfer_id
        - sender_node_id
        - receiver_node_id
      output: "actual_hang_evaporation_kg; evaporation_ref; water_balance_gap"
      source_ids: []
    - id: dry_water_balance
      applies_to: "dry_vapour"
      rule: "W_in_dry = incoming_surface_water_kg + opening_wip_water_kg + added_water_kg + incoming_rework_water_kg. W_out_dry = accepted_residual_water_kg + reject_water_kg + other_liquid_exit_water_kg + usable_exit_water_kg + closing_wip_water_kg + outgoing_rework_water_kg. Actual evaporation = independently measured own-node evaporation, or W_in_dry - W_out_dry only with complete mutually exclusive fates and supported air release. evaporation_ref = actual evaporation / A. Accepted residual water is measured at actual dryness acceptance and need not equal zero. For a real same-period corrective handoff, record incoming_rework_water_kg separately at its actual receiving node and outgoing_rework_water_kg once at the sending node, joined by rework_transfer_id, sender_node_id, receiver_node_id, material/state, cutoff and signed custody/measurement evidence. Do not count the same transfer also as ordinary forward feed, new supply, usable exit, reject waste or opening WIP. Forward re-delivery after correction uses its actual normal forward transfer record once. A correction wholly inside one node creates no artificial transfer. Cross-period retained water belongs to closing/opening WIP once, not also to a same-period rework receipt. Preserve measured discrepancies and actual loss ownership; incomplete pairing blocks balance-derived evaporation, not an assumed zero."
      inputs:
        - incoming_surface_water_kg
        - opening_wip_water_kg
        - added_water_kg
        - accepted_residual_water_kg
        - reject_water_kg
        - other_liquid_exit_water_kg
        - usable_exit_water_kg
        - closing_wip_water_kg
        - outgoing_rework_water_kg
        - fate_coverage
        - directly_measured_evaporation_kg
        - water_uncertainty_kg
        - A
        - cp_dry_accept
        - incoming_rework_water_kg
        - rework_transfer_id
        - sender_node_id
        - receiver_node_id
      output: "actual_dry_evaporation_kg; evaporation_ref; water_balance_gap"
      source_ids: []
    - id: node_electricity
      applies_to: "layout_cut_electricity; paste_book_electricity; hang_trim_electricity; dry_accept_electricity"
      rule: "For each exclusive source period: shared_remainder_kWh = source_total_kWh - independently assigned direct_consumer_kWh. If shared_remainder_kWh > 0, share_node = positive_weight_node / all_consumer_weight_sum using only remaining eligible actual activity shares not already covered by direct assignment; E_node = direct_node_kWh + shared_remainder_kWh × share_node. Fully direct-assigned shares receive no residual again. If the known shared_remainder_kWh = 0, E_node = direct_node_kWh and no shared denominator is required. Unknown or negative residual is a data gap. For a positive residual the complete eligible weights and denominator must be positive and shares reconcile to 1; missing/zero denominator blocks allocation. Sum exclusive source-period E_node and divide by A."
      inputs:
        - source_total_kWh
        - direct_consumer_kWh
        - direct_node_kWh
        - positive_weight_node
        - all_consumer_weight_sum
        - source_period
        - service_component_boundary
        - A
        - cp_layout_cut_utilities
        - cp_paste_book_utilities
        - cp_hang_trim_utilities
        - cp_dry_accept_utilities
      output: "E_node; electricity_ref"
      source_ids: []
    - id: node_service_hours
      applies_to: "layout_cut_access_service; layout_cut_tool_service; layout_cut_storage_service; layout_cut_conditioning_service; paste_book_access_service; paste_book_tool_service; paste_book_storage_service; paste_book_conditioning_service; hang_trim_access_service; hang_trim_tool_service; hang_trim_storage_service; hang_trim_conditioning_service; dry_accept_access_service; dry_accept_tool_service; dry_accept_storage_service; dry_accept_conditioning_service"
      rule: "For each actual child identity/provider/contract/capacity/source period independently, H_source = actual contract charged availability hours including paid idle, from actual contract periods and evidenced bill-unit conversion. H_node_period = H_source * positive_weight_node / sum(all positive consumer weights). All weights are causal, evidenced and complete for this same service including outside-job consumers and paid reserved/idle shares. H_child = sum of exclusive H_node_period for this identity and node. Reconcile all node/job shares once to H_source. Do not pool different services, repeat one source in each child, assume an 8-hour day or invent a drying interval. Retain provider component scope and exclude duplicated energy. H_child remains raw h; the child card alone divides once by A."
      inputs:
        - actual_service_identity
        - provider_id
        - contract_id
        - source_period
        - charged_hours
        - paid_idle_hours
        - bill_unit
        - bill_quantity
        - documented_hours_per_bill_unit
        - positive_weight_node
        - all_consumer_weight_sum
        - all_consumer_ids
        - source_reconciliation
        - cp_layout_cut_access_service
        - cp_layout_cut_tool_service
        - cp_layout_cut_storage_service
        - cp_layout_cut_conditioning_service
        - cp_paste_book_access_service
        - cp_paste_book_tool_service
        - cp_paste_book_storage_service
        - cp_paste_book_conditioning_service
        - cp_hang_trim_access_service
        - cp_hang_trim_tool_service
        - cp_hang_trim_storage_service
        - cp_hang_trim_conditioning_service
        - cp_dry_accept_access_service
        - cp_dry_accept_tool_service
        - cp_dry_accept_storage_service
        - cp_dry_accept_conditioning_service
      output: "H_child; identity-keyed H_<row_id>"
      source_ids: []
    - id: direct_release_total
      applies_to: "atomic_paste_book_other_releases; atomic_hang_trim_other_releases; atomic_dry_accept_other_releases"
      rule: "release_ref = sum(unique actually evidenced own-node release_kg for each exact non-H2O species, physical-state basis and receiving compartment) / A. Keep occurrence evidence, method and uncertainty; unknown occurrence, species, medium or amount remains a gap and cannot be reconstructed from an unexplained material loss. Use the actual producing node and its own protocol; dry_accept quantities cannot substitute for earlier-node releases."
      inputs:
        - event_id
        - species_identity
        - release_state_basis
        - receiving_compartment
        - release_kg
        - release_method
        - release_occurrence_evidence
