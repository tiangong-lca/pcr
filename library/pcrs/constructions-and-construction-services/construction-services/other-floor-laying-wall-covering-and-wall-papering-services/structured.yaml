ain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only. For a real same-period corrective handoff, record incoming_rework_water_kg separately at its actual receiving node and outgoing_rework_water_kg once at the sending node, joined by rework_transfer_id, sender_node_id, receiver_node_id, material/state, cutoff and signed custody/measurement evidence. Do not count the same transfer also as ordinary forward feed, new supply, usable exit, reject waste or opening WIP. Forward re-delivery after correction uses its actual normal forward transfer record once. A correction wholly inside one node creates no artificial transfer. Cross-period retained water belongs to closing/opening WIP once, not also to a same-period rework receipt. Preserve measured discrepancies and actual loss ownership; incomplete pairing blocks balance-derived evaporation, not an assumed zero."
