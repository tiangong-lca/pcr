system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This methodology describes installing unpasted decorative paper wallpaper on an interior wall already received as smooth, sound, clean, dry and appropriately primed. It follows room layout and cutting, application of a compatible ready-mixed aqueous adhesive to the paper, the actual booking step, hanging and matching, smoothing, trimming and wet cleanup, and drying and customer acceptance. The required handover is an adhered, visually accepted covering whose actual dryness meets the declared paper, adhesive and project instructions. Wallpaper and adhesive manufacture, primer application, old-covering removal, substantial substrate repair, painting, vinyl wallcoverings, self-adhesive or prepasted products and paste-the-wall routes are outside this category. Their burdens cannot be absorbed by relabelling a preparation or installation exchange. A job receiving an unsuitable wall must record the separate enabling work and the later accepted interface before using this installation methodology."
      source_ids: []
    - rule_id: boundary_start
      applies_to: "received wall"
      rule: "Begin only after wall/primer suitability and dryness are evidenced. Reject the interface or model enabling preparation separately when it is unsuitable."
      source_ids:
        - roman-wall-preparation
    - rule_id: boundary_route
      applies_to: "installation route"
      rule: "Check the paper's actual hanging instructions before pasting. Use its compatible adhesive and booking requirements; do not substitute a paste-the-wall route."
      source_ids:
        - roman-paper-preparation
    - rule_id: boundary_nodes
      applies_to: "four foreground nodes"
      rule: "Keep layout/cut, paste/book, hang/trim/cleanup and dry/accept as separate responsibilities with real input and output gates. Include their actual corrections and utilities through final acceptance."
      source_ids:
        - roman-paper-preparation
        - roman-first-strip
    - rule_id: boundary_nonwater_releases
      applies_to: "paste_book; hang_trim; dry_accept"
      rule: "Assign each actually observed non-H2O substance release to its actual producing node with occurrence, species/state, medium, amount and method evidence. Earlier-node releases cannot be subsumed into the drying card. Unknown occurrence or fate remains a gap; captured waste and direct release remain exclusive."
      source_ids: []
    - rule_id: boundary_water
      applies_to: "water-containing states"
      rule: "Carry formulation water and paper moisture through time-specific transfers. Assign evaporation to the node where it occurs; retain collected wastewater and water in solid discards, WIP and accepted covering as different fates."
      source_ids: []
    - rule_id: boundary_services
      applies_to: "actual utilities/services"
      rule: "Include actual site electricity and charged access, tools, storage or conditioning attributable to the lot, with all consumers and paid availability periods. If a service already includes electricity, document the component boundary before adding electricity separately."
      source_ids: []
    - rule_id: boundary_end
      applies_to: "customer handover"
      rule: "End at actual dry acceptance; wallpaper use, later maintenance, replacement and end of life are outside this foreground service. Initial failed installation and its corrections remain in this lot."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Accepted smooth, sound, clean, dry and appropriately primed interior wall; actual unpasted paper rolls and compatible ready-mixed aqueous adhesive supplied to the job"
  starting_condition_role: "Upstream received installation interface, with separate proof of preparation and acceptance; it does not imply primer application within this foreground boundary"
  product_classification_scope: "The specific paper-wallpaper installation service above; classification 54750 has a wider semantic scope than this selected route"
  recursive_input_rule: "A same-category service purchased for another contractor's portion crosses the declared responsibility gate once. Record its scope, accepted area, provider and period; either use its upstream service dataset or expand its work records, never both. Do not feed this lot's own intermediate state back as a purchased final service."
  upstream_dataset_requirement: "Identify separate datasets or explicit gaps for actual paper, aqueous adhesive, water, electricity and charged services. Link upstream wall preparation separately when the downstream study includes it. Internal cut, booked and hung states have custody IDs and measured states rather than invented market-product identities."
  disclosure: "Publish the received-wall condition and evidence; material grades/formulations; included node responsibility and periods; outsourced service scope; actual rework and waste routing; measured/estimated water fates; shared-service attribution; remaining identity and quantity gaps"
