product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.thermal-insulation-services"
  classification_refs: "cpc:3.0:54652 — Thermal insulation services; proposed narrower relation"
  covered_products: "Site friction-fitting of declared unfaced semi-rigid stone wool slabs into accepted open wall-frame cavities, including aperture survey, cutting, inspection and local cleanup"
  excluded_products: "Frame construction, lining and membranes; insulation manufacture; external/render insulation; foam, glass-wool and blown routes; demolition; asbestos and hazardous-material removal"
  representative_product: "Accepted stone wool insulated cavity surface before enclosure"
  production_route: "Work-lot aperture survey → slab cutting → friction fitting → inspection, rework where necessary and cleanup → accepted open-cavity insulation handover"
  market_state: "Completed installation service at the pre-enclosure acceptance gate; not a manufactured slab or complete wall"
functional_unit:
  what: "Accepted friction-fit stone wool frame insulation service in open wall-frame cavities"
  how_much: "1 m2 net accepted insulated cavity area"
  how_well: "Declared stone wool grade, unfaced semi-rigid form, nominal/design thickness, density or documented product density basis, declared conductivity and applicable resistance basis; correct fit without visible gaps or unintended compression; accepted before enclosure"
  how_long_or_cycle: "One defined installation work lot and its acceptance event; no building service life or whole-wall thermal performance is implied"
  reference_flow_link: "accepted_insulation_service"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR governs site installation of unfaced semi-rigid mineral stone wool slabs into accepted, dry, stable, open wall frames. The installer measures the clear cavity apertures, cuts the slabs, friction-fits the pieces, inspects the installed insulation and cleans the work area. The handover is accepted insulation before lining or other enclosure conceals it. The covered service is narrower than general thermal insulation services. Exclude construction or repair of the frame, manufacture of insulation, membranes, lining, plastering, exterior insulation/render systems, blown or sprayed insulation, glass wool, foams, removal of existing insulation and all asbestos work. Stone wool means 岩棉; asbestos is 石棉 and outside this category. A product-specific guide informs the installation sequence but its cutting allowance, stud spacing, dimensions and named product properties are not universal PCR defaults. Actual selected-system instructions govern execution (rockwool-thermal-frame-slab-installation-2025)."
      source_ids:
        - rockwool-thermal-frame-slab-installation-2025
    - rule_id: starting_frame
      applies_to: "aperture_survey"
      rule: "Accept the existing frame condition and measure clear apertures; substantial repairs or construction are separate supplied activities. Record their owner before beginning the covered service."
      source_ids:
        - rockwool-thermal-frame-slab-installation-2025
    - rule_id: cut_and_fit
      applies_to: "slab_cutting; fit_acceptance"
      rule: "Include measuring, cutting, friction fitting, gap inspection and local cleanup. Follow actual selected-system instructions; no universal cutting allowance, framing centres or fixing quantity is prescribed."
      source_ids:
        - rockwool-thermal-frame-slab-installation-2025
    - rule_id: component_integration
      applies_to: "fit_acceptance"
      rule: "Integrate cut stone wool with the measured existing-frame component interface. The frame transfer carries geometric and acceptance state only; frame manufacture stays upstream. Joining is friction fitting; retention accessories are conditional on actual system requirements. Do not invent mixing, chemical reaction or a single-component assembly."
      source_ids:
        - rockwool-thermal-frame-slab-installation-2025
    - rule_id: waste_and_release
      applies_to: "slab_cutting; fit_acceptance"
      rule: "Keep collected offcuts and vacuum dust as waste under custody, with named receiver and treatment link. Report direct airborne release only from independent composition/size/medium evidence; do not turn collected waste into an elementary emission."
      source_ids:
        - rockwool-thermal-frame-slab-installation-2025
    - rule_id: shared_services
      applies_to: "all processes"
      rule: "Attribute actual shared electricity for survey lighting, cutting, fitting or vacuuming using meter/event and consumer records for the same period. Every meter or shared service has one accounting owner. Include actual shared access-platform, scaffold or rented-equipment availability services with named asset, all consuming nodes and contract periods; use actual h records and documented beneficiary shares. Declare equipment/access capital treatment and supplier-service inclusions."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "An accepted stable dry open wall frame with accessible cavities, and supplied unfaced semi-rigid stone wool slabs of declared grade; frame defects and hazardous materials have been resolved outside this service"
  starting_condition_role: "Existing-frame component interface plus separately supplied insulation material input; the frame is not manufactured in the foreground"
  product_classification_scope: "Only the stated narrower installation service within cpc:3.0:54652"
  recursive_input_rule: "A purchased installation service in the same category is an externally supplied service with supplier scope and quantities disclosed; use its upstream dataset and avoid reproducing its surveyed, cut or fitted activities in this foreground package"
  upstream_dataset_requirement: "Link actual supplied slabs, electricity and actual accessories to compatible upstream datasets; frame construction remains with the incoming frame owner. Preserve transport and offsite waste-treatment links and disclose their model ownership. No automatic burden-free input or avoided-product credit is implied."
  disclosure: "Site, work-lot boundary, accepted starting state, excluded corrective work, material specification, tool and shared-meter ownership, transport/treatment responsibility, actual retention condition, internal transfers and acceptance gate"
