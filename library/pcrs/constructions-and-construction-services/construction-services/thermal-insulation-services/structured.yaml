allocation_rules:
  - rule_id: lot_subdivision
    applies_to: "work-lot burdens"
    rule: "Prefer direct node and lot records. Divide each attributable node numerator by the same positive accepted A. Rejected work, failed fitting attempts and their cleanup remain burdens of the producing lot; do not divide them by rejected area or count them as another final product."
    source_ids: []
  - rule_id: reusable_exits
    applies_to: "cut_reusable_exit; fit_reusable_exit"
    rule: "Record reusable exits as physical product outputs with recipient and state; they are not insulation services or waste. Gross physical slab input retains these exits. Net-use diagnostics subtract them once; never subtract the same return again from gross input because it is already an output. Only the actual unused material's inherited upstream burden may follow that material on exit; survey, cutting, fitting and rework service burdens remain with this service lot. Declare the material-burden transfer method and sensitivity; no automatic avoided-production credit."
    source_ids: []
  - rule_id: rework_ownership
    applies_to: "slab_cutting; fit_acceptance"
    rule: "A usable offcut reused within cutting or a removed piece refitted within the lot is an internal loop with event ids. Carry its inherited burdens once and add actual new cutting/fitting/cleanup burdens at the responsible node. Material leaving the node is classified as reusable product or custodial waste, never both."
    source_ids:
      - rockwool-thermal-frame-slab-installation-2025
  - rule_id: shared_meter
    applies_to: "all electricity and shared access/equipment service cards"
    rule: "For a meter interval, E_total = end reading - start reading after unit and multiplier correction. Identify all consumers, including outside-scope users. Prefer submeter totals; otherwise use documented observed runtime-and-power/activity weights. Shares across all consumers sum to one; assign each share once to one consuming node and lot before normalization. Do not add a site's full bill to each node. For actual rented access or equipment, use shared_service_calc and the node-specific shared-service protocol; enumerate every beneficiary in the same contract period and separately resolve availability versus active-use basis."
    source_ids: []
  - rule_id: changeover_cleanup
    applies_to: "work lots"
    rule: "Assign material-grade changeover and local cleaning to the originating lot where identifiable; document the common event and actual beneficiary shares otherwise. One cleanup event belongs to cutting or fitting ownership, with each physical waste or energy quantity counted once."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_survey_area
      process_id: "aperture_survey"
      flow_role: "supplied and measured frame interfaces"
      record_type: "aperture survey and supplier acceptance record"
      raw_fields: "site; lot; room/wall; aperture_id; clear_width; clear_height; irregular_geometry_dimensions; noninsulatable_area; starting_acceptance; ready_state; frame_transfer_id; timestamp"
      collection_method: "Measure actual clear apertures with checked tape or laser; calculate geometry from recorded dimensions; retain drawings and starting-frame acceptance Aggregation algorithm: Sum actual surveyed and ready cavity areas separately; divide each by A from cp_fit_area; retain failed/held cavity records outside ready area"
      unit: "m; m2"
      frequency: "Each aperture and any corrected survey"
      temporal_coverage: "Same work lot before cutting and fitting"
      site_scope: "Named wall/frame cavities only"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Instrument check; signed aperture sheet; photographs; transfer reconciliation"
    - protocol_id: cp_survey_energy
      process_id: "aperture_survey"
      flow_role: "conditional survey lighting"
      record_type: "node meter or shared-event record"
      raw_fields: "site; lot; node; asset_id; period_start; period_end; meter_start; meter_end; meter_unit; multiplier; meter_to_kWh_factor; conversion_evidence; actual_runtime; observed_power; all_consumers; consumer_weights; allocation_share; billed_service_inclusions"
      collection_method: "Read node meter or link shared interval to actual survey lighting; retain full consumer ledger before computing allocation Aggregation algorithm: Correct end-minus-start; multiply by survey share once; sum survey-attributable kWh; divide by A"
      unit: "kWh"
      frequency: "Each metered interval or shared event"
      temporal_coverage: "Survey period for same lot"
      site_scope: "Survey consumers plus every other consumer of that shared meter"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Meter calibration or bill; activity log; shares reconcile to one; no duplicate interval"
    - protocol_id: cp_cut_material
      process_id: "slab_cutting"
