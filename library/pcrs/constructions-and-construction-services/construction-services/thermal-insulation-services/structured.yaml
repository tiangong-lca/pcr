measurement_rules:
  - id: accepted_area
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "A is positive net accepted insulated cavity area measured from actual clear apertures using cp_fit_area; exclude frame members, openings, voids, rejected and unaccepted work. Do not use gross wall elevation or purchased slab area."
  - id: material_mass
    applies_to: "delivered_stone_wool; cut_slabs_transfer; cut_wool_feed; cut_reusable_exit; fit_reusable_exit; cut_wool_waste; fit_wool_waste"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use traceable actual mass records. If converted from pieces or slab volume, retain same-grade dimensions, density evidence and uncertainty; never treat area as mass without these conversion inputs."
