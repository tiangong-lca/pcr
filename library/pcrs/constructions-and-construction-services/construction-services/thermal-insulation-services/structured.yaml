      collection_method: "Weigh by material with checked scales or use traceable grade-specific pack/piece mass conversion; record opening and closing stock and every mutually exclusive exit; separate packaging from wool Aggregation algorithm: Compute gross slab draw and diagnostic net use; sum transfer/reusable/waste/packaging separately; divide each numerator by A; closing stock excludes material already recorded as external exit Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "Each receipt, transfer, return and waste event; stock at lot boundaries"
      temporal_coverage: "Entire cutting lot including recutting and cutting-owned cleanup"
      site_scope: "Cutting custody and named downstream recipients"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Scale check; supplier mass/density documentation; stock ledger; signed transfer and waste receipt; event uniqueness"
    - protocol_id: cp_cut_energy
