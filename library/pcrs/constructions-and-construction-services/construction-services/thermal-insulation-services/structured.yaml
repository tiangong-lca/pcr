      site_scope: "This node plus all other asset consumers, including outside-scope users"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Supplier contract/invoice; asset logs; exact unit conversion; all-consumer shares sum to one; inclusion/exclusion reconciliation"
    - protocol_id: cp_fit_shared_service
      process_id: "fit_acceptance"
      flow_role: "conditional shared access/equipment availability service"
      record_type: "rental contract, asset event and complete consumer ledger"
      raw_fields: "site; lot; node; asset_id; actual_equipment_identity; supplier_contract; service_gate; time_basis; availability_start; availability_end; billed_quantity; billed_unit; documented_time_conversion; all_consumers; consumer_activity_records; weights; allocation_share; energy_inclusions; capital_and_maintenance_inclusions; setup_removal_owner; timestamp; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Record the actual supplied availability period and contract units; reconcile observed consumer activity and every beneficiary for the same asset period; preserve evidence distinguishing availability from active operation; collect this node's own actual records before allocation Aggregation algorithm: Convert documented availability quantity to h; multiply by this node's beneficiary share once; sum attributable service hours and divide by A; do not add invoice-wide service repeatedly or separately add burdens already included by supplier Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "h"
      frequency: "Each asset/service period and change of consumers"
      temporal_coverage: "Complete fit_acceptance participation within the contracted availability period"
      site_scope: "This node plus all other asset consumers, including outside-scope users"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Supplier contract/invoice; asset logs; exact unit conversion; all-consumer shares sum to one; inclusion/exclusion reconciliation"
  calculation_rules:
    - id: accepted_area_calc
      applies_to: "accepted_insulation_service"
      rule: "For each finally accepted aperture, net_area = measured geometric area - recorded noninsulated deductions; A = sum(net_area); reference amount = A / A = 1 m2; A must be positive."
      inputs:
        - accepted_clear_dimensions
        - noninsulated_deductions
        - visible_gap_check
        - compression_check
        - rejection_area
        - rework_status
        - acceptance_date
        - approver
        - cp_fit_area
      output: "A; accepted_insulation_service"
      source_ids: []
    - id: survey_area_calc
      applies_to: "supplied_frame_interface; prepared_frame_interface"
      rule: "survey_area = sum surveyed net cavity areas; ready_area = sum surveyed net cavity areas with accepted ready state; normalize each by A."
      inputs:
        - clear_width
        - clear_height
        - irregular_geometry_dimensions
        - noninsulatable_area
        - ready_state
        - cp_survey_area
        - A
      output: "survey_area / A; ready_area / A"
      source_ids: []
    - id: cut_stock_calc
      applies_to: "delivered_stone_wool; cut_reusable_exit"
      rule: "gross_slab_draw = opening_stock + receipts - closing_stock; cut_reusable_exit_mass = supplier_returns + external_handover; diagnostic_net_use = opening_stock + receipts - closing_stock - supplier_returns - external_handover. Returns and external handovers are mutually exclusive and excluded from closing stock. Physical gross input is not reduced again when reusable exits are output cards. Normalize gross_slab_draw and cut_reusable_exit_mass separately by A."
      inputs:
        - opening_stock
        - receipts
        - closing_stock
        - supplier_returns
        - external_handover
        - cp_cut_material
        - A
      output: "gross_slab_draw / A; cut_reusable_exit_mass / A; diagnostic_net_use"
      source_ids: []
    - id: cut_mass_calc
      applies_to: "cut_slabs_transfer; cut_wool_waste; cut_packaging_waste_film; cut_packaging_waste_board"
      rule: "Sum cut_piece_mass for wool_transfer_id into cut_transfer_mass; separately sum unusable wool plus cutting-owned captured dust into cut_waste_mass; separately sum discarded packaging by actual material into cut_packaging_mass. Normalize each sum by A; usable internal recuts are not new external input/output."
      inputs:
        - cut_piece_mass
        - wool_waste_mass
        - packaging_mass
        - wool_transfer_id
        - event_id
        - cp_cut_material
        - A
      output: "cut_transfer_mass / A; cut_waste_mass / A; cut_packaging_mass / A"
      source_ids: []
    - id: fit_feed_calc
      applies_to: "ready_frame_feed; cut_wool_feed"
      rule: "frame_feed_area = sum actual frame transfers; fit_feed_mass = sum actual cut-piece transfers; normalize each separately by A and reconcile each to the paired source card without fixing either to 1."
      inputs:
        - frame_feed_area
        - feed_mass
        - frame_transfer_id
        - wool_transfer_id
        - cp_fit_material
        - A
      output: "frame_feed_area / A; fit_feed_mass / A"
      source_ids: []
    - id: fit_exit_calc
      applies_to: "actual exchanges required by refine_retention_accessories; fit_reusable_exit; fit_wool_waste"
      rule: "accessory_mass = accessory_opening + accessory_receipts - accessory_closing - accessory_returns - accessory_external_handover, after actual instruction activation; fit_reusable_mass = sum external reusable exits; fit_waste_mass = sum unusable removals and fitting-owned captured cleanup residue. Normalize each by A; refitting within the lot is an internal loop and each removed portion has one disposition. accessory_returns and accessory_external_handover are mutually exclusive and neither includes accessory_closing; accessory_mass includes actual discarded accessory losses, recorded once through actual exchanges required by refine_fit_accessory_packaging_waste rather than subtracted again."
      inputs:
        - accessory_opening
        - accessory_receipts
        - accessory_closing
        - accessory_returns
        - accessory_external_handover
        - accessory_identity
        - accessory_instruction
        - removal_event
        - reuse_or_discard
        - fit_reusable_mass
        - fit_waste_mass
        - cp_fit_material
        - A
      output: "accessory_mass / A; fit_reusable_mass / A; fit_waste_mass / A"
      source_ids: []
    - id: electricity_calc
      applies_to: "survey_electricity; cutting_electricity; fitting_electricity"
      rule: "For each interval, meter_to_kWh_factor = 1 for kWh, 1/1000 for Wh and 1/3.6 for MJ; any other meter unit needs a documented conversion factor and conversion_evidence. corrected_energy = (meter_end - meter_start) * multiplier * meter_to_kWh_factor; derive allocation_share = this consumer weight / sum(all consumer weights) from consumer_weights and actual_runtime/observed_power or retain the documented direct submeter assignment. Under the weight method, sum(all consumer weights) must be positive; zero or unknown total weights or missing consumers require a data gap or another reviewed attribution basis, never 0/0 or automatic share 1. Direct submeters may use an explicit independent node assignment without undefined weight division. consumer_energy = corrected_energy * allocation_share; sum consumer_energy for the respective node into survey_energy, cut_energy or fit_energy and divide its numerator by A. All consumer shares, including outside-scope consumers, sum to one. Use direct submeter readings where available; measured runtime/power weights are fallback evidence, not additional energy."
      inputs:
        - meter_start
        - meter_end
        - meter_unit
        - multiplier
        - meter_to_kWh_factor
        - conversion_evidence
        - actual_runtime
        - observed_power
        - all_consumers
        - consumer_weights
        - allocation_share
        - cp_survey_energy
        - cp_cut_energy
        - cp_fit_energy
        - A
      output: "survey_energy / A; cut_energy / A; fit_energy / A"
      source_ids: []
    - id: release_calc
      applies_to: "actual exchanges required by refine_cut_airborne_particles; actual exchanges required by refine_fit_airborne_particles"
      rule: "For each independently identified substance/particle-size basis and actual release plane/air medium, calculate whole-event mass_kg = SUM(net_concentration_mg_per_m3_i * event_air_volume_m3_i * actual_uncaptured_fraction_i) / 1000000 over the complete disjoint event intervals i. Each event_air_volume_m3_i is the total air volume crossing that emission measurement plane for its interval, derived from supported total airflow and duration or an independently validated whole-event volume method; it is never merely the analytical sampled_air_volume. Concentration must represent that same full stream/time interval, with compatible temperature/pressure and wet/dry basis, substance/size definition and a documented background correction or justified nonapplicability. Retain sample volume as analytical QA only. Use actual_uncaptured_fraction_i = 1 only when evidence locates the concentration/volume at the actual uncaptured release plane after process capture; if measured before capture use only the evidenced same-event uncaptured fraction once. Do not correct post-capture measurements again or treat vacuum-collected waste as air release. Ambient/personal samples, a room volume, partial-period samples or a balance residual do not establish a whole-event emission; a sample volume may equal the event volume only if the actual emission-plane/full-stream/full-period coverage is demonstrated. For fugitive or nonuniform releases, alternatively retain a complete validated source-specific flux/dispersion or other event-total algorithm, its explicit activity coverage, factors and uncertainty; do not add alternative methods. Unknown or negative net concentration, missing intervals, undefined correction or unsupported extrapolation retains a method gap rather than zero or a fabricated emission. Sum actual event-total release masses by the same identity into cut_air_mass or fit_air_mass; these are raw kg for the matching material balance, then divide by A only at the final card. Each actual_uncaptured_fraction_i is a dimensionless evidenced fraction from 0 to 1; a missing or out-of-domain fraction is a method gap, not a clipped/default value."
      inputs:
        - "cp_cut_air or cp_fit_air at its owning node"
        - net_concentration_mg_per_m3_i
        - event_air_volume_m3_i
        - actual_uncaptured_fraction_i
        - concentration_interval_ids
        - "complete event coverage"
        - "matched concentration/volume basis"
        - "supported background/capture method"
        - "calibration and uncertainty"
        - "or validated source-specific event-total algorithm"
      output: "event-total mass_kg; cut_air_mass or fit_air_mass in raw kg before A normalization"
      source_ids: []
    - id: mass_conversion_calc
      applies_to: "delivered_stone_wool; cut_slabs_transfer; cut_wool_feed"
      rule: "Where actual weighing is unavailable, mass_kg = sum(actual piece volume derived in m3 from measured piece_dimensions or installed_piece_geometry * documented_density_kg_per_m3); retain dimensional records, offcut geometry, density source and uncertainty. Supplier pack mass is usable only for the actual declared grade and count."
      inputs:
        - piece_dimensions
        - installed_piece_geometry
        - grade
        - density_evidence
        - installed_density_evidence
        - documented_density_kg_per_m3
        - pack_mass
        - piece_count
        - cp_cut_material
        - cp_fit_material
      output: "material_mass_kg"
      source_ids: []
    - id: cut_balance_calc
      applies_to: "delivered_stone_wool; cut_slabs_transfer; cut_reusable_exit; cut_wool_waste; actual exchanges required by refine_cut_airborne_particles"
      rule: "Check gross_slab_draw + opening_cut_wip = cut_transfer_mass + cut_reusable_exit_mass + cut_waste_mass + cut_air_mass + closing_cut_wip + unexplained_difference. Opening/closing intact-slab stock is distinct from cut-piece WIP. Where direct release evidence is absent, retain unknown release/difference as a data gap rather than zero or exact closure. Resolve material differences against measurement uncertainty; internal recutting is not an additional external feed or exit."
      inputs:
        - gross_slab_draw
        - opening_cut_wip
        - cut_transfer_mass
        - cut_reusable_exit_mass
        - cut_waste_mass
        - cut_air_mass
        - closing_cut_wip
        - cp_cut_material
        - cp_cut_air
      output: "cutting_mass_balance; unexplained_difference"
      source_ids: []
    - id: fit_balance_calc
      applies_to: "cut_wool_feed; fit_reusable_exit; fit_wool_waste; actual exchanges required by refine_fit_airborne_particles"
      rule: "Check fit_feed_mass + opening_wool_wip = installed_wool_mass + fit_reusable_mass + fit_waste_mass + fit_air_mass + closing_wool_wip + unexplained_difference. installed_wool_mass includes only wool in finally accepted apertures, obtained by traceable actual weighing or installed piece geometry times documented same-grade density for that accepted portion; exclude accessories. closing_wool_wip includes installed wool in unaccepted or rejected apertures that has not yet been removed, plus other end-of-period wool awaiting work, and excludes installed_wool_mass and all already recorded exits; assign each physical portion to one mutually exclusive pool. Refitting loops do not add new feed. Where release evidence is absent, retain unknown release/difference as a gap rather than claiming exact closure or zero."
      inputs:
        - fit_feed_mass
        - opening_wool_wip
        - installed_wool_mass
        - installed_piece_geometry
        - installed_density_evidence
        - fit_reusable_mass
        - fit_waste_mass
        - fit_air_mass
        - closing_wool_wip
        - cp_fit_material
        - cp_fit_air
        - aperture_id
        - final_acceptance_record
        - installed_acceptance_status
      output: "fitting_mass_balance; unexplained_difference"
      source_ids: []
    - id: shared_service_calc
      applies_to: "survey_shared_access_service_platform; survey_shared_access_service_scaffold; cut_shared_access_service_platform; cut_shared_access_service_scaffold; fit_shared_access_service_platform; fit_shared_access_service_scaffold"
      rule: "For each actual asset contract period, availability_hours = documented billed quantity times its traceable h conversion, or elapsed contracted seconds / 3600; never assume a working day equals 8 h. Compute each beneficiary weight from recorded actual use/activity on a declared basis; allocation_share = beneficiary weight / sum(all beneficiary weights). If all weights are zero or beneficiaries unknown, document another reviewed attribution basis or retain a data gap. Include outside-scope beneficiaries and assign unused availability burden explicitly. Node shared_hours = sum(availability_hours * allocation_share); normalize each node numerator by A. Supplier-included energy, setup/removal, maintenance or capital burden must not be added twice."
      inputs:
        - actual_equipment_identity
        - supplier_contract
        - time_basis
        - availability_start
        - availability_end
        - billed_quantity
        - billed_unit
        - documented_time_conversion
        - all_consumers
        - consumer_activity_records
        - weights
        - allocation_share
        - energy_inclusions
        - capital_and_maintenance_inclusions
        - setup_removal_owner
        - cp_survey_shared_service
        - cp_cut_shared_service
        - cp_fit_shared_service
        - A
      output: "survey_shared_hours / A; cut_shared_hours / A; fit_shared_hours / A"
      source_ids: []
  data_quality_requirements:
    - id: identity_fit
      applies_to: "all product and waste rows"
      requirement: "Verify actual material/state/destination identities before final dataset exchanges; a generic wool, asbestos-labelled translation or manufactured slab flow cannot represent the installation service. Material umbrellas require actual resolved exchanges."
      evidence: "Product delivery sheets; selected-system instructions; actual identity verification"
    - id: geometry_quality
      applies_to: "accepted area and transfers"
      requirement: "Same lot and cavity ids connect surveyed ready geometry, actual frame handoff and final accepted area; no frame member, duplicate face, rejected work or purchased slab area in A."
      evidence: "cp_survey_area; cp_fit_material; cp_fit_area"
    - id: material_reconciliation
      applies_to: "slab cutting and fitting"
      requirement: "Reconcile gross slab draw to cut transfers, reusable exits, wool waste and supported direct release, with WIP and measurement uncertainty; fitting feed reconciles to incorporated wool, WIP, reusable exits, waste and releases. Installed mass is an actual weighing or declared dimension-density diagnostic, not an added service output."
      evidence: "Stock and transfer ledger; piece geometry/density records; receiver receipts"
    - id: complete_period
      applies_to: "all nodes"
      requirement: "Cover the entire named lot from starting survey to final cleanup, including failed cuts, fitting rework, changeovers and all relevant receipts/stock changes. Disclose missing events, imputed quantities and uncertainty."
      evidence: "Timestamped node records and acceptance chronology"
    - id: shared_ownership
      applies_to: "shared electricity and cleanup"
      requirement: "Retain interval start/end, all consumers, weights, shares, ownership and bill inclusion. Record each physical event once even when multiple nodes reference its evidence."
      evidence: "Node meters; shared-event ledger; full consumer reconciliation"
    - id: provisional_range_use
      applies_to: "all screening ranges"
      requirement: "Provisional reasoned screens are neither default inventory values nor factual bounds, performance thresholds or automatic acceptance/rejection criteria. Investigate outliers against raw records; establish empirical guardrails from independent reviewed lots."
      evidence: "Explicit range metadata; external or independently reviewed future reference sample"
    - id: refine_survey_shared_access_service
      applies_to: "survey_shared_access_service_platform; survey_shared_access_service_scaffold"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional supplied shared equipment/access service, actual asset and service contract resolved from foreground records. Only when an actual rented or externally supplied access/equipment service is used by this node; actual service type and included energy/capital responsibilities must be declared. The time basis is contracted availability, not assumed active tool time. Resolve each actual service and supplier dataset before final exchanges; no universal platform/scaffold identity is asserted. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other rented-equipment functions and actual different native references require exact complete service identity/property/unit and original all-beneficiary allocation; no default platform/scaffold occurrence."
      evidence: "cp_survey_shared_service; actual independent records and identity/unit evidence"
    - id: refine_cut_shared_access_service
      applies_to: "cut_shared_access_service_platform; cut_shared_access_service_scaffold"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional supplied shared equipment/access service, actual asset and service contract resolved from foreground records. Only when an actual rented or externally supplied access/equipment service is used by this node; actual service type and included energy/capital responsibilities must be declared. The time basis is contracted availability, not assumed active tool time. Resolve each actual service and supplier dataset before final exchanges; no universal platform/scaffold identity is asserted. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other rented-equipment functions and actual different native references require exact complete service identity/property/unit and original all-beneficiary allocation; no default platform/scaffold occurrence."
      evidence: "cp_cut_shared_service; actual independent records and identity/unit evidence"
    - id: refine_cut_packaging_waste
      applies_to: "cut_packaging_waste_film; cut_packaging_waste_board"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional material-resolved packaging waste umbrella. State: Actual film, board or other packaging separated without wool double counting. Destination: Actual waste receiver by material and treatment route. Condition: Only actual discarded packaging; retained returnable packaging remains stock. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual other materials/mixed packaging/contamination/receiver streams need independent exact records; do not copy mixed total or wool included mass. Retained returnable packaging stays stock."
      evidence: "cp_cut_material; actual independent records and identity/unit evidence"
    - id: refine_cut_airborne_particles
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional direct release umbrella. State: Measured species or mineral composition, particle-size basis and air receiving medium. Destination: Air compartment actually reported. Condition: Only independently quantified direct releases with substance or mineral composition, particle size and receiving medium evidence. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_cut_air; actual independent records and identity/unit evidence"
    - id: refine_retention_accessories
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional actual material-resolved accessory umbrella. State: Actual accessory chemistry, form and fastening role recorded. Destination: Retained insulation assembly. Condition: Only when the selected slab/system instructions and actual installation require retention; never presumed for ordinary friction fitting. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Only actual selected slab/system instructions and real installation activate specific accessory SKU/function/oneunit; retain stock/outward usable returns/losses without double subtraction."
      evidence: "cp_fit_material; actual independent records and identity/unit evidence"
    - id: refine_fit_shared_access_service
      applies_to: "fit_shared_access_service_platform; fit_shared_access_service_scaffold"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional supplied shared equipment/access service, actual asset and service contract resolved from foreground records. Only when an actual rented or externally supplied access/equipment service is used by this node; actual service type and included energy/capital responsibilities must be declared. The time basis is contracted availability, not assumed active tool time. Resolve each actual service and supplier dataset before final exchanges; no universal platform/scaffold identity is asserted. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other rented-equipment functions and actual different native references require exact complete service identity/property/unit and original all-beneficiary allocation; no default platform/scaffold occurrence."
      evidence: "cp_fit_shared_service; actual independent records and identity/unit evidence"
    - id: refine_fit_accessory_packaging_waste
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Only when actual retention accessories or their packaging produce discarded material. Separate each actual accessory composition and packaging material with mass, custodian and destination; reusable returns and closing stock are excluded. This conditional umbrella excludes wool waste and direct environmental release. Actual accessory and packaging composition/state remain unknown; expand material-resolved exchanges before publication. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual separate accessory whole product/contaminated composite and packaging material/receiver quantities under fitting owner, excluding wool waste, usable return, stock and direct environmental release."
      evidence: "cp_fit_material; actual independent records and identity/unit evidence"
    - id: refine_fit_airborne_particles
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional direct release umbrella. State: Measured species or mineral composition, particle-size basis and air receiving medium. Destination: Air compartment actually reported. Condition: Only independently quantified direct releases with substance or mineral composition, particle size and receiving medium evidence. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_fit_air; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: quality_whole_event_release
      applies_to: "cp_cut_air; cp_fit_air; release_calc; cut_balance_calc; fit_balance_calc"
      requirement: "Whole-event air-release mass requires release_calc coverage and method evidence at the actual release plane: representative concentration, compatible complete-event volume/time basis, justified background/capture treatment and independently supported uncertainty. A complete set of sample concentration/volume fields alone is insufficient. Missing total-flow or validated extrapolation leaves air-release quantity and the affected material closure incomplete, never zero or assumed vapour/dust."
      evidence: "Actual emission-plane and complete-event interval register; calibrated volume/concentration measurements or validated event-total model; uncertainty and correction evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
validation_rules:
  - rule_id: service_gate
    applies_to: "reference product"
