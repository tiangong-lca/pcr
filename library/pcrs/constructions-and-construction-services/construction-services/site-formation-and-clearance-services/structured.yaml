product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.site-formation-and-clearance-services"
  classification_refs: "CPC 3.0 54320; proposed narrower relation"
  covered_products: "Accepted first battery electric above-ground low-vegetation construction-site clearance with collection and residual custody transfer"
  excluded_products: "Recurring mowing; crop harvest; woody clearance/grubbing; earthworks; biological production; biomass coproduct production"
  representative_product: "Accepted battery-powered herbaceous vegetation construction-site clearance service"
  production_route: "Approved polygon and protection interfaces → compatible battery cutting → collection/staging → declared residual receiver transfer → closed defects and signed clearance-stage acceptance"
  market_state: "Accepted clearance-only service; roots/soil retained; subsequent construction and receiver treatment remain separately declared"
functional_unit:
  what: "Accepted construction-site grass/herbaceous above-ground clearance service"
  how_much: "1 m2 of actual accepted horizontal clearing polygon, counted once"
  how_well: "Actual specified cut height and collection state; protected vegetation intact or remedied; receiver custody and defects closed; no excavation-ready ground claim"
  how_long_or_cycle: "One initial clearance cycle through rework, collection, protection termination and receiver transfer; asset burdens additionally span explicit manufacture, use/maintenance/replacement and terminal-treatment periods across all consumer jobs"
  reference_flow_link: "accepted_clearance"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers first preconstruction above-ground cutting of grass and nonwoody herbaceous vegetation compatible with the actual approved battery electric handheld grass blade or trimmer, followed by collection and declared residual receiver transfer. The actual site contract, protected limits, utilities/access and erosion-control responsibility must permit this route. The cited roadwork specification supplies boundary distinctions; its broad clearing-and-grubbing scope and numeric stump rules are not grass-cutting requirements. Exclude recurring landscape mowing, crop harvesting, woody brush/trees, stump/root grubbing, soil stripping/excavation/grading/drainage/blasting, onsite chipping/burning/herbicide, vegetation cultivation, receiver treatment operation and claims of saleable biomass co-production. A proposed beneficial biomass product requires an explicit additional coproduct/boundary review before this method is used for that claim."
      source_ids: []
    - rule_id: limits_gate
      applies_to: "clearance"
      rule: "Start only inside approved clearing limits with actual vegetation protection and erosion/access/utility responsibility recorded; remedy clearance-caused damage with its actual burdens. The clearance gate cannot certify completion of all erosion controls."
      source_ids:
        - fhwa-fp24-201
    - rule_id: cut_collect_gate
      applies_to: "clearance"
      rule: "Keep cutting and collection within one independent source-removal responsibility ending in accepted polygon and residual custody transfer. Later grubbing, earthwork and receiver treatment have distinct boundaries."
      source_ids:
        - fhwa-fp24-201
        - husqvarna-520irx-2024
    - rule_id: complete_assets
      applies_to: "clearance"
      rule: "Include actual charging, cutter/battery/charger/tools, logistics, materials, rejected work and protection maintenance/removal attributable to the complete clearance cycle. Record every asset consumer and service period, including other jobs; supplier coverage prevents duplicate burdens. Enumerate manufacture/provision, each use/maintenance/replacement reporting period and terminal-treatment phase. Link every asset input/event to its actual period and the lot output to its clearance acceptance period; missing replacement/termination responsibility blocks final burden finalization."
      source_ids: []
    - rule_id: no_crop_credit
      applies_to: "clearance"
      rule: "Existing vegetation carries no invented cultivation inputs, avoided-production credit, sequestration claim or saleable coproduct assumption. Report actual wet residual status; proposed useful-product claims require separate review."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Existing approved construction-site low vegetation; no root/soil removal; access, utility and protected-vegetation interfaces established"
  starting_condition_role: "Environmental starting stock and site condition; not purchased crop input and no invented cultivation burden"
  product_classification_scope: "Only this narrower clearance service within CPC 54320; no expansion from classification alone"
  recursive_input_rule: "An outsourced same-category clearance input carries its upstream service dataset and explicit area/work ids; remove those activities from own foreground records and count accepted polygon once. Do not recurse through site ownership or vegetation stock."
  upstream_dataset_requirement: "Supplier datasets for actual electricity, assets, materials and freight with technology, geography, period and included-burden boundaries; downstream residual treatment coverage declared separately"
  disclosure: "Actual cut/collection contract, source vegetation and residual status; work ids and rejected areas; assets/consumers/periods; supplier coverage; protection maintenance/termination ownership; gaps and uncertainty"
