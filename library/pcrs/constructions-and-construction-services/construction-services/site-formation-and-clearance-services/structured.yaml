    reference: "FHWA FP-24 (2024), Section 201, printed pp.95–96; https://highways.fhwa.dot.gov/federal-lands/specs/fp-24.pdf"
    used_for: "Approved limits, retained vegetation, clearing versus grubbing, acceptance and residual disposal; project applicability must be declared"
  - id: "fhwa-fp24-errata-20260915"
    type: "official_guidance"
    reference: "FHWA FP-24 Errata, 15 September 2026; https://highways.dot.gov/federal-lands/specs/Errata-FP-24.pdf"
    used_for: "Applicable current amendment edition and version context; actual contract amendments govern"
  - id: "husqvarna-520irx-2024"
    type: "handbook"
    reference: "Husqvarna 520iRX operator manual 757-009-31.05.2024, printed pp.2,18–20,24; https://content.tdr.dss.husqvarnagroup.net/pub000093932/doc000239287"
    used_for: "Battery electric grass cutting and collection route, approved equipment and actual maintenance; not a universal productivity or cut-height factor"
