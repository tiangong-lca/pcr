allocation_rules:
  - rule_id: service_burden
    applies_to: "clearance"
    rule: "Attribute all actual first-cycle burdens, including failed cut height, incomplete collection, damage repair and recutting, to accepted service. Unaccepted areas are tracked as work-in-progress/rejects and never included in the accepted denominator; unresolved defects block their output."
    source_ids: []
  - rule_id: residual_status
    applies_to: "biomass_residual"
    rule: "Cut vegetation is residual, with measured custody and actual destination. Do not allocate a coproduct credit or substitute fuel/feed/fertilizer by assumption. A useful-product claim requires separate explicit review."
    source_ids: []
  - rule_id: asset_sharing
    applies_to: "reusable_asset_provision_cutter; reusable_asset_provision_separate_battery; reusable_asset_provision_separate_charger; reusable_asset_provision_reusable_blade"
    rule: "For each cutter, battery, charger, collection tool and reusable protection asset, record manufacture, maintenance, replacement and end-of-life boundary and evidenced complete-life service. Allocate actual lot usage among cutting, collection and rework and all other consumer jobs/periods with one ledger owner; preserve unused future burden and quantify uncertainty. For each asset retain manufacture/provision, use/maintenance/replacement periods, terminal treatment and all consumer-job links in one phase/period ledger. Apply evidenced life-service shares to each period-specific burden and this clearance output; carry unconsumed future burden forward, disclose replacement/termination assumptions and uncertainty, and block finalization if their ownership is unknown. No arbitrary fixed life or equal job split. Supplier rental provision and separate asset production cannot cover the same burden twice."
    source_ids: []
  - rule_id: stock_returns
    applies_to: "cutting_consumables_line; cutting_consumables_replacement_blade; protection_consumables_collection_bag; unused_material_returns_line; unused_material_returns_replacement_blade; unused_material_returns_collection_bag; other_residuals_line; other_residuals_blade"
    rule: "Reconcile gross opening stock plus receipts with consumption, real outward returns, waste and retained closing stock by material and custody. Retained stock carries declared future burden and is no output. Use gross actual lot-attributable boundary input, with real outward unused-product returns recorded gross and carrying only their traceable matching input burden. Do not net a return out of the input. Retained closing stock is a nonexchange balance with carried-forward burden, allocated outside this completed service; reconcile gross inputs, current use/waste, returns and closing stock without creating a stock output."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "clearance"
      flow_role: "accepted service"
      record_type: "survey and signed handover"
      raw_fields: "lot_id; polygon_id; approved_boundary; exclusions; retained_islands; accepted_area_m2; survey_uncertainty; vegetation_species; density; moisture; slope; attachment; cut_height_spec; collection_state; defect_id; receiver_ticket; acceptance_time"
      collection_method: "Survey actual horizontal cleared polygon with traceable coordinate method; overlay approved limits, plan exclusions and retained islands. Retain actual quality specification, before/after evidence, rework pass ids and signed accepted subareas. Use same accepted area for each burden allocation; carry unaccepted area separately."
      unit: "m2"
      frequency: "each accepted polygon and correction"
      temporal_coverage: "complete initial clearance through custody closure"
      site_scope: "actual approved site polygon"
      aggregation_rule: "per reference flow"
      quality_evidence: "Survey calibration/coordinate reference, polygon union without overlap, acceptance authority and closed-defect records"
    - protocol_id: cp_energy
      process_id: "clearance"
      flow_role: "charging_electricity"
      record_type: "meter and charging ledger"
      raw_fields: "lot_id; charger_id; meter_id; start_kwh; end_kwh; charge_time; standby_kwh; battery_id; consumer_job; accepted_area_m2"
      collection_method: "Meter charger-supply electricity by event; allocate shared charging to identified battery/lot with actual energy evidence. Include attributable charge losses, standby and rework; reconcile meter total across jobs and divide attributed lot energy by accepted area from cp_acceptance."
      unit: "kWh"
      frequency: "each charge and lot closure"
      temporal_coverage: "all actual charging for first cycle"
      site_scope: "site or offsite charger tied to lot"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter accuracy, provider/geography/date and reconciliation; no capacity-only inference"
    - protocol_id: cp_assets
      process_id: "clearance"
      flow_role: "reusable_asset_provision_cutter; reusable_asset_provision_separate_battery; reusable_asset_provision_separate_charger; reusable_asset_provision_reusable_blade"
      record_type: "asset life-service ledger"
      raw_fields: "asset_id; manufacturer; model; production_boundary; provision_count; manufacture_period; use_period; maintenance_period; replacement_period; terminal_period; maintenance; replacement; terminal_treatment; service_life_basis; usage_lot; consumer_job; period; accepted_area_m2; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty; job_driver; full_life_driver; driver_unit; all_consumer_ids; all_consumer_period_ids; observed_life_driver; evidenced_remaining_driver; complete_asset_packet_id; included_battery_or_charger; measurement_uncertainty"
      collection_method: "Record each concrete asset separately. Document complete-life provision and maintenance/end-of-life responsibilities, observed usage on cutting/collection/rework and all other jobs/periods. Attribute each asset burden using evidenced consumed service share and normalize lot share by accepted area; retain unconsumed future balance and uncertainty. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion. For each exact serial complete-life packet, use compatible actual job_driver and full_life_driver across every consumer/period, with observed history and evidenced remainder. The final asset Count fraction is divided by accepted_area_m2 once. Record cutter packet battery/charger/blade inclusions; separate components only outside that packet. Missing complete denominator/termination ownership blocks completion."
      unit: "Item(s)"
      frequency: "each use plus maintenance/retirement update"
      temporal_coverage: "manufacture/provision; each use/maintenance/replacement reporting period; terminal treatment; actual clearance acceptance cycle"
      site_scope: "all consumers of each asset"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset ids, meter/hour/cycle evidence as driver without inventing Duration UUID; rental included coverage and sum of shares/burdens reconciled"
    - protocol_id: cp_material
      process_id: "clearance"
      flow_role: "materials returns and other waste"
      record_type: "custody stock and scales"
      raw_fields: "lot_id; material_id; supplier_coverage; opening_stock; gross_receipts; gross_issues; consumed_mass; outward_return; closing_stock; waste_mass; tare; receiver; uncertainty; accepted_area_m2; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id"
      collection_method: "Weigh and reconcile each actual material from gross receipt/issue through consumption, return, closing stock and waste. Track consumables, protection, bags and packaging separately; link outward custody tickets and one burden owner. Record gross actual lot-attributable material boundary input without netting outward returns. Match each real gross return output to its input identity and traceable burden; retain closing stock as a nonexchange balance with burden carried to future work. Attribute current-service consumed and waste responsibility without double credit, and divide each current lot exchange by accepted area. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "each custody/issue event and lot closure"
      temporal_coverage: "complete cycle including protection maintenance/termination"
      site_scope: "lot and real supplier/receiver interfaces"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scale/tare, documented stock adjustment, signed return/waste tickets and no duplicate provider coverage"
    - protocol_id: cp_logistics
      process_id: "clearance"
      flow_role: "freight_services"
      record_type: "actual trip and provider record"
      raw_fields: "trip_id; lot_id; provider; vehicle; payload_kg; route_km; origin; destination; empty_return; shared_load; included_fuel; accepted_area_m2"
      collection_method: "Collect actual payload and distance per leg; use tonne-kilometres for each actual loaded movement with traceable kg-to-tonne conversion. Document empty-return and shared-load attribution from provider operation, assign one owner and avoid duplicate provider fuel/capital burdens; divide lot-attributed service by accepted area."
      unit: "t*km"
      frequency: "each trip leg"
      temporal_coverage: "all equipment/material/residual transport for cycle"
      site_scope: "actual origin-site-receiver routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Payload/route tickets, coverage of empty returns, allocation evidence and exact future transport support verification"
    - protocol_id: cp_residual
      process_id: "clearance"
      flow_role: "biomass_residual"
      record_type: "weighing moisture and custody"
      raw_fields: "lot_id; transfer_id; wet_gross_kg; container_tare_kg; wet_net_kg; moisture_method; moisture_date; contaminant; staging_opening; staging_closing; receiver; product_or_waste_status; accepted_area_m2"
      collection_method: "Weigh net wet biomass dispatched to actual declared receiver and collect representative moisture evidence. Reconcile all collections and staging balances to custody tickets, including recut material and any residual left on site contrary to specification; receiver rejection returns to clearance responsibility until resolved. Divide attributable net transfer by accepted area."
      unit: "kg"
      frequency: "each load and lot closure"
      temporal_coverage: "cutting through accepted receiver custody"
      site_scope: "site staging and actual receiver gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale/tare, moisture sampling coverage, signed status/custody, mass-balance uncertainty and rejection closure"
    - protocol_id: cp_releases
      process_id: "clearance"
      flow_role: "actual exchanges required by refine_characterized_releases"
      record_type: "substance monitoring or applicable method"
      raw_fields: "lot_id; substance; particle_size; medium; measured_mass; detection_limit; method; applicability; uncertainty; accepted_area_m2; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id"
      collection_method: "Identify actual substance and receiving medium before exchange selection; retain monitoring coverage, detection limits or reviewed applicable factor activity and uncertainty. Separate waste from environmental release, include all repeated work and normalize attributable substance mass by accepted area; do not invent combustion emissions. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "each monitored event or reviewed assessment"
      temporal_coverage: "whole first cycle"
      site_scope: "actual release location and medium"
      aggregation_rule: "per reference flow"
      quality_evidence: "Traceable substance/species characterization, factor applicability and reported unmeasured coverage gaps"
    - protocol_id: cp_remedy
      process_id: "clearance"
      flow_role: "damage_remedy_service"
      record_type: "incident remedy provider and acceptance"
      raw_fields: "lot_id; incident_id; provider; remedy_scope; job_count; included_materials; included_energy; included_assets; included_transport; acceptance_date; accepted_area_m2"
      collection_method: "Record each actual clearance-caused damage incident and accepted remedy job with provider primary inventory and included services/materials. Attribute to the causing lot regardless of later remedy date; link period and accepted remedy evidence. Reconcile with directly recorded protection materials, charging, assets and freight to remove overlaps; divide actual job burden by accepted clearance area."
      unit: "Item(s)"
      frequency: "each incident and signed remedy closure"
      temporal_coverage: "causing clearance period through actual remedy completion"
      site_scope: "actual affected vegetation/site interface and provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "No-damage inspection or complete incident/remedy ledger; provider coverage and closed acceptance without duplicate direct input"
  calculation_rules:
    - id: area_attribution
      applies_to: "all inventory rows"
      rule: "Attribute each measured complete-lot exchange to its owning clearance lot and divide by the same accepted horizontal polygon area from cp_acceptance; retain original numerator unit. Accepted output remains 1 m2. Rework adds burden and never adds denominator area."
      inputs:
        - cp_acceptance
        - "node-specific collection protocol"
      output: "inventory per 1 m2 accepted service"
      source_ids: []
    - id: stock_reconcile
      applies_to: "cutting_consumables_line; cutting_consumables_replacement_blade; protection_consumables_collection_bag; unused_material_returns_line; unused_material_returns_replacement_blade; unused_material_returns_collection_bag; other_residuals_line; other_residuals_blade"
      rule: "For each material and custody scope reconcile opening stock plus gross receipts against consumption plus real outward returns plus closing stock plus waste; document any overlap between measured consumption and downstream waste before applying the balance. Gross issues are an internal ledger, not a second boundary input. Use gross boundary receipts/opening-stock issues as input and genuine gross outward return as product output without input netting; closing stock remains a nonexchange balance and its burden is carried forward."
      inputs:
        - cp_material
      output: "reconciled quantity and carried-forward stock burden"
      source_ids: []
  data_quality_requirements:
    - id: identity_gate
      applies_to: "all rows"
      requirement: "Verify concrete identity, state, provider, flow type, property/unit and destination from actual records before final TIDAS exchange binding. Umbrellas instantiate zero or multiple specific exchanges; unknown identities and support remain explicit gaps."
      evidence: "Supplier data, identity detail and property/unit-group evidence"
    - id: same_lot_basis
      applies_to: "all rows"
      requirement: "Keep polygon, date, actual vegetation and work ids identical across numerator and denominator; rejected area and later maintenance remain separately recorded. Report survey/meter/weighing and allocation uncertainty and missing coverage."
      evidence: "cp_acceptance and complete node ledgers"
    - id: custody_quality
      applies_to: "biomass_residual; other_residuals_line; other_residuals_blade"
      requirement: "Document actual receiver status and downstream treatment responsibility. No estimated wet-to-dry/area-to-mass factor or unverified product-versus-waste claim. Resolve receiver rejection and remaining onsite residual before acceptance."
      evidence: "cp_residual; cp_material"
    - id: source_limits
      applies_to: "clearance"
      requirement: "Confirm actual project contract and current applicable equipment instructions; neither FHWA roadwork scope nor manufacturer example supplies universal cut height, productivity, emission or wear factors."
      evidence: "fhwa-fp24-201; fhwa-fp24-errata-20260915; husqvarna-520irx-2024"
    - id: refine_reusable_asset_provision
      applies_to: "reusable_asset_provision_cutter; reusable_asset_provision_separate_battery; reusable_asset_provision_separate_charger; reusable_asset_provision_reusable_blade"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Instantiate a separate concrete exchange for each asset and model production, maintenance and terminal treatment across its complete evidenced service life. This umbrella does not merge heterogeneous equipment into one item. Range evidence need: Need asset-specific lifetime service, replacement/repair records and allocation uncertainty; no default life or battery-cycle count. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual collection-tool and reusable-protection asset functions/models and other native service references require concrete full-life identity/property/unit, all consumers/periods and replacement/termination ownership."
      evidence: "cp_assets; actual independent records and identity/unit evidence"
    - id: refine_cutting_consumables
      applies_to: "cutting_consumables_line; cutting_consumables_replacement_blade"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Instantiate documented line, blade replacement or sharpening consumables and dry cleanup materials separately. Intact reusable blade belongs in asset provision; never invent line use for a blade route. Range evidence need: Need actual material identity, issue/use/wear measurements and uncertainty; no general blade wear or line-loss percentage. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual sharpening products and dry-cleanup material identities/functions require independent exact records; no universal attachment coefficient or wear-to-air inference."
      evidence: "cp_material; actual independent records and identity/unit evidence"
    - id: refine_protection_consumables
      applies_to: "protection_consumables_collection_bag"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Include actual temporary protection, collection bags and protective/cleanup consumables attributable to clearance, including maintenance and removal responsibilities. Actual clearance-caused damage-remedy materials are included here when measured directly; provider-included material is covered by damage_remedy_service and must not be duplicated. Long-lived protection is an asset, and supplier-included materials receive no second upstream burden. Range evidence need: Need project-specific protected-boundary plan, material quantities, reuse/termination evidence and uncertainty; no standard kg per m2. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual temporary-protection, other cleanup/disposable and directly modelled damage-remedy product functions/SKUs require independent identities/units and maintenance/removal responsibilities. Long-lived protection asset-owned; remedy provider included materials not direct supply again."
      evidence: "cp_material; actual independent records and identity/unit evidence"
    - id: refine_unused_material_returns
      applies_to: "unused_material_returns_line; unused_material_returns_replacement_blade; unused_material_returns_collection_bag"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Instantiate only real supplier or owner return transfers of unused consumables with matching inbound identity and burden. Retained site stock remains a balance, never an outward product exchange. Range evidence need: Need traceable gross issue/receipt and signed outward return weights; no assumed return fraction. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual unused consumable products require original SKU/native unit/recipient and linked supply burden; retained stock not outward exit."
      evidence: "cp_material; actual independent records and identity/unit evidence"
    - id: refine_other_residuals
      applies_to: "other_residuals_line; other_residuals_blade"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Separate each actual waste by material, hazardous status and receiving route; keep rejected attachment and packaging distinct from vegetation. Asset end-of-life already included in asset provision is not counted again here. Range evidence need: Need material-specific weighed waste and receiver evidence; do not assign blanket packaging or reject rate. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual packaging, contaminated collection bags, cleanup articles and other waste material/hazard/receiver streams need actual roster; keep vegetation separately and unknown wear as gap, not air."
      evidence: "cp_material; actual independent records and identity/unit evidence"
    - id: refine_characterized_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Create concrete exchanges only for measured or justified characterized substances, particle size where relevant and actual receiving medium. No direct cutter combustion, methane, aggregate VOC or generic dust is presumed from an electric route; unmeasured material wear remains a quantified data gap rather than automatic air emission. Range evidence need: Need actual substance/species, medium, monitoring or reviewed factor and uncertainty; no source-backed generic emission range established. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_releases; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator retains original configuration strata, accepted state/gate and actual causal attribution; no unlike jobs/branches/routes treated as equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
validation_rules:
  - rule_id: accepted_gate_check
    applies_to: "accepted_clearance"
    rule: "Require approved compatible route, specified cut/collection state, closed damage/recut defects, declared residual custody and signed accepted polygon; reject woody/grubbing/earthwork or useful-biomass claims outside this scope."
    source_ids:
      - fhwa-fp24-201
      - husqvarna-520irx-2024
  - rule_id: area_check
    applies_to: "all rows"
    rule: "Confirm 1 m2 reference output and same accepted horizontal polygon denominator; no duplicate overlap, retained-island substitution or rework pass area. Missing accepted area/quality makes the lot incomplete."
    source_ids: []
  - rule_id: material_custody_check
    applies_to: "all rows"
    rule: "Reconcile stocks, real returns, waste and biomass receiver tickets with uncertainty; retained stock cannot be an exported product and gross-net return conventions cannot both credit the same quantity."
    source_ids: []
  - rule_id: asset_coverage_check
    applies_to: "reusable_asset_provision_cutter; reusable_asset_provision_separate_battery; reusable_asset_provision_separate_charger; reusable_asset_provision_reusable_blade; charging_electricity; freight_services"
    rule: "Require asset consumers/periods and complete production/maintenance/end-of-life responsibility, electricity supply meter and actual freight/provider boundary. Check shares and included burdens once; no invented life, capacity-derived charging or default transport factors. Check manufacture/use/maintenance/replacement/termination period links and period-specific shares; unresolved replacement or termination ownership blocks final burden finalization."
    source_ids: []
  - rule_id: identity_release_check
    applies_to: "all rows"
    rule: "Before exchange construction verify each actual UUID and support, resolve actual product-versus-waste/substance-medium status, and report remaining Range/identity/support evidence gaps. No near-match reference service, crop harvest or unspecified electricity identity is acceptable."
    source_ids: []
