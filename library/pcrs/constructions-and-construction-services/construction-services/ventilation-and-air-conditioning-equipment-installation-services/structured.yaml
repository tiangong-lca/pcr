      collection_method: "Reconcile delivery, issue, installation and return records; weigh actual components or retain traceable supplier conversion; split each material identity and gate. Aggregation and attribution method: Attributable quantities per reference flow; separately retain issued, installed, returned and discarded quantities. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "Item(s); kg; declared source units"
      frequency: "Each installation or attributable job event"
      temporal_coverage: "Full installation campaign including corrections and retests"
      site_scope: "Declared installation site and job cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Receipts, stock movements, scale calibration, product sheets, conversion evidence and supplier return record"
    - protocol_id: cp_energy
      process_id: "fan_installation"
      flow_role: "Task electricity and actual conditional site fuel"
      record_type: "Meter, activity and allocation records"
      raw_fields: "job_id; device; task; meter_start; meter_end; electricity_kWh; measured_power; runtime; fuel_identity; fuel_mass; fuel_volume; density; conversion_conditions; activity_driver; job_total; allocated_share; tool_capital_policy; resource_event_id; consumer_node_or_job; service_period; allocation_denominator; allocation_rationale; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Meter actual drilling/dust collection/charging/testing where possible; retain measured-power/runtime estimates and fuel records, allocation across all consumers and uncertainty. Aggregation and attribution method: Attributable task energy and fuel per reference flow; reconcile whole-job totals and disclose exclusions. For each shared resource event enumerate every actual consuming node/job and relevant period; retain allocation denominator, rationale and evidence and reconcile all shares. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kWh; kg; declared source units"
      frequency: "Each installation or attributable job event"
      temporal_coverage: "Full installation campaign including corrections and retests"
      site_scope: "Declared installation site and job cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, timestamps, equipment log, fuel receipts, density reference and allocation reconciliation"
    - protocol_id: cp_transport
      process_id: "fan_installation"
      flow_role: "Attributable delivery, return and crew transport"
      record_type: "Route and consignment records"
      raw_fields: "job_id; leg_id; service_type; carried_mass; distance; vehicle; actual_service_unit; consumer_list; allocation_driver; upstream_delivery_coverage; return_leg; resource_event_id; consumer_node_or_job; service_period; allocation_denominator; allocation_rationale"
      collection_method: "Collect actual origin/destination, mass and route by leg. Document mass-distance freight calculation and actual-unit crew transport separately; reconcile shared legs and upstream coverage. Aggregation and attribution method: Attributable transport per reference flow; no duplicate upstream and own-transport energy. For each shared resource event enumerate every actual consuming node/job and relevant period; retain allocation denominator, rationale and evidence and reconcile all shares."
      unit: "t*km; actual service unit"
      frequency: "Each installation or attributable job event"
      temporal_coverage: "Full installation campaign including corrections and retests"
      site_scope: "Declared installation site and job cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Consignment record, route evidence, vehicle/service dataset and allocation worksheet"
    - protocol_id: cp_waste
      process_id: "fan_installation"
      flow_role: "Packaging, captured debris and rejected materials"
      record_type: "Segregated weighing and destination records"
      raw_fields: "job_id; material; source_card; waste_mass; reused_mass; hole_count; hole_diameter; hole_depth; substrate; drilling_state; collection_method; destination; treatment; defect; transfer_id; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Weigh separated material; inspect preprepared holes or actual drilling records; reconcile captured and uncollected fractions with emissions assessment and receipt at collection gate. Aggregation and attribution method: Separated attributable waste per reference flow, with actual recovery/disposal route and no automatic credit. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "Each installation or attributable job event"
      temporal_coverage: "Full installation campaign including corrections and retests"
      site_scope: "Declared installation site and job cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale calibration, hole/cleanup record, collection ticket and destination evidence"
    - protocol_id: cp_emissions
      process_id: "fan_installation"
      flow_role: "Conditional actual direct releases"
      record_type: "Measurement or defensible activity/factor records"
      raw_fields: "job_id; activity; pollutant; species; particle_size_basis; receiving_medium; emission_mass; control; measurement_method; activity_amount; factor_value; factor_unit; factor_source; uncertainty; capture_fraction; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id"
      collection_method: "Establish actual substance and medium before binding; measure or apply an activity-specific defensible factor with retained source and uncertainty. Distinguish collected solids from release; document absence or unresolved evidence. Aggregation and attribution method: Identified attributable release per reference flow; no measured amount means a gap, not a zero. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "Each installation or attributable job event"
      temporal_coverage: "Full installation campaign including corrections and retests"
      site_scope: "Declared installation site and job cohort"
