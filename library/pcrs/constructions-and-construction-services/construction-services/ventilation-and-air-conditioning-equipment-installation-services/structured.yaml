product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.ventilation-and-air-conditioning-equipment-installation-services"
  classification_refs: "CPC 3.0 54632 — Ventilation and air-conditioning equipment installation services; proposed narrower relation, subject to individual mapping review"
  covered_products: "First wall installation and handover of a basic intermittent axial extract fan on verified existing interfaces; Class II double-insulated models only"
  excluded_products: "Air-conditioning systems; duct networks; heat-recovery units; new penetration/sleeve/grille construction; timer/humidity/continuous variants; operational ventilation service; Class I earthed fans"
  representative_product: "Vent-Axia VASF100B basic fixed-speed-selectable wall extract fan installation; no generic bill of materials or flow rate is inferred"
  production_route: "Receipt → inspect interfaces → remove cover → mark/drill/plug and secure backplate → fixed connection and isolated speed selection → refit retained cover → electrical and extraction verification → correction if needed → signed handover"
  market_state: "One first-installed, tested and accepted fan installation service at handover; appliance manufacture is an upstream input"
functional_unit:
  what: "Accepted tested wall-mounted intermittent axial extract fan installation service"
  how_much: "1 Item(s)"
  how_well: "Secure fixing and cover retention, free impeller/shutter, compatible Class II fixed connection, selected speed, documented electrical verification and actual delivered extraction meeting the declared project criterion"
  how_long_or_cycle: "One installation and acceptance campaign through signed handover; record actual tests and rectification, with no assumed operating life or test duration"
  reference_flow_link: "accepted_installation"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "Scope is restricted to Class II double-insulated fans; Class I fans requiring earthing are excluded. This PCR covers first installation of a packaged basic intermittent axial extract fan on an accepted preexisting wall sleeve and exterior grille, using an accepted existing isolated fixed electrical supply. The representative route is the Vent-Axia VASF100B basic model: two installer-selected speeds and remote or light-switch operation. The representative manual constrains that example, not every fan sold under this category. An equivalent model requires its own installation evidence and compatible qualifiers. [vent-axia-494229j0626, pp. 3–6] Included work comprises receipt and unpacking, substrate-compatible backplate fixing, actual fixing-hole drilling or an inspected preprepared-hole route, local connection materials, speed selection, cover engagement, electrical verification, limited functional and delivered-extraction testing, correction of failed work, cleanup, attributable site resources and signed handover. Declare the project extraction acceptance criterion before testing. The reference is an installed service meeting that criterion, with no whole-building airflow or room ventilation guarantee. Exclude construction of a core penetration, new sleeve, external grille, new branch circuit or new isolation point; long duct systems, heat recovery, air conditioning, continuous-running fans, timer/humidity variants, later maintenance and ordinary ventilation use. If the starting interfaces fail acceptance or require new construction, stop this route and describe the extra service under a separately reviewed boundary. Do not relabel the work to retain this PCR."
      source_ids:
        - vent-axia-494229j0626
    - rule_id: existing_interfaces
      applies_to: "fan_installation"
      rule: "Inspect and record sleeve length/slope, external guard suitability and supply compatibility before work. The representative manual requires an outward downward sleeve slope and a wall-kit duct length of at least 100 mm from fan backplate to inside external grille. These are example-specific interface checks, not a universal sleeve construction inventory."
      source_ids:
        - vent-axia-494229j0626
    - rule_id: class_ii_connection
      applies_to: "fan_installation"
      rule: "For the representative 220–240 V 50 Hz Class II fan, use fixed wiring and rear cable entry; it must not be earthed. Verify the actual 0.75–1.5 mm² supply-cord compatibility and appropriate basic-model wiring diagram. Perform connection and speed selection while isolated; apply the actual model instructions when different."
      source_ids:
        - vent-axia-494229j0626
    - rule_id: complete_installation
      applies_to: "fan_installation"
      rule: "Include actual marking/drilling/plugging/screwing and electrical/extraction verification, electricity and cleanup. With preprepared fixing holes retain inspection evidence; do not silently remove drilling or its debris. Declare separately supplied component roles and avoid counting integral parts twice."
      source_ids:
        - vent-axia-494229j0626
    - rule_id: gate_exclusions
      applies_to: "fan_installation"
      rule: "Close the service only after secure mounting, free impeller and shutters, all cover clips engaged, correct fixed connection, selected speed and recorded actual electrical and extraction acceptance. The manual gives mounting/wiring checks; the producer declares the project extraction test method and criterion. Post-handover ventilation electricity and existing interface construction are outside this dataset."
      source_ids:
        - vent-axia-494229j0626
    - rule_id: resource_scope
      applies_to: "fan_installation"
      rule: "Under cp_energy and cp_transport include attributable transport, task power, consumed materials and waste handling. Declare portable-tool capital manufacture/lifetime treatment and any exclusion; operational tool energy and wear consumables remain included. Do not claim complete capital coverage where it is excluded. Identify shared vehicles, tools, charging and site services, enumerate fan_installation and every other actual consuming job/node with its relevant period, and retain a unique resource-event identifier."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Existing accepted sleeve, exterior guard, suitable wall substrate and compliant isolated fixed supply/connection point; purchased fan and separately added components at declared upstream supply gate"
  starting_condition_role: "Prior constructed interfaces are fixed boundary inputs to the service description, not newly produced sleeve/grille/circuit exchanges"
  product_classification_scope: "Narrow installation subset of CPC 3.0 54632; classification does not establish material or service flow identity"
  recursive_input_rule: "A purchased fan-installation service in the same category is an upstream service input with a declared gate and non-overlapping work schedule. Do not expand and charge that same work again as own foreground installation."
  upstream_dataset_requirement: "Use state-, model-, geography-, supply-gate- and unit-compatible datasets for the appliance, actual components, electricity, freight and waste handling. Declare manufacture/delivery/packaging coverage and gaps; a missing dataset does not erase the input."
  disclosure: "Identify all accepted prior interfaces and excluded construction, actual drilling route, resource attribution, capital-tool treatment, data gaps, waste destinations and the handover gate."
