      collection_method: "Inspect accepted interfaces and secure installation, record actual electrical checks and extraction at selected speed against prior project criterion, then reconcile corrections and obtain signed handover. Aggregation and attribution method: Accepted installations per reference flow; failed or unsigned jobs remain excluded."
      unit: "Item(s); actual test units"
      frequency: "Each installation or attributable job event"
      temporal_coverage: "Full installation campaign including corrections and retests"
      site_scope: "Declared installation site and job cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Photographs, interface record, competent electrical test record, calibrated flow instrument/results and signed handover"
  calculation_rules:
    - id: cohort_attribution
      applies_to: "all inventory rows"
      rule: "For each actual exchange, retain the whole-job quantity and the documented attributable share; divide the attributable total by accepted installations in the same disclosed campaign. Do not dilute failed jobs through a different cohort or include unresolved acceptance in the denominator."
      inputs:
        - cp_materials
        - cp_energy
        - cp_transport
        - cp_waste
        - cp_emissions
        - cp_acceptance
      output: "Quantity per reference flow with allocation and uncertainty schedule"
      source_ids: []
    - id: electrical_consumption
      applies_to: "installation_electricity"
      rule: "Prefer the change in actual energy-meter reading. An estimate uses measured operating power and recorded task duration with explicit compatible unit conversion; disclose method, standby/charging coverage and uncertainty. Nameplate power alone is insufficient."
      inputs:
        - cp_energy
      output: "Attributable installation and test electricity"
      source_ids: []
    - id: component_reconciliation
      applies_to: "fan_appliance; fastening_components_screw; fastening_components_wall_plug; connection_components_cable; ancillary_consumables_water; ancillary_consumables_dust_bag; returned_components_fan; packaging_waste_carton; packaging_waste_plastic; drilling_debris; rejected_waste_cable_offcut"
      rule: "Reconcile incoming quantities, installed quantities, product returns, waste and stock changes by actual material or appliance identity; keep generated substrate debris separate from purchased-component balance."
      inputs:
        - cp_materials
        - cp_waste
        - cp_acceptance
      output: "Traceable component/return/reject schedule and explained discrepancies"
      source_ids: []
  data_quality_requirements:
    - id: configuration_trace
      applies_to: "all inventory rows"
      requirement: "Preserve actual configuration, time/site, material identity and gate, instrument/source and compatible upstream datasets. Split materially different fans and installation conditions."
      evidence: "cp_materials; cp_acceptance"
    - id: completeness
      applies_to: "all inventory rows"
      requirement: "Record all actual required and conditional operations. Unknown material, emission, waste destination or resource attribution is disclosed as a gap. Missing measurements do not justify zero or generic defaults."
      evidence: "cp_materials; cp_energy; cp_transport; cp_waste; cp_emissions"
    - id: range_evidence
      applies_to: "all inventory rows"
      requirement: "No transferable quantitative Range is asserted. Appliance/fixing masses, power-time, transport, waste and extraction depend on the actual installation. Collect evidence for empirical ranges before claiming defaults; record the missing range evidence and assess sensitivity. The exact final service count is a normalization definition, not a yield prior."
      evidence: "Actual measurements, representative cohorts and uncertainty assessment"
    - id: acceptance_quality
      applies_to: "accepted_installation"
      requirement: "Retain delivered-extraction method, selected-speed state, measurement conditions and prior project criterion. A manufacturer-rated flow is not the installed delivered flow. Preserve failed results and retests."
      evidence: "cp_acceptance; vent-axia-494229j0626"
    - id: refine_fastening_components
      applies_to: "fastening_components_screw; fastening_components_wall_plug"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Actual screws, plugs and any approved fixing accessories join the backplate to the accepted wall. Retain material and dimensions by component; this conditional umbrella is expanded into the actual distinct exchanges. Range evidence need: Actual substrate, fixing SKU, dimensions, quantity and weighed or documented unit masses are needed; no generic fixing BOM or mass interval is supported. No numeric Range is asserted. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other approved actual fixing accessories require exact material/specification/SKU and independently measured quantity, exclude fan packet internal parts."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_connection_components
      applies_to: "connection_components_cable"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Actual local connection components and cable, when required within the declared fan connection interface, enter the installation. Existing fixed supply and isolation remain prior interfaces; no new circuit is included. Range evidence need: Actual conductor/connector specification, added length and traceable mass-per-length or weighing are needed; the example cable cross-section is not a component mass range. No numeric Range is asserted. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual other local connection components require concrete function/SKU/property/unit; no new circuit or duplicate existing fixed supply/isolation."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_ancillary_consumables
      applies_to: "ancillary_consumables_water; ancillary_consumables_dust_bag"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional actual cleaning water, dust-collection bags and other consumed installation materials are separate concrete exchanges by identity. Record zero only when documented absent; do not infer chemicals from a generic installation label. Range evidence need: Actual cleaning-water, collection-bag and other consumed-product identities and weighed quantities are needed; their occurrence is job dependent. No numeric Range is asserted. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual consumed materials require actual identity, independent quantity and one unit; no guessed chemicals. Whole prewetted products include water once."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_site_fuel
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional fuel for installer-operated vehicles, generators or other actual site equipment is identified separately by fuel and use. Purchased transport-service fuel remains inside its upstream service dataset. Range evidence need: Actual equipment/vehicle activity, fuel identity, measured quantity and fuel-specific density/conditions are needed; no fuel-use or density interval is transferred between fuels. No numeric Range is asserted. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual installer-owned fuel supplies by carrier and unique unit; retain upstream nonreturned unburned waste/loss burden, separate burned activity and disjoint stock/return/waste/release; purchased freight provider fuel not duplicate."
      evidence: "cp_energy; actual independent records and identity/unit evidence"
    - id: refine_returned_components
      applies_to: "returned_components_fan"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Actual reusable packaging and unused or repairable fan appliances, cable, fixings or other materials leave for identified reuse, stores or supplier return as products, separated by actual identity. A defective assembly awaiting repair cannot enter acceptance; discarded material belongs in rejected waste. Range evidence need: Weighed product-return mass by component or reusable packaging identity and traceable count/length conversions are needed; unused-return fractions cannot be assumed. No numeric Range is asserted. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual returned cable/fixing/packaging/other products need exact inbound matching identity/state/native property/unit and quantity; stock/internal corrections not exits, discarded waste separate."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_packaging_waste
      applies_to: "packaging_waste_carton; packaging_waste_plastic"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Actual carton, plastic or other packaging removed from fan and ancillary products leaves for its declared collection/treatment route. Reusable packaging returned as a product is recorded separately in the foreground schedule. Range evidence need: Actual unpacked SKU, packaging material, separated mass, reuse/return and collection destinations are needed; no packaging-waste fraction is inferred. No numeric Range is asserted. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual mixed/composite/contaminated packaging or receiver differences require independent identities; usable packaging returns not waste, no guessed mixed-total shares."
      evidence: "cp_waste; actual independent records and identity/unit evidence"
    - id: refine_rejected_waste
      applies_to: "rejected_waste_cable_offcut"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Broken fan parts, cut cable, damaged fixings and spent cleanup materials are linked to the installation node and their actual disposal or recovery destinations. In-place correction is an internal loop, whose extra inputs, energy and waste remain in this node. Range evidence need: Actual defect/cutting/cleanup records and segregated mass/destination for discarded materials are needed, distinct from usable returns; no default reject fraction is supported. No numeric Range is asserted. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual broken fan-part, damaged fixing and spent cleanup-product states/receivers need independent exact identities and quantities; original/rework event burden remains this node."
      evidence: "cp_waste; actual independent records and identity/unit evidence"
    - id: refine_direct_emissions
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional uncollected drilling particles and any actual onsite fuel-combustion or other installation releases require substance/species, particle-size basis where relevant and receiving medium before a concrete exchange is selected. Captured debris is waste, never an air emission. Range evidence need: Actual release activity, pollutant/species, particle-size basis, receiving medium, controls and measured or defensible activity-factor evidence are needed before emission intervals; missing evidence remains a gap. No numeric Range is asserted. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_emissions; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
