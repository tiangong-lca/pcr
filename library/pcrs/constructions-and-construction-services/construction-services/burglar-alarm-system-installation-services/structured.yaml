system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This category covers first installation and commissioning at a construction site of a single-panel hardwired intruder alarm with normally-closed detection zones, a separate global tamper loop, hardwired keypad, compatible contacts/detectors, external sounder and permanent rechargeable standby battery. No communication monitoring interface is supplied. The purchased output is a complete accepted installation, with its actual layout and interfaces disclosed. Wireless, hybrid, networked or addressable systems; fire/smoke and other life-safety alarms; cameras and access control; remote signalling, monitoring and telecommunications provision; periodic servicing; new upstream mains distribution; and post-handover operation are excluded. CPC 54613 includes a broader range of burglar-alarm installations and excludes monitoring/maintenance. The proposed classification relation therefore describes a narrower subset (unsd-cpc3-explanatory-notes)."
      source_ids:
        - unsd-cpc3-explanatory-notes
    - rule_id: b_scope
      applies_to: "install_accept"
      rule: "Own receipt, mounting, wiring, termination, permanent-battery installation, programming, intrusion testing, correction, retest and customer handover. Supplied controller, field devices, battery, wiring and permanent accessories remain separate input roles. No fire/life-safety method or remote monitoring is included."
      source_ids:
        - texecom-veritas-installation
    - rule_id: b_upstream
      applies_to: "all material inputs"
      rule: "Require compatible supplier packets for manufacture and actual inbound delivery. Record included packaging and accessories once. Preserve incoming packaging custody even when its manufacturing burden is included upstream; add a separate packaging burden only for an excluded upstream contribution."
      source_ids: []
    - rule_id: b_readiness
      applies_to: "starting interface"
      rule: "Record accepted existing mounting surfaces and isolated mains/earth interface. Readiness is a disclosed condition, neither an invented purchased input nor a credit. A purchased same-category prior installation requires its actual delivered state and upstream scope; unresolved overlap blocks acceptance."
      source_ids: []
    - rule_id: b_rework
      applies_to: "install_accept"
      rule: "Zone response failure, open tamper circuit, defective sounder or unsuccessful set/unset leaves the installation unaccepted. Link correction/retest back to install_accept and the original job. Classify actual removed material as usable return, recovery/waste exit or retained repair; unfinished or failed systems cannot enter accepted_installation."
      source_ids:
        - texecom-veritas-installation
    - rule_id: b_assets
      applies_to: "owned_equipment_attribution_hand_tool; owned_equipment_attribution_powered_tool; owned_equipment_attribution_electrical_tester; owned_equipment_attribution_external_charger; owned_equipment_attribution_access_asset; atomic_owned_equipment_attribution; hired_support_service_transport_event; hired_support_service_access_event; hired_support_service_test_event; atomic_hired_support_service"
      rule: "Identify installer-owned tools, testers, external chargers and access equipment by model/serial, with every consuming job/node and period. Use a lifecycle packet from acquisition/manufacture through service, maintenance/replacement and retirement/termination. The hire provider owns its equipment lifecycle; audit foreground energy inclusions to prevent duplicate ownership."
      source_ids: []
    - rule_id: b_gate
      applies_to: "accepted_installation"
      rule: "End at signed complete installation acceptance and control handover after corrections, retests and restoration of the agreed normal state. Exclude subsequent use electricity, maintenance, monitoring and new upstream mains distribution."
      source_ids:
        - texecom-veritas-installation
