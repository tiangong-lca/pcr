allocation_rules:
  - rule_id: a_jobs
    applies_to: "install_accept"
    rule: "Assume no intended co-product. Keep original job failures, additional components, labour activity, tests and retests with that job. Link every actual return or waste/recovery exit to its originating event and receiver; give no avoided-production credit and do not erase rejected work."
    source_ids: []
  - rule_id: a_shared
    applies_to: "owned_equipment_attribution_hand_tool; owned_equipment_attribution_powered_tool; owned_equipment_attribution_electrical_tester; owned_equipment_attribution_external_charger; owned_equipment_attribution_access_asset; atomic_owned_equipment_attribution; hired_support_service_transport_event; hired_support_service_access_event; hired_support_service_test_event; atomic_hired_support_service"
    rule: "For resource r and job j, a_rj = A_rj / sum(A_rk), with k covering every benefiting job/node over the same complete resource-life packet. Use one evidenced causal physical activity basis; require a positive total and sum(a_rj) = 1. Record equipment identity, consuming nodes, service periods, activity method and ownership. Do not assume equivalent output counts or a generic tool lifetime."
    source_ids: []
  - rule_id: a_quantity
    applies_to: "owned_equipment_attribution_hand_tool; owned_equipment_attribution_powered_tool; owned_equipment_attribution_electrical_tester; owned_equipment_attribution_external_charger; owned_equipment_attribution_access_asset; atomic_owned_equipment_attribution"
    rule: "Attributed asset quantity = a_rj / D Item(s); attributed lifecycle burden = B_r * a_rj / D. D is actual accepted same-configuration installation count. Keep B_r, physical activity and installation count independently observed. Remaining-life uncertainty or missing consumers prevents complete attribution."
    source_ids: []
  - rule_id: a_periods
    applies_to: "all inventory rows"
    rule: "Index procurement/manufacture, each service/reporting period, maintenance, replacement and retirement/termination. Link inputs, assets, outputs and correction/return events to dated job and period. Record each period-specific attribution decision and its evidence. Replacements are actual event packets, not automatically a whole asset per job. Reconcile each resource and period total once across all consumers and retain unresolved future-use/termination evidence."
    source_ids: []
  - rule_id: a_hire
    applies_to: "hired_support_service_transport_event; hired_support_service_access_event; hired_support_service_test_event; atomic_hired_support_service; installation_electricity"
    rule: "Use actual provider service references and inclusion ledger. Do not add provider capital manufacture separately or repeat fuel/electricity already in the purchased service. A genuinely whole contracted event may be counted; an hourly contract needs actual Duration support and review."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "install_accept"
      flow_role: "accepted_installation"
      record_type: "acceptance record"
      raw_fields: "job id; site; panel model; zone/tamper schedule; BOM; mains interface; battery; programming; test results; corrections/retests; normal-state restoration; dates; customer signature; accepted count D"
      collection_method: "Inspect each installation design and competent signed test/handover record; independently count complete accepted same-configuration installations; Aggregation: per reference flow; retain actual positive D and raw acceptance events before normalization"
      unit: "Item(s)"
      frequency: "Every job and acceptance/retest event"
      temporal_coverage: "Actual receipt-to-handover dates including corrective work"
      site_scope: "Actual premises and declared configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed acceptance; competent tests; rejected/unfinished exclusion; configuration-equivalence evidence"
    - protocol_id: cp_materials
      process_id: "install_accept"
      flow_role: "control_panel; alarm_keypad; magnetic_contact; pir_detector; external_sounder; external_strobe; external_sounder_strobe_assembly; internal_loudspeaker; permanent_batteries; alarm_cable; fixings_and_containment; incoming_packaging"
      record_type: "material custody record"
      raw_fields: "job; shipment; SKU; material/state; supply boundary; included accessories/packaging/delivery; net mass; counts/lengths; conversion factors; stock; installed/return/waste amounts; original event; receiver; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Calibrated net weighing or traceable matching-SKU count/length mass conversion; inspect supplier inclusion and event-linked custody records; Aggregation: per reference flow; sum attributable measured numerators for each matching SKU and divide by D Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity is the named alias of this CP independent_physical_quantity keyed by atomic_flow_row_id and governed by atomic_child_normalization; it is neither another observation nor a copy of the parent total. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      unit: "kg"
      frequency: "Every shipment, issue and custody change"
      temporal_coverage: "All installation dates and relevant stock opening/closing dates"
      site_scope: "Actual job, supplier packet and material pool"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; matching factor provenance; supply inclusion ledger; balance residual and tolerance"
    - protocol_id: cp_energy
      process_id: "install_accept"
      flow_role: "installation_electricity"
      record_type: "meter and activity record"
      raw_fields: "job; provider; voltage; meter boundary/id; start/end kWh; tool/charger/test/commissioning activity; times; all shared consumers; inclusion ledger"
      collection_method: "Read meters for actual external supply before handover; attribute shared measured energy by recorded causal activity and inspect purchased service inclusions; Aggregation: per reference flow; attributable actual kWh divided by D"
      unit: "kWh"
      frequency: "Every metered interval and activity"
      temporal_coverage: "Actual pre-handover intervals across all contributing dates"
      site_scope: "Actual premises and external charging site if used"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter accuracy; interval completeness; shared activity reconciliation; no Ah/power/duration substitution"
    - protocol_id: cp_services
      process_id: "install_accept"
      flow_role: "owned_equipment_attribution; hired_support_service"
      record_type: "resource and contract record"
      raw_fields: "asset manufacturer/model/serial; owner; provider; contract reference/unit; genuine whole event count; all consumer jobs/nodes; physical activity; reporting periods; manufacture/service/maintenance/replacement/retirement packets; B_r; remaining use; energy inclusion; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
