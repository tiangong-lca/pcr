    - id: atomic_child_routing
      applies_to: "install_accept"
      requirement: "The following routes each child to its original role, node, unique unit and method CP. Independently apply that original role measurement, stock, source/fate, rework, share, conversion and normalization method to each actual identity/state child. Retain the original helper/selector role parameter as legacy_parent_role, but supply quantity operands from this child independent records; ROW_UNIT(child_row_id) is the explicit unit below. Reconcile stocks/transfers only within the same identity/state and compatible native unit, grouping different materials, media, states and units separately. Parent totals are non-exchange diagnostics, never copied as child operands or summed across unlike units. Unsupported original-helper applicability or missing actual conversion, denominator or evidence blocks finalization; field records cannot choose a new method. Original role-named formula operands remain ledger names rather than duplicate exchanges. A cross-unit legacy role executes by this mapping and actual child unit instead of inheriting a wrong fixed unit. Routing: permanent_batteries_panel_standby_battery => role=permanent_batteries, node=install_accept, property=Mass, unit=kg, CP=cp_materials; permanent_batteries_sounder_standby_battery => role=permanent_batteries, node=install_accept, property=Mass, unit=kg, CP=cp_materials; alarm_cable_zone_cable => role=alarm_cable, node=install_accept, property=Mass, unit=kg, CP=cp_materials; alarm_cable_tamper_cable => role=alarm_cable, node=install_accept, property=Mass, unit=kg, CP=cp_materials; alarm_cable_keypad_cable => role=alarm_cable, node=install_accept, property=Mass, unit=kg, CP=cp_materials; alarm_cable_sounder_cable => role=alarm_cable, node=install_accept, property=Mass, unit=kg, CP=cp_materials; alarm_cable_mains_feeder => role=alarm_cable, node=install_accept, property=Mass, unit=kg, CP=cp_materials; fixings_and_containment_mounting_fitting => role=fixings_and_containment, node=install_accept, prope