functional_unit:
  what: "Accepted complete hardwired normally-closed-zone burglar alarm installation and commissioning"
  how_much: "One complete accepted installation; D independently counts actual accepted same-configuration installations before normalization"
  how_well: "Declared design and BOM; successful occupied-zone, sounder, tamper and set/unset checks; corrections closed and normal state restored; signed customer handover"
