  calculation_rules:
    - id: c_actual
      applies_to: "all inventory rows"
      rule: "q_i = N_i / D; N_i is the independently retained attributable actual numerator for the individual exchange; D is independently counted accepted same-configuration installations. Never backsolve N_i from an expected reference output."
      inputs:
        - N_i
        - D
        - cp_acceptance
        - cp_materials
        - cp_energy
        - cp_services
        - cp_releases
      output: "q_i"
      source_ids: []
    - id: c_custody
      applies_to: "material custody pools"
      rule: "opening stock + receipts = installed retained material + closing stock + usable returns + actual waste + identified releases + residual. Reconcile each exact source pool and report residual/tolerance; a mixed mass diagnostic is not one flow or service mass."
      inputs:
        - cp_materials
        - cp_releases
        - "source pool"
        - "measured quantities"
      output: "custody reconciliation"
      source_ids: []
    - id: c_resource
      applies_to: "owned_equipment_attribution_hand_tool; owned_equipment_attribution_powered_tool; owned_equipment_attribution_electrical_tester; owned_equipment_attribution_external_charger; owned_equipment_attribution_access_asset; atomic_owned_equipment_attribution"
      rule: "a_rj = A_rj / sum(A_rk); attributed asset quantity = a_rj / D; attributed burden = B_r * a_rj / D. Use all consumers of the same lifecycle packet, positive total activity and sum(a_rj) = 1."
      inputs:
        - A_rj
        - A_rk
        - B_r
        - D
        - cp_services
      output: "asset share and lifecycle burden"
      source_ids: []
    - id: atomic_child_normalization
      applies_to: "permanent_batteries_panel_standby_battery; permanent_batteries_sounder_standby_battery; alarm_cable_zone_cable; alarm_cable_tamper_cable; alarm_cable_keypad_cable; alarm_cable_sounder_cable; alarm_cable_mains_feeder; fixings_and_containment_mounting_fitting; fixings_and_containment_cable_containment; fixings_and_containment_cable_gland; fixings_and_containment_identification_label; owned_equipment_attribution_hand_tool; owned_equipment_attribution_powered_tool; owned_equipment_attribution_electrical_tester; owned_equipment_attribution_external_charger; owned_equipment_attribution_access_asset; hired_support_service_transport_event; hired_support_service_access_event; hired_support_service_test_event; unused_product_return_controller_return; unused_product_return_keypad_return; unused_product_return_contact_return; unused_product_return_pir_return; unused_product_return_sounder_return; unused_product_return_strobe_return; unused_product_return_sounder_strobe_return; unused_product_return_speaker_return; unused_product_return_battery_return; unused_product_return_cable_return; installation_waste_cable_offcut; installation_waste_failed_control_panel; installation_waste_failed_keypad; installation_waste_failed_detector; installation_waste_failed_sounder; installation_waste_failed_strobe; installation_waste_failed_sounder_strobe; installation_waste_failed_battery"
      rule: "For each atomic_flow_row_id retain its independent physical numerator independent_physical_quantity. actual_<row_id>_quantity is its named alias only, never a parent family total. Material inputs use the original CP stock gross/net and outward-return convention after independent weighing or same-SKU conversion and reconciliation; internal transfers use actual paired custody quantity; usable exits and wastes use their independently measured actual fate quantities. Owned-asset child quantity is the original complete-life asset equivalent a_rj=A_rj/sum(A_rk), with every consumer and positive complete denominator; purchased-service child quantity uses only actual completed events whose real contract defines Item(s), with the original attribution, never hours or price converted into count. atomic_child_intensity = independent_physical_quantity / D, where D is the original independently accepted complete same-configuration installation count from cp_acceptance; D=0 blocks normalization, and denominator/allocation cannot change. Standby-battery kg uses actual matching-model mass, not Ah; a battery already inside a charged complete device is not purchased again."
      inputs:
        - atomic_flow_row_id
        - independent_physical_quantity
        - exchange_property
        - exchange_unit
        - D
        - cp_acceptance
        - cp_materials
        - cp_services
        - cp_releases
      output: "atomic_child_intensity"
      source_ids: []
