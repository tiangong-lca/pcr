      applies_to: "house_elevation"
      requirement: "Mandatory actual-child refinement for house_elevation/inputs/product. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Actual mass-supplied reinforcement, cementitious or other materials, repair consumables and packaging where separately supplied; independently supplied job hydraulic oil/lubricants belong here when native-mass supplied, excluding provider/asset maintenance-covered amounts; do not repurchase constituents already covered by whole concrete/component packages. Range evidence need: Collect actual mass-supplied SKU, grade/state, gross/tare, measured opening/closing and return quantities, repair consumption and waste uncertainty. Separate dry mass and wet/contained-fluid views; no universal reinforcement or repair mass. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: S_mass / N using the declared physical stock method. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_house_elevation_mass_materials is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
