system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers the completed service of hydraulically elevating in place a structurally qualified retained timber-frame house originally supported on a crawlspace foundation, containing one or two dwellings, and reconnecting it to its permanent engineered foundation, permanent access and restored utilities. The reference is an accepted intervention on one physical house. A house containing two dwellings contributes one house, not two outputs. The intervention starts from a named assessed existing house and the actual approved lift, foundation, flood-elevation, access and utility plans. Include disconnection, preparatory removals, necessary groundworks, temporary support and lifting equipment, new or extended foundation and curing, lowering and anchorage, permanent stairs/landing, utility reconnection/testing, damage repair, retests and defect closure. Temporary utilities and temporary access are included when actually used. FEMA's historical physical sequence is route evidence only; obtain current applicable requirements and qualified engineering from the actual project. This PCR gives no operational lifting instructions, universal lifting dimensions, default flood datum, BFE, freeboard or safety factor. Exclude slab-lift, masonry-only and manufactured/mobile homes; relocation to another site; new houses, reconstruction replacing the retained house, extensions adding a dwelling; temporary elevation without the completed gate; and future floods, insurance, dwelling occupation and later maintenance. Existing house manufacture is retained baseline, not a newly purchased house input or a negative credit."
      source_ids: []
    - rule_id: period_boundary
      applies_to: "all work and asset lifecycle phases"
      rule: "The reporting campaign explicitly indexes preparation/disconnect, lift/support, foundation/curing, lowering/anchorage, access/utility restoration and acceptance phases, including their actual reporting periods. Each resource, stock carry, failure, repair, replacement and termination event links to its actual phase/period and one owner; the accepted output links to final acceptance. Cross-period carry is transferred once, not repurchased. Shared asset lifecycle phases span manufacture, all job uses, maintenance, replacement and end of life without an invented calendar lifetime."
      source_ids: []
    - rule_id: integrated_gate
      applies_to: "whole service"
      rule: "Own foundation concrete/grout/fill/reinforcement, anchors/connectors, access components and pipe/cable/fittings as required by actual plans. Couple them with retained structure at inspected permanent anchorage, surveyed elevation, safe stairs/landing, restored tested utilities and signed defect-closed acceptance."
      source_ids:
        - fema-house-elevation-1997
    - rule_id: temporary_and_damage
      applies_to: "all work phases"
      rule: "Own disconnect/lifting preparation, beams/jacks/cribbing and other temporary support, temporary stairs/utilities if used, equipment mobilization, curing/testing, actual removed foundation/debris and actual damage repair. Demobilization does not erase these burdens."
      source_ids:
        - fema-house-elevation-1997
    - rule_id: baseline_and_outlets
      applies_to: "retained parent and exits"
      rule: "Retained house and old foundation are not new material purchases. Record actual removed historic materials and their destinations without negative new-purchase quantities. Reusable returned job supplies and stock carry must be distinguished from removed old assets. No avoided-new-house, avoided-flood or recycling credit is assumed."
      source_ids:
        - fema-house-elevation-1997
    - rule_id: provider_ownership
      applies_to: "providers and assets"
      rule: "One resource owner per event across direct contractor, house mover, foundation/access/utility trades, rental and transport/test providers. Inspect provider coverage for fuel/electricity/materials, temporary support assets and full lifecycle burdens; missing physical coverage blocks final data. Shared jack/pump, beams/cribbing, tools and survey/test assets require all consumers/jobs/nodes/periods, not only this project."
      source_ids: []
