      requirement: "Mandatory actual-child refinement for house_elevation/inputs/product. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Actual house mover, groundworks, foundation, access, plumbing/electrical, inspection/test or temporary utility service results not already decomposed. Record physical completed quantity and matching full upstream coverage; money or labor hours do not establish Count-service equivalence. Range evidence need: Collect actual physical completed-result quantity, native unit, provider boundary and complete upstream resource coverage. Any observed service bounds require equivalent result/gate; price or labor duration cannot establish a Count-service range. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Actual completed service result / N in its verified native unit; reconcile excluded and included resources once. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_house_elevation_provider_services is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
