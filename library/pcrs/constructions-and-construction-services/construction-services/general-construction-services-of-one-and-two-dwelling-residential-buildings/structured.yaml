    used_for: "FEMA Protecting Your Home from Flood Damage, revised 1997 third edition, Region III compilation 2003; PDF pages 19–20 physical house-elevation and crawlspace route. Historical PDF22 regulations are not current-law, default BFE/freeboard or universal design criteria. Actual project plans and foreground records provide current requirements and quantities."
