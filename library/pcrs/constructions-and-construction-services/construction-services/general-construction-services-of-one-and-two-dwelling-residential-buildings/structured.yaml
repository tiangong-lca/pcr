      requirement: "Mandatory actual-child refinement for house_elevation/inputs/product. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Hydraulic jack/pump, lifting beams/cribbing, tools, survey/test assets and other reusable equipment including provider/rental assets. Allocate full manufacture, maintenance, replacements and end of life over every consumer/job/node/period using a compatible actual driver. Range evidence need: Collect job_driver and compatible lifetime_driver over all asset consumers, observed history and evidenced remaining use/replacement/termination/EOL, full lifecycle inventory, uncertainty and sensitivity. No default equipment lifetime, hours-to-asset or missing-lifecycle zero. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Choose asset_equivalent = (job_driver / lifetime_driver) / N with actual asset unit burden OR service_quantity = job_driver / N with matching lifecycle-complete per-driver service burden; never both. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_house_elevation_shared_assets is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
