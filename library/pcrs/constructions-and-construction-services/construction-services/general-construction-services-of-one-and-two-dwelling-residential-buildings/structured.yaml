  calculation_rules:
    - id: stock_balance
      applies_to: "atom_req_house_elevation_volume_materials; atom_req_house_elevation_mass_materials; atom_req_house_elevation_length_materials; atom_req_house_elevation_area_materials; atom_req_house_elevation_count_materials; atom_req_house_elevation_fuel_supply; atom_req_house_elevation_usable_returns"
      rule: "S = attributed_opening + external_net_receipts - carried_closing; gross-with-outlets S OR consumed-only S minus matched usable outward return once; divide selected quantity once by N."
      inputs:
        - cp_materials
        - cp_fuel
        - cp_acceptance
        - opening
        - gross
        - tare
        - closing
        - "matched return"
        - N
      output: "Native-unit supplied and returned quantities per reference flow"
      source_ids: []
    - id: fuel_fates
      applies_to: "atom_req_house_elevation_fuel_supply; atom_req_house_elevation_contained_fluids; atom_req_house_elevation_species_release"
      rule: "Use actual measured burn OR complete disjoint audited native-unit fates with uncertainty and unknown-loss investigation. Return, nonburned waste, uncontained loss and carry are exclusive; no unexplained residual inferred burn; total spill audit only."
      inputs:
        - cp_fuel
        - "actual burn"
        - "native fate quantities"
        - uncertainty
        - investigation
      output: "Supply, burn and disjoint fluid fates, each at its own role"
      source_ids: []
    - id: asset_share
      applies_to: "atom_req_house_elevation_shared_assets"
      rule: "asset_equivalent = (job_driver / lifetime_driver) / N OR service_quantity = job_driver / N with lifecycle-complete matching per-driver burden; choose one representation."
      inputs:
        - cp_assets
        - job_driver
        - lifetime_driver
        - "full lifecycle inventory"
        - N
      output: "Allocated complete asset or service quantity per reference flow"
      source_ids: []
    - id: freight_work
      applies_to: "atom_req_house_elevation_freight"
      rule: "Freight workload = sum(cargo_kg * distance_km) / N; empty return scope and loading shares separately evidenced."
      inputs:
        - cp_transport
        - cargo_kg
        - distance_km
        - load_share
        - N
      output: "Actual atom_req_house_elevation_freight in kg*km per reference flow"
      source_ids: []
    - id: species_mass
      applies_to: "atom_req_house_elevation_species_release"
      rule: "Species-medium amount = measured species mass OR matched activity * complete species EF OR actual whole-fluid release * evidenced composition * fate; divide once by N. Do not apply composition/fate again to a complete species EF."
      inputs:
        - cp_emissions
        - cp_fuel
        - activity
        - factor
        - composition
        - fate
        - "actual species and medium"
        - N
      output: "Actual species-medium kg per reference flow"
      source_ids: []
    - id: direct_aggregation
      applies_to: "all inventory rows"
      rule: "Aggregate each owned numerator over the same campaign; divide once by N to per reference flow. The accepted_elevation output is 1 Item(s). Existing historical parent, internal transfers and duplicated provider resources are not new supply."
      inputs:
        - "all process-owned protocols"
        - "unique accepted house IDs"
        - N
      output: "One consistent reference-flow inventory"
      source_ids: []
  data_quality_requirements:
    - id: gate_quality
      applies_to: "house_elevation"
      requirement: "Actual structural qualification, permit/design, local flood datum and requirement, surveyed final elevation, permanent foundation/anchorage, safe access, tested restored utilities and signed defect closure; incomplete gate is a data gap."
      evidence: "cp_acceptance and actual current project authorities"
    - id: physical_coverage
      applies_to: "all inventory"
      requirement: "Complete direct/provider/rental/test/transport/temporary utility resources, native units, stock exits and failed work; no monetary surrogate or zero for unavailable data."
      evidence: "Each protocol and supplier scope reconciliation"
    - id: conversion_quality
      applies_to: "conversions and emissions"
      requirement: "Raw operands, compatible units, state/moisture/temperature units and conversion/composition/fate/factor sources; uncertainty and range evidence per actual role."
      evidence: "cp_materials; cp_fuel; cp_emissions and source documents"
    - id: temporal_quality
      applies_to: "job and shared assets"
      requirement: "Common house/job/site/campaign/batch/event/phase/period IDs; all asset consumers and full-life driver; representativeness of any grouped houses disclosed."
      evidence: "All protocols; asset lifecycle evidence"
    - id: identity_quality
      applies_to: "final exchanges"
      requirement: "Resolve concrete SKU/provider/destination/species UUIDs and support properties/unit groups before final data production. Semantic umbrellas are not fixed exchange identities."
      evidence: "Concrete exchange detail and support confirmation"
    - id: quality_actual_conditional_exchanges
      applies_to: "house_elevation"
      requirement: "Where actual records show direct environmental water abstraction or discharge, the producer MUST add distinct house_elevation elementary input/output exchanges in actual medium and native unit with cp_water ownership, measurements and fate reconciliation; neither purchased supply nor atom_req_house_elevation_wastewater treatment substitutes them. Where dismantled historic objects remain usable and leave as products, the producer MUST add a separate actual product-output ledger by identity/state/native quantity and receiver, with cp_waste origin/transfer evidence; they are neither new-goods atom_req_house_elevation_usable_returns nor atom_req_house_elevation_solid_waste. These actual-data expansions inherit normalization, range evidence, concrete identity verification and single ownership requirements; unknown occurrence is a data gap."
      evidence: "cp_water; cp_waste; Actual environmental crossing and dismantled-object transfer records"
    - id: atom_req_house_elevation_volume_materials
      applies_to: "house_elevation"
      requirement: "Mandatory actual-child refinement for house_elevation/inputs/product. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Actual SKU/state concrete, grout and necessary fill supplied for the permanent foundation and access works; distinguish delivered volume from installed geometry and include waste. Ready-mixed supply includes its constituents. Independently supplied job hydraulic oil/lubricant topups belong here when native-volume supplied, excluding any amount already in provider/asset maintenance scope. Range evidence need: Collect each delivered concrete/grout/fill SKU and volume ticket, approved foundation geometry, actual overbreak, losses and installed state. Any mass/dry-solids/compacted-volume comparison needs actual density, moisture, state, temperature and units; no universal foundation volume. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: S_volume / N using the declared physical stock method; actual SKU rows independently. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_house_elevation_volume_materials is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data. Oil/lubricant volume records migrate once to the corresponding mass_materials_hydraulic_oil or mass_materials_lubricant Mass/kg child using actual same-product density/state/temperature/unit/source evidence; these are auxiliary volume records, not parallel volume-supply cards. The same SKU cannot be both hydraulic oil and an additional lubricant purchase."
      evidence: "Original node protocol cp_materials; independent actual-child roster and evidence"
