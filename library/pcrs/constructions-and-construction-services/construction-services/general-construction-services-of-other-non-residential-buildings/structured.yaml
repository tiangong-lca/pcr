  calculation_rules:
    - id: normalize_native
      applies_to: "all inventory rows"
      rule: "For each actual concrete exchange, divide attributed job quantity by N once; final suite output is 1 Item(s). Keep raw numerator and N."
      inputs:
        - native_quantity
        - N
        - cp_clearance
        - cp_envelope_services
        - cp_finishing
        - cp_validation
      output: "Native exchange per reference flow"
      source_ids: []
    - id: stock_balance
      applies_to: "all inventory rows"
      rule: "S = attributed opening stock + external net-of-tare receipts - carried closing stock. Internal issues or installed activity are not new receipts. Choose gross supply with matched outward usable returns OR consumed-only with the return deducted once; disclose choice. Nonreturned waste/loss stays upstream; closing stock is not a return. Historic removed fabric has no new supply credit."
      inputs:
        - opening_stock
        - external_receipts
        - tare
        - carried_closing_stock
        - usable_outward_return
      output: "Reconciled supply and matched return ledger"
      source_ids: []
    - id: fuel_fates
      applies_to: "all inventory rows"
      rule: "If fuel is actually used, supply upstream and burned fuel are distinct. Obtain measured burn OR an audited complete disjoint native-unit fate balance with uncertainty and unknown-loss investigation. Returned fuel, nonburned waste, uncontained loss and carried closing are mutually exclusive; total spill is audit only and recovered closing is already closing. Never infer burn as an unexplained residual."
      inputs:
        - measured_burn
        - external_receipts
        - opening_stock
        - usable_outward_return
        - nonburned_waste
        - uncontained_loss
        - carried_closing_stock
        - total_spill_audit
        - recovered_closing_stock
      output: "Evidence-based actual burn and other disjoint fates"
      source_ids: []
    - id: species_release
      applies_to: "actual exchanges required by refine_clearance_actual_releases; actual exchanges required by refine_envelope_services_actual_releases; actual exchanges required by refine_finishing_actual_releases; actual exchanges required by refine_validation_actual_releases"
      rule: "Use measured species mass OR actual matched activity times species factor OR actual whole-fluid release times evidenced composition and receiving-medium fate. Do not multiply a complete species factor by composition/fate again. Whole-fluid view is nonadditive to species; SDS, safety limits and no-VOC claims are not emission quantities."
      inputs:
        - native_quantity
        - activity
        - species_factor
        - composition
        - fate
        - receiving_medium
        - factor_source
        - composition_source
        - fate_source
      output: "Actual species mass by medium per reference flow"
      source_ids: []
    - id: freight_work
      applies_to: "clearance_freight; envelope_services_freight; finishing_freight; validation_freight"
      rule: "Sum actual load_mass in kg times distance in km for each leg / N; disclose carrier empty-return and upstream coverage and avoid adding fuel already covered in freight."
      inputs:
        - load_mass
        - load_mass_unit
        - distance
        - distance_unit
        - empty_return_scope
        - N
      output: "Freight in kg*km per reference flow"
      source_ids: []
    - id: shared_asset
      applies_to: "actual exchanges required by refine_clearance_provider_assets; actual exchanges required by refine_envelope_services_provider_assets; actual exchanges required by refine_finishing_provider_assets; actual exchanges required by refine_validation_provider_assets"
      rule: "Identify temporary containment, access, testing and rented assets, all consumers across clearance/envelope_services/finishing/validation and ALL other jobs/nodes/periods. Allocate full manufacture, maintenance, replacements and end-of-life with compatible actual job_driver / full_life_driver. Full life uses observed completed life or observed history plus evidenced remainder/replacement/termination/end-of-life, with sources, uncertainty, sensitivity and updates. Choose asset-equivalent quantity (job_driver/full_life_driver)/N OR lifecycle-complete service quantity job_driver/N with matching per-driver burden. Do not combine views or normalize twice; no invented lifespan."
      inputs:
        - job_driver
        - full_life_driver
        - driver_unit
        - observed_life
        - evidenced_remainder
        - replacement
        - termination
        - end_of_life
        - N
      output: "One lifecycle-complete attributable asset or service view"
      source_ids: []
