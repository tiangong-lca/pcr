system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers the completed envelope and building-services retrofit of one source-negative isolation suite in a retained hospital: patient bedroom, entry lobby and en-suite form one coordinated accepted intervention. Survey actual adjacent clinical use, retained capacities, constraints and approved multidisciplinary scope. NHS HBN 04-01 Supplement 1 (July 2025 posting, internally 2024 revision) supports route and test logic in England; actual local standards and approved deviations govern elsewhere and on each project. It provides no category-wide default ACH, Pa, service life, test consumption or kill rate. Whole new-building methodology starts at a different condition and does not own contaminated retained-system release, hidden-envelope first-fix testing or the negative-source suite validation chain. Fan installation, sealing and cleaning are constituent tasks, not equivalent accepted suite services. Protective-positive and neutral-bedroom PPVL designs, whole wards, portable HEPA-only arrangements and later clinical use are outside this category."
      source_ids: []
    - rule_id: actual_state_exits
      applies_to: "all processes"
      rule: "Before final data MUST instantiate usable historic removed fabric as a separate Product output in its actual native unit, with historical_receiver, historical_transfer and quality acceptance; do not merge it with unused new-supply returns or credit new purchases. Instantiate volume-measured contained effluent as a separate Waste exchange with volume unit and receiver. Instantiate actual direct water abstraction/environmental discharge as separate Elementary input/output with actual source/receiving medium, volume state and destination; do not hide these in Mass cards. Mass waste/species cards cover only their corresponding mass ledgers; whole-fluid and species views remain nonadditive."
      source_ids: []
    - rule_id: power_boundary
      applies_to: "clearance_electricity; envelope_services_electricity; finishing_electricity; validation_electricity"
      rule: "Record gross imported and gross exported electricity, actual source/retained on-site generation, construction/test circulation and losses separately under one event owner. Never net exports or future operating savings against imports. MUST instantiate any actual export as a separate measured Product output and receiver; actual generation needs its fuel/asset/releases and complete provider coverage once."
      source_ids: []
    - rule_id: scope_start
      applies_to: "all processes"
      rule: "Start with surveyed retained hospital suite, adjoining occupied clinical zones and retained-system condition; clinical/IPC teams own decanting, decontamination/release and containment approval; estates own isolation and safe old gas/water/electrical/ventilation handoff. Attribute all actual temporary clinical-continuity/containment resources. No new purchase or negative credit for the historic building."
      source_ids:
        - nhs-isolation-hbn0401-supp1-2025
    - rule_id: sequence_gate
      applies_to: "envelope_services; finishing; validation"
      rule: "Permanent slab-to-slab, facade, penetration, door/window and service sealing is checked at first-fix before concealment by ceilings, finishes or covers; repair and repeat the test before release to finishing. Final leakage and commissioning/validation follow finished installation; air sealers do not validate their own leakage work under the adopted NHS protocol."
      source_ids:
        - nhs-isolation-hbn0401-supp1-2025
    - rule_id: negative_gate
      applies_to: "validation"
      rule: "Use only the approved source-negative design: bedroom negative to lobby/corridor and en-suite negative to bedroom, with actual lobby strategy, airflow directions, stabiliser steady response, fan fault signals, gauges, pressure monitoring/alarms and actual water/fire/interface checks. Record actual adopted jurisdictional design criteria and authorised deviations. NHS England recommendations, example ACH/Pa and fire ratings are not universal defaults."
      source_ids:
        - nhs-isolation-hbn0401-supp1-2025
    - rule_id: complete_resources
      applies_to: "all processes"
      rule: "Own actual direct and provider/rental labour-support materials, temporary utility connections, travel/freight, tests, cleaning, spare parts, repeat works and shared asset lifecycle burdens once. A provider row needs an actual completed physical result, native quantity and full upstream coverage. Missing coverage blocks a final dataset, including undisclosed offsite work."
      source_ids: []
    - rule_id: expand_actual
      applies_to: "all processes"
      rule: "MUST expand umbrellas to concrete SKU/provider/species exchanges before final data. Preserve native Count/Area/Length/Volume/Mass supply and matched usable returns. Fuel, direct water abstraction and actual direct water/gas emissions require dedicated measured exchanges with their state and medium; do not hide them in service or waste cards. No assumed pathogen kg, VOC fraction, refrigerant loss, gas venting or wastewater fate."
      source_ids: []
    - rule_id: scope_end
      applies_to: "all processes"
      rule: "End at signed complete intervention after defect closure and project-required independent competent validation, with actual VSG/Authorising Engineer and hospital clinical/IPC/estates responsibilities documented. Exclude new whole hospital, whole ward, protective-positive/PPVL, portable HEPA-only provision, clinical treatment/equipment and later routine care, maintenance or annual verification. This is no promise of infection prevention or patient outcome."
      source_ids:
        - nhs-isolation-hbn0401-supp1-2025
