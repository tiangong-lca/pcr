      applies_to: "all inventory rows"
      requirement: "Cover all actual phases, providers, temporary clinical continuity and shared life; record zero with evidence, unknown with blocker, and measurement uncertainty."
      evidence: "Coverage matrix, native records, asset life and scope reconciliation"
