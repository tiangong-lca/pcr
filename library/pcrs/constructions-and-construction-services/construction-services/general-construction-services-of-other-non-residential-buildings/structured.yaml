allocation_rules:
  - rule_id: single_suite
    applies_to: "foreground_burden_allocation"
    rule: "N is positive count of unique complete accepted suite IDs. One bedroom+lobby+en-suite is one intervention, regardless of trades, rooms, beds, attempts or time. Failures, removed rejects, rework/retests and all losses retain burden; no accepted output until closed. Recoverable fabric exits by documented destination without speculative substitution credits."
    source_ids: []
  - rule_id: stock_ownership
    applies_to: "foreground_burden_allocation"
    rule: "S = attributed opening stock + external net-of-tare receipts - carried closing stock. Internal issues or installed activity are not new receipts. Choose gross supply with matched outward usable returns OR consumed-only with the return deducted once; disclose choice. Nonreturned waste/loss stays upstream; closing stock is not a return. Historic removed fabric has no new supply credit."
    source_ids: []
  - rule_id: shared_lifecycle
    applies_to: "foreground_burden_allocation"
    rule: "Identify temporary containment, access, testing and rented assets, all consumers across clearance/envelope_services/finishing/validation and ALL other jobs/nodes/periods. Allocate full manufacture, maintenance, replacements and end-of-life with compatible actual job_driver / full_life_driver. Full life uses observed completed life or observed history plus evidenced remainder/replacement/termination/end-of-life, with sources, uncertainty, sensitivity and updates. Choose asset-equivalent quantity (job_driver/full_life_driver)/N OR lifecycle-complete service quantity job_driver/N with matching per-driver burden. Do not combine views or normalize twice; no invented lifespan."
    source_ids: []
  - rule_id: periods
    applies_to: "foreground_burden_allocation"
    rule: "Index clearance, first-fix before concealment, finishing, commissioning, rework and final validation/acceptance by actual phase/period/event. Attribute each shared receipt, test and replacement once across reporting boundaries; reconcile transfers/opening/closing stock before aggregation. Unresolved termination or replacement coverage blocks finalization; do not annualize construction to a service life."
    source_ids: []
