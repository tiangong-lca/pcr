      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Expand completed provider physical results and temporary clinical continuity, containment/access, test and rental assets actually used. Match each native quantity to complete upstream scope; money or labour hours cannot become a counted completed service. Range evidence need: For each actual completed provider result record native service quantity/gate and upstream coverage; for shared assets record the chosen whole-asset or complete-life service view, compatible job/all-consumer full-life drivers, observed history/remainder/replacement/termination/EOL sources and uncertainty/sensitivity/update. No price/hour-to-Count or assumed life. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual complete provider function/reference/gate and uncovered resources; shared whole-asset versus compatible complete-life service view, all consumers/history/remainder/replacements/EOL/uncertainty. No money/hour-to-Count or arbitrary life."
      evidence: "cp_finishing; actual independent records and identity/unit evidence"
    - id: refine_finish_area
      applies_to: "finish_area_wall_system; finish_area_floor_system; finish_area_ceiling_system"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record actual cleanable wall/floor/ceiling systems and their adhesive/coating packages; no universal disinfectant efficacy or coating emission factor. Range evidence need: Record actual cleanable-finish SKU/system, native supplied versus installed surface area, substrate/first-fix release, cutting/overlap, matched returns, repairs/rejects, finish inspection and area uncertainty; no default finish thickness, biocidal efficacy or area-per-suite. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual separately supplied adhesive/coating products outside a complete system require their own formulation/native unit, not duplicate included package constituents. Preserve substrate/first-fix, new supplied versus installed area, returns/cutting/rejects; no default biocidal efficacy."
      evidence: "cp_finishing; actual independent records and identity/unit evidence"
    - id: refine_finishing_usable_returns
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Only actual usable outward returns matched by SKU, state and original receipt enter; retain the same native unit as supply. Closing carried stock is not an outward return. Range evidence need: Record actual outward transfer quantity, receiving acceptance and usable condition in the matching supplied SKU/native unit; disclose gross-with-outlets or consumed-only accounting. Closing stock and usable historically removed fabric are different records; no generic return rate or credit. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual outward usable product matched to SKU/state/original receipt/native property/unit/receiver; original gross-with-outlets or consumed-only bridge, closing stock and historic removed fabric excluded."
      evidence: "cp_finishing; actual independent records and identity/unit evidence"
