      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Expand only actual measured substances and receiving media, or valid matched activity/species factors. Include actual combustion, coating/cleaning, refrigerant or medical-gas releases if present. An infection risk is not a measured pathogen emission; sealed waste is not an elementary release. Range evidence need: Require actual event/substance/particle fraction/receiving medium and measured species mass, or matched activity with valid factor units/source, or measured whole-fluid release with evidenced composition/fate and uncertainty. Captured waste and whole-fluid/species audit views are separate; no pathogen quantity from infection risk or default leakage/emission factor. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
