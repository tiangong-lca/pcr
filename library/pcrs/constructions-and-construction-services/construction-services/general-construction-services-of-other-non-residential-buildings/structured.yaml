    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
validation_rules:
  - rule_id: acceptance
    applies_to: "foreground_dataset_conformance"
    rule: "Reject premature acceptance, missing suite components, unknown mode, omitted first-fix evidence, self-validation where independence is required, unapproved deviations or open defects. Retain calibrated raw airflow/pressure/leakage, test conditions, first-fix/final timestamps, stabiliser and fan-fault/monitor/alarm/gauge results, water/fire/interfaces, actual independent validator scope and signed multidisciplinary release."
    source_ids:
      - nhs-isolation-hbn0401-supp1-2025
  - rule_id: inventory_complete
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile native receipts, stock, returns, installation and waste; separate historic removed fabric, packaging and new-material rejects. Every actual zero requires evidence, every unknown remains a gap. Verify concrete identities/property/unit upstream coverage and provider assets; expand direct water/gas/species exchanges. Check fuel fates, species factors, freight units and all shared-life consumers; no double counting or unsupported credits."
    source_ids: []
  - rule_id: comparability
    applies_to: "foreground_dataset_conformance"
    rule: "Compare only disclosed actual suite layout/volume, adjoining occupancy, retained capacities, adopted standards, mode, test convention, phasing and scope; normalize once by N. Quantities, thresholds, durations and species are project evidence, not defaults from guidance. Missing native-property support or data coverage prevents final data even if a candidate structural check passes."
    source_ids: []
  - rule_id: atomization_clearance_consumables_complete
    applies_to: "clearance_consumables_bag; clearance_consumables_seal"
    rule: "Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying refine_clearance_consumables with actual records; unresolved required expansion blocks the dataset."
