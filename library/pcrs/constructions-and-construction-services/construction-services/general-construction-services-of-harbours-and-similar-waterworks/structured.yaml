system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers the completed replacement of a damaged standard-mount SCN-type super-cone rubber fender element at an existing concrete harbour quay. The qualified compatible frontal steel frame, UHMWPE facing, chains and anchors remain in service. The contractor owns safe access and support, controlled removal, interface qualification and cleaning, installation of the approved new cone, reconnection and adjustment, actual specified checks and signed replacement release. Source manuals describe the component interfaces and possible replacement after damage; they do not establish a universal LCA quantity or guarantee present project suitability. Exclude a new quay or complete new fender system; SCK, arch, foam, pneumatic, reverse-mount and parallel-motion arrangements; ship fenders; new anchors, structural reconstruction or replacement frontal frame; cold/hot vulcanisation repair; later berthing, port operation and scheduled maintenance. If retained interfaces fail qualification, block this route and define a different repair scope. Sources: un-cpc3-2025; trelleborg-scn-sck-2018; trelleborg-fender-systems-2019."
      source_ids:
        - un-cpc3-2025
        - trelleborg-scn-sck-2018
        - trelleborg-fender-systems-2019
    - rule_id: qualified_host
      applies_to: "foreground_system_boundary"
      rule: "Do not accept a replacement with incompatible or defective retained frame/facing, chains, sockets, threads, anchors or quay. Identify and remedy job-caused damage within the agreed small-repair scope; major defects stop this route."
      source_ids:
        - trelleborg-fender-systems-2019
        - trelleborg-scn-sck-2018
    - rule_id: integration_boundary
      applies_to: "foreground_system_boundary"
      rule: "One integrated contractor responsibility covers removal through reconnection and release. Removal has no independently accepted intermediate-product handoff. Retained interface and new moulded rubber body are distinct assembly roles; separately supplied hardware is not counted again if embedded/bundled in the cone."
      source_ids:
        - trelleborg-fender-systems-2019
    - rule_id: support_gate
      applies_to: "foreground_system_boundary"
      rule: "Capture actual engineered access/isolation, protected storage/handling, certified lifting/support and actual weight/centre-of-gravity basis. Support the frame until required components are secure; apply actual approved tightening sequence, seating and chain/alignment criteria. A catalogue value is not a universal job setting."
      source_ids:
        - trelleborg-fender-systems-2019
    - rule_id: incremental_scope
      applies_to: "foreground_system_boundary"
      rule: "Include preparation, containment, cleaning water/cleaner, tools/protection, actual coating remedy, all installation/testing/rework resources, mobilisation/demobilisation and destinations, including provider-paid resources. Document actual absence; unknown is not zero."
      source_ids: []
    - rule_id: period_shared_scope
      applies_to: "foreground_system_boundary"
      rule: "Index job preparation, execution, follow-up and closure events to actual periods. For shared crane, rigging, access plant, temporary support and tools, cover manufacture, maintenance/replacement and end-of-life across all consumers/periods; separate direct operation and genuine provider coverage. Do not impose a generic asset life."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Existing concrete quay with damaged SCN cone and retained compatible frame/facing, chains and anchors assessed fit for this bounded replacement; actual hazards/access and damage records declared"
  starting_condition_role: "Retained productive asset state and installation interfaces, recorded by position/condition; no new manufacture exchange or avoided-replacement credit"
  product_classification_scope: "Harbour quay repair subset; classification describes service context and does not define component identity or methodology"
  recursive_input_rule: "If a separately completed same-category replacement service is purchased, keep its accepted position IDs, service scope and upstream dataset explicit; exclude its already covered resources from the local job. An internal work stage is never another accepted repair product"
  upstream_dataset_requirement: "Every new element, separately purchased hardware/consumable, direct utility, transport and bounded provider/shared-asset contribution needs compatible identity, quantity and upstream coverage before final dataset completion"
  disclosure: "Declare host qualification, supplied/retained components, gross-versus-consumed ledger choice, failed/rework burden, all periods/providers, stock carry, destination records, shared complete-life scope and remaining uncertainty"
