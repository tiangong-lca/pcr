  source_sha256: "sha256:cb2c505ac6581f7a1379ec960fbc875f9040a9bb6d75f6f2ff712597cd3a7bdc"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6173"
      family: "system_boundary"
      span:
        start:
          offset: 6173
