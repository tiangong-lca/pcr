    - id: atom_final3_typed_child_routes
      applies_to: "all actual child and legacy-role records"
      requirement: "Each listed current child has exactly the stated exchange property/unit, node/direction/type and method, with its own original measured operands. The legacy parent name is only a nonexchange role/raw-prefix selector, not a surviving card or a scalar quantity. Index every original raw stock, return/fate, q_scope, helper and closure record by actual_child_row_id, exact identity/SKU, state/medium, event, period, source and owner. ROW_UNIT(actual_child_row_id) reads that real child card. Apply the original compatible role-specific method to that child operands, never the parent sum; unknown actual roster or unsupported conversion/method/unit remains incomplete and cannot be decided by downstream guessing. Different units are separate groups; same-object auxiliary Count/Mass/Volume or energy views are nonadditive, with actual same-identity/state geometry/count/net-mass/density/moisture/temperature sources for conversion. Existing closed material/state and water-fate QA may sum only compatible measured physical portions once, with carrier/component/water lineage, never publish a diagnostic parent exchange. Material supply uses stock S; actual usable outward returns use measured same-SKU/unit custody exits; real waste uses measured whole actual carrier state/receiver; historic removed objects are existing baseline, not new manufacture. Internal send/receipt uses separately evidenced same-object/state/unit/event/gate quantities; equality is reconciliation, not overwriting records or inferring a child from a parent. All original gates, failed/repeated operations, all periods, carrying burden and stock/WIP obligations continue. Routing: separate_fasteners_fender_bolt => legacy_role=separate_fasteners, node=element_replacement, direction=inputs, type=product, property=Number of items, unit=Item(s), quantity_method=material, CP=cp_atom_separate_fasteners_fender_bolt, original_CP=cp_separate_fasteners; separate_fasteners_fender_nut => legacy_role=separate_fas