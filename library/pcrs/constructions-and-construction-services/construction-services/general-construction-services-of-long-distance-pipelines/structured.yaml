  calculation_rules:
    - id: normalize_actual
      applies_to: "prepreg_length; prepreg_length; prepreg_length; prepreg_length; filler_components_complete_formulation; atomic_filler_components; primer_components_complete_formulation; atomic_primer_components; ancillary_mass_cleaner; ancillary_mass_abrasive; ancillary_mass_coating; ancillary_mass_wipe; ancillary_mass_test_consumable; atomic_ancillary_mass; atomic_ancillary_length; ancillary_area_containment; ancillary_area_compaction_film; ancillary_area_release_film; atomic_ancillary_area; atomic_ancillary_count; water_supply; atomic_process_medium; electricity; fuel_supply; freight; bounded_provider_engineering; bounded_provider_ndt; bounded_provider_isolation_purge; bounded_provider_access; atomic_bounded_provider; shared_assets_blast; shared_assets_compressor; shared_assets_measurement; shared_assets_ndt; shared_assets_access; shared_assets_compaction; atomic_shared_assets; usable_return_mass_filler; usable_return_mass_primer; usable_return_mass_cleaner; usable_return_mass_abrasive; usable_return_mass_coating; usable_return_mass_fuel; atomic_usable_return_mass; usable_return_length_prepreg; atomic_usable_return_length; usable_return_area_containment; usable_return_area_compaction_film; usable_return_area_release_film; atomic_usable_return_area; atomic_usable_return_count; repair_wastes_coating; repair_wastes_corrosion; repair_wastes_abrasive; repair_wastes_prepreg_offcut; repair_wastes_cured_prepreg; repair_wastes_filler_unmixed; repair_wastes_filler_mixed; repair_wastes_primer_unmixed; repair_wastes_primer_mixed; repair_wastes_consumable; repair_wastes_packaging; repair_wastes_washwater; repair_wastes_test_medium; repair_wastes_fuel; atomic_repair_wastes; atomic_identified_releases"
      rule: "Normalized quantity = actual attributable native quantity / N; N = unique finally accepted defect IDs in declared campaign. Never divide by attempts, wraps, layers or unaccepted defects."
      inputs:
        - "Actual primary quantities"
        - N
        - "linked cp for each row"
      output: "Per 1 Item(s) reference repair quantities"
      source_ids: []
    - id: stock_attribution
      applies_to: "prepreg_length; prepreg_length; prepreg_length; prepreg_length; filler_components_complete_formulation; atomic_filler_components; primer_components_complete_formulation; atomic_primer_components; ancillary_mass_cleaner; ancillary_mass_abrasive; ancillary_mass_coating; ancillary_mass_wipe; ancillary_mass_test_consumable; atomic_ancillary_mass; atomic_ancillary_length; ancillary_area_containment; ancillary_area_compaction_film; ancillary_area_release_film; atomic_ancillary_area; atomic_ancillary_count; water_supply; atomic_process_medium; fuel_supply"
      rule: "Supply = opening attributable stock + external net-tare gross receipts - closing carried stock. Gross-with-outlets preserves matched usable return; consumed-only supply = supply - matched usable outward return, excluded once without return credit. Nonreturned waste/loss retains supply burden."
      inputs:
        - SKU
        - native_unit
        - opening
        - receipts
        - tare
        - closing
        - return
        - "outlet state"
      output: "Actual attributable supply by SKU and native unit"
      source_ids: []
    - id: component_reconciliation
      applies_to: "filler_components_complete_formulation; atomic_filler_components; primer_components_complete_formulation; atomic_primer_components"
      rule: "For each component, reconcile actual dosed mass to compatible mixed intermediate, cured-retained, mixed/unmixed waste and evidenced loss states; intermediates are nonadditive. Kit/component purchase views are exclusive; no guessed ratio."
      inputs:
        - "Component masses"
        - "actual approved ratio"
        - "batch states"
        - residues
        - "supply scope"
      output: "Component and mixed-state physical audit, not duplicate exchanges"
      source_ids: []
    - id: burn_activity
      applies_to: "fuel_supply; atomic_identified_releases"
      rule: "Burn activity = actual fuel burned; reconcile stock to burn + usable nonburned return + nonreturned waste + uncontained loss + closing stock with disjoint outlets. Upstream supply is not restricted to burn. Total spill is audit-only; closing recovered spill is not additional loss."
      inputs:
        - "Actual fuel stock/receipt/outlets"
        - "fuel grade"
        - "actual compatible factor"
      output: "Fuel supply and separate combustion activity"
      source_ids: []
    - id: freight_work
      applies_to: "freight"
      rule: "Freight work = sum of actual kg payload * actual km by owned leg with actual load/empty-leg allocation and coverage; avoid provider/supplier duplication."
      inputs:
        - leg_id
        - actual_payload
        - distance
        - load_share
        - empty_leg
        - coverage
      output: "kg*km before division by N"
      source_ids: []
    - id: asset_attribution
      applies_to: "shared_assets_blast; shared_assets_compressor; shared_assets_measurement; shared_assets_ndt; shared_assets_access; shared_assets_compaction; atomic_shared_assets"
      rule: "Asset equivalents = job compatible measured driver / all-consumer complete-life driver; full-life scope includes manufacture + maintenance + replacements + EOL exactly once. Complete observed life or observed history + evidenced remainder/replacement/termination/EOL; retain uncertainty/sensitivity/update; missing coverage blocks finalization."
      inputs:
        - asset_id
        - "full-life scope"
        - "all consumer/period drivers"
        - "observed history"
        - "evidenced remainder"
        - replacements
        - EOL
      output: "Attributable full-life asset equivalents before division by N"
      source_ids: []
    - id: medium_reconciliation
      applies_to: "atomic_process_medium"
      rule: "Use disjoint whole-medium final outlets: opening + external_supply = closing + usable_outward_return + consumed_transformed + collected_waste + uncontained_loss. Closing includes all retained/recovered stock. Captured/reinjected and used/dosed quantities are intermediate audit views, not extra final outlets; vented is a subset of uncontained_loss, not an additional outlet. Never subtract capture plus reinjection/return/closing, or vented plus loss, twice. Job-attributed medium upstream supply and species/medium elementary releases remain separate nonadditive views."
      inputs:
        - opening
        - external_supply
        - closing
        - usable_outward_return
        - consumed_transformed
        - collected_waste
        - uncontained_loss
        - "actual state/composition records"
      output: "Disjoint whole-medium physical balance before normalization; intermediate audits are nonadditive"
      source_ids: []
    - id: species_release
      applies_to: "atomic_identified_releases"
      rule: "Species release = directly measured identified species mass to actual medium OR actual compatible activity * matched factor with composition/fate/capture treatment. Whole-medium physical views are nonadditive; do not infer species or release from residual/SDS/No VOCs."
      inputs:
        - "Actual species/medium"
        - "measured release or compatible activity/factor/composition/fate"
        - "routine/incident owner"
      output: "Identified species mass before division by N"
      source_ids: []
    - id: atomic_child_normalization
      applies_to: "filler_components_complete_formulation; primer_components_complete_formulation; ancillary_mass_cleaner; ancillary_mass_abrasive; ancillary_mass_coating; ancillary_mass_wipe; ancillary_mass_test_consumable; ancillary_area_containment; ancillary_area_compaction_film; ancillary_area_release_film; bounded_provider_engineering; bounded_provider_ndt; bounded_provider_isolation_purge; bounded_provider_access; shared_assets_blast; shared_assets_compressor; shared_assets_measurement; shared_assets_ndt; shared_assets_access; shared_assets_compaction; usable_return_mass_filler; usable_return_mass_primer; usable_return_mass_cleaner; usable_return_mass_abrasive; usable_return_mass_coating; usable_return_mass_fuel; usable_return_length_prepreg; usable_return_area_containment; usable_return_area_compaction_film; usable_return_area_release_film; repair_wastes_coating; repair_wastes_corrosion; repair_wastes_abrasive; repair_wastes_prepreg_offcut; repair_wastes_cured_prepreg; repair_wastes_filler_unmixed; repair_wastes_filler_mixed; repair_wastes_primer_unmixed; repair_wastes_primer_mixed; repair_wastes_consumable; repair_wastes_packaging; repair_wastes_washwater; repair_wastes_test_medium; repair_wastes_fuel"
      rule: "Record independent_physical_quantity separately by atomic_flow_row_id; actual_<row_id>_quantity is its named alias only, never a copied family amount. Materials retain original CP per-identity/state gross/net stock and outward-return conventions; transfers use actual paired custody quantity; usable exits and wastes use independent actual fate quantities. Owned assets use this PCR original job_driver/full_life_driver complete-life asset-equivalent method including manufacture, maintenance, replacement and end of life, with complete every-consumer positive denominator. Purchased services use only actual complete physical tasks whose real contract defines Item(s), with original actual attribution; hours, days and prices cannot become event counts. atomic_child_intensity = independent_physical_quantity / N, where N is unique finally accepted qualified defect repair IDs in Item(s) under the original acceptance rule; N=0 blocks normalization. Non-exchange parent role ledgers and original CP operands retain their stock, transfer, closure and ownership functions, without adding a second exchange or changing the method."
      inputs:
        - atomic_flow_row_id
        - independent_physical_quantity
        - exchange_property
        - exchange_unit
        - N
        - cp_filler_components
        - cp_primer_components
        - cp_ancillary_mass
        - cp_ancillary_length
        - cp_ancillary_area
        - cp_ancillary_count
        - cp_process_medium
        - cp_bounded_provider
        - cp_shared_assets
        - cp_usable_return_mass
        - cp_usable_return_length
        - cp_usable_return_area
