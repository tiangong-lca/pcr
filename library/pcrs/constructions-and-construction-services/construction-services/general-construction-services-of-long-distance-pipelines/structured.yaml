      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| sole_accepted_service | composite_repair | Attribute this bounded campaign to unique positive N accepted repairs with declared design/geometry/system qualifiers; no useful co-product is presumed. Material balances and used/dosed intermediate quantities are nonadditive. |  |\n| stock_supply_view | all inventory rows | For each actual SKU/native unit, attributable supply = opening attributable stock + external net-tare gross receipts - closing carried stock. Upstream supply matches this amount. Internal issue is not a new receipt; closing stock carries its supply burden forward and is not outward return. Gross-with-outlets retains matched usable outward return; consumed-only excludes that return from supply once and never adds a duplicate return credit. Nonreturned waste/loss keeps upstream burden. |  |\n| fuel_outlets | fuel_supply; atomic_identified_releases | Separately reconcile burned fuel, usable nonburned return, nonreturned waste, uncontained loss and closing stock. Burned fuel alone drives compatible combustion factors; it is not upstream supplied fuel. Total spill is audit-only; recovered spill in closing stock is not also loss. |  |\n| repeat_job_burden | composite_repair | All setup, cleaning/changeover, failed attempts, removed rejected layers, repeat cure/tests and defect closure stay with the actual campaign and positive final accepted N. Failed/missing gates produce no accepted output; do not divide by attempts, plies or gross prepared defects. |  |\n| asset_full_life | shared_assets_blast; shared_assets_compressor; shared_assets_measurement; shared_assets_ndt; shared_assets_access; shared_assets_compaction; atomic_shared_assets | For each asset, attributable equivalents = job compatible measured driver / all-consumer complete-life driver. Scope includes manufacture, maintenance, replacements and EOL exactly once across all jobs/nodes/periods. Use complete observed life or observed history plus evidenced remainder, replacement/termination/EOL and uncertainty/sensitivity/update. Missing denominator or omitted consumers blocks finalization. |  |\n| ownership_exclusivity | electricity; fuel_supply; freight; bounded_provider_engineering; bounded_provider_ndt; bounded_provider_isolation_purge; bounded_provider_access; atomic_bounded_provider; shared_assets_blast; shared_assets_compressor; shared_assets_measurement; shared_assets_ndt; shared_assets_access; shared_assets_compaction; atomic_shared_assets | Assign one owner to direct utilities, transport legs, provider/rental equipment, assets and spares. A genuinely bounded provider unit must match completed resources/results and declared upstream coverage; charge uncovered resources directly. Never also add resources already included upstream. Price or hours cannot establish Count. |  |\n| medium_fate_exclusivity | atomic_process_medium; atomic_identified_releases; repair_wastes_coating; repair_wastes_corrosion; repair_wastes_abrasive; repair_wastes_prepreg_offcut; repair_wastes_cured_prepreg; repair_wastes_filler_unmixed; repair_wastes_filler_mixed; repair_wastes_primer_unmixed; repair_wastes_primer_mixed; repair_wastes_consumable; repair_wastes_packaging; repair_wastes_washwater; repair_wastes_test_medium; repair_wastes_fuel; atomic_repair_wastes | Attribute actual consumed/lost process medium upstream once, reconciling capture/reinjection/stock/return/waste/release. Whole-medium physical and species/medium elementary views are nonadditive; no emission from an unexplained residual and no avoided-operation credit. |  |\n\n"
