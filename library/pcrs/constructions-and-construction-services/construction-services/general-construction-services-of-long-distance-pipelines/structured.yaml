published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset; downstream process and lifecyclemodel projections of the accepted bounded service"
  allowed_use: "Actual matching retained steel long-distance external non-leaking metal-loss prepreg repair with disclosed engineered qualifiers, complete job inventory and gate"
  excluded_use: "Universal wrap recipe or repair lifespan; leaking/internal/crack/dent repair; clamp/sleeve; replacement/new pipeline or later transport; avoided replacement credit"
  required_metadata: "Host and defect/design ID; location/date; system/instruction/SKUs; pressure/medium; geometry/lay-up; acceptance; N; stock/view and ownership; period/asset scope; conversions and source versions"
  required_quality_disclosure: "Actual data coverage, calibration, Range evidence, lifecycle/provider completeness, uncertainty/sensitivity, exact flow/support and factor readiness, missing records and conditional absence"
  update_trigger: "Changed defect/design/system/instruction or acceptance gate; actual new SKU/provider identity; stock/fate corrections; new asset history/remainder/replacement/termination/EOL or factors; changed representative job mix"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 explanatory notes (30 June 2025), code 54241; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification context only; narrow category boundary is explicitly authored"
  - id: "csnri-xt-ps-0625"
    type: "literature"
    reference: "CSNRI SynthoGlass XT product sheet PS_0625, complete pp. 1–2; https://www.cs-nri.com/wp-content/uploads/2023/04/CSNRI_PS_SynthoGlass-XT_Web-1.pdf"
    used_for: "Factory glass/PU prepreg, moisture cure, filler/primer/prepreg system roles and conditional technical data only. Set/cure table, ply thickness, hardness and marketing compliance are not universal job quantities or field acceptance."
  - id: "csnri-xt-product-page"
    type: "literature"
    reference: "CSNRI SynthoGlass XT current product page; https://www.cs-nri.com/product/syntho-glass-xt/"
    used_for: "Current product route/application context; does not establish actual design approval, recipe, quantity or reviewed full standards"
  - id: "csnri-transmission-corrosion-case"
    type: "literature"
    reference: "CSNRI, Composites take on air-to-soil interface corrosion on gas; https://www.cs-nri.com/case_study/composites-take-on-air-to-soil-interface-corrosion-on-gas/"
    used_for: "Transmission context, designed repair/preparation and trained installation; mixed technologies and case totals are not XT-only ranges"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:24bb62b6b6cbcc72a13f333c3ed7a6aa97a494f885e86e71e9f4c24b416c452d"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5252"
      family: "system_boundary"
      span:
        start:
          offset: 5252
          line: 56
          column: 1
        end:
          offset: 11507
          line: 85
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Existing exposed supported eligible pipeline defect and retained contents/support, with actual pressure/operating state and approved current design; no excavation or new pipe manufacture |\n| starting_condition_role | Retained host state interface for the bounded repair treatment |\n| product_classification_scope | Only the declared prepreg external metal-loss repair subset within long-distance pipeline construction services |\n| recursive_input_rule | An actual prior same-category repair is disclosed as retained state or an independently bounded purchased service with exact scope; do not recursively repurchase this job or the whole pipeline |\n| upstream_dataset_requirement | Actual compatible supplied prepreg inclusive of resin, component/kit scope, ancillary inputs, attributable lost/consumed medium, utilities/fuel, freight, bounded providers, complete-life assets and actual waste treatment; one owner per covered scope |\n| disclosure | Host/defect/design/system state; contractor/provider ownership; campaign, batch, stock and asset lifecycle periods; actual exclusions, quantities, conversions, gaps, uncertainty and handover evidence |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `scope_eligibility` | foreground_system_boundary | This PCR covers the bounded accepted service of engineered external reinforcement of a non-through-wall, non-leaking external metal-loss defect on an already exposed and supported existing overland long-distance carbon-steel pipeline, using factory-preimpregnated glass-fibre moisture-curing polyurethane wrap, actual approved filler/primer and current project design. The repair contractor owns qualification, preparation, installation, full required cure, applicable inspection/testing, rework and signed handover. The broader manufacturer application list does not widen this subset. The output is an accepted repair service at one uniquely identified defect, not new pipe, reinforcement material production or later fluid transport. Design configurations remain declared qualifiers; a counted repair is not a universal equivalence claim. |  |\n| qualified_host | composite_repair | Start with already exposed supported retained carbon-steel overland long-distance pipeline, qualified non-through-wall non-leaking external metal-loss defect, contents and support state. Existing host manufacture is not bought again. | csnri-xt-ps-0625; csnri-transmission-corrosion-case |\n| design_gate | composite_repair | Current approved engineered design and system instruction must establish defect eligibility, operating/pressure state, surface profile/cleanliness, filler/primer compatibility, activation, wrap dimensions/plies/overlap/direction and applicable full-cure/inspection/test criteria before signed acceptance. Brochure compliance is not a full standard review or universal approval. | csnri-xt-ps-0625; csnri-xt-product-page |\n| embedded_route | composite_repair | Qualification, preparation, embedded component mixing/placement and moisture cure form one repair treatment responsibility. There is no independently handed-off formulation, reaction or assembly product; include all their resources and residues here. | csnri-xt-ps-0625 |\n| operating_interface | composite_repair | Own actual repair-induced isolation, drain, depressurisation, purge, restoration and tests, including provider-paid supplies, utilities and medium fate. Retained contents are state interfaces; actual consumed/lost contents carry upstream supply once. No leakage does not prove no job-induced release. |  |\n| prepreg_system | prepreg_length; prepreg_length; prepreg_length; prepreg_length; filler_components_complete_formulation; atomic_filler_components; primer_components_complete_formulation; atomic_primer_components | Factory glass/PU prepreg is purchased once inclusive of resin. Use actual compatible system filler and primer; kit versus component purchases are exclusive but A/B physical dosing and mixed/cured/waste states remain reconciled. | csnri-xt-ps-0625 |\n| complete_resources | all inventory rows | Own every actual preparation/abrasive/cleaning/activation/containment/compaction/curing/test input, water, utility, direct fuel, freight, bounded provider and asset scope. Unknown is a gap; conditional zero requires actual absence evidence. Packaging, residues, wash/test water and releases retain their destinations. |  |\n| run_period_boundary | composite_repair | Index job/defect batches, preparation/installation/cure/test/rework dates, opening and closing stock periods; link setup, cleaning and changeover to the producing campaign. Asset scope spans manufacture, use/maintenance/replacements, termination and EOL across all consuming jobs/nodes/periods. |  |\n| rework_exit | composite_repair | Failed surface qualification, incorrect lay-up, incomplete cure and failed acceptance remain unaccepted. Reinspect/reprepare/remove/reapply/recure/retest inside composite_repair; link actual removed rejected material to repair_wastes, actual usable returns to their native outputs and identified releases to their events. |  |\n| medium_disjoint_outlets | atomic_process_medium; atomic_identified_releases | Use disjoint whole-medium final outlets: opening + external_supply = closing + usable_outward_return + consumed_transformed + collected_waste + uncontained_loss. Closing includes all retained/recovered stock. Captured/reinjected and used/dosed quantities are intermediate audit views, not extra final outlets; vented is a subset of uncontained_loss, not an additional outlet. Never subtract capture plus reinjection/return/closing, or vented plus loss, twice. Job-attributed medium upstream supply and species/medium elementary releases remain separate nonadditive views. |  |\n| scope_exclusions | composite_repair | Exclude leaking/through-wall or internal-defect/crack/dent/weld repair, urban mains, plant-only piping, sleeves/clamps, wet-lay-up carbon/epoxy, hot/postcure routes, pipe replacement, excavation/backfill, new pipeline and later product transport. No avoided replacement/new-pipeline or downstream transport credit. |  |\n\n"
