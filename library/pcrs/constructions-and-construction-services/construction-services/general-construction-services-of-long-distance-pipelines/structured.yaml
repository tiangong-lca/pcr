product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.general-construction-services-of-long-distance-pipelines"
  classification_refs: "CPC 3.0 54241 — General construction services of long-distance pipelines; proposed narrower coverage"
  covered_products: "Accepted engineered prepreg glass/PU external metal-loss reinforcement of retained long-distance carbon-steel pipe"
  excluded_products: "Leaking/through-wall, internal defect, crack/dent/weld repair; urban mains; plant-only piping; sleeve/clamp; carbon/epoxy wet lay-up; hot/postcure route; replacement/new pipeline; excavation/backfill; later transport operation"
  representative_product: "Qualified non-leaking external corrosion repair using XT-FP type factory prepreg and approved compatible filler/primer"
  production_route: "Inspect/design and control operating state → surface preparation → actual filler/primer → activation/engineered lay-up/compaction → full required moisture cure → required inspection/tests/rework → signed acceptance"
  market_state: "Site-specific completed and signed accepted repair service on retained exposed pipeline"
functional_unit:
  what: "Accepted engineered external metal-loss composite wrap repair of retained long-distance steel pipeline"
  how_much: "1 Item(s)"
  how_well: "Current approved engineered defect eligibility, geometry, system, lay-up and full-cure/inspection/test requirements with signed final acceptance"
  how_long_or_cycle: "One declared repair campaign including setup/rework through final acceptance; record phase dates and stock periods, and complete reusable asset lifecycle phases across all consuming jobs/periods; no guaranteed repair life"
  reference_flow_link: "accepted_repair"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers the bounded accepted service of engineered external reinforcement of a non-through-wall, non-leaking external metal-loss defect on an already exposed and supported existing overland long-distance carbon-steel pipeline, using factory-preimpregnated glass-fibre moisture-curing polyurethane wrap, actual approved filler/primer and current project design. The repair contractor owns qualification, preparation, installation, full required cure, applicable inspection/testing, rework and signed handover. The broader manufacturer application list does not widen this subset. The output is an accepted repair service at one uniquely identified defect, not new pipe, reinforcement material production or later fluid transport. Design configurations remain declared qualifiers; a counted repair is not a universal equivalence claim."
      source_ids: []
    - rule_id: qualified_host
      applies_to: "composite_repair"
      rule: "Start with already exposed supported retained carbon-steel overland long-distance pipeline, qualified non-through-wall non-leaking external metal-loss defect, contents and support state. Existing host manufacture is not bought again."
      source_ids:
        - csnri-xt-ps-0625
        - csnri-transmission-corrosion-case
    - rule_id: design_gate
      applies_to: "composite_repair"
      rule: "Current approved engineered design and system instruction must establish defect eligibility, operating/pressure state, surface profile/cleanliness, filler/primer compatibility, activation, wrap dimensions/plies/overlap/direction and applicable full-cure/inspection/test criteria before signed acceptance. Brochure compliance is not a full standard review or universal approval."
      source_ids:
        - csnri-xt-ps-0625
        - csnri-xt-product-page
    - rule_id: embedded_route
      applies_to: "composite_repair"
      rule: "Qualification, preparation, embedded component mixing/placement and moisture cure form one repair treatment responsibility. There is no independently handed-off formulation, reaction or assembly product; include all their resources and residues here."
      source_ids:
        - csnri-xt-ps-0625
    - rule_id: operating_interface
      applies_to: "composite_repair"
      rule: "Own actual repair-induced isolation, drain, depressurisation, purge, restoration and tests, including provider-paid supplies, utilities and medium fate. Retained contents are state interfaces; actual consumed/lost contents carry upstream supply once. No leakage does not prove no job-induced release."
      source_ids: []
    - rule_id: prepreg_system
      applies_to: "prepreg_length; prepreg_length; prepreg_length; prepreg_length; filler_components_complete_formulation; atomic_filler_components; primer_components_complete_formulation; atomic_primer_components"
      rule: "Factory glass/PU prepreg is purchased once inclusive of resin. Use actual compatible system filler and primer; kit versus component purchases are exclusive but A/B physical dosing and mixed/cured/waste states remain reconciled."
      source_ids:
        - csnri-xt-ps-0625
    - rule_id: complete_resources
      applies_to: "all inventory rows"
      rule: "Own every actual preparation/abrasive/cleaning/activation/containment/compaction/curing/test input, water, utility, direct fuel, freight, bounded provider and asset scope. Unknown is a gap; conditional zero requires actual absence evidence. Packaging, residues, wash/test water and releases retain their destinations."
      source_ids: []
    - rule_id: run_period_boundary
      applies_to: "composite_repair"
      rule: "Index job/defect batches, preparation/installation/cure/test/rework dates, opening and closing stock periods; link setup, cleaning and changeover to the producing campaign. Asset scope spans manufacture, use/maintenance/replacements, termination and EOL across all consuming jobs/nodes/periods."
      source_ids: []
    - rule_id: rework_exit
      applies_to: "composite_repair"
      rule: "Failed surface qualification, incorrect lay-up, incomplete cure and failed acceptance remain unaccepted. Reinspect/reprepare/remove/reapply/recure/retest inside composite_repair; link actual removed rejected material to repair_wastes, actual usable returns to their native outputs and identified releases to their events."
      source_ids: []
    - rule_id: medium_disjoint_outlets
      applies_to: "atomic_process_medium; atomic_identified_releases"
      rule: "Use disjoint whole-medium final outlets: opening + external_supply = closing + usable_outward_return + consumed_transformed + collected_waste + uncontained_loss. Closing includes all retained/recovered stock. Captured/reinjected and used/dosed quantities are intermediate audit views, not extra final outlets; vented is a subset of uncontained_loss, not an additional outlet. Never subtract capture plus reinjection/return/closing, or vented plus loss, twice. Job-attributed medium upstream supply and species/medium elementary releases remain separate nonadditive views."
      source_ids: []
    - rule_id: scope_exclusions
      applies_to: "composite_repair"
      rule: "Exclude leaking/through-wall or internal-defect/crack/dent/weld repair, urban mains, plant-only piping, sleeves/clamps, wet-lay-up carbon/epoxy, hot/postcure routes, pipe replacement, excavation/backfill, new pipeline and later product transport. No avoided replacement/new-pipeline or downstream transport credit."
      source_ids: []
