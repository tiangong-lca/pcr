      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| eligibility_and_gate | accepted_repair | Verify retained long-distance carbon-steel non-leaking external metal loss and approved design/instruction; block accepted output for ineligible defect, missing qualification, incomplete full cure, failed required test or unsigned acceptance. | csnri-xt-ps-0625 |\n| count_denominator | all inventory rows | N must be positive, unique finally accepted defect IDs with the same declared campaign/qualifiers; compare all normalized quantities against N and prevent layer/roll/attempt duplication. |  |\n| native_stock_reconcile | all inventory rows | Check SKU/unit-exclusive supply/return views, complete opening-receipt-closing-outlet reconciliation, prepreg resin inclusion, kit/component exclusivity, component dosing and installed/retained versus waste/release states; unresolved balance blocks finalization. |  |\n| run_rework_linkage | composite_repair | Check batch/event/period links for setup, cleaning, changeover, failed material removal, reapplication, recure and retest; no rejected repair may enter N or leave without a declared path. |  |\n| asset_period_coverage | shared_assets_blast; shared_assets_compressor; shared_assets_measurement; shared_assets_ndt; shared_assets_access; shared_assets_compaction; atomic_shared_assets | Check every consumer and lifecycle phase/period including remainder/replacements/termination/EOL, compatible driver and complete denominator with sensitivity/update. Missing coverage or duplicate manufacture/maintenance/rental/provider scope blocks finalization. |  |\n| species_fate | atomic_identified_releases | Check substance/species and receiving medium, routine/incident owner, actual measurement or matched activity-factor/composition-fate, fuel burn separation and captured/returned/waste exclusions. No VOCs/SDS/stock residual cannot establish zero or identity. |  |\n| range_scope | all inventory rows | Require actual role-specific Range evidence before final quantity. Brochure temperatures, ply/hardness/cure times and mixed-technology case totals are not generic consumption/yield or acceptance defaults. Set time is not full cure. | csnri-xt-ps-0625 |\n| exchange_readiness | all inventory rows | Every final exchange requires actual concrete verified identity, support property/unit and primary quantity/coverage evidence. Conditional actual absence may be documented; unknown is incomplete. Automated target checks alone do not verify identities or publication readiness. |  |\n| close_atomic_filler_components | composite_repair; cp_filler_components | Block final foreground completion until every actual object in atomic_filler_components is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_primer_components | composite_repair; cp_primer_components | Block final foreground completion until every actual object in atomic_primer_components is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_ancillary_mass | composite_repair; cp_ancillary_mass | Block final foreground completion until every actual object in atomic_ancillary_mass is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_ancillary_length | composite_repair; cp_ancillary_length | Block final foreground completion until every actual object in atomic_ancillary_length is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_ancillary_area | composite_repair; cp_ancillary_area | Block final foreground completion until every actual object in atomic_ancillary_area is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_ancillary_count | composite_repair; cp_ancillary_count | Block final foreground completion until every actual object in atomic_ancillary_count is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_process_medium | composite_repair; cp_process_medium | Block final foreground completion until every actual object in atomic_process_medium is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_bounded_provider | composite_repair; cp_bounded_provider | Block final foreground completion until every actual object in atomic_bounded_provider is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_shared_assets | composite_repair; cp_shared_assets | Block final foreground completion until every actual object in atomic_shared_assets is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_usable_return_mass | composite_repair; cp_usable_return_mass | Block final foreground completion until every actual object in atomic_usable_return_mass is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_usable_return_length | composite_repair; cp_usable_return_length | Block final foreground completion until every actual object in atomic_usable_return_length is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_usable_return_area | composite_repair; cp_usable_return_area | Block final foreground completion until every actual object in atomic_usable_return_area is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_usable_return_count | composite_repair; cp_usable_return_count | Block final foreground completion until every actual object in atomic_usable_return_count is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_repair_wastes | composite_repair; cp_repair_wastes | Block final foreground completion until every actual object in atomic_repair_wastes is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_identified_releases | composite_repair; cp_identified_releases | Block final foreground completion until every actual object in atomic_identified_releases is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| atomic_pair_provenance_complete | actual internal child source and recipient transfers | Verify actual source/receipt evidence, original physical quantities/units and ownership for the same material/state/event/gate. Traceable reuse of the same signed measurement is allowed; copied parent totals, overwritten receipts and forced unknown equality are prohibited. Unexplained differences without uncertainty, actual loss or state-transition responsibility evidence block completion; verify exactly one normalization per card. |  |\n\n"
