system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers one bounded repair intervention on one qualified localised hole or pinhole in an already exposed, secured existing cast-iron local potable-water main. A compatible factory-made single-section stainless full-circle gasketed clamp is installed after utility-authorised isolation and depressurisation. Incremental cleaning, compatible lubrication, positioning, staged tightening and retightening, required pressure/leak verification and hygienic closure form the service through signed repair acceptance. The existing main is retained. The representative route uses an actually approved SS1-type single-section assembly with its actual standard SBR gasket unless another actual compatible compound is specified. The Romac sources illustrate that route; they do not prescribe a brand, universal torque, pressure, repairable defect size or every-SKU potable certification. Actual current approved regional instructions, utility requirements and site conditions govern. The Ontario 2020 procedure is a dated official technical example; its webpage update date does not establish universal or current project law. Do not apply an exception for maintained-flow repair sleeves automatically to this depressurised route. Exclude new pipelines and laterals, sewers/gas/steam, long-distance mains, pipe replacement, live-pressure installation, tapping or outlet connections, coupling separated pipe ends, sheared/unsupported structural breaks, whole trench excavation and reinstatement, water distribution operation and subsequent maintenance. Required closure tests must be completed or supplied through an explicitly bounded provider whose actual resources/results are included before the final gate; an unowned future test cannot produce accepted output."
      source_ids: []
    - rule_id: boundary_host
      applies_to: "prepare_host"
      rule: "Accept exposed secured retained cast iron only after actual OD/defect/condition and clamp compatibility review; clean dirt/corrosion from the intended seal area without inventing new pipe input. Job-caused damage/remedy belongs its actual owner and blocks handoff until resolved."
      source_ids:
        - romac-install-2024
        - romac-submittal-2024
    - rule_id: boundary_interfaces
      applies_to: "Both nodes and external interfaces"
      rule: "Whole excavation/reinstatement remain with declared corridor/trench owner. Incremental protection and hygiene needed during repair, including continued dewatering where required, must have actual resource owner; purchased bounded support included only once. No invented excavation node."
      source_ids:
        - un-cpc3-2025
        - ontario-watermain-2020
    - rule_id: boundary_components
      applies_to: "install_accept"
      rule: "Retained qualified host and supplied complete clamp/gasket assembly have different roles. Count shell, bolts, gasket, factory lubricant/coating and packaging already within the assembly dataset once; record only actual separate replacement or additional supplies. No clamp as coupling or tapped outlet."
      source_ids:
        - romac-install-2024
        - romac-submittal-2024
    - rule_id: boundary_mechanical
      applies_to: "install_accept"
      rule: "Verify actual size/range, flat clean gasket tails, defect centring, suitable lubricant, prescribed staged uniform torque and retorque using actual current SKU instructions; actual pressure/leak criterion and pre-concealment test passed before repair release."
      source_ids:
        - romac-install-2024
    - rule_id: boundary_hygiene
      applies_to: "install_accept"
      rule: "Utility declares adopted authority/edition, contamination classification, permitted disinfection/flushing/sampling/neutralisation and release criteria/providers. Include all actual mandatory tests/results/resources before signed bounded acceptance; actual further utility return-to-service responsibility explicit. A permitted sampling waiver requires documented applicability, not assumed clean water or pressurised-sleeve exemption."
      source_ids:
        - ontario-watermain-2020
    - rule_id: boundary_baseline
      applies_to: "Retained main; operational water; repair cycle"
      rule: "Old-main manufacture and pre-start operational leakage are outside this incremental repair boundary; no avoided replacement or avoided water-loss credit. Incremental drain/flush/test water and job releases after start are accounted."
      source_ids: []
    - rule_id: boundary_periods
      applies_to: "Assets, stocks, jobs and service providers"
      rule: "Index preparation, installation, cleaning, retest and acceptance events by job/node/period. Include attributable complete-life tool/pump/protection resource manufacture, maintenance, replacements and EOL, excluding separately inventoried operation and bundled resources."
      source_ids: []
