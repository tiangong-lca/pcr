      evidence: "cp_p_utilities; actual independent records and identity/unit evidence"
    - id: refine_prep_assets
      applies_to: "prep_assets_cleaning_tool; prep_assets_pump"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Represent the preparation share of actual reusable cleaning tools, pumps and access/protection assets with manufacture, maintenance, replacements and EOL covered across all consumers. Direct operation and provider-included tools are excluded from duplicate life burdens. Range evidence need: Actual asset IDs, life coverage, compatible service driver and all consumer/period totals required; justified prospective in-service remaining life and uncertainty allowed, no invented lifetime. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual access/protection apparatus and multiple cleaning-tool functions/models require their own exact whole-asset or compatible native-service references and complete-life all-consumer drivers; exclude operation/provider-bundled duplication."
