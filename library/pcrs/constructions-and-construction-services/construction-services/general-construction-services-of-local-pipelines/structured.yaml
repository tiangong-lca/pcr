    - id: refine_prep_solid_waste
      applies_to: "prep_solid_waste_corrosion_dirt; prep_solid_waste_cloth"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Separate removed corrosion/dirt, contaminated cloths, packaging and any actual fuel-containing waste by composition, hazard and receiving waste route. Retained pipe is not demolition waste. Range evidence need: Actual waste manifest, composition/moisture and receiver/treatment evidence required; no default iron scrap or recycling credit. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual packaging, fuel-containing waste, liners, absorbents and other hazard/receiver streams require own identities; retained main is not demolition waste."
