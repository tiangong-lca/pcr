allocation_rules:
  - rule_id: allocation_repair
    applies_to: "All repair-cycle resources"
    rule: "Attribute directly to unique repair ID where possible; setup, failed clamps, cleaning, retorque and repeated tests remain over accepted N. Do not create co-products, accepted counts or displacement credit from rejected work or recovered waste."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "Shared crews, equipment and bounded providers"
    rule: "Identify all consuming jobs/nodes/periods and physical service driver; use measured driver shares that sum to the declared total. Reconcile shared-run setup, travel/empty return, hygiene and cleanup once. Purchased-provider bundles exclude duplicate direct resources."
    source_ids: []
  - rule_id: allocation_asset_life
    applies_to: "prep_assets_cleaning_tool; prep_assets_pump; install_assets_torque_wrench; install_assets_test_pump"
    rule: "Allocate complete-life burdens by evidenced target service divided by total compatible life service across all jobs/nodes/periods. Observed completed life or justified prospective in-service remaining service/replacement/termination/EOL scenario with uncertainty and updates is required; missing denominator or life coverage blocks finalisation. No default lifetime or future observed retirement requirement."
    source_ids: []
  - rule_id: allocation_stock
    applies_to: "Supplies, returns and retained stock"
    rule: "Gross input exchanges precede actual outward returns. Closing retained stock is a balance with carried-forward upstream burden, never an outward exchange. Opening stock brings its evidenced carried-in burden; purchase receipt/internal issue are alternative boundaries, not duplicates. Keep separate SKU-count and material-mass ledgers. Reconcile receipt or issue against final retained installation/destinations, real outward returns, captured waste, actual releases and closing stock. Final retained destinations exclude separately logged losses/outlets; dosed/used activity is intermediate, not another additive outlet. Reconcile upstream burden on that same custody basis."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_p_host
      process_id: "prepare_host"
      flow_role: "retained/qualified host and accepted repair state"
      record_type: "inspection_and_acceptance_record"
      raw_fields: "repair_id; defect_id; work_order_id; event_id; node_id; period_id; provider_id; bundle_scope; accepted_count_N; transfer_id; pipe_OD_mm; host_condition; defect_extent_mm; pipe_material; local_main_function; isolation_record; depressurisation_record; hygiene_authority_edition; contamination_class; clamp_SKU; gasket_compound; potable_document; torque_instruction_edition; torque_values_units; retorque_times; pressure_test_criterion_units; pressure_test_result; hygiene_criteria; sample_result; closure_owner; reinstatement_owner; utility_release_owner; acceptance_status; acceptance_signature; gate_time"
      collection_method: "Verify actual utility-authorised starting condition, qualified handoffs and final release against approved current product and adopted-authority instructions; pair transfer IDs and deduplicate unique final accepted repair IDs. Retain failed/repeated event links."
      unit: "Item(s)"
      frequency: "Every defect, transfer, attempt and final gate"
      temporal_coverage: "Declared work-order start through accepted gate including loops; reporting/asset periods linked"
      site_scope: "Actual repair site and declared provider/supply gates; external interfaces named"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed inspection, actual SKU/approval/torque/pressure/hygiene results and explicit owners; no paper-only future closure"
    - protocol_id: cp_p_materials
      process_id: "prepare_host"
      flow_role: "supplies returns stock and upstream burden custody"
      record_type: "lot_custody_record"
      raw_fields: "repair_id; defect_id; work_order_id; event_id; node_id; period_id; provider_id; bundle_scope; accepted_count_N; lot_id; product_identity; formulation; concentration_value; concentration_basis; SKU; quantity_count; gross_mass_kg; tare_kg; net_mass_kg; volume_L; density_kg_per_L; temperature_C; physical_state; opening_stock_count; closing_stock_count; receipts_count; final_retained_count; outward_returns_count; discarded_count; opening_stock_kg; opening_burden_reference; receipts_kg; issues_kg; dosed_activity_kg; final_retained_destination_kg; outward_returns_kg; waste_kg; whole_release_kg; closing_stock_kg; closing_burden_reference; receiver; return_acceptance; upstream_gate; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Weigh actual net contents after tare before real outward returns; retain actual count per clamp SKU. Reconcile receipt or issue boundary, opening burden and closing carried burden; match real return tickets. Actual chemical formulation/concentration/compatibility needed before concrete exchanges. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg; Item(s); L"
      frequency: "Every lot, issue, return, use and period stock closure"
      temporal_coverage: "Declared work-order start through accepted gate including loops; reporting/asset periods linked"
      site_scope: "Actual repair site and declared provider/supply gates; external interfaces named"
      aggregation_rule: "per reference flow"
