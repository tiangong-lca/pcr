published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset; downstream process/lifecyclemodel projection of the foreground repair package"
  allowed_use: "Declared single-defect exposed cast-iron local potable-main clamp repair subset with matching route/quality/gate qualifiers"
  excluded_use: "Whole pipeline construction/operation; live-pressure or tapping/coupling route; pipe replacement; unsupported life or watertightness equivalence; unaccepted work"
  required_metadata: "Unique repair and defect IDs; local potable-water main function; retained cast-iron OD, condition and supported defect extent; actual single-section clamp SKU/range/length/gasket and potable certification; authorised isolation/depressurisation; contamination classification and adopted authority/instruction editions; actual torque/retorque, pressure/leak and hygiene criteria/results/providers; gate and handback owners; reporting/job/asset periods."
  required_quality_disclosure: "Providers/interfaces, actual closure criteria/results, uncertainty, missing identities, measured versus calculated records, reject loops, stock/burden bridges, asset-life scenarios, temporal/geographical/technology coverage and excluded services"
  update_trigger: "Changed approved clamp/gasket/potable documents, host/defect/pressure, adopted hygiene authority, provider/boundary, evidence, asset scenario, supply mix or release criterion"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UN CPC3 explanatory notes 30 June 2025, printed p286; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Local main repair subset and trenching exclusion"
  - id: "romac-ss1"
    type: "handbook"
    reference: "Romac SS1 official product page; https://www.romac.com/ss1"
    used_for: "Full-circle cast-iron-compatible single-section route; actual size/pressure/certification applicability; no universal BOM"
  - id: "romac-install-2024"
    type: "handbook"
    reference: "Romac document10-9-0036, 20 November 2024, pp1-2; https://www.romac.net/Installation-Instructions/SS123-install.pdf"
    used_for: "Cleaning/lubricant, centring/gasket seating, staged torque/retorque, leak test before backfill and no coupling"
  - id: "romac-submittal-2024"
    type: "handbook"
    reference: "Romac document10-8-0014, 3 December 2024, p1; https://www.romac.net/Submittals/CLAMPS/ss1-2-3-sub.pdf"
    used_for: "Factory assembly, SBR standard gasket and upon-request NSF61/372; actual BOM/edition confirmation"
  - id: "ontario-watermain-2020"
    type: "official_guidance"
    reference: "Ontario 2020 Watermain disinfection procedure, August2020, preface and sections2-3; https://www.ontario.ca/page/water-main-disinfection-procedure"
    used_for: "Dated technical example of utility contamination classification, hygiene/flushing/sampling/dechlorination, repair records and authorised return-to-service responsibilities; actual adopted authority governs"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:34a06938cb1b3e222a8551fde01ff8c4f6eebff028aeb0c3219d548d72d64277"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6231"
      family: "system_boundary"
      span:
        start:
          offset: 6231
          line: 60
          column: 1
        end:
          offset: 12140
          line: 86
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Existing exposed secured cast-iron local potable-water main with identified local defect; utility-authorised isolation/depressurisation, access and contamination preconditions declared |\n| starting_condition_role | Retained host state only; no new upstream main production burden; incremental preparation and job-caused remedies remain included |\n| product_classification_scope | Bounded repair subset of local pipeline construction services; excavation belongs separate trenching responsibility |\n| recursive_input_rule | Do not recursively replace this repair service with a whole-main production dataset. Same-category purchased repair support requires a non-overlapping bounded gate and actual provider evidence. |\n| upstream_dataset_requirement | Actual complete clamp assembly and separately supplied consumables/services/resources at real supplier gate; complete-life assets and actual transport included once; included packaging/components/services excluded from duplicate rows |\n| disclosure | Name utility, access/trench-dewatering owner, preparation and installation providers, closure/test provider, reinstatement owner and authorised utility handback owner; identify job/event/reporting periods and excluded interfaces. |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `scope_eligibility` | foreground_system_boundary | This PCR covers one bounded repair intervention on one qualified localised hole or pinhole in an already exposed, secured existing cast-iron local potable-water main. A compatible factory-made single-section stainless full-circle gasketed clamp is installed after utility-authorised isolation and depressurisation. Incremental cleaning, compatible lubrication, positioning, staged tightening and retightening, required pressure/leak verification and hygienic closure form the service through signed repair acceptance. The existing main is retained. The representative route uses an actually approved SS1-type single-section assembly with its actual standard SBR gasket unless another actual compatible compound is specified. The Romac sources illustrate that route; they do not prescribe a brand, universal torque, pressure, repairable defect size or every-SKU potable certification. Actual current approved regional instructions, utility requirements and site conditions govern. The Ontario 2020 procedure is a dated official technical example; its webpage update date does not establish universal or current project law. Do not apply an exception for maintained-flow repair sleeves automatically to this depressurised route. Exclude new pipelines and laterals, sewers/gas/steam, long-distance mains, pipe replacement, live-pressure installation, tapping or outlet connections, coupling separated pipe ends, sheared/unsupported structural breaks, whole trench excavation and reinstatement, water distribution operation and subsequent maintenance. Required closure tests must be completed or supplied through an explicitly bounded provider whose actual resources/results are included before the final gate; an unowned future test cannot produce accepted output. |  |\n| `boundary_host` | `prepare_host` | Accept exposed secured retained cast iron only after actual OD/defect/condition and clamp compatibility review; clean dirt/corrosion from the intended seal area without inventing new pipe input. Job-caused damage/remedy belongs its actual owner and blocks handoff until resolved. | `romac-install-2024`; `romac-submittal-2024` |\n| `boundary_interfaces` | Both nodes and external interfaces | Whole excavation/reinstatement remain with declared corridor/trench owner. Incremental protection and hygiene needed during repair, including continued dewatering where required, must have actual resource owner; purchased bounded support included only once. No invented excavation node. | `un-cpc3-2025`; `ontario-watermain-2020` |\n| `boundary_components` | `install_accept` | Retained qualified host and supplied complete clamp/gasket assembly have different roles. Count shell, bolts, gasket, factory lubricant/coating and packaging already within the assembly dataset once; record only actual separate replacement or additional supplies. No clamp as coupling or tapped outlet. | `romac-install-2024`; `romac-submittal-2024` |\n| `boundary_mechanical` | `install_accept` | Verify actual size/range, flat clean gasket tails, defect centring, suitable lubricant, prescribed staged uniform torque and retorque using actual current SKU instructions; actual pressure/leak criterion and pre-concealment test passed before repair release. | `romac-install-2024` |\n| `boundary_hygiene` | `install_accept` | Utility declares adopted authority/edition, contamination classification, permitted disinfection/flushing/sampling/neutralisation and release criteria/providers. Include all actual mandatory tests/results/resources before signed bounded acceptance; actual further utility return-to-service responsibility explicit. A permitted sampling waiver requires documented applicability, not assumed clean water or pressurised-sleeve exemption. | `ontario-watermain-2020` |\n| `boundary_baseline` | Retained main; operational water; repair cycle | Old-main manufacture and pre-start operational leakage are outside this incremental repair boundary; no avoided replacement or avoided water-loss credit. Incremental drain/flush/test water and job releases after start are accounted. |  |\n| `boundary_periods` | Assets, stocks, jobs and service providers | Index preparation, installation, cleaning, retest and acceptance events by job/node/period. Include attributable complete-life tool/pump/protection resource manufacture, maintenance, replacements and EOL, excluding separately inventoried operation and bundled resources. |  |\n\n"
