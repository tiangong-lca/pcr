      collection_method: "Meter actual energy by node/event and reconcile fuel stock, gross/consumed boundary and mutually exclusive unburned outlets. Incident total spill audits its partitions only. Direct combustion uses actual compatible factor or species measurement; included provider/energy emissions are excluded. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion. Upstream fuel product input retains all attributable supplied fuel, including nonreturned unburned waste and uncontained release. A net-used supply convention may subtract only evidenced retained stock and real usable outward returns under the stock bridge, never captured unburned waste or environmental loss. A gross-input convention retains exclusive actual outlets and the linked upstream-burden custody bridge. Burned activity is derived independently from compatible tank/event stock, receipts and all disjoint unburned fates; a burned-only supply input is permitted only if evidenced nonreturned unburned waste and release are both absent after stock and return reconciliation. Unknown outlet or unexplained loss remains a gap, not presumed combustion."
