      evidence: "cp_i_materials; actual independent records and identity/unit evidence"
    - id: refine_install_fuel
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Specify fuel/equipment/owner and Upstream fuel product input retains all attributable supplied fuel, including nonreturned unburned waste and uncontained release. A net-used supply convention may subtract only evidenced retained stock and real usable outward returns under the stock bridge, never captured unburned waste or environmental loss. A gross-input convention retains exclusive actual outlets and the linked upstream-burden custody bridge. Burned activity is derived independently from compatible tank/event stock, receipts and all disjoint unburned fates; a burned-only supply input is permitted only if evidenced nonreturned unburned waste and release are both absent after stock and return reconciliation. Unknown outlet or unexplained loss remains a gap, not presumed combustion. Unburned return, captured waste and whole uncontained fluid do not become burned fuel. Range evidence need: Actual fuel purchase/issue/stock/burned allocation, return/waste/release and provider scope required; no default fuel/density or empty-vehicle cargo. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Each actual carrier/grade gets one property/unit upstream product; retain supplied nonreturned losses independent of measured burn, stock/usable outward return/captured waste/whole uncontained-fluid fates."
      evidence: "cp_i_utilities; actual independent records and identity/unit evidence"
    - id: refine_install_assets
      applies_to: "install_assets_torque_wrench; install_assets_test_pump"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Actual reusable torque wrench, test pump, sampling/backflow/protection apparatus share includes compatible full-life manufacture/maintenance/replacements/EOL. Exclude directly modelled fuel/electricity and provider-bundled assets from double burden. Range evidence need: Actual calibration/asset IDs, service driver, all consumers and life coverage plus prospective scenario/uncertainty for in-service assets required; no default lifetime. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual sampling/backflow/protection apparatus functions/models need exact separate records; preserve complete-life/all-consumer manufacture/maintenance/replacements/EOL, exclude direct operation and provider package duplicates."
      evidence: "cp_i_assets; actual independent records and identity/unit evidence"
    - id: refine_closure_provider
      applies_to: "closure_provider_pressure_test; closure_provider_hygiene; closure_provider_sampling; closure_provider_laboratory; closure_provider_neutralisation"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Each concrete Count exchange is one actually counted bounded provider-service event with its own service ID, declared completed activity/gate and provider reference flow/property/unit compatible with Count/Item(s). Activities may include utility protection/dewatering, pressure/leak testing, hygiene, sampling/laboratory or neutralisation. Declare actual included resources/results and exclude them from duplicate direct cards. A provider whose actual reference flow/property uses another physical unit requires its own matching concrete exchange/property/unit; it cannot silently fit this Count card. Range evidence need: Actual counted event IDs, provider gate/reference property and unit, contract, primary resources and passed criteria required. Arbitrary provider units or paper-only future tests cannot substitute for a counted completed event. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual utility protection and dewatering are distinct functions requiring separate exact reference; any service not actually Count-referenced must use its own matching physical property/unit. Include provider resources/results once."
      evidence: "cp_i_closure; actual independent records and identity/unit evidence"
    - id: refine_install_consumables
      applies_to: "install_consumables_absorbent; install_consumables_liner; install_consumables_cloth; install_consumables_sample_bottle"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditionally include actual unbundled absorbents, spill containment liners, cleaning cloths, protective disposables, sample bottles/reagents and other consumed installation/test/cleanup supplies. Split by actual material/formulation/provider; exclude only supplies demonstrably included in another input or bounded provider package. Reusable apparatus belongs to assets. Range evidence need: Actual material/SKU, supplier/package scope, net mass/tare and custody/stock records required; no presumption provider included these supplies or universal dose. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual protective disposable products/reagents/other cleanup supplies require SKU/formulation/property/unit; exclude only demonstrably included provider supplies, reusable apparatus in assets."
      evidence: "cp_i_materials; actual independent records and identity/unit evidence"
    - id: refine_install_returns
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Only actual outward custody transfers of unused lubricant, disinfection/neutralisation formulations, other mass-based consumables or unburned fuel at their actual product state qualify. Excludes complete-clamp returns, which have a separate Count card. Retain lot and original gross-input burden bridge; closing retained stock is not output. Range evidence need: Actual mass-based return ticket, recipient acceptance/state, net weight/tare and lot/burden evidence required; no return fraction or clamp count-to-mass default. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual usable outward product/lot/state/receiver/native unit with gross-input burden bridge; retained stock excluded, complete clamp returns separate."
      evidence: "cp_i_materials; actual independent records and identity/unit evidence"
    - id: refine_install_solid_waste
      applies_to: "install_solid_waste_failed_clamp; install_solid_waste_cloth"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Actual failed/replaced clamps, separate spent parts, packaging, contaminated disposables, sample wastes and captured fuel-containing waste are split by composition/hazard/receiver. Do not count retained pipe as new demolition waste or duplicate provider-treated waste. Range evidence need: Actual manifests, weights, composition/moisture, treatment destination and reject disposition required; no default scrap yield or avoided steel credit. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual separate spent parts, packaging, liners/absorbents, other disposables, sample waste and captured fuel-containing waste require actual composition/hazard/receiver records; no old-main demolition or provider-treated duplicate."
      evidence: "cp_i_residuals; actual independent records and identity/unit evidence"
    - id: refine_install_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record whole uncontained fluid in physical balance, then actual elementary species to actual air/water/soil receiver. Discharged residual disinfectant differs from dosed solution/active chlorine; reaction, retention, capture and neutralisation require actual evidence. Whole-fluid mass is retained solely as a physical balance operand; any direct elementary water exchange requires its own actual water identity, receiver, property and verified quantity rather than a generic mixture flow. Range evidence need: Actual outlet/receiver/species, concentration basis, detection limits, volume/state, reaction/neutralisation and collection records required; no unexplained-residual emission or automatic zero. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_i_residuals; actual independent records and identity/unit evidence"
    - id: refine_install_combustion
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Direct fuel combustion emissions require actual fuel/equipment/substance/abatement and receiver; provider/purchased-energy included emissions are excluded from direct duplication. Range evidence need: Actual fuel/equipment/factor or measured species evidence and physical burned/outlet balance required; no broad pollutant near-match UUID or default factor. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_i_utilities; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
validation_rules:
  - rule_id: validate_qualification
    applies_to: "prepare_host; host_to_install"
    rule: "Reject unqualified host, unsupported defect/OD/clamp fit, missing authorised isolation/depressurisation or unresolved job-caused damage; retain clean seat and transfer evidence."
    source_ids:
      - romac-install-2024
      - romac-submittal-2024
  - rule_id: validate_assembly
    applies_to: "install_accept"
    rule: "Require distinct retained host and actual complete clamp component roles, flat clean gasket, centring, actual instruction-compliant torque/retorque and passed pre-concealment mechanical criterion; no coupling/tapping/separated ends."
    source_ids:
      - romac-install-2024
  - rule_id: validate_hygiene
    applies_to: "accepted_repair; closure_provider_pressure_test; closure_provider_hygiene; closure_provider_sampling; closure_provider_laboratory; closure_provider_neutralisation"
    rule: "Require actual adopted-authority contamination classification, hygiene/flushing/sampling/neutralisation criteria/results and actual responsible providers; complete all actual required closure before final output. Record applicable waiver evidence and authorised reinstatement/utility handback interfaces."
    source_ids:
      - ontario-watermain-2020
  - rule_id: validate_count_reject
    applies_to: "Reference count, work-order runs and loops"
    rule: "N counts only unique signed accepted final repairs; rejected attempts/clamps/tests and repeated preparation/retorque/retest retain burdens and explicit node-linked rework/return/waste paths. No failed attempt adds final count."
    source_ids: []
  - rule_id: validate_resources
    applies_to: "Shared assets/providers, stocks and all periods"
    rule: "Reconcile all consumers/periods, complete-life assets and prospective scenario evidence, direct versus bundled operation, freight/empty service, stock quantities/upstream-burden bridge and no repeated allocation. Missing life coverage or denominator blocks finalisation."
    source_ids: []
  - rule_id: validate_outlets
    applies_to: "Materials, water, fuel, waste and elementary releases"
    rule: "Gross before real returns; stock is not outward flow. Fuel outlets exclusive and whole uncontained fluid measured separately from species; total spill audit only. Chemical dose is not release and unclosed residual is not automatic emission; actual waste receiver/substance/medium and balance evidence required."
    source_ids: []
  - rule_id: validate_candidate
    applies_to: "Foreground package and downstream exchange production"
    rule: "Require all applicable protocols/qualifiers, actual units/conversion operands/uncertainty and verified concrete final exchanges before production. A candidate/check pass does not prove SKU potable approval, quantity truth, authority compliance or UUID verification."
    source_ids: []
