      flow_role: "actual non-bundled freight and shared trip responsibility"
      record_type: "transport_leg_record"
      raw_fields: "repair_id; defect_id; work_order_id; event_id; node_id; period_id; provider_id; bundle_scope; accepted_count_N; consignment_id; leg_id; mode; vehicle_provider; cargo_mass_kg; cargo_tare_kg; loaded_distance_km; target_share; all_consumers; empty_leg_km; empty_leg_fuel_kg; actual_service_scope; included_delivery; measured_uncertainty"
      collection_method: "Use actual cargo net mass and travelled loaded-leg distance for each mode/leg; allocate shared loads with declared physical driver and total-consumer reconciliation. Empty/staff service legs use actual fuel/bounded provider service once."
      unit: "kg; km; kg*km"
      frequency: "Every loaded and empty leg"
      temporal_coverage: "Declared work-order start through accepted gate including loops; reporting/asset periods linked"
      site_scope: "Actual repair site and declared provider/supply gates; external interfaces named"
      aggregation_rule: "per reference flow"
      quality_evidence: "Dispatch/weighing/distance/provider records; no fake cargo, nominal capacity or duplicate bundled delivery"
    - protocol_id: cp_i_residuals
      process_id: "install_accept"
      flow_role: "solid waste collected fluid and direct releases"
      record_type: "outlet_and_receiver_record"
      raw_fields: "repair_id; defect_id; work_order_id; event_id; node_id; period_id; provider_id; bundle_scope; accepted_count_N; outlet_id; material_or_substance; receiver; receiver_medium; capture_state; waste_route; gross_mass_kg; tare_kg; net_mass_kg; dry_solids_kg; associated_water_kg; whole_fluid_mass_kg; volume_m3; density_kg_per_m3; temperature_C; physical_state; concentration_value; concentration_basis; concentration_kg_per_m3; measured_species_kg; detection_limit; reaction_retention_kg; neutralisation_record; incident_id; incident_total_kg; exclusive_partition_id; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Identify each captured waste transfer or uncontained direct outlet and receiver; weigh whole fluids/solids and analyse actual species on stated basis. Record actual treatment/neutralisation and detection limits; unclosed balances require investigation, not fictional emissions. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg; m3; kg/m3"
      frequency: "Every waste transfer, release, sample and incident"
      temporal_coverage: "Declared work-order start through accepted gate including loops; reporting/asset periods linked"
      site_scope: "Actual repair site and declared provider/supply gates; external interfaces named"
      aggregation_rule: "per reference flow"
      quality_evidence: "Waste tickets, sample chain of custody, species/medium and exclusive whole-fluid partitions; same mass never both waste and emission"
    - protocol_id: cp_i_closure
      process_id: "install_accept"
      flow_role: "bounded provider hygiene testing protection and repair closure"
      record_type: "bounded_service_record"
      raw_fields: "repair_id; defect_id; work_order_id; event_id; node_id; period_id; provider_id; bundle_scope; accepted_count_N; service_id; actual_reference_unit; service_quantity; service_event_id; provider_flow_property; provider_reference_unit; event_gate; adopted_authority_edition; classification_record; activity_scope; direct_resource_exclusions; included_water_kg; included_chemicals_kg; included_energy_units; included_assets; included_travel; pressure_result; flushing_result; disinfectant_result; sampling_requirement; sample_chain_of_custody; laboratory_result; neutralisation_result; release_criterion; criterion_pass; provider_signature; gate_time; utility_return_to_service_owner; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Verify actual counted bounded provider-service event with matching Count/Item(s) reference/property/unit and primary activity/results for mandatory mechanical/hygienic closure, including any utility-owned protection/dewatering and sampling/lab resource coverage. Confirm completed required criteria before accepted_repair; record later authorised utility/reinstatement interfaces. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "Item(s); actual bundled resource units"
      frequency: "Every bounded service, sample, result and release"
      temporal_coverage: "Declared work-order start through accepted gate including loops; reporting/asset periods linked"
      site_scope: "Actual repair site and declared provider/supply gates; external interfaces named"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual contract/gate/reference, primary resource evidence and criterion pass; excluded direct resources reconcile; no unowned future test"
    - protocol_id: cp_i_clamp_returns
      process_id: "install_accept"
      flow_role: "outward accepted complete-assembly product returns"
      record_type: "counted_product_return_record"
      raw_fields: "repair_id; work_order_id; event_id; period_id; provider_id; accepted_count_N; lot_id; clamp_SKU; gross_received_count; returned_count; return_ticket; recipient; recipient_acceptance; intact_product_state; transfer_time; matched_SKU_net_mass_kg_per_item; mass_conversion_need"
      collection_method: "Count actual intact outward assemblies by SKU and match recipient acceptance/custody ticket and original gross receipt; do not convert to mass unless downstream requires it and actual matching SKU net mass is measured."
      unit: "Item(s); kg/Item(s) only for actual evidenced downstream conversion"
      frequency: "Every outward complete-assembly return"
      temporal_coverage: "Declared repair work-order cycle and stock period"
      site_scope: "Actual repair site/supplier/return recipient"
      aggregation_rule: "per reference flow"
      quality_evidence: "Counted return ticket, SKU/intact state and recipient acceptance; no stock output, default mass or gauge-derived BOM"
  calculation_rules:
    - id: calc_normalize
      applies_to: "All inventory rows"
      rule: "For each row q_ref = attributed actual quantity / N, with original physical row unit retained. N is unique accepted final repair count and must be positive; internal transfer quantities retain their distinct event register."
      inputs:
        - "Node-specific protocols and cp_i_host"
        - "actual attributed row quantity and accepted_count_N"
      output: "Row physical units per 1 Item(s) accepted repair"
      source_ids: []
    - id: calc_mass
      applies_to: "prep_supplies_cleaner; prep_supplies_brush; prep_supplies_cloth; prep_supplies_liner; prep_supplies_absorbent; prep_water; actual exchanges required by refine_prep_fuel; actual exchanges required by refine_prep_returns; prep_solid_waste_corrosion_dirt; prep_solid_waste_cloth; prep_wastewater; gasket_lubricant; hygiene_chemicals_disinfectant; hygiene_chemicals_cleaner; hygiene_chemicals_dechlorinator; test_flush_water; actual exchanges required by refine_install_fuel; install_consumables_absorbent; install_consumables_liner; install_consumables_cloth; install_consumables_sample_bottle; actual exchanges required by refine_install_returns; install_solid_waste_failed_clamp; install_solid_waste_cloth; install_wastewater"
      rule: "Net contents kg = gross kg - tare kg. Where measured volume is used, mass kg = volume m3 * actual density kg/m3, or volume L * actual density kg/L; record actual temperature and state. Product count to mass requires actual SKU mass kg/Item(s). Gross receipt/issue precedes outward returns."
      inputs:
        - "Applicable node cp_materials"
        - cp_water
        - "cp_utilities or cp_residuals"
        - "actual raw weight"
        - volume
        - density
        - temperature
        - "state and SKU net mass"
      output: "Actual physical net mass kg, separately normalized over N"
      source_ids: []
    - id: calc_power
      applies_to: "prep_power; install_power"
      rule: "Attributed electricity kWh = (meter_end_kWh - meter_start_kWh) * meter_multiplier * node_share; divide by N. Actual shares reconcile to whole metered consumer scope."
      inputs:
        - cp_p_utilities
        - cp_i_utilities
        - "actual meters/multiplier/node_share/N"
      output: "kWh per accepted repair"
      source_ids: []
    - id: calc_freight
      applies_to: "prep_freight; install_freight"
      rule: "Freight kg*km = sum(cargo_mass_kg * loaded_distance_km * target_share); divide by N. Cargo tare removed. Verified 1 t*km = 1000 kg*km only when actual exchange uses that supported unit. Empty legs use actual separate service/fuel resources without cargo invention."
      inputs:
        - cp_p_freight
        - cp_i_freight
        - "cargo mass"
        - "leg distance"
        - "target shares and accepted_count_N"
      output: "kg*km per accepted repair"
      source_ids: []
    - id: calc_assets
      applies_to: "prep_assets_cleaning_tool; prep_assets_pump; install_assets_torque_wrench; install_assets_test_pump"
      rule: "Asset-equivalent Item(s) = target_node_service / complete_life_service, then divide by N. Complete_life_service = observed_life_service + evidenced prospective_remaining_service for in-service scenarios; use same compatible driver units and coverage, all consumers and periods. Scale actual complete-life upstream burden with this fraction once."
      inputs:
        - cp_p_assets
        - cp_i_assets
        - "compatible target and complete-life service"
        - "forecast/observed labels"
        - "full-life burden coverage"
        - accepted_count_N
      output: "Asset-equivalent Item(s) and attributed complete-life burden per repair"
      source_ids: []
    - id: calc_fuel
      applies_to: "actual exchanges required by refine_prep_fuel; actual exchanges required by refine_install_fuel; actual exchanges required by refine_prep_combustion; actual exchanges required by refine_install_combustion"
      rule: "Burned kg = opening fuel + gross fuel - closing fuel - unburned return - captured unburned waste - whole uncontained fuel, at the same bounded tank/event scope. Incident total spill is audit only after its exclusive partitions. Upstream fuel product input retains all attributable supplied fuel, including nonreturned unburned waste and uncontained release. A net-used supply convention may subtract only evidenced retained stock and real usable outward returns under the stock bridge, never captured unburned waste or environmental loss. A gross-input convention retains exclusive actual outlets and the linked upstream-burden custody bridge. Burned activity is derived independently from compatible tank/event stock, receipts and all disjoint unburned fates; a burned-only supply input is permitted only if evidenced nonreturned unburned waste and release are both absent after stock and return reconciliation. Unknown outlet or unexplained loss remains a gap, not presumed combustion."
      inputs:
        - cp_p_utilities
        - cp_i_utilities
        - "stock/gross/exclusive outlets and boundary choice"
      output: "Independent actual burned activity kg; upstream supply product retains nonreturned unburned loss burden under declared stock/return convention"
      source_ids: []
    - id: calc_combustion
      applies_to: "actual exchanges required by refine_prep_combustion; actual exchanges required by refine_install_combustion"
      rule: "Emission kg = burned_fuel_kg * applicable emission_factor_kg_per_kg_fuel, or actual measured_emission_kg, separately for verified substance/receiver; divide by N. Factor source and fuel/equipment/abatement/basis must match."
      inputs:
        - cp_p_utilities
        - cp_i_utilities
        - "actual burned fuel"
        - "species/factor/source or measured emission"
      output: "Species kg per accepted repair to actual air receiver"
      source_ids: []
    - id: calc_releases
      applies_to: "actual exchanges required by refine_prep_releases; actual exchanges required by refine_install_releases"
      rule: "Species kg = actual concentration_kg_per_m3 * discharged volume_m3, or measured_species_kg; divide by N. Record concentration basis/unit conversion evidence. Whole-fluid mass kg = actual volume_m3 * actual density_kg_per_m3 when not weighed; species sum is not whole-fluid mass. Dose, retained/reaction/captured/neutralised quantities remain separate evidence, never assumed emitted."
      inputs:
        - cp_p_residuals
        - cp_i_residuals
        - "concentration/basis"
        - "discharged volume"
        - "density/temperature/state"
        - "species and medium"
      output: "Actual species kg per repair and separate whole-fluid physical balance"
      source_ids: []
    - id: calc_stock_bridge
      applies_to: "prep_supplies_cleaner; prep_supplies_brush; prep_supplies_cloth; prep_supplies_liner; prep_supplies_absorbent; actual exchanges required by refine_prep_returns; complete_clamp; gasket_lubricant; hygiene_chemicals_disinfectant; hygiene_chemicals_cleaner; hygiene_chemicals_dechlorinator; install_consumables_absorbent; install_consumables_liner; install_consumables_cloth; install_consumables_sample_bottle; actual exchanges required by refine_install_returns; clamp_returns"
      rule: "Maintain separate Count/Item(s) SKU ledgers and Mass/kg material/formulation ledgers at one chosen receipt OR issue boundary. Opening stock + actual receipts/issues = final retained installation/destinations + real outward returns + captured waste + actual whole release + closing stock. Final retained destinations exclude separately logged losses/outlets; dosed/used activity is intermediate and never another additive final outlet. Match opening carried-in upstream burden and receipt burden to actual use, returns/dispositions and closing carried-forward burden using actual compatible lot data. Never count receipt and internal issue together."
      inputs:
        - cp_p_materials
        - cp_i_materials
        - cp_i_clamp_returns
        - opening_stock_count
        - receipts_count
        - final_retained_count
        - outward_returns_count
        - discarded_count
        - closing_stock_count
        - opening_stock_kg
        - receipts_kg
        - issues_kg
        - final_retained_destination_kg
        - outward_returns_kg
        - waste_kg
        - whole_release_kg
        - closing_stock_kg
        - lot_id
        - opening_burden_reference
        - closing_burden_reference
      output: "Physical stock and upstream-burden bridge without fake closing-stock output"
      source_ids: []
  data_quality_requirements:
    - id: quality_route
      applies_to: "Host, assembly and reference output"
      requirement: "Actual main/OD/defect/clamp/gasket/potable approval and gate qualification required; site and PDF gauge conflict is resolved by actual SKU documentation, not an inferred BOM."
      evidence: "cp_p_host; cp_i_host; cp_i_materials; actual manufacturer/utility approval"
    - id: quality_closure
      applies_to: "Accepted repair and bounded closure provider"
      requirement: "Actual adopted authority and product editions, responsibility and mechanical/hygienic criteria/results required; documented non-applicability for any omitted test; future unowned test blocks final count."
      evidence: "cp_i_host; cp_i_closure; approved procedure/results/owners"
    - id: quality_completeness
      applies_to: "Every inventory row"
      requirement: "Collect all attempts, returns, stocks, actual waste/release outlets and provider resources from start to gate. Distinguish unknown from zero with detection limits and balance discrepancy investigation."
      evidence: "All node-specific protocols; custody, calibrated meter and receiver evidence"
    - id: quality_assets
      applies_to: "Shared assets/jobs/periods"
      requirement: "Complete-life service and burden coverage, all consumers, prospective scenario sources/uncertainty and update policy required; unsupported denominator or replacement/termination/EOL gap blocks finalisation."
      evidence: "cp_p_assets; cp_i_assets; full-life and all-consumer records"
    - id: quality_identity
      applies_to: "Concrete downstream exchanges"
      requirement: "Resolve actual supplier/provider/material/waste/substance and support identities before final TIDAS exchange; candidate semantic umbrella does not permit a near-match or invented UUID."
      evidence: "Actual foreground identities and independent detail/support verification"
    - id: quality_periods
      applies_to: "Work orders, loops, stocks and shared providers"
      requirement: "Declare start/end, node/event/period links and service ownership; reconcile shared setup/cleaning/travel and changing stock burdens without repeat attribution."
      evidence: "Every CP work_order_id/event_id/period_id/provider_id; consumer totals and stock bridge"
    - id: refine_prep_supplies
      applies_to: "prep_supplies_cleaner; prep_supplies_brush; prep_supplies_cloth; prep_supplies_liner; prep_supplies_absorbent"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record actual cleaner, brushes consumed, cloths and protective disposables separately at their supplier gate and real net contents; retain actual product/chemical identity, approval and packaging boundary. Include actual unbundled cleanup/containment liners, absorbents and protective disposables used in preparation; do not infer these from waste output alone. Reusable containment equipment belongs to prep_assets_cleaning_tool; prep_assets_pump. Range evidence need: Actual lot mass, receipt/issue records, tare and scope are required; no kg per repair default or assumed solvent. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual protective disposable products/SKU/formulations require independent identity/unit; reusable containment apparatus belongs to full-life assets, no inference of supplies from waste alone."
      evidence: "cp_p_materials; actual independent records and identity/unit evidence"
    - id: refine_prep_fuel
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Specify actual fuel and equipment. Upstream fuel product input retains all attributable supplied fuel, including nonreturned unburned waste and uncontained release. A net-used supply convention may subtract only evidenced retained stock and real usable outward returns under the stock bridge, never captured unburned waste or environmental loss. A gross-input convention retains exclusive actual outlets and the linked upstream-burden custody bridge. Burned activity is derived independently from compatible tank/event stock, receipts and all disjoint unburned fates; a burned-only supply input is permitted only if evidenced nonreturned unburned waste and release are both absent after stock and return reconciliation. Unknown outlet or unexplained loss remains a gap, not presumed combustion. Range evidence need: Actual fuel records and outlet reconciliation required; no default fuel type, density, consumption or carbon factor. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Each actual upstream fuel product retains nonreturned unburned waste/release supply burden; original source stock/return/gross convention, actual burn activity independently measured, no waste or