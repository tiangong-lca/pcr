    - id: refine_prep_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Separate actual whole uncontained fluid from reported species; each elementary exchange requires actual substance identity and air/water/soil receiver. Captured waste, chemical dose and unexplained residual are not emissions. Whole-fluid mass is retained solely as a physical balance operand; any direct elementary water exchange requires its own actual water identity, receiver, property and verified quantity rather than a generic mixture flow. Range evidence need: Actual outlet medium, substance, concentration basis, volume, detection limits and mutually exclusive captured/released balance required; no assumption of zero or dose-to-emission equivalence. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
