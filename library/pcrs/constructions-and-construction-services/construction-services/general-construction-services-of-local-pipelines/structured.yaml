    - id: refine_prep_returns
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Only real outward supplier/custody returns at their actual product state qualify. Keep lot and upstream burden linked to original gross inputs; retained stock is not an output. Range evidence need: Actual return ticket, recipient, lot/tare and accepted quantity required; no assumed return percentage. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual outward usable SKU/state/receiver/lot matched to gross supply; closing stock excluded, retain burden custody."
