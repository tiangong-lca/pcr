validation_rules:
  - rule_id: acceptance_area
    applies_to: "all processes"
    rule: "Require A > 0, unique surveyed net developed surface polygons, declared slope measurement convention, exact certification extent and date, signed acceptance, defects closed and functional_unit.reference_flow_link = certified_final_cover. Overlaps, roll supplies, GCL/drain areas, prepared subgrade, coupons, repairs and repeated tests cannot increase A. Unfinished or interim protected zones cannot be accepted by default."
    source_ids:
      - epa-mswlf-closure-requirements
      - frtr-landfill-soil-capping
      - rid-em-rosehill-cqa-2006
  - rule_id: layer_quality
    applies_to: "all processes"
    rule: "Require actual approved LLDPE plus low-permeability GCL or soil composite contact design, layer traceability and sequence, qualified subgrade, actual plan-required soil/layer and seam/repair/penetration/anchorage/drainage/gas test records, erosion/vegetation gate, as-builts and responsible certification. No borrowed historical case thickness/frequency/acreage or universal technology performance. Soil-only ET cover, new bottom liner and bare roll supply fail this scope."
    source_ids:
      - epa-mswlf-closure-requirements
      - frtr-landfill-soil-capping
      - rid-em-rosehill-cqa-2006
  - rule_id: ledger_completeness
    applies_to: "all processes"
    rule: "Require native SKU supply/return/waste/stock closure, compatible soil moisture-density states, fuel fate closure, actual species-medium release basis and baseline-versus-incremental attribution. Own provider and shared asset upstream scope across all consumers/periods; one representation and normalization only. Unknown material activity, identity, factor, return, life denominator or subcontractor resource coverage blocks a completed dataset; record performed/skipped checks and uncertainty."
    source_ids:
      - epa-mswlf-closure-requirements
      - frtr-landfill-soil-capping
      - rid-em-rosehill-cqa-2006
  - rule_id: rework_period
    applies_to: "all processes"
    rule: "Join node, cell/job, batch/panel/weld, event, campaign and period IDs. Reconcile prepare reconditioning and cap repair/retest loops, retained repairs versus waste/returns, temporary gas/water management, shared setup/cleaning and replacements/termination. A late accepted phase does not erase earlier unsuccessful resources; postclosure care stays separately disclosed. Resolve each concrete exchange identity and support unit before final exchange export; candidate semantic guidance is not publication-ready exchange data."
    source_ids:
      - epa-mswlf-closure-requirements
      - frtr-landfill-soil-capping
      - rid-em-rosehill-cqa-2006
