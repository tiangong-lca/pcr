  calculation_rules:
    - id: atom_final3_quantity_semantics
      applies_to: "all actual children and typed residual requirements"
      rule: "For each actual child, compute its own unnormalized numerator q_child by its stated role and one exchange unit before dividing once by A. Material stock supply S is attributed opening plus external net-tare receipts minus burden-carried closing, with the original single gross-with-outward-flows or consumed-only true usable-return convention; nonreturned waste/loss keeps upstream supply. Outward usable return, actual waste and internal handoff quantities are independently recorded, not the input S. An actual Count-equivalent asset child uses q_child=(actual job/node compatible driver / evidenced all-consumer complete-life same-driver denominator) Item(s), with full burden per complete asset Item(s); never one whole asset per job, a material-stock formula, a rental-hour/fee conversion or another life division. A current Duration/h service instead uses actual attributable service h and complete applicable burden per the same h, never multiplies its h by the asset fraction again; complete provider coverage is acceptable, actual missing phases/resources must be added once without hypothetical fuel/assets. A completed-service-event child uses only actual independently accepted physical results whose contract/reference really supports Item(s), never labour, fees, hours or count of reports as a proxy. Any incompatible native service contract stays unresolved under its requirement until an exact single-unit method is reviewed. Species/media release children require actual species-state-medium and independent measured or validated kg; a carrier total or unknown balance is not a release. H2O vapour specifically uses independently evidenced H2O kg to the applicable air compartment; water-volume raw ledgers require an actual compatible H2O-content/state/density bridge and remain nonadditive. For actual owned asset and provider service overlaps select one burden owner and one quantity view. A is the original positive certified unique net developed final-cover surface in m2, with the actual slope/survey convention. Layers, overlaps, rolls, repairs, coupons and prepared-subgrade handoff area never increase A."
      inputs:
        - actual_child_row_id
        - q_child
        - one_exchange_unit
        - "original accepted denominator"
        - "original compatible node CP"
        - "actual source evidence"
      output: "q_child per original reference flow"
      source_ids: []
    - id: normalize_area
      applies_to: "all inventory rows"
      rule: "Original supplier native quantities are raw auxiliary records. Every actual current exchange uses its own explicitly stated single property/unit under atom_final3_typed_child_routes and atom_final3_quantity_semantics, with an actual same-identity/state conversion only where evidenced. Unknown remaining references are refinement requirements, not cards with selectable units. The denominator is the original positive certified unique net developed A in m2; no layer/overlap/roll/repair or prepared-subgrade area increases it."
      inputs:
        - attributable_native_quantity
        - A
        - cp_cap_gate
      output: "Selected single-unit quantity per 1 m2 certified final cover"
      source_ids: []
    - id: native_state
      applies_to: "prep_soil_grading_soil; atom_req_prepare_prep_soil actual-child group; cap_soil_soil_barrier; cap_soil_gas_mineral; cap_soil_drain_mineral; cap_soil_protection_soil; cap_soil_vegetative_medium; atom_req_cap_cap_soil actual-child group; atom_req_prepare_prepare_fuel actual-child group; atom_req_cap_cap_fuel actual-child group; erosion_vegetation_seed; erosion_vegetation_mulch; erosion_vegetation_fertilizer; erosion_vegetation_tackifier; erosion_vegetation_soil_amendment; atom_req_cap_erosion_vegetation actual-child group"
      rule: "Convert only compatible actual states: wet_mass = wet_volume * wet_density; dry_mass = wet_mass * (1 - wet_basis_water_fraction); loose_volume * loose_dry_density = compacted_volume * compacted_dry_density for the same retained dry solids after separately recorded additions and losses. Dry-basis moisture requires dry_mass = wet_mass / (1 + dry_basis_water_ratio). Retain actual units, temperature, density/moisture method, batch, sources and uncertainty. These are alternative nonadditive views; do not equate loose and compacted volumes or add water twice."
      inputs:
        - wet_volume
        - wet_density
        - wet_mass
        - wet_basis_water_fraction
        - dry_basis_water_ratio
        - loose_volume
        - loose_dry_density
        - compacted_volume
        - compacted_dry_density
      output: "Compatible reconciled native-state quantities"
      source_ids: []
    - id: fuel_fates
      applies_to: "atom_req_prepare_prepare_fuel actual-child group; atom_req_cap_cap_fuel actual-child group"
      rule: "Supplied fuel upstream is distinct from measured burned fuel for emissions. Use directly measured burn OR audited complete disjoint native-unit fates: S = burned + usable_outward_return + contained_nonburned_waste + uncontained_loss, after closing stock already removed in S. Retain independent uncertainty and investigate unknown loss; never infer combustion from an incomplete residual. Total spill is audit-only; recovered spill retained in closing is already closing."
      inputs:
        - S
        - burned
        - usable_outward_return
        - contained_nonburned_waste
        - uncontained_loss
        - carried_closing
        - cp_prepare_energy
        - cp_cap_energy
      output: "Measured burn and disjoint reconciled fates"
      source_ids: []
    - id: species_release
