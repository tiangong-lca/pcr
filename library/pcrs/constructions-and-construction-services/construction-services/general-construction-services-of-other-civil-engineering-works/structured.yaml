system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers completed construction and closure certification of a field-welded LLDPE composite final cover on an identified retained waste-filled landfill cell. An approved low-permeability soil or GCL component in composite contact with LLDPE is required by this scope; actual designed drainage, gas, protection and vegetative layers are separately identified. Start after acceptance of the existing filled-cell baseline, not a new landfill construction project. Actual permit, closure design and CQA requirements govern the work and responsible certification. Sources describe physical roles; historical Rose Hill RCRA/CERCLA case requirements are not universal MSWLF rules."
      source_ids: []
    - rule_id: scope_gate
      applies_to: "all processes"
      rule: "Own actual grading, subgrade conditioning/compaction, approved soil or GCL plus LLDPE composite barrier, separately designed gas/drainage/protection/erosion layers and all connections, field seaming, tests, repair and certification. The gate requires plan-conforming final layer survey, material traceability, actual required non-destructive/destructive seam tests, penetration/anchorage and drainage/gas inspections, erosion/vegetation establishment where required, defect closure, as-builts and signed responsible engineer/owner/authority acceptance. Criteria, layer thicknesses, soil moisture/compaction limits, test frequencies, climatic restrictions and certification roles come from the actual applicable approved plan; this PCR prescribes no construction engineering settings."
      source_ids:
        - epa-mswlf-closure-requirements
        - frtr-landfill-soil-capping
        - rid-em-rosehill-cqa-2006
    - rule_id: baseline_increment
      applies_to: "all processes"
      rule: "Declare retained waste, intermediate cover, existing gas and leachate equipment, background decomposition and baseline gas/water flows before work. No historical waste manufacture is purchased again. Own actual incremental grading/removal, disturbance releases, temporary capture/pumping/treatment, damage, contamination control and reinstatement during the job. Establish attribution by comparable baseline and job/event measurements with confounders and uncertainty; missing attribution is a material data gap, never an automatic zero or an assumed net reduction."
      source_ids:
        - epa-mswlf-closure-requirements
        - frtr-landfill-soil-capping
        - rid-em-rosehill-cqa-2006
    - rule_id: owned_resources
      applies_to: "all processes"
      rule: "Include actual direct and subcontracted resources, rental/provider assets, mobilization/demobilization, freight including required empty legs, temporary utilities, sampling, destructive coupons, retries, clean-up and stock exits once. Decompose upstream service coverage before adding physical purchases. A factory composite component includes its factory constituents. Landfill operating waste placement, new cell/bottom liner or whole landfill, daily/intermediate cover, soil-only evapotranspiration covers and later postclosure monitoring/maintenance are excluded."
      source_ids:
        - epa-mswlf-closure-requirements
        - frtr-landfill-soil-capping
        - rid-em-rosehill-cqa-2006
    - rule_id: internal_handoffs
      applies_to: "all processes"
      rule: "The prepare-to-cap subgrade handoff is an internal state transition linked by transfer_id, not another external purchase or final reference output. Record actual prepared and accepted footprints separately. A same-category bought closure-cover service is bounded by its actual certified gate and complete upstream scope; do not recursively buy this project again."
      source_ids:
        - epa-mswlf-closure-requirements
        - frtr-landfill-soil-capping
        - rid-em-rosehill-cqa-2006
