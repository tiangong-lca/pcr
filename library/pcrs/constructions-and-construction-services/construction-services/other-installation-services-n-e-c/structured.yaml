    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 explanatory notes, 30 June 2025, p. 296, subclass 54699. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Official classification boundary including installation of blinds and awnings; narrower installation-service scope."
