allocation_rules:
  - rule_id: rework_burdens
    applies_to: "shade_install"
    rule: "Keep all preacceptance rework, replacement material, removal/reinstallation and repeat checks in the original job. Failed jobs and unresolved rejects do not increase accepted output; disclose how their campaign burdens are attributed to accepted jobs. No automatic avoided-production/recycling credit."
    source_ids:
      - levolor-cordless-25-0040-024
  - rule_id: shared_resources
    applies_to: "actual exchanges required by refine_tool_access_service; actual exchanges required by refine_tool_access_hourly_service; installation_power; job_logistics"
    rule: "Identify shared drill/access/charger or delivery service, actual shade_install and every other consuming job/node, and bounded service/reporting period. Directly meter attributable use where possible; otherwise assign the declared period total by evidenced causal activity shares and reconcile shares across all consumers. Count power/transport either separately or within a provider dataset once. Use provider-bounded services rather than speculative owned-asset lifetime. Missing denominator or boundary is a gap."
    source_ids:
      - levolor-cordless-25-0040-024
  - rule_id: returns_and_stock
    applies_to: "shade_kit; extra_fixings_anchor; extra_fixings_screw; extra_fixings_shim; actual exchanges required by refine_usable_returns"
    rule: "Maintain gross receipt, installation consumption, supplier return, closing stock and waste ledger with unique transfer ids for actual custody movements. Opening/closing stocks are inventory balances; retained closing stock is not an extra physical usable output. Actual transfers have named receiving custody and one balance treatment. Returning a usable item does not erase its actual freight/handling; either retain a gross receipt and explicit burden-carrying product exit or apply documented net procurement once, never both a net subtraction and a second credit. Usable exits are not intended coproduct sales."
    source_ids:
      - levolor-cordless-25-0040-024
dataset_production:
  collection_protocols:
    - protocol_id: cp_kit
      process_id: "shade_install"
      flow_role: "kit receipt and coverage"
      record_type: "delivery and issue ledger"
      raw_fields: "job_id; model; width; drop; fabric; roll_direction; kit_bom; supplied_part_counts; package_coverage; receipts; replacement_issues; return_ids"
      collection_method: "Inspect order, package and manufacturer instructions against actual shade; reconcile brackets, screws, handles, end caps and gross receipts with returns and consumed replacements."
      unit: "Item(s)"
      frequency: "Each receipt/issue/return"
      temporal_coverage: "Complete initial-installation job including corrections"
      site_scope: "Actual site and linked supplier"
      aggregation_rule: "per reference flow"
      quality_evidence: "Kit coverage checklist and signed issue/return records"
    - protocol_id: cp_materials
      process_id: "shade_install"
      flow_role: "extra fixing and cleanup supplies"
      record_type: "material issue ledger"
      raw_fields: "job_id; substrate; fixing_spec; material; supplier; scale_id; issued_mass; consumed_mass; return_mass; water_or_wipe_identity; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Record each extra part/product outside kit coverage; weigh on a suitable calibrated scale or use traceable supplier component masses; segregate unused returns. Identify actual cleaning method. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "Each issue and correction"
      temporal_coverage: "Complete job"
      site_scope: "Site/store and linked supplier"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale evidence, fixing approval and product receipts"
    - protocol_id: cp_resources
      process_id: "shade_install"
      flow_role: "power, shared tool/access and logistics"
      record_type: "meter and provider service ledger"
      raw_fields: "job_id; asset_id; provider; service_unit; service_boundary; period; all_consumers; activity_share; meter_start; meter_end; charging_loss_boundary; route; load; included_burdens; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Read actual supply meter/charging logs and provider contracts. Enumerate all actual consumers and periods; retain task duration, trip and load evidence for causal attribution. A counted bounded service requires a defined provider unit; otherwise retain actual units and unresolved conversion. Distinguish included electricity/freight. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kWh; provider-defined service units"
      frequency: "Each resource event and bounded period"
      temporal_coverage: "Job plus complete shared-service denominator period"
      site_scope: "Site, provider and all other ledger consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, provider boundary and reconciled causal shares"
    - protocol_id: cp_accept
      process_id: "shade_install"
      flow_role: "accepted service and rework"
      record_type: "inspection and handover"
      raw_fields: "job_id; opening_dimensions; substrate; obstruction_check; instruction_edition; bracket_count; bracket_positions; tab_orientation; fixing_spec; level; clicks; handles; end_caps; roll_direction; raise_lower; hold_position; rework; reject_state; signoff"
      collection_method: "Measure recess and actual shade; check matching guide and substrate fixings. Record level/retention at every bracket, fitted handles/end caps, unobstructed level full raise/lower and position holding under instructions. Close corrections before signed handover; record unresolved rejects separately."
      unit: "Item(s)"
      frequency: "Each job and reinspection"
      temporal_coverage: "Receipt through final handover"
      site_scope: "Actual installed reveal"
      aggregation_rule: "per reference flow"
      quality_evidence: "Photos, dimension record, corrective closeout and signed acceptance"
    - protocol_id: cp_exits
      process_id: "shade_install"
      flow_role: "usable exits and waste"
      record_type: "weigh and transfer ledger"
      raw_fields: "job_id; transfer_id; material; condition; mass; scale_id; recipient; stock_location; receiving_gate; kit_coverage; transport_owner; waste_route; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Weigh each characterized return, stock transfer and waste stream separately; link supplier receipt/stock entry and waste collection note. Reconcile gross issues with retained installation, returned goods, waste and documented losses. Include actual wastewater when generated. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "Each return/stock/waste dispatch"
      temporal_coverage: "Complete job including corrective cleanup"
      site_scope: "Site, receiving stock/supplier and declared collector"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated weighing, receiving confirmation and custody reconciliation"
    - protocol_id: cp_air
      process_id: "shade_install"
      flow_role: "actual substance-specific air releases"
      record_type: "monitoring or documented factor calculation"
      raw_fields: "job_id; substrate; substance; particle_class; compartment; activity; control; sampling_method; released_mass; factor_source; uncertainty; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id"
      collection_method: "Identify actual drilling/cleaning release mechanism and substance/particle class. Measure or use an applicable documented method with actual control/activity data. Separate captured debris, retained material and released mass; absence of evidence is not zero. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "Each emitting task or representative validated campaign"
      temporal_coverage: "Complete installation and rework"
      site_scope: "Actual work area and air receiving compartment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Monitoring/factor applicability, detection limit and uncertainty"
  calculation_rules:
    - id: job_reconciliation
      applies_to: "shade_kit; extra_fixings_anchor; extra_fixings_screw; extra_fixings_shim; cleanup_supplies_supplied_water; cleanup_supplies_disposable_wipe; actual exchanges required by refine_usable_returns; packaging_waste_paper; packaging_waste_cardboard; packaging_waste_plastic; actual exchanges required by refine_installation_debris"
      rule: "For each actual job/material, reconcile gross receipt plus opening stock with installed or consumed quantity, supplier return, closing stock, waste and documented losses. Opening/closing stock are inventory balances, not additional purchases or physical exits. A retained closing balance cannot also enter actual exchanges required by refine_usable_returns; actual custody transfers have unique receiving custody and exactly one balance treatment. Preserve product-return and waste gates; no universal loss coefficient."
      inputs:
        - cp_kit
        - cp_materials
        - cp_exits
      output: "Reconciled per reference flow exchanges"
      source_ids:
        - levolor-cordless-25-0040-024
    - id: resource_attribution
      applies_to: "installation_power; actual exchanges required by refine_tool_access_service; actual exchanges required by refine_tool_access_hourly_service; job_logistics"
      rule: "Assign each bounded period resource total using directly evidenced use or documented causal shares across every consumer, then attach this job share to its accepted service record. Keep numerator units and all-consumer denominator visible; do not convert hours/km to Item(s) without a provider-defined service unit."
      inputs:
        - cp_resources
        - cp_accept
      output: "Attributable per reference flow resource records"
      source_ids:
        - levolor-cordless-25-0040-024
    - id: acceptance_count
      applies_to: "shade_install_accepted"
      rule: "Count one signed accepted job once after all corrections; retain the actual number of failed/pending jobs and campaign burden decision separately."
      inputs:
        - cp_accept
      output: "1 Item(s) accepted reference output"
      source_ids:
        - levolor-cordless-25-0040-024
  data_quality_requirements:
    - id: route_identity
      applies_to: "all rows"
      requirement: "Preserve actual shade/kit/model, inside-mount system, substrate, width/drop/fabric/roll direction and manufacturer instruction edition. No outside-mount or optional-accessory mixing."
      evidence: "cp_kit; cp_accept; levolor-cordless-25-0040-024"
    - id: measurement_completeness
      applies_to: "all inventory rows"
      requirement: "Provide quantity, unit, dates, custody gate and measurement uncertainty for each active card. Conditional nonuse requires actual evidence; unknown use/release remains missing. Provider-defined counted units, Energy and any Duration support are not established by this PCR."
      evidence: "cp_materials; cp_resources; cp_exits; cp_air"
    - id: range_limits
      applies_to: "all inventory rows"
      requirement: "Replace row-specific Range evidence needs with reviewed compatible observations or factors before treating intervals as QA limits; do not turn manufacturer bracket/clearance/handle dimensions into universal kg, power, waste or emission ranges."
      evidence: "Supplier/job measurements and applicable source uncertainty"
    - id: shared_and_reject
      applies_to: "shade_install"
      requirement: "Reconcile every shared resource once over the same declared period and actual consumers; retain all rework burdens and rejected states until closure."
      evidence: "cp_resources; cp_accept; cp_exits"
    - id: refine_extra_fixings
      applies_to: "extra_fixings_anchor; extra_fixings_screw; extra_fixings_shim"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional on actual need, record extra approved anchors, screws or shims by concrete material and purchased state, excluding the supplied kit coverage. Each concrete component is a separate eventual exchange. Range evidence need: Actual substrate, compatible fixing specification, number and component mass are required; no universal kg range follows from bracket counts. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Any other actual extra fixing product requires its actual SKU and unique exchange unit; do not infer counts/masses from bracket tables."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_cleanup_supplies
      applies_to: "cleanup_supplies_supplied_water; cleanup_supplies_disposable_wipe"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional on use, identify each purchased product such as cleaning water or disposable wipes and its actual mass. Do not assume wet cleaning, hazardous chemicals or a common mixture identity. Range evidence need: Method and measured use depend on substrate/debris; obtain site and product evidence before proposing a supply interval. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual cleanup formulations/products require actual identity and one verified property/unit. Actual wet-cleaning wastewater must separately retain its existing mandatory collection obligation; do not assume supplied water all exits as wastewater or air."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_tool_access_service
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Apply only when this specific exchange actually occurs within the existing work boundary. Record its exact material or device identity, supplied/current state, native quantity and actual recipient or upstream coverage. Do not infer occurrence, quantity, a new process or a UUID. A complete supplied assembly and its already included components are mutually exclusive purchase views. Activate only for an actual provider-defined complete counted package. This Item(s) card never represents hourly hire or freight workload. Record actual scope and covered burdens once. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual complete tool/access contract packet, provider reference flow/property/unit, covered assets/energy/transport and completed service gate."
      evidence: "cp_resources; actual independent records and identity/unit evidence"
    - id: refine_tool_access_hourly_service
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Apply only when this specific exchange actually occurs within the existing work boundary. Record its exact material or device identity, supplied/current state, native quantity and actual recipient or upstream coverage. Do not infer occurrence, quantity, a new process or a UUID. A complete supplied assembly and its already included components are mutually exclusive purchase views. Activate only when the actual provider dataset is referenced to service hours with matching scope and complete lifecycle coverage. Do not also count the same event as a whole service package. Time is not a material count. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual hourly tool/access provider reference and coverage; keep one real complete service if demonstrated, not a duplicate of the whole-package option."
      evidence: "cp_resources; actual independent records and identity/unit evidence"
    - id: refine_usable_returns
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional on actual reusable items, distinguish supplier-returned unused shade/parts, reusable packaging and retained stock by item/material, recipient, custody and transfer id. Opening and closing stocks are inventory balances, not purchased inputs or additional physical exits. Retained closing stock is not also a usable output transfer. Record this output only for an actual custody transfer, with a unique receiving custodian and one balance treatment; goods retained by the same custodian remain solely in closing stock. Keep upstream burden owner and any supplier refund transparent. Range evidence need: Actual reusable condition, receiving evidence and measured mass are needed; do not assume all packaging reusable or deduct a return twice. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual whole shade or part returns; actual reusable packaging transfers; unique recipient/custodian and original receipt matching, separate from retained closing stock."
      evidence: "cp_exits; actual independent records and identity/unit evidence"
    - id: refine_packaging_waste
      applies_to: "packaging_waste_paper; packaging_waste_cardboard; packaging_waste_plastic"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional on discard, separate actual paper/cardboard, plastic or mixed packaging by material and receiving route. Packaging included in kit supply is not a second purchased input. Range evidence need: Actual packaging bill, separation and weigh records are needed; no generic packaging fraction or recycling credit. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual mixed packaging, other materials and any separately distinct contamination or receiving route require the actual dispatch roster; never divide a mixed total into guessed paper/cardboard/plastic shares."
      evidence: "cp_exits; actual independent records and identity/unit evidence"
    - id: refine_installation_debris
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Separate actual substrate drilling debris, spent cleanup supplies, damaged extra components and irreparable shade parts by characterized material and receiving route. Captured dust is waste; it is not automatically an elementary air release. Add wastewater as a separate actual waste stream when wet cleaning occurs. Range evidence need: Substrate, hole/cleanup method, material identity and weighed disposal records are needed; geometry alone provides no dust or reject mass range. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substrate debris material/state; actual spent cleanup composite; actual damaged component; actual shade part; each real waste receiver and measured mass, plus separate real wastewater when generated."
      evidence: "cp_exits; actual independent records and identity/unit evidence"
    - id: refine_air_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional on evidenced release, split by identified substance or particle class and receiving air compartment. Use monitoring or a justified method for actual substrate and controls. Do not infer VOC emissions from fabric/product content or declare zero because no measurement exists. Range evidence need: Substance identity, control efficiency and applicable monitoring/factor uncertainty are required; no generic total dust/VOC mass interval is established. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance or disjoint particle fraction and receiving-air compartment from actual task/control evidence; missing or unknown is a completion blocker, not zero."
      evidence: "cp_air; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
