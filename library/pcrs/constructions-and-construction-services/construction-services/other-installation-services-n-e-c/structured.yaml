  - id: "levolor-cordless-25-0040-024"
    type: "handbook"
    reference: "LEVOLOR, How to install roller shades: PerfectPlacement cordless lift, open roll with mounting bar, guide 25-0040-024, PDF pp. 1–8. https://www.levolor.com/media/pagebuilder_uploads/25-0040-024_BRND_LVC_Roll-Sol_NTL_OpenRoll-Cordless-Install-Guide_vF110325_1_.pdf"
    used_for: "Supply components; inside-mount depth/spacing/orientation and width-dependent brackets; handle placement; engagement/end caps; operation, permitted tension adjustment and troubleshooting. Does not supply inventory masses or factors."
