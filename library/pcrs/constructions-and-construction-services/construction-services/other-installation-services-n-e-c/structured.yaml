      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `completed_gate` | shade_install_accepted | Require compatible opening/substrate/fixings, correct inside orientation/count/spacing, level aligned brackets with every tab locked, handles/end caps, safe unobstructed raise/lower and recorded holding check. Pending corrections or rejects cannot pass. | `levolor-cordless-25-0040-024` |\n| `coverage_and_units` | all inventory rows | Reconcile factory kit coverage versus extras, gross and returned parts/packaging, actual power versus included service burdens, physical property/unit and per reference flow basis. An unresolved UUID/support or missing active quantity is disclosed and prevents a final bound exchange. | `levolor-cordless-25-0040-024` |\n| `shared_rework_exits` | shade_install | Check actual all-consumer periods and causal shares; every rework loop stays attached to this job, each usable exit has named recipient/stock custody, and each waste stream has receiving gate. No double subtraction or assumed recycling benefit. | `levolor-cordless-25-0040-024` |\n| `release_evidence` | actual exchanges required by `refine_air_releases`; actual exchanges required by `refine_installation_debris` | Validate substance-specific air method and uncertainty, distinguish captured debris from released mass, and disclose missing factors/measurements. Do not report product VOC content or unknown emissions as zero. | `levolor-cordless-25-0040-024` |\n| `atomization_extra_fixings_complete` | `extra_fixings_anchor`; `extra_fixings_screw`; `extra_fixings_shim` | Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying `refine_extra_fixings` with actual records; unresolved required expansion blocks the dataset. | `levolor-cordless-25-0040-024` |\n| `atomization_cleanup_supplies_complete` | `cleanup_supplies_supplied_water`; `cleanup_supplies_disposable_wipe` | Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying `refine_cleanup_supplies` with actual records; unresolved required expansion blocks the dataset. | `levolor-cordless-25-0040-024` |\n| `atomization_tool_access_service_complete` | actual independently refined exchanges | Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying `refine_tool_access_service` with actual records; unresolved required expansion blocks the dataset. | `levolor-cordless-25-0040-024` |\n| `atomization_tool_access_hourly_service_complete` | actual independently refined exchanges | Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying `refine_tool_access_hourly_service` with actual records; unresolved required expansion blocks the dataset. | `levolor-cordless-25-0040-024` |\n| `atomization_usable_returns_complete` | actual independently refined exchanges | Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying `refine_usable_returns` with actual records; unresolved required expansion blocks the dataset. | `levolor-cordless-25-0040-024` |\n| `atomization_packaging_waste_complete` | `packaging_waste_paper`; `packaging_waste_cardboard`; `packaging_waste_plastic` | Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying `refine_packaging_waste` with actual records; unresolved required expansion blocks the dataset. | `levolor-cordless-25-0040-024` |\n| `atomization_installation_debris_complete` | actual independently refined exchanges | Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying `refine_installation_debris` with actual records; unresolved required expansion blocks the dataset. | `levolor-cordless-25-0040-024` |\n| `atomization_air_releases_complete` | actual independently refined exchanges | Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying `refine_air_releases` with actual records; unresolved required expansion blocks the dataset. | `levolor-cordless-25-0040-024` |\n| `validate_atomic_exchange_unit_and_normalization` | all inventory rows | Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions. |  |\n\n"
