      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `rework_burdens` | shade_install | Keep all preacceptance rework, replacement material, removal/reinstallation and repeat checks in the original job. Failed jobs and unresolved rejects do not increase accepted output; disclose how their campaign burdens are attributed to accepted jobs. No automatic avoided-production/recycling credit. | `levolor-cordless-25-0040-024` |\n| `shared_resources` | actual exchanges required by `refine_tool_access_service`; actual exchanges required by `refine_tool_access_hourly_service`; installation_power; job_logistics | Identify shared drill/access/charger or delivery service, actual shade_install and every other consuming job/node, and bounded service/reporting period. Directly meter attributable use where possible; otherwise assign the declared period total by evidenced causal activity shares and reconcile shares across all consumers. Count power/transport either separately or within a provider dataset once. Use provider-bounded services rather than speculative owned-asset lifetime. Missing denominator or boundary is a gap. | `levolor-cordless-25-0040-024` |\n| `returns_and_stock` | shade_kit; `extra_fixings_anchor`; `extra_fixings_screw`; `extra_fixings_shim`; actual exchanges required by `refine_usable_returns` | Maintain gross receipt, installation consumption, supplier return, closing stock and waste ledger with unique transfer ids for actual custody movements. Opening/closing stocks are inventory balances; retained closing stock is not an extra physical usable output. Actual transfers have named receiving custody and one balance treatment. Returning a usable item does not erase its actual freight/handling; either retain a gross receipt and explicit burden-carrying product exit or apply documented net procurement once, never both a net subtraction and a second credit. Usable exits are not intended coproduct sales. | `levolor-cordless-25-0040-024` |\n\n"
