      applies_to: "reseal_joint"
      requirement: "Mandatory actual-child refinement for reseal_joint/outputs/elementary. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Conditional each pollutant requires actual equipment/fuel/controls and air compartment, using exclusive burned activity. Emissions covered by purchased power/transport or supplier service must not be repeated. Range evidence need: Actual fuel-equipment factor with units/scope/control and burned activity or monitoring required; no generic combustion species factor. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Per actual species: derived burned fuel activity × matching evidenced factor / L. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_reseal_joint_apply_combustion is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
