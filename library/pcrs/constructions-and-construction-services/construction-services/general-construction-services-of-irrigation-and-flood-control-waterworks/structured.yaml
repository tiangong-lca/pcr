      requirement: "Mandatory actual-child refinement for reseal_joint/outputs/elementary. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Conditional each actual elementary exchange is an identified constituent/species in its actual receiving medium. Whole uncontained formulation mass remains an incident and fuel-burn physical ledger field, not an elementary chemical identity. Measure the constituent release or derive it from whole uncontained fluid with evidenced composition and fate/release fraction. Recovered, captured, retained outside stock and closing-stock portions are mutually exclusive; whole-fluid and partial-species views are nonadditive. Unknown actual species/medium blocks final exchange selection. Range evidence need: Actual incident whole-fluid partition plus identified constituent/medium, measured species or composition/fate fractions with source and mass basis required; no generic formulation UUID or default release fraction. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Per actual constituent and receiving medium: measured species kg or whole uncontained fluid kg × evidenced constituent mass fraction × evidenced medium-specific fate/release fraction, divided by L. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_reseal_joint_apply_spill is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_apply_releases; independent actual-child roster and evidence"
validation_rules:
  - rule_id: scope_validation
    applies_to: "all inventory rows"
    rule: "Verify irrigation canal repair function and exclusions; a water-supply/navigation/new lining or major structural reconstruction job cannot use this category."
    source_ids:
      - un-cpc3-2025
  - rule_id: gate_validation
    applies_to: "accepted_joint_reseal"
    rule: "Require face release, project/regional system and compatibility/exposure/head/movement approval, full required cure evidence, actual required adhesion/leakage verification, closed defects and owner acceptance before water reintroduction. Skin time/lab rate alone fails."
    source_ids:
      - sika-pro3-purform-2024
      - sika-civil-water-joints
  - rule_id: length_validation
    applies_to: "accepted_joint_reseal; prepared_joint; qualified_joint_input"
    rule: "Reference equals 1 m unique accepted centreline from complete accepted joints. Positive measured L, same mapped handoff and acceptance event are required; two faces/rod/passes/rework never increase accepted L. Internal lengths remain observed."
    source_ids: []
  - rule_id: outlet_validation
    applies_to: "all inventory rows"
    rule: "Reconcile actual gross net-content receipts before returns, exclusive outlets, stock/burden bridge and old/new material states. Partial species sum cannot stand for whole uncontained fluid; total incident spill cannot be deducted again. Unknown residual is not elementary emission."
    source_ids: []
  - rule_id: preparation_consumable_draw_once
    applies_to: "prep_containment_consumable_liner; prep_containment_consumable_wipe; prep_containment_consumable_absorbent; atom_req_prepare_joint_abrasive_consumable; atom_req_prepare_joint_prep_containment_consumable"
    rule: "For each applicable child, reconcile raw O/R/C and actual fates/cohorts to preparation_consumable_draw; confirm one acquisition owner, one attribution and S/L normalization once. Check closing already excluded and the same stock-burden bridge not applied again. Retain nonreturned waste/loss supply and actual treatment, positive actual usable exits and owned rework. Unknown is incomplete."
    source_ids: []
  - rule_id: period_asset_validation
    applies_to: "atom_req_prepare_joint_prep_assets; atom_req_reseal_joint_apply_assets; accepted_joint_reseal"
    rule: "All nodes/jobs/periods, failure loops and shared service drivers must be explicit with complete manufacture/maintenance/replacement/EOL coverage. Observed completed lives or evidenced prospective remaining-service scenario must support denominator/termination; missing evidence blocks final dataset. No duplicate fuel/spares/service burden."
    source_ids: []
  - rule_id: identity_validation
    applies_to: "all inventory rows"
    rule: "Final exchanges need verified exact identity and support; candidate unresolved rows do not authorise substituted generic resin/cleaner/waste/species. Preserve actual units and source scope."
    source_ids: []
