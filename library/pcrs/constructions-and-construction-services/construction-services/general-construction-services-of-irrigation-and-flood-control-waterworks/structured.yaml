    used_for: "One-part moisture-cure route, sound clean dry faces/old-seal removal, minor edge repair, concrete primer, closed-cell PE backing, ready-to-use and cleaning; product/local/laboratory limitations and project substrate testing. Floor geometry/pack coverage and lab skin/cure/density are not universal canal quantities or full cure acceptance."
