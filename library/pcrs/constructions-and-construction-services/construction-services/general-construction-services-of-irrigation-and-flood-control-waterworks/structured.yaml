      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| scope_validation | all inventory rows | Verify irrigation canal repair function and exclusions; a water-supply/navigation/new lining or major structural reconstruction job cannot use this category. | un-cpc3-2025 |\n| gate_validation | accepted_joint_reseal | Require face release, project/regional system and compatibility/exposure/head/movement approval, full required cure evidence, actual required adhesion/leakage verification, closed defects and owner acceptance before water reintroduction. Skin time/lab rate alone fails. | sika-pro3-purform-2024; sika-civil-water-joints |\n| length_validation | accepted_joint_reseal; prepared_joint; qualified_joint_input | Reference equals 1 m unique accepted centreline from complete accepted joints. Positive measured L, same mapped handoff and acceptance event are required; two faces/rod/passes/rework never increase accepted L. Internal lengths remain observed. |  |\n| outlet_validation | all inventory rows | Reconcile actual gross net-content receipts before returns, exclusive outlets, stock/burden bridge and old/new material states. Partial species sum cannot stand for whole uncontained fluid; total incident spill cannot be deducted again. Unknown residual is not elementary emission. |  |\n| preparation_consumable_draw_once | prep_containment_consumable_liner; prep_containment_consumable_wipe; prep_containment_consumable_absorbent; atom_req_prepare_joint_abrasive_consumable; atom_req_prepare_joint_prep_containment_consumable | For each applicable child, reconcile raw O/R/C and actual fates/cohorts to preparation_consumable_draw; confirm one acquisition owner, one attribution and S/L normalization once. Check closing already excluded and the same stock-burden bridge not applied again. Retain nonreturned waste/loss supply and actual treatment, positive actual usable exits and owned rework. Unknown is incomplete. |  |\n| period_asset_validation | atom_req_prepare_joint_prep_assets; atom_req_reseal_joint_apply_assets; accepted_joint_reseal | All nodes/jobs/periods, failure loops and shared service drivers must be explicit with complete manufacture/maintenance/replacement/EOL coverage. Observed completed lives or evidenced prospective remaining-service scenario must support denominator/termination; missing evidence blocks final dataset. No duplicate fuel/spares/service burden. |  |\n| identity_validation | all inventory rows | Final exchanges need verified exact identity and support; candidate unresolved rows do not authorise substituted generic resin/cleaner/waste/species. Preserve actual units and source scope. |  |\n| atom_req_prepare_joint_abrasive_consumable_complete | prepare_joint | Before final foreground completion, execute cp_atom_req_prepare_joint_abrasive_consumable and atom_req_prepare_joint_abrasive_consumable: all actual children in this role require one concrete object/state/medium and one explicit exchange property/unit, independent original quantity and evidenced conversion if needed, exact identity/support and reconciled owner/stock/fate/transfer scope. Each group is separate; no heterogeneous sum, guessed absence, parent-total/Range copying or duplicate assembly/provider/carrier burdens. Unresolved evidence means incomplete; pcr:check does not automatically execute or prove actual site roster completion. |  |\n| atom_req_prepare_joint_prep_fuel_complete | prepare_joint | Before final foreground completion, execute cp_atom_req_prepare_joint_prep_fuel and atom_req_prepare_joint_prep_fuel: all actual children in this role require one concrete object/state/medium and one explicit exchange property/unit, independent original quantity and evidenced conversion if needed, exact identity/support and reconciled owner/stock/fate/transfer scope. Each group is separate; no heterogeneous sum, guessed absence, parent-total/Range copying or duplicate assembly/provider/carr