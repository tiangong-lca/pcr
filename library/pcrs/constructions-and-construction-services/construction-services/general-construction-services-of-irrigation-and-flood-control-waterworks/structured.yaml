    - protocol_id: cp_atom_req_prepare_joint_abrasive_consumable
      process_id: "prepare_joint"
      flow_role: "atom_req_prepare_joint_abrasive_consumable"
      record_type: "mandatory_refinement"
      raw_fields: "parent_requirement_id; actual_child_row_id; single_object_or_true_mixed_carrier; sku_or_service_result_or_species; physical_state_or_gate; process_id; direction; flow_type; one_exchange_property; one_exchange_unit; receiving_compartment; source_or_destination; event_id; period_id; measurement_point; timestamp; independent_quantity; quantity_evidence; auxiliary_measurements; supported_conversion; provider_or_assembly_scope; overlap_owner; stock_fate_ledger_id; actual_absence_evidence; unresolved_reason; completion_status; opening_mass_kg; external_receipts_net_mass_kg; closing_carried_mass_kg; stock_scope_id; acquisition_owner_node_id; cohort_source_ids; cohort_quantities_kg; cohort_upstream_dataset_refs; closing_carried_cohort_refs; attribution_driver; complete_consumer_shares; stock_adjustment_applied; actual_usable_return_kg; actual_usable_transfer_kg; actual_nonreturned_waste_kg; actual_loss_kg; actual_fate_event_ids; internal_pair_id"
      collection_method: "Enumerate the actual child roster under this requirement; bind every independently measured event to one child/material+property+unit+state/medium group. Use cp_prep_material with its original raw fields and method for each applicable compatible group, not as an undifferentiated parent total. Close input/output/stock/fate and paired transfers per same object/unit; retain parent totals only as nonadditive diagnostics. Whole mixed waste carrier and its included contaminant views are nonadditive. Record actual absence or unresolved evidence explicitly; never fill unknown with zero. All original preparation/rework/period/provider/asset and Range-evidence duties remain mandatory. Only for the children/requirements explicitly listed by preparation_consumable_draw, apply that rule independently. Its added stock fields apply only to those children; other CP roles retain their own original operands. Keep measured gross receipt R as a raw record, not an additional exchange beside stock-adjusted S; preserve all cohort/custody locations and actual U/X, nonreturned waste and loss. For these children the original stock-burden bridge is reconciliation of S only, with stock_adjustment_applied = true; never charge inherited opening burden or deduct carried closing again. Real internal feeds retain actual paired quantities and one acquisition owner. Unused material actually discarded or lost remains in S with its actual own-node carrier/substance and treatment/receiving-medium records. Do not exclude its supply or omit its outlet under a consumed-only alternative."
      unit: "One explicit child unit per separately indexed record"
      frequency: "Each actual child/event and complete phase close"
      temporal_coverage: "Original full boundary and all applicable periods"
      site_scope: "prepare_joint"
      aggregation_rule: "per reference flow"
      quality_evidence: "Roster/quantity/unit/identity/scope/closure missing = incomplete; check is methodological, not automatic proof of site completion"
