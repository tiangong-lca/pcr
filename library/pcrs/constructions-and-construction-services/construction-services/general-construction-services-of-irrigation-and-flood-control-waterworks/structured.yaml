system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers bounded replacement of failed applied elastomeric sealant in movement joints of retained concrete irrigation canals. The actual route uses an approved compatible one-part moisture-curing polyurethane system with specified primer and backing. Removal, face preparation, local job-caused minor repair, application, protection, full required cure and acceptance belong to the service. [sika-civil-water-joints; sika-pro3-purform-2024] It excludes new canal formation or lining, major joint-edge reconstruction, embedded waterstop replacement, mechanically locked preformed glands, two-part or booster-assisted sealants, water-supply aqueducts, pipelines, navigation canals, dams/levees and subsequent water conveyance. Canal irrigation function must be verified; CPC 54234 is broader than this maintenance service. [un-cpc3-2025] The cited NZ product sheet demonstrates the route, rather than approving every canal or regional product. Project/manufacturer approval must cover actual water chemistry, immersion/head, movement, substrate and old-residue compatibility, regional instruction and full cure before water return. Skin formation or laboratory millimetres per day alone cannot release the joint."
      source_ids:
        - un-cpc3-2025
        - sika-civil-water-joints
        - sika-pro3-purform-2024
    - rule_id: retained_host
      applies_to: "all inventory rows"
      rule: "Exclude historic whole-canal construction and future conveyance; include all incremental current removal, minor job-caused remedies, pumping/cleanup, application, protection/cure and required test resources regardless of payer. No avoided-new-canal credit."
      source_ids:
        - un-cpc3-2025
        - sika-pro3-purform-2024
    - rule_id: prepare_gate
      applies_to: "prepare_joint"
      rule: "Input is failed contaminated seal/retained concrete. Remove incompatible residues and loose material, repair actual minor damaged edges, remove dust; sound clean dry faces and geometry require documented release to reseal_joint. Primer does not compensate for poor preparation. Major reconstruction leaves scope."
      source_ids:
        - sika-pro3-purform-2024
    - rule_id: application_gate
      applies_to: "reseal_joint"
      rule: "Input is qualified faces; approved regional system and project-specific adhesion trial cover old residues, movement and water exposure/head/chemistry. Place specified closed-cell PE backing, primer and ready-to-use one-part sealant; tool/protect and verify full required cure, required checks and owner acceptance before water return. No independent mixing or skin-time output."
      source_ids:
        - sika-pro3-purform-2024
        - sika-civil-water-joints
    - rule_id: stock_custody
      applies_to: "all inventory rows"
      rule: "Gross external receipt and internal issue ledgers are distinct. Record outward product returns as real custody exits without first netting input; closing stock is not an output exchange. Opening-stock upstream burden and closing-stock carry-forward accompany physical lots across periods; supplier-included packaging/services are charged once."
      source_ids: []
    - rule_id: fluid_outlets
      applies_to: "atom_req_prepare_joint_prep_fuel; atom_req_reseal_joint_apply_fuel; atom_req_prepare_joint_prep_spill; atom_req_reseal_joint_apply_spill; atom_req_prepare_joint_prep_combustion; atom_req_reseal_joint_apply_combustion; atom_req_reseal_joint_curing_release"
      rule: "Use gross fuel input when returns/waste/releases are separately represented; burned fuel is derived after mutually exclusive unburned outlets/stock. Total spill is audit only; partition recovered, treated, retained outside closing stock and whole uncontained fluid, never deduct total again. Whole fluid kg is the physical incident/fuel ledger; elementary exchanges require identified constituents/media with measured species or evidenced composition/fate fractions. Whole-fluid and partial species views are nonadditive. Retained contaminated residue outside closing stock is a mutually exclusive outlet; never subtract it again when already in closing stock."
      source_ids: []
    - rule_id: period_asset_boundary
      applies_to: "atom_req_prepare_joint_prep_assets; atom_req_reseal_joint_apply_assets"
      rule: "Index removal, application, cure/protection, tests, failures and handover by period. Shared equipment and temporary works link every consuming job/node/period; complete manufacture/maintenance/replacements/EOL coverage is required with explicit observed or justified prospective remaining-life scenario. Direct fuel/spares and supplier-included equipment must not duplicate allocated asset burden."
      source_ids: []
