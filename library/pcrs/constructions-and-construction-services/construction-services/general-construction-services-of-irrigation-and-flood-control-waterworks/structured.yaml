      record_type: "Actual foreground records"
      raw_fields: "job_id; joint_id; mapped_segments; period_id; acceptance_date_utc; start_station_m; end_station_m; unique_accepted_length_L_m; survey_method; calibration; full_joint_gate_closed; cure_release_id; required_test_release_id; defect_closure_id; owner_acceptance_id; authorised_water_return"
