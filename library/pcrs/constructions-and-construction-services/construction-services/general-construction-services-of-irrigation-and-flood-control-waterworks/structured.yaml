      requirement: "Mandatory actual-child refinement for reseal_joint/outputs/product. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Conditional unused sealant/primer/cleaner/fuel product returned across custody boundary expands each formulation/lot separately. Closing stock stays internal with carried-forward upstream burden. Range evidence need: Actual dispatch/custody/product state and corresponding gross receipts/stock burden bridge required; no presumed return or credit. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Actual tare-free outward returned product kg / L, with matching gross input and burden ledger. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_reseal_joint_apply_returns is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_apply_outlets; independent actual-child roster and evidence"
    - id: atom_req_reseal_joint_application_waste
      applies_to: "reseal_joint"
      requirement: "Mandatory actual-child refinement for reseal_joint/outputs/waste. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Separate uncured sealant, cured cut-outs from rejected/reworked seals, primer/cleaner residues and contaminated absorbents by actual composition/receiver. Rework retains all burdens and no accepted length until repaired gate closes. Range evidence need: Actual wet/cured state, formulation, weighed net wastes, rejection/removal event and receiver needed; no assumed wet-to-cured retention or disposal factor. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Actual material-specific net waste kg dispatched / L. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_reseal_joint_application_waste is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_apply_outlets; independent actual-child roster and evidence"
    - id: atom_req_reseal_joint_apply_packaging
      applies_to: "reseal_joint"
      requirement: "Mandatory actual-child refinement for reseal_joint/outputs/waste. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Separate actual foil/plastic/cardboard and uncontaminated PE offcuts by material/route. Contaminated chemical packages belong to identified chemical waste. Retained reusable containers are not discarded output and upstream package burden is charged once. Range evidence need: Actual packaging tare/material, contamination, PE offcut weights and receiver evidence needed; no fixed pack-to-waste factor. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Actual destination-specific net discarded material kg / L. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_reseal_joint_apply_packaging is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_apply_outlets; independent actual-child roster and evidence"
    - id: atom_req_reseal_joint_captured_test_water
      applies_to: "reseal_joint"
      requirement: "Mandatory actual-child refinement for reseal_joint/outputs/waste. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Conditional water captured for treatment is distinct from chemical residue and direct environmental discharge. Record actual contaminants/wet solids, receiver and net mixture mass without summing input water twice. Actual direct discharge requires separately identified substances/receiving medium. Range evidence need: Actual capture/receiver record, water/solids/contaminants and measured volume-density or mass needed; no assumption all test water is waste. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Actual captured destination-specific net water/effluent kg / L. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_reseal_joint_captured_test_water is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_apply_outlets; independent actual-child roster and evidence"
    - id: atom_req_reseal_joint_curing_release
      applies_to: "reseal_joint"
      requirement: "Mandatory actual-child refinement for reseal_joint/outputs/elementary. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Each actual emitted species and receiving medium requires formulation/reaction or monitored evidence. Primer/cleaner volatiles and moisture-cure chemistry cannot be inferred from low-monomer/EC1plus/VOC labels; retain measured water uptake/reaction terms separate from retained host/weather moisture and residual balance. Range evidence need: Actual species, receiving medium, wet solids/volatile fraction, moisture uptake/reaction products, field cure and captured residues with uncertainty needed; missing balance is not emission. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Per actual species: monitored release or actual applicable formulation/reaction/activity calculation / L. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_reseal_joint_curing_release is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
