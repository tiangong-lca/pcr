      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| no_coproduct | all inventory rows | This service has no assumed sale co-product. Retained concrete, removed old seal and rejected work are not accepted service. Record actual recovered material route separately without automatic substitution credit. |  |\n| rework_burden | prepare_joint; reseal_joint | Failed preparation loops within prepare_joint; failed application/adhesion/cure/leakage loops reseal_joint to its actual responsible node. All repeat inputs, protection, tests/removal and exits stay with the job; accepted complete length enters denominator once. Unrepaired defects block acceptance. | sika-pro3-purform-2024 |\n| shared_assets | atom_req_prepare_joint_prep_assets; atom_req_reseal_joint_apply_assets | Use per-asset physical service drivers justified by actual use (metered operating time or measured activity), enumerating all jobs, nodes and periods. Numerator is actual job service; denominator covers complete observed life or observed service plus evidenced prospective remaining service/replacement/termination/EOL scenario. Include manufacture, maintenance, replacements and EOL once; exclude direct fuel/spares already counted. Missing complete coverage/denominator blocks final dataset. |  |\n| period_bridge | all inventory rows | Enumerate removal, application, protected cure, tests/rework and acceptance dates/reporting periods. Carry unfinished-work burden to the accepted job, never release a period-cut uncured output. Assign shared events once by job/node/period. Opening-stock burden plus gross receipts equals attributable used/dispatched burden plus closing-stock carry-forward; disclose returns/wastes and never call closing stock outward flow. |  |\n| service_overlap | atom_req_prepare_joint_prep_transport; atom_req_reseal_joint_apply_transport; prep_electricity; apply_electricity; atom_req_prepare_joint_prep_assets; atom_req_reseal_joint_apply_assets | Document provider inclusion matrices; purchased complete service and its included energy/equipment/packaging/logistics are alternative representations. Internal prepared_joint transfer moves burden without purchasing the same complete treatment again. |  |\n| atom_grouped_ledgers | all actual-child records | Apply every existing stock, allocation, emission and closure formula separately by concrete child identity/material, state, one exchange property/unit, receiving medium and ownership/event scope. Native and converted views are nonadditive. A family diagnostic total is never a flow identity or every child numerator; keep incomplete portions explicit. Complete formulations, assemblies and genuinely bounded single-function services remain whole, with included constituents/resources not purchased again. |  |\n\n"
