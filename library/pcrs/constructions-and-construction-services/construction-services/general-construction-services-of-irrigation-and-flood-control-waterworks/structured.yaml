  calculation_rules:
    - id: length_intensity
      applies_to: "all inventory rows"
      rule: "For each distinct exchange, intensity = attributable job quantity in its stated unit / accepted complete-joint centreline L in m. Reference output is exactly 1 m; internal prepared/received lengths remain observed and burden transfers once."
      inputs:
        - "actual job quantity"
        - L
        - cp_accept
      output: "exchange quantity per reference flow"
      source_ids: []
    - id: actual_density_conversion
      applies_to: "preparation_water; application_test_water; preparation_cleaner; repair_mortar; sealant_supplied; concrete_primer; tooling_cleaner; atom_req_prepare_joint_prep_fuel; atom_req_reseal_joint_apply_fuel"
      rule: "Net content kg = gross weighed kg - actual container tare kg. Only if directly recorded in volume: actual mass kg = actual volume L × exact formulation/lot density kg/L at recorded temperature/state. For fuel rows use fuel_volume_L × fuel_density_kg_per_L at fuel_density_temperature_degC/fuel_density_state from the linked utilities protocol. Nominal pack count/density cannot replace evidence. Do not use return-netted input."
      inputs:
        - gross_weight_kg
        - container_tare_kg
        - actual_volume_L
        - actual_density_kg_per_L
        - density_temperature_degC
        - density_state
        - density_source
        - fuel_volume_L
        - fuel_density_kg_per_L
        - fuel_density_temperature_degC
        - fuel_density_state
        - cp_prep_material
        - cp_apply_material
        - cp_prep_utilities
        - cp_apply_utilities
      output: "gross net-content material kg"
      source_ids: []
    - id: fuel_burned_activity
      applies_to: "atom_req_prepare_joint_prep_fuel; atom_req_reseal_joint_apply_fuel; atom_req_prepare_joint_prep_combustion; atom_req_reseal_joint_apply_combustion"
      rule: "Burned fuel kg = opening fuel kg + gross received fuel kg - closing fuel kg - actual outward unburned return kg - actual unburned waste kg - retained contaminated fuel residue outside closing stock kg - whole uncontained fuel kg; recovered spills enter only their final exclusive outlet. Retained contaminated residue outside closing stock is mutually exclusive with closing fuel stock; if included in closing stock, do not subtract it again. Total incident spill is audit only and is never an additional subtraction."
      inputs:
        - cp_prep_utilities
        - cp_apply_utilities
        - cp_prep_outlets
        - cp_apply_outlets
        - cp_prep_releases
        - cp_apply_releases
      output: "actual burned fuel activity for species calculation"
      source_ids: []
    - id: transport_work
      applies_to: "atom_req_prepare_joint_prep_transport; atom_req_reseal_joint_apply_transport"
      rule: "Each loaded leg activity kg*km = actual net cargo kg × loaded distance km; sum attributed legs and divide by L. If actual provider unit t*km is used, 1 t*km = 1000 kg*km; preserve listed factor and real cargo/route."
      inputs:
        - net_cargo_kg
        - loaded_distance_km
        - cp_prep_logistics
        - cp_apply_logistics
        - cp_accept
      output: "transport intensity kg*km per reference flow"
      source_ids: []
    - id: asset_share
      applies_to: "atom_req_prepare_joint_prep_assets; atom_req_reseal_joint_apply_assets"
      rule: "For each actual asset, fractional complete-life service = actual job/node service driver / complete-life driver; complete-life driver = observed driver plus justified prospective remaining driver for in-service assets. Multiply full-life manufacture/maintenance/replacements/EOL inventory by fractional share, divide by L, and exclude separately counted fuel/spares. Shares across all jobs/nodes/periods sum to one over complete life."
      inputs:
        - job_driver
        - observed_life_driver
        - forecast_remaining_driver
        - "complete asset inventory"
        - cp_prep_assets
        - cp_apply_assets
        - cp_accept
      output: "per-asset allocated service and inventory per reference flow"
      source_ids: []
    - id: species_release
      applies_to: "atom_req_prepare_joint_prep_dust; atom_req_prepare_joint_prep_combustion; atom_req_reseal_joint_apply_combustion; atom_req_reseal_joint_curing_release; atom_req_prepare_joint_prep_spill; atom_req_reseal_joint_apply_spill"
      rule: "Per actual species/size/medium: release kg = monitored kg or actual matching activity × evidenced factor in kg/activity-unit. For incident constituent releases use measured species kg or whole_uncontained_fluid_kg × constituent_mass_fraction × medium_release_fraction, each fraction with actual source and mass/fate basis. Whole fluid is an incident ledger quantity, not an elementary identity. Select one accounting route per release. Moisture-cure reaction/wet-to-cured retention requires actual formulation/field evidence; no conversion from low-monomer/VOC labels or unknown residual. Divide actual release by L."
      inputs:
        - monitored_mass_kg
        - factor_value
        - factor_numerator_unit
        - factor_activity_unit
        - factor_source
        - "matching burned/reaction/material activity"
        - whole_uncontained_fluid_kg
        - constituent_mass_fraction
        - fraction_mass_basis
        - composition_source
        - medium_release_fraction
        - fate_fraction_basis
        - fate_source
        - cp_prep_releases
        - cp_apply_releases
        - cp_accept
      output: "species-specific release intensity kg per reference flow"
      source_ids: []
    - id: stock_material_bridge
      applies_to: "preparation_water; application_test_water; preparation_cleaner; atom_req_prepare_joint_abrasive_consumable; atom_req_prepare_joint_prep_containment_consumable; repair_mortar; sealant_supplied; concrete_primer; polyethylene_backing; backing_returns; tooling_cleaner; atom_req_prepare_joint_prep_returns; atom_req_reseal_joint_apply_returns; atom_req_reseal_joint_application_waste; atom_req_reseal_joint_curing_release; cure_moisture_uptake"
      rule: "For each material/state/native unit: opening stock + gross external receipts = actual outward product returns + retained closing stock + mutually exclusive final installed or retained material, outward waste and actual whole uncontained fluid outlet; intermediate consumed/issued quantity is a process ledger movement, never added to its own waste/releases, with internal issue logged but not added as another receipt. For backing retain native m and distinguish final installed length, outward returned length, retained stock and measured cut waste length before any separately evidenced mass conversion. The component/reaction/speciation ledger is separate and nonadditive with whole-fluid physical outlets. For reaction balance separately identify actual atmospheric water uptake, supplied water, retained-host/weather moisture and evidenced reaction products; these terms are not generic ingredient losses. Wet-to-cured balance additionally identifies evidenced reaction/moisture/water terms; unknown residual blocks balance closure rather than becoming emission. Opening upstream burden + receipt burden = used/dispatched burden + closing carried-forward burden with no duplicate issue charge. For the abrasive and preparation-containment consumable roles, preparation_consumable_draw fixes the inventory numerator as already stock-adjusted S; this physical/source-cohort bridge only reconciles that same assignment and never nets unreturned waste or subtracts closing twice."
      inputs:
        - cp_prep_material
        - cp_apply_material
        - cp_prep_outlets
        - cp_apply_outlets
        - cp_apply_releases
      output: "reconciled physical and upstream-burden ledgers"
      source_ids: []
    - id: preparation_consumable_draw
      applies_to: "prep_containment_consumable_liner; prep_containment_consumable_wipe; prep_containment_consumable_absorbent; atom_req_prepare_joint_abrasive_consumable; atom_req_prepare_joint_prep_containment_consumable"
      rule: "For each independently identified material/SKU, current state, owning stock scope and period, let O_kg = opening_mass_kg, R_kg = external_receipts_net_mass_kg and C_kg = closing_carried_mass_kg. The attributable gross draw before actual usable outward exits is S_kg = O_kg + R_kg - C_kg. R is measured net of tare across this scope boundary, not another node's internal feed; C is all intact unused stock carried forward across the actual custody locations, excluding positive outward exits, installed material, waste and processed WIP. Retain physical source-cohort balances before attribution. Where the original PCR requires a shared-material share, derive O/R/C from those same source records under one evidenced driver and complete consumer shares summing to one; S is already attributable, so never apply that share again. Only the declared acquisition owner records S as external supply. A real internal feed instead uses its independently evidenced paired transfer quantity, with no second acquisition or stock deduction. The card quantity is S_kg / L once, including all nonreturned waste/loss and any actual positive usable U/X exits before their separately documented original-upstream-burden handoff. U/X are disjoint real exits, not closing stock or fictitious inventory changes; all work/rework/handling burdens stay with the job. Record stock_adjustment_applied = true for this S representation. Opening and carried-closing source-cohort quantities and upstream dataset references explain this same assignment; the stock-burden bridge is its reconciliation only, never a second subtraction, compensating exchange or extra burden charge. Unknown cohort ownership, negative S or unexplained stock/fate discrepancies block completion."
      inputs:
        - opening_mass_kg
        - external_receipts_net_mass_kg
        - closing_carried_mass_kg
        - stock_scope_id
        - cohort_source_ids
        - cohort_quantities_kg
        - cohort_upstream_dataset_refs
        - attribution_driver
        - complete_consumer_shares
        - actual_fate_event_ids
        - stock_adjustment_applied
      output: "S_kg before normalization; stock_adjustment_applied = true"
      source_ids: []
    - id: atmospheric_reaction_intake
      applies_to: "cure_moisture_uptake"
      rule: "Actual atmospheric water uptake kg = measured reaction-specific intake or actual reacted formulation quantity × evidenced formulation-specific water demand per same quantity; require actual reaction extent/state and distinguish reaction products, host/weather/supplied water. Humidity or unknown wet-to-cured residual alone is not uptake evidence. Divide actual uptake kg by L."
      inputs:
        - moisture_uptake_kg
        - wet_mass_kg
        - retained_cured_mass_kg
        - reaction_product_kg
        - "actual reaction extent and formulation-specific stoichiometry/source"
        - weather_water_kg
        - retained_host_water_kg
        - cp_apply_releases
        - cp_accept
      output: "actual atmospheric water intake kg per reference flow"
      source_ids: []
