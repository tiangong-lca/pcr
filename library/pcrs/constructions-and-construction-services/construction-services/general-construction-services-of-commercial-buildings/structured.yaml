  []
measurement_rules:
  - id: reference_area
    applies_to: "accepted_cat_a_office"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "A>0 is unique surveyed accepted net internal office area under the declared convention; count accepted polygons once after coordinated gate closure. Associated cores/external systems enter causal burdens, not free exclusions or extra denominator area."
  - id: native_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual native property"
      uuid: ""
    required_unit: "actual native unit"
    rule: "Preserve supplied Area, Count, Length, Volume, Mass and service units. A separate needed mass view requires actual SKU density, state, moisture and temperature with units/source; it is nonadditive to the native ledger. Energy/Time and provider-native support require independent verification."
process_map:
  - id: stripout
    name: "Survey, isolate and selectively strip out"
    inclusion: "required"
    inclusion_condition: "Actual declared contract and footprint"
    role: "Source is retained office fittings; independent removal responsibility releases substrate to integration and dispatches removed waste to receiving treatment."
    quantitative_reference: "per reference flow"
  - id: integration
    name: "Integrate actual Cat A base services and basic finishes"
    inclusion: "required"
    inclusion_condition: "Actual declared contract and footprint"
    role: "Integrates actual surface/component/service roles into installed office state for testing; embedded finishes and flushing have no separate claimed handoff."
    quantitative_reference: "per reference flow"
  - id: test_handover
    name: "Coordinate tests and landlord acceptance"
    inclusion: "required"
    inclusion_condition: "Actual declared contract and footprint"
    role: "Owns actual coordinated tests and record/defect closure; failures loop to integration; only closed accepted polygons enter A."
    quantitative_reference: "per reference flow"
  - id: site_support
    name: "Own project support resources across all phases"
    inclusion: "required"
    inclusion_condition: "Actual declared contract and footprint"
    role: "Owns shared access/power/provider/test/freight/asset/emission ledgers for all nodes and periods once; event owning_node links preserve physical responsibility."
    quantitative_reference: "per reference flow"
