schema_version: 2
generated_from: markdown
source_markdown: pcr.en-US.md
product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.general-construction-services-of-commercial-buildings"
  classification_refs: "cpc:3.0:54122 (narrower)"
  covered_products: "Integrated retained-office Cat A landlord refurbishment under actual contract scope."
  excluded_products: "New buildings; extensions/new floor area; structural rebuilding; change of use; tenant Cat B; future operation."
  representative_product: "Accepted retained office-space base-building services and basic finishes at landlord handover."
  production_route: "Survey/isolate → selective stripout and substrate release → coordinated Cat A installation → testing/retesting and defect-closed landlord handover."
  market_state: "Completed construction/refurbishment service, not an at-plant material package or occupied tenant office."
functional_unit:
  what: "Landlord-accepted integrated Cat A office refurbishment within the declared retained footprint."
  how_much: "1 m2"
  how_well: "Actual contracted interface/system schedule and required tests, records and defect closure accepted by landlord."
  how_long_or_cycle: "One actual intervention from prework survey through sectional/final acceptance, with phase/period IDs; no assumed service life."
  reference_flow_link: "accepted_cat_a_office"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers a completed integrated landlord Category A refurbishment within a surveyed retained commercial office space. Its product is an actual contract-defined base-building services and basic-finishes state ready for later tenant fit-out. The landlord acceptance gate coordinates retained conditions, physical installations and required testing; it is not an assertion that every typical Cat A component is present or that a tenant can occupy an operational Cat B workplace. [wdi-cat-a-b-fitout]"
      source_ids:
        - wdi-cat-a-b-fitout
    - rule_id: retained_start
      applies_to: "all nodes"
      rule: "Start from surveyed retained building, demised footprint, live occupancy/phasing, retained-capacity/fire/access survey and retained/replaced services schedule. Own actual selective stripout, hazard controls and substrate release. Existing historic assets are neither new purchases nor negative receipts."
      source_ids:
        - wdi-cat-a-b-fitout
        - wdi-riverside-refurbishment
    - rule_id: contract_cat_a
      applies_to: "integration; test_handover"
      rule: "The actual approved landlord contract defines Cat A components, interface points and test criteria. Floors/ceilings/basic finishes and coordinated base electrical/lighting, HVAC/wet/fire services are included when actually required. The label is not a universal specification or tenant occupation certificate."
      source_ids:
        - wdi-cat-a-b-fitout
        - wdi-riverside-refurbishment
    - rule_id: support_ownership
      applies_to: "site_support"
      rule: "Own direct, rental, provider, test, spare, transport and temporary utility resources once for all nodes. Attribute actual needed common cores and retained whole-system upgrades causally to the footprint and other beneficiaries; unresolved coverage blocks completed data."
      source_ids: []
    - rule_id: exclusions
      applies_to: "all nodes"
      rule: "Exclude new whole buildings, extensions/new floor space, structural rebuilding, use conversion, Cat B bespoke partitions/furniture/IT/equipment and future office operation. Riverside evidences phased interface work only; exclude its extension/new area/Cat B, webpage zero statistics, BREEAM grade and case dimensions as defaults."
      source_ids:
        - wdi-cat-a-b-fitout
        - wdi-riverside-refurbishment
boundary_abstraction:
  declared_starting_condition: "Surveyed retained office footprint with actual substrates, existing services/capacity, occupancy and approved scope."
  starting_condition_role: "Retained context and intervention starting state, not a purchased new building."
  product_classification_scope: "Commercial-office repair/alteration subset of CPC 54122."
  recursive_input_rule: "Treat same-category completed subcontract work as upstream only with distinct physical scope/native result and complete burden coverage; exclude duplicated direct resources and internal office-state transfers."
  upstream_dataset_requirement: "Actual SKU/provider/geography/technology/native-unit datasets with explicit supply, freight, asset and waste coverage; expand gaps before finalization."
  disclosure: "Retained/replaced conditions, common/core causal scope, occupancy/phases, contract interfaces, test gates, covered upstream resources and exclusions."
