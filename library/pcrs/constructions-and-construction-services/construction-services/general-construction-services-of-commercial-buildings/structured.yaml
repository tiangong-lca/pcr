validation_rules:
  - rule_id: gate_area
    applies_to: "reference and handover"
    rule: "Require surveyed convention/polygons and A>0, no overlaps or premature partial area, actual contract system schedule and all applicable electrical/HVAC balancing/control/wet/fire tests, retests, record drawings/O&M, defect closure and landlord signoff. Actual approval requirements remain project-specific; Cat A alone proves none."
    source_ids:
      - wdi-cat-a-b-fitout
      - wdi-riverside-refurbishment
  - rule_id: balance_native
    applies_to: "all inventory rows"
    rule: "Reconcile native supply, matched returns, contained wastes, installed stocks and direct releases by event/SKU. Reconcile opening, external receipts and closing balances; recovered fuel retained at the boundary is already included in closing, never an additional fate. Outward return, nonburned waste, uncontained loss and closing are disjoint destinations. Historic assets cannot offset new supply; no duplicate kit/BOM, provider/direct or freight coverage."
    source_ids: []
  - rule_id: fuel_species
    applies_to: "site_support"
    rule: "Actual burn uses measured burn OR an audited complete set of disjoint native-unit fates with uncertainty and unknown-loss investigation. Return, nonburned waste, uncontained loss and carry are mutually exclusive; no residual inferred burn. Total spill is audit only and recovered closing is already closing. Require actual species/medium and measured mass, matched activity-factor or measured whole-fluid composition/fate basis; whole-fluid and species views are nonadditive, SDS/no-VOC claims are not quantities."
    source_ids: []
  - rule_id: shared_rework
    applies_to: "all nodes"
    rule: "Check full-life consumers/periods, compatible drivers, replacements/termination/EOL and one burden view; unknown full-life coverage blocks finalization. Match transfer/defect IDs and waste destinations; no rejected state in accepted A. Required actual direct water/gas roles must be expanded with dedicated measured exchanges and CP operands before final data."
    source_ids: []
  - rule_id: identity_coverage
    applies_to: "all inventory rows"
    rule: "Expand every actual SKU/provider/waste/species umbrella into verified concrete exchanges with native property/unit support. Unresolved identities or omitted physical provider, temporary/test/spare/transport resources block final data; a candidate check is not publication or UUID verification."
    source_ids: []
