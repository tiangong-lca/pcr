allocation_rules:
  - rule_id: single_output
    applies_to: "final output"
    rule: "One intended output is accepted Cat A service area. Internal state transfers and tested trade surfaces are not co-products; exclude unresolved or failed polygons from A until defect closure. No avoided-burden credit for historic recovered material."
    source_ids: []
  - rule_id: stocks_returns
    applies_to: "materials and fuel"
    rule: "S = attributed opening stock + external net tare-corrected receipts - carried closing stock. Internal issues/installed activity are not new purchases. Choose gross-with-outlets OR consumed-only matched usable outward-return netting once; no extra credit. All nonreturned loss/waste retains upstream supply burden."
    source_ids: []
  - rule_id: shared_complete_life
    applies_to: "site_support"
    rule: "Identify each shared access/utility/tool/test asset, all consuming nodes stripout/integration/test_handover and all external jobs/nodes/periods over full life. Use compatible actual job_driver / full_life_driver with observed life OR observed history plus evidenced remainder, replacements, termination and end of life; retain sources, uncertainty, sensitivity and update. Asset-equivalent amount=(job_driver/full_life_driver)/A with complete manufacture/maintenance/replacement/EOL burden; alternatively a lifecycle-complete per-driver service quantity=job_driver/A in matching unit, never both."
    source_ids: []
  - rule_id: phases_rework
    applies_to: "all nodes"
    rule: "Index survey/isolation, stripout, installation, testing/retesting and signed sectional/final completion by actual phase and period. Failed tests return affected installed state to integration with defect IDs; discarded/replaced items exit via the owning waste row. Retain all failed attempt and replacement burdens with accepted A once, without a second sale, year or area denominator."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_stripout_material
      process_id: "stripout"
      flow_role: "Linked actual physical roles"
      record_type: "Traceable actual measurement and event record"
      raw_fields: "site_id; job_id; building_id; footprint_id; process_id; phase_id; period_id; event_id; transfer_id; reference_gate_id; accepted_area_A; reference_area_unit; sku; lot_id; hazard_state; historic_origin; reusable_state; reusable_quantity; reusable_native_unit; reusable_receiver; reusable_transfer_id; unique_owner; opening; gross_receipts; tare; closing; usable_outward_return; contained_waste_mass; contained_waste_volume; waste_volume_unit; waste_state; waste_receiver; treatment_destination; quantity_unit; density; density_unit; density_source; moisture; moisture_basis; temperature; temperature_unit; conversion_factor; conversion_unit; conversion_source; net_receipts; receipt_basis; gross_receipt_mass_kg; tare_mass_kg; receipt_measurement_unit; receipt_conversion_sku_state; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Weigh and reconcile each actual material/waste lot and matched usable outward return with containment and receiving records.  Retain external net_receipts in quantity_unit and its receipt_basis. Apply stock_throughput to that net native quantity; raw gross_receipts/tare are audit observations with explicit measurement units, not automatic native-unit operands. For a weighed route preserve gross_receipt_mass_kg and tare_mass_kg and any same-SKU/state conversion; for an already net or nonweighed receipt record its net quantity and mark inapplicable weighing fields explicitly, with no second tare deduction. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity aliases this record independent physical quantity keyed by atomic_flow_row_id under the original CP method and atomic_child_normalization, never another parent quantity. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      unit: "actual native unit"
