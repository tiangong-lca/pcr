measurement_rules:
  - id: accepted_length
    applies_to: "reference product"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "D is the sum of actual material centreline length of final unique accepted tube pieces in cp_acceptance; divide each exchange numerator by the same positive D. Include insertion/true bends/slack; exclude fitting bodies and removed/rejected/stock pieces."
