published_dataset_profile:
  dataset_role: "Foreground-measured installation-to-acceptance service data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "One metre of copper-crimp PEX-B potable-water installation with declared configuration/interfaces/gate, and downstream process/lifecyclemodel projections"
  excluded_use: "Clamp, expansion, push-fit and other material/joining routes; whole-building systems; fixtures/heaters/civil mains; pipe operating lifetime; final publication with unresolved identities"
  required_metadata: "Location/job/period, SKU/sizes/hot-cold/branch BOM, final piece IDs and D method, interfaces, test/correction/acceptance, supply/packaging/asset/service boundaries, six protocols and source revisions"
  required_quality_disclosure: "Identity and Energy/Duration support gaps, per-card range evidence needs, metering/causal attribution uncertainty, unclosed quantities, lifetime/maintenance/termination evidence and uncovered responsibilities"
  update_trigger: "Changes in route/material/SKU, interfaces, acceptance specification, supply boundary, asset/contract, measurement or source evidence"
data_sources:
  - id: "sharkbite-pex-2021"
    type: "handbook"
    reference: "https://www.sharkbite.com/sites/default/files/files/sharkbite-pex-install-guide-2021-02.pdf"
    used_for: "PDF p5 copper crimp/go-no-go and restrictions; p6 supports. Route, compatibility, damaged-component and support responsibility; thermal expansion example is not a consumption factor."
  - id: "rwc-piping-2024"
    type: "handbook"
    reference: "https://www.sharkbite.com/sites/default/files/files/RWC-Piping-Systems-Install-Guide-2024.pdf"
    used_for: "PDF p18 crimp; p44 dimensions/nominal mass/capacity; p46 conditional disinfection; p47 water testing. Route and conditional point factors; confirm source-gal convention and do not import other-route tests."
  - id: "accepted-length-normalization"
    type: "method_factor"
    reference: "This PCR sections 3 and 8: accepted-length normalization identity and cp_acceptance measurement"
    used_for: "Local mathematical method: divide each recorded job quantity by the positive numerical accepted length D measured in m; normalized output is 1 m. No external empirical factor or range is claimed."
