  calculation_rules:
    - id: normalize_exchange
      applies_to: "atomic_incoming_packaging; pex_tube; barbed_fittings_barbed_fitting; barbed_fittings_valve; barbed_fittings_manifold; atomic_barbed_fittings; copper_crimp_rings; support_and_protection_pipe_support; support_and_protection_support_fixing; support_and_protection_protective_sleeve; atomic_support_and_protection; compatible_seal_material; cleaning_consumables_soap_formulation; cleaning_consumables_cleaning_wipe; atomic_cleaning_consumables; unused_product_return_pex_tube_return; unused_product_return_fitting_return; unused_product_return_valve_return; unused_product_return_manifold_return; unused_product_return_crimp_ring_return; unused_product_return_support_return; unused_product_return_sleeve_return; unused_product_return_seal_product_return; unused_product_return_disinfectant_return; atomic_unused_product_return"
      rule: "Divide each actual material/SKU/state exchange kg numerator by D; activate packaging burden only when supply is separately modelled. Do not net gross entry and return twice."
      inputs:
        - actual_kg
        - D
        - cp_materials
        - cp_acceptance
      output: "kg per reference flow"
      source_ids: []
    - id: formulation_normalize
      applies_to: "disinfection_product"
      rule: "Divide actual supplied formulation kg numerator by D; record active fraction separately without replacing supplied mixture mass or inferring residual chlorine."
      inputs:
        - formulation_mass
        - active_fraction
        - D
        - cp_water
        - cp_acceptance
      output: "kg per reference flow"
      source_ids: []
    - id: owned_asset_normalize
      applies_to: "owned_equipment_attribution_pipe_cutter; owned_equipment_attribution_crimp_tool; owned_equipment_attribution_go_no_go_gauge; owned_equipment_attribution_drill; owned_equipment_attribution_charger; owned_equipment_attribution_hydraulic_pump; owned_equipment_attribution_test_meter; owned_equipment_attribution_access_asset; atomic_owned_equipment_attribution"
      rule: "Actual asset count × job service activity / documented same-basis lifetime service activity / D; match manufacture/actual maintenance/replacement packet to exact asset, reconcile all job/period shares and withhold finalization without lifetime/termination evidence."
      inputs:
        - asset_count
        - job_activity
        - lifetime_activity
        - D
        - cp_services
        - cp_acceptance
      output: "Item(s) per reference flow"
      source_ids: []
    - id: service_normalize
      applies_to: "hired_support_service_equipment_event; hired_support_service_access_event; atomic_hired_support_service"
      rule: "Genuine complete contract-event count × evidenced current-job share / D; hourly rental is not a counted event, and actual hours await Duration support and scope review."
      inputs:
        - complete_events
        - actual_share
        - D
        - cp_services
        - cp_acceptance
      output: "Item(s) per reference flow"
      source_ids: []
    - id: energy_normalize
      applies_to: "installation_electricity"
      rule: "Divide actual metered kWh after evidenced other-user attribution by D; reconcile provider inclusions and charging boundary. No mass conversion."
      inputs:
        - meter_kWh
        - actual_share
        - D
        - cp_energy
        - cp_acceptance
      output: "kWh per reference flow"
      source_ids: []
    - id: water_normalize
      applies_to: "supplied_test_flush_water; dispatched_wastewater; atomic_water_to_air"
      rule: "Divide each separately measured water-stream kg by D; volume times evidenced temperature-density applies only to the matching stream. Reuse is not new fresh input; evaporation needs independent evidence."
      inputs:
        - stream_volume
        - stream_density
        - actual_mass
        - D
        - cp_water
        - cp_acceptance
      output: "kg per reference flow"
      source_ids: []
    - id: residual_normalize
      applies_to: "dry_material_waste_pex_offcut; dry_material_waste_captured_drilling_debris; atomic_dry_material_waste; rejected_component_waste_rejected_tube; rejected_component_waste_rejected_fitting; rejected_component_waste_rejected_crimp_ring; atomic_rejected_component_waste; contaminated_solid_waste_contaminated_wipe; contaminated_solid_waste_contaminated_container; contaminated_solid_waste_formulation_residue; atomic_contaminated_solid_waste"
      rule: "Divide actual net dispatched kg for each classification/state/receiver by D; removed pieces retain original issue and failure-event links."
      inputs:
        - gross
        - tare
        - actual_stream
        - D
        - cp_residuals
        - cp_acceptance
      output: "kg per reference flow"
      source_ids: []
    - id: emission_normalize
      applies_to: "atomic_airborne_particulate; atomic_aqueous_release_constituent"
      rule: "Divide measured kg per substance/fraction/compartment, or matching independent factor times measured activity, by D. Aqueous species may use measured volume times its concentration with compatible unit conversion; no residual-derived emissions."
      inputs:
        - actual_substance_mass
        - measured_activity
        - matched_factor
        - D
        - cp_residuals
        - cp_water
        - cp_acceptance
      output: "kg per reference flow"
      source_ids: []
    - id: reference_output
      applies_to: "accepted_installation"
      rule: "Normalize recorded accepted output D m by the numerical accepted length D to give 1 m; only final unique accepted physical tube pieces determine D."
      inputs:
        - D
        - cp_acceptance
      output: "1 m"
      source_ids: []
    - id: nominal_pipe_factor
      applies_to: "pex_tube"
      rule: "Only for matching RWC SKU/size, source lb/ft × 0.45359237 / 0.3048 gives kg/m; 1/2, 3/4, 1 in respectively yield 0.08036085, 0.15328089, 0.25298787. Nominal point factors are not gross issue/accepted-m intervals."
      inputs:
        - matching_SKU
        - source_factor
        - actual_length
      output: "conditional kg estimate"
      source_ids:
        - rwc-piping-2024
    - id: fill_geometry_diagnostic
      applies_to: "supplied_test_flush_water"
      rule: "For matching SKU/size only, 0.009, 0.018, 0.030 source gal/ft diagnose one geometric fill. Source does not explicitly state US: confirm the US-liquid-gallon convention before using 3.785411784 L/gal and 0.3048 m/ft; actual supplier unit records take priority. This is neither fresh-water demand nor default wastewater."
      inputs:
        - matching_SKU
        - actual_length
        - confirmed_volume_convention
      output: "one-fill diagnostic"
      source_ids:
        - rwc-piping-2024
    - id: atomic_child_normalization
      applies_to: "owned_equipment_attribution_pipe_cutter; owned_equipment_attribution_crimp_tool; owned_equipment_attribution_go_no_go_gauge; owned_equipment_attribution_drill; owned_equipment_attribution_charger; owned_equipment_attribution_hydraulic_pump; owned_equipment_attribution_test_meter; owned_equipment_attribution_access_asset; barbed_fittings_barbed_fitting; barbed_fittings_valve; barbed_fittings_manifold; support_and_protection_pipe_support; support_and_protection_support_fixing; support_and_protection_protective_sleeve; cleaning_consumables_soap_formulation; cleaning_consumables_cleaning_wipe; hired_support_service_equipment_event; hired_support_service_access_event; unused_product_return_pex_tube_return; unused_product_return_fitting_return; unused_product_return_valve_return; unused_product_return_manifold_return; unused_product_return_crimp_ring_return; unused_product_return_support_return; unused_product_return_sleeve_return; unused_product_return_seal_product_return; unused_product_return_disinfectant_return; dry_material_waste_pex_offcut; dry_material_waste_captured_drilling_debris; rejected_component_waste_rejected_tube; rejected_component_waste_rejected_fitting; rejected_component_waste_rejected_crimp_ring; contaminated_solid_waste_contaminated_wipe; contaminated_solid_waste_contaminated_container; contaminated_solid_waste_formulation_residue"
      rule: "For each atomic_flow_row_id retain its independent physical numerator independent_physical_quantity. actual_<row_id>_quantity is its named alias only, never a parent family total. Material inputs use the original CP stock gross/net and outward-return convention after independent weighing or same-SKU conversion and reconciliation; internal transfers use actual paired custody quantity; usable exits and wastes use their independently measured actual fate quantities. Owned-asset child quantity is the original complete-life asset equivalent a_rj=A_rj/sum(A_rk), with every consumer and positive complete denominator; purchased-service child quantity uses only actual completed events whose real contract defines Item(s), with the original attribution, never hours or price converted into count. atomic_child_intensity = independent_physical_quantity / D, where D is the original independently measured final unique accepted physical PEX tube-piece centreline length in m from cp_acceptance and accepted_length, including retained insertion and actual bends/slack but excluding fitting bodies, offcuts, stock and repeated/rejected passes; D=0 blocks normalization, and denominator/allocation cannot change."
      inputs:
        - atomic_flow_row_id
        - independent_physical_quantity
        - exchange_property
        - exchange_unit
        - D
        - cp_acceptance
        - cp_materials
        - cp_services
        - cp_residuals
        - cp_water
      output: "atomic_child_intensity"
      source_ids: []
  data_quality_requirements:
    - id: same_job_basis
      applies_to: "all inventory rows"
      requirement: "Every protocol uses the same job, period, positive D and accepted configuration. Preserve original numerator, conversion factor and unit. Mark unknown occurrence unknown; allow zero only with complete coverage."
      evidence: "Six-protocol row trace"
    - id: source_applicability
      applies_to: "all inventory rows"
      requirement: "Retain actual manufacturer/SKU, revision, quality conditions, instrument calibration and measurement error. Reconcile manufacturer gauge/hydraulic/compatibility requirements with project specification; waiting/contact duration is not a Duration input."
      evidence: "Supplier originals and project acceptance records"
    - id: phase_and_asset_completeness
      applies_to: "owned_equipment_attribution_pipe_cutter; owned_equipment_attribution_crimp_tool; owned_equipment_attribution_go_no_go_gauge; owned_equipment_attribution_drill; owned_equipment_attribution_charger; owned_equipment_attribution_hydraulic_pump; owned_equipment_attribution_test_meter; owned_equipment_attribution_access_asset; atomic_owned_equipment_attribution; hired_support_service_equipment_event; hired_support_service_access_event; atomic_hired_support_service"
      requirement: "Record all consuming nodes, jobs and periods per asset/service; manufacture, use, maintenance/replacement and retirement/termination events share one index. Unknown lifetime-activity denominator, remaining life or maintenance ownership prevents finalized attribution."
      evidence: "cp_services all-consumer and lifecycle register"
    - id: range_incoming_packaging
      applies_to: "atomic_incoming_packaging"
      requirement: "Range evidence need: Shipment weights, composition, pack sizes and documented reuse/return cycles are needed, together with the supplier dataset boundary. Packaging waste cannot prove an otherwise unrecorded incoming quantity; no universal kg/m interval is established."
      evidence: "cp_materials"
    - id: range_owned_equipment_attribution
      applies_to: "owned_equipment_attribution_pipe_cutter; owned_equipment_attribution_crimp_tool; owned_equipment_attribution_go_no_go_gauge; owned_equipment_attribution_drill; owned_equipment_attribution_charger; owned_equipment_attribution_hydraulic_pump; owned_equipment_attribution_test_meter; owned_equipment_attribution_access_asset; atomic_owned_equipment_attribution"
      requirement: "Range evidence need: Collect manufacture/BOM or matching dataset, maintenance, replacement and retirement/termination records, all consuming jobs and periods, job activity and lifetime denominator uncertainty. A whole tool per job, assumed lifetime, fixed reuse count or generic cutoff cannot establish an interval."
      evidence: "cp_services"
    - id: range_pex_tube
      applies_to: "pex_tube"
      requirement: "Range evidence need: RWC PDF 44 gives nominal 0.054, 0.103 and 0.170 lb/ft for 1/2, 3/4 and 1 in respectively. Matching SKU, supplier tolerance, routing, insertion, cuts, offcuts and rework are required before these factors can support consumption evidence; they are not observed kg per accepted m ranges."
      evidence: "cp_materials"
    - id: range_barbed_fittings
      applies_to: "barbed_fittings_barbed_fitting; barbed_fittings_valve; barbed_fittings_manifold; atomic_barbed_fittings"
      requirement: "Range evidence need: Collect topology-specific fittings/valves/manifolds, accepted and replaced counts, SKU kg/item and returns. Comparable branch and terminal configurations are required for a kg/m interval."
      evidence: "cp_materials"
    - id: range_copper_crimp_rings
      applies_to: "copper_crimp_rings"
      requirement: "Range evidence need: The number of successfully crimped tube ends constrains retained rings; actual rejected/replaced events and ring mass are still needed. It supplies neither a universal rings/m ratio nor a mass tolerance interval."
      evidence: "cp_materials"
    - id: range_support_and_protection
      applies_to: "support_and_protection_pipe_support; support_and_protection_support_fixing; support_and_protection_protective_sleeve; atomic_support_and_protection"
      requirement: "Range evidence need: Actual spacing, terminal constraints, stud/slab penetration locations, fixing SKU and installed/returned mass are required. A support-spacing limit is a geometry condition, not a universal consumption interval."
      evidence: "cp_materials"
    - id: range_compatible_seal_material
      applies_to: "compatible_seal_material"
      requirement: "Range evidence need: Actual penetration count/annulus geometry, formulation, applied volume/density and container reconciliation are needed. There is no generic sealant kg/m prior."
      evidence: "cp_materials"
    - id: range_supplied_test_flush_water
      applies_to: "supplied_test_flush_water"
      requirement: "Range evidence need: RWC PDF 44 capacities 0.009, 0.018 and 0.030 source gal/ft for 1/2, 3/4 and 1 in diagnose one fill. The US-liquid-gallon interpretation is a declared convention requiring confirmation. Sections, retests, recoveries, retention and flushing endpoints determine actual use; capacity is not a consumption interval."
      evidence: "cp_water"
    - id: range_disinfection_product
      applies_to: "disinfection_product"
      requirement: "Range evidence need: Actual dose volume, formulation active fraction, batch concentration, contact conditions and residual/disposal records are needed. A prescribed concentration or contact time is not a formulation kg/m interval."
      evidence: "cp_water"
    - id: range_cleaning_consumables
      applies_to: "cleaning_consumables_soap_formulation; cleaning_consumables_cleaning_wipe; atomic_cleaning_consumables"
      requirement: "Range evidence need: Collect cleaned object/area or tested-joint count, events, SKU doses and container weights. Comparable dose/event and event/m observations are needed; no blanket mass interval is justified."
      evidence: "cp_materials"
    - id: range_installation_electricity
      applies_to: "installation_electricity"
      requirement: "Range evidence need: Energy/kWh support remains unresolved. Comparable metered events with standby/charging ownership, all users and accepted-output shares are needed for a kWh/m interval; a pipe mass factor or NCV identity cannot provide it."
      evidence: "cp_energy"
    - id: range_hired_support_service
      applies_to: "hired_support_service_equipment_event; hired_support_service_access_event; atomic_hired_support_service"
      requirement: "Range evidence need: Collect actual contract reference unit, event completeness or true hourly basis, configuration/capacity, provider manufacture/maintenance/fuel/electricity inclusions and all users. True hourly Duration is unresolved; no universal event/m interval is established."
      evidence: "cp_services"
    - id: range_unused_product_return
      applies_to: "unused_product_return_pex_tube_return; unused_product_return_fitting_return; unused_product_return_valve_return; unused_product_return_manifold_return; unused_product_return_crimp_ring_return; unused_product_return_support_return; unused_product_return_sleeve_return; unused_product_return_seal_product_return; unused_product_return_disinfectant_return; atomic_unused_product_return"
      requirement: "Range evidence need: Actual gross issues, stock changes and measured usable returns are needed per SKU. Neither a default return fraction nor a mixed-material return identity is justified."
      evidence: "cp_materials"
    - id: range_dry_material_waste
      applies_to: "dry_material_waste_pex_offcut; dry_material_waste_captured_drilling_debris; atomic_dry_material_waste"
      requirement: "Range evidence need: Need weighed dispatches and material/state-specific recipient evidence. Nominal installed component mass does not establish a waste-rate interval."
      evidence: "cp_residuals"
    - id: range_rejected_component_waste
      applies_to: "rejected_component_waste_rejected_tube; rejected_component_waste_rejected_fitting; rejected_component_waste_rejected_crimp_ring; atomic_rejected_component_waste"
      requirement: "Range evidence need: Need complete failure, removal, rework and dispatch coverage with classified actual receiver. No default defect fraction; an evidenced zero requires complete event coverage."
      evidence: "cp_residuals"
    - id: range_contaminated_solid_waste
      applies_to: "contaminated_solid_waste_contaminated_wipe; contaminated_solid_waste_contaminated_container; contaminated_solid_waste_formulation_residue; atomic_contaminated_solid_waste"
      requirement: "Range evidence need: Need formulation-specific residues, container tare and receiver classification. No default loss fraction or assumption that all supplied chemical evaporates is supported."
      evidence: "cp_residuals"
    - id: range_airborne_particulate
      applies_to: "atomic_airborne_particulate"
      requirement: "Range evidence need: Need material/tool/control/size-specific monitoring or factor and measured activity. An unclosed material balance is a data gap, not invisible dust or a generic emission quantity."
      evidence: "cp_residuals"
    - id: range_dispatched_wastewater
      applies_to: "dispatched_wastewater"
      requirement: "Range evidence need: Need actual collection/dispatch measurements, composition, reuse and retention evidence. Fresh supply and geometric fill capacity do not establish outgoing wastewater or its interval."
      evidence: "cp_water"
    - id: range_water_to_air
      applies_to: "atomic_water_to_air"
      requirement: "Range evidence need: Need actual-condition evaporation measurement/model evidence. No evaporation fraction is established; it must not duplicate a chemical solvent loss."
      evidence: "cp_water"
    - id: range_aqueous_release_constituent
      applies_to: "atomic_aqueous_release_constituent"
      requirement: "Range evidence need: Need recipient compartment, actual carrier/constituent identities and concentration/flow evidence. Residual chlorine cannot be inferred from disinfectant issues; mixed wastewater is not an elementary pure-water identity."
      evidence: "cp_water"
    - id: range_accepted_installation
      applies_to: "accepted_installation"
      requirement: "Range evidence need: The normalized output is exactly one reference metre, not an empirical yield range. Accepted denominator evidence and excluded/held/rejected-work traceability remain required; retain configuration distinctions."
      evidence: "cp_acceptance"
    - id: atomic_incoming_packaging
      applies_to: "install_accept; cp_materials"
      requirement: "Former incoming_packaging is a mandatory non-exchange refinement scope and custody/closure ledger key, not a mixed quantity-bearing inventory card. Preserve the original scope: Record the actual package material and shipment at receipt. Weigh it or reconcile pack counts to same-batch tare records. Maintain its physical source pool even when component supply already includes packaging manufacture. Activate a separate packaging input burden only for a genuinely separately modelled supply; trace returns, reuse, stock and discarded packaging to that pool. Named children cover only the listed conditional objects; every other real independent object remains required in the actual register. At this node use the original CP to collect each object's identity/state/medium or receiver, one fixed property/unit, independent quantity/conversion, activation or evidenced absence, source-ledger event, ownership and upstream coverage. The PCR denominator, stock/fate, allocation and closure methods remain unchanged; foreground records cannot choose a different method. Parent totals are non-exchange diagnostics, never copied to children or summed across unlike units as an exchange; do not duplicate a complete formulation/assembly/actual mixed carrier as constituents. Incomplete actual roster, quantity, identity/support, method or coverage blocks final foreground completion, never zero, implicit nonapplicability or manifest-only disclosure."
      evidence: "cp_materials; actual_child_register; parent_ledger_id"
