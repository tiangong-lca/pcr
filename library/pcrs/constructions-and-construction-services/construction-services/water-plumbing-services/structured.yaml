          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| single_intended_service | accepted_installation | The sole intended product is accepted installation. Usable stock return and waste/residual exits are custody dispositions, not intended co-products. Subdivide genuinely separately measured jobs first; retain gross issues and explicit returns consistently rather than netting twice. |  |\n| failed_work_burden | install_accept | All failed inspections, tests and corrective work remain within the accepted job numerator. Held/unresolved or rejected length never increases D. A recovered material leaves at its evidenced gate with disclosed treatment; no automatic avoided-product credit or burden erasure. |  |\n| asset_lifetime_share | owned_equipment_attribution_pipe_cutter; owned_equipment_attribution_crimp_tool; owned_equipment_attribution_go_no_go_gauge; owned_equipment_attribution_drill; owned_equipment_attribution_charger; owned_equipment_attribution_hydraulic_pump; owned_equipment_attribution_test_meter; owned_equipment_attribution_access_asset; atomic_owned_equipment_attribution | For each exact owned asset use actual asset count times current-job service activity / documented total lifetime service activity on the same causal basis. The matching manufacture/maintenance packet includes actual replacements and termination once. List every consumer and period, reconcile shares, and disclose remaining-life uncertainty. Missing lifetime/replacement/termination evidence blocks finalized attribution. |  |\n| provider_and_period_owner | hired_support_service_equipment_event; hired_support_service_access_event; atomic_hired_support_service; installation_electricity | Keep provider-included manufacture, maintenance, fuel and electricity out of duplicate foreground asset/energy burdens. Attribute genuine shared event or metered energy only by actual use with all consumers. Record period-specific decisions and event IDs; never annualize an already lifetime-attributed resource again or count original and replacement assets as simultaneous whole inputs. |  |\n\n"
