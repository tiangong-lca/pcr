allocation_rules:
  - rule_id: single_intended_service
    applies_to: "accepted_installation"
    rule: "The sole intended product is accepted installation. Usable stock return and waste/residual exits are custody dispositions, not intended co-products. Subdivide genuinely separately measured jobs first; retain gross issues and explicit returns consistently rather than netting twice."
    source_ids: []
  - rule_id: failed_work_burden
    applies_to: "install_accept"
    rule: "All failed inspections, tests and corrective work remain within the accepted job numerator. Held/unresolved or rejected length never increases D. A recovered material leaves at its evidenced gate with disclosed treatment; no automatic avoided-product credit or burden erasure."
    source_ids: []
  - rule_id: asset_lifetime_share
    applies_to: "owned_equipment_attribution_pipe_cutter; owned_equipment_attribution_crimp_tool; owned_equipment_attribution_go_no_go_gauge; owned_equipment_attribution_drill; owned_equipment_attribution_charger; owned_equipment_attribution_hydraulic_pump; owned_equipment_attribution_test_meter; owned_equipment_attribution_access_asset; atomic_owned_equipment_attribution"
    rule: "For each exact owned asset use actual asset count times current-job service activity / documented total lifetime service activity on the same causal basis. The matching manufacture/maintenance packet includes actual replacements and termination once. List every consumer and period, reconcile shares, and disclose remaining-life uncertainty. Missing lifetime/replacement/termination evidence blocks finalized attribution."
    source_ids: []
  - rule_id: provider_and_period_owner
    applies_to: "hired_support_service_equipment_event; hired_support_service_access_event; atomic_hired_support_service; installation_electricity"
    rule: "Keep provider-included manufacture, maintenance, fuel and electricity out of duplicate foreground asset/energy burdens. Attribute genuine shared event or metered energy only by actual use with all consumers. Record period-specific decisions and event IDs; never annualize an already lifetime-attributed resource again or count original and replacement assets as simultaneous whole inputs."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "install_accept"
      flow_role: "accepted_installation"
      record_type: "acceptance register"
      raw_fields: "job; period; final piece ID; retired ID; material; diameter; hot/cold; branch; accepted endpoints; actual centreline length; insertion/bend/slack; test-section IDs; signed gate; project_test_specification; test_instruction_revision; joint_id; gauge_id; gauge_check_evidence; go_no_go_result; test_attempt_id; test_medium; test_pressure_value; test_pressure_unit; test_temperature_value; test_temperature_unit; test_start_time; test_end_time; hold_duration_value; hold_duration_unit; test_instrument_id; calibration_evidence; test_acceptance_criterion; test_result; correction_parent_id; retest_id; test_record_owner"
      collection_method: "Reconcile actual cut-piece and as-built lengths to final endpoints, retained insertion and curved/slack records; inspect unique physical IDs and signed acceptance. Exclude fitting bodies, removed/rejected pieces and stock.  At each crimp joint inspect and record the actual compatible go/no-go gauge result, joint/gauge IDs and gauge verification under the adopted model instructions. For every hydraulic test and retest, collect the applicable project specification and instruction revision, identified test section/joints and medium, actual pressure and temperature with original units, start/end times and actual holding duration with its unit, instrument/calibration evidence, applicable pass criterion, result and responsible record owner. Record these conditions during the test and link failures, corrections and repeated tests by attempt/parent IDs before final signoff. Do not substitute a signature or test-section count for the actual test conditions; preserve required flushing records and the associated actual water/resource use in their own protocols. Pressure/temperature/time/gauge results are acceptance observations and are not added to the m length numerator."
      unit: "m"
      frequency: "each final piece and acceptance"
      temporal_coverage: "all installation/correction events to signed gate"
      site_scope: "Declared building job; asset all-consumer/period register"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated length records; as-built; go/no-go and hydraulic test results"
    - protocol_id: cp_materials
      process_id: "install_accept"
      flow_role: "incoming_packaging; pex_tube; barbed_fittings; copper_crimp_rings; support_and_protection; compatible_seal_material; cleaning_consumables; unused_product_return"
      record_type: "material custody ledger"
      raw_fields: "job; period; shipment; SKU/material/state; gross entry; stock opening/closing; installed retained mass; usable return; pack owner; count/length; kg factor; tare; correction ID; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Weigh each material/packaging/formulation and return with calibrated scale and tare, or use traceable exact SKU count/length-to-mass evidence. Keep embedded packaging physical source pool without repeating its upstream burden. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity is the named alias of this CP independent_physical_quantity keyed by atomic_flow_row_id and governed by atomic_child_normalization; it is neither another observation nor a copy of the parent total. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      unit: "kg"
      frequency: "each receipt, withdrawal, return and closeout"
      temporal_coverage: "all job events including replacements"
      site_scope: "Declared building job; asset all-consumer/period register"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; supplier factors; issues/returns; pack boundary evidence"
    - protocol_id: cp_water
      process_id: "install_accept"
      flow_role: "supplied_test_flush_water; disinfection_product; dispatched_wastewater; water_to_air; aqueous_release_constituent"
      record_type: "water and constituent ledger"
      raw_fields: "job; period; stream/source/receiver; event; meter start/end; volume; temperature/density; fresh; reused; retained; wastewater; evaporation method; species/concentration; formulation/SKU; active fraction; issued/returned mass; container tare; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Weigh actual supplied disinfection formulation and usable returns by batch/SKU with container tare; record concentration, dose and residual destination. Meter external withdrawals and actual outgoing streams separately. Reconcile internal reuse and retained water. Quantify evaporation only with actual-condition measurement/model; direct releases require receiving compartment and constituent-specific evidence. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity is the named alias of this CP independent_physical_quantity keyed by atomic_flow_row_id and governed by atomic_child_normalization; it is neither another observation nor a copy of the parent total. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      unit: "kg"
      frequency: "each fill, retest, flush, disinfection and discharge"
      temporal_coverage: "entire commissioning including corrections"
      site_scope: "Declared building job; asset all-consumer/period register"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; density evidence; receiver manifests; constituent measurements"
    - protocol_id: cp_energy
      process_id: "install_accept"
      flow_role: "installation_electricity"
      record_type: "meter register"
      raw_fields: "job; period; tool/pump/charger; start/end kWh; calibration; interval; standby; other consumers; causal share; provider inclusions"
      collection_method: "Read calibrated external supply meter for actual installation/test/charging intervals; retain causal subtraction records for other users and reconcile provider energy coverage. Never weigh energy."
