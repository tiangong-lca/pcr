    applies_to: "atomic_incoming_packaging; pex_tube; barbed_fittings_barbed_fitting; barbed_fittings_valve; barbed_fittings_manifold; atomic_barbed_fittings; copper_crimp_rings; support_and_protection_pipe_support; support_and_protection_support_fixing; support_and_protection_protective_sleeve; atomic_support_and_protection; compatible_seal_material; disinfection_product; cleaning_consumables_soap_formulation; cleaning_consumables_cleaning_wipe; atomic_cleaning_consumables; unused_product_return_pex_tube_return; unused_product_return_fitting_return; unused_product_return_valve_return; unused_product_return_manifold_return; unused_product_return_crimp_ring_return; unused_product_return_support_return; unused_product_return_sleeve_return; unused_product_return_seal_product_return; unused_product_return_disinfectant_return; atomic_unused_product_return"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use measured mass per SKU or exact count/length times matching kg factor; stock, usable returns and residuals stay separate. Do not apply to electricity or asset duration."
  - id: water_and_constituent
    applies_to: "supplied_test_flush_water; dispatched_wastewater; atomic_water_to_air; atomic_aqueous_release_constituent"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Volume requires actual temperature/density; carrier water and constituent mass must not be summed twice; first confirm the source-gal convention."
  - id: asset_and_event
    applies_to: "owned_equipment_attribution_pipe_cutter; owned_equipment_attribution_crimp_tool; owned_equipment_attribution_go_no_go_gauge; owned_equipment_attribution_drill; owned_equipment_attribution_charger; owned_equipment_attribution_hydraulic_pump; owned_equipment_attribution_test_meter; owned_equipment_attribution_access_asset; atomic_owned_equipment_attribution; hired_support_service_equipment_event; hired_support_service_access_event; atomic_hired_support_service"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Attribute asset shares from actual activity/lifetime activity; count only complete contracted service events. Preserve true hourly rental for Duration verification; never relabel it as count."
  - id: metered_energy
    applies_to: "installation_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Use only cp_energy actual external metering and causal shares; Energy/kWh support is unverified and cannot be replaced with NCV or material mass."
