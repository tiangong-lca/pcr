      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| scope_and_gate | install_accept | Verify actual PEX-B potable-water hot/cold scope, copper-crimp/barb route and declared interfaces. Acceptance must trace inspections, applicable hydraulic test/flush and all corrections; an assumed test result or another joining route is not accepted evidence. | `sharkbite-pex-2021`; `rwc-piping-2024` |\n| denominator_integrity | accepted_installation | Require positive D from unique final accepted physical tube pieces; include insertion and actual curved/slack length, exclude fitting bodies and removed/held/rejected/stock pieces. Reconcile hot/cold and rework ID lineage; test overlaps and repeat visits add no reference output. |  |\n| identity_and_units | all inventory rows | Expand conditional cards to exact actual material/SKU/state/recipient exchanges and verify each UUID/support chain before downstream publication. Unresolved occurrence stays unknown. Preserve Energy/kWh and true hourly Duration gaps; do not substitute NCV or a counted event. |  |\n| balance_and_fate | install_accept | Check input, return, stock, retained material and each actual residual within compatible pools. Water partitions must distinguish external supply, reuse, retention, wastewater, evidenced evaporation and direct carrier/constituents. No duplicated destination or residual-derived emission; declare unclosed amounts and uncertainty. |  |\n| assets_and_periods | owned_equipment_attribution_pipe_cutter; owned_equipment_attribution_crimp_tool; owned_equipment_attribution_go_no_go_gauge; owned_equipment_attribution_drill; owned_equipment_attribution_charger; owned_equipment_attribution_hydraulic_pump; owned_equipment_attribution_test_meter; owned_equipment_attribution_access_asset; atomic_owned_equipment_attribution; hired_support_service_equipment_event; hired_support_service_access_event; atomic_hired_support_service | Verify exact ownership, all consumers and relevant manufacture/use/maintenance/replacement/retirement periods, consistent causal lifetime denominator and actual service contract. Reconcile period shares and duplicate provider/foreground inclusions. Unknown replacement or termination prevents finalized attribution. |  |\n| evidence_quality | all inventory rows | Require complete six-protocol records, source applicability and individual range evidence needs below. Nominal point factors and quality conditions are not observed service-normalized intervals. A zero needs covered records; a missing record is not zero. |  |\n| close_atomic_incoming_packaging | install_accept; cp_materials | Block final foreground completion until every actual object in atomic_incoming_packaging is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_owned_equipment_attribution | install_accept; cp_services | Block final foreground completion until every actual object in atomic_owned_equipment_attribution is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_barbed_fittings | install_accept; cp_materials | Block final foreground completion until every actual object in atomic_barbed_fittings is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_support_and_protection | install_accept; cp_materials | Block final foreground completion until every actual object in atomic_support_and_protection is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_cleaning_consumables | install_accept; cp_materials | Block final foreground completion until every actual object in atomic_cleaning_consumables is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_hired_support_service | install_accept; cp_services | Block final foreground completion until every actual object in atomic_hired_support_service is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_unused_product_return | install_accept; cp_materials | Block final foreground completion until every actual object in atomic_unused_product_return is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_dry_material_waste | install_accept; cp_residuals | Block final foreground completion until every actual object in atomic_dry_material_waste is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_rejected_component_waste | install_accept; cp_residuals | Block final foreground completion until every actual object in atomic_rejected_component_waste is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_contaminated_solid_waste | install_accept; cp_residuals | Block final foreground completion until every actual object in atomic_contaminated_solid_waste is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_airborne_particulate | install_accept; cp_residuals | Block final foreground completion until every actual object in atomic_airborne_particulate is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_water_to_air | install_accept; cp_water | Block final foreground completion until every actual object in atomic_water_to_air is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_aqueous_release_constituent | install_accept; cp_water | Block final foreground completion until every actual object in atomic_aqueous_release_constituent is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| atomic_pair_provenance_complete | actual internal child source and recipient transfers | Verify actual source/receipt evidence, original physical quantities/units and ownership for the same material/state/event/gate. Traceable reuse of the same signed measurement is allowed; copied parent totals, overwritten receipts and forced unknown equality are prohibited. Unexplained differences without uncertainty, actual loss or state-transition responsibility evidence block completion; verify exactly one normalization per card. |  |\n\n"
