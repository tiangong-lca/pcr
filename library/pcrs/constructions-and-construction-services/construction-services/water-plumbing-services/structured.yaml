product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.water-plumbing-services"
  classification_refs: "CPC 3.0 54621 Water plumbing services; narrower"
  covered_products: "Building-interior copper-crimp PEX-B potable-water pipe installation with approved barbed interfaces and installer acceptance responsibility"
  excluded_products: "Fixtures, heaters, civil mains, structural works, specialist rated firestop/insulation; clamp, expansion, push-fit; later operation"
  representative_product: "1/2–1 in PEX-B hot/cold potable-water branches with declared actual sizes and fitting BOM"
  production_route: "Receipt/custody, cutting/preparation, copper-ring crimp/support, hydraulic test/correction, flush/conditional disinfection and signed handover"
  market_state: "Accepted installed, supported, inspected, tested and documented service"
functional_unit:
  what: "Installation service represented by accepted physical tube-material centreline"
  how_much: "1 m"
  how_well: "Compatible components, go/no-go inspection, applicable hydraulic test, completed corrections and signed acceptance"
  how_long_or_cycle: "Job start through acceptance and residual closeout; owned assets separately index manufacture, use, maintenance/replacement, retirement and every consuming period"
  reference_flow_link: "accepted_installation"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers building-interior hot/cold potable-water PEX-B installation with approved barbed fittings and copper crimp rings, from an accessible route and declared interfaces to supported, mechanically joined, inspected, hydraulically tested, recorded and signed acceptance. Representative tubing is 1/2, 3/4 and 1 in; declare actual sizes, hot/cold functions and branch BOM. Clamp, expansion, push-fit, nonpotable service, factory tube manufacture and other specialist works are outside this route. The six protocols below define actual job measurements; manufacturer sources constrain compatibility and operations rather than universal installation consumption."
      source_ids: []
    - rule_id: installation_owner
      applies_to: "install_accept"
      rule: "One installer responsibility covers receipt/withdrawal, layout, cutting and preparation, copper-ring crimp assembly, support/protection, hydraulic tests and corrections, acceptance, usable returns and residual dispatch. Phase journals are not extra service exchanges or process nodes."
      source_ids:
        - sharkbite-pex-2021
        - rwc-piping-2024
    - rule_id: accepted_gate
      applies_to: "accepted_installation"
      rule: "Handover requires compatible approved tube/fittings/rings, actual support and penetration protection, inspected crimp joints with go/no-go results, recorded applicable hydraulic test and completed correction/flush requirements. Record project specification, actual pressure, temperature, duration and result; do not import air-testing or push-fit/expansion procedures."
      source_ids:
        - sharkbite-pex-2021
        - rwc-piping-2024
    - rule_id: starting_interfaces
      applies_to: "foreground_boundary"
      rule: "Begin at a declared accessible internal building route with agreed supply and terminal interfaces and component supply at the installer custody boundary. Readiness is a condition, not consumed work. Fixtures, heaters, civil mains, structural works, specialist firestop/insulation and later use/maintenance of the installed pipe are excluded and disclosed."
      source_ids: []
    - rule_id: landed_supply
      applies_to: "upstream_inputs"
      rule: "Require matching landed component and formulation supply datasets with delivery and packaging boundary disclosed. Do not hide freight as zero or add packaging manufacture already embedded upstream. A separately responsible freight or different installation subcontract needs scope/card review before extension."
      source_ids: []
    - rule_id: reject_owner
      applies_to: "rework_and_exits"
      rule: "install_accept retains all original material, electricity, water and service burdens through failures and corrections. Link internal correction to the failed joint/piece and resulting final accepted pieces; distinguish usable returns from nonusable waste. Recovery/downgrade is recorded only with its actual receiver and does not create an assumed credit."
      source_ids:
        - sharkbite-pex-2021
    - rule_id: resource_periods
      applies_to: "shared_assets"
      rule: "Index asset manufacture, service use, actual maintenance/replacement and retirement/termination with every consuming job/node and reporting period. The current installer job is one consumer among the asset lifetime users; permanent installed hardware is separate. Rented provider asset burdens belong to the contracted service boundary."
      source_ids: []
    - rule_id: physical_pools
      applies_to: "material_and_water"
      rule: "Close compatible SKU/material/state pools using gross entries, stock changes, usable returns, retained installed material and measured residual exits. Keep water-carrier balance separate from chemical constituents and any carbon check; neither a mixed mass sum nor an asset share is an installed-material exchange. Do not create oxygen or any inferred loss exchange from a closure residual."
      source_ids: []
