  data_quality_requirements:
    - id: identity_traceability
      applies_to: "All cards"
      requirement: "Actual material/product/service/substance identities and states must fit the card. Conditional umbrella rows expand using real foreground specifications. Fixed UUIDs require independently confirmed detail/property/unit evidence."
      evidence: "Specifications, composition, supplier/provider scope, verified binding review"
    - id: acceptance_quality
      applies_to: "Reference and node handoffs"
      requirement: "Incoming factory finish, compatible sound opening, actual conditioning release, permitted cut state, alignment/fixings, lockset operation, local finishing/dryness and signed final acceptance must be traceable. Use actual applicable tolerances and supplier requirements."
      evidence: "Own-node inspection/event logs and signed acceptance"
    - id: measurement_quality
      applies_to: "Counts, masses, energy and service"
      requirement: "Calibrated/reconciled instruments, tare, ID/count reconciliation, consistent numerator units and original-stock units. Record uncertainty and actual detection limits. No guessed count-to-mass density or assumed workday."
      evidence: "Calibration/tare sheets, receipts, meters, contract and same-ID bridge"
    - id: completeness_quality
      applies_to: "All nodes"
      requirement: "Reconcile every real failure/repeat event, stock/usable return, packaging, accessory/cleanup material, residue, waste/liquid and potential direct release. Observed absence, not-applicable scope and unmeasured gap are distinguishable."
      evidence: "Node fate/stock reconciliation, event register and gap register"
    - id: period_quality
      applies_to: "Job and shared resources"
      requirement: "Cover actual receipt-to-handover periods and paid idle/availability; state excluded earlier opening works and later use. Register complete outside-job shared consumers and provider dataset overlap. Document unresolved replacement/termination before finalization."
      evidence: "Period/WIP bridge, contracts, consumer register and reviewed burden ownership"
    - id: range_quality
      applies_to: "Every nonreference card"
      requirement: "Nonreference Range is provisional reasoned_estimate QA only with card-specific rationale; reference Range is strict calculated N/N identity. Replace provisional screens with reviewed source/foreground ranges when available. Never impute a missing amount or conditional absence from the lower bound. This requirement governs only existing numeric ranges. Service children and other explicitly range-unset atomic children instead require their own evidence under the noninheritance rules; absence of an unsupported universal interval does not authorize default quantity or waive actual collection."
      evidence: "Card Range rationale and reviewed foreground distribution where available"
    - id: atomic_transport_packaging
      applies_to: "receive_condition; cp_receive_condition_fate"
      requirement: "Former transport_packaging is a mandatory non-exchange refinement scope and custody/closure ledger key, not a mixed quantity-bearing inventory card. Preserve the original scope: Material-separated cardboard, plastic, shipping blocks, pads, clips or other actual discarded restraints, with included contents stated. Destination: Actual named packaging waste custodian. Condition: Required when the described physical event occurs. Quantity method: Use receive_condition_waste_net and receive_condition_normalize with cp_receive_condition_fate: sum(gross_mass_kg - tare_mass_kg) for this actual waste_stream/material/event / N. exclude other waste/direct-release/stock/usable pools. Named children cover only the listed conditional objects; every other real independent object remains required in the actual register. At this node use the original CP to collect each object's identity/state/medium or receiver, one fixed property/unit, independent quantity/conversion, activation or evidenced absence, source-ledger event, ownership and upstream coverage. The PCR denominator, stock/fate, allocation and closure methods remain unchanged; foreground records cannot choose a different method. Parent totals are non-exchange diagnostics, never copied to children or summed across unlike units as an exchange; do not duplicate a complete formulation/assembly/actual mixed carrier as constituents. Incomplete actual roster, quantity, identity/support, method or coverage blocks final foreground completion, never zero, implicit nonapplicability or manifest-only disclosure."
      evidence: "cp_receive_condition_fate; actual_child_register; parent_ledger_id"
