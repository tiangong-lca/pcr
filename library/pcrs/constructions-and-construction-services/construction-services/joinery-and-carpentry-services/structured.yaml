n. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_jamb_shim_offcuts | position_fix; cp_position_fix_fate | Block final foreground completion until every actual object in atomic_jamb_shim_offcuts is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_captured_dust | position_fix; cp_position_fix_fate | Block final foreground completion until every actual object in atomic_captured_dust is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_fix_rejected_material | position_fix; cp_position_fix_fate | Block final foreground completion until every actual object in atomic_fix_rejected_material is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_fixing_packaging | position_fix; cp_position_fix_fate | Block final foreground completion until every actual object in atomic_fixing_packaging is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independen