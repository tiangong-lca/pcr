      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Existing interior rough opening is dry, sound and geometrically compatible with the actual assembly; supplied timber prehung slab/jamb/hinges are factory-finished and finish-accepted |\n| starting_condition_role | Received installation interface and separately recorded supplied assembly; the opening observation is not newly consumed wall |\n| product_classification_scope | Narrow timber prehung interior door installation route within broader joinery installation coverage; external classification does not define the canonical identity |\n| recursive_input_rule | A prior installation-service input from this category is an explicit upstream service with a nonoverlapping scope/time interval; do not recursively expand the same job or use it in place of the actual door assembly |\n| upstream_dataset_requirement | Declare whether each actual upstream material/service dataset includes manufacture, transport, packaging, power, capital and hired-provider setup; missing upstream links remain disclosed gaps |\n| disclosure | Job/site, incoming finished state, opening acceptance, actual selected jamb route, all exclusions, reporting windows, custody transfers and upstream coverage overlap |\n\n| rule_id | Rule | source_ids |\n| --- | --- | --- |\n| `scope_eligibility` | This methodology describes site installation of a factory-finished, finish-accepted single-leaf interior timber prehung door. A compatible existing rough opening is the starting interface. The work covers receiving and checking the assembly and opening, actual environmental conditioning, permitted jamb/shim trimming, aligning and mechanically fastening the assembly, fitting the specified lockset, completing local fastener-hole filling/sanding and exposed-cut or incidental touchup protection, and accepting operation, local-finish dryness and cleanup. The supplied assembly includes its already-hung slab, jamb and hinges. One-piece and split-jamb systems must be distinguished; actual split-jamb joint caulk and trim installation are included when part of the selected assembly/completion scope. The category excludes unfinished incoming doors requiring full slab/frame finishing, manufacturing the door or jamb, construction or major repair of the opening/wall, old-door demolition, exterior doors, sliding/folding systems, fire-rated systems and unsubstantiated acoustic/weather performance. Additional decorative casing beyond the declared assembly is outside this narrow reference unless explicitly included with separately identified materials and acceptance scope. A newly exposed cut face still needs the actual compatible local protection even though the incoming assembly is factory-finished. A job requiring whole-door site painting is outside this category, rather than a zero-material local repair case. [jeldwen-jii109] | `jeldwen-jii109` |\n| `boundary_start_gate` | Verify actual opening and incoming assembly before installation. If the opening needs major correction, stop this route until an externally accepted corrected interface exists; retain observed failed inspection resources without inventing wall construction as an installation input. The named opening_interface is solely an existing-opening readiness observation under cp_receive_condition_events, not a product input, purchase, consumed material, internal product handoff or upstream-burden quantity. Retain actual opening IDs, condition, geometry, moisture and count for readiness/acceptance; do not normalize opening_id_count into an inventory exchange. | `jeldwen-jii109` |\n| `boundary_conditioning` | Keep product environmental adjustment and actual protecting/storage resources inside receive_condition. Record actual RH/temperature, duration and release rationale. Supplier instructions govern the selected product; source example durations/tolerances/fastener spacings are not universal PCR quantities. | jeldwen-jii109 |\n| `boundary_node_states` | Receive_condition releases inspected conditioned assemblies; position_fix changes permitted jamb/shim geometry and joins assembly, shims and fasteners_nail; fasteners_screw; fasteners_accessory; atomic_fasteners into a fixed aligned unit; complete_accept adds lockset and actual local finishing, then releases the operation/dryness-accepted service. | jeldwen-jii109 |\n| `boundary_local_finish` | Include actual fastener-hole filler, sanding, exposed-cut protection, incidental compatible touchup and selected split-jamb joint caulk. Incoming unfinished assemblies and full-door/frame site painting require a different declared route. | jeldwen-jii109 |\n| `boundary_periods` | Index receipt, conditioning/waiting, cutting/fixing, local repair/drying, inspection, rework, acceptance and any closing/termination by real period and job. Include actual shared storage/access/tools/conditioning service only with recorded ownership and coverage. |  |\n| `boundary_releases` | Distinguish captured cutting/sanding waste, actual direct airborne release, aqueous residues and collected wastewater at their real producing nodes. Unknown medium, composition or fate is unresolved coverage, never an assumed release or automatic zero. |  |\n\n"
