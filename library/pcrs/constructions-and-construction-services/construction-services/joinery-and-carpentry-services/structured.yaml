allocation_rules:
  - rule_id: no_service_coproduct
    applies_to: "foreground_burden_allocation"
    rule: "This route produces one accepted installation service and no presumed co-product. Keep every actual failed/repeated event's job resources with the job. No avoided-production/disposal credit follows from scrap, a return or a held unit."
    source_ids: []
  - rule_id: unused_original_material
    applies_to: "foreground_burden_allocation"
    rule: "Gross input is opening intact stock plus receipts minus closing intact unissued stock. Record unused usable supplier returns and external handovers as separate positive outputs in the same material identity/property/unit. Attribute only their original unused-material upstream burden to those actual exits when upstream scope can be traced; installation, conditioning, cutting and rework remain with the job. Net-consumed G-R-X is diagnostic/original-material attribution, not another negative exchange or second physical draw."
    source_ids: []
  - rule_id: shared_complete_set
    applies_to: "foreground_burden_allocation"
    rule: "Direct submeter assignment belongs directly to its measured consumer and needs no shared denominator. Reconcile residual shared electricity/service B in period p after all independent direct assignments and provider overlaps. Fully direct, exactly zero residual requires no shared denominator. Nonzero eligible residual needs every residual-eligible consuming job/node, including outside this job, and evidenced causal weights w; allocate B times w divided by the complete positive eligible sum. Unknown/negative residual, missing consumers, zero/unknown sum or unsupported weights is an allocation gap requiring reviewed alternative evidence. Do not silently assign the entire shared meter to this job."
    source_ids: []
  - rule_id: service_overlap
    applies_to: "foreground_burden_allocation"
    rule: "For rented access, tools, storage or conditioning availability, use actual provider contract and paid active/idle periods. Disclose whether provider dataset includes energy, capital, maintenance, delivery/setup and removal. Count each included burden once; separate site electricity only for a genuinely nonoverlapping meter/coverage. A separately owned durable tool needs its evidenced attribution basis, not a full new tool per installation."
    source_ids: []
  - rule_id: period_bridge
    applies_to: "foreground_burden_allocation"
    rule: "Follow the identified job cohort through all reporting periods and finish the whole-job attribution at acceptance. If reporting at a cutoff, bridge opening/closing unprocessed stock, unaccepted installed WIP, shared service commitments and unresolved defects by ID/state; never normalize unfinished work by an invented accepted count. A terminated job needs documented fate and explicit burden treatment before consolidation with an accepted cohort. No universal lifetime, workday or annualization factor applies."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_receive_condition_material
      process_id: "receive_condition"
      flow_role: "material"
      record_type: "Node-owned foreground ledger"
      raw_fields: "job_id; node_id; period_id; event_id; material_id; actual_unit; unit_alias; assembly_id; provider_id; S_open; R_received; S_close_intact_unissued; U_return; X_transfer; return_recipient; transfer_recipient; custody_time; bridge_item_count; bridge_net_mass_kg; bridge_same_ids; bridge_source; bridge_state; bridge_period; bridge_balance_pool_id"
      collection_method: "At receipt/conditioning, count matching factory-finished prehung assembly IDs and opening intact stock, actual receipts and closing intact unissued assemblies. Record actual usable supplier returns/external handovers separately with recipients. Obtain an actual same-ID weighed mass bridge only if the receipt-stage discarded assembly mass requires reconciliation. Packaging is removed and weighed in cp_receive_condition_fate, not netted against door count. Closing stock excludes returned units and held conditioning/processed WIP. For a required count-to-mass balance, obtain actual same-ID, same-state, same-period net mass evidence; kg per item is a coefficient and the physical stream mass requires count times that coefficient, or direct weighing of the entire exact stream. Mixed units/configurations/states are measured and summed separately, never assigned one mean. This bridge does not change the external Number-of-items exchanges."
      unit: "Item(s); kg"
      frequency: "Each receipt, issue, usable exit and reporting cutoff"
      temporal_coverage: "Actual node job periods through acceptance or disclosed cutoff/termination"
      site_scope: "Actual job/site node, retaining full shared-consumer evidence where needed"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual assembly counts/specifications; factory-finish receiving evidence; receipts and stock/usable-exit IDs; real recipient custody; calibrated same-ID mass bridge if required"
    - protocol_id: cp_receive_condition_events
      process_id: "receive_condition"
      flow_role: "events"
      record_type: "Node-owned foreground ledger"
      raw_fields: "job_id; node_id; period_id; event_id; assembly_id; opening_id; transfer_id; state_before; state_after; received_count; released_count; opening_id_count; actual_start; actual_end; elapsed_h; actual_RH; actual_temperature; product_criteria; factory_finish_status; opening_geometry; opening_soundness; moisture_condition; defect_id; repeat_attempt_id; disposition; cutoff_wip_ids; termination_decision"
      collection_method: "Inspect actual assembly size/handing/core/species and incoming factory finish, and the dry sound compatible opening geometry. Record real RH/temperature/moisture observations and actual protection/conditioning intervals against this selected product criteria. Release conditioned assembly IDs with transfer_id and released_count. Record receiving defects, any actual repeated inspection/conditioning, held stock/WIP and documented termination disposition. This protocol does not collect fixing or final customer acceptance."
      unit: "Item(s); actual h; actual opening dimensions/RH/temperature units"
      frequency: "Each actual event/transfer; environmental monitoring at evidenced suitable intervals"
      temporal_coverage: "Actual node job periods through acceptance or disclosed cutoff/termination"
      site_scope: "Actual job/site node, retaining full shared-consumer evidence where needed"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual product/contract criteria; dated measurement/environment records; paired transfer IDs; signer; defect/WIP and termination register"
    - protocol_id: cp_receive_condition_resources
      process_id: "receive_condition"
      flow_role: "resources"
      record_type: "Node-owned foreground ledger"
      raw_fields: "job_id; node_id; period_id; event_id; meter_id; provider_id; actual_voltage; energy_unit; meter_start; meter_end; energy_kWh_per_actual_unit; direct_energy_kWh; shared_energy_total_kWh; all_direct_energy_kWh; eligible_residual_energy_kWh; consumer_id; all_consumer_ids; eligible_weight; all_eligible_weights; weight_evidence; contract_id; bill_unit; bill_quantity; documented_hours_per_bill_unit; bill_start; bill_end; paid_idle_h; direct_service_h; total_service_h; all_direct_service_h; eligible_residual_service_h; included_provider_scope; overlap_excluded_kWh; setup_owner; meter_record_id; meter_owner; meter_interval_start; meter_interval_end; meter_role; meter_topology; direct_submeter_ids; shared_master_id; master_includes_direct_ids; meter_scope; actual_conversion_evidence"
      collection_method: "At this node, collect actual receiving-area lighting, powered storage/conditioning or hired conditioning/protection availability. Read this node actual meter/provider periods and documented kWh conversion. Distinguish direct measured assignment from remaining eligible shared residual using the full actual outside-job consumer register. Reconcile provider energy/capital/setup coverage; actual contract bill_quantity times documented_hours_per_bill_unit governs h, including paid idle. Fully direct zero residual needs no weights; nonzero residual needs complete positive eligible weights, and unknown/negative residual is gap. Identify each meter record owner, actual interval, coverage and topology. For meter_role direct, the measured delta times documented actual-unit-to-kWh factor supplies direct_energy_kWh. For meter_role shared_master, its measured delta supplies shared_energy_total_kWh; any included direct submeters are explicitly listed in master_includes_direct_ids and removed once through all_direct_energy_kWh. Direct records outside the master scope are not removed from that master; direct records inside it are not charged again as residual. Each raw reading is owned once. Missing topology/source-to-total linkage is an energy gap. Service-source records are nonexchange reconciliation records; each actual service function/identity now uses its dedicated child protocol (cp_receive_condition_access_service; cp_receive_condition_tool_service; cp_receive_condition_storage_service; cp_receive_condition_conditioning_service). Evaluate service totals per actual identity/provider/contract/capacity/source period, never as a multifunction sum. Existing electricity attribution and meter topology above remain unchanged. Preserve all original source/revision records and use the current child helper outputs as H for the corresponding identity only."
      unit: "kWh; actual charged h"
      frequency: "Every meter interval and provider/billing period"
      temporal_coverage: "Actual node job periods through acceptance or disclosed cutoff/termination"
      site_scope: "Actual job/site node, retaining full shared-consumer evidence where needed"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration; provider bills/contracts; actual unit factor; complete consumer register; causal weights; paid availability/idle; provider/site overlap reconciliation"
    - protocol_id: cp_receive_condition_fate
      process_id: "receive_condition"
      flow_role: "fate"
      record_type: "Node-owned foreground ledger"
      raw_fields: "job_id; node_id; period_id; event_id; material_id; assembly_id; custodian_id; transfer_id; waste_stream; gross_mass_kg; tare_mass_kg; incoming_transfer_mass_kg; outgoing_transfer_mass_kg; open_processed_wip_kg; close_processed_wip_kg; accepted_retained_kg; custody_time; balance_pool_id; stream_id; stream_pool_kind; stream_actual_unit; stream_item_count; stream_quantity_kg; stream_direct_net_mass_kg; stream_same_ids; stream_state; stream_period; stream_bridge_group; constituent_scope; composite_group_id; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "At receipt/conditioning, weigh discarded incoming packaging/shipping restraints and actual irrecoverable received/conditioning door material by separate waste_stream and material_id, net of container tare, with actual custodian. Keep usable intact door returns under own-node material protocol, not waste. Reconcile actual conditioned assembly transfer state and held processed/conditioning WIP with same-ID mass bridge when needed; do not assign receipt waste to final acceptance. For mass reconciliation, give each physical stream an exclusive stream_pool_kind and balance_pool_id. Native kg streams enter with their actual measured kg; Number streams enter only with actual same-ID/current-state measured kg or the matching measured kg-per-item coefficient times count. Record pool mass by ID/state, not one factor applied after cutting or assembly changes. Missing bridge permits count reconciliation only and leaves mass reconciliation incomplete. An intact or installed composite is counted once in a documented composite group including its contributing inputs, or has evidenced constituent splits; never book the entire composite again in each component pool. Outgoing transfer mass is only an actual uniquely owned internal handoff, return-to-node/rework transfer or separately documented custody exit; it is exclusive of usable U/X outputs, waste, closing WIP and final accepted retention. Final customer acceptance leaves installed mass in accepted_retained only, not a second outgoing mass. opening_interface is observational and excluded from every material balance. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator