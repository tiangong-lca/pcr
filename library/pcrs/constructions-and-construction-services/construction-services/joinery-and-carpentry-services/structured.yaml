system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This methodology describes site installation of a factory-finished, finish-accepted single-leaf interior timber prehung door. A compatible existing rough opening is the starting interface. The work covers receiving and checking the assembly and opening, actual environmental conditioning, permitted jamb/shim trimming, aligning and mechanically fastening the assembly, fitting the specified lockset, completing local fastener-hole filling/sanding and exposed-cut or incidental touchup protection, and accepting operation, local-finish dryness and cleanup. The supplied assembly includes its already-hung slab, jamb and hinges. One-piece and split-jamb systems must be distinguished; actual split-jamb joint caulk and trim installation are included when part of the selected assembly/completion scope. The category excludes unfinished incoming doors requiring full slab/frame finishing, manufacturing the door or jamb, construction or major repair of the opening/wall, old-door demolition, exterior doors, sliding/folding systems, fire-rated systems and unsubstantiated acoustic/weather performance. Additional decorative casing beyond the declared assembly is outside this narrow reference unless explicitly included with separately identified materials and acceptance scope. A newly exposed cut face still needs the actual compatible local protection even though the incoming assembly is factory-finished. A job requiring whole-door site painting is outside this category, rather than a zero-material local repair case. [jeldwen-jii109]"
      source_ids:
        - jeldwen-jii109
    - rule_id: boundary_start_gate
      applies_to: "foreground_system_boundary"
      rule: "Verify actual opening and incoming assembly before installation. If the opening needs major correction, stop this route until an externally accepted corrected interface exists; retain observed failed inspection resources without inventing wall construction as an installation input. The named opening_interface is solely an existing-opening readiness observation under cp_receive_condition_events, not a product input, purchase, consumed material, internal product handoff or upstream-burden quantity. Retain actual opening IDs, condition, geometry, moisture and count for readiness/acceptance; do not normalize opening_id_count into an inventory exchange."
      source_ids:
        - jeldwen-jii109
    - rule_id: boundary_conditioning
      applies_to: "foreground_system_boundary"
      rule: "Keep product environmental adjustment and actual protecting/storage resources inside receive_condition. Record actual RH/temperature, duration and release rationale. Supplier instructions govern the selected product; source example durations/tolerances/fastener spacings are not universal PCR quantities."
      source_ids:
        - jeldwen-jii109
    - rule_id: boundary_node_states
      applies_to: "foreground_system_boundary"
      rule: "Receive_condition releases inspected conditioned assemblies; position_fix changes permitted jamb/shim geometry and joins assembly, shims and fasteners_nail; fasteners_screw; fasteners_accessory; atomic_fasteners into a fixed aligned unit; complete_accept adds lockset and actual local finishing, then releases the operation/dryness-accepted service."
      source_ids:
        - jeldwen-jii109
    - rule_id: boundary_local_finish
      applies_to: "foreground_system_boundary"
      rule: "Include actual fastener-hole filler, sanding, exposed-cut protection, incidental compatible touchup and selected split-jamb joint caulk. Incoming unfinished assemblies and full-door/frame site painting require a different declared route."
      source_ids:
        - jeldwen-jii109
    - rule_id: boundary_periods
      applies_to: "foreground_system_boundary"
      rule: "Index receipt, conditioning/waiting, cutting/fixing, local repair/drying, inspection, rework, acceptance and any closing/termination by real period and job. Include actual shared storage/access/tools/conditioning service only with recorded ownership and coverage."
      source_ids: []
    - rule_id: boundary_releases
      applies_to: "foreground_system_boundary"
      rule: "Distinguish captured cutting/sanding waste, actual direct airborne release, aqueous residues and collected wastewater at their real producing nodes. Unknown medium, composition or fate is unresolved coverage, never an assumed release or automatic zero."
      source_ids: []
