  calculation_rules:
    - id: accepted_n
      applies_to: "reference_service"
      rule: "N = cardinality of distinct accepted_ids whose operation, local-finish dryness and handover checks passed for the homogeneous complete job cohort; N must be positive. Count each accepted assembly/opening pair once."
      inputs:
        - cp_complete_accept_events
        - accepted_ids
        - accepted_signer
        - product_criteria
      output: "N"
      source_ids: []
    - id: reference_identity
      applies_to: "reference_service"
      rule: "Q_reference = N; q_reference = N / N = 1 Item(s). This is mathematical normalization only."
      inputs:
        - cp_complete_accept_events
        - accepted_ids
        - N
        - accepted_n
      output: "q_reference"
      source_ids: []
    - id: receive_condition_gross
      applies_to: "External material inputs at receive_condition"
      rule: "For each material_id and actual_unit: G_receive = S_open + R_received - S_close_intact_unissued. All unused usable U_return and X_transfer remain inside G until separate positive outputs. Negative G or overlapping stock/WIP/return records is a gap."
      inputs:
        - cp_receive_condition_material
        - material_id
        - actual_unit
        - S_open
        - R_received
        - S_close_intact_unissued
      output: "G_receive"
      source_ids: []
    - id: receive_condition_usable_exit
      applies_to: "Unused product exits at receive_condition"
      rule: "For each unchanged input identity/unit: Q_U_receive = U_return; Q_X_receive = X_transfer as two separate positive exchanges. Diagnostic C_receive = G_receive - U_return - X_transfer is not a physical exchange or credit. Neither U nor X is in closing stock."
      inputs:
        - cp_receive_condition_material
        - material_id
        - actual_unit
        - U_return
        - X_transfer
        - return_recipient
        - transfer_recipient
        - G_receive
      output: "Q_U_receive; Q_X_receive; diagnostic_C_receive"
      source_ids: []
    - id: receive_condition_bridge
      applies_to: "Measured property bridge when required at receive_condition"
      rule: "For each exact bridge_same_ids, bridge_state, bridge_period and bridge_balance_pool_id: k_kg_per_item_receive = bridge_net_mass_kg / positive bridge_item_count, with units kg/Item(s). This output is a measured coefficient, not physical mass. Mixed configurations or changed cut/assembly states use separate same-ID measurements; no universal coefficient/density. Missing actual same-ID/state evidence or positive count leaves coefficient unavailable. External counted door/lockset exchanges remain Item(s)."
      inputs:
        - cp_receive_condition_material
        - bridge_same_ids
        - bridge_state
        - bridge_period
        - bridge_balance_pool_id
        - bridge_item_count
        - bridge_net_mass_kg
        - bridge_source
      output: "k_kg_per_item_receive"
      source_ids: []
    - id: receive_condition_event_counts
      applies_to: "Opening readiness observations and actual internal state rows at receive_condition"
      rule: "Preserve actual opening_id_count as a readiness observation only; it does not contribute to Q_event_receive or any inventory exchange. For an actual assembly handoff row, Q_event_receive is its matching received_count or released_count by node/transfer/state; pair handoffs by transfer_id and assembly_id, and retain distinct real repeat event IDs. No internal feed is fixed to one."
      inputs:
        - cp_receive_condition_events
        - opening_id_count
        - received_count
        - released_count
        - transfer_id
        - assembly_id
        - state_before
        - state_after
        - event_id
        - repeat_attempt_id
      output: "Q_event_receive"
      source_ids: []
    - id: receive_condition_waste_net
      applies_to: "Waste rows at receive_condition"
      rule: "Q_waste_receive = sum(gross_mass_kg - tare_mass_kg) for actual waste_stream/material_id; match each event/custodian once. Keep distinct waste streams exclusive and actual material state documented."
      inputs:
        - cp_receive_condition_fate
        - material_id
        - event_id
        - waste_stream
        - gross_mass_kg
        - tare_mass_kg
        - custodian_id
      output: "Q_waste_receive"
      source_ids: []
    - id: receive_condition_electricity_total
      applies_to: "receive_condition_electricity"
      rule: "For each unique meter_record_id/owner/actual interval, E_meter_receive = (meter_end - meter_start) * energy_kWh_per_actual_unit using actual_conversion_evidence. direct_energy_kWh = sum of E_meter_receive for actual direct records assigned to this node/job. shared_energy_total_kWh is the E_meter_receive of the actual shared_master for the matching interval/scope (or sum of demonstrably nonoverlapping masters). Reconcile their exact IDs/intervals/scopes through meter_topology. Sum all consumers' actual direct readings included in this shared master once into all_direct_energy_kWh; outside-master direct readings are not subtracted from it. Eligible residual B_E = shared_energy_total_kWh - all_direct_energy_kWh - overlap_excluded_kWh and must reconcile to eligible_residual_energy_kWh. Exactly zero fully reconciled residual needs no shared denominator. Positive residual uses only complete residual-eligible consumers/weights and E_shared = B_E * eligible_weight / sum(all_eligible_weights), with positive evidenced sum. Unknown/negative residual, missing meter source linkage/topology or missing nonzero-residual weights is gap. E_receive = direct_energy_kWh + E_shared; direct readings included in a master are thereby removed once from residual rather than charged twice. Provider/site overlapping scope is excluded once."
      inputs:
        - cp_receive_condition_resources
        - meter_record_id
        - meter_owner
        - meter_interval_start
        - meter_interval_end
        - meter_role
        - meter_topology
        - direct_submeter_ids
        - shared_master_id
        - master_includes_direct_ids
        - meter_scope
        - actual_conversion_evidence
        - meter_start
        - meter_end
        - energy_unit
        - energy_kWh_per_actual_unit
        - direct_energy_kWh
        - shared_energy_total_kWh
        - all_direct_energy_kWh
        - overlap_excluded_kWh
        - eligible_residual_energy_kWh
        - all_consumer_ids
        - eligible_weight
        - all_eligible_weights
        - weight_evidence
        - included_provider_scope
      output: "E_receive"
      source_ids: []
    - id: receive_condition_service_total
      applies_to: "receive_condition_access_service; receive_condition_tool_service; receive_condition_storage_service; receive_condition_conditioning_service"
      rule: "For each one actual child identity/provider/contract/capacity/source period independently, H_contract = bill_quantity * documented_hours_per_bill_unit from the actual contract, with bill_start/bill_end and paid_idle_hours reconciled; never assume an eight-hour day. total_service_h is that same source total. B_H = total_service_h - all_direct_service_h; all_direct_service_h includes every separately assigned direct consumer inside that service source, not an outside source. Reconcile B_H to eligible_residual_service_h. A known B_H = 0 needs no shared weights and H_shared = 0. For B_H > 0, H_shared = B_H * eligible_weight / sum(all_eligible_weights), over complete evidenced eligible consumers not already directly covered. H_child_period = direct_service_h + H_shared; H_child = sum of exclusive H_child_period for this identity and node. Reconcile all node/job allocations once to the source, including paid idle and outside-job consumers. Unknown/negative residual, missing positive-residual denominator, unsupported hour conversion or overlapping provider scope is a gap. Do not use a common H for different child functions or identities. Hours remain unnormalized; each child divides once by N."
      inputs:
        - actual_service_identity
        - provider_id
        - contract_id
        - source_period
        - bill_unit
        - bill_quantity
        - documented_hours_per_bill_unit
        - bill_start
        - bill_end
        - paid_idle_hours
        - total_service_h
        - direct_service_h
        - all_direct_service_h
        - eligible_residual_service_h
        - eligible_weight
        - all_eligible_weights
        - all_consumer_ids
        - source_reconciliation
        - cp_receive_condition_access_service
        - cp_receive_condition_tool_service
        - cp_receive_condition_storage_service
        - cp_receive_condition_conditioning_service
      output: "H_child; identity-keyed H_<row_id>"
      source_ids: []
    - id: receive_condition_processed_balance
      applies_to: "Node physical balance at receive_condition"
      rule: "Use only physical kg outputs from receive_condition_stream_mass under one coherent balance_pool_id: G_mass_kg_receive + incoming_mass_kg_receive + open_wip_mass_kg_receive = outgoing_transfer_mass_kg_receive + accepted_retained_mass_kg_receive + close_wip_mass_kg_receive + U_mass_kg_receive + X_mass_kg_receive + actual net waste Q_waste_receive. Native Number quantities/coefficient kg per item never enter this equation directly. G already excludes intact unissued closing stock; do not deduct it again. Every ID/current state occupies one exclusive pool. Outgoing mass is actual node handoff/rework or other separately documented custody transfer, never final installed accepted mass already in retained, and never a duplicate U/X or waste exit. At final customer acceptance installed mass is accepted_retained only. opening_interface is excluded. If exact bridge/constituent evidence is absent, report mass-balance gap and perform only separately labelled count reconciliation; do not add unlike units. For composite output, include all contributing input masses under one evidenced composite group or use actual constituent splits, never repeat the whole composite in multiple component balances. Difference after supported pools is gap."
      inputs:
        - cp_receive_condition_material
        - cp_receive_condition_events
        - cp_receive_condition_fate
        - balance_pool_id
        - stream_pool_kind
        - stream_same_ids
        - constituent_scope
        - composite_group_id
        - G_mass_kg_receive
        - incoming_mass_kg_receive
        - open_wip_mass_kg_receive
        - outgoing_transfer_mass_kg_receive
        - accepted_retained_mass_kg_receive
        - close_wip_mass_kg_receive
        - U_mass_kg_receive
        - X_mass_kg_receive
        - Q_waste_receive
      output: "balance_gap_receive"
      source_ids: []
    - id: receive_condition_normalize
      applies_to: "All inventory rows owned by receive_condition"
      rule: "q_row = actual applicable Q_node / N, where Q_node is the appropriate listed raw count, material G, positive U/X, net waste, E or H total for this row and complete homogeneous job cohort. N is actual accepted count from accepted_n. No output quantity can be inferred from reference one.  This inventory normalization excludes the opening_interface readiness observation and opening_id_count. For service children, H means only the independently determined H_child for that exact row identity under its service_total rule and dedicated service protocol; never reuse a node-wide service total across children."
      inputs:
        - cp_receive_condition_material
        - cp_receive_condition_events
        - cp_receive_condition_resources
        - cp_receive_condition_fate
        - cp_complete_accept_events
        - N
        - G_receive
        - Q_U_receive
        - Q_X_receive
        - Q_event_receive
        - Q_waste_receive
        - E_receive
        - H_receive_condition_access_service
        - H_receive_condition_tool_service
        - H_receive_condition_storage_service
        - H_receive_condition_conditioning_service
        - cp_receive_condition_access_service
        - cp_receive_condition_tool_service
        - cp_receive_condition_storage_service
        - cp_receive_condition_conditioning_service
      output: "q_row_receive"
      source_ids: []
    - id: receive_condition_period_bridge
      applies_to: "Period/WIP attribution at receive_condition"
      rule: "Carry closing intact stock and processed/installed WIP by matching material/assembly IDs to the next opening without repurchasing or rebooking physical input. Real period events/resources occur once. Final job normalization awaits positive N or an explicit reviewed termination treatment."
      inputs:
        - cp_receive_condition_material
        - cp_receive_condition_events
        - cp_receive_condition_resources
        - cp_receive_condition_fate
        - period_id
        - event_id
        - assembly_id
        - material_id
        - S_close_intact_unissued
        - cutoff_wip_ids
        - close_processed_wip_kg
        - termination_decision
      output: "whole_job_totals_receive"
      source_ids: []
    - id: position_fix_gross
      applies_to: "External material inputs at position_fix"
      rule: "For each material_id and actual_unit: G_fix = S_open + R_received - S_close_intact_unissued. All unused usable U_return and X_transfer remain inside G until separate positive outputs. Negative G or overlapping stock/WIP/return records is a gap."
      inputs:
        - cp_position_fix_material
        - material_id
        - actual_unit
        - S_open
        - R_received
        - S_close_intact_unissued
      output: "G_fix"
      source_ids: []
    - id: position_fix_usable_exit
      applies_to: "Unused product exits at position_fix"
      rule: "For each unchanged input identity/unit: Q_U_fix = U_return; Q_X_fix = X_transfer as two separate positive exchanges. Diagnostic C_fix = G_fix - U_return - X_transfer is not a physical exchange or credit. Neither U nor X is in closing stock."
      inputs:
        - cp_position_fix_material
        - material_id
        - actual_unit
        - U_return
        - X_transfer
        - return_recipient
        - transfer_recipient
        - G_fix
      output: "Q_U_fix; Q_X_fix; diagnostic_C_fix"
      source_ids: []
    - id: position_fix_bridge
      applies_to: "Measured property bridge when required at position_fix"
      rule: "For each exact bridge_same_ids, bridge_state, bridge_period and bridge_balance_pool_id: k_kg_per_item_fix = bridge_net_mass_kg / positive bridge_item_count, with units kg/Item(s). This output is a measured coefficient, not physical mass. Mixed configurations or changed cut/assembly states use separate same-ID measurements; no universal coefficient/density. Missing actual same-ID/state evidence or positive count leaves coefficient unavailable. External counted door/lockset exchanges remain Item(s)."
      inputs:
        - cp_position_fix_material
        - bridge_same_ids
        - bridge_state
        - bridge_period
        - bridge_balance_pool_id
        - bridge_item_count
        - bridge_net_mass_kg
        - bridge_source
      output: "k_kg_per_item_fix"
      source_ids: []
    - id: position_fix_event_counts
      applies_to: "Interface/internal state rows at position_fix"
      rule: "Use only the actual received_count, fixed_count matching this node row/transfer/state; pair handoffs by transfer_id and assembly_id, and retain distinct real repeat event IDs. No internal feed is fixed to one."
