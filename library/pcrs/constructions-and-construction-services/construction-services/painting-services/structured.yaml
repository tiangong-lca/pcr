product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.painting-services"
  classification_refs: "cpc:3.0:54730"
  covered_products: "Accepted interior brush/roller waterborne wall painting contractor service"
  excluded_products: "Paint manufacture; wall manufacture or installation; excluded routes in section 1"
  representative_product: "One m2 accepted waterborne-coated gypsum-board interior wall"
  production_route: "Campaign-indexed minor preparation then brush/roller coating, drying, cleanup and acceptance"
  market_state: "Completed contractor service at client acceptance, with coating system and substrate declared"
functional_unit:
  what: "Completed interior waterborne wall painting service"
  how_much: "1 m2"
  how_well: "Accepted to the declared project coating specification: substrate condition, colour, finish, hiding and specified film/build requirements; defects closed"
  how_long_or_cycle: "One campaign through specified drying and client acceptance; no assumed service life or future repaint cycle"
  reference_flow_link: "accepted_painting_service"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers brush or roller application of waterborne architectural coatings to installed gypsum-board or plaster interior walls handed over ready for normal minor preparation. It includes minor cleaning and patching, the specified primer if used, all actual finish coats, drying, touch-up, tool cleanup and acceptance in one contractor campaign. Substrate manufacture and installation, extensive replastering, hazardous coating removal, exterior work, spray application, solvent industrial coatings, waterproofing, road markings and future maintenance repainting are excluded. This service boundary is an authored modelling choice; UFGS supports the preparation/application distinction rather than a universal coat count."
      source_ids: []
    - rule_id: service_gate
      applies_to: "all processes"
      rule: "Include campaign minor preparation through accepted coating, cleanup and defect closure. Installed substrate manufacture/installation stays outside; document deviations before reuse."
      source_ids:
        - ufgs-architectural-coatings-2026
    - rule_id: actual_system
      applies_to: "finish"
      rule: "Record actual primer decision, layer count, coating identities, drying and application conditions; no fixed two-coat assumption."
      source_ids:
        - ufgs-architectural-coatings-2026
    - rule_id: shared_assets
      applies_to: "prepare; finish"
      rule: "Identify shared task lighting, ventilation, electrical supply and reusable tools, list prepare and finish consumers and campaign periods, and record one owner for each shared event. Retain operating and replacement burdens where attributable; disclose capital-equipment treatment."
      source_ids: []
    - rule_id: waste_gate
      applies_to: "prepare; finish"
      rule: "Track residue and wash-water handover and treatment destinations separately from direct releases; cleaning and residual paint storage follow the declared site management plan."
      source_ids:
        - ufgs-architectural-coatings-2026
boundary_abstraction:
  declared_starting_condition: "Installed gypsum/plaster interior wall accepted for minor preparation; substrate ownership and prior works remain outside the service inventory"
  starting_condition_role: "Existing parent surface condition, not a free wall-material input or output"
  product_classification_scope: "A narrower service subset of CPC 54730 Painting services"
  recursive_input_rule: "Subcontracted same-category painting must be represented once as a purchased verified service or decomposed foreground work, never both; retain subcontract boundaries and area"
  upstream_dataset_requirement: "Link coating, primer, repair, water, electricity, consumables and transport inputs to compatible upstream datasets; missing links remain explicit. Do not import wall production into the service reference"
  disclosure: "Report starting wall condition, excluded prior works, supplier-dataset transport coverage, shared asset attribution, hazards and excluded future maintenance"
