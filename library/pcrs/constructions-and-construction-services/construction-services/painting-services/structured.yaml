allocation_rules:
  - rule_id: campaign_attribution
    applies_to: "prepare; finish"
    rule: "Subdivide records by campaign, room and node first. Attribute shared electricity by metering or documented power-time; shared transport by measured load-distance and reusable consumables by documented usage and replacement. Reconcile consumer shares to one total per period; use area allocation only for homogeneous same-system campaigns with justified evidence."
    source_ids: []
  - rule_id: rework_retention
    applies_to: "finish"
    rule: "Retain failed-coat removal, extra coating, energy and cleanup with the producing campaign; count final accepted area once. Downgrade, recovery or discard requires an actual destination and no automatic avoided-product credit."
    source_ids: []
  - rule_id: no_coproduct
    applies_to: "all processes"
    rule: "The defined route has one service output. Returned usable paint is a stock correction. No paint-leftover, waste or existing-wall coproduct allocation is allowed. If a real independently marketed coproduct arises, document a separately reviewed method before reuse."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_prepare
      process_id: "prepare"
      flow_role: "Preparation cards; reference signed finish-node accepted area"
      record_type: "Campaign ledger and acceptance survey"
      raw_fields: "campaign; room; event; timestamp; preparation product and batch; stock issued returned opening closing; wet mass; water volume; energy meter or power-time; transport load and distance; cp_finish accepted net area survey reference; preparation/rework tasks; waste and wastewater quantity and destination; particle size/composition medium method and uncertainty; shared asset consumer shares; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Reconcile preparation material, transport, electricity, cleaning-water, collected residue and particle records with invoices, stock and meters. Reference the signed cp_finish accepted-area survey as denominator without creating an accepted output at prepare. Assign each preparation or shared event once. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg; m3; kWh; t*km; m2"
      frequency: "Each issue, coat, cleanup, shared event and acceptance"
      temporal_coverage: "Full campaign including rework and final cleanup"
      site_scope: "Declared site and contractor; prepare node only"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; signed area survey; supplier densities; traceable stock/waste records; approved attribution; species evidence and uncertainty"
    - protocol_id: cp_finish
      process_id: "finish"
      flow_role: "Finishing cards and accepted service output"
      record_type: "Campaign ledger and acceptance survey"
      raw_fields: "campaign; room; event; timestamp; coating and primer product/batch; stock issued returned opening closing; wet mass; volume and density; actual coat count and layer areas; thinning and cleanup water; energy meter or power-time; net area and deductions; accepted rejected reworked area; drying regime; acceptance and defect closure; waste quantity and destination; emission species medium composition method and uncertainty; shared asset consumer shares; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Reconcile each primer/finish-coat issue and stock return with wet mass or traceable density, layer areas, thinning, cleanup, electricity and species evidence. Survey accepted net area after drying and defect closure and sign the acceptance record. Assign each finish or shared event once. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg; m3; kWh; t*km; m2"
      frequency: "Each issue, coat, cleanup, shared event and acceptance"
      temporal_coverage: "Full campaign including rework and final cleanup"
      site_scope: "Declared site and contractor; finish node only"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; signed area survey; supplier densities; traceable stock/waste records; approved attribution; species evidence and uncertainty"
  calculation_rules:
    - id: area_normalization
      applies_to: "all inventory rows"
      rule: "For accepted net area A_accepted > 0, calculate Q_i = Q_lot_i / A_accepted × 1 m2 for each actual node-attributable lot total, preserving the original numerator unit, original totals and node ownership. Zero accepted area cannot form an accepted-service dataset. The reference output uses its own cp_finish accepted-area record and normalizes to 1 m2."
      inputs:
        - cp_prepare
        - cp_finish
        - "actual node lot totals"
        - "accepted net area"
      output: "Amounts per reference flow"
      source_ids: []
    - id: stock_reconciliation
      applies_to: "refine_waterborne_finish; waterborne_primer; refine_repair_compounds; protection_consumables_protective_sheet"
      rule: "Accounted use = opening stock + receipts - closing stock - usable returns transferred outside this lot accounting boundary and not already included in closing stock. A usable return already counted in closing stock must not be subtracted again. Reconcile accounted use to separately traced applied/consumed material, waste and other documented exits; invoices alone do not determine applied paint. Retain the ledger boundary, original units and return ownership before area_normalization."
      inputs:
        - cp_prepare
        - cp_finish
        - "opening stock"
        - receipts
        - "closing stock"
        - "exclusive usable returns"
        - "applied/consumed and waste records"
      output: "Reconciled actual lot use before normalization"
      source_ids: []
    - id: wet_mass_conversion
      applies_to: "refine_waterborne_finish; waterborne_primer; refine_repair_compounds"
      rule: "Multiply recorded supplied volume by product-specific density on a compatible basis; retain both original volume and converted wet mass. No generic paint density is permitted."
      inputs:
        - "supplier density"
        - "recorded volume"
      output: "Wet product kg"
      source_ids: []
    - id: species_emissions
      applies_to: "actual exchanges required by refine_finish_air_species"
      rule: "Use measured species release or a documented species-specific material balance of actually applied products, retained coating, captured waste and emitted fractions. Record indoor release and any outdoor transfer consistently, avoiding duplicate releases. EPA describes activity/content-based estimation but provides no universal species split for this PCR."
      inputs:
        - cp_finish
        - "product composition"
        - "release evidence"
      output: "Species kg to declared air medium"
      source_ids:
        - epa-eiip-architectural-coating-1995
  data_quality_requirements:
    - id: quality_actual_material_exits
      applies_to: "finish"
      requirement: "The finishing protocol retains mandatory collection of all actual packaging, containers, used tools and cleanup articles by material, contamination/hazard state and receiver, including actual articles not named by the conditional waste cards. Each real distinct waste must have its own concrete exchange before completion; no common packaging/tool identity or compulsory disposal is inferred. Reusable sealed paint and retained tools remain returns/stock or resource records. Record wet residue, dry residue, carrier articles and contained coating on exclusive physical dispatch bases to prevent duplicate constituent exits."
      evidence: "cp_finish"
    - id: coverage
      applies_to: "all processes"
      requirement: "Cover all campaign inputs, stock corrections, rework, waste, shared burdens and area; disclose missing records and cut-offs without silent zeros."
      evidence: "Reconciled node ledgers and acceptance records"
    - id: representativeness
      applies_to: "all inventory rows"
      requirement: "Report site, country, dates, coating formulation, wall starting state and application/drying technology; geographic electricity and transport choices must match actual supply."
      evidence: "Project and supplier records"
    - id: identity_resolution
      applies_to: "all inventory rows"
      requirement: "Resolve each actual exchange of umbrella cards to a verified concrete UUID, property and unit before TIDAS exchange publication; retain gaps rather than selecting a broad convenient match."
      evidence: "Independent identity verification and support rows"
    - id: range_evidence
      applies_to: "all ranges"
      requirement: "Provisional estimates are screens only, including zeros for conditional absence, and never substitute for measured totals. Investigate outliers against independent evidence; do not derive a guardrail from the same batch it validates."
      evidence: "Independent reviewed comparison and uncertainty disclosure"
    - id: refine_protection_consumables
      applies_to: "protection_consumables_protective_sheet"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella: instantiate each actual material; reusable items use measured attributable replacement consumption, not full purchase per lot. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual masking products and consumed preparation-tool functions/SKUs require exact identities/property/unit and independently measured replacement consumption; reusable full purchase not per lot."
      evidence: "cp_prepare; actual independent records and identity/unit evidence"
    - id: refine_prepare_residue
      applies_to: "prepare_residue_sanding_residue; prepare_residue_repair_debris"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Split collected residues by composition and destination; distinguish dry solid wastes from air releases and wastewater. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual used masking/protection products and different substrate/composition/receiver streams require independent actual identities/quantities; no dry/wet/air mixture or default proportions."
      evidence: "cp_prepare; actual independent records and identity/unit evidence"
    - id: refine_prepare_air_particles
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella: establish particle size, composition and indoor or outdoor air destination from measurements or justified release modelling before selecting concrete elementary exchanges; collected dust is not an air emission. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_prepare; actual independent records and identity/unit evidence"
    - id: refine_finish_air_species
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella: require substance or species identity, as-applied content basis, emitted fraction and receiving air compartment. A regulatory total VOC content is not a species flow or an automatic complete-release factor; retain unspeciated gaps explicitly in the dataset. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_finish; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: refine_waterborne_finish
      applies_to: "finish"
      requirement: "Independently identify every actual waterborne interior architectural wall finish formulation/SKU, supplied wet state and provider gate used by brush/roller. Distinct products or colour formulations that have different flow identities need separate independent records, never a summed coating identity. Collect wet mass, opening and closing intact stock, receipts, actual usable returns, spills, all coats, changes and rework by identity; record actual state density when litres are converted to kg. Each actual coating child uses Mass/kg, the original stock_reconciliation and wet_mass_conversion methods and the original unique accepted net area once. Preserve source-specific constituent and release-fate evidence, residual/waste custody and actual drying acceptance; no default coat count, emission fraction or finish formulation. This is a mandatory collection/refinement requirement, not a quantity-bearing exchange. Before dataset completion create one card per actual independent identity/state/gate, with its own quantity, one property/unit and verifiable identity evidence. Unknown occurrence is not zero. No former family total or Range may be copied or divided into child quantities/ranges; derive any child screen only from independently applicable evidence. Missing actual identity, quantity, method or conversion blocks completion; record evidenced nonoccurrence separately."
      evidence: "cp_finish; independent identity, stock/activity, custody and conversion evidence"
    - id: refine_contractor_transport
      applies_to: "prepare"
      requirement: "Identify every actual vehicle/load-specific material or equipment freight service by mode, vehicle/load scope, provider, route and gate. Independently determine its compatible t*km from measured payload_t times actual loaded distance_km and the evidenced causal campaign share, or an equivalent verified carrier activity record; reconcile all consumers. Keep each actual service as one separate Goods transport (mass*distance)/t*km exchange normalized once by accepted area. Own all campaign mobilization here once, including attributable return scope; never invent empty-leg payload. A service whose real native reference differs requires a separate matching-property/unit exchange and evidenced compatible calculation, not a numerical relabelling to t*km. Exclude upstream supplier transport already included in the purchased dataset and reconcile provider/direct-vehicle coverage. This is a mandatory collection/refinement requirement, not a quantity-bearing exchange. Before dataset completion create one card per actual independent identity/state/gate, with its own quantity, one property/unit and verifiable identity evidence. Unknown occurrence is not zero. No former family total or Range may be copied or divided into child quantities/ranges; derive any child screen only from independently applicable evidence. Missing actual identity, quantity, method or conversion blocks completion; record evidenced nonoccurrence separately."
      evidence: "cp_prepare; independent identity, stock/activity, custody and conversion evidence"
    - id: refine_repair_compounds
      applies_to: "prepare"
      requirement: "For each actually used gypsum-based or other compatible minor-repair formulation, determine its exact supplied identity/SKU, wet state and supplier gate independently. The alternative formulations are not one flow. Collect opening stock, net receipts, intact closing, actual usable returns, installed use, all rework and nonreturned loss/waste by formulation. Fix each actual child to Mass/kg; actual wet supplied mass attributable to this campaign is normalized once by the signed cp_finish accepted net area under stock_reconciliation. Keep plasterboard manufacture and major plastering excluded. Actual other formulations remain mandatory even if not listed in an example; no invented default formulation or ingredient repurchase. This is a mandatory collection/refinement requirement, not a quantity-bearing exchange. Before dataset completion create one card per actual independent identity/state/gate, with its own quantity, one property/unit and verifiable identity evidence. Unknown occurrence is not zero. No former family total or Range may be copied or divided into child quantities/ranges; derive any child screen only from independently applicable evidence. Missing actual identity, quantity, method or conversion blocks completion; record evidenced nonoccurrence separately."
      evidence: "cp_prepare; independent identity, stock/activity, custody and conversion evidence"
