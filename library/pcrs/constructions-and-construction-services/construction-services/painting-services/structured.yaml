measurement_rules:
  - id: net_area
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Measure accepted net wall surface area from verified dimensions or survey; deduct unpainted openings and record reveals separately. Coat area and rework-pass area do not enlarge accepted net area."
  - id: wet_supply_mass
    applies_to: "refine_waterborne_finish; waterborne_primer; refine_repair_compounds"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep wet supplied product mass distinct from dry film solids and VOC mass. Convert volume using product-specific measured or supplier density on the same formulation and temperature basis."
  - id: emission_identity
    applies_to: "actual exchanges required by refine_finish_air_species; actual exchanges required by refine_prepare_air_particles"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep substance or particle-size identity and receiving medium with each emission; total VOC content and captured dust are supporting records, not automatically elementary emissions."
  - id: transport_work
    applies_to: "refine_contractor_transport"
    required_property_ref:
      name: "Goods transport (mass*distance)"
      uuid: "838aaa20-0117-11db-92e3-0800200c9a66"
    required_unit: "t*km"
    rule: "Use Units of mass*length 838aaa21-0117-11db-92e3-0800200c9a66, reference t*km factor 1. Calculate from attributable tonnes and kilometres; kg*km converts to t*km by dividing by 1000. Retain actual vehicle/load/route and avoid duplicate mobilization."
