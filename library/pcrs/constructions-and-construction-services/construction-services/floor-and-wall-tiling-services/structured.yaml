product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.floor-and-wall-tiling-services"
  classification_refs: "cpc:3.0:54740; narrower"
  covered_products: "Interior ceramic floor tile thinset installation on ready substrate"
  excluded_products: "Wall/stone/epoxy tiling; substrate construction; membranes; demolition"
  representative_product: "Clean accepted ceramic tiled interior floor"
  production_route: "Cut → mix thinset → bond and set → mix grout → grout, treat joints and clean"
  market_state: "Completed contractor service at acceptance, before building use"
functional_unit:
  what: "Accepted ceramic tiled interior floor installation"
  how_much: "1 m2"
  how_well: "Declared installation design, bond/grout quality and acceptance inspection; no universal performance value is invented"
  how_long_or_cycle: "One work lot through completed cure/acceptance; no service-life claim"
  reference_flow_link: "accepted_tiled_floor"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This category measures an installation service on a previously accepted, stable, dry, clean and suitably flat interior substrate. Work covers layout, cutting ceramic floor tile, water-mixed cementitious thinset, bonding and setting, cementitious grouting, specified movement-joint treatment and final cleanup. Wall, stone, epoxy, thick-bed, exterior and submerged systems are excluded. Substrate manufacture, major levelling or repair, waterproofing membranes, demolition and later building use are separate responsibilities."
      source_ids: []
    - rule_id: ready_substrate
      applies_to: "foreground_boundary"
      rule: "Require a signed readiness inspection; if major repair, levelling or membrane work is needed, stop this scope and assign a separate dataset."
      source_ids:
        - laticrete-thinsets
    - rule_id: service_gate
      applies_to: "all_processes"
      rule: "Finish at accepted net floor area after specified joint treatment and cleanup. Measure actual water, powder, paste and cut-tile transfers; no assumed hydration yield or reaction emission."
      source_ids:
        - mapei-floor-installation
    - rule_id: burden_ownership
      applies_to: "shared_access_service; shared_tool_service"
      rule: "Own shared asset service once in grout_finish with all consuming nodes and dates; meter operational energy at consuming nodes and remove that energy from the shared service."
      source_ids: []
    - rule_id: waste_gate
      applies_to: "all_processes"
      rule: "Captured slurry, dust and residues leave as custodial waste. Actual elementary releases require reported substance, size where relevant, receiving medium and quantity; a blank observation is not zero."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Accepted ready existing interior substrate; no major correction or membrane work remains"
  starting_condition_role: "Supplied prerequisite outside installation service foreground"
  product_classification_scope: "Narrower interior ceramic floor subset of cpc:3.0:54740"
  recursive_input_rule: "Do not recurse from intermediate floor-area handoffs into another full tiling service. External same-category subcontract work needs a separate, non-overlapping location and boundary record."
  upstream_dataset_requirement: "Link purchased tile, formulated thinset/grout, water, electricity and actual consumables to compatible upstream datasets; disclose excluded substrate/membrane burdens."
  disclosure: "Declare the ready-substrate supplier gate, omitted work, internal transfers, joint design, shared-resource ownership and waste custody gates."
