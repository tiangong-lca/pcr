    - id: atomic_child_routing
      applies_to: "layout_cut; mortar_mix; bond_cure; grout_mix; grout_finish"
      requirement: "The following routes each child to its original role, node, unique unit and method CP. Independently apply that original role measurement, stock, source/fate, rework, share, conversion and normalization method to each actual identity/state child. Retain the original helper/selector role parameter as legacy_parent_role, but supply quantity operands from this child independent records; ROW_UNIT(child_row_id) is the explicit unit below. Reconcile stocks/transfers only within the same identity/state and compatible native unit, grouping different materials, media, states and units separately. Parent totals are non-exchange diagnostics, never copied as child operands or summed across unlike units. Unsupported original-helper applicability or missing actual conversion, denominator or evidence blocks finalization; field records cannot choose a new method. Original role-named formula operands remain ledger names rather than duplicate exchanges. A cross-unit legacy role executes by this mapping and actual child unit instead of inheriting a wrong fixed unit. Routing: tile_packaging_cardboard => role=tile_packaging, node=layout_cut, property=Mass, unit=kg, CP=cp_layout_cut; tile_packaging_plastic => role=tile_packaging, node=layout_cut, property=Mass, unit=kg, CP=cp_layout_cut; tile_packaging_pallet => role=tile_packaging, node=layout_cut, property=Mass, unit=kg, CP=cp_layout_cut; mortar_packaging_bag => role=mortar_packaging, node=mortar_mix, property=Mass, unit=kg, CP=cp_mortar_mix; mortar_packaging_container => role=mortar_packaging, node=mortar_mix, property=Mass, unit=kg, CP=cp_mortar_mix; mortar_packaging_pallet => role=mortar_packaging, node=mortar_mix, property=Mass, unit=kg, CP=cp_mortar_mix; bond_consumables_spacer => role=bond_consumables, node=bond_cure, property=Mass, unit=kg, CP=cp_bond_cure; bond_consumables_levelling => role=bond_consumables, node=bond_cure, property=Mass, unit=kg, CP=cp_bond_cure; bond_consumables_protection => role=bond_consumables, node=bond_cure, property=Mass, unit=kg, CP=cp_bond_cure; bond_reject_assembly => role=bond_reject, node=bond_cure, property=Mass, unit=kg, CP=cp_bond_cure; grout_packaging_bag => role=grout_packaging, node=grout_mix, property=Mass, unit=kg, CP=cp_grout_mix; grout_packaging_container => role=grout_packaging, node=grout_mix, property=Mass, unit=kg, CP=cp_grout_mix; grout_packaging_pallet => role=grout_packaging, node=grout_mix, property=Mass, unit=kg, CP=cp_grout_mix; movement_joint_materials_sealant => role=movement_joint_materials, node=grout_finish, property=Mass, unit=kg, CP=cp_grout_finish; movement_joint_materials_backing => role=movement_joint_materials, node=grout_finish, property=Mass, unit=kg, CP=cp_grout_finish; finish_consumables_cleaner => role=finish_consumables, node=grout_finish, property=Mass, unit=kg, CP=cp_grout_finish; finish_residue_cured => role=finish_residue, node=grout_finish, property=Mass, unit=kg, CP=cp_grout_finish; finish_residue_paste => role=finish_residue, node=grout_finish, property=Mass, unit=kg, CP=cp_grout_finish; finish_residue_assembly => role=finish_residue, node=grout_finish, property=Mass, unit=kg, CP=cp_grout_finish"
      evidence: "actual_child_register; legacy_parent_role; atomic_flow_row_id; independent_physical_quantity; exchange_unit; original_protocols"
    - id: atomic_range_noninheritance
      applies_to: "tile_packaging_cardboard; tile_packaging_plastic; tile_packaging_pallet; mortar_packaging_bag; mortar_packaging_container; mortar_packaging_pallet; bond_consumables_spacer; bond_consumables_levelling; bond_consumables_protection; bond_reject_assembly; grout_packaging_bag; grout_packaging_container; grout_packaging_pallet; movement_joint_materials_sealant; movement_joint_materials_backing; finish_consumables_cleaner; finish_residue_cured; finish_residue_paste; finish_residue_assembly"
      requirement: "Retired parent numerical ranges, per-exchange screening instructions and rationales are retained only in implementation audit, applying to neither new child exchanges nor parent-family sums and never proportionally allocated. Each new child has independent evidence needs for actual quantity, identity/state, measurement/conversion, uncertainty and comparable independent observations. Add its own interval only after review confirms applicability to this independent object; never validate a batch with its own maximum. Original ranges of unchanged semantically compatible atomic objects retain their original status."
      evidence: "independent_child_measurement; independent_range_evidence; implementation_range_audit"
    - id: atomic_paired_quantity_provenance
      applies_to: "actual internal child source and recipient transfers"
      requirement: "Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      evidence: "source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
    - id: service_refinement_grout_finish
      applies_to: "shared_access_service; shared_tool_service"
      requirement: "The former multifunction shared_service inventory card is retired. Preserve its full original service-source roster as a nonexchange completeness ledger. Confirm every actual access/tool identity and occurrence/absence separately, with independently determinable quantity, one fixed property/unit, provider scope, period, source reconciliation and one burden owner. Do not copy/divide parent hours, numeric ranges or UUIDs, or sum different identities. Same supplier/invoice alone does not define one service. A genuinely indivisible single-function provider package may be counted once under its compatible child boundary, excluding its included components elsewhere. If an actual service has no compatible child, or another independent identity exists under a selected function, require a reviewed additional explicit identity/card and protocol before completion; never omit it or resurrect the multifunction exchange. Unresolved occurrence, identity, quantity, method, support or inclusion scope blocks final foreground completion; candidate checker success cannot close these site-data gates."
      evidence: "actual service register; contract/source/consumer reconciliation"
    - id: service_child_range_and_overlap
      applies_to: "shared_access_service; shared_tool_service"
      requirement: "New service children have no inherited numeric Range. Retain independent quantities, actual identity/capacity, contract/hour conversion, uncertainty and independently reviewed comparable observations. Add a child interval only with evidence for that specific service; no default hours, arbitrary parent split or same-batch self-validation. A compatible per-hour upstream service already carrying lifetime capital/maintenance burdens must not receive those burdens again or a second lifetime-share multiplier. For actual separately owned assets retain the evidenced original attribution method and one burden owner. Keep operating electricity at its actual node; if it is in a provider package, subtract/reconcile the evidenced included component or use a compatible nonoverlapping service dataset before counting it separately. If inseparable overlap cannot be resolved, block finalization instead of inventing a deduction."
      evidence: "independent quantity/contract/support and component-boundary evidence"
validation_rules:
  - rule_id: area_gate
    applies_to: "accepted_tiled_floor"
    rule: "Require A > 0 and one accepted output. Rejected, unfinished and intermediate areas are excluded from A and final sales output."
    source_ids: []
  - rule_id: transfer_gate
    applies_to: "all_processes"
    rule: "Pair all tile, paste and floor transfers; reconcile stock and wet/dry balance without demanding water-losing hydrated paste equal dry powder."
    source_ids: []
  - rule_id: event_gate
    applies_to: "all_processes"
    rule: "Check run/batch linkage, rework paths, waste custody, shared consumer shares and single event ownership. Missing evidence fails completeness."
    source_ids: []
  - rule_id: identity_gate
    applies_to: "all inventory rows"
    rule: "Verify actual formulation, service gate, flow type, property/unit and emission compartment; do not relabel manufactured tile as service or guess sealant/dust identity."
    source_ids: []
  - rule_id: range_gate
    applies_to: "all inventory rows"
    rule: "Investigate broad-screen outliers using measurement evidence. Provisional screening bounds do not establish conformity, publication readiness or missing-flow zeros."
    source_ids: []
