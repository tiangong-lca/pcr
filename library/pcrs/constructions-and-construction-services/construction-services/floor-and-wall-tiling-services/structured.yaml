allocation_rules:
  - rule_id: subdivide
    applies_to: "all_processes"
    rule: "First subdivide by room, lot, batch and measured event. For shared meters allocate by logged operating time and power or actual submeter evidence, documenting residual uncertainty; sum shares to the measured total."
    source_ids: []
  - rule_id: single_owner
    applies_to: "shared_access_service; shared_tool_service"
    rule: "Keep one event owner for common access/equipment service; record all five consumers and period. Exclude metered energy and duplicated contractor invoices from this service."
    source_ids: []
  - rule_id: rework
    applies_to: "all_processes"
    rule: "Charge rework inputs, cleanup and rejected material to the same accepted work lot. Link replacement operations and exits by defect id. Do not count an intermediate area or a failed area as final output."
    source_ids: []
  - rule_id: stock
    applies_to: "whole_tiles"
    rule: "Gross tile issue = opening stock + receipts - closing stock; use gross issue as whole_tiles input and record external usable returns once as tile_return output. Net consumption = gross issue - external returns is a separate upstream burden attribution quantity, not another physical exchange or negative credit. Only original upstream burdens of the actual unused returned material may follow the return; installation and rework burdens stay with the accepted service, with no automatic avoided-production credit. Closing stock and external returns are mutually exclusive; waste is already inside consumption and is never deducted again."
    source_ids: []
