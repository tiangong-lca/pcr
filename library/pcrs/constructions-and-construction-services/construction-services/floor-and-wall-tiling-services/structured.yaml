      requirement: "Legacy roles are non-exchange stock, activity, fate or closure keys in the original CP. Independent child exchanges carry quantities; atomic_ requirements retain mandatory remaining-roster refinement and finalization blocks. Original raw fields, helpers and native-unit operands retain their responsibilities and reconcile by child identity and compatible unit, never adding parent totals or unlike units. Source-table Applies-to migration: tile_packaging => tile_packaging_cardboard, tile_packaging_plastic, tile_packaging_pallet, atomic_tile_packaging; cut_air_release => atomic_cut_air_release; mortar_additives => atomic_mortar_additives; mortar_packaging => mortar_packaging_bag, mortar_packaging_container, mortar_packaging_pallet, atomic_mortar_packaging; mortar_mix_release => atomic_mortar_mix_release; bond_consumables => bond_consumables_spacer, bond_consumables_levelling, bond_consumables_protection, atomic_bond_consumables; bond_reject => bond_reject_assembly, atomic_bond_reject; bond_release => atomic_bond_release; grout_additives => atomic_grout_additives; grout_packaging => grout_packaging_bag, grout_packaging_container, grout_packaging_pallet, atomic_grout_packaging; grout_mix_release => atomic_grout_mix_release; movement_joint_materials => movement_joint_materials_sealant, movement_joint_materials_backing, atomic_movement_joint_materials; finish_consumables => finish_consumables_cleaner, atomic_finish_consumables; finish_residue => finish_residue_cured, finish_residue_paste, finish_residue_assembly, atomic_finish_residue; finish_packaging => atomic_finish_packaging; finish_release => atomic_finish_release"
