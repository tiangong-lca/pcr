  calculation_rules:
    - id: event_mass
      applies_to: "whole_tiles; cut_water; prepared_tiles; tile_return; tile_offcuts; cut_slurry; tile_packaging_cardboard; tile_packaging_plastic; tile_packaging_pallet; atomic_tile_packaging; mortar_powder; mortar_water; atomic_mortar_additives; fresh_mortar; mortar_mix_residue; mortar_wash_effluent; mortar_packaging_bag; mortar_packaging_container; mortar_packaging_pallet; atomic_mortar_packaging; grout_powder; grout_water; atomic_grout_additives; fresh_grout; grout_mix_residue; grout_wash_effluent; grout_packaging_bag; grout_packaging_container; grout_packaging_pallet; atomic_grout_packaging; tiles_feed; mortar_feed; bond_consumables_spacer; bond_consumables_levelling; bond_consumables_protection; atomic_bond_consumables; bond_reject_assembly; atomic_bond_reject; grout_feed; finish_water; movement_joint_materials_sealant; movement_joint_materials_backing; atomic_movement_joint_materials; finish_consumables_cleaner; atomic_finish_consumables; finish_residue_cured; finish_residue_paste; finish_residue_assembly; atomic_finish_residue; finish_effluent; atomic_finish_packaging"
      rule: "event_quantity = gross - tare for weighing; alternatively event_quantity = count * unit_mass or volume * density using the selected measurement_route and consistent units; select exactly one route per event and retain the measured product/wet-dry identity."
      inputs:
        - gross
        - tare
        - count
        - unit_mass
        - volume
        - density
        - measurement_route
      output: "event_quantity"
      source_ids: []
    - id: event_energy
      applies_to: "cut_electricity; mortar_electricity; bond_electricity; grout_electricity; finish_electricity"
      rule: "meter_delta = meter_end - meter_start; share = driver_node / drivers_total; event_quantity = meter_delta * share; drivers_total must be positive and sum of consuming shares must equal 1; dedicated meter uses share = 1; convert kWh by electricity_convert after attribution and retain MJ readings unchanged."
      inputs:
        - meter_start
        - meter_end
        - meter_unit
        - driver_node
        - drivers_total
        - shared_consumers
      output: "event_quantity"
      source_ids: []
    - id: event_area
      applies_to: "ungrouted_floor; floor_feed; accepted_tiled_floor"
      rule: "survey_area = length * width for each measured rectangular part; use surveyed area for other geometry; A = sum of gross surveyed plan parts - openings - unfinished_area - rejected_area; these deduction regions are mutually exclusive and each is deducted exactly once; for ungrouted_floor and floor_feed, event_quantity = internal_area at the respective actual transfer; for accepted_tiled_floor, event_quantity = A; never assign A to an internal handoff by default."
      inputs:
        - length
        - width
        - area
        - internal_area
        - plan_dimensions
        - gross_plan_parts
        - openings
        - unfinished_area
        - rejected_area
        - cp_bond_cure
        - cp_grout_finish
      output: "A; event_quantity"
      source_ids: []
    - id: event_service
      applies_to: "shared_access_service; shared_tool_service"
      rule: "For each one actual child identity/provider/contract/capacity/source period independently, H_source = actual evidenced availability in hours from service_start/service_end or bill_quantity * documented_hours_per_bill_unit, reconciled to the same contract period and paid idle where applicable. driver_node and drivers_total are evidenced nonnegative causal weights for that same service; drivers_total is the positive complete sum including all external consumers. H_job_period = H_source * sum(drivers of this job consumers) / drivers_total; H_child = sum of exclusive H_job_period. Retain every consuming node but record the complete job share only once in grout_finish. No assumed working-day length, asset lifetime, shared identity pool or duplicated period. Hours remain unnormalized; each child card divides once by A."
      inputs:
        - actual_service_identity
        - provider_id
        - contract_id
        - source_period
        - service_start
        - service_end
        - bill_quantity
        - documented_hours_per_bill_unit
        - paid_idle_hours
        - driver_node
        - drivers_total
        - shared_consumers
        - all_consumer_ids
        - source_reconciliation
        - cp_shared_access_service
        - cp_shared_tool_service
      output: "H_child; H_shared_access_service; H_shared_tool_service"
      source_ids: []
    - id: event_release
      applies_to: "atomic_cut_air_release; atomic_mortar_mix_release; atomic_grout_mix_release; atomic_bond_release; atomic_finish_release"
      rule: "event_quantity = concentration * exhaust_volume * unit_conversion for a measured substance/size and receiving medium; alternatively use directly measured net mass; select one documented method and do not infer zero from missing samples."
      inputs:
        - concentration
        - exhaust_volume
        - unit_conversion
        - gross
        - tare
        - species
        - particle_size
        - receiving_medium
      output: "event_quantity"
      source_ids: []
    - id: card_quantity
      applies_to: "all inventory rows"
      rule: "q_lot = sum of event_quantity for the same row_id and lot_id after same-node event ownership and unit checks; remove only duplicate records of the same physical event, retaining every actual repeated rework operation with its iteration; whole_tiles and tile_return use stock_draw, and mixing-material/paste/waste/release cards use their node card bridge, instead of a second event sum; measured transfers remain unforced; avoid adding recirculated water as fresh supply. Service children use their own identity-keyed H_child from event_service and their dedicated service protocol instead of q_lot; do not apply a second event sum or normalize twice."
      inputs:
        - event_quantity
        - row_id
        - lot_id
        - cp_layout_cut
        - cp_mortar_mix
        - cp_bond_cure
        - cp_grout_mix
        - cp_grout_finish
      output: "q_lot"
      source_ids: []
    - id: mortar_card_bridge
      applies_to: "mortar_powder; mortar_water; atomic_mortar_additives; fresh_mortar; mortar_mix_residue; mortar_wash_effluent; atomic_mortar_mix_release"
      rule: "mortar_powder_lot = powder_issued; mortar_water_lot = mixing_water + wash_addition; mortar_additives_lot = additive_issued; fresh_mortar_lot = transferred_wetpaste; mortar_mix_residue_lot = captured_mix_residue + retained_captured_wash_residue; mortar_wash_effluent_lot = effluent_transferred; mortar_mix_release_lot = measured_mix_releases + measured_wash_release; water totals are fresh additions only, excluding recirculation; residues assigned to the mix-residue card are disjoint from transferred wash effluent; tag each concrete actual species release by its owned pool/event and count it once; these row-specific lot totals become q_lot for area division."
      inputs:
        - powder_issued
        - mixing_water
        - wash_addition
        - additive_issued
        - transferred_wetpaste
        - captured_mix_residue
        - retained_captured_wash_residue
        - effluent_transferred
        - measured_mix_releases
        - measured_wash_release
        - cp_mortar_mix
      output: "q_lot"
      source_ids: []
    - id: grout_card_bridge
      applies_to: "grout_powder; grout_water; atomic_grout_additives; fresh_grout; grout_mix_residue; grout_wash_effluent; atomic_grout_mix_release"
      rule: "grout_powder_lot = powder_issued; grout_water_lot = mixing_water + wash_addition; grout_additives_lot = additive_issued; fresh_grout_lot = transferred_wetpaste; grout_mix_residue_lot = captured_mix_residue + retained_captured_wash_residue; grout_wash_effluent_lot = effluent_transferred; grout_mix_release_lot = measured_mix_releases + measured_wash_release; water totals are fresh additions only, excluding recirculation; residues assigned to the mix-residue card are disjoint from transferred wash effluent; tag each concrete actual species release by its owned pool/event and count it once; these row-specific lot totals become q_lot for area division."
      inputs:
        - powder_issued
        - mixing_water
        - wash_addition
        - additive_issued
        - transferred_wetpaste
        - captured_mix_residue
        - retained_captured_wash_residue
        - effluent_transferred
        - measured_mix_releases
        - measured_wash_release
        - cp_grout_mix
      output: "q_lot"
      source_ids: []
    - id: mix_state_balance
      applies_to: "mortar_mix; grout_mix"
      rule: "powder_issued + mixing_water + additive_issued + opening_wetstock = transferred_wetpaste + captured_mix_residue + mix_material_in_wash + measured_mix_releases + closing_wetstock + unexplained_balance; compare compatible measured wet masses, with original powder crystallization water included in its issued mass and retained hydration water remaining in paste/residue; unknown fate is unexplained_balance, not an emission or a forced yield."
      inputs:
        - powder_issued
        - mixing_water
        - additive_issued
        - opening_wetstock
        - transferred_wetpaste
        - captured_mix_residue
        - mix_material_in_wash
        - measured_mix_releases
        - closing_wetstock
        - unexplained_balance
        - cp_mortar_mix
        - cp_grout_mix
      output: "mix_balance"
      source_ids: []
    - id: wash_state_balance
      applies_to: "mortar_mix; grout_mix"
      rule: "wash_addition + mix_material_in_wash + opening_washstock = effluent_transferred + retained_captured_wash_residue + measured_wash_release + closing_washstock + unexplained_wash_balance; exclude wash_addition from mixing_water and exclude material sent to washing from captured_mix_residue; retain measured wet mass/solids basis and each custody event once, without inventing a direct discharge."
      inputs:
        - wash_addition
        - mix_material_in_wash
        - opening_washstock
        - effluent_transferred
        - retained_captured_wash_residue
        - measured_wash_release
        - closing_washstock
        - unexplained_wash_balance
        - cp_mortar_mix
        - cp_grout_mix
      output: "wash_balance"
      source_ids: []
    - id: lot_to_area
      applies_to: "all inventory rows"
      rule: "q_norm = q_lot / A; q_lot is the measured or attributed exchange of the declared node in its recorded unit; A is the same lot accepted net floor area in m2 and must be positive."
      inputs:
        - q_lot
        - A
        - cp_layout_cut
        - cp_mortar_mix
        - cp_bond_cure
        - cp_grout_mix
        - cp_grout_finish
      output: "q_norm"
      source_ids: []
    - id: stock_draw
      applies_to: "whole_tiles; tile_return"
      rule: "gross_issue = opening_stock + receipts - closing_stock; whole_tiles_lot = gross_issue; tile_return_lot = external_return; net_consumed = gross_issue - external_return; reconcile net_consumed to independently measured actual_processing_draw, meaning actual processing withdrawals excluding unused external returns, including cutting losses and new materials for rework but excluding repeated internal recutting of the same piece, never purchasing receipts; keep physical gross input and return output distinct from net burden attribution; stock and return event ids are disjoint, and waste is not deducted again."
      inputs:
        - opening_stock
        - receipts
        - closing_stock
        - external_return
        - actual_processing_draw
        - cp_layout_cut
      output: "gross_issue; tile_return_lot; net_consumed"
      source_ids: []
    - id: electricity_convert
      applies_to: "cut_electricity; mortar_electricity; bond_electricity; grout_electricity; finish_electricity"
      rule: "electricity_MJ = electricity_kWh * 3.6"
      inputs:
        - electricity_kWh
      output: "electricity_MJ"
      source_ids: []
    - id: transfer_reconcile
      applies_to: "all inventory rows"
      rule: "sending_quantity = receiving_quantity + documented_transfer_loss; compare same transfer id, unit and wet/dry state; charge loss once to the sending node, using kg for material and m2 for floor transfers."
      inputs:
        - sending_quantity
        - receiving_quantity
        - documented_transfer_loss
      output: "transfer_balance"
      source_ids: []
    - id: atomic_child_normalization
      applies_to: "tile_packaging_cardboard; tile_packaging_plastic; tile_packaging_pallet; mortar_packaging_bag; mortar_packaging_container; mortar_packaging_pallet; bond_consumables_spacer; bond_consumables_levelling; bond_consumables_protection; bond_reject_assembly; grout_packaging_bag; grout_packaging_container; grout_packaging_pallet; movement_joint_materials_sealant; movement_joint_materials_backing; finish_consumables_cleaner; finish_residue_cured; finish_residue_paste; finish_residue_assembly"
      rule: "Record independent_physical_quantity separately by atomic_flow_row_id; actual_<row_id>_quantity is its named alias only, never a copied family amount. Materials retain original CP per-identity/state gross/net stock and outward-return conventions; transfers use actual paired custody quantity; usable exits and wastes use independent actual fate quantities. Number-of-items owned asset equivalents use this PCR original job_driver/full_life_driver complete-life fraction including manufacture, maintenance, replacement and end of life, with every consumer and a positive complete denominator. Duration/h service children instead use actual attributable job hours with the matching complete-life burden per hour; never multiply hours by the fraction again. Purchased services use only actual complete physical tasks whose real contract defines Item(s), with original actual attribution; hours, days and prices cannot become event counts. atomic_child_intensity = independent_physical_quantity / A, where A is unique finally accepted net installed tiled-floor area in m2 under net_area under the original acceptance rule; A=0 blocks normalization. Non-exchange parent role ledgers and original CP operands retain their stock, transfer, closure and ownership functions, without adding a second exchange or changing the method."
      inputs:
        - atomic_flow_row_id
        - independent_physical_quantity
        - exchange_property
        - exchange_unit
        - A
        - cp_layout_cut
        - cp_mortar_mix
        - cp_bond_cure
        - cp_grout_mix
        - cp_grout_finish
      output: "atomic_child_intensity"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Resolve every actual exchange to a compatible concrete flow before TIDAS publication; umbrella cards may expand to multiple exchanges without changing service scope."
      evidence: "Flow detail and support property/unit evidence"
