system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers controlled hand-tool dismantling and clearance of a surveyed bare interior partition made of fired-clay bricks and cementitious mortar. The supplied function is completed removal, not the manufacture of replacement wall materials. The actual approved sequence, access, exclusion zone, floor loading, service isolation and hazard clearance govern each job. Structural or loadbearing walls, machine-led collapse, hazardous-material abatement, decorative finish stripping, replacement construction and off-site waste treatment are outside this category. Stop work when the survey or observed condition contradicts this scope; do not blend an incompatible job into the reference output."
      source_ids: []
    - rule_id: ready_interface
      applies_to: "demolition"
      rule: "Require actual competent survey, method and isolation evidence before hand-tool work; use HSE planning guidance and OSHA masonry stability/loading principles as technical context, with applicable local requirements independently declared. No generic top-down instruction substitutes for the approved job sequence."
      source_ids:
        - hse-demolition
        - osha-masonry-removal
    - rule_id: removal_gate
      applies_to: "demolition"
      rule: "The independent removal responsibility ends at stable retained structure, cleared accepted area and separately documented outgoing materials at the on-site collection gate. Screening and segregation here serve this gate; off-site crushing or recovery is not an embedded production node."
      source_ids: []
    - rule_id: stock_ledger
      applies_to: "demolition"
      rule: "Record the existing wall geometry/materials in a custody ledger. Reconcile removed mass, remaining stock, outgoing products/wastes and actual characterized releases; do not invent an exchange buying the existing wall or label it waste before the actual removal decision."
      source_ids: []
    - rule_id: resources
      applies_to: "demolition"
      rule: "Include attributable hand-tool/access/visit service, dust-control water/extraction power, consumed protection and cleanup materials, contained debris transfer, cleanup and corrective work when used. A bounded provider service owns its stated capital coverage; separately disclose any exclusion and never invent a tool lifetime."
      source_ids: []
    - rule_id: sharing
      applies_to: "demolition"
      rule: "Maintain shared asset/service ids with this demolition node and all other consuming jobs or reporting periods. Record service coverage, period totals, job use and attribution driver; meter local use first and allocate only a residual actually shared burden."
      source_ids: []
    - rule_id: exit_owner
      applies_to: "demolition"
      rule: "Record solid waste, wastewater and air releases at their actual distinct gates. Downstream transport/treatment is excluded from this on-site service inventory but its responsible dataset owner and transfer evidence are mandatory; no avoided virgin production or recovery credit is automatic."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Existing customer-owned bare brick/mortar partition surveyed as nonloadbearing, isolated and hazard-cleared; method and access approved"
  starting_condition_role: "Physical stock and custody interface, not a new purchased brick input and not automatically an incoming waste exchange"
  product_classification_scope: "The narrow completed partition-demolition service within cpc:3.0:54310"
  recursive_input_rule: "Subcontracted demolition of the same wall is an alternative service owner: partition responsibilities and quantities explicitly, with no parent-plus-subcontract double counting."
  upstream_dataset_requirement: "Link supplied consumables, water, electricity and bounded resource services to compatible upstream datasets. Historical wall manufacture/use is excluded at this removal interface and must be represented by its original owner when a whole-building model needs it."
  disclosure: "Declare stock ownership, prior survey/abatement boundary, job period, outgoing collection gate, tool/access/visit service coverage, capital exclusions, waste transport/treatment owner and any unmeasured inventory."
