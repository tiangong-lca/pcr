  - id: "hse-demolition"
    type: "official_guidance"
    reference: "https://www.hse.gov.uk/construction/safetytopics/demolition.htm"
    used_for: "Planning context for competent survey/method, structure/services/hazards and sequence-dependent stability/debris controls; not a universal national legal prescription"
