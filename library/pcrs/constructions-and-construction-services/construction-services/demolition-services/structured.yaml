      flow_role: "electricity supplies and bounded resource services"
      record_type: "meters issue/return records and provider logs"
      raw_fields: "job_id; resource_id; material_identity; provider; service_coverage; period_id; other_consumers; issued; consumed; returned; closing_stock; meter_readings; native_unit; direct_use; shared_total; driver_total; job_driver; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; unique_property; measurement_method_id; uncertainty"
      collection_method: "Use meter differences or verified supplier amounts; trace issue/consume/return/stock by material. For shared services enumerate every consumer and period, subtract directly attributed quantities from the shared pool, and distribute residual by documented causal use driver. Divide attributable job amount by cp_area accepted net area to record per reference flow. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg; kWh; h or verified native service unit; h"
      frequency: "Every resource event and service period close"
      temporal_coverage: "Whole job and all contributing shared-service periods"
      site_scope: "Declared site; actual provider service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated meters/scales; provider coverage; full consumer ledger; sum of assigned burdens equals pool; no overlap with included service energy"
    - protocol_id: cp_water
      process_id: "demolition"
      flow_role: "supplied water and collected wastewater"
      record_type: "water meter supply and collection records"
      raw_fields: "job_id; source; supplied_mass; collected_wastewater_mass; suspended_solids; remaining_water; moisture_basis; meter_unit; conversion_evidence; receiver; transfer_id"
      collection_method: "Measure supplied water and collected waste liquid independently; retain native readings and validated conversion only where needed. Reconcile water retained with debris, discharged, evaporated or remaining without assuming a split. Divide attributable quantities by accepted net area."
      unit: "kg"
      frequency: "Each supply/collection event"
      temporal_coverage: "Full job including final cleanup"
      site_scope: "Workfront through actual collection gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration; collection weights; moisture/solids basis; unexplained water balance and sampling uncertainty"
    - protocol_id: cp_exits
      process_id: "demolition"
      flow_role: "removed masonry reuse waste and spent supplies"
      record_type: "custody transfer and weighing"
      raw_fields: "job_id; lot_id; transfer_id; material; status; tare; gross_mass; moisture; contamination; receiver; acceptance; retained_stock; transport_owner; treatment_owner; usable_return; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Weigh or use traceable receiving weights, classify each lot once and retain acceptance/destination evidence. Link rejected reuse lots back to demolition stock then actual waste/retention route; prevent product/waste double classification. Divide actual outgoing mass by accepted net area. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "Each outgoing lot and closing stock count"
      temporal_coverage: "From first removal to final collection-gate reconciliation"
      site_scope: "Declared on-site collection gate and documented receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale traceability; unique transfer ids; accepted product quality; waste classification; closing stock and mass reconciliation"
    - protocol_id: cp_emissions
      process_id: "demolition"
      flow_role: "characterized air releases"
      record_type: "measurement or validated estimation dossier"
      raw_fields: "job_id; substance; particle_class; air_compartment; sampling_duration; control_state; emitted_mass; estimation_method; captured_mass; uncertainty; missing_coverage; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id"
      collection_method: "Use representative emission measurements or a validated job-specific total-release method with actual control state. Preserve species/particle basis and medium; do not convert worker exposure concentration to total release without a defensible mass calculation. Exclude measured captured waste and normalize attributed emitted mass by accepted net area. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "Each representative operation/control state and full-job estimate"
      temporal_coverage: "Removal and cleanup including corrective work"
      site_scope: "Actual workfront receiving air compartment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Method validation; monitoring coverage; measurement uncertainty; explicit uncovered species/stages"
  calculation_rules:
    - id: area_normalization
      applies_to: "all inventory rows"
      rule: "Record attributable job exchange quantity per reference flow by dividing by the measured accepted net removal area in m2. Sum disjoint accepted wall polygons once; record uncertainty and reject a zero or unresolved denominator. No area-to-mass conversion is implied."
      inputs:
        - cp_area
        - "node-specific quantity protocol"
      output: "Exchange quantity per reference flow"
      source_ids: []
    - id: shared_attribution
      applies_to: "bounded_resource_service_access_provision; bounded_resource_service_container_provision; site_electricity"
      rule: "Use direct job measurement first. Distribute only the residual shared pool by the documented job causal-use share of all consumers in that period; reconcile allocated totals to that residual. Apply area_normalization after attribution."
      inputs:
        - cp_resources
        - cp_area
      output: "Attributable resource quantity per reference flow"
      source_ids: []
    - id: custody_closure
      applies_to: "reusable_removed_material_fired_clay_brick; masonry_waste; supplies_waste_spent_bag; supplies_waste_spent_sheet; supplies_waste_spent_filter; supplies_waste_loose_captured_residue; cleanup_wastewater; actual exchanges required by refine_characterized_air_release"
      rule: "Compare removed stock and added supplies/water with accepted reusable exits, waste exits, actual emissions and remaining stock on compatible mass/moisture bases. Keep uncertain or unmeasured terms visible; do not infer missing air release as a balance residual or force an artificial zero."
      inputs:
        - cp_area
        - cp_resources
        - cp_water
        - cp_exits
        - cp_emissions
      output: "Material/water closure and unexplained difference"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "demolition"
      requirement: "Prove nonloadbearing bare brick/mortar wall, isolation, hazard clearance and approved hand-tool method; stop on contradictory conditions."
      evidence: "Survey; engineering/method approval; local release record"
    - id: dq_quantity
      applies_to: "all inventory rows"
      requirement: "Use the same accepted area denominator; disclose instrument error, stock carryover, moisture and incomplete measurements. Record nonuse separately from missing quantities."
      evidence: "cp_area and all linked protocols"
    - id: dq_time
      applies_to: "all inventory rows"
      requirement: "Cover actual work and corrective visits with dated resource, transfer and completion events; disclose gaps instead of replacing them with zero."
      evidence: "Complete job/event ledger"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Resolve each actual exchange to a compatible concrete flow, property and unit with detail evidence. Conditional umbrella cards require actual foreground identities; support gaps remain explicit."
      evidence: "Identity dossier and actual material/provider/medium records"
    - id: dq_ranges
      applies_to: "all inventory rows"
      requirement: "Replace missing Range evidence with observed job distributions or defensible technology-specific evidence when available. Retain the stated evidence need until resolved; no universal water, energy, dust, density or recovery coefficient is prescribed."
      evidence: "Per-card evidence needs; measurements with uncertainty"
    - id: dq_gate
      applies_to: "accepted_demolition; material exits"
      requirement: "Keep inspection failure/rework and undecided material lots out of accepted service/product quantities. Close correction or disclose incomplete output."
      evidence: "Signed handover and custody acceptance records"
    - id: refine_consumed_supplies
      applies_to: "consumed_supplies_collection_bag; consumed_supplies_protection_sheet; consumed_supplies_filter"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella for actual bags, protective sheeting, filters and cleanup substances consumed. Split by identified material/formulation in a concrete dataset. Range evidence need: document issued, returned, remaining and consumed quantities for each actual supply; no generic consumable coefficient. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual cleanup formulations and any other unlisted consumables require an actual SKU/formulation/unit roster before a further flow card; do not invent solvents or disinfectants."
      evidence: "cp_resources; actual independent records and identity/unit evidence"
    - id: refine_bounded_resource_service
      applies_to: "bounded_resource_service_access_provision; bounded_resource_service_container_provision"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella for actually used provider services: hand tools, access equipment, containers and mobilization where applicable. Preserve provider native units and split concrete services; hours only describe timed use. Range evidence need: obtain actual service coverage, use logs, periods, shared consumers and driver evidence; no invented equipment lifetime. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual hand-tool functions, mobilization provider/mode/native reference, and any other service not truly the stated h-referenced complete function require concrete separate identity/property/unit refinement. Complete real bundles may remain one only with exact coverage."
      evidence: "cp_resources; actual independent records and identity/unit evidence"
    - id: refine_reusable_removed_material
      applies_to: "reusable_removed_material_fired_clay_brick"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella only for material accepted as a reusable product at the documented on-site collection/handover gate; later receiver acceptance supports product status and does not include transport or treatment without unmodelled recovery processing. Identify material, condition, custody and acceptance; intact appearance alone is insufficient. Range evidence need: weigh actual accepted lots and retain receiver quality evidence; no default reuse fraction or displacement credit. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Any other actual reusable removed product, state or recipient requires independent actual identity/native unit/quality/custody acceptance. No assumed recovery fraction or credit; transport/treatment beyond gate not silently included."
      evidence: "cp_exits; actual independent records and identity/unit evidence"
    - id: refine_supplies_waste
      applies_to: "supplies_waste_spent_bag; supplies_waste_spent_sheet; supplies_waste_spent_filter; supplies_waste_loose_captured_residue"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella for spent bags, sheeting, filters and captured dust at their waste gates. Usable containers/parts return to provider stock under custody records instead of this waste card. Range evidence need: weigh each identified stream, distinguish collected dust from uncollected air releases, and document stock carryover. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other waste identities/hazard states and actual receiver splits require measured dispatch roster; do not add one generic residual exchange."
      evidence: "cp_exits; actual independent records and identity/unit evidence"
    - id: refine_characterized_air_release
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella for actual reported species or particle-size classes and receiving air compartment; no generic dust UUID or guessed silica content. Range evidence need: obtain representative measurements or validated job-specific release estimates with control effectiveness and uncertainty. Exposure concentrations alone are not total emitted mass; no measured value is not zero. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual measured or validated-estimate substance or disjoint particle-size fractions to actual receiving air compartments; captured waste excluded."
      evidence: "cp_emissions; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
