    - id: atomic_direct_water_quantity
      applies_to: "direct_releases_direct_water"
      rule: "Activate direct_releases_direct_water only for an evidenced actual liquid-water output from the technosphere to the environment within this work boundary, fixed Volume/m3. Reservoir drawdown or natural-water movement within the environment creates no automatic purchased-water supply, resource withdrawal or this output; presence of cp_water direct_discharge_volume is not occurrence evidence. Quantify only the actual discharged-state water constituent, never unknown whole effluent/fluid mass or volume as pure H2O. The PCR fixes two measurement routes: for direct_water_only, actual_direct_releases_direct_water_quantity = independently measured direct_water_only_volume_m3; for water_mass_density, actual_direct_releases_direct_water_quantity = discharged_mixture_net_mass_kg * actual_discharge_water_mass_fraction / discharged_water_density_kg_per_m3. The latter requires representative actual discharge-state water mass fraction, basis/evidence and compatible water density/temperature/source; obtain whole-fluid net mass by real weighing, never an assumed fraction. Both give unnormalized m3; inventory amount = actual_direct_releases_direct_water_quantity / A once. Missing boundary, occurrence, current-state composition or conversion evidence blocks completion, never zero or a supply residual. Actual non-H2O pollutants still require independent substance/medium/basis collection and elementary exchanges; listing water volume cannot delete them or make them diagnostic-only. Water volume and species masses are not directly added, and a whole-effluent identity cannot replace species. Contained_water sent to treatment is distinct from this environmental output; an H2O-to-air UUID cannot identify liquid water."
      inputs:
        - cp_water
        - water_output_activation_evidence
        - actual_technosphere_environment_boundary
        - water_source_origin
        - source_receiving_state
        - water_quantity_method
        - direct_water_only_volume_m3
        - discharged_mixture_net_mass_kg
        - actual_discharge_water_mass_fraction
        - water_fraction_basis
        - water_fraction_current_state_evidence
        - discharged_water_density_kg_per_m3
        - density_temperature_source
        - non_h2o_species_exchange_links
        - A
      output: "actual_direct_releases_direct_water_quantity; water_intensity"
      source_ids: []
