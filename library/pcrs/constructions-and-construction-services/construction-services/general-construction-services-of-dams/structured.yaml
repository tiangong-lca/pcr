      applies_to: "anchor_profiles_anchor; anchor_profiles_tension; anchor_fasteners_anchor; anchor_fasteners_drain_fitting; anchor_fasteners_repair_kit; anchor_fasteners_cleaning_item; anchor_fasteners_test_item; perimeter_seals_strip; perimeter_seals_gasket; drain_components_collector; drain_components_conduit; drain_components_outlet; additional_geonet_drainage; additional_geonet_antipuncture; repair_auxiliaries_repair; repair_auxiliaries_grout; repair_auxiliaries_seam; clean_test_supplies_preparation; clean_test_supplies_cleaner; clean_test_supplies_containment; clean_test_supplies_test; clean_test_supplies_packaging; shared_assets_access; shared_assets_pump; shared_assets_welder; shared_assets_test; native_area_supplies_containment; native_area_supplies_protection; native_area_supplies_test; return_area_liner_supply_liner_supply; return_area_additional_geonet_drainage; return_area_additional_geonet_antipuncture; return_area_native_area_supplies_containment; return_area_native_area_supplies_protection; return_area_native_area_supplies_test; return_length_anchor_profiles_anchor; return_length_anchor_profiles_tension; return_length_perimeter_seals_strip; return_length_perimeter_seals_gasket; return_length_drain_components_collector; return_length_drain_components_conduit; return_length_drain_components_outlet; return_count_anchor_fasteners_anchor; return_count_anchor_fasteners_drain_fitting; return_count_anchor_fasteners_repair_kit; return_count_anchor_fasteners_cleaning_item; return_count_anchor_fasteners_test_item; return_mass_repair_auxiliaries_repair; return_mass_repair_auxiliaries_grout; return_mass_repair_auxiliaries_seam; return_mass_clean_test_supplies_preparation; return_mass_clean_test_supplies_cleaner; return_mass_clean_test_supplies_containment; return_mass_clean_test_supplies_test; return_mass_clean_test_supplies_packaging; return_mass_fuel_supply_fuel_supply; return_volume_job_water_job_water; solid_waste_host; solid_waste_liner; solid_waste_seam; so