  classification_refs: "CPC 3.0 54233; narrower"
  covered_products: "Dry-installed exposed drained PVC geocomposite upstream-face rehabilitation on existing concrete dams"
  excluded_products: "New dams; submerged/flowing-water methods; embankment blankets; crack-only treatments; operating-reservoir service"
  representative_product: "Accepted pressure-qualified membrane/anchor/perimeter/drain system on an identified retained concrete face"
  production_route: "Approved dry access; substrate qualification and actual local preparation; drainage/anchors; sheet installation and field seams; tensioning/perimeter completion; testing, defect closure and signed handover"
  market_state: "Completed accepted rehabilitation service, not membrane supply alone or a new dam asset"
functional_unit:
  what: "Accepted upstream-face waterproofing rehabilitation on the declared retained concrete dam"
  how_much: "1 m2"
  how_well: "Actual approved retained-dam/substrate/head-compatible design; seam, anchor/tension, perimeter and drainage QA meeting project criteria; closed defects/retests and signed owner acceptance."
  how_long_or_cycle: "One identified rehabilitation job, from approved preparation through signed acceptance across all actual phases/reporting periods; no promised service life"
  reference_flow_link: "accepted_waterproofing"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers one completed rehabilitation service on a structurally qualified existing concrete dam: an exposed factory-bonded PVC/nonwoven geotextile barrier installed in dry accessible conditions, mechanically anchored and tensioned, with watertight perimeter and a continuous drained interface. The retained dam is the established parent state. The service independently restores its upstream surface waterproofing by integrating sheet, anchor, perimeter and drain components; these are one integrated responsibility and are not duplicate finishing and assembly inventories. Dry access requires actual owner-approved drawdown, shutdown and dewatering where necessary. It excludes a new dam, whole structural reconstruction, embankment blanket, crack-only repair and underwater or flowing-water mattress/zipper installation. No avoided dam manufacture, lost generation credit or guaranteed zero leakage is inferred. [carpi-dam-rehab; carpi-dry-execution; cazzuffi-geosynthetic-barriers]"
      source_ids:
        - carpi-dam-rehab
        - carpi-dry-execution
        - cazzuffi-geosynthetic-barriers
    - rule_id: b_route
      applies_to: "rehabilitate"
      rule: "Retain actual qualified concrete substrate and pressure/anchor design. Include actual preparation, local repair, separate cushion/drainage if engineered, field seams, tension, perimeter and drain continuity. Additional geonet is conditional; factory-bonded geotextile is already in the composite."
      source_ids:
        - carpi-dam-rehab
        - cazzuffi-geosynthetic-barriers
    - rule_id: b_gate
      applies_to: "accepted_waterproofing"
      rule: "Actual competent design verifies substrate, anchor pull-out/attachment and pressure-appropriate perimeter. Required actual seam, connection, anchor, perimeter and drain tests must meet approved criteria; repair and retest defects before signed owner handover. Include impoundment/leakage observation only as required by approved actual handover; no brochure guarantee or universal test list."
      source_ids:
        - carpi-dam-rehab
        - cazzuffi-geosynthetic-barriers
    - rule_id: b_resources
      applies_to: "rehabilitate"
      rule: "Own all incremental shutdown/drawdown/dewatering, access, containment, preparation, cleaning, welding, cure, tests, rework, cleanup and actual water fate through acceptance. Providers must disclose paid-for actual resources and coverage; unknown is not zero. Operations after handover are outside this service; no future energy or water saving credits."
      source_ids:
        - carpi-dry-execution
    - rule_id: b_period
      applies_to: "rehabilitate"
      rule: "Index preparation, installation, curing if actual, tests, rework, cleanup and acceptance across every reporting period. Reconcile opening and closing stocks and outstanding defects. Shared assets cover manufacture, maintenance, replacement and end-of-life across all consumers and periods, not this job alone."
      source_ids: []
