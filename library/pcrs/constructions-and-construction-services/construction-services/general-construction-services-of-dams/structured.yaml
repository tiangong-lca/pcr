      rule: "A = sum of unique accepted net developed surface areas; output = 1 m2. Duplicate geometry, seam laps and repeated work never add A."
      inputs:
        - survey_geometry
        - excluded_area
        - signed_handover
        - cp_acceptance
      output: "A; 1 m2"
      source_ids: []
    - id: c_supply
      applies_to: "liner_supply; anchor_profiles_anchor; anchor_profiles_tension; atomic_anchor_profiles; anchor_fasteners_anchor; anchor_fasteners_drain_fitting; anchor_fasteners_repair_kit; anchor_fasteners_cleaning_item; anchor_fasteners_test_item; atomic_anchor_fasteners; perimeter_seals_strip; perimeter_seals_gasket; atomic_perimeter_seals; drain_components_collector; drain_components_conduit; drain_components_outlet; atomic_drain_components; additional_geonet_drainage; additional_geonet_antipuncture; atomic_additional_geonet; repair_auxiliaries_repair; repair_auxiliaries_grout; repair_auxiliaries_seam; atomic_repair_auxiliaries; clean_test_supplies_preparation; clean_test_supplies_cleaner; clean_test_supplies_containment; clean_test_supplies_test; clean_test_supplies_packaging; atomic_clean_test_supplies; fuel_supply; native_area_supplies_containment; native_area_supplies_protection; native_area_supplies_test; atomic_native_area_supplies; atomic_native_length_supplies; repair_auxiliaries_repair; repair_auxiliaries_grout; repair_auxiliaries_seam; atomic_repair_auxiliaries; clean_test_supplies_preparation; clean_test_supplies_cleaner; clean_test_supplies_containment; clean_test_supplies_test; clean_test_supplies_packaging; atomic_clean_test_supplies; fuel_supply"
      rule: "S = opening_stock + gross_receipts - tare - closing_stock; retain S in its actual compatible unit; inventory amount = attributable S / A. Match each physical final outlet once; usable return treatment follows a_stock."
      inputs:
        - opening_stock
        - gross_receipts
        - tare
        - closing_stock
        - outward_usable_return
        - cp_material
        - cp_fuel
        - A
      output: "attributable supplied quantity per reference flow"
      source_ids: []
    - id: c_burn
      applies_to: "fuel_supply"
      rule: "Use actual measured burned_quantity, or derive burned_quantity = opening_stock + gross_receipts - tare - closing_stock - outward_usable_return - nonburned_waste - uncontained_loss only from a complete audited native-unit fate balance. Retain uncertainty and investigate unknown loss; an unexplained residual is not combustion. Close every balance separately for each actual fuel SKU/state in one identical native unit; m3 is not kg. Only an independently required mass-based emission-factor/activity view uses measured density/unit/state/temperature/source, and it is nonadditive to native supply/return. Upstream fuel inventory uses S, not burned_quantity. Recovered retained spill is in closing_stock; total_spill_audit is nonadditive."
      inputs:
        - cp_fuel
        - fuel_sku
        - "disjoint final fates"
      output: "measured or audited native-unit combustion activity"
      source_ids: []
