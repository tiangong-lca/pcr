      source_ids: []
    - id: c_assets
      applies_to: "shared_assets_access; shared_assets_pump; shared_assets_welder; shared_assets_test; atomic_shared_assets"
      rule: "life burden = manufacture_burden + maintenance_burden + replacement_burden + end_of_life_burden; job share = job_driver / whole_life_driver. For the actual compatible hour driver only, complete-life burden per h = life burden / whole_life_driver; inventory service hours = job_driver / A; inventory service hours times complete-life burden per h = life burden times job_driver / whole_life_driver / A. Use that complete-life service once; never add an asset-share purchase to the same hour service. For another actual native driver use its verified compatible unit and equivalent full-life relation."
      inputs:
        - cp_assets
        - job_driver
        - whole_life_driver
        - A
      output: "compatible service driver and burden per reference flow"
      source_ids: []
    - id: c_release
      applies_to: "atomic_direct_releases"
      rule: "emitted mass = measured release or valid actual activity times applicable species/medium factor or evidenced composition-fate mass; inventory amount = emitted mass / A. Retain capture/stock/returns/waste outside release and never add whole-fluid and species views. A complete activity-to-species emission factor already includes its declared composition/fate; do not multiply those again unless the factor definition explicitly requires it."
