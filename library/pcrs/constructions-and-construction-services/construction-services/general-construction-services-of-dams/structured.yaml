    - id: single_fuel_and_formulation_units
      applies_to: "fuel_supply; repair_auxiliaries_repair; repair_auxiliaries_grout; repair_auxiliaries_seam; clean_test_supplies_preparation; clean_test_supplies_cleaner; clean_test_supplies_containment; clean_test_supplies_test; clean_test_supplies_packaging; return_mass_repair_auxiliaries_repair; return_mass_repair_auxiliaries_grout; return_mass_repair_auxiliaries_seam; return_mass_clean_test_supplies_preparation; return_mass_clean_test_supplies_cleaner; return_mass_clean_test_supplies_containment; return_mass_clean_test_supplies_test; return_mass_clean_test_supplies_packaging; return_mass_fuel_supply_fuel_supply; atomic_return_mass; return_volume_job_water_job_water"
      requirement: "Each actual fuel SKU/state has one Mass/kg supply exchange. All original fuel_volume_supply records and cp_fuel volume/unit/stock/density/state/temperature observations remain auxiliary measurements and native physical closure, never another supply or usable-return view. Net weigh fuel, or convert actual volume with evidenced same-SKU/state density, volume unit and temperature (and pressure basis for gas); missing evidence blocks completion. Compatible repair/cleaning formulations likewise use only their selected Mass/kg children; original native_volume_supplies and cp_material volume observations remain auxiliary conversions of those same physical products. Complete Count kits and separately supplied formulation/components remain exclusive purchases."
      evidence: "cp_fuel; cp_material; actual_child_register; same_identity_conversion_evidence"
    - id: atomic_compatible_native_stock
      applies_to: "all material and fuel child exchanges"
      requirement: "Use opening + net external receipts - intact unused closing in each child unique exchange unit. Direct count/length/area/volume net_receipts already use that native unit; never subtract kg tare. Only an actual weighing route first calculates gross_mass_kg-tare_mass_kg, then converts if needed using evidenced actual same-SKU/state operands into the unique exchange unit, with no second tare deduction. Original formulation/fuel native volumes remain auxiliary observations, converted with evidenced density/conditions before entering the kg stock group; unlike units are never added. Original a_stock gross-with-outlets or compatible consumed-only convention, once-only usable-return treatment and nonreturned-loss responsibility remain unchanged."
      evidence: "cp_material; cp_fuel; receipt_basis; native_unit; gross_mass_kg; tare_mass_kg; net_receipts; density; density_unit; state; temperature; conversion_source; pressure_basis"
