  calculation_rules:
    - id: reference_attribution
      applies_to: "all inventory rows"
      rule: "Record actual attributable exchange quantity per reference flow. For a pooled job retain accepted branch identifiers and a causal allocation supported by actual configuration/activity; do not divide blindly among unequal circuits."
      inputs:
        - "actual exchanges"
        - "unique accepted branch register"
        - cp_assembly_gate
        - cp_test_gate
        - "allocation evidence"
      output: "exchange quantity per qualified reference circuit"
      source_ids:
        - omegaflex-tracpipe-2026
    - id: material_reconciliation
      applies_to: "material and residual rows"
      rule: "Reconcile opening stock plus gross receipts against installed material, outward returns, dispatched waste, actual consumed/released quantity and retained stock; investigate residual against measurement uncertainty. Do not add internal transfers to external receipts."
      inputs:
        - cp_assembly_materials
        - cp_test_materials
      output: "audited material disposition and carried-forward burden"
      source_ids:
        - omegaflex-tracpipe-2026
    - id: test_medium_balance
      applies_to: "actual exchanges required by refine_test_medium; ambient_air_intake; actual exchanges required by refine_test_usable_returns; actual exchanges required by refine_test_releases"
      rule: "Use traceable actual meter mass or justified conditions/composition conversion; reconcile medium input/intake with retained, recovered, waste-custody and substance-specific environmental disposition for every cycle. Retain absolute pressure and actual state evidence, not a universal ideal-gas factor."
      inputs:
        - cp_test_materials
        - "actual authorized medium and conversion method"
      output: "actual medium mass and disposition by substance/compartment"
      source_ids:
        - omegaflex-tracpipe-2026
  data_quality_requirements:
    - id: identity_configuration
      applies_to: "all rows"
      requirement: "Declare actual material/service identity, supplier/state and units; actual test medium and release species/compartments; resolve concrete UUID and support before final process exchanges."
      evidence: "Part records, provider scopes, composition and verified detail/support rows"
    - id: full_cycle
      applies_to: "all processes"
      requirement: "Include all initial installation, failed tests, corrections/retests, cleanup, logistics and reusable provision/removal responsibilities; unfinished work is explicitly reconciled."
      evidence: "Dated task/defect/custody log and complete consumer totals"
    - id: measurement_uncertainty
      applies_to: "all rows"
      requirement: "Report calibration/resolution, sampling, supplier mass variability, stock/balance residual, allocated shares and state conversion uncertainty. Missing evidence is a gap, not a numerical zero or arbitrary range."
      evidence: "Meter/scale certificates, bills, physical balances and documented uncertainty"
    - id: version_jurisdiction
      applies_to: "rough_in gate"
      requirement: "Use actual current applicable system/fitting instructions and qualified approved jurisdiction design; July2026 guide examples do not establish universal pressure, duration, spacing or capacity."
      evidence: "Dated guide/revision, approved plans, qualification, actual protocol/inspection and bonding record"
    - id: refine_compatible_fittings
      applies_to: "compatible_fittings_fitting; compatible_fittings_transition; compatible_fittings_termination_mount; compatible_fittings_end_cap"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Declare zero, one or multiple actual fittings, transitions, termination mounts and caps individually by part number and connection role. Temporary debris closures and pressure-test caps have explicit provision and removal ownership; do not charge a reusable cap as permanently consumed. Range evidence need: Require actual bill of materials, fitting family, mass per part and returned quantities; no universal fitting count, mass or torque is an inventory default. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual other part numbers/functions and reusable temporary debris/test caps require exact supply/complete-life/native-unit/period/removal ownership; no whole cap consumed every attempt."
      evidence: "cp_assembly_materials; actual independent records and identity/unit evidence"
    - id: refine_support_protection
      applies_to: "support_protection_support; support_protection_strike_plate; support_protection_sleeve; support_protection_conduit"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record size-compatible supports, listed strike plates, sleeves or conduit where the actual route and approved instructions require them. Structural members providing support are disclosed as host conditions; new branch-attributable alterations and protection are included. Range evidence need: Actual route geometry, threatened locations, support type and applicable fitting/system instructions establish quantities; no generic spacing or protection length is imposed. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Different actual route/design-required SKUs and uncovered host alterations require actual own records; existing host structural support not new supplied material."
      evidence: "cp_assembly_materials; actual independent records and identity/unit evidence"
    - id: refine_bonding_materials
      applies_to: "bonding_materials_clamp; bonding_materials_conductor; bonding_materials_connector"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional actual clamps, conductors and connectors required at the branch bonding interface. A qualified assessment records existing verified interface coverage or new work and provider ownership. Arc-resistant jacketing is not a blanket exemption from bonding. Range evidence need: Obtain actual jurisdiction/system requirements, qualified bonding record, conductor and clamp identities/lengths/masses; no universal conductor quantity or exemption. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual other bonding work/SKUs and provider ownership require qualified existing/new-interface assessment; arc-resistant jacket no blanket bonding exemption."
      evidence: "cp_assembly_materials; actual independent records and identity/unit evidence"
    - id: refine_assembly_consumables
      applies_to: "assembly_consumables_thread_sealant; assembly_consumables_jacket_repair_tape; assembly_consumables_cutter_blade; assembly_consumables_cutter_wheel"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional actual pipe-thread sealant, approved jacket repair tape, cutter blade/wheel wear, cleaning and protective consumables are separated by composition and purpose. Follow the chosen fitting instructions: sealant for a pipe-thread connection does not imply sealant on its CSST sealing seat. Gross issue is the input convention for consumables also: a real usable return is recorded once in usable_returns_csst, and retained stock is only the carried-forward balance. Range evidence need: Collect exact fitting-specific procedure, formulation receipts/use or measured wear, actual repair incidence and retained stock; no assumed sealant dose or loss fraction. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual cleaning/protection or other formulations/products require exact identity/quantity; retain gross-issue and real usable-return convention once, closing stock not output."
      evidence: "cp_assembly_materials; actual independent records and identity/unit evidence"
    - id: refine_assembly_provision
      applies_to: "assembly_provision_cutting; assembly_provision_access; assembly_provision_delivery; assembly_provision_crew_transport"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Actual documented service packages provide cutting/hand tools, shared access, delivery and worker/material transport. Each package declares its actual physical drivers, consumers, service period, capital provision, maintenance and termination/removal coverage. Separate uncovered tool production or transport legs; do not convert kilometres or tool-hours into an invented item equivalence. Range evidence need: Require provider bill/scope, asset service life and complete job/consumer log, actual loaded/empty legs and masses/distances or activity evidence; no default lifetime or freight factor. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual hand-tool/material-transport functions, actual provider configurations or h/km/person*km/t*km references require exact unique native property/unit, not counted-event conversion. A genuine complete provider package contains its included functions/resources once; component delivery and material freight for same physical event not both charged. Retain all consumers/period/capital/maintenance/termination coverage."
      evidence: "cp_assembly_resources; actual independent records and identity/unit evidence"
    - id: refine_usable_returns
      applies_to: "usable_returns_csst"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Only physical usable tubing/components returned to a supplier or other declared custodian cross this output boundary. Retained closing stock is a balance with carried-forward burden, not an outward product exchange. This includes real usable consumable returns from gross issues, not only piping components. Range evidence need: Need return receipts and actual composition, condition, mass and custody; no assumed resale, recovered-product substitution or return rate. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual fittings/support/bonding/consumable returns require exact original SKU/state/recipient/native property/unit and gross-issue burden bridge; no second deduction or fabricated recovery."
      evidence: "cp_assembly_materials; actual independent records and identity/unit evidence"
    - id: refine_assembly_waste
      applies_to: "assembly_waste_csst"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Separate CSST composite offcuts, removed defects, spent consumables and supplier packaging by real composition, waste status and receiving contractor. Reworked components remain within branch_assembly; offsite treatment is outside the installation handoff unless explicitly included once. Range evidence need: Require measured or documented masses, actual segregation, custody and treatment coverage; no generic scrap rate or recycling credit. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual other removed fittings, spent consumables and packaging material/hazard/receiver identities require independent actual roster; reworked components internal and offsite treatment included only once where expressly owned."
      evidence: "cp_assembly_materials; actual independent records and identity/unit evidence"
    - id: refine_assembly_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional individual substances and receiving media are required only for actual measured or defensibly modelled direct releases. Do not classify solid offcuts as emissions or infer methane from the natural-gas design designation of a pre-gas isolated branch. Range evidence need: Identify actual substance/species, medium, method detection limit and uncertainty before quantification/binding; no generic VOC, dust or methane default. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_assembly_resources; actual independent records and identity/unit evidence"
    - id: refine_test_medium
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional externally supplied authorized pressure-test medium enters as a product at the actual supplier gate. Record actual composition and cylinder/compressor service coverage. When compression occurs onsite from ambient air, use ambient_air_intake instead of this product input for the same medium, with compressor provision/energy once. Do not assume which authorized medium is used. Range evidence need: Need approved test protocol, isolated volume, absolute pressure, temperature, composition and real-gas/conversion method or meter evidence; no universal pressure, duration or gas mass. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual supplied gas/medium identity and unique unit, cylinder/compressor coverage; onsite ambient-air compression uses actual intake instead of same supplied-medium product, no assumed nitrogen/air or methane."
      evidence: "cp_test_materials; actual independent records and identity/unit evidence"
    - id: refine_leak_solution
      applies_to: "leak_solution_purchased_formulation"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record the actual compatible leak-check formulation at its purchased or prepared concentration. Distinguish purchased diluted product from separately mixed water/stock; count each preparation ingredient once. Range evidence need: Require supplier composition/concentration and gross issue/stock records or weighed use; guide recommendation establishes compatibility, not kg per test. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual onsite preparation water and stock formulations require separate receipt/recipe/quantity/native-unit identities; actual water identical to rinse supply may be aggregated once by same SKU with independent duty records, never duplicated. Preserve as-prepared concentration and each ingredient once."
      evidence: "cp_test_materials; actual independent records and identity/unit evidence"
    - id: refine_test_usable_returns
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional real outward transfer of reusable medium or usable solution/material to a named custodian is a product return with quantity, quality and carried burden declared. Provider-internal cylinder residual covered within the supplied service is not another outward exchange; retained onsite stock is a balance, not output. No avoided production or invented recovered co-product credit. Range evidence need: Need actual signed return/custody receipts, condition/composition, mass and supplied-service coverage; no assumed return percentage or product credit. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual outward usable medium/formulation/SKU/native quantity/quality/custodian and carried-burden bridge; provider-internal cylinder residual and retained stock not outputs, no recovery credit."
      evidence: "cp_test_materials; actual independent records and identity/unit evidence"
    - id: refine_test_waste
      applies_to: "test_waste_washwater; test_waste_loose_leak_residue; test_waste_wipe"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Actual collected rinse/washwater, leak-check residue, wipes and rejected test consumables leave for named waste custody. Separate wastewater sent to treatment from direct environmental releases, and permanent installed stock from waste. Range evidence need: Need collection/weighing or wastewater volume/density and composition records with receiver evidence; no default washwater composition or discharge fate. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other rejected test consumables, different chemistry/hazard/receiver states require exact independent identities; installed stock not waste, captured carrier includes contents once."
      evidence: "cp_test_materials; actual independent records and identity/unit evidence"
    - id: refine_test_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Declare actual released test-medium substances and receiving compartments or retained/recovered medium after depressurization. Supplied compressed medium is paired with its real disposition; never use generic gas labels or assume fuel-gas methane in this pre-gas boundary. Range evidence need: Require actual medium composition, vent/receiver route, residual/recovered quantities, conditions and uncertainty; compressed ambient-air intake/discharge requires an explicit elementary-flow convention, not an invented supplied-gas identity. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_test_materials; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
