      raw_fields: "branch_id; task_id; asset_id; service_scope; consumer_id; service_period; provision_period; use_period; upkeep_period; replacement_event; terminal_period; phase_owner; phase_burden; attribution_decision; use_time; life_activity; maintenance; removal_owner; meter_start; meter_end; supplier; load; distance; empty_leg; substance; medium; released_mass; uncertainty; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id"
      collection_method: "Measure job electricity and physical service use; retain complete all-consumer and period totals; link manufacture/provision, use/upkeep, replacement and termination to actual periods and responsible owners; allocate causal share to branch_assembly without double counting test or supplier coverage; collect actual release method and medium. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
