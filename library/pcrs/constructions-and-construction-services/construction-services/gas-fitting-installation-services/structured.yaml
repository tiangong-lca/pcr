product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.gas-fitting-installation-services"
  classification_refs: "cpc:3.0:54640; proposed narrower boundary"
  covered_products: "First indoor mechanically fitted black arc-resistant CSST natural-gas branch rough-in installation, isolated and capped at handover"
  excluded_products: "Live gas/purge/appliance commissioning; external/underground network; LPG/medical gas; yellow-jacket mixed systems; heating or ventilation installation; regulator commissioning"
  representative_product: "One declared complete branch from specified upstream isolation boundary to specified capped outlet, using actual TracPipe AP or equivalent evidenced compatible AR system"
  production_route: "Accepted design/host; route/cut; mechanically fit; support/protect; complete applicable bonding interface; isolate/cap; pressure-test and inspect; correct/retest; hand over"
  market_state: "Signed accepted rough-in installation service before concealment; no operating appliance or ready-to-use gas service claim"
functional_unit:
  what: "Accepted isolated pressure-tested indoor natural-gas CSST branch rough-in installation service"
  how_much: "1 complete declared circuit; 1 Item(s)"
  how_well: "Actual approved design/gas/pressure/capacity; compatible system and fitting revision; undamaged supported protected installation; verified applicable bonding; accepted authorized pressure test/rough-in inspection with outlets capped and fuel gas absent"
  how_long_or_cycle: "One initial installation and all corrections/retests through signed rough-in handover. Reusable provision is separately linked to its manufacture/provision, use/upkeep, replacement and termination periods; no building operating lifetime or later gas commissioning"
  reference_flow_link: "accepted_branch"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers first indoor rough-in installation of one actual designed natural-gas branch using black arc-resistant jacketed CSST and its compatible manufacturer mechanical fittings. It ends at isolated capped, pressure-tested and inspected handover before concealment. The route is routing/cutting/end preparation, mechanical assembly, supports/strike protection, applicable bonding interface, testing, correction/retest and signed transfer. Manufacturer-specific numerical design and test instructions are selected for the actual configuration and jurisdiction, not generalized here. [omegaflex-tracpipe-2026] Exclude live fuel-gas introduction, purging, appliance connection/combustion/commissioning, line-pressure regulator commissioning, external distribution, underground/direct-burial work, yellow-jacket intermix, LPG, medical gases and heating/ventilation equipment installation. The accepted starting host and authorized design are prerequisites; new branch-attributable alterations, protection and bonding work cannot disappear behind those prerequisites. UN CPC 54640 covers gas-conducting installations; the proposed category is narrower and does not claim whole-leaf coverage. [un-cpc3-2025]"
      source_ids:
        - un-cpc3-2025
        - omegaflex-tracpipe-2026
    - rule_id: rough_in_gate
      applies_to: "all processes"
      rule: "End only after authorized accessible rough-in inspection and pressure test, applicable verified bonding and protection, closed defects, capped isolation and signed custody. No fuel gas, purge or appliance connection is credited."
      source_ids:
        - omegaflex-tracpipe-2026
    - rule_id: complete_provision
      applies_to: "all processes"
      rule: "Include actual component manufacture/supply, embedded cutting/fitting losses, protection/bonding work, correction/retest, consumables, water, energy, logistics and bounded reusable asset production/maintenance/termination coverage once. Record provider-included packaging/services and uncovered shares."
      source_ids:
        - omegaflex-tracpipe-2026
    - rule_id: shared_scope
      applies_to: "all processes"
      rule: "Link shared access and tools to branch_assembly and rough_in_test consumers and service periods; gauges/compressor may also serve later jobs. Document complete service/capital-cycle coverage and removal owner. Do not invent lifetime operation or reuse counts."
      source_ids:
        - omegaflex-tracpipe-2026
    - rule_id: medium_convention
      applies_to: "rough_in_test"
      rule: "Actual authorized medium and supply convention are mandatory: ambient_air_intake is a conditional elementary input for onsite compression; actual exchanges required by refine_test_medium is conditional external product supply. Never count the same medium under both conventions. Pair either input with actual release, retained/recovered stock, waste or real product-return custody; compressor provision/energy counted once."
      source_ids:
        - omegaflex-tracpipe-2026
    - rule_id: asset_periods
      applies_to: "assembly_provision_cutting; assembly_provision_access; assembly_provision_delivery; assembly_provision_crew_transport; test_provision"
      rule: "Separately index actual asset manufacture/provision, job use/upkeep, later service jobs/periods, replacement and termination/removal. Link branch_assembly and rough_in_test activity and the accepted output to its initial job period. Declare each phase owner and allocated burden; unknown replacement/terminal coverage blocks final dataset completion."
      source_ids:
        - omegaflex-tracpipe-2026
boundary_abstraction:
  declared_starting_condition: "Approved actual indoor route/design and accepted host; upstream source isolated from fuel gas, downstream appliances absent/disconnected; supplied compatible system components at declared supply gates"
  starting_condition_role: "Host/design/isolation prerequisites with documented ownership; unchanged building stock excluded, new installation-attributable modification included"
  product_classification_scope: "Gas-conducting branch rough-in service within CPC54640; excludes heating/ventilation and later operational work"
  recursive_input_rule: "Do not recurse into the same installation service for internal branch handoffs or corrections. Purchased subcontract work has declared scope and one upstream burden owner."
  upstream_dataset_requirement: "Actual finished jacketed CSST, fittings, support/protection/bonding and consumables with supplier manufacturing/packaging coverage; actual tool/test/transport provision and electricity; unresolved identities resolved before final exchange production"
  disclosure: "Actual design, host, route, supplied states, material custody, test and bonding scope, provider exclusions, shared assets/periods and remaining commissioning responsibilities"
