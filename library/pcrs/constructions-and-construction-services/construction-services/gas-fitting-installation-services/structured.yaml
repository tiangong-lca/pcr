      raw_fields: "branch_id; part_id; system_revision; diameter; gross_receipt; opening_stock; issued_length; composite_mass; installed_mass; return_mass; waste_mass; closing_stock; receiver; provider_coverage; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Trace actual approved bill of materials and batch/supplier masses; calibrate weighing; pair gross issues with installation/offcuts/returns/retained stock. Normalize actual gross lot-attributable inputs and separately record real outward usable returns and retained-stock carried-forward burden. Consumption is a disposition, never a second net-input convention. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg; m; Item(s)"
      frequency: "Each issue, installation, correction and outward transfer"
      temporal_coverage: "Initial receipt through final branch handover including corrections"
      site_scope: "Actual branch site, supplier and receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Bills, calibrated scales or traceable part masses; composition and custody; separate packaging coverage; balance residual and uncertainty"
    - protocol_id: cp_assembly_resources
      process_id: "branch_assembly"
      flow_role: "Shared tools/access/logistics, energy and characterized releases"
