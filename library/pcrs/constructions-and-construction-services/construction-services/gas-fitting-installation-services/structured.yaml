    - protocol_id: cp_test_materials
      process_id: "rough_in_test"
      flow_role: "Medium, leak solution, rinse water, wastes and releases"
      record_type: "Test material/custody and physical balance log"
      raw_fields: "branch_id; cycle_id; medium_identity; composition; source_gate; isolated_volume; volume_unit; absolute_pressure; pressure_unit; temperature; temperature_unit; meter; delivered_mass; solution_id; concentration; rinse_mass; residual_mass; recovered_mass; waste_mass; substance; receiving_medium; receiver; outward_product_return; provider_internal_residual; retained_stock; intake_convention; uncertainty; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id"
      collection_method: "Meter or validate actual medium mass from documented conditions and composition; retain all cycles, leaks/corrections and disposition; measure solution/rinse and actual residues; distinguish supplied versus ambient_air_intake elementary input versus actual exchanges required by refine_test_medium external product input; pair real outward actual exchanges required by refine_test_usable_returns and retained stock/provider-internal residual separately from environmental and waste custody; normalize complete attributable cycle quantities to this accepted reference branch. Retain the actual protocol volume, absolute-pressure and temperature units with each measured value and every state conversion; document gauge-to-absolute and temperature-scale conversion when applicable. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
