allocation_rules:
  - rule_id: one_service_output
    applies_to: "all processes"
    rule: "One intended service output only; offcuts, usable returns and waste are not assumed co-products. Retain all correction/retest burdens with the eventual accepted branch; unresolved failures remain unfinished/rejected, not accepted. No avoided steel/gas production, recycling or operating savings credit."
    source_ids:
      - omegaflex-tracpipe-2026
  - rule_id: shared_attribution
    applies_to: "assembly_provision_cutting; assembly_provision_access; assembly_provision_delivery; assembly_provision_crew_transport; test_provision; electricity"
    rule: "Use actual asset/service scope and complete consumer/activity logs to attribute burdens by causal time/use, transport activity or directly metered electricity for the declared service period. Reconcile allocated shares to the source total across both nodes and other jobs; apply once, never add a second component burden already included in a provider package."
    source_ids:
      - omegaflex-tracpipe-2026
  - rule_id: custody_balance
    applies_to: "material and residual rows"
    rule: "Reconcile opening stock plus gross receipts with installed stock, actual outward usable returns, dispatched waste, measured consumption/releases and retained closing stock. Closing stock carries declared burden forward and is not an outward exchange. Never net a return then count it again. Document treatment and reusable cap/cylinder custody without invented recovery credits."
    source_ids:
      - omegaflex-tracpipe-2026
  - rule_id: period_attribution
    applies_to: "assembly_provision_cutting; assembly_provision_access; assembly_provision_delivery; assembly_provision_crew_transport; test_provision"
    rule: "For each actual asset identify provision/manufacture period, each use/upkeep period and consumer, replacement event and termination/removal duty. Assign production and terminal shares with actual complete service-life/use evidence, separately charge job use and upkeep, and reconcile all periods/consumers to source totals. Record provider-covered phases; do not charge full production again on each job, shift an unowned terminal duty out of the ledger or double count a replacement. The accepted first branch cycle remains the product denominator; no universal lifetime or annualization."
    source_ids:
      - omegaflex-tracpipe-2026
