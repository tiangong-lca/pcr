validation_rules:
  - rule_id: accepted_gate
    applies_to: "accepted_branch"
    rule: "Reject accepted credit unless the complete declared branch is isolated/capped and pre-gas, compatible and undamaged, supported/protected, applicable bonding verified, authorized test and accessible inspection passed, defects/retests closed and signed handover recorded."
    source_ids:
      - omegaflex-tracpipe-2026
