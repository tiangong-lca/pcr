allocation_rules:
  - rule_id: retain_corrections
    applies_to: "bench_install"
    rule: "Keep all installation attempts, drilling/clearing, failed anchors and minor repair burdens associated with the accepted job; exclude unresolved rejects from accepted counts. Internal correction is a loop within bench_install, not a second successful product. Trace usable supplier returns, stock and discard separately; no assumed recovery or avoided-production credits."
    source_ids: []
  - rule_id: shared_attribution
    applies_to: "shared resources"
    rule: "Allocate metered or provider-documented resource burdens with actual causal service time/load evidence over the complete asset consumer ledger and stated period; enumerate this job and other consumer nodes/jobs/periods. Disclose chosen driver and unallocated balance. If driver evidence is absent keep attribution incomplete; no default equal share or invented asset lifetime."
    source_ids: []
  - rule_id: coverage_overlap
    applies_to: "materials and service boundaries"
    rule: "Use one owner for each physical event and each upstream burden. A gross receipt with explicit outward return must not also subtract that return from purchases. Opening/closing stock reconciliation is separate from crossed-boundary returns. Split provider-included electricity/fuel/air/equipment/transport from separately metered exchanges; never add both."
    source_ids: []
  - rule_id: no_coproduct_default
    applies_to: "outgoing usable products"
    rule: "Usable glides/packaging/hardware and supplier-returned benches are documented custody exits, not automatically economic co-products. Retain job burdens without substitution credit; any actual multi-output attribution requires separately evidenced review."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "bench_install"
      flow_role: "Bench hardware shims packaging receipts and use"
      record_type: "Receipt and material ledger"
      raw_fields: "job_id; model; serial_lot; sku; actual_configuration; supply_gate; received_count; measured_mass; unit_mass_basis; opening_stock; closing_stock; installed; damaged; return_id; upstream_coverage; flow_row_id; supplier_package_id; supplied_component_membership; supplier_included_component_ids; material_state; same_SKU_mass_evidence; native_record_unit; original_hardware_total_audit_ref; flow_row_id; actual_child_id; family_role; identity_evidence; material_or_service_state; property_name; exchange_unit; independent_quantity; quantity_basis; conversion_evidence; owner_id; source_lot; recipient_or_medium; coverage_evidence; activation_evidence; absence_evidence; uncertainty; reconciliation_status; range_evidence"
      collection_method: "Record gross job-boundary hardware/shim receipts/issues, then reconcile installed, wasted, actual outward returns and closing stock separately without netting the same return from the input. Use calibrated weighing or supplier SKU masses. Packaging already included upstream stays in the custody/exit ledger without a second supply exchange; keep actual mass. Record glides removed from bench without inventing a separate new glide input. Normalize attributable job totals by accepted complete installation count; reconcile failed attempts. For mechanical_sleeve_anchors and stainless_anchor_washers, each physical line has one flow_row_id, SKU/state, supplier package and independently measured or traceable kg quantity. Retain actual count as an auxiliary observation only, converting it to kg solely with the same-SKU mass evidence when required. Record package/BOM membership so a factory-included washer is not purchased again; levelling_shim / levelling_washer retain separate levelling-use evidence. The previous combined hardware quantity is audit-only and never a second exchange or a quantity copied into each child. Maintain the actual child register for this node and protocol. Each line identifies one independent product/service/dispatch/substance, one explicit property/unit, independent raw quantity and conversion, actual state/gate/medium, owner, time and evidence. Retain all original material/activity/exit categories and conditional absence checks. Former family totals are nonexchange audit observations only; never copy them to each child or sum heterogeneous units as an exchange. No normal default quantity or occurrence is created by a conditional card."
      unit: "Item(s); kg"
      frequency: "Each receipt/use/stock change"
      temporal_coverage: "Entire first-installation job including corrections"
      site_scope: "Actual job and supplier gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Traceable invoices, scale checks, SKU weights, stock/transfer records and configuration match"
    - protocol_id: cp_resources
      process_id: "bench_install"
      flow_role: "Electricity compressed air shared assets and services"
      record_type: "Meters and service ledger"
      raw_fields: "job_id; asset_id; provider; meter_start; meter_end; native_unit; operating_hours; idle_hours; air_delivery; pressure; service_period; consumer_id; consumer_driver; total_driver; included_energy; maintenance_coverage; flow_row_id; actual_child_id; family_role; identity_evidence; material_or_service_state; property_name; exchange_unit; independent_quantity; quantity_basis; conversion_evidence; owner_id; source_lot; recipient_or_medium; coverage_evidence; activation_evidence; absence_evidence; uncertainty; reconciliation_status; range_evidence"
      collection_method: "Meter direct use; record compressor cleaning and actual lifting/tool sessions. Enumerate every consumer and period in each shared ledger; document causal driver and reconciliation to total burden. Preserve actual air delivery and provider units. Include electricity once according to service coverage; divide job-attributable totals by accepted count. Maintain the actual child register for this node and protocol. Each line identifies one independent product/service/dispatch/substance, one explicit property/unit, independent raw quantity and conversion, actual state/gate/medium, owner, time and evidence. Retain all original material/activity/exit categories and conditional absence checks. Former family totals are nonexchange audit observations only; never copy them to each child or sum heterogeneous units as an exchange. No normal default quantity or occurrence is created by a conditional card."
      unit: "kWh; h; actual provider units"
      frequency: "Every task/session and shared period close"
      temporal_coverage: "Full job and complete relevant shared-service periods"
      site_scope: "Actual site/job plus every external consumer of shared assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, compressor/provider records, task logs, all-consumer ledger and overlap/driver evidence"
    - protocol_id: cp_logistics
      process_id: "bench_install"
      flow_role: "Material return and waste freight"
      record_type: "Route and cargo records"
      raw_fields: "job_id; leg_id; carrier; vehicle; origin; destination; loaded_distance; actual_cargo_mass; load_share; empty_leg; transfer_id; upstream_transport_coverage; flow_row_id; actual_child_id; family_role; identity_evidence; material_or_service_state; property_name; exchange_unit; independent_quantity; quantity_basis; conversion_evidence; owner_id; source_lot; recipient_or_medium; coverage_evidence; activation_evidence; absence_evidence; uncertainty; reconciliation_status; range_evidence"
      collection_method: "Use shipment/transfer records and evidenced routes/cargo masses; attribute shared/empty legs with actual logistics evidence, state overlap with supplied datasets and reconcile outbound recipient. Normalize attributable service by accepted count. Maintain the actual child register for this node and protocol. Each line identifies one independent product/service/dispatch/substance, one explicit property/unit, independent raw quantity and conversion, actual state/gate/medium, owner, time and evidence. Retain all original material/activity/exit categories and conditional absence checks. Former family totals are nonexchange audit observations only; never copy them to each child or sum heterogeneous units as an exchange. No normal default quantity or occurrence is created by a conditional card."
      unit: "t*km; kg; km"
      frequency: "Every actual leg"
      temporal_coverage: "Receipt to handover and attributed return/waste legs"
      site_scope: "Actual routes serving job"
      aggregation_rule: "per reference flow"
      quality_evidence: "Carrier documents, route evidence, cargo weighings, load ledger and dataset-boundary comparison"
    - protocol_id: cp_repairs
      process_id: "bench_install"
      flow_role: "Conditional minor finish repair"
      record_type: "Damage repair log"
      raw_fields: "job_id; damage_id; area; approved_product; formulation; used_mass; solids; solvent_species; curing; method; waste_id; approval; closure"
      collection_method: "Document actual mechanical damage, approved minor repair and measured product consumption. Link to release/residue evidence and signed closure; no repair becomes a normal painting route. Divide job totals by accepted count; major work triggers boundary review."
      unit: "kg; actual repair units"
      frequency: "Every actual repair or documented absence"
      temporal_coverage: "Full job before acceptance"
      site_scope: "Actual damaged bench and repair supplier"
      aggregation_rule: "per reference flow"
      quality_evidence: "Approved product data/composition, measured use, photographs and signed repair closure"
    - protocol_id: cp_acceptance
      process_id: "bench_install"
      flow_role: "Accepted reference output"
      record_type: "Inspection and handover"
      raw_fields: "job_id; bench_serial; model; length; material; finish; support; arms; anchor_sku; fixing_count; current_instructions; slab_evidence; level; fastener_check; defects; correction_closure; accepted_count; signoff_date"
      collection_method: "Inspect actual slab/anchor compatibility before drilling and finished installed bench after all corrections. Reconcile every required fixing, levelling and support/finish condition with current instructions and signed handover. Count only complete accepted installations; denominator excludes unresolved rejects."
      unit: "Item(s)"
      frequency: "Each acceptance and correction close"
      temporal_coverage: "First-installation job through signed handover"
      site_scope: "Actual installed bench and host interface"
      aggregation_rule: "per reference flow"
      quality_evidence: "Design/current instructions, slab records, pre/post inspections and signed client acceptance"
    - protocol_id: cp_fates
      process_id: "bench_install"
      flow_role: "Bench returns usable glides packaging hardware and discard"
      record_type: "Custody stock and waste ledger"
      raw_fields: "job_id; transfer_id; source_receipt; material; condition; count; measured_mass; fate; recipient; receipt_ack; opening_stock; closing_stock; reject_cause; treatment; hazard; flow_row_id; actual_child_id; family_role; identity_evidence; material_or_service_state; property_name; exchange_unit; independent_quantity; quantity_basis; conversion_evidence; owner_id; source_lot; recipient_or_medium; coverage_evidence; activation_evidence; absence_evidence; uncertainty; reconciliation_status; range_evidence"
      collection_method: "Pair actual outward transfers to receipt and condition. Separate complete bench returns, usable material returns, retained stock and actual waste; bench_install owns rejection/correction exits. Weigh by material and reconcile recipient/treatment; do not subtract a return twice. Normalize job totals by accepted count. Maintain the actual child register for this node and protocol. Each line identifies one independent product/service/dispatch/substance, one explicit property/unit, independent raw quantity and conversion, actual state/gate/medium, owner, time and evidence. Retain all original material/activity/exit categories and conditional absence checks. Former family totals are nonexchange audit observations only; never copy them to each child or sum heterogeneous units as an exchange. No normal default quantity or occurrence is created by a conditional card."
      unit: "Item(s); kg"
      frequency: "Every transfer/reject and stock close"
      temporal_coverage: "Entire job and recorded linked outbound fates"
      site_scope: "Job boundary and actual receivers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Recipient acknowledgement, scales, stock balance, reject photos and waste/treatment receipts"
    - protocol_id: cp_releases
      process_id: "bench_install"
      flow_role: "Captured debris airborne particulate and conditional repair release"
      record_type: "Debris and emission records"
      raw_fields: "job_id; bore_id; concrete_composition; particle_size; captured_mass; moisture_basis; uncollected_release; substance; compartment; measurement_method; capture_efficiency_evidence; repair_id; uncertainty; treatment_id; flow_row_id; actual_child_id; family_role; identity_evidence; material_or_service_state; property_name; exchange_unit; independent_quantity; quantity_basis; conversion_evidence; owner_id; source_lot; recipient_or_medium; coverage_evidence; activation_evidence; absence_evidence; uncertainty; reconciliation_status; range_evidence"
      collection_method: "Measure captured debris and separately characterize uncaptured release by substance/size and receiving air; applicable emission calculations retain actual activity and method uncertainty. For minor repair link product composition and actual release conditions. Reconcile captured/emitted masses on stated basis, avoid treating whole removed concrete as airborne or whole repair product as solvent; normalize by accepted count. Maintain the actual child register for this node and protocol. Each line identifies one independent product/service/dispatch/substance, one explicit property/unit, independent raw quantity and conversion, actual state/gate/medium, owner, time and evidence. Retain all original material/activity/exit categories and conditional absence checks. Former family totals are nonexchange audit observations only; never copy them to each child or sum heterogeneous units as an exchange. No normal default quantity or occurrence is created by a conditional card."
      unit: "kg; actual sampling units"
      frequency: "Each drilling/clearing and actual repair event"
      temporal_coverage: "All installation and correction tasks"
      site_scope: "Actual bench installation exposure/control conditions"
      aggregation_rule: "per reference flow"
      quality_evidence: "Sampling/scale quality, method applicability, material/species evidence, treatment receipt and uncertainty statement"
  calculation_rules:
    - id: normalize_job
      applies_to: "non-reference inventory"
      rule: "q_ref = q_job / N; N = complete accepted installations in the declared comparable job lot; retain all attributable correction burdens and disclose any rejected-job treatment. Do not normalize if N is zero."
      inputs:
        - q_job
        - "accepted_count N"
        - "linked collection protocol"
      output: "q_ref per reference flow"
      source_ids: []
    - id: stock_custody
      applies_to: "material ledger"
      rule: "Reconcile opening stock plus receipts against installed/consumed material, actual outward usable returns, discard and closing stock by consistent material/unit. Returns are explicit exits; never also deduct them from gross receipts."
      inputs:
        - cp_materials
        - cp_fates
        - transfer_id
      output: "Reconciled material/custody ledger"
      source_ids: []
    - id: shared_ledger
      applies_to: "shared resource rows"
      rule: "Attribute actual shared burden using documented causal job_driver / total_driver for the complete declared consumer period; reconcile all consumer shares and unallocated residual. Service boundary excludes separately counted included energy."
      inputs:
        - cp_resources
        - "consumer ledger"
        - "provider coverage"
      output: "Attributable resource amounts and disclosed residual"
      source_ids: []
    - id: freight_activity
      applies_to: "actual independent freight exchanges required by atomic_freight"
      rule: "Calculate each evidenced loaded-leg cargo mass in tonnes times actual distance in km, retaining actual loading/empty-return allocation evidence. Do not invent mass or distance."
      inputs:
        - cp_logistics
      output: "t*km by actual leg"
      source_ids: []
  data_quality_requirements:
    - id: actual_identity
      applies_to: "all exchanges"
      requirement: "Resolve actual model/SKU/provider/substance, state, receiving compartment and property/unit before final dataset exchanges. Each inventory card has exactly one explicit property and unit. Actual records identify independent exchanges within that semantic identity; removed families are nonexchange refinement requirements, never quantity-bearing placeholder flows. Unresolved identity or mandatory child coverage remains a finalization blocker."
      evidence: "Supply data, provider detail and concrete identity/support confirmation"
    - id: host_and_gate
      applies_to: "reference"
      requirement: "Unknown existing slab is not accepted; retain actual compatibility and instruction evidence, every required fixing and closed defects. Historical dimensions are illustrative system evidence."
      evidence: "cp_acceptance; lf-austin-installation-2009"
    - id: complete_job
      applies_to: "all quantities"
      requirement: "Cover receipts through final correction/acceptance, stock/custody, shared periods and outbound waste; disclose missing meters, release characterization and provider coverage."
      evidence: "All linked protocols and reconciliations"
    - id: range_evidence
      applies_to: "all cards"
      requirement: "No universal inventory interval is evidenced here. Obtain card-specific actual observations/method uncertainties before range authoring; exact reference is definition. Do not present unmeasured emission or service quantities as zero."
      evidence: "Linked protocol, card Range evidence need and uncertainty evidence"
    - id: atomic_packaging_supply
      applies_to: "bench_install; cp_materials"
      requirement: "Other actual packaging, including a genuinely composite packing assembly; identify each actual material/formulation/SKU and one supply gate; preserve included-upstream physical mass without second supply burden. This is a mandatory nonexchange refinement scope, not an inventory card. Before dataset completion enumerate every actual independent child with one explicit property/unit, independent quantity and method, actual gate/state/medium, owner and evidence; link its actual exchange or a documented absence for each applicable condition. Keep the original receipt, stock, correction, return, capture and fate obligations. Missing identity, quantity, applicability or coverage is incomplete, never zero or automatically not applicable."
      evidence: "cp_materials; actual_child_register"
    - id: atomic_equipment_services
      applies_to: "bench_install; cp_resources"
      requirement: "Other actual asset/tool/maintenance/wear requirements and any service outside the three complete hourly provision scopes; define actual function, one property/unit, lifecycle coverage and causal all-consumer attribution; expand uncovered resources once. This is a mandatory nonexchange refinement scope, not an inventory card. Before dataset completion enumerate every actual independent child with one explicit property/unit, independent quantity and method, actual gate/state/medium, owner and evidence; link its actual exchange or a documented absence for each applicable condition. Keep the original receipt, stock, correction, return, capture and fate obligations. Missing identity, quantity, applicability or coverage is incomplete, never zero or automatically not applicable."
      evidence: "cp_resources; actual_child_register"
    - id: atomic_freight
      applies_to: "bench_install; cp_logistics"
      requirement: "Every actual inbound, usable-return, waste and attributable shared/empty leg: record mode/provider, origin/destination and included upstream gates, cargo and distance, actual reference unit and burden owner. For a t*km service calculate real cargo tonnes times loaded km per leg; allocate empty/shared burdens using evidenced causal carrier scope without fictional empty cargo. Supplement uncovered legs; included legs retain custody evidence without duplicate transport. This is a mandatory nonexchange refinement scope, not an inventory card. Before dataset completion enumerate every actual independent child with one explicit property/unit, independent quantity and method, actual gate/state/medium, owner and evidence; link its actual exchange or a documented absence for each applicable condition. Keep the original receipt, stock, correction, return, capture and fate obligations. Missing identity, quantity, applicability or coverage is incomplete, never zero or automatically not applicable."
      evidence: "cp_logistics; actual_child_register"
    - id: atomic_usable_returns
      applies_to: "bench_install; cp_fates"
      requirement: "Every other actual usable removed part, packaging or surplus product transferred outward; record actual material/SKU, usable state, recipient and custody acknowledgement. Same-custodian closing stock is not an exchange. No reuse potential, automatic coproduct, substitution credit or double return deduction. This is a mandatory nonexchange refinement scope, not an inventory card. Before dataset completion enumerate every actual independent child with one explicit property/unit, independent quantity and method, actual gate/state/medium, owner and evidence; link its actual exchange or a documented absence for each applicable condition. Keep the original receipt, stock, correction, return, capture and fate obligations. Missing identity, quantity, applicability or coverage is incomplete, never zero or automatically not applicable."
      evidence: "cp_fates; actual_child_register"
    - id: atomic_discarded_materials
      applies_to: "bench_install; cp_fates"
      requirement: "Every other actual irreparable bench part, failed fixing, damaged packaging or repair residue, and genuinely mixed dispatched waste carrier; identify material/formulation, hazard, as-dispatched state and treatment receiver. Preserve all correction losses. Never split a mixed carrier into additional duplicate constituent waste; exclude captured_drilling_dust and any already listed dispatch. This is a mandatory nonexchange refinement scope, not an inventory card. Before dataset completion enumerate every actual independent child with one explicit property/unit, independent quantity and method, actual gate/state/medium, owner and evidence; link its actual exchange or a documented absence for each applicable condition. Keep the original receipt, stock, correction, return, capture and fate obligations. Missing identity, quantity, applicability or coverage is incomplete, never zero or automatically not applicable."
      evidence: "cp_fates; actual_child_register"
    - id: atomic_airborne_releases
      applies_to: "bench_install; cp_releases"
      requirement: "Actual uncaptured drilling/clearing particulate by evidenced substance/particle-size fraction and receiving-air compartment, plus independently identified solvent species from actual activated minor finish repair. Retain measured activity, emission method applicability and uncertainty, composition, captured/emitted partition and actual repair/cure conditions. Generic dust/VOC, product content or unclosed mass balance is not a verified pollutant or zero emission; no epoxy VOC is introduced. This is a mandatory nonexchange refinement scope, not an inventory card. Before dataset completion enumerate every actual independent child with one explicit property/unit, independent quantity and method, actual gate/state/medium, owner and evidence; link its actual exchange or a documented absence for each applicable condition. Keep the original receipt, stock, correction, return, capture and fate obligations. Missing identity, quantity, applicability or coverage is incomplete, never zero or automatically not applicable."
      evidence: "cp_releases; actual_child_register"
validation_rules:
  - rule_id: scope_gate
    applies_to: "job"
    rule: "Reject this route if cantilever/epoxy, unaccepted slab or new slab/foundation work is required; current actual bench/anchor instructions and compatible concrete precede drilling."
    source_ids:
      - lf-austin-installation-2009
  - rule_id: handover_complete
    applies_to: "accepted_installation"
    rule: "Require complete level undamaged installed bench, all specified mechanical fixings, closed corrections and signed handover; rejected/returned bench is not an accepted output."
    source_ids:
      - lf-austin-installation-2009
  - rule_id: inventory_complete
    applies_to: "bench_install"
    rule: "Reconcile separately supplied bench/hardware/shims, protective packaging, actual drilling/clearing electricity and compressed air, actual assets/logistics, usable glides/packaging/stock, captured waste and characterized airborne release. Record actual minor repair only when activated."
    source_ids:
      - lf-austin-installation-2009
  - rule_id: shared_and_fates
    applies_to: "allocation"
    rule: "Check complete asset consumers/periods, attributable driver evidence and one owner per burden. No service/energy overlap, double return subtraction, invented recovery credit or stock-as-return exchange."
    source_ids: []
  - rule_id: binding_and_uncertainty
    applies_to: "final foreground dataset"
    rule: "All concrete exchanges need verified identity/property/unit; no generic dust/VOC UUID or borrowed service support. Unresolved records/ranges/support remain explicit incompleteness even if candidate structural checks pass."
    source_ids: []
  - rule_id: close_atomic_packaging_supply
    applies_to: "bench_install; cp_materials"
    rule: "Block final foreground completion unless atomic_packaging_supply is reconciled to independent actual exchanges or evidenced nonactivation; check child identity/state, one property/unit, raw-to-reference quantity, one burden owner, all affected stock/fates and upstream coverage. A candidate structural check cannot close this method gate."
