  classification_refs: "CPC 3.0 54400; proposed narrower relation"
  covered_products: "First accepted mechanical surface anchoring of factory-assembled four-legged park benches on compatible existing concrete"
  excluded_products: "Cantilever or epoxy systems; new foundations/slabs; onsite seat/support fabrication; unanchored placement; later maintenance"
  representative_product: "Austin backed/backless four-legged freestanding/surface-mount bench, supplied complete with ordered arms"
  production_route: "Accept slab/design; protect and position bench; remove glides; level; mark/move; drill; compressed-air clear; reposition; mechanically anchor; inspect and close corrections"
  market_state: "Complete accepted installation at signed site handover, with declared actual model and anchor configuration"
functional_unit:
  what: "Accepted mechanical surface anchoring of a complete factory-assembled four-legged park bench"
  how_much: "1 Item(s) complete accepted installation"
  how_well: "Level undamaged bench; all required mechanical anchors installed and fastened under the actual approved design/current instructions; compatible slab verified; corrections closed and handover signed"
  how_long_or_cycle: "One first-installation job from received supply and host acceptance through signed handover; no assumed service life or maintenance cycle"
  reference_flow_link: "accepted_installation"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR governs first mechanical surface anchoring of one factory-assembled, four-legged freestanding/surface-mount park bench on an accepted compatible existing reinforced-concrete slab. It supplies an installed-bench handover service. The Austin bench is an illustrative route, not a mandatory brand. Its historical 10/2009 guide confirms factory assembly and the mechanical freestanding detail; current project-specific bench and anchor instructions and verified slab compatibility govern actual construction. Cantilever, epoxy anchoring, new slab/caisson/paver construction, onsite furniture fabrication, later maintenance and bench use/end of life are excluded. CPC 3.0 54400 includes street-furniture installation, but this narrower PCR covers only this defined route. Sources: lf-austin-installation-2009; un-cpc3-notes-2025; lf-austin-product."
      source_ids:
        - un-cpc3-notes-2025
        - lf-austin-installation-2009
        - lf-austin-product
    - rule_id: host_gate
      applies_to: "bench_install"
      rule: "Confirm actual bench/anchor design, slab condition/strength/cure/thickness and compatible reinforcement, edge distances/spacing before drilling. Historical guide numbers qualify only its system; no universal anchor torque, load test or slab acceptance default is inferred."
      source_ids:
        - lf-austin-installation-2009
    - rule_id: field_integration
      applies_to: "bench_install"
      rule: "Join the supplied complete bench, separate anchors/washers and conditional levelling parts at the host interface. Include positioning, drilling, compressed-air clearing, fastening and inspection; do not invent onsite seat/support assembly."
      source_ids:
        - lf-austin-installation-2009
    - rule_id: sharing_scope
      applies_to: "resources and logistics"
      rule: "Identify each actual drill/compressor/lift/access asset and service period, every consumer job/node/period including bench_install, and its bounded provider coverage. One local node does not erase shared use on other jobs."
      source_ids: []
    - rule_id: correction_gate
      applies_to: "bench_install"
      rule: "Loose/failed fixings, uneven supports, finish damage or unaccepted concrete block accepted output. Record internal corrections in bench_install and all repeated resource/material use; unresolved defects remain rejects. Major repair, epoxy substitution or new host construction requires boundary review."
      source_ids:
        - lf-austin-installation-2009
boundary_abstraction:
  declared_starting_condition: "Factory-assembled bench and separately supplied mechanical anchor hardware received; existing reinforced slab already constructed and explicitly accepted for actual anchor/bench system"
  starting_condition_role: "Upstream supply gates and accepted existing host interface; unknown pre-existing concrete is not default accepted"
  product_classification_scope: "Narrow street-furniture installation service subset of CPC 3.0 54400"
  recursive_input_rule: "Any purchased same-category installation contribution is an explicit bounded subcontract input with its actual gate/coverage; do not recursively recreate it or claim a completed installation as an uninstalled bench."
  upstream_dataset_requirement: "Separate upstream bench, hardware, packaging and actual resource/service datasets with geography/time/technology and included transport/energy coverage. Retain unresolved coverage; no fabricated proxy."
  disclosure: "Record host evidence, ownership, actual instructions, receipt/acceptance dates, stock/returns, correction history and all shared asset consumers/periods. Existing slab production is outside this service gate; newly required slab work changes the boundary."
