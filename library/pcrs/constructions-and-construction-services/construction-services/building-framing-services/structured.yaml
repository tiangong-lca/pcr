  calculation_rules:
    - id: accepted_net_area
      applies_to: "accepted_frame"
      rule: "Sum accepted gross elevation areas once and subtract their clear projected opening areas; do not deduct the framing around those openings or count both faces."
      inputs:
        - "cp_erect_acceptance dimensions"
        - acceptance
        - openings
      output: "Positive net accepted area in m2"
      source_ids: []
    - id: lot_normalization
      applies_to: "all inventory rows"
      rule: "For each material, waste, emission and actual service unit, divide the attributable lot amount by the same positive net accepted area. Retain actual prepared-member and rework-transfer masses, independently of final output area."
      inputs:
        - "Node-specific protocol totals"
        - "cp_erect_acceptance net accepted area"
        - "allocation evidence"
      output: "Amount of each actual exchange per reference flow"
      source_ids: []
    - id: stock_reconciliation
      applies_to: "sawn_timber; cut_usable_returns_sawn_timber_sawn_timber; cut_usable_returns_offcut; cut_usable_returns_packaging; atomic_cut_usable_returns; erect_usable_returns_prepared_feed_plate; erect_usable_returns_prepared_feed_stud; erect_usable_returns_prepared_feed_blocking; erect_usable_returns_prepared_feed_opening_member; erect_usable_returns_frame_fasteners_nail; erect_usable_returns_frame_fasteners_connector; erect_usable_returns_frame_fasteners_anchor; erect_usable_returns_packaging; erect_usable_returns_recut_plate; erect_usable_returns_recut_stud; erect_usable_returns_recut_blocking; erect_usable_returns_recut_opening_member; atomic_erect_usable_returns"
      rule: "Reconcile gross lot receipts/issues and initial stock with installed/prepared transfers, actual custody returns, retained closing-stock balance, waste and actual releases at consistent moisture state. Closing stock is not a product output; disclose its carried-forward burden ownership. Separate recutting transfers from supplier exits. Internal transfers cancel only in whole-lot physical totals; keep node records and never pre-net returns also modelled as outputs."
      inputs:
        - cp_cut_material
        - cp_erect_material
        - cp_cut_waste
        - cp_erect_waste
      output: "Traceable material reconciliation and disclosed difference"
      source_ids: []
    - id: atomic_child_normalization
      applies_to: "cut_rework_feed_plate; cut_rework_feed_stud; cut_rework_feed_blocking; cut_rework_feed_opening_member; cut_services_saw; cut_services_access; cut_services_handling; cut_services_extraction; cut_services_compressor; prepared_members_plate; prepared_members_stud; prepared_members_blocking; prepared_members_opening_member; cut_usable_returns_sawn_timber_sawn_timber; cut_usable_returns_offcut; cut_usable_returns_packaging; cut_offcuts_offcut; cut_offcuts_rejected; cut_packaging_waste_wrapper; cut_packaging_waste_strap; prepared_feed_plate; prepared_feed_stud; prepared_feed_blocking; prepared_feed_opening_member; frame_fasteners_nail; frame_fasteners_connector; frame_fasteners_anchor; erect_services_drill; erect_services_nailer; erect_services_access; erect_services_handling; erect_services_extraction; erect_services_compressor; erect_usable_returns_prepared_feed_plate; erect_usable_returns_prepared_feed_stud; erect_usable_returns_prepared_feed_blocking; erect_usable_returns_prepared_feed_opening_member; erect_usable_returns_frame_fasteners_nail; erect_usable_returns_frame_fasteners_connector; erect_usable_returns_frame_fasteners_anchor; erect_usable_returns_packaging; erect_usable_returns_recut_plate; erect_usable_returns_recut_stud; erect_usable_returns_recut_blocking; erect_usable_returns_recut_opening_member; erect_waste_timber; erect_waste_fastener; erect_waste_packaging; erect_waste_host_debris"
      rule: "Record independent_physical_quantity separately by atomic_flow_row_id; actual_<row_id>_quantity is its named alias only, never a copied family amount. Materials retain original CP per-identity/state gross/net stock and outward-return conventions; transfers use actual paired custody quantity; usable exits and wastes use independent actual fate quantities. Number-of-items owned asset equivalents use this PCR original job_driver/full_life_driver complete-life fraction including manufacture, maintenance, replacement and end of life, with every consumer and a positive complete denominator. Duration/h service children instead use actual attributable job hours with the matching complete-life burden per hour; never multiply hours by the fraction again. Purchased services use only actual complete physical tasks whose real contract defines Item(s), with original actual attribution; hours, days and prices cannot become event counts. atomic_child_intensity = independent_physical_quantity / A, where A is positive unique net accepted wall elevation area in m2, one plane minus clear projected openings under cp_erect_acceptance under the original acceptance rule; A=0 blocks normalization. Non-exchange parent role ledgers and original CP operands retain their stock, transfer, closure and ownership functions, without adding a second exchange or changing the method."
      inputs:
        - atomic_flow_row_id
        - independent_physical_quantity
        - exchange_property
        - exchange_unit
        - A
        - cp_cut_material
        - cp_cut_services
        - cp_cut_waste
        - cp_erect_material
        - cp_erect_services
        - cp_erect_waste
      output: "atomic_child_intensity"
      source_ids: []
  data_quality_requirements:
    - id: design_gate
      applies_to: "reference product"
      requirement: "Actual nonloadbearing design and accepted compatible host interface are required; illustrative PNNL sizes/spacing do not establish project acceptance."
      evidence: "Approved elevation and fixing specification; cp_erect_acceptance"
    - id: transfer_state
      applies_to: "both nodes"
      requirement: "Match measured cut-list handoffs and recutting loops by member, state, moisture and transfer ID. Do not fix an internal amount to the reference area."
      evidence: "cp_cut_material and cp_erect_material reconciliation"
    - id: range_collection
      applies_to: "all cards"
      requirement: "Collect actual comparable lot variability, measurement error and identity qualifiers before setting a QA range. No source here supports universal material, loss, fastening, energy or service ranges. Missing amounts/identities are explicit data gaps."
      evidence: "Node-specific records; per-card Range evidence needs"
    - id: material_conversion
      applies_to: "timber and fasteners"
      requirement: "Mass conversion requires actual dimensions/density/moisture or measured unit mass at compatible state; retain uncertainty and reject unexplained generic factors."
      evidence: "Weighing, moisture record and supplier specification"
    - id: shared_coverage
      applies_to: "all services"
      requirement: "Keep complete consumers and service periods, actual attribution evidence and provider/direct coverage reconciliation."
      evidence: "cp_cut_services; cp_erect_services"
    - id: release_identity
      applies_to: "waste and elementary outputs"
      requirement: "Distinguish offcuts, captured sawdust, returns/stock and actual substance/size-specific airborne release; missing characterization cannot mean zero."
      evidence: "cp_cut_waste; cp_erect_waste"
    - id: temporal_completeness
      applies_to: "all cards"
      requirement: "Use the full initial job with corrections and final acceptance. Record supplier geography/date, site period, gaps and representativeness; never mix a prototype/example bill with actual site data."
      evidence: "Lot ledger; source/version disclosure; signed closeout"
    - id: atomic_cut_rework_feed
      applies_to: "cut_members; cp_cut_material"
      requirement: "Former cut_rework_feed is a mandatory non-exchange refinement scope and custody/closure ledger key, not a mixed quantity-bearing inventory card. Preserve the original scope: Conditionally present when an erection member is usable after an approved cut correction; preserve the same physical identity, moisture and rejected state. Named children cover only the listed conditional objects; every other real independent object remains required in the actual register. At this node use the original CP to collect each object's identity/state/medium or receiver, one fixed property/unit, independent quantity/conversion, activation or evidenced absence, source-ledger event, ownership and upstream coverage. The PCR denominator, stock/fate, allocation and closure methods remain unchanged; foreground records cannot choose a different method. Parent totals are non-exchange diagnostics, never copied to children or summed across unlike units as an exchange; do not duplicate a complete formulation/assembly/actual mixed carrier as constituents. Incomplete actual roster, quantity, identity/support, method or coverage blocks final foreground completion, never zero, implicit nonapplicability or manifest-only disclosure."
      evidence: "cp_cut_material; actual_child_register; parent_ledger_id"
    - id: atomic_cut_services
      applies_to: "cut_members; cp_cut_services"
      requirement: "Former cut_services is a mandatory non-exchange refinement scope and custody/closure ledger key, not a mixed quantity-bearing inventory card. Preserve the original scope: Conditional umbrella for actual zero, one or multiple service exchanges. Identify shared asset, consumers including erect_frame/other jobs and reporting periods, production/use/removal boundary and causal allocation. Named children cover only the listed conditional objects; every other real independent object remains required in the actual register. At this node use the original CP to collect each object's identity/state/medium or receiver, one fixed property/unit, independent quantity/conversion, activation or evidenced absence, source-ledger event, ownership and upstream coverage. The PCR denominator, stock/fate, allocation and closure methods remain unchanged; foreground records cannot choose a different method. Parent totals are non-exchange diagnostics, never copied to children or summed across unlike units as an exchange; do not duplicate a complete formulation/assembly/actual mixed carrier as constituents. Incomplete actual roster, quantity, identity/support, method or coverage blocks final foreground completion, never zero, implicit nonapplicability or manifest-only disclosure."
      evidence: "cp_cut_services; actual_child_register; parent_ledger_id"
