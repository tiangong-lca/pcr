      requirement: "The equalities below are reconciliation conditions for the same member/state/moisture/event/gate, never quantity assignments. Prepared issues and recutting each retain actual source/receipt evidence (the same signed measurement may be reused). Explain actual loss/state change with evidence and responsibility; never force unknown quantities equal. Recut feeds use only the corresponding internal subset of erect_usable_returns; external supplier/owner exits cannot become recut inputs. After cutting changes state, measure the new prepared handoff under the same member lineage, retaining every repeat operation/energy/waste without another external timber purchase. Pairs: prepared_members_plate == prepared_feed_plate; prepared_members_stud == prepared_feed_stud; prepared_members_blocking == prepared_feed_blocking; prepared_members_opening_member == prepared_feed_opening_member; erect_usable_returns_recut_plate == cut_rework_feed_plate; erect_usable_returns_recut_stud == cut_rework_feed_stud; erect_usable_returns_recut_blocking == cut_rework_feed_blocking; erect_usable_returns_recut_opening_member == cut_rework_feed_opening_member"
