measurement_rules:
  - id: net_elevation
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Use cp_erect_acceptance to measure one elevation plane once, subtract clear openings, and retain every plate, stud, blocking and opening-member burden. Never count both wall faces or stud surface area. Positive net accepted area is required."
  - id: timber_state
    applies_to: "sawn_timber; prepared_members_plate; prepared_members_stud; prepared_members_blocking; prepared_members_opening_member; atomic_prepared_members; prepared_feed_plate; prepared_feed_stud; prepared_feed_blocking; prepared_feed_opening_member; atomic_prepared_feed; cut_rework_feed_plate; cut_rework_feed_stud; cut_rework_feed_blocking; cut_rework_feed_opening_member; atomic_cut_rework_feed"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use traceable weighed mass at declared moisture/treatment state. Actual sections and lengths support reconciliation only; geometry requires actual species/state-specific density and moisture evidence before mass conversion. Report moisture-basis and density uncertainty; no generic timber density or oven-dry substitution."
  - id: services_basis
    applies_to: "cut_energy; erect_energy; cut_services_saw; cut_services_access; cut_services_handling; cut_services_extraction; cut_services_compressor; atomic_cut_services; erect_services_drill; erect_services_nailer; erect_services_access; erect_services_handling; erect_services_extraction; erect_services_compressor; atomic_erect_services"
    required_property_ref:
      name: "Actual service property"
      uuid: ""
    required_unit: "Actual supplier or meter unit"
    rule: "Preserve actual energy and service units, coverage and asset IDs. Allocate real shared totals by metering or documented causal use and report uncertainty; no invented conversion from hours to energy."
