allocation_rules:
  - rule_id: retained_rework
    applies_to: "cut_members; erect_frame"
    rule: "Retain timber, fasteners, energy, services and waste from every rejected attempt and correction in the accepted lot. Do not add rejected area to the denominator. Pair erection-to-cutting rework and prepared-member return transfers; internal transfers carry existing burden without new procurement or a second final output."
    source_ids: []
  - rule_id: usable_custody
    applies_to: "both nodes"
    rule: "Use gross attributable material receipts/issues with actual custody-return outputs; never pre-net a return and model it again as an output. Retained closing stock is a balance, never an outbound product. Declare its carried-forward burden ownership separately from the accepted service; do not invent a stock credit. Usable offcuts, fasteners and packaging require owner and later-use/return evidence. Erection recutting transfers are a separately matched subset; supplier returns are not recut feed. Waste retains producing-node responsibility and actual destination."
    source_ids: []
  - rule_id: shared_services
    applies_to: "cut_services_saw; cut_services_access; cut_services_handling; cut_services_extraction; cut_services_compressor; atomic_cut_services; erect_services_drill; erect_services_nailer; erect_services_access; erect_services_handling; erect_services_extraction; erect_services_compressor; atomic_erect_services; cut_energy; erect_energy"
    rule: "Identify each shared asset/provider and all consuming nodes, jobs and service periods. Prefer direct metering or activity evidence; otherwise document a causal allocation key with complete denominator, standby treatment and uncertainty. Attributed shares cannot exceed the event total. Provider coverage and direct quantities are mutually reconciled so tool manufacture, logistics, compressor energy and removal are not counted twice."
    source_ids: []
  - rule_id: no_automatic_credit
    applies_to: "both nodes"
    rule: "No automatic coproduct, waste recovery, avoided virgin timber or biogenic storage credit. A documented usable material exit requires explicit retained-burden treatment and separate later-use boundary; timber carbon/moisture facts require actual evidence."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_cut_material
      process_id: "cut_members"
      flow_role: "timber issue; prepared handoff; rework; usable returns/stock"
      record_type: "material and transfer ledger"
      raw_fields: "lot; elevation; member ID; cut-list revision; supplier; species; grade; treatment; section; length; moisture basis; weighed mass; opening/closing stock; return owner; transfer ID; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Record gross actual supply/stock issues to the defined lot, without pre-netting custody returns. Weigh prepared members and real usable outbound transfers; closing stock is a retained balance with declared carried-forward burden, never an output exchange. Pair prepared handoffs to cp_erect_material and recutting returns separately; retain repeats. Reconcile gross issues, stock, transfers, waste and actual releases at declared state and uncertainty; divide attributable lot totals by cp_erect_acceptance net accepted area. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity aliases this record independent physical quantity keyed by atomic_flow_row_id under the original CP method and atomic_child_normalization, never another parent quantity. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      unit: "kg"
      frequency: "Each issue/cut batch/transfer and closeout"
      temporal_coverage: "Full construction lot including corrections"
      site_scope: "Actual site cutting station and stock area"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale traceability; moisture method/state; cut-list dimensional checks; delivery receipts; paired transfers; closing stock custody; reconciliation gaps"
    - protocol_id: cp_cut_services
      process_id: "cut_members"
      flow_role: "energy; shared cutting tools/services"
      record_type: "meter and service-event ledger"
      raw_fields: "event ID; asset/provider; supply unit; meter start/end; use/standby period; consumers/jobs/nodes; allocation key; total activity; share; coverage; energy source; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
