product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.building-framing-services"
  classification_refs: "cpc:3.0:54521; narrower"
  covered_products: "Bare nonloadbearing interior sawn-timber stud wall frames with independently recorded onsite cut-list preparation and nailed/mechanical erection"
  excluded_products: "Loadbearing/shearwall and whole-building framing; prefabricated panels; complete lined partitions; timber manufacture; old-wall removal"
  representative_product: "Project-approved interior stud wall elevation with specified plates, studs, blocking and opening framing, mechanically connected to compatible accepted hosts"
  production_route: "Supplied sawn lengths → measured cut-list preparation and labelled member handoff → nailed assembly, host fixing, alignment and closed corrections → signed unlined-stage acceptance"
  market_state: "Completed site construction service at bare-frame acceptance, rather than timber sale or finished-room service"
functional_unit:
  what: "Accepted bare nonloadbearing interior sawn-timber wall frame construction service"
  how_much: "1 m2 net accepted wall elevation, measured once in one plane; deduct the clear projected opening areas from gross wall elevation; retain all framing and correction burdens around openings"
  how_well: "Actual approved nonloadbearing framing elevation and compatible host connections; specified members and fixings complete, plumb, aligned and stable at unlined handover; inspection signed with defects closed"
  how_long_or_cycle: "One initial construction and acceptance cycle, including preparation, erection and corrections; no occupied-building life or later lining cycle"
  reference_flow_link: "accepted_frame"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers first onsite construction of a bare nonloadbearing interior sawn-timber stud wall frame by a documented cut-list preparation and member-handoff stage followed by nailed assembly and mechanical fixing to accepted existing hosts. The accepted frame is unlined and ready for subsequent trades. Its host interfaces and nonloadbearing design must be established before work. The actual project-approved framing elevation governs all dimensions, spacing, opening details, grade, moisture and connections. PNNL provides a route example and pre-lining inspection guidance; its advanced-framing dimensions are not universal prescriptions (pnnl-minimum-wall-studs). Exclude loadbearing or shear walls, whole-building frames, floor and ceiling framing, factory-panel assembly, engineered-wood substitutions, existing-wall removal, host construction or structural repair, linings, sheathing, insulation, services and paint. A changed load path or a need for lining to achieve the declared frame-stage stability requires boundary review. No acoustic, thermal or fire performance of a finished partition is attributed to this bare frame."
      source_ids:
        - pnnl-minimum-wall-studs
    - rule_id: cut_handoff
      applies_to: "cut_members"
      rule: "Own stock selection and cut-list transformation from supplied lengths to accepted labelled members. Record actual physical post-cut dimensions, mass and transfer IDs to erect_frame; saw kerf, offcuts, sawdust and correction cutting remain here. A real staged handoff is required for this route."
      source_ids:
        - pnnl-minimum-wall-studs
    - rule_id: erection_gate
      applies_to: "erect_frame"
      rule: "Join prepared plates/studs/blocking/opening members with nails and specified mechanical host fixings. Check all design details, host readiness, alignment and frame-stage stability; close corrections and sign inspection before later trades."
      source_ids:
        - pnnl-minimum-wall-studs
    - rule_id: site_coverage
      applies_to: "both nodes"
      rule: "Include actual materials, packaging, delivery/intrasite logistics, tool/drill/saw/nailer energy, conditional compressor and dust collection, access and temporary positioning services, their attributed production/use/removal coverage and closed correction burdens. Split provider service versus direct material/energy coverage to avoid duplication."
      source_ids: []
    - rule_id: excluded_interfaces
      applies_to: "both nodes"
      rule: "Exclude historic host/wall burden, upstream lumber production as a local node, host construction, old-wall demolition, complete partition performance and later trades. Unknown host/design readiness prevents a usable accepted dataset."
      source_ids:
        - pnnl-minimum-wall-studs
boundary_abstraction:
  declared_starting_condition: "Approved nonloadbearing framing design, accepted compatible existing host interfaces and actual supplied sawn timber and fasteners at declared delivery gates"
  starting_condition_role: "Host readiness is an evidenced precondition; existing host production is not an input consumed by this service. Delivered materials remain upstream product inputs with their production burdens."
  product_classification_scope: "A narrower interior wall-frame construction route within CPC 3.0 54521, not all building framing"
  recursive_input_rule: "An input already representing accepted wall-frame construction service cannot be silently treated as timber feed. Document a separately bounded predecessor service or review the boundary; do not recursively include the same accepted service."
  upstream_dataset_requirement: "Use compatible upstream sawn timber, fasteners, energy, logistics and bounded service datasets at their actual supply states; disclose unavailable identities, moisture, treatment, geography and provider coverage."
  disclosure: "Declare design, host acceptance, procurement and transport gates, site period, prepared-member transfers, rejects and custody, shared-asset consumers, provider coverage and all gaps. No host burden, waste credit or carbon-storage credit is inferred."
