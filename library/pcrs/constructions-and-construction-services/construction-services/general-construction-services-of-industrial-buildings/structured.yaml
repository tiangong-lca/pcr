      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional actual new sheet goods used for temporary segregation, protection or required interface work. Specify material, thickness, service coverage and retained reusable stock. Range evidence need: Require actual native area/length dimensions, thickness/specification, deployment and stock condition, reused versus new receipts, closing carry and accepted usable-return records; deployment count alone is not new supply. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual new sheet SKU/material/thickness/native area/state and function; retained reusable carried stock versus new receipts and genuine usable outward returns."
