  calculation_rules:
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "q_normalized = attributable_quantity / N; attribute compatible site/job/phase/period records first, then divide by N once per reference flow."
      inputs:
        - attributable_quantity
        - N
        - cp_gate
      output: "native-unit amount per reference flow"
      source_ids: []
    - id: calc_stock
      applies_to: "roof_connection_assemblies_connector; roof_connection_assemblies_plate; roof_connection_assemblies_restraint; roof_connection_assemblies_dissipative_assembly; cladding_connection_assemblies_panel_column; cladding_connection_assemblies_panel_beam; repair_consumables_repair_formulation; repair_consumables_anchoring_formulation; repair_consumables_protective_formulation; actual exchanges required by refine_temporary_sheet_supplies; actual exchanges required by refine_temporary_linear_supplies; product_water; actual exchanges required by refine_site_fuel; actual exchanges required by refine_usable_count_returns; actual exchanges required by refine_usable_mass_returns; actual exchanges required by refine_usable_area_returns; actual exchanges required by refine_usable_length_returns; actual exchanges required by refine_usable_volume_returns"
      rule: "net_receipts = external_gross - tare; S = opening_attributed + net_receipts - closing_carried; under allocation_stock, gross-with-outlets records S input and matched usable_return output; consumed-only records S-usable_return input and nonadditive return audit. Divide by N once."
      inputs:
        - opening_attributed
        - external_gross
        - tare
        - closing_carried
        - usable_return
        - convention
        - N
        - cp_supply
        - cp_fuel
      output: "native inputs and matched outward returns without duplicate deduction"
      source_ids: []
    - id: calc_mass_view
      applies_to: "all inventory rows"
      rule: "An independent mass view requires actual SKU dimensions or volume, density, state, moisture, temperature/unit and sources. Use compatible dimensions and mark the view nonadditive to the native physical ledger; no unevidenced item/area-to-mass conversion."
      inputs:
        - sku
        - dimension
        - thickness
        - density
        - density_unit
        - moisture
        - temperature
        - temperature_unit
        - mass_view_source
        - cp_supply
      output: "evidenced nonadditive mass view"
      source_ids: []
    - id: calc_fuel_fates
      applies_to: "actual exchanges required by refine_site_fuel; actual exchanges required by refine_actual_air_species; actual exchanges required by refine_actual_water_soil_species"
      rule: "Use actual measured_burn or audited complete disjoint native-unit fates. Return, nonburned waste, uncontained loss and carry are mutually exclusive. total_spill_audit is audit-only; recovered_closing is already in closing_carried. Investigate unknown loss; do not infer burn as residual."
      inputs:
        - measured_burn
        - burn_method
        - usable_return
        - nonburned_waste
        - uncontained_loss
        - carry
        - total_spill_audit
        - recovered_closing
        - fate_uncertainty
        - unknown_loss_investigation
        - cp_fuel
      output: "actual combustion activity and separate noncombustion fates"
      source_ids: []
    - id: calc_freight
      applies_to: "freight"
      rule: "freight_work = load_mass_kg * distance_km * load_share; retain original mass/distance units and conversions; apply coverage to empty returns and uncovered vehicle resources, then divide by N once."
      inputs:
        - load_mass
        - mass_unit
        - distance
        - distance_unit
        - load_share
        - empty_return
        - upstream_coverage
        - conversion_factor
        - conversion_source
        - N
        - cp_freight
      output: "kg*km per reference flow and uncovered resources"
      source_ids: []
    - id: calc_species
      applies_to: "actual exchanges required by refine_actual_air_species; actual exchanges required by refine_actual_water_soil_species"
      rule: "Choose the actual valid method: measured species mass, matched activity * complete species EF, or actual whole-fluid release * evidenced composition * fate. Never multiply a complete species EF by composition/fate again. Divide each species/medium amount by N once; whole-fluid and constituent views are nonadditive."
      inputs:
        - measured_mass
        - matched_activity
        - activity_unit
        - species_factor
        - factor_unit
        - factor_basis
        - factor_source
        - whole_fluid_release
        - composition
        - composition_basis
        - composition_source
        - fate_fraction
        - fate_basis
        - fate_source
        - method_choice
        - complete_species_factor
        - N
        - cp_releases
      output: "actual species/receiving-medium mass per reference flow"
      source_ids: []
