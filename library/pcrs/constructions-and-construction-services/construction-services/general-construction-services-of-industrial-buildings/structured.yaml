      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Expand actual removed historic connection/interface material, failed new assemblies, offcuts, dust captured in containers, packaging and contaminated residues by measured waste identity, classification and treatment destination. Historic assets are not negative new purchases. Onsite correction remains in integration; offsite exits keep transfer IDs. Actual usable historic recovered parts MUST be recorded in their own recovered-product state, not matched unused new-product returns. Actual contained wastewater supplied to treatment in native Volume MUST expand a dedicated Waste exchange in m3 with measured volume/state, receiver, treatment and freight coverage; never convert it to an elementary direct release. Range evidence need: Require measured fraction/classification, historic versus new origin, wet/dry or moisture basis, net mass/tare, receiver and treatment/freight gate. Native-volume contained wastewater requires its own Waste exchange and volume/state records; no generic waste ratio is evidenced. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Historic removed connection/interface materials, failed new assemblies, offcuts, captured dust/container compo