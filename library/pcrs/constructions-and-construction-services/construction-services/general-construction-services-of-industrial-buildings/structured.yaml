      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional whole-asset equivalents for platforms, temporary supports, drills and test rigs require an actual identified asset and matching whole-asset lifecycle dataset. Enumerate all jobs, nodes and periods, including external consumers. Rental fees alone are insufficient. Range evidence need: Require identified asset, compatible actual job and ALL-consumer full-life drivers, observed life/history and evidenced remainder, maintenance/replacements/termination/EOL, uncertainty/sensitivity and updates; no universal asset lifetime or job fraction is evidenced. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Distinct actual asset model/ownership/life packets and other resources require refinement; all job/node/external consumers, observed history/remainder, maintenance/replacements/EOL, driver uncertainty/update mandatory, no invented lifetime or rental-fee equivalent."
      evidence: "cp_assets; actual independent records and identity/unit evidence"
    - id: refine_direct_environmental_water
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional actual surface/groundwater withdrawal is an elementary input separate from supplied product water. MUST identify actual source water body, location, abstraction permit, meter, volume convention and intake period; absent direct abstraction means no exchange. Range evidence need: Require actual water source/quality, calibrated volume readings, withdrawal versus product-supply role, event/state and destination balances, uncertainty and any reuse/carry; no generic water-per-building or discharge ratio is evidenced. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual permitted water-body source/location/intake/meter/state, one Volume/m3 reference, distinct from product supply and internal reuse."
