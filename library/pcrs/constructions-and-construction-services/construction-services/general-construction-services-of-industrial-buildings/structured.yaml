  - rule_id: validate_atomic_exchange_unit_and_normalization
    applies_to: "all inventory rows"
    rule: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground data package for a named retained-factory connection-retrofit service, supporting downstream process/lifecyclemodel projections"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "modelling completed industrial-building retrofit with compatible actual scope, starting state, connection strategy and signed gate"
  excluded_use: "whole new building asset; generic safety certification; future earthquake performance guarantee; unreviewed substitution for other uses/technologies"
  required_metadata: "building/intervention IDs; all reference qualifiers; N/count convention; periods, scope, technology, provider coverage, shared life, resources and environmental inventory"
  required_quality_disclosure: "gaps/uncertainty; actual acceptance evidence; release/conversion sources; full-life attribution/sensitivity; numerical-range evidence limitations"
  update_trigger: "approved-design/retained-state change; additional acceptance/stock; actual SKU/service/environmental evidence correction; shared-life/replacement/termination update"
data_sources:
  - id: "reluis-industrial-retrofit-2024"
    type: "literature"
    reference: "https://www.reluis.it/wp-content/uploads/2024/12/14_Poster_Penna_WP3_T2a.pdf"
    used_for: "Industrial-building section only: existing single-storey precast RC cases, roof/cladding connection roles, traditional/dissipative retrofit and site-specific limitations; no universal numerical defaults or new-building equivalence."
  - id: "unsd-cpc3-54121-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed p. 283, subclass 54121."
    used_for: "Classification scope for ordinary industrial-building construction/repair and mining/power/chemical/specialized-manufacturing exclusions; not a route quantity source."
  - id: "reluis-dpc-industrial-guidelines-2012"
    type: "official_guidance"
    reference: "https://www.reluis.it?wpdmdl=4968&ind=4101"
    used_for: "Historical 2012 industrial-building guidance, preface and sections 3.3–3.5: local/global phases, connection interaction, foundations/columns and actual assessment; not current global regulation or universal numerical defaults."
