    - id: refine_direct_liquid_release
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Only actual direct liquid release to a specified receiving environment is elementary output; contained wastewater sent for treatment is waste. MUST expand actual receiving-water identity and measured volume, and separately identify any actual pollutant species; whole-liquid and constituent views are nonadditive. Range evidence need: Require measured actual direct whole-liquid volume/state and receiving water/soil destination, distinct contained-treatment transfers, and separately evidenced constituent species; no equal-input discharge or additive whole-fluid/species burden is evidenced. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Retain actual whole-liquid release mass/state as nonadditive physical audit; instantiate only identified substances and actual receiving compartment/fate, no generic mixture emission."
