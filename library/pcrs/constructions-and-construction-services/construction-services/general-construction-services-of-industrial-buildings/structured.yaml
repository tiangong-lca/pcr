    - id: refine_roof_connection_assemblies
      applies_to: "roof_connection_assemblies_connector; roof_connection_assemblies_plate; roof_connection_assemblies_restraint; roof_connection_assemblies_dissipative_assembly"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Count each actual identified connector, plate, fastener, restraint or dissipative assembly by SKU/configuration and installed interface. Complete bought assemblies include their BOM once; separately supplied pieces retain separate item identities. Existing roof and beam are retained starting state. Range evidence need: Require the actual approved connection schedule and SKU/BOM counts, roof/panel interface geometry, delivery/stock balances, failed-installation replacements and counting uncertainty; no generic bolts-per-building or poster dimensions are evidenced. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual fastener products and further separately supplied pieces require exact functional SKU/configuration/count identity. Do not split complete bought assemblies into duplicate internal purchases; retain retained roof/beam starting state and actual schedule/interfaces."
      evidence: "cp_supply; actual independent records and identity/unit evidence"
    - id: refine_cladding_connection_assemblies
      applies_to: "cladding_connection_assemblies_panel_column; cladding_connection_assemblies_panel_beam"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record the distinct panel-column and panel-beam connection components required by the assessed scheme, including actual restraints and replacement parts. Do not impose poster bolt dimensions or a universal fastening recipe. Range evidence need: Require the actual approved connection schedule and SKU/BOM counts, roof/panel interface geometry, delivery/stock balances, failed-installation replacements and counting uncertainty; no generic bolts-per-building or poster dimensions are evidenced. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Separately supplied restraints and replacement parts not covered by a complete actual assembly require exact SKU/function/unit; no universal bolt dimensions or fastening recipe."
      evidence: "cp_supply; actual independent records and identity/unit evidence"
    - id: refine_repair_consumables
      applies_to: "repair_consumables_repair_formulation; repair_consumables_anchoring_formulation; repair_consumables_protective_formulation"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Expand only actual project products such as interface repair, anchoring or protective consumables. Identify formulation, condition and supplier gate. New quantities include nonreturned site losses and failed-work consumables. Range evidence need: Require actual product formulation/state, weighed receipts/tare, local interface repair dimensions, rejected-work consumption, closing stock and matched usable returns; no universal repair mass or density is evidenced. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Any other actual joining/repair supply requires its own identity/state/unit and independent quantity; one complete formulation remains one product, include nonreturned losses/reject use."
