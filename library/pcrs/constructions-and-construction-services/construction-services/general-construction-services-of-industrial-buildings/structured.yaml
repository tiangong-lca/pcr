      collection_method: "Weigh separated actual waste, reconcile defective connection correction/retest and offsite receiver records; distinguish usable product return, recovered closing stock and waste. Aggregation details: attributable net waste mass / N once per reference flow; rejected state never counted in N Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
