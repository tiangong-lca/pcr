      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional actual spills/leaks or direct effluent MUST expand substance, receiving compartment and fate. Captured waste, recovered closing stock, outward usable returns and uncontained losses are mutually exclusive fates. Direct environmental gas abstraction or gas release in a native volumetric state MUST additionally expand dedicated measured exchanges with actual gas identity, pressure, temperature and their units. Range evidence need: Require actual substance/particle fraction and receiving medium, measured released mass or compatible activity/species factor with units/source, or actual whole-fluid release and evidenced composition/fate. Retain capture/recovery and nonadditive views; no default species, SDS-based emission or repeated factor composition is evidenced. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_releases; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
validation_rules:
  - rule_id: validate_gate
    applies_to: "accepted_connection_retrofit"
    rule: "Verify N>0 unique complete interventions, reference name/output row, actual foundations/columns and load-path assessment, approved connection scheme, inspections/tests and signed defect closure; panels/bolts/retests cannot enlarge N."
    source_ids:
      - reluis-industrial-retrofit-2024
  - rule_id: validate_stock
    applies_to: "all supply and return rows"
    rule: "Match native units/states; check stock, gross/net convention, usable returns exactly once, no negative historic-asset purchase and retained loss burdens."
    source_ids: []
  - rule_id: validate_shared
    applies_to: "shared_assets_platform; shared_assets_temporary_support; shared_assets_drill; shared_assets_test_rig; provider_test_services_test_campaign; provider_test_services_engineering_verification; freight"
    rule: "Require complete shared-asset consumers/nodes/periods and life evidence; choose one whole-asset or service view. Actual service results/units, rental/test/spares/temporary utilities/travel/freight/empty-return coverage must neither duplicate nor omit burdens; gaps block."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "integration"
    rule: "Rejected connections remain in this node for correction/retest with actual waste and usable-return routes. Unresolved rejects never enter accepted output, and failure does not erase burdens."
    source_ids: []
  - rule_id: validate_environment
    applies_to: "all elementary rows"
    rule: "Expand actual species/medium and native water/gas withdrawal/releases with complete raw operands. Separate product/waste/elementary states, keep whole-fluid/species views nonadditive and avoid repeat composition/fate multiplication."
    source_ids: []
  - rule_id: validate_phases
    applies_to: "integration"
    rule: "Check period boundaries, links of events/inputs/assets/outputs, attribution decisions and replacement/termination records; avoid duplicate interphase/shared-lifecycle attribution, and block final data on unresolved replacement or termination."
    source_ids: []
  - rule_id: atomization_roof_connection_assemblies_complete
    applies_to: "roof_connection_assemblies_connector; roof_connection_assemblies_plate; roof_connection_assemblies_restraint; roof_connection_assemblies_dissipative_assembly"
    rule: "Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying refine_roof_connection_assemblies with actual records; unresolved required expansion blocks the dataset."
    source_ids:
      - reluis-industrial-retrofit-2024
