      collection_method: "Measure actual species and medium or use compatible complete species EF / evidenced whole-fluid composition and fate. Record actual direct-water/gas roles and expand dedicated concrete exchanges; absence requires evidence, not a default zero. Aggregation details: calc_species or measured direct volume / N once per reference flow; whole-fluid and constituent views nonadditive Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
