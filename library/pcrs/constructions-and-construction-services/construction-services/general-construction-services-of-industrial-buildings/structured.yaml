system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "Applies to one completed coordinated roof and cladding connection seismic-retrofit intervention on a retained assessed single-storey precast reinforced-concrete factory or ordinary production/assembly workshop. The starting state is the surveyed existing foundations, columns, roof, cladding, geometry and use; the output is engineer/owner signed completion under the actual approved project scheme. Include temporary isolation/protection/support, access/drilling/preparation, roof-to-beam and panel-column/panel-beam restraint connections, necessary interface repair, associated removed/replaced materials, inspection/testing/retesting and defect closure. Neither an isolated connection task, purchased hardware nor cladding maintenance replaces this coordinated gate. reluis-industrial-retrofit-2024. Exclude whole new buildings, complete rebuilding, generic warehouses, chemical/power/mining/specialized-manufacturing civil facilities, equipment restraint-only or cladding-only maintenance, future operation/maintenance and future earthquake consequences. Retained foundations/columns and the load path must be assessed; if comprehensive compliance requires additional strengthening, include the actual work and disclose it rather than asserting comprehensive compliance from connection work alone. Completion guarantees neither equivalence to a newly code-designed building nor a numerical future earthquake outcome. Investigational case load factors, bolt dimensions, years and failure probabilities are not default design values. Historical 2012 Italian industrial-building technical guidance distinguishes local rapid measures from subsequent global seismic assessment and considers connection/main-structure interaction and foundations/columns. Use it here only for physical-route and gate context under the actual locally approved design; historical law, percentages, periods and dimensions are not defaults. reluis-dpc-industrial-guidelines-2012."
      source_ids:
        - reluis-industrial-retrofit-2024
        - reluis-dpc-industrial-guidelines-2012
    - rule_id: boundary_scope
      applies_to: "integration"
      rule: "Own the entire assessed-to-signed-completion interval. Foundations/columns and load-path requirements cannot disappear from a claim of comprehensive compliance. Local preparation, removal/replacement and interface repair remain inside integration, without an independent treatment handover."
      source_ids:
        - reluis-industrial-retrofit-2024
    - rule_id: boundary_resources
      applies_to: "integration"
      rule: "Own direct site, subcontract, rental, freight, personnel travel, test/retest, spares, temporary utilities and waste once; never repurchase a complete provider/material BOM."
      source_ids: []
    - rule_id: boundary_reject
      applies_to: "integration"
      rule: "Correct and retest nonconforming connections within integration; rejected states do not enter N. Failed materials enter actual waste or verified usable returns while incurred burdens remain."
      source_ids: []
    - rule_id: boundary_environment
      applies_to: "integration"
      rule: "Expand dedicated measured elementary exchanges for actual direct water/gas withdrawals and actual releases to air/water/soil; product supply, contained waste and environmental releases are different states."
      source_ids: []
