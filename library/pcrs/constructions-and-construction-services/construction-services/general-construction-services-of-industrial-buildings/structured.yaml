    - id: refine_actual_air_species
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional actual combustion, drilling dust or chemical-use emissions MUST expand measured species/particle fraction and receiving medium into concrete elementary exchanges. Complete species EFs and partial composition models are separate methods; do not invent exhaust pollutants, VOC totals or safety-level emission quantities. Range evidence need: Require actual substance/particle fraction and receiving medium, measured released mass or compatible activity/species factor with units/source, or actual whole-fluid release and evidenced composition/fate. Retain capture/recovery and nonadditive views; no default species, SDS-based emission or repeated factor composition is evidenced. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
