system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers installing and commissioning one conventional wired building fire-alarm system with one control panel, separate detector/manual initiation and notification circuits, and its permanent standby battery pair. Work starts from an accepted design, mounting positions/routes and an existing dedicated isolated mains interface. The installer receives materials, prepares and mounts the panel/devices, routes and terminates wiring, connects and configures the system, corrects defects, completes the actual test schedule and hands over the documented accepted system. The CFP Standard manual is route evidence, not a substitute for the applicable project design or competent acceptance decision (ctec-standard, PDF pages 6–8, 10–13, 15, 17 and 23). Addressable, wireless, two-wire AlarmSense, repeater/network systems, extinguishant control, remote monitoring, upstream building/power provision and post-handover operation/maintenance are excluded. Different panel, zone, device, cable or standby configurations are not automatically functionally equivalent. Installing a component, energising a circuit or recording an inspection is not itself an accepted complete output."
      source_ids:
        - ctec-standard
    - rule_id: boundary_install
      applies_to: "install_accept"
      rule: "One node owns receipt, preparation/mounting, detector and sounder circuit termination, permanent battery connection, configuration, actual tests/corrections and signed acceptance. Phase journals do not create new product exchanges. Keep compatible EOL, mains segregation and screen/earth interfaces in the actual design record."
      source_ids:
        - ctec-standard
    - rule_id: boundary_mains
      applies_to: "alarm_cable_alarm_circuit; alarm_cable_panel_feeder; installation_electricity"
      rule: "Existing dedicated isolated mains provision is an explicit starting interface. Include the actual installer-supplied feeder segment, connection and pre-handover metered use; exclude upstream building distribution works and later operation."
      source_ids:
        - ctec-standard
    - rule_id: boundary_components
      applies_to: "control_panel; smoke_detector; heat_detector; detector_base; manual_call_point; polarised_sounder; end_of_line_device; standby_batteries"
      rule: "Permanent panel power supply/charger, batteries and connected devices are installed product components. They are not reusable tool capital. Disclose accessory inclusions and the actual CFP approval/design battery condition rather than generalising it across models."
      source_ids:
        - ctec-standard
    - rule_id: boundary_residuals
      applies_to: "install_accept"
      rule: "Own every actual reject, correction, usable return and residual exit once. Link original issue/event/transfer and actual receiver. Internal retermination or configuration has no fictitious intermediate output; unclassified missing mass is a gap."
      source_ids: []
    - rule_id: boundary_resources
      applies_to: "owned_equipment_attribution_drill; owned_equipment_attribution_tester; owned_equipment_attribution_external_charger; hired_support_service_access"
      rule: "Identify each shared asset: operator-owned tool/tester/external charger/access equipment and provider-owned services used across jobs/periods. Index every benefiting job and period, from manufacture/acquisition through service, maintenance/replacement to retirement/termination. Preserve actual remaining-use uncertainty. Do not repeat provider asset manufacture."
      source_ids: []
    - rule_id: boundary_packaging
      applies_to: "actual exchanges required by refine_incoming_packaging; actual exchanges required by refine_dry_material_waste"
      rule: "Keep received packaging in a physical source pool even where its manufacture is embedded in landed supply. Add a separate packaging burden only if excluded upstream; never invent a receipt from its outgoing waste."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Accepted conventional design and routes/mounting interfaces; prepared building and major trays; existing dedicated isolated mains supply at an explicitly located interface; supplied components at installer receipt"
  starting_condition_role: "Boundary readiness facts and existing interfaces, not a newly produced exchange or credit"
  product_classification_scope: "The conventional wired single-panel installation/commissioning subset of CPC 3.0 54612"
  recursive_input_rule: "If same-category prior installation enters the job, identify its actual handed-over state and upstream package; do not recursively recreate the accepted service or imply that readiness is a service input. A changed scope requires separate review."
  upstream_dataset_requirement: "Match actual supplied component/SKU/state and geography/technology; require upstream manufacture and landed delivery/packaging disclosure. Separate supply manufacture from foreground installation and prevent duplicated embedded packaging."
  disclosure: "Actual design, starting interfaces, installer feeder responsibility, site/job period, supply datasets and inclusions, accepted configuration/D, resource ownership and unclosed evidence gaps"
