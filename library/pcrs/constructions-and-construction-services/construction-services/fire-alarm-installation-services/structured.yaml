allocation_rules:
  - rule_id: allocate_job
    applies_to: "install_accept"
    rule: "Attribute actual material, electricity, test agent, service and correction burdens to the same accepted configuration/job. Subdivide independently recorded jobs before using a justified causal share. Rejects, repeated tests and failed work do not increase D or escape the job burden. The sole intended product output is accepted_installation; unchanged usable stock is a return rather than an intended co-product."
    source_ids: []
  - rule_id: allocate_returns
    applies_to: "actual exchanges required by refine_unused_product_return; actual exchanges required by refine_incoming_packaging"
    rule: "Preserve gross custody entry and actual unchanged return separately. The upstream consumed-supply numerator is gross issues less evidenced usable returns and remaining stock attributable elsewhere. Return handling/resources remain with this job; do not both net supply and grant a second avoided-product credit. Packaging already embedded in supply has no second manufacture burden."
    source_ids: []
  - rule_id: allocate_asset
    applies_to: "owned_equipment_attribution_drill; owned_equipment_attribution_tester; owned_equipment_attribution_external_charger"
    rule: "For each exact asset manufacture packet use its count times actual job service activity divided by documented same-basis total lifetime activity. Enumerate install_accept and every other consuming job/period; shares reconcile to one over the declared life. Unknown service-life or remaining-use evidence blocks finalized attribution. No whole asset per job, default life or reuse count is allowed."
    source_ids: []
  - rule_id: allocate_period
    applies_to: "owned_equipment_attribution_drill; owned_equipment_attribution_tester; owned_equipment_attribution_external_charger"
    rule: "Use one asset/phase/period index for manufacture/acquisition, all service jobs, maintenance/replacement and retirement/termination. Assign actual maintenance/replacement packets to evidenced benefiting periods or their causal job, with this specific assignment taking precedence over a general lifetime share. Index retirement once and disclose its burden owner. Closed assets use actual history; an in-service remaining-use estimate needs evidence and uncertainty. Do not annualize an already lifetime-attributed packet or count an original and replacement as simultaneous whole inputs."
    source_ids: []
  - rule_id: allocate_service
    applies_to: "hired_support_service_access; installation_electricity"
    rule: "Provider service owns its included rented asset manufacture/maintenance and operating resources. Use actual completed-event shares among all consumers and disclose inclusions; only add electricity or other resources outside that service packet. Owned-asset embodied shares and metered electricity are different packets, each counted once."
    source_ids: []
  - rule_id: allocate_residual
    applies_to: "actual exchanges required by refine_dry_material_waste; rejected_component_waste_panel; rejected_component_waste_detector; rejected_component_waste_heat_detector; rejected_component_waste_base; rejected_component_waste_call_point; rejected_component_waste_sounder; rejected_component_waste_eol; rejected_component_waste_cable; rejected_component_waste_vrla_battery; contaminated_solid_waste_wipe; contaminated_solid_waste_container; contaminated_solid_waste_loose_residue"
    rule: "Declare actual repair, stock return, recycling/recovery receiver or discard for each state; retain collection and any modelled treatment with its disclosed owner. Destination alone grants no automatic recovery/substitution credit. A downstream recovered-product model requires its own evidence and boundary."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "install_accept"
      flow_role: "accepted_installation"
      record_type: "signed acceptance ledger"
      raw_fields: "job/configuration/system IDs; panel/model/zones; exact device BOM; circuit/feeder lengths; battery pair/capacity/approval; design/cause-effect/standby schedule; tests/corrections/normal restoration; status/signature/date; D"
      collection_method: "Inspect the complete installed system against actual design and test/acceptance records. Count only final signed accepted same-configuration systems; keep held/failed/progress records separately."
      unit: "Item(s)"
      frequency: "each system and correction; final closeout"
      temporal_coverage: "actual installation start through signed acceptance"
      site_scope: "one declared site/job and configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed design/BOM/test/restoration record; denominator reconciliation"
    - protocol_id: cp_materials
      process_id: "install_accept"
      flow_role: "physical supplied materials, packaging and usable returns"
      record_type: "receipt/issue/return and installed-state ledger"
      raw_fields: "job/date/event/transfer IDs; supplier/SKU/state; gross/net/tare; count or length; matching kg/item or kg/m evidence; shipment/pack material; upstream inclusions; stock; retained installed mass; usable return; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Weigh net materials with calibrated scales or use traceable same-SKU count/length mass factors. Trace gross custody inputs, actual unchanged returns, stock change and installed state separately; retain packaging physical pool independent of upstream burden owner. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg; Item(s); m"
      frequency: "each receipt/withdrawal/return and final installed BOM"
      temporal_coverage: "all original and correction events through closeout"
      site_scope: "install_accept custody and declared shipment interfaces"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration/tare records; SKU factors; paired transfers; stock and BOM reconciliation"
    - protocol_id: cp_energy
      process_id: "install_accept"
      flow_role: "installation_electricity"
      record_type: "meter interval and user-share ledger"
      raw_fields: "job/date; meter ID/calibration; start/end kWh; supply/charging boundary; installation/test/retest/recharge interval; other users; causal shares; signed acceptance cutoff"
      collection_method: "Read actual supply meters, including external tool charging and pre-handover panel/battery recharge; reconcile shared-user intervals, subtract only evidenced other-user use and exclude post-handover operation."
      unit: "kWh"
      frequency: "each attributable operating/test/charging interval"
      temporal_coverage: "installation start through handover cutoff including corrections"
      site_scope: "actual supply meter boundary serving install_accept"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter readings/calibration; interval coverage; user shares; no battery-Ah substitution"
    - protocol_id: cp_services
      process_id: "install_accept"
      flow_role: "owned_equipment_attribution_drill; owned_equipment_attribution_tester; owned_equipment_attribution_external_charger; hired_support_service_access"
      record_type: "asset/event and lifetime-period attribution ledger"
      raw_fields: "asset/model/serial/owner; manufacture packet/count; job activity; same-basis lifetime activity; all jobs/consumers/periods; maintenance/replacement/retirement event and beneficiaries; remaining-use evidence; service contract/configuration/completion/count; provider resource inclusions; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Index actual asset manufacture/acquisition, every use job/reporting period, actual maintenance/replacement and retirement. Measure job and lifetime activity consistently; identify causal maintenance beneficiaries. For genuine counted hire inspect contract and completed-event count plus all consumer shares; retain true hourly rental quantity for separate review. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "Item(s); actual service activity basis disclosed"
      frequency: "each job/event and each asset-period update"
      temporal_coverage: "job dates plus documented asset life and phase history"
      site_scope: "install_accept and every other consumer of selected resource"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset history/BOM; documented utilization/uncertainty; contract/invoice/completion; reconciled all-consumer shares"
    - protocol_id: cp_residuals
      process_id: "install_accept"
      flow_role: "waste streams and direct airborne species/particles"
      record_type: "residual dispatch, monitoring and constituent ledger"
      raw_fields: "job/date/event; original issue/source pool; material/SKU/state; waste code/recipient/transfer; gross/tare kg; fault/removal/retest; substrate/tool/capture/particle basis/air compartment; test product/SDS/composition; measured consumed/captured/residual quantities; matching factor/activity and uncertainty; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Weigh each dispatched material/state/recipient separately and pair with custody/correction records. For actual air releases measure species/particle mass or use independently supported matching activity/composition/partition methods; distinguish captured waste and usable stock, and never turn unclosed residual into emission. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "each residual event/dispatch and actual emitting test or preparation event"
      temporal_coverage: "all installation/correction events to residual closeout"
      site_scope: "install_accept exits and actual receiving medium/receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighbridge/tare/receiver records; monitored or justified factors; SDS and compatible constituent balance"
  calculation_rules:
    - id: normalize_exchange
      applies_to: "actual exchanges required by refine_incoming_packaging; control_panel; smoke_detector; heat_detector; detector_base; manual_call_point; polarised_sounder; end_of_line_device; standby_batteries; alarm_cable_alarm_circuit; alarm_cable_panel_feeder; fixings_and_containment_screw; fixings_and_containment_anchor; fixings_and_containment_gland; fixings_and_containment_support; fixings_and_containment_containment; fixings_and_containment_label; detector_test_agent; test_cleaning_consumables_wipe; test_cleaning_consumables_cleaning_formulation; hired_support_service_access; actual exchanges required by refine_unused_product_return"
      rule: "normalized quantity = Q / D. Q is the actual attributable material kg or genuine completed service-event count, each separately measured; preserve gross issues, stock and returns before applying allocate_returns to consumed supply."
      inputs:
        - Q
        - D
        - cp_materials
        - cp_services
        - cp_acceptance
      output: "normalized concrete exchange in its original unit per reference flow"
      source_ids: []
    - id: energy_normalize
      applies_to: "installation_electricity"
      rule: "normalized electricity = E_job / D. E_job is measured interval kWh less only evidenced other-user kWh; include attributable pre-handover charging/correction intervals once."
      inputs:
        - "meter start/end"
        - "other-user records"
        - E_job
        - D
        - cp_energy
        - cp_acceptance
      output: "kWh per reference flow"
      source_ids: []
    - id: owned_asset_normalize
      applies_to: "owned_equipment_attribution_drill; owned_equipment_attribution_tester; owned_equipment_attribution_external_charger"
      rule: "normalized manufacture asset fraction = N_asset * A_job / A_life / D. N_asset is the actual count of the exact asset packet; A_job and A_life use the same documented service-activity basis. Maintenance/replacement/retirement packets follow allocate_period separately."
      inputs:
        - N_asset
        - A_job
        - A_life
        - D
        - cp_services
        - cp_acceptance
      output: "attributed Item(s) per reference flow"
      source_ids: []
    - id: residual_normalize
      applies_to: "actual exchanges required by refine_dry_material_waste; rejected_component_waste_panel; rejected_component_waste_detector; rejected_component_waste_heat_detector; rejected_component_waste_base; rejected_component_waste_call_point; rejected_component_waste_sounder; rejected_component_waste_eol; rejected_component_waste_cable; rejected_component_waste_vrla_battery; contaminated_solid_waste_wipe; contaminated_solid_waste_container; contaminated_solid_waste_loose_residue"
      rule: "normalized waste = W_stream / D. W_stream is independently measured net kg at the actual material/state/receiver gate, never an unexplained difference."
      inputs:
        - W_stream
        - D
        - cp_residuals
        - cp_acceptance
      output: "stream-specific waste kg per reference flow"
      source_ids: []
    - id: emission_normalize
      applies_to: "actual exchanges required by refine_airborne_particulate"
      rule: "normalized airborne particulate = P_air / D. P_air is monitored mass or measured activity times an independently supported matching substrate/tool/capture/particle-basis factor; retain source, unit conversion and uncertainty."
      inputs:
        - P_air
        - "matching factor and activity or monitoring"
        - D
        - cp_residuals
        - cp_acceptance
      output: "particle-basis and air-compartment-specific kg per reference flow"
      source_ids: []
    - id: solvent_partition
      applies_to: "actual exchanges required by refine_test_agent_constituent_to_air"
      rule: "normalized constituent emission = S_air / D. Determine S_air from species measurement or actual consumed formulation times exact constituent fraction times independently supported released fraction; reconcile retained/captured/residual fractions on the same constituent basis. Do not default release to all consumption."
      inputs:
        - "actual formulation consumption"
        - "SDS/composition"
        - "partition or species monitoring"
        - S_air
        - D
        - cp_residuals
        - cp_acceptance
      output: "identified species and air-compartment kg per reference flow"
      source_ids: []
    - id: reference_output
      applies_to: "accepted_installation"
      rule: "normalized accepted output = D / D = 1 Item(s). Only final accepted same-configuration systems contribute to D."
      inputs:
        - D
        - cp_acceptance
      output: "1 Item(s) per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_reference
      applies_to: "accepted_installation"
      requirement: "Keep all qualifiers, independently counted D and failed/held work; separate different configurations."
      evidence: "cp_acceptance"
    - id: dq_pools
      applies_to: "all inventory rows"
      requirement: "Retain gross input, stock, retained state, returns and measured residuals by SKU/state/recipient; heterogeneous sums are diagnostics only."
      evidence: "cp_materials; cp_residuals"
    - id: dq_ownership
      applies_to: "owned_equipment_attribution_drill; owned_equipment_attribution_tester; owned_equipment_attribution_external_charger; hired_support_service_access; installation_electricity"
      requirement: "Reconcile manufacture/supply inclusions, all users/periods, actual maintenance/replacement/retirement and remaining-use evidence; avoid duplicate service/electricity packets."
      evidence: "cp_services; cp_energy"
    - id: dq_occurrence
      applies_to: "all inventory rows"
      requirement: "Unknown occurrence, missing measurement or identity is not zero; finalize concrete identity and Energy/Duration support before downstream exchange construction."
      evidence: "actual source and quantity records"
    - id: dq_range_incoming_packaging
      applies_to: "actual exchanges required by refine_incoming_packaging"
      requirement: "Range evidence need: shipment-specific material weights, pack sizes, actual reuse/return history and supplier packaging boundary are required; no universal packaging mass per system is established."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_owned_equipment_attribution
      applies_to: "owned_equipment_attribution_drill; owned_equipment_attribution_tester; owned_equipment_attribution_external_charger"
      requirement: "Range evidence need: exact asset manufacture/BOM, actual maintenance, all consuming jobs/periods, service-life utilization and remaining-use uncertainty are required. No default lifetime, reuse count or generic embodied mass per system is justified."
      evidence: "cp_services; actual matching-domain quantity evidence"
    - id: dq_range_control_panel
      applies_to: "control_panel"
      requirement: "Range evidence need: actual panel mass, count and accessory boundary are required. A single-panel reference does not supply a mass interval covering different models."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_field_alarm_devices
      applies_to: "smoke_detector; heat_detector; detector_base; manual_call_point; polarised_sounder; end_of_line_device"
      requirement: "Range evidence need: actual device-type BOM, compatible SKU masses, circuit loading and design coverage are required; one heterogeneous device total and a universal devices-per-system interval are invalid."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_standby_batteries
      applies_to: "standby_batteries"
      requirement: "Range evidence need: exact battery datasheet, approval/design requirement, accepted pair BOM and actual mass are required. Manufacturer standby Ah examples are neither installation energy nor universal battery consumption ranges."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_alarm_cable
      applies_to: "alarm_cable_alarm_circuit; alarm_cable_panel_feeder"
      requirement: "Range evidence need: actual circuit lengths, core/rating, slack and termination requirements, exact kg/m evidence and cutting/rework records are needed; no universal cable mass per system is established."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_fixings_and_containment
      applies_to: "fixings_and_containment_screw; fixings_and_containment_anchor; fixings_and_containment_gland; fixings_and_containment_support; fixings_and_containment_containment; fixings_and_containment_label"
      requirement: "Range evidence need: accepted configuration, actual installed/issued counts and SKU masses are required; prepared major supports and building structure cannot supply a new-material interval."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_detector_test_agent
      applies_to: "detector_test_agent"
      requirement: "Range evidence need: compatible product/SDS, actual can mass changes and same-method dose observations are required; no verified generic grams-per-test factor is available."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_test_cleaning_consumables
      applies_to: "test_cleaning_consumables_wipe; test_cleaning_consumables_cleaning_formulation"
      requirement: "Range evidence need: actual object/event coverage, SKU and issued/returned/residue/wipe measurements are required; dose observations apply only to the same device and method."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_installation_electricity
      applies_to: "installation_electricity"
      requirement: "Range evidence need: actual meter intervals, background supply/charging ownership, other users, accepted-system attribution and comparable observed kWh/reference records are required. Energy/kWh identity support is unresolved; no source-backed range is available."
      evidence: "cp_energy; actual matching-domain quantity evidence"
    - id: dq_range_hired_support_service
      applies_to: "hired_support_service_access"
      requirement: "Range evidence need: actual event definition or hourly contract, configuration/capacity, provider inclusions and all consumer shares are required. Hourly Duration is unresolved and is not covered by this count unit."
      evidence: "cp_services; actual matching-domain quantity evidence"
    - id: dq_range_unused_product_return
      applies_to: "actual exchanges required by refine_unused_product_return"
      requirement: "Range evidence need: linked measured gross issues, unchanged state and actual returns by SKU are required; no default return fraction or automatic credit is established."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_dry_material_waste
      applies_to: "actual exchanges required by refine_dry_material_waste"
      requirement: "Range evidence need: weighed stream-specific manifests, source-pool links and actual diversion routes are required. Nominal component mass gives no waste-rate interval."
      evidence: "cp_residuals; actual matching-domain quantity evidence"
    - id: dq_range_rejected_component_waste
      applies_to: "rejected_component_waste_panel; rejected_component_waste_detector; rejected_component_waste_heat_detector; rejected_component_waste_base; rejected_component_waste_call_point; rejected_component_waste_sounder; rejected_component_waste_eol; rejected_component_waste_cable; rejected_component_waste_vrla_battery"
      requirement: "Range evidence need: actual fault, removal/retest, original issue, classification and weighed dispatch records are required. There is no default defect rate; zero requires complete event coverage."
      evidence: "cp_residuals; actual matching-domain quantity evidence"
    - id: dq_range_contaminated_solid_waste
      applies_to: "contaminated_solid_waste_wipe; contaminated_solid_waste_container; contaminated_solid_waste_loose_residue"
      requirement: "Range evidence need: formulation-specific residue, container tare, wipe mass and recipient acceptance are required; no all-chemical evaporation assumption is valid."
      evidence: "cp_residuals; actual matching-domain quantity evidence"
    - id: dq_range_airborne_particulate
      applies_to: "actual exchanges required by refine_airborne_particulate"
      requirement: "Range evidence need: matching substrate/tool/capture, particle-size basis, activity and release-factor/monitoring evidence are required; generic dust or balancing-loss quantities are unavailable."
      evidence: "cp_residuals; actual matching-domain quantity evidence"
    - id: dq_range_test_agent_constituent_to_air
      applies_to: "actual exchanges required by refine_test_agent_constituent_to_air"
      requirement: "Range evidence need: exact product/SDS, constituent composition and delivered/captured/residual fractions are required. No generic aerosol/VOC interval or air subcompartment is inferred."
      evidence: "cp_residuals; actual matching-domain quantity evidence"
    - id: dq_range_accepted_installation
      applies_to: "accepted_installation"
      requirement: "Range evidence need: 1 Item(s) is the exact normalized reference output, not an observed yield range. Accepted denominator, failed/held work and configuration separation require traceable records."
      evidence: "cp_acceptance; actual matching-domain quantity evidence"
    - id: refine_incoming_packaging
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Keep packaging received with components, batteries, cable and consumables in a physical custody pool linked to its shipment. Weigh each material or use verified pack counts and tare. Create a separate burden-bearing input only where the landed component dataset excludes that packaging; embedded packaging manufacture is already owned upstream. Reconcile reuse, return, stock and waste without deriving receipts from waste exits. Quantity calculation is specified in section 8 normalize_exchange. Range evidence need: shipment-specific material weights, pack sizes, actual reuse/return history and supplier packaging boundary are required; no universal packaging mass per system is established. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual material/pack/shipment custody, verified net mass/count and tare, real reuse/return/stock/waste, upstream included packaging has physical audit only, no waste-to-receipt inference."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_owned_equipment_attribution
      applies_to: "owned_equipment_attribution_drill; owned_equipment_attribution_tester; owned_equipment_attribution_external_charger"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Identify each actual drilling/cable preparation tool, tester, external equipment charger or access asset by model and serial number. Measure job service activity and the documented lifetime activity on the same basis; apply owned_asset_normalize to the manufacture packet of that exact asset. Link actual maintenance, replacement and retirement packets to their benefiting jobs/periods under section 7. The permanent panel charger and standby batteries are installed components; rented equipment is owned by the provider service. This is an attributed Item(s) fraction, not installed mass or a whole tool consumed per job. Quantity calculation is specified in section 8 owned_asset_normalize. Range evidence need: exact asset manufacture/BOM, actual maintenance, all consuming jobs/periods, service-life utilization and remaining-use uncertainty are required. No default lifetime, reuse count or generic embodied mass per system is justified. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual cable-preparation tool functions and access-asset types need exact model/function/life packet; permanent panel charger and standby batteries installed components, rented assets provider-owned. Use owned_asset_normalize fraction N_asset*A_job/A_life/D, maintenance/replacement/retirement by allocate_period."
      evidence: "cp_services; actual independent records and identity/unit evidence"
    - id: refine_alarm_cable
      applies_to: "alarm_cable_alarm_circuit; alarm_cable_panel_feeder"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Identify each actual fire-resistant screened alarm cable by construction and rating. Retain measured route, termination slack, issued length, offcuts and replacement length; obtain kg using direct weighing or the matching SKU kg/m factor. Record a panel feeder only for the segment actually supplied by this installer downstream of the agreed isolated mains interface. Existing dedicated supply and major trays are starting-condition assets, not new cable consumption. Quantity calculation is specified in section 8 normalize_exchange. Range evidence need: actual circuit lengths, core/rating, slack and termination requirements, exact kg/m evidence and cutting/rework records are needed; no universal cable mass per system is established. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Different actual construction/core/rating SKUs require independent records; same physical SKU/segment not bought twice across roles. Retain route/slack/cut/rework and exact kg/m auxiliary factor."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_fixings_and_containment
      applies_to: "fixings_and_containment_screw; fixings_and_containment_anchor; fixings_and_containment_gland; fixings_and_containment_support; fixings_and_containment_containment; fixings_and_containment_label"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Instantiate actual supplied screws, anchors, glands, supports, short containment and labels separately. Weigh each material/SKU or use its measured unit mass and actual issue count. Link installed counts to the accepted wall/routes and distinguish prepared building structure or major existing trays. Cable-entry preparation and screen/earth terminations remain assembly duties, not a separate fabricated product. Quantity calculation is specified in section 8 normalize_exchange. Range evidence need: accepted configuration, actual installed/issued counts and SKU masses are required; prepared major supports and building structure cannot supply a new-material interval. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual distinct containment functions/models require own SKU/unit; prepared major supports/building structure starting interface, no separately fabricated-product gate from cable entry/earth termination."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_test_cleaning_consumables
      applies_to: "test_cleaning_consumables_wipe; test_cleaning_consumables_cleaning_formulation"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Include only actual consumed wipes, cleaning products or other reset/test materials. Record the cleaned/tested object and event, exact SKU, issues, unused returns, container tare and residue; quantify net product mass by weighing or matching SKU factor. A reused reset key or tester is equipment, not consumable material. Separate wipe substrate, supplied formulation and outgoing contamination to avoid counting the same constituent twice. Quantity calculation is specified in section 8 normalize_exchange. Range evidence need: actual object/event coverage, SKU and issued/returned/residue/wipe measurements are required; dose observations apply only to the same device and method. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual reset/test materials need exact SKU and one native unit; reusable reset key/tester are equipment. Prewetted complete wipe includes supplied formulation once; keep actual object/event/dose records."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_hired_support_service
      applies_to: "hired_support_service_access"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Use this counted card only for an actual complete provider-defined event with explicit equipment/configuration and deliverable, evidenced by contract and completion record. Count completed events and their actual consumer share under cp_services. A real hourly rental retains its true quantity and requires scope/measurement review and verified Duration support; never convert hours into an invented Item(s) event. Record provider manufacture, maintenance, fuel and electricity inclusions before adding any separate resource. Quantity calculation is specified in section 8 normalize_exchange. Range evidence need: actual event definition or hourly contract, configuration/capacity, provider inclusions and all consumer shares are required. Hourly Duration is unresolved and is not covered by this count unit. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual contracted equipment functions/native references require precise complete provider-reference identity and unit. A real hourly rental is not Count; retain manufacture/maintenance/fuel/electricity scope once."
      evidence: "cp_services; actual independent records and identity/unit evidence"
    - id: refine_unused_product_return
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record actual usable unchanged components, cable, consumables or reusable packaging that leave installer custody. Preserve original SKU/state and recipient, and measure net mass by weighing or exact count/length-to-mass factor. Pair the return transfer with its original issue. Keep gross issues and returns as auditable observations; charge net consumed upstream supply once under section 7 without deducting the return twice. Failed or contaminated items are not usable returns. Quantity calculation is specified in section 8 normalize_exchange. Range evidence need: linked measured gross issues, unchanged state and actual returns by SKU are required; no default return fraction or automatic credit is established. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual unchanged usable SKU/state/recipient matched to original issue and native kg for mass supplies; verified count/length conversion auxiliary only, actual gross/net bridge once, failed/contaminated items not usable."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_dry_material_waste
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Weigh each real dry material stream with container tare and dispatch evidence, retaining material, state and actual receiver. Link packaging waste to its received physical pool even when packaging burden is embedded upstream. Keep captured dust in the applicable waste stream; an actual atmospheric fraction is distinct. Separate recycling destination evidence from any downstream treatment/recovery model; do not claim an avoided-product credit here. Quantity calculation is specified in section 8 residual_normalize. Range evidence need: weighed stream-specific manifests, source-pool links and actual diversion routes are required. Nominal component mass gives no waste-rate interval. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual dry stream/substrate/composite/state/receiver with tare and source custody; captured dust waste, independent air fraction separate; no downstream avoided-product credit."
      evidence: "cp_residuals; actual independent records and identity/unit evidence"
    - id: refine_rejected_component_waste
      applies_to: "rejected_component_waste_panel; rejected_component_waste_detector; rejected_component_waste_heat_detector; rejected_component_waste_base; rejected_component_waste_call_point; rejected_component_waste_sounder; rejected_component_waste_eol; rejected_component_waste_cable; rejected_component_waste_vrla_battery"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Link each nonusable panel, detector/base, manual call point, sounder/EOL part, damaged cable assembly or failed battery to its original issue, defect and correction event. Weigh each actual waste state or use exact SKU count/mass, with dispatch and authorised recipient. Keep battery, electronic and cable wastes separate. Internal repair is not a new product transfer; usable unchanged parts return under actual exchanges required by refine_unused_product_return. Quantity calculation is specified in section 8 residual_normalize. Range evidence need: actual fault, removal/retest, original issue, classification and weighed dispatch records are required. There is no default defect rate; zero requires complete event coverage. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual component/SKU/hazard/receiver records require refinement; each physical complete assembly includes internal parts once. Link original issue, defect/correction/removal, authorized recipient; internal repair no new product transfer, usable unchanged return not waste."
      evidence: "cp_residuals; actual independent records and identity/unit evidence"
    - id: refine_contaminated_solid_waste
      applies_to: "contaminated_solid_waste_wipe; contaminated_solid_waste_container; contaminated_solid_waste_loose_residue"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record each actual contaminated wipe/container or residual formulation stream at its accepted waste receiver, with composition, physical state, gross mass and tare. Distinguish clean recyclable packaging and usable returns. Reconcile the supplied wipe/formulation constituent pool with retained residue and any independently evidenced emission. Gross chemical issues are not automatically evaporation. Quantity calculation is specified in section 8 residual_normalize. Range evidence need: formulation-specific residue, container tare, wipe mass and recipient acceptance are required; no all-chemical evaporation assumption is valid. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual chemistry/state/hazard/receiver differences need individual records; keep original constituent pool and independent emission reconciliation, gross chemical issue not full evaporation."
      evidence: "cp_residuals; actual independent records and identity/unit evidence"
    - id: refine_airborne_particulate
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Activate only for a measured or independently supported atmospheric release from actual drilling/cable preparation. Identify substrate/material, tool, capture control, particle-size/fraction basis and actual receiving air compartment. Quantify by monitoring or a matching material/tool/control-specific factor times measured activity, then apply emission_normalize. Captured dust remains waste; never use unexplained custody residuals as an air release. Quantity calculation is specified in section 8 emission_normalize. Range evidence need: matching substrate/tool/capture, particle-size basis, activity and release-factor/monitoring evidence are required; generic dust or balancing-loss quantities are unavailable. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_residuals; actual independent records and identity/unit evidence"
    - id: refine_test_agent_constituent_to_air
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: For actual physically consumed test agent, identify each substance and receiving subcompartment before defining an elementary exchange. Use species monitoring or a product-specific SDS composition and evidenced delivered/captured/residual partition method under solvent_partition. Keep constituent quantities compatible with the consumed formulation pool. Neither device-test count, an undifferentiated VOC label nor a 100% release assumption establishes substance mass or destination. Quantity calculation is specified in section 8 solvent_partition. Range evidence need: exact product/SDS, constituent composition and delivered/captured/residual fractions are required. No generic aerosol/VOC interval or air subcompartment is inferred. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_residuals; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
validation_rules:
  - rule_id: validate_gate
    applies_to: "accepted_installation"
    rule: "Require all reference qualifiers, positive D and signed complete acceptance. Confirm actual initiation/notification and cause/effect, fault/mains-failure/standby and final restored-normal-state records against the project acceptance schedule. A programmed test mode or a component check is not whole-system acceptance."
    source_ids:
      - ctec-standard
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Before a downstream exchange is finalized, verify each actual SKU/material/state/recipient or species/air-compartment identity and compatible property/unit. Conditional umbrellas expand to zero, one or multiple concrete exchanges according to actual occurrence; unknown is not zero. Count support does not verify a service UUID."
    source_ids: []
  - rule_id: validate_quantity
    applies_to: "all inventory rows"
    rule: "Match each raw numerator, unit, CP, applicable section 8 calculation and common D. Check separate gross/return/stock/retained/residual pools; reject mixed-material UUIDs, mass conversion of electricity and event conversion of hourly rent. Missing compatible Energy or Duration support remains an explicit gap."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "rejected_component_waste_panel; rejected_component_waste_detector; rejected_component_waste_heat_detector; rejected_component_waste_base; rejected_component_waste_call_point; rejected_component_waste_sounder; rejected_component_waste_eol; rejected_component_waste_cable; rejected_component_waste_vrla_battery; accepted_installation"
    rule: "Link original component/cable/battery defect, repair/replacement, repeat test and actual exit to install_accept. Keep failed/held work out of D while retaining its burdens. Every exit has actual state and receiver; no undocumented recovery path or credit."
    source_ids: []
  - rule_id: validate_shared_period
    applies_to: "owned_equipment_attribution_drill; owned_equipment_attribution_tester; owned_equipment_attribution_external_charger; hired_support_service_access"
    rule: "Reconcile all resource consumers and periods, actual service-life shares and manufacture/maintenance/replacement/retirement event ownership. Missing remaining-use/replacement/termination evidence blocks finalized attribution. Prevent whole-tool defaults, repeated lifetime/annual allocation and duplicates across provider service, owned assets and electricity."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "all inventory rows"
    rule: "Preserve each role-specific range evidence need in section 8. A manufacturer design limit, nominal factor or exact 1 Item(s) reference is not an empirical quantity interval. Missing ranges remain disclosed; do not manufacture bounds to make a validation warning disappear."
    source_ids: []
  - rule_id: atomization_incoming_packaging_complete
    applies_to: "actual independently refined exchanges"
    rule: "Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying refine_incoming_packaging with actual records; unresolved required expansion blocks the dataset."
