    applies_to: "material_transport; installer_travel; tool_access_drill; tool_access_extraction; tool_access_lifting; tool_access_electrical_test; site_electricity"
    rule: "Use job-resolved records first. If visits, meter periods or equipment are shared, identify all consumers, period and an evidenced physical driver; reconcile totals and count each burden once. Record material attribution uncertainty instead of applying an arbitrary equal split."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_components
      process_id: "install_test_handover"
      flow_role: "heater package and separately supplied component inputs"
      record_type: "receipt and issue reconciliation"
      raw_fields: "job_id; model; serial; package_BOM; substrate; fixing_schedule; issued_items; issued_mass; usable_return_exit_id; replacement_id; upstream_coverage; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Inspect supplier package and approved instructions; reconcile gross issue records and separately weighed usable return exits; weigh separate material parts or retain traceable manufacturer part mass; distinguish prior supply interface; Aggregation procedure: per reference flow; sum gross actual job-owned component inputs; keep usable returned materials as separate exits without net subtraction or duplicated supplied bracket/lead Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "Item(s); kg"
      frequency: "every receipt, issue and return"
      temporal_coverage: "complete installation job including corrections"
      site_scope: "identified site and job"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier BOM and delivery note; scale calibration; substrate/fixing record"
    - protocol_id: cp_resources
      process_id: "install_test_handover"
      flow_role: "site electricity and conditional tool access"
      record_type: "meter and equipment service log"
      raw_fields: "job_id; meter_id; start_reading; end_reading; test_start; test_end; test_mode; tool_id; access_hours; shared_consumers; attribution_driver; provider_coverage; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Read traceable meters for job/test; separate other loads; log tool use and provider boundary; retain allocation evidence for shared periods; Aggregation procedure: per reference flow; aggregate attributable measured job electricity and provider-owned equipment hours once Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kWh; h"
      frequency: "each tool/test event and corrective event"
      temporal_coverage: "arrival through signed handover"
      site_scope: "identified site, meter and equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter accuracy; readings; test log; provider/service-boundary record"
    - protocol_id: cp_transport
      process_id: "install_test_handover"
      flow_role: "conditional freight and installer travel across declared shared job/visit periods"
      record_type: "dispatch and travel log"
      raw_fields: "job_id; movement_id; mode; origin; destination; distance; consignment_mass; passengers; shared_jobs; attribution_driver; upstream_delivery"
      collection_method: "Reconcile carrier notes and actual itineraries; distinguish material freight from personnel movement; retain shared-visit driver and empty-leg ownership; Aggregation procedure: per reference flow; sum attributable mode-specific services after checking upstream coverage"
      unit: "t*km; person*km"
      frequency: "each movement"
      temporal_coverage: "complete installation and corrective visits"
      site_scope: "actual route to identified site"
      aggregation_rule: "per reference flow"
      quality_evidence: "carrier note; route record; passenger/consignment log; allocation reconciliation"
    - protocol_id: cp_acceptance
      process_id: "install_test_handover"
      flow_role: "accepted reference output and job starting conditions"
      record_type: "inspection and signed test record"
      raw_fields: "job_id; model; serial; substrate; preprepared_holes; bracket; fixings; orientation; clearances; supply; isolation; earth_test; electrical_tests; heat_test; control_setup; acceptance; timestamp"
      collection_method: "Competent installer records applicable manufacturer and project acceptance criteria, interface readiness, electrical and functional test results and signed handover; unresolved failure is not accepted; Aggregation procedure: per reference flow; exactly one accepted installation"
      unit: "Item(s)"
      frequency: "each installation and retest"
      temporal_coverage: "complete job to acceptance"
      site_scope: "same model/configuration/site as inventory"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed installation/test sheet; photographs; competent electrician record"
    - protocol_id: cp_exits
      process_id: "install_test_handover"
      flow_role: "intact appliance/material returns, packaging, drilling debris and electrical waste"
      record_type: "return and waste transfer record"
      raw_fields: "job_id; exit_id; serial_or_material; state; quantity; mass; recipient; treatment; upstream_coverage; rework_id; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Separate intact product return from waste; weigh actual waste by material; link exit to receiver and producing job; reconcile captured debris and airborne release separately; Aggregation procedure: per reference flow; sum physical exits once with traced ownership; rework stays within node Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "Item(s); kg"
      frequency: "every exit and correction"
      temporal_coverage: "complete job including returns"
      site_scope: "identified installation and receiving route"
      aggregation_rule: "per reference flow"
      quality_evidence: "return acceptance; calibrated mass evidence; waste transfer/receiver record"
    - protocol_id: cp_releases
      process_id: "install_test_handover"
      flow_role: "conditional drilling and initial heat-up air releases"
      record_type: "characterization and missing-data disclosure"
      raw_fields: "job_id; drilling_state; substrate; species; particle_basis; air_compartment; capture; test_interval; release_quantity; method; detection_limit; missing_characterization; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "For actual drilling obtain substance/particle and capture-specific evidence; for first heat-up seek defensible product-specific substance/quantity evidence; record uncertainty and missing coverage without inventing a VOC or zero; Aggregation procedure: per reference flow; aggregate characterized emissions by substance and compartment; retain unquantified potential releases as incomplete coverage Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "each drilling/initial heat-test scenario"
      temporal_coverage: "installation drilling and limited heat-test only"
      site_scope: "actual substrate/product and indoor receiving environment"
      aggregation_rule: "per reference flow"
      quality_evidence: "method validation; measurement report; detection limits; documented no-drilling condition; disclosure of gaps"
  calculation_rules:
    - id: job_normalization
      applies_to: "all inventory rows"
      rule: "Aggregate actual job-owned quantities per reference flow; use accepted service count of the same configuration for a multi-installation job, after recording resource attribution and failed/pending states. Do not merge different heater models as equivalent without evidence."
      inputs:
        - cp_components
        - cp_resources
        - cp_transport
        - cp_acceptance
        - cp_exits
        - cp_releases
      output: "inventory per reference flow"
      source_ids: []
    - id: receipt_exit_reconcile
      applies_to: "heater_package; returned_heater; electrical_waste_heater"
      rule: "Reconcile physical appliance receipts, accepted installed serials, intact supplier returns, discarded units and remaining job stock; retain rework within the same job and prevent duplicate input/output treatment."
      inputs:
        - cp_components
        - cp_acceptance
        - cp_exits
      output: "serial-resolved appliance reconciliation"
      source_ids: []
  data_quality_requirements:
    - id: configuration
      applies_to: "all inventory rows"
      requirement: "Keep heater type, model, package coverage, wall substrate, fastening and supply conditions aligned; the manufacturer example is not a universal BOM."
      evidence: "cp_components; cp_acceptance; dimplex-plxe-series-c-issue7"
    - id: resource_coverage
      applies_to: "site_electricity; material_transport; installer_travel; tool_access_drill; tool_access_extraction; tool_access_lifting; tool_access_electrical_test"
      requirement: "Cover job and corrective events; separate installation and normal-use energy; disclose supplier gates and shared-event attribution."
      evidence: "cp_resources; cp_transport"
    - id: release_coverage
      applies_to: "actual exchanges required by refine_airborne_drilling_release; actual exchanges required by refine_initial_heat_release"
      requirement: "Unknown pollutant identity or amount remains a direct-emission completeness gap. Do not equate odour to a substance or claim zero without valid evidence."
      evidence: "cp_releases; dimplex-plxe-series-c-issue7"
    - id: acceptance_trace
      applies_to: "accepted_installation; returned_heater; electrical_waste_heater"
      requirement: "Signed acceptance, reject path and quantities must reconcile; unaccepted jobs cannot silently disappear from resources or accepted denominator."
      evidence: "cp_acceptance; cp_exits"
    - id: refine_fixings_connections
      applies_to: "fixings_connections_screw; fixings_connections_anchor; fixings_connections_terminal; fixings_connections_connector_box"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record actual separately supplied screws, anchors, connection terminals, connector boxes or other permitted connection consumables. Split the conditional umbrella into actual materials and identities; do not invent a universal kit. Existing fused spur and fixed wiring are declared prior interfaces. Range evidence need: actual substrate and supplier-approved fastening/connection schedule determine quantities; four bracket holes in this example do not determine every model BOM. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other permitted actual consumables/SKUs need identities and independent quantity; existing fused spur/fixed wiring prior interface, no universal kit or bracket-hole count proxy."
      evidence: "cp_components; actual independent records and identity/unit evidence"
    - id: refine_tool_access
      applies_to: "tool_access_drill; tool_access_extraction; tool_access_lifting; tool_access_electrical_test"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional on reusable drill, extraction, lifting or electrical-test equipment whose service burden is included. Identify tool/provider and service boundary; consumables already included in the provider dataset are not duplicated. Range evidence need: actual tools and operating records determine access duration; no universal lifetime or hours-per-heater estimate is supported. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Any other actual equipment/function or different native reference needs independent exact identity/property/unit; included consumables/energy not charged again."
      evidence: "cp_resources; actual independent records and identity/unit evidence"
    - id: refine_usable_material_returns
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional product exit for intact reusable packaging or unused suitable fixing/connection parts returned to supplier or controlled stock. Split by actual material, usable state and recipient. This is neither heater appliance count nor waste. Range evidence need: usable state, material and measured return records determine actual mass; no universal return/reuse fraction or automatic avoided-production credit is supported. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual outward usable SKU/state/recipient matched to original native property/unit; no retained stock, no heater count or waste and no avoided-production credit."
      evidence: "cp_exits; actual independent records and identity/unit evidence"
    - id: refine_packaging_waste
      applies_to: "packaging_waste_protective_film"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record packaging and removed protective film by actual material and licensed or project-approved destination. Intact reusable packages crossing back to supplier or stock leave by actual exchanges required by refine_usable_material_returns and are excluded from waste. Range evidence need: weigh actual packaging for the chosen model; the manual gives no packaging mass or recycling fraction. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual other packaging material/composite and receiver roster; reusable intact returns and retained stock excluded, no guessed proportions or recovery."
      evidence: "cp_exits; actual independent records and identity/unit evidence"
    - id: refine_drilling_debris
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional on actual new fixing holes or consumable losses. Record wall substrate, captured fraction, extraction method and waste destination; verified preprepared holes may make drilling absent. Range evidence need: hole/substrate and collection evidence must establish debris quantities; no generic concrete or gypsum mass is assumed. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual captured drilling residue by substrate/composite/state/receiver and each spent consumable; actual preprepared holes may establish no drilling, not assumed zero."
      evidence: "cp_exits; actual independent records and identity/unit evidence"
    - id: refine_electrical_waste
      applies_to: "electrical_waste_heater"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional damaged or unrepairable appliances/components sent to an authorized electrical-waste route. Intact supplier returns remain product flows; waste must not be relabelled as an installed output. Range evidence need: measured waste and failure records are required; no default defect or recovery rate is supported. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual separately discarded electrical components require exact complete component/SKU/state and receiver; no default failure rate, no internal BOM duplicate."
      evidence: "cp_exits; actual independent records and identity/unit evidence"
    - id: refine_airborne_drilling_release
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional on drilling. The actual substrate, emitted substance or particle-size basis, receiving-air compartment, extraction and capture efficiency must be established before creating concrete elementary exchanges. Captured solid debris remains waste. Range evidence need: substrate, particle-size/species and capture evidence are unresolved until foreground characterization; a universal dust interval would misstate identity and exposure. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_releases; actual independent records and identity/unit evidence"
    - id: refine_initial_heat_release
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: The manufacturer reports possible initial heat-up odour but identifies no chemical substance, emission factor or quantity. Retain the potential commissioning release as a characterization requirement; odour alone is not a VOC identity or proof of zero release. Range evidence need: neither substance nor quantity is specified by the manual; no generic VOC, arbitrary mass range or zero may replace the missing evidence. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual initial-heat-up species/receiving indoor air compartment/quantity evidence; retain potential characterization obligation, no generic VOC, assumed emission or zero."
      evidence: "cp_releases; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
