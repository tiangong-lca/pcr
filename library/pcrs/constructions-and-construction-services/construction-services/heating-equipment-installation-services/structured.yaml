allocation_rules:
  - rule_id: single_service
    applies_to: "accepted_installation"
    rule: "Attribute the installation-job inventory to accepted installations of the same configuration. There is no saleable heat co-product from the short test; do not credit incidental room warming."
    source_ids: []
  - rule_id: reject_burdens
    applies_to: "returned_heater; actual exchanges required by refine_usable_material_returns; electrical_waste_heater; install_test_handover"
    rule: "Retain corrective-work resources, failed commissioning and replacement handling attributable to the accepted job. Record intact supplier/material-return burden ownership and any supplier credit explicitly; no automatic avoided-production or recycling credit. Never count failed/pending units as accepted outputs."
    source_ids: []
