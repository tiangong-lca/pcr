  classification_refs: "cpc:3.0:54631; Heating equipment installation services; proposed narrower relation, subject to semantic acceptance"
  covered_products: "First fixed Class I wall installation and tested handover of a packaged resistive electric panel convector"
  excluded_products: "New circuits and supply remediation; hydronic systems; boilers; heat pumps; freestanding appliances; normal use; replacement/repair service"
  representative_product: "Class I panel convector supplied with manufacturer-matched H-frame and fitted supply lead; Dimplex PLXE Series C is illustrative"
  production_route: "Verify prepared interfaces; inspect package; mark and drill actual fixing holes if needed; secure H-frame; engage hooks and locking clips; fixed electrical connection; electrically verify; initialize controls; limited heat test; signed acceptance"
  market_state: "Installed, connected, tested and accepted service at site handover; neither an appliance at factory gate nor delivered lifetime heat"
functional_unit:
  what: "Accepted first installation of one Class I wall-mounted resistive electric panel convector"
  how_much: "One accepted installation of one declared appliance"
  how_well: "Matched H-frame secured to declared substrate; correct orientation, retention and model clearances; suitable isolated supply and protective earth; actual recorded electrical and functional heat-test acceptance; controls initialized; signed handover"
  how_long_or_cycle: "One installation job including its attributable corrective work and limited commissioning, ending at acceptance; no heating service-life output"
  reference_flow_link: "accepted_installation"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers first installation of a packaged Class I wall-mounted resistive electric panel convector at an existing prepared wall and suitable isolated fixed electrical connection point. The service includes incoming condition checks, use of the matched manufacturer bracket, substrate-compatible fixing, upright mounting and retention checks, fixed electrical connection by a competent electrician, protective-earth and required electrical verification, initial control setup, limited functional heat test, cleanup and signed handover. The installed appliance and actual added components are upstream inputs to this service; disclose that boundary to avoid adding them twice in a construction model. This scope is restricted to Class I appliances requiring protective earth; Class II appliances are excluded. The Dimplex PLXE Series C Issue 7 manual provides an illustrative model within that Class I route, not a universal appliance specification. Its pages 3 and 7 require an earth connection and suitable fixed wiring; pages 8-9 describe the supplied H-frame, fixings, hooks and locked clips; page 10 describes first-power setup and possible initial odour. Use the actual model's current instructions and preserve equivalent evidence. New branch circuits, supply upgrades, hydronic distribution, boilers, heat pumps, freestanding heaters, repair/replacement of existing heaters, and normal heating use after handover are excluded. A missing compliant supply or adequate wall is a scope failure, not an omitted installation operation."
      source_ids: []
    - rule_id: start_interfaces
      applies_to: "install_test_handover"
      rule: "Reject scope if suitable wall or fixed supply is absent. Record interface evidence; do not hide new circuit, wall strengthening or predrilling work as zero."
      source_ids:
        - dimplex-plxe-series-c-issue7
    - rule_id: mount_connect
      applies_to: "install_test_handover"
      rule: "Include actual heater package and separate added fastening/connection roles; use matched bracket, orientation, clearances, hook engagement and locks, competent fixed connection and protective earth for the documented Class I route."
      source_ids:
        - dimplex-plxe-series-c-issue7
    - rule_id: commissioning_gate
      applies_to: "install_test_handover"
      rule: "Include installation electricity, control initialization, electrical verification, limited heat test and corrective work before signed acceptance; exclude routine heating after handover. Record actual pass criteria and results, not a claimed lifetime heating performance."
      source_ids: []
    - rule_id: direct_releases
      applies_to: "actual exchanges required by refine_airborne_drilling_release; actual exchanges required by refine_initial_heat_release"
      rule: "Include characterized releases from actual drilling and first heat-up. Possible odour requires disclosure and characterization; unknown emissions are incomplete coverage, not a zero or a generic VOC."
      source_ids: []
    - rule_id: logistics_tools
      applies_to: "material_transport; installer_travel; tool_access_drill; tool_access_extraction; tool_access_lifting; tool_access_electrical_test"
      rule: "Include attributable delivery, installer visits and reusable equipment service when incurred and owned by this boundary; disclose upstream inclusion, visit sharing and provider coverage to prevent duplication."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "Shared infrastructure disclosure: when visits, meter periods or reusable tool services cross job periods, record the shared asset/service id, this installation node and every other consuming job, the common period and the evidenced attribution driver. The provider owns equipment life-cycle inventory; this node records attributable access service. No tool lifetime is invented. Reconcile all job shares to the single shared total."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Existing accepted wall/substrate and suitably rated isolated fixed supply/connection point; packaged heater and additional components at their declared supply gates"
  starting_condition_role: "Prior site interfaces plus incoming product gates; wall and new circuit construction are not claimed by this installation record"
  product_classification_scope: "Only the defined narrower Class I resistive panel-heater installation service within heating-equipment installation"
  recursive_input_rule: "An input same-category subcontract installation service must replace its evidenced work package; either use that service or its disaggregated inventories, never both for the same physical work"
  upstream_dataset_requirement: "Match actual heater package, supplied bracket/lead, added parts, electricity, travel/freight and declared tool service; link waste to its receiving treatment with documented boundary ownership"
  disclosure: "Declare wall/supply readiness, drilling state, component/package and delivery coverage, regional electricity, tests and rejected-unit routes, tool/travel attribution and missing direct-release characterization"
