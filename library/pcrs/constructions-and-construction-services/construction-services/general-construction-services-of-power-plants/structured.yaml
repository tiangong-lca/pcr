    - id: calc_asset
      applies_to: "atomic_shared_asset_service"
      rule: "Choose exactly one verified actual upstream view. Asset-equivalent view: native quantity = actual job driver / whole-life driver and upstream burden per asset-equivalent = manufacture + maintenance + replacements + end-of-life. Lifecycle-complete service-per-driver view: native service quantity = actual job driver and upstream burden per native driver unit = full-life burden / whole-life driver. Both yield job burden = full-life burden times actual job driver / whole-life driver. Verify the actual native unit and coverage before selecting; never mix hours with dimensionless share. Use complete observed life or observed history plus sourced evidenced remainder/replacements/termination/EOL over ALL jobs/nodes/periods, with uncertainty, sensitivity and update. Divide the chosen native quantity by N exactly once."
