system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers the finite functional replacement and recommissioning of an identified existing utility-scale ground-mounted photovoltaic central-inverter station, retaining qualified arrays, civil foundation, compatible existing medium-voltage transformer (MVT) and grid interface. The service changes an existing generating station rather than delivering a new power plant or an inverter alone. Its output requires actual compatibility evidence and signed operator acceptance after all approved functional gates. [sma-utility-repowering; sma-pv-commissioning; epri-inverter-repowering-abstract-2024] The manufacturer offers a retained-MVT central-inverter route and a different whole-station route when an MVT cannot be saved. Only the former is covered. “Compatible with most” is not verification for an actual station. Exclude rooftop/home/string-only inverters, batteries, module or array replacement, MVT replacement, factory inverter repair, whole new plant construction and subsequent electricity generation. No brochure voltage, warranty, energy uplift or lifetime promise becomes a universal design rule. [sma-utility-repowering]"
      source_ids:
        - sma-utility-repowering
        - sma-pv-commissioning
        - epri-inverter-repowering-abstract-2024
    - rule_id: scope_gate
      applies_to: "Retained interfaces"
      rule: "Include only an actual existing utility ground-PV central-inverter station whose retained array, civil foundation, MVT and grid interface are qualified. Approved actual DC/AC voltage/current/power, conversion topology, mechanical mounting, protection/earthing and control/communications compatibility are required. If the MVT must be replaced, this selected subset does not apply."
      source_ids:
        - sma-utility-repowering
        - epri-inverter-repowering-abstract-2024
    - rule_id: job_boundary
      applies_to: "Foreground start and end"
      rule: "Start with qualified existing identified station and approved work/isolation plan. Own DC/AC isolation, discharge and lockout, safe removal, new equipment and actual interface installation, configuration, full required functional tests, defect closure and signed operator re-entry handover. Require competent actual governing local/OEM procedures; no universal voltage span, test count, yield or warranty."
      source_ids:
        - sma-utility-repowering
        - sma-pv-commissioning
        - sma-industrial-services
    - rule_id: host_state
      applies_to: "Existing host assets"
      rule: "Existing arrays, MVT, foundation and old inverter are starting-condition state interfaces, not new purchased manufacture. Own incremental work and old-equipment removal/fate. No subtraction of historical inverter from new supply, avoided asset credit, future yield, revenue or lifetime extension credit. Exclude new whole power plant, modules/array repowering, rooftop/home/string-only routes, batteries, MVT replacement, factory inverter repair and later operation."
      source_ids:
        - sma-utility-repowering
        - unsd-cpc3-powerplant-services
    - rule_id: coverage_owner
      applies_to: "Resource ownership"
      rule: "Assign one resource owner for each direct/provider/rental/transport/asset/spare event and complete upstream coverage. Whole finished package and its covered BOM are mutually exclusive purchases. Retain actual incremental cleaning/containment/test supplies and provider-paid resources; evidenced non-use may establish absence, unknown coverage never establishes zero."
      source_ids: []
    - rule_id: campaign_phase
      applies_to: "Finite service campaign"
      rule: "Declare actual job/campaign start/end and isolation-removal, installation, commissioning/retest and acceptance phases with reporting periods. Each stock, input, asset use, event, exit and output retains job/site/station/campaign/batch/event/phase/period identity; only applicable asset IDs are populated. Failed or aborted work remains attributed to its actual job; N=0 or an incomplete acceptance gate blocks a normalized dataset."
      source_ids: []
