    - id: calc_direct
      applies_to: "replacement_central_inverter,interface_parts_count_terminal; interface_parts_count_adaptor; interface_parts_count_switch; interface_parts_count_protection; interface_parts_count_sensor; interface_parts_count_control; interface_parts_count_communication; interface_parts_count_fitting; interface_parts_count_cooling_spare; atomic_interface_parts_count,interface_cable_length_cable; atomic_interface_cable_length,installation_mass_supplies_sealant; installation_mass_supplies_lubricant; installation_mass_supplies_cleaner; installation_mass_supplies_absorbent; installation_mass_supplies_containment; atomic_installation_mass_supplies,water_supply,fuel_supply,electricity_import,freight_service,atomic_specialist_service,atomic_shared_asset_service,removed_reusable_equipment_inverter; atomic_removed_reusable_equipment,usable_count_returns_interface_parts_count_terminal; usable_count_returns_interface_parts_count_adaptor; usable_count_returns_interface_parts_count_switch; usable_count_returns_interface_parts_count_protection; usable_count_returns_interface_parts_count_sensor; usable_count_returns_interface_parts_count_control; usable_count_returns_interface_parts_count_communication; usable_count_returns_interface_parts_count_fitting; usable_count_returns_interface_parts_count_cooling_spare; atomic_usable_count_returns,usable_length_returns_interface_cable_length_cable; atomic_usable_length_returns,usable_mass_returns_installation_mass_supplies_sealant; usable_mass_returns_installation_mass_supplies_lubricant; usable_mass_returns_installation_mass_supplies_cleaner; usable_mass_returns_installation_mass_supplies_absorbent; usable_mass_returns_installation_mass_supplies_containment; atomic_usable_mass_returns,test_electricity_export,removed_electronic_waste_inverter; removed_electronic_waste_part; atomic_removed_electronic_waste,new_supply_waste_cable; new_supply_waste_packaging; new_supply_waste_electronic; new_supply_waste_cleaner; new_supply_waste_absorbent; new_supply_waste_material; atomic_new_supply_waste,contained_wastewater,nonburned_fuel_waste_fuel; atomic_nonburned_fuel_waste,atomic_direct_combustion_species,atomic_direct_incident_species,atomic_waste_treatment_service"
      rule: "For each actual native exchange, amount = attributable actual native quantity / N. N is the positive unique final accepted station count from cp_acceptance. Keep numerator units and disjoint roles; this is direct per-reference attribution, not a mass/capacity conversion."
      inputs:
        - "actual native quantity"
        - N
        - "relevant node-owned protocol"
      output: "native exchange per reference flow"
      source_ids: []
    - id: calc_supply
      applies_to: "replacement_central_inverter,interface_parts_count_terminal; interface_parts_count_adaptor; interface_parts_count_switch; interface_parts_count_protection; interface_parts_count_sensor; interface_parts_count_control; interface_parts_count_communication; interface_parts_count_fitting; interface_parts_count_cooling_spare; atomic_interface_parts_count,interface_cable_length_cable; atomic_interface_cable_length,installation_mass_supplies_sealant; installation_mass_supplies_lubricant; installation_mass_supplies_cleaner; installation_mass_supplies_absorbent; installation_mass_supplies_containment; atomic_installation_mass_supplies,fuel_supply,usable_count_returns_interface_parts_count_terminal; usable_count_returns_interface_parts_count_adaptor; usable_count_returns_interface_parts_count_switch; usable_count_returns_interface_parts_count_protection; usable_count_returns_interface_parts_count_sensor; usable_count_returns_interface_parts_count_control; usable_count_returns_interface_parts_count_communication; usable_count_returns_interface_parts_count_fitting; usable_count_returns_interface_parts_count_cooling_spare; atomic_usable_count_returns,usable_length_returns_interface_cable_length_cable; atomic_usable_length_returns,usable_mass_returns_installation_mass_supplies_sealant; usable_mass_returns_installation_mass_supplies_lubricant; usable_mass_returns_installation_mass_supplies_cleaner; usable_mass_returns_installation_mass_supplies_absorbent; usable_mass_returns_installation_mass_supplies_containment; atomic_usable_mass_returns"
      rule: "S = opening attributable stock + external net-tare gross receipts - closing carried stock; gross-with-outlets uses S upstream and separate physical usable returns, consumed-only uses S minus matched outward usable returns once. Internal issue is not receipt. Nonreturned waste/loss stays upstream; no extra return credit."
      inputs:
        - cp_supply
        - cp_fuel
        - cp_exits
        - "declared supply convention"
      output: "attributable native supply and separate physical exits"
      source_ids: []
    - id: calc_fuel
      applies_to: "fuel_supply,nonburned_fuel_waste_fuel; atomic_nonburned_fuel_waste"
      rule: "Burned activity = opening usable fuel + external net-tare receipts - closing usable fuel - outward usable return - nonburned waste - uncontained nonburned loss. Each outlet is disjoint; total spill is audit-only, recovered spill already in closing usable stock. Upstream supply follows calc_supply, not burned activity alone. Burned activity must be measured or supported by an audited complete-fate balance and stated uncertainty; unknown/unmeasured loss remains unresolved, never automatically combustion."
      inputs:
        - cp_fuel
        - cp_exits
        - "actual specification"
      output: "separate burned activity and fuel physical balance"
      source_ids: []
    - id: calc_electricity
      applies_to: "electricity_import,test_electricity_export"
      rule: "Record interval-consistent import, actual export, retained-array test generation, internal circulation, dumped load and losses separately. Assign actual job causal share once; internal circulation is nonadditive audit activity. Do not subtract exported or forecast generation from imported electricity or construction burden."
