      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| v_gate | Acceptance and retained interfaces | Require N>0, unique station IDs, actual compatible retained MVT/arrays/foundation and completed approved mechanical/electrical/protection/earthing/SCADA/grid-control test gates, defect closure, report and operator signature. Missing or failed gate blocks accepted output. | sma-utility-repowering; sma-pv-commissioning; sma-industrial-services |\n| v_stock | Native stock and disjoint exits | Reconcile each SKU/native unit, package-component exclusions, gross-with-outlets or consumed-only convention, old-versus-new equipment and disjoint usable/waste/release/closing roles. No arbitrary mass conversions, negative new inputs or double returns/credits. |  |\n| v_energy | Commissioning resources and species | Keep import/export/retained generation/circulation/dumped-load ledgers distinct, own actual resources once and retain supplied fuel burdens including waste/loss. Verify actual burned-activity/species/medium evidence and nonadditive physical views. No automatic energy credit or theoretical emission inference. |  |\n| v_loops_periods | Rework and period coverage | Link every failed/aborted/repeated test, rejected installation, cleaning/setup/changeover event and resource to actual campaign/batch/event/phase/period and originating node. No unresolved reject counts as accepted; no duplicated shared event across periods. |  |\n| v_assets | Shared providers and assets | Require complete actual service results/upstream coverage and whole-life manufacture/maintenance/replacement/EOL asset evidence with compatible job/all-life driver across all jobs/periods. Missing remainder, replacement, termination, denominator or coverage blocks finalization; test direct/provider/rental duplicates and sensitivity. |  |\n| v_binding | Final exchange identities | Before a final dataset, verify each actual flow, native property and unit support including standalone electricity Energy and actual provider/asset chains. A candidate with unresolved product identity is not publication-ready; a checker pass does not verify external identity or physical foreground data. |  |\n| close_atomic_interface_parts_count | station_integration; cp_supply | Block final foreground completion until every actual object in atomic_interface_parts_count is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_interface_cable_length | station_integration; cp_supply | Block final foreground completion until every actual object in atomic_interface_cable_length is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_installation_mass_supplies | station_integration; cp_supply | Block final foreground completion until every actual object in atomic_installation_mass_supplies is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_specialist_service | station_integration; cp_services | Block final foreground completion until every actual object in atomic_specialist_service is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_shared_asset_service | station_integration; cp_assets | Block final foreground completion until every actual object in atomic_shared_asset_service is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_waste_treatment_service | station_integration; cp_services | Block final foreground completion until every actual object in atomic_waste_treatment_service is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_removed_reusable_equipment | station_integration; cp_exits | Block final foreground completion until every actual object in atomic_removed_reusable_equipment is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_usable_count_returns | station_integration; cp_exits | Block final foreground completion until every actual object in atomic_usable_count_returns is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_usable_length_returns | station_integration; cp_exits | Block final foreground completion until every actual object in atomic_usable_length_returns is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_usable_mass_returns | station_integration; cp_exits | Block final foreground completion until every actual object in atomic_usable_mass_returns is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_removed_electronic_waste | station_integration; cp_exits | Block final foreground completion until every actual object in atomic_removed_electronic_waste is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_new_supply_waste | station_integration; cp_exits | Block final foreground completion until every actual object in atomic_new_supply_waste is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_nonburned_fuel_waste | station_integration; cp_exits | Block final foreground completion until every actual object in atomic_nonburned_fuel_waste is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_direct_combustion_species | station_integration; cp_releases | Block final foreground completion until every actual object in atomic_direct_combustion_species is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_direct_incident_species | station_integration; cp_releases | Block final foreground completion until every actual object in atomic_direct_incident_species is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| atomic_pair_provenance_complete | actual internal child source and recipient transfers | Verify actual source/receipt evidence, original physical quantities/units and ownership for the same material/state/event/gate. Traceable reuse of the same signed measurement is allowed; copied parent totals, overwritten receipts and forced unknown equality are prohibited. Unexplained differences without uncertainty, actual loss or state-transition responsibility evidence block completion; verify exactly one normalization per card. |  |\n\n"
