published_dataset_profile:
  dataset_role: "Foreground station-repowering service data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same qualified existing utility ground-PV central-inverter retained-MVT service, with configuration and acceptance comparability disclosed; downstream process/lifecyclemodel projections."
  excluded_use: "Generic new plant, generic inverter supply, module/MVT replacement, batteries, home/string-only routes, capacity or electricity equivalence, future avoided-impact claims."
  required_metadata: "Actual station/site/serial IDs, retained/replaced BOM, ratings/topology, qualified MVT/foundation/array interfaces, firmware/protection/SCADA/grid state, actual local/OEM method, test/defect report, signature/date, N, campaign/phases/periods, resource ownership and old-equipment fate."
  required_quality_disclosure: "Actual quantity/range evidence, unresolved actual UUID/support chains, provider and asset upstream coverage/life denominator, stock/return convention, test energy separation, release uncertainty, missing fate and sensitivities; no publication claim while blockers persist."
  update_trigger: "Changed station configuration/retained MVT, actual approved route/gates, provider scope/resource coverage, receiver/fate, UUID support, metering, asset remainder/replacements/termination/EOL or material new foreground evidence."
data_sources:
  - id: "unsd-cpc3-powerplant-services"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Ver.3.0 explanatory notes, 30 June 2025, subclass 54262, printed p.287; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Heavy generating plant/equipment construction, repair and alteration classification scope; not method quantities."
  - id: "sma-utility-repowering"
    type: "extension_guidance"
    reference: "SMA America, Repowering utility; https://www.sma-america.com/repowering-utility"
    used_for: "Central-inverter retrofit and possible retained MVT; most MVTs compatible is not actual compatibility or a design guarantee."
  - id: "sma-pv-commissioning"
    type: "extension_guidance"
    reference: "SMA Solar Technology, Commissioning large-scale PV power plants; https://www.sma.de/en/products/services-warranty/commissioning-large-scale-pv-power-plants"
    used_for: "Installation verification, configuration, comprehensive functional testing and commissioning report."
  - id: "sma-industrial-services"
    type: "extension_guidance"
    reference: "SMA America, Services for Industrial Systems; https://www.sma-america.com/service-support/services-for-industrial-systems"
    used_for: "Mechanical/electrical readiness and complete DC-inverter-AC test path; grid emulation only if actually selected."
  - id: "epri-inverter-repowering-abstract-2024"
    type: "literature"
    reference: "R. Dhakal, EPRI report 3002029900, 1 November 2024, Repowering and Retrofitting of Solar Inverters: A Field Case Study [Slides], OSTI 2476025 abstract only; https://www.osti.gov/biblio/2476025"
    used_for: "Abstract-level evidence of mechanical/electrical/communications compatibility for a different-OEM retrofit; no full-text method or performance claims."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:d977a437d622fab888ae85fb11e6e67ee42df4e4676e184b434c0cde648dd0fb"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_4555"
      family: "system_boundary"
      span:
        start:
          offset: 4555
          line: 54
          column: 1
        end:
          offset: 9493
          line: 78
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Identified existing qualified ground-PV station with retained arrays/foundation/MVT/grid interface, old inverter and approved work plan. |\n| starting_condition_role | Existing host state interface, not a new manufacture purchase. |\n| product_classification_scope | CPC 3.0 54262; narrower |\n| recursive_input_rule | Do not purchase this same completed station service as its own input. A genuine bounded subcontract identifies actual scope/native activity and upstream coverage, with one owner and no duplication of the foreground work. |\n| upstream_dataset_requirement | Actual new equipment/supplies, utilities, provider service, transport, asset life share and treatment require compatible upstream datasets and explicit coverage; retained host manufacture is excluded. |\n| disclosure | Actual retained/replaced register, prior condition, qualified compatibility, local/OEM gates, N, all phases/periods, provider/resource owner, old-equipment fate and remaining data gaps. |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `scope_eligibility` | foreground_system_boundary | This PCR covers the finite functional replacement and recommissioning of an identified existing utility-scale ground-mounted photovoltaic central-inverter station, retaining qualified arrays, civil foundation, compatible existing medium-voltage transformer (MVT) and grid interface. The service changes an existing generating station rather than delivering a new power plant or an inverter alone. Its output requires actual compatibility evidence and signed operator acceptance after all approved functional gates. [sma-utility-repowering; sma-pv-commissioning; epri-inverter-repowering-abstract-2024] The manufacturer offers a retained-MVT central-inverter route and a different whole-station route when an MVT cannot be saved. Only the former is covered. “Compatible with most” is not verification for an actual station. Exclude rooftop/home/string-only inverters, batteries, module or array replacement, MVT replacement, factory inverter repair, whole new plant construction and subsequent electricity generation. No brochure voltage, warranty, energy uplift or lifetime promise becomes a universal design rule. [sma-utility-repowering] | `sma-utility-repowering`; `sma-pv-commissioning`; `epri-inverter-repowering-abstract-2024` |\n| scope_gate | Retained interfaces | Include only an actual existing utility ground-PV central-inverter station whose retained array, civil foundation, MVT and grid interface are qualified. Approved actual DC/AC voltage/current/power, conversion topology, mechanical mounting, protection/earthing and control/communications compatibility are required. If the MVT must be replaced, this selected subset does not apply. | sma-utility-repowering; epri-inverter-repowering-abstract-2024 |\n| job_boundary | Foreground start and end | Start with qualified existing identified station and approved work/isolation plan. Own DC/AC isolation, discharge and lockout, safe removal, new equipment and actual interface installation, configuration, full required functional tests, defect closure and signed operator re-entry handover. Require competent actual governing local/OEM procedures; no universal voltage span, test count, yield or warranty. | sma-utility-repowering; sma-pv-commissioning; sma-industrial-services |\n| host_state | Existing host assets | Existing arrays, MVT, foundation and old inverter are starting-condition state interfaces, not new purchased manufacture. Own incremental work and old-equipment removal/fate. No subtraction of historical inverter from new supply, avoided asset credit, future yield, revenue or lifetime extension credit. Exclude new whole power plant, modules/array repowering, rooftop/home/string-only routes, batteries, MVT replacement, factory inverter repair and later operation. | sma-utility-repowering; unsd-cpc3-powerplant-services |\n| coverage_owner | Resource ownership | Assign one resource owner for each direct/provider/rental/transport/asset/spare event and complete upstream coverage. Whole finished package and its covered BOM are mutually exclusive purchases. Retain actual incremental cleaning/containment/test supplies and provider-paid resources; evidenced non-use may establish absence, unknown coverage never establishes zero. |  |\n| campaign_phase | Finite service campaign | Declare actual job/campaign start/end and isolation-removal, installation, commissioning/retest and acceptance phases with reporting periods. Each stock, input, asset use, event, exit and output retains job/site/station/campaign/batch/event/phase/period identity; only applicable asset IDs are populated. Failed or aborted work remains attributed to its actual job; N=0 or an incomplete acceptance gate blocks a normalized dataset. |  |\n\n"
