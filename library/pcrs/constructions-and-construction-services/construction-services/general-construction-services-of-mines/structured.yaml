published_dataset_profile:
  dataset_role: "Foreground data package for completed supported mine decline construction service"
  downstream_use: "secondary_dataset; background_dataset; process and lifecyclemodel projections"
  allowed_use: "Actual matching non-ore drill-blast supported decline service with disclosed site geometry, geology, support, periods, interfaces and acceptance"
  excluded_use: "Whole mine; ore-production; shafts/raises; mechanical tunnel; transport tunnel; excavation-only; future operation or avoided ore/energy/disposal credit"
  required_metadata: "Mine/site/job/segment/campaign/round/event/phase/period; geometry and unique L; non-ore geology; actual design/support/QC; blast/re-entry; interface tests and signoff; actual SKU/provider/unit; stock and outlet states; water/spoil fates; shared consumer/lifecycle scope"
  required_quality_disclosure: "Boundary and data coverage, direct/provider ownership, measurement and state conversions, actual species/factors, unknown identities/supports, missing records, uncertainty/sensitivity, life-history/remainder evidence and date"
  update_trigger: "Changed actual geology/route/support/geometry/gates, governing requirements, suppliers/providers/destinations, period ownership or remaining-life evidence; corrected measurements/identities"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 explanatory notes, 30 June 2025, p. 287, subclass 54261; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only; mine-associated tunnels/drifts, not production quantities"
  - id: "minto-development-plan-2014"
    type: "literature"
    reference: "Minto Explorations Ltd, Underground Mine Development and Operations Plan, June 2014, sections 4.1, 6.3.5, 7.5–7.8; https://emr-ftp.gov.yk.ca/emrweb/COMM/major-mines/minto/mml_minto_11underground_mine_development_operations_plan_june2014.pdf"
    used_for: "Historical operator case for decline access, support, drill-blast development/waste separation and water/explosive roles; broader mine/ore scope and numerical patterns not adopted"
  - id: "ontario-ground-control"
    type: "official_guidance"
    reference: "Ontario Ministry of Labour, Immigration, Training and Skills Development, Ground control in underground mines, published/updated 21 December 2023; https://www.ontario.ca/page/ground-control-underground-mines"
    used_for: "Site-specific ground design/examination/scaling/support-installation and QC rationale; actual governing jurisdiction and project design control; no LCA stock/fuel/asset algebra claimed"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:947a78973f0873ecb44068f1424c724cd90250d0830636c222d8fe06edb8555c"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6355"
      family: "system_boundary"
      span:
        start:
          offset: 6355
          line: 60
          column: 1
        end:
          offset: 12238
          line: 88
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Qualified existing mine access/portal and surveyed non-ore hard-rock face before finite development rounds |\n| starting_condition_role | Existing host and geological state, not purchased new mine/portal/rock |\n| product_classification_scope | Bounded permanent mine access decline construction, CPC 54261 subset |\n| recursive_input_rule | Existing same-category segments are starting states. Include actual attributable job-induced maintenance/extension resources; do not recursively repurchase earlier segments. Purchased bounded subcontract work requires explicit scope and no overlapping resource ownership. |\n| upstream_dataset_requirement | Actual supplies, utilities, transport, subcontract services and attributable asset lifecycle require compatible upstream datasets; all actual provider-paid resources are owned once. |\n| disclosure | Document retained host; excavation and support boundaries; all rounds/periods/events; shared ventilation/pump/fleet consumers; waste/water fates; supplied versus detonated explosive; exclusions and unresolved data |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `scope_eligibility` | foreground_system_boundary | This PCR covers a finite permanent underground mine access decline segment developed by drilling and blasting non-ore hard rock, then scaled, supported, connected to the actual drainage, ventilation and service interfaces, tested and accepted. The handed-over product is a supported usable segment, not loose rock or excavation alone. Competent site design and actual governing requirements determine geometry, support and safe access. Minto is historical route evidence only; no case dimensions, explosive recipes, production ratios, licences or emission factors become defaults. [minto-development-plan-2014; ontario-ground-control] Exclude ore-production stopes, saleable ore co-products, exploration-only drilling, shafts and raises, mechanical excavation routes, non-mine transport tunnels, whole mine construction/operation and unlined excavation-only contracts. Discovery of intentional saleable ore, an incompatible route or missing support/handover evidence blocks use of this PCR until scope review. | `minto-development-plan-2014`; `ontario-ground-control` |\n| `route_handoff` | development; support | Development independently changes in-situ rock to cleared excavated opening plus removed waste rock; its internal survey/ground-inspection record authorizes only the next task under competent safe-work controls, never unrestricted entry into unsupported ground or final acceptance. Support integrates bolts/mesh/actual binder and service extensions into inspected usable segment. Joining, grouting/shotcrete preparation and tests stay embedded; no fictitious separate formulation factory. | minto-development-plan-2014; ontario-ground-control |\n| `full_job` | all inventory rows | Include access qualification, setup, drilling/blast/re-entry ventilation, mucking/haul/scaling, support, temporary and permanent service extensions actually required, cleanup, defect removal, failed rounds, misfire response and retesting to signed handover. Exclude later mine operation and intentional ore production. | minto-development-plan-2014 |\n| `ground_gate` | support; accepted_decline | Require current actual competent geotechnical/ground-control design, inspected/scaled ground and installed support quality evidence. Actual bolt/mesh/binder/support and testing duties follow approved site design. Do not universalize Ontario jurisdiction or historical case dimensions. | ontario-ground-control |\n| `blast_gate` | development; accepted_decline | Require actual authorized blast design, explosive traceability, exclusion and re-entry/air clearance and safe interface handover under actual governing requirements. Unresolved misfire or unsafe ground cannot contribute accepted output. | minto-development-plan-2014 |\n| `water_spoil` | development; support | Include actual supply and abstraction, drilling/dust-suppression/cleaning/test water, mine inflow interception/pumping/treatment and classified destinations. Rock spoil is separately traced by classification/receiver; no generic useful-product or avoided-disposal credit. | minto-development-plan-2014 |\n| `ownership` | all inventory rows | Maintain one resource owner for direct work, site utilities, transport, subcontractors, rentals, assets and spares. Factory packages and separately purchased constituent parts are exclusive; disclose provider coverage and eliminate overlaps. |  |\n| `period_boundary` | development; support | Link all inputs, transfers, failed and accepted events, assets, stock changes and replacements to actual job/campaign/round/phase/reporting period. Closing stock is carried state, not outward return. |  |\n| `installed_states` | support_bolts_ground_bolt; atom_req_support_support_bolts actual-child group; support_mesh_mesh; atom_req_support_support_mesh actual-child group; support_binder_resin; support_binder_grout; support_binder_shotcrete; atom_req_support_support_binder actual-child group; service_extensions_drainage_pipe; service_extensions_ventilation_duct; service_extensions_service_cable; service_extensions_service_hose; atom_req_support_service_extensions actual-child group; atom_req_support_support_other_native actual-child group; atom_req_support_support_waste actual-child group | Installed/retained final materials exclude outward usable returns, waste, release and carried supply stock. Used/dosed/charged/fresh-mix activity is a nonadditive process view. Record actual dry powder, added water, fresh wet mix and cured installed mass/volume separately with matched state/density/moisture/temperature/unit/source where independently needed. |  |\n\n\n"
