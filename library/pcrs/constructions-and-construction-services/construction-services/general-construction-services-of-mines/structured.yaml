  calculation_rules:
    - id: native_supply
      applies_to: "explosives_anfo; explosives_emulsion; atom_req_development_explosives actual-child group; initiators_detonator; initiators_booster; initiators_connector; atom_req_development_initiators actual-child group; drill_consumables_drill_steel; drill_consumables_drill_bit; drill_consumables_lubricant; atom_req_development_drill_consumables actual-child group; atom_req_development_development_fuel actual-child group; support_bolts_ground_bolt; atom_req_support_support_bolts actual-child group; support_mesh_mesh; atom_req_support_support_mesh actual-child group; support_binder_resin; support_binder_grout; support_binder_shotcrete; atom_req_support_support_binder actual-child group; service_extensions_drainage_pipe; service_extensions_ventilation_duct; service_extensions_service_cable; service_extensions_service_hose; atom_req_support_service_extensions actual-child group; atom_req_support_support_consumables actual-child group; atom_req_support_support_fuel actual-child group; atom_req_development_development_other_native actual-child group; atom_req_support_support_other_native actual-child group"
      rule: "For each actual SKU/native unit, opening attributable stock + external net-tare gross receipts - closing carried stock; choose gross-with-outlets or matched usable-return exclusion once. Divide actual attributable native quantity by L."
      inputs:
        - cp_dev_ledger
        - cp_sup_ledger
        - cp_accept
      output: "Native supply per 1 m reference flow"
      source_ids: []
    - id: native_outlets
      applies_to: "explosive_return_return_explosives_anfo; explosive_return_return_explosives_emulsion; atom_req_development_explosive_return actual-child group; initiator_return_return_initiators_detonator; initiator_return_return_initiators_booster; initiator_return_return_initiators_connector; atom_req_development_initiator_return actual-child group; support_return_return_support_bolts_ground_bolt; atom_req_support_support_return actual-child group; atom_req_development_rock_spoil actual-child group; atom_req_development_development_waste actual-child group; atom_req_support_support_waste actual-child group; development_water; support_water; atom_req_development_development_water_out actual-child group; atom_req_support_support_water_out actual-child group; atom_req_development_development_withdrawal actual-child group; atom_req_support_support_withdrawal actual-child group; development_mass_return_return_drill_consumables_drill_steel; development_mass_return_return_drill_consumables_drill_bit; development_mass_return_return_drill_consumables_lubricant; atom_req_development_development_mass_return actual-child group; support_mass_return_return_support_mesh_mesh; support_mass_return_return_support_binder_resin; support_mass_return_return_support_binder_grout; support_mass_return_return_support_binder_shotcrete; atom_req_support_support_mass_return actual-child group; support_length_return_return_service_extensions_drainage_pipe; support_length_return_return_service_extensions_ventilation_duct; support_length_return_return_service_extensions_service_cable; support_length_return_return_service_extensions_service_hose; atom_req_support_support_length_return actual-child group; atom_req_development_development_other_return actual-child group; atom_req_support_support_other_return actual-child group"
      rule: "Sum actual separately traced native boundary quantities for same owner/state, then divide by L. Pair internal transfer IDs without summing them as extra external supply/output. Only actual independently necessary conversion uses matched measured state/density/moisture and source."
      inputs:
        - cp_dev_ledger
        - cp_sup_ledger
        - cp_dev_environment
        - cp_sup_environment
        - cp_accept
      output: "Actual native exchange per 1 m reference flow"
      source_ids: []
    - id: owned_services
      applies_to: "development_electricity; support_electricity; atom_req_development_development_provider actual-child group; support_provider_design; support_provider_testing; support_provider_installation; atom_req_support_support_provider actual-child group; development_assets_drill_rig; development_assets_loader; development_assets_fan; development_assets_pump; atom_req_development_development_assets actual-child group; support_assets_fan; support_assets_pump; atom_req_support_support_assets actual-child group; atom_req_development_development_freight actual-child group; atom_req_support_support_freight actual-child group"
      rule: "Actual direct resources plus actual compatible period/lifecycle-driver share of complete shared resources, excluding overlap already owned by provider/direct/asset; divide attributable native quantity by L. Asset driver denominator covers all lifecycle consumers. Freight uses actual load and distance with upstream scope owned once."
      inputs:
        - cp_dev_services
        - cp_sup_services
        - cp_accept
      output: "Native resources, provider units and lifecycle equivalents per 1 m reference flow"
      source_ids: []
    - id: species_release
      applies_to: "atom_req_development_development_air actual-child group; atom_req_support_support_air actual-child group"
      rule: "For each actual substance/medium, integrate measured concentration with compatible flow/time or use actual activity times a matched species emission factor, OR whole-fluid mass times matched composition and fate fraction; a complete species emission factor must not be multiplied by composition again, exclude captured/retained/returned/waste once, then divide by L. Keep detonation and fuel-combustion activity separate; never use safety readings as emitted mass or residual difference alone."
      inputs:
        - cp_dev_environment
        - cp_sup_environment
        - cp_dev_ledger
        - cp_sup_ledger
        - cp_accept
      output: "Actual species release per 1 m reference flow"
      source_ids: []
