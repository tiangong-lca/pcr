validation_rules:
  - rule_id: acceptance_check
    applies_to: "accepted_decline"
    rule: "Confirm L > 0 and exact final 1 m reference; unique survey/endpoints, non-ore geology, actual cross-section/gradient, blast/re-entry/scaling/support/drainage/ventilation/service gates and signed acceptance. No failed segment or repeated attempt counts."
    source_ids:
      - minto-development-plan-2014
      - ontario-ground-control
  - rule_id: native_check
    applies_to: "all inventory rows"
    rule: "Verify native property/unit, stock/outlet rules, direct denominator L, measured state conversions only where needed, no invented support recipe/ore yield/swell or theoretical blast emissions."
    source_ids: []
  - rule_id: coverage_check
    applies_to: "development; support"
    rule: "Verify all periods/phases, incidents, misfires, rejected support remediation/waste exits, direct/provider and freight ownership, complete shared consumer/lifetime driver and sensitivity. No missing coverage or unresolved replacement/termination treated as zero."
    source_ids: []
  - rule_id: identity_check
    applies_to: "all inventory rows"
    rule: "Verify each actual concrete flow/property/unit and actual qualifiers before final TIDAS exchange; unresolved supplier/provider/species/support prevents final exchange and must be disclosed. A candidate methodology is not a publication-ready dataset."
    source_ids: []
  - rule_id: environment_check
