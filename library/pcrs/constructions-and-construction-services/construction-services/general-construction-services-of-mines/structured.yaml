system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers a finite permanent underground mine access decline segment developed by drilling and blasting non-ore hard rock, then scaled, supported, connected to the actual drainage, ventilation and service interfaces, tested and accepted. The handed-over product is a supported usable segment, not loose rock or excavation alone. Competent site design and actual governing requirements determine geometry, support and safe access. Minto is historical route evidence only; no case dimensions, explosive recipes, production ratios, licences or emission factors become defaults. [minto-development-plan-2014; ontario-ground-control] Exclude ore-production stopes, saleable ore co-products, exploration-only drilling, shafts and raises, mechanical excavation routes, non-mine transport tunnels, whole mine construction/operation and unlined excavation-only contracts. Discovery of intentional saleable ore, an incompatible route or missing support/handover evidence blocks use of this PCR until scope review."
      source_ids:
        - minto-development-plan-2014
        - ontario-ground-control
    - rule_id: route_handoff
      applies_to: "development; support"
      rule: "Development independently changes in-situ rock to cleared excavated opening plus removed waste rock; its internal survey/ground-inspection record authorizes only the next task under competent safe-work controls, never unrestricted entry into unsupported ground or final acceptance. Support integrates bolts/mesh/actual binder and service extensions into inspected usable segment. Joining, grouting/shotcrete preparation and tests stay embedded; no fictitious separate formulation factory."
      source_ids:
        - minto-development-plan-2014
        - ontario-ground-control
    - rule_id: full_job
      applies_to: "all inventory rows"
      rule: "Include access qualification, setup, drilling/blast/re-entry ventilation, mucking/haul/scaling, support, temporary and permanent service extensions actually required, cleanup, defect removal, failed rounds, misfire response and retesting to signed handover. Exclude later mine operation and intentional ore production."
      source_ids:
        - minto-development-plan-2014
    - rule_id: ground_gate
      applies_to: "support; accepted_decline"
      rule: "Require current actual competent geotechnical/ground-control design, inspected/scaled ground and installed support quality evidence. Actual bolt/mesh/binder/support and testing duties follow approved site design. Do not universalize Ontario jurisdiction or historical case dimensions."
      source_ids:
        - ontario-ground-control
    - rule_id: blast_gate
      applies_to: "development; accepted_decline"
      rule: "Require actual authorized blast design, explosive traceability, exclusion and re-entry/air clearance and safe interface handover under actual governing requirements. Unresolved misfire or unsafe ground cannot contribute accepted output."
      source_ids:
        - minto-development-plan-2014
    - rule_id: water_spoil
      applies_to: "development; support"
      rule: "Include actual supply and abstraction, drilling/dust-suppression/cleaning/test water, mine inflow interception/pumping/treatment and classified destinations. Rock spoil is separately traced by classification/receiver; no generic useful-product or avoided-disposal credit."
      source_ids:
        - minto-development-plan-2014
    - rule_id: ownership
      applies_to: "all inventory rows"
      rule: "Maintain one resource owner for direct work, site utilities, transport, subcontractors, rentals, assets and spares. Factory packages and separately purchased constituent parts are exclusive; disclose provider coverage and eliminate overlaps."
      source_ids: []
    - rule_id: period_boundary
      applies_to: "development; support"
      rule: "Link all inputs, transfers, failed and accepted events, assets, stock changes and replacements to actual job/campaign/round/phase/reporting period. Closing stock is carried state, not outward return."
      source_ids: []
    - rule_id: installed_states
      applies_to: "support_bolts_ground_bolt; atom_req_support_support_bolts actual-child group; support_mesh_mesh; atom_req_support_support_mesh actual-child group; support_binder_resin; support_binder_grout; support_binder_shotcrete; atom_req_support_support_binder actual-child group; service_extensions_drainage_pipe; service_extensions_ventilation_duct; service_extensions_service_cable; service_extensions_service_hose; atom_req_support_service_extensions actual-child group; atom_req_support_support_other_native actual-child group; atom_req_support_support_waste actual-child group"
      rule: "Installed/retained final materials exclude outward usable returns, waste, release and carried supply stock. Used/dosed/charged/fresh-mix activity is a nonadditive process view. Record actual dry powder, added water, fresh wet mix and cured installed mass/volume separately with matched state/density/moisture/temperature/unit/source where independently needed."
      source_ids: []
