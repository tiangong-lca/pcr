      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `no_ore` | all inventory rows | This subset has no intentional saleable ore product. Non-ore spoil receives actual classified treatment/reuse/disposal fate without default avoided product or disposal credit. Valuable ore production requires another reviewed methodology. |  |\n| `stock_supply` | explosives_anfo; explosives_emulsion; atom_req_development_explosives actual-child group; initiators_detonator; initiators_booster; initiators_connector; atom_req_development_initiators actual-child group; drill_consumables_drill_steel; drill_consumables_drill_bit; drill_consumables_lubricant; atom_req_development_drill_consumables actual-child group; atom_req_development_development_fuel actual-child group; support_bolts_ground_bolt; atom_req_support_support_bolts actual-child group; support_mesh_mesh; atom_req_support_support_mesh actual-child group; support_binder_resin; support_binder_grout; support_binder_shotcrete; atom_req_support_support_binder actual-child group; service_extensions_drainage_pipe; service_extensions_ventilation_duct; service_extensions_service_cable; service_extensions_service_hose; atom_req_support_service_extensions actual-child group; atom_req_support_support_consumables actual-child group; atom_req_support_support_fuel actual-child group; atom_req_development_development_other_native actual-child group; atom_req_support_support_other_native actual-child group | Per actual SKU/native unit: attributable supply = opening attributable stock + external net-tare gross receipts - closing carried stock. Gross-with-outlets retains all actual outward exits; consumed-only may exclude matched usable outward return once with corresponding upstream burden. Never add a duplicate return credit. Nonreturned waste/loss keeps upstream burden. |  |\n| `fuel_balance` | atom_req_development_development_fuel actual-child group; atom_req_support_support_fuel actual-child group; atom_req_development_development_air actual-child group; atom_req_support_support_air actual-child group | Actual supplied fuel is allocated to actual combustion, usable outward return, nonburned waste and uncontained loss with opening/closing state reconciled. Total spill is audit-only: recovered retained spill is already closing stock or a traced waste/return. Only actual combustion drives combustion emissions; fuel supply is not set to burned fuel only. |  |\n| `blast_balance` | explosives_anfo; explosives_emulsion; atom_req_development_explosives actual-child group; initiators_detonator; initiators_booster; initiators_connector; atom_req_development_initiators actual-child group; explosive_return_return_explosives_anfo; explosive_return_return_explosives_emulsion; atom_req_development_explosive_return actual-child group; initiator_return_return_initiators_detonator; initiator_return_return_initiators_booster; initiator_return_return_initiators_connector; atom_req_development_initiator_return actual-child group; atom_req_development_development_waste actual-child group; atom_req_development_development_air actual-child group | Reconcile external supply and carried stock independently from issue, charge, actual detonation, misfire resolution, waste and usable returns by round. Internal issue/charging are nonadditive activity; use actual detonation for a compatible blast-emission method and retain upstream burden of nonreturned unused/misfired/disposed material. |  |\n| `failed_rounds` | development; support; accepted_decline | Setup, failed rounds, repeat blasting/scaling/support, removals and retests retain their attributable burdens in the same unique accepted segment denominator. Failed/incomplete gates yield no accepted metres. Keep remediation loop and waste exit linked to the producing node. |  |\n| `shared_periods` | development_electricity; support_electricity; development_assets_drill_rig; development_assets_loader; development_assets_fan; development_assets_pump; atom_req_development_development_assets actual-child group; support_assets_fan; support_assets_pump; atom_req_support_support_assets actual-child group; atom_req_development_development_provider actual-child group; support_provider_design; support_provider_testing; support_provider_installation; atom_req_support_support_provider actual-child group | Enumerate every consuming job/node/period and lifecycle phase. Direct meters first; otherwise use an actual compatible measured driver numerator divided by the complete consumer/period driver denominator. Allocate complete asset manufacture, maintenance, replacements and end of life across all jobs/nodes/periods. Whole-life denominator requires completed observed life or observed history plus evidenced remainder, replacements, termination and end of life with uncertainty, sensitivity and updates. Missing coverage/denominator blocks finalization. Period shares and direct/provider resource shares must reconcile once. |  |\n| atom_grouped_ledgers | all actual-child records | Apply each existing formula only to its applicable role: material stock, asset lifecycle fraction/hourly provision, completed service event, internal transfer and species/fate calculations are distinct. Never apply material-stock or full-machine purchase equations to an asset share or service event. Within the applicable method group, use concrete child identity/material, state, one exchange property/unit, receiving medium and ownership/event scope. Native and converted views are nonadditive. A family diagnostic total is never a flow identity or every child numerator; keep incomplete portions explicit. Complete formulations, assemblies and genuinely bounded single-function services remain whole, with included constituents/resources not purchased again. |  |\n\n"
