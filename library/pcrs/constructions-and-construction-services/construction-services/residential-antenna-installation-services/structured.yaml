product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.residential-antenna-installation-services"
  classification_refs: "cpc:3.0:54614; narrower subset only"
  covered_products: "Accepted first-installed passive outdoor directional residential terrestrial-TV antenna configuration and single receiver lead-in"
  excluded_products: "Satellite, indoor, powered or rotating reception; distribution networks; whole lightning protection and later operation"
  representative_product: "Channel Master Advantage 30-series illustrates passive antenna assembly, supplied balun, mast fixing and aiming; actual compatible model governs, without a brand requirement"
  production_route: "Receipt and interface verification; antenna assembly; mast and antenna fixing; coax routing/termination/weatherproofing; design-required mast/coax bonding; aiming/testing; correction and retest; accepted handover"
  market_state: "Complete site installation at signed installer handover, with actual configuration and tested endpoint"
functional_unit:
  what: "One complete accepted installation of the disclosed configuration at installer handover"
  how_much: "1 Item(s); D is the independently counted positive number of actual complete accepted installations before normalization"
  how_well: "Declared model, substrate/mount, single lead-in, separate mast/coax bonding design and receiving endpoint satisfy the recorded acceptance criterion; materially different configurations require separate packages or demonstrated equivalence"
  how_long_or_cycle: "One receipt-to-acceptance job cycle, including failed work and corrections/retests. Resource acquisition, service/reporting periods, maintenance/replacement and retirement are separately indexed; no operating-year service is claimed"
  reference_flow_link: "accepted_installation"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers first installation of a fixed passive outdoor directional antenna for residential terrestrial television reception. The accepted configuration comprises the antenna and matching balun, actual mast/mount, a continuous coax lead-in to one receiver interface, and installation-specific mast and coax grounding or bonding to a declared suitable existing building grounding interface. Aiming, documented acceptance testing and installer handover complete the service. The technical design and locally applicable requirements govern actual work; representative manufacturer guidance supplies route evidence rather than a universal installation layout. Satellite dishes, indoor antennas, cable-TV supply networks, multiple-outlet distribution, amplifiers, rotators, towers, new lightning-protection systems, new earth electrodes, painting, removal of earlier equipment and subsequent reception/maintenance services are excluded. A reception distance, channel count or lifetime guarantee is not the output. An incompatible site condition or expanded design requires a separately reviewed scope."
      source_ids: []
    - rule_id: installer_gate
      applies_to: "install_accept"
      rule: "Own material receipt, assembly/fixing, lead-in termination and weatherproofing, design-required separate mast/coax bonding, aiming, testing, correction/retest and signed handover. The existing grounding system is an interface; new earth electrodes and whole lightning-protection construction are outside scope."
      source_ids:
        - channelmaster-advantage-installation
        - channelmaster-advantage-support
        - channelmaster-advantage-product
    - rule_id: component_boundary
      applies_to: "component inputs and packaging"
      rule: "Reconcile antenna-included balun/hardware against separate mast, coax, connectors and bonding supplies. Keep physical incoming packaging in the custody ledger even if manufacture is embedded upstream; separately burden only an upstream exclusion."
      source_ids:
        - channelmaster-advantage-installation
        - channelmaster-advantage-support
        - channelmaster-advantage-product
    - rule_id: resource_boundary
      applies_to: "owned equipment and hired service"
      rule: "Identify actual installer-owned tools, chargers, testers and access equipment and all consumers over each resource lifecycle packet. Contract providers own their asset lifecycle. Distinguish acquisition, service/reporting, maintenance/replacement and termination periods and document missing remaining-use evidence."
      source_ids: []
    - rule_id: rework_boundary
      applies_to: "failed work and material exits"
      rule: "A failed aim, fixing or reception test is an unaccepted state within install_accept until corrected/retested. Trace actual repair loop or usable return, downgrade/recovery/discard exit to its originating job and node; an unreviewed downgrade has no accepted output identity."
      source_ids:
        - channelmaster-advantage-installation
        - channelmaster-advantage-support
        - channelmaster-advantage-product
    - rule_id: posthandover
      applies_to: "receiver operation and later service"
      rule: "End at accepted handover; do not incorporate operational reception electricity, later maintenance or marketing reception guarantees."
      source_ids:
        - channelmaster-advantage-installation
        - channelmaster-advantage-support
        - channelmaster-advantage-product
boundary_abstraction:
  declared_starting_condition: "Materials received and mounting substrate, safe access/power-line clearance, receiver endpoint and suitable existing building grounding interface verified for the actual design. Existing-condition acceptance is readiness, not a new product input or credit."
  starting_condition_role: "Explicit prepared interface at which installer integration responsibility starts"
  product_classification_scope: "Selected passive residential terrestrial reception installation is narrower than cpc:3.0:54614; the subclass also covers other antenna/cable/lightning services"
  recursive_input_rule: "If a same-category prior installation is purchased, record its actual state and upstream boundary and isolate only genuine new installer work. An unresolved recursive overlap blocks acceptance; do not trace indefinitely or double count the earlier service."
  upstream_dataset_requirement: "Use matching component and service packets with manufacture, inbound delivery, packaging and provider capital inclusions explicitly stated. Include each actual upstream burden once."
  disclosure: "Site/interface approvals, installer supply and handover responsibility, job/period scope, received material custody, actual resource ownership and upstream inclusions/exclusions"
