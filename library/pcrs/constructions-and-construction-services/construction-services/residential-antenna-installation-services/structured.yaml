    - id: refine_incoming_packaging
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Keep the physical packaging receipt in custody accounting for every antenna/component shipment. Expand by actual material. If its manufacture is embedded in landed component supply, do not add that burden again; a separate burden requires evidence that the upstream packet excludes it. Quantity evidence gap: Shipment-specific weights and supplier packaging boundary disclosures must replace any assumed packaging percentage. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual packaging custody receipt by material/SKU; retain physical mass if supplier-included, separately charge only uncovered upstream burden, treat durable containers through compatible resource life."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_owned_equipment_attribution
      applies_to: "owned_equipment_attribution_charger; owned_equipment_attribution_rf_tester; owned_equipment_attribution_electrical_tester"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Expand every used tool, external charger, RF/electrical tester and access asset by exact model/serial. Its lifecycle packet spans acquisition, service/reporting periods, actual maintenance/replacement and retirement; all benefiting jobs/nodes and periods must be listed, including those outside this package. Quantity evidence gap: Exact resource life and all-consumer activity evidence are required; no generic lifetime, remaining-use assumption or fixed per-job asset fraction is available. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. An actual multitype tool/access roster still requires exact model and lifecycle packet; each independent model separate. No lifecycle allocation without actual all-consumer drivers, observed history/remainder/maintenance/replacements/retirement/EOL. Installation tool functions and access-asset types are not a finite single-object roster; require their own actual function/model before a card."
      evidence: "cp_services; actual independent records and identity/unit evidence"
    - id: refine_hired_support_service
      applies_to: "hired_support_service_transport; hired_support_service_access; hired_support_service_test"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Expand each genuinely purchased complete transport, access or testing event with its contracted reference and configuration. The provider owns its asset lifecycle; disclose included fuel/electricity and inbound delivery. Hourly hire needs real Duration support and review rather than conversion into a fictional event. Quantity evidence gap: Actual contracts, service reference and burden-inclusion records are needed before a service envelope can be stated. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Hourly hire and other actual service references need their own exact identity/property/unit, not event conversion; disclose provider lifecycle/energy/delivery scope."
      evidence: "cp_services; actual independent records and identity/unit evidence"
    - id: refine_unused_product_return
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record only actual usable unchanged supplies leaving installer custody. Preserve source SKU and receipt-to-return identifiers and receiver; an internal stock movement is not this boundary exit. No avoided manufacture credit is inferred. Quantity evidence gap: Original issue and receiver-confirmed return evidence must justify the quantity and any bounds. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual usable outward product transfer by matching original SKU/receipt/native unit; retained stock and credit excluded."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_installation_waste
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Expand packaging, offcuts and removed failed components by material, physical state, hazard and authorised receiving route. Link each discard or recovery to the original install_accept issue/rework event; electronics or battery rejects require their actual identity and lifecycle owner. Do not merge heterogeneous waste into one concrete flow. Quantity evidence gap: Event-linked weighing and destination tickets are needed; unrecorded loss is not zero waste. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual segregated solid waste, contaminated carriers, packaging, failed/new and historic origins by independent dispatch; retain native-volume effluent separately when it occurs."
      evidence: "cp_releases; actual independent records and identity/unit evidence"
    - id: refine_contaminated_solid_waste
      applies_to: "contaminated_solid_waste_container; contaminated_solid_waste_wipe; contaminated_solid_waste_sealing_residue"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Where actually produced, expand chemistry, physical state, hazardous status and receiving route for contaminated containers, wipes and sealing residues. Separate clean packaging already owned by actual exchanges required by refine_installation_waste and material retained at joints. Quantity evidence gap: Actual material/SDS, residual weighing and receiver classification are required to establish waste bounds. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Different actual chemistry/hazard/receiver records require separate stream identities; no duplicate retained sealant or clean packaging."
      evidence: "cp_releases; actual independent records and identity/unit evidence"
    - id: refine_airborne_particulate
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Activate only with evidence of drilling/mounting and actual airborne release. Expand the reported substance and particle-size fraction with receiving-air compartment; captured dust is waste and retained substrate is neither an emission nor unexplained loss assigned to air. Quantity evidence gap: Task/capture records and measured or justified species/size release evidence are needed; generic dust is not an identity or emission factor. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_releases; actual independent records and identity/unit evidence"
    - id: refine_weatherproofing_constituent_to_air
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Where an actual product releases an identified constituent, record species, formulation/SDS, application conditions, mass-balance or measurement and receiving-air compartment. Neither an unspecified VOC label nor total supplied sealant mass supports a concrete emission. Quantity evidence gap: Species-specific content and release evidence must separate retained, captured, wasted and airborne fractions; no 100 percent emission assumption is supported. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_releases; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
