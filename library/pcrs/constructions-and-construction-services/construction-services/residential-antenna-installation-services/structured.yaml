      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Expand the actual 75-ohm continuous coax SKU, connectors and receiver fitting for the single declared receiver endpoint. A balun is a separate input only if it is genuinely additional to the antenna packet; record the original inclusion explicitly. Quantity evidence gap: Cable route/length, termination waste and model-specific mass evidence are missing from universal sources and must be collected. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Distinct actual connector models/receiving-interface parts must be separately identified; same cable metres/kg are one physical supply with auxiliary conversion, not two flows."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_bonding_components
      applies_to: "bonding_components_conductor; bonding_components_clamp; bonding_components_coax_ground_block"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Expand each actual conductor, clamp and coax grounding block or protective fitting required by the approved design. Document mast/support bonding and coax-entry bonding separately to the suitable existing building grounding interface. This is not a new earth electrode or a whole lightning-protection system. Quantity evidence gap: Site-approved interface/design, actual conductor and fitting SKUs and net supply records must establish any bounds. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual approved protective fittings and different conductor/clamp SKUs require exact product records; mast and coax bonding duties do not duplicate the same issued conductor. No new earth electrode or whole lightning-protection system."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_weatherproofing_materials
