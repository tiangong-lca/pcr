      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Where the installed method uses sealing or weatherproofing, expand each actual product with formulation/SDS and application point. Separate retained material, containers and losses; application does not imply complete evaporation. Quantity evidence gap: Product-specific issue, retained mass and SDS constituent evidence are needed; no generic use or emission interval is supported. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual separate complete weatherproofing formulation/SKU and application gate; retained, container and actual release fates, no all-supply evaporation."
