      collection_method: "Weigh gross containers/vehicles and tare separately; retain tickets, calibrated meter records and actual formulation/profile certificates. Record quantities before outward returns; use receipts or attributable internal issues without double counting. Transfer the evidenced opening-stock burden into this intervention and carry unused closing-stock burden forward; a physical stock change never silently removes or creates upstream burden. Use measured_volume_m3, actual temperature_C and evidenced density_kg_per_m3/density_source for each actual liquid conversion; kg = m3 times kg/m3, without defaults. Reconcile each material over periods, cut-offs, waste and actual releases; profile-specific gland mass/length requires batch evidence. Trace water supply, host/weather water and destination separately. Only for the children/requirements explicitly listed by consumable_stock_draw, apply that rule independently. Its added stock fields apply only to those children; other CP roles retain their own original operands. Keep measured gross receipt R as a raw record, not an additional exchange beside stock-adjusted S; preserve all cohort/custody locations and actual U/X, nonreturned waste and loss. For these children the original stock-burden bridge is reconciliation of S only, with stock_adjustment_applied = true; never charge inherited opening burden or deduct carried closing again. Real internal feeds retain actual paired quantities and one acquisition owner."
      unit: "kg; m; m3; kg/m3; °C"
      frequency: "Each event, run, receipt/return, test and handoff; close each work period"
      temporal_coverage: "Entire intervention including repeat visits and failures; assets across complete life"
      site_scope: "Identified joint/site and actual provider/asset fleet; other consumers for shared burdens"
      aggregation_rule: "per reference flow"
      quality_evidence: "Traceable identities/units, calibration, dated tickets/logs and approval sources; completeness and uncertainty; actual accepted L denominator and no duplicated owner"
