published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset; downstream process and lifecyclemodel projections"
  allowed_use: "Declared profile/movement-duty maintenance intensity per1 m of fully accepted complete-joint gland replacement on qualified retained single-gap rails"
  excluded_use: "New bridge or rail/header construction, all CPC54221 services, modular reconstruction, manufacture-only gland, future bridge use, universal seal lifespan/performance claim or incomplete leaking-joint acceptance"
  required_metadata: "PCR/version; bridge/joint/geometry and accepted L; actual rail/gland/adhesive/cleaner specification and revision; gap/temperature/work periods; methods; provider gates; actual test/criteria/responsibility and handback; reference/property/unit; source and collection coverage"
  required_quality_disclosure: "Each actual identity/quantity and Range evidence; excluded host history; preparation/rework/reject paths; gross supply/return/stock/waste/release closure; shared complete-life observed/forecast attribution and uncertainty/sensitivity; transport/provider duplication check; remaining gaps"
  update_trigger: "Changed profile/formulation/rail condition or method; revised instruction/SDS/owner criteria; altered supplier/waste destination; new measurements/factors; changed asset forecast/termination or coverage and new defect/rework evidence"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version3.0 explanatory notes, 30June2025, printed284–285; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification bridge construction/repair/restoration context; narrower selected maintenance scope, no quantities"
  - id: "dsbrown-strip-seal-replacement-2024"
    type: "handbook"
    reference: "The D.S. Brown Company, Strip Seal Removal/Replacement, REV5/24,3pages; https://dsbrown.com/wp-content/uploads/2023/03/B_EJS_StripSealRemoval_INSTALL_v003.pdf"
    used_for: "Actual extraction, clean-out/conditional blasting, rail preparation, profile/weather conditions, specified adhesive, seating/mitres/upturns and cleanup; equipment roles and opened-container return restriction; no universal resource quantity"
  - id: "dsbrown-l2-installation-2024"
    type: "handbook"
    reference: "The D.S. Brown Company, L2 Series Strip Seal Installation Procedure, REV04/24,1page; https://dsbrown.com/wp-content/uploads/2020/12/B_L2_Series_Strip_Seal_INSTALL_v003.pdf"
    used_for: "L2 channels/lug seating, both sides, SSPA/SSCM compatibility and model-specific ease-of-installation opening; also modular use, which selected PCR excludes"
  - id: "dsbrown-1520-sds-2020"
    type: "handbook"
    reference: "The D.S. Brown Company, DSB1520 Lubricant Adhesive Safety Data Sheet, REV04/20, sections3,6–10,12–13; https://dsbrown.com/wp-content/uploads/2020/12/B_DPPS_Delastic_DSB1520LubricantAdhesive_SDS_v009-3.pdf"
    used_for: "Supplied mixture identity, solvent/isocyanate components, retained/collected/environmental partition and disposal evidence need; neither composition ranges nor exposure limits are emission factors"
