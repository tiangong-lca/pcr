          offset: 68148
          line: 686
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_service | both nodes | No co-product credit for retained rails, removed failed gland, scrap or waste. Preserve all actual removal/preparation/rework/test burdens in the intervention; assign only accepted complete-joint length L as service denominator. Failed host/rejected joint has no accepted output; disclose its burden and final route rather than hiding it. |  |\n| material_custody | both nodes | Input quantities remain gross net-of-tare before outward return netting. Reconcile receipt/issue with actual installed/used, real usable return, waste, release and closing stock by identity. Transfer evidenced opening-stock burden into this intervention and carry unused closing-stock burden into its later use; never represent retained stock as outward product. Use receipts or attributable internal issues without counting both for the same material. A separately metered consumed-only fuel alternative excludes unconsumed exits from that same exchange. For prepare_consumables/install_consumables the selected exchange is the attributable stock-adjusted S under consumable_stock_draw; the gross records remain raw evidence and this opening/closing burden bridge is its reconciliation only. Other material and fuel roles retain their original explicitly stated method. |  |\n| shared_life | atom_req_rail_qualification_prepare_assets; atom_req_gland_integration_install_assets | For each asset use actual job-node service over complete-life service; enumerate rail_qualification and gland_integration, all other jobs and reporting periods and lifecycle phases. Cover manufacture, maintenance, replacements and EOL once. Use completed observed histories or justified prospective remaining-service/replacement/termination/EOL scenario for an in-service asset; label observed/forecast and update/sensitivity. No duplicate direct fuel, spare, tool or provider-included capital. |  |\n| rework_routing | both nodes | Dirty cavity loops within rail_qualification; failed seating, tearing, leakage or misfit loops within gland_integration or returns via paired transfer to rail_qualification. Keep repeat energy/materials/test resources, route removed rejects to actual usable return or classified waste, and count final accepted length once. No future unowned cleanup/test task may close the gate. |  |\n| periods | both nodes | Index work windows, storage/idle/protection periods and repeat visits; link every input/event/output and shared-asset phase to its period and single owner. Sum the same intervention once across periods; do not annualise service output or invent future operating life. |  |\n| atom_grouped_ledgers | all actual-child records | Apply every existing stock, allocation, emission and closure formula separately by concrete child identity/material, state, one exchange property/unit, receiving medium and ownership/event scope. Native and converted views are nonadditive. A family diagnostic total is never a flow identity or every child numerator; keep incomplete portions explicit. Complete formulations, assemblies and genuinely bounded single-function services remain whole, with included constituents/resources not purchased again. |  |\n\n"
