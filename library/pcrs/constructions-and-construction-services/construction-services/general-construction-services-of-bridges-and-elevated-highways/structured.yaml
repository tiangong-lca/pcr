  calculation_rules:
    - id: calc_length_intensity
      applies_to: "all inventory rows"
      rule: "For each identified exchange divide its attributable intervention quantity Q in its native unit by accepted complete-joint length L in m; retain unit/m. The reference definition is 1 m. Sum repeats and periods once; do not sum heterogeneous identities. Internal coverage is actual paired transfer length divided by L."
      inputs:
        - Q
        - L
        - "corresponding node protocol"
        - cp_install_gate
      output: "Native-unit intensity per1 m accepted service"
      source_ids: []
    - id: consumable_stock_draw
      applies_to: "prepare_consumables_blade; prepare_consumables_cleanout_head; prepare_consumables_brush; install_consumables_duct_tape; install_consumables_brush; install_consumables_glove; atom_req_rail_qualification_prepare_consumables; atom_req_gland_integration_install_consumables"
      rule: "For each independently identified material/SKU, current state, owning stock scope and period, let O_kg = opening_mass_kg, R_kg = external_receipts_net_mass_kg and C_kg = closing_carried_mass_kg. The attributable gross draw before actual usable outward exits is S_kg = O_kg + R_kg - C_kg. R is measured net of tare across this scope boundary, not another node's internal feed; C is all intact unused stock carried forward across the actual custody locations, excluding positive outward exits, installed material, waste and processed WIP. Retain physical source-cohort balances before attribution. Where the original PCR requires a shared-material share, derive O/R/C from those same source records under one evidenced driver and complete consumer shares summing to one; S is already attributable, so never apply that share again. Only the declared acquisition owner records S as external supply. A real internal feed instead uses its independently evidenced paired transfer quantity, with no second acquisition or stock deduction. The card quantity is S_kg / L once, including all nonreturned waste/loss and any actual positive usable U/X exits before their separately documented original-upstream-burden handoff. U/X are disjoint real exits, not closing stock or fictitious inventory changes; all work/rework/handling burdens stay with the job. Record stock_adjustment_applied = true for this S representation. Opening and carried-closing source-cohort quantities and upstream dataset references explain this same assignment; the stock-burden bridge is its reconciliation only, never a second subtraction, compensating exchange or extra burden charge. Unknown cohort ownership, negative S or unexplained stock/fate discrepancies block completion."
      inputs:
        - opening_mass_kg
        - external_receipts_net_mass_kg
        - closing_carried_mass_kg
        - stock_scope_id
        - cohort_source_ids
        - cohort_quantities_kg
        - cohort_upstream_dataset_refs
        - attribution_driver
        - complete_consumer_shares
        - actual_fate_event_ids
        - stock_adjustment_applied
      output: "S_kg before normalization; stock_adjustment_applied = true"
      source_ids: []
    - id: calc_gland_mass
      applies_to: "gland_supply"
      rule: "Gland mass kg = actual supplied gland length m times evidenced same-batch/profile mass-per-length kg/m, or direct calibrated mass. Include actual factory geometry; do not assume elastic stretching or generic rubber density. Use gross net-of-tare supply before return netting."
      inputs:
        - cp_install_materials
        - measured_length_m
        - mass_per_length_kg_per_m
      output: "Actual supplied gland kg, then divide by L"
      source_ids: []
    - id: calc_fuel
      applies_to: "atom_req_rail_qualification_prepare_fuel; atom_req_gland_integration_install_fuel; atom_req_rail_qualification_prepare_air_release; atom_req_gland_integration_install_air_release"
      rule: "Burned fuel kg = opening fuel + gross receipts - closing fuel - outward usable returns - all collected unburned fuel waste - actual uncontained unburned fluid releases - any other distinct unburned outlet. Every outlet is mutually exclusive. Total spill is an audit partition only, never an additional subtraction: its recovered portion is included once in collected unburned fuel waste, usable return or closing stock, while its uncontained portion is included once in the actual unburned fluid release outlet. Retained incident residue belongs to closing stock or a distinct mutually exclusive unburned outlet. Carry opening-stock burden in and closing-stock burden forward; record receipts or attributable internal issues without duplication. Exclude provider-included fuel."
      inputs:
        - cp_prepare_energy
        - cp_install_energy
        - cp_prepare_waste
        - cp_install_waste
      output: "Burned fuel activity kg separately from gross input kg"
      source_ids: []
    - id: calc_asset_share
      applies_to: "atom_req_rail_qualification_prepare_assets; atom_req_gland_integration_install_assets"
      rule: "For each actual asset, provision Item(s) =1 Item(s) times node-job service h divided by complete-life service h; then divide by accepted L. Complete-life service includes all observed history plus justified prospective remaining service for an in-service asset. Full provision covers manufacture, maintenance, replacements and EOL once, excluding direct quantities owned elsewhere. Same service unit and all consumers/phases required."
      inputs:
        - cp_prepare_assets
        - cp_install_assets
        - node_service_h
        - complete_life_service_h
      output: "Fractional asset provision Item(s) per m"
      source_ids: []
    - id: calc_transport
      applies_to: "atom_req_rail_qualification_prepare_transport; atom_req_gland_integration_install_transport"
      rule: "Transport kg*km = sum of actual net cargo kg times leg km by identical provider/mode service; then divide by L. Retain actual empty-leg/shared-load attribution and boundary. A verified t*km unit has factor 1000 kg*km per t*km."
      inputs:
        - cp_prepare_assets
        - cp_install_assets
        - cargo_gross_kg
        - cargo_tare_kg
        - leg_km
      output: "kg*km per m by actual service"
      source_ids: []
    - id: calc_release
      applies_to: "atom_req_rail_qualification_prepare_air_release; atom_req_rail_qualification_prepare_water_release; atom_req_gland_integration_install_air_release; atom_req_gland_integration_install_water_release"
      rule: "For each substance/receiver, release kg = measured release mass, or actual compatible activity times evidenced applicable factor kg/activity, or concentration kg/m3 times actual discharge m3. Use one justified path and compatible units; then divide by L. Account for retained/collected/captured material and actual reaction/weather terms. SDS composition and uncharacterised residual are not release factors."
      inputs:
        - cp_prepare_waste
        - cp_install_waste
        - "actual activity"
        - "applicable factor"
        - "receiving compartment"
      output: "Species-specific release kg per m"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "all inventory rows"
      requirement: "Expand variable cards to each actual distinct material, formulation, waste stream, service or elementary species/receiver. Verify concrete identity/property/unit before final exchange binding; a generic placeholder is not a final dataset exchange."
      evidence: "Actual product/rail/gland certificates, current SDS, provider gates and identity detail verification"
    - id: gate_quality
      applies_to: "rail_qualification; gland_integration"
      requirement: "Retain paired transfer, sound host/profile suitability and whole-joint seating/continuity/cleanup evidence; only actual owner-required testing has declared method/threshold/tolerance/responsibility. Accepted L excludes unresolved rejected output."
      evidence: "cp_prepare_gate; cp_install_gate; signed defect closure and authorised handback"
    - id: balance_quality
      applies_to: "both nodes"
      requirement: "Reconcile net-of-tare gross receipts/issues, actual use/installation, outward returns, retained stock, wastes and species releases by identity; no stock-as-product, double-netting, captured-waste-as-release or residual-as-emission."
      evidence: "cp_prepare_materials; cp_install_materials; cp_prepare_waste; cp_install_waste; mass/length and water/dry-solids balances"
    - id: life_quality
      applies_to: "atom_req_rail_qualification_prepare_assets; atom_req_gland_integration_install_assets"
