functional_unit:
  what: "Mechanically locked elastomeric gland replacement in an identified retained sound single-gap bridge expansion joint"
  how_much: "1 m of accepted replacement along the measured as-built joint/seal centreline; actual upturns and factory mitres are included in the declared geometry"
  how_well: "Matched profile, movement duty, gap and temperature; clean qualified channels; both lugs fully seated without twist, stretch or damage; endpoints/mitres/upturns and cleanup accepted; actual required inspection/test criteria passed"
  how_long_or_cycle: "One complete intervention from protected access and removal through authorised maintenance handback, including repeats and defect closure; no promised future seal lifetime. Declare work periods and complete equipment-life phases separately."
