    used_for: "Current classification inclusion/exclusion: PDF p294 54622 external drains and 54621 indoor exclusion; p286 54251 local mains"
  - id: "charlotte-dr35"
    type: "handbook"
    reference: "https://www.charlottepipe.com/uploads/documents/technical/FO-SUB-PVC-DR-35.pdf"
    used_for: "p1 (4-7-26): DR35 gasket specification, supplied seals, water-only test and approximate shipping points"
  - id: "charlotte-plastics-manual"
    type: "handbook"
    reference: "https://www.charlottepipe.com/uploads/documents/technical/TM-PL.pdf"
    used_for: "PDF pp70–73, June 5 2026: gasket assembly, conditional underground support/backfill and visible-joint test/approval; not adjacent CPVC-specific rules"
  - id: "charlotte-underground"
    type: "handbook"
    reference: "https://www.charlottepipe.com/uploads/documents/technical/VE_PVCUnderground2015.pdf"
    used_for: "pp1–2: actual bedding/haunch/backfill support and compaction responsibility; no Schedule40 example quantity adopted"
