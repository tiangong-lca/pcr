measurement_rules:
  - id: reference_path
    applies_to: "reference product"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "D is the sum of uniquely identified final accepted conveyance-path centreline segments, in m, from the declared outside-building outlet datum to the prepared existing receiver datum. Include the centreline traversed through each fitting once; add no socket overlap. Exclude standalone cleanout access-riser length, removed/failed/uninstalled pieces and duplicate or overlapping test sections. Access-riser materials remain in inventory. Reconcile final as-built survey/segment IDs and endpoints; gross delivered, body, cut and laying lengths are separate records. Replacements retire the original ID and receive final IDs; only the final path enters D."
  - id: mass_conversion
    applies_to: "gasketed_dr35_pipe; gasketed_fittings_and_interfaces_elbow; gasketed_fittings_and_interfaces_branch; gasketed_fittings_and_interfaces_terminal; gasketed_fittings_and_interfaces_cleanout; replacement_gaskets; actual exchanges required by refine_imported_approved_fill; approved_gasket_lubricant; actual exchanges required by refine_cleaning_and_protection_consumables; actual exchanges required by refine_incoming_packaging; supplied_water; usable_stock_returns_pipe; usable_stock_returns_gasket; usable_stock_returns_lubricant; dry_nonusable_residuals_pipe_offcut; rejected_joint_components_joint_cutout; rejected_joint_components_separate_seal; contaminated_consumable_residuals_container; contaminated_consumable_residuals_wipe; contaminated_consumable_residuals_loose_formulation; used_water_to_recipient; actual exchanges required by refine_airborne_particulate; water_to_air; actual exchanges required by refine_other_evidenced_species_release"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated net weighing or validated exact SKU/stream/state conversion. Preserve raw amount, tare, density/moisture convention and factor source; different material pools stay separate. This rule does not convert electricity, service events or asset shares to mass."
  - id: energy_boundary
    applies_to: "installation_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Actual external metered kWh only, with actual shared-use/recharge allocation under cp_energy. Energy property support is unresolved; NCV is not a substitute."
  - id: count_scope
    applies_to: "owned_equipment_attribution_pump; owned_equipment_attribution_compactor; hired_support_service"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Fractional asset count means evidenced embodied share, not weighed mass or hourly use. Hired count activates only for a real complete contract event; actual hourly contracts retain hours and unverified Duration support."
