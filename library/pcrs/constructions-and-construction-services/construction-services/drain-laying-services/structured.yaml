      evidence: "cp_residuals"
    - id: range_water_to_air
      applies_to: "water_to_air"
      requirement: "Need actual exposed area/time/conditions for testing, cleaning or moisture conditioning, validated evaporation and source-pool partition; no default evaporation fraction."
      evidence: "cp_water"
    - id: range_other_evidenced_species_release
      applies_to: "actual exchanges required by refine_other_evidenced_species_release"
      requirement: "Need actual approved lubricant/cleaner SDS, applied mass, species, medium, control and partition/factor evidence. Gasket joining alone implies neither chemical identity nor release quantity."
      evidence: "cp_residuals"
    - id: refine_gasketed_fittings_and_interfaces
      applies_to: "gasketed_fittings_and_interfaces_elbow; gasketed_fittings_and_interfaces_branch; gasketed_fittings_and_interfaces_terminal; gasketed_fittings_and_interfaces_cleanout"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Reconcile the actual elbow/branch/terminal/cleanout BOM to item counts and measured or same-SKU net mass. Include supplied seals once. Existing authorized endpoints are provided; no new main, chamber or live tapping belongs here. Only the traversed fitting path enters D; access-riser material still enters inventory. Calculation rule: normalize_exchange. Range evidence need: Need endpoint compatibility/approval, as-built fitting and access BOM, SKU weights/seal boundary and actual replacements before any fitting kg/path-m interval. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual access-riser material and other adapters/functions require exact SKU/geometry/native unit; complete supplied fittings include seals once. Existing main/chamber/live tapping outside scope, only traversed fitting path enters service D."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_imported_approved_fill
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Use weighed tickets and stock/return/placement records. Distinguish bedding, haunch, initial cover and upper backfill even if the same material serves several phases. If converting surveyed volume, validate actual state-specific density and moisture; account pipe displacement, trench geometry and compaction. Excavated soil remains with the excavation supplier. Calculation rule: normalize_exchange. Range evidence need: Need project soil/load/cover design, phase geometry, material grade, weighed quantity, moisture/density basis, losses and placement acceptance. General 4 in bedding, 6 in on rock, 6 in layers and 85–95% compaction guidance is conditional, not an inventory interval or evidence of site compliance. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual independently supplied approved material/grade/moisture/state and unique Mass/kg quantity; same physical material used several phases recorded once with phase activity. Independent density/moisture/geometry/pipe displacement needed for volume bridge, excavated soil excavation-supplier owned."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_cleaning_and_protection_consumables
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record consumed SKU quantities from issues/returns and container deltas or validated article count-to-mass factors, linked to the cleaned object and event. Include only actual activities; reusable protection is equipment and solvent cleaner is not presumed. Calculation rule: normalize_exchange. Range evidence need: Need actual objects/frequency, product dose or article mass/composition, stock and captured residues; no generic cleaning kg/m interval. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual expendable SKU/function/material/state and independent issue/return/count-mass/container-delta method; reusable protection equipment separate, no presumed solvent cleaner."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_incoming_packaging
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Measure shipment-linked package mass or same-batch counts/tares and reconcile stock, reuse, returns and waste. Instantiate a burden input only where landed supply excludes that packaging burden; otherwise retain physical custody in the ledger without repeating manufacture. Calculation rule: normalize_exchange. Range evidence need: Need actual packaging material/weight and supplier boundary by shipment; even absence on bulk fill needs evidence. Packaging waste cannot stand in for a missing incoming source pool. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual shipment-linked packaging material/count/tare; burden input only where supplier gate excludes manufacture, otherwise physical ledger; stock/reuse/return/waste closure."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_owned_equipment_attribution
      applies_to: "owned_equipment_attribution_pump; owned_equipment_attribution_compactor"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record exact model/serial/count and actual job activity against documented same-basis lifetime activity across every consuming job/period. Allocate manufacture once; maintain actual manufacture, maintenance, replacement and retirement boundaries. A matching lifecycle dataset must explicitly include maintenance; otherwise correctly typed maintenance roles need review. Do not convert maintenance mass or hours into an asset count. Calculation rule: owned_asset_normalize. Range evidence need: Need asset-specific embodied evidence, all consumer/period activity, maintenance/replacement/termination and supported remaining-use uncertainty; no whole tool/job, standard lifetime or generic share interval. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other owned reusable tool/resource functions require exact function/model/serial/life-reference. Each uses owned_asset_normalize = asset_count*job_activity/lifetime_activity/D, all consumers and actual maintenance/retirement ownership; rented assets not owned."
      evidence: "cp_services; actual independent records and identity/unit evidence"
    - id: refine_usable_stock_returns
      applies_to: "usable_stock_returns_pipe; usable_stock_returns_gasket; usable_stock_returns_lubricant"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Weigh returned stock or use a validated same-SKU conversion; link original issue, unchanged usable state and receiving receipt. Keep pipe, seal, fill, lubricant and packaging returns separate. Choose a consistent gross issue/return or net-issue convention so the same return is not deducted twice. Calculation rule: normalize_exchange. Range evidence need: Need actual acceptance/quantity/state and prior issue convention for each returned SKU, including unused fill and lubricant balances; no default return fraction. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual fill material, packaging and other product return identities/receivers require matching input native reference; gross/net convention once, no retained stock or credit."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_dry_nonusable_residuals
      applies_to: "dry_nonusable_residuals_pipe_offcut"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Weigh each collected dry stream with tare, composition, source-pool and recipient ticket. Pipe offcuts, packaging and actual fill losses remain separate identities. Retained fill and reusable packaging are not waste. Calculation rule: normalize_exchange. Range evidence need: Need actual cut plan, pack losses, rejected/excess fill destination, collection and mass records; no universal waste percentage or mixed-material exchange. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual fill loss material, packaging and other dry residual streams require independent identity/state/source/receiver; no unlike-material sum."
      evidence: "cp_residuals; actual independent records and identity/unit evidence"
    - id: refine_rejected_joint_components
      applies_to: "rejected_joint_components_joint_cutout; rejected_joint_components_separate_seal"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Weigh actual damaged, displaced-seal or leaking joint cutouts, or apply matched SKU factors; link original, removed and replacement IDs, failed test and recipient. Reseating without an external material exit is a correction event, not waste. Retired pieces cannot enter D. Calculation rule: normalize_exchange. Range evidence need: Need observed cause, composition/mass, replacement linkage and destination. Recognized gasket displacement risk does not establish a defect rate. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Different actual damaged components/material/receiver states require exact records; link original/removal/replacement/test IDs, retired pieces not service D."
      evidence: "cp_residuals; actual independent records and identity/unit evidence"
    - id: refine_contaminated_consumable_residuals
      applies_to: "contaminated_consumable_residuals_container; contaminated_consumable_residuals_wipe; contaminated_consumable_residuals_loose_formulation"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Measure container/wipe tare and collected formulation residue, keeping composition, classification and receiver. Reconcile applied, retained, captured and released constituent pools. Actual acceptance conditions determine waste classification; do not assume hazardous status or emission. Calculation rule: normalize_exchange. Range evidence need: Need actual SDS/formulation, container/wipe retention, residue quality and recipient requirements; neither a generic VOC nor hazardous fraction is supported. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual composition/state/classification/receiver differences require separate records, no presumed hazard/emission; applied/retained/captured/released pools disjoint."
      evidence: "cp_residuals; actual independent records and identity/unit evidence"
    - id: refine_airborne_particulate
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Quantify exact material/size-specific release by monitoring or a validated factor matched to actual cutting, fill handling or compaction activity and controls. Specify receiving air subcompartment. Captured dust is waste; excavation-provider releases and unexplained mass differences are excluded. Calculation rule: release_normalize. Range evidence need: Need composition/size fraction, actual task activity, wetting/enclosure/capture and matched measurement/factor; no total-dust-to-PVC/PM split or universal interval. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_residuals; actual independent records and identity/unit evidence"
    - id: refine_other_evidenced_species_release
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Instantiate only an identified chemical species and actual medium/subcompartment. Measure its mass or use verified composition, applied activity and matched release/fate factor; reconcile installed film, captured residue and recipient transfer. Air, water and soil are separate exchanges; recipient wastewater is not elementary release. Calculation rule: release_normalize. Range evidence need: Need actual approved lubricant/cleaner SDS, applied mass, species, medium, control and partition/factor evidence. Gasket joining alone implies neither chemical identity nor release quantity. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_residuals; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
validation_rules:
  - rule_id: validate_scope_gate
    applies_to: "reference product"
    rule: "Require declared external endpoints, approved six-inch gasketed DR35 specification and trench/temporaryworks owners. Check exposed-joint water test and concealment approval precede full cover; full cover, compaction, bare-ground grade and final signature precede accepted output. Do not apply air/gas testing or solvent-route cure conditions."
    source_ids: []
  - rule_id: validate_reference
    applies_to: "accepted_external_drain_connection"
    rule: "Verify D > 0 under reference_path and cp_acceptance. Include fitting path once, no socket overlap or cleanout access riser; reject gross-cut substitution, duplicate tests and retired failed pieces. All card numerators use the same accepted-job D."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "rejected_joint_components_joint_cutout; rejected_joint_components_separate_seal; external_drain_install"
    rule: "Link damaged/misaligned/leaking/displaced-seal joint or failed fill/grade event to its original resource issue, correction/reseat/replacement, test/reapproval and final path/phase ID. Classify real usable return, nonusable waste and captured residue with recipients; internal correction without exit is an event. Keep correction burdens and exclude failed work from D."
    source_ids: []
  - rule_id: validate_quantities
    applies_to: "all inventory rows"
    rule: "Require actual SKU/state/recipient instances with compatible units, linked node-owned protocol, raw numerator and conversion evidence. Check fill phases and integral/replacement seals once; water batches/constituents and retained/recipient/environmental states exclusive. Do not turn imbalance into dust, evaporation or chemical release."
    source_ids: []
  - rule_id: validate_assets
    applies_to: "owned_equipment_attribution_pump; owned_equipment_attribution_compactor; hired_support_service"
    rule: "Review all consumers/periods, lifecycle events and maintenance dataset boundary, exact attribution and uncertainty. Prevent rented/owned, manufacture/replacement and recharge/use overlap. Unsupported hourly service and unknown remaining life/termination remain explicit blockers to finalized attribution."
    source_ids: []
  - rule_id: validate_identity_evidence
    applies_to: "all inventory rows"
    rule: "Final downstream exchanges require verified concrete identities and property/unit compatibility. Candidate names are not binding. Resolve exact Energy support for electricity and Duration support for a real hourly service before using those exchanges. Keep each role-specific range need visible; approximate shipping points and sample design notes are not observed quantity intervals or project approval."
    source_ids: []
  - rule_id: atomization_gasketed_fittings_and_interfaces_complete
    applies_to: "gasketed_fittings_and_interfaces_elbow; gasketed_fittings_and_interfaces_branch; gasketed_fittings_and_interfaces_terminal; gasketed_fittings_and_interfaces_cleanout"
    rule: "Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying refine_gasketed_fittings_and_interfaces with actual records; unresolved required expansion blocks the dataset."
