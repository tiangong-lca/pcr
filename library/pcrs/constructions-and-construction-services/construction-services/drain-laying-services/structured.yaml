      evidence: "cp_energy"
    - id: range_owned_equipment_attribution
      applies_to: "owned_equipment_attribution_pump; owned_equipment_attribution_compactor"
      requirement: "Need asset-specific embodied evidence, all consumer/period activity, maintenance/replacement/termination and supported remaining-use uncertainty; no whole tool/job, standard lifetime or generic share interval."
      evidence: "cp_services"
    - id: range_hired_support_service
