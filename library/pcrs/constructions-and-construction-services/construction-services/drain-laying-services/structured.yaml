system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "Applies to installation of a six-inch rigid PVC DR35 gasket-jointed gravity sanitary building lateral on private untrafficked bare ground, from an existing outside-building outlet to a prepared authorized existing receiver. The installer owns new bedding, laying, gasket assembly, haunching, actual water testing/correction, complete imported backfill, layer compaction and agreed bare-ground grade through final signed acceptance. The selected route uses manual bar/block insertion and actual manual or grid/battery-electric support equipment. Project design, soil/load conditions, compatible products and competent acceptance criteria must be declared; public manufacturer guidance and local sample notes do not constitute a site design."
      source_ids: []
    - rule_id: boundary_owner
      applies_to: "external_drain_install"
      rule: "Start only after documented safe stable pre-excavated trench and compatible existing external endpoints are handed over. Excavation, separately owned shoring/dewatering and removed-soil custody/haulage stay with their declared suppliers; disclose their required upstream responsibility and prevent hidden omission in downstream aggregation. No excavated soil enters selected fill."
      source_ids:
        - cpc3-current
    - rule_id: installation_gate
      applies_to: "external_drain_install"
      rule: "Sequence readiness → new bedding/pipe/fitting/gasket/haunch with joints visible → compatible water-only test, corrections/retests and competent concealment approval → full new imported cover, layer compaction and agreed bare-ground grade → signed final as-built acceptance. Keep every phase in one node; cover-ready is not final output."
      source_ids:
        - charlotte-plastics-manual
        - seattle-side-sewer-notes-2024
    - rule_id: gasket_joining
      applies_to: "gasketed_dr35_pipe; gasketed_fittings_and_interfaces_elbow; gasketed_fittings_and_interfaces_branch; gasketed_fittings_and_interfaces_terminal; gasketed_fittings_and_interfaces_cleanout"
      rule: "Clean bell/seal/spigot, confirm seated seal, use approved lubricant and straight manual bar/block insertion to the correct mark. Abnormal resistance requires disassembly/check rather than powered forcing. Field cuts are square, bevelled and re-marked to matching component instructions. No solvent or curing step is implied."
      source_ids:
        - charlotte-plastics-manual
    - rule_id: resources_and_scope
      applies_to: "all inventory rows"
      rule: "Include actual permanent components, every approved imported-fill phase, consumables, packaging source pool, external water/electricity, attributed owned resources and true hired service. Use manual or grid/battery-electric resources only in this route; combustion or live bypass requires reviewed scope change. Mains/new chambers, indoor piping, pavement/road crossing, landscaping beyond bare grade and later operation/treatment are excluded. Landed supply datasets must disclose delivery and packaging boundaries."
      source_ids:
        - charlotte-dr35
        - charlotte-underground
    - rule_id: asset_periods
      applies_to: "owned_equipment_attribution_pump; owned_equipment_attribution_compactor; hired_support_service"
      rule: "Identify actual insertion tools/cutter/compactor/pump/meter/charger and ownership, manufacture/acquisition, all consuming jobs and reporting periods, maintenance/replacement and retirement. Link actual job inputs/events and accepted handover to this common period index; electricity and hired-provider burdens have single owners. Unknown utilization is retained as a gap."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Safe stable pre-excavated trench on private untrafficked bare ground; compatible provided outside-building outlet and prepared authorized existing receiver; temporaryworks separately owned; no live tapping/bypass"
  starting_condition_role: "Documented upstream construction/endpoints handoff, not an invented readiness exchange"
  product_classification_scope: "CPC 3.0 54622; outside-building drain-laying subset, excluding 54621 indoor piping and 54251 local mains"
  recursive_input_rule: "Do not consume the same completed drain service recursively. Record supplied components/resources and separately owned upstream site responsibilities; an alternative completed-service starting point requires reviewed boundary change."
  upstream_dataset_requirement: "Matching delivered component/fill/lubricant/water/electricity and owned/provider lifecycle datasets; disclose delivery/packaging/maintenance. Preserve separately required trench/temporaryworks responsibility for downstream aggregation without duplicate soil haul."
  disclosure: "Actual site/design/owners/endpoints; handoff and final gate; resource/period boundaries; measured D; all quantity, identity, support and range gaps"
