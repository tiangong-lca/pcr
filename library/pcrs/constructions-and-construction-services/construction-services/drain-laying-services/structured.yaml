allocation_rules:
  - rule_id: single_output
    applies_to: "external_drain_install"
    rule: "One intended accepted lateral service; stock returns and residual exits are not intended co-products. Keep actual correction, replacement, extra water test and deficient fill/compaction correction resources in this accepted job, once. Failed and held work is not accepted output."
    source_ids: []
  - rule_id: return_convention
    applies_to: "usable_stock_returns_pipe; usable_stock_returns_gasket; usable_stock_returns_lubricant"
    rule: "Declare gross custody flows plus real returns, or reconcile net resource consumption to those flows. Do not both net issues and deduct the same return again. No default recovery/avoided-product credit follows a waste dispatch or stock return."
    source_ids: []
  - rule_id: owned_asset_shares
    applies_to: "owned_equipment_attribution_pump; owned_equipment_attribution_compactor"
    rule: "Attribute exact asset manufacture by actual same-basis job/lifetime activity and enumerate every consumer/period. Shares reconcile to 1 over the stated history/remaining-use basis. Maintenance/replacement goes to evidenced benefiting periods or causal job; a matched lifecycle dataset must own it, or correctly typed separate roles require review. Closed assets use closed history; in-service remaining use needs supported estimates and uncertainty. Unknown maintenance/termination blocks finalized attribution."
    source_ids: []
  - rule_id: resource_nonoverlap
    applies_to: "owned_equipment_attribution_pump; owned_equipment_attribution_compactor; hired_support_service; installation_electricity; actual exchanges required by refine_incoming_packaging"
    rule: "Provider service owns rented asset burdens; operator-owned assets are separate. Reconcile manufacture, each maintenance/replacement/retirement event and period share once; do not annualize lifetime-attributed burdens again or assign whole original and replacement assets simultaneously. Meter electricity/charging once. Preserve embedded packaging custody without duplicating its upstream manufacture."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "external_drain_install"
      flow_role: "material/SKU/phase and packaging"
      record_type: "actual measured/traceable event records"
      raw_fields: "shipment; SKU/lot/specification; component/phase ID; receipt/issue/return/stock; mass/tare; net factor source; fill moisture/density; packaging owner; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Weigh or use validated same-SKU net factors. Reconcile actual pipe/fitting/seal/lubricant/consumable quantities. Keep fill bedding/haunch/initial/upper phases and stock distinct; packaging physical pool and upstream burden owner are separate. Quantity aggregation: actual attributable external quantity / D; internal movement is ledger only Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "Each custody/placement event"
      temporal_coverage: "receipt to final stock/residual closure"
      site_scope: "one job, every selected shipment and placement phase"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; tickets; SKU net evidence; phase placement and supplier boundary"
    - protocol_id: cp_water
      process_id: "external_drain_install"
      flow_role: "external/retained/reused/dispatched water"
      record_type: "actual measured/traceable event records"
      raw_fields: "source/quality; volume or meter intervals; density/temperature; batch/reuse IDs; test head/hold/venting; retained inventory; recipient; aggregate/formulation water"
      collection_method: "Meter external supply and each outgoing/retained batch separately. Weigh or convert with actual density; preserve internal reuse and constituent water in fill/lubricant. Record actual water-only tests, retests, cleaning and approved moisture conditioning; no balance remainder is assigned a fate. Quantity aggregation: each actual external input/output mass / D; internal reuse excluded"
      unit: "kg"
      frequency: "Each withdrawal/test/transfer event"
      temporal_coverage: "first water activity through final retained/recipient closure"
      site_scope: "one job and all test/placement water batches"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; batch journal; quality/density evidence; receiver receipt"
    - protocol_id: cp_energy
      process_id: "external_drain_install"
      flow_role: "external tool/pump/compactor/charging energy"
      record_type: "actual measured/traceable event records"
      raw_fields: "asset/phase; source/provider; interval start/end kWh; battery charge/activity share; charger boundary; all shared users"
      collection_method: "Read calibrated supply meters. Allocate shared loads and battery recharge using matching complete activity/charge records; include charger loss only inside stated supply boundary. Do not count battery operation and recharge twice or infer energy for manual work. Combustion equipment requires route review. Quantity aggregation: actual attributable external kWh / D"
      unit: "kWh"
      frequency: "Each supply interval and recharge"
      temporal_coverage: "installation through corrections and final compaction"
      site_scope: "one job and complete shared-meter interval"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; charging/share reconciliation; manual/no-electric-use evidence"
    - protocol_id: cp_services
      process_id: "external_drain_install"
      flow_role: "owned asset share and true hired event"
      record_type: "actual measured/traceable event records"
      raw_fields: "ownership; model/serial/count; all consumers/jobs/periods; actual and lifetime same-basis activity; manufacture/maintenance/replacement/termination; provider unit/event or hours; upstream readiness IDs; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Index manufacture/acquisition, all service periods, actual maintenance/replacement and retirement. Record matched lifecycle dataset inclusions; otherwise review correctly typed maintenance roles. Count only complete accepted provider events; hours keep their true quantity/support gap. Link separately owned excavation/temporaryworks readiness without importing their burdens. Quantity aggregation: asset count × actual job activity/lifetime activity / D; actual accepted event count × job share / D Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "Item(s)"
      frequency: "Each asset/service/lifecycle event"
      temporal_coverage: "whole documented asset service history plus job dates"
      site_scope: "this job and every consuming job/period in asset denominator"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset/period registers; contract/acceptance; lifecycle dataset boundary; remaining-use uncertainty"
    - protocol_id: cp_residuals
      process_id: "external_drain_install"
      flow_role: "material waste and evidenced species release"
      record_type: "actual measured/traceable event records"
      raw_fields: "stream/material/species/size/state; gross/tare/composition; source/phase/old/new ID; receiver/medium/subcompartment; measured release or factor/activity/control; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Weigh actual exit streams separately by identity and recipient. Trace removed joints and replacement events. Quantify emissions only by specific measurements or a validated matched species/material/control factor with actual activity; distinguish captured waste, retained constituents and direct release. Quantity aggregation: each actual waste/species quantity / D; no automatic residual-to-air assignment Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "Each exit/reject/release event"
      temporal_coverage: "receipt through final correction/dispatch"
      site_scope: "one job, actual installer-owned releases only"
      aggregation_rule: "per reference flow"
      quality_evidence: "tare/calibration; dispatch tickets; composition; factor applicability and uncertainty"
    - protocol_id: cp_acceptance
      process_id: "external_drain_install"
      flow_role: "final accepted buried conveyance path"
      record_type: "actual measured/traceable event records"
      raw_fields: "provided endpoint datums/authorization; trench readiness owner; final path/segment IDs and lengths; fitting/access distinction; visible-joint water test/retest; concealment approval; fill/layer/compaction/grade evidence; signature/date"
      collection_method: "Survey and reconcile final unique conveyance centreline as reference_path. Record ready trench/endpoints, gasket laying/haunch, exposed-joint compatible water test and correction, competent concealment approval, then full cover/layer compaction and agreed bare-ground grade, then final signed buried-lateral acceptance. Failed or merely cover-ready work contributes no D. Quantity aggregation: final accepted path D / D = 1 m reference flow"
      unit: "m"
      frequency: "Each inspection/correction and final survey/handover"
      temporal_coverage: "ready-trench handoff through signed final acceptance"
      site_scope: "one actual external outlet-to-receiver path set"
      aggregation_rule: "per reference flow"
      quality_evidence: "as-built survey; test/approval chronology; full backfill/compaction records; final signature"
  calculation_rules:
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "Divide the actual attributable external quantity by D, retaining its own numerator unit and conversion evidence. For the final accepted path, D / D gives 1 m reference flow. Do not repeat internal transfers or embedded supply inputs."
      inputs:
        - "actual external quantity"
        - D
        - "linked collection protocol"
      output: "quantity per reference flow"
      source_ids: []
    - id: owned_asset_normalize
      applies_to: "owned_equipment_attribution_pump; owned_equipment_attribution_compactor"
      rule: "q_asset_per_m = asset_count × job_activity / lifetime_activity / D. Use the same documented activity basis for all consumers; manufacture once, maintenance/replacement by evidenced benefiting periods or causal job with explicit dataset ownership."
      inputs:
        - asset_count
        - job_activity
        - lifetime_activity
        - D
        - cp_services
      output: "attributed Item(s) per reference flow"
      source_ids: []
    - id: hired_service_normalize
      applies_to: "hired_support_service"
      rule: "q_service_per_m = true_contract_quantity × job_share / D. Here Item(s) applies only to an actual complete defined accepted event. A true hour contract requires reviewed Duration support; preserve hours and the gap."
      inputs:
        - true_contract_quantity
        - job_share
        - D
        - cp_services
      output: "true service quantity per reference flow"
      source_ids: []
    - id: fill_diagnostic
      applies_to: "actual exchanges required by refine_imported_approved_fill"
      rule: "Keep surveyed phase volumes separate. Prefer weighed fill attributed to each phase; otherwise mass = actual phase volume × validated site/state bulk density with declared moisture convention. Deduct actual pipe displacement where applicable; reconcile all placed phases, returns, stocks and losses once."
      inputs:
        - "phase geometry"
        - "ticket mass"
        - density
        - moisture
        - cp_materials
        - cp_acceptance
      output: "phase mass diagnostic before normalize_exchange"
      source_ids: []
    - id: release_normalize
      applies_to: "actual exchanges required by refine_airborne_particulate; water_to_air; actual exchanges required by refine_other_evidenced_species_release"
      rule: "Use actual measured species mass / D, or actual matched activity × validated species-specific release factor / D. Identify real medium/subcompartment and controls; unknown partition or unmatched factor remains a gap."
      inputs:
        - "species mass or activity/factor"
        - D
        - cp_residuals
        - cp_water
      output: "species kg per reference flow"
      source_ids: []
    - id: source_pool_balance
      applies_to: "material and constituent ledgers"
      rule: "Opening stock + receipts = closing stock + usable returns + installed retention + captured/recipient waste + evidenced environmental release, with compatible units and uncertainty. Reconcile separate physical material/constituent pools, including packaging custody, aggregate moisture and formulation water; no automatic fate from an imbalance."
      inputs:
        - stocks
        - receipts
        - retention
        - returns
        - waste
        - release
        - cp_materials
        - cp_water
        - cp_residuals
      output: "diagnostic physical pool balance"
      source_ids: []
  data_quality_requirements:
    - id: dq_traceability
      applies_to: "all inventory rows"
      requirement: "Retain event dates, node ownership, actual SKU/state/recipient, instrument calibration, raw numerator/unit and matched conversion provenance. Unknown occurrence is unknown, not zero. Maintain physical and constituent pools separately with uncertainty."
      evidence: "cp_materials; cp_water; cp_energy; cp_services; cp_residuals; cp_acceptance"
    - id: dq_public_evidence
      applies_to: "all inventory rows"
      requirement: "Manufacturer shipping points are not net consumption or intervals. Engineering bedding/compaction recommendations and Seattle sample notes require actual site/design adaptation; no default density, water ratio, reject fraction, lubricant dose, lifetime or emission split is established."
      evidence: "charlotte-dr35; charlotte-plastics-manual; seattle-side-sewer-notes-2024"
    - id: range_gasketed_dr35_pipe
      applies_to: "gasketed_dr35_pipe"
      requirement: "A comparable quantity interval needs exact gasketed SKU net weight, socket/seal inclusion, cut plan, fitting mix, rejects and returns. The 14 ft and 20 ft gasketed shipping points, 249.6 and 247.0 lb/100 ft, are approximate shipping data, not net installed factors or Range endpoints."
      evidence: "cp_materials"
    - id: range_gasketed_fittings_and_interfaces
      applies_to: "gasketed_fittings_and_interfaces_elbow; gasketed_fittings_and_interfaces_branch; gasketed_fittings_and_interfaces_terminal; gasketed_fittings_and_interfaces_cleanout"
      requirement: "Need endpoint compatibility/approval, as-built fitting and access BOM, SKU weights/seal boundary and actual replacements before any fitting kg/path-m interval."
      evidence: "cp_materials"
    - id: range_replacement_gaskets
      applies_to: "replacement_gaskets"
      requirement: "Need actual compatible dimensions/material, net mass, extra issue count, replacement cause and destination. ASTM F477 conformity does not identify an elastomer or its mass."
      evidence: "cp_materials"
    - id: range_imported_approved_fill
      applies_to: "actual exchanges required by refine_imported_approved_fill"
      requirement: "Need project soil/load/cover design, phase geometry, material grade, weighed quantity, moisture/density basis, losses and placement acceptance. General 4 in bedding, 6 in on rock, 6 in layers and 85–95% compaction guidance is conditional, not an inventory interval or evidence of site compliance."
      evidence: "cp_materials"
    - id: range_approved_gasket_lubricant
      applies_to: "approved_gasket_lubricant"
      requirement: "Need approved product/SDS, composition, application mass, density for volume conversion, spills/residues and actual fate/control; no universal kg/joint or kg/m dose is established."
      evidence: "cp_materials"
    - id: range_cleaning_and_protection_consumables
      applies_to: "actual exchanges required by refine_cleaning_and_protection_consumables"
      requirement: "Need actual objects/frequency, product dose or article mass/composition, stock and captured residues; no generic cleaning kg/m interval."
      evidence: "cp_materials"
    - id: range_incoming_packaging
      applies_to: "actual exchanges required by refine_incoming_packaging"
