product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.roof-framing-services"
  classification_refs: "CPC 3.0 54522 — Roof framing services; proposed narrower mapping"
  covered_products: "First erection-stage service for the actual complete factory metal-plate-connected timber roof-truss set, including specified bearing connections and permanent individual-member restraints/braces, with documented temporary stability"
  excluded_products: "Stick framing; steel or floor trusses; truss manufacture or modification; host construction; full roof/diaphragm or weatherproofing; building operation"
  representative_product: "An identified roof-truss package delivered factory assembled, erected to its placement plan and handed over with all required braces and any necessary temporary restraint retained"
  production_route: "Review actual current documents and host readiness; receive and inspect finished trusses; arrange lifting/access and temporary stability; place and anchor; install permanent restraints/braces; correct placement/fixings without truss modification; inspect and transfer responsibility"
  market_state: "Site-specific completed erection-stage construction service; later diaphragm completion is separately declared and must not be assumed at this gate"
functional_unit:
  what: "Qualified first erection of the actual complete declared timber roof-truss set at the braced erection-stage handover"
  how_much: "1 Item(s); one complete set/package, with every specified truss ID and layout declared"
  how_well: "Accepted bearings; specified truss locations, connections and permanent member bracing complete; no unresolved damage or unapproved alteration; temporary system stability and custody documented; signed inspection and handover"
  how_long_or_cycle: "One erection work package from receipt through signed erection-stage handover. Record erection dates, retained-bracing continuation until the later stability gate, replacements and removal events; no building service-life claim"
  reference_flow_link: "erected_roof_truss_set"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers first erection of a declared factory-made metal-plate-connected timber roof-truss set on accepted existing bearing structures. The output is the complete qualified erection-stage service: the specified trusses positioned and connected, required permanent individual-member restraints and bracing installed, and temporary system stability documented and retained where needed. It is neither one loose factory truss nor complete roof-building performance. CPC 3.0 54522 includes truss framing; this PCR covers a narrower timber-truss route, excluding stick framing and metal trusses (un-cpc3-2025). The actual truss design drawings, placement documents, current jobsite package, accepted bearing interfaces and engineer-approved erection, temporary-stability and permanent-bracing plans are mandatory foreground evidence. SBCA's public 2023 article establishes the installation sequence; its numerical prescriptions are not universal design values. The current BCSI landing page identifies the revised 2025 edition; citing that page does not establish access to the full guide. Record the editions and applicability of instructions actually used (sbca-installation-2023; sbca-bcsi-current; sbca-jobsite-packages). Exclude factory manufacture; site cutting, notching or drilling of trusses; unapproved repairs; floor trusses; wall/bearing construction; roof sheathing, diaphragm construction, covering and waterproofing; MEP loading; building use and demolition. Suspect trusses are quarantined for manufacturer/engineer disposition. Authorized structural repair requires a separate reviewed boundary. Pre-sized specified braces and connectors are installed in this route; an independent site-fabrication operation requires boundary review."
      source_ids:
        - un-cpc3-2025
        - sbca-installation-2023
        - sbca-bcsi-current
        - sbca-jobsite-packages
    - rule_id: document_and_host_gate
      applies_to: "roof_truss_erection"
      rule: "Before erection, reconcile actual truss design/placement/jobsite documents, approved erection/bracing plans and accepted bearings; resolve conflicts through the responsible designer/manufacturer. Record project-specific applicability rather than importing public article dimensions or tolerances."
      source_ids:
        - sbca-installation-2023
        - sbca-bcsi-current
        - sbca-jobsite-packages
    - rule_id: erection_components
      applies_to: "roof_truss_erection"
      rule: "Own finished trusses, additional bearing fasteners/hangers, permanent brace/restraint members and their fixings, temporary-stability service, lifting/access, installation energy, freight, actual auxiliary consumption, packaging and correction losses. Identify which items are already in the supplied kit to avoid counting them twice."
      source_ids:
        - sbca-installation-2023
        - sbca-bcsi-current
        - sbca-jobsite-packages
    - rule_id: erection_gate
      applies_to: "erected_roof_truss_set"
      rule: "Handover requires every specified truss positioned, securely connected at its accepted bearings, required permanent individual-member restraints/bracing installed, closed inspection findings and signed responsibility transfer. This is an erection-stage gate; do not claim complete roof load, weather, fire or thermal performance."
      source_ids:
        - sbca-installation-2023
        - sbca-bcsi-current
        - sbca-jobsite-packages
    - rule_id: retained_temporary_stability
      applies_to: "temporary_stability_service"
      rule: "Where a later diaphragm is needed, retain required temporary restraint. Index erection, post-handover continuation, later stability confirmation and authorized removal/return; name custody and removal owner at each change. A bounded service must include or explicitly link asset production, installation, maintenance/use, replacement, removal, return transport and end-of-use treatment; it cannot erase these burdens."
      source_ids:
        - sbca-installation-2023
        - sbca-bcsi-current
        - sbca-jobsite-packages
    - rule_id: external_repair_boundary
      applies_to: "roof_truss_erection"
      rule: "Placement/connection corrections loop within this node with their full resource burdens. Damaged, unsuitable or altered trusses remain quarantined; return or characterize their waste exit. Cutting/notching/drilling trusses and structural repair are not admitted operations in this PCR."
      source_ids:
        - sbca-installation-2023
        - sbca-bcsi-current
        - sbca-jobsite-packages
    - rule_id: resource_and_release_boundary
      applies_to: "roof_truss_erection"
      rule: "For crane, access, temporary bracing and freight, identify full provider coverage and every actual consumer/period, including other work packages. If the provider includes operation fuel/emissions, do not add the same operation again. For directly controlled equipment collect fuel, energy and characterized direct releases separately; no unmeasured zero assumption."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Factory-complete identified timber trusses and specified installation components at their declared supply gate, with existing bearings accepted for the actual package and lifting access available"
  starting_condition_role: "Foreground erection boundary; host readiness is a documented interface, not a zero-burden substitute for construction in a whole-building model"
  product_classification_scope: "Narrower timber-truss erection subset of CPC 3.0 54522; separate from roof coverings under 54530"
  recursive_input_rule: "Record factory trusses as component products, not as this erection service. If a previously erected set or subcontracted erection service enters the package, disclose its completed scope and prevent repeating the same erection or resource burden; a relocation is outside first erection."
  upstream_dataset_requirement: "Use actual supply-gate truss/component and resource datasets with declared packaging, freight, energy and temporary-asset coverage. Include upstream manufacture through these inputs; do not recreate factory production in the site node."
  disclosure: "Declare supplied-kit coverage, excluded host/diaphragm work, physical state and responsibilities at the erection gate, all shared consumers and periods, and temporary-support production/use/removal coverage and later owner. Unresolved stability or service coverage blocks a completed dataset."
