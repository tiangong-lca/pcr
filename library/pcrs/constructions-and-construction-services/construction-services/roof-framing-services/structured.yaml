published_dataset_profile:
  dataset_role: "Foreground site erection data package, with process and lifecyclemodel projections and actual component/resource background links"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Model first erection of the declared matching timber roof-truss set at its qualified braced erection-stage gate, with disclosed later stability obligations"
  excluded_use: "Generic roof area, one factory truss, complete building/roof structural or weather performance, floor/metal trusses, relocation, manufacturing or structural repair"
  required_metadata: "All required reference qualifiers; node and set ID; supply-kit and provider boundaries; component/resource geography and dates; P1/P2/P3 owners/events; all-consumer allocation; receiver/stock/waste paths; actual source versions and exchange identities"
  required_quality_disclosure: "Identity and support gaps; unresolved Range evidence; measurements and uncertainty; exclusions; shared/capital/service/termination coverage; actual later diaphragm dependency and support-removal responsibility"
  update_trigger: "Changed design/package or host interface; current instruction applicability; truss/bracing/connection specification; damaged/altered components; service/provider allocation or phase owner; resource/factor identity; revised stability gate or removal plan"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 explanatory notes, 30 June 2025, printed p. 291, 54522 and adjacent 54530. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope and narrower roof-truss route; roof-covering separation"
  - id: "sbca-installation-2023"
    type: "extension_guidance"
    reference: "Structural Building Components Association, BCSI Guides Truss Installation Process, Pt 2, 8 August 2023. https://www.sbcacomponents.com/media/bcsi-guides-truss-installation-process-pt-2"
    used_for: "Qualitative pre-review, bearing/placement/anchoring, temporary stability, permanent member-bracing and inspection sequence; no universal numerical design values adopted"
  - id: "sbca-bcsi-current"
    type: "extension_guidance"
    reference: "Structural Building Components Association, Building Component Safety Information Guide landing page, revised BCSI-2025, accessed 15 October 2026. https://www.sbcacomponents.com/bcsi"
    used_for: "Current edition context and distinction of temporary/permanent restraint and bracing; full paid guide not claimed read"
  - id: "sbca-jobsite-packages"
    type: "extension_guidance"
    reference: "Structural Building Components Association, Jobsite Packages, accessed 15 October 2026. https://www.sbcacomponents.com/jobsite-packages"
    used_for: "Job-specific installation/safety package and truss design/project-document requirement; actual package applicability remains foreground evidence"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:9f1cd419cf06a60d6fe53aa3e10e7cb92d011ad3e8da8e69423eac18c228e697"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6860"
      family: "system_boundary"
      span:
        start:
          offset: 6860
          line: 60
          column: 1
        end:
          offset: 13104
          line: 86
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Factory-complete identified timber trusses and specified installation components at their declared supply gate, with existing bearings accepted for the actual package and lifting access available |\n| starting_condition_role | Foreground erection boundary; host readiness is a documented interface, not a zero-burden substitute for construction in a whole-building model |\n| product_classification_scope | Narrower timber-truss erection subset of CPC 3.0 54522; separate from roof coverings under 54530 |\n| recursive_input_rule | Record factory trusses as component products, not as this erection service. If a previously erected set or subcontracted erection service enters the package, disclose its completed scope and prevent repeating the same erection or resource burden; a relocation is outside first erection. |\n| upstream_dataset_requirement | Use actual supply-gate truss/component and resource datasets with declared packaging, freight, energy and temporary-asset coverage. Include upstream manufacture through these inputs; do not recreate factory production in the site node. |\n| disclosure | Declare supplied-kit coverage, excluded host/diaphragm work, physical state and responsibilities at the erection gate, all shared consumers and periods, and temporary-support production/use/removal coverage and later owner. Unresolved stability or service coverage blocks a completed dataset. |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `scope_eligibility` | foreground_system_boundary | This PCR covers first erection of a declared factory-made metal-plate-connected timber roof-truss set on accepted existing bearing structures. The output is the complete qualified erection-stage service: the specified trusses positioned and connected, required permanent individual-member restraints and bracing installed, and temporary system stability documented and retained where needed. It is neither one loose factory truss nor complete roof-building performance. CPC 3.0 54522 includes truss framing; this PCR covers a narrower timber-truss route, excluding stick framing and metal trusses (`un-cpc3-2025`). The actual truss design drawings, placement documents, current jobsite package, accepted bearing interfaces and engineer-approved erection, temporary-stability and permanent-bracing plans are mandatory foreground evidence. SBCA's public 2023 article establishes the installation sequence; its numerical prescriptions are not universal design values. The current BCSI landing page identifies the revised 2025 edition; citing that page does not establish access to the full guide. Record the editions and applicability of instructions actually used (`sbca-installation-2023`; `sbca-bcsi-current`; `sbca-jobsite-packages`). Exclude factory manufacture; site cutting, notching or drilling of trusses; unapproved repairs; floor trusses; wall/bearing construction; roof sheathing, diaphragm construction, covering and waterproofing; MEP loading; building use and demolition. Suspect trusses are quarantined for manufacturer/engineer disposition. Authorized structural repair requires a separate reviewed boundary. Pre-sized specified braces and connectors are installed in this route; an independent site-fabrication operation requires boundary review. | `un-cpc3-2025`; `sbca-installation-2023`; `sbca-bcsi-current`; `sbca-jobsite-packages` |\n| `document_and_host_gate` | roof_truss_erection | Before erection, reconcile actual truss design/placement/jobsite documents, approved erection/bracing plans and accepted bearings; resolve conflicts through the responsible designer/manufacturer. Record project-specific applicability rather than importing public article dimensions or tolerances. | `sbca-installation-2023`; `sbca-bcsi-current`; `sbca-jobsite-packages` |\n| `erection_components` | roof_truss_erection | Own finished trusses, additional bearing fasteners/hangers, permanent brace/restraint members and their fixings, temporary-stability service, lifting/access, installation energy, freight, actual auxiliary consumption, packaging and correction losses. Identify which items are already in the supplied kit to avoid counting them twice. | `sbca-installation-2023`; `sbca-bcsi-current`; `sbca-jobsite-packages` |\n| `erection_gate` | erected_roof_truss_set | Handover requires every specified truss positioned, securely connected at its accepted bearings, required permanent individual-member restraints/bracing installed, closed inspection findings and signed responsibility transfer. This is an erection-stage gate; do not claim complete roof load, weather, fire or thermal performance. | `sbca-installation-2023`; `sbca-bcsi-current`; `sbca-jobsite-packages` |\n| `retained_temporary_stability` | temporary_stability_service | Where a later diaphragm is needed, retain required temporary restraint. Index erection, post-handover continuation, later stability confirmation and authorized removal/return; name custody and removal owner at each change. A bounded service must include or explicitly link asset production, installation, maintenance/use, replacement, removal, return transport and end-of-use treatment; it cannot erase these burdens. | `sbca-installation-2023`; `sbca-bcsi-current`; `sbca-jobsite-packages` |\n| `external_repair_boundary` | roof_truss_erection | Placement/connection corrections loop within this node with their full resource burdens. Damaged, unsuitable or altered trusses remain quarantined; return or characterize their waste exit. Cutting/notching/drilling trusses and structural repair are not admitted operations in this PCR. | `sbca-installation-2023`; `sbca-bcsi-current`; `sbca-jobsite-packages` |\n| `resource_and_release_boundary` | roof_truss_erection | For crane, access, temporary bracing and freight, identify full provider coverage and every actual consumer/period, including other work packages. If the provider includes operation fuel/emissions, do not add the same operation again. For directly controlled equipment collect fuel, energy and characterized direct releases separately; no unmeasured zero assumption. |  |\n\n\n"
