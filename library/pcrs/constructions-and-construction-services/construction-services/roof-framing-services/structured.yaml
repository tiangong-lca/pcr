allocation_rules:
  - rule_id: single_accepted_service
    applies_to: "roof_truss_erection"
    rule: "There is one intended accepted erection service. Do not allocate to the existing bearing structure or later roof covering as a co-product. Rejected trusses, waste and returns are not accepted erection output; retain all attributable failed-attempt and replacement burdens."
    source_ids: []
  - rule_id: local_corrections_and_exits
    applies_to: "roof_truss_erection"
    rule: "Local repositioning/refastening repeats within this node. Link each correction to the original event and retain its extra materials, power and equipment. Link quarantine to product return or waste exit with actual receiver/status. Retained stock is reconciled separately; gross inputs, stock and returns must not be netted twice. No default recycling or biogenic-carbon credit is awarded."
    source_ids:
      - sbca-installation-2023
  - rule_id: shared_resource_attribution
    applies_to: "temporary_stability_service; lifting_access_service_crane; lifting_access_service_hoisting; lifting_access_service_access; logistics; installation_energy; actual exchanges required by refine_direct_fuel"
    rule: "Identify asset/service IDs, roof_truss_erection and every other consuming work package or reporting period. Prefer separately metered activity and directly attributable trips; split inseparable common burdens by a documented causal driver suited to the actual resource, retaining the whole consumer denominator, standby/mobilization treatment and sensitivity. Record rejected alternatives and inventory coverage; do not divide by this PCR output alone when other consumers exist."
    source_ids: []
  - rule_id: support_phase_attribution
    applies_to: "temporary_stability_service"
    rule: "Index P1 erection to signed gate, P2 retained support pending the separately owned diaphragm/stability gate, and P3 authorized removal/return/end-of-use. Attach each asset, replacement, maintenance, transport and removal event to its actual phase and consumer. Allocate production and termination burdens once across the documented service cycle; phase shares and receiving dataset responsibilities must reconcile to that whole cycle. Provider ownership does not remove burdens. Missing termination owner or service coverage blocks finalization."
    source_ids:
      - sbca-bcsi-current
  - rule_id: provider_and_direct_operations
    applies_to: "lifting_access_service_crane; lifting_access_service_hoisting; lifting_access_service_access; temporary_stability_service; logistics; installation_energy; actual exchanges required by refine_direct_fuel; actual exchanges required by refine_direct_releases"
    rule: "For each actual provider boundary, choose service-inclusive inventory or underlying disaggregated operation. Explicitly mark which fuel, electricity, asset and release burdens are included and which require separate exchanges. Counting service duration alone is insufficient. Material returns already included inside a service must not appear again as separate return outputs."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_components
      process_id: "roof_truss_erection"
      flow_role: "component receipts, use, replacements and stock"
      record_type: "material ledger"
      raw_fields: "set_id; truss/design_id; supplier_gate; kit_coverage; material/specification; piece_count; net_mass; moisture_basis; receipts; replacement; installed; returned; closing_stock; period; event_id; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Reconcile supplier schedule and delivery tickets to installation count/BOM, calibrated weighing or actual item-specific mass records; keep species/grade/treatment/coating and material types distinct. Attribute receipts/use/stock to this set and correction events before normalizing to accepted complete sets. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "Item(s); kg"
      frequency: "each receipt, issue, correction and stock closure"
      temporal_coverage: "P1 erection plus actual replacement events"
      site_scope: "actual site, package and suppliers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Traceable schedule, weighing/calibration, receipts, stock reconciliation and approved connection/brace documents; no generic density."
    - protocol_id: cp_services
      process_id: "roof_truss_erection"
      flow_role: "temporary stability, lifting and access"
      record_type: "service and asset ledger"
      raw_fields: "set_id; asset/provider_id; approved_plan; component_inventory; coverage; all_consumers; P1/P2/P3; start/end; hours; operating/standby; mobilization; maintenance; replacement; custody; removal_owner; removal/return_event; driver; total_denominator; allocation_share; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Reconcile crane/access logs and approved temporary-bracing records with provider inventory coverage. Record every consumer and phase, actual period-specific causal driver and full denominator, including later roof work. Obtain production/use/removal/transport/end-of-use coverage or explicit linked inventories; unresolved future events remain disclosed obligations and prevent a completed package. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "h; underlying material/energy/service units"
      frequency: "each service period, custody transfer and termination event"
      temporal_coverage: "P1 erection, P2 retention, P3 authorized removal and return"
      site_scope: "actual site plus every shared consumer/provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "Plan acceptance, provider primary inventory, complete consumer denominator and phase ledger; shares sum to the bounded cycle, removals authorized only after documented later stability."
    - protocol_id: cp_logistics
      process_id: "roof_truss_erection"
      flow_role: "component, residual and return freight"
      record_type: "consignment ledger"
      raw_fields: "set_id; transfer_id; material; net_payload; origin/destination; mode; vehicle/provider; distance; empty_return; included_upstream; shared_consumers; period"
      collection_method: "Collect actual weigh/dispatch and route records for each leg. Calculate actual payload-distance activity, attribute inseparable shared legs with complete payload/consumer data, and reconcile provider/upstream coverage before normalizing to accepted sets."
      unit: "t*km"
      frequency: "each physical transport leg"
      temporal_coverage: "P1 and attributable P2/P3 legs"
      site_scope: "actual source-site-receiver routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Payload and route evidence, allocation records, matched transfer IDs and transport coverage without duplicated trips."
    - protocol_id: cp_resources
      process_id: "roof_truss_erection"
      flow_role: "direct electricity and fuel"
      record_type: "meter and fuel ledger"
      raw_fields: "set_id; equipment; provider_coverage; supply/fuel_identity; opening_stock; delivered; closing_stock; meter_start/end; charging; operating_period; all_consumers; allocation_driver; factor/unit; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Use actual electricity meters/charging and consumed fuel stock reconciliation. Distinguish fuel and electricity, include compressor/tools and correction events, and allocate shared operation using measured consumption or documented causal use with complete denominator; record factors for any actual conversion. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kWh; kg; original measured units"
      frequency: "each meter/refuelling period and stock closure"
      temporal_coverage: "P1 and any directly owned P2/P3 operation"
      site_scope: "actual site equipment and supplies"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, receipts, stocks, equipment logs, conversion evidence and confirmation that provider inputs omit these direct operations."
    - protocol_id: cp_residuals
      process_id: "roof_truss_erection"
      flow_role: "packaging, usable returns, rejected trusses, waste and stock"
      record_type: "material disposition ledger"
      raw_fields: "set_id; event_id; transfer_id; material/truss_id; count; net_mass; opening/closing_stock; received; installed; product/waste_status; defect; manufacturer_disposition; receiver; route; capture; phase; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Track incoming packaging and each residual by material and state. Reconcile usable return dispatch to receiving custody; quarantine rejected trusses until written disposition; use waste tickets for discarded material. Keep retained stock and service-internal asset returns separate, with gross supply and stock/return adjustment made once. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg; Item(s)"
      frequency: "each receipt, rejection, return, waste transfer and stock closure"
      temporal_coverage: "P1 with attributable continuation/removal residuals linked to P2/P3"
      site_scope: "actual site, suppliers and named receivers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weighing/counts, matched receiver evidence, status/defect decisions, waste treatment and material closure; no assumed recovery credit."
    - protocol_id: cp_acceptance
      process_id: "roof_truss_erection"
      flow_role: "complete accepted erection-stage set"
      record_type: "documented acceptance record"
      raw_fields: "set_id; truss_ids/count; span/pitch/spacing/layout; bearing_acceptance; design/placement_revision; instruction_edition; approved_lift/temporary/permanent_plans; connection/brace_completion; temporary_support_list; later_stability_dependency; P1/P2/P3; custody/removal_owner; inspection; defect_closure; accepted_complete_set_count"
      collection_method: "Compare actual installed truss IDs, bearing connections and permanent member bracing to approved documents. Inspect and close defects, record retained temporary stability and downstream responsibilities, then obtain signed erection-stage handover; count only complete qualified sets. The reference remains one declared set rather than individual trusses or area."
      unit: "Item(s)"
      frequency: "one complete set at signed gate and each change to retained-support obligations"
      temporal_coverage: "P1 signed gate with explicit P2/P3 responsibility linkage"
      site_scope: "actual declared set at its site"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed designer/installer/receiver documents as applicable, inspection and closure evidence; incomplete or unsafe sets are not accepted."
    - protocol_id: cp_releases
      process_id: "roof_truss_erection"
      flow_role: "direct characterized releases"
      record_type: "measurement or activity-factor record"
      raw_fields: "set_id; equipment/source; provider_coverage; substance; medium; particle_size/basis; activity; factor/source/date; control/capture; measurement; uncertainty; period; allocation; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id"
      collection_method: "For directly controlled actual operation obtain calibrated sampling or a justified source-specific factor applied to measured activity. Record each substance and compartment separately and attributable phase/consumer; distinguish captured waste and provider-included emissions, and document uncertainty or unmeasured gaps. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "each measurement or equipment/activity period"
      temporal_coverage: "actual direct P1 and attributable P2/P3 operation"
      site_scope: "actual site receiving compartment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Measurement QA or actual applicable factor reference with technology/fuel/controls and uncertainty; generic pollutant names cannot select concrete identities."
  calculation_rules:
    - id: normalize_complete_set
      applies_to: "all inventory rows"
      rule: "Aggregate actual attributable material, resource, residual and service quantities for the declared complete package; where one measured campaign covers several accepted sets, retain each configuration and allocate with its actual records before expressing quantities per reference flow. Do not divide individual truss counts into a new reference product."
      inputs:
        - "actual records"
        - "accepted complete set ledger"
        - "allocation evidence"
      output: "per reference flow inventory quantities"
      source_ids: []
    - id: component_closure
      applies_to: "roof_trusses; permanent_bracing_restraint; permanent_bracing_bracing; permanent_bracing_reinforcement; bearing_connectors_hanger; bearing_connectors_bearing_connection; transport_packaging_wrapping; transport_packaging_strap; transport_packaging_dunnage; reusable_returns_timber_bracing; reusable_returns_hanger; rejected_truss_returns; erection_waste_truss; erection_waste_timber_bracing"
      rule: "Reconcile opening stock plus receipts to installed/consumed quantities, genuine product returns, characterized waste and closing stock by actual material or truss ID. Record unresolved balance gaps and correction supply explicitly; do not use an output service count as a material mass."
      inputs:
        - cp_components
        - cp_residuals
      output: "material-specific count/mass reconciliation"
      source_ids: []
    - id: shared_cycle_closure
      applies_to: "temporary_stability_service; lifting_access_service_crane; lifting_access_service_hoisting; lifting_access_service_access; logistics; installation_energy; actual exchanges required by refine_direct_fuel"
      rule: "For each event/resource, apply its evidenced allocation share to the full covered inventory, not just billed hours. Reconcile all consumer and P1/P2/P3 shares to the complete resource/service boundary, then retain each accepted set attribution once."
      inputs:
        - cp_services
        - cp_logistics
        - cp_resources
        - "all-consumer and phase ledger"
      output: "complete allocated underlying burden with service activity"
      source_ids: []
    - id: release_calculation
      applies_to: "actual exchanges required by refine_direct_releases"
      rule: "Use measured released mass or actual measured activity with a source-specific documented factor, retaining unit conversion, capture assumptions and uncertainty. List the actual external factor reference in the constructed dataset; do not invent a factor in this PCR."
      inputs:
        - cp_releases
        - "actual activity/factor or measurements"
      output: "substance- and compartment-specific released mass"
      source_ids: []
  data_quality_requirements:
    - id: actual_design_and_gate
      applies_to: "reference product"
      requirement: "Preserve actual set identity, design/placement revisions, accepted host interfaces, document applicability and signed gate. No unresolved defect may be hidden in accepted output."
      evidence: "cp_acceptance; actual project/manufacturer/engineer records"
    - id: supply_and_quantity_quality
      applies_to: "all component and residual cards"
      requirement: "Retain material identity and state, actual gross/stock/return amounts, net mass/count evidence, moisture basis and uncertainty. Candidate numerical ranges require independently reviewed comparable evidence; a batch maximum cannot validate itself."
      evidence: "cp_components; cp_residuals"
    - id: phase_and_service_completeness
      applies_to: "temporary_stability_service; lifting_access_service_crane; lifting_access_service_hoisting; lifting_access_service_access"
      requirement: "Declare P1/P2/P3 dates/owners and full service coverage; reconcile capital materials, maintenance/use, replacements and termination once across all consumers. Unconfirmed later removal is a gap rather than zero."
      evidence: "cp_services; provider inventory; responsibility transfer"
    - id: resource_release_quality
      applies_to: "installation_energy; actual exchanges required by refine_direct_fuel; actual exchanges required by refine_direct_releases; logistics"
      requirement: "Use actual supply, fuel, technology/mode and receiving media; retain meter/stock/distance evidence and applicable factors. Disclose unmeasured resources/releases and provider exclusions."
      evidence: "cp_resources; cp_releases; cp_logistics"
    - id: identity_and_range_gaps
      applies_to: "all cards"
      requirement: "Resolve each concrete exchange identity, support property/unit and actual-evidence Range needs before final TIDAS publication. A conditional umbrella becomes zero, one or several exchanges from foreground evidence; absence of evidence is not zero."
      evidence: "actual lookup/support verification and foreground collection package"
    - id: refine_permanent_bracing
      applies_to: "permanent_bracing_restraint; permanent_bracing_bracing; permanent_bracing_reinforcement"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Include the actual members and reinforcements installed at this erection gate. Separate components supplied in the truss kit from additional purchases; no site transformation of trusses is permitted. Range evidence need: Actual engineer-approved brace schedule, pieces and measured/supplier masses are needed; no generic brace spacing, timber density, loss fraction or force capacity is supplied. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual different design/grade/SKU members require own records; a physical member serving several roles is counted once, kit-included members not bought again, no site transformation of trusses."
      evidence: "cp_components; actual independent records and identity/unit evidence"
    - id: refine_bearing_connectors
      applies_to: "bearing_connectors_hanger; bearing_connectors_bearing_connection"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record actual hangers, bearing connections, brace fixings and fasteners not already included in the factory product or other service input. Split material and corrosion-protection identities using actual purchase and installation records. Range evidence need: Obtain actual approved connection schedule and item-specific mass evidence; no standard nail count, anchor capacity or generic steel substitution is valid. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual brace-fixing and other fastener functions/SKUs/material/corrosion-protection identities need separate records; factory product/provider included components not duplicated."
      evidence: "cp_components; actual independent records and identity/unit evidence"
    - id: refine_lifting_access_service
      applies_to: "lifting_access_service_crane; lifting_access_service_hoisting; lifting_access_service_access"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Identify actual crane/rigging, hoisting and access systems serving the erection. For each provider disclose included mobilization, equipment production/maintenance, operation and demobilization; separate direct-operation inputs only when absent from that service. Range evidence need: Obtain actual lift plan and equipment/service logs, provider coverage and whole-period consumer denominator; no fuel-per-lift or capacity/time defaults are specified. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual separate rigging provision/functions and different native references require concrete unit/scope; a complete crane service including rigging/hoisting is one provider boundary, not duplicate internal activities. Mobilization, capital/maintenance, operation and demobilization ownership all retained."
      evidence: "cp_services; actual independent records and identity/unit evidence"
    - id: refine_direct_fuel
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella for actual combustion fuel identities crossing the site boundary. Use this card only for operation not already included in crane/access/logistics services; keep fuel types and supply forms separate. Range evidence need: Obtain actual equipment, fuel specification, consumed quantities and provider exclusions; fuel identity, density and consumption cannot be inferred from lifting requirements. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Each actual carrier/grade/native unit and equipment/event outside provider-inclusive crane/access/freight coverage; upstream nonreturned unburned loss remains supplied fuel burden, combustion activity independent."
      evidence: "cp_resources; actual independent records and identity/unit evidence"
    - id: refine_ancillary_materials
      applies_to: "ancillary_materials_lubricant"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella for genuinely consumed supplementary materials such as equipment lubricants when attributable and absent from provider inputs. No coating, adhesive, truss repair chemical or water-consuming route is presumed. Range evidence need: Actual purchase/use/stock records and material identity are needed; a zero, one or multiple exchange outcome depends on the job and cannot use a generic chemical factor. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual supplementary consumable functions/SKUs require actual identity/quantity; no presumed coating/adhesive/truss-repair chemical/water-consuming route, no provider duplicate."
      evidence: "cp_components; actual independent records and identity/unit evidence"
    - id: refine_transport_packaging
      applies_to: "transport_packaging_wrapping; transport_packaging_strap; transport_packaging_dunnage"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Identify actual wrapping, straps, dunnage and reusable packaging at the declared supply gate. Activate a separate burden-bearing input only for separately supplied packaging or the portion not covered by the upstream product dataset. Supplier-included packaging still requires physical custody/exit records, without a second upstream material-production burden. Reusable temporary-bracing assets remain in their service. Range evidence need: Obtain supplier packaging declarations and site counts/weighing with actual custody; no universal packaging intensity or return rate is established. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual reusable containers/other packaging and different material/ownership references require exact custody/life records; upstream-embedded manufacture physical ledger only, reusable temporary-bracing assets stay service."
      evidence: "cp_residuals; actual independent records and identity/unit evidence"
    - id: refine_reusable_returns
      applies_to: "reusable_returns_timber_bracing; reusable_returns_hanger"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional product-output umbrella for genuine unused connectors/braces and reusable packaging leaving to a named supplier or store. Record separate materials and destinations; retained site stock is a ledger state rather than an invented exit. Do not place rejected trusses here. Range evidence need: Obtain actual return acceptance, custody and mass records; no default reusable fraction or avoided-production credit is assumed. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual other connectors/restraints/reinforcements/packaging require original SKU/state/native unit/recipient, stock not outward and rejected truss separate Count product/waste state."
      evidence: "cp_residuals; actual independent records and identity/unit evidence"
    - id: refine_erection_waste
      applies_to: "erection_waste_truss; erection_waste_timber_bracing"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional waste-output umbrella for actual discarded connectors, braces, damaged trusses and packaging; segregate by material, hazardous status and receiving treatment. Retain failed-attempt and correction burdens. This route does not assume truss-cutting sawdust. Range evidence need: Obtain actual waste tickets, segregation and treatment evidence; no generic installation loss or recycling yield is imposed. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual discarded connectors, other members/packaging and material/hazard/receiver distinctions need independent identities; no presumed truss-cutting sawdust, failed/corrective work burdens retained."
      evidence: "cp_residuals; actual independent records and identity/unit evidence"
    - id: refine_direct_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional elementary-output umbrella for actual directly operated equipment combustion species and measured installation particles or other releases. Establish substance, receiving medium and particle class/basis before selecting each concrete flow; provider-included releases are not repeated. Range evidence need: Obtain actual equipment/fuel/emission-factor or sampling evidence and receiving medium; no generic VOC, particulate or exhaust quantity is fabricated. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_releases; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator retains original configuration strata, accepted state/gate and actual causal attribution; no unlike jobs/branches/routes treated as equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
