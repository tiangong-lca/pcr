allocation_rules:
  - rule_id: accepted_campaign
    applies_to: "crack_treatment"
    rule: "Directly assign finite campaign and batch inputs, outputs, setup/changeover, purge/cleaning and all failed injection/cure/test/rework to the accepted unique crack path L. Reject unresolved or zero-L jobs as incomplete, not zero-burden service. Branches/repeat passes never multiply output. Shared campaign events have one owner; use measured causal time/activity for different jobs with documented reconciliation, never resin value as default allocation."
    source_ids: []
  - rule_id: return_and_stock_burden
    applies_to: "resin_a; hardener_b; atomic_seal_paste; injection_ports; cleaner; water; consumables_abrasive; consumables_wipe; consumables_filter; consumables_masking; consumables_absorbent; consumables_containment; consumables_repair; atomic_consumables; fuel; product_returns_resin_a; product_returns_hardener_b; product_returns_seal; product_returns_cleaner; product_returns_fuel; atomic_product_returns; port_returns"
    rule: "Track separate physical and upstream-burden ledgers by lot/state/period: opening stock retains its carried burden, new gross receipts introduce matching burden, outward returns transfer declared actual burden, and retained closing stock carries burden forward without outward exchange. Job-assigned burden plus outgoing transfer burden plus closing burden must reconcile opening plus new burden. Internal issue is not an additional purchased receipt. No automatic return/recycling/avoided-production credit."
    source_ids: []
  - rule_id: shared_asset_life
    applies_to: "equipment_share_pump; equipment_share_mixer; equipment_share_compressor; equipment_share_access; equipment_share_protection; equipment_share_ventilation; atomic_equipment_share"
    rule: "For each asset enumerate all jobs, nodes and periods, including this node; use measured compatible service driver to assign one complete-life burden share. Completed lives use observed service and retirement; in-service lives combine observed history and justified prospective remaining service/replacements/termination/EOL, labelled and sourced with uncertainty, sensitivity and updates. Missing scope/denominator blocks finalisation. Do not duplicate direct operating fuel, separately counted spare/consumable/tool coverage or another asset/rental dataset."
    source_ids: []
  - rule_id: period_and_reject
    applies_to: "crack_treatment"
    rule: "Link preparation, batches, injection, cure/protection, verification and defect closure to actual periods and the same job. Unused returned products retain identity/custody; failed or discarded materials take actual product-return, rework or waste paths. No rejected material or incomplete repair contributes accepted length. Common equipment and stock crossing periods carry one linked burden balance, not repeated charges."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "crack_treatment"
      flow_role: "accepted crack and qualification"
      record_type: "survey; owner acceptance"
      raw_fields: "job_id; period_id; tunnel_use; lining_state; structural_role; cause_movement_assessment; segment_id; branch_id; start_end_coordinates_m; unique_segment_length_m; crack_width_mm; crack_depth_mm; geometry_uncertainty_mm; moisture_state; standing_water_observation; hydrostatic_pressure_state; approved_method_revision; current_regional_PDS_revision; current_label_revision; current_SDS_revision; product_suitability_approval; seal_cure_record; batch_id; injection_pressure_value; injection_pressure_unit; injection_pressure_tolerance; injection_volume_value; injection_volume_unit; injection_duration_value; injection_duration_unit; substrate_temperature_C; ambient_temperature_C; cure_start_end_UTC; cure_duration_h; cure_condition_records; verification_method; verification_result_value; verification_result_unit; acceptance_threshold_value; acceptance_threshold_unit; acceptance_tolerance; owner_criteria_source; defect_id; defect_closure; acceptance_signatory; accepted_date; accepted_length_L_m"
      collection_method: "Survey crack map and dimensions before work and accepted segments after required verification. Record actual clean/sound/ported/cured-seal prestate, dosing/injection records and product-specific cure conditions; trace owner thresholds/tolerances with units to dated sources. Sum union of accepted unique segments L; exclude unaccepted portions/repeats and retain their burdens."
      unit: "m; mm; actual pressure/volume/time units; C; h"
      frequency: "Each segment, batch and acceptance"
      temporal_coverage: "Qualification to signed acceptance, including failed/repeated work"
      site_scope: "Same bounded retained lining and job"
      aggregation_rule: "per reference flow"
      quality_evidence: "Approved map, calibration/uncertainty, dated method/product/owner criteria, signed acceptance and closed defects"
    - protocol_id: cp_material
      process_id: "crack_treatment"
      flow_role: "supplied materials and outward product returns"
      record_type: "lot mass/custody ledger"
      raw_fields: "job_id; period_id; batch_id; lot_id; concrete_identity; supplied_state; supplier_boundary; receipt_gross_kg; receipt_container_tare_kg; receipt_net_kg; opening_stock_kg; opening_stock_count_items; new_receipt_kg; new_receipt_count_items; internal_issue_kg; internal_issue_count_items; dose_A_volume_value; dose_A_volume_unit; dose_B_volume_value; dose_B_volume_unit; volume_value; volume_unit; density_value; density_unit; density_temperature_C; density_state; density_source_revision; count_items; unit_mass_kg_per_item; used_kg; actual_dosed_kg; outward_return_kg; outward_return_count_items; return_custody_receipt; closing_stock_kg; closing_stock_count_items; installed_retained_kg; installed_retained_count_items; captured_waste_kg; captured_waste_count_items; port_disposition_event_id; port_disposition_record; uncontained_release_kg; reaction_mass_terms_kg; opening_burden_record; new_burden_record; return_burden_transfer; closing_burden_carry_forward; included_packaging_services; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Weigh gross and tare before netting any return, or use traceable supplier net contents with receipt checks. Keep separate identity/state lot ledgers and actual component volume doses; collect density/temperature/state/units for every volume conversion and unit mass for count conversion. Reconcile opening stock and new receipts without counting an opening-stock internal issue as a second input. Actual dose/used quantity is intermediate activity, not an additive final destination; installed/retained quantities exclude all separately recorded return, waste and release outlets. Reconcile mass-based material returns in kg and expendable-port returns in Item(s) with actual matching gross inputs and outward custody; keep closing stock/burden separate. Record discarded expendable-port Item(s) from actual event/disposition evidence, never infer discarded count from contaminated mixed-waste kg; keep the waste mass separately measured or supported by matching actual per-port mass. Material destination terms require records, not assumed losses. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity aliases this record independent physical quantity keyed by atomic_flow_row_id under the original CP method and atomic_child_normalization, never another parent quantity. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      unit: "kg; Item(s); actual volume and density units; C"
      frequency: "Each receipt, issue, batch, return and closing stock"
      temporal_coverage: "All job periods with opening/closing balances"
      site_scope: "Each actual material/lot and supplier gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scales, supplier actual labels/SDS/density evidence, custody receipts and physical/upstream-burden reconciliation"
