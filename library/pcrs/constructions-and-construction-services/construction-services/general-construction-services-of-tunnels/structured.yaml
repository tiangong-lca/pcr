    - id: atomic_range_noninheritance
      applies_to: "consumables_abrasive; consumables_wipe; consumables_filter; consumables_masking; consumables_absorbent; consumables_containment; consumables_repair; equipment_share_pump; equipment_share_mixer; equipment_share_compressor; equipment_share_access; equipment_share_protection; equipment_share_ventilation; product_returns_resin_a; product_returns_hardener_b; product_returns_seal; product_returns_cleaner; product_returns_fuel; concrete_debris_clean; concrete_debris_contaminated; epoxy_waste_resin_a; epoxy_waste_hardener_b; epoxy_waste_mixed_uncured; epoxy_waste_mixed_cured; epoxy_waste_seal; epoxy_waste_purge; epoxy_waste_wipe; epoxy_waste_filter; packaging_waste_container; packaging_waste_packaging; packaging_waste_port"
      requirement: "Retired parent numerical ranges, per-exchange screening instructions and rationales are retained only in implementation audit, applying to neither new child exchanges nor parent-family sums and never proportionally allocated. Each new child has independent evidence needs for actual quantity, identity/state, measurement/conversion, uncertainty and comparable independent observations. Add its own interval only after review confirms applicability to this independent object; never validate a batch with its own maximum. Original ranges of unchanged semantically compatible atomic objects retain their original status."
      evidence: "independent_child_measurement; independent_range_evidence; implementation_range_audit"
    - id: atomic_paired_quantity_provenance
      applies_to: "actual internal child source and recipient transfers"
      requirement: "Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      evidence: "source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
validation_rules:
  - rule_id: validate_scope
    applies_to: "crack_treatment"
    rule: "Reject scope crossing to new/major replacement, moving/hydrostatic-pressure cracks, PU waterstop or water/mining tunnels; retained host receives no new lining burden or avoided replacement credit."
    source_ids:
      - un-cpc3-2025
      - sika-sikadur52-us-2014
  - rule_id: validate_gate
    applies_to: "accepted_crack_repair"
    rule: "Require recorded qualified prestate, actual compatible regional materials/method, surface seal cure before injection, complete actual injection/cure records and owner-sourced verification criteria/results/tolerances with units, defect closure and signed acceptance. Lab strength or elapsed time alone is not acceptance."
    source_ids:
      - sika-sikadur52-us-2014
  - rule_id: validate_length
    applies_to: "accepted_crack_repair"
    rule: "Recompute union of accepted unique paths and L; count each branch once, never tunnel length, ports/faces/passes or unresolved rejects. Confirm every exchange uses same positive accepted-L denominator with all failed/setup/purge work retained once."
    source_ids: []
  - rule_id: validate_custody
    applies_to: "all inventory rows"
    rule: "Audit gross net-of-tare receipts before returns, internal movements, outward custody, retained closing stock and burden carry-forward. Verify actual whole-fluid fuel outlets and burn calculation without incident double subtraction; capture/waste/elementary releases remain distinct."
    source_ids: []
  - rule_id: validate_assets
    applies_to: "equipment_share_pump; equipment_share_mixer; equipment_share_compressor; equipment_share_access; equipment_share_protection; equipment_share_ventilation; atomic_equipment_share"
    rule: "Verify every shared asset consumer/period, complete-life scope and compatible measured service driver; observed history plus justified future scenario for in-service assets includes replacement/termination/EOL and uncertainty/sensitivity/updates. Missing coverage or denominator blocks finalisation; remove overlapping direct fuel/spare/tool/rental coverage."
    source_ids: []
  - rule_id: validate_identity_and_emissions
    applies_to: "all inventory rows"
    rule: "Verify concrete identities/properties/units before final dataset exchange binding; do not substitute near-match resin manufacture/new tunnel/PU for repair service. Check actual species/medium and capture/retention/reaction, fluid partition and weather/host moisture; 100% solids never proves zero release. Record missing ranges, UUIDs and material evidence explicitly."
    source_ids: []
  - rule_id: validate_campaign
    applies_to: "crack_treatment"
    rule: "Trace all batches and preparation/injection/cure/verification periods, setup/changeover and rejects to this node and actual rework/waste/product-return destinations. Reject unresolved failures as accepted output; shared-job causal attribution reconciles once across periods."
    source_ids: []
