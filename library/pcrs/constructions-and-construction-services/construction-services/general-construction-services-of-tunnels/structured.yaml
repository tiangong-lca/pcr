  normalization: "utf8-lf-v1"
  source_sha256: "sha256:40627d8a406376eabf9a0ca95ffe5eb9eee053b608539276f32bee3f47e4cded"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6386"
      family: "system_boundary"
      span:
        start:
          offset: 6386
