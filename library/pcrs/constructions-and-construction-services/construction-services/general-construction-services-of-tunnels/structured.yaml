      collection_method: "Identify substance and medium before elementary exchange; use actual measurements or compatible documented species-specific activity/factor and control conditions. For elementary exchanges use actual measured released constituent kg or whole-fluid kg times evidenced constituent mass fraction and medium-specific fate fraction, retaining fraction basis/source and uncertainty. Whole formulation is not an elementary exchange. Give each substance/medium/event one owner, exclude fluid_release incident constituents from direct_species, and prevent whole-fluid/partial-species double counting. Separate supplied water, dry solids, retained-host moisture and evidenced weather terms; investigate unknown residual rather than assign emission. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity aliases this record independent physical quantity keyed by atomic_flow_row_id under the original CP method and atomic_child_normalization, never another parent quantity. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only. Physical incident ledger only: incident_total_kg is the measured affected whole-fluid mass before recovery, capture, retention and environmental release, excluding ordinary intended application outside this incident. uncontained_wholefluid_kg = incident_total_kg + reaction_terms_kg - recovered_product_kg - captured_waste_kg - retained_kg. All final pools use the same incident, cutoff, material basis and net-mass unit and are mutually exclusive. retained_kg is independently measured material remaining inside the technosphere outside recovered product and captured waste, including attached residue; retained storage must not be counted again in either outlet