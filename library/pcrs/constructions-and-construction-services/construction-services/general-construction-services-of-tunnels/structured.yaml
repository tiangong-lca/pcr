    - id: atomic_child_normalization
      applies_to: "consumables_abrasive; consumables_wipe; consumables_filter; consumables_masking; consumables_absorbent; consumables_containment; consumables_repair; equipment_share_pump; equipment_share_mixer; equipment_share_compressor; equipment_share_access; equipment_share_protection; equipment_share_ventilation; product_returns_resin_a; product_returns_hardener_b; product_returns_seal; product_returns_cleaner; product_returns_fuel; concrete_debris_clean; concrete_debris_contaminated; epoxy_waste_resin_a; epoxy_waste_hardener_b; epoxy_waste_mixed_uncured; epoxy_waste_mixed_cured; epoxy_waste_seal; epoxy_waste_purge; epoxy_waste_wipe; epoxy_waste_filter; packaging_waste_container; packaging_waste_packaging; packaging_waste_port"
