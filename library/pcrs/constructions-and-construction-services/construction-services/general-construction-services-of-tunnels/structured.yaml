      requirement: "Legacy roles are non-exchange stock, activity, fate or closure keys in the original CP. Independent child exchanges carry quantities; atomic_ requirements retain mandatory remaining-roster refinement and finalization blocks. Original raw fields, helpers and native-unit operands retain their responsibilities and reconcile by child identity and compatible unit, never adding parent totals or unlike units. Source-table Applies-to migration: seal_paste => atomic_seal_paste; consumables => consumables_abrasive, consumables_wipe, consumables_filter, consumables_masking, consumables_absorbent, consumables_containment, consumables_repair, atomic_consumables; equipment_share => equipment_share_pump, equipment_share_mixer, equipment_share_compressor, equipment_share_access, equipment_share_protection, equipment_share_ventilation, atomic_equipment_share; product_returns => product_returns_resin_a, product_returns_hardener_b, product_returns_seal, product_returns_cleaner, product_returns_fuel, atomic_product_returns; concrete_debris => concrete_debris_clean, concrete_debris_contaminated, atomic_concrete_debris; epoxy_waste => epoxy_waste_resin_a, epoxy_waste_hardener_b, epoxy_waste_mixed_uncured, epoxy_waste_mixed_cured, epoxy_waste_seal, epoxy_waste_purge, epoxy_waste_wipe, epoxy_waste_filter, atomic_epoxy_waste; packaging_waste => packaging_waste_container, packaging_waste_packaging, packaging_waste_port, atomic_packaging_waste; direct_species => atomic_direct_species; fluid_release => atomic_fluid_release"
      evidence: "original_protocols; actual_child_register; parent_ledger_id"
    - id: atomic_child_routing
      applies_to: "crack_treatment"
      requirement: "The following routes each child to its original role, node, unique unit and method CP. Independently apply that original role measurement, stock, source/fate, rework, share, conversion and normalization method to each actual identity/state child. Retain the original helper/selector role parameter as legacy_parent_role, but supply quantity operands from this child independent records; ROW_UNIT(child_row_id) is the explicit unit below. Reconcile stocks/transfers only within the same identity/state and compatible native unit, grouping different materials, media, states and units separately. Parent totals are non-exchange diagnostics, never copied as child operands or summed across unlike units. Unsupported original-helper applicability or missing actual conversion, denominator or evidence blocks finalization; field records cannot choose a new method. Original role-named formula operands remain ledger names rather than duplicate exchanges. A cross-unit legacy role executes by this mapping and actual child unit instead of inheriting a wrong fixed unit. Routing: consumables_abrasive => role=consumables, node=crack_treatment, property=Mass, unit=kg, CP=cp_material; consumables_wipe => role=consumables, node=crack_treatment, property=Mass, unit=kg, CP=cp_material; consumables_filter => role=consumables, node=crack_treatment, property=Mass, unit=kg, CP=cp_material; consumables_masking => role=consumables, node=crack_treatment, property=Mass, unit=kg, CP=cp_material; consumables_absorbent => role=consumables, node=crack_treatment, property=Mass, unit=kg, CP=cp_material; consumables_containment => role=consumables, node=crack_treatment, property=Mass, unit=kg, CP=cp_material; consumables_repair => role=consumables, node=crack_treatment, property=Mass, unit=kg, CP=cp_material; equipment_share_pump => role=equipment_share, node=crack_treatment, property=Number of items, unit=Item(s), CP=cp_assets; equipment_share_mixer => role=equipment_share, node=crack_treatment, property=Number of items, unit=Item(s), CP=cp_assets; equipment_share_compressor => role=equipment_share, node=crack_treatment, property=Number of items, unit=Item(s), CP=cp_assets; equipment_share_access => role=equipment_share, node=crack_treatment, property=Number of items, unit=Item(s), CP=cp_assets; equipment_share_protection => role=equipment_share, node=crack_treatment, property=Number of items, unit=Item(s), CP=cp_assets; equipment_share_ventilation => role=equipment_share, node=crack_treatment, property=Number of items, unit=Item(s), CP=cp_assets; product_returns_resin_a => role=product_returns, node=crack_treatment, property=Mass, unit=kg, CP=cp_material; product_returns_hardener_b => role=product_returns, node=crack_treatment, property=Mass, unit=kg, CP=cp_material; product_returns_seal => role=product_returns, node=crack_treatment, property=Mass, unit=kg, CP=cp_material; product_returns_cleaner => role=product_returns, node=crack_treatment, property=Mass, unit=kg, CP=cp_material; product_returns_fuel => role=product_returns, node=crack_treatment, property=Mass, unit=kg, CP=cp_material; concrete_debris_clean => role=concrete_debris, node=crack_treatment, property=Mass, unit=kg, CP=cp_waste; concrete_debris_contaminated => role=concrete_debris, node=crack_treatment, property=Mass, unit=kg, CP=cp_waste; epoxy_waste_resin_a => role=epoxy_waste, node=crack_treatment, property=Mass, unit=kg, CP=cp_waste; epoxy_waste_hardener_b => role=epoxy_waste, node=crack_treatment, property=Mass, unit=kg, CP=cp_waste; epoxy_waste_mixed_uncured => role=epoxy_waste, node=crack_treatment, property=Mass, unit=kg, CP=cp_waste; epoxy_waste_mixed_cured => role=epoxy_waste, node=crack_treatment, property=Mass, unit=kg, CP=cp_waste; epoxy_waste_seal => role=epoxy_waste, node=crack_treatment, property=Mass, unit=kg, CP=cp_waste; epoxy_waste_purge => role=epoxy_waste, node=crack_treatment, property=Mass, unit=kg, CP=cp_waste; epoxy_waste_wipe => role=epoxy_waste, node=crack_treatment, property=Mass, unit=kg, CP=cp_waste; epoxy_waste_filter => role=epoxy_waste, node=crack_treatment, property=Mass, unit=kg, CP=cp_waste; packaging_waste_container => role=packaging_waste, node=crack_treatment, property=Mass, unit=kg, CP=cp_waste; packaging_waste_packaging => role=packaging_waste, node=crack_treatment, property=Mass, unit=kg, CP=cp_waste; packaging_waste_port => role=packaging_waste, node=crack_treatment, property=Mass, unit=kg, CP=cp_waste"
