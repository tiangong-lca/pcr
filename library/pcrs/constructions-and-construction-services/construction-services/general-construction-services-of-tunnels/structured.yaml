product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.general-construction-services-of-tunnels"
  classification_refs: "CPC 3.0 54222; narrower semantic subset; proposed mapping requires separate acceptance"
  covered_products: "Accepted dormant concrete-lining crack epoxy injection repair service in an existing transport tunnel"
  excluded_products: "New asset/lining; mining/water tunnels; active or hydrostatic-pressure cracks; PU leak stopping; major strengthening/replacement"
  representative_product: "An owner-accepted unique treated crack path with recorded branch geometry in retained transport tunnel lining"
  production_route: "Finite repair campaign: qualification and preparation; ports and cured surface seal; actual A/B dosing and mixing; pressure injection; cleanup and required cure; verification and closed defects"
  market_state: "Bounded completed repair service at signed owner acceptance; no future maintenance or tunnel operation included"
functional_unit:
  what: "Accepted epoxy injection repair service of a dormant crack in existing transport tunnel concrete lining"
  how_much: "1 m of accepted unique treated crack path; total accepted path length L measured in m"
  how_well: "Engineer-approved dormant crack, sound retained lining, no standing water/hydrostatic-pressure application; actual compatible materials and qualified prestate; actual fill, cure and owner-required verification passed; defects closed and acceptance signed"
  how_long_or_cycle: "One bounded repair campaign from qualification/access through acceptance; record preparation, injection, cure and acceptance periods, with shared assets spanning their complete lives; no assumed subsequent service life"
  reference_flow_link: "accepted_crack_repair"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers pressure injection of an engineer-qualified dormant crack in the retained concrete lining of an existing road or rail transport tunnel using an actual compatible low-viscosity two-component epoxy. It includes job-specific access/protection, cause and movement assessment, cleaning/preparation, surface seal and ports, dosing/mixing, injection, purge/cleanup, required cure, inspection, defect closure and signed repair acceptance. The retained lining remains in place. Exclude new tunnels or linings, mining/water tunnels, active moving cracks, injection under hydrostatic pressure or with standing water, elastic polyurethane waterstop grouting, major concrete replacement, structural strengthening, tunnel traffic operation and later repair. The dormant-crack subset is a PCR boundary requiring engineer approval, not a claim that the example PDS proves every moving crack impossible. Neither resin laboratory strength nor acceptance of this bounded job guarantees restored structural capacity, watertightness or remaining tunnel life. The US Sikadur52 PDS read here is Edition 9.23.2014, currently linked by the US product page. It supplies route evidence, not universal contemporary settings. Actual current regional product/label/SDS, approved method and owner requirements govern the concrete job; retain their revision dates and suitability approval. No universal injection pressure, port spacing, component density, mass ratio, kg/m or cure duration is prescribed. [Sources: un-cpc3-2025; sika-sikadur52-us-2014.]"
      source_ids:
        - un-cpc3-2025
        - sika-sikadur52-us-2014
    - rule_id: host_and_route
      applies_to: "crack_treatment"
      rule: "Own actual incremental preparation/removal, minor job-caused repair and protection through signed acceptance. Keep retained lining outside new concrete production; no avoided replacement credit. Material treatment, seal, mixing, cure and inspection form one integrated job unless an actual independent physical handoff is evidenced."
      source_ids:
        - un-cpc3-2025
        - sika-sikadur52-us-2014
    - rule_id: qualification
      applies_to: "crack_treatment"
      rule: "Require sound clean compatible substrate and engineer-approved dormant crack; document contaminants and removal, dry/damp state without standing water, no hydrostatic-pressure injection, approved ports/surface seal and verified seal cure before injection. Actual regional instructions and owner approval govern suitability and application limits."
      source_ids:
        - sika-sikadur52-us-2014
    - rule_id: job_completeness
      applies_to: "crack_treatment"
      rule: "Include access, protection, ventilation, compressor/purchased air, dosing/mixing, injection, purge, cleaning, cure protection and testing. Enumerate campaign and mix batches, setup/changeover, rework and all periods until acceptance; unaccepted work retains burdens."
      source_ids:
        - sika-sikadur52-us-2014
    - rule_id: custody_boundary
      applies_to: "crack_treatment"
      rule: "Record gross net-of-tare receipts/issues before actual outward product returns; retained closing stock is no outward product exchange. Reconcile opening stock burden, purchases, internal issues, use, returns and closing carried-forward burden. Separate product returns, wastes and direct releases; supplier-included packaging/service cannot be charged twice."
      source_ids: []
    - rule_id: asset_boundary
      applies_to: "equipment_share_pump; equipment_share_mixer; equipment_share_compressor; equipment_share_access; equipment_share_protection; equipment_share_ventilation; atomic_equipment_share"
      rule: "Include complete-life manufacture, maintenance, replacements and end-of-life burdens of actual injection/mixing/access/ventilation/compression/protection assets. Enumerate all nodes/jobs/period consumers; exclude separately inventoried fuel, consumables/spares and tools from duplicated asset coverage."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Existing sound retained concrete tunnel lining and engineer-qualified dormant crack with documented cause/movement, dimensions, access and moisture/pressure state; preparation is included, not assumed completed"
  starting_condition_role: "Retained host condition; no new lining exchange or replacement credit"
  product_classification_scope: "Bounded transport tunnel repair service; water/mining tunnel works excluded"
  recursive_input_rule: "If a subcontract supplies the same-category repair, record its actual bounded accepted service and declared boundary; use its upstream dataset without recursively recreating identical operations or duplicating our materials/utilities"
  upstream_dataset_requirement: "Actual supplied component/consumable, utility, transport, asset and waste-treatment datasets require matching product/state/geography/period and declared included packaging/service boundary"
  disclosure: "Declare retained host, all preparation and test work, campaign/batch/period boundary, actual supplier gates, custody, transport legs, shared assets, rejects and any omitted/unmeasured exchanges with consequences"
