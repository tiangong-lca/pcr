  calculation_rules:
    - id: accepted_union
      applies_to: "accepted_crack_repair"
      rule: "L = length of union of accepted unique crack segments in m; normalized reference output amount = 1 m; exclude rejected/incomplete segments and repeat passes."
      inputs:
        - cp_acceptance
        - "accepted segment map"
      output: "L m and 1 m reference service"
      source_ids: []
    - id: job_intensity
      applies_to: "resin_a; hardener_b; atomic_seal_paste; injection_ports; cleaner; water; consumables_abrasive; consumables_wipe; consumables_filter; consumables_masking; consumables_absorbent; consumables_containment; consumables_repair; atomic_consumables; electricity; fuel; purchased_air; product_returns_resin_a; product_returns_hardener_b; product_returns_seal; product_returns_cleaner; product_returns_fuel; atomic_product_returns; port_returns; concrete_debris_clean; concrete_debris_contaminated; atomic_concrete_debris; epoxy_waste_resin_a; epoxy_waste_hardener_b; epoxy_waste_mixed_uncured; epoxy_waste_mixed_cured; epoxy_waste_seal; epoxy_waste_purge; epoxy_waste_wipe; epoxy_waste_filter; atomic_epoxy_waste; wastewater; packaging_waste_container; packaging_waste_packaging; packaging_waste_port; atomic_packaging_waste"
      rule: "For each separately identified exchange, intensity = attributable actual campaign amount / L; L is accepted unique crack path in m. Keep campaign failed/repeated work in numerator; no output if L is zero."
      inputs:
        - cp_acceptance
        - cp_material
        - cp_utilities
        - cp_waste
        - "actual exchange amounts"
      output: "Each actual exchange unit per 1 m accepted crack path"
      source_ids: []
    - id: net_and_volume
      applies_to: "resin_a; hardener_b; atomic_seal_paste; cleaner; water; fuel; wastewater; atomic_fluid_release"
      rule: "Net mass = gross mass - actual container/vehicle tare before outward return deduction. When required, mass kg = actual volume times identity/state/temperature-specific density with evidenced unit conversion; count mass = actual count times measured matching unit mass. Volume dosing ratio is checked in its original units, never assumed to be a mass ratio."
      inputs:
        - cp_material
        - cp_utilities
        - cp_waste
        - cp_emissions
        - "actual density and units"
      output: "Traceable net mass and actual original dosing record"
      source_ids: []
    - id: material_custody
      applies_to: "resin_a; hardener_b; atomic_seal_paste; injection_ports; cleaner; water; consumables_abrasive; consumables_wipe; consumables_filter; consumables_masking; consumables_absorbent; consumables_containment; consumables_repair; atomic_consumables; product_returns_resin_a; product_returns_hardener_b; product_returns_seal; product_returns_cleaner; product_returns_fuel; atomic_product_returns; port_returns"
      rule: "For each lot/state in consistent physical units, opening stock + new gross net-of-tare receipts = installed/retained material + outward unused returns + captured waste + actual uncontained whole-fluid release + retained closing stock + evidenced reaction/other terms, with uncertainty stated. Installed/retained material excludes every separately recorded loss/outlet; actual dosed/used quantity is intermediate activity, never an additive final destination. Opening-stock internal issues are movements, not additional receipts. For expendable ports reconcile the same mutually exclusive destinations in Item(s). Opening burden + new burden = job-assigned burden + outward transferred burden + closing carried-forward burden."
      inputs:
        - cp_material
        - cp_waste
        - cp_emissions
        - "custody and burden ledgers"
      output: "Physical and upstream-burden closure by lot/period"
      source_ids: []
    - id: fuel_activity
      applies_to: "fuel; atomic_direct_species; atomic_fluid_release"
      rule: "Burned fuel kg = opening fuel + gross net-of-tare new fuel - closing fuel - unused outward return - captured fuel waste - uncontained whole-fluid fuel - evidenced other nonburned outlet. Reconcile the incident total under fluid_partition, including independently evidenced retained material and any supported signed reaction term at the same cutoff. Assign each retained fuel fate once to closing fuel or the separately evidenced other nonburned outlet; never subtract it in both. Actual recovered product takes its documented final stock/return fate, not an additional deduction. Total spill is audit-only and is not subtracted again; unknown fate blocks derived burn."
      inputs:
        - cp_utilities
        - cp_waste
        - cp_emissions
      output: "Burned kg and reconciled fluid outlets; intensity divided by L"
      source_ids: []
    - id: freight_activity
      applies_to: "transport"
      rule: "For each leg, transport intensity = actual net cargo kg times actual km times evidenced job share / L. Preserve compatible provider boundary and kg*km reference; conversion from t*km multiplies by 1000 only with confirmed support."
      inputs:
        - cp_transport
        - cp_acceptance
      output: "kg*km per 1 m accepted crack path"
      source_ids: []
    - id: asset_fraction
      applies_to: "equipment_share_pump; equipment_share_mixer; equipment_share_compressor; equipment_share_access; equipment_share_protection; equipment_share_ventilation; atomic_equipment_share"
      rule: "For each asset, intensity Item(s) equivalent = (attributable job service / complete-life all-consumer service) / L; multiply the fraction by matching complete-life manufacture/maintenance/replacement/EOL burden. Service numerator and denominator use the same actual driver unit. Observed and justified future portions and overlaps remain explicit."
      inputs:
        - cp_assets
        - cp_acceptance
        - "complete-life burden scope"
      output: "Asset-specific equivalent fraction and burden per 1 m accepted crack path"
      source_ids: []
    - id: species_release
      applies_to: "atomic_direct_species"
      rule: "For each routine substance/medium/event, intensity kg = actual measured release kg / L, or actual compatible activity times documented substance-specific factor times applicable uncaptured fraction / L. Use burned fuel activity when factor requires combustion; account retention/capture/reaction explicitly without assumed 100% solids zero. Exclude incident constituent exchanges assigned to fluid_release; one owner per substance/medium/event, never a generic mixed-formulation elementary exchange."
