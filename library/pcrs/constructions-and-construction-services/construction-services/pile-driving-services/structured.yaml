measurement_rules:
  - id: accepted_length
    applies_to: "reference_service"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "Measure L independently as the sum of unique accepted axial toe-to-cutoff lengths from the pile register and survey, with batter correction. L must be positive; use cp_pile_install_material. Repeated driving/test events do not add length."
  - id: same_state_bridges
    applies_to: "precast_pile_sections; shoe_joint_components_shoe; shoe_joint_components_splice; pile_cushion_material_pile_cushion; pile_cushion_material_hammer_cushion; head_preparation_consumables_head_repair; diesel_fuel; water_supplied; lubricants_other_operating_products_lubricant; lubricants_other_operating_products_cloth; lubricants_other_operating_products_absorber; actual exchanges required by refine_packaging_received; actual exchanges required by refine_direct_freshwater_abstraction; usable_material_exits_unused_pile_section; actual exchanges required by refine_returnable_packaging_exit; concrete_cutoff_waste_cutoff; concrete_cutoff_waste_loose_fines; separated_reinforcement_waste; damaged_pile_waste; spent_cushion_waste_pile_cushion; spent_cushion_waste_hammer_cushion; actual exchanges required by refine_packaging_waste; oily_consumable_waste_liquid; oily_consumable_waste_cloth; oily_consumable_waste_absorber; collected_wastewater_slurry; fossil_co2_air; actual exchanges required by refine_other_engine_species_air; actual exchanges required by refine_physical_particulate_air; water_vapour_air; actual exchanges required by refine_specific_direct_water_releases"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Retain each native material or substance measurement. Convert count, geometry or volume only with a same-SKU, same-state measured bridge, including solid/void and reinforcement content. Do not use cross-SKU averages or infer unknown species from residual mass."
  - id: utility_service_units
    applies_to: "electricity; hired_equipment_services_lifting; hired_equipment_services_access; hired_equipment_services_hammer; hired_equipment_services_logistics_equipment"
    required_property_ref:
      name: "Energy; Duration"
      uuid: ""
    required_unit: "kWh; h"
    rule: "Record electricity as measured actual electrical energy and equipment service as actual attributable equipment intervals. Use evidenced unit conversions; heating value is not a substitute for Energy, and labour or default shifts are not equipment Duration. Preserve each unresolved support identity explicitly."
