allocation_rules:
  - rule_id: a_direct
    applies_to: "shared operating burden"
    rule: "Assign directly measured pile/phase use first. For shared hammer, crane, meter or test resources, list every consumer and period and attribute only the reconciled residual by documented actual duty or another evidenced causal share; shares must exhaust that residual once. Declare idle/setup/test ownership and period-cutoff treatment."
    source_ids:
      - pile-installation-attribution-method
  - rule_id: a_provider
    applies_to: "provider and reusable assets"
    rule: "Count provider-included fuel, capital and maintenance once; exclude duplicate own diesel/equipment entries for those same included activities. Attribute self-owned manufacture only with actual service capacity/lifetime, episode use and damage evidence, disclosing an unresolved gap otherwise. Reusable equipment mass and its used return do not constitute full consumptive material input/output."
    source_ids:
      - pile-installation-attribution-method
  - rule_id: a_rework
    applies_to: "rework and accepted length"
    rule: "Retain attributable failed driving, restrike, testing, removal and replacement burdens in the installing lot. Record original pile and event links and actual return/downgrade/retained/waste/abandoned fate. Rejected or open piles contribute no L; repeated passes and a production-accepted test pile cannot repeat L. Unresolved replacement/termination remains an open gap at the period cutoff."
    source_ids:
      - pile-installation-attribution-method
  - rule_id: a_exits
    applies_to: "material exits and normalization"
    rule: "Record real usable returns and waste dispatch by identity/state/receiver; do not assume avoided production or recovery credit. Separate any evidenced co-product responsibility by subdivision or documented causal treatment. Divide each concrete attributable numerator by the independently measured L once; heterogeneous totals serve QA only."
    source_ids:
      - pile-installation-attribution-method
dataset_production:
  collection_protocols:
    - protocol_id: cp_pile_install_material
      process_id: "pile_install"
      flow_role: "material components, consumables, stocks, exits and reference"
      record_type: "pile register and identity/event ledger"
      raw_fields: "event/lot/configuration; pile or asset ID; process/phase/time and reporting period; owner and role; actual identity/SKU/current state; native amount/unit; measured same-state bridge; receiver/medium; evidence and uncertainty; actual occurrence yes/no/unresolved; pile prestressing system and section/void geometry; delivery/accepted/rejected state; toe/cutoff survey and batter; section mass; head/separation/capture; stock movement; criteria revision and head/test/acceptance records; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Weigh or use traceable same-section mass certificates and calibrated native measures; survey actual toe and cutoff, correct for axial/batter geometry and reconcile unique accepted piles to inspection/test records. Track opening, receipts, issue, transfers, retained/rejected/abandoned stock and dispatch separately by concrete identity/state/receiver. Aggregation procedure: Determine independent positive accepted L; calculate each concrete attributable material numerator / L per 1 m reference flow; reference_service self-normalizes L / L; heterogeneous totals are QA only. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg; m; native count/geometry; measured bridges"
      frequency: "every receipt, issue, head/rework/separation, stock cutoff and acceptance/exit event"
      temporal_coverage: "full episode and opening/closing stocks across all reporting periods"
      site_scope: "project pile lot and actual material custody boundary"
      aggregation_rule: "per 1 m reference flow"
      quality_evidence: "calibration/certificates; surveys; pile and decision register; signed head/test/acceptance; dispatch receivers"
    - protocol_id: cp_pile_install_utility
      process_id: "pile_install"
      flow_role: "diesel, electricity and supplied water"
      record_type: "fuel/utility meter and stock ledger"
      raw_fields: "event/lot/configuration; pile or asset ID; process/phase/time and reporting period; owner and role; actual identity/SKU/current state; native amount/unit; measured same-state bridge; receiver/medium; evidence and uncertainty; actual occurrence yes/no/unresolved; meter topology and reading interval; density/temperature; utility source/voltage/treatment; equipment duty/idle/test/rework; provider coverage; direct assignment and residual consumer shares"
      collection_method: "Use calibrated readings or stock reconciliations for the full owned intervals. Convert only with actual same-fuel/state evidence; retain water circulation and shared-meter reconciliation. Distinguish useful equipment energy from purchased electricity or diesel and exclude provider-included duplicate consumption. Aggregation procedure: Assign direct use then evidenced reconciled shared residual once; each concrete attributed utility numerator / L per 1 m reference flow."
      unit: "kg; kWh; native volume and meter units"
      frequency: "each meter interval, fueling, stock change and wet task"
      temporal_coverage: "complete owned setup/idle/driving/restrike/test/head/rework/demobilization intervals and period cutoffs"
      site_scope: "all actual equipment and meters serving the project lot, with other consumers identified"
      aggregation_rule: "per 1 m reference flow"
