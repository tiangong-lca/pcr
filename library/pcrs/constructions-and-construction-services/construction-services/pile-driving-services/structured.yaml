published_dataset_profile:
  dataset_role: "Foreground installation data package for the declared pile lot"
  downstream_use: "secondary_dataset; background_dataset; process and lifecyclemodel projections"
  allowed_use: "The evidenced impact-driven precast prestressed mechanical route and declared accepted-length gate with complete ownership and coverage disclosure"
  excluded_use: "Design or structural certification; universal performance comparisons; excluded pile types/driving aids/welding; pile manufacture or pile-cap construction; unresolved final exchanges"
  required_metadata: "Required reference qualifiers; boundary and provider scopes; pile/phase/period event register; concrete flow identities/states/receivers; native records, bridges and independent L; upstream/treatment coverage"
  required_quality_disclosure: "Calibration, uncertainty, occurrence yes/no/unresolved, unresolved identity/support/range/life/fate gaps, rework/failed-stock burdens, pool residuals and performed/skipped validation"
  update_trigger: "Changed pile/section/prestressing or installation route, criteria/gate, equipment/provider coverage, source medium, concrete identity, material fate or improved quantitative/lifetime evidence"
data_sources:
  - id: "fhwa-gec15-2022"
    type: "official_guidance"
    reference: "FHWA-HIF-22-024 (2022), Acceptance Procedures for Deep Foundations, chapter 4, especially §§4.2–4.4, printed pp.4-6–4-9. https://www.fhwa.dot.gov/engineering/geotech/pubs/hif22024.pdf"
    used_for: "Project-specific installation plan, driving criteria, cushions, restrikes/tests, damaged-pile assessment and head inspection; no universal material/fuel rate or adopted example acceptance threshold"
  - id: "fhwa-pile-inspection"
    type: "official_guidance"
    reference: "FHWA, Construction Program Management and Inspection Guide, Appendix D, Driven Piling. https://www.fhwa.dot.gov/construction/cpmi04d2.cfm"
    used_for: "Pile/hammer/cushion/shoe/splice records, handling, actual toe/cutoff and delivered/order/embedded-length distinctions; only relevant driven-pile passages used, without generic consumption priors"
  - id: "fhwa-driven-length-review"
    type: "official_guidance"
    reference: "FHWA, Pile Driving Review, Measurement and Payment. https://www.fhwa.dot.gov/construction/reviews/revpile1.cfm"
    used_for: "Limited to the distinction of accepted driven length below cutoff from ordered length and record reconciliation. Steel-pile/casing, coating, splice, hammer and concrete-placement numeric examples are not transferred to precast prestressed piles"
  - id: "accepted-axial-length-identity"
    type: "method_factor"
    reference: "Author-defined normative method identity: unique accepted axial toe-to-actual-cutoff length, L > 0; L / L = 1 m reference service"
    used_for: "Independent denominator, axial/batter measurement, unique-pile acceptance and self-normalization; this is a declared method, not an external observation"
  - id: "pile-installation-attribution-method"
    type: "method_factor"
    reference: "Author-defined normative method identity: concrete event/identity/phase attribution and one normalization by independent accepted L"
    used_for: "Owned one-node event/period accounting, causal shared residual, provider overlap prevention, actual asset-capacity/use evidence and concrete exchange normalization; not an empirical rate"
  - id: "compatible-pool-balance-identity"
    type: "method_factor"
    reference: "Author-defined normative physical bookkeeping identity for compatible material/current-state/constituent pools with independently observed fates"
    used_for: "Separate stock/exit QA, dry constituents and water-only pools; residual disclosure without invented exchanges or full combustion-mass closure"
  - id: "carbon-oxidation-identity"
    type: "method_factor"
    reference: "Author-defined normative carbon stoichiometry identity: one mass unit of fossil carbon can form at most 44/12 mass units of fossil CO2"
    used_for: "Fossil-carbon-based CO2 upper QA constraint only, not a complete-oxidation or fuel-consumption factor"
