allocation_rules:
  - rule_id: hot_attribution
    applies_to: "service and useful metal"
    rule: "The sole intended product here is the reconstruction service; useful historical assets and necessary trial metal are physical outlets. Deliberately commercial metal production is excluded until a separate boundary and attribution is justified. All necessary noncommercial commissioning, first-lining, failed trials, idle support, correction and retest burdens belong to the accepted reconstruction service. Physical historical-asset and useful metal outlets remain transparent without automatic allocation away or avoided-product credit. If any trial is deliberately commercial co-production, separate its production boundary, enumerate intended outputs and handoffs, then approve a project-specific causally justified subdivision/attribution with raw drivers, shares and sensitivity before final data; no default free commercial metal or invented zero share."
    source_ids: []
  - rule_id: stock_view
    applies_to: "new supplies and returns"
    rule: "Declare one consistent gross-with-outlets or consumed-only view per SKU and scope. S=attributed_opening+external_net_receipts-carried_closing; closing includes recovered closing. S/N is gross-with-outlets and (S-usable_return)/N is consumed-only. Opening and closing are stock observations, not disjoint fates. Internal installation/issue/recharge is not another receipt; unused outward returns reduce supply only once. Waste/loss retain supply burdens; historic assets/heel are separate inherited stocks with no negative purchase."
    source_ids: []
  - rule_id: shared_and_period
    applies_to: "shared assets and periods"
    rule: "Use complete manufacture+maintenance+replacement+EOL burden and compatible job_driver/life_driver across all consuming jobs/nodes/periods. Life_driver requires observed life or observed history plus evidenced remainder, replacements, termination and EOL, with sources, uncertainty, sensitivity and update. Choose asset_equivalent=(job_driver/life_driver)/N or lifecycle-complete native service=job_driver/N with matching unit burden; never combine views or normalize twice. Link phases, stock carryovers and replacements; unresolved lifetime/remainder/termination or consumer coverage blocks finalization."
    source_ids: []
  - rule_id: secondary_and_reject
    applies_to: "secondary and rejected states"
    rule: "For external secondary charge or recovered inputs, document origin and recovery handoff, current transport/treatment and inherited burden or justified prior-system cut-off. Retained heel/internal remelt carry their recorded existing burdens without new purchase. Failed lining, off-spec heats, components and samples must link to actual rework, reuse/downgrade, recovery or discard; retain repeated resource burdens and count no unresolved reject as accepted service or useful metal. No universal recycled-content or substitution default."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "integrated_reconstruction"
      flow_role: "whole accepted intervention and actual gate"
      record_type: "acceptance_record"
      raw_fields: "site_id; job_id; intervention_id; reference_gate_id; accepted_intervention_ids; asset_id; campaign_id; batch_id; event_id; phase_id; period_id; scope_register; retained_equipment; replaced_equipment; civil_foundation_pit_deck_scope; metal_family; furnace_configuration; rated_capacity; capacity_unit; interface_register; authority; criteria_id; applicability_basis; cold_check_results; lining_requirement; lining_cycle_record; heat_ids; hot_tap_shutdown_results; defect_id; defect_closure; drawings_id; om_record; training_record; owner_signature; contractor_signature; accepted_date; N"
      collection_method: "Reconcile approved reconstruction contract, baseline survey and signed gate dossier; record actual criteria/results and defects through all attempts. Count N unique complete accepted intervention IDs; exclude repeated heats, test phases and unresolved rejects; one reference flow per ID. Use only cp_acceptance final unique accepted_intervention_ids/reference_gate_id for N; no phase or heat adds a new reference count."
      unit: "Item(s)"
      frequency: "each intervention and gate event"
      temporal_coverage: "All actual phases/periods from retained survey to signed handover including failed/repeated events"
      site_scope: "Named plant intervention and attributable offsite/provider scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed authority/applicability, traceable cold and hot result records, closed-defect evidence"
    - protocol_id: cp_stock
      process_id: "integrated_reconstruction"
      flow_role: "new supplies and unused outward returns"
      record_type: "stock_ledger"
      raw_fields: "site_id; job_id; intervention_id; reference_gate_id; accepted_intervention_ids; asset_id; campaign_id; batch_id; event_id; phase_id; period_id; sku; material_identity; material_state; native_property; native_unit; attributed_opening; gross_receipts; tare_receipts; external_net_receipts; carried_closing; recovered_closing; usable_return; return_receiver; return_transfer_id; internal_issue; installed_quantity; waste_quantity; loss_quantity; measurement_unit; conversion_factor; conversion_unit; conversion_source; density; density_unit; density_source; moisture; moisture_basis; temperature; temperature_unit; pressure; pressure_unit; return_view; scope_coverage; installed_or_temporary; lifecycle_coverage; uncertainty; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Use calibrated quantity/weight/meter records, delivery/return notes and physical closing survey in the same native unit; reconcile by SKU and state. Apply stock_native once per reference flow; retain all nonreturned waste/loss supply burdens, with recovered closing included once. Use only cp_acceptance final unique accepted_intervention_ids/reference_gate_id for N; no phase or heat adds a new reference count. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity aliases this record independent physical quantity keyed by atomic_flow_row_id under the original CP method and atomic_child_normalization, never another parent quantity. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      unit: "actual native unit; kg only for separate evidenced mass view"
      frequency: "each receipt/return and period opening/closing"
      temporal_coverage: "All actual phases/periods from retained survey to signed handover including failed/repeated events"
      site_scope: "Named plant intervention and attributable offsite/provider scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "Reconciled signed stock records, calibration, state/conversion evidence and investigated discrepancy"
