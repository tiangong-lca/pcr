      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `scope_gate` | accepted_service | N>0 unique accepted IDs, complete actual civil/lining/hot-trial gate, exact qualifiers and 1 Item(s); no furnace/heat/capacity counting or cold-only shortcut. |  |\n| `stock_heat_fates` | stocks and outputs | Check SKU-native gross/consumed-only view, closing including recovered closing, one matched outward return, historical/new distinction, heel/internal loops, heat mass closure, receiver/state of useful exports and separate slag/captured dust/contained waste. Investigate unknowns; no residual burn/emission or automatic credit. |  |\n| `burden_completeness` | provider, assets and periods | One owner and complete unit/boundary for direct/provider/offsite/rental/freight/test/spares/temporary utilities; all shared consumers, full asset lifecycle and source-backed remainder; period/replacement/termination links and no double normalization. Missing coverage is incomplete. |  |\n| `actual_environment` | actual environmental exchanges | MUST expand actual purchased and direct environmental water/gas roles separately. Check measured intakes/outfalls and substance/medium/species basis, actual burn or complete fate proof, factor/composition/fate compatibility and nonadditive whole-fluid views; hazard/exposure lists are not emission quantities. |  |\n| `output_attribution` | service, metal, historical assets and rejects | Necessary noncommercial trials retain all burdens on service; any deliberately commercial co-production needs separate boundary, complete intended outputs and justified raw-driver shares before final data. Verify secondary origin/prior burden and actual rework/exit paths. Rejects cannot enter accepted count or be silently free products. |  |\n| `identity_projection` | actual expanded data package | Concrete UUID/type/direction/state/native unit and support verification is mandatory for every final exchange. Projection and bilingual ordered IDs/semantics must agree. Missing actual SKU/provider/species or authority evidence blocks final data regardless of an automated check. |  |\n| close_atomic_installed_supplies | integrated_reconstruction; cp_stock | Block final foreground completion until every actual object in atomic_installed_supplies is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_trial_charge | integrated_reconstruction; cp_hot | Block final foreground completion until every actual object in atomic_trial_charge is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_fuel_supply | integrated_reconstruction; cp_fuel | Block final foreground completion until every actual object in atomic_fuel_supply is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_process_water | integrated_reconstruction; cp_stock | Block final foreground completion until every actual object in atomic_process_water is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_process_gases | integrated_reconstruction; cp_stock | Block final foreground completion until every actual object in atomic_process_gases is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_provider_services | integrated_reconstruction; cp_provider | Block final foreground completion until every actual object in atomic_provider_services is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_shared_assets | integrated_reconstruction; cp_asset | Block final foreground completion until every actual object in atomic_shared_assets is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_environmental_intakes | integrated_reconstruction; cp_environment | Block final foreground completion until every actual object in atomic_environmental_intakes is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_usable_supply_returns | integrated_reconstruction; cp_stock | Block final foreground completion until every actual object in atomic_usable_supply_returns is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_historic_asset_exports | integrated_reconstruction; cp_residue | Block final foreground completion until every actual object in atomic_historic_asset_exports is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_trial_metal_exports | integrated_reconstruction; cp_hot | Block final foreground completion until every actual object in atomic_trial_metal_exports is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_contained_wastes | integrated_reconstruction; cp_residue | Block final foreground completion until every actual object in atomic_contained_wastes is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_water_outfalls | integrated_reconstruction; cp_environment | Block final foreground completion until every actual object in atomic_water_outfalls is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_species_releases | integrated_reconstruction; cp_environment | Block final foreground completion until every actual object in atomic_species_releases is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| atomic_pair_provenance_complete | actual internal child source and recipient transfers | Verify actual source/receipt evidence, original physical quantities/units and ownership for the same material/state/event/gate. Traceable reuse of the same signed measurement is allowed; copied parent totals, overwritten receipts and forced unknown equality are prohibited. Unexplained differences without uncertainty, actual loss or state-transition responsibility evidence block completion; verify exactly one normalization per card. |  |\n\n"
