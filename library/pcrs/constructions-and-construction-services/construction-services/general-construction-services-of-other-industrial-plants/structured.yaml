validation_rules:
  - rule_id: scope_gate
    applies_to: "accepted_service"
    rule: "N>0 unique accepted IDs, complete actual civil/lining/hot-trial gate, exact qualifiers and 1 Item(s); no furnace/heat/capacity counting or cold-only shortcut."
    source_ids: []
  - rule_id: stock_heat_fates
    applies_to: "stocks and outputs"
    rule: "Check SKU-native gross/consumed-only view, closing including recovered closing, one matched outward return, historical/new distinction, heel/internal loops, heat mass closure, receiver/state of useful exports and separate slag/captured dust/contained waste. Investigate unknowns; no residual burn/emission or automatic credit."
    source_ids: []
  - rule_id: burden_completeness
    applies_to: "provider, assets and periods"
    rule: "One owner and complete unit/boundary for direct/provider/offsite/rental/freight/test/spares/temporary utilities; all shared consumers, full asset lifecycle and source-backed remainder; period/replacement/termination links and no double normalization. Missing coverage is incomplete."
    source_ids: []
  - rule_id: actual_environment
    applies_to: "actual environmental exchanges"
    rule: "MUST expand actual purchased and direct environmental water/gas roles separately. Check measured intakes/outfalls and substance/medium/species basis, actual burn or complete fate proof, factor/composition/fate compatibility and nonadditive whole-fluid views; hazard/exposure lists are not emission quantities."
    source_ids: []
  - rule_id: output_attribution
    applies_to: "service, metal, historical assets and rejects"
    rule: "Necessary noncommercial trials retain all burdens on service; any deliberately commercial co-production needs separate boundary, complete intended outputs and justified raw-driver shares before final data. Verify secondary origin/prior burden and actual rework/exit paths. Rejects cannot enter accepted count or be silently free products."
    source_ids: []
  - rule_id: identity_projection
    applies_to: "actual expanded data package"
    rule: "Concrete UUID/type/direction/state/native unit and support verification is mandatory for every final exchange. Projection and bilingual ordered IDs/semantics must agree. Missing actual SKU/provider/species or authority evidence blocks final data regardless of an automated check."
    source_ids: []
