  calculation_rules:
    - id: stock_native
      applies_to: "installed_supplies_shell; installed_supplies_coil; installed_supplies_power; installed_supplies_control; installed_supplies_hydraulic; installed_supplies_charging; installed_supplies_cooling; installed_supplies_extraction; installed_supplies_concrete; installed_supplies_steel; installed_supplies_anchor; installed_supplies_grout; installed_supplies_lining; installed_supplies_preparation; installed_supplies_cable; installed_supplies_pipe; atomic_installed_supplies; trial_charge_iron_scrap; trial_charge_steel_scrap; trial_charge_primary_feed; trial_charge_addition; atomic_trial_charge; atomic_fuel_supply; process_water_water; process_water_hydraulic_fluid; process_water_cleaner; process_water_treatment; atomic_process_water; atomic_process_gases; usable_supply_returns_installed_supplies_shell; usable_supply_returns_installed_supplies_coil; usable_supply_returns_installed_supplies_power; usable_supply_returns_installed_supplies_control; usable_supply_returns_installed_supplies_hydraulic; usable_supply_returns_installed_supplies_charging; usable_supply_returns_installed_supplies_cooling; usable_supply_returns_installed_supplies_extraction; usable_supply_returns_installed_supplies_concrete; usable_supply_returns_installed_supplies_steel; usable_supply_returns_installed_supplies_anchor; usable_supply_returns_installed_supplies_grout; usable_supply_returns_installed_supplies_lining; usable_supply_returns_installed_supplies_preparation; usable_supply_returns_installed_supplies_cable; usable_supply_returns_installed_supplies_pipe; usable_supply_returns_trial_charge_iron_scrap; usable_supply_returns_trial_charge_steel_scrap; usable_supply_returns_trial_charge_primary_feed; usable_supply_returns_trial_charge_addition; usable_supply_returns_process_water_water; usable_supply_returns_process_water_hydraulic_fluid; usable_supply_returns_process_water_cleaner; usable_supply_returns_process_water_treatment; atomic_usable_supply_returns"
      rule: "external_net_receipts=gross_receipts-tare_receipts; S=attributed_opening+external_net_receipts-carried_closing; gross_input=S/N; consumed_input=(S-usable_return)/N. recovered_closing is included in carried_closing; return_view selects one expression, never both."
      inputs:
        - cp_stock
        - cp_hot
        - cp_fuel
        - N
      output: "Actual native-unit supply per reference flow; matched unused outward return ledger"
      source_ids: []
    - id: heat_ledger
      applies_to: "trial_charge_iron_scrap; trial_charge_steel_scrap; trial_charge_primary_feed; trial_charge_addition; atomic_trial_charge; trial_metal_exports_tapped; trial_metal_exports_solidified; trial_metal_exports_sample; atomic_trial_metal_exports; contained_wastes_historical_lining; contained_wastes_debris; contained_wastes_failed_component; contained_wastes_refractory; contained_wastes_slag; contained_wastes_dust; contained_wastes_filter; contained_wastes_metal; contained_wastes_liquid; contained_wastes_packaging; atomic_contained_wastes"
      rule: "Use measured charge_to_heat and linked cold-stock/heel/internal transfer quantities for each actual heat; external receipts are not automatically furnace feed. Keep each gross native stream independent. Reconcile either an evidenced compatible elemental/metal-content basis with actual composition, units and sources for charge/metal/slag/dust, or a complete whole-stream mass basis including actual additions, lining transfers and evidenced reaction-gas uptake. Do not balance metal-charge kg directly against oxide/entrained-lining slag gross kg. Pair transfers and opening/closing stocks; investigate unaccounted_difference without inferring emissions or oxidation."
      inputs:
        - cp_hot
        - cp_stock
        - cp_residue
        - cp_environment
        - N
      output: "Auditable heat stock/fate closure; external charge and useful exports per reference flow"
      source_ids: []
    - id: utility_meter
      applies_to: "electricity; electricity_exports"
      rule: "utility_meter=sum(source-specific gross_import*conversion_factor*attributable_share)/N, reconciled with source meter deltas, onsite_generation, actual construction/lining/hot/retest/circulation/loss physical drivers and gross_export; electric_export=gross_export/N as a separate actual receiver Product outlet. Never net exports against imports; onsite-generation fuel/assets/releases are covered once."
      inputs:
        - cp_energy
        - N
      output: "Actual attributable native electrical energy per reference flow"
      source_ids: []
    - id: fuel_fates
      applies_to: "atomic_fuel_supply; atomic_species_releases"
      rule: "Use measured_burn, or verify opening+net_receipts=closing+usable_return+burn+nonburned_waste+uncontained_loss in one compatible native basis with complete disjoint fates and investigated unknowns. recovered_to_closing is already in closing; total_spill_audit is nonadditive. Only verified burn supports a matched combustion factor."
      inputs:
        - cp_fuel
        - cp_environment
        - N
      output: "Actual burn and disjoint fuel fates, separate from upstream fuel supply"
      source_ids: []
    - id: provider_complete
      applies_to: "atomic_provider_services"
      rule: "service_quantity/N with physical_completed_result, matching native_unit and full upstream scope; add missing_scope once and remove direct_overlap."
      inputs:
