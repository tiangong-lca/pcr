published_dataset_profile:
  dataset_role: "Foreground site-specific accepted integrated reconstruction and commissioning service data package"
  downstream_use: "secondary_dataset; background_dataset for compatible actual interventions and downstream process/lifecyclemodel projections"
  allowed_use: "Declared retained ferrous coreless-induction reconstruction scope with actual civil and first-lining/hot gate and matching qualifiers"
  excluded_use: "New foundry or furnace manufacture, cold-only installation, ordinary metal production, future savings/avoided equipment or generic safety/emissions claims"
  required_metadata: "Intervention/site ID, retained/replaced/civil and interface registers, furnace/metal/configuration/capacity descriptors, authority/criteria, phases and reporting periods, N, stock view, provider/assets and useful-output attribution"
  required_quality_disclosure: "Gate and physical coverage, uncertainties and discrepancies, raw stock/heat/fate/conversion evidence, secondary treatment, provider and lifecycle gaps, actual identity and environment-method evidence"
  update_trigger: "Changed retained scope, civil/interface package, metal/charge or lining route, criteria/authority, hot trial purpose, supplier/asset life, stock or environmental evidence and material data gaps"
data_sources:
  - id: "unsd-cpc3-industrial-plants-2025"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only: industrial civil construction/repair/alteration includes iron foundries, while ordinary industrial buildings are separate; no inventory recipe."
  - id: "inductotherm-installation-retrofit-services"
    type: "handbook"
    reference: "https://inductoheat.eu/wp-content/uploads/sites/29/2019/05/Inductotherm-Group-Brochure-Optimieren.pdf"
    used_for: "Historic primary brochure supports observed integrated civil-to-commissioning retrofit/rebuild service; no current capability, project recipe or quantitative factor."
  - id: "inductotherm-coreless-steel-2013"
    type: "literature"
    reference: "https://inductothermgroup.com/wp-content/uploads/2019/05/The-Application-of-the-Coreless-Induction-Furnace-in-Steel-Melting-A-1.pdf"
    used_for: "Primary technical paper supports actual furnace/foundation/deck/power/control/cooling/extraction interfaces; layouts and numeric examples are not defaults."
  - id: "electroheat-ferrous-foundry-commissioning"
    type: "extension_guidance"
    reference: "https://electroheatinduction.com/installation-of-two-5-ton-steel-and-cast-iron-induction-furnaces-in-the-great-lakes-usa/"
    used_for: "Qualitative supplier foundry case supports installed interfaces, pre-start checks, supervised trial heats and handover. Anonymous client and confidential operating metrics limit verification; no furnace count/capacity/energy/yield default."
  - id: "hongteng-induction-installation-2026"
    type: "extension_guidance"
    reference: "https://www.smelting-furnace.com/induction-furnace-installation-guide/"
    used_for: "Primary supplier guide supports responsibility interfaces and progressive cold/first-heat/handover documentation under adopted project instructions; not a universal standard or operating authorization."
  - id: "hse-foundry-furnace-fd2-2022"
    type: "official_guidance"
    reference: "https://www.hse.gov.uk/pubns/guidance/fd2.pdf"
    used_for: "UK guidance identifies task/charge-specific fume control, capture indicators, testing and cleaning evidence. Jurisdiction and applicability are declared; hazards, limits and protective equipment are not emitted quantities or global thresholds."
