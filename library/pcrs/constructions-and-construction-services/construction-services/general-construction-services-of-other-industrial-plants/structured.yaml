product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.general-construction-services-of-other-industrial-plants"
  classification_refs: "CPC 3.0 54269; narrower methodology subset, classification context only"
  covered_products: "Integrated retained-plant civil and process-interface reconstruction services with actual lining and hot-trial acceptance"
  excluded_products: "Exclude a whole new foundry, generic industrial building, nonferrous-only or blast/cupola/EAF-only plant, separately supplied furnace machinery, isolated erection/relining/routine maintenance, cold-only installation, and ordinary commercial melting or casting after handover. Capacity, vessel count, lining chemistry, coolant, heat duration, test temperature, energy/yield, emissions and asset life are project-specific; supplier examples are no defaults. Acceptance is neither a universal operating procedure nor an automatic safety, emissions-compliance or lifetime-performance certificate. unsd-cpc3-industrial-plants-2025; hse-foundry-furnace-fd2-2022."
  representative_product: "Accepted integrated reconstruction and commissioning service for an existing ferrous foundry coreless-induction melting plant"
  production_route: "Retained survey and isolation; actual removal/civil modification; integrated installation; progressive cold checks; required lining commissioning; supervised hot trials; defects closed and signed handover"
  market_state: "Completed accepted site-specific integrated construction service on an existing plant, not a tonne of metal or a purchased furnace"
functional_unit:
  what: "Accepted integrated reconstruction and commissioning service for an existing ferrous foundry coreless-induction melting plant"
  how_much: "1 complete accepted intervention"
  how_well: "Approved project-specific civil and integrated cold/hot acceptance dossier, closed defects and signed owner/contractor handover"
  how_long_or_cycle: "From retained survey through actual removal/civil, integration, first-lining and cold/hot trial, correction and handover; link all reporting periods without a standard duration"
  reference_flow_link: "accepted_service"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers a completed integrated reconstruction and commissioning intervention on an existing ferrous foundry coreless-induction melting plant. Its retained-state baseline and required actual first-lining/hot-trial acceptance distinguish it from a newly built specialized cold-tested asset. Include the contracted civil foundation, pit, melt-deck and access alterations together with actual furnace, power/coil/control, hydraulic, charge-handling, cooling and fume-capture integration. The output requires approved pre-start checks, required lining installation/dryout/sintering, supervised ferrous trial heats, correction/retest and signed owner/contractor handover. These activities form one integrated responsibility unless real independently evidenced handoffs require additional nodes. inductotherm-installation-retrofit-services; inductotherm-coreless-steel-2013; electroheat-ferrous-foundry-commissioning; hongteng-induction-installation-2026. Exclude a whole new foundry, generic industrial building, nonferrous-only or blast/cupola/EAF-only plant, separately supplied furnace machinery, isolated erection/relining/routine maintenance, cold-only installation, and ordinary commercial melting or casting after handover. Capacity, vessel count, lining chemistry, coolant, heat duration, test temperature, energy/yield, emissions and asset life are project-specific; supplier examples are no defaults. Acceptance is neither a universal operating procedure nor an automatic safety, emissions-compliance or lifetime-performance certificate. unsd-cpc3-industrial-plants-2025; hse-foundry-furnace-fd2-2022."
      source_ids:
        - unsd-cpc3-industrial-plants-2025
        - inductotherm-installation-retrofit-services
        - inductotherm-coreless-steel-2013
        - electroheat-ferrous-foundry-commissioning
        - hongteng-induction-installation-2026
        - hse-foundry-furnace-fd2-2022
    - rule_id: retained_and_civil
      applies_to: "whole intervention"
      rule: "Include necessary isolation, historical equipment/lining removal and actual foundation/pit/deck/platform work, all new or repaired integration and every required first-lining/hot-trial resource until acceptance. Retained historical asset and heel stocks stay distinct from current purchases."
      source_ids:
        - inductotherm-installation-retrofit-services
        - inductotherm-coreless-steel-2013
    - rule_id: acceptance_gate
      applies_to: "accepted_service"
      rule: "Require documented applicable civil/support checks, installed package register, electrical/grounding/protection/interlock/emergency-stop, cooling/hydraulic, extraction/capture indicators and adopted commissioning-control checks; required lining conditioning and supervised heat/tap/shutdown results; closed defects, drawings, O&M, training and signed owner/contractor acceptance. Actual criteria and authorization must be recorded, not invented."
      source_ids:
        - electroheat-ferrous-foundry-commissioning
        - hongteng-induction-installation-2026
        - hse-foundry-furnace-fd2-2022
    - rule_id: coverage_owner
      applies_to: "all resources"
      rule: "Assign one owner to each direct/provider/rental/freight/temporary/test/spare or continuity event. A price, labor hour or machine hour alone is not a physical completed service. Use a matching lifecycle-complete provider unit or collect omitted physical burdens. Missing scope blocks final data."
      source_ids: []
    - rule_id: stock_and_heat
      applies_to: "materials and hot trial"
      rule: "Track first charge, purchases, retained heel, internally recharged melt/samples/sprues, tapped accepted metal, slag, dust, contained residues and closing metal by heat and event. Internal recycles are transfers, not fresh purchases or repeated outputs. Unknown imbalance needs investigation and uncertainty; do not infer air emission or fuel burn as a residual."
      source_ids: []
    - rule_id: secondary_and_period
      applies_to: "secondary charge and shared assets"
      rule: "Declare actual secondary origin, recovery handoff, inherited burden or justified cut-off and prior-system ownership. Enumerate survey, removal/civil, installation, lining, cold/hot trial, correction and handover periods, linked purchases, assets, outputs, replacement and termination. Permanent delivered plant components bear full actual upstream purchases once, not future-life/trial-hour allocation. Shared-driver allocation applies only to actual supporting temporary/provider assets. No arbitrary life, avoided production or duplicate historical burden."
      source_ids: []
