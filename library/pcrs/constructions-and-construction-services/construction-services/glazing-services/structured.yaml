  data_quality_requirements:
    - id: dq_route_identity
      applies_to: "qualifying lot"
      requirement: "Confirm the received-frame boundary and factory-IGU dry mechanical retention route before compiling quantities. Do not silently include frame repair, wet sealants or altered finished IGUs."
      evidence: "Signed scope, frame release and approved glazing-system details; ATS-192 sections on edge damage, dry glazing and material compatibility"
    - id: dq_actual_component
      applies_to: "component and upstream data"
      requirement: "Identify actual IGU build, coating/orientation, seal system, every material/grade/profile, new versus retained parts and manufacturer compatibility approval. Each concrete exchange needs its matching verified identity and upstream scope."
      evidence: "Supplier labels, drawings, material certificates, approval documents, actual bill of materials and identity readback"
    - id: dq_area_unique
      applies_to: "reference_service and all unit streams"
      requirement: "Preserve actual dimensions, one area convention, unique unit and pass IDs, positive unique accepted area and all rejection/WIP states. Reconcile alternative commercial area conventions with a unit-specific bridge."
      evidence: "Measurement register; signed acceptance; event ledger and area conversion record"
    - id: dq_mass_bridge
      applies_to: "kg material and rejected-unit rows"
      requirement: "Use calibrated net weighing or actual same-grade/item/build evidence. A complete IGU is a composite; generic pane density or a nominal product thickness is insufficient for its complete mass."
      evidence: "Calibration, tare, supplier linear/item mass or exact-build complete-unit mass evidence"
    - id: dq_stock_exclusive
      applies_to: "material inputs and usable exits"
      requirement: "Demonstrate physical gross draw and separately positive usable exits. Closing intact unissued stock, usable return, external transfer, waste and processed WIP cannot overlap. Net consumed is diagnostic only."
      evidence: "State- and event-resolved stock reconciliation with custody receipts and original-burden ledger"
    - id: dq_reject_ownership
      applies_to: "rejected and corrective streams"
      requirement: "Retain own-node origin, actual state and destination for every discarded or returned unit. Match intact correction counterparts and include all extra activity while avoiding another IGU manufacture charge."
      evidence: "Damage/inspection decision, unit/pass/event ledger, paired transfer or waste receipt"
    - id: dq_water_closure
      applies_to: "cleaning-water pool"
      requirement: "Separately evidence wastewater water, spent-wipe water, retained water, unused exits and actual vapour, including water in formulations. Unexplained differences beyond measurement uncertainty block water-completeness claims."
      evidence: "Water-content measurements, collection and retention evidence, validated evaporation evidence, pool balance and uncertainty"
    - id: dq_power_complete
      applies_to: "own-node electricity"
      requirement: "Provide actual provider/voltage/period and direct metering or positive complete shared weights. Resolve bundled-energy scope and reconcile all consumers once."
      evidence: "Meter records, complete weights/consumer table, invoice and service scope"
    - id: dq_service_complete
      applies_to: "own-node services"
      requirement: "Provide actual provider/asset/contract, paid availability and idle hours, complete shared weights and actual billed-unit conversion. Do not insert a default eight-hour day."
      evidence: "Contract and invoice; actual availability schedule; hours-per-day evidence where needed; complete allocation table"
    - id: dq_period_lineage
      applies_to: "all stock, events and final lot"
      requirement: "Cover every relevant period through first acceptance, link opening/closing WIP and actual correction/termination events, and prevent double attribution. Later replacements require a separate declared boundary."
      evidence: "Period inventory, WIP lineage and original-burden carry record; acceptance and termination dates"
    - id: dq_range_status
      applies_to: "all inventory cards"
      requirement: "Provisional screens are replaceable reasoned estimates, except the exact normalization identity. Retain actual values and uncertainty; use independent reviewed observations to replace screens rather than validating a batch with its own maximum."
      evidence: "Range evidence tier and rationale; independent sample provenance; investigation record for outliers"
    - id: dq_release_specificity
      applies_to: "direct elementary releases"
      requirement: "Identify actual substance/state or particle fraction and receiving medium before selecting a concrete exchange. Missing data does not establish absence and unknown residual mass is not a pollutant."
      evidence: "Chemical identity, sampling/validated factor evidence, actual operation and compartment records"
    - id: dq_completeness
      applies_to: "completed data package"
      requirement: "Disclose measurement uncertainty, temporal/site/specification representativeness, upstream mismatches, excluded operations, unclosed pools and unresolved identities. Do not call a package fully validated when checks are skipped or gaps remain."
      evidence: "Collection coverage ledger; quality review; checker performed/skipped report; unresolved-gap list"
    - id: atomic_survey_shared_service
