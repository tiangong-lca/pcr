measurement_rules:
  - id: accepted_area_basis
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: ""
    required_unit: "m2"
    rule: "A is unique finally accepted IGU unit face area from actual unit dimensions and IDs in cp_accept_handoffs. Include each accepted unit only once regardless of pane count, face count or repeated inspections."
