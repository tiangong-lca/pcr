    applies_to: "supplied_igus; accepted_igus; glaze_feed; retained_glazing; accept_feed; unused_igu_return; accept_rework_return; glaze_rework_feed"
    required_property_ref:
      name: "Area"
      uuid: ""
    required_unit: "m2"
    rule: "Preserve the same measured unit-outline basis for supply, forward/reverse transfers, WIP and usable IGU exits. No internal handoff is fixed to 1 m2."
  - id: mass_bridge_required
    applies_to: "setting_blocks_support_setting_blocks; setting_blocks_edge_blocks; gaskets; beads_fasteners_bead; beads_fasteners_fastener; atomic_beads_fasteners; glazing_offcuts_gasket; glazing_offcuts_block; glazing_offcuts_bead; glazing_offcuts_fastener; atomic_glazing_offcuts; broken_igus; survey_rejected_igu_waste; accept_rejected_igu_waste"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh the actual material or complete rejected IGU. A length, count or area record can become kg only with actual same-grade linear mass, item mass or complete-build area-to-mass evidence. Pane thickness alone does not establish complete IGU mass."
  - id: gross_draw_basis
    applies_to: "supplied_igus; setting_blocks_support_setting_blocks; setting_blocks_edge_blocks; gaskets; beads_fasteners_bead; beads_fasteners_fastener; atomic_beads_fasteners; cleanup_water; cleanup_supplies_cloth; cleanup_supplies_agent; cleanup_supplies_protection; atomic_cleanup_supplies"
    required_property_ref:
      name: "Area or Mass as stated on each card"
      uuid: ""
    required_unit: "m2 or kg as stated on each card"
    rule: "Physical gross draw is opening intact unissued stock plus receipts minus closing intact unissued stock. Usable boundary exits are included in this draw and separately reported as positive product outputs in the same property and unit. Processing losses and correction draws remain included."
  - id: water_pool_basis
    applies_to: "cleanup_water; cleanup_supplies_cloth; cleanup_supplies_agent; cleanup_supplies_protection; atomic_cleanup_supplies; cleanup_waste_cloth; cleanup_waste_protection; cleanup_waste_residue; atomic_cleanup_waste; cleanup_wastewater; accept_water_vapour"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Track actual water content independently of total mixture mass. Collected wastewater, water in spent wipes, retained water, unused exits and actual water vapour are exclusive fates. Do not convert an unexplained residual into vapour or another direct emission."
  - id: power_basis
    applies_to: "survey_electricity; glaze_electricity; accept_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Use the own-node actual meter quantity or an evidenced complete shared attribution. Convert actual MJ electricity to kWh by division by 3.6; retain the original record, supplier, voltage and period."
  - id: service_duration_basis
    applies_to: "survey_shared_service_access; survey_shared_service_handling; survey_shared_service_storage; atomic_survey_shared_service; glaze_shared_service_access; glaze_shared_service_handling; glaze_shared_service_tool; atomic_glaze_shared_service; accept_shared_service_access; accept_shared_service_cleaning; atomic_accept_shared_service"
    required_property_ref:
      name: "Duration"
      uuid: ""
    required_unit: "h"
    rule: "Use actual paid availability or actual contract hours, including paid idle time. Convert calendar days only using the specific contract's hours-per-day evidence. Do not assume an eight-hour rental day."
  - id: period_stock_boundary
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Relevant card property"
      uuid: ""
    required_unit: "Relevant card unit"
    rule: "Index opening and closing pools by unit, material, node and period. Intact unissued stock, processed WIP, usable exits, rejected material and accepted installed output are exclusive states. Carry original burdens with WIP without charging their manufacture again."
