      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| `validate_dry_scope` | product category and lot | Verify actual received frames, finished factory IGUs, preformed dry gaskets and mechanical retention. Reject a scope that silently performs frame repair, field IGU alteration, wet/structural silicone or fire glazing. | `pilkington-general-glazing-2013` |\n| `validate_project_details` | support, gasket, retention and drainage acceptance | Use the actual approved IGU/frame-system requirements and compatibility evidence. The monolithic-glass dimensions in ATS-192 must not become default IGU limits; no universal block, pressure or drainage values are inferred. | `pilkington-general-glazing-2013` |\n| `validate_reference_area` | reference_service | Require positive A from unique finally accepted actual unit outline areas. Confirm the reference_service name, Area/m2 and 1 m2 amount; exclude pane/face multiplication, visible-only convention without conversion, rejected/held units and repeat inspections. |  |\n| `validate_forward_handoffs` | accepted_igus; glaze_feed; retained_glazing; accept_feed | Match counterpart event/unit IDs, area, state and period; reconcile actual mismatches with stocks/WIP, never by replacing actual intermediate feed with 1 m2. |  |\n| `validate_corrective_handoffs` | accept_rework_return; glaze_rework_feed | Activate only for actual intact corrective returns. Match counterpart event/unit IDs and area; carry original material burden without new manufacture and retain each actual extra material/service event. |  |\n| `validate_own_node_discards` | survey_rejected_igu_waste; broken_igus; accept_rejected_igu_waste | Verify actual origin node, unit/build, complete composite mass or exact-build bridge, rejected state and real waste custodian. No intact usable return or unresolved hold can be disguised as waste, and no late discard can be assigned to a prior node for convenience. |  |\n| `validate_physical_draw` | material inputs and usable exit cards | Recalculate opening plus receipts minus closing intact unissued stock as physical gross draw, including actual usable boundary exits. Confirm positive same-property exits and exclusive states; any net diagnostic must not also reduce physical input or create a credit. |  |\n| `validate_unused_burden` | usable outputs | Transfer only evidenced original unused-material burden. Do not transfer service, idle, inspection, correction or installation burdens, and do not claim avoided manufacture. |  |\n| `validate_mass_conversions` | all kg material and rejected-unit flows | Confirm actual weighing/tare or same-grade/item/complete-build conversion. Retain IGU usable exits as Area/m2; a kg waste counterpart requires its independently supported complete-unit mass bridge. |  |\n| `validate_water_pools` | cleanup_water; cleanup_supplies_cloth; cleanup_supplies_agent; cleanup_supplies_protection; atomic_cleanup_supplies; cleanup_waste_cloth; cleanup_waste_protection; cleanup_waste_residue; atomic_cleanup_waste; cleanup_wastewater; accept_water_vapour | Reconcile actual available water and exclusive wastewater, wipe, retained, unused-exit and evidenced-vapour fates within quantified uncertainty. Do not infer vapour from residuals or duplicate wet-wipe water as wastewater. Report an unclosed pool as incomplete. |  |\n| `validate_electricity` | each own-node electricity card | Require node-owned metering or positive complete shared attribution with all consumers and periods, correct MJ/kWh handling, actual supplier/voltage and no overlapping bundled-service burden. |  |\n| `validate_paid_service` | each own-node shared-service card | Require actual provider/asset/scope, actual paid contract hours including idle, contract-specific billed-day conversion, positive complete consumer weights and total closure; an assumed eight-hour day is invalid. |  |\n| `validate_periods` | all node and stock records | Verify receiving, glazing, acceptance and correction period linkage; exclusive opening/closing intact stock and processed WIP; one-time carrying-burden attribution; no accepted denominator for a terminated unaccepted lot. |  |\n| `validate_emission_identity` | atomic_glaze_other_releases; atomic_accept_other_releases; accept_water_vapour | Require known actual species, physical state where relevant, receiving compartment and measured or validated quantity basis. Unknown occurrence, species, medium or quantity remain data gaps; an umbrella label, missing captured waste and a water or stock residual are insufficient evidence. Exclude captured offcuts/dust from direct release and require each non-H2O event to use its actual own-node protocol. |  |\n| `validate_range_evidence` | inventory ranges | Keep every provisional screen labelled reasoned_estimate and separate from real quantities. Investigate outliers using external or independent foreground evidence. The 1..1 final range represents A/A normalization only and proves no physical yield. |  |\n| `validate_publication_completeness` | final downstream dataset | Report accepted inputs, performed checks, skipped checks, findings and completeness. Resolve actual exchange and support identities, material balances and review blockers before claiming a complete concrete dataset; an automated structural pass does not prove external identity or physical correctness. |  |\n| close_atomic_survey_shared_service | survey; cp_survey_service | Block final foreground completion until every actual object in atomic_survey_shared_service is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_igu_packaging | survey; cp_survey_packaging | Block final foreground completion until every actual object in atomic_igu_packaging is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_beads_fasteners | glaze; cp_glaze_materials | Block final foreground completion until every actual object in atomic_beads_fasteners is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_glaze_shared_service | glaze; cp_glaze_service | Block final foreground completion until every actual object in atomic_glaze_shared_service is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_unused_glazing_component_return | glaze; cp_glaze_materials | Block final foreground completion until every actual object in atomic_unused_glazing_component_return is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_glazing_offcuts | glaze; cp_glaze_waste | Block final foreground completion until every actual object in atomic_glazing_offcuts is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_glaze_other_releases | glaze; cp_glaze_releases | Block final foreground completion until every actual object in atomic_glaze_other_releases is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_cleanup_supplies | accept; cp_accept_materials | Block final foreground completion until every actual object in atomic_cleanup_supplies is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_accept_shared_service | accept; cp_accept_service | Block final foreground completion until every actual object in atomic_accept_shared_service is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_unused_cleanup_material_return | accept; cp_accept_materials | Block final foreground completion until every actual object in atomic_unused_cleanup_material_return is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_cleanup_waste | accept; cp_accept_waste | Block final foreground completion until every actual object in atomic_cleanup_waste is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_accept_other_releases | accept; cp_accept_releases | Block final foreground completion until every actual object in atomic_accept_other_releases is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| atomic_pair_provenance_complete | actual internal child source and recipient transfers | Verify actual source/receipt evidence, original physical quantities/units and ownership for the same material/state/event/gate. Traceable reuse of the same signed measurement is allowed; copied parent totals, overwritten receipts and forced unknown equality are prohibited. Unexplained differences without uncertainty, actual loss or state-transition responsibility evidence block completion; verify exactly one normalization per card. |  |\n\n"
