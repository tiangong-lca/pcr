  classification_refs: "cpc:3.0:54710; this semantic service is a bounded part of the glazing-services classification, not the whole classification"
  covered_products: "Dry supported and mechanically retained installation of factory sealed IGUs into an accepted existing frame; actual inspection, handling, cleaning and correction before installation acceptance"
  excluded_products: "IGU manufacturing; frame manufacture, installation or repair; demolition and deglazing; wet glazing and structural silicone installation; fire glazing; cutting, seaming or grinding finished IGUs in the field"
  representative_product: "A factory sealed IGU installed with the system-specified compatible blocks, preformed gaskets and mechanical retention, accepted after drainage and condition inspection"
  production_route: "survey and receive → dry support and retention → inspect, clean, correct where necessary, and accept"
  market_state: "Completed installation service at customer acceptance; supplied components and intermediate installed states are not additional final services"
functional_unit:
  what: "Dry gasket insulating glass unit installation services"
  how_much: "1 m2 of accepted IGU unit area, counted once per unique accepted unit"
  how_well: "Correct actual IGU build and orientation; approved compatible components; undamaged units and edges; verified support, retention, gasket fit and drainage; clean condition and documented project acceptance"
  how_long_or_cycle: "One identified installation lot from received-frame release through first final acceptance, including all actual correction visits before that acceptance; report calendar dates and periods; no assumed in-use lifetime"
  reference_flow_link: "reference_service"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This methodology covers installing factory sealed insulating glass units into an existing compatible frame that has already been released for glazing. The installer receives the frame interface and finished units, verifies suitability and condition, seats the units on the actual specified support and edge blocks, fits preformed dry gaskets and mechanical retention, and hands over clean, undamaged, inspected glazing with the intended drainage path available. The declared service includes the actual handling, access, correction, consumable use and waste arising between that received condition and the accepted installation gate. Manufacturer guidance supports protection of finished edges, compatible resilient materials, support and drainage as distinct installation responsibilities. [Source: pilkington-general-glazing-2013] The category excludes manufacture of the IGU, new frame installation, frame repair, removal or demolition of previous glazing, wet bedding or site applied wet sealant glazing, structural silicone bonding, fire resistant glazing systems, and field cutting, seaming or grinding of an IGU. A project requiring any of these operations needs a separately declared foreground boundary; it must not be made to fit this category by omitting an operation. Factory edge seals integral to a supplied IGU remain part of that supplied component and do not turn this installation into a structural silicone route. The qualifying route is determined by the actual system documentation. A polymeric preformed gasket or block may be used only when approved for the actual IGU seals, coatings and frame system. A material example in a general guide is not a bill of materials. No universal glass thickness, pane configuration, edge clearance, block geometry, gasket pressure, drainage-hole count or installed service life is imposed here. In particular, the dimensional table for annealed monolithic glass in ATS-192 is not an IGU specification. The actual approved project details govern acceptance. [Source: pilkington-general-glazing-2013]"
      source_ids:
        - pilkington-general-glazing-2013
    - rule_id: boundary_received_frame
      applies_to: "survey"
      rule: "Include condition and compatibility inspection of the existing frame. The frame_interface card represents the received installation interface; its area must not create new-frame manufacturing or frame-installation burdens. A frame requiring repair is outside this lot's qualifying starting condition."
      source_ids:
        - pilkington-general-glazing-2013
    - rule_id: boundary_factory_unit
      applies_to: "survey; glaze"
      rule: "Receive finished factory IGUs by actual build and ID; include handling and protection; do not cut, seam or grind finished units to correct a mismatch."
      source_ids:
        - pilkington-general-glazing-2013
    - rule_id: boundary_dry_joining
      applies_to: "glaze"
      rule: "Include actual IGUs, compatible support and edge blocks, preformed gaskets, and new mechanical retention parts where drawn. Identify existing retained parts without treating them as new purchased inputs. Support, gasket fit, edge protection and drainage are installation responsibilities."
      source_ids:
        - pilkington-general-glazing-2013
    - rule_id: boundary_stage_gates
      applies_to: "survey; glaze; accept"
      rule: "Record survey release, retained-but-unaccepted glazing and final acceptance as separate gates. Only the last is the reference service; actual intermediate and reverse transfers remain internal handoffs."
      source_ids:
        - pilkington-general-glazing-2013
    - rule_id: boundary_own_node_rejects
      applies_to: "survey; glaze; accept"
      rule: "A discarded unit belongs to the node that actually damaged or rejected and dispatched it. Distinguish incoming damaged composite IGUs, glazing breakage, final-inspection damage, usable unprocessed exits and intact corrective returns. Every reject has an ID, quantity, custodian or rework destination and event date."
      source_ids:
        - pilkington-general-glazing-2013
    - rule_id: boundary_periods
      applies_to: "all foreground nodes"
      rule: "Enumerate receiving/storage, glazing, inspection/cleaning and correction periods through first acceptance. Include opening and closing WIP and paid service periods. Later use, routine maintenance and post-acceptance replacement are outside this service lot. A terminated lot with no accepted area cannot be normalized into an accepted service."
      source_ids: []
    - rule_id: boundary_shared_services
      applies_to: "survey; glaze; accept"
      rule: "Include actual handling/access/tool/storage service and power serving the included work. List every consumer and relevant period of a shared asset, including other jobs when they share the measured total. A service dataset that already includes its energy or operator must not be combined with duplicate separate burdens."
      source_ids: []
    - rule_id: boundary_water_and_emissions
      applies_to: "glaze; accept"
      rule: "Separate supplied cleaning water and materials from collected waste/wastewater and actual substance-specific releases. Weather water and building runoff are not cleaning inputs. Report exclusive accept water fates and measured or independently evidenced own-glaze/own-accept direct releases by actual substance/particle basis and receiving compartment. Incidental component-fitting emissions are conditional actual events, not inferred offcut deficits."
      source_ids:
        - pilkington-general-glazing-2013
boundary_abstraction:
  declared_starting_condition: "Existing compatible frames are complete and released for glazing; factory sealed IGUs arrive in their supplied condition; newly drawn glazing and cleaning materials are separately identified"
  starting_condition_role: "Accepted installed receiving interface and finished component supply; not a zero-burden declaration for newly purchased IGUs or consumables"
  product_classification_scope: "Installation service using dry gaskets and mechanical retention, bounded as stated in Sections 1 and 2"
  recursive_input_rule: "An earlier installation service or existing installed frame is a disclosed received condition. Do not recursively charge the same accepted installation or frame production through the interface card. Any purchased distinct service is linked once to its actual supplier and scope."
  upstream_dataset_requirement: "Link the actual factory IGU build and each newly drawn material to a compatible upstream dataset once; record actual electricity and contracted-service supply; separate component manufacture from foreground installation; disclose unresolved matches"
  disclosure: "Report received-frame release, supplier and component specifications, every node and period, access/service boundary, physical draw and usable exits, internal/WIP balances, rejected-unit fates, correction visits, shared-attribution decisions and exclusions"
