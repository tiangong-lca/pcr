    - protocol_id: cp_survey_igus
      process_id: "survey"
      flow_role: "IGU physical draw, forward handoff, usable exit and incoming discard"
      record_type: "stock ledger, unit register, transfer and waste record"
      raw_fields: "lot_id; period_id; event_ID; producing_node; unit_ID; actual_unit_width_m; actual_unit_height_m; forward_event_ID; corrective_event_ID; unit_state_event_IDs; opening_processed_WIP; processed_receipts; processed_exits; closing_processed_WIP; carrying_burden_link; material_pool_ID; actual_original_upstream_burden_per_matching_unit; original_gross_draw_material_burden; actual_usable_exit_quantity; survey_opening_unit_IDs; survey_receipt_unit_IDs; survey_closing_unit_IDs; survey_supplier_return_unit_IDs; survey_external_transfer_unit_IDs; measured_complete_or_collected_composite_mass_kg; documented_actual_complete_build_kg_per_m2; discarded_unit_ID; actual_net_discarded_mass_j; site_id; actual_build; complete_unit_mass_where_needed; mass_bridge_source; opening_intact_unissued_quantity; receipts; closing_intact_unissued_quantity; usable_return_ids; external_transfer_ids; quarantine_ids; wip_ids; custodian; event_timestamp"
      collection_method: "Measure unit face area from actual width and height once per unit. Calculate physical gross IGU draw as opening intact unissued area plus receipt area minus closing intact unissued area, without subtracting usable exits. Separately sum mutually exclusive usable supplier-return and external-transfer areas, actual forward-handoff event areas and incoming discarded-unit masses. Weigh composite discarded units or use actual same-build mass/area evidence. Match unit IDs across all states and divide each attributable quantity by A. Stable-key mapping: For every unit, actual_unit_area = actual_unit_width_m * actual_unit_height_m. survey_opening_intact_unissued_area, survey_igu_receipt_area and survey_closing_intact_unissued_area are sums over their named exclusive unit-ID sets. survey_unused_supplier_return_area and survey_unused_external_transfer_area are separate actual usable-exit set sums; survey_usable_exit_area is their sum. survey_forward_area sums distinct forward_event_ID unit areas. actual_discarded_unit_area sums discarded_unit_ID actual areas; survey_discarded_igu_kg is actual complete/composite weighed mass or actual_discarded_unit_area times the evidenced actual complete-build kg/m2. gross_igu_draw comes from igu_stock_draw. Stockburden aliases refer only to this actual Area/m2 pool and its original upstream dataset. No count/area-to-mass factor is inferred from a different IGU build. Field definitions: site_id = site; lot_id = lot; producing_node = node; period_id = period; unit_ID = unit ID; actual_build = actual build; actual_unit_width_m = width; actual_unit_height_m = height; complete_unit_mass_where_needed = complete-unit mass where needed; mass_bridge_source = mass-bridge source; opening_intact_unissued_quantity = opening intact unissued quantity; receipts = receipts; closing_intact_unissued_quantity = closing intact unissued quantity; usable_return_ids = usable return IDs; external_transfer_ids = external-transfer IDs; quarantine_ids = quarantine IDs; wip_ids = WIP IDs; forward_event_ID = forward transfer ID; discarded_unit_ID = discarded-unit ID; custodian = custodian; event_timestamp = timestamps."
      unit: "m2; kg"
      frequency: "each receipt, stock boundary, transfer or rejection event"
      temporal_coverage: "all receiving periods contributing to this lot and linked opening/closing WIP"
      site_scope: "survey custody at actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier labels and build certificate; stock count; dimensional record; scale/tare or exact-build bridge; transfer/waste receipt; exclusive state ledger"
    - protocol_id: cp_survey_packaging
      process_id: "survey"
      flow_role: "discarded transport packaging"
      record_type: "segregation and waste weighing"
      raw_fields: "lot_id; period_id; event_ID; producing_node; material_pool_ID; gross_packaging_kg; tare_packaging_kg; packaging_driver_by_consumer; packaging_complete_driver_total; actual_net_discarded_mass_j; unit_shipment; material; rack_owner; packaging_state; gross_and_tare_mass; reusable_return_quantity; waste_custodian; event_timestamp; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Separate discarded actual packaging by material and state, weigh net waste and exclude returned racks or reusable packaging from waste. Attribute shared shipment packaging by an evidenced physical driver over all covered units, preserve owner and destinations, and divide each waste amount by A. Stable-key mapping: survey_discarded_packaging_kg is the sum of actual_net_discarded_mass_j for this survey lot. Exclude returned racks before summation; retain distinct material/state j and complete shipment attribution evidence rather than assuming a kg-per-IGU packaging factor. Field definitions: lot_id = lot; unit_shipment = unit shipment; material = material; rack_owner = rack owner; packaging_state = packaging state; gross_and_tare_mass = gross and tare mass; reusable_return_quantity = reusable return quantity; waste_custodian = waste custodian; event_ID = event ID; event_timestamp = date. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable.