      collection_method: "Read the own-node meter and subtract start from end for each actual period, with documented unit conversion. For a genuinely shared meter record the total once and use direct submetering first; otherwise collect positive complete causal weights for all consumers and calculate this node share as total times its weight divided by complete total weight. Reconcile all shares to the once-counted total, exclude energy already contained in charged service scope, sum this node and lot shares across periods, and divide by A. Stable-key mapping: Map original MJ to actual_kwh by energy_unit_conversion; actual recorded kWh is preserved. Select exactly one mode per master_period_ID across all overlapping nodes: direct_complete uses actual direct_node_kwh and adds no full-master allocation; shared_full uses node_kwh from shared_power_attribution over the complete consumer set and adds no overlapping direct quantity. Partial direct plus a full-master share is forbidden, and a partial-direct/residual method is not declared here. If direct coverage is incomplete, use a complete evidenced shared_full method without separately adding the partial meters, or retain a data gap. own_node_period_kwh aliases the selected direct_node_kwh or node_kwh only. accept_attributed_kwh sums selected own_node_period_kwh across actual included intervals after removing any already bundled energy. Complete shared weights have a positive sum and all shares reconcile to the once-counted master total. Field definitions: lot_id = lot; producing_node = node; period_id = period; supplier = supplier; voltage = voltage; technology_mix = technology/mix; meter_ID = meter ID; start_end_readings = start/end readings; original_energy_unit = original energy unit; direct_attributable_kwh = direct attributable kWh; shared_total_event_id = shared-total event ID; complete_consumer_list = complete consumer list; actual_causal_weight_per_consumer = actual causal weight per consumer; total_weight = total weight; allocated_share = allocated share; service_bundle_boundary = service bundle boundary."
      unit: "kWh; original MJ if used"
      frequency: "each meter period and changed shared-consumer set"
      temporal_coverage: "every included accept and correction period"
      site_scope: "actual accept activity plus full external consumer set for a shared total"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration/readings; supplier invoice; complete consumer weights and rationale; unit conversion; bundle-scope check; allocation closure"
    - protocol_id: cp_accept_service
      process_id: "accept"
      flow_role: "accept contracted access/equipment/storage availability"
      record_type: "contract, invoice and availability attribution"
      raw_fields: "lot_id; period_id; event_ID; producing_node; provider_id; asset_service_ID; contract_ID; recorded_actual_paid_hours; billed_days; documented_contract_hours_per_day; actual_node_contract_weight; actual_contract_weights_of_all_consumers; paid_idle_hours; contract_accounting_mode; provider; asset_service_identity; scope_and_bundled_energy_operator; actual_start_end; billed_unit; actual_paid_hours_or_contract_specific_hours_per_day; master_event_id; all_consumer_periods; reserved_availability_or_causal_weights; complete_positive_weight_sum; node_share; correction_use; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Inspect each actual provider contract and its scope. Collect paid availability including idle time in actual hours; convert a billed day only with the contract-specific time basis. For a shared availability period, enumerate all node/job/period consumers, collect actual reserved-availability or other justified contract drivers with positive complete denominator, and assign the once-recorded total proportionally. Reconcile every consumer share to the total and avoid duplicate bundled burdens. Sum only this node/lot shares over all real periods and divide by A. Stable-key mapping: actual_contract_hours comes from contract_hours_conversion using the actual recorded hours or actual billed days times documented contract-specific hours per day. For a direct own-node contract own_node_attributed_paid_hours aliases actual_contract_hours. For a shared contract it aliases node_service_hours from shared_service_attribution, with complete positive weight denominator and no additional whole-invoice or direct charge for the same quantity. accept_attributed_contract_hours sums actual own_node_attributed_paid_hours across included periods. Availability weights retain paid idle and actual reservation responsibility; they do not silently substitute productive tool time or invent a shift. Field definitions: lot_id = lot; producing_node = node; provider = provider; asset_service_identity = asset/service identity; contract_ID = contract ID; scope_and_bundled_energy_operator = scope and bundled energy/operator; actual_start_end = actual start/end; billed_unit = billed unit; actual_paid_hours_or_contract_specific_hours_per_day = actual paid hours or contract-specific hours-per-day; paid_idle_hours = paid idle hours; master_event_id = master event ID; all_consumer_periods = all consumer-periods; reserved_availability_or_causal_weights = reserved-availability or causal weights; complete_positive_weight_sum = complete positive weight sum; node_share = node share; correction_use = correction use. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity aliases this record independent physical quantity keyed by atomic_flow_row_id under the original CP method and atomic_child_normalization, never another parent quantity. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      unit: "h; original billed unit"
      frequency: "each contract/invoice period and consumer-set change"
      temporal_coverage: "every paid accept service period including idle and correction"
      site_scope: "actual accept use plus complete shared contract consumer set"
      aggregation_rule: "per reference flow"
      quality_evidence: "provider contract/invoice; actual hours-per-day evidence if relevant; paid idle and reserved-availability logs; complete weights; bundle declaration; allocation closure"
  calculation_rules:
    - id: atomic_child_normalization
      applies_to: "survey_shared_service_access; survey_shared_service_handling; survey_shared_service_storage; igu_packaging_timber; igu_packaging_pad; igu_packaging_mixed_protection; setting_blocks_support_setting_blocks; setting_blocks_edge_blocks; beads_fasteners_bead; beads_fasteners_fastener; glaze_shared_service_access; glaze_shared_service_handling; glaze_shared_service_tool; unused_glazing_component_return_setting_blocks_support_setting_blocks; unused_glazing_component_return_setting_blocks_edge_blocks; unused_glazing_component_return_gaskets_gaskets; unused_glazing_component_return_beads_fasteners_bead; unused_glazing_component_return_beads_fasteners_fastener; glazing_offcuts_gasket; glazing_offcuts_block; glazing_offcuts_bead; glazing_offcuts_fastener; cleanup_supplies_cloth; cleanup_supplies_agent; cleanup_supplies_protection; accept_shared_service_access; accept_shared_service_cleaning; unused_cleanup_material_return_cleanup_supplies_cloth; unused_cleanup_material_return_cleanup_supplies_agent; unused_cleanup_material_return_cleanup_supplies_protection; unused_cleanup_material_return_cleanup_water_cleanup_water; cleanup_waste_cloth; cleanup_waste_protection; cleanup_waste_residue"
      rule: "Record independent_physical_quantity separately by atomic_flow_row_id; actual_<row_id>_quantity is its named alias only, never a copied family amount. Materials retain original CP per-identity/state gross/net stock and outward-return conventions; transfers use actual paired custody quantity; usable exits and wastes use independent actual fate quantities. Number-of-items owned asset equivalents use this PCR original job_driver/full_life_driver complete-life fraction including manufacture, maintenance, replacement and end of life, with every consumer and a positive complete denominator. Duration/h service children instead use actual attributable job hours with the matching complete-life burden per hour; never multiply hours by the fraction again. Purchased services use only actual complete physical tasks whose real contract defines Item(s), with original actual attribution; hours, days and prices cannot become event counts. atomic_child_intensity = independent_physical_quantity / A, where A is unique finally accepted IGU unit face area in m2 from actual unit dimensions and IDs, counted once under the original acceptance rule; A=0 blocks normalization. Non-exchange parent role ledgers and original CP operands retain their stock, transfer, closure and ownership functions, without adding a second exchange or changing the method."
      inputs:
        - atomic_flow_row_id
        - independent_physical_quantity
        - exchange_property
        - exchange_unit
        - A
        - cp_survey_service
        - cp_survey_packaging
        - cp_glaze_materials
        - cp_glaze_service
        - cp_glaze_waste
        - cp_glaze_releases
        - cp_accept_materials
        - cp_accept_service
        - cp_accept_waste
        - cp_accept_releases
      output: "atomic_child_intensity"
      source_ids: []
    - id: accepted_unit_area
      applies_to: "reference_service"
      rule: "accepted_unit_area = actual_unit_width_m * actual_unit_height_m; A = sum accepted_unit_area over unique finally accepted unit IDs; A must be positive"
      inputs:
        - actual_unit_width_m
        - actual_unit_height_m
        - accepted_unit_ID
        - cp_accept_handoffs
      output: "A"
      source_ids: []
    - id: survey_interface_area
      applies_to: "frame_interface"
      rule: "surveyed_opening_intensity = surveyed_opening_area / A; preserve the receiving-interface area convention and assign no new-frame production from this documentary input"
      inputs:
