allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "survey; glaze; accept"
    rule: "Use node, lot, unit, material and event records to separate independently measured activity before attributing shared quantities. The installed service is the sole intended final output; no routine glazing co-product is assumed."
    source_ids: []
  - rule_id: allocation_shared_complete
    applies_to: "electricity and contracted services"
    rule: "Identify the actual shared asset/service, meter or invoice, period and every consumer. For electricity choose exactly one accounting mode for each overlapping master-meter period: direct records with complete included-node coverage, or full-master shared attribution across the complete consumer set. A direct quantity and a share of the same full master quantity are mutually exclusive. Partial direct-plus-master/residual accounting is not declared by this method. For contracts use actual direct records or one documented causal driver with positive total weight across the complete consumer set. Reconcile allocated quantities to the once-recorded total, including consumers outside this lot."
    source_ids: []
  - rule_id: allocation_paid_idle
    applies_to: "survey_shared_service_access; survey_shared_service_handling; survey_shared_service_storage; atomic_survey_shared_service; glaze_shared_service_access; glaze_shared_service_handling; glaze_shared_service_tool; atomic_glaze_shared_service; accept_shared_service_access; accept_shared_service_cleaning; atomic_accept_shared_service"
    rule: "Retain the full paid availability boundary, including paid idle time. For availability services, use actual reserved-availability hours or other evidenced contract drivers rather than deleting idle hours or automatically substituting productive tool time. Actual paid hours and weights are collected by node and period."
    source_ids: []
  - rule_id: allocation_bundle_boundary
    applies_to: "all purchased services"
    rule: "Inspect whether energy, operator, transport or equipment provision is included in the service dataset and invoice. Charge the documented scope once; do not also enter its fully included burdens as independent consumption. Disclose any independently metered excluded component."
    source_ids: []
  - rule_id: allocation_unused_material
    applies_to: "unused_igu_return; unused_glazing_component_return_setting_blocks_support_setting_blocks; unused_glazing_component_return_setting_blocks_edge_blocks; unused_glazing_component_return_gaskets_gaskets; unused_glazing_component_return_beads_fasteners_bead; unused_glazing_component_return_beads_fasteners_fastener; atomic_unused_glazing_component_return; unused_cleanup_material_return_cleanup_supplies_cloth; unused_cleanup_material_return_cleanup_supplies_agent; unused_cleanup_material_return_cleanup_supplies_protection; unused_cleanup_material_return_cleanup_water_cleanup_water; atomic_unused_cleanup_material_return"
    rule: "Preserve gross physical draw as the input and usable exit as a positive product output in the matching property/unit. Attribute only original unused-material upstream burden to an actual usable exit. Installation, receipt, handling, cleaning, access, idle and rework burdens remain assigned to the actual service lot. No avoided-production credit, negative exchange or second subtraction is permitted."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "accept_rework_return; glaze_rework_feed; rejected units"
    rule: "Preserve original component burden when intact units cross a rework handoff. Do not charge the same IGU manufacture again. Include every actual extra material draw, electricity use, inspection, access and correction activity until final acceptance. Discarded-unit and treatment burdens follow the actual producing node and declared treatment boundary."
    source_ids: []
  - rule_id: allocation_period_carry
    applies_to: "stock; WIP; accepted and terminated lots"
    rule: "Record the opening/closing period, unit/material state, carrying burden and responsibility for each pool. Charge a purchased material and each actual service event once. Carry unfinished work to the linked later lot instead of counting it as this period's accepted output. A later acceptance can carry earlier lot burdens once using the recorded linkage."
    source_ids: []
  - rule_id: allocation_accepted_denominator
    applies_to: "all normalized rows"
    rule: "Divide the attributable lot quantities by A only after separating outside-lot activity and documenting opening/closing WIP. Unique accepted area is the denominator; rejected, unused, held and repeated-pass area is excluded. No accepted area means no accepted-service dataset."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "waste and usable exits"
    rule: "Do not infer a recycled co-product or avoided virgin-production credit from a waste-dispatch label. Any recovery and treatment modelling requires actual destination, technology and a separately disclosed applicable upstream/downstream allocation method."
    source_ids: []
  - rule_id: allocation_rule_10
    applies_to: "foreground_burden_allocation"
    rule: "For material i at node n, physical gross draw G is opening intact unissued stock O plus receipts R minus closing intact unissued stock C. Its exclusive unused supplier return U and unused external transfer X are positive outputs. Net consumed G − U − X is a diagnostic and the basis for separating original unused-material burden; it is not another inventory input and is not a negative credit. Returned and transferred items are absent from C. Processed assemblies, offcuts, damaged units and WIP are not intact unissued stock. Reconcile the processing-state balance separately so that movement into WIP is never mistaken for a usable stock return. For mixed material or specification pools, maintain distinct balances and upstream factors before summation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_survey_interface
      process_id: "survey"
      flow_role: "received existing frame interface"
      record_type: "opening survey and release"
      raw_fields: "lot_id; period_id; event_ID; producing_node; opening_ID; actual_opening_width_m; actual_opening_height_m; interface_area_convention; site_id; frame_system; unit_outline_convention; actual_opening_dimensions; release_date; accepted_receiving_condition; compatibility_detail; defects; repair_exclusion_decision"
      collection_method: "Survey each physical opening and preserve its actual measured area convention and manufacturer-approved IGU interface. Link openings to unit IDs. Sum relevant surveyed opening area, retain unfinished/opening-state differences, and divide by A; do not add new-frame production burdens. Stable-key mapping: Map surveyed_opening_area to the sum of actual_opening_width_m * actual_opening_height_m for the declared interface convention. Retain the actual dimensions and mapped unit/opening IDs; this is an existing interface area, not purchased frame mass. Field definitions: site_id = site; lot_id = lot; opening_ID = opening ID; frame_system = frame system; unit_outline_convention = unit-outline convention; actual_opening_dimensions = actual opening dimensions; release_date = release date; accepted_receiving_condition = accepted receiving condition; compatibility_detail = compatibility detail; defects = defects; repair_exclusion_decision = repair-exclusion decision."
