      requirement: "The following routes each child to its original role, node, unique unit and method CP. Independently apply that original role measurement, stock, source/fate, rework, share, conversion and normalization method to each actual identity/state child. Retain the original helper/selector role parameter as legacy_parent_role, but supply quantity operands from this child independent records; ROW_UNIT(child_row_id) is the explicit unit below. Reconcile stocks/transfers only within the same identity/state and compatible native unit, grouping different materials, media, states and units separately. Parent totals are non-exchange diagnostics, never copied as child operands or summed across unlike units. Unsupported original-helper applicability or missing actual conversion, denominator or evidence blocks finalization; field records cannot choose a new method. Original role-named formula operands remain ledger names rather than duplicate exchanges. A cross-unit legacy role executes by this mapping and actual child unit instead of inheriting a wrong fixed unit. Routing: survey_shared_service_access => role=survey_shared_service, node=survey, property=Duration, unit=h, CP=cp_survey_service; survey_shared_service_handling => role=survey_shared_service, node=survey, property=Duration, unit=h, CP=cp_survey_service; survey_shared_service_storage => role=survey_shared_service, node=survey, property=Duration, unit=h, CP=cp_survey_service; igu_packaging_timber => role=igu_packaging, node=survey, property=Mass, unit=kg, CP=cp_survey_packaging; igu_packaging_pad => role=igu_packaging, node=survey, property=Mass, unit=kg, CP=cp_survey_packaging; igu_packaging_mixed_protection => role=igu_packaging, node=survey, property=Mass, unit=kg, CP=cp_survey_packaging; setting_blocks_support_setting_blocks => role=setting_blocks, node=glaze, property=Mass, unit=kg, CP=cp_glaze_materials; setting_blocks_edge_blocks => role=setting_blocks, node=glaze, property=Mass, unit=kg, CP=cp_glaze_materials; beads_fasteners_bead => role=beads_fasteners, node=glaze, property=Mass, unit=kg, CP=cp_glaze_materials; beads_fasteners_fastener => role=beads_fasteners, node=glaze, property=Mass, unit=kg, CP=cp_glaze_materials; glaze_shared_service_access => role=glaze_shared_service, node=glaze, property=Duration, unit=h, CP=cp_glaze_service; glaze_shared_service_handling => role=glaze_shared_service, node=glaze, property=Duration, unit=h, CP=cp_glaze_service; glaze_shared_service_tool => role=glaze_shared_service, node=glaze, property=Duration, unit=h, CP=cp_glaze_service; unused_glazing_component_return_setting_blocks_support_setting_blocks => role=unused_glazing_component_return, node=glaze, property=Mass, unit=kg, CP=cp_glaze_materials; unused_glazing_component_return_setting_blocks_edge_blocks => role=unused_glazing_component_return, node=glaze, property=Mass, unit=kg, CP=cp_glaze_materials; unused_glazing_component_return_gaskets_gaskets => role=unused_glazing_component_return, node=glaze, property=Mass, unit=kg, CP=cp_glaze_materials; unused_glazing_component_return_beads_fasteners_bead => role=unused_glazing_component_return, node=glaze, property=Mass, unit=kg, CP=cp_glaze_materials; unused_glazing_component_return_beads_fasteners_fastener => role=unused_glazing_component_return, node=glaze, property=Mass, unit=kg, CP=cp_glaze_materials; glazing_offcuts_gasket => role=glazing_offcuts, node=glaze, property=Mass, unit=kg, CP=cp_glaze_waste; glazing_offcuts_block => role=glazing_offcuts, node=glaze, property=Mass, unit=kg, CP=cp_glaze_waste; glazing_offcuts_bead => role=glazing_offcuts, node=glaze, property=Mass, unit=kg, CP=cp_glaze_waste; glazing_offcuts_fastener => role=glazing_offcuts, node=glaze, property=Mass, unit=kg, CP=cp_glaze_waste; cleanup_supplies_cloth => role=cleanup_supplies, node=accept, property=Mass, unit=kg, CP=cp_accept_materials; cleanup_supplies_agent => role=cleanup_supplies, node=accept, property=Mass, unit=kg, CP=cp_accept_materials; cleanup_supplies_protection => role=cleanup_supplies, node=accept, property=Mass, unit=kg, CP=cp_accept_materials; accept_shared_service_access => role=accept_shared_service, node=accept, property=Duration, unit=h, CP=cp_accept_service; accept_shared_service_cleaning => role=accept_shared_service, node=accept, property=Duration, unit=h, CP=cp_accept_service; unused_cleanup_material_return_cleanup_supplies_cloth => role=unused_cleanup_material_return, node=accept, property=Mass, unit=kg, CP=cp_accept_materials; unused_cleanup_material_return_cleanup_supplies_agent => role=unused_cleanup_material_return, node=accept, property=Mass, unit=kg, CP=cp_accept_materials; unused_cleanup_material_return_cleanup_supplies_protection => role=unused_cleanup_material_return, node=accept, property=Mass, unit=kg, CP=cp_accept_materials; unused_cleanup_material_return_cleanup_water_cleanup_water => role=unused_cleanup_material_return, node=accept, property=Mass, unit=kg, CP=cp_accept_materials; cleanup_waste_cloth => role=cleanup_waste, node=accept, property=Mass, unit=kg, CP=cp_accept_waste; cleanup_waste_protection => role=cleanup_waste, node=accept, property=Mass, unit=kg, CP=cp_accept_waste; cleanup_waste_residue => role=cleanup_waste, node=accept, property=Mass, unit=kg, CP=cp_accept_waste"
      evidence: "actual_child_register; legacy_parent_role; atomic_flow_row_id; independent_physical_quantity; exchange_unit; original_protocols"
    - id: atomic_range_noninheritance
      applies_to: "survey_shared_service_access; survey_shared_service_handling; survey_shared_service_storage; igu_packaging_timber; igu_packaging_pad; igu_packaging_mixed_protection; setting_blocks_support_setting_blocks; setting_blocks_edge_blocks; beads_fasteners_bead; beads_fasteners_fastener; glaze_shared_service_access; glaze_shared_service_handling; glaze_shared_service_tool; unused_glazing_component_return_setting_blocks_support_setting_blocks; unused_glazing_component_return_setting_blocks_edge_blocks; unused_glazing_component_return_gaskets_gaskets; unused_glazing_component_return_beads_fasteners_bead; unused_glazing_component_return_beads_fasteners_fastener; glazing_offcuts_gasket; glazing_offcuts_block; glazing_offcuts_bead; glazing_offcuts_fastener; cleanup_supplies_cloth; cleanup_supplies_agent; cleanup_supplies_protection; accept_shared_service_access; accept_shared_service_cleaning; unused_cleanup_material_return_cleanup_supplies_cloth; unused_cleanup_material_return_cleanup_supplies_agent; unused_cleanup_material_return_cleanup_supplies_protection; unused_cleanup_material_return_cleanup_water_cleanup_water; cleanup_waste_cloth; cleanup_waste_protection; cleanup_waste_residue"
      requirement: "Retired parent numerical ranges, per-exchange screening instructions and rationales are retained only in implementation audit, applying to neither new child exchanges nor parent-family sums and never proportionally allocated. Each new child has independent evidence needs for actual quantity, identity/state, measurement/conversion, uncertainty and comparable independent observations. Add its own interval only after review confirms applicability to this independent object; never validate a batch with its own maximum. Original ranges of unchanged semantically compatible atomic objects retain their original status."
      evidence: "independent_child_measurement; independent_range_evidence; implementation_range_audit"
    - id: atomic_paired_quantity_provenance
      applies_to: "actual internal child source and recipient transfers"
      requirement: "Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      evidence: "source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
validation_rules:
  - rule_id: validate_dry_scope
    applies_to: "product category and lot"
    rule: "Verify actual received frames, finished factory IGUs, preformed dry gaskets and mechanical retention. Reject a scope that silently performs frame repair, field IGU alteration, wet/structural silicone or fire glazing."
    source_ids:
      - pilkington-general-glazing-2013
  - rule_id: validate_project_details
    applies_to: "support, gasket, retention and drainage acceptance"
    rule: "Use the actual approved IGU/frame-system requirements and compatibility evidence. The monolithic-glass dimensions in ATS-192 must not become default IGU limits; no universal block, pressure or drainage values are inferred."
    source_ids:
      - pilkington-general-glazing-2013
  - rule_id: validate_reference_area
    applies_to: "reference_service"
    rule: "Require positive A from unique finally accepted actual unit outline areas. Confirm the reference_service name, Area/m2 and 1 m2 amount; exclude pane/face multiplication, visible-only convention without conversion, rejected/held units and repeat inspections."
    source_ids: []
  - rule_id: validate_forward_handoffs
    applies_to: "accepted_igus; glaze_feed; retained_glazing; accept_feed"
    rule: "Match counterpart event/unit IDs, area, state and period; reconcile actual mismatches with stocks/WIP, never by replacing actual intermediate feed with 1 m2."
    source_ids: []
  - rule_id: validate_corrective_handoffs
    applies_to: "accept_rework_return; glaze_rework_feed"
    rule: "Activate only for actual intact corrective returns. Match counterpart event/unit IDs and area; carry original material burden without new manufacture and retain each actual extra material/service event."
    source_ids: []
  - rule_id: validate_own_node_discards
    applies_to: "survey_rejected_igu_waste; broken_igus; accept_rejected_igu_waste"
    rule: "Verify actual origin node, unit/build, complete composite mass or exact-build bridge, rejected state and real waste custodian. No intact usable return or unresolved hold can be disguised as waste, and no late discard can be assigned to a prior node for convenience."
    source_ids: []
  - rule_id: validate_physical_draw
    applies_to: "material inputs and usable exit cards"
    rule: "Recalculate opening plus receipts minus closing intact unissued stock as physical gross draw, including actual usable boundary exits. Confirm positive same-property exits and exclusive states; any net diagnostic must not also reduce physical input or create a credit."
    source_ids: []
  - rule_id: validate_unused_burden
    applies_to: "usable outputs"
    rule: "Transfer only evidenced original unused-material burden. Do not transfer service, idle, inspection, correction or installation burdens, and do not claim avoided manufacture."
    source_ids: []
  - rule_id: validate_mass_conversions
    applies_to: "all kg material and rejected-unit flows"
    rule: "Confirm actual weighing/tare or same-grade/item/complete-build conversion. Retain IGU usable exits as Area/m2; a kg waste counterpart requires its independently supported complete-unit mass bridge."
    source_ids: []
  - rule_id: validate_water_pools
    applies_to: "cleanup_water; cleanup_supplies_cloth; cleanup_supplies_agent; cleanup_supplies_protection; atomic_cleanup_supplies; cleanup_waste_cloth; cleanup_waste_protection; cleanup_waste_residue; atomic_cleanup_waste; cleanup_wastewater; accept_water_vapour"
    rule: "Reconcile actual available water and exclusive wastewater, wipe, retained, unused-exit and evidenced-vapour fates within quantified uncertainty. Do not infer vapour from residuals or duplicate wet-wipe water as wastewater. Report an unclosed pool as incomplete."
    source_ids: []
  - rule_id: validate_electricity
    applies_to: "each own-node electricity card"
    rule: "Require node-owned metering or positive complete shared attribution with all consumers and periods, correct MJ/kWh handling, actual supplier/voltage and no overlapping bundled-service burden."
    source_ids: []
  - rule_id: validate_paid_service
    applies_to: "each own-node shared-service card"
    rule: "Require actual provider/asset/scope, actual paid contract hours including idle, contract-specific billed-day conversion, positive complete consumer weights and total closure; an assumed eight-hour day is invalid."
    source_ids: []
  - rule_id: validate_periods
    applies_to: "all node and stock records"
    rule: "Verify receiving, glazing, acceptance and correction period linkage; exclusive opening/closing intact stock and processed WIP; one-time carrying-burden attribution; no accepted denominator for a terminated unaccepted lot."
    source_ids: []
  - rule_id: validate_emission_identity
    applies_to: "atomic_glaze_other_releases; atomic_accept_other_releases; accept_water_vapour"
    rule: "Require known actual species, physical state where relevant, receiving compartment and measured or validated quantity basis. Unknown occurrence, species, medium or quantity remain data gaps; an umbrella label, missing captured waste and a water or stock residual are insufficient evidence. Exclude captured offcuts/dust from direct release and require each non-H2O event to use its actual own-node protocol."
    source_ids: []
  - rule_id: validate_range_evidence
    applies_to: "inventory ranges"
    rule: "Keep every provisional screen labelled reasoned_estimate and separate from real quantities. Investigate outliers using external or independent foreground evidence. The 1..1 final range represents A/A normalization only and proves no physical yield."
    source_ids: []
  - rule_id: validate_publication_completeness
    applies_to: "final downstream dataset"
    rule: "Report accepted inputs, performed checks, skipped checks, findings and completeness. Resolve actual exchange and support identities, material balances and review blockers before claiming a complete concrete dataset; an automated structural pass does not prove external identity or physical correctness."
    source_ids: []
