published_dataset_profile:
  dataset_role: "A foreground installation-service data package with node-resolved component, event, stock, WIP, service, correction and waste records; completed and verified projections may be used as secondary_dataset or background_dataset"
  downstream_use: "One dry-gasket IGU installation service per 1 m2 of accepted unit area at the stated received-frame and final-acceptance gates; may support downstream LCA process and lifecyclemodel datasets within the same declared boundary"
  allowed_use: "Matching actual IGU/frame-system dry installation with disclosed specifications, geography, period, upstream supply and service/access conditions; retain actual uncertainty and correction/waste treatment"
  excluded_use: "Whole-window manufacture; frame installation/repair; demolition/replacement including deglazing; wet or structural-silicone/fire glazing; field-altered IGUs; complete building-envelope performance; use-phase energy or lifetime benefit; unqualified transfer to a different area convention, component build or access system"
  required_metadata: "Site, geography and periods; lot and unique unit IDs; unit dimensions and area convention; received-frame gate; actual IGU build/orientation/coatings/seals; compatible blocks/gaskets/retention; actual new versus retained parts; final support/retention/drainage and clean/condition acceptance; supplier/technology/voltage; physical stock and usable exits; WIP and original-burden lineage; all correction events; shared asset/contract scope and full attribution; actual waste destinations; upstream dataset coverage; method and version"
  required_quality_disclosure: "Record and uncertainty coverage; independent mass bridges; exclusive water-fate closure and actual emission evidence; complete shared weights and paid idle treatment; unresolved identities or upstream mismatches; exclusions; provisional range status; checks performed/skipped and all remaining findings"
  update_trigger: "Changed IGU build, coating/seal or frame system; changed approved component or dry retention method; altered received or accepted gate; changed area convention; changed supplier/energy/service or access setup; new correction/rejection pattern; changed reporting/WIP boundary; new measured evidence replacing provisional screens; revised manufacturer requirements"
data_sources:
  - id: "pilkington-general-glazing-2013"
    type: "handbook"
    reference: "Pilkington North America, Technical Information ATS-192, General glazing guidelines, 2013-01-02, eight pages; https://www.pilkington.com/-/media/pilkington/site-content/usa/window-manufacturers/technical-bulletins/ats192generalglazingguidelines2013102.pdf; read 2026-10-12"
    used_for: "Finished-edge protection and no field cutting/seaming/grinding; dry-system support and edge blocking; compatible resilient materials; drainage and glass protection; product/system-specific acceptance responsibilities. Its annealed-monolithic-glass dimensional table is not a default IGU specification. It supplies no inventory consumption, loss, power or service-hour ranges here."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:2a27741eb69399da52f7ca57b6fc42961f995413ca4cc27472d5ea87c3fa35b1"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_9602"
      family: "system_boundary"
      span:
        start:
          offset: 9602
          line: 64
          column: 1
        end:
          offset: 16301
          line: 89
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Existing compatible frames are complete and released for glazing; factory sealed IGUs arrive in their supplied condition; newly drawn glazing and cleaning materials are separately identified |\n| starting_condition_role | Accepted installed receiving interface and finished component supply; not a zero-burden declaration for newly purchased IGUs or consumables |\n| product_classification_scope | Installation service using dry gaskets and mechanical retention, bounded as stated in Sections 1 and 2 |\n| recursive_input_rule | An earlier installation service or existing installed frame is a disclosed received condition. Do not recursively charge the same accepted installation or frame production through the interface card. Any purchased distinct service is linked once to its actual supplier and scope. |\n| upstream_dataset_requirement | Link the actual factory IGU build and each newly drawn material to a compatible upstream dataset once; record actual electricity and contracted-service supply; separate component manufacture from foreground installation; disclose unresolved matches |\n| disclosure | Report received-frame release, supplier and component specifications, every node and period, access/service boundary, physical draw and usable exits, internal/WIP balances, rejected-unit fates, correction visits, shared-attribution decisions and exclusions |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| `scope_eligibility` | foreground_system_boundary | This methodology covers installing factory sealed insulating glass units into an existing compatible frame that has already been released for glazing. The installer receives the frame interface and finished units, verifies suitability and condition, seats the units on the actual specified support and edge blocks, fits preformed dry gaskets and mechanical retention, and hands over clean, undamaged, inspected glazing with the intended drainage path available. The declared service includes the actual handling, access, correction, consumable use and waste arising between that received condition and the accepted installation gate. Manufacturer guidance supports protection of finished edges, compatible resilient materials, support and drainage as distinct installation responsibilities. [Source: `pilkington-general-glazing-2013`] The category excludes manufacture of the IGU, new frame installation, frame repair, removal or demolition of previous glazing, wet bedding or site applied wet sealant glazing, structural silicone bonding, fire resistant glazing systems, and field cutting, seaming or grinding of an IGU. A project requiring any of these operations needs a separately declared foreground boundary; it must not be made to fit this category by omitting an operation. Factory edge seals integral to a supplied IGU remain part of that supplied component and do not turn this installation into a structural silicone route. The qualifying route is determined by the actual system documentation. A polymeric preformed gasket or block may be used only when approved for the actual IGU seals, coatings and frame system. A material example in a general guide is not a bill of materials. No universal glass thickness, pane configuration, edge clearance, block geometry, gasket pressure, drainage-hole count or installed service life is imposed here. In particular, the dimensional table for annealed monolithic glass in ATS-192 is not an IGU specification. The actual approved project details govern acceptance. [Source: `pilkington-general-glazing-2013`] | `pilkington-general-glazing-2013` |\n| `boundary_received_frame` | survey | Include condition and compatibility inspection of the existing frame. The frame_interface card represents the received installation interface; its area must not create new-frame manufacturing or frame-installation burdens. A frame requiring repair is outside this lot's qualifying starting condition. | `pilkington-general-glazing-2013` |\n| `boundary_factory_unit` | survey; glaze | Receive finished factory IGUs by actual build and ID; include handling and protection; do not cut, seam or grind finished units to correct a mismatch. | `pilkington-general-glazing-2013` |\n| `boundary_dry_joining` | glaze | Include actual IGUs, compatible support and edge blocks, preformed gaskets, and new mechanical retention parts where drawn. Identify existing retained parts without treating them as new purchased inputs. Support, gasket fit, edge protection and drainage are installation responsibilities. | `pilkington-general-glazing-2013` |\n| `boundary_stage_gates` | survey; glaze; accept | Record survey release, retained-but-unaccepted glazing and final acceptance as separate gates. Only the last is the reference service; actual intermediate and reverse transfers remain internal handoffs. | `pilkington-general-glazing-2013` |\n| `boundary_own_node_rejects` | survey; glaze; accept | A discarded unit belongs to the node that actually damaged or rejected and dispatched it. Distinguish incoming damaged composite IGUs, glazing breakage, final-inspection damage, usable unprocessed exits and intact corrective returns. Every reject has an ID, quantity, custodian or rework destination and event date. | `pilkington-general-glazing-2013` |\n| `boundary_periods` | all foreground nodes | Enumerate receiving/storage, glazing, inspection/cleaning and correction periods through first acceptance. Include opening and closing WIP and paid service periods. Later use, routine maintenance and post-acceptance replacement are outside this service lot. A terminated lot with no accepted area cannot be normalized into an accepted service. |  |\n| `boundary_shared_services` | survey; glaze; accept | Include actual handling/access/tool/storage service and power serving the included work. List every consumer and relevant period of a shared asset, including other jobs when they share the measured total. A service dataset that already includes its energy or operator must not be combined with duplicate separate burdens. |  |\n| `boundary_water_and_emissions` | glaze; accept | Separate supplied cleaning water and materials from collected waste/wastewater and actual substance-specific releases. Weather water and building runoff are not cleaning inputs. Report exclusive accept water fates and measured or independently evidenced own-glaze/own-accept direct releases by actual substance/particle basis and receiving compartment. Incidental component-fitting emissions are conditional actual events, not inferred offcut deficits. | `pilkington-general-glazing-2013` |\n\n"
