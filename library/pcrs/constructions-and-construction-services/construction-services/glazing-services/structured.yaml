      collection_method: "Read the own-node meter and subtract start from end for each actual period, with documented unit conversion. For a genuinely shared meter record the total once and use direct submetering first; otherwise collect positive complete causal weights for all consumers and calculate this node share as total times its weight divided by complete total weight. Reconcile all shares to the once-counted total, exclude energy already contained in charged service scope, sum this node and lot shares across periods, and divide by A. Stable-key mapping: Map original MJ to actual_kwh by energy_unit_conversion; actual recorded kWh is preserved. Select exactly one mode per master_period_ID across all overlapping nodes: direct_complete uses actual direct_node_kwh and adds no full-master allocation; shared_full uses node_kwh from shared_power_attribution over the complete consumer set and adds no overlapping direct quantity. Partial direct plus a full-master share is forbidden, and a partial-direct/residual method is not declared here. If direct coverage is incomplete, use a complete evidenced shared_full method without separately adding the partial meters, or retain a data gap. own_node_period_kwh aliases the selected direct_node_kwh or node_kwh only. survey_attributed_kwh sums selected own_node_period_kwh across actual included intervals after removing any already bundled energy. Complete shared weights have a positive sum and all shares reconcile to the once-counted master total. Field definitions: lot_id = lot; producing_node = node; period_id = period; supplier = supplier; voltage = voltage; technology_mix = technology/mix; meter_ID = meter ID; start_end_readings = start/end readings; original_energy_unit = original energy unit; direct_attributable_kwh = direct attributable kWh; shared_total_event_id = shared-total event ID; complete_consumer_list = complete consumer list; actual_causal_weight_per_consumer = actual causal weight per consumer; total_weight = 