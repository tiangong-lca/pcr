system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers one bounded regravelling repair contract on an existing structurally suitable, non-elevated unbound natural-gravel road. Scarify and reshape the retained surface, eliminate relevant potholes/rutting/high shoulders, restore the specified crown and drainage, then supply, equalize and spread specified natural wearing-course aggregate. Include moisture conditioning and mechanical compaction when used by the actual approved method, finish and hand over the identified chainages. FHWA sections 3.18–3.21 explain this sequence; their illustrative quantities are not universal specifications. Exclude new road formation, structural subgrade reconstruction, asphalt/concrete surfacing, chemical stabilization or dust binders, recycled-asphalt/contaminated aggregate routes, new bridges/tunnels/culverts, traffic operation and a recurring maintenance programme. Required local roadside drainage correction belongs to this repair or to a documented, non-overlapping owner. A structurally unsuitable host is outside this route, rather than concealed by new gravel."
      source_ids: []
    - rule_id: bounded_host
      applies_to: "prepare_host"
      rule: "Original host construction is outside this incremental repair. Include actual scarification, reshaping, relevant drainage correction and handling/removal; on-site retained material is not a free purchased input or negative waste."
      source_ids:
        - fhwa-gravel-2015
    - rule_id: physical_gates
      applies_to: "prepare_host; regravel_finish"
      rule: "Preparation hands off the same identified in-situ road only after crown/drainage and distress correction meet actual criteria. Placement finishes the new layer on that parent state. Records/receipts are evidence, not additional process outputs."
      source_ids:
        - fhwa-gravel-2015
    - rule_id: supply_ownership
      applies_to: "regravel_finish"
      rule: "Include upstream specified aggregate production and all actual inbound/return/waste and equipment/water logistics once under the whole-repair lead ledger. Do not repeat quarry processing or supplier-included haul as foreground operation. Receipts are gross; retain closing stock with carried-forward burden, separate true outward returns."
      source_ids:
        - fhwa-gravel-2015
    - rule_id: asset_boundary
      applies_to: "prep_plant_grader; prep_plant_scarifier; prep_plant_drainage_machine; prep_plant_traffic_control; prep_plant_tool; atom_req_prepare_host_prep_plant actual-child group; finish_plant_grader; finish_plant_water_bowser; finish_plant_roller; finish_plant_traffic_control; finish_plant_tool; atom_req_regravel_finish_finish_plant actual-child group"
      rule: "For each shared grader, roller, bowser and traffic-control tool identify both nodes and other jobs/reporting periods. Cover manufacture, mobilization, use/maintenance, replacement and end-of-life through actual provider scope or a complete-life asset ledger; disclose gaps instead of assigning an arbitrary lifetime."
      source_ids: []
    - rule_id: water_release
      applies_to: "regravel_finish"
      rule: "Separate purchased water from actual environmental abstraction and internal reuse. Record captured runoff/wastewater by actual custody; record only actual water/substances reaching their stated receiving medium as elementary releases."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Qualified existing unbound natural-gravel road, with recorded distress, crown/drainage and structural suitability; supplied new aggregate at its declared upstream gate"
  starting_condition_role: "Retained host and its on-site stock, not newly procured aggregate or a newly constructed road output"
  product_classification_scope: "Bounded repair subset of non-elevated road construction service; no automatic whole-road construction scope"
  recursive_input_rule: "A prior road repair dataset may document retained condition but is not a new same-category purchase. Record actual subcontracted preparation at its real interface once, with an explicit owner and included/excluded burdens."
  upstream_dataset_requirement: "Actual aggregate supply, energy, logistics and plant/support data at matching gates and units, with coverage of production and relevant lifecycle burdens; missing coverage remains a data gap"
  disclosure: "Declare repair chainages/periods, retained host boundary, drainage ownership, supplier haul coverage, actual rework/exits, stock carry-forward and plant lifecycle attribution; no avoided-replacement credit"
