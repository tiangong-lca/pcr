    required_unit: "Item(s)"
    rule: "Use 1 Item(s) only for the declared accepted contract segment, never one kilometre or one tonne of gravel. Record actual area, length, thickness and acceptance under cp_accepted_regravelling; geometry intensities are derived disclosures."
  - id: aggregate_state
    applies_to: "new_aggregate; aggregate_return; rejected_layer"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep received gross wet mass, installed material, actual return and closing stock separately; record moisture and any dry-mass conversion from the same lot. Loose volume is not finished volume; measure density/state before conversion."
  - id: native_service_units
    applies_to: "prep_plant_grader; prep_plant_scarifier; prep_plant_drainage_machine; prep_plant_traffic_control; prep_plant_tool; atom_req_prepare_host_prep_plant actual-child group; finish_plant_grader; finish_plant_water_bowser; finish_plant_roller; finish_plant_traffic_control; finish_plant_tool; atom_req_regravel_finish_finish_plant actual-child group; atom_req_regravel_finish_aggregate_haul actual-child group; finish_water_product; atom_req_regravel_finish_finish_water_abstraction actual-child group; prep_electricity; finish_electricity"
    required_property_ref:
