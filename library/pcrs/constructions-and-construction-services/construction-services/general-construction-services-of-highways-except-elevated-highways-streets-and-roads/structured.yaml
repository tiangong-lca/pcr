validation_rules:
  - rule_id: atom_req_regravel_finish_nonburned_fuel_fates_complete
    applies_to: "regravel_finish"
    rule: "At regravel_finish, independently collect all actual unused fuel outward returns/other-owner transfers, carried or recovered closing stock, contained nonburned waste, cleanup carriers and actual uncontained species/medium fates. Index actual fuel grade, event/period, source and owner, source fuel-component kg and measured whole physical carrier quantity in one explicit exchange unit. A whole contaminated liquid/absorbent carrier and its included fuel/substances are nonadditive views, not duplicate waste exchanges. Unknown actual grade, carrier, substance, medium, quantity, destination or scope is incomplete; never infer combustion, absence or zero. Link cp_atom_req_regravel_finish_nonburned_fuel_fates to the corresponding supply S and independently burned B, actual receiver/transport leg owner and all original stock/provider rules. Only actual outward custody is an outlet; recovered internal/closing fuel is not also a return or waste."
    source_ids: []
  - rule_id: atom_req_prepare_host_nonburned_fuel_fates_complete
    applies_to: "prepare_host"
    rule: "At prepare_host, independently collect all actual unused fuel outward returns/other-owner transfers, carried or recovered closing stock, contained nonburned waste, cleanup carriers and actual uncontained species/medium fates. Index actual fuel grade, event/period, source and owner, source fuel-component kg and measured whole physical carrier quantity in one explicit exchange unit. A whole contaminated liquid/absorbent carrier and its included fuel/substances are nonadditive views, not duplicate waste exchanges. Unknown actual grade, carrier, substance, medium, quantity, destination or scope is incomplete; never infer combustion, absence or zero. Link cp_atom_req_prepare_host_nonburned_fuel_fates to the corresponding supply S and independently burned B, actual receiver/transport leg owner and all original stock/provider rules. Only actual outward custody is an outlet; recovered internal/closing fuel is not also a return or waste."
    source_ids: []
  - rule_id: host_gate
    applies_to: "prepare_host"
    rule: "Require initial suitability, actual scarification/shape/drainage correction and accepted pre-spread gate. Reject missing drainage ownership or structural unsuitability for this route."
    source_ids:
      - fhwa-gravel-2015
  - rule_id: repair_gate
    applies_to: "accepted_regravelling"
    rule: "Verify actual chainages, natural aggregate source/gradation/plasticity/moisture, uniform finished geometry, actual specified compaction/quality tests, weather and signed handover; no universal thickness, shrinkage or future-life assumption."
    source_ids:
      - fhwa-gravel-2015
  - rule_id: balance_paths
    applies_to: "all inventory rows"
    rule: "Check gross received/issued material and water balances with uncertainty, retained host treatment, internal reuse, real outward custody and closing stock; no duplicate stock/return or burden. Resolve every defect/retest/rework path before counting accepted output."
    source_ids: []
  - rule_id: asset_periods
    applies_to: "prep_plant_grader; prep_plant_scarifier; prep_plant_drainage_machine; prep_plant_traffic_control; prep_plant_tool; atom_req_prepare_host_prep_plant actual-child group; finish_plant_grader; finish_plant_water_bowser; finish_plant_roller; finish_plant_traffic_control; finish_plant_tool; atom_req_regravel_finish_finish_plant actual-child group"
    rule: "Check full shared-asset phase coverage, all consumers/reporting periods, utilization denominator, replacements/termination and single event ownership; missing lifecycle/support coverage blocks dataset finalization."
    source_ids: []
  - rule_id: identity_range
    applies_to: "all inventory rows"
    rule: "Expand conditional material/service/waste/substance requirements into actual distinct exchanges. Verify exact flow/property/unit identities and actual numerical uncertainty evidence for each; never equate generic dust with a particle fraction or fuel with exhaust. Missing data is explicit, not zero."
    source_ids: []
  - rule_id: atom_req_prepare_host_prep_plant_complete
    applies_to: "prepare_host"
    rule: "Before final foreground completion, execute cp_atom_req_prepare_host_prep_plant and atom_req_prepare_host_prep_plant: all actual children in this role require one concrete object/state/medium and one explicit exchange property/unit, independent original quantity and evidenced conversion if needed, exact identity/support and reconciled owner/stock/fate/transfer scope. Each group is separate; no heterogeneous sum, guessed absence, parent-total/Range copying or duplicate assembly/provider/carrier burdens. Unresolved evidence means incomplete; pcr:check does not automatically execute or prove actual site roster completion."
    source_ids: []
