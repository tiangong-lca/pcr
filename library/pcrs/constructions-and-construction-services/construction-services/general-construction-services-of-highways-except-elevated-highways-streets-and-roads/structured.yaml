      uuid: ""
    required_unit: "h; tkm; m3; kWh"
    rule: "Keep actual duration, freight, water-volume and electricity units; verify their support chains before dataset binding. Volume-to-mass requires measured lot water/material density with temperature and moisture basis; no count surrogate, universal shrinkage, fuel or emissions factor."
  - id: receipt_mass_basis
    applies_to: "new_aggregate; host_surplus; prep_removed_waste_sediment; prep_removed_waste_soil; prep_removed_waste_gravel; prep_removed_waste_debris; atom_req_prepare_host_prep_removed_waste actual-child group; aggregate_return; rejected_layer"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For receipts/issues and outward dispatch, gross means total material before netting returns or other outward transfers, after removing vehicle/container tare. Where gross_kg and tare_kg record weighed vehicle/container and tare, subtract tare_kg from gross_kg to obtain material mass for the balance; never enter gross vehicle mass as material. Retain scale accuracy and matched moisture/state."
