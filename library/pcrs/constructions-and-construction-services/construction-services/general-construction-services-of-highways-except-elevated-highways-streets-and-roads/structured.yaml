          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| single_repair | accepted_regravelling | One intended final repair service; rejected chainages are not accepted output. Retain all actual failed passes, rework, retests and their resources in the eventual accepted repair; no avoided-new-road or substitution credit. |  |\n| asset_attribution | prep_plant_grader; prep_plant_scarifier; prep_plant_drainage_machine; prep_plant_traffic_control; prep_plant_tool; atom_req_prepare_host_prep_plant actual-child group; finish_plant_grader; finish_plant_water_bowser; finish_plant_roller; finish_plant_traffic_control; finish_plant_tool; atom_req_regravel_finish_finish_plant actual-child group | Use actual asset logs to enumerate consuming nodes, other jobs and reporting periods. Allocate complete-life manufacture, maintenance/replacement and end-of-life burdens using justified measured service/utilization over the documented service boundary; retain idle/mobilization attribution and termination assumptions. Event/asset IDs have one owner. Provider service coverage and separately modelled plant/fuel must not overlap. Completed asset lives use observed historical service. An in-service asset may use evidence-based prospective remaining service, replacement/termination and end-of-life scenarios: distinguish forecasts from observations, disclose the complete-life utilization denominator, source, uncertainty/sensitivity and update trigger. Do not invent a future retirement date or default lifespan; missing justified full coverage or denominator, rather than continued operation, is the data gap. |  |\n| period_custody | all inventory rows | Link receipts/issues, host handoff, rework, returns, acceptance and asset replacements/termination to dated periods. Reconcile opening plus gross receipts with installation, outward returns/waste, measured losses and closing stock. Carry stock and its burden into later periods once; never net a return then record it again as outward flow. |  |\n| outward_material | host_surplus; aggregate_return; prep_removed_waste_sediment; prep_removed_waste_soil; prep_removed_waste_gravel; prep_removed_waste_debris; atom_req_prepare_host_prep_removed_waste actual-child group; rejected_layer | Classify each actual outward lot by legal custody and destination: usable product return/surplus versus waste versus actual environmental release. Recovery or sale does not establish automatic coproduct credit; disclose any chosen allocation with evidence and keep burdens/transport ownership closed. |  |\n| atom_grouped_ledgers | all actual-child records | Apply each existing formula only to its applicable role: material stock, asset lifecycle fraction/hourly provision, completed service event, internal transfer and species/fate calculations are distinct. Never apply material-stock or full-machine purchase equations to an asset share or service event. Within the applicable method group, use concrete child identity/material, state, one exchange property/unit, receiving medium and ownership/event scope. Native and converted views are nonadditive. A family diagnostic total is never a flow identity or every child numerator; keep incomplete portions explicit. Complete formulations, assemblies and genuinely bounded single-function services remain whole, with included constituents/resources not purchased again. |  |\n\n"
