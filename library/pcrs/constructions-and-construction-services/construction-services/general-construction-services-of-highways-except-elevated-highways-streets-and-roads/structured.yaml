  calculation_rules:
    - id: atom_final3_quantity_semantics
      applies_to: "all actual children and typed residual requirements"
      rule: "For each actual child, compute its own unnormalized numerator q_child by its stated role and one exchange unit before dividing once by N. Material stock supply S is attributed opening plus external net-tare receipts minus burden-carried closing, with the original single gross-with-outward-flows or consumed-only true usable-return convention; nonreturned waste/loss keeps upstream supply. Outward usable return, actual waste and internal handoff quantities are independently recorded, not the input S. An actual Count-equivalent asset child uses q_child=(actual job/node compatible driver / evidenced all-consumer complete-life same-driver denominator) Item(s), with full burden per complete asset Item(s); never one whole asset per job, a material-stock formula, a rental-hour/fee conversion or another life division. A current Duration/h service instead uses actual attributable service h and complete applicable burden per the same h, never multiplies its h by the asset fraction again; complete provider coverage is acceptable, actual missing phases/resources must be added once without hypothetical fuel/assets. A completed-service-event child uses only actual independently accepted physical results whose contract/reference really supports Item(s), never labour, fees, hours or count of reports as a proxy. Any incompatible native service contract stays unresolved under its requirement until an exact single-unit method is reviewed. Species/media release children require actual species-state-medium and independent measured or validated kg; a carrier total or unknown balance is not a release. H2O vapour specifically uses independently evidenced H2O kg to the applicable air compartment; water-volume raw ledgers require an actual compatible H2O-content/state/density bridge and remain nonadditive. For actual owned asset and provider service overlaps select one burden owner and one quantity view. N is the original positive count of unique finally accepted chainage-bounded repair contract segments. Repeated passes, interim handoffs, kilometres, tonnes and rejected chainages never increase N."
      inputs:
        - actual_child_row_id
        - q_child
        - one_exchange_unit
        - "original accepted denominator"
        - "original compatible node CP"
        - "actual source evidence"
      output: "q_child per original reference flow"
      source_ids: []
    - id: repair_normalization
      applies_to: "all inventory rows"
      rule: "Sum unique node-owned physical events including rework for this accepted contract segment; express amounts per reference flow. The regravel_finish lead logistics ledger owns each leg once through its producing-node/leg-owner matrix. Internal host transfers are paired, not duplicated final output."
      inputs:
        - "Node event IDs"
        - "contract acceptance"
        - "all node protocols"
      output: "Exchange amounts for the one declared accepted repair"
      source_ids: []
    - id: aggregate_reconcile
      applies_to: "new_aggregate; aggregate_return; rejected_layer"
      rule: "Reconcile opening stock plus gross receipts with installed material, actual outward usable returns, outward waste, supported losses and closing stock at matched moisture/state. Derive loose/compacted volume only with actual density; FHWA examples are not conversion factors."
      inputs:
        - cp_new_aggregate
        - cp_aggregate_return
        - cp_rejected_layer
        - "actual density/moisture tests"
      output: "Lot-specific material balance and carried-forward stock burden"
      source_ids:
        - fhwa-gravel-2015
    - id: service_attribution
      applies_to: "prep_plant_grader; prep_plant_scarifier; prep_plant_drainage_machine; prep_plant_traffic_control; prep_plant_tool; atom_req_prepare_host_prep_plant actual-child group; finish_plant_grader; finish_plant_water_bowser; finish_plant_roller; finish_plant_traffic_control; finish_plant_tool; atom_req_regravel_finish_finish_plant actual-child group"
      rule: "Assign complete-life shared asset burdens to actual node/job/period service using measured utilization and justified idle/mobilization/termination treatment; retain one event owner and no overlap with separately modelled fuel/energy/haul."
      inputs:
        - cp_prep_plant
        - cp_finish_plant
        - "full asset lifecycle ledger"
        - "all consumers/periods"
      output: "Attributable plant service and coverage gaps"
      source_ids: []
    - id: fuel_consumption
      applies_to: "atom_req_prepare_host_prep_fuel actual-child group; atom_req_regravel_finish_finish_fuel actual-child group"
      rule: "For each actual fuel grade, owner node and period, the upstream product supply S_kg is attributed opening fuel plus actual gross net-tare receipts/issues minus burden-carried closing fuel. Keep the original gross-with-real-outlets convention: usable outward returns and true other-owner transfers have their separately measured positive custody outlets and original carried burden, without a second deduction or avoided-production credit. Nonreturned unburned waste and uncontained losses remain in S, because they required upstream supply. Closing retained/recovered stock carries its burden forward and is not an outward outlet. Shared tanks/issues require a complete actual consumer/event ownership ledger including other jobs and all fates; other_job_kg cannot conceal this node losses or duplicate a provider-included fuel supply. Divide S only once by N unique finally accepted contract repair segments. S is not combustion activity. Independently measure actual burned fuel B_kg by calibrated engine/burner consumption evidence or a fully audited complete disjoint same-grade/owner balance: opening + gross receipts/issues = closing + B + usable outward returns + real other-owner transfers + contained nonburned waste + uncontained loss. Only a complete evidenced fate balance may derive B; an unknown difference or unmeasured spill is never inferred burn or zero. Total spill is an incident audit, not another ending pool; allocate recovered portions once to their actual final closing/return/waste fate, without subtracting the incident total again. Retain full repair campaign, idle/repeated preparation/spread/compaction, event/node/provider ownership and calibration/uncertainty. Volume-to-kg conversion requires actual same-grade/batch density value/unit/source, physical state, temperature/unit and measured volume units, exactly once. Fuel already included in a complete provider service is not a second local purchase or local emission owner."
      inputs:
        - cp_prep_fuel
        - cp_finish_fuel
        - "actual same-grade independently measured supply/burn and complete disjoint fate records"
      output: "Independent grade-specific upstream supplied S_kg and actual burned B_kg; actual outward/waste/release fates remain separately owned"
      source_ids: []
    - id: emission_calculation
      applies_to: "atom_req_prepare_host_prep_dust actual-child group; atom_req_prepare_host_prep_exhaust actual-child group; atom_req_regravel_finish_finish_dust actual-child group; atom_req_regravel_finish_finish_exhaust actual-child group"
      rule: "For combustion species, use independently measured actual burned fuel B_kg from the matching fuel-grade/engine/event/node protocol when the factor denominator is fuel mass; supplied product S_kg, total issued fuel and unknown loss are never substituted for B. For another stated factor basis use its independently measured compatible actual engine activity, or use measured species mass / measured species-rate times actual matching duration. Retain exact species/particle class, receiving medium, fuel/engine/control applicability, numerator/denominator units, source/version and propagated uncertainty. A complete species factor already expressing fossil CO2 or another species receives no extra carbon, fossil, oxidation, composition, fate or molecular multiplier. If a separately justified fossil-CO2 carbon balance is used instead, derive oxidized fossil-carbon kg from actual B and documented composition/basis; apply total-carbon fraction and fossil share of carbon once only where that basis needs them, and use oxidation fraction OR subtract independently evidenced retained/unoxidized fossil carbon once, never both for the same carbon. Convert oxidized fossil carbon to CO2 with sourced 44/12 once. This carbon conversion applies only to its identified CO2 species, not dust or other pollutants. Noncombustion dust uses its own actual material/activity/moisture/capture/fraction method. Unknown method/basis/fates remain incomplete; no upstream/provider emissions are duplicated as local release."
      inputs:
        - "Actual rate/duration or activity/factor and method reference"
        - "all four emission protocols"
      output: "Calculated actual campaign emissions with method/evidence gap disclosure"
      source_ids: []
    - id: water_balance
      applies_to: "finish_water_product; atom_req_regravel_finish_finish_water_abstraction actual-child group; captured_runoff; finish_water_release_h2o_vapour_air; atom_req_regravel_finish_finish_water_release actual-child group"
      rule: "Reconcile purchased/abstracted water, stock changes, new aggregate incoming moisture, retained-host initial/final moisture and actual influential rainfall/external run-on with retained moisture, captured outflow and substantiated releases. Weather/material moisture are measured balance terms, not extra purchases/credits. Internal reuse is paired; any missing term is a gap, never automatic evaporation. Use actual density/temperature for kg conversion."
      inputs:
        - cp_finish_water_product
        - cp_finish_water_abstraction
        - cp_new_aggregate
        - cp_captured_runoff
        - cp_finish_water_release
        - "host moisture and actual weather/run-on evidence"
      output: "Pathway quantities with uncertainty and unmatched balance gaps"
      source_ids: []
  data_quality_requirements:
    - id: atom_req_regravel_finish_nonburned_fuel_fates
      applies_to: "regravel_finish"
      requirement: "At regravel_finish, independently collect all actual unused fuel outward returns/other-owner transfers, carried or recovered closing stock, contained nonburned waste, cleanup carriers and actual uncontained species/medium fates. Index actual fuel grade, event/period, source and owner, source fuel-component kg and measured whole physical carrier quantity in one explicit exchange unit. A whole contaminated liquid/absorbent carrier and its included fuel/substances are nonadditive views, not duplicate waste exchanges. Unknown actual grade, carrier, substance, medium, quantity, destination or scope is incomplete; never infer combustion, absence or zero. Link cp_atom_req_regravel_finish_nonburned_fuel_fates to the corresponding supply S and independently burned B, actual receiver/transport leg owner and all original stock/provider rules. Only actual outward custody is an outlet; recovered internal/closing fuel is not also a return or waste."
      evidence: "cp_atom_req_regravel_finish_nonburned_fuel_fates"
    - id: atom_req_prepare_host_nonburned_fuel_fates
      applies_to: "prepare_host"
      requirement: "At prepare_host, independently collect all actual unused fuel outward returns/other-owner transfers, carried or recovered closing stock, contained nonburned waste, cleanup carriers and actual uncontained species/medium fates. Index actual fuel grade, event/period, source and owner, source fuel-component kg and measured whole physical carrier quantity in one explicit exchange unit. A whole contaminated liquid/absorbent carrier and its included fuel/substances are nonadditive views, not duplicate waste exchanges. Unknown actual grade, carrier, substance, medium, quantity, destination or scope is incomplete; never infer combustion, absence or zero. Link cp_atom_req_prepare_host_nonburned_fuel_fates to the corresponding supply S and independently burned B, actual receiver/transport leg owner and all original stock/provider rules. Only actual outward custody is an outlet; recovered internal/closing fuel is not also a return or waste."
