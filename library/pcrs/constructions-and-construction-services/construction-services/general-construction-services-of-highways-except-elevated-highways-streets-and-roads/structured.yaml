allocation_rules:
  - rule_id: single_repair
    applies_to: "accepted_regravelling"
    rule: "One intended final repair service; rejected chainages are not accepted output. Retain all actual failed passes, rework, retests and their resources in the eventual accepted repair; no avoided-new-road or substitution credit."
    source_ids: []
  - rule_id: asset_attribution
    applies_to: "prep_plant_grader; prep_plant_scarifier; prep_plant_drainage_machine; prep_plant_traffic_control; prep_plant_tool; atom_req_prepare_host_prep_plant actual-child group; finish_plant_grader; finish_plant_water_bowser; finish_plant_roller; finish_plant_traffic_control; finish_plant_tool; atom_req_regravel_finish_finish_plant actual-child group"
    rule: "Use actual asset logs to enumerate consuming nodes, other jobs and reporting periods. Allocate complete-life manufacture, maintenance/replacement and end-of-life burdens using justified measured service/utilization over the documented service boundary; retain idle/mobilization attribution and termination assumptions. Event/asset IDs have one owner. Provider service coverage and separately modelled plant/fuel must not overlap. Completed asset lives use observed historical service. An in-service asset may use evidence-based prospective remaining service, replacement/termination and end-of-life scenarios: distinguish forecasts from observations, disclose the complete-life utilization denominator, source, uncertainty/sensitivity and update trigger. Do not invent a future retirement date or default lifespan; missing justified full coverage or denominator, rather than continued operation, is the data gap."
    source_ids: []
  - rule_id: period_custody
    applies_to: "all inventory rows"
    rule: "Link receipts/issues, host handoff, rework, returns, acceptance and asset replacements/termination to dated periods. Reconcile opening plus gross receipts with installation, outward returns/waste, measured losses and closing stock. Carry stock and its burden into later periods once; never net a return then record it again as outward flow."
    source_ids: []
  - rule_id: outward_material
    applies_to: "host_surplus; aggregate_return; prep_removed_waste_sediment; prep_removed_waste_soil; prep_removed_waste_gravel; prep_removed_waste_debris; atom_req_prepare_host_prep_removed_waste actual-child group; rejected_layer"
    rule: "Classify each actual outward lot by legal custody and destination: usable product return/surplus versus waste versus actual environmental release. Recovery or sale does not establish automatic coproduct credit; disclose any chosen allocation with evidence and keep burdens/transport ownership closed."
    source_ids: []
  - rule_id: atom_grouped_ledgers
    applies_to: "all actual-child records"
    rule: "Apply each existing formula only to its applicable role: material stock, asset lifecycle fraction/hourly provision, completed service event, internal transfer and species/fate calculations are distinct. Never apply material-stock or full-machine purchase equations to an asset share or service event. Within the applicable method group, use concrete child identity/material, state, one exchange property/unit, receiving medium and ownership/event scope. Native and converted views are nonadditive. A family diagnostic total is never a flow identity or every child numerator; keep incomplete portions explicit. Complete formulations, assemblies and genuinely bounded single-function services remain whole, with included constituents/resources not purchased again."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_atom_req_regravel_finish_nonburned_fuel_fates
      process_id: "regravel_finish"
      flow_role: "atom_req_regravel_finish_nonburned_fuel_fates"
      record_type: "mandatory_refinement"
      raw_fields: "actual_fuel_grade; event_id; period_id; source_fuel_requirement; actual_fate; actual_child_row_id; one_property; one_unit; same_grade_component_kg; independent_whole_carrier_quantity; species_if_actual_release; receiving_medium; recovered_closing_link; actual_receiver; custody_receipt; leg_id; burden_owner; scope_and_provider_overlap; actual_absence_evidence; unresolved_reason"
      collection_method: "At regravel_finish, independently collect all actual unused fuel outward returns/other-owner transfers, carried or recovered closing stock, contained nonburned waste, cleanup carriers and actual uncontained species/medium fates. Index actual fuel grade, event/period, source and owner, source fuel-component kg and measured whole physical carrier quantity in one explicit exchange unit. A whole contaminated liquid/absorbent carrier and its included fuel/substances are nonadditive views, not duplicate waste exchanges. Unknown actual grade, carrier, substance, medium, quantity, destination or scope is incomplete; never infer combustion, absence or zero. Link cp_atom_req_regravel_finish_nonburned_fuel_fates to the corresponding supply S and independently burned B, actual receiver/transport leg owner and all original stock/provider rules. Only actual outward custody is an outlet; recovered internal/closing fuel is not also a return or waste."
      unit: "One explicit unit per actual separately indexed exchange"
      frequency: "Each actual fuel/fate event and campaign close"
      temporal_coverage: "Complete actual repair campaign"
      site_scope: "regravel_finish"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual quantity/fate/support required; missing stays incomplete"
    - protocol_id: cp_atom_req_prepare_host_nonburned_fuel_fates
      process_id: "prepare_host"
      flow_role: "atom_req_prepare_host_nonburned_fuel_fates"
      record_type: "mandatory_refinement"
      raw_fields: "actual_fuel_grade; event_id; period_id; source_fuel_requirement; actual_fate; actual_child_row_id; one_property; one_unit; same_grade_component_kg; independent_whole_carrier_quantity; species_if_actual_release; receiving_medium; recovered_closing_link; actual_receiver; custody_receipt; leg_id; burden_owner; scope_and_provider_overlap; actual_absence_evidence; unresolved_reason"
      collection_method: "At prepare_host, independently collect all actual unused fuel outward returns/other-owner transfers, carried or recovered closing stock, contained nonburned waste, cleanup carriers and actual uncontained species/medium fates. Index actual fuel grade, event/period, source and owner, source fuel-component kg and measured whole physical carrier quantity in one explicit exchange unit. A whole contaminated liquid/absorbent carrier and its included fuel/substances are nonadditive views, not duplicate waste exchanges. Unknown actual grade, carrier, substance, medium, quantity, destination or scope is incomplete; never infer combustion, absence or zero. Link cp_atom_req_prepare_host_nonburned_fuel_fates to the corresponding supply S and independently burned B, actual receiver/transport leg owner and all original stock/provider rules. Only actual outward custody is an outlet; recovered internal/closing fuel is not also a return or waste."
      unit: "One explicit unit per actual separately indexed exchange"
      frequency: "Each actual fuel/fate event and campaign close"
      temporal_coverage: "Complete actual repair campaign"
      site_scope: "prepare_host"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual quantity/fate/support required; missing stays incomplete"
    - protocol_id: cp_prep_plant
      process_id: "prepare_host"
      flow_role: "Actual road-preparation plant and tool service"
      record_type: "Actual site/supplier record"
      raw_fields: "asset_id; provider; task; event_id; start_time; end_time; service_hours_h; idle_hours_h; other_job_consumers; period; manufacture_maintenance_replacement_end_of_life_scope; utilization_denominator; attribution_share"
      collection_method: "Use meter/job logs and provider scope; enumerate this node, finishing and other contracts/periods, then attribute complete-life service consistently with asset_attribution."
      unit: "h"
      frequency: "Every event/lot and all repeated operations"
      temporal_coverage: "Complete asset lifecycle coverage: manufacture/acquisition, all contributing service/reporting periods, maintenance/replacement and termination/end-of-life; retain observed history and any evidenced prospective remainder as distinct evidence, including this job and all failed/repeated attempts."
      site_scope: "Declared job/node/site plus every consuming node, job, provider and reporting period represented in the same asset complete-life denominator, including consumers outside this site."
      aggregation_rule: "per reference flow"
      quality_evidence: "Retain full life phase evidence, replacement/termination decisions and single ownership of fuel/plant service; Duration support still requires confirmation. Completed asset lives use observed historical service. An in-service asset may use evidence-based prospective remaining service, replacement/termination and end-of-life scenarios: distinguish forecasts from observations, disclose the complete-life utilization denominator, source, uncertainty/sensitivity and update trigger. Do not invent a future retirement date or default lifespan; missing justified full coverage or denominator, rather than continued operation, is the data gap."
    - protocol_id: cp_prep_fuel
      process_id: "prepare_host"
      flow_role: "Actual preparation-machine fuel by supplied grade"
      record_type: "Actual site/supplier record"
      raw_fields: "fuel_grade; asset_id; period; opening_kg; gross_issues_kg; closing_kg; other_job_kg; density_kg_per_m3; temperature_C; fuel_service_owner; outward_return_kg; outward_transfer_kg; transfer_owner; spill_kg; spill_medium_or_waste_receiver; spill_treatment; legacy_actual_consumed_kg_not_supply_or_burn; actual_supply_S_kg; actual_burned_B_kg; attributed_opening_kg; attributed_gross_receipts_net_kg; attributed_carried_closing_kg; nonburned_waste_fuel_component_kg; uncontained_loss_fuel_component_kg; total_spill_audit_kg; recovered_to_closing_kg; recovered_to_return_kg; recovered_to_waste_kg; actual_fate_event_owner; all_consumer_grade_period_fates; fate_completeness_evidence; independent_burn_measurement; fate_balance_gap_kg; measured_volume; volume_unit; actual_density_source; physical_state; temperature_unit; actual_conversion_evidence"
      collection_method: "For each actual fuel grade, owner node and period, the upstream product supply S_kg is attributed opening fuel plus actual gross net-tare receipts/issues minus burden-carried closing fuel. Keep the original gross-with-real-outlets convention: usable outward returns and true other-owner transfers have their separately measured positive custody outlets and original carried burden, without a second deduction or avoided-production credit. Nonreturned unburned waste and uncontained losses remain in S, because they required upstream supply. Closing retained/recovered stock carries its burden forward and is not an outward outlet. Shared tanks/issues require a complete actual consumer/event ownership ledger including other jobs and all fates; other_job_kg cannot conceal this node losses or duplicate a provider-included fuel supply. Divide S only once by N unique finally accepted contract repair segments. S is not combustion activity. Independently measure actual burned fuel B_kg by calibrated engine/burner consumption evidence or a fully audited complete disjoint same-grade/owner balance: opening + gross receipts/issues = closing + B + usable outward returns + real other-owner transfers + contained nonburned waste + uncontained loss. Only a complete evidenced fate balance may derive B; an unknown difference or unmeasured spill is never inferred burn or zero. Total spill is an incident audit, not another ending pool; allocate recovered portions once to their actual final closing/return/waste fate, without subtracting the incident total again. Retain full repair campaign, idle/repeated preparation/spread/compaction, event/node/provider ownership and calibration/uncertainty. Volume-to-kg conversion requires actual same-grade/batch density value/unit/source, physical state, temperature/unit and measured volume units, exactly once. Fuel already included in a complete provider service is not a second local purchase or local emission owner."
      unit: "kg"
      frequency: "Every event/lot and all repeated operations"
      temporal_coverage: "Complete bounded repair campaign, linked reporting dates"
      site_scope: "Actual declared chainages and responsible provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "Fuel receipts and measured density; no default consumption or combustion factor. No missing disposition treated as consumed fuel; record unresolved balance gap."
    - protocol_id: cp_prep_electricity
      process_id: "prepare_host"
      flow_role: "Actual preparation electricity supply"
      record_type: "Actual site/supplier record"
      raw_fields: "meter_id; supplier; event_id; start_kWh; end_kWh; period; other_job_kWh; attribution_share; service_scope"
      collection_method: "Read calibrated meters or traceable supplier submeter records and assign unique node/event ownership."
      unit: "kWh"
      frequency: "Every event/lot and all repeated operations"
      temporal_coverage: "Complete bounded repair campaign, linked reporting dates"
      site_scope: "Actual declared chainages and responsible provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "Native kWh remains; exact Energy property support is a separately declared gap."
    - protocol_id: cp_prepared_host
      process_id: "prepare_host"
      flow_role: "Prepared existing road at regravelling handoff"
      record_type: "Actual site/supplier record"
      raw_fields: "road_id; segment_id; start_chainage_m; end_chainage_m; width_m; area_m2; crown_percent; crossfall_percent; longitudinal_grade_percent; distress; drainage_scope_owner; criterion_source; criterion_tolerance; inspection_result; gate_date; transfer_id"
      collection_method: "Survey actual chainages, widths and levels; inspect corrected distress and drainage against contract criteria and record the signed pre-spread gate paired with host_to_finish."
      unit: "Item(s)"
      frequency: "Every event/lot and all repeated operations"
      temporal_coverage: "Complete bounded repair campaign, linked reporting dates"
      site_scope: "Actual declared chainages and responsible provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "Retain structural qualification, measured geometry/units and tolerances; failed preparation stays here and carries repeated burdens."
    - protocol_id: cp_host_surplus
      process_id: "prepare_host"
      flow_role: "Actual usable retained-host surplus transferred outward"
      record_type: "Actual site/supplier record"
      raw_fields: "lot_id; material_identity; gross_kg; tare_kg; moisture_percent; destination; product_custody; period; dispatch_id; transport_owner"
      collection_method: "Weigh actual dispatched usable surplus and retain recipient/product-custody evidence; do not also classify the same lot as waste."
      unit: "kg"
      frequency: "Every event/lot and all repeated operations"
      temporal_coverage: "Complete bounded repair campaign, linked reporting dates"
      site_scope: "Actual declared chainages and responsible provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated weighing, destination and treatment of retained burden; no negative virgin aggregate input. For receipts/issues and outward dispatch, gross means total material before netting returns or other outward transfers, after removing vehicle/container tare. Where gross_kg and tare_kg record weighed vehicle/container and tare, subtract tare_kg from gross_kg to obtain material mass for the balance; never enter gross vehicle mass as material. Retain scale accuracy and matched moisture/state."
    - protocol_id: cp_prep_removed_waste
      process_id: "prepare_host"
      flow_role: "Actual preparation removals transferred as waste"
      record_type: "Actual site/supplier record"
      raw_fields: "waste_id; substance_material; waste_status; gross_kg; tare_kg; moisture_percent; producing_task; period; carrier; receiving_facility; treatment; transport_owner"
      collection_method: "Use waste transfer/weighbridge records linked to actual preparation tasks and destinations; reconcile retained material and product exits independently."
      unit: "kg"
      frequency: "Every event/lot and all repeated operations"
      temporal_coverage: "Complete bounded repair campaign, linked reporting dates"
      site_scope: "Actual declared chainages and responsible provider"
