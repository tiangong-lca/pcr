      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| validate_route | splice_repair | Reject local/FTTH/submarine/power/multimode/ribbon/mechanical/connector or new-insert/closure-body work from this category. Verify long-distance land-network function, retained serviceable interfaces, compatible existing fibre ends and sufficient slack before assigning the route. | un-cpc3-2025; corning-single-fibre-fusion-2020 |\n| validate_gate | accepted_fibre_pair_repair | Require actual mechanical criterion/result, calibrated optical method/wavelength/threshold/result, OTDR bidirectional averaging when claiming accurate splice loss, protection/routing and parent closure reseal/required checks with defect closure and signed owner acceptance. Splicer estimated loss, sleeve heating or closure count alone cannot pass. | corning-single-fibre-fusion-2020; corning-retained-closure-2019 |\n| validate_count_rework | all inventory rows | N must be positive unique final accepted fibre-pair IDs; exclude unresolved/rejected attempts and retain every earlier attempt burden. Reconcile event, setup/changeover, test/retest, charging and waste to campaign/closure/period and prevent common run burdens being assigned twice. |  |\n| validate_balance | all inventory rows | Reconcile own-native-unit stocks, net-tare gross receipts and mutually exclusive installed/retained/return/waste/release outlets under one declared convention. Verify actual discarded protector Count, matching unit-mass and density/state conversions. Fuel total spill is audit-only; whole gas/fluid balance is not generic elementary exchange. |  |\n| validate_assets_periods | shared_asset_supply_splicer; shared_asset_supply_heater; shared_asset_supply_cleaver; shared_asset_supply_stripper; shared_asset_supply_tester; shared_asset_supply_source; shared_asset_supply_receiver; shared_asset_supply_sharps_tool; shared_asset_supply_charger; shared_asset_supply_battery; shared_asset_supply_shelter; shared_asset_supply_access; shared_asset_supply_cylinder; atomic_shared_asset_supply; transport_service | Enumerate all asset/service consumers and periods plus manufacture, maintenance/replacement, termination/end-of-life; justify remaining life, denominator, uncertainty/sensitivity and update. Missing life or provider scope, unsupported unit conversion or overlap blocks final dataset. Preserve stock upstream carry without double attribution. |  |\n| validate_releases | atomic_elementary_releases | Require actual substance-medium and measured or valid activity-factor/composition-fate evidence; keep routine/incident and whole-mixture/constituent views distinct. Captured residues belong to actual waste/stock/return once, not environmental release. |  |\n| validate_final_exchange | all inventory rows | Resolve each actual expanded downstream exchange to one verified concrete flow and compatible property/unit before final process construction. Conditional umbrellas are not fixed identities; disclose absent, unresolved and incomplete data separately. |  |\n| close_atomic_preparation_consumables | splice_repair; cp_materials | Block final foreground completion until every actual object in atomic_preparation_consumables is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_closure_reseal_materials | splice_repair; cp_materials | Block final foreground completion until every actual object in atomic_closure_reseal_materials is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_shared_asset_supply | splice_repair; cp_assets | Block final foreground completion until every actual object in atomic_shared_asset_supply is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_outward_material_returns | splice_repair; cp_materials | Block final foreground completion until every actual object in atomic_outward_material_returns is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_fibre_sharps | splice_repair; cp_waste | Block final foreground completion until every actual object in atomic_fibre_sharps is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_other_solid_waste | splice_repair; cp_waste | Block final foreground completion until every actual object in atomic_other_solid_waste is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_elementary_releases | splice_repair; cp_emissions | Block final foreground completion until every actual object in atomic_elementary_releases is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| atomic_pair_provenance_complete | actual internal child source and recipient transfers | Verify actual source/receipt evidence, original physical quantities/units and ownership for the same material/state/event/gate. Traceable reuse of the same signed measurement is allowed; copied parent totals, overwritten receipts and forced unknown equality are prohibited. Unexplained differences without uncertainty, actual loss or state-transition responsibility evidence block completion; verify exactly one normalization per card. |  |\n\n"
