          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| individual_and_common | all inventory rows | Attribute individually measured repair resources to their fibre-pair IDs. Partition actual common closure/setup/test/changeover resources by a documented causal measured driver across all benefiting accepted fibre pairs; sum shares to the complete campaign amount before dividing by N. Do not charge the whole closure/test run independently to every fibre. No co-product is assumed; actual reusable outward supplies are separate returns, without automatic avoided credit. |  |\n| retain_failed_attempts | splice_repair | Keep all failed mechanical/optical splice attempts and reseal/retest burdens in the originating campaign. Link rework back to splice_repair; count each final accepted fibre-pair ID once, and keep discarded sharps/protectors/seals in their actual exit routes. A no-acceptance campaign has no valid positive-N dataset and must be separately disclosed. | corning-single-fibre-fusion-2020; corning-retained-closure-2019 |\n| asset_and_period_allocation | shared_asset_supply_splicer; shared_asset_supply_heater; shared_asset_supply_cleaver; shared_asset_supply_stripper; shared_asset_supply_tester; shared_asset_supply_source; shared_asset_supply_receiver; shared_asset_supply_sharps_tool; shared_asset_supply_charger; shared_asset_supply_battery; shared_asset_supply_shelter; shared_asset_supply_access; shared_asset_supply_cylinder; atomic_shared_asset_supply | Allocate each actual complete-life asset by compatible measured service driver across all consuming jobs/nodes/periods, including unrelated jobs. Use complete observed life or observed history plus evidenced remaining service, maintenance/replacement, termination/end-of-life scenario with uncertainty/sensitivity/update. Match numerator and denominator boundaries; missing life coverage or denominator blocks final dataset. Keep direct operation/spares/provider bundles disjoint. |  |\n| stock_and_provider_ownership | all inventory rows | Carry opening/closing stocks with their upstream burden between actual periods; reconcile receipts, internal issues and final destinations without double charging. Bought transport, gas/compressor, kit/constituents and rental/direct-asset routes each have one documented owner; price/hours do not define flow quantity or waive complete coverage. |  |\n| campaign_supply_attribution | splice_protectors; fibre_cleaner; preparation_consumables_wipe; preparation_consumables_sharps_container; preparation_consumables_absorber; preparation_consumables_water; preparation_consumables_protection; atomic_preparation_consumables; closure_reseal_materials_seal; closure_reseal_materials_gasket; closure_reseal_materials_grease; closure_reseal_materials_tape; atomic_closure_reseal_materials; direct_fuel; closure_test_gas_purchased_clean_dry_air; closure_test_gas_purchased_nitrogen | Campaign supply is opening carried stock plus new external receipts minus closing carried stock for the same SKU/native unit and upstream burden. New receipts/N alone is not the repair supply. Gross-with-outlets retains actual returns as outputs; consumed-only excludes matched returned supply once. Fuel burned for emission activity remains a separate quantity from supply. |  |\n\n"
