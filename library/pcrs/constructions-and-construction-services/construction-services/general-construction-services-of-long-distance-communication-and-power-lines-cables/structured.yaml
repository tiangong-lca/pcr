  calculation_rules:
    - id: accepted_normalisation
      applies_to: "splice_protectors; fibre_cleaner; preparation_consumables_wipe; preparation_consumables_sharps_container; preparation_consumables_absorber; preparation_consumables_water; preparation_consumables_protection; atomic_preparation_consumables; closure_reseal_materials_seal; closure_reseal_materials_gasket; closure_reseal_materials_grease; closure_reseal_materials_tape; atomic_closure_reseal_materials; electricity_supply; direct_fuel; closure_test_gas_purchased_clean_dry_air; closure_test_gas_purchased_nitrogen; transport_service; shared_asset_supply_splicer; shared_asset_supply_heater; shared_asset_supply_cleaver; shared_asset_supply_stripper; shared_asset_supply_tester; shared_asset_supply_source; shared_asset_supply_receiver; shared_asset_supply_sharps_tool; shared_asset_supply_charger; shared_asset_supply_battery; shared_asset_supply_shelter; shared_asset_supply_access; shared_asset_supply_cylinder; atomic_shared_asset_supply; outward_protector_returns; outward_material_returns_preparation_consumables_wipe; outward_material_returns_preparation_consumables_sharps_container; outward_material_returns_preparation_consumables_absorber; outward_material_returns_preparation_consumables_water; outward_material_returns_preparation_consumables_protection; outward_material_returns_closure_reseal_materials_seal; outward_material_returns_closure_reseal_materials_gasket; outward_material_returns_closure_reseal_materials_grease; outward_material_returns_closure_reseal_materials_tape; outward_material_returns_closure_test_gas_purchased_clean_dry_air; outward_material_returns_closure_test_gas_purchased_nitrogen; atomic_outward_material_returns; fibre_sharps_glass; fibre_sharps_coating; fibre_sharps_composite; atomic_fibre_sharps; other_solid_waste_protector; other_solid_waste_wipe; other_solid_waste_absorber; other_solid_waste_seal; other_solid_waste_packaging; atomic_other_solid_waste; wastewater; atomic_elementary_releases"
      rule: "Inventory amount per reference flow = attributable complete campaign amount in its own native unit / N; N = unique final accepted fibre-pair IDs after all gates. Attribute individual and common resources once; no valid positive-N dataset when N is zero."
      inputs:
        - cp_acceptance
        - "each applicable own-node collection protocol"
        - "attributable campaign amount"
        - N
      output: "Each actual exchange per 1 Item(s) accepted repair"
      source_ids: []
    - id: material_ledger
      applies_to: "splice_protectors; fibre_cleaner; preparation_consumables_wipe; preparation_consumables_sharps_container; preparation_consumables_absorber; preparation_consumables_water; preparation_consumables_protection; atomic_preparation_consumables; closure_reseal_materials_seal; closure_reseal_materials_gasket; closure_reseal_materials_grease; closure_reseal_materials_tape; atomic_closure_reseal_materials; outward_protector_returns; outward_material_returns_preparation_consumables_wipe; outward_material_returns_preparation_consumables_sharps_container; outward_material_returns_preparation_consumables_absorber; outward_material_returns_preparation_consumables_water; outward_material_returns_preparation_consumables_protection; outward_material_returns_closure_reseal_materials_seal; outward_material_returns_closure_reseal_materials_gasket; outward_material_returns_closure_reseal_materials_grease; outward_material_returns_closure_reseal_materials_tape; outward_material_returns_closure_test_gas_purchased_clean_dry_air; outward_material_returns_closure_test_gas_purchased_nitrogen; atomic_outward_material_returns"
      rule: "For each SKU/native unit, campaign supply = opening_stock + gross_receipt - closing_stock, with matched carried upstream burden for the same SKU/unit. Gross-with-outlets retains actual outward returns as outputs; consumed-only excludes their matched supply once. Physical reconciliation: opening_stock + gross_receipt = closing_stock + installed_retained_final + discarded_native_quantity + return_native_quantity + release_native_quantity. Gross excludes tare before return netting; used_activity/internal_issue are nonadditive. Gross-with-outlets records gross and each exit; consumed-only supply excludes corresponding outward-return supply once and never mixes conventions. Mass conversion: Count * matching_unit_mass or Volume * density only with actual matching unit/state/temperature/source."
      inputs:
        - cp_materials
        - opening_stock
        - gross_receipt
        - closing_stock
        - installed_retained_final
        - discarded_native_quantity
        - return_native_quantity
        - release_native_quantity
        - native_quantity
        - matching_unit_mass
        - density
        - conversion_source
      output: "Reconciled actual native supply/return quantities and supported mass expansions"
      source_ids: []
    - id: electricity_total
      applies_to: "electricity_supply"
      rule: "Attributable MJ = nonoverlapping measured kWh * 3.6 MJ/kWh + measured MJ + shared charging MJ * shared_driver_job / shared_driver_total. Same-boundary measured totals include losses; do not add them again. Include actual local compressor electricity only in compressor mode."
      inputs:
        - cp_power
        - meter_start
        - meter_end
        - meter_unit
        - shared_driver_job
        - shared_driver_total
        - supplied_compressor_scope
      output: "Attributable electricity MJ before accepted_normalisation"
      source_ids: []
    - id: fuel_burn_balance
      applies_to: "direct_fuel"
      rule: "Campaign fuel supply = opening_stock_kg + gross_receipt_kg - closing_stock_kg, carrying matched upstream burden; gross-with-outlets retains outward returns as outputs, consumed-only excludes matched return supply once. Separately, burned_kg = opening_stock_kg + gross_receipt_kg - closing_stock_kg - nonburned_return_kg - nonburned_waste_kg - uncontained_whole_fuel_kg. All nonburned outlets are mutually exclusive final destinations; recovered retained spill stays in closing_stock_kg, and spill_total_audit_kg is not subtracted. Apply actual chosen gross/consumed supply convention without duplicate outlet netting."
      inputs:
        - cp_fuel
        - opening_stock_kg
        - gross_receipt_kg
        - closing_stock_kg
        - nonburned_return_kg
        - nonburned_waste_kg
        - uncontained_whole_fuel_kg
      output: "Actual burned fuel and supply ledger before accepted_normalisation"
      source_ids: []
    - id: gas_ledger
      applies_to: "closure_test_gas_purchased_clean_dry_air; closure_test_gas_purchased_nitrogen"
      rule: "Campaign purchased-gas supply = opening_mass_kg + gross_receipt_kg - closing_mass_kg with matched upstream burden carry; gross-with-outlets retains actual returns as outputs, consumed-only excludes their matched supply once. Physical reconciliation: opening_mass_kg + gross_receipt_kg = closing_mass_kg + outward_return_kg + other_final_outlet_kg + released_whole_gas_kg; outlets are mutually exclusive. Purchased gas quantity uses actual chosen supply ledger; compressor-mode gas is activity with separately owned electricity/fuel/assets, not a purchased gas duplicate. Volume conversion uses actual state/pressure/temperature/composition/density/source."
      inputs:
        - cp_gas
        - opening_mass_kg
        - gross_receipt_kg
        - closing_mass_kg
        - outward_return_kg
        - other_final_outlet_kg
        - released_whole_gas_kg
        - source_mode
        - density
        - conversion_source
      output: "Actual whole-gas supply and physical reconciliation before accepted_normalisation"
      source_ids: []
    - id: transport_activity
      applies_to: "transport_service"
      rule: "Purchased transport activity = sum actual payload_net_tonnes * route_km for nonoverlapping leg IDs, with declared provider empty/return allocation. Direct-mode vehicle resources are excluded from purchased service coverage."
      inputs:
        - cp_transport
        - payload_net_tonnes
        - route_km
        - leg_id
        - empty_return_scope
        - allocation_driver
      output: "Actual attributable t*km before accepted_normalisation"
      source_ids: []
    - id: asset_service_share
      applies_to: "shared_asset_supply_splicer; shared_asset_supply_heater; shared_asset_supply_cleaver; shared_asset_supply_stripper; shared_asset_supply_tester; shared_asset_supply_source; shared_asset_supply_receiver; shared_asset_supply_sharps_tool; shared_asset_supply_charger; shared_asset_supply_battery; shared_asset_supply_shelter; shared_asset_supply_access; shared_asset_supply_cylinder; atomic_shared_asset_supply"
      rule: "Complete-asset equivalent = driver_job / driver_all_consumers for one actual complete-life asset. Link equivalent to complete manufacture + maintenance + replacement + end_of_life_scope; denominator covers all jobs/nodes/periods in same life scope. Use observed history plus justified remainder where needed and disclose uncertainty/sensitivity; do not allocate only purchase price or omit life phases."
      inputs:
