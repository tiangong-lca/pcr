system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers a bounded repair of existing dielectric single-mode optical fibres in a declared long-distance land telecommunications network. Single-fibre electric-arc fusion joins two compatible retained fibre ends using sufficient existing slack; each accepted connection is protected, optically and mechanically verified, organised, and released only after its retained serviceable sealed closure has been re-sealed and checked. The method boundary includes safe authorised optical isolation, access/protection, closure re-entry, cutback, mechanical stripping, cleaning, cleaving, alignment/program selection, arc fusion, checks, sleeve heating, routing, enclosure work and all failed attempts through signed owner acceptance. [corning-single-fibre-fusion-2020; corning-retained-closure-2019] Exclude new route or cable manufacture, new cable inserts and long cut replacements, new closure bodies, local/FTTH/in-building networks, submarine works, power cables, multimode fibres, mass-ribbon fusion, mechanical splices, connector/pigtail installation and later network operation. Insufficient slack, incompatible fibres or a failed retained closure/interface require another route; they cannot be treated as this PCR with extra generic supplies. CPC inclusion is narrower than the long-distance communication-and-power-lines class and creates no claim over its power-line services. [un-cpc3-2025]"
      source_ids:
        - un-cpc3-2025
        - corning-single-fibre-fusion-2020
        - corning-retained-closure-2019
    - rule_id: repair_gate
      applies_to: "splice_repair"
      rule: "Retain one integrated responsibility for the joining of left and right existing fibre ends and new protective interface; retained closure/organiser receive the protected connection. Keep preparation, arc/heat, verification and reseal together unless actual independent inventory handoff is evidenced. The completed state and signed gate must include actual mechanical and optical checks, protection, routing and closure acceptance."
      source_ids:
        - corning-single-fibre-fusion-2020
        - corning-retained-closure-2019
    - rule_id: incremental_scope
      applies_to: "splice_repair"
      rule: "Include actual incremental isolation/access/shelter, cleaning, sharps containment, seal replacement, approved test gas or compressor operation, failed attempts, retests, transport and demobilisation even if a provider pays. Retained cable and closure are state inputs; inspect job-caused damage and block this route if replacement body/insert is needed."
      source_ids:
        - corning-single-fibre-fusion-2020
        - corning-retained-closure-2019
    - rule_id: event_and_asset_phases
      applies_to: "splice_repair"
      rule: "Index each setup, cleaning/changeover, fibre attempt, closure test and final acceptance by job, closure and event period. Separately index tool manufacture, maintenance/replacements, service periods and termination/end-of-life across all consuming jobs; opening/closing stocks carry their actual upstream burden across periods."
      source_ids: []
    - rule_id: physical_ledger
      applies_to: "all inventory rows"
      rule: "Choose gross receipt with explicit outward outputs or consumed-only purchasing treatment per material, never both. Gross is net of actual tare before outward-return netting. Dosed/used material is intermediate activity; final installed/retained destinations exclude separately logged waste/release/return. Internal store issue is not a second external receipt; closing stock is not outward exchange."
      source_ids: []
    - rule_id: whole_gas_and_species
      applies_to: "closure_test_gas_purchased_clean_dry_air; closure_test_gas_purchased_nitrogen; atomic_elementary_releases"
      rule: "A whole clean-air/nitrogen mixture physical ledger records actual released mass and final destinations; it is not a generic elementary gas emission. Elementary species need identity/composition/fate/medium evidence and remain nonadditive with the whole mixture view. Actual closure-approved pressure/torque and release procedure govern; no universal settings."
      source_ids:
        - corning-retained-closure-2019
boundary_abstraction:
  declared_starting_condition: "Declared existing long-distance land optical cable with compatible dielectric single-mode fibre ends, sufficient repair slack and qualified retained serviceable re-enterable sealed closure; authorisation and optical isolation required"
  starting_condition_role: "Existing productive-state interfaces: separate left/right retained fibre end roles, retained cable/sheath, organiser and closure body; not new purchases, historical manufacture charges or avoided-replacement credits"
  product_classification_scope: "Narrower long-distance communication-line repair service within CPC 3.0 54242; power/local/submarine services excluded"
  recursive_input_rule: "An external repair subcontract in the same category requires its bounded completed scope, actual reference quantity and upstream burden evidence; assign its resources once, and never recurse through the same acceptance ID or count subcontract and in-house repair outputs twice"
  upstream_dataset_requirement: "Actual incremental protector, cleaner, wipes, seals, utilities, access, transport and shared-asset supply chains require technology/geography/period-appropriate upstream coverage. A supplier service may replace direct resources only for exactly documented included work with compatible actual unit and no overlap"
  disclosure: "Declare retained interface condition, isolation, fibre/slack, campaign/period, actual material and utility ledger boundaries, all attempts, common closure/test allocation, external providers, assets and releases; identify missing information instead of treating unknown as zero"
