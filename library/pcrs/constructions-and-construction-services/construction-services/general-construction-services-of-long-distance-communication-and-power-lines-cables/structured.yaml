allocation_rules:
  - rule_id: individual_and_common
    applies_to: "all inventory rows"
    rule: "Attribute individually measured repair resources to their fibre-pair IDs. Partition actual common closure/setup/test/changeover resources by a documented causal measured driver across all benefiting accepted fibre pairs; sum shares to the complete campaign amount before dividing by N. Do not charge the whole closure/test run independently to every fibre. No co-product is assumed; actual reusable outward supplies are separate returns, without automatic avoided credit."
    source_ids: []
  - rule_id: retain_failed_attempts
    applies_to: "splice_repair"
    rule: "Keep all failed mechanical/optical splice attempts and reseal/retest burdens in the originating campaign. Link rework back to splice_repair; count each final accepted fibre-pair ID once, and keep discarded sharps/protectors/seals in their actual exit routes. A no-acceptance campaign has no valid positive-N dataset and must be separately disclosed."
    source_ids:
      - corning-single-fibre-fusion-2020
      - corning-retained-closure-2019
  - rule_id: asset_and_period_allocation
    applies_to: "shared_asset_supply_splicer; shared_asset_supply_heater; shared_asset_supply_cleaver; shared_asset_supply_stripper; shared_asset_supply_tester; shared_asset_supply_source; shared_asset_supply_receiver; shared_asset_supply_sharps_tool; shared_asset_supply_charger; shared_asset_supply_battery; shared_asset_supply_shelter; shared_asset_supply_access; shared_asset_supply_cylinder; atomic_shared_asset_supply"
    rule: "Allocate each actual complete-life asset by compatible measured service driver across all consuming jobs/nodes/periods, including unrelated jobs. Use complete observed life or observed history plus evidenced remaining service, maintenance/replacement, termination/end-of-life scenario with uncertainty/sensitivity/update. Match numerator and denominator boundaries; missing life coverage or denominator blocks final dataset. Keep direct operation/spares/provider bundles disjoint."
    source_ids: []
  - rule_id: stock_and_provider_ownership
    applies_to: "all inventory rows"
    rule: "Carry opening/closing stocks with their upstream burden between actual periods; reconcile receipts, internal issues and final destinations without double charging. Bought transport, gas/compressor, kit/constituents and rental/direct-asset routes each have one documented owner; price/hours do not define flow quantity or waive complete coverage."
    source_ids: []
  - rule_id: campaign_supply_attribution
    applies_to: "splice_protectors; fibre_cleaner; preparation_consumables_wipe; preparation_consumables_sharps_container; preparation_consumables_absorber; preparation_consumables_water; preparation_consumables_protection; atomic_preparation_consumables; closure_reseal_materials_seal; closure_reseal_materials_gasket; closure_reseal_materials_grease; closure_reseal_materials_tape; atomic_closure_reseal_materials; direct_fuel; closure_test_gas_purchased_clean_dry_air; closure_test_gas_purchased_nitrogen"
    rule: "Campaign supply is opening carried stock plus new external receipts minus closing carried stock for the same SKU/native unit and upstream burden. New receipts/N alone is not the repair supply. Gross-with-outlets retains actual returns as outputs; consumed-only excludes matched returned supply once. Fuel burned for emission activity remains a separate quantity from supply."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "splice_repair"
      flow_role: "Final accepted connection and all attempt/gate states"
      record_type: "foreground_record"
      raw_fields: "job_id; campaign_id; closure_id; fibre_pair_id; left_fibre_type; right_fibre_type; compatibility; slack_length; isolation_authorisation; attempt_id; splicer_id; program; mechanical_criterion; mechanical_result; optical_method; wavelengths; threshold; optical_reading_forward; optical_reading_reverse; bidirectional_average; calibrated_result; protector_id; organiser_route; closure_instruction; seal_result; required_leak_check; defects_closed; acceptance_signature; event_period; N"
      collection_method: "Reconcile authorised network/function, compatible ends and slack; capture every failed/reworked attempt. Read distinct mechanical result and calibrated optical result at each actual wavelength/criterion; calculate bidirectional average for OTDR splice loss. Release only after protection/routing and parent retained closure gates; count unique final accepted IDs."
      unit: "Item(s); actual test units; declared length"
      frequency: "Each attempt, test and final handover"
      temporal_coverage: "Mobilisation/isolation through final campaign acceptance"
      site_scope: "Declared job/closure and all relevant shared consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed gate records, calibrated tests, closure traceability; no visual-estimate substitution"
    - protocol_id: cp_materials
      process_id: "splice_repair"
      flow_role: "Native-unit supply stock final destinations and actual outward returns"
      record_type: "foreground_record"
      raw_fields: "job_id; campaign_id; closure_id; fibre_pair_id; attempt_id; period; material_id; SKU; formulation; SDS; native_property; native_unit; ledger_convention; opening_stock; gross_receipt; tare; closing_stock; installed_retained_final; discarded_native_quantity; return_native_quantity; release_native_quantity; internal_issue; used_activity; native_quantity; matching_unit_mass; volume_unit; density; state; temperature; conversion_source; destination; upstream_carry; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Measure actual net-tare gross receipts before return netting and opening/closing stocks; keep each material native Count/Length/Mass/Volume ledger. Identify actual installed final destination and discarded/returned/released native quantities. Match Count mass only by actual SKU unit mass; convert volume only by actual density/state/temperature/source. Dosed/used quantity is activity, not additional final destination. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity aliases this record independent physical quantity keyed by atomic_flow_row_id under the original CP method and atomic_child_normalization, never another parent quantity. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      unit: "Actual native unit; kg for mass expansion"
      frequency: "Every receipt, issue, use, stock and exit"
      temporal_coverage: "Same campaign and stock transfer periods"
      site_scope: "Declared job/closure and all relevant shared consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Delivery/weighing records, actual discarded sleeve Count, conversion evidence, custody, stock carry and boundary reconciliation"
    - protocol_id: cp_power
      process_id: "splice_repair"
      flow_role: "Metered repair and compressor electricity including charging"
      record_type: "foreground_record"
      raw_fields: "job_id; campaign_id; closure_id; period; device_id; meter_boundary; meter_start; meter_end; meter_unit; charging_event; battery_state_start; battery_state_end; charging_loss_scope; shared_driver_job; shared_driver_total; supplied_compressor_scope; overlap_exclusions"
      collection_method: "Read calibrated nonoverlapping meters/chargers and attribute pre/post job charging by evidenced driver/state. Include heater/test/access/lighting/compressor actual loads and charging losses within declared boundary; do not use arc count as energy."
      unit: "kWh or MJ; dimensionally compatible driver"
      frequency: "Each operating/charging event"
      temporal_coverage: "Campaign plus attributable charging periods"
      site_scope: "Declared job/closure and all relevant shared consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, charging attribution, loss boundary and nonoverlap"
    - protocol_id: cp_fuel
      process_id: "splice_repair"
      flow_role: "Direct actual fuel supply combustion and nonburned destinations"
      record_type: "foreground_record"
      raw_fields: "job_id; campaign_id; period; plant_id; fuel_id; formulation; opening_stock_kg; gross_receipt_kg; tare_kg; closing_stock_kg; nonburned_return_kg; nonburned_waste_kg; uncontained_whole_fuel_kg; spill_total_audit_kg; recovered_spill_destination; burned_kg; measured_activity; factor_source; provider_overlap"
      collection_method: "Use same-scope net-tare physical fuel ledger; reconcile burned fuel to measured use. Total spill is audit only; recovered spill goes once to final stock/return/waste. Retained recovered fuel stays in closing stock and is not subtracted again. Match direct vehicle/generator scope against bought services."
      unit: "kg; activity/factor units"
      frequency: "Each receipt, operation, incident and stock boundary"
      temporal_coverage: "Same campaign, attributable operation and stock periods"
      site_scope: "Declared job/closure and all relevant shared consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Fuel identity, custody, stock/burn reconciliation, incident destinations and overlap proof"
    - protocol_id: cp_gas
      process_id: "splice_repair"
      flow_role: "Purchased or locally compressed closure test gas and final outlets"
      record_type: "foreground_record"
      raw_fields: "job_id; campaign_id; closure_id; period; source_mode; gas_identity; composition; opening_mass_kg; gross_receipt_kg; closing_mass_kg; outward_return_kg; other_final_outlet_kg; released_whole_gas_kg; volume; volume_unit; pressure; temperature; density; state; conversion_source; required_test; test_result; compressor_energy_owner; repeat_test_id; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Measure actual gas net mass or valid state-corrected volume conversion; record purchased versus compressor mode and required repeat/release events. Record whole mixture final destinations separately from substantiated elementary species; actual closure-approved procedure controls settings. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity aliases this record independent physical quantity keyed by atomic_flow_row_id under the original CP method and atomic_child_normalization, never another parent quantity. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      unit: "kg; actual volume/state units"
      frequency: "Each closure test and gas stock movement"
      temporal_coverage: "Campaign/retest and supply periods"
      site_scope: "Declared job/closure and all relevant shared consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual closure instruction, gas composition/state conversion, test results and exclusive supply owner"
    - protocol_id: cp_transport
      process_id: "splice_repair"
      flow_role: "Actual purchased transport mass-distance and direct-mode exclusion"
      record_type: "foreground_record"
      raw_fields: "job_id; campaign_id; period; leg_id; provider; mode; origin; destination; payload_net_tonnes; route_km; empty_return_scope; provider_service_boundary; service_unit; direct_resource_owner; allocation_driver"
      collection_method: "Read actual delivery/haul records and distances for each purchased mass-distance leg. Capture empty/return allocation and provider coverage; do not convert crew-hours/price/vehicle-km into tonne-km without actual compatible service evidence."
      unit: "t; km; t*km"
      frequency: "Each leg"
      temporal_coverage: "Actual mobilisation through removal/demobilisation"
      site_scope: "Declared job/closure and all relevant shared consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Payload/route records, actual service unit, empty-leg and direct-resource nonoverlap"
    - protocol_id: cp_assets
      process_id: "splice_repair"
