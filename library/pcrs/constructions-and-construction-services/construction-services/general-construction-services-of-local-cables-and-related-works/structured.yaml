          offset: 75824
          line: 644
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_joint | joint_repair | No intended co-product is created. Attribute all actual attempts, cutback, mixing/pour cleanup, protection and tests to the actual positive final accepted N in the bounded comparable campaign. Discarded or abandoned jobs retain burdens; if N is zero the campaign cannot supply this accepted-reference dataset. Scrap sale is not a repair co-product or avoided-production credit. |  |\n| allocation_events | joint_repair | Assign each finite pouch batch, changeover, isolation/setup and cleanup event a unique owner and period. Direct joint events use their actual IDs; shared events use recorded causal use shares across every consuming joint, including failed attempts. Report uncertainty and rejected paths; never count the same event both directly and in a shared pool. Every event record declares attribution_stage = raw_shared or already_attributed, source_scope_id, target_scope_id, original_source_quantity, source_event_share and attribution_record_id. A raw shared event is attributed once using a causal target share with all consumer shares summing to one; retain the original full event and every consumer, including failed attempts. The resulting job-attributable stocks, receipts, exits and activity operands already contain that share. All operands named job-attributable or opening_attributable_* in stock equations are these resulting target-scope quantities; the matching receipts, closing and fates must use that same scope. For an already-attributed operand set the remaining event_share to 1 in any downstream expression; retain source_event_share only as nonadditive provenance. Never apply it again or mix raw and assigned operands in one balance. Direct events use their unique owner and remaining share 1. If scope/stage is unknown, block calculation rather than assume a share. Final per-reference quantities divide by accepted_joint_count_N once. |  |\n| allocation_assets | atom_req_joint_repair_shared_assets | For each actual asset use a compatible causal measured driver across all jobs/nodes/periods. Attribute full-life manufacture, maintenance, replacement and disposal burden by the target driver divided by the complete full-life driver. Use completed observed life or observed history plus justified remaining-service/replacement/termination/EOL scenario, source, uncertainty, sensitivity and update trigger. Missing denominator or coverage blocks final dataset. Period totals reconcile once; do not allocate full manufacture anew every reporting year. |  |\n| allocation_overlap | joint_repair | Select gross-with-outlet or consumed-only inventory treatment explicitly and consistently. Gross input is net of tare before return netting; stocks preserve upstream burden. A consumed-only view cannot also claim the same return output credit. Count and mass physical subledgers, whole-fluid and species views, component and kit scopes, atom_req_joint_repair_freight and direct vehicles, provider and physical resources, asset/spares/rental scopes are mutually reconciled rather than added twice. |  |\n| atom_grouped_ledgers | all actual-child records | Apply every existing stock, allocation, emission and closure formula separately by concrete child identity/material, state, one exchange property/unit, receiving medium and ownership/event scope. Native and converted views are nonadditive. A family diagnostic total is never a flow identity or every child numerator; keep incomplete portions explicit. Complete formulations, assemblies and genuinely bounded single-function services remain whole, with included constituents/resources not purchased again. |  |\n\n"
