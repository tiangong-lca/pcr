system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers a bounded repair service on existing exposed, qualified unarmoured and unshielded polymeric-insulated multicore local low-voltage electricity-distribution cable ends using approved compression connectors and a preproportioned two-part polyurethane resin-cast mould system within the actual approved rating, no higher than 1 kV. Work begins with authorised isolation, proving dead and continued safe control. The owner must qualify slack, conductor/insulation compatibility and environment before cutback, preparation, crimping, mould sealing, pouch mixing/pouring and protection through full required cured-state verification, actual electrical acceptance and signed handover. The fully cured acceptance gate is this PCR subset; it does not claim that every product prohibits earlier energisation specifically authorised by its own applicable instructions. Energisation and backfill interfaces require explicit owner authorisation. The repair excludes new cable inserts, new routes, trenching, building fittings/circuits, telecommunications, long-distance/high-voltage works, armoured/shielded/lead/oil-paper cables, branch joints, shear-bolt connectors, shrink-only or re-enterable gel joints, hazardous-area systems and later operation. CPC 3.0 54252 includes repair of local electricity cables; this semantic boundary is narrower than that classification. [un-cpc3-2025; 3m-90na-issue3] The printed manufacturer document is 90-NA-X with Resin470W, Issue3, despite its URL saying92NA. It is route evidence, not a complete site instruction. The current 470W web link redirects to Resin470; the dated2012 Resin470 formulation values and 4GS immediate-energisation marketing cannot be transferred to 470W or to this acceptance gate. Actual delivered kit/connector instructions and competent owner criteria control. [3m-90na-issue3; 3m-resins-page]"
      source_ids:
        - un-cpc3-2025
        - 3m-90na-issue3
        - 3m-resins-page
    - rule_id: boundary_route
      applies_to: "joint_repair"
      rule: "Keep one integrated responsibility from authorised isolation/access to signed accepted fully cured joint. Retained cable ends, new compatible compression connectors and actual mould/resin protection have distinct component roles; stripping, mixing, casting, waiting and testing do not create independent manufacturing nodes. Actual current approved instructions govern."
      source_ids:
        - 3m-90na-issue3
    - rule_id: boundary_gate
      applies_to: "accepted_joint"
      rule: "Document preparation, connector/die/crimp compliance, seals, actual lot/pouch mixing and fill, temperature/moisture/cure conditions and full required cured-state criterion. Actual continuity/protective-conductor, insulation and other owner-required tests pass and defects close before acceptance. Catalogue type-test values are not field test defaults. Earlier product-authorised energisation is outside this fully cured handover subset, not universally prohibited."
      source_ids:
        - 3m-90na-issue3
    - rule_id: boundary_kit
      applies_to: "joint_kit; separate_connectors; atom_req_joint_repair_kit_components; atom_req_joint_repair_supplementary_materials"
      rule: "Choose complete-kit upstream once or actual disaggregated external components with all bundled overlaps excluded. Keep physical chamber/net-pack ledgers in either mode. Existing cable manufacture and avoided cable/outage/loss credits are excluded; actual preparation/protection/test/cleanup materials and provider-paid resources remain included."
      source_ids: []
    - rule_id: boundary_fates
      applies_to: "joint_repair"
      rule: "Include job-caused removal, failed crimp/fill/cure/retest, retained or wasted resin/packaging, actual spill recovery and waste handling. Installed/retained material destinations exclude separately logged waste/releases; intermediate dosed quantity is not another final outlet. No household-waste assumption or certification-based zero emission."
      source_ids:
        - 3m-90na-issue3
    - rule_id: boundary_periods_assets
      applies_to: "atom_req_joint_repair_shared_assets; atom_req_joint_repair_provider_service"
      rule: "Index mobilisation, isolation/preparation, joining/casting, cure/protection, acceptance/rework and demobilisation events by actual calendar period. Shared crimpers/dies, meters and temporary plant require all job/node/period consumers and complete manufacture/maintenance/replacement/end-of-life scope; existing host retention does not make the current repair burden-free. Provider, rental, direct operation and asset/spare scopes have one owner each."
      source_ids: []
