      collection_method: "Collect only this child object and select its actual SKU/event records from cp_materials. Independently measure kg at receipt/stock/return or actual internal handoff; retain actual net/tare, compatible state and all fates. Auxiliary unit conversion requires actual same-SKU mass or density/state/temperature evidence. The parent total is audit-only and is never copied to this child. Follow the parent ownership, gross/consumed and final-reference normalization rules once."
