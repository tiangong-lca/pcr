          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| validation_route | joint_repair | Reject incompatible local function, cable/connector/kit, missing isolation authority or exposure/slack and any excluded new-insert/trench/armour/shield/branch/shear-bolt/shrink-only/gel route. Actual approved ≤1 kV rating controls; no live-work permission is implied. | un-cpc3-2025; 3m-90na-issue3 |\n| validation_gate | accepted_joint | Require actual preparation/crimp/seal/fill/lot/cure evidence, full required cured-state criterion, applicable calibrated electrical tests, defects closed and signed owner handover. Type-test numbers are not universal field settings. N is positive unique accepted joints only; incomplete/rejected/repeated attempts cannot inflate it. | 3m-90na-issue3 |\n| validation_burden | joint_repair | Verify all actual campaign phases/periods and finite pouch batches, rejected states/rework loops, cleanup/changeover and shared-event ownership. Every failed attempt has a linked repair/waste/return/retained/release path and all burdens stay attributed. N=0 cannot yield an accepted-reference dataset. |  |\n| validation_balance | joint_repair | Check one upstream kit mode and every bundled exclusion, native count including actual discarded count, net chamber/pack/material stocks and exclusive final fates. Gross net-of-tare input precedes return netting. Consumed-only and gross-with-outlet treatments cannot give duplicate return credit. Verify actual factor/volume conversion evidence; unknown/residual does not become zero or an elementary flow. |  |\n| validation_life | atom_req_joint_repair_shared_assets; atom_req_joint_repair_provider_service; atom_req_joint_repair_freight | Require complete-life asset scope and all jobs/nodes/periods with compatible measured denominator and justified remaining-service/replacement/termination/EOL scenario where prospective. Missing denominator/coverage or unresolved service property/unit/results blocks final dataset. Cross-check direct operation, spares, tools, rental/provider and atom_req_joint_repair_freight for overlaps. |  |\n| validation_identity_range | joint_repair | Resolve each actual concrete exchange with correct identity/state/gate/property/unit before final dataset production. Conditional actual identities require foreground evidence. Range evidence needs stay visible until representative independent evidence is supplied; structural check does not establish UUID verification, quantitative plausibility or publication readiness. |  |\n| atom_req_joint_repair_kit_components_complete | joint_repair | Before final foreground completion, execute cp_atom_req_joint_repair_kit_components and atom_req_joint_repair_kit_components: all actual children in this role require one concrete object/state/medium and one explicit exchange property/unit, independent original quantity and evidenced conversion if needed, exact identity/support and reconciled owner/stock/fate/transfer scope. Each group is separate; no heterogeneous sum, guessed absence, parent-total/Range copying or duplicate assembly/provider/carrier burdens. Unresolved evidence means incomplete; pcr:check does not automatically execute or prove actual site roster completion. |  |\n| atom_req_joint_repair_supplementary_materials_complete | joint_repair | Before final foreground completion, execute cp_atom_req_joint_repair_supplementary_materials and atom_req_joint_repair_supplementary_materials: all actual children in this role require one concrete object/state/medium and one explicit exchange property/unit, independent original quantity and evidenced conversion if needed, exact identity/support and reconciled owner/stock/fate/transfer scope. Each group is separate; no heterogeneous sum, guessed absence, parent-total/Range copying or duplicate assembly/provider/carrier burdens. Unresolved evidence means incomplete; pcr:check does not automatically execute or prove actual si