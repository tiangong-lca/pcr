  calculation_rules:
    - id: material_intake
      applies_to: "joint_kit; separate_connectors; atom_req_joint_repair_kit_components; atom_req_joint_repair_supplementary_materials"
      rule: "For each actual SKU and one chosen upstream representation, job-attributable supply in its native Item(s) or kg = opening attributable stock plus gross external receipts net of tare minus closing carried stock, with matched units, scope and upstream burden carry. In gross-with-outlets mode input per reference = this already-attributed supply / accepted_joint_count_N and actual outward exits remain separate. Consumed-only mode additionally excludes the corresponding actual returned supply once from this already-attributed quantity and omits duplicate return output credit. Waste and releases remain burden-bearing fates. Kit component physical subledgers do not imply fabricated whole-kit count equivalence. Use only already-attributed same-scope quantities here, with remaining event_share = 1 under allocation_events. Consumed-only return subtraction uses the correspondingly attributed return; no second assignment."
      inputs:
        - cp_materials
        - gross_received_count
        - gross_received_net_kg
        - event_share
        - accepted_joint_count_N
        - opening_attributable_count
        - closing_carried_count
        - opening_attributable_net_kg
        - closing_carried_net_kg
        - inventory_view
        - outward_return_count
        - outward_return_net_kg
        - upstream_burden_carry
      output: "Actual SKU input Item(s) or kg per reference"
      source_ids: []
    - id: count_return
      applies_to: "atom_req_joint_repair_count_returns"
      rule: "Returned Item(s) per reference = outward_return_count times event_share / accepted_joint_count_N. Native count audit by SKU: opening_attributable_count plus gross_received_count equals final_used_SKU_count plus discarded_count plus outward_return_count plus closing_carried_count. No count inferred from waste kg."
      inputs:
        - cp_materials
        - opening_attributable_count
        - gross_received_count
        - final_used_SKU_count
        - discarded_count
        - outward_return_count
        - closing_carried_count
        - event_share
        - accepted_joint_count_N
      output: "Actual matched outward return Item(s) per reference"
      source_ids: []
    - id: mass_return
      applies_to: "atom_req_joint_repair_mass_returns"
      rule: "Returned kg per reference = outward_return_net_kg times event_share / accepted_joint_count_N. Mass audit by actual material: opening_attributable_net_kg plus gross_received_net_kg equals closing_carried_net_kg plus installed_retained_net_kg plus discarded_net_kg plus outward_return_net_kg plus actual_released_net_kg; destinations mutually exclusive and used_intermediate_kg nonadditive. Kit physical subledgers reconcile without duplicate purchases."
      inputs:
        - cp_materials
        - opening_attributable_net_kg
        - gross_received_net_kg
        - closing_carried_net_kg
        - installed_retained_net_kg
        - discarded_net_kg
        - outward_return_net_kg
        - actual_released_net_kg
        - event_share
        - accepted_joint_count_N
      output: "Actual outward material kg per reference and physical reconciliation"
      source_ids: []
    - id: energy_attribution
      applies_to: "repair_electricity"
      rule: "Electricity kWh per reference = actual same-boundary metered kWh plus only additional not-already-metered charging_loss_kWh, attributed by event_share / accepted_joint_count_N. Metered kWh is meter_end_kWh minus meter_start_kWh."
      inputs:
        - cp_energy
        - meter_start_kWh
        - meter_end_kWh
        - charging_loss_kWh
        - event_share
        - accepted_joint_count_N
      output: "Attributed supply kWh per reference"
      source_ids: []
    - id: fuel_input
      applies_to: "atom_req_joint_repair_job_fuel"
      rule: "Job-attributable fuel supply kg = opening attributable stock plus gross receipts net of tare minus closing carried stock, with same identity/scope and upstream burden carry. Gross-with-outlets input per reference = this already-attributed supply / accepted_joint_count_N, retaining actual outward outlets. Consumed-only input additionally excludes corresponding actual returned fuel once and omits duplicate return credit. Burned kg audit = opening_attributable_net_kg plus gross_received_net_kg minus closing_carried_net_kg minus outward_return_net_kg minus nonburned_waste_net_kg minus nonburned_release_net_kg minus other_nonburned_final_net_kg. Nonburned outlets are mutually exclusive; total_spill_audit_kg is not subtracted again. Recovered spills take final destination once; retained spills already belong to closing. Carry stocks/upstream burdens across the same scope. Use only already-attributed same-scope quantities here, with remaining event_share = 1 under allocation_events. Consumed-only return subtraction uses the correspondingly attributed return; no second assignment."
      inputs:
        - cp_fuel
        - opening_attributable_net_kg
        - gross_received_net_kg
        - closing_carried_net_kg
        - outward_return_net_kg
        - nonburned_waste_net_kg
        - nonburned_release_net_kg
        - other_nonburned_final_net_kg
        - event_share
        - accepted_joint_count_N
        - inventory_view
      output: "Gross fuel input kg per reference and actual burned kg audit"
      source_ids: []
    - id: water_input
      applies_to: "job_water"
      rule: "Job-attributable water supply kg = opening attributable stock plus gross receipts net of tare minus closing carried stock, with same identity/scope and upstream burden carry. Gross-with-outlets input per reference = this already-attributed supply / accepted_joint_count_N with actual outward outlets separate. Consumed-only input additionally excludes corresponding actual returned water once and omits duplicate return credit. Whole-water audit: opening_attributable_net_kg plus gross_received_net_kg equals closing_carried_net_kg plus installed_retained_net_kg plus outward_return_net_kg plus collected_liquid_waste_net_kg plus actual_evaporation_net_kg plus uncontained_liquid_net_kg, using exclusive final fates. Unknown balance is a gap. Use only already-attributed same-scope quantities here, with remaining event_share = 1 under allocation_events. Consumed-only return subtraction uses the correspondingly attributed return; no second assignment."
      inputs:
        - cp_water
        - opening_attributable_net_kg
        - gross_received_net_kg
        - closing_carried_net_kg
        - installed_retained_net_kg
        - outward_return_net_kg
        - collected_liquid_waste_net_kg
        - actual_evaporation_net_kg
        - uncontained_liquid_net_kg
        - event_share
        - accepted_joint_count_N
        - inventory_view
      output: "Gross actual water kg per reference and fate audit"
      source_ids: []
    - id: freight_attribution
      applies_to: "atom_req_joint_repair_freight"
      rule: "Compatible purchased t*km per reference = actual carrier_service_tkm times event_share / accepted_joint_count_N; compare each actual payload_net_t times distance_km with its compatible leg/service treatment, including declared empty-return scope."
      inputs:
        - cp_freight
        - carrier_service_tkm
        - payload_net_t
        - distance_km
        - event_share
        - accepted_joint_count_N
      output: "Actual purchased atom_req_joint_repair_freight t*km per reference"
      source_ids: []
    - id: provider_attribution
      applies_to: "atom_req_joint_repair_provider_service"
      rule: "Compatible completed purchased support h per reference = completed_hours times event_share / accepted_joint_count_N; use only actual matching Time/h service and completed resources/results, with scope exclusions."
      inputs:
        - cp_provider
        - completed_hours
        - event_share
        - accepted_joint_count_N
      output: "Compatible purchased support h per reference"
      source_ids: []
    - id: asset_attribution
      applies_to: "atom_req_joint_repair_shared_assets"
      rule: "Compatible asset service h per reference = target_driver_h / accepted_joint_count_N. Its full-life upstream burden share = target_driver_h / complete_life_driver_h applied to compatible manufacture, maintenance, replacement and EOL burden_source with exclusions. Complete denominator includes all jobs/nodes/periods and justified remaining service; do not add burden again as a second direct exchange."
      inputs:
        - cp_assets
        - target_driver_h
        - complete_life_driver_h
        - burden_source
        - accepted_joint_count_N
      output: "Actual compatible asset h per reference and disclosed upstream burden share"
      source_ids: []
    - id: waste_attribution
      applies_to: "atom_req_joint_repair_cable_cuttings; atom_req_joint_repair_resin_pack_waste"
      rule: "Actual fraction kg per reference = fraction_net_kg times event_share / accepted_joint_count_N, separately for actual host cuttings, resin cure-state/contamination and packaging fractions. Packaging tare is a material fraction once, not net resin. Link discarded_SKU_count to native count audit without conversion from mixed kg."
      inputs:
        - cp_waste
        - fraction_net_kg
        - event_share
        - accepted_joint_count_N
      output: "Actual receiver-specific waste kg per reference"
      source_ids: []
    - id: liquid_waste
      applies_to: "atom_req_joint_repair_wastewater"
      rule: "Actual collected liquid kg per reference = collected_liquid_waste_net_kg times event_share / accepted_joint_count_N; match actual identity, contamination, receiver and exclusive final fate without duplicate spill output."
      inputs:
        - cp_water
        - collected_liquid_waste_net_kg
        - event_share
        - accepted_joint_count_N
      output: "Actual collected liquid waste kg per reference"
      source_ids: []
    - id: release_attribution
      applies_to: "atom_req_joint_repair_actual_releases"
      rule: "For each actual substance/species and receiving medium select one supported basis: measured_species_kg, or actual_activity times factor_kg_per_activity_unit with matching activity_unit and applicability, or formulation_component_kg times component_fraction times fate_fraction. Attributed species kg per reference = selected supported species kg times event_share / accepted_joint_count_N. Keep whole_fluid_audit_kg nonadditive, routine/incident ownership distinct and uncertainty explicit; missing factor/fate is not zero.  For the composition route, formulation_component_kg is the actual pre-fate mass of the explicitly identified parent formulation or supplied commercial resin/hardener component. component_fraction is the target-species mass fraction in that exact same base, not a second mixing or dilution fraction; retain base identity/state and composition evidence. If the operand already is target-species mass, its target-species fraction is 1 and no prior composition fraction is multiplied again. fate_fraction is the independently evidenced released fraction of that target constituent. Fractions use dimensionless 0–1 values; source percentages are converted once by division by 100. measured_species_kg is already the released species mass and receives no extra composition/fate multiplier; a complete released-species activity factor is also not multiplied again by those factors. Missing composition or release-fate evidence remains unresolved."
      inputs:
        - cp_releases
        - measured_species_kg
        - actual_activity
        - factor_kg_per_activity_unit
        - formulation_component_kg
        - component_fraction
        - fate_fraction
        - event_share
        - accepted_joint_count_N
      output: "Actual species-and-medium kg per reference"
      source_ids: []
    - id: fuel_return
      applies_to: "atom_req_joint_repair_fuel_returns"
      rule: "Actual returned fuel kg per reference = outward_return_net_kg times event_share / accepted_joint_count_N; closing stock and actual recovered-spill destination remain exclusive."
      inputs:
        - cp_fuel
        - outward_return_net_kg
        - event_share
        - accepted_joint_count_N
      output: "Actual returned fuel kg per reference"
      source_ids: []
    - id: fuel_waste_attribution
      applies_to: "atom_req_joint_repair_fuel_waste"
      rule: "Actual nonburned fuel waste kg per reference = nonburned_waste_net_kg times event_share / accepted_joint_count_N; reconcile final recovered-spill destination and absorber/fuel fraction once."
      inputs:
        - cp_fuel
        - nonburned_waste_net_kg
        - event_share
        - accepted_joint_count_N
      output: "Actual nonburned fuel waste kg per reference"
      source_ids: []
    - id: water_return
      applies_to: "water_returns"
      rule: "Actual unused returned water kg per reference = outward_return_net_kg times event_share / accepted_joint_count_N, excluding closing stock and collected contaminated atom_req_joint_repair_wastewater."
      inputs:
        - cp_water
        - outward_return_net_kg
        - event_share
        - accepted_joint_count_N
      output: "Actual returned water kg per reference"
      source_ids: []
  data_quality_requirements:
    - id: quality_gate
      applies_to: "accepted_joint"
      requirement: "Actual current owner/kit/connector instructions and cable compatibility control. No universal voltage, time, insulation-resistance, cure or service-life default; full required cured-state/electrical acceptance is evidenced."
