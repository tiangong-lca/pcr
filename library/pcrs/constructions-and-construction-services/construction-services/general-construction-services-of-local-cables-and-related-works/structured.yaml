allocation_rules:
  - rule_id: allocation_joint
    applies_to: "joint_repair"
    rule: "No intended co-product is created. Attribute all actual attempts, cutback, mixing/pour cleanup, protection and tests to the actual positive final accepted N in the bounded comparable campaign. Discarded or abandoned jobs retain burdens; if N is zero the campaign cannot supply this accepted-reference dataset. Scrap sale is not a repair co-product or avoided-production credit."
    source_ids: []
  - rule_id: allocation_events
    applies_to: "joint_repair"
    rule: "Assign each finite pouch batch, changeover, isolation/setup and cleanup event a unique owner and period. Direct joint events use their actual IDs; shared events use recorded causal use shares across every consuming joint, including failed attempts. Report uncertainty and rejected paths; never count the same event both directly and in a shared pool. Every event record declares attribution_stage = raw_shared or already_attributed, source_scope_id, target_scope_id, original_source_quantity, source_event_share and attribution_record_id. A raw shared event is attributed once using a causal target share with all consumer shares summing to one; retain the original full event and every consumer, including failed attempts. The resulting job-attributable stocks, receipts, exits and activity operands already contain that share. All operands named job-attributable or opening_attributable_* in stock equations are these resulting target-scope quantities; the matching receipts, closing and fates must use that same scope. For an already-attributed operand set the remaining event_share to 1 in any downstream expression; retain source_event_share only as nonadditive provenance. Never apply it again or mix raw and assigned operands in one balance. Direct events use their unique owner and remaining share 1. If scope/stage is unknown, block calculation rather than assume a share. Final per-reference quantities divide by accepted_joint_count_N once."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "atom_req_joint_repair_shared_assets"
    rule: "For each actual asset use a compatible causal measured driver across all jobs/nodes/periods. Attribute full-life manufacture, maintenance, replacement and disposal burden by the target driver divided by the complete full-life driver. Use completed observed life or observed history plus justified remaining-service/replacement/termination/EOL scenario, source, uncertainty, sensitivity and update trigger. Missing denominator or coverage blocks final dataset. Period totals reconcile once; do not allocate full manufacture anew every reporting year."
    source_ids: []
  - rule_id: allocation_overlap
    applies_to: "joint_repair"
    rule: "Select gross-with-outlet or consumed-only inventory treatment explicitly and consistently. Gross input is net of tare before return netting; stocks preserve upstream burden. A consumed-only view cannot also claim the same return output credit. Count and mass physical subledgers, whole-fluid and species views, component and kit scopes, atom_req_joint_repair_freight and direct vehicles, provider and physical resources, asset/spares/rental scopes are mutually reconciled rather than added twice."
    source_ids: []
  - rule_id: atom_grouped_ledgers
    applies_to: "all actual-child records"
    rule: "Apply every existing stock, allocation, emission and closure formula separately by concrete child identity/material, state, one exchange property/unit, receiving medium and ownership/event scope. Native and converted views are nonadditive. A family diagnostic total is never a flow identity or every child numerator; keep incomplete portions explicit. Complete formulations, assemblies and genuinely bounded single-function services remain whole, with included constituents/resources not purchased again."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "joint_repair"
      flow_role: "Unique complete accepted joint"
      record_type: "foreground_record"
      raw_fields: "joint_id; attempt_id; period_id; cable_id; network_function; conductor_material; cores; CSA_mm2; cable_diameter_mm; insulation; rated_voltage_V; retained_end_slack; isolation_authority; prove_dead_result; connector_SKU; die_id; crimp_pattern; kit_SKU; pouch_lot; mixing_time; fill_time; cure_conditions; full_cured_state_criterion; cure_result; test_method; test_threshold; calibration; test_results; defect_closure; acceptance_time; acceptance_signature; accepted_joint_count_N; energisation_authority; backfill_authority"
      collection_method: "Verify owner isolation/compatibility and actual delivered instructions. Link every core and attempt to one joint; retain actual required cured-state and electrical results and signed final accepted IDs. N is positive unique accepted IDs; no attempt is counted twice."
      unit: "Item(s); recorded numeric units and categorical attributes"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed tests, cure evidence, actual kit/connector instructions and calibration; no catalogue field-test defaults"
    - protocol_id: cp_materials
      process_id: "joint_repair"
      flow_role: "Actual kit/component/consumable receipts, states and returns"
      record_type: "foreground_record"
      raw_fields: "joint_id; attempt_id; batch_id; period_id; material_id; SKU; kit_mode; included_scope; excluded_scope; opening_attributable_count; gross_received_count; final_used_SKU_count; discarded_count; outward_return_count; closing_carried_count; opening_attributable_net_kg; gross_received_net_kg; package_tare_kg; net_chamber_A_kg; net_chamber_B_kg; used_intermediate_kg; installed_retained_net_kg; discarded_net_kg; outward_return_net_kg; closing_carried_net_kg; actual_released_net_kg; unit_net_mass_kg; quantity_volume; volume_unit; density_kg_per_volume_unit; density_state; density_temperature; density_source; receiver; custody; upstream_burden_carry; event_share; accepted_joint_count_N; attribution_scope; inventory_view; transformation_id; opened_kit_count_audit; transformation_component_ids; component_net_kg; transformation_component_fates; attribution_stage; source_scope_id; target_scope_id; original_source_quantity; source_event_share; attribution_record_id"
      collection_method: "Record actual matched SKU native counts and weighed net mass with package tare separate. Gross input is before returns. Reconcile opening plus external gross receipts to closing carried stock, disjoint final used-SKU count, actual discarded count, outward returns and appropriate final mass destinations. Do not add internal issues or intermediate dosing as external exchanges; pair whole-kit/component scopes and retain their physical subledgers. Count-mass or volume-mass conversions require actual matching evidence. final_used_SKU_count excludes separately logged discarded_count; a failed used kit/connector has one declared native count final fate, not two. Job-attributable supply is same-scope opening attributable stock plus external net-of-tare gross receipts minus closing carried stock, with upstream burden carry. Gross-with-outlets retains actual outward exits; consumed-only also excludes corresponding actual returned supply once and has no duplicate return credit. Native final_used_SKU_count and discarded_count are disjoint final SKU states, not dosed/consumed activity. Count discarded only for an actual whole SKU assigned that final state; separate packaging/resin mass fates never fabricate whole-kit discarded count. Internal dosing is nonadditive. Opened-kit count is an audit activity linked by transformation_id to actual original SKU counts, component identities/net mass and final fates. Component physical records never imply invented whole-kit count equivalence; final_used_SKU_count, discarded_count, outward_return_count and closing_carried_count are disjoint final source-SKU states. Apply allocation_events to every input, stock, exit and activity operand: retain original shared records and attribution provenance, apply each share once, and use remaining event_share = 1 for already-attributed operands. Unknown attribution stage/scope blocks calculation."
      unit: "Item(s); kg; declared actual volume unit"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scale, receipts/labels, same-SKU unit mass, lot/chamber/net-pack evidence and return custody. Installed/retained excludes separate waste/releases. Retained spill is closing stock; recovered spill takes its final fate once"
    - protocol_id: cp_energy
      process_id: "joint_repair"
      flow_role: "Actual electricity and compatible use shares"
      record_type: "foreground_record"
      raw_fields: "joint_id; attempt_id; period_id; equipment_id; supply_boundary; meter_start_kWh; meter_end_kWh; charging_loss_kWh; included_scope; excluded_scope; event_share; accepted_joint_count_N; attribution_stage; source_scope_id; target_scope_id; original_source_quantity; source_event_share; attribution_record_id"
      collection_method: "Meter actual supply; difference readings with traceable charging-loss ownership. Reconcile direct and shared duty and exclude provider/generator overlap before attribution. Apply allocation_events to every input, stock, exit and activity operand: retain original shared records and attribution provenance, apply each share once, and use remaining event_share = 1 for already-attributed operands. Unknown attribution stage/scope blocks calculation."
      unit: "kWh"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration and all consumer shares sum to the observed event scope; documented absence for unused electricity"
    - protocol_id: cp_fuel
      process_id: "joint_repair"
      flow_role: "Fuel gross input, stocks, burned quantity and fates"
      record_type: "foreground_record"
      raw_fields: "joint_id; attempt_id; period_id; equipment_id; fuel_identity; opening_attributable_net_kg; gross_received_net_kg; closing_carried_net_kg; outward_return_net_kg; nonburned_waste_net_kg; nonburned_release_net_kg; other_nonburned_final_net_kg; total_spill_audit_kg; recovered_spill_final_destination; retained_spill_in_closing_kg; quantity_volume; volume_unit; density_kg_per_volume_unit; density_state; density_temperature; density_source; package_tare_kg; included_scope; event_share; accepted_joint_count_N; receiver; custody; treatment_scope; contamination; absorber_fuel_fraction_kg; attribution_scope; inventory_view; upstream_burden_carry; attribution_stage; source_scope_id; target_scope_id; original_source_quantity; source_event_share; attribution_record_id"
      collection_method: "Weigh net receipts and stocks or use actual traced conversion evidence. Burned kg equals opening plus gross receipts minus closing and mutually exclusive nonburned final outlets. Total spills are audit-only; recovered spills enter their final fate once and retained spills are already closing stock. Link actual burned fuel and device to species calculations, without treating whole fuel loss as generic elementary emission. Job-attributable supply is same-scope opening attributable stock plus external net-of-tare gross receipts minus closing carried stock, with upstream burden carry. Gross-with-outlets retains actual outward exits; consumed-only also excludes corresponding actual returned supply once and has no duplicate return credit. Apply allocation_events to every input, stock, exit and activity operand: retain original shared records and attribution provenance, apply each share once, and use remaining event_share = 1 for already-attributed operands. Unknown attribution stage/scope blocks calculation."
      unit: "kg; actual volume unit when evidenced"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Receipt/stock/fate reconciliation with same period/boundary; direct plant scope and conversion evidence"
    - protocol_id: cp_water
      process_id: "joint_repair"
      flow_role: "Water and recovered liquid fates"
      record_type: "foreground_record"
      raw_fields: "joint_id; attempt_id; period_id; water_identity; opening_attributable_net_kg; gross_received_net_kg; closing_carried_net_kg; installed_retained_net_kg; outward_return_net_kg; collected_liquid_waste_net_kg; actual_evaporation_net_kg; uncontained_liquid_net_kg; composition; receiver; treatment_scope; spill_event_id; recovered_spill_destination; event_share; accepted_joint_count_N; custody; attribution_scope; inventory_view; upstream_burden_carry; attribution_stage; source_scope_id; target_scope_id; original_source_quantity; source_event_share; attribution_record_id"
      collection_method: "Measure actual net receipts and final liquid fates; maintain whole-fluid balance and separately attributed substance releases as nonadditive views. Track contaminated liquid receiver and avoid adding recovered liquid both as a spill and as waste. Job-attributable supply is same-scope opening attributable stock plus external net-of-tare gross receipts minus closing carried stock, with upstream burden carry. Gross-with-outlets retains actual outward exits; consumed-only also excludes corresponding actual returned supply once and has no duplicate return credit. Apply allocation_events to every input, stock, exit and activity operand: retain original shared records and attribution provenance, apply each share once, and use remaining event_share = 1 for already-attributed operands. Unknown attribution stage/scope blocks calculation."
      unit: "kg"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Water meter/scale and receiver record; actual absence statement where unused; unresolved fate retained"
    - protocol_id: cp_freight
      process_id: "joint_repair"
      flow_role: "Actual purchased tonne-kilometre service"
      record_type: "foreground_record"
      raw_fields: "joint_id; period_id; carrier; leg_id; payload_net_t; distance_km; empty_return_scope; included_scope; excluded_scope; carrier_service_tkm; event_share; accepted_joint_count_N; attribution_stage; source_scope_id; target_scope_id; original_source_quantity; source_event_share; attribution_record_id"
      collection_method: "Use measured payload and actual leg route or verified compatible carrier service activity. Compare payload times distance with declared carrier treatment. Reconcile all consumers and direct vehicle scope. Apply allocation_events to every input, stock, exit and activity operand: retain original shared records and attribution provenance, apply each share once, and use remaining event_share = 1 for already-attributed operands. Unknown attribution stage/scope blocks calculation."
      unit: "t*km; t; km"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Waybills, leg records and transport dataset reference/scope; no double ownership"
    - protocol_id: cp_provider
      process_id: "joint_repair"
      flow_role: "Completed actual time-reference support"
      record_type: "foreground_record"
      raw_fields: "joint_id; period_id; provider_id; service_identity; actual_reference_property; actual_reference_unit; completed_hours; time_records; completed_results; included_scope; excluded_scope; event_share; accepted_joint_count_N; attribution_stage; source_scope_id; target_scope_id; original_source_quantity; source_event_share; attribution_record_id"
      collection_method: "Verify true purchased service identity and hour reference, actual hours and completed support results. Map included/excluded physical resources and asset/travel/waste scope; retain uncovered resources on physical cards. Apply allocation_events to every input, stock, exit and activity operand: retain original shared records and attribution provenance, apply each share once, and use remaining event_share = 1 for already-attributed operands. Unknown attribution stage/scope blocks calculation."
      unit: "h"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Contract, timesheets and isolation/test results; mismatch in actual service unit requires actual matching exchange"
    - protocol_id: cp_assets
      process_id: "joint_repair"
      flow_role: "Complete-life shared asset and all consumers"
      record_type: "foreground_record"
      raw_fields: "asset_id; asset_identity; lifetime_phase; period_id; consuming_job_id; consuming_node_id; measured_driver_unit; target_driver_h; complete_life_driver_h; manufacture_scope; maintenance_scope; replacement_scope; EOL_scope; direct_operation_exclusions; provider_rental_exclusions; observed_history; remaining_service_evidence; replacement_scenario; termination_scenario; EOL_scenario; burden_source; burden_uncertainty; sensitivity; update_trigger; accepted_joint_count_N"
      collection_method: "Compile all jobs/nodes/periods and causal compatible hour use, full-life component burden and complete denominator. Completed observed life or observed history plus justified remaining-life scenarios must cover manufacture through EOL. Attribute once, with direct operation/provider/rental/spare exclusions."
      unit: "h; actual upstream burden units"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset records, full consumer ledger, scenario sources and uncertainty/sensitivity; missing coverage or denominator blocks final dataset"
    - protocol_id: cp_waste
      process_id: "joint_repair"
      flow_role: "Actual removed materials, residues and package fates"
      record_type: "foreground_record"
      raw_fields: "joint_id; attempt_id; batch_id; period_id; waste_identity; origin_material; cure_state; contamination; fraction_net_kg; package_tare_kg; discarded_SKU_count; receiver; custody; transport_scope; treatment_scope; event_share; accepted_joint_count_N; attribution_stage; source_scope_id; target_scope_id; original_source_quantity; source_event_share; attribution_record_id"
      collection_method: "Weigh actual segregated fractions or traceable mixed composition, separating host cuttings, cured/uncured resin, packaging and contaminated consumables. Pair discarded counts with materials ledger. Link each failed attempt to actual receiver and avoid duplicate packaging tare or retained mould/resin. Apply allocation_events to every input, stock, exit and activity operand: retain original shared records and attribution provenance, apply each share once, and use remaining event_share = 1 for already-attributed operands. Unknown attribution stage/scope blocks calculation."
      unit: "kg; Item(s) for native discarded-count audit"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weigh tickets, actual composition/cure-state, receiver acceptance and legal route; no universal household-waste assumption"
    - protocol_id: cp_releases
      process_id: "joint_repair"
      flow_role: "Actual species/media, routine and incident emissions"
      record_type: "foreground_record"
      raw_fields: "joint_id; attempt_id; period_id; event_id; event_owner; routine_or_incident; substance_species; particle_size; receiving_medium; measured_species_kg; measurement_method; actual_activity; activity_unit; factor_kg_per_activity_unit; factor_source; factor_applicability; formulation_component_kg; component_fraction; fate_fraction; temperature_state; whole_fluid_audit_kg; calculation_basis; uncertainty; event_share; accepted_joint_count_N; formulation_base_identity; formulation_base_state; component_fraction_basis; composition_source; composition_fraction_unit; fate_source; attribution_stage; source_scope_id; target_scope_id; original_source_quantity; source_event_share; attribution_record_id"
      collection_method: "Use actual species measurements or valid activity-times-factor or actual component composition-times-fate calculations; keep evidence and units for all operands. Distinguish incident ownership and whole-fluid physical balance from partial-species view. Never calculate release from unexplained balance residual.  For a composition-based method collect the exact pre-fate base identity/state and mass, target species and fraction denominator, composition source and original fraction unit, and separate release-fate evidence as defined in release_attribution; distinguish an already species-resolved mass from a bulk formulation mass. Apply allocation_events to every input, stock, exit and activity operand: retain original shared records and attribution provenance, apply each share once, and use remaining event_share = 1 for already-attributed operands. Unknown attribution stage/scope blocks calculation."
      unit: "kg; actual matching activity units"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Instrument evidence or current applicable source/fate evidence with uncertainty; SDS content alone is not emission fraction or zero proof"
