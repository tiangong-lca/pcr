validation_rules:
  - rule_id: validation_route
    applies_to: "joint_repair"
    rule: "Reject incompatible local function, cable/connector/kit, missing isolation authority or exposure/slack and any excluded new-insert/trench/armour/shield/branch/shear-bolt/shrink-only/gel route. Actual approved ≤1 kV rating controls; no live-work permission is implied."
    source_ids:
      - un-cpc3-2025
      - 3m-90na-issue3
  - rule_id: validation_gate
    applies_to: "accepted_joint"
    rule: "Require actual preparation/crimp/seal/fill/lot/cure evidence, full required cured-state criterion, applicable calibrated electrical tests, defects closed and signed owner handover. Type-test numbers are not universal field settings. N is positive unique accepted joints only; incomplete/rejected/repeated attempts cannot inflate it."
    source_ids:
      - 3m-90na-issue3
  - rule_id: validation_burden
    applies_to: "joint_repair"
    rule: "Verify all actual campaign phases/periods and finite pouch batches, rejected states/rework loops, cleanup/changeover and shared-event ownership. Every failed attempt has a linked repair/waste/return/retained/release path and all burdens stay attributed. N=0 cannot yield an accepted-reference dataset."
    source_ids: []
  - rule_id: validation_balance
    applies_to: "joint_repair"
    rule: "Check one upstream kit mode and every bundled exclusion, native count including actual discarded count, net chamber/pack/material stocks and exclusive final fates. Gross net-of-tare input precedes return netting. Consumed-only and gross-with-outlet treatments cannot give duplicate return credit. Verify actual factor/volume conversion evidence; unknown/residual does not become zero or an elementary flow."
    source_ids: []
  - rule_id: validation_life
    applies_to: "atom_req_joint_repair_shared_assets; atom_req_joint_repair_provider_service; atom_req_joint_repair_freight"
    rule: "Require complete-life asset scope and all jobs/nodes/periods with compatible measured denominator and justified remaining-service/replacement/termination/EOL scenario where prospective. Missing denominator/coverage or unresolved service property/unit/results blocks final dataset. Cross-check direct operation, spares, tools, rental/provider and atom_req_joint_repair_freight for overlaps."
    source_ids: []
  - rule_id: validation_identity_range
    applies_to: "joint_repair"
    rule: "Resolve each actual concrete exchange with correct identity/state/gate/property/unit before final dataset production. Conditional actual identities require foreground evidence. Range evidence needs stay visible until representative independent evidence is supplied; structural check does not establish UUID verification, quantitative plausibility or publication readiness."
