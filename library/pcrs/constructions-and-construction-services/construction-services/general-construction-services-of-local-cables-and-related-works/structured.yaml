published_dataset_profile:
  dataset_role: "Foreground completed cable-joint repair service data package with downstream process/lifecyclemodel projections"
  downstream_use: "secondary_dataset; background_dataset after actual identity, quantity, scope and review gaps are resolved"
  allowed_use: "Declared compatible existing local LV unarmoured/unshielded multicore compression resin-cast fully cured straight-joint repair under its actual service conditions"
  excluded_use: "Unqualified cable sizes/conditions or different gates; new cable/route/trench; operation-life benefits; branch/armour/shield/shear-bolt/shrink-only/gel or building/telecom/HV work"
  required_metadata: "All reference qualifiers; actual joint/attempt/batch/period IDs; N; geography/time; gate and testing criteria; current actual instructions; kit mode/scope; native ledgers; provider/transport/asset coverage and destinations"
  required_quality_disclosure: "Measured versus calculated quantities; evidence needs/unknowns; rework completeness; physical balances and fate; identity status; full-life denominator/scenario source/uncertainty/sensitivity/update; allocation and representation exclusions"
  update_trigger: "Actual kit/resin/connector or cable/route change; acceptance criterion/gate change; significant job/rework/resource change; corrected identities/fates; new asset-life/consumer or provider scope evidence"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version3.0 explanatory notes,30June2025, printed286–287,54252. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Local electricity cable repair classification scope and exclusions; no numerical inventory factor"
  - id: "3m-90na-issue3"
    type: "handbook"
    reference: "3M Scotchcast Resin Kit90-NA-X Series, Inline Joint Kit with Resin470W, Issue3, undated printed3pages. Printed90NA identity differs from92NA URL. https://multimedia.3m.com/mws/media/2536250O/scotchcast-92na-resin-joints-data-sheet.pdf?fn=scotchcast-92na-resin-joints-ds.pdf"
    used_for: "Multicore nonshielded polymeric LV kit, compression subset, mould/paired pouch/kit contents; compatibility and current actual instruction need; catalogue tests and waste claims not universal field defaults"
  - id: "3m-resins-page"
    type: "handbook"
    reference: "3M UK low-voltage resins and joints page and linked Resin470 product page, accessed16October2026. https://www.3m.co.uk/3M/en_GB/electrical-construction-maintenance-uk/solutions/low-voltage-resins-and-joints/ ; https://www.3m.co.uk/3M/en_GB/p/d/b00042792/"
    used_for: "Polyurethane casting family and product-identity caution:470W link redirects470,2012 linked470 TDS is not transferable470W quantitative evidence;4GS earlier-energisation marketing belongs to another product"
