    - id: atomic_child_routing
      applies_to: "prep; mix; finish; dry_accept"
      requirement: "The following routes each child to its original role, node, unique unit and method CP. Independently apply that original role measurement, stock, source/fate, rework, share, conversion and normalization method to each actual identity/state child. Retain the original helper/selector role parameter as legacy_parent_role, but supply quantity operands from this child independent records; ROW_UNIT(child_row_id) is the explicit unit below. Reconcile stocks/transfers only within the same identity/state and compatible native unit, grouping different materials, media, states and units separately. Parent totals are non-exchange diagnostics, never copied as child operands or summed across unlike units. Unsupported original-helper applicability or missing actual conversion, denominator or evidence blocks finalization; field records cannot choose a new method. Original role-named formula operands remain ledger names rather than duplicate exchanges. A cross-unit legacy role executes by this mapping and actual child unit instead of inheriting a wrong fixed unit. Routing: prep_access_access => role=prep_access, node=prep, property=Duration, unit=h, CP=cp_prep; mix_reject_stale => role=mix_reject, node=mix, property=Mass, unit=kg, CP=cp_mix; mix_reject_contaminated => role=mix_reject, node=mix, property=Mass, unit=kg, CP=cp_mix; mix_air_water_vapour => role=mix_air, node=mix, property=Mass, unit=kg, CP=cp_mix; finish_access_access => role=finish_access, node=finish, property=Duration, unit=h, CP=cp_finish; finish_waste_plaster => role=finish_waste, node=finish, property=Mass, unit=kg, CP=cp_finish"
      evidence: "actual_child_register; legacy_parent_role; atomic_flow_row_id; independent_physical_quantity; exchange_unit; original_protocols"
    - id: atomic_range_noninheritance
      applies_to: "prep_access_access; mix_reject_stale; mix_reject_contaminated; mix_air_water_vapour; finish_access_access; finish_waste_plaster"
      requirement: "Retired parent numerical ranges, per-exchange screening instructions and rationales are retained only in implementation audit, applying to neither new child exchanges nor parent-family sums and never proportionally allocated. Each new child has independent evidence needs for actual quantity, identity/state, measurement/conversion, uncertainty and comparable independent observations. Add its own interval only after review confirms applicability to this independent object; never validate a batch with its own maximum. Original ranges of unchanged semantically compatible atomic objects retain their original status."
      evidence: "independent_child_measurement; independent_range_evidence; implementation_range_audit"
    - id: atomic_paired_quantity_provenance
      applies_to: "actual internal child source and recipient transfers"
      requirement: "Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      evidence: "source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
validation_rules:
  - rule_id: validate_reference
    applies_to: "accepted_skim"
    rule: "Require positive accepted net area with openings/reveals policy, declared actual system/thickness and final dryness evidence; exclude all unresolved rejects."
    source_ids: []
  - rule_id: validate_transfers
    applies_to: "prep; mix; finish; dry_accept"
    rule: "Match paired interface, paste and set-surface transfer ids and measured quantities; explain handling losses and state changes without forcing equality to final accepted area."
    source_ids: []
  - rule_id: validate_batch
    applies_to: "mix; finish"
    rule: "Require batch/zone links, off-spec paths, wash/changeover ownership and complete attribution; no batch cleaning or failed material may disappear."
    source_ids: []
  - rule_id: validate_shared
    applies_to: "all nodes"
    rule: "Reconcile shared utilities/equipment/mobilization across every consumer and relevant period; identify one owner for every burden and prevent duplicated upstream equipment service."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "finish; dry_accept"
    rule: "Require rejected-zone records and actual correction/discard paths linked to producing node; retain rework burdens while accepted area counts each accepted face once."
    source_ids: []
  - rule_id: validate_water
    applies_to: "mix; finish; dry_accept"
    rule: "Reconcile powder/water/paste and water retention, slurry, condensate and vapour with uncertainty; captured solids/liquid are waste, not invented direct emissions."
    source_ids: []
  - rule_id: validate_binding
    applies_to: "all cards"
    rule: "Verify concrete downstream UUID/support and actual qualifiers; ambiguous preparation, service, waste or pollutant umbrellas require foreground disaggregation and cannot inherit a generic UUID."
    source_ids: []
  - rule_id: validate_range
    applies_to: "all cards"
    rule: "Treat provisional reasoned screens as prompts for investigation, not universal acceptable limits, measured values or substitute inventory."
    source_ids: []
  - rule_id: close_atomic_prep_materials
    applies_to: "prep; cp_prep"
    rule: "Block final foreground completion until every actual object in atomic_prep_materials is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate."
    source_ids: []
  - rule_id: close_atomic_prep_access
    applies_to: "prep; cp_prep"
    rule: "Block final foreground completion until every actual object in atomic_prep_access is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate."
    source_ids: []
