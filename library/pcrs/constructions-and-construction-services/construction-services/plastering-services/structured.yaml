system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This methodology covers hand-applied interior gypsum finish plaster over an already suitable accepted plasterboard or undercoat surface, including local joints and edges, powder/water mixing, skim application, setting, trowelling and monitored drying to a declared decorative-readiness acceptance gate. Upstream substrate work, board manufacture and installation, basecoat construction, cement render, paint, demolition and hazardous removal are excluded. The route is a site work-lot and mixing-batch service. It does not establish a universal thickness, formulation, coverage rate or drying duration."
      source_ids: []
    - rule_id: scope_gate
      applies_to: "substrate; finish"
      rule: "Verify selected plaster suitability for the actual background and include local preparation; major substrate correction remains an upstream prerequisite."
      source_ids:
        - british-gypsum-multifinish-installation
    - rule_id: reaction_gate
      applies_to: "mix; finish; dry_accept"
      rule: "Powder and water form paste in mix; gypsum setting within finish changes retained composition. Report actual product and water states at handoffs, unreacted surplus and residues; do not invent a stoichiometric yield, gas by-product or complete reaction."
      source_ids: []
    - rule_id: dryness_gate
      applies_to: "dry_accept"
      rule: "Trowelling/setting does not prove dry-to-decorate readiness. Continue actual relevant ventilation/heating and monitoring until the declared criterion is met; the manufacturer's staged application timings are product-specific and provide no universal drying endpoint."
      source_ids:
        - british-gypsum-multifinish-installation
    - rule_id: utility_owner
      applies_to: "prep; mix; finish; dry_accept"
      rule: "Identify shared lighting, access platforms and equipment, every consuming node and service period; attribute measured service demand once and disclose mobilization, rental/capital and upstream coverage. Keep the full work lot through actual multi-day drying: record unaccepted surface and water at any reporting cutoff and carry its existing burdens into the same final accepted lot without resetting, truncating or counting them twice."
      source_ids: []
    - rule_id: water_destination
      applies_to: "mix; finish; dry_accept"
      rule: "Keep supplied mixing/finishing/cleaning water, retained water, collected slurry/condensate and actual vapour or direct discharge distinct. No wastewater or dust category may be assumed an elementary emission without substance and receiving-medium evidence."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Existing substrate accepted suitable for the selected gypsum finish, with substrate construction complete and local joints/edges identified"
  starting_condition_role: "Upstream handover prerequisite, followed by included local interface preparation"
  product_classification_scope: "A narrower interior gypsum skim route within plastering services"
  recursive_input_rule: "Purchased same-category service enters once as identified upstream activity; remove overlapping foreground operations and disclose any recursive truncation."
  upstream_dataset_requirement: "Link powder, supplied water, preparation materials, energy, equipment and transport services to compatible upstream datasets; substrate is an explicit upstream prerequisite with separate ownership, never silently assumed zero."
  disclosure: "Record excluded substrate production/repair and downstream decoration; construction-site location, period, starting acceptance, actual system, utility and waste responsibilities; report unavailable upstream coverage."
