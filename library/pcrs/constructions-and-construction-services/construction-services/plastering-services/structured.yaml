    - id: atomic_legacy_role_mapping
      applies_to: "prep; mix; finish; dry_accept"
      requirement: "Legacy roles are non-exchange stock, activity, fate or closure keys in the original CP. Independent child exchanges carry quantities; atomic_ requirements retain mandatory remaining-roster refinement and finalization blocks. Original raw fields, helpers and native-unit operands retain their responsibilities and reconcile by child identity and compatible unit, never adding parent totals or unlike units. Source-table Applies-to migration: prep_materials => atomic_prep_materials; prep_access => prep_access_access, atomic_prep_access; prep_waste => atomic_prep_waste; mix_reject => mix_reject_stale, mix_reject_contaminated, atomic_mix_reject; mix_packaging => atomic_mix_packaging; mix_air => mix_air_water_vapour, atomic_mix_air; finish_access => finish_access_access, atomic_finish_access; finish_waste => finish_waste_plaster, atomic_finish_waste"
