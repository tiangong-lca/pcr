allocation_rules:
  - rule_id: subdivision
    applies_to: "work_lots"
    rule: "Subdivide measured zones, batches and utility events before allocation; this route has no intended co-product. Unexpected saleable recovered outputs require their actual status and a separately justified burden decision."
    source_ids: []
  - rule_id: batch_owner
    applies_to: "mix; finish"
    rule: "Index all ingredients, paste transfers, cleaning and changeovers by batch and zone. Assign end-of-shift cleaning once using documented consumed batch mass or measured work time when direct metering is unavailable; preserve the denominator and uncertainty."
    source_ids: []
  - rule_id: shared_owner
    applies_to: "prep; mix; finish; dry_accept"
    rule: "Identify each shared asset, invoice/meter total and period; prefer direct metering, otherwise measured runtime/load or attributable service hours. Sum shares across all consumers to the measured total, including other trades, without duplicating rental/capital, lighting or mobilization."
    source_ids: []
  - rule_id: reject_owner
    applies_to: "mix; finish; dry_accept"
    rule: "Retain all failed-batch and rework burdens in the producing lot. Authorised return material keeps transfer ids and prior burden ownership; rework is additional actual activity, never negative avoided burden or accepted area."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_prep
      process_id: "prep"
      flow_role: "preparation input, interface, utility and residue"
      record_type: "zone records and meter/service logs"
      raw_fields: "lot_id; zone_id; substrate_acceptance; prep_material_mass; prep_metered_kwh; prep_shared_total_kwh; prep_shared_node_share; prep_direct_service_hours; prep_shared_service_hours; prep_service_share; prepared_area; prep_waste_mass; transfer_id; accepted_area; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Survey net surface, weigh materials/residues, read attributable meters and equipment logs; link final area by zone and custody receipt. Sum attributable preparation raw or linked derived quantities after unique-event reconciliation, then divide by positive same-lot accepted_area. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity aliases this record independent physical quantity keyed by atomic_flow_row_id under the original CP method and atomic_child_normalization, never another parent quantity. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      unit: "kg; kWh; h; m2"
      frequency: "Every zone and utility/service event"
      temporal_coverage: "Full work lot including rework and changeovers"
      site_scope: "Named project and preparation zone"
      aggregation_rule: "per reference flow"
      quality_evidence: "Survey/opening schedule; supplier identity; calibrated instruments; shared-share reconciliation"
