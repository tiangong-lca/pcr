product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.other-building-completion-and-finishing-services"
  classification_refs: "CPC 3.0 54790 — Other building completion and finishing services; proposed narrower relation"
  covered_products: "First horizontal, uncut, single glass-wool acoustic island installations with four adjustable wire suspensions and matched absorber anchors"
  excluded_products: "One-point/direct-bracket, angled/stacked, stone-wool or asbestos panels, structural fixing construction, complete ceiling systems and room acoustic commissioning"
  representative_product: "Ecophon Solo Square 1200 × 1200 × 40 mm with Connect Adjustable wire hangers and Connect Absorber anchors, IG402 alternative 1 horizontal single-panel route"
  production_route: "Receive and identify components; verify accepted support interface; mark panel anchor positions; fit absorber anchors; lift/support panel; engage four wires; adjust while supported; level, inspect retention and hand over"
  market_state: "Accepted installation service at signed handover, before normal occupied use"
functional_unit:
  what: "First installation of one declared horizontal glass-wool acoustic island"
  how_much: "1 Item(s)"
  how_well: "Correct matched panel and four-wire assembly; accepted structural support interface; retained connections, level, layout, suspension depth and clearance verified against approved product instructions and project layout"
  how_long_or_cycle: "One installation event through signed acceptance, including attributable corrective work before acceptance; no assumed acoustic service life"
  reference_flow_link: "accepted_island_installation"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers first installation of one factory-finished glass-wool acoustic island, suspended horizontally by four matched adjustable wires from pre-existing accepted structural fixing points. The representative route uses Ecophon Solo Square 1200 × 1200 × 40 mm and the single-panel horizontal part of IG402 alternative 1. The supplier is illustrative: another product requires evidence of the same glass-wool material, finished state, four-wire topology and permitted panel-anchor interface. Exclude construction or drilling of structural anchors; direct brackets; one-point suspension; inclined or stacked panels; cut-outs, on-site panel cutting or painting; full suspended-ceiling grids; added lights, services or other loads; vibration insulation; and occupied-room acoustic performance assessment. Installation acceptance confirms mounting and declared geometry. Laboratory absorption data alone cannot establish room reverberation or sound-level performance. Sources: ecophon-ig402-2024, ecophon-solo-square-spec, un-cpc3-notes-2025."
      source_ids:
        - ecophon-ig402-2024
        - ecophon-solo-square-spec
        - un-cpc3-notes-2025
    - rule_id: support_interface
      applies_to: "island_install"
      rule: "Verify the existing fixing layout and capacity for the actual assembly before lifting. Follow the selected manufacturer route; do not import bracket-route torque, one-point geometry, inclined/stacked limits or added-load allowances."
      source_ids:
        - ecophon-ig402-2024
    - rule_id: assembly_gate
      applies_to: "island_install"
      rule: "Include component receipt/unpacking, panel marking and absorber-anchor fitting, temporary lift/support, four-wire engagement/adjustment and inspection through acceptance. Record tool, charging, access, consumable and cleanup activities when used. Adjust with the panel supported according to the guide."
      source_ids:
        - ecophon-ig402-2024
    - rule_id: handover_limit
      applies_to: "accepted_island_installation"
      rule: "Confirm retention, matching components, position, horizontality, suspension depth and clearance against the exact instructions/project criteria. A rejected or uninspected island is not an accepted output. Occupied use, later maintenance/removal and demonstrated room acoustic improvement are outside this event."
      source_ids:
        - ecophon-ig402-2024
        - ecophon-solo-square-spec
    - rule_id: waste_release_split
      applies_to: "installation_waste_panel; installation_waste_wire_offcut; installation_waste_loose_glass_wool; installation_waste_wastewater; actual exchanges required by refine_airborne_release"
      rule: "Collected packaging, broken panels, trimmed wire and captured debris leave as destination-specific waste. Any actual airborne release requires identified substance/fraction, receiving air compartment and quantity evidence; captured dust is not an air emission. Missing evidence is a gap, not zero."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "Shared tools, chargers and access equipment are shared infrastructure when they serve several island-installation instances in the same job. Identify each shared asset, every consuming island/event, the bounded service/charging period, measured use or documented physical attribution driver, and one burden owner. Record direct quantities where possible; reconcile allocated shares to the measured shared total. Provider equipment lifetime is supplied through its service dataset, not an invented installation-time lifetime."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Finished panels and matched suspension components delivered to the site supply gate; suitable existing structural fixing points already installed, verified and accepted; work area accessible"
  starting_condition_role: "Declared prior physical interfaces; no claim that support construction has zero life-cycle burden"
  product_classification_scope: "Narrow acoustic-panel installation subset of CPC 3.0 54790; vibration insulation is outside this scope"
  recursive_input_rule: "If same-category installation is subcontracted, use the actual scoped subcontract service input and remove overlapping directly modelled work. Do not recursively substitute this PCR for an upstream burden dataset or count the same accepted island twice."
  upstream_dataset_requirement: "Require upstream panel, hardware, electricity, access and relevant delivery/treatment datasets matching actual material, technology, geography and gate. Declare whether delivered input datasets include site delivery and packaging manufacture."
  disclosure: "Record prior structural-anchor acceptance, exact four-wire route, inclusion of tool/lift operations and corrective work, upstream delivery gate, waste destination and all measured/estimated/unavailable activities. New structural fixing construction requires a separately disclosed process outside this PCR."
