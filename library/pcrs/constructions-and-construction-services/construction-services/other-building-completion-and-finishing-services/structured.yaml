allocation_rules:
  - rule_id: single_service_output
    applies_to: "island_install"
    rule: "The only intended output is the accepted installation service. Retain all attributable materials, powered-tool/access consumption, cleanup, failed attempts and corrective work through acceptance. Usable returns and wastes are disposition exits, not intended co-products."
    source_ids: []
  - rule_id: shared_event_attribution
    applies_to: "island_install"
    rule: "For several islands in one job, identify the event and consumers. Prefer direct records; attribute demonstrably shared resource totals using documented measured use or a justified physical driver, with shares summing to the event total. Preserve differing configurations as separate strata; do not assume equal counts are equivalent."
    source_ids: []
  - rule_id: reject_return_treatment
    applies_to: "usable_returns_panel; installation_waste_panel; installation_waste_wire_offcut; installation_waste_loose_glass_wool; installation_waste_wastewater"
    rule: "Link every reject to correction within island_install or a documented usable-return/waste exit. Exclude rejects from accepted count. Reconcile unused returned inventory once; do not credit failed installation effort, assume reuse for damaged material, or claim avoided virgin manufacture/recycling credits without a separately declared downstream method."
    source_ids: []
  - rule_id: access_energy_boundary
    applies_to: "access_service_lifting; access_service_support; access_service_work_access; installation_electricity"
    rule: "Document service provider and period, attributable access hours, and included equipment/fuel/charging burdens. Match the electricity boundary to the actual service dataset; keep one burden owner for each operation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_components
      process_id: "island_install"
      flow_role: "Panels, suspension and usable returns"
      record_type: "Receipt, issue, count, weighing and return records"
      raw_fields: "event_id; component_id; model; material; dimensions; finish; received_count; installed_count; replaced_count; returned_count; opening_stock; closing_stock; actual_net_mass; wire_length; anchor_position; destination; transfer_id; packaging_id; packaging_count; custody_owner; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Count and identify panels and every fitted suspension part; use calibrated weighing or traceable exact-part net-mass records for kg rows; reconcile receipts/stock/returns and keep accepted structural-fixing evidence separate. Aggregation detail: Attributable net component quantities per reference flow; reconcile usable returns once without removing consumed failed-work resources Record reusable packaging material, count, net mass, custody transfers and opening/closing stocks. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "Item(s); kg; mm"
      frequency: "Every installation and return/replacement"
      temporal_coverage: "Complete event through acceptance and assigned return disposition"
      site_scope: "One declared site and configuration stratum"
      aggregation_rule: "per reference flow"
      quality_evidence: "Invoices, part records, scale evidence, installation photographs, stock and return receipts"
    - protocol_id: cp_resources
      process_id: "island_install"
      flow_role: "Consumables, electricity, access and conditional water"
      record_type: "Meter, equipment log, issue and cleanup record"
      raw_fields: "event_id; resource_id; material; amount; unit; device; meter_start; meter_end; charging_boundary; equipment_id; service_start; service_end; service_hours; consumers; asset_id; period_start; period_end; attribution_driver; included_service_burdens; no_use_evidence; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Meter actual electricity including assigned charging; identify tool/lift operations and supported manual alternatives; record supplied consumables/water and access duration; document supplier boundary and shared-event attribution. Aggregation detail: Attribute shared totals once with documented physical evidence, then divide attributable event totals by accepted installations to obtain amounts per reference flow Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg; kWh; h"
      frequency: "Every resource use or shared event"
      temporal_coverage: "Whole installation including corrective work and cleanup"
      site_scope: "Same site/event/configuration stratum"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter readings/calibration, logs, issue records, provider scope, allocation reconciliation and actual no-use observations"
    - protocol_id: cp_handover
      process_id: "island_install"
      flow_role: "Accepted installation service"
      record_type: "Inspection and signed acceptance"
      raw_fields: "event_id; island_id; panel_model; dimensions; material; four_wire_route; suspension_part_ids; support_fixing_ids; support_acceptance; capacity_evidence; anchor_positions; retention; level; suspension_depth; layout; clearance; inspection_date; failed_checks; corrective_actions; acceptance_signature; accepted_count"
      collection_method: "Inspect against the exact product route and project layout; verify existing support acceptance, all four retained connections and supported adjustment; record actual geometry and corrective work before signed acceptance. Aggregation detail: Count only signed accepted islands; 1 Item(s) per reference flow"
      unit: "Item(s); mm"
      frequency: "Every island and corrective inspection"
      temporal_coverage: "First installation through signed acceptance"
      site_scope: "Identified island and site"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed checklist, approved layout/instructions, support acceptance and photographs"
    - protocol_id: cp_waste
      process_id: "island_install"
      flow_role: "Packaging, rejected materials and captured residues"
      record_type: "Weighing and destination manifest"
      raw_fields: "event_id; waste_id; material; state; source_operation; reject_id; net_mass; destination; carrier; receiving_gate; transfer_id; treatment_scope; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Separate and weigh actual packaging and discarded material/residue by material and destination; reconcile rejects against replacements and returns; identify actual liquid waste from any wet cleanup. Aggregation detail: Total attributable kg by waste identity/destination per reference flow; assign each waste transport/treatment burden once Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "Every waste exit"
      temporal_coverage: "Complete event and assigned waste handoff"
      site_scope: "Attributable site work only"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale/tare evidence, waste receipts, carrier/destination records and stock/reject reconciliation"
    - protocol_id: cp_air
      process_id: "island_install"
      flow_role: "Conditional direct release to air"
      record_type: "Activity assessment, monitoring or applicable factor record"
      raw_fields: "event_id; operation; material; substance; particle_or_fibre_fraction; receiving_compartment; method; measured_concentration; volume_or_activity; factor; factor_basis; captured_mass; release_mass; uncertainty; no_release_evidence; missing_evidence; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id"
      collection_method: "Assess actual handling and anchor fitting; retain monitoring or applicable reviewed factor with substance/fraction and air compartment; separate captured waste. Record justified non-occurrence and unavailable data distinctly. Aggregation detail: Aggregate identified release amounts per reference flow with method and coverage; never substitute missing data with zero Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "Every relevant operation or representative documented monitoring period"
      temporal_coverage: "Whole relevant event including cleanup"
      site_scope: "Specified work location and receiving air compartment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Monitoring/factor applicability, activity records, uncertainty and capture/destination evidence"
  calculation_rules:
    - id: event_normalization
      applies_to: "all inventory rows"
      rule: "For each configuration stratum, attributable event amount divided by signed accepted installation count gives amount per reference flow; retain excluded/failed work ownership and do not divide by merely supplied panels. If accepted count is zero, no accepted-service dataset can be produced."
      inputs:
        - "event quantities"
        - accepted_count
        - cp_handover
        - "relevant node protocol"
      output: "Amounts per 1 Item(s) accepted installation"
      source_ids: []
    - id: component_reconciliation
      applies_to: "panel_input; suspension_components_wire_assembly; suspension_components_lock; suspension_components_hook; suspension_components_absorber_anchor; suspension_components_cup; suspension_components_adapter; usable_returns_panel; installation_waste_panel; installation_waste_wire_offcut; installation_waste_loose_glass_wool; installation_waste_wastewater"
      rule: "Reconcile opening stock plus received items to installed components, usable returns, discarded components and closing stock on a consistent count/mass basis; retain replacement-event links and exact-part weighing evidence. Do not infer total assembly kg from nominal panel kg."
      inputs:
        - cp_components
        - cp_waste
      output: "Component balance and missing-record flags"
      source_ids: []
    - id: shared_resources
      applies_to: "installation_electricity; access_service_lifting; access_service_support; access_service_work_access; actual exchanges required by refine_handling_consumables; cleaning_water"
      rule: "Allocate each shared recorded event total across actual consumers using the documented physical driver; reconcile shares with the total, preserve the service dataset energy boundary, then use event_normalization."
      inputs:
        - cp_resources
        - cp_handover
      output: "Attributed resource amounts and boundary reconciliation"
      source_ids: []
  data_quality_requirements:
    - id: route_identity
      applies_to: "all inventory rows"
      requirement: "Retain glass-wool identity, finished single horizontal panel state, exact model and four-wire interfaces. Do not pool alternate suspension topologies or infer other manufacturers are equivalent."
      evidence: "Exact-product instructions, part records and installation photographs"
    - id: support_gate
      applies_to: "accepted_island_installation"
      requirement: "Document prior structural fixing acceptance and capacity evidence plus signed retained-connection/geometry inspection; unknown support or failed retention prevents accepted output."
      evidence: "cp_handover; approved project layout; ecophon-ig402-2024"
    - id: coverage
      applies_to: "all inventory rows"
      requirement: "Cover the entire event and corrective work; disclose missing quantities, uncertain attribution, conditional non-use and upstream delivery/treatment boundaries. Unavailable direct-emission evidence stays explicit."
      evidence: "All node protocols, balances and missing-data register"
    - id: representativeness
      applies_to: "all inventory rows"
      requirement: "Report site, dates, configuration, crew/access practice, metering coverage and measurement uncertainty. Pool only compatible declared configurations and retain source-event denominators."
      evidence: "Event register, cp_components, cp_resources, cp_handover"
    - id: identity_resolution
      applies_to: "all inventory rows"
      requirement: "Before final TIDAS exchanges, verify each actual concrete product/waste/elementary identity and its property/unit chain. Conditional umbrella cards are recording requirements, not concrete exchange UUIDs."
      evidence: "Concrete exchange detail/support confirmation and destination evidence"
    - id: refine_suspension_components
      applies_to: "suspension_components_wire_assembly; suspension_components_lock; suspension_components_hook; suspension_components_absorber_anchor; suspension_components_cup; suspension_components_adapter"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record four matched adjustable wire hanger positions and four matched panel absorber-anchor positions for the representative single-panel route; include actual wire assemblies, locks/hooks and any specified cups/adapters installed. Existing structural fixings are the prior interface, not newly consumed components. Record concrete component identities separately when building exchanges. Range evidence need: the guide determines connection topology, not a kg range. Use actual part weights and matching installation configuration; no approximate panel-mass conversion. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Different actual SKUs/configurations and other actual components require independent records; complete wire assemblies include internal locks/hooks once, only separate purchases activate extra children. Existing structural fixing prior interface; four positions design evidence not universal per-child mass coefficient."
      evidence: "cp_components; actual independent records and identity/unit evidence"
    - id: refine_handling_consumables
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella for actual disposable protection and dry cleanup materials used by this event. Split actual materials and verify each identity; reusable equipment belongs to the access service boundary. Range evidence need: collect route-specific consumable records; no presumed consumable dose. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual separately consumed product/SKU/state/material and independent quantity; reusable handling/access resources not disposable supply, no guessed chemical or supply occurrence."
      evidence: "cp_resources; actual independent records and identity/unit evidence"
    - id: refine_access_service
      applies_to: "access_service_lifting; access_service_support; access_service_work_access"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record actual lifting/support/access service hours and equipment configuration. If supplier service data already include equipment energy, identify that boundary and do not add the same electricity again. No equipment-hour conversion to panels is assumed. Range evidence need: site access and lift practice vary; record actual service duration, with no universal installation-time prior. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual provider scope/configuration and different native references require exact records. A genuine complete single provider lifting/support bundle is counted once in its appropriate complete service, not three internal purchases; no provider-included energy duplicate."
      evidence: "cp_resources; actual independent records and identity/unit evidence"
    - id: refine_usable_returns
      applies_to: "usable_returns_panel"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional exit for genuinely usable panels, suspension parts and reusable packaging returned to supplier/store or transferred to another job, identified by original product/material and destination. Record packaging custody and opening/closing stocks so reusable packaging is neither discarded waste nor a second net-input subtraction. Failed installed work remains unaccepted until corrected; not every removed item is reusable. Range evidence need: quantify returns by actual disposition; no generic salvage or avoided-production credit. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual suspension-part and reusable-packaging returns require each original SKU/state/native unit/recipient and stock/burden bridge; internal stock not output, failed installed work unaccepted until corrected."
      evidence: "cp_components; actual independent records and identity/unit evidence"
    - id: refine_packaging_waste
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record unpacked packaging by actual material and receiving reuse/recycling/disposal route. Reusable packaging returned as a product must be distinguished from packaging designated waste. Range evidence need: weigh actual packaging for the delivered model/pack and split destinations; no universal packaging fraction. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual discarded packaging material/composite/state and reuse/recycling/disposal receiver; usable reusable product returns separate, no assumed material shares or recovery credits."
      evidence: "cp_waste; actual independent records and identity/unit evidence"
    - id: refine_installation_waste
      applies_to: "installation_waste_panel; installation_waste_wire_offcut; installation_waste_loose_glass_wool; installation_waste_wastewater"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella for damaged glass-wool panels, discarded fasteners/wire offcuts and captured dust/debris. Split glass-wool, metal and other residues by material and destination; site construction waste outside the event is excluded. Include actual wastewater if wet cleanup produces it. Range evidence need: collect attributable reject and residue measurements; no assumed glass-wool waste factor or recycling recovery. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual fasteners/parts, contaminated carriers, metal/material/receiver differences need actual identity/quantity; exclude unrelated site waste, contained material not duplicated and direct air releases separate."
      evidence: "cp_waste; actual independent records and identity/unit evidence"
    - id: refine_airborne_release
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional semantic card requiring actual reported substance or particle/fibre fraction, receiving air compartment, event and measurement/factor basis before concrete exchange selection. Do not select a generic particulate UUID from the words glass wool; captured residues belong to waste. Range evidence need: no direct-emission factor or fibre-size distribution is established here. Obtain route/material-specific monitoring or an applicable reviewed factor before estimation. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_air; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
validation_rules:
  - rule_id: route_and_gate
    applies_to: "accepted_island_installation"
    rule: "Reject an accepted-output record without matched four-wire horizontal single-panel configuration, accepted support evidence, all required retained connections and signed installation inspection. Room acoustic results cannot substitute for this gate."
    source_ids:
      - ecophon-ig402-2024
  - rule_id: inventory_completeness
    applies_to: "island_install"
    rule: "Reconcile panels and suspension parts, usable returns, rejects and packaging; account for powered absorber-anchor fitting and actual access/charging/cleanup. Conditional zero-use must be observed and recorded, never inferred from pre-existing structural fixings."
    source_ids:
      - ecophon-ig402-2024
  - rule_id: reject_ownership
    applies_to: "usable_returns_panel; installation_waste_panel; installation_waste_wire_offcut; installation_waste_loose_glass_wool; installation_waste_wastewater"
    rule: "Every off-spec island has a linked correction or exit. Unresolved rejects do not enter accepted count; repeated installation efforts and replaced components remain attributable once."
    source_ids: []
  - rule_id: quantity_and_ranges
    applies_to: "all inventory rows"
    rule: "Confirm normalization to signed accepted service count, actual kg/count identities and matching units. No generic yield, installation time, assembly mass, energy or waste range is prescribed; record the evidence need and obtain route-specific reference data before using guardrails."
    source_ids: []
  - rule_id: emission_and_identity
    applies_to: "actual exchanges required by refine_airborne_release; all inventory rows"
    rule: "Require actual material/substance/fraction, receiving destination/compartment and applicable measurement/factor evidence for each concrete exchange. Missing identity or activity data remain disclosed gaps; no broad particulate identity or unsupported zero is acceptable."
    source_ids: []
  - rule_id: atomization_suspension_components_complete
    applies_to: "suspension_components_wire_assembly; suspension_components_lock; suspension_components_hook; suspension_components_absorber_anchor; suspension_components_cup; suspension_components_adapter"
    rule: "Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying refine_suspension_components with actual records; unresolved required expansion blocks the dataset."
    source_ids:
      - ecophon-ig402-2024
  - rule_id: atomization_handling_consumables_complete
    applies_to: "actual independently refined exchanges"
    rule: "Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying refine_handling_consumables with actual records; unresolved required expansion blocks the dataset."
