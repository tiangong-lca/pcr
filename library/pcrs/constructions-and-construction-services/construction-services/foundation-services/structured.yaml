validation_rules:
  - rule_id: scope_and_gate
    applies_to: "accepted_foundation_service"
    rule: "Confirm rotary insertion with subordinate thrust, no grout and approved steel cap interface for new construction. Required torque/depth and conditional load test criteria must be satisfied under actual current approved instructions; do not claim superstructure or building acceptance."
    source_ids:
      - chance-helical-installation-2017
      - un-cpc3-2025
  - rule_id: transfer_and_reference
    applies_to: "installed_pile_assembly, installed_pile_feed, accepted_foundation_service"
    rule: "Reconcile paired physical transfer IDs/count/configuration/purpose; preserve actual feed amount and count exactly one accepted group output as 1 Item(s). Failed/reaction assemblies cannot masquerade as accepted service quantity."
    source_ids:
      - chance-helical-installation-2017
  - rule_id: reject_closure
    applies_to: "all processes"
    rule: "Every failure/rejected section/cap/test has a linked rework/replacement/return/waste disposition and retained burden. Missing closure or reaction/remedial resources blocks final foreground acceptance."
    source_ids:
      - chance-helical-installation-2017
  - rule_id: custody_balance
    applies_to: "all material and waste rows"
    rule: "Check gross receipts, actual outward returns, installed/consumed/waste/loss and carried closing stock by exact identity, period and custody. No net-return/double-output, retained-stock export or unsupported recycling credit."
    source_ids: []
  - rule_id: asset_and_period
    applies_to: "asset rows"
