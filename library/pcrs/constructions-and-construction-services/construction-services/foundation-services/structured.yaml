  - rule_id: release_and_range
    applies_to: "all cards"
    rule: "Review every card-specific Range need and actual emission/waste completeness; verify native physical units and actual species/medium/fraction before concrete exchange binding. Unknown flow or support UUID and unknown actual bounds remain declared gaps, never fabricated near-matches."
