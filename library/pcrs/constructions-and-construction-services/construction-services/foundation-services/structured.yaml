product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.foundation-services"
  classification_refs: "CPC 3.0 54512 Foundation services; proposed narrower relation"
  covered_products: "Accepted rotary-installed ungrouted steel helical foundation installation at an approved steel cap/adapter interface for new construction"
  excluded_products: "Driven/pushed/vibrated piles; grouted piles; anchors; existing-building underpinning; concrete footing/grade-beam works; complete building; factory pile supply alone"
  representative_product: "One actual engineered installation contract group with a declared pile schedule and load-transfer interfaces"
  production_route: "Factory-fabricated/coated lead and extensions received → rotary insertion and bolted assembly → steel cap integration → conditional engineer-specified load test/rework → accepted interface"
  market_state: "Installed construction service at signed foundation interface handover, not factory steel or completed superstructure"
functional_unit:
  what: "Accepted specified ungrouted rotary-installed steel helical foundation installation service at its steel load-transfer interface"
  how_much: "1 Item(s) of one actual accepted contract group, not one hypothetical pile"
  how_well: "Approved design/location/angle/lead/extension/cap configuration, project torque/depth termination and any required load-displacement test acceptance; defects closed"
  how_long_or_cycle: "One actual installation campaign from mobilization through interface handover; retain dates across reporting periods and complete-life shared-asset attribution, not a universal building service life"
  reference_flow_link: "accepted_foundation_service"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers first installation of an engineered ungrouted steel helical foundation for new construction by rotary insertion with thrust subordinate to rotation, bolted lead/extension assembly and approved separately supplied steel load-transfer caps/adapters. It ends at the accepted foundation-to-superstructure steel interface ready to receive the separately owned structure. Actual project design, qualified installation, utilities clearance, termination and required testing govern. [chance-helical-installation-2017] Exclude impact, vibratory or push installation; grouted screw-displacement piles and micropiles; ground-anchor tiebacks; underpinning or jacking an existing structure; concrete footings, grade beams and excavation contracts; factory pile manufacture; the subsequent superstructure and operation. New enabling access or interface work attributable to the installation must be included with an explicit owner or recorded as an unresolved route-fit gap. Substantial excavation/concrete or incompatible site remediation requires a separately governed package, not silent omission. CPC 54512 is broader than this rotary route. [un-cpc3-2025]"
      source_ids:
        - chance-helical-installation-2017
        - un-cpc3-2025
    - rule_id: rotary_boundary
      applies_to: "all processes"
      rule: "Include mobilization, supplied components and actual logistics, rotary drive/thrust, extension joining, all attributable failed/reaction/remedial positions, cap integration, specified tests and defect closure. No grouting or concrete footing burden may be hidden inside this route."
      source_ids:
        - chance-helical-installation-2017
    - rule_id: enabling_owner
      applies_to: "rotary_install"
      rule: "Record actual temporary access, utility protection and obstruction handling resources with an explicit physical owner. Reusable mats enter asset attribution; consumed materials, freight, energy and actual removed material require concrete exchanges. If actual work cannot be represented, stop foreground finalization and extend the inventory under review. Do not declare needed work pre-existing."
      source_ids:
        - chance-helical-installation-2017
    - rule_id: ground_and_waste
      applies_to: "rotary_install"
      rule: "Rotary displacement does not imply exported spoil. Record actual removed obstruction/soil only with measured identity, custody and destination; retained ground is not a waste output or avoided-disposal credit. Returned reusable sections, discarded steel and elementary releases have different owners."
      source_ids:
        - chance-helical-installation-2017
    - rule_id: asset_periods
      applies_to: "all processes"
      rule: "Identify rotary carrier, torque head, drive adapters, access mats, cap tools, test jack/pump and reaction equipment. Track commissioning, use across this and other jobs/reporting periods, maintenance, replacement and end-of-life; allocate complete-life burdens to actual service with one matrix and one event owner. Missing lifetime/coverage evidence remains a blocker, never zero capital burden."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Qualified new-construction site with ground/utility conditions and engineered pile schedule declared; supplied prefabricated coated steel sections at supplier gate; enabling access condition and owner documented"
  starting_condition_role: "Ground is retained environmental starting stock, not a purchased material or automatically exported soil. Previously built access is starting infrastructure only to the extent actually present and outside this contract."
  product_classification_scope: "A bounded rotary ungrouted steel helical foundation installation within broader foundation services"
  recursive_input_rule: "If the same-category installation service is subcontracted, use one bounded provider package for its physical work and upstream coverage; remove overlapping local inventories and keep its actual output/gate distinct from supplied components."
  upstream_dataset_requirement: "Actual supplied fabricated/coated lead, extension, cap and hardware datasets at the declared gate; actual fuel/electricity/freight; complete-life owned asset production, maintenance and end-of-life or verified provider coverage. No duplicated steel forming/galvanizing."
  disclosure: "Site baseline; access/enabling ownership; provider gates; all failed/remedial/reaction piles; conditional tests; actual emissions/waste destinations; gross material reconciliation; period and shared-asset matrix"
