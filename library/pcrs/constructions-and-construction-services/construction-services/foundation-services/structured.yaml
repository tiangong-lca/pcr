allocation_rules:
  - rule_id: single_service
    applies_to: "accepted_foundation_service"
    rule: "The accepted group is the intended final output; no co-product from rejected steel, retained ground or temporary reaction piles is assumed. Use actual separate contract groups and resources when several products are delivered."
    source_ids: []
  - rule_id: rework_retention
    applies_to: "all processes"
    rule: "Failed depth/torque, damaged sections, misalignment, unacceptable cap or load test retain all attempts, additional sections, energy, relocation, extraction, reaction-pile work and retests in the accepted group. Link loop/event IDs and final reuse/return/waste disposition; unresolved failures cannot be accepted outputs."
    source_ids:
      - chance-helical-installation-2017
  - rule_id: gross_stock_return
    applies_to: "all material rows"
    rule: "Reconcile opening stock plus gross receipts with installed/consumed material, actual outward usable returns, measured waste/loss and closing retained stock by actual identity. Do not net returns in inputs then export them again. Closing stock is carried forward with its declared burden, not an outward exchange; actual reused components retain their prior allocation history. Gross receipts/issues mean material totals before returns or outward transfers are deducted, with vehicle/container tare already removed; they never mean gross loaded vehicle weight. Where gross_kg and tare_kg are recorded, subtract tare to obtain material mass entering the physical balance. Keep genuine outward flows and retained stock distinct."
    source_ids: []
  - rule_id: shared_complete_life
    applies_to: "asset rows"
    rule: "For each distinct asset use documented physical service during this job/node divided by actual complete-life service of the same unit and duty; apply that share to production, maintenance/replacement and end-of-life without duplicating operating fuel. Index every other consuming job/node/reporting period and reconcile total shares. If using a bounded provider service, document actual capital and operating coverage and remove the overlapping local rows.  For an asset whose life is completed, use observed full-life history. For an in-service asset, an evidenced prospective remaining-service, replacement, termination and end-of-life scenario is allowed; label forecasts separately from observed facts, record the denominator/source, uncertainty and sensitivity, and update when actual use, replacement or retirement changes. Do not fabricate a future retirement_date or assume an arbitrary default life; only missing evidenced complete-life coverage or denominator blocks finalization."
    source_ids: []
  - rule_id: period_events
    applies_to: "all processes"
    rule: "Declare mobilization/start, each installation/test/rework event, acceptance and stock close/open periods, plus asset commissioning/replacements/retirement. Assign each event once; reconcile carried-forward stock and remaining asset burden between periods without resetting lifetime at year end."
    source_ids: []
  - rule_id: atom_grouped_ledgers
    applies_to: "all actual-child records"
    rule: "Apply each existing formula only to its applicable role: material stock, asset lifecycle fraction/hourly provision, completed service event, internal transfer and species/fate calculations are distinct. Never apply material-stock or full-machine purchase equations to an asset share or service event. Within the applicable method group, use concrete child identity/material, state, one exchange property/unit, receiving medium and ownership/event scope. Native and converted views are nonadditive. A family diagnostic total is never a flow identity or every child numerator; keep incomplete portions explicit. Complete formulations, assemblies and genuinely bounded single-function services remain whole, with included constituents/resources not purchased again."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_install_materials
      process_id: "rotary_install"
      flow_role: "Leads/extensions/separate bolts and actual outward usable returns"
      record_type: "Part/lot stock and custody ledger"
      raw_fields: "contract_id; period_id; pile_id; purpose; part_id; model; grade; coating; opening_kg; gross_receipts_kg; gross_issues_kg; installed_kg; outward_returns_kg; waste_kg; closing_kg; unit_mass_kg; weighing_uncertainty_kg; receipt_id"
      collection_method: "Weigh by calibrated scales or traceable part-specific supplier masses; pair counts to model and supply bill. Reconcile opening plus gross receipts to installation, actual outward returns, waste and retained closing stock without netting twice; include reaction/failed/remedial positions."
      unit: "kg; part count; actual length m"
      frequency: "Each receipt/issue/use/transfer/test/rework/exit event and period close as applicable"
      temporal_coverage: "Complete actual contract campaign including mobilization, failed/reaction piles, retests and acceptance; link earlier/later stock and asset-life periods"
      site_scope: "Actual site, supplying lot/provider and named equipment/event; no unrelated job mixing"
      aggregation_rule: "per reference flow"
      quality_evidence: "Matched part/lot counts, calibration and supplier inclusion evidence; investigate residual beyond actual measured uncertainty; retain stock burden carry-forward, no fixed loss or range."
    - protocol_id: cp_install_energy
      process_id: "rotary_install"
      flow_role: "Actual installation diesel/electricity/hydraulic top-up"
      record_type: "Meter/tank/maintenance event record"
