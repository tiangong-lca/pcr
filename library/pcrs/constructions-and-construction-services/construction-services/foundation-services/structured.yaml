  calculation_rules:
    - id: event_normalization
      applies_to: "all inventory rows"
      rule: "Sum actual uniquely owned event quantities attributable to the accepted contract group; report per reference flow. Internal transfers cancel at the group boundary, and physical feed counts remain actual."
      inputs:
        - "Contract/event/period IDs"
        - cp_install_records
        - cp_cap_records
        - "relevant node protocol"
      output: "Actual exchange amount per reference flow"
      source_ids: []
    - id: direct_release_calculation
      applies_to: "installation_fossil_co2, installation_pm25, cap_fossil_co2"
      rule: "Use an actual measured species release, or a source-specific model with actual burned fuel B_kg from the energy protocol; fuel supply S_kg is never substituted for B_kg. A complete fossil-CO2 species factor multiplied by matched B/activity is used as already defined, with no additional carbon fraction, fossil fraction or 44/12. Alternatively calculate oxidized fossil carbon from B and documented composition: establish whether the carbon fraction is total-fuel carbon and whether a fossil share is a share of that carbon; apply each applicable share once. Treat oxidation/retained or unoxidized carbon once using one consistent basis, then multiply oxidized fossil-carbon kg by documented CO2/C molecular-mass ratio 44/12 once. Do not both apply an oxidation loss fraction and subtract the same retained carbon. PM2.5 uses exact measured fraction/species or a compatible equipment/duty factor times its actual stated activity; a fuel-based factor uses B, while other factor units require their own independently measured activity. Retain numerator/denominator units, complete-factor basis, source/version, measurement and uncertainty. No upstream fuel-production emissions are added as local exhaust; other actual species/media and nonburned fates require separate exact identities."
      inputs:
        - "Node emission and fuel protocols"
        - "actual measurement/composition/factor source"
        - "actual unit-conversion evidence"
      output: "Actual substance-specific emitted kg per reference flow and uncertainty interval"
      source_ids: []
    - id: component_balance
      applies_to: "lead_sections, extension_sections, coupling_bolts, steel_caps, cap_bolts"
      rule: "Opening stock plus gross receipts equals installed/consumed plus actual outward usable returns plus measured waste/loss plus closing stock for the same identity. Actual differences require investigation using measured uncertainty; do not create a balancing invented exchange."
      inputs:
        - "Node material and waste protocols"
        - "actual gross receipts and closing stock"
      output: "Reconciled physical stock/custody balance and declared carried-forward burden"
      source_ids: []
    - id: asset_service_share
      applies_to: "rotary_carrier_asset, rotary_head_asset, temporary_access_mats_asset, cap_tool_asset, test_equipment_asset, test_reaction_frame_asset"
      rule: "Actual node same-duty service divided by documented complete-life same-duty service gives fractional asset Item(s); apply to actual complete-life capital/maintenance/end-of-life burden with one consumer-period matrix. Keep fuel/energy separate and resolve missing life/terminal evidence before finalization."
      inputs:
        - cp_install_assets
        - cp_cap_assets
        - "actual asset lifecycle and consumer records"
      output: "Asset-specific fractional item and complete-life attributable burden per reference flow"
      source_ids: []
    - id: freight_measurement
      applies_to: "atom_req_rotary_install_installation_freight actual-child group"
      rule: "Actual payload kg divided by 1000 gives tonnes; multiply actual loaded route km to obtain t*km, with separately documented empty/shared-leg allocation and supplier gate coverage."
      inputs:
        - cp_install_logistics
        - "actual leg/provider records"
      output: "Actual tonne-kilometres per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: identity_and_gate
      applies_to: "all cards"
      requirement: "Actual identity, supply state, use, custody/waste status and elementary medium/fraction must match a verified concrete flow and independently verified property/unit chain before TIDAS exchange delivery. Candidate unresolved cards are not final exchange UUIDs."
      evidence: "Exact supplier/product/receiver records; platform detail/property/unitgroup chain; named unresolved manifest entries"
    - id: range_and_uncertainty
      applies_to: "all cards"
      requirement: "Obtain each card-specific missing Range evidence from actual approved configuration and complete campaign records; derive a traceable empirical or measurement uncertainty interval only for the stated gate and denominator. One reference item is a definition, not a physical intensity bound."
      evidence: "Actual minima/maxima or uncertainty method, instrument/specification evidence, sample/event coverage and exclusions; no illustrative guide values used as defaults"
    - id: period_completeness
      applies_to: "all processes"
      requirement: "Include failed/remedial/reaction positions, temporary access, mobilization, all supply/exit legs, standby, retests and actual emissions. Record each event once across periods; reconcile opening/closing stock and complete-life assets to other jobs."
      evidence: "Event coverage ledger, consumer-period matrix, receipts, handover and exception register"
    - id: project_gate
      applies_to: "accepted_foundation_service"
      requirement: "Current actual engineer/manufacturer instructions and approved deviations govern torque/depth/angle/cap/test limits. Record all measurement units, calibrated instruments, specified tolerances and exact acceptance source."
      evidence: "As-built pile schedule; torque history; approved cap/connection bill; test activation/load-displacement evidence; signed defect closure and interface handover"
    - id: atom_req_rotary_install_installation_freight
      applies_to: "rotary_install"
      requirement: "Mandatory actual-child refinement for rotary_install/inputs/product. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Record actual inbound, intersite and attributable equipment mobilization legs by payload/vehicle/supplier gate; product and freight dataset coverage must not overlap. Returns and waste haul legs retain their own event/destination attribution. Range evidence need: Collect tickets, route distances, payloads, loaded/empty allocation and supplier freight coverage per leg; no generic distance or mass substitution and Transport support remains independently required. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Measured tonne-kilometres from actual payload tonnes and loaded route km, with actual empty-leg method disclosed; split actual incompatible freight services. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_rotary_install_installation_freight is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_install_logistics; independent actual-child roster and evidence"
    - id: atom_req_rotary_install_installation_steel_waste
      applies_to: "rotary_install"
      requirement: "Mandatory actual-child refinement for rotary_install/outputs/waste. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Damaged leads/extensions, unrecoverable reaction/failed sections and actual trimming chips are waste only where discarded. Separate actual grade/coating/contamination and destination streams; do not aggregate materially different wastes or treat scrap as accepted foundation output. Range evidence need: Obtain weighed consignment, actual cut lengths/part weights where used, contamination and treatment evidence; no default scrap fraction or avoided virgin-steel credit. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Measured actual discarded steel stream mass by failed pile/cut event and receiver, with separate identities when grade/condition/destination differ. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_rotary_install_installation_steel_waste is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_install_waste; independent actual-child roster and evidence"
    - id: atom_req_rotary_install_removed_obstruction
      applies_to: "rotary_install"
      requirement: "Mandatory actual-child refinement for rotary_install/outputs/waste. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Conditional incidental removal approved within this route, with exact actual mineral/soil identity and custody. Different contaminated soils, rock, buried construction waste or reusable recovered material require separate correctly typed exchanges or route-fit review. Range evidence need: Collect obstruction event/location, approval, actual composition/contamination, weighbridge or measured volume with actual bulk-density evidence, receiver and enabling resources; no universal spoil yield. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Actual weighed discarded matched mineral stream to its documented receiver; zero where rotary displacement retains ground and no removal occurred. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_rotary_install_removed_obstruction is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_install_waste; independent actual-child roster and evidence"
    - id: atom_req_cap_accept_cap_steel_waste
      applies_to: "cap_accept"
      requirement: "Mandatory actual-child refinement for cap_accept/outputs/waste. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Actual unusable rejected caps/bolts or cut remnants go to documented waste receivers, split by actual grade/coating/contamination and destination. They remain attributable to the accepted group. Range evidence need: Collect consignment weights, item identities and rejected-state dispositions, including repeated cap attempts; no default scrap rate or recycling substitution credit. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Actual weighed discarded matched steel waste stream mass by cap/defect event and receiver; no duplicate counting with installation scrap. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_cap_accept_cap_steel_waste is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_cap_waste; independent actual-child roster and evidence"
    - id: atom_req_rotary_install_nonburned_diesel_fates
      applies_to: "rotary_install"
      requirement: "Execute cp_install_energy, cp_atom_req_rotary_install_nonburned_diesel_fates and the independent supply/burn methods. Enumerate every actual nonburned diesel fate by event, state and physical carrier or released substance/receiving medium: usable outward return, other-owner transfer, carried closing, contained waste and uncontained loss are distinct. Create each actual required exchange with one explicit property/unit and measured quantity before foreground completion; absent identities remain incomplete. A genuine mixed oil/water/absorbent carrier is one waste with its actual whole-carrier quantity; diesel-component mass is an auxiliary balance view, never an additional waste carrying the same contents. Never create a generic diesel elementary flow, equate loss with combustion, guess species/media, or default unknown to zero. Record cleanup resources, receiver, transport/provider coverage and ownership, with no duplicate stock/export/constituent burden."
