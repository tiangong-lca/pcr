  data_quality_requirements:
    - id: identity_gate
      applies_to: "all exchanges"
      requirement: "Finalize each actual material/provider/waste/substance identity and compatible support/property/unit before concrete dataset exchange creation. Expand each conditional umbrella into distinct actual identities. Reference candidate meaning is exact accepted repair, not generic wall paint/full court."
      evidence: "Actual supplier/SDS/provider and custody/substance data; verified detail and support chain"
    - id: host_scope
      applies_to: "host and accepted service"
      requirement: "Actual dense compatible host must qualify structurally and drain; existing acrylic does not prove sound underlying pavement. Record repair limits and actual current system compatibility."
      evidence: "Inspection/defect/drainage and substrate/coating compatibility records; current product instruction"
    - id: timing_units
      applies_to: "both nodes state/operations"
      requirement: "Retain actual units, specified tolerances and source for temperature/time/geometry/power/test attributes. Weather, drying and cure are measured event data; manufacturer example settings apply only to actual selected product."
      evidence: "Dated actual weather/coat/cure/line/test logs with current criteria"
    - id: completeness
      applies_to: "all resources and exits"
      requirement: "Reconcile receipts/issues/stock/true returns, wet/dry film, captured wastewater, actual species and waste custody; disclose any unreconciled difference. No presumed zero emissions, mandatory chemical recipe or missing actual local repairs. Record gross fuel input and reconcile actual burned activity separately from usable outward returns/transfers, retained stock, unburned waste and actual unrecovered release; incident spill totals must not duplicate recovered waste or environmental releases; route all exits by real custody/substance and do not treat unburned fuel as combustion activity."
      evidence: "Node ledgers, scale/meter uncertainty, actual species/capture and waste/return tickets"
    - id: period_asset
      applies_to: "shared services and assets"
      requirement: "Enumerate full campaign and all relevant asset lifecycle/reporting periods; link replacement/termination and all consumers. Justify causal shares, provider exclusions and carried stock; missing justified complete-life coverage or denominator blocks finalization; completed life uses observed history and still-in-service life uses justified labelled prospective scenarios, with denominator/source, uncertainty/sensitivity and update triggers."
      evidence: "Asset and provider coverage ledger; period and event IDs; complete-life share sums"
    - id: range_evidence
      applies_to: "every inventory row"
      requirement: "Numerical guardrails require independent compatible evidence by actual product/state/route/denominator. Current collection requests are explicit missing evidence, not a generic bound. Derive future empirical ranges from separate reviewed comparable campaigns and disclose sample/timing/uncertainty; do not validate a job with its own maximum."
      evidence: "Actual comparable independent records and uncertainty review; product-specific sources; explicit per-card Range evidence need"
