functional_unit:
  what: "Accepted existing outdoor acrylic tennis hardcourt recoating repair service"
  how_much: "1 Item(s) actual accepted contract, with court IDs and treated/line geometry"
  how_well: "Qualified sound draining compatible host; approved product system, texture/colour, dimensional and specified play-surface acceptance; defects closed"
  how_long_or_cycle: "One dated repair campaign through signed handover and opening permission; enumerate preparation/coating/cure/line/rework dates and asset production, use, replacement and end-of-life periods across all jobs. No promised playing life."
  reference_flow_link: "accepted_recoating_service"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers one bounded non-cushioned acrylic texture/colour and tennis-line recoating repair on an existing qualified outdoor dense asphalt court or compatible prior acrylic coating. The contract includes cleaning, loose-material removal, compatible localized nonstructural repairs, any specified compatible acrylic resurfacer, colour application and drying/curing, line marking, defect closure and signed repair handover. The actual product instruction and project specification govern. Exclude porous macadam permeability-preserving spray systems, new pavement/base/drainage, structural crack or subsidence remediation, concrete acid etching, cushion/rubber layers, artificial grass or clay, new nets/posts/fences/lighting, indoor courts and future play or recurring maintenance. A failed structural/drainage qualification requires a different repair scope before recoating; painting is not evidence of qualification."
      source_ids: []
    - rule_id: incremental_host
      applies_to: "retained host and prepare_host"
      rule: "Include actual inspection/preparation, cleaning/capture, loose removal and localized nonstructural repair before coating. Do not assign new-host burdens or avoided-new-court credit; structural/drainage failures are outside this approved recoating route."
      source_ids:
        - sportmaster-maintenance
        - sportmaster-neutral-ready-mix-202406
    - rule_id: physical_gates
      applies_to: "prepare_host; finish_surface"
      rule: "prepare_host owns dirty/loose or locally defective qualified host to clean smooth flush accepted host. finish_surface receives the same identified host area and owns optional compatible resurfacer, colour texture coats, drying/cure, lines and final repair handover. Transfer is physical state, not a second external product or extra court construction."
      source_ids:
        - sportmaster-neutral-ready-mix-202406
    - rule_id: system_identity
      applies_to: "all supplied coating-system products"
      rule: "Declare actual supplied product and recipe. Neutral Ready-Mix CMT68 requires separately supplied tint and no added application water; already coloured ready-mix and concentrate routes have different supply identities. Mixing/stirring is embedded, not a separate formulation output. Cleaning/tool water is separately measured."
      source_ids:
        - sportmaster-neutral-ready-mix-202406
        - sportmaster-tennis-surfaces
    - rule_id: residual_ownership
      applies_to: "both nodes residual and release exchanges"
      rule: "Include actual current preparation and application residues, captured wastewater, packaging and actual elementary releases. Purchased water is a product; actual abstraction is elementary input; captured wastewater is waste transfer, not every dissolved substance discharged. No generic paint-water pollutant or broad VOC/PM identity."
      source_ids:
        - sportmaster-neutral-ready-mix-202406
    - rule_id: complete_life
      applies_to: "prep_assets_washer; prep_assets_pump; prep_assets_mixer; prep_assets_tool; atomic_prep_assets; finish_assets_mixer; finish_assets_paddle; finish_assets_squeegee; finish_assets_line_equipment; atomic_finish_assets"
      rule: "Index owned washers, mixers, applicators and marking tools by asset, consuming node, other jobs and period; include production, maintenance, replacements and end-of-life attribution. A provider service must explicitly cover these burdens or expose an added uncovered share; retain remaining life/stock with its carried burden. Complete-life attribution does not require an in-service asset to have retired already: completed life uses observed history; an in-service asset may use evidence-supported prospective remaining service, replacement/termination and end-of-life scenarios. Label forecasts separately from observations, disclose total service denominator/source, uncertainty and sensitivity, and update when actual life events or use evidence change. Missing justified complete coverage or denominator blocks finalization; never invent a lifetime or future retirement."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Existing structurally sound, adequately draining dense asphalt/compatible acrylic outdoor court qualified by actual inspection; original construction is retained host stock."
  starting_condition_role: "Retained site asset for incremental repair; prior construction is outside this bounded service, current preparation/repair burdens remain."
  product_classification_scope: "Bounded outdoor sports facility repair within CPC54270, not all facilities or all repair systems."
  recursive_input_rule: "A supplied same-category repair subcontract is an upstream service with explicit court/activity coverage. Include once and exclude overlapping in-house inputs; never recursively recreate old court construction."
  upstream_dataset_requirement: "Actual supplied-state datasets for each product and service, with manufacturing, packaging, transport and complete-life asset coverage identified; unresolved identities/coverage block final concrete exchange finalization."
  disclosure: "Host qualification, geometry, repair limits, supplier system/instructions, receipts and stock, internal transfer owner, wastes/releases, logistics coverage, subcontract exclusions and period/asset ledger."
