allocation_rules:
  - rule_id: single_service
    applies_to: "accepted_recoating_service"
    rule: "One accepted contract receives all attributable preparation, finishing and defect/recoat burdens. No marketable co-product is assumed; old host retention and waste are not co-products or substitution credits. Divide a multi-contract campaign only by traceable court/run physical use, with measured shares and distinct accepted denominators."
    source_ids: []
  - rule_id: gross_stock
    applies_to: "all material inputs, returns and waste outputs"
    rule: "Reconcile opening usable stock plus gross receipts against application/use, true usable outward returns, waste/residuals and closing usable stock by lot and supplied/mixed state. Do not net receipts then export the return again. Closing stock carries declared upstream burden forward; no negative waste or automatic avoided production credit. Distinguish issue from receipt and wet from dry quantities."
    source_ids: []
  - rule_id: shared_complete_life
    applies_to: "prep_assets_washer; prep_assets_pump; prep_assets_mixer; prep_assets_tool; atomic_prep_assets; finish_assets_mixer; finish_assets_paddle; finish_assets_squeegee; finish_assets_line_equipment; atomic_finish_assets; operational services"
    rule: "Use measured asset/utility service drivers for every consuming node, other contract and reporting period; shares sum to the complete-life total without duplicate ownership. Record production, maintenance/replacement/retirement and end-of-life coverage and actual remaining life. Provider-inclusive service replaces only evidenced covered burdens; add uncovered share once with disclosed uncertainty. Missing justified complete-life coverage or denominator blocks finalization; an evidence-supported prospective in-service scenario is allowed, with forecast/observed distinction, uncertainty, sensitivity and updates."
    source_ids: []
  - rule_id: campaign_changeover
    applies_to: "both node material and operation records"
    rule: "Define actual repair campaign by contract/court and actual tint batch, coat/colour/line run, weather window and changeover event; do not infer a production batch from a sold pail. Attribute measured mixing, wash, setup, inspection and rework to consuming runs/contracts using actual causal drivers. Shared event has one owner; if a campaign crosses periods, maintain stable IDs and carry attributed balances without charging the event twice."
    source_ids: []
  - rule_id: rework_retention
    applies_to: "both nodes failed areas and material returns"
    rule: "Failed dirty/defective host returns to prepare_host; deficient colour/lines/cure return to finish_surface or underlying repair with actual event/transfer link. Retain original and corrective burdens in this contract, account consumed materials and outgoing rejects once, and count final acceptance once only after closed defects. Distinguish external usable supplier returns from waste and internal rework."
    source_ids:
      - sportmaster-neutral-ready-mix-202406
dataset_production:
  collection_protocols:
    - protocol_id: cp_prep_materials
      process_id: "prepare_host"
      flow_role: "Each actual supplied material, water source and recipe addition"
      record_type: "lot and event ledger"
      raw_fields: "contract_id; court_id; date; period_id; run_id; event_id; lot_id; product_identity; supply_state; formulation; gross_receipt_kg; issue_kg; opening_stock_kg; closing_stock_kg; outward_return_kg; scale_tare_kg; measured_gross_load_kg; water_meter_start_m3; water_meter_end_m3; density_kg_per_m3; temperature_degC; addition_identity; actual_recipe; supplier_coverage; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Collect delivery/stock/tare-weigh tickets and calibrated water meters by exact identity; distinguish receipts/issues, formulated/active content, factory included versus on-site added ingredient, bought versus abstracted water. Link actual tint batch/base and coating/run, record zero only with evidenced absence. Convert actual volumes only with documented density/temperature; derive uncertainty from scales/meters/lot variation. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity aliases this record independent physical quantity keyed by atomic_flow_row_id under the original CP method and atomic_child_normalization, never another parent quantity. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      unit: "kg by concrete material/source; raw m3 with density"
      frequency: "Every receipt, issue, addition, stock close and water-use event"
      temporal_coverage: "Full repair campaign including failed attempts and changeovers; stock at campaign boundaries"
      site_scope: "Actual contract courts, supplier lots and withdrawal source"
      aggregation_rule: "per reference flow"
      quality_evidence: "Supplier instructions/SDS; calibration/tare; invoices and stock/recipe reconciliation; exact lot/role and product compatibility; actual uncertainty and coverage; material balance uses measured gross load minus vehicle/container tare, before netting returns"
    - protocol_id: cp_prep_operations
      process_id: "prepare_host"
      flow_role: "Actual electricity, fuel, logistics and complete-life asset shares"
      record_type: "machine trip and asset service ledger"
