      evidence: "cp_assets; actual independent records and identity/unit evidence"
    - id: refine_consumables
      applies_to: "consumables_protective_sheet; consumables_wipe"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella for actual protective sheeting, wipes or cleaning materials. Supplied panel/mortar packaging is recorded physically with receipts and residuals, but its included upstream burden is not duplicated by creating a second purchase. Range evidence need: Actual material identities, invoices/issues, stock and cleanup records are required; no universal consumable or packaging mass interval is established. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual other cleaning formulations/products require exact native identities/quantities; panel/mortar embedded packaging stays physical receipt/residual audit without a second purchase."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_material_returns
