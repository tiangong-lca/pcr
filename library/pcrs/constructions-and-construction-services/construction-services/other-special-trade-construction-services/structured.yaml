system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers the first mortared installation of a factory-made refractory firebrick lining set in an accepted compatible, unlined, single-opening ornamental masonry fireplace firebox. The service includes host-interface preparation, wetting, installation, supported cold cure, authorized temporary-holder removal, defect closure and signed lining-stage handover. It is a narrower category within CPC 3.0 54590; the classification does not define the PCR identity. Exclude see-through fireplaces, optional arches/notching, combustion-air-hole drilling or air-kit installation, custom brick cutting, new shell/foundation/chimney construction, industrial furnace whole-lining services, first firing or operating commissioning, later relining and demolition. The accepted output carries no ready-to-fire, whole-fireplace, heating-efficiency or fire-rating claim. Use actual current compatible model, host and mortar instructions; the researched Mason-Lite document is printed REV 20090301a despite the URL filename2015 and upload path2022. It establishes an observed route, not universal current design applicability."
      source_ids: []
    - rule_id: installation_gate
      applies_to: "install_lining"
      rule: "Start only at accepted compatible unlined host; include cleaning/wetting, bedding and seams, supported cure, authorized holder removal, corrections and lining-only acceptance. Host repair outside this route requires its own declared dataset; do not hide attributable preparation."
      source_ids:
        - mason-lite-firebrick-rev20090301a
    - rule_id: void_and_support
      applies_to: "install_lining"
      rule: "Use actual matching instructions for hearth, rear, sides and joints. Preserve the intentional rear unsupported gap; do not full-bed or fill it by assumption. Cure support remains owned until authorized removal and stable acceptance."
      source_ids:
        - mason-lite-firebrick-rev20090301a
    - rule_id: provision_boundary
      applies_to: "install_lining"
      rule: "Include actual holder/tool/access production, upkeep, use, delivery/removal and terminal provision responsibility through declared service life or supplier service coverage. Identify target and other consuming jobs/periods, assign one owner and physical-use driver. Single-use provision receives full applicable burden."
      source_ids: []
    - rule_id: no_operating_stage
      applies_to: "accepted_lining"
      rule: "Stop at cold lining-stage transfer; no initial firing, fuel use, operation, future relining or whole-fireplace performance is inside this output."
      source_ids:
        - mason-lite-firebrick-rev20090301a
        - un-cpc3-54590
    - rule_id: asset_period_linkage
      applies_to: "holders_tools_temporary_holder; holders_tools_trowel; holders_tools_reusable_sponge; holders_tools_mallet; logistics"
      rule: "For each reusable provision asset, index production/procurement, deployment and service-use periods, upkeep/replacement events, and removal/terminal phase; link every input, event and supplied service share to those periods and one asset owner. Actual initial lining cure/removal remains within this job cycle; later reusable-asset periods belong only to declared provision attribution, not fireplace operation. Unresolved replacement or terminal responsibility blocks a finalized data package."
      source_ids: []
