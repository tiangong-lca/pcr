    - id: refine_solid_residuals
      applies_to: "solid_residuals_panel; solid_residuals_hardened_mortar; solid_residuals_wet_mortar"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record damaged irrecoverable panels, cured/unused mortar discarded, packaging and contaminated consumables when actual. Corrections are linked to install_lining; internal rework is not an outward waste. No useful coproduct or avoided production is assumed. Range evidence need: Actual segregation/weighing, hazard classification, receiver and replacement records are needed; no default breakage, mortar loss or packaging interval is evidenced. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual packaging/contaminated supplies and actual composition/hazard/receiver splits need exact records; internal corrections not outward waste, no useful co-product or credit."
      evidence: "cp_residuals; actual independent records and identity/unit evidence"
    - id: refine_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella for demonstrated fugitive material or direct wastewater release; no drilling/cutting dust, combustion emission or generic VOC is presumed in this uncut cold route. Each actual elementary exchange needs verified substance identity and medium. Range evidence need: Actual material safety/composition, measured release characterization, species/size fraction, medium and uncertainty are required; no emission factor or generic dust amount is evidenced. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_releases; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator retains original configuration strata, accepted state/gate and actual causal attribution; no unlike jobs/branches/routes treated as equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
