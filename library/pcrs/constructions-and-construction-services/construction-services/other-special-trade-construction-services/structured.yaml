      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Only actual outward product custody movements qualify. Rejected components returned to supplier retain actual product/waste legal state and declared upstream burden treatment. Retained closing stock is an internal balance with carried-forward burden, never this exchange. Range evidence need: Actual return weigh tickets, part/state identity, destination, supplier acceptance and burden disposition are needed; no return fraction or universal reuse credit is supported. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual individually returned hearth/rear/side panels, consumables and changed/recovered product states need exact original component/state/native unit/receiver/burden bridge. Product/waste legal state documented, retained closing stock not output."
