product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.septic-system-installation-services"
  classification_refs: "cpc:3.0:54342; narrower than Septic system installation services"
  covered_products: "Stub-bounded accepted installation of one actual factory polyethylene gravity septic tank with civil support, connection and reinstatement work"
  excluded_products: "Whole operating septic systems and dispersal fields; pump/treatment units; tank production; traffic or buoyancy-control installations; later maintenance"
  representative_product: "Actual approved IM-1060-type gravity tank installation at a dry qualified nontraffic site; model and local approval must be declared"
  production_route: "Job-specific excavation/support, factory vessel integration, connection, backfill/compaction/finish and actual installation acceptance"
  market_state: "Completed civil/connection installation service at defined stubs; factory tank is an upstream product input"
functional_unit:
  what: "Accepted gravity-fed nontraffic factory polyethylene septic-tank installation at defined stubs"
  how_much: "1 Item(s) accepted actual installation"
  how_well: "Approved actual model/capacity/compartments and gravity duty; sound vessel; compatible correctly levelled stubs, tees/gaskets/risers/lids; accepted support/backfill/finish and required installation tests"
  how_long_or_cycle: "One job from first site preparation through signed handover, including attributable damaged parts, failed installation, repair and retest. Asset attribution additionally indexes production, service periods across other jobs, maintenance/replacement and final removal. Future tank operation is separate."
  reference_flow_link: "accepted_tank_installation"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers first installation of a factory-made polyethylene gravity septic tank in a nontraffic location with demonstrated dry, non-buoyant site conditions. The accountable job includes utility clearance, actual excavation and level support preparation, vessel inspection/lowering, compatible inlet/outlet short stubs and sealing/tee connections, required access risers/lids, suitable backfill and compaction, surface drainage grading and erosion-resistant finish, and the actual specified installation-stage inspection/test. The gate is an accepted installed vessel bounded by explicitly located inlet and outlet stub endpoints. A tank by itself does not deliver a functioning complete septic treatment/dispersal system. Exclude onsite tank manufacture, traffic-load or high-groundwater anchorage routes, pumps/dosing/aeration/disinfection units, drainfields, building drains, ongoing wastewater treatment, pumping-out and later maintenance. Actual permit/design and model-specific approved instructions determine compliance; the cited manufacturer example establishes route responsibilities rather than universal dimensions or test settings. If the site needs excluded buoyancy or drainage-control works, route fit must be reassessed before applying this PCR."
      source_ids: []
    - rule_id: site_fit
      applies_to: "tank_installation"
      rule: "Require approved actual utilities/soil/groundwater/nontraffic assessment. Include excavation and level compacted support. Unsuitable soil removal and suitable replacement are measured. Reject route use when excluded buoyancy/traffic works are actually necessary."
      source_ids:
        - ads-septic-tank-installation-2024
    - rule_id: complete_assembly
      applies_to: "tank_installation"
      rule: "Reconcile factory bill of supply against vessel, gaskets, compatible stubs/tees, screws, lids and risers; record only genuine additional components separately. Lower undamaged tank, connect per actual permitted arrangement, support haunches, alternate sidewall backfill before top cover, compact and finish with drainage grading and erosion-resistant vegetation."
      source_ids:
        - ads-septic-tank-installation-2024
    - rule_id: water_and_tests
      applies_to: "tank_installation"
      rule: "Require only actual manufacturer/jurisdiction installation inspection/test obligations with recorded units and limits. The source does not require universal pre-backfill water filling; protective filling applies to an excavation at risk of filling with rain/other water. Record actual protection/test water and destination. Oregon riser test figures and vacuum warnings are not universal defaults."
      source_ids:
        - ads-septic-tank-installation-2024
    - rule_id: period_assets
      applies_to: "tank_installation"
      rule: "Index job phases preparation, lowering/connections, backfill/finish, inspection, repair/retest and handover. Link each shared excavator/compactor/tool asset to all consuming jobs and reporting periods, including production, service/maintenance/replacement and termination. Actual bounded provider coverage or evidence-based complete-life asset attribution must include capital and removal burdens without duplicating fuel/materials."
      source_ids: []
    - rule_id: soil_custody
      applies_to: "tank_installation"
      rule: "Track excavated native soil, onsite reused backfill, imported fill, closing stock and actual export by source/destination and actual product or waste status. Onsite transfer is a balance, not a new purchased soil input or co-product credit. Waste handoffs and characterized direct releases remain distinct."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "An approved qualified nontraffic site and an upstream factory tank at its declared supply gate. In-situ native soil is environmental starting stock; job-specific excavation, soil handling, support and reinstatement are foreground responsibilities."
  starting_condition_role: "Declared site condition and upstream purchased-product gate; neither zero-burden new excavation nor a complete operating septic installation"
  product_classification_scope: "Semantic tank-installation subset of CPC3.0 54342, with inlet/outlet stub limits"
  recursive_input_rule: "Do not recursively consume this same accepted final service for the same job. An independently supplied excavation/support service is a distinct bounded provider input only when its real work, quantities, responsibility and acceptance handoff exist; otherwise its operations stay inside tank_installation."
  upstream_dataset_requirement: "Factory tank and actual separate materials require cradle-to-supply datasets. Machinery/provider coverage must state production, use/maintenance and removal coverage and fill real gaps once; delivery/packaging included upstream must not be added twice."
  disclosure: "Declare actual scope owner, supply-kit bill, soil custody, field methods, all site work, installation acceptance, failures/retests, stock carry-forward and machinery service-period attribution. Future wastewater operation and downstream drains remain separately owned."
