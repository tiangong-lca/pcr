allocation_rules:
  - rule_id: job_attribution
    applies_to: "tank_installation"
    rule: "Attribute direct actual job materials/energy/site work including failures, repair and retest to the finally accepted job. Internal repair loops do not create another accepted output. Incompatible configurations or incomplete jobs are separated and disclosed, never denominator dilution."
    source_ids: []
  - rule_id: asset_attribution
    applies_to: "equipment_provision_excavator; equipment_provision_compactor; equipment_provision_lifting; equipment_provision_hole_saw"
    rule: "For each asset index production, each service/reporting period and consumer job, maintenance/replacement and final removal. Use actual documented service activity shares against complete supported service coverage, with residual/unused capacity explained. Retain capital/maintenance/removal burdens or verified provider inclusion once; fill missing provider phases explicitly and avoid duplicating included operational fuel. Do not assume universal lifetime or amortization."
    source_ids: []
  - rule_id: custody_attribution
    applies_to: "usable_product_returns_tank; usable_product_returns_gasket; usable_product_returns_clean_native_soil; solid_waste_tank; solid_waste_soil; actual exchanges required by refine_imported_support_fill"
    rule: "Maintain gross opening stock/receipts/issues/installed or consumed disposition/real outward returns/waste/closing stock balance by actual identity. All material input cards use gross job receipts/issues; placement or consumption is a disposition, not an alternate input basis. Consumed-fuel exchanges exclude unused/returned fuel reconciled separately. Retained stock carries a declared unconsumed burden forward and is not a product output. Returned products have original-lot burden custody and do not earn automatic substitution credit. Native soil reused onsite has handling burdens and no purchased-production burden. Any genuine coproduct outside this scope requires explicit separate allocation review."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_components
      process_id: "tank_installation"
      flow_role: "vessel/components and usable returns"
      record_type: "supplier bills and calibrated quantity/stock records"
      raw_fields: "job_id; lot_id; product_identity; model; included_kit_parts; gross_receipts; gross_issues; installed_amount; real_outward_returns; waste_amount; closing_stock; mass_kg; matched_item_count; product_specific_mass_evidence; dimension_unit; native_soil_provenance; transfer_id; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Reconcile factory bill and actual distinct extra roles using gross material receipts/issues and all dispositions, never net consumed/placed input. Weigh actual mass or use traceable matching supplier dimensions/mass; keep counted vessel/gasket records. Record real custody returns once and retained stock carry-forward. Cross-reference cp_soil native-soil provenance by transfer_id; use actual mass evidence to close counted vessel/gasket receipts against mass-based returns. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion. Count-supplied tank/gasket outward exchanges retain Item(s); measured kg is auxiliary balance evidence, never a second return flow. Native-origin clean soil uses site/excavation provenance linked to cp_soil, not a fictitious purchased-product lot or upstream soil-production burden."
      unit: "kg; Item(s); actual dimensions"
      frequency: "Each receipt/issue/install/return/replacement"
      temporal_coverage: "All preparation through final handover and failed attempts"
      site_scope: "Job and supplying lots"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed bills, serials, scale calibration, compatibility and lot balance"
    - protocol_id: cp_soil
      process_id: "tank_installation"
      flow_role: "excavation/support/backfill and finish"
      record_type: "site survey and material ledger"
      raw_fields: "job_id; native_soil_suitability; groundwater_state; excavated_quantity; surveyed_volume_unit; reused_onsite_quantity; import_mass_kg; material_identity; gross_receipts; gross_issues; placed_or_consumed; real_outward_returns; waste_quantity; closing_quantity; disposition_unit; moisture_basis; density_unit; finish_product_identity; closing_stock; exported_quantity; destination; custody_status; transfer_id; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Measure actual excavation and soil/finish custody by material state; use field survey and weigh tickets, measured conversion properties and explicit balance uncertainty. Pair native-origin soil export with cp_components outward-custody record using transfer_id and actual measured mass, preserving site provenance rather than a purchased lot. Record local placement/compaction/grade acceptance with actual units and limits; onsite soil transfer creates no purchased input. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg; actual surveyed volume and geometry units"
      frequency: "Each excavation/import/placement/export and finish acceptance"
      temporal_coverage: "Entire civil preparation, backfill, correction and finish"
      site_scope: "Actual excavation and controlled stock areas"
      aggregation_rule: "per reference flow"
      quality_evidence: "Approved soil/site report, calibrated survey/scales and signed placement/compaction/grade records"
    - protocol_id: cp_energy
      process_id: "tank_installation"
      flow_role: "fuels and electricity"
      record_type: "meter and fuel stock/task logs"
      raw_fields: "job_id; task_id; asset_id; period_id; fuel_identity; fuel_mass_kg; fuel_volume; fuel_volume_unit; density_value; density_unit; density_temperature; density_temperature_unit; electricity_kWh; charging_boundary; provider_inclusion; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Reconcile actual task fuel and metered electricity including rework. Any activity allocation uses recorded tasks and a documented denominator; identify provider included use and future operating-energy exclusion. Reconcile unused stock and unconsumed fuel returns outside the consumed-fuel exchange. Preserve each physical unit and conversion evidence. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg; kWh"
      frequency: "Each task/refuel/meter interval"
      temporal_coverage: "Preparation through repair/retest/handover"
      site_scope: "Job equipment and declared charging supply"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter/scale calibration, fuel/density evidence and provider coverage"
    - protocol_id: cp_water
      process_id: "tank_installation"
      flow_role: "actual supplied and outgoing installation water"
      record_type: "meter and test/disposition logs"
      raw_fields: "job_id; event_id; actual_requirement; water_source; fill_level_unit; supply_mass_kg; measured_volume; measured_volume_unit; density_unit; retained_water; treatment_handoff; direct_release; receiving_medium; test_method; test_duration; test_duration_unit; test_pressure; pressure_unit; test_temperature; temperature_unit; test_volume; test_volume_unit; acceptance_limit_unit; test_result_value; result"
      collection_method: "Determine actual water requirement from applicable instructions. Meter each fill including retests; reconcile retained water, managed waste handoff and actual direct release. Record actual test/protection method and every applicable pressure, temperature, level, volume and duration unit with specified acceptance and authority; do not assume universal water filling or vacuum testing."
      unit: "kg; actual volume/level/time/test units"
      frequency: "Each actual fill, test and disposition"
      temporal_coverage: "All installation-stage fill/repair/retest events"
      site_scope: "Tank/site and actual water receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Applicable approved instruction, calibrated meters, test/receiving records"
    - protocol_id: cp_assets
      process_id: "tank_installation"
      flow_role: "shared reusable assets and provision"
      record_type: "asset/service register and complete-life attribution"
      raw_fields: "asset_id; provider_id; coverage_boundary; production_phase; service_period_id; consumer_job_id; task_duration_h; total_service_basis; maintenance_event; replacement_event; termination_event; removal_coverage; allocation_decision; uncovered_phase; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Link this node and all other consuming jobs/reporting periods to each asset. Retain actual job hours or contract unit and complete-life service basis; document phase-by-phase provider inclusion, operational/capital separation, any gaps, allocation and no duplicate event ownership. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "h or actual verified contract service unit; h"
      frequency: "Each asset/job/period and maintenance/replacement/termination event"
      temporal_coverage: "Complete asset production/service/removal coverage plus this job"
      site_scope: "Actual assets/providers and all supported service consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset register, activity meters, provider dataset scope, lifetime/termination evidence and uncertainty"
    - protocol_id: cp_transport
      process_id: "tank_installation"
      flow_role: "delivery return and waste movements"
      record_type: "consignment and route records"
      raw_fields: "job_id; transfer_id; provider_id; origin; destination; payload_mass_t; distance_km; vehicle_class; included_legs; upstream_coverage"
      collection_method: "Match actual outward/inward shipments and included transport to material/provider coverage. Compute actual transport work only from compatible payload and route units; document included empty legs and ensure no repeated freight record."
      unit: "t km; original t and km"
      frequency: "Each actual consignment/haul"
      temporal_coverage: "All job deliveries, returns and waste disposition"
      site_scope: "Actual routes/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Tickets, route distance evidence, payload and dataset-leg coverage"
    - protocol_id: cp_acceptance
      process_id: "tank_installation"
      flow_role: "accepted installation reference"
      record_type: "signed installation inspection and test records"
      raw_fields: "job_id; model; capacity_unit; compartments; design_revision; permit; nontraffic_state; groundwater_evidence; stub_endpoints; invert_units; cover_units; connection_parts; test_method; acceptance_source; limit_units; failed_state; correction_id; retest_result; handover_signature; accepted_count"
      collection_method: "Count only complete accepted stub-bounded jobs. Match actual model/site/support/components/backfill/grade and required test/inspection records. Record applicable limits with units and close each defect/correction/retest; denominator includes accepted jobs only and retains attributable failure burdens."
      unit: "Item(s); actual design/test units"
      frequency: "Every job acceptance and correction closure"
      temporal_coverage: "First work through final signed handover"
      site_scope: "Actual installed tank and defined stubs"
      aggregation_rule: "per reference flow"
      quality_evidence: "Permit/design, manufacturer instructions, field acceptance and closed defect/retest ledger"
    - protocol_id: cp_waste
      process_id: "tank_installation"
      flow_role: "waste and actual environmental releases"
      record_type: "custody tickets and characterized release records"
      raw_fields: "job_id; event_id; material_identity; waste_status; composition; mass_kg; receiver; transfer_id; substance; receiving_medium; particle_size; activity_unit; factor_source; factor_basis; provider_inclusion; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Separate actual waste from usable return and internal stock. Weigh each waste stream and obtain receiver evidence. Establish substance/media and documented activity/factor or measurement for each direct release; deduplicate provider emissions and retain uncertainty. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg; original factor/activity units"
      frequency: "Each waste/release and corrective event"
      temporal_coverage: "All attributable job and failed-work events"
      site_scope: "Job and actual receivers/media"
      aggregation_rule: "per reference flow"
      quality_evidence: "Authorized receiver tickets, calibrated measurements, composition and compatible release factor evidence"
  calculation_rules:
    - id: job_normalization
      applies_to: "all inventory rows"
      rule: "Aggregate each distinct attributable actual exchange for the defined job boundary and divide by the matched accepted installation count; preserve its physical unit and all failed-work burdens. Do not aggregate unlike models without declared stratification."
      inputs:
        - "Node-specific job records"
        - accepted_count
        - cp_acceptance
      output: "Exchange amount per reference flow"
      source_ids: []
    - id: stock_reconciliation
      applies_to: "factory_tank; extra_gaskets; extra_pipe_tees_stub; extra_pipe_tees_tee; extra_access_parts_riser; extra_access_parts_lid; actual exchanges required by refine_joint_consumables; actual exchanges required by refine_imported_support_fill; finish_products_seed; finish_products_matting; usable_product_returns_tank; usable_product_returns_gasket; usable_product_returns_clean_native_soil; solid_waste_tank; solid_waste_soil"
      rule: "Reconcile opening stock and gross receipts with installed/consumed dispositions, actual outward custody returns, waste and closing stock separately by identity. Internal issues/transfers are paired ledger movements, not repeated external receipts."
      inputs:
        - cp_components
        - cp_soil
        - cp_waste
      output: "Identity-specific custody balance and carried-forward closing-stock burden"
      source_ids: []
    - id: asset_share
      applies_to: "equipment_provision_excavator; equipment_provision_compactor; equipment_provision_lifting; equipment_provision_hole_saw"
      rule: "Apply the documented actual job service share to complete supported asset phase burdens; reconcile all consumer/period shares and remaining capacity against the same service basis, with provider inclusions counted once."
      inputs:
        - cp_assets
        - cp_energy
        - "verified provider scope"
      output: "Attributed asset provision and explicit uncovered phase requirements"
      source_ids: []
  data_quality_requirements:
    - id: route_identity
      applies_to: "tank_installation"
      requirement: "Demonstrate actual nontraffic dry non-buoyant gravity route, permit/design/model, independent stub gate and full supply-kit completeness."
      evidence: "Approved site/design and actual bill of supply"
    - id: quantity_quality
      applies_to: "all inventory rows"
      requirement: "Retain actual identity-specific units, calibration, temporal/site/lot scope, conversion moisture/density or supplier mass, missing activity and uncertainty. No inferred defaults or zero-as-missing values."
      evidence: "Node-specific protocols and original records"
    - id: period_completeness
      applies_to: "equipment_provision_excavator; equipment_provision_compactor; equipment_provision_lifting; equipment_provision_hole_saw"
      requirement: "Complete asset phase/consumer/period coverage, replacement/termination and provider gaps; unresolved service-life evidence blocks final asset attribution."
      evidence: "Asset/service register and complete-life supporting records"
    - id: acceptance_quality
      applies_to: "accepted_tank_installation"
      requirement: "Match accepted count to signed handover, actual inspection/test criteria with units and closed repair/retest path; a tank installation pass does not prove sewage-treatment performance."
      evidence: "cp_acceptance and applicable manufacturer/jurisdiction documents"
    - id: custody_quality
      applies_to: "usable_product_returns_tank; usable_product_returns_gasket; usable_product_returns_clean_native_soil; solid_waste_tank; solid_waste_soil; water_waste; actual exchanges required by refine_direct_releases"
      requirement: "Reconcile source, quantity, condition, real receiver and status; stock carry-forward and wastewater retained onsite are balances, not fictitious outward exchanges."
      evidence: "Transfer, stock, water and waste ledgers"
    - id: refine_extra_pipe_tees
      applies_to: "extra_pipe_tees_stub; extra_pipe_tees_tee"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Inlet/outlet stub endpoints and actual code-approved tee arrangement define this component boundary; building drain and drainfield pipe are excluded. Range evidence need: Actual stub endpoint/length/diameter/wall thickness units, pipe/tee bill, measured mass or verified linear mass and local configuration are required. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual component models/materials need independent records; building drain and drainfield pipe outside defined stubs."
      evidence: "cp_components; actual independent records and identity/unit evidence"
    - id: refine_extra_access_parts
      applies_to: "extra_access_parts_riser; extra_access_parts_lid"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Access components required by the actual cover/model and local approval are integrated into the installed tank. Range evidence need: Actual compatible model/material/dimensions, quantities and measured or supplier-certified mass are required; no universal riser height or screw mass. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual independent fastener functions/SKUs and other access components require exact unit/quantity; factory-included riser/lid not duplicate."
      evidence: "cp_components; actual independent records and identity/unit evidence"
    - id: refine_joint_consumables
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Joinery consumables depend on the actual connection; supplied factory seals are not counted again. Chemical composition is recorded for any actual direct release. Range evidence need: Actual approved connection method, product composition, issued/remaining quantities and waste records are required; no blanket adhesive or solvent dosage. Gross receipt/issue and all custody dispositions must close for the same lot/state. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual separately supplied compatible joint/connection products by formulation/state/native unit and method; factory seals not duplicate and actual release composition separately recorded."
      evidence: "cp_components; actual independent records and identity/unit evidence"
    - id: refine_imported_support_fill
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Suitable native support may avoid imported bedding; imported material is included when actual soil support/backfill requires it. In-situ native soil movement remains in the soil ledger. Range evidence need: Actual excavation/support design, native-soil suitability, imported material weigh tickets/moisture, and field placed/stock balance are required; model examples do not prescribe universal volume or density. Gross receipt/issue and all custody dispositions must close for the same lot/state. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual independently imported material/grade/moisture/state/SKU in one unit, weighed or originally allowed evidenced density bridge, native suitable soil movements retain soil ledger without purchased upstream burden."
      evidence: "cp_soil; actual independent records and identity/unit evidence"
    - id: refine_finish_products
      applies_to: "finish_products_seed; finish_products_matting"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Surface finish is part of the actual installation; record supplied seed, matting or other required materials only when actually used. Range evidence need: Actual approved finish specification, distinct product identities and weighed issues/stock are required; no universal seeding or matting rate. Gross receipt/issue and all custody dispositions must close for the same lot/state. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual finish materials or seed species/mixes/SKUs require exact independently supplied product records, no assumed finish use."
      evidence: "cp_soil; actual independent records and identity/unit evidence"
    - id: refine_installation_fuels
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Fuel use follows actual machine/task records; supplier fuel properties and measured volume/density support any conversion to mass. Range evidence need: Actual equipment/task meter records, fuel type, refuelling and stock logs, density/temperature and provider coverage are required; no generic excavator consumption factor. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Each actual fuel/equipment/task supply has unique native unit, actual volume/density state for any mass bridge, independent burned activity, stock/return and nonreturned waste/loss upstream supply burden; no provider-inclusive duplicate."
      evidence: "cp_energy; actual independent records and identity/unit evidence"
    - id: refine_equipment_provision
      applies_to: "equipment_provision_excavator; equipment_provision_compactor; equipment_provision_lifting; equipment_provision_hole_saw"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Excavator, compactor, lifting gear, hole saw and hand/test tools may be shared across other jobs/periods. Provider-supplied services and owned assets need explicit nonduplicated coverage; service identity is not machine mass. Range evidence need: Actual asset id, installation task hours, all lifetime service periods/jobs, replacement/termination records and verified provider coverage are required; no universal lifetime, hours or ownership allocation. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual hand/test tool functions/models and incompatible native references require exact complete-life service/property/unit; keep all consumer periods, phase coverage/unused capacity and provider energy exclusions, no machine mass as service."
      evidence: "cp_assets; actual independent records and identity/unit evidence"
    - id: refine_usable_product_returns
      applies_to: "usable_product_returns_tank; usable_product_returns_gasket; usable_product_returns_clean_native_soil"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Usable components, packaging or legally transferred clean soil leave as product only with actual accepted custody and intended-use evidence; retained closing stock is not an outward exchange. For native-origin clean-soil export, preserve site/excavation provenance in cp_soil and the same transfer_id in cp_components outward-custody records; no original purchased-product lot or upstream soil production burden is required. For counted tank/gasket returns, the exchange uses the same Number of items / Item(s) as the received product. Retain the matching item/serial count and independently measured or traceable product-specific kg for the same transfer_id as auxiliary physical-balance evidence only; no default conversion and no second kg return exchange. Range evidence need: Actual receiving-party acceptance, usable condition, component identity/mass and transfer/return note are required; no assumed reuse credit or recovery fraction. Native soil needs cp_soil source-state/provenance and actual mass evidence. Returned counted vessels/gaskets need matching actual mass evidence and transfer_id. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual other components/packaging/material returns require original identity/state/recipient/native unit and burden bridge. Count-to-mass source observations retained only as nonadditive auxiliary; no separate kg return for same counted tank/gasket."
      evidence: "cp_components; actual independent records and identity/unit evidence"
    - id: refine_solid_waste
      applies_to: "solid_waste_tank; solid_waste_soil"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Waste custody includes rejected vessels and unsuitable/exported soil that actually has waste status. Supplier-managed packaging/waste already covered upstream is reconciled; usable returns are separate. Range evidence need: Actual waste classification, weigh/destination tickets and included-service evidence are required for each stream; no generic all-soil waste label or displaced-production credit. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual other discarded components, packaging and hazardous/composite/receiver differences need independent identities; supplier-covered management not double, no fictitious excavation soil production."
      evidence: "cp_waste; actual independent records and identity/unit evidence"
    - id: refine_direct_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Potential machine exhaust, dust, joint-product release or lawful direct water release requires actual substance/media evidence. Waste shipments are not elementary emissions; background/provider-covered emissions are not added twice. Range evidence need: Actual substance identity, medium, measured or sourced factor and activity, abatement and uncertainty are required; broad exhaust/dust or discharged water mass cannot stand in for a pollutant UUID. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_waste; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator retains original configuration strata, accepted state/gate and actual causal attribution; no unlike jobs/branches/routes treated as equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
