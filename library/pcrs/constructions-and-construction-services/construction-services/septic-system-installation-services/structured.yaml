    type: "handbook"
    reference: "Infiltrator Water Technologies / ADS, Infiltrator Septic Tank General Installation Instructions, February 2024, pp1-3 and6; https://assets.adspipe.com/asset/2c4fb1a6-27dd-4e01-9d46-c24e90bcd72b/Tank-General-Installation-Instructions.pdf"
    used_for: "Actual manufacturer route, nontraffic/site/soil and component instructions, backfill/finish, conditional protective filling and jurisdiction-specific testing; model examples are not universal values"
