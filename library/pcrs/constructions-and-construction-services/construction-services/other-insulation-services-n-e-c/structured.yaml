    source_ids: []
  - rule_id: v_materials
    applies_to: "collars; additional_fixings_hook; additional_fixings_anchor; additional_fixings_screw; additional_fixings_washer; usable_returns_collar; usable_returns_hook; usable_returns_anchor; usable_returns_screw; usable_returns_washer; component_waste_collar; packaging_waste_carton; packaging_waste_plastic_bag; packaging_waste_insert; captured_debris; cleaning_waste_cloth; cleaning_waste_loose_residue; cleaning_waste_wastewater"
    rule: "Reconcile component/packaging coverage and material exits with measured units and custody; split material-specific exits and preserve burden ownership at receiving gates."
    source_ids: []
  - rule_id: v_emissions
    applies_to: "actual exchanges required by refine_air_releases"
    rule: "Require actual identified release and measurement or reviewed task-specific factor; product VOC content, unspecified dust or silent zero is not an elementary-flow inventory."
