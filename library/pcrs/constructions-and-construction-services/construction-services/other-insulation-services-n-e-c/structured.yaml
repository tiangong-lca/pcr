allocation_rules:
  - rule_id: a_rework
    applies_to: "collar_install"
    rule: "Retain failed attempts, extra visits, replacement parts and cleanup in the responsible work-order burden. Only accepted complete stages form the denominator; unresolved rejects remain pending, with their incurred resources reported and not hidden by an inflated output count."
    source_ids: []
  - rule_id: a_shared
    applies_to: "tool_access_service_drill; tool_access_service_extractor; tool_access_service_charger; installation_electricity; logistics_service"
    rule: "Index shared drill/extractor/charger/access and transport services by provider, service period and every consuming job/visit, including collar_install initial and corrective visits. Attribute measured use directly where possible; otherwise use documented task time within that same complete service period. Reconcile shares to the full billed/metered resource and disclose other jobs. Count each service or energy component once."
    source_ids: []
  - rule_id: a_returns
    applies_to: "usable_returns_collar; usable_returns_hook; usable_returns_anchor; usable_returns_screw; usable_returns_washer; packaging_waste_carton; packaging_waste_plastic_bag; packaging_waste_insert; component_waste_collar"
    rule: "Use a gross issue and separate exit ledger: issued components/packaging = installed or consumed + usable returns + waste + stock change. Record actual returned product identity and destination separately; never both subtract it from gross inputs and give an avoided-production credit. Recovery or recycling credit requires a separately declared study method and receiving route, not a material label."
    source_ids: []
  - rule_id: a_products
    applies_to: "accepted_collar_installation"
    rule: "The accepted installation is the sole intended product. Usable surplus/packaging returns are custody transfers, not a second installation output; no automatic co-product split or future fire-performance credit is assigned."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "collar_install"
      flow_role: "accepted stage"
      record_type: "work order and inspection"
      raw_fields: "penetration_id; wall_config; pipe_config; annular_geometry; prior_seal_product; prior_seal_depth; prior_seal_acceptance; approval_id; approval_revision; current_instruction_version; required_faces; collar_model; hooks_anchors; initial_visit; correction_visits; accepted_stage_count; handover_date"
      collection_method: "Inspect and photograph every required face, reconcile the supplied component specification with the actual approval/current instructions, retain prior-seal acceptance and signed complete-stage handover. Report accepted homogeneous stages and pending/rejected jobs separately."
      unit: "Item(s)"
      frequency: "each penetration and each correction"
      temporal_coverage: "first visit through signed handover"
      site_scope: "declared site and work-order lot"
      aggregation_rule: "per reference flow"
      quality_evidence: "Approval/configuration comparison, current document applicability, all-face checklist, seal-condition record, dated acceptance and rejected-stage register"
    - protocol_id: cp_materials
      process_id: "collar_install"
      flow_role: "collars, fixings and cleaning supplies"
      record_type: "issue and stock records"
      raw_fields: "part_id; package_coverage; gross_issued_count; net_unit_mass; weighed_mass; supplied_hooks; extra_fixings; cleaning_product; cleaning_mass; label_mass; stock_change; returned_id; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Count actual issued collar models and separate extra parts; weigh consumables or use traceable net mass records. Retain kit contents and split cleaning/label inputs by actual identity. Keep gross issue separate from returns and stock change. Divide attributable lot quantities by accepted same-configuration stages after reconciliation. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "Item(s); kg"
      frequency: "each issue/return and work-order close"
      temporal_coverage: "all installation and correction visits"
      site_scope: "work-order store and point of use"
      aggregation_rule: "per reference flow"
      quality_evidence: "Invoices, batch/model labels, calibrated scale or traceable net mass, physical count and custody reconciliation"
    - protocol_id: cp_resources
      process_id: "collar_install"
      flow_role: "electricity, shared tool/access and logistics services"
      record_type: "meter and provider service ledger"
      raw_fields: "resource_id; provider; service_start; service_end; consumer_job_ids; visit_ids; billed_hours; task_hours; meter_kWh; charge_sessions; included_energy; included_transport; route; load; distance; receiving_gate; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Read actual metered drilling/extraction/charging use and bounded supplier service hours. Identify all consumers and periods, allocate shared amounts using measured consumption or documented task-time shares and reconcile to total. Record actual delivery/return movements and provider coverage. Retain actual transport load/distance metadata for later service matching, without a generic trip factor. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kWh; h"
      frequency: "each meter/service period and visit"
      temporal_coverage: "supply to final correction and cleanup"
      site_scope: "all consumers of each declared service period"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration/readings, provider scope, time sheets, full denominator, shares sum to one and no duplicate included energy/transport"
    - protocol_id: cp_exits
      process_id: "collar_install"
      flow_role: "returns and waste exits"
      record_type: "weighing and receiving records"
      raw_fields: "exit_id; originating_visit; material_identity; condition; mass; destination; recipient; stock_receipt; waste_classification; transport_owner; treatment_owner; transfer_date; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Weigh and separate usable surplus or packaging returns, damaged components, discarded packaging, captured drilling debris and cleaning residues by actual material and receiving gate. Reconcile issued stock, installed materials and exits; verify usable returns with receiving custody. Allocate only the declared work-order share to accepted stages; retain pending/reject burdens. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg; Item(s)"
      frequency: "each exit and work-order close"
      temporal_coverage: "all installation/correction/cleanup visits"
      site_scope: "declared installation and receiving gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated weights, transfer notes, recipient acceptance, material/waste classification and mass reconciliation"
    - protocol_id: cp_releases
      process_id: "collar_install"
      flow_role: "actual elementary air or other environmental release"
      record_type: "measurement or reviewed emission calculation"
      raw_fields: "substance_or_particle; composition; size_fraction; compartment; measured_mass; sampling_period; activity_record; factor_reference; capture_efficiency; uncertainty; controls; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id"
      collection_method: "Characterize actual uncollected drilling particles and any cleaning-related release separately by substance/particle identity and receiving compartment, with measured mass or a reviewed task-specific emission calculation. Retain control and capture evidence. Captured debris is waste, not emitted mass; VOC content is not an emission factor. Absence of measurement/factor is a data gap, not zero. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg"
      frequency: "each relevant operation or representative measured period"
      temporal_coverage: "all drilling, cleaning and corrections"
      site_scope: "actual foreground operation and environment boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Sampling/analysis, reviewed factor applicability, particle/chemical identity, measured activity, uncertainty and non-duplication with captured waste"
  calculation_rules:
    - id: lot_attribution
      applies_to: "all inventory rows"
      rule: "For each homogeneous accepted-stage lot, reconcile the attributable gross resource or exit amount including corrective work, then divide by its accepted complete-stage count. Report unresolved jobs and associated burdens separately; do not mix configurations without declared equivalence."
      inputs:
        - cp_acceptance
        - cp_materials
        - cp_resources
        - cp_exits
        - cp_releases
      output: "inventory per reference flow"
      source_ids: []
    - id: stock_balance
      applies_to: "collars; additional_fixings_hook; additional_fixings_anchor; additional_fixings_screw; additional_fixings_washer; usable_returns_collar; usable_returns_hook; usable_returns_anchor; usable_returns_screw; usable_returns_washer; component_waste_collar; packaging_waste_carton; packaging_waste_plastic_bag; packaging_waste_insert"
      rule: "Reconcile gross issues with installed/consumed quantity, usable returns, waste and stock change for each material and compatible unit. Use measured net unit mass when reconciling count and kg; packaging is separate from component net mass."
      inputs:
        - cp_materials
        - cp_exits
      output: "material-specific reconciliation"
      source_ids: []
    - id: shared_share
      applies_to: "tool_access_service_drill; tool_access_service_extractor; tool_access_service_charger; installation_electricity; logistics_service"
      rule: "Use measured task resource where available; otherwise allocate the bounded shared service by documented task time divided by total consumer task time within that service period. Reconcile every share to the actual billed/metered amount and provider coverage."
      inputs:
        - cp_resources
      output: "attributable service/resource amount"
      source_ids: []
  data_quality_requirements:
    - id: q_configuration
      applies_to: "reference product"
      requirement: "Keep actual approvals and current chosen instructions, material configurations and installed faces traceable. Product family marketing and historic rating maxima are insufficient for job acceptance."
      evidence: "cp_acceptance and source applicability review"
    - id: q_completeness
      applies_to: "all inventory rows"
      requirement: "Record drilling, extraction/charging, cleaning, shared access, logistics, packaging and corrective work; distinguish documented non-use, provider-included coverage and missing data."
      evidence: "cp_materials; cp_resources; cp_exits"
    - id: q_ranges
      applies_to: "all inventory rows"
      requirement: "Collect observed variability and uncertainty for the actual configuration. No manufacturer expansion ratio, thermal limit, rating duration or VOC content supplies an installation inventory Range."
      evidence: "Per-card Range evidence needs and actual lot records"
    - id: q_identities
      applies_to: "all inventory rows"
      requirement: "Resolve every actual product/waste/elementary exchange and its support property/unit chain before final TIDAS dataset emission; split conditional aggregate roles into concrete identities."
      evidence: "Verified detail and support evidence; explicit unresolved manifest entries"
    - id: q_releases
      applies_to: "actual exchanges required by refine_air_releases"
      requirement: "Distinguish released particles/substances from captured dust and disposed wipes; never claim generic zero emissions from absence of wet sealing."
      evidence: "cp_releases and cp_exits"
    - id: refine_additional_fixings
      applies_to: "additional_fixings_hook; additional_fixings_anchor; additional_fixings_screw; additional_fixings_washer"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record only hooks, approved mechanical anchors/screws and washers not already supplied within the collar kit, plus actual replacements. Split each actual component identity and net mass when required; the selected system governs its suitability. Range evidence need: Obtain actual package bill of materials, required hook/fixing arrangement and extra/replacement issue records. Different pipe sizes and substrates require different compatible quantities; the W-L-2078 example cannot supply a generic quantity or loss Range. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual component/SKU and assembly-specific suitability need exact records; actual kit-included parts not new purchase, measured mass is nonadditive auxiliary."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_cleaning_supplies
      applies_to: "cleaning_supplies_cleaner; cleaning_supplies_cloth; cleaning_supplies_water"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional on actual use: record each cleaning product, cloth or water supply and identification material separately by exact product and mass. Cleaning the pipe contact zone and identifying the stage do not authorize new wet annular sealing. Range evidence need: Collect actual cleaning method, supply identity, mass and variability from job records; no generic solvent, water or label consumption is prescribed. If the existing interface needs sealant repair, leave this route for separate corrective work. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual identification forms/cleaning products need exact product identity and independent quantity; no new wet annular sealing or whole prewetted carrier constituent duplicate."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_tool_access_service
      applies_to: "tool_access_service_drill; tool_access_service_extractor; tool_access_service_charger"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record actual supplier-owned drill, extractor, charger and access equipment services by provider and bounded hire/service period. They may serve this node across initial and corrective visits and other work orders; provider production/maintenance burdens remain within the disclosed service scope. Range evidence need: Obtain billed scope, actual service hours, consumer job/visit ledger and observed variability. No tool lifetime, replacement frequency or standalone Duration support identity is inferred; a different own-capital route requires additional multi-period review. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual access-equipment functions/other models and different native service references require precise complete service/property/unit, all consuming work orders/visits and bounded provider production/maintenance coverage."
      evidence: "cp_resources; actual independent records and identity/unit evidence"
    - id: refine_usable_returns
      applies_to: "usable_returns_collar; usable_returns_hook; usable_returns_anchor; usable_returns_screw; usable_returns_washer"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional: each unused collar/fixing or reusable packaging item is a separate product identity only when usable condition and receiving supplier/store custody are documented. This card describes exit roles, not a generic mixed-material product. Provider-owned tools return within their service contract and are not material coproducts here. Range evidence need: Obtain physical condition, actual component/packaging identity, receiving acceptance, mass and variability. Do not assume all packaging is reusable or give an avoided-production credit merely because it leaves the site. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual reusable packaging and other returned products require exact state/recipient and inbound matching native unit; provider tools return within service, not material co-products."
      evidence: "cp_exits; actual independent records and identity/unit evidence"
    - id: refine_component_waste
      applies_to: "component_waste_collar"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional: components damaged or rejected during fitting leave collar_install for the documented receiving waste route when not accepted as a usable return. Keep steel housing/intumescent composite and other materials separate where classification or destination differs; do not relabel a rejected whole installation as an accepted service. Range evidence need: Obtain rejected-part records, material classification, actual receiver and measured variability. No standard scrap rate, automatic recycled-metal identity or recovery percentage is prescribed. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual separate discarded fixing components and different hazard/receiver states need separate exact identity/quantity; do not disaggregate contained collar material without a real separately dispatched stream."
      evidence: "cp_exits; actual independent records and identity/unit evidence"
    - id: refine_packaging_waste
      applies_to: "packaging_waste_carton; packaging_waste_plastic_bag; packaging_waste_insert"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional: record actual cartons, plastic bags, inserts or other discarded packaging by material and destination. Incoming collar package coverage includes packaging supply burdens where declared; output mass does not create a second packaging input. Confirmed reusable packaging belongs to the independent packaging-return requirement in refine_usable_returns. Establish its own actual packaging identity, usable state, recipient and same inbound native property/unit with an independently measured outward quantity before dataset completion. Never record packaging on collar, hook, anchor, screw or washer return cards, and never subtract returned packaging as returned installed components. Range evidence need: Obtain packaging composition, mass, recovery eligibility and actual receiving records. No default packaging ratio or recycling credit is supported by the collar product specification. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual materials/composites/receiver splits need real roster; kit-included packaging manufacture already owned upstream and output does not create second input; reusable product returns excluded."
      evidence: "cp_exits; actual independent records and identity/unit evidence"
    - id: refine_cleaning_waste
      applies_to: "cleaning_waste_cloth; cleaning_waste_loose_residue; cleaning_waste_wastewater"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional: used cloths, cleaning residues or collected wastewater leave to their actual receiving waste/treatment gate. Separate solid and liquid identities, including contamination; no wastewater is assumed for a dry-cleaning task. Range evidence need: Collect cleaning method, actual residue composition, contaminated-material classification, mass and receiver. No generic water use, wastewater volume or hazardous status is inferred. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual different formulations/states/hazard/receivers or other spent supplies need precise records; solid/liquid and captured/direct-release fates exclusive."
      evidence: "cp_exits; actual independent records and identity/unit evidence"
    - id: refine_air_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional on actual release: instantiate each uncollected drilling-particle fraction or cleaning-related substance with its exact composition, particle fraction and compartment. If other environmental releases occur, identify their actual receiving compartment separately. Captured dust and waste are excluded from emitted mass. Range evidence need: Obtain actual particle/substance identification, measured release or applicable emission factor, control/capture evidence and uncertainty. Product VOC content, low-emitting marketing, or absence of wet sealant cannot be converted into installation emitted mass. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_releases; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
validation_rules:
  - rule_id: v_entry
    applies_to: "collar_install"
    rule: "Reject reference completion when actual wall/pipe/seal/collar/fixing configuration lacks a matching approval and current applicable instructions, or prior seal compatibility/condition is unconfirmed."
    source_ids:
      - hilti-wl2078-2018
  - rule_id: v_handover
    applies_to: "accepted_collar_installation"
    rule: "Verify required faces, latched collars, hook/fastener arrangement, undamaged prior seal, identification and signed inspection. Count one whole penetration stage once; a generic fire-hour promise is not an acceptance test."
    source_ids:
      - hilti-firestop-guide-2016
  - rule_id: v_rework
    applies_to: "collar_install"
    rule: "Trace each failure to mechanical correction and reinspection, confirmed product return, classified waste exit or separately bounded interface repair; never count unresolved failures as accepted output."
    source_ids: []
  - rule_id: v_shared
    applies_to: "tool_access_service_drill; tool_access_service_extractor; tool_access_service_charger; installation_electricity; logistics_service"
