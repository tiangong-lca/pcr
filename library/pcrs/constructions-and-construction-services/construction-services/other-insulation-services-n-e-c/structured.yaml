  - id: "un-cpc3-construction"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 explanatory notes, 30 June 2025, p.295; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification context: fireproofing within other insulation services, n.e.c.; not a system approval"
  - id: "hilti-firestop-guide-2016"
    type: "handbook"
    reference: "Hilti, Firestop Guide 2016, PDF pp.46–47 (printed pp.44–45), CP 643N; https://files-ask.hilti.com/original/om/omkpt2kobb.pdf"
    used_for: "Factory collar route, two wall faces, cleaning/latching/hooks/mechanical fixing and system-specific instructions; no universal quantitative inventory"
  - id: "hilti-wl2078-2018"
    type: "handbook"
    reference: "Hilti UL System W-L-2078, drawing WL2078q.04172018, 17 April 2018, sheets 1–2; https://files-ask.hilti.com/original/wv/wv1qztcvuh.pdf"
    used_for: "Specific gypsum-wall/plastic-pipe example showing seal and fixing compatibility conditions; actual job approval/current instruction applicability still required"
  - id: "hilti-cp643n-product"
    type: "handbook"
    reference: "Hilti USA, CP 643 N firestop collars, product page; https://www.hilti.com/c/CLS_FIRESTOP_PROTECTION_7131/CLS_FIRESTOP_COLLARS_WRAPS_BANDAGES_7131/r373"
    used_for: "Current family identity and retrofit application context only; product marketing does not determine installation emissions or performance"
