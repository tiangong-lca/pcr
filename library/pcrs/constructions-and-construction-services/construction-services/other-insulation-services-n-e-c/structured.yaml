product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.other-insulation-services-n-e-c"
  classification_refs: "CPC 3.0 54659 — Other insulation services, n.e.c.; proposed narrower fireproofing-service scope"
  covered_products: "Accepted mechanical collar-installation stage on a declared presealed plastic-pipe wall penetration"
  excluded_products: "Annular wet sealing; wall or pipe construction; floor collars; metal pipes; field fire testing; unrelated insulation services"
  representative_product: "Completed CP 643N-type collar fitting on both required faces of one approved existing wall penetration"
  production_route: "Interface verification → cleaning → drilled mechanical attachment of collars/hooks/fixings → inspection and identification → acceptance"
  market_state: "Completed installation service at signed stage handover; supplied components become part of the existing building interface"
functional_unit:
  what: "One accepted complete mechanical collar-installation stage for one declared existing plastic-pipe wall penetration"
  how_much: "1 Item(s); the item is the entire penetration stage, not an individual collar or wall face"
  how_well: "The actual system configuration, required faces, collar sizes, hooks, approved fixings and prior seal condition satisfy documented inspection and signed acceptance"
  how_long_or_cycle: "One installation work order through closed corrective work and signed handover; no building service-life or generic fire-resistance duration is claimed"
  reference_flow_link: "accepted_collar_installation"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers first mechanical installation of factory-made steel-housed intumescent collars around one existing plastic-pipe wall penetration. The wall, pipe and any required annular seal have already been installed and accepted; their documented compatibility with the chosen firestop system is an entry condition. The installer checks that interface, cleans the collar contact area, marks and drills fixing holes, closes and latches the collars, fits hooks and approved mechanical fixings, inspects, identifies and hands over the completed stage. The service includes every wall face required by the actual system. Exclude construction of the wall, pipe or core opening; application or repair of annular sealant; floor penetrations; metal pipes; powder-actuated fastening; and later building use. A failed prior seal or incompatible configuration stops this route and requires a separately bounded corrective service. Hilti CP 643N is a route example, not an exclusive supplier prescription. W-L-2078 (drawing revision 17 April 2018) demonstrates a specific gypsum-wall/plastic-pipe system with seal and fastening conditions; it does not establish that all wall systems or preseals are interchangeable. Retain the actual matching approval and current instructions applicable to the supplied collar and fixings. Their latest applicability must be checked for each job; an accessible historical drawing is not proof of current project approval."
      source_ids: []
    - rule_id: b_interface
      applies_to: "collar_install"
      rule: "Before installation, match actual wall, pipe, annular geometry and preseal to the selected tested/approved system and current supplied instructions. Record the seal acceptance and inspect it for damage; absence of compatibility evidence blocks output."
      source_ids:
        - hilti-wl2078-2018
    - rule_id: b_route
      applies_to: "collar_install"
      rule: "Include cleaning, drilling and dust control, collar latching, hooks/fixings, identification, inspection, corrective mechanical refitting and cleanup through signed handover. Keep wet sealing and damaged-interface repair outside this stage and reopen only after separately documented acceptance."
      source_ids:
        - hilti-firestop-guide-2016
    - rule_id: b_components
      applies_to: "collar_install"
      rule: "The component roles are factory steel/intumescent collars, hooks and anchor/washer sets, plus identification material where used. Supply records identify kit coverage; record extra components only where not supplied in the kit. Never replace the collar with raw steel or raw intumescent compound."
      source_ids:
        - hilti-wl2078-2018
    - rule_id: b_services
      applies_to: "collar_install"
      rule: "Include actual energy, cleaning supplies and bounded supplier-owned drilling/extraction/access services. The same drill, extractor, charger and access service may serve collar_install across initial and corrective visits and other jobs; enumerate the service periods and all consumers in cp_resources. The provider owns equipment production/maintenance allocation within the documented service. Record separately purchased energy or delivery only outside that coverage."
      source_ids: []
    - rule_id: b_exits
      applies_to: "collar_install"
      rule: "Record each physical packaging, dust, damaged part and cleaning-residue exit at its actual receiving gate; document the owner of later transport/treatment. A material is a usable return only with confirmed reusable condition and recipient/stock custody, otherwise classify the actual waste route."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Accepted existing wall and installed plastic pipe, with an already accepted annular seal where the selected system requires or permits the declared seal; available access and approved working conditions. Record actual configuration and seal custody."
  starting_condition_role: "Customer-owned building interface supplied for collar fitting, not a newly purchased wall/pipe/seal input. Its earlier construction burdens are outside this installation-stage dataset and must be added once by the wider model owner."
  product_classification_scope: "Narrow fireproofing installation service within CPC 3.0 54659; classification alone does not authorize any physical system."
  recursive_input_rule: "Do not use another complete collar-installation service as a recursive proxy for the present stage. A subcontracted operation must have an explicit nonoverlapping service boundary and ownership ledger."
  upstream_dataset_requirement: "Link actual collar package, separate fixings/consumables, electricity and bounded provider services to compatible upstream datasets; disclose packaging, hooks, transport and energy coverage and every unresolved identity."
  disclosure: "Declare installation-stage start/end, prior-interface acceptance evidence, actual approval/instruction versions, custody, included deliveries/returns/waste-service gates and supplier service coverage."
