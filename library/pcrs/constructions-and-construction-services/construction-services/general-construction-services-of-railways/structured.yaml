published_dataset_profile:
  dataset_role: "Foreground maintenance-service dataset for accepted existing plain-track geometry correction"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Matching retained ballasted plain-track maintenance route, gate, technology, region and accepted length basis"
  excluded_use: "New railway construction; turnout/slab track; full ballast renewal; universal safety/speed or life-extension benefit claims; train transport"
  required_metadata: "Reference qualifiers; campaign/window/period and chainages; actual machine/provider; residual restrictions; acceptance source; material custody; shared life/service attribution"
  required_quality_disclosure: "Meter/survey accuracy; failed work; stock balances; fuel/emission factors/species; life forecasts/sensitivity; upstream scope; unresolved identities and Range needs"
  update_trigger: "Changed machine, ballast/track state, target/handback criteria, provider scope, inventory period, asset life scenario, quantity evidence or flow identity"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations CPC Version 3.0 explanatory notes, 30 June 2025, printed p.284; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "54212 classification repair/restoration and ballast/rail service context; does not supply LCA quantities"
  - id: "plasser-tamping-precision"
    type: "literature"
    reference: "Plasser & Theurer, Tamping technology: Precision; https://www.plassertheurer.com/en/tamping-technology/precision"
    used_for: "Interdependent lifting/lining and tamping, geometry measurement and separate dynamic stabilisation capability; no universal handback authority or quantities"
  - id: "plasser-tamping-control"
    type: "literature"
    reference: "Plasser & Theurer, The tamping unit that understands the ballast; https://www.plassertheurer.com/en/pt-research/artikel/the-tamping-unit-that-understands-the-ballast"
    used_for: "Physical cycle, under-sleeper filling/compaction, condition-dependent settings and repeats; research examples not generic ranges"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:30693ee1f895f3581c4b1bcd50358727364bf411145218d36d2b8004d4ebbda7"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5607"
      family: "system_boundary"
      span:
        start:
          offset: 5607
          line: 61
          column: 1
        end:
          offset: 10131
          line: 87
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Existing qualified retained plain track with known rail, sleeper and ballast state; actual possession/protection and approved geometry available |\n| starting_condition_role | Host asset and retained stock, not purchased new track or ballast input |\n| product_classification_scope | Only retained plain-track geometry-correction maintenance within CPC 3.0 54212 |\n| recursive_input_rule | An external same-category subcontract is a separately bounded purchased input with owner, treated intervals and upstream scope; exclude its duplicate direct resources; no self-recursive final service |\n| upstream_dataset_requirement | Verified actual material/energy/transport/provider datasets at declared gates; disclose included packaging, direct operation, maintenance, tooling and capital |\n| disclosure | Campaign/window/period IDs; retained host baseline; supplied and returned lots; failures/rework; stability and protection ownership; full asset life and inventory carry-over; missing evidence |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `scope_eligibility` | foreground_system_boundary | This PCR covers one bounded geometry-correction maintenance campaign on a qualified existing ballasted plain railway track. Retained rails and sleepers are lifted and lined to approved target geometry while vibrating tines fill and compact ballast beneath sleepers. Include premeasurement, possession/protection, actual necessary ballast redistribution or top-up, prescribed stability measures, repeats, defect remedies, postmeasurement and authorised maintenance handback. [plasser-tamping-precision; plasser-tamping-control] Exclude new formation or track laying; rail, sleeper or fastening renewal; turnouts and crossings; slab track; full ballast undercutting, cleaning or replacement; structural defect repair outside the qualified host boundary; electrification/signalling installation; and train transport. Prior defects preventing treatment require an identified separate remedy owner and demonstrated qualified starting condition. Damage caused by this campaign remains attributable to this campaign. A measured geometry result does not confer unrestricted operating speed or whole-line approval. | `plasser-tamping-precision`; `plasser-tamping-control` |\n| `retained_host` | track_geometry_correction | Retained track/ballast is not a new material input and earns no avoided replacement credit. Include incremental handling and actual top-up; qualified prestate and accepted poststate are mandatory. | plasser-tamping-precision; plasser-tamping-control |\n| `cycle_owner` | track_geometry_correction | One physical forming responsibility owns the interdependent lifting/lining/tine-insertion/squeezing/under-sleeper compaction cycle. There is no independently accepted lifted-track intermediate. Include actual profiling, failed cycles, clean-up, worksite protection, geometry measurement and required stability closure under this responsibility. | plasser-tamping-control |\n| `handback_owner` | track_geometry_correction | Actual adopted track-owner criteria govern geometry, stability, temperature, defects, possession and speed restrictions. Required additional stabilisation has an actual operator/resource owner or explicitly bounded provider; it cannot vanish as a future third-party task. Manufacturer description is not operating authority. | plasser-tamping-precision |\n| `stock_custody` | material flows | Reconcile opening stock plus gross net-tare receipts against incorporation/use, true outward returns, waste, evidenced releases and retained closing stock per material. Closing stock is not an outward exchange; carry its burden forward. No return is netted then also counted as output. |  |\n| `coverage_owner` | all inventory rows | Assign each physical event to this node and one campaign/window/period. Purchased included service excludes duplicate direct resources. Disclose mobilisation, protection, tines/spares, hydraulic make-up/removal, cleaning and complete-life asset coverage; actual absence needs records. |  |\n| `period_assets` | atom_req_track_geometry_correction_shared_asset_service | Enumerate fleet, tines/tooling, survey and protection equipment with all consuming jobs/nodes/periods and life phases manufacture, maintenance/replacement and EOL. Separate directly inventoried fuel and spares from provider/asset coverage. |  |\n\n\n"
      headings:
        - kind: "heading"
          span:
            start:
              offset: 183
              line: 8
              column: 1
            end:
              offset: 252
