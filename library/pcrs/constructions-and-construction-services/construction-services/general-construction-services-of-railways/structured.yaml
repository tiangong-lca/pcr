      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `gate_complete` | accepted_track_geometry_service | Require qualified prestate, approved targets, calibrated pre/post geometry and support/profile/stability evidence, actual adopted tolerance source, closed campaign defects and authorised handback/restrictions. No unaccepted interval or repeated pass inflates L. | plasser-tamping-precision; plasser-tamping-control |\n| `run_complete` | track_geometry_correction | Reconcile every campaign/window, setup/changeover/idle/cleanup, failure, retest and prescribed stability action to an owner and period; accepted output excludes unresolved rejects. |  |\n| `material_balance` | material flows | Check net-tare gross receipts and opening/closing stock against mutually exclusive use/incorporation, actual outward returns, waste and evidenced species releases. Dry solids, water, retained host moisture and weather are distinct terms. Investigate residuals; unknown residual is not automatic emission. |  |\n| tine_stock_draw_once | tine_components_tamping_tine; atom_req_track_geometry_correction_tine_components | For each applicable child, reconcile raw O/R/C and actual fates/cohorts to tine_stock_draw; confirm one acquisition owner, one attribution and S/L normalization once. Check closing already excluded and the same stock-burden bridge not applied again. Retain nonreturned waste/loss supply and actual treatment, positive actual usable exits and owned rework. Unknown is incomplete. |  |\n| `fuel_balance` | atom_req_track_geometry_correction_fuel_gross; atom_req_track_geometry_correction_fuel_return; atom_req_track_geometry_correction_recovered_spill_waste; atom_req_track_geometry_correction_exhaust_species; atom_req_track_geometry_correction_oil_release_species | Separate fuel receipt, opening/closing inventory, return, waste and incident-release fractions to derive burned fuel. Partition each spill total into recovered fluid, retained residue and actual uncontained fluid; derive species/medium releases only from the evidenced uncontained partition. Assign retained residue to closing inventory or its distinct unburned outlet once; do not subtract incident total again. Match factors to fuel/engine/mode and units. |  |\n| `assets_complete` | atom_req_track_geometry_correction_shared_asset_service | Require complete-life phases, all consumers/periods, observed/forecast labels, replacement/termination/EOL scenarios and source/denominator uncertainty; block missing coverage. Exclude direct fuel/spares already recorded and provider-included capital. |  |\n| `identity_ranges` | all inventory rows | Verify each actual distinct material/provider/substance and its property/unit before final exchange; no speculative generic UUID, substance or particle fraction. Replace explicit Range evidence needs using actual route records or disclose unbounded uncertainty; checker pass is not quantity or external identity evidence. |  |\n| atom_req_track_geometry_correction_fuel_gross_complete | track_geometry_correction | Before final foreground completion, execute cp_atom_req_track_geometry_correction_fuel_gross and atom_req_track_geometry_correction_fuel_gross: all actual children in this role require one concrete object/state/medium and one explicit exchange property/unit, independent original quantity and evidenced conversion if needed, exact identity/support and reconciled owner/stock/fate/transfer scope. Each group is separate; no heterogeneous sum, guessed absence, parent-total/Range copying or duplicate assembly/provider/carrier burdens. Unresolved evidence means incomplete; pcr:check does not automatically execute or prove actual site roster completion. |  |\n| atom_req_track_geometry_correction_tine_components_complete | track_geometry_correction | Before final foreground completion, execute cp_atom_req_track_geometry_correction_tine_components and atom_req_track_geometry_correction_tine_