system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers one bounded geometry-correction maintenance campaign on a qualified existing ballasted plain railway track. Retained rails and sleepers are lifted and lined to approved target geometry while vibrating tines fill and compact ballast beneath sleepers. Include premeasurement, possession/protection, actual necessary ballast redistribution or top-up, prescribed stability measures, repeats, defect remedies, postmeasurement and authorised maintenance handback. [plasser-tamping-precision; plasser-tamping-control] Exclude new formation or track laying; rail, sleeper or fastening renewal; turnouts and crossings; slab track; full ballast undercutting, cleaning or replacement; structural defect repair outside the qualified host boundary; electrification/signalling installation; and train transport. Prior defects preventing treatment require an identified separate remedy owner and demonstrated qualified starting condition. Damage caused by this campaign remains attributable to this campaign. A measured geometry result does not confer unrestricted operating speed or whole-line approval."
      source_ids:
        - plasser-tamping-precision
        - plasser-tamping-control
    - rule_id: retained_host
      applies_to: "track_geometry_correction"
      rule: "Retained track/ballast is not a new material input and earns no avoided replacement credit. Include incremental handling and actual top-up; qualified prestate and accepted poststate are mandatory."
      source_ids:
        - plasser-tamping-precision
        - plasser-tamping-control
    - rule_id: cycle_owner
      applies_to: "track_geometry_correction"
      rule: "One physical forming responsibility owns the interdependent lifting/lining/tine-insertion/squeezing/under-sleeper compaction cycle. There is no independently accepted lifted-track intermediate. Include actual profiling, failed cycles, clean-up, worksite protection, geometry measurement and required stability closure under this responsibility."
      source_ids:
        - plasser-tamping-control
    - rule_id: handback_owner
      applies_to: "track_geometry_correction"
      rule: "Actual adopted track-owner criteria govern geometry, stability, temperature, defects, possession and speed restrictions. Required additional stabilisation has an actual operator/resource owner or explicitly bounded provider; it cannot vanish as a future third-party task. Manufacturer description is not operating authority."
      source_ids:
        - plasser-tamping-precision
    - rule_id: stock_custody
      applies_to: "material flows"
      rule: "Reconcile opening stock plus gross net-tare receipts against incorporation/use, true outward returns, waste, evidenced releases and retained closing stock per material. Closing stock is not an outward exchange; carry its burden forward. No return is netted then also counted as output."
      source_ids: []
    - rule_id: coverage_owner
      applies_to: "all inventory rows"
      rule: "Assign each physical event to this node and one campaign/window/period. Purchased included service excludes duplicate direct resources. Disclose mobilisation, protection, tines/spares, hydraulic make-up/removal, cleaning and complete-life asset coverage; actual absence needs records."
      source_ids: []
    - rule_id: period_assets
      applies_to: "atom_req_track_geometry_correction_shared_asset_service"
      rule: "Enumerate fleet, tines/tooling, survey and protection equipment with all consuming jobs/nodes/periods and life phases manufacture, maintenance/replacement and EOL. Separate directly inventoried fuel and spares from provider/asset coverage."
      source_ids: []
