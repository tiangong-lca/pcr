      requirement: "Mandatory actual-child refinement for track_geometry_correction/outputs/waste. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: An incident partition distinguishes recovered fluid/waste, actual elementary species releases and retained residue. Absorbent separately supplied when used is recorded under spill_absorbent with its exact material identity. Incident total is not subtracted again after outlet components. Range evidence need: Need incident mass partition, cleanup inputs, recovered components and receiver evidence; no hypothetical routine spill rate. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Measured recovered fluid, absorbent and contaminated solids as separately identified waste components divided by L. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_track_geometry_correction_recovered_spill_waste is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_incidents; independent actual-child roster and evidence"
    - id: atom_req_track_geometry_correction_exhaust_species
      applies_to: "track_geometry_correction"
      requirement: "Mandatory actual-child refinement for track_geometry_correction/outputs/elementary. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Expand CO2, CH4, N2O and other actual reported pollutants individually using engine/fuel/load-specific evidence. Distinguish fossil/biogenic carbon and reported NOx basis; only actual substance identity, particle fraction and air compartment can bind. No aggregate exhaust mass exchange. Range evidence need: Need actual burned activity, engine/fuel/mode factor source, oxidation/carbon basis, uncertainty and substance/medium; manufacturer power is not activity. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: For each verified species, burned_fuel_kg multiplied by applicable species_factor_kg_per_kg, or measured release_kg; divide by L. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_track_geometry_correction_exhaust_species is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_emissions; independent actual-child roster and evidence"
    - id: atom_req_track_geometry_correction_dust_species
      applies_to: "track_geometry_correction"
      requirement: "Mandatory actual-child refinement for track_geometry_correction/outputs/elementary. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Separate actual ballast dust species/size fractions and receiving air medium from captured fines waste. Do not equate all handled ballast or mass-balance residual with airborne particulates. Account for actual suppression/capture efficiency without duplicate outlet. Range evidence need: Need measured species/particle fraction or documented source matched to ballast, moisture, handling and controls; no generic dust loss. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Measured airborne species/particle-fraction release or actual supported handling_activity multiplied by matching factor; divide by L. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_track_geometry_correction_dust_species is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_emissions; independent actual-child roster and evidence"
    - id: atom_req_track_geometry_correction_oil_release_species
      applies_to: "track_geometry_correction"
      requirement: "Mandatory actual-child refinement for track_geometry_correction/outputs/elementary. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Expand actual hydraulic/fuel/grease constituents separately for soil, freshwater or air as evidenced. Oil mixture identity does not justify a single elementary substance. Recovered fluid is waste; partition total incident once and do not assume all unrecovered mass reaches water. Range evidence need: Need incident fluid composition, recovery partition, actual receiving medium and species factors; unknown fate remains data gap. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Measured or evidence-derived uncontained species mass by actual medium divided by L. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_track_geometry_correction_oil_release_species is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_incidents; independent actual-child roster and evidence"
    - id: atom_req_track_geometry_correction_water_release
      applies_to: "track_geometry_correction"
      requirement: "Mandatory actual-child refinement for track_geometry_correction/outputs/elementary. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Record only actual direct discharged or evaporated water, separately by medium and actual contaminant species. Balance purchased/abstracted water, retained host moisture, weather, carry-over and waste-water custody; residual uncertainty is not automatic discharge. Range evidence need: Need actual water balance, outlet monitoring, medium and any temperature/density/weather evidence; not a standard tamping exchange. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Actual measured water mass crossing to identified environment divided by L; collected effluent is a waste stream. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_track_geometry_correction_water_release is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_emissions; independent actual-child roster and evidence"
validation_rules:
  - rule_id: gate_complete
    applies_to: "accepted_track_geometry_service"
    rule: "Require qualified prestate, approved targets, calibrated pre/post geometry and support/profile/stability evidence, actual adopted tolerance source, closed campaign defects and authorised handback/restrictions. No unaccepted interval or repeated pass inflates L."
    source_ids:
      - plasser-tamping-precision
      - plasser-tamping-control
  - rule_id: run_complete
    applies_to: "track_geometry_correction"
    rule: "Reconcile every campaign/window, setup/changeover/idle/cleanup, failure, retest and prescribed stability action to an owner and period; accepted output excludes unresolved rejects."
    source_ids: []
  - rule_id: material_balance
    applies_to: "material flows"
    rule: "Check net-tare gross receipts and opening/closing stock against mutually exclusive use/incorporation, actual outward returns, waste and evidenced species releases. Dry solids, water, retained host moisture and weather are distinct terms. Investigate residuals; unknown residual is not automatic emission."
    source_ids: []
  - rule_id: tine_stock_draw_once
    applies_to: "tine_components_tamping_tine; atom_req_track_geometry_correction_tine_components"
    rule: "For each applicable child, reconcile raw O/R/C and actual fates/cohorts to tine_stock_draw; confirm one acquisition owner, one attribution and S/L normalization once. Check closing already excluded and the same stock-burden bridge not applied again. Retain nonreturned waste/loss supply and actual treatment, positive actual usable exits and owned rework. Unknown is incomplete."
    source_ids: []
  - rule_id: fuel_balance
    applies_to: "atom_req_track_geometry_correction_fuel_gross; atom_req_track_geometry_correction_fuel_return; atom_req_track_geometry_correction_recovered_spill_waste; atom_req_track_geometry_correction_exhaust_species; atom_req_track_geometry_correction_oil_release_species"
    rule: "Separate fuel receipt, opening/closing inventory, return, waste and incident-release fractions to derive burned fuel. Partition each spill total into recovered fluid, retained residue and actual uncontained fluid; derive species/medium releases only from the evidenced uncontained partition. Assign retained residue to closing inventory or its distinct unburned outlet once; do not subtract incident total again. Match factors to fuel/engine/mode and units."
    source_ids: []
  - rule_id: assets_complete
    applies_to: "atom_req_track_geometry_correction_shared_asset_service"
    rule: "Require complete-life phases, all consumers/periods, observed/forecast labels, replacement/termination/EOL scenarios and source/denominator uncertainty; block missing coverage. Exclude direct fuel/spares already recorded and provider-included capital."
    source_ids: []
  - rule_id: identity_ranges
    applies_to: "all inventory rows"
    rule: "Verify each actual distinct material/provider/substance and its property/unit before final exchange; no speculative generic UUID, substance or particle fraction. Replace explicit Range evidence needs using actual route records or disclose unbounded uncertainty; checker pass is not quantity or external identity evidence."
