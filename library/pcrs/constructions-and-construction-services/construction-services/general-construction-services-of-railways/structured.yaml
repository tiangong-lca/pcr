allocation_rules:
  - rule_id: campaign_share
    applies_to: "all inventory rows"
    rule: "Assign directly attributable quantities to the campaign, then divide campaign totals by measured accepted L. Allocate shared mobilisation/idle/protection by evidenced causal activity across every receiving job/window, with shares summing to one. Document driver and sensitivity rather than assume length describes every shared event."
    source_ids: []
  - rule_id: rework_retention
    applies_to: "track_geometry_correction"
    rule: "Retain failed tests, repeated tamping, additional stability, remedy and cleanup burdens in the producing campaign. Unaccepted intervals have no accepted output; disclose their burden destination rather than silently excluding them. No separate output for each pass."
    source_ids: []
  - rule_id: asset_life_share
    applies_to: "atom_req_track_geometry_correction_shared_asset_service"
    rule: "For each asset, calculate its complete-life attributable service fraction from observed history plus justified prospective remaining service/replacement/termination/EOL when in service. Enumerate all consuming jobs/nodes/periods; use evidenced comparable activity units, sum fractions to one, label forecasts, test sensitivity and update. Missing life coverage or denominator blocks finalisation."
    source_ids: []
  - rule_id: period_stock
    applies_to: "material flows; atom_req_track_geometry_correction_shared_asset_service"
    rule: "Assign receipt/use/return/replacement/EOL events to explicit periods and prevent carry-over stock or asset coverage from receiving a second charge. For fuel and other materials, bridge gross boundary exchanges to burden attribution with inherited opening-stock burden actually used and closing-stock burden carried forward, each linked to its source period and recorded once. Neither stock balance is a fictitious outward product flow. Actual return value or waste recovery is not an automatic avoided-product credit; disclose the chosen actual burden handoff. For tine components use tine_stock_draw: its stock-adjusted S and cohort ownership already implement this bridge; this paragraph authorizes no second opening charge or closing deduction. Gross-boundary treatment for other material/fuel roles is unchanged."
    source_ids: []
  - rule_id: provider_partition
    applies_to: "atom_req_track_geometry_correction_stability_service; protection_service; atom_req_track_geometry_correction_mobilisation_transport; atom_req_track_geometry_correction_shared_asset_service"
    rule: "Retain one owner for each service and its included direct fuel, emissions, tooling, maintenance and capital. Split contracted scope or direct inventory at documented interfaces. Returned material, recovered waste and the maintenance service are not assumed joint sale co-products."
    source_ids: []
  - rule_id: atom_grouped_ledgers
    applies_to: "all actual-child records"
    rule: "Apply every existing stock, allocation, emission and closure formula separately by concrete child identity/material, state, one exchange property/unit, receiving medium and ownership/event scope. Native and converted views are nonadditive. A family diagnostic total is never a flow identity or every child numerator; keep incomplete portions explicit. Complete formulations, assemblies and genuinely bounded single-function services remain whole, with included constituents/resources not purchased again."
    source_ids: []
