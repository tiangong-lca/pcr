      applies_to: "ballast_topup; atom_req_track_geometry_correction_fuel_gross; electricity; hydraulic_makeup; grease; atom_req_track_geometry_correction_tine_components; atom_req_track_geometry_correction_other_spares; supplied_water; atom_req_track_geometry_correction_water_withdrawal; atom_req_track_geometry_correction_packaging_supply; spill_absorbent; ballast_return; atom_req_track_geometry_correction_fuel_return; atom_req_track_geometry_correction_other_product_returns; atom_req_track_geometry_correction_ballast_solid_waste; atom_req_track_geometry_correction_removed_fluid_waste; atom_req_track_geometry_correction_wear_parts_waste; atom_req_track_geometry_correction_packaging_waste; atom_req_track_geometry_correction_recovered_spill_waste"
      rule: "For each distinct exchange, amount_per_m = attributable_campaign_amount / L; L = accepted unique centreline length in m from cp_acceptance. Receipt inputs precede return netting; stock burden transfer is documented separately. Tine-component numerators follow tine_stock_draw; its S is already stock-adjusted and attributable, and the separately recorded stock bridge only reconciles that same assignment."
      inputs:
        - "Actual campaign quantities"
        - cp_acceptance
        - cp_materials
        - cp_energy
        - cp_incidents
      output: "Actual exchange unit per 1 m reference service"
      source_ids: []
    - id: tine_stock_draw
      applies_to: "tine_components_tamping_tine; atom_req_track_geometry_correction_tine_components"
      rule: "For each independently identified material/SKU, current state, owning stock scope and period, let O_kg = opening_mass_kg, R_kg = external_receipts_net_mass_kg and C_kg = closing_carried_mass_kg. The attributable gross draw before actual usable outward exits is S_kg = O_kg + R_kg - C_kg. R is measured net of tare across this scope boundary, not another node's internal feed; C is all intact unused stock carried forward across the actual custody locations, excluding positive outward exits, installed material, waste and processed WIP. Retain physical source-cohort balances before attribution. Where the original PCR requires a shared-material share, derive O/R/C from those same source records under one evidenced driver and complete consumer shares summing to one; S is already attributable, so never apply that share again. Only the declared acquisition owner records S as external supply. A real internal feed instead uses its independently evidenced paired transfer quantity, with no second acquisition or stock deduction. The card quantity is S_kg / L once, including all nonreturned waste/loss and any actual positive usable U/X exits before their separately documented original-upstream-burden handoff. U/X are disjoint real exits, not closing stock or fictitious inventory changes; all work/rework/handling burdens stay with the job. Record stock_adjustment_applied = true for this S representation. Opening and carried-closing source-cohort quantities and upstream dataset references explain this same assignment; the stock-burden bridge is its reconciliation only, never a second subtraction, compensating exchange or extra burden charge. Unknown cohort ownership, negative S or unexplained stock/fate discrepancies block completion."
      inputs:
        - opening_mass_kg
        - external_receipts_net_mass_kg
        - closing_carried_mass_kg
        - stock_scope_id
        - cohort_source_ids
        - cohort_quantities_kg
        - cohort_upstream_dataset_refs
        - attribution_driver
        - complete_consumer_shares
        - actual_fate_event_ids
        - stock_adjustment_applied
      output: "S_kg before normalization; stock_adjustment_applied = true"
      source_ids: []
    - id: burn_balance
      applies_to: "atom_req_track_geometry_correction_fuel_gross; atom_req_track_geometry_correction_exhaust_species"
      rule: "burned_fuel_kg = initial_tank_kg + fuel_gross_kg - final_tank_kg - fuel_return_kg - recovered_fuel_waste_kg - uncontained_fuel_kg - separately_retained_unburned_fuel_kg; every outlet is mutually exclusive. Retained incident residue is included in final attributable inventory or a separately recorded unburned outlet. No second total-spill subtraction. separately_retained_unburned_fuel_kg is independently measured fuel retained outside final_tank_kg, returns, recovered waste and uncontained releases. Retained fuel already included in final_tank_kg is excluded from this separate term. Partition incident retained_residue_kg between these two storage locations with custody evidence; unknown partition blocks derived burn. This is a nonadditive unburned inventory audit, not another supply, waste or emission exchange."
      inputs:
        - cp_energy
        - cp_incidents
      output: "Burned actual fuel kg per campaign, separately from gross product input"
      source_ids: []
    - id: leg_activity
      applies_to: "atom_req_track_geometry_correction_mobilisation_transport"
      rule: "transport_per_m = sum(cargo_kg * loaded_distance_km * evidenced_job_share) / L; shares over all consuming jobs sum to 1; t*km to kg*km requires factor 1000. Empty returns or self-propelled equipment use evidenced provider vehicle boundary."
      inputs:
        - cp_transport
        - cp_acceptance
      output: "kg*km per 1 m reference service with full leg scope disclosed"
      source_ids: []
    - id: service_quantity
      applies_to: "protection_service; atom_req_track_geometry_correction_stability_service"
      rule: "service_per_m = actual_delivered_service_quantity * evidenced_campaign_share / L; service unit and scope must be defined, shares over all consuming jobs sum to 1."
      inputs:
        - cp_services
        - cp_acceptance
      output: "Actual provider-unit quantity per 1 m reference service"
      source_ids: []
    - id: complete_life_fraction
      applies_to: "atom_req_track_geometry_correction_shared_asset_service"
      rule: "asset_fraction_per_m = campaign_activity / (observed_life_activity + forecast_remaining_activity) / L; same activity unit for numerator and denominator; retired life has zero forecast_remaining_activity. Retain each asset fraction separately and full-life phase coverage; all consumers sum to 1 before final normalisation."
      inputs:
        - cp_assets
        - cp_acceptance
      output: "Item-equivalent of a specific complete-life asset service per 1 m"
      source_ids: []
    - id: species_release
      applies_to: "atom_req_track_geometry_correction_exhaust_species; atom_req_track_geometry_correction_dust_species; atom_req_track_geometry_correction_water_release"
      rule: "species_per_m = measured_release_kg / L, or actual_activity * applicable_factor_kg_per_activity_unit / L; use only one method per species/event and actual capture partition. No aggregation of different species or receiving media."
      inputs:
        - cp_emissions
        - cp_energy
        - cp_materials
        - cp_acceptance
      output: "kg of actual species/medium per 1 m"
      source_ids: []
    - id: incident_partition
      applies_to: "atom_req_track_geometry_correction_recovered_spill_waste; atom_req_track_geometry_correction_oil_release_species"
      rule: "For each incident, total_spill_kg = recovered_fluid_kg + retained_residue_kg + uncontained_fluid_kg; constituent_release_kg = uncontained_fluid_kg * evidenced_actual_constituent_fraction for its actual medium. Waste quantity includes separately measured absorbent/solids only once. Divide each actual outlet by L."
      inputs:
        - cp_incidents
        - cp_energy
        - cp_acceptance
      output: "Distinct actual waste and species outlet kg per 1 m"
      source_ids: []
  data_quality_requirements:
    - id: survey_gate
      applies_to: "accepted_track_geometry_service"
      requirement: "Track ID/chainage, actual target, spatial base, units, tolerance/temperature source, calibrated survey, pre/post support/stability evidence and signed restrictions must agree. L excludes failed and repeated intervals."
      evidence: "cp_acceptance records and adopted owner criteria"
    - id: scope_temporal
      applies_to: "all inventory rows"
      requirement: "Cover every campaign/window/period including idle/setup/changeover, cleaning, failures, repeats and closure; map every event to node and single owner; enumerate asset life phases and stock carry-over periods."
      evidence: "All event/transfer IDs and period/consumer ledgers"
    - id: identity_actual
      applies_to: "all inventory rows"
      requirement: "Expand conditional requirements into actual distinct material, spare, service, waste and species identities; verify flow/property/unit and provider/substance/medium qualifiers. Energy/Duration support needs actual verification; no inferred absence outside supplied published snapshot."
      evidence: "Supplier/provider/substance documents and identity verification"
    - id: custody_balance
      applies_to: "material flows; atom_req_track_geometry_correction_fuel_gross"
      requirement: "Gross supply excludes tare and precedes returns. Reconcile stocks and exclusive outlets per identity/moisture; carry closing-stock burden. Track dry solids, water, weather and host moisture separately. Burned fuel differs from gross exchange."
      evidence: "cp_materials; cp_energy; cp_incidents"
    - id: asset_forecast
      applies_to: "atom_req_track_geometry_correction_shared_asset_service"
      requirement: "Require manufacture/maintenance/replacement/EOL and all consumers/periods; label observed/forecast remaining life, uncertainty, termination and update scenarios. Missing evidence blocks finalisation, rather than requiring observed future retirement."
      evidence: "cp_assets and source-backed sensitivity"
    - id: quantity_uncertainty
      applies_to: "all inventory rows"
      requirement: "No universal quantities adopted. Record instrument/factor uncertainty and actual low/high sensitivity for missing range evidence; source examples, fuel densities and nameplates do not establish general kg/m or kWh/m ranges."
      evidence: "Actual instrument certificates, factors and campaign variability"
    - id: no_duplicate
      applies_to: "all inventory rows"
      requirement: "Cross-check provider/material-included packaging, transport, fuel, spares, maintenance and capital against direct rows and life scopes; stock transfers and incident components count once."
      evidence: "Resource scope matrix, custody ledger and consumer shares"
    - id: atom_req_track_geometry_correction_fuel_gross
      applies_to: "track_geometry_correction"
      requirement: "Mandatory actual-child refinement for track_geometry_correction/inputs/product. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Record each actual diesel or other fuel variant separately for tamping, profiling, direct stabilisation, protection, cleanup and site moves owned here. Gross input precedes true fuel returns, recovered fuel waste or releases. Exclude transport/provider fuel already included elsewhere. Range evidence need: Need actual fuel variant, metered net-tare deliveries, opening/closing tanks, returns and mode-resolved operation; no nameplate-power or marketing productivity factor. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Gross fuel supplied across the campaign boundary in kg divided by L; actual outward unconsumed returns stay separate. Total opening and closing tank quantities determine burned activity separately. Opening-stock material burden used by this campaign and closing-stock burden carried forward are documented once through the stock-burden bridge, without adding a second opening-draw exchange or subtracting closing stock twice. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_track_geometry_correction_fuel_gross is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_energy; independent actual-child roster and evidence"
