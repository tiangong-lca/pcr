  calculation_rules:
    - id: unique_area
      applies_to: "accepted_lining"
      rule: "A = sum of disjoint accepted developed surfaces minus openings; add actual surveyed reveals once, remove overlaps and failed portions; layers and passes do not multiply area. With missing gate or A<=0 produce no accepted reference output."
      inputs:
        - cp_acceptance
      output: "A m2"
      source_ids: []
    - id: sku_stock
      applies_to: "premix; starter_factory_formulation; atomic_starter; hardener; consumable_mass_ph_reagent; consumable_mass_cleaner; consumable_mass_blast; consumable_mass_ppe; consumable_mass_containment; consumable_mass_seal; consumable_mass_protection; consumable_mass_packaging; atomic_consumable_mass; consumable_count_sponge_ball; consumable_count_nozzle; consumable_count_test_item; atomic_consumable_count; consumable_length_tape; consumable_length_hose; consumable_length_protection; atomic_consumable_length; consumable_area_sheet; consumable_area_covering; consumable_area_protection; atomic_consumable_area; fuel; return_mass_premix_premix; return_mass_starter_factory_formulation; return_mass_hardener_hardener; return_mass_consumable_mass_ph_reagent; return_mass_consumable_mass_cleaner; return_mass_consumable_mass_blast; return_mass_consumable_mass_ppe; return_mass_consumable_mass_containment; return_mass_consumable_mass_seal; return_mass_consumable_mass_protection; return_mass_consumable_mass_packaging; return_mass_fuel_fuel; atomic_return_mass; return_count_consumable_count_sponge_ball; return_count_consumable_count_nozzle; return_count_consumable_count_test_item; atomic_return_count; return_length_consumable_length_tape; return_length_consumable_length_hose; return_length_consumable_length_protection; atomic_return_length; return_area_consumable_area_sheet; return_area_consumable_area_covering; return_area_consumable_area_protection; atomic_return_area; return_volume_mix_water_mix_water; return_volume_process_water_clean_process; return_volume_process_water_distilled_test; atomic_return_volume"
      rule: "In each compatible native SKU ledger attributable supply = opening attributable stock + net-tare gross external receipts - closing carried stock. Gross-with-outlets retains actual outward usable return once; consumed-only subtracts matched return once with matching supply burden and no duplicate credit. All nonreturned losses/waste retain supply burden. Close disjoint final outlets and retain intermediate dosing/use as nonadditive."
      inputs:
        - "Actual receipt/stock/dispatch/use/waste/loss protocols"
      output: "Attributable native supply and matched outlets"
      source_ids: []
    - id: mix_state_check
      applies_to: "premix; mix_water"
      rule: "Fresh mix mass = actual dry powder mass + actual added water mass; mixing-water m3 = measured litres / 1000; added water mass = measured water volume times actual density with matching unit/state/temperature/source. Only when exact fresh density is evidenced, loss-free theoretical fresh volume = fresh mass / fresh density; do not infer cured density or accepted A. UK 2025 example at 25 mm / 1 m2 and 2200 kg/m3 gives 55 kg total fresh mix and 55 / 1.16 ~ 47.4 kg dry powder, not 55 kg powder plus water. PDS ~ 22 kg/m2/10 mm is not independently adopted as a dry-powder consumption factor."
      inputs:
        - cp_premix
        - cp_mix_water
        - cp_acceptance
        - "exact product/state/density"
      output: "State-specific diagnostic only, not a second purchased exchange"
      source_ids:
        - sika-4400-uk-method-2025
        - sika-4400-uk-pds-2021
    - id: fuel_close
      applies_to: "fuel; atomic_species_release"
      rule: "Opening+receipts = closing+burned+usable_return+nonburned_waste+uncontained_loss in compatible fuel mass. Retained recovered spill belongs in closing; total spill is audit-only. Upstream attribution follows sku_stock, while combustion activity uses burned only. Species release selects measured species/medium mass OR actual compatible activity * species emission_factor OR whole-fluid mass * evidenced composition * actual release fate. Do not apply composition/fate again to a factor that already reports the released species; remove captured/stock/returns/waste once; whole fluid balance is nonadditive with species view."
      inputs:
        - cp_fuel
        - cp_species_release
      output: "Fuel attribution, combustion activity and actual species release separately"
      source_ids: []
    - id: freight_work
      applies_to: "freight"
      rule: "Actual attributed freight work = sum of actual shipment load_kg * distance_km under documented allocation/empty-leg coverage; divide by A for reference amount."
      inputs:
        - cp_freight
        - cp_acceptance
      output: "kg*km per m2"
      source_ids: []
    - id: asset_life_share
      applies_to: "asset_share_pump; asset_share_compressor; asset_share_mixer; asset_share_access; asset_share_tool; atomic_asset_share"
      rule: "For each independent asset_id, complete-life burden B_life includes manufacture, maintenance, replacements and end of life, with compatible life_driver>0 across every consumer/job/node/period. physical_asset_equivalent = actual_job_driver / life_driver, in Item(s); 1 Item(s) means one complete-life equivalent of this actual whole asset, never a newly purchased machine count, service event or hour. actual_<child_row_id>_quantity = physical_asset_equivalent; exchange intensity = physical_asset_equivalent/A. With matching upstream complete-life burden B_life per asset, attributed burden = B_life*physical_asset_equivalent/A; never multiply by B_life inside the exchange quantity and again upstream. Require complete observed life or observed history plus evidenced remainder/replacements/termination/EOL, retaining original uncertainty/sensitivity/update and one owner."
      inputs:
        - cp_asset_share
        - cp_acceptance
      output: "Item(s) asset-equivalent/A and matching B_life attribution relation"
      source_ids: []
    - id: native_reference_amounts
      applies_to: "all inventory rows"
      rule: "Each inventory card states its actual native quantity divided by the same positive A, except accepted_lining=1m2. Never add different native units or double count an intermediate state, covered provider burden or outward credit."
      inputs:
        - "All linked collection protocols"
        - cp_acceptance
      output: "Native exchange quantities per 1 m2 reference flow"
      source_ids: []
