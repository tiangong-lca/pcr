      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `reference_gate` | `accepted_lining` | Require same unique positive A, reference link/name/property/unit and passed actual substrate pH/SSD, layer/geometry, cure/hardness, bond/surface and authorised signed owner return gate. No fastest timer, cover-only exception, unresolved reject or zero-area campaign creates accepted output. | `sika-4400-uk-method-2025`; `sika-4400-uk-pds-2021` |\n| `supply_and_state_gate` | all inventory rows | Reconcile native SKU opening/receipt/closing/usable return/use/waste/release and exclusive factory product/components. Dry powder+water, fresh mix and cured retained states are distinct; no55kgfresh-as55kgdry plus water, wet-mix duplicate purchase, loss-only omission, or pass/layer area inflation. |  |\n| `event_and_release_gate` | `lining`; `atomic_species_release`; `solid_waste_host; solid_waste_sludge; solid_waste_powder; solid_waste_fresh_rebound; solid_waste_cured_rebound; solid_waste_lining; solid_waste_starter; solid_waste_cleaning; solid_waste_packaging; solid_waste_consumable; atomic_solid_waste`; `wastewater_sewage; wastewater_cleaning; wastewater_flush; wastewater_cure; atomic_wastewater` | Every batch/run/period, startflush, periodic clean/changeover, failure, rework/reapplication and residue exit has owner and fate. Physical fluid/gas closure and species/medium evidence are nonadditive; safety concentration/SDS alone cannot establish release; captured streams are waste, not direct discharge. |  |\n| `shared_period_gate` | `asset_share_pump; asset_share_compressor; asset_share_mixer; asset_share_access; asset_share_tool; atomic_asset_share`; `atomic_provider`; `electricity`; `fuel`; `freight` | Require complete all-consumer/lifetime phase denominator or evidenced remainder and uncertainty/sensitivity/update, real replacement/termination/end-of-life, compatible driver and reconciled shares. Verify bounded provider native unit/resources/results/upstream scope and direct/rental/assets/spares ownership once. Missing coverage blocks final dataset. |  |\n| `readiness_gate` | all inventory rows | Retain actual absence evidence, unresolved identities/supports/ranges and missing primary records; candidate methodology cannot supply unverified concrete final exchanges. Automated checks do not verify external UUIDs, full engineering approval or publication readiness. |  |\n| close_atomic_starter | lining; cp_starter | Block final foreground completion until every actual object in atomic_starter is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_consumable_mass | lining; cp_consumable_mass | Block final foreground completion until every actual object in atomic_consumable_mass is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_consumable_count | lining; cp_consumable_count | Block final foreground completion until every actual object in atomic_consumable_count is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_consumable_length | lining; cp_consumable_length | Block final foreground completion until every actual object in atomic_consumable_length is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_consumable_area | lining; cp_consumable_area | Block final foreground completion until every actual object in atomic_consumable_area is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_provider | lining; cp_provider | Block final foreground completion until every actual object in atomic_provider is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_asset_share | lining; cp_asset_share | Block final foreground completion until every actual object in atomic_asset_share is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_return_mass | lining; cp_return_mass | Block final foreground completion until every actual object in atomic_return_mass is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property