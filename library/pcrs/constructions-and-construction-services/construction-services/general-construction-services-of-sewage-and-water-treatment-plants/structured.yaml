          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Identified existing acid-attacked plant-integral concrete chamber, retained host/steel condition and authorised repair scope; isolation/diversion/dewatering/access are actual owned foreground activities |\n| starting_condition_role | Existing host state interface, without repurchasing retained concrete/steel or inventing an avoided replacement credit |\n| product_classification_scope | Narrow wet-spray lining rehabilitation subset of sewage-treatment-plant construction services |\n| recursive_input_rule | A genuine bounded subcontract input of the same category stops recursion only with completed-resource/result evidence and explicit upstream coverage; retain provider-paid resources and avoid overlap with direct rows |\n| upstream_dataset_requirement | Actual premix/consumable/fuel/water/utility/transport/service/asset supplies require matching upstream burdens and verified concrete exchange identities before final dataset construction |\n| disclosure | Host condition and excluded structural work; actual contractors; stocks and outward returns; all attempts; material states; diversion/residue fates; gate evidence; asset life and incomplete evidence |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `scope_eligibility` | foreground_system_boundary | This category covers one bounded low-pressure wet-spray rehabilitation of acid-attacked internal concrete in a wet well or chamber integral to an existing sewage disposal/treatment plant. An approved one-part premix containing calcium-aluminate cement AND calcium-aluminate aggregate is mixed only with clean water, sprayed onto qualified retained sound concrete and handed over as a cured, accepted acid-resistant lining. Sika MonoTop-4400 MIC UK is the evidenced route, not a generic Portland mortar substitute. The retained host is the parent state; the independently accepted protective lining is the finishing responsibility. Preparation, batch mixing, spraying, finishing and curing belong inside this integrated responsibility, without an independent mortar-manufacturing output. Exclude external local sewer mains/manholes, new plants/tanks, bio-reactor and digester tanks (explicitly excluded by the adopted 2025 method), deep structural rebuilding/reprofiling, new or replaced reinforcement/mesh, dry-spray, centrifugal and hand-only routes, polymer coating-only work, and later wastewater treatment operation. If investigation requires excluded structural rebuilding, infiltration injection, or replacement steel, stop this subset and expand/review the actual scope before producing its dataset; do not hide necessary work outside the balance. Experienced professionals and the authorised owner/engineer determine suitability, environmental control and actual approved instructions. [`sika-4400-uk-pds-2021`; `sika-4400-uk-method-2025`] | `sika-4400-uk-pds-2021`; `sika-4400-uk-method-2025` |\n| `qualified_parent` | `lining` | Own authorised isolation, sewage diversion, desludging/dewatering, containment, confined-space access/ventilation and actual retained-steel cleaning. Remove acid-damaged/weak material to sound rough concrete, inspect microcracks/delamination including preparation-caused damage, and obtain required competent consent. Adopted UK V7 requires substrate pH >=10 before application: retain actual test location, dust/distilled-water/paper method and results, repeat removal/testing if failed. Any alternative system needs written competent approval and its own real criterion; unknown is not zero or passed. Major rebuilding/rebar/mesh replacement blocks this subset. | `sika-4400-uk-pds-2021`; `sika-4400-uk-method-2025` |\n| `wet_spray_system` | `lining` | SSD pre-wetting has no standing water and no dry-out. Use clean premix/equipment free of Portland contamination and an actual compatible calcium-aluminate slurry or approved chemical starter; own its input and discarded startflush. Mix only clean water, verify every batch consistency/pot life and actual layer/overhead/interface/thickness controls. Under adopted UK V7 larger wet wells/chambers require at least 25 mm; this source-specific requirement is not a universal denominator thickness. No additional Portland cement, aggregate or finishing water. | `sika-4400-uk-pds-2021`; `sika-4400-uk-method-2025` |\n| `cure_handoff` | `lining` | Own required wet curing, environment/dehydration mitigation under safety ventilation, and compatible approved surface hardener when actually used. UK V7 low-humidity/strong-airflow instruction is wet cure at least 8-12 h; its typical ~12 h hard-before-sewage statement, conditional 6-9 h hardening and ~1 h after hardener/moderate slow flow statements are not interchangeable universal timers. Actual approved cure/hard-state evidence, required bond/surface/geometry tests and signed authorised sewage-return gate control. The small live-manhole cover-only exception does not apply to this isolated plant chamber. | `sika-4400-uk-pds-2021`; `sika-4400-uk-method-2025` |\n| `all_resources` | all inventory rows | Include actual preparation, pH testing, PPE/containment, SSD, starter, periodic hopper/nozzle/rotor/pump/hose cleaning, cooling, curing, testing, rework, fuel/utilities, freight and provider-paid resources. Own routine and incident residues and actual species/medium releases. Complete pump/compressor/mixer/access-tool manufacture, maintenance, replacements and end-of-life is attributed over all jobs/nodes/periods. Actual absence needs evidence; unknown resources cannot be omitted. | `sika-4400-uk-pds-2021`; `sika-4400-uk-method-2025` |\n| `supply_stock` | material and fuel inputs; `return_mass_premix_premix; return_mass_starter_factory_formulation; return_mass_hardener_hardener; return_mass_consumable_mass_ph_reagent; return_mass_consumable_mass_cleaner; return_mass_consumable_mass_blast; return_mass_consumable_mass_ppe; return_mass_consumable_mass_containment; return_mass_consumable_mass_seal; return_mass_consumable_mass_protection; return_mass_consumable_mass_packaging; return_mass_fuel_fuel; atomic_return_mass`; `return_count_consumable_count_sponge_ball; return_count_consumable_count_nozzle; return_count_consumable_count_test_item; atomic_return_count`; `return_length_consumable_length_tape; return_length_consumable_length_hose; return_length_consumable_length_protection; atomic_return_length`; `return_area_consumable_area_sheet; return_area_consumable_area_covering; return_area_consumable_area_protection; atomic_return_area`; `return_volume_mix_water_mix_water; return_volume_process_water_clean_process; return_volume_process_water_distilled_test; atomic_return_volume` | For each actual SKU and native unit, attributable supply = opening attributable stock + net-tare gross external receipts - closing carried stock. Internal issues are not new purchases; closing retained/recovered stock is not an outward return. Gross-with-outlets includes actual usable outward returns once; consumed-only subtracts the matched usable return once with its upstream burden and no second return credit. Nonreturned waste and uncontained losses retain upstream supply burden. Keep disjoint final retained/used, return, waste and release outlets; wet mix/use intermediate activities are nonadditive. |  |\n| `fuel_and_releases` | `fuel`; `atomic_species_release` | Upstream fuel includes burned plus all attributable nonreturned waste/loss, not burned fuel alone. Separately close opening+receipts = closing+burned+usable return+nonburned waste+uncontained loss. Total spill is audit-only; recovered spill in closing is not another loss. Whole sewage/water/gas physical balances and species/medium elementary views are nonadditive; capture, waste, stock and returns are excluded from release once. H2S safety monitoring/SDS/absence claims cannot invent emission quantities. |  |\n\n"
