      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `accepted_area_only` | all inventory rows | Attribute every attempt, startflush, setup, cleaning/changeover, curing/test repetition, rejected-layer removal and reapplication to unique final positive A. Rejects never create accepted area. A failed layer returns to lining preparation/spray/cure and exits as actual waste/release if removed; record any actual recovery/return/downgrade destination without assumed avoided credit. |  |\n| `batch_event_owner` | `lining` | Production is batch mixing and wet-spray runs within one campaign. Link each receipt/stock/dose, startflush, periodic clean, interruption/changeover, output, reject and cure/test event to batch/run/patch and period; shared-run quantities split by measured causal use once and reconcile to the whole run. Avoid allocating by spray-pass area. |  |\n| `asset_periods` | `asset_share_pump; asset_share_compressor; asset_share_mixer; asset_share_access; asset_share_tool; atomic_asset_share` | Enumerate manufacture, each service/maintenance/replacement period, termination and end-of-life. Asset burden for the job = complete-life asset burdens times actual compatible job driver divided by complete-life driver over ALL consumers/jobs/nodes/periods. Use complete observed life or observed history plus evidenced remaining use/replacements/termination/end-of-life, with uncertainty/sensitivity and update. Missing lifetime coverage or denominator blocks final dataset. Link inputs/events/outputs and stock carry to real periods; no repeated whole purchase or double annualisation. |  |\n| `one_owner` | `atomic_provider`; `electricity`; `fuel`; `freight`; `asset_share_pump; asset_share_compressor; asset_share_mixer; asset_share_access; asset_share_tool; atomic_asset_share` | State one owner for each direct/provider/rental/transport/asset/spare burden. A bounded provider unit must match completed resources/results and upstream coverage; enumerate residual direct requirements. Reconcile all consumer shares and periods to one complete burden. Do not treat price/hours as Count or waive invisible provider-paid work. No commercial co-product or treatment/avoided-new-plant credit is assumed. |  |\n\n"
