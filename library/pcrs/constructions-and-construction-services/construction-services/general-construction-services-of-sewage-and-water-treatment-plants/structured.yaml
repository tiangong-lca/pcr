    - id: atomic_asset_equivalent_definition
      applies_to: "asset_share_pump; asset_share_compressor; asset_share_mixer; asset_share_access; asset_share_tool"
      requirement: "For each independent asset_id, complete-life burden B_life includes manufacture, maintenance, replacements and end of life, with compatible life_driver>0 across every consumer/job/node/period. physical_asset_equivalent = actual_job_driver / life_driver, in Item(s); 1 Item(s) means one complete-life equivalent of this actual whole asset, never a newly purchased machine count, service event or hour. actual_<child_row_id>_quantity = physical_asset_equivalent; exchange intensity = physical_asset_equivalent/A. With matching upstream complete-life burden B_life per asset, attributed burden = B_life*physical_asset_equivalent/A; never multiply by B_life inside the exchange quantity and again upstream. Require complete observed life or observed history plus evidenced remainder/replacements/termination/EOL, retaining original uncertainty/sensitivity/update and one owner."
      evidence: "cp_asset_share; asset_id; job_driver; life_driver; driver_unit; B_life; physical_asset_equivalent; A"
    - id: atomic_water_stream_ownership
      applies_to: "lining"
      requirement: "process_water_clean_process is actual nonmixing clean process water excluding pH distilled water; process_water_distilled_test is only pH-test distilled water. mix_water retains sole ownership of batch ingredient water. Every water exchange is fixed Volume/m3, using exclusive actual use_id/meter evidence portions; never populate each child from one repeated master supply total. Separate wastewater children only when their streams are actually independently collected/dispatched. A physically combined tank/load of actual mixed wastewater uses one whole-carrier exchange; source uses/constituents are nonadditive ledgers, never whole tank plus source-stream duplicates. Retain actual suspended solids/water; original kg species releases cannot duplicate whole wastewater or collected solids."
      evidence: "cp_mix_water; cp_process_water; cp_wastewater; use_id; stream_id; whole_carrier_id; source_portion_crosswalk; one_burden_owner_evidence"
