  - rule_id: event_and_release_gate
    applies_to: "lining; atomic_species_release; solid_waste_host; solid_waste_sludge; solid_waste_powder; solid_waste_fresh_rebound; solid_waste_cured_rebound; solid_waste_lining; solid_waste_starter; solid_waste_cleaning; solid_waste_packaging; solid_waste_consumable; atomic_solid_waste; wastewater_sewage; wastewater_cleaning; wastewater_flush; wastewater_cure; atomic_wastewater"
