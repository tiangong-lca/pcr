allocation_rules:
  - rule_id: accepted_area_only
    applies_to: "all inventory rows"
    rule: "Attribute every attempt, startflush, setup, cleaning/changeover, curing/test repetition, rejected-layer removal and reapplication to unique final positive A. Rejects never create accepted area. A failed layer returns to lining preparation/spray/cure and exits as actual waste/release if removed; record any actual recovery/return/downgrade destination without assumed avoided credit."
    source_ids: []
  - rule_id: batch_event_owner
    applies_to: "lining"
    rule: "Production is batch mixing and wet-spray runs within one campaign. Link each receipt/stock/dose, startflush, periodic clean, interruption/changeover, output, reject and cure/test event to batch/run/patch and period; shared-run quantities split by measured causal use once and reconcile to the whole run. Avoid allocating by spray-pass area."
    source_ids: []
  - rule_id: asset_periods
    applies_to: "asset_share_pump; asset_share_compressor; asset_share_mixer; asset_share_access; asset_share_tool; atomic_asset_share"
    rule: "Enumerate manufacture, each service/maintenance/replacement period, termination and end-of-life. Asset burden for the job = complete-life asset burdens times actual compatible job driver divided by complete-life driver over ALL consumers/jobs/nodes/periods. Use complete observed life or observed history plus evidenced remaining use/replacements/termination/end-of-life, with uncertainty/sensitivity and update. Missing lifetime coverage or denominator blocks final dataset. Link inputs/events/outputs and stock carry to real periods; no repeated whole purchase or double annualisation."
    source_ids: []
  - rule_id: one_owner
    applies_to: "atomic_provider; electricity; fuel; freight; asset_share_pump; asset_share_compressor; asset_share_mixer; asset_share_access; asset_share_tool; atomic_asset_share"
    rule: "State one owner for each direct/provider/rental/transport/asset/spare burden. A bounded provider unit must match completed resources/results and upstream coverage; enumerate residual direct requirements. Reconcile all consumer shares and periods to one complete burden. Do not treat price/hours as Count or waive invisible provider-paid work. No commercial co-product or treatment/avoided-new-plant credit is assumed."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_premix
      process_id: "lining"
      flow_role: "premix"
      record_type: "collected_record"
      raw_fields: "plant_id;chamber_id;job_id;campaign_id;batch_id;event_id;phase_id;period_id;sku;opening_kg;receipts_net_kg;closing_kg;outward_return_kg;dosed_kg;waste_kg;loss_kg"
      collection_method: "Weigh actual dry powder, reconcile bag tare and stocks with batch dosing and all outlets."
