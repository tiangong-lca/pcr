      applies_to: "process_water_clean_process; process_water_distilled_test; starter_factory_formulation; consumable_mass_ph_reagent; consumable_mass_cleaner; consumable_mass_blast; consumable_mass_ppe; consumable_mass_containment; consumable_mass_seal; consumable_mass_protection; consumable_mass_packaging; consumable_count_sponge_ball; consumable_count_nozzle; consumable_count_test_item; consumable_length_tape; consumable_length_hose; consumable_length_protection; consumable_area_sheet; consumable_area_covering; consumable_area_protection; asset_share_pump; asset_share_compressor; asset_share_mixer; asset_share_access; asset_share_tool; return_mass_premix_premix; return_mass_starter_factory_formulation; return_mass_hardener_hardener; return_mass_consumable_mass_ph_reagent; return_mass_consumable_mass_cleaner; return_mass_consumable_mass_blast; return_mass_consumable_mass_ppe; return_mass_consumable_mass_containment; return_mass_consumable_mass_seal; return_mass_consumable_mass_protection; return_mass_consumable_mass_packaging; return_mass_fuel_fuel; return_count_consumable_count_sponge_ball; return_count_consumable_count_nozzle; return_count_consumable_count_test_item; return_length_consumable_length_tape; return_length_consumable_length_hose; return_length_consumable_length_protection; return_area_consumable_area_sheet; return_area_consumable_area_covering; return_area_consumable_area_protection; return_volume_mix_water_mix_water; return_volume_process_water_clean_process; return_volume_process_water_distilled_test; solid_waste_host; solid_waste_sludge; solid_waste_powder; solid_waste_fresh_rebound; solid_waste_cured_rebound; solid_waste_lining; solid_waste_starter; solid_waste_cleaning; solid_waste_packaging; solid_waste_consumable; wastewater_sewage; wastewater_cleaning; wastewater_flush; wastewater_cure"
      rule: "Record independent_physical_quantity separately by atomic_flow_row_id; actual_<row_id>_quantity is its named alias only, never a copied family amount. Materials retain original CP per-identity/state gross/net stock and outward-return conventions; transfers use actual paired custody quantity; usable exits and wastes use independent actual fate quantities. Number-of-items owned asset equivalents use this PCR original job_driver/full_life_driver complete-life fraction including manufacture, maintenance, replacement and end of life, with every consumer and a positive complete denominator. Duration/h service children instead use actual attributable job hours with the matching complete-life burden per hour; never multiply hours by the fraction again. Purchased services use only actual complete physical tasks whose real contract defines Item(s), with original actual attribution; hours, days and prices cannot become event counts. atomic_child_intensity = independent_physical_quantity / A, where A is positive unique net developed finally accepted lining area in m2 under area_basis and cp_acceptance under the original acceptance rule; A=0 blocks normalization. Non-exchange parent role ledgers and original CP operands retain their stock, transfer, closure and ownership functions, without adding a second exchange or changing the method."
