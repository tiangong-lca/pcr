      record_type: "collected_record"
      raw_fields: "plant_id;chamber_id;job_id;campaign_id;batch_id;event_id;phase_id;period_id;powder_kg;mix_water_l;mix_water_m3;water_density;density_unit;water_state;temperature;density_source;consistency;pot_life;temperature_unit"
      collection_method: "Calibrated volumetric measurement for each batch; mix_water_m3 = mix_water_l / 1000. Record actual water density with unit/state/temperature/source for mass diagnostics, and link product instruction/consistency check."
      unit: "m3"
