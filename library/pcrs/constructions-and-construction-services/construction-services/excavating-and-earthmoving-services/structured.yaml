system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers contractor-performed mechanical excavation of characterized uncontaminated soil at an accessible cleared construction site. It includes digging, geometry trimming, and loading or on-site relocation only to the extent declared in the contract. The service ends when the excavation geometry is accepted and the displaced soil is transferred to the declared stockpile or vehicle custodian. Scope excludes rock blasting, contaminated-soil remediation, initial site clearance, embankment compaction, foundation construction, shoring works and off-site soil transport/treatment after handover. If dewatering, shoring or other temporary works are needed, declare a linked separately quantified package; disclose its owner and include it in whole-project aggregation."
      source_ids: []
    - rule_id: boundary_service
      applies_to: "excavate"
      rule: "Collect digging, trimming, idle/rework energy and declared loading/on-site movement through acceptance and material handover. This removal responsibility is separate from subsequent fill placement, treatment and foundation production."
      source_ids:
        - fhwa-fp24-original-position
    - rule_id: boundary_material
      applies_to: "excavate"
      rule: "Native soil is the source context. Keep a physical movement ledger with reusable soil, waste, retained stock and dust; do not create an arbitrary purchased soil input or equate material handover with the service reference."
      source_ids: []
    - rule_id: boundary_shared
      applies_to: "excavate"
      rule: "Include attributable plant use, mobilization and shared support. Enumerate this node and every other consuming work-package/node and service period for shared excavators, loaders, haul plant, water supply and mobilization journeys. Retain one event owner."
      source_ids: []
    - rule_id: boundary_emissions
      applies_to: "excavate"
      rule: "Include actual direct exhaust and activity-specific soil dust through handover; water runoff and maintenance waste require actual composition and destination. Do not infer absence from unmeasured emissions."
      source_ids:
        - epa-ap42-construction-dust
        - epa-nonroad-exhaust
boundary_abstraction:
  declared_starting_condition: "Surveyed, cleared, accessible site with characterized uncontaminated native soil and approved excavation design"
  starting_condition_role: "Initial worksite state, not a purchased native-soil input or zero-burden whole-project claim"
  product_classification_scope: "Narrow mechanical soil excavation service within CPC 54330; does not exhaust earthmoving services"
  recursive_input_rule: "A subcontracted service of this same category is an upstream service input with disclosed boundary; subdivide actual responsibilities and avoid repeating the same excavation output or operating burdens"
  upstream_dataset_requirement: "Link fuel, electricity, water, plant-use and mobilization supply datasets with technology, geography, period and boundary compatibility; parent project links clearance, shoring and downstream soil fate separately"
  disclosure: "Declare every excluded package owner, starting soil/state, actual custodian and soil destination; missing records remain gaps"
