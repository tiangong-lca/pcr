allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "excavate"
    rule: "Subdivide by work package and measured activity first. When metering cannot separate shared fuel, water or plant periods, allocate the event using documented physical machine-hours/load or delivered water; list every consumer and ensure shares sum to one. Monetary contract value is not a default physical driver."
    source_ids: []
  - rule_id: allocation_mobilization
    applies_to: "plant_mobilization; plant_use_excavator; plant_use_loader; plant_use_onsite_haul_plant"
    rule: "Assign each plant journey and shared plant-support period once across its actual consuming nodes and jobs using the documented service-period plant-hours. A supplier plant dataset that includes fuel, transport or maintenance must be reconciled with the separate cards before linking."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "excavate"
    rule: "Keep failed-geometry correction, repeated handling and idle burdens with the accepted work lot; never count a rejected pass as another accepted service. Record any separately authorized design change and its new acceptance boundary."
    source_ids: []
  - rule_id: allocation_soil
    applies_to: "reusable_soil_handover; waste_soil_handover"
    rule: "This narrowed package is purchased to provide excavation service; displaced soil is an accompanying physical handover, not an automatic credited co-product. Retain excavation burdens on service with no avoided-fill/disposal credit. If evidence establishes independently marketed soil co-production, review that case explicitly and disclose an alternative allocation before use; do not silently transfer burdens."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "excavate"
      flow_role: "accepted service"
      record_type: "Survey and acceptance file"
      raw_fields: "work-package id; lot id; original and final survey; design limits; accepted volume; exclusions; date; approver"
      collection_method: "Survey pre/post surfaces or traceable cross-sections; reconcile approved geometry and signed acceptance, exclude unauthorized overbreak and repeated passes."
      unit: "m3"
      frequency: "each accepted lot"
      temporal_coverage: "whole lot including preparation, idle, corrections and closeout"
      site_scope: "declared site and package; disclose other consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "survey control; design revision; signed acceptance"
    - protocol_id: cp_energy
      process_id: "excavate"
      flow_role: "fuel and electricity"
      record_type: "Fuel and meter ledger"
      raw_fields: "asset; fuel type; meter readings; issues; returns; stocks; operating/idle/rework time; all consuming packages; period; burned_fuel_mass_kg; fuel_opening_kg; fuel_issued_kg; fuel_returned_kg; fuel_closing_kg; noncombusted_waste_kg; uncontained_release_kg; other_evidenced_fuel_exit_kg; recovered_fuel_in_closing_kg; fuel_balance_gap_kg; burn_fate_method; burn_fate_evidence; burn_uncertainty"
      collection_method: "Use calibrated meters and delivery/stock reconciliation; partition shared equipment periods using measured activity and keep generator ownership explicit.  Distinguish actual fuel supplied/drawn from fuel burned. Independently measure combustion activity or reconcile the complete same-asset/shift stock and mutually exclusive noncombustion fates under fuel_fate_separation, retaining the applicable method, observations and uncertainty. Fuel discarded, returned, retained or released unburned is not exhaust activity; unknown losses remain a fuel-balance gap, not assumed combustion."
      unit: "kg; kWh"
      frequency: "each shift and delivery"
      temporal_coverage: "whole lot including preparation, idle, corrections and closeout"
      site_scope: "declared site and package; disclose other consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; invoices; asset-time reconciliation"
    - protocol_id: cp_plant
      process_id: "excavate"
      flow_role: "plant use"
      record_type: "Asset-time register"
      raw_fields: "asset; model; shift; productive/idle/rework hours; all consumers; shared maintenance coverage; upstream dataset; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Log each machine by package and period, reconcile available hours and supplier coverage; identify other-site consumers. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "h"
      frequency: "each shift"
      temporal_coverage: "whole lot including preparation, idle, corrections and closeout"
      site_scope: "declared site and package; disclose other consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset logs; supplier boundary; allocation ledger"
    - protocol_id: cp_mobilization
      process_id: "excavate"
      flow_role: "plant transport"
      record_type: "Dispatch and mass record"
      raw_fields: "journey id; plant mass; distance; loaded/empty legs; all users; attribution period; supplier boundary"
      collection_method: "Reconcile dispatch, route and mass records; attribute the one journey among actual users using documented plant-hours during its service period."
      unit: "t*km"
      frequency: "each journey"
      temporal_coverage: "whole lot including preparation, idle, corrections and closeout"
      site_scope: "declared site and package; disclose other consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "dispatch evidence; route trace; consumer ledger"
    - protocol_id: cp_water
      process_id: "excavate"
      flow_role: "dust suppression"
      record_type: "Water delivery and application log"
      raw_fields: "source; meter/tank volume; returns; area; shift; application; runoff capture; other consumers"
      collection_method: "Meter actual supplied volume and assign only excavation-related application; record weather and whether water enters soil, air or captured waste."
      unit: "m3"
      frequency: "each delivery and shift"
      temporal_coverage: "whole lot including preparation, idle, corrections and closeout"
      site_scope: "declared site and package; disclose other consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter checks; delivery tickets; application logs"
    - protocol_id: cp_soil
      process_id: "excavate"
      flow_role: "soil handovers"
      record_type: "Soil movement ledger"
      raw_fields: "lot; transfer id; surveyed bank volume; loose volume; wet mass; moisture; density; reuse/waste status; recipient; destination; opening/closing stock"
      collection_method: "Weigh handovers and document moisture/density where converting volume; reconcile all destinations and retained stocks; classify each transfer once."
      unit: "kg; m3"
      frequency: "each transfer and lot close"
      temporal_coverage: "whole lot including preparation, idle, corrections and closeout"
      site_scope: "declared site and package; disclose other consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighbridge calibration; recipient receipts; density/moisture tests"
    - protocol_id: cp_waste
      process_id: "excavate"
      flow_role: "maintenance waste and captured runoff"
      record_type: "Waste register"
      raw_fields: "event id; asset; actual substance; composition; mass; moisture; producing shift; custodian; treatment; upstream ownership"
      collection_method: "Weigh or use traceable waste-transfer records; split every distinct waste and exclude upstream service-owned quantities."
      unit: "kg"
      frequency: "each event"
      temporal_coverage: "whole lot including preparation, idle, corrections and closeout"
      site_scope: "declared site and package; disclose other consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "waste tickets; composition; ownership reconciliation"
    - protocol_id: cp_emissions
      process_id: "excavate"
      flow_role: "direct emissions"
      record_type: "Activity and factor file"
      raw_fields: "asset/activity; fuel; load; hours; engine class; pollutant/speciation; factor value/unit/source; receiving air; soil moisture/silt; meteorology; controls; uncertainty; burned_fuel_mass_kg; fuel_opening_kg; fuel_issued_kg; fuel_returned_kg; fuel_closing_kg; noncombusted_waste_kg; uncontained_release_kg; other_evidenced_fuel_exit_kg; recovered_fuel_in_closing_kg; fuel_balance_gap_kg; burn_fate_method; burn_fate_evidence; burn_uncertainty; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id"
      collection_method: "Link measurements or compatible models to the same shifts and package; preserve species and size basis, document all units and applicability limits.  Distinguish actual fuel supplied/drawn from fuel burned. Independently measure combustion activity or reconcile the complete same-asset/shift stock and mutually exclusive noncombustion fates under fuel_fate_separation, retaining the applicable method, observations and uncertainty. Fuel discarded, returned, retained or released unburned is not exhaust activity; unknown losses remain a fuel-balance gap, not assumed combustion. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "kg; method-specific activity units"
      frequency: "each shift and changed model condition"
      temporal_coverage: "whole lot including preparation, idle, corrections and closeout"
      site_scope: "declared site and package; disclose other consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "method applicability; factor provenance; measurement QA; uncertainty"
  calculation_rules:
    - id: normalize_lot
      applies_to: "all inventory rows"
      rule: "Divide each attributable lot total by the same accepted original-position volume to express it per reference flow; retain original units and the accepted-volume record."
      inputs:
        - "attributable lot amount"
        - "accepted volume"
        - cp_acceptance
      output: "exchange per reference flow"
      source_ids: []
    - id: soil_reconcile
      applies_to: "reusable_soil_handover; waste_soil_handover"
      rule: "Reconcile removed dry soil against dry-mass equivalents of all handovers, retained stock change and losses; document density/moisture and uncertainty rather than forcing loose volume equal to bank volume."
      inputs:
        - cp_soil
        - cp_emissions
      output: "physical movement reconciliation"
      source_ids: []
    - id: transport_activity
      applies_to: "plant_mobilization"
      rule: "Calculate loaded transport from plant tonnes times route kilometres; retain empty-leg treatment from the linked supplier service and the documented attribution share."
      inputs:
        - cp_mobilization
      output: "attributable transport service"
      source_ids: []
    - id: fuel_fate_separation
      applies_to: "excavation_diesel; fossil_co2_air; engine_species_air_carbon_monoxide; engine_species_air_nitrogen_monoxide; engine_species_air_nitrogen_dioxide; engine_species_air_sulfur_dioxide"
      rule: "Keep the supplied-fuel numerator separate from burned_fuel_mass_kg. For the same asset/shift and native kg basis, fuel draw = fuel_opening_kg + fuel_issued_kg - fuel_returned_kg - fuel_closing_kg, and reconcile draw to independently evidenced burned_fuel_mass_kg + noncombusted_waste_kg + uncontained_release_kg + other_evidenced_fuel_exit_kg + signed fuel_balance_gap_kg. Recovered fuel already in closing stock is not another exit or second deduction. A stock-derived combustion estimate is allowed only with independently evidenced complete exclusive noncombustion fates and documented uncertainty; an unexplained balance gap must not be assigned to combustion. Upstream burden of actual nonreturned discarded/lost fuel stays in the supply numerator. Fossil CO2 and fuel-based exhaust factors use only compatible burned-fuel activity and actual fossil share, not total net issue; a complete species factor and constituent/oxidation route are alternatives, not multiplied twice. Actual unburned waste/releases require separately identified exchanges at their real receiving route/medium before finalization; no occurred fate is silently omitted or assigned an invented UUID. Normalize each actual numerator once by the accepted lot volume."
      inputs:
        - cp_energy
        - cp_emissions
        - fuel_opening_kg
        - fuel_issued_kg
        - fuel_returned_kg
        - fuel_closing_kg
        - burned_fuel_mass_kg
        - noncombusted_waste_kg
        - uncontained_release_kg
        - other_evidenced_fuel_exit_kg
        - fuel_balance_gap_kg
      output: "Reconciled supply, combustion and noncombustion fate numerators"
      source_ids: []
    - id: direct_emissions
      applies_to: "fossil_co2_air; engine_species_air_carbon_monoxide; engine_species_air_nitrogen_monoxide; engine_species_air_nitrogen_dioxide; engine_species_air_sulfur_dioxide; soil_dust_pm25_air; soil_dust_coarse_air"
      rule: "Apply documented compatible measurement/model methods to attributable activity; retain the full equation, factor units, species/size basis and control assumptions in dataset evidence. No universal factor is prescribed."
      inputs:
        - cp_emissions
        - cp_energy
        - cp_soil
      output: "direct emission by substance and receiving medium"
      source_ids:
        - epa-ap42-construction-dust
        - epa-nonroad-exhaust
  data_quality_requirements:
    - id: quality_lot
      applies_to: "excavate"
      requirement: "Use consistent lot/site/period and acceptance limits across all records, including rejected work and zero-occurrence evidence."
      evidence: "signed acceptance and shift/event ledger"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Resolve each actual exchange to a verified concrete flow, property and unit before final process publication; record unresolved identities and aggregation/speciation gaps."
      evidence: "identity verification and unit support"
    - id: quality_ranges
      applies_to: "all inventory rows"
      requirement: "Replace provisional screening estimates with foreground records and reviewed evidence; disclose estimation method, missingness and uncertainty."
      evidence: "record completeness and independent reviewed reference evidence"
    - id: quality_upstream
      applies_to: "excavate"
      requirement: "Disclose every supplier dataset boundary and excluded adjacent package owner to prevent whole-project burden gaps."
      evidence: "supplier declarations and parent-project boundary ledger"
    - id: refine_plant_use
      applies_to: "plant_use_excavator; plant_use_loader; plant_use_onsite_haul_plant"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record machine-hours for the excavator, loader and on-site haul equipment. The linked upstream plant-use dataset must disclose machinery manufacture and maintenance coverage and exclude separately collected energy. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Any other actual plant, a genuinely bundled provider service or a dataset with another native reference must be independently refined to its actual identity and unique property/unit; never convert Count to h or add both views."
      evidence: "cp_plant; actual independent records and identity/unit evidence"
    - id: refine_engine_species_air
      applies_to: "engine_species_air_carbon_monoxide; engine_species_air_nitrogen_monoxide; engine_species_air_nitrogen_dioxide; engine_species_air_sulfur_dioxide"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella: resolve each reported substance such as carbon monoxide, nitrogen monoxide, nitrogen dioxide or sulfur dioxide separately to outdoor air. Preserve a reported NOx-as-NO2 basis without inventing a NO/NO2 split; missing speciation remains a data gap. Exhaust particulate must retain its actual size fraction, distinct from soil dust. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual engine substances, exhaust particle-size fractions and unresolved NOx reporting/speciation remain mandatory refinement blockers. The four named conditions are not an exhaustive or assumed-occurring roster."
      evidence: "cp_emissions; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
validation_rules:
  - rule_id: validate_reference
    applies_to: "accepted_excavation_service"
    rule: "Require one accepted service output linked to the reference, 1 m3 original-position basis and all qualifiers. Neither soil mass nor loose volume substitutes for this service."
    source_ids: []
  - rule_id: validate_transfers
    applies_to: "excavate"
    rule: "Reconcile every soil transfer id and destination once, retain stock change and losses, and check moisture/state conversion. Reuse and waste destinations for the same physical soil are mutually exclusive."
    source_ids: []
  - rule_id: validate_mode_rework
    applies_to: "excavate"
    rule: "Check lot/shift linkage for all inputs, outputs, changeover, cleaning and maintenance; retain rework fuel/hours while excluding repeated acceptance volume and unauthorized overbreak."
    source_ids: []
  - rule_id: validate_shared
    applies_to: "excavate"
    rule: "Check all consumers and periods, physical attribution shares and unique event ownership; reconcile plant-service, transport, fuel and maintenance boundaries against double counting."
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "excavate"
    rule: "Require pollutant species/reporting basis, receiving air, compatible activity/model and non-overlapping particle fractions. Missing data must not be replaced by zero or a generic fixed identity."
    source_ids:
      - epa-ap42-construction-dust
      - epa-nonroad-exhaust
  - rule_id: validate_completion
    applies_to: "all inventory rows"
    rule: "Require node-specific collection links, units, bilingual rule/card alignment and a current projection. Range excursions need investigation; unresolved identities and unsupported conversions require explicit incomplete coverage."
    source_ids: []
  - rule_id: atomization_plant_use_complete
    applies_to: "plant_use_excavator; plant_use_loader; plant_use_onsite_haul_plant"
    rule: "Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying refine_plant_use with actual records; unresolved required expansion blocks the dataset."
    source_ids: []
  - rule_id: atomization_engine_species_air_complete
    applies_to: "engine_species_air_carbon_monoxide; engine_species_air_nitrogen_monoxide; engine_species_air_nitrogen_dioxide; engine_species_air_sulfur_dioxide"
    rule: "Require independent actual quantity, identity/state/gate and one property/unit for each applicable exchange in this scope; preserve full original protocol, normalization, stock, returns, waste/releases and shared-resource ownership. Reject completion on an unknown required child, unsupported native reference or missing quantity; evidenced nonoccurrence is separate from missing data. No family-total allocation, copied family Range or duplicate carrier/constituent/bundled-part exchange. Completion requires satisfying refine_engine_species_air with actual records; unresolved required expansion blocks the dataset."
    source_ids:
      - epa-nonroad-exhaust
  - rule_id: validate_atomic_exchange_unit_and_normalization
    applies_to: "all inventory rows"
    rule: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
