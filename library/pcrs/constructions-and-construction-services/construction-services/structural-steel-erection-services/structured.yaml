  calculation_rules:
    - id: derive_accepted_steel
      applies_to: "reference_service"
      rule: "S = sum of unique actual net steel masses permanently retained in accepted members, permanent connections and steel shims; derive each steel constituent from its measured whole-state item and documented constituent bridge. Require S > 0 and complete gate evidence; exclude temporary items, nonsteel grout/coatings, returns, scrap and WIP."
      inputs:
        - cp_steel_erect_material
        - "accepted piece/connection schedule"
        - "measured whole-state/steel bridges"
      output: "S in kg"
      source_ids:
        - steel-erection-accounting-method
    - id: normalize_concrete_exchange
      applies_to: "all inventory rows"
      rule: "For each independently identified concrete exchange, convert its native event quantity to its required unit using an evidenced same-state bridge, assign its owned share, then divide its episode numerator once by S. Keep different SKU/state/receiver or substance/medium numerators separate. Only reference_service uses S/S = 1 kg; a mixed ledger sum is QA, not an exchange."
      inputs:
        - cp_steel_erect_material
        - cp_steel_erect_utility
        - cp_steel_erect_asset
        - cp_steel_erect_release
        - S
      output: "concrete unit per 1 kg reference flow"
      source_ids:
        - steel-erection-accounting-method
    - id: compatible_pool_check
      applies_to: "all inventory rows"
      rule: "Within one compatible identity/state or evidenced constituent pool, compare opening stock plus actual inputs with independently observed retained incorporation, closing stock and exclusive actual exits/releases. Record differences and uncertainty as findings; do not solve for an unmeasured exchange. Separate factory coating, added coating/grout, dry constituents and water-only fates."
      inputs:
        - cp_steel_erect_material
        - cp_steel_erect_utility
        - cp_steel_erect_release
        - "compatible identity/constituent bridge"
      output: "pool-specific QA residual and uncertainty"
      source_ids:
        - steel-erection-accounting-method
    - id: fossil_carbon_check
      applies_to: "fossil_co2_air"
      rule: "Identified fossil CO2 mass <= independently measured fossil carbon burned * 44/12. Obtain fossil carbon from actual burned fuel and evidenced carbon/fossil fractions; do not assume generic diesel fossil fraction or complete oxidation. This constrains CO2 carbon only and is not a total combustion mass balance."
      inputs:
        - cp_steel_erect_utility
        - cp_steel_erect_release
        - "actual fossil carbon burned"
      output: "fossil-carbon QA constraint"
      source_ids:
        - carbon-oxidation-identity
    - id: diesel_supply_and_fates
      applies_to: "diesel_fuel; fossil_co2_air"
      rule: "For each actual fuel identity and same attributed event/period use net-of-tare external receipts R, carried opening O, intact reusable closing C and evidenced actual usable outward return U, all in kg. This PCR uses the consumed-only fuel-supply representation: fuel_supply_kg = O + R - C - U. Include all nonreturned unburned waste/loss in that upstream product input; retain opening/closing source-cohort burden once, and do not add a return credit or another return exchange for U. diesel_fuel amount = fuel_supply_kg / S once. Actual burned_kg is an independent measured combustion activity, or is derived only from a complete mutually exclusive audit: burned_kg = fuel_supply_kg - nonburned_waste_kg - nonburned_release_kg - nonburned_retained_kg. Unburned material already assigned to C or U is not subtracted again; retained incident material outside those pools is independently evidenced. Unknown loss is a gap, not inferred burn or zero. Record actual final waste identities/receivers and species/media releases separately under the original refinement duties; an uncontained whole-fuel audit is not a generic elementary exchange and waste carrier/contained fuel are nonadditive. Keep separately evidenced fossil burned carbon for the CO2 method, with actual fuel composition; no default oxidation fraction. Reconcile provider coverage separately for fuel supply, combustion and each waste/release fate. Exclude only the evidenced same-boundary overlap for that component and add uncovered components once; partial provider coverage never authorizes either an omitted component or recharging an already included one. All setup, idle, tests and rework remain included. Physical closure uses raw O + R against C + U + independently measured burned_kg + nonburned_waste_kg + nonburned_release_kg + nonburned_retained_kg, all at the same cutoff/scope, with measured uncertainty. The net exchange fuel_supply_kg is not inserted again as raw R in that closure. When burn is independently measured, the same equality is a QA check, not a method to fill unknown outlets."
      inputs:
        - cp_steel_erect_utility
        - O_kg
        - R_net_kg
        - C_intact_carried_kg
        - U_usable_outward_kg
        - burned_kg
        - nonburned_waste_kg
        - nonburned_release_kg
        - nonburned_retained_kg
        - S
      output: "Supply kg per reference and separate burned-kg audit"
      source_ids: []
    - id: atomic_child_normalization
      applies_to: "fabricated_steel_members_column; fabricated_steel_members_beam; fabricated_steel_members_bracing; permanent_connection_steel_bolt; permanent_connection_steel_nut; permanent_connection_steel_washer; permanent_connection_steel_plate; permanent_connection_steel_shim; base_completion_products_grout; incidental_surface_repair_products_chemical; incidental_surface_repair_products_abrasive; incidental_surface_repair_products_coating; tool_temporary_replacement_products_cutting; tool_temporary_replacement_products_drilling; tool_temporary_replacement_products_support; lubricants_other_operating_products_oil; lubricants_other_operating_products_fluid; lubricants_other_operating_products_spill_carrier; lubricants_other_operating_products_cleaning_carrier; hired_equipment_services_crane; hired_equipment_services_access; hired_equipment_services_logistics; usable_material_exits_fabricated_steel_members_column; usable_material_exits_fabricated_steel_members_beam; usable_material_exits_fabricated_steel_members_bracing; usable_material_exits_permanent_connection_steel_bolt; usable_material_exits_permanent_connection_steel_nut; usable_material_exits_permanent_connection_steel_washer; usable_material_exits_permanent_connection_steel_plate; usable_material_exits_permanent_connection_steel_shim; usable_material_exits_base_completion_products_grout; usable_material_exits_incidental_surface_repair_products_chemical; usable_material_exits_incidental_surface_repair_products_abrasive; usable_material_exits_incidental_surface_repair_products_coating; usable_material_exits_tool_temporary_replacement_products_cutting; usable_material_exits_tool_temporary_replacement_products_drilling; usable_material_exits_tool_temporary_replacement_products_support; usable_material_exits_lubricants_other_operating_products_oil; usable_material_exits_lubricants_other_operating_products_fluid; usable_material_exits_lubricants_other_operating_products_spill_carrier; usable_material_exits_lubricants_other_operating_products_cleaning_carrier; steel_scrap_waste_offcut; steel_scrap_waste_rejected; coating_grout_residue_waste_coating; coating_grout_residue_waste_grout"
      rule: "Record independent_physical_quantity separately by atomic_flow_row_id; actual_<row_id>_quantity is its named alias only, never a copied family amount. Materials retain original CP per-identity/state gross/net stock and outward-return conventions; transfers use actual paired custody quantity; usable exits and wastes use independent actual fate quantities. Number-of-items owned asset equivalents use this PCR original job_driver/full_life_driver complete-life fraction including manufacture, maintenance, replacement and end of life, with every consumer and a positive complete denominator. Duration/h service children instead use actual attributable job hours with the matching complete-life burden per hour; never multiply hours by the fraction again. Purchased services use only actual complete physical tasks whose real contract defines Item(s), with original actual attribution; hours, days and prices cannot become event counts. atomic_child_intensity = independent_physical_quantity / S, where S is independently measured uniquely accepted permanent steel mass in kg from accepted members/connections/steel shims, excluding coatings/grout under the original acceptance rule; S=0 blocks normalization. Non-exchange parent role ledgers and original CP operands retain their stock, transfer, closure and ownership functions, without adding a second exchange or changing the method."
      inputs:
        - atomic_flow_row_id
        - independent_physical_quantity
        - exchange_property
        - exchange_unit
        - S
        - cp_steel_erect_material
        - cp_steel_erect_asset
        - cp_steel_erect_release
      output: "atomic_child_intensity"
      source_ids: []
