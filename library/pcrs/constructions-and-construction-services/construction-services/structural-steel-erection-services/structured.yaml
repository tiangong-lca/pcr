product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.structural-steel-erection-services"
  classification_refs: "CPC 3.0 54550; narrower"
  covered_products: "Site erection service for shop-fabricated hot-rolled columns, beams and bracing with permanent field bolting"
  excluded_products: "Shop fabrication; structural field welding; cold-formed framing; independent full coating/fireproofing; new foundation/anchor manufacture; whole-building construction"
  representative_product: "Erection service for an aligned, stable and accepted permanently bolted steel assembly"
  production_route: "Receiving/staging → lifting and initial connection → alignment and permanent bolting → owned base/repair completion → temporary-support release and acceptance"
  market_state: "Completed erection service measured by actual accepted net permanent steel; distinct from manufacture of the delivered steel"
functional_unit:
  what: "Erection service for an accepted permanently bolted hot-rolled structural steel assembly"
  how_much: "1 kg of accepted net permanent steel S; count each retained steel constituent once per episode"
  how_well: "Actual project alignment and permanent-connection inspection, stability, owned base/incidental repair completion and controlled support release accepted"
  how_long_or_cycle: "One actual complete erection episode spanning receiving/staging, lifting/initial connection, alignment/permanent bolting, owned base/repair completion and support release/acceptance with actual intervals/reporting periods; no default days or building lifetime"
  reference_flow_link: "reference_service"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This rule covers site erection of shop-fabricated hot-rolled steel columns, beams and bracing joined by permanent field bolting. Actual owned steel shims, base completion/grout, incidental preparation and touch-up, temporary-support control and cleanup belong to the complete episode. Use actual work and acceptance records, without a presumed consumption rate, design performance or standard duration. Shop fabrication, structural field welding, cold-formed framing, independent full coating/fireproofing, new foundation/anchor manufacture and whole-building construction are excluded. Such work or a real independent handoff requires scope review. The FHWA inspection guide identifies lifting, field connections, bearing alignment and field coating responsibilities; OSHA material supports identifying the starting interface and stability duties, rather than universal acceptance thresholds or LCA consumption data."
      source_ids: []
    - rule_id: boundary_start
      applies_to: "steel_erect"
      rule: "Begin at the released foundation/anchor and access interface with identified delivered members. Record existing support geometry, load path and interface release as starting-condition observations; do not fabricate product cards for design approval, geometry or readiness."
      source_ids:
        - osha-steel-site
    - rule_id: boundary_assembly
      applies_to: "steel_erect"
      rule: "Own lifting, initial connection, alignment, permanent field bolting and actual owned steel shims, nonsteel base completion, incidental preparation/touch-up and cleanup. Component roles are fabricated columns/beams/bracing and permanent bolts/nuts/washers/plates/shims. Initial connection or crane release is not final acceptance; use the actual project connection inspection and stability gate."
      source_ids:
        - fhwa-inspection-steel
        - osha-steel-stability
    - rule_id: boundary_gate
      applies_to: "reference_service"
      rule: "End at one documented aligned, permanently bolted and stable accepted assembly after all actual owned grout/base and surface-repair obligations and controlled temporary-support release are complete. Record inapplicable duties with evidence; unresolved duties prevent declaring this gate. Do not include the later building use or demolition."
      source_ids:
        - steel-erection-accounting-method
        - osha-steel-stability
    - rule_id: boundary_phases
      applies_to: "steel_erect"
      rule: "Index receiving/staging, lifting/initial connection, alignment/permanent bolting, owned base/repair completion and support release/acceptance by actual dates and reporting periods. Link every material, equipment, utility, output, rework and replacement event to its phase and owner. Preserve open stocks and uncompleted periods rather than advancing them to acceptance."
      source_ids:
        - steel-erection-accounting-method
    - rule_id: boundary_node
      applies_to: "steel_erect"
      rule: "One accountable node owns the complete erection episode and its internal fitting/rebolting/touch-up loops. Phase records, stock movements and changed existing-asset condition are observations, not independent products. A genuinely separately owned material-state transfer requires a transfer identifier and explicit node/boundary review; never erase that handoff."
      source_ids:
        - steel-erection-accounting-method
    - rule_id: boundary_scope_review
      applies_to: "steel_erect"
      rule: "Shop fabrication, planned or required structural field welding, cold-formed framing, independent full coating/fireproofing, new foundation/anchor manufacture and whole-building construction are outside this category. Contrary actual work triggers scope review and a documented handoff before completion; incidental fitting is not permission to expand the fabrication route."
      source_ids:
        - steel-erection-accounting-method
    - rule_id: boundary_assets
      applies_to: "steel_erect"
      rule: "Identify cranes, access/logistics equipment, temporary braces and shared meters with all actual consumers and use periods. Reusable asset mass and custody are observed; manufacture, maintenance and operation follow the actual provider/owned boundary and evidenced attribution, with no assumed lifetime or full-asset charge."
      source_ids:
        - steel-erection-accounting-method
boundary_abstraction:
  declared_starting_condition: "Released foundation/anchor interface, existing geometry/load path and access, plus delivered members with piece marks and connection schedules"
  starting_condition_role: "Observed interface condition; existing assets are not products newly manufactured by this erection service"
  product_classification_scope: "Classification is mapping context; this service is limited to hot-rolled member erection with permanent field bolting"
  recursive_input_rule: "Record any same-category prior erection service by actual provider, state, ownership boundary and transfer; do not recursively rebuild existing supports or duplicate accepted steel output; review any real cross-owner handoff"
  upstream_dataset_requirement: "Provide supply-chain datasets/boundaries for actual fabricated-state members, connection products, materials, utilities and equipment services; count provider-included burdens once and disclose unknown coverage"
  disclosure: "Disclose starting release evidence, work periods, ownership, equipment coverage, actual acceptance/release, WIP/reject states and unresolved data"
