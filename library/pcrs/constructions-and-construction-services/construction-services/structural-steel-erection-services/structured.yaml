allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all inventory rows"
    rule: "Assign directly measured piece, connection and phase activity first. For genuinely shared crane/access/meter use, list every consuming episode/node and period, retain owned idle/tests/rework, then allocate only the unassigned residual using documented causal use or occupation evidence. Record period-specific shares and uncertainty; shares must be nonoverlapping and reconcile to observed coverage."
    source_ids:
      - steel-erection-accounting-method
  - rule_id: allocation_provider
    applies_to: "hired_equipment_services_crane; hired_equipment_services_access; hired_equipment_services_logistics; atomic_hired_equipment_services; diesel_fuel; electricity; lubricants_other_operating_products_oil; lubricants_other_operating_products_fluid; lubricants_other_operating_products_spill_carrier; lubricants_other_operating_products_cleaning_carrier; atomic_lubricants_other_operating_products"
    rule: "Read each service boundary before adding owned fuel, electricity, maintenance or capital burdens. Count provider-included burdens once. For a self-owned reusable crane, tool or temporary brace, use evidenced actual service capacity/lifetime, use and damage/replacement records for manufacture attribution; unknown life or coverage remains a gap, never a default reuse count."
    source_ids:
      - steel-erection-accounting-method
  - rule_id: allocation_rework
    applies_to: "steel_erect; reference_service"
    rule: "Keep failed member/connection inspection, damaged coating and unaccepted assemblies linked to their original piece, node and period. Approved fitting, rebolting or touch-up retains its burdens within steel_erect. Record actual return, downgrade, recovery, waste or retained WIP destinations separately. Acceptance counts each permanent steel constituent once after successful rework; neither repeated installation nor unresolved reject mass enlarges S."
    source_ids:
      - steel-erection-accounting-method
  - rule_id: allocation_exits
    applies_to: "usable_material_exits_fabricated_steel_members_column; usable_material_exits_fabricated_steel_members_beam; usable_material_exits_fabricated_steel_members_bracing; usable_material_exits_permanent_connection_steel_bolt; usable_material_exits_permanent_connection_steel_nut; usable_material_exits_permanent_connection_steel_washer; usable_material_exits_permanent_connection_steel_plate; usable_material_exits_permanent_connection_steel_shim; usable_material_exits_base_completion_products_grout; usable_material_exits_incidental_surface_repair_products_chemical; usable_material_exits_incidental_surface_repair_products_abrasive; usable_material_exits_incidental_surface_repair_products_coating; usable_material_exits_tool_temporary_replacement_products_cutting; usable_material_exits_tool_temporary_replacement_products_drilling; usable_material_exits_tool_temporary_replacement_products_support; usable_material_exits_lubricants_other_operating_products_oil; usable_material_exits_lubricants_other_operating_products_fluid; usable_material_exits_lubricants_other_operating_products_spill_carrier; usable_material_exits_lubricants_other_operating_products_cleaning_carrier; atomic_usable_material_exits; atomic_returnable_packaging_exit; steel_scrap_waste_offcut; steel_scrap_waste_rejected; atomic_steel_scrap_waste"
    rule: "An actual usable return is not an accepted erection service or an automatic avoided-product credit. Keep dispatch identity, state, ownership and receiver. Report waste treatment responsibilities and any separately reviewed recovery allocation explicitly; do not net heterogeneous returns or scrap against the reference mass. Used equipment returns are custody events rather than unused material exits."
    source_ids:
      - steel-erection-accounting-method
dataset_production:
  collection_protocols:
    - protocol_id: cp_steel_erect_material
      process_id: "steel_erect"
      flow_role: "materials, products, waste and accepted S"
      record_type: "weighing, piece/connection and fate register"
      raw_fields: "event_id; lot/configuration; process_id; phase; timestamp/period; owner; role; actual_identity/current_state; native_amount/unit; measured_same_state_bridge; receiver/medium; evidence; uncertainty; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Use calibrated weighing or traceable same-state supplier mass records; reconcile piece marks, connection schedule, whole/constituent bridges and acceptance/fate documents. Observe actual foundation/anchor release, geometry, inspections and stock as contextual records. Measure S from unique accepted permanent steel constituents, not from a balancing residual. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity aliases this record independent physical quantity keyed by atomic_flow_row_id under the original CP method and atomic_child_normalization, never another parent quantity. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      unit: "kg; native count/volume with measured bridge"
      frequency: "Each receipt, issue, rework, acceptance, return or dispatch; stock at period boundaries"
      temporal_coverage: "Starting interface release through completed acceptance; all phases and actual reporting periods, including open periods and stock boundaries"
      site_scope: "Actual erection site and declared equipment/service ownership boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations, supplier constituent data, permanent accepted schedule, inspection/release signatures, custody and waste tickets"
    - protocol_id: cp_steel_erect_utility
      process_id: "steel_erect"
      flow_role: "fuel, electricity and supplied water"
      record_type: "meter, stock and equipment-duty journal"
      raw_fields: "event_id; lot/configuration; process_id; phase; timestamp/period; owner; role; actual_identity/current_state; native_amount/unit; measured_same_state_bridge; receiver/medium; evidence; uncertainty; O_kg; R_net_kg; C_intact_carried_kg; U_usable_outward_kg; fuel_supply_kg; burned_kg; nonburned_waste_kg; nonburned_release_kg; nonburned_retained_kg; fate_event_ids; fuel_source_cohort; attribution_scope; provider_coverage"
      collection_method: "Read calibrated meters and opening/closing stocks with delivery, source/state and equipment duty. Include owned idle, tests and rework. Mark provider coverage and direct assignments before residual attribution. Convert liquid volume only using evidenced actual state density; preserve native kWh. Use diesel_supply_and_fates for the mandatory supply/burn distinction, stock carry, exclusive fates and consumed-only usable-return convention. Keep raw operands in kg before the single final normalization."
      unit: "kg; kWh; native meter units with bridge"
      frequency: "Every meter/stock interval and duty event, including interruptions"
      temporal_coverage: "Starting interface release through completed acceptance; all phases and actual reporting periods, including open periods and stock boundaries"
      site_scope: "Actual erection site and declared equipment/service ownership boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter topology/calibration, receipts, density evidence, full duty log and provider coverage"
