      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| validate_gate | reference_service | Require positive independently measured S and piece/connection acceptance, actual alignment and bolting inspection, stability, owned completion and controlled support release. Receipt weight or initial connection alone cannot pass. Exclude returns, scrap, temporary items and unaccepted WIP. | steel-erection-accounting-method |\n| validate_identity | all inventory rows | Resolve each concrete material/SKU/state, service and receiver or elementary substance/medium before final exchange production. Fixed generic diesel, fossil CO2 to unspecified air and H2O to unspecified air retain their actual identity limits. Verify flow-property/unit-group chains independently; no unresolved umbrella is a concrete UUID. | steel-erection-accounting-method |\n| validate_measurement | all inventory rows | Check native numerator, same-state conversion, protocol ownership, unique event and one division by S. Reference alone self-normalizes to one. Whole coated-product input mass cannot be replaced by retained net steel. Range gaps and unknown occurrence remain explicit; no arbitrary numeric bounds prove completeness. | steel-erection-accounting-method |\n| validate_phases | steel_erect | Check actual five-phase and reporting-period journal, all piece/asset/utility/output links and attribution decisions. Rework, replacement and termination require resolved state and destination. Open periods or missing release obligations prevent episode finalization and cannot be silently carried into accepted output. | steel-erection-accounting-method |\n| validate_shared | hired_equipment_services_crane; hired_equipment_services_access; hired_equipment_services_logistics; atomic_hired_equipment_services; diesel_fuel; electricity | Reconcile shared assets/services, all consumers/periods, direct assignments and residual shares. Test provider fuel/capital/maintenance against owned rows for duplicate coverage. Missing self-owned lifetime/use evidence remains a disclosed gap rather than full asset manufacture or zero burden. | steel-erection-accounting-method |\n| validate_fates | all inventory rows | Close only compatible material/state or evidenced constituent pools, including opening/closing stock. Keep water-only and fossil-carbon checks separate. Distinguish captured/uncaptured, wet/dry and product/waste/environment destinations. A residual is a finding and never a fabricated exchange; do not equate fuel kg with CO2 kg or invent oxygen. | steel-erection-accounting-method; carbon-oxidation-identity |\n| validate_scope | steel_erect | Review any separately owned handoff, structural field welding or independent fabrication/full coating before applying this category. Record actual local/project acceptance requirements; safety guidance examples supply no default final-bolt criterion, design tolerance or inventory rate. | fhwa-inspection-steel; osha-steel-site; osha-steel-stability |\n| close_atomic_fabricated_steel_members | steel_erect; cp_steel_erect_material | Block final foreground completion until every actual object in atomic_fabricated_steel_members is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_permanent_connection_steel | steel_erect; cp_steel_erect_material | Block final foreground completion until every actual object in atomic_permanent_connection_steel is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_base_completion_products | steel_erect; cp_steel_erect_material | Block final foreground completion until every actual object in atomic_base_completion_products is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_incidental_surface_repair_products | steel_erect; cp_steel_erect_material | Block final foreground completion until every actual object in atomic_incidental_surface_repair_products is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_tool_temporary_replacement_products | steel_erect; cp_steel_erect_material | Block final foreground completion until every actual object in atomic_tool_temporary_replacement_products is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_lubricants_other_operating_products | steel_erect; cp_steel_erect_material | Block final foreground completion until every actual object in atomic_lubricants_other_operating_products is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_hired_equipment_services | steel_erect; cp_steel_erect_asset | Block final foreground completion until every actual object in atomic_hired_equipment_services is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_packaging_received | steel_erect; cp_steel_erect_material | Block final foreground completion until every actual object in atomic_packaging_received is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_direct_freshwater_abstraction | steel_erect; cp_steel_erect_release | Block final foreground completion until every actual object in atomic_direct_freshwater_abstraction is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_usable_material_exits | steel_erect; cp_steel_erect_material | Block final foreground completion until every actual object in atomic_usable_material_exits is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_returnable_packaging_exit | steel_erect; cp_steel_erect_material | Block final foreground completion until every actual object in atomic_returnable_packaging_exit is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_steel_scrap_waste | steel_erect; cp_steel_erect_material | Block final foreground completion until every actual object in atomic_steel_scrap_waste is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_coating_grout_residue_waste | steel_erect; cp_steel_erect_material | Block final foreground completion until every actual object in atomic_coating_grout_residue_waste is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_captured_preparation_solids | steel_erect; cp_steel_erect_material | Block final foreground completion until every actual object in atomic_captured_preparation_solids is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_packaging_waste | steel_erect; cp_steel_erect_material | Block final foreground completion until every actual object in atomic_packaging_waste is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_oily_consumable_waste | steel_erect; cp_steel_erect_material | Block final foreground completion until every actual object in atomic_oily_consumable_waste is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_collected_wastewater_slurry | steel_erect; cp_steel_erect_material | Block final foreground completion until every actual object in atomic_collected_wastewater_slurry is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_other_engine_species_air | steel_erect; cp_steel_erect_release | Block final foreground completion until every actual object in atomic_other_engine_species_air is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_physical_particulate_air | steel_erect; cp_steel_erect_release | Block final foreground completion until every actual object in atomic_physical_particulate_air is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_volatile_species_air | steel_erect; cp_steel_erect_release | Block final foreground completion until every actual object in atomic_volatile_species_air is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| close_atomic_specific_direct_water_releases | steel_erect; cp_steel_erect_release | Block final foreground completion until every actual object in atomic_specific_direct_water_releases is reconciled to independent actual child exchanges or evidenced nonactivation. Check one property/unit, independent physical quantity normalized by the original reference denominator, source/fate/period, one burden owner and the original stock/WIP/rework closure. Candidate structural success cannot close this method gate. |  |\n| atomic_pair_provenance_complete | actual internal child source and recipient transfers | Verify actual source/receipt evidence, original physical quantities/units and ownership for the same material/state/event/gate. Traceable reuse of the same signed measurement is allowed; copied parent totals, overwritten receipts and forced unknown equality are prohibited. Unexplained differences without uncertainty, actual loss or state-transition responsibility evidence block completion; verify exactly one normalization per card. |  |\n| validate_diesel_supply_fates | diesel_fuel; fossil_co2_air | Check diesel supply includes nonreturned unburned fates, with stocks/usable returns deducted once under diesel_supply_and_fates. Check combustion uses burned_kg only; each actual waste/release/retained fate has independent identity, quantity and ownership evidence. Unknown fate or provider overlap blocks completion; do not make a balancing emission or return credit. |  |\n\n"
