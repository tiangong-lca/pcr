      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_direct | all inventory rows | Assign directly measured piece, connection and phase activity first. For genuinely shared crane/access/meter use, list every consuming episode/node and period, retain owned idle/tests/rework, then allocate only the unassigned residual using documented causal use or occupation evidence. Record period-specific shares and uncertainty; shares must be nonoverlapping and reconcile to observed coverage. | steel-erection-accounting-method |\n| allocation_provider | hired_equipment_services_crane; hired_equipment_services_access; hired_equipment_services_logistics; atomic_hired_equipment_services; diesel_fuel; electricity; lubricants_other_operating_products_oil; lubricants_other_operating_products_fluid; lubricants_other_operating_products_spill_carrier; lubricants_other_operating_products_cleaning_carrier; atomic_lubricants_other_operating_products | Read each service boundary before adding owned fuel, electricity, maintenance or capital burdens. Count provider-included burdens once. For a self-owned reusable crane, tool or temporary brace, use evidenced actual service capacity/lifetime, use and damage/replacement records for manufacture attribution; unknown life or coverage remains a gap, never a default reuse count. | steel-erection-accounting-method |\n| allocation_rework | steel_erect; reference_service | Keep failed member/connection inspection, damaged coating and unaccepted assemblies linked to their original piece, node and period. Approved fitting, rebolting or touch-up retains its burdens within steel_erect. Record actual return, downgrade, recovery, waste or retained WIP destinations separately. Acceptance counts each permanent steel constituent once after successful rework; neither repeated installation nor unresolved reject mass enlarges S. | steel-erection-accounting-method |\n| allocation_exits | usable_material_exits_fabricated_steel_members_column; usable_material_exits_fabricated_steel_members_beam; usable_material_exits_fabricated_steel_members_bracing; usable_material_exits_permanent_connection_steel_bolt; usable_material_exits_permanent_connection_steel_nut; usable_material_exits_permanent_connection_steel_washer; usable_material_exits_permanent_connection_steel_plate; usable_material_exits_permanent_connection_steel_shim; usable_material_exits_base_completion_products_grout; usable_material_exits_incidental_surface_repair_products_chemical; usable_material_exits_incidental_surface_repair_products_abrasive; usable_material_exits_incidental_surface_repair_products_coating; usable_material_exits_tool_temporary_replacement_products_cutting; usable_material_exits_tool_temporary_replacement_products_drilling; usable_material_exits_tool_temporary_replacement_products_support; usable_material_exits_lubricants_other_operating_products_oil; usable_material_exits_lubricants_other_operating_products_fluid; usable_material_exits_lubricants_other_operating_products_spill_carrier; usable_material_exits_lubricants_other_operating_products_cleaning_carrier; atomic_usable_material_exits; atomic_returnable_packaging_exit; steel_scrap_waste_offcut; steel_scrap_waste_rejected; atomic_steel_scrap_waste | An actual usable return is not an accepted erection service or an automatic avoided-product credit. Keep dispatch identity, state, ownership and receiver. Report waste treatment responsibilities and any separately reviewed recovery allocation explicitly; do not net heterogeneous returns or scrap against the reference mass. Used equipment returns are custody events rather than unused material exits. | steel-erection-accounting-method |\n\n"
