      requirement: "Each actual component/event has one compatible role among existing reusable-kit observation, newly consumed replacement, nonreusable building attachment, usable exit or actual discard. replacement_kit_products children count only actual new episode replacement consumption under reviewed attribution, never the deployed mass of existing standards/ledgers/decks as new manufacture. Exclude corresponding manufacture from unadjusted kit-service coverage; no duplicate. consumed_anchors_ties is only actual nonreusable consumed attachment and cannot repeat that same replacement component. Original kit occupation hours and auxiliary hired equipment remain exclusive, with original manufacture/maintenance/fuel/removal ownership retained; unreconciled coverage blocks completion."
