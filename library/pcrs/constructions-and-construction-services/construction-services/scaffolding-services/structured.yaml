    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Measure A from disjoint accepted facade-elevation polygons of the same stable configuration and closed episode. Exclude unserved gaps, overlap, ground-plan area and repeated deck/lift areas. A must be positive and independently surveyed under cp_scaffold_cycle_material."
  - id: concrete_numerators
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass / Area / Energy / Duration"
      uuid: ""
    required_unit: "native unit to kg, m2, kWh or h"
    rule: "Keep each concrete SKU, current state, substance and receiver separate. Use traceable count-to-mass, volume-to-mass or other same-state bridges where needed; divide each attributable episode numerator by A once. Mixed totals are QA rather than exchange identities."
  - id: time_qualifier
    applies_to: "reference product; asset services"
    required_property_ref:
      name: "Duration"
      uuid: ""
    required_unit: "h"
    rule: "Actual dates, availability and unavailability intervals, height, loading and deck/tie layout are required qualifiers. Do not replace the area reference with area multiplied by time. Resolve standalone time support before binding hour exchanges; no default day or shift."
  - id: energy_integrity
    applies_to: "electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Preserve metered electrical energy and its supply boundary; verify the compatible flow property independently. Do not substitute net calorific value for Energy or equipment useful work for metered use."
