allocation_rules:
  - rule_id: direct_episode
    applies_to: "scaffold_cycle"
    rule: "Attribute direct events to the actual configuration and phase first; all erection, idle, unavailable, test, dismantling and ordinary rework burdens belonging to this episode remain in its numerator. Repeated inspections or use periods do not create additional accepted area."
    source_ids:
      - cycle-normalization-method
  - rule_id: shared_consumers
    applies_to: "scaffold_cycle"
    rule: "Enumerate every real kit, auxiliary equipment and meter consumer and relevant period, including outside consumers. Subdivide actual measured use first; allocate only the remaining shared burden by a documented causal capacity/use basis with exclusive shares and uncertainty. Reconcile the whole provider/meter total before dividing this episode share by A."
    source_ids:
      - asset-attribution-method
  - rule_id: asset_coverage
    applies_to: "scaffold_cycle"
    rule: "Keep scaffold-kit occupation and auxiliary hired equipment mutually exclusive for each actual asset. Count provider-included manufacture, fuel and maintenance once. For self-owned assets require evidenced service capacity/lifetime, actual use, wear, repair and damage/retirement attribution, or declare a gap. No assumed reuse count and no full new-kit manufacture per deployment."
    source_ids:
      - asset-attribution-method
  - rule_id: replacement_and_return
    applies_to: "scaffold_cycle"
    rule: "Avoid charging the same replacement manufacture both as consumed product and unadjusted kit-service manufacture. Used kit return records its worn/cleaned/repair state and is not unused input return. Product/waste exits retain real recipients; return or recycling alone supplies no automatic substitution credit."
    source_ids:
      - asset-attribution-method
      - compatible-pool-ledger-method
  - rule_id: rejected_cycle
    applies_to: "scaffold_cycle"
    rule: "Link failed inspection, repeat joining, cleaning, quarantine, approved repair and exit decisions to the originating kit/configuration. Retain their actual burdens and unresolved fates. A partial handover, changed cohort or open return ledger cannot be allocated into a fictitious completed service output."
    source_ids:
      - cycle-normalization-method
      - compatible-pool-ledger-method
dataset_production:
  collection_protocols:
    - protocol_id: cp_scaffold_cycle_material
      process_id: "scaffold_cycle"
      flow_role: "configuration geometry; materials; product and waste exits"
      record_type: "phase-indexed foreground event record"
      raw_fields: "event/lot/configuration ID; process/phase/time; owner; role; actual identity/current state; native amount/unit; measured same-state bridge; receiver/medium; evidence; uncertainty; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Survey disjoint accepted elevation polygons independently and reconcile handover and closure. Weigh each concrete material/current state and dispatch; retain counts and traceable same-state conversion when direct weighing is unavailable. Observe outside deposits and constituent moisture independently; identify actual receiver and phase. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity aliases this record independent physical quantity keyed by atomic_flow_row_id under the original CP method and atomic_child_normalization, never another parent quantity. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      unit: "kg; m2"
      frequency: "each event and interval boundary"
      temporal_coverage: "full issue-to-return episode, including unavailability and rework"
      site_scope: "declared site/configuration and responsible off-site cleaning/return duties"
      aggregation_rule: "per reference flow"
      quality_evidence: "survey and acceptance records; scale calibration; component/SKU and dispatch documents; moisture/constituent evidence"
    - protocol_id: cp_scaffold_cycle_utility
      process_id: "scaffold_cycle"
      flow_role: "fuel; electricity; supplied water"
      record_type: "phase-indexed foreground event record"
      raw_fields: "event/lot/configuration ID; process/phase/time; owner; role; actual identity/current state; native amount/unit; measured same-state bridge; receiver/medium; evidence; uncertainty; O_kg; R_net_kg; C_intact_carried_kg; U_usable_outward_kg; fuel_supply_kg; burned_kg; nonburned_waste_kg; nonburned_release_kg; nonburned_retained_kg; fate_event_ids; fuel_source_cohort; attribution_scope; provider_coverage"
      collection_method: "Read calibrated fuel/utility meters and opening/closing stocks over the entire owned duty, idle, test and rework intervals. Record supply identity and meter topology; reconcile every consumer and provider-covered quantities before episode attribution. Convert native units only using an independently evidenced same-state bridge. Use diesel_supply_and_fates for the mandatory supply/burn distinction, stock carry, exclusive fates and consumed-only usable-return convention. Keep raw operands in kg before the single final normalization."
      unit: "kg; kWh"
      frequency: "each event and interval boundary"
      temporal_coverage: "full issue-to-return episode, including unavailability and rework"
      site_scope: "declared site/configuration and responsible off-site cleaning/return duties"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration and readings; supply documents; equipment/phase log; allocation reconciliation"
