published_dataset_profile:
  dataset_role: "Foreground scaffolding-cycle data package with process/lifecyclemodel projections"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Compatible supported modular galvanized-steel facade scaffold episodes with explicit area, configuration, actual duration and asset/provider coverage"
  excluded_use: "Engineering safety certification; rental alone; other scaffold systems; user-trade inventory; unqualified area-day comparison; incomplete cycles"
  required_metadata: "Site/geography; actual configuration/kit IDs; positive A and polygons; height/load/decks/ties/substrate; phase dates and actual availability duration; handover/closure; concrete identities; asset/provider and meter coverage"
  required_quality_disclosure: "Performed/skipped checks and completeness; unresolved identities, support, ranges, fates and owned-asset attribution; measured conversions, factor/model applicability, uncertainty and closure residuals"
  update_trigger: "Configuration/geometry, load/deck/tie, source/technology, ownership/provider coverage, duration/cohort, maintenance/fate evidence or identity/method changes"
data_sources:
  - id: "peri-instructions"
    type: "handbook"
    reference: "PERI UP Scaffolding Kit, Core components, Assembly instructions, Version 2.2, pp. 8, 10, 12–14. https://www.peri.ie/dam/jcr%3A8e2c13f7-1dd2-337d-a227-cb3329355256/peri-up-scaffolding-kit-core-components-instructions-for-assembly-and-use.pdf"
    used_for: "Manufacturer-specific cleaning/maintenance, component condition, support/anchoring, transport, marking and inspected handover. No universal lifespan, reuse count, consumption rate or safety threshold is adopted."
  - id: "osha-scaffold"
    type: "official_guidance"
    reference: "US OSHA, Scaffolding eTool, General Requirements, Scaffold Platform Construction and Criteria for Supported Scaffolds. https://www.osha.gov/etools/scaffolding/general-requirements"
    used_for: "Rigid-supported distinction and support/bracing/platform context. US safety guidance does not provide an LCA inventory rate or replace actual local design and acceptance."
  - id: "unsd-cpc21-scaffold"
    type: "official_guidance"
    reference: "UNSD, CPC Version 2.1, 54570 explanatory note. https://unstats.un.org/unsd/classifications/Econ/Detail/EN/1074/54570"
    used_for: "Historical context for erection/dismantling and associated rental versus rental alone. Explicitly not a CPC 3.0 explanatory note."
  - id: "cycle-normalization-method"
    type: "method_factor"
    reference: "PCR normative method defined in sections 3, 4 and 8: unique accepted facade elevation and complete-episode normalization."
    used_for: "Author-defined collection/normalization contract, not an external publication or empirical rate."
  - id: "asset-attribution-method"
    type: "method_factor"
    reference: "PCR normative method defined in sections 7 and 8: exclusive event/provider/asset attribution."
    used_for: "Author-defined attribution and coverage method; real lifetime/capacity/use evidence remains necessary."
  - id: "compatible-pool-ledger-method"
    type: "method_factor"
    reference: "PCR normative method defined in sections 6 and 8: compatible current-state/constituent closure."
    used_for: "Author-defined physical QA and independent deposit/water accounting; residuals remain findings."
  - id: "carbon-oxidation-identity"
    type: "method_factor"
    reference: "Normative carbon accounting identity defined in section 8: fossil-carbon CO2 mass upper constraint 44/12."
    used_for: "Molecular mass constraint only; no empirical fuel factor, complete oxidation or invented external publication."
