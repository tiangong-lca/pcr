product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.scaffolding-services"
  classification_refs: "CPC 3.0 54570 Scaffolding services; narrower"
  covered_products: "Complete stable-configuration supported modular galvanized-steel facade access scaffolding episodes"
  excluded_products: "Rental alone; suspended/mobile/mast-climbing systems; falsework/shoring; permanent access; user trade; unreviewed structural repair"
  representative_product: "An actual supported modular galvanized-steel facade scaffold kit over its declared accepted elevation and complete episode"
  production_route: "Kit issue/owned transport → erection/joining/tying → inspection/handover → actual availability/unavailability → dismantling → cleaning/assessment/return/repair/discard and owned restoration"
  market_state: "Accepted complete scaffolding cycle service with actual configuration, dates and custody/fate closure"
functional_unit:
  what: "Supported modular galvanized-steel facade scaffolding cycle service"
  how_much: "1 m2"
  how_well: "Unique accepted facade elevation under the declared height, loading class, platform/deck/tie design, substrate and inspection gate"
  how_long_or_cycle: "One actual stable-configuration episode: dated issue, inspected handover, all available/unavailable intervals, dismantling and assessed return/repair/discard/restoration closure"
  reference_flow_link: "reference_service"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR governs a stationary, rigid-supported modular galvanized-steel facade access scaffold as one actual configuration episode. The service starts with issue of the actual kit and ends only after erection, inspected handover, actual availability closure, dismantling, assessed return/repair/discard and owned site restoration are reconciled. Height, loading, deck and tie arrangements and dates characterize the service; area alone is insufficient. Exclude rental without erection/dismantling, suspended, mobile and mast-climbing scaffolds, falsework/shoring, permanent access structures and the trade executed by users from the platform. A materially changed configuration requires a new cohort and scope review. Ordinary manufacturer-compatible cleaning and evidenced minor upkeep are included when owned; structural welding or independently owned component-repair technology requires further review. PERI and OSHA evidence supports these responsibilities and distinctions, not universal input rates. The CPC 2.1 note is historical boundary context only."
      source_ids: []
    - rule_id: cycle_responsibility
      applies_to: "scaffold_cycle"
      rule: "Maintain one event-linked responsibility across kit issue and owned transport, erection/joining/tying and inspection, handover, all actual available/unavailable intervals, dismantling, cleaning/assessment, return/repair/discard decisions and owned site restoration. The erected state is an observed gate inside this node, not another product output."
      source_ids:
        - peri-instructions
        - cycle-normalization-method
    - rule_id: components_and_joining
      applies_to: "scaffold_cycle"
      rule: "Inventory standards, ledgers, decks, braces, access, guardrails, ties and base supports by actual kit IDs and condition. Observe system-compatible connections and actual support/attachment design. Distinguish reusable kit from consumed replacements, boards, anchors and enclosures; never infer component density or labour rate from area."
      source_ids:
        - peri-instructions
        - osha-scaffold
    - rule_id: existing_interface
      applies_to: "scaffold_cycle"
      rule: "Declare released substrate/building attachment interface and kit condition at issue. Existing building, substrate and stock are context and asset observations. New consumed attachments and owned restoration remain attributable actual burdens. A genuinely separate material-state or repair handoff requires explicit transfer and boundary review."
      source_ids:
        - peri-instructions
        - cycle-normalization-method
    - rule_id: maintenance_limit
      applies_to: "scaffold_cycle"
      rule: "Include actual manufacturer-compatible ordinary cleaning, lubrication and evidenced minor maintenance within contractual responsibility. Provider-covered repair stays covered once. Independently owned structural/component welding or a different repair technology requires scope review. User-trade production is outside this service, although its separately evidenced deposited matter is recorded for cleaning closure."
      source_ids:
        - peri-instructions
        - compatible-pool-ledger-method
    - rule_id: cohort_and_fates
      applies_to: "scaffold_cycle"
      rule: "Retain actual failed inspection, unavailable scaffold, altered geometry, damaged/quarantined components, wear, approved maintenance, return and discard states with dated events. Geometry changes open a separate cohort and review. Unknown component fates prevent complete-cycle acceptance; loss or theft does not prove waste."
      source_ids:
        - peri-instructions
        - compatible-pool-ledger-method
