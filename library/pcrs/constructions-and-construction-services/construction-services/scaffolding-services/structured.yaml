  calculation_rules:
    - id: accepted_area
      applies_to: "reference_service"
      rule: "A = sum of disjoint accepted facade-elevation polygon areas for the stable configuration. Remove unserved gaps and duplicate overlap; do not sum decks, lifts, repeated days or ground plan."
      inputs:
        - survey
        - configuration
        - gate
        - cp_scaffold_cycle_material
      output: "A"
      source_ids:
        - cycle-normalization-method
    - id: cycle_numerators
      applies_to: "all inventory rows"
      rule: "For each concrete identity/state/receiver j, N_j = attributed episode quantity in its declared numerator unit, after measured same-state conversion and exclusive attribution; E_j = N_j / A. Retain distinct j values; heterogeneous totals only test ledger completeness."
      inputs:
        - N_j
        - A
        - cp_scaffold_cycle_material
        - cp_scaffold_cycle_utility
        - cp_scaffold_cycle_asset
        - cp_scaffold_cycle_release
      output: "E_j"
      source_ids:
        - cycle-normalization-method
        - asset-attribution-method
    - id: final_area_output
      applies_to: "reference_service"
      rule: "Final output = A / A = 1 m2 for the complete accepted cycle, with actual duration and configuration qualifiers retained. No other observation self-normalizes into a final product."
      inputs:
        - A
        - "closed gate"
        - cp_scaffold_cycle_material
      output: "1 m2"
      source_ids:
        - cycle-normalization-method
    - id: exclusive_attribution
      applies_to: "all inventory rows"
      rule: "Attribute independently metered events first. Partition only the residual shared provider/meter burden among all evidenced consumers by actual causal use/capacity; preserve exhaustive exclusive shares and uncertainty. Provider-included and separately recorded quantities must be reconciled before calculating E_j."
      inputs:
        - "consumer/phase register"
        - "provider coverage"
        - cp_scaffold_cycle_asset
        - cp_scaffold_cycle_utility
      output: "attributed N_j"
      source_ids:
        - asset-attribution-method
    - id: compatible_closure
      applies_to: "all inventory rows"
      rule: "For each compatible material/state/constituent pool, opening stock + observed external additions = closing stock + independently measured retained, returned, discarded and released constituents + residual. Evaluate uncertainty in residual; do not generate a balancing exchange. Keep used kit state and external deposits distinct."
      inputs:
        - "state/constituent ledgers"
        - cp_scaffold_cycle_material
        - cp_scaffold_cycle_release
      output: "closure findings"
      source_ids:
        - compatible-pool-ledger-method
    - id: water_only_closure
      applies_to: "water_supplied; direct_freshwater_abstraction; collected_wastewater_slurry; water_vapour_air; atomic_specific_direct_water_releases"
      rule: "Reconcile independently observed water-only inputs and opening water against water-only closing/retained/returned content, collected liquid waste, supported evaporation and direct releases. Internal recirculation cancels; solids and chemicals are separate constituents. Residual does not establish evaporation."
      inputs:
        - "water-only measurements"
        - cp_scaffold_cycle_utility
        - cp_scaffold_cycle_release
        - cp_scaffold_cycle_material
      output: "water closure findings"
      source_ids:
        - compatible-pool-ledger-method
    - id: fossil_carbon_constraint
      applies_to: "fossil_co2_air"
      rule: "For independently measured fossil carbon burned C_f, fossil CO2 <= C_f * 44 / 12. Record actual CO2 by applicable measurement/model; account separately for carbon in other species and residual uncertainty. This upper constraint does not assume complete oxidation and is not kg CO2 per kg diesel."
      inputs:
        - C_f
        - "actual emission evidence"
        - cp_scaffold_cycle_utility
        - cp_scaffold_cycle_release
      output: "fossil-carbon QA"
      source_ids:
        - carbon-oxidation-identity
    - id: diesel_supply_and_fates
      applies_to: "diesel_fuel; fossil_co2_air"
      rule: "For each actual fuel identity and same attributed event/period use net-of-tare external receipts R, carried opening O, intact reusable closing C and evidenced actual usable outward return U, all in kg. This PCR uses the consumed-only fuel-supply representation: fuel_supply_kg = O + R - C - U. Include all nonreturned unburned waste/loss in that upstream product input; retain opening/closing source-cohort burden once, and do not add a return credit or another return exchange for U. diesel_fuel amount = fuel_supply_kg / A once. Actual burned_kg is an independent measured combustion activity, or is derived only from a complete mutually exclusive audit: burned_kg = fuel_supply_kg - nonburned_waste_kg - nonburned_release_kg - nonburned_retained_kg. Unburned material already assigned to C or U is not subtracted again; retained incident material outside those pools is independently evidenced. Unknown loss is a gap, not inferred burn or zero. Record actual final waste identities/receivers and species/media releases separately under the original refinement duties; an uncontained whole-fuel audit is not a generic elementary exchange and waste carrier/contained fuel are nonadditive. Keep separately evidenced fossil burned carbon for the CO2 method, with actual fuel composition; no default oxidation fraction. Reconcile provider coverage separately for fuel supply, combustion and each waste/release fate. Exclude only the evidenced same-boundary overlap for that component and add uncovered components once; partial provider coverage never authorizes either an omitted component or recharging an already included one. All setup, idle, tests and rework remain included. Physical closure uses raw O + R against C + U + independently measured burned_kg + nonburned_waste_kg + nonburned_release_kg + nonburned_retained_kg, all at the same cutoff/scope, with measured uncertainty. The net exchange fuel_supply_kg is not inserted again as raw R in that closure. When burn is independently measured, the same equality is a QA check, not a method to fill unknown outlets."
      inputs:
        - cp_scaffold_cycle_utility
        - O_kg
        - R_net_kg
        - C_intact_carried_kg
        - U_usable_outward_kg
        - burned_kg
        - nonburned_waste_kg
        - nonburned_release_kg
        - nonburned_retained_kg
        - A
      output: "Supply kg per reference and separate burned-kg audit"
      source_ids: []
    - id: atomic_child_normalization
      applies_to: "replacement_kit_products_standard; replacement_kit_products_ledger; replacement_kit_products_deck; replacement_kit_products_brace; replacement_kit_products_access; replacement_kit_products_guardrail; replacement_kit_products_tie; replacement_kit_products_base; consumed_sole_boards_board; consumed_anchors_ties_anchor; consumed_anchors_ties_tie; consumed_anchors_ties_attachment; protective_sheet_net_products_sheet; protective_sheet_net_products_net; cleaning_maintenance_products_cleaner; cleaning_maintenance_products_lubricant; cleaning_maintenance_products_abrasive; cleaning_maintenance_products_cloth; hired_equipment_services_lifting; hired_equipment_services_access; hired_equipment_services_logistics; usable_material_exits_consumed_sole_boards_board; usable_material_exits_consumed_anchors_ties_anchor; usable_material_exits_consumed_anchors_ties_tie; usable_material_exits_consumed_anchors_ties_attachment; usable_material_exits_protective_sheet_net_products_sheet; usable_material_exits_protective_sheet_net_products_net; usable_material_exits_cleaning_maintenance_products_cleaner; usable_material_exits_cleaning_maintenance_products_lubricant; usable_material_exits_cleaning_maintenance_products_abrasive; usable_material_exits_cleaning_maintenance_products_cloth; discarded_kit_waste_replacement_kit_products_standard; discarded_kit_waste_replacement_kit_products_ledger; discarded_kit_waste_replacement_kit_products_deck; discarded_kit_waste_replacement_kit_products_brace; discarded_kit_waste_replacement_kit_products_access; discarded_kit_waste_replacement_kit_products_guardrail; discarded_kit_waste_replacement_kit_products_tie; discarded_kit_waste_replacement_kit_products_base; support_sheet_residue_waste_board; support_sheet_residue_waste_anchor; support_sheet_residue_waste_tie; support_sheet_residue_waste_sheet; support_sheet_residue_waste_net"
      rule: "Record independent_physical_quantity separately by atomic_flow_row_id; actual_<row_id>_quantity is its named alias only, never a copied family amount. Materials retain original CP per-identity/state gross/net stock and outward-return conventions; transfers use actual paired custody quantity; usable exits and wastes use independent actual fate quantities. Number-of-items owned asset equivalents use this PCR original job_driver/full_life_driver complete-life fraction including manufacture, maintenance, replacement and end of life, with every consumer and a positive complete denominator. Duration/h service children instead use actual attributable job hours with the matching complete-life burden per hour; never multiply hours by the fraction again. Purchased services use only actual complete physical tasks whose real contract defines Item(s), with original actual attribution; hours, days and prices cannot become event counts. atomic_child_intensity = independent_physical_quantity / A, where A is positive unique surveyed accepted facade-elevation area in m2 of one stable configuration and fully closed scaffold episode under the original acceptance rule; A=0 blocks normalization. Non-exchange parent role ledgers and original CP operands retain their stock, transfer, closure and ownership functions, without adding a second exchange or changing the method."
      inputs:
        - atomic_flow_row_id
        - independent_physical_quantity
        - exchange_property
        - exchange_unit
        - A
        - cp_scaffold_cycle_material
        - cp_scaffold_cycle_asset
        - cp_scaffold_cycle_release
      output: "atomic_child_intensity"
      source_ids: []
