validation_rules:
  - rule_id: accepted_gate
    applies_to: "reference_service"
    rule: "Require positive independently measured A, inspected handover, dated availability closure, dismantling and reconciled component return/repair/discard plus owned restoration. Count each accepted elevation once; verify all required qualifiers and separate changed geometry."
    source_ids:
      - cycle-normalization-method
  - rule_id: identity_and_activation
    applies_to: "all inventory rows"
    rule: "Resolve each instantiated concrete identity, state, property, unit and receiver before final exchange delivery. Report actual occurrence as yes/no/unresolved with evidence; no evidence is not zero. A verified UUID does not prove quantity or activation. Use unspecified-air fixed identities only for that compartment."
    source_ids:
      - compatible-pool-ledger-method
  - rule_id: phase_and_asset_coverage
    applies_to: "scaffold_cycle"
    rule: "Check phase event continuity, kit/component identities and every shared consumer/period. Verify one owner and no duplicate kit, manufacture, maintenance, fuel or meter burden. Check failed/reworked states against their actual fate and prohibit unaccepted service in the denominator."
    source_ids:
      - asset-attribution-method
      - cycle-normalization-method
  - rule_id: physical_qa
    applies_to: "all inventory rows"
    rule: "Reconcile compatible material/current-state/constituent pools with opening and closing stocks and separately observed additions. Test water-only and fuel-carbon constraints separately. Never balance fuel kg against CO2 kg or invent oxygen, waste, dust, vapour or other exchanges from residuals."
    source_ids:
      - compatible-pool-ledger-method
      - carbon-oxidation-identity
  - rule_id: range_and_gaps
    applies_to: "all inventory rows"
    rule: "Retain the two supported unchanged reference_service/fossil_co2_air ranges and every current card independent evidence needs; the former count of 25 rows is no longer a current inventory claim. Assess physical constraints using measured inputs and exclusive fates; disclose range/state/support/asset-attribution gaps and block unsupported final quantities without invented bounds."
    source_ids:
      - cycle-normalization-method
      - compatible-pool-ledger-method
  - rule_id: report_completeness
    applies_to: "foreground dataset"
    rule: "Report accepted input, performed and skipped checks, findings, uncertainty and completeness. An automated structural pass does not certify engineering compliance, final UUID readiness or closure of an incomplete cycle."
    source_ids:
      - cycle-normalization-method
  - rule_id: close_atomic_replacement_kit_products
    applies_to: "scaffold_cycle; cp_scaffold_cycle_material"
