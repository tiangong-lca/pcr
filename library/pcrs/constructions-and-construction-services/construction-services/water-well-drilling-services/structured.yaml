      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Instantiate each independently supplied compatible coupling, sanitary cap, seal and other approved completion component by its true material and supply identity. Joining/grouting/wellhead labour is this node responsibility; do not add a second generic installation service over the same owned work. Range evidence need: Actual bill of supply, compatible design and model-specific masses are needed; heterogeneous components cannot be summed as one exchange. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual approved completion parts need exact identity/native unit, factory/inseparable coupling not double. Owned joining/grouting/wellhead labour not another generic installation service."
      evidence: "cp_completion_materials; actual independent records and identity/unit evidence"
    - id: refine_completion_returns
      applies_to: "completion_returns_steel_casing; completion_returns_thermoplastic_casing; completion_returns_dry_premix; completion_returns_prepared_grout; completion_returns_cement; completion_returns_bentonite"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Only real outward return of usable identified casing/components/grout product qualifies. Match shipment and receiving custody; retained closing stock stays a balance carried to later jobs, not an output exchange. Range evidence need: Actual outward custody, quantity and supplier credit/receiving evidence are required; no default return percentage. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual component/other product and onsite-prepared recovered-grout output states require own exact identity/acceptance/native unit/burden records; actual shipment/receiving custody and closing carried stock distinct."
      evidence: "cp_completion_balance; actual independent records and identity/unit evidence"
    - id: refine_completion_waste
      applies_to: "completion_waste_steel_casing; completion_waste_thermoplastic_casing; completion_waste_hardened_grout; completion_waste_liquid_grout; completion_waste_cleanup_wastewater"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Instantiate separate actual scrap, rejected components and hardened/liquid grout residues by composition and receiver. Defective seal/wellhead work returns to well_completion, with extra materials and waste retained; unlawful or unresolved disposal blocks finalization. Range evidence need: Actual component rejects, batch residue, weights and destination evidence are needed; no universal installation loss or scrap credit. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual rejected components/other physical mixtures/hazard/receiver states need exact independent dispatch records; defective seal/wellhead work returns for correction with added resources, unlawful/unresolved disposal blocks completion."
      evidence: "cp_completion_balance; actual independent records and identity/unit evidence"
    - id: refine_completion_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional: instantiate actual characterized substance/species and receiving air/water/soil medium from grout placement, actual joining and cleanup. Contained grout residue/cleanup wastewater is managed waste under completion_waste_steel_casing; completion_waste_thermoplastic_casing; completion_waste_hardened_grout; completion_waste_liquid_grout; completion_waste_cleanup_wastewater; lawful environmental discharge is elementary. Neither chemical reaction nor emissions are invented from grout presence. Range evidence need: Actual joining/grout/cleanup materials, release existence, concentration/flow or valid factor, medium and uncertainty are required; no universal grout emission or zero-release assumption. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_completion_releases; actual independent records and identity/unit evidence"
    - id: refine_sampling_consumables
      applies_to: "sampling_consumables_container; sampling_consumables_preservative"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Instantiate each real sample container, preservative or single-use test consumable not covered by the external laboratory service. Record sample event and accepted method, transport packing and receiver; do not assume laboratory packaging is also purchased by driller. Range evidence need: Actual sampling plan, sample counts, composition/mass and provider scope are required; no fixed bottles or tests per well. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual single-use test materials and transport packaging/SKUs/native units require independent accepted-method/event/receiver records; no assumed duplicate laboratory packing."
      evidence: "cp_test_materials; actual independent records and identity/unit evidence"
    - id: refine_development_managed_liquid
      applies_to: "development_managed_liquid_development_test; development_managed_liquid_disinfection_flush"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Instantiate actual removed water/slurry/disinfection flush waste by quality and receiver. Determine lawful custody after actual tests; do not label contaminated/chlorinated water a saleable product or treat all withdrawal as discharge. Range evidence need: Actual water-quality/chlorine/solids characterization, masses and disposal receipts are needed; no universal dechlorination or waste fraction. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual combined physical batches or other quality/receiver/hazard differences require exact whole-mixture identity and independent quantity once, no allocation of a total. Contaminated/chlorinated water not saleable by default; withdrawal not automatic discharge."
      evidence: "cp_dev_disposition; actual independent records and identity/unit evidence"
    - id: refine_development_waste
      applies_to: "development_waste_sediment; development_waste_sampling_container"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record captured development fines separately from liquid already accounted for and split real single-use test waste by material/contamination status and receiver. Retest waste remains attributable to the accepted job. Range evidence need: Actual captured sediment, consumable weights/contamination and destination are needed; no default sediment or test-waste rate. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other single-use test articles/material/contamination/receiver streams need exact separate records; same collected liquid/constituent not double, retest waste still accepted-job attributable."
      evidence: "cp_dev_disposition; actual independent records and identity/unit evidence"
    - id: refine_development_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Instantiate actual substance/species and receiving medium from lawful release records, including identified residual disinfectant where released and actual water returned to environment. Water resource balance and pollutant mass are different quantities; do not equate solution mass to chlorine mass. Range evidence need: Actual release permit/method, medium, concentration/time and uncertainty are needed; neither flush completion nor lack of measurement proves zero release. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_dev_disposition; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator retains original configuration strata, accepted state/gate and actual causal attribution; no unlike jobs/branches/routes treated as equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: grout_supply_mode_exclusive
      applies_to: "sealing_grout_dry_premix; sealing_grout_prepared; sealing_grout_cement; sealing_grout_bentonite; grout_water"
      requirement: "For each batch choose exactly one supply-mode group: dry_premix, prepared_grout, or separate_ingredients. Cement and bentonite are separate actual product inputs only in separate_ingredients mode and can both apply when evidenced by the actual approved recipe; no assumed formulation or apportioned parent mass. A dry premix includes its ingredients once; a prepared product includes its ingredients and water once. Embedded onsite mixing is well_completion work and its measured grout yield is reconciliation only. A prepared input is permitted only for real supply or genuinely independent preparation handoff with actual upstream coverage. grout_water records only separately supplied added/cleanup water, never water already included in a prepared product. Missing mode, recipe/receipt/handoff or actual other ingredient identity/quantity blocks completion."
      evidence: "cp_grout; actual batch/recipe/supply/handoff evidence"
validation_rules:
  - rule_id: scope_fit
    applies_to: "accepted_civil_well"
    rule: "Fail dataset route-fit for excluded geology/flowing/technology/system scope; do not drop necessary work to fit boundary."
    source_ids: []
  - rule_id: gate_count
    applies_to: "accepted_civil_well"
    rule: "Only one completed actual civil well per reference; reconcile accepted_count with signed gate and exact stage criteria, actual test/sample results and later duty owners. A rejected/unfinished hole cannot be a reference output."
    source_ids:
      - massdep-private-well-guidelines
  - rule_id: water_source_balance
    applies_to: "all water and residual rows"
    rule: "Verify purchased/injected water versus groundwater withdrawal, recirculation/stock and cuttings-water/managed-liquid/releases; no double-counted mixtures, groundwater sale or invented aquifer production."
    source_ids: []
  - rule_id: identity_units
    applies_to: "all inventory rows"
    rule: "Unresolved actual identities and Energy/Duration/Transport support prevent final concrete exchanges. Verify actual property/group/unit chain and explicit physical conversion; no near-match drilling/monitoring/pumped-water UUID or Count conversion for h/kWh/tkm."
    source_ids: []
  - rule_id: asset_periods
    applies_to: "support_assets_rig; support_assets_compressor; support_assets_temporary_pump"
    rule: "Require all consuming nodes and other jobs/periods, phase coverage, life-service attribution and replacement/termination evidence; verify shares count production/use/removal once and missing coverage is declared."
    source_ids: []
  - rule_id: reject_closure
    applies_to: "all processes"
    rule: "Match each failed bore/defective completion/inadequate development/yield/sample to responsible loop or lawful closure and residual receiver; retain all attributable burden and exclude unresolved rejects from accepted count."
    source_ids: []
  - rule_id: custody
    applies_to: "all material rows"
    rule: "Match actual gross receipt/issue/outward return/waste/stock balance and provider boundaries; retained stock is not outward product and no return is netted then counted again."
    source_ids: []
  - rule_id: range_quality
    applies_to: "all inventory rows"
    rule: "Satisfy each card’s stated actual Range-evidence requirement and retain actual specification/measurement uncertainty; no source example becomes universal dose/geometry/yield/duration/life/emission default."
    source_ids: []
