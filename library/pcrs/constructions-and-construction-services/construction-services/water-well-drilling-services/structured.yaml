allocation_rules:
  - rule_id: single_service
    applies_to: "all processes"
    rule: "One accepted pump-free civil well is the intended service. No sold groundwater/cuttings co-product or avoided-product credit is assumed. Actual recovered product exit, if any, requires demonstrated product status/destination and disclosed attribution, while waste treatment remains accountable."
    source_ids: []
  - rule_id: failed_attempts
    applies_to: "all processes"
    rule: "Link each bore attempt/remedy/test/sample event to job and producing node; allocate job-attributable failures, lawful closure, repairs and retests to the accepted job. Independently contracted unrelated exploratory work needs an explicit different owner/gate; no hidden failure burden or extra accepted well."
    source_ids: []
  - rule_id: asset_share
    applies_to: "support_assets_rig; support_assets_compressor; support_assets_temporary_pump"
    rule: "For each actual asset use complete-life production/commissioning/maintenance/replacement/removal burdens and actual service-use share for this job. Record life-service denominator across other jobs/reporting periods and attributable use/idle allocation with evidence. Provider-covered phases and owned use inputs count once; missing denominator/termination evidence is a gap, never zero."
    source_ids: []
  - rule_id: period_link
    applies_to: "bore_removal"
    rule: "Index every asset phase/event/input by asset/job/date/reporting period, including cross-period replacements and retirement. Reconcile allocated shares over the same complete life; no repeated annual/full asset charge and no future permanent-pump operation attributed to construction."
    source_ids: []
  - rule_id: material_custody
    applies_to: "all material rows"
    rule: "Use gross attributed receipts/opening stock and issues with placed/used quantities, real outward usable returns, waste/releases and closing stock by actual identity. With gross upstream accounting, outward returns are not first netted and counted again. Retained stock is carried-forward burden with explicit transfer basis, never outward product."
    source_ids: []
  - rule_id: service_overlap
    applies_to: "support_services_drilling; support_services_completion"
    rule: "Lead bore_removal ownership records the purchase once and uses actual node_id/event task shares for bore_removal, well_completion and develop_accept. Read actual provider scope for fuel, water, materials, assets, transport and disposal; either provider bounded inventory covers a role or its actual foreground inputs do. Supplement missing production/removal without duplicating covered phases. No generic service and its full owned inventory together."
    source_ids: []
