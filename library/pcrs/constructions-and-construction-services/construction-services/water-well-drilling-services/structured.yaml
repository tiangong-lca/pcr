  calculation_rules:
    - id: job_normalization
      applies_to: "all inventory rows"
      rule: "Collect all job-attributable events, failures and provider/asset shares, then divide each homogeneous exchange quantity by actual accepted civil well count for the same declared route/gate. No completed well means no normalized accepted service dataset."
      inputs:
        - "actual event/quantity records"
        - accepted_count
        - job_id
      output: "quantity per reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "all material and water rows"
      rule: "Reconcile actual gross opening plus receipt quantities with placement/use, documented outward return, waste/release and retained closing stocks by identity; document conversion/measurement uncertainty and every physical destination. This balance does not invent a product output for stock or credit for waste."
      inputs:
        - "actual gross/custody/meter/stock records"
      output: "reconciled actual exchange quantities and data gaps"
      source_ids: []
  data_quality_requirements:
    - id: route_gate
      applies_to: "accepted_civil_well"
      requirement: "Site/geology/non-flowing/air-rotary route and pump-free gate must match actual permit/design; construction yield/sample acceptance is stage-specific, not water-service approval."
      evidence: "cp_accept; approved actual records"
    - id: identities
      applies_to: "all inventory rows"
      requirement: "Each conditional umbrella expands to actual concrete exchanges; verify identity, property and unit independently before final TIDAS process publication. Preserve unresolved Energy/Duration/Transport support until verified."
      evidence: "actual supplier/receiver/substance records and verified platform chain"
    - id: balances
      applies_to: "all material and water rows"
      requirement: "Reconcile gross receipts/opening stock, placement/use, actual outward returns, waste/releases and closing stock by identity. Water source and wet-solids bases must close with quantified uncertainty; no net-plus-return duplication."
      evidence: "weigh/meter/custody balances"
    - id: period_assets
      applies_to: "support_assets_rig; support_assets_compressor; support_assets_temporary_pump"
      requirement: "Cover complete asset production/use/maintenance/replacement/removal, other jobs and reporting periods with traceable denominator and provider phase boundary; unresolved retirement/replacement blocks finalization."
      evidence: "cp_assets life register and provider scope"
    - id: uncertainty
      applies_to: "all rows"
      requirement: "Report actual dates, calibration and detection limits, coverage, sampling representativeness and calculated-factor applicability. Missing/estimated quantity or release remains explicit, never a zero placeholder."
      evidence: "protocol records and uncertainty ledger"
