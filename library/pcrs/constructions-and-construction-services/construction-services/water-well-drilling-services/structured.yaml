product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.water-well-drilling-services"
  classification_refs: "cpc:3.0:54341"
  covered_products: "Qualified pump-free first air-rotary bedrock civil well construction/development service at actual site and acceptance gate."
  excluded_products: "Unconsolidated screened/flowing/geothermal/exploration/oil/gas wells; hydrofracturing; rehabilitation; permanently pumped water system and operating water abstraction."
  representative_product: "One actual non-flowing private bedrock well with accepted casing/seal/wellhead, development and construction-stage tests/records."
  production_route: "Actual site/design → air-rotary formation removal and captured residuals → independent casing/seal/wellhead integration → development/temporary tests/initial disinfection/flush/sampling → signed pump-free civil gate; actual failures loop or close lawfully."
  market_state: "First-construction civil service, site-bound and accepted; no sold groundwater or guaranteed drinking-water approval."
functional_unit:
  what: "Construction and development of one qualified non-flowing consolidated-bedrock private water well by air rotary, at pump-free civil handover."
  how_much: "1 Item(s) accepted actual civil well; actual depth and diameter remain qualifiers, not equivalent well counts."
  how_well: "Actual authorized design/site and construction-stage yield/development/disinfection/flush/sample acceptance, with sealed overburden casing and protected wellhead; civil acceptance is not drinking-water-service approval."
  how_long_or_cycle: "One first-construction job from mobilization through final civil gate and attributable failed-hole closure/repair/retest. Link asset production/commissioning, job use/maintenance/replacement and retirement across actual reporting periods and other jobs; exclude later operating-water life."
  reference_flow_link: "accepted_civil_well"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers first construction of a non-flowing consolidated-bedrock private water well using air-rotary drilling, with overburden casing/sealing and wellhead completion, actual development, temporary yield testing and construction-stage disinfection/flush/sampling. The deliverable is the accepted pump-free civil well. Actual jurisdiction, qualified driller and authorized site-specific design/test instructions govern construction acceptance. Exclude unconsolidated screened wells, flowing artesian wells, exploration/geothermal/oil/gas wells, intentional hydrofracturing, later rehabilitation, permanent pumps/distribution/treatment and routine water supply. FRTR is used only for air-rotary mechanism and associated material/residual questions, not as a drinking-water-well design specification. Actual incidental formation effects remain disclosed."
      source_ids: []
    - rule_id: well_route
      applies_to: "all processes"
      rule: "Reject flowing artesian, unconsolidated screened, geothermal/exploration/oil/gas, intentional hydrofracturing, later rehabilitation and routine water abstraction. Project outside this route requires another methodology."
      source_ids: []
    - rule_id: start_interface
      applies_to: "bore_removal"
      rule: "Declare actual access/site/hydrogeology/jurisdiction/utility clearance and authorized well design/driller. Include new job-specific enabling works or an explicit measured upstream bounded service with responsible provider; no unowned new work. In-situ formation/aquifer is environmental starting stock without invented upstream production."
      source_ids: []
    - rule_id: removal_handoff
      applies_to: "bore_removal"
      rule: "The removal source is the actual overburden and consolidated formation. Responsibility ends at documented drilled bore/formation state and captured cuttings/water handoff; residual handling remains accountable. It is independent of completion because geological removal/source capture has its own logs and custody, while the next node integrates supplied casing/seal/wellhead components."
      source_ids:
        - frtr-air-rotary
    - rule_id: completion_gate
      applies_to: "well_completion"
      rule: "Independent casing/sealing/wellhead integration receives casing/couplings, compatible grout and cap/seals; joining/placement produces the actual approved sanitary civil completion for development. Document placement/cure evidence required by actual design, not universal guidance dosages. Embedded grout mixing is included without inventing an extra product handoff."
      source_ids:
        - massdep-private-well-guidelines
    - rule_id: test_handover
      applies_to: "develop_accept"
      rule: "The independent develop_accept responsibility receives the completed but undeveloped and initially undisinfected civil well from well_completion. It removes fines/develops and initially disinfects this pre-treatment state, with actual temporary tests/flush/sampling, to hand over the qualified accepted pump-free civil well; captured sediment, managed liquid and real characterized releases remain distinct residual destinations. Develop and flush actual drilling fines before temporary pumping/yield test. Retain actual water-level, flow/time, acceptance and initial driller disinfection/flush/sample records and all repeat work. Name later permanent-pump installer/system disinfection and water-service approval owner; no permanent pump, distribution or treatment plant is delivered by this reference."
      source_ids:
        - massdep-private-well-guidelines
    - rule_id: shared_cycle
      applies_to: "bore_removal"
      rule: "The lead bore_removal operator owns shared whole-job purchases, providers, logistics and asset register once, including support consumed in well_completion and develop_accept. Allocate by actual node_id/event causal task use; there is no independent support-process output. Link rig/compressor/drill/test pump/tools to all three consuming responsibilities, other jobs and reporting periods. Account asset production, commissioning/mobilization, use/idle, maintenance/replacement and removal/retirement using bounded verified provider coverage or complete-life attribution. Excluded provider phases must be supplemented."
      source_ids: []
    - rule_id: reject_paths
      applies_to: "all processes"
      rule: "Failed/contaminated/inadequate bore routes to actual remedy or lawful closure at bore_removal/well_completion; defective seals/components loop to well_completion; inadequate development/yield or disinfection/sample loops to develop_accept and responsible upstream node. Retain all job-attributable burdens and waste, exclude unresolved rejects from accepted count, close disposition before gate."
      source_ids: []
    - rule_id: real_exchanges
      applies_to: "all processes"
      rule: "Expand conditional umbrellas into each actual material/provider/waste/substance exchange with compatible physical units and verified identity. Do not sum unlike streams or create duplicate receipts/document mirror nodes. Use actual outside custody and environment destinations to determine product/waste/elementary type."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual authorized non-flowing bedrock site, native formation/aquifer and declared access/enabling-work interfaces before first well construction."
  starting_condition_role: "Environmental formation/resource stock and explicit approved site/design interfaces; not a prebuilt well or invented zero-burden new enabling works."
  product_classification_scope: "Pump-free air-rotary civil well service narrower than CPC water-well drilling including possible pump/piping work."
  recursive_input_rule: "A same-category externally supplied well-construction scope is a bounded upstream service with actual gate/owner/quantity and coverage; do not recreate its covered foreground inventory or assume recursion ends at an unverified service label."
  upstream_dataset_requirement: "Actual supply-state casing/grout/components, energy/fuel and bounded service/asset datasets with provider coverage and missing phases stated."
  disclosure: "Actual geometry/geology/design/jurisdiction, interfaces, source-water/cuttings custody, tests/gate, failures, providers and asset periods/phases/attribution; later pump/system/water-service duties."
