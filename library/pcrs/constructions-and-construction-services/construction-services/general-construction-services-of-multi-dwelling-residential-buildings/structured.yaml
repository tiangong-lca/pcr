      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `a_reference` | all inventory rows | Aggregate actual attributable resources from all successful and failed attempts and preparation into the job numerator; divide by N unique finally accepted building retrofit IDs exactly once. Retests, dwellings, panels and shared phase events never increase N. Missing final acceptance does not erase incurred burdens. |  |\n| `a_stock` | all inventory rows | For each SKU/native unit use S = attributed opening stock + external net-tare gross receipts - carried closing stock. Choose declared gross-with-outlets OR consumed-only subtracting actual matched usable outward returns once. Internal issue/installation is not supply; closing is not outward return. Nonreturned waste/loss retains upstream burden. Historic removals cannot be negative purchases. |  |\n| `a_assets` | asset_equivalent_crane; asset_equivalent_scaffold; asset_equivalent_access_platform; asset_equivalent_tool; asset_equivalent_test_kit; asset_equivalent_temporary_unit; atom_req_support_asset_equivalent actual-child group; atom_req_support_asset_native_service actual-child group | One asset ledger spans all consumers/jobs/nodes/periods, manufacture, maintenance, replacement and end-of-life. Compatible actual job_driver/full_life_driver gives asset-equivalent Item(s), then /N; alternatively actual job_driver/N native service units multiply a lifecycle-complete burden per identical driver unit. Never combine views, divide by life again in service view or normalize twice. Observed life or observed history plus evidenced remainder/replacement/termination/end-of-life needs sources, uncertainty, sensitivity and update triggers. |  |\n| `a_rejects` | integrate | Tie failed installations and retests to the producing attempt and integrate-to-integrate rework loop. Use actual repaired-in-place, usable outward return, recovery, downgrade or waste destination. Rework adds its real resources but no duplicate purchase or accepted output; unclosed defects cannot enter N. |  |\n| `a_outlets` | all outputs | Record usable historic recovery, new outward returns and actual test electricity export with recipient and declared treatment, distinct from intended accepted service; no automatic avoided production, fuel, energy, disposal or future saving credit. Recycled-content inputs require actual SKU coverage, never inferred from recovered outlets. |  |\n| atom_grouped_ledgers | all actual-child records | Apply each existing formula only to its applicable role: material stock, asset lifecycle fraction/hourly provision, completed service event, internal transfer and species/fate calculations are distinct. Never apply material-stock or full-machine purchase equations to an asset share or service event. Within the applicable method group, use concrete child identity/material, state, one exchange property/unit, receiving medium and ownership/event scope. Native and converted views are nonadditive. A family diagnostic total is never a flow identity or every child numerator; keep incomplete portions explicit. Complete formulations, assemblies and genuinely bounded single-function services remain whole, with included constituents/resources not purchased again. |  |\n\n"
