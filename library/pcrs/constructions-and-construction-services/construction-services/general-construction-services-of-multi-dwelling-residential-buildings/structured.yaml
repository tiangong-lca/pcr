system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This category is the jointly accepted integrated energy-retrofit intervention on a named retained multi-dwelling apartment building with at least three dwellings. It combines factory-prefabricated insulated facade/window and roof systems with heat-pump heating/hot-water, heat-recovery ventilation and rooftop PV; the result is a completed service on an existing building, not a newly manufactured building or a promise of future savings. Record actual occupancy/vacating, retained/replaced services and competent project-specific design. Do not apply this category to new/rebuilt buildings, enlarged floor space/additional storeys/dwellings, isolated facade/roof/HVAC/PV supply or maintenance, uninstalled modules or later energy operation. Survey, selective removal, interfaces, complete upstream packages, actual provider resources, commissioning/retests and defect closure are part of the intervention. Historical Annex50/Hameln evidence establishes the route, not a universal target or annual operating outcome."
      source_ids: []
    - rule_id: b_start
      applies_to: "prepare"
      rule: "Start at the named existing qualified apartment building with at least three dwellings, actual structure/occupancy/services survey and approved retrofit design. Retained baseline manufacture and later operation are outside this intervention; actual disturbance, removal and incremental works are inside."
      source_ids:
        - iea-annex50-design-guide-2011
        - iea-annex50-factsheet-2014
        - energiesprong-hameln-completed-2021
    - rule_id: b_integrated
      applies_to: "integrate"
      rule: "The service owns installed envelope anchorage, air/weather/water/moisture and fire continuity with heat-pump heating/hot water, HRV distribution, rooftop PV, electrical protection and control compatibility. Factory packages and bounded providers retain complete upstream coverage; do not buy covered BOM or precharge twice."
      source_ids:
        - iea-annex50-design-guide-2011
        - iea-annex50-factsheet-2014
        - energiesprong-hameln-completed-2021
    - rule_id: b_periods
      applies_to: "all inventory rows"
      rule: "Index survey/design, selective removal, installation, commissioning/retests and final acceptance by actual event, phase and reporting period. Record opening/closing stock and asset maintenance/replacement/termination across all relevant periods; no future operating-energy, refrigerant or avoided-impact scenario enters the construction reference."
      source_ids: []
    - rule_id: b_support
      applies_to: "support"
      rule: "Crane/scaffold/access/tools/test kits and temporary heat/water/power shared by prepare, integrate and accept have one asset/provider/event owner and a complete all-consumer lifetime service boundary. Include all direct and provider-paid transport, tests, temporary supplies and spares once; disclose actual resource coverage, uncertainty and gaps."
      source_ids: []
    - rule_id: b_excluded
      applies_to: "accepted_retrofit"
      rule: "Exclude new buildings, reconstruction, extensions/additional dwellings/storeys, facade-only/roof-only/HVAC-only maintenance and uninstalled modules. No universal performance threshold, lifetime, panel size, apartment count or sensor count is imported from historical demonstrations. Net-zero annual operation is not established by construction acceptance."
      source_ids:
        - iea-annex50-design-guide-2011
        - iea-annex50-factsheet-2014
        - energiesprong-hameln-completed-2021
