allocation_rules:
  - rule_id: a_reference
    applies_to: "all inventory rows"
    rule: "Aggregate actual attributable resources from all successful and failed attempts and preparation into the job numerator; divide by N unique finally accepted building retrofit IDs exactly once. Retests, dwellings, panels and shared phase events never increase N. Missing final acceptance does not erase incurred burdens."
    source_ids: []
  - rule_id: a_stock
    applies_to: "all inventory rows"
    rule: "For each SKU/native unit use S = attributed opening stock + external net-tare gross receipts - carried closing stock. Choose declared gross-with-outlets OR consumed-only subtracting actual matched usable outward returns once. Internal issue/installation is not supply; closing is not outward return. Nonreturned waste/loss retains upstream burden. Historic removals cannot be negative purchases."
    source_ids: []
  - rule_id: a_assets
    applies_to: "asset_equivalent_crane; asset_equivalent_scaffold; asset_equivalent_access_platform; asset_equivalent_tool; asset_equivalent_test_kit; asset_equivalent_temporary_unit; atom_req_support_asset_equivalent actual-child group; atom_req_support_asset_native_service actual-child group"
    rule: "One asset ledger spans all consumers/jobs/nodes/periods, manufacture, maintenance, replacement and end-of-life. Compatible actual job_driver/full_life_driver gives asset-equivalent Item(s), then /N; alternatively actual job_driver/N native service units multiply a lifecycle-complete burden per identical driver unit. Never combine views, divide by life again in service view or normalize twice. Observed life or observed history plus evidenced remainder/replacement/termination/end-of-life needs sources, uncertainty, sensitivity and update triggers."
    source_ids: []
  - rule_id: a_rejects
    applies_to: "integrate"
    rule: "Tie failed installations and retests to the producing attempt and integrate-to-integrate rework loop. Use actual repaired-in-place, usable outward return, recovery, downgrade or waste destination. Rework adds its real resources but no duplicate purchase or accepted output; unclosed defects cannot enter N."
    source_ids: []
  - rule_id: a_outlets
    applies_to: "all outputs"
    rule: "Record usable historic recovery, new outward returns and actual test electricity export with recipient and declared treatment, distinct from intended accepted service; no automatic avoided production, fuel, energy, disposal or future saving credit. Recycled-content inputs require actual SKU coverage, never inferred from recovered outlets."
    source_ids: []
  - rule_id: atom_grouped_ledgers
    applies_to: "all actual-child records"
    rule: "Apply each existing formula only to its applicable role: material stock, asset lifecycle fraction/hourly provision, completed service event, internal transfer and species/fate calculations are distinct. Never apply material-stock or full-machine purchase equations to an asset share or service event. Within the applicable method group, use concrete child identity/material, state, one exchange property/unit, receiving medium and ownership/event scope. Native and converted views are nonadditive. A family diagnostic total is never a flow identity or every child numerator; keep incomplete portions explicit. Complete formulations, assemblies and genuinely bounded single-function services remain whole, with included constituents/resources not purchased again."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_prepare
      process_id: "prepare"
      flow_role: "Starting condition, survey and historic removal"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; survey_id; occupancy_state; dwelling_count; floor_area; floor_area_unit; floor_area_convention; structural_capacity_evidence; thermal_bridge_record; moisture_record; fire_interface_record; air_path_record; retained_replaced_schedule; hazardous_clearance; retained_structure_release_id; integration_recipient; design_target_id; provider_deliverable; native_quantity; native_unit; material_state; hazard; recipient; waste_mass; species; receiving_medium; species_mass; activity; activity_unit; factor; factor_unit; factor_basis; factor_source; composition; composition_basis; composition_source; fate_fraction; fate_basis; fate_source; uncertainty; source_id"
      collection_method: "Survey and document qualified existing structure/services with competent approved design; measure actual physical provider deliverables and removed materials by native unit/weighing and trace actual reuse/treatment recipient; measure actual species releases or use valid matched factors with original operands. Aggregation detail: Aggregate attributable actual quantities per reference flow; each job quantity divided by N once; historic baseline is not new supply."
      unit: "actual native unit; kg"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed survey/design, calibrated records, recipient and hazardous-handling evidence, direct-release/factor applicability."
    - protocol_id: cp_packages
      process_id: "integrate"
      flow_role: "Package and separate installation stock, returns, rejects and releases"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; sku; specification; unit; native_quantity; activity; activity_unit; opening_attributed; external_gross_receipts; container_tare; carried_closing; internal_issue; installed_activity; usable_outward_return; return_receipt; ledger_view; package_scope; precharge_included; provider_scope; reject_id; rework_event; destination; waste_mass; density; density_unit; material_state; moisture; moisture_basis; temperature; temperature_unit; conversion_factor; conversion_unit; conversion_source; species; receiving_medium; species_mass; factor; factor_unit; factor_basis; factor_source; composition; composition_basis; composition_source; fate_fraction; fate_basis; fate_source; uncertainty; source_id"
      collection_method: "Use actual purchase/delivery net-tare, opening/closing stock, SKU specifications and installed as-built records; document package constituents and covered upstream scope before adding any loose input. Match each usable outward return to its input and each reject/rework exit to its attempt. Collect actual species/medium and conversion operands only where needed. Aggregation detail: Per reference flow use S/N for each SKU/native unit with one declared return convention; do not sum nonadditive views or normalize twice."
      unit: "Item(s); m2; m; m3; kg"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Supplier production gate/BOM scope, calibrated quantities, return receipts, rejection and fate evidence."
    - protocol_id: cp_refrigerant
      process_id: "integrate"
      flow_role: "Circuit-specific refrigerant stock and disjoint fates"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; circuit_id; equipment_id; refrigerant_specification; historic_charge; factory_precharge; cylinder_id; cylinder_tare; opening_attributed; external_receipts; carried_closing; usable_return; topup_measured; circuit_closing; recovered_usable_mass; contained_waste_mass; whole_fluid_release_mass; species; receiving_medium; measured_species_mass; activity; activity_unit; factor; factor_unit; factor_basis; factor_source; composition; composition_basis; composition_source; fate_fraction; fate_basis; fate_source; recipient; treatment_id; uncertainty; source_id"
      collection_method: "Weigh cylinders and actual transfers with tare; distinguish historic charge, factory-precharged equipment and separately supplied field top-up. Complete required old-equipment isolation/recovery and circuit-record handoff before the affected prepare removal; this integrate ledger keeps the true event phase/time with one owner, not a later physical recovery assumption. Link each circuit event to retained charge, usable recovery, contained waste and actual release; obtain actual species, medium and measured/factor/composition/fate evidence without default leakage. Aggregation detail: Per reference flow field stock S/N and each independent actual fate/N once; factory precharge is inside equipment, and whole-fluid audit is nonadditive to species."
      unit: "kg"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scales, charge sheets, recipient/treatment documents, mixture and factor basis plus uncertainty."
    - protocol_id: cp_provider
      process_id: "support"
      flow_role: "Provider scope and native completed result"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; provider_id; contract_scope; native_result; native_quantity; native_unit; verified_service_id; verified_property_id; verified_unit_group_id; included_materials; included_energy; included_transport; included_assets; included_tests; included_waste; uncovered_resources; overlap_owner; allocation_driver; allocation_source; uncertainty; source_id"
      collection_method: "Obtain primary provider records for actual completed physical results and complete lifecycle/upstream scope, reconcile every direct and provider-paid resource with one owner; missing coverage must be collected rather than inferred from cost or hours. Aggregation detail: Per reference flow attributable actual physical service quantity/N once, or uncovered individual resources in their own ledgers, without overlap."
      unit: "verified actual native service unit"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed scope matrix, physical completion, native unit support, uncovered-resource closure."
    - protocol_id: cp_freight
      process_id: "support"
      flow_role: "Actual transport legs and empty returns"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; leg_id; shipment_id; mode; vehicle_id; load_kg; load_mass_unit; distance_km; distance_unit; empty_return_activity; empty_activity_unit; shared_load_driver; driver_unit; provider_scope; included_legs; uncovered_activity; upstream_dataset_scope; uncertainty; source_id"
      collection_method: "Retain actual load and travel records, route and delivery/return/waste recipient; reconcile complete transport upstream and empty-return inclusion, using compatible physical allocation of shared loads. Aggregation detail: Per reference flow sum attributable load_kg*distance_km/N once; empty legs need explicit service coverage or separate vehicle activity and are not fictitious cargo work."
      unit: "kg*km"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weighbridge/load records, measured routes, provider scope, conversion and allocation evidence."
    - protocol_id: cp_assets
      process_id: "support"
      flow_role: "All-consumer temporary asset lifecycle and one native view"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; asset_id; provider_id; consumer_jobs; consumer_nodes; consumer_periods; service_start; service_end; attribution_view; job_driver; driver_unit; full_life_driver; full_life_driver_unit; observed_history; evidenced_remaining_use; manufacture_scope; maintenance_events; replacement_events; termination_event; end_of_life_scope; lifecycle_burden; burden_unit; burden_denominator_unit; verified_service_id; verified_property_id; verified_unit_group_id; evidence_source; uncertainty; sensitivity; update_trigger"
      collection_method: "Build complete all-consumer lifecycle ledgers from actual asset/provider records. Resolve observed completed life or observed history plus evidenced remainder, maintenance, replacements, termination and end-of-life; use a physically compatible driver and verify its native service support. Select exactly one quantity/burden view per asset. Aggregation detail: Per reference flow asset-equivalent=(job_driver/full_life_driver)/N with per-asset lifecycle burden OR native-service=job_driver/N with complete burden per same driver unit; do not combine or divide again."
      unit: "Item(s) or verified actual native driver unit"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "Complete asset lifetime across ALL consumers/jobs/nodes/periods: observed history plus evidenced remaining use, maintenance, replacement, termination and end-of-life"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Complete manufacture/maintenance/replacement/end-of-life coverage, denominator evidence, uncertainty/sensitivity and live update requirement."
    - protocol_id: cp_power
      process_id: "support"
      flow_role: "Gross temporary and integrated test electricity"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; meter_id; source_id; recipient_id; electricity_origin; baseline_retained_generation; interval_start; interval_end; import_start; import_end; export_start; export_end; meter_multiplier; electricity_unit; circulation; test_load; loss; test_id; failed_test_id; retest_id; attribution_driver; attribution_unit; included_provider_scope; uncertainty; verification_record"
      collection_method: "Use source-resolved import/export meters, not net billing. Log actual test run/failed/retest loads, retained PV/generator baseline and internal circulation/loss boundaries; separate production factors and provider coverage. Independently verify actual electrical-energy property/unit support. Aggregation detail: Per reference flow actual gross attributable imports/N and exports/N separately; no future savings or netting and no duplicate internal circulation."
      unit: "kWh"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
