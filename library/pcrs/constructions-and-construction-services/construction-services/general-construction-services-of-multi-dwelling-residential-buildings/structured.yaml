      requirement: "Mandatory actual-child refinement for support/inputs/product. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Hours are acceptable only when actual service identity/unit support and complete burden per hour are verified. An operating-fuel-only rental factor does not cover an asset lifecycle; obtain missing burdens or keep the dataset incomplete. Range evidence need: actual job driver and complete burden per identical native driver unit require provider lifetime scope/support; obtain all-consumer history/remainder and denominator evidence, without converting hours or price into Count. No transferable numeric interval is established by the available historical route evidence; retain actual observations and uncertainty through cp_assets. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Only with a verified lifecycle-complete provider burden per compatible driver unit, record job_driver/N in that same native unit; its burden denominator is the same driver unit and already includes full-life manufacture, maintenance, replacement and end-of-life. Do not divide by full_life_driver again or use atom_req_support_asset_equivalent too. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_support_asset_native_service is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_assets; independent actual-child roster and evidence"
    - id: atom_req_support_fuel_supply
      applies_to: "support"
      requirement: "Mandatory actual-child refinement for support/inputs/product. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Include actual generators, heaters, mobile plant and provider equipment outside covered service scopes. Supply retains nonreturned waste and uncontained loss; do not infer all apparent missing fuel was burned. Range evidence need: actual native fuel supply and fates depend on net-tare stock and equipment records; obtain measured burn or audited complete disjoint fates, density/state/temperature only where needed, without residual-inferred combustion. No transferable numeric interval is established by the available historical route evidence; retain actual observations and uncertainty through cp_fuel. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Record upstream fuel S/N by actual fuel/specification; retain native mass or volume supply from the actual SKU. Only an independently required conversion needs matched density/state/temperature and unit evidence. Keep purchased fuel distinct from measured burned activity. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_support_fuel_supply is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_fuel; independent actual-child roster and evidence"
    - id: atom_req_support_support_materials
      applies_to: "support"
      requirement: "Mandatory actual-child refinement for support/inputs/product. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Use distinct native ledgers and documented density, material state, moisture and temperature only if an independent mass view is needed; do not add the mass view to native supply. Range evidence need: actual temporary protection/spares/test-fluid native quantities depend on uncovered provider/asset scope and SKU stock; obtain actual receipts/closing/returns and replacement event evidence without universal test-consumable rates. No transferable numeric interval is established by the available historical route evidence; retain actual observations and uncertainty through cp_supportstock. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Record actual additional temporary stock S/N by SKU and native unit, including real testing/cleaning fluids and spare replacement; exclude items already inside package, asset or provider complete scope. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_support_support_materials is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_supportstock; independent actual-child roster and evidence"
    - id: atom_req_support_support_returns
      applies_to: "support"
      requirement: "Mandatory actual-child refinement for support/outputs/product. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Reconcile fuel return identifiers with cp_fuel without creating a second physical transfer; no avoided-production credit from an unused item or fuel. Range evidence need: actual usable outward temporary/fuel returns need matching native SKU/specification and recipient evidence; obtain real transfer IDs and reconcile cp_fuel without a default return fraction. No transferable numeric interval is established by the available historical route evidence; retain actual observations and uncertainty through cp_supportstock. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Record each actual usable outward return with matched SKU, fuel specification, native unit and receipt; gross-with-outlets or consumed-only subtraction exactly once. Closing stock and internally recovered material are not outward returns. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_support_support_returns is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_supportstock; independent actual-child roster and evidence"
    - id: atom_req_support_support_waste
      applies_to: "support"
      requirement: "Mandatory actual-child refinement for support/outputs/waste. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Recovered spills held at closing are closing inventory, not waste as well. Containment, recovery, disposal and uncontained emission are independent fates tied to the same event. Range evidence need: actual temporary consumable/packaging/nonburned-fuel waste mass and treatment depend on segregated event fates; obtain weights and recipient scope, excluding recovered closing inventory and already-owned waste. No transferable numeric interval is established by the available historical route evidence; retain actual observations and uncertainty through cp_supportstock. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Record actual segregated waste mass, state, origin, treatment and transport, including nonburned fuel waste; each quantity/N once. Do not duplicate installation waste, contained refrigerant or wastewater. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_support_support_waste is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_supportstock; independent actual-child roster and evidence"
    - id: atom_req_support_fuel_species
      applies_to: "support"
      requirement: "Mandatory actual-child refinement for support/outputs/elementary. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Returned, nonburned waste, uncontained loss and carried stock are mutually exclusive with burn. Total spill is audit-only; complete species factors are not multiplied by composition or fate again. Range evidence need: actual combustion species mass needs measured burned activity or audited complete disjoint fates and actual fuel/equipment factors, or species measurement; obtain raw factor units/basis and unknown-loss investigation, not an assumed burn fraction. No transferable numeric interval is established by the available historical route evidence; retain actual observations and uncertainty through cp_fuel. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Use actual measured burned fuel or audited complete disjoint native-unit fates with uncertainty and unknown-loss investigation, times a valid actual-fuel/equipment species factor, or measured species mass; normalize by N. Do not infer burn as a balance residual. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_support_fuel_species is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_fuel; independent actual-child roster and evidence"
    - id: atom_req_support_support_releases
      applies_to: "support"
      requirement: "Mandatory actual-child refinement for support/outputs/elementary. Enumerate the distinct actual products, single-function complete services/assets, physical waste carriers or substance/medium releases covered by this role. Preserve these original applicability and evidence obligations: Record actual fuel spills, cleaners, test fluids or dust only when released; do not invent species from safety sheets or label a recovered spill as an elementary release. Combustion and refrigerant releases have separate cards. Range evidence need: actual uncontained support-fluid/dust species and receiving-medium mass need event measurement or valid matched factor/composition/fate evidence; obtain true released mass separately from recovered/contained/closing amounts, not hazard declarations. No transferable numeric interval is established by the available historical route evidence; retain actual observations and uncertainty through cp_supportstock. Original quantity method, applied separately to each compatible child/material+property+unit/state ledger: Use actual measured species mass, valid matching activity-species factor, or measured whole-fluid release times evidenced species mass composition and receiving-medium fate; divide by N once. Whole fluid is nonadditive audit only. Keep independently supported named child cards; the remainder is not silently absent. Each actual child has one explicit exchange property/unit and independently collected quantity with exact identity/support before final foreground completion. Do not guess a SKU, species, medium, ratio or unit; no heterogeneous total, copied parent quantity/Range or duplicate whole-carrier/component flow. cp_atom_req_support_support_releases is required; missing roster/identity/unit/quantity/scope/closure keeps the foreground package incomplete, while candidate methodology may be revised without site data."
      evidence: "Original node protocol cp_supportstock; independent actual-child roster and evidence"
    - id: atom_req_integrate_single_package_and_field_fluid_reference
      applies_to: "integrate"
      requirement: "Execute cp_atom_req_integrate_single_package_and_field_fluid_reference. Preserve each complete package supplier gate/BOM and one acquisition owner. Facade/roof supply and usable returns are Area/m2; heat-pump, HRV and whole PV/conversion package supply and usable returns are Number of items/Item(s). Measure independent actual same-SKU/state package area/count, with explicit net/lap/opening/complete-set convention and stock fates, then S/N once. Other raw units may bridge only with actual same-package evidence and remain nonadditive; never buy covered windows/insulation/duct/control/precharge again. If a real independent window, inverter, different fluid or other actual component is outside the complete supplied package, resolve its exact separate one-unit exchange under the matching residual requirement; do not treat the complete package as a collection to sum with its constituents. Field/recovered/waste refrigerant is one actual full formulation/state per Mass/kg exchange, with circuit/origin/fate and tare evidence; no guessed species, loss ratio or fluid-as-emission. All legacy role/raw-field selectors map to actual child identity+one-unit/state/event groups, not deleted family cards. Missing identity/unit/conversion/scope evidence is incomplete; site evidence is not presumed by method validation."
      evidence: "cp_atom_req_integrate_single_package_and_field_fluid_reference"
validation_rules:
  - rule_id: v_environment_water
    applies_to: "water_supply; wastewater; atom_req_support_support_releases actual-child group"
    rule: "If actual direct natural-water abstraction or direct environmental whole-water Volume discharge occurs, the foreground package MUST add independently measured elementary input/output exchanges in the verified actual water-resource/receiving-medium identity and native Volume unit, with its own event/owner and original quantity. It is not purchased product water or wastewater-to-treatment. Keep whole-water Volume and any actual dissolved species Mass as distinct nonadditive physical/species views; c_species/m_fates govern only the named species-Mass rows, never convert or replace environmental water Volume. Missing actual water-resource identity/unit support blocks dataset finalization, not physical acceptance."
    source_ids: []
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Require actual SKU/service/species/destination and verified concrete flow/property/unit group for final exchanges. Reject at-plant Mass building flows as Count retrofit services and unknown native provider/energy support. Track each missing identity; a methodological target check cannot prove external identity verification."
    source_ids: []
  - rule_id: v_gate
    applies_to: "accepted_retrofit"
    rule: "Check retained-building survey/compatibility, actual design and installed anchorage/thermal/moisture/fire/air/weather interfaces; actual required blower-door, airflow balance, heat-pump/hydronic and electrical-PV-protection-control tests/retests, defect closure and signed owner/authority acceptance as applicable. Historical PHPP2007 targets and annual net-zero claims are not default handover tests."
    source_ids:
      - iea-annex50-design-guide-2011
      - iea-annex50-factsheet-2014
      - energiesprong-hameln-completed-2021
  - rule_id: v_stock_fates
    applies_to: "all inventory rows"
    rule: "Reconcile stock, external receipts, closing and matched usable outward returns once. Reconcile factory precharge, field supply, circuit closing, usable recovery, contained waste and actual species releases without overlapping origin or mass views. Fuel burned must be measured or supported by audited complete disjoint fates with unknown-loss investigation; never residual burn."
    source_ids: []
  - rule_id: v_power
    applies_to: "electricity_import; electricity_export"
    rule: "Require gross source-resolved imports/exports and retained-generation baseline, test circulation/load/loss ownership and meter reconciliation. Reject netting and future energy credits; construction handover does not certify annual operation."
    source_ids: []
  - rule_id: v_assets
    applies_to: "support"
    rule: "Check all asset consumers, nodes, jobs, periods, driver units, full-life denominator, observed history and evidenced remainder/replacement/termination/end-of-life. Check mutually exclusive asset-equivalent/native-service views, provider full upstream coverage and numerator/N once; missing lifecycle scope or unresolved replacements block finalization."
    source_ids: []
  - rule_id: v_rework
    applies_to: "integrate; accept"
    rule: "Every reject has producing node/event and repair, return, recovery, downgrade or disposal path; failed attempts/retests retain all real resources. Rejected or partially commissioned buildings do not enter N and shared events cannot be duplicated across periods."
    source_ids: []
  - rule_id: v_completeness
    applies_to: "all inventory rows"
    rule: "No missing role is assumed zero. Require documented absence or actual measured coverage, source applicability, full provider coverage and species fates. Preserve actual ranges/uncertainty; missing numerical range evidence is disclosed rather than invented. Any material measurement, acceptance, resource or identity gap prevents final data delivery."
    source_ids: []
