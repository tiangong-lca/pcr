      collection_method: "Execute cp_atom_req_integrate_single_package_and_field_fluid_reference. Preserve each complete package supplier gate/BOM and one acquisition owner. Facade/roof supply and usable returns are Area/m2; heat-pump, HRV and whole PV/conversion package supply and usable returns are Number of items/Item(s). Measure independent actual same-SKU/state package area/count, with explicit net/lap/opening/complete-set convention and stock fates, then S/N once. Other raw units may bridge only with actual same-package evidence and remain nonadditive; never buy covered windows/insulation/duct/control/precharge again. If a real independent window, inverter, different fluid or other actual component is outside the complete supplied package, resolve its exact separate one-unit exchange under the matching residual requirement; do not treat the complete package as a collection to sum with its constituents. Field/recovered/waste refrigerant is one actual full formulation/state per Mass/kg exchange, with circuit/origin/fate and tare evidence; no guessed species, loss ratio or fluid-as-emission. All legacy role/raw-field selectors map to actual child identity+one-unit/state/event groups, not deleted family cards. Missing identity/unit/conversion/scope evidence is incomplete; site evidence is not presumed by method validation."
      unit: "Actual m2, Item(s) or kg in separate one-unit child records"
      frequency: "Each package/fluid event and period close"
      temporal_coverage: "Complete actual campaign"
      site_scope: "integrate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Missing exact one-unit quantity or boundary support remains incomplete"
  calculation_rules:
    - id: c_normalize
      applies_to: "all inventory rows"
      rule: "Sum actual attributable job quantities of the same flow, unit and scope including failed attempts and divide by N once; final service is 1 Item(s). Do not apply a second normalization to already per-reference asset or provider quantities."
      inputs:
        - "actual job quantities"
        - N
        - cp_accept
      output: "Exchange amount per reference flow"
      source_ids: []
    - id: c_stock
      applies_to: "all stock-linked inventory rows"
      rule: "S = attributed opening + external net-tare gross receipts - carried closing; declared gross-with-outlets uses S and actual matched return outlet; consumed-only subtracts that same usable outward return once. Internal installation, loss and waste do not become another purchase."
      inputs:
        - opening
        - "external receipts"
        - tare
        - closing
        - "usable outward return"
        - "ledger view"
      output: "Actual native supply with one return convention"
      source_ids: []
    - id: c_species
      applies_to: "atom_req_prepare_preparation_releases actual-child group; atom_req_integrate_refrigerant_releases actual-child group; atom_req_integrate_installation_releases actual-child group; atom_req_support_fuel_species actual-child group; atom_req_support_support_releases actual-child group"
      rule: "Choose measured species mass OR actual compatible activity * valid species factor OR measured whole-fluid release * evidenced mass composition * receiving-medium fate. Preserve units/bases/sources. Complete species factor receives no extra composition/fate multiplier; fluid audit is nonadditive."
      inputs:
        - "measured species mass"
        - "actual activity"
        - "factor unit/basis/source"
        - "whole-fluid release"
        - "composition basis/source"
        - "fate basis/source"
      output: "Species mass per receiving medium before one normalization"
      source_ids: []
    - id: c_asset_views
      applies_to: "asset_equivalent_crane; asset_equivalent_scaffold; asset_equivalent_access_platform; asset_equivalent_tool; asset_equivalent_test_kit; asset_equivalent_temporary_unit; atom_req_support_asset_equivalent actual-child group; atom_req_support_asset_native_service actual-child group"
      rule: "Choose atom_req_support_asset_equivalent = (job_driver/full_life_driver)/N Item(s) with per-asset complete lifecycle burden OR atom_req_support_asset_native_service = job_driver/N actual native units with complete burden per identical driver unit. Driver units must match; no combined views or extra life/N division."
      inputs:
        - job_driver
        - full_life_driver
        - "driver units"
        - "burden denominator"
        - attribution_view
        - N
        - cp_assets
      output: "One asset contribution per reference flow"
      source_ids: []
    - id: c_freight
      applies_to: "atom_req_support_freight actual-child group"
      rule: "Sum attributable load_kg * distance_km over actual cargo legs, then /N; empty-return service coverage or vehicle activity remains explicit. Convert t*km to kg*km only with the factor 1000 and declared input units."
      inputs:
        - load_kg
        - distance_km
        - "empty-return coverage"
        - "actual allocation"
        - N
        - cp_freight
      output: "kg*km per reference flow with empty activity coverage"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "all inventory rows"
      requirement: "Use actual project, geography, period, retained structure, occupancy and configuration; compare only like scope, dwelling count and declared area convention, without declaring unlike buildings equivalent."
      evidence: "Survey, actual design/as-builts and signed handover"
    - id: dq_operands
      applies_to: "all protocols"
      requirement: "Retain original operands, units, factor/composition/fate basis and sources, uncertainty and calibration. Every event has one node owner and transfer/period link; no duplicated raw field names or hidden netting."
      evidence: "Primary measurements and audited source/scope matrices"
    - id: dq_gaps
      applies_to: "all inventory rows"
      requirement: "Individually document absence or measured coverage; do not replace missing provider/asset scope, species, native unit or range evidence with a universal zero/default. Update when actual design, supplier, refrigerant, tests or asset lifetime evidence changes."
