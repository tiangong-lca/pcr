    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification only: official CPC3.0 explanatory notes, 30 June2025, printed282;54112 includes alteration/repair of multi-dwelling buildings, broader than this retrofit subset."
  - id: "iea-annex50-design-guide-2011"
    type: "handbook"
    reference: "https://www.iea-ebc.org/Data/publications/EBC_Annex_50_Retrofit_Strategies_Design_Guide.pdf"
    used_for: "March2011 guide: whole existing apartment prefab retrofit; printed61–63 detailed air/structural survey,65–66 project targets,71ff fire and airtight interfaces. Historical technical evidence only, not current law or universal numerical criteria."
  - id: "iea-annex50-factsheet-2014"
    type: "official_guidance"
    reference: "https://www.iea-ebc.org/Data/publications/EBC_Annex_50_Factsheet.pdf"
    used_for: "2014 two-page factsheet: integrated existing-apartment roof/facade/HVAC/solar concept and isolated-retrofit condensation/overheating risks; no quantitative default."
