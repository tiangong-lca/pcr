allocation_rules:
  - rule_id: accepted_job_burdens
    applies_to: "lift_installation"
    rule: "Attribute direct installation, replacement/correction and failed/repeated-test burdens to the accepted job. Do not produce an accepted output until defects and required inspections close. A terminated/unaccepted job retains a separately disclosed failed-job disposition; it is never silently discarded or counted as a second accepted service."
    source_ids: []
  - rule_id: asset_complete_life_attribution
    applies_to: "equipment_provision_lifting; equipment_provision_access; equipment_provision_testing"
    rule: "For each shared reusable asset enumerate production/acquisition, deployment/use, maintenance/replacement and removal/end-of-life phases, all consuming jobs/nodes and reporting periods. Prefer actual service-meter hours as the causal allocation basis; justify another basis where hours do not represent wear/service. Reconcile attributed shares over the complete service denominator, record period-specific decisions and uncertainty, and avoid multiplying a full-life burden once in each year. Unresolved replacement or termination coverage blocks finalization."
    source_ids: []
  - rule_id: provider_and_energy_ownership
    applies_to: "all inputs"
    rule: "Reconcile provider coverage with direct material/energy/freight/asset rows. One supplied kit or bounded service cannot carry the same component, tool energy, packaging or capital burden a second time. Pad and supply burdens use the actual bounded handoff quantity with no unrelated whole-building allocation."
    source_ids: []
  - rule_id: returns_and_recovery
    applies_to: "usable_kit_return_kit; actual exchanges required by refine_usable_material_return; actual exchanges required by refine_installation_waste"
    rule: "Use actual gross physical custody and consistent burden transfer. Retained stock carries disclosed burden forward and is not an output. Usable outward returns transfer their recorded burden once; waste follows its real treatment. Retain installation/correction/test burdens on this job; no automatic displaced-production/recycling credit or arbitrary negative input."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "lift_installation"
      flow_role: "Kit, actual extras, consumables and packaging"
      record_type: "receipt/issue/weighing"
      raw_fields: "job_id; date; supplier; identity; serial; specification; supplied_state; kit_inclusion; gross_receipt; actual_issue; installed_quantity; return_quantity; closing_stock; unit; measurement_uncertainty; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Reconcile supplier bill of supply and serials with gross receipts, job issues, calibrated weighing or traceable supplier masses for each distinct identity. Retain closing stock with its burden owner. Normalize only job-attributable quantities by accepted installation count of the same configuration. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "Item(s); kg"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Invoices, calibrated scale records/supplier masses, drawings, signed job issue/custody reconciliation; no mixed-identity sum"
    - protocol_id: cp_interfaces
      process_id: "lift_installation"
      flow_role: "Pad and dedicated electrical preparatory handoffs"
      record_type: "design/quantity/acceptance"
      raw_fields: "job_id; interface_id; provider; owner; existing_or_new; boundary_endpoint; drawing_revision; measured_work; quantity; unit; electrical_rating; tolerance; acceptance_source; acceptance_result; final_connection_owner; upstream_dataset_coverage"
      collection_method: "Verify actual foundation/supply design and completed work at exact endpoints; record physical work quantities and separately owned upstream dataset coverage. Existing host needs pre-existence evidence. Normalize real job-specific services by accepted installation count; do not replace missing new works with zero."
      unit: "Actual mm; m; m3; kg; V; A; Hz; service Item(s)"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Approved current site-specific drawings, concrete/pad/anchor and electrical signoff, measured bills of work, provider scope and boundary check"
    - protocol_id: cp_assets
      process_id: "lift_installation"
      flow_role: "Reusable equipment complete-life shares"
      record_type: "asset/service/period ledger"
      raw_fields: "job_id; asset_id; owner; provider_scope; phase; period_id; consuming_job; consuming_node; use_hours; total_service_hours; replacement_event; termination_event; capital_burden; excluded_coverage; attribution_basis; uncertainty; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id"
      collection_method: "Record actual asset-use hours for installation/lifting/access/test apparatus and all relevant consuming jobs/periods; verify production, use, replacements and eventual removal coverage. Apply documented complete-life service share with period-specific ownership, then divide job-attributed burden by accepted job count. A provider gap needs separately accounted coverage. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "h; actual upstream burden units"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter/logbooks, provider boundaries, complete-life register, replacement/end-of-life evidence, share reconciliation and uncertainty"
    - protocol_id: cp_logistics
      process_id: "lift_installation"
      flow_role: "Real freight legs and mobilization"
      record_type: "dispatch/route records"
      raw_fields: "job_id; leg_id; provider; mode; origin; destination; load_identity; load_mass_t; distance_km; shared_load_basis; return_custody; supplier_included; allocation_uncertainty"
      collection_method: "Use actual dispatch masses and route km for each leg, including real return/mobilization legs. Attribute shared load using documented causal share and check supplier/provider inclusion; divide attributable tkm by accepted installation count."
      unit: "t; km; tkm"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Waybills, measured mass, route evidence, provider coverage and no double counted return leg"
    - protocol_id: cp_energy
      process_id: "lift_installation"
      flow_role: "Commissioning, tool and handling energy/fuel"
      record_type: "meter/fuel records"
      raw_fields: "job_id; date; equipment_or_circuit; task; test_id; failed_or_repeat; meter_start; meter_end; runtime_h; measured_demand_kW; fuel_identity; fuel_mass_kg; fuel_volume; fuel_volume_unit; density; density_unit; temperature; temperature_unit; unit; provider_inclusion; uncertainty; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; fuel_opening_kg; fuel_receipts_kg; fuel_closing_kg; fuel_usable_outward_return_kg; fuel_unburned_waste_kg; whole_uncontained_fuel_kg; fuel_supplied_attributed_kg; fuel_burned_kg; unexplained_fuel_difference_kg; fuel_measurement_basis; fuel_ledger_id"
      collection_method: "Submeter commissioning and tool/handling circuits or document actual runtime with measured demand. Keep later passenger use outside. Reconcile measured actual fuel and any evidenced same-state density conversion; retain unused/returned fuel separately in the fuel ledger, outside actual exchanges required by refine_usable_material_return, include correction/retest and exclude covered provider energy; divide job-attributable amounts by accepted count. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion. Preserve the legacy fuel_mass_kg observation with its declared fuel_measurement_basis; do not silently equate it to supply or burn. In a bounded mass ledger, S = fuel_opening_kg + fuel_receipts_kg - fuel_closing_kg - fuel_usable_outward_return_kg is attributable upstream supply and retains nonreturned unburned waste/releases; B is independently measured burn or S minus all evidenced disjoint unburned fates. Unknown fate/unexplained difference remains a gap, not presumed B. Link fuel_ledger_id and count the actual provider boundary once."
      unit: "kWh; kg; actual source volume unit"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration/readings, test/task timestamps, fuel record/density evidence, uncertainty and circuit/provider scope"
    - protocol_id: cp_acceptance
      process_id: "lift_installation"
      flow_role: "Actual final accepted service gate"
      record_type: "installation/test/inspection/handover"
      raw_fields: "job_id; model; serial; configuration; drawing_revision; authorized_instruction_revision; jurisdiction; installer_authorization; travel; platform_width; geometry_unit; rated_load; load_unit; supply_voltage_V; supply_current_A; supply_frequency_Hz; geometry_tolerance; load_tolerance; supply_tolerance; tolerance_source; pad_anchor_fascia_signoff; gate_interlock_guard_record; test_method; test_load; test_load_unit; test_duration; test_duration_unit; test_tolerance; pass_limit_source; actual_result; defect_id; correction; retest_result; inspection; owner_handover; accepted_count"
      collection_method: "Authorized mechanic records the actual installation, configured safety functions and authorized test protocol/results with all applicable units/tolerances; retain required inspector acceptance, defect closure, owner instruction/records and future maintenance responsibility. Count only signed accepted jobs matching this scope, then normalize to 1 Item(s)."
      unit: "Item(s); actual test/geometry/electrical units"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Authorization, current job drawings/instructions, signed tests and required inspection, corrected defect records and owner handover"
    - protocol_id: cp_custody
      process_id: "lift_installation"
      flow_role: "Usable returns, closing stock and waste"
      record_type: "transfer/stock/disposal"
      raw_fields: "job_id; source_identity; source_receipt; defect_id; correction_task; disposition; usability; recipient; transfer_id; gross_outward_quantity; closing_stock_quantity; carried_burden_owner; waste_class; treatment; unit; uncertainty; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id"
      collection_method: "Weigh/count real outward returns and waste by actual identity and custody document; distinguish internal rework and retained stock. Reconcile gross receipt with installed use, actual outward return, waste and closing stock. Normalize attributed outward quantities by accepted installation count; retain burden-transfer method. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "Item(s); kg"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed return/usability acceptance, weights, closing-stock ledger, waste carrier/treatment record and defect linkage"
    - protocol_id: cp_releases
      process_id: "lift_installation"
      flow_role: "Actual species and receiving compartment"
      record_type: "monitoring or task-specific factor"
      raw_fields: "job_id; task; substance_or_particle_class; receiving_compartment; activity; activity_unit; factor_source; factor_unit; captured_fraction; release_mass_kg; uncertainty; zero_screen_evidence; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; fuel_ledger_id; fuel_burned_kg; species_factor_activity_basis; species_factor_composition_scope"
      collection_method: "Screen actual tasks first; characterize each real pollutant/medium and measure kg or apply a supported task-specific substance factor to measured activity. Record capture and avoid treating collected waste as emitted. Normalize attributable release by accepted count; unknown identity remains a gap. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion. For a direct fuel-species factor based on fuel actually burned, link B=fuel_burned_kg from the same actual fuel_ledger_id, not S or an unexplained stock difference. Use the factor activity unit and its included composition/oxidation scope once; independently measured species need no second fuel-factor or composition multiplier. Other actual activity-based methods retain their declared activity basis and applicability. Exclude provider-covered releases."
      unit: "kg; actual factor/activity units"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Monitoring/calibration or traceable factor with applicability, species/compartment/capture evidence and uncertainty"
  calculation_rules:
    - id: job_normalization
      applies_to: "all inventory rows"
      rule: "For each actual identity, divide its documented job-attributable physical amount or burden by the number of accepted installations with the same configuration; keep gross receipts, outward returns, waste and closing stock independently reconciled. The final reference output is 1 Item(s)."
      inputs:
        - "Actual records"
        - accepted_count
        - cp_acceptance
      output: "Amount per reference flow"
      source_ids: []
    - id: asset_share
      applies_to: "equipment_provision_lifting; equipment_provision_access; equipment_provision_testing"
      rule: "Attribute the separately owned complete-life asset burden using this job actual service hours divided by evidenced total service hours across every consuming job and period; reconcile shares and phases, then normalize to the accepted installation. Justify and disclose any alternate causal basis."
      inputs:
        - cp_assets
        - "actual phase burdens"
        - "complete-life service denominator"
      output: "Job-attributed asset burden per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: route_identity
      applies_to: "reference output and kit"
      requirement: "Verify fixed/unenclosed/two-landing ACME screw route and self-supporting width against actual model/site drawings; nominal public guide and conflicting public ratings are not actual design acceptance."
      evidence: "Current authorized job drawing, model/serial, bill of supply, jurisdiction and installer authorization"
    - id: quantity_and_custody
      applies_to: "all inventory rows"
      requirement: "Preserve actual physical units, measurement method/calibration and uncertainty, receipt/issue/return/stock/waste balances by identity; zero needs positive evidence. Missing value or Range evidence is a data gap, not zero."
      evidence: "Linked protocols and complete job ledger"
    - id: asset_and_provider_coverage
      applies_to: "assets; pad; supply; freight; energy"
      requirement: "Audit single ownership and all relevant phases/periods; disclose service denominator, replacements/termination and gaps, no twice-counted supplier coverage."
      evidence: "Provider scope and measured interfaces; full-life asset/custody reconciliation"
    - id: acceptance_and_temporal_coverage
      applies_to: "accepted_lift_installation"
      requirement: "Cover receipt/mobilization through correction/retest/inspection/handover dates; no unresolved defects in accepted count and no later passenger energy or maintenance."
      evidence: "Signed cp_acceptance and aligned task/test records"
    - id: concrete_identity_and_ranges
      applies_to: "all exchange cards"
      requirement: "Resolve each actual exchange to a verified concrete UUID and compatible support chain before final TIDAS production; retain configuration/provider/geography/state and measurement fit. Collect the card-specific Range evidence needs; this candidate supplies no generic material/energy/lifetime defaults."
      evidence: "Actual flow detail/support evidence; metered/weight/task data and uncertainty"
    - id: refine_anchors
      applies_to: "anchors_anchor"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Actual separately supplied anchors/fixings join the self-supporting base to the accepted pad. Expand by actual material, anchor specification and supplied state; omit components already included in the kit. Manufacturer sources support the equipment/task/interface context only; quantities, gross custody and LCA attribution are established by the stated foreground protocols. Range evidence need: Actual anchor schedule, component masses and issue/replacement records are required; planning anchor layouts supply no universal kg or count factor. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual fixing functions, material/specification/SKUs or real complete separately bought anchor sets need their own complete supply identity/oneunit and independent quantity; no invented anchor kit."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_connection_components
      applies_to: "connection_components_fascia; connection_components_gate; connection_components_lock; connection_components_control; connection_components_cable; connection_components_conduit; connection_components_connector"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Expand the actual separate fascia panels, gate/lock/control parts, cable/conduit/connectors and final connection hardware by distinct material/product identity and state. These form one role family, not one aggregate material flow. Manufacturer sources support the equipment/task/interface context only; quantities, gross custody and LCA attribution are established by the stated foreground protocols. Range evidence need: Require actual drawings, bill of supply and component masses; no common mass range or mixed-material sum is valid. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual further final-connection hardware/functions/SKUs require own identities and quantities; complete kit/gate/control packets include internal constituents once."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_consumables
      applies_to: "consumables_lubricant; consumables_cleaner"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Include only documented extra lubricant/cleaner or other joining consumable used before this handover. Expand actual formulations and concentrations; factory filling remains in the kit. A screw-driven route does not create a hydraulic-oil input. Manufacturer sources support the equipment/task/interface context only; quantities, gross custody and LCA attribution are established by the stated foreground protocols. Range evidence need: Actual authorized task, product composition and measured consumption/returns are needed; later scheduled grease use is outside this job. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual other joining consumables need exact formulation/state/native unit; factory fill included in kit, screw drive no inferred hydraulic oil."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_packaging
      applies_to: "packaging_wood; packaging_cardboard; packaging_plastic"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Expand actual wood/cardboard/plastic or reusable packaging by identity and ownership. Record physical packaging for custody balance; do not add another upstream material burden when supplier-kit coverage already includes it. Range evidence need: Need actual packaging receipt/weights, supplier inclusion and reuse records rather than a generic packaging fraction. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual reusable containers/other mixed packaging or separately owned identities need exact custody/life-unit records; supplier-kit included manufacture physical audit only, no second burden."
      evidence: "cp_materials; actual independent records and identity/unit evidence"
    - id: refine_equipment_provision
      applies_to: "equipment_provision_lifting; equipment_provision_access; equipment_provision_testing"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record each actual reusable apparatus separately with bounded provider coverage or owned complete-life production/use/replacement/removal attribution. Identify this installation and other consuming jobs/periods; do not include lifetime passenger-lift operation. Range evidence need: Need asset IDs, metered/logged hours, service-life records, replacement/end-of-life scope and uncertainty; no assumed lifetime, utilization or hire-hour burden factor. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual installation apparatus functions/models and true Count/other native references require exact independent refinement. For compatible owned per-hour view, use actual job h per accepted lift and complete-life burden per total evidenced service h once; do not apply whole-asset fraction again to h quantity. All consuming jobs/phases/periods, replacements/termination coverage and shared ownership retained."
      evidence: "cp_assets; actual independent records and identity/unit evidence"
    - id: refine_fuel
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional actual fuel for combustion equipment serving this job, expanded by supplied fuel identity and composition. No fuel is inferred merely from the presence of reusable equipment. This upstream product requirement records attributable supplied fuel, including nonreturned unburned waste or release, separately from actual fuel burned; unused/returned fuel is reconciled separately in the fuel ledger and is excluded from actual exchanges required by refine_usable_material_return so it cannot be counted twice. Range evidence need: Need actual equipment fuel records and conversion uncertainty, or evidenced zero combustion use; no generic diesel factor. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Each actual carrier/grade supply in one native unit, fuel ledger actual stock/usable return/outlets, nonreturned unburned waste/loss retains upstream supply burden; burned activity independently known, no inferred combustion from apparatus presence and no duplicate unused fuel return family."
      evidence: "cp_energy; actual independent records and identity/unit evidence"
    - id: refine_usable_kit_return
      applies_to: "usable_kit_return_kit"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Record real outward return to supplier/another identified custodian only for complete counted kits or traceable counted components with compatible identities. Internal correction/retest stays within lift_installation; closing stock never leaves as a fictitious product. Range evidence need: Need actual return authorization, physical transfer and product usability evidence; no assumed return fraction. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual loose returned components require original supply/state/native-unit and carried-burden evidence; no Count return of a kg-supplied unchanged component. Independently new actual Count supplies require their own complete identity and registration, not a second kit-BOM purchase."
      evidence: "cp_custody; actual independent records and identity/unit evidence"
    - id: refine_usable_material_return
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Expand each actual usable surplus material/packaging identity and recipient. This product custody exit is separate from waste; rejected parts require documented usability before product classification. Consumed-fuel input uses its separate ledger; unused fuel is excluded from this return family. Range evidence need: Require actual weights and custody/quality acceptance; neither retained stock nor claimed avoided production supplies a return estimate. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual outward usable original product/SKU/native unit/recipient and upstream burden bridge; fuel governed separate ledger, closing stock/internal correction not product exit."
      evidence: "cp_custody; actual independent records and identity/unit evidence"
    - id: refine_installation_waste
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Expand discarded damaged components, offcuts, nonreturnable packaging and contaminated consumables by actual composition/hazard state and treatment destination. Rejected assembly state originates in lift_installation; record correction here or actual disposal exit, retaining its burdens. Range evidence need: Need waste weights, characterization, transfer/treatment records and actual reject dispositions; no fixed scrap or recovery yield. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual segregated solid waste, contaminated carriers, packaging, failed/new and historic origins by independent dispatch; retain native-volume effluent separately when it occurs."
      evidence: "cp_custody; actual independent records and identity/unit evidence"
    - id: refine_direct_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Only actual releases across the environment boundary belong here, each expanded by substance/species or particle class and receiving air/water/soil compartment. Captured drilling dust or spent cleaner sent offsite is waste. No hydraulic leak, generic VOC sum or upstream electricity emission is presumed. Range evidence need: Need task-specific monitoring or supported species/compartment factors and measured activity; unknown pollution identity is a collection gap rather than a broad flow UUID. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_releases; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator must retain the original accepted configuration strata, state/gate and causal attribution; do not divide unlike circuits, routes, products or jobs as if they were equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
validation_rules:
  - rule_id: route_fit
    applies_to: "reference product"
    rule: "Reject routes requiring hydraulic/traction/mobile/enclosed/hoistway/pit or wide wall-supported treatment. Check actual project route, current authorized drawings and support/supply interfaces before producing a dataset."
    source_ids:
      - savaria-multilift-current
      - savaria-multilift-planning-2020
      - savaria-multilift-owner-2024
  - rule_id: gate_complete
    applies_to: "accepted_lift_installation"
    rule: "Require authorized installer, accepted pad/supply/anchor/fascia/guard/gate/interlock configuration, actual safety/functional test and required jurisdiction inspection records, closed corrections/retests and signed owner handover. Missing commissioning criteria or an unresolved defect blocks accepted output; no claim of whole-building accessibility compliance."
    source_ids:
      - savaria-multilift-current
      - savaria-multilift-planning-2020
      - savaria-multilift-owner-2024
  - rule_id: units_balance_identity
    applies_to: "all inventory rows"
    rule: "Verify 1 Item(s) final output and identical reference denominator; linked node-specific protocols, physical units and compatible support chain; each actual component/provider/waste/pollutant identity; gross balances with real returns and non-output closing stock. No fixed UUID based only on name similarity."
    source_ids: []
  - rule_id: shared_period_and_rework
    applies_to: "equipment_provision_lifting; equipment_provision_access; equipment_provision_testing; actual exchanges required by refine_installation_waste"
    rule: "Require all shared consuming jobs/nodes and periods, complete-life phase coverage, actual denominator and single ownership. Unresolved replacement/termination/coverage blocks finalization. Link rejected assemblies to lift_installation correction/retest or actual usable return/waste exit, retaining their burdens and excluding rejects from accepted output."
    source_ids: []
  - rule_id: boundary_completeness
    applies_to: "pad_work; supply_work; all inputs"
    rule: "Require measured newly constructed pad/supply work with explicit bounded owner or inclusion, evidence for existing-host zero new work, kit-vs-extra reconciliation and no duplicate provider/material/energy/packaging/freight burdens. Disclose every unavailable quantity, Range and identity; absence is not zero."
