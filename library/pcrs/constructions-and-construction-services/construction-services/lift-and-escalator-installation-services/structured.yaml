product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.lift-and-escalator-installation-services"
  classification_refs: "CPC 3.0 54691; narrower scope than all lift/escalator installation"
  covered_products: "Fixed unenclosed two-landing self-supporting-width screw-platform lift installation, commissioned at declared pad and dedicated supply interfaces"
  excluded_products: "Hydraulic/traction equipment; escalators/travelators; mobile/enclosed/pit/hoistway or wide wall-supported configurations; later lift operation or maintenance"
  representative_product: "Savaria Multilift standard unenclosed fixed screw-drive configuration, qualified against actual current site-specific drawings"
  production_route: "Factory kit receipt; interface acceptance; authorized site assembly/anchoring/final connection; commissioning, correction/retest and inspection; owner handover"
  market_state: "Completed accepted installation service at its documented first commissioning gate; not a sold generic machine or passenger transport"
functional_unit:
  what: "Complete accepted fixed unenclosed two-landing screw-driven wheelchair vertical-platform lift installation"
  how_much: "1 Item(s)"
  how_well: "Actual manufacturer/model/serial and drawing revision; verified self-supporting width, travel, rated load and access arrangement; pad/anchor/fascia/gate and dedicated supply interfaces accepted; authorized commissioning and required jurisdiction inspection passed; corrections closed"
  how_long_or_cycle: "One first-installation job from job-attributable receipt/mobilization and preparatory handoffs through signed handover, including delays, corrections and retests. Reusable equipment is attributed over documented complete-life periods across this and other jobs; no assumed lift operating lifetime or passenger cycle count."
  reference_flow_link: "accepted_lift_installation"
system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers first installation and acceptance of one fixed, unenclosed, two-landing ACME screw-driven wheelchair vertical-platform lift in a documented self-supporting-width configuration. The authorized mechanic integrates the supplied tower/platform with the ramp, guards, landing gate, controls, interlocks, anchors and declared final electrical connection. The accepted installation is the output; later passenger journeys and maintenance are outside this construction-stage service. It is suitable for indoor or outdoor projects only where the actual model and jurisdiction permit. Exclude hydraulic or traction lifts, escalators and travelators, mobile lifts, wide wall-supported configurations, factory enclosures, constructed hoistways and pits, onsite lift manufacture, general building construction and subsequent routine operation. Required job-specific concrete pad and dedicated supply preparation must be explicitly owned and quantified upstream; their new construction cannot be treated as an unburdened existing host. If no accepted bounded preparatory handoff exists, include that preparation in the foreground package with measured work and appropriate additional processes before using this PCR. The route must fail applicability if its actual support/configuration requires an excluded structure. [savaria-multilift-current; savaria-multilift-planning-2020; savaria-multilift-owner-2024]"
      source_ids:
        - savaria-multilift-current
        - savaria-multilift-planning-2020
        - savaria-multilift-owner-2024
    - rule_id: installation_gate
      applies_to: "lift_installation"
      rule: "Include authorized alignment/anchoring, platform/ramp/guards, job-required landing gate and controls/interlocks, fascia/pinch-point protection, final connection, commissioning electricity, required functional/safety checks, jurisdiction inspection, correction/retest and owner records/training. The actual authorized instructions and inspector acceptance define tests and pass limits; owner-use descriptions alone are not a complete commissioning protocol."
      source_ids:
        - savaria-multilift-current
        - savaria-multilift-planning-2020
        - savaria-multilift-owner-2024
    - rule_id: preparatory_work_owner
      applies_to: "pad_work; supply_work"
      rule: "Record job-specific foundation/pad and dedicated electrical preparation as separate upstream accepted services with provider, measured quantities, exact endpoints and gate. Include their upstream burdens once. Existing host treatment requires positive pre-existence evidence; new work with no bounded owner must be brought into foreground measured scope, not omitted. Exclude arbitrary whole-building burdens."
      source_ids:
        - savaria-multilift-current
        - savaria-multilift-planning-2020
        - savaria-multilift-owner-2024
    - rule_id: kit_and_extras
      applies_to: "factory_lift_kit; anchors_anchor; connection_components_fascia; connection_components_gate; connection_components_lock; connection_components_control; connection_components_cable; connection_components_conduit; connection_components_connector; consumables_lubricant; consumables_cleaner"
      rule: "Reconcile the actual factory bill of supply: tower/screw/motor/platform, ramp/guards/underpan, gates/controls/interlocks/options and factory lubricant belong to the kit where supplied. Add only separately supplied anchors, fascia/gate parts, wiring/connection components and actual extra lubricant/cleaner. No hydraulic oil is implied by screw drive."
      source_ids:
        - savaria-multilift-current
        - savaria-multilift-planning-2020
        - savaria-multilift-owner-2024
    - rule_id: asset_periods
      applies_to: "equipment_provision_lifting; equipment_provision_access; equipment_provision_testing"
      rule: "Identify each reusable lifting/access/installation/test asset and its owner, consuming jobs/nodes and reporting periods. Account for production, deployment/use, maintenance/replacement and eventual removal/end of life through an actual bounded provider dataset or documented complete-life attribution. Explicitly cover omitted provider phases separately; a hire-hour invoice alone cannot erase capital burdens."
      source_ids: []
    - rule_id: physical_custody
      applies_to: "all inventory rows"
      rule: "Inventory gross job receipts and issues by actual identity, real outward usable returns, retained closing stock with carried-forward burden, waste and characterized releases. Closing stock is a balance state, not an outward product. Expand each variable card into zero, one or multiple real identities; never sum unlike materials, services or pollutants as one flow."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Factory-made screw-lift kit delivered for the accepted job; actual concrete pad and dedicated electrical supply termination with named providers, quantities, approval and separate bounded upstream datasets where newly constructed"
  starting_condition_role: "Purchased equipment and explicitly owned upstream preparatory services; an accepted existing pad/supply may be an existing host only with evidence of pre-existence and actual attribution disclosure"
  product_classification_scope: "Installation of the selected screw-platform route, narrower than the CPC installation leaf"
  recursive_input_rule: "A purchased service in this same installation category must have a nonoverlapping supplier gate and explicit burden coverage. Do not recursively add a complete installation service as an input to its own complete output."
  upstream_dataset_requirement: "Link the complete kit and each actual extra component, pad/supply work and bounded equipment/freight provision to compatible upstream datasets. Any supplier-included service/material/packaging or capital burden has one owner only. New pad/supply construction needs measured provider scope; absence blocks completeness."
  disclosure: "Declare pad and electrical handoff endpoints and responsibility, pre-existing versus new work, actual drawings and permits, kit composition, all equipment/provider coverage and complete-life periods, excluded passenger service/maintenance and remaining site responsibilities."
