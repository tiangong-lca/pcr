  calculation_rules:
    - id: actual_normalization
      applies_to: "all nonreference inventory rows"
      rule: "q_i = N_i / D; N_i is independently collected attributable actual numerator in its own row unit; D is positive independently counted accepted complete same-configuration installations. Preserve raw N_i and its protocol; never solve N_i from a target reference quantity."
      inputs:
        - N_i
        - D
        - cp_acceptance
        - cp_materials
        - cp_energy
        - cp_services
        - cp_releases
      output: "q_i"
      source_ids: []
    - id: custody_closure
      applies_to: "receptacle; plate_and_fixings_wallplate; plate_and_fixings_permanent_fixing; atomic_plate_and_fixings; atomic_incoming_packaging; unused_product_return_receptacle_return; unused_product_return_wallplate_return; unused_product_return_fixing_return; atomic_unused_product_return; installation_waste_conductor_offcut; installation_waste_failed_receptacle; installation_waste_failed_wallplate; installation_waste_failed_fixing; atomic_installation_waste"
      rule: "For each identifiable source pool, opening stock + receipts = installed retained material + closing stock + usable returns + actual waste + identified releases + residual. Document tolerance and residual; unresolved mass is a gap, not dust. Heterogeneous mass totals are diagnostic only."
      inputs:
        - cp_materials
        - cp_releases
      output: "pool closure and residual"
      source_ids: []
    - id: asset_attribution
      applies_to: "owned_equipment_attribution_hand_tool; owned_equipment_attribution_powered_tool; owned_equipment_attribution_electrical_tester; owned_equipment_attribution_external_charger; owned_equipment_attribution_access_asset; atomic_owned_equipment_attribution"
      rule: "a_rj = A_rj / sum(A_rk); attributed quantity = a_rj / D; attributed burden = B_r * a_rj / D. Apply resource_share to the complete lifecycle packet and retain every period-specific owner and phase total once."
      inputs:
        - A_rj
        - A_rk
        - B_r
        - D
        - cp_services
      output: "asset quantity and burden share"
      source_ids: []
    - id: atomic_child_normalization
      applies_to: "plate_and_fixings_wallplate; plate_and_fixings_permanent_fixing; owned_equipment_attribution_hand_tool; owned_equipment_attribution_powered_tool; owned_equipment_attribution_electrical_tester; owned_equipment_attribution_external_charger; owned_equipment_attribution_access_asset; hired_support_service_transport_event; hired_support_service_access_event; hired_support_service_test_event; unused_product_return_receptacle_return; unused_product_return_wallplate_return; unused_product_return_fixing_return; installation_waste_conductor_offcut; installation_waste_failed_receptacle; installation_waste_failed_wallplate; installation_waste_failed_fixing"
      rule: "For each atomic_flow_row_id retain its independent physical numerator independent_physical_quantity. actual_<row_id>_quantity is its named alias only, never a parent family total. Material inputs use the original CP stock gross/net and outward-return convention after independent weighing or same-SKU conversion and reconciliation; internal transfers use actual paired custody quantity; usable exits and wastes use their independently measured actual fate quantities. Owned-asset child quantity is the original complete-life asset equivalent a_rj=A_rj/sum(A_rk), with every consumer and positive complete denominator; purchased-service child quantity uses only actual completed events whose real contract defines Item(s), with the original attribution, never hours or price converted into count. atomic_child_intensity = independent_physical_quantity / D, where D is the original independently accepted complete same-configuration installation count from cp_acceptance; D=0 blocks normalization, and denominator/allocation cannot change."
      inputs:
        - atomic_flow_row_id
        - independent_physical_quantity
        - exchange_property
        - exchange_unit
        - D
        - cp_acceptance
        - cp_materials
        - cp_services
        - cp_releases
      output: "atomic_child_intensity"
      source_ids: []
