system_boundary:
  rules:
    - rule_id: scope_eligibility
      applies_to: "foreground_system_boundary"
      rule: "This PCR covers the first fitting of an indoor, non-electronic 15 A, 125 V grounded duplex receptacle on a single-feed circuit. The installer side-terminates prepared compatible copper conductors, fixes the fitting in an existing suitable box, fits its plate, restores the circuit under competent control and hands over a tested, accepted installation. The physical interface and signed acceptance define the service; brand alone does not define membership. The scope excludes branch-circuit construction or extension, new boxes or panels, removal/replacement of an existing fitting, split-feed conversion, push-in connections, GFCI/AFCI and electronic or smart receptacles, fire/burglar alarms, telecommunications, appliances, and electricity consumed after handover. Drilling a substrate and extending cable are outside this selected route. Manufacturer instructions illustrate the route; the delivered model instructions and applicable jurisdiction/design determine actual compatibility and acceptance. [leviton-receptacle-installation; leviton-5320-product]"
      source_ids:
        - leviton-receptacle-installation
        - leviton-5320-product
    - rule_id: installation_gate
      applies_to: "install_accept"
      rule: "The installer owns receipt and landed supply, receptacle/plate/permanent fixing integration, safety verification, termination, mounting, controlled restoration, tests, corrections, retests and signed handover. Prepared conductor/box construction and post-handover use are outside this gate."
      source_ids:
        - leviton-receptacle-installation
        - leviton-5320-product
    - rule_id: supply_custody
      applies_to: "install_accept"
      rule: "Track physical incoming packaging even where upstream manufacture already includes it. Separate packaging burden only if excluded upstream; use the delivery/packaging inclusion ledger to prevent duplication."
      source_ids: []
    - rule_id: resource_boundary
      applies_to: "install_accept"
      rule: "Exact installer-owned tools, testers, external chargers and access assets may serve install_accept instances in other jobs and reporting periods; enumerate every consumer and phase in cp_services. Providers own hired-asset lifecycle; ledger any included foreground energy."
      source_ids: []
    - rule_id: period_gate
      applies_to: "install_accept"
      rule: "Index manufacture/acquisition, each service/reporting period, maintenance/replacement and retirement/termination separately. Link inputs, assets, accepted outputs and events to job and period; unresolved remaining-life or termination evidence prevents final attribution."
      source_ids: []
