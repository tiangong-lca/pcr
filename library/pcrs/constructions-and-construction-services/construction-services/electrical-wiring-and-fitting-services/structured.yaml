allocation_rules:
  - rule_id: reject_burden
    applies_to: "install_accept"
    rule: "There is no intended co-product. Retain unsuccessful work, damaged inputs, corrective work and retesting with the original accepted job. Rework stays in install_accept; usable return and actual waste/recovery/discard exit need event, state and recipient. Unresolved rejects do not enter accepted output and returns receive no avoided-production credit."
    source_ids: []
  - rule_id: resource_share
    applies_to: "owned_equipment_attribution_hand_tool; owned_equipment_attribution_powered_tool; owned_equipment_attribution_electrical_tester; owned_equipment_attribution_external_charger; owned_equipment_attribution_access_asset; atomic_owned_equipment_attribution; hired_support_service_transport_event; hired_support_service_access_event; hired_support_service_test_event; atomic_hired_support_service"
    rule: "For exact resource r and job j, a_rj = A_rj / sum(A_rk), with every benefiting job k across the same resource lifecycle packet and a common causal physical activity basis. Require positive complete denominator and sum(a_rj) = 1. Attribute asset quantity a_rj / D Item(s) and burden B_r * a_rj / D. Record period-specific shares and their evidence; output-count allocation is inappropriate where use differs. Never invent lifetime or omit other jobs."
    source_ids: []
  - rule_id: phase_reconciliation
    applies_to: "install_accept"
    rule: "Tie resource manufacture/acquisition, every service/reporting period, maintenance/replacement and retirement/termination to identifiable packets, jobs and dates. Replacement has its own actual event; remaining-use uncertainty is explicit. Reconcile phase totals once and carry each packet only once; provider asset manufacture is not an additional installer input when a hired service includes it. Job-specific losses retain their job owner."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "install_accept"
      flow_role: "accepted installation and corrections"
      record_type: "job_acceptance"
      raw_fields: "job/configuration/model/rating; BOM; circuit/box/earth/design; isolation/proof-dead; termination/earth/polarity/function test results; failure/correction/retest events; dates; signature; independently counted D"
      collection_method: "Inspect actual scope and compatible interfaces; retain competent test and signed acceptance records and reconcile complete accepted jobs separately from components, attempts and rejects. Establish positive D from independent accepted complete installation count."
      unit: "Item(s)"
      frequency: "every job and retest"
      temporal_coverage: "receipt through signed acceptance"
      site_scope: "declared indoor fitting site/configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed tests; exclusion reconciliation; dates and configuration coverage"
    - protocol_id: cp_materials
      process_id: "install_accept"
      flow_role: "supplies, packaging and usable returns"
      record_type: "material_custody"
      raw_fields: "shipment/job/date; SKU/material/state; net mass; counts/lengths and matching factors; installed/stock/return/waste; receipt/return receiver; upstream manufacture/delivery/packaging inclusions; actual_child_id; atomic_flow_row_id; parent_ledger_id; actual_object_sku_or_bounded_service; actual_state_gate; actual_receiving_medium_or_custodian; exchange_property; exchange_unit; independent_physical_quantity; same_identity_conversion_evidence; actual_activation_or_absence_evidence; source_stock_event_id; actual_owner_id; actual_period_id; package_inclusion_exclusion; one_burden_owner_evidence; child_reconciliation_status; child_range_evidence; legacy_parent_role; source_component_role; source_component_row_id; paired_atomic_row_id; actual_transfer_event_id; child_quantity_operands; own_node_helper_id; quantity_ledger_group_key; source_actual_child_quantity; recipient_actual_child_quantity; signed_custody_measurement_id; source_receipt_provenance; paired_quantity_uncertainty; transfer_discrepancy_record; actual_loss_or_state_change_owner; pair_reconciliation_status"
      collection_method: "Weigh net quantities with calibrated equipment or use traceable matching-SKU conversion records; follow each source pool from receipt to installed retention, closing stock and original event-linked exits. Calculate actual attributable mass / D by SKU and state. Retain the original PCR stock, event, denominator, attribution and closure methods above. Maintain an actual-child register by node, period and parent_ledger_id. Each quantity-bearing exchange has one independent physical product, complete formulation/assembly, defined bounded service, actual waste carrier or substance/medium, one fixed property/unit and its independently collected numerator. Retain all original roles, corrections and stock/WIP/fate records. Former family quantities remain non-exchange custody or closure diagnostics only; never copy/divide a family total or Range into children or sum unlike units as an exchange. Each actual SKU/state/provider/receiver is separate when it represents an independent exchange. A supplied complete package and its already included constituents are exclusive views; identical physical cables serving multiple duties are counted once. Missing actual child roster, quantity, activation/absence, identity/state/medium, method or unit support blocks final foreground completion; it is never zero or implicitly not applicable. Foreground records provide the operands; they cannot choose another reference denominator, allocation, stock or fate convention. actual_<row_id>_quantity is the named alias of this CP independent_physical_quantity keyed by atomic_flow_row_id and governed by atomic_child_normalization; it is neither another observation nor a copy of the parent total. Actual child records retain legacy_parent_role and own_node_helper_id; independently collect every original role helper operand in child_quantity_operands, grouped by quantity_ledger_group_key material/source-state/current-state/period/unit. Real internal source and recipient match by paired_atomic_row_id and actual_transfer_event_id, never derived from a parent total or unexplained residual. Internal I=F is a reconciliation condition for the same actual material/SKU, state, event, custody boundary and gate, never an assignment formula. Each child retains its own actual dispatch quantity and receipt/custody evidence. The same signed custody measurement may be traceably reused without inventing another weighing. Never copy a family total into each child, overwrite a real receipt or force unknown quantities equal. Preserve discrepancies with original values/units, measurement uncertainty, actual transfer loss, state change and responsible-owner evidence; unresolved differences block completion. Internal quantities remain unnormalized physical amounts, divided by the original reference denominator only at each card final step; parent-role sums are QA only."
      unit: "kg"
      frequency: "every shipment and custody event"
      temporal_coverage: "opening stock through job closure"
      site_scope: "all supplies attributable to declared jobs"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; factor/SKU match; supplier boundary; receiver and residual ledger"
    - protocol_id: cp_energy
      process_id: "install_accept"
      flow_role: "supplied pre-handover electricity"
      record_type: "meter_record"
      raw_fields: "provider/voltage/site/meter; job/tool/charger/test/load; start/end kWh and dates; all shared consumers/activity; contract energy inclusions"
      collection_method: "Read actual meter differences at the declared boundary and attribute shared supply using recorded activity; preserve raw energy apart from rated power, Ah and elapsed time. Calculate attributable actual kWh / D."
      unit: "kWh"
      frequency: "every metered activity/period"
      temporal_coverage: "installation through acceptance only"
      site_scope: "declared meters and all benefiting consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration/resolution; inclusion ledger; complete activity denominator; Energy support gap"
    - protocol_id: cp_services
      process_id: "install_accept"
      flow_role: "owned assets and purchased support"
      record_type: "resource_lifecycle"
