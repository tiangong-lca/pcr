  how_long_or_cycle: "One receipt-to-acceptance job cycle, including its unsuccessful attempts and retests. Link the job dates to the acquisition/manufacture, service/reporting periods, maintenance/replacement and retirement/termination phases of each shared resource; no operating-year functional benefit is claimed."
