    type: "standard"
    reference: "USACE/NAVFAC/AFCEC UFGS 03 30 00, February 2019, Change 10 August 2025; https://www.wbdg.org/FFC/DOD/UFGS/UFGS%2003%2030%2000.pdf"
    used_for: "Placement, finishing, curing and field acceptance responsibilities; actual project specification controls, not universal consumption factors."
