measurement_rules:
  - id: accepted_volume
    applies_to: "reference product"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Use accepted net geometric volume; exclude voids and unaccepted/rejected work. Link acceptance record to cp_curing. Never substitute delivered fresh volume."
  - id: fresh_density
    applies_to: "fresh_concrete; returned_fresh_concrete"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "When only mass is recorded, divide mass by measured density of the same fresh batch; preserve sampling and moisture/air-content state, without a universal density."
  - id: wet_waste
    applies_to: "placement_wash_slurry; placement_concrete_waste; finishing_residues_captured_sanding; finishing_residues_rejected_mortar; finishing_residues_spent_abrasive; rejected_hardened_concrete_waste"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain wet/dry basis and density or solids fraction for conversions; wet slurry and its separated solids must not overlap."
  - id: fuel_mass
    applies_to: "placement_diesel"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain measured diesel mass; volume conversion requires supplier density at declared temperature and energy conversion requires the documented lower heating value."
  - id: energy_units
    applies_to: "placement_electricity; finishing_electricity; curing_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Retain fuel mass and electricity separately; convert kWh to MJ using 3.6 only when required, and fuel mass with documented lower heating value."
