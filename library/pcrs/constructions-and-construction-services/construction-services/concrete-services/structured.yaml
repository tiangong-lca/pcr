allocation_rules:
  - rule_id: retain_rework
    applies_to: "all processes"
    rule: "Retain burdens from failed tests, rejected pours and routine rework in the originating accepted service lot; track placement→finishing or finishing→curing rework and return to placement for replacement with event ids. Count final accepted geometry once."
    source_ids: []
  - rule_id: run_attribution
    applies_to: "all processes"
    rule: "Use identified pours and curing periods as production batches; assign startup, changeover and cleanup by event-linked measured activity. Shared events have one owner and documented shares summing to one across all consumers."
    source_ids: []
  - rule_id: shared_energy
    applies_to: "all processes"
    rule: "Prefer submetering. If absent, estimate node shares from recorded operating time, rated/observed power and utilization, disclosing uncertainty; never charge grid electricity and generator fuel for the same generation twice."
    source_ids: []
  - rule_id: no_automatic_credit
    applies_to: "returned_fresh_concrete; waste outputs"
    rule: "Record product returns or waste exits by recipient acceptance and legal status. No automatic avoided concrete or recycling credit; any consequential credit requires a separate declared study method."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_placement
      process_id: "placement"
      flow_role: "all inventory rows in this node"
      record_type: "event ledger, measurements and acceptance"
      raw_fields: "pour_id; delivery_id; event_id; transfer_id; asset_id; operating time; metered or rated power; utilization; consumer share; fuel carbon fraction/method; fossil carbon mass fraction and denominator; carbon oxidized-to-CO2 fraction; chosen combustion factor value/unit/source and applicability; factor uncertainty; fuel density/temperature/lower heating value; received fresh volume; measured density; diesel; electricity; water; equipment hours; dispatch_id; carrier; payload tonnes; route kilometres; empty-return activity; mobilization ownership/share; return volume; waste/slurry mass; emissions species and medium; direct washout release event and destination compartment; released liquid volume or mass; measured substance concentration, sampling time and unit; containment/treatment split; inventory changes; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty; fuel_grade_id; fuel_cohort_id; fuel_asset_id; fuel_period_id; fuel_scope_owner; fuel_provider_inclusion_evidence; fuel_opening_kg; fuel_external_receipts_net_kg; fuel_closing_intact_carried_kg; fuel_usable_return_kg; fuel_usable_transfer_kg; fuel_waste_constituent_kg; fuel_uncontained_constituent_kg; fuel_burned_metered_kg; fuel_burn_method; fuel_fate_roster_complete_evidence; fuel_uncertainty_kg; fuel_raw_event_ids; fuel_stock_cohort_upstream_refs; fuel_carrier_row_event_crosswalk; fuel_sampling_or_factor_basis; fuel_stock_adjustment_applied; fuel_volume_native; fuel_volume_unit; fuel_density_value; fuel_density_unit; fuel_density_temperature_state; fuel_mass_conversion_evidence; fuel_lower_heating_value_value_unit_source"
      collection_method: "Reconcile signed event records, calibrated meters, supplier tickets, measured geometry/density, testing and recipient receipts; distinguish measurements from estimates and absence evidence. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion. For placement-owned diesel execute placement_fuel_balance: separately measure stock-adjusted supply, burned activity, positive actual usable exits and exclusive actual nonburned fates, with grade/asset/cohort/period ownership, calibrated records and provider coverage. Measure each waste carrier and its fuel constituent separately as nonadditive views, and link any actual release to exact substance/medium. Absence needs occurrence evidence; unknown is not zero or burn. Use fuel_burned_kg and the factor's actual matching mass/energy basis for combustion, and fuel_supply_kg for upstream diesel supply; no second stock or reference normalization. Convert actual liquid volume to fuel mass only with the same cohort's measured/supported density at the recorded temperature/state and explicit compatible units; fuel_mass_kg = measured_volume_m3 * density_kg_per_m3. If native volume is L, measured_volume_m3 = measured_volume_L / 1000. No default density, heating value or unsupported fuel-state conversion."
      unit: "m3; kg; kWh; h; t; km; t*km"
      frequency: "each event/shift; continuous curing log"
      temporal_coverage: "complete pour through cure acceptance"
      site_scope: "declared single site and node"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed tickets; calibration; geometry/test and balance evidence"
    - protocol_id: cp_finishing
      process_id: "finishing"
      flow_role: "all inventory rows in this node"
      record_type: "event ledger, measurements and acceptance"
      raw_fields: "pour_id; event_id; transfer_id; asset_id; operating time; metered or rated power; utilization; consumer share; feed and finished volumes; surface specification; electricity; consumables; residues; actual emission substance/air compartment/particle size; rework events; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Reconcile signed event records, calibrated meters, supplier tickets, measured geometry/density, testing and recipient receipts; distinguish measurements from estimates and absence evidence. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "m3; kg; kWh; h; t; km; t*km"
      frequency: "each event/shift; continuous curing log"
      temporal_coverage: "complete pour through cure acceptance"
      site_scope: "declared single site and node"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed tickets; calibration; geometry/test and balance evidence"
    - protocol_id: cp_curing
      process_id: "curing"
      flow_role: "all inventory rows in this node"
      record_type: "event ledger, measurements and acceptance"
      raw_fields: "pour_id; event_id; transfer_id; asset_id; operating time; metered or rated power; utilization; consumer share; feed volume; accepted net volume; dimensions; voids; cure start/end; water; materials; electricity; tests; acceptance; rejects; actual substance/medium releases; concrete_exchange_id; physical_event_id; actual_identity_id; actual_state; receiver_or_provider_gate; native_quantity; native_unit; unique_property; measurement_method_id; uncertainty"
      collection_method: "Reconcile signed event records, calibrated meters, supplier tickets, measured geometry/density, testing and recipient receipts; distinguish measurements from estimates and absence evidence. Record each actual child/refined exchange independently by identity, physical event, state, gate and period. Retain all original obligations even where a corresponding exchange identity is not yet known. Do not allocate a family total or copy its numerical Range to children, count a carrier and its contained material twice, or turn missing occurrence/quantity/native reference into zero. Each concrete exchange has one property and one unit; other CP readings are auxiliary and require evidenced conversion. Missing required refinement blocks dataset completion."
      unit: "m3; kg; kWh; h; t; km; t*km"
      frequency: "each event/shift; continuous curing log"
      temporal_coverage: "complete pour through cure acceptance"
      site_scope: "declared single site and node"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed tickets; calibration; geometry/test and balance evidence"
  calculation_rules:
    - id: normalize_service
      applies_to: "all inventory rows"
      rule: "Divide each attributable event amount by accepted net in-place volume for the same pour set; report per reference flow. Preserve physical internal transfers before normalization."
      inputs:
        - "attributable event amount"
        - "accepted net volume"
        - cp_placement
        - cp_finishing
        - cp_curing
      output: "amount per reference flow"
      source_ids: []
    - id: receipt_reconcile
      applies_to: "fresh_concrete; returned_fresh_concrete; placement_concrete_waste"
      rule: "Reconcile received fresh volume with placed volume, supplier return, sampled volume, spills/pump residuals and stock change on compatible fresh-state bases; do not equate fresh volume with cured volume without evidence."
      inputs:
        - "delivery tickets"
        - "measured density"
        - "transfer ledger"
        - "return/waste receipts"
        - cp_placement
      output: "reconciliation and residual explanation"
      source_ids: []
    - id: placement_fuel_balance
      applies_to: "placement_diesel; placement_fossil_co2; actual placement-owned fuel fates"
      rule: "For each actual same-grade/cohort, asset, event/period and attributable owner scope, fuel_supply_kg = fuel_opening_kg + fuel_external_receipts_net_kg - fuel_closing_intact_carried_kg. Opening and closing cover every actual custody location on the same basis; receipts exclude tare. This is supply before positive usable return U and transfer X, not burned fuel. Retain source-cohort quantities/upstream references: fuel_stock_adjustment_applied = true, so the stock-burden bridge reconciles this same assignment without another opening charge or closing deduction. Determine fuel_burned_kg from calibrated burned-fuel records, or from the closed balance fuel_burned_kg = fuel_supply_kg - fuel_usable_return_kg - fuel_usable_transfer_kg - fuel_waste_constituent_kg - fuel_uncontained_constituent_kg only when operation evidence and a complete, evidenced exclusive fate roster justify that balance method. If burn is independently metered, compare the same balance residual to actual recorded measurement uncertainty; never silently overwrite burn with the residual. U/X are actual unchanged usable exits accepted by named custodians, not closing stock. Nonreturned fuel in actual waste or an uncontained exit remains in supply burden and retains its own treatment or substance/medium duty. Waste fuel kg is its measured constituent portion of the actual waste carrier, bounded by that carrier mass; the carrier's own exchange quantity includes its real other contents once. Recovered spill fuel belongs to waste, and only the remaining actual uncontained portion belongs to release; an initial spill total is a nonadditive incident diagnostic. No waste carrier, its contained fuel and an initial spill total are counted as separate additive exits. Actual positive U/X carry only matched original fuel upstream burden once; placement work, cleanup and rework stay with the pour set. Provider-included supply/combustion and each shared asset/event have one recorded owner and the original all-consumer attribution once. Unknown fate, upstream coverage, negative balance or unexplained difference blocks completion rather than becoming burn or zero. Outputs are raw kg; normalize each exchange once by the original V. For independently metered burn define fuel_fate_residual_kg = fuel_supply_kg - fuel_usable_return_kg - fuel_usable_transfer_kg - fuel_waste_constituent_kg - fuel_uncontained_constituent_kg - fuel_burned_kg. A zero residual obtained by defining burn as the balance remainder is an algebraic identity, not an independent burn measurement or validation; that branch still requires complete supported nonburned fates and operation coverage."
      inputs:
        - cp_placement
        - fuel_grade_id
        - fuel_cohort_id
        - fuel_asset_id
        - fuel_period_id
        - fuel_scope_owner
        - fuel_provider_inclusion_evidence
        - fuel_opening_kg
        - fuel_external_receipts_net_kg
        - fuel_closing_intact_carried_kg
        - fuel_usable_return_kg
        - fuel_usable_transfer_kg
        - fuel_waste_constituent_kg
        - fuel_uncontained_constituent_kg
        - fuel_burned_metered_kg
        - fuel_burn_method
        - fuel_fate_roster_complete_evidence
        - fuel_uncertainty_kg
        - fuel_raw_event_ids
        - fuel_stock_cohort_upstream_refs
        - fuel_carrier_row_event_crosswalk
        - fuel_sampling_or_factor_basis
        - fuel_stock_adjustment_applied
      output: "fuel_supply_kg; fuel_burned_kg; fuel_fate_residual_kg before normalization"
      source_ids: []
    - id: mobilization_activity
      applies_to: "placement_mobilization_transport"
      rule: "For each loaded leg calculate payload tonnes × actual kilometres, apply its documented consumer share, and sum legs before normalize_service. Retain carrier evidence for empty-return coverage; never multiply an empty load by zero to erase its burden. If using a vehicle-service model, document its compatible t*km conversion and parameters; do not add return/fuel already included in the carrier or hire dataset."
      inputs:
        - cp_placement
        - dispatch_id
        - "payload tonnes"
        - "route kilometres"
        - "consumer share"
        - "carrier empty-return coverage"
        - "model and unit-conversion evidence"
      output: "attributable transport t*km per pour set before normalization"
      source_ids: []
    - id: fossil_carbon_emission
      applies_to: "placement_fossil_co2"
      rule: "Choose one documented combustion method using fuel_burned_kg from placement_fuel_balance, not the supply or stock draw: m_CO2 = fuel_burned_kg × w_fossil_C × f_oxidized_to_CO2 × 44/12. w_fossil_C is kg fossil C per kg of the actual burned fuel, and f is the fraction of that burned fossil carbon emitted as CO2; neither defaults to 1. Alternatively multiply that same actual burned mass, or its energy derived with the matching actual fuel lower heating value, by a reviewed compatible combustion CO2 factor. Retain blend/composition, factor units/source, combustion scope, applicability and uncertainty; do not sum the methods or multiply a complete factor by carbon/oxidation fractions again. Returned, waste or uncontained unburned fuel is not combustion CO2; actual other substances/fates remain separate obligations. Calculate raw pour-set CO2 kg first, then perform normalize_service once."
      inputs:
        - cp_placement
        - placement_fuel_balance
        - fuel_burned_kg
        - "actual burned-fuel fossil-carbon fraction and basis"
        - "oxidation-to-CO2 fraction"
        - "compatible combustion factor value/unit/source"
        - "actual lower heating value if energy conversion is used"
        - uncertainty
      output: "fossil CO2 kg per pour set before normalization"
      source_ids: []
    - id: washout_release_mass
      applies_to: "actual exchanges required by refine_placement_washout_releases"
      rule: "For each verified direct-release event and substance, calculate released volume × concentration after converting both to compatible units (for example m3 × kg/m3), or released liquid mass × measured kg-substance/kg-liquid fraction. Preserve actual receiving compartment, sampling and dissolved/total basis. pH alone cannot determine substance mass. Reconcile captured/treatment/direct-release portions once, then apply normalize_service; missing composition is an explicit gap, not zero."
      inputs:
        - cp_placement
        - "release event"
        - "volume or liquid mass"
        - "concentration and unit"
        - "substance and receiving compartment"
        - "sampling evidence"
        - "containment/treatment split"
      output: "substance kg to actual water or soil compartment per pour set before normalization"
      source_ids: []
    - id: shared_share
      applies_to: "all inventory rows"
      rule: "For a measured shared event, attribute its quantity using the documented consumer share; shares across all consumers sum to 1 and event ownership is unique."
      inputs:
        - event_id
        - asset_id
        - "consumer nodes/runs"
        - "measured activity"
        - cp_placement
        - cp_finishing
        - cp_curing
      output: "attributed event quantities"
      source_ids: []
  data_quality_requirements:
    - id: quality_actual_material_exits
      applies_to: "curing"
      requirement: "The curing collection protocol must separately identify and weigh every actually removed curing sheet, wet cover, compound residue and packaging by its real material, reuse status and destination, as well as discarded concrete/specimens. Reusable retained covers remain stock or asset-service records; actual outward returns and waste exits remain distinct. Water-only or retained-form curing creates no assumed cover or compound. This collection duty is not one selected waste flow; actual distinct materials require distinct concrete exchanges and no automatic recycling credit."
      evidence: "cp_curing"
    - id: gate_traceability
      applies_to: "reference product"
      requirement: "Acceptance evidence must match element, pour, specification, cure regime and net volume; unaccepted quantity stays outside denominator."
      evidence: "signed acceptance; surveyed dimensions; test records"
    - id: inventory_completeness
      applies_to: "all inventory rows"
      requirement: "Record conditional presence, absence evidence and missing-data flags separately. Expand umbrella cards into concrete exchanges and species before publishing a dataset."
      evidence: "purchase records; equipment logs; SDS; waste records"
    - id: quality_fuel_supply_and_fates
      applies_to: "placement; cp_placement; placement_diesel; placement_fossil_co2"
      requirement: "Apply placement_fuel_balance to the actual diesel supply and its fates. Every actual positive usable return/transfer requires its own same-state product exchange; every actual waste carrier requires its own waste exchange, receiver and treatment responsibility; actual uncontained fuel requires independently identified substance/medium exchanges. These are placement-owned conditional refinement duties, not an assumed roster, a pooled flow, diesel-product-as-elementary UUID or zero-default. Each actual exchange has one native property/unit and independently evidenced quantity; fuel kg within a mixed carrier is a nonadditive constituent diagnostic, not its whole carrier quantity. Missing actual identity/quantity/coverage or the necessary concrete cards blocks foreground completion; upstream fuel supply and actual waste handling are retained even when fuel never burns. Supply screening has no established category-wide numerical interval. Independently collect comparable stock-adjusted supply, burned activity, actual unused fates and conversion/measurement uncertainty on the same owner/event/accepted-volume basis. Any future supply interval requires those independent comparable observations; a burned-fuel interval or this batch maximum cannot validate supply."
      evidence: "Grade/cohort stock and burn records; actual custody/fate tickets; native identity and carrier/constituent crosswalk; provider coverage"
    - id: time_coverage
      applies_to: "all processes"
      requirement: "Cover full pours plus associated curing, testing, cleanup and rework, including idle or weather-protection burdens; document exclusions and meter calibration."
      evidence: "run ledger; cure diary; calibration certificates"
    - id: provisional_ranges
      applies_to: "all inventory rows"
      requirement: "Provisional reasoned-estimate ranges are broad review prompts, never defaults or compliance limits. Replace with independent reviewed evidence; do not validate a batch with its own maximum."
      evidence: "independent reference data; uncertainty disclosure"
    - id: refine_placement_plant_service
      applies_to: "placement_plant_service_pump; placement_plant_service_vibrator; placement_plant_service_washout_facility"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella for pump, vibrator and washout infrastructure capital or hired services under the declared study policy, excluding separately recorded operating energy. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Other actual capital/provider study-policy/native references require exact function/property/unit and full-life scope; independently record actual h and time basis, no equipment hours as freight or repeated complete-life burden. Denominator is actual accepted net in-place volume m3."
      evidence: "cp_placement; actual independent records and identity/unit evidence"
    - id: refine_placement_other_air_emissions
      applies_to: "placement_other_air_emissions_carbon_monoxide"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella includes actual CO, nitrogen oxide species, sulfur species or particles only when supported; never select a generic pollutant UUID as all species. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual nitrogen-oxide species/reporting basis, sulfur species, disjoint particles and other actual pollutants/media require independent exact identity/method/quantity; do not guess NO/NO2/SO2 roster or use equivalent reporting as a physical species."
      evidence: "cp_placement; actual independent records and identity/unit evidence"
    - id: refine_placement_washout_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella for verified direct releases from placement-owned chute, pump or tool washout. Establish each actual substance, dissolved/particulate reporting basis and receiving water or soil compartment from event evidence before selecting a concrete elementary flow. Collected slurry sent to a custodian remains placement_wash_slurry; total slurry, pH and a treatment transfer are not pollutant mass. No universal release or absence is assumed. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_placement; actual independent records and identity/unit evidence"
    - id: refine_finishing_consumables
      applies_to: "finishing_consumables_abrasive; finishing_consumables_mortar; finishing_consumables_hardener"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella covers actual abrasives, mortar and hardener only when in the declared package; no assumed recipe or mandatory chemical hardener. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual further product forms/SKUs/chemistries and native references require independent identity/quantity; whole formulation includes constituents once, no assumed recipe or compulsory chemical hardener."
      evidence: "cp_finishing; actual independent records and identity/unit evidence"
    - id: refine_finishing_residues
      applies_to: "finishing_residues_captured_sanding; finishing_residues_rejected_mortar; finishing_residues_spent_abrasive"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Any uncontained sanding dust needs substance and size-specific elementary air records rather than being hidden in waste mass. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual other correction materials, combined-mixture/hazard/receiver states need independent exact records; uncontained sanding particles require actual species/size air release, not hidden waste."
      evidence: "cp_finishing; actual independent records and identity/unit evidence"
    - id: refine_finishing_actual_air_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella expands species from actual finishing consumables and operations. Sanding requires dust substance and size; evaporation requires actual chemical composition rather than a generic VOC identity. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_finishing; actual independent records and identity/unit evidence"
    - id: refine_curing_materials
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella is not a fixed material: water-only or retained-form curing must not be assigned a fictitious compound. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual independent curing protection formulation/sheet/other SKU/native unit/quantity and instruction activation. Any actual removed curing-material usable return or waste needs correct state/direction/type/receiver/native-unit exchange, not rejected concrete or air by default; unknown occurrence not zero."
      evidence: "cp_curing; actual independent records and identity/unit evidence"
    - id: refine_curing_actual_releases
      applies_to: "actual independently refined exchanges"
      requirement: "Preserve this actual collection and closure scope as a mandatory dataset-production requirement: Conditional umbrella must be expanded by substance and air/water/soil medium. Washwater sent to treatment remains waste, not an automatic direct discharge. Independently establish every actual identity, state, real provider/receiver and exactly one exchange property/unit before constructing its flow card. Each actual exchange requires its own recorded quantity and applicable method, uncertainty and custody/fate coverage. Auxiliary CP units do not authorize extra exchange views. Actual occurrence unknown is not zero; never invent a material/species/provider list or split a parent total. Quantitative screening evidence must fit each actual exchange; a former family interval cannot be copied or divided into child ranges. Further actual identities not fully specified by the conditional children require mandatory refinement and prevent dataset completion; this requirement is not itself a flow exchange. Actual substance, disjoint particle-size fraction and air/water/soil receiving compartment; matched measurement or species/activity factor, whole-fluid composition/fate audit, capture and uncertainty; unknown is not zero."
      evidence: "cp_curing; actual independent records and identity/unit evidence"
    - id: atomic_exchange_identity_unit
      applies_to: "all inventory rows"
      requirement: "Each concrete flow card identifies exactly one actual independently supplied product/SKU/formulation, complete assembly, complete single-function or genuine complete bounded provider service, actual waste composite/state/receiver, or substance/size/receiving medium, with exactly one property and unit. Different actual identities require independent quantities and records, not a summed family exchange. A complete product/carrier includes its contents once. Same unchanged SKU/state usable supply/return pairs and matched physical internal send/receive pairs use the same selected property/unit; kg and count or MJ and kWh auxiliaries are nonadditive measurements, never duplicate exchanges. Missing identity/occurrence/quantity/native reference is a gap, not zero. Any pooled denominator retains original configuration strata, accepted state/gate and actual causal attribution; no unlike jobs/branches/routes treated as equivalent."
      evidence: "actual identity, unit, custody and independent quantity evidence"
    - id: asset_final_normalization_once
      applies_to: "all inventory rows"
      requirement: "An asset-equivalent formula already ending in division by N, D or A is the final quantity per reference flow. Its complete-life fraction and accepted-output normalization constitute the same normalization operation as the general normalization rule; never divide it by that denominator again. Apply the complete-life upstream burden exactly once. Actual complete provider event counts remain event quantities, not owned-asset fractions."
      evidence: "actual identity, unit, custody and independent quantity evidence"
