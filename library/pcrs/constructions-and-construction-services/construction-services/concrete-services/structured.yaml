    type: "official_guidance"
    reference: "UNSD CPC 2.1 54540 explanatory note; https://unstats.un.org/unsd/classifications/Econ/Detail/EN/1074/54540"
    used_for: "Supporting classification interpretation only; not a CPC 3.0 explanatory text or quantitative source."
