  unresolved_flow_identities:
    - row_id: support_pile
      flow_name: Fabricated steel sheet pile for excavation support
      reason: Steel/rebar/plate candidates do not identify a fabricated sheet pile and its actual supply/reuse gate.
    - row_id: backfill
      flow_name: Imported uncontaminated mineral soil for tunnel backfill
      reason: Bounded public candidates do not establish the specified substance, supplied state, route and gate; retain specific identity pending verification.
    - row_id: rock_bolt
      flow_name: Finished steel rock bolt
      reason: Bounded public candidates do not establish the specified substance, supplied state, route and gate; retain specific identity pending verification.
    - row_id: steel_rib
      flow_name: Fabricated steel tunnel support rib
      reason: Hot-rolled rebar and pile-column candidates do not establish fabricated tunnel support rib configuration.
    - row_id: wet_shotcrete
      flow_name: Wet-mix shotcrete before spraying
      reason: Bounded public candidates do not establish the specified substance, supplied state, route and gate; retain specific identity pending verification.
    - row_id: bentonite
      flow_name: Bentonite powder for tunnel slurry
      reason: Bounded public candidates do not establish the specified substance, supplied state, route and gate; retain specific identity pending verification.
    - row_id: conditioning
      flow_name: Aqueous sodium alkyl ether sulfate soil-conditioning concentrate
      reason: Sodium lauryl ether sulfate hits are environmental emission identities, not supplied aqueous concentrate with its actual concentration.
    - row_id: tbm_share
      flow_name: Complete tunnel boring machine manufacturing share
      reason: Metalworking boring machines, carbide tools and generic equipment packages are not a complete configured tunnel boring machine; count-based manufacturing-share input needs actual count and supported cumulative activity.
    - row_id: immersed_element
      flow_name: Prefabricated reinforced-concrete immersed tunnel element
      reason: Trench remediation/gate and generic concrete candidates do not establish a complete reinforced-concrete immersed tunnel element.
    - row_id: seal
      flow_name: Rubber immersion-joint sealing gasket
      reason: Generic sealing elements/metal-sheet gaskets do not verify actual immersion-joint rubber formulation/profile.
    - row_id: bed_stone
      flow_name: Crushed granite foundation bedding aggregate
      reason: Gravel sand, artificial stone and generic rock do not establish crushed granite bedding lithology/grade/state.
    - row_id: dredged_sediment
      flow_name: Dredged mineral sediment sent for disposal
      reason: Bounded public candidates do not establish the specified substance, supplied state, route and gate; retain specific identity pending verification.
    - row_id: jacked_box
      flow_name: Prefabricated reinforced-concrete jacked tunnel box
      reason: Grouting curtain, generic concrete and floor slab do not identify a complete reinforced-concrete jacked tunnel box.
    - row_id: concrete
      flow_name: Ready-mixed concrete before tunnel placement
      reason: Public concrete candidates represent prefabricated components, installed work or a soil-remediation case; no verified fresh ready-mix gate adopted.
    - row_id: rebar
      flow_name: Finished reinforcing steel bar for tunnel concrete
      reason: First Steel rebar candidate is wind-farm-specific; hot-rolled alloy identity does not cover every supplied rebar shape/grade.
    - row_id: segment
      flow_name: Precast reinforced-concrete tunnel lining segment
      reason: Bounded public candidates do not establish the specified substance, supplied state, route and gate; retain specific identity pending verification.
    - row_id: grout
      flow_name: Cementitious tunnel annulus grout before injection
      reason: Bounded public candidates do not establish the specified substance, supplied state, route and gate; retain specific identity pending verification.
    - row_id: membrane
      flow_name: Finished PVC tunnel waterproofing membrane
      reason: Bounded public candidates do not establish the specified substance, supplied state, route and gate; retain specific identity pending verification.
    - row_id: drainpipe
      flow_name: Perforated HDPE tunnel drainage pipe
      reason: Generic plastic and PVC pipe candidates do not establish perforated HDPE drainage-pipe specification.
    - row_id: fan
      flow_name: Complete tunnel jet ventilation fan
      reason: Domestic fan, heater/blower assemblies and combined fan/centrifuge product do not establish complete tunnel jet-fan model/configuration.
    - row_id: pump
      flow_name: Complete tunnel drainage pump
      reason: Generic Pump has Mass reference; actual complete drainage-pump count-to-mass/configuration relationship not evidenced.
    - row_id: light
      flow_name: Complete LED tunnel luminaire
      reason: Initial lighting search chemical hits do not identify a complete configured tunnel luminaire; retained lookup gap is bounded, not a database absence claim.
    - row_id: mains_water
      flow_name: Treated mains water supplied to tunnel construction site
      reason: HK treatment-plant Volume tap-water identity is not arbitrary site-delivered water; actual supply geography/gate must match.
    - row_id: soil_waste
      flow_name: Uncontaminated excavated mineral soil sent for disposal
      reason: Excavated soil is Product flow/Volume; remediation-site/service identities are not uncontaminated soil disposal waste at site gate.
    - row_id: rock_waste
      flow_name: Excavated rock sent for disposal
      reason: Landfill/slag/explosive/brick candidates do not identify excavated rock disposal waste.
    - row_id: slurry_waste
      flow_name: Spent bentonite tunnel excavation slurry sent for treatment
      reason: Injection mud and petroleum water-based drill-cuttings/sludge routes do not verify bentonite tunnel-slurry waste.
    - row_id: concrete_waste
      flow_name: Hardened concrete construction offcut
      reason: Construction waste disposal service and mixed construction waste do not establish segregated hardened concrete offcut.
    - row_id: washout
      flow_name: Contained concrete washout liquid sent for treatment
      reason: Public wastewater route is manganese-slag material washing, not concrete washout; contained liquid transfer differs from emissions.
    - row_id: oil_waste
      flow_name: Spent PAO lubricating oil sent for treatment
      reason: PAO lubricant product, POY oil and generic lubricants do not verify spent PAO oil sent for treatment.
    - row_id: reference_tunnel
      flow_name: Completed tunnel construction delivery unit
      reason: Tunnel candidate is maintenance service with CTUe reference, not physical construction delivery; no applicable product UUID verified.
  limitations:
    - Candidate authored methodology; independent scientific review pending; not publication or engineering approval.
    - Site construction-to-acceptance foreground, not automatically complete cradle-to-gate or full lifecycle.
    - All CPC transport tunnel routes retained conditionally; project inventories must add every actual chemical/component/process absent from illustrative cards.
    - Historical highway civil manual supports qualitative routes only; actual railway-related work requires project-specific design/acceptance and system interfaces.
    - No default mass, length, mix ratio, lifespan, density, energy, emission factor or asset manufacturing share.
    - Unknown equipment cumulative activity/asset shares, unmeasured releases and unresolved identities require explicit dataset-level review; machine check does not establish scientific approval.
