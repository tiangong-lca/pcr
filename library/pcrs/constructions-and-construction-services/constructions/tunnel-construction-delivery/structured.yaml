allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "foreground_burden_allocation"
    rule: "First subdivide records by work package, bore, route and delivery. Attribute shared electricity, haul and pumping by causal metered energy, measured transported mass-distance or actual pumping activity. Collect the real activity and all beneficiaries; no allocation by arbitrary project cost or default tunnel length. Retain formula, physical units and uncertainty."
    source_ids: []
  - rule_id: allocation_reuse
    applies_to: "foreground_burden_allocation"
    rule: "For machines and reusable piles/formwork, use supported cumulative activity or reuse history of the same asset to assign a dimensionless share of manufacturing burdens. Sum of prior, current and future assigned shares must not exceed one; never reset the full burden per project. Actual machine mass/count, net configuration and ledger are collected separately; missing lifespan/activity denominator stays review, not assumed zero. Keep maintenance and consumption separate."
    source_ids: []
  - rule_id: allocation_excavation
    applies_to: "foreground_burden_allocation"
    rule: "Reconcile excavation volume/mass, internal reuse, off-site reuse/sale, disposal and stock by material and moisture. Excavated rock/soil is not automatically a co-product or a credit. If real co-production remains after subdivision, justify a physical causal allocation with receiving-product evidence; economic fallback needs actual values and sensitivity review. No default avoided landfill or virgin aggregate credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_delivery
      process_id: "acceptance"
      flow_role: "accepted physical tunnel"
      record_type: "foreground_record"
      raw_fields: "contract/site; as-built length, bores, sections, routes, quantities, systems; inspection and acceptance; start/end dates; interfaces"
      collection_method: "Reconcile signed completion/acceptance, measured as-built survey and component schedule for the same complete delivery; no assumed geometry or lifespan"
      unit: "item; m; m2; m3"
      frequency: "each task, batch or event and delivery reconciliation"
      temporal_coverage: "actual construction start through acceptance including rework"
      site_scope: "same declared site/delivery boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw tickets, as-built survey, certificates and scope reconciliation"
    - protocol_id: cp_materials
      process_id: "all_foreground_processes"
      flow_role: "each separate supplied material/component"
      record_type: "foreground_record"
      raw_fields: "row_id; supply identity/state/composition; quantity; batch; concentration; grade; included components; receipt/return/stock; unit; density/linear mass where used"
      collection_method: "Use calibrated delivery measurements and supplier certificates; reconcile installed quantities and losses; each actual chemical/component is independent, including additional actual site-mixed constituents"
      unit: "kg; m3; item; m"
      frequency: "each task, batch or event and delivery reconciliation"
      temporal_coverage: "actual construction start through acceptance including rework"
      site_scope: "same declared site/delivery boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw tickets, as-built survey, certificates and scope reconciliation"
    - protocol_id: cp_blasting
      process_id: "mined"
      flow_role: "emulsion explosive"
      record_type: "foreground_record"
      raw_fields: "charge kg; blast ID; holes; explosive specification; returns; misfire; detonator/fuse specification; ventilation and fume control"
      collection_method: "Reconcile actual authorized blast logs and stock balance; no presumed charge per metre or universal emission factor"
      unit: "kg"
      frequency: "each task, batch or event and delivery reconciliation"
      temporal_coverage: "actual construction start through acceptance including rework"
      site_scope: "same declared site/delivery boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw tickets, as-built survey, certificates and scope reconciliation"
    - protocol_id: cp_energy
      process_id: "site_operation"
      flow_role: "diesel; electricity and actual additional carriers"
      record_type: "foreground_record"
      raw_fields: "row_id; equipment/task; tank/meter ID; energy/fuel; region; voltage; provider; dates; returns/stocks; activity; density/heating value basis"
      collection_method: "Use calibrated meter and fuel records per task, including standby, ventilation, slurry separation, towing and tests; reconcile submeter totals without double counting"
      unit: "kg; MJ"
      frequency: "each task, batch or event and delivery reconciliation"
      temporal_coverage: "actual construction start through acceptance including rework"
      site_scope: "same declared site/delivery boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw tickets, as-built survey, certificates and scope reconciliation"
    - protocol_id: cp_water
      process_id: "site_operation"
      flow_role: "supply; abstraction; drainage; contained liquid"
      record_type: "foreground_record"
      raw_fields: "row_id; origin; aquifer/recipient; salinity; meter; volume; reuse; ingress/rain; treatment; sampling; concentration; exports"
      collection_method: "Meter supply, abstraction and discharge separately; use actual representative sampling for released species and separate contained waste; do not assume all ingress is resource consumption or clean drainage"
      unit: "m3; kg"
      frequency: "each task, batch or event and delivery reconciliation"
      temporal_coverage: "actual construction start through acceptance including rework"
      site_scope: "same declared site/delivery boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw tickets, as-built survey, certificates and scope reconciliation"
    - protocol_id: cp_waste
      process_id: "site_operation_immersed"
      flow_role: "each separate physical waste stream"
      record_type: "foreground_record"
      raw_fields: "row_id; process; classification; composition; moisture; calibrated weight; destination; receiver; internal reuse; stock"
      collection_method: "Reconcile weighbridge/receiver evidence per stream; distinguish contaminated soil, sediment, hardened concrete and liquid slurry; no mixed waste label substitutes for actual exchanges"
      unit: "kg"
      frequency: "each task, batch or event and delivery reconciliation"
      temporal_coverage: "actual construction start through acceptance including rework"
      site_scope: "same declared site/delivery boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw tickets, as-built survey, certificates and scope reconciliation"
    - protocol_id: cp_emissions
      process_id: "site_operation"
      flow_role: "each actual elementary substance"
      record_type: "foreground_record"
      raw_fields: "row_id; species/CAS; fossil/biogenic; medium/submedium; timing; concentration; flow/duration; actual activity; control; model/factor source; uncertainty"
      collection_method: "Use representative actual measurements or traceable site/equipment-specific models; distinguish portal/environment release from indoor exposure, captured fractions and total NOx; retain missing scope"
      unit: "kg"
      frequency: "each task, batch or event and delivery reconciliation"
      temporal_coverage: "actual construction start through acceptance including rework"
      site_scope: "same declared site/delivery boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw tickets, as-built survey, certificates and scope reconciliation"
    - protocol_id: cp_assets
      process_id: "all_foreground_processes"
      flow_role: "reusable machine/component manufacturing shares"
      record_type: "foreground_record"
      raw_fields: "asset ID; actual count/net mass and configuration; manufacturing scope; project activity; supported cumulative activity/use history; prior/current shares; remaining shares; repair ; support_pile new/previously-used status; permanent/consumed versus reusable portion; physical receipts/returns/closing stock/incorporation/loss; prior assigned manufacture"
      collection_method: "Reconcile same-asset cross-project ledger and supplier records; audit cumulative shares ≤1; unknown denominator or physical conversion requires review without resetting full manufacture  For support_pile, reconcile new-consumed material through cp_materials separately from reusable/previously-used asset mass times its conserved share; a returned reusable pile retains this project manufacturing share. A formerly used pile retained or lost may receive only a justified remaining share, never fresh full manufacture. Prevent duplicate attribution between branches and retain physical movements separately."
      unit: "item; kg; h"
      frequency: "each task, batch or event and delivery reconciliation"
      temporal_coverage: "actual construction start through acceptance including rework"
      site_scope: "same declared site/delivery boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw tickets, as-built survey, certificates and scope reconciliation"
  calculation_rules:
    - id: delivery_basis
      applies_to: "all inventory rows"
      rule: "Aggregate each atomic exchange attributable to the same accepted delivery; report per declared reference flow, preserving each numerator unit. No arbitrary division by mass, kilometre or lifetime."
      inputs:
        - cp_delivery
        - cp_materials
        - cp_blasting
        - cp_energy
        - cp_water
        - cp_waste
        - cp_emissions
      output: "exchange quantity per declared reference flow"
      source_ids: []
    - id: complete_output
      applies_to: "reference_tunnel"
      rule: "One complete accepted declared entity = 1 item; incomplete/rejected work is not accepted output, but its attributable burden is retained."
      inputs:
        - cp_delivery
      output: "reference_tunnel"
      source_ids: []
    - id: physical_conversion
      applies_to: "all inventory rows"
      rule: "Use section 4 with actual matching-batch physical records; retain source quantity, units, measured density/linear mass/concentration and temperature, formula and uncertainty. Unsupported relationships remain review."
      inputs:
        - cp_materials
        - cp_energy
        - cp_water
        - cp_emissions
      output: "traceable numerator quantities"
      source_ids: []
    - id: asset_attribution
      applies_to: "support_pile; tbm_share"
      rule: "Apply section 7 same-asset manufacturing shares to tbm_share and the reusable or previously used portion of support_pile: measured asset count or net mass × evidenced dimensionless share based on supported cumulative activity. Conserve cumulative assigned manufacture ≤1 across all projects/periods; physical return does not set the share to zero, and later retention/loss never resets full manufacture. The new permanently incorporated/consumed support_pile portion follows its separate cp_materials stock balance, not this asset-use formula. Do not replace an unknown denominator or prior ledger with a default."
      inputs:
        - cp_assets
      output: "attributed manufacturing contribution and limitations"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Verify substance, composition, route, geography, voltage, gate, physical state, compartment and original reference property/unit; UUID name alone is insufficient."
      evidence: "supplier certificates and public identity originals"
    - id: coverage
      applies_to: "all foreground processes"
      requirement: "Reconcile every actual work package and installed component, temporary construction and removal, energy, water, loss, waste and release. Add actual atomic rows not in these conditional examples; distinguish absent, excluded and unmeasured."
      evidence: "bill of quantities and gap ledger"
    - id: time_ground
      applies_to: "all inventory rows"
      requirement: "Match actual construction dates, ground/hydrogeology and site supply; historical manual is qualitative process context only, not a current statutory specification or generic factor."
      evidence: "ground records, dates and certificates"
    - id: noise
      applies_to: "site_operation"
      requirement: "Collect actual construction noise/vibration monitoring, location and duration separately. dB is not an additive physical mass or sound-energy exchange; without supported property relationship disclose non-LCI evidence and coverage."
      evidence: "environmental monitoring and site records"
    - id: uncertainty
      applies_to: "all inventory rows"
      requirement: "Keep measurement, conversion, allocation and background-link uncertainty; no missing-data-to-zero substitution. Retain unresolved identities and unsupported shares for independent review."
      evidence: "calibration, sensitivity and evidence ledger"
validation_rules:
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Reference product name equals reference_tunnel selected flow; 1 item represents the same complete accepted delivery in cp_delivery and all inventory bases; geometry and system interfaces are explicit."
    source_ids: []
  - rule_id: validate_routes
    applies_to: "foreground_dataset_conformance"
    rule: "Actual construction records determine all route conditions; do not replace tunnel scope with a smaller material or easier geography to match identity. Ground improvement, dry/wet spraying, lining and jacking differences retain complete actual inventories."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile excavation, reuse, import, disposal, moisture and stock; supplied materials, installed quantities and losses; pump water balance and energy meters; same-asset shares across projects ≤1."
    source_ids: []
  - rule_id: validate_emission
    applies_to: "foreground_dataset_conformance"
    rule: "NO, NO₂ and N₂O, PM10 and larger particles, fossil and biogenic carbon, environmental abstraction and waste/discharge are distinct. Verify actual release and medium; no presumed emission factors or indoor-to-environment conversion."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "foreground_dataset_conformance"
    rule: "Missing identity, measurement, tasks, unsupported conversions/shares and separately excluded lifecycle stages remain explicit gaps. Mechanical check success does not approve methodology or engineering acceptance."
    source_ids: []
