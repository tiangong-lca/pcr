measurement_rules:
  - id: delivery_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "item"
    rule: "Use 1 item for one complete accepted declared tunnel entity; collect using cp_delivery. Every exchange uses the same delivery boundary."
  - id: geometry
    applies_to: "reference product"
    required_property_ref:
      name: "Length; Area; Volume"
      uuid: ""
    required_unit: "m; m2; m3"
    rule: "Collect measured as-built centreline lengths, sections and installed extents; preserve bore/route segmentation. Do not convert an asset count to mass or length without actual scope and measurement evidence."
  - id: numerator_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual selected reference property"
      uuid: ""
    required_unit: "row-specific unit"
    rule: "Keep mass, volume, length, count and energy distinct. Density, linear mass, concentration and heating value must come from actual matching batches and state/temperature; no nominal 1000 kg/m3 water density or generic concrete density. Preserve public flow reference properties."
  - id: energy_conversion
    applies_to: "power_lv; power_mv"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "1 kWh = 3.6 MJ; preserve the original energy-property identity, not Mass. Diesel is separately measured in kg and fuel heat does not imply electricity output."
