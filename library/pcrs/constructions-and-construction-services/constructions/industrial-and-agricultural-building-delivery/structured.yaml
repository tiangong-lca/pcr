allocation_rules:
  - rule_id: avoid_allocation
    applies_to: "all inventory rows"
    rule: "Separate directly attributable records by building, stage and contractor first. For genuinely shared site utilities use measured causal activity, time or another justified physical driver; retain denominator, covered projects and uncertainty. Economic allocation needs explicit review when no physical relation can be evidenced."
    source_ids:
      - ghg-allocation-2011
  - rule_id: asset_conservation
    applies_to: "utilities; concrete; frame"
    rule: "Equipment manufacture, scaffolds, bracing and reusable formwork are charged only by the justified share in cp_asset. Across all projects, periods and reuses cumulative manufacture-burden shares must not exceed one; retain residual and reconcile forecast service. Unknown lifetime/cumulative service requires review and disclosure; no full manufacture reset for each building."
    source_ids:
      - rics-wlca-2024
  - rule_id: waste_no_credit
    applies_to: "waste"
    rule: "Keep actual exported waste and treatment/recovery burdens distinct from the accepted building output. Do not credit future avoided steel/concrete production by default; reuse/recycling substitutions require separately evidenced routes and consistent boundary without duplicate credit."
    source_ids:
      - rics-wlca-2024
dataset_production:
  collection_protocols:
    - protocol_id: cp_ground
      process_id: "ground"
      flow_role: "Individual actual exchange or reference acceptance"
      record_type: "foreground_records"
      raw_fields: "Site id; excavation boundaries; geology/contamination; bank/loose volumes; grading; moisture; weighbridge tickets; reuse and export destinations ; where supplied materials/assemblies occur: identity-specific gross receipts, opening/closing usable stock, verified returns/transfers, consumed damage/rejects/replacements and separate accepted installation"
