  classification_refs: "CPC 3.0 53121 — Industrial buildings"
  covered_products: "Accepted industrial-production/assembly buildings and agricultural buildings including storage silos, with project-specific complete delivery scope"
  excluded_products: "CPC excluded specialized facilities; building-service contracts; material kits; production equipment; other occupancy classes"
  representative_product: "One accepted factory/workshop building or one accepted agricultural building/silo of an explicitly surveyed configuration"
  production_route: "Actual site preparation, foundations, load-bearing erection or shell assembly, enclosure, fixed services, commissioning and handover; route-specific atomic rows"
  market_state: "Completed on its declared site and signed over in the specified construction/fit-out condition, without an assumed production operation period"
functional_unit:
  what: "Deliver the building enclosure/structure and declared fixed services for the documented industrial or agricultural function"
  how_much: "One complete accepted entity; report surveyed gross/internal/useful areas with explicit definitions, number of levels, clear height and actual dimensions; for silo declare usable storage volume/capacity and contents basis without default bulk density"
  how_well: "As-built structural system, actual design/performance records, enclosure, industrial floor requirements and installed service/acceptance scope; no generic design loads or compliance approval"
  how_long_or_cycle: "One actual construction-to-handover event with start/end dates; operational service life is outside this reference and must be source-supported in later scenarios"
  reference_flow_link: "reference_building"
system_boundary:
  rules:
    - rule_id: construction_gate
      applies_to: "dataset"
      rule: "Collect each actual foreground work package through accepted handover; the inventory is construction-focused, not automatically complete cradle-to-gate. Upstream products carry their own manufacturing burden rather than copied manufacture into site work."
      source_ids:
        - rics-wlca-2024
    - rule_id: route_completeness
      applies_to: "all inventory rows"
      rule: "Process and flow examples are conditional, not a universal bill. Add every actually used atomic cement, aggregate, additive, panel, joint/grout, fixing, membrane, service component and waste for the real design. Do not drop industrial/agricultural routes because their identities are unresolved."
      source_ids:
        - jrc-levels-boq-2021
        - un-cpc-3-53121
    - rule_id: boundary_consumed_inputs
      applies_to: "permanent/consumed supplied materials and assemblies; excludes reusable-asset manufacture"
      rule: "Local installed, delivered, commissioned or as-built wording specifies the intended route/configuration and acceptance evidence; it does not exclude attributable materials or assemblies consumed in attempted installation, damage, rejected-and-scrapped work or replacements before acceptance. In each native unit, consumed input = attributable gross receipts + opening stock - verified returns/transfers - closing usable stock. Retain actual supplied identity/configuration and assembly inclusions, with failed/replaced items traced to their own identity rather than the final replacement identity. Reconcile accepted installation and waste separately. Verified returns/usable surplus are excluded from consumption, but their attributable transport/handling/rework remains. This equation does not measure reusable equipment/formwork manufacture: retain section 7 conserved lifetime-use shares even when assets are returned/transferred/held in closing stock, and never charge the same asset as both full consumption and a use share."
      source_ids: []
    - rule_id: environment_gate
      applies_to: "utilities; waste"
      rule: "Distinguish supplied water, direct resource intake, dewatering, contained washwater, treated discharge and each measured emission constituent. Construction noise/vibration/land and unmeasured constituents require explicit assessment/disclosure, not invented mandatory exchanges. Direct combustion and generator supply must not double count."
      source_ids:
        - epa-concrete-washout-2012
        - epa-construction-dust-2010
boundary_abstraction:
  declared_starting_condition: "Actual documented site condition plus supplied construction products/equipment at explicitly named supplier or site gates before installation"
  starting_condition_role: "foreground_starting_point"
  product_classification_scope: "Industrial/agricultural delivered building entity within the stated inclusions/exclusions"
  recursive_input_rule: "A reused same-category building or shell is recorded once at its actual received state/gate; expose residual inherited burdens and refurbishment work, do not recursively recreate its full construction inventory"
  upstream_dataset_requirement: "Compatible A1–A3 material/component manufacture and actual A4 delivery links must be supplied separately and checked for included transport/site processes; missing links preclude complete cradle-to-handover claim"
  disclosure: "Site preparation and pre-existing demolition; product/manufacture gates; construction phases and temporary works; actual transport, fixed services, commissioning; later use, maintenance/replacement, final demolition, treatment and module D excluded"
