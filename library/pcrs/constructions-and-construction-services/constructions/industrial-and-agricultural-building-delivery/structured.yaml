  calculation_rules:
    - id: project_reconciliation
      applies_to: "all inventory rows"
      rule: "Retain actual attributable totals in each row unit per declared reference flow. Reconcile receipts, returns, stock changes, installed quantities and exported waste by physical identity. Internal recirculation is not a new external input. No default recipe, loss factor, mass per building or service life.  Apply boundary_consumed_inputs to permanent/consumed supplied materials and assemblies, including pre-acceptance losses and replacements in each actual native unit; installed acceptance is not the consumption numerator. Keep reusable-asset manufacture under the separate cumulative-share ledger."
      inputs:
        - cp_ground
        - cp_concrete
        - cp_frame
        - cp_envelope
        - cp_silo
        - cp_services
        - cp_utilities
        - cp_waste
        - cp_acceptance
      output: "Actual exchange totals per declared reference flow"
      source_ids:
        - jrc-levels-boq-2021
    - id: unit_preservation
      applies_to: "diesel; lv_electricity; mv_electricity; road_freight"
      rule: "Apply energy_identity and transport_basis only to input numerator units while preserving the declared reference flow. Keep measured density/LHV and actual transport legs with the dataset; geometry is reported as configuration, not an unproved output conversion."
      inputs:
        - cp_utilities
        - cp_transport
      output: "MJ or t*km per declared reference flow"
      source_ids: []
  data_quality_requirements:
    - id: complete_entity
      applies_to: "dataset"
      requirement: "Acceptance scope, function, actual geometry, structural system, industrial floor and fixed service schedule must agree; assess agricultural storage-specific shell/capacity requirements. All absent/missing work packages are explicit; example rows do not prove complete inventory."
      evidence: "cp_acceptance; cp_silo"
    - id: measurement
      applies_to: "all inventory rows"
      requirement: "Original readings, tickets and subcontractor records cover the whole project and actual states. Report uncertainty and estimates separately; missing measurements never become zero."
      evidence: "all collection protocols"
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Verify public identity, main reference property, unit group, route, geography and official bilingual flow display; mass/volume/energy are distinct. Blank identities retain exact rows and block unsupported linkage."
      evidence: "supplier/state records; identity evidence"
    - id: environment
      applies_to: "utilities; waste"
      requirement: "Document actual fossil/biogenic share, CAS, medium/submedium, immediate/long-term and particle fraction. Assess actual noise, land use, dewatering and washwater/discharge routes; disclose unmeasured coverage and add specific measured exchanges when required."
      evidence: "cp_environment; cp_waste"
validation_rules:
  - rule_id: validate_scope
    applies_to: "dataset"
    rule: "Require a whole accepted industrial/agricultural building or silo within the official exclusions, actual site/function/geometry and delivery state. Reject substitution by a building service, material bundle or specialized excluded facility."
    source_ids:
      - un-cpc-3-53121
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Reference table, reference_building output and every row/protocol denominator must agree with one declared entity. Check physically compatible numerator property/unit and supported measured conversions; no false kg building mass or assumed capacity relation."
    source_ids: []
  - rule_id: validate_complete
    applies_to: "dataset"
    rule: "Check every actually occurring material, process, temporary work, utility, waste and release, including contractor work and commissioning. Missing identities, quantities or stages are declared gaps, not zero; no full cradle-to-gate/full-lifetime claim with missing upstream or later stages."
    source_ids:
      - rics-wlca-2024
  - rule_id: validate_asset
    applies_to: "utilities; concrete; frame"
    rule: "Reconcile shared-equipment/formwork manufacture shares across all projects and periods, cumulative total at most one; review unknown service denominator and ensure direct operation is not charged twice."
    source_ids:
      - ghg-allocation-2011
  - rule_id: validate_environment
    applies_to: "utilities; waste"
    rule: "Require quantified evidence and compatible CAS, source, medium and submedium; distinguish NO and NO2 and retain waste-vs-discharge routing. Never claim methodology or legal approval from a projection/check result."
    source_ids:
      - epa-concrete-washout-2012
      - epa-construction-dust-2010
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Construction-to-handover inventory of the declared complete industrial/agricultural building; compatible linked upstream scenarios; comparisons only with matched actual function, geometry, delivery scope and performance"
  excluded_use: "Full lifetime, default annual industrial operation, process-plant equipment inventory, generic kg/m2 building conversion, default capacity/density/life or legal/scientific approval"
  required_metadata: "All reference qualifiers, construction dates, actual route, work-package coverage, installed and excluded machinery scope, supplier/stage gates, measured geometry/capacity basis, allocations and property/unit evidence"
  required_quality_disclosure: "Measurement/estimate uncertainty, site/time/technology representativeness, missing upstream/background links, identity gaps, unmetered stages, environmental coverage and later-stage exclusions"
  update_trigger: "Changed function, structure, geometry, storage basis, fixed-services/delivery scope, site/supplier route, measured inventory or evidence/identity"
data_sources:
  - id: "un-cpc-3-53121"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0, subclass 53121 explanatory note. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/53121"
    used_for: "Category inclusions/exclusions only; not a construction recipe."
  - id: "bcsa-steel-buildings-2003"
    type: "handbook"
    reference: "BCSA, Steel Buildings, publication 35/03 (2003), chapter 3, printed pp.37–41 / PDF pp.49–53. https://www.steelconstruction.info/images/0/03/BCSA_35-03.pdf"
    used_for: "Historical UK steel building anatomy, erection and dimensional interpretation only; no default rates, loads, dimensions or contemporary code conformity. Not universal across industrial buildings."
  - id: "sukup-grain-bins-2026"
    type: "handbook"
    reference: "Sukup Manufacturing Co., Grain Bins, L1132-042026Su ©2026, PDF pp.3 and 9. https://www.sukup.com/assets/brochures/Grain-Bins.pdf"
    used_for: "Manufacturer-specific steel agricultural silo connection/sealing and foundation interface; no universal capacities, grades or design loads."
  - id: "jrc-levels-boq-2021"
    type: "official_guidance"
    reference: "European Commission JRC, Level(s) indicator 2.1 v1.1, January 2021, PDF/printed pp.16 and 23–24, Table 2. https://susproc.jrc.ec.europa.eu/product-bureau/sites/default/files/2021-01/UM3_Indicator_2.1_v1.1_34pp.pdf"
    used_for: "Source framework covers office and residential buildings; adapt only its as-built quantity/reconciliation method, not category coverage or a material recipe, to actual industrial/agricultural work. Industrial special elements require project evidence; no claim of Level(s) conformity."
  - id: "rics-wlca-2024"
    type: "standard"
    reference: "RICS, Whole life carbon assessment for the built environment, 2nd edition version 3 August 2024, section 5.1.4 printed pp.80–84 / PDF pp.88–92. https://www.rics.org/content/dam/ricsglobal/documents/standards/Whole_life_carbon_assessment_PS_Sept23.pdf."
    used_for: "Construction-stage separation and project-specific evidence; no default factors or full WLCA compliance claim."
  - id: "epa-construction-dust-2010"
    type: "official_guidance"
    reference: "US EPA AP-42 13.2.3 Heavy Construction Operations, January 1995 corrected February 2010, p.13.2.3-1. https://www.epa.gov/sites/default/files/2020-10/documents/13.2.3_heavy_construction_operations.pdf"
    used_for: "Historical qualitative dust/operation/moisture relationship only; no generic emissions or fixed emission factor."
  - id: "epa-concrete-washout-2012"
    type: "official_guidance"
    reference: "US EPA, Stormwater Best Management Practice Concrete Washout, EPA-833-F-11-006 February 2012, PDF pp.1–2. https://www.epa.gov/sites/default/files/2015-11/documents/concretewashout_0.pdf"
    used_for: "Separate captured washwater and solids from environmental release; no local legal approval or automatic discharge assumption."
  - id: "ghg-allocation-2011"
    type: "official_guidance"
    reference: "WRI/WBCSD Product Life Cycle Accounting and Reporting Standard 2011, chapter 9 printed p.63 / PDF p.65, Tables 9.1–9.2. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Historical allocation hierarchy only; actual causal drivers and complete shared-asset burden ledger required."
