review_metadata:
  scientific_review: pending
  semantic_boundary_review:
    decision: create_distinct_construction_delivery_methodology
    rationale: No existing material plant-construction delivery PCR found in this worktree or batch integration candidates. Water production is operating flow, filtering apparatus is factory equipment, industrial-building delivery excludes process machinery; aqueduct, floodworks and pipeline candidates exclude treatment plants. Independent method is needed for complete actual civil, process/E&M installation and commissioning delivery, not classification identity alone.
    sewer_system_interface: CPC includes sewer systems but excludes separately classified long-distance water pipelines and local water/sewer mains; each dataset needs actual accepted interface evidence and unclear scope review.
