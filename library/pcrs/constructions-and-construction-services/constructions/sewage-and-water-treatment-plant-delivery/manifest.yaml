  evidence_limits:
    - Historical qualitative official concrete/construction/monitoring sources do not provide current regulatory/design approval or generic amounts/lifetimes.
    - Hong Kong route sources demonstrate alternatives and construction versus operation; actual project quantities and country/voltage/provider scope must be measured.
    - Unknown same-asset capital lifetime/activity denominator remains explicit data-package review; no manufacturing share reset.
    - Illustrative atomic cards require extension for every real unrepresented route/unit/material/waste/emission before claiming complete entity inventory.
