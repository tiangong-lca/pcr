product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.constructions.sewage-and-water-treatment-plant-delivery"
  classification_refs: "CPC 3.0 53253 — Sewage and water treatment plants"
  covered_products: "Accepted sewer-system entities; sewage disposal/treatment plants; water treatment/purification plants; complete delivered new or reconstructed stages with explicit interfaces"
  excluded_products: "Separately delivered long-distance water pipelines/local water or sewer mains; stand-alone filtering equipment manufacture; pure construction/engineering or operating treatment services; building shell presented as whole process plant"
  representative_product: "One complete site-built treatment entity with actual declared civil and installed process scope, accepted functional test and measured geometry"
  production_route: "Actual ground/civil works → fixed process and E&M installation → water/mechanical/functional trials → accepted handover; route-selected structures and treatment units"
  market_state: "Installed at the declared site, complete within stated accepted stage and interfaces; no future ultimate capacity assumed"
functional_unit:
  what: "Provide one actually accepted sewage-system or treatment-plant construction entity with declared treatment/disposal/purification function"
  how_much: "One complete delivered entity; declare measured capacity under actual accepted influent quality/load and test conditions in m3/day where relevant, actual tank volumes, building area and sewer-system length/diameters"
  how_well: "As-built configuration and delivery completeness; actual watertightness, hydraulic/process, mechanical/electrical/control and quality test results at declared conditions, with remaining defects disclosed"
  how_long_or_cycle: "One actual construction-to-handover campaign, with recorded commissioning dates/test duration; no operating lifetime assumed"
  reference_flow_link: "accepted_entity"
system_boundary:
  rules:
    - rule_id: construction_delivery
      applies_to: "dataset"
      rule: "Collect actual site works and pre-handover commissioning through signed complete delivery. Upstream material/equipment manufacture and transport have separate provider gates; this site dataset is not automatically complete cradle-to-gate or whole life. Report unmatched upstream links explicitly."
      source_ids:
        - wsd-shatin-project
        - dsd-shek-wu-hui-project
        - dsd-sewage-overview-2017
    - rule_id: route_completeness
      applies_to: "all inventory rows"
      rule: "Build the real as-built process/train and civil-package register before selecting flows. Sewer systems, sewage disposal, conventional purification, biological/MBR and desalination/reuse are not reduced to a building shell or one filter. Add each actual atomic flow omitted by the illustrative cards, including non-concrete structures, sewers/chambers, fittings, valves, joints, welding consumables, media, chemicals and actual waste. A missing identity does not excuse dropping a needed unit."
      source_ids:
        - un-cpc-treatment-2025
        - wsd-water-treatment
        - dsd-shek-wu-hui-project
        - wsd-desalination
    - rule_id: test_operation_gate
      applies_to: "commission"
      rule: "Define actual trial dates, tested train/duty and acceptance contract. Include repairs/retests, initial media and first-fill installation. Exclude continuing existing-plant commercial operation and all post-handover service unless separately modelled. Split DBO construction from actual maintenance/renewal/removal and destinations; no assumed life or repeat rate."
      source_ids:
        - dsd-sewage-overview-2017
        - wsd-desalination
    - rule_id: water_release_gate
      applies_to: "utilities; commission"
      rule: "Track supplied water, direct abstraction, dewatering, internal recycle, contained washout, external treatment and direct discharge separately. Direct releases require actual chemistry, compartment and measurement/model evidence. Assess and disclose construction noise/vibration, land disturbance, odors and unmeasured constituents; no invention of default emission mass from monitoring concentrations or dB. Direct marine outfall needs water and each actual constituent with marine-compatible identities."
      source_ids:
        - epa-concrete-washout-2012
        - epd-shek-wu-hui-2007
        - wsd-desalination
boundary_abstraction:
  declared_starting_condition: "Actual existing site and assets recorded before construction; purchased materials/equipment at declared supplier gates and actual site-entry/transport interfaces"
  starting_condition_role: "foreground_entry_gate"
  product_classification_scope: "Sewer systems, sewage disposal and water-treatment/purification civil entities; separate excluded mains/long-distance water-pipeline interfaces"
  recursive_input_rule: "A purchased complete treatment module/previous plant in the same category is an upstream asset/provider input with its accepted boundary; never recursively recreate its manufacture while also including its provider. Existing retained plant is not a new whole-plant output"
  upstream_dataset_requirement: "Compatible supplier gate, region, actual technology/material state and embodied assembly content. Separate raw material manufacture from onsite batching/installation; no provider UUID alone proves upstream LCI completeness"
  disclosure: "Site/stage geometry/function; existing asset use and removals; actual route and trial gate; upstream/transport/capital coverage; later operation, maintenance/renewal and demolition excluded or explicitly separate; no full-life claim"
