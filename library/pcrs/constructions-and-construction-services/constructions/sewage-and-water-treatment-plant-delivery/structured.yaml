measurement_rules:
  - id: reference_item
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "1 item is one actually accepted complete declared plant/system entity or complete delivered expansion stage. item is the display alias of public Item(s); actual geometry and treatment/conveyance/disposal duty are qualifiers for applicable installed configuration; absent fields require evidence-backed not_applicable. These are not an assumed multiplier or lifetime output."
  - id: physical_quantities
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared original property"
      uuid: ""
    required_unit: "kg; m3; m; item; MJ; tkm"
    rule: "Preserve actual wet/dry/material/assembly scope; volume-to-mass requires same batch density and condition. Counts of pumps measured by Mass require same-configuration measured net mass. No plant-wide guessed mass or forced 1 kg reference. Match units to each row’s original property: mass/kg, volume/m3, length/m, count/item, energy/MJ under energy_units, and goods transport (mass*distance)/tkm under cp_transport. Preserve the measured energy conversions and actual freight activity; the listed units are alternatives by dimension, not simultaneous requirements."
  - id: energy_units
    applies_to: "diesel; cn_lv_electricity; cn_mv_electricity; other_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Public reference property remains Net calorific value and energy unit group. Electricity MJ = recorded kWh × 3.6 per verified unit definition; fuel MJ = actual kg × batch-specific LHV (MJ/kg). Do not turn energy into kg or confuse gross and net calorific value."
  - id: water_physical_state
    applies_to: "river_intake; groundwater_intake; sea_intake; freshwater_discharge; marine_water_discharge"
    required_property_ref:
      name: "Original Volume or Mass"
      uuid: ""
    required_unit: "m3; kg"
    rule: "River/groundwater and freshwater discharge retain Volume. Sea-water resource retains Mass, with measured volume×same-salinity/temperature evidenced density if needed; keep both ledgers. Water supply, resource extraction, technosphere effluent and actual elementary release are different crossings."
  - id: nonadditive_qualifiers
    applies_to: "reference product; acceptance tests"
    required_property_ref:
      name: "Measured function and geometry"
      uuid: ""
    required_unit: "m; m2; m3; m3/day"
    rule: "Measure each tank/building/network scope separately and state footprint versus floor area, usable versus gross volume and hydraulic duty/test duration. Do not sum unlike dimensions or infer treatment function from area, cost, population or default service life."
process_map:
  - id: ground
    name: "Site formation and temporary retaining works"
    inclusion: "required"
    inclusion_condition: "Actual clearance, excavation, backfill, subbase and drainage from the delivered system; all work-package quantities are retained even if example cards are absent."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: civil
    name: "Foundations, water-retaining structures and ancillary buildings"
    inclusion: "conditional"
    inclusion_condition: "Actual design: reinforcement, formwork, concrete placing/vibration/curing, joints and watertightness; non-concrete structures have their own material rows. Includes actual access roads/building shell within plant gate, not only one basin."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: installation
    name: "Plant pipework, fixed equipment and initial media installation"
    inclusion: "conditional"
    inclusion_condition: "Actual declared treatment route and sewer-system interface, fixed hydraulic/process/E&M works, initial media, electrical and control connections; equipment examples are conditional, not all required."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: utilities
    name: "Site equipment operation, construction water and direct releases"
    inclusion: "required"
    inclusion_condition: "Attribute actual fuel, supplied/direct water, power, reusable equipment and evidenced release to the responsible work package, including cleaning and defects."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: commission
    name: "Water tests, route-specific commissioning and delivery trials"
    inclusion: "required"
    inclusion_condition: "Actual dimensional, watertightness, mechanical, electrical/control and functional acceptance tests; record actual water, chemicals, sewage trials or RO trials only when performed. Isolate ongoing existing-plant operation and post-handover service."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: transport
    name: "Material deliveries and exported-waste transport"
    inclusion: "conditional"
    inclusion_condition: "Actual road legs with complete gates; other actual transport modes get separately verified atomic service rows."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: handover
    name: "Documented acceptance and complete entity handover"
    inclusion: "required"
    inclusion_condition: "Signed as-built scope, site and measured geometry, installed equipment list and functional-test records; one complete plant/system or complete delivered stage only."
    role: "reference_product"
    quantitative_reference: "per declared reference flow"
