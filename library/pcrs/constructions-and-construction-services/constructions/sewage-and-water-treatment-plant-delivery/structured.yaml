allocation_rules:
  - rule_id: separate_work
    applies_to: "all inventory rows"
    rule: "Avoid allocation by submetering and tracing actual work packages, delivered stage, existing operation and co-deliveries. A plant jointly treating sewage and supplying reclaimed water remains one construction entity unless separately accepted complete deliverables exist. No allocation by future lifetime water volumes without an evidenced service scenario."
    source_ids: []
  - rule_id: causal_shared_activity
    applies_to: "shared work packages"
    rule: "For inseparable shared construction, document beneficiaries and the causal physical driver from cp_acceptance, cp_energy and cp_transport. Shares are nonnegative and sum to one across that shared activity, with all attributable loads assigned once. Area or capacity is acceptable only if its causal relationship to that specific activity is demonstrated; money is not a substitute."
    source_ids: []
  - rule_id: reusable_asset_conservation
    applies_to: "temporary_sheet_pile; formwork_panel; excavator_manufacture"
    rule: "For the same asset, manufacturing-equivalent exchange equals documented physical asset quantity × attributable dimensionless fraction. Across all projects, periods and repeated uses cumulative fraction must not exceed one. Denominator/life/activity must be supported; unknown values remain an unresolved capital-equipment scenario, not a new full burden every project. Site fuel, actual maintenance and replacements are separate measured activities."
    source_ids: []
  - rule_id: waste_no_default_credit
    applies_to: "waste outputs"
    rule: "Record actual returned products, recycled scrap and exported waste with their state and destination. No automatic avoided-production, recovered-energy or sludge credit; any downstream extension must document provider boundary and allocation method and remain separate from this construction result."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "handover"
      flow_role: "accepted_entity; complete system configuration"
      record_type: "acceptance_record"
      raw_fields: "site; asset/stage identifier; accepted count; coordinates; boundaries; tank dimensions and volumes; building floor/site area; sewer length/diameters; installed train list; rated/accepted capacity and actual test duration; water quality; signed acceptance date"
      collection_method: "Survey as-built geometry; reconcile drawings, installed register and signed acceptance/performance tests of the same delivery. Fill actual installed configuration only; document absent tank/building/media/network fields as not_applicable with bounded interface evidence. Applicable unmeasured fields remain gaps. Test actual treatment, conveyance or disposal function as appropriate; never infer capacity from cost or geometry alone."
      unit: "item; m; m2; m3; m3/day"
      frequency: "each delivered stage"
      temporal_coverage: "whole construction through accepted handover"
      site_scope: "declared complete plant or sewer system"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "survey records; signed test reports; scope/defect register"
    - protocol_id: cp_material
      process_id: "ground_civil"
      flow_role: "separate purchased and installed materials"
      record_type: "delivery_and_batch_record"
      raw_fields: "work package; material and state; grade; batch; received/returned/installed/surplus quantities; wet and dry basis; density test; batch composition; source gate"
      collection_method: "Use calibrated weigh tickets and batch/placement records; volume-to-mass only with same-material batch density, grading/moisture and actual geometry. Reconcile rebar schedule and installed quantities."
      unit: "kg; m3; m"
      frequency: "each batch/delivery"
      temporal_coverage: "whole declared construction"
      site_scope: "site and supplying gates"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; supplier certificates; as-built quantities; stock balance"
    - protocol_id: cp_install
      process_id: "installation"
      flow_role: "individual fixed assembly, pipe or medium"
      record_type: "installation_record"
      raw_fields: "assembly identifier; technology; duty; supplier gate; material/formulation; dimensions; same-configuration measured net mass or length; gross receipts and opening stock; verified returns/transfers; closing usable stock; net consumption and separate installed accepted counts; damage/rejection-scrap and replacement links; initial media fill; inclusion of motor/frame/cable; acceptance"
      collection_method: "Reconcile receipts, stock, returns/transfers, equipment/BOM, acceptance and waste tickets. Derive attributable net consumption as gross receipts plus opening stock less verified returns/transfers and closing usable stock, including failed replacement units; keep installed quantity separate. Count-to-mass uses weighed/certified net mass of the same configuration, never guessed whole-plant mass; verified unconsumed returns are excluded."
      unit: "kg; m; item"
      frequency: "each assembly/lot"
      temporal_coverage: "all delivered installation including replacements before handover"
      site_scope: "delivered installation boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier scope; weighing; installation inspection; test record"
    - protocol_id: cp_temporary
      process_id: "ground_civil_utilities"
      flow_role: "reusable temporary assets and capital equipment"
      record_type: "asset_activity_ledger"
      raw_fields: "asset id; same configuration; manufacture coverage; actual mass/volume/count; project activity; cumulative lifetime activity evidence; prior/later attributed shares; repairs; receipts; unknown denominator"
      collection_method: "Retain actual physical presence separately from attributed manufacturing-equivalent quantity. Use logged service activity and documented lifetime/use denominator; reconcile each asset across projects without resetting. Measure panel area/thickness if volume-based."
      unit: "kg; m3; item"
      frequency: "each asset and use interval"
      temporal_coverage: "whole work and cumulative asset ledger"
      site_scope: "all projects sharing the same physical asset"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "asset records; actual activity; supported denominator; cumulative share audit"
    - protocol_id: cp_energy
      process_id: "utilities"
      flow_role: "each power supply and fuel batch"
      record_type: "meter_and_fuel_record"
      raw_fields: "source; region; voltage; meter start/end; work package; fuel grade and origin; weighed mass or metered volume; temperature/density; LHV; generator output; existing-plant service meter"
      collection_method: "Submeter construction and trial use; reconcile fuel tank balances and supported LHV. If volume is recorded, use batch-specific measured density first. Assign any shared utilities using logged causal activity rather than tariff."
      unit: "MJ; kWh; kg; m3"
      frequency: "each shift and meter period"
      temporal_coverage: "construction and pre-handover trials only"
      site_scope: "customer-side supplies and actual equipment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated meters; fuel certificates; logs; separate existing operations"
    - protocol_id: cp_water
      process_id: "civil_utilities"
      flow_role: "source-specific construction water, dewatering and washout"
      record_type: "water_balance_record"
      raw_fields: "source and intake/supply gate; batch use; opening/closing storage; intake; purchased water; recycle; export; direct receiver; liquid volume; wet solids; salinity/temperature/density"
      collection_method: "Meter each crossing, distinguish internal reuse, and reconcile stock and actual water retained in concrete/soil. Document fate of dewatering and washout instead of assuming water consumption or river release."
      unit: "m3; kg"
      frequency: "each use/discharge and daily balance"
      temporal_coverage: "all construction water activities"
      site_scope: "site, source and actual receiving interface"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; supply bills; sampling; containment and destination records"
    - protocol_id: cp_waste
      process_id: "ground_civil_installation"
      flow_role: "one sorted waste and destination per record"
      record_type: "waste_transfer_record"
      raw_fields: "material/state; source work package; weigh tickets; water content; contamination; export quantity; carrier; receiving route; supplier returns; internal reuse"
      collection_method: "Measure each separated waste stream at actual dispatch; reconcile receipts, installed mass and surplus. Whole slurry and separated solids are mutually exclusive for the same fraction."
      unit: "kg; m3"
      frequency: "each transfer"
      temporal_coverage: "all construction and pre-handover rework"
      site_scope: "actual dispatch and receiver"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "tickets; chain of custody; composition and receiving records"
    - protocol_id: cp_release
      process_id: "utilities_commission"
      flow_role: "each molecular or size-specific external release"
      record_type: "emission_measurement_record"
      raw_fields: "source/equipment; activity period; chemical/CAS; fossil/biogenic origin; receiving compartment; sampled concentration; gas flow or flux area/time; capture; blanks; uncertainty; selected factor and conditions if used"
      collection_method: "Use site flux/stack/engine tests or independently evidenced activity-specific model/factor with units, conditions and control efficiency. Record unmeasured/missing releases as gaps, not zero. Ambient dust and noise readings cannot be relabelled emitted mass."
      unit: "kg"
      frequency: "each actual release/test period"
      temporal_coverage: "only declared construction and trial activities"
      site_scope: "actual source and external receptor"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "instrument QA; speciation; method conditions; uncertainty; coverage register"
    - protocol_id: cp_trial
      process_id: "commission"
      flow_role: "route-specific test water, chemicals and sewage"
      record_type: "trial_and_sampling_record"
      raw_fields: "trial gate dates; commissioned train; test duty/duration; inlet volume/quality/load; chemical formulation/concentration/mass; retained water; effluent outlet volume and individual composition; sludge wet/dry mass; RO salinity/temperature/density and concentrate fate"
      collection_method: "Record actual tests, failed tests and retests; pair metered inlet/outlet and laboratory certificates. Assign commissioning start/end independently from commercial service. Volume×concentration calculations use synchronized samples and real molecular basis."
      unit: "m3; kg; m3/day"
      frequency: "each test and sampled discharge"
      temporal_coverage: "recorded pre-handover trial periods"
      site_scope: "actual tested trains and receiving gates"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "test protocol; calibrated meters; chemical certificate; laboratory reports; fate ledger"
    - protocol_id: cp_transport
      process_id: "transport"
      flow_role: "one cargo and transport leg"
      record_type: "shipment_record"
      raw_fields: "cargo/state; source/destination gates; measured payload; actual distance; mode/vehicle; return load; carrier inclusion of fuel and empty returns"
      collection_method: "Reconcile shipment tickets and actual route logs; calculate tkm from payload tonnes and km per leg. Include only legs outside other provider boundaries."
      unit: "tkm"
      frequency: "each shipment/leg"
      temporal_coverage: "all actual construction deliveries and exports"
      site_scope: "actual shipment gates"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "carrier record; route evidence; no overlapping provider/fuel accounting"
  calculation_rules:
    - id: project_basis
      applies_to: "all inventory rows"
      rule: "For one declared complete delivery, sum each attributable exchange over all work/test events, subtract documented returns and reconcile stock; report that total per declared reference flow. Multiple independently accepted entities require separately matched inventories; do not divide a larger plant into arbitrary equal items."
      inputs:
        - "event quantities"
        - "return and stock ledger"
        - cp_acceptance
      output: "attributed exchange per declared reference flow"
      source_ids: []
    - id: physical_mass_conversion
      applies_to: "material and installation quantities"
      rule: "Material kg = actual net consumed volume m3 × same-material batch density kg/m3, or actual net consumed count × same-configuration traceable net assembly mass kg/item. Reconcile consumption from receipts, opening stock, returns/transfers and closing usable stock under cp_material or cp_install, including pre-installation/pre-acceptance damage, rejected-and-scrapped units and replacement inputs. Keep accepted installed count separate; it is not the multiplier for all manufacturing inputs. Retain original quantities, conditions and uncertainty; no generic concrete, seawater or whole-plant density/mass."
      inputs:
        - cp_material
        - cp_install
        - cp_trial
        - geometry
        - "measured density"
      output: "kg per declared reference flow"
      source_ids: []
    - id: energy_conversion
      applies_to: "utilities"
      rule: "Electricity MJ = kWh × 3.6; fuel MJ = actual fuel kg × batch-specific LHV MJ/kg. For fuel-volume logs, first derive kg with same-batch measured density. Preserve public energy property and exclude generator output double counting."
      inputs:
        - cp_energy
        - "verified unit definitions"
        - "fuel certificates"
      output: "MJ per declared reference flow"
      source_ids: []
    - id: trial_constituent_mass
      applies_to: "direct liquid emissions"
      rule: "For each actual constituent, released kg = synchronized discharged m3 × measured concentration kg/m3 at the actual outfall, integrated over relevant intervals. mg/L converts to kg/m3 by 0.001 through SI definitions. Speciation, receptor and whole-liquid versus constituent accounting must be explicit; NOx-equivalent or COD is not molecular NO2 or an individual chemical."
      inputs:
        - cp_trial
        - "sampled molecular concentrations"
        - "outlet volume"
      output: "each evidenced constituent kg per declared reference flow"
      source_ids: []
    - id: asset_share
      applies_to: "temporary manufacturing burden"
      rule: "For each same-configuration asset, attributed manufacturing quantity = physical net quantity × verified activity fraction; sum fractions over all uses ≤ 1. Unknown lifetime denominator is not set to one; maintain independent reported capital sensitivity/review gap."
      inputs:
        - cp_temporary
        - "actual physical quantities"
        - "cumulative share ledger"
      output: "manufacturing-equivalent kg, m3 or item per declared reference flow"
      source_ids: []
    - id: water_and_material_balance
      applies_to: "construction and trials"
      rule: "Reconcile opening storage + actual entering water/material = closing storage + installed/retained amount + exported waste/product + actual environmental release, with measured/estimated losses separately disclosed. Internal transfers cancel; biological reactions use constituent-specific mass balances, not invented volume loss."
      inputs:
        - cp_material
        - cp_water
        - cp_trial
        - cp_waste
      output: "reconciled physical ledgers and disclosed residuals"
      source_ids: []
  data_quality_requirements:
    - id: complete_delivery
      applies_to: "reference product"
      requirement: "Match actual boundary, function, as-built geometry and acceptance. Partial civil shells, equipment lots or commissioning-only services are not a whole accepted plant. Report complete independently delivered expansion scope explicitly."
      evidence: "cp_acceptance; as-built drawings; actual test/acceptance"
    - id: inventory_coverage
      applies_to: "all processes"
      requirement: "Reconcile all work packages, route-selected units and actual exchanges; absent, unmeasured and omitted are different states. Identify each actual foreground constituent, asset interface and provider link; no process is removed merely because UUID is unresolved."
      evidence: "scope register; BOM; meter and waste balances"
    - id: route_state_identity
      applies_to: "UUID-bearing rows"
      requirement: "Match original name, chemical/physical state, grade, geography, supply gate, route, reference property and unit. The Chinese selected name equals the public Chinese baseName. Do not adopt broad labels through inconsistent taxonomy or misleading synonyms."
      evidence: "direct identity records and supplier/site specification"
    - id: source_limits
      applies_to: "method and data"
      requirement: "Use Hong Kong case sources only for documented configuration and interface support. Historical 1994/2003/2007/2012/2017/2018 material provides historical qualitative facts, not current legal approval or default construction quantities, lifetimes or emissions. PCR itself requires actual project evidence."
      evidence: "source locators and actual project records"
    - id: coverage_uncertainty
      applies_to: "dataset"
      requirement: "Retain meter calibration, sampling representativeness, conversion/asset denominator evidence, residual balances, missing flows, capital assumptions and unlinked upstream datasets. The technical construction result may be incomplete for an impact assessment."
      evidence: "calibration; quality/coverage register; uncertainty"
validation_rules:
  - rule_id: v_reference
    applies_to: "reference product"
    rule: "Require exactly one accepted_entity output with 1 item and the identical declared reference-product name; all rows/protocols use per declared reference flow. Require actual site, accepted stage and applicable measured geometry and treatment/conveyance/disposal functional tests. Check evidence-backed not_applicable for absent configuration fields; applicable unmeasured fields fail completeness. Do not invent a lifetime or kg-based plant."
    source_ids: []
  - rule_id: v_route
    applies_to: "all processes"
    rule: "Reject a whole-plant claim missing actual civil, installed process/E&M, hydraulic/interface and trial/handover work; require not-applicable reasons for absent units and separate atomic extension rows for every occurring unlisted exchange. Classify standalone long-distance water pipes/local water or sewer mains separately."
    source_ids:
      - un-cpc-treatment-2025
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Reject species, receiving medium, state, concentration, grade, reference-property or gate mismatch; keep exact unresolved rows and disclosure. A candidate reference UUID gap registered for accepted_entity does not prove method approval or usable provider links."
    source_ids: []
  - rule_id: v_water_emissions
    applies_to: "utilities; commission"
    rule: "Check fresh/saline withdrawal, supplied water, dewatering, export, storage, direct receptor and measured individual emissions without double counting; missing density/speciation/flow evidence stays unresolved. Ambient TSP/noise does not pass a molecular-emission check."
    source_ids:
      - epa-concrete-washout-2012
      - epd-shek-wu-hui-2007
  - rule_id: v_allocation
    applies_to: "shared construction and reusable assets"
    rule: "Verify causal beneficiaries, nonnegative conserving shared fractions and cumulative same-asset manufacturing share ≤ 1 over all projects/periods. Require actual supported lifetime/activity evidence; unknown asset burdens remain review, never per-project reset."
    source_ids: []
  - rule_id: v_dataset_claim
    applies_to: "dataset"
    rule: "Report accepted inputs, checked and unchecked work packages, identity/data gaps and construction-only life-cycle coverage. Numerical consistency cannot establish scientific review, local compliance, completeness of linked cradle-to-gate providers or full-life approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Construction-to-handover of the declared complete sewage/water treatment or sewer-system entity with actual route, geometry and test duty; optional upstream linking with verified provider interfaces; comparisons only on matched actual functions and scope"
  excluded_use: "Default whole-life or m3 operating-treatment result; shell-only or equipment-only represented as full plant; unbuilt ultimate capacity; guessed mass/life/mix; automatic environmental-compliance or scientific approval"
  required_metadata: "All reference qualifiers; work/trial dates; actual site and as-built register; treatment-route and existing-stage interfaces; supplier/transport gates; actual measured material/equipment/water/energy; conserved capital/shared allocation ledger"
  required_quality_disclosure: "Identity and unmeasured-exchange gaps; unsupported conversions; capital denominator uncertainties; coverage of all route-selected civil/process/E&M work; unlinked upstream burdens; noise/land/odor and actual release evidence; later-life exclusions"
  update_trigger: "Changed delivered function, geometry, capacity-test conditions, treatment technology, staged boundary, provider gate, actual inventory, capital assumptions or identity/source evidence"
data_sources:
  - id: "un-cpc-treatment-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed/PDF p.281, subclass 53253. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification meaning including sewer systems and plant categories; excludes long-distance water pipelines and local water/sewer mains. No construction recipe."
  - id: "wsd-shatin-project"
    type: "official_guidance"
    reference: "Hong Kong WSD, In-situ Reprovisioning of Sha Tin Water Treatment Works – South Works – Advance Works and Main Works, Project section. https://www.wsd.gov.hk/en/core-businesses/major-infrastructure-projects/in-situ-reprovisioning-of-sha-tin-water-treatment/index.html"
    used_for: "Project-specific site formation, ancillary buildings, residual management, pumps and treatment units; do not adopt project capacity, cost or schedule as defaults."
  - id: "dsd-shek-wu-hui-project"
    type: "official_guidance"
    reference: "Hong Kong DSD, PWP 4406DS, Shek Wu Hui sewage treatment works – further expansion phase 1A, Project Scope. https://www.dsd.gov.hk/EN/Our_Projects/All_Projects/4406DS%20.html"
    used_for: "Actual bioreactor/final-sedimentation conversion to MBR and civil/E&M interfaces, not universal requirement for MBR."
  - id: "wsd-water-treatment"
    type: "official_guidance"
    reference: "Hong Kong WSD, Water Treatment in Hong Kong, March 2018, PDF pp.1–3; publication date on p.3. https://www.wsd.gov.hk/filemanager/en/share/pdf/water_treat_a.pdf"
    used_for: "Historical documented alternative clarification and filtration routes, anthracite/sand media and chemical use; powdered activated-carbon dosing is not evidence of a granular activated-carbon bed. Qualitative Hong Kong support; no generic recipes or doses."
  - id: "wsd-desalination"
    type: "official_guidance"
    reference: "Hong Kong WSD, Desalination, Principle of Reverse Osmosis and Tseung Kwan O Desalination Plant Project sections. https://www.wsd.gov.hk/en/core-businesses/water-resources/desalination/index.html"
    used_for: "RO desalination plant and distinction between design, construction and operation; do not adopt cost, output capacity or recovery defaults."
  - id: "epd-shek-wu-hui-2007"
    type: "official_guidance"
    reference: "Hong Kong EPD, Shek Wu Hui STW Further Expansion Phase 1 Environmental Monitoring and Audit Report, December 2007, Future Key Issues; sections 2.1 and 6.1. https://www.epd.gov.hk/eia/files/applications/en/pp_484/aep_2476/progress/action_16199/emar200712dc200501/html/emar200712dc200501.htm"
    used_for: "Historical earthworks/retaining/pipe/FRP-cover and watertightness-test case; monitoring distinction for TSP and noise. Not current legal limits or emission factors."
  - id: "dsd-sewage-overview-2017"
    type: "official_guidance"
    reference: "Hong Kong DSD, Sustainability Report 2016–17, Overview of Sewage Treatment and Sewerage System, HATS and San Wai STW subsections. https://www.dsd.gov.hk/Documents/SustainabilityReports/1617/en/overview_of_sewage_treatment.html"
    used_for: "Historical treatment/commissioning, pumping/sludge and UV routes; DBO operation is separate after construction. No adopted contract term as service life."
  - id: "usace-concrete-1994"
    type: "handbook"
    reference: "USACE EM 1110-2-2000, Standard Practice for Concrete for Civil Works Structures, 1 February 1994, section 7-6, printed pp.7-6–7-7 / PDF pp.68–69. https://www.publications.usace.army.mil/Portals/76/Publications/EngineerManuals/EM_1110-2-2000.pdf"
    used_for: "Historical concrete preparation, forms, placement equipment, joints and curing only; no source numeric design, mix, pressure or dimensional requirement is adopted."
  - id: "epa-concrete-washout-2012"
    type: "official_guidance"
    reference: "US EPA, Stormwater Best Management Practice: Concrete Washout, EPA-833-F-11-006, February 2012, PDF pp.1–2. https://www.epa.gov/sites/default/files/2015-11/documents/concretewashout_0.pdf"
    used_for: "Historical washout-water/solid collection and potential environmental fate; no automatic release, pollutant amount, recovery percentage or legal approval."
  - id: "epa-gac-treatment"
    type: "official_guidance"
    reference: "US EPA, Overview of Drinking Water Treatment Technologies, Granular activated carbon section. https://www.epa.gov/sdwa/overview-drinking-water-treatment-technologies"
    used_for: "GAC adsorption media and separate pressure-vessel/gravity-basin configurations; actual precursor, initial fill and construction arrangement require project evidence. No removal efficiency, cost, bed size or loading default adopted."
  - id: "epa-dechlorination-history-2003"
    type: "official_guidance"
    reference: "US EPA, Managing Urban Watershed Pathogen Contamination, EPA/600/R-03/111, September 2003, section 3.2.5.1, printed p.3-8 / PDF p.92; section 3.2.6.3, printed p.3-20 / PDF p.104. https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=P1009F8P.TXT"
    used_for: "Historical sodium-bisulfite solution dechlorination of wet-weather wastewater; chemical-option evidence only. Actual construction trial water and quantities need project records. No numerical dosing, cost, performance or present regulatory statement adopted."
