measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "cp_handover records one accepted complete plant with consistent identity, actual configuration and declared stage; all quantities retain the same declared reference flow."
  - id: geometry_capacity
    applies_to: "reference configuration"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Survey footprint/building/foundation and route-specific waterway geometry from as-built records in cp_handover; capacity, AC/DC basis, head, discharge and dimensions remain separate actual qualifiers. No assumed kg per plant, area or MW conversion."
  - id: material_mass
    applies_to: "fresh_concrete; rebar; structural_section; hydraulic_grout; diesel; sea_intake"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use actual mass; convert a measured volume only with independently supported density for the exact material, temperature, salinity/moisture and state. Sea intake retains primary Mass and a parallel volume balance. cp_civil, cp_utilities and cp_environment preserve original measurements."
  - id: electricity_energy
    applies_to: "lv_power; mv_power"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Retain Net calorific value and exact 3.6 MJ/kWh conversion, actual CN supply and specified voltage; actual on-site generation does not inherit this grid identity."
  - id: water_volume
    applies_to: "supplied_water; river_intake; groundwater_intake; freshwater_discharge; sea_return; washout_liquid"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Measure actual volume and preserve source/destination, physical state, internal transfers and pollution sampling. Resource, supplied product, liquid waste and discharge are not interchangeable."
  - id: module_area
    applies_to: "poly_module; mono_module"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Preserve module Area/m2, with actual gross-area definition, dimensions/count and rating. The linked upstream dataset must use the same module-area convention or an independently evidenced conversion; unknown gross/aperture/cell-area relationship requires review. Secondary property meanValue=1 does not imply one module equals 1 m2. Area does not identify station area or permit rewriting the public property to Mass."
  - id: cable_length
    applies_to: "lv_cable"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "Preserve measured cable Length/m and actual supplied specification; do not use a generic copper mass conversion."
  - id: freight_quantity
    applies_to: "road_freight"
    required_property_ref:
      name: "mass*distance"
      uuid: "118f2a40-50ec-457c-aa60-9bc6b6af9931"
    required_unit: "t*km"
    rule: "Actual cargo tonnes times actual route kilometres using cp_transport; preserve the public mass*distance group reference kg*km and its documented t*km unit, 1 t*km = 1000 kg*km. Road freight is not the reference product mass."
process_map:
  - id: ground
    name: "Site preparation, excavation and ground treatment"
    inclusion: "required"
    inclusion_condition: "Actual site, geology, earth/rock balances, access, drainage and slope stabilization; add route-specific excavation/blasting/reinstatement flows when actually used."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: civil
    name: "Foundations and permanent civil structures"
    inclusion: "required"
    inclusion_condition: "Actual foundations, generator bases, powerhouse, containment, headworks/waterways and ancillary structures within the plant boundary; define each as-built work package."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: temporary
    name: "Temporary works and erection equipment"
    inclusion: "conditional"
    inclusion_condition: "Actual formwork, access/crane pads, lifting, shoring or dewatering installations, their repeated use and removal."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: thermal
    name: "Thermal prime mover and heat-cycle installation"
    inclusion: "conditional"
    inclusion_condition: "Actual boiler-steam, simple gas-turbine, combined cycle or reciprocating-engine route; nuclear steam turbine island uses its compatible actual subset."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: nuclear
    name: "Nuclear island and safety-system installation"
    inclusion: "conditional"
    inclusion_condition: "Actual nuclear configuration, qualified concrete/liner/primary components, supports, piping and safety/control systems. Handover stage must state whether fuel loading and nuclear startup are excluded."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: hydro
    name: "Hydraulic generation and water-conduit installation"
    inclusion: "conditional"
    inclusion_condition: "Actual hydro plant; include headworks, pressure waterway, powerhouse, turbine-generator and tailrace interfaces. Shared/multipurpose dam construction receives conserved attribution once."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: renewable
    name: "Wind and solar generating-equipment installation"
    inclusion: "conditional"
    inclusion_condition: "Actual utility-scale wind or PV station, foundation/racking and generator/module configuration, access and installation. Offshore/floating works and other renewable technologies require corresponding primary design and complete additional rows."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: electrical
    name: "Plant electrical and control installation"
    inclusion: "required"
    inclusion_condition: "Actual generator output, plant auxiliaries, transformer, switchgear, cables, earthing, protection and control interfaces; explicitly assign external grid works."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: utilities
    name: "Construction utilities and environment exchanges"
    inclusion: "required"
    inclusion_condition: "Attributable construction, erection, flushing, cold testing and actual included acceptance activities by stage/equipment; no routine operating inventory."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: waste
    name: "Construction waste containment and export"
