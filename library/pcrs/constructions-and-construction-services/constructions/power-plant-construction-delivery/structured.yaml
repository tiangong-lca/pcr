product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.constructions.power-plant-construction-delivery"
  classification_refs: "CPC 3.0 53262 — Power plants"
  covered_products: "Complete constructed heavy generating plant at declared construction/cold-test handover; actual thermal, nuclear, hydro, wind/PV and evidenced generating configurations"
  excluded_products: "Loose generators; upstream materials alone; stand-alone buildings/dams/networks; construction services; electricity production or whole operating lifetime"
  representative_product: "One actual site-identified plant with as-built installed units, integral works and a signed declared acceptance stage; no default technology or capacity"
  production_route: "Surveyed site → ground/civil works → route-specific generating and auxiliary installation → electrical/control interfaces → inspection/cold testing → declared construction handover"
  market_state: "Complete physically installed construction at the evidenced handover stage, with unfinished/hot tests and operating authorisations disclosed"
functional_unit:
  what: "Deliver the actual constructed plant capable by its installed design of the declared generating function, at the specified construction acceptance stage"
  how_much: "One complete actual plant; declare installed unit count, actual capacity per unit and total, electrical AC/DC/net/gross convention and documented test conditions. Capacity is a qualifier, not energy output"
  how_well: "As-built geometry, route-specific configuration, interfaces and signed structural/mechanical/electrical completion criteria; actual site, operational restrictions and unfinished scope declared"
  how_long_or_cycle: "One actual construction-to-handover event with recorded dates; no assumed life, capacity factor or lifetime electricity yield"
  reference_flow_link: "reference_product_power_plant"
system_boundary:
  rules:
    - rule_id: construction_scope
      applies_to: "dataset; inventory"
      rule: "Include the actual complete agreed plant construction from surveyed starting site through signed civil/mechanical/electrical handover, with integral foundation and generating equipment. Record delivery gate and cold-test stage; this is a construction entity, not a building service or bag of materials."
      source_ids:
        - un-cpc-power-plants-2025
        - iaea-nuclear-construction-2011
    - rule_id: route_completeness
      applies_to: "dataset; inventory"
      rule: "Use the installed design branch, not every example row. Complete its work-package BOM: foundation and material state, generating unit, auxiliary cooling/water/fuel handling, pollution-control hardware, electrical/control/safety, connections, tests and temporary removal. Add every missing specific atomic exchange and supplier link before claiming complete inventory; unsupported branches remain a review gap."
      source_ids:
        - iaea-nuclear-construction-2011
        - ifc-thermal-power-2008
        - ifc-hydropower-2018
        - doe-wind-siting-2021
    - rule_id: upstream_interfaces
      applies_to: "dataset; inventory"
      rule: "Separate supplier manufacturing, attributable supply transport and measured site construction. Received components carry their actual delivered state; raw metal is not added again when a purchased fabricated assembly includes it. Upstream datasets are separately linked with actual formulation, geography, technology and gate; missing links prohibit a complete cradle-to-gate claim."
      source_ids:
        - ifc-biomass-construction-2017
    - rule_id: handover_and_operation
      applies_to: "dataset; inventory"
      rule: "The core endpoint is the actual agreed construction-completion/cold-commissioning handover, with stage and unfinished tests disclosed. It does not establish commercial generating readiness or nuclear licensing. Fuel loading, nuclear startup, hot performance operation and trial electricity/heat exports require a separate fully specified extension with each actual fuel, water, chemical, emission and output; never silently omit included hot tests or blend routine operation."
      source_ids:
        - ifc-biomass-construction-2017
        - iaea-nuclear-construction-2011
    - rule_id: later_stages
      applies_to: "dataset; inventory"
      rule: "Routine generation, maintenance/renewal, reservoirs operational emissions, later decommissioning/demolition, downstream waste treatment and future recovery credits are outside the core. Existing-site demolition/remediation and removal of temporary construction works, if actually undertaken, are separate included work packages with measured flows. Declare land/ecology disturbance, noise/vibration, sediment and thermal releases and their unmeasured coverage; they are not fabricated mass emissions."
      source_ids:
        - ifc-hydropower-2018
        - doe-wind-siting-2021
    - rule_id: water_identity
      applies_to: "dataset; inventory"
      rule: "Keep supplied water, direct river/ground/sea resource intake, internal reuse, captured liquid waste and direct recipient discharge separate. Actual pollutant species/medium and physicochemical state require their own atomic rows. No default density, emission factor, dilution credit or zero for missing measurements."
      source_ids:
        - ifc-hydropower-2018
        - epa-concrete-washout-2012
boundary_abstraction:
  declared_starting_condition: "Actual surveyed site before attributable construction, with received materials and components at explicit supplier/site interfaces and original condition documented"
  starting_condition_role: "foreground_starting_point"
  product_classification_scope: "Complete constructed power-plant entity with integral actual generating works; CPC provides category context only"
  recursive_input_rule: "Existing plant or reused component enters once in its actual inherited state; record inherited burdens and new measured work without recursively reconstructing the same plant category"
  upstream_dataset_requirement: "Separate compatible manufacture, supplied-state and transport links; disclose every gap and included gate"
  disclosure: "Actual construction and cold-test handover foreground; upstream full coverage not presumed; hot/fuelled tests, routine generation, maintenance and later demolition excluded unless separately defined"
