    - protocol_id: cp_environment
      process_id: "utilities"
      flow_role: "Each actual resource intake and external release"
      record_type: "foreground_records"
      raw_fields: "Stage/equipment, species/CAS, fossil fraction, resource/receptor/compartment, mass/volume, time, salinity/temperature/density, measured source rate/activity, control capture, model provenance and uncertainty"
      collection_method: "Calibrated intake/outfall meters and source-specific chemical/size-fraction monitoring or independently supported site model; reconcile water/carbon balances. Record noise, vibration, ecological disturbance and thermal effects separately; do not infer emitted mass from concentration alone"
      unit: "kg; m3"
      frequency: "Every intake/release interval, documented activity and sample"
      temporal_coverage: "All included site construction/testing intervals; unobserved intervals disclosed"
      site_scope: "Actual source and environment boundary/receptor"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration, chemistry/speciation, disjoint size fractions, medium/state and independent model checks, mass/volume balance and uncertainty"
  calculation_rules:
    - id: calc_reference
      applies_to: "all inventory rows"
      rule: "Aggregate each attributable atomic quantity for this same accepted entity. q = Q / N, where N = 1 complete delivered plant; q is per declared reference flow. Do not divide by assumed plant mass, lifetime, cost or generated electricity."
      inputs:
        - cp_handover
      output: "per declared reference flow"
      source_ids: []
    - id: calc_electricity
      applies_to: "lv_power; mv_power"
      rule: "E_MJ = E_kWh * 3.6; preserve actual meter/gate and allocate construction energy once."
      inputs:
        - cp_utilities
      output: "MJ per declared reference flow"
      source_ids: []
    - id: calc_density
      applies_to: "fresh_concrete; diesel; sea_intake"
      rule: "Mass in kg = measured volume times independently evidenced same-material/state density in compatible units; retain raw volume and density provenance. Unknown density is review, not a guessed factor."
      inputs:
        - cp_civil
        - cp_utilities
        - cp_environment
      output: "kg per declared reference flow"
      source_ids: []
    - id: calc_freight
      applies_to: "road_freight"
      rule: "Sum actual cargo tonnes * actual route kilometres by leg, with supported shared-load and return convention; distinguish raw vehicle-km from t*km and included supply freight."
      inputs:
        - cp_transport
      output: "t*km per declared reference flow"
      source_ids: []
    - id: calc_modules
      applies_to: "poly_module; mono_module"
      rule: "For each same-configuration module lot, multiply measured gross area per module by attributable consumed count = gross attributable receipts + opening stock - verified returns/transfers - closing reusable stock; sum across lots under the same gross-area convention. Include modules consumed by damage, rejection and rework before acceptance. Record accepted installed area and count separately; reconcile discarded modules under cp_waste without subtracting their manufacture burden. Rated capacity and electricity remain distinct qualifiers/outputs."
      inputs:
        - cp_renewable
      output: "m2 per declared reference flow"
      source_ids: []
    - id: calc_attribution
      applies_to: "plywood_form; excavator; mobile_crane"
      rule: "Attributable asset manufacture = measured asset amount * evidenced share; cumulative shares across every beneficiary and period ≤1. Keep physical transfer ledger and operating fuel separate; unsupported use/lifetime denominator is review."
      inputs:
        - cp_assets
      output: "attributed asset amount per declared reference flow"
      source_ids: []
    - id: calc_releases
      applies_to: "fossil_co2; nitrogen_monoxide; nitrogen_dioxide; pm_fine; pm_coarse"
      rule: "Use measured emitted species mass or an independently supported source-specific site model. Fossil CO2 may use measured oxidized fossil carbon * 44/12 with composition/oxidation evidence; molecular NO and NO2 require independent speciation, and PM fractions are disjoint. No universal engine/plant emission factors are given."
      inputs:
        - cp_environment
      output: "kg per declared reference flow"
      source_ids: []
  data_quality_requirements:
    - id: configuration
      applies_to: "reference product"
      requirement: "Actual generating route, complete installed BOM, geography, capacity/geometry and delivery stage must describe the same identified plant."
      evidence: "cp_handover; cp_civil; cp_thermal; cp_nuclear; cp_hydro; cp_renewable"
    - id: coverage
      applies_to: "all inventory rows"
      requirement: "Cover every actual work package, subcontracted interval and relevant route; disclose missing measurements, components, unsupported identities and all excluded stages without claiming complete lifecycle."
      evidence: "cp_handover; construction records; supplier gates"
    - id: metrology
      applies_to: "all inventory rows"
      requirement: "Retain calibration, raw basis/state, density/composition provenance, dimensional consistency and uncertainty; no default mix, site consumption, plant mass or life."
      evidence: "cp_civil; cp_utilities; cp_environment; cp_transport"
    - id: attribution
      applies_to: "temporary; hydro; electrical"
      requirement: "Persistent asset and multipurpose civil/interface allocations conserve burdens across all beneficiaries; unresolved denominator or scope stays review."
      evidence: "cp_assets; original project allocation ledger"
    - id: source_limits
      applies_to: "dataset"
      requirement: "Historical technical sources support qualitative construction/route facts only, not current permission, default recipe, lifetime or emission factor. Nuclear, biomass, hydro, wind and solar case scopes must not be silently extended."
      evidence: "un-cpc-power-plants-2025; iaea-nuclear-construction-2011; ifc-thermal-power-2008; ifc-biomass-construction-2017; ifc-hydropower-2018; doe-wind-siting-2021; ifc-mocuba-solar-2016; epa-concrete-washout-2012"
validation_rules:
  - rule_id: identity_gate
    applies_to: "dataset; inventory"
    rule: "Require one actual constructed power-plant entity, its generating route and all mandatory qualifiers. Verify every adopted identity against material/specification, geography, state, route, primary property and unit group; unresolved identity is not a substitution licence."
    source_ids: []
  - rule_id: measurement_gate
    applies_to: "dataset; inventory"
    rule: "The final output is exactly 1 item/件 and every inventory/protocol basis is the same declared reference flow. Reconcile measured geometry, capacity, count and delivery state; never infer mass per plant, life, energy yield or a universal mix. Preserve Mass, Area, Length, Volume and energy identities and evidence for any conversion."
    source_ids: []
  - rule_id: completeness_gate
    applies_to: "dataset; inventory"
    rule: "Match every actual required/conditional design work package to its atomic rows, original records and upstream/transport interfaces. Missing components, unmetered work, hot tests within the accepted scope, unknown allocations or conversions and unsupported routes remain review gaps and prohibit a complete result; genuine absence requires design evidence."
    source_ids: []
  - rule_id: environment_gate
    applies_to: "dataset; inventory"
    rule: "Check independent source/species/medium evidence before direct elementary exchanges, including fossil share, molecular NO/NO2, disjoint PM fractions and water receptor. Captured sludge/liquid is waste, internal recirculation is not intake, and noise/concentration is not assumed emitted mass. Missing observation is not zero."
    source_ids: []
  - rule_id: attribution_gate
    applies_to: "dataset; inventory"
    rule: "Reconcile each persistent asset and shared dam/connection ledger across all users, projects and periods; cumulative manufacture shares ≤1 and complete attribution sums to the whole declared burden. Retain actual gates and eliminate duplicate raw materials, equipment packages, fuel services and freight."
    source_ids: []
  - rule_id: handover_gate
    applies_to: "dataset; inventory"
    rule: "Require dated signed construction acceptance, geometry/configuration and outstanding-tests list. Independent structural, electrical, nuclear, environmental or regulatory acceptance must be evidenced where claimed; PCR inspection establishes none of these approvals. Report performed/skipped checks, findings, uncertainty and covered/excluded stages."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_construction_dataset"
  downstream_use: "Explicit construction contribution to a plant infrastructure model with separately matched upstream components and separately assessed operation/end of life"
  allowed_use: "The measured actual plant/site/configuration/acceptance period and compatible comparisons with the same functional/coverage definitions"
  excluded_use: "Generic mass-based power-plant material, unqualified per-kWh operation, default lifetime/capacity/recipe, whole lifecycle or licensing/approval claim"
  required_metadata: "All reference qualifiers; actual work packages, initial state and scope; original unit/gate/identity bindings; measured geometries and capacity; asset/shared interface ledger; cold/hot and fuel-load status; signed handover dates"
  required_quality_disclosure: "Performed/skipped checks, unmetered and unsupported scope, unresolved identity/allocation/conversion, uncertainty, supplier links and excluded operating/maintenance/demolition stages"
  update_trigger: "Actual configuration, site, component/supply gate, method evidence, measurement, acceptance stage or attributable work changes"
data_sources:
  - id: "un-cpc-power-plants-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Explanatory Notes (30 June 2025), printed/PDF p281, 53262. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Heavy electrical generating plants including nuclear; adjacent category context only, not methodology approval"
  - id: "iaea-nuclear-construction-2011"
    type: "official_guidance"
    reference: "IAEA, NP-T-2.5 Construction Technologies for Nuclear Power Plants (2011), printed p23/PDF37 §4.1; printed pp48–50/PDF62–64 §4.2; printed pp99–104/PDF113–118 §5.1; printed pp112–114/PDF126–128 §6. https://www-pub.iaea.org/mtcd/publications/pdf/p1526_web.pdf"
    used_for: "Qualitative nuclear civil/containment/turbine-island construction and installation; no adoption of historical case dimensions, recipes, duration or licence"
  - id: "ifc-thermal-power-2008"
    type: "official_guidance"
    reference: "IFC, EHS Guidelines for Thermal Power Plants (19 December 2008), pp1–2 Applicability; Annex A pp26–29; p8 cooling. https://www.ifc.org/content/dam/ifc/doc/2000/2008-thermal-power-ehs-guidelines-en.pdf"
    used_for: "Historical non-nuclear combustion-route/component distinctions; guideline applicability >50 MWth HHV, not a PCR capacity default or construction emission factor. Operational cooling/emissions are not mandatory construction releases"
  - id: "ifc-biomass-construction-2017"
    type: "official_guidance"
    reference: "IFC, Converting Biomass to Energy: A Guide for Developers and Investors (June 2017), printed pp91–94/PDF109–112 §8.1; printed pp95–100/PDF113–118 §8.2. https://www.ifc.org/content/dam/ifc/doc/mgrt-pub/biomass-report-06-2017.pdf"
    used_for: "Biomass steam/biogas examples: erection, civil/mechanical/electrical records and cold/hot/function/performance acceptance distinctions; no universal thermal-plant recipes or trial quantities"
  - id: "ifc-hydropower-2018"
    type: "official_guidance"
    reference: "IFC, Environmental, Health, and Safety Approaches for Hydropower Projects (March 2018), printed pp13–14/PDF23–24 §1.1.7; printed pp48–50/PDF58–60 Annex A. https://www.ifc.org/content/dam/ifc/doc/mgrt/gpn-ehshydropower.pdf"
    used_for: "Site-specific hydro civil/waterways/powerhouse and electromechanical interfaces; conditional excavation, spoil and drainage; no default dimensions, life, reservoir emissions or numerical factors"
  - id: "doe-wind-siting-2021"
    type: "official_guidance"
    reference: "US DOE/NREL, Land-Based Wind Energy Siting: A Foundational and Technical Resource (August 2021), §2.1 Construction, printed pp9–11/PDF19–21, Figures 6–7. https://www.energy.gov/sites/default/files/2025-10/land-based-wind-energy-siting-guide.pdf"
    used_for: "Historical land-based preparation, foundation concrete/rebar and crane/tower/nacelle/rotor erection; not offshore construction evidence or default quantities"
  - id: "ifc-mocuba-solar-2016"
    type: "official_guidance"
    reference: "IFC ESRS project 36787 Mocuba Solar, disclosed 21 January 2016, Project Description and PS3 Water consumption. https://disclosures.ifc.org/project-detail/ESRS/36787/mocuba-solar"
    used_for: "One Mozambique polycrystalline PV case: steel substructure, array electrical configuration and construction/O&M separation; no case capacity, module count, area or date is a PCR default, and no transfer of case geography to CN identities"
  - id: "epa-concrete-washout-2012"
    type: "official_guidance"
    reference: "US EPA, Stormwater Best Management Practice: Concrete Washout, EPA-833-F-11-006 (February 2012), pp1–3. https://www.epa.gov/sites/default/files/2015-11/documents/concretewashout_0.pdf"
    used_for: "Historical ready-mix chute/pump washing and separate captured liquid/solid handling; no default pH, density, mandatory leakage or treatment credit"
