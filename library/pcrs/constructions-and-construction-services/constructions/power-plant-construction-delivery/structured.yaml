      collection_method: "Reconcile one persistent ledger across all users/projects/periods with actual hours/cycles or supported denominator; unknown denominator requires review"
      unit: "item; m2; kg; fraction; hours/cycles"
      frequency: "Every deployment/reuse/transfer and allocation update"
      temporal_coverage: "All relevant asset projects and service periods"
      site_scope: "Asset and all beneficiaries"
