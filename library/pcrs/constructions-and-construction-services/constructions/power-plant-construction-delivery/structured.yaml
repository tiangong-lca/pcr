allocation_rules:
  - rule_id: direct_activity
    applies_to: "dataset; inventory"
    rule: "First assign materials, metered energy and work packages directly to the actual plant. For shared batching, workforce equipment or deliveries use recorded beneficiary activities/loads and explain the physical relationship; neither plant cost nor assumed annual generation supplies the denominator. Missing relationship requires review."
    source_ids: []
  - rule_id: shared_assets
    applies_to: "dataset; inventory"
    rule: "For each equipment or reusable form/component retain a persistent manufacture-burden ledger across every project and period. Attribute measured asset amount times evidenced use share; the cumulative shares must be ≤1 and operating energy is separate. Record actual hours/cycles or supported whole-asset denominator and beneficiaries; unknown future life/capacity remains an explicit review, not a fresh full burden at every project."
    source_ids: []
  - rule_id: multipurpose_works
    applies_to: "dataset; inventory"
    rule: "Shared dam, reservoir civil works, access and grid interfaces must be assigned once with project-specific causal/service evidence among actual beneficiaries; shares conserve the entire included construction burden. State unallocated/missing scope. Independently imported component datasets must not duplicate plant foreground works."
    source_ids: []
  - rule_id: residuals
    applies_to: "dataset; inventory"
    rule: "Separate reusable material/product transfers from segregated waste and actual disposal. Do not net avoided virgin manufacture or future recovery into core construction. A hot-test electricity/heat extension records actual useful outputs and its independent allocation basis; trial export does not turn construction reference quantity into kWh."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "These attribution rules require the explicit foreground measurement and cross-project evidence of cp_assets and the relevant work-package protocols; they supply no external default share, lifetime or substitution factor."
    source_ids: []
