allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The following physical attribution and share conservation are declared foreground collection constraints of this PCR, not LCA factors prescribed by the cited construction manuals. Original manufacture quantities, activity, H and beneficiaries require actual measurements or supported records; absent evidence requires review. Emission concentration integration likewise relies on actual foreground measurements; engineering process sources supply no default emission factors."
    source_ids: []
  - rule_id: dedicated_entity
    applies_to: "declared dataset"
    rule: "Attribute dedicated construction to its actual delivered entity. Split shared plant, haul, pumping or testing by measured physical activity and recorded beneficiaries with conservation; costs alone do not establish physical allocation. State unresolved shared relations and sensitivity instead of invented ratios."
    source_ids: []
  - rule_id: reuse_conservation
    applies_to: "declared dataset"
    rule: "For each serialized machine, form or temporary pile, keep its original manufacture burden and cumulative cross-project/period/use shares. Let h_j be evidenced project activity and H the evidenced lifetime cumulative activity or justified supported denominator: share_j=h_j/H. All cumulative shares must be nonnegative and sum at most one. Unknown H or beneficiary relation requires review; do not reset manufacture for each project. Replacement parts are separate actual inputs."
    source_ids: []
  - rule_id: internal_and_recovery
    applies_to: "declared dataset"
    rule: "Excavation reused as fill, recovered washwater and temporary assets leaving for further use are traced internal/reuse transfers, not new resource inputs or automatic coproduct credits. Exported reusable products and segregated wastes retain actual mass/state/destination; downstream treatment and substitution need separately verified boundaries."
    source_ids:
      - epa-concrete-washout-2012
dataset_production:
  collection_protocols:
    - protocol_id: cp_foundation
      process_id: "foundation"
      flow_role: "excavation and foundation materials/waste"
      record_type: "survey_and_delivery_ledger"
      raw_fields: "site_id; work_package; geological state; pre/post survey; receipts; kg; moisture; reuse and export destinations"
      collection_method: "Survey excavation/abutments and weigh each real incoming/exported stream; link grout/cutoff batch and injection logs."
      unit: "kg; m3 Aggregation details: Sum attributed quantities per declared reference flow; reconcile excavation, reuse, stock change and export separately."
      frequency: "each delivery and work shift"
      temporal_coverage: "whole declared construction period"
      site_scope: "actual site, borrow and diversion interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weighbridge calibration, geological logs, signed as-built quantities"
    - protocol_id: cp_zones
      process_id: "embankment"
      flow_role: "zoned fill and filter/drain quantities"
      record_type: "zone_placement_ledger"
      raw_fields: "zone; batch; source; grading; delivered wet kg; moisture; surveyed compacted volume; actual density; rejected kg"
      collection_method: "Weigh and sample actual soil/rock/aggregate; reconcile borrow transfers with survey and compaction/density/moisture tests by lift/zone."
      unit: "kg; m3 Aggregation details: Sum actual accepted-zone attributable input per declared reference flow; stock and rejects retained, no generic dry density."
      frequency: "each batch/lift and measured lot"
      temporal_coverage: "entire selected fill route"
      site_scope: "actual core, shell, filter, drain and protection zones"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "source/gradation tests, calibrated mass, as-built zone geometry and field compaction records"
    - protocol_id: cp_batches
      process_id: "concrete"
      flow_role: "concrete/mortar/block constituents and reinforcement"
      record_type: "batch_and_placement_records"
      raw_fields: "route; mix_id; each constituent kg; aggregate moisture/absorption; fresh delivered m3; rejects; placed geometry; temperature/strength tests; actual density"
      collection_method: "Obtain actual batch scales or supplier ticket and each lift/pour/block placement acceptance; distinguish onsite batch from supplied composite and RCC rolling from conventional vibration/curing."
      unit: "kg; m3 Aggregation details: Sum actual consumption attributable to entity per declared reference flow, with waste and stock changes; constituents and purchased composites mutually reconciled."
      frequency: "each actual batch and placement"
      temporal_coverage: "entire selected concrete route"
      site_scope: "actual body/facing/appurtenance works and supply gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "mix certificates, scales, acceptance test results, lift cards and as-built geometry"
    - protocol_id: cp_fixed
      process_id: "fixed"
      flow_role: "actual consumed permanent seals/drains/gates/instruments and separate installed configuration"
      record_type: "component_consumption_and_installation_register"
      raw_fields: "component_id; grade/form; count; measured kg; dimensions; installed length/area; contained components; joint/interface; calibration/acceptance; gross attributable receipts; opening/closing reusable stock; verified returns/transfers; damaged/rejected/replaced quantities"
      collection_method: "Reconcile supplier certificates, receipts and stocks with installed schedule and waste. In each row’s native unit, input = gross attributable receipts + opening stock - verified returns/transfers - closing reusable stock, including cutting losses and components consumed in pre-installation/acceptance failures and replacements. Installation quantity is separate configuration evidence, not the consumed-input total. Check joint continuity, gate interface and sensor calibration; retain actual installation work once, without duplicate assembly contents."
      unit: "kg; item; m; m2"
      frequency: "each receipt, return, failed/replaced component and installed component/lot"
      temporal_coverage: "entire attributable construction period through handover, including pre-installation losses and rework"
      site_scope: "signed permanent dam interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "signed installation records, component specs, traceable mass and acceptance/calibration"
    - protocol_id: cp_utilities
      process_id: "utilities"
      flow_role: "fuel and electricity"
      record_type: "meter_and_fuel_balance"
      raw_fields: "work_package; equipment/configuration; country/voltage; kWh; kg; litres; actual density; stock changes; supplier and generator boundaries"
      collection_method: "Meter real energy and weigh/reconcile fuel receipts, tanks and returns by actual construction activity including subcontractors and idling."
      unit: "kg; kWh; MJ Aggregation details: Sum attributed net fuel/electricity per declared reference flow; reconcile shared allocation and internal generation."
      frequency: "each shift/meter interval"
      temporal_coverage: "all actual construction/testing work"
      site_scope: "actual site/borrow/plant and grid-user meters"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrations, supplier tickets, stock balance and load/work logs"
    - protocol_id: cp_assets
      process_id: "utilities"
      flow_role: "reusable machines, timber forms and temporary sheet-pile manufacture shares"
      record_type: "cross_project_asset_ledger"
      raw_fields: "asset_id; configuration; original manufacture amount/property; project activity; cumulative activity; supported H; all prior shares; losses/replacements; beneficiaries"
      collection_method: "Retain serialized manufacture/supplier record and time/area/cycle activity evidence; reconcile every project attribution against original manufacture. Unknown H or prior shares stays unresolved. Permanent-route sheet-pile consumption is collected separately under cp_sheet_piles. For a formerly reused pile retained permanently, carry forward prior shares and evidence the remaining attribution; do not count full manufacture again."
      unit: "item; kg; h Aggregation details: Project share times original property quantity per declared reference flow; all cumulative shares at most one, no per-project reset."
      frequency: "each use/project and retirement update"
      temporal_coverage: "entire evidenced cumulative asset history"
      site_scope: "all beneficiaries including prior and subsequent projects"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "serialized ledger, supported service denominator, prior allocation receipts and loss/replacement records"
    - protocol_id: cp_sheet_piles
      process_id: "foundation"
      flow_role: "sheet_pile"
      record_type: "sheet_pile_consumption_and_asset_reconciliation"
      raw_fields: "section_id; configuration; permanent/temporary route; new/reused status; gross attributable receipts kg; opening/closing reusable stock kg; verified returns/transfers kg; cutting/damage/rejection/replacement kg; accepted installed kg; waste kg; cp_assets ledger and prior shares"
      collection_method: "Measure permanent-route consumption with calibrated weighing and the receipts/stock/returns balance in the sheet_pile card. Retain pre-installation/acceptance losses, accepted installed mass and waste separately. For temporary piles use only the conserved manufacture kg established by cp_assets. Track transfers between temporary and permanent service by the same asset identity and supported remaining attribution, with no repeated manufacture; unknown prior shares require review. Sum the two disjoint contributions once."
      unit: "kg"
      frequency: "each receipt/use/transfer/loss and asset attribution update"
      temporal_coverage: "entire actual construction through handover, with full earlier asset history where reused stock is involved"
      site_scope: "actual foundation/diversion/cofferdam and related stock/asset interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated weights; supplier/stock records; accepted installation and waste records; prior manufacture allocation ledger"
    - protocol_id: cp_transport
      process_id: "utilities"
      flow_role: "external truck freight"
      record_type: "leg_payload_records"
      raw_fields: "leg_id; origin/destination; actual cargo tonnes; actual km; empty return; supplier inclusion; assignment"
      collection_method: "Use weighbridge/consignment and actual route records; check provider datasets for already included legs."
      unit: "t; km; t*km Aggregation details: Sum cargo t times leg km per declared reference flow with explicit beneficiaries; onsite fuel kept separate."
      frequency: "each actual leg"
      temporal_coverage: "construction delivery and waste export period"
      site_scope: "declared external transport interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "consignment, weighbridge, route evidence and dataset gate review"
    - protocol_id: cp_water
      process_id: "water_environment"
      flow_role: "water intakes, stock, effluent and waste"
      record_type: "water_and_destination_balance"
      raw_fields: "source/intake/recipient; country/basin; treated state; supplied kg; volume m3; actual density; recirculation; evaporation evidence; waste wet kg and solids; pH/characterization; treatment/export gate"
      collection_method: "Meter each real supply/intake/return and weigh each separated waste; sample matching liquid/solid state and retain treatment, reuse and receiving-pathway records."
      unit: "kg; m3 Aggregation details: Balance inflow, internal reuse, stock, incorporation, evidenced consumption and actual return per declared reference flow; internal reuse counted once."
      frequency: "each shift/intake/outfall and waste shipment"
      temporal_coverage: "actual construction/testing water period"
      site_scope: "actual intake, onsite treatment and export/outfall"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration, samples, treatment records, destination receipts and balance"
    - protocol_id: cp_emissions
      process_id: "water_environment"
      flow_role: "individual actual emission species"
      record_type: "species_activity_or_release_measurement"
      raw_fields: "species; fossil/biogenic origin; size fraction; phase; compartment/subcompartment; release mass; matched flow volume and concentration; equipment/activity; factor/source/unit; controls; uncertainty"
      collection_method: "Use calibrated species-specific measurements or original supported factors matching actual route/equipment/control and unit; preserve concentration integration, no invented species split."
      unit: "kg; m3; kg/m3 Aggregation details: Sum supported species release mass per declared reference flow; not detected, absent and unmeasured have distinct evidence states."
      frequency: "each actual measured operation/release"
      temporal_coverage: "whole declared site-work release period"
      site_scope: "real atmospheric and freshwater/sea recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "sampling/calibration, original factor applicability, detection limit and uncertainty"
    - protocol_id: cp_marine
      process_id: "marine"
      flow_role: "actual marine foundation/caisson/fuel/dredging"
      record_type: "marine_work_ledger"
      raw_fields: "route; strata; pre/post bathymetry; dredged wet kg/moisture/contamination; component count/contents; fuel kg/grade; tow/sinking logs; ballast volume/recipient; assignment"
      collection_method: "Measure every precise flow and actual operation; reconcile dredging reuse/export, caisson supply gate, onsite lifting/flotation and shared plant manufacture shares; contaminated flows and releases separately identified"
      unit: "kg; item; m3"
      frequency: "each real marine work/export"
      temporal_coverage: "actual declared construction period"
      site_scope: "exact seabed/installation/ballast/export interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "geological/bathymetric survey, weighing, contamination, positioning and signed installation"
    - protocol_id: cp_initial_filling
      process_id: "water_environment"
      flow_role: "actual pre-acceptance filling species"
      record_type: "bounded_site_time_flux_records"
      raw_fields: "actual start/end; flooded area/pre-flood land-carbon baseline; levels; species origin; gas kg/flux; surface/downstream pathway; temperature/quality; sampling uncertainty; attribution; unmeasured pathways"
      collection_method: "Measure species flux and water degassing for actual included site/time; retain baseline/attribution and prevent duplicate land-carbon or later-operation accounting. IPCC supports pathway identification only; no default annual coefficient or fixed life"
      unit: "kg; m2; h; m3"
      frequency: "each actual sample/level period"
      temporal_coverage: "real pre-acceptance filling start/end"
      site_scope: "actual inundation/downstream testing interface"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "flux calibration, measured area/time, origin assessment, baseline and uncertainty"
    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "complete accepted reference entity"
      record_type: "as_built_handover"
      raw_fields: "entity/site_id; accepted count; route; surveyed axis length; crest/base and height sections; datum; reservoir/head or bank-retaining use; actual capacity convention; permanent components/interfaces; construction dates; acceptance/defect records"
      collection_method: "Survey as-built geometry and reconcile signed permanent delivery scope, route-specific tests, monitoring baseline and defects/rework; do not infer safety approval from an LCA inventory."
      unit: "item; m; m2; m3 Aggregation details: Record 1 item and sum all assigned work-package quantities per declared reference flow; geometry/capacity are qualifiers, not substitute denominators."
      frequency: "one actual handover plus each recorded correction"
      temporal_coverage: "actual construction start through acceptance"
      site_scope: "exact delivered entity and signed appurtenant interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "signed handover, as-built survey, material/test reports and component inventory"
  calculation_rules:
    - id: entity_basis
      applies_to: "all inventory"
      rule: "q_ref = total attributed exchange quantity / 1 item; all rows are per declared reference flow for the same complete accepted entity. No mean mass per dam, per metre or per capacity is assumed."
      inputs:
        - cp_handover
        - "attributed work-package records"
      output: "row-specific kg, m3, MJ, item or t*km per declared reference flow"
      source_ids:
        - usace-embankment-dams-2004
    - id: wet_dry_state
      applies_to: "earth, aggregate, solids"
      rule: "Dry solid kg = measured wet kg × (1 − actual wet-basis moisture fraction) only when measured on the same material/lot; volume-to-mass = actual volume × measured state-specific density. Do not use soil dry density for wet slurry or default water density."
      inputs:
        - cp_zones
        - cp_batches
        - cp_water
      output: "explicit material-state mass per declared reference flow"
      source_ids:
        - usace-embankment-dams-2004
    - id: energy_conversion
      applies_to: "electricity and fuel"
      rule: "Grid MJ = metered kWh × 3.6. Mass-identity diesel stays kg; litres convert with actual measured supply density. Heating-value calculations require actual fuel-state NCV, not a public generic or mixed-bio default."
      inputs:
        - cp_utilities
      output: "MJ or kg per declared reference flow, preserving original property"
      source_ids:
        - usace-concrete-civil-works-1994
    - id: freight_activity
      applies_to: "road_freight"
      rule: "For each actual leg multiply cargo t by distance km, then sum attributed legs; no assumed mean payload or distance."
      inputs:
        - cp_transport
      output: "t*km per declared reference flow"
      source_ids:
        - usace-embankment-dams-2004
    - id: asset_manufacture
      applies_to: "reusable serialized assets; permanent-route sheet-pile inputs follow cp_sheet_piles"
      rule: "share_j = h_j/H; attributed original-property quantity = original measured quantity × share_j. Track all beneficiaries and prior shares; sum shares ≤ 1. Unknown H or original configuration requires review and missing-burden disclosure."
      inputs:
        - cp_assets
      output: "item or kg manufacture share per declared reference flow"
      source_ids: []
    - id: species_release
      applies_to: "individual mass-based pollutant elementary releases; excludes freshwater_return and seawater_return"
      rule: "Integrate actual compatible concentration × measured release volume for each substance, or use a species/equipment-specific evidenced factor × actual activity. Preserve units, phase, origin, recipient and time. Total NOx cannot be split or treated as NO/NO2 without evidence; PM fractions cannot overlap. Water-carrier returns freshwater_return and seawater_return retain measured Volume/m3 under cp_water; dissolved/suspended pollutants are additional mass rows, not a replacement for water volume."
      inputs:
        - cp_emissions
        - cp_water
      output: "kg per declared reference flow"
      source_ids: []
  data_quality_requirements:
    - id: identity_scope
      applies_to: "reference entity and routes"
      requirement: "Require site, actual purpose, geometry/datum, hydraulic/retaining conditions, route, complete component schedule and signed acceptance; comparison needs compatible functions and interfaces."
      evidence: "cp_handover; as-built survey"
    - id: source_units
      applies_to: "all measurements and identities"
      requirement: "Maintain material states and actual public reference properties/unit groups; validate each supplier geography/voltage/route/gate and Chinese public name. No generic cement strength, sand grade, fuel density or life."
      evidence: "certificates, calibration, actual supplier/gate evidence"
    - id: coverage
      applies_to: "full construction period"
      requirement: "Include all selected work packages, subcontractors, tests, rework, temporary installation/use/removal, site/borrow production, stocks and actual exports. Identify absent versus not measured; quantify uncertainty and missing upstream links."
      evidence: "work-package reconciliation; quantity/water balances"
    - id: review_limits
      applies_to: "construction and environmental interpretation"
      requirement: "Historical sources are qualitative route evidence only. Actual specifications and current competent acceptance records govern this project. LCA checks do not certify dam safety; unresolved identities, shared-asset denominators and unquantified land/noise/ecology pathways remain declared limitations."
      evidence: "original sources and independent methodology review"
validation_rules:
  - rule_id: complete_reference
    applies_to: "declared dataset"
    rule: "One accepted entity output equals the declared reference product name and 1 item, with actual site, surveyed geometry, route, hydraulic/retaining purpose and complete permanent interfaces. No cost-, average-mass-, lifetime- or energy-output substitute."
    source_ids:
      - un-cpc-dams-2025
  - rule_id: inventory_unit_gate
    applies_to: "declared dataset"
    rule: "Each selected exchange is one physical/chemical flow with its correct type, material state, direction and unit; verified identities require exact primary property and supplier/route/compartment fit. Treat non-applicable with evidence, never aggregate labels or silent omission."
    source_ids:
      - usace-concrete-civil-works-1994
  - rule_id: quantities_and_shares
    applies_to: "declared dataset"
    rule: "Reconcile each route material/stock/reject ledger, fill geometry and moisture/density measurements, energy and water balances, real transport legs and serialized reusable shares. Unknown H, unproved conversion or inconsistent reference denominator makes the dataset incomplete and requires review."
    source_ids:
      - usace-embankment-dams-2004
  - rule_id: releases_and_fates
    applies_to: "declared dataset"
    rule: "Verify actual fuel origin and measured species/size/phase/compartment. Captured effluent and sludge cannot masquerade as pure water. Distinguish construction removal from later demolition, and unknown release from zero. Missing required measurements or identities remain inconclusive; do not claim full lifecycle, safety or methodological approval."
    source_ids:
      - epa-concrete-washout-2012
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Construction handover comparison of functionally compatible dam entities at compatible sites/routes/interfaces; verified linked construction-stage input for later water-service/generation models"
  excluded_use: "Full-life storage/generation factor; generic per-kg/metre/capacity dam burden; default reservoir emissions; safety, current compliance or methodology approval"
  required_metadata: "Complete reference qualifiers; actual structural route/geometry; physical quantities/material states; site/time/supply gates; process/component interfaces; measurement/protocols; upstream links; lifecycle stages"
  required_quality_disclosure: "Coverage by actual route, errors/uncertainty; identity gaps, unmeasured releases, unquantified land/noise/ecology, unknown asset H and missing upstream stages; acceptance records do not imply LCA approval"
  update_trigger: "Actual scope/type/geometry/material-source/construction-period or measurement correction; changed component/burden interfaces, identities or quality evidence"
data_sources:
  - id: "un-cpc-dams-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed/PDF p. 280, 53233 and adjacent 53232/53234. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Entity/category boundary; no quantitative inventory evidence."
  - id: "usace-embankment-dams-2004"
    type: "official_guidance"
    reference: "USACE EM 1110-2-2300, General Design and Construction Considerations for Earth and Rock-Fill Dams, 30 July 2004; §§5-1, 6-1–6-3, 9-2, 9-10; PDF pp.35–36,39,63,68; printed 5-1–5-2,6-1,9-1,9-6. https://www.publications.usace.army.mil/Portals/76/Publications/EngineerManuals/EM_1110-2-2300.pdf?ver=2014-04-07-145941-947"
    used_for: "Historical documented foundation, zoned fill, seepage and field-control/as-constructed practices; no design values or current approval generalized."
  - id: "usace-concrete-civil-works-1994"
    type: "official_guidance"
    reference: "USACE EM 1110-2-2000, Standard Practice for Concrete for Civil Works Structures, 1 February 1994, publisher file includes Change 2 of 31 March 2001; §§7-6–7-8,9-1,9-4; PDF pp.68,70,80,88; printed 7-6,7-8,9-1,9-9. https://www.publications.usace.army.mil/Portals/76/Publications/EngineerManuals/EM_1110-2-2000.pdf"
    used_for: "Historical conventional hydraulic concrete preparation, vibration/curing and quality verification; excludes RCC, repair and shotcrete. No recipe/temperature/strength thresholds adopted."
  - id: "usace-rcc-dams-2000"
    type: "official_guidance"
    reference: "USACE EM 1110-2-2006, Roller-Compacted Concrete, 15 January 2000; §§6-1–6-4,6-8; PDF pp.46,48,50,54; printed 6-1,6-3,6-5,6-9. https://www.publications.usace.army.mil/Portals/76/Publications/EngineerManuals/EM_1110-2-2006.pdf?ver=2013-09-04-070814-530"
    used_for: "Historical RCC dam batching, transport, spreading/compaction and joint/waterstop practices; no numerical lift/recipe/productivity adopted."
  - id: "cedd-seawalls-2026"
    type: "official_guidance"
    reference: "Hong Kong CEDD, Port Works Design Manual Part 4, Guide to Design of Seawalls and Breakwaters, April 2026 e-version; §§2.3.1–2.3.5,4.5.1–4.5.2, PDF pp.15–16,27, printed pp.13–14,25. https://www.cedd.gov.hk/filemanager/eng/content_89/p4_combined.pdf"
    used_for: "Qualitative actual retaining-bank, block/caisson, rock armour, seabed dredging/replacement and conditional foundation-treatment operations only; harbour wave-protection/berthing needs separate category review. No universal HK specification, fuel grade, emission factor or lifetime."
  - id: "epa-concrete-washout-2012"
    type: "official_guidance"
    reference: "US EPA, Stormwater Best Management Practice: Concrete Washout, EPA 833-F-11-006, February 2012, pp.1–2. https://www.epa.gov/sites/default/files/2015-11/documents/concretewashout_0.pdf"
    used_for: "Historical process description supports water/slurry/solids containment and actual treatment/reuse interface; no assumed chemistry, pH threshold, recycling percentage or approval."
  - id: "ipcc-flooded-land-2019"
    type: "official_guidance"
    reference: "IPCC, 2019 Refinement to the 2006 IPCC Guidelines for National Greenhouse Gas Inventories, Volume 4 Chapter 7 Wetlands, §7.3, Table 7.7 and origin/pathway distinctions, PDF pp.6–7 / printed 7.6–7.7. https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch07_Wetlands.pdf"
    used_for: "Conditional gas origin/pathway and baseline/attribution review for actual pre-acceptance inundation only; national annual defaults and 20-year categories are not applied directly to this construction event, and establish neither lifetime nor inevitable emissions."
