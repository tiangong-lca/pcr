process_map:
  - id: foundation
    name: "Site preparation, diversion and foundation treatment"
    inclusion: "required"
    inclusion_condition: "Actual excavation, abutment preparation and foundation acceptance; diversion, cofferdam, grouting and cutoffs only when required by the actual design. Include temporary removal at handover."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: marine
    name: "Coastal marine foundation and installation"
    inclusion: "conditional"
    inclusion_condition: "Only when required for the actual coastal retaining embankment: seabed dredging/replacement, retained-ground improvement or staged work, caisson flotation/sinking and armour placement. Include real dredging fate, marine plant/tow, positioning and temporary buoyancy/ballast-water interfaces; not universal requirements."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: embankment
    name: "Zoned earth/rockfill and bank protection"
    inclusion: "conditional"
    inclusion_condition: "Actual earth/rockfill or waterside embankment; borrow processing, zone placement, moisture conditioning, compaction and filters/drains according to real field tests."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: concrete
    name: "Concrete, facing or masonry body construction"
    inclusion: "conditional"
    inclusion_condition: "Actual conventional mass concrete, RCC, concrete-faced rockfill, precast-block or masonry sections; batching/supply, placing, vibration/rolling, joints, temperature control and curing are route-specific."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: fixed
    name: "Permanent sealing, drainage and appurtenances"
    inclusion: "conditional"
    inclusion_condition: "Actual integral seals, membranes, galleries/drains, spillway/outlet controls and monitoring equipment within signed dam interfaces; not independent navigation facilities or an entire power station."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: utilities
    name: "Construction plant, energy and transport"
    inclusion: "required"
    inclusion_condition: "All real work-package operation, site handling, subcontractors and tests; attributable external haul and conserved reusable manufacture as applicable."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: water_environment
    name: "Site water, containment and direct releases"
    inclusion: "required"
    inclusion_condition: "Inventory actual supplied/intake water and every observed waste/release pathway; conditional treatment/export, air species and freshwater/sea discharge. Required assessment does not mean every release occurs."
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: handover
    name: "Verification, temporary removal and entity handover"
    inclusion: "required"
    inclusion_condition: "Actual complete surveyed entity, material/placement and monitoring records, defects/rework and accepted handover state; commissioning water/energy only when in the declared construction period."
    role: "reference_output"
    quantitative_reference: "per declared reference flow"
