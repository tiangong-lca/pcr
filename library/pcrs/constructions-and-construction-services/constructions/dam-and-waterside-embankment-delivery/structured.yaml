product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.constructions.dam-and-waterside-embankment-delivery"
  classification_refs: "CPC 3.0 53233"
  covered_products: "Actual complete accepted dams, similar retaining structures and coastal/other waterside retaining embankments"
  excluded_products: "Exclude construction services, upstream material/equipment manufacture alone, independent navigation locks/harbour breakwaters and quays, independent irrigation/flood-control networks, water-supply canals/pipelines, traffic bridges and complete power stations. An integral dam diversion tunnel or spillway is assessed by the dam delivery interface, not borrowed traffic-tunnel methodology. Borderline coastal structures with harbour navigation or combined flood-control purpose require reviewed component boundaries; count a shared physical component once. This inventory addresses actual construction to handover, not lifetime water services or electricity generation."
  representative_product: "One complete delivered entity with surveyed sections and declared hydraulic/bank-retaining conditions"
  production_route: "Actual foundation, conditional earth/rockfill/concrete/masonry, sealing/drainage and integral appurtenances, tests and handover"
  market_state: "Completed at declared site, actually accepted with recorded handover state"
functional_unit:
  what: "Provide the actual water-retaining/storage/bank-retaining function of the delivered dam or waterside embankment"
  how_much: "One complete accepted entity; surveyed axis length, height/datum, crest/base widths, actual sections/zones, reservoir capacity/convention or bank length/conditions and integral interfaces"
  how_well: "Actual dam type, geology/foundation, material/gradation/configuration, real level/head or retaining/protection conditions and field test/acceptance records; no universal load or compliance approval"
  how_long_or_cycle: "One actual construction-start-to-acceptance handover event and dates; no assumed operational life"
  reference_flow_link: "reference_dam"
system_boundary:
  rules:
    - rule_id: construction_scope
      applies_to: "declared dataset"
      rule: "Collect all actual site preparation, borrow/aggregate processing inside the declared boundary, temporary diversion/foundation/body/fixed-work construction, testing, rework and temporary removal through signed acceptance. Supplier manufacture and actual transport links are separate; a component embedded upstream is not counted again."
      source_ids:
        - usace-embankment-dams-2004
        - usace-concrete-civil-works-1994
        - usace-rcc-dams-2000
    - rule_id: route_completeness
      applies_to: "declared dataset"
      rule: "Required steps follow actual specifications and field records. Do not require a clay core, grout curtain, RCC, drain pipe, cooling system or steel gate universally. Add each actual missing constituent as a chemically/physically specific row, including other binder, aggregate fraction, stone masonry, asphalt core, sheet/cutoff material, joint metal, seal, refrigerant and waste as present; no default quantities."
      source_ids:
        - usace-embankment-dams-2004
        - usace-concrete-civil-works-1994
        - usace-rcc-dams-2000
    - rule_id: adjacent_interfaces
      applies_to: "declared dataset"
      rule: "Declare integral spillway/outlet/diversion galleries and actual initial filling/test boundary. Exclude independent canals, navigation locks/breakwaters, traffic bridges, powerhouses, independent turbines and complete generating plants. A signed contract alone cannot bring them into the dam category; only shared physical dam-body/foundation components with reviewed actual dam function can be attributed once across explicit interfaces. Coastal retaining banks remain in scope; a combined port/flood-control project requires component applicability review and no duplicate counting."
      source_ids:
        - un-cpc-dams-2025
    - rule_id: later_stages
      applies_to: "declared dataset"
      rule: "Later operation, maintenance, renewal, operating-reservoir inundation/biogeochemical emissions, power generation, later dam removal and final material fate are separately modelled stages, excluded from this construction handover inventory. Actual pre-acceptance initial filling/testing stays inside its declared site/time boundary, including measured water/energy and relevant inundation, land-carbon and release pathways. Record actual beginning/end, flooded extent, baseline and monitoring; missing measurements stay explicit and inconclusive. Do not move these construction-test impacts into excluded operation merely because they occur in a reservoir. Include actual preconstruction demolition and temporary decommissioning only as declared work packages. No complete life-cycle or cradle-to-gate claim without verified stage coverage/upstream links."
      source_ids:
        - usace-embankment-dams-2004
        - ipcc-flooded-land-2019
    - rule_id: water_releases
      applies_to: "declared dataset"
      rule: "Separate supplied technical water, natural resource withdrawal, throughflow, internal recirculation, captured effluent, treatment and actual release. Never replace effluent by a water-resource exchange. Retain actual noise/vibration, turbidity/sediment, site occupation and pre/post land/ecology observations; dB is not a mass emission and monitoring alone is not quantified LCIA. Unmeasured relevant pathways remain explicit gaps."
      source_ids:
        - epa-concrete-washout-2012
boundary_abstraction:
  declared_starting_condition: "Actual preconstruction site and supplied material/equipment at explicit received state/gate; onsite borrow processing expressly bounded"
  starting_condition_role: "foreground_starting_point"
  product_classification_scope: "Complete dam or waterside retaining embankment entity within declared component interfaces"
  recursive_input_rule: "Record received state, inherited burden and new interventions once for existing dam sections/reused retaining components; do not recursively rebuild the same entity"
  upstream_dataset_requirement: "Verify/link material/component manufacturing gates, actual transport and equipment manufacture attribution separately; missing links disclosed, no complete cradle-to-gate claim"
  disclosure: "All actual construction to acceptance; conditional temporary removal/initial filling tests; operation/maintenance/renewal, reservoir operation, later dam removal and final fate separately declared uncovered"
