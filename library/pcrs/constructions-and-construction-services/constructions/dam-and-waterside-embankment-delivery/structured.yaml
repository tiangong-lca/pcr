    required_unit: "item"
    rule: "cp_handover records 1 item complete accepted entity; all protocols, rows and calculations use per declared reference flow, without assigning a dam mass."
  - id: physical_states
    applies_to: "mass-based material, liquid and waste exchanges"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Retain each row state/property; volume-to-kg requires same-lot/state measured density and wet/dry conversion needs actual moisture basis; entity geometry does not imply material mass. Volume-based exchanges, including fresh ready-mixed concrete, dewatering effluent and concrete washout liquid, retain Volume/m3. Any auxiliary kg closure is a separate linked record supported by measured same-lot/state density; it does not replace their native volume exchange."
  - id: water_volume
    applies_to: "resource intake and volume rows"
    required_property_ref:
