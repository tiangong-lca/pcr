  methodology_review:
    state: pending_independent_review
    scope: Complete delivered dam and coastal/other waterside retaining embankment scope, actual route and interfaces; field geometry/hydraulic function, material states and conditional steps; upstream supply gates; site emissions/water/waste and unmeasured land/noise/ecology; serialized reusable manufacture share conservation and real denominator evidence.
  evidence_limitations:
    - Historical USACE/EPA documents are qualitative documented process evidence; no numerical design, recipe, density, productivity, life, or legal approval adopted.
    - CEDD seawall evidence is limited to bank-retaining coastal configurations, not all harbour facilities.
    - No universal quantitative ranges are established; actual engineering measurements and project specification/acceptance evidence required.
    - Reference product UUID intentionally unresolved despite available Count support; composite hydropower-hub identity is semantically too broad.
    - CN LV/MV electricity selected only under actual CN user-gate location and matching voltage. Treated process-water Mass/kg requires actual treatment/quality and supply gate; HK plant-gate tap water is not generic site supply.
    - Actual pre-acceptance initial filling/inundation stays inside the declared construction/test boundary with conditional origin-verified CH4/CO2 and baseline/land/water effects; unknown relevant paths remain inconclusive. IPCC national annual defaults/age categories are not construction-event factors.
    - LCA shared-asset attribution and species integration are explicit foreground protocols requiring actual quantities/beneficiaries and supported denominators, not formulas prescribed by cited engineering manuals.
