review_metadata:
  scientific_review: pending
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  semantic_boundary_decision: Complete accepted bridge/elevated highway entity
    requires actual foundation, span/deck, erection, temporary works and
    delivery geometry methodology. Existing
    bridge/component/construction-service records are empty scaffolds;
    material/building and batch road/rail/runway methods do not cover this
    complete entity. Retained scaffold is unchanged. No accepted mapping
    created.
  unresolved_flow_identities:
    - row_id: soil_export
      flow_name: Non-contaminated excavated mineral soil for disposal
      reason: Bounded public candidate lookup has not established the exact material,
        state and construction role; retain the specific exchange and resolve
        against actual project evidence.
    - row_id: stone_fill
      flow_name: Crushed stone foundation backfill
      reason: Artificial stone and gravel/sand candidates do not establish the actual
        crushed-stone grading and supplied backfill state.
    - row_id: pile
      flow_name: Fabricated steel tubular foundation pile
      reason: Public pile-foundation steel-pipe column mixes vertical-column and
        concrete-filled-column semantics; actual driven hollow steel pile and
        embedded-concrete boundary are not established.
    - row_id: concrete
      flow_name: Ready-mixed structural concrete before placing
      reason: Cast-in-place concrete identifies an installed state; it is not the
        supplied ready-mixed input before placement.
    - row_id: formwork
      flow_name: Plywood formwork panel
      reason: Mass/Volume plywood identities require measured thickness/density or
        actual panel mass to convert to this area row; no supported panel
        conversion is assumed.
    - row_id: sheet_pile
      flow_name: Reusable steel cofferdam sheet pile
      reason: Installed impermeable PRB funnel is a remediation structure with
        source-defined length, not a reusable steel cofferdam sheet pile.
    - row_id: steel_girder
      flow_name: Fabricated structural steel bridge girder
      reason: Public bridges/bridge-sections/towers class is not one fabricated bridge
        girder with the actual member geometry and supplied scope.
    - row_id: precast_girder
      flow_name: Prestressed precast concrete bridge girder
      reason: Generic pre-cast concrete does not establish one complete prestressed
        bridge girder and embedded steel/anchor scope.
    - row_id: timber_member
      flow_name: Finished structural timber bridge beam
      reason: Sawmill sawnwood identities are not finished graded/treated structural
        bridge beams; measured member state and volume conversion remain
        project-specific.
    - row_id: masonry_stone
      flow_name: Cut natural stone bridge voussoir
      reason: Artificial stone and rock-wool candidates do not identify a cut natural
        stone arch voussoir.
    - row_id: strand
      flow_name: Prestressing steel strand
      reason: General steel wire and strip do not establish prestressing strand
        construction, grade and treatment.
    - row_id: stay_cable
      flow_name: Finished steel bridge stay cable
      reason: General steel wire/rod candidates do not establish a finished stay cable
        with actual sheathing and anchorage scope.
    - row_id: anchor
      flow_name: Steel prestressing anchorage
      reason: Wind flange and unfinished fastener parts are not finished prestressing
        anchors.
    - row_id: grout
      flow_name: Cementitious prestressing duct grout
      reason: Grout-curtain foundation service is not supplied cementitious
        prestressing duct grout of the actual formulation.
    - row_id: bolt
      flow_name: High-strength structural steel bolt
      reason: Generic fasteners and screws do not identify one finished high-strength
        structural bolt with actual grade.
    - row_id: weld_wire
      flow_name: Steel flux-cored welding wire
      reason: Public flux-cored wire describes self-shielded all-position single-pass
        carbon-steel welding; actual bridge welding specification is not fixed
        to that route.
    - row_id: bearing
      flow_name: Laminated elastomeric bridge bearing
      reason: Rubber resin and styrene-butadiene rubber do not identify a complete
        laminated bridge bearing; other bearing variants are distinct.
    - row_id: joint
      flow_name: Steel bridge expansion joint
      reason: Junction boxes, feed-grade binder and generic seal components are not
        finished steel bridge expansion joints.
    - row_id: waterproof
      flow_name: Bituminous bridge-deck waterproofing sheet
      reason: Public membrane description concerns roofing and generic
        asphalt/coal-tar variants; it does not establish the actual bridge-deck
        composition and installation specification.
    - row_id: railing
      flow_name: Fabricated steel bridge railing panel
      reason: Steel bridge sections and generic fabricated structures do not establish
        a completed railing panel with actual restraint function.
    - row_id: drain
      flow_name: Polyvinyl chloride bridge drainage pipe
      reason: PVC resin and Dover pump-and-treat case-specific PVC pipe do not
        establish actual bridge drainage pipe state/specification.
    - row_id: mains_water
      flow_name: Treated mains water supplied to construction site
      reason: Public natural water and route/geography-specific water candidates do
        not establish treated mains supply to this construction site.
    - row_id: concrete_waste
      flow_name: Hardened concrete construction offcut
      reason: Mixed construction waste does not identify segregated hardened concrete
        construction offcut.
    - row_id: steel_waste
      flow_name: Steel construction offcut for recycling
      reason: At-plant scrap and processed recovered-steel products are different
        gates from exported steel construction offcut.
    - row_id: washwater
      flow_name: Contained concrete-equipment washwater for treatment
      reason: Manganese-slag washing wastewater is a different process; no exact
        construction-concrete washwater public identity was established.
    - row_id: reference_bridge
      flow_name: Completed bridge or elevated highway
      reason: Direct public bridge identity is Mass at a manufactured at-plant gate;
        no evidence establishes conversion to one complete site-accepted entity.
        Do not rewrite public property to count or force kg normalization.
    - row_id: structure_concrete
      flow_name: Ready-mixed structural concrete before placing
      reason: Cast-in-place concrete identifies an installed state; it is not the
        supplied ready-mixed input before placement.
    - row_id: deck_concrete
      flow_name: Ready-mixed structural concrete before placing
      reason: Cast-in-place concrete identifies an installed state; it is not the
        supplied ready-mixed input before placement.
  limitations:
    - Independent scientific and unit review pending; no publication or
      methodology approval.
    - Conditional examples are not a universal recipe. Other actual
      exchanges/routes must be recorded individually.
    - No default lifetime, load, material ratios, losses or mass per
      entity/km/m2.
    - Construction-to-handover foreground only; upstream completeness and later
      life stages not established.
