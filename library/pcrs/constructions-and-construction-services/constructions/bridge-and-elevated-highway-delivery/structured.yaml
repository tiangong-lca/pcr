allocation_rules:
  - rule_id: partition_first
    applies_to: "all processes"
    rule: "Separate work packages, equipment meters, deliveries and shared assets before allocation. Direct measured activity is preferred; allocate only unresolved shared quantities with documented causal machine-hours, load, distance or actual work quantities from cp_assets, and preserve a balance. No default cost or mass shares."
    source_ids: []
  - rule_id: reuse_conservation
    applies_to: "temporary; utilities"
    rule: "For each reusable form, cofferdam member, crane or launching asset, preserve one manufacture-burden ledger across projects, periods and uses. Cumulative allocated fraction must not exceed one; service denominator needs actual cumulative activity or source-supported life. Unknown denominator requires review. Operation and consumable loss are measured separately; do not reset manufacture to 100% every project."
    source_ids: []
  - rule_id: waste_gate
    applies_to: "waste; ground"
    rule: "Retain waste at actual export gate and distinguish reuse, recycling, treatment and disposal. No automatic avoided-material credit. If shared outputs require allocation, justify the actual relation and disclose sensitivity; no assumed scrap price/yield."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Manufacture inputs for shared equipment and reusable components retain the manufacturing dataset’s actual native reference property: mass, count or area as applicable. For formwork distinguish deployed panel area from the reusable panel stock and its dimensionless manufacture share f. If manufacture is natively per m2, the attributed area exchange is measured same-configuration panel stock area A multiplied by f, not each pour’s full deployed area. If upstream manufacture is per kg or item, link that same stock area to independently measured mass M (kg/m2 = M/A) or panel count N (item/m2 = N/A), recording panel ID, dimensions, thickness, state and source inventory; multiply the corresponding stock quantity by the same f once. Keep installation/use records separate from the manufacture exchange and never add both native-area and converted manufacture burdens. cp_assets stores the stock quantity, conversion evidence, upstream reference and fraction; unsupported conversions require review, with no default density or panel mass. cp_assets retains the actual beneficiary entity count and cumulative cross-project fractions; equipment mass never changes the bridge reference flow. Unknown lifetime, cumulative activity or beneficiary relation requires review, not a zero burden."
    source_ids: []
