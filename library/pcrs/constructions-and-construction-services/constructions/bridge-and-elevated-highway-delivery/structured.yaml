  - id: deck
    name: "Bearings, deck, surfacing and fixed bridge works"
    inclusion: "required"
    inclusion_condition: "Actual complete delivered deck configuration; conditional bearings/joints/waterproofing, restraints, drainage, fixed lighting and rail-specific works"
    role: "foreground"
    quantitative_reference: "per declared reference flow"
  - id: utilities
    name: "Equipment, site utilities and direct environment exchanges"
    inclusion: "required"
