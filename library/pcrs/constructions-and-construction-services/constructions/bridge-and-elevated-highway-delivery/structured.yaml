    quantitative_reference: "per declared reference flow"
  - id: temporary
    name: "Temporary works installation, use and removal"
    inclusion: "conditional"
    inclusion_condition: "Actual forms, falsework, shoring, cofferdam and launching support; reusable asset manufacture and operation distinguished"
