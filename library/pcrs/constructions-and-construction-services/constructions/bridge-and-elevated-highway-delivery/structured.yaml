validation_rules:
  - rule_id: validate_entity
    applies_to: "reference_bridge"
    rule: "Require one accepted whole entity with all reference qualifiers, actual surveyed geometry, span/approach interfaces and declared traffic use; partial span/material-kit data cannot claim this reference product."
    source_ids:
      - un-cpc-bridges-2025
  - rule_id: validate_basis
    applies_to: "all rows"
    rule: "All numerator properties/units, output 1 item, protocols and calculations must use the same declared reference flow; reject unsupported conversions or nonconserved reusable-asset shares."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "dataset"
    rule: "Check actual foundation/substructure, superstructure, temporary erection support, deck/fixed works, transport, utilities, waste and handover against as-built work packages. Every actual exchange must be atomic and collected; absence requires evidence, unknown scope requires review."
    source_ids:
      - fhwa-fp24-bridges
  - rule_id: validate_environment
    applies_to: "utilities; waste"
    rule: "Check species/fossil origin, immediate versus long-term, medium/submedium and actual route. Contained waste is not environmental discharge; diesel combustion and embedded upstream combustion cannot both be charged. NO, NO2, N2O and PM size fractions remain distinct."
    source_ids:
      - epa-concrete-washout-2012
      - epa-construction-dust-2010
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Construction-to-handover inventory of the declared complete bridge/elevated highway; compatible upstream linking; comparisons only with matched actual function, geometry, performance and scope"
  excluded_use: "Full lifetime or traffic operation; default maintenance/demolition; automatic upstream completeness; kg/km/m2 proxy bridge; design/legal/methodology approval"
  required_metadata: "Reference qualifiers, construction dates, routes, work-package coverage, material supplier gates, geometry and fixed scope, property/unit evidence, allocations and environmental coverage"
  required_quality_disclosure: "Identity/evidence gaps, uncertainty, unmetered stages, missing background/upstream, excluded later stages and review limitations"
  update_trigger: "Changed entity function/geometry, structural or foundation route, delivered scope, supplier gate, actual inventory or evidence/identity"
