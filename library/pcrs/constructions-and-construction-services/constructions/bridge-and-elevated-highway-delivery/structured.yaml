    - id: normalize
      applies_to: "all inventory rows"
      rule: "Aggregate each attributable atomic exchange for the same complete entity: q_ref = q_total / N with N = 1 accepted entity. Keep raw property/unit; no normalization by arbitrary mass, area, cost or lifetime."
      inputs:
        - cp_ground
        - cp_foundation
        - cp_temporary
        - cp_structure
        - cp_deck
        - cp_utilities
        - cp_waste
        - cp_transport
        - cp_handover
      output: "per declared reference flow"
      source_ids: []
    - id: electricity
      applies_to: "lv_power; mv_power"
      rule: "E_MJ = E_kWh * 3.6"
      inputs:
        - cp_utilities
      output: "MJ per declared reference flow"
      source_ids: []
    - id: liquid_mass
      applies_to: "diesel"
      rule: "m_kg = V_L * rho_kg_per_L at documented temperature and fuel state; preserve diesel Mass. LHV may characterize use but does not rewrite flow property."
      inputs:
        - cp_utilities
      output: "kg per declared reference flow"
      source_ids: []
    - id: freight
      applies_to: "road_freight"
      rule: "Sum cargo mass in t times actual route distance in km for each attributed leg; reconcile allocation/empty-return model and upstream included transport."
      inputs:
        - cp_transport
      output: "t*km per declared reference flow"
      source_ids: []
    - id: emission_quantification
      applies_to: "elementary outputs"
      rule: "Use each measured species release or verified project-specific engine/dust model. Fossil CO2: measured fossil carbon * documented oxidized fraction * 44/12; retain fuel chemistry and uncertainty. NOx totals do not define molecular NO/NO2; PM fractions are disjoint. No universal factors supplied."
      inputs:
        - cp_utilities
      output: "kg per declared reference flow"
      source_ids: []
    - id: asset_fraction
      applies_to: "temporary; utilities"
      rule: "Attributable manufacture burden = asset manufacture burden * documented use fraction; reconcile cumulative fractions across all projects ≤ 1, no resetting or unsupported life."
      inputs:
        - cp_assets
      output: "attributed burden per declared reference flow"
      source_ids: []
