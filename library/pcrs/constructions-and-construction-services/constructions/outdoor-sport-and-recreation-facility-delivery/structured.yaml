system_boundary:
  rules:
    - rule_id: b_delivery
      applies_to: "foreground_system_boundary"
      rule: "Include actual preparation, selected drainage/surfaces/planting/structures/installations, utilities/logistics/testing/correction through declared final acceptance including contractual establishment. Select the real complete configuration and evidence absent alternatives."
      source_ids:
        - un-cpc3-2025
        - cedd-landscape-2026
        - se-natural-2025
    - rule_id: b_consumed_inputs
      applies_to: "foreground_system_boundary"
      rule: "All purchased input rows retain actual attributable consumption, including damage, rejects, cutoffs and replacements before final acceptance. Local installed/applied/planted wording identifies intended route/configuration and has this explicit exception for consumed pre-installation or establishment losses; it does not restrict inputs to successful installation. In native units reconcile gross attributable receipts + opening stock - verified returns/transfers - closing reusable stock, keeping installed/accepted quantities and actual waste separate. Preserve exact supplied state and assembly boundaries; do not add embedded constituents again.  The stock-consumption equation applies to consumed materials/components, not to manufacturing-share rows under cp_reuse. In particular excavator_capital and timber_formwork retain actual asset mass times their supported conserved manufacture share under c_share even when the physical asset is returned, transferred or held as reusable closing stock; keep physical movements separate and never charge both full consumed manufacture and a share for the same asset."
      source_ids: []
    - rule_id: b_supplied_state
      applies_to: "foreground_system_boundary"
      rule: "Material and assembly manufacture are separate upstream links at actual supplied gates. Onsite concrete batching, soil stabilization, hydroseeding, rubber mixing, welding/coating need actual ingredients/equipment/releases separately; do not charge complete purchased assembly plus its embodied ingredients."
      source_ids:
        - se-artificial-2013
        - cedd-landscape-2026
    - rule_id: b_interfaces
      applies_to: "foreground_system_boundary"
      rule: "Integral works count once. Independent complete building/road/harbour/pipeline/cable works need bounded upstream interfaces; their methods may inform components but do not replace complete recreation-facility methodology. Retained assets are starting stock."
      source_ids:
        - un-cpc3-2025
        - epa-marina-2001
    - rule_id: b_environment
      applies_to: "foreground_system_boundary"
      rule: "Separate supply/abstraction/discharge/treatment liquid and waste sediment/plume. Actual contaminants, infill losses, chemical releases and soil/land-use carbon require evidence and individual rows. Noise/vibration/habitat/occupation need independently bounded assessment; unmeasured is not zero."
      source_ids:
        - epa-marina-2001
        - epa-heavy-construction-1995
    - rule_id: b_later
      applies_to: "foreground_system_boundary"
      rule: "Default excludes post-acceptance sport/visitor/boat operation, husbandry, routine irrigation/mowing/fertilizing, maintenance dredging, future surface/plant/equipment replacements and demolition. Extensions need actual time/activity/replacement/removal/destination inventory without default life. Pre-acceptance establishment/removal/rework included."
      source_ids:
        - cedd-landscape-2026
        - epa-marina-2001
        - defra-zoo-2012
    - rule_id: b_extensions
      applies_to: "foreground_system_boundary"
      rule: "Cards are specific candidate routes, not every facility BOM. Before dataset completeness, cover all actual sports/racing/golf/park/garden/beach/zoo/botanical/marina requirements; add each other taxon, surface/marking/joint material, civil assembly, equipment, chemical, packaging, waste and release atomically. UUID gaps cannot justify scope narrowing."
      source_ids:
        - un-cpc3-2025
        - se-artificial-2013
        - defra-zoo-2012
