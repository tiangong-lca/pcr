allocation_rules:
  - rule_id: a_direct
    applies_to: "foreground_burden_allocation"
    rule: "Use cp_material; cp_material_drainage; cp_material_surface; cp_material_landscape; cp_material_structure; cp_material_services/cp_energy/cp_transport to assign measured task/location/lot records before shared allocation. Use actual submetering or supported causal activity for shared plant/utilities; disclose residual and denominator. Cost/area is not automatically appropriate."
    source_ids: []
  - rule_id: a_reuse
    applies_to: "foreground_burden_allocation"
    rule: "Use cp_reuse as a persistent machine/formwork/component ledger across projects/periods/reuse scenarios; supported activity/service denominator and manufacture shares summing≤1 for same asset. Unknown denominator stays review. Do not restart full manufacture per project; loss/retirement/refurbishment separately evidenced."
    source_ids: []
  - rule_id: a_destination
    applies_to: "foreground_burden_allocation"
    rule: "Same-site reuse is internal transfer; external beneficial-use and disposal destinations are exclusive per portion. No automatic avoided virgin material/recycling/biogenic-carbon credit. Extended credits need reviewed method, equivalence and conservation."
    source_ids:
      - cedd-landscape-2026
      - epa-marina-2001
