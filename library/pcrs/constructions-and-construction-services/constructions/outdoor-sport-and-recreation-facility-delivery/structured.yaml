measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Exactly 1 item complete accepted facility, collected with cp_handover; all inventory/protocols per declared reference flow."
  - id: physical_records
    applies_to: "materials and geometry"
    required_property_ref:
      name: "Mass; Volume; Area; Length; Number of items"
      uuid: ""
    required_unit: "kg; m3; m2; m; item"
    rule: "Measured/certified deliveries/geometry; volume/area-to-mass needs same-material/state measured density/areal mass, no invented facility mass. Number of items/item applies to live planting materials garden_tree and garden_shrub under cp_plant; retain actual species, specification and counted quantity. Mass/kg, volume/m3, area/m2 and length/m apply only to matching native quantities. Convert only with measured applicable evidence; do not force living plants into mass or geometry."
  - id: energy_property
    applies_to: "electricity and diesel"
    required_property_ref:
      name: "Net calorific value ; Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ; kg"
    rule: "Electricity MJ, metered kWh times 3.6; diesel kg, volume-to-mass needs batch density. Property coefficients are not physical density/heat content."
  - id: cable_length
    applies_to: "cable"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "Preserve public Length/m; reconcile installed/cut/return length, never rewrite to Mass."
  - id: water_state
    applies_to: "water interfaces"
    required_property_ref:
      name: "Volume ; Mass"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3; kg"
    rule: "Conserve volume ledger separately; sea-resource primary Mass/kg needs weighing or supported same-salinity/temperature density, discharge Volume/m3; constituents separate."
