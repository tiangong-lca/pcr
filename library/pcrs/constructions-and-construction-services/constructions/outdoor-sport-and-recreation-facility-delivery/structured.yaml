  calculation_rules:
    - id: c_project
      applies_to: "all inventory rows"
      rule: "Reconcile each actual attributable task/lot once for the single declared reference flow, retaining each physical unit and stocks/returns/installed/waste destinations; no division by assumed facility mass/life"
      inputs:
        - cp_handover
        - cp_material
        - cp_material_drainage
        - cp_material_surface
        - cp_material_landscape
        - cp_material_structure
        - cp_material_services
        - cp_plant
        - cp_services
        - cp_energy
        - cp_water
        - cp_release
        - cp_waste
        - cp_waste_support
        - cp_waste_handover
        - cp_transport
        - cp_reuse
      output: "Exchange per declared reference flow"
      source_ids:
        - un-cpc3-2025
    - id: c_state
      applies_to: "Material state conversion"
      rule: "Volume-to-mass needs same-material/state measured density; area-to-mass needs same-product measured areal mass. Preserve moisture/temperature/salinity, units and uncertainty; retain original units if unproved"
      inputs:
        - cp_material
        - cp_material_drainage
        - cp_material_surface
        - cp_material_landscape
        - cp_material_structure
        - cp_material_services
        - cp_water
      output: "Traceable physical quantity, never fabricated facility mass"
      source_ids:
        - cedd-landscape-2026
    - id: c_energy
      applies_to: "Electricity conversion"
      rule: "Metered kWh multiplied by 3.6 gives MJ; preserve adopted Net calorific value. Diesel here is Mass/kg and is not automatically converted to energy"
      inputs:
        - cp_energy
      output: "Measured MJ per declared reference flow"
      source_ids: []
    - id: c_release
      applies_to: "Specific releases"
      rule: "Use substance/fraction-resolved measurement or independently reviewed matching activity-factor model; integrate net flux over actual time with background correction. Concentration/NTU/dB/excavated mass alone is not release mass"
      inputs:
        - cp_release
        - cp_water
        - cp_energy
      output: "Specific substance-medium exchange; unsupported basis remains review"
      source_ids:
        - epa-marina-2001
        - epa-heavy-construction-1995
    - id: c_share
      applies_to: "Equipment/temporary manufacture"
      rule: "Actual asset manufacture inventory times supported causal activity share from persistent ledger; preserve physical mass and cumulative shares≤1 across projects/periods/reuses. Unknown denominator remains review"
      inputs:
        - cp_reuse
      output: "Supported manufacture inventory per declared reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_entity
      applies_to: "reference entity"
      requirement: "Same site/perimeter/function/measured geometry/configuration/complete acceptance/establishment; no fabricated mass/life/recipe/certification"
      evidence: "cp_handover"
    - id: dq_material
      applies_to: "each material/waste"
      requirement: "Traceable lot/composition/state/gate/physical quantity/destination; disclose identity/range evidence gaps"
      evidence: "cp_material; cp_material_drainage; cp_material_surface; cp_material_landscape; cp_material_structure; cp_material_services; cp_plant; cp_services; cp_waste; cp_waste_support; cp_waste_handover"
    - id: dq_environment
      applies_to: "environmental inventory"
      requirement: "Actual receiver/species/fraction/time/representativeness; separate contaminants, unmeasured not zero, dB/NTU not forced to exchange quantity"
      evidence: "cp_water; cp_release"
    - id: dq_reuse
      applies_to: "reused equipment/components"
      requirement: "Persistent cross-project physical ledger/supported denominator/cumulative shares≤1; unknown life/activity requires review"
      evidence: "cp_reuse"
    - id: dq_completeness
      applies_to: "project package"
      requirement: "All actual routes/tasks/exchanges, individual non-applicability and separate upstream/downstream/measurement/identity coverage; candidate checks do not establish actual measured data/scientific approval"
      evidence: "actual BOM/task ledger; cp_handover"
validation_rules:
  - rule_id: v_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require one actual complete accepted configuration, site/perimeter/use, measured geometry and final establishment/acceptance endpoint; output exactly 1 item with same reference product. Not a material bundle or construction service."
    source_ids:
      - un-cpc3-2025
  - rule_id: v_route
    applies_to: "foreground_dataset_conformance"
    rule: "Verify required support/handover and each occurring conditional task from drawings/ledger/BOM/tests. Cover all actual components, equipment, utilities, establishment/rework/logistics/waste; unseen branches cannot be claimed complete."
    source_ids:
      - se-natural-2025
      - se-artificial-2013
      - cedd-landscape-2026
      - defra-zoo-2012
      - epa-marina-2001
  - rule_id: v_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Adopted UUIDs must match actual substance/state/origin/route/geography/medium/time and reference property/unit. Chinese name is official baseName. Cable remains Length/m, sea intake Mass/kg, discharge Volume/m3 with matching receiver. Unresolved identities remain explicit."
    source_ids:
      - un-cpc3-2025
  - rule_id: v_basis
    applies_to: "foreground_dataset_conformance"
    rule: "Consistent per-declared-reference-flow inventory/protocol basis, verified physical conversions, supplied/site interfaces, stock/waste balance and conserved reuse shares; inconclusive relationships stay review."
    source_ids:
      - cedd-landscape-2026
  - rule_id: v_release
    applies_to: "foreground_dataset_conformance"
    rule: "No fabricated compulsory dust/exhaust or clean/zero-pollution water. Verify NO versus NO2/NOx, disjoint PM fractions, actual external transfer, correct fresh/sea receiver and separately monitored constituents. Disclose uncharacterized noise/habitat/land carbon."
    source_ids:
      - epa-heavy-construction-1995
      - epa-marina-2001
  - rule_id: v_coverage
    applies_to: "foreground_dataset_conformance"
    rule: "Report checks, findings, omissions and measurement/identity/route/stage coverage separately. Upstream links do not make this whole-life/complete cradle-to-gate/comparative-equivalence methodology; technical candidate checks grant neither scientific approval nor publication."
    source_ids:
      - un-cpc3-2025
published_dataset_profile:
  dataset_role: "Foreground construction/accepted facility entity record"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Matched site/function/configuration and declared construction-delivery boundary; full life requires independent evidenced upstream/downstream stages"
  excluded_use: "Unqualified full-life/complete cradle-to-gate/comparative equivalence; operational/husbandry service; assumed mass/life/recipe/certification/legal approval"
  required_metadata: "Reference measured geometry/configuration; all routes/tasks; supply/transport; dates/acceptance/establishment; taxa/material states; grid/voltage; water resource/receiver; ledger/protocols; reuse shares; external links"
  required_quality_disclosure: "Measured/modelled evidence/uncertainty/identity-range gaps; route/stage coverage; uncharacterized noise/habitat/land carbon/water contamination/missing releases; scientific review governed by metadata"
  update_trigger: "Changed function/site/configuration/layers/taxa/supply/acceptance-establishment/water receiver/reuse denominator or new actual evidence/identity"
