  identity_limitations:
    - Reference product unresolved registered exactly as finished_facility with
      identical reference/output name.
    - Every adopted exchange retains applicability conditions in bilingual
      content and original reference property/unit.
    - Artificial-carpet and both silica-sand bindings withheld after independent
      public-original quality review. Keep physical rows/true Mass property,
      independently verify supplier route/BOM/gradings; no default
      life/safety/recipe or full supply-chain approval.
  methodology_limitations:
    - Actual alternative taxa/materials/installed technologies must be added
      atomically before a project package claims completeness.
    - Site-delivery module; separately declared upstream coverage, later
      operation/replacement/demolition not quantified.
    - Uncharacterized noise/vibration/habitat/occupation/land carbon or
      contaminant releases are explicit gaps, not zero.
    - Scientific review pending, no publication or methodological approval.
  allocation_basis: Prospective physically measured foreground attribution and
    conservation rules implemented by
    cp_material/cp_energy/cp_transport/cp_reuse. CEDD landscape text supports
    physical construction/establishment records, not the LCI manufacturing-share
    formula.
  identity_quality_findings:
    - finding_id: synthetic-carpet-public-identity-quality
      status: pending_review
      candidate_uuid: 6dafa8b7-0030-419e-8744-711c49ad7352
      affected_row_ids:
        - artificial_carpet
      public_type: Product flow
      reference_property: Mass
      classification_finding: CPC03249 is forestry ornamental plant material,
        inconsistent with described synthetic carpet.
      unsupported_claims:
        - 20-year-plus universal life
        - safe for children and pets
        - non-toxic materials
      supplier_bom_compatibility: not_established
      decision: uuid_withheld; retain physical synthetic carpet exchange; not a living
