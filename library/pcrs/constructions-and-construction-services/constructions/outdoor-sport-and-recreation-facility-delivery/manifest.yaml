  semantic_boundary: Complete accepted outdoor sport/recreation civil facility
    with actual sport/racing, golf, beach, marina, park/garden or
    zoological/botanical configuration; construction through final acceptance
    including contractual establishment.
  reuse_assessment: Current/integration material libraries and batch jobs contain
    no complete outdoor recreation-facility methodology.
    Building/road/harbour/pipeline/cable methods can inform bounded component
    interfaces; their burdens counted once.
  unresolved_flow_identities:
    - row_id: imported_fill
      name: Clean graded mineral soil for fill
      reason: Generic or remediation-specific soil candidates do not verify clean
        graded imported engineering fill and project contamination/compaction
        state. Bounded search is not evidence that the database lacks a suitable
        identity.
      evidence_query: reusesoil
    - row_id: topsoil
      name: Screened horticultural topsoil
      reason: No adopted candidate verifies screened horticultural topsoil
        composition, contamination and supplied planting state. Bounded search
        is not evidence that the database lacks a suitable identity.
      evidence_query: topsoil
    - row_id: soil_waste
      name: Non-hazardous excavated mineral soil for disposal
      reason: Inspected excavated-soil alternatives represent contaminated
        case-specific product interfaces rather than this segregated
        non-hazardous disposal waste. Bounded search is not evidence that the
        database lacks a suitable identity.
      evidence_query: soil
    - row_id: sediment_waste
      name: Non-hazardous marine dredged mineral sediment, wet
      reason: No adopted candidate verifies non-hazardous wet marine capital-dredged
        mineral sediment and disposal interface. Bounded search is not evidence
        that the database lacks a suitable identity.
      evidence_query: sediment
    - row_id: drain_pipe
      name: Perforated high-density polyethylene land-drain pipe
      reason: Direct-read generic Plastic pipes 554160db-a4c7-4728-87d7-0c72981e69cf
