        not evidence that the database lacks a suitable identity.
      evidence_query: drainage
    - row_id: drain_gravel
      name: Washed angular mineral drainage gravel
      reason: Adopted crushed-stone 16/32 subbase identity does not establish washed
        angular drainage gravel with the project grading/percolation condition.
        Bounded search is not evidence that the database lacks a suitable
        identity.
      evidence_query: gravel
    - row_id: geotextile
      name: Nonwoven polypropylene separation geotextile
      reason: Direct-read Non-woven fabric 6b35ed69-0eb9-4c4a-902e-bdc43eeef146 does
        not verify polypropylene separation/filter geotextile and its supplied
        performance. Bounded search is not evidence that the database lacks a
        suitable identity.
      evidence_query: geotextile
    - row_id: irrigation_pipe
      name: High-density polyethylene irrigation pressure pipe
      reason: Generic plastic pipes do not establish actual HDPE pressure class or
