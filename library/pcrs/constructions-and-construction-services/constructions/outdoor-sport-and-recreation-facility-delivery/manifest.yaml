    - row_id: artificial_carpet
      name: Artificial grass carpet
      reason: Public Artificial Grass candidate is Product/Mass with synthetic
        description but conflicting CPC03249 forestry/ornamental-plant
        classification and unsupported general 20-year/safe/non-toxic claims. No
        actual supplier BOM, physical component-inclusion scope and
        manufacturing-interface compatibility evidence establishes this complete
        synthetic carpet. UUID withheld; physical synthetic-carpet row and
        Mass/kg retained; supplier/BOM and source-quality review required.
    - row_id: drain_sand
      name: Silica sand
      reason: Public silica-sand candidate treatmentStandardsRoutes says crushing and
        magnetic separation in English but 破碎设备、洗沙 in Chinese; routes are not
        equivalent. Its 0.020–3.350mm envelope is not independently verified for
        this drainage/rootzone supplier/profile. UUID withheld pending actual
        supplier process, composition, physical state and project/laboratory
        grading evidence; keep Mass/kg and distinct drainage exchange.
    - row_id: infill_sand
      name: Silica sand
      reason: Public silica-sand candidate has non-equivalent EN magnetic-separation
        and ZH crushing/washing route labels. Neither its route nor
        0.020–3.350mm envelope establishes the actual infill supplier and
        surface-compatible narrower grading/dryness/purity. UUID withheld
        pending supplier process and physical grading evidence; preserve
        distinct infill Mass/kg exchange, no default route or dosage.
