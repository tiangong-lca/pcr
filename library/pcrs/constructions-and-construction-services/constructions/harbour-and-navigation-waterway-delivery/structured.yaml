allocation_rules:
  - rule_id: a_subdivision
    applies_to: "foreground_burden_allocation"
    rule: "Assign shared dredger/plant, utilities, temporary works and transport to tasks/projects by metered activity and physical records first. Residual shared quantities use documented causal pump/engine hours or measured work, with denominator and uncertainty; no assumed equal shares, cost proxy or design throughput."
    source_ids:
      - ifc-ports-ehs-2017
  - rule_id: a_reuse
    applies_to: "foreground_burden_allocation"
    rule: "Keep one cross-project ledger per reusable equipment/component. Manufacturing attribution uses actual supported cumulative activity/uses or a justified lifetime basis; cumulative dimensionless allocated shares across projects, periods and repeated use must not exceed one. Unknown service life or beneficiaries stays explicit review. Operating fuel/repair is attributed to actual tasks separately; returned stock is not scrap."
    source_ids:
      - cedd-piers-2025
      - cedd-seawalls-breakwaters-2026
  - rule_id: a_sediment
    applies_to: "foreground_burden_allocation"
    rule: "Retained sediment/fill is an internal transfer. Exported beneficial-use sediment and disposal lots are mutually exclusive destinations for each physical portion. Avoided virgin-fill or recycling credits are not automatic; any extended downstream allocation needs a separate declared method, verified equivalence and conserved mass ledger."
    source_ids:
      - ifc-ports-ehs-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "Reference entity and functional geometry"
      record_type: "acceptance_survey"
      raw_fields: "project/site/perimeter; facility schedule; accepted count; dated acceptance; initial and as-built levels/datum; channel and berth geometry; lock/dry-dock/slipway configuration; corrections"
      collection_method: "Combine signed handover documents, traceable topographic/bathymetric surveys and equipment/structure acceptance tests; one complete declared entity, no assumed mass or life"
      unit: "item; m; m2; m3"
      frequency: "Each lot/task/transfer; continuous meters where used"
      temporal_coverage: "Entire documented construction campaign including commissioning, rework and cleanup"
      site_scope: "Same declared project site/perimeter and its documented external legs/recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/certificates; original records; sampling representativeness; signed reconciliation and uncertainty"
    - protocol_id: cp_material
      process_id: "all_construction_tasks"
      flow_role: "Specific material and supplied component"
      record_type: "delivery_installation"
      raw_fields: "row/lot/task; supplier; grade/composition/state; received and returned mass/volume/count; installed quantity; certificates; measured density/areal mass where needed; component damage/replacement records; opening/closing reusable stock; verified returns/transfers"
      collection_method: "Use calibrated weighbridge/scale, certified supplier product quantity, batch volume/count and as-built survey; reconcile returns, installation and offcuts by atomic material; for every purchased material and complete supplied component, input in its declared native unit = attributable gross receipts + opening stock - verified returns/transfers - closing reusable stock, including consumed pre-acceptance failures. Keep installed acceptance and actual waste separate without cancelling input manufacture. Apply b_consumed_inputs also when a card names installed, placed or accepted components; quantity is gross attributable consumption, while accepted delivery is a separate result.  For reusable or previously used assets, these receipts/returns/stocks are physical movement records only; do not use net stock consumption as their manufacturing amount. Delegate the manufacturing share to cp_reuse and a_reuse, including temporary sheet_pile, and keep permanently consumed new piles in the separate material branch."
      unit: "kg; m3; item"
      frequency: "Each lot/task/transfer; continuous meters where used"
      temporal_coverage: "Entire documented construction campaign including commissioning, rework and cleanup"
      site_scope: "Same declared project site/perimeter and its documented external legs/recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/certificates; original records; sampling representativeness; signed reconciliation and uncertainty"
    - protocol_id: cp_sediment
      process_id: "excavation"
      flow_role: "Excavated sediment/soil/rock and destination"
      record_type: "survey_sampling_transfer"
      raw_fields: "lot/location/depth; lithology; chemical/hazard tests; before/after bathymetry and datum; wet mass; dry fraction; bulk/slurry volume; carrier water; recipient; weigh/manifest records"
      collection_method: "Use representative location/depth samples and before/after surveys; weigh each exported lot, measure same-lot moisture/density/solid fraction and track actual recipient. Separate in-situ from transported volume"
      unit: "kg; m3"
      frequency: "Each lot/task/transfer; continuous meters where used"
      temporal_coverage: "Entire documented construction campaign including commissioning, rework and cleanup"
      site_scope: "Same declared project site/perimeter and its documented external legs/recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/certificates; original records; sampling representativeness; signed reconciliation and uncertainty"
    - protocol_id: cp_energy
      process_id: "support"
      flow_role: "Fuel and task-specific electricity"
      record_type: "meter_fuel_log"
      raw_fields: "task/equipment; meter/circuit; CN or actual geography; delivered voltage; start/end kWh; fuel grade/origin; tank receipts/returns; density/temperature; batch NCV; runtime"
      collection_method: "Read calibrated meters and reconcile fuel stock/deliveries/returns by task. Retain supplier/test NCV and density at measured state; generator fuel separate from purchased grid electricity"
      unit: "kWh; MJ; kg; litre"
      frequency: "Each lot/task/transfer; continuous meters where used"
      temporal_coverage: "Entire documented construction campaign including commissioning, rework and cleanup"
      site_scope: "Same declared project site/perimeter and its documented external legs/recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/certificates; original records; sampling representativeness; signed reconciliation and uncertainty"
    - protocol_id: cp_water
      process_id: "support"
      flow_role: "Supplied water and direct resources"
      record_type: "meter_water_log"
      raw_fields: "intake/supplier; river/sea/purified source; salinity; use; meter volumes; density; recirculation; return/discharge; wet-material carrier water"
      collection_method: "Meter actual external withdrawals/supply/returns and identify receiving route. Keep resource intake, technosphere supply and internal circulation separate; measure density where Mass identity is used"
      unit: "m3; kg"
      frequency: "Each lot/task/transfer; continuous meters where used"
      temporal_coverage: "Entire documented construction campaign including commissioning, rework and cleanup"
      site_scope: "Same declared project site/perimeter and its documented external legs/recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/certificates; original records; sampling representativeness; signed reconciliation and uncertainty"
    - protocol_id: cp_release
      process_id: "support_and_excavation"
      flow_role: "One specified elementary release"
      record_type: "measurement_or_calibrated_model"
      raw_fields: "row/task; substance/CAS; fossil origin; receiving medium/submedium; timing; engine/control state; measured release or activity/factor provenance; background water concentration; flux/control volume; uncertainty"
      collection_method: "Measure substance-specific mass or use independently reviewed same-condition activity/factor model. Sediment plume load needs background-corrected net flux integration with measured flow; record dB/NTU separately as assessment indicators"
      unit: "kg"
      frequency: "Each lot/task/transfer; continuous meters where used"
      temporal_coverage: "Entire documented construction campaign including commissioning, rework and cleanup"
      site_scope: "Same declared project site/perimeter and its documented external legs/recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/certificates; original records; sampling representativeness; signed reconciliation and uncertainty"
    - protocol_id: cp_waste
      process_id: "all_construction_tasks"
      flow_role: "One segregated waste transfer"
      record_type: "waste_manifest"
      raw_fields: "row/task; physical composition; hazard/state/moisture; wet mass or liquid volume; measured solids fraction; container; treatment recipient; transfer receipt"
      collection_method: "Weigh segregated solid streams and meter collected liquids; retain waste consignment and recipient evidence. Do not conflate reusable returns, product reuse or direct environmental discharge"
      unit: "kg; m3"
      frequency: "Each lot/task/transfer; continuous meters where used"
      temporal_coverage: "Entire documented construction campaign including commissioning, rework and cleanup"
      site_scope: "Same declared project site/perimeter and its documented external legs/recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/certificates; original records; sampling representativeness; signed reconciliation and uncertainty"
    - protocol_id: cp_transport
      process_id: "logistics"
      flow_role: "One specified road/barge freight leg"
      record_type: "shipment_voyage"
      raw_fields: "leg/vehicle/vessel; cargo identity/mass; route and actual distance; load factor; empty return; supplier included boundary; own fuel records"
      collection_method: "Use actual weigh bills, delivery/voyage logs and route distances; reconcile with own task-engine inventory and linked supplier transport coverage"
      unit: "kg; km; kg*km"
      frequency: "Each lot/task/transfer; continuous meters where used"
      temporal_coverage: "Entire documented construction campaign including commissioning, rework and cleanup"
      site_scope: "Same declared project site/perimeter and its documented external legs/recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/certificates; original records; sampling representativeness; signed reconciliation and uncertainty"
    - protocol_id: cp_reuse
      process_id: "structures_and_support"
      flow_role: "Temporary works/construction capital and permanent or reused sheet-pile attribution"
      record_type: "cross_project_ledger"
      raw_fields: "asset/component id; physical configuration and measured mass/count; new/used state; manufacture boundary; actual task use; cumulative service/activity; assigned shares; prior allocations; returns/losses ; sheet_pile new/used status and permanent/temporary destination; physical mass/receipts/returns/stocks/incorporation/loss from cp_material"
      collection_method: "Use one persistent asset ledger with actual use and return records across projects/periods. If manufacturing is included, document supported beneficiary denominator and cumulative share≤1; missing lifetime/activity basis remains review  For new permanently incorporated or consumed sheet_pile use the cp_material net-consumed material balance including pre-acceptance losses. For temporary or previously used piles use actual asset mass × supported conserved manufacture share, never net returned stock; later permanent retention/loss cannot reset already allocated manufacture and may receive only a justified remaining share. Keep both branches and physical movements separate, with no duplicate manufacture."
      unit: "kg; item; h; dimensionless"
      frequency: "Each lot/task/transfer; continuous meters where used"
      temporal_coverage: "Entire documented construction campaign including commissioning, rework and cleanup"
      site_scope: "Same declared project site/perimeter and its documented external legs/recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/certificates; original records; sampling representativeness; signed reconciliation and uncertainty"
  calculation_rules:
    - id: c_project_ledger
      applies_to: "all inventory rows"
      rule: "Sum physically attributable task/lot records once for this one declared reference flow; retain physical numerators and reconcile received/returned/installed/waste quantities. No division by assumed facility mass, design capacity or lifetime"
      inputs:
        - cp_handover
        - cp_material
        - cp_sediment
        - cp_energy
        - cp_water
        - cp_release
        - cp_waste
        - cp_transport
        - cp_reuse
      output: "Measured/calculated exchange per declared reference flow"
      source_ids:
        - un-cpc3-waterworks-2025
    - id: c_physical_state
      applies_to: "Material and sediment state conversion"
      rule: "Use paired same-lot measurements: mass = volume × measured density; dry solids = wet mass × measured dry fraction. State each volume type, temperature/moisture, density units and uncertainty; if unproved retain original unit and review"
      inputs:
        - cp_material
        - cp_sediment
        - cp_water
      output: "Verified material-state quantities, never invented entity mass"
      source_ids:
        - ifc-ports-ehs-2017
    - id: c_energy
      applies_to: "Fuel and electricity quantities"
      rule: "Electricity MJ = metered kWh × 3.6; fuel MJ = measured kg × batch NCV in MJ/kg, and measured litres require measured kg/litre density. NCV/route and supply voltage must match the row; no generic fuel factor"
      inputs:
        - cp_energy
      output: "Actual MJ per declared reference flow"
      source_ids: []
    - id: c_release
      applies_to: "Substance-specific environmental release"
      rule: "Apply verified substance-specific measurements or an independently reviewed activity/factor model with matching units and control state. Plume release is net mass flux integrated over documented time/control volume after background correction; do not equate excavated dry mass, concentration, NTU or receptor exposure with release"
      inputs:
        - cp_release
        - cp_sediment
        - cp_energy
      output: "One substance/medium-specific kg release per declared reference flow; absent basis stays review"
      source_ids:
        - ifc-ports-ehs-2017
        - epa-heavy-construction-1995
    - id: c_transport
      applies_to: "Actual freight legs"
      rule: "Sum actual cargo kg × leg km for separately identified lorry/barge journeys; disclose loading/returns and embodied transport. Own-engine fuel for a leg and purchased service for the same leg cannot both carry the full burden"
      inputs:
        - cp_transport
        - cp_energy
      output: "Actual kg*km per declared reference flow"
      source_ids:
        - ifc-ports-ehs-2017
  data_quality_requirements:
    - id: dq_project
      applies_to: "reference entity"
      requirement: "Same site/configuration, actual functional geometry, original datum, signed acceptance and complete facility schedule; no invented loads/life/mass"
      evidence: "cp_handover"
    - id: dq_material
      applies_to: "all inputs and wastes"
      requirement: "Lot-specific composition/state, measured quantity and traceable recipient; preserve supplier and foreground boundaries and disclose unresolved identities"
      evidence: "cp_material; cp_sediment; cp_waste"
    - id: dq_environment
      applies_to: "environmental inventory"
      requirement: "Actual substance/medium/timing and representative sampling; separate measured, calibrated modeled and unquantified results; noise/underwater vibration/habitat gaps disclosed independently"
      evidence: "cp_release; ifc-ports-ehs-2017"
    - id: dq_reuse
      applies_to: "shared equipment/temporary works"
      requirement: "Supported causal attribution, one cumulative ledger and shares≤1; missing lifetime/activity basis blocks the affected manufacturing module, not a fabricated default"
      evidence: "cp_reuse"
    - id: dq_completeness
      applies_to: "whole dataset"
      requirement: "Inventory every actual included task and supplied-state component, explicit non-applicability, uncertainty and stage coverage. A candidate record/UUID or projection pass is not a completed project data package or approved methodology"
      evidence: "cp_handover; actual process ledger"
validation_rules:
  - rule_id: v_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Reference name exactly equals finished_harbour; quantity is 1 item/1 件, with Count property, same site/configuration and complete acceptance record. No generic kg-per-facility, area/length conversion or declared capacity may stand in for actual delivered entity."
    source_ids:
      - un-cpc3-waterworks-2025
  - rule_id: v_route
    applies_to: "foreground_dataset_conformance"
    rule: "Check as-built geometry, datum, facility schedule, actual methods, material states and all accepted installation/test corrections. For every non-applicable card retain evidence of absence; route gaps must be added before a completeness claim."
    source_ids:
      - cedd-piers-2025
      - cedd-seawalls-breakwaters-2026
      - usace-soo-lock-2026
  - rule_id: v_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile incoming, installed, returned and lost materials, segregated waste and sediment destinations. Wet/dry mass, in-situ/hopper/slurry volumes and carrier water require same-lot measured conversion evidence; no assumed yield, density, bulking or moisture."
    source_ids:
      - ifc-ports-ehs-2017
      - epa-concrete-washout-2012
  - rule_id: v_energy_release
    applies_to: "foreground_dataset_conformance"
    rule: "Verify each adopted identity, property and unit; actual electricity geography/voltage; fuel origin/NCV; immediate air submedium and chemical speciation. NTU, dB, NOx-as-NO2 and pollutant concentrations cannot be silently renamed into kg elementary flows. Unquantified emissions remain gaps, not zero."
    source_ids:
      - ifc-ports-ehs-2017
      - epa-heavy-construction-1995
  - rule_id: v_boundary_allocation
    applies_to: "foreground_dataset_conformance"
    rule: "Check supplier-gate versus site boundaries and transport legs, no duplicate assemblies/ingredients/fuel, conserved reuse shares and independently disclosed later-stage/impact gaps. Candidate checks do not grant scientific approval or publication."
    source_ids:
      - ifc-ports-ehs-2017
published_dataset_profile:
  dataset_role: "Foreground initial-construction and acceptance inventory of one actual configured harbour/navigation-waterway entity"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Site-specific delivery-stage module with verified project geometry and upstream links; later inclusion in separately reviewed lifecycle model"
  excluded_use: "Unqualified full-life or comparative conclusion; generic intensity without functional equivalence; material/service/vessel output substitution; candidate checks as approval"
  required_metadata: "site and project perimeter; marine/freshwater setting and salinity; project type and actual new-work/reconstruction scope; retained existing assets; initial/as-built datum and bathymetry; accepted channel length/width/depth and basin area as applicable; pier/wharf length and deck area; structure/pile/armour/fill configuration; lock/dry-dock effective dimensions and water levels; slipway length/slope/gauge and cradle/haulage configuration; actual design/use conditions and acceptance evidence; construction period; sediment sampling/state/contamination/destination; transport and supplier boundaries; temporary-work/equipment reuse ledger; measured physical quantities and units; commissioning scope; excluded lifecycle stages"
  required_quality_disclosure: "Task/stage completeness, measured/modelled/unquantified amounts, unresolved identities, sediment conversion/contamination uncertainty, conserved reuse shares, background boundaries and noise/habitat/hydrodynamic/later-stage gaps"
  update_trigger: "Changed accepted configuration/geometry, dredging/structure route, supplier material state, sediment destination, equipment/control, commissioning correction or verified identity/method evidence"
data_sources:
  - id: "un-cpc3-waterworks-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed/PDF pp.279–280. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Entity scope and neighboring waterworks functions; no amounts/life or accepted mapping"
  - id: "ifc-ports-ehs-2017"
    type: "official_guidance"
    reference: "World Bank Group/IFC, EHS Guidelines for Ports, Harbors, and Terminals, 2 February 2017, pp.6–10 (§§16–35),17–18 (§§58–61),32–33 (Annex A §§90–96). https://www.ifc.org/content/dam/ifc/doc/mgrt/20170201-final-ehs-guidelines-for-ports-harbors-and-terminals.pdf"
    used_for: "Qualitative sediment/water/environmental boundaries and conditional noise; site-specific applicability, no numerical emission or regulatory threshold adopted"
  - id: "cedd-piers-2025"
    type: "official_guidance"
    reference: "Hong Kong CEDD, Port Works Design Manual Part 2, Guide to Design of Piers and Dolphins, October 2025 e-version, printed pp.16–17,22–25,41–43,50–53 (PDF18–19,24–27,43–45,52–55). https://www.cedd.gov.hk/filemanager/eng/content_89/PWDM_2025_e-version%20Oct%202025_p2_1_133_r2.pdf"
    used_for: "Alternative piled/solid structures and fender configuration; Hong Kong qualitative guidance only; no generalized local design prescriptions"
  - id: "cedd-seawalls-breakwaters-2026"
    type: "official_guidance"
    reference: "Hong Kong CEDD, Port Works Design Manual Part 4, Guide to Design of Seawalls and Breakwaters, April 2026 e-version, printed pp.11,25–27,49–55,65–67 (PDF13,27–29,51–57,67–69). https://www.cedd.gov.hk/filemanager/eng/content_89/p4_combined.pdf"
    used_for: "Conditional rock/concrete structural and ground-treatment routes, construction and slipway components; no default density, dimensions, sampling rates, capacity or life"
  - id: "usace-soo-lock-2026"
    type: "official_guidance"
    reference: "USACE Detroit District, New Lock at the Soo Phase 3 reaches 50% complete milestone, 29 September 2026, construction-scope and offsite-fabrication paragraphs. https://www.dvidshub.net/news/575917/new-lock-soo-phase-3-reaches-50-complete-milestone"
    used_for: "One actual lock project supports conditional cofferdam/chamber/gate/mechanical-electrical tasks and offsite/site distinction; no project quantities, costs, progress or schedule generalized"
  - id: "epa-heavy-construction-1995"
    type: "official_guidance"
    reference: "US EPA AP-42 §13.2.3 Heavy Construction Operations, January 1995, pp.13.2.3-1–2. https://www.epa.gov/sites/default/files/2020-10/documents/13.2.3_heavy_construction_operations.pdf"
    used_for: "Historical qualitative dust mechanisms and specificity limitations only; no general TSP/area/month factor adopted as PM10"
  - id: "epa-concrete-washout-2012"
    type: "official_guidance"
    reference: "US EPA, Stormwater Best Management Practice: Concrete Washout, EPA-833-F-11-006, February 2012, pp.1–2. https://www.epa.gov/sites/default/files/2015-11/documents/concretewashout_0.pdf"
    used_for: "Conditional separate washout liquid/settled solid handling and supplied concrete ingredients; no fixed pH, mixture recipe or quantitative rate adopted"
