measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Exactly 1 item, the complete accepted configured entity; collect using cp_handover. Use per declared reference flow for all inventory and collection aggregation."
  - id: physical_quantities
    applies_to: "auxiliary material-balance and geometry records linked to inventory rows"
    required_property_ref:
      name: "Mass ; Volume ; Length; Area"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg; m3; m; m2"
    rule: "Use actual weighed/certified quantities or surveyed geometry. Any volume-to-mass or area-to-mass conversion requires same-material/state measured density or areal mass, dimensional units and uncertainty; do not assign a mass to the whole entity. Here mass/kg, volume/m3, length/m and area/m2 constrain auxiliary records, not the primary property of every exchange. Each complete supplied component retains its card’s native property/unit: Number of items/item for the counted component rows, and Mass/kg for rubber_fender and mooring_bollard. Link component ID, configuration, supplied count and independently evidenced mass/volume or surveyed geometry in cp_material; caisson supplier mass and volume remain required. Do not substitute auxiliary mass for a native counted exchange, convert a mass-based component into an unevidenced item exchange, or add a duplicate manufacture input."
  - id: energy_identity
    applies_to: "diesel and electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve adopted reference properties and energy units. Metered electricity kWh converts by 3.6 MJ/kWh; fuel mass uses actual batch net calorific value in MJ/kg, volume additionally uses measured density. Public identity property coefficients do not prove physical fuel heat content."
  - id: sediment_state
    applies_to: "excavation and plume records"
    required_property_ref:
      name: "Mass; Volume"
      uuid: ""
    required_unit: "kg; m3"
    rule: "Distinguish in-situ, loose/hopper and slurry volumes, wet mass and dry-solid mass. Use same-lot measured conversion; preserve moisture, carrier-water and contamination qualifiers. Concentration/NTU is not release mass."
