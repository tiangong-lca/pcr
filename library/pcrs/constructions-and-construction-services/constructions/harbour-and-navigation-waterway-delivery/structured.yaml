product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.constructions.harbour-and-navigation-waterway-delivery"
  classification_refs: "CPC 3.0 53232; scope context only, no accepted mapping implied"
  covered_products: "Accepted harbour/navigation-waterway entities and their integral water-transport civil/hydromechanical facilities"
  excluded_products: "Independent water supply, irrigation/flood control or reservoir dam; buildings; material/equipment manufacture; vessel or port operational services"
  representative_product: "One actual accepted harbour/navigation-waterway project entity of declared configuration, perimeter and functional geometry"
  production_route: "Actual surveyed preparation and conditional capital dredging/excavation, ground/fill treatment, selected structural installation/placing, hydromechanical/berthing/slipway installation, utilities, logistics, correction and acceptance"
  market_state: "Complete configured constructed entity at the stated site, accepted for its declared use; not loose construction materials or a generic construction service"
functional_unit:
  what: "Provide the declared navigable waterway, protected harbour/berth, waterway passage or docking/launching function through the accepted physical configuration"
  how_much: "One complete declared entity; actual length, width/depth, berth/deck/basin area, effective chamber dimensions or slipway geometry are measured qualifiers, not fabricated fixed unit dimensions"
  how_well: "Actual signed acceptance for the specified structural/navigation/berthing/hydromechanical configuration and operating/design conditions, traceable to surveys/tests and corrected defects; no automatic code approval"
  how_long_or_cycle: "One documented initial construction and acceptance campaign through handover; no assumed service life, operating-year output or future maintenance cycle"
  reference_flow_link: "finished_harbour"
system_boundary:
  rules:
    - rule_id: b_delivery
      applies_to: "foreground_system_boundary"
      rule: "Include actual preparation, capital dredging/excavation, ground/fill works, selected civil structures, integral installed equipment, task utilities, logistics, temporary works, corrections and cleanup through accepted handover. A piled pier may need no foundation dredging; prove every route from project evidence."
      source_ids:
        - cedd-piers-2025
        - cedd-seawalls-breakwaters-2026
        - usace-soo-lock-2026
    - rule_id: b_consumed_inputs
      applies_to: "foreground_system_boundary"
      rule: "For every purchased material and complete supplied component, local installed/placed/accepted wording specifies the evidenced route, configuration or delivered result; it does not restrict input manufacture to successful installation. This explicit exception also applies to the conditional amount rules below. Include actual attributable consumption before handover, including cutting, damage, rejection and rework/replacements before installation or acceptance, in each card’s native unit. Under cp_material, input = attributable gross receipts + opening stock - verified returns/transfers - closing reusable stock. Keep accepted installed quantities and measured wastes as separate reconciled records; neither cancels consumed input manufacture. Preserve all material, route and supplier-configuration conditions.  The stock-consumption equation covers consumed/permanent supplied materials, not the manufacturing-share portion of temporary or previously used assets. Temporary sheet_pile, timber_formwork and other reusable capital use the separate cp_reuse conserved manufacturing ledger even when returned/transferred or retained as usable stock. Physical movements do not set this use share to zero."
      source_ids: []
    - rule_id: b_supplied_state
      applies_to: "foreground_system_boundary"
      rule: "Purchased fresh concrete, precast units, gates and equipment enter in actual supplied state. Cement/aggregate/steel and equipment manufacture remain separately linked upstream; onsite concrete batching or gate fabrication requires its own ingredient/process rows and measured recipe, never double-count a purchased assembly."
      source_ids:
        - cedd-piers-2025
        - usace-soo-lock-2026
    - rule_id: b_environment
      applies_to: "foreground_system_boundary"
      rule: "Record sediment destinations separately from net constituent releases, water-resource abstraction separately from supplied water, and treatment-bound liquid separately from environmental discharge. Include actual containment, collection and pumping; do not assume all dredged material becomes an emission."
      source_ids:
        - ifc-ports-ehs-2017
        - epa-concrete-washout-2012
    - rule_id: b_later_stages
      applies_to: "foreground_system_boundary"
      rule: "Routine port cargo/passenger operations, vessel supply/repair, maintenance dredging, future repair/replacement and final demolition are outside this initial-delivery inventory. Removal of existing assets for this construction is included. Noise/vibration, habitat change, land occupation and hydrodynamic effects need separately scoped assessment; missing characterization is not zero impact."
      source_ids:
        - ifc-ports-ehs-2017
    - rule_id: b_extensions
      applies_to: "foreground_system_boundary"
      rule: "Cards cover specified atomic routes, not every possible configuration. Before asserting a complete dataset, add actual alternative gate/lift/pump/berthing systems, other rock/steel/concrete/soil specifications, coatings, joints, blasting charges, packaging or chemicals as separate physical exchanges with project records and verified identities. Never omit installed requirements by selecting a simpler route."
      source_ids:
        - un-cpc3-waterworks-2025
        - cedd-piers-2025
        - cedd-seawalls-breakwaters-2026
        - usace-soo-lock-2026
boundary_abstraction:
  declared_starting_condition: "Surveyed actual site/bottom/river/canal conditions and existing assets before this campaign; actual supplied material/assembly gates and transport start points"
  starting_condition_role: "foreground_start"
  product_classification_scope: "Complete declared harbour/navigation-waterway entity and integral facilities; classification is context, function defines applicability"
  recursive_input_rule: "Existing retained harbour/waterway is starting stock with surveyed extent, not new same-category production. Separately acquired completed works need an independently bounded upstream dataset; no recursion into own output or rebuilding historic impacts by assumption"
  upstream_dataset_requirement: "Link separately verified raw-material/manufactured-component/utility/equipment datasets by actual supplied state, production/transport boundary, geography and unit; report completeness independently"
  disclosure: "Site construction and initial acceptance only; report linked upstream stages separately with missing coverage. No unqualified cradle-to-gate or whole-life result"
