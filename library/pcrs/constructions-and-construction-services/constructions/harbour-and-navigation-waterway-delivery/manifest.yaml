  boundary_limitations:
    - Initial construction and accepted handover only; upstream supply, actual transport, capital attribution and later lifecycle stages are separately scoped.
    - Actual alternate structures, sluice/floodgate/lift/dry-dock systems, materials and process variants require additional specific exchanges before a full-project completeness claim.
    - No defaults for facility mass, geometry, mixture, lifetime, load, fuel factor, sediment density/bulking/moisture or approval.
  unresolved_evidence:
    - Actual project geometry/acceptance, physical lot amounts, same-state conversions, equipment activity/reuse shares and substance-specific releases are dataset-production requirements, not invented here.
    - Noise/underwater vibration, hydrodynamics, habitat/land-use impacts and later-stage inventories require separate evidence and assessment.
    - No source-backed universal amount ranges exist for these project-specific construction exchanges; important-flow range warnings remain explicit. Quantities and uncertainties must come from actual lot/project records.
    - Public Portland cement identity has a descriptive binder name/state and Mass property but anomalous tile classification; retain source applicability and scientific identity review before publication.
