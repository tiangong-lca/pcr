allocation_rules:
  - rule_id: a_task
    applies_to: "foreground_burden_allocation"
    rule: "Avoid allocation with work/task submeters and subcontract physical ledgers. Unavoidable shared utilities use measured equipment hours, pumping or other physically causal activity; list all beneficiaries and conserved shares. Unknown relationships require review; cost is not a default."
    source_ids: []
  - rule_id: a_asset
    applies_to: "foreground_burden_allocation"
    rule: "Manufacturing attribution shares for the same physical equipment/reusable component must sum to no more than one across projects, periods and reuses. Derive a dimensionless share from supported total activity and project activity, multiplying measured count/mass/volume. Unknown life/total activity remains review; operating burdens are actual separately measured consumption."
    source_ids: []
  - rule_id: a_waste
    applies_to: "foreground_burden_allocation"
    rule: "Reused excavated soil/rock is an internal transfer; waste follows actual destination. No automatic substitution credit for steel/concrete waste. A traded co-product requires evidence of status/use and a separately declared allocation/system-expansion method and factor sources; disposal payment does not create output."
    source_ids:
      - epa-washout-2012
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "all_applicable_construction_processes"
      flow_role: "material"
      record_type: "delivery_and_placement"
      raw_fields: "lot; material state; source gate; accepted receipt; return; installed geometry; measured density where converted; waste ; opening and closing reusable stock; verified transfers; pre-acceptance damage/rejection/replacement; separate consumed and accepted installed quantities"
      collection_method: "Weigh receipts and returns, reconcile tickets with surveyed installed dimensions; use actual tested density only for the same state/lot. Record embedded component supplier scope. Aggregation detail: Sum attributable physical exchanges per declared reference flow  Apply b_consumed_inputs in the row native unit: gross attributable receipts + opening stock - verified returns/transfers - closing reusable stock; include consumed losses and replacements, with accepted installation and waste reconciled separately."
      unit: "kg"
      frequency: "each task, lot, trip or acceptance event"
      temporal_coverage: "actual start through complete acceptance, including correction"
      site_scope: "same declared work perimeter, including subcontractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw ledgers, tests, revisions and handover records"
    - protocol_id: cp_utilities
      process_id: "support"
      flow_role: "energy"
      record_type: "meter_and_fuel_ledger"
      raw_fields: "equipment id; task; hours; receipts; opening/closing stock; fuel density; voltage; supply geography; meter readings"
      collection_method: "Read calibrated task meters and fuel ledger; reconcile subcontractor records; preserve actual fuel property and meter energy unit. Aggregation detail: Sum attributable use per declared reference flow, once by task"
      unit: "kg; MJ"
      frequency: "each task, lot, trip or acceptance event"
      temporal_coverage: "actual start through complete acceptance, including correction"
      site_scope: "same declared work perimeter, including subcontractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw ledgers, tests, revisions and handover records"
    - protocol_id: cp_water
      process_id: "support"
      flow_role: "water"
      record_type: "meter_and_transfer"
      raw_fields: "source; catchment; supplied/abstracted volume; curing/test use; dewatering; washout; recycle; recipient; concentration; discharge permission"
      collection_method: "Meter distinct supply, river withdrawal, dewatering, washout and actual discharge; record reuse as internal transfer. Separate treatment waste transfer from measured direct environmental release. Aggregation detail: Sum each distinct water exchange per declared reference flow; never net away withdrawals/returns silently"
      unit: "m3"
      frequency: "each task, lot, trip or acceptance event"
      temporal_coverage: "actual start through complete acceptance, including correction"
      site_scope: "same declared work perimeter, including subcontractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw ledgers, tests, revisions and handover records"
    - protocol_id: cp_waste
      process_id: "all_applicable_construction_processes"
      flow_role: "waste"
      record_type: "weighbridge_transfer"
      raw_fields: "row_id; task; composition; wet/dry state; moisture; mass; receiver; treatment/reuse evidence"
      collection_method: "Use calibrated scales or weighbridge transfers; sample composition/moisture and reconcile with site mass balance; do not assume recycling. Aggregation detail: Sum each waste row per declared reference flow"
      unit: "kg"
      frequency: "each task, lot, trip or acceptance event"
      temporal_coverage: "actual start through complete acceptance, including correction"
      site_scope: "same declared work perimeter, including subcontractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw ledgers, tests, revisions and handover records"
    - protocol_id: cp_emissions
      process_id: "support"
      flow_role: "elementary_emission"
      record_type: "measurement_or_supported_factor"
      raw_fields: "substance; CAS; source equipment/task; air subcompartment; sample/factor; fuel activity; chemical basis; control; uncertainty"
      collection_method: "Measure the specified species or retain primary published equipment/fuel-specific factor with its original conditions and activity records. Missing factor/speciation stays an assessment gap, not zero. Aggregation detail: Sum supported species releases per declared reference flow"
      unit: "kg"
      frequency: "each task, lot, trip or acceptance event"
      temporal_coverage: "actual start through complete acceptance, including correction"
      site_scope: "same declared work perimeter, including subcontractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw ledgers, tests, revisions and handover records"
    - protocol_id: cp_assets
      process_id: "assets"
      flow_role: "reusable_asset"
      record_type: "asset_share_ledger"
      raw_fields: "physical asset id; configuration; measured count/volume/mass; manufacture dataset; supported cumulative activity; project activity; prior shares; remaining share"
      collection_method: "Measure actual boards or identify actual equipment and keep a cross-project ledger; evidence must support lifetime/activity denominator and attribution. Unknown denominator requires review before an asset-burden result. Aggregation detail: Attributable manufacture share per declared reference flow; same asset cumulative share ≤1"
      unit: "item; m3; kg"
      frequency: "each task, lot, trip or acceptance event"
      temporal_coverage: "actual start through complete acceptance, including correction"
      site_scope: "same declared work perimeter, including subcontractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw ledgers, tests, revisions and handover records"
    - protocol_id: cp_transport
      process_id: "transport"
      flow_role: "transport"
      record_type: "trip_ledger"
      raw_fields: "trip; material; loaded mass; actual route km; delivery inclusion; empty return attribution"
      collection_method: "Reconcile weighbridge, dispatch and route logs; separate trip legs and check supplier datasets to avoid duplicate delivery. Aggregation detail: Sum attributable transport activity per declared reference flow"
      unit: "kg*km"
      frequency: "each task, lot, trip or acceptance event"
      temporal_coverage: "actual start through complete acceptance, including correction"
      site_scope: "same declared work perimeter, including subcontractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw ledgers, tests, revisions and handover records"
    - protocol_id: cp_delivery
      process_id: "handover"
      flow_role: "reference_product"
      record_type: "survey_and_acceptance"
      raw_fields: "asset/site id; start/end chainage; inlet/outlet; surveyed length; sections; slopes; invert/cover/support dimensions; flow rate and head conditions; installed controls; acceptance tests; nonconformities; date"
      collection_method: "Reconcile as-built survey and complete asset list with actual dimensional, structural, joint/seepage and hydraulic acceptance evidence and owner handover; no assumed approvals. Aggregation detail: One complete accepted configured work per declared reference flow"
      unit: "item"
      frequency: "each task, lot, trip or acceptance event"
      temporal_coverage: "actual start through complete acceptance, including correction"
      site_scope: "same declared work perimeter, including subcontractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, raw ledgers, tests, revisions and handover records"
  calculation_rules:
    - id: inventory_aggregation
      applies_to: "all inventory rows"
      rule: "Sum actual attributable task exchanges for the same complete work per declared reference flow; reconcile receipts, returns, surplus and installation separately, excluding internal transfers from external exchange.  Apply b_consumed_inputs to supplied inputs, including pre-acceptance consumed losses and replacements; accepted installed amounts are not the input quantity."
      inputs:
        - cp_material
        - cp_utilities
        - cp_water
        - cp_waste
        - cp_delivery
      output: "row amount on the same basis"
      source_ids:
        - usbr-construction
    - id: physical_conversion
      applies_to: "all inventory rows"
      rule: "Measured volume × measured same-lot/state density = mass; measured area × same-lot areal mass = mass. Retain raw value/state/factor/uncertainty; secondary screening ratios are not universal densities."
      inputs:
        - "measured volume/area"
        - "tested density/areal mass"
        - cp_material
      output: "actual quantity in the original property"
      source_ids: []
    - id: energy_meter
      applies_to: "electricity_cn_lv"
      rule: "Meter kWh × 3.6 = MJ; count same-work user consumption once."
      inputs:
        - "meter kWh"
        - cp_utilities
      output: "MJ"
      source_ids: []
    - id: transport_activity
      applies_to: "road_freight"
      rule: "Sum attributable trip loaded mass kg × actual distance km; if the identity uses t*km, 1 t*km = 1000 kg*km."
      inputs:
        - "trip mass"
        - km
        - cp_transport
      output: "kg*km"
      source_ids: []
    - id: asset_attribution
      applies_to: "plywood; excavator_share"
      rule: "Manufacturing-equivalent physical amount = measured same-configuration physical amount × dimensionless project activity share; cumulative shares across all projects/periods ≤1 with remaining balance. No calculation with unsupported denominator."
      inputs:
        - "physical quantity"
        - "project activity"
        - "supported total activity"
        - "prior shares"
        - cp_assets
      output: "work manufacture share in the original physical unit"
      source_ids: []
    - id: emission_evidence
      applies_to: "co2_fossil; no_air; no2_air; pm10_air"
      rule: "Use measured specified-species mass or matched actual activity × cited species factor, retaining fuel/technology/control/chemical basis/compartment. Aggregate NOx is not automatically speciated; a gap is not zero."
      inputs:
        - "measurement or primary factor"
        - activity
        - cp_emissions
      output: "kg"
      source_ids: []
    - id: water_balance
      applies_to: "supplied_water; river_withdrawal; drainage_liquid; washout_water; water_release"
      rule: "Reconcile supply, direct withdrawal, embodied water, reuse, waste transfer and measured discharge separately. Dewatering has separate groundwater ingress/outflow and is not forced to equal construction abstraction. Concentration × compatible liquid amount applies only to identified species with consistent units."
      inputs:
        - meters
        - samples
        - receivers
        - cp_water
      output: "separate water exchanges and identified species quantities"
      source_ids:
        - epa-washout-2012
  data_quality_requirements:
    - id: dq_configuration
      applies_to: "finished_conduit"
      requirement: "Same asset interfaces, surveyed geometry, structure and hydraulic conditions with actual tests/nonconformities. Length alone does not establish equivalence."
      evidence: "cp_delivery; ladwp-wip-2024"
    - id: dq_sources
      applies_to: "all inventory rows"
      requirement: "Use actual lots, full-cycle and all-subcontract records; material grade/lining/supply state/geography/voltage/compartment/public property must match."
      evidence: "cp_material; cp_utilities; cp_water"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Reconcile complete quantity schedule with processes, atomic inventories, temporary works and wastes. Missing process/scope/identity/factor or unrepresentative sample remains explicit, not zero."
      evidence: "cp_delivery; cp_waste"
    - id: dq_ranges
      applies_to: "all quantities"
      requirement: "No universal recipe, energy/loss/lifetime/geometry or per-work mass range. Site evidence supplies measured factors/uncertainty; future cross-project benchmarks need independent boundary-compatible evidence."
      evidence: "cp_material; cp_delivery"
    - id: dq_environment
      applies_to: "support"
      requirement: "Confirm each direct-release substance, air subcompartment and receiving water; disclose uncovered noise/ecology/land/hydrology impacts without inventing mass exchanges."
      evidence: "cp_emissions; cp_water"
validation_rules:
  - rule_id: v_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Reject a materials bundle, construction service, partial lining or unaccepted task substituted for the same complete reference work. Check 1 item, surveyed geometry/hydraulic conditions and finished_conduit consistency; missing qualifiers invalidate the data package."
    source_ids:
      - un-cpc3-2025
      - ladwp-wip-2024
  - rule_id: v_route
    applies_to: "foreground_dataset_conformance"
    rule: "Check every necessary process/condition against as-built methods; onsite mixture production, blasting or specialty support without separate exchanges prevents a completeness claim. Resolve mixed purpose/category/interfaces first."
    source_ids:
      - usbr-construction
  - rule_id: v_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Verify public substance/state/route/geography/compartment/reference property/unit for every UUID. NO, NO2 and N2O are distinct; wastewater transfer is not resource water or environmental water discharge. Keep specific blank identities and review where unmatched."
    source_ids:
      - epa-washout-2012
  - rule_id: v_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile quantity schedule, stocks, waste/water ledger, energy, transport boundaries and cumulative asset shares. Correct double counts, incompatible units, default density/lifetime or unsupported factors. A candidate structural check without real project measurements establishes neither performance nor scientific approval."
    source_ids:
      - usbr-canals-2017
      - usbr-construction
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Supply-water conveyance construction module with matching boundary/configuration and preserved qualifiers"
  allowed_use: "Modelling within matched supply function, structural geometry, hydraulics and construction stage; declare linked upstream completeness"
  excluded_use: "Length-only comparison across different capacity/configuration; operational water supply; irrigation/flood control; pipelines; whole life or unsupported lifetime comparison"
  required_metadata: "All reference qualifiers, surveyed quantities, methods, supply interfaces, task/subcontracts, test/handover records, electricity/water conditions and stage boundaries"
  required_quality_disclosure: "Identity/process/factor gaps, upstream completeness, sample representativeness, uncertainty, shared allocation/asset shares, applicability warnings and unmeasured environmental impacts"
  update_trigger: "Changes in as-built configuration, supply conditions, route, geography/gate, method, acceptance, emission factors or boundary"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed pp. 279–280. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Supply-purpose nonpipeline entity and adjacent category boundary; not a manufacture/quantity factor"
  - id: "ladwp-wip-2024"
    type: "official_guidance"
    reference: "LADWP, Water Infrastructure Plan 2024-25, p. 10. https://www.ladwp.com/sites/default/files/2025-01/2024_BOOKLETS_WIP_Digital%20Final.pdf"
    used_for: "Actual supply-system open channels/covered conduits/tunnels and separate upkeep; configuration/stage evidence only, not copied mileage/lifetime/maintenance schedule"
  - id: "usbr-construction"
    type: "official_guidance"
    reference: "USBR, Crow Irrigation Project – Construction Activity Descriptions, Structures (Flumes; Replacing/Rehabilitating) and Canals (Cleaning/Shaping; Lining). https://www.usbr.gov/gp/nepa/cip/activity_descriptions.html"
    used_for: "Transferable excavation/shaping/compaction, concrete flume/elevated supports and membrane operations only. Original irrigation purpose is outside this category; no default cost/dimensions/emissions/equipment rates"
  - id: "usbr-canals-2017"
    type: "official_guidance"
    reference: "USBR, Canal Operation and Maintenance: Concrete Lining and Structures, November 2017, printed p. 3 (construction/curing), p. 10 (support/voids), Section 5.8 Shotcrete (printed p. 22). https://www.usbr.gov/assetmanagement/docs/Canal_Concrete.pdf"
    used_for: "Concrete placement/curing/support state and shotcrete, qualitative physical operations only. Irrigation O&M context is not supply whole-life evidence; historic temperatures/strengths/recipes are not project constraints"
  - id: "epa-washout-2012"
    type: "official_guidance"
    reference: "US EPA, Stormwater Best Management Practice: Concrete Washout, EPA 833-F-11-006, February 2012, pp. 1–2. https://www.epa.gov/sites/default/files/2015-11/documents/concretewashout_0.pdf"
    used_for: "Historical qualitative washout liquid/solids, containment and transfer boundaries; no copied pH/metals concentration or current compliance approval"
