measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "item"
    rule: "Reference output is 1 item for the same complete accepted work, collected using cp_delivery. All inventories and collection aggregates use per declared reference flow. No assumed per-metre or per-work mass."
  - id: actual_quantities
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass; Volume; Energy; Mass*distance; Number of items"
      uuid: ""
    required_unit: "kg; m3; MJ; kg*km; item"
    rule: "Preserve each verified identity primary property/unit. Weigh mass and survey geometry/volume; area/length/volume-to-mass requires measured areal mass or density in the same lot/state. Never default to 1000 kg/m3. Match the property to each exchange: mass/kg, volume/m3, energy/MJ, mass-distance/kg*km, and Number of items/item for the complete delivered conduit and counted excavator manufacture share. Their auxiliary physical records do not replace native item exchanges; unknown equipment lifetime or total activity still requires review."
  - id: electricity_conversion
    applies_to: "electricity_cn_lv"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert meter kWh using 1 kWh = 3.6 MJ; preserve public Net calorific value, not Mass."
