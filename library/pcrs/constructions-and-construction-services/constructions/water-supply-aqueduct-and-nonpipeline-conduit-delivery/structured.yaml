product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.constructions.water-supply-aqueduct-and-nonpipeline-conduit-delivery"
  classification_refs: "CPC 3.0 53231"
  covered_products: "Complete supply-purpose aqueducts, open channels, flumes, covered conduits and nonpipeline underground conveyance entities with integral structures"
  excluded_products: "Irrigation/flood control; navigation canals; pipelines; standalone dams/reservoirs; transport bridges/tunnels; treatment plants; materials/equipment; construction services"
  representative_product: "One complete accepted conveyance work with defined interfaces, measured geometry and hydraulic conditions"
  production_route: "Actual earthworks, earth/concrete/membrane/masonry lining, flume erection or underground excavation/lining; integral joints/controls; testing, correction and handover"
  market_state: "Installed accepted physical civil work at site; not conveyed water output"
functional_unit:
  what: "Provide the supply-water conveyance passage between declared inlet/outlet under declared hydraulic conditions; assess its construction delivery"
  how_much: "One complete accepted work; declare surveyed chainage/length, section width/height, slope, invert/cover/support dimensions, actual conveyance capacity and test head. These qualify the same work and are not alternative denominators."
  how_well: "Constrain with actual contract specification, structural/lining/joint configuration, supply purpose and seepage/hydraulic acceptance records; no default load, strength or approval"
  how_long_or_cycle: "One actual construction-to-complete-acceptance cycle; no operational lifespan or yearly water-delivery service is established"
  reference_flow_link: "finished_conduit"
system_boundary:
  rules:
    - rule_id: b_build
      applies_to: "foreground_system_boundary"
      rule: "Include actual preparation, cut/fill, support, foundations, lining, covers, flume erection, integral controls, curing, tests/correction/cleanup and temporary works. Record equipment/utilities once by task; underground routes must include actual support and muck handling."
      source_ids:
        - usbr-construction
        - ladwp-wip-2024
    - rule_id: b_supplied
      applies_to: "foreground_system_boundary"
      rule: "Separate supplied component/mixture manufacture, delivery and onsite installation. Actual onsite mixing, precasting or fabrication needs separate real atomic inputs; never count mixtures and embedded ingredients simultaneously. Upstream production is not silently merged into construction."
      source_ids:
        - usbr-construction
        - epa-washout-2012
    - rule_id: b_consumed_inputs
      applies_to: "foreground_system_boundary"
      rule: "For every supplied material or assembly input, construction/installation applicability identifies the intended work, not only successfully installed quantities. In each native unit use attributable gross receipts + opening stock - verified returns/transfers - closing reusable stock; include pre-acceptance spillage, damage, rejected-but-consumed items and replacements. Verified returns and reusable carryover are excluded from consumed input, while any attributable handling, transport or rework remains. Reconcile installed acceptance and waste separately; do not cancel consumed manufacture. Reusable temporary assets retain their conserved manufacturing share under the asset-allocation rules."
      source_ids: []
    - rule_id: b_stages
      applies_to: "foreground_system_boundary"
      rule: "Exclude later operation/conveyed-water pumping, maintenance/renewal and final demolition. Actual existing-asset removal at site preparation is construction input. Disclose land/hydrology/ecology, noise and traffic disturbance gaps without declaring zero impact; operational water supply is not construction water."
      source_ids:
        - ladwp-wip-2024
        - un-cpc3-2025
    - rule_id: b_complete_route
      applies_to: "foreground_system_boundary"
      rule: "Conditional cards do not authorize scope deletion. Actual other polymers, metal/timber flumes, prestressing, rock bolts, steel ribs, blasting, onsite batching, coatings or controls require additional atomic cards, original project method, collection and identity checks before project completeness can be claimed."
      source_ids:
        - usbr-construction
        - usbr-canals-2017
boundary_abstraction:
  declared_starting_condition: "Recorded preconstruction site, retained existing entity, inlet interfaces and actual supplier-gate material state"
  starting_condition_role: "foreground_start"
  product_classification_scope: "Complete supply-purpose nonpipeline conveyance work; classification only informs scope"
  recursive_input_rule: "Retained existing conduit is starting stock, not newly produced output; purchased same-category works need distinct upstream boundaries without recursive double counting"
  upstream_dataset_requirement: "Separately verify and link material, equipment and utility route/geography/property and production/transport boundary; supplier-gate data do not prove complete upstream coverage"
  disclosure: "Construction foreground through acceptance, with linked upstream module completeness reported separately; not an unqualified full-life or complete cradle-to-gate result"
