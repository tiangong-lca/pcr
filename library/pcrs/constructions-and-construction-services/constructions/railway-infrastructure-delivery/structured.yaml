allocation_rules:
  - rule_id: allocation_task_attribution
    applies_to: "all inventory rows"
    rule: "Avoid allocation by assigning delivery notes, submeter readings, machine task hours and waste tickets to the actual delivery. Retain shared-site totals and a reconciled attribution ledger. Where a shared input cannot be directly assigned, document the measured causal activity (e.g. actual pumping hours or hauled load) and the complete denominator across all deliveries; do not allocate rail works by cost or arbitrary equal shares. Losses and rework before acceptance belong to the delivered unit. Reused cut/fill inside the boundary is not a co-product; actual reusable export is a separate product with explicit quality, destination and burden allocation, not negative waste. No automatic avoided-production credits. rics-wlca-2024."
    source_ids:
      - rics-wlca-2024
  - rule_id: allocation_asset_conservation
    applies_to: "all inventory rows"
    rule: "Construction equipment manufacture and reusable temporary components are separate upstream contributions where included. cp_equipment records each physical asset, its evidenced total lifetime activity or actual cumulative use, prior allocations and the attributable project activity. A project share must be between zero and one, and cumulative shares across projects/periods/reuses must never exceed one; never reset the full manufacturing burden at each project. Unknown total activity/use history requires explicit review and sensitivity disclosure, not an invented lifetime or reuse count. Fixed permanent components installed in this delivery retain their actual supplied burden once."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_delivery
      process_id: "handover"
      flow_role: "reference_railway"
      record_type: "acceptance_record"
      raw_fields: "contract boundary; site; configuration; chainage; measured route and each track length/count; gauge; cross-section; system scope; acceptance status"
      collection_method: "Reconcile as-built survey, contract bill, equipment tags, tests and signed acceptance; confirm one delivery unit"
      unit: "item"
      frequency: "each delivery"
      temporal_coverage: "actual construction start through acceptance including rework"
      site_scope: "declared site and delivery unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw tickets, calibration, as-built surveys, batch certificates and scope reconciliation"
    - protocol_id: cp_materials
      process_id: "all_foreground_processes"
      flow_role: "each supplied material/component"
      record_type: "delivery_record"
      raw_fields: "row_id; work package; batch; supplied state; composition; mass/volume/count; certified density or linear mass; returns; stocks; installed amount; loss; equipment tags; failed/replaced-unit counts; opening and closing attributable stock; verified returns/transfers"
      collection_method: "Reconcile delivery tickets, calibrated weights/batch certificates and measured installed geometry row by row; split different grades/states; input count = gross attributable receipts + opening stock - verified returns/transfers - closing reusable stock. Include units consumed by pre-acceptance failures/rework; reconcile accepted installed count and actual waste separately without cancelling the input manufacturing burden."
      unit: "kg; m3; item"
      frequency: "each batch"
      temporal_coverage: "actual construction start through acceptance including rework"
      site_scope: "declared site and delivery unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw tickets, calibration, as-built surveys, batch certificates and scope reconciliation"
    - protocol_id: cp_energy
      process_id: "site_operation_handover"
      flow_role: "each fuel and electricity connection"
      record_type: "meter_record"
      raw_fields: "row_id; machine; task; time; readings; fuel batch density/fossil fraction; region; voltage; submeter; returns/stock change"
      collection_method: "Reconcile calibrated electric/fuel meters, issue/return records and task logs; attribute welding, compaction, pumping, lifting, haul and tests separately"
      unit: "kg; MJ"
      frequency: "each shift and test"
      temporal_coverage: "actual construction start through acceptance including rework"
      site_scope: "declared site and delivery unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw tickets, calibration, as-built surveys, batch certificates and scope reconciliation"
    - protocol_id: cp_water
      process_id: "earthwork_site_operation"
      flow_role: "mains_water; river_water; drain_return; washout"
      record_type: "water_record"
      raw_fields: "row_id; source; recipient; volume; time; purpose; abstraction/discharge gate; treatment; liquid composition; tank stock; reuse"
      collection_method: "Use separate calibrated flow meters or measured tank volumes; reconcile samples, destinations and abstraction/discharge records"
      unit: "m3"
      frequency: "daily and each dispatch"
      temporal_coverage: "actual construction start through acceptance including rework"
      site_scope: "declared site and delivery unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw tickets, calibration, as-built surveys, batch certificates and scope reconciliation"
    - protocol_id: cp_waste
      process_id: "earthwork_site_operation"
      flow_role: "segregated mass-based waste streams; excludes volume-based washout collected under cp_water"
      record_type: "dispatch_record"
      raw_fields: "row_id; source task; classification; composition; moisture; weight; destination; receiver; reuse; stock"
      collection_method: "Reconcile calibrated weighbridge and receiving records for each mass-based stream; split hazardous material, old demolition debris and new construction waste. Captured washout retains metered Volume/m3 under cp_water and is not forced into this kg ledger; separately removed solids are distinct measured mass streams without duplicating their presence in exported liquid."
      unit: "kg"
      frequency: "each dispatch"
      temporal_coverage: "actual construction start through acceptance including rework"
      site_scope: "declared site and delivery unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw tickets, calibration, as-built surveys, batch certificates and scope reconciliation"
    - protocol_id: cp_emissions
      process_id: "site_operation"
      flow_role: "co2; no; no2; pm10; additional actual species"
      record_type: "emission_record"
      raw_fields: "row_id; species/CAS; compartment/subcompartment; immediate/long-term; activity; method; factor source; concentration; flow rate; duration; controls; uncertainty"
      collection_method: "Use representative site sampling or traceable site/equipment model with actual activity; record unmeasured scope and never force total NOx into NO/NO₂"
      unit: "kg"
      frequency: "event/representative condition"
      temporal_coverage: "actual construction start through acceptance including rework"
      site_scope: "declared site and delivery unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw tickets, calibration, as-built surveys, batch certificates and scope reconciliation"
    - protocol_id: cp_equipment
      process_id: "all_foreground_processes"
      flow_role: "equipment and reusable temporary component burdens"
      record_type: "asset_ledger"
      raw_fields: "asset ID; manufacturing burden scope; cumulative activity/use evidence; project activity; prior/current shares; remaining share; temporary works destination"
      collection_method: "Reconcile same-asset cross-project use ledger and supplier evidence; independently check cumulative share does not exceed one; unknowns require review"
      unit: "item; h"
      frequency: "each use/delivery"
      temporal_coverage: "actual construction start through acceptance including rework"
      site_scope: "declared site and delivery unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw tickets, calibration, as-built surveys, batch certificates and scope reconciliation"
  calculation_rules:
    - id: same_delivery
      applies_to: "all inventory rows"
      rule: "Aggregate attributable records for the same declared delivery unit; normalize only per declared reference flow, retaining each numerator unit, without a per-kg or arbitrary length denominator."
      inputs:
        - cp_delivery
        - cp_materials
        - cp_energy
        - cp_water
        - cp_waste
        - cp_emissions
      output: "exchange amount per declared reference flow"
      source_ids: []
    - id: delivered_count
      applies_to: "reference_railway"
      rule: "One complete accepted delivery = 1 item; rejected/incomplete units cannot be reference output."
      inputs:
        - cp_delivery
      output: "reference_railway"
      source_ids:
        - hs2-phase2a-2017
    - id: conversion_records
      applies_to: "all inventory rows"
      rule: "Mass/volume/linear-mass/concentration/energy conversions use section 4 and actual same-batch records; retain formula, inputs, units, uncertainty and source; never automatically invent missing relationships."
      inputs:
        - cp_materials
        - cp_energy
        - cp_water
        - cp_emissions
      output: "traceably converted numerator quantities"
      source_ids: []
    - id: shared_asset_share
      applies_to: "all inventory rows"
      rule: "Attribute by section 7 measured causal activity and asset ledger; cumulative manufacturing shares across projects ≤1; unknown denominator retains review."
      inputs:
        - cp_equipment
        - cp_delivery
      output: "attributable delivery burden and coverage disclosure"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Verify substance/composition, state, route, geography, voltage, environmental medium, reference property, unit and official Chinese name; missing identity cannot be claimed resolved"
      evidence: "supplier certificates, public identities and raw foreground records"
    - id: completeness
      applies_to: "all foreground processes"
      requirement: "Reconcile all actual materials, equipment, energy, temporary works, logistics, losses, wastes, releases and tests by work package; distinguish absent, unmeasured and excluded"
      evidence: "as-built bill and gap ledger"
    - id: time_site
      applies_to: "all inventory rows"
      requirement: "Use actual construction/acceptance dates, same-site packages and real energy/supplier representativeness; historical sources are qualitative examples only"
      evidence: "ticket dates, site and dataset coverage"
    - id: uncertainty
      applies_to: "all inventory rows"
      requirement: "Record uncertainty/limitations for every measurement, conversion, allocation and background link; never replace no-data with zero or industry defaults"
      evidence: "calibration, sampling plan, certificates and sensitivity analysis"
    - id: environment
      applies_to: "site_operation; earthwork"
      requirement: "Retain site environmental evidence for noise, vibration, ecology and land disturbance; dB is not an additive material exchange or sound energy and is separately reported without a valid flow-property relationship"
      evidence: "actual monitoring, time/location and site environmental plan"
validation_rules:
  - rule_id: validate_delivery
    applies_to: "all inventory rows"
    rule: "Confirm reference product name equals reference_railway, amount is 1 item, and cp_delivery measured geometry/configuration/acceptance matches every inventory denominator."
    source_ids: []
  - rule_id: validate_route
    applies_to: "all inventory rows"
    rule: "Determine conditional processes from actual work; ballast/slab, overhead/third rail and steel-wheel/cable routes must match supplies and tasks, without narrowing the category for checking convenience."
    source_ids:
      - hs2-phase1-2013
      - hs2-phase2a-2017
  - rule_id: validate_balance
    applies_to: "all inventory rows"
    rule: "Reconcile soil cut/reuse/import/export/stock and installed materials/losses; same equipment/component and meter burdens conserve cumulative shares without duplicate accounting."
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "all inventory rows"
    rule: "Elementary flows require measurement or a site-applicable model with correct species, fossil/biogenic origin and medium; NO, NO₂, N₂O, dust size, resource water and waste liquid are not interchangeable."
