measurement_rules:
  - id: delivery_count
    applies_to: "reference_railway"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "item"
    rule: "1 item is one complete declared delivery confirmed by cp_delivery; all inventory rows use per declared reference flow."
  - id: geometry
    applies_to: "reference_railway"
    required_property_ref:
      name: "Measured geometry"
      uuid: ""
    required_unit: "m"
    rule: "cp_delivery collects as-built chainage, each track length/count, gradient, cross-section and configuration; route-km differs from track-km and cost cannot convert to mass."
  - id: material_state
    applies_to: "mass-based material and waste inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use actual supplied/waste mass state; dry/wet state, embedded component scope and certified linear mass require cp_materials/cp_waste; m3 to kg requires actual same-batch density, never a universal density. This mass rule does not replace the native MJ, m3 or item property/unit of energy, volume or count exchanges. Any auxiliary mass reconciliation for those rows is separately linked to the original exchange and supported by actual matching-state evidence."
  - id: energy_units
    applies_to: "electricity_lv, electricity_mv, test_power"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve public Net calorific value and energy unit group; kWh × 3.6 = MJ; diesel mass is not MJ and heating value requires actual batch measurement/certificate."
  - id: water_identity
    applies_to: "mains_water, river_water, drain_return, washout"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Meter supply, river resource abstraction, river discharge and collected washout separately; net water use does not replace the gross exchanges."
