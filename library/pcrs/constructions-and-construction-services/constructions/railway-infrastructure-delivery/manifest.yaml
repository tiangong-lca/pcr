review_metadata:
  scientific_review: pending
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: fill
      flow_name: Imported uncontaminated mineral soil for railway embankment
      reason: Foundation backfill candidate is a soil-remediation construction service with Area reference, not supplied embankment soil.
    - row_id: drain_pipe
      flow_name: Precast concrete railway drainage pipe
      reason: Plastic, ceramic and oil/gas steel pipe candidates do not identify a precast concrete drainage pipe.
    - row_id: soil_waste
      flow_name: Uncontaminated excavated mineral soil sent for disposal
      reason: Excavated-soil product and contaminated-remediation waste routes are different identities.
    - row_id: subballast
      flow_name: Crushed granite sub-ballast aggregate
      reason: Combined graded ballast/sub-ballast candidates do not establish this separate granite layer and grading.
    - row_id: ballast
      flow_name: Crushed granite track ballast
      reason: Generic graded aggregates do not establish granite ballast grading; no stone type or density inferred.
    - row_id: sleeper
      flow_name: Prestressed concrete railway sleeper
      reason: Generic precast concrete, floor slab and coach-component candidates do not identify a complete railway sleeper.
    - row_id: rails
      flow_name: Finished steel railway rail
      reason: Rail transport, structural sections and combined fixtures do not establish finished railway rail identity.
    - row_id: clip
      flow_name: Steel rail fastening clip
      reason: Chemical search hits and generic combined railway fittings are not a specific finished clip.
    - row_id: pad
      flow_name: Elastomer rail pad
      reason: Polymer resin and unspecified rubber products do not establish one finished rail pad.
    - row_id: bound_layer
      flow_name: Cement-bound granular track base mixture
      reason: Trackbed combined-layer and cement identities do not identify this actual supplied mixture.
    - row_id: track_slab
      flow_name: Precast reinforced concrete railway track slab
      reason: Floor slab and generic precast concrete do not establish track slab and embedded-component scope.
    - row_id: grout
      flow_name: Cementitious track-slab grout
      reason: Generic mortar and grout candidates need actual formulation/state confirmation.
    - row_id: concrete
      flow_name: Ready-mixed concrete before placement
      reason: Cast-in-place-concrete candidate represents installed work, not ready-mix before placement.
    - row_id: mast
      flow_name: Fabricated steel overhead-line support mast
      reason: Combined bridge/tower/lattice-mast product cannot establish the particular overhead-line mast.
    - row_id: contact_wire
      flow_name: Copper-alloy railway contact wire
      reason: Public pure copper wire does not prove actual contact-wire alloy, profile and mechanical state.
    - row_id: transformer
      flow_name: Complete railway traction transformer
      reason: Transformer substation/civil and prepared transformer stock are not one complete traction transformer.
    - row_id: control_cable
      flow_name: Insulated copper railway control cable
      reason: Public copper control/power cable has Net calorific value reference; actual mass-to-energy conversion is not established, so its property is not rewritten.
    - row_id: control_cabinet
      flow_name: Complete railway interlocking control cabinet
      reason: Combined signalling/fittings/rolling-stock parts do not establish one configured interlocking cabinet.
    - row_id: haul_rope
      flow_name: Finished steel cableway haul rope
      reason: Steel wire and lifting-rope products do not establish cableway haul-rope specification.
    - row_id: sheave
      flow_name: Complete steel cableway rope sheave
      reason: No directly verified rope-sheave identity with this complete component scope.
    - row_id: cable_drive
      flow_name: Complete electric cableway drive unit
      reason: Generic motor/traction motor/gearbox identities do not identify the complete cableway drive.
    - row_id: mains_water
      flow_name: Treated mains water supplied to railway construction site
      reason: Mass-based drinking-water plant identities and regional tap-water candidates do not establish actual volume-based site supply.
    - row_id: steel_offcut
      flow_name: Steel rail installation offcut sent for recycling
      reason: Post-industrial at-plant and pretreated scrap product candidates have different gates from rail installation waste.
    - row_id: concrete_waste
      flow_name: Hardened concrete construction offcut
      reason: Mixed construction/demolition waste does not establish segregated concrete offcut identity.
    - row_id: washout
      flow_name: Contained concrete washout liquid for treatment
      reason: Manganese-slag washing, municipal wastewater and generic emissions-to-water candidates do not identify concrete washout treatment transfer.
    - row_id: film_waste
      flow_name: Polyethylene packaging film waste
      reason: Film product and mixed plastic waste are not verified polyethylene packaging waste at the site gate.
    - row_id: test_power
      flow_name: Electricity supplied for railway delivery tests
      reason: Testing supply region, voltage and provider are project-specific; no universal public identity is adopted.
    - row_id: reference_railway
      flow_name: Completed railway infrastructure delivery unit
      reason: Public Railways flow has Mass reference and manufactured-at-plant qualifier; no actual whole-asset mass conversion/support is established for this count-defined delivery.
  limitations:
    - Candidate methodology; independent scientific review pending; no publication or engineering/compliance approval.
    - All CPC railway entity routes retained; actual work packages require complete measured atomic inventories. Example rows are not a universal recipe.
    - No default lifespan, per-km or whole-asset mass, geometry, design load, material ratio, emission factor or construction energy.
    - Site construction-to-delivery foreground only; upstream manufacture, transport, waste treatment, later operation/maintenance/demolition require separately declared coverage.
    - Historical HS2 proposals and manufacturer refurbishment example provide qualitative process context only; actual project specifications and acceptance control applicability.
