  calculation_rules:
    - id: project_ledger
      applies_to: "all inventory rows"
      rule: "Reconcile actual deliveries, returns, work-package issues, waste transfers and meter records; attribute the documented quantity to this single reference building without dividing by a default dwelling count or area. Preserve internal transfers without double counting.  For permanent/consumed supplied materials and assemblies, apply boundary_consumed_inputs, retaining all attributable failed installation and replacement consumption in actual native units and exact supplied identities. Accepted installation and actual waste stay separate; reusable equipment/formwork manufacture retains allocation_reuse shares rather than the net-stock consumption equation."
      inputs:
        - cp_groundworks
        - cp_structure
        - cp_enclosure
        - cp_fitout
        - cp_fixed_systems
        - cp_common_facilities
        - cp_site_utilities
        - cp_waste_transfer
        - cp_inbound_delivery
        - cp_handover
      output: "row amount per declared reference flow"
      source_ids:
        - rics-wlca-2024
    - id: equipment_consumption
      applies_to: "ceramic_toilet; led_luminaire; heat_pump; water_booster; passenger_lift; ventilation_fan; fire_door; water_tank; steel_duct"
      rule: "Net consumed quantity in each row native unit = gross receipts + opening stock - verified returns/transfers - closing usable stock. Retain item counts for count-based assemblies and measured kg for mass-based pumps, tanks and ducts; do not invent count-to-mass conversion. Include pre-acceptance damage, rejected-and-scrapped units, cutting losses and replacement consumption. Keep accepted installed quantity separate; reconcile consumption to retained installation plus attributable scrap and other evidenced consumption destinations. Waste treatment does not replace manufacturing inputs for scrapped units; no default loss rate."
      inputs:
        - cp_fixed_systems
        - cp_common_facilities
      output: "individual native-unit supplied input per declared reference flow"
      source_ids:
        - jrc-levels-boq-2021
    - id: electricity_conversion
      applies_to: "lv_electricity; mv_electricity"
      rule: "Multiply actual metered kWh by 3.6 to report MJ; retain the same delivered electricity and voltage gate; separately evidence any transformer losses."
      inputs:
        - cp_site_utilities
      output: "MJ per declared reference flow"
      source_ids: []
    - id: fuel_conversion
      applies_to: "site_diesel"
      rule: "Use measured fuel mass and batch net calorific value for MJ; litres require batch/site density at recorded conditions. Actual carbon/oxidation evidence determines the fossil CO2 component independently."
      inputs:
        - cp_site_utilities
      output: "fuel MJ per declared reference flow"
      source_ids: []
    - id: freight_legs
      applies_to: "road_freight"
      rule: "For each actual leg multiply documented payload tonnes by travelled km and sum attributable legs. Report allocation/empty returns and exclude legs already in supplier data."
      inputs:
        - cp_inbound_delivery
      output: "t*km per declared reference flow"
      source_ids:
        - rics-wlca-2024
  data_quality_requirements:
    - id: quality_completeness
      applies_to: "dataset"
      requirement: "Reconcile shell/core/external and every private/common work package to delivered scope. Add all actual materials/equipment, route-specific waste and releases absent from these rows. Absence needs documented not-applicable justification; uncollected required quantities are gaps, not zero."
      evidence: "jrc-levels-boq-2021; cp_handover"
    - id: quality_shared
      applies_to: "common_facilities"
      requirement: "Retain whole-building and parent shared-facility ledgers, capacity/service evidence and area definitions. Do not equate dwelling count, beds, rooms and residents or silently exclude common areas."
      evidence: "rics-wlca-2024; cp_geometry; cp_common_facilities"
    - id: quality_representativeness
      applies_to: "all inventory rows"
      requirement: "Report construction dates, site, supplier technology/region, measured vs modelled amounts, calibration, unmetered periods, uncertainty and upstream compatibility. Distinguish missing measurements/UUIDs from demonstrated absence."
      evidence: "cp_site_utilities; cp_handover"
    - id: quality_environment
      applies_to: "site_utilities; waste_transfer"
      requirement: "Direct pollutant estimates require actual source chemistry, medium/submedium, immediate/long-term state and supported engine/soil/weather/treatment conditions. Report noise and water-routing data/characterization gaps; never treat an emission name as proof of occurrence."
      evidence: "epa-construction-dust-2010; epa-concrete-washout-2012"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_building"
    rule: "Verify the residential/community category and one real whole-building output, signed delivery state, actual count/capacity and all qualifiers. A room or construction service cannot use this reference identity."
    source_ids:
      - un-cpc-3-53112
  - rule_id: validate_geometry_shared
    applies_to: "dataset"
    rule: "Check measured private/common/service area categories and conventions against as-built plans; reconcile all assigned shared facility/basement burdens and total project quantities. Any supplementary occupant/dwelling attribution must preserve whole-building totals and disclose its actual basis."
    source_ids:
      - rics-wlca-2024
  - rule_id: validate_atomic_units
    applies_to: "all inventory rows"
    rule: "Check each single physical/chemical exchange, exact public reference property/unit group, conditional applicability, collection protocol and common denominator in both languages. Blank UUID identities remain registered gaps; a near label never authorizes substitution."
    source_ids: []
  - rule_id: validate_stages
    applies_to: "dataset"
    rule: "Verify manufacture linkage, transport and construction coverage separately; no full cradle-to-gate/full-life claim when stages or required quantities are missing. Acceptance evidence does not establish PCR scientific approval or local occupancy permission."
    source_ids:
      - rics-wlca-2024
  - rule_id: validate_releases
    applies_to: "site_utilities; waste_transfer"
    rule: "Check fossil/bio origin, NO vs NO2/N2O, nonoverlapping particulate fractions, natural intake vs technical water/wastewater and actual receiving medium. Prevent background combustion/treatment duplication and preserve unresolved required environmental data as incomplete coverage."
    source_ids:
      - epa-concrete-washout-2012
      - epa-construction-dust-2010
  - rule_id: validate_asset_shares
    applies_to: "plywood_formwork; site_utilities"
    rule: "Verify reused-asset identity, lifetime-activity evidence and cumulative manufacturing shares across projects/periods not exceeding one. Missing denominators require review rather than resetting asset manufacture."
    source_ids:
      - rics-wlca-2024
      - ghg-allocation-2011
  - rule_id: validate_equipment_consumption
    applies_to: "ceramic_toilet; led_luminaire; heat_pump; water_booster; passenger_lift; ventilation_fan; fire_door; water_tank; steel_duct"
    rule: "Verify row/model-specific receipts, stocks and returns/transfers under equipment_consumption in each native unit. Reconcile consumed damaged/replacement quantities, accepted installation and waste separately, including permanent common facilities. Exclude verified returned rejects and usable carryover from consumption; final installed counts or masses cannot substitute for input consumption. Reusable temporary manufacture follows allocation_reuse rather than this consumption equation."
    source_ids:
      - jrc-levels-boq-2021
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared whole residential/community building construction delivery, with explicit upstream linking and stage coverage; comparisons only with equivalent delivery scope, housing function, geometry and shared facility treatment"
  excluded_use: "Full lifetime/service-year claim; universal kg/building or material recipe; legal approval; construction service; private-apartment-only footprint presented as whole building"
  required_metadata: "All reference qualifiers; private/common and parent assessment registers; actual structure/route; acceptance scope; stage and upstream gates; actual data/calibration/allocation sources"
  required_quality_disclosure: "Measured/modelled scope, missing upstream and quantities, unresolved identities, environmental/characterization gaps, representativeness, shared/reused asset allocation uncertainty and excluded later stages"
  update_trigger: "Changes to use/capacity/dwelling configuration, site/geometry, common installations, delivery state, structural route, suppliers, measured records or evidence status"
data_sources:
  - id: "un-cpc-3-53112"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 subclass 53112 explanatory note. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/53112"
    used_for: "Category boundary: three or more dwellings and community residences. Classification establishes neither construction recipe nor legal permission."
  - id: "jrc-levels-boq-2021"
    type: "official_guidance"
    reference: "European Commission JRC, Level(s) indicator 2.1 Bill of Quantities, publication v1.1 January 2021, PDF/printed pp.23–24, Table 2. https://susproc.jrc.ec.europa.eu/product-bureau/sites/default/files/2021-01/UM3_Indicator_2.1_v1.1_34pp.pdf"
    used_for: "Element/installed-system coverage prompts only; no example quantities, default material intensity or lifespans adopted. Actual project records determine every quantity."
  - id: "rics-wlca-2024"
    type: "standard"
    reference: "RICS Whole life carbon assessment for the built environment, second edition, version 3 August 2024; section 3.5–3.6 printed p.36/PDF p.44; section 5.1.4 printed pp.80–82/PDF pp.88–90. https://www.rics.org/content/dam/ricsglobal/documents/standards/Whole_life_carbon_assessment_PS_Sept23.pdf."
    used_for: "Shared/community facilities, linked-building assessment, site activities and reusable temporary works; no default emission rates, service lives or blanket RICS whole-life compliance claim."
  - id: "ghg-allocation-2011"
    type: "official_guidance"
    reference: "WRI/WBCSD Product Life Cycle Accounting and Reporting Standard, 2011, chapter 9, Tables 9.1–9.2 printed p.63/PDF p.65. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Historical method hierarchy for subdivision and evidenced allocation; no default shares or new regulatory claim."
  - id: "epa-construction-dust-2010"
    type: "official_guidance"
    reference: "US EPA AP-42 13.2.3 Heavy Construction Operations, January 1995 corrected February 2010, printed p.13.2.3-1/PDF p.1. https://www.epa.gov/sites/default/files/2020-10/documents/13.2.3_heavy_construction_operations.pdf"
    used_for: "Historical qualitative dust/activity/weather relationship only; no universal current factor or automatic emission."
  - id: "epa-concrete-washout-2012"
    type: "official_guidance"
    reference: "US EPA Concrete Washout, EPA-833-F-11-006 February 2012, PDF pp.1–2. https://www.epa.gov/sites/default/files/2015-11/documents/concretewashout_0.pdf"
    used_for: "Historical washout state and routing distinctions; actual measured composition, destinations and local permits must be collected independently."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:388f747c95d90188a008149d8b1743aeeee04d7c7cc69d5fe5fb7a8a05e7fd49"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6075"
      family: "system_boundary"
      span:
        start:
          offset: 6075
          line: 59
          column: 1
        end:
          offset: 10948
          line: 80
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Recorded initial site and supplied product gates, including actual enabling works and retained structures |\n| starting_condition_role | foreground_start |\n| product_classification_scope | Multi-dwelling and community residential physical building entity |\n| recursive_input_rule | A retained/reused same-category structure is a separately identified existing asset input with declared burdens and condition, not a second new whole-building output |\n| upstream_dataset_requirement | Link every actual supplied atomic material/component to unit/state/gate-compatible manufacturing evidence; identify missing supplier/background coverage |\n| disclosure | Separate upstream manufacture, inbound transport, site construction, initial demolition if any, waste routing and excluded use/maintenance/final demolition; declare common/site works attribution |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_delivery | all inventory rows | Account for the delivered whole entity and every actually occurring exchange in shell, core, private and communal works. These conditional rows are minimum inspection prompts, not a closed universal bill of materials. Add separate atomic rows for actual roof coverings, fittings, stairs, external works, heat/cooling plant, community kitchens, security/fire systems and their specific materials when present. No alternative is silently substituted or omitted. | jrc-levels-boq-2021; rics-wlca-2024 |\n| boundary_consumed_inputs | permanent/consumed supplied materials and assemblies; excludes reusable-asset manufacture | Local installed, delivered, commissioned or as-built wording specifies the intended route/configuration and acceptance evidence; it does not exclude attributable materials or assemblies consumed in attempted installation, damage, rejected-and-scrapped work or replacements before acceptance. In each native unit, consumed input = attributable gross receipts + opening stock - verified returns/transfers - closing usable stock. Retain actual supplied identity/configuration and assembly inclusions, with failed/replaced items traced to their own identity rather than the final replacement identity. Reconcile accepted installation and waste separately. Verified returns/usable surplus are excluded from consumption, but their attributable transport/handling/rework remains. This equation does not measure reusable equipment/formwork manufacture: retain section 7 conserved lifetime-use shares even when assets are returned/transferred/held in closing stock, and never charge the same asset as both full consumption and a use share. |  |\n| boundary_stages | dataset | Manufacture of installed equipment/materials is upstream; fitting, lifting, site conditioning, pressure tests and commissioning are foreground. Operation, real future maintenance/renewal and final dismantling are separately scoped later stages. Initial site demolition and clearance are construction-enabling activities when actually undertaken, not future demolition. Disclose missing A1–A3/A4/A5 coverage. | rics-wlca-2024 |\n| boundary_common | common_facilities | Include actual shared stairs, cores, plant rooms and residential-community facilities in the whole-building ledger, even if separately contracted. Identify central systems and served zones. For linked buildings with shared basements, establish a combined assessment ledger before attributing building shares; disclose the parent assessment and conservation. Do not hide all shared works outside private apartment area.  For permanent common-facility supplied inputs, local installed/commissioned wording specifies intended configuration and route, not successful installation as a condition for counting manufacture. Include attributable pre-acceptance damage, scrapped rejects, cutting losses and replacement consumption under cp_common_facilities; verified returns and reusable unused stock are not consumed inputs. Native-unit input = gross attributable receipts + opening stock - verified returns/transfers - closing usable stock. Accepted installation and actual wastes are separate reconciled records. This consumption formula excludes reusable temporary equipment/formwork manufacture, which retains allocation_reuse lifetime shares. | rics-wlca-2024 |\n| boundary_releases | site_utilities | Record technical supplied water separately from natural resource intake; track dewatering returns by destination and chemistry. Washout liquid/solids are not freshwater. Inventory actual direct exhaust/dust/discharges only with release evidence; assess construction noise using actual equipment/receptor/time evidence and disclose characterization gaps without inventing a mass flow. | epa-concrete-washout-2012; epa-construction-dust-2010 |\n\n"
