  reference_flow_link: "reference_building"
system_boundary:
  rules:
    - rule_id: boundary_delivery
      applies_to: "all inventory rows"
      rule: "Account for the delivered whole entity and every actually occurring exchange in shell, core, private and communal works. These conditional rows are minimum inspection prompts, not a closed universal bill of materials. Add separate atomic rows for actual roof coverings, fittings, stairs, external works, heat/cooling plant, community kitchens, security/fire systems and their specific materials when present. No alternative is silently substituted or omitted."
      source_ids:
        - jrc-levels-boq-2021
        - rics-wlca-2024
    - rule_id: boundary_consumed_inputs
      applies_to: "permanent/consumed supplied materials and assemblies; excludes reusable-asset manufacture"
      rule: "Local installed, delivered, commissioned or as-built wording specifies the intended route/configuration and acceptance evidence; it does not exclude attributable materials or assemblies consumed in attempted installation, damage, rejected-and-scrapped work or replacements before acceptance. In each native unit, consumed input = attributable gross receipts + opening stock - verified returns/transfers - closing usable stock. Retain actual supplied identity/configuration and assembly inclusions, with failed/replaced items traced to their own identity rather than the final replacement identity. Reconcile accepted installation and waste separately. Verified returns/usable surplus are excluded from consumption, but their attributable transport/handling/rework remains. This equation does not measure reusable equipment/formwork manufacture: retain section 7 conserved lifetime-use shares even when assets are returned/transferred/held in closing stock, and never charge the same asset as both full consumption and a use share."
      source_ids: []
    - rule_id: boundary_stages
      applies_to: "dataset"
      rule: "Manufacture of installed equipment/materials is upstream; fitting, lifting, site conditioning, pressure tests and commissioning are foreground. Operation, real future maintenance/renewal and final dismantling are separately scoped later stages. Initial site demolition and clearance are construction-enabling activities when actually undertaken, not future demolition. Disclose missing A1–A3/A4/A5 coverage."
      source_ids:
        - rics-wlca-2024
    - rule_id: boundary_common
      applies_to: "common_facilities"
      rule: "Include actual shared stairs, cores, plant rooms and residential-community facilities in the whole-building ledger, even if separately contracted. Identify central systems and served zones. For linked buildings with shared basements, establish a combined assessment ledger before attributing building shares; disclose the parent assessment and conservation. Do not hide all shared works outside private apartment area.  For permanent common-facility supplied inputs, local installed/commissioned wording specifies intended configuration and route, not successful installation as a condition for counting manufacture. Include attributable pre-acceptance damage, scrapped rejects, cutting losses and replacement consumption under cp_common_facilities; verified returns and reusable unused stock are not consumed inputs. Native-unit input = gross attributable receipts + opening stock - verified returns/transfers - closing usable stock. Accepted installation and actual wastes are separate reconciled records. This consumption formula excludes reusable temporary equipment/formwork manufacture, which retains allocation_reuse lifetime shares."
      source_ids:
        - rics-wlca-2024
    - rule_id: boundary_releases
      applies_to: "site_utilities"
      rule: "Record technical supplied water separately from natural resource intake; track dewatering returns by destination and chemistry. Washout liquid/solids are not freshwater. Inventory actual direct exhaust/dust/discharges only with release evidence; assess construction noise using actual equipment/receptor/time evidence and disclose characterization gaps without inventing a mass flow."
      source_ids:
        - epa-concrete-washout-2012
        - epa-construction-dust-2010
boundary_abstraction:
  declared_starting_condition: "Recorded initial site and supplied product gates, including actual enabling works and retained structures"
  starting_condition_role: "foreground_start"
  product_classification_scope: "Multi-dwelling and community residential physical building entity"
  recursive_input_rule: "A retained/reused same-category structure is a separately identified existing asset input with declared burdens and condition, not a second new whole-building output"
  upstream_dataset_requirement: "Link every actual supplied atomic material/component to unit/state/gate-compatible manufacturing evidence; identify missing supplier/background coverage"
  disclosure: "Separate upstream manufacture, inbound transport, site construction, initial demolition if any, waste routing and excluded use/maintenance/final demolition; declare common/site works attribution"
