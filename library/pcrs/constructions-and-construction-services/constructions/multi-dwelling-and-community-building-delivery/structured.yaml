measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Use cp_handover for one actual accepted whole building. All exchanges use the same declared reference flow; apartment counts never multiply common structure burdens."
  - id: geometry
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Collect cp_geometry survey definitions and private/common/service area breakdown. Reconcile included floor plates without double-counting corridors; keep footprint, gross internal and usable areas distinct. Area reporting is supplementary and cannot imply equal dwelling function."
  - id: energy
    applies_to: "lv_electricity; mv_electricity; site_diesel"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve actual Net calorific value property and reference energy unit. Metered electricity kWh is multiplied by 3.6 to MJ; fuel requires actual batch net calorific value and measured mass/density. No default fuel factor."
  - id: physical_quantities
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual row reference property"
      uuid: ""
    required_unit: "row unit"
    rule: "Retain each measured mass, area, volume, item or transport quantity in its real property. Conversions need material-specific measurements, thickness/density and physical-state evidence; volume of soil or washwater is not abstracted-resource water."
