allocation_rules:
  - rule_id: allocation_whole
    applies_to: "dataset"
    rule: "The reference is one building. Private apartments/rooms, cores and common facilities are components, not co-products automatically requiring division by dwelling count. Keep the whole-building inventory. Supplementary dwelling/room reports must preserve the building total and identify common-space assignment."
    source_ids:
      - rics-wlca-2024
  - rule_id: allocation_shared
    applies_to: "all inventory rows"
    rule: "First subdivide meters, deliveries and work packages to avoid allocation. Where shared basements, utilities or central facilities serve multiple buildings/uses, record their complete common ledger once, then justify shares by actual physical service, measured GIA, occupancy/capacity or other evidenced use relationships. No universal equal-per-dwelling or area ratio is prescribed. Declare numerator/denominator and unmatched uses; all assigned and unassigned shares reconcile to one, with sensitivity if the relation is uncertain."
    source_ids:
      - rics-wlca-2024
      - ghg-allocation-2011
  - rule_id: allocation_reuse
    applies_to: "plywood_formwork; site_utilities"
    rule: "Keep asset identifiers for reused formwork, scaffolding and equipment. Manufacturing burdens use evidenced total lifetime activity/reuses and actual project deployment; transport, repairs, losses and end-of-life remain explicit. Cumulative manufacturing shares across projects, periods and reuse shall not exceed one; an observation period may allocate only its attributable manufacturing share. Unknown lifetime/total activity is a review gap, never a reset to full manufacture per project."
    source_ids:
      - rics-wlca-2024
      - ghg-allocation-2011
  - rule_id: allocation_waste
    applies_to: "waste_transfer"
    rule: "Record actual waste transfer, treatment coverage and recovered-product destination separately; do not treat construction scrap as an automatic avoided-production credit. Declare recycling allocation and supplier gate overlap consistently."
    source_ids:
      - ghg-allocation-2011
