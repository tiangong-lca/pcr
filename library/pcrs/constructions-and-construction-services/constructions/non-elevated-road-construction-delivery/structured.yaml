product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.constructions.non-elevated-road-construction-delivery"
  classification_refs: "CPC 3.0 53211 (context only)"
  covered_products: "Non-elevated road entities and the officially included paths, parking and road-safety/crossing installations, as one declared accepted work"
  excluded_products: "Elevated highways; standalone bridges; highway tunnels; railways; runways; upstream materials; equipment; construction services"
  representative_product: "One accepted complete site-specific road section or bounded road facility with its actual ancillary works"
  production_route: "Actual earthworks and subgrade; aggregate/unpaved, asphalt, concrete or modular pavement routes as built; integral drainage and safety works; inspection and handover"
  market_state: "Installed physical entity accepted at site; not a mass-normalized material or equipment output"
functional_unit:
  what: "Provide the declared vehicular/pedestrian access function in the configured road entity at handover"
  how_much: "One complete accepted work with measured chainage/length, lane/usable width, surface area and layer/structure dimensions; for an area facility use its surveyed perimeter and usable area. These are descriptors of the same work, not alternative inventory denominators."
  how_well: "As-built geometry, intended users/traffic loading, subgrade and pavement configuration, drainage and safety specification, acceptance test results and nonconformities declared from the actual project; no default design load or compliance approval"
  how_long_or_cycle: "One documented construction-to-acceptance cycle; no operational service duration is assessed. Any later lifetime comparison needs separately supported performance, maintenance and end-of-life stages."
  reference_flow_link: "finished_road"
system_boundary:
  rules:
    - rule_id: b_construction
      applies_to: "foreground_system_boundary"
      rule: "Include actual mobilization, site preparation, excavation/cut-fill, subgrade/base, paving, drainage, crossings, safety, site water/energy, corrections, temporary works and waste transfers required to deliver the configured entity. Record activity per task; site support rows cover that task energy once."
      source_ids:
        - fhwa-pavement-lca-2016
        - fhwa-fp24-construction
    - rule_id: b_upstream
      applies_to: "foreground_system_boundary"
      rule: "Purchased mixes/assemblies enter in their actual supplied state; extraction, cement/steel/bitumen manufacture, batch mixing and equipment fabrication stay upstream unless actually performed onsite and explicitly added as separate processes. Never count a purchased mixture and its ingredients simultaneously."
      source_ids:
        - fhwa-pavement-lca-2016
    - rule_id: b_later
      applies_to: "foreground_system_boundary"
      rule: "Traffic operation, future maintenance/replacement and final demolition are excluded from this initial-construction dataset. Distinguish removal of existing assets during site preparation from future demolition. Work-zone diversion/delay and land-use/biodiversity are disclosed assessment gaps unless independently modeled; no inference of zero impact."
      source_ids:
        - fhwa-pavement-lca-2016
    - rule_id: b_extensions
      applies_to: "foreground_system_boundary"
      rule: "For a route or structural component absent from the cards, extend the actual process and atomic exchanges using project quantities, original method evidence and identity checks before claiming complete project coverage. Blasting, piling, retaining structures, steel crossings, landscaping, lighting or electronic safety equipment cannot be silently omitted when installed."
      source_ids:
        - fhwa-fp24-construction
boundary_abstraction:
  declared_starting_condition: "Documented site before initial construction and supplied construction products at their declared supplier gate"
  starting_condition_role: "foreground_start"
  product_classification_scope: "Complete non-elevated road work within the actual project perimeter; CPC 53211 is coverage context"
  recursive_input_rule: "Existing road retained in place is starting stock, not newly produced road input; disclose its physical extent and intervention. Separately acquired same-category work needs its own bounded upstream dataset; do not recurse into this output or double-count existing construction."
  upstream_dataset_requirement: "Link separately verified material/utility/equipment datasets with explicit production and transport boundary, route, geography and units. Supplier gate inventories alone do not prove complete upstream impact coverage."
  disclosure: "Foreground initial construction and acceptance only; linked upstream modules reported separately with completeness. Not an unqualified cradle-to-gate or whole-life result."
