allocation_rules:
  - rule_id: a_task
    applies_to: "foreground_burden_allocation"
    rule: "Prefer separately metered task quantities and identifiable material lots. For shared utilities or haulage, partition using measured equipment hours with load/fuel evidence, metered volumes or actual consignments; preserve the denominator ledger and reconcile allocated totals to the original measured totals. Do not allocate by contract price or assumed equal lengths."
    source_ids:
      - fhwa-pavement-lca-2016
  - rule_id: a_reuse
    applies_to: "foreground_burden_allocation"
    rule: "Equipment fabrication is outside the default construction foreground; disclose this gap. When linked in an extended dataset, and for reusable temporary works, maintain one cross-project manufacturing-burden ledger: a use share equals attributable actual activity divided by evidenced cumulative service activity for the same asset and manufacturing scope. Cumulative shares over projects, periods and repeated use must not exceed one. Unknown denominator, future reuse or lifetime stays review; no full-burden reset each project. Report damage/replacement separately and reconcile stock."
    source_ids:
      - fhwa-pavement-lca-2016
  - rule_id: a_recycling
    applies_to: "foreground_burden_allocation"
    rule: "Separate internal reuse, exported waste and separately verified recovered product. No automatic avoided-production credit; retain transfer/treatment burden and disclose the actual recycling allocation boundary. Any separate substitution claim requires reviewed counterfactual, quality and destination evidence; do not create a fictitious co-product from spoil."
    source_ids:
      - fhwa-pavement-lca-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_delivery
      process_id: "handover"
      flow_role: "finished_road"
      record_type: "acceptance_record"
      raw_fields: "project id; perimeter; accepted whole-work count; chainage; length; width; area; layer dimensions; component schedule; users/load basis; acceptance/date; defects"
      collection_method: "Survey as-built geometry and reconcile signed acceptance with the whole asset/component schedule; count only the same complete accepted configuration. Do not use budget/pay-item totals as physical measurements."
      unit: "item"
      frequency: "At acceptance and every scope correction"
      temporal_coverage: "Entire construction through acceptance"
      site_scope: "Declared whole-work perimeter"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "survey/calibration; as-built drawings; test records; signed acceptance and configuration reconciliation"
    - protocol_id: cp_material
      process_id: "all_foreground_processes"
      flow_role: "material_input"
      record_type: "weighing_record"
      raw_fields: "task; lot; supplier; composition; grade; wet/dry state; receipt/return; density if volume-converted; placement; reusable asset ledger ; attributable opening/closing reusable stocks; verified transfers; consumed losses and rework"
      collection_method: "Use calibrated weighbridge/batch scales and receipts; reconcile delivery, installed quantity, returns, waste and stock change. When using geometric volume, measure matching lot density rather than a typical value. Keep upstream gate separate from onsite installation.  For imported_fill, use attributable gross receipts + opening stock - verified returns/transfers - closing reusable stock on a matching material/moisture basis; record consumption and placement separately. This does not replace reusable-asset manufacturing attribution."
      unit: "kg"
      frequency: "Every lot and task"
      temporal_coverage: "All work incl. rejected/reworked batches"
      site_scope: "Supplier receipt to installation"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; delivery tickets; material balance; mix sheets; reuse ledger"
    - protocol_id: cp_energy
      process_id: "support"
      flow_role: "energy_input"
      record_type: "meter_record"
      raw_fields: "equipment; task; start/end; idling; fuel grade/mass; meter readings; stock; voltage; region; fuel calorific evidence"
      collection_method: "Meter purchased fuel and electricity over full project including setup, standby and rework; tag excavating, grading, compaction, paving, pumping, sawing and lighting. Calibrated meter/stock reconciliation takes precedence over generic horsepower estimates."
      unit: "kg; MJ; kWh"
      frequency: "Daily and task changes"
      temporal_coverage: "Mobilization through demobilization and acceptance"
      site_scope: "Actual equipment and site utilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "fuel tickets; stock balance; meter calibration; allocation ledger"
    - protocol_id: cp_water
      process_id: "support_concrete"
      flow_role: "water_input_and_liquid_waste"
      record_type: "meter_and_sampling_record"
      raw_fields: "task; source; intake; recycle; discharge; recipient; treatment; aquifer/river; pH; solids; sampling conditions"
      collection_method: "Meter purchased supply, natural-source withdrawal and wastewater separately; map internal recycle. Sample actual washout/dewatering before treatment/discharge and document route. Receiving-water pollutant mass requires substance-specific concentration times matching volume, not a bulk wastewater elementary flow."
      unit: "m3"
      frequency: "Every source/recipient and discharge event"
      temporal_coverage: "Entire construction water operation"
      site_scope: "Actual site and water sources/recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meters; laboratory reports; route/recipient records; water balance"
    - protocol_id: cp_waste
      process_id: "all_foreground_processes"
      flow_role: "solid_waste"
      record_type: "transfer_record"
      raw_fields: "material; lot; moisture; hazard status; weight; origin; recipient; recovery/disposal; haul distance"
      collection_method: "Weigh each physical waste stream independently and verify transfer receipts; reconcile material balance and separate preconstruction removals from new-work loss. Exclude internal reuse from external waste totals."
      unit: "kg"
      frequency: "Every transfer"
      temporal_coverage: "All preparation and construction waste"
      site_scope: "Site boundary and actual recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weigh tickets; hazard characterization; destination receipts"
    - protocol_id: cp_emission
      process_id: "support"
      flow_role: "elementary_emission"
      record_type: "measurement_or_activity_model"
      raw_fields: "species; medium/submedium; equipment/task; actual fuel/activity; model/factor/source; control; particle size; moisture; weather; uncertainty"
      collection_method: "Use representative exhaust monitoring or equipment-specific validated emission model with actual activity. Quantify dust separately by operation using applicable measurements or documented local method. Preserve NO versus NO2 and particulate size; disclose unquantified releases as gaps, not zero. Historic EPA broad TSP factors are not adopted."
      unit: "kg"
      frequency: "Each actual emitting task/modeled period"
      temporal_coverage: "All modeled releases through handover"
      site_scope: "Actual site and receiving environment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; model/factor provenance; activity logs; species/medium audit; uncertainty"
    - protocol_id: cp_transport
      process_id: "transport"
      flow_role: "freight_input"
      record_type: "consignment_record"
      raw_fields: "consignment mass; measured route distance; cargo; vehicle; fuel; loading; empty return; carrier boundary"
      collection_method: "Record each actual journey/consignment and compute mass-distance with exact unit conversion. Include equipment mobilization and demobilization and waste haulage when relevant; reject generic distances or monetary proxies."
      unit: "kg*km"
      frequency: "Each journey"
      temporal_coverage: "All construction logistics"
      site_scope: "Actual origin/destination routes"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "carrier tickets; measured routes; loading; upstream-overlap audit"
  calculation_rules:
    - id: project_ledger
      applies_to: "all inventory rows"
      rule: "Sum uniquely attributable measured records for the declared whole work; reference count remains one. Keep task allocation and component/stock reconciliation. Any intensity per length/area is an additional derived view requiring measured geometry of this same work, not a replacement output."
      inputs:
        - cp_delivery
        - cp_material
        - cp_energy
        - cp_water
        - cp_waste
        - cp_emission
        - cp_transport
      output: "Exchange amount per declared reference flow"
      source_ids:
        - fhwa-pavement-lca-2016
    - id: energy_conversion
      applies_to: "electricity_cn_lv"
      rule: "1 kWh = 3.6 MJ exactly. Apply only to measured electrical energy; preserve the selected Net calorific value property. Fuel mass is not electrical energy; any calorific conversion needs matching fuel analysis and calorific basis."
      inputs:
        - cp_energy
      output: "Purchased electricity in MJ per declared reference flow"
      source_ids: []
    - id: quantity_conversion
      applies_to: "fresh_concrete, concrete_pipe, geotextile"
      rule: "Use actual measured volume times matching measured density to obtain kg; or measured fabric area times matching areal mass. Record units, moisture, batch and uncertainty. Do not infer a whole-road mass from a generic density or geometry."
      inputs:
        - cp_material
      output: "Material mass per declared reference flow"
      source_ids: []
    - id: transport_activity
      applies_to: "lorry_transport"
      rule: "Each consignment contributes actual cargo kg multiplied by its actual km; sum unique consignments. 1 tonne = 1000 kg. Document loaded/empty travel treatment in the linked carrier dataset; do not count service and its own-fleet fuel twice."
      inputs:
        - cp_transport
      output: "kg*km per declared reference flow"
      source_ids:
        - fhwa-pavement-lca-2016
  data_quality_requirements:
    - id: dq_extent
      applies_to: "finished_road"
      requirement: "Verify whole accepted extent, geometry, lane/path/parking function, configuration and actual acceptance conditions. A surveyed area alone cannot establish equal road performance."
      evidence: "cp_delivery"
    - id: dq_activity
      applies_to: "all inventory rows"
      requirement: "Cover actual construction dates, weather/season, equipment age/technology, delivered material route and quantities, rework and loss. Missing task records remain gaps with consequence/uncertainty disclosed."
      evidence: "cp_material; cp_energy"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Select one physically specific flow per exchange; check source/medium, route, reference property and units. Unresolved or mismatched identities remain blank, never fabricated. A candidate identifier does not authorize a substitute material."
      evidence: "flow identities and material specifications"
    - id: dq_balance
      applies_to: "all inventory rows"
      requirement: "Reconcile supplier production/transport versus foreground, material/water balances, internal reuse and waste destinations; quantify completeness and avoid repeated burden. No invented default intensity, mix, life, loss or approval."
      evidence: "cp_material; cp_water; cp_waste; allocation ledger"
validation_rules:
  - rule_id: v_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Reject incomplete/partial delivery, absent geometry/configuration/acceptance qualifiers, inconsistent work count or a mass/material-only output. Keep finished_road reference quantity, protocols and inventories on the same basis."
    source_ids:
      - un-cpc3-constructions-2025
      - fhwa-pavement-lca-2016
  - rule_id: v_routes
    applies_to: "foreground_dataset_conformance"
    rule: "Check every as-built process and component against the declared perimeter and route; resolve absent cards before calling a concrete dataset complete. Validate layer/volume/receipt consistency, rejected work, water routes and waste destinations from actual records."
    source_ids:
      - fhwa-fp24-construction
  - rule_id: v_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Verify UUID-specific chemical/physical identity, geography, voltage, medium/submedium, fossil/biogenic source and reference property/unit. No NO/NO2/N2O substitution, no resource-water/wastewater conflation and no composite emissions placeholder."
    source_ids: []
  - rule_id: v_completeness
    applies_to: "foreground_dataset_conformance"
    rule: "Report construction coverage, linked upstream completeness, unquantified emissions/noise, work-zone effects and excluded later stages. Construction noise needs a documented acoustic indicator, method and receiving context; do not express dB as additive energy/mass or fabricate an elementary flow. Measurement consistency alone establishes neither scientific approval nor whole-life performance."
    source_ids:
      - fhwa-pavement-lca-2016
published_dataset_profile:
  dataset_role: "Foreground construction inventory of one configured accepted non-elevated road entity"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Site-specific initial-construction module with explicit geometry and upstream links; later integration into a reviewed lifecycle model with separate later stages"
  excluded_use: "Unqualified whole-life/comparative claim; generic per-km/area proxy without equivalence; manufacturing-only output; methodology approval or publication inferred from candidate content"
  required_metadata: "All reference qualifiers; process/route map; measured project ledger; suppliers/background boundaries; allocation/reuse ledger; construction period; identities/units; acceptance status"
  required_quality_disclosure: "Measured/estimated data distinction; uncertainty and completeness by task/stage; missing flow identities; noise/work-zone/land-use gaps; upstream coverage and all excluded stages"
  update_trigger: "Changed geometry/configuration, pavement route, material supplier, equipment, water/waste route, acceptance correction or verified identity/method evidence"
data_sources:
