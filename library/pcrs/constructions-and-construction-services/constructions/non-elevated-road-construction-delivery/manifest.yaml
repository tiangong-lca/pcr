review_metadata:
  scientific_review: pending
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: imported_fill
      reason: Selected suitable imported mineral soil needs source and
        moisture/acceptance identity. Excavated-soil/remediation candidates do
        not establish uncontaminated road embankment suitability. Blank identity
        is not a claim of database absence.
    - row_id: spoil_soil
      reason: Non-hazardous surplus mineral soil kept specific. Generic muck contains
        soil/material/other wastes and at-plant mix; site-remediation soil
        cannot establish this waste identity. Blank identity is not a claim of
        database absence.
    - row_id: aggregate_base
      reason: Road-base crushed stone requires actual grading/state. Available 16/32
        crushed stone cannot represent all gradings; railway ballast and
        soil-remediation volume gravel are route-specific. No false grade
        default is introduced. Blank identity is not a claim of database
        absence.
    - row_id: stabilization_lime
      reason: Industrial European hydration powder, flash-smelting-route lime and
        elementary calcium hydroxide do not establish unrestricted
        road-treatment supplied hydrated lime across actual sources/states.
        Blank identity is not a claim of database absence.
    - row_id: geotextile
      reason: Public polypropylene textile describes a South Korean remediation
        biopile case. Area reference property could be preserved with real
        areal-mass conversion; route mismatch, not area alone, blocks adopting
        that identity. Blank identity is not a claim of database absence.
    - row_id: tack_emulsion
      reason: Natural/oxidised asphalt and waterproofing membrane do not establish
        cationic tack-coat emulsion wet formulation. Blank identity is not a
        claim of database absence.
    - row_id: asphalt_offcut
      reason: Excavated asphalt candidate is from contaminated-site excavation;
        asphalt residue is upstream production. Neither establishes
        uncontaminated new-work asphalt mixture waste. Blank identity is not a
        claim of database absence.
    - row_id: fresh_concrete
      reason: Cast-In-Place Concrete describes onsite poured/cured concrete, and
        generic Concrete includes cement or asphalt binder and hardened state.
        Neither establishes delivered fresh ready-mixed concrete at the stated
        input boundary. Blank identity is not a claim of database absence.
    - row_id: joint_sealant
      reason: Generic Sealant/Caulk Compound does not establish silicone road-joint
        formulation/state. Blank identity is not a claim of database absence.
    - row_id: formwork_timber
      reason: Sawn timber candidates need species/moisture and usable formwork state;
        a pallet or generic lumber row is not automatically this reusable board.
        Blank identity is not a claim of database absence.
    - row_id: concrete_rubble
      reason: Mixed construction waste and recovered aggregate do not establish
        separately characterized uncontaminated hardened concrete rubble. Blank
        identity is not a claim of database absence.
    - row_id: washout_water
      reason: Wastewater candidate d2d44ce1-c0f4-461d-9413-f4b33e0d200f has
        electrolytic-manganese-residue washing route. No verified alkaline
        concrete-washout treatment-bound identity adopted. Blank identity is not
        a claim of database absence.
    - row_id: washout_sludge
      reason: Generic wet/mixed waste and wastewater are not separately measured
        settled concrete-washout sludge. Blank identity is not a claim of
        database absence.
    - row_id: paving_unit
      reason: Available concrete-pavement-brick cut/extruded billets or mixing
        intermediates are not an accepted precast paving block. Blank identity
        is not a claim of database absence.
    - row_id: stone_slab
      reason: Granite slab candidate inspected; no verified paving
        configuration/finish property and delivery applicability adopted.
        Countertop description alone cannot establish pavement suitability.
        Blank identity is not a claim of database absence.
    - row_id: concrete_pipe
      reason: Plastic pipes, seamless steel pipe and PRB trench gates are not precast
        reinforced concrete drainage pipe. Blank identity is not a claim of
        database absence.
    - row_id: guardrail
      reason: Galvanized frame/sheet or generic galvanizing does not establish
        configured crash/safety guardrail assembly with posts and fixings. Blank
        identity is not a claim of database absence.
    - row_id: marking_paint
      reason: Available painted frame identity is a finished machinery component; no
        verified waterborne acrylic road-marking formulation adopted. Blank
        identity is not a claim of database absence.
    - row_id: glass_beads
      reason: Glass Bead direct record describes abrasive/blasting beads. Road-marking
        retroreflective grade remains unestablished. Blank identity is not a
        claim of database absence.
    - row_id: dewater_effluent
      reason: Dewatering effluent to a treatment recipient needs actual liquid
        characterization and route; generic direct-to-water wastewater identity
        is not this technosphere transfer. Blank identity is not a claim of
        database absence.
    - row_id: lorry_transport
      reason: Excavated-soil Belgium transport is case-limited; unspecified lorry
        candidate has Mass rather than mass-distance and inconsistent
        refrigerator classification. No generic non-refrigerated kg*km service
        forced. Blank identity is not a claim of database absence.
    - row_id: finished_road
      reason: Whole accepted road entity with its actual ancillary scope is not
        established by available Road/Forest road identities. Road has Length
        property and an at-plant construction-access description; neither
        count/geometry conversion nor naming establishes the whole scope.
        Preserve blank UUID pending semantic identity review. Blank identity is
        not a claim of database absence.
  boundary_limitations:
    - Initial construction and handover only; no default lifespan or complete
      cradle-to-gate/full-life claim.
    - Further actual routes/components need specific added exchanges before
      dataset completeness claim.
    - FP-24 evidence read from official PDF through web extraction; local
      download was blocked. Its contractual tolerances and equipment
      prescriptions are not generalized.
  unresolved_evidence:
    - Actual project geometry, material quantities, energy/water, emission
      speciation/factors, acceptance and conserved reuse ledger must be
      collected during dataset production.
    - Noise, work-zone effects, land-use and later lifecycle stages are not
      quantified by this construction inventory.
