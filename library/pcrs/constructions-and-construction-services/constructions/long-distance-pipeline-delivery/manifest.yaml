  semantic_boundary:
    decision: New delivery methodology; retain legacy empty scaffold unchanged.
    scope: Complete accepted long-distance overland/underground/submarine pipeline entities for petroleum, gas, water or other products and explicit related stations, not material manufacture, local distribution, construction services or operation.
    reuse_assessment: Existing welded/seamless oil-gas pipe PCRs stop at pipe-mill gate; adjacent nonpipeline water-conduit and harbour delivery candidates exclude pipelines; no matching material method in current/integration/batch candidates.
