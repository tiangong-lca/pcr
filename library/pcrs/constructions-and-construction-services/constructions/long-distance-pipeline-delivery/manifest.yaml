      reason: Construction-sand candidate is a South Korean remediation case; gravel-sand and manufactured mixed sand do not establish graded natural pipeline bedding.
    - row_id: mineral_spoil
      flow: Uncontaminated excavated mineral subsoil sent off site
      reason: muck includes heterogeneous construction/demolition wastes and is a Product flow; contaminated/remediation soils are incompatible with segregated uncontaminated mineral subsoil.
