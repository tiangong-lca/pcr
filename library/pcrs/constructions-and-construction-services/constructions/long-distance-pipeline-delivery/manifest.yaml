  evidence_limitations:
    - "FERC2017 and Upland2013 direct/browser downloads returned403: retained web text evidence only, without PDF original visual verification."
    - GovInfo Wetland2013 original is a separately identified official preserved copy; no exact-byte equivalence to blocked FERC URL asserted.
    - PHMSA displayed2011 revision and FERC2013/2017 practices are historical and jurisdiction-specific, not current universal law.
    - Representative line/station atomic inventory requires route-specific project additions for other actual consumables, process states, supplied assemblies and environmental releases before project completeness.
    - No default project geometry, pipe mass, capacity, recipe, life, allocation share, emission factor or compliance is established.
  review_requirements:
    - Independent scientific and bilingual review before methodology approval; no publication performed.
    - Review actual project material/route/geography/interface applicability, upstream coverage and all unresolved exact rows before complete data-package acceptance.
    - Unknown cumulative asset activity/lifetime/beneficiaries and unsupported emission/noise/ecological measurements remain explicit review gaps.
