product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.constructions.long-distance-pipeline-delivery"
  classification_refs: "CPC 3.0 53241; scope context only, no accepted mapping created"
  covered_products: "Complete accepted long-distance overland, underground or submarine pipeline systems for petroleum, gas, water or other products; identified related pumping/compressor/valve structures"
  excluded_products: "Urban/local distribution mains; separately delivered water-treatment plants, nonpipeline aqueducts and navigation works; manufactured pipe/components; construction services; operational transport service"
  representative_product: "One configured complete accepted pipeline delivery unit with surveyed line and declared integral station/crossing interfaces"
  production_route: "Actual logistics and site preparation, supplied-pipe jointing/protection, open-cut/trenchless/submarine installation, applicable station civil and equipment installation, pressure/conditioning tests, reinstatement and handover"
  market_state: "Installed, inspected and actually accepted physical construction at the declared site; no routine transported-product output"
functional_unit:
  what: "Deliver the complete installed pipeline passage and declared related structures between the actual interfaces, capable of the declared conveyance duty under recorded acceptance conditions"
  how_much: "One complete accepted delivery unit. For a line-bearing unit survey actual installed centreline length, each bore/wall/section, burial/support/seabed geometry and crossings. For every included station survey its layout, foundations and equipment configuration. A genuinely independent station-only delivery declares its trunk-line interfaces and actual station geometry/duty; nonincluded line or station attributes are explicitly not_applicable with scope evidence, never fabricated. Declare actual hydraulic flow and pressure conditions. These qualify the same entity, not alternative denominators."
  how_well: "Actual material grades, lining/coating/joint system, design and operating-fluid constraints, test medium, pressure/temperature, hold/leak criteria and test/inspection records for the declared jurisdiction/specification; no generic compliance conclusion"
  how_long_or_cycle: "One recorded construction-to-acceptance cycle, including actual rework and retest; later service duration is outside this reference and must be evidenced for any lifecycle extension"
  reference_flow_link: "finished_pipeline"
system_boundary:
  rules:
    - rule_id: b_complete_delivery
      applies_to: "foreground_system_boundary"
      rule: "Include actual mobilisation, route/working-area preparation, topsoil segregation, trench or support works, pipe receipt/stringing/bending, jointing and NDT, applicable coating repair, lowering/laying/anchorage, backfill, station civil/equipment installation, testing/retest, tie-in, required handover restoration and cleanup. Shared utility/emission records are task tagged and counted once."
      source_ids:
        - ferc-construction-2017
        - ferc-upland-2013
        - saipem-subsea
    - rule_id: b_routes
      applies_to: "foreground_system_boundary"
      rule: "Derive open-cut/HDD/tunnel/overland-supported/submarine and station requirements from actual design/as-built records. Include actual water control, drilling-fluid management, lay/support vessels, trench/protection works and shore approach. Missing route materials or processes must be added as atomic rows before a complete project dataset; conditional cards cannot delete actual scope."
      source_ids:
        - ferc-wetland-2013
        - saipem-subsea
        - un-cpc3-2025
    - rule_id: b_supplied_state
      applies_to: "foreground_system_boundary"
      rule: "Separate supplied-pipe/coating/assembly manufacture from field joining, protection, transport and installation. Supplier factory testing is upstream; actual construction tests are foreground. Record actual onsite fabrication/batching as distinct inputs/processes; never duplicate embedded steel/concrete/water or coating ingredients."
      source_ids:
        - ferc-construction-2017
        - nwpipe-steel-water-2019
        - phmsa-hydrotest
    - rule_id: b_consumed_inputs
      applies_to: "foreground_system_boundary"
      rule: "For every supplied material or assembly input, construction/installation applicability identifies the intended work, not only successfully installed quantities. In each native unit use attributable gross receipts + opening stock - verified returns/transfers - closing reusable stock; include pre-acceptance spillage, damage, rejected-but-consumed items and replacements. Verified returns and reusable carryover are excluded from consumed input, while any attributable handling, transport or rework remains. Reconcile installed acceptance and waste separately; do not cancel consumed manufacture. Reusable temporary assets retain their conserved manufacturing share under the asset-allocation rules."
      source_ids: []
    - rule_id: b_stages
      applies_to: "foreground_system_boundary"
      rule: "Include removal of existing obstructions and temporary works actually needed for construction, without pretending it is future final demolition. Exclude posthandover transport operation, routine pumping/compression, maintenance/renewal and final demolition; extend separately with actual activity/duration/fate evidence."
      source_ids:
        - ferc-construction-2017
        - phmsa-hydrotest
    - rule_id: b_environment
      applies_to: "foreground_system_boundary"
      rule: "Direct water-resource inputs, purchased technosphere water, wastewater to treatment and elemental discharge are different interfaces. Record emissions only for actual substance/media and evidenced occurrence. Noise, vibration, land/ecology, waterbody disturbance and drainage are surveyed impact context; lack of an applicable quantified flow is an explicit coverage gap, not zero impact."
      source_ids:
        - ferc-construction-2017
        - ferc-wetland-2013
        - ferc-upland-2013
boundary_abstraction:
  declared_starting_condition: "Documented site, existing retained line/station/interfaces and actual supplier-gate delivered material/assembly state before construction"
  starting_condition_role: "foreground_start"
  product_classification_scope: "Complete long-distance pipeline physical delivery and identified related structures, excluding local distribution"
  recursive_input_rule: "Retained line/station is starting stock, not new reference output. A purchased same-category accepted work is linked once at its own delivery boundary, never recursively regenerated as onsite pipe manufacture."
  upstream_dataset_requirement: "Verify supplier product/state, route/geography/period, primary property, transport interface and module coverage. Link separate material, equipment, utility and actual waste-management datasets; no automatic complete upstream coverage."
  disclosure: "Construction foreground through actual acceptance; report every linked upstream module and omission independently. Do not claim complete cradle-to-gate or whole-life coverage from a construction account."
