allocation_rules:
  - rule_id: a_direct
    applies_to: "foreground_burden_allocation"
    rule: "Measure direct attribution by unit/reach/station/task. Separate shared equipment, water and logistics meters/activities first; any remaining allocation follows actual load/activity and conserves totals. Cost, default length or design load is not an arbitrary allocation key."
    source_ids:
      - ferc-construction-2017
  - rule_id: a_stock
    applies_to: "foreground_burden_allocation"
    rule: "Same-site soil, water and drilling-fluid reuse is an internal transfer: retain balances without repeatedly counting external purchases/withdrawals. Material manufacture and downstream waste treatment are separate; scrap labels grant no automatic substitution credit."
    source_ids:
      - ferc-wetland-2013
      - ferc-upland-2013
  - rule_id: a_reuse
    applies_to: "foreground_burden_allocation"
    rule: "Attribute asset/component manufacture from actual same-configuration net mass and supported dimensionless beneficiary shares, each share in [0,1] and cumulatively <=1 across all projects/periods/reuses. Record actual activity denominator and evidence; unknown lifetime/beneficiaries require review, never full manufacture reset per project."
    source_ids:
      - ferc-construction-2017
  - rule_id: a_product
    applies_to: "foreground_burden_allocation"
    rule: "The reference output is only the declared complete entity. Retained existing assets and transferred equipment are not newly manufactured co-products. Actual independently delivered co-products require process/measurement separation first, followed by physically evidenced allocation and review."
    source_ids:
      - un-cpc3-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_delivery
      process_id: "handover"
      flow_role: "finished_pipeline"
      record_type: "Acceptance and as-built register"
      raw_fields: "asset/site/interface ids; country; fluid; actual applicable line length/bore/wall/route/pressure/duty; included station geometry/equipment/BOM; not_applicable scope evidence; test medium/criteria/results; weld/coating inspection; rework; restoration; complete accepted count"
      collection_method: "Survey from traceable as-built geometry and calibrated instruments, reconcile contract scope/BOM with signed acceptance and test records; verify entire delivery state before counting output."
      unit: "item"
      frequency: "each delivery and correction"
      temporal_coverage: "whole actual construction through acceptance"
      site_scope: "same declared unit/interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "survey/calibration files; acceptance and inspection records"
    - protocol_id: cp_materials
      process_id: "pipe_installation_earthworks_crossings_offshore_station_restoration"
      flow_role: "each supplied atomic material/assembly"
      record_type: "Receipts, issue/return, stock and supplier records"
      raw_fields: "row_id; lot/grade/specification; material/formulation/lining/coating; supplier country/interface; issued/returned/stock; measured net mass/length/volume; temperature; density or linear mass; station assembly inclusion ; opening and closing reusable stock; verified transfers; pre-acceptance damage/rejection/replacement; separate consumed and accepted installed quantities"
      collection_method: "Weigh net delivered/issued material with calibrated scale or traceable lot certificates; reconcile start/end stocks and returns against installed geometry and actual BOM. Measure density/linear mass only for the same lot/state; exclude packaging tare and embedded items counted within complete supplied assemblies.  Apply b_consumed_inputs in the row native unit: gross attributable receipts + opening stock - verified returns/transfers - closing reusable stock; include consumed losses and replacements, with accepted installation and waste reconciled separately."
      unit: "kg; m; m3"
      frequency: "each delivery/issue/return"
      temporal_coverage: "all lots of construction/rework"
      site_scope: "same unit; tagged task/station/reach"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weigh tickets; mill certificates; formulations; actual BOM/stock reconciliation"
    - protocol_id: cp_logistics
      process_id: "logistics"
      flow_role: "transport_diesel"
      record_type: "Vehicle and consignment ledger"
      raw_fields: "vehicle/task; origin/destination; actual distance; payload; empty return; diesel grade/fossil fraction; supplied/burned fuel; opening/closing fuel stock; supplier transport coverage"
      collection_method: "Use fuel meter/refuelling and dispatch records; reconcile loading quantities and included outbound/return trips; subtract no distance by assumption. If using linked transport-service datasets instead of fuel, declare exact activity and remove included fuel and emissions from this account."
      unit: "kg; km"
      frequency: "each trip and refuelling"
      temporal_coverage: "all actual construction deliveries and waste trips"
      site_scope: "unit-specific route ledger"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "fuel meter calibration; dispatch and trip logs; supplier boundaries"
    - protocol_id: cp_energy
      process_id: "site_support_offshore"
      flow_role: "each fuel or delivered-voltage electricity"
      record_type: "Meter, fuel and equipment/task logs"
      raw_fields: "row_id; meter/voltage; country/year/provider; task/equipment; start/end readings; actual activity/idle hours; fuel quantity/grade/fossil fraction; density; heating-value evidence; vessel bunker/task; attribution shares"
      collection_method: "Read calibrated user meters, weighed fuel issues or traceable refuelling; reconcile onsite generators and marine tasks separately. Attribute shared meter quantities using actual metered task demand or supported activity, with full-period quantities conserved. Convert kWh to MJ using 3.6; mass-to-fuel-energy needs actual applicable LHV, not an assumed flow secondary property."
      unit: "kg; kWh; MJ"
      frequency: "each shift, fuel issue and meter period"
      temporal_coverage: "entire site/vessel construction and retest"
      site_scope: "declared unit/tasks plus separately identified shared beneficiaries"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration; fuel certificates; time/task and conserved attribution ledger"
    - protocol_id: cp_water
      process_id: "site_support"
      flow_role: "treated_process_water; river_withdrawal; groundwater_withdrawal; dewatering_freshwater_return; dewatering_wastewater"
      record_type: "Supply, intake, use, recycle and dewatering meters"
      raw_fields: "source/type/country/location; treatment/interface; use/task; mass/volume/temperature/density; intake; recycle; discharge; stock; dewatering; permits"
      collection_method: "Meter each actual external source and destination. Weigh treated Mass-reference water or convert metered volume with same-state measured density. Track internal recirculation without counting it as a fresh external input each pass; retain separate groundwater dewatering bypass volumes and receiving interface."
      unit: "kg; m3"
      frequency: "each intake/use/discharge event"
      temporal_coverage: "whole construction including hydrotest"
      site_scope: "same unit, identified water bodies and supplier"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated meters; water balance; actual source quality and permits"
    - protocol_id: cp_testing
      process_id: "commissioning"
      flow_role: "nitrogen_purge; test_wastewater; freshwater_discharge"
      record_type: "Test-medium and commissioning ledger"
      raw_fields: "test section/interface; fluid; pressure/temperature/hold/leak specification; pump/compressor activity; source medium purity/state; delivered and recovered mass/volume; water additives; reuse; discharge destination and analyses; repairs/retests"
      collection_method: "Use approved actual project specification and calibrated pressure, temperature, flow and gas/volume measurements; retain test results, leakage repairs and repeats. Establish nitrogen density from applicable state/composition evidence if converting volume; never equate unspecified compressed volume with normal volume. Separate wastewater sent to treatment from direct discharge and measure each analysed substance separately."
      unit: "kg; m3; pressure/temperature/time"
      frequency: "each test, repair, retest and conditioning event"
      temporal_coverage: "actual postconstruction prehandover tests only"
      site_scope: "same pipeline unit and receiving interface"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; test/inspection and chemical analysis; actual approval documents, not PCR compliance"
    - protocol_id: cp_waste
      process_id: "earthworks_pipe_installation_crossings_station"
      flow_role: "each segregated waste"
      record_type: "Waste weighbridge, composition and destination register"
      raw_fields: "row_id; source task; substance/material/state; net mass/volume/moisture/solids; contamination; onsite reuse; storage; actual carrier/treatment/discharge destination"
      collection_method: "Measure segregated streams with calibrated scales/meters and representative state/composition analyses. Reconcile generation, reuse, stocks and actual outbound quantities. Treatment/transport modules must match actual destination and cannot be inferred from generic recycling or landfill labels."
      unit: "kg; m3"
      frequency: "each stream transfer and stock record"
      temporal_coverage: "all actual construction and rework"
      site_scope: "same unit and real destination"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weigh tickets; laboratory analyses; waste/transport/treatment acceptance receipts"
    - protocol_id: cp_assets
      process_id: "assets"
      flow_role: "each reusable asset manufacture share"
      record_type: "Asset serial/configuration and cumulative beneficiary ledger"
      raw_fields: "asset id/configuration; measured net mass; manufacturing boundary; project actual activity; prior/later beneficiaries; supported total life activity or actual cumulative allocation basis; dimensionless attributed shares; uncertainties"
      collection_method: "Use calibrated same-configuration net mass weighing or traceable manufacturer weighing records, exclude transport packaging. Retain evidence for total manufacture allocation activity and actual project share; track cumulative shares across all projects/periods/uses and ensure their sum <=1. Unknown lifetime/activity is a review gap; never reset a complete manufacturing burden per project."
      unit: "kg; dimensionless share; actual activity unit"
      frequency: "each asset/use and cumulative ledger update"
      temporal_coverage: "construction project plus documented cross-project beneficiary horizon"
      site_scope: "asset serial tied to unit and other beneficiaries"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weighing records; supported life/activity evidence; cumulative conserved share ledger"
    - protocol_id: cp_air
      process_id: "site_support_commissioning"
      flow_role: "each elementary air emission"
      record_type: "Measured species/size/compartment and activity record"
      raw_fields: "row_id; equipment/task/date; actual substance/CAS; fossil/biogenic component; external medium/subcompartment/time; controls; measured release or applicable factor/source; activity basis; gas composition; particle-size fraction; uncertainty; receiver noise/vibration measurements"
      collection_method: "Use calibrated emission/speciation measurements or explicitly supported equipment/fuel/control-specific factors with real activity. Record factor provenance/basis and do not turn NOx equivalents into molecular NO/NO2. Fuel carbon balance separates fossil/biogenic carbon; purge/vent calculations use measured composition/state and remove flared portions. Distinguish emitted external dust from captured dust and workplace measurements. Keep noise/vibration as measured receiver/event context unless an applicable quantified flow and assessment method are independently established."
      unit: "kg; separate noise dB/time/context"
      frequency: "each actual activity/measurement interval"
      temporal_coverage: "all included construction/preacceptance releases"
      site_scope: "same unit and true external receiving compartment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; species/size and fuel analyses; applicable model/factor evidence; uncertainty and uncovered effects"
  calculation_rules:
    - id: calc_reference
      applies_to: "finished_pipeline"
      rule: "Record 1 item only when every interface, physical work and required test for the same complete unit is actually accepted; purchased pipe length is not accepted-entity count."
      inputs:
        - cp_delivery
      output: "reference output per declared reference flow"
      source_ids:
        - un-cpc3-2025
    - id: calc_stock
      applies_to: "all material and waste rows"
      rule: "Per declared reference flow reconcile opening stock, receipts, closing stock, returns, installed amount, waste and internal reuse by lot; conserve the same substance/state and include rework. Total input mass is not construction-reference mass.  Apply b_consumed_inputs to supplied inputs, including pre-acceptance consumed losses and replacements; accepted installed amounts are not the input quantity."
      inputs:
        - cp_materials
        - cp_waste
      output: "net attributable amount of each substance per declared reference flow"
      source_ids:
        - ferc-construction-2017
    - id: calc_utilities
      applies_to: "transport_diesel; site_diesel; marine_gasoil; cn_lv_power; cn_mv_power"
      rule: "Per declared reference flow sum measured attributable quantities; multiply kWh by 3.6 to obtain MJ. Fuel volume-to-mass uses measured same-state density; energy conversion uses supported actual LHV. Shared task amounts cannot exceed the complete corresponding meter-period total."
      inputs:
        - cp_energy
        - cp_logistics
      output: "kg or MJ per declared reference flow"
      source_ids:
        - ferc-construction-2017
    - id: calc_water
      applies_to: "treated_process_water; river_withdrawal; groundwater_withdrawal; dewatering_freshwater_return; dewatering_wastewater; test_wastewater; freshwater_discharge"
      rule: "Per declared reference flow reconcile each external intake/supply, storage, actual reuse and external destination. Convert Mass-reference water volume with same-state measured density. Withdrawal, consumption, wastewater to treatment and direct discharge are separate quantities; internal recycle is not repeated external withdrawal."
      inputs:
        - cp_water
        - cp_testing
      output: "separate kg or m3 per declared reference flow"
      source_ids:
        - ferc-wetland-2013
    - id: calc_emission
      applies_to: "all elementary air emission rows"
      rule: "Per declared reference flow use measured substance release, or document applicable factor times real activity with its units. Fossil CO2 uses measured oxidized fossil carbon multiplied by molecular mass ratio 44/12; assume neither all-fossil nor complete oxidation. NOx equivalents, total PM or generic factors do not establish actual species/fraction."
      inputs:
        - cp_air
      output: "substance-specific kg per declared reference flow"
      source_ids:
        - ferc-construction-2017
    - id: calc_assets
      applies_to: "timber_mat; crawler_excavator; pipelay_vessel"
      rule: "Per declared reference flow attributable manufacture amount = measured same-configuration net asset mass times supported dimensionless manufacture share. Across all beneficiary projects/reuses cumulative shares <=1. Unknown activity denominator/lifetime remains review, with no default share."
      inputs:
        - cp_assets
      output: "attributable manufacture kg per declared reference flow"
      source_ids:
        - ferc-construction-2017
  data_quality_requirements:
    - id: dq_entity
      applies_to: "all inventory rows"
      requirement: "The same actual interfaces/configuration/complete delivery state must agree with geometry and testing evidence; omit neither actually included pipeline nor station works. Partial delivery is explicitly incomplete."
      evidence: "cp_delivery; cp_materials"
    - id: dq_measure
      applies_to: "all inventory rows"
      requirement: "Retain calibration, units, lots, temperature/pressure, density and formulation evidence. Same-lot net amounts, rework/retest, stocks and attribution balances are traceable; no default recipes/losses/energy."
      evidence: "cp_materials; cp_energy; cp_water; cp_testing"
    - id: dq_environment
      applies_to: "all elementary rows"
      requirement: "Identify substance, fossil/biogenic origin, receiving medium/subcompartment, particle size and release time; retain uncovered substances and method uncertainty. Noise/vibration uses real receiver location/frequency/time/instrument records; never convert arbitrarily to mass or claim zero from a missing identity."
      evidence: "cp_air; cp_water"
    - id: dq_scope
      applies_to: "whole dataset"
      requirement: "Disclose separate manufacture, transport, construction, operation/maintenance and final demolition coverage/gaps. Historical guidance is not current law; supplied state and project specification need actual evidence."
      evidence: "module coverage register; actual specifications"
    - id: dq_uuid
      applies_to: "all UUID-bearing rows"
      requirement: "Check public primary property and every applicability limitation individually, with official Chinese names. Unresolved identity remains review, never forced matching or publication readiness."
      evidence: "direct identity and supplier evidence"
    - id: dq_assets
      applies_to: "assets"
      requirement: "Independently review actual manufacture shares and cumulative beneficiary basis; unknown lifecycle activity cannot establish manufacturing completeness."
      evidence: "cp_assets"
validation_rules:
  - rule_id: v_complete
    applies_to: "foreground_dataset_conformance"
    rule: "All required and actually applicable conditional processes, complete reference delivery, bilingual row_id/rule_id sequences, correct basis and protocols must be present. Missing actually applicable measured line/station geometry or testing information makes the dataset incomplete; require evidenced not_applicable for genuinely nonincluded entity attributes."
    source_ids:
      - un-cpc3-2025
  - rule_id: v_boundary
    applies_to: "foreground_dataset_conformance"
    rule: "Check supplied/site state, upstream/construction and pre/posthandover boundaries; prevent duplicate embedded materials, utilities, transport fuel, emissions and internal recycles."
    source_ids:
      - ferc-construction-2017
      - ferc-wetland-2013
  - rule_id: v_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Every adopted identity must meet public substance, route, geography, voltage, primary property/unit and environmental compartment limits. Exact empty-UUID rows remain review; do not claim complete flow identity."
    source_ids:
      - ferc-construction-2017
  - rule_id: v_tests
    applies_to: "foreground_dataset_conformance"
    rule: "Check actual medium/state, test sections, results and repair/retest. Mill testing does not replace site acceptance; a passed test is not a PCR guarantee of no defects or regulatory approval."
    source_ids:
      - phmsa-hydrotest
  - rule_id: v_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Measured material/energy/water/waste and shared activities conserve totals; each asset cumulative manufacture share <=1. Unknown lifetime/activity/relationships remain disclosed review, not default-filled balances."
    source_ids:
      - ferc-construction-2017
  - rule_id: v_emissions
    applies_to: "foreground_dataset_conformance"
    rule: "Quantify only actual substance/compartment with applicable evidence. NO, NO2, NOx equivalents, particle fractions, fossil/biogenic carbon, liquid water/wastewater/resource water are not interchangeable; unsupported amounts remain unknown."
    source_ids:
      - ferc-construction-2017
published_dataset_profile:
  dataset_role: "foreground physical construction-delivery dataset"
  downstream_use: "secondary_dataset; background_dataset after applicable scope/identity and independent review"
  allowed_use: "Same-configured/interface/region/period/actual-route long-distance pipeline delivery modelling; stage-explicit downstream lifecycle extension"
  excluded_use: "Generic per-kilometre emission factor; urban distribution mains; pipe manufacture; construction service; transport operation/whole-life result; automatic compliance/approval"
  required_metadata: "All reference qualifiers; geography/time; as-built quantities/configuration; tests/acceptance; supply states; actual processes/equipment; factor/unit provenance; material/transport upstream links; manufacture shares; internal reuse and destinations"
  required_quality_disclosure: "Candidate methodology review state; unresolved identities/additional rows; upstream-module coverage; measurement/factor/allocation uncertainty; excluded operation/maintenance/demolition and uncovered noise/ecology; dated source limitations"
  update_trigger: "Actual material/fluid/bore/length/wall/station/method/supplier-voltage/geography/acceptance-specification/activity change, or reviewed new evidence/identity"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
