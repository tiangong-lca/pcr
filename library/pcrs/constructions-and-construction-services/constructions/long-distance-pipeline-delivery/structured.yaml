measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "item"
    rule: "Output is 1 item of the same complete accepted construction, verified using cp_delivery. All inventory and collection aggregates are per declared reference flow; no invented per-project/per-kilometre mass."
  - id: measured_physical_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass; Volume; Length; Net calorific value; Number of items"
      uuid: ""
    required_unit: "kg; m3; m; MJ; item"
    rule: "Preserve each direct-read reference property and unit group. Weigh same-lot net masses; meter volume at recorded temperature/pressure; survey cable/pipe lengths and geometry. Volume-to-mass or length-to-mass needs independently measured density or linear mass for that exact state; never change a public property to Mass or use a default density. Use Number of items/item for one complete accepted pipeline entity under reference_count and cp_delivery. The listed property/unit pairs apply to their respective exchanges; auxiliary quantities do not replace the reference output count."
  - id: electricity_units
    applies_to: "cn_lv_power; cn_mv_power"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Public electricity retains Net calorific value and Units of energy. Convert metered kWh using the defined identity 1 kWh = 3.6 MJ; record which user-voltage interface is present."
  - id: asset_share_basis
    applies_to: "timber_mat; crawler_excavator; pipelay_vessel"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Collect actual same-configuration net asset mass and an independently supported dimensionless manufacture share in cp_assets. Lifetime or cumulative activity unknown requires explicit review; no full manufacture burden is reset per project."
