measurement_rules:
  - id: reference_count
    applies_to: "reference product and accepted output"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Reference amount is 1 item; inventory, collection and calculation use per declared reference flow, excluding purchase contracts and unfinished works."
  - id: geometry_and_cable_length
    applies_to: "route and cable qualifiers"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "As-built survey distinguishes route length, cable length, fibre length, parallel circuits and slack; m does not substitute kg or item."
  - id: physical_mass
    applies_to: "auxiliary mass-balance and equipment-attribution records linked to materials and offcuts"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh actual state with wet/dry basis; volume/length-to-mass needs matching batch density or measured kg/m. Equipment mass supports manufacture attribution, not reference-entity mass. The required Mass/kg is an auxiliary record, not a replacement primary property for length- or count-based exchanges. Keep pipes/cables in Length/m and complete joints/transformers in Number of items/item; link row, batch, configuration, issued quantity and independently measured kg or supported conversion in cp_materials/cp_cables. Never count the auxiliary mass as a second manufacturing exchange."
  - id: energy_basis
    applies_to: "fuel and construction electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve public net-calorific-value property; measured kWh times 3.6 gives MJ. Fuel kg times batch MJ/kg; volume fuel first uses actual density to kg. Unknown LHV/density cannot be guessed."
  - id: water_basis
    applies_to: "water supply, abstraction, direct water discharge and volume-based liquid-waste rows; excludes wet-mass drill_slurry"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Meter true liquid volume by separate interface, retaining quality, origin and receiver; resource, technosphere and emission water are distinct. Spent drill_slurry retains Mass/kg on the measured wet basis, including retained water and mineral solids under cp_waste; any auxiliary volume requires same-state density and does not replace or duplicate this waste exchange."
