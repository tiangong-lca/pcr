    inclusion: "conditional"
    inclusion_condition: "Actual disturbed surface or construction waste dispatch before handover"
    role: "foreground construction"
    quantitative_reference: "per declared reference flow"
  - id: acceptance
    name: "Inspection, testing and handover"
    inclusion: "required"
