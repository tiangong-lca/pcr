allocation_rules:
  - rule_id: shared_works_allocation
    applies_to: "foreground_burden_allocation"
    rule: "This delivered entity is the construction output. Separate measured branch activity for joint power/communication trenches, shared poles, stations and mobilisation before allocation. For inseparable residuals use a disclosed causal driver derived from actual work, such as excavated cross-section times length or measured equipment time, with denominator covering every beneficiary. A voltage, cost or cable-count share is not automatically causal."
    source_ids: []
  - rule_id: reusable_capital_conservation
    applies_to: "foreground_burden_allocation"
    rule: "Reusable equipment and drums retain a serial-bound cumulative manufacture ledger. Share = project attributed activity / supported total life activity, only when compatible activity and denominator are evidenced; all project/period/reuse shares sum to at most one. Attribute measured same-configuration mass or count with that share, separately from operating activity. Unknown total life activity remains review, never reset full manufacture per project."
    source_ids: []
  - rule_id: waste_and_recovery
    applies_to: "foreground_burden_allocation"
    rule: "Construction scrap and removed soil are not automatically co-products. Record waste state and destination; do not deduct a guessed avoided virgin-material burden. A separately evidenced product/recovery boundary requires a disclosed allocation model and an independent destination dataset."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_handover
      process_id: "acceptance"
      flow_role: "accepted entity"
      record_type: "acceptance dossier"
      raw_fields: "entity_id; endpoints; site boundary; route_m; cable_m by circuit; station_m2; tower_m; voltage/capacity/fibre specification; installed scope; completion/acceptance dates; test state"
      collection_method: "Survey as-built geometry; reconcile signed handover, circuit schedule and actual tests, recording energised or ready-only state"
      unit: "item; m; m2"
      frequency: "Each acceptance with revisions"
      temporal_coverage: "actual construction start to acceptance, including rework"
      site_scope: "declared entity and attributed activity"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "original tickets, calibration, samples, signed work records and gap register"
    - protocol_id: cp_materials
      process_id: "underground_civil_aerial_support_cable_placement_station_tower_reinstatement"
      flow_role: "individual material input"
      record_type: "delivery and installation ledger"
      raw_fields: "row_id; batch; supplier; grade; state; net_kg; m or item; density; moisture; receipt; return; location; included components; component tags; failed/replaced quantities; opening/closing attributable stocks; verified transfers"
      collection_method: "Weigh tickets and net deliveries; reconcile design quantities, actual placement, returns and offcuts; independently support each volume/length conversion; input quantity in each native unit = attributable gross receipts + opening stock - verified returns/transfers - closing reusable stock. Include pre-acceptance failure/rework consumption; reconcile accepted installed quantities and waste separately without cancelling manufacturing burdens."
      unit: "kg; m; item"
      frequency: "Each batch and placement"
      temporal_coverage: "actual construction start to acceptance, including rework"
      site_scope: "declared entity and attributed activity"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "original tickets, calibration, samples, signed work records and gap register"
    - protocol_id: cp_cables
      process_id: "cable_placement"
      flow_role: "individual cable input"
      record_type: "reel and circuit ledger"
      raw_fields: "reel_id; specification; cable_metres; route_metres; cores; circuit; slack; returned_m; rejected_m; joint/termination positions ; attributable opening/closing cable stock in m; gross received cable m; verified return/transfer m; consumed damage/offcut/replacement m"
      collection_method: "Measure reel markings with calibrated counter and as-built circuit survey; record non-installed losses and actual replacement before acceptance  Cable consumption in m = attributable gross receipts + opening stock - verified returns/transfers - closing reusable stock; include consumed offcuts/damage/replacements, while reconciling installed lengths and reusable surplus separately. Record these terms for every cable row; the balance is not limited to equipment counts or module areas."
      unit: "m; kg"
      frequency: "Each reel and circuit"
      temporal_coverage: "actual construction start to acceptance, including rework"
      site_scope: "declared entity and attributed activity"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "original tickets, calibration, samples, signed work records and gap register"
    - protocol_id: cp_utilities
      process_id: "site_operations_underground_civil_aerial_support_cable_placement_station_tower_marine_placement_reinstatement_acceptance"
      flow_role: "individual fuel and electricity"
      record_type: "meter and fuel log"
      raw_fields: "equipment_id; process_id; dates; start/end meter; kWh; fuel_kg; fuel_volume; actual density; batch_MJ_per_kg; geography; voltage; renewable/fossil fraction"
      collection_method: "Read actual meters and weigh/refuel tickets; assign operations including idling and rework once; vessel activity separately tagged"
      unit: "MJ; kWh; kg"
      frequency: "Each shift, meter interval and fuel batch"
      temporal_coverage: "actual construction start to acceptance, including rework"
      site_scope: "declared entity and attributed activity"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "original tickets, calibration, samples, signed work records and gap register"
    - protocol_id: cp_water
      process_id: "site_operations_underground_civil"
      flow_role: "supply, abstraction and dispatch"
      record_type: "separate water meters and samples"
      raw_fields: "interface; origin; aquifer; receiver; m3; quality; sample; treatment; recirculation; dates; direction; no-transfer versus dispatch"
      collection_method: "Meter supply, pumping, treatment dispatch and direct release separately; reconcile wet process water and retained moisture; record saline/fresh receivers"
      unit: "m3"
      frequency: "Each interval and discharge batch"
      temporal_coverage: "actual construction start to acceptance, including rework"
      site_scope: "declared entity and attributed activity"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "original tickets, calibration, samples, signed work records and gap register"
    - protocol_id: cp_logistics
      process_id: "site_operations_marine_placement_reinstatement"
      flow_role: "individual freight service"
      record_type: "shipment records"
      raw_fields: "shipment_id; material_row; origin/destination; net_t; route_km; truck; loaded/empty leg; allocation; background inclusion"
      collection_method: "Weigh actual load and document travelled route and empty return, with supplier transport boundary reconciled"
      unit: "t*km"
      frequency: "Each trip"
      temporal_coverage: "actual construction start to acceptance, including rework"
      site_scope: "declared entity and attributed activity"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "original tickets, calibration, samples, signed work records and gap register"
    - protocol_id: cp_equipment
      process_id: "site_operations_cable_placement"
      flow_role: "capital manufacture attribution"
      record_type: "serial cumulative-use ledger"
      raw_fields: "serial; configuration; net_kg; count; project_hours/cycles; supported_total_life_activity; prior_shares; future_shares; repair scope"
      collection_method: "Weigh same configuration or verify count; audit complete activity denominator and allocation history, retaining uncertainty when incomplete"
      unit: "kg; item; dimensionless share"
      frequency: "Each use and ledger update"
      temporal_coverage: "actual construction start to acceptance, including rework"
      site_scope: "declared entity and attributed activity"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "original tickets, calibration, samples, signed work records and gap register"
    - protocol_id: cp_waste
      process_id: "underground_civil_cable_placement_marine_placement_reinstatement"
      flow_role: "individual waste output"
      record_type: "dispatch and composition record"
      raw_fields: "row_id; batch; wet/dry_kg; moisture; solids; contamination; waste class; destination; treatment; returned product flag"
      collection_method: "Segregate and weigh actual outgoing streams, retain manifests and recipient receipts, excluding internal transfers"
      unit: "kg; m3"
      frequency: "Each dispatch batch"
      temporal_coverage: "actual construction start to acceptance, including rework"
      site_scope: "declared entity and attributed activity"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "original tickets, calibration, samples, signed work records and gap register"
    - protocol_id: cp_emissions
      process_id: "site_operations_underground_civil_aerial_support_cable_placement_station_tower_marine_placement_reinstatement_acceptance"
      flow_role: "individual elementary emission"
      record_type: "species and compartment evidence"
      raw_fields: "process_id; equipment; fuel carbon; fossil/bio share; oxidation evidence; representative species concentration; sample volume; actual external exhaust flow; release interval; integrated release volume; temperature/pressure; dry/wet gas basis; representative coverage; particle cut; control efficiency evidence; compartment; timing; method limitations; noise observations"
      collection_method: "Use real external-release measurements or independent route-specific mass balance/model evidence; distinguish ambient background, indoor exposure, NOx-equivalent and true species; keep unsupported noise characterization explicit"
      unit: "kg; sampling units"
      frequency: "Each operation or supported interval"
      temporal_coverage: "actual construction start to acceptance, including rework"
      site_scope: "declared entity and attributed activity"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "original tickets, calibration, samples, signed work records and gap register"
  calculation_rules:
    - id: entity_normalization
      applies_to: "all exchanges"
      rule: "q_ref = Q_attributed / N_accepted, where N_accepted counts traceable accepted entities with the same configuration; a single independent work has N_accepted = 1. Attribute before normalization; do not pool different functions."
      inputs:
        - cp_handover
        - "relevant row protocol"
      output: "atomic quantity per declared reference flow"
      source_ids: []
    - id: geometric_material_conversion
      applies_to: "materials recorded by geometry"
      rule: "kg = measured m3 × matching batch kg/m3, or measured m × same-configuration kg/m; density, moisture and state must match. Preserve wet kg and geometric m3 for ready-mix without inferring recipe."
      inputs:
        - cp_materials
        - cp_cables
      output: "converted real material mass"
      source_ids: []
    - id: energy_conversion
      applies_to: "electricity and fuel"
      rule: "MJ = kWh × 3.6; fuel MJ = measured kg × batch LHV MJ/kg. Fuel volume first uses actual kg/volume density; no invented default."
      inputs:
        - cp_utilities
      output: "MJ for each fuel and voltage tier"
      source_ids: []
    - id: freight_activity
      applies_to: "cable reel freight"
      rule: "t*km = sum of actual leg net t × route km, with return and sharing explicit. Do not add the same transport fuel/emissions when already included in the freight background."
      inputs:
        - cp_logistics
      output: "freight activity attributed to declared entity"
      source_ids: []
    - id: species_emission
      applies_to: "conditional mass-based pollutant elementary emissions; excludes volume-based water resources and releases"
      rule: "Release kg uses representative species concentration × integrated actual external exhaust flow or total released volume over the same representative interval, with units converted, or supported species mass balance; temperature/pressure and dry/wet basis must match. Sample volume supports sample mass and representativeness only, not total process exhaust volume. Fossil CO2 may use measured fossil carbon × evidenced oxidation fraction × 44/12; unknown concentration, total release volume or other inputs remain review. Particle cut and compartment must match. Water supply, abstraction and carrier-water release retain their separately metered m3 and receiving interfaces under water_basis and cp_water; any pollutants in that water use separate species mass rows."
      inputs:
        - cp_emissions
      output: "kg with defined species and compartment"
      source_ids: []
    - id: water_balance
      applies_to: "actual liquid water"
      rule: "Reconcile supply + abstraction + other measured inflow = direct release + liquid treatment dispatch + retained moisture + evidenced evaporation ± measured storage change; internal circulation is not counted twice. Incompatible volume states need real conversion; pollutant mass is not water mass."
      inputs:
        - cp_water
        - cp_waste
      output: "water-interface closure and residual disclosure"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all exchanges"
      requirement: "Verify substance, route, geography, included components, public primary property, unit and state; unresolved identity differs from absence."
      evidence: "supplier original specifications, public identities and site configuration"
    - id: dq_geometry
      applies_to: "reference entity"
      requirement: "Retain endpoints, site and as-built geometry; distinguish cable m, route m and fibre m, with sources for measured area/height and actual capacity."
      evidence: "cp_handover; cp_cables"
    - id: dq_completeness
      applies_to: "each actual route"
      requirement: "Check materials, energy, site water, waste, emissions, additional constituents and construction noise by operation; unsupported ecological/noise effects remain coverage gaps; no whole-life claim."
      evidence: "bill of quantities, equipment logs, waste/emission ledgers and gaps"
    - id: dq_time
      applies_to: "site quantities"
      requirement: "Time coverage includes idling, actual rework and acceptance; dates, submeter attribution and calibration are traceable; estimates differ from measurements."
      evidence: "work orders, meters and calibration"
    - id: dq_acceptance
      applies_to: "delivery"
      requirement: "Structural, earthing, electrical or optical tests match actual configuration with traceable defect closure; historical handbooks do not substitute current project specifications or approval."
      evidence: "cp_handover"
    - id: dq_capital
      applies_to: "reuse attribution"
      requirement: "Evidence supports whole-life denominator and cumulative shares; unknowns remain review, without treating each project as new manufacture."
      evidence: "cp_equipment"
validation_rules:
  - rule_id: reference_and_function_check
    applies_to: "foreground_dataset_conformance"
    rule: "Require one identified accepted entity and all applicable function/configuration/geometry qualifiers. Reference output is exactly 1 item and every inventory/collection/calculation denominator is per declared reference flow. Do not compare differently configured entities without an explicit functional equivalence study."
    source_ids: []
  - rule_id: identity_check
    applies_to: "foreground_dataset_conformance"
    rule: "Reject a UUID whose direct public identity conflicts with substance, geography, voltage, construction, compartment or primary property; retain exact unresolved rows. Reference-product identity remains unresolved for candidate use and must be resolved before publication."
    source_ids: []
  - rule_id: physical_and_coverage_check
    applies_to: "foreground_dataset_conformance"
    rule: "Check measured dimensions and material balances, density/LHV conversions, conditional process selection, waste destinations, water interfaces and non-overlapping particle fractions. Missing actual data, unknown manufacture denominator, unsupported emissions or characterized-noise gaps require review or incomplete coverage, not a passing physical validation."
    source_ids: []
  - rule_id: handover_check
    applies_to: "foreground_dataset_conformance"
    rule: "Require actual route-appropriate inspection and handover evidence; do not infer permission to energise or operate from this inventory. Verify separate foreground and upstream/later-stage coverage before any broader lifecycle claim."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground construction and delivery dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Configuration- and interface-matched local cable construction module; explicitly linked upstream, transport or later-stage models"
  excluded_use: "Whole-life or complete cradle-to-delivery claims without supplied coverage; long-distance/complete railway systems; factory cable manufacture; network operation; per-km comparison without functional equivalence"
  required_metadata: "reference entity, function, measured geometry, configuration, interfaces, construction period, actual operations, geography/supply, background/transport links, acceptance state and attribution ledger"
  required_quality_disclosure: "measurement/estimate distinction, losses, material state, identity gaps, upstream/later coverage, noise/ecological gaps, historical-source limitations, reuse denominator and uncertainty"
  update_trigger: "material change in as-built geometry/configuration, route, supplier identity, meters, energy mix, acceptance interface or waste destination"
data_sources:
  - id: "unsd-cpc-local-cables-2025"
    type: "official_guidance"
    reference: "[UNSD CPC Version 3.0 Explanatory Notes, 30 June 2025, pp. 280–281](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf)"
    used_for: "Scope of local power, communications, television and ancillary station/tower entities versus long-distance; no quantities or lifetime."
  - id: "itu-optical-cables-2009"
    type: "handbook"
    reference: "[ITU-T, Optical fibres, cables and systems (2009), chapter 3 pp. 61–89; chapter 4 pp. 91–111](https://www.itu.int/dms_pub/itu-t/opb/hdb/t-hdb-out.10-2009-1-pdf-e.pdf)"
    used_for: "Historical qualitative optical installation, underground/trenchless/aerial/submarine and joining context. Process decomposition only; no current design limits, mandatory route or generic consumption rate."
  - id: "spen-secondary-civil-2026"
    type: "official_guidance"
    reference: "[SPEN SUB-03-017, Issue 9, May 2026, sections 10.6–10.10, 12–13, pp. 15–27](https://www.spenergynetworks.co.uk/userfiles/file/SUB-03-017.pdf)"
    used_for: "Secondary-station civil/enclosure, as-built and site-quality record context; directly applicable only under SPEN conditions, otherwise project evidence required. No universal dimensions or recipes."
  - id: "spen-secondary-install-2025"
    type: "official_guidance"
    reference: "[SPEN SUB-02-006, Issue 7, December 2025, sections 10–16, pp. 6–13](https://www.spenergynetworks.co.uk/userfiles/file/SUB-02-006.pdf)"
    used_for: "Ground-mounted secondary-station installation, acceptance and equipment boundary context; its lower-side 400/230V network conditions do not mandate a configuration for all works."
  - id: "eirgrid-cable-records-2026"
    type: "official_guidance"
    reference: "[EirGrid CDS-GFS-00-001-R2.1, 27 March 2026, sections 2.1–2.5 and record schedules, pp. 8, 13–14](https://cms.eirgrid.ie/sites/default/files/publications/CDS-GFS-00-001-R2-110kV-220kV-400kV-Cable-Specification.pdf)"
    used_for: "Comparator for material, pulling, jointing and acceptance records in Irish 110/220/400-kV transmission; no transfer of its fully ducted route, HV limits or guarantee maintenance into local requirements."
  - id: "epa-construction-dust-1995"
    type: "official_guidance"
    reference: "[US EPA AP-42 section 13.2.3 Heavy Construction Operations, January 1995, pp. 1–2](https://www.epa.gov/sites/default/files/2020-10/documents/13.2.3_heavy_construction_operations.pdf)"
    used_for: "Historical component-operation dust limitations/control context; no old average factor or TSP-to-PM2.5 substitution. Current releases need actual evidence."
