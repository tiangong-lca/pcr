product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.constructions.local-cable-network-works"
  classification_refs: "CPC 3.0 53252; context only / 仅分类背景"
  covered_products: "Accepted local power, communication or television cable networks and actual ancillary station/tower works"
  excluded_products: "Long-distance networks; complete railway electrification; factory cable products; standalone construction services; operating services"
  representative_product: "An endpoint- and circuit-defined local cable segment with its actual ducts, joints, supports and accepted reinstatement interfaces"
  production_route: "Actual underground, aerial, station/tower and local submarine branches; no assumption that all occur"
  market_state: "Installed physical entity after actual construction and acceptance; declare energised or ready-only state"
functional_unit:
  what: "An installed power or communication connection between declared local endpoints, or a configured local distribution-station/tower entity"
  how_much: "One independently accepted entity; additionally declare measured route m, cable m by circuit, duct count, station m2, tower height m and actual rated capacity as applicable"
  how_well: "Real as-built geometry, component specifications, joint/bonding records, applicable electrical/optical tests and structural inspection; this PCR grants no compliance or energisation approval"
  how_long_or_cycle: "One actual construction-to-handover cycle with dates; no prescribed operational lifetime"
  reference_flow_link: "reference_product_local_cable_works"
system_boundary:
  rules:
    - rule_id: construction_boundary
      applies_to: "foreground_system_boundary"
      rule: "Include actual receipt/logistics, setting-out, site preparation, earthworks, placement/jointing, foundations, station/tower erection, tests, corrective rework and reinstatement through the documented acceptance boundary. Record actual equipment and utility activity by operation; shared site-operations rows must not duplicate downstream stage totals."
      source_ids:
        - spen-secondary-civil-2026
    - rule_id: upstream_interface
      applies_to: "foreground_system_boundary"
      rule: "Keep manufacture of cables, ducts, concrete, transformer and other purchased items upstream; construction does not automatically reproduce factory inventories. Transport and external waste treatment remain separately linked stages with coverage disclosure."
      source_ids: []
    - rule_id: later_stages
      applies_to: "foreground_system_boundary"
      rule: "Operation energy, network losses, future maintenance/replacement and terminal dismantling are excluded from the default construction module. If required, model actual supported periods or explicit scenarios separately, with compatible reference function, maintenance geometry, removal activity and waste destinations; no default lifetime or end-of-life credit."
      source_ids: []
    - rule_id: special_routes
      applies_to: "foreground_system_boundary"
      rule: "For trenchless or submarine segments retain actual bore/lay/burial geometry, fluid recipe, vessel/equipment hours, spoil, losses and receiving media. Do not replace these branches with open-trench assumptions or declare ecological/noise effects absent merely because no characterized elementary identity is available."
      source_ids:
        - itu-optical-cables-2009
boundary_abstraction:
  declared_starting_condition: "Material/equipment supply interface, actual transport origin and initial site condition; retained infrastructure has measured interfaces"
  starting_condition_role: "foreground construction and delivery"
  product_classification_scope: "local cable-network and ancillary civil entities"
  recursive_input_rule: "Do not recurse a purchased existing same-category work into new construction output; declare its delivered interface/historical burden and record actual modification separately"
  upstream_dataset_requirement: "Match real factory-gate manufacture backgrounds and required transport separately; missing backgrounds mean uncovered upstream, not complete cradle-to-delivery"
  disclosure: "Declare site-construction-to-acceptance foreground module; disclose upstream, transport, retained components, off-site treatment, operation/maintenance and dismantling coverage separately"
