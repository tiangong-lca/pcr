  method_review_needs:
    - Independent scientific review of all actual overhead, buried, submarine AC/DC/optical, railway-power and
      station interfaces remains required.
    - This baseline requires actual complete BOM/task expansion, representative upstream and treatment links
      and measured environmental coverage before a concrete dataset can claim completeness.
    - Any equipment/component manufacture share with unknown supported lifetime or cumulative activity remains
      explicit review and cannot reset manufacture per project.
    - Named operator specifications and historical sources are bounded process evidence; actual current
      jurisdictional design/test/permit evidence controls acceptance.
