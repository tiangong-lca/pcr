allocation_rules:
  - rule_id: allocation_direct
    applies_to: "Tasks and delivered objects"
    rule: "Use direct task/component metering first. If a campaign serves distinct objects, separate their measured quantities; allocate only irreducible shared work by a documented causal physical driver such as actual lift-hours, pulling time, vessel task-hours or serviced work volume. Shares are nonnegative and sum to one over all beneficiaries; explain standby/empty return. Route length alone is not an automatic allocator for dissimilar civil conditions or conductor configurations."
    source_ids:
      - national-grid-overhead-2025
      - eirgrid-submarine-2022
  - rule_id: allocation_reuse
    applies_to: "Reusable machinery, formwork and temporary components"
    rule: "Keep one asset identity and manufacture boundary. When manufacture is included, attribute measured same-configuration mass/count multiplied by an evidenced dimensionless project share of total service; retain the public property. Maintain a cross-project/period/reuse ledger whose cumulative manufacture shares never exceed one. Unknown life or total service remains review; do not reset complete manufacture to every project. Site fuel/maintenance activities are separate and never reduced by the manufacture share."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "Scrap, excavated soil and recovered components"
    rule: "Waste export, supplier returns, internal reuse and a qualified recovered product have distinct gates. No automatic avoided-metal, avoided-fill or energy credit is applied. Keep collection/transport/treatment burdens and destination evidence; any separately justified recycling/substitution scenario states actual quality, recovery yield and counterfactual with independent review."
    source_ids:
      - eirgrid-underground-2026
      - ifc-power-ehs-2007
dataset_production:
  collection_protocols:
    - protocol_id: cp_delivery
      process_id: "handover"
      flow_role: "reference_line and delivered geometry"
      record_type: "actual measured records"
      raw_fields: "object ID; site/endpoints; as-built chainage/length; cable/circuit/fibre counts; actual dimensions; ratings; component interfaces; acceptance date/tests; retained existing assets; qualifier applicability and absent-branch drawing evidence"
      collection_method: "Survey/measure actual delivered scope and cross-check signed drawings, test records and handover inventory; no invented mass or design data; apply boundary_qualifiers to standalone station/support fields as well as line sections; absent attributes require evidenced not_applicable, never fabricated geometry"
      unit: "item; m; m2; kV; MVA; fibre count"
      frequency: "Each task/load/batch/meter event; delivery close-out"
      temporal_coverage: "All actual work from baseline to acceptance/restoration; recorded real dates"
      site_scope: "One declared object and linked actual work sites/voyages; shared beneficiaries explicit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "survey calibration; signed acceptance and complete interface list"
    - protocol_id: cp_materials
      process_id: "site_operation"
      flow_role: "each actual purchased component"
      record_type: "actual measured records"
      raw_fields: "supplier; batch/model/specification; complete supply scope; received/installed/returned/offcut count/length/volume/mass; moisture; actual density/linear mass; tests; pre-acceptance failed/replaced components; opening/closing reusable stocks; verified transfers"
      collection_method: "Match design BOM, weighbridge/drum/ticket/meter records and installed survey; separately measure conversion support and embedded materials; native-unit inputs include attributable consumed failures/replacements: gross receipts + opening stock - verified returns/transfers - closing reusable stock; accepted installed configuration and actual waste are separate, without cancelling input manufacture"
      unit: "kg; m; m3; item"
      frequency: "Each task/load/batch/meter event; delivery close-out"
      temporal_coverage: "All actual work from baseline to acceptance/restoration; recorded real dates"
      site_scope: "One declared object and linked actual work sites/voyages; shared beneficiaries explicit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier certificates; calibrated weighing/length/volume instruments; batch reconciliation"
    - protocol_id: cp_energy
      process_id: "site_operation"
      flow_role: "electricity and each actual site fuel"
      record_type: "actual measured records"
      raw_fields: "task/equipment ID; geography; supply voltage; meter readings; dates; fuel batch mass/volume; actual density and net heating value; blend/carbon origin; idle time"
      collection_method: "Submeter each real task or reconcile fuel issue/return/tank stock; metered kWh to MJ and actual measured mass with batch heating value"
      unit: "kWh; MJ; kg; m3; kg/m3; MJ/kg"
      frequency: "Each task/load/batch/meter event; delivery close-out"
      temporal_coverage: "All actual work from baseline to acceptance/restoration; recorded real dates"
      site_scope: "One declared object and linked actual work sites/voyages; shared beneficiaries explicit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration; fuel certificate; distinct grid/generator/transport interfaces"
    - protocol_id: cp_water
      process_id: "site_operation"
      flow_role: "supply, abstraction, dewatering and receiving water"
      record_type: "actual measured records"
      raw_fields: "source/location; intake/output meters; actual seawater mass; actual salinity/temperature and evidenced density; original volume parcel records; tank stocks; water parcel ID; reuse; treatment/discharge destination; sampling composition; permission"
      collection_method: "Meter actual separate water parcels and seawater mass, or volume with evidenced density at the same salinity/temperature; unknown density remains review. Reconcile original volume stocks/reuse and returns separately; specific sampled pollutants are separate atomic emissions, not whole wastewater as water"
      unit: "m3; kg seawater; kg/m3 measured density or identified constituent concentration; salinity; temperature"
      frequency: "Each task/load/batch/meter event; delivery close-out"
      temporal_coverage: "All actual work from baseline to acceptance/restoration; recorded real dates"
      site_scope: "One declared object and linked actual work sites/voyages; shared beneficiaries explicit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter and laboratory uncertainty; destination/permit and sample-chain records"
    - protocol_id: cp_waste
      process_id: "site_operation"
      flow_role: "each actual exported waste"
      record_type: "actual measured records"
      raw_fields: "atomic waste composition; wet/dry state; tare/gross/net mass or volume; contamination; load/date; receiver/treatment; returns/reuse; same-state measured volume and bulk density; moisture; conversion measurement/provenance and uncertainty"
      collection_method: "Weigh/meter each actual waste load and reconcile material tickets and receiver records; do not combine unrelated waste materials; for native-mass waste measured volumetrically, retain same-lot/state volume and independently measured bulk density with moisture and units; unknown density requires review, never a default. Waste conversion evidence belongs here, not solely to purchased-component cp_materials."
      unit: "kg; m3; kg/m3"
      frequency: "Each task/load/batch/meter event; delivery close-out"
      temporal_coverage: "All actual work from baseline to acceptance/restoration; recorded real dates"
      site_scope: "One declared object and linked actual work sites/voyages; shared beneficiaries explicit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weighbridge calibration; composition analyses; manifests and receiver receipts"
    - protocol_id: cp_logistics
      process_id: "logistics"
      flow_role: "each actual transport leg"
      record_type: "actual measured records"
      raw_fields: "mode/vehicle; supplier/treatment/site gates; load cargo mass; actual route distance; vehicle total weight/class; empty return/shared loads"
      collection_method: "Match vehicle/load tickets and route logs; calculate cargo tonnes times loaded km for compatible service, disclose actual empty return treatment"
      unit: "kg; t; km; t*km"
      frequency: "Each task/load/batch/meter event; delivery close-out"
      temporal_coverage: "All actual work from baseline to acceptance/restoration; recorded real dates"
      site_scope: "One declared object and linked actual work sites/voyages; shared beneficiaries explicit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weighbridge; actual distance logs; supplier dataset service boundary"
    - protocol_id: cp_marine
      process_id: "marine_install"
      flow_role: "each actual vessel task and fuel"
      record_type: "actual measured records"
      raw_fields: "vessel ID; fuel grade/batch; bunker/stock/return; voyage/task/date; route distance; hours; mobilisation/standby/weather delays; all beneficiaries"
      collection_method: "Reconcile tank measurements/bunker certificates and task logs; direct fuel use first, documented causal sharing only for inseparable campaigns"
      unit: "kg; m3 with actual density; h; km"
      frequency: "Each task/load/batch/meter event; delivery close-out"
      temporal_coverage: "All actual work from baseline to acceptance/restoration; recorded real dates"
      site_scope: "One declared object and linked actual work sites/voyages; shared beneficiaries explicit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "fuel certificate; calibrated tanks/flowmeters; survey/lay logs and sharing ledger"
    - protocol_id: cp_gas
      process_id: "station_install"
      flow_role: "SF6 site charge/recovery/release"
      record_type: "actual measured records"
      raw_fields: "gas species/purity; cylinder/equipment IDs; tare/filled/final/recovered masses; factory embedded charge; measured leak/release; location/time"
      collection_method: "Calibrated cylinder/equipment weighing and verified leak measurement; unexplained residual remains investigation, not assigned release"
      unit: "kg"
      frequency: "Each task/load/batch/meter event; delivery close-out"
      temporal_coverage: "All actual work from baseline to acceptance/restoration; recorded real dates"
      site_scope: "One declared object and linked actual work sites/voyages; shared beneficiaries explicit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale calibration; gas certificates; recovery receipts and uncertainty reconciliation"
    - protocol_id: cp_emissions
      process_id: "site_operation"
      flow_role: "each actual molecular/particle air release"
      record_type: "actual measured records"
      raw_fields: "source/task; substance/CAS; fossil/biogenic carbon; compartment/time; measured concentration/size fraction; flow/time; equipment/control; matching method and uncertainty"
      collection_method: "Integrate actual matched concentration with exhaust flow and duration on a common wet/dry/state basis, or use independently supported equipment/control/fuel-specific method; no universal factor"
      unit: "kg; measured concentration; exhaust volume; h"
      frequency: "Each task/load/batch/meter event; delivery close-out"
      temporal_coverage: "All actual work from baseline to acceptance/restoration; recorded real dates"
      site_scope: "One declared object and linked actual work sites/voyages; shared beneficiaries explicit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "laboratory/instrument calibration; actual method reference; speciation/particle separation evidence"
    - protocol_id: cp_incident
      process_id: "site_operation"
      flow_role: "actual mineral-oil spill to soil"
      record_type: "actual measured records"
      raw_fields: "incident ID/date; actual oil species/composition; spill/recovered/retained masses; receptor soil; sampling; remediation destination"
      collection_method: "Use incident measurements and sampled receiving soil, subtract verified captured oil without treating unknown loss as proof of soil release"
      unit: "kg"
      frequency: "Each task/load/batch/meter event; delivery close-out"
      temporal_coverage: "All actual work from baseline to acceptance/restoration; recorded real dates"
      site_scope: "One declared object and linked actual work sites/voyages; shared beneficiaries explicit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "incident report; laboratory chain of custody; containment/recovery records"
    - protocol_id: cp_land
      process_id: "site_operation"
      flow_role: "land occupation and actual transformations"
      record_type: "actual measured records"
      raw_fields: "nonoverlapping polygon area; original/changed/restored land classes; use start/end dates; existing easement; marine disturbance separately"
      collection_method: "Survey actual disturbed/use polygons and dated site records; area multiplied by actual days/365 for m2*a; paired actual transformation rows use Area"
      unit: "m2; day; m2*a"
      frequency: "Each task/load/batch/meter event; delivery close-out"
      temporal_coverage: "All actual work from baseline to acceptance/restoration; recorded real dates"
      site_scope: "One declared object and linked actual work sites/voyages; shared beneficiaries explicit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "survey accuracy; dated access/restoration logs; no polygon/time double counting"
    - protocol_id: cp_reuse
      process_id: "site_operation"
      flow_role: "manufacture share of each reusable asset"
      record_type: "actual measured records"
      raw_fields: "unique asset ID; same-configuration measured mass/count; manufacture scope; all prior/current/planned evidenced service; project activity; beneficiary/share history"
      collection_method: "Retain manufacture once, document the dimensionless causal service share and check cumulative shares across all projects/periods <=1; unknown denominator stays review"
      unit: "kg; item; dimensionless share; actual service unit"
      frequency: "Each task/load/batch/meter event; delivery close-out"
      temporal_coverage: "All actual work from baseline to acceptance/restoration; recorded real dates"
      site_scope: "One declared object and linked actual work sites/voyages; shared beneficiaries explicit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "asset register; measured mass/count; supported service denominator; globally conserved share ledger"
  calculation_rules:
    - id: calc_reference
      applies_to: "All exchanges"
      rule: "q_ref = Q_object for the one declared accepted object. Only a homogeneous measured batch of N separately identified equivalent objects permits q_ref = Q_batch / N; N is positive and evidenced. Do not divide by guessed mass or unqualified route length."
      inputs:
        - "actual Q in each row unit"
        - "cp_delivery object IDs and count"
      output: "each row amount per declared reference flow"
      source_ids: []
    - id: calc_material
      applies_to: "Materials, lengths and components"
      rule: "Use actual input crossing the declared gate; installed + exported offcut + verified residual/return reconciliation must equal receipt adjusted for opening/closing stock within measured uncertainty. Keep returns upstream and waste destinations distinct. If weighing is unavailable, mass_kg = measured volume_m3 × same-state measured density_kg/m3 or measured length_m × same-design verified linear mass_kg/m; never a generic density/linear-mass default."
      inputs:
        - "cp_materials received/installed/stock/return records and conversion measurements"
      output: "actual net input and separate waste in their declared units"
      source_ids:
        - eirgrid-underground-2026
    - id: calc_energy
      applies_to: "Site electricity and diesel"
      rule: "Metered electricity_MJ = electricity_kWh × 3.6. Diesel_MJ = actual diesel_mass_kg × batch net_calorific_value_MJ/kg; where measured by volume, mass_kg = actual volume_m3 × actual batch density_kg/m3. Preserve public Net calorific value and its MJ unit group; the secondary screening Mass value is not a density or heating-value conversion."
      inputs:
        - "cp_energy calibrated meters and actual batch certificates"
      output: "MJ per declared reference flow"
      source_ids: []
    - id: calc_transport
      applies_to: "road_freight"
      rule: "transport_tkm = sum(actual cargo_mass_kg / 1000 × actual leg_distance_km); 1 t*km = 1000 kg*km. Match actual vehicle/class/loaded and empty-trip scope of the service dataset, and record separate other modes."
      inputs:
        - "cp_logistics cargo mass"
        - "distance and scope"
      output: "t*km per declared reference flow"
      source_ids: []
    - id: calc_occupation
      applies_to: "site_occupation"
      rule: "occupation_m2a = sum(nonoverlapping actual area_m2 × actual occupation_days / 365). This public unit definition supplies a time conversion only, never a service life. Record actual land transformation pairs separately in m2."
      inputs:
        - "cp_land actual polygons/dates and public unit definition"
      output: "m2*a per declared reference flow"
      source_ids: []
    - id: calc_gas_water
      applies_to: "SF6 and water parcels"
      rule: "For seawater resource mass_kg = actual volume_m3 × evidenced same-salinity/temperature density_kg/m3, or direct measured mass; density unknown remains review. Maintain volume parcel conservation separately and never subtract kg resource directly from m3 discharge. Reconcile receipts/opening stock against retained final stock, verified returns/recovery, exported treatment waste and evidenced direct release on the same composition/state basis. Do not equate unexplained residual with leakage or water consumption; no water parcel may enter both treatment waste and direct discharge."
      inputs:
        - "cp_gas/cp_water metering"
        - "stock and destination evidence"
      output: "actual separate kg or m3 amounts"
      source_ids:
        - ifc-power-ehs-2007
    - id: calc_reused_manufacture
      applies_to: "Included reusable assets"
      rule: "attributed_asset_quantity = measured same-configuration asset mass/count × documented dimensionless manufacture share. Record both factors, actual service denominator and project numerator in cp_reuse; cumulative manufacture shares across projects/periods <=1. Unknown denominator remains review; this is not a conversion of the line reference product to 1 kg."
      inputs:
        - "cp_reuse asset evidence and conservation ledger"
      output: "kg or item of attributed manufacture, separately from fuel"
      source_ids: []
  data_quality_requirements:
    - id: dq_geometry
      applies_to: "Delivered configuration"
      requirement: "Declare actual route versus cable/conductor length, branch endpoints, each cable/circuit/fibre count, voltage/rating/function, support/foundation/duct/shore/station dimensions, soil/seabed conditions and included assets. No design load, size, component mass or life is supplied by this PCR. Apply boundary_qualifiers: measure actual delivered object attributes, and record genuinely absent station/support route or cable attributes as evidenced not_applicable; unknown applicable values remain gaps."
      evidence: "cp_delivery drawings/surveys, actual design and signed acceptance"
    - id: dq_coverage
      applies_to: "Complete actual foreground"
      requirement: "Map each actual task and specific BOM item to a record/row. Separate necessary work for that actual configuration from documented absent and optional stages. Preserve measurement coverage, missing data and uncertainty; no arbitrary mass/energy cutoff removes important control gas, leakage, habitat or noise."
      evidence: "task/BOM reconciliation and bounded gap register"
    - id: dq_representativeness
      applies_to: "Supply and background links"
      requirement: "Use actual supplier geography, period, technology, material grades, state and complete component boundary. Selected identity conditions are binding on every UUID row; a CN factory cable/grid or GLO oil screening identity cannot justify a generic cross-region inventory. Report unavailable production/transport/treatment links."
      evidence: "supplier original certificates and dataset metadata"
    - id: dq_uncertainty
      applies_to: "Measurement and calculation"
      requirement: "Retain instrument accuracy/calibration, detection limits, sampling/speciation, moisture/density/heating-value state and allocation sensitivity. Derive QA tolerances from actual instruments and applicable project specifications. No default numeric intensity, mixture, loss or emission factor is assigned."
      evidence: "calibration, certificates, tests and explicit sensitivity"
    - id: dq_source_limits
      applies_to: "Source applicability"
      requirement: "CPC defines entity scope, not recipe or methodology approval. EirGrid/NG documents support bounded route decomposition; their numerical designs/tests stay local. ITU 2009, IFC 2007 and RDSO 2020 provide explicitly historical qualitative examples. Current project evidence controls every quantity, specification and acceptance decision; unsupported transfers remain review."
      evidence: "source version/page and actual applicability record"
validation_rules:
  - rule_id: validation_object
    applies_to: "Reference object"
    rule: "Reject missing object ID, signed delivery state, defined endpoints/interfaces, actual geometry, configuration or relevant functional tests. One item is one complete declared object; do not use a service fee, cable mass or arbitrary work stage as its output. Different objects may not be compared without compatible function/configuration/boundary."
    source_ids:
      - cpc3-explanatory-notes-2025
      - eirgrid-underground-2026
  - rule_id: validation_completeness
    applies_to: "Actual route/process inventory"
    rule: "Reconcile every actual drawing/BOM/work/utility/waste item to an atomic row and supplier/process boundary, including support, chambers/boxes, station structures, auxiliaries, railway/optical devices, temporary crossings and reinstatement. Baseline cards are conditional examples, never a universal complete BOM. Missing actual rows, unmeasured significant tasks, unknown shared denominators or unavailable upstream/treatment links remain incomplete/review; do not assert complete expanded lifecycle coverage."
    source_ids:
      - eirgrid-underground-2026
      - itu-submarine-g971-2024
      - rdso-rail-ohe-2020
  - rule_id: validation_units
    applies_to: "Quantities and bases"
    rule: "All amounts must be finite, nonnegative and linked to real records for the same declared reference flow. Verify physical cable versus route length, count scope, same-state density/linear mass, fuel heating value, meter boundaries and gas/water/soil destination reconciliation. Do not infer fixed project mass, per-km intensity, concrete recipe, losses, demand or life. Record justified tolerances from actual instruments/specifications, not fabricated universal QA ranges."
    source_ids:
      - eirgrid-underground-2026
      - eirgrid-submarine-2022
  - rule_id: validation_identity
    applies_to: "Selected public flow identities"
    rule: "Verify substance/material, fossil/biogenic origin, product/waste/elementary role, geography, route/state, primary property/unit group and compartment/subcompartment/timing before linking. Preserve exact public Chinese names and shared UUID/row IDs. A blank product reference identity remains the precise declared reference_line gap for this candidate; actual data must disclose every missing identity and dataset link. Neither an identity UUID nor a passed builder check approves methodology."
    source_ids: []
  - rule_id: validation_emissions
    applies_to: "Measured releases and environmental evidence"
    rule: "Reject inferred mandatory spill, SF6 leak or emission quantity from fuel/equipment presence. Molecular NO, NO2 and N2O and NOx-as-NO2 are different; immediate/outdoor and long-term/indoor are different; particle fractions must not overlap. Captured dust/slurry and treatment water are not direct environmental emissions. Missing quantified noise/habitat/marine coverage must be disclosed."
    source_ids:
      - ifc-power-ehs-2007
  - rule_id: validation_acceptance
    applies_to: "Engineering and environmental acceptance"
    rule: "Use the actual applicable authority, project specification revision and test programme for this geography/AC-DC/optical/railway branch, with measured results and independent acceptance records. Sources here support process/method scope and give bounded examples; historic IFC/ITU/RDSO and another operator's numerical criteria are not current legal approval or automatic design compliance."
    source_ids:
      - national-grid-overhead-2025
      - eirgrid-underground-2026
      - eirgrid-submarine-2022
      - itu-submarine-g971-2024
      - rdso-rail-ohe-2020
published_dataset_profile:
  dataset_role: "Site/project-specific foreground construction-to-accepted-delivery process, linked to actual upstream/logistics/treatment only where verified"
  downstream_use: "Transparent assembly of a declared line/station/railway or other infrastructure study with one-count asset interfaces"
  allowed_use: "The documented site/configuration/period and verified functional object; compatible comparison only after function and stage alignment"
  excluded_use: "Generic per-km/per-kg default; local distribution; component manufacture replacement; operational transmission service; unqualified whole-life or methodology/compliance approval"
  required_metadata: "All section 3 qualifiers; supplier/component gates and geography; actual drawings/BOM; stage/route task records; field units/conversions; allocation/asset history; direct-release media; waste/treatment routes; source versions and test acceptance; documented applicability under boundary_qualifiers"
  required_quality_disclosure: "Measurement/certificate coverage and uncertainty, actual missing atomic rows/UUIDs/upstream links, environmental/noise/habitat gaps, retained/reused assets, historic/local-source applicability and excluded lifecycle stages"
  update_trigger: "Changed design/geometry/route, voltage/fibre/capacity, actual materials/supplier, installation equipment/process, accepted scope/tests, incident or new verified flow/evidence"
data_sources:
  - id: "cpc3-explanatory-notes-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 explanatory notes, 30 June 2025, p.280 (53242), p.281 (53252): [official PDF](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf)"
    used_for: "Scope: long-distance telecom overland/underground/submarine, high-tension and railway power lines, transformer stations/pylons; low-tension distribution excluded. Classification context only, no accepted mapping or engineering recipe."
  - id: "national-grid-overhead-2025"
    type: "official_guidance"
    reference: "National Grid, Grimsby to Walpole PEIR, Vol.3 Part C Chapter 5 appendices, June 2025, §5A.3.26 and §5A.3.28, printed 5A-35–36 (PDF pp.41–42): [official PDF](https://www.nationalgrid.com/document/561291/download)"
    used_for: "Proposed UK 400 kV overhead/AIS route process example: access, foundations, erection/stringing, station installation/tests and reinstatement. Qualitative process sequence only; no assumed span, foundation quantity, lifetime or project approval."
  - id: "eirgrid-underground-2026"
    type: "standard"
    reference: "EirGrid, 110/220/400 kV Underground Cable Functional Specification, CDS-GFS-00-001-R2.1, 27 March 2026, §2 p.8, §4.12 pp.25–27, §6 pp.52–65, §7 pp.66–78, Appendix C pp.88–90; Addenda A/B pp.79–84: [official PDF](https://cms.eirgrid.ie/sites/default/files/publications/CDS-GFS-00-001-R2-110kV-220kV-400kV-Cable-Specification.pdf)"
    used_for: "Ireland EirGrid fully ducted 110/220/400 kV systems: complete components, civil/handling/pulling/jointing and as-built/test records. §7.9.2 replaced by Addendum A; §4.7 by B. No local numerical criteria, all-duct requirement, warranty or test approval transferred to other designs."
  - id: "eirgrid-submarine-2022"
    type: "standard"
    reference: "EirGrid, 220 kV Submarine Cable Functional Specification, OFS-CAB-100-R3, 21 December 2022, scope p.3, §6.4–6.5 pp.28–31, §10–12 pp.57–66: [official PDF](https://cms.eirgrid.ie/sites/default/files/publications/OFS-CAB-100-R3-220-kV-Submarine-Cables.pdf)"
    used_for: "Fixed/static 220 kV XLPE three-phase 50 Hz AC offshore systems, depth≤200 m; excludes inter-array/floating and land cable after shore transition joint. Route/lay/burial/protection/records examples only; other AC/DC/deeper/dynamic systems need own evidence and tests."
  - id: "itu-submarine-g971-2024"
    type: "standard"
    reference: "ITU-T G.971, General features of optical fibre submarine cable systems, December 2024, Annex A.2–A.4, printed pp.7–9 (PDF pp.13–15): [official PDF](https://www.itu.int/rec/dologin_pub.asp?lang=e&id=T-REC-G.971-202412-I!!PDF-E&type=items); Cor.1 November 2025: [official PDF](https://www.itu.int/rec/dologin.asp?lang=e&id=T-REC-G.971-202511-I!Cor1!PDF-E&type=items)"
    used_for: "Optical submarine survey/conditional clearance, laying, optional burial, repeaters/branching, terminal tests and commissioning. Cor.1 updates Appendix I equipment information, not Annex A. A.5 later maintenance excluded. Not electric-power cable tests or default vessel fuel/life."
  - id: "itu-optical-installation-2009"
    type: "handbook"
    reference: "ITU-T, Optical fibres, cables and systems, 2009, Chapter 3 §§1.1,1.5,1.6,1.8,1.9,1.11, printed pp.61–66,74–80,84–90 (PDF pp.83–88,96–102,106–112): [official handbook](https://www.itu.int/dms_pub/itu-t/opb/hdb/t-hdb-out.10-2009-1-pdf-e.pdf)"
    used_for: "Historical qualitative distinction of duct pulling/blowing, direct burial, aerial/OPGW, railway telecom and submarine techniques. Actual modern product specification/tests control; no old numerical limits or lifetime adopted."
  - id: "ifc-power-ehs-2007"
    type: "official_guidance"
    reference: "IFC, Environmental, Health, and Safety Guidelines: Electric Power Transmission and Distribution, 30 April 2007, pp.2,7: [official PDF](https://www.ifc.org/content/dam/ifc/doc/2000/2007-electric-transmission-distribution-ehs-guidelines-en.pdf)"
    used_for: "Historical qualitative screen for erosion/dust, wastes/water, traffic/noise, habitat, potential oil spills and SF6. No presumed release, emission factor, present legal approval or all-life boundary. Actual contemporary permits and measurements required."
  - id: "rdso-rail-ohe-2020"
    type: "official_guidance"
    reference: "Indian Ministry of Railways/RDSO, TI/IN/0042, OHE guidelines for increasing speed potential to 160 kmph on NDLS–HWH & NDLS–BCT routes, October 2020, §§1.1–1.3, PDF/printed pp.3–11: [official PDF](https://rdso.indianrailways.gov.in/uploads/files/TI-IN-0042.pdf)"
    used_for: "Historical named railway example distinguishing mast/foundation, feeder, contact/catenary wire and earth conductors, with existing-asset suitability. No speed, alloy, size, tension, wind loading, spacing or lifetime is imposed on this category; actual project evidence controls."
