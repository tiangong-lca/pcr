measurement_rules:
  - id: measurement_reference
    applies_to: "Accepted long-distance communication or power-line infrastructure delivery"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "The fixed reference output is 1 item, one complete declared accepted object; cp_delivery verifies configuration and count. No mass conversion is implied."
  - id: measurement_components
    applies_to: "material, component and waste rows whose native properties are mass, length, volume or count"
    required_property_ref:
      name: "Mass; Length; Volume; Number of items"
      uuid: ""
    required_unit: "kg; m; m3; item"
    rule: "Retain each actual primary property/state. Measure component mass, physical cable length, wet concrete volume and device count separately; component conversion requires actual same-design/state records in cp_materials; waste conversion uses cp_waste with its measured same-state volume, bulk density, moisture and provenance. Do not use public secondary screening factors. Exchanges declared in energy, transport and land units retain Net calorific value/MJ, Goods transport (mass*distance)/t*km and area-time/m2*a under their specific rules. This does not impose MJ on a mass-based fuel: marine_fuel retains Mass/kg under cp_marine, with batch density for any volume conversion; component-specific cp_materials requirements do not apply to that separately collected fuel. No conversion of those quantities into material mass is implied."
  - id: measurement_energy
    applies_to: "electricity and diesel rows declared with the native Net calorific value/MJ; excludes marine_fuel"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Retain public primary property; actual meter/batch data in cp_energy support kWh or mass/volume to MJ, with no assigned demand/density/heating value. The separately supplied marine_fuel retains its declared Mass/kg and cp_marine tank/bunker balance; volume conversion requires actual same-batch density. Auxiliary heating-value data do not create a second fuel input or replace that native kg exchange."
  - id: measurement_resources
    applies_to: "Water and land"
    required_property_ref:
      name: "Mass; Volume; Area; Area*time"
      uuid: ""
    required_unit: "kg; m3; m2; m2*a"
    rule: "Keep resource input, wastewater and receptor release distinct; sea-water resource is Mass/kg with actual mass or volume and same-salinity/temperature evidenced density, never an assumed density. Preserve original volume balance separately. m2*a uses actual measured area/dates with 365-day conversion only, not asset life."
