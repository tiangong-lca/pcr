          description: "One complete uniquely identified accepted construction object, possibly a defined line section or separately accepted transmission transformer station/pylon. Its full declared physical interface and supporting works define the item; not one kg of cable, a construction-service contract or an arbitrary work stage."
          amount:
            expression: "1 item"
            value_mode: "fixed_value"
            specificity: "site_specific"
            basis:
