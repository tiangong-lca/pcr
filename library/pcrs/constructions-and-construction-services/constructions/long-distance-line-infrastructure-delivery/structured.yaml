system_boundary:
  rules:
    - rule_id: boundary_delivery
      applies_to: "Foreground stages"
      rule: "Include actual receiving/unloading, project survey/preparation, civil works, relevant line/station installation, site tests/commissioning, temporary removal and restoration through the signed delivery interface. Map all real branches; an absent branch needs documented not_applicable, not guessed zero."
      source_ids:
        - national-grid-overhead-2025
        - eirgrid-underground-2026
        - itu-submarine-g971-2024
    - rule_id: boundary_qualifiers
      applies_to: "all reference qualifiers, cp_delivery geometry/fields, dq_geometry and publication metadata"
      rule: "Every object requires its identity, site/country, real dates, long-distance function, delivered physical interfaces, applicable dimensions and signed acceptance. Line sections require actual endpoints/chainage/route length and all delivered cable/conductor lengths/counts. For separately delivered stations or supports, measure the actual station/support geometry and interfaces; attributes of genuinely absent route/cable/rating branches are explicitly not_applicable with drawings/scope evidence, not zero or missing measurements. This exception applies to the required-qualifier list, all collection fields, geometry requirements and required_metadata. Unknown applicable values remain gaps; do not borrow an adjacent line or invent length/capacity."
      source_ids: []
    - rule_id: boundary_upstream
      applies_to: "Purchased materials, equipment and logistics"
      rule: "Manufacturing, quarrying/refining and supplier packaging are upstream. Link complete supplied components at their declared gate and actual transport legs; prevent counting embedded copper, steel, insulation, oil or gas again. A service dataset containing construction must not be added on top of this same foreground construction. Missing links must be disclosed before any expanded cradle-to-gate claim."
      source_ids:
        - eirgrid-underground-2026
        - national-grid-overhead-2025
    - rule_id: boundary_existing
      applies_to: "Existing line assets and shared interfaces"
      rule: "Document pre-existing retained assets separately from new/replaced work. A purchased or reused in-category line section is one input with its source burden and interface; do not recursively re-create its installation or count it again in railway, station, wind farm or adjacent line datasets. Brownfield demolition needed before this delivery is identified separately; future demolition is outside."
      source_ids:
        - rdso-rail-ohe-2020
        - cpc3-explanatory-notes-2025
    - rule_id: boundary_later_stages
      applies_to: "Operation, maintenance and end of life"
      rule: "Network transmission losses, delivered energy/traffic service, vegetation maintenance, leakage during use, repairs, replacements and end-of-life demolition/recycling are outside the default delivery inventory. Any extension declares actual scenario, dates, evidenced life/activity, replaced quantities and destinations separately; no default lifetime, salvage credit or full-life claim follows from acceptance."
      source_ids:
        - itu-submarine-g971-2024
        - ifc-power-ehs-2007
    - rule_id: boundary_environment
      applies_to: "Environmental coverage"
      rule: "Separate technosphere water, direct freshwater/groundwater abstraction, contained waste liquids and actual direct receiving-medium releases. Inventory only evidenced chemical species/particle fractions with matching media and timing. Add actual route-specific contaminants, land changes, marine transfers and noise/habitat observations; unresolved identities or unmeasured potentially relevant releases are explicit gaps, not assumed absence."
      source_ids:
        - ifc-power-ehs-2007
        - eirgrid-submarine-2022
boundary_abstraction:
  declared_starting_condition: "Documented actual site/route baseline and existing assets before this delivery work, with separately supplied completed materials/equipment received at their stated gates"
  starting_condition_role: "Construction foreground start; existing condition and upstream receipts are not assumed burden-free"
  product_classification_scope: "Complete delivered long-distance communication/high-tension/railway-power lines and transmission stations/pylons; excludes local low-tension distribution"
  recursive_input_rule: "Record any in-category purchased/reused line section or station once with its source/interface and attributed prior burden; no recursive duplication of its construction"
  upstream_dataset_requirement: "Link each actual material/component production gate, packaging, external transport and waste treatment separately with representative records; retain unlinked gaps"
  disclosure: "Declare route branches, site, period, new/retained/replaced geometry, supply gate, actual work stages and tests, restoration, temporary/capital assets, allocation, environmental and lifecycle coverage, cutoffs and missing links"
