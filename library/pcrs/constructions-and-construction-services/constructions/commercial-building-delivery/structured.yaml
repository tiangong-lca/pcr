    - protocol_id: cp_utilities
      process_id: "site_utilities"
      flow_role: "row-specific actual exchange"
      record_type: "foreground_records"
      raw_fields: "Meter start/end, interval, unit, supplier geography/voltage, fuel receipts/remaining stock, fuel density, batch net calorific value, equipment duty"
      collection_method: "Use calibrated project submeters, fuel stock reconciliation and supplier/test calorific records; include temporary site accommodation, cranes, pumps, curing and tests; disclose offsite and hired-equipment inclusions"
      unit: "row-specific kg, m3, m2, MJ, item, t*km"
      frequency: "Each delivery, work-package event and meter interval; each handover"
      temporal_coverage: "Complete actual construction period through acceptance; retain start/end dates and unmetered intervals"
      site_scope: "Declared site and all subcontracted works attributed to this whole building"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, original tickets, drawings, signed inspections, uncertainty and reconciliation"
    - protocol_id: cp_environment
      process_id: "site_utilities"
      flow_role: "row-specific actual exchange"
      record_type: "foreground_records"
      raw_fields: "Substance/CAS, fossil origin, medium/submedium, particle size, concentration, flow rate, measured duration, equipment condition, water source and location"
      collection_method: "Use site-specific monitoring or fully documented applicable engine/operation models with actual activity. Require substance-resolved results; NOx-as-NO2 is not speciated NO2. Record dust controls, weather and moisture; direct abstraction uses calibrated intake meters. Record land occupation, dewatering, noise and other actual releases in separate evidence and additional atomic rows where quantified; unsupported categories remain explicit gaps"
      unit: "row-specific kg, m3, m2, MJ, item, t*km"
      frequency: "Each delivery, work-package event and meter interval; each handover"
      temporal_coverage: "Complete actual construction period through acceptance; retain start/end dates and unmetered intervals"
      site_scope: "Declared site and all subcontracted works attributed to this whole building"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, original tickets, drawings, signed inspections, uncertainty and reconciliation"
    - protocol_id: cp_waste
      process_id: "waste_management"
      flow_role: "row-specific actual exchange"
      record_type: "foreground_records"
      raw_fields: "Waste composition, segregation, wet/dry state, volume/mass, pH/solids for washout, destination, actual treatment and haulage"
      collection_method: "Use separate weighed transfer tickets and liquid tank/meter readings; verify receiver and treatment, distinguish internal recycled washwater, solid concrete, exported wastewater and any discharge constituents"
      unit: "row-specific kg, m3, m2, MJ, item, t*km"
      frequency: "Each delivery, work-package event and meter interval; each handover"
      temporal_coverage: "Complete actual construction period through acceptance; retain start/end dates and unmetered intervals"
      site_scope: "Declared site and all subcontracted works attributed to this whole building"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, original tickets, drawings, signed inspections, uncertainty and reconciliation"
    - protocol_id: cp_transport
      process_id: "delivery"
      flow_role: "row-specific actual exchange"
      record_type: "foreground_records"
      raw_fields: "Consignment identity, actual mass, origin/destination, each route distance, truck/load type, empty returns and supplier gate"
      collection_method: "Calculate leg-specific tonne-kilometres from real waybills, weighed loads and recorded route distance; preserve cargo allocation and loading assumptions, avoid repeating transport already in product data"
      unit: "row-specific kg, m3, m2, MJ, item, t*km"
      frequency: "Each delivery, work-package event and meter interval; each handover"
      temporal_coverage: "Complete actual construction period through acceptance; retain start/end dates and unmetered intervals"
      site_scope: "Declared site and all subcontracted works attributed to this whole building"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, original tickets, drawings, signed inspections, uncertainty and reconciliation"
    - protocol_id: cp_special
      process_id: "special_installation"
      flow_role: "use-specific installed atomic exchange"
      record_type: "foreground_records"
      raw_fields: "Equipment id, supplier gate, item count/mass, tank material/capacity, pipe composition/length, dock dimensions, containment, test activity/results, installation acceptance ; where supplied materials/assemblies occur: identity-specific gross receipts, opening/closing usable stock, verified returns/transfers, consumed damage/rejects/replacements and separate accepted installation"
      collection_method: "Inspect as-built schedules and supplier records; reconcile actual tank placement/backfill, pipe jointing, dispenser and containment installation to tests and signed handover. Preserve each component boundary and separately measured test energy/water/wastes; no generic design or local compliance certification inferred  For supplied material/assembly input quantities apply boundary_consumed_inputs, retaining failed/replacement consumption and separate acceptance/waste records; reusable-asset manufacture remains its separate conserved-share calculation."
      unit: "row-specific item, kg, m3, MJ"
      frequency: "Each installation and commissioning event"
      temporal_coverage: "Full actual construction period to handover"
      site_scope: "Declared whole building and attributable external station/terminal works"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Supplier specifications, test records, as-built inspection, measured uncertainty"
    - protocol_id: cp_acceptance
      process_id: "handover"
      flow_role: "row-specific actual exchange"
      record_type: "foreground_records"
      raw_fields: "Building/project id; site; actual commercial use; tenant zones; surveyed gross/internal/usable areas and definition; storeys, height, footprint; structural/envelope scope; installed systems and commissioned capacity; test and handover signatures"
      collection_method: "Inspect the completed whole building against as-built drawings, system commissioning and signed handover; confirm one delivered building, actual commercial use and surveyed gross/internal/usable areas; confirm station tank capacity, terminal function, warehouse storage or garage parking configuration where relevant. Collect testing water, energy, emissions and wastes under their respective site protocols"
      unit: "item; m2"
      frequency: "Each delivery, work-package event and meter interval; each handover"
      temporal_coverage: "Complete actual construction period through acceptance; retain start/end dates and unmetered intervals"
      site_scope: "Declared site and all subcontracted works attributed to this whole building"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, original tickets, drawings, signed inspections, uncertainty and reconciliation"
    - protocol_id: cp_joint
      process_id: "site_utilities"
      flow_role: "row-specific actual exchange"
      record_type: "foreground_records"
      raw_fields: "Asset id; manufacture boundary; full deployment history across projects/periods; evidenced lifetime service or justified forecast; current numerator; cumulative shares and remaining balance; sensitivity and later reconciliation"
      collection_method: "Subdivide and meter operation directly; maintain the full asset manufacturing-share ledger, verified denominator, period-assigned fraction and cumulative balance. Do not reset manufacture per period; unknown service denominator requires review."
      unit: "row-specific kg, m3, m2, MJ, item, t*km"
      frequency: "Each delivery, work-package event and meter interval; each handover"
      temporal_coverage: "Complete actual construction period through acceptance; retain start/end dates and unmetered intervals"
      site_scope: "Declared site and all subcontracted works attributed to this whole building"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, original tickets, drawings, signed inspections, uncertainty and reconciliation"
  calculation_rules:
    - id: project_reconciliation
      applies_to: "all inventory rows"
      rule: "Retain directly attributable totals per declared reference flow in the row unit. Reconcile receipts, returns, remaining stock, installed amounts and exported wastes for each identified product; disclose internal recirculation and test consumption. No default yield, waste fraction or area-to-mass factor.  Apply boundary_consumed_inputs to permanent/consumed supplied materials and assemblies, including pre-acceptance losses and replacements in each actual native unit; installed acceptance is not the consumption numerator. Keep reusable-asset manufacture under the separate cumulative-share ledger."
      inputs:
        - cp_site
        - cp_structure
        - cp_envelope
        - cp_fitout
        - cp_utilities
        - cp_waste
        - cp_special
        - cp_acceptance
      output: "documented exchange total per declared reference flow"
      source_ids:
        - jrc-levels-boq-2021
    - id: unit_preservation
      applies_to: "lv_electricity; mv_electricity; site_diesel; road_freight"
      rule: "Preserve reference quantity of one building; apply energy_identity and transport_basis to numerator units only. Keep raw values and conversion evidence with the dataset. Area per building may be reported as supplemental information, not silently substituted for this reference."
      inputs:
        - cp_utilities
        - cp_transport
      output: "MJ or t*km per declared reference flow"
      source_ids: []
  data_quality_requirements:
    - id: physical_completeness
      applies_to: "dataset"
      requirement: "Whole-building identity, actual area and delivery systems must agree with drawings and handover. Missing fixed services or external works must be named and their effect disclosed; representative route rows alone are insufficient."
      evidence: "cp_acceptance; jrc-levels-boq-2021"
    - id: measurement_quality
      applies_to: "all inventory rows"
      requirement: "Retain calibrated readings, traceable supply and waste records, uncertainty, date and exact gate. Estimates must identify method, applicability and sensitivity; missing or unmeasured is never numeric zero."
      evidence: "all collection protocols"
    - id: environment_scope
      applies_to: "site_utilities"
      requirement: "Require CAS/chemical identity, fossil/biogenic origin, immediate/long-term and medium/submedium compatibility. Quantify only occurring emissions, review NO/NO2 separately, and disclose missing PM fractions, water discharge constituents, land and noise coverage."
      evidence: "cp_environment"
    - id: source_compatibility
      applies_to: "upstream links"
      requirement: "Match technology, geography, actual product grade, moisture/state and unit. Preserve public UUID reference properties and underlying unit groups; unresolved exact identities remain blank until verified."
      evidence: "supplier records; identity and unit evidence"
validation_rules:
  - rule_id: commercial_system_completeness
    applies_to: "dataset"
    rule: "Reconcile supplied and installed work packages: warehouse fixed racks/loading, retail escalators and delivered shop fit-out, office services, terminal fixed passenger/baggage equipment, garage ventilation/drainage, and station tank/piping/detection/containment are included only as actually delivered. Add every actual chiller, fan, pump, valve, sprinkler head, distribution/security/communication unit, sanitary fitting, fixing, adhesive and protective layer as a separate product-specific atomic row only when separately procured or fabricated within the foreground boundary. For components already included in a complete supplied unit, such as an air-handling-unit fan or fuel-dispenser pump, verify specifications and supplier inventory coverage without a duplicate component exchange or upstream manufacturing burden. Retain actual installation activities and separately supplied replacements or additions. Missing actual systems prevents a completeness claim; operational vehicles, merchandise and sold fuel are excluded."
    source_ids:
      - jrc-levels-boq-2021
      - un-cpc-3-53122
      - epa-ust-installation
  - rule_id: validate_scope
    applies_to: "dataset"
    rule: "Reject missing commercial use, site/geometry/delivery condition, inappropriate category, material-bundle substitution or construction-service reference. Require whole-building acceptance and every required qualifier."
    source_ids:
      - un-cpc-3-53122
  - rule_id: validate_inventory
    applies_to: "all inventory rows"
    rule: "Check one physical or chemical identity per exchange, row-specific unit, route applicability, project denominator, every linked protocol and bilateral consistency. Sum stage utilities/wastes to actual records; unresolved identities are gaps rather than permission to select a near name."
    source_ids: []
  - rule_id: validate_stage_claim
    applies_to: "dataset"
    rule: "Verify A1–A3 data links, A4 transport and A5 actual work before claiming their coverage. Omitted use, replacement, demolition and recovery forbid full-lifetime claims; later scenarios require new source-supported durations and routes. Do not imply scientific or regulatory approval from acceptance of a PCR projection."
    source_ids:
      - rics-wlca-2024
  - rule_id: validate_environment
    applies_to: "site_utilities"
    rule: "Require a documented direct-release basis and no overlap with combustion/waste-treatment background datasets. Check NO speciation, PM fractions, fossil carbon and water routing; unresolved required measurements prevent a complete dataset claim."
    source_ids:
      - epa-construction-dust-2010
      - epa-concrete-washout-2012
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Construction-and-delivery inventory of the declared whole building; upstream linking only with verified compatible gates; comparison only under matching commercial function, measured geometry, delivery systems, performance and boundary"
  excluded_use: "Full-lifetime claim, default service-year performance, representative national material recipe, legal/occupancy approval, construction-service footprint, blanket kg or m2 conversion"
  required_metadata: "All reference qualifiers; stage-coded site/contractor records; actual delivery scope; area method; supplier gates; allocation; declared count/property/unit references"
  required_quality_disclosure: "Temporal/geographic/technology representativeness, missing upstream data, unresolved identities, measurements/estimates, unmetered periods, environmental gaps, later lifecycle exclusions and scientific-review state"
  update_trigger: "Changes to commercial use, tenant configuration, structural system, site, actual size, delivered fit-out, supply chain, measured inventory or evidence/identity status"
data_sources:
  - id: "un-cpc-3-53122"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 Explanatory Notes, 30 June 2025, PDF/printed p.278, subclass 53122; adjacent 53121 p.277 and 53129/532 p.278. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Full commercial building classification and distinction from residential/industrial, other non-residential and civil-engineering products; no construction recipe."
  - id: "jrc-levels-boq-2021"
    type: "official_guidance"
    reference: "European Commission JRC, Level(s) indicator 2.1, publication v1.1, January 2021, printed/PDF pp.16 and 23–24, Table 2. https://susproc.jrc.ec.europa.eu/product-bureau/sites/default/files/2021-01/UM3_Indicator_2.1_v1.1_34pp.pdf"
    used_for: "Building element coverage and as-built quantity evidence; no numerical material footprint or lifespan adopted."
  - id: "rics-wlca-2024"
    type: "standard"
    reference: "RICS, Whole life carbon assessment for the built environment, 2nd edition, version 3 August 2024, sections 2.1, 4.5 and 5.1.4, printed pp.18–20,45–47,80–84. https://www.rics.org/content/dam/ricsglobal/documents/standards/Whole_life_carbon_assessment_PS_Sept23.pdf."
    used_for: "Lifecycle stage separation and actual construction evidence; limited guidance use, no claim of full RICS WLCA compliance or use of its default rates."
  - id: "epa-construction-dust-2010"
    type: "official_guidance"
    reference: "US EPA AP-42 section 13.2.3 Heavy Construction Operations, January 1995 corrected February 2010, printed p.13.2.3-1. https://www.epa.gov/sites/default/files/2020-10/documents/13.2.3_heavy_construction_operations.pdf"
    used_for: "Historical qualitative relationship of operations, moisture and dust only; not a current generic emission factor."
  - id: "epa-concrete-washout-2012"
    type: "official_guidance"
    reference: "US EPA Stormwater Best Management Practice Concrete Washout, EPA-833-F-11-006 February 2012, PDF pp.1–2. https://www.epa.gov/sites/default/files/2015-11/documents/concretewashout_0.pdf"
    used_for: "Washout liquid/solids routing distinction; no local permit or assumed discharge."
  - id: "ghg-allocation-2011"
    type: "official_guidance"
    reference: "WRI/WBCSD Product Life Cycle Accounting and Reporting Standard 2011, chapter 9, printed p.63 / PDF p.65, Tables 9.1–9.2. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Historical allocation hierarchy; actual site causal relations still require evidence."
  - id: "epa-ust-installation"
    type: "official_guidance"
    reference: "US EPA, Resources for UST Owners and Operators, Tank and Piping Installation section. https://www.epa.gov/ust/resources-ust-owners-and-operators"
    used_for: "Qualitative installation activities: excavation, siting, assembly, backfill, grading, tank/piping/dispenser containment and installation verification. US jurisdiction conditions are not imposed as universal design or local legal approval; actual manufacturer and site instructions govern."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:d65876a13e9e4ab6e638ebf2c7bcdfcb3c5c59871980a5bd3f20d41a0cb9b441"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6932"
      family: "system_boundary"
      span:
        start:
          offset: 6932
          line: 60
          column: 1
        end:
          offset: 10962
          line: 81
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Recorded site at construction commencement and externally supplied product gates; include actual site clearance and temporary works where they occur |\n| starting_condition_role | foreground_start |\n| product_classification_scope | Delivered physical commercial building entity |\n| recursive_input_rule | A reused same-category building or retained structure is an explicitly identified pre-existing input with declared burdens and condition, never silently expanded into a duplicate building output |\n| upstream_dataset_requirement | Link each actual supplied atomic product to compatible manufacture data with geography, technology, units and included transport/waste gates; disclose every missing upstream dataset |\n| disclosure | State actual site, delivery specification, A4/A5 process coverage, A1–A3 linkage, temporary facilities, outsourced works, exclusions and later-stage omissions |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| commercial_entity_boundary | dataset | Separate independent civil-engineering networks, runway/road works and multi-building shared works from the delivered building register. Include attributable forecourt/garage works, fixed fuel installations and loading interfaces when actually delivered; identify tenant-installed works after handover as excluded later fit-out. Shell-only state, mixed uses and existing retained elements must be explicit, not hidden as complete fitted commercial delivery. | un-cpc-3-53122; jrc-levels-boq-2021; epa-ust-installation |\n| boundary_delivery | all inventory rows | Include the actual foundation, structure, enclosure, specified fixed installations, construction/testing utilities and wastes up to acceptance. Process headings partition activities, not partial products. Enumerate each additional installed product and actually occurring exchange as its own row; listed route alternatives are not interchangeable placeholders. | jrc-levels-boq-2021; rics-wlca-2024 |\n| boundary_consumed_inputs | permanent/consumed supplied materials and assemblies; excludes reusable-asset manufacture | Local installed, delivered, commissioned or as-built wording specifies the intended route/configuration and acceptance evidence; it does not exclude attributable materials or assemblies consumed in attempted installation, damage, rejected-and-scrapped work or replacements before acceptance. In each native unit, consumed input = attributable gross receipts + opening stock - verified returns/transfers - closing usable stock. Retain actual supplied identity/configuration and assembly inclusions, with failed/replaced items traced to their own identity rather than the final replacement identity. Reconcile accepted installation and waste separately. Verified returns/usable surplus are excluded from consumption, but their attributable transport/handling/rework remains. This equation does not measure reusable equipment/formwork manufacture: retain section 7 conserved lifetime-use shares even when assets are returned/transferred/held in closing stock, and never charge the same asset as both full consumption and a use share. |  |\n| boundary_stages | dataset | Keep material manufacture, inbound transport, site installation, maintenance/replacement, operation, final demolition and waste destinations separately identifiable. A4 and A5 foreground does not establish full A1–A5 or whole-life coverage. Actual initial demolition/clearance and its waste must be inventoried separately when present. | rics-wlca-2024 |\n| boundary_double_count | site_utilities | Report purchased utility inputs and direct site emissions separately. Onsite diesel combustion is added only if the chosen background fuel dataset ends before combustion; no duplicated upstream emissions. Abstracted resources, dewatering transfers, returned water and exported liquid wastes have distinct routing. | rics-wlca-2024; epa-concrete-washout-2012 |\n\n"
