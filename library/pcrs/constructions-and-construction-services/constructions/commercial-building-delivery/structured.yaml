      record_type: "foreground_records"
      raw_fields: "Roof/wall build-up; each layer quantity and unit; glass area, frame mass, thickness, density, door count and wastage ; where supplied materials/assemblies occur: identity-specific gross receipts, opening/closing usable stock, verified returns/transfers, consumed damage/rejects/replacements and separate accepted installation"
      collection_method: "Survey installed dimensions and reconcile measured receipts/returns with as-built schedules; do not infer insulation mass from an assumed density  For supplied material/assembly input quantities apply boundary_consumed_inputs, retaining failed/replacement consumption and separate acceptance/waste records; reusable-asset manufacture remains its separate conserved-share calculation."
      unit: "row-specific kg, m3, m2, MJ, item, t*km"
