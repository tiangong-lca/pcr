      collection_method: "Reconcile as-built drawings and work-package issue/return sheets to supplier tickets; use actual ready-mix volume and measured reinforcement/timber mass; retain curing, pumping, lifting and temporary works records  For supplied material/assembly input quantities apply boundary_consumed_inputs, retaining failed/replacement consumption and separate acceptance/waste records; reusable-asset manufacture remains its separate conserved-share calculation."
      unit: "row-specific kg, m3, m2, MJ, item, t*km"
      frequency: "Each delivery, work-package event and meter interval; each handover"
      temporal_coverage: "Complete actual construction period through acceptance; retain start/end dates and unmetered intervals"
