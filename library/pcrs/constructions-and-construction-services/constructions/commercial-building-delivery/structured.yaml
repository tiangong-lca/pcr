product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.constructions.commercial-building-delivery"
  classification_refs: "CPC 3.0 53122"
  covered_products: "Completed commercial building entities of all listed uses; actual delivered shell, core and attributable external works"
  excluded_products: "Residential and industrial/agricultural buildings; hotels, restaurants, schools and other CPC 53129 uses; independent roads, tracks, runways, bridges and civil-engineering networks; loose materials; design/construction services; operation-only services"
  representative_product: "One complete building at declared commercial function, surveyed geometry and signed delivery state; not an average national building"
  production_route: "Actual site preparation, substructure, structural system, enclosure, fit-out/fixed systems, use-specific installations and tests; prefabricated components retain their supplier manufacturing gate"
  market_state: "Immovable constructed asset at declared shell/core/fit-out handover condition"
functional_unit:
  what: "Provide a delivered commercial building for its identified trade, storage, office, exhibition, terminal, parking or station function"
  how_much: "One whole building; declare measured gross/internal/usable areas with method, footprint, storeys, height and actual geometry; function-specific installed capacities and tenant/parking/loading configurations"
  how_well: "Actual structure, enclosure, delivered systems, specified performance and commissioning/acceptance evidence; shell-only handover is not a fully fitted building; do not infer compliance approval"
  how_long_or_cycle: "One construction-and-acceptance cycle; no universal lifetime. Later use-period comparisons need independently supported duration, maintenance and operation scenarios"
  reference_flow_link: "reference_building"
system_boundary:
  rules:
    - rule_id: commercial_entity_boundary
      applies_to: "dataset"
      rule: "Separate independent civil-engineering networks, runway/road works and multi-building shared works from the delivered building register. Include attributable forecourt/garage works, fixed fuel installations and loading interfaces when actually delivered; identify tenant-installed works after handover as excluded later fit-out. Shell-only state, mixed uses and existing retained elements must be explicit, not hidden as complete fitted commercial delivery."
      source_ids:
        - un-cpc-3-53122
        - jrc-levels-boq-2021
        - epa-ust-installation
    - rule_id: boundary_delivery
      applies_to: "all inventory rows"
      rule: "Include the actual foundation, structure, enclosure, specified fixed installations, construction/testing utilities and wastes up to acceptance. Process headings partition activities, not partial products. Enumerate each additional installed product and actually occurring exchange as its own row; listed route alternatives are not interchangeable placeholders."
      source_ids:
        - jrc-levels-boq-2021
        - rics-wlca-2024
    - rule_id: boundary_consumed_inputs
      applies_to: "permanent/consumed supplied materials and assemblies; excludes reusable-asset manufacture"
      rule: "Local installed, delivered, commissioned or as-built wording specifies the intended route/configuration and acceptance evidence; it does not exclude attributable materials or assemblies consumed in attempted installation, damage, rejected-and-scrapped work or replacements before acceptance. In each native unit, consumed input = attributable gross receipts + opening stock - verified returns/transfers - closing usable stock. Retain actual supplied identity/configuration and assembly inclusions, with failed/replaced items traced to their own identity rather than the final replacement identity. Reconcile accepted installation and waste separately. Verified returns/usable surplus are excluded from consumption, but their attributable transport/handling/rework remains. This equation does not measure reusable equipment/formwork manufacture: retain section 7 conserved lifetime-use shares even when assets are returned/transferred/held in closing stock, and never charge the same asset as both full consumption and a use share."
      source_ids: []
    - rule_id: boundary_stages
      applies_to: "dataset"
      rule: "Keep material manufacture, inbound transport, site installation, maintenance/replacement, operation, final demolition and waste destinations separately identifiable. A4 and A5 foreground does not establish full A1–A5 or whole-life coverage. Actual initial demolition/clearance and its waste must be inventoried separately when present."
      source_ids:
        - rics-wlca-2024
    - rule_id: boundary_double_count
      applies_to: "site_utilities"
      rule: "Report purchased utility inputs and direct site emissions separately. Onsite diesel combustion is added only if the chosen background fuel dataset ends before combustion; no duplicated upstream emissions. Abstracted resources, dewatering transfers, returned water and exported liquid wastes have distinct routing."
      source_ids:
        - rics-wlca-2024
        - epa-concrete-washout-2012
boundary_abstraction:
  declared_starting_condition: "Recorded site at construction commencement and externally supplied product gates; include actual site clearance and temporary works where they occur"
  starting_condition_role: "foreground_start"
  product_classification_scope: "Delivered physical commercial building entity"
  recursive_input_rule: "A reused same-category building or retained structure is an explicitly identified pre-existing input with declared burdens and condition, never silently expanded into a duplicate building output"
  upstream_dataset_requirement: "Link each actual supplied atomic product to compatible manufacture data with geography, technology, units and included transport/waste gates; disclose every missing upstream dataset"
  disclosure: "State actual site, delivery specification, A4/A5 process coverage, A1–A3 linkage, temporary facilities, outsourced works, exclusions and later-stage omissions"
