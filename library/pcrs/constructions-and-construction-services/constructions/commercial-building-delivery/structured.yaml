allocation_rules:
  - rule_id: attribution
    applies_to: "shared site activities"
    rule: "Use dedicated project metering and work-package subdivision first. If works serve multiple buildings, document measured machine time, material issue or another causal driver, the full receiving population and idle load under cp_joint. Area or price share is not a default physical relation."
    source_ids:
      - ghg-allocation-2011
  - rule_id: actual_coproduct
    applies_to: "exported useful outputs"
    rule: "Separate sold products, reused soil and wastes by actual status and destination. Avoid allocation by subdivision; remaining co-products require justified physical relations, or documented alternative allocation and sensitivity when physical relations cannot be established. No automatic avoided-material credit is assigned."
    source_ids:
      - ghg-allocation-2011
  - rule_id: temporary_reuse
    applies_to: "temporary works"
    rule: "Retain construction burdens and rejected/reworked materials for this accepted building. Record temporary-panel equipment sharing from actual deployment and reuse logs with future reuse uncertainty; do not invent lifetime or reuse count. Report waste treatment and recovery beyond this gate separately."
    source_ids:
      - rics-wlca-2024
  - rule_id: asset_share_conservation
    applies_to: "reusable formwork, components and equipment"
    rule: "Maintain one asset-level manufacturing-burden ledger across all projects and periods. A measured project use-time or deployment is only the numerator; the denominator must represent evidenced total lifetime service or a justified forecast with sensitivity and later reconciliation. Cumulative manufacturing shares across all projects and periods must not exceed one. An observation-period allocation may distribute only the manufacturing share already attributable to that period; never reintroduce the whole asset manufacture at each period. Unknown lifetime/service denominators remain unresolved review, not a default. Include asset manufacture when material; a hire invoice alone does not establish lifecycle coverage."
    source_ids:
      - ghg-allocation-2011
      - rics-wlca-2024
dataset_production:
  collection_protocols:
    - protocol_id: cp_site
      process_id: "site"
      flow_role: "row-specific actual exchange"
      record_type: "foreground_records"
      raw_fields: "Excavation volume, soil state, grading, site condition and imported fill weights ; where supplied materials/assemblies occur: identity-specific gross receipts, opening/closing usable stock, verified returns/transfers, consumed damage/rejects/replacements and separate accepted installation"
      collection_method: "Survey before/after work and retain calibrated weighbridge/delivery records, contamination tests and destination tickets; record original and loose volumes separately  For supplied material/assembly input quantities apply boundary_consumed_inputs, retaining failed/replacement consumption and separate acceptance/waste records; reusable-asset manufacture remains its separate conserved-share calculation."
      unit: "row-specific kg, m3, m2, MJ, item, t*km"
      frequency: "Each delivery, work-package event and meter interval; each handover"
      temporal_coverage: "Complete actual construction period through acceptance; retain start/end dates and unmetered intervals"
      site_scope: "Declared site and all subcontracted works attributed to this whole building"
