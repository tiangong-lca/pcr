      flow_role: "row-specific actual exchange"
      record_type: "foreground_records"
      raw_fields: "Each fixed installation, product state, area/mass/count, model, capacity, refrigerant charge and commissioning record ; where supplied materials/assemblies occur: identity-specific gross receipts, opening/closing usable stock, verified returns/transfers, consumed damage/rejects/replacements and separate accepted installation"
      collection_method: "Use measured issue/return quantities, installed schedules and commissioning evidence; separately enumerate fittings, adhesives, fixings, ductwork and electrical protection where actually used  For supplied material/assembly input quantities apply boundary_consumed_inputs, retaining failed/replacement consumption and separate acceptance/waste records; reusable-asset manufacture remains its separate conserved-share calculation."
      unit: "row-specific kg, m3, m2, MJ, item, t*km"
      frequency: "Each delivery, work-package event and meter interval; each handover"
      temporal_coverage: "Complete actual construction period through acceptance; retain start/end dates and unmetered intervals"
