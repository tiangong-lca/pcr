  limitations:
    - Candidate methodology, scientific and unit review pending; no publication
      or methodology approval.
    - The method covers commercial-building delivery, not only retail fit-out;
      actual routes and use-specific systems require complete as-built
      work-package inventory.
    - No default lifetime, recipe, loss, emission factor, load, building mass or
      compliance approval is adopted.
    - Listed atomic rows are conditional examples; every actual exchange must be
      enumerated and every excluded delivered scope disclosed.
