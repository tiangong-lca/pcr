  unresolved_flow_identities:
    - row_id: granular_fill
      flow_name: Crushed stone for foundation subbase
      reason: Actual graded crushed stone foundation input is not specified as 16/32;
        broad aggregate candidates do not establish the delivered supplier
        grading. Retain precise physical row and verify supplier grade before
        binding. Bounded searches do not establish database nonexistence.
    - row_id: soil_export
      flow_name: Non-contaminated excavated mineral soil for off-site disposal
      reason: Excavated mineral soil leaving as waste is not a generic soil product or
        a hydrocarbon-remediation product. Actual contamination, volume state
        and disposal identity remain unresolved. Bounded searches do not
        establish database nonexistence.
    - row_id: ready_mix
      flow_name: Ready-mixed concrete delivered before placing
      reason: Reviewed public candidate is cast-in-place concrete rather than
        ready-mix before placing. Preserve m3 supplied-state row; actual mixture
        designation and supplier gate are needed. Bounded searches do not
        establish database nonexistence.
    - row_id: steel_member
      flow_name: Fabricated structural steel beam
      reason: Reviewed structural steel candidates include mixed rebar/angle steel and
        generic stock, not the fabricated beam at its coating/fabrication gate.
        Bounded searches do not establish database nonexistence.
    - row_id: masonry_mortar
      flow_name: Cement-sand masonry mortar
      reason: Generic mortar composition does not establish the actual supplied
        cement-sand formulation; no assumed sand percentage adopted. Bounded
        searches do not establish database nonexistence.
    - row_id: plywood_formwork
      flow_name: Plywood formwork panel
      reason: Area panel identity requires actual thickness, composition, density and
        reuse-state conversion. Generic plywood mass/volume does not alone bind
        this area row. Bounded searches do not establish database nonexistence.
    - row_id: window_frame
      flow_name: Finished aluminium window frame
      reason: Glazing internal spacers and photovoltaic frames are not the external
        finished window frame. No exact applicable assembly identity
        established. Bounded searches do not establish database nonexistence.
    - row_id: acrylic_paint
      flow_name: Waterborne acrylic architectural paint
      reason: Generic/artist water-based paint or UV coating does not establish the
        specified waterborne acrylic architectural formulation. Bounded searches
        do not establish database nonexistence.
    - row_id: copper_cable
      flow_name: Insulated copper low-voltage building cable
      reason: Candidate heat-content reference cannot be renamed Mass. Actual
        insulation/conductor composition, supply state and supported property
        conversion remain unresolved. Bounded searches do not establish database
        nonexistence.
    - row_id: supplied_water
      flow_name: Treated mains water supplied to site
      reason: Supply geography, treatment and volume/mass reference must match actual
        site. Generic resource water and geographically specific tap-water
        products do not establish this unspecified site supply. Bounded searches
        do not establish database nonexistence.
    - row_id: concrete_waste
      flow_name: Hardened concrete construction offcut
      reason: Mixed construction waste and concrete product identities do not
        establish segregated hardened concrete offcut waste. Bounded searches do
        not establish database nonexistence.
    - row_id: timber_waste
      flow_name: Untreated sawn timber offcut
      reason: Sawmill/primary-production wood waste does not establish untreated
        construction sawn-member offcuts and destination. Bounded searches do
        not establish database nonexistence.
    - row_id: gypsum_waste
      flow_name: Gypsum plasterboard offcut
      reason: Product plasterboard or mixed construction waste does not establish
        segregated onsite gypsum plasterboard offcut waste. Bounded searches do
        not establish database nonexistence.
    - row_id: carton_waste
      flow_name: Corrugated cardboard packaging waste
      reason: Packaging-production trim/rejects and generic waste paper do not
        establish removed corrugated-cardboard packaging at the site. Bounded
        searches do not establish database nonexistence.
    - row_id: film_waste
      flow_name: Polyethylene packaging film waste
      reason: Polyethylene film product is not the discarded waste-film exchange;
        actual polymer, contamination and receiving route require verification.
        Bounded searches do not establish database nonexistence.
    - row_id: concrete_washwater
      flow_name: Contained concrete-chute washwater for off-site treatment
      reason: Generic wastewater does not establish captured concrete-chute washwater.
        Specific manganese-slag washing wastewater is inapplicable; actual
        suspended solids/pH and offsite receiver are needed. Bounded searches do
        not establish database nonexistence.
    - row_id: reference_building
      flow_name: Completed commercial building
      reason: Public commercial-building candidate
        88e0df46-375e-4cac-80e6-3cf781f63625 has Mass main property and an
        at-plant scope. Actual complete-building quantities and a supported
        mass/count and gate relationship are not established. Preserve the
        functional 1 item building reference and blank UUID; a different
        property alone does not prove permanent identity unsuitability.
    - row_id: passenger_lift
      flow_name: Complete passenger lift installation
      reason: Bounded 30-candidate search and public direct-read comparisons do not
        establish this exact installed/waste state, assembly scope and
        reference-property relationship. Retain the specified atomic row with
        blank UUID; no database nonexistence assertion. Actual supplier identity
        and any unit conversion need foreground evidence.
