  classification_refs: "CPC 3.0 53213"
  covered_products: "Runways, taxiways, aprons and related non-building airport structures; actual paved/unpaved routes and handover scope"
  excluded_products: "Airport buildings; standalone material/equipment manufacture; general construction services; operational maintenance services; aircraft and airport transport operation"
  representative_product: "Airfield pavement works with surveyed area, actual use and signed handover condition"
  production_route: "Actual earthworks/compaction, subgrade and layers, corresponding surface construction, specified associated works, inspection/corrections and acceptance"
  market_state: "Immovable constructed civil entity at the site and declared delivery condition"
functional_unit:
  what: "Provide physical airfield pavement and attributable associated works for the declared aircraft landing/take-off, taxiing or standing use"
  how_much: "1 m2 accepted horizontal plan area; declare whole package area, use zones, lengths/widths, thickness of each layer and associated work quantities"
  how_well: "Actual structure, subgrade, load/aircraft-use requirements, surface, drainage and installed configuration; retain design and lot tests for smoothness, thickness, compaction or strength, joints and applicable acceptance specifications"
  how_long_or_cycle: "One actual construction-to-handover cycle; no assumed service life. Service-period comparisons need separately supported use, maintenance and renewal scenarios"
  reference_flow_link: "reference_airfield"
system_boundary:
  rules:
    - rule_id: boundary_delivery
      applies_to: "dataset"
      rule: "Record actual earthworks, layers, drainage, marking/grooving, lighting and tests/handover by process. Listed materials are not a universal complete recipe; individually add every additional actual material, packaging, lubricant, planting input, ancillary and temporary work exchange, documenting absent processes."
      source_ids:
        - faa-airport-construction-2018
    - rule_id: boundary_consumed_inputs
      applies_to: "purchased consumable/permanently supplied product inputs in all selected or actually attempted construction routes; reusable-asset manufacture excluded"
      rule: "Input amounts include all actual attributable consumption, including pre-installation damage, rejected loads, cutting/application losses and replacements before handover. This is an explicit exception to local installed/applied/used wording: that wording identifies the intended route and configuration, not a successful-installation-only numerator. Reconcile native-unit input = gross attributable receipts + opening stock - verified returns/transfers - closing reusable stock; retain installed accepted quantities and actual waste separately. Keep supplied identity/state and assembly boundaries exact; do not duplicate internal constituents or reusable-asset manufacture.  This stock-consumption equation does not apply to reusable equipment or plywood-panel manufacturing shares under cp_assets/cp_formwork_assets. Those rows retain their supported cumulative-use manufacture attribution under allocation_assets/asset_share even if the physical asset is returned, transferred or held in reusable closing stock; physical stock movements remain separate and cannot cancel the current use share."
      source_ids: []
    - rule_id: boundary_stages
      applies_to: "dataset"
      rule: "Link manufacture and transport separately; paving does not represent material production. Operating electricity, aircraft, post-handover maintenance/replacement, final demolition and destinations are excluded; separately model those stages only with real scenarios and redeclared scope."
      source_ids:
        - fhwa-pavement-lca-2016
    - rule_id: boundary_environment
      applies_to: "utilities; waste"
      rule: "Include actual utilities and evidenced direct releases, distinguishing fuel supply/combustion, purchased water/resource abstraction, dewatering transfer/discharge, liquid waste/settled solids. Retain actual equipment, duration, location and measurements for noise without inventing default sound-energy exchanges; any evidenced emissions are separate exact substances and media."
      source_ids:
        - epa-construction-dust-1995
        - epa-concrete-washout-2012
boundary_abstraction:
  declared_starting_condition: "Actual pre-construction site, retained assets and external supply product gates"
  starting_condition_role: "foreground_start"
  product_classification_scope: "Airfield pavement and related non-building entity; use and delivery scope explicitly declared"
