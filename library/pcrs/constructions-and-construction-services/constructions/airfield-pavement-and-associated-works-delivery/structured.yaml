allocation_rules:
  - rule_id: allocation_project
    applies_to: "all inventory rows"
    rule: "First partition airport work using submeters, weights, equipment time, actual zones and lots; direct attribution precedes allocation. Shared activities use measured causal physical drivers, preserving all beneficiary projects and denominator with shares summing to one. Area normalizes the reference within a consistent use/structure package; it is not a default allocation among heterogeneous works."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "plywood_form; utilities"
    rule: "Use cp_assets / cp_formwork_assets to record each asset/component manufacture burden, project/period activity and supported cumulative service. Across projects, periods and repeated uses, total manufacture shares of the same asset cannot exceed one. Unknown life/cumulative activity remains a review and completeness gap, never reset per project."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "waste"
    rule: "Construction waste, reused pavement and exported millings do not automatically earn credits. Document actual treatment/recovery gates, quality and receiver. Any substitution benefit or recycling allocation needs a declared sourced method and sensitivity, without simultaneously claiming avoided manufacture and zero burden."
    source_ids:
      - fhwa-pavement-lca-2016
