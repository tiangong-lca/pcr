      collection_method: "Read panel manufacture and deployment/stock ledgers with cp_rigid; distinguish actual panel stock area from repeated deployed area, apply supported cumulative-use shares to stock manufacture area, and reconcile the same asset ledger with cp_assets. Retain actual process ID rigid; unknown life or stock remains a gap, not a default share."
      unit: "dimensionless shares and source units"
      frequency: "Each deployment and period closure"
      temporal_coverage: "All prior usage periods and supported service total"
