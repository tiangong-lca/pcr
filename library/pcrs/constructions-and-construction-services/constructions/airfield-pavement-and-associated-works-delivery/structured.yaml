measurement_rules:
  - id: reference_area
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Use cp_handover to measure accepted plan area; collect every inventory row per declared reference flow. Divide attributable work totals by accepted area of the same scope, preserving totals, attribution and denominator; never sum layer areas as extra output."
  - id: energy_units
    applies_to: "cn_lv; cn_mv"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the public Net calorific value property and energy unit group. Convert metered kWh using the unit-group relation 3.6 MJ/kWh; never relabel this property as Mass."
  - id: material_state
    applies_to: "fresh_concrete; topsoil; supplied_water; washout_liquid"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Record physical state and measured volume. Volume-to-mass conversion needs measured density of the same material state and batch; excavated, loose and compacted soil volumes are not equal by assumption."
  - id: asset_area
    applies_to: "auxiliary installed/deployed geometry linked to plywood_form; pp_geotextile; grass_sod"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Measure installed/deployed geometry, thickness, composition and areal mass as auxiliary records; it does not replace the native inventory numerator. Purchased fabric/sod uses actual attributable consumed area including losses, reconciled to receipts, returns and stock. Reusable formwork manufacture uses panel stock area times the conserved manufacture share under cp_formwork_assets, not repeated deployed area as new manufacture. Never change a public Mass property to Area by name similarity."
  - id: transport_units
    applies_to: "road_freight"
    required_property_ref:
      name: "mass*distance"
      uuid: "118f2a40-50ec-457c-aa60-9bc6b6af9931"
    required_unit: "t*km"
    rule: "Preserve public mass*distance with group reference kg*km; 1 t*km = 1000 kg*km. Use actual consignment mass and distance without assumed distance or load."
