  calculation_rules:
    - id: normalize_area
      applies_to: "all inventory rows"
      rule: "Divide each attributable exchange total of the consistent use/structure package by actual accepted plan area in m2 from cp_handover, yielding amounts per declared reference flow; output is fixed at 1 m2. Preserve original totals and survey denominator, never substituting layer area or cost."
      inputs:
        - cp_handover
        - "project exchange records"
      output: "Exchange amounts per declared reference flow"
      source_ids: []
    - id: preserve_units
      applies_to: "all inventory rows"
      rule: "Convert same-dimension units using declared unit groups; mass/volume conversion uses actual same-batch density only, and electricity kWh to MJ multiplies by 3.6. Preserve raw measurements and uncertainty."
      inputs:
        - cp_utilities
        - cp_transport
        - "supplier records"
      output: "Row-unit quantities"
      source_ids: []
    - id: direct_emissions
      applies_to: "utilities"
      rule: "Calculate each species release from actual measurement or validated methods applicable to the particular plant/fuel/controls, preserving original method units and attribution. Fossil carbon balance uses actual fuel carbon and combustion evidence; no default factors or NOx split, and no addition of dust totals to their fractions."
      inputs:
        - cp_utilities
        - "site measurements"
        - "applicable method evidence"
      output: "kg of each exact species"
      source_ids:
        - epa-construction-dust-1995
    - id: asset_share
      applies_to: "plywood_form; utilities"
      rule: "Apply the actual project share of supported cumulative activity to manufacturing burden, then normalize by the same package area. The cumulative ledger proves all assigned shares are no greater than one; unknown denominators remain review without a numeric result."
      inputs:
        - "cp_assets / cp_formwork_assets"
        - cp_handover
      output: "Attributable manufacture burden per declared reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_scope
      applies_to: "dataset"
      requirement: "Preserve surveyed area and complete configuration by use, layer structure and acceptance scope; equal area does not establish equal load/use function."
      evidence: "cp_handover; faa-airport-construction-2018"
    - id: quality_records
      applies_to: "all inventory rows"
      requirement: "Retain whole-period records, calibration, rejections/corrections and subcontracting; reconcile net receipts, installed work and waste. Missing records preclude complete data claims; no default losses fill gaps."
      evidence: "cp_site; cp_base; cp_flexible; cp_rigid; cp_waste"
    - id: quality_environment
      applies_to: "utilities; waste"
      requirement: "Require evidence for water routes, particle fractions, release media and fossil origin. Historical AP-42 aggregate factors are not airport-site defaults; ambient monitoring concentrations do not directly establish project emission mass."
      evidence: "cp_utilities; epa-construction-dust-1995; epa-concrete-washout-2012"
    - id: quality_gaps
      applies_to: "dataset"
      requirement: "Disclose unresolved UUIDs, missing upstream coverage, unmetered intervals, asset-manufacture share gaps, method applicability and scientific review status."
      evidence: "cp_assets / cp_formwork_assets; supplier records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference_airfield"
    rule: "Check 1 m2 output, Area property, surveyed area, delivery completeness and qualifiers; all rows/protocols share the same package denominator. Missing survey/attribution evidence or overlapping area makes data incomplete."
    source_ids:
      - un-cpc3-2025
  - rule_id: validate_route
    applies_to: "dataset"
    rule: "Reconcile earthworks, subgrade, aggregate, asphalt/concrete/turf layers and specified associated works with actual design, documenting applicability/absence and corrections. An empty UUID does not imply absence; collection labels cannot complete the inventory."
    source_ids:
      - faa-airport-construction-2018
  - rule_id: validate_identities
    applies_to: "all inventory rows"
    rule: "Verify each public identity substance, state, route, geography/voltage, environmental medium and reference property; unsupported mass/area/volume relationships remain unresolved. Align bilingual row_id, rule_id, UUID and official Chinese names."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "dataset"
    rule: "Check no overlap between site combustion, transport, upstream manufacture and treatment. Reconcile water/waste destinations, exact emission species and cumulative asset shares. Gaps prevent complete environmental-inventory claims; site delivery confers neither whole-life coverage nor scientific/regulatory approval."
    source_ids:
      - fhwa-pavement-lca-2016
      - epa-concrete-washout-2012
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Per-square-metre construction delivery inventory for declared airfield use/structure; use verified upstream links at declared gates; compare only matching function, load, structure, climate and boundary"
  excluded_use: "Whole-life claims; aircraft operation; general construction service; automatic functional equivalence per area; default life/recipe/mass; regulatory approval"
  required_metadata: "All reference qualifiers; surveyed total area/zones; layer structure; delivered associated facilities; stage totals, attribution and units; signed acceptance; source gates and update date"
  required_quality_disclosure: "Missing identities/data/upstream; actual measurement/calculation methods; emission applicability; unmetered intervals; reused-asset cumulative shares; all later-stage omissions"
  update_trigger: "Changes to use, geometry, structure, load requirements, site, delivery configuration, supply, construction measurements or evidence/identities"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, p. 279. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "53213 entity boundary including taxiways, aprons and related non-building structures; classification scope only"
  - id: "faa-airport-construction-2018"
    type: "official_guidance"
    reference: "FAA AC 150/5370-10H, Standard Specifications for Construction of Airports, 21 December 2018, updated errata 19 August 2020. https://www.faa.gov/documentLibrary/media/Advisory_Circular/150-5370-10H.pdf"
    used_for: "P-152 pp.103–116 earthworks; P-154 pp.121–128 subbase; P-209 pp.173–182 crushed base; P-217 pp.207–214 aggregate/turf; P-401 pp.263–293 asphalt; P-501 pp.347–390 concrete; P-605 p.499 onward joints; P-620 p.521 onward markings; P-621 p.537 onward grooves; D-701 p.575 onward drains; L-125 p.713 onward lighting; T-901 p.613 onward seeding, T-904 p.627 onward sodding, T-905 p.633 onward topsoiling. US qualitative construction/acceptance evidence, without importing numeric limits, recipes, load thresholds or compliance requirements"
  - id: "fhwa-pavement-lca-2016"
    type: "official_guidance"
    reference: "FHWA-HIF-16-014, Pavement Life-Cycle Assessment Framework, July 2016, §1.2 p.1-4; §3.2.3; Chapter 4. https://rosap.ntl.bts.gov/view/dot/38470/dot_38470_DS1.pdf"
    used_for: "Road-framework stage distinctions and boundary disclosure for production/construction/use/maintenance/end-of-life; no road-vehicle impacts or airport service-life values transferred"
  - id: "epa-construction-dust-1995"
    type: "official_guidance"
    reference: "US EPA AP-42 §13.2.3 Heavy Construction Operations, January 1995, pp.13.2.3-1–2. https://www.epa.gov/sites/default/files/2020-10/documents/13.2.3_heavy_construction_operations.pdf"
    used_for: "Historical qualitative construction-dust mechanisms and site conditions only; no old aggregate TSP factor or inferred PM fractions adopted"
  - id: "epa-concrete-washout-2012"
    type: "official_guidance"
    reference: "US EPA, Stormwater Best Management Practice: Concrete Washout, EPA 833-F-11-006, February 2012, pp.1–2. https://www.epa.gov/sites/default/files/2015-11/documents/concretewashout_0.pdf"
    used_for: "Concrete washout liquid, settled solids, containment and actual water-route distinction; no assumed soil/water discharge or default pH/concentration"
