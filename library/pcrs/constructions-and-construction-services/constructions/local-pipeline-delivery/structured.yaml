    role: "foreground_construction"
    quantitative_reference: "per declared reference flow"
  - id: pipe_assembly
    name: "Main installation, joints and integral chambers"
    inclusion: "required"
    inclusion_condition: "Install the actual declared gas/water/sewer main with route-specific materials and components; for a heat-only unit its carrier installation is in heat_protection."
    role: "foreground_construction"
    quantitative_reference: "per declared reference flow"
  - id: trenchless
    name: "Trenchless crossing and annular filling"
    inclusion: "conditional"
    inclusion_condition: "Actual jacking, directional drilling or other evidenced non-open-cut method; record drilling/pit/spoil/water route without assuming one method."
    role: "foreground_construction"
    quantitative_reference: "per declared reference flow"
  - id: heat_protection
    name: "Hot-water/steam carrier, return, insulation and support installation"
    inclusion: "conditional"
    inclusion_condition: "Actual local hot-water or steam system; retain chosen certified system, actual condensate-return scope and factory-vs-field assembly boundary."
    role: "foreground_construction"
    quantitative_reference: "per declared reference flow"
  - id: restoration
    name: "Backfill, compaction and surface reinstatement"
    inclusion: "required"
    inclusion_condition: "Actual disturbed site and contracted surface restoration through acceptance; internal reusable soil stays in the balance."
    role: "foreground_construction"
    quantitative_reference: "per declared reference flow"
  - id: commissioning
    name: "Inspection, medium-specific testing and acceptance handover"
    inclusion: "required"
    inclusion_condition: "Actual complete delivery interfaces and applicable inspection/test/repair/retest records; medium and criteria follow the real project specification."
    role: "foreground_construction"
    quantitative_reference: "per declared reference flow"
  - id: construction_support
