measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "item"
    rule: "Output is 1 item of the same complete accepted configuration, established through cp_delivery. All inventory and protocol aggregation is per declared reference flow."
  - id: preserve_physical_units
    applies_to: "inventory rows with native Mass, Volume or Length properties"
    required_property_ref:
      name: "Mass; Volume; Length"
      uuid: ""
    required_unit: "kg; m3; m"
    rule: "Preserve the actual primary property. Weigh net quantities; survey actual lengths; meter liquid/gas volume at declared conditions. Convert using same-lot measured density/linear mass and calibration evidence only; do not rewrite public properties or use screening density. Electricity follows electricity_basis with Net calorific value/MJ and the measured kWh-to-MJ conversion. The complete accepted network reference output follows Number of items/item. These energy and counted output exchanges are excluded from this material-unit rule and retain their own numerator and reference roles."
  - id: electricity_basis
    applies_to: "cn_lv_power; cn_mv_power"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Keep the verified energy property/group; measured kWh × 3.6 = MJ. Separate user-voltage interfaces and exclude double counting of transformations/generators."
  - id: asset_share
    applies_to: "shoring_steel; excavator_share; wood_pallet"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measured same-configuration asset mass multiplied by a supported dimensionless manufacture share is an attributable input, not reference-product mass. Across all beneficiaries/reuses cumulative shares must be <=1; unknown life/activity requires review."
  - id: chemical_fraction
    applies_to: "hypochlorite_solution; no_air; no2_air; pm25_air; pm_coarse_air"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep solution mass separate from active chlorine; keep molecular species and nonoverlapping particle fractions separate. Total NOx, total dust or a single concentration cannot establish these exchanges without a supported conversion and actual flow/time."
