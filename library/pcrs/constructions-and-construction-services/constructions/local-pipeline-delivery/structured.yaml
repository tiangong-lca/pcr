allocation_rules:
  - rule_id: a_direct
    applies_to: "foreground_burden_allocation"
    rule: "Assign material, utility, transport, test and waste quantities directly to recorded tasks/interfaces where possible. Shared site meter quantities require actual submeter/task evidence and a conserved ledger over all beneficiaries; do not invent allocation by cost, diameter or an assumed kilometre."
    source_ids: []
  - rule_id: a_assets
    applies_to: "foreground_burden_allocation"
    rule: "For each reusable plant/shoring/pallet retain same-configuration measured mass, supported total service/activity basis and documented dimensionless manufacture shares. Across projects, periods and reuse cumulative shares <=1. Unknown total activity/life is unresolved review, not full burden per project. Do not also include this manufacture in a rental/service dataset."
    source_ids: []
  - rule_id: a_waste
    applies_to: "foreground_burden_allocation"
    rule: "The declared pipeline is the single delivery output. Returned usable material/pallet/condensate is separately identified by actual state and receiver; waste is not a co-product by default. Declare actual off-site recycling/treatment boundaries and do not add assumed avoided virgin production."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_delivery
      process_id: "commissioning"
      flow_role: "finished_pipeline"
      record_type: "As-built and acceptance register"
      raw_fields: "site/asset/interfaces; medium; surveyed carrier/branch/return length, bore/wall/burial/gradient; chamber/support/restored-area geometry; actual duty/capacity/pressure/temperature; material/system/BOM; test/repair/retest; date; accepted count"
      collection_method: "Survey traceable as-built dimensions with calibrated instruments; reconcile complete scope and all integral work with signed handover and applicable test records. Record actual duty from the accepted design/test evidence rather than assuming values."
      unit: "item"
      frequency: "each delivery/correction"
      temporal_coverage: "entire construction through acceptance"
      site_scope: "same entire delivery entity"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "survey/calibration; signed scope and test acceptance"
    - protocol_id: cp_materials
      process_id: "earthworks_pipe_assembly_trenchless_heat_protection_restoration_construction_support"
      flow_role: "each specific supplied material/component"
      record_type: "lot/receipt/issue/return/stock ledger"
      raw_fields: "operation_id; row_id; supplier/interface/country; lot/grade/formulation; lining/coating/assembly inclusion; net mass/volume/length; moisture/density/linear mass; issued/returned/stocks; installed geometry"
      collection_method: "Weigh net material with calibrated scales/traceable lot weights; meter wet deliveries and survey installed lengths/geometry. Reconcile stocks, returns, installed quantities, rejects and actual rework; exclude packaging tare and embedded components counted in supplied assemblies."
      unit: "kg; m3; m"
      frequency: "each receipt/issue/return"
      temporal_coverage: "all construction/rework lots"
      site_scope: "same entity, assigned actual operation"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weigh slips; certificates; actual BOM; stock balance"
    - protocol_id: cp_logistics
      process_id: "logistics"
      flow_role: "haul_diesel"
      record_type: "trip/fuel ledger"
      raw_fields: "vehicle; consignment; route; payload; distance; empty returns; fuel meters/stocks; grade/provider/fossil fraction; transport dataset inclusions"
      collection_method: "Use actual dispatch/vehicle refuelling and fuel-meter records; include evidenced returns and disposal journeys. Fuel volume-to-mass uses same-fuel measured/supplier density at recorded conditions. Remove fuel/emissions already present in a linked complete service."
      unit: "kg; km"
      frequency: "each trip/refuelling"
      temporal_coverage: "all actual construction logistics"
      site_scope: "same entity actual origin/destination"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter and vehicle/dispatch records; supplied boundaries"
    - protocol_id: cp_energy
      process_id: "construction_support"
      flow_role: "each site fuel and voltage-specific electricity"
      record_type: "meter/task ledger"
      raw_fields: "operation_id; equipment; meter/interface; country/provider/year/voltage; readings; working/idle hours; diesel grade/fossil fraction/density; generator fuel/output; attribution beneficiaries"
      collection_method: "Read calibrated user electricity meters and weighed/metered fuel issues; assign actual welding/fusion/pump/compressor/compaction/test/lighting tasks. Reconcile shared meter periods and generator accounts without duplicated utility output."
      unit: "kg; kWh; MJ"
      frequency: "each shift/read/issue"
      temporal_coverage: "full construction/retest period"
      site_scope: "same entity and explicit shared beneficiaries"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; meter/time logs; fuel certificate; conserved shares"
    - protocol_id: cp_assets
      process_id: "earthworks_construction_support"
      flow_role: "each reusable physical plant/component"
      record_type: "asset manufacture-attribution ledger"
      raw_fields: "asset id/configuration; measured net mass; weighing evidence; actual task activity; supported total lifetime/cumulative activity; beneficiary list; prior/current shares"
      collection_method: "Use calibrated same-configuration weighing or traceable manufacturer net-mass records, excluding transport packaging; retain actual task and independently supported total-activity records. Audit cumulative shares across all projects/reuses; missing denominator remains unresolved review."
      unit: "kg"
      frequency: "each asset/task/reuse"
      temporal_coverage: "whole attribution history relevant to this share"
      site_scope: "same assets across all beneficiary sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "configuration/weighing; total activity evidence; conserved ledger"
    - protocol_id: cp_water
      process_id: "earthworks_commissioning_construction_support"
      flow_role: "each supply/resource/waste/direct water exchange and measured analyte"
      record_type: "meter/chemistry/receiver register"
      raw_fields: "operation_id; source/provider/aquifer; salinity; meter; volume/temperature/pressure; storage/reuse; waste vs direct route; treatment; receiver; analyte concentration/time; density when needed"
      collection_method: "Meter each actual external intake/return and destination independently; sample actual final discharge using a recorded method and matched flow interval. Distinguish resource abstraction, purchased treatment water, treatment waste and environmental release; preserve internal recirculation balances."
      unit: "m3; kg"
      frequency: "each intake/batch/discharge interval"
      temporal_coverage: "entire actual construction/testing water account"
      site_scope: "same entity and identified receivers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration; sampling/analysis; receiver and route records"
    - protocol_id: cp_testing
      process_id: "commissioning"
      flow_role: "each actual test medium/chemical/waste/condensate"
      record_type: "test/charge/flush/analysis ledger"
      raw_fields: "main/reach/material/medium; specification/criteria; test type; pressure/temperature/hold; results/repairs; fill/flush/retest volumes; solution concentration/density; nitrogen gas T/P/purity; gas composition/line pack/vent; steam state/condensate fate; hot-water supply/return temperature, pressure, flow/time; actual heating interface; measured delivered heat and state-property evidence"
      collection_method: "Use signed test/commissioning records and actual medium meters/weighing. Water-pressure, gravity-sewer air/water/infiltration, gas-compatible pressure tests and heat carrier/casing/operational tests follow actual material/system specifications. Collect actual thermal-test supply/return state and flow/time, or on-site heating fuel/water/electricity separately; preserve the actual supplier-vs-site heating boundary. Collect only real potable disinfection and actual dosing; do not infer doses or test media from another route."
      unit: "kg; m3"
      frequency: "each test/fill/flush/retest"
      temporal_coverage: "all pre-handover tests and corrections"
      site_scope: "same accepted interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "signed criteria/results; media meters; assay and composition certificates"
    - protocol_id: cp_waste
      process_id: "earthworks_pipe_assembly_trenchless_restoration_construction_support"
      flow_role: "each specific external waste"
      record_type: "weighbridge/container/transfer ledger"
      raw_fields: "row_id; operation; chemical/material state; wet/dry basis; contamination; measured mass/volume; reuse/recovery; destination/treatment; manifest"
      collection_method: "Weigh or meter each separately identified exported waste; retain composition and destination evidence, exclude actual internal reuse and document rejected/reworked materials. Never turn an unknown waste mixture into a generic elementary flow."
      unit: "kg; m3"
      frequency: "each transfer"
      temporal_coverage: "all construction/rework transfers"
      site_scope: "same entity, actual receiver"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weigh/meter slips; screening; destination manifests"
    - protocol_id: cp_air
      process_id: "construction_support"
      flow_role: "each molecular species or particle fraction"
      record_type: "emission measurement/activity ledger"
      raw_fields: "operation_id; source; species/CAS; fossil/biogenic fraction; particle fraction; air subcompartment; release time; matched concentration/gas-flow/time; real fuel/activity; applicable factor/source/uncertainty; included transport boundary"
      collection_method: "Integrate actual substance-resolved monitoring at the same dry/wet/temperature/pressure basis, or apply a documented compatible factor to measured actual activity. For dust use evidenced size-specific emission measurement/model and external receiver; occupational or collected indoor dust is not an environmental release. No generic factor or NOx species split is supplied."
      unit: "kg"
      frequency: "each source/operating interval"
      temporal_coverage: "construction/actual admission through acceptance"
      site_scope: "same entity with actual source/receiver"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; concentration/flow/time; factor applicability; raw uncertainty"
  calculation_rules:
    - id: calc_materials
      applies_to: "supplied materials/components and their corresponding stocks, installed quantities and wastes"
      rule: "Per declared reference flow reconcile opening stocks + actual receipts − returns − closing stocks against installed amount, waste and internal reuse for each same material/state; retain rework. This balance does not create a total reference mass."
      inputs:
        - cp_materials
        - cp_waste
      output: "net attributable kg, m3 or m per declared reference flow"
      source_ids: []
    - id: calc_power
      applies_to: "cn_lv_power; cn_mv_power"
      rule: "MJ = measured attributable kWh × 3.6"
      inputs:
        - cp_energy
      output: "MJ per declared reference flow"
      source_ids: []
    - id: calc_fuel
      applies_to: "haul_diesel; site_diesel"
      rule: "Per declared reference flow conserve fuel issue/stock/refuelling balances. Convert volume to kg only with actual same-state density; LHV conversion requires its actual source and does not modify the mass-based adopted diesel identity."
      inputs:
        - cp_energy
        - cp_logistics
      output: "kg per declared reference flow"
      source_ids: []
    - id: calc_assets
      applies_to: "shoring_steel; excavator_share; wood_pallet"
      rule: "Per declared reference flow attributable manufacture kg = measured configured net asset kg × supported dimensionless share. Across all projects/periods/reuses sum of shares <=1; do not invent lifetime or reset the denominator."
      inputs:
        - cp_assets
      output: "attributable kg per declared reference flow"
      source_ids: []
    - id: calc_water
      applies_to: "all water and test-medium rows"
      rule: "Per declared reference flow reconcile each external intake/supply, actual reuse, retained storage/line pack, return, waste transfer and final release. Convert density/gas-condition quantities only using actual recorded compatible state; Volume is not automatically Normal Volume."
      inputs:
        - cp_water
        - cp_testing
      output: "distinct m3 or kg per declared reference flow"
      source_ids: []
    - id: calc_analytes
      applies_to: "chloride_freshwater"
      rule: "Per declared reference flow sum measured chloride-ion concentration × matched actual final effluent volume after explicit concentration-to-kg conversion; report gross release and any supported background correction separately. Do not convert free chlorine to chloride by assumption."
      inputs:
        - cp_water
      output: "chloride kg per declared reference flow"
      source_ids: []
    - id: calc_air
      applies_to: "all elementary air emission rows"
      rule: "Per declared reference flow integrate matched species/fraction concentration × gas volume on the same conditions, or documented applicable factor × measured actual activity, with unit conversion to kg. Measured fossil CO2 from carbon balance requires actual fossil-carbon content and oxidation evidence; no fixed rate, complete oxidation or unsupported species split is provided."
      inputs:
        - cp_air
      output: "separate actual-species kg per declared reference flow"
      source_ids: []
    - id: calc_thermal_test
      applies_to: "test_hot_water; test_hot_water_return; test_steam; condensate_return"
      rule: "Per declared reference flow derive delivered test heat from actual same-circuit mass flow/time, measured supply/return states and supported applicable enthalpy difference; volume-to-mass requires actual same-state density. Reconcile hot-water supply/return temperature, steam quality and recovery route. Explicitly convert the derived heat to MJ. Unknown properties, quantities or supply boundary remain review; this heat ledger does not add the heating already included in a complete purchased heated-fluid input."
      inputs:
        - cp_testing
        - cp_energy
        - cp_water
      output: "measured states and supported test-heat MJ ledger per declared reference flow"
      source_ids:
        - ufgs-heat-2024
  data_quality_requirements:
    - id: dq_entity
      applies_to: "finished_pipeline"
      requirement: "Same real complete configuration/interfaces and physical geometry must agree across reference, installed inventory, test register and accepted output. No default per-main mass/capacity/life."
      evidence: "cp_delivery"
    - id: dq_routes
      applies_to: "all inventory rows"
      requirement: "Retain material/fluid/system-specific selection and actual process activity. Unknown supplied assemblies, quantities or test medium prevent a completeness claim; absence has evidence, not an assumed zero."
      evidence: "cp_materials; cp_testing"
    - id: dq_time
      applies_to: "all inventory rows"
      requirement: "Cover all actual construction, idle support, corrections, rejects, tests/retests and restoration through the actual acceptance date; source year/region/technology and uncertainty are disclosed."
      evidence: "cp_energy; cp_delivery"
    - id: dq_environment
      applies_to: "all elementary rows"
      requirement: "Verify chemistry, fossil/biogenic origin, environment/subcompartment, release time and size fraction. Record actual noise/vibration with receiver/time/frequency/instrument units separately; these impacts, land occupation and ecological disturbance remain explicitly uncovered where no compatible quantified model is provided, not zero."
      evidence: "cp_air; cp_water"
    - id: dq_assets
      applies_to: "all reusable assets"
      requirement: "Audit total activity evidence and cumulative conserved manufacture shares independently; unknown life/usage or rental manufacture boundary cannot be called complete."
      evidence: "cp_assets"
validation_rules:
  - rule_id: v_delivery
    applies_to: "foreground_dataset_conformance"
    rule: "Require all reference qualifiers, 1 item of complete actual accepted output, actual geometry/capacity/duty conditions and matching cp_delivery. Failed/partial handover remains incomplete; a classification match is not methodology approval."
    source_ids:
      - un-cpc3-2025
  - rule_id: v_medium
    applies_to: "foreground_dataset_conformance"
    rule: "Check water/pressure, gravity-sewer, gas and heat test/inspection routes against the actual specification and supplied material state. HK and US source numeric requirements are not default inventory or universal approvals; include actual repair/retest."
    source_ids:
      - wsd-mainlaying-2023
      - cedd-civil-2026
      - ufgs-heat-2024
      - phmsa-distribution-2024
  - rule_id: v_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Verify each selected flow against its real primary property, state, route, geography, chemistry, compartment and unit group; unresolved identities keep exact atomic rows and review gaps. CN power voltage, HK water gate, gas pressure/volume and factory-assembly inclusions remain explicit."
    source_ids: []
  - rule_id: v_balance
    applies_to: "foreground_dataset_conformance"
    rule: "All inventory/protocol bases are per declared reference flow. Conserve task/meter/material/water balances, trace actual density/linear-mass conversions and cumulative asset shares. Unproved mathematical relationships require review."
    source_ids: []
  - rule_id: v_release
    applies_to: "foreground_dataset_conformance"
    rule: "Reject NO/NO2/N2O, NOx-equivalent, particle-size, fossil/biogenic, immediate/long-term, water-resource/wastewater and receiver mismatches. Missing direct release quantities are explicitly unresolved, never invented from equipment/fuel presence."
    source_ids: []
  - rule_id: v_completeness
    applies_to: "foreground_dataset_conformance"
    rule: "Check all required/applicable stages and actual additional atomic exchanges, upstream links, internal assembly exclusions, bilingual row/rule/UUID consistency, noise/land/ecology coverage and lifecycle exclusions. Structural checks do not verify actual engineering acceptance, scientific approval or full-life completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "Construction foreground data package for a configured complete accepted local-pipeline entity"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Explicitly qualified construction comparison or component of a separately evidenced lifecycle model, matching medium/interface/duty/geometry and supplier boundaries"
  excluded_use: "Unqualified cross-medium/per-kg/per-km comparison; pipe-mill or service substitution; automatic full life, future losses/lifetime, compliance or scientific approval claims"
  required_metadata: "All reference qualifiers, actual process/route/assembly/BOM/measurement/acceptance records, attribution, source dates and upstream IDs/interfaces"
  required_quality_disclosure: "Unresolved flow/reference identities; unmeasured exchanges/conditional tasks; unknown asset shares; source regional/edition limits; missing upstream/lifecycle/noise/land/ecology coverage; uncertainty"
  update_trigger: "Changed medium/configuration/material/joint/thermal system/interface/site geometry, acceptance specification, measured activities, asset attribution or compatible identity/source evidence"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed/PDF pp.280–281. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Local gas, water/sewer and heat-main scope; distinction from long-distance pipes and treatment plants; classification is not methodology approval"
  - id: "wsd-mainlaying-2023"
    type: "official_guidance"
    reference: "Hong Kong Water Supplies Department, Manual of Mainlaying Practice, 2012 edition with incorporated amendments through Amendment No.1/2023. §§2–3; §3.10 printed p.25/PDF32; §3.11 p.26/PDF33; §4.4.1 printed p.36/PDF43 (water-main replacement trenchless context). https://www.wsd.gov.hk/filemanager/en/content_1456/Manual_of_Mainlaying_Practice_Amendment_1_2023(finalized).pdf"
    used_for: "HK supplied-pipe/field installation, testing, potable disinfection and replacement-main trenchless context; retained dated context, not global dosage, lifetime or current approval"
  - id: "cedd-civil-2026"
    type: "official_guidance"
    reference: "Hong Kong Civil Engineering and Development Department, General Specification for Civil Engineering Works, 2020 edition, Volume1 Rev8 including Amendment No.3/2026 dated23July2026. §§5.11–5.16A; 5.53–5.55 printed5.20–5.21/PDF167–168; 5.102–5.107 printed5.37–5.39/PDF184–186; Appendix5.4. https://www.cedd.gov.hk/filemanager/eng/content_978/GS%202020%20Vol%201%20Rev%208_clean.pdf"
    used_for: "HK drainage pipe materials, bedding/field assembly and gravity/pressure test distinction; project-specific specification controls, no default trench widths or quantities"
  - id: "ufgs-heat-2024"
    type: "official_guidance"
    reference: "USACE/NAVFAC/AFCEC, UFGS33 61 13 Pre-Engineered Underground Heat Distribution System, August2024, retained version referencing UMRL July2026. §1.2.3 p9; §§2.2.3–2.2.5 p16; §§2.3.3–2.3.6 pp18–20; §2.5/Table1 p28; §2.6 p31; §§3.5–3.6 pp37–40, including §3.6.2.3 operational testing p40. https://www.wbdg.org/FFC/DOD/UFGS/UFGS%2033%2061%2013.pdf"
    used_for: "Distinct actual steam/hot-water carrier, return, high-temperature insulation/casing, field installation and carrier/casing/operational tests. Guide requires project editing; do not impose every system or numeric design value"
  - id: "phmsa-distribution-2024"
    type: "official_guidance"
    reference: "Oak Ridge National Laboratory/Blade Energy Partners for PHMSA, Integrity Assessment of Distribution Pipelines, ORNL/SPR-2023/3188, January2024, official transmittal30August2024. §3.2 printedpp6–7/PDF18–19; §4.1 printedp10/PDF22. https://www.phmsa.dot.gov/sites/phmsa.dot.gov/files/2024-09/Report%20to%20Congress%20-%20Integrity%20Assessments%20of%20Distribution%20Pipelines.pdf"
    used_for: "Gas distribution material/joint distinction and new-line testing context; historical inventory shares and in-service integrity-assessment difficulty are not new-build recipes or universal hydrotest requirements"
