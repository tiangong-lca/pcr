  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: shoring_steel
      reason: When actual trench/pit shoring uses steel sheet piles. Record actual installation/removal energy separately; the input is the supported manufacture share of the same measured steel component, with cumulative shares conserved across all projects. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: soil_export
      reason: Record only soil actually exported as waste after documented contamination screening and destination classification. Soil moved and reused within the declared site boundary is an internal balance, not a second external exchange. Contaminated soil needs its own identified waste row. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: dewatering_wastewater
      reason: Conditional actual external transfer to treatment. Record suspended-solids state and any measured contamination; this liquid waste is neither natural resource intake nor a direct environmental discharge. Internal settling/reuse remains internal. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: di_water_pipe
      reason: "Actual DI water-main route only: document grade, bore, wall, lining, coating, joint and actual supplied net mass. Include factory lining/coating within the supplied pipe boundary; do not add its constituents again. Cast-steel and generic iron families do not establish this configured pipe identity. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained."
    - row_id: pe_water_pipe
      reason: When the actual accepted water route uses certified PE100 pressure pipe, with diameter, SDR/wall, resin and joint procedure recorded. This water-grade row does not substitute for gas-grade or an unspecified plastic pipe. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: pe_gas_pipe
      reason: Actual PE gas-main route only, using the specific certified gas grade, dimensions, joining qualification and operating conditions. Do not infer material grade, pressure rating or gas approval from water-pipe identity. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: concrete_sewer_pipe
      reason: Actual precast reinforced-concrete sewer route, including declared reinforcement and factory joint components. Capture net measured mass/geometry and joint method; do not count embedded reinforcement again. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: clay_sewer_pipe
      reason: Actual vitrified-clay sewer route, with bore, wall, supplied joint state and measured net quantity; this fired pipe is distinct from loose clay feedstock or concrete pipe. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: di_elbow
      reason: Actual discrete DI elbow with angle, bore, lining/coating and supplied boundary; exclude any elbow already included in a purchased assembly. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: di_tee
      reason: Actual discrete DI tee; identify each branch diameter and supplied coating/lining. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: gate_valve
      reason: Actual complete gate valve with bore, pressure class, actuator and supplied internal component boundary. Other valve types, gas regulators, steam traps or hydrants require their own discrete rows. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: epdm_gasket
      reason: Only a separately supplied actual EPDM gasket with confirmed elastomer formulation and fluid/temperature compatibility. Do not default to EPDM for every pipe route or duplicate a gasket included in the supplied pipe/valve. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: pe_coupler
      reason: Actual separately supplied gas-grade PE electrofusion coupling; retain dimensions and joining record. Butt fusion without a supplied coupling does not create this exchange. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: welding_electrode
      reason: Actual covered-electrode field welding only; retain classification, coating and issued-minus-returned mass. MIG wire, flux and shielding gases each need separate actual rows. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: epoxy_joint_coating
      reason: Actual prepared epoxy formulation applied to field joints, with composition, mixing state, curing and solvent content declared. Record its constituents separately only if mixed from individual purchased products, replacing the formulated-product row. Actual VOC species require separate supported releases. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: pvc_solvent_cement
      reason: Actual solvent-cement joint route only, with supplier formulation and issued/returned quantity. Socket-ring routes without solvent adhesive do not use this row. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: chamber_concrete
      reason: Only actual separately delivered fresh mix for included chamber/base/thrust works; retain grade, mix certificate, density, placement volume, rejects and curing. Precast chamber assemblies replace their embedded materials; on-site mixing requires separate cement, each aggregate, water and each admixture plus actual mixing energy. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: chamber_rebar
      reason: Actual separately supplied rebar installed in declared civil works; retain grade, cut lengths and weights. Embedded reinforcement of precast components is excluded from this separate row. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: warning_tape
      reason: Actual separately installed polyethylene identification tape; retain tape material and measured length/linear mass. Conductive detectable tape with metal content requires its own component identity. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: steel_offcut
      reason: Only actual uncoated steel offcuts exported as waste; coated/contaminated offcuts and spent electrodes are separate waste identities. No recycling credit is inferred. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: pe_offcut
      reason: Actual PE cut/rejected pipe waste at the site handoff before washing/recycling; cleaned polymer at a recycling plant is a different interface. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: pvc_offcut
      reason: Actual uPVC offcuts exported with contamination and destination declared; do not combine with polyethylene scrap. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: di_offcut
      reason: Actual DI offcuts with lining/coating state and destination documented. Steel scrap is not automatically this waste. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: bentonite_powder
      reason: Actual trenchless drilling/lubrication route using separately supplied bentonite. Retain real mud recipe and each separately purchased additive; injection-well bentonite/cellulose mixture is not pure powder. Purchased complete slurry instead replaces its included powder and water rows. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: grout
      reason: Only actual complete supplied cement grout for annular void filling; record composition and wet state. Site-mixed grout requires each measured constituent and mixing energy instead of double-counting the complete grout. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: drilling_slurry_waste
      reason: Actual spent slurry transferred out after measured recovery/reuse; retain bentonite concentration, mineral solids, contamination and wet volume. Oilfield-specific drilling waste is not a default local-pipeline waste. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: calcium_silicate
      reason: Actual separately supplied high-temperature calcium-silicate sections in the specified heat system. UFGS WSL steam systems distinguish an inner high-temperature layer from outer foam; do not infer generic thickness, density or suitability from a mineral feedstock. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: rockwool_section
      reason: When actual certified rock-wool pipe sections suit the recorded operating temperature and system design. A generic loose mineral wool identity does not alone confirm binder/form, temperature duty or thickness. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: pu_outer_insulation
      reason: Only an actual separately supplied outer PU layer with composition and thermal duty documented. In the cited WSL steam arrangement this surrounds the calcium-silicate layer; never treat PU directly on every steam carrier as a universal route. Count factory-embedded foam only inside its purchased assembly. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: steel_heat_casing
      reason: Actual separately supplied DDT-system steel casing with declared coating, vent/drain and field-connection boundary; it is not the fluid carrier and not a default WSL or HDPE casing. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: grp_heat_casing
      reason: Actual separately supplied WSL glass-fibre/polyester casing, with construction and resin documented. Complete supplied casing is one physical component; do not separately add its embedded resin and glass fibres. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: heat_anchor
      reason: Actual separately supplied anchor/support with geometry and load/configuration evidence; concrete block is accounted in its concrete row. Other expansion joints or steam traps require their own specific supplied-component rows. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: restoration_asphalt
      reason: Actual reinstatement of disturbed asphalt pavement before acceptance, with mix type, binder, reclaimed content, layer dimensions and measured quantity. Do not attribute undisturbed roads or future maintenance to this construction. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: asphalt_waste
      reason: Only actual removed pavement exported during this construction/restoration; retain tar screening, contamination and destination. Coal-tar waste or concrete rubble need different rows. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: other_test_water
      reason: Actual supply outside the verified HK interface requires its own provider/geography/treatment identity. Record all fills, flushes, drain-down and repeat tests; use this row instead of, not in addition to, the same hk_test_water quantity. Pneumatic-only tests do not require invented water. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: hypochlorite_solution
      reason: Only actual potable-water commissioning that uses this disinfectant, with solution composition, active-chlorine assay, density and issued dose measured. The WSD concentrations/contact times are HK specification context, not global default recipes. Sewer/gas/heat lines do not automatically use disinfection. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: compressed_air
      reason: Only actual pneumatic tests; declare moisture, pressure, temperature and supply boundary. Purchased compressed air and on-site compression electricity are alternative production boundaries; avoid counting both as complete supplied utilities. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: commissioning_gas
      reason: Conditional actual gas connection/test charge before acceptance, with composition, fossil/biogenic fractions, state and measured mass/volume conversion. Retained line pack at handover is distinguished from consumed/vented gas; subsequent distributed gas and routine operating loss are outside construction. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: test_steam
      reason: "Only actual pre-handover operational tests: collect supplier pressure, temperature, steam quality and actual supply/condensate interface. Neither 0.45 MPaG nor 11 MPaG is assumed. Boiler production is linked upstream unless actually on site, where each real fuel/water/emission must be inventoried. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained."
    - row_id: test_wastewater
      reason: Actual collected test/flush water sent to external treatment; retain contact materials, chemistry and treatment route. Do not use a silicon-wafer or manganese-slag washing wastewater merely because its name is Wastewater. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: chlorinated_wastewater
      reason: Actual disinfection drain-down sent to treatment; retain residual chlorine and dechlorination records. Distinct from uncontaminated pressure-test water and direct analyte discharge; do not count the same volume twice. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: condensate_return
      reason: Actual external return of recovered pre-handover test condensate, with temperature/chemistry/interface and metered quantity. Internal circulation is not an external product output; discarded condensate needs its actual waste/release route instead. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: finished_pipeline
      reason: Public Local pipelines candidate was directly read. Its plant-gate manufactured/Mass interface has not been established for this actual complete installed accepted entity; no verified installed-net-mass/count conversion is available. Keep the actual entity Count basis and resolve an appropriate product identity rather than rewriting a public property.
    - row_id: excavator_share
      reason: When the actual crawler excavator is used, collect its configured net mass and independently supported dimensionless manufacture share. The broad revolving-machinery family alone does not confirm crawler/hydraulic configuration. Include actual operation fuel separately; never charge complete manufacture anew at each project. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: site_water
      reason: Actual separate purchased/supplied site water with provider, location and treatment state declared. Do not use the HK plant-gate UUID outside its geography/interface. All curing, mud preparation and suppression uses are recorded by operation; exclude test water already counted. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: wrap_film
      reason: Actual separately delivered protective PE film that crosses the site boundary; include incoming packaging tare separately from installed product. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: wrap_waste
      reason: Actual discarded film, separate from PE pipe offcuts and with contamination/recycling destination declared. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: wood_pallet
      reason: Actual reusable pallet with measured material/state and conservative supported manufacture share; reusable pallets returned externally are recorded in the physical return ledger. Unknown lifetime/reuse denominator remains review. Bounded public candidate search and direct originals have not established an exact compatible identity; the declared concrete physical exchange is retained.
    - row_id: test_hot_water
      reason: "Only actual external hot-water supply for the specified pre-handover heat-main operational test. Record real inlet/return temperature, pressure, flow/time, water state and supplier interface. A complete purchased heated-water input includes its upstream heating; do not add that same heat again. An internally circulating or on-site heated circuit does not create this external exchange: record actual separately supplied make-up water, each real fuel/electricity and supported releases instead. No universal temperature, duration or heat rate is provided. Bounded public search and direct candidate review have not established a compatible supplied/returned fluid interface; retain the actual atomic exchange and resolve identity separately."
    - row_id: test_hot_water_return
      reason: Only actual external return of test hot water to the identified supplier with separately metered quantity and actual temperature, pressure and chemistry. Internal recirculation is an internal balance; discharged test water uses its actual treatment or environmental-release route. Separate this return from steam condensate and from retained water at handover. Bounded public search and direct candidate review have not established a compatible supplied/returned fluid interface; retain the actual atomic exchange and resolve identity separately.
  unresolved:
    evidence_needs:
      - Actual project geometry, material/configuration, quantities, mixtures, meter records and acceptance evidence are collected through the protocols; no default amounts are asserted.
      - Compatible upstream links and optional additional atomic exchanges must be independently established for each actual project.
      - Reusable equipment/component lifetime or cumulative actual activity and conserved manufacture shares require real evidence; unknown bases remain review.
      - Direct noise/vibration, land occupation and ecological disturbance need explicit quantified scope/evidence before a dataset claims their coverage.
