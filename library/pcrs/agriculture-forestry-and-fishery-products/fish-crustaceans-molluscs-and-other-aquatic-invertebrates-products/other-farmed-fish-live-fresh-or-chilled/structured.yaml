      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual maintenance and decommissioning wastes to treatment. Each oil, net, equipment, cleaning-liquid or other waste instance and destination separately; document recycling responsibility without unsupported displacement credits. <br> - Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg <br> - Amount rule: Actual attributable collect_support_waste instance quantity divided by accepted net fish A; retain raw native quantity and instance identity. <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_shared_support <br> - Range: Provisional unresolved evidence bound for each collect_support_waste instance; replace U_support_waste_instance from reviewed foreground evidence <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_support_waste_instance <br> - Unit: kg <br> - Basis: per 1 kg reference flow; independent instance bound, not a common cross-instance cap <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
