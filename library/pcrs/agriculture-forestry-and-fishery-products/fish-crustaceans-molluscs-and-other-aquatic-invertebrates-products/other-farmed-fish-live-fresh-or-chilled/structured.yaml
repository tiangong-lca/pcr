allocation_rules:
  - rule_id: attribution_output_set
    applies_to: "all processes"
    rule: "Enumerate each accepted reference grade, other marketed grade/live sale, closing live stock and any actual intended recovery output with net quantity and physical handoff. Mortalities, unsold rejects and collected residues are wastes unless an evidenced intended product function and actual recipient justify another classification; no automatic substitution credit."
    source_ids: []
  - rule_id: attribution_precedence
    applies_to: "cage_growout; sort_destination"
    rule: "First subdivide measured cohort/event/grade-specific duties. For irreducible same-species whole-fish joint growout or sorting burdens use actual net fish mass of all intended outputs at the common separation gate; carry grade-specific post-separation duty directly. Explain why mass represents physical production and test economic allocation when value differences materially change conclusions; disclose data and sensitivity, never choose retrospectively for a preferred result."
    source_ids: []
  - rule_id: attribution_period
    applies_to: "cage_growout; shared_support"
    rule: "Index phases and periods, opening/closing live stock and partial harvests. Attribute measured use to cohorts; carry work-in-progress burden once into subsequent harvests. Use evidenced service-life and actual duty records for replacements/assets, including downtime, failed cycles and termination; no universal lifetime, survival or cycle yield."
    source_ids: []
  - rule_id: attribution_shared
    applies_to: "shared_support"
    rule: "List every consuming node, cohort and period for each vessel, cage/net/mooring, tub, cold store or contracted service. Prefer meters and direct duty; otherwise use documented causal operating-hour, capacity-time or material-use shares. Reconcile shares to one owned burden, disclose idle/failed-duty assignment and sensitivity to a plausible alternative."
    source_ids: []
  - rule_id: attribution_no_duplicate
    applies_to: "all processes"
    rule: "Pair physical transfers without a second upstream burden. Purchased complete services replace their included fuels/utilities/assets/direct releases; purchased ice includes its own production energy. Route each final lot through packaging or bypass once and do not count identical handoffs as separate sales."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_receive_stock
      process_id: "receive_stock"
      flow_role: "Actual juvenile receipt and cage stocking exchanges and instance-specific fates"
      record_type: "Measured logs, supplier/transfer records and documented calculation inputs"
      raw_fields: "hatchery; species; batch; receipt and stocking dates; received count/mass; sampled individual mass; surviving stocked count/mass; transport; pre-stocking deaths; destination; row/instance id; native quantity; attributable share; accepted lot A"
      collection_method: "Reconcile hatchery delivery to counted receipt and independently measured or sampled mass; record losses before stocking, cage transfer ids and upstream transport. Establish independent U_row_instance and uncertainty from retained evidence."
      unit: "kg; count; kWh; t*km as applicable"
      frequency: "Each input/output event and support meter interval"
      temporal_coverage: "Entire attributable cohort/run and preparation through gate, including failed/idle duty"
      site_scope: "Actual juvenile receipt and cage stocking location and its consuming cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated instruments; dated lot-linked logs; supplier scope; destination receipts; method and uncertainty audit"
    - protocol_id: cp_cage_growout
      process_id: "cage_growout"
      flow_role: "Actual marine net-cage growout exchanges and instance-specific fates"
      record_type: "Measured logs, supplier/transfer records and documented calculation inputs"
      raw_fields: "cage/cohort; stocking; biomass; each feed formulation and lot; offered/returned feed; management substance and active content; mortalities; escapes; excretion model; cage cleaning; harvests; closing stock; row/instance id; native quantity; attributable share; accepted lot A"
      collection_method: "Maintain cage-cohort daily feed and health logs, biomass sampling and mortality/escape records; reconcile opening and closing stocks and every partial harvest; estimate each nutrient substance using measured composition and documented retention/fate. Establish independent U_row_instance and uncertainty from retained evidence."
      unit: "kg; count; kWh; t*km as applicable"
      frequency: "Each input/output event and support meter interval"
      temporal_coverage: "Entire attributable cohort/run and preparation through gate, including failed/idle duty"
      site_scope: "Actual marine net-cage growout location and its consuming cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated instruments; dated lot-linked logs; supplier scope; destination receipts; method and uncertainty audit"
    - protocol_id: cp_crowd_harvest
      process_id: "crowd_harvest"
      flow_role: "Actual crowding and dip-net harvest exchanges and instance-specific fates"
      record_type: "Measured logs, supplier/transfer records and documented calculation inputs"
      raw_fields: "cage/cohort; harvest event; pre-harvest withdrawal; crowd and dip-net duty; incoming biomass; collected fish mass; incidental material; deaths; escapes; transfer id; row/instance id; native quantity; attributable share; accepted lot A"
      collection_method: "Weigh collected fish net of carrier water and gear; link the crowd/dip-net event to cage biomass removed, mortality, incidental material and fish transfer into kill_chill through chill_live_fish. Establish independent U_row_instance and uncertainty from retained evidence."
      unit: "kg; count; kWh; t*km as applicable"
      frequency: "Each input/output event and support meter interval"
      temporal_coverage: "Entire attributable cohort/run and preparation through gate, including failed/idle duty"
      site_scope: "Actual crowding and dip-net harvest location and its consuming cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated instruments; dated lot-linked logs; supplier scope; destination receipts; method and uncertainty audit"
    - protocol_id: cp_kill_chill
      process_id: "kill_chill"
      flow_role: "Actual ice-water killing and chilling exchanges and instance-specific fates"
      record_type: "Measured logs, supplier/transfer records and documented calculation inputs"
      raw_fields: "harvest lot; live fish net mass; ice source and mass; water source and volume; actual added gas/substance; tub; times; measured temperatures; chilled fish mass; drained water; rejects; gas fate; row/instance id; native quantity; attributable share; accepted lot A"
      collection_method: "Record actual ice-water intervention, inputs, before/after temperatures and lot mass; separate fish from ice, free water and tubs; determine water treatment/release destination and any actual gas addition/release without prescribing a welfare method. Establish independent U_row_instance and uncertainty from retained evidence."
      unit: "kg; count; kWh; t*km as applicable"
      frequency: "Each input/output event and support meter interval"
      temporal_coverage: "Entire attributable cohort/run and preparation through gate, including failed/idle duty"
      site_scope: "Actual ice-water killing and chilling location and its consuming cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated instruments; dated lot-linked logs; supplier scope; destination receipts; method and uncertainty audit"
    - protocol_id: cp_sort_destination
      process_id: "sort_destination"
      flow_role: "Actual grade and destination sorting exchanges and instance-specific fates"
      record_type: "Measured logs, supplier/transfer records and documented calculation inputs"
      raw_fields: "incoming chilled lot; net mass; actual grade criteria; accepted grade; each other sale grade/destination; rejects; buyer/transfer; cleaning if actual; row/instance id; native quantity; attributable share; accepted lot A"
      collection_method: "Weigh every actual grade and rejected fraction independently, retain criteria and destinations, and reconcile incoming mass; record washing only if it occurred and its own inputs/fates. Establish independent U_row_instance and uncertainty from retained evidence."
      unit: "kg; count; kWh; t*km as applicable"
      frequency: "Each input/output event and support meter interval"
      temporal_coverage: "Entire attributable cohort/run and preparation through gate, including failed/idle duty"
      site_scope: "Actual grade and destination sorting location and its consuming cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated instruments; dated lot-linked logs; supplier scope; destination receipts; method and uncertainty audit"
    - protocol_id: cp_pack_present
      process_id: "pack_present"
      flow_role: "Actual packaging and presentation exchanges and instance-specific fates"
      record_type: "Measured logs, supplier/transfer records and documented calculation inputs"
      raw_fields: "fish lot; input/output net mass; package material and tare; new/reused status; rotations; losses; ice at pack; actual package rejects; each intended sale grade/destination and recipient; melt/carrier-water quantity; treatment recipient or release medium; next handoff; row/instance id; native quantity; attributable share; accepted lot A"
      collection_method: "Observe actual container/liner/label use and weigh tare; reconcile net fish and packaging separately; attribute reusable items by evidenced rotations and record loss and end-of-use ownership. Establish independent U_row_instance and uncertainty from retained evidence."
      unit: "kg; count; kWh; t*km as applicable"
      frequency: "Each input/output event and support meter interval"
      temporal_coverage: "Entire attributable cohort/run and preparation through gate, including failed/idle duty"
      site_scope: "Actual packaging and presentation location and its consuming cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated instruments; dated lot-linked logs; supplier scope; destination receipts; method and uncertainty audit"
    - protocol_id: cp_first_receipt
      process_id: "first_receipt"
      flow_role: "Actual pre-receipt delivery and first physical-recipient acceptance exchanges and instance-specific fates"
      record_type: "Measured logs, supplier/transfer records and documented calculation inputs"
      raw_fields: "lot; direct sort or package path; departure/receipt time and location; carrier/distance/load; actual temperature record; gross mass; ice/free water/tare; accepted net mass A; rejected/returned fish and fate; actual resale grade/destination/recipient/net mass; top-up ice and residual packing ice; melt/carrier-water quantity and treatment/release destination; recipient signature; row/instance id; native quantity; attributable share; accepted lot A"
      collection_method: "Match dispatch and physical receipt by lot; weigh accepted whole fish net of free water, ice and tare on calibrated equipment; identify recipient and rejected returns; include all actual pre-receipt transport and cold holding regardless of farmer/buyer responsibility, once by actual service scope. Establish independent U_row_instance and uncertainty from retained evidence."
      unit: "kg; count; kWh; t*km as applicable"
      frequency: "Each input/output event and support meter interval"
      temporal_coverage: "Entire attributable cohort/run and preparation through gate, including failed/idle duty"
      site_scope: "Actual pre-receipt delivery and first physical-recipient acceptance location and its consuming cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated instruments; dated lot-linked logs; supplier scope; destination receipts; method and uncertainty audit"
    - protocol_id: cp_shared_support
      process_id: "shared_support"
      flow_role: "Actual shared vessels, utilities and infrastructure exchanges and instance-specific fates"
      record_type: "Measured logs, supplier/transfer records and documented calculation inputs"
      raw_fields: "asset/service id; vessel/cage/mooring/net/tub/cold store; consuming node and cohort; period; meter/fuel; fuel origin; material replacements; service completeness; duty hours; waste; direct pollutant substance/medium; decommissioning; row/instance id; native quantity; attributable share; accepted lot A"
      collection_method: "Meter or reconcile purchase-stock-use for each carrier and asset; log node/cohort/period duty and idle/failed duty; allocate one support ledger to consumers; retain complete-service scope and measured or documented emission method. Establish independent U_row_instance and uncertainty from retained evidence."
      unit: "kg; count; kWh; t*km; actual native service unit as applicable"
      frequency: "Each input/output event and support meter interval"
      temporal_coverage: "Entire attributable cohort/run and preparation through gate, including failed/idle duty"
      site_scope: "Actual shared vessels, utilities and infrastructure location and its consuming cohorts"
