  calculation_rules:
    - id: lot_normalization
      applies_to: "all inventory rows"
      rule: "For each actual row instance, divide the attributable native quantity by the same positive accepted net fish A; retain raw quantities and attribution ledger. The accepted final same-lot fish amount is A/A = 1 kg."
      inputs:
        - "Native quantity"
        - "share ledger"
        - "accepted net fish A"
        - cp_first_receipt
      output: "Native row-unit quantity per 1 kg reference flow"
      source_ids: []
    - id: transfer_balance
      applies_to: "all inventory rows"
      rule: "Reconcile paired transfers by event, lot, actual state and net quantity. Opening stock plus received/produced quantities equals intended outputs, remaining stock, recorded losses and separately evidenced fate terms within uncertainty; biological growth and nutrient flows require composition evidence, not a simple fish-mass-only equation."
      inputs:
        - "Stock/transfer logs"
        - composition
        - "fate records"
        - uncertainty
      output: "Reconciliation and unexplained residual"
      source_ids: []
    - id: conversion_evidence
      applies_to: "all inventory rows"
      rule: "Count times representative same-batch mean individual mass yields fish mass; volume times measured source-appropriate density yields water mass; nutrient/active quantities use measured composition. Keep originals, conversion factor, temperature/basis and uncertainty; no generic species size or feed factor."
      inputs:
        - Counts
        - samples
        - "measured volume/density"
        - "formulation and composition"
      output: "Traceable physical-unit conversions"
      source_ids: []
    - id: release_accounting
      applies_to: "collect_marine_nutrient_release; collect_chill_direct_releases; collect_actual_sort_water_release; support_fossil_co2; support_biogenic_co2; collect_support_other_releases"
      rule: "Derive each substance and medium from measurement or documented composition/fate model. Separate fossil and biogenic carbon, dissolved and gaseous fates, collected treatment transfers and direct releases; do not infer an elementary UUID or factor from an aggregate label."
      inputs:
        - "Substance-specific records"
        - "fuel/carbon origin"
        - "retention and treatment data"
        - "model boundary"
      output: "Substance/medium-specific releases and uncertainty"
      source_ids: []
    - id: release_evidence_mode
      applies_to: "growout_escapes; fish_escape; support_fossil_co2; support_biogenic_co2; collect_marine_nutrient_release; collect_chill_direct_releases; collect_actual_sort_water_release; collect_packing_carrier_release; collect_delivery_carrier_release; collect_support_other_releases"
      rule: "For each actual direct-release instance, retain foreground_record/collected_record only when the raw release quantity is directly measured. If derived from fuel, concentrations, carbon composition or another activity record, use calculated_value/calculated_from_collection for that instance. Under its own collection protocol retain the explicit formula, factor and source/version where applicable, measured input records, substance/receiving-medium basis and uncertainty. Apply the stated attribution and reference-flow normalization once. Resolve the evidence branch before finalizing; missing method or supporting evidence remains incomplete, not zero. Existing foreground/collected metadata is the measured-branch template, not certification of calculated releases; no universal emission factor is supplied."
      inputs:
        - "Instance-specific measured records"
        - "formula and factor/source/version if calculated"
        - "node protocol"
        - "attribution and accepted A"
      output: "Release instance with method-consistent value/evidence metadata and traceable quantity"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity_gate
      applies_to: "reference and all transfers"
      requirement: "Establish species, origin, actual route, state, whole body, never-frozen history and first physical receipt; current market representation alone is insufficient."
      evidence: "Hatchery/site logs; harvest/chilling records; signed physical receipt"
    - id: dq_quantity
      applies_to: "all inventory rows"
      requirement: "Keep row-instance native unit, independent range evidence, positive accepted net A, conversion sample coverage and uncertainty. Provisional U quantities are evidence gaps and do not certify empirical plausibility."
      evidence: "Raw weighed/metered records; calibration; reviewable upper-bound derivation"
    - id: dq_complete_fates
      applies_to: "all processes"
      requirement: "Enumerate intended sale grades, mortalities, escapes, leftovers, water intake/return, cleaning, actual additives, refrigerants, treatment and uncharacterized ecological pathways. Absence needs a documented check."
      evidence: "Output/destination ledger; substance analysis; missing-data register"
    - id: dq_attribution
      applies_to: "shared_support; cage_growout"
      requirement: "Trace each shared consumer/period, failed duty, stock carryover, asset replacement and service scope; reconcile to totals without duplicated burdens."
      evidence: "Duty ledger; stock roll-forward; supplier scope and sensitivity"
    - id: dq_binding
      applies_to: "all inventory rows"
      requirement: "Verify concrete identities/property/unit support for actual exchanges; collection obligations require actual-instance verification. Unresolved identities block concrete publication."
