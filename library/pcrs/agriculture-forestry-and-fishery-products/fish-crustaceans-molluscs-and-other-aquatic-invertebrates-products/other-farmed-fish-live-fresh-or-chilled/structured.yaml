      applies_to: "repaired atomic flow cards"
      requirement: "U_row is an unresolved evidence requirement, not a numerical estimate, default, clipping limit or completeness pass. Establish each card's own matching-unit/reference-basis upper envelope from independent representative records or a compatible documented supplier/design bound, retaining scope, method and uncertainty. Do not reuse a removed aggregate range, copy a sibling quantity, derive a bound from the target batch itself or invent a value. Applicable missing evidence blocks quantitative QA completion; actual measurements remain required."
      evidence: "Independent envelope evidence; retained raw records and uncertainty"
validation_rules:
  - rule_id: validate_reference
    applies_to: "accepted_chilled_seabream"
    rule: "Require positive accepted net A, correct same-lot reference link/name, 1 kg final amount, all qualifiers and ice/water/tare exclusions; verify actual physical recipient and never-frozen condition."
    source_ids: []
  - rule_id: validate_route
    applies_to: "all processes"
    rule: "Check all required nodes, cage-cohort production mode, independent harvest/chilling, actual packaging activation/bypass and complete ordered handoffs. Do not infer washing, universal CO2, zero support energy or another harvest method."
    source_ids:
      - fao-seabream-2009
  - rule_id: validate_instances
    applies_to: "all inventory rows"
    rule: "Match all actual instances to native units, independent U evidence, node-owned protocol and actual material/substance/destination/medium; unexplained absent data or invented numeric caps fail data completeness."
    source_ids: []
  - rule_id: validate_outputs
    applies_to: "all processes"
    rule: "Check every intended grade/live sale and its handoff, unsold reject/treatment fate and direct release; do not count closing stock or one product twice at different gates."
    source_ids: []
  - rule_id: validate_period_support
    applies_to: "shared_support; cage_growout"
    rule: "Reconcile cohort/run/period attribution, opening/closing stock, cleaning/changeovers, replacements/termination and idle/failed duty. Shares sum to the owned burden and purchased complete service scope excludes repeated inputs/releases."
    source_ids: []
  - rule_id: validate_environment
    applies_to: "all elementary flows"
    rule: "Require exact pollutant or resource identity, basis and receiving medium; fossil and biogenic CO2 separated where known; unknown origin remains unresolved. Carrier water is not automatically pollution, treatment transfer is not a direct release, and uncharacterized escape/habitat effects remain disclosed."
    source_ids: []
  - rule_id: validate_projection
    applies_to: "all processes"
    rule: "Align bilingual row/rule/protocol ids, actual state/property/unit/ranges, verified fixed identities and canonical projection. Report performed/skipped checks, identity gaps, unsupported factors and uncertainty; a structural pass does not establish external identity or publication readiness."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable per-flow collection obligations and final exchanges"
    rule: "Final dataset completion and validation require every actual exchange to have an independent atomic card and its own quantity, property/native unit, collection or calculation evidence, range/uncertainty evidence, normalization, actual destination and verified UUID. Unknown identity, activity state, quantity, range evidence or fate blocks completion; it is never zero, a presumed bypass or permission to omit an obligation. Every important concrete flow retains its own range/uncertainty evidence collection duty; a symbolic upper bound is not an empirical range."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after concrete foreground evidence and identity review"
  downstream_use: "Foreground data package, process and lifecyclemodel projections of declared whole chilled fish supply"
  allowed_use: "Matching species/route/state/gate and reporting period with disclosed representativeness"
  excluded_use: "Other taxa/routes; live final product; gutted/filleted/cooked/frozen/thawed fish; edible-meat conversion; retail supply; welfare/safety/compliance certification"
  required_metadata: "Required qualifiers; cohort/run/period; site; first physical recipient; actual net-mass method; all upstream boundaries; outputs/fates; support/period attribution; actual optional operations"
  required_quality_disclosure: "Source applicability, historical route limitations, foreground coverage, provisional U evidence, identity gaps, uncertainty, allocation sensitivity and uncharacterized ecological effects"
  update_trigger: "Species/route/gate/state, feed formulation, chilling method, actual packaging, support/service ownership, representative period, source or identity evidence materially changes"
data_sources:
  - id: "fao-seabream-2009"
    type: "official_guidance"
    reference: "Colloca F.; Cerasi S. FAO 2009. Sparus aurata cultured-species fact sheet. https://www.fao.org/fishery/docs/DOCUMENT/aquaculture/CulturedSpecies/file/en/en_giltheadseabr.htm"
    used_for: "Qualitative purchased-juvenile marine-cage route, crowd/dip-net harvest, ice-water intervention and environmental pathways. Historical numerical husbandry values and CO2 welfare assertion are not adopted."
  - id: "avramar-whole-fish"
    type: "extension_guidance"
    reference: "AVRAMAR Products. https://avramar.eu/products/"
    used_for: "Producer representation of Greek Sparus aurata whole-round fresh fish; not a particular farm's foreground proof or universal operating practice."
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 explanatory notes, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only; semantic PCR is narrower than 04292."
