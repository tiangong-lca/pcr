      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual other pollutant and refrigerant releases to established media. One actual identified substance/species/particle-size/refrigerant instance and receiving medium; use measured or justified model with factor boundary and uncertainty, not an unspecified air-emission UUID. Apply release_evidence_mode: the foreground_record/collected_record metadata below is only the measured branch; calculated instances require calculated_value/calculated_from_collection and the evidence specified by that rule. <br> - Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg <br> - Amount rule: Actual attributable collect_support_other_releases instance quantity divided by accepted net fish A; retain raw native quantity and instance identity. <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_shared_support <br> - Range: Provisional unresolved evidence bound for each collect_support_other_releases instance; replace U_support_other_releases_instance from reviewed foreground evidence <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_support_other_releases_instance <br> - Unit: kg <br> - Basis: per 1 kg reference flow; independent instance bound, not a common cross-instance cap <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
