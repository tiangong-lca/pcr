validation_rules:
  - rule_id: v_reference
    applies_to: "aquaculture_live_handover"
    rule: "Require one species/cohort, actual farmed origin, declared seed/broodstock/live-fish-feed purpose, life stage and producer gate, net viable wet mass plus count, weighing and health/fitness evidence. Eggs/gametes, dead/rejected fish and nonfish organisms cannot satisfy the reference."
    source_ids:
      - un-cpc-3-2025
      - pcr-live-aquaculture-method
  - rule_id: v_measurement
    applies_to: "all inventory rows"
    rule: "Check same-reference normalization, actual representative count-to-mass measurements, calibrated net weighing, moisture/density/gas conditions and energy units. Range outliers trigger reviewed evidence and uncertainty, never clipping or automatic invalidation; missing actual quantities remain gaps."
    source_ids:
      - pcr-live-aquaculture-method
  - rule_id: v_routes
    applies_to: "broodstock_hatch; managed_rearing; harvest"
    rule: "Verify owned/purchased phase matrix and supplier burdens; spawning deltas reference broodstock_hatch and water deltas actual managed_rearing. With rearing check reared_live_transfer → harvest_stock_input; for actual hatchery-only seed check hatched_fish_transfer → harvest_stock_input, seed-stage fitness and evidence of phase absence. Require actual owned hatchery or rearing production; retain all hatchery/live-food resources, without fictitious stages or duplicate transfers."
    source_ids:
      - fao-seed-production
      - ifas-ras-health
      - pcr-live-aquaculture-method
  - rule_id: v_balance
    applies_to: "all selected nodes"
    rule: "Reconcile fish counts and measured biomass with growth, opening/closing stocks, transfers, handovers, mortalities, rejection and escapes; growth means input/output wet mass need not be equal. Reconcile feed dry matter, nutrient intake and measured species releases with stated retention and solids, not a universal emission factor."
    source_ids:
      - pcr-live-aquaculture-method
  - rule_id: v_completeness
    applies_to: "utilities; residuals"
    rule: "For each selected source-stage inspect actual resource categories, treatment and direct release records. Supplied water, own abstraction, circulation, waste handoff and direct discharge are distinct. Substance releases require species/basis, receiving medium, flow-duration, concentration/background and laboratory QA."
    source_ids:
      - pcr-live-aquaculture-method
  - rule_id: v_attribution
    applies_to: "broodstock_hatch; managed_rearing; utilities"
    rule: "Check every intended output/handover, run/changeover, parent spawning cycle, period carryover, retirement fate and shared consumer matrix. Sum attributed shares to actual totals and ensure no repeated upstream, parent, asset, service or internal-transfer burden."
    source_ids:
      - pcr-live-aquaculture-method
  - rule_id: v_binding
    applies_to: "all inventory rows"
    rule: "Each final dataset exchange needs a concrete verified identity matching substance/product, state, purpose, supply geography/technology/provider, flow type, direction and unit. Conditional collection obligations split into actual exchanges at data production. Candidate unresolved registrations and a structural check pass do not verify final identities."
    source_ids:
      - pcr-live-aquaculture-method
  - rule_id: v_zero_gate
    applies_to: "conditional processes; presentation"
    rule: "Zero is accepted only with documented non-use or observed absence over the applicable stage/period. Unknown viability, purpose, route, handover state, quantity or release fate prevents a complete qualifying dataset; report performed and skipped validation coverage."
    source_ids:
      - pcr-live-aquaculture-method
  - rule_id: validate_inventory_completion
    applies_to: "all concrete exchanges and section 8 completion obligations"
    rule: "Verify each applicable dq_complete obligation has separately measured and identity-verified exchange cards. Check each quantity, native unit, range evidence, normalization, receiving medium, destination and non-duplication. Any unfulfilled actual child exchange, quantity, identity or destination makes the final dataset incomplete and fails validation; unknown cannot be zero. Static PCR checking does not replace this evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Foreground aquaculture-purpose live-fish data package first; verified downstream process or lifecyclemodel projection"
  allowed_use: "Upstream seed, broodstock or live-fish-feed input matching declared purpose, species, life stage, viability/fitness, gates and technology/period"
  excluded_use: "No food, ornamental, wild-origin, final-egg or nonfish-feed substitution; no cross-purpose/stage equivalence from kilograms alone; no final use of unverified exchanges"
  required_metadata: "PCR/version; species/cohort and one purpose; life stage; count/net mass; origin-stage matrix; spawning/water system; site/period; gate/holding route; upstream references and attribution"
  required_quality_disclosure: "Measurement/sampling uncertainty; all source stages and parent carryover; shared asset/service attribution; mortality/escape/emission fate; identity verification/gaps; range evidence and skipped checks"
  update_trigger: "Changes in purpose/species/stage, spawning/water system, supplier/gate, resource/health/treatment, parent retirement or attribution; new measurement/identity evidence; material loss/release events"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "United Nations CPC Version 3.0 explanatory notes (30 June 2025), printed pp. 40–41; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf; retrieved 2026-10-09"
    used_for: "Official origin/nonfood live-fish boundary; this PCR narrows to aquaculture purposes"
  - id: "fao-seed-production"
    type: "official_guidance"
    reference: "FAO, Seed production, sections 1.3–1.5; https://www.fao.org/4/AC182E/AC182E01.htm; retrieved 2026-10-09"
    used_for: "Qualitative reproduction, hatchery, stage and natural/supplied food distinctions; no historical quantitative or medicine prescriptions"
  - id: "fao-live-fish-handling"
    type: "official_guidance"
    reference: "FAO, Selected aspects of warmwater fish culture, chapter 6; https://www.fao.org/4/T8389E/T8389E06.htm; retrieved 2026-10-09"
    used_for: "Qualitative live collection/bounded viability, size and water/oxygen/handling roles; no historical capacities/doses"
  - id: "ifas-ras-health"
    type: "extension_guidance"
    reference: "UF/IFAS, Fish Health Management Considerations in Recirculating Aquaculture Systems—Part 1, FA099; https://ask.ifas.ufl.edu/publication/FA099; retrieved 2026-10-09"
    used_for: "Qualitative water-system purpose, water quality and actual RAS management; no species-specific husbandry prescription"
  - id: "ghg-product-standard-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), chapter 9; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf; retrieved 2026-10-09"
    used_for: "Subdivision/physical-causality precedence and justified fallback disclosure; no assertion of full-standard conformity"
