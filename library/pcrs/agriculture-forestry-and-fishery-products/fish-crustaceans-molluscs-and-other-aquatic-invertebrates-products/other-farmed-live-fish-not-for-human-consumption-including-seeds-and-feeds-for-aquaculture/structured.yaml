measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated qualified viable net wet fish mass per 1 kg reference flow, excluding water, gas, packaging, dead and rejected fish; collect with cp_handover."
  - id: actual_count_mass
    applies_to: "all fish transfers"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Count-to-mass requires actual representative sample mass/count for the same species, stage and period with sampling uncertainty; no generic fish-count or egg-count factor."
  - id: water_feed_gas_basis
    applies_to: "water; feeds; oxygen"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Volume-to-mass needs actual density and temperature/salinity or gas pressure/temperature/purity; wet/dry feed conversion needs measured moisture; circulation and internal fish transfers retain actual quantities."
  - id: energy_units
    applies_to: "electricity; heat"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "1 kWh = 3.6 MJ; retain original measured units and conversion, do not treat electricity/heat as fuel mass or services as kilograms."
