allocation_rules:
  - rule_id: a_precedence
    applies_to: "common production burdens"
    rule: "Subdivide independently measured activities first, then apply an evidenced causal physical relationship to remaining common burdens. Document economic allocation at the common handover only if physical causality cannot be established, with price period, all output values and sensitivity. Wet mass alone is not presumed causal across seeds, broodstock and feed fish."
    source_ids:
      - ghg-product-standard-2011
      - pcr-live-aquaculture-method
  - rule_id: a_output_set
    applies_to: "hatchery_other_products; rearing_other_products"
    rule: "Enumerate every intended saleable species/cohort/life stage/purpose, its measured quantity and own handover. Classify unsold residue, mortality, waste and retained stock separately. Assign each common burden once; an internal transfer is never another sale."
    source_ids:
      - pcr-live-aquaculture-method
  - rule_id: a_modes
    applies_to: "all selected nodes"
    rule: "Declare cohort batch, repeated spawning campaign or continuous/overlapping flow mode with run/period start and end. Link feed, utilities, outputs, cleaning and changeover events to the applicable run; allocate common idle/changeover burdens across actual beneficiaries with documented causal activity."
    source_ids:
      - pcr-live-aquaculture-method
  - rule_id: a_parents_periods
    applies_to: "broodstock_hatch"
    rule: "Track parent acquisition/establishment and maintenance across spawning cycles; allocate actual parent-service burden to offspring events using evidenced reproductive contribution or another justified causal relation. Reconcile opening/closing parent stock, replacements, mortality and terminal sale/disposal, including residual unassigned burden on retirement. Do not charge full parent establishment anew to every spawn."
    source_ids:
      - pcr-live-aquaculture-method
  - rule_id: a_cohort_carryover
    applies_to: "managed_rearing; holding"
    rule: "Keep opening burden plus actual current inputs attached to the cohort. Reconcile surviving closing stock, qualified handovers, internal transfers, mortality/rejection and escapes by phase. Carry closing stock and its burden into the next period; retain losses in surviving product burdens without crediting dead fish as equivalent live output."
    source_ids:
      - pcr-live-aquaculture-method
  - rule_id: a_shared
    applies_to: "utilities; residuals; presentation"
    rule: "For each shared water loop, pump, blower, thermal system, filter, hatchery room or reusable container, enumerate actual consuming nodes/cohorts and periods. Use submeters first, then measured power-time, treated throughput, occupancy-time or another evidenced driver matched to the asset. Reconcile total shares to the asset ledger and account for maintenance/replacement and realized reuse once."
    source_ids:
      - pcr-live-aquaculture-method
  - rule_id: a_services
    applies_to: "cp_service_utilities; cp_service_presentation; cp_shared_utilities"
    rule: "Retain diagnostic tests, holding services and within-gate transport in actual test, fish-day, tonne-kilometre or provider activity units with property/unit verification before exchange binding. Unknown service identities stay auxiliary evidence and unresolved metadata; never invent kg of generic service."
    source_ids:
      - pcr-live-aquaculture-method
  - rule_id: a_fates
    applies_to: "residuals"
    rule: "Keep treatment and collection burdens of mortality, failed eggs, waste and effluent within the product system. Report any distinct substitution scenario separately with evidence; do not deduct an unverified avoided product or dilute losses with transport water/packaging mass."
    source_ids:
      - pcr-live-aquaculture-method
