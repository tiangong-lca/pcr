  calculation_rules:
    - id: cohort_inventory
      applies_to: "all inventory rows"
      rule: "Divide actual attributable quantity by net viable wet mass of the same qualifying handover cohort; final reference fish is fixed at 1 kg, internal transfers retain measured amounts; carry undelivered closing stock/burden forward and do not repeat it across handovers."
      inputs:
        - cp_handover
        - cp_stock_broodstock_hatch
        - cp_stock_managed_rearing
        - cp_stock_harvest
        - cp_stock_holding
        - cp_stock_presentation
        - "actual stage ledgers"
      output: "actual inventory per 1 kg reference flow"
      source_ids:
        - pcr-live-aquaculture-method
    - id: sample_biomass
      applies_to: "actual fish count records"
      rule: "Divide actual representative sample wet mass by sampled count and multiply actual qualifying count of the same cohort; document stratification, stage and uncertainty, preferring available direct net weighing."
      inputs:
        - cp_handover
        - cp_stock_broodstock_hatch
        - cp_stock_managed_rearing
        - cp_stock_harvest
        - cp_stock_holding
        - cp_stock_presentation
      output: "actual cohort wet mass and uncertainty"
      source_ids:
        - pcr-live-aquaculture-method
    - id: integrated_release
      applies_to: "direct substance releases"
      rule: "For each actual waterborne substance and receiving medium, first retain gross outlet load L_out = sum(C_out,k * V_out,k), using concentration and discharged volume matched to each representative interval, with explicit unit and elemental/species conversions. Independently retain inlet load L_in = sum(C_in,j * V_in,j) for the same period/basis, other water fates, stocks and uncertainty. Gross outlet load is the default direct-release inventory; an out-minus-in balance is a separate diagnostic, not automatically an emission or removal credit. A foreground-attributable release may replace the gross inventory only under a documented, independently justified source/fate method that identifies the inlet/background share actually reaching that outlet and accounts for other outputs, retention, transformation and stock changes; retain both load records, the explicit attribution formula and applicability evidence, and use only one inventory representation. Never assume equal inlet/outlet volumes or substitute (C_out - C_background) * V_out without that evidence. Negative or uncertain differences remain review findings, not automatic negative emissions, uptake credits or zero. Retain nondetect handling and laboratory QA; missing volume, matching or attribution evidence blocks the affected result, and treatment-service expenditure cannot determine release mass."
      inputs:
        - cp_water_utilities
        - cp_water_residuals
        - cp_release_utilities
        - cp_release_residuals
      output: "gross outlet and inlet load records, separate diagnostic balance and one justified release inventory per substance/medium"
      source_ids:
        - pcr-live-aquaculture-method
    - id: attribution_ledger
      applies_to: "shared outputs periods and assets"
      rule: "Measure independently first, then attribute common burden by demonstrated causal activity; shares sum to actual common total. Opening burden plus current inputs reconcile to actual handovers, closing stock and declared retirement fate without repeated attribution."
      inputs:
        - cp_stock_broodstock_hatch
        - cp_stock_managed_rearing
        - cp_stock_harvest
        - cp_stock_holding
        - cp_stock_presentation
        - cp_shared_utilities
        - cp_service_utilities
        - cp_service_presentation
      output: "evidenced attributed-burden ledger"
      source_ids:
        - pcr-live-aquaculture-method
  data_quality_requirements:
    - id: dq_trace
      applies_to: "all nodes"
      requirement: "Cover each actual source stage and parent spawning event; match origin, count, mass, period, purpose and handovers, retaining source shares through pooling."
      evidence: "cp_stock_broodstock_hatch; cp_stock_managed_rearing; cp_stock_harvest; cp_stock_holding; cp_stock_presentation event chain and supplier primary records"
    - id: dq_quantity
      applies_to: "all amounts"
      requirement: "Actual collected quantities take precedence; broad provisional ranges only screen outliers, never replace measurement, cap, clip or infer zero. Disclose sampling, factor and allocation uncertainty. For nondetects retain detection/quantification limits, censored-result method and bounds; never treat a nondetect as exact zero. Link final-outfall samples to source-stage events, measured flow/duration and original units."
      evidence: "calibration, sampling and outlier review"
    - id: dq_sources
      applies_to: "all supplier and release records"
      requirement: "Check period, site, technology, species/stage and unit match; historical FAO examples support qualitative process understanding only, not current dosage, survival, stocking or feed-factor defaults."
      evidence: "evidence applicability assessment; method and supplier boundaries"
    - id: dq_complete
      applies_to: "all selected nodes"
      requirement: "Distinguish actual non-use, measured zero and missing data; identify release media, treatment fate and shared consumers; missing data never auto-fill zero."
      evidence: "cp_water_utilities; cp_water_residuals, cp_release_utilities; cp_release_residuals, cp_residual_residuals and shared matrix"
