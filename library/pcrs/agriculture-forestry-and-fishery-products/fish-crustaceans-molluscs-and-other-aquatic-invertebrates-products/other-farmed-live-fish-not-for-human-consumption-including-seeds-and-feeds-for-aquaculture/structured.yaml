  classification_refs: "cpc:3.0:04192 (narrower)"
  covered_products: "Managed-production live fish; one declared aquaculture seed, broodstock or live-fish-feed purpose"
  excluded_products: "Ornamental, direct-food, research-only or recreational-bait fish; merely held wild fish; dead feed, meal/oil; final eggs/gametes; nonfish organisms"
  representative_product: "Qualified viable cohort of actual specified species and life stage at producer handover"
  production_route: "Owned reproduction/hatchery or actual purchased upstream stage → post-hatch managed rearing only when performed → independent collection from the last actual owned production node → actual bounded live holding → live presentation and handover; suitable seed may pass directly from hatchery to collection without fictitious rearing; spawning parent broodstock_hatch; water-system parent managed_rearing"
  market_state: "Viable live at handover, net wet biomass excluding carrier water, oxygen, packaging and nonqualifying dead fish"
functional_unit:
  what: "Farmed viable live fish of declared aquaculture purpose, species and stage at producer handover"
  how_much: "1 kg net viable wet fish biomass; actual count and representative individual mass accompany it"
  how_well: "Seed: declared stocking stage and health/fitness; broodstock: actual sex, maturity and reproductive fitness; live-fish feed: actual recipient cultured organism and feed suitability; kilograms alone do not establish equivalence"
  how_long_or_cycle: "Complete actual cohort cycle and handover period, including applicable parent establishment, repeated spawning cycles, replacement/retirement and opening/closing burden carryover"
  reference_flow_link: "aquaculture_live_handover"
system_boundary:
  rules:
    - rule_id: b_origin
      applies_to: "product_scope"
      rule: "Require documented managed production and one aquaculture purpose/life-stage cohort; mere live holding of wild fish remains outside this farmed PCR."
      source_ids:
        - un-cpc-3-2025
        - pcr-live-aquaculture-method
    - rule_id: b_owned_purchased
      applies_to: "broodstock_hatch; managed_rearing"
      rule: "Identify every owned/purchased stage and upstream origin. A purchased stage replaces its actual upstream activities with a compatible supplier dataset; it never removes their burdens or duplicates owned reproduction."
      source_ids:
        - fao-seed-production
        - pcr-live-aquaculture-method
    - rule_id: b_phase_end
      applies_to: "broodstock_hatch; managed_rearing"
      rule: "End actual managed production at the declared suitable live stage. When no separate post-hatch rearing occurs and seed stage/fitness is evidenced, larvae/fry pass directly from hatchery to collection without mandatory rearing, nursery or growout. Require actual owned hatchery or rearing production; merely purchasing finished fish for trading or holding is not this production route. Retain all hatchery burdens; broodstock requires actual maturity/fitness and feed fish actual recipient/use suitability."
      source_ids:
        - pcr-live-aquaculture-method
    - rule_id: b_deltas
      applies_to: "broodstock_hatch; managed_rearing"
      rule: "Spawning alternatives attach to broodstock_hatch; water-system alternatives attach to managed_rearing. Current event records and site topology must demonstrate changed resource, calculation and verification categories. Do not add duplicate biological outputs for alternative labels."
      source_ids:
        - fao-seed-production
        - ifas-ras-health
        - pcr-live-aquaculture-method
    - rule_id: b_responsibility
      applies_to: "harvest; holding; presentation"
      rule: "Collection independently removes the selected cohort from production. Any bounded holding maintains the actual usable live state; presentation protects and hands over that same live fish. Preserve each internal mass/count and source cohort; omit a conditional node only with actual non-use evidence."
      source_ids:
        - fao-live-fish-handling
        - pcr-live-aquaculture-method
    - rule_id: b_complete
      applies_to: "all selected nodes"
      rule: "Include actual feed, fertilisation, reproduction/health materials, water, pumping/aeration/light electricity, heat, fuel, oxygen, chemicals, packaging and losses. Central utilities/residuals records retain originating stage, run and period; no selected stage becomes resource-free."
      source_ids:
        - pcr-live-aquaculture-method
    - rule_id: b_period_assets
      applies_to: "broodstock_hatch; utilities"
      rule: "Enumerate parent establishment, each spawning cycle, replacement/retirement, fish cohort phases, opening/closing stock, asset service periods and consumers. Carry attributable burdens forward with standing stock and reconcile terminal fates; disclose any asset cut-off and sensitivity."
      source_ids:
        - pcr-live-aquaculture-method
    - rule_id: b_gate
      applies_to: "presentation"
      rule: "Include actual owned packing/loading and own transport only to the explicitly declared first producer handover. Exclude subsequent recipient transport, stocking, growout, feeding/use and downstream packaging fate; disclose supplier and treatment boundary interfaces."
      source_ids:
        - pcr-live-aquaculture-method
    - rule_id: b_streams
      applies_to: "residuals"
      rule: "Classify each source-stage mortality, escaped fish, nonviable egg, culture waste, solids, treatment sludge, effluent, chemical and refrigerant event. Separate external treatment handoff from direct environmental release and retain upstream loss burdens; no unobserved zero or automatic avoided credit."
      source_ids:
        - pcr-live-aquaculture-method
boundary_abstraction:
  declared_starting_condition: "Actual parent establishment or purchased eggs, larvae, fry or other upstream fish stage, with real origin and corresponding upstream-data interface"
  starting_condition_role: "Evidenced stage boundary, never a zero-burden starting point"
  product_classification_scope: "Narrower aquaculture seed, broodstock or live-fish-feed subset of CPC 04192; final fish must be hatched and viable"
  recursive_input_rule: "For same-category purchased fish record actual stage, origin, quantity and supplier dataset reference; model upstream separately to avoid infinite recursion and duplicate owned stages without deleting real upstream burden"
  upstream_dataset_requirement: "Supplier data must match species, stage, purpose, site/geography, period, technology and attribution; disclose and remedy gaps, never default to free input"
  disclosure: "All owned/purchased stages, actual life stage, spawning/water-system parent deltas, cohort periods/carryover, shared consumers, viable holding/packing and first producer handover"
