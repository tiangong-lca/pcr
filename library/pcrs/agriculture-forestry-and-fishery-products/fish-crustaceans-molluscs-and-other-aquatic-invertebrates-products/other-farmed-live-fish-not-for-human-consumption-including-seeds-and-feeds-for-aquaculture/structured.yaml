    role: "supporting biological production"
    quantitative_reference: "actual edible live-food biomass transferred to fish stages"
  - id: managed_rearing
    name: "Selected managed fish rearing"
    inclusion: "conditional"
    inclusion_condition: "Separate post-hatch larval, fry, nursery or later rearing actually occurs; missing records do not justify omission, and actual hatchery-only seed does not create this phase"
