    name: "Live cohort collection"
    inclusion: "required"
    inclusion_condition: "Collection from the last actual owned production node: managed_rearing when performed, or directly broodstock_hatch for actual hatchery-only seed"
    role: "independent harvest"
    quantitative_reference: "actual collected viable fish handed to holding or presentation"
  - id: holding
    name: "Bounded live holding and acclimation"
    inclusion: "conditional"
    inclusion_condition: "Collected fish undergo an actual pre-handover viability-maintenance intervention"
    role: "preservation stabilization"
    quantitative_reference: "actual viable fish after bounded holding"
  - id: presentation
    name: "Live presentation and producer handover"
    inclusion: "required"
    inclusion_condition: "First producer handover, including packaging/loading only when performed"
    role: "packaging and presentation"
    quantitative_reference: "qualifying live fish at producer handover"
  - id: utilities
    name: "Stage-linked utilities and direct releases"
    inclusion: "required"
    inclusion_condition: "Record actual resources for every selected foreground node"
    role: "shared utility ledger"
    quantitative_reference: "resources attributed once to each actual consuming node"
  - id: residuals
    name: "Stage-linked effluent and residual management"
    inclusion: "conditional"
    inclusion_condition: "Any actual effluent, mortality, solids, escape, leakage or treatment event occurs"
    role: "residual fate and treatment"
    quantitative_reference: "actual treatment handoffs or direct environmental releases"
