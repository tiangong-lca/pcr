      applies_to: "nodes"
      rule: "Nodes are responsibility boundaries, not an imposed clock sequence or separate buildings. Record the actual lot path, time/temperature and paired transfers, allowing early chilling and washing bypass. Capture is independent of cleaning, sort, preservation and presentation; no natural pre-capture feeding/growth or marine respiration is farm foreground production."
