validation_rules:
  - rule_id: validate_selection
    applies_to: "reference lot"
    rule: "Require verified species, wild origin, hand-jig method, actual area, raw whole ungutted final state, actual chilling/never-frozen record and non-live accepted reference state. Reject mixed/unidentified Loligo, L. forbesii, L. reynaudii, cuttlefish, trawl/mechanical-jigger, live, cleaned/cut, frozen/thawed or deliberately ink-extracted reference lots. These are PCR selection exclusions, not assertions of their CPC classification."
    source_ids:
      - fao-cephalopods-2010
  - rule_id: validate_handling
    applies_to: "condition"
    rule: "Document actual capture-to-chill interval, time/temperature history, cooling system, wash state, injury/ink loss and acceptance specification. This PCR sets no universal shelf life, ice ratio, food-safety/legal certification or ready-to-eat claim. Missing chilling evidence cannot default to chilled."
    source_ids:
      - fao-torry-squid
  - rule_id: validate_mass
    applies_to: "measurement"
    rule: "Verify calibrated drained net animal mass, same-lot transfer reconciliation and actual state at each gate; exclude packaging and free ice/water, retain native whole tissues, and separately reconcile incidental losses. Keep water withdrawal/discharge/consumption and bulk effluent/substance loads separate."
    source_ids: []
  - rule_id: validate_ownership
    applies_to: "ledgers"
    rule: "Check one node-specific protocol per card, every intended grade/destination, all period/phase/shared-event owners, actual failed trips, stocks and carryover; pair actual internal animal/water/residual transfers with matching states and no duplicated upstream service, asset or emission. Unresolved treatment/replacement/termination or attribution blocks finalized data."
    source_ids: []
  - rule_id: validate_identity_range
    applies_to: "exchanges and ranges"
    rule: "Resolve every actual exchange to an independently confirmed concrete flow/property/unit before final dataset use. Provisional row-specific U bounds require independent evidence and approval before screening; they are unresolved evidence needs, not empirical limits or defaults. A checker pass alone is not identity, quantity, translation or publication verification."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable collection requirements and concrete inventory exchanges"
    rule: "Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for the selected wild hand-jig squid boundary"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Compatible species/route/state/gate datasets after actual exchange verification and foreground completeness review"
  excluded_use: "Other species/gear; farmed/live/frozen/thawed/processed lots; ecological stock or safety certification; extrapolation to all CPC 04461"
  required_metadata: "All reference qualifiers, real operator/supplier split, node/period/asset/consumer and attribution boundaries"
  required_quality_disclosure: "Missing concrete flow/support identities, measured coverage, provisional U status, treatment/lifetime/attribution uncertainties and source limits"
  update_trigger: "Species/source/gear/state/gate change; new verified supply/UUID/unit or empirical evidence; altered period/assets/allocation/chilling handling"
data_sources:
  - id: "fao-cephalopods-2010"
    type: "official_guidance"
    reference: "FAO Species Catalogue for Fishery Purposes No. 4, Vol. 2 (2010), printed pp. 40–42 and species distinction on p. 43; https://www.fao.org/4/i1920e/i1920e02.pdf"
    used_for: "Qualitative species distinction, geographic context and documented small-scale hand-jig route; not actual lot catch, stock/yield or gear impact quantities"
  - id: "fao-torry-squid"
    type: "official_guidance"
    reference: "FAO-hosted Torry Advisory Note, Squid, Handling and stowage / Processing; https://www.fao.org/4/x5948e/x5948e01.htm"
    used_for: "Qualitative external washing/ice/whole-ungutted chilled handling and damage observations only; no inherited ice ratio, storage days, composition or safety guarantee; not evidence that every hand-jig lot follows this route"
