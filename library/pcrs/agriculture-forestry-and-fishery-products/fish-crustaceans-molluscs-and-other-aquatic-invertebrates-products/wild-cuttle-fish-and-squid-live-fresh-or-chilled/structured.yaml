          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\nWhen a conditional umbrella instantiates multiple actual identities, each material/state/property/unit exchange requires its own independent U; do not copy one card bound across distinct exchanges or their sum.\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `allocation_physical_first` | all nodes | First reconcile a physical ledger by unique event, node, trip, lot and period: input, output, transfers, released/dead/rejected animals, stock change and losses. Only then attribute resources/burdens to the intended output set with a documented decision. A normalized attributed amount is not the whole-trip physical quantity. |  |\n| `allocation_outputs` | intended products | Enumerate every independently intended retained species/grade, quantity and real handoff once. Avoid allocation by measured subdivision where supported; otherwise justify the actual physical relationship, and only if unsuitable use a transparently justified economic or other method with period/grade evidence and sensitivity. No default prices, universal mass split, discard credit or reclassification of waste as a valuable product to improve results. |  |\n| `allocation_shared_period` | shared assets and periods | Assign one owner to each shared resource/event across all actual consumers, trips and phases. Document service-life evidence, utilization, replacement, repair and termination; allocate full-period burden including zero-output/idle/support activity with justified cross-period linkage. Preserve unresolved lifetime or denominator as a data gap. Opening/closing stock and carryover must not receive the same burden twice. |  |\n| `allocation_internal` | internal transfers | Pair actual animal, water and contained-residual transfers before attribution; internal animal feed is its measured mass, never automatically the final 1 kg. Transfer inherited burdens once without repurchase, new environmental withdrawal, co-product creation or automatic substitution credit. Captured biomass and ecological observations remain distinct from attributed technosphere products. |  |\n\n"
