allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "When a conditional umbrella instantiates multiple actual identities, each material/state/property/unit exchange requires its own independent U; do not copy one card bound across distinct exchanges or their sum."
    source_ids: []
  - rule_id: allocation_physical_first
    applies_to: "all nodes"
    rule: "First reconcile a physical ledger by unique event, node, trip, lot and period: input, output, transfers, released/dead/rejected animals, stock change and losses. Only then attribute resources/burdens to the intended output set with a documented decision. A normalized attributed amount is not the whole-trip physical quantity."
    source_ids: []
  - rule_id: allocation_outputs
    applies_to: "intended products"
    rule: "Enumerate every independently intended retained species/grade, quantity and real handoff once. Avoid allocation by measured subdivision where supported; otherwise justify the actual physical relationship, and only if unsuitable use a transparently justified economic or other method with period/grade evidence and sensitivity. No default prices, universal mass split, discard credit or reclassification of waste as a valuable product to improve results."
    source_ids: []
  - rule_id: allocation_shared_period
    applies_to: "shared assets and periods"
    rule: "Assign one owner to each shared resource/event across all actual consumers, trips and phases. Document service-life evidence, utilization, replacement, repair and termination; allocate full-period burden including zero-output/idle/support activity with justified cross-period linkage. Preserve unresolved lifetime or denominator as a data gap. Opening/closing stock and carryover must not receive the same burden twice."
    source_ids: []
  - rule_id: allocation_internal
    applies_to: "internal transfers"
    rule: "Pair actual animal, water and contained-residual transfers before attribution; internal animal feed is its measured mass, never automatically the final 1 kg. Transfer inherited burdens once without repurchase, new environmental withdrawal, co-product creation or automatic substitution credit. Captured biomass and ecological observations remain distinct from attributed technosphere products."
    source_ids: []
