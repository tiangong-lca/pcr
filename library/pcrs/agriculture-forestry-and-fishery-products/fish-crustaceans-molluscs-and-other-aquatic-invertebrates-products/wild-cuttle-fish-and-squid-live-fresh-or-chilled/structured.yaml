      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual selected wild stock in its natural marine habitat immediately before capture; purchased upstream supplies retain their own production burdens |\n| starting_condition_role | Natural capture context, not an unburdened purchased animal or managed production cycle |\n| product_classification_scope | CPC 3.0 04461 is broader than this species/gear/state/gate subset |\n| recursive_input_rule | No purchased same-category animals in the reference lot. Trace actual internal animal transfers by lot and inherited burden once; purchased catch requires another compatible foreground boundary, not recursion into this wild capture |\n| upstream_dataset_requirement | Verified supply geography/technology/period/native unit and declared inclusive boundary; explicit gaps for missing capital, maintenance, energy, water, ice, materials or waste treatment |\n| disclosure | Declare real species, source, route, lot path, chilling, handover, operator/service split, all periods/phases/assets/consumers, allocation, omitted flows and uncertainty |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `boundary_state` | scope | Only actual wild Loligo vulgaris small-vessel hand-jig lots from the eastern Atlantic/Mediterranean and raw whole chilled never-frozen final state qualify. Disclose actual fishing area, method, species identification and handling sequence; do not infer species from a mixed squid invoice. | `fao-cephalopods-2010` |\n| `boundary_gate` | handover | End at the first harvester physical recipient acceptance, including actual pre-acceptance shore movement and chilling. Invoice date, ownership transfer or a later buyer process is not this gate. Buyer subsequent cutting, freezing, retail preparation and use are excluded. |  |\n| `boundary_responsibility` | operations | Direct foreground operation means operational/resource responsibility, regardless of legal asset title. Separately inventory its actual resources and direct releases; for supplier-inclusive services select an adequate upstream dataset and exclude already included fuel, electricity, assets, water and emissions. Document omissions and incomplete coverage, never silently assume zero. |  |\n| `boundary_handling` | nodes | Nodes are responsibility boundaries, not an imposed clock sequence or separate buildings. Record the actual lot path, time/temperature and paired transfers, allowing early chilling and washing bypass. Capture is independent of cleaning, sort, preservation and presentation; no natural pre-capture feeding/growth or marine respiration is farm foreground production. | `fao-torry-squid` |\n| `boundary_water_residuals` | water and waste | Own environmental withdrawal once at its real crossing; usable internal water transfers and contained residual transfers require matching real sender/receiver cards, quantities, transfer ids and stocks. Same-node circulation/storage stays in subledgers. Assign actual direct treatment resources/releases to its unique operating node and supplier treatment to one external handler; no duplicate bulk wastewater or pollutant mass. |  |\n| `boundary_water_owners` | water responsibilities | Assign actual water handling and contained-effluent custody, including vessel/container cleaning, to the washing, chilling or presentation operating responsibility by actual event and state, not legal asset title. Capture, sorting and handover residual-custody cards cover non-aqueous material only. Record actual water-treatment inputs and final releases once at the real water-handling owner; do not imply that intermediate custody itself is treatment. An actual operation not represented by these responsibility boundaries requires explicit foreground extension/review, not an assumed zero. |  |\n| `boundary_periods` | reporting coverage | Declare all trips and reporting periods, including unsuccessful trips, support returns, idle work, cleaning, repairs, opening/closing stocks and carryover. Shared vessel, gear, cold facilities, docks and containers require construction/use/repair/termination coverage and every consumer/period; no assumed universal lifetime. |  |\n\n"
