      applies_to: "operations"
      rule: "Direct foreground operation means operational/resource responsibility, regardless of legal asset title. Separately inventory its actual resources and direct releases; for supplier-inclusive services select an adequate upstream dataset and exclude already included fuel, electricity, assets, water and emissions. Document omissions and incomplete coverage, never silently assume zero."
