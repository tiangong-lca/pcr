      temporal_coverage: "Full declared period, opening/closing stocks, relevant prior/next carryover and asset phases"
      site_scope: "Whole-product presentation and packaging operating responsibility only; identify actual vessel/shore site and all shared consumers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare; species/route/chilling/acceptance evidence; complete trip/period/asset logs; paired transfer reconciliation; reviewed emission/native-unit/attribution assumptions; independent U evidence"
    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "All actual cards owned by this node"
      record_type: "Physical event and stock ledger"
      raw_fields: "event_id; lot_id; trip_id; period/phase; species/state; time/temperature; animal net mass/tare; actual inputs/outputs/native units; sender/receiver/transfer_id; water/residual destination; direct/provider flag; asset_id/consumers/life/repair/termination; zero-output/idle/support events; stock opening/closing; attribution evidence; independent U approvals"
      collection_method: "Weigh same-lot animals on calibrated scales; use traceable meters, fuel/ice/material receipts, observation/identification, waste transfer and service/asset records. Capture records distinguish hand operation, actual lights and non-target releases; washing/chilling record sources, prechill and actual water/ice route; handover records recipient physical acceptance. Separately verify each native property and substance/receiving medium; no quantity inferred from a UUID."
      unit: "kg; MJ; each verified native unit"
      frequency: "Every event/transfer, each trip/lot; reconcile the complete period"
      temporal_coverage: "Full declared period, opening/closing stocks, relevant prior/next carryover and asset phases"
      site_scope: "Pre-acceptance movement and physical handover operating responsibility only; identify actual vessel/shore site and all shared consumers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare; species/route/chilling/acceptance evidence; complete trip/period/asset logs; paired transfer reconciliation; reviewed emission/native-unit/attribution assumptions; independent U evidence"
  calculation_rules:
    - id: physical_reconciliation
      applies_to: "all node ledgers"
      rule: "Reconcile inputs + opening stock with outputs + closing stock + recorded losses by actual event/material; retain separate whole physical totals and product-attributed values, actual natural crossing and paired internal transfers."
      inputs:
        - "Node-specific protocols"
        - stocks
        - "transfer ids"
        - "loss evidence"
      output: "Reconciled physical ledger"
      source_ids: []
    - id: attributed_reference
      applies_to: "all non-reference inventory rows"
      rule: "After independently reviewed product/period/shared-event attribution, divide each resulting attributable exchange amount by the accepted drained net reference mass in kg; retain the raw whole-period quantity and decision separately."
      inputs:
        - "Node protocols"
        - "accepted drained net mass"
        - "attribution decision"
      output: "Exchange amount per 1 kg reference flow"
      source_ids: []
    - id: electricity_conversion
      applies_to: "electricity cards"
      rule: "Convert measured electricity kWh to MJ with factor 3.6; preserve original meter units and avoid counting onboard fuel generation as a new supplied purchase."
      inputs:
        - "Actual kWh meter and unit relation"
      output: "Actual electricity MJ"
      source_ids: []
  data_quality_requirements:
    - id: dq_selection
      applies_to: "reference lot"
      requirement: "Species, wild hand-jig route, actual mortal state, whole/ungutted chilled/never-frozen and gate must be evidenced, not inferred from broad squid names."
      evidence: "Identification, trip/gear, temperature/state and acceptance records"
    - id: dq_coverage
      applies_to: "periods, assets and emissions"
      requirement: "Complete period, failed trips, shared consumers, stocks/carryover and lifetime phases; distinguish supplier-inclusive from direct operation and substance mass from carrier bulk."
      evidence: "Event/asset/service ledgers and reconciliation; actual fuel/composition and emission evidence"
    - id: dq_uncertainty
      applies_to: "all identities and Range bounds"
      requirement: "Disclose missing identities/support, unmeasured exchanges, uncertain attribution, treatment or lifetime and each unapproved U; never replace missing records with zero or an author estimate."
