      rule: "Only actual wild Loligo vulgaris small-vessel hand-jig lots from the eastern Atlantic/Mediterranean and raw whole chilled never-frozen final state qualify. Disclose actual fishing area, method, species identification and handling sequence; do not infer species from a mixed squid invoice."
