      applies_to: "water and waste"
      rule: "Own environmental withdrawal once at its real crossing; usable internal water transfers and contained residual transfers require matching real sender/receiver cards, quantities, transfer ids and stocks. Same-node circulation/storage stays in subledgers. Assign actual direct treatment resources/releases to its unique operating node and supplier treatment to one external handler; no duplicate bulk wastewater or pollutant mass."
      source_ids: []
    - rule_id: boundary_water_owners
      applies_to: "water responsibilities"
      rule: "Assign actual water handling and contained-effluent custody, including vessel/container cleaning, to the washing, chilling or presentation operating responsibility by actual event and state, not legal asset title. Capture, sorting and handover residual-custody cards cover non-aqueous material only. Record actual water-treatment inputs and final releases once at the real water-handling owner; do not imply that intermediate custody itself is treatment. An actual operation not represented by these responsibility boundaries requires explicit foreground extension/review, not an assumed zero."
