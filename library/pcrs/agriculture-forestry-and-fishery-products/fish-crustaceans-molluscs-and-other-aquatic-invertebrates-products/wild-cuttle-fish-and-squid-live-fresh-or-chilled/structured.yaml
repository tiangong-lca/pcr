      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `validate_selection` | reference lot | Require verified species, wild origin, hand-jig method, actual area, raw whole ungutted final state, actual chilling/never-frozen record and non-live accepted reference state. Reject mixed/unidentified Loligo, L. forbesii, L. reynaudii, cuttlefish, trawl/mechanical-jigger, live, cleaned/cut, frozen/thawed or deliberately ink-extracted reference lots. These are PCR selection exclusions, not assertions of their CPC classification. | `fao-cephalopods-2010` |\n| `validate_handling` | condition | Document actual capture-to-chill interval, time/temperature history, cooling system, wash state, injury/ink loss and acceptance specification. This PCR sets no universal shelf life, ice ratio, food-safety/legal certification or ready-to-eat claim. Missing chilling evidence cannot default to chilled. | `fao-torry-squid` |\n| `validate_mass` | measurement | Verify calibrated drained net animal mass, same-lot transfer reconciliation and actual state at each gate; exclude packaging and free ice/water, retain native whole tissues, and separately reconcile incidental losses. Keep water withdrawal/discharge/consumption and bulk effluent/substance loads separate. |  |\n| `validate_ownership` | ledgers | Check one node-specific protocol per card, every intended grade/destination, all period/phase/shared-event owners, actual failed trips, stocks and carryover; pair actual internal animal/water/residual transfers with matching states and no duplicated upstream service, asset or emission. Unresolved treatment/replacement/termination or attribution blocks finalized data. |  |\n| `validate_identity_range` | exchanges and ranges | Resolve every actual exchange to an independently confirmed concrete flow/property/unit before final dataset use. Provisional row-specific U bounds require independent evidence and approval before screening; they are unresolved evidence needs, not empirical limits or defaults. A checker pass alone is not identity, quantity, translation or publication verification. |  |\n| `validate_atomic_completion` | all applicable collection requirements and concrete inventory exchanges | Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg. | |\n\n"
