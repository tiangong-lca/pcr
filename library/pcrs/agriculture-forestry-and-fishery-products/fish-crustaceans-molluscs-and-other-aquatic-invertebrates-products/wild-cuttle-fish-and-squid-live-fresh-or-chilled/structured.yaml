    - rule_id: boundary_periods
      applies_to: "reporting coverage"
      rule: "Declare all trips and reporting periods, including unsuccessful trips, support returns, idle work, cleaning, repairs, opening/closing stocks and carryover. Shared vessel, gear, cold facilities, docks and containers require construction/use/repair/termination coverage and every consumer/period; no assumed universal lifetime."
