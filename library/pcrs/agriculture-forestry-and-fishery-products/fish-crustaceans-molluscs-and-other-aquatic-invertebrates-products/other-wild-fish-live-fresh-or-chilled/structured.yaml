    - id: dq_identity
      applies_to: "route and product"
      requirement: "Verify wild D. labrax, England inshore artificial-lure route and exact whole ungutted raw never-frozen chilled receipt; qualitative sources do not prove actual lot eligibility."
      evidence: "Trip/gear/species/state records and physical receipt"
    - id: dq_transfers
      applies_to: "T1-T8 and destinations"
      requirement: "Pair id/state/mass/owner, count and native units; reconcile each node including incidental matter, all intended alternatives, waste, release, open stock and actual conditional instances."
      evidence: "Paired ledgers and independently weighed destinations"
    - id: dq_ranges
      applies_to: "all cards"
      requirement: "Replace or quantify each symbolic U from primary data with uncertainty and scope; do not use 0..U as empirical evidence or a standard cap."
      evidence: "Measurements and uncertainty records for each instance"
    - id: dq_period
      applies_to: "periods/assets/services"
      requirement: "Retain failed/no-output trips, setup/cleanup, stocks, reuse, replacement/termination, all shared consumers, evidence-based service life and allocation sensitivity; avoid full-service/component duplication."
      evidence: "Complete period and service ledgers with shares and coverage"
    - id: dq_release
      applies_to: "waste and elementary outputs"
      requirement: "Verify actual treatment or direct destination, organism condition, chemical/particle and carbon basis/medium; quantity-factor evidence is separate from identity evidence."
