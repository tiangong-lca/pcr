      applies_to: "delivery; Outputs; Waste flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual pre-receipt waste or wastewater to specified management. Conditional actual spoiled/rejected fish, packaging and melt/cleanup wastewater sent to specified management before gate. Identify animal body mass separately from water/material, actual treatment and owner; recipient rejection alone is not evidence of waste. <br> - Flow property / unit: Mass / kg <br> - Amount rule: cp_delivery measured waste mass per material/destination instance divided by A <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_delivery <br> - Sources: same-lot-accounting-method <br> - Range: Unestablished pre-receipt-waste uncertainty <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_delivery_wastes_instance <br> - Unit: kg <br> - Basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: collect_delivery_releases
      applies_to: "delivery; Outputs; Elementary flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual pre-receipt substance directly released to specified environment. Conditional actual water or individually identified exhaust, leakage or cleanup pollutant to specified medium. Retain chemical/particle and fossil/biogenic carbon basis and factor evidence; exclude emissions covered in complete transport or other service. Do not assume water use means pollutant discharge. <br> - Flow property / unit: Actual instance property / actual native unit <br> - Amount rule: cp_delivery measured direct-release instance quantity divided by A; calculated actual instances require separately declared formula/factor and calculated evidence metadata <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Route-specific (route_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_delivery <br> - Sources: same-lot-accounting-method <br> - Range: Unestablished pre-receipt-release uncertainty <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_delivery_releases_instance <br> - Unit: actual native unit <br> - Basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: dq_logistics_water_balance
      applies_to: "logistics, services and water/nutrient balances"
      requirement: "Actual payload includes accompanying water, ice, packaging and other cargo. Empty return/repositioning still consumes activity: account for its actual fuel/distance/vehicle service and explicit attribution; zero cargo tonne-kilometres cannot erase that duty. Do not duplicate a complete service and covered fuel, materials, assets or direct releases. Measure external abstraction, supplied water product, internal circulation and actual returned/discharged water separately; never deduct internal recirculation again from external intake. Net nutrient increment/retention is a separate balance diagnostic, never automatically a negative elementary flow, negative emission or avoided burden."
      evidence: "Actual load/vehicle duty records, service scope, same-lot water/substance balance and method evidence"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference eligibility"
    rule: "Require actual wild D. labrax, England inshore artificial-lure trolling and whole ungutted raw never-frozen chilled physical receipt. Excluded routes/states cannot be renamed to pass. No historical source proves current legal/safety status."
    source_ids:
      - seafish-trolling
      - cefas-bass-1996
      - marlin-seabass-2007
      - un-cpc3-fish-notes
  - rule_id: validate_reference
    applies_to: "accepted_seabass and cp_delivery"
    rule: "Require A > 0, calibrated net fish mass with all exclusions, same-lot A/A identity and reference-link/name/state agreement. Counts require actual same-lot mass evidence; never substitute packaged, gutted or generic fish mass."
    source_ids:
      - same-lot-accounting-method
  - rule_id: validate_nodes
    applies_to: "capture, sort, chill, present, delivery"
    rule: "Require each node and its native-unit protocol, T1-T8 paired physical transfers, actual grade/destination product outputs at every node, incidental matter, stock, loss, waste and direct-release reconciliation. Unknown occurrence is unresolved, not inactive. Chilling cannot be bypassed for this reference."
    source_ids:
      - same-lot-accounting-method
      - seafish-trolling
  - rule_id: validate_attribution
    applies_to: "trip/output/period/shared burdens"
    rule: "Require complete intended-output set, trip/lot boundaries, failed/no-output trips, cleanup/changeover, opening/closing stocks, all asset/service consumers/periods, replacement/termination evidence and rationale/sensitivity. Verify share sums and one event owner; no double handoff allocation or complete-service/component duplication."
    source_ids:
      - same-lot-accounting-method
  - rule_id: validate_evidence
    applies_to: "exchanges, Ranges and releases"
    rule: "Resolve actual instance identities/property/native units before final exchanges. Verify substance/species, receiving medium and chemical/carbon basis; treatment and direct release differ. A provisional U or checker pass does not prove empirical quantities, UUID verification or publication readiness."
    source_ids:
      - same-lot-accounting-method
  - rule_id: validate_atomic_completion
    applies_to: "all applicable per-flow collection obligations and final exchanges"
    rule: "Final dataset completion and validation require every actual exchange to have an independent atomic card and its own quantity, property/native unit, collection or calculation evidence, range/uncertainty evidence, normalization, actual destination and verified UUID. Unknown identity, activity state, quantity, range evidence or fate blocks completion; it is never zero, a presumed bypass or permission to omit an obligation. Every important concrete flow retains its own range/uncertainty evidence collection duty; a symbolic upper bound is not an empirical range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package with process/lifecyclemodel projections; secondary_dataset or background_dataset only after completed review and concrete exchange resolution"
  downstream_use: "Foreground data package with process/lifecyclemodel projections for the declared whole chilled fish route and physical gate"
  allowed_use: "Same species/origin/route/state/gate with documented transfer, native-unit, period and allocation compatibility"
  excluded_use: "Whole CPC-leaf claim; aquaculture or other species; live ornamental; natural bait/slurry; gutted/frozen/processed products; later distribution; safety, welfare, stock-status or legal certification"
  required_metadata: "Species; wild origin; geography/trip/gear; actual condition/count/grade; whole ungutted raw never-frozen chilled state; recipient/time; A exclusions and calibration; all logistics; periods/stocks/assets/reuse/shared shares; source and upstream coverage"
  required_quality_disclosure: "Data dates/sites, sampling/conversions, failed-trip treatment, unresolved identities/conditional states/U endpoints, quantity/factor evidence, service life/allocation rationale and sensitivity, completeness limits"
  update_trigger: "Changed species/route/state/gate, ice/presentation practice, upstream coverage, stock/asset/service periods, allocation/measurement evidence or authoritative classification/source revision"
data_sources:
  - id: "seafish-trolling"
    type: "official_guidance"
    reference: "Seafish, Fishing Gear Database: Trolling. https://www.seafish.org/responsible-sourcing/fishing-gear-database/gear/trolling/"
    used_for: "England inshore bass trolling, artificial-lure branch, individual hauling/unhooking and ice/slurry alternatives; selects ice-bed only; no no-bycatch/environmental-benefit assertion or quantitative rate"
  - id: "cefas-bass-1996"
    type: "literature"
    reference: "Eaton 1996, MAFF/Cefas Technical Report 103, printed pp. 6-7 (physical PDF pp. 7-8). https://www.cefas.co.uk/publications/techrep/tech103.pdf"
    used_for: "Historical iced and usually whole-ungutted bass landing context; not current universal practice, law, size, price or safety"
  - id: "marlin-seabass-2007"
    type: "literature"
    reference: "Reeve 2007, MarLIN Dicentrarchus labrax account, physical PDF pp. 3-4. https://www.marlin.ac.uk/assets/pdf/species/marlin_species_2127_2019-03-12.pdf"
    used_for: "Species and UK coastal/demersal context; gear depth does not reclassify species"
  - id: "un-cpc3-fish-notes"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 explanatory notes, 30 June 2025, group 04, printed p. 45 (physical PDF p. 45; zero-based page index 44). https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Narrower 04291 context and wild/ornamental/frozen/processed exclusions; not flow quantities"
  - id: "same-lot-accounting-method"
    type: "method_factor"
    reference: "PCR-defined same-lot net-body-mass, transfer and period/service accounting method, sections 3-9"
    used_for: "Positive A/A identity, measured transfer and stock balances, native-unit collection, output/period/service attribution rationale and sensitivity; no empirical yield, emission factor or lifetime"
