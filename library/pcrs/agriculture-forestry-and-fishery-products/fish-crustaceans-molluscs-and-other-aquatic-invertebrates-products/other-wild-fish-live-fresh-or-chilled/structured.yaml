allocation_rules:
  - rule_id: allocation_output
    applies_to: "all intended animal products"
    rule: "First subdivide separately measured target and other-species/grade/destination operations. For inseparable shared capture/run burdens use actual net animal mass shares across all intended outputs of that trip/period, with reason for physical relevance and sensitivity against actual economic shares where price/grade differences matter. Record all outputs and allocation sums, including capture/sort/chill/present/delivery alternates. Wastes, returns and residue receive explicit management burdens; no avoided-production credit. Do not allocate the same target burden once at internal T1-T6 and again at sale."
    source_ids:
      - same-lot-accounting-method
  - rule_id: allocation_trip
    applies_to: "batch trips and cleanup"
    rule: "Include failed and no-output trips, setup, changeover and cleanup in the declared capture reporting service pool; assign to actual intended outputs of that pool, not only successful selected trips. A zero accepted-mass pool cannot produce a per-kg result; retain burdens and disclose the gap. Keep stock-linked burdens with measured opening/closing stock, rather than discarding them."
    source_ids:
      - same-lot-accounting-method
  - rule_id: allocation_period
    applies_to: "multi-period stocks and assets"
    rule: "Carry opening fish/ice stocks with upstream burdens and use measured issue/closing ledgers. Allocate reusable container, vessel, gear and infrastructure manufacture/repair/replacement/termination over evidenced delivered service, actual use and periods. State service-life rationale, observed use, remaining service and sensitivity; no universal lifetime. Assign idle/failed periods explicitly and preserve balance between carried and current burdens."
    source_ids:
      - same-lot-accounting-method
  - rule_id: allocation_shared
    applies_to: "shared assets and complete services"
    rule: "Register each vessel, bin, landing facility or vehicle and all actual capture/sort/chill/present/delivery consumers and periods. Subdivide metered service first, otherwise use evidenced occupied capacity/time or activity with rationale and sensitivity. Shares sum to the full attributable service once. Complete upstream/contracted service has one owner and excludes its covered component energy, assets and direct releases from foreground duplication. Physical reuse transfers do not recreate manufacture burdens."
    source_ids:
      - same-lot-accounting-method
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "all capture cards and actual instances"
      record_type: "trip log, weighing, supplier/asset record and release observation"
      raw_fields: "trip/lot/time/location; species/condition/count/body mass; artificial-lure gear; inputs/native units/providers; T1/T2/T3 state/quantity/owner; alternates/returns/wastes; chemical/medium/carbon basis; failed trips; cleanup; asset service/repair/replacement/period shares; A receipt link"
      collection_method: "Observe hauling/unhooking and all actual destinations; weigh net bodies and incidentals separately with calibrated tare-corrected scales, preserve species/count/state; meter supplies/services and reconcile invoices, service coverage, emissions evidence and period asset ledger"
      unit: "kg for biomass/material; each resolved instance native unit for energy/service/release"
      frequency: "every trip, handoff, input, release and service event"
      temporal_coverage: "complete declared reporting period including failed trips and opening/closing stock"
      site_scope: "actual England inshore vessel and landing/capture node"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated scales/meters; species/trip evidence; paired transfer records; supplier coverage; destination and factor evidence; service-life rationale/sensitivity"
    - protocol_id: cp_sort
      process_id: "sort"
      flow_role: "all sorting cards and actual instances"
      record_type: "paired receipt, grade/destination log and node supply/waste records"
      raw_fields: "lot/time; T1/T2/T3 state/quantity/owner; species/count/net mass/grade; T4; alternative product/stock recipient; release species/condition or chemical/medium; waste treatment; supplies/native units; cleanup/shared-service share; A receipt link"
      collection_method: "Confirm incoming paired quantities without new abstraction; observe actual sorting and destinations, weigh retained/alternate/rejected bodies and incidentals separately, meter actual node inputs and retain treatment/release and shared-service evidence"
      unit: "kg for biomass/material; each resolved instance native unit for energy/service/release"
      frequency: "every lot, grade/destination and node event"
      temporal_coverage: "all lots and sorting cleanup in declared period including failed/rejected lots"
      site_scope: "actual vessel/landing sorting responsibility"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "custody confirmations; calibration; grade criteria and destination receipts; loss/stock reconciliation; actual conditional-state records"
    - protocol_id: cp_chill
      process_id: "chill"
      flow_role: "all chilling cards and actual instances"
      record_type: "paired fish intake, ice/state/time ledger and node service/waste record"
      raw_fields: "lot/time; T4/T5 body state/mass/count/owner; fresh/opening/added/remaining ice; T8 material/container ids/masses; actual state/time observations; alternatives/stock; meltwater/treatment or direct chemical/medium releases; supplies/native units; shared equipment/cleanup periods; A receipt link"
      collection_method: "Weigh fish and ice separately, confirm ice-bed intervention and actual time/state without prescribing thresholds; measure remaining ice/carriers and melt/residue destinations, meter node supplies and reconcile supplier ice coverage and service shares"
      unit: "kg for fish/ice/material; each resolved instance native unit for energy/service/release"
      frequency: "each lot, ice addition, handoff, cleanup and destination event"
      temporal_coverage: "complete lot chilling and associated stock/service periods"
      site_scope: "actual ice-bed chilling responsibility"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated tare scales; time/state records; ice supplier coverage; paired T4/T5/T8; treatment/release and stock/service evidence"
    - protocol_id: cp_present
      process_id: "present"
      flow_role: "all presentation cards and actual instances"
      record_type: "paired intake, packing/material ledger and actual destination records"
      raw_fields: "lot/time; T5/T6 body state/count/mass; T8/T7 carrier/ice id/state/mass/owner; new materials/empty item mass/count/reuse; service/native units; alternatives/stock/waste/direct chemical/medium releases; cleanup/replacement/shared shares; A receipt link"
      collection_method: "Confirm paired inputs, weigh net fish independently of package/ice, weigh each carrier/material and count/empty-item conversion, observe protection and actual destinations; meter node operation/cleanup with service coverage and reuse ledger"
      unit: "kg for body/material; each resolved instance native unit for energy/service/release"
      frequency: "every lot, material addition, handoff and cleanup/reuse event"
      temporal_coverage: "complete presentation lot and attributed reusable-service periods"
      site_scope: "actual protective presentation responsibility"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated weights; pack/container ids and material records; paired T5/T6/T7/T8; destination/stock evidence; service-life rationale and sensitivity"
    - protocol_id: cp_delivery
      process_id: "delivery"
      flow_role: "all logistics and actual accepted reference output"
      record_type: "route/custody, calibrated acceptance weighing and node supply/service/release record"
      raw_fields: "lot/time; T6/T7 state/quantity/owner; every pre-receipt leg/operator/payer; loaded mass/distance/load share/empty return; waiting/chilled custody; first physical recipient/time; accepted net fish mass A/species/count/grade/state/tare; ice/water/package exclusions; alternatives/stock/carrier returns/waste/direct substance/medium/carbon basis; native units/service coverage; asset/cleanup periods"
      collection_method: "Trace every actual leg to physical custody, not invoice alone; weigh accepted whole ungutted fish on calibrated tare-corrected scales excluding ice/free water/package/incidentals; reconcile same-lot count/state and all rejected/diverted fish, carriers, ice and actual service/release quantities"
      unit: "kg for A/body/material; each resolved instance native unit including kWh/MJ/tkm/service units"
      frequency: "each leg, lot, acceptance, carrier destination and node event"
      temporal_coverage: "all pre-receipt times and attributed service periods including no-acceptance lots"
      site_scope: "actual route through first physical fish-product recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "recipient custody and calibrated net weights; complete route; paired T6/T7; condition/count/grade records; supplier coverage; native-unit and destination balance; service rationale/sensitivity"
  calculation_rules:
    - id: same_lot_reference
      applies_to: "accepted_seabass"
      rule: "Accepted same-lot net body mass A divided by the same positive A gives 1 kg reference flow; retain raw A and exclusions."
      inputs:
        - A
        - cp_delivery
      output: "1 kg reference flow"
      source_ids:
        - same-lot-accounting-method
    - id: instance_attribution
      applies_to: "shared resource, emission, service and asset burdens in the LCA view"
      rule: "After physical reconciliation, directly assign dedicated burdens and apply the justified Section 7 shares only to residual shared burdens, once across nodes, periods and intended outputs. Divide that attributable LCA burden by positive same-lot A. Do not multiply physical animal transfers, intended-output quantities, carrier/package transfers, stock changes or destination-specific loss quantities by co-product burden shares; preserve those raw physical ledgers and normalize each measured quantity by A separately. Paired physical transfers retain the same quantity/state in both nodes. Do not normalize a zero-acceptance pool."
      inputs:
        - "actual event quantity"
        - "node/period/output shares"
        - A
        - "owning protocol"
      output: "attributed native quantity per 1 kg reference flow"
      source_ids:
        - same-lot-accounting-method
    - id: count_conversion
      applies_to: "animal and packaging count conversions"
      rule: "Use measured same-lot representative body or empty-item mass with actual count and sampling uncertainty; preserve independently measured net receipt mass as denominator."
      inputs:
        - "observed count"
        - "measured same-lot sample mass"
        - "sampling scope"
        - "owning protocol"
      output: "body/material mass and conversion uncertainty"
      source_ids:
        - same-lot-accounting-method
