      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Wild D. labrax in the England inshore capture environment; actual voyage, vessel and artificial-lure gear records; opening stocks and supplied inputs declared |\n| starting_condition_role | Wild resource context rather than a burden-free purchased fish input; natural growth outside managed production |\n| product_classification_scope | Narrower wild whole chilled D. labrax route within cpc:3.0:04291; demersal species context independent of near-surface gear operation |\n| recursive_input_rule | Purchased or transferred fish already captured are technosphere inputs with upstream burdens and origin records; no repeated elementary capture. Such inputs cannot replace proof of this selected wild capture route. |\n| upstream_dataset_requirement | Trace upstream supply for actual fuel, electricity, ice, gear, containers, cleaning, assets and contracted services; state provider, geography, time and complete-service coverage |\n| disclosure | Declare every site, vessel, trip, lot, physical handoff, period, input route, conditional instance, unresolved measurement and allocation decision; no invoice-only gate |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| `boundary_route` | capture and sorting | Start with wild removal by artificial-lure trolling, individual hauling/unhooking and actual sorting of target animals, other animals and incidental matter. Retained target goes through required ice-bed chilling; each grade, alternative destination, released animal and waste has its actual handoff. Capture is independent of growth and conditioning. | seafish-trolling; cefas-bass-1996 |\n| `boundary_chill` | chilling and presentation | Record usable pre-chill retained fish and actual whole chilled output separately. Ice is an upstream product supply, not elementary water. Record actual time/state and ice additions, meltwater, stock and loss; no default cooling time, temperature, ice ratio or killing intervention. Protection/presentation follows its own product/package boundary; logistics belongs to delivery. | seafish-trolling; cefas-bass-1996 |\n| `boundary_receipt` | delivery | Include all actual movement, landing, handling, waiting and chilled custody before the first physical fish-product recipient, regardless of payer/operator. Invoice, ownership or first sale alone cannot truncate the gate. Later redistribution is excluded. | same-lot-accounting-method |\n| `boundary_period` | all nodes | Index trip batches and lots, pre/post-trip cleaning and changeover, failed/no-output trips, opening/closing fish and ice stock, reusable containers, vessel/gear/infrastructure installation, service, repair, replacement and termination. Declare all consuming nodes and periods for shared assets; assign each event once. | same-lot-accounting-method |\n| `boundary_emissions` | all nodes | Distinguish technosphere wastes sent to treatment from direct environmental releases. Returned marine water is not a pollutant; identify each pollutant chemical, reported mass or elemental/carbon basis, receiving medium and evidence. Fossil and biogenic carbon remain separate. No generic release UUID or assumed emission factor. | same-lot-accounting-method |\n\n"
