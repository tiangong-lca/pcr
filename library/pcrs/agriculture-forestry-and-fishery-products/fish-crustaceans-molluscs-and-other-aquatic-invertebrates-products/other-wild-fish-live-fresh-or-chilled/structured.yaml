system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "capture and sorting"
      rule: "Start with wild removal by artificial-lure trolling, individual hauling/unhooking and actual sorting of target animals, other animals and incidental matter. Retained target goes through required ice-bed chilling; each grade, alternative destination, released animal and waste has its actual handoff. Capture is independent of growth and conditioning."
      source_ids:
        - seafish-trolling
        - cefas-bass-1996
    - rule_id: boundary_chill
      applies_to: "chilling and presentation"
      rule: "Record usable pre-chill retained fish and actual whole chilled output separately. Ice is an upstream product supply, not elementary water. Record actual time/state and ice additions, meltwater, stock and loss; no default cooling time, temperature, ice ratio or killing intervention. Protection/presentation follows its own product/package boundary; logistics belongs to delivery."
      source_ids:
        - seafish-trolling
        - cefas-bass-1996
    - rule_id: boundary_receipt
      applies_to: "delivery"
      rule: "Include all actual movement, landing, handling, waiting and chilled custody before the first physical fish-product recipient, regardless of payer/operator. Invoice, ownership or first sale alone cannot truncate the gate. Later redistribution is excluded."
      source_ids:
        - same-lot-accounting-method
    - rule_id: boundary_period
      applies_to: "all nodes"
      rule: "Index trip batches and lots, pre/post-trip cleaning and changeover, failed/no-output trips, opening/closing fish and ice stock, reusable containers, vessel/gear/infrastructure installation, service, repair, replacement and termination. Declare all consuming nodes and periods for shared assets; assign each event once."
      source_ids:
        - same-lot-accounting-method
    - rule_id: boundary_emissions
      applies_to: "all nodes"
      rule: "Distinguish technosphere wastes sent to treatment from direct environmental releases. Returned marine water is not a pollutant; identify each pollutant chemical, reported mass or elemental/carbon basis, receiving medium and evidence. Fossil and biogenic carbon remain separate. No generic release UUID or assumed emission factor."
      source_ids:
        - same-lot-accounting-method
