      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| `allocation_output` | all intended animal products | First subdivide separately measured target and other-species/grade/destination operations. For inseparable shared capture/run burdens use actual net animal mass shares across all intended outputs of that trip/period, with reason for physical relevance and sensitivity against actual economic shares where price/grade differences matter. Record all outputs and allocation sums, including capture/sort/chill/present/delivery alternates. Wastes, returns and residue receive explicit management burdens; no avoided-production credit. Do not allocate the same target burden once at internal T1-T6 and again at sale. | same-lot-accounting-method |\n| `allocation_trip` | batch trips and cleanup | Include failed and no-output trips, setup, changeover and cleanup in the declared capture reporting service pool; assign to actual intended outputs of that pool, not only successful selected trips. A zero accepted-mass pool cannot produce a per-kg result; retain burdens and disclose the gap. Keep stock-linked burdens with measured opening/closing stock, rather than discarding them. | same-lot-accounting-method |\n| `allocation_period` | multi-period stocks and assets | Carry opening fish/ice stocks with upstream burdens and use measured issue/closing ledgers. Allocate reusable container, vessel, gear and infrastructure manufacture/repair/replacement/termination over evidenced delivered service, actual use and periods. State service-life rationale, observed use, remaining service and sensitivity; no universal lifetime. Assign idle/failed periods explicitly and preserve balance between carried and current burdens. | same-lot-accounting-method |\n| `allocation_shared` | shared assets and complete services | Register each vessel, bin, landing facility or vehicle and all actual capture/sort/chill/present/delivery consumers and periods. Subdivide metered service first, otherwise use evidenced occupied capacity/time or activity with rationale and sensitivity. Shares sum to the full attributable service once. Complete upstream/contracted service has one owner and excludes its covered component energy, assets and direct releases from foreground duplication. Physical reuse transfers do not recreate manufacture burdens. | same-lot-accounting-method |\n\n"
