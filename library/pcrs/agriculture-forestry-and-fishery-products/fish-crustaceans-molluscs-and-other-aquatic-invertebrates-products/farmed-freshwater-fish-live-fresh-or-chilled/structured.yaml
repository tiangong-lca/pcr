      collection_method: "Weigh disposable material and inventory reusable components with observed cycles, returns and cleaning; verify container tare separately from fish biomass. Normalize: Attributed material mass / accepted gate net fish mass; per 1 kg reference flow"
      unit: "kg material; reuse count"
      frequency: "Each loading/return/loss and cleaning event"
      temporal_coverage: "Same gate lots and actual reusable service period"
      site_scope: "Actual farm loading and returning container boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Material invoices, component/reuse register, cleaning records and tare evidence"
    - protocol_id: cp_gate
      process_id: "dispatch"
      flow_role: "accepted reference lot and gate rejects"
      record_type: "calibrated acceptance weighing and handover record"
      raw_fields: "species/family; food use; aquaculture/freshwater origin; whole/head/gut state; actual live/fresh/chilled state; lot/cohort; gate; date; calibrated wet mass; container/water/ice tare; drainage; accepted/rejected mass; destination"
      collection_method: "Weigh accepted whole fish on a calibrated scale, removing container/water/ice tare; repeat representative sampling and reconcile transfer/acceptance records and rejects. Normalize: Actual accepted lot net mass supports normalization; per 1 kg reference flow"
      unit: "kg net fish; count when sampled"
      frequency: "Each first producer handover lot; repeated representative weighing"
      temporal_coverage: "Full declared production period with lot-specific gate event"
      site_scope: "Actual first producer farm harvest/dispatch gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale certificate, tare and drainage method, repeated sampling, acceptance signatures and destination"
  calculation_rules:
    - id: normalize_lot
      applies_to: "all inventory rows"
      rule: "Divide each actual attributed quantity once by accepted whole-fish net wet mass from the same production boundary, yielding per 1 kg reference flow; the reference product is defined as 1 kg. Internal transfers retain actual amounts and cancel on aggregation; already normalized values are not divided again."
      inputs:
        - "actual amount"
        - "allocation fraction"
        - cp_gate
      output: "row quantity on same reference basis"
      source_ids: []
    - id: feed_use_reconciliation
      applies_to: "dq_complete_nursery_feed; dq_complete_growout_feed"
      rule: "For each actual feed product, node, cohort and period, measure the mass actually offered at the final feeding point using a calibrated delivery meter or a completed feeding-event balance: prepared feed mass minus unused returned feed, unused feed retained at that point and independently measured pre-offering losses within that event. These three deductions are disjoint; retained unoffered feed remains stock. Do not subtract those event losses again if the delivery meter already measures feed after them. Add separately evidenced pre-offering storage/handling feed losses inside the declared foreground boundary, attributable under Section 7, to obtain the feed-input quantity; retain their upstream feed burdens and count each loss once. Exclude supplier losses already covered by the upstream feed dataset or a complete supplied service. Do not deduct feed already offered but left uneaten; record its actual fate separately. Warehouse issues and returns are internal transfers, not additional feed use or purchases. For each named store and owner, reconcile opening stock plus all inward receipts, including physical returns, against closing stock, all outward transfers and independently measured losses; retain product/moisture basis, measured state transformations and uncertainty. Record stock change as closing minus opening at that same store only for reconciliation; never subtract it again from the offered-feed-plus-loss quantity. Carry unused closing stock and its burdens to later periods, reconcile all consumer shares and do not count a shared loss again at its source node. Missing records or unexplained differences remain gaps, never zero or balancing feed. Attribute once under Section 7 and normalize once under normalize_lot; no ration, loss rate or range default is supplied."
      inputs:
        - cp_inputs_own_seed
        - cp_inputs_growout
        - cp_inputs_farm_services
        - "completed feeding events"
        - "store/transfer/loss ledgers"
        - cp_gate
      output: "Attributable feed quantity and independent stock reconciliation before normalize_lot"
      source_ids:
        - feed-ledger-method
    - id: stock_reconcile
      applies_to: "own_seed; growout; harvest"
      rule: "Reconcile opening stock plus receipts/births and estimated biological growth against transfers/harvest, mortality/escape and closing stock by cohort, retaining residual and uncertainty. Count uses same-stage representative wet mass and actual samples; seed mass conservation does not constrain growth."
      inputs:
        - cp_stock_own_seed
        - cp_stock_growout
        - cp_stock_harvest
      output: "cohort transfer quantities and stock residuals"
      source_ids: []
    - id: resource_reconcile
      applies_to: "farm_services"
      rule: "Reconcile supplied/abstracted/returned/treated/circulated water and storage by meter interval using actual density. Electricity kWh times 3.6 yields MJ; reconcile fuel stock/consumption independently. Attribute utilities by recorded node/period shares summing to one."
      inputs:
        - cp_water_growout
        - cp_water_farm_services
        - cp_energy
      output: "water/energy ledgers and node attribution"
      source_ids: []
    - id: direct_emission_model
      applies_to: "dq_complete_aqueous_nutrient_releases; fossil_co2_air; dq_complete_other_direct_releases"
      rule: "For each actual aqueous substance and receiving medium, record total outward load from the matched discharge volume and measured concentration over the same interval, with documented unit and element/compound conversion. Independently retain every inlet volume and concentration, sludge removal, fish retention, storage and other destinations. A concentration difference multiplied only by outlet volume is not a general net-load method when inlet/outlet volumes or background fates differ. Use a background-adjusted inventory only with an explicit substance-specific method proving the inlet contribution that actually reaches this outlet, its fate, compatible boundaries and a single adjustment; report total outward load and the net balance diagnostic separately, never as two inventories of the same release. A negative net diagnostic is not automatically negative emission, removal credit or zero. Any source-specific balance/factor model must state its applicability, inputs, formula, provenance and uncertainty. Fossil CO2 requires actual fuel and independently evidenced matching carbon/oxidation factors; missing factors remain gaps, never inferred from a UUID."
      inputs:
        - cp_emissions_own_seed
        - cp_emissions_growout
        - cp_emissions_farm_services
        - cp_emissions_harvest
        - cp_emissions_preservation
        - cp_emissions_dispatch
        - cp_inputs_own_seed
        - cp_inputs_growout
        - cp_inputs_farm_services
        - cp_inputs_harvest
        - cp_inputs_preservation
        - cp_inputs_dispatch
        - cp_stock_own_seed
        - cp_stock_growout
        - cp_stock_harvest
        - cp_energy
      output: "substance releases and uncertainty"
      source_ids:
        - ufifas-ras-fa099
    - id: joint_service_attribution
      applies_to: "co-outputs; shared assets; periods"
      rule: "Apply Section 7 subdivision, evidenced physical causality then disclosed economic fallback; attribute asset material/end-of-life burden over observed service periods and actual use to all nodes/periods, checking fraction sums and sensitivity."
      inputs:
        - cp_outputs_own_seed
        - cp_outputs_growout
        - cp_outputs_harvest
        - cp_assets
        - cp_energy
        - cp_water_growout
        - cp_water_farm_services
      output: "single output/period service-attribution ledger"
      source_ids:
        - ghg-product-allocation-2011
