    - id: quality_identity
      applies_to: "all lots/exchanges"
      requirement: "Trace actual species/family, state, gate, route and purpose; final exchanges independently verify flow/support property/unit, conceptual cards are not verified exchanges."
      evidence: "Lot origin, supplier and identity confirmation records"
    - id: quality_measurement
      applies_to: "all quantities"
      requirement: "Record scale/meter calibration, tare/density, wet/dry/nutrient basis, frequency and uncertainty; provisional ranges do not replace collection."
      evidence: "Calibration certificates, lab results and raw records"
