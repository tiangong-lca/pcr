allocation_rules:
  - rule_id: allocate_subdivide
    applies_to: "all intended outputs"
    rule: "First subdivide separately measured species, cohorts, culture units and harvest/handling operations. Enumerate all intended food fish, sold seed/broodstock, other polyculture fish and integrated crop/animal outputs with actual purpose, hand-off and destination before attribution. Internal transfers cancel; no substitution credit is automatic."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: allocate_common
    applies_to: "shared inputs and intended co-products"
    rule: "For residual joint burdens use a evidenced causal physical relationship: directly metered consumption, feed uptake/growth requirement or documented service use as appropriate. Wet mass alone is not assumed causal across trophic fish/crops. If causality cannot be supported, disclose economic allocation using contemporaneous gate prices and quantities, with a physical-basis sensitivity and rationale."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: allocate_period_assets
    applies_to: "periods; farm_services"
    rule: "Attribute broodstock, pond/cage/RAS assets, replacements, shared power/water and cleaning/fallow events to all documented consumers and service periods using observed service lives and usage records. Connect partial harvests to one opening/closing-stock ledger. Fractions sum to one for each shared burden; remaining/retired stock and stranded burdens are disclosed without double annualization."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: allocate_waste
    applies_to: "waste and rejects"
    rule: "Waste disposal burdens remain with the generating activity. A sold purposeful output is classified as a product with an attribution decision, never also waste; unsold/dead fish, sludge and packaging follow actual treatment records. Death/escape/weight-change bookkeeping does not become an accepted reference output."
    source_ids:
      - ghg-product-allocation-2011
