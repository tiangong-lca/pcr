      requirement: "Identify and separately collect every actual exchange covered by “Other actual noncombustion and combustion releases”; retain all following collection, quantity and normalization obligations: If measured/modelled, resolve pollutant substance, receiving air/water/soil compartment, fossil/biogenic status and particle size where applicable. Pond methane, refrigerant leaks, chemical residues and engine pollutants are not assumed zero or universal exchanges. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Binding: Amount rule: Actual per-substance emission masses from facility monitoring or reviewed source-specific models; document coverage and unknowns. Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_emissions_farm_services Sources: ufifas-ras-fa099 Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_harvest_cooutputs
      applies_to: "harvest; outputs; product"
      requirement: "Identify and separately collect every actual exchange covered by “Intended other harvest outputs”; retain all following collection, quantity and normalization obligations: Each intentionally sold other fish species or off-spec whole fish has its own actual destination and gate; avoid counting the same polyculture output at both grow-out and harvest hand-offs. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Binding: Amount rule: Measured separately handed-off co-output mass, linked to a single allocation output ledger. Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_outputs_harvest Sources: fao-carp-2009 Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_packaging_materials
      applies_to: "dispatch; inputs; product"
      requirement: "Identify and separately collect every actual exchange covered by “Actual protective packaging and reusable containers”; retain all following collection, quantity and normalization obligations: Enumerate bags, boxes, liners, labels and live tanks as actual material roles at farm loading; use return/reuse/loss and cleaning evidence to attribute stock components. Carrier water and ice are excluded from fish mass. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Binding: Amount rule: Measured disposable material and allocated reusable component mass from packaging ledger. Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_packaging Sources: fao-freshwater-marketing Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_dispatch_rejects
      applies_to: "dispatch; outputs; waste"
      requirement: "Identify and separately collect every actual exchange covered by “Producer-gate fish and packaging rejects”; retain all following collection, quantity and normalization obligations: Separate rejected whole-fish material from discarded packaging by actual handler and identity; reusable returns are inventory movements. Do not count rejects within accepted reference biomass. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Binding: Amount rule: Measured rejected fish and package masses by material and documented destination. Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_gate Sources: fao-freshwater-marketing Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_culture_sludge
      applies_to: "farm_services; outputs; waste"
      requirement: "Identify and independently collect every actual sediment, solid-residue and sludge waste stream; retain source stage/unit/period, removal event, wet mass, dry solids, nutrient analysis and evidenced recipient without double owning the same material. Collect under cp_waste_farm_services and normalize to final accepted net fish mass. Establish independent Range evidence and exact UUID for each child; no grouped total, bound or binding is inherited. Any unresolved actual stream, fate, quantity, range evidence or UUID makes the final dataset incomplete and fails validation; unknown is not zero."
      evidence: "per-waste-stream measurements, wet/dry basis, recipient receipts and range/identity verification"
    - id: dq_atomic_card_identity
      applies_to: "all inventory rows"
      requirement: "Each card represents one physically identified exchange, not a collection or selector. Keep Electricity as one electrical-energy flow; supplier, geography and voltage remain actual collected qualifiers, not grounds for speculative splitting. Other actual materials, waste streams, carbon origins and receiving media must have separate identities and atomic cards before completion. Preserve every existing collection obligation; an absent card or unresolved identity never means zero or a waived exchange. Paired internal water transfers retain the same actual quality, transfer id, quantity and upstream burden, without another purchase."
      evidence: "Per-card identity, provider, state, destination and paired records"
    - id: dq_atomic_range_evidence
      applies_to: "repaired atomic flow cards"
      requirement: "U_row is an unresolved evidence requirement, not a numerical estimate, default, clipping limit or completeness pass. Establish each card's own matching-unit/reference-basis upper envelope from independent representative records or a compatible documented supplier/design bound, retaining scope, method and uncertainty. Do not reuse a removed aggregate range, copy a sibling quantity, derive a bound from the target batch itself or invent a value. Applicable missing evidence blocks quantitative QA completion; actual measurements remain required."
      evidence: "Independent envelope evidence; retained raw records and uncertainty"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference lot"
    rule: "Verify aquaculture origin, non-Salmonidae species family, human-food purpose, freshwater culture context, whole unheaded/ungutted form, actual live/fresh/chilled state and first producer farmgate; incomplete qualifiers prevent finalization. Do not use a reference name to cover a live-only or landing-site fixed UUID."
    source_ids:
      - un-cpc3-2025
  - rule_id: validate_route
    applies_to: "own_seed; growout"
    rule: "Require current producer cohort and unit-stage evidence for seed origin and technology flags, required parent growout, explicit own/purchased mutual exclusion, documented hybrids/transfers and resources/deltas. A route label or historical FAO numerical value does not establish actual farm topology or performance."
    source_ids:
      - fao-carp-2009
      - ufifas-ras-fa099
  - rule_id: validate_mass
    applies_to: "all fish and input records"
    rule: "Check calibrated/tared accepted net fish mass and count-to-wet-mass sampling; match each internal transfer once, distinguish biological growth from opening stock, receipt, harvest, mortality, escape and closing stock. Retain explicit uncertainty/residuals; do not force juveniles or harvest input to 1 kg."
    source_ids: []
  - rule_id: validate_utilities
    applies_to: "farm_services; growout"
    rule: "Reconcile water, energy and provider ledgers; CN low-voltage identity is conditional, other supply stays distinct. Confirm numerator property/unit, supplied versus abstracted water, species/element nutrient basis and receiving medium; prevent supplier/direct emission and effluent/substance duplication."
    source_ids:
      - ufifas-ras-fa099
  - rule_id: validate_modes_outputs
    applies_to: "all processes and allocation"
    rule: "Audit batch/continuous interval links, cleaning/changeovers/fallow burdens, intended-output completeness and hand-offs, period and shared-consumer fractions, and single assignment of each harvested lot. Actual no-use/bypass evidence is required for zero conditional resources; missing observation is not zero."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: validate_quality
    applies_to: "all exchanges"
    rule: "Every concrete final exchange needs a verified matching flow identity and support property/unit; unresolved cards require later actual-exchange verification. Each provisional Range is a replaceable QA screen, not an allowed limit, default inventory value or medication/performance target. Values outside it trigger explanation and evidence review rather than forced clipping."
    source_ids: []
  - rule_id: validate_handling
    applies_to: "harvest; preservation; dispatch"
    rule: "Select actual pre-gate holding/chilling from timestamp, state and operation evidence; verify survival/temperature observations and segregated rejects, drainage, ice and package tare. Exclude independent post-gate distribution, freezing and head/gut-removal processing."
    source_ids:
      - fao-freshwater-marketing
  - rule_id: validate_feed
    applies_to: "dq_complete_nursery_feed; dq_complete_growout_feed"
    rule: "Check feed_use_reconciliation and the linked raw protocols: final-point offered mass, disjoint unused returns/retained stock/event losses in any feeding-event balance, all pre-offering losses and once-only attribution, separate uneaten-feed fate, named store/owner/period and gross-transfer stock reconciliation. Do not treat a warehouse issue as offered feed or deduct stock change again; missing measurements, unassigned losses or unexplained differences block completion."
    source_ids:
      - feed-ledger-method
  - rule_id: validate_inventory_completion
    applies_to: "all concrete exchanges and section 8 completion obligations"
    rule: "Verify each applicable dq_complete obligation has separately measured and identity-verified exchange cards. Check each quantity, native unit, range evidence, normalization, receiving medium, destination and non-duplication. Any unfulfilled actual child exchange, quantity, identity or destination makes the final dataset incomplete and fails validation; unknown cannot be zero. Static PCR checking does not replace this evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Complete aquaculture food whole-fish supply datasets matching actual species/route/state/geography/year and first farmgate; compatible input to downstream LCA process/lifecycle models"
  excluded_use: "Wild or Salmonidae, ornamental or final seed/feed, frozen/fillet/head/gut-removed products, independent post-gate logistics/processing, or treating unverified identities as final exchanges"
  required_metadata: "PCR/version reference, species/family/purpose, cohort/seed route/technology topology, gate/actual state, geography/year/full cycle, net mass/tare/drainage, supplier links, co-output allocation and asset-service ledger"
  required_quality_disclosure: "Measurement/sampling coverage and uncertainty, mortality/escape/stock residuals, energy/water/emission model factors, supplier match/omissions, provisional ranges/shared-allocation sensitivity and actual exchange identity-verification coverage"
  update_trigger: "Material change in species/seed source, technology/water/energy supply, state/gate/form, feed/management, asset life, co-output price/allocation, emission model or evidence"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "[UNSD CPC 3.0 explanatory notes, 30 June 2025](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf); pp. 41–42; retrieved 2026-10-09"
    used_for: "Classification semantics and adjacent exclusions; no farm-performance quantities"
  - id: "fao-carp-2009"
    type: "official_guidance"
    reference: "[FAO, Cyprinus carpio, Cultured aquatic species fact sheets, 2009, Peteri](https://www.fao.org/fishery/docs/CDrom/aquaculture/I1129m/file/en/en_commoncarp.htm); retrieved 2026-10-09"
    used_for: "Qualitative examples of seed/grow-out, natural-food/supplementary-input, polyculture/integration and distinct harvest topology; no historical numerical defaults"
  - id: "ufifas-ras-fa099"
    type: "extension_guidance"
    reference: "[UF/IFAS, Fish Health Management Considerations in Recirculating Aquaculture Systems, Part 1, FA099/Cir120](https://ask.ifas.ufl.edu/publication/FA099); retrieved 2026-10-09"
    used_for: "Qualitative RAS/flow-through/pond deltas and actual water-source/filter/solids records; no numerical thresholds as defaults"
  - id: "fao-freshwater-marketing"
    type: "extension_guidance"
    reference: "[FAO, Management for freshwater fish culture, Chapter 16: Marketing](https://www.fao.org/fishery/static/FAO_Training/FAO_Training/General/x6709e/x6709e16.htm); retrieved 2026-10-09"
    used_for: "Qualitative actual post-harvest live handling, ice chilling and protective packaging obligations; post-gate transport, head/gut processing and historical ratios excluded"
  - id: "ghg-product-allocation-2011"
    type: "standard"
    reference: "[WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard, 2011, Chapter 9](https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf); retrieved 2026-10-09"
    used_for: "Subdivision, causal physical and disclosed economic-fallback allocation rationale; no claim of compliance with the entire GHG standard"
  - id: "pcr-normalization-definition"
    type: "method_factor"
    reference: "Internal method definition in this PCR Section 3, reference_net_mass and normalize_lot; not an external source"
    used_for: "Defines reporting output as 1 kg and exact 1–1 kg reference Range; no empirical quantity or external factor claim"
  - id: "feed-ledger-method"
    type: "method_factor"
    reference: "This PCR Section 8 feed_use_reconciliation and its named collection/validation rules; declared accounting method, not an external empirical factor"
    used_for: "Defines final feeding-point measurements, unused returns/stock, once-attributed pre-offering losses and independent supply-store reconciliation; no ration, loss rate or numerical range"
