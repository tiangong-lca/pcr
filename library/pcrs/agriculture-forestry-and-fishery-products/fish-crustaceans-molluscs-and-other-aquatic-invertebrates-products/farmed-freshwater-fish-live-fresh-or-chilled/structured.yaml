measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use cp_gate calibrated weighing for accepted whole-fish net wet mass, excluding container/water/ice tare; drainage, repeated sampling, rejects and lot gate must be traceable."
  - id: seed_count_mass
    applies_to: "seed and fish stock"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Count multiplied by representative individual wet mass of the same cohort/stage; retain distribution and uncertainty, no universal count/kg or fixed 1 kg juvenile quantity."
  - id: input_material_basis
    applies_to: "feed; fertilizer; chemical; sludge"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Declare wet/dry material mass, moisture, elemental N/P and active ingredient; element/substance conversion needs evidenced molecular/specification basis; wet sludge is not dry solids."
  - id: water_density
    applies_to: "water rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert volume to mass using actual density/condition, retain raw m3; distinguish withdrawal, supply, circulation and net consumption."
