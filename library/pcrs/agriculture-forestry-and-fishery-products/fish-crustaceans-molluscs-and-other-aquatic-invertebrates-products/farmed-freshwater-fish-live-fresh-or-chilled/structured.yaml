system_boundary:
  rules:
    - rule_id: boundary_gate
      applies_to: "whole foreground system"
      rule: "Include actual aquaculture seed receipt or on-site breeding, managed grow-out, physical harvest and actual producer-controlled preservation/loading through first farm handover; classify whole live/fresh/chilled fish by actual lot state. Independently operated post-gate transport and processing are outside."
      source_ids:
        - fao-carp-2009
        - fao-freshwater-marketing
    - rule_id: boundary_seed
      applies_to: "own_seed; growout"
      rule: "Parent growout is required. Own breeding/nursery changes topology to founders, nursery inputs and internal juvenile output; purchased seed changes provider/upstream hatchery requirements. The two routes are exclusive for each cohort; mixed farms identify and sum distinct cohorts, without duplicating hatchery burdens."
      source_ids:
        - fao-carp-2009
    - rule_id: boundary_technology
      applies_to: "growout; farm_services"
      rule: "Declare actual unit-to-technology map under growout. Pond units require natural productivity/fertilizer and sediment records; cages require net/mooring and receiving-water releases; flow-through/raceways require intake/outlet and pumping records; RAS requires makeup/recirculation distinction, filtration media, sludge and treatment energy. One technology per unit-stage interval unless a documented hybrid partitions flows; coexistence across units requires shares and transfer links."
      source_ids:
        - fao-carp-2009
        - ufifas-ras-fa099
    - rule_id: boundary_upstream
      applies_to: "all external inputs"
      rule: "Include provider production and attributable pre-gate transport for seed, feed, manure/fertilizer, chemicals, energy, packaging and infrastructure; declare inventory start conditions and supporting secondary datasets. Integrated manure has an evidenced burden/attribution decision, never automatic zero. Own seed has internal inputs instead of adding purchased hatchery burden for the same cohort."
      source_ids:
        - ghg-product-allocation-2011
    - rule_id: boundary_periods
      applies_to: "all selected nodes"
      rule: "Enumerate broodstock/seed phase, nursery and grow-out cycles, partial harvests, fallow/cleaning periods, holding and dispatch intervals, and shared-asset construction, maintenance, replacement and retirement. Opening/closing fish, feed, water and material stocks carry between periods with event links."
      source_ids:
        - fao-carp-2009
        - ghg-product-allocation-2011
    - rule_id: boundary_water
      applies_to: "farm_services; growout"
      rule: "Keep supplied water, fresh abstraction, recirculation, direct returns, treatment effluent, evaporation and storage changes in one linked water ledger. Assign actual receiving medium and nutrient substance; count each pollutant once across untreated release or wastewater treatment routes. Ecological observations, escape and natural pond production are records, not fabricated elementary identities."
      source_ids:
        - ufifas-ras-fa099
    - rule_id: boundary_shared
      applies_to: "farm_services"
      rule: "Identify each pump, pond, aerator, raceway, cage/net/mooring, RAS filter, cold unit and tank actually shared by at least two nodes or periods; list all consumers and service periods. Record measured service shares and provider/material/end-of-life burdens once in the central ledger; exclusive assets use direct assignment."
      source_ids:
        - ghg-product-allocation-2011
boundary_abstraction:
  declared_starting_condition: "Actual opening culture stock and purchased seed receipt, or documented on-site founders/breeding/nursery; declare cohort route and existing facility condition"
  starting_condition_role: "Foreground entry fact, not a justification for zero upstream burden or absent broodstock history"
  product_classification_scope: "Narrower whole unheaded/ungutted non-Salmonidae food scope within CPC 04212; routes selected semantically, not from code"
  recursive_input_rule: "Same-category purchased seed/stock retains actual mass and supplier-gate upstream data; stop foreground recursion at declared receipt and disclose supplier boundary, no zero burden or duplicate own hatchery"
  upstream_dataset_requirement: "Compatible secondary datasets for actual seed/feed/fertilizer/chemical/water/energy/packaging/asset/transport suppliers; disclose geography/year/technology/gate/allocation and gaps"
  disclosure: "Selected nodes, cohort/technology topology, production cycles/carried stock, co-output destinations, asset consumers/life, upstream support/exclusions, actual gate state and uncertainty"
