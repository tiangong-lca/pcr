allocation_rules:
  - rule_id: allocation_reconcile
    applies_to: "all outputs"
    rule: "Reconcile all intended species/grade outputs, internal transfers, returns, bait and gear stocks/losses and waste before allocating burdens. Native shells remain in the whole animal. Mortality, bycatch and rejects acquire product/waste/return status only from actual intent, state and destination; no automatic coproduct or substitution credit."
    source_ids: []
  - rule_id: allocation_precedence
    applies_to: "shared trip and sorting outputs"
    rule: "This PCR selects the following allocation hierarchy, requiring concrete foreground evidence rather than deriving it from the qualitative Seafish sources: first subdivide independently metered activities; next use demonstrated causal physical service drivers for shared burdens. If unavoidable multi-output allocation remains, use measured net mass only among comparable intended whole-animal outputs; where functional/quality differences make mass unsuitable, document period-matched output value evidence and a justified economic allocation with mass sensitivity. Require an explicit decision, complete output set and handoff for each concrete dataset; no silent default or allocation to internal transfers."
    source_ids: []
  - rule_id: allocation_periods
    applies_to: "multiyear assets; vessel and service periods"
    rule: "Link manufacture, use, repair, replacement, gear loss/retrieval and retirement to evidenced service periods and all consumers. Use actual recorded service exposure/usage shares; document remaining stock and termination, without universal lives. Include unsuccessful trips and cleaning/changeover events in the reporting period; link all shared vessel, shore facility and service consumers. Shares sum to the complete service; count each event once."
    source_ids: []
  - rule_id: allocation_services
    applies_to: "purchased inclusive services"
    rule: "For each provider boundary choose inclusive service or its documented resources, direct emissions and capital; prevent duplicate provider burdens and duplicate cross-node/period ownership. Missing disaggregation/attribution evidence is a data gap. No automatic biodiversity, avoided-catch, seabed or ecosystem-service credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture
      process_id: "pot_capture"
      flow_role: "capture resources, stock, catch and fates"
      record_type: "Trip/asset/bait ledger"
      raw_fields: "trip/period; vessel; area; deployed/hauled/recovered pots; soak; fuel tank/purchases; bait identity/origin/opening/receipts/deployed/recovered/closing/discards; gear materials/stock/loss/retrieval/repair/replacement; catch species/live state/destination; transfer/event id; service boundary/native unit; engine/factor/source; all asset consumers/service phases"
      collection_method: "Reconcile calibrated tank/mass records, hauling log, invoices, catch/return and gear-retrieval records; record unsuccessful trips and actual direct-emission factors; pair sender/receiver transfers; Reconciled attributable amount per 1 kg reference flow; one owner per event, retain original native units"
      unit: "kg and native units per instance"
      frequency: "Each trip, purchase, deployment, retrieval, loss, repair and service event"
      temporal_coverage: "Complete reporting period plus relevant asset service phases"
      site_scope: "Actual vessel, capture areas, port and support providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, invoices, log completeness, factor provenance, stock balances and transfer pairs"
    - protocol_id: cp_sorting
      process_id: "catch_sorting"
      flow_role: "incoming catch, every grade/destination, reject and actual sorting resources"
      record_type: "Lot sorting ledger"
      raw_fields: "lot/trip/period; transfer id; incoming state/mass; species; grade criterion; intended output and handoff; downgraded state; reject/return/waste destination; resource/service quantity/property/unit; event owner"
      collection_method: "Calibrated weighing and actual grading/destination records; pair handoffs and separately classify every resource, return and secondary output; Reconciled attributable amount per 1 kg reference flow; incoming = all destination quantities plus documented difference; internal transfers excluded from final-output set"
      unit: "kg and actual native resource/service units"
      frequency: "Each sorting lot and resource/changeover event"
      temporal_coverage: "Same complete reporting period"
      site_scope: "Actual vessel/shore sorting place"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scales, grade records, recipient documents, output-set reconciliation"
    - protocol_id: cp_cleaning
      process_id: "primary_cleaning"
      flow_role: "raw/prepared live interface, resources and residues"
      record_type: "Conditional event ledger"
      raw_fields: "active/bypass; animal vs equipment-only; raw/prepared state/mass; transfer id; water source/supply/abstraction; materials; energy; service boundary/native unit; residue/discharge identity/medium/destination; reject and loss; time; event owner"
      collection_method: "Meter/weigh actual inputs and outputs; document active intervention and bypass; classify direct environmental flows separately from supply/treatment; Reconciled attributable amount per 1 kg reference flow; no animal throughput for equipment-only cleaning; one event owner"
      unit: "kg and actual native units per instance"
      frequency: "Each actual cleaning event"
      temporal_coverage: "Same reporting period with actual event times"
      site_scope: "Actual onboard/shore cleaning locations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/calibration, waste/discharge records, bypass and paired handoffs"
    - protocol_id: cp_holding
      process_id: "live_support"
      flow_role: "live before/after states, preservation inputs and losses"
      record_type: "Conditional support ledger"
      raw_fields: "active/bypass; before/after live state/mass; lot/transfer id; time/duration; location/system; actual water/energy/cooling/aeration/service inputs; property/native unit; provider boundary; mortality, residue and secondary destination; discharge medium; shared consumers/event owner"
      collection_method: "Measure actual resources and live handoffs, retain service invoices and state checks; identify concurrent nodes and one ownership ledger; Reconciled attributable amount per 1 kg reference flow; separate intended outputs from waste/direct release, no overlap double count"
      unit: "kg and actual native units per instance"
      frequency: "Each support interval and input/output event"
      temporal_coverage: "Same complete reporting period; actual duration only"
      site_scope: "Actual vessel and pre-gate shore support locations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/invoice evidence, state checks, mortality/destination records and transfer pairs"
    - protocol_id: cp_presentation
      process_id: "lot_presentation"
      flow_role: "live lot/package interface and material fates"
      record_type: "Presentation/reuse ledger"
      raw_fields: "active/bypass; lot/transfer id; live animal net mass; bag/bin/label/material identities and weights; new/reused stock; return/cleaning/reuse service period; reject and end-of-use destination; event owner"
      collection_method: "Separately weigh animals and tare/materials; reconcile reusable stocks/returns and actual handoffs; record any additional presentation resource instances with native units; Reconciled attributable amount per 1 kg reference flow; exclude package mass from animal mass; one event owner"
      unit: "kg and actual native units per instance"
      frequency: "Each presented lot and material/reuse event"
      temporal_coverage: "Same reporting period plus reusable material service period"
      site_scope: "Actual pre-gate presentation location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated tare/mass records, material invoices, reuse/return and disposal evidence"
    - protocol_id: cp_gate
      process_id: "recipient_gate"
      flow_role: "offered, accepted and rejected lots; delivery"
      record_type: "Receipt/scale/route ledger"
      raw_fields: "lot/trip/period; species/route/origin; transfer id; sender/recipient; physical receipt/acceptance time; live whole state; gross/tare/free-water exclusions/drainage; calibrated accepted net mass; rejection/return/secondary/waste destination; actual delivery resource/native unit/provider boundary; event owner"
      collection_method: "Calibrated live whole lot weighing with paired tare, physical acceptance receipt and state/origin checks; collect route/resource/invoice records and disaggregated emissions where directly operated; Reconciled attributable amount per 1 kg reference flow using accepted net whole live mass only; accepted reference amount equals 1 kg by normalization"
      unit: "kg and actual native units per instance"
      frequency: "Every receipt/acceptance, rejection and delivery event"
      temporal_coverage: "Same complete reporting period"
      site_scope: "Actual first harvester physical recipient and pre-gate route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, recipient receipts, origin/live-state checks, destination and provider-scope evidence"
  calculation_rules:
    - id: normalize_records
      applies_to: "all inventory rows"
      rule: "Divide each reconciled attributable quantity by the same period's accepted net whole live reference mass in kg; retain numerator native units. The reference product divides that accepted mass by itself to give 1 kg. A period with no accepted reference output cannot produce a normalized dataset; retain its burdens in the complete attribution period."
      inputs:
        - "Node-owned protocols"
        - "accepted-mass records in cp_gate"
        - "attribution decision"
      output: "Quantity per 1 kg reference flow"
      source_ids: []
    - id: reconcile_ledgers
      applies_to: "animal; bait; gear; packages"
      rule: "Opening stock plus receipts/withdrawals equals internal or final transfers, closing stock, returns and actual destination-specific losses with an explicit unexplained-difference record; pair internal transfer ids without treating them as final output. Reconcile before allocation and normalization."
      inputs:
        - "Node-owned stock"
        - "event and handoff records"
      output: "Reconciled physical/output ledgers"
      source_ids: []
    - id: direct_combustion
      applies_to: "capture_fossil_co2; collect_capture_other_emissions; actual direct delivery emissions"
      rule: "Use reconciled actual fuel by fuel/engine and documented factor substance, unit and receiving medium; record factor source/version and uncertainty in the concrete dataset. Exclude respiration and provider-inclusive emissions; no universal factor is supplied here."
      inputs:
        - cp_capture
        - "cp_gate for direct delivery"
        - "documented fuel-specific factors"
      output: "Actual direct emission quantities"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all concrete exchanges"
      requirement: "Verify species, wild UK pot route, live whole recipient gate and each concrete flow/property/unit identity; unresolved collection scope identities cannot be final exchanges."
      evidence: "Origin/gear records, receipts and verified identity details"
    - id: dq_completeness
      applies_to: "period and routes"
      requirement: "Retain complete trips including failures, all intended destinations, stocks, returns, bait and gear losses, actual node bypass/overlap and shore support. Never use absence of records as zero."
      evidence: "Full period/event register and reconciliation differences"
    - id: dq_quantities
      applies_to: "all cards"
      requirement: "Replace provisional U_row by independently reviewed quantitative evidence when empirical bounds are needed. Each expanded instance needs independent U_instance; never use the same batch maximum as its QA reference sample. No provisional bound replaces a collected amount."
      evidence: "Independent comparable evidence and provenance; node-owned measurements"
    - id: dq_shared
      applies_to: "assets and purchased services"
      requirement: "Retain period/phase/consumer linkage and explicit allocation decision; avoid direct/inclusive-service overlap, duplicate events and fixed unproved lives."
      evidence: "Service/asset ledgers and complete share reconciliation"
    - id: dq_sources
      applies_to: "public evidence"
      requirement: "Seafish gear page supports qualitative pot/bait process context; the 1997 Jacklin landing-page abstract supports historical live handling existence only. It does not supply modern typical handling regimes, market share or quantitative factors."
      evidence: "Named source records and concrete foreground evidence"
