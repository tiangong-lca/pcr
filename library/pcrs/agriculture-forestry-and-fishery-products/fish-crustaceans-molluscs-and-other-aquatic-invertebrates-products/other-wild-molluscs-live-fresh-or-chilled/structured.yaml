validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Require Buccinum undatum, UK wild marine baited-pot route, live whole native-shell state and actual first-recipient acceptance. Reject cooked/meat/dead/frozen/farmed or other-species reference substitution and missing gate evidence."
    source_ids:
      - seafish-whelk-pots
      - seafish-live-whelk-1997
  - rule_id: validate_mass
    applies_to: "animal reference and transfers"
    rule: "Require calibrated accepted net live whole mass, paired drainage/tare records and unique transfer ids. Exclude foreign loose material/free seawater/packaging; native shell remains. The 1..1 reference range proves normalization only, not observed yield."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "all nodes and outputs"
    rule: "Reconcile complete trip/period animal, bait, gear and package records before allocation; enumerate every intended grade/species output and actual destination/handoff. Check mortality, bycatch, sea returns, unrecovered gear and landed wastes independently; no assumed zero or automatic coproduct."
    source_ids: []
  - rule_id: validate_nodes
    applies_to: "conditional operations"
    rule: "Check actual activation/bypass, incoming/prepared/preserved/presented state and handoff, independent node-owned protocols and one owner per overlapping event. Equipment-only cleaning has no animal throughput. No fictitious serial order, mandatory depuration/cooking or universal cooling regime."
    source_ids: []
  - rule_id: validate_attribution
    applies_to: "shared resources and periods"
    rule: "Check all consumers, service phases/replacement/termination, unsuccessful trips, complete output shares and explicit allocation decision with evidence/sensitivity. Reject duplicate direct/inclusive-service resources/emissions/capital and allocation to internal reference transfers."
    source_ids: []
  - rule_id: validate_identity_ranges
    applies_to: "concrete dataset"
    rule: "Resolve every concrete exchange and support identity before final dataset use, preserving native service units. Every card has Range; symbolic provisional U bounds remain unresolved evidence needs and each expanded exchange has independently reviewed bounds. Missing identity, amount, destination, allocation or range evidence is disclosed as a gap and blocks unsupported finalization."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable collection requirements and concrete inventory exchanges"
    rule: "Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground harvest-to-first-recipient data package with route-compatible upstream inputs"
  downstream_use: "secondary_dataset; background_dataset; downstream process and lifecyclemodel projections"
  allowed_use: "Evidence-matched UK wild live whole pot-caught Buccinum undatum at the declared physical acceptance gate"
  excluded_use: "Other species/routes/origins; managed grow-out; cooked/meat/dead/frozen reference products; post-gate processing; unsupported stock/ecosystem-service claims"
  required_metadata: "Species/origin/area; vessel/pot/bait route; trip and period; live whole state; first recipient/gate/time; calibrated net-mass convention; actual nodes/bypasses/overlap; intended outputs/destinations; asset/service periods and attribution; upstream boundaries"
  required_quality_disclosure: "Completeness and unexplained differences; primary-record coverage; factor/identity verification; unresolved range evidence and independent sample provenance; output/period allocation and sensitivity; source limitations"
  update_trigger: "Changed route, gate, species/origin, handling system, output set, bait/gear/service boundary, quantitative evidence or identity support"
