    - rule_id: boundary_gate
      applies_to: "whole system"
      rule: "Include all harvester-controlled or purchased activities necessary to achieve first physical recipient acceptance, including actual pre-gate shore support and transport. Exclude post-acceptance storage, resale, cooking and extraction. This is the PCR-declared boundary proved by actual receipt records."
      source_ids: []
    - rule_id: boundary_interventions
      applies_to: "sorting; conditioning; preservation; presentation"
      rule: "Sorting receives raw or actually conditioned live catch and records accepted live grades, intended secondary destinations and rejects separately. Include bounded cleaning only when performed; animal lots bypass equipment-only cleaning. Live support may begin immediately after capture and overlap sorting, presentation or delivery. Register actual input/output interfaces and events without imposing a universal serial order, depuration, temperature or storage duration."
      source_ids:
        - seafish-whelk-pots
        - seafish-live-whelk-1997
    - rule_id: boundary_shared
      applies_to: "support; assets"
      rule: "Enumerate vessel, hauler, pots/ropes, shore facilities and shared services, every consuming node and period, production/repair/replacement/retirement phases and evidence for attribution. One event has one owner. Select either inclusive purchased service burdens or disaggregated direct resources/emissions/capital for the same scope."
      source_ids: []
    - rule_id: boundary_losses
      applies_to: "all nodes"
      rule: "Reconcile live catch, returns, retained outputs, bait stocks/remainders/discards, mortalities, animal rejects, gear loss/retrieval and residues with actual destination/status. Record unresolved differences; do not assume bycatch negligible, all dead animals coproducts or all rejects unusable secondary outputs."
