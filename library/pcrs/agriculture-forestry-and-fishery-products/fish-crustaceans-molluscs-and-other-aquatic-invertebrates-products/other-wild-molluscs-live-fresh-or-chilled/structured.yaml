system_boundary:
  rules:
    - rule_id: boundary_capture
      applies_to: "capture"
      rule: "Include actual pot deployment, soak/hauling and vessel operations, bait procurement/use, gear manufacture/repair/loss/retrieval, incidentals and returns; include failed trips in the declared period. Capture removes wild stock independently of managed biological production or subsequent cleaning."
      source_ids:
