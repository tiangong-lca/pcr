      requirement: "Identify and separately collect every actual exchange covered by “Other purposeful products at actual landing handover”; retain all following collection, quantity and normalization obligations: Conditional every actual independent species/state/food or non-food intended product with its recipient, wet mass and commercial purpose. Transfers already counted as capture co-products must not appear again as independent output; no fillet/gut/head production occurs within this whole-fish scope. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; unit group 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Binding: Amount rule: Record actual lot quantity using cp_landing, apply documented attribution and divide by final accepted net fish kg; do not use the range to replace records. Value mode: foreground_record Specificity: site_specific Normalization basis: per 1 kg reference flow Basis kind: reference_flow Evidence kind: collected_record Collection protocol: cp_landing Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_landing_reject_waste
      applies_to: "landing; outputs; waste"
      requirement: "Identify and separately collect every actual exchange covered by “Specified landing fish and packaging rejects”; retain all following collection, quantity and normalization obligations: Conditional actual unsold rejected fish and discarded packaging, split by material, origin and destination. Record buyer rejection before gate, damaged containers and disposal recipient; do not assume zero or count reusable returns as waste. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; unit group 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Binding: Amount rule: Record actual lot quantity using cp_landing, apply documented attribution and divide by final accepted net fish kg; do not use the range to replace records. Value mode: foreground_record Specificity: site_specific Normalization basis: per 1 kg reference flow Basis kind: reference_flow Evidence kind: collected_record Collection protocol: cp_landing Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_landing_direct_water_substances
      applies_to: "landing; outputs; elementary"
      requirement: "Identify and separately collect every actual exchange covered by “Identified direct waterborne substances from landing”; retain all following collection, quantity and normalization obligations: Conditional actual measured/modelled substances released directly with landing return water, instantiated separately by chemical identity, dissolved/particulate or nutrient basis and freshwater/marine receiving medium; record kg of each substance and concentration/flow evidence. Never use an unspecified pollution UUID or duplicate aggregated wastewater treatment releases. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; unit group 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Binding: Amount rule: Record actual lot quantity using cp_landing_water, apply documented attribution and divide by final accepted net fish kg; do not use the range to replace records. Value mode: foreground_record Specificity: site_specific Normalization basis: per 1 kg reference flow Basis kind: reference_flow Evidence kind: collected_record Collection protocol: cp_landing_water Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_landing_other_exhaust
      applies_to: "landing; outputs; elementary"
      requirement: "Identify and separately collect every actual exchange covered by “Identified non-CO2 landing combustion exhaust to air”; retain all following collection, quantity and normalization obligations: Conditional actual landing combustion pollutants, separately identified by substance, NOx/NO2 reporting basis or particle-size class and air receiving compartment before any concrete exchange is bound. Record actual measured/modelled substance kg, factor and engine evidence; not unspecified generic exhaust. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; unit group 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Binding: Amount rule: Record actual lot quantity using cp_landing_utilities, apply documented attribution and divide by final accepted net fish kg; do not use the range to replace records. Value mode: foreground_record Specificity: site_specific Normalization basis: per 1 kg reference flow Basis kind: reference_flow Evidence kind: collected_record Collection protocol: cp_landing_utilities Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
validation_rules:
  - rule_id: validate_reference
    applies_to: "landed_reference"
    rule: "Require one accepted 1 kg net wet whole-fish reference, correct actual state and first gate, complete qualifiers, calibrated tare method and compatible property/unit."
    source_ids: []
  - rule_id: validate_route
    applies_to: "process map"
    rule: "Require capture and landing; activate preservation only from actual lot records. Landing selects capture transfer or preserved transfer exclusively for each lot; unknown intervention/state is incomplete."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "fish and waste outputs"
    rule: "Reconcile real internal quantities, all intended output gates, pre-gate mortality/rejects and discard destination/survival; do not fix internal quantities to 1 kg or count outputs twice."
    source_ids: []
  - rule_id: validate_mode_period
    applies_to: "all inventory rows"
    rule: "Check trip/season identifiers, complete effort, cleaning/changeover, release cohorts and asset replacement/retirement periods; attribution is explicit and no shared-run/period burden is duplicated."
    source_ids:
      - ghg-product-allocation
  - rule_id: validate_shared
    applies_to: "infrastructure and outputs"
    rule: "Check complete consumer/output ledger and PCR-specific physical/value attribution evidence with sensitivity where needed; no automatic mass allocation or zero support burden."
    source_ids:
      - ghg-product-allocation
  - rule_id: validate_water_energy
    applies_to: "utilities and emissions"
    rule: "Reconcile input/return/consumption/wastewater ledgers and actual electricity/fuel specification; retain pollutant substance and medium. Avoid duplicate purchased/self-generated energy or treatment/direct-emission burdens."
    source_ids: []
  - rule_id: validate_identities
    applies_to: "all cards"
    rule: "Resolve each actual final exchange to an independently verified concrete identity and support property/unit; unresolved generic cards remain data gaps. A structural check pass does not establish identity or active/publication readiness."
    source_ids: []
  - rule_id: validate_sources_ranges
    applies_to: "all amounts"
    rule: "Keep each measurement protocol and finite Range with correct denominator/evidence; final 1–1 kg is method definition. Other provisional screens cannot supply missing observations, fixed factors or regulatory limits."
    source_ids: []
  - rule_id: validate_inventory_completion
    applies_to: "all concrete exchanges and section 8 completion obligations"
    rule: "Verify each applicable dq_complete obligation has separately measured and identity-verified exchange cards. Check each quantity, native unit, range evidence, normalization, receiving medium, destination and non-duplication. Any unfulfilled actual child exchange, quantity, identity or destination makes the final dataset incomplete and fails validation; unknown cannot be zero. Static PCR checking does not replace this evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground collection package projected to secondary_dataset or background_dataset after evidence and identity review"
  downstream_use: "Input to food-fish process and lifecyclemodel at compatible first landing gate"
  allowed_use: "Documented wild whole-fish lot and actual live/fresh/chilled state, species, habitat, period and gear"
  excluded_use: "Aquaculture; ornamental/seed; gutted/fillet/frozen fish; downstream processing/distribution; universal cross-state or cross-fishery equivalence"
  required_metadata: "Reference identity/support; species/origin/stock; habitat/geography/gear; first gate/state; trip/season; preservation; provider/asset/release periods; output set and attribution"
  required_quality_disclosure: "Record/measurement coverage; unresolved identities or factors; stock-enhancement contribution; discard/gear uncertainty; provisional ranges; allocation sensitivity; excluded burdens"
  update_trigger: "Gate/state/species/stock or enhancement change; gear/provider/voltage/material change; season/period change; new emissions or evidence; revised site records or methodology"
data_sources:
  - id: "noaa-salmon-fishery-planning"
    type: "official_guidance"
    reference: "https://www.fisheries.noaa.gov/west-coast/sustainable-fisheries/salmon-life-cycle-and-seasonal-fishery-planning"
    used_for: "Qualitative migration, actual catch habitat and seasonal stock context; no transferred biological numbers."
  - id: "noaa-pacific-salmon-support"
    type: "official_guidance"
    reference: "https://www.fisheries.noaa.gov/species/pacific-salmon-and-steelhead"
    used_for: "Qualitative hatchery support of wild stocks; attribution requires actual evidence."
  - id: "fao-capture-ice-handling"
    type: "official_guidance"
    reference: "https://www.fao.org/4/y5013e/y5013e07.htm"
    used_for: "Qualitative capture handling, ice/holding resources, containers and losses; historical numerical examples are not prescribed factors."
  - id: "fao-live-fish-handling"
    type: "official_guidance"
    reference: "https://www.fao.org/4/v7180e/v7180e08.htm"
    used_for: "Qualitative live holding, water/oxygen and handling-quality records; no universal operating settings."
  - id: "ghg-product-allocation"
    type: "standard"
    reference: "https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Chapter 9 allocation hierarchy and sensitivity only, not whole-standard compliance."
  - id: "un-cpc3-aquatic-notes"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification context only; whole-fish scope is narrower than 04221 presentations."
  - id: "declared-reference-definition"
    type: "method_factor"
    reference: "Internal declared reference and normalization convention in this PCR sections 3 and 8 reference_definition; not external empirical evidence"
    used_for: "Final 1 kg output and 1–1 kg method-definition Range"
