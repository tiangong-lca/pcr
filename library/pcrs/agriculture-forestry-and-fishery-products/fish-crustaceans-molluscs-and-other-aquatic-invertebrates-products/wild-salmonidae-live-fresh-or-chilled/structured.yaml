system_boundary:
  rules:
    - rule_id: boundary_capture
      applies_to: "capture"
      rule: "Include actual trip mobilization, outbound/return travel, gear deployment/retrieval, retention and first-capture handling; record habitat and effort independently from taxonomy. Natural growth is not foreground farming."
      source_ids:
        - noaa-salmon-fishery-planning
    - rule_id: boundary_preserve
      applies_to: "preserve"
      rule: "Include actual pre-gate live holding or chilling only when performed; record usable state before intervention and stabilized state/time at transfer. Exclude freezing, gutting and filleting."
      source_ids:
        - fao-capture-ice-handling
        - fao-live-fish-handling
    - rule_id: boundary_landing
      applies_to: "landing"
      rule: "Include first-landing acceptance, protective packaging and producer-owned handling before handover; identify package material/reuse and final state. Later distribution is outside this node."
      source_ids:
        - fao-capture-ice-handling
    - rule_id: boundary_support
      applies_to: "stock_enhancement"
      rule: "Determine release-stock contribution from actual origin evidence and quantify attributable upstream provider burden with documented periods; unknown contribution is a disclosed gap, not zero or invented cultivation."
      source_ids:
        - noaa-pacific-salmon-support
    - rule_id: boundary_period_assets
      applies_to: "all processes"
      rule: "Link trip, holding, landing, seasonal reporting and asset service/replacement/retirement periods; enumerate shared vessel, hold, pumps, landing platform and every consuming node. Include attributable material and service burdens once."
      source_ids: []
    - rule_id: boundary_ecosystem
      applies_to: "catch records"
      rule: "Record removed target/non-target biomass, live releases, discard survival/mortality and gear loss with locations and uncertainty. Establish actual destination and material/substance before adding exchanges; do not invent an elementary fish-stock UUID."
      source_ids:
        - noaa-salmon-fishery-planning
    - rule_id: boundary_full_inventory
      applies_to: "all processes"
      rule: "Inventory actual ancillary fuels, energy, water abstraction, treatment agents, wastewater and direct species-specific releases wherever used, including pre-gate cleaning/changeover; collection obligations in Section 8 require actual concrete exchanges rather than generic default identities."
      source_ids: []
