  calculation_rules:
    - id: lot_mass_attribution
      applies_to: "all inventory rows"
      rule: "After documented output/period attribution, divide each applicable lot total by accepted net wet whole-fish kg from cp_final; retain actual internal mass and do not treat transfers as new purchases."
      inputs:
        - "Linked lot records"
        - attribution
        - cp_final
      output: "Exchange quantity per 1 kg reference flow"
      source_ids: []
    - id: reference_definition
      applies_to: "landed_reference"
      rule: "The declared reference is exactly 1 kg accepted net wet whole fish; the 1–1 kg Range is this internal method definition, not an empirical fish-yield factor."
      inputs:
        - cp_final
      output: "1 kg reference output"
      source_ids: []
    - id: electricity_conversion
      applies_to: "electricity inputs"
      rule: "Convert recorded kWh to MJ only when needed, using 3.6 MJ per kWh; preserve quantity and unit evidence."
      inputs:
        - "Meter kWh"
        - "provider and voltage"
      output: "kWh or equivalent MJ"
      source_ids: []
    - id: catch_reconciliation
      applies_to: "fish outputs and internal transfers"
      rule: "Reconcile target retained biomass, accepted final fish, pre-gate losses, intended other output and discards by lot and state; retain live-release survival/mortality uncertainty separately."
      inputs:
        - cp_catch
        - cp_preserve
        - cp_landing
        - cp_final
      output: "Consistent catch/transfer/dispatch ledger"
      source_ids: []
    - id: substance_calculation
      applies_to: "capture_fossil_co2; capture_nox"
      rule: "Use actual measured emissions or documented fuel-carbon/engine model with substance basis, compartment, factor provenance and uncertainty; no fixed factor is prescribed."
      inputs:
        - cp_capture
        - cp_emissions
      output: "Direct pollutant mass"
      source_ids: []
  data_quality_requirements:
    - id: identity_gate_state
      applies_to: "reference and fish transfers"
      requirement: "Scientific Salmonidae identity, wild origin, habitat and actual first gate/state must agree; unknown state is incomplete."
      evidence: "Species/origin documentation and lot acceptance"
    - id: full_coverage
      applies_to: "all inventory rows"
      requirement: "Represent complete trip/season including unsuccessful effort, maintenance, washing, changeovers, replacement and pre-gate losses; justify exclusions and data gaps."
      evidence: "Matched trip/stock/service/water/meter ledgers"
    - id: scope_match
      applies_to: "providers and identities"
      requirement: "Match actual material, pollutant, flow type, receiving medium, country/voltage, provider and gate; refine collection obligations in Section 8 into concrete independently verified identities before final exchanges."
      evidence: "Provider specification; detail verification and quality record"
    - id: range_screen
      applies_to: "all cards"
      requirement: "Actual records take precedence over provisional reasoned QA ranges; justify excursions, absence and substituted model quantities; assess uncertainty without forcing values within screens."
      evidence: "Site records; reviewed range replacement and sensitivity"
    - id: ecosystem_records
      applies_to: "capture"
      requirement: "Retain stock status/permit context from current jurisdiction, discard survival, habitat/gear impacts and lost gear evidence; numeric regulations are not supplied here."
      evidence: "Actual dated permits, observer and gear-loss records"
    - id: dq_inventory_completion
      applies_to: "all inventory-completion requirements"
      requirement: "Create a separate card for every actual physical or chemical exchange, with process, direction, flow type, its own measured quantity, native unit, final-reference normalization, applicability, destination, UUID and independent range evidence. Never copy a family total, a grouped screening range or one UUID onto every child. Use not_applicable only for evidenced absence; unknown is not zero. Any unfulfilled applicable obligation makes the final dataset incomplete and fails validation."
      evidence: "per-flow coverage ledger, raw measurements, identity, fate and range evidence"
    - id: dq_complete_other_capture_fuel
      applies_to: "capture; inputs; product"
      requirement: "Identify and separately collect every actual exchange covered by “Specified marine or shore capture fuels”; retain all following collection, quantity and normalization obligations: Conditional actual marine/brackish vessel or shore engine fuel, identified by grade, fossil/biogenic composition and engine use. Separate each actual fuel; no inland-diesel identity applies automatically. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; unit group 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Binding: Amount rule: Record actual lot quantity using cp_capture, apply documented attribution and divide by final accepted net fish kg; do not use the range to replace records. Value mode: foreground_record Specificity: site_specific Normalization basis: per 1 kg reference flow Basis kind: reference_flow Evidence kind: collected_record Collection protocol: cp_capture Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
