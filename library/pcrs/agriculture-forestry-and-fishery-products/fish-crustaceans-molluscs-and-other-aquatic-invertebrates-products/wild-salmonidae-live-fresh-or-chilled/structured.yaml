allocation_rules:
  - rule_id: allocation_output_set
    applies_to: "all intended outputs"
    rule: "Enumerate each species/state/purpose and actual handover. Marketed bycatch or non-food output needs intention, destination and receipts; residues, unsold dead catch, live releases and packaging returns are separately classified. Do not create a co-product merely to allocate burden away."
    source_ids:
      - ghg-product-allocation
  - rule_id: allocation_hierarchy
    applies_to: "shared trip outputs"
    rule: "Prefer separately measured trip/gear/holding tasks and subdivision. For indivisible joint capture, document a causal physical attribution if supported; otherwise disclose a justified value-based or other relationship with same-gate period prices and sensitivity. Simple catch mass is not automatically causal for incidental bycatch."
    source_ids:
      - ghg-product-allocation
  - rule_id: allocation_period
    applies_to: "all nodes and periods"
    rule: "Assign successful/unsuccessful trip effort, seasonal cleaning/changeover and replacement/retirement to their actual output/period scope; list release-cohort and asset-service periods and their supported allocation separately. Do not discard unsuccessful effort or count service burdens in multiple periods."
    source_ids:
      - ghg-product-allocation
  - rule_id: allocation_shared
    applies_to: "shared infrastructure"
    rule: "Maintain one asset/service ledger for vessel, hold, pumps and landing platform; enumerate capture/preserve/landing consumers and relevant periods. Allocate by evidenced service/time/causal use and disclose assumptions; material service shares, replacement and cleaning appear once."
    source_ids:
      - ghg-product-allocation
  - rule_id: allocation_internal
    applies_to: "fish transfers"
    rule: "Link captured, preserved and landing transfers to the same lot; transfer exchanges cancel on aggregation. Reconcile retained fish, final accepted mass, purposeful other outputs, pre-gate rejects and live/dead discards; no duplicate capture or final output."
    source_ids: []
  - rule_id: allocation_support
    applies_to: "stock_enhancement"
    rule: "Preserve documented provider/release attribution and exclude overlap with supplied-input burdens; uncertain mixed hatchery/wild composition needs uncertainty and sensitivity rather than automatic zero."
    source_ids:
      - noaa-pacific-salmon-support
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "fuel"
      record_type: "trip fuel account"
      raw_fields: "trip; habitat; engine; fuel grade; purchases; opening/closing tanks; density; burned mass"
      collection_method: "Receipts and tank/fuel-meter reconciliation with density evidence; Attributed trip fuel mass per 1 kg reference flow."
      unit: "kg"
      frequency: "Each trip"
      temporal_coverage: "Complete season including unsuccessful trips"
      site_scope: "Actual vessel/shore engine"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Invoices; tank calibration; effort/catch crosscheck"
    - protocol_id: cp_assets
      process_id: "capture"
      flow_role: "shared materials"
      record_type: "asset register"
      raw_fields: "asset; composition; installed mass; repair/replacement; commissioning/retirement; service life; consumer nodes; service hours; reporting periods"
      collection_method: "Asset bills, maintenance logs and observed service use; Attributed material service mass per 1 kg reference flow."
      unit: "kg"
      frequency: "Each asset event and annual service review"
      temporal_coverage: "Installation through retirement across reporting periods"
      site_scope: "Vessel; gear; shared hold/pumps/landing assets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Bills; maintenance; consumer ledger and no duplicate burden"
    - protocol_id: cp_enhancement
      process_id: "capture"
      flow_role: "stock support"
      record_type: "provider and stock account"
      raw_fields: "species; release cohort; stock markers; release biomass; provider scope; contribution evidence; attribution; periods; uncertainty"
      collection_method: "Provider primary records and catch-origin assessment; gaps require review; Attributed physical released juvenile fish mass per 1 kg reference flow."
      unit: "kg"
      frequency: "Each release cohort and season assessment"
      temporal_coverage: "Linked release years and captured season"
      site_scope: "Actual release provider and captured stock"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Provider inventory; markers; attribution and uncertainty review"
    - protocol_id: cp_catch
      process_id: "capture"
      flow_role: "fish outputs"
      record_type: "catch and discard ledger"
      raw_fields: "trip; species; stock; habitat; retained wet mass; marketed outputs; live release count/mass; dead discards; survival; destination; gear loss"
      collection_method: "Weigh representative catch and landing lots; observer/gear logs and discard survival evidence; Attributed wet fish mass per 1 kg reference flow."
      unit: "kg"
      frequency: "Each haul/shore event and trip"
      temporal_coverage: "Whole season with all target and non-target catch"
      site_scope: "Actual capture location and first receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; species record; observer coverage; mortality uncertainty"
    - protocol_id: cp_emissions
      process_id: "capture"
      flow_role: "direct engine releases"
      record_type: "fuel and emission account"
      raw_fields: "fuel mass; fossil carbon; oxidation; engine; pollutant; NO2 basis; compartment; factor/source; uncertainty"
      collection_method: "Use measured emissions or validated fuel/engine model; retain factor provenance and distinguish upstream; Attributed direct substance mass per 1 kg reference flow."
      unit: "kg"
      frequency: "Each fuel period/engine campaign"
      temporal_coverage: "Same complete season as fuel ledger"
      site_scope: "Actual engine and air receiving compartment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Fuel balance; factor applicability; measurement uncertainty"
    - protocol_id: cp_preserve
      process_id: "preserve"
      flow_role: "holding inputs and fish"
      record_type: "holding-lot ledger"
      raw_fields: "trip/lot; activation; initial/final state; wet fish mass; time/temperature; ice; oxygen purity/pressure/mass; energy kWh; provider/voltage; mortality; recipient"
      collection_method: "Weigh fish/ice/oxygen; read dedicated meters; record actual holding branch and temperature/time; Attributed measured kg or kWh per 1 kg reference flow."
      unit: "kg; kWh"
      frequency: "Each holding lot and meter interval"
      temporal_coverage: "All pre-gate holding intervals in season"
      site_scope: "Actual vessel hold or pre-gate holding site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale/meter calibration; oxygen invoice; branch and fish balance"
    - protocol_id: cp_capture_water
      process_id: "capture"
      flow_role: "water"
      record_type: "node water balance"
      raw_fields: "lot; provider; suitable quality; waterbody/salinity and receiving compartment; intake; purchased kg; circulation; return; consumption; wastewater destination; solids; chemical identity; reported elemental/compound mass basis; dissolved/particulate fraction; concentration and unit; matched discharge volume/flow, sampling time and interval; paired intake-background concentration/load; density and conversion evidence; analytical method; lab QA, detection/quantification limits and uncertainty; actual model/factor provenance, units, applicability and coverage when used"
      collection_method: "Meter inputs/outputs and match discharge flow/time with representative substance samples; document density and unit conversion, chemical identity, elemental/compound basis and dissolved/particulate fraction. Calculate each actual substance load from matched concentration and discharge volume/interval. Report gross returned load separately from incremental process release; deduct intake background only from matched evidence with an explicit attribution rationale, otherwise disclose the unresolved net-release gap rather than assume zero background. Retain lab QA, detection-limit/non-detect treatment and uncertainty. If modelled, retain actual factor/model source, version, boundary, activity basis, coverage and uncertainty without empirical defaults. Keep direct releases distinct from treatment-bound effluent and avoid duplicate substances in aggregated effluent inventories; attributed water and substance mass per 1 kg reference flow."
      unit: "kg water; kg substance; recorded concentration/flow/time units with conversion evidence"
      frequency: "Each node lot and drainage event"
      temporal_coverage: "Full season including cleaning/changeover"
      site_scope: "Actual node water source and recipient"
      aggregation_rule: "per 1 kg reference flow"
