allocation_rules:
  - rule_id: allocation_cohorts
    applies_to: "nursery; growout; all subsequent nodes"
    rule: "Index hatchery, nursery, growout and dispatch cohorts against continuously operated RAS periods. Subdivide independently metered feed/equipment/events first; carry the remaining shared operating burden using documented biomass-time and actual service demand, with metered energy alternatives and sensitivity where these differ. Record all cohorts served, including failures and live closing stock. No burden is assigned only to survivors of a convenient period."
    source_ids: []
  - rule_id: allocation_outputs
    applies_to: "all intended product outputs"
    rule: "List every intended animal destination, grade, research/outplant transfer, live retained cohort and return with its gate and quantity. Attribute separable activities directly; allocate residual shared animal production burden using measured animal biomass-time/service demand before final mass normalization, justify physical causality, and test receipt-mass or documented relative-value sensitivity if causality is unresolved. Retained live stock carries accumulated burden into its later period rather than becoming current waste or accepted A. No avoided-production credit."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "shared infrastructure; reusable containers"
    rule: "Maintain one asset/service ledger covering construction materials, service-life evidence, repairs, replacements, idle/failed periods, cleanup and termination. Enumerate every consuming node and period; use measured pump/filter hours, metered service, occupied volume/time or actual reuse turns as appropriate, explain selection and alternatives. Sum assigned fractions to the recorded service total; no universal lifetime or free reusable container."
    source_ids: []
  - rule_id: allocation_service
    applies_to: "complete supplier services"
    rule: "A complete purchased transport, handling, treatment or asset service owns its included components once. If component modelling replaces it, document consistent coverage and remove overlapping service burden. Internal paired transfers move physical quantities and accumulated burdens without creating new production or a second final animal output."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_nursery
      process_id: "nursery"
      flow_role: "Every actual card instance in this node"
      record_type: "Measured event, supplier/service record and cohort/asset ledger"
      raw_fields: "hatchery receipt/cohort; settlement/earlier nursery history; seed count and sampled wet mass; nursery entry/exit; food as-fed stocks/rations; water sources and exchanges; mortality; T0; other destinations; nursery-active/absent evidence; instance identity/property/native unit/quantity/U_row; chemical/carbon/medium basis; service coverage/life; A"
      collection_method: "Inspect actual seed receipt and nursery start/end records; count and calibrated sample/whole-lot weighing; reconcile food, water, mortality and nursery-ready handoff T0. Retain each material and service's own native measurement; do not unify unlike services into kg or h. Attribute each actual instance once under Section 7, dividing its attributable native amount by same-lot accepted net animal mass A."
      unit: "kg; kWh; t*km; actual carrier/service native unit and evidenced equivalent conversion"
      frequency: "Each transfer/use/release/event; stock and shared services each reporting period"
      temporal_coverage: "All actual nursery periods serving the cohort, including failure, idle, cleanup and closing stock"
      site_scope: "Declared site and actual suppliers/recipients for nursery"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare; cohort receipt/stock records; invoices; meters; fate receipts; lab and factor basis; allocation/life sensitivity"
    - protocol_id: cp_growout
      process_id: "growout"
      flow_role: "Every actual card instance in this node"
      record_type: "Measured event, supplier/service record and cohort/asset ledger"
      raw_fields: "RAS/trough/cohort; E0/T0 and TR receipts; feed product/history/as-fed stocks/ration/leftovers; meters; seawater make-up and purge; recirculated volume; inlet/outlet species samples; filter sludge; mortality; repairs; T1/T1m; live closing stock; instance identity/property/native unit/quantity/U_row; chemical/carbon/medium basis; service coverage/life; A"
      collection_method: "Read cohort/feed and actual continuously operated RAS logs; meter energy/make-up/purge, sample matched inlet/outlet substances and weigh filter solids; reconcile mortality/stock and collection withdrawal T1/T1m. Retain each material and service's own native measurement; do not unify unlike services into kg or h. Attribute each actual instance once under Section 7, dividing its attributable native amount by same-lot accepted net animal mass A."
      unit: "kg; kWh; t*km; actual carrier/service native unit and evidenced equivalent conversion"
      frequency: "Each transfer/use/release/event; stock and shared services each reporting period"
      temporal_coverage: "All actual growout periods serving the cohort, including failure, idle, cleanup and closing stock"
      site_scope: "Declared site and actual suppliers/recipients for growout"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare; cohort receipt/stock records; invoices; meters; fate receipts; lab and factor basis; allocation/life sensitivity"
    - protocol_id: cp_collection
      process_id: "collection"
      flow_role: "Every actual card instance in this node"
      record_type: "Measured event, supplier/service record and cohort/asset ledger"
      raw_fields: "collection event/trough; pre-removal live state; T1 and T1m; animal count/wet mass T2; separate matter mass T2m; actual incidental environmental matter; removed matter/loss; tools and service time; instance identity/property/native unit/quantity/U_row; chemical/carbon/medium basis; service coverage/life; A"
      collection_method: "Observe actual manual removal and separately weigh/count animals and carried matter; pair T1/T1m inputs and distinct T2/T2m outputs; record own tools, losses and fates without repeating growth. Retain each material and service's own native measurement; do not unify unlike services into kg or h. Attribute each actual instance once under Section 7, dividing its attributable native amount by same-lot accepted net animal mass A."
      unit: "kg; kWh; t*km; actual carrier/service native unit and evidenced equivalent conversion"
      frequency: "Each transfer/use/release/event; stock and shared services each reporting period"
      temporal_coverage: "All actual collection periods serving the cohort, including failure, idle, cleanup and closing stock"
      site_scope: "Declared site and actual suppliers/recipients for collection"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare; cohort receipt/stock records; invoices; meters; fate receipts; lab and factor basis; allocation/life sensitivity"
    - protocol_id: cp_sorting
      process_id: "sorting"
      flow_role: "Every actual card instance in this node"
      record_type: "Measured event, supplier/service record and cohort/asset ledger"
      raw_fields: "T2 animal mass/count; T2m water/biofilm/fragments; grade criterion/result; T3 or T3b branch; TR returned cohort; alternate recipient/stock gates; animal rejects and removed-matter fates; instance identity/property/native unit/quantity/U_row; chemical/carbon/medium basis; service coverage/life; A"
      collection_method: "Grade actual incoming lot, separately weigh each animal destination and carried matter, inspect live state, and match sorting returns and selected holding/bypass branch with receiving node. Retain each material and service's own native measurement; do not unify unlike services into kg or h. Attribute each actual instance once under Section 7, dividing its attributable native amount by same-lot accepted net animal mass A."
      unit: "kg; kWh; t*km; actual carrier/service native unit and evidenced equivalent conversion"
      frequency: "Each transfer/use/release/event; stock and shared services each reporting period"
      temporal_coverage: "All actual sorting periods serving the cohort, including failure, idle, cleanup and closing stock"
      site_scope: "Declared site and actual suppliers/recipients for sorting"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare; cohort receipt/stock records; invoices; meters; fate receipts; lab and factor basis; allocation/life sensitivity"
    - protocol_id: cp_holding
      process_id: "holding"
      flow_role: "Every actual card instance in this node"
      record_type: "Measured event, supplier/service record and cohort/asset ledger"
      raw_fields: "holding-active/absent/unknown evidence; T3 entry time/state/mass/count; actual bounded intervention and equipment; duration; water/oxygen/energy; T4 exit time/live state/mass/count; alternate outputs/mortality; instance identity/property/native unit/quantity/U_row; chemical/carbon/medium basis; service coverage/life; A"
      collection_method: "Read actual entry/exit and equipment/service records for the bounded intervention; observe exit live eligibility and paired T3/T4, reconcile duration, resources, wastes and losses; otherwise substantiate T3b bypass. Retain each material and service's own native measurement; do not unify unlike services into kg or h. Attribute each actual instance once under Section 7, dividing its attributable native amount by same-lot accepted net animal mass A."
      unit: "kg; kWh; t*km; actual carrier/service native unit and evidenced equivalent conversion"
      frequency: "Each transfer/use/release/event; stock and shared services each reporting period"
      temporal_coverage: "All actual holding periods serving the cohort, including failure, idle, cleanup and closing stock"
      site_scope: "Declared site and actual suppliers/recipients for holding"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare; cohort receipt/stock records; invoices; meters; fate receipts; lab and factor basis; allocation/life sensitivity"
    - protocol_id: cp_presentation
      process_id: "presentation"
      flow_role: "Every actual card instance in this node"
      record_type: "Measured event, supplier/service record and cohort/asset ledger"
      raw_fields: "T4 or T3b branch; live animal mass/count; T5 dispatch; package/tote/liner/moisture material; reuse/replacement/cleaning/return; separate animal/package/free-water mass; alternate destinations; instance identity/property/native unit/quantity/U_row; chemical/carbon/medium basis; service coverage/life; A"
      collection_method: "Inspect presentation entry/dispatch, weigh net animal mass separately from packaging and carriers, record package/reuse ledger and cleaning, pair T5 and identify actual non-reference destinations. Retain each material and service's own native measurement; do not unify unlike services into kg or h. Attribute each actual instance once under Section 7, dividing its attributable native amount by same-lot accepted net animal mass A."
      unit: "kg; kWh; t*km; actual carrier/service native unit and evidenced equivalent conversion"
      frequency: "Each transfer/use/release/event; stock and shared services each reporting period"
      temporal_coverage: "All actual presentation periods serving the cohort, including failure, idle, cleanup and closing stock"
      site_scope: "Declared site and actual suppliers/recipients for presentation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare; cohort receipt/stock records; invoices; meters; fate receipts; lab and factor basis; allocation/life sensitivity"
    - protocol_id: cp_delivery
      process_id: "delivery"
      flow_role: "Every actual card instance in this node"
      record_type: "Measured event, supplier/service record and cohort/asset ledger"
      raw_fields: "T5 dispatch; every actual leg/operator/payer; cargo animal/package/water mass; mode/distance/load/return; interim/terminal services; arrival time/location/live/never-frozen state; gross/tare/drain and accepted net A; rejects; alternate recipients/returns; instance identity/property/native unit/quantity/U_row; chemical/carbon/medium basis; service coverage/life; A"
      collection_method: "Trace actual dispatch through each pre-receipt leg/service to physical acceptance; inspect arrival live state and never-frozen chain, weigh calibrated gross/tare/net/drained same-lot animals and reconcile accepted A, rejected/returned goods and carriers. Retain each material and service's own native measurement; do not unify unlike services into kg or h. Attribute each actual instance once under Section 7, dividing its attributable native amount by same-lot accepted net animal mass A."
      unit: "kg; kWh; t*km; actual carrier/service native unit and evidenced equivalent conversion"
      frequency: "Each transfer/use/release/event; stock and shared services each reporting period"
      temporal_coverage: "All actual delivery periods serving the cohort, including failure, idle, cleanup and closing stock"
      site_scope: "Declared site and actual suppliers/recipients for delivery"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare; cohort receipt/stock records; invoices; meters; fate receipts; lab and factor basis; allocation/life sensitivity"
  calculation_rules:
    - id: same_lot_reference
      applies_to: "live_urchins_receipt"
      rule: "A / A = 1 kg reference animal output when A is a positive measured accepted same-lot mass; retain raw A and reject zero/missing A."
      inputs:
        - "accepted receipt mass A"
        - cp_delivery
      output: "reference amount 1 kg"
      source_ids:
        - mass-normalization-identity
    - id: period_attribution
      applies_to: "all inventory rows"
      rule: "Attribute recorded period exchanges to cohorts and intended outputs under the allocation rules, then divide attributable exchange by the actual positive accepted animal mass A; retain native numerator units and carry closing-stock burdens forward."
      inputs:
        - "node records"
        - "cohort/asset ledgers"
        - A
      output: "attributable native-unit exchange per 1 kg reference flow"
      source_ids: []
    - id: water_pollutant_balance
      applies_to: "direct water releases"
      rule: "Calculate each actual outfall substance mass from compatible measured discharge concentration and discharge volume with explicit unit conversion. Retain compatible inlet mass, stock change and biological retention separately. Outfall-minus-inlet increment is a balance diagnostic only, never automatically a negative elementary output or credit. Disclose chemical speciation, carbon origin, medium, uncertainty and any factor. Returned carrier-water mass remains separate."
      inputs:
        - "inlet/outlet sample and volume"
        - "species basis"
        - density
      output: "pollutant-specific mass and separate water mass"
      source_ids: []
    - id: stock_transfer_reconciliation
      applies_to: "animal and carried-matter transfers"
      rule: "Reconcile opening stock, received seed/returns, growth, collected departures, other intended outputs, actual mortalities and closing stock by cohort; reconcile separately each T0/T1/T1m/T2/T2m/T3/T3b/T4/T5/TR pair. Biomass growth is not count creation; do not balance animals by including water."
      inputs:
        - "cohort counts/masses"
        - "transfer ids"
        - "loss/matter records"
      output: "disclosed stock and transfer reconciliation with uncertainty"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference and actual exchanges"
      requirement: "Prove species/hatchery origin, production state and selected formulated-feed route; verify each concrete flow and property/unit before downstream exchange binding."
      evidence: "supplier/cohort records; feed history; detail verification"
    - id: dq_receipt
      applies_to: "live_urchins_receipt"
      requirement: "Actual recipient location/time, acceptance, live state and never-frozen history with net mass method are mandatory. Market-size research or a potential channel is insufficient."
      evidence: "physical receipt record; calibrated scale/tare/draining log; lot state"
    - id: dq_completeness
      applies_to: "all periods/nodes"
      requirement: "Include failed and rejected cohorts, mortality, feed changes, water and pollutant fates, incident matter, retained stock, assets/reuse, all actual logistics and unknown conditional states."
      evidence: "cohort/stock balances; event logs; route and service reconciliation"
    - id: dq_uncertainty
      applies_to: "all variable amounts"
      requirement: "Obtain instance-specific U_row and data provenance; explain sampling, missingness, conversion and allocation sensitivity. Symbolic ranges and absent identities remain disclosed candidate gaps."
      evidence: "measured records; uncertainty bounds; method assumptions; sensitivity report"
    - id: collect_nursery_feed_materials
      applies_to: "nursery; Inputs; Product flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual nursery foods and mass-measured consumable materials. Separate actual kelp, manufactured feed, oxygen and chemicals by supplied material and native mass basis. No trial diet recipe is prescribed. Asset/container services are separate. <br> - Flow property / unit: Mass / kg <br> - Amount rule: Measured attributable instance amount per 1 kg reference flow; preserve raw node/period quantity and native unit. <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_nursery <br> - Range: Unresolved instance-specific range evidence; no empirical bound supplied <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_nursery_feed_materials <br> - Unit: kg <br> - Basis: per 1 kg reference flow; U_nursery_feed_materials must be established for this actual instance <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: collect_nursery_non_electric_energy
      applies_to: "nursery; Inputs; Product flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: On-site juvenile nursery actual non-electric energy carriers. Conditional on actual use: instantiate each fuel or supplied thermal energy carrier with native mass/volume/energy unit and matching U_row unit, supplier and measured quantity. Link combustion/off-gas to the same event and carbon origin; complete supplier services already containing fuel are not duplicated. Observed absence requires evidence. <br> - Flow property / unit: Actual carrier property / actual native carrier unit <br> - Amount rule: Measured attributable instance amount per 1 kg reference flow; preserve raw node/period quantity and native unit. <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_nursery <br> - Range: Unresolved instance-specific range evidence; no empirical bound supplied <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_nursery_non_electric_energy <br> - Unit: actual native carrier unit <br> - Basis: per 1 kg reference flow; U_nursery_non_electric_energy must be established for this actual instance <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
