system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "nursery; growout"
      rule: "Include actual on-site nursery and complete prior seed history, then V-trough RAS growth, feed changes, water/solids treatment, maintenance, monitoring, failed batches and mortality. Historical methods establish route responsibilities, not site-specific quantities or proof of sale."
      source_ids:
        - umaine-green-urchin-growout-2013
    - rule_id: boundary_handoffs
      applies_to: "all nodes"
      rule: "Use T0 or external E0 for growout seed, T1/T1m for culture withdrawal, T2/T2m for collected animals/matter, T3 and T4 when holding occurs or T3b bypass when absent, T5 for dispatch and TR for sorting returns. Each actual handoff has paired outputs/inputs and one quantity/state owner. On-site nursery or holding unknown state cannot default to inactive."
      source_ids: []
    - rule_id: boundary_receipt
      applies_to: "delivery"
      rule: "Include every actual pre-receipt loading, transport, interim holding, terminal operation and acceptance event irrespective of ownership, payer or invoice. End at evidenced first physical recipient acceptance; retain rejected dispatch burdens. Potential whole-live channels do not prove a shipment."
      source_ids:
        - noaa-green-urchin-manual-2023
    - rule_id: boundary_assets
      applies_to: "all nodes"
      rule: "Record V-troughs, plumbing, biofilter, solids filter, fractionator, oxygen/UV systems, pumps, building, tools and reuse containers as actual asset/service instances. Link consuming nodes, cohorts and periods, repair/replacement, actual service life and end-of-use fate; no prescribed lifetime."
      source_ids:
        - umaine-green-urchin-growout-2013
    - rule_id: boundary_fates
      applies_to: "all nodes"
      rule: "Supplier water is product supply; direct withdrawal is elementary input; internal circulation is neither repeated withdrawal nor discharge. Distinguish actual treatment-bound wastes from direct environmental releases, returned carrier water from each pollutant, and fossil from biogenic carbon. Expand each conditional umbrella into actual zero/one/multiple documented exchanges; unknown applicability is a gap, not zero."
      source_ids: []
