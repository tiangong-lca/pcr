      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Pre-receipt mortality, rejected goods and wastes to treatment. Include all dispatch losses and actual disposal/cleanup fate even when recipient rejects the entire lot; no accepted lot means no fabricated reference dataset. <br> - Flow property / unit: Mass / kg <br> - Amount rule: Measured attributable instance amount per 1 kg reference flow; preserve raw node/period quantity and native unit. <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_delivery <br> - Range: Unresolved instance-specific range evidence; no empirical bound supplied <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_delivery_wastes <br> - Unit: kg <br> - Basis: per 1 kg reference flow; U_delivery_wastes must be established for this actual instance <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: collect_delivery_direct_releases
      applies_to: "delivery; Outputs; Elementary flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Direct pre-receipt releases outside purchased complete services. Record separately owned actual release substances/medium, carbon origin and quantity; exclude emissions already inside collect_delivery_services and distinguish wastewater treatment. <br> - Flow property / unit: Mass / kg <br> - Amount rule: Measured attributable instance amount per 1 kg reference flow; preserve raw node/period quantity and native unit. <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_delivery <br> - Range: Unresolved instance-specific range evidence; no empirical bound supplied <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_delivery_direct_releases <br> - Unit: kg <br> - Basis: per 1 kg reference flow; U_delivery_direct_releases must be established for this actual instance <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: dq_logistics_water_balance
      applies_to: "logistics, services and water/nutrient balances"
      requirement: "Actual payload includes accompanying water, ice, packaging and other cargo. Empty return/repositioning still consumes activity: account for its actual fuel/distance/vehicle service and explicit attribution; zero cargo tonne-kilometres cannot erase that duty. Do not duplicate a complete service and covered fuel, materials, assets or direct releases. Measure external abstraction, supplied water product, internal circulation and actual returned/discharged water separately; never deduct internal recirculation again from external intake. Net nutrient increment/retention is a separate balance diagnostic, never automatically a negative elementary flow, negative emission or avoided burden."
      evidence: "Actual load/vehicle duty records, service scope, same-lot water/substance balance and method evidence"
validation_rules:
  - rule_id: validation_scope
    applies_to: "reference"
    rule: "Require S. droebachiensis, hatchery origin, Maine land-based V-trough RAS/formulated-feed history, whole native test/spines, live never-frozen state and actual first physical receipt. Excluded routes or missing acceptance cannot be relabelled to pass."
    source_ids: []
  - rule_id: validation_mass
    applies_to: "all nodes"
    rule: "Check calibrated receipt net mass, positive A, final 1 kg, native units, feed/water/count conversions and exact matched transfer state/mass/count, including carrying matter and both holding branches. Internal quantities need not equal 1 kg."
    source_ids:
      - mass-normalization-identity
  - rule_id: validation_outputs
    applies_to: "all nodes"
    rule: "Account every intended grade/destination and retained/returned cohort separately from wastes; require receipt/stock gate and burden ownership, no duplicated final output and no environmental credit. Include collection independent of growth and sorting's incident matter."
    source_ids: []
  - rule_id: validation_periods
    applies_to: "nursery; growout; shared assets"
    rule: "Reconcile run/period/cohort boundaries, cleaning/changeover/repair/replacement/termination, failed periods, mortality, open stock and shared service fractions. Require attribution rationale, actual service-life evidence and sensitivity; prevent repeated asset or complete-service components."
    source_ids: []
  - rule_id: validation_fates
    applies_to: "water; wastes; direct releases"
    rule: "Require actual supplier/abstraction distinction, wastewater treatment versus direct discharge, carrier water versus pollutant species, chemical/N/P/carbon/medium basis and fossil/biogenic distinction. Unknown fate or release is unresolved, not zero."
    source_ids: []
  - rule_id: validation_states
    applies_to: "nursery; holding; all applicable collection obligations"
    rule: "Select actual observed active/absent state and populate zero/one/multiple concrete instances with own quantity, native unit, recipient and verified UUID. Missing state, symbolic U_row, identity or method evidence must remain disclosed; checker success is not publication readiness."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable per-flow collection obligations and final exchanges"
    rule: "Final dataset completion and validation require every actual exchange to have an independent atomic card and its own quantity, property/native unit, collection or calculation evidence, range/uncertainty evidence, normalization, actual destination and verified UUID. Unknown identity, activity state, quantity, range evidence or fate blocks completion; it is never zero, a presumed bypass or permission to omit an obligation. Every important concrete flow retains its own range/uncertainty evidence collection duty; a symbolic upper bound is not an empirical range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package; after review may serve as secondary_dataset or background_dataset"
  downstream_use: "Traceable process and lifecyclemodel projections for the same declared live whole animal receipt state"
  allowed_use: "Matching species, hatchery origin, technology, diet history, geography, period and physically evidenced receipt gate with stated uncertainty"
  excluded_use: "Wild-adult enhancement, ranching/cage/co-culture, extracted roe, dead/eviscerated/frozen product; assumed shipment, profitability, legal eligibility, safety, treatment efficacy or quality guarantees"
  required_metadata: "PCR/version; cohort/site/periods; seed/nursery/feed history; reference/state/receipt; native units; transfer/stock ledgers; asset/services; logistics; allocation and actual active/absent states"
  required_quality_disclosure: "Sources and measured coverage; upstream gaps; failed cohorts; open stock; unresolved identities/ranges/states/fates; allocation and lifetime sensitivity; performed/skipped validation checks"
  update_trigger: "Changed origin, diet, site, technology, output state, recipient gate, treatment, period/asset assumptions, new primary data or verified identities"
data_sources:
  - id: "umaine-green-urchin-growout-2013"
    type: "literature"
    reference: "University of Maine CCAR, Assessment of grow-out strategies for the green sea urchin, 2009–2013 final report, objectives/summary and land nursery/RAS methods, PDF pp. 1–3, 6–10; https://umaine.edu/cooperative-aquaculture/wp-content/uploads/sites/75/2016/03/Final-report-NRAC-Sea-urchin-project.pdf"
    used_for: "Historical hatchery/nursery and recirculating V-trough route, formulated-feed trial history and actual equipment responsibilities; no numerical PCR defaults or commercial shipment claim"
  - id: "noaa-green-urchin-manual-2023"
    type: "handbook"
    reference: "Eddy, Morse, Kogson and Suckling (2023), Green Sea Urchin Aquaculture in the Northeast US: Hatchery, Nursery, and Growout, marketing, PDF pp. 12–13; https://repository.library.noaa.gov/view/noaa/70579/noaa_70579_DS1.pdf"
    used_for: "Potential whole-live recipient channel; actual eligible receipt must be independently evidenced; no safety, disease, legal, shelf-life, profitability or roe-quality prescription"
  - id: "un-cpc3-04522-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 explanatory notes, 30 June 2025, 04522; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification context only: farmed sea urchins with/without shell, live/fresh/chilled; this PCR is narrower"
