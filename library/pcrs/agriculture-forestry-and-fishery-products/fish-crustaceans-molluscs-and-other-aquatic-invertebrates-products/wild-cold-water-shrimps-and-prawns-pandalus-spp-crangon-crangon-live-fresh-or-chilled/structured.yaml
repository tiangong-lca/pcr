      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `attribution_precedence` | all nodes and every external intended output | Keep the unallocated physical ledger first. Subdivide independently metered fishing/handling operations and assign dedicated resources directly. For remaining genuinely joint burdens, require a documented causal relationship and compatible measured physical driver; where no defensible causal driver exists, use contemporaneous producer-gate economic shares for the complete actual intended-output set, disclose currency/date/price/grade and test sensitivity. Do not silently select mass because all outputs are weighed. |  |\n| `single_ownership` | capture; sorting; wash_drain; cooling; presentation; handover | Assign joint burdens once at the first evidenced separation/accepted external destination, carry those burdens with later internal transfers, and add only subsequent attributable burdens. Protect shares of products that have already left at an evidenced external handover; do not reopen those shares. If the remaining internal stream later separates into a newly accepted intended product and the continuing reference stream, split only its remaining carried upstream burden pool plus genuinely shared subsequent burdens once at that new separation, using the stated attribution precedence. Later product recognition does not make common capture burdens zero. Dedicated later burdens remain with their actual recipient; do not apply the same split again merely because the gate or grade changes. A waste/release/stock entry is not an intended product and receives no invented avoided-product credit. |  |\n| `asset_and_run` | all nodes and service periods | Use measured actual service consumption/occupation to distribute shared vessel, net, container, refrigeration and infrastructure burdens across consumers, trips and periods with one event owner. Retain opening/closing stock and carried-burden reconciliation. Include necessary unsuccessful trips, idle and cleaning/changeover in the attributable representative campaign; a zero-output period is retained and attributed with a documented campaign rule, never divided by zero or set to zero. No arbitrary lifetime annualization. |  |\n| `normalization_separate` | all inventory rows | Normalize unallocated physical records by the positive accepted final net product mass solely to express the common basis. Apply any LCA coproduct shares only to their documented joint burden once in a separate view. Preserve physical transfers, losses and stocks unallocated; do not use economic shares to balance biomass or normalize an internal shrimp transfer to 1 kg. | `pcr-net-mass-identity` |\n\n"
