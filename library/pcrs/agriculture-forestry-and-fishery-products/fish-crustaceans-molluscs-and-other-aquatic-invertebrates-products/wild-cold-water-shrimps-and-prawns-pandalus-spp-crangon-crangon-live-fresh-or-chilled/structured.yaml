  calculation_rules:
    - id: net_gate
      applies_to: "handover_accepted_raw_whole"
      rule: "Accepted net whole raw shrimp = same-lot gross less measured separable ice/water and package tare; document drainage, body-water uptake/exudate and uncertainty without subtracting native head/shell/body water."
      inputs:
        - cp_handover_mass
      output: "Positive accepted final net kg"
      source_ids:
        - pcr-net-mass-identity
    - id: physical_normalization
      applies_to: "all inventory rows"
      rule: "Reconcile unallocated event/stock quantities in the declared native unit; divide each quantity attributable to the actual reference lot/campaign by its positive accepted final net kg. Internal transfers retain actual quantities; only the final reference output is 1 kg. Keep any once-only LCA joint-burden attribution separately labelled."
      inputs:
        - "All node-specific protocols"
        - stocks
        - "final gate mass"
      output: "Native unit per 1 kg reference flow; separate physical and LCA views"
      source_ids:
        - pcr-net-mass-identity
    - id: electricity_conversion
      applies_to: "Electrical energy records only"
      rule: "Multiply measured electrical kWh by 3.6 to report MJ; do not use this as a fuel heating value or convert service hours to energy."
      inputs:
        - kWh
        - "supplier and meter scope"
      output: "MJ"
      source_ids: []
  data_quality_requirements:
    - id: identity_and_state
      applies_to: "reference product"
      requirement: "Traceable species and never-frozen whole raw form; distinguish actual states and category exclusions."
      evidence: "Species records, trip/lot, condition and gate acceptance"
    - id: complete_periods
      applies_to: "all nodes"
      requirement: "Representative complete attributable trip/campaign and service periods including unsuccessful runs; disclose missing observations and carried burdens."
      evidence: "Logs, invoices, maintenance, stock and event-owner reconciliation"
    - id: range_evidence
      applies_to: "all cards"
      requirement: "Instantiate each symbolic U independently by concrete identity/unit, node/pass/state/period before quantitative QA; missing evidence blocks finalization, not merely a warning threshold."
      evidence: "Independent reviewed campaign/design/supplier envelope and provenance, not target-batch maximum"
    - id: native_support
      applies_to: "service cards"
      requirement: "Resolve concrete native service property/unit support separately before final exchanges; no inferred mass identity or numerical conversion from hours to kg."
      evidence: "Concrete service detail, property/unit support and compatible scope"
    - id: collect_capture_fuel
      applies_to: "capture; Inputs; Product flows: Actual foreground fuel by carrier"
      requirement: "Add a separate inventory exchange for each actual physical or chemical flow; determine its identity, flow type, composition/state, native property/unit, provider or receiving medium/destination. Preserve actual unallocated quantities, raw records and normalization under the collection duties below. This requirement is not a collection exchange, an assumed zero, or permission to copy aggregate amounts, ranges or UUIDs onto its components. Fuel consumed at this node, including its assigned full service-period share; separate engine/generator use and fuel stocks. A supplier-inclusive hired operation excludes the same embedded fuel. Keep the unallocated physical event/stock record first; express its quantity per positive final net kg, and apply any once-only LCA coproduct attribution separately to the documented joint burden only. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Unit group 93a60a57-a4c8-11da-a746-0800200c9a66 / kg; Amount rule: Actual kg from cp_capture_mass, retaining each concrete identity, pass and stock; divide the attributable physical record by positive accepted final net kg.; Value mode: calculated_value; Specificity: site_specific; Normalization basis: per 1 kg reference flow; Basis kind: reference_flow; Evidence kind: calculated_from_collection; Collection protocol: cp_capture_mass Range-evidence collection duty (not an established interval and never copied onto each concrete exchange): Range: Unresolved provisional independent envelope U_capture_fuel; not an empirical threshold or default quantity Range role: qa_guardrail Lower: 0 Upper: U_capture_fuel Unit: kg Basis: per 1 kg reference flow Basis kind: reference_flow Evidence kind: reasoned_estimate"
      evidence: "Raw measured/activity, composition, transfer/destination, supplier scope and independent range evidence; cp_capture_mass;"
