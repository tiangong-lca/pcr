  upstream_dataset_requirement: "Match fuel/material/service/ice datasets to actual carrier, state, geography, technology, supplier-inclusive boundary and period. No borrowed whole-catch UUID or default impact credit."
  disclosure: "Actual route, all event/stock states, gate, resource supply scopes, shared assets/consumers/periods, physical and LCA views, quality and exclusions"
