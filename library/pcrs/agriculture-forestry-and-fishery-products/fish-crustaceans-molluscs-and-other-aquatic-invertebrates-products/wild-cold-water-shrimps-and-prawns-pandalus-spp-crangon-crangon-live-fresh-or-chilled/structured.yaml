validation_rules:
  - rule_id: identity_gate
    applies_to: "reference product"
    rule: "Check species, wild/trawl context, raw whole/head-on/native-shell form, never-frozen history, actual fresh/nonfreezing chilled state, gate time/location/custody and recipient acceptance. Reject category substitution and unknown-state defaults. Confirm the real handover output row and same-lot net weighing; 1 kg is the normalization identity, not yield."
    source_ids: []
  - rule_id: ledger_complete
    applies_to: "all nodes"
