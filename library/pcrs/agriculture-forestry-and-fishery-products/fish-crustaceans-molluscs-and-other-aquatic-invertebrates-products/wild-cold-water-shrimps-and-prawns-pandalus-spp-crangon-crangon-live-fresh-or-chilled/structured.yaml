      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `identity_gate` | reference product | Check species, wild/trawl context, raw whole/head-on/native-shell form, never-frozen history, actual fresh/nonfreezing chilled state, gate time/location/custody and recipient acceptance. Reject category substitution and unknown-state defaults. Confirm the real handover output row and same-lot net weighing; 1 kg is the normalization identity, not yield. |  |\n| `ledger_complete` | all nodes | Reconcile unallocated species/material and water ledgers for each actual pass, including uptake, exudate, fragments, residues, stocks and transfer uncertainties. Pair internal transfers without counting them again as final output; mutually exclusive fates and one shared-event owner are required. Unexplained imbalance blocks dataset finalization; do not clip or force exact closure. |  |\n| `source_and_ranges` | all cards | Each actual concrete exchange needs verified flow/property/unit identity, traceable amount and correct node protocol. Symbolic U is an unresolved evidence envelope, not a numeric default, observed threshold or publication-ready range. Instantiate each U independently by row, identity, state, period and pass using reviewed campaign/design/supplier evidence, not the evaluated batch maximum. Unknown values are not zero; no outlier clipping. |  |\n| `burden_completeness` | all nodes and periods | Check every actual conditional resource, native service, maintenance, cleaning/changeover, trip return, idle and asset event; omission requires evidence, not absent purchase invoices alone. Check alternative supplier-inclusive versus foreground scopes, reused-container service versus mass, ice phase changes, all external intended outputs and single LCA allocation across periods. |  |\n| `no_universal_claims` | all nodes | Record applicable operational acceptance and jurisdictional context using current primary evidence. This PCR supplies no universal temperature, duration, mortality, yield, gear-impact, stock/sustainability or legal-safety compliance factor. Historical handling evidence supports qualitative interfaces only. Report uncertainties and excluded impact mechanisms without equating missing quantification to no impact. | `fao-shrimp-handling-historical` |\n| `technology_resolution` | cooling | Verify parent cooling and actual preservation implementation, independently metered deltas, exclusive purchased/on-site identity for each ice quantity, and true coexistence of ice/mechanical water cooling without duplicate carriers or energy. Confirm nonfreezing whole raw state rather than relying on a technique name. |  |\n| `validate_atomic_completion` | all applicable collection requirements and concrete inventory exchanges | Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg. | |\n\n"
