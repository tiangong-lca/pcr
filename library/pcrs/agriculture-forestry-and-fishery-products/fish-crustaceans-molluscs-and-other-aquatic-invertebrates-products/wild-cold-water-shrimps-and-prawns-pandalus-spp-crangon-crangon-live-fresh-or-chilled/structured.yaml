measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh the same accepted whole raw never-frozen Pandalus borealis lot on a calibrated scale at the declared physical gate. Exclude separable external ice, water and packaging by documented draining/de-icing/tare; retain native head, shell and body water. Report drainage method, elapsed time, sample representativeness, water uptake/exudate and uncertainty. The reference is 1 kg of this net product, not 1 kg edible flesh."
  - id: physical_ledger
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared property"
      uuid: ""
    required_unit: "declared native unit"
    rule: "Keep an unallocated physical event ledger by node, pass, lot, state and species: receipts, outputs, internal transfers, losses and opening/closing stocks. Record liquid mixture mass separately from water/biological constituent subledgers; never count a constituent twice. Normalize recorded physical quantities by positive accepted final net kg, then maintain a separately labelled once-only LCA burden attribution view. Allocation shares cannot close physical biomass."
  - id: service_units
    applies_to: "native service and energy cards"
    required_property_ref:
      name: "Declared native service property; Net calorific value for energy"
      uuid: ""
    required_unit: "declared native service unit; MJ"
    rule: "Preserve each concrete service identity and invoiced or metered native unit; do not represent operating hours, tonne-kilometres, refrigeration duty or equipment occupation as material kg. Electricity is recorded in MJ, with 1 kWh = 3.6 MJ only for metered electrical energy; preserve energy carrier and supplier geography. Do not convert fuel mass to energy without a matching measured or sourced heating value."
  - id: counts_auxiliary
    applies_to: "shrimp grade and count records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Species/grade counts, size classes, haul effort and condition codes are auxiliary context. Count-to-mass inference requires representative same-lot weights and uncertainty and cannot replace traceable gate net weighing. Temperature and elapsed time are measured descriptors, not universal allowable values supplied by this PCR."
