system_boundary:
  rules:
    - rule_id: trip_and_gate
      applies_to: "capture; handover"
      rule: "Include the complete attributable producer trip: preparation, outward travel, fishing, actual on-board/pre-gate operations and necessary producer return. A physical handover at sea does not erase return, idle, maintenance, replacement or retirement burdens of the service period. Exclude buyer distribution, later peeling, cooking, freezing and use after this gate. Declare location, custody and each retained producer responsibility."
      source_ids:
        - dfo-northern-shrimp-2024
    - rule_id: event_order
      applies_to: "all nodes"
      rule: "The process map lists responsibilities, not a mandatory chronology. Sorting, washing, draining and cooling can overlap or recur. Record actual timestamped passes and paired transfer ids, with matching species/state and opening/closing stocks. A skipped operation has no invented transfer; handover still owns actual utilities and losses. Assign each shared physical event to one node."
      source_ids:
        - fao-shrimp-handling-historical
    - rule_id: physical_fates
      applies_to: "all nodes"
      rule: "At each actual node/pass distinguish reference-grade transfer, every separately accepted intended product, rejected biomass/waste, recorded release to the environment and retained stock. Destination acceptance requires actual recipient, intended use, form and handover evidence; failed inspection alone is not a coproduct. Never describe a post-node loss as a pre-capture release. Catch interactions, habitat contact and gear loss require auxiliary species/location/effort context without invented emission or impact factors."
      source_ids: []
    - rule_id: water_ice_boundaries
      applies_to: "all nodes"
      rule: "Distinguish supplied product water, direct abstraction, internal recirculation, ice purchase, ice generated on site, liquid discharge, returned containers and stocks. The same water/ice quantity has one physical entry; melting and recirculation are not new purchases. Separate carrier water from quantified pollutant constituents. Supplier-inclusive purchased services/materials exclude their embedded electricity, fuel and direct emissions from duplicate foreground reporting."
      source_ids: []
    - rule_id: period_assets
      applies_to: "all nodes"
      rule: "Declare haul, trip, landing lot, cleaning/changeover run, reporting campaign and multi-period asset service boundaries. Link vessel, trawl/net, pumps, cold equipment, containers and shore infrastructure to actual consumers and periods. Record acquisition, maintenance, replacement and end-of-use, service use and carried stocks/burdens. No fixed lifetime, utilization, yield or zero-output burden erasure is prescribed."
      source_ids: []
    - rule_id: scope_limits
      applies_to: "reference product"
      rule: "Only species-confirmed wild Pandalus borealis, whole/head-on/native shell, raw and never frozen, fresh or nonfreezing chilled, is reference product. Exclude other Pandalus, Crangon, Nephrops, cultured or ornamental organisms, live-holding reference, peeled/headless flesh, cooked, matured, additive-treated, glazed, frozen or thawed product. Food-processing raw material acceptance is not ready-to-eat safety certification."
      source_ids:
        - un-cpc3-2025
    - rule_id: cooling_technology_delta
      applies_to: "cooling; presentation; handover"
      rule: "The parent activity is cooling (preservation), not capture. Declare actual ice-stowage versus refrigerated-seawater/mechanical-cooling implementations and their deltas: ice supplier versus on-site generation records, water contact/uptake and draining, generator/electricity/refrigerant scope, equipment and service use. The same ice quantity is either purchased supplier-inclusive ice or generated on site, never both. Ice and mechanical refrigeration may coexist in an actual seawater-cooling event if separately metered with one water/ice/energy owner. Record actual technology and current supplier/equipment evidence; no historical FAO performance or salt-addition default."
      source_ids:
        - fao-shrimp-handling-historical
    - rule_id: raw_not_live
      applies_to: "reference product; sorting; all loss cards"
      rule: "Raw fresh/chilled food material does not require the shrimp to remain alive. Post-capture death alone is neither rejection nor a yield loss. Determine actual acceptability from evidenced applicable damage, deterioration, contamination, form and recipient criteria; preserve physiological state as context without an invented mortality-to-waste rule."
      source_ids: []
