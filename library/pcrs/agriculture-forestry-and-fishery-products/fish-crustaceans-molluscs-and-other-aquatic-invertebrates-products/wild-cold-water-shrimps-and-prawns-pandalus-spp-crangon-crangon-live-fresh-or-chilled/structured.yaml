allocation_rules:
  - rule_id: attribution_precedence
    applies_to: "all nodes and every external intended output"
    rule: "Keep the unallocated physical ledger first. Subdivide independently metered fishing/handling operations and assign dedicated resources directly. For remaining genuinely joint burdens, require a documented causal relationship and compatible measured physical driver; where no defensible causal driver exists, use contemporaneous producer-gate economic shares for the complete actual intended-output set, disclose currency/date/price/grade and test sensitivity. Do not silently select mass because all outputs are weighed."
    source_ids: []
  - rule_id: single_ownership
    applies_to: "capture; sorting; wash_drain; cooling; presentation; handover"
    rule: "Assign joint burdens once at the first evidenced separation/accepted external destination, carry those burdens with later internal transfers, and add only subsequent attributable burdens. Protect shares of products that have already left at an evidenced external handover; do not reopen those shares. If the remaining internal stream later separates into a newly accepted intended product and the continuing reference stream, split only its remaining carried upstream burden pool plus genuinely shared subsequent burdens once at that new separation, using the stated attribution precedence. Later product recognition does not make common capture burdens zero. Dedicated later burdens remain with their actual recipient; do not apply the same split again merely because the gate or grade changes. A waste/release/stock entry is not an intended product and receives no invented avoided-product credit."
    source_ids: []
  - rule_id: asset_and_run
    applies_to: "all nodes and service periods"
    rule: "Use measured actual service consumption/occupation to distribute shared vessel, net, container, refrigeration and infrastructure burdens across consumers, trips and periods with one event owner. Retain opening/closing stock and carried-burden reconciliation. Include necessary unsuccessful trips, idle and cleaning/changeover in the attributable representative campaign; a zero-output period is retained and attributed with a documented campaign rule, never divided by zero or set to zero. No arbitrary lifetime annualization."
    source_ids: []
  - rule_id: normalization_separate
    applies_to: "all inventory rows"
    rule: "Normalize unallocated physical records by the positive accepted final net product mass solely to express the common basis. Apply any LCA coproduct shares only to their documented joint burden once in a separate view. Preserve physical transfers, losses and stocks unallocated; do not use economic shares to balance biomass or normalize an internal shrimp transfer to 1 kg."
    source_ids:
      - pcr-net-mass-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture_mass
      process_id: "capture"
      flow_role: "Material, biomass, water, waste and emission mass"
      record_type: "Timestamped primary measurements, logs, invoices and verified method calculations"
      raw_fields: "node/pass/event/owner/lot/species/state/grade/destination; supplier scope; instrument/raw amount/unit; opening/closing stock; paired transfer; source/factor; acceptance and final net kg; independent U evidence; uncertainty  auxiliary conditions where relevant: temperature value and declared scale (e.g. °C), and other numeric conditions with their own declared units; event start/end timestamps and time zone; elapsed value and min/h unit; categorical life/fresh/chilled/never-frozen state and its evidence;"
      collection_method: "Calibrated same-lot weighing/tare and representative water/constituent sampling; verified factor calculations for emissions, never balance residual as measurement  Collect relevant temperature with a calibrated sensor and location/time record, elapsed duration from timestamped events, and categories from traceable state/history records. These auxiliary descriptors are not kg inventory amounts and supply no universal temperature/time limits."
      unit: "kg"
      frequency: "Each actual event/pass and stock boundary"
      temporal_coverage: "Complete haul/trip/campaign and attributable maintenance/idle/service periods"
      site_scope: "Marine trawl capture and initial collection"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, receipt/acceptance, supplier boundary, provenance, stocks, uncertainty and independent envelope evidence"
    - protocol_id: cp_capture_energy
      process_id: "capture"
      flow_role: "Electrical energy"
      record_type: "Timestamped primary measurements, logs, invoices and verified method calculations"
      raw_fields: "node/pass/event/owner/lot/species/state/grade/destination; supplier scope; instrument/raw amount/unit; opening/closing stock; paired transfer; source/factor; acceptance and final net kg; independent U evidence; uncertainty"
      collection_method: "Meter actual supply and reconcile purchased versus generated energy; use 1 kWh = 3.6 MJ only for electricity"
      unit: "MJ"
      frequency: "Each actual event/pass and stock boundary"
      temporal_coverage: "Complete haul/trip/campaign and attributable maintenance/idle/service periods"
      site_scope: "Marine trawl capture and initial collection"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, receipt/acceptance, supplier boundary, provenance, stocks, uncertainty and independent envelope evidence"
    - protocol_id: cp_capture_service
      process_id: "capture"
      flow_role: "Native-unit services and asset occupation"
      record_type: "Timestamped primary measurements, logs, invoices and verified method calculations"
