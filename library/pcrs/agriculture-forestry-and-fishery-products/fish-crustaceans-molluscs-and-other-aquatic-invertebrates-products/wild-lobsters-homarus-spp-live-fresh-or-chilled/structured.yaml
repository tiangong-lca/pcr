system_boundary:
  rules:
    - rule_id: gate_and_responsibility
      applies_to: "foreground boundary"
      rule: "Own actual wild capture through producer-responsible grading, bounded live maintenance/presentation and first food handover. Include responsible departure, bait/gear supply, capture, transfer and attributable return, idle, cleaning and asset service even after an at-sea gate; do not extend product handling beyond that gate. Purchased post-first-gate Homarus resale and merchant holding are excluded."
      source_ids:
        - noaa-american-lobster
    - rule_id: state_graph
      applies_to: "all actual passes"
      rule: "Capture produces viable pending-grade animals; mandatory destination grading establishes actual food acceptance. Live maintenance and presentation may occur before or after grading and may repeat only with distinct event/pass ids and paired transfers. Pre-grade passes stay pending; post-grade condition changes require reinspection. Handover accepts only currently live, graded food lots, independent of the name of the last node. Unknown sequence/state is a gap, not a bypass."
      source_ids: []
    - rule_id: technology_delta
      applies_to: "capture"
      rule: "Declare actual capture parent gear. Trap/pot, net or other evidenced gear differ in deployment/haul equipment, energy, bait requirement, loss and bycatch/habitat/entanglement observations. Do not prescribe bait for unbaited gear. Different gear can coexist only on disjoint recorded events or responsibilities, not double-count the same animals. No universal impact, gear life or efficiency conclusion follows from a route label."
      source_ids:
        - noaa-american-lobster
    - rule_id: water_and_service_boundary
      applies_to: "all nodes"
      rule: "Collect external supply, new self-abstraction and paired internal transfer separately; in-node recirculation is throughput, not a new exchange. Reconcile stock, measured discharge/treatment, product/accessory-carried free water, actual evaporation and ice melt without treating natural body fluid as external free water. Pure services use actual invoiced units in the auxiliary ledger and must resolve exact property/unit before final dataset exchanges; no fictional kg of service. Register inclusive scope and exclude embedded fuel/water/material or upstream emissions from duplicate direct rows."
      source_ids: []
    - rule_id: native_body_and_care
      applies_to: "all live states"
      rule: "Native shell, tissue and naturally retained body fluid define actual body mass; record species, molt/shell and missing-appendage condition without reconstructing absent parts. Bands, ice, free water and containers remain separate physical fates. Maintenance has no intended biomass production, fattening or induced molt; no immersion, feed or direct ice contact is universally required. Actual food-use authorization and live condition apply to the real place/time and cannot be inferred from a generic species page."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Documented wild marine Homarus capture context and responsible preparation/gear/bait supply, not purchased producer-gate bodies or farm seed."
  starting_condition_role: "Foreground removal from natural stock, with upstream supplied inputs and actual service responsibilities."
  product_classification_scope: "CPC 3.0:04331; narrower: wild live whole food Homarus only"
  recursive_input_rule: "Purchased whole Homarus already past its first producer gate is resale and outside this capture PCR. Internal own-capture passes retain paired identities and burdens, not a recursively purchased final product. Purchased/own bait is a separate input purpose with its actual upstream dataset."
  upstream_dataset_requirement: "Actual bait/fuel/electricity/material/asset and service supplies must have matching origin/state/provider/unit, explicit embedded burden scope and current evidence."
  disclosure: "Declare actual lot/event graph, species/source, shell/live condition, gate, trip and return boundary, periods, services/asset users, grade/destination set, water/bait stocks and every evidence gap."
