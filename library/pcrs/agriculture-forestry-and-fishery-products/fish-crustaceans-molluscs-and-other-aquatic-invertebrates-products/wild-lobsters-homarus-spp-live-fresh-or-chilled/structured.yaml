allocation_rules:
  - rule_id: physical_then_lca
    applies_to: "all inventory rows"
    rule: "Retain an unallocated actual physical ledger of inputs, products, paired transfers, stocks and losses. Assign shared resource-event/node/period ownership once, then normalize by positive accepted final native-body kg. Separately label the single-output LCA view, apply the relevant output attribution once, retain the original physical ledger and full allocation matrix. Never shrink physical partitions by economic shares, check an allocated mass against an unallocated closure or allocate an already attributed intermediate again."
    source_ids: []
  - rule_id: allocation_precedence
    applies_to: "actual intended outputs"
    rule: "Enumerate concrete accepted live grades and any other independently intended catch/bait/dead-food output with recipient and handoff; exclude disposal, live return, packaging accompaniment and internal recirculation from automatic coproduct treatment. First subdivide independently measured activity; then use evidenced causal physical consumption for inseparable joint resources; if not supported, use same-boundary same-period positive realized-value shares and disclose price basis and sensitivity. Missing value/causality is a data gap, not a default mass share or substitution credit."
    source_ids: []
  - rule_id: period_matrix
    applies_to: "trips, holding periods and assets"
    rule: "Index preparation, deployment, soak/retrieval, transfer, post-gate return, idle/cleaning, seasonal holding, acquisition, replacement and retirement. Link each actual event and output to a trip/lot/period; retain failed/no-output-period burdens in the campaign with relevant outputs, never divide by zero or drop failed trips. Assign actual asset service over its documented users/periods using evidenced time/use basis; no universal lifetime and no reset of full manufacture every trip."
    source_ids: []
  - rule_id: secondary_bait_attribution
    applies_to: "purchased_secondary_bait; own_bait_receipt"
    rule: "For actual secondary bait retain origin and the supplier declared prior-system burden inherited at its recovery handoff, plus nonembedded recovery/preparation/storage/delivery once. If the supplier documents an allocated valuable byproduct, inherit that allocation; if its justified waste-cutoff starts at recovery, disclose that boundary and include all recovery onward burdens. Do not add full original-fish burdens again or silently grant zero-burden residues. Competing cutoff interpretations are separate sensitivity scenarios, not simultaneous credits. Own-caught bait retains its own capture attribution once."
    source_ids:
      - fishres-secondary-lobster-bait-2025
  - rule_id: shared_owner
    applies_to: "shared vessel, equipment, facility or service"
    rule: "Maintain a resource scope register covering actual capture, grade, live_maintenance, presentation and handover consumers and service periods. Shared vessel/hauler/gear, holding tank/cold room, reusable crates and outsourced inclusive services have one owning event and a documented causal time/use/space matrix. Exclude already embedded service resources and other periods shares; allocated reusable-asset manufacturing mass is not physical disposable packaging handed to the buyer."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture_mass
      process_id: "capture"
      flow_role: "actual native-body/material/water/biomass fates"
      record_type: "calibrated measurements, invoices, transfer/stock/event records and supplier primary evidence"
      raw_fields: "trip; lot; event; pass; transfer; period; owner; species/substance/material; live/shell/appendage and pending/accepted state; actual destination; raw amount and original unit; opening/closing stock; tare; supplier scope; service actual invoiced quantity/unit; asset users/use/replacement/retirement; timestamps; grade/food acceptance; missingness and uncertainty; actual technology/setup; actual provider/source and geographic boundary; cleaning/changeover/idle/failed-event linkage; actual water phase/new intake/recirculation/transfer/fates; quantity conversion evidence; gear specification; set/haul/soak/effort and location; bait origin, received/deployed/unspent/recovered/reused/waste/released stocks; incident/bycatch/gear-loss evidence"
      collection_method: "Weigh actual body/material receipts, transfers, stocks and fates using calibrated suitable scales/meters. Conversions require actual density, matched sample or gas-condition evidence. Live/shell/grade/acceptance fields are categorical. Preserve raw node quantities and auxiliary service/asset units separately. Close unallocated physical node/pass stocks and transfers, assign shared resource responsibility once and divide attributable physical quantities by positive final accepted native-body kg for the per-reference physical view; retain a separate section 7 once-attributed single-output LCA view and complete matrix."
      unit: "kg"
      frequency: "Every actual event/transfer and meter interval; reconcile each trip/run and period closure"
      temporal_coverage: "Complete declared trip/campaign, including return/idle/cleaning and unsuccessful periods plus actual asset service history"
      site_scope: "Only actual capture node responsibility and declared supplier/service boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration and meter scope; original receipts and transfer/stock reconciliation; state/acceptance and independent quantitative evidence; signed resource/period/service allocation and uncertainty"
    - protocol_id: cp_capture_energy
      process_id: "capture"
      flow_role: "actual node energy supplies"
      record_type: "calibrated measurements, invoices, transfer/stock/event records and supplier primary evidence"
      raw_fields: "trip; lot; event; pass; transfer; period; owner; species/substance/material; live/shell/appendage and pending/accepted state; actual destination; raw amount and original unit; opening/closing stock; tare; supplier scope; service actual invoiced quantity/unit; asset users/use/replacement/retirement; timestamps; grade/food acceptance; missingness and uncertainty; actual technology/setup; actual provider/source and geographic boundary; cleaning/changeover/idle/failed-event linkage; actual water phase/new intake/recirculation/transfer/fates; quantity conversion evidence; gear specification; set/haul/soak/effort and location; bait origin, received/deployed/unspent/recovered/reused/waste/released stocks; incident/bycatch/gear-loss evidence"
      collection_method: "Read attributable actual meter/supplier energy records with supply identity; retain original kWh/MJ and convert only under energy_units; fuels belong in mass records. Auxiliary service/asset units and categorical state fields remain separate. Retain raw quantities, close physical node/pass ledgers and assign shared resource responsibility once before dividing by positive final accepted native-body kg for the per-reference physical view; keep the separate section 7 single-output LCA attribution and complete matrix."
      unit: "MJ"
      frequency: "Every actual event/transfer and meter interval; reconcile each trip/run and period closure"
      temporal_coverage: "Complete declared trip/campaign, including return/idle/cleaning and unsuccessful periods plus actual asset service history"
      site_scope: "Only actual capture node responsibility and declared supplier/service boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration and meter scope; original receipts and transfer/stock reconciliation; state/acceptance and independent quantitative evidence; signed resource/period/service allocation and uncertainty"
    - protocol_id: cp_grade_mass
      process_id: "grade"
      flow_role: "actual native-body/material/water/biomass fates"
