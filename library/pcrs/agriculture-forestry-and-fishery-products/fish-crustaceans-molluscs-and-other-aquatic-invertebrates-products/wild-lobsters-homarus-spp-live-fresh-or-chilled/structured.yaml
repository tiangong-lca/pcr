validation_rules:
  - rule_id: identity_scope
    applies_to: "reference and actual products"
    rule: "Require wild marine Homarus species, actual native-shell living whole food body, actual appendage/molt condition, source and first producer gate. Exclude spiny/rock lobster, Nephrops, crayfish, farming/fattening, detached parts, dead/frozen/cooked reference and nonfood seed/broodstock/ornamental use. Each concrete final exchange requires verified identity and supports."
    source_ids:
      - cpc3-wild-homarus
  - rule_id: closure_and_sequence
    applies_to: "all node passes"
    rule: "Reconcile native-body and incidental biomass separately from water/ice/accessories and gear/bait, including opening/closing stocks, accepted alternatives, waste, live returns, actual mortality and environmental loss. Match transfer/pass ids and state history, never fixed 1 kg for upstream feed. Check actual grade before final food handover and reinspection after condition changes; unknown balance or sequence blocks quantitative completeness."
    source_ids: []
  - rule_id: quantity_and_ranges
    applies_to: "every active concrete exchange"
    rule: "Collect actual quantities before normalization; zeros require actual inactive role or measured zero, never missing data. Provisional reasoned ranges are screening hypotheses, not default amounts, empirical QA or legal acceptance. Evaluate each expanded identity and pass independently against external/supplier or independent campaign evidence with documented units, bounds and uncertainty; investigate values outside the provisional range without truncation. Never use a batch maximum to validate itself."
    source_ids: []
  - rule_id: attribution_and_route
    applies_to: "all resource and output owners"
    rule: "Check gear-event exclusivity/current evidence, actual production mode and periods, complete intended outputs/handoffs, period and shared allocation matrices, secondary bait inheritance and inclusive-service scope. Retain the unallocated physical ledger and one labelled single-output LCA derivation; no duplicate catch, fuel, internal water, own bait, resource ownership or second output share."
    source_ids: []
  - rule_id: trace_and_safety
    applies_to: "completed data package"
    rule: "Retain actual authority/market acceptance requirements and evidence appropriate to place/time without converting NOAA regional guidance into a global legal rule. Record viability, handling conditions and current release; cold maintenance does not resurrect dead bodies or reverse unsafe history. Complete protocol, identity, support, measurement and uncertainty evidence is required; checker success alone does not establish product safety or complete inventory."
    source_ids: []
  - rule_id: validate_inventory_completion
    applies_to: "all concrete exchanges and section 8 completion obligations"
    rule: "Verify each applicable dq_complete obligation has separately measured and identity-verified exchange cards. Check each quantity, native unit, range evidence, normalization, receiving medium, destination and non-duplication. Any unfulfilled actual child exchange, quantity, identity or destination makes the final dataset incomplete and fails validation; unknown cannot be zero. Static PCR checking does not replace this evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground wild live whole Homarus producer data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared actual wild species/gear/gate live-food scope with complete quantities and verified concrete downstream identities."
  excluded_use: "Universal global lobster average; farmed/fattened/spiny/Nephrops/crayfish proxy without review; dead/parts/frozen/cooked products; proof of safety/sustainability; automatic ecosystem or avoided-bait credit."
  required_metadata: "Species, wild source, capture technology, event/lot/pass graph, actual live/shell/appendages, grade/food acceptance, first producer gate, periods/return, net-body method, intended outputs, service and asset scope, allocation matrices and actual concrete flow/support identities."
  required_quality_disclosure: "Unallocated physical and separate LCA views; calibration, completeness, quantitative/identity gaps, provisional ranges and uncertainty; supplier/secondary-bait inheritance and inclusive-service evidence."
  update_trigger: "Changed species/gear/gate/product condition, handling chronology, food requirements, bait origin, supplier scope, service/asset users, quantitative evidence or verified identities."
data_sources:
  - id: "cpc3-wild-homarus"
    type: "official_guidance"
    reference: "UN, CPC Ver.3.0 explanatory notes, 30 June 2025, printed p.47. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification boundary only; wider live/fresh/chilled Homarus leaf, not amounts or gate rules."
  - id: "noaa-american-lobster"
    type: "official_guidance"
    reference: "NOAA Fisheries, American Lobster. https://www.fisheries.noaa.gov/species/american-lobster"
    used_for: "American-lobster live-market and actual capture-gear examples only; no global legal thresholds or impact factors."
  - id: "dfo-at-sea-lobster-catch"
    type: "official_guidance"
    reference: "Fisheries and Oceans Canada, at-sea catch technical report 2890. https://waves-vagues.dfo-mpo.gc.ca/library-bibliotheque/342236.pdf"
    used_for: "Conditional bait origin, incidental catch and event collection roles; no numerical defaults imported."
  - id: "fishres-secondary-lobster-bait-2025"
    type: "literature"
    reference: "An alternative bait for the American lobster fishery composed of fishery by-products to reduce reliance on forage fish. Fisheries Research 286 (2025), 107389. https://doi.org/10.1016/j.fishres.2025.107389"
    used_for: "Existence of actual fishery-byproduct bait route only; no prototype recipe, relative catch or environmental credit."
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Mass conservation and dimensional normalization; declared physical method in this PCR sections 4 and 8."
    used_for: "Exact reference quantity and mass accounting identity, not an external empirical dataset."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:a8d31cbe2fe58bfbcfec7c55fd6df2917f76fd2b7056acb04200388632b8bb4e"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_4548"
      family: "system_boundary"
      span:
        start:
          offset: 4548
