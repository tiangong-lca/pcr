  calculation_rules:
    - id: physical_normalization
      applies_to: "all inventory rows"
      rule: "First close the unallocated actual physical node/pass stock and transfer ledger, assign shared resource ownership once, then divide attributable raw physical quantities by positive final accepted native-body kg for the physical per-reference view. Separately apply section 7 output attribution once for the labelled single-output LCA view, retaining original quantities and full matrix; physical partitions are never multiplied by economic shares."
      inputs:
        - "actual raw quantity"
        - "accepted final native-body kg"
        - "event ownership"
        - "output matrix"
      output: "physical per-reference amount; separately labelled single-output LCA amount"
      source_ids: []
    - id: stock_closure
      applies_to: "each actual node/pass"
      rule: "Opening stock + actual receipts = actual products/transfers + waste + environmental fates + closing stock, on consistent material boundaries. Keep native body, bait, accessories, water/ice and gear streams separate; document actual transformations and water carried with material without repeating component mass. No missing-balance plug or reconstruction of absent limbs."
      inputs:
        - "actual receipts"
        - stocks
        - outputs
        - "paired transfer ids"
        - transformations
      output: "unallocated reconciled quantities"
      source_ids:
        - mass-balance-identity
    - id: direct_emissions
      applies_to: "actual direct emissions"
      rule: "Use measured emission mass or actual compatible consumed fuel × documented substance-specific factor with consistent factor units, compartment and carbon/oxidation basis; retain factor provenance and uncertainty. Refrigerant charge/recovery/leak records reconcile actual substance. No universal factors, upstream duplicate, or fossil identity for biogenic respiration."
      inputs:
        - "actual fuel/emission/leak records"
        - "compatible independent factors and units"
      output: "substance-specific direct mass"
      source_ids: []
    - id: count_mass_conversion
      applies_to: "actual item-count material records"
      rule: "Actual item count × measured same-material/specification/state item mass, or a documented representative sample with uncertainty; no universal lobster, packaging, band or asset weight. Keep accessory tare separate from native body."
      inputs:
        - count
        - "matched item mass/sample"
        - uncertainty
      output: "actual physical kg"
      source_ids: []
  data_quality_requirements:
    - id: identity_and_state
      applies_to: "each lot/pass"
      requirement: "Actual species/source/wild status, body/shell/appendage state, live condition, grade, food acceptance and actual chronology are mandatory; pending or unknown cannot default to final."
      evidence: "capture and inspection log; transfer/pass graph; competent actual acceptance evidence"
    - id: quantitative_independence
      applies_to: "every amount/range"
      requirement: "Preserve original units, calibration, conversions, period coverage and uncertainty. Replace provisional screening with independent compatible evidence before calling numerical QA complete; no own-batch maximum or guessed zero."
      evidence: "raw measured records; independent campaigns/supplier study; documented unit and scope comparison"
    - id: completeness_and_burdens
      applies_to: "each event and actual service"
      requirement: "Complete all physical fates, no-output resources, own/secondary bait, return/idle, shared assets and service-inclusive boundaries. Missing concrete service units/support or flow identity means incomplete final inventory, not a silently omitted exchange."
      evidence: "stock/transfer closure; asset-service ledgers; supplier scope; resource/period/output matrices"
    - id: dq_inventory_completion
      applies_to: "all inventory-completion requirements"
      requirement: "Create a separate card for every actual physical or chemical exchange, with process, direction, flow type, its own measured quantity, native unit, final-reference normalization, applicability, destination, UUID and independent range evidence. Never copy a family total, a grouped screening range or one UUID onto every child. Use not_applicable only for evidenced absence; unknown is not zero. Any unfulfilled applicable obligation makes the final dataset incomplete and fails validation."
      evidence: "per-flow coverage ledger, raw measurements, identity, fate and range evidence"
    - id: dq_complete_purchased_primary_bait
