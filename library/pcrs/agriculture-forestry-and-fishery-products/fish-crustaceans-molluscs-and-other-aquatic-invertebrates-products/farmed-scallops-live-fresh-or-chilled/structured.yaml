system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "culture and harvest"
      rule: "Separate managed net nursery/growout from craft/winch removal: nursery and growout produce an in-net harvest-ready cohort; harvest removes and hands over collected whole live scallops. Shell drilling, bottom lays and adult capture are outside this route."
      source_ids:
        - fao-yesso-scallop-2009
    - rule_id: boundary_handling
      applies_to: "cleaning, sorting, packaging and delivery"
      rule: "Cleaning is actual gentle first shell preparation, sorting assigns declared accepted/secondary/rejected destinations, packaging protects a live lot when present, and preservation/delivery maintains that live state through physical acceptance. Record bypass handoffs when a conditional node is absent; no artificial zero-operation product or duplicated final exchange."
      source_ids:
        - fao-yesso-scallop-2009
    - rule_id: boundary_food_water
      applies_to: "nursery and growout"
      rule: "Natural food and ambient water-column exposure are environmental context, not a purchased feed exchange, pumped-water abstraction or avoided nutrient burden. Include actual sourced management inputs and real environmental releases; require distinct evidence for any ecosystem-effect study outside this inventory."
      source_ids:
        - fao-yesso-scallop-2009
    - rule_id: boundary_ownership
      applies_to: "all nodes"
      rule: "Assign each craft, winch, longline, net, float, shore facility, washing unit, package pool and delivery asset to its real consuming nodes and periods. A supplier-inclusive service and its included fuel, power, direct emissions or capital are alternative representations of the same burden. Each physical event has one accountable owner."
      source_ids: []
    - rule_id: boundary_self_generation
      applies_to: "on-site electricity"
      rule: "When actual on-site generation is represented by its fuel, equipment and direct emissions, generated electricity is an internal energy transfer: do not add purchased-grid upstream burdens for that same electricity. Assign the generator event and substance/medium emission instances to its actual emitting node and allocate measured duty to consumers once. Cleaning, sorting and packaging release cards instantiate actual direct releases only when present; a service input never substitutes for an unrecorded directly owned emission."
      source_ids: []
    - rule_id: boundary_periods
      applies_to: "cohorts and infrastructure"
      rule: "Enumerate spat receipt, nursery, growout, harvest, handling and delivery periods. Carry opening/closing stocks and their attributed burdens between periods once; include failed cohorts, maintenance and nonproductive service in the accountable ledger without assigning them twice. No default cycle or asset lifetime applies."
      source_ids: []
