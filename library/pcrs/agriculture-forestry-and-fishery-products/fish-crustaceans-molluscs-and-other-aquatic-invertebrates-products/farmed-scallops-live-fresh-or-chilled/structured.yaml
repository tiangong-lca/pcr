validation_rules:
  - rule_id: validate_identity
    applies_to: "reference and inventory"
    rule: "Match actual flow type, substance/product state, destination, geography, property/unit and gate before concrete UUID binding; all unresolved actual rows and support gaps remain explicit. The final reference link addresses live_scallops_receipt only."
    source_ids: []
  - rule_id: validate_mass_live
    applies_to: "final reference"
    rule: "Require 1 kg accepted net whole live body-plus-native-shell product with calibrated mass, excluded tare/free water/ice and same-lot live recipient acceptance. Dead, shucked or unknown-state receipt fails this scope."
    source_ids: []
  - rule_id: validate_handoffs
    applies_to: "all process nodes"
    rule: "Verify exact predecessor and destination transfer ids and quantities; cleaning/packaging activation or bypass must be known. Check accepted grades, secondary intended outputs, returned stock, rejects, waste and losses separately; no two final outputs represent the same physical mass."
    source_ids: []
  - rule_id: validate_period_mode
    applies_to: "batch/cohort and asset ledgers"
    rule: "Verify cohort/run/phase and reporting-period indices, opening/closing stocks, failed/nonproductive duty, maintenance/changeovers and replacement/retirement. Each carried burden and shared event is owned once."
    source_ids: []
  - rule_id: validate_attribution
    applies_to: "multiple outputs and shared infrastructure"
    rule: "Check complete intended outputs, consumer-node/period lists, declared attribution decision and evidence. Direct assignment precedes residual allocation; shares reconcile to owned totals and supplier-inclusive/direct components do not overlap. Unknown allocation or lifetime evidence remains a finalization gap."
    source_ids: []
  - rule_id: validate_environment
    applies_to: "losses and releases"
    rule: "Do not infer kg elementary emissions from whole escaped/dead animals, natural food or ambient exposure. Require actual substance/medium/basis for biological, cleaning and combustion releases, distinguish fossil CO2, and avoid treatment/direct-discharge duplication. No default nutrient, shell-carbon or avoided-product credit."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "all actual exchanges"
    rule: "Every actual instance needs its own range basis/status and independently approved upper-bound evidence; no mixed-unit parent bound or unexplained default zero. The 1..1 final interval is normalization only, not survival or yield evidence."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable collection requirements and concrete inventory exchanges"
    rule: "Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual data, methodology and identity review"
  downstream_use: "Burden-bearing live whole Japanese suspended-net Yesso scallop supply at the declared first-recipient gate for downstream process or lifecyclemodel construction"
  allowed_use: "Matching species, purchased wild-spat origin, net technology, live native-shell state, location/time and gate, with actual boundary and quality disclosures"
  excluded_use: "Other species/routes, hatchery spat, ear-hanging, bottom culture, wild adults, dead/shucked/frozen product, food-safety certification, ecosystem-credit or permanent shell-carbon claims"
  required_metadata: "PCR id/version; species; site/geography; source/upstream coverage; cohort and periods; production mode; actual conditional operations; output/grade destinations; reference mass/live gate; support units and ownership; allocation and shared assets"
  required_quality_disclosure: "Measurement/sampling uncertainty; live condition and handling coverage; unresolved identities/supports/ranges; upstream and cohort gaps; release models; output/period/asset attribution and sensitivity"
  update_trigger: "Change in species/source, net technology, gate/live state, handling, output set, quantitative evidence, release method, service coverage, asset life/ownership or attribution"
