allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "all nodes"
    rule: "First assign independently recorded operations and supplies directly to their real cohorts, grades, nodes and destinations. Do not allocate an inclusive service again through fuel, electricity, emissions or capital. Preserve complete intended-output and waste sets before selecting attribution."
    source_ids: []
  - rule_id: allocation_outputs
    applies_to: "multiple intended outputs"
    rule: "Enumerate actual accepted live grades and any secondary intended destination with mass, state and physical handoff. Directly attributable burdens stay with that output. For the residual inseparable burden of intentional sale grades of the same species and whole-live function, allocate by each grade's accepted net whole-live mass at its own declared handoff. Record why the outputs have equivalent function/state and retain allocation sensitivity. Internal stock returns and waste are excluded from this intended-sale denominator. Actual outputs with different functions or states require a separately reviewed causal attribution method before finalization. Waste treatment stays attributable to the responsible production, without an assumed co-product credit."
    source_ids: []
  - rule_id: allocation_periods
    applies_to: "cohorts and reporting periods"
    rule: "Link each input, cleaning/changeover, failed batch, maintenance event, transfer and output to its cohort and nursery/growout/harvest/handling period. Carry stock and burdens forward once. Reconcile opening and closing inventory and avoid allocating a carried stock's full historical burden anew in each year."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "shared assets/services"
    rule: "List actual consumers and periods for longlines, nets, floats, craft/winch, shore equipment, cold handling and reusable crates. Subdivide measured duty first; allocate residual shared service with evidenced activity/duty records and an explicit denominator. Reconcile allocated shares to the owned total; document replacement, retirement and nonproductive duty without inventing lifetime, occupancy or reuse counts."
    source_ids: []
  - rule_id: allocation_no_credit
    applies_to: "natural food, shells and losses"
    rule: "Natural feeding, ambient water, native shells, nutrient uptake and biological carbon do not create default avoided burdens or storage credits. Whole live shell mass is already in the product reference. Escapes and uncollected mortality are ledger losses until any separately quantified environmental release is established."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_net_culture
      process_id: "net_culture"
      flow_role: "Purchased spat; culture stock, support, wastes and releases"
      record_type: "Supplier, cohort, net, asset and environmental ledger"
      raw_fields: "species; wild origin; supplier/upstream coverage; receipt/transfer ids; date; count; sample count/mass/size; opening/closing stock; deaths/escapes/removals; nursery/growout phase; net/asset id; support unit/quantity; service inclusions; release substance/medium/factor; upper-bound evidence"
      collection_method: "Weigh receipts/transfers on calibrated scales; retain representative same-cohort count/mass sampling; inventory nets and stocks; meter/invoice actual support; document substance-specific monitoring/models and exclusive service ownership; Attribute each owned event once to the cohort/output set; divide attributed amount by accepted net live receipt mass; per 1 kg reference flow"
      unit: "kg; count; actual native unit separately"
      frequency: "Each receipt, transfer, support/replacement/loss event and monitoring period"
      temporal_coverage: "Full cohort plus opening/closing carryover and failed/nonproductive periods"
      site_scope: "Japanese farm and declared source suppliers, nets and environmental media"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sampling design; supplier coverage; stock reconciliation; factors; uncertainty; asset/period shares"
    - protocol_id: cp_craft_harvest
      process_id: "craft_harvest"
      flow_role: "In-net receipt; craft/winch support; collected live and incidental outputs"
      record_type: "Harvest-trip and transfer ledger"
      raw_fields: "cohort; net; trip; craft/winch id; date/time; live stock receipt; collected mass/count sample; damage/incidental material; loss; support quantity/unit; provider coverage; fuel/factor; receiving medium; next-node id; upper-bound evidence"
      collection_method: "Weigh incoming/collected/waste lots; pair culture transfer; retain trip logs, measured fuel/power or service invoices, asset duty and substance-specific emissions evidence; Reconcile each trip and output set; allocate owned trip duty once; divide attributed amounts by accepted net receipt mass; per 1 kg reference flow"
      unit: "kg; count; actual native unit separately"
      frequency: "Each harvest trip and outgoing handoff"
      temporal_coverage: "Entire attributable harvest campaign, including unsuccessful trips"
      site_scope: "Declared farm nets and harvest craft"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scales; trip records; transfer matching; waste destination; duty shares; emission-factor provenance"
    - protocol_id: cp_shell_cleaning
      process_id: "shell_cleaning"
      flow_role: "Actual cleaning input, water, support, prepared lot, waste and releases"
      record_type: "Cleaning-run and outfall records"
      raw_fields: "activation; run; collected transfer id; live input/output mass; aid identity; water source; withdrawal/supply/recirculation; units/density; support; service coverage; rejects; effluent destination; substance/concentration/flow/medium; fuel/leakage activity and factor; upper-bound evidence"
      collection_method: "Document real operation or bypass; weigh live lots and solids; meter supplied/directly abstracted water separately; sample actual outfall or retain treatment transfer records; record aid/factor and actual node-owned combustion/leakage evidence; Attribute each run to its lots; reconcile supply/return and treatment/direct-release ownership; divide by accepted net receipt mass; per 1 kg reference flow"
      unit: "kg; m3; concentration and native support units separately"
      frequency: "Each cleaning run and relevant sampling/service event"
      temporal_coverage: "All actual cleaning runs for reference cohorts"
      site_scope: "Actual farm/shore cleaning facility and discharge/treatment handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; water conversion; chemistry; treatment receipts; outfall and fuel/leakage method; live condition and transfer records"
    - protocol_id: cp_live_sorting
      process_id: "live_sorting"
      flow_role: "Incoming live state, support, grade/destination output set, rejects and actual direct releases"
      record_type: "Sorting-run and destination ledger"
      raw_fields: "cleaning activation; predecessor id; run/date; received mass/count sample; actual grade criteria; accepted grade mass; secondary intended output/state/destination; reject/waste mass; return stock; support units; release substance/medium/fuel or leakage activity/factor; attribution evidence; upper-bound evidence"
      collection_method: "Weigh each destination output and actual waste; retain grade/live checks, sale/transfer records, support allocation and actual node-owned release measurement/models; do not merge saleable secondary grades with waste; Reconcile full output/return/loss set to the incoming lot; assign direct burdens and disclose shared-output method; divide by accepted net receipt mass; per 1 kg reference flow"
      unit: "kg; count; native support units separately"
      frequency: "Every sorting lot, destination and support/release event"
      temporal_coverage: "Complete sorting campaign of each reference cohort"
      site_scope: "Declared grading point, outgoing destinations and actual release media"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale records; destination evidence; grade criteria; attribution decision; stock return match; actual release and factor evidence"
    - protocol_id: cp_live_packaging
      process_id: "live_packaging"
      flow_role: "Actual packaging input, package/support, protected lot, rejects and actual direct releases"
      record_type: "Package-run and reusable-pool ledger"
      raw_fields: "activation; run; live input/output; package material/count/sample mass; new/replacement quantities; reusable opening/closing/return/loss; support unit; service inclusions; release substance/medium/fuel or leakage activity/factor; waste destination; delivery transfer id; upper-bound evidence"
      collection_method: "Record operation or bypass; weigh net live product separately from tare/ice; measure package item masses and actual pool movements; record material/service invoices, discard destinations and actual node-owned release measurement/models; Assign new/replacement package and shared service once by evidenced use; exclude package tare from product; divide by accepted net receipt mass; per 1 kg reference flow"
      unit: "kg; count; native service units separately"
      frequency: "Every package run, return, replacement, disposal and actual release event"
      temporal_coverage: "All package service periods attributable to cohorts, including carryover"
      site_scope: "Actual packing point, declared reusable pool and actual release media"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Sample/calibration records; pool reconciliation; reuse evidence; transfer and waste receipts; actual release and factor evidence"
    - protocol_id: cp_live_receipt
      process_id: "live_delivery"
      flow_role: "Ready live input, preservation/transport, final acceptance, rejects and releases"
      record_type: "Dispatch, condition, transport and recipient acceptance ledger"
      raw_fields: "predecessor/package state; lot/cohort; dispatch/arrival/acceptance time; recipient/gate; live-condition method/result; gross/tare/free water/ice; accepted net live mass; rejects/destinations; actual temperature/exposure/duration; coolant/energy/fuel quantity/unit; distance/payload/empty legs; service inclusions; asset duty; release substance/medium/factor; upper-bound evidence"
      collection_method: "Weigh accepted live whole product on a calibrated scale, excluding carrier water, ice, transport packaging and tare; reconcile dispatch and same-lot recipient physical acceptance with live-condition evidence; retain actual handling/transport and direct-release measurements/models; Sum accepted net live mass for equivalent declared lots as denominator; attribute support/losses once and divide by that accepted mass; per 1 kg reference flow"
      unit: "kg; time; temperature; tkm; h; fuel/energy and other native units separately"
      frequency: "Each dispatch, live-condition observation, acceptance/rejection and support event"
      temporal_coverage: "Full preservation/holding/delivery interval through first physical acceptance"
      site_scope: "Actual local delivery route, holding points and first farmer physical recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated scale and tare records; signed receipt/gate; live checks; condition logs; payload/distance; exclusive service coverage; factor and uncertainty evidence"
  calculation_rules:
    - id: normalize_collected
      applies_to: "all inventory rows"
      rule: "Retain actual raw numerator units and evidenced attribution; divide each attributed cohort/lot amount by the same accepted net live receipt mass in kg. Final reference output divides that accepted mass by itself. Do not force internal transfers or biological spat mass to equal final output."
      inputs:
        - "Attributed raw quantity"
        - "accepted net live receipt mass"
        - "node-specific protocol"
      output: "Native numerator quantity per 1 kg reference flow"
      source_ids: []
    - id: sample_conversion
      applies_to: "wild_spat_input and cohort transfers"
      rule: "Where counts are original records, retain weighed same-cohort samples and apply their measured mean individual mass to matched counts, with size/date coverage and uncertainty; no universal conversion supplied."
      inputs:
        - "Raw count"
        - "sample count"
        - "sample net mass"
        - "matching cohort/date/size"
      output: "Traceable whole-live mass estimate and uncertainty"
      source_ids: []
    - id: cohort_reconciliation
      applies_to: "net_culture"
      rule: "Reconcile opening stock, receipts, internal transfers, harvest, returns, intended removals, mortality, escapes and closing stock by cohort/count, with observed growth and sampling uncertainty. Biological growth prevents a simple equality of input and output wet masses. Ledger movements are not automatically environmental exchanges."
      inputs:
        - "Cohort and stock records"
        - "sample evidence"
        - "event dates"
      output: "Reconciled cohort history and explicit unexplained gaps"
      source_ids: []
    - id: release_calculation
      applies_to: "actual release instances"
      rule: "Retain actual substance, compartment and chemical basis; apply documented measured flow/concentration or applicable activity/factor model with units and uncertainty; use exclusive direct/provider ownership and avoid whole-waste/constituent duplication. No factor is prescribed by this PCR."
      inputs:
        - "Actual activity/monitoring"
        - "documented factor/method"
        - compartment
        - "service coverage"
      output: "Substance-specific release per 1 kg reference flow"
      source_ids: []
