      requirement: "Retain complete stock, loss, failed-cycle, asset replacement and period records; disclose missing upstream phases, unresolved identities, unmatched quantities and attribution decisions."
      evidence: "Cohort/period ledger and completeness report"
    - id: quality_ranges
      applies_to: "every amount and instance"
      requirement: "Replace provisional unresolved U bounds with independently supported instance-specific values before applying a QA interval; retain status, basis, evidence and uncertainty. Never interpret 0..U as empirical evidence or a default amount."
