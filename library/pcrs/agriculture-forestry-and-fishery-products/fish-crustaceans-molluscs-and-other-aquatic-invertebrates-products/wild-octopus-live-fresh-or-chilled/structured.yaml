validation_rules:
  - rule_id: instantiated_ranges
    applies_to: "all inventory rows"
    rule: "For every umbrella card instantiated as multiple actual exchanges, assign a distinct instance id, substance/material, state, property/unit, destination/receiving compartment, collection evidence and independently justified U to each exchange. The parent row-specific U label is an unresolved template only, neither a shared bound for all instances nor an aggregate upper limit. Never apply one instance's evidence or U to another without independently justified compatibility."
    source_ids: []
  - rule_id: selection
    applies_to: "reference product"
    rule: "Require traceable O. vulgaris sensu stricto, eastern Atlantic/Mediterranean location, wild unbaited earthenware-pot capture, raw whole ungutted presentation, actual chilled never-frozen history and first physical recipient acceptance. Reject other species-complex members, baited traps/PVC/tyres, aquaculture, deliberate arm cutting, beating/tumbling, soaking/additives, frozen/thawed, gutted or live-reference lots."
    source_ids: []
  - rule_id: ledgers
    applies_to: "all inventory rows"
    rule: "Reconcile physical animals through capture, prepare, sort, chill, present and handover with retained/rejected/released/stock fates, natural arm damage and actual moisture changes. Animal feed mass is not every node output1; exclude ice/free water/tare from reference mass. Independently reconcile water/ice, containers, fuel and residues, actual owner and stock carryover before allocation."
    source_ids: []
  - rule_id: provisional_limits
    applies_to: "all inventory rows"
    rule: "Each nonfinal Range is an unresolved row-specific U requirement, not a measured bound, typical value or permission to substitute a number. Establish and approve U from independent prior/source/capacity evidence before use; the same batch maximum cannot validate itself. Use actual records and investigate departures; absence of U, missing flow identity/support or missing process records remains a disclosed gap."
    source_ids: []
  - rule_id: ownership
    applies_to: "all nodes"
    rule: "Check single-node protocols, all zero-output/run/changeover periods, complete intended outputs and attribution shares, shared infrastructure consumers/life phases, paired usable-water/residual transfers and exactly one direct release/treatment owner. An absent activity needs explicit evidence, not an invented zero. A structural check does not verify external identities or food safety."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable collection requirements and concrete inventory exchanges"
    rule: "Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Foreground capture/first-handover data package projected to process/lifecyclemodel only after actual concrete exchange verification"
  allowed_use: "Compatible selected species/gear/state/region/period/gate studies with disclosed actual evidence"
  excluded_use: "All-leaf or worldwide species-complex proxy, baited/farmed/frozen/processed/live routes, consumer safety/legal/sustainability claims"
  required_metadata: "All reference qualifiers, node/provider responsibility, full periods, intended-output shares and asset/stock boundaries"
  required_quality_disclosure: "Original measurements, representativeness, attribution sensitivity, unresolved UUID/support/U/data gaps; no fabricated defaults"
  update_trigger: "Changed species/route/state/gate, source knowledge, provider/grid, asset service or allocation evidence"
data_sources:
  - id: "fao-cephalopods-vol3"
    type: "official_guidance"
    reference: "FAO, Cephalopods of the World, vol3, printed p41; https://www.fao.org/4/i3489e/i3489e.pdf"
    used_for: "Qualitative O. vulgaris sensu stricto taxonomic and Mediterranean/central-northeast Atlantic distribution boundary only; no worldwide species-complex equivalence or numerical inventory factors"
  - id: "fao-traps-pots"
    type: "handbook"
    reference: "FAO, Fishing with traps and pots, Octopus squid and cuttlefish pots and traps; https://www.fao.org/4/x2590e/x2590e07.htm"
    used_for: "Unbaited earthenware shelter-pot capture distinction; no numerical gear use, soak time or impact factor"
  - id: "ipma-polqual-2017"
    type: "official_guidance"
    reference: "IPMA, POLQUAL report RCT-IPMA-SD-16, 2017, printed pp16–18; https://www.ipma.pt/export/sites/ipma/bin/docs/publicacoes/ipma/rct-ipma-sd-16.pdf"
    used_for: "Portuguese common-octopus shelter pots versus baited traps. Its short-trip first-sale samples were not chilled; it is NOT evidence of iced lots or this selected handling state."
  - id: "codex-fish-2012"
    type: "official_guidance"
    reference: "FAO/WHO, Code of Practice for Fish and Fishery Products, 2012, section15, printed pp202/204; https://www.fao.org/4/i2382e/i2382e.pdf"
    used_for: "Qualitative fresh-cephalopod cooling/holding and contamination guidance only; no actual octopus route observation, quantitative life/ice ratio, safety or regulatory certification"
