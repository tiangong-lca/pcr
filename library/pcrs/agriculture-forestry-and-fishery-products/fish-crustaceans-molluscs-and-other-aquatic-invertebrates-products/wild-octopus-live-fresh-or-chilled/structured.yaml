    - id: collect_support_other_direct_releases
      applies_to: "support; Outputs; Elementary flows: Other independently identified direct releases from support"
      requirement: "Add a separate inventory exchange for each actual physical or chemical flow; determine its identity, flow type, composition/state, native property/unit, provider or receiving medium/destination. Preserve actual unallocated quantities, raw records and normalization under the collection duties below. This requirement is not a collection exchange, an assumed zero, or permission to copy aggregate amounts, ranges or UUIDs onto its components. Instantiate each actual directly released substance, particle-size class or refrigerant and receiving air/water/soil compartment; pollutant mass is not wastewater bulk or total exhaust mass. Include actual fuel exhaust other than fossil CO2, leaks, washing/chilling water discharges, free water leaving animals and waste-treatment emissions only if this node owns that direct release. Same-node water circulation is a subledger, not a new withdrawal. Do not invent zeroes or a generic pollution UUID. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; unit_group 93a60a57-a4c8-11da-a746-0800200c9a66 / kg; Amount rule: Measure the physical support_other_direct_releases record in cp_support; retain the complete event/period ledger and documented output-attributed share separately, then divide that attributed amount by the same accepted net animal wet mass to obtain per 1 kg reference flow. Use actual independently identified exchanges; not an assumed value.; Value mode: calculated_value; Specificity: site_specific; Normalization basis: per 1 kg reference flow; Basis kind: reference_flow; Evidence kind: calculated_from_collection; Collection protocol: cp_support Range-evidence collection duty (not an established interval and never copied onto each concrete exchange): Range: Unresolved independent row-specific U_support_other_direct_releases requirement; approve before any use Range role: qa_guardrail Lower: 0 Upper: U_support_other_direct_releases Unit: kg Basis: per 1 kg reference flow; establish U_support_other_direct_releases from independent prior/site-capacity evidence, never the checked batch maximum; not a numerical default Basis kind: reference_flow Evidence kind: reasoned_estimate"
