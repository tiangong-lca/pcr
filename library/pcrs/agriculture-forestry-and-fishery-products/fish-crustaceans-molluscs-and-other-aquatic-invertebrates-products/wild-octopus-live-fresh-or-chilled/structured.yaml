allocation_rules:
  - rule_id: subdivide
    applies_to: "all nodes"
    rule: "Prefer actual subdivision of independently metered events/nodes and outputs. Keep full physical amounts separately from output-attributed LCA quantities. For shared unavoidable events, document the causal driver and all intended output shares before normalization; never apply animal yield to erase unsuccessful trips or ecological records."
    source_ids: []
  - rule_id: output_decision
    applies_to: "other_intended_grades; support_recovered_material"
    rule: "Enumerate actual independently intended outputs, grade destinations and handoffs, then justify physical causal attribution. If no defensible physical relationship exists, use documented economic attribution only as a disclosed fallback with consistent actual period/grade prices and sensitivity. No default method, price, allocation fraction or substitution credit is specified. Residue/reject/dead-waste/release are not products by default."
    source_ids: []
  - rule_id: period_asset
    applies_to: "support_shared_assets"
    rule: "Index actual manufacture/provision, deployment, repair, idle, replacement/loss and termination phases and consuming nodes/periods. Attribute documented service over an evidenced lifetime/service denominator, reconcile cumulative shares to one and carry unused stocks forward. No default pot lifetime, trip count or annual catch. Missing termination/replacement or full-period evidence blocks finalization."
    source_ids: []
  - rule_id: normalize
    applies_to: "all inventory rows"
    rule: "Normalize the justified output-attributed amount of each row by the accepted net wet mass of that same selected lot/period, producing per 1 kg reference flow. Do not normalize zero-output periods in isolation; retain and carry their evidenced burden to the justified reporting output or disclose an unresolved attribution. Internal product transfers retain their actual masses and inherited burden once, not 1 kg each."
    source_ids: []
