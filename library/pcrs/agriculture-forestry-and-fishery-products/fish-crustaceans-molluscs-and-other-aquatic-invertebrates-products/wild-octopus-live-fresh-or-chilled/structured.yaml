system_boundary:
  rules:
    - rule_id: exclusive_resource_events
      applies_to: "all nodes"
      rule: "Partition each physical supply/use event into exactly one compatible resource card: named fishery ice, water, containers, shared assets, supplier-inclusive services or remaining fuels/consumables. Generic consumables do not duplicate named supplies. Separate an asset/container physical custody movement from its once-only service/provision burden; actual inward empty-container returns are receipts in containers_in, while containers_at_gate records only outward handoffs. Record stock and direction without treating return movements as new purchases or co-products."
      source_ids: []
    - rule_id: chronology
      applies_to: "all nodes"
      rule: "The process map is a responsibility map, not a mandatory delay until after sorting before cooling. Actual icing/chilling may begin immediately on capture and continue through preparation/sorting/presentation/delivery. Record the chronological state, temperature-time and lot/transfer ids at each real handoff; link each early, repeated or continuing chilling event to its single actual resource-owning node and protocol, without missing or duplicating electricity, ice, water or equipment. A pre-chill label never permits an unchilled final lot."
      source_ids: []
    - rule_id: support_instances
      applies_to: "support"
      rule: "Identify each actual support instance by operation/resource owner, site, period, service/asset/treatment id, consuming node and physical incoming/outgoing state. cp_support is only the protocol for these real support instances, never a synthetic all-processes owner. Close physical same-transfer sender/receiver quantities before output attribution; attributed LCA shares cannot replace physical mass closure. Assign a different actual direct-release owner only with its documented node/protocol record."
      source_ids: []
    - rule_id: ecological_ledger
      applies_to: "capture"
      rule: "Retain species, live/dead condition, number/mass, capture/release locations and times, retention fate, gear loss and actual habitat-disturbance observations for target/incidental catches. Keep these physical/ecological records separately from attributed LCA quantities; animal removal or release is not automatically a verified elementary biomass exchange. Use a separately justified concrete model for any such exchange, not a fake UUID, zero-bycatch assertion or sustainability/avoided-production credit."
      source_ids: []
    - rule_id: capture_context
      applies_to: "capture"
      rule: "Start with wild animals in their natural eastern Atlantic/Mediterranean habitat and actual unbaited unglazed-earthenware shelter-pot operations; include deployment, soak/retrieval, outbound/return, unsuccessful/support trips and actual lost gear. Wild growth is not farm production. Select species sensu stricto from traceable identification, not worldwide species-complex labels."
      source_ids:
        - fao-traps-pots
        - ipma-polqual-2017
        - fao-cephalopods-vol3
    - rule_id: selected_chilled_state
      applies_to: "chill"
      rule: "The chilled never-frozen subroute is this PCR selection, not a claim about all Portuguese landings. Require actual icing/cooling, elapsed prechill and temperature/time records through acceptance; unchilled, live-reference, frozen, thawed, gutted or tenderized lots fail selection. Codex gives guidance, while the IPMA source samples were not chilled."
      source_ids:
        - ipma-polqual-2017
        - codex-fish-2012
    - rule_id: operation_owner
      applies_to: "all nodes"
      rule: "Direct foreground operation is operation/resource responsibility, including leased or contracted equipment where actual resources are foreground-controlled; it is not legal title. Model supplier-inclusive service once at support_service and exclude duplicate direct resources/emissions/assets. Document provider versus foreground responsibility before attribution."
      source_ids: []
    - rule_id: physical_first
      applies_to: "all nodes"
      rule: "First retain complete physical trip/lot/event/period ledgers and unique resource owners, then attribute to actual intended output using section 7. Keep whole-fleet zero-output periods, carryover stocks, gear provision/repair/replacement/end-of-use and idle/support-return events; do not omit them because accepted output is zero. Transfer inherited burdens once."
      source_ids: []
    - rule_id: water_residual_owner
      applies_to: "all nodes"
      rule: "Pair each real internal usable-water and contained-waste transfer by source/destination/transfer id before allocation. Only actual natural-to-foreground abstraction is elementary uptake; same-node circulation and stock movement are subledgers. The actual direct release or external final-treatment handoff has one owner. Split wastewater bulk from substance masses; no implicit recycling/rework or duplicate purchase."
      source_ids: []
    - rule_id: gate
      applies_to: "handover"
      rule: "Include actual harvester transport and continuing chill before first recipient physical acceptance; record place/time, net animal mass and ownership of each pre-gate event. Exclude buyer processing, gutting, tenderization, downstream distribution, cooking and use. This LCA gate is not a food-safety, legality or sustainability certificate."
      source_ids: []
