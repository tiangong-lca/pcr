  calculation_rules:
    - id: physical_balance
      applies_to: "all inventory rows"
      rule: "Reconcile opening stock + actual incoming = actual outgoing + closing stock for each material/state/node/period, with measured transformations and separately recorded natural gain/loss where relevant; do not force equality by adding a fictitious flow."
      inputs:
        - "Opening/closing stocks"
        - "actual transfers"
        - "measured transformations"
      output: "Reconciled raw physical ledgers"
      source_ids: []
    - id: attributed_normalization
      applies_to: "all inventory rows"
      rule: "For each physically owned row apply the documented section 7 intended-output share once; divide by actual accepted net animal wet mass of the selected reporting output. Retain full physical ledger and zero-output carryover separately; final reference is 1 kg, not every internal transfer."
      inputs:
        - "Physical row amount"
        - "justified attribution share"
        - "accepted net animal wet mass"
        - cp_handover
      output: "per 1 kg reference flow"
      source_ids: []
    - id: direct_emission
      applies_to: "direct elementary outputs"
      rule: "Use measured substance mass or documented fuel/material inventory × independently evidenced substance-specific factor with compatible fossil fraction and receiving compartment; no factor is supplied by this PCR."
      inputs:
        - "Measured substances or actual inventory/factor evidence"
        - "actual owner"
      output: "Individual substance mass in actual compartment"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "reference product"
      requirement: "Species sensu stricto, wild gear route, raw whole ungutted state and physical gate; actual never-frozen chill history"
      evidence: "Identification/catch/gear/chill/recipient logs"
    - id: completeness
      applies_to: "all nodes"
      requirement: "Full period, all intended outputs and zero-output events, assets/stock/carryover and owner-linked water/residual/animal transfers"
      evidence: "Primary ledgers and reconciliation with attribution decisions"
    - id: measurement
      applies_to: "all inventory rows"
      requirement: "Row-specific units, calibrated raw measurements, provider scope and independent U approval; no invented amounts or generic pollutant identity"
      evidence: "Calibration/raw measurements, source/factor support and prior independent guardrail evidence"
    - id: limits
      applies_to: "all inventory rows"
      requirement: "Disclose unresolved flow/support identities, U values, attribution or missing raw data; resolve concrete exchanges before final TIDAS projection"
      evidence: "Explicit data-package gap and sensitivity records"
    - id: collect_capture_materials_fuels
      applies_to: "capture; Inputs; Product flows: Actual fuels and consumable materials for capture"
