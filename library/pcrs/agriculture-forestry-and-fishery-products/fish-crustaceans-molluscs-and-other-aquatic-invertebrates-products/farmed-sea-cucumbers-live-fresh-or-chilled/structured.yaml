system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "foreground_scope"
      rule: "Establish actual hatchery-juvenile-origin tidal pond monoculture and whole live state from primary records. FAO context does not prove a farm's practices; MARA guidance is a candidate management checklist, not evidence that all listed interventions occur or numerical PCR defaults."
      source_ids:
        - fao-northern-mariculture
        - mara-pond-management-2020
    - rule_id: b_pond
      applies_to: "pond"
      rule: "Include pond preparation, actual onfarm nursery as separately indexed phases, stocking and restocking, managed food production, supplementary feeds actually used, water exchange, actual aeration/pumping/shading/treatment, cleanup and mortality. Pond detritus/diatoms are not automatically manufactured feed inputs or burden-free purchased products; record actual managed fertilizer/feed/substrate inputs and their sediment/water fates."
      source_ids:
        - mara-pond-management-2020
    - rule_id: b_capture
      applies_to: "harvest"
      rule: "Harvest is independent removal from the managed standing stock; growth is not counted again. Record boat/diver hand-rake/net-bag services, collected live animals, incidental sediment/water/organisms, losses and return destinations. Managed pond material accompanies animals as internal T_PI, not a second environmental abstraction; genuinely new external material requires distinct source-boundary evidence. Do not import source productivity or crew-size numbers."
      source_ids:
        - qingdao-pond-harvest-2023
    - rule_id: b_gate
      applies_to: "presentation; receipt"
      rule: "Presentation and logistics have separate nodes. Include every physical movement, actual holding and protective service before the first recipient physically receives the lot, irrespective of owner, payer, invoice or contractual transfer. A recipient's subsequent processing is excluded."
      source_ids: []
    - rule_id: b_hold
      applies_to: "hold"
      rule: "Activate only with records of a bounded live-preserving intervention, its purpose, place and start/end times; ordinary elapsed time alone does not establish a holding node. Unknown actual state is a data gap, never an inactive default."
      source_ids: []
    - rule_id: b_handoffs
      applies_to: "internal_transfers"
      rule: "Pair each physical handoff using one transfer id, live state, lot/time, native quantity and one owner: T_PH animals and T_PI managed pond water/sediment to harvest; T_HS collected animals and T_IS incidental material harvest to sort; T_SD sort direct to presentation; T_SH sort to hold; T_HP hold to presentation; T_PR presented lot to receipt. Returns R_HP harvest to pond and R_SP sort to pond pair with pond_returns; any other actual live return is individually registered in that pair. Closing standing stock is a ledger state, not an extra delivered exchange."
      source_ids: []
    - rule_id: b_environment
      applies_to: "all_nodes"
      rule: "Distinguish delivered water products from elementary seawater abstraction; record tidal and pumped volumes and energy separately. Returned carrier water has its own volume row; each pollutant requires individual substance, nutrient/carbon basis, measured or supported concentration, receiving medium and fate. Do not label the entire water volume as a pollutant or count shipped wastewater as direct release. Actual onfarm treatment has its own service/components and treatment inlet/outlet/removed-solids records; provider treatment is linked to the shipped waste."
      source_ids: []
    - rule_id: b_assets
      applies_to: "all_nodes"
      rule: "Include actual pond/sluice/substrate, nursery, boat/dive equipment, pumps, holding equipment, containers and logistics asset shares, maintenance, replacement and terminal cleanup. Enumerate consuming nodes and periods; derive service lives/utilization from records with rationale and sensitivity. No universal life, free infrastructure or environmental credit."
      source_ids: []
