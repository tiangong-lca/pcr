validation_rules:
  - rule_id: v_eligibility
    applies_to: "reference_product"
    rule: "Fail eligibility when species/origin/route, whole native body, live/raw/never-frozen state or actual first physical receipt is unsupported; eviscerated/dried/frozen and cage/polyculture routes are outside scope."
    source_ids:
      - fao-northern-mariculture
  - rule_id: v_mass
    applies_to: "reference_product; all_rows"
    rule: "Check cp_receipt A is positive calibrated accepted net whole-live animal mass; recipient_live_whole is the linked final output at 1 kg. All rows retain native units and per 1 kg reference basis; juveniles, internal transfers and carrier water cannot be set to final A by assumption."
    source_ids: []
  - rule_id: v_nodes
    applies_to: "process_map"
    rule: "Check all required nodes and actual conditional instances, exact T/R pairs, holding/bypass evidence, animal and incidental fate balances, intended grades/receivers, and no duplicate final output. Unknown holding is incomplete."
    source_ids:
      - qingdao-pond-harvest-2023
  - rule_id: v_food_water
    applies_to: "pond; all_water_rows"
    rule: "Check actual nursery/food/fertilizer/substrate/treatment inputs, tidal/pump/water balances, sediment retention/removal and actual individual chemical/medium releases. No guidance numeric defaults or invented manufactured detritus feed; separate carrier return, shipped wastewater and actual treatment."
    source_ids:
      - mara-pond-management-2020
  - rule_id: v_periods_assets
    applies_to: "all_nodes"
    rule: "Check cohort/phase/run/period completeness, failed services, open stock, replacements/termination, shared asset consumers and service-life evidence/sensitivity; each event and burden is attributed once with no environmental credit."
    source_ids: []
  - rule_id: v_evidence
    applies_to: "inventory; identities"
    rule: "Every actual card instance needs quantity, own-node protocol, applicable range evidence/remaining gap, property/unit, fate and verified identity before final exchange publication. A candidate structural pass does not resolve UUIDs or prove empirical completeness or publication readiness."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable per-flow collection obligations and final exchanges"
    rule: "Final dataset completion and validation require every actual exchange to have an independent atomic card and its own quantity, property/native unit, collection or calculation evidence, range/uncertainty evidence, normalization, actual destination and verified UUID. Unknown identity, activity state, quantity, range evidence or fate blocks completion; it is never zero, a presumed bypass or permission to omit an obligation. Every important concrete flow retains its own range/uncertainty evidence collection duty; a symbolic upper bound is not an empirical range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground collection package; after complete review usable as secondary_dataset or background_dataset"
  downstream_use: "Downstream LCA process/lifecyclemodel projections for the declared whole-live farm product receipt; recipient conversion model starts after this gate"
  allowed_use: "Exact declared species, origin, farm route/state, period and first physical recipient with compatible attribution and upstream coverage"
  excluded_use: "Whole CPC leaf equivalence, wild/cage/ranching/polyculture proxies, eviscerated/frozen/dried product, guaranteed sale/quality, environmental benefit claims or unverified final exchange identities"
  required_metadata: "PCR/version; species/origin; farm/pond/cohorts/phases/periods; food/water pathways; actual harvest/sort/holding-or-bypass/presentation/logistics; first custody and net mass; all intended outputs/stock/returns; upstream coverage; allocation/assets and service life; units and verified identities"
  required_quality_disclosure: "Primary completeness, failed/open stock and uncertainty, sampling/conversion/bounds, source roles, actual treatment/release fate, exclusions and unresolved data/identity/attribution gaps"
  update_trigger: "Change of species/origin, nursery/pond/food/water route, collection/preservation/presentation/logistics or recipient gate, state, allocation/service life, supplier data, actual emission/fate evidence or identity verification"
data_sources:
  - id: "fao-northern-mariculture"
    type: "official_guidance"
    reference: "FAO, northern China mariculture chapter, The future of mariculture: a regional approach for responsible development in the Asia-Pacific region, https://www.fao.org/4/i0202e/i0202e13.pdf ; retrieved 2026-10-12"
    used_for: "Species/hatchery context and Shandong pond route; historical advice is not foreground fact or numerical default"
  - id: "mara-pond-management-2020"
    type: "official_guidance"
    reference: "MARA Fisheries Bureau, Sea cucumber pond production management guidance, 2020-08-02; https://yyj.moa.gov.cn/gzdt/202008/t20200804_6349837.htm ; attachment https://faolex.fao.org/docs/pdf/chn197172.pdf ; retrieved 2026-10-12"
    used_for: "Candidate pond, food, water and seasonal-management questions only; actual use must be collected; no dosage, density, health or legal prescription"
  - id: "qingdao-pond-harvest-2023"
    type: "literature"
    reference: "Kang Xiaohuan, Qingdao Morning News original field report, 2023-05-05, republished at https://news.iqilu.com/shandong/shandonggedi/20230505/5419937.shtml ; retrieved 2026-10-12"
    used_for: "Field-observed boat/diver rake/net-bag pond collection, sorting and farm buyer context; not an audited inventory or proof of any application lot's receipt"
