allocation_rules:
  - rule_id: a_subdivision
    applies_to: "all_nodes"
    rule: "First subdivide independently metered cohort, pond, phase, trip, grade, intervention, package and route services. Each physical event has one owner and no duplicate upstream/component burden. Internal T/R transfers carry attributed burdens once, not allocation credit or additional final product."
    source_ids: []
  - rule_id: a_outputs
    applies_to: "all_intended_outputs"
    rule: "Enumerate every actual intended output and receiver at each node, including alternate whole-live grades, continued-growth returns and beneficial recovered material. Apply subdivision first; for inseparable same-species live grades at one gate, use measured net live mass shares with rationale. For materially different juvenile/other outputs, justify a causal service-use basis; if unavailable, document an economic allocation using same-period actual quantities/prices and sensitivity. Do not extend live-mass allocation automatically to sediment, carrier water, mortality or unrelated materials; no substitution credit."
    source_ids: []
  - rule_id: a_periods
    applies_to: "pond; all_nodes"
    rule: "Link preparation, upstream and actual onfarm nursery, stocking/restocking, growth, low-activity seasons, repeated harvests, failed batches, open stock and cleanup to cohort/pond/phase/period. Attribute actual shared pond operating burdens by evidenced occupied pond-area-time to cohorts, then intended output attribution; disclose causal limitations and sensitivity to biomass-time if relevant. Preserve closing/opening burden continuity and actual ending/termination events; do not divide all historical burdens by one successful harvest or erase failed periods."
    source_ids: []
  - rule_id: a_assets
    applies_to: "shared_infrastructure"
    rule: "Maintain one asset/service register identifying pond/sluice/substrate, nursery equipment, boat/dive gear, pumps, work area, holding system, containers and vehicles actually used, all consuming nodes/periods, acquisition/replacement/disposal and service/utilization records. Use metered use first, documented service-hours/trips/area-time as causal alternatives; derive service life from evidence and test uncertainty. Reusable-container washing/repair/replacement belongs to actual uses. Missing life or utilization remains a gap, not an arbitrary standard life."
    source_ids: []
  - rule_id: a_losses
    applies_to: "mortality; waste; failed_batches"
    rule: "Include mortality, rejected unusable animals, actual treatment and disposal, empty returns and failed services in the supplying cohort or service period. Live returns retain burden/stock lineage rather than receiving waste treatment; only actual recovery or dispatch changes destination. Report unknown mortality/open stock and unsupported attribution as incomplete data."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_pond
      process_id: "pond"
      flow_role: "Juveniles, food, materials, water, services, stock, returns, wastes and releases"
      record_type: "Supplier/pond/cohort/phase/asset and environmental ledger"
      raw_fields: "Supplier lot/species/origin; upstream nursery coverage; onfarm nursery phase; stocking/restocking count/net mass; pond area and dates; opening/closing stock; T_PH/T_PI/R ids; feed/fertilizer product/nutrient/moisture; actual treatment/substrate; intake/outlet volume and paired substance concentrations/basis; tidal/pump/aeration logs; energy; assets/service life/use; mortality/removal/fate; complete-service coverage"
      collection_method: "Reconcile supplier receipts and cohort counts with calibrated net weighing and documented sampling; meter actual water/energy or document event-based flow measurement and uncertainty; inspect actual food/management records; pair intake/outlet samples with flow events and chemical basis; retain sediment/stock fate, failed and cleanup records and actual onfarm nursery phases"
      unit: "kg; m3; count; kWh; MJ; h; actual service unit"
      frequency: "Each receipt, transfer, intervention and loss; time-resolved water/energy; period stock reconciliation"
      temporal_coverage: "Complete cohort history and linked seasons, including incomplete/failed periods and asset service periods"
      site_scope: "Identified Shandong farm, pond and any actual onfarm nursery site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Species/origin records; calibration; sampling/flow uncertainty; supplier coverage; stock/event/asset and fate audit trail"
    - protocol_id: cp_harvest
      process_id: "harvest"
      flow_role: "Stock/incidentals, collection services, transfers, returns, alternative products, waste and releases"
      record_type: "Trip/diver/event and transfer ledger"
      raw_fields: "Cohort/pond/trip; T_PH/T_PI/T_HS/T_IS/R_HP; start/end; whole-live count/net mass; managed T_PI versus genuinely new external incidental water/sediment/organisms and source boundary; boat/dive/rake/bag/energy/services; utilization and replacements; alternate receivers; loss/fate; substance/medium/carbon basis"
      collection_method: "Match pond removal to calibrated net animal weighing and separately measured incidental quantities; pair dispatch and sorting receipt for each transfer; reconcile boat/dive service or component coverage, returns, alternate deliveries and actual waste/release records"
      unit: "kg; m3; count; h; kWh; MJ; actual service unit"
      frequency: "Each collection trip/event, transfer and loss"
      temporal_coverage: "All selected and failed harvest services within cohort periods"
      site_scope: "Actual collection pond, boat and unloading location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Paired transfer sheets; calibration; dive/boat logs; destination and coverage evidence"
    - protocol_id: cp_sort
      process_id: "sort"
      flow_role: "Incoming animals/incidentals, grade destinations, services, waste and releases"
      record_type: "Sorting lot/destination ledger"
      raw_fields: "T_HS/T_IS/T_SD/T_SH/R_SP; lot/time/live status; actual grade criterion and net mass/count; carrier/incidentals; direct/hold activation; alternate gate/receiver; services/cleanup; mortality/waste/fate; substance/medium/basis"
      collection_method: "Weigh actual grades with calibrated tare and free-water exclusion; match incoming incidental material to actual recovery/waste/release fates; pair every outgoing T/R with its receiving node, document actual holding or bypass and retain alternate recipient evidence"
      unit: "kg; m3; count; kWh; MJ; h; actual service unit"
      frequency: "Each sorting lot and destination split"
      temporal_coverage: "All sorting events and failed lots linked to production periods"
      site_scope: "Actual farm sorting location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Grade/receiver records; paired T/R sheets; calibration; actual fate and service records"
    - protocol_id: cp_hold
      process_id: "hold"
      flow_role: "Incoming/outgoing live animals, water, intervention services, alternative outputs, wastes and releases"
      record_type: "Bounded intervention episode ledger"
      raw_fields: "T_SH/T_HP and any R id; purpose/site/start/end; live status/count/net mass; actual water/intake/outlet/substance basis; energy/aeration/cooling/materials; equipment service periods; mortality and alternate gate/fate; treatment inlet/outlet/solids"
      collection_method: "Confirm observed intervention and actual duration; calibrate net animal weighing at both handoffs; meter actual service/water, sample actual constituents with basis and fate, retain episode mortality and component/complete-service coverage; missing activation remains unresolved"
      unit: "kg; m3; count; h; kWh; MJ; actual service unit"
      frequency: "Every episode, handoff, actual intervention and loss"
      temporal_coverage: "Complete actual episode including failure/cleanup; no assumed shelf-life"
      site_scope: "Actual pre-receipt holding location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Intervention/time and live-state records; paired transfers; calibration; water/service and treatment evidence"
    - protocol_id: cp_presentation
      process_id: "presentation"
      flow_role: "Direct/held lot, packaging/water/services, dispatch, alternate outputs, waste and releases"
      record_type: "Presentation/container-cycle ledger"
      raw_fields: "T_SD/T_HP/T_PR; lot/live state/net animal mass; actual package/carrier-water mass/volume; container id/ownership/reuse trips; washing/repair/replacement; supplies/services; direct intake if any; alternative gate and waste/release fate"
      collection_method: "Pair direct or held receipt to actual presented dispatch; calibrated animal/container tare and free-water records; record actual protective form or affirmative unpackaged handoff; track reusable container cycles and actual cleaning/water/asset shares, waste and substance/medium evidence"
      unit: "kg; m3; count; h; kWh; MJ; actual service unit"
      frequency: "Each presented lot and container/service cycle"
      temporal_coverage: "All presentation and cleanup cycles attributable to selected and failed lots"
      site_scope: "Actual presentation and cleaning location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Transfer/dispatch records; tare/calibration; package specifications; reuse/cleanup/fate trail"
    - protocol_id: cp_receipt
      process_id: "receipt"
      flow_role: "Incoming presented lot, logistics, accepted reference, alternate outputs, waste and releases"
      record_type: "Route/first-physical-receipt ledger"
      raw_fields: "T_PR; lot/species/cohort; route/loading/dispatch and physical receipt location/time/custody; live/raw/never-frozen/native-body evidence; calibrated gross/tare/free-water/incidentals and accepted net mass A; rejected/diverted live quantities; distance/load/empty return; all operators/payers; protective service coverage; mortality/waste/release substance/medium/basis"
      collection_method: "Trace the physical lot to the first actual recipient; verify state and acceptance independently of invoices. Weigh accepted whole live animals on calibrated scales excluding free water, packaging and incidentals; record A, all pre-receipt movement/services and actual loss/diversion/fate with paired dispatch/receipt records"
      unit: "kg; m3; count; tonne-km; km; kWh; MJ; h; actual service unit"
      frequency: "Each shipment/handoff, acceptance, diversion and loss"
      temporal_coverage: "Complete pre-receipt route including failed attempts and actual protective services"
      site_scope: "Every actual pre-receipt location through identified first recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Signed physical custody/acceptance; scale calibration/tare; live/state and route evidence; complete-service coverage and fate records"
  calculation_rules:
    - id: normalize_receipt
      applies_to: "all inventory rows"
      rule: "Divide each attributable native quantity by accepted same-lot net whole-live mass A in kg after period/output allocation; final same-lot animal output is A / A = 1 kg per 1 kg reference flow. Keep internal quantities measured."
      inputs:
        - "Node-specific protocols"
        - cp_receipt
        - "allocation ledger"
        - A
      output: "Native quantity per 1 kg reference flow"
      source_ids: []
    - id: transfer_reconcile
      applies_to: "all physical transfers"
      rule: "Pair each T/R sender and receiver with identical transfer id, lot, state and original measured quantity; separately document any measured time-dependent water/mass change or loss between distinct events instead of forcing equality to final A."
      inputs:
        - "All node protocols"
        - "paired records"
      output: "Transfer and fate reconciliation"
      source_ids: []
    - id: water_load
      applies_to: "actual water pollutant instances"
      rule: "Calculate each substance load from its actual sampled concentration and corresponding measured carrier volume with explicit unit and chemical-basis conversions; disclose background intake, net attribution and retained sediment separately, actual onfarm treatment inlet/outlet and provider treatment coverage. Do not sum carbon/nutrient equivalents as distinct physical substances."
      inputs:
        - "Node water/constituent records"
        - "conversion and treatment evidence"
      output: "Individual substance/medium load and uncertainty"
      source_ids: []
    - id: service_share
      applies_to: "actual shared services/assets"
      rule: "Allocate actual event/period service burden once using evidenced meter or causal use shares and documented service life, replacement and termination; reconcile all consumer shares to the actual total and retain sensitivity."
      inputs:
        - "Node and shared asset registers"
        - "allocation ledger"
      output: "Attributable service burden by node/period/output"
      source_ids: []
