      applies_to: "Whole-live reference"
      requirement: "Establish actual species/hatchery origin, tidal pond monoculture, whole native body, live/raw/never-frozen state and first physical receipt; unknown eligibility remains a gap"
      evidence: "Primary cohort, state, weigh and physical custody records"
    - id: dq_complete
      applies_to: "All nodes and periods"
      requirement: "Cover actual food/management, nursery, seasonal/open/failed cohorts, intended alternate destinations, returns, stock, mortality, cleanup, water/sediment pathways, assets and every pre-receipt service; no default unknown-to-zero"
      evidence: "Node/period/output/asset register and reconciliation"
    - id: dq_quantities
      applies_to: "Every card instance"
      requirement: "Replace symbolic U_row,instance with reviewed foreground uncertainty/range evidence; no source guide rates, yields, conversion or duration defaults. Preserve units and document calibration, sampling, composition and conversion uncertainty"
      evidence: "Actual records, measured uncertainty and reviewed bounds"
    - id: dq_sources
      applies_to: "Boundary and modelling"
      requirement: "Separate FAO taxonomy/pond context, MARA candidate duties and original Qingdao field-observed harvest/sorting evidence from primary inventory; no source establishes all-farm operations or actual receipt"
