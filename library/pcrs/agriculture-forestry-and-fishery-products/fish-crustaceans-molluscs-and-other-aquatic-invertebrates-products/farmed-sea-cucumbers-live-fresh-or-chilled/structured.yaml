measurement_rules:
  - id: whole_live_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh whole live animals on a calibrated scale with documented removal of free carrier water and container tare; keep native body contents. Record live/state observations at receipt and same-lot accepted net mass A in cp_receipt. Whole, gutted, drained-after-evisceration and dry masses are not interchangeable."
  - id: native_quantity
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual flow property"
      uuid: ""
    required_unit: "actual native unit"
    rule: "Preserve measured kg, m3, kWh, MJ, item counts, animal counts, hours and tonne-km; record supplier-specific density, net mass and load evidence for conversions. Juvenile counts require the same lot's count and sampled mass; do not infer adult yield or use standard survival, feed or water factors."
  - id: chemical_basis
    applies_to: "fertilizer, feed, treatment and emission instances"
    required_property_ref:
      name: "Actual substance basis"
      uuid: ""
    required_unit: "kg substance or stated nutrient/carbon basis"
    rule: "Keep product mass separate from nutrient mass, active ingredient and chemical species. Record test or supplier composition and explicit conversion; nitrogen as N is not ammonia mass, phosphorus as P is not phosphate mass, and fossil/biogenic carbon remain separate."
