system_boundary:
  rules:
    - rule_id: boundary_origin
      applies_to: "acquisition"
      rule: "Keep wild capture and source-to-raft live transport explicit, either measured here or inherited once from a verified upstream dataset. Separate initial wild animals from the later farmed output; do not claim closed hatchery ancestry."
      source_ids:
        - chapela-octopus-2006
    - rule_id: boundary_growth
      applies_to: "raft_ongrowth"
      rule: "Include actual stocking, fresh/frozen feed purchase/storage/thawing, feeding, sex/cohort management, monitoring/sampling returns, fouling and dead-animal removal, food-remnant suction, cleaning, replacement and termination. Open-water ambient exposure is not an invented pumped-water input; actual pumps/abstraction are separately recorded."
      source_ids:
        - chapela-octopus-2006
    - rule_id: boundary_final
      applies_to: "final_collection; grade_destination"
      rule: "Final nonreturn removal from managed cages is an independent custody change, followed by declared destination sorting. Source research returns do not prove this event. Incoming whole-live animals must reconcile to accepted live onward lots, actual alternative intended outputs, actual returns/retained stocks and actual rejects/waste with destinations."
      source_ids:
        - pcr-octopus-foreground-method
    - rule_id: boundary_holding
      applies_to: "live_holding"
      rule: "A bounded preservation intervention after sorting is conditional on actual records with start/end, incoming usable live state, outgoing live state and its own supplies/services/losses. Evidenced bypass routes sorted animals directly to presentation. Unknown state or duration is a gap, not zero or bypass."
      source_ids:
        - pcr-octopus-foreground-method
    - rule_id: boundary_gate
      applies_to: "live_presentation; prereceipt_logistics"
      rule: "Presentation protects the live state and keeps carrier water and reusable/single-use equipment separate from animal mass. Distribution belongs to prereceipt_logistics, including every movement before first physical receipt regardless of payer. The reference excludes later recipient operations, use and end of life; actual in-boundary waste destinations remain included."
      source_ids:
        - pcr-octopus-foreground-method
    - rule_id: boundary_shared
      applies_to: "shared assets and periods"
      rule: "Identify the mussel raft/platform, cages, PVC dens, vessel/tanks, storage and presentation equipment, every real service consumer and service period, including other raft users. No mussel biomass input is invented solely because a raft has mussel users; its service is not free."
      source_ids:
        - chapela-octopus-2006
    - rule_id: boundary_complete
      applies_to: "all nodes"
      rule: "Record actual active/bypass/unknown state for every conditional instance, all intended output instances, residues, mortality, escapes, water, material, packaging and elementary destinations. Reconcile periods and loops without double counting. Complete bundled services exclude covered energy/material/asset/releases from separately counted components."
      source_ids:
        - pcr-octopus-foreground-method
