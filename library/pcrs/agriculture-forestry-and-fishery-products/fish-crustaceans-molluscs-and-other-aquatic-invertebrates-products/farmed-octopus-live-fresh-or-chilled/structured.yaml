    reference: "Chapela A., González A.F., Dawe E.G., Rocha F.J. and Guerra Á. (2006). Growth of common octopus (Octopus vulgaris) in cages suspended from rafts. Scientia Marina 70(1):121–129. https://doi.org/10.3989/scimar.2006.70n1121"
    used_for: "Actual Ría de Vigo wild creel-origin acquisition/live transport, sex-separated galvanized raft cages/PVC dens, purchased fresh/frozen fish/crab/mussel feed stored/thawed, monitoring returns, fouling/dead removal and food-remnant suction; seasonal/spawning/late mortality and analytical-window limitations. No future quantity default, final commercial delivery, current legal/welfare/safety guarantee or complete hatchery origin."
