validation_rules:
  - rule_id: validate_reference
    applies_to: "final reference"
    rule: "Require exactly one final output and reference link, species/origin/managed growth/whole-live never-frozen state and first physical receipt proof, positive observed A and A/A normalization only. Dead arrivals, invoice-only gates and mantle-only mass do not satisfy the reference."
    source_ids:
      - pcr-octopus-foreground-method
  - rule_id: validate_transfers
    applies_to: "every internal handoff"
    rule: "Match sender/receiver ids, actual lot, same state, native property/unit, quantity, custody and inherited burdens for animals, water, matter, stock, returns and packages. Check the holding branch against observed active/bypass state; unknown blocks completion. Monitoring returns are not final harvest."
    source_ids:
      - pcr-octopus-foreground-method
  - rule_id: validate_periods
    applies_to: "all cohorts and services"
    rule: "Reconcile complete sex/cohort/season intervals, failures, spawning/eggs/fates, mortality, feed stocks, live stocks, monitoring returns, cleaning/changeovers, replacement and termination. Reject truncation at a study analytical window or duplicated stock/return burdens."
    source_ids:
      - chapela-octopus-2006
      - pcr-octopus-foreground-method
  - rule_id: validate_destinations
    applies_to: "each real node"
    rule: "Account for every intended product/grade and actual alternative output, reject, stock, loss, waste-treatment and environment destination. Resolve zero/one/multiple conditional instances with actual records; unknown is not absence. No automatic waste credit or free shared raft."
    source_ids:
      - pcr-octopus-foreground-method
  - rule_id: validate_allocation
    applies_to: "shared and inseparable outputs"
    rule: "Check precedence of subdivision, evidenced causal physical allocation and justified economic fallback. Include all real raft/service consumers and retained-stock values; require comparable nonnegative net sales and positive denominator, with alternatives/sensitivity for zero/negative/missing values; never profit."
    source_ids:
      - pcr-octopus-foreground-method
  - rule_id: validate_native
    applies_to: "all quantities and ranges"
    rule: "Keep each actual carrier/service native property/unit, own-node protocol and per 1 kg reference flow basis; h only timed use, auxiliary MJ no replacement/duplicate fuel exchange. Distinguish direct measured original release mass/method from activity/factor estimates and their observed inputs/formula/used factors/sources. Provisional U is not an amount or measured cap. Complete services exclude covered components/releases."
    source_ids:
      - pcr-octopus-foreground-method
  - rule_id: validate_readiness
    applies_to: "dataset handoff"
    rule: "A candidate methodology, structural check or literature route alone proves neither current regulatory/welfare/safety eligibility nor commercial receipt or a verified final UUID. Concrete identities, primary records, upstream coverage, qualified gaps and methodological review are required before downstream use."
    source_ids:
      - pcr-octopus-foreground-method
  - rule_id: validate_atomic_completion
    applies_to: "all applicable per-flow collection obligations and final exchanges"
    rule: "Final dataset completion and validation require every actual exchange to have an independent atomic card and its own quantity, property/native unit, collection or calculation evidence, range/uncertainty evidence, normalization, actual destination and verified UUID. Unknown identity, activity state, quantity, range evidence or fate blocks completion; it is never zero, a presumed bypass or permission to omit an obligation. Every important concrete flow retains its own range/uncertainty evidence collection duty; a symbolic upper bound is not an empirical range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package first, with process and lifecyclemodel projections only after methodological review and verification of actual concrete exchanges"
  downstream_use: "A completed reviewed data package may be described as secondary_dataset or background_dataset only within its documented species, wild-origin acquisition, managed raft-cage route, whole-live state, geographic/temporal scope and first physical receipt boundary"
  allowed_use: "Modelling the evidenced whole-live Octopus vulgaris raft-cage ongrowth supply through first physical receipt, with complete upstream capture/transport/feeding/shared-service burdens and disclosed uncertainty"
  excluded_use: "Generic octopus or all CPC 04472; direct wild final catch; closed hatchery production; other species/routes; ornamental, dead/frozen/processed/eviscerated products; unsupported current safety/legal/welfare/commercial-success claims; automatic consequential credits"
  required_metadata: "PCR id/version; actual species/origin/capture ancestry and dates; raft/site; sex/cohort/season and complete periods; feed sources/states; managed growth evidence; all final custody/grade/holding/presentation/leg/receipt records; net wet mass basis; outputs/stocks/returns; shared consumers/assets/service life; allocation; native units; verified concrete exchanges and upstream coverage"
  required_quality_disclosure: "Primary record coverage, mass/count/live-state uncertainty, independent provisional bounds, conditional active/bypass/unknown states, failures/reproductive effects, release/energy formula-factor evidence, service/component scope, upstream gaps and unresolved identities, reviewed methodological applicability"
  update_trigger: "Species/source/route/site/feed/stock/service user changes; changed live state or gate; holding/presentation/logistics change; asset replacement or termination; improved primary/independent bound evidence; corrected identity, upstream dataset, factor or allocation; new legal/safety/welfare context affecting applicability"
