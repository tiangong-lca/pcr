measurement_rules:
  - id: reference_wet_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "A is the positive observed accepted net whole-live animal wet mass of the same receipt lot, measured under cp_receipt. Retain mantle, arms, organs and native animal body water. Exclude free/carrier water, tare, packaging and incidentals. Record the actual noninjurious measurement method; source sample manipulation is not prescribed."
  - id: native_quantity
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Native declared property"
      uuid: ""
    required_unit: "Native declared unit"
    rule: "Preserve each instance's physical property and unit before dividing its attributable quantity by A. Electricity exchanges retain actual kWh, fuel exchanges actual kg or m3 and heat exchanges actual MJ when those are the verified native units. Auxiliary energy accounting never replaces or duplicates a fuel exchange. Hours apply only to real timed equipment/use services; all other services retain provider-defined native property/unit without conversion to hours. Freight retains actual tonne-kilometres. Count, size and condition are independent metadata; count-to-mass estimates require representative weighed live same-lot samples, sampling design and uncertainty, never a species constant."
  - id: internal_transfer
    applies_to: "internal handoffs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Pair animal, carrier/free-water, material, stock, return and package transfers by transfer id, same state and native unit at sender and receiver; measure nonfinal quantities independently. Never force an internal feed to 1 kg or subtract rejected animals without carrying their inherited burden."
  - id: water_release_basis
    applies_to: "water and release instances"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record actual seawater abstraction separately from purchased water and internal circulation. Same water is not re-abstracted at each node. Pollutant mass is distinct from total water, with substance/basis/medium and measured inputs for any calculation."
