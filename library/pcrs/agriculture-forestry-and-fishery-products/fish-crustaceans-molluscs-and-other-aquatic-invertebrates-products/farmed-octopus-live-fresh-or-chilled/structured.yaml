allocation_rules:
  - rule_id: allocation_separate
    applies_to: "all nodes and outputs"
    rule: "First subdivide independently measured activities and destinations. Enumerate all intended animal grades, alternate usable/reproductive outputs if actual, retained stocks and other raft-service users with handoffs; distinguish residues/waste and ordinary internal transfers. A transfer or monitoring return is not an extra sale."
    source_ids:
      - pcr-octopus-foreground-method
  - rule_id: allocation_causal
    applies_to: "shared raft, assets and services"
    rule: "Attribute raft/cage/den/vessel/tank/storage/presentation service using actual causal capacity/use over the observed service period, such as evidenced occupied capacity-time. Enumerate every consuming node, cohort, season and other raft user. Document denominator, exclusions and uncertainty; no free platform or automatic mussel biomass input. Retain a single burden owner and service/component boundary."
    source_ids:
      - pcr-octopus-foreground-method
  - rule_id: allocation_output
    applies_to: "inseparable intended co-products"
    rule: "After subdivision and an evidenced causal physical relationship, use that relationship. Only when neither is defensible use economic sensitivity fallback: comparable nonnegative producer-gate net SALES values of all intended outputs and retained stock, with a positive denominator and matched dates, currency, quality and handoff. Never use profit or net margin. Zero, negative or missing values require a justified alternative and sensitivity; do not silently assign zero or divide by an invalid denominator."
    source_ids:
      - pcr-octopus-foreground-method
  - rule_id: allocation_period
    applies_to: "cohorts, stocks and assets"
    rule: "Include full acquisition-through-cleanup/termination periods, failures, mortality, spawning, actual feed stocks, opening/closing live stocks and later outputs. Carry prior burdens with stocks/returns; attribute asset manufacture/maintenance/replacement/end-of-service over evidenced service life and actual consuming periods. Do not erase later failure burdens by selecting an early successful interval or burden both stock and later sale twice."
    source_ids:
      - chapela-octopus-2006
      - pcr-octopus-foreground-method
  - rule_id: allocation_losses
    applies_to: "mortality, residues and releases"
    rule: "Assign loss management and its inherited production burden to the originating cohort/output system before normalization. Recoverable intended output requires actual purpose/recipient evidence; waste receives no automatic avoided-production credit. Document actual external treatment boundaries and any separately justified scenario."
    source_ids:
      - pcr-octopus-foreground-method
dataset_production:
  collection_protocols:
    - protocol_id: cp_acquisition
      process_id: "acquisition"
      flow_role: "Wild animal/source/logistics and all node exchanges"
      record_type: "Source, capture, supplier, transfer, meter and destination records"
      raw_fields: "lot; species; capture origin/method/date/effort; upstream coverage; live count/size/condition; net wet mass; departure/arrival; vessel/tanks; water/materials; actual carrier/property/unit/readings; native service quantity/unit/users/scope; leg; losses/stocks/recipients; direct release mass/method or estimated release inputs/formula/factor/source; independent U evidence"
      collection_method: "Reconcile source/capture/service records with actual weighing, live-arrival custody, native carrier/service logs and all water/material/waste/environment destinations; preserve inherited burdens once"
      unit: "kg for mass; each actual carrier/service native unit; h only timed services"
      frequency: "Every acquisition, trip, supply, loss and transfer"
      temporal_coverage: "Actual capture/acquisition/transport and cleanup interval including failed trips"
      site_scope: "Actual fishery, vessel and raft arrival"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Source/custody and calibrated native measurement evidence; upstream boundary; transfer pairs; raw release evidence type; service scope; uncertainty"
    - protocol_id: cp_ongrowth
      process_id: "raft_ongrowth"
      flow_role: "Managed cohort, feed, management, shared raft and all node exchanges"
      record_type: "Cohort/cage, feed-stock, sampling-loop, asset, meter and destination ledgers"
      raw_fields: "lot; sex/cohort/season/dates; opening/closing count/mass; feed species/source/state/purchase/storage/thawing/dispensing/remains; water/materials; actual carrier/property/unit/readings; native service quantity/unit/users/scope; raft consumers/use; all removal/return ids; spawning/eggs/fates; mortality/escapes; cleaning/replacement/termination; recipients; direct release mass/method or estimated release inputs/formula/factor/source; independent U evidence"
      collection_method: "Reconcile full cohort/feed ledgers, actual masses and same-lot samples if needed with daily/event logs, every paired return, native carrier/service records and all collected/direct destinations; no study sampling prescription"
      unit: "kg for mass; each actual carrier/service native unit; h only timed services; independent count/condition metadata"
      frequency: "Every stocking/feed/transfer/loss/cleaning event and actual meter interval"
      temporal_coverage: "Complete actual stocking to final removal, continuing stocks and cleanup/termination, all failed and reproductive periods"
      site_scope: "Actual raft/cages, feed storage and management locations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Feed/source and calibrated native measurement evidence; full stock/loss ledger; all return custody; raw release evidence type; all raft users; asset life and service components"
    - protocol_id: cp_collection
      process_id: "final_collection"
      flow_role: "Nonreturn collection and all node exchanges"
      record_type: "Final-removal custody, weighing, service, meter and destination records"
      raw_fields: "lot/cage; collection start/end/method; source/output count/mass/state; nonreturn custody; incidentals/stock; water/materials; actual carrier/property/unit/readings; native service quantity/unit/users/scope; losses/destinations; direct release mass/method or estimated release inputs/formula/factor/source; independent U evidence"
      collection_method: "Document actual final nonreturn removal; reconcile calibrated live mass/custody, native carrier/service records and all incidental/usable/waste/environment destinations; pair all ancillary transfers/returns"
      unit: "kg for mass; each actual carrier/service native unit; h only timed services"
      frequency: "Every final collection and node exchange"
      temporal_coverage: "Full actual collection, movement handoff and cleanup interval"
      site_scope: "Actual cage collection and handoff location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Nonreturn custody; actual method; calibrated native records; transfer pairs; raw release evidence type; all destinations and service coverage"
    - protocol_id: cp_sort
      process_id: "grade_destination"
      flow_role: "Actual grading/destinations and all node exchanges"
      record_type: "Grade, condition, recipient, return/stock, meter and service ledgers"
      raw_fields: "lot; incoming count/mass/state; actual grade/condition criteria; accepted/alternate/return/stock/reject outputs; holding active/bypass/unknown; recipients/transfer ids; water/materials; actual carrier/property/unit/readings; native service quantity/unit/users/scope; wastes; direct release mass/method or estimated release inputs/formula/factor/source; independent U evidence"
      collection_method: "Reconcile actual measured grades/live condition, independent destinations, holding decision and native carrier/service records; match every return and ancillary transfer; no invented grade thresholds"
      unit: "kg for mass; each actual carrier/service native unit; h only timed services"
      frequency: "Every sorted lot, destination and exchange"
      temporal_coverage: "Complete sorting and related cleanup/return interval"
      site_scope: "Actual sorting and recipient handoffs"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Grade/recipient and calibrated native records; live state; return/stock burden; holding/bypass evidence; raw release evidence type; complete destinations"
    - protocol_id: cp_holding
      process_id: "live_holding"
      flow_role: "Bounded preservation and all active node exchanges"
      record_type: "Actual operation/bypass, time, condition, meter and destination records"
      raw_fields: "lot; active/bypass/unknown; start/end/system; live entry/exit count/mass/condition; purchased/carried/new/reused water; gases/materials; actual carrier/property/unit/readings; native service quantity/unit/users/scope; stock/alternate/return/waste destinations; direct release mass/method or estimated release inputs/formula/factor/source; independent U evidence"
      collection_method: "Establish bounded intervention or evidenced bypass; observe/calibrate entry/exit and native carrier/service records, pair all water/material/animal returns and transfers, record every destination; unknown is incomplete"
      unit: "kg for mass; each actual carrier/service native unit; h only timed services"
      frequency: "Every active interval/exchange or documented bypass"
      temporal_coverage: "Entire observed holding and cleanup interval"
      site_scope: "Actual holding system and handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Timestamped operation/bypass and calibrated native evidence; live-state logs; same-state transfers/returns; raw release evidence type; service/component and uncertainty evidence"
    - protocol_id: cp_presentation
      process_id: "live_presentation"
      flow_role: "Product/package/carrier interface and all node exchanges"
      record_type: "Presentation, reuse/stock, weighing, meter and destination ledgers"
      raw_fields: "lot/holding state; incoming/presented count/mass/state; carrier water; package/material identity/mass/tare; reusable opening/use/return/damage/closing/end-of-use; actual carrier/property/unit/readings; native service quantity/unit/users/scope; alternate/return/waste destinations; direct release mass/method or estimated release inputs/formula/factor/source; independent U evidence"
      collection_method: "Independently weigh net animals/materials/carrier water; reconcile presentation/reuse, outgoing custody, all returns/destinations and native carrier/service records; exclude logistics"
      unit: "kg for mass; each actual carrier/service native unit; h only timed services"
      frequency: "Every presented lot, material use/return and exchange"
      temporal_coverage: "Actual presentation, reuse attribution and cleanup periods"
      site_scope: "Actual presentation site and logistics handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated mass/tare/native records; live condition; material/reuse evidence; paired water/package/animal transfers/returns; raw release evidence type; service scope"
    - protocol_id: cp_receipt
      process_id: "prereceipt_logistics"
      flow_role: "Every unowned prereceipt leg, final receipt and all node exchanges"
      record_type: "Leg/custody, calibrated receipt, carrier/package, meter and destination records"
      raw_fields: "lot; real node order; leg/mode/provider/payer; distance; loaded tonnes/water/packages; shared/empty/return allocation; live departure/arrival/accepted count/size/condition; gross/tare/free-water exclusion; positive accepted net wet mass A; recipient/time/acceptance; actual carrier/property/unit/readings; freight; native service quantity/unit/users/scope; other outputs/stock/returns/waste; direct release mass/method or estimated release inputs/formula/factor/source; independent U evidence"
      collection_method: "Verify all legs and physical receipt independently of invoice; weigh accepted same-lot whole-live animals using calibrated equipment and documented noninjurious net-mass method excluding free/carrier water/tare, retaining native body water; reconcile all animals/water/packages/returns, native carrier/service quantities and destinations"
      unit: "kg for mass; actual carrier/service native units; tkm freight; h only timed services"
      frequency: "Every leg, custody event, exchange and accepted receipt lot"
      temporal_coverage: "All actual prereceipt movement through receipt and attributable cleanup, including failed/rejected loads"
      site_scope: "Actual transport route and first physical recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Physical custody/acceptance and live state; calibrated net mass/tare/native records; source ancestry; all route/return/destination/service evidence; raw release evidence type"
  calculation_rules:
    - id: normalize_receipt
      applies_to: "all inventory rows"
      rule: "For each instance, divide the attributable actual native-unit quantity by positive observed same-lot receipt mass A. Only live_octopus_received uses A/A = 1 kg per 1 kg reference flow. Nonfinal animal, water, package, stock and return quantities remain independently measured."
      inputs:
        - "Own-node protocol"
        - "actual quantity"
        - "attribution ledger"
        - A
        - cp_receipt
      output: "Native-unit exchange per 1 kg reference flow and traceable calculation"
      source_ids:
        - pcr-octopus-foreground-method
    - id: energy_instance
      applies_to: "energy rows"
      rule: "Retain each actual carrier exchange in its verified native property/unit: electricity kWh, fuel kg or m3, heat MJ when applicable; normalize that exchange by A. Optional auxiliary energy accounting may use 1 kWh = 3.6 MJ or measured fuel quantity times a documented carrier-specific energy factor, with formula, factor unit/source/version, observed inputs, coverage and uncertainty. Auxiliary MJ is not a replacement or additional exchange. Never infer carrier quantities from the route paper."
      inputs:
        - "Node native meter/carrier quantities"
        - "actual property/unit"
        - "optional auxiliary formula/factor/source"
        - "node protocol"
        - A
      output: "Native-carrier exchange per 1 kg reference flow and separately labelled auxiliary energy if used"
      source_ids:
        - pcr-octopus-foreground-method
    - id: release_instance
      applies_to: "elementary release rows"
      rule: "Preserve raw evidence type for each substance/receiving-medium instance. Direct measured original mass retains its method, instrument/calibration and uncertainty; only attribution and division by A are calculated, with no invented emission factor. Activity/factor or concentration/volume estimates retain observed inputs, explicit formula, compatible mass/substance basis and every factor/source actually used. Reconcile upstream/service coverage and measured retained/collected destinations; normalize once. Qualitative route, feed disappearance or gross water alone is not pollutant mass."
      inputs:
        - "Direct original measured mass/method or observed activity/concentration/water plus used formula/factor/source"
        - "substance and medium"
        - "node protocol"
        - A
      output: "Normalized release in kg per 1 kg reference flow with raw evidence type and uncertainty"
      source_ids:
        - pcr-octopus-foreground-method
    - id: freight_instance
      applies_to: "collect_delivery_freight"
      rule: "Attributable actual loaded tonnes × observed distance km for each real leg, with causal shared-load and empty/return-leg treatment documented; divide by A. Preserve actual carried water/package and animal loading records; never replace freight with animal mass alone."
      inputs:
        - Leg
        - "loaded tonnes"
        - "distance km"
        - "actual attribution and service coverage"
        - cp_receipt
        - A
      output: "tkm per 1 kg reference flow"
      source_ids:
        - pcr-octopus-foreground-method
    - id: stock_and_transfer
      applies_to: "all animal, feed, water, package and material ledgers"
      rule: "Reconcile opening stock plus actual receipts/production to actual outputs, returns, closing stocks, losses and measured/calculated transformation terms by period and native state/unit. Biological growth and water exchange are explicit terms, not unexplained mass creation. Pair internal transfers once; retain inherited burden in stock/return ledgers."
      inputs:
        - "Own-node source/stock/transfer/destination records"
        - "count/mass/state"
        - "actual transformation evidence"
      output: "Reconciled lot/period balances and burden carryover"
      source_ids:
        - pcr-octopus-foreground-method
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all actual exchanges"
      requirement: "Verify each concrete flow identity/property/unit against actual species/material/substance, origin, state, role, destination and gate; collection scopes are not final TIDAS exchanges."
      evidence: "Concrete identity confirmation, upstream scope and native-unit records"
    - id: quality_mass
      applies_to: "reference and animal transfers"
      requirement: "Require positive independent receipt mass A; preserve whole-live wet basis, native animal water, tare/free-water exclusion and actual count/size/condition; same-lot samples retain sampling design and uncertainty."
      evidence: "Calibrated noninjurious actual method; physical receipt and transfer records"
    - id: quality_complete
      applies_to: "all nodes/periods"
      requirement: "Complete full cohorts including failures, reproductive events, mortality, cleanup, replacement/termination, opening/closing stocks and all outputs/consumers; unknown states, quantities or destinations remain explicit gaps."
      evidence: "Period/event ledger, all intended and waste/environment destinations, service-life/user records"
    - id: quality_ranges
      applies_to: "all provisional ranges"
      requirement: "Treat symbolic U as unestablished provisional uncertainty; obtain independent bounds and report source, comparability and coverage before numerical use. Do not use a batch's own maximum as its guardrail."
      evidence: "Independent bound evidence and uncertainty derivation; no source-default quantities"
    - id: quality_calculations
      applies_to: "normalized carrier/releases/services"
      requirement: "Retain original native exchange property/unit and each actual instance's raw evidence. Direct measured releases retain mass/method/calibration; activity/factor estimates retain observed inputs, formula and used factors/sources. Auxiliary MJ never replaces/duplicates carrier exchanges; service hours apply only to timed use. Retain attribution, uncertainty and component coverage; route literature is not future amount evidence."
      evidence: "Node-specific audit trail, raw evidence type and complete/partial service inventory boundary"
    - id: collect_acquisition_materials
      applies_to: "acquisition; Inputs; Product flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual acquisition carrier water, protection materials and consumables, separate concrete instances. Record each actual water or protection-material supply and its stock/service coverage separately. <br> - Flow property / unit: Mass / kg <br> - Amount rule: Actual supplied mass by instance divided by A; include incoming reusable-item stock and upstream burdens once; cp_acquisition <br> - Value mode: Calculated value (calculated_value) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Calculated from collection (calculated_from_collection) <br> - Collection protocol: cp_acquisition <br> - Range: Provisional material uncertainty <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_acquisition_materials <br> - Unit: kg <br> - Basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: collect_acquisition_energy
      applies_to: "acquisition; Inputs; Product flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual acquisition fuel or electricity, separately specified by energy carrier. Record only evidenced acquisition carrier exchanges in their actual native properties and units. <br> - Flow property / unit: Carrier-native property / carrier-native unit <br> - Amount rule: Actual native electricity, fuel or heat quantity divided by A with verified per-instance property/unit; retain fuel mass/volume exchange and exclude complete-service coverage; auxiliary MJ accounting is separate and not another exchange; cp_acquisition <br> - Value mode: Calculated value (calculated_value) <br> - Specificity: Route-specific (route_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Calculated from collection (calculated_from_collection) <br> - Collection protocol: cp_acquisition <br> - Range: Provisional energy uncertainty <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_acquisition_energy <br> - Unit: carrier-native unit per concrete instance <br> - Basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
