allocation_rules:
  - rule_id: subdivide_first
    applies_to: "all shared burdens"
    rule: "First subdivide physically separable gear events, species-directed trips, node meters and independently supplied services using observed records. Do not allocate a common vessel trip twice as capture and a transport service."
    source_ids:
      - foreground-flatfish-method
  - rule_id: intended_output_set
    applies_to: "grade_other_intended_products; preserve_nonfood_sale; presentation_nonfood_sale"
    rule: "Enumerate all independent intended species/food-grade/non-food sale outputs and actual handover gates. For irreducible joint capture burdens, use an evidenced physical causal relationship where demonstrable; otherwise disclose an economic allocation using actual same-period ex-gate net revenues of every intended output. Record rationale, prices, quantities, uncertainty and mass-based sensitivity. Do not use economic allocation when causal subdivision is evidenced. Rejects, releases and waste are not intended sale outputs merely because they have mass; treatment burdens remain with generating operations and there are no automatic substitution credits."
    source_ids:
      - foreground-flatfish-method
  - rule_id: period_assets
    applies_to: "capture_assets; preserve_assets; presentation_returnable_assets"
    rule: "Index trips/campaigns, maintenance/idle periods, holding across cutoffs and final gate lots. Attribute assets by observed service/usage over declared build, operating, replacement and termination periods; disclose residual capacity and decommissioning. Link opening stocks to prior-period burdens and closing stocks to future outputs without charging both. Never assume a universal vessel, net or crate life."
    source_ids:
      - foreground-flatfish-method
  - rule_id: shared_consumers
    applies_to: "capture; grade; preserve; presentation"
    rule: "Keep a shared-asset/service ledger listing the vessel or site asset, every consuming node and period, measured causal driver and shares summing to one. Vessel manufacture/fuel have capture ownership; present their allocation across all fish sale outputs rather than booking a full asset in each downstream node. Shore shared assets and cleaning/changeover events use metered or causal usage; record any fallback and sensitivity explicitly. Never add both an external service and its complete resources."
    source_ids:
      - foreground-flatfish-method
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "Source-to-collected catch; one vessel or collector operating unit"
      record_type: "Measured records and supported derived quantities"
      raw_fields: "event_id; pass_id; trip/campaign; lot/transfer_id; species; gear; live/fresh/chilled condition; food eligibility; timestamp/gate; owner; raw amount/unit; opening/closing stock; destination; meter/tank; concentration/carbon/density factors and sources; share driver; final accepted net kg"
      collection_method: "Use calibrated mass measurements, paired handover records, meters/tank stock reconciliation and representative state-specific count/density samples. Identify every actual exchange in collection obligations in Section 8. Capture additionally logs effort/bottom contact/incidental catch/gear events; grade records every destination; preserve records intervention, mortality, water and refrigerant closure; presentation verifies calibrated final net mass excluding ice/water/packaging. Derived emissions retain independently evidenced composition/factor and calculation."
      unit: "kg; MJ"
      frequency: "Every event/transfer and meter interval; reconcile each trip/campaign and cutoff"
      temporal_coverage: "Complete declared reporting period, maintenance/idle events, opening/closing stocks and asset service phases"
      site_scope: "Only this real node within the declared single operating unit"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source documents; stock/transfer closure; factor provenance; independent samples; independent held-out campaign review for replacement of provisional screens"
    - protocol_id: cp_grade
      process_id: "grade"
      flow_role: "Complete destination partition; not a second capture operation"
      record_type: "Measured records and supported derived quantities"
      raw_fields: "event_id; pass_id; trip/campaign; lot/transfer_id; species; gear; live/fresh/chilled condition; food eligibility; timestamp/gate; owner; raw amount/unit; opening/closing stock; destination; meter/tank; concentration/carbon/density factors and sources; share driver; final accepted net kg"
      collection_method: "Use calibrated mass measurements, paired handover records, meters/tank stock reconciliation and representative state-specific count/density samples. Identify every actual exchange in collection obligations in Section 8. Capture additionally logs effort/bottom contact/incidental catch/gear events; grade records every destination; preserve records intervention, mortality, water and refrigerant closure; presentation verifies calibrated final net mass excluding ice/water/packaging. Derived emissions retain independently evidenced composition/factor and calculation."
      unit: "kg; MJ"
      frequency: "Every event/transfer and meter interval; reconcile each trip/campaign and cutoff"
      temporal_coverage: "Complete declared reporting period, maintenance/idle events, opening/closing stocks and asset service phases"
      site_scope: "Only this real node within the declared single operating unit"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source documents; stock/transfer closure; factor provenance; independent samples; independent held-out campaign review for replacement of provisional screens"
    - protocol_id: cp_preserve
      process_id: "preserve"
      flow_role: "Observed usable-state intervention with stock and losses"
      record_type: "Measured records and supported derived quantities"
      raw_fields: "event_id; pass_id; trip/campaign; lot/transfer_id; species; gear; live/fresh/chilled condition; food eligibility; timestamp/gate; owner; raw amount/unit; opening/closing stock; destination; meter/tank; concentration/carbon/density factors and sources; share driver; final accepted net kg  actual service provider/scope/functional unit/property/unitgroup and unresolved support; water/ice source/destination and paired ids; physical packaging dispatch/return/stock;"
      collection_method: "Use calibrated mass measurements, paired handover records, meters/tank stock reconciliation and representative state-specific count/density samples. Identify every actual exchange in collection obligations in Section 8. Capture additionally logs effort/bottom contact/incidental catch/gear events; grade records every destination; preserve records intervention, mortality, water and refrigerant closure; presentation verifies calibrated final net mass excluding ice/water/packaging. Derived emissions retain independently evidenced composition/factor and calculation."
      unit: "kg; MJ  collect each service separately in verified provider-native functional unit provider_service_unit, not material kg;"
      frequency: "Every event/transfer and meter interval; reconcile each trip/campaign and cutoff"
      temporal_coverage: "Complete declared reporting period, maintenance/idle events, opening/closing stocks and asset service phases"
      site_scope: "Only this real node within the declared single operating unit"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source documents; stock/transfer closure; factor provenance; independent samples; independent held-out campaign review for replacement of provisional screens"
    - protocol_id: cp_presentation
      process_id: "presentation"
      flow_role: "Actual final state and net fish acceptance at first producer gate"
      record_type: "Measured records and supported derived quantities"
      raw_fields: "event_id; pass_id; trip/campaign; lot/transfer_id; species; gear; live/fresh/chilled condition; food eligibility; timestamp/gate; owner; raw amount/unit; opening/closing stock; destination; meter/tank; concentration/carbon/density factors and sources; share driver; final accepted net kg  actual service provider/scope/functional unit/property/unitgroup and unresolved support; water/ice source/destination and paired ids; physical packaging dispatch/return/stock;"
      collection_method: "Use calibrated mass measurements, paired handover records, meters/tank stock reconciliation and representative state-specific count/density samples. Identify every actual exchange in collection obligations in Section 8. Capture additionally logs effort/bottom contact/incidental catch/gear events; grade records every destination; preserve records intervention, mortality, water and refrigerant closure; presentation verifies calibrated final net mass excluding ice/water/packaging. Derived emissions retain independently evidenced composition/factor and calculation."
      unit: "kg; MJ  collect each service separately in verified provider-native functional unit provider_service_unit, not material kg;"
      frequency: "Every event/transfer and meter interval; reconcile each trip/campaign and cutoff"
      temporal_coverage: "Complete declared reporting period, maintenance/idle events, opening/closing stocks and asset service phases"
      site_scope: "Only this real node within the declared single operating unit"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source documents; stock/transfer closure; factor provenance; independent samples; independent held-out campaign review for replacement of provisional screens"
  calculation_rules:
    - id: event_normalization
      applies_to: "all inventory rows"
      rule: "Keep two explicitly labelled views. First reconcile unallocated physical receipts, transfers, products, losses and stocks for the complete declared cohort/trip/run; pair internal transfers in the same state and unit, retaining their measured mass. Assign shared resource/service events to actual consuming nodes and periods once using evidenced service shares, without shrinking product, biomass, water or waste partitions by a co-product share. Divide this physical inventory by the matching positive accepted final net kg. Separately derive a labelled single-output LCA burden/inventory projection using section 7 co-product allocation exactly once, retaining the unallocated inventory and allocation matrix. Never test allocated exchanges against an unallocated physical balance, apply output shares again downstream, or set an internal quantity to the final 1 kg."
      inputs:
        - "event records"
        - "share drivers"
        - "final accepted net kg"
      output: "amount per 1 kg reference flow"
      source_ids:
        - foreground-flatfish-method
    - id: quantity_derivations
      applies_to: "water; exhaust; count-recorded biomass"
      rule: "Convert counts using measured matching species/state mass samples; convert volume with actual condition-specific density; derive actual emissions from documented fuel/carbon/oxidation or equipment factors and actual activity. Record every factor, source, unit, uncertainty and intermediate calculation; no numeric factor other than verified unit conversion is supplied by this PCR."
      inputs:
        - "matching samples"
        - "density/composition/factor evidence"
        - "actual activity"
      output: "traceable mass/energy/emission quantities"
      source_ids:
        - foreground-flatfish-method
    - id: conditional_interface_envelopes
      applies_to: "capture_internal_water_ice_receipt_water; capture_internal_water_ice_receipt_ice; capture_internal_water_ice_transfer_water; capture_internal_water_ice_transfer_ice; grade_internal_water_ice_receipt_water; grade_internal_water_ice_receipt_ice; grade_internal_water_ice_transfer_water; grade_internal_water_ice_transfer_ice; preserve_internal_water_ice_receipt_water; preserve_internal_water_ice_receipt_ice; preserve_internal_water_ice_transfer_water; preserve_internal_water_ice_transfer_ice; presentation_internal_water_ice_receipt_water; presentation_internal_water_ice_receipt_ice; presentation_water_ice_handover_water; presentation_water_ice_handover_ice; presentation_internal_water_ice_transfer_water; presentation_internal_water_ice_transfer_ice; grade_actual_water_evaporation; presentation_actual_water_evaporation; dq_complete_preserve_external_service; dq_complete_presentation_external_service; dq_complete_presentation_actual_source_water"
      rule: "For each listed atomic card, or each actual exchange required by a listed collection obligation, instantiate actual identity, state, node, pass and numerator unit before establishing U_row from the same-view normalized maximum of an independent representative campaign times a predeclared margin at least 1, or a matching-unit/basis supplier design envelope. Retain samples, source, basis and uncertainty; never use the target batch to establish its own upper bound. Unverified service unit/support or absent independent envelope remains an unresolved instance, not numeric QA-cleared or zero. Reconcile physical water/ice/packaging movements separately from service-share quantities."
      inputs:
        - "independent reference records"
        - "actual unit and basis"
      output: "U_row"
      source_ids:
        - foreground-flatfish-method
