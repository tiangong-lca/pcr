validation_rules:
  - rule_id: v_scope
    applies_to: "reference product"
    rule: "Reject final lots that are not verified wild whole unheaded ungutted food flatfish at the first producer handover. Declare actual species/taxonomy, waterbody/marine-inland origin, gear, food grade, live/fresh/chilled state, intervention, time, actual gate and stock period. CPC04231 is only narrower mapping context, not proof of full code coverage."
    source_ids:
      - un-cpc3-flatfish
      - foreground-flatfish-method
  - rule_id: v_state
    applies_to: "all transfers"
    rule: "Test capture -> pre-sort onboard chill -> landing grade -> dispatch; direct live/fresh capture -> grade -> dispatch; and post-grade preservation, including both-pass cases with unique pass ids. Match every actual transfer/state/quantity and same-state absent-pass bypass. Pre-sort output is not automatically food-qualified. Already fresh fish needs no invented kill; live output excludes dead fish. Dead fish needs independent fresh/chilled food acceptance or reject fate. No duplicated intermediate output, resource, mortality or stock between passes; internal feed is measured, never fixed to final one kg."
    source_ids:
      - foreground-flatfish-method
  - rule_id: v_complete
    applies_to: "all nodes"
    rule: "Close species/body-mass partitions, intended outputs, releases/discards/waste, water and pollutants, fuel, gear, refrigerant and packaging stocks within documented measurement uncertainty. Retain bottom-contact/entanglement/incidental-catch condition and effort evidence even where no characterized LCA factor exists; missing characterization is disclosed, not reported as zero ecological impact."
    source_ids:
      - foreground-flatfish-method
  - rule_id: v_range
    applies_to: "all flow cards"
    rule: "Every Range is an explicit provisional screening envelope unless it is the exact final reference quantity. Non-reference envelopes are not allowed ranges, site observations, default inventory values or evidence of plausibility. A value outside the envelope triggers investigation, not clipping; a value inside does not validate the batch. Replace provisional screens with independently held-out reviewed campaign evidence before quantitative reuse, without using the evaluated batch maximum as its own guardrail."
    source_ids:
      - foreground-flatfish-method
  - rule_id: v_identity
    applies_to: "all exchange identities"
    rule: "Resolve each actual collection scope exchange to one verified compatible flow before downstream exchange publication. Verify direction/type, substance or product state, property/unit, geography, technology and destination independently. No UUID observation establishes an amount or emission factor. Unverified oxygen, fuel, final fish, wastes and emissions remain unresolved; do not relabel a narrower freshwater diesel or factory oxygen reference."
    source_ids:
      - foreground-flatfish-method
  - rule_id: v_attribution
    applies_to: "all periods and outputs"
    rule: "Reconcile every intended output and revenue/physical driver across the same system period, every shared-consumer share and opening/closing stock burden. Check that outbound/return effort, onboard preservation energy, manufactured/purchased ice, purchased services and direct emissions are counted once. Missing route-specific effort, release condition, stock fate or allocation evidence prevents a complete foreground package. Check the at-sea gate case explicitly: separate product custody from completed producer return-service accounting, with return burdens assigned once without moving the product gate."
    source_ids:
      - foreground-flatfish-method
  - rule_id: validate_inventory_completion
    applies_to: "all concrete exchanges and section 8 completion obligations"
    rule: "Verify each applicable dq_complete obligation has separately measured and identity-verified exchange cards. Check each quantity, native unit, range evidence, normalization, receiving medium, destination and non-duplication. Any unfulfilled actual child exchange, quantity, identity or destination makes the final dataset incomplete and fails validation; unknown cannot be zero. Static PCR checking does not replace this evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual declared whole wild food flatfish species/state/gate context with verified exchanges and foreground amounts"
  excluded_use: "Whole-code automatic coverage; farmed/non-food/processed fish; fillet/edible yield conversion; sustainability or legal certification; universal fishery or ecological-impact claim"
  required_metadata: "Species; wild waterbody; actual technology and effort; operation owner; gate/time/state/food grade; lot and stock periods; preserved or bypassed route; every intended output; assets, services and allocation"
  required_quality_disclosure: "Measurement coverage, unverified identities, unresolved stock/route/food acceptance, provisional screening evidence, allocation sensitivity and uncharacterized ecological effects; no food-safety certification"
  update_trigger: "Changed species/state/gate, gear or effort, boundary ownership, utility/asset service, allocation, factors or independent quantitative evidence"
data_sources:
