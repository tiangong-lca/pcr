  classification_refs: "CPC 3.0 04231; narrower"
  covered_products: "Whole wild food flatfish with actual species, grade and live/fresh/chilled state at first producer handover"
  excluded_products: "Farmed fish; non-food seed/feed/ornamental products; headed/gutted fish; detached parts/fillets/meat/roe; frozen/cooked/processed fish"
  representative_product: "One declared species/state lot of whole wild food flatfish, without a universal species example or conversion"
  production_route: "Independent capture parent with evidenced gear deltas -> actual pre-sort preservation or bypass -> grade -> actual post-grade preservation or bypass -> presentation"
  market_state: "Actual live, fresh or chilled whole food fish; different states remain separate lots"
functional_unit:
  what: "Accepted whole wild food flatfish at actual first producer handover"
  how_much: "1 kg"
  how_well: "Food acceptance evidenced; actual species, state and grade; unheaded and ungutted; exclude extraneous water, ice and packaging"
  how_long_or_cycle: "One declared gate lot traced to trip/campaign, maintenance/idle periods, opening/closing stocks and asset service periods"
  reference_flow_link: "whole_flatfish_handover"
system_boundary:
  rules:
    - rule_id: capture_primary
      applies_to: "capture; grade; preserve; presentation"
      rule: "This record starts with wild resource removal by the declared single operating unit, includes upstream burdens for purchased inputs and attributed assets, and ends at the actual first producer or collector handover. Natural reproduction is not a zero-priced hatchery operation. Purchased same-category fish already beyond its first producer gate is outside the reference route; actual purchased bait retains separately identified supplier capture and preservation burdens and is not this lot's own catch."
      source_ids:
        - foreground-flatfish-method
    - rule_id: state_chain
      applies_to: "all lots"
      rule: "Every transfer retains species, observed live/fresh/chilled state, time, net mass, lot and pass id. Pre-sort preservation routes captured_unsorted through preserve_unsorted_in/preserved_unsorted to grade_catch_in; absence uses the direct same-state capture-to-grade edge. Post-grade preservation routes graded_food through preserve_fish_in/preserved_food to presentation_fish_in; absence uses the direct same-state grade-to-presentation edge regardless of earlier preservation. One pass produces one corresponding output; the two passes are not rework of the same completed output. Assign all intervention, mortality, water/ice stocks and losses to actual pass records, with capture-owned onboard fuel recorded once. Unknown sequence, state or food eligibility blocks finalization."
      source_ids:
        - foreground-flatfish-method
    - rule_id: gear_delta
      applies_to: "capture"
      rule: "Declare bottom trawl, stationary/pound/gillnet, line or another evidenced technique as a capture-parent delta. Trawl records require bottom-contact track, duration, gear geometry and seabed context; passive nets require deployed area/length, soak and retrieval; lines require hook effort and actual bait. Multiple gears may coexist only as separate logged events; one event cannot be classified as two competing routes. Preserve current site evidence instead of extrapolating US summer-flounder performance, regulation or stock status to all flatfish."
      source_ids:
        - noaa-summer-flounder
        - foreground-flatfish-method
    - rule_id: pre_gate_responsibility
      applies_to: "all nodes"
      rule: "All producer-owned activity actually before the first gate is included, including pre-gate shore movement, cleaning and bounded holding. Consumer distribution, filleting, heading/gutting, freezing, managed grow-out, seed/feed/ornamental final use and processing are outside the covered final product. A transshipment gate is the gate if that is the first actual producer handover; do not automatically add a later port stage. Distinguish product custody gate from resource/service accounting-period closure: an at-sea first gate is not moved to port, but actual trip-period ledgers assign necessary producer return-to-base, idling and return-cycle preparation once, with actual closure time and evidenced shares for other trips. Exclude buyer distribution and later unrelated capture; never charge the same return again to the next campaign."
      source_ids:
        - foreground-flatfish-method
    - rule_id: ownership_closure
      applies_to: "all nodes"
      rule: "Assign one owner to vessel fuel, shore utilities, shared service events, external water, natural abstraction, ice manufacture, wastewater treatment and gear events. Vessel fuel in capture includes onboard preservation power; own ice inputs replace purchased ice production. External treatment/service inputs carry provider resources, not duplicated direct provider emissions. Track opening/closing fish, water, fuel, gear, refrigerant and reusable-container stocks."
      source_ids:
        - foreground-flatfish-method
boundary_abstraction:
  declared_starting_condition: "Wild population and actual capture effort at a named waterbody; owned assets and purchased input upstream burdens included"
  starting_condition_role: "Natural resource-to-catch foreground start, not managed biological production"
  product_classification_scope: "CPC 3.0 04231 narrower whole-food first-gate methodology"
  recursive_input_rule: "Purchased whole fish already past a first producer handover is outside this reference route and cannot be recursively relabelled own capture. Same-category fish purchased as bait is a separately identified supplier input with actual upstream capture and preservation burdens, not this reference product."
  upstream_dataset_requirement: "Compatible product supply state, location, technology and period for each purchased input or service; disclose omissions and substitutions"
  disclosure: "Actual gate and ownership; capture technique/habitat; all active nodes and bypasses; state/stock transitions; asset periods; joint outputs and allocation; quantified evidence gaps"
