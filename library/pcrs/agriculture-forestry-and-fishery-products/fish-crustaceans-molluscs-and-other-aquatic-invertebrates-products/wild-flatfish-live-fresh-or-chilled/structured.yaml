measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh accepted net whole fish using a calibrated scale at the actual gate; exclude packaging, ice and extraneous water, not native organs or natural retained body fluids. Counts require same-species/state/grade measured samples, not a generic edible yield."
  - id: energy_units
    applies_to: "electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve meter kWh and convert with 1 kWh = 3.6 MJ using the energy unit group; no kg conversion and no inferred fuel heating value."
  - id: water_mass
    applies_to: "water and effluent rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use direct mass or actual density with measured temperature/salinity for volume records; never force seawater, saline effluent or oxygen volume to water density."
