measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated, humane tared/drained batch weighing at dispatch, excluding free water and packaging; document method and uncertainty in cp_stock_managed_rearing; cp_stock_farm_harvest; cp_stock_live_conditioning; cp_stock_farm_dispatch."
  - id: count_conversion
    applies_to: "seed_stock; broodstock; market_ready_stock; harvest_stock; harvested_live_lot; conditioning_stock; graded_live_stock; conditioning_returns; other_live_sales; packing_stock; farmed_ornamental_dispatch"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Retain counts and grades as auxiliary records. Count-to-mass conversion requires a representative measured same-species/stage/grade lot; record sampling, mean net mass and uncertainty. No universal individual fish weight or count-only kg substitution."
  - id: energy_conversion
    applies_to: "all electricity rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "kWh"
    rule: "Preserve metered kWh and energy support identity; if a downstream representation uses MJ apply 3.6 MJ per kWh once. Fuel mass requires actual fuel calorific evidence before energy conversion."
  - id: material_basis
    applies_to: "rearing_feed; harvest_bait; conditioning_feed; rearing_treatments; conditioning_treatments; packing_additives"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record feed as-received and dry matter separately; medicines/additives as formulated product and active ingredient separately with composition. Do not substitute nutrient/active mass for purchased product mass."
  - id: water_basis
    applies_to: "all water rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Meter or weigh external water by source; volumetric readings require recorded density/temperature and salinity conversion to kg. Internal recirculation and reused pond water are transfer logs, not repeated fresh supply."
  - id: stock_basis
    applies_to: "all fish rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Separate opening/closing fish stock, retained breeders, measured growth, harvest withdrawals, returned juveniles, deaths, escapes and sales by stage. Growth is not purchased fish input; internal transfer amounts are measured and are not fixed to final reference mass."
