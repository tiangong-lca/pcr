    - id: dq_atomic_card_identity
      applies_to: "all inventory rows"
      requirement: "Each card represents one physically identified exchange, not a collection or selector. Keep Electricity as one electrical-energy flow; supplier, geography and voltage remain actual collected qualifiers, not grounds for speculative splitting. Other actual materials, waste streams, carbon origins and receiving media must have separate identities and atomic cards before completion. Preserve every existing collection obligation; an absent card or unresolved identity never means zero or a waived exchange. Paired internal water transfers retain the same actual quality, transfer id, quantity and upstream burden, without another purchase."
      evidence: "Per-card identity, provider, state, destination and paired records"
    - id: dq_atomic_range_evidence
      applies_to: "repaired atomic flow cards"
      requirement: "U_row is an unresolved evidence requirement, not a numerical estimate, default, clipping limit or completeness pass. Establish each card's own matching-unit/reference-basis upper envelope from independent representative records or a compatible documented supplier/design bound, retaining scope, method and uncertainty. Do not reuse a removed aggregate range, copy a sibling quantity, derive a bound from the target batch itself or invent a value. Applicable missing evidence blocks quantitative QA completion; actual measurements remain required."
      evidence: "Independent envelope evidence; retained raw records and uncertainty"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Require managed farmed origin, ornamental live finfish purpose, species, grade and actual farm dispatch gate; reject wild-holding, food/non-fish or preserved output substitution."
    source_ids:
      - un-cpc30-ornamental
  - rule_id: validate_reference
    applies_to: "farmed_ornamental_dispatch"
    rule: "Exactly one final output row links to the reference; 1 kg is net live biomass and count/grade/health qualifiers are present. No intermediary, breeder or water/package mass substitutes for the reference."
    source_ids:
      - reference-definition
  - rule_id: validate_route
    applies_to: "managed_rearing"
    rule: "Require current site/circuit evidence for pond/tank/RAS, seed/breeder origin and biological/technology delta. Reject label-only alternatives, incompatible once-through/recirculating claims for the same circuit/time, or absent heating/treatment/solids evidence when actually used."
    source_ids:
      - uf-ifas-ras-fa099
  - rule_id: validate_transfer
    applies_to: "all fish rows"
    rule: "Match internal transfers and returns with lot/time/stage and measured quantities; cancel their aggregate exchanges. Reconcile stock with observed growth and all harvests, losses, returns and retained breeders."
    source_ids: []
  - rule_id: validate_inventory
    applies_to: "all nodes"
    rule: "Require actual seed/feed upstream burdens, water/source and circuit records, power/fuel/heat, assets, treatment use and losses. Fuel rows require matching actual combustion substances and evidence; direct discharge requires water medium and monitored actual substance/speciation or an explicit data gap."
    source_ids: []
  - rule_id: validate_mode_period
    applies_to: "all nodes"
    rule: "Verify cohort/continuous indexing, opening/closing and retained stock, breeding and asset phases, cleaning/changeover, replacement/termination and linked period shares; unresolved attribution blocks final dataset production."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "all intended outputs and shared consumers"
    rule: "Enumerate all sold species/grades with actual handovers and method evidence. Confirm direct assignment then disclosed causal/economic residual, stock carrying and shared asset/meter shares; no duplicated burden or presumed co-product credit."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all flow cards"
    rule: "Fixed UUIDs must match independently verified actual type, property/unit, stage/gate, geography/provider and destination. Final farm-gate UUID does not identify juveniles, breeders or preharvest stock; CN low-voltage identity cannot cover an unspecified power supply, and ambiguous oxygen is unresolved."
    source_ids: []
  - rule_id: validate_evidence
    applies_to: "all ranges and treatments"
    rule: "Keep provisional estimates distinct from collected amounts and source evidence; zero conditional exchanges require actual absence records. Require relevant current treatment authorization when actual use calls for it; no historic dose/legal statement is endorsed."
    source_ids: []
  - rule_id: validate_profile
    applies_to: "downstream dataset"
    rule: "Declare all required qualifiers, uncertainty, cut-offs, upstream/identity/monitoring gaps and matched gate/time. Technical checks alone do not verify a concrete exchange, actual farm balance or publication readiness."
    source_ids: []
  - rule_id: validate_inventory_completion
    applies_to: "all concrete exchanges and section 8 completion obligations"
    rule: "Verify each applicable dq_complete obligation has separately measured and identity-verified exchange cards. Check each quantity, native unit, range evidence, normalization, receiving medium, destination and non-duplication. Any unfulfilled actual child exchange, quantity, identity or destination makes the final dataset incomplete and fails validation; unknown cannot be zero. Static PCR checking does not replace this evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset; secondary_dataset; background_dataset"
  downstream_use: "Foreground farm-production package and its downstream process/lifecyclemodel projections for the declared species, grade, route, period and gate"
  allowed_use: "Supply of live farmed ornamental finfish through the recorded farm dispatch, with compatible provider/geography/state and disclosed stock/asset attribution"
  excluded_use: "Wild-held fish, food/stocking/bait products, ornamental non-fish, aquarium/retail display use, downstream distribution survival or processing, unsupported species/grade service equivalence, inferred regulatory compliance"
  required_metadata: "All reference qualifiers; node/circuit/cohort ids; actual suppliers and receivers; dates/gate; output/stock sets; route deltas; allocation and carried-period/asset ledger; concrete exchange verification"
  required_quality_disclosure: "Measurement/calibration and conversion uncertainty; representativeness; cut-offs; upstream gaps; unresolved identities/monitoring/speciation; allocation sensitivity; range evidence status"
  update_trigger: "Changed species/grade, breeding/seed supplier, route or circuit, stock/survival, feed, water source/treatment, power/heat/provider, shared asset/replacement, reporting mode or actual handover gate"
data_sources:
  - id: "un-cpc30-ornamental"
    type: "official_guidance"
    reference: "United Nations, CPC Version 3.0 Explanatory Notes, 30 June 2025, p.40: https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf; retrieved 2026-10-09"
    used_for: "Farmed live ornamental finfish category and exclusion context; not process quantities"
  - id: "uf-ifas-harvest-fa117"
    type: "extension_guidance"
    reference: "UF/IFAS, Harvesting Ornamental Fish From Ponds, FA117: https://ask.ifas.ufl.edu/publication/FA117; retrieved 2026-10-09"
    used_for: "Qualitative harvest responsibility and partial/batch harvest context; no transferred default yields"
  - id: "uf-ifas-grading-fa118"
    type: "extension_guidance"
    reference: "UF/IFAS, Grading Ornamental Fish, FA118: https://ask.ifas.ufl.edu/publication/FA118; retrieved 2026-10-09"
    used_for: "Qualitative grade, sale/keeper/cull distinction"
  - id: "uf-ifas-onfarm-transport-fa119"
    type: "extension_guidance"
    reference: "UF/IFAS, On-Farm Transport of Ornamental Fish, FA119: https://ask.ifas.ufl.edu/publication/FA119; retrieved 2026-10-09"
    used_for: "Qualitative internal transfer water, containers and oxygen/transport responsibilities"
  - id: "uf-ifas-shipping-fa120"
    type: "extension_guidance"
    reference: "UF/IFAS, Preparation of Ornamental Fish for Shipping, FA120: https://ask.ifas.ufl.edu/publication/FA120; retrieved 2026-10-09"
    used_for: "Qualitative holding/packing and actual handover responsibilities only; no prescribed doses, current law or thermal performance factors"
  - id: "uf-ifas-ras-fa099"
    type: "extension_guidance"
    reference: "UF/IFAS, Fish Health Management Considerations in Recirculating Aquaculture Systems—Part 1, FA099: https://ask.ifas.ufl.edu/publication/FA099; retrieved 2026-10-09"
    used_for: "Qualitative breeding/grow-out/holding and water-reuse/filtration differences; actual site evidence determines concrete topology"
  - id: "reference-definition"
    type: "method_factor"
    reference: "This PCR, sections 3, 4 and 8: declared 1 kg net live farm-dispatch reference"
    used_for: "Reference quantity 1–1 kg and normalization definition, not a biological performance range"
  - id: "ghg-product-standard"
    type: "standard"
    reference: "GHG Protocol, Product Life Cycle Accounting and Reporting Standard, chapter 9: https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf; retrieved 2026-10-09"
    used_for: "Method policy for subdivision and causal allocation with economic fallback; no performance factors"
