allocation_rules:
  - rule_id: allocation_precedence
    applies_to: "all nodes"
    rule: "First subdivide traceable species/cohort/grade processes and directly assign identifiable inputs. For remaining shared burdens use a documented causal driver (metered energy, occupied tank-volume-time or recorded service use); where causality cannot be established disclose economic allocation using contemporaneous species/grade sales values and sensitivity. Record chosen method, output set, prices/driver and total-share reconciliation. No universal default fraction or automatic substitution credit."
    source_ids:
      - ghg-product-standard
  - rule_id: allocation_outputs
    applies_to: "live_conditioning; farm_dispatch"
    rule: "Enumerate every independently sold species/grade and its actual buyer-purpose/gate. Allocate joint upstream burdens across the complete intended output set before reference normalization. Internal market-ready, harvested and graded stock are transfers, not three credited final products. Deaths/culls/sludge are wastes unless an evidenced independent product review says otherwise; retain their burdens with successful production."
    source_ids: []
  - rule_id: allocation_stock_period
    applies_to: "managed_rearing; all fish rows"
    rule: "Declare opening/closing nursery/grow-out stocks and breeders, source periods and every partial harvest. Carry accumulated burdens with retained and returned live fish to their next period; disclose recorded growth and stage transitions rather than using a closed-mass assumption for growing biomass. Breeder establishment/replacement burden is apportioned over documented reproductive service periods and offspring, with revision for early termination. No closing-stock sale credit or repeated purchase charge."
    source_ids: []
  - rule_id: allocation_mode
    applies_to: "all nodes"
    rule: "For batch production link stocking, harvest, cleaning and changeover to cohort. For continuous ponds/circuits link resource meters to bounded periods and harvest events, retaining overlapping age classes and standing stock. Attribute idle/start-up/maintenance and end-of-cycle cleaning with disclosed causal service evidence; reconcile once across all beneficiaries and periods."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "all nodes"
    rule: "Maintain a shared asset/service ledger naming pond/tank, building, pump/biofilter, gear, vehicle or reusable box and all consuming nodes/periods. Attribute actual material, replacement, cleaning and operating burdens by documented service use; separate capital material from metered energy. A shared meter total is divided once, never copied at each consumer. Record lifetimes/reuse counts from actual maintenance, replacement and termination evidence, not a universal amortization period."
    source_ids: []
  - rule_id: allocation_water
    applies_to: "all water rows"
    rule: "Attribute external water and water-system inputs once at source entry; internal reuse/return does not generate another supplier burden. Partition discharged, evaporated, retained, treated and shipped water by recorded destination and period. Treatment inputs and outputs are included once, with actual stage handoffs; no double charge for treatment service plus complete duplicate treatment operation."
    source_ids: []
