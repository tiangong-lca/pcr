  calculation_rules:
    - id: collected_period_attribution
      applies_to: "all inventory rows"
      rule: "Retain measured run/period totals, assign documented direct/shared output and period shares under section 7, then divide the assigned amount by accepted final net live biomass of that output lot in kg; report each exchange per 1 kg reference flow. Reference output is 1 kg by definition. Internal stocks remain measured transfers, with carried burdens rather than output credits."
      inputs:
        - cp_stock_managed_rearing
        - cp_stock_farm_harvest
        - cp_stock_live_conditioning
        - cp_stock_farm_dispatch
        - "applicable resource protocol"
        - "allocation evidence"
      output: "Quantity per 1 kg reference flow with raw-total audit trail"
      source_ids:
        - reference-definition
    - id: stock_reconciliation
      applies_to: "all fish rows"
      rule: "Reconcile opening stock plus external arrivals, actual births/growth and internal returns against harvest/sale, deaths/culls, escapes and closing stock by species/stage. Count and biomass ledgers disclose their differing growth/conversion uncertainty; unexplained imbalance requires review."
      inputs:
        - cp_stock_managed_rearing
        - cp_stock_farm_harvest
        - cp_stock_live_conditioning
        - cp_stock_farm_dispatch
        - cp_sales_live_conditioning
        - cp_sales_farm_dispatch
        - cp_waste_managed_rearing
        - cp_waste_farm_harvest
        - cp_waste_live_conditioning
        - cp_waste_farm_dispatch
      output: "Reconciled cohort/period stock and retained burden ledger"
      source_ids: []
    - id: water_reconciliation
      applies_to: "all water rows"
      rule: "Balance external supply and abstraction against evaporation, storage change, direct release, treatment outflow and water shipped across gate. Internal circuit flows cancel; record actual density and routing, and keep substance loads separate from carrier mass."
      inputs:
        - cp_water_managed_rearing
        - cp_water_farm_harvest
        - cp_water_live_conditioning
        - cp_water_farm_dispatch
        - cp_energy_managed_rearing
        - cp_energy_farm_harvest
        - cp_energy_live_conditioning
        - cp_energy_farm_dispatch
        - cp_emissions_managed_rearing
        - cp_emissions_farm_harvest
        - cp_emissions_live_conditioning
        - cp_emissions_farm_dispatch
      output: "Reconciled circuit-period water and substance records"
      source_ids: []
    - id: asset_share
      applies_to: "dq_complete_rearing_assets; dq_complete_harvest_gear; dq_complete_packing_materials"
      rule: "Allocate actual asset material and replacement/cleaning burdens over evidenced service periods and consumers using documented use/occupancy; include disposal/replacement once. Reconcile all shares to the attributed total and update after early retirement."
      inputs:
        - cp_assets_managed_rearing
        - cp_assets_farm_harvest
        - cp_assets_live_conditioning
        - cp_assets_farm_dispatch
        - cp_dispatch
        - "service/period evidence"
      output: "Attributed asset quantity per 1 kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "all exchanges"
      requirement: "Resolve each actual material/service/substance, property, unit, state/gate, provider/geography and destination independently. collection scope identities and missing monitoring are explicit gaps, not concrete TIDAS exchanges."
      evidence: "Detail verification and actual supplier/receiver records"
    - id: temporal_quality
      applies_to: "all nodes"
      requirement: "Cover breeding/nursery/grow-out, successive harvests, conditioning, dispatch and retained-stock/asset periods with coherent event ids; record missing and sampled periods."
      evidence: "Cohort/circuit/period ledger"
    - id: measurement_quality
      applies_to: "all quantities"
      requirement: "Calibrated meters/scales, taring and humane fish weighing; count-to-mass sample evidence, unit/density/composition basis and detection limits retained."
      evidence: "Protocol evidence and uncertainty records"
    - id: completeness_quality
      applies_to: "all resources and losses"
      requirement: "Record major feed/live feed, supplied/abstracted water, energy/heat, actual treatments, assets, standing stock, mortality, sludge, emissions and all intended outputs; document zeros, cut-offs and upstream gaps."
      evidence: "Resource/output balance and upstream linkage"
    - id: screening_quality
      applies_to: "all ranges"
      requirement: "Provisional 0-to-broad-upper ranges are replaceable reasoned screening estimates, not empirical performance, compliance limits or substitute values. A value outside the screen triggers evidence review, never clipping or omission. Replace with reviewed site or source evidence where available."
      evidence: "Raw value and reviewer explanation; source or collection evidence"
    - id: dq_inventory_completion
      applies_to: "all inventory-completion requirements"
      requirement: "Create a separate card for every actual physical or chemical exchange, with process, direction, flow type, its own measured quantity, native unit, final-reference normalization, applicability, destination, UUID and independent range evidence. Never copy a family total, a grouped screening range or one UUID onto every child. Use not_applicable only for evidenced absence; unknown is not zero. Any unfulfilled applicable obligation makes the final dataset incomplete and fails validation."
      evidence: "per-flow coverage ledger, raw measurements, identity, fate and range evidence"
    - id: dq_complete_rearing_feed
      applies_to: "managed_rearing; inputs; product"
      requirement: "Identify and separately collect every actual exchange covered by “Actual prepared or live rearing feed”; retain all following collection, quantity and normalization obligations: Split actual prepared feed, externally sourced live feed and on-site live-feed production by composition/provider. Record delivered/used/residual feed and as-received/dry basis; natural pond food is disclosed, not fabricated purchased feed. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Measured attributable kg from cp_rearing; apply collected-period attribution per 1 kg reference flow Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_rearing Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_rearing_fuel
      applies_to: "managed_rearing; inputs; product"
      requirement: "Identify and separately collect every actual exchange covered by “Actual on-site rearing fuel”; retain all following collection, quantity and normalization obligations: Conditional actual boilers/generators: record exact fuel, consumed mass, equipment and calorific evidence; include matched air emission rows. Purchased heat instead requires its separate supplier energy exchange, not an invented fuel. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Measured attributable kg from cp_energy_managed_rearing; apply collected-period attribution per 1 kg reference flow Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_energy_managed_rearing Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
      evidence: "per-flow original records under the linked protocol, identity and destination evidence"
    - id: dq_complete_rearing_treatments
      applies_to: "managed_rearing; inputs; product"
      requirement: "Identify and separately collect every actual exchange covered by “Actual rearing, quarantine and circuit-cleaning materials”; retain all following collection, quantity and normalization obligations: Conditional actual salts, disinfectants, veterinary products, filter media or water adjustments: split concrete product/composition and purpose. Record current local authorization where relevant and discharge/residue fate; no prescribed chemical regimen. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Measured attributable kg from cp_materials_managed_rearing; apply collected-period attribution per 1 kg reference flow Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_materials_managed_rearing Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
