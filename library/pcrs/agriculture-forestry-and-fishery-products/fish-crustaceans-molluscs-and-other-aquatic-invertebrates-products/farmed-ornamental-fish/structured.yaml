system_boundary:
  rules:
    - rule_id: boundary_managed
      applies_to: "managed_rearing"
      rule: "Include breeding/nursery where on-site, retained broodstock, grow-out, feeding, water supply, pump/aerator/biofilter/heating operation, cleaning, quarantine, actual treatments, mortality and removed solids. Separate source supply from environmental abstraction."
      source_ids:
        - uf-ifas-ras-fa099
    - rule_id: boundary_harvest
      applies_to: "farm_harvest"
      rule: "Harvest removes the measured sale-bound stock from its pond/tank production context. Include actual trap/seine/bait, pump-down, containers and on-farm transport to conditioning, with transport water/oxygen/energy and losses. This responsibility is separate from biological growth and post-harvest stabilization."
      source_ids:
        - uf-ifas-harvest-fa117
        - uf-ifas-onfarm-transport-fa119
    - rule_id: boundary_conditioning
      applies_to: "live_conditioning"
      rule: "Stabilize the harvested live lot and grade to actual buyer requirements; record accepted, other sold grades, live returns and mortality. Record actual holding feed/water/oxygen/energy and any treatments; no mandatory therapy is inferred from older guidance."
      source_ids:
        - uf-ifas-grading-fa118
        - uf-ifas-shipping-fa120
    - rule_id: boundary_dispatch
      applies_to: "farm_dispatch"
      rule: "Include actual farm-side preparation/packing and accepted live output handover. Without bags/boxes, record bulk live handover with packaging amounts zero by evidence. Include carrier water and other packing inputs separately; downstream transport, retail/display and aquarium use lie beyond this gate."
      source_ids:
        - uf-ifas-shipping-fa120
    - rule_id: boundary_water
      applies_to: "all nodes"
      rule: "Record external supplied water and natural abstraction once at entry. Log recirculated water, routed internal transfers, evaporation, water sent with fish, treatment outflow and direct discharge to close circuit/period water balances. A wastewater-to-treatment row is a waste exchange; direct environmental release is elementary, with actual receiving compartment and separately monitored substances."
      source_ids:
        - uf-ifas-ras-fa099
    - rule_id: boundary_emissions
      applies_to: "all nodes"
      rule: "Include actual on-site fuel combustion and monitored/reliably modelled substance-specific air emissions with fuel/engine/factor evidence; purchased heat is a supplier service, not duplicate on-site combustion. Direct water releases require real substance/speciation, measured concentrations/flow and receiving medium; total N/P or COD alone does not establish an elementary substance UUID."
      source_ids: []
    - rule_id: boundary_period_asset
      applies_to: "all nodes"
      rule: "Include or explicitly justify any capital cut-off. Identify ponds/tanks, buildings, pumps, biofilters, nets, graders, vehicles and reusable transport boxes by asset/service period and every consumer. Retain prior-period stock and asset burdens, start-up/cleaning, replacement and termination events, without charging the same item in each node."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Recorded purchased broodstock/juveniles or on-farm breeding/nursery, with opening standing stock and its carried production burdens"
  starting_condition_role: "Managed biological production starting condition with explicit supplier or prior-period linkage"
  product_classification_scope: "Farmed ornamental live finfish through actual farm dispatch"
  recursive_input_rule: "Same-category purchased stock remains an input at its actual life stage and supplier gate; link evidenced upstream breeding/nursery production once; retain missing supplier burdens as disclosed gaps"
  upstream_dataset_requirement: "Supplier primary activity or compatible upstream datasets for seed/broodstock, feed/live feed, energy, supplied water, actual materials and capital/replacement items; on-site feed production must include its own materials/energy"
  disclosure: "Declare farm topology, species/stages, stock origin, reporting and carried periods, harvest events, shared circuits/assets, treatments, output purposes and all unresolved data/identity gaps"
