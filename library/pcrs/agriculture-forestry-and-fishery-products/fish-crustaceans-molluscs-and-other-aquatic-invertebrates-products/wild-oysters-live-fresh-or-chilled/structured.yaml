system_boundary:
  rules:
    - rule_id: scope_provenance
      applies_to: "capture selection"
      rule: "Establish natural cohort origin and site history positively; public fishery designation is insufficient because public bars can be planted. Exclude deliberate seeded/relaid/enhanced cohorts pending separate review. Review attributable historical habitat interventions without silently assigning zero."
      source_ids:
        - maryland-oyster-landings
        - noaa-eastern-oyster
    - rule_id: whole_trip_gate
      applies_to: "all nodes"
      rule: "Include outbound travel, search/tonging, unsuccessful trips, return, landing and necessary pre-gate shore support through first physical recipient acceptance; stop before recipient depuration, opening and processing. Invoice/title alone does not determine the gate."
      source_ids: []
    - rule_id: conditional_interfaces
      applies_to: "condition, sort, preserve, accept"
      rule: "Record transfer ids and actual event order; no invented serial sequence. Preservation can start at capture and overlap sorting or presentation. Each event/resource has one owner. Cleaning only activates for actual animal cleaning/preparation; equipment-only cleaning leaves animals on bypass and belongs to its operating node."
      source_ids: []
    - rule_id: support_boundary
      applies_to: "shared vessel, gear and shore support"
      rule: "Record asset/service coverage, consuming nodes and periods. Account for fuels, electricity, water, consumables, maintenance, repair, acquisition and retirement where attributable. Choose inclusive purchased service or its covered direct resources/emissions/capital once; add only demonstrably uncovered parts."
      source_ids: []
