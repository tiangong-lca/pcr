allocation_rules:
  - rule_id: reconcile_before_attribute
    applies_to: "all nodes/trips"
    rule: "Reconcile physical inputs, transfers, water/foreign material, all intended outputs, returns, mortalities, waste and stock changes before allocation. Record every intended grade/species hand-off once. Packaging is ancillary and whole native shells remain oysters; mortality/bycatch is not automatically coproduct."
    source_ids: []
  - rule_id: specific_attribution
    applies_to: "multiple intended outputs"
    rule: "Prefer direct measured assignment and subdivision by actual effort/resource use. For inseparable shared trips/periods require an explicit reviewed PCR-specific causal attribution decision, evidence and sensitivity; do not impose mass, revenue or substitution by default. Without a defensible decision the multi-output dataset remains incomplete."
    source_ids: []
  - rule_id: period_shared
    applies_to: "vessel, gear, services and shore assets"
    rule: "Index acquisition, use, repair/replacement and retirement over actual asset/service periods; enumerate consuming nodes/outputs and allocate using recorded usage. Include failed trips within the complete supported period. Reconcile all shares to the asset/service total; never charge full acquisition every season or an inclusive service plus its covered burdens."
    source_ids: []
  - rule_id: no_automatic_credit
    applies_to: "wild stock and returns"
    rule: "No automatic carbon storage, filtration, habitat-restoration, biodiversity, avoided-treatment or mortality credit. Record actual intervention and impact evidence separately; credits require a separately reviewed method and boundary."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "Complete trip, stock removal, support and releases"
      record_type: "Trip and asset ledger"
      raw_fields: "trip/site/cohort provenance; enhancement history; dates; gear; crew/hours; fuel stocks/receipts; engine/factor; raw catch; incidental input; live/dead returns; lost gear; transfer ids; assets/service coverage/consumers/periods"
      collection_method: "Reconcile trip logs with calibrated weighing, fuel stock balance, purchase/service records and site/cohort documents; reconstruct uncertain returns with method/uncertainty evidence"
      unit: "kg; actual resource/service units"
      frequency: "Each trip/event and asset change"
      temporal_coverage: "Complete declared reporting period, including failed trips and return legs; all relevant asset phases"
      site_scope: "Actual vessel, site and pre-gate support"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale/density/factor records; provenance documents; complete log register; service boundary and share audit"
    - protocol_id: cp_condition
      process_id: "condition"
      flow_role: "Animal cleaning resources and prepared outputs"
      record_type: "Preparation event ledger"
      raw_fields: "event/lot/transfer ids; activation/bypass; raw/prepared live mass; water supply/abstraction; makeup/discharge; consumables; energy/service; loose material; mortality; waste/destination; shared-event owner"
      collection_method: "Weigh before/after under consistent drainage, meter resource use and record actual waste/discharge; equipment-only cleaning belongs to operating node"
      unit: "kg; actual resource/service units"
      frequency: "Each preparation and cleaning event"
      temporal_coverage: "All actual pre-gate preparation events in reporting period"
      site_scope: "Actual animal-preparation location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; event observations; meter/invoice records; destination receipts"
    - protocol_id: cp_sort
      process_id: "sort"
      flow_role: "Grade and destination decisions"
      record_type: "Lot sorting ledger"
      raw_fields: "incoming state/mass; grade/species/destination; live/dead/return/reject masses; transfer ids; intended-output hand-offs; support use; cleaning owner"
      collection_method: "Calibrated net weighing and observed live-state/destination classification; reconcile all output states, including non-reference intended outputs"
      unit: "kg; actual support units"
      frequency: "Each lot and sorting event"
      temporal_coverage: "All lots/trips in declared period"
      site_scope: "Actual grading/landing location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale records; grade specifications; return observations; output/destination receipts"
    - protocol_id: cp_preserve
      process_id: "preserve"
      flow_role: "Actual live-support instances"
      record_type: "Holding/cooling event ledger"
      raw_fields: "instance/lot/transfer ids; start/end time; live condition; temperature when measured; input/output masses; energy; media makeup/recirculation; equipment/service coverage; mortality; waste; leakage/discharge substance/medium"
      collection_method: "Record actual intervention and duration, meter energy/media and weigh live output; classify direct releases and waste independently"
      unit: "kg; MJ; actual media/service units"
      frequency: "Each actual support instance"
      temporal_coverage: "Capture-to-acceptance events including overlaps in reporting period"
      site_scope: "Actual vessel or pre-gate holding location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Logs/meters; scales; waste receipts; release method; service coverage evidence"
    - protocol_id: cp_accept
      process_id: "accept"
      flow_role: "Presentation, delivery and final accepted mass"
      record_type: "Recipient acceptance and package ledger"
      raw_fields: "incoming/accepted/refused live masses; drainage/tare; scales; species/provenance; trip/lot/transfer ids; recipient/location/time; title/invoice time; packages/reuse/return/loss/retirement; delivery legs/support; node-owned fuel/activity; substance-specific factor/method; receiving medium; all destinations"
      collection_method: "Weigh accepted whole live oysters using calibrated scales, reproducible drainage and separate tare; match physical receipt, dealer ticket and trip record; measure lot-specific bushel/count conversion; audit packages and delivery; reconcile direct operated fuel/activity and substance/medium release evidence"
      unit: "kg; actual delivery/service units"
      frequency: "Each dispatch/acceptance and package event"
      temporal_coverage: "Complete declared reporting period and package asset phases through acceptance"
      site_scope: "First physical recipient and actual pre-gate route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Acceptance receipts; scale/tare/paired-conversion records; package stock audit; service and destination evidence"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Divide each reconciled node-attributable period exchange by accepted net whole live reference mass of the same complete period; keep native numerator units and disclose attribution before division."
      inputs:
        - "node ledgers"
        - "accepted net mass"
        - "reviewed attribution"
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: reference_identity
      applies_to: "oysters_accepted"
      rule: "Accepted net reference mass divided by that same accepted net reference mass defines 1 kg; the 1..1 range is normalization identity, not raw yield. Zero accepted output cannot supply a denominator."
      inputs:
        - "cp_accept accepted mass"
      output: "1 kg reference output"
      source_ids: []
    - id: balance_transfers
      applies_to: "all internal live transfers"
      rule: "Pair unique transfer dispatch/receipt by lot, time, state and drainage; reconcile discrepancies, stock changes, losses and removed foreign material before normalization."
      inputs:
        - "five node ledgers"
        - "transfer ids"
      output: "reconciled physical network"
      source_ids: []
    - id: conversion_records
      applies_to: "count, bushel, energy and volume records"
      rule: "Derive lot-specific kg from calibrated paired measurements; preserve uncertainty and sampling scope. Convert kWh to MJ with 1 kWh = 3.6 MJ; volume-to-mass requires actual density."
      inputs:
        - "paired calibration records"
        - meters
        - density
      output: "consistent native mass/energy values"
      source_ids: []
  data_quality_requirements:
    - id: provenance
      applies_to: "scope"
      requirement: "Natural recruitment, species, site/cohort, hand shaft tongs and intervention history must be positively evidenced; uncertain origin blocks selection."
      evidence: "Cohort/site records, harvest logs and intervention history"
    - id: completeness
      applies_to: "all nodes"
      requirement: "Cover complete periods/trips and all intended outputs, returns, failures, support and destinations. Missing quantity is a data gap, never measured zero."
      evidence: "Ledger and physical reconciliation"
    - id: bounds_identities
      applies_to: "all exchanges"
