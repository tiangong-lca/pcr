validation_rules:
  - rule_id: validate_scope
    applies_to: "scope/reference"
    rule: "Reject incompatible species, origins, gear, seeded/relaid/enhanced or uncertain cohorts and nonlive/processed reference products. Require every qualifier and intervention disclosure."
    source_ids:
      - maryland-oyster-landings
      - noaa-eastern-oyster
  - rule_id: validate_network
    applies_to: "all nodes"
    rule: "Require actual conditional activations/bypasses, real hand-offs, node-owned protocols and one owner per overlapping event. Reconcile full trips, transfers, material/water/tare and all output states before attribution; internal quantities are not fixed to 1 kg."
    source_ids: []
  - rule_id: validate_attribution
    applies_to: "outputs/assets/services"
    rule: "Require complete intended-output and period sets, reviewed causal attribution when inseparable, reconciled shares and no duplicate inclusive service/direct burden or repeated asset acquisition. Unresolved attribution, replacement/retirement or missing output destination is incomplete."
    source_ids: []
  - rule_id: validate_mass_identity
    applies_to: "oysters_accepted"
    rule: "Require one final accepted live net whole reference output, paired calibrated volume/count conversions where used and a positive accepted-mass denominator; 1..1 is only the normalization identity."
    source_ids: []
  - rule_id: validate_evidence
    applies_to: "all exchange instances"
    rule: "Do not finalize without exact UUID/support verification and independently evidenced quantitative bounds. Review actual substance/compartment and service units; no guessed identity, universal yield, kg/bushel, time-temperature rule or automatic environmental credit."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable collection requirements and concrete inventory exchanges"
    rule: "Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground natural-stock hand-tong harvest-to-acceptance data package with process and lifecyclemodel projections"
  downstream_use: "secondary_dataset; background_dataset within this declared narrower scope"
  allowed_use: "Traceable naturally recruited live whole Eastern oysters matching species, site, gear and first physical acceptance gate"
  excluded_use: "Farming/enhanced or uncertain cohort routes; other species/gears/geographies; meat yield, shucked/frozen/dead product; recipient depuration/processing; safety certification or automatic ecosystem credits"
  required_metadata: "PCR id/version; species/site/cohort and provenance; intervention history; gear; actual process instances/transfers; trips/reporting periods; gate/live state; mass/drainage/tare and conversions; complete outputs; support coverage and allocation"
  required_quality_disclosure: "Missing records and uncertainty; range status; concrete identity/support verification; coverage of failed trips and assets; destination and service exclusions; attribution decisions and sensitivities"
  update_trigger: "Changed cohort/site enhancement, species/gear/gate, live-support or packaging route, material supplier/service boundary, new quantitative evidence or identity verification"
