      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Wild natural-seabed live Pecten maximus and actual producer capture preparation/access; no managed cultivation phase |\n| starting_condition_role | Measured natural capture context, not external zero-burden purchased animal |\n| product_classification_scope | Narrower live whole hand-dived Pecten maximus subset of CPC 3.0 04441 |\n| recursive_input_rule | Retain paired internal transfers once; purchased same-category or relayed-growout animals invalidate this capture scope |\n| upstream_dataset_requirement | Compatible actual provider/gate/technology/geography supplies and complete foreground-operated capture/support assets, no supplier-inclusive double counting |\n| disclosure | Capture location/period/configuration; actual gate/recipient; activation/pass graph; live state/cleaning/mass; stocks/service inclusions; missing purpose, identities, quantities, fates and attribution evidence |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `boundary_natural` | capture_context | Start with evidenced wild natural-seabed Pecten maximus and actual capture preparation, access, diving, collection, support and attributable return/idle duties. No managed growth, feed or farming phase is inferred; natural history is not claimed impact-free. | `lochfyne-live-scallops` |\n| `boundary_gate` | reference_product | End at evidenced first harvester physical recipient acceptance of live whole native-shell animals for the food chain before intentional depuration, sanitary relaying or managed growout. A harvester that intentionally depurates before first handover is outside this narrow method; do not omit that burden or redefine its later gate. Buyer onward distribution, shucking, cooking, freezing and treatment are excluded. | `fao-bivalve-depuration-2008` |\n| `boundary_purpose` | live_hold | Exterior rinsing and short nonpurifying condition maintenance do not prove depuration. Collect actual purpose, duration, conditions and recipient; unclear immersion or tank purpose blocks boundary confirmation. Neither raw transfer nor purification proves readiness to eat or universal removal of hazards. | `fao-bivalve-depuration-2008` |\n| `boundary_events` | process_graph | Nodes are responsibilities, not a mandatory chronological line. Capture and first acceptance are required; activate other nodes only for actual independent events. Record actual order, pass ids, repetition, overlap and bypass, each transfer sender/receiver/state/mass/time and package/water links. Do not double own an event because it serves two functions. |  |\n| `boundary_config` | dive_capture | Parent activity is dive_capture. SCUBA and surface-supplied diving are evidenced alternative implementations, not proof of a supplier configuration. Record actual apparatus, breathing-gas stocks/conditions, fill/compressor/service inclusion, and asset/support consumption. Alternative costs are mutually exclusive per actual component/pass unless a documented mixed configuration genuinely uses both; no duplicate product interface, breathhold assumption, oxygen identity or safety prescription. | `hse-shellfish-diving-2021` |\n| `boundary_fullperiod` | producer_duties | Include complete attributable producer outbound, return, idle, failed collection, maintenance, cleaning, support and asset service periods even when animal handover is offshore. Buyer distribution is excluded, not producer return duties. Record package, live-animal, water, fuel and gas opening/closing stocks, replacement, termination and post-gate scheduled producer duties with period ownership. |  |\n| `boundary_recursive` | upstream_supply | Same-category bought or relayed animals are outside this capture scope, not burden-free wild removal. Internal transfers retain custody and inherited burden without repurchase. External services/materials need upstream inventories compatible with actual gate, technology, geography and service inclusions; a missing provider inventory is a disclosed gap, not zero. |  |\n| `boundary_operating_responsibility` | all direct resources and emissions | Own/owned refers to direct foreground operation/control and fuel/resource-consumption responsibility, not legal asset title. Include rented or borrowed self-operated equipment; exclude components already represented by a provider-inclusive service. Apply this definition to direct fuel, combustion, water, compression and asset/service records with one event owner. |  |\n\n"
