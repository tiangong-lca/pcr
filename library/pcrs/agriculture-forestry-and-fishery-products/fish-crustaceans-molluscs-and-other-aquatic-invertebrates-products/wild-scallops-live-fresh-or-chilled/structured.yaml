system_boundary:
  rules:
    - rule_id: boundary_natural
      applies_to: "capture_context"
      rule: "Start with evidenced wild natural-seabed Pecten maximus and actual capture preparation, access, diving, collection, support and attributable return/idle duties. No managed growth, feed or farming phase is inferred; natural history is not claimed impact-free."
      source_ids:
        - lochfyne-live-scallops
    - rule_id: boundary_gate
      applies_to: "reference_product"
      rule: "End at evidenced first harvester physical recipient acceptance of live whole native-shell animals for the food chain before intentional depuration, sanitary relaying or managed growout. A harvester that intentionally depurates before first handover is outside this narrow method; do not omit that burden or redefine its later gate. Buyer onward distribution, shucking, cooking, freezing and treatment are excluded."
      source_ids:
        - fao-bivalve-depuration-2008
    - rule_id: boundary_purpose
      applies_to: "live_hold"
      rule: "Exterior rinsing and short nonpurifying condition maintenance do not prove depuration. Collect actual purpose, duration, conditions and recipient; unclear immersion or tank purpose blocks boundary confirmation. Neither raw transfer nor purification proves readiness to eat or universal removal of hazards."
      source_ids:
        - fao-bivalve-depuration-2008
    - rule_id: boundary_events
      applies_to: "process_graph"
      rule: "Nodes are responsibilities, not a mandatory chronological line. Capture and first acceptance are required; activate other nodes only for actual independent events. Record actual order, pass ids, repetition, overlap and bypass, each transfer sender/receiver/state/mass/time and package/water links. Do not double own an event because it serves two functions."
      source_ids: []
    - rule_id: boundary_config
      applies_to: "dive_capture"
      rule: "Parent activity is dive_capture. SCUBA and surface-supplied diving are evidenced alternative implementations, not proof of a supplier configuration. Record actual apparatus, breathing-gas stocks/conditions, fill/compressor/service inclusion, and asset/support consumption. Alternative costs are mutually exclusive per actual component/pass unless a documented mixed configuration genuinely uses both; no duplicate product interface, breathhold assumption, oxygen identity or safety prescription."
      source_ids:
        - hse-shellfish-diving-2021
    - rule_id: boundary_fullperiod
      applies_to: "producer_duties"
      rule: "Include complete attributable producer outbound, return, idle, failed collection, maintenance, cleaning, support and asset service periods even when animal handover is offshore. Buyer distribution is excluded, not producer return duties. Record package, live-animal, water, fuel and gas opening/closing stocks, replacement, termination and post-gate scheduled producer duties with period ownership."
      source_ids: []
    - rule_id: boundary_recursive
      applies_to: "upstream_supply"
      rule: "Same-category bought or relayed animals are outside this capture scope, not burden-free wild removal. Internal transfers retain custody and inherited burden without repurchase. External services/materials need upstream inventories compatible with actual gate, technology, geography and service inclusions; a missing provider inventory is a disclosed gap, not zero."
      source_ids: []
    - rule_id: boundary_operating_responsibility
      applies_to: "all direct resources and emissions"
      rule: "Own/owned refers to direct foreground operation/control and fuel/resource-consumption responsibility, not legal asset title. Include rented or borrowed self-operated equipment; exclude components already represented by a provider-inclusive service. Apply this definition to direct fuel, combustion, water, compression and asset/service records with one event owner."
      source_ids: []
