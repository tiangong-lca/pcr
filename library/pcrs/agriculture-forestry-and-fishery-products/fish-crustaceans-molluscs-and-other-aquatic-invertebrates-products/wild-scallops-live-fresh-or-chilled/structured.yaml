  - rule_id: validate_scope
    applies_to: "reference_product"
    rule: "Verify Pecten maximus wild natural-seabed hand-dived origin, alive whole native shell, intended food-chain recipient, first physical acceptance and no intentional pre-gate depuration/relaying/growout. Exclude dredged/trawled/electrically collected, other scallops, cultivated, ornamental, shucked muscle/roe-only, dead chilled, frozen or cooked outputs."
    source_ids: []
  - rule_id: validate_graph
    applies_to: "all_nodes"
    rule: "Match actual activated nodes and pass sequence, two-or-more-state independent sorting, paired animal/water/package transfers, node-specific protocols and physical stock balances. A bypass, overlap or repeated event cannot create a duplicate reference exchange or burden."
    source_ids: []
  - rule_id: validate_units
    applies_to: "all_inventory"
    rule: "Require calibrated accepted net live animal mass, tare/cleaning state, exact denominator and documented count/volume/energy conversions. Shell/body water belong to reference animal; free water/sediment/attached external organisms/package do not. Wet-mass difference alone is not mortality, growth, flesh yield or biological carbon."
    source_ids: []
  - rule_id: validate_config
    applies_to: "dive_capture"
    rule: "Verify actual SCUBA/surface-supply configuration and component ownership, mixture, cylinder/fill/returned stocks, volume conditions and compressor/service evidence. No unproven simultaneous alternative consumptions or mandatory pure oxygen. This inventory rule provides no operational safety or legal assurance."
    source_ids: []
  - rule_id: validate_fates
    applies_to: "all_outputs"
    rule: "Separate all intended output states, live release, dead/rejected animals, residues, wastewater to technosphere and direct substance/medium-specific environmental releases; identify stocks/uncertainty and actual receiver. Verify fossil CO2 is direct foreground fossil combustion to air only; no respiration/industrial-oxygen substitution or implicit impact-free capture."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "all_cards"
    rule: "Every amount has its declared evidence, node protocol and Range. U_<row_id> means a missing independently supported representative upper screen, never a numerical default, target-batch maximum, allowed interval or clipping rule. Obtain independent support and check real outliers without deleting them; 1..1 on final reference is normalization only."
    source_ids: []
  - rule_id: validate_burdens
    applies_to: "attribution"
    rule: "Reconcile unique event owners, independent coproduct allocation, remaining upstream pools at later splits, all producing/support/return/idle periods, service inclusions, replacements/termination and zero-output treatment. Physical throughput and LCA-weighted amounts must both be recoverable."
    source_ids: []
  - rule_id: validate_evidence
    applies_to: "dataset_readiness"
    rule: "Before final exchanges resolve each actual concrete flow, property and unit group independently; broad conditional cards may expand to zero/one/multiple real exchanges. Quantitative gaps or unresolved identity do not become verified by structural validation. Missing boundary/configuration or receiver evidence blocks dataset finalization."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable collection requirements and concrete inventory exchanges"
    rule: "Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Only compatible wild live whole hand-dived Pecten maximus at the evidenced first harvester gate, after concrete exchanges/quantity/boundary/attribution evidence is complete"
  excluded_use: "Whole CPC leaf substitution; cultivated/other gear/species; depurated/later gates; meat/roe/frozen/cooked/dead states; safety/legal/ecological certification or unverified final UUID"
  required_metadata: "All required qualifiers, complete pass/period/stock graph, native units/configuration/service inclusions, providers/recipients, reference mass/tare and attribution decision"
  required_quality_disclosure: "Representativeness, actual measured/calculated/modelled amounts, unresolved identities/support/Range gaps, uncertain balances/fates and sensitivity; no structural-check certification"
  update_trigger: "Change of species, capture gear/configuration, gate or treatment purpose, provider/service coverage, stock/asset period, allocation, quantitative evidence or actual flow identities"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 Explanatory Notes (2025), printed pp.50 and 78; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf ; retrieved 2026-10-10"
    used_for: "Wild scallop leaf and adjacent farmed/processed boundaries only; no species/gear/quantity defaults."
  - id: "lochfyne-live-scallops"
    type: "literature"
    reference: "Loch Fyne Langoustines, Live Whole King Scallops; https://lochfyne-langoustines.com/live-whole-king-scallops/ ; retrieved 2026-10-10"
    used_for: "First-party evidence of Pecten maximus, wild whole live hand-diver collection and collection bag; not a universal grade, shelf-life, certification or apparatus claim."
  - id: "hse-shellfish-diving-2021"
    type: "official_guidance"
    reference: "HSE, Commercial shellfish diving in inshore water, revised 11/21, p.8 sections42–46; https://www.hse.gov.uk/regulating-major-hazards/assets/docs/scallop.pdf ; retrieved 2026-10-10"
    used_for: "Qualitative SCUBA/surface-supplied alternatives and breathing-gas/equipment interfaces only; not numeric safety prescriptions or legal advice."
  - id: "fao-bivalve-depuration-2008"
    type: "official_guidance"
    reference: "Lee, Lovatelli and Ababouch, FAO Fisheries Technical Paper 511 (2008), abstract and pre-depuration considerations; https://www.fao.org/4/i0201e/i0201e00.htm ; retrieved 2026-10-10"
    used_for: "Distinguish intentional depuration from exterior cleaning/nonpurifying storage; qualitative pre-depuration handling only, no universal sanitary guarantee or numerical bounds."
  - id: "reference-normalization-identity"
    type: "method_factor"
    reference: "This PCR section 3 and calculate_reference: the same accepted live net mass normalized to 1 kg."
    used_for: "Only the 1..1 reference normalization identity, not an empirical yield or quality threshold."
