  calculation_rules:
    - id: calculate_reference
      applies_to: "all inventory rows"
      rule: "For a positive accepted net live reference mass, divide the independently attributable node amount by that same accepted mass in kg; retain original physical amounts, native units, owners and upstream carryover. Apply no division to zero-output lots until their justified period/output treatment is resolved."
      inputs:
        - "Actual node protocols"
        - "accepted live net mass"
        - "ownership and independent output attribution"
      output: "Actual inventory per 1 kg reference flow plus full physical ledger"
      source_ids: []
    - id: calculate_electricity
      applies_to: "electricity rows"
      rule: "1 kWh = 3.6 MJ"
      inputs:
        - "Actual meter/supplier electricity quantity"
      output: "MJ"
      source_ids: []
    - id: calculate_balance
      applies_to: "each active node and stock period"
      rule: "Reconcile opening stock plus actual receipts/removal with actual transfers, final acceptance, independently intended outputs, contained waste, uncontained fates, uptake/exudate/respiration where applicable, and closing stock. Retain medium/state-specific uncertain residuals instead of inventing growth or double booking water."
      inputs:
        - "Actual physical records and paired transfers"
      output: "Disclosed physical reconciliation and gaps"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "actual exchanges"
      requirement: "Verify actual species/state/provider/gate/technology/medium and property/unit separately; variable service/material/fate cards require concrete expansion, not a guessed UUID."
      evidence: "Detail records, support identities and actual foreground context"
    - id: quality_complete
      applies_to: "lots and periods"
      requirement: "Retain failed/zero-output periods, full producer return/support duties, all active-node resources/packages/fates, replacement/termination and stock carryover. No silent exclusions or unproven multi-site averaging."
      evidence: "Event graph, service boundaries, reconciled stock and ownership audit"
    - id: quality_ranges
      applies_to: "all quantities"
      requirement: "U_<row_id> upper bounds need independent representative records/external evidence and actual native-unit support; never derive the screen solely from the target lot, clip outliers or claim a literature interval. Preserve measured uncertainty and source applicability."
      evidence: "Independent review of Range evidence, actual measurements and uncertainty"
