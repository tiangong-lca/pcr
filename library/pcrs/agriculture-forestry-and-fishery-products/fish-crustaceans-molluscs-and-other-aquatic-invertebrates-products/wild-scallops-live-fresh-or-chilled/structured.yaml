    name: "Short live-condition maintenance"
    inclusion: "conditional"
    inclusion_condition: "An actual bounded pre-gate live-condition intervention or nonpurifying wet storage occurs"
    role: "Live whole animals before intervention to still-live whole animals at the next actual handoff; record duration, conditions, water and losses. No shelf-life or sanitary improvement is promised."
    quantitative_reference: "per 1 kg reference flow"
  - id: presentation
    name: "Final protective presentation"
    inclusion: "conditional"
    inclusion_condition: "A distinct pre-gate enclosure/protection/label presentation responsibility actually occurs"
    role: "Previously handled live whole animals to the same live whole animals presented in actual packaging. Record package material, reusable stock, loss and receiver; this node is not buyer distribution."
    quantitative_reference: "per 1 kg reference flow"
  - id: first_handover
    name: "First harvester physical handover and acceptance"
    inclusion: "required"
    inclusion_condition: "Each reference lot has evidenced first physical recipient acceptance before intentional depuration"
    role: "From the actual predecessor state to accepted live whole native-shell Pecten maximus for the food chain; acceptance also records nonaccepted animals and destination. Recipient may require later purification; this is not ready-to-eat certification."
    quantitative_reference: "per 1 kg reference flow"
