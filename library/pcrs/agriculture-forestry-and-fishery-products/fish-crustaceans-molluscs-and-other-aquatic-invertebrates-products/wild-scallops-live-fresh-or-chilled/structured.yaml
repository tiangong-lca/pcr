allocation_rules:
  - rule_id: allocation_owner
    applies_to: "shared_events"
    rule: "First assign each physical resource/service/asset event once to its consuming node and period using measured causal subdivision; record the complete physical ledger separately from LCA-weighted quantities. Shares of one event must sum to its actual whole; overlapping roles and stock movements cannot duplicate it."
    source_ids: []
  - rule_id: allocation_outputs
    applies_to: "intended_products"
    rule: "Enumerate all actually intended species, grades and destination outputs with physical amount, state, recipient and first exit. Avoid coproduct allocation by evidenced subdivision first; if still inseparable require a justified causal physical relation, otherwise a documented economic alternative with prices/time/state and sensitivity. No default wet-mass or price split; rejected/released/waste material is not automatically intended product."
    source_ids: []
  - rule_id: allocation_later
    applies_to: "successive_splits"
    rule: "A genuine later intended-output split divides the remaining carried upstream burden pool plus genuinely shared later burdens; preserve prior externally assigned shares and do not repartition them. A product identified late cannot receive free capture. A transfer or life-state change alone is not another allocation split."
    source_ids: []
  - rule_id: allocation_period
    applies_to: "stocks_assets"
    rule: "Use actual asset/service consumers and evidenced life/service period, replacement and termination records; no universal vessel life, cylinder refill count or bag reuse factor. Carry live/product/package stocks and inherited burden across periods once, document attribution drivers and sensitivity, and retain unattributed residuals as unresolved rather than dropping them."
    source_ids: []
  - rule_id: allocation_zero
    applies_to: "zero_output"
    rule: "Reconcile failed or zero-accepted lots within the evidenced reporting boundary and justified attribution across actual outputs/periods; never divide by zero, silently exclude them, force their burden to zero, or invent accepted live mass. Retained live stock is not accepted output."
    source_ids: []
  - rule_id: allocation_service
    applies_to: "provider_inclusions"
    rule: "Choose a declared representation for each actual owned or purchased service. Do not count provider-inclusive gas compression, fuel, electricity, vessels, equipment or emissions again as direct foreground items. Foreground-operated compression records actual ambient intake, gas stocks and energy; purchased gas retains its own delivery/inclusion boundary. No avoided disposal or biological carbon sequestration credit is automatic."
    source_ids: []
  - rule_id: allocation_rule_7
    applies_to: "foreground_burden_allocation"
    rule: "Every individual animal belongs to one disjoint physical population at each pass. Declare the selected reference lot/product/grade pool and distinguish other independently intended final outputs from it. Grades that remain within the same reference pool are internal subdivisions, not extra coproducts or additional accepted final kilograms; count each final accepted animal once at the selected first gate. If independently sold grades are separately modelled, document their disjoint accepted masses and attribution decision."
    source_ids: []
