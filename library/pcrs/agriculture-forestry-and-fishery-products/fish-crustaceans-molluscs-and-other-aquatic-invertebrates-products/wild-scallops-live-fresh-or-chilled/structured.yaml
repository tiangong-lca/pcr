          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `allocation_owner` | shared_events | First assign each physical resource/service/asset event once to its consuming node and period using measured causal subdivision; record the complete physical ledger separately from LCA-weighted quantities. Shares of one event must sum to its actual whole; overlapping roles and stock movements cannot duplicate it. |  |\n| `allocation_outputs` | intended_products | Enumerate all actually intended species, grades and destination outputs with physical amount, state, recipient and first exit. Avoid coproduct allocation by evidenced subdivision first; if still inseparable require a justified causal physical relation, otherwise a documented economic alternative with prices/time/state and sensitivity. No default wet-mass or price split; rejected/released/waste material is not automatically intended product. |  |\n| `allocation_later` | successive_splits | A genuine later intended-output split divides the remaining carried upstream burden pool plus genuinely shared later burdens; preserve prior externally assigned shares and do not repartition them. A product identified late cannot receive free capture. A transfer or life-state change alone is not another allocation split. |  |\n| `allocation_period` | stocks_assets | Use actual asset/service consumers and evidenced life/service period, replacement and termination records; no universal vessel life, cylinder refill count or bag reuse factor. Carry live/product/package stocks and inherited burden across periods once, document attribution drivers and sensitivity, and retain unattributed residuals as unresolved rather than dropping them. |  |\n| `allocation_zero` | zero_output | Reconcile failed or zero-accepted lots within the evidenced reporting boundary and justified attribution across actual outputs/periods; never divide by zero, silently exclude them, force their burden to zero, or invent accepted live mass. Retained live stock is not accepted output. |  |\n| `allocation_service` | provider_inclusions | Choose a declared representation for each actual owned or purchased service. Do not count provider-inclusive gas compression, fuel, electricity, vessels, equipment or emissions again as direct foreground items. Foreground-operated compression records actual ambient intake, gas stocks and energy; purchased gas retains its own delivery/inclusion boundary. No avoided disposal or biological carbon sequestration credit is automatic. |  |\n\nEvery individual animal belongs to one disjoint physical population at each pass. Declare the selected reference lot/product/grade pool and distinguish other independently intended final outputs from it. Grades that remain within the same reference pool are internal subdivisions, not extra coproducts or additional accepted final kilograms; count each final accepted animal once at the selected first gate. If independently sold grades are separately modelled, document their disjoint accepted masses and attribution decision.\n\n"
