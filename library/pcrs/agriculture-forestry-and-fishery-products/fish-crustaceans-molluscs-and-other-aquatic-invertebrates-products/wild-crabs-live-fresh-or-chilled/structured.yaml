  calculation_rules:
    - id: lot_attribution
      applies_to: "all inventory rows"
      rule: "Keep two explicitly labelled views. First reconcile unallocated physical receipts, transfers, products, losses and stocks for the complete declared cohort/trip/run; pair internal transfers in the same state and unit, retaining their measured mass. Assign shared resource/service events to actual consuming nodes and periods once using evidenced service shares, without shrinking product, biomass, water or waste partitions by a co-product share. Divide this physical inventory by the matching positive accepted final net kg. Separately derive a labelled single-output LCA burden/inventory projection using section 7 co-product allocation exactly once, retaining the unallocated inventory and allocation matrix. Never test allocated exchanges against an unallocated physical balance, apply output shares again downstream, or set an internal quantity to the final 1 kg."
      inputs:
        - "Node protocols"
        - "allocation ledger"
        - "accepted final net mass"
        - "stock history"
      output: "Attributed exchange per 1 kg reference flow"
      source_ids:
        - wild-crab-foreground-method
    - id: reference_envelope
      applies_to: "all nonfinal row ranges"
      rule: "Establish U_row separately for each actual instantiated identity/state, node and pre_sort/post_sort pass. Use the maximum normalized amount of an independent representative reference campaign times a predeclared uncertainty margin not less than 1, or a supplier design envelope in matching numerator unit and final-net-kg basis times that margin; retain raw quantities, reference net kg, sample size, scope and margin rationale. Exclude the target lot from its own envelope and never pool different substances under one collection scope bound. Without independent evidence the instance remains uninstantiated, not numerically QA-cleared or a complete quantitative data package."
      inputs:
        - "Independent campaign records"
        - scope
        - "uncertainty margin"
      output: "U_row"
      source_ids:
        - wild-crab-foreground-method
    - id: conditional_interface_envelopes
      applies_to: "capture_internal_water_ice_transfer_water; capture_internal_water_ice_transfer_ice; grading_internal_water_ice_receipt_water; grading_internal_water_ice_receipt_ice; grading_internal_water_ice_transfer_water; grading_internal_water_ice_transfer_ice; live_hold_internal_water_ice_receipt_water; live_hold_internal_water_ice_receipt_ice; live_hold_internal_water_ice_transfer_water; live_hold_internal_water_ice_transfer_ice; fresh_chill_internal_water_ice_receipt_water; fresh_chill_internal_water_ice_receipt_ice; fresh_chill_internal_water_ice_transfer_water; fresh_chill_internal_water_ice_transfer_ice; presentation_internal_water_ice_receipt_water; presentation_internal_water_ice_receipt_ice; dq_complete_presentation_actual_source_water; presentation_internal_water_ice_transfer_water; presentation_internal_water_ice_transfer_ice; presentation_water_ice_handover_water; presentation_water_ice_handover_ice; presentation_packaging_handover"
      rule: "For each listed atomic card, or each actual exchange required by a listed collection obligation, instantiate actual identity, state, node, pass and numerator unit before establishing U_row from the same-view normalized maximum of an independent representative campaign times a predeclared margin at least 1, or a matching-unit/basis supplier design envelope. Retain samples, source, basis and uncertainty; never use the target batch to establish its own upper bound. Unverified service unit/support or absent independent envelope remains an unresolved instance, not numeric QA-cleared or zero. Reconcile physical water/ice/packaging movements separately from service-share quantities."
      inputs:
        - "independent reference records"
        - "actual unit and basis"
      output: "U_row"
      source_ids:
        - wild-crab-foreground-method
  data_quality_requirements:
    - id: quality_scope
      applies_to: "reference lot"
      requirement: "Trace wild origin, species/gear/habitat, actual food/body/life state and the first gate; do not average incompatible states or infer unknown viability."
      evidence: "Capture, grading, state acceptance and dispatch records"
    - id: quality_amounts
      applies_to: "all actual exchanges"
      requirement: "Use representative temporal coverage including unsuccessful effort, measurement uncertainty and supplier scope; classify missing identity/amount/range evidence as gaps, not zero."
      evidence: "Calibrations, supplier/detail records and independent reference-campaign logs"
    - id: quality_impact
      applies_to: "capture and release"
      requirement: "Retain bycatch, injury, delayed-fate uncertainty, lost gear, ghost-fishing and habitat-contact observations even when characterization lacks coverage; never report an unassessed impact as no impact."
      evidence: "Observer/operator records and explicit assessment limits"
    - id: dq_inventory_completion
      applies_to: "all inventory-completion requirements"
      requirement: "Create a separate card for every actual physical or chemical exchange, with process, direction, flow type, its own measured quantity, native unit, final-reference normalization, applicability, destination, UUID and independent range evidence. Never copy a family total, a grouped screening range or one UUID onto every child. Use not_applicable only for evidenced absence; unknown is not zero. Any unfulfilled applicable obligation makes the final dataset incomplete and fails validation."
      evidence: "per-flow coverage ledger, raw measurements, identity, fate and range evidence"
