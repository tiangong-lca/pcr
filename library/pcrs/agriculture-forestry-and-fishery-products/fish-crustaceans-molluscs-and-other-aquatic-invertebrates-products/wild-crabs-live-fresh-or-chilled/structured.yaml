    required_unit: "kg"
    rule: "Weigh qualifying whole crabs on a calibrated scale after separating extraneous water/ice and taring all containers, ties and packaging. Retain native shell/body fluids and actual appendages. No assumed edible yield, count-to-mass or missing-limb factor. Use cp_presentation; final output is 1 kg."
