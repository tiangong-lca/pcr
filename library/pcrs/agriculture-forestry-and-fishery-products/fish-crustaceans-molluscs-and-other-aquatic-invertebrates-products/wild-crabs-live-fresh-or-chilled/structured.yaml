allocation_rules:
  - rule_id: allocation_output
    applies_to: "capture; grading"
    rule: "Avoid attribution by separating actual dedicated efforts and downstream grade handling first. For inseparable capture joint outputs, allocate residual common effort burdens across all intended retained landings using documented landed wet mass at their first independent handoffs; treat food grades of the same reference lot once. Disclose why this physical driver represents the shared operation and test economic allocation sensitivity if values/effort strongly diverge. If a defensible driver cannot be shown, retain a joint-output package and block a single-output claim rather than silently selecting a fraction."
    source_ids:
      - wild-crab-foreground-method
  - rule_id: allocation_losses
    applies_to: "all nodes"
    rule: "Live releases, dead discards, mortality, rejected food and waste are physical dispositions, not intended co-products merely because mass exists. Attribute their capture/handling/treatment burdens to the causative retained intended outputs, disclose actual fate, and apply no automatic substitution, ecosystem, bait-recycling or negative biomass credit. A genuinely sold non-reference output requires its separate product role and handoff record."
    source_ids:
      - wild-crab-foreground-method
  - rule_id: allocation_periods
    applies_to: "all nodes"
    rule: "Index trips, deployments, holding batches, handling runs and reporting periods; include empty/failed trips attributable to the declared fishery. Reconcile opening/closing crab and bait stocks with dated transfers and deaths; carry their associated burdens with closing stock and release them once at later handover. Attribute vessel/gear/tank/ice-maker and crate capital from actual service history, replacement and remaining life, never a universal lifespan or a new purchase each trip. Distinguish product custody gate from resource/service accounting-period closure: an at-sea first gate is not moved to port, but actual trip-period ledgers assign necessary producer return-to-base, idling and return-cycle preparation once, with actual closure time and evidenced shares for other trips. Exclude buyer distribution and later unrelated capture; never charge the same return again to the next campaign."
    source_ids:
      - wild-crab-foreground-method
  - rule_id: allocation_shared
    applies_to: "all nodes"
    rule: "Use measured fuel/power or operating hours and evidenced load for shared vessel, pumping and cold-room operation; use occupied mass-time or service cycles for tanks/crates only when it represents actual service. Allocate each event first across consuming nodes/periods, then intended outputs if still joint; shares must sum to one. Distinguish physical internal transfers from purchased services. Cleaning/changeover and returns have one run owner and cannot be counted again in another node."
    source_ids:
      - wild-crab-foreground-method
  - rule_id: allocation_secondary_bait
    applies_to: "capture_bait"
    rule: "Inherit prior capture/processing shares consistently with the supplier co-product allocation, adding actual separation, recovery, preservation and transport burdens; supplier evidence must establish waste/product status and the separation gate. A supplier cut-off requires consistent supplier/receiver boundaries, explicit disclosure and alternative-inheritance sensitivity; waste status and zero burden are never defaults. Count recovery events and inherited prior-system shares once; no automatic avoided-disposal credit."
    source_ids:
      - wild-crab-foreground-method
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "All actual capture exchange roles, disaggregated by identity/state"
      record_type: "Node-specific paired measurements, event and supplier records"
      raw_fields: "trip/deployment/lot/transfer/event id; node and period; species/material/substance/state; pre_sort/post_sort stage and actual event order; mass and unit; opening/closing stock; fuel/power/water/gas/asset/gear events; recipient/medium; ownership/allocation share; accepted final net kg; independent reference campaign and U_row evidence; gear type/configuration/material; deployment and retrieval counts; soak/haul time; bait species/state charged/retrieved/lost; catch by taxon and disposition; vessel/fuel/gear stocks; ghost-fishing/entanglement/bottom-contact observations"
      collection_method: "Use calibrated wet/net weighing with separated external water and container tare; meter utilities, reconcile inventory and actual species/state transfers; sample concentrations/material composition or retain compatible supplier/factor evidence. Record gear/holding/handling conditions and loss destinations specific to this node."
      unit: "kg by identity; MJ for energy; raw counts/hours/temperature/volume kept with conversions"
      frequency: "Every actual lot, deployment, dispatch or material event; matched meters over its operating interval"
      temporal_coverage: "Full declared trips/batches and reporting period including failed trips, closing stocks and dated replacements"
      site_scope: "One declared producer/operating unit and this node, not pooled unrelated fleets/sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale/meter calibration, raw logs and timestamps, food/state acceptance, traceable supplier/composition/factor records, stock/transfer reconciliation, independent U_row evidence and coverage gaps"
    - protocol_id: cp_grading
      process_id: "grading"
      flow_role: "All actual grading exchange roles, disaggregated by identity/state"
      record_type: "Node-specific paired measurements, event and supplier records"
      raw_fields: "trip/deployment/lot/transfer/event id; node and period; species/material/substance/state; pre_sort/post_sort stage and actual event order; mass and unit; opening/closing stock; fuel/power/water/gas/asset/gear events; recipient/medium; ownership/allocation share; accepted final net kg; independent reference campaign and U_row evidence; actual incoming predecessor/state; shell/molt/sex where relevant; body/appendage condition; grade and food acceptance; mass by each grade/destination; released vitality and recipient; detached parts and tissue loss"
      collection_method: "Use calibrated wet/net weighing with separated external water and container tare; meter utilities, reconcile inventory and actual species/state transfers; sample concentrations/material composition or retain compatible supplier/factor evidence. Record gear/holding/handling conditions and loss destinations specific to this node."
      unit: "kg by identity; MJ for energy; raw counts/hours/temperature/volume kept with conversions"
      frequency: "Every actual lot, deployment, dispatch or material event; matched meters over its operating interval"
      temporal_coverage: "Full declared trips/batches and reporting period including failed trips, closing stocks and dated replacements"
      site_scope: "One declared producer/operating unit and this node, not pooled unrelated fleets/sites"
      aggregation_rule: "per 1 kg reference flow"
