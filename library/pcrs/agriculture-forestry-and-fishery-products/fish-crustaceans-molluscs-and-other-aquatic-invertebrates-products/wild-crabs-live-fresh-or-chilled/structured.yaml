system_boundary:
  rules:
    - rule_id: boundary_capture
      applies_to: "all nodes"
      rule: "Start at wild resource removal, including attributable preparation, fuel supply, bait, gear and capital service; end at the actual first producer/collector handover. Owned handling and transport before that point are included wherever they occur. Already-purchased whole crabs that have passed a producer gate, retail/merchant holding, grow-out, fattening and induced molt are excluded reference routes."
      source_ids:
        - wild-crab-foreground-method
    - rule_id: boundary_states
      applies_to: "grading; live_hold; fresh_chill; presentation"
      rule: "Actual onboard holding or chilling may precede grading. Record operation stage as pre_sort or post_sort; capture retained catch can go through live_hold/fresh_chill before grading, while only graded, food-accepted terminal lots enter presentation. Each holding/chilling event has one time/stage and appears once, even when the same node performs distinct pre-sort and post-sort events. Grading -> actual live_hold and/or fresh_chill -> presentation is not a compulsory chain. Bypass preserves the actual state and transfer record. Live cooling can coexist with prior live maintenance; dead fresh lots never enter live holding. At every loss or death event classify disposition and lawful food acceptance anew, never infer an inactive state or fresh recovery from missing information."
      source_ids:
        - wild-crab-foreground-method
    - rule_id: boundary_gear
      applies_to: "capture"
      rule: "capture is the technology parent. Trap/pot deployment, bait, rope/buoy, soak and retrieval differ from line, dip-net or scrape effort, inventory and habitat-contact evidence. One deployment has one actual gear method; distinct methods may coexist in a trip only as separately indexed effort/catch records. Current operator and gear evidence, not a route label, establishes deltas."
      source_ids:
        - wild-crab-foreground-method
    - rule_id: boundary_water
      applies_to: "live_hold; fresh_chill; presentation"
      rule: "Keep purchased water, direct withdrawal, internal circulation, evaporation, stock change, collected effluent and direct returns distinct. Dissolved pollutant mass and water carrier mass are not duplicate exchanges; keep direct substances separate by actual chemical basis and compartment. Cleaning is not assumed depuration or food-safety certification."
      source_ids:
        - wild-crab-foreground-method
    - rule_id: boundary_shared
      applies_to: "capture; grading; live_hold; fresh_chill; presentation"
      rule: "Index the shared vessel/deck, tanks, dock cold room, ice maker and returnable containers by actual consuming nodes and service periods. One asset or operated service event has one burden owner and a complete allocation ledger. Meter own auxiliary power/ice inside its owner node; do not add purchased power/ice for the same own output or duplicate downstream service fuel."
      source_ids:
        - wild-crab-foreground-method
    - rule_id: boundary_secondary_bait
      applies_to: "capture"
      rule: "Processing-by-product bait is secondary material from a prior product system, not a free wild resource. Identify the actual prior product, separation/recovery handoff, preservation/transport and present baiting gate from supplier evidence. The experimental literature supports route existence only, not the current lot composition/performance. This conditional interface is inactive where no such input occurs."
      source_ids:
        - cerbule-secondary-bait-2023
        - wild-crab-foreground-method
boundary_abstraction:
  declared_starting_condition: "Wild crabs and incidental taxa in the declared natural waterbody before actual capture; no owned rearing/growth stage"
  starting_condition_role: "Natural capture context, not a purchased zero-burden food crab"
  product_classification_scope: "Whole wild in-shell food crabs only; narrower than CPC 3.0 04311"
  recursive_input_rule: "A same-category crab purchased as bait is a separately identified supplier input with prior capture burden and non-reference use, not recursive generation of this food output; already-marketed crabs for resale are outside the first-producer reference route"
  upstream_dataset_requirement: "Require compatible upstream bait/feed, fuel/electricity, gear/asset, packaging, water/gas and treatment datasets or measured supplier packages at actual gate/state; unresolved inputs retain gaps, never zero burden"
  disclosure: "Declare producer/operating unit, habitat/species/gear, actual node ownership/activation, first gate, time/stock boundaries, bycatch and releases, all intended outputs and attribution; no federated multisite average"
