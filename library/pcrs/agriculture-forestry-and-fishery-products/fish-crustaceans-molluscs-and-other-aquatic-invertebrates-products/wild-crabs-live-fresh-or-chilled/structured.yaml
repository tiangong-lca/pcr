validation_rules:
  - rule_id: validate_identity
    applies_to: "reference lot"
    rule: "Verify wild provenance, actual species/habitat, whole-body/native-shell and appendage condition, shell/molt and food grade, actual live/fresh/chilled state and the first gate. Refuse detached parts, cooked/frozen meat and managed-growth/molt lots. Missing actual state/gate or food acceptance blocks the final reference, not an assumed live/default route."
    source_ids:
      - wild-crab-foreground-method
  - rule_id: validate_balance
    applies_to: "all nodes"
    rule: "Check species/state-specific opening stock + receipts = accepted transfers + other intended outputs + actual losses/releases + closing stock, adjusted only for separately measured water or material changes. Pair internal transfers once and require nonnegative exchanges. A 1 kg final denominator does not fix upstream catch or live intake to 1 kg."
    source_ids:
      - wild-crab-foreground-method
  - rule_id: validate_technology
    applies_to: "capture"
    rule: "Reconcile gear deployed/retrieved/lost/recovered and bait charged/retrieved/consumed/remaining by deployment. Preserve observed ghost-fishing, entanglement, bottom contact and unknown fate outside mere mass totals. Confirm every claimed non-pot delta using actual method-specific effort, catch and impact records; no borrowed stock-status, sustainable-fishery or universal no-habitat-effect claim."
    source_ids:
      - wild-crab-foreground-method
  - rule_id: validate_hold_state
    applies_to: "live_hold; fresh_chill; presentation"
    rule: "Live survivors, eligible fresh diversions and nonqualifying mortality are disjoint. Fresh diversion requires separately documented actual death/handling history and lawful acceptance; unknown deaths remain a gap or reject. Check node activation, before/after states, lot time and bypass transfer equivalence. Neither zero-duration holding nor unobserved feed/gas/effluent may be inferred from missing logs."
    source_ids:
      - wild-crab-foreground-method
  - rule_id: validate_ranges
    applies_to: "all cards"
    rule: "For supplied nonfinal Ranges verify the same numerator unit per 1 kg reference flow and independent U_row evidence under reference_envelope. Cards without Ranges record an unresolved independent range-evidence need, not a claim that a protocol-derived interval already exists. Before numerical QA establish the instance envelope from a separate representative campaign or supplier evidence, retaining scope, sample size and uncertainty; absent evidence is a gap, never QA-cleared, a default quantity or zero. Preserve and investigate real outliers without clipping. Final 1..1 kg is reference normalization only."
    source_ids:
      - wild-crab-foreground-method
  - rule_id: validate_ownership
    applies_to: "all nodes"
    rule: "Check all intended outputs/handoffs, failed-trip burden, stock carryover, shared-node/period shares and packaging returns. One physical fuel, water, operating-service or asset event has one burden owner; upstream supplier burdens and actual direct releases cannot be omitted or duplicated. Check material and water ledgers separately from pollutant/species ledgers."
    source_ids:
      - wild-crab-foreground-method
  - rule_id: validate_binding
    applies_to: "all exchanges"
    rule: "Resolve each actual exchange to a separately confirmed concrete identity, property, unit and relevant geography/state/compartment before downstream process publication. Conditional collection obligations in Section 8 may instantiate multiple actual substances/materials, never a fixed generic UUID. Exact fixed electricity/ice/CO2 cards apply only to their declared conditions; quantity factors require independent evidence. Identity and measurement validation do not certify food safety or fishery sustainability."
    source_ids:
      - wild-crab-foreground-method
  - rule_id: validate_secondary_bait
    applies_to: "capture_bait"
    rule: "Check prior system, recovery/supply handoffs, actual composition/state, inheritance/cut-off decision and duplicate burdens. Missing supplier evidence remains a gap; do not import experimental catch efficiency, sustainability assertions or negative-carbon credit."
    source_ids:
      - cerbule-secondary-bait-2023
      - wild-crab-foreground-method
  - rule_id: validate_inventory_completion
    applies_to: "all concrete exchanges and section 8 completion obligations"
    rule: "Verify each applicable dq_complete obligation has separately measured and identity-verified exchange cards. Check each quantity, native unit, range evidence, normalization, receiving medium, destination and non-duplication. Any unfulfilled actual child exchange, quantity, identity or destination makes the final dataset incomplete and fails validation; unknown cannot be zero. Static PCR checking does not replace this evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground wild-capture whole-food-crab production package at the declared first handover"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual matching wild species/habitat/gear and whole-food state/gate as declared, with verified concrete downstream exchanges and complete amounts"
  excluded_use: "Meat/parts, aquaculture/induced molt/growth, frozen/cooked product, retail gate, edible-portion conversion, sustainability or food-safety certification"
  required_metadata: "All reference qualifiers; operating unit; actual node activation; transfer/state/ownership ledgers; reporting/stock/asset periods; intended outputs and allocation"
  required_quality_disclosure: "Identity and range gaps, qualitative source limits, measurement/sampling uncertainty, actual upstream coverage, uncharacterized ecological effects and alternative allocation sensitivity"
  update_trigger: "Changed species/gear/body-state/gate, holding/chilling route, jurisdictional acceptance, supplier/energy mix, mortality/bycatch pattern, asset service period or new quantitative/identity evidence"
