  what: "Whole wild food crabs in shell at first producer handover, actual live/fresh/chilled state declared"
  how_much: "1 kg wet net whole-crab mass"
  how_well: "Actual whole body/carapace in native shell and appendage condition; declared species, shell/molt grade, viability/life state, temperature state and documented food acceptance; exclude extraneous water, ice and packaging"
  how_long_or_cycle: "Declared capture trips/deployments, actual pre-gate holding/handling batches and first handover dates within one reporting period; retain opening/closing stock and prior/later asset service periods"
