system_boundary:
  rules:
    - rule_id: boundary_entry
      applies_to: "applicable nodes and complete foreground package"
      rule: "Include actual owned stages from wild-spat collection or owned broodstock/egg/larval entry, or purchase at its documented stage, through managed grow-out, separate harvest and first producer handover. Purchased eyed larvae enter settlement; purchased settled spat enter actual nursery or directly grow-out; purchased grow-out-ready seed bypasses collection/hatchery/settlement/nursery that did not happen. No purchase is burden-free."
      source_ids:
        - farmed-oyster-foreground-method
        - fao-oyster-production
    - rule_id: boundary_live
      applies_to: "applicable nodes and complete foreground package"
      rule: "Only the final living in-native-shell food oyster mass qualifies. External attached cultch, biofouling, sediments, free water, coolant and packaging are excluded; native shell, tissue and naturally retained body fluids stay included. Dead, shucked, frozen/cooked, pearl/shell-only, final seed and wild adult products are outside this category."
      source_ids:
        - farmed-oyster-foreground-method
        - un-cpc-3-oysters
    - rule_id: boundary_route
      applies_to: "applicable nodes and complete foreground package"
      rule: "Managed biological parents are algal culture, hatchery/settlement/nursery and grow-out. Wild-spat and hatchery-origin cohorts are alternative entry routes, not two supplies for one animal. Bottom/off-bottom/suspended technology deltas belong to growout and actual collection/harvest techniques to their own parents. Record actual changes in equipment, energy, substrate, water, loss, monitoring and stock bookkeeping; technologies coexist only with disjoint sublots or explicit periods."
      source_ids:
        - farmed-oyster-foreground-method
        - fao-oyster-production
    - rule_id: boundary_handoffs
      applies_to: "applicable nodes and complete foreground package"
      rule: "Connect harvest, conditioning, grading, depuration and live_holding in actual event order, not the table order. Each revisit has distinct event_id/pass_id/transfer_id; an intake receives only its immediately preceding actual transfer in the same cohort/state and measured amount. Preserve pending grade, accepted grade, pending treatment and actual release qualifiers. At least one actual grading event and first-gate acceptance must be completed; pending required treatment or unknown state cannot be final accepted food mass. Bypasses invent no resources and revisited nodes repeat neither historic burden nor the same event; record an actual new grading event if a later intervention requires reinspection."
      source_ids:
        - farmed-oyster-foreground-method
    - rule_id: boundary_depuration
      applies_to: "applicable nodes and complete foreground package"
      rule: "Washing/desanding and sanitary depuration/relaying are different responsibilities. Include only actual producer-responsible pre-gate treatment and its applicable authorization, release evidence, water, energy, consumables, effluents and losses. Unknown treatment responsibility or acceptance is unresolved, not automatic bypass. If actual first gate precedes independent buyer treatment, exclude buyer treatment and disclose restrictions; the PCR does not certify safety or universal toxin removal."
      source_ids:
        - farmed-oyster-foreground-method
        - fda-nssp-context
    - rule_id: boundary_inputs
      applies_to: "applicable nodes and complete foreground package"
      rule: "Purchased stage inputs need upstream datasets at matching species, stage, carrier/substrate, geography and burden boundary. Own algal production and supply are a paired internal chain, not purchased feed plus duplicate own burden. Open-water natural phytoplankton is an environmental biological contribution, not a fabricated purchased feed; hatchery/controlled nursery feed and fertilization remain actual inputs."
      source_ids:
        - farmed-oyster-foreground-method
    - rule_id: boundary_secondary
      applies_to: "applicable nodes and complete foreground package"
      rule: "Recovered shell cultch is secondary material because it crosses from a prior shell-producing/recovery system. Declare origin and its recovery/cleaning/transport handoff, retained burdens versus explicitly justified cut-off, and count collection/preparation in exactly one system. Do not assume free shell or include external shell in live oyster reference mass."
      source_ids:
        - farmed-oyster-foreground-method
    - rule_id: boundary_services
      applies_to: "applicable nodes and complete foreground package"
      rule: "Use one declared producer operating unit with batch/cohort and reporting-period indices. Include attributable boats, pumps, tanks, racks, depuration/holding and dispatch assets, cleaning/changeovers, repairs and retirement. For external service use its actual quantity/property and invoice scope; if its dataset includes fuel or equipment, do not repeat them as owned inventory. No federated multisite average or speculative universal service share."
      source_ids:
        - farmed-oyster-foreground-method
    - rule_id: boundary_credits
      applies_to: "applicable nodes and complete foreground package"
      rule: "Record actual direct water discharge, biodeposition, lost gear, mortality and bottom-contact evidence with actual substance and receiving medium. No automatic carbon sequestration, shell-carbon, avoided waste, nutrient-removal or ecosystem-service negative credit. Any later impact claim requires separately governed complete method, counterfactual and measured evidence, outside this default inventory."
      source_ids:
        - farmed-oyster-foreground-method
boundary_abstraction:
  declared_starting_condition: "Actual owned wild-spat collection or early-life entry, or actual handover stage of purchased eggs/larvae/spat/seed carrying matching upstream burden"
  starting_condition_role: "cohort-, stage- and responsibility-specific foreground entry, not a zero-burden assumption for absent stages"
  product_classification_scope: "narrower live native-shell food first-handover subset of CPC 04422"
  recursive_input_rule: "Same-category oyster seed/broodstock inputs retain actual upstream stage and identity; stop recursive expansion without deleting existing burden. Internal returns carry the same cohort stock, not a new purchase or second production."
  upstream_dataset_requirement: "Upstream data matching supplier stage, species, location, transport carrier, substrate and responsibility; disclose gaps/substitutes/uncertainty, never default zero"
  disclosure: "Cohort-specific actual stages/bypasses, parent technology deltas, one gate, periods/asset service, live net mass, purchase burdens, depuration responsibility and acceptance limitations"
