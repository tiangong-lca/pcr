allocation_rules:
  - rule_id: allocation_output
    applies_to: "applicable nodes and complete foreground package"
    rule: "Enumerate actual intended final food grades, independent sold seed/broodstock or other live products with their own gate; distinguish internal seed, live undersize returns, stock, waste and environmental losses. Subdivide measured operations first. For unavoidable shared production choose a documented causal physical driver; if no defensible physical relationship exists, use matched-period economic value with actual comparable net prices and sensitivity. Do not simultaneously credit substitution or change methods between nodes to minimize the reference burden."
    source_ids:
      - farmed-oyster-foreground-method
  - rule_id: allocation_period
    applies_to: "applicable nodes and complete foreground package"
    rule: "Link all cohorts from collection/early-life through harvest, plus opening/closing standing animals and accumulated burden, asset acquisition/replacement/retirement and cleaning events, across their actual periods. Allocate measured asset service by actual lifetime service units/usage, revising estimates with retirement evidence; carry unharvested/returned stock burden forward and reconcile opening plus additions with exported, lost and closing burden. No arbitrary universal lifetime or annual yield."
    source_ids:
      - farmed-oyster-foreground-method
  - rule_id: allocation_shared
    applies_to: "applicable nodes and complete foreground package"
    rule: "For shared boats, pumps, water treatment, tanks, stores and crates list consuming nodes and periods with event/asset id. Assign measured operating hour, metered volume/energy, area-time or other causal service share once; shares over all consumers reconcile to one total. Keep each node own protocol but not duplicate common raw event. External services and owned operation are mutually exclusive for the same supplied scope."
    source_ids:
      - farmed-oyster-foreground-method
  - rule_id: allocation_returns
    applies_to: "applicable nodes and complete foreground package"
    rule: "Live grading undersize returns remain cohort stock, paired to growout_returns; retained seed/broodstock similarly carry historic burden without a new sale, purchase or full crop reset. Add actual extra grow-out/rehandling resources and mortality on return, do not divide the same original burden into the loop twice. Dead/rejected material never counts toward final live mass; actual treatment burdens remain in the producing lot unless explicit coproduct subdivision evidence supports otherwise."
    source_ids:
      - farmed-oyster-foreground-method
  - rule_id: allocation_secondary
    applies_to: "applicable nodes and complete foreground package"
    rule: "Apply the declared secondary-shell inheritance/cut-off at its actual recovery handoff consistently to purchased and own recovered material, disclose prior and current preparation burdens and test double counting. Shell attached to marketed oyster has no separate shell coproduct until actually separated and exported; native shell stays in whole product, so no fictitious shell sale or sequestration credit."
    source_ids:
      - farmed-oyster-foreground-method
