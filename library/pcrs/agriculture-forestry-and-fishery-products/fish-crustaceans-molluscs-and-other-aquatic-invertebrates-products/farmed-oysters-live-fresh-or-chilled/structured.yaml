  calculation_rules:
    - id: foreground_normalization
      applies_to: "all non-final inventory rows"
      rule: "Keep two explicitly labelled views. First reconcile unallocated physical receipts, transfers, products, losses and stocks for the complete declared cohort/trip/run; pair internal transfers in the same state and unit, retaining their measured mass. Assign shared resource/service events to actual consuming nodes and periods once using evidenced service shares, without shrinking product, biomass, water or waste partitions by a co-product share. Divide this physical inventory by the matching positive accepted final net kg. Separately derive a labelled single-output LCA burden/inventory projection using section 7 co-product allocation exactly once, retaining the unallocated inventory and allocation matrix. Never test allocated exchanges against an unallocated physical balance, apply output shares again downstream, or set an internal quantity to the final 1 kg."
      inputs:
        - "node quantities/attribution ledger"
        - "cp_dispatch_mass accepted net mass"
        - "corresponding node protocol"
      output: "actual exchanges per 1 kg reference flow"
      source_ids:
        - farmed-oyster-foreground-method
    - id: stage_mass_conversion
      applies_to: "seed and stock counts"
      rule: "Stage net biomass = actual count × representative individual net mass of matching cohort/stage/state; exclude external cultch and propagate sampling error. Only measured stage samples support conversion, not meat yield."
      inputs:
        - "actual counts"
        - "representative weighed samples"
        - "cultch tare and node protocol"
      output: "stage net mass and uncertainty"
      source_ids:
        - farmed-oyster-foreground-method
    - id: emission_accounting
      applies_to: "actual node fossil_co2 and other direct emission cards"
      rule: "Compute direct fossil carbon dioxide from actual fuel/carbon/oxidation evidence or declared factor matched to actual technology/fuel/period; separate biogenic carbon and other exact substances. Then apply node attribution and accepted final net-mass normalization; no universal default emission factor."
      inputs:
        - "node fuel"
        - "fossil carbon"
        - "oxidation or actual factor source"
        - "receiving compartment and matching mass protocol"
      output: "medium-specific direct emitted mass and uncertainty"
      source_ids:
        - farmed-oyster-foreground-method
    - id: cohort_stock_reconciliation
      applies_to: "cohort and return stock"
      rule: "For each cohort reconcile opening live count + actual entries = harvested/exported + mortality/other losses + closing live count; biomass separately includes growth and actual inputs/outputs, without equal mass across growth. Independently reconcile accumulated burden opening + additions = exported attribution + loss attribution + closing carryover; internal loops create no purchase or reference sale."
      inputs:
        - "node cohort counts/mass"
