validation_rules:
  - rule_id: validate_scope
    applies_to: "applicable nodes and complete foreground package"
    rule: "Verify species, farmed origin, live state and native-shell net mass at the one actual producer gate. Missing actual acceptance or applicable legal evidence blocks a food-use claim; live status alone is insufficient. Final seed, wild adult, dead, shucked, cooked and frozen output are outside scope."
    source_ids:
      - farmed-oyster-foreground-method
  - rule_id: validate_routes
    applies_to: "applicable nodes and complete foreground package"
    rule: "Reconstruct actual cohort entry stage and ordered node path, including every active optional intervention and bypass. Purchased larvae/spat/seed skip absent earlier stages but retain supplier burdens; no mandatory nursery or depuration from a classification label. Resolve unknown stage/treatment state before final data use. Check every claimed technology delta against actual equipment, input category, stock and monitoring evidence."
    source_ids:
      - farmed-oyster-foreground-method
  - rule_id: validate_transfers
    applies_to: "applicable nodes and complete foreground package"
    rule: "Pair every internal output/input at the same actual state, measured quantity and uncertainty. Exclude external cultch and free carrier water identically only for oyster biological net-mass interfaces. For wet algal-culture feed and other supplied materials preserve the same actual wet mass, dry matter, concentration and carrier basis at both ends, retaining carrier water in composition subledgers without a duplicate water exchange. Actual losses, flows and stocks explain differences. Match undersize/broodstock loops without accepted-sales attribution; shell-bearing stock is not constant mass during growth. Normalize only to positive accepted final live net mass; no-output/dead-crop periods retain documented burdens, never divide by zero or omit failed production."
    source_ids:
      - farmed-oyster-foreground-method
  - rule_id: validate_water
    applies_to: "applicable nodes and complete foreground package"
    rule: "Reconcile abstracted/supplied water, recirculation, carried feed/product water, evaporation, treatment exports, direct returns/discharges and tank stock changes by node. Record elemental nutrient/pollutant mass basis separately from bulk water, do not add both full wastewater and identical direct discharge or count each recirculation pass as new input."
    source_ids:
      - farmed-oyster-foreground-method
  - rule_id: validate_resources
    applies_to: "applicable nodes and complete foreground package"
    rule: "Reconcile each utility meter, fuel stock, invoice and asset/event owner across all node consumers/periods. Purchased service includes no second identical own fuel; own generation includes fuel and direct emissions once and no duplicate grid purchase. Only exact actual CN low-voltage consumption uses that fixed flow; only actual supplied treated water uses its fixed identity."
    source_ids:
      - farmed-oyster-foreground-method
  - rule_id: validate_ranges
    applies_to: "applicable nodes and complete foreground package"
    rule: "Review supplied Ranges as provisional reasoned screening envelopes, not measured yields, default inventories or universal limits. Cards without numerical Ranges retain their own independent range or measurement-uncertainty collection duty; never copy a removed mixed-stream range to children. Final exchange completion requires independently supported actual quantity and range/uncertainty evidence for each stream. Numerical QA needs independent comparable campaigns/samples and documented actual state, not the tested batch maximum. Preserve genuine outliers; final 1 kg is normalization only."
    source_ids:
      - farmed-oyster-foreground-method
  - rule_id: validate_identities
    applies_to: "applicable nodes and complete foreground package"
    rule: "Resolve each concrete foreground exchange to its verified exact physical identity, property/unit and destination before downstream dataset publication; semantic umbrellas may generate zero/one/multiple actual exchanges, never one fabricated universal identity. Identity evidence never supplies emission factors, densities, shelf life or sanitation validity."
    source_ids:
      - farmed-oyster-foreground-method
  - rule_id: validate_credits
    applies_to: "applicable nodes and complete foreground package"
    rule: "Require actual losses/discharges/gear and site impact evidence with uncertainty; do not cancel them against general qualitative ecosystem benefits. No automatic negative shell-carbon, nutrient, waste or habitat credits. Check node-local protocol ownership, bilingual machine fields and current deterministic projection."
    source_ids:
      - farmed-oyster-foreground-method
  - rule_id: validate_inventory_completion
    applies_to: "all concrete exchanges and section 8 completion obligations"
    rule: "Verify each applicable dq_complete obligation has separately measured and identity-verified exchange cards. Check each quantity, native unit, range evidence, normalization, receiving medium, destination and non-duplication. Any unfulfilled actual child exchange, quantity, identity or destination makes the final dataset incomplete and fails validation; unknown cannot be zero. Static PCR checking does not replace this evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground live food-oyster production package of one declared operating unit, actual cohorts and responsibility boundary"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "foreground and downstream process/lifecycle-model projections with matching species, live native-shell net mass, production stages and gate semantics"
  excluded_use: "automatic mismatched-state/geography proxy; meat mass, wild adults, final seed or processed oysters; default environmental credits; food safety certification or publication of unverified final exchanges"
  required_metadata: "species, site/waterbody, cohort/dates, actual technology stages/bypasses, supplier entry, final gate, live grade/net mass, treatment responsibility/acceptance, asset periods and allocation methods"
  required_quality_disclosure: "sampling/measurement uncertainty; purchased upstream completeness; unverified identities/gaps; provisional envelopes; cohort stock/returns/shared assets; environmental release and treatment limitations"
  update_trigger: "material change in species/site, seed entry, technology/equipment, responsibility/gate, live state, depuration rules, asset service, emission evidence, supplier or measured parameters"
