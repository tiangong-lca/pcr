      applies_to: "landing_preservation; inputs; product"
      requirement: "Identify and separately collect every actual exchange covered by “Actual cleaning or preservation materials”; retain all following collection, quantity and normalization obligations: Conditional collection scope for actual composition-specific cleaning material or refrigerant replacement/leak makeup. Record legitimate use and destination; no mandatory disinfection regimen or unproved chemical technology. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Measured actual separately identified material use Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_preservation Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
