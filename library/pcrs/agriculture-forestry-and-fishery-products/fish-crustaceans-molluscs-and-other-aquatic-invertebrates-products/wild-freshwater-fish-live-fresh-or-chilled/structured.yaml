validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Require wild freshwater food species and whole unprocessed actual live/fresh/chilled state; reject excluded farmed, ornamental, Salmonidae, frozen or processed substitutions."
    source_ids:
      - un-cpc3-notes
  - rule_id: validate_reference
    applies_to: "freshwater_landing_product"
    rule: "Require 1 kg accepted net fish and one actual first landing handover. Exclude carrier water, ice and packaging; same reference row applies to every declared state."
    source_ids:
      - net-mass-reference-definition
  - rule_id: validate_route
    applies_to: "process map and transfers"
    rule: "Require one evidenced incoming route at dispatch. Live and chilled preservation are mutually exclusive per reference lot; unknown actual state/operation blocks completion. Check actual transfer masses at both ends and bypass preservation only with immediate-fresh evidence."
    source_ids: []
  - rule_id: validate_resources
    applies_to: "capture and preservation"
    rule: "Require biomass removal, actual vessel/manual mode, complete fuel/gear/bait/utilities and attributable shared assets; no missing resource treated as zero. Separate supplied ice from on-site production and preserve actual supplier/geography/voltage identity."
    source_ids: []
  - rule_id: validate_environment
    applies_to: "elementary and waste cards"
    rule: "Require substance and receiving medium for direct emissions, actual factor/test basis, direct withdrawal/return versus supply/treatment pathways and actual waste recipients. Catch/habitat logs and method-coverage gaps must be disclosed; reject invented universal depletion or pollutant UUIDs."
    source_ids: []
  - rule_id: validate_outputs
    applies_to: "intended output set"
    rule: "Enumerate species/grade sales with handover, quantity and price, distinguish release/residue/waste, apply explicit allocation precedence and verify shares/reconciliation. One sale cannot be reported at multiple handovers; internal transfers have no output credit."
    source_ids: []
  - rule_id: validate_periods_shared
    applies_to: "assets and all processes"
    rule: "Link trips, campaign/continuous-period boundaries, cleaning/changeover, phases, replacement/retirement and all asset consumers; reject duplicate attribution of a common resource or asset across nodes/periods."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Require matched measurement/property/unit, per 1 kg reference flow basis, collection protocol and transparent density/energy or substance conversion where used. No unmeasured universal fish weight, yield, mortality, ice or fuel factor."
    source_ids: []
  - rule_id: validate_bindings_ranges
    applies_to: "all inventory rows"
    rule: "Confirm fixed identities against actual state, gate and support rows; expand conditional collection obligations with verified actual identities. Provisional reasoned ranges only screen records, cannot supply fabricated empirical values or truncate outliers."
    source_ids: []
  - rule_id: validate_inventory_completion
    applies_to: "all concrete exchanges and section 8 completion obligations"
    rule: "Verify each applicable dq_complete obligation has separately measured and identity-verified exchange cards. Check each quantity, native unit, range evidence, normalization, receiving medium, destination and non-duplication. Any unfulfilled actual child exchange, quantity, identity or destination makes the final dataset incomplete and fails validation; unknown cannot be zero. Static PCR checking does not replace this evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for wild freshwater whole-food-fish capture through first landing handover"
  downstream_use: "secondary_dataset; background_dataset; flow, process and lifecyclemodel projections only after actual concrete identities and data evidence are complete"
  allowed_use: "Declared species/waterbody, actual capture gear and reporting period, one actual live/fresh/chilled state and matched first landing gate; any aggregation preserves disclosed species/state/route shares"
  excluded_use: "Aquaculture; marine or brackish fish; ornamental/nonfood and Salmonidae references; processing/retail/cooking; universal fishery performance; equivalent edible service across species/states; claim of complete habitat/biodiversity assessment from resource-flow mapping alone"
  required_metadata: "Reference qualifiers; trips/campaign or continuous period; co-catch/loss/release ledger; preservation branch and time/viability records; asset consumers/service periods; actual utility and material supply; gate and accepted net biomass"
  required_quality_disclosure: "Data coverage and uncertainty; failed trips; allocation/period assumptions; stocked-source burden investigation; UUID gaps; provisional ranges; exhaust/water methods; actual wastes; excluded capital or direct impacts and LCIA coverage"
  update_trigger: "Changed species/origin/waterbody, gear/engine, actual state/gate, preservation mode, supplier/voltage, ice origin, survival/loss, shared-asset attribution, discharge route or new measured evidence"
data_sources:
  - id: "un-cpc3-notes"
    type: "official_guidance"
    reference: "United Nations, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed pp. 40–41. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification inclusion/exclusion only; no catch quantities or environmental factors"
  - id: "fao-inland-fisheries"
    type: "official_guidance"
    reference: "FAO, Inland Fisheries. https://www.fao.org/inland-fisheries/en/"
    used_for: "Extraction from inland waters and ecosystem context; freshwater restriction is defined separately in this PCR"
  - id: "fao-fish-handling"
    type: "handbook"
    reference: "FAO, The use of ice and chilled seawater on fishing vessels, chapter 4. https://www.fao.org/4/y5013e/y5013e07.htm"
    used_for: "Qualitative immediate handling, chilling and ice origin/service roles; marine examples, temperature prescriptions and quantitative ice ratios are not adopted as inland universal factors"
  - id: "fao-live-transport"
    type: "handbook"
    reference: "FAO, Transport of live fish. https://www.fao.org/4/T8389E/T8389E06.htm"
    used_for: "Qualitative live maintenance, oxygen/water handling and losses; no historical drug regimen or generic survival factor is adopted"
  - id: "net-mass-reference-definition"
    type: "method_factor"
    reference: "PCR sections 3–4: accepted net whole-fish reference normalization identity."
    used_for: "1 kg final accepted fish, exact 1–1 kg reference range and actual lot normalization; not an empirical fishery-performance dataset"
  - id: "ghg-product-allocation"
    type: "standard"
    reference: "GHG Protocol Product Life Cycle Accounting and Reporting Standard, chapter 9, allocation. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf (retrieved 2026-10-09)"
    used_for: "Allocation policy: subdivision, causal physical relation, disclosed economic fallback; no fishery performance factors"
