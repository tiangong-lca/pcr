    - id: dq_complete_preservation_other_emissions
      applies_to: "landing_preservation; outputs; elementary"
      requirement: "Identify and separately collect every actual exchange covered by “Other actual preservation-engine pollutants to air”; retain all following collection, quantity and normalization obligations: Expand separately for actual carbon monoxide and other measured or factor-supported pollutant substances, retaining NOx reporting basis and particulate size. Match the actual preservation engine/fuel/test and receiving air compartment; do not reuse capture activity amounts. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Measured or traceably calculated pollutant substance mass from the actual preservation engine Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_preservation_combustion Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
