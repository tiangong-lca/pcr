    - id: dq_complete_other_capture_energy
      applies_to: "inland_capture; inputs; product"
      requirement: "Identify and separately collect every actual exchange covered by “Other actual capture fuels”; retain all following collection, quantity and normalization obligations: Conditional collection scope for actual petrol or another liquid/solid fuel. Expand into separately measured materials with matching upstream supply; purchased electricity has its own energy card, and the freshwater-vessel diesel identity is not universal. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Measured actual liquid or solid fuel mass Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_capture_energy Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
