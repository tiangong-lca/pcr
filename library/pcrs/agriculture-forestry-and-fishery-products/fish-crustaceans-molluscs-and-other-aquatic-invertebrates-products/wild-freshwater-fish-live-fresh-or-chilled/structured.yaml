      requirement: "Identify and separately collect every actual exchange covered by “Actual substances in direct discharge or refrigerant leakage”; retain all following collection, quantity and normalization obligations: Expand each evidenced pollutant into its substance, receiving medium and measured concentration/load; distinguish phosphorus element from phosphate species and preserve nitrogen basis. Track actual refrigerant species leaked to air separately. No generic effluent pollutant UUID or assumed composition. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Measured substance-specific direct emission mass Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_water_landing_preservation Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
