      raw_fields: "asset_id; material; acquisition; service life; use hours/cycles; consumers; periods; replacements; retirement; waste destination ; unique original shared-ledger ID; this node actual share; all-beneficiary reconciliation"
      collection_method: "Record actual service and material replacements; match component inventory or upstream asset dataset and documented service attribution. ; use the same original shared ledger and independently reconcile this node share, never copy another node total or charge the same burden twice."
