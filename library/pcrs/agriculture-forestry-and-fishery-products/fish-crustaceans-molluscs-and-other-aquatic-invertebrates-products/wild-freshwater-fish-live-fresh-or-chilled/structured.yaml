    - id: dq_complete_other_capture_emissions
      applies_to: "inland_capture; outputs; elementary"
      requirement: "Identify and separately collect every actual exchange covered by “Other evidenced combustion or gear-loss substances”; retain all following collection, quantity and normalization obligations: Expand the conditional card only from actual substance-resolved records: for example nitrogen dioxide when reported as that substance, or identified lost polymer. Preserve NOx reporting basis and particulate size; do not relabel NOx totals as nitrogen dioxide molecules or use a generic pollution UUID. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Measured actual substance mass with medium and factor basis retained Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_combustion Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
