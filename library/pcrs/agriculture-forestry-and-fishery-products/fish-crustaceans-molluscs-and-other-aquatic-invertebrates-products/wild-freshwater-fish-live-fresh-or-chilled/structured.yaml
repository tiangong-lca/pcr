      collection_method: "Use calibrated weighed catch/landing records and traceable species/catch logs; state estimates and uncertainty for released/escaped fish; reconcile resource removal and destinations."
      unit: "kg"
      frequency: "each trip and lot"
      temporal_coverage: "capture through same landing"
      site_scope: "named freshwater fishery"
      aggregation_rule: "per 1 kg reference flow"
