      requirement: "Identify and separately collect every actual exchange covered by “Spent fishing gear sent to waste treatment”; retain all following collection, quantity and normalization obligations: Record composition-specific gear delivered to collection, recycling or disposal. Lost gear is excluded from this treatment quantity and traced separately. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Weighed spent gear share with receiver evidence Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_assets_inland_capture Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
