system_boundary:
  rules:
    - rule_id: boundary_capture
      applies_to: "inland_capture"
      rule: "Include biomass removal, fishing effort, fuel combustion, bait, material/gear replacement, co-catch, actual losses and trip return to first landing. Capture removes natural fish; preservation only stabilizes an already collected product."
      source_ids:
        - fao-inland-fisheries
    - rule_id: boundary_preservation
      applies_to: "landing_preservation"
      rule: "Include actual on-board and landing live maintenance or chilling before handover. Record usable state before and after intervention, its resources, losses and handover to dispatch. Immediate fresh landing can bypass only on evidence."
      source_ids:
        - fao-fish-handling
        - fao-live-transport
    - rule_id: boundary_ice
      applies_to: "supplied_chilling_ice; supplied_process_water; cn_low_voltage_electricity; other_preservation_energy"
      rule: "For purchased ice include matched supplier production once. For on-site ice include its actual water, energy, equipment and refrigerant burdens here, keep the internal ice production/use ledger and exclude a second purchased-ice burden for that amount."
      source_ids:
        - fao-fish-handling
    - rule_id: boundary_dispatch
      applies_to: "landing_dispatch"
      rule: "Include presentation/packing actually performed before first collector/buyer handover; record pre-pack fish state, package protection roles and reusable-container status. Exclude subsequent distribution, processing and cooking."
      source_ids: []
    - rule_id: boundary_assets
      applies_to: "capture_gear; spent_gear; dispatch_packaging; all processes"
      rule: "Inventory actual shared vessel, tank, ice machine, landing utilities and returnable boxes; record consuming nodes and periods, lifetime/service-use evidence, replacements and retirement. Include attributable upstream asset/service burdens through separately identified concrete exchanges and disclose justified exclusions."
      source_ids: []
    - rule_id: boundary_environment
      applies_to: "all processes"
      rule: "Track retained, released, escaped and dead catch; habitat interactions and lost gear; actual abstraction and discharge; combustion and refrigerant emissions. Species/population and gear-impact records accompany the LCI. A resource-flow exchange alone does not characterize biodiversity, depletion or habitat impact; disclose LCIA method coverage and gaps."
      source_ids:
        - fao-inland-fisheries
boundary_abstraction:
  declared_starting_condition: "Wild fish population in a declared natural freshwater waterbody, prior to capture; capture biomass removal and actual resources are recorded"
  starting_condition_role: "Natural resource starting context, followed by measured capture; not managed aquaculture or a burden-free fish purchase"
  product_classification_scope: "Semantic wild freshwater whole-food-fish category, linked to CPC 3.0 04211 without treating its classification as the route definition"
  recursive_input_rule: "If previously landed whole fish are purchased for additional handling, retain supplier capture/landing burdens once and declare the extended gate. Do not relabel that purchase as new local capture or use this first-landing output without matched boundary evidence."
  upstream_dataset_requirement: "Matched supply datasets for fuels, bait, gear, water, electricity, ice, oxygen, materials and assets; origin-enhanced/stocked fisheries disclose and investigate attributable upstream stocking rather than assigning zero automatically"
  disclosure: "Species, habitat, wild/stocked provenance, gear and habitat interaction, vessel/manual mode, periods, shared assets, bycatch releases, actual preservation and gate, emissions and water accounting, exclusions and missing impact characterization"
