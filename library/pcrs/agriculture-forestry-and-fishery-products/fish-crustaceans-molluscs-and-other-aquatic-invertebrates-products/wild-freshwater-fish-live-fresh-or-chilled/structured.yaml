    - id: dq_complete_capture_bait
      applies_to: "inland_capture; inputs; product"
      requirement: "Identify and separately collect every actual exchange covered by “Actual fishing bait”; retain all following collection, quantity and normalization obligations: Conditional on baited gear. Record species or material, state and supplier; retain upstream catch or production burdens and bait lost in water. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Measured bait supplied to actual trips Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_capture_materials Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
