    - id: dq_complete_capture_gear
      applies_to: "inland_capture; inputs; product"
      requirement: "Identify and separately collect every actual exchange covered by “Fishing gear material replacements”; retain all following collection, quantity and normalization obligations: Record actual net, line and other material replacements by composition, service use and consuming periods. This collection obligation requires separate actual component exchanges, not a universal nylon material. Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg Amount rule: Measured replacement material share attributed to this trip and output Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1 kg reference flow Basis kind: Reference flow (reference_flow) Evidence kind: Collected record (collected_record) Collection protocol: cp_assets_inland_capture Establish native units, measured quantities, destinations and independent range evidence for each concrete exchange. This completion requirement supplies no child quantity, default or allowed range; establish each child range independently. No actual exchange may be omitted."
