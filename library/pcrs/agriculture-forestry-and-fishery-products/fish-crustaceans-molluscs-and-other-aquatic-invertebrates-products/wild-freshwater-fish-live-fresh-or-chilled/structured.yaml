allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "all processes"
    rule: "Separate species/grade lots and independently metered activities first. Assign directly traceable resource use and quality losses to their actual lot; enumerate every saleable retained species/grade and its first handover."
    source_ids:
      - ghg-product-allocation
  - rule_id: allocation_residual
    applies_to: "shared trip and landing burdens"
    rule: "For indivisible residual burdens use evidenced causal shares when a defensible relation is demonstrated. Otherwise disclose economic shares based on contemporaneous landed species/grade revenue, reporting all output quantities, prices and sensitivity. Shares across consuming outputs sum to one; no universal allocation fraction is supplied."
    source_ids:
      - ghg-product-allocation
  - rule_id: allocation_losses
    applies_to: "all catch and waste"
    rule: "Include resources consumed before mortality/rejection in the successful and other intended outputs' burden accounting. Give no substitution credit to released, escaped or discarded fish. Only actual lawful sales are co-products; internal transfers cancel across nodes and receive no sale credit."
    source_ids: []
  - rule_id: allocation_period
    applies_to: "assets and all processes"
    rule: "Identify construction/service, maintenance/replacement and retirement phases and actual trips/reporting periods. Allocate actual gear, vessel, ice machine, holding-tank and box service by documented usage/lifetime; retain opening/closing stock, replacement and termination evidence. Do not charge the same replacement in multiple periods."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "shared infrastructure and services"
    rule: "List each actual shared asset/service with all consuming nodes/lots and periods; assign metered use or evidenced service shares once. Record unused/standby and cleaning/changeover treatment. Account once for the same ice supply, fuel combustion, water, tank or container burden across nodes."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture_energy
      process_id: "inland_capture"
      flow_role: "capture_diesel; other_capture_energy; other_capture_electricity"
      record_type: "meter and fuel ledger"
      raw_fields: "trip_id; engine; fuel composition; purchases; tank opening/closing; replenishment; actual consumption; alternate energy"
      collection_method: "Reconcile bunkering/tank records with trip meters; preserve density evidence for volume invoices and actual supply identity."
      unit: "kg; kWh"
      frequency: "each trip"
      temporal_coverage: "matched campaign"
      site_scope: "actual vessel or shore operation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoice; meter calibration; trip ledger"
    - protocol_id: cp_capture_materials
      process_id: "inland_capture"
      flow_role: "capture_bait"
      record_type: "material ledger"
      raw_fields: "trip_id; bait species/composition; supplier; supplied and unused amount; loss destination"
      collection_method: "Weigh real bait inputs and residuals; retain matched upstream source."
      unit: "kg"
      frequency: "each trip"
      temporal_coverage: "matched campaign"
      site_scope: "actual fishing gear"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing record; invoice; supplier origin"
