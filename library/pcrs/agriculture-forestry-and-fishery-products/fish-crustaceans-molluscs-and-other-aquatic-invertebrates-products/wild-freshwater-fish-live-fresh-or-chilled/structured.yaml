    - protocol_id: cp_preservation_combustion
      process_id: "landing_preservation"
      flow_role: "preservation_fossil_co2; preservation_other_emissions"
      record_type: "measurement or factor calculation"
      raw_fields: "lot_id; refrigeration/ice engine; fuel mass and fossil carbon; pollutant; air compartment; test/factor source/version/denominator; uncertainty"
      collection_method: "Use actual preservation-engine tests or an applicable traceable factor with independently measured engine activity; retain substance and basis, no duplication with capture fuel or supplier electricity/ice."
      unit: "kg"
      frequency: "each actual engine/lot"
      temporal_coverage: "matched landing period"
      site_scope: "actual preservation engines"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "engine test or factor source; fuel/meter reconciliation"
    - protocol_id: cp_dispatch
      process_id: "landing_dispatch"
      flow_role: "dispatch_lot; dispatch_packaging; freshwater_landing_product; packaging_rejects; dispatch_fish_rejects"
      record_type: "accepted handover ledger"
      raw_fields: "lot_id; actual input route/state; species/grade; gross/tare/accepted net fish mass; ice/water/container mass; buyer/gate/time; prices; component mass/reuse; reject destinations"
      collection_method: "Weigh accepted net whole-fish biomass on a calibrated scale excluding ice, carrier water and packaging; match acceptance and first landing receipt to lot and incoming transfer; weigh actual packaging and rejects."
      unit: "kg"
      frequency: "each handover lot"
      temporal_coverage: "same trip/landing campaign"
      site_scope: "first landing handover site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; acceptance/transfer receipt; actual-state and gate evidence"
  calculation_rules:
    - id: lot_normalization
      applies_to: "all inventory rows"
      rule: "Sum the actually attributable measured exchange for the closed lot/campaign and divide by the accepted net final whole-fish biomass of the same scope; report per 1 kg reference flow. Retain original totals and disclosed allocation shares."
      inputs:
        - "matched protocol records"
        - "accepted final net biomass"
        - "allocation ledger"
      output: "exchange per 1 kg reference flow"
      source_ids:
        - net-mass-reference-definition
    - id: water_reconciliation
      applies_to: "water ledger"
      rule: "Reconcile external supplied water plus direct abstraction and opening water with closing water, shipped carrier water, ice/melt, treatment transfer, direct return and evidenced evaporation/loss. Internal circulation is recorded but not an additional external input."
      inputs:
        - cp_water_landing_preservation
        - cp_water_landing_dispatch
        - cp_preservation
        - cp_dispatch
      output: "closed water ledger and uncertainty"
      source_ids: []
    - id: catch_reconciliation
      applies_to: "catch ledger"
      rule: "Reconcile retained target/co-catch, releases, escapes, dead material and opening/closing lot stock with captured organisms on one stated sampling/state basis. Internal transfers match both ends; no artificial 1 kg intermediate yield."
      inputs:
        - cp_catch
        - cp_preservation
        - cp_dispatch
      output: "matched biomass ledger with uncertainty"
      source_ids: []
    - id: combustion_calculation
      applies_to: "direct emissions"
      rule: "Apply a documented compatible substance-specific measured/factor method to actual fuel activity, preserving carbon source and denominator. Upstream supply and foreground engine emissions are separate datasets and must not overlap."
      inputs:
        - cp_capture_energy
        - cp_combustion
        - cp_preservation_energy
        - cp_preservation_combustion
        - "actual factor/test record"
      output: "substance/medium-specific mass per 1 kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "reference and catch"
      requirement: "Verify wild freshwater food origin, excluded species/product boundaries, declared actual state and same first landing handover."
      evidence: "species/origin logs; actual acceptance and gate records; un-cpc3-notes"
    - id: quality_completeness
      applies_to: "all processes"
      requirement: "Cover successful and zero/failed trips, all intended co-catch sales, releases, actual wastes, energy/water and material resources; distinguish actual zero from missing information."
      evidence: "closed campaign ledger; missing-data register"
    - id: quality_conditions
      applies_to: "preservation and dispatch"
      requirement: "Record before/after fish state and actual branch; immediate fresh bypass requires no-intervention evidence; no presumed live-to-chilled equivalence or default oxygen/ice ratio."
      evidence: "lot observations; viability or time-temperature records"
    - id: quality_periods
      applies_to: "assets, trips and shared services"
      requirement: "Match actual reporting periods and consumers; retain asset/service/replacement/retirement and standby/changeover treatment."
      evidence: "cp_assets_inland_capture; cp_assets_landing_preservation; cp_assets_landing_dispatch; meter allocation ledger"
    - id: quality_environment
      applies_to: "resource and emissions"
      requirement: "Retain resource-removal and habitat/gear/bycatch evidence, substance/medium emissions and water destinations; disclose methods, uncertainty and unsupported LCIA impacts."
      evidence: "catch observations; engine factors/tests; water monitoring; LCIA scope"
    - id: quality_estimates
      applies_to: "all Range blocks"
      requirement: "Replace provisional screening estimates with route-specific evidence; an outlier is investigated without changing its measured value to a range endpoint."
      evidence: "range evidence and outlier investigation"
    - id: quality_binding
      applies_to: "actual concrete exchanges"
      requirement: "Verify actual flow UUID, type, property/unit and supplier/state/medium; semantic collection obligations in Section 8 require independent actual-exchange identities before TIDAS publication."
      evidence: "identity verification records kept outside PCR content"
    - id: dq_inventory_completion
      applies_to: "all inventory-completion requirements"
      requirement: "Create a separate card for every actual physical or chemical exchange, with process, direction, flow type, its own measured quantity, native unit, final-reference normalization, applicability, destination, UUID and independent range evidence. Never copy a family total, a grouped screening range or one UUID onto every child. Use not_applicable only for evidenced absence; unknown is not zero. Any unfulfilled applicable obligation makes the final dataset incomplete and fails validation."
