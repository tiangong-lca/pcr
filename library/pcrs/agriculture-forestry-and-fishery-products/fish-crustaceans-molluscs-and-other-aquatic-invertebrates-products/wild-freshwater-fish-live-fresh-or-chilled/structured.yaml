      record_type: "water and discharge ledger"
      raw_fields: "lot_id; water source/quality; supply/withdrawal mass; internal circulation; ice production/melt; carrier water shipped; treatment receipt; direct outlet and receiving body; substance/concentration; refrigerant species/leak ; unique original shared-ledger ID; this node actual share; all-beneficiary reconciliation"
      collection_method: "Measure each external water path and destinations; volume records retain density/state conversion; derive substance loads from matched monitoring, not assumed wastewater composition; trace actual refrigerant leaks to air. ; use the same original shared ledger and independently reconcile this node share, never copy another node total or charge the same burden twice."
      unit: "kg"
      frequency: "each lot and outlet monitoring period"
      temporal_coverage: "matched boundary period"
      site_scope: "actual intakes, supply and outlets"
