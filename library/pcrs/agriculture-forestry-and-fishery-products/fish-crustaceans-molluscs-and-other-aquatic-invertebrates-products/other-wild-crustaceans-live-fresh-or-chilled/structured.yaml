allocation_rules:
  - rule_id: allocation_output_set
    applies_to: "all intended outputs"
    rule: "Enumerate target grades, intended downgraded products and actual non-target intended products with species, net mass, state, grade, destination and physical handoff. Distinguish these from losses, residues, organisms returned and genuine waste. Do not make a sale output into burden-free waste because its price is low."
    source_ids: []
  - rule_id: allocation_precedence
    applies_to: "shared trip and sorting burdens"
    rule: "First subdivide independently metered duties and assign output-specific handling directly. For remaining common capture/sorting duty use documented physical causality such as attributable duty time/load if defensible. When such causality cannot distinguish intended output grades, allocate by same-period first-handoff economic values; disclose quantities/prices, rationale and physical-mass sensitivity. No automatic avoided-production credit is allowed."
    source_ids: []
  - rule_id: allocation_period
    applies_to: "trips and periods"
    rule: "Include successful, aborted and zero-catch trips and losses in the reporting period; assign directly linked failure to its actual lot/duty, and unresolved common failed duty to the declared period's intended outputs with a documented rationale. Reconcile beginning/ending live stock, pending lots, replacement and termination events; do not drop a low-yield interval or allocate the same burden again next period."
    source_ids: []
  - rule_id: allocation_shared_assets
    applies_to: "shared boats, crates, tools, spaces and vehicles"
    rule: "Maintain asset/service ids, provision and maintenance totals, useful service and actual consumers across nodes/periods. Attribute once using observed service demand (hours, occupied capacity-time or documented turns, appropriate to the asset), with replacement/retirement and uncertainty. Use no universal lifespan or container reuse count; report sensitivity to uncertain service life and output attribution."
    source_ids: []
  - rule_id: allocation_service_ownership
    applies_to: "complete purchased services and internal transfers"
    rule: "A purchased complete service owns its included energy/assets/releases/treatment; own operation owns uncovered components only. Internal transfers carry mass and burden once, never a second sale or a fixed 1 kg feed. Package reuse/return transport has one owner and service period."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "Capture duty, landed outputs and ecological fates"
      record_type: "Trip log, fuel/asset/provider records and measured handoffs"
      raw_fields: "trip/lot/harvester/boat ids; area/date; technique; time/distance/fuel blend and native quantity; provider coverage; asset life/service/maintenance; gross checkpoint mass; target-animal mass and deductions; T_capture_sort; intended non-target products; actual dead/returned/detached organisms/minerals and fate; pollution species/medium/factor; failed trips; stock/period ids"
      collection_method: "Weigh with calibrated scales and separated tare/mineral/non-target records; reconcile trip log to physical handoff, never use catch estimates alone. Retain actual fuel, asset and provider documents; observe ecological fates and keep unmeasured habitat effects as disclosed gaps."
      unit: "kg; L; hours; actual native service/substance units"
      frequency: "Every trip and handoff, including failures; each service/maintenance event"
      temporal_coverage: "Complete declared reporting period and asset service periods"
      site_scope: "Berlengas capture area, supporting boat and landing"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/tare sheets; location/technique proof; receipts/meters; provider scope; factor provenance; ecology/fate records; ownership ledger"
    - protocol_id: cp_sorting
      process_id: "sorting"
      flow_role: "Received target animals, grades, incidental material and sorting support"
      record_type: "Lot/grade/fate sheet and utility records"
      raw_fields: "lot and T_capture_sort/T_sort_hold/T_sort_present; actual receipt and selected mass; every intended grade/destination/recipient; rejects and reason; mineral/non-target deduction; water/source/material/energy/service identity and native units; wastewater treatment receiver; pollutant identity/basis/medium; cleaning/changeover; time/period"
      collection_method: "Weigh every destination separately; reconcile received target and incidental material to selected products, other intended outputs, true waste, return and observed stock/loss terms. Meter actual support, inspect actual wastewater/fates; no assumed cleaning operation."
      unit: "kg; kWh; actual native water/material/service/substance units"
      frequency: "Each lot, grade split, cleaning and handoff"
      temporal_coverage: "All sorting lots/events in declared period including rejected lots"
      site_scope: "Actual declared landing/sorting site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scales/tare; transfer ids; grade/destination receipts; invoices/meters; waste/treatment records; stock reconciliation"
    - protocol_id: cp_holding
      process_id: "live_holding"
      flow_role: "Live-state intervention and handoff"
      record_type: "Holding lot/condition/utility/fate records"
      raw_fields: "lot; T_sort_hold/T_hold_present; actual net mass/live condition before/after; start/end; actual method/condition; water source/native quantity/cooling/energy/space/service; asset/shared capacity-time; every intended alternate product/recipient; mortality/reject and destination; treatment transfers; direct release substance/carbon origin/medium/method; stock, failures and period"
      collection_method: "Observe live-state eligibility and weigh net lots at actual endpoints; record actual intervention and measured provision, only for activated interventions; absent intervention uses the separately recorded bypass. Separate live loss, free water and mortality from accepted mass; retain actual treatment and release methods."
      unit: "kg; duration; kWh; actual native provision/service/substance units"
      frequency: "Every holding interval, loss, provision and handoff"
      temporal_coverage: "Complete declared period plus open-interval initial/final stock"
      site_scope: "Actual holding location/operator"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "endpoint weights/condition records; meters; asset/service ledger; treatment receipts; methodology and uncertainty"
    - protocol_id: cp_presentation
      process_id: "presentation"
      flow_role: "Container presentation and package ownership"
      record_type: "Lot/package/cleaning/waste record"
      raw_fields: "lot; T_hold_present/T_sort_present/T_present_deliver; actual incoming path; net animal mass; package material/native quantity/tare; single-use/reusable/recipient-owned; turn history and replacement; presentation equipment/support; water source/native quantity; direct release substance/carbon origin/medium/method; cleaning; every intended alternate product/recipient; package/animal rejects; treatment destination; time/period"
      collection_method: "Weigh animals separately from containers; inventory actual material and useful container turns, ownership and cleaning. Select exactly one actual incoming holding/bypass transfer. Record recipient-supplied containers and actual absence of other presentation inputs explicitly; retain package end-of-use responsibility."
      unit: "kg; items; actual native utility/material/service units"
      frequency: "Every presented lot, container turn and cleaning/replacement event"
      temporal_coverage: "Complete reporting and container-service periods"
      site_scope: "Actual presentation location"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tare/item-mass evidence; issue/return records; material invoices; cleaning meters; waste receipts; asset ledger"
    - protocol_id: cp_delivery
      process_id: "delivery"
      flow_role: "Pre-gate logistics, accepted reference and rejects"
      record_type: "Delivery/receipt/weighing and provider/vehicle records"
      raw_fields: "lot; T_present_deliver; route/vehicle/provider/distance/load/time; native fuel/energy/service/asset quantities; coverage ownership; receiving person/site/time; live/species/origin/whole-state evidence; gross/tare/free-water/mineral/non-target/reject deductions; accepted net mass; output grades/alternate destinations; pollutant species/carbon origin/medium/method; period/stock"
      collection_method: "Weigh accepted whole live animals on calibrated scales at first physical recipient in Peniche; retain itemized deductions, live condition and custody evidence. Reconcile invoice/checkpoint separately. Meter actual own duty or verify complete-service coverage, record rejected/alternate output fate and same-site transfer if actual."
      unit: "kg; L; kWh; actual native service/substance units"
      frequency: "Every delivery, physical receipt, rejection and own/provider duty"
      temporal_coverage: "Complete declared reporting period and assigned asset service periods"
      site_scope: "Actual Peniche receipt and pre-gate route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed physical receipt, scale calibration/deductions, species/origin chain, trip/stock reconciliation, invoices/meters, provider scope, factor documentation"
  calculation_rules:
    - id: accepted_reference_identity
      applies_to: "accepted_live_barnacles"
      rule: "The same-lot accepted net mass A divided by itself is 1 only where A is positive. This defines the output basis, never empirical catch yield."
      inputs:
        - cp_delivery
      output: "1 kg accepted output per 1 kg reference flow"
      source_ids:
        - accepted-net-mass-identity
    - id: instance_attribution
      applies_to: "all inventory rows"
      rule: "Preserve each actual native quantity, first apply the documented output/node/period ownership share, then divide by positive accepted net reference mass for that declared scope. Retain intermediate transfers at actual quantities; no rescaling to final mass."
      inputs:
        - cp_capture
        - cp_sorting
        - cp_holding
        - cp_presentation
        - cp_delivery
      output: "Attributed native instance quantities per 1 kg reference flow"
      source_ids: []
    - id: balance_and_factors
      applies_to: "all processes"
      rule: "Reconcile initial stock plus receipts against all intended outputs, true waste, documented actual ecological/other fates, final stock and explicitly measured or unresolved mass change. Apply only disclosed composition/equipment-specific factors to actual duty; preserve uncertainty, fossil/biogenic carbon and chemical/medium basis."
      inputs:
        - cp_capture
        - cp_sorting
        - cp_holding
        - cp_presentation
        - cp_delivery
      output: "Lot balance and separately supported actual release quantities"
      source_ids: []
  data_quality_requirements:
    - id: dq_eligibility
      applies_to: "reference and every lot"
      requirement: "Actual scientific species, Berlengas rocky-intertidal origin, manual arrilhada route, live whole state and first Peniche physical recipient are demonstrated. Historical route/trader information alone is insufficient."
      evidence: "Species/origin chain; trip observations; live condition and signed receipt"
    - id: dq_measurement
      applies_to: "all nodes"
      requirement: "Retain calibrated weights, native units, deductions, conversion evidence, transfer ids and uncertainty. No edible mass or checkpoint gross denominator."
      evidence: "Scales, raw records and pairwise handoffs"
    - id: dq_completeness
      applies_to: "reporting/asset periods"
      requirement: "Cover unsuccessful trips, all intended outputs, mortality and actual fate, beginning/end stocks, shared nodes/periods, service inclusions and replaced/retired assets."
      evidence: "Period ledger with one physical-event owner and unexplained balance terms"
    - id: dq_ranges
      applies_to: "every instance"
      requirement: "Independently evidence each U before numerical screening; retain unresolved status when absent. Never validate a lot with its own maximum or transfer a common cap between dissimilar outputs/services."
      evidence: "Independent reference evidence, composition/native-unit checks and uncertainty"
    - id: dq_identity
