      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual alternate intended delivery output instances. Actual pre-reference-gate diversions to separately intended output/recipient, with their own state, grade and first physical handoff. Do not add a second output for a rejection without evidence of intended use, or repeat the accepted reference or prior nodes' outputs. <br> - Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg <br> - Amount rule: Actual alternate product net mass and handoff from cp_delivery <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Product-specific (product_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_delivery <br> - Range: Provisional delivery-co-output-instance evidence need <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_delivery_other_product_instance <br> - Unit: kg of that intended output instance <br> - Basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: collect_delivery_waste
      applies_to: "delivery; Outputs; Waste flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual pre-acceptance waste by composition and receiver. Separate dead/unaccepted animals and damaged materials sent to real treatment/disposal; alternative intended sales retain distinct product, gate and attribution. Post-recipient waste is outside this foreground boundary, while package handoff and downstream responsibility are disclosed. <br> - Flow property / unit: Mass 93a60a56-a3c8-11da-a746-0800200b9a66; Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 / kg <br> - Amount rule: Actual pre-gate waste transfer quantity and receiver in cp_delivery <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_delivery <br> - Range: Provisional delivery-waste-instance evidence need <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_delivery_waste_instance <br> - Unit: kg of that waste instance <br> - Basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: collect_delivery_other_releases
      applies_to: "delivery; Outputs; Elementary flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual delivery substance and receiving-medium instances. Actual pollutant/spill/refrigerant instances require chemical identity, particle/reporting basis and receiving medium before binding. A complete provider duty already containing these releases is not repeated. <br> - Flow property / unit: Substance mass / kg of actual substance <br> - Amount rule: Actual measured or documented equipment/fuel-specific factor quantity and uncertainty in cp_delivery <br> - Value mode: Calculated value (calculated_value) <br> - Specificity: Technology-specific (technology_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Calculated from collection (calculated_from_collection) <br> - Collection protocol: cp_delivery <br> - Range: Provisional delivery-substance-instance evidence need <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_delivery_release_instance <br> - Unit: kg of that substance in that medium <br> - Basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: dq_logistics_water_balance
      applies_to: "logistics, services and water/nutrient balances"
      requirement: "Actual payload includes accompanying water, ice, packaging and other cargo. Empty return/repositioning still consumes activity: account for its actual fuel/distance/vehicle service and explicit attribution; zero cargo tonne-kilometres cannot erase that duty. Do not duplicate a complete service and covered fuel, materials, assets or direct releases. Measure external abstraction, supplied water product, internal circulation and actual returned/discharged water separately; never deduct internal recirculation again from external intake. Net nutrient increment/retention is a separate balance diagnostic, never automatically a negative elementary flow, negative emission or avoided burden."
      evidence: "Actual load/vehicle duty records, service scope, same-lot water/substance balance and method evidence"
validation_rules:
  - rule_id: validation_eligibility
    applies_to: "reference flow"
    rule: "Require actual eligibility, whole live net mass and physical receipt qualifiers. Reject wrong species/route, cooked/frozen/de-shelled output or unsupported gate substitution."
    source_ids: []
  - rule_id: validation_transfers
    applies_to: "all internal transfers"
    rule: "Pair T_capture_sort and T_present_deliver by actual lot mass and time. With evidenced holding intervention pair T_sort_hold and T_hold_present; otherwise pair the direct T_sort_present bypass, never both paths for the same material. Unknown intervention state remains incomplete. Investigate discrepancies, stock/mass changes and deductions; do not force internal feed to 1 kg."
    source_ids: []
  - rule_id: validation_outputs
    applies_to: "output set and fates"
    rule: "Every intended grade/product has an explicit handoff and attribution; every true waste/treatment/direct release has actual destination or receiving medium. Disclose organisms returned, substrate disturbance and unresolved ecology without invented credits/exchanges."
    source_ids: []
  - rule_id: validation_periods
    applies_to: "capture, holding and shared assets"
    rule: "Include failed duties, changes/cleaning, open stocks and asset replacement/termination in declared periods; require one owner for each trip/service/asset burden across nodes and periods."
    source_ids: []
  - rule_id: validation_services
    applies_to: "complete provider duties"
    rule: "Reconcile provider coverage against own fuel/assets/releases/treatment and package return duty so no component or intended output is counted twice."
    source_ids: []
  - rule_id: validation_uncertainty
    applies_to: "quantities and identities"
    rule: "Unquantified U, absent factors, unknown carbon split or unverified concrete UUID remains a data gap. A range/checker pass does not establish actual data completeness, legal compliance, safety or sustainability."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable per-flow collection obligations and final exchanges"
    rule: "Final dataset completion and validation require every actual exchange to have an independent atomic card and its own quantity, property/native unit, collection or calculation evidence, range/uncertainty evidence, normalization, actual destination and verified UUID. Unknown identity, activity state, quantity, range evidence or fate blocks completion; it is never zero, a presumed bypass or permission to omit an obligation. Every important concrete flow retains its own range/uncertainty evidence collection duty; a symbolic upper bound is not an empirical range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground dataset; after evidence review may support secondary_dataset and background_dataset use"
  downstream_use: "process or lifecyclemodel projection for the same whole live reference at the declared first Peniche recipient"
  allowed_use: "Declared matching wild Berlengas manual-scraping route with actual reporting period, physical receipt and transparent attributed upstream supplies"
  excluded_use: "Other species/origins/routes, cultivation, edible-only conversion, processed/frozen products, post-recipient retail, safety/legal/stock status claims or unresolved cards as final TIDAS exchanges"
  required_metadata: "Species/origin/technique; route and nodes; trip/lot/period; net-mass deductions; grade/live state; physical recipient; actual holding/presentation; assets/services and ownership; all intended outputs and fates"
  required_quality_disclosure: "Record coverage, weighing/conversion uncertainty, failed duty and stock balance, attribution rationale/sensitivity, ecological limitations, provisional range evidence and exchange-identity gaps"
  update_trigger: "Actual species/origin/route/gate or condition change; revised measured duty/grade/stock records; asset/service scope change; improved ecological, range or identity evidence"
data_sources:
  - id: "jacinto-berlengas-2010"
    type: "literature"
    reference: "Jacinto D., Cruz T., Silva T., Castro J.J. 2010. Stalked barnacle (Pollicipes pollicipes) harvesting in the Berlengas Nature Reserve, Portugal: temporal variation and validation of logbook data. ICES Journal of Marine Science 67:19–25. https://doi.org/10.1093/icesjms/fsp226"
    used_for: "Qualitative Berlengas boat/landing context and need to distinguish reported from measured catch; no catch/effort/default sustainability quantities adopted"
  - id: "dgrm-arrilhada"
    type: "official_guidance"
    reference: "DGRM, species/utensil table https://www.dgrm.pt/documents/20143/121101/C%C3%B3pia%2Bde%2Bapanha%2B-%2Bespecies%2Be%2Butensilios_Revisto%2Bv4.pdf/778ef739-eb46-52a0-4c1a-0025d7262856 and utensil descriptions https://www.dgrm.pt/web/guest/artes-e-utensilios-de-pesca"
    used_for: "Pollicipes pollicipes/arrilhada association and metal hand-scraper description only; no commercial/legal limits inferred from recreational context"
  - id: "portaria-berlengas-2025"
    type: "official_guidance"
    reference: "Portaria 85/2025/1, 5 March 2025, articles 2 and 4. https://diariodarepublica.pt/dr/detalhe/portaria/85-2025-909595555"
    used_for: "Distinction between gross checkpoint capture recording in Peniche and sale/receipt evidence; no numerical legal limit or compliance conclusion adopted"
  - id: "conchamar-live-channel"
    type: "literature"
    reference: "Conchamar, Medium Live Percebes product page. https://loja.conchamar.pt/en/products/percebes-vivos-medio-pollicipes-cornucopie-1kg"
    used_for: "Existence of a Portuguese live sale channel only; seller title is not taxonomy authority or Berlengas/foreground origin proof"
  - id: "ec-pollicipes-identity"
    type: "official_guidance"
    reference: "European Commission commercial designations, Pollicipes pollicipes. https://fish-commercial-names.ec.europa.eu/fish-names/species/pollicipes-pollicipes_en"
    used_for: "Accepted scientific name and crustacean identity context; not a foreground origin or gate record"
  - id: "accepted-net-mass-identity"
    type: "method_factor"
    reference: "Same-positive-accepted-net-mass numerator and denominator identity, A/A = 1"
    used_for: "Reference-output normalization only; not yield, catch or empirical range evidence"
