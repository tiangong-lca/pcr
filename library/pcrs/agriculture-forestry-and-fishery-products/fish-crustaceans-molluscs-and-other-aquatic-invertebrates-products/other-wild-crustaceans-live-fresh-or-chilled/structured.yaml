system_boundary:
  rules:
    - rule_id: boundary_capture
      applies_to: "capture"
      rule: "Include boat mobilization, transit, access, scraping and return to landed handoff within capture duty. Capture separates attached wild resource from landed material; sorting and preservation do not stand in for removal."
      source_ids:
        - jacinto-berlengas-2010
        - dgrm-arrilhada
    - rule_id: boundary_gate
      applies_to: "all processes"
      rule: "Follow each lot to actual first recipient acceptance in Peniche. Checkpoint unloading/registration records gross harvest and origin; use actual custody and weighing evidence to locate final receipt."
      source_ids:
        - portaria-berlengas-2025
    - rule_id: boundary_conditions
      applies_to: "sorting, live_holding, presentation"
      rule: "Sorting creates declared accepted, alternate intended and rejected states. Activate holding only for observed bounded live-state interventions; otherwise transfer directly from sorting to presentation. Present using actual containers. Record water/materials/cleaning when used; no universal wash, depuration or temperature prescription."
      source_ids: []
    - rule_id: boundary_fates
      applies_to: "all processes"
      rule: "Trace rock, sand, attached juveniles, non-target organisms, mortalities, spent containers, fluids and rejects to actual retention, sale, return, disposal or treatment. Habitat disturbance and unmeasured ecology remain disclosed observations/data gaps; do not invent elementary exchanges, waste labels, factors or credits."
      source_ids: []
    - rule_id: boundary_services
      applies_to: "all processes"
      rule: "Inventory either complete purchased duty or its own operation components at each actual instance. Identify shared boat, scraper, crates, holding space, energy equipment and vehicle consumers by node and period, with one burden owner."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Wild animals attached to natural Berlengas intertidal substrate; no hatchery, feeding or managed growout; boat, harvester and equipment provision identified before the trip"
  starting_condition_role: "Natural capture context and collection observation, not a purchased zero-burden product; actual resource removals and ecological observations are disclosed"
  product_classification_scope: "The eligible whole live Pollicipes pollicipes subset of other wild crustaceans"
  recursive_input_rule: "Internal barnacle transfers carry measured lot mass and transfer ids; purchased barnacles from another harvester are not relabelled as own capture and require a separately bounded upstream dataset or exclusion from this route"
  upstream_dataset_requirement: "Fuel, electricity, tools, boat/vehicle assets, packaging and purchased services include their attributable upstream production and supply. Complete purchased services declare included assets, energy, emissions and treatment to prevent repetition."
  disclosure: "Record trips including failed trips, harvest areas, sorting/holding sites, Peniche receipt, own versus purchased duties, reporting/asset periods, initial/final stocks, ecological fates and missing data"
