system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "foreground_route"
      rule: "Keep source-supported captive production separate from application-proven final collection and physical receipt. The source monitoring loop returns animals and is not a harvest/sale. Research anesthesia, sexing, DNA, tagging and destructive sampling are not production prescriptions."
      source_ids:
        - capaz-cuttlefish-2020
        - cuttlefish-accounting-method
    - rule_id: boundary_phases
      applies_to: "managed_culture"
      rule: "Keep all actual reproductive service, eggs, hatchlings, broodstock, failed cohorts, opening/closing stocks and termination in full-cycle attribution. Retained unhatched offspring carry reproductive service; a narrower actual nonbreeding period requires proof and inherited upstream burden."
      source_ids:
        - cuttlefish-accounting-method
    - rule_id: boundary_holding
      applies_to: "bounded_holding"
      rule: "Select active only from observed interval/intervention records; bypass requires matched direct grading-to-presentation transfer. Unknown state is a gap and never zero or bypass. Preserve actual before/after live state, inputs and losses."
      source_ids:
        - cuttlefish-accounting-method
    - rule_id: boundary_support
      applies_to: "supporting services"
      rule: "Model actual sand filtration, decanting, aeration/shading and shared tanks/filters/pumps/air equipment/feed cold store through measured service and attribution. Enumerate every consuming node and period. Complete services exclude covered components/releases, and component models exclude the complete service."
      source_ids:
        - capaz-cuttlefish-2020
        - cuttlefish-accounting-method
    - rule_id: boundary_gate
      applies_to: "delivery"
      rule: "The gate is independent first physical receipt of accepted live whole animals, regardless of payer. Include every prior movement, load/unload, waiting and failed delivery event; record carrier water/package and actual returns separately. Exclude subsequent use or disposal."
      source_ids:
        - cuttlefish-accounting-method
    - rule_id: boundary_fate
      applies_to: "all inventory rows"
      rule: "Apply each collection obligation by adding one independent card per actual identified exchange with native property/unit, state, time, destination and evidence. Actual unused state requires evidence; unknown is not zero. Pair internal water/matter/package/animal transfers and stock/return ledgers, identify all intended outputs, actual losses, waste and environmental releases without inventing occurrence."
      source_ids:
        - cuttlefish-accounting-method
boundary_abstraction:
  declared_starting_condition: "Actual documented received captive eggs, hatchlings, juveniles or broodstock and opening animal/feed/asset stocks with ancestry and inherited burdens; declare which phases occur on site"
  starting_condition_role: "Evidence-based foreground truncation with retained upstream reproductive, nursery, growout, feed and logistics services, not an origin-free cut-off"
  product_classification_scope: "CPC 3.0 04462 is broader: this PCR covers one captive-origin species, flow-through route and whole-live never-frozen gate only"
  recursive_input_rule: "Record same-category received or returned animals by actual stage/state, quantity and inherited burdens; stop tracing at the declared evidenced supplier boundary and link required upstream dataset or explicit reviewed gap, never recurse indefinitely or reset burdens"
  upstream_dataset_requirement: "Supplier captive origin, reproductive/nursery service, feed capture/culture and cold-chain, energy/water/material/service and acquisition transport datasets or documented primary evidence with compatible scope"
  disclosure: "Actual location, cohort/period, stage coverage, inherited upstream service, full failures and reproductive outputs, stocks, shared assets/service life, holding state, every pre-receipt movement, allocation, missing records and uncertainty"
