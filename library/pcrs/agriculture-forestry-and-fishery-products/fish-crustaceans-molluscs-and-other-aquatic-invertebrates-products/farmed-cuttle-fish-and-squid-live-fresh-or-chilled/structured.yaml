      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration and node-specific original logs; matched ids; independent counts/state; asset/period/output shares; per-instance measured inputs/formula/factor/source and uncertainty"
    - protocol_id: cp_grading
      process_id: "grading"
      flow_role: "All actual native flow instances at this node"
      record_type: "Primary records and measurements"
      raw_fields: "collected and returned lot/state/mass/count; actual acceptance/size/grade criteria and measurements; every accepted/other-usable/returned/waste destination and recipient/time; carried-water receipts and handoffs/fates; holding active/bypass/unknown selection; grading materials/energy/equipment; event/transfer/stock id; calibration; native property/unit; formula/factor/source and uncertainty for calculated instances; accepted A link"
      collection_method: "Independently record actual incoming states and observed grade/destination decisions, then measure each outgoing animal state and water handoff. Match accepted lots to active holding or evidenced direct presentation, viable returns to their receiving node and other usable products to actual physical recipient; record actual waste separately and do not invent universal grade thresholds. Record native amounts before one attribution and division by A; qualitative literature is not a quantity record."
      unit: "kg; m3; kWh; MJ; h; t.km as applicable to each actual instance"
      frequency: "Each actual event/transfer/phase and documented continuous-meter interval"
      temporal_coverage: "Full actual cohort/reporting and service periods, including failures, stocks, cleaning and termination"
