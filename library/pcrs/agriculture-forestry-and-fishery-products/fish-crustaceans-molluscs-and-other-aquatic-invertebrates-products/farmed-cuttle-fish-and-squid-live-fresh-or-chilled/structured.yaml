    - protocol_id: cp_final_collection
      process_id: "final_collection"
      flow_role: "All actual native flow instances at this node"
      record_type: "Primary records and measurements"
      raw_fields: "actual nonreturn event/time and production context; received live whole animals with counts/mass and inherited burden; existing carrier water/incidental matter from culture; any new carrier-water supply; actual equipment/energy/service; collected animal handoff; water and matter by usable/returned/waste/environment destination; live returns and collection losses; event/transfer/stock id; calibration; native property/unit; formula/factor/source and uncertainty for calculated instances; accepted A link"
      collection_method: "Observe the actual independent removal toward dispatch and distinguish it from research sampling-return. Weigh or reconcile same-state animals, existing water and accompanying matter at culture receipt and grading handoff; separately meter any new supplied water. Record actual usable incidentals, returns, losses and direct discharge/waste destinations, with one owner per equipment/handling event. Record native amounts before one attribution and division by A; qualitative literature is not a quantity record."
      unit: "kg; m3; kWh; MJ; h; t.km as applicable to each actual instance"
      frequency: "Each actual event/transfer/phase and documented continuous-meter interval"
      temporal_coverage: "Full actual cohort/reporting and service periods, including failures, stocks, cleaning and termination"
