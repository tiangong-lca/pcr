      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration and node-specific original logs; matched ids; independent counts/state; asset/period/output shares; per-instance measured inputs/formula/factor/source and uncertainty"
    - protocol_id: cp_presentation
      process_id: "presentation"
      flow_role: "All actual native flow instances at this node"
      record_type: "Primary records and measurements"
      raw_fields: "actual accepted unheld/held input selection; live animal lot/state/mass/count; carrier-water source/volume/quality; package material/tare/ownership/new or reused/turns; opening/closing/returned package stock and condition; actual protection arrangement; cleaning/repair/damage/end-of-use; separately dispatched animal/water/package transfer ids; event/transfer/stock id; calibration; native property/unit; formula/factor/source and uncertainty for calculated instances; accepted A link"
      collection_method: "Verify the actual unheld/held path and actual live protection, separately weigh animals and package tare and meter carrier water, retaining native animal body water. Measure package stock/return/new supply and attributable turns/service life, cleaning/repair and rejects; pair animal, carrier-water and package dispatch to separate delivery receipts. Do not record freight or duplicate movement here. Record native amounts before one attribution and division by A; qualitative literature is not a quantity record."
      unit: "kg; m3; kWh; MJ; h; t.km as applicable to each actual instance"
      frequency: "Each actual event/transfer/phase and documented continuous-meter interval"
      temporal_coverage: "Full actual cohort/reporting and service periods, including failures, stocks, cleaning and termination"
      site_scope: "Protective live presentation and matched handoffs only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration and node-specific original logs; matched ids; independent counts/state; asset/period/output shares; per-instance measured inputs/formula/factor/source and uncertainty"
    - protocol_id: cp_delivery
      process_id: "delivery"
      flow_role: "All actual native flow instances at this node"
      record_type: "Primary records and measurements"
      raw_fields: "dispatch animal/water/package ids and quantities; every pre-receipt leg/time/distance/mode/carrier/payer/custody; actual loaded animal/water/package mass and co-load; loading/unloading/waiting owner; complete-freight versus component scope; fuel/electricity/asset hours; actual recipient and acceptance time/live state/grade/net mass A; side outputs/rejections/returns/water/package destinations; event/transfer/stock id; calibration; native property/unit; formula/factor/source and uncertainty for calculated instances; accepted A link"
      collection_method: "Reconcile every actual movement and custody record to first independent physical receipt, regardless of payer. Calculate actual t.km from measured loaded mass/distance/co-load, retain carrier water and tare in freight load but outside animal A. Assign loading/unloading/waiting once to complete freight or separately measured component handling. Match actual accepted A through cp_receipt and separately measure every reject, return and water/package handoff. Record native amounts before one attribution and division by A; qualitative literature is not a quantity record."
      unit: "kg; m3; kWh; MJ; h; t.km as applicable to each actual instance"
      frequency: "Each actual event/transfer/phase and documented continuous-meter interval"
      temporal_coverage: "Full actual cohort/reporting and service periods, including failures, stocks, cleaning and termination"
      site_scope: "Every pre-receipt movement and first physical recipient acceptance and matched handoffs only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration and node-specific original logs; matched ids; independent counts/state; asset/period/output shares; per-instance measured inputs/formula/factor/source and uncertainty"
    - protocol_id: cp_receipt
      process_id: "delivery"
      flow_role: "Accepted reference product mass and physical acceptance"
      record_type: "Calibrated weighing and receipt observations"
      raw_fields: "same lot id; recipient; receipt date/time; species; origin; whole/live/never-frozen/nonornamental evidence; actual grade; count; animal net wet mass A; gross/tare/carrier-free-water handling; scale calibration; same-lot sample weights/design/uncertainty if used"
      collection_method: "Independently weigh accepted whole live animals on a calibrated scale with actual carrier/free-water and package-tare separation, retaining native animal body water; reconcile same-lot independent count/condition and physical recipient acceptance. For sampled count conversion weigh representative live samples of that same lot/state and retain uncertainty."
      unit: "kg"
      frequency: "Each actual accepted lot and receipt event"
      temporal_coverage: "Same positive accepted lot at physical receipt with complete pre-receipt cohort attribution"
      site_scope: "First physical recipient; delivery node"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw net/gross/tare/water method; recipient custody/condition record; independent count/grade; same-lot sample design and uncertainty; positive A"
  calculation_rules:
    - id: reference_identity
      applies_to: "live_receipt_reference"
      rule: "A / A = 1; A is the same positive actual accepted net animal wet mass from cp_receipt."
      inputs:
        - A
        - cp_receipt
      output: "1 kg reference flow"
      source_ids:
        - reference-mass-identity
    - id: period_ledger
      applies_to: "all inventory rows"
      rule: "Divide each measured or calculated attributable native quantity by accepted A after one documented event/period/output allocation; keep the native quantity, allocation share, source records and resulting unit per reference. No internal feed or transfer is fixed to final mass."
      inputs:
        - "Native quantity"
        - "allocation ledger"
        - A
        - "node protocol"
        - cp_receipt
      output: "Native quantity per 1 kg reference flow"
      source_ids:
        - cuttlefish-accounting-method
    - id: actual_energy
      applies_to: "actual calculated electricity instances"
      rule: "Use measured meter differences or measured equipment power, load and runtime; retain each actual formula, factor, factor source, period and allocation and convert native energy units explicitly before division by A. A research flow/tank setting is not a measured electricity input."
      inputs:
        - "Meter start/end or measured power/load/runtime"
        - "formula and factor/source"
        - "node protocol"
        - A
      output: "Calculated electricity per 1 kg reference flow"
      source_ids:
        - cuttlefish-accounting-method
    - id: actual_release
      applies_to: "actual calculated release instances"
      rule: "Use actual measured activity/concentration, sampled volume or measured fuel and substance-specific applicable factor; retain per-instance formula, factor/source, medium, background adjustment and uncertainty. Do not infer pollutant identity from feed type or assign generic release defaults."
      inputs:
        - "Measured instance inputs"
        - "substance and medium"
        - formula
        - "factor/source"
        - "node protocol"
        - A
      output: "Calculated identified release per 1 kg reference flow"
      source_ids:
        - cuttlefish-accounting-method
    - id: actual_freight
      applies_to: "collect_delivery_transport"
      rule: "For each actual component-compatible leg multiply actual carried load mass in tonnes by actual distance in km and apply documented co-load allocation once; retain carrier water/package load and all pre-receipt legs."
      inputs:
        - "Actual load"
        - distance
        - mode
        - leg
        - "co-load share"
        - cp_delivery
        - A
      output: "t.km per 1 kg reference flow"
      source_ids:
        - cuttlefish-accounting-method
  data_quality_requirements:
    - id: identity_quality
      applies_to: "animal and feed lots"
      requirement: "Prove actual species, captive ancestry, received stage, live never-frozen final state, nonornamental use and physical custody. Qualitative literature supports route selection only, not collected quantities."
      evidence: "Supplier and cohort ancestry; actual condition, grade and receipt records"
    - id: quantity_quality
      applies_to: "all rows"
      requirement: "Retain calibration/tare/carrier separation, independently observed counts/grade, paired transfers, stock ledgers and same-lot sampling uncertainty. Independent historic/site reference samples must support empirical guardrails; a current batch maximum cannot validate itself."
      evidence: "Scale/meter logs; transfer/stock ids; sampling design; independent QA dataset"
    - id: coverage_quality
      applies_to: "periods nodes and assets"
      requirement: "Cover failed and idle periods, full claimed reproduction, mortality, feed preparation/remnants, cleaning/changeover, shared assets and all consumers, actual package turns and all pre-receipt movements. Unknown conditions block completion."
      evidence: "Event ledger; asset/service-life ledger; consumer shares; actual active/bypass proof"
    - id: range_quality
      applies_to: "all ranges"
      requirement: "Except the final same-lot identity, 0..U_row uncertainty ranges are provisional reasoned placeholders without established finite upper bounds, never measured values, defaults, limits or evidence of zero. Replace with independent actual observations and reviewed uncertainty before final dataset use."
      evidence: "Actual independent records and reviewed quantity/uncertainty derivation"
    - id: binding_quality
      applies_to: "all exchange cards and collection obligations"
      requirement: "Before final TIDAS exchanges each actual independent supply, waste, release and animal state must have verified concrete flow/property/unit identities; collection obligations are not automatic UUID bindings."
      evidence: "Exact detail/property/unit evidence and methodology review"
    - id: collect_water_supply_materials
