      applies_to: "logistics, services and water/nutrient balances"
      requirement: "Actual payload includes accompanying water, ice, packaging and other cargo. Empty return/repositioning still consumes activity: account for its actual fuel/distance/vehicle service and explicit attribution; zero cargo tonne-kilometres cannot erase that duty. Do not duplicate a complete service and covered fuel, materials, assets or direct releases. Measure external abstraction, supplied water product, internal circulation and actual returned/discharged water separately; never deduct internal recirculation again from external intake. Net nutrient increment/retention is a separate balance diagnostic, never automatically a negative elementary flow, negative emission or avoided burden."
      evidence: "Actual load/vehicle duty records, service scope, same-lot water/substance balance and method evidence"
validation_rules:
  - rule_id: validate_reference
    applies_to: "live_receipt_reference"
    rule: "Require positive A, one final accepted animal output, matched actual receipt, live/whole/never-frozen species and use proof, animal-body-water retention and free/carrier-water/package exclusion. A/A is the only 1..1 identity."
    source_ids:
      - reference-mass-identity
      - cuttlefish-accounting-method
  - rule_id: validate_route
    applies_to: "process map"
    rule: "Require actual independent collection, grading states/destinations, holding active or evidenced bypass, protective presentation and every pre-receipt movement. Sampling-return never satisfies harvest or receipt; unknown state is incomplete."
    source_ids:
      - cuttlefish-accounting-method
  - rule_id: validate_ledger
    applies_to: "all inventory rows"
    rule: "Match each physical transfer, stock and return in state/native property/unit/quantity/lot/period and burdens; independently reconcile intended outputs, stocks, feed offered/remnants, mortality, incidentals, aqueous fates and identified releases. Do not fabricate closure by treating body-water changes or unseen emissions as measured."
    source_ids:
      - cuttlefish-accounting-method
  - rule_id: validate_attribution
    applies_to: "shared outputs periods and assets"
    rule: "Reconcile all output/period/shared-consumer shares once, carry reproductive/offspring/broodstock and failed-period burdens, retain asset service life/replacement/termination, and justify economic fallback denominator/stock valuation or alternative with sensitivity."
    source_ids:
      - cuttlefish-accounting-method
  - rule_id: validate_evidence
    applies_to: "collected calculated and provisional evidence"
    rule: "Require own-node collection protocols and actual record sources; calculated energy/releases need per-instance measured inputs/formula/factor/source. Provisional ranges and qualitative literature do not establish actual quantity, legal/food-health/welfare status, profitability, default feed rate or commercial delivery."
    source_ids:
      - cuttlefish-accounting-method
  - rule_id: validate_atomic_completion
    applies_to: "all applicable per-flow collection obligations and final exchanges"
    rule: "Final dataset completion and validation require every actual exchange to have an independent atomic card and its own quantity, property/native unit, collection or calculation evidence, range/uncertainty evidence, normalization, actual destination and verified UUID. Unknown identity, activity state, quantity, range evidence or fate blocks completion; it is never zero, a presumed bypass or permission to omit an obligation. Every important concrete flow retains its own range/uncertainty evidence collection duty; a symbolic upper bound is not an empirical range."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset produced from actual primary collection and declared calculations"
  downstream_use: "After completed methodology review, actual exchange identity verification and quantity/quality validation, a concretely populated process or lifecyclemodel projection may support secondary_dataset or background_dataset use with matching boundary"
  allowed_use: "Source-compatible whole-live captive Sepia officinalis route and actual site/period/gate, preserving declared stock/reproductive/service attribution and uncertainty"
  excluded_use: "Entire CPC leaf extrapolation; squid or other species; wild direct catch; ornamental, dead or processed reference states; source-paper commerce/profit/food-health/welfare/legal certification; automatic use of provisional amounts or unresolved exchange identities"
  required_metadata: "Species/ancestry/starting stage; actual location/cohorts/periods; source and upstream dataset links; product state/grade/use; mass/count/water/tare method; holding state; physical gate/logistics; transfer/stock/return ids; all outputs; service/asset life and consumers; allocation and concrete exchanges"
  required_quality_disclosure: "Actual primary record coverage, failed periods and stock carryover; uncertainties/calibrations/sampling; provisional ranges replaced or unresolved; quantified calculation inputs/factors/sources; identity and methodology review; excluded service components; missing states/records"
  update_trigger: "Changed species/origin/production mode/feed/water system; changed stage, reproductive attribution, asset life or consumer set; holding/presentation/gate or logistics change; new measurements/factors/identities or material data gaps"
data_sources:
  - id: "capaz-cuttlefish-2020"
    type: "literature"
    reference: "Capaz et al. (2020), Control of Zootechnology Leads to Improved Cuttlefish (Sepia officinalis, L.) Reproduction Performance up to Pre-industrial Levels, Frontiers in Marine Science 7:112. https://doi.org/10.3389/fmars.2020.00112 ; accessed 2026-10-12"
    used_for: "Culture Methodology and Data and Sample Collection: source-context captive egg/nursery/growout, water/aeration/shading, feed and sampling-return/reproductive scope only; no numeric defaults or commercial receipt evidence"
  - id: "cuttlefish-accounting-method"
    type: "method_factor"
    reference: "Declared prospective captive cuttlefish foreground accounting method, this PCR sections 3–9"
    used_for: "Own-node collection, native-unit/reference normalization, complete phase/output/stock/return/service ledgers, source limits, conditional states, physical recipient gate and attribution; future actual records supply quantities"
  - id: "reference-mass-identity"
    type: "method_factor"
    reference: "Same-positive-lot normalization identity A/A=1, with A independently collected through cp_receipt"
    used_for: "Final reference output and 1..1 range only; an accounting identity rather than a survival/yield/default assumption"
