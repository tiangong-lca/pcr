 (reference_flow) <br> - Evidence kind: Calculated from collection (calculated_from_collection) <br> - Collection protocol: cp_water_supply <br> - Sources: cuttlefish-accounting-method <br> - Range: Provisional unestablished uncertainty; independent observations required <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_water_supply_service <br> - Unit: h <br> - Basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
