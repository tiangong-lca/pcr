      flow_role: "All actual native flow instances at this node"
      record_type: "Primary records and measurements"
      raw_fields: "active/bypass/unknown proof; actual start/end time; incoming/outgoing accepted lot/state/mass/count; intervention type; supplied/carried water volume and quality/aeration; actual feeding if any; energy/carriers/equipment; live rejects/mortality; water handoff/waste/discharge; direct bypass transfer record; event/transfer/stock id; calibration; native property/unit; formula/factor/source and uncertainty for calculated instances; accepted A link"
      collection_method: "For active intervals observe usable live state before and after, actual bounded start/end, actual water/aeration and any evidenced feeding/intervention. Independently measure outgoing animals/water, rejects/losses and disposition. For bypass retain matched grading-to-presentation transfer proof; unknown cannot become a zero row or bypass. Separate the interval from managed growout. Record native amounts before one attribution and division by A; qualitative literature is not a quantity record."
      unit: "kg; m3; kWh; MJ; h; t.km as applicable to each actual instance"
      frequency: "Each actual event/transfer/phase and documented continuous-meter interval"
      temporal_coverage: "Full actual cohort/reporting and service periods, including failures, stocks, cleaning and termination"
