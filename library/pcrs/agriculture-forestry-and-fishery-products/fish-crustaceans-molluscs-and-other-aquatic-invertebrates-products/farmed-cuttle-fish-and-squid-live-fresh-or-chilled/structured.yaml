      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual solid waste from delivery. Conditional separately identified mortal animals, rejected material, feed remnants, cleaning sludge or damaged consumables, as applicable to this node; retain wet/dry state, destination and treatment responsibility. Usable products and retained stocks are not waste. <br> - Flow property / unit: Mass / kg <br> - Amount rule: Actual independently observed kg for each identified instance; divide the attributed native quantity by accepted A, retaining actual records from cp_delivery and positive same-lot A from cp_receipt. <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_delivery <br> - Sources: cuttlefish-accounting-method <br> - Range: Provisional unestablished uncertainty; independent observations required <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_delivery_solid_waste <br> - Unit: kg <br> - Basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
