    - id: collect_delivery_releases
      applies_to: "delivery; Outputs; Elementary flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual identified direct releases from delivery. Conditional per actual substance and receiving medium only. Distinguish directly measured raw release mass from raw release mass calculated from measured concentration/volume or measured activity and an applicable factor. Raw direct measurements are collected_record; factor/concentration-derived and reference-normalized amounts are calculated_value/calculated_from_collection. Retain substance/species or particle size, air/water/soil compartment, time, measured activity/concentration, sampled volume, formula, factor/source and uncertainty for each instance. Exclude influent background load and releases covered by complete services; broad organic/pollutant labels do not identify emissions. <br> - Flow property / unit: Mass / kg <br> - Amount rule: Actual independently observed kg for each identified instance; divide the attributed native quantity by accepted A, retaining actual records from cp_delivery and positive same-lot A from cp_receipt. For calculated instances retain actual formula, measured inputs, factor and source before attribution. <br> - Value mode: Calculated value (calculated_value) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Calculated from collection (calculated_from_collection) <br> - Collection protocol: cp_delivery <br> - Sources: cuttlefish-accounting-method <br> - Range: Provisional unestablished uncertainty; independent observations required <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_delivery_releases <br> - Unit: kg <br> - Basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
