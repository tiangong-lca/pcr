measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "A = same-lot accepted net live whole animal wet mass in kg, independently measured at physical receipt with calibrated weighing and actual carrier/free-water and package-tare separation; native animal body water remains. Record handling and uncertainty without prescribing stressful research methods; use cp_receipt. A must be positive."
  - id: live_count_mass
    applies_to: "animal transfer and stocks"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Retain independent counts, size/grade and live-condition observations. If mass is estimated from count, use representative weighed live samples of the same actual lot/state, sampling design and uncertainty; no species-average body mass or paper conversion constant."
  - id: native_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual native property"
      uuid: ""
    required_unit: "Actual native unit"
    rule: "Measure each exchange in its native property/unit; seawater remains Volume/m3, electricity Energy/kWh, asset service duration h and freight t.km. Preserve native amount before attribution and division by A. Never force all exchanges to Mass or use feed wet mass as nutrient mass."
