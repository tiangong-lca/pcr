      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual consumables used by water_supply. Conditional separately identified cleaning, monitoring, repair or protective consumables. Retain formulation, function, quantity and upstream burden; exclude separately declared feed, water and packages. No research anesthesia, tagging or DNA procedure is prescribed. <br> - Flow property / unit: Mass / kg <br> - Amount rule: Actual independently observed kg for each identified instance; divide the attributed native quantity by accepted A, retaining actual records from cp_water_supply and positive same-lot A from cp_receipt. <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_water_supply <br> - Sources: cuttlefish-accounting-method <br> - Range: Provisional unestablished uncertainty; independent observations required <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_water_supply_materials <br> - Unit: kg <br> - Basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
