    required_property_ref:
      name: "Actual native property"
      uuid: ""
    required_unit: "Actual native unit"
    rule: "Match output/input transfer ids, state, quantity, unit, lot, period and inherited burdens. Opening/closing stocks and live/pack/water returns retain same-state links. Differences need observed loss or state-change evidence; nonfinal transfers are never forced to 1 kg."
