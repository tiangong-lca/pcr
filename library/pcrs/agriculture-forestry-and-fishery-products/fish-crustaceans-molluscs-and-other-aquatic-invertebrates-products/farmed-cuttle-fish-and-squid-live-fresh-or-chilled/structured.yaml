allocation_rules:
  - rule_id: attribute_precedence
    applies_to: "foreground burdens"
    rule: "First subdivide independently measured events, phases, outputs and services. Then apply documented causal physical attribution to shared production/asset/service burdens using actual occupancy, operating time or metered demand suited to the burden. Keep the rationale and sensitivity; no universal share or source-paper productivity default."
    source_ids:
      - cuttlefish-accounting-method
  - rule_id: attribute_outputs
    applies_to: "intended outputs"
    rule: "Enumerate accepted live animals, each actual alternate animal grade, transferred viable offspring or broodstock, usable incidentals and stocks with handoffs. Retained viable offspring and broodstock carry burdens into their next period; unhatched offspring are carried reproductive service, not delivered adult output. Residue and waste are not silently promoted to co-products or given avoided-product credits."
    source_ids:
      - cuttlefish-accounting-method
  - rule_id: attribute_economic
    applies_to: "inseparable joint burdens"
    rule: "Only if subdivision and causal physical attribution cannot resolve an actual joint burden, use comparable nonnegative producer-gate net-sales values for the same period/market/state and a positive total denominator, including defensible retained-stock valuations. Exclude taxes, freight beyond the common gate and unrelated receipts consistently. Missing, zero or negative values require a justified alternative with sensitivity; never allocate by profit or silently set negative shares."
    source_ids:
      - cuttlefish-accounting-method
  - rule_id: attribute_periods
    applies_to: "cohorts periods and shared services"
    rule: "Index egg/reproductive service, direct hatchling nursery, growout, collection, grades, holding, presentation, delivery, cleaning/changeover, idle and failed periods, asset replacement and termination. Carry opening quantities and inherited burdens to closing stocks and next-period receipts. Shared-asset service life, use and end-of-life use actual evidence and all consumers including other facility outputs, not only successful reference lots."
    source_ids:
      - cuttlefish-accounting-method
  - rule_id: attribute_once
    applies_to: "all exchanges"
    rule: "Assign one owner per event, service and physical transfer. Internal output/input pairs are connectors, not two independent burden-bearing acquisitions or final products. Do not duplicate complete services with component fuel/electricity/assets/releases; reconcile all consumer shares and carry failed/rejected/returned-lot burdens before dividing attributed native quantities by accepted A."
    source_ids:
      - cuttlefish-accounting-method
dataset_production:
  collection_protocols:
    - protocol_id: cp_water_supply
      process_id: "water_supply"
      flow_role: "All actual native flow instances at this node"
      record_type: "Primary records and measurements"
      raw_fields: "intake source/volume and water state; sand-filter/decant/aeration actual train and intervals; every supplied-water consumer/transfer/volume/quality; each incoming-effluent transfer and state; treatment/bypass; discharge destination/volume; influent background and effluent constituent concentrations/loads; backwash/sludge; meters; energy and asset consumers/service life; event/transfer/stock id; calibration; native property/unit; formula/factor/source and uncertainty for calculated instances; accepted A link"
      collection_method: "Meter marine intake, separately meter actual supplied volumes and matched effluent receipts, identify actual treatment and discharge owner. Sample actual influent and discharge volume/concentrations on matched intervals, retain substance/medium and calculate net release only with explicit measured inputs/formula/factor/source and background adjustment. Weigh actual treatment residues; record meter-calibration and shared service consumers. Record native amounts before one attribution and division by A; qualitative literature is not a quantity record."
      unit: "kg; m3; kWh; MJ; h; t.km as applicable to each actual instance"
      frequency: "Each actual event/transfer/phase and documented continuous-meter interval"
      temporal_coverage: "Full actual cohort/reporting and service periods, including failures, stocks, cleaning and termination"
      site_scope: "Seawater preparation and actual effluent management and matched handoffs only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration and node-specific original logs; matched ids; independent counts/state; asset/period/output shares; per-instance measured inputs/formula/factor/source and uncertainty"
    - protocol_id: cp_feed_preparation
