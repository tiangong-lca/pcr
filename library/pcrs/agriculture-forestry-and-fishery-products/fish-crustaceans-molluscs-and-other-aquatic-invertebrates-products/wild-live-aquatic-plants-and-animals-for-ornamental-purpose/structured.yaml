system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "capture"
      rule: "Community methods and species commerce are route evidence; application trip records must establish the selected hand-net SCUBA boat route for this species. Capture removes animals from wild context independently of sorting and preservation; no managed growout stage."
      source_ids:
        - priyashadi-ornamental-trincomalee-2023
    - rule_id: boundary_receipt
      applies_to: "logistics"
      rule: "Include all actual physical movement, handling and intermediate custody before first local ornamental buyer physical receipt, regardless payer/operator. An invoice, sale or contract is not the physical gate. Exclude actual post-receipt buyer operation."
      source_ids: []
    - rule_id: boundary_holding
      applies_to: "holding"
      rule: "Activate only observed bounded live holding with start/end, usable live state before/after and measured inputs/outputs. Otherwise require evidenced bypass; unknown state blocks finalization rather than selecting bypass."
      source_ids: []
    - rule_id: boundary_destinations
      applies_to: "all inventory rows"
      rule: "Enumerate every intended species/grade/resale/retained output with its own output instance and handoff, distinguish mortality/waste from downgraded commercial product, and observe incidental material entering sorting."
      source_ids: []
    - rule_id: boundary_periods
      applies_to: "all processes"
      rule: "Include trip, sorting/holding/presentation batch, leg and reporting-period records; failed/no-output trips, opening/closing live stock, mortality, cleanup, shared services, infrastructure, container replacement and actual termination burdens remain attributable."
      source_ids: []
    - rule_id: boundary_services
      applies_to: "all processes"
      rule: "A complete purchased service excludes duplicated constituent energy, assets and direct releases. For foreground-operated service record constituents and direct releases; treatment is modelled only when actual, with full subinventory or one complete service and never both."
      source_ids: []
    - rule_id: boundary_water
      applies_to: "all water and release rows"
      rule: "Pair managed-water transfers, record new direct intake separately from purchased supply, and distinguish intended reuse, waste to treatment and actual direct return. Each actual treatment instance inside a node has separately identified material/service inputs, treatment outputs and substance-specific releases."
      source_ids: []
    - rule_id: boundary_shared
      applies_to: "shared assets/services"
      rule: "Identify boat, diving/net/container equipment, holding/presentation site and vehicles actually shared among nodes/outputs/periods; record consumer list, acquisition, use, maintenance, replacement, service life, closure and one owner ledger. No universal lifetime."
      source_ids: []
    - rule_id: boundary_classification
      applies_to: "reference product"
      rule: "Retain wild origin, ornamental purpose and live crustacean state; fish and farmed ornamentals are excluded. The narrower boundary does not cover all aquatic ornamental organisms."
      source_ids:
        - un-cpc3-2025
