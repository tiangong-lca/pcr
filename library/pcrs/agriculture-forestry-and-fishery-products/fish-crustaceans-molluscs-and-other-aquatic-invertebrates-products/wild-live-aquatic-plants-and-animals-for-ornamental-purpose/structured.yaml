allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "all processes"
    rule: "First subdivide independently measured capture, sorting, holding, presentation and logistics events and directly assign dedicated resources. Apply only one owner for each transfer/shared service; physical internal transfers carry no duplicated burden."
    source_ids: []
  - rule_id: allocation_outputs
    applies_to: "mixed catch and grade outputs"
    rule: "Enumerate the full actual intended output set, including other species, lower commercial grades, resale, live retained/returned stock and independently intended container/water reuse. Separate product accompaniment from an independent product. After subdivision use measured causal service demand (boat/diver time, holding occupancy-time or leg payload-distance) when supported; document its physical rationale."
    source_ids: []
  - rule_id: allocation_fallback
    applies_to: "inseparable shared output burden"
    rule: "When causal demand cannot be supported, use documented nonnegative comparable producer-gate net-sales-value shares across the actual intended outputs, using actual commercial counts/prices and sales records with a positive total-value denominator. Net sales value means comparable sales proceeds after documented sales adjustments, not profit. Explicitly value unsold/retained stock on an evidenced comparable producer-gate basis and disclose uncertainty. Zero, negative or unavailable output values or a nonpositive denominator require a separately justified alternative allocation and sensitivity; compare a measured animal-mass alternative. If neither physical nor value-based attribution can be evidenced, retain an unresolved burden rather than zero. No substitution/avoided-product credit."
    source_ids: []
  - rule_id: allocation_periods
    applies_to: "periods and stock"
    rule: "Link acquisition, operation, failed/no-output trips, opening/closing live stock, mortality/replacement, cleanup, maintenance and termination to trip/batch/leg/reporting period. Carry inherited burden with retained/returned stock to the next period exactly once. Include failed-trip burden in the relevant period's actual intended output pool with declared rationale and sensitivity; a period with no accepted output remains an unresolved carried burden, never divide by zero."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "shared infrastructure and reuse"
    rule: "Maintain one asset/service ledger naming all consuming nodes and periods. Allocate boat/diving/net service by evidenced use, holding capacity by occupied service-time, presentation equipment and container service by recorded use/turns, and transport by actual leg demand. Record acquisition, replacement, maintenance, actual or justified service-life evidence, idle/failed use and closure; test alternatives when service-life evidence is incomplete, with no standard lifetime imposed. Reusable containers are not new full purchases at every transfer."
    source_ids: []
  - rule_id: allocation_losses
    applies_to: "mortality, returns and treatment"
    rule: "Actual losses retain their prior resource burden; assign their handling to the causal event and reporting pool, preserve any actual replacement activity, and never reclassify resale/downgrade as waste. Waste receiver service and direct release are mutually distinguished, with upstream waste and foreground treatment counted once."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "Capture resources, wild removal, retained animals, water, incidentals, alternate catch and losses/releases"
      record_type: "Trip log, measurement, service and asset record"
      raw_fields: "trip; species; wild site; SCUBA; hand net; boat; event; row/instance; transfer id; animal count and size/condition; net animal wet mass; water; incidentals; fuel/service/native unit; substance/medium/carbon basis; recipient; asset/use/period; failed trip; uncertainty"
      collection_method: "Confirm species/route with primary trip records; measure animal/water/incidentals separately with calibrated mass equipment and traceable counts; reconcile all destinations and paired transfers; use actual supplier/asset service records and substance-specific measured emission evidence; computed actual releases require their own declared formula, factor/source, measured components and uncertainty with calculated_value/calculated_from_collection rather than measured-release metadata"
      unit: "kg; count and each instance native unit retained separately"
      frequency: "Each trip, transfer, input and release event"
      temporal_coverage: "Entire trip plus attributable acquisition/service/reporting periods, including failed trips"
      site_scope: "Actual reef, boat, diver and receiving sorting site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Species/gear/boat proof; calibrated/tared weighing; count reconciliation; paired transfers; invoices/service scope; asset ledger; explicit gaps and uncertainty"
    - protocol_id: cp_sorting
      process_id: "sorting"
      flow_role: "Sorting received animals/water/incidentals, inputs, selected and alternate destinations, waste and returns"
      record_type: "Lot destination ledger and measurement"
      raw_fields: "lot/trip; incoming transfer id/state/quantity; instance; count; size/condition; net animal mass; water/incidentals; destination; holding active/bypass evidence; supply/native unit; treatment receiver; substance/medium; stock; period"
      collection_method: "Match T-CS-A/W/I; measure each animal grade and water/material stream independently; observe incidentals entering sorting; document condition/destination without diagnostic prescriptions; match T-SH or T-SP branch and every alternate handoff"
      unit: "kg; count and each instance native unit retained separately"
      frequency: "Every received lot, sorting event and output"
      temporal_coverage: "Full sorting batch, cleaning and reporting-period stock changes"
      site_scope: "Actual sorting location and its actual recipients"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Destination/custody ledger; animal-water-package separation; calibrated measurements; holding-state proof; waste and direct-return distinction"
    - protocol_id: cp_holding
      process_id: "holding"
      flow_role: "Active bounded holding animals/water, intervention inputs, resulting live/alternate stock and losses"
      record_type: "Intervention log, measurement and asset service record"
      raw_fields: "lot; active/bypass/unknown; start/end; before/after live state; T-SH/T-HP; animal count/size/condition/mass; water balance; actual inputs/native units; waste receiver; pollutant/medium/carbon; tank/container use; period/stock/failed batch"
      collection_method: "Require observed bounded intervention; match T-SH-A/W and T-HP-A/W; measure animal and water changes separately; record only actual resources, services and releases; if bypassed retain evidence without inventing holding inputs or outcomes"
      unit: "kg; duration and each actual instance native unit retained separately"
      frequency: "Each actual intervention and transfer"
      temporal_coverage: "Actual intervention interval and attributable equipment/reporting periods"
      site_scope: "Actual holding site only when active"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Time/state records; input invoices/meters; calibrated measurements; separate waste/return records; reuse/service ledger and uncertainty"
    - protocol_id: cp_presentation
      process_id: "presentation"
      flow_role: "Animals, water, protective materials, presented outputs, alternate products, waste and releases"
      record_type: "Presentation batch, package and custody record"
      raw_fields: "lot; actual branch; T-SP/T-HP; animal count/condition/mass; managed/new/purchased water; package material/native unit; single-use/reuse; T-PL; recipient; inputs; waste/treatment; direct substances/medium; service periods"
      collection_method: "Match actual branch inputs; measure animal mass excluding water/package; measure water and each package separately; document roles, reuse and actual protective state; pair T-PL-A/W/P and each alternate handoff"
      unit: "kg; count and each instance native unit retained separately"
      frequency: "Each presentation batch, acquisition/use and transfer"
      temporal_coverage: "Batch, cleanup, container/service and reporting periods"
      site_scope: "Actual presentation location and logistics handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Branch proof; calibrated/tared masses; package identity/reuse and transfer ledger; waste receiver and release records"
    - protocol_id: cp_logistics
      process_id: "logistics"
      flow_role: "Every pre-receipt movement, resources, animal reference, water/package custody, alternate output and loss"
      record_type: "Leg, weighing, commercial and physical custody record"
      raw_fields: "lot/trip; T-PL; all legs/operators/payers; distance; payload; time; empty return; actual service/native unit; animal species/count/size/condition; same-lot sampled count and net mass; accepted net mass A; water/package/incidentals tare; buyer/place/time/custody; loss/stock; treatment; pollutant/medium/carbon; asset/period"
      collection_method: "Match T-PL-A/W/P; follow every physical leg to first local ornamental buyer custody; use calibrated weighing or traceable same-lot net-animal weighing records independently excluding water/package/incidentals, preserving sample counts/uncertainty and commercial records; verify live condition and positive A at physical receipt; record complete service scope and distinct waste/return/alternate destinations"
      unit: "kg; count and each leg/input/output instance native unit retained separately"
      frequency: "Every leg, transfer, receipt, failed movement and loss"
      temporal_coverage: "From presentation handoff through first physical receipt plus attributable service/reporting periods"
      site_scope: "Actual route, intermediate locations and first buyer receipt site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated/tared same-lot animal mass; count/grade reconciliation; timestamped custody rather than invoice only; complete leg manifest; service exclusions; stock/asset ledger and uncertainty"
  calculation_rules:
    - id: same_lot_reference
      applies_to: "buyer_live_shrimp"
      rule: "Same-lot accepted animal mass A / A = 1 kg; require positive A, identical lot and independent animal-water-package separation."
      inputs:
        - A
        - cp_logistics
      output: "1 kg reference flow"
      source_ids:
        - same-lot-reference-identity
  data_quality_requirements:
    - id: quality_identity
      applies_to: "reference and actual instances"
      requirement: "Confirm species, wild origin, ornamental purpose and live state, trip-specific hand-net SCUBA boat route, exact input/output identity, native flow property and unit before final exchange binding."
      evidence: "Species and trip proof and verified identity details; explicit unresolved gaps"
    - id: quality_balance
      applies_to: "physical handoffs"
      requirement: "Match each named transfer output/input quantity/state/unit exactly; reconcile animal counts and independently measured mass, water, incidentals, package, alternate products, live stock, mortality and returns."
      evidence: "Paired custody records and node balances"
    - id: quality_state
      applies_to: "holding and receipt"
      requirement: "Demonstrate actual bounded holding or evidenced bypass, and first physical buyer custody with live accepted animals; unknown state or invoice-only evidence is incomplete."
      evidence: "Intervention/bypass and physical receipt records"
    - id: quality_periods
      applies_to: "all processes"
      requirement: "Cover all applicable complete trip, batch, transport-leg and reporting periods, including failed/no-output events, both opening and closing stock, acquisition, reuse, shared asset service, cleaning, maintenance, replacement and closure; reconcile one owner ledger."
      evidence: "Period ledgers and applicable asset and service ledgers, attribution rationale and sensitivity"
    - id: quality_ranges
      applies_to: "every flow card"
      requirement: "Establish each actual amount from records separately from symbolic uncertainty. Replace U_row with independently supported site/instance evidence before claiming bounded empirical uncertainty; preserve uncertainty for sample mass and allocation."
      evidence: "Measurements, sample representativeness and evidence tier disclosure"
    - id: quality_sources
      applies_to: "claims"
      requirement: "Literature supports qualitative route/community commerce only; never infer species-specific gear assignment, health procedures, castration, disease guarantee or numerical operating defaults from it."
      evidence: "Source passages and application evidence"
    - id: collect_capture_operations
      applies_to: "capture; Inputs; Product flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Actual boat, diver, net and ancillary supplies or services. For each actual boat fuel, purchased diving-air/compressor service, net, collection container, cleaning supply, energy or complete service, instantiate a separate exchange with its actual material/service identity, property and native unit. Use trip activity and shared-service attribution; a complete service excludes duplicated constituent fuel, electricity, assets and releases. Record each actual opening, received or returned managed live-stock input as its own concrete animal instance with species, wild-origin evidence, live state, Mass/kg and count, receipt/custody, inherited burden and a transfer id paired to the prior closing-stock or return output record. It is not a new wild abstraction; purchased/returned stock alone does not prove this PCR's species-specific capture route or permit bypassing upstream evidence. <br> - Flow property / unit: Actual instance property / actual native unit <br> - Amount rule: Measured actual collect_capture_operations quantity; cp_capture; allocated to the declared reference basis <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_capture <br> - Range: Unestablished instance-specific uncertainty; U_capture_operations requires independent observations, not a universal cap or empirical default <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_capture_operations <br> - Unit: instance native unit <br> - Basis: per 1 kg reference flow; each actual instance retains its native property and unit <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: collect_capture_other_resources
      applies_to: "capture; Inputs; Elementary flows"
      requirement: "Identify each actual physically or chemically specific exchange within this collection scope and add an independent inventory card; this collection scope is not a flow. Establish substance/species, state, flow type, property, native unit, quantity, evidence, normalization, destination and UUID separately for each card. Do not copy an aggregate quantity, common upper bound or UUID onto its members. Determine final direction and product/waste/elementary type from each actual source and fate; the collection scope does not assign a universal exchange type. Collection scope: Other wild organisms and substrate actually removed from the reef. Instantiate each actually removed non-reference organism or substrate resource separately with identity, medium/location, count where relevant and measured native quantity. Reconcile incidental removals and other intended catches with collect_capture_incidentals, collect_capture_other_products, mortality and actual returns; do not merge their resource quantities into target shrimp mass or assume every incidental is intended product. <br> - Flow property / unit: Actual instance property / actual native unit <br> - Amount rule: Measured actual collect_capture_other_resources quantity; cp_capture; allocated to the declared reference basis <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1 kg reference flow <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_capture <br> - Range: Unestablished instance-specific uncertainty; U_capture_other_resources requires independent observations, not a universal cap or empirical default <br> - Range role: Uncertainty range (uncertainty_range) <br> - Lower: 0 <br> - Upper: U_capture_other_resources <br> - Unit: instance native unit <br> - Basis: per 1 kg reference flow; each actual instance retains its native property and unit <br> - Basis kind: Reference flow (reference_flow) <br> - Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "Node collection protocol, original records and individual identity, quantity, range and destination evidence"
    - id: collect_capture_incidentals
