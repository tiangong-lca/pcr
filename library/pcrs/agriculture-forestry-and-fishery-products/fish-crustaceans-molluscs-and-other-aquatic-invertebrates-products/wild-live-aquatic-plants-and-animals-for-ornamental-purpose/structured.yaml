validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Reject reference animals lacking species/wild/live/ornamental/never-frozen proof, actual selected trip route or first physical local buyer gate. Retain commercial counts and condition independently from kg."
    source_ids:
      - priyashadi-ornamental-trincomalee-2023
      - un-cpc3-2025
  - rule_id: validate_measurement
    applies_to: "reference and inventory"
    rule: "Require positive accepted same-lot net animal mass A, final A / A = 1 kg, independent water/package/incidentals exclusion, calibrated or traceable mass evidence and native-unit preservation for every instance. No standard shrimp mass."
    source_ids:
      - same-lot-reference-identity
  - rule_id: validate_transfers
    applies_to: "process map"
    rule: "Require T-CS-A/W/I, the actual T-SH plus T-HP or evidenced T-SP branch, and T-PL-A/W/P; compare paired quantity/state/unit/owner and every intended alternate handoff, stock and loss. No duplicate final animals or re-abstracted water."
    source_ids: []
  - rule_id: validate_conditional
    applies_to: "holding"
    rule: "Active requires observed bounded intervention and complete own-node records; bypass requires evidence. Unknown does not equal inactive; missing actual state blocks finalization."
    source_ids: []
  - rule_id: validate_outputs
    applies_to: "all processes"
    rule: "Enumerate every intended species/grade/resale/stock output separately, distinguish downgrade from waste and incidentals from intended catch, and reconcile mortality, treatment versus direct release and substance/medium/carbon basis."
    source_ids: []
  - rule_id: validate_attribution
    applies_to: "allocation"
    rule: "Check subdivision, supported causal service demand then documented nonnegative comparable producer-gate net-sales-value fallback (not profit), positive denominator, explicit retained-stock values and exceptional-value justified alternative plus animal-mass sensitivity, all failed periods/stock carryover and shared infrastructure/service life rationale; every event/asset has one owner and no duplicate complete-service constituents. Unsupported attribution stays unresolved."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "data package"
    rule: "Missing quantity/identity/holding/receipt/range/period evidence is explicit incomplete coverage. Candidate guidance does not establish verified final exchanges or publication readiness; report performed/skipped checks and gaps."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable per-flow collection obligations and final exchanges"
    rule: "Final dataset completion and validation require every actual exchange to have an independent atomic card and its own quantity, property/native unit, collection or calculation evidence, range/uncertainty evidence, normalization, actual destination and verified UUID. Unknown identity, activity state, quantity, range evidence or fate blocks completion; it is never zero, a presumed bypass or permission to omit an obligation. Every important concrete flow retains its own range/uncertainty evidence collection duty; a symbolic upper bound is not an empirical range."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package with process and lifecyclemodel projections; secondary_dataset or background_dataset only after completed evidence/identity/quality review"
  downstream_use: "Wild live ornamental Pacific cleaner shrimp supply through the exact first local buyer physical receipt gate"
  allowed_use: "Evidence-matched species, route, state, geography, periods, intended outputs and handoff; retain count/size/condition alongside animal-mass reference"
  excluded_use: "Whole CPC-leaf substitution; farmed/food/dead/frozen/other-species products; post-receipt operations; health/safety/welfare/legal or avoided-impact claims"
  required_metadata: "Required qualifiers; trip/lot/period; native amount/unit; holding state; physical gate; actual process instances; transfer/stock/shared-asset ledger; source and attribution scope"
  required_quality_disclosure: "Identity gaps; actual amount versus symbolic uncertainty; same-lot mass sampling; failed periods; conditional-state evidence; service scope; asset/service life and allocation sensitivity; performed/skipped validation"
  update_trigger: "Changed route, species/origin/state/gate, input identities, measured amount/sample evidence, holding/presentation practice, output set, shared asset service or reporting-period stock treatment"
data_sources:
  - id: "priyashadi-ornamental-trincomalee-2023"
    type: "literature"
    reference: "Priyashadi, Deepananda and Jayasinghe (2023), Davao Research Journal 14(2):103–115, doi:10.59120/drj.v14i2.117; https://davaoresearchjournal.ph/index.php/main/article/download/117/117/419 ; methods/results pp104–107 and 110–111"
    used_for: "Qualitative Trincomalee wild reef ornamental collection, surveyed community gear and boat alternatives, actual Lysmata amboinensis commercial catch and local-buyer/exporter chain; not species-specific gear assignment, numerical defaults or health instructions"
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 explanatory notes (30 June 2025), printed p53; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Wild live ornamental aquatic animal scope and exclusions for fish/farmed origin; narrower crustacean subset"
  - id: "same-lot-reference-identity"
    type: "method_factor"
    reference: "Same-lot normalization identity: positive accepted net animal mass A divided by itself, with animal-water-package separation and physical receipt records"
    used_for: "Final 1 kg reference identity only; no empirical flow rates, universal animal mass or operating ranges"
