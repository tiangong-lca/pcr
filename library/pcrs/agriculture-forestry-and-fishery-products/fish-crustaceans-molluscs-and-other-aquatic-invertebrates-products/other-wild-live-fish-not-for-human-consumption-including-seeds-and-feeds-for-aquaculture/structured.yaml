allocation_rules:
  - rule_id: a_outputs
    applies_to: "all retained catch"
    rule: "Enumerate selected seed, broodstock or live-fish-feed output and every other intended retained product, each state, amount, own handover and destination. Keep incidental release, dead fish and waste distinct. Do not count one lot at capture, holding and gate as three sold products."
    source_ids:
      - wild-live-method-2026
  - rule_id: a_precedence
    applies_to: "shared capture and operations"
    rule: "Prefer subdivision/submetering; otherwise justify a causal physical relationship from actual effort or resource use. Mass is not automatically causal between unlike live-fish purposes. Where no defensible physical relationship exists, use documented same-period gate economic values and sensitivity, with currency and price coverage disclosed."
    source_ids:
      - ghg-product-2011
  - rule_id: a_losses
    applies_to: "mortality, rejects, release and escapes"
    rule: "Retain all actual burdens and treatment on the studied output system before any justified co-product allocation. No zero-burden dead product or avoided-wild-removal credit. A marketed secondary output receives an explicit allocation decision rather than silently becoming waste."
    source_ids:
      - wild-live-method-2026
  - rule_id: a_shared
    applies_to: "shared assets, utilities and providers"
    rule: "Enumerate every consumer of each vessel, holding tank, pump, refrigeration unit, vehicle, reusable container or contracted activity over the recorded service period. Use submetering or documented use-hours/occupancy/effort as causally justified; shares sum to the measured burden exactly once, including idle and cleaning shares."
    source_ids:
      - wild-live-method-2026
  - rule_id: a_period
    applies_to: "trips, continuous holding and carryover"
    rule: "Assign trip-specific fuel/catch to that trip and continuous utilities by recorded occupancy and time where justified. Link cleaning/changeovers to actual runs. Carry opening fish and asset burdens forward once, reconcile closing stock and retired assets; do not charge full manufacture or the same retained fish each reporting year."
    source_ids:
      - wild-live-method-2026
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "all actual stage exchanges"
      record_type: "meter, log, invoice, sampling, analysis and fate records"
      raw_fields: "cohort/trip/run/period; source/consumer; material/substance; quantity; count; state; timestamps; water source/salinity/flow; concentration/species/background; destination; factors; allocation"
      collection_method: "Calibrated meters/scales and traceable supplier records; stage-entry/exit live counts and representative weighing; timed flow-weighted analyses; reconcile fuels, assets, cleaning and all fates with provider boundaries"
      unit: "kg; MJ; original kWh/volume/count/time and substance units retained"
      frequency: "every batch/run, continuous meters and each loss/cleaning event"
      temporal_coverage: "full selected trip, holding interval, transfer, dispatch and reporting periods"
      site_scope: "actual capture/collector locations and named providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; sample design; laboratory blanks/detection/uncertainty; source receipts; consumer/period ledger"
