      record_type: "weighing and acceptance record"
      raw_fields: "species; purpose; life stage; count; sample mass; drained fish mass; tare; viability; rejects; time; recipient; cohort/source fractions"
      collection_method: "Weigh accepted live fish on a calibrated scale with a documented viability-preserving drainage and tare procedure; representative actual cohort sample weighing for count conversion; exclude packages, water and nonqualifying fish"
      unit: "kg"
      frequency: "every dispatch cohort"
      temporal_coverage: "capture through first handover with opening/closing stocks"
      site_scope: "actual first collector gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; tare/drain method; sample representativeness; counted fish; purpose-specific recipient acceptance"
  calculation_rules:
    - id: normalize_cohort
      applies_to: "stage quantities"
      rule: "Divide each attributable actual stage exchange by the same positive accepted net viable-live gate biomass; retain original stage wet mass and counts. Sum source-cohort contributions once after allocations, not before matching periods."
      inputs:
        - "stage records"
        - "accepted gate biomass"
        - "allocation ledger"
      output: "amount per 1 kg reference flow"
      source_ids:
        - wild-live-method-2026
    - id: count_conversion
      applies_to: "fish counts"
      rule: "Estimate cohort wet mass only from actual representative measured individual/sample wet masses and actual counts; retain sample weighting, variability and uncertainty. No generic count factor."
      inputs:
        - "sample weights"
        - "sample design"
        - counts
      output: "kg and uncertainty by cohort"
      source_ids:
        - wild-live-method-2026
    - id: cohort_reconcile
      applies_to: "live fish"
      rule: "Opening live fish plus captured/received fish equals accepted live handover plus closing live fish, co-products, mortalities, rejects, documented release/escapes and other identified losses; conserve fish counts across all fates, and separately reconcile wet biomass with documented feed uptake, metabolism, respiration, excretion, water-content change and sampling uncertainty. Carry prior burdens with opening/closing stock to its actual terminal fate; these explanations do not permit managed growout inside preservation."
      inputs:
        - "dated cohort/source ledger"
      output: "reconciled live-fish history"
      source_ids:
        - wild-live-method-2026
    - id: waterborne_load
      applies_to: "direct discharge substances"
      rule: "Integrate measured concentration times actual discharge flow and duration, with disclosed background adjustment and exact mass/species conversion; retain negative/uncertain differences for review rather than silently treating removal as a credit."
      inputs:
        - "analytical records"
        - flow
        - duration
        - background
        - units
      output: "kg of each named substance to its actual medium"
      source_ids:
        - wild-live-method-2026
    - id: combustion_load
      applies_to: "direct fossil emissions"
      rule: "Calculate actual burned fossil fuel carbon times justified oxidation and molecular conversion factors or use compatible measured emissions; retain fuel, factor source and uncertainty without assuming an identity supplies a factor."
      inputs:
        - "fuel records"
        - "independently justified factors"
      output: "kg fossil CO2 and other exact substances"
      source_ids:
        - wild-live-method-2026
  data_quality_requirements:
    - id: dq_trace
      applies_to: "reference and intermediates"
      requirement: "Preserve actual species, wild locality/trip, purpose, life stage and cohort composition across pooling; incomplete origins are not repaired by a generic species name."
      evidence: "Capture and transfer records; recipient acceptance"
    - id: dq_viability
      applies_to: "gate"
      requirement: "Weigh only qualifying live fish; report count, size distribution, actual viability/health and purpose suitability. Seed development, broodstock maturity/fitness and live-feed suitability require distinct recipient evidence."
      evidence: "Calibration/tare/sample records; inspection and dispatch documents"
    - id: dq_complete
      applies_to: "every selected node"
      requirement: "Screen actual fuel, electricity, water sources, oxygen, physical cooling/health/feed/cleaning inputs, products, bycatch, solids, effluent, direct substances, leaks and escapes. Record unused roles explicitly and unknowns as gaps."
      evidence: "Stage balance, meters, invoices, laboratory QA and fate receipts"
    - id: dq_range
      applies_to: "every card"
      requirement: "Replace provisional author screens with actual records or reviewed empirical/source evidence when available. Investigate outliers, never truncate actual data to the screen."
      evidence: "Range review and uncertainty explanation"
    - id: dq_detection
      applies_to: "all water-analysis and direct waterborne-substance load records under cp_capture, cp_holding, cp_transfer and cp_handover"
      requirement: "Retain the original laboratory result, substance/element basis, reporting unit, sampling time, analytical method, detection and quantification limits where applicable, and analytical uncertainty. Record an explicit justified treatment of each non-detect, including its bounded estimate or unresolved gap and propagated load uncertainty; a non-detect is not automatically zero. Do not invent a universal substitution fraction or replace missing samples with zero. Missing limits or a defensible treatment remain disclosed gaps that block finalization of the affected quantitative exchange."
      evidence: "Laboratory report, method and limits; censored-result decision and load uncertainty record"
    - id: dq_period
      applies_to: "shared and carried burdens"
      requirement: "Reconcile consumer shares, stock and asset events over complete periods; disclose data age, missing seasons and representativeness."
      evidence: "Dated allocation/asset and cohort ledgers"
    - id: dq_inventory_completion
      applies_to: "all inventory-completion requirements"
      requirement: "Create a separate card for every actual physical or chemical exchange, with process, direction, flow type, its own measured quantity, native unit, final-reference normalization, applicability, destination, UUID and independent range evidence. Never copy a family total, a grouped screening range or one UUID onto every child. Use not_applicable only for evidenced absence; unknown is not zero. Any unfulfilled applicable obligation makes the final dataset incomplete and fails validation."
      evidence: "per-flow coverage ledger, raw measurements, identity, fate and range evidence"
