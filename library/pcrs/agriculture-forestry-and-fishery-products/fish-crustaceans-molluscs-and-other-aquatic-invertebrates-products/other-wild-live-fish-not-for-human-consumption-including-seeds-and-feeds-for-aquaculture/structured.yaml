    - id: dq_atomic_card_identity
      applies_to: "all inventory rows"
      requirement: "Each card represents one physically identified exchange, not a collection or selector. Keep Electricity as one electrical-energy flow; supplier, geography and voltage remain actual collected qualifiers, not grounds for speculative splitting. Other actual materials, waste streams, carbon origins and receiving media must have separate identities and atomic cards before completion. Preserve every existing collection obligation; an absent card or unresolved identity never means zero or a waived exchange. Paired internal water transfers retain the same actual quality, transfer id, quantity and upstream burden, without another purchase."
      evidence: "Per-card identity, provider, state, destination and paired records"
    - id: dq_atomic_range_evidence
      applies_to: "repaired atomic flow cards"
      requirement: "U_row is an unresolved evidence requirement, not a numerical estimate, default, clipping limit or completeness pass. Establish each card's own matching-unit/reference-basis upper envelope from independent representative records or a compatible documented supplier/design bound, retaining scope, method and uncertainty. Do not reuse a removed aggregate range, copy a sibling quantity, derive a bound from the target batch itself or invent a value. Applicable missing evidence blocks quantitative QA completion; actual measurements remain required."
      evidence: "Independent envelope evidence; retained raw records and uncertainty"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference"
    rule: "Reject unknown purpose, non-wild origin, non-live state, managed production hidden as holding, excluded products or missing gate identity. Do not equate species, life stages or purposes by kg alone."
    source_ids:
      - un-cpc-2025
      - wild-live-method-2026
  - rule_id: v_mass
    applies_to: "all inventory rows"
    rule: "Confirm one final 1 kg reference, actual tare/drain procedure and count-to-mass evidence, common denominator and units, measured intermediate quantities, complete mortality/reject exclusion and nonzero accepted biomass."
    source_ids:
      - wild-live-method-2026
  - rule_id: v_route
    applies_to: "process map"
    rule: "Require actual selected order, entry/exit states, separate capture and holding, declared transfer boundary and live handover. Every conditional omission needs evidence; unknown activity is not inactive."
    source_ids:
      - wild-live-method-2026
  - rule_id: v_inventory
    applies_to: "every selected node"
    rule: "Check each material role, source/destination and fate, external versus circulated water, provider treatment versus direct release, substance/media specificity and separate upstream/direct emissions. Missing materially plausible flows are disclosed gaps."
    source_ids:
      - wild-live-method-2026
  - rule_id: v_attribution
    applies_to: "outputs, modes, periods and assets"
    rule: "Check complete intended-output set and handovers, chosen method precedence, consumer shares, batch/continuous runs and changeovers, stock carryover, replacement and terminal events. Fail unexplained double counts or losses."
    source_ids:
      - ghg-product-2011
      - wild-live-method-2026
  - rule_id: v_identity
    applies_to: "exchange identities"
    rule: "Final exchanges require verified compatible concrete flow/property/unit identity; conditional material collection obligations require actual expansion. Unverified product or support identity remains an explicit data gap and does not establish publication readiness."
    source_ids:
      - wild-live-method-2026
  - rule_id: v_quality
    applies_to: "ranges and evidence"
    rule: "Every amount has basis, condition, protocol/evidence and finite Range. Confirm actual foreground precedence, explain outliers and uncertainty, and do not treat initial author screens or historical husbandry examples as mandatory site performance."
    source_ids:
      - wild-live-method-2026
  - rule_id: v_detection
    applies_to: "water analyses and direct waterborne releases"
    rule: "Verify dq_detection for every applicable result and resulting substance load: retain raw results and applicable detection/quantification limits, explicit non-detect treatment and propagated uncertainty. Neither a non-detect nor a missing sample implies zero. Unresolved treatment or required analytical evidence prevents finalization of the affected exchange."
    source_ids:
      - wild-live-method-2026
  - rule_id: validate_inventory_completion
    applies_to: "all concrete exchanges and section 8 completion obligations"
    rule: "Verify each applicable dq_complete obligation has separately measured and identity-verified exchange cards. Check each quantity, native unit, range evidence, normalization, receiving medium, destination and non-duplication. Any unfulfilled actual child exchange, quantity, identity or destination makes the final dataset incomplete and fails validation; unknown cannot be zero. Static PCR checking does not replace this evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Aquaculture-purpose foreground package as upstream live-fish supply to process or lifecyclemodel construction"
  allowed_use: "Matching wild origin, species/life stage, declared purpose, capture/holding route, region/time and first collector gate with quality/identity disclosure"
  excluded_use: "Food or ornamental fish, farm-produced fish, unhatched eggs, dead/processed feed, recipient farming/transport, unsupported biological equivalence or unresolved concrete exchange publication"
  required_metadata: "PCR/version; species/purpose/life stage; wild source/trips/gear; cohort counts and wet mass; gate/recipient; selected routes/durations; geography/time; allocation/co-products; shared assets/periods; upstream datasets and verified exchanges"
  required_quality_disclosure: "Sampling/calibration; observed viability, health and purpose fitness; losses/bycatch/releases/escapes; uncertainty; upstream/proxy gaps; provisional ranges; representativeness; checks performed and skipped"
  update_trigger: "Changed species/purpose/gate, actual managed production, new capture/holding route, major input/effluent or health change, asset/service/allocation change, new identity evidence or revised authoritative guidance"
