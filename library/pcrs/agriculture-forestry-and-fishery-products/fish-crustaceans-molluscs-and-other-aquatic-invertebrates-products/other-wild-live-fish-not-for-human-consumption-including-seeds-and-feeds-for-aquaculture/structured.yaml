measurement_rules:
  - id: live_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use cp_gate_mass to weigh accepted live fish on calibrated equipment with a documented draining/tare procedure that preserves viability; subtract water, gas, packaging and rejected fish. Record measurement timing, counts and sampling uncertainty."
  - id: count_mass
    applies_to: "all fish transfers"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use representative actual cohort weighing and counts; retain individual/sample mass, sample design, variability and count uncertainty. Never apply universal fish-per-kg, egg-count-to-fish-mass or water-volume-to-fish-mass factors [wild-live-method-2026]."
  - id: energy_units
    applies_to: "electricity and thermal energy"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve meter kWh, convert to MJ with 3.6 MJ/kWh only when compatible with the verified energy group; retain heat/cold and electricity separately. Fuel remains actual material mass plus documented calorific value [wild-live-method-2026]."
  - id: substance_basis
    applies_to: "water, chemicals and direct releases"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert water volume with actual density; keep salinity and source. Record formulated-product and active-substance mass separately. Direct waterborne emissions require concentration, flow, duration, background, elemental/species basis, units and laboratory QA; never relabel N as nitrate or total phosphorus as phosphate without a justified conversion [wild-live-method-2026]."
