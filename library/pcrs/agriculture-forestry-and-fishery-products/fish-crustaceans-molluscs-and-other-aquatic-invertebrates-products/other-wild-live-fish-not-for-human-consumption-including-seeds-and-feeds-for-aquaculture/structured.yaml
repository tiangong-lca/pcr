  classification_refs: "CPC 3.0 04191; narrower relation"
  covered_products: "Wild live fish actually destined for aquaculture seed, broodstock or live-fish feed, with one declared purpose and cohort"
  excluded_products: "Ornamental, direct human-consumption, research-only/recreational bait, farm-produced fish, dead/processed feed, unhatched eggs/gametes and non-fish organisms"
  representative_product: "A traceable viable wild-caught juvenile seed cohort at first collector handover; not a universal species or size"
  production_route: "Wild capture and separation → actual bounded live holding if used → actual collector-controlled pre-gate transfer if used → live presentation/loading and first collector handover"
  market_state: "Viable live fish, with count and measured net wet biomass, declared purpose and life stage"
functional_unit:
  what: "Qualified wild live fish for one declared aquaculture purpose at first collector handover"
  how_much: "1 kg net viable-live wet fish biomass, excluding water, gas, cooling material, containers and nonqualifying fish"
  how_well: "Species and origin verified; seed stage and recipient suitability, broodstock maturity/fitness, or live-fish-feed suitability documented for the selected purpose; actual viability and health records, without a universal survival promise"
  how_long_or_cycle: "Declared capture trip/season, holding and transfer entry/exit times, dispatch cohort and reporting periods; trace opening/closing stock and asset service periods across years where applicable"
  reference_flow_link: "handover_live_fish_gate"
system_boundary:
  rules:
    - rule_id: b_capture
      applies_to: "capture"
      rule: "Capture removes fish from nature and ends at separated viable catch. Record intended catch, retained incidental products, intentional release, dead catch and lost gear independently from subsequent live holding."
      source_ids:
        - fao-cba-2011
        - wild-live-method-2026
    - rule_id: b_holding
      applies_to: "holding"
      rule: "Include actual bounded recovery/acclimation/health control from viable entry to viable exit. Record duration and biomass trajectory; a managed production interval is ineligible here. Mortality, leftovers, effluent and escapes remain assigned to this stage."
      source_ids:
        - wild-live-method-2026
    - rule_id: b_gate
      applies_to: "transfer; handover"
      rule: "Include actual collector-owned pre-gate transport once with its fuel, live support and losses. Presentation/loading encloses or protects living fish and ends at first collector handover; recipient transport, stocking and farming begin outside. Actual no-package direct loading still requires gate checks."
      source_ids:
        - wild-live-method-2026
    - rule_id: b_assets
      applies_to: "all selected processes"
      rule: "Record vessels, tanks, aeration/oxygen equipment, refrigeration, reusable containers and vehicles, every consuming node and service period, manufacture/replacement/maintenance and terminal fate. Metered operation and asset burdens must not overlap. Actual owned electricity, oxygen, heat/cold or water preparation requires its complete upstream resources and releases with allocated service burden, without duplicate purchased supply. Generic contracted services use a separate provider activity ledger with compatible units; do not fabricate kg exchanges."
      source_ids:
        - wild-live-method-2026
    - rule_id: b_periods
      applies_to: "all selected processes"
      rule: "Link capture trips/seasons, holding batches, transfer runs, dispatch lots, cleaning/changeovers and opening/closing stock to dated reporting periods. Record boundary inventories and carried burdens, asset replacements and retirement once."
      source_ids:
        - wild-live-method-2026
boundary_abstraction:
  declared_starting_condition: "Living fish in a named wild habitat immediately before the selected capture activity; no owned hatchery or managed production is assumed"
  starting_condition_role: "Natural capture context; record actual removals, habitat/gear interactions and capture effort"
  product_classification_scope: "Wild live fish for declared aquaculture seed, broodstock or live-fish feed; narrower than all other nonfood wild live fish"
  recursive_input_rule: "For a purchased same-category cohort, retain verified wild-origin and upstream capture/holding burdens through its documented supplier gate; link the upstream dataset once and exclude duplicate upstream operations from owned foreground"
  upstream_dataset_requirement: "Supplier materials, electricity, fuels, physical assets and purchased fish require compatible stage/gate datasets with geography, technology, time and allocation disclosure; absent upstream evidence is an explicit gap rather than zero burden"
  disclosure: "Declare ownership/gate, actual sequence and omission conditions, capture habitat, trip/cohort pooling, opening/closing stocks, mortality/fates, outsourced activities, shared vessel/tank/oxygen/refrigeration/vehicle consumers and service periods"
