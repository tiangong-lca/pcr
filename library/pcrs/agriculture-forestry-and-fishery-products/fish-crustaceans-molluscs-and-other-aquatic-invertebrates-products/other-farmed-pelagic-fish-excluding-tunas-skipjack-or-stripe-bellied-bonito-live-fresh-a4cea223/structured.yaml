    - rule_id: boundary_seed
      applies_to: "grow_juveniles"
      rule: "Purchased juveniles carry complete wild collection, nursery, feed, energy and inbound transport burdens to the declared farm receipt. They are neither burden-free wild seed nor a duplicate foreground hatchery; document supplier boundaries and any missing upstream activity."
      source_ids:
        - fao-japanese-amberjack-2009
    - rule_id: boundary_gate
      applies_to: "amberjack_live_accepted"
      rule: "End at the first farmer physical recipient accepting the fish alive before slaughter. Dispatch, invoice ownership, live arrival and physical acceptance are different events; use the declared actual acceptance. Later wholesale holding, slaughter, bleeding, icing and retail are excluded unless they occur before this declared gate, in which case a dead state falls outside this PCR."
      source_ids:
        - fao-japanese-amberjack-2009
    - rule_id: boundary_period
      applies_to: "cohorts"
      rule: "Declare stocking, cage transfers, harvest, sorting, holding, delivery and acceptance phases across each calendar reporting period. Opening/closing live stocks and return transfers carry their attributable burdens once; failed cycles, idle care, mortality disposal, net changes and termination events remain accounted for."
      source_ids:
        - accepted-live-mass-accounting
    - rule_id: boundary_owner
      applies_to: "all nodes"
      rule: "For every craft, cage, tank, vehicle and support service, identify its actual consuming nodes and periods and one owner. Select provider-inclusive or direct fuel/power/emissions/capital accounting for each component without overlap. No independent primary conditioning or product packaging operation is presumed for the live tank channel."
