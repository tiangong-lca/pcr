allocation_rules:
  - rule_id: allocation_outputs
    applies_to: "intended outputs"
    rule: "Enumerate all actual intended live grade/destination outputs and handoffs, including side sales outside the reference channel. Subdivide independently metered operations first; allocate remaining joint growout/harvest/sort/preservation burdens to intended live outputs by accepted net live mass at their own gate, using a documented output ledger and period linkage. If a different causal relation is evidenced, obtain a reviewed explicit replacement before finalization; disclose sensitivity."
    source_ids:
      - accepted-live-mass-accounting
  - rule_id: allocation_returns
    applies_to: "internal transfers"
    rule: "Internal cage, harvest, sorting and holding transfers, live returns and period carryover are linked stock movements, not independent final outputs. Transfer their existing burden without allocating it again; split partial harvests using cohort/period activity records. Biological growth means juvenile input mass need not equal harvested output mass."
    source_ids:
      - accepted-live-mass-accounting
  - rule_id: allocation_losses
    applies_to: "loss and waste"
    rule: "Mortality, escaped fish, incidental organisms and actual waste are not automatic co-products. Keep attributable loss, failed-cycle and treatment burdens with accountable production; grant no fish-stock, nutrient-removal or carbon credit without a separately reviewed method and evidence."
    source_ids:
      - accepted-live-mass-accounting
  - rule_id: allocation_shared
    applies_to: "shared assets and periods"
    rule: "Enumerate actual shared cage/net/mooring/craft/tank/vehicle consumers and periods. Attribute direct usage by meters or logged operating/occupancy time, with attributable capacity only when documented; record asset installation, repair, replacement and termination over actual evidenced service, no default lifetime. The sum of shares equals the recorded burden once, including idle/nonproductive service; disclose unresolved replacement or service evidence."
    source_ids:
      - accepted-live-mass-accounting
