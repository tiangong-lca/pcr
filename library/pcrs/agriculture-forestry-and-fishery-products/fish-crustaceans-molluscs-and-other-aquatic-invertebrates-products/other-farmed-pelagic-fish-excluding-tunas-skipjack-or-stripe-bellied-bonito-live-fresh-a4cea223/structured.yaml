      raw_fields: "lot; tank/vehicle; dispatch and recipient times/locations; actual live-state checks; gross/tare/free-water/net accepted mass A; calibration and count samples; actual water/oxygen/power/fuel/service logs; rejected/live returned/dead mass and destinations; effluent medium/species/treatment; period and transfer ids"
      collection_method: "Use calibrated meters and traceable weighing, stock, supplier-service and handoff records; inspect live state/destination and retain applicable environmental measurement/factor evidence"
      unit: "kg; count; native unit per instance"
      frequency: "each event/lot; continuous service by meter period; close each reporting period"
      temporal_coverage: "all relevant cohort phases and periods from receipt to final acceptance"
      site_scope: "declared Japanese site, suppliers and actual node ownership"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw invoices/logs, count/mass samples, supplier boundaries, paired handoffs, methods/factors and independent review"
  calculation_rules:
    - id: normalize_accepted
      applies_to: "all inventory rows"
      rule: "Divide the same lot attributable actual node exchange quantity by accepted net whole live mass A recorded in cp_deliver to obtain its quantity per 1 kg reference flow; preserve numerator native unit."
      inputs:
        - cp_grow
        - cp_harvest
        - cp_sort
        - cp_deliver
      output: "quantity per 1 kg reference flow"
      source_ids:
        - accepted-live-mass-accounting
    - id: reference_identity
      applies_to: "amberjack_live_accepted"
      rule: "Reference output uses the same acceptance record A / A = 1 kg reference flow; this identity establishes neither input/output yield nor zero missing losses."
      inputs:
        - A
        - cp_deliver
      output: "1 kg reference flow"
      source_ids:
        - accepted-live-mass-accounting
    - id: stock_reconciliation
      applies_to: "cohorts"
      rule: "Reconcile cohort/period opening count plus purchases/transfers against closing count, transfers, intended outputs, recorded deaths/escapes and other states; separately reconcile sampled body mass, growth, feed stocks and uncertainty, preserving unexplained discrepancies."
      inputs:
        - cp_grow
        - cp_harvest
        - cp_sort
        - cp_deliver
      output: "linked biological and feed ledgers"
      source_ids:
        - accepted-live-mass-accounting
    - id: direct_emission
      applies_to: "environmental exchanges"
      rule: "Use recorded direct activity with applicable substance/medium-specific factors or measurements; retain factor source, species, carbon origin or elemental basis and uncertainty, without a universal emission factor."
      inputs:
        - "node protocol"
        - "applicable factor or measurement"
      output: "evidenced substance release amount"
      source_ids:
        - accepted-live-mass-accounting
  data_quality_requirements:
    - id: quality_scope
      applies_to: "reference and seed"
      requirement: "Match species, wild seed origin, purchased nursed state, Japanese cage and actual live gate"
      evidence: "supplier origin/nursery boundary, site and acceptance records"
    - id: quality_period
      applies_to: "all nodes"
      requirement: "Cover all cohort periods and nonproductive services; preserve time/location/transfer links; no unweighted multisite mixing"
      evidence: "complete event and stock ledgers"
    - id: quality_measure
      applies_to: "all inventory rows"
      requirement: "Retain calibration, assay method, representative samples, native units and conversion uncertainty; missing is not zero"
      evidence: "raw weighing, meter, sample and factor records"
    - id: quality_ranges
      applies_to: "all inventory rows"
      requirement: "Support and approve each instance upper bound independently; otherwise disclose unresolved range evidence without claiming empirical ranges"
      evidence: "independent historical reference or applicable external evidence and review decision"
