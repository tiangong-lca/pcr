system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "route"
      rule: "Include purchased wild-origin nursed juveniles, managed sea-cage growout, separate live harvest, sorting, and preservation/delivery to the selected live receipt. Exclude hatchery-origin seed, wild adult capture, other Seriola and all slaughter or dead-product processing."
