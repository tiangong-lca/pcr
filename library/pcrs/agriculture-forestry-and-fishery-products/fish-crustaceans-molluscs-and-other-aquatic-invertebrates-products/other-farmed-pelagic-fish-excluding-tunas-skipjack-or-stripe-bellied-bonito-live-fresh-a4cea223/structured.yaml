validation_rules:
  - rule_id: validate_identity
    applies_to: "reference"
    rule: "Verify species, Japanese sea-cage route, wild-origin purchased nursed seed, complete whole-body live state, actual pre-slaughter first physical recipient gate and all qualifiers. Reference link must name amberjack_live_accepted, whose accepted mass is the same denominator in all nodes."
    source_ids:
      - accepted-live-mass-accounting
  - rule_id: validate_records
    applies_to: "all inventory rows"
    rule: "Require node-owned collection protocols and complete raw records, calibration, transferred lot ids, stock terms and native unit conversions. Reconcile count ledgers including opening/closing stocks, inputs, harvests, returns, deaths, escapes and intended outputs; reconcile growth/feed and uncertainty separately rather than forcing mass equality."
    source_ids:
      - accepted-live-mass-accounting
  - rule_id: validate_emissions
    applies_to: "environmental exchanges"
    rule: "Check substance/species, receiving medium, nutrient or active-ingredient basis and actual direct ownership. Distinguish biological ledger states, collected waste, treated wastewater and direct releases; reject duplicate whole-organic and constituent accounting or fossil attribution to respiration."
    source_ids:
      - accepted-live-mass-accounting
  - rule_id: validate_attribution
    applies_to: "cohorts and services"
    rule: "Check all intended grade handoffs, failed cycles, idle support, partial harvest and period carryover; shared consumers and shares must be complete and exclusive. Unresolved causal allocation, asset replacement or termination evidence blocks finalization."
    source_ids:
      - accepted-live-mass-accounting
  - rule_id: validate_ranges
    applies_to: "all inventory rows"
    rule: "Every 0..U_row or U_instance range is an unresolved evidence need, never a measured or sourced estimate. Establish each upper bound independently from applicable external evidence or independently approved historical reference records, and review its scope before use. Do not validate the measured batch with its own maximum, substitute zero for missing evidence, or aggregate unlike native units."
    source_ids:
      - accepted-live-mass-accounting
  - rule_id: validate_bindings
    applies_to: "downstream publication"
    rule: "Resolve each actual product, waste, elementary and service exchange to a compatible verified identity and support property/unit before final downstream exchange publication. Candidate projection/check success does not establish identity verification, empirical range support or publication readiness."
    source_ids:
      - accepted-live-mass-accounting
  - rule_id: validate_atomic_completion
    applies_to: "all applicable collection requirements and concrete inventory exchanges"
    rule: "Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Input to downstream process or lifecyclemodel for the same declared route, species, seed origin and live gate"
  allowed_use: "matching live Japanese amberjack supply after identity, measured data, upstream, period and allocation review"
  excluded_use: "other Seriola/species; wild adult fish; hatchery-origin route; dead, slaughtered, filleted or frozen products; unreviewed ecological credits"
  required_metadata: "all reference qualifiers, gate, cohort, time/geography, upstream coverage, nodes and concrete exchange identities, native units, measurement and allocation method"
  required_quality_disclosure: "unresolved identities/ranges, gaps, losses, release methods, carryover, failed cycles, shared-service inclusions and uncertainty"
  update_trigger: "change in species/seed origin, feed/management, site, technology, delivery state/gate, data period, upstream, allocation or evidence"
data_sources:
  - id: "fao-japanese-amberjack-2009"
    type: "official_guidance"
    reference: "FAO. 2009. Seriola quinqueradiata. Cultured aquatic species fact sheets. Text by Dhirendra P.T.; ed. Crespi and New. https://www.fao.org/fishery/docs/DOCUMENT/aquaculture/CulturedSpecies/file/en/en_japaneseamberjack.htm ; retrieved 2026-10-12"
    used_for: "qualitative species, wild seed/nursery, cage route, feed classes, harvest/sorting and distinct live market channel evidence; no dated shares, prices, production, durations or factors as defaults"
  - id: "accepted-live-mass-accounting"
    type: "method_factor"
    reference: "Accepted net live mass, transfer, stock and burden-ownership accounting identities defined in this PCR sections 3–9"
    used_for: "foreground collection, normalization, reconciliation, exclusive ownership and intended-output allocation rules; no empirical yields or factors"
