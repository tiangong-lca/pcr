allocation_rules:
  - rule_id: subdivision
    applies_to: "intended_outputs"
    rule: "First subdivide directly measured node, leg and lot burdens. For inseparable shared capture/conditioning burdens among animal grades, assign by measured same-state animal mass; never compare whole intake with eviscerated output without the measured material balance. Useful viscera or other unlike products require an explicit justified causal rule; if unavailable use documented contemporaneous net revenue shares at the actual handoff and test sensitivity against mass attribution where physically meaningful. No output is presumed valuable."
    source_ids: []
  - rule_id: period_attribution
    applies_to: "reporting_season"
    rule: "Carry actual failed trips/batches, mortality, unsuccessful delivery, idle capacity, stock and cleanup through the declared season/service pool. Assign direct events to their lots; allocate unavoidable common trip/season burdens to supported intended outputs, with open stock carrying attributable burden forward. Do not divide zero-output periods by zero or drop them; link them to the supported service period and test that linkage. Reconcile opening plus additions minus outputs/losses equals closing stock by state."
    source_ids: []
  - rule_id: shared_service
    applies_to: "assets_and_services"
    rule: "List vessel, deck, bags, SCUBA cylinders, compressor, holding equipment, scales and totes with all consuming nodes and periods. Attribute measured operating burden by logged use, load or causal service, and embodied/replacement/retirement burden by evidenced total service throughput with explicit remaining-life assumptions and sensitivity. One asset/event owner reconciles shares to 100%; complete purchased service excludes its component fuel/electricity/assets/releases. Do not double count reusable tote manufacture at return."
    source_ids: []
  - rule_id: no_credit
    applies_to: "waste_and_returns"
    rule: "Assign waste handling and actual releases to their generating lot/service; reusable returns are service loops. No substitution credit for live returns, recovered viscera, discarded organic material or seawater is allowed by this PCR. Report allocation method, denominator and counterfactual sensitivity separately from observed exchanges."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "Boat-supported SCUBA hand capture"
      record_type: "Primary node/lot/period ledger"
      raw_fields: "SCUBA cylinder/fill ID; purchased filled-air versus own-compression boundary; compressor meter/fuel and fill interval; dive/failed-dive log; whole T_CC live animal weight; T_CM incidental matter; vessel trip legs; row/instance; lot/trip/season; asset/service period; opening/closing stock; allocated shares; U observations"
      collection_method: "Reconcile purchased breathing-air invoices/cylinder fills against own compressor energy to exclude duplicate air-production burdens; weigh T_CC whole animals before conditioning separately from T_CM; record all successful and failed SCUBA dives and vessel activity. Use calibrated node measurements and native-unit meters/supplier records; retain each chemical identity, carbon origin, receiving medium, factor provenance and uncertainty; reconcile paired handoffs without duplicating quantities/burdens."
      unit: "kg; m3; kWh; h; tkm; item; item-use"
      frequency: "Every lot/event/transfer; meter each operational interval"
      temporal_coverage: "Full reporting trip/season and relevant asset life; opening to closing stock including failed periods"
      site_scope: "Boat-supported SCUBA hand capture"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare/drain logs; paired signatures; actual receipt/live inspection; invoices/meters; stock and asset ledgers; factor provenance/uncertainty; discrepancy closure"
    - protocol_id: cp_condition
      process_id: "condition"
      flow_role: "Vessel primary evisceration and draining"
      record_type: "Primary node/lot/period ledger"
      raw_fields: "T_CC whole-animal intake; actual evisceration start/end and method; pre/post drain mass; T_CS prepared animal; removed viscera/body-fluid/free-water measurements; T_SM incidental remainder; direct abstraction volume/density; each treatment/direct-release destination; row/instance; lot/trip/season; asset/service period; opening/closing stock; allocated shares; U observations"
      collection_method: "Observe actual evisceration and measure whole input, eviscerated output, removed viscera/body fluid and free water across the same event; retain drain procedure/time rather than a default yield; close water/animal/incidental balances by fate. Use calibrated node measurements and native-unit meters/supplier records; retain each chemical identity, carbon origin, receiving medium, factor provenance and uncertainty; reconcile paired handoffs without duplicating quantities/burdens."
      unit: "kg; m3; kWh; h; tkm; item; item-use"
      frequency: "Every lot/event/transfer; meter each operational interval"
      temporal_coverage: "Full reporting trip/season and relevant asset life; opening to closing stock including failed periods"
      site_scope: "Vessel primary evisceration and draining"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare/drain logs; paired signatures; actual receipt/live inspection; invoices/meters; stock and asset ledgers; factor provenance/uncertainty; discrepancy closure"
    - protocol_id: cp_sort
      process_id: "sort"
      flow_role: "Sorting into actual destinations"
      record_type: "Primary node/lot/period ledger"
      raw_fields: "T_CS and T_SM receipts; actual grade/viability criteria; each grade/alternate-output quantity and receiver; active-hold proof with T_SH or evidenced absence with T_SP; residual incidental fate; actual abstraction volume/density; row/instance; lot/trip/season; asset/service period; opening/closing stock; allocated shares; U observations"
      collection_method: "Observe and weigh each declared grade and destination with its actual receiver/stock entry; record actual holding activation or proof of no intervention before assigning T_SH/T_SP; separate incidental organisms/substrate/water from animal grades. Use calibrated node measurements and native-unit meters/supplier records; retain each chemical identity, carbon origin, receiving medium, factor provenance and uncertainty; reconcile paired handoffs without duplicating quantities/burdens."
      unit: "kg; m3; kWh; h; tkm; item; item-use"
      frequency: "Every lot/event/transfer; meter each operational interval"
      temporal_coverage: "Full reporting trip/season and relevant asset life; opening to closing stock including failed periods"
      site_scope: "Sorting into actual destinations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare/drain logs; paired signatures; actual receipt/live inspection; invoices/meters; stock and asset ledgers; factor provenance/uncertainty; discrepancy closure"
    - protocol_id: cp_hold
      process_id: "hold"
      flow_role: "Bounded preservation intervention"
      record_type: "Primary node/lot/period ledger"
      raw_fields: "Actual intervention purpose/type/location; T_SH receipt time/viability; intervention start/end and meter intervals; actual cooling/aeration/water/material inputs; T_HP exit live status and drain weight; mortality/alternative destinations/open stock; actual abstraction volume/density; row/instance; lot/trip/season; asset/service period; opening/closing stock; allocated shares; U observations"
      collection_method: "Record intervention purpose and exact start/end, actual services and viability before/after; reconcile T_SH to T_HP plus alternative stock/output/mortality/water, including failed batches. Transit elapsed time alone is not a holding event. Use calibrated node measurements and native-unit meters/supplier records; retain each chemical identity, carbon origin, receiving medium, factor provenance and uncertainty; reconcile paired handoffs without duplicating quantities/burdens."
      unit: "kg; m3; kWh; h; tkm; item; item-use"
      frequency: "Every lot/event/transfer; meter each operational interval"
      temporal_coverage: "Full reporting trip/season and relevant asset life; opening to closing stock including failed periods"
      site_scope: "Bounded preservation intervention"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare/drain logs; paired signatures; actual receipt/live inspection; invoices/meters; stock and asset ledgers; factor provenance/uncertainty; discrepancy closure"
    - protocol_id: cp_present
      process_id: "present"
      flow_role: "Reusable tote presentation"
      record_type: "Primary node/lot/period ledger"
      raw_fields: "T_HP or T_SP receipt and branch evidence; tote ID/material/tare; lifetime use/throughput and return/breakage/replacement log; actual cleaning water/chemical/energy and treatment fate; T_PD animal net mass; actual abstraction volume/density; row/instance; lot/trip/season; asset/service period; opening/closing stock; allocated shares; U observations"
      collection_method: "Use individually identified tote use/return/cleaning records to attribute demonstrated lifetime service; weigh animals independently of tare and free water; reconcile T_PD and alternate lot/tote destinations. Use calibrated node measurements and native-unit meters/supplier records; retain each chemical identity, carbon origin, receiving medium, factor provenance and uncertainty; reconcile paired handoffs without duplicating quantities/burdens."
      unit: "kg; m3; kWh; h; tkm; item; item-use"
      frequency: "Every lot/event/transfer; meter each operational interval"
      temporal_coverage: "Full reporting trip/season and relevant asset life; opening to closing stock including failed periods"
      site_scope: "Reusable tote presentation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare/drain logs; paired signatures; actual receipt/live inspection; invoices/meters; stock and asset ledgers; factor provenance/uncertainty; discrepancy closure"
    - protocol_id: cp_deliver
      process_id: "deliver"
      flow_role: "All pre-receipt logistics and physical shore receipt"
      record_type: "Primary node/lot/period ledger"
      raw_fields: "T_PD receipt; every sea/road/tender/transfer/unloading leg before first physical shore receipt, load/distance/empty legs and service boundary; receiver/time/place signature; calibrated scale, tote tare and reproducible actual drainage at receipt; observed live/eviscerated/raw/never-frozen state; positive accepted net animal mass A; refused/other-destination/open stock; tote return; row/instance; lot/trip/season; asset/service period; opening/closing stock; allocated shares; U observations"
      collection_method: "Collect signed actual first shore-processor physical receipt, route and live-state observations; weigh positive A after the documented actual drain procedure and tote tare, separating rejected/different-destination lots. Include all earlier physical logistics regardless invoice or payer and verify complete-service component exclusions. Use calibrated node measurements and native-unit meters/supplier records; retain each chemical identity, carbon origin, receiving medium, factor provenance and uncertainty; reconcile paired handoffs without duplicating quantities/burdens."
      unit: "kg; m3; kWh; h; tkm; item; item-use"
      frequency: "Every lot/event/transfer; meter each operational interval"
      temporal_coverage: "Full reporting trip/season and relevant asset life; opening to closing stock including failed periods"
      site_scope: "All pre-receipt logistics and physical shore receipt"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare/drain logs; paired signatures; actual receipt/live inspection; invoices/meters; stock and asset ledgers; factor provenance/uncertainty; discrepancy closure"
  calculation_rules:
    - id: normalise_lot
      applies_to: "all inventory rows"
      rule: "For each row/instance divide its attributable native-unit quantity by positive A from cp_deliver; final accepted animal mass divided by itself is 1. Preserve native numerator units and independent internal transfer amounts. For derived direct releases, establish the raw release quantity and evidence under release_evidence_mode before this division."
      inputs:
        - "attributable quantity"
        - A
        - cp_deliver
      output: "quantity per 1 kg reference flow"
      source_ids:
        - mass-balance-identity
    - id: balance_and_attribution
      applies_to: "all inventory rows"
      rule: "Reconcile animal whole/eviscerated states and separately all water, incidental matter and removed viscera; opening stock plus receipts equals intended outputs plus waste/direct returns/releases plus closing stock, allowing only documented measurement uncertainty. Allocate period/assets by declared causal service or supported output shares before division by A."
      inputs:
        - "node ledgers"
        - stock
        - transfers
        - "service shares"
      output: "closed balances and attributable quantities"
      source_ids:
        - mass-balance-identity
    - id: release_evidence_mode
      applies_to: "condition_water_return; collect_capture_air_releases; collect_condition_marine_releases; collect_sort_returns; collect_hold_releases; collect_present_releases; collect_delivery_releases"
      rule: "For each actual direct-release instance, retain foreground_record/collected_record only when the raw release quantity is directly measured. If derived from fuel, concentrations, carbon composition or another activity record, use calculated_value/calculated_from_collection for that instance. Under its own collection protocol retain the explicit formula, factor and source/version where applicable, measured input records, substance/receiving-medium basis and uncertainty. Apply the stated attribution and reference-flow normalization once. Resolve the evidence branch before finalizing; missing method or supporting evidence remains incomplete, not zero. Existing foreground/collected metadata is the measured-branch template, not certification of calculated releases; no universal emission factor is supplied."
      inputs:
        - "Instance-specific measured records"
        - "formula and factor/source/version if calculated"
        - "node protocol"
        - "attribution and accepted A"
      output: "Release instance with method-consistent value/evidence metadata and traceable quantity"
