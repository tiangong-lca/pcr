validation_rules:
  - rule_id: eligible_reference
    applies_to: "reference_output"
    rule: "Verify A>0, species and wild Alaska SCUBA origin, observed live status at actual first physical shore-processor receipt, eviscerated raw never-frozen state, scale/tare/drain method and pre-separation gate. Any dead, whole, frozen or skin/muscle-only output is ineligible for A, though its burdens and fate remain accounted."
    source_ids:
      - adfg-dive-sea-cucumber
  - rule_id: reconcile_transfers
    applies_to: "all_nodes"
    rule: "Reconcile every paired transfer by lot, state, time and quantity; prove the holding activation/bypass state, account for incidental matter and free water, enumerate all intended destinations and distinguish treatment from direct release. Reject unexplained mass losses and duplicate final/internal exchanges. Unknown actual conditions remain incomplete rather than zero."
    source_ids: []
  - rule_id: complete_reporting_pool
    applies_to: "season_and_assets"
    rule: "Reconcile all trip/season inputs, failed batches, mortality, stocks, shared assets, tote cycles, replacement/retirement and cleanup with output allocation and sensitivity. Each complete service has a documented component-exclusion map; shares reconcile and no discarded material earns a credit."
    source_ids: []
  - rule_id: identities_and_ranges
    applies_to: "all_rows"
    rule: "Verify each final exchange concrete flow/property/unit against actual identity and role. collection scope rows must expand into actual instances; no inferred top-hit identity or generic pollutant match. Symbolic 0..U intervals explicitly lack empirical bounds; collect row/instance-specific observations and uncertainty before final data production. Checker pass does not establish identity verification or publication readiness."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable per-flow collection obligations and final exchanges"
    rule: "Final dataset completion and validation require every actual exchange to have an independent atomic card and its own quantity, property/native unit, collection or calculation evidence, range/uncertainty evidence, normalization, actual destination and verified UUID. Unknown identity, activity state, quantity, range evidence or fate blocks completion; it is never zero, a presumed bypass or permission to omit an obligation. Every important concrete flow retains its own range/uncertainty evidence collection duty; a symbolic upper bound is not an empirical range."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Foreground package, process and lifecyclemodel projections for the same live eviscerated wild SCUBA route/gate"
  allowed_use: "Evidence-matched Alaska wild A. californicus live eviscerated drained raw never-frozen supply at first physical shore receipt"
  excluded_use: "Whole-animal final mass, farm production, hookah route, processed skin/muscle, downstream post-receipt operations or unsupported current legal/environmental claims"
  required_metadata: "All reference qualifiers; reporting/asset periods; physical receipt record; upstream boundaries; output/stock/fate ledger; allocation/service exclusion map"
  required_quality_disclosure: "Observed eligibility; exact upstream identities; range/evidence gaps; representativeness; failed periods; balances; uncertainty and allocation/lifetime sensitivity"
  update_trigger: "Change of species/origin/SCUBA technology, evisceration method, actual receipt gate/state, holding/logistics route, service boundary, asset utilization or supported evidence"
data_sources:
  - id: "adfg-dive-sea-cucumber"
    type: "official_guidance"
    reference: "Alaska Department of Fish and Game, Commercial Sea Cucumber Dive Fisheries. https://www.adfg.alaska.gov/index.cfm?adfg=CommercialByFisheryDive.seacucumber"
    used_for: "Species, hand/SCUBA mesh-bag route and eviscerated-live shore delivery; no numerical defaults or legal advice"
  - id: "adfg-walker-dive-fisheries-2006"
    type: "literature"
    reference: "Walker S., Hoyt Z., Pritchett M. 2006. Report to the Board of Fisheries, miscellaneous dive fisheries. Fishery Management Report 06-01, pp. 8–9. https://www.adfg.alaska.gov/FedAidpdfs/Fmr06-01.pdf"
    used_for: "Historical mesh-bag/vessel, poking/draining, drained-weight/tote sequence and downstream separation exclusion; no historical limits, rates or holding durations adopted"
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, p. 52. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Narrower classification context and exclusions only; no product inventory rates"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation accounting and same-lot normalization identity, explicitly defined in this PCR; no external empirical factor"
    used_for: "Physical reconciliation and final A/A=1 identity only"
