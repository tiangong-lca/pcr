system_boundary:
  rules:
    - rule_id: scope_gate
      applies_to: "product_system"
      rule: "Include Alaska wild A. californicus boat-supported SCUBA hand collection, vessel evisceration/draining, actual sorting, bounded preservation when observed, tote presentation and every logistics leg until first physical shore-processor receipt. Capture removes a whole animal; conditioning makes the reference state. Neither invoices nor vessel ownership ends the boundary."
      source_ids:
        - adfg-dive-sea-cucumber
        - adfg-walker-dive-fisheries-2006
    - rule_id: physical_transfer
      applies_to: "all_nodes"
      rule: "T_CC whole animals and T_CM incidental matter pair capture to condition; T_CS prepared animals and T_SM residual incidental matter pair condition to sort; T_SH pairs sort to active hold, then T_HP to present; proven bypass T_SP pairs sort directly to present; T_PD pairs present to deliver. Each identifier has one physical quantity/state/time and paired output/input. Keep lot opening/closing stock and leakage reconciliation; unknown branch is a gap, not bypass."
      source_ids: []
    - rule_id: period_assets
      applies_to: "all_nodes"
      rule: "Use trip/lot batches inside a declared reporting season; enumerate active, failed and no-accepted-output trips, maintenance/cleanup, opening/closing animal stock, tote cycles, vessel/dive/compressor/holding assets, replacement and retirement periods. Link each event and asset to all consuming nodes and service periods; absence of a claimed intervention needs records. Do not prescribe asset lifetimes."
      source_ids: []
    - rule_id: fate_boundary
      applies_to: "all_nodes"
      rule: "Track actual intended animal grades and useful by-products separately at every node. Discarded viscera/body fluid, animal mortality, incidental matter and cleanup require actual destination: treatment waste or identified direct environmental return/release. Returned carrier water is separate from pollutants; purchased water is separate from abstraction. No avoided-burden, restoration or natural-feeding credit is implied."
      source_ids: []
    - rule_id: outside_gate
      applies_to: "downstream"
      rule: "Exclude shore-processor holding and muscle/skin separation after first physical receipt, cooking, drying, freezing and later distribution/use. Existing wild stock growth has no invented aquaculture feed/seed burden; actual purchased same-category animal inputs need separate verified upstream datasets and must not masquerade as this wild-capture reference."
      source_ids:
        - adfg-dive-sea-cucumber
