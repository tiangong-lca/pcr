validation_rules:
  - rule_id: selection
    applies_to: "reference_product"
    rule: "Verify Haliotis rubra, natural wild reef origin, hookah hand-removal route and actual alive/whole/native-shell state at first physical acceptance; any excluded species/state/route/gate fails selection. No universal legal limit, food-safety or sustainability certification is conferred."
    source_ids:
      - nsw-abalone-fishery
      - vfa-abalone-fishing
      - narooma-live-blacklip
  - rule_id: mass
    applies_to: "reference_product"
    rule: "Verify accepted wet net animal mass includes native shell, viscera and animal tissue/water but excludes free transport water, packaging, ice and removable foreign growth/debris. Preserve raw regulatory catch-weight records separately with their actual included growth; never silently substitute them for this LCA mass convention."
    source_ids: []
  - rule_id: air
    applies_to: "capture"
    rule: "Hookah air quantity, compressor fuel/electricity and support-vessel operation must reconcile. Never bind breathing air or dissolved oxygen to industrial oxygen, never use fresh-water capture diesel as a marine supply proxy, and never infer oxygen/fuel amounts from a UUID."
    source_ids:
      - vfa-abalone-fishing
  - rule_id: ownership
    applies_to: "all_nodes"
    rule: "Every measured/calculated card uses its own node protocol. Require unique physical-event ownership, full-period stocks/zero-output events, all actual output handoffs, paired animal/water/waste transfers, and reviewed shared-asset/period/output attribution with no supplier-inclusive duplication."
    source_ids: []
  - rule_id: ranges
    applies_to: "all_inventory_rows"
    rule: "Each nonreference card has its own independent U_row_id evidence need, not a numeric default or valid empirical guardrail. Obtain a reviewed independent comparable dataset/physical constraint, approve the row-specific upper bound before use and replace reasoned_estimate evidence. When an umbrella expands into multiple actual exchanges, assign each instance a unique row id and independently evidenced U_instance; neither a parent-card U nor a combined cap may stand for all instances. A batch cannot validate itself by its own maximum. Unknown bounds block quantitative finalization, not imply zero."
    source_ids: []
  - rule_id: identities
    applies_to: "all_inventory_rows"
    rule: "Resolve and detail-confirm each concrete exchange, property/unit and actual qualifiers before final TIDAS construction. Conditional umbrella cards instantiate separate actual exchanges with their own identities and units; mass-only display is not permission to convert unknown services to kg. An unresolved candidate reference is not publication readiness."
    source_ids: []
  - rule_id: emissions
    applies_to: "all_nodes"
    rule: "Direct emissions require specific substance, cause, fossil/biogenic basis where relevant, amount method and receiving compartment. CO2 fixed identity is only unspecified-air fossil combustion; no generic exhaust, respiration, supplier emission or wastewater bulk may inherit it. Treatment outlet and contaminant mass are owned once."
    source_ids: []
  - rule_id: representation
    applies_to: "all_sections"
    rule: "Bilingual meanings, ordered row/rule/protocol ids, measurement constants, ranges, sources and UUIDs must align with the current generated projection. Report unresolved evidence and inactive conditional operations explicitly; neither checker success nor a mapped classification resolves them."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all applicable collection requirements and concrete inventory exchanges"
    rule: "Resolve every applicable section-8 collection requirement into individual physical/chemical exchanges with their own quantities, native units, composition/state, range basis or explicit uncertainty evidence, raw records, normalization, actual destinations/receiving media and verified compatible UUIDs. Any unresolved applicable requirement makes the final dataset incomplete and validation fails; unknown is not zero. Never copy aggregate amounts onto components or duplicate inclusive services with owned fuel/electricity/direct releases. Internal transfers are not fixed to the final 1 kg."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package; secondary_dataset; background_dataset"
  downstream_use: "Completed verified package may project to process/lifecyclemodel for downstream matching state/gate"
  allowed_use: "Attributional records only for this species/wild hookah/live-whole first-acceptance scope; instantiate actual conditional operations"
  excluded_use: "Farming, other species/routes, dead/shucked/frozen goods, later buyer operations, food-safety/legal/sustainability certification, or final exchanges with unknown U/UUID"
  required_metadata: "All reference qualifiers, geography/periods, nodes/conditions, mass basis, asset/service boundaries, attribution and data provenance"
  required_quality_disclosure: "Coverage/calibration, missing/estimated data, stocks/losses, attribution sensitivity, independent upper-bound evidence and unresolved identities; classification mapping is not publication readiness"
  update_trigger: "Changes to species/origin/route/gate, operations/assets/services/periods, factors/identities or independent range evidence"
data_sources:
