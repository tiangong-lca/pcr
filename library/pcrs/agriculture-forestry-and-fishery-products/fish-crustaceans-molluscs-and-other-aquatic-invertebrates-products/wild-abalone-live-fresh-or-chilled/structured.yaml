system_boundary:
  rules:
    - rule_id: scope
      applies_to: "all_nodes"
      rule: "Use only wild Haliotis rubra hand-removed from natural rocky reef by hookah with surface-supplied breathing air, alive and whole at first physical acceptance. No hatchery/reseeding/ranching, farmed supply, scuba/free-dive substitution, shucking, cooked/frozen/dead reference, or processor/live-export operations after acceptance."
      source_ids:
        - nsw-abalone-fishery
        - vfa-abalone-fishing
    - rule_id: gate
      applies_to: "handover"
      rule: "The gate is first HARVESTER physical recipient acceptance, not invoice date, title transfer or processor dispatch. Include the full capture-vessel return in capture and actual subsequent harvester shore movement in handover exactly once; exclude buyer activities after acceptance."
      source_ids: []
    - rule_id: operation_responsibility
      applies_to: "all_nodes"
      rule: "Direct foreground operation/resource responsibility is independent of legal asset ownership. Rented or contracted equipment under foreground operational/resource control is inventoried directly; a supplier-inclusive service is linked once and must not receive duplicate supplier fuel, emissions or capital."
      source_ids: []
    - rule_id: actual_nodes
      applies_to: "prepare; preserve; present; handover"
      rule: "Conditioning is only actual external debris removal/washing, distinct from capture and live preservation. Preserve owns any actual harvester live-preservation intervention after capture and before first physical acceptance outside actual delivery transportation, including onboard unsorted holding and holding after presentation. It may overlap preparation, sorting or presentation. These nodes are a responsibility graph, not a forced serial chronology; use real time-indexed instances, before/after states and actual handoffs. Same-activity phases without a real handoff remain subledgers, never duplicate animal transfers or inherited burdens. Handover alone owns actual delivery-transport live support. Presentation owns packaging/protection, not distribution. No mandatory depuration, growth, feeding or readiness-to-eat certification. Bypass inactive nodes according to actual records."
      source_ids: []
    - rule_id: stocks_periods
      applies_to: "all_nodes"
      rule: "Index trips, batches, calendar/reporting periods, animal/water/fuel stocks and capital phases. Retain departure, search, unsuccessful trips, returns, idle/support events, cleaning/changeover, carryover, repairs and termination. Zero accepted output never erases physical events or creates division by zero."
      source_ids: []
    - rule_id: water
      applies_to: "all_nodes"
      rule: "Only environmental intake is elementary uptake; supplied water is product input. Pair actual cross-node usable-water transfers as product output/input and contained wastewater transfers as waste output/input. Same-node recirculation and stock motion stay in subledgers. Final treatment owner records environmental water outlet and substance-specific emissions once."
      source_ids: []
    - rule_id: material_card_precedence
      applies_to: "all_nodes"
      rule: "Each actual material issue/event is instantiated once under the most specific applicable card: preserve_holding_supplies for non-transport preservation consumables and present_packaging for packaging take precedence over generic materials. Generic materials contain only the remaining actual issues. Support asset records retain capital/reusable life phases and replacements without re-charging the same consumable/event already recorded elsewhere. The same coolant issue cannot appear simultaneously as holding supply, generic material and asset consumption."
      source_ids: []
    - rule_id: wild_ecology
      applies_to: "capture; sort"
      rule: "Natural animal growth and feeding before wild capture are not foreground aquaculture. Record species-specific catch/removal, live returns/dead discards, reef/contact location, gear loss and actual habitat effects as ecological evidence; do not invent an elementary capture-biomass UUID, zero-bycatch claim or sustainability credit."
      source_ids:
        - nsw-abalone-fishery
        - vfa-abalone-fishing
    - rule_id: recursive_inputs
      applies_to: "all_nodes"
      rule: "Reference animals must be traceable wild hookah catch, not purchased same-category animals. Purchased same-category animals are a selection failure, not a recursive shortcut; genuine ancillary supplies require independently bounded upstream datasets with no duplicated foreground operations."
      source_ids: []
