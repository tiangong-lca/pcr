      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `physical_first` | all_nodes | First retain a complete unallocated physical event ledger by unique event/node/period, including every input/output/stock/loss and zero-output event. Only then apply documented output attribution; allocated quantities must never be used to claim physical mass-balance closure. |  |\n| `outputs` | sort; support | Enumerate all independently intended live grades/retained other catch and actual useful recovery outputs, each with independent handoff. Avoid allocation by separate measured operations first; for inseparable burdens justify causal physical attribution from current records, and use economic attribution only when physical relation is not supportable and contemporaneous prices/uncertainty are disclosed. No default mass fraction, price or substitution credit. |  |\n| `nonproducts` | all_nodes | Discard, dead/rejected waste, incidental debris, internal feed and the same lot at successive handoffs are not automatically co-products. Keep their quantities and treatment in the physical ledger and associated burdens with intended outputs under the reviewed attribution decision. |  |\n| `shared_assets` | support | For each real shared vessel, hookah, tank, container or service list every consuming node and period, actual utilization/idle phases, manufacture, maintenance/replacement, loss and end-of-life. Allocate once using justified service/use records; retain full life-phase and remaining/terminated share reconciliation. A single consumer is not fabricated into shared infrastructure. No assumed lifetime or annualization. |  |\n| `transfers` | all_nodes | Match physical animal, usable-water and residual transfers before attribution. Carry inherited lot burden once to its actual destination, never re-buy an internal input or count internal output as final. Separate reporting-period stock carryover from new catch and retain explicit ownership of treatment and loss events. |  |\n| `normalization` | all_nodes | After physical reconciliation and reviewed attribution, divide attributable exchange quantity by accepted net reference animal mass of the same covered lots. Reconcile actual losses and transferred stock; do not force intermediate animal feeds to 1 kg. Retain/resolve zero-output periods explicitly before forming a positive-output reporting denominator. | mass-normalization-identity |\n\n"
